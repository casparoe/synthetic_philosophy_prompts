answer: |-
  Plain-words glossary
  Panpsychism: The view that mind is fundamental to matter, existing even in atoms.
  Subject: The "someone" having an experience.
  Experience: What it feels like from the inside, like redness or pain.
  Grounding: One fact holding because another fact holds, like bricks grounding a wall.
  Emergence: New stuff appearing when parts combine, like wetness from water molecules.
  Proto-experiential: Properties that are not quite experience but the raw material for it.
  Illusionism: The view that consciousness isn't real, it just seems like it is.
  Cosmos-first: The view that the universe is the primary subject, not us.

  The tree
  Start at the top with the Anaesthesia Case. When you go under, does the subject vanish completely or just pause? If you say it vanishes because it was never really there to begin with, you land on Illusionism. If you say it pauses, move down.

  Next, ask: Are the little bits subjects? If you say no, there are experiences but nobody having them, you land on Drop-subjects. If yes, move down.

  Now, Is the big subject fundamental? If you say the universe is the main mind and we are just modifications of it, you land on Cosmos-first. If you say the big subject is built from little ones, move down.

  Ask the Stadium Case. Do fifty thousand card-holders sum to a picture? If you say the big experience is grounded in the little ones but not composed of them, you land on Grounded not composed. If you say they literally compose the big picture, move down.

  Ask: Are the little bits fully experiential? If you say they are only proto-experiential precursors that combine into real feeling, you land on Proto-experiential. If you say they are already tiny experiences, move down.

  Ask the Split-brain Case. Sever the hemispheres. Do the little subjects fuse into one? If you say they actually bond or merge to create unity, you land on Fusion. If they remain distinct but build a whole, move down.

  Finally, ask the Slow Replacement Case. Swap neurons for chips. Does the experience fade gradually? If yes, the big experience is built continuously out of the little ones, landing on Straight micro-level panpsychism. If no, if the experience winks out or pops in at a threshold, you land on Brute fact emergence. Every path ends at a leaf.

  What each leaf is stuck with
  Illusionism denies the very data we are trying to explain, making the problem disappear by denying the evidence.
  Drop-subjects leaves experiences floating free without an owner, which feels grammatically and metaphysically wrong.
  Cosmos-first struggles to explain why we feel like separate subjects rather than just one big universal mind.
  Grounded not composed claims the big fact exists because of the little ones but refuses to say how, which looks like hiding.
  Proto-experiential asks us to imagine a kind of feeling that isn't actually feeling, which is notoriously difficult to conceive.
  Fusion violates the strong intuition that subjects are private and cannot merge into one another without dying.
  Straight micro-level panpsychism solves the origin of experience but leaves the combination problem completely unsolved.
  Brute fact emergence makes consciousness look like magic, appearing suddenly from non-conscious parts without a bridge.

  Empty seats
  First, consider Illusionism combined with Cosmos-first. This seat is empty because it is incoherent. You cannot claim the universal mind is fundamental while simultaneously claiming that conscious experience is an illusion. One says mind is real and basic, the other says it is fake.

  Second, consider Drop-subjects combined with Fusion. This seat is empty because it is contradictory. Fusion requires subjects to merge, but Drop-subjects denies there are any subjects to begin with. You cannot fuse entities that you have already declared do not exist.

  Third, consider Straight micro-level combined with Brute fact emergence. This seat is empty because it is unattractive. Straight micro-level insists on continuous building, while Brute fact insists on a sudden pop. Holding both means saying the build is continuous until it suddenly isn't, which offers no explanatory advantage over just picking one.

  Where the tree gives out
  The tree cannot tell apart Straight micro-level panpsychism and Grounded not composed. Both say the little bits determine the big experience without magic. The difference is merely metaphysical labeling about whether "composition" is the right word. In practice, both face the same combination problem and offer the same predictions about brain structure.

  The tree also struggles to separate Proto-experiential and Straight micro-level. If proto-experience is indistinguishable from tiny experience, the views collapse. If it is distinguishable, we cannot describe it. The branch question relies on a distinction that might not exist in reality, making the leaves functionally identical for a pub discussion.

  Where my committee idea lands
  Your committee model lands on Grounded not composed. You say the company is real in a "thinner way" than the employees, which matches the idea that the macro fact is grounded in the micro facts without being a extra composed object. You avoid adding a new subject, just as the company adds no new person.

  However, you still owe us an explanation of the headache. If the committee is just a structure of decisions, who feels the pain? Grounding explains the contract, but pain requires feeling. You need to explain why this specific functional structure generates a qualitative feel rather than just silent decision-making. Until you solve that, your committee is a zombie company.
