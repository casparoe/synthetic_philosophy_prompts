  This raises the boundary rigidity problem. Is the partition choice arbitrary? If the boundary is chosen to maximize posterior confirmation for a preferred model, the update is circular, presupposing the prior weights JC aims to update. However, the boundary need not be arbitrary if fixed by the likelihood function alone. The intersection point of the likelihood curves for A and B represents an objective indifference point where the data supports neither model over the other. Using this likelihood-ratio intersection to define the partition cells removes prior dependence. The partition becomes a feature of the experimental setup and physical models, not the agent's belief state.

  Consequently, does this undermine JC's claim to generalize Bayes? Only partially. Bayes rule handles continuous likelihoods directly without partitioning, avoiding the boundary issue entirely. JC requires discretization to function. If the discretization rule is external to the epistemology (provided by physics), JC remains valid but less self-contained than Bayes. If the epistemology must supply the partition, JC faces a regress problem. Thus, JC is a generalization of Bayes regarding uncertainty, but not regarding continuous evidence structures. It relies on a pre-existing categorization that Bayes rule bypasses via likelihood ratios.

