answer: |-
  Consider two genetically identical populations, Northtown and Southtown, assessed on a standardized cognitive score where genetic differences typically explain most individual variation. Both towns share the same distribution of cognitive-related genes, yet Northtown averages 15 points higher than Southtown solely because Southtown's water supply has a higher mean concentration of lead, although within each town, individual lead exposure varies significantly due to differences in household plumbing, contributing nontrivially to the variance in scores within both populations. Despite this within-town environmental variation, genetic differences remain the dominant source of variance within each town because the range of genetic potential outweighs the range of local lead exposure, yielding high heritability estimates in both locations even though the entire 15-point mean gap is caused exclusively by the difference in average water lead levels.

  (a) Heritability is high in each population because, within the specific context of each town, the variance in genetic potential ($V_G$) is substantially larger than the variance in lead exposure ($V_E$), meaning individual differences are mostly predicted by genetics even though environment matters. (b) The between-population difference is nonetheless environmental because the mean genetic value is identical across towns ($\Delta G = 0$), while the mean environmental exposure differs substantially ($\Delta E \neq 0$), making the shift in averages purely a function of the water quality. (c) The structural feature trapping the inference is the **within-group variance of the causal environmental factor**; by ensuring lead exposure varies within both groups, the scenario blocks the objection that "environments are distinct/non-overlapping," forcing the critic to acknowledge that environment contributes to within-group variance while still confronting the false intuition that high within-group $h^2$ implies genetic causation for between-group means. (d) If the environmental factor affected only the between-population mean (zero within-variance), the case would remain logically valid (heritability would be 1.0 within), but it would be less forceful; it would invite the standard critique that human groups rarely experience uniform environments, whereas the current scenario mimics real-world heterogeneity, making the dissociation between variance ratios and mean differences harder to dismiss.
