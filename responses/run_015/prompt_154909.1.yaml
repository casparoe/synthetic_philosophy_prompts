  #### 1. The "Symbolic Substrate" Rule (Strict Hofstadter)
  *   **The Rule:** Mind is a pattern of symbol manipulation. If the low-level units (ants) are mindless and the high-level pattern (colony) processes information, makes decisions, and can misrepresent the world, it is a mind. Substrate history doesn't matter; current topology does.
  *   **Fits:** Single Ant (No), Bee Swarm (Yes), Slime Mold (No - no symbols), Colony Budding (Yes - pattern splits).
  *   **Fails:** Corporation (Yes - but she said No), LLM (Yes - but she said No).
  *   **Prediction for Graft:** **One Mind.** The trail network is unified; the symbol system is singular.
  *   **Likelihood:** **Low.** She has already rejected this rule twice (Corporation, LLM) by adding extra-biological constraints.

  #### 2. The "Autopoietic Closure" Rule (The Stakes Test)
  *   **The Rule:** A mind must generate and maintain its own boundaries and goals. If the unity of the system depends on an external agent (a human, a contract, a power cord), it is not a mind; it is a tool or a puppet.
  *   **Fits:** LLM (No - human maintained), Corporation (No - contract maintained), Termite Mound (No - evolutionary crystal, not real-time closure).
  *   **Fails:** Bee Swarm (Yes - self-organized), Budding (Yes - self-splitting).
  *   **Prediction for Graft:** **None.** The "perfume" is an external life-support system for the colony's identity. Without the grad student, the "mind" dissolves into civil war. It has no *self*-stakes, only *experimenter*-stakes.
  *   **Likelihood:** **Medium.** This fits her "LLM" and "Corporation" comments perfectly.

  #### 3. The "Teleological Lineage" Rule (The Darwinian Test)
  *   **The Rule:** Intentionality ("aboutness") derives from evolutionary history. A unified mind requires a unified evolutionary fate (a single reproductive future). If the underlying agents (or lineages) have divergent ultimate goals, they cannot form a single "I," even if they cooperate.
  *   **Fits:** Corporation (No - divergent human goals), Budding (Two minds - divergent lineages), Single Ant (No - no reproductive agency).
  *   **Fails:** Bee Swarm (Yes - single queen/destiny).
  *   **Prediction for Graft:** **Two Minds.** Two genomes = two evolutionary fates. The cooperation is tactical, not ontological.
  *   **Likelihood:** **High.** This is the only rule that reconciles the "Budding" verdict (lineage defines identity) with the "Corporation" verdict (divergent goals prevent unity).

  ### Which Rule Is She Running?
  She is most likely running **Rule 3: The Teleological Lineage Rule**, possibly hybridized with Rule 2.

  The "Budding" verdict is the smoking gun. A pure functionalist (Rule 1) would say that if the pattern splits, the *type* of mind is preserved, but the *token* identity is tricky. By explicitly saying "two minds," she anchors identity in the **causal history of the lineage**.

  Furthermore, her rejection of the Corporation ("decisions of people who could walk away") maps perfectly onto the Lab Graft. In the Corporation, the "people" are humans with exit rights. In the Graft, the "people" are the **genomes**, and they have "exit rights" (they would fight if the perfume stopped). The perfume is just a gag order; it doesn't merge the selves.

  ### The Discriminating Case

  You need a case that separates **Lineage** (Rule 3) from **Closure** (Rule 2).
  *   If she cares about **Lineage**, she will count minds based on genomes.
  *   If she cares about **Closure**, she will count minds based on who maintains the boundary.

  **The Case: The Natural Polygynous Merger**
  Find a species of ant (e.g., *Formica exsecta* or certain *Crematogaster*) where two unrelated colonies **naturally** merge in the wild without human intervention, forming a single reproductive unit (polygyny) with a shared future.

  *   **Setup:** Two wild colonies, different genomes, merge voluntarily. No grad student, no synthetic perfume. They share brood care, foraging, and defense. They reproduce as a single unit.
  *   **Why it works:**
      *   **Rule 3 (Lineage) predicts: Two Minds.** The genomes are still distinct, even if they cooperate. (Like a marriage vs. a single person).
      *   **Rule 2 (Closure) predicts: One Mind.** The system is self-maintaining, has unified stakes, and no external "perfume" is propping it up.
      *   **Rule 1 (Pattern) predicts: One Mind.** The topology is unified.

  **How to spring it:**
  > "Okay, what about *Formica* ants? In the wild, unrelated colonies sometimes merge naturally and co-exist with multiple queens, no human perfume needed. They act as one, reproduce as one, maintain themselves as one. But the genomes stay distinct. Is that one mind that learned to share, or two minds that decided to room together?"

  *   If she says **One Mind**: She is a **Closure** theorist (Rule 2). The Lab Graft was "None" because of the human, not the genomes.
  *   If she says **Two Minds**: She is a **Lineage** theorist (Rule 3). The Lab Graft was "Two Minds" because of the genomes, not the perfume.

  This forces her to admit whether the "perfume" (external agency) or the "genomes" (internal teleology) was the dealbreaker in your original Lab Graft scenario.
