answer: |-
  The normative tagging model offers a genuine psychological distinction in how decisions are made, but it does not avoid your core objection because it still relies on the shadow of the future to make those norms evolutionarily stable.

  Your intuition about the "changed game" is spot on. In a true one-shot scenario, cooperation is mathematically suicidal. The iterated version isn't just the same game played twice; it is a new ecosystem where the value of a reputation exists. When you add the possibility of future interaction, you fundamentally alter the payoff matrix, making defection no longer the dominant strategy. You aren't making a category mistake; you are identifying the actual condition required for cooperation to exist.

  The difference between strategic calculation and normative tagging is like the difference between doing calculus every time you merge onto a highway versus just having a driving habit. Strategic calculation requires counting moves and discounting future value, which is mentally expensive and fragile. Tagging is a heuristic: "This person is one of us, so I cooperate." It saves brainpower, reacts faster, and feels like morality rather than math. This is a real distinction in mechanism, even if the outcome looks the same.

  However, this tagging system doesn't solve the one-shot dilemma. If you take a community built on normative tagging and force them into anonymous, one-time interactions, the tagging system eventually breaks down unless the agents are irrational. The norms evolve because cooperators survive better over time, not because they win the single round. The tagging rules themselves are selected for based on long-term success, meaning they are still parasitic on the iterated structure.

  So, you aren't wrong to feel that standard explanations gloss over this. Cooperation doesn't evolve *in* the Prisoner's Dilemma; it evolves by building structures like iteration and norms that transform the dilemma into a different game where cooperation wins. The tagging model explains how we navigate that new game efficiently, but it doesn't change the fact that the original one-shot incentives remain hostile to cooperation.
