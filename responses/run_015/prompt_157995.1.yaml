answer: |-
  ### (1) Brief Conceptual Mapping

  We map "material object" to a heap-allocated memory region managed by a runtime. The "clay" corresponds to the raw data buffer, mutable and subject to allocation policies. The "statue" corresponds to a typed view or handle enforcing structural invariants on that buffer. "Identity" splits into reference equality (pointer address) and structural equality (content hash). "Time" is modeled as the execution trace or version history of state transitions. "Existence" corresponds to reachability from root sets in garbage collection. "Constitution" is the relationship between buffer allocation and type enforcement. This framework treats metaphysical persistence as lifecycle management and material overlap as shared storage access.

  ### (2) Translation of the Four Positions and the Injected Variant

  **The Coincidence View**
  In this model, the statue and the clay are distinct heap objects that share the same underlying memory buffer. Imagine two distinct reference handles, `statue_ref` and `clay_ref`, pointing to the same address. However, the runtime treats them as numerically distinct instances, perhaps maintaining separate reference counts or lifecycle policies. They share all state values at every clock cycle, yet they are separate entities in the type system. If the `statue_ref` is deallocated, the `clay_ref` might remain valid, implying distinct existence despite shared storage. This mirrors aliasing where two variables are not merely synonyms but distinct objects constrained to synchronize state perfectly.

  **The Strict-Identity View**
  Here, there is only one heap allocation. "Statue" and "Clay" are interface types implemented by the same concrete class. Casting a reference from `IStatue` to `IClay` changes the static type checking but does not alter the runtime pointer or create a new object. There is no distinction in the heap; the difference is purely syntactic sugar in the type system. Any mutation via the clay interface is immediately visible via the statue interface because they are the same memory location. Identity is reference equality; since there is one reference, there is one object.

  **The Temporal-Parts Solution**
  This view models objects as immutable versioned data structures, akin to event sourcing or persistent trees. The object is not a mutable buffer but a log of state transitions. The "Statue" is a specific projection of this log, valid only over a sequence of commits where shape invariants hold. The "Clay" is a broader projection over a longer sequence. They share a common prefix of the version tree (the time they coexist) but diverge when a "crushing" event is committed. The statue branch terminates; the clay branch continues. Identity is defined over the entire spacetime worm (the full log), not just the current state.

  **The Dominant-Kinds Solution**
  The object carries a runtime type tag determining its behavior upon mutation. When a `deform()` method is invoked, dynamic dispatch checks the tag. If the tag is "Statue," the method throws an exception or triggers deallocation, enforcing the invariant that statues cannot survive deformation. If the tag is "Clay," the mutation proceeds. The dominant kind determines which lifecycle policy executes. The object is singular, but its persistence conditions are governed by the highest-priority sortal tag currently active in its metadata.

  **The Injected Variant: Continuous 3D Printing**
  Suppose the material substrate is fully replaced over any interval, governed by a printing schema.
  1.  **Persistent Schema:** Identity is preserved via a capability token. The underlying memory address changes continuously as pages are swapped, but the handle remains valid as long as the schema validates. Identity is logical, not physical.
  2.  **Version Tree:** Each material replacement is a new commit. The "Statue" is a branch merging these commits. Identity is a chain of commits, not a static buffer.
  3.  **GC/Realloc:** Old memory is freed, new memory allocated. Identity is preserved only via an indirection layer (a handle object); otherwise, it is a new allocation inheriting the same interface. This models the tension between physical replacement and logical continuity.

  ### (3) Residue Report: Fidelity, Untranslatable Residue, and Diagnostic Verdict

  **Fidelity of Translation**
  Several philosophical claims translate cleanly into programming vocabulary. The Coincidence View maps robustly to aliasing with distinct lifecycle policies, preserving the intuition that two things can occupy the same space yet have different fates. The Strict-Identity view corresponds precisely to subtyping and interface casting, where distinction is merely perspectival. The Temporal-Parts solution finds a near-perfect analog in immutable data structures and version control, where objects are histories rather than states. These translations preserve the logical structure of the arguments without loss, demonstrating that the metaphysical relations are isomorphic to semantic relations in mutable-state systems.

  **Untranslatable Residue**
  However, "numerical distinctness without qualitative difference" has no expression in standard software frameworks. In programming language theory, if two references point to the same memory and exhibit identical behavior, they are semantically identical. Metaphysics allows for distinctness here (haecceity), but PLT collapses this into identity. Additionally, "existence" in metaphysics is often absolute, whereas in software, it is relative to the garbage collector's root set. An object exists only if reachable. This relativity reveals a limitation in the programming vocabulary: it cannot model existence independent of access paths. This suggests the original philosophical claim about distinctness may be less precise than it appears, relying on intuitions not formalizable in state-based semantics.

  **Diagnostic Verdict**
  The continuous-replacement variant illuminates the statue/clay problem by shifting focus from static overlap to persistence conditions. It substitutes ambiguity about "matter" with ambiguity about "memory management policies," which is clarifying. It forces a choice: is identity tied to the memory address (the clay) or the schema validation (the statue)? This variant shows that the core conflict is not about stuff versus shape, but about whether identity is defined by physical storage or logical invariants. It does not merely substitute one ambiguity for another; it isolates the specific semantic mechanism—lifecycle management—where the disagreement lies.

  ### (4) Bottom Line

  A software engineer should conclude that the statue/clay debate is largely about the limits of identity predicates in mutable-state descriptions, not genuine ontology. The disagreement arises from choosing different semantics for the `==` operator: does it compare memory addresses or structural invariants? The metaphysical tension maps directly to type-system design choices regarding mutability and lifecycle management. Therefore, the problem is not about what exists in the world, but about how we define persistence conditions in systems where state changes over time. The debate is semantic, not ontological.
