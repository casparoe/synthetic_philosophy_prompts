  **Technical Bulletin 442-B**
  **Office of Ontological Metrology**
  **Date: 14 October 2023**
  **Subject: Certification of Fundamentality Rank and Grounding Relations**

  **1.0 General Provisions**
  Effective immediately, the Office accepts submissions for the certification of Fundamentality Rank and the validation of Grounding Relations between submitted facts. Applicants must submit Form OOM-101 in triplicate. All submissions are subject to regulatory review. Failure to declare the direction of dependence will result in automatic rejection.

  **2.0 Hyperintensional Specificity**
  Applicants must distinguish between necessarily equivalent formulations. Substitution of co-referential descriptions voids the certificate. For example, asserting that water is H2O differs from asserting that water is water. A Reformulation Surcharge applies if corrections are required after initial filing. The Office does not recognize logical equivalence as grounds for fee reduction.

  **3.0 Exclusion of Empirical Methods**
  Grounding is non-causal. Spectroscopic analysis, diffractometry, and causal detection methods are strictly inadmissible. The Office insists it measures ontological dependence without physical interaction. Applicants claiming empirical evidence will be referred to the Department of Redundant Physics. Please note that the absence of detection equipment does not imply the absence of measurement.

  **4.0 Structural Integrity**
  Grounding relations must be asymmetric and irreflexive. No fact may ground itself. Loops are declared void and subject to penalty. Chains must terminate at a fundamental level. A Compliance Officer is assigned to verify termination. If chains do not terminate, the applicant must file a Regress Waiver acknowledging the infinite nature of the submission.

  **5.0 Grounding of Grounding Facts**
  Every certified grounding relation constitutes a fact requiring its own grounding certificate. Applicants may opt for Deferred Certification. This deferral incurs a per-link administrative fee that never quite ends until the chain terminates. Applicants are advised that termination is not guaranteed within the fiscal year.

  **6.0 Purity Requirement**
  Facts about derivative entities must be grounded in facts about fundamental entities. The converse is prohibited. Applications suggesting fundamental facts depend on derivative ones will be rejected for impurity. Cross-level contamination invalidates the entire hierarchy.

  **7.0 Metaphysical Category Declaration**
  Applicants must declare whether grounding is a Relation or an Operator. Please check the appropriate box. Note that the choice makes no difference to the fee structure or the outcome of the certification. The Office remains neutral on the grammatical category of dependence.

  **8.0 Ontological Commitment**
  Derivative entities are nothing over and above the fundamental ones. In accordance with this principle, the charge for the existence of derivative entities is zero. Fees apply only to the relation connecting them. Applicants should not expect a refund for entities found to be redundant.

  **Schedule of Fees**
  Initial Fundamentality Rank Certification: $450.00
  Grounding Relation Validation (per pair): $120.00
  Hyperintensional Reformulation Surcharge: $75.00
  Regress Waiver (Per Link): $50.00
  Existence of Derivative Entities: $0.00
  Purity Violation Review: $200.00

  **Public Notice: Letter of Complaint**
  *From the Association for the Replacement of Grounding by Identity, Causation and Law*
  To the Office of Ontological Metrology:
  We represent a consortium of consumers who have purchased your grounding services. We object to the billing. We requested an explanation for why certain facts obtain. Your service certified that fact A obtains in virtue of fact B. However, upon inspection, this service did no explanatory work beyond stating identity, causal, or nomological facts which we already possessed. We have been billed for a service that did nothing. We request a full refund of the Regress Waiver fees.

  **Administrative Footer**
  **Status of Technical Bulletin 442-B:**
  **Certification of Bulletin Fundamentality:** Deferred Indefinitely.
  **Fee:** $0.00 (Pending Resolution of Meta-Grounding Status).
