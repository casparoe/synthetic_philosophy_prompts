answer: |-
  ### 1. The Yes-Case: DNA as High-Specificity Input Tape

  In this view, the DNA tape is the primary carrier of Shannon information because it exhibits high causal specificity relative to the background machinery. Even though the interpreter (ribosome/tRNA/enzymes) is rebuilt from the tape every cycle, the *state* of the interpreter is homeostatically stabilized. The machinery acts as a fixed runtime environment over the timescale of a single build (organism development).

  Within this stable runtime, changing the tape (mutation) changes the output (phenotype) predictably, while changing the background chemistry (within viable limits) often does not. Therefore, the differential information required to select one phenotype over another resides predominantly in the tape sequence. The mapping from codon to amino acid is treated as a fixed ISA (Instruction Set Architecture). The fact that the interpreter is compiled from the tape is viewed as a bootstrap problem that was solved once at the origin of life; currently, the system maintains a stable compiler binary via feedback loops. Thus, "information" is valid because there is a reliable, many-to-one mapping from tape sequences to functional outputs that persists across generations, allowing for error correction (proofreading polymerases) and compression (introns/splicing).

  ### 2. The Skeptical Case: The Self-Hosting JIT with No Spec

  This view argues that calling DNA a "code" smuggles in a separation between data and machine that does not exist. In your terms: this is a self-hosting JIT where the JITter source is part of the payload, and there is no static binary underlying the process. The "interpreter" (cellular machinery) is not a fixed runtime; it is dynamic state that varies wildly between cells, tissues, and environments.

  Because the interpreter is constructed from the tape, the "semantics" of the tape are context-sensitive to the extreme. A three-letter word does not have a fixed meaning; its meaning is determined by the current heap state (available tRNAs, chaperones, methylation status). There is no external specification to define a "compilation error." A mutation is not a bug; it is merely a different configuration of the system that may or may not halt (lethal). Consequently, "information" is not localized in the tape but distributed across the entire system state. To say the gene carries information about the phenotype is like saying a single variable in a global mutable state carries the information about the program's output—it ignores the control flow and the runtime environment that actually determine the result. The "code" label implies a denotational semantics (this symbol *means* that trait) where only operational semantics exist (this symbol interacts with this chemical to produce this reaction).

  ### 3. The Gadget: Portability as the Metric

  **Definition:** Define the **Portability** of a DNA stretch as the variance in its phenotypic output when moved to different cellular contexts (different interpreters/runtimes). High portability means the output remains stable across different toolchains (cell types, environments); low portability means the output depends entirely on the specific runtime state.

  **Recasting the Disagreement:**
  *   **The Yes-Case** claims portability is sufficiently high. They argue that despite context noise, the tape constrains the output enough that we can treat it as the informational bottleneck. The "code" abstraction holds because the runtime is standardized enough by evolution.
  *   **The Skeptical Case** claims portability is too low to justify the abstraction. They argue that the context dependence is so severe that isolating the tape as the "information carrier" is a misleading optimization. The "code" abstraction leaks everywhere.

  **Honesty Check:** Does this resolve the fight? No, it relocates it one level down. The fight is no longer about metaphysics ("Is it *really* code?") but about thresholds ("How much context dependence breaks the abstraction?"). However, this relocation exposes a smuggling issue: the Yes-case often assumes portability across *evolutionary time* (generations), while the Skeptics focus on portability across *developmental space* (tissues/environments). If you demand portability across both, the "code" label fractures. The disagreement persists because neither side agrees on which runtime variations count as "noise" and which count as "semantic context."

  ### 4. Residue Report

  **Leftover 1: Teleology (Purpose/Function)**
  *   **The Residue:** Biology talks about genes "for" eyes or "trying" to replicate. Compilers do not care if the binary survives; they only care if it compiles.
  *   **Verdict:** This is **smuggling** by the biologists, not a vocabulary failure on your end. Your vocabulary handles syntax and semantics, not "goals." The Yes-case smuggles in an external optimizer (Natural Selection) to act as the "Client" who wrote the spec. The Skeptics reject this because the "Client" is blind.
  *   **Impact:** High. Without a spec, "error" is undefined. Biology defines error as "death," which is an external constraint not present in the code itself.

  **Leftover 2: The Arbitrary Codon Table**
  *   **The Residue:** The mapping from codon to amino acid is largely a "frozen accident" (conventional) rather than chemically necessitated (though some chemical affinity exists).
  *   **Verdict:** This **does real work** for the Yes-case and maps cleanly to your vocabulary.
  *   **Compiler Analog:** This is the ISA design. If `0x90` *had* to mean `NOP` due to physics, it's not a code, it's a law. Because `0x90` *could* have meant `ADD` but was assigned `NOP` by convention/history, it is a code. The existence of alternative genetic codes (mitochondria, ciliates) proves the mapping is not chemically fixed, supporting the "code" claim against the "chemical constraint" claim.
  *   **Fuzziness:** The claim is not fuzzy here; the mapping is arbitrary enough to qualify as a code in the Shannon sense.

  **Leftover 3: The "Self-Hosting" Loop**
  *   **The Residue:** The interpreter is destroyed and rebuilt every run.
  *   **Verdict:** This is **your vocabulary being richer** than the biological claim. Biologists often ignore the cost of rebuilding the compiler. In your terms, the overhead of reconstructing the JITter from source every run is massive. The fact that the system works at all suggests the "code" is incredibly robust, but it also means the boundary between "compiler" and "program" is porous.
  *   **Fuzziness:** The Skeptics use this to say "no code," but a self-hosting compiler still compiles code. This residue suggests the Skeptics are demanding a static linker where a JIT exists.

  ***

  Keep using "code" if you treat it as a self-hosting JIT with no external spec, otherwise drop it.
