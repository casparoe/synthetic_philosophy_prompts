prompt: |-
  Hey, I need a translation job with an honesty report attached.

  About me: I work on a self-hosting compiler for a JIT'd language, so my mental furniture is lexer/parser/AST, IR, denotational vs operational semantics, type checking, linkers vs interpreters, error-correcting codes, and Shannon channel capacity. My biology is undergrad molecular bio and my philosophy of biology is basically zero. Dont assume I know any of the literature's jargon.

  The job: restate the fight over whether DNA is really a code, and whether genes really carry information about phenotypes, in my vocabulary, as faithfully as you can.

  Set it up like this: the cell reads a four-letter tape in three-letter words, ~64 words mapped onto ~20 outputs plus stops, many-to-one, with sloppiness allowed at the third position. Same stretch of tape read in a different frame, or spliced differently, gives a different product. And here's the bit that breaks my usual analogies: the interpreter (the tRNAs, the charging enzymes, the ribosome) is itself compiled from the same tape and rebuilt every run, so there is no fixed machine underneath, no clean IR boundary, and nobody outside the system who wrote a spec.

  Then, in order:

  1. The yes-case. Best version you can manage: DNA really is a code, genes really do carry information.
  2. The skeptical case, equally strong, no strawman: degeneracy, context-sensitivity, interpreter and interpreted made of the same stuff, no external spec so no clean notion of a mistranslation or an error.
  3. My gadget, please use it. Define the portability of a stretch of DNA as how much of its output survives being moved into a different cellular context: different interpreter, different developmental background, like pasting a source file into a project with a different toolchain and runtime. Recast the disagreement as a disagreement about portability, then tell me honestly whether portability is what they were arguing about all along or whether it just relocates the fight one level down.
  4. Residue report. What in each side has no expression in my vocabulary at all? For each bit of leftover, say whether you think its my vocabulary being poor or the claim being fuzzier than it sounds. In particular: does the fact that the codon table is arbitrary, that it could have been otherwise, do any real work here, and is there anything in compilers it maps onto?

  Two rules. Dont tell me its like source code but wet, I'll be annoyed. And if one side only works by quietly importing an assumption my vocabulary doesnt have, flag that as smuggling rather than call it translation.

  Finish with one line: should I keep saying code at work, or does the word do damage?
