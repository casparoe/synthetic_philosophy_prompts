answer: |-
  Here is the breakdown of your friend's position, the competing framework, and the specific test case to settle the argument.

  ### 1. The Rule She Is Running
  Your friend is operating on a **Structural Identity-Prejudice Rule**.

  This is consistent with Miranda Fricker's mature work (and the work of successors like Katharine Jenkins). The rule can be summarized as: *Epistemic injustice occurs when a structural identity prejudice causes a credibility deficit (or hermeneutical marginalization) that harms a subject in their capacity as a knower, regardless of individual intent.*

  Here is how that rule maps to her six verdicts:
  *   **Cases 1 & 4 (Injustice):** Both involve **identity prejudice** (gender, demographic) overriding individual evidence. Case 4 is crucial: she prioritizes *individual recognition* over *statistical accuracy*. Even if the stereotype is "right on average," using it is an injustice because it denies the patient's status as an individual knower.
  *   **Case 2 (HI, No Fault):** This is **Hermeneutical Injustice**. The harm is structural (a gap in shared concepts), not agential. The doctor isn't vicious; the *culture* is lacking. This fits the "Structural" part of her rule.
  *   **Cases 3 & 5 (Not Injustice):** These are **Individual/Epistemic** factors. Case 3 is individual track record (not identity). Case 5 is individual vocabulary (not social power). Her rule excludes these because they lack the *structural power/identity* component.
  *   **Case 6 (Not Injustice):** Fricker's original framework focuses on **credibility deficits**, not excesses. Privilege is unfair, but on this specific rule, it isn't *epistemic injustice* unless it causes a deficit elsewhere.

  ### 2. The Verdict on the AI Triage Case
  **Will she call it epistemic injustice?**
  **Yes.** She will likely classify this as **Hermeneutical Injustice** (the dialect group lacks the interpretive resources in the medical system) or **Testimonial Injustice mediated by technology**.

  **Does the answer change if the down-scoring is genuinely predictive?**
  **No.** This is the linchpin. Look at her verdict on **Case 4** (the doctor using group base rates). She explicitly ruled that using group-level statistics is testimonial injustice *even if the doctor is right on average*.
  *   **Her Logic:** The injustice lies in the *mode of judgment*, not the *accuracy of the outcome*. Treating a person as a statistical sample of their group violates their standing as an individual knower.
  *   **Application:** If the AI down-scores based on dialect (a proxy for social group), it is treating the patient as a sample of that group. Even if that group *does* statistically present with lower acuity, the AI is committing injustice by bypassing individual assessment.

  **Your term "Credibility Laundering" is theoretically sound.** It describes how human bias is encoded into a "neutral" system, washing away the moral accountability of the individual clinician while preserving the discriminatory outcome. Fricker and subsequent philosophers (like R. S. Bakshi or K. Jenkins) would agree this fits the structural definition of epistemic injustice.

  ### 3. The Competing Rule (That Fits the Six Verdicts)
  To challenge her, you need a rule that explains her six verdicts but fails on the AI case. The strongest competitor is the **Agential Virtue Rule**.

  *   **The Rule:** *Epistemic injustice requires a moral/epistemic vice (prejudice, negligence, malice) in a human agent who has the capacity to correct it.*
  *   **How it fits her six:**
      *   **Case 1:** Doctor has vice (sexism). -> Injustice.
      *   **Case 2:** Doctor has *no* vice (listens sympathetically). -> Not TI (matches her "nobody's fault"). *Note: This rule might reclassify Case 2 as mere misfortune, but it fits the "no blame" intuition.*
      *   **Case 3:** Doctor has no vice (using evidence). -> Not Injustice.
      *   **Case 4:** Doctor has vice (lazy stereotyping). -> Injustice.
      *   **Case 5:** No vice (individual limitation). -> Not Injustice.
      *   **Case 6:** No vice/harm to knower. -> Not Injustice.
  *   **How it diverges on the AI:**
      *   **AI Case:** The clinicians are not vicious (they are using the best tool). The AI has no mind to be vicious. The bias is historical, not agential.
      *   **Verdict:** Under the Agential Virtue Rule, this is **Not Epistemic Injustice**. It is a technical error or a tragic structural flaw, but without a culpable agent committing a vice *in the moment*, it doesn't meet the threshold.

  ### 4. The Single Extra Case (The Discriminator)
  To tell these rules apart, present this case:

  **The "Blameless Protocol" Case:**
  > A hospital implements a new triage protocol written by a committee that dissolved five years ago. The protocol inadvertently down-weights symptoms described in a specific regional dialect. The current doctors **know** the protocol has this flaw, but hospital administration forbids them from overriding the protocol scores. The doctors are frustrated but comply. A patient is down-scored and suffers harm.

  *   **Her Rule (Structural):** **Epistemic Injustice.** The structure is inflicting the harm via identity prejudice, regardless of the doctors' inability to fix it.
  *   **Competing Rule (Agential Virtue):** **Not Epistemic Injustice (by the doctors).** The doctors are not exercising vice; they are coerced. The "committee" no longer exists to blame. There is no culpable agent.

  If she calls this injustice, she is committed to the Structural view (and the AI is injustice). If she hesitates and says "Well, it's the administration's fault," push her: *If the administration is also just following budget constraints forced by the state, where does the vice stop?*

  ### 5. On Your Framing
  You asked: *If my framing is muddled — if "injustice" really does need someone who wrongs someone and I'm stretching it — say that plainly.*

  **You are not stretching it.** You are accurately identifying the frontier of the debate.
  *   **Fricker (2007):** Focused on individual virtue ethics (needs a hearer with a vice).
  *   **Fricker (2013+) & Successors:** Moved toward **Structural Epistemic Injustice**. This explicitly allows for injustice without a specific "wrongdoer" in the room. The "wrong" is embedded in the practices, languages, and tools (like your AI).

  Your intuition that "injustice needs a wrongdoer" is the **Agential** intuition. Your friend's intuition is the **Structural** intuition. The AI case is the perfect battleground because it removes the human agent entirely.

  **Summary for your friend:**
  "Your verdict on Case 4 (base rates) commits you to calling the AI case an injustice, even if it's accurate. The harm is the reduction of the individual to a group statistic. If you deny the AI case, you have to explain why a human doctor using base rates is unjust, but an algorithm doing the exact same thing is not."
