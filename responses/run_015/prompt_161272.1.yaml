answer: |-
  ### The Triage Procedure

  This procedure is designed for speed and risk management, not legal certainty. It assumes you are working with text that may be incomplete, ambiguous, or deliberately opaque. Your goal is not to render a verdict but to determine if the text supports the story you want to tell, or if the story needs to change to match the text.

  **1. Scope and Silence**
  Start by checking if you have the whole organism. If you only have an excerpt, assume the missing text contains the contradiction. If the document is silent on the specific power being exercised, do not assume the power exists; assume it is disputed. Silence is not permission; it is a vacuum that invites litigation. If the text is silent, mark this as a "gap" and move to step 8.

  **2. Classification (The Definitional Dodge)**
  Identify what the actors call the move versus what the move does. If they call it a "practice," "policy," or "clarification" but it binds members like a rule, treat it as a rule. This is where "definitional dodges" live. If the document defines "rule" narrowly but the effect is broad, flag this. If the classification determines whether an amendment vote is needed, this is a critical junction.

  **3. Authority and Thresholds (The Threshold Flip)**
  Check who is voting and what percentage they hold against what the clause requires. Crucially, check if the clause they are changing is itself protected by a higher threshold. You cannot use a 51% key to unlock a 75% door, even if you plan to change the lock to 51% in the same turn. This is the "self-entrenchment" problem. If the vote count meets the current rule but not the entrenched rule, the move is blocked unless the entrenched rule is changed first using its own higher bar.

  **4. External Dependencies (The Borrowed Rule)**
  Look for phrases like "as revised from time to time" or references to external handbooks, protocols, or smart contracts. If the charter incorporates an external document that can be changed without amending the charter, the charter is subordinate to that document. This is "dynamic incorporation." If the external document grants powers the charter seems to restrict, the external document wins unless the charter explicitly forbids delegation.

  **5. Interpretive Authority (The Creep)**
  Find the clause that says who decides what the words mean. If a specific body (Stewards, Board, Core Devs) has "final say" or if their rulings become part of the text, the text is secondary to that body's will. This is "interpretive supremacy." If this exists, textual analysis alone is insufficient; you must analyze the incentives of the interpreters.

  **6. Collisions and Entrenchment**
  Look for two clauses that contradict each other, especially where both claim to be unamendable or superior. If Clause A says "X is guaranteed" and Clause B says "Y can be changed by majority" and X limits Y, you have a "constitutional collision." Text cannot resolve this; only a arbiter can. If you find this, you must hand off to a lawyer or editor depending on whether the risk is legal liability or narrative collapse.

  **7. Sequence and Ordering**
  If the move requires multiple votes (e.g., change the threshold, then pass the measure), check if the order is specified. If not, assume the stricter order applies (change threshold first requires the old threshold). If the actors plan to do it in one meeting, check if the minutes will record them as distinct motions. Bundling incompatible votes invalidates the bundle.

  **8. The Gap Fill**
  If the text is silent (from Step 1), do not invent a rule. State that the text is silent. If standard practice or prior rulings exist, note them, but label them as "precedent" not "text." If the silence allows the move technically but violates the spirit, this is a story about design failure, not legal breach.

  **9. The Exploit Decision**
  If your analysis reveals a loophole that allows the organization to be gutted or hijacked legally, you must decide whether to publish it. Publishing makes the exploit common knowledge and may trigger the attack you are describing. Not publishing protects the group but hides the design flaw. This is not a text question; it is an ethical one. Hand this to the editor if the risk involves harm to vulnerable members; keep it if the group is powerful enough to absorb the scrutiny.

  **10. Hedging and Copy**
  If any step above yields uncertainty, you must hedge. Do not say "This is illegal." Say "The text does not settle this," or "On a plain reading, this appears blocked," or "Legal scholars suggest this would invite challenge." If the answer depends on a judge's mood, say "This would likely require adjudication."

  ***

  ### Worked Applications

  | case_id | first_step_that_bites | verdict | hedge_phrase | signoff | exploit_publication_risk |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Case 1** (Foundation) | Step 3 (Authority and Thresholds) | The Council can add emergency powers but cannot lower the amendment bar without membership vote. | "While the Council holds sufficient votes for standard amendments, the entrenched clause appears to lock the amendment process itself." | lawyer friend | **Low** (Technical governance dispute; unlikely to cause immediate harm). |
  | **Case 2** (Co-op) | Step 2 (Classification) | The "practice" label likely fails if enforced like a rule; quiet enjoyment clause creates a collision. | "Although filed as a practice, the restriction functions as a rule, potentially triggering the quiet enjoyment protection." | editor | **Medium** (Could inflame neighbor vs. musician tensions within the co-op). |
  | **Case 3** (Mutual-Aid) | Step 5 (Interpretive Authority) | The charter is cosmetic; the Stewards hold absolute power via the Handbook and final interpretation. | "The governing text defers entirely to the Stewards' handbook and their final interpretation of it." | me | **High** (Publishing this destroys the group's legitimacy and trust). |

  ***

