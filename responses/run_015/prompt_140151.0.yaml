answer: |-
  This is a sophisticated position, one that aligns with certain strands of the dynamic choice literature (roughly in the vicinity of McClennen's resolute choice or Bratman's planning theory). You are attempting to salvage the money pump argument by stripping it of its behavioural contingencies and focusing on structural vulnerability. However, in tightening the definition of the pump to exclude informational asymmetry, you risk tightening it out of existence.

  Here is an assessment of what counts against your thesis, ranked from fatal to merely awkward, followed by an evaluation of what you must concede.

  ### 1. The Self-Knowledge Trap (Fatal)
  You ask whether self-knowledge counts as the kind of 'edge' you wish to exclude. This is the most severe threat to your view. For a blind pump to operate, the agent must accept a series of trades that lead to a sure loss. If the agent possesses self-knowledge—specifically, knowledge of their own intransitive ordering—they can foresee the cycle.

  If I know I prefer $A$ to $B$, $B$ to $C$, and $C$ to $A$, and I am presented with a standing offer to swap $A$ for $B$ for a penny, I can deduce that accepting this trade initiates a sequence that will leave me poorer with $A$ again. To avoid the loss, I simply refuse the first trade.

  For the pump to succeed, the agent must *not* act on this deduction. They must treat each choice node in isolation (myopia) or lack the capacity to plan across nodes. But you explicitly state that pumps requiring myopia "show nothing at all". Therefore, a blind pump cannot work on a rational, reflective agent. If it only works on a myopic one, your criterion for irrationality collapses back into the very thing you sought to avoid: it punishes a failure of dynamic consistency or foresight, not the intransitivity itself. You cannot have a pump that works without informational asymmetry *and* without agent myopia. One or the other is required to extract the money.

  ### 2. Exploitability vs. Rationality (Severe)
  This concerns your claim that intransitivity is irrational *exactly when* it makes you exploitable. Suppose an agent has cyclic preferences but is dynamically consistent (they plan ahead and refuse the first trade to avoid the cycle). They are not exploitable by your blind pump.

  According to your thesis, this agent is not irrational. But their underlying preference ordering remains intransitive. This suggests that exploitability tracks *prudence* (the ability to protect one's interests) rather than *rationality* (the coherence of one's attitudes).

  If I have intransitive preferences but the wisdom to refuse the trade, have I cured the irrationality? Most decision theorists would say no; I have merely mitigated the damage. By tying irrationality strictly to successful exploitation, you conflate the *symptom* (losing money) with the *disease* (incoherent valuations). If the disease can be present without the symptom (because the agent is resolute), then your test fails to diagnose the disease.

  ### 3. The Dial Case (Severe)
  Consider the spectrum case you mentioned: a dial with 1,000 settings. Setting 1 is comfortable; Setting 1,000 is agony. Each step $n$ to $n+1$ is imperceptibly worse (or perhaps imperceptibly better, depending on how you set up the preference). If preferences are transitive, there must be a precise point where 'better' flips to 'worse'.

  If your blind pump argument forces transitivity here, it forces the agent to admit a sharp cut-off in a continuous spectrum, which is metaphysically and phenomenologically implausible. Most people find it rational to say $n$ is indifferent to $n+1$, yet 1 is better than 1,000. This is intransitive (if indifference is transitive).

  If your view declares this irrational because a blind pump *could* be constructed (perhaps by charging a tiny fee for every turn of the dial), you are committed to saying that vague preferences are irrational. If, however, you say the pump doesn't work here (because the agent sees the cliff at the end and refuses to start turning), then you are admitting that clear cases of intransitivity are rational. You cannot have it both ways: either you condemn rational vagueness, or you exonerate intransitivity.

  ### 4. Regret and Similarity-Based Choice (Awkward)
  You ask about cyclic preferences arising from regret or similarity (e.g., Tversky's similarity-based choice models). In these cases, preferences are often context-dependent. I might prefer $A$ to $B$ in a binary choice, but $B$ to $A$ when $C$ is present.

  A blind pump assumes stable preferences across the choice sequence. If my preferences shift depending on the menu (which is common in regret theory), the standing offer itself changes the context. If I refuse the trade because the *offer* makes me regretful, the pump fails.

  Does this mean my context-dependent preferences are rational? If you say yes, you abandon the standard transitivity requirement entirely. If you say no, you must argue that context-dependence is itself a failure of rationality, not just the resulting cycle. This complicates your thesis: it is no longer about intransitivity per se, but about the stability of preferences over time and context.

  ### 5. The Insulation Charge (Meta-Critical)
  You ask honestly whether you have insulated the view too well. If every counterexample is blocked by adding the clause "it must be a mechanism that isn't trading on any failure of yours other than the cycle," you risk vacuity.

  If the only way to demonstrate the cycle is to rely on the agent's failure to use self-knowledge (myopia), and you rule that out, then there is *no* mechanism left. A mechanism that extracts money from an agent who knows their preferences, knows the mechanism, and is dynamically consistent is impossible. Therefore, your criterion ("irrational exactly when exploitable by a blind pump") might be satisfied by *nothing*.

  If no agent can be pumped under your strict conditions, then no agent is irrational by your lights. This renders the concept of irrationality empty. A theory of rationality must be able to distinguish between the rational and the irrational; if your definition of the test excludes all actual failures, it ceases to be a test.

  ### What You Must Concede vs. Explain Away

  **You must concede:**
  1.  **That self-knowledge stops the pump.** You cannot claim the blind pump works on a fully reflective agent. You must admit that the pump relies on the agent failing to integrate their knowledge of the whole sequence into their current choice.
  2.  **That resolute choice masks intransitivity.** You must accept that an agent can be intransitive yet unexploitable. Consequently, you must concede that exploitability is not a perfect proxy for the coherence of preferences, but rather a proxy for the coherence of *choice over time*.
  3.  **That the Dial Case is problematic.** You cannot easily force transitivity on a sorites spectrum without accepting absurd precision. You will likely have to admit that your view implies vague preferences are irrational, or that the money pump argument simply does not apply to continuous spectra.

  **You might try to explain away:**
  1.  **The definition of 'Information'.** You could argue that self-knowledge isn't 'information' in the relevant sense, but rather a constitutive part of agency. However, as argued above, this leads to the myopia problem.
  2.  **Prudence as Rationality.** You could bite the bullet and argue that prudence *is* a component of rationality. If you fail to plan against your own cycles, you are irrational, not merely imprudent. This saves the pump argument but shifts the locus of irrationality from the preference ordering to the decision procedure.

  ### Final Verdict on Insulation
  You have not insulated the view; you have strangled it. By demanding a pump that requires no informational edge and no myopia, you have described a mechanism that cannot exist. A money pump is essentially a dynamic inconsistency exploit. If the agent is dynamically consistent (which they must be to satisfy your 'no myopia' condition), the pump fails.

  Therefore, your thesis faces a dilemma:
  1.  **If the pump works:** The agent must be myopic or ignorant. Thus, the irrationality lies in the myopia/ignorance, not the intransitivity.
  2.  **If the pump fails:** The agent is unexploitable. Thus, by your definition, they are not irrational, even if their preferences cycle.

  To save the essay, you should pivot slightly. Do not claim intransitivity is irrational *because* of the blind pump. Instead, claim that intransitivity is a structural defect that *would* lead to sure loss were it not for other rational capacities (like planning) that mask it. The money pump reveals the *potential* for self-defeat inherent in the preferences, even if a sophisticated agent can navigate around it. This preserves the insight of the money pump without making the impossible claim that a reflective agent can be blindly drained.
