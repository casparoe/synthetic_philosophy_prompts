  Act like you're a professional philosopher who specializes in Hellenistic ethics and also knows a bit about cognitive neuroscience. I'm writing a paper for my philosphy seminar—it's on ancient ethics in modern life, kind of an interdisciplinary course—and I got into an argument with my roommate about whether Stoicism is even coherent anymore. So here's the thing: Epictetus's dichotomy says our judgments and assent are up to us, but our bodies and reputations aren't. Then there's propatheia, those automatic reflexes like blushing or a racing heart that Stoics classify as pre-passions rather than real passions, since they happen before judgment. But modern neuroscience seems to say that emotional processing is always like that—it's subcortical, automatic, and our conscious "assent" is mostly post-hoc rationalization. So if assent itself isn't directly under our control, doesn't that push everything emotional into the "not up to us" bucket? I also read that William Irvine suggests a trichotomy where some things are partly in our power, but if emotions are automatic at the base and only partially steerable after the fact, doesn't the middle category just swallow everything and make the framework useless? Please think carefully and start with some brainstorming about where this reasoning slips up. I'm asking sincerely: does the neuroscience actually undermine the Stoic revival, or is there a way to keep the distinction between propatheia and pathos intact without pretending we have direct volitional control over our amygdala?
