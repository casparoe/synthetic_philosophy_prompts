answer: |-
  ### The Tolstoyan Operational Procedure for Scene Evaluation

  **Preamble:** This procedure derives from Leo Tolstoy's *What Is Art?* (1897). It posits that art is not a game of beauty or skill, but a means of union among men. A scene is 'genuine' only if it infects the recipient with a feeling the author has sincerely experienced, promoting a sense of human brotherhood. It is 'counterfeit' if it relies on imitation, effect, or exclusivity.

  #### Part I: The Sequential Decision Procedure

  **Step 1: The Test of Sincerity (Internal)**
  *   **Query:** Did I, the author, experience the specific feeling I am attempting to transmit while writing this? Is the impulse to write this scene driven by a need to share that feeling, or by a desire to appear clever, fashionable, or skilled?
  *   **Pass:** The author affirms the feeling was lived and the motive is sharing.
  *   **Fail:** The author admits the feeling was manufactured, intellectualised, or the motive was display.
  *   **Irreducible Judgment Point:** *Halt.* No external metric can verify internal sincerity. You must declare this truthfully. If you lie here, the procedure collapses.

  **Step 2: The Test of Clarity (Transmission)**
  *   **Query:** If I read this aloud to a person of moderate education, unacquainted with literary conventions, would they grasp the feeling immediately, without explanation? Is the feeling explicit in the text, or does it require decoding?
  *   **Pass:** The feeling is transmitted directly; the reader's emotional state aligns with the author's intent without intellectual mediation.
  *   **Fail:** The reader must analyse syntax, vocabulary, or structure to *infer* the feeling. The emotion is obscured by style.
  *   **Irreducible Judgment Point:** *Halt.* You must simulate the 'universal reader'. You cannot test every reader, so you must judge whether the text *allows* for immediate infection or demands literary training.

  **Step 3: The Test of Universality (Accessibility)**
  *   **Query:** Does this scene rely on knowledge available only to a specific class, culture, or educated elite (e.g., allusions, complex metaphor, specialised jargon)? Does it unite people in a common feeling, or does it separate the 'knowing' from the 'unknowing'?
  *   **Pass:** The subject matter and expression are accessible to any human being regardless of station. It promotes brotherhood.
  *   **Fail:** The scene creates a barrier between those who understand the technique and those who do not. It is exclusive.
  *   **Irreducible Judgment Point:** *Halt.* You must judge the 'cost' of your allusions. Is the metaphor a bridge or a wall?

  **Step 4: The Test of Ornament (Technique vs. Substance)**
  *   **Query:** Is the technical arrangement (rhythm, imagery, diction) subservient to the feeling, or has it become the object of attention? If I remove the decorative phrasing, does the feeling remain?
  *   **Pass:** Technique is invisible; only the feeling is perceived.
  *   **Fail:** The reader admires the writing rather than feeling the emotion. Technique substitutes for sincerity.
  *   **Irreducible Judgment Point:** *Halt.* You must discern if a phrase exists because it *feels* true or because it *sounds* beautiful.

  **Step 5: Final Adjudication**
  *   **Verdict:** If Steps 1–4 are passed, the scene is **Genuine**. If any step is failed, the scene is **Counterfeit**.

  #### Part II: Limitations of the Procedure

  This procedure **cannot** adjudicate:
  1.  **Aesthetic Beauty:** A scene may be beautiful but counterfeit (if it lacks sincere infection).
  2.  **Market Viability:** Genuine art may be unpopular; counterfeit art may be best-selling.
  3.  **Political Correctness:** A scene may promote brotherhood but offend contemporary sensibilities (Tolstoy's own work was often censored).
  4.  **Complexity of Consciousness:** The procedure assumes feelings are discrete and transferable. It struggles with ambivalence or conflicting emotions that are true to life but hard to 'infect'.

  ---

  #### Part III: Application to Draft Scenes

  **Scene 1: The Withholding (Free Indirect Discourse)**
  *   *Draft:* "She looked at the chart. Protocol 4B. The pen hovered. A tremor in the hand, not hers. The corridor hummed. Best to initial and move. The trolley waited."
  *   *Application:*
      *   **Sincerity:** Pass. (Assumed author felt the frustration).
      *   **Clarity:** **Fail.** The emotional label (distress, anger, helplessness) is withheld. The reader must infer the carer's state from the 'tremor' and the 'hum'. This requires literary competence to decode the subtext. Tolstoy demands the feeling be transmitted, not hidden.
      *   **Universality:** **Fail.** Relies on the reader's familiarity with the convention of free indirect discourse to understand that the 'tremor' signifies internal conflict rather than physical cold.
      *   **Verdict:** **Counterfeit.**
  *   *Note on Preference:* As a literary novelist, you likely value this restraint as 'showing, not telling'. The procedure condemns this as obscurity. Tolstoy would argue you are prioritising technique over the clear transmission of the carer's suffering.

  **Scene 2: The Cathedral (Extended Metaphor)**
  *   *Draft:* "The ward stretched like a nave, fluorescent lights acting as stained glass, casting a sterile benediction. The nurses moved in white habits, silent acolytes serving the altar of the bed."
  *   *Application:*
      *   **Sincerity:** Pass. (Assumed author felt the solemnity).
      *   **Clarity:** Pass. The comparison is explicit.
      *   **Universality:** **Fail.** Requires knowledge of cathedral architecture, naves, acolytes. A reader from a non-Christian or secular background may not feel the intended 'sacred' weight. It excludes those without this cultural vocabulary.
      *   **Ornament:** **Fail.** The metaphor is decorative. It draws attention to the author's skill in comparison rather than the raw reality of the patient's pain. It substitutes poetic imagery for direct feeling.
      *   **Verdict:** **Counterfeit.**

  **Scene 3: The Exchange (Subtextual Dialogue)**
  *   *Draft:*
      "Tea?"
      "No."
      "Cold?"
      "Yes."
      (The carer touches the patient's shoulder briefly before leaving.)
  *   *Application:*
      *   **Sincerity:** Pass. (Assumed author felt the quiet connection).
      *   **Clarity:** Pass. The action (touch) clarifies the words. The feeling of care is transmitted through the physical act, which requires no decoding.
      *   **Universality:** Pass. Understanding a offer of tea and a touch requires no education. It is accessible to all classes and cultures.
      *   **Ornament:** Pass. There is no decorative language. The simplicity serves the connection.
      *   **Verdict:** **Genuine.**

  ---

  #### Part IV: Revision of Verdict on Modern Narrative Form

  **The Argument for Revision:**
  To revise the verdict on **Scene 1 (Free Indirect Discourse)**, one must advance the argument that **the feeling being transmitted is not 'distress' but 'alienation'.**

  Tolstoy's framework assumes that art must make feelings *clear*. However, modern narrative form often posits that the authentic experience of institutional care *is* fragmentation, silence, and the inability to name one's own emotion. If the author's sincere feeling is the *absence* of clear emotional labels (the numbing effect of protocol), then a style that withholds emotional labels is not 'obscure'; it is the only accurate vessel for that specific feeling.

  Therefore, if the 'infection' sought is the reader's experience of *confusion* or *emotional blockage* mirroring the carer's, then the Free Indirect Discourse passes the Test of Clarity, because it clearly transmits the *lack* of clarity.

  **The Point of Probable Failure:**
  The reasoning is most probable to fail at **Step 2 (The Test of Clarity)**.

  Tolstoy defines clarity as the immediate comprehension of the *feeling*. If the feeling is 'ambiguity', the procedure enters a paradox: to make 'ambiguity' clear is to destroy it. The procedure cannot distinguish between **artistic ambiguity** (which transmits a complex truth) and **obscurity** (which hides a lack of sincerity).

  In the revision, you must decide: Is the withholding in Scene 1 a sincere transmission of the *experience* of numbness (Genuine), or is it a stylistic affectation designed to make the prose look modern (Counterfeit)? The procedure cannot answer this; it relies entirely on your irreducible judgment at Step 1. If you claim the feeling is 'numbness', Tolstoy might still argue that art should overcome numbness, not replicate it, suggesting the framework itself may be incompatible with the phenomenological aims of the modern novel.
