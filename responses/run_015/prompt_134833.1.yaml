answer: |-
  Imagine you apply for the "Integrity Grant," where a human committee reads your public decision-making algorithm on GitHub before acting. If their analysis predicts your code will **accept** unearned funds, they send you nothing to avoid waste. If it predicts your code will **decline** unearned funds, they mail you a binding offer letter for $10,000 with no strings attached. You check your mailbox and see the offer letter already there. CDT says "Sign it" because the letter is physically present and signing causally gets you the money now. EDT says "Sign it" because seeing the letter is already fixed evidence that they predicted you'd decline, so signing doesn't change that past fact. UDT says "Decline it" because your current choice is the output of the algorithm they read; if your algorithm outputs "Sign," they would have predicted that and never sent the letter, so to be the kind of agent who gets the grant, you must decline.

  Here's the breakdown: CDT and EDT both treat the prediction as a past event that's already locked in—since the letter is in your hand, taking the money doesn't causally or evidentially change the fact that they sent it. UDT peels off because it doesn't update on the fact that the letter is there; instead, it optimizes the entire algorithm's policy across all possible worlds, recognizing that the only way the letter exists is if your policy is to decline. The exact feature that makes UDT split off is that it treats your decision as logically determining the prediction, not just causally following it. As for your follow-up: if you hide the code and make it a hidden psychological prediction, it does *not* definitely collapse into a regular Newcomb problem. In a regular Newcomb problem, EDT one-boxes (doesn't take the visible money) because the box contents are hidden. Here, the offer is visible (in hand), so even with hidden prediction, EDT usually aligns with CDT and says "Take it," meaning you lose the CDT/EDT disagreement that defines regular Newcomb.

  \answer{Logical Subjunctive Dependence}
