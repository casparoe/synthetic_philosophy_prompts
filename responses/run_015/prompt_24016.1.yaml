prompt: |-
  I'm preparing a graduate seminar in the philosophy of statistics, and I've been stuck for some time on how to state a puzzle about the institution of significance testing that I think is real but that I can't quite get to the bottom of. The practice is familiar enough: a researcher runs a randomized experiment or a well-controlled study, computes a p-value, and if it falls below 0.05 the finding is reported as "statistically significant," the effect is treated as real, and a paper follows; if it doesn't, the finding is reported as "not significant" and the effect is usually treated as if it weren't there, even though the procedure is calibrated only to control the long-run rate of false positives, not of false negatives. And there is a further asymmetry in the institution itself: journals and grant reviewers systematically prefer published significant results to published null results, so the procedure's output is consumed as if it were a verdict on whether an effect exists, when on the standard account the p-value is merely the probability, supposing the null hypothesis is true, of seeing data at least as extreme as what was in fact observed — a probability about the behavior of the procedure, not about the truth of the hypothesis.

  What I'd like from you is a careful reconstruction of what this practice presupposes about the nature of probability. On the frequentist reading, probability is a long-run relative frequency of a repeatable procedure, and that reading seems to be what the significance level is doing all its work for; but the way the result is actually consumed — "the drug works," "the effect is real" — is a statement about the hypothesis, which is what a subjectivist or Bayesian degree of belief would be. So: which of the standard interpretations — frequentism, degree-of-belief subjectivism, propensity — can each be made to license the practice as it actually is, and at exactly which step does each one break down? I'm especially interested in the norm of preregistration, which requires the hypothesis and the analysis plan to be fixed before the data are collected. That norm looks like it only makes sense if probability is a property of the procedure and not of the hypothesis, but it also looks like it is being motivated by a desire to make post-hoc statements about the hypothesis legitimate, which is a different thing altogether. Please distinguish what the practice strictly presupposes from what it merely fits well with, say where the practice is underdetermined between the interpretations, and explain what would have to change — in how results are reported, in what counts as evidence of an effect, in the design of the experiment — if the institution were rebuilt on a straightforwardly Bayesian view of probability rather than the view it appears to presuppose.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** Graduate seminar in philosophy of statistics.
      *   **Core Problem:** A puzzle about the institution of significance testing (NHST).
      *   **The Tension:**
          *   *Practice:* Run experiment $\rightarrow$ compute $p$-value $\rightarrow$ $p < 0.05$ means "effect is real" (publication/grants); $p > 0.05$ means "effect is null/ignored."
          *   *Theory:* $p$-value is $P(Data | H_0)$, not $P(H_0 | Data)$. It controls long-run error rates (Type I), not false negatives (Type II) or posterior probability of truth.
          *   *Interpretation Clash:* Frequentist probability (long-run procedure) vs. Consumed meaning (degree of belief/truth of hypothesis).
      *   **Specific Focus:**
          *   Reconstruct what the practice *presupposes* about the nature of probability.
          *   Evaluate standard interpretations (Frequentism, Subjectivism/Bayesian, Propensity) regarding which can license the practice and where they break down.
          *   Analyze the norm of *preregistration*: Does it imply probability is a property of the procedure? Does it aim to legitimize post-hoc hypothesis claims?
          *   Distinguish *strict presupposition* vs. *fitting well*.
          *   Describe what would change if rebuilt on a straightforward Bayesian view.

  2.  **Initial Analysis & Philosophical Mapping:**

      *   *The "Puzzle":* This is essentially the "Rejection Trial" paradox (Gigerenzer) or the "Inductive Behavior" vs. "Inductive Inference" confusion (Jeffreys, Fisher vs. Neyman-Pearson). The user is asking for a metaphysical/semantic audit of the practice.
      *   *Frequentism:* Fits the calculation ($p$-value, $\alpha$). Breaks at the inference ("$H_1$ is true"). Neyman-Pearson says "act as if," Fisher says "evidence against." Neither strictly justifies "$H_1$ is probably true."
      *   *Bayesianism:* Fits the inference ("$H_1$ is probable"). Breaks at the calculation (no priors, no likelihood ratios in standard NHST).
      *   *Propensity:* Could bridge the gap (probability as a physical tendency of the setup), but still struggles with the single-case inference to truth.
      *   *Preregistration:* This is a crucial constraint. It locks the *procedure* to maintain the error rate. This strongly suggests a Frequentist/Neyman-Pearson underpinning. However, the *motivation* is often to prevent $p$-hacking to make the *claim* more trustworthy (Bayesian-ish goal).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the puzzle. Name it (the "Ontological Mismatch" or "The Categorical Verdict Problem").
      *   **Section 1: The Institutional Practice as a Hybrid.**
          *   Define the "Fisherian Significance Test" (evidence) vs. "Neyman-Pearson Hypothesis Test" (decision).
          *   The current practice is a "Fisherian-Neyman-Pearson Hybrid" (Gigerenzer's term).
          *   *Presupposition:* Probability is primarily a property of the *data generating process under the null*, but the *utility* is assigned to the *hypothesis*.
      *   **Section 2: Evaluating Interpretations of Probability.**
          *   *Frequentism (Long-Run):*
              *   *Licenses:* The calculation, the $\alpha$ threshold, Preregistration (fixing the reference class).
              *   *Breaks:* The single-case inference ("This drug works"). Frequentism forbids probability statements about fixed hypotheses.
          *   *Subjectivism (Degree of Belief):*
              *   *Licenses:* The consumption ("I believe the effect is real").
              *   *Breaks:* The calculation (NHST doesn't yield $P(H|D)$). Preregistration is less critical (updating happens regardless), though priors matter.
          *   *Propensity:*
              *   *Licenses:* Single-case probabilities of outcomes.
              *   *Breaks:* Still doesn't give $P(H|D)$. It gives $P(D|H)$.
          *   *Conclusion on Interpretations:* The practice *presupposes* Frequentism for validity but *smuggles in* Subjectivism for utility.
      *   **Section 3: The Puzzle of Preregistration.**
          *   Why preregister? To fix the "sampling intention."
          *   This is purely Frequentist. If probability were subjective, the stopping rule shouldn't matter (Likelihood Principle).
          *   *The Tension:* We use Frequentist constraints (preregistration) to validate a claim that feels Bayesian (confidence in truth).
          *   *Distinction:* Strictly presupposes Frequentism (to control Type I error). Merely fits Bayesianism (we want to believe the result).
      *   **Section 4: Rebuilding on Bayesian Foundations.**
          *   What changes?
          *   *Reporting:* No $p$-values. Report Bayes Factors or Posterior Distributions.
          *   *Evidence:* Continuous measure of evidence, not binary threshold.
          *   *Design:* Power analysis becomes prior predictive checking. Preregistration changes from "locking the analysis" to "declaring priors."
          *   *Null Results:* They become informative (updating the posterior), not just "failures to reject."
      *   **Section 5: Synthesis/Conclusion.**
          *   The institution is a "Ritual of Objectivity." It uses Frequentist mechanics to simulate Bayesian certainty without admitting subjectivity (priors).

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* Make sure not to conflate Fisher and Neyman-Pearson too much, but acknowledge the institutional practice conflates them.
      *   *Nuance on Preregistration:* Be careful. Preregistration *does* matter for Bayesians if it prevents selection effects that bias the likelihood, but strictly speaking, the Likelihood Principle says stopping rules don't matter for inference *given the model*. However, in practice, $p$-hacking changes the model space. I need to be precise: Preregistration is *necessary* for Frequentist error control, *optional/strategic* for Bayesian coherence.
      *   *Tone:* Keep it academic, suitable for a grad seminar. Use precise terminology (Likelihood Principle, Reference Class, Inductive Behavior vs. Inference).
      *   *Addressing the "Puzzle":* The puzzle is essentially a *category error*. The response should highlight this.

  5.  **Final Polish:** Check against all constraints in the prompt.
      *   Reconstruct presuppositions? Yes.
      *   Evaluate Frequentism, Subjectivism, Propensity? Yes.
      *   Where do they break? Yes.
      *   Preregistration analysis? Yes.
      *   Distinguish strict presupposition vs. fit? Yes.
      *   Bayesian rebuild scenario? Yes.

  6.  (Mental Outline of the "Bayesian Rebuild"):
      *   Current: $H_0$ is a straw man. $p < 0.05$ $\rightarrow$ Reject $H_0$ $\rightarrow$ Accept $H_1$.
      *   Bayesian: Compare $M_0$ vs $M_1$. Compute $P(M_1|D)$.
      *   Implication: "Not significant" becomes "Evidence for $H_0$" (if BF supports it). Preregistration becomes "Prior Registration."

  7.  (Final Review of the "Propensity" angle): Propensity is often seen as a single-case frequentism. It helps with the "this experiment" feel but doesn't solve the inversion problem ($P(D|H)$ vs $P(H|D)$). I should emphasize this limitation.

  8.  (Final Review of Preregistration): The prompt asks specifically about the tension: "looks like it only makes sense if probability is a property of the procedure... but also looks like it is being motivated by a desire to make post-hoc statements about the hypothesis legitimate." I need to explicitly resolve this. *Resolution:* It makes sense *only* if probability is a property of the procedure (Frequentist). The desire to make post-hoc statements legitimate is the *motivation*, but the *justification* relies entirely on the procedural view. This highlights the mismatch.

  9.  **Constructing the Output.** (Proceed to generate response based on these thoughts.)
answer: |-
  This is a profound and well-recognized puzzle in the philosophy of statistics, often described as the "Fisherian-Neyman-Pearson Hybrid" problem (after Gigerenzer et al.), but your framing sharpens the ontological tension: the mismatch between the *metaphysics of probability* required to validate the calculation and the *metaphysics of probability* required to justify the inference.

  For a graduate seminar, it is useful to disentangle this by distinguishing between the **logic of justification** (what makes the number valid) and the **logic of discovery** (what the number is allowed to tell us). Below is a reconstruction of the presuppositions, an evaluation of the interpretations, an analysis of preregistration, and a sketch of the Bayesian alternative.

  ---

  ### 1. Reconstruction: The Ontological Mismatch

  The institutional practice of Null Hypothesis Significance Testing (NHST) presupposes a **split ontology of probability**.

  1.  **In the Calculation (The Validation Phase):** Probability is treated as **Frequentist**. It is a property of the *procedure* (the sampling distribution). The $p$-value is defined as $P(D \geq d_{obs} | H_0, \text{Procedure})$. Validity depends on the assumption that the data are generated by a repeatable process with a stable long-run frequency.
  2.  **In the Consumption (The Inference Phase):** Probability is treated as **Epistemic/Subjective**. The output ("statistically significant") is consumed as a warrant for belief in a singular proposition ("The drug works"). This treats the hypothesis as a random variable capable of bearing probability, or at least treats the *verdict* as a reliable indicator of truth in this specific case.

  **The Puzzle:** The institution uses Frequentist mechanics to purchase Epistemic certainty, without paying the price of either (i) admitting subjective priors or (ii) accepting that the statement applies only to long-run error rates, not the specific hypothesis at hand.

  ### 2. Evaluation of Probability Interpretations

  Here is how the standard interpretations license or break down within the current institution.

  #### A. Frequentism (Long-Run Relative Frequency)
  *   **Where it Licenses the Practice:** This is the only interpretation that strictly validates the calculation of the $p$-value and the $\alpha = 0.05$ threshold. It justifies the control of Type I error rates over a hypothetical infinite sequence of experiments. It provides the rigorous foundation for **preregistration** (see below).
  *   **Where it Breaks Down:** It strictly forbids the inference researchers actually draw. For a strict frequentist (e.g., Neyman), rejecting $H_0$ is a rule of *inductive behavior*, not *inductive inference*. You are licensed to *act* as if $H_1$ is true, but not to *believe* it is true. Furthermore, frequentism assigns no probability to the hypothesis itself ($P(H_0)$ is 0 or 1, not unknown). Therefore, the statement "the effect is real" is category error under strict frequentism.
  *   **Verdict:** The practice *presupposes* frequentism for validity but *violates* it for utility.

  #### B. Subjectivism (Degree of Belief / Bayesianism)
  *   **Where it Licenses the Practice:** It licenses the consumption. Scientists want to know $P(H_1 | Data)$. The institutional output functions as a heuristic proxy for a high posterior probability. It justifies the desire to publish "true" findings.
  *   **Where it Breaks Down:** The calculation is incoherent from this view. A $p$-value is not a likelihood ratio, nor a posterior. It conditions on the truth of the null ($H_0$) to assess the data, whereas Bayesian inference conditions on the data to assess the hypothesis. Moreover, standard NHST ignores prior probabilities ($P(H_0)$), which subjectivism deems essential.
  *   **Verdict:** The practice *fits* the psychological goals of subjectivism but lacks the mathematical machinery to achieve them.

  #### C. Propensity (Single-Case Physical Chance)
  *   **Where it Licenses the Practice:** Propensity theory (Popper, Gillies) attempts to bridge the gap by defining probability as a physical disposition of a singular setup to produce outcomes. This might license the intuition that "this specific experiment has a 5% chance of misleading us."
  *   **Where it Breaks Down:** Like frequentism, propensity is typically assigned to the *data generating process*, not the *hypothesis*. A propensity interpretation explains why the data are surprising under $H_0$, but it does not invert the conditional to tell us the propensity of $H_1$ being true given the data. It also struggles to justify the rigid 0.05 cutoff, which is an institutional convention, not a physical constant.
  *   **Verdict:** It offers a better metaphysical fit for "single-case" experimental talk than long-run frequentism, but it still cannot license the inference to the truth of the hypothesis.

  ### 3. The Norm of Preregistration: The Crux of the Tension

  Your intuition about preregistration is the key to unlocking the presupposition.

  **Strict Presupposition:** Preregistration is **strictly Frequentist**.
  *   **Why:** The $p$-value depends on the "sampling intention" or the "reference class" of possible experiments. If you peek at the data and decide to stop collecting, or if you try multiple analyses and pick the best one, you change the sampling distribution of the test statistic under $H_0$. The long-run error rate ($\alpha$) inflates.
  *   **The Likelihood Principle:** Under a Bayesian/Subjectivist view (adhering to the Likelihood Principle), the stopping rule and the analysis plan (provided the model is fixed) are irrelevant to the evidence contained in the data. The likelihood function $P(Data | \theta)$ is the same regardless of when you stopped.
  *   **Conclusion:** The fact that preregistration is considered *mandatory* for valid $p$-values proves the institution presupposes **Frequentism**. If the institution presupposed Subjectivism, preregistration would be merely helpful for transparency, not necessary for validity.

  **The Motivation vs. The Justification:**
  *   **Motivation:** We preregister to make the post-hoc claim ("The effect is real") more trustworthy. This is a Bayesian goal (increasing the posterior probability that the claim is true).
  *   **Justification:** We can only claim that trustworthiness has increased because we have preserved the Frequentist error rate.
  *   **The Breakdown:** We are using Frequentist constraints (locking the procedure) to secure Epistemic warrants (belief in the hypothesis). Preregistration prevents the *procedure* from becoming biased, but it does not solve the *inversion problem* ($P(D|H) \neq P(H|D)$). A preregistered $p=0.04$ is still not a probability that the hypothesis is true.

  ### 4. Distinguishing Presupposition from Fit

  To clarify the underdetermination for your seminar:

  | Feature of Practice | Strictly Presupposes... | Merely Fits Well With... |
  | :--- | :--- | :--- |
  | **The $p$-value calculation** | **Frequentism.** Requires a defined sample space and long-run distribution. | **Propensity.** Can be viewed as a single-case chance of extreme data. |
  | **The 0.05 Threshold** | **Institutional Decision Theory.** (Neyman-Pearson). It is a cost-benefit cutoff, not an evidential cliff. | **Folk Epistemology.** Fits the human desire for binary "true/false" verdicts. |
  | **Preregistration** | **Frequentism.** Essential to define the reference class for error rates. | **Bayesianism.** Only insofar as it prevents "researcher degrees of freedom" that act as implicit priors. |
  | **Interpreting "Significant" as "Real"** | **Nothing (Logical Error).** No standard interpretation licenses this directly. | **Subjectivism.** It functions as a proxy for high degree of belief. |
  | **Ignoring "Non-Significant" Results** | **Neyman-Pearson.** If you don't reject, you withhold action. | **Publication Bias.** Fits the economic incentive structure, not probability theory. |

  ### 5. Rebuilding the Institution on Bayesian Foundations

  If you were to rebuild the seminar's target institution on a straightforward Bayesian view (Subjective Probability + Decision Theory), the following structural changes would be required:

  **1. Reporting: From Verdicts to Updates**
  *   **Current:** "We rejected the null ($p < .05$)."
  *   **Bayesian:** "The data updated our odds in favor of the effect by a factor of $X$ (Bayes Factor)." or "The posterior probability of the effect being greater than zero is 96%."
  *   **Change:** The binary "significant/not significant" distinction disappears. Evidence becomes continuous. A result with $BF_{10} = 3$ is reported as "moderate evidence," not a failed attempt at "significance."

  **2. The Status of the Null Hypothesis**
  *   **Current:** $H_0$ is a straw man (point null of exactly zero) assumed false a priori, tested only to be rejected.
  *   **Bayesian:** $H_0$ must be a live competitor. We assign a prior probability to $H_0$ (often a "spike" at zero).
  *   **Change:** "Null results" become informative. If the Bayes Factor favors $H_0$, we publish evidence *for* the absence of an effect. This dissolves the file-drawer problem, as null results are no longer "failures" but positive evidence for constraints.

  **3. Preregistration: From Locking Procedures to Declaring Priors**
  *   **Current:** Preregistration locks the analysis plan to preserve $\alpha$.
  *   **Bayesian:** Preregistration would focus on **Prior Registration**. Since the posterior depends on the prior, researchers would declare their prior beliefs before seeing data to prevent "prior hacking" (adjusting priors to get the desired posterior).
  *   **Change:** Stopping rules become flexible. You can collect data until the posterior is precise enough (Sequential Analysis), without inflating error rates, because the Likelihood Principle holds.

  **4. What Counts as Evidence**
  *   **Current:** Evidence is defined by the extremity of data under a null assumption (surprise).
  *   **Bayesian:** Evidence is defined by the *predictive performance* of competing models (likelihood ratios).
  *   **Change:** A result is not "significant" because the data are rare under $H_0$; it is "supportive" because the data are more probable under $H_1$ than $H_0$. This avoids the base-rate fallacy inherent in NHST (where a rare event under $H_0$ is treated as proof of $H_1$, ignoring how rare $H_1$ might be).

  ### Summary for the Seminar

  The puzzle you are grappling with is the **Reification of the Error Rate**. The institution treats the long-run frequency of false positives (a property of the method) as if it were the single-case probability of falsehood (a property of the claim).

  *   **Presupposition:** The practice strictly presupposes **Frequentism** for its validity conditions (hence preregistration).
  *   **Smuggling:** It smuggles in **Subjectivism** for its communicative utility (hence "the effect is real").
  *   **The Break:** It breaks at the **Inversion**. No amount of preregistration fixes the fact that $P(Data | H_0) \neq P(H_0 | Data)$.
  *   **The Bayesian Fix:** To align the metaphysics with the practice, one must abandon the $p$-value (a measure of data extremity) for the Bayes Factor (a measure of comparative model support), and abandon the binary verdict for a continuous update of belief. This would fundamentally alter the economy of publishing, making "null" results valuable and rendering the 0.05 threshold obsolete.
