  ### The Example: The Algorithmic Workforce Segregation Protocol

  **The Institution:** A multinational logistics corporation implements a new AI-driven HR system ("OptiHire").
  **The Purpose:** To maximize supply-chain efficiency by assigning workers to distribution hubs based on predictive analytics of "stability" and "commute reliability." There is no intent regarding reproduction; the goal is purely profit and logistical flow.
  **The Decision:** The algorithm systematically assigns workers from lower-income zip codes to overnight shifts at remote Hub A, and workers from affluent zip codes to day shifts at urban Hub B.
  **The Participants:** HR managers and the algorithm itself. They do not consider future generations; they consider quarterly efficiency metrics.

  **(a) The Causal Chain (Identity-Affecting):**
  The assignment determines the worker's daily schedule, stress levels, and geographic location. A worker assigned to Hub A (overnight, remote) sleeps during the day and socializes with a specific cohort of night-shift workers. A worker assigned to Hub B (day, urban) sleeps at night and socializes with a different cohort. These environmental shifts alter the timing of their leisure, the specific people they meet at local establishments, and their physiological readiness for conception. Consequently, Worker 1 (Hub A) conceives a child with Partner X on a Tuesday night using Sperm Set 1. Had the policy been different (e.g., a randomized assignment), Worker 1 might have been at Hub B, met Partner Y, and conceived on a Friday night using Sperm Set 2. Since a different sperm and egg combination is required to produce the same individual, the child born to the Hub A assignment (Child A) is numerically distinct from the child who would have been born under the alternative policy (Child B). The policy does not merely change the *circumstances* of Child A's life; it settles *which* particular individual comes into existence.

  **(b) The Resisted Judgment:**
  Critics argue the policy is **unjustly segregative**. It creates a caste-like system where the children of Hub A workers grow up in isolated, resource-poor communities with limited social mobility, while the children of Hub B workers inherit privilege. People resist the conclusion that this policy is morally permissible simply because Child A has a "life worth living" and would not exist otherwise. They insist it is a **wrong** or a **serious mistake** to structure the economy in a way that reliably produces a stratified future population, even if no specific future person can claim they were harmed *compared to their own non-existence*.

  **(c) The Contested Application:**
  It is genuinely contested whether the Nonidentity Problem (NIP) applies here. Standard discrimination law focuses on the harm to the *current* workers (person-affecting). However, if the workers are compensated well enough that their lives are "worth living" and they are not rights-violated in a way that permits legal standing, the critique often shifts to the *social structure* passed to the next generation. Proponents of the policy argue: "You cannot say these children are worse off, because without this efficiency protocol, they wouldn't exist at all." Thus, the case sits on the fault line between standard discrimination claims and pure nonidentity puzzles.

  ***

  ### 1. The Surviving Moral Complaint

  The moral complaint that survives the nonidentity blockage is **Impersonal Structural Injustice** (specifically, a violation of the duty to maintain fair equality of opportunity across generations).

  In standard person-affecting views, an act is wrong only if it makes some particular person worse off. In this case, Child A cannot claim to be worse off than they would have been (since the alternative was non-existence). However, the resistance described in (b) suggests we care about the *pattern* of distribution, not just individual welfare comparisons. The complaint is that the institution has violated a duty to uphold a just basic structure. This is an **impersonal badness**: the world is worse because it contains an unjust caste system, even if every individual within it has a life worth living.

  **Assessment of Strength:**
  Is this complaint strong enough to account for the resistance? **Yes, but with friction.** Our moral intuitions are deeply person-affecting; we struggle to condemn an act that harms "no one" in the comparative sense. However, the resistance remains strong because the "harm" is located in the **violation of a duty owed to the moral community as a whole**, rather than to specific individuals. We judge the *policy* as corrupting the social fabric. The strength lies in the fact that we routinely condemn historical injustices (e.g., segregation laws) even when the descendants of those laws cannot claim comparative harm. The weakness is that without a specific victim, the "injustice" can feel abstract, allowing defenders to dismiss it as "social engineering" concerns rather than moral wrongs.

  ### 2. The Pervasiveness Worry

  **The Worry:** If shifting work schedules changes conception timing, then *every* corporate policy (coffee breaks, lighting temperature, pay dates) is identity-affecting. If the NIP applies to all of them, does it become impossible to criticize *any* policy that affects the future, since any change produces different people?

  **Resolution:**
  This example avoids the slide into total immunity by distinguishing between **identity-affecting** and **identity-determining in a morally relevant way**.
  The NIP only blocks criticism if the *only* available complaint is comparative harm to the resulting individuals. In the OptiHire case, the criticism is not primarily about the welfare of Child A vs. Child B. It is about the **principle** guiding the selection.
  We can argue that while nearly all policies are identity-affecting, they are not all *identity-constitutive of an unjust structure*. A policy that changes *who* exists is morally neutral unless it selects *which kinds of people* exist based on unjust criteria (e.g., correlating life chances with zip code).
  Therefore, we do not abandon the ability to criticize policy. Instead, we abandon the **Person-Affecting Restriction** (the idea that wrongness requires a specific victim). We accept the pervasiveness of identity-affectingness but argue it is irrelevant to judgments of **procedural justice**. The slide is real only if we insist that harm must be comparative for specific individuals. If we allow that violating duties of justice is wrong regardless of the identity of the beneficiaries/victims, the pervasiveness of the causal chain does not paralyze moral judgment.

  ### 3. Dialectic Clarity vs. Murk

  This example leaves the dialectic **murkier** than standard cases (like the "Risky Policy" or "Teen Mother").

  **Why Murkier:**
  Standard cases isolate the NIP by ensuring the only affected parties are future people (e.g., energy policy affecting the 22nd century). The OptiHire case conflates **present discrimination** with **future nonidentity**.
  Critics can easily slide back into person-affecting claims: "The policy harms the *current* workers by stigmatizing them," or "It harms the *current* community by draining resources." This provides an escape hatch from the NIP that pure future cases do not. It makes it harder to test the NIP in isolation because the moral outrage can be satisfied by pointing to the living workers. To make the NIP bite, one must stipulate that the current workers are adequately compensated and happy, forcing the focus entirely on the structural legacy for the children. This stipulation feels artificial to many, muddying the intuition pump. However, this murkiness is valuable: it shows how the NIP hides inside ordinary institutional critiques, disguised as standard discrimination claims.

  ***

  ### Confidence and Weakest Step

  **Confidence Level:** **75%**.
  I am confident that this example meets the structural constraints and effectively demonstrates how the NIP lurks in non-reproductive institutional policies. The causal chain is scientifically sound (chaos theory applied to conception timing), and the moral resistance is sociologically plausible.

  **Least Sure Step:**
  The step I am least sure of is the **Resolution to the Pervasiveness Worry**.
  I argue that we can accept identity-affectingness without losing critical purchase by focusing on "procedural justice" rather than "comparative harm." However, a hardline defender of the Person-Affecting View could argue that if no individual is worse off, there is no "procedural injustice" that matters morally—only impersonal value, which they reject. Bridging the gap between "this creates an unjust structure" and "this is wrong *all-things-considered*" without a specific victim remains the most vulnerable point in the argument. It relies on the reader accepting impersonal values (like equality) as morally binding in the absence of harmed subjects, which is precisely what the Nonidentity Problem challenges.
