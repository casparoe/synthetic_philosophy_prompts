          *   *Descendants:* Object based on "narrative sovereignty" (not factual error, but the right not to have their interiority fabricated, especially regarding vice).
          *   *Artists:* Argue biography is constructive, speculation is labeled, veto power paralyzes programming.
      *   **Requirements:**
          *   Recommend Approval, Conditional Approval, or Rejection.
          *   Provide concrete course of action and timeline.
          *   Directly actionable by staff.
          *   Address the distinction between *epistemic harm* (facts) and *narrative sovereignty* (interiority).
          *   Give a strong, non-dismissive account of the artists' argument (slippery slope/paralysis).
          *   Avoid pure descendant veto OR unqualified artistic license (find a middle path).
          *   No citations/bibliographies.
      *   **Audience:** Committee members and Museum Director/Staff (circulated before the vote).
      *   **Tone:** Professional, ethical, decisive, nuanced.

  2.  **Determine the Recommendation:**
      *   *Rejection:* Too restrictive. Validates a "veto" power that could stifle future programming. Ignores the educational value of exploring moral ambiguity in history.
      *   *Unqualified Approval:* Ignores the legitimate ethical concern of the descendants. Risks reputational damage and treats the dead purely as material.
      *   *Conditional Approval:* The best path. It acknowledges the artistic necessity of speculation while respecting the specific ethical concern about *undocumented vice*. It sets a precedent without granting a veto.
      *   *Specific Condition:* The specific scene regarding the bribe needs modification. It shouldn't be removed entirely (artistic integrity), but the framing needs to shift from "this happened in their head" to "this is a question history asks."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly (Conditional Approval).
      *   **Context:** Briefly summarize the project and the conflict.
      *   **Ethical Analysis (The Core):**
          *   *Epistemic Harm vs. Narrative Sovereignty:* Define these. Acknowledge the descendants' point: we shouldn't claim to *know* the unknown.
          *   *The Artists' Argument:* Acknowledge that history *is* interpretation. A ban on interiority kills historical drama.
          *   *The Middle Ground:* The museum's role isn't just art, it's public trust. We can dramatize uncertainty without asserting false certainty.
      *   **Recommendation/Conditions:**
          *   Keep the scene, but change the framing.
          *   Enhance the "speculative" labeling (make it impossible to miss).
          *   Add a "historiography" component (explain *why* we are asking this question).
      *   **Timeline/Implementation:** Concrete steps for the next 3-6 months.
      *   **Appeal Process:** How descendants or artists can challenge this.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Conditional Approval" too vague?
