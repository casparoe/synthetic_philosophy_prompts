      *   *Critique:* Did I address "narrative sovereignty" seriously?
      *   *Fix:* Explicitly state that while we don't grant legal sovereignty to descendants, we owe an ethical duty of *humility* regarding interior states.
      *   *Critique:* Is the artists' argument strong enough?
      *   *Fix:* Emphasize that without speculation, the reformer becomes a statue, not a human. The museum's mission requires humanizing history.
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* Allow time for script revision and descendant consultation (without giving them veto).

  5.  **Final Polish:**
      *   Ensure the tone is institutional but empathetic.
      *   Check that all constraints of the prompt are met (no citations, specific distinction on harm, actionable timeline).
      *   Ensure the distinction between "what they did" and "how we dramatize consciousness" is central.

  6.  **Final Review against Prompt:**
