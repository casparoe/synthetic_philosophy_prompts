answer: |-
  **MEMORANDUM**

  **TO:** Ethics and Programming Committee; Museum Director; Office of General Counsel
  **FROM:** [Your Name/Committee Chair]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Funding for *The Unrecorded Hours*

  **I. EXECUTIVE SUMMARY**

  This memo recommends **Conditional Approval** for institutional funding of the immersive installation *The Unrecorded Hours*. The condition rests on a specific reframing of the speculative internal monologue regarding the alleged bribe. While the museum must not grant descendants veto power over artistic interpretation, we also cannot treat the interior lives of historical subjects as unrestricted public domain. The proposed path forward preserves the artistic integrity of the installation while mitigating the ethical risk of presenting undocumented psychological states as revealed truth.

  **II. CONTEXT AND CONFLICT**

  *The Unrecorded Hours* seeks to dramatize the life of a 19th-century public-health reformer. The historical record contains extensive public speeches and reports but lacks private correspondence due to a 1920s fire. The artistic proposal utilizes reconstructed dialogue and labeled speculative scenes to explore the reformer's moral conflicts.

  The conflict arises from a specific scene: an invented internal monologue where the reformer debates accepting a bribe from a factory owner.
  *   **The Descendants' Objection:** They do not contest factual claims regarding public actions. They argue for "narrative sovereignty"—the ethical claim that the dead retain an interest in how their consciousness is dramatized, particularly regarding unverified vice.
  *   **The Artists' Position:** They argue that biography is inherently constructive. They contend that marking speculation clearly satisfies ethical obligations and that granting descendants control over interiority would paralyze historical drama.

  **III. ETHICAL ANALYSIS: EPISTEMIC HARM VS. NARRATIVE SOVEREIGNTY**

  To reach a decision, the Committee must distinguish between two types of potential harm.

  **1. Epistemic Harm**
  This occurs when an institution misrepresents documented actions, statements, or events. If the installation claimed the reformer *took* the bribe, or *wrote* about it, this would be a factual falsification. The artists have avoided this; the installation does not claim the bribe offer happened as historical fact. Therefore, the standard objection of "lying about history" does not strictly apply.

  **2. Narrative Sovereignty**
  The descendants' argument is more nuanced. They assert that even if we label a scene "speculative," dramatizing a specific internal moral failure (the temptation of vice) imposes a psychological narrative on a subject who cannot consent or refute it. This is not about *what* happened, but *who* the person is allowed to be in the public imagination. If the museum asserts that the reformer *struggled with corruption* without evidence, we are effectively colonizing their consciousness. We are turning a silence in the archive into a confession of guilt.

  **The Artists' Counter-Argument**
  The artists' position must be taken seriously. History is not merely the aggregation of verified data points; it is the interpretation of human experience. If we establish a bright-line prohibition against inventing interior monologue, we render the museum incapable of producing psychological drama. We reduce historical figures to marionettes who only speak when a transcript exists. This would sterilize our programming, undermining our mission to make social history resonate emotionally with contemporary audiences. A policy that grants descendants veto power over "interiority" sets a precedent that could block future exhibitions on any figure with living kin, regardless of how clearly the speculation is labeled.

  **IV. RECOMMENDATION AND RATIONALE**

  The Committee should not choose between a descendant veto and unqualified artistic license. Instead, we must enforce a standard of **Historiographical Transparency**.

  The ethical breach is not the speculation itself, but the *dramatic weight* given to that speculation. An internal monologue in an immersive theater setting feels like truth to an audience, even with a disclaimer. It simulates access to the subject's mind.

  **Recommendation: Conditional Approval**
  Funding is approved contingent upon the following modifications to the script and staging:

  1.  **Reframing the Monologue:** The bribe scene must not be staged as a solitary revelation of the reformer's secret thoughts. It must be framed as a *historical question*. Instead of the actor soliloquizing, "I am tempted by this money," the staging should utilize a chorus or narrator to contextualize the moment: *"Historians debate whether the reformer faced this temptation. In this scenario, we explore what that choice might have looked like."* The interiority must be presented as a hypothesis, not a simulation of memory.
  2.  **Enhanced Labeling:** "Speculative" labels must be integrated into the sensory experience, not just placards. Lighting or audio cues should distinctively mark the shift from documented record to artistic hypothesis.
  3.  **Descendant Consultation (Non-Veto):** The production team must meet with the descendants to explain these framing changes. Their feedback should be recorded, but they do not hold approval rights over the final script.

  This approach respects narrative sovereignty by refusing to assert false certainty about the reformer's mind, while respecting the artists' need to dramatize moral ambiguity. It acknowledges that the museum's authority lends weight to speculation; therefore, the speculation must be explicitly burdened with its own uncertainty.

  **V. IMPLEMENTATION TIMELINE**

  *   **November 10, 2023:** Production team submits revised script and staging plan reflecting the "Historiographical Transparency" conditions to the Committee Chair.
  *   **November 17, 2023:** Committee review of revised materials. If compliant, funding release is authorized.
  *   **December 1, 2023:** Production team holds consultation meeting with descendants to review framing changes. Minutes submitted to Museum Archives.
  *   **January 15, 2024:** Installation opens to public.
  *   **February 2024:** Post-opening review. Committee to assess audience understanding of the speculative nature of the scenes (via survey data) to inform future policy.

  **VI. APPEAL PROCESS**

  *   **By Artists:** If the production team believes the conditions fundamentally destroy the artistic work, they may appeal to the Museum Director by November 15. The Director will convene an ad-hoc review of three external experts (one ethicist, one historian, one theater practitioner) to issue a binding recommendation.
  *   **By Descendants:** If the descendants feel the modifications fail to address the ethical violation, they may submit a formal grievance to the Office of General Counsel. While this does not halt the exhibition, it triggers an immediate ethics review for future collaborations with the family.

  **VII. CONCLUSION**

  We owe the dead fidelity to the truth of their actions, but we also owe the public the truth about the limits of our knowledge. By conditioning approval on the transparency of our speculation, we protect the museum's integrity as a steward of history without surrendering our mandate to interpret it. We acknowledge the reformer's narrative sovereignty not by silencing the question of their morality, but by ensuring the audience knows the question belongs to us, not to them.

  **Action Required:** Vote to adopt Conditional Approval as outlined above at Thursday's meeting.
