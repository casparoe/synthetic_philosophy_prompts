      *   This kills Compatibilism (they deny this link). It kills Libertarianism (they can't satisfy the regress). It leaves only Hard Impossibilism (which isn't a theory *of* responsibility, but *against* it).
      *   So, the requirement is the **Principle of Genetic Responsibility (Responsibility for the 'Way You Are').**

  6.  **Refining the Output Structure:**
