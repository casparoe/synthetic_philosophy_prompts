          *   **Ending:** A specific line starting with "Verdict:" naming that knockout requirement.

  2.  **Deconstruct "Ultimate Moral Responsibility" (Strawson's Sense):**
      *   Strawson's Basic Argument hinges on the idea that to be *ultimately* responsible for an action, you must be *ultimately* responsible for the mental nature (character/motives) that produced the action.
      *   To be responsible for that nature, you must have chosen it.
      *   To choose it, you must have had a prior nature to choose *with*.
