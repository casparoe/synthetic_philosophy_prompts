          *   Status: Non-negotiable for the specific concept of UMR.

      *   *Distinction 2: Act vs. Way You Are.*
          *   Req: Must link responsibility for acts to responsibility for character.
          *   Motivation: Strawson's Principle (you do what you do because of how you are).
          *   Status: Non-negotiable for UMR, rejected by Compatibilists.

      *   *Distinction 3: AP vs. Sourcehood.*
