  7.  **Drafting the Content (Iterative refinement for precision):**
      *   *Self-Correction on Status:* I need to be careful labeling things "Non-negotiable." For a theory of *Ultimate* Moral Responsibility (as defined by Strawson), the UMR constraints are non-negotiable by definition. But for a theory of *moral responsibility simpliciter*, they are negotiable. The prompt asks for a theory of *Ultimate* Moral Responsibility. So, Strawson's constraints are internal non-negotiables. Compatibilist preferences are external rejections of the spec. I will label them clearly.
