answer: |-
  Here is the specification sheet for a theory of **Ultimate Moral Responsibility (UMR)**, defined strictly in the Galen Strawson sense (responsibility that is not derivative and requires self-creation).

  ### I. Case Requirements
  *Which intuitive cases the theory must resolve.*

  **1. The Regress over "Ways of Being"**
  *   **Requirement:** The theory must explain how an agent can be the ultimate source of their actions without triggering an infinite chain of prior responsible choices.
  *   **Motivation:** Strawson's Basic Argument (you do what you do because of how you are; to be responsible for what you do, you must be responsible for how you are).
  *   **Status:** **Non-negotiable** for UMR. (Compatibilists reject this requirement entirely; Hard Determinists accept it but claim it cannot be met).

  **2. The Kid-versus-Adult Difference**
  *   **Requirement:** The theory must exculpate agents who lack developed rational capacities or mature character structures.
  *   **Motivation:** Universal intuition that children lack full moral agency compared to adults.
  *   **Status:** **Non-negotiable** (across all camps).

  **3. The Coerced Agent**
  *   **Requirement:** The theory must distinguish between actions flowing from the agent's own will and actions forced by external irresistible threats.
  *   **Motivation:** The intuition that duress mitigates or eliminates blame.
  *   **Status:** **Non-negotiable** (across all camps).

  **4. The Trauma/Character Case**
  *   **Requirement:** The theory must determine whether an agent is responsible for character traits shaped by unchosen trauma or genetics.
  *   **Motivation:** The "Constitutive Luck" objection. If my violence stems from abuse I didn't choose, am I *ultimately* responsible?
  *   **Status:** **Non-negotiable** for UMR. (Compatibilists often treat this as negotiable, arguing current capacity matters more than history).

  **5. Sourcehood Cases**
  *   **Requirement:** The theory must identify the agent as the genuine originator of the action, not merely a conduit for prior causes.
  *   **Motivation:** The intuition that responsibility requires ownership ("It was *me* who did it").
  *   **Status:** **Non-negotiable** for UMR.

  ---

  ### II. Distinction Requirements
  *Which conceptual lines the theory must draw (or refuse to collapse).*

  **6. Ultimate vs. Merely Derivative Responsibility**
  *   **Requirement:** The theory must specify whether the responsibility is foundational (underived) or borrowed from prior conditions/agents.
  *   **Motivation:** Strawson's definition of UMR excludes derivative responsibility (e.g., you are responsible for the crash *because* you were responsible for getting drunk).
  *   **Status:** **Non-negotiable** for UMR. (Compatibilists are often content with derivative responsibility).

  **7. Responsibility for Act vs. Responsibility for the "Way You Are"**
  *   **Requirement:** The theory must link responsibility for specific actions to responsibility for the mental nature (character/motives) that produced them.
  *   **Motivation:** Strawson's Principle: "You do what you do... because of the way you are."
  *   **Status:** **Non-negotiable** for UMR. (This is the primary point of rejection for Compatibilists).

  **8. Alternative Possibilities (AP) vs. Sourcehood**
  *   **Requirement:** The theory must state whether "could have done otherwise" (AP) is necessary, or if being the source (even without AP) suffices.
  *   **Motivation:** Frankfurt Cases (suggesting AP is not needed for blame).
  *   **Status:** **Camp Preference.** (Libertarians usually demand AP; Compatibilists and some Semi-Compatibilists settle for Sourcehood).

  ---

  ### III. Consistency Requirements
  *Which external facts or logical structures the theory must accommodate.*

  **9. The Recursive Structure of the Regress**
  *   **Requirement:** The theory must be logically consistent with the fact that any choice to change one's character requires a pre-existing character to make that choice.
  *   **Motivation:** Logical coherence of self-creation.
  *   **Status:** **Non-negotiable** (Logic).

  **10. Determinism-Compatibility**
  *   **Requirement:** The theory must state whether it holds if causal determinism is true.
  *   **Motivation:** Scientific worldview vs. metaphysical freedom.
  *   **Status:** **Camp Preference.** (Compatibilists say Yes; Libertarians and Hard Determinists say No).

  **11. Reactive Attitudes (Resentment/Gratitude)**
  *   **Requirement:** The theory must account for the persistence of our emotional practices of blame and praise.
  *   **Motivation:** P.F. Strawson's argument that we cannot abandon these attitudes without losing our humanity.
  *   **Status:** **Camp Preference.** (Compatibilists say preserve them; Hard Determinists/Impossibilists say they are theoretically unjustified even if psychologically inevitable).

  ---

  ### IV. The Incompatible Pair (The Trap)
  *These two desiderata cannot be jointly satisfied. This is where the Basic Argument generates the impossibility result.*

  *   **Desideratum A:** **Responsibility for Acts requires Responsibility for the "Way You Are."** (Requirement #7)
  *   **Desideratum B:** **Responsibility must have a Non-Derivative First Ground.** (Requirement #1 & #6 combined: No infinite regress).

  **Why they clash:** To satisfy **A**, you must have chosen your character. But to choose your character, you must have already had a character to choose *with* (which requires prior responsibility). This triggers an infinite regress. To satisfy **B**, the chain must stop somewhere (a first ground). But if the chain stops at a character you *didn't* choose, you violate **A**. You cannot have a first ground that is also self-created.

  ---

  ### V. The Knockout Requirement
  *The single constraint that eliminates the most standard positions.*

  The requirement that **"To be responsible for an action, you must be responsible for the mental nature (character/motives) that produced it"** (Requirement #7) is the most destructive.

  *   **It eliminates Compatibilism:** They explicitly deny this link, arguing you are responsible for acts if you act according to your current character, regardless of how that character was formed.
  *   **It eliminates Standard Libertarianism:** Most libertarians accept this link but admit *causa sui* (self-creation) is impossible. They try to dodge it via "agent-causation," but Strawson argues this still falls prey to the regress.
  *   **It eliminates Hard Determinism (as a theory *of* responsibility):** They agree with the requirement but conclude responsibility is therefore impossible. They survive only by abandoning the project of defining responsibility.

  This requirement forces the theory into the regress trap that no positive account of responsibility can escape.

  Verdict: Responsibility for the Way You Are
