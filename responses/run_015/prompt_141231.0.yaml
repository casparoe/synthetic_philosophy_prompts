answer: |-
  ### The Dialectical Space

  *   **Searle (Primitivism):** The locus of collective intentionality is the individual mind. The "we-intend" is a biologically primitive psychological state, irreducible to "I-intend" plus mutual belief, but still located *in the head*. Priority: Phenomenology/Cognitive Architecture.
  *   **Gilbert (Normativism):** The locus is the plural subject. Joint commitment creates a new ontological entity that generates mutual obligations and entitlements to rebuke. It is not merely psychological. Priority: Normativity/Social Bond.
  *   **Bratman (Constructivism):** The locus is the functional web of individual attitudes. Shared intention is a constellation of interlocking individual intentions, meshing subplans, and mutual responsiveness. Priority: Coordination/Action Theory.

  ### Diagnosis

  Your hypothesis is correct in its identification of the conflated questions, but it underestimates the depth of the disagreement. The stalemate is not merely verbal, nor is it simply a matter of three questions sharing a label. It is a case of **explanatory incommensurability regarding priority**. Each camp accepts that psychology, normativity, and coordination are involved in social action, but they disagree on which feature is *constitutive* of shared intention and which is derivative. Because they are optimizing for different explanatory virtues, no amount of case-based tweaking forces a concession.

  The two cases you constructed, *Silent Crew* and *Relay*, demonstrate that the concept of "shared intention" is currently doing too much metaphysical lifting. It is asked to be both the engine of coordination and the ground of obligation, while simultaneously satisfying individualistic constraints on the mind.

  **1. The Silent Crew: The Psychology-Normativity Gap**
  This case drives a wedge between the psychological capacity to coordinate and the normative bond of commitment.
  *   **Bratman** must classify this as *not* shared intention. There are no interlocking subplans or mutual responsiveness in the requisite sense; the agents are causally isolated. For Bratman, this is merely parallel individual action that happens to succeed.
  *   **Gilbert** must also classify this as *not* shared intention. Without communication or express agreement, there is no joint commitment, and thus no obligation to pull the lever. If one stranger fails to pull, the others cannot legitimately rebuke them.
  *   **Searle** is the only one who *could* classify this as shared intention, provided each individual internally adopts a we-mode despite the isolation. However, this stretches the "primitive" claim to a breaking point: if the we-intention can exist without any possibility of interaction or communication, it risks becoming indistinguishable from a solipsistic prediction of group behavior.

  **The Impasse:** The Silent Crew shows that successful coordination (the data point for Bratman) can occur without normative bonds (the data point for Gilbert). The debate stalls because Bratmanians treat the coordination as the *explanandum*, while Gilbertians treat the obligation as the *explanandum*. They are not disagreeing about the facts of the case; they are disagreeing about whether the label "shared intention" applies to coordination without obligation.

  **2. The Relay: The Synchronic-Diachronic Gap**
  This case drives a wedge between the synchronic psychological state and the diachronic agency of the collective.
  *   **Searle** struggles significantly here. A "we-intend" is a psychological state held by an individual. In the Relay, no single individual ever holds the intention for the whole project, and there is no overlap between members. For Searle, the collective agency dissolves into a chain of distinct individual intentions.
  *   **Bratman** faces a similar hurdle regarding mutual responsiveness. One cannot be mutually responsive to a predecessor who is dead or gone. He must treat the "project" as a fictional agent or rely on a very thin notion of plan persistence.
  *   **Gilbert** handles this best. The plural subject is an entity distinct from its members. The joint commitment can persist through membership turnover, binding new members to the original plan via the institution itself.

  **The Impasse:** The Relay shows that collective agency (the persistence of the project) can exist without a synchronic shared psychological state. Searle and Bratman are committed to a methodological individualism that cannot easily account for institutional persistence without ad hoc adjustments. Gilbert's ontology accommodates this naturally but at the cost of positing a "plural subject" that individualists find metaphysically suspect.

  **Conclusion on the Stalemate:**
  The debate has not moved because the participants are not arguing over the same phenomenon.
  *   Searle is analyzing the **cognitive capacity** for sociality.
  *   Gilbert is analyzing the **normative structure** of association.
  *   Bratman is analyzing the **functional mechanics** of coordination.

  When they argue over cases, they are effectively talking past one another. A Bratmanian rejects the *Silent Crew* as data because it lacks the functional web; a Gilbertian rejects it because it lacks the normativity. They are not changing camps because admitting the other side's data would require abandoning their primary explanatory commitment (e.g., for Bratman to accept *Silent Crew* as shared intention would be to abandon the requirement of interlocking intentions, collapsing his view into Searle's).

  ### What Would Count as Progress

  Stalemate is the rational expectation so long as the field seeks a **univocal theory of shared intention**. Progress requires a shift from competition to **stratification**. We must stop asking "Which theory is true?" and start asking "Which theoretical posit is required for which layer of social reality?"

  **1. A Change of Question: Fragmentation of the Concept**
  Progress would look like the dissolution of "shared intention" into distinct technical concepts. We should explicitly distinguish:
  *   **Shared Intentionality (Psychological):** The cognitive capacity to represent group goals (Searle's domain).
  *   **Joint Commitment (Normative):** The creation of mutual obligations (Gilbert's domain).
  *   **Interlocking Agency (Functional):** The mechanical coordination of plans (Bratman's domain).

  A paper that successfully argues that *Silent Crew* exhibits Shared Intentionality but lacks Joint Commitment, while *Relay* exhibits Interlocking Agency without synchronic Shared Intentionality, would represent genuine progress. It would map the boundaries of the concepts rather than fighting over the territory.

  **2. A Ruling on the Cases via Empirical Constraint**
  Philosophical intuition pumps are exhausted. Progress requires empirical traction on the **cognitive capacity** question. If cognitive science can demonstrate that the brain processes "we-tasks" differently than "I-tasks" even in isolation (supporting Searle), or if it shows that "we-processing" is entirely dependent on modeling the other's specific intentions (supporting Bratman), the psychological half of the debate could be settled. This would not solve the normative question (Gilbert), but it would decouple the psychology from the normativity, forcing the Gilbertians to defend their plural subjects without relying on claims about individual mental states.

  **3. Acceptance of Pluralistic Ontology**
  Finally, progress requires the philosophical community to accept that social ontology may be **layered**. It is possible that:
  *   At the level of the *mind*, Searle is right (we have primitive we-capacities).
  *   At the level of *interaction*, Bratman is right (coordination requires interlocking plans).
  *   At the level of *institution*, Gilbert is right (obligations require plural subjects).

  The impasse persists because each side claims their layer is the *fundamental* one. A synthesis that acknowledges the autonomy of each layer—admitting that a *Relay* project is a Gilbertian plural subject even if the workers only have Bratmanian interlocking intentions—would allow the debate to move from "elimination" to "integration." Until then, we are simply refining three different theories of three different phenomena that unfortunately share a name.
