al text, provide a brief structured summary as a JSON object with exactly these named fields: "core_question" (a concise statement), "niche_intervention" (the specific conceptual move being proposed), "method" (the analytical strategy), "success_criterion" (what a positive result looks like), "failure_criterion" (what would make the project fail), and "scope_note" (the realistic assessment).
