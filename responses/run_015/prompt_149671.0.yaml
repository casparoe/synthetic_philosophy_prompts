  # Research Proposal: Ontic Untrackability and the Failure of Shadowing in Non-Hyperbolic Chaotic Systems

  ## 1. Introduction and Problem Statement

  The relationship between metaphysical determinism and epistemic predictability constitutes one of the enduring problems in the philosophy of science. The standard consensus, solidified during the chaos theory revolution of the late twentieth century, maintains a sharp binary distinction: a system may be metaphysically deterministic (governed by unique evolution equations) while remaining epistemically unpredictable (due to sensitive dependence on initial conditions). In this standard view, chaos represents an epistemic limitation rather than a metaphysical indeterminism. The Laplacean Demon, possessing infinite precision, could theoretically predict the future of a chaotic system; human observers cannot due to finite measurement resolution.

  This consensus relies heavily on the mathematical validity of the Shadowing Lemma. In uniformly hyperbolic chaotic systems, the lemma guarantees that a noisy numerical trajectory (representing our imperfect measurement and computation) remains uniformly close to *some* true trajectory of the system. Thus, even if we cannot predict *the* specific trajectory the system will take, we can be confident that our simulation tracks *a* possible physical history. The error is contained within the manifold of true possibilities.

  However, this philosophical resolution faces a critical challenge in non-hyperbolic chaotic systems. Many physical systems of interest—particularly those in celestial mechanics, fluid dynamics, and plasma physics—exhibit mixed phase spaces containing both regular islands and chaotic seas. In these non-hyperbolic contexts, the Shadowing Lemma often fails. Numerical trajectories may diverge not merely from a specific true trajectory due to exponential error growth, but from *all* true trajectories in the neighborhood. This phenomenon suggests a breakdown not just in our ability to know the state, but in the structural correspondence between the mathematical model and the physical history it purports to represent.

  This proposal outlines a one-semester research project culminating in a 5,000-word term paper. The project investigates whether this "shadowing failure" necessitates a revision of the standard determinism/predictability binary. Specifically, it examines whether non-hyperbolic chaos introduces a category of "ontic untrackability," where the dynamics are deterministic yet cannot be tracked even in principle by any computational model subject to finite representation, thereby disrupting the clean separation of metaphysics and epistemology.

  ## 2. Research Question and Hypothesis (Requirement a)

  **Research Question:**
  Does the failure of the shadowing lemma in non-hyperbolic chaotic systems entail a metaphysical limitation on trajectory trackability that is distinct from, and irreducible to, standard epistemic limitations regarding initial condition measurement?

  **Determinate Answer (Hypothesis):**
  Yes. The project argues that shadowing failure in non-hyperbolic systems establishes a genuinely intermediate category between determinism and unpredictability. This category is characterized as "ontic untrackability." Unlike standard unpredictability, where a true trajectory exists but is unknown, ontic untrackability implies that the relationship between the model's numerical output and the system's physical history is structurally severed. Consequently, the standard binary distinction between metaphysical determinism (ontic) and predictability (epistemic) is insufficient; it must be supplemented by a methodological category concerning the validity of trajectory reference in mixed-phase-space dynamics.

  ## 3. Critique of Standard Accounts (Requirement b)

  To justify the necessity of this new category, the paper must demonstrate why existing philosophical frameworks fail to absorb the problem of shadowing failure. The proposal identifies two dominant accounts that leave the problem unresolved.

  **The Standard Epistemic Limitation Account**
  The prevailing philosophical interpretation of chaos treats unpredictability as purely epistemic. Proponents argue that because the equations of motion are deterministic, the future is fixed. Unpredictability arises solely from SDIC (Sensitive Dependence on Initial Conditions). Under this view, shadowing failure is dismissed as an extreme case of measurement error. If we knew the initial conditions with infinite precision, we would identify the true trajectory.
  *Critique:* This account conflates the existence of a solution with the ability of a computational model to refer to it. In non-hyperbolic systems, shadowing failure implies that for a given numerical orbit generated by a computer (which is necessarily discrete), there may be *no* continuous true trajectory within a reasonable error bound. If the model cannot shadow *any* true history, the claim that "the future is fixed" becomes operationally vacuous for that model. The limitation is not just that we don't know *which* trajectory is true, but that our method of accessing trajectories (numerical integration) loses its reference to the ontic state space entirely. Reducing this to "measurement error" ignores the structural instability of the phase space itself.

  **The Computational Irreducibility Account**
  A second account, often associated with complex systems theory, suggests that some systems are computationally irreducible. This means the only way to determine the future state is to simulate every step; no shortcut exists.
  *Critique:* Computational irreducibility addresses the *cost* of prediction, not the *existence* of a corresponding trajectory. A system can be irreducible yet still shadowable (every step is hard to compute, but the computed steps stay close to reality). Shadowing failure is more profound: it suggests that the discrete steps of the simulation may drift into regions of phase space that no physical trajectory occupies. Therefore, computational irreducibility does not capture the specific ontological disconnect introduced by non-hyperbolic shadowing failure. It explains why prediction is hard, but not why the model might cease to represent a possible physical history.

  By demonstrating the insufficiency of these two accounts, the paper will clear the conceptual space for the proposed "ontic untrackability" category.

  ## 4. Methodological Approach (Requirement c)

  **Conceptual Distinctions**
  The argument will rely on precise conceptual differentiation rather than historical exegesis or novel mathematical derivation. The following distinctions will be central:
  1.  **Metaphysical vs. Methodological Determinism:** Metaphysical determinism concerns the unique evolution of physical states. Methodological determinism concerns the ability of a formal model to replicate that evolution. The project argues that shadowing failure breaks the link between the two.
  2.  **Ontic vs. Epistemic Chaos:** Ontic chaos refers to the structural properties of the system (e.g., positive Lyapunov exponents). Epistemic chaos refers to the observer's inability to predict. The project posits a third category: Model-System Decoupling.
  3.  **Strong vs. Weak Shadowing:** Strong shadowing implies a true trajectory exists close to the numerical one for all time. Weak shadowing implies this holds only for finite time. The analysis will focus on systems where even weak shadowing bounds become physically meaningless over relevant timescales.

  **Argument Structure**
  The 5,000-word paper will be structured as follows:
  1.  **Introduction (750 words):** Define the standard determinism/predictability binary and introduce the Shadowing Lemma as its mathematical guarantor.
  2.  **The Non-Hyperbolic Challenge (1,000 words):** Explain the physics of mixed phase spaces and the specific nature of shadowing failure without excessive formalism. Focus on the philosophical implication: the divergence from *all* true trajectories.
  3.  **Critique of Reductionist Accounts (1,000 words):** Argue against the Epistemic Limitation and Computational Irreducibility accounts as detailed in Section 3 of this proposal.
  4.  **Proposing Ontic Untrackability (1,500 words):** Develop the positive argument for the intermediate category. Define "trackability" as a relational property between model and world. Argue that when shadowing fails, determinism remains true metaphysically, but the system becomes "untrackable" in a way that is not merely about knowledge, but about representational capacity.
  5.  **Implications and Conclusion (750 words):** Discuss how this alters philosophical discussions of scientific realism and modeling. Conclude that the binary must be replaced by a triad: Deterministic/Trackable, Deterministic/Untrackable, and Indeterministic.

  **Justification of Approach**
  This conceptual-analytic approach is preferable to alternatives for two reasons. First, a **historical survey** would be ill-suited because the mathematical results regarding non-hyperbolic shadowing are contemporary and ongoing; the philosophical implications have not yet been historically sedimented. The problem is structural, not genealogical. Second, a **formal modeling approach** (attempting to prove new shadowing theorems) is outside the scope of a philosophy term paper and risks obscuring the conceptual implications under technical derivation. The goal is not to solve the math, but to interpret the philosophical consequences of existing mathematical results. By focusing on conceptual analysis, the paper remains accessible to a philosophical audience while maintaining rigor regarding the scientific content.

  ## 5. Success and Failure Conditions (Requirement d)

  **Success Criteria**
  A successful result will achieve the following:
  1.  **Conceptual Clarity:** Clearly distinguish "unpredictability due to SDIC" from "untrackability due to shadowing failure." The paper must demonstrate that these are not merely degrees of the same problem but qualitatively distinct issues.
  2.  **Irreducibility:** Successfully argue that the shadowing failure cannot be reduced to a lack of initial condition precision. It must show that even with arbitrary precision in initial conditions, the structural instability of the non-hyperbolic region prevents the numerical model from maintaining reference to a true trajectory.
  3.  **Philosophical Payoff:** Demonstrate how this intermediate category impacts broader debates, such as scientific realism. If models cannot track true trajectories in deterministic systems, what status do these models hold? A successful paper will offer a nuanced view of model validity.

  **Failure Conditions**
  The project will be considered to have failed if:
  1.  **Collapse to Epistemology:** The analysis ultimately shows that shadowing failure is just a severe case of initial condition uncertainty. If it can be argued that "perfect" knowledge (beyond physical possibility) would restore shadowing, then the problem remains epistemic, and the proposed "ontic untrackability" category collapses.
  2.  **Mathematical Overreach:** The paper attempts to make mathematical claims that are contested or incorrect (e.g., claiming shadowing fails universally in non-hyperbolic systems when it may hold in specific subsets). This would undermine the philosophical argument built upon them.
  3.  **Triviality:** The proposed category of "untrackability" turns out to be synonymous with "unpredictable." If no distinct philosophical work is done by the new term, the intervention is unnecessary.

  ## 6. Scope and Risk Assessment (Requirement e)

  **Scope**
  The project is scoped for a single semester (approximately 12-14 weeks) and a final output of 5,000 words. This limits the depth of mathematical engagement. The paper will not derive shadowing theorems but will rely on established results from the literature regarding non-hyperbolic dynamics. The philosophical analysis will be restricted to the implications for determinism and modeling, avoiding broader tangents into free will or quantum mechanics.

  **Risks**
  1.  **Technical Complexity:** The mathematics of non-hyperbolic chaos (e.g., homoclinic tangles, stickiness effects) is dense. There is a risk of misinterpreting the technical conditions under which shadowing fails.
      *   *Mitigation:* The paper will focus on the philosophical interpretation of the *failure condition* rather than the derivation of the condition itself. I will consult standard texts on chaotic dynamics to ensure accurate characterization of the math without attempting to reproduce it.
  2.  **Philosophical Resistance:** The standard view (determinism vs. predictability) is deeply entrenched. Arguing for a third category may be met with the objection that "metaphysics is independent of modeling."
      *   *Mitigation:* The argument will concede that metaphysical determinism might hold strictly but will argue that for philosophy of science, the *accessibility* of that metaphysics via models is what matters. If the model cannot track the metaphysics, the distinction loses scientific utility.
  3.  **Time Management:** Balancing the learning curve of the mathematical concepts with the writing of the philosophical argument is tight.
      *   *Mitigation:* The first quarter of the semester will be dedicated to mastering the conceptual framework of shadowing. The second quarter to drafting the critique of standard accounts. The final quarter to refining the positive argument and editing.

  **Realistic Assessment**
  Given the constraints, it is realistic to produce a compelling argument for the *need* for this category, even if a full metaphysical defense of "ontic untrackability" remains preliminary. The primary goal is to disrupt the binary, not necessarily to solve the metaphysics of trackability completely. The 5,000-word limit is sufficient to outline the argument rigorously but requires concise writing to avoid getting bogged down in technical examples.

  ## 7. Conclusion

  This research proposal outlines a project that challenges a foundational distinction in the philosophy of physics. By focusing on the specific mathematical failure of shadowing in non-hyperbolic systems, the paper aims to show that the relationship between determinism and predictability is more complex than the standard binary allows. If successful, this work will contribute to a more nuanced understanding of scientific modeling, suggesting that in certain deterministic regimes, the world is not just unknown to us, but untrackable by our formalisms. This shifts the philosophical conversation from what we can know to what our models can structurally support, offering a fresh perspective on the limits of scientific representation.

