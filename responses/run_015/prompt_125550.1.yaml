  # Public Memory Triage Protocol: Decision Tree

  ## Part 1: The Six Branch Questions
  *These questions are designed to be asked sequentially. The routing logic (Part 2) determines which questions apply to which cases. All questions are phrased as concrete claims a panelist can agree or disagree with.*

  1.  **Time:** Should public honor be treated as a permanent grant, or does it require periodic renewal to remain?
  2.  **Access:** Does the presence of this commemoration prevent a specific group of citizens from using the public space where it stands?
  3.  **Constraint:** Is physical removal or alteration legally, contractually, or physically impossible?
  4.  **Value:** Does the object possess artistic or historical value distinct from the person or event it honors?
  5.  **Standing:** Does the subject retain sufficient public standing to justify continued honor?
  6.  **Function:** Is the object's current public function more significant than its dedicatory message?

  ## Part 2: Routing Logic & Logical Space
  *The tree does not ask every question of every object. Paths converge to produce the leaves. Combinations marked [EMPTY] are logically possible but produce no distinct leaf.*

  *   **Start at Q1 (Time).**
      *   **If Renewable:** → **Leaf A (Leasehold).** (Stop).
      *   **If Permanent:** → Ask **Q2 (Access).**

  *   **At Q2 (Access).**
      *   **If Yes (Prevents Use):** → Ask **Q3 (Constraint).**
      *   **If No (No Barrier):** → Ask **Q6 (Function).**
          *   **If Yes (Function > Message):** → **Leaf B (Use-Capture Retention).**
          *   **If No (Message ≥ Function):** → Ask **Q3 (Constraint).**
              *   **If Yes (Bound/Fixed):** → **Leaf C (Retention + Context).**
              *   **If No (Free/Movable):** → **Leaf D (Unconditional Retention).**

  *   **At Q3 (Constraint) [From Access=Yes Track].**
      *   **If Yes (Impossible to Move/Change):** → **Leaf C (Retention + Context).**
      *   **If No (Movable/Alterable):** → Ask **Q4 (Value).**

  *   **At Q4 (Value).**
      *   **If No (Disposable):** → **Leaf E (Destruction).**
      *   **If Yes (Preservable):** → Ask **Q5 (Standing).**

  *   **At Q5 (Standing).**
      *   **If Yes (Honor Valid):** → **Leaf F (Relocation).**
      *   **If No (Honor Invalid):** → Ask **Q6 (Function).**
          *   **If Yes (Function > Message):** → **Leaf G (Removal to Museum).**
          *   **If No (Message ≥ Function):** → **Leaf H (Removal to Storage).**

  ## Part 3: The Leaves (Positions)
  *Eight distinct outcomes mapped from the logical space above.*

  | Leaf | Position Name | Awkward Commitment | Move-Off Fact |
  | :--- | :--- | :--- | :--- |
  | **A** | **Leasehold** | We admit we cannot know today what values will hold in twenty years. | A legal precedent establishing that public land dedications are irrevocable property rights. |
  | **B** | **Use-Capture Retention** | We accept that skaters or protesters now own the meaning of this space more than the donor did. | Evidence that the new use is temporary or seasonal rather than a permanent shift in community practice. |
  | **C** | **Retention + Context** | We keep the honor visible but admit it requires a warning label or counter-narrative to be safe. | New engineering or legal methods that make removal feasible without destroying the object. |
  | **D** | **Unconditional Retention** | We assert that the original dedication remains the sole authoritative truth about this object. | Documented evidence that the subject's historical record was falsified at the time of erection. |
  | **E** | **Destruction** | We declare that some objects are morally toxic and deserve no future existence, even as warnings. | Discovery that the object is the last surviving work of a historically significant artist. |
  | **F** | **Relocation** | We agree the subject is still a hero, just not for this specific neighborhood or prominence. | Consensus that the subject's standing is now universally rejected, making "honor" impossible anywhere public. |
  | **G** | **Removal to Museum** | We treat the object as a weapon of history that must be disarmed and displayed behind glass. | A curatorial assessment that the object cannot be interpreted safely even in a museum setting. |
  | **H** | **Removal to Storage** | We spend public money to hide an object we deem too harmful to show but too valuable to crush. | A budget crisis that makes paid storage unsustainable, forcing a choice between display or destruction. |

  ## Part 4: Empty and Indistinguishable Leaves

  **Empty Combinations:**
  1.  **[Q4=No, Q6=Yes]:** *Disposable Object with Significant Function.*
      *   **Diagnosis:** **Incoherent.** If an object has no artistic/historical value (Q4=No) but has significant public function (Q6=Yes), the "function" *becomes* its value. It logically routes to Use-Capture Retention (Leaf B) regardless of Q4.
  2.  **[Q3=Yes, Q5=Yes]:** *Fixed Object with Valid Standing.*
      *   **Diagnosis:** **Unoccupied.** This describes a popular monument that cannot be moved (e.g., carved into a cliff). It defaults to Unconditional Retention (Leaf D), making the "Constraint" branch irrelevant. No panelist ever argues to "Contextualize" a monument they fully support.
  3.  **[Q5=Yes, Q6=Yes]:** *Honor Valid + Function Superseded.*
      *   **Diagnosis:** **Untried.** This is the "Skating Statue of a Hero" scenario. It is coherent but untried because panels usually assume Function Superseding Message invalidates Honor. It would route to Use-Capture Retention (Leaf B).

  **Indistinguishable Leaves:**
  *   **Museum (G) vs. Relocation (F):** The tree separates these by **Q5 (Standing)**. However, in practice, a "Museum" in a public park and a "Relocation" to a less prominent lawn can look identical. The distinction relies entirely on the *placard text* (Honor vs. History), not the physical object. If the panel cannot agree on the text, these two leaves merge into **"Removal to Custody."**

  ## Part 5: Integration of Live Cases & Concepts

  **Live Cases:**
  1.  **The Governor (Hospital/Sterilization):**
      *   **Route:** Q1(Perm) → Q2(Yes, harm to descendants) → Q3(No, movable) → Q4(Yes, historical) → Q5(No, standing invalid due to sterilization) → Q6(No, function is still honorific) → **Leaf G (Museum).**
      *   *Note:* If the hospital name is the issue, it routes to **Leaf C (Retention + Context)** due to Q3 (Contract/Endowment constraints often mimic physical constraints in naming).
  2.  **The Pioneer Monument (Dispossession/Grandparents):**
      *   **Route:** Q1(Perm) → Q2(Yes, Indigenous access inhibited) → Q3(No, movable) → Q4(Yes, granite/art) → Q5(No, standing contested) → Q6(Yes, now a site of protest/gathering) → **Leaf G (Museum)** or **Leaf B (Use-Capture)** depending on Q6 interpretation.
      *   *Recommendation:* Treat as **Leaf C (Retention + Context)** if Q2 is deemed "Debatable" rather than "Prevents Access," acknowledging the "grandparents" claim.
  3.  **The School Name (Endowment):**
      *   **Route:** Q1(Perm) → Q2(No, name doesn't block access) → Q6(No, function is education) → Q3(Yes, contractually bound) → **Leaf C (Retention + Context).**
      *   *Note:* Q3 (Constraint) includes contractual prohibition. The "Context" is financial transparency about the donor.
  4.  **The Obelisk (Historic/Birds):**
      *   **Route:** Q1(Perm) → Q2(Yes/No) → Q3(Yes, physically/legally impossible) → **Leaf C (Retention + Context).**
      *   *Note:* This is the strongest case for Leaf C. The "Context" must be robust (e.g., annual teaching programs) to justify the inability to remove.

  **Concepts Placement:**
  *   **Use-Capture:** This is the definition of **Q6 (Function)**. It is not a leaf itself but the *condition* for **Leaf B**. It belongs at the branch node.
  *   **Commemorative Drift:** This is the *phenomenon* that makes **Q6** necessary. It is the reason why **Leaf D (Unconditional)** is rare; drift usually pushes cases toward **Leaf B** or **Leaf G**. It is a consideration at **Q6**.

  ## Part 6: Custom Case for Hardest Distinction

  **The Hardest Distinction:** **Relocation (F)** vs. **Museum (G).**
  *Both involve moving a valuable object because the current honor is contested. The split relies entirely on Q5 (Standing).*

  **Custom Case:** *A 1950s statue of a Police Chief credited with modernizing the force but also known for authorizing illegal surveillance of civil rights leaders. The statue is moved from City Hall to the courtyard of the Police Academy.*
  *   **If the plaque reads:** "Chief X, who modernized our force." → **Relocation (F).** (Honor Valid).
  *   **If the plaque reads:** "This statue depicts the era of surveillance. Chief X authorized illegal acts." → **Museum (G).** (Honor Invalid, Artifact Preserved).
  *   **Why this separates them:** The physical object and location are identical. The tree forces the panel to vote on **Q5 (Standing)** before deciding the move, preventing them from hiding the philosophical disagreement behind the logistics of moving the statue.
