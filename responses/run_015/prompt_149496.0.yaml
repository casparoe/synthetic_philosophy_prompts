answer: |-
  1. **The Scenario**
  You are convening a clinical governance review for a busy orthopedic ward managing post-operative knee replacements. The committee must decide whether to authorize an emergency fasciotomy based on reviewer votes for Acute Compartment Syndrome (ACS). The condition is rare but catastrophic if missed (limb loss), whereas unnecessary surgery carries minor risks (scarring, infection). Reviewers are senior residents working night shifts; they vote "Treat" or "Observe" by secret ballot, and the majority verdict is binding. They are independent and homogeneous, but the decision rule is a simple headcount that ignores how confident each reviewer feels.

  2. **The Numbers**
  *   **Base Rate ($p$):** 0.010 (1% of post-op knees develop ACS). *Justification:* ACS is a known but uncommon complication in this specific surgical cohort.
  *   **Competence in Disease ($q_D$):** 0.30 (30% sensitivity). *Justification:* Pain is subjective; tired residents systematically attribute early ACS pain to normal surgical trauma unless signs are blatant.
  *   **Competence in Health ($q_H$):** 0.90 (90% specificity). *Justification:* Normal post-op pain patterns are familiar and easily recognized as benign by experienced staff.
  *   **Cost of False Negative ($C_{FN}$):** 1,000 units (Amputation/Permanent disability). *Justification:* Represents the total clinical and legal burden of a missed limb-threatening diagnosis.
  *   **Cost of False Positive ($C_{FP}$):** 10 units (Unnecessary fasciotomy). *Justification:* Represents the cost of an extra OR slot, minor scarring, and antibiotic prophylaxis.

  3. **The Arithmetic**
  *   **$n = 1$:**
      *   Accuracy: $0.01(0.30) + 0.99(0.90) = \mathbf{0.894}$
      *   Expected Cost: $0.01(0.70)(1000) + 0.99(0.10)(10) = 7.00 + 0.99 = \mathbf{7.99}$
  *   **$n = 3$:** (Majority needs 2 votes)
      *   Accuracy: $0.01(0.216) + 0.99(0.972) = \mathbf{0.964}$
      *   Expected Cost: $0.01(0.784)(1000) + 0.99(0.028)(10) = 7.84 + 0.28 = \mathbf{8.12}$
  *   **$n = 9$:** (Majority needs 5 votes)
      *   Accuracy: $0.01(0.133) + 0.99(0.999) = \mathbf{0.990}$
      *   Expected Cost: $0.01(0.867)(1000) + 0.99(0.001)(10) = 8.67 + 0.01 = \mathbf{8.68}$
  *   **Limit ($n \to \infty$):**
      *   Accuracy: Converges to $1 - p = \mathbf{0.990}$ (Perfect on common state, perfect error on rare state).
      *   Expected Cost: Converges to $p \cdot 1 \cdot C_{FN} = \mathbf{10.0}$ (You will eventually miss every single case of ACS).

  4. **The Single Feature**
  The driver is **asymmetric competence relative to the decision threshold**: the voters are better than chance overall (89.4%), but *worse than chance* specifically in the rare, high-cost state ($q_D = 0.30 < 0.50$). The majority rule amplifies this specific incompetence while suppressing the low-cost errors, raising overall accuracy while increasing expected harm.

  5. **Sensitivity Analysis**
  If you lift $q_D$ above 50% (e.g., to 0.60), the case collapses: both error rates drop monotonically, and Expected Cost falls alongside the error rate. If you equalize the costs ($C_{FN} = C_{FP}$), the case collapses: Expected Cost becomes proportional to the Total Error Rate, which decreases as accuracy rises. The paradox only exists where high-stakes incompetence is masked by low-stakes competence.

  6. **Counter-Argument & Rebuttal**
  *   **Attack:** "This isn't a failure of adding reviewers; it's a failure of your voters. If they're only 30% sensitive, they aren't 'better than chance' on the thing that matters, so you shouldn't be using them."
  *   **Rebuttal:** That redefines "better than chance" from *overall accuracy* (the standard governance metric) to *state-specific sensitivity*. In real hospitals, we credential clinicians based on overall performance. My point is that a committee of fully credentialed, independent, overall-competent clinicians can still become *more dangerous* as you add more of them, if the aggregation rule doesn't account for cost asymmetry.

  7. **Closing Line**
  "Accuracy tells you how often the committee is right; cost tells you how much it hurts when they're wrong—adding more voices to a majority vote will always improve the former, but in rare diseases, it can silently destroy the latter."

  8. **Rule Defect Analysis**
  This dependence on voters being "un-alarmed" in the rare state is a **feature of the scenario** (clinical reality of subtle rare diseases) but a **defect of the decision rule** (simple majority). A real committee that knew these numbers could fix it trivially by changing the aggregation rule to "Any-Positive-Vote-Wins" (OR gate) rather than Majority. Under an OR gate, sensitivity becomes $1 - (1-0.30)^9 = 0.96$, and cost plummets. However, your talk remains valid because clinical governance rarely changes voting rules; it simply adds reviewers to the existing majority/consensus process. Your warning is that *adding voters without changing the rule* is what creates the risk.
