      *   *Computability:* While intuitionism aligns closely with constructivism (and thus computability), Brouwer's "mental construction" is not bound by finite mechanical steps in the way a Turing machine is. It relies on the *intuition of time*.
      *   *Verdict:* Distinguish between "effective procedure" (computational) and "mental construction" (intuitionistic). The latter validates the former, but is not reducible to it. The 1908 text is about *logic*, not *computability theory*.

