  **MEMORANDUM**

  **TO:** All Claims Adjusters, Underwriting Staff, Loss Prevention Division
  **FROM:** Marcus Vane, Senior Compliance Officer
  **DATE:** 14th of Rabi' al-Awwal, 2024
  **SUBJECT:** Mandatory Revision of Causal Attribution in Claims Processing and Policy Language

  **1.0 PURPOSE**
  This circular serves to align corporate communications with the Divine Agency Statute (Section 44-B). Effective immediately, all personnel must cease attributing causal efficacy to created entities. Secondary causes do not exist. Fire does not burn; cotton does not combust. These are merely occasions upon which the Primary Agent enacts His Custom. Our documentation must reflect this ontological reality without compromising actuarial reliability.

  **2.0 LINGUISTIC COMPLIANCE**
  Verbs implying creaturely power are prohibited in all official correspondence. Adjusters must not state that a spark "ignited" a warehouse. Instead, filings must read: "A spark was present subsequent to which combustion occurred." Sprinkler systems do not "extinguish" fires. Correct phrasing: "Water was dispersed, and combustion ceased." We acknowledge the uniformity of the Custom; fire is reliably followed by ash. However, the power resides solely elsewhere. Use of words such as "cause," "effect," "produce," or "prevent" will result in immediate textual correction.

  **3.0 CLAIMS ASSESSMENT AND CUSTOMARY DEVIATION**
  Claims are paid based on the regularity of the Divine Custom, not on liability. Since no employee or client possesses agency, liability is a null concept. However, where the Custom fails to manifest—e.g., fire is present among combustibles yet no combustion occurs—the event is classified as a Customary Deviation Event (CDE).
  3.1 Adjusters must flag CDEs for theological audit rather than financial payout.
  3.2 A non-burning warehouse is not a saved asset; it is a miracle. Miracles are non-contractual. Clients expecting coverage for continued existence during a CDE are reminded that the Custom is contingent, not necessary.

  **4.0 PERSONNEL AND PERFORMANCE**
  Performance reviews must be adjusted to reflect the absence of human agency.
  4.1 No employee is responsible for errors. An incorrect calculation was not "made" by the analyst; it occurred during the analyst's tenure.
  4.2 Conversely, no employee is credited with successes. A profitable quarter was not "achieved" by the sales team.
  4.3 Bonuses based on individual efficacy are hereby suspended. Compensation is now a flat stipend acknowledging presence, not output. Morale is not the responsibility of Management, as Management cannot cause morale.

  **5.0 LOSS PREVENTION AND ONTOLOGICAL STABILITY**
  Following legal counsel, the Loss Prevention Division is dissolved. Safety inspections imply that human intervention can alter the sequence of events. This is legally indefensible. We cannot "prevent" loss; we can only observe whether loss was occasioned.
  5.1 All client safety recommendations are withdrawn. Suggesting a client store chemicals separately implies the chemicals possess a nature that can be managed. They do not.
  5.2 To mitigate risk, a new "Ontological Stability Premium" (OSP) is added to all fire policies. While the Custom is reliable, it is not logically necessary. The OSP covers the risk that the Custom shifts toward higher combustion intensity.
  5.3 Clients who object to paying for protection against a change in Divine Custom are reminded that their objection is itself occasioned by the Primary Agent.

  **6.0 AUTHORIZATION**
  I did not write this memo. The text appeared through me pursuant to the Custom. I take no credit for its clarity nor blame for its inconveniences. Compliance is mandatory, though mandating implies a power I do not possess. Simply: Compliance occurs.

  **CC:** Legal Department, Board of Directors, The Great Chain of Being

  ***

  **Note for your teacher:**

  I tried to honor the Ghazālī vs. Hume distinction you mentioned. Hume says we *can't know* if there's necessary connection (skepticism about the world); Ghazālī says there *isn't* one, but the regularity is real because God wills it consistently (ontological claim). The memo treats the regularity as rock-solid (no "we can't know" hedging) but denies the *power* transfer. I avoided the "atomist" time-recreation stuff (that the world is destroyed and remade every instant) because that complicates the insurance logic too much—if the world disappears every second, insurance contracts can't persist. I stuck to *causal* occasionalism (no secondary causes) which fits the "fire doesn't burn" example better. The "gross" bit (closing safety inspections) follows from the idea that if humans have no causal power, safety measures are literally useless theater, which lets the company save money while pretending to be pious.
