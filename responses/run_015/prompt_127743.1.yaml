answer: |-
  This is a classic debate in the philosophy of biology, touching on biosemiotics, the nature of information, and the status of biological functions. Both Jordan and Riley are articulating well-established philosophical positions. Jordan is arguing from a **Biosemiotic Realist** perspective (similar to philosophers like Peter Godfrey-Smith or Eva Jablonka), while Riley is arguing from a **Mechanistic/Deflationary** perspective (similar to Alex Rosenberg or Jacques Monod).

  Here is a move-by-move referee analysis, followed by a verdict on the specific philosophical questions you raised.

  ### Move 1: Jordan's Claim on Arbitrariness
  **Jordan's Argument:** The mapping between codons and amino acids is chemically arbitrary (the "frozen accident" hypothesis). Because the mapping is specific but not chemically necessitated, it constitutes a symbolic relationship, implying literal semantic content.

  *   **Assessment:** Jordan is scientifically correct that the code is arbitrary; there is no chemical affinity that forces UUU to code for Phenylalanine. Philosophically, Jordan is relying on the **Causal Theory of Information**. If state A reliably causes state B, but could have caused state C (arbitrariness), A carries information about B.
  *   **Where Jordan is Right:** Arbitrariness is a necessary condition for symbolism. If the bond were chemically necessary (like a key in a lock), it would be mere mechanics, not code.
  *   **Where Jordan is Vulnerable:** Arbitrariness is not a *sufficient* condition for semantics. A random number generator produces arbitrary outputs, but they mean nothing. Jordan needs to explain where the *normativity* comes from (i.e., why is a mutation an "error" rather than just a different chemical state?).

  ### Move 2: Riley's Reply on Convention and Teleology
  **Riley's Argument:** Linguistic arbitrariness requires convention (agreement among agents). DNA mapping is evolutionary contingency, not agreement. Ribosomes are chemical catalysts, not interpreters. Attributing semantics risks reintroducing pre-Darwinian teleology (purpose without a purposer).

  *   **Assessment:** Riley is defending a **Gricean or Peircean view of meaning**, which typically requires intentionality. Riley is also correctly identifying the risk of "spooky" teleology.
  *   **Where Riley is Right:** There is no "agreement" in evolution. No cell sat down and decided UUU means Phenylalanine. Furthermore, calling a ribosome an "interpreter" can obscure the actual physical mechanism (steric fit, hydrogen bonding).
  *   **Where Riley is Vulnerable:** Riley assumes Darwin eliminated *all* teleology. Modern philosophy of biology distinguishes between **teleology** (mystical purpose) and **teleonomy** (function derived from natural selection). A heart is *for* pumping blood, not because of a designer, but because ancestors with pumping hearts survived. Riley's strict mechanistic view risks eliminating the concept of "biological function" entirely, which makes doing biology difficult.

  ### Move 3: Jordan's Computer Analogy
  **Jordan's Argument:** Computer code is literal code even without a conscious reader present at the moment of execution. The syntax maps to function. Therefore, DNA is analogous to software; denying DNA is code forces you to deny software is code when the programmer isn't looking.

  *   **Assessment:** This is Jordan's strongest move. It shifts the debate from "conscious interpretation" to "functional architecture."
  *   **Where Jordan is Right:** Software runs autonomously. The CPU does not "know" what it is doing, yet we still call it code. This supports the idea that "interpretation" can be a physical process (transduction) rather than a mental one.
  *   **Where Jordan is Vulnerable:** The analogy hides the **origin** of the code. Software code exists because an intelligent agent imbued the physical states with meaning. The silicon doesn't *intrinsically* mean anything; it inherits meaning from the engineer.

  ### Move 4: Riley's Counter on Selection vs. Interpretation
  **Riley's Argument:** Without an engineer, silicon is just sand. Evolutionary selection is causal filtering (things that didn't work died), not interpretation (writing a message). Pushing interpretation into history confuses cause (survival) with meaning (representation).

  *   **Assessment:** This is the strongest philosophical objection. It targets the **source of intentionality**.
  *   **Where Riley is Right:** Selection is a negative filter; it removes failures. It does not positively encode messages. To say DNA is a "code" implies a sender, but evolution has no sender.
  *   **Where Riley is Vulnerable:** Riley might be setting the bar for "literal code" too high. If a system *behaves* exactly like a coded system (storage, retrieval, error correction, translation), the distinction between "literal" and "metaphor" becomes pragmatic rather than ontological.

  ---

  ### Verdict on the Specific Questions

  #### 1. Can arbitrariness without conventional agreement ground literal semantics?
  **Verdict: No, not "literal semantics" in the linguistic sense, but yes for "biological information."**

  Riley is right that **conventional agreement** is required for *linguistic* semantics (meaning that can be true or false). DNA cannot be "false" in the way a sentence can; a mutation is just a different physical state that might be lethal.

  However, Jordan is right that **arbitrariness + function** grounds a robust sense of **biological information**. In information theory (Shannon), meaning isn't required, only correlation. In biology, we add "function" (selected effect).
  *   **Refereeing:** If you define "literal code" as requiring a mind, Riley wins. If you define "literal code" as a physical system where the mapping between sign and effect is contingent and functional, Jordan wins. Most philosophers of biology currently side with **Jordan on the functional description** but add a caveat: it is "derived intentionality" (like software), not "intrinsic intentionality" (like human thought).

  #### 2. Does the absence of an engineer or interpreter undermine the DNA and software analogies symmetrically?
  **Verdict: No, the analogy is asymmetric regarding origin, but symmetric regarding operation.**

  This is the crux of the disagreement.
  *   **Symmetry (Operation):** Jordan is right. Once software is written, it runs without the programmer. Once DNA is inherited, it functions without the ancestor. In both cases, the physical system carries the "instructions" dispositionally.
  *   **Asymmetry (Origin):** Riley is right. Software inherits meaning from a designer (Derived Intentionality). DNA's "meaning" is derived from **natural selection**, which is a blind process.
      *   Software: Designer $\rightarrow$ Code $\rightarrow$ Function.
      *   DNA: Selection $\rightarrow$ Code $\rightarrow$ Function.

  Riley's point that "silicon is just sand" without an engineer is powerful. However, Jordan can reply that "DNA is just chemistry" without a *cellular context*. The "interpreter" for DNA is not a mind, but the **ribosome/cell machinery**. The "engineer" for DNA is **natural selection**.

  ### Final Refereeing

  **Who is right?**
  *   **Jordan is right** that calling DNA a "metaphor" is unhelpful. The machinery of life (transcription, translation, error correction) is structurally isomorphic to information processing. Denying this obscures how biology actually works. The "code" is literal in the sense that the *mapping rules* are distinct from the *physical substrate*.
  *   **Riley is right** that we must be careful not to smuggle in a "homunculus" (a little man inside the cell reading the DNA). There is no *semantic* interpretation, only *causal* transduction. Riley is also right that the computer analogy breaks down if Jordan implies DNA has a "designer."

  **The Synthesis:**
  The disagreement is largely about the definition of "literal."
  *   If "literal code" implies **agency**, Riley wins (DNA is not a message from anyone).
  *   If "literal code" implies **functional architecture**, Jordan wins (DNA operates as a digital coding system).

  **Recommendation for the Study Group:**
  Adopt the distinction between **Shannon Information** (Jordan's focus: arbitrary mapping, transmission) and **Semantic Information** (Riley's focus: truth, reference, agents).
  *   DNA literally carries **Shannon Information** (it is a code in the engineering sense).
  *   DNA metaphorically carries **Semantic Information** (it is not a "message" in the linguistic sense).

  Jordan is correct that the *mechanism* is coding. Riley is correct that the *ontology* is chemistry filtered by selection, not communication. You can tell Jordan they win on **biology**, but Riley wins on **philosophy of language**. The most precise view is that DNA is a **naturalized code**: it functions exactly like a code, but its "meaning" is reduced to reproductive success rather than truth conditions.
