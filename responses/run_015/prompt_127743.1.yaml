      *   **Riley's Position (Deflationary/Causal-Mechanistic):**
          *   *Premise 1:* True semantics requires convention/agreement among agents (Gricean/Peircean view).
          *   *Premise 2:* Evolution is causal filtering, not intentional agreement.
          *   *Premise 3:* Ribosomes are chemical machines, not interpreters.
          *   *Conclusion:* Calling DNA a "code" is a useful metaphor, but literally it's just chemistry. Attributing semantics risks reintroducing teleology (purpose) without a purposer.
          *   *Underlying Philosophy:* Mechanistic view, skepticism of biological teleology (e.g., Rosenberg, maybe early Monod).

      *   **The Computer Analogy Clash:**
