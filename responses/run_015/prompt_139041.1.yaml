  ### **Limitations: What This Game Cannot Teach**

  You asked for an honest forecast of the game's simplifications. You are correct in your suspicion.

  **1. The Finite Payoff Problem**
  *   **The Flaw:** In the game, War is -50 points. A rational player might accept a 10% risk of -50 to gain +10 Territory (Expected Value calculation).
  *   **Reality:** In nuclear crises, the payoff is not finite. It is lexicographic (Peace > War, regardless of Territory).
  *   **How to Raise It:** In the last 5 minutes, say: *"You calculated Expected Utility. You treated War as a cost. In 1962, Kennedy did not calculate utility. He treated War as an absolute constraint. This game simulates the **logic** of brinkmanship, but it cannot simulate the **moral/ontological** weight of nuclear war. You played a game; they played for existence."*

  **2. Uncertainty of Resolve**
  *   **The Flaw:** In the game, AP costs and Payoffs are common knowledge. Everyone knows everyone else wants to avoid -50.
  *   **Reality:** Crises happen because State A doesn't know if State B is willing to absorb the cost.
  *   **How to Raise It:** *"Here, you knew your opponent was rational. In reality, you fear the opponent is irrational, or that their domestic politics force their hand. The game removed the uncertainty of types, which is usually the driver of crisis."*

  **3. The "Magnitude" Simplification**
  *   **The Flaw:** We modeled Magnitude as a score multiplier (-50 vs -100).
  *   **Reality:** Magnitude isn't just "more points lost." It's a qualitative change in the nature of the conflict (conventional vs. nuclear).
  *   **How to Raise It:** *"You treated Magnitude as arithmetic. In reality, crossing the nuclear threshold changes the physics of the game, not just the score."*

  ### **Instructor's Cheat Sheet (The "Why")**

  *   **Why separate Alert/Deploy?** To force them to feel the cost of credibility. If *Alert* worked, they'd never *Deploy*. *Deploy* must be the only path to victory, forcing them to surrender agency.
  *   **Why the Custodian Token?** To localize responsibility. It makes the "Last Clear Chance" a physical object they can resent holding.
  *   **Why Misperception Block?** To break the illusion of control. In Block 1, they choose risk. In Block 2, risk chooses them.

  This design fits your constraints, uses portable materials, and forces the specific theoretical insights you need without requiring a pre-game lecture. The mechanics do the teaching; you do the mapping.
