  ### **Forecast of Failure Modes & Handling**

  | Failure Mode | Prediction | Handling Note |
  | :--- | :--- | :--- |
  | **Collusion** | Pairs agree to split points (Trade Territory, no Risk). | **Randomize Pairings:** Change partners every round. **Anonymous Scoring:** Collect sheets privately. In debrief, highlight that collusion fails in multi-player tournaments. |
  | **Finite Payoff** | Students treat -50 as just a number, not "death." | **Reframe:** In debrief, state: "In reality, -50 is not a score. It is the end of the game. If you rolled War, you are out of the PhD program." Make it visceral. |
  | **The Rogue** | One pair escalates to War for fun/chaos. | **Design:** War hurts *both* equally (-50). There is no "glory" in mutual destruction. If it happens, use it: "Look at the cost of losing control." |
  | **Gaming the LCC** | Players refuse the Custodian Token entirely. | **Rule:** Token *must* be held at start of Round 3. If dropped on floor, dealer assigns it. This forces the responsibility. |
  | **Time Drift** | Negotiations drag past 90 mins. | **Hard Stop:** The bell is the nuclear launch authority. If talking when it rings, roll for War. This *teaches* the cost of delay. |

