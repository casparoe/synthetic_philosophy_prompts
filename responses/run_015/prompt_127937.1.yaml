  8.  **Final Polish:** Ensure the tone isn't condescending. Make sure the distinction between *Consequentialism* (outcomes) and *Virtue Ethics* (character/intent) is clear, as that's the core of Dave's "just be decent" fallback. (Self-correction: Keep it accessible, don't get too bogged down in jargon).

