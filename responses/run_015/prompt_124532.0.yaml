      *   *Check Step (4):* The claim is "Each rival can be elaborated so as to be consistent with all the evidence." This is the Duhem-Quine thesis applied to biology. It's technically true that you can save a hypothesis by adjusting background assumptions. But *scientific* warrant isn't just consistency; it's *likelihood*.
      *   *Key Insight:* The argument treats "consistency with evidence" as the only metric for warrant. It ignores *explanatory power* and *simplicity*. A hypothesis that says "Selection did it" vs "Constraint did it" might both fit the shape. But if "Constraint" requires assuming a weird developmental law that violates known physics, it loses.
      *   *Focus on the Flange:*
          *   A (Ballast): Explains vascularization (bone growth for density regulation?), explains timing (appears with aquatic shift).
          *   B (Architectural): Explains shape. Does it explain vascularization? If vascularization is needed for the architectural stiffening, fine. If not, B needs an add-on.
