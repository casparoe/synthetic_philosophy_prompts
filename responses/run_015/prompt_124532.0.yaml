      *   *Confidence:* I need to be careful not to sound like a naive adaptationist. I must uphold the Spandrels insight. The insight is about *burden of proof*, not *impossibility of proof*.

  6.  **Final Polish:**
      *   Ensure the tone is appropriate for a grad student (rigorous, technical but clear).
      *   Make sure the "Flange" example is used concretely.
      *   Address the "Historical Science" generalization (8).
      *   Explicitly state confidence levels as requested.

  7.  **Final Review against constraints:**
