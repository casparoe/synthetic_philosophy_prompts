  3. Commitment (e) clashes with (a) because totalist population axiology lacks a coherent baseline for ex ante comparisons when different individuals occupy slots under different policies.
  4. The tension between (b) and (f) is merely apparent since private orthodoxy can coexist with public robustness, though it costs you personal endorsement of the public recommendation.
  5. Adopting a credence threshold in (b) is the least severe cost compared to abandoning USP or (c), and it is the single revision that cleans up the most contradictions.
