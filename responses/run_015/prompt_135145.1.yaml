          *   *Assessment:* Generally accurate. Plutarch does aim to show virtue is universal across Greek/Roman divide.
      *   *Sentence 2:* "The pairing prevents hero-worship because there's always a counter-figure, and the reader feels zēlos, a kind of competitive emulation, then copies the best traits into his own life."
          *   *Assessment:* Good grasp of *zēlos* and the critical distance *synkrisis* provides.
      *   *Sentence 3:* "This differs from hagiography, where writers like Athanasius present the saint as a direct template—Antony's ascetic practices are meant to be literally repeated by monks."
          *   *Assessment:* Accurate regarding Athanasius (*Life of Antony*). The goal is *mimēsis* of the ascetic life.
      *   *Sentence 4:* "In hagiography the narrative details are mostly colorful background; the moral point is always the same universal virtue, so particularity doesn't really matter."
          *   *Assessment:* **Problematic.** This is the "conflation about how particularity functions in hagiography." Hagiography often relies heavily on specific miracles, struggles, and historical contexts to prove sanctity. While the *goal* is universal imitation, the *means* often require specific narrative weight to establish authority. However, the stronger critique is that hagiography *does* care about particularity, just differently (typology vs. historical specificity). But the claim that details are "mostly colorful background" is a simplification that risks missing the theological point of the specific acts.
      *   *Sentence 5:* "Plutarch, by contrast, needs concrete quirks—like how Alexander handled his horse—because without those specific details the comparison collapses into abstraction."
          *   *Assessment:* Strong. Plutarch's "small things" (words, jokes, gestures) reveal character (*ēthos*).
      *   *Sentence 6:* "His real innovation is applying Aristotelian catharsis to biography: comparing two figures purges excessive admiration and produces emotional equilibrium through balanced judgment."
          *   *Assessment:* **Major Error (Misattributed Framework).** Plutarch is a Middle Platonist. While he knows Aristotle, framing *synkrisis* as "Aristotelian catharsis" is anachronistic and conceptually off. *Catharsis* is tragic/medical. Plutarch's goal is *prokopē* (progress) or *paideia* through *paradeigma*. This is a classic grad-student buzzword drop that doesn't fit the textual evidence.
