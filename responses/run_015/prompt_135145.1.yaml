      *   **Key Concept 1:** How *synkrisis* shapes moral perception vs. direct exemplarity (*imitatio*).
      *   **Key Concept 2:** Does Plutarch require narrative particularity (unrepeatable details) to function?
      *   **Implied Knowledge:** Plutarch's moral psychology (*zēlos*, *mimēsis*), Hagiographic intent (Athanasius' *Life of Antony*, Gregory of Nyssa's *Life of Macrina*), the role of details in both genres.

  3.  **Analyze the Student Response (Sentence by Sentence):**

