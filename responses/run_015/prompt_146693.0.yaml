answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Metaphysics of Persistence in a Block Universe
  **Parties:** Party 3D (Eternalist Endurantist) and Party 4D (Eternalist Perdurantist)
  **Date:** 2025
  **Context:** Dispute regarding the identity of a motorbike (2004–2025) undergoing total part replacement.

  ---

  ## 1. AGREED CLAIMS
  *The following claims constitute the common ground. Both parties sign this section acknowledging that neither view entails the denial of these propositions.*

  1.  **Macroscopic Realism:** There really are persisting macroscopic objects (such as motorbikes). We reject eliminativism (the view that only atoms or fields exist) and nihilism (the view that nothing persists).
  2.  **The Reality of Change:** Change is not an illusion. It is true that the bike was straight in 2004 and bent in 2025. Any theory that renders change impossible or merely apparent is false.
  3.  **Qualified Identity:** To say "the 2004 bike is the 2025 bike" does not commit us to the claim that the bike has all the same properties at both times. We reject strict Leibnizian Identity across time without qualification.
  4.  **Ordinary Language Underdetermination:** Ordinary English usage of "is," "same," and "object" is insufficient to settle the metaphysical debate. Both sides agree that common speech is compatible with multiple ontological interpretations.
  5.  **Diachronic Unity:** The 4Dist is not claiming the bike is a mere collection of unrelated momentary slices. There is a unifying relation (causal, spatiotemporal, or mereological) that binds the temporal parts into a single worm.
  6.  **Truthmaker Commitment:** For the proposition "The bike persisted" to be true, there must be something in the ontology (a truthmaker) that makes it true. We are not merely debating semantics; we are debating what exists.
  7.  **Eternalist Framework:** We assume the B-Theory of time. Past, present, and future events and objects all exist equally in the four-dimensional spacetime manifold. There is no privileged "now."

  ---

  ## 2. DISAGREEMENTS TABLE
  *The following table isolates the specific ontological divergences. Each formulation is drafted to be acceptable to the proponent of that view as an accurate description of their position.*

  | Question | Party 3D (Endurantist) Formulation | Party 4D (Perdurantist) Formulation |
  | :--- | :--- | :--- |
  | **1. Constitution**<br>*(What is the bike?)* | The bike is a **substance** that is **wholly present** at every time at which it exists. It is three-dimensional and located *at* times, not extended *through* time. | The bike is a **spacetime worm**. It is a four-dimensional aggregate of temporal parts. No single temporal part is the whole bike; the bike is the sum of its parts. |
  | **2. Temporary Properties**<br>*(How does it change?)* | The bike bears **time-indexed relations** to properties. The bike does not simply "have" bentness; it has the property *being-bent-at-t*. The intrinsic nature is relativized. | **Temporal parts** instantiate properties simpliciter. The 2025 temporal-part is bent. The 2004 temporal-part is straight. The worm itself has the properties derivatively. |
  | **3. Persistence & Identity**<br>*(What makes it the same?)* | Persistence is **numerical identity**. The object at $t_1$ is strictly identical to the object at $t_2$. There is only one object, appearing at multiple times. | Persistence is **genidentity** (continuity of causal/spatiotemporal parts). The object at $t_1$ is *not* identical to the object at $t_2$; they are distinct parts of a larger whole. |

  ---

  ## 3. THE CRUXES
  *These are the specific test cases and theoretical pressure points. For each, we state the scenario, the bearing on the debate, and the predictions made by each side.*

  ### 3.1 The Problem of Temporary Intrinsics
  * **Case:** An object $O$ is straight at $t_1$ and bent at $t_2$. Being "straight" and "bent" are normally considered intrinsic properties (shapes the object has in itself, not in relation to other things).
  * **Bearing:** If properties are intrinsic, $O$ cannot have both. If $O$ is wholly present at both times, it seems to contradict itself.
  * **Party 3D Prediction:** The 4Dist "solves" this by denying the bike itself changes. Only the parts differ. This saves logic but loses the intuition that *the bike* undergoes change. 3Dism preserves the idea that the *whole* object changes by admitting properties are actually relations to times (adverbialism).
  * **Party 4D Prediction:** The 3Dist solution destroys intrinsicality. If "straight" is really "straight-at-$t$," then shape is not intrinsic but relational. 4Dism preserves intrinsicality for the temporal parts. The worm changes by having different parts with different intrinsic properties.
  * **Observation:** Both agree that if "intrinsic" means "non-relational," one side must concede. 3D concedes properties are relational; 4D concedes the persisting whole doesn't have the property simpliciter.

  ### 3.2 The Twin (Reassembly/Branching)
  * **Case:** In 2012, the owner rebuilds the original discarded parts into a second bike (Bike B) while continuing to ride the upgraded original (Bike A). Both exist simultaneously.
  * **Bearing:** Tests the necessity and uniqueness of identity.
  * **Party 3D Prediction:** Identity must be unique ($A=B$ and $A=C$ implies $B=C$). Since $B \neq C$, $A$ cannot be identical to both. 3Dism must rely on a "best candidate" theory (e.g., continuity of frame) to pick one, implying identity is vague or conventional.
  * **Party 4D Prediction:** 4Dism handles this as **branching**. The pre-2012 worm is shared; post-2012, there are two distinct worms overlapping in the past. 4Dism does not need to say one is "really" the bike; it says there are two distinct worms that share early temporal parts. This is ontologically cleaner.
  * **Observation:** If branching is metaphysically impossible, 4Dism loses its advantage here. If identity must be one-to-one, 3Dism is forced into arbitrary criteria.

  ### 3.3 The Crate (Intermittent Existence)
  * **Case:** The bike was disassembled into a labelled crate in 2011 and reassembled in 2012. During 2011, there was no assembled bike.
  * **Bearing:** Tests whether persistence requires continuous existence.
  * **Party 3D Prediction:** If the bike is wholly present, it cannot be wholly present in 2011 if it doesn't exist. 3Dism must say the bike went out of existence and a new one was created, or accept "scattered objects" (an object wholly present at $t_1$ and $t_3$ but not $t_2$), which strains the notion of "wholly present."
  * **Party 4D Prediction:** The spacetime worm can be **gappy** or **scattered** in time just as easily as in space. The 2011 temporal parts are just missing. The worm is the sum of the 2010 parts and 2012 parts. This is no more problematic than a road having a gap.
  * **Observation:** If "object" implies causal continuity that cannot survive a total break, 4Dism's "gappy worm" is just a label for two different objects.

  ### 3.4 Special Relativity (SR)
  * **Case:** Simultaneity is relative. There is no unique way to slice spacetime into "moments."
  * **Bearing:** 3Dism relies on the object being "wholly present at a time." If "a time" is frame-relative, the object's existence becomes frame-relative.
  * **Party 3D Prediction:** This is a serious challenge but not fatal. We adopt **Lorentzian Endurantism**: the object is wholly present relative to a reference frame. The ontology is frame-dependent, which is acceptable given SR.
  * **Party 4D Prediction:** SR is natural evidence for 4Dism. Spacetime is the fundamental manifold. Objects are regions of this manifold. No "slicing" is required for the object to exist; it just *is* the region. 3Dism adds unnecessary structure (foliation) to make sense of "wholly present."
  * **Observation:** If SR is true, 3Dism must accept that *what exists* (the whole object) varies by observer. 4Dism treats the whole worm as invariant.

  ### 3.5 The Minimum Tick (Discrete Time)
  * **Case:** Physics discovers a minimum temporal interval (a "tick"). Nothing has temporal parts shorter than a tick. However, properties can change *within* a tick (e.g., a particle spins 90 degrees within one tick).
  * **Bearing:** Tests the coherence of "temporal parts" vs. "wholly present" in a quantized universe.
  * **Party 3D Prediction:** If there are no parts smaller than a tick, the "temporal part" just *is* the object at that tick. 4Dism collapses into 3Dism. Furthermore, if change happens *within* a tick, the tick cannot be a static part; the object must endure through the tick to change.
  * **Party 4D Prediction:** Even if time is discrete, the worm is still an aggregate of tick-sized slices. Change *within* a tick is impossible by definition; change is difference between adjacent ticks. If physics says change happens *within*, then time isn't discrete in the metaphysical sense, or the "tick" is not a temporal part but a duration of endurance.
  * **Observation:** This is the strongest test for 4Dism. If temporal extension is quantized such that the smallest unit cannot be divided, the distinction between "part" and "whole-at-a-time" vanishes.

  ---

  ## 4. FALSIFICATION CONDITIONS
  *What would count as a real argument against your own view?*

  | Party | What would change your mind? |
  | :--- | :--- |
  | **Party 3D** | If it can be demonstrated that **multi-location** (being wholly in two places/times) is logically incoherent in a way that cannot be solved by relativizing properties. Specifically, if the "relational" solution to temporary intrinsics is proven to destroy the notion of intrinsic qualities entirely, making change impossible. |
  | **Party 4D** | If it is shown that **temporal parts** are ontologically dependent on the whole in a way that makes them not parts at all (e.g., if you cannot define a temporal part without referencing the persisting object first). Also, if the "Minimum Tick" scenario is proven true, as it removes the divisibility required for mereology. |

  **Shared Criterion for Moving the Debate:**
  Both parties agree that the debate moves only if we can identify a **truthmaker** that one ontology can provide and the other cannot. If both ontologies can map the same spacetime facts equally well, the dispute may be merely verbal. We agree to look for a case where 3Dism predicts a truth that 4Dism makes false (or vice versa), not just a case where they describe the same truth differently.

  ---

  ## 5. VERBAL DISPUTE ANALYSIS
  *Is any part of this fight just about words?*

  **The Verbal Core:**
  We acknowledge that a significant portion of the dispute concerns the definition of **"Identity."**
  *   **Party 3D** uses "Identity" to mean *Numerical Identity over time* (The thing at $t_1$ is the *number* 1, the thing at $t_2$ is the *number* 1).
  *   **Party 4D** uses "Identity" to mean *Numerical Identity at a time* (The part at $t_1$ is not the *number* 1 of the part at $t_2$).
  *   **Resolution:** When 3D says "The bike is identical," they mean "The bike is one substance." When 4D says "The bike is not identical," they mean "The temporal slices are distinct existences." Both agree on the spacetime facts: there is a continuous causal chain of bike-stuff.

  **The Residual Real Disagreement:**
  After stripping the verbal disagreement about "identity," the following real ontological disagreements remain:

  1.  **The Locus of Properties:** Are properties (like shape) instantiated by the whole object relative to a time (3D), or by a part of the object simpliciter (4D)? This is not verbal; it changes the fundamental category of "property."
  2.  **Mereological Structure:** Is the bike *composed* of its temporal stages (4D), or is it *present at* its temporal stages (3D)? This is a disagreement about parthood. If 4D is right, you can cut the bike in time like a loaf of bread. If 3D is right, you cannot cut the bike in time; you can only find it at different locations.
  3.  **Modality:** In counterfactual scenarios (e.g., "If the bike had been crushed in 2010"), does the bike *have* a temporal part that ends in 2010 (4D modal realism), or does the *whole* bike fail to exist past 2010 (3D)?

  **Conclusion:**
  The dispute is not *merely* verbal, but it is thinner than it appears. It reduces to a choice between two ways of mapping existence onto the Block Universe: **Substance-Location** (3D) vs. **Mereological-Extension** (4D). Neither view denies the spacetime facts; they disagree on which spacetime structures count as "objects" and how those objects bear properties.

  ---
  **Signed:**
  _____________________ (Party 3D)
  _____________________ (Party 4D)
