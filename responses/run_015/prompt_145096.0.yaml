answer: |-
  Subject: Draft Q for the Behavioral Systems seminar / dollar auction thing

  Hey,

  Sorry for the late send on this. I was tweaking the wording to make sure it hits that sweet spot between game theory and systems design. Also, I know I spelled "commitment" with two m's in my notes (committment), my bad—brain fart during the lecture.

  Anyway, here's the draft for the advanced undergrad/grad crossover. I tried to force them off the Wikipedia definition of sunk costs and into the mechanics of why rational agents trap themselves. Let me know if the software analogy lands or if it's too forced.

  ***

  **Exam Question: Escalation in Irreversible Systems**

  Consider a distributed consensus protocol modeled as a two-player Dollar Auction. Two nodes (A and B) compete to commit a transaction log. Bids represent computational resources expended. The winner commits their log (value = $1.00); the loser expends resources but gets nothing. Crucially, the second-highest bidder must also pay their bid (resource cost), and once a node writes to the log, the operation is irreversible (rollback cost > forward commit cost).

  Assume bids are visible and incremental. At round *n*, Node A has bid $0.90 and Node B has bid $1.00. It is now A's turn.

  1.  Explain why a naive behavioral analysis labels further bidding by Node A as the "sunk-cost fallacy."
  2.  Construct a game-theoretic argument demonstrating why further bidding may be strategically rational despite negative expected value on the total pot.
  3.  Specifically analyze how **irreversibility** (high rollback cost) and **observability** (visible bids) reshape the payoff structure to enable strategic signaling. Why does the inability to retreat make the threat to escalate credible?

  ***

  **Model Answer**

  A naive behavioral analysis classifies Node A's continued bidding as the sunk-cost fallacy because it suggests the node is irrationally chasing past investments. In this view, Node A thinks, "I have already spent $0.90, so I must win the dollar to justify that expense." This is psychologically driven error; rational agents should ignore past costs and only consider future marginal utility. Since the pot is fixed at $1.00, bidding $1.10 guarantees a net loss regardless of the outcome, so a "rational" agent should cut losses immediately.

  However, this ignores the strategic structure of the multi-round game. Once Node B bids $1.00, Node A faces a choice between losing $0.90 immediately (by quitting) or bidding $1.10 to potentially lose only $0.10 (if Node B quits next). This is not backward-looking justification; it is forward-looking loss minimization. The rationality depends entirely on Node A's belief about Node B's future behavior.

  This is where irreversibility and observability transform the payoff matrix. In a standard auction, you can walk away. In this protocol, "rolling back" a log write is computationally prohibitive or corrupts state (high rollback cost). This constraint binds the agents. Because Node A *cannot* easily retreat, its threat to continue bidding becomes credible. In game theory, a threat is only effective if it is credible. If Node A could cheaply quit, Node B would call the bluff. But because the system architecture makes retreat more expensive than escalation, Node A is effectively pre-committing to aggression.

  Observability ensures this signal is received. Because bids are visible on the ledger, Node B sees exactly how much Node A has spent and knows that Node A is now trapped in the same loss-minimization logic. Node B realizes that if they quit, they lose their $1.00 bid. If they bid $1.20, they risk losing $0.20 if Node A quits. Both nodes are now playing a game of chicken where the steering wheel has been thrown out the window.

  Therefore, escalation past the value of the pot is not necessarily a cognitive error (sunk cost); it is a Nash equilibrium path driven by constraint binding. The "irrational" behavior emerges from rational agents optimizing within a system that penalizes retreat more heavily than futile advancement. The software analogy holds: sometimes a distributed system commits to a suboptimal state because the consensus cost of rolling back exceeds the cost of maintaining the error. The agents aren't confused about the value of the dollar; they are trapped by the mechanics of the auction.

  ***

  **Marking Scheme**

  **B Grade (Competent)**
  *   Correctly defines the sunk-cost fallacy as irrational attachment to past investment.
  *   Identifies that bidding >$1.00 results in a net loss.
  *   Mentions that agents continue to minimize losses (losing 10c vs 90c).
  *   Uses the software analogy superficially (e.g., "rollback is hard").
  *   *Missing:* Fails to explain *why* the threat is credible or how the payoff structure changes based on constraints. Treats the escalation as purely psychological or purely mathematical without linking them via signaling.

  **A Grade (Excellent)**
  *   Clearly distinguishes between backward-looking justification (sunk cost) and forward-looking loss minimization (strategic rationality).
  *   Explicitly explains **credible commitment**: shows how irreversibility removes the option to quit, forcing the opponent to concede.
  *   Analyzes **observability**: explains that visible bids allow the opponent to calculate the trap, creating mutual knowledge of the escalation dynamic.
  *   Integrates the software analogy deeply: connects "rollback cost" to "game-theoretic commitment device."
  *   Concludes that the behavior is rational *given the constraints*, rather than labeling it simply as irrational.

  ***

  Let me know what you think. If this works, I'll plug it into the final PDF.

  Best,
  [My Name]
