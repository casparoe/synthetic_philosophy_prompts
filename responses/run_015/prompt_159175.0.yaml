  Your hypothesis is sharp, but it mistakes the *lever* for the *load*. You argue the fight is about the horizon (finite vs. infinite). I argue the fight is about **Unstated Utility Functions**, and the horizon is merely the proxy weapon each side uses to justify their hidden preference.

  Here is the diagnosis: This is a **Normative Objective Mismatch** disguised as a technical dispute about asymptotics.

  Camp 1 (Kelly) claims the objective is *survival and growth of the trajectory*. They use the "long horizon" argument to assert that variance is noise that washes out, making the geometric mean the only metric that matters. They are implicitly maximizing $E[\ln(W)]$ but framing it as an objective law of stochastic dynamics (ergodicity) to avoid admitting it's a risk preference.

  Camp 2 (EU) claims the objective is *terminal wealth satisfaction*. They use the "finite horizon" argument to assert that path volatility matters because the game ends, and ruin is permanent. They are implicitly maximizing $E[U(W)]$ where $U$ is more concave than log, but they frame it as "rationality allows any utility" to avoid admitting they are simply more risk-averse than Camp 1.

  The horizon (200–300 bets) is the battleground because it is the only empirical variable that determines whose approximation is better. If $N=10,000$, Camp 1 wins by law of large numbers. If $N=5$, Camp 2 wins by single-shot logic. At $N=300$, you are in the messy transition zone where both arguments have partial validity, allowing the stalemate to persist.

  **Confidence:** 85%.
  **Where it breaks:** This diagnosis fails if the group admits **Parameter Uncertainty**. If your 55–60% edge is an *estimate* with variance rather than a known probability, Full Kelly is mathematically incorrect *even for growth maximization*. Bayesian Kelly (betting less than full Kelly to account for edge uncertainty) optimizes the growth rate *under uncertainty*. If Camp 1 accepts that their edge is uncertain, their "Full Kelly is truth" argument collapses into "Fractional Kelly is growth-optimal," which removes the moral high ground they hold over Camp 2.

  **What would change my mind:**
  1.  **Horizon = 5:** If the horizon were 5 bets and Camp 1 still argued for Full Kelly based on "growth rate," the diagnosis flips to **Dogma**. The asymptotic argument would be demonstrably false, revealing their position as ideological rather than mathematical.
  2.  **Pool Structure:** If you confirmed the pool has **no redemption rights** (members cannot leave early) and **no margin calls** (ruin is impossible, only terminal reduction), Camp 2's risk aversion becomes harder to justify. The diagnosis would shift toward **Verbal Dispute**, as the practical consequences of drawdown vanish.
  3.  **Edge Uncertainty:** If you revealed the 55–60% is a hard model output with negligible error, my diagnosis holds. If you revealed it's a gut estimate with wide confidence intervals, the solution becomes empirical (Bayesian Kelly), and the normative clash dissolves into an estimation problem.

  **What counts as progress:**
  Stop arguing about "rationality" or "horizons." Progress is **Explicit Drawdown Constraints**.
  Ask the group: "What is the maximum probability of a 50% drawdown we are willing to tolerate over the 2-year period?"
  *   If Camp 1 says "0%," they are lying or don't understand variance.
  *   If Camp 2 says "5%," you can back-solve the bet fraction that satisfies that constraint.
  This bypasses the utility theory debate. It turns a normative fight into a constraint satisfaction problem. You either meet the risk constraint or you don't. It forces Camp 1 to admit that growth rate is not the *only* constraint, and it forces Camp 2 to quantify their "nerves" into a number.

  \answer{Normative Objective Mismatch; Explicit Drawdown Constraints}
