answer: |-
  This is a sophisticated theoretical move. You are effectively asking whether we can "harden" prioritarianism against the leveling-down objection by making the moral weight of benefits and burdens sensitive to historical and institutional context, without surrendering the core prioritarian commitment to absolute well-being.

  To work through this logic, we need to isolate exactly what "distributive inertia" is doing in your moral calculus. The boundary you are looking for lies in whether that inertia is treated as a **proxy for well-being** or as a **freestanding moral variable**.

  Here is the breakdown of the conceptual tension, the precise boundary, and the cost of maintaining it.

  ### 1. The Welfarist Constraint of Prioritarianism
  First, we must lock down the definition of prioritarianism to see where the walls are. Prioritarianism is fundamentally a welfarist view. It holds that the moral value of an outcome is determined by the sum of weighted well-being. The "priority weighting" function is concave: benefits to the worse-off matter more. However, the *input* into that function must be well-being.

  If you introduce "distributive inertia," you are adding a new variable. The critical question is: **What kind of variable is it?**

  *   **Interpretation A (Welfarist Inertia):** Institutional calibration affects *well-being*. When institutions adapted to a baseline of 80, dropping A to 70 causes frustration, disruption, and psychological loss. Therefore, the well-being loss is actually larger than the raw number suggests. The "inertia" is just a multiplier for the *magnitude of the well-being loss*.
  *   **Interpretation B (Non-Welfarist Inertia):** Institutional calibration creates a *normative expectation*. Violating that expectation is morally bad *even if* A's well-being remains unchanged (perhaps A is stoic or adaptable). The "inertia" is a freestanding moral cost attached to the violation of the institutional baseline itself.

  ### 2. The Precise Boundary
  The boundary between (a) dynamic prioritarianism and (b) relational egalitarianism sits exactly on the distinction between Interpretation A and Interpretation B.

  **The Boundary Test:**
  Imagine a case where the institutional recalibration (dropping A from 80 to 70) occurs, but A experiences **zero** loss in subjective or objective well-being. Perhaps A is unaware of the institutional shift, or A's preferences adapt instantly without psychological cost.
  *   **The Prioritarian Answer:** If there is no well-being loss, there is no moral cost. The inertia was merely a potential friction that didn't materialize into harm. The view remains prioritarian.
  *   **The Relational/Pluralist Answer:** Even if A feels no pain, the institutional violation is a moral wrong. It undermines the "rules of the game" or the status A held within the structure. The view has now collapsed into something else (likely a form of conventionalism or relational egalitarianism).

  Therefore, the precise boundary is the **Reductionist Requirement**. To remain a prioritarian, you must be able to reduce all claims about "distributive inertia" into claims about "well-being impact." You cannot allow institutional history to have independent moral weight.

  ### 3. The Conceptual Cost
  You asked what a consistent prioritarian must pay to maintain this boundary. The cost is significant. By insisting on the Reductionist Requirement, the prioritarian must deny the intuitive normative force of **legitimate expectations**.

  In your dynamic case, there is a strong intuition that A has a "claim" to the 80 baseline because institutions calibrated to it. In many political theories, violating a legitimate expectation is wrong *in itself*, not just because it causes unhappiness.
  *   **The Cost:** To stay prioritarian, you must argue that the only reason violating the baseline is bad is because it hurts people's feelings or functioning. You cannot say, "It is unfair to change the rules mid-game." You can only say, "Changing the rules mid-game reduces well-being."
  *   **The Vulnerability:** This leaves the view vulnerable to the "Happy Slave" or "Adaptive Preference" style objections. If institutions lower A's baseline from 80 to 50, but A adapts psychologically and reports the same well-being, the prioritarian (under the Reductionist Requirement) must say there is no moral cost to the inertia. This seems to miss the point of "distributive justice," which often concerns structural fairness independent of subjective satisfaction.

  ### 4. Addressing the Refined Leveling-Down Objection
  Does this injection of inertia help answer the refined leveling-down challenge?

  **The Challenge:** Leveling down occurs not by direct harm, but by institutional recalibration that shifts everyone's baseline downward (the Shock scenario: 50/50 vs. Policy: 70/55).
  **The Standard Prioritarian Reply:** The Shock is worse because A and B both have lower well-being than in the Policy.
  **Your Dynamic Reply:** The Shock is *even worse* than the static calculus suggests because the institutional inertia makes the drop from 80 to 50 morally heavier than a drop from 60 to 50 would be.

  **Does this collapse into egalitarianism?**
  It does not, *provided* you stick to Interpretation A (Welfarist Inertia).
  *   You are not saying the Shock is bad because A and B are *equal* at 50.
  *   You are not saying the Shock is bad because the *gap* was closed.
  *   You are saying the Shock is bad because the *path* to get there involved a high-inertia disruption that amplified the well-being loss.

  This successfully avoids the leveling-down objection because you are still condemning the Shock solely on the grounds that it makes people worse off (weighted by priority). You are simply using a more granular metric for "worse off."

  **However,** there is a risk of "backdoor egalitarianism." If your inertia function is defined such that it *always* weights losses to the better-off more heavily when they involve institutional recalibration, you might inadvertently recreate an equality-promoting mechanism.
  *   *Example:* If institutional inertia is always higher for the group that had more (because they had more to calibrate), then your weighting function systematically penalizes reductions in inequality.
  *   *The Fix:* To avoid this, the prioritarian must insist that inertia is contingent, not structural. It just so happens that A had higher inertia. If B had the higher baseline, B would have the higher inertia cost. The moral weight must track the *well-being baseline*, not the *group identity*.

  ### 5. Conclusion: The Verdict
  Injecting distributive inertia helps prioritarianism answer the refined leveling-down challenge **only if** inertia is treated as a well-being multiplier.

  *   **If Inertia = Well-being Friction:** You remain a prioritarian. You have successfully explained why the Shock (50/50) is worse than a static calculation implies, without appealing to the value of equality. The boundary holds.
  *   **If Inertia = Normative Violation:** You have crossed the boundary. You are now assigning moral weight to the relationship between the agent and the institution, independent of well-being. This is a form of relational pluralism.

  **The Conceptual Price:**
  To maintain the prioritarian boundary, you must pay the price of **normative thinness**. You must accept that your theory cannot capture the wrongness of "breaking a promise" or "shifting the goalposts" unless those actions can be cashed out as reductions in welfare. You gain immunity to the leveling-down objection, but you lose the ability to condemn institutional instability that leaves people objectively content but structurally diminished.

  In your specific two-period case, a consistent prioritarian must argue that the Shock is worse than the Policy *solely* because the weighted sum of well-being (accounting for inertia-as-friction) is lower. If they argue the Shock is worse because it violates the "calibrated baseline" as a matter of principle, they have ceased to be a prioritarian and have become a relational egalitarian in disguise.
