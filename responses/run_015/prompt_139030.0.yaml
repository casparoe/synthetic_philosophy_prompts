  **Note:** This forces the outcome match. If a Clinician refuses the false belief constraint, they fail the task. This maintains stakes. The variation in Vehicle isolates the method from the result. Participants must struggle with the vehicle, not the outcome. The discomfort they feel is the data. If Vehicle A feels heavier than B despite identical signatures, you have isolated the variable. Ensure the Relative understands their role is to be convinced, not to rescue the Clinician from the ethical dilemma. The constraint is the engine; do not let them dismantle it.

