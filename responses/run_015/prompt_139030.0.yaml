  *Pushback and presuppositions*
  Your matched-outcome design risks begging the question against consequentialism. If morality is solely outcome-dependent, fixing the outcome eliminates the moral difference by definition; the activity would then manufacture a phantom distinction rather than testing one. My design preserves your structure but explicitly allows the null hypothesis: participants may report no difference once outcomes are fixed. Furthermore, fixing the relative's action ("discharge tomorrow") in a simulation is artificial; clinicians know real consent is processual, not binary. I have simplified the action to a signed decision to maintain fidelity without collapsing into realism debates. Finally, your constraint that words for the distinction not appear until the end is vital; my design adheres to this, but note that the debrief must not validate one intuition over another, only map them. The activity settles nothing objectively; it only exposes where your group's intuitions cluster when consequences are removed from the equation.

  *Setup and materials*
  You need six scenario cards per table, each specifying a clinical constraint (e.g., "Relative must leave believing recovery is likely") and a communication vehicle (Direct Assertion, Implicature, Strategic Silence). Provide two colored pads per pair: blue for the Relative, white for the Clinician. A visible timer is essential. The incentive is the "Golden Stethoscope," a plastic toy awarded to the pair whose transcript gap is smallest, framed as "Clarity Champions." This trivial prize gamifies precision without rewarding deception. Arrange chairs in dyads facing each other, with a large sheet of paper between them for the final relay. Ensure you have a flipchart for aggregating data anonymously. The room must feel like a workshop, not a lecture hall, to encourage movement during the relay. Keep handouts free of ethical terminology; use "Communication Constraints" and "Information Vehicles."

  *Round one: matched outcomes*
