prompt: |-
  For thirty-one years I was a research geomorphologist, and for the last four of my retirement I have chaired our county's Natural Heritage Review Board: five unpaid volunteers (a dairy farmer, a real-estate agent, a retired schoolteacher, the county planner, and myself), one staff ecologist who assembles the site file, about forty applications a year, thirty minutes per case in a public evening meeting, and written findings that are posted online and can be appealed to the county commissioners. The bylaw we administer says that a parcel is eligible for a conservation designation if, among other things, it supports a viable breeding population of a species of concern, contains a mature stand, has a substantial hydrological connection to the river corridor, and if the proposed activity would have no more than a minimal adverse impact. Every operative word in that sentence is vague, most of the criteria have several vague sub-conditions that can come apart from one another, and the board has no authority to amend the bylaw — we can only recommend amendments to the commissioners, who meet quarterly and rarely act.

  In the course of teaching myself some philosophy lately I got absorbed in the dispute between epistemicist and supervaluationist treatments of vagueness — roughly, whether borderline cases are cases where a sharp boundary exists but lies beyond what we can know, or cases where the admissible ways of sharpening the term disagree, so that the statement is neither true nor false — together with the sorites difficulty, the so-called tolerance principle, and the awkward fact that the borderline region itself seems to have no sharp edge. My fellow board members think this is exactly the sort of thing that has nothing to do with a Tuesday evening in a county meeting room. I have come to think it has a great deal to do with it, but only if it can be turned into something we can actually run: I want a written decision procedure, in the form of an ordered checklist, that a person with no philosophy training can work through in half an hour with the site file open, and that ends in one of a small number of exits — a clear approval, a clear denial, a recorded finding that the criteria do not determine an answer plus an explicit statement of what we do instead, or a referral to the commissioners on the grounds that resolving the case would require making a new rule rather than applying the old one.

  Please give me that procedure, with the following built into it. For each question, state what would count as a sufficient answer drawn from the kind of evidence a site file actually contains (survey counts, aerial photographs, soil maps, the ecologist's memo) rather than from information we cannot get. Say how the procedure handles a parcel that is strong on one sub-condition and weak on another, and tell us whether the dimensions are to be traded off against each other by some aggregate scoring or whether a result that clearly fails on any single dimension sinks the application regardless of the others — I want that choice made explicitly, not defaulted into. Say how the procedure handles a case where the board cannot tell whether it is looking at a genuine borderline case or a case it simply has not understood well enough. And say how it handles the chain: our docket regularly contains five parcels along a continuous gradient, each differing from the last by what any of us would call a hair's breadth, and approving number three seems to commit us on number four. I would like a step that forces the board to check, before voting, whether today's decision settles a neighbouring case by a difference too small to matter, and that requires us either to accept that consequence openly or to declare a discontinuity and give a reason that is not merely the order in which the applications arrived.

  I also want the theory made honest rather than decoratively cited. Please mark, alongside the steps, which of them would have to change if the epistemicist picture is right rather than the supervaluationist one, and where the two pictures genuinely diverge in output rather than in metaphysical story: in particular, whether our written findings should describe a case as one the criteria leave open or one whose answer we take ourselves not to know, whether we should invite an applicant to come back with better evidence or tell them that no amount of evidence will settle it, and whether the honest device for an undecidable case that must still be decided is a lottery, a temporary designation with a fixed review date, or something else. If your procedure requires the board to fix in advance, publicly and for the whole year, a standing interpretation sheet listing the sharpenings of each vague term that it is willing to treat as admissible — and, if it needs them, the weights given to different admissible sharpenings — then say so, and say what we should do about the fact that we are not the body with authority to do that. Please then run the finished procedure on four cases: an unbroken 240-hectare mature forest with fourteen breeding pairs of the listed warbler; a mowed field with a roadside drainage ditch; an eleven-hectare woodlot that is plainly better than parcels we have denied and plainly worse than parcels we have approved, whose purchase option expires in six weeks; and the gradient chain of five riparian parcels at forty, thirty-eight, thirty-six, thirty-four and thirty-two metre buffers. Flag at each step where judgment cannot be eliminated but can only be relocated, tell me plainly which of the four cases your procedure answers in a way I will not like, and close by saying what the procedure cannot do — the failures I should expect it to have after a year of use.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User Profile:** Retired research geomorphologist (31 years), currently Chair of a county Natural Heritage Review Board (4 years). Philosophically informed (knows epistemicism vs. supervaluationism, sorites, tolerance principle). Pragmatic (needs a working tool for volunteers).
      *   **Context:** 5 volunteers, 1 staff ecologist, ~40 apps/year, 30 mins/case, public meeting, written findings, appealable.
      *   **Problem:** The bylaw is vague ("viable breeding population," "mature stand," "substantial hydrological connection," "minimal adverse impact"). No authority to amend bylaws (only recommend).
      *   **Goal:** A written decision procedure (ordered checklist) usable by non-philosophers in 30 mins.
      *   **Required Outputs:** Clear Approval, Clear Denial, Undetermined (with next step), or Referral to Commissioners (rule-making needed).
      *   **Specific Constraints/Requirements:**
          *   Define sufficient evidence for each question (site file data).
          *   Handle trade-offs (aggregate scoring vs. veto/veto-power). *Must be explicit.*
          *   Handle epistemic uncertainty (don't understand vs. genuine borderline).
          *   Handle Sorites chains (the 5-parcel gradient problem). *Must check consistency with neighbors.*
          *   Integrate Philosophy "Honesty": Mark steps where Epistemicism vs. Supervaluationism diverges (metaphysics vs. output). Address findings language (open vs. unknown), evidence requests, and undecidable decision devices (lottery, temporary, etc.).
          *   Address the "Sharpening" authority issue (Board can't officially amend, but needs admissible sharpenings).
          *   **Test Cases:** Run the procedure on 4 specific scenarios.
          *   **Reflection:** Flag where judgment is relocated, admit unpalatable outcomes, and list expected failures after one year.

  2.  **Deconstruct the Philosophy:**

      *   **Epistemicism:** Vagueness is ignorance. There *is* a sharp boundary (e.g., exactly 35 meters is the buffer), but we don't know it.
          *   *Implication:* More evidence *could* theoretically solve it. Findings should say "We cannot determine if the threshold is met" rather than "The criteria are silent."
          *   *Decision:* If we must decide, we are guessing the hidden line.
      *   **Supervaluationism:** Vagueness is semantic indeterminacy. There are many "admissible sharpenings" (precisifications). If *all* sharpenings say Yes, it's True. If *all* say No, it's False. If some say Yes and some No, it's Indeterminate (truth-value gap).
          *   *Implication:* No amount of evidence solves a genuine gap. Findings should say "The criteria leave this open."
          *   *Decision:* If we must decide in a gap, we are *stipulating* a rule (legislating), not judging.
      *   **The Conflict:** The Board cannot legislate (Commissioners do that). But the Board *must* decide cases.
      *   **Resolution for Procedure:** The procedure needs a "Pre-Session Sharpening" (administrative necessity) that acknowledges its own provisional status. It must distinguish between *application of rules* and *creation of precedent*.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Structure:* Needs to be a checklist. Step 1, Step 2, etc.
      *   *Evidence:* Must rely on site files (maps, surveys, memos).
      *   *Trade-offs:* The prompt asks to choose between aggregation and veto. Given the legal nature ("if... among other things"), a **Veto (Conjunctive)** approach is safer legally, but a **Weighted (Compensatory)** approach is more practical for ecology. *Decision:* Hybrid. "Fatal Flaws" (Veto) vs. "Quality Metrics" (Aggregation). Let's go with a **Threshold + Weight** system to handle the "strong on one, weak on another" requirement explicitly. Actually, the prompt asks to make the choice explicit. A strict conjunctive rule ("AND" in the bylaw) suggests Veto. But "viable population" might compensate for "less mature stand." Let's choose **Weighted Scoring with Minimum Thresholds**. This allows trade-offs but prevents terrible performance in one area.
      *   *Sorites/Gradient:* Need a "Consistency Check" step. Compare with prior 12 months' decisions.
      *   *Philosophy Integration:* Add marginal notes or specific steps labeled [E] (Epistemic) vs [S] (Super).
      *   *Authority Issue:* The Board can't fix sharpenings for the year officially. *Workaround:* Adopt a "Working Interpretation Memo" at the start of the year as an internal guideline, explicitly labeled "Non-binding Administrative Guidance" to avoid ultra vires acts.

  4.  **Developing the Steps:**

      *   **Step 0: Preparation (The Sharpening).** Address the authority issue.
      *   **Step 1: Evidence Sufficiency.** Can we tell? (Epistemic check).
      *   **Step 2: Criterion Scoring.** Break down the 4 vague criteria.
      *   **Step 3: Trade-off Logic.** Explicitly state the aggregation method.
      *   **Step 4: The Sorites Check.** Compare with neighbors/precedents.
      *   **Step 5: The Verdict & Philosophy.** How to write the finding.

  5.  **Refining the Philosophy/Procedure Interface:**

      *   *Epistemicism:* If we lack evidence, ask for more. If evidence exists but is borderline, we are ignorant of the fact.
      *   *Supervaluationism:* If evidence exists but is borderline, the predicate is undefined. Asking for more evidence is futile.
      *   *The "Honest" Device:* For undecidable cases that *must* be decided (deadline pressure), a **Tie-Breaker Rule** is better than a lottery. A lottery implies equal moral weight. A tie-breaker (e.g., "favor conservation in genuine gaps") is a policy choice. Or, a **Provisional Designation** (review in 2 years). Let's suggest Provisional Designation for Supervaluationist gaps, and "Best Estimate" for Epistemicist ignorance.

  6.  **Running the Test Cases:**

      *   *Case 1 (240ha Forest):* Clear Approval.
      *   *Case 2 (Mowed Field):* Clear Denial.
      *   *Case 3 (11ha Woodlot - The Hard Case):* Borderline. Time pressure.
      *   *Case 4 (Gradient Chain):* The Sorites problem.

  7.  **Addressing Specific Prompt Requirements:**

      *   *Trade-offs:* Explicitly choose a method (e.g., Weighted Sum with Minimums).
      *   *Judgment Relocation:* Acknowledge that setting the weights *is* the judgment.
      *   *Unpalatable Outcome:* Admit which case result might feel wrong (likely Case 3 or the middle of Case 4).
      *   *Failures:* What goes wrong after a year? (Gaming the system, rigidity, commissioner pushback).

  8.  **Drafting the Content (Mental or Scratchpad):**

      *   *Tone:* Professional, respectful of the user's expertise, precise, slightly academic but practical.
      *   *Formatting:* Use bolding for steps, italics for philosophical notes.
      *   *The "Authority" Problem:* I need to be careful here. The Board *cannot* bind the Commissioners. So the "Sharpening" must be framed as "Internal Heuristics for Consistency," not "Rule Making."

  9.  **Final Review against Constraints:**

      *   Did I mark Epistemic vs. Supervaluationist divergences? Yes.
      *   Did I handle the 5-parcel gradient? Yes (Consistency Step).
      *   Did I handle the trade-off choice? Yes (Weighted with Floor).
      *   Did I run the 4 cases? Yes.
      *   Did I list failures? Yes.
      *   Did I address the authority limitation? Yes (Internal Memo vs. Bylaw).

  10. **Polishing:** Ensure the distinction between "We don't know" (Epistemic) and "It is not determined" (Supervaluationist) is clear in the findings section. Ensure the "Sorites Check" is actionable in 30 minutes (requires a simple log of past decisions).

  *(Self-Correction during drafting)*: I initially thought about suggesting a lottery for undecidable cases. But for land use, a lottery is legally precarious. A "Provisional Conservation Easement" or "Deferral" is better. I will recommend Deferral/Provisional status for Supervaluationist gaps, and "Best Evidence Ruling" for Epistemicist uncertainty.
  Also, I need to make sure I don't give the Board power they don't have. The "Sharpening Sheet" must be labeled "Guidance" not "Rule."

  Let's assemble the procedure.

  *   **Step 1: The Admissible Sharpening Sheet (Pre-Meeting).**
  *   **Step 2: Evidence Threshold (Epistemic Check).**
  *   **Step 3: Criterion Scoring (The 4 pillars).**
  *   **Step 4: Aggregation Logic (Trade-offs).**
  *   **Step 5: The Sorites/Consistency Check.**
  *   **Step 6: Verdict & Findings Language.**

  *Test Cases:*
  1.  Forest: Passes all.
  2.  Field: Fails all.
  3.  Woodlot: The "Gap" case.
  4.  Gradient: The "Chain" case.

  *Failures:* Bureaucratic drift, Commissioners ignoring referrals, Applicants gaming the scores.

  Okay, ready to write.
answer: |-
  Here is a decision procedure designed for your Board. It is constructed to be executed within a thirty-minute window using standard site-file materials, while explicitly embedding the philosophical constraints you requested.

  ### The Natural Heritage Decision Protocol (NHDP)

  **Preamble: The Authority Constraint**
  You cannot amend the bylaw. Therefore, this procedure does not create "rules." It creates **Internal Administrative Heuristics**. At the first meeting of the fiscal year, the Board adopts a *Working Interpretation Memo* (WIM). This document lists the "admissible sharpenings" (e.g., "For the purpose of initial screening, 'mature stand' implies canopy closure >70% and dominant trees >80 years").
  *   **Status:** The WIM is binding only on the Board's internal consistency, not on the Commissioners or the public. It is labeled "Guidance for Consistency, Not Law."
  *   **Philosophical Note:** This is a Supervaluationist move. You are selecting a set of "admissible precisifications" to test the application against. If an Epistemicist were running this, the WIM would be labeled "Best Current Estimate of Hidden Boundaries."

  ---

  #### Step 1: The Evidence Sufficiency Check (Epistemic Filter)
  **Action:** Review the staff ecologist's memo and site file. Ask: *Is the missing information theoretically obtainable?*
  *   **Sufficient Evidence:** Survey counts, LiDAR/ aerial imagery, soil surveys, hydrological models, written expert opinion.
  *   **Insufficient Evidence:** Speculation, missing surveys, contradictory expert opinions without resolution.
  *   **Decision:**
      *   If data is missing but obtainable: **Deferral.** Invite applicant to submit specific missing data (e.g., "breeding bird survey for May/June").
      *   If data is present but ambiguous: Proceed to Step 2.
  *   **Philosophical Divergence [E vs S]:**
      *   **[E] Epistemicist:** If data is ambiguous, the boundary exists but is hidden. You may request *more precise* data (e.g., "count nests, not just adults").
      *   **[S] Supervaluationist:** If data is precise but the predicate still doesn't apply (e.g., 34.9m buffer vs 35m requirement), more evidence will not help. Do not defer. Mark as "Semantic Gap."

  #### Step 2: Criterion Scoring (The Four Pillars)
  **Action:** Score the four bylaw criteria on a scale of 0–5 based *only* on the WIM sharpenings.
  1.  **Viable Breeding Population:** (0 = None, 5 = Robust/Confirmed).
  2.  **Mature Stand:** (0 = None/Young, 5 = Old Growth/High Complexity).
  3.  **Hydrological Connection:** (0 = None, 5 = Direct/Substantial).
  4.  **Minimal Adverse Impact:** (0 = High Impact, 5 = Negligible).
  *   **Evidence Standard:**
      *   *Population:* Nest counts in site file.
      *   *Mature:* Tree core samples or aerial canopy analysis.
      *   *Hydro:* Wetland delineation maps.
      *   *Impact:* Engineering plans vs. setback distances.

  #### Step 3: Aggregation Logic (Trade-Off Protocol)
  **Action:** Apply the scoring to determine eligibility.
  *   **The Choice:** You requested an explicit choice between **Veto** (fail one, fail all) and **Aggregation** (trade-offs allowed).
  *   **Procedure Selection:** **Weighted Aggregation with Minimum Thresholds.**
      *   *Rationale:* A strict Veto is legally safe but ecologically brittle (a perfect forest with one minor hydro issue fails). Pure Aggregation allows a rich developer to buy a permit (high score on one, low on others).
      *   **Rule:** Total Score must be ≥ 14 (out of 20) **AND** no single criterion score may be < 2.
      *   **Trade-Off:** A score of 5 on Population can compensate for a 3 on Hydrology, *provided* Hydrology is not < 2.
  *   **Philosophical Note:** This acknowledges that "eligibility" is a cluster concept. No single dimension is the "essence" (rejecting Essentialism), but some dimensions are necessary conditions (the Threshold).

  #### Step 4: The Sorites Consistency Check (The Gradient Step)
  **Action:** Before voting, the Chair opens the **Precedent Log** (a simple spreadsheet of the last 12 months' decisions with their scores and key metrics).
  *   **Question:** *Is there a case in the Log within a "hair's breadth" of this one (e.g., 34m buffer vs. our 35m WIM) that was decided differently?*
  *   **If Yes:** You must either:
      1.  **Align:** Vote to match the precedent (even if you doubt it).
      2.  **Distinguish:** Articulate a *relevant difference* other than the metric (e.g., "The 34m case had soil type X, this has soil type Y").
      3.  **Declare Discontinuity:** Vote differently, but explicitly state: *"We are drawing a line here. Cases below this metric will now be denied."* This triggers a **Referral to Commissioners** (Step 5b).
  *   **If No:** Proceed to voting.
  *   **Philosophical Note:** This forces the Board to acknowledge the Tolerance Principle. If you approve 36m and deny 34m, you must justify why 2m matters. If you cannot, you are creating a sharp boundary where none exists naturally.

  #### Step 5: The Verdict & Findings Language
  **Action:** Select one of four exits.

  *   **Exit A: Clear Approval.** (Score ≥ 14, No min < 2, Consistent with Log).
      *   *Finding:* "The parcel meets the sharpened criteria adopted in the WIM."
  *   **Exit B: Clear Denial.** (Score < 14 or min < 2, Consistent with Log).
      *   *Finding:* "The parcel fails to meet the sharpened criteria."
  *   **Exit C: The Undecidable Gap.** (Score is borderline, or WIM sharpenings conflict).
      *   *Finding Language [S]:* "The bylaw criteria are indeterminate for this case. No admissible sharpening yields a clear result."
      *   *Finding Language [E]:* "The evidence is insufficient to locate the boundary defined by the bylaw."
      *   *Action:* **Provisional Designation.** Approve with a 2-year review clause. If new data or Commissioner rule-making doesn't occur, designation lapses. (Avoids the lottery; preserves status quo without permanent rule-making).
  *   **Exit D: Referral to Commissioners.** (Required if Step 4 forces a Discontinuity, or if the WIM itself is proven inadequate).
      *   *Finding:* "Resolving this case requires establishing a new threshold not present in current guidance."

  ---

  ### Application to Test Cases

  Here is how the NHDP runs on your four scenarios.

  #### Case 1: The 240-Hectare Mature Forest
  *   **Step 1:** Evidence sufficient (surveys, maps).
  *   **Step 2:** Scores: Pop (5), Mature (5), Hydro (4), Impact (5). Total: 19.
  *   **Step 3:** Passes thresholds.
  *   **Step 4:** Log check: Consistent with prior large-forest approvals.
  *   **Verdict:** **Exit A (Clear Approval).**
  *   **Philosophy:** Both [E] and [S] agree. This is a "super-true" case (true on all sharpenings / clearly over the hidden line).

  #### Case 2: The Mowed Field with Ditch
  *   **Step 1:** Evidence sufficient.
  *   **Step 2:** Scores: Pop (0), Mature (0), Hydro (2), Impact (3). Total: 5.
  *   **Step 3:** Fails minimum threshold on Pop and Mature.
  *   **Step 4:** Log check: Consistent with prior denials.
  *   **Verdict:** **Exit B (Clear Denial).**
  *   **Philosophy:** Both [E] and [S] agree. "Super-false."

  #### Case 3: The 11-Hectare Woodlot (The Hard Case)
  *   **Context:** Better than denied parcels, worse than approved. Option expires in 6 weeks.
  *   **Step 1:** Evidence sufficient. No more data will arrive in time.
  *   **Step 2:** Scores: Pop (3), Mature (3), Hydro (3), Impact (3). Total: 12.
  *   **Step 3:** Fails the Aggregate Threshold (needs 14).
  *   **Step 4:** Log check: Shows a cluster of 11-13 score denials and 15+ approvals. This case sits in the gap.
  *   **Verdict:** **Exit C (The Undecidable Gap).**
  *   **Action:** **Provisional Designation.**
  *   **Philosophical Divergence:**
      *   **[S] Supervaluationist:** You write: *"The criteria leave this open."* You grant provisional status because the language does not determine the outcome. You tell the applicant: *"No amount of evidence will settle this; only a rule change will."*
      *   **[E] Epistemicist:** You write: *"We cannot know if the boundary is met."* You grant provisional status as a "Best Estimate" gamble. You tell the applicant: *"Better evidence might have settled it, but time precludes it."*
  *   **Unpalatable Outcome:** You will likely dislike this. The land might be lost (option expires) because the Board refuses to commit to a permanent designation without Commissioner backing. The procedure sacrifices the parcel to preserve the Board's integrity regarding rule-making authority.

  #### Case 4: The Gradient Chain (40m to 32m buffers)
  *   **Context:** Five parcels, 2m difference each.
  *   **Step 4 (Sorites Check):** This is where the procedure bites.
      *   *Parcel 1 (40m):* Approved (Score 16).
      *   *Parcel 2 (38m):* Approved (Score 15).
      *   *Parcel 3 (36m):* **Stop.** The WIM suggests 35m is the sharpening. This is a borderline case.
      *   *Parcel 4 (34m) & 5 (32m):* Held.
  *   **Action:** For Parcel 3, you must choose:
      1.  **Align with 1 & 2:** Approve 36m. But then you must approve 34m (Parcel 4) unless you find a *relevant difference*. If there is no difference, approving 3 forces 4.
      2.  **Declare Discontinuity:** Deny 36m. State: *"We are drawing the line at 38m."*
  *   **Verdict:** **Exit D (Referral).**
  *   **Reasoning:** To deny 36m while approving 38m without a relevant difference is to assert a sharp boundary where the WIM admits none. This constitutes "making a new rule." The Board refers the chain to Commissioners with a recommendation: *"Establish a fixed buffer minimum."*
  *   **Philosophical Honesty:** This admits the Sorites Paradox cannot be solved by adjudication. It forces the legislative body to accept the arbitrariness of the line.

  ---

  ### Relocation of Judgment & Expected Failures

  **Where Judgment is Relocated**
  You asked where judgment cannot be eliminated. It is relocated to **Step 0 (The WIM)** and **Step 3 (The Thresholds)**.
  *   By setting the WIM sharpenings (e.g., defining "mature" as 80 years), you are not discovering the meaning of "mature"; you are *stipulating* it for administrative convenience.
  *   By setting the Aggregate Threshold at 14, you are making a political value judgment about how much ecology trades off against development.
  *   **Honesty:** The procedure does not remove discretion; it moves it from the *moment of voting* (public, pressured) to the *start of the year* (private, deliberative).

  **What You Will Not Like**
  *   **Case 3 (The Woodlot):** The procedure likely kills the conservation opportunity. Because the Board admits it lacks authority to resolve the vagueness permanently, it offers only a provisional solution. If the landowner needs permanent certainty to fund the purchase, the land is lost. This is the cost of "honesty" about authority.
  *   **Case 4 (The Chain):** The Commissioners will likely ignore the Referral. They meet quarterly and rarely act. The parcels may sit in limbo, or the Board will be pressured to "just vote." If you vote against the procedure to save the land, you undermine the system.

  **Expected Failures After One Year**
  1.  **Gaming the WIM:** Applicants will learn the scoring weights. They will engineer projects that score 5 on "Hydrology" to compensate for a 2 on "Population," potentially allowing ecologically poor sites to pass via the trade-off rule.
  2.  **The "Relevant Difference" Trap:** In Step 4, Board members will invent spurious "relevant differences" (e.g., "This soil is darker") to avoid the Sorites trap without referring to Commissioners. This reintroduces the vagueness you tried to fix.
  3.  **Commissioner Inaction:** The Referral Exit (D) relies on Commissioners acting. If they don't, the Board accumulates a backlog of "Provisional" cases (Exit C) that create legal uncertainty for landowners.
  4.  **Philosophical Drift:** Board members will forget the [E] vs [S] distinction. They will treat "Indeterminate" findings as "We need more evidence" (Epistemic), leading to endless deferrals rather than honest admissions of semantic gaps.

  ### Final Recommendation
  Adopt the **Supervaluationist** framing for your public findings.
  *   **Why?** It is more honest regarding the bylaw. The words *are* vague. No amount of surveying will make "substantial" precise.
  *   **Findings:** Use the phrase *"The criteria do not determine an outcome."*
  *   **Device:** Use the **Provisional Designation** (Exit C). It acknowledges the gap without forcing the Board to legislate from the bench. It puts the pressure back on the Commissioners to sharpen the bylaw if they want certainty.

  This procedure does not solve vagueness. It manages the institutional risk of pretending vagueness doesn't exist.
