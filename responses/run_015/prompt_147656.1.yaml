answer: |-
  To the funding foundation, please accept this final report summarizing the outcomes of the two-year adversarial collaboration between the defender of lexical threshold negative utilitarianism and the defender of symmetric commensurabilism. We have engaged in rigorous dialectic to isolate the precise structure of our disagreement regarding the aggregation of welfare. We agree, first, that expected-value reasoning remains the default methodology for decision-making under uncertainty, despite the structural differences in our value theories. We agree, second, that cases involving pain asymbolia, where an intervention removes the unpleasantness of a painful state while leaving intact the sensory discrimination and avoidance behaviour, are decisive tests for defining the boundaries of suffering. We agree, third, that if a lexical threshold exists, its placement is subject to significant epistemic uncertainty regarding whether it is fixed by intensity, duration, or kind of state. We agree, fourth, as a stipulation adopted solely to make progress, that the term suffering refers exclusively to phenomenally negative states rather than functional deficits, though we note this claim was not initially held by both parties and remains contested within the broader literature on functionalism. We agree, fifth, that any viable solution must explain whether lexical priority attaching to one person's suffering survives being multiplied across very many people's mild pleasures, or whether sheer numbers reintroduce commensurability by the back door.

  Despite these agreements, a substantive residual disagreement remains regarding the fundamental structure of value. The lexical threshold negative utilitarian maintains that at or above a specific threshold of severity, no amount of happiness, however large and however many people it is spread across, can outweigh a single instance of that suffering, whereas the symmetric commensurabilist maintains that for any suffering there is in principle some quantity of happiness that outweighs it, limiting the dispute to empirical measurement and aggregation ethics rather than the shape of value itself. A second residual disagreement concerns the intrapersonal analogue, in which a single person is offered a stretch of life containing equal quantities of intense pleasure and moderate pain. The lexicalist contends that the asymmetry they defend is supposed to hold inside a life as well as across lives, preventing the trade-off entirely, while the commensurabilist argues that intrapersonal trade-offs are rationally required if the net hedonic balance is positive, suggesting the lexicalist's view may collapse into irrationality within a single biography.

  To resolve these disagreements, we identified specific cruxes where settled answers would move at least one side. The first crux concerns the pain asymbolia intervention described in our agreed claims. Both parties agree this case bears on whether suffering is defined by phenomenology or functional cost. The lexicalist predicts that if unpleasantness is removed, no suffering remains to trigger the lexical veto, regardless of avoidance behaviour, implying value is strictly phenomenological. The commensurabilist predicts that the functional costs and sensory discrimination retain disvalue that is commensurable with happiness, implying value tracks functional welfare even absent phenomenological pain.

  The second crux involves a choice between a very small probability of suffering at or near the threshold and a certainty of a great deal of ordinary happiness, which is where the charge of fanaticism about worst cases gets its grip. Both parties agree this case tests the robustness of expected-value reasoning against lexical constraints. The lexicalist predicts that even a tiny non-zero probability of threshold suffering must dominate the decision rule, accepting the charge of fanaticism as a cost of moral correctness. The commensurabilist predicts that the expected value of the certain happiness will outweigh the discounted disvalue of the improbable suffering, showing that lexical priorities collapse under probabilistic scrutiny unless they abandon expected-value reasoning entirely.

  The third crux addresses the methodological question of whether, given that we cannot measure severe suffering with any precision, lexical priority is best understood as a claim about value or as a decision rule for acting under uncertainty. Both parties agree this distinction bears on the placement problem, since a threshold must fall somewhere. The lexicalist predicts that lexical priority is a metaphysical claim about value structure that holds even if measurement were perfect, meaning the threshold is real but epistemically hidden. The commensurabilist predicts that lexical priority is best understood as a heuristic decision rule justified only by measurement error, meaning that if precision were achieved, commensurability would be restored and the threshold would vanish.

  In closing, we conclude that much of the original dispute was not merely verbal, though verbal confusion obscured the substantive stakes. Both parties initially used the word suffering differently, with the lexicalist emphasizing phenomenological intensity and the commensurabilist emphasizing functional welfare loss, but our stipulation clarified this. However, the disagreement over whether numbers reintroduce commensurability is substantive, turning on whether value is additive or structured by constraints. Similarly, the disagreement over the intrapersonal analogue is substantive, turning on whether the separateness of persons is morally relevant despite our shared theoretical denial of side-constraints, suggesting a hidden commitment in the lexicalist view that person-boundaries matter for aggregation even if they do not matter for rights. We leave this collaboration with a precise map of these divergences, ready for further empirical and philosophical investigation.
