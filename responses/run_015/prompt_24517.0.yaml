answer: |-
  The coffee on the table between them had gone cold, forming a skin across the surface. Elias stared at it, then at Sarah. She was waiting. She needed him to say the words, but not just the words—she needed the weight behind them. She needed to know that the man who had walked away when her mother died was the same man sitting here now, ready to answer for it.

  "I chose to leave," Elias said. His voice sounded thin in the quiet kitchen. "I want you to know that. It wasn't a panic attack. It wasn't confusion. I chose it."

  Sarah didn't blink. "Why?"

  "Because I'm cowardly."

  "Did you choose to be cowardly?"

  The question hung in the air. Elias felt a surge of relief. This was the ground he needed. He could work with this. "Yes," he said, leaning forward. "I knew I had a tendency toward fear. I knew it. And over the years, I indulged it. I nurtured it. Every time I avoided a conflict, every time I stayed silent when I should have spoken, I was building that character. I crafted the coward who left you."

  He felt solid saying it. He was claiming the architecture of his own soul. He was the builder, and he was admitting the building was flawed.

  Sarah tilted her head. "But why did you nurture it? Why did you choose to indulge the fear instead of fighting it?"

  Elias opened his mouth, then closed it. He reached for the memory of those earlier choices. He saw himself at twenty, choosing silence over confrontation. He had chosen it because safety felt better than risk.

  "Because I valued safety," Elias said.

  "Did you choose to value safety?"

  The floor beneath him seemed to shift, just slightly. "I… I suppose everyone values safety."

  "Did you choose to be everyone?" Sarah asked. Her voice wasn't angry. It was tired. "Or did you just find yourself that way?"

  Elias looked down at his hands. They were resting on the table, still. He tried to reach further back, before the twenties, before the habits had set. He thought of himself as a teenager, flinching from a raised voice. He hadn't chosen to flinch. It was a reflex. But surely, later, he had chosen to accept the flinch?

  "I decided not to fight it," Elias said. "I decided it was too hard to change."

  "Why was it too hard?"

  "Because I didn't have the strength."

  "Did you choose to lack the strength?"

  The kitchen felt smaller. The air was thick. Elias felt a vertigo rising in his stomach, a sensation of falling upward. He was trying to plant a flag in the ground to mark where *he* began, but every time he pointed to a spot, he realized the ground there had been laid by someone else.

  He tried to jump over the gap. "I could have tried harder. I had the capacity to try."

  "Where did the capacity come from?"

  "From my mind. From my will."

  "Did you build your will?" Sarah asked. "Did you construct the mechanism that decides how hard to try?"

  Elias gripped the edge of the table. He wanted to scream that of course he was real, that he was here, that he was the one suffering. But the logic of the moment was a spiral staircase with no bottom. If he was responsible for the choice to try, he had to be responsible for the desire to try. And that desire had to come from a prior state of mind. And that state of mind had to be chosen by a prior self.

  He searched for the first self. The one who wasn't made of inherited traits, or genetic predispositions, or childhood conditioning. The one who stood outside the chain and pulled the first lever.

  "I wanted to be better," Elias whispered. "At some point, I wanted to be a better man."

  "Who wanted that?"

  Elias looked at her. He saw the exhaustion in her eyes. She wasn't trying to trap him; she was looking for the same thing he was. She wanted a person to hold accountable. If he was just a vessel for causes stretching back before his birth, then there was no one to forgive. There was only a sequence of events.

  "I don't know," he said.

  "If you didn't choose the desire to be better," Sarah said softly, "then how can you take credit for the attempt? And if you can't take credit for the attempt, how can you take the blame for the failure?"

  Elias felt the effort slipping out of him. He had come here to carry the burden. He had wanted the weight of the guilt because the weight proved he existed. It proved he was an agent. But the burden kept sliding off his shoulders. It wasn't that he wasn't guilty; it was that the 'he' who was guilty kept dissolving when he touched it.

  He thought of his father, a man who never looked anyone in the eye. He thought of his father's father. He thought of the chemistry in his brain that made avoidance feel like relief. He tried to find the place where he had grabbed the wheel, but his hands were always already on it, guided by a momentum he hadn't started.

  "I did it," Elias said. But the words felt hollow, like quoting a line from a play.

  "You did it," Sarah agreed. "But were you there?"

  Elias looked at the cold coffee. He wanted to say *yes*. He wanted to say that deep inside, past the biology and the history, there was a core of pure choice. But when he pressed against the inside of his own chest, he found only more layers. He found impulses he didn't summon, values he didn't pick, and a fear that had been waiting for him before he knew what fear was.

  He had wanted to own the act completely. To own it, he needed to own himself. And he realized, with a quiet, crushing certainty, that he did not belong to himself. He was a house built by ghosts, trying to apologize for the way the wind blew through the halls.

  "I don't know if I was there," Elias said.

  Sarah stood up. She didn't slam the door. She just left the room, leaving him alone with the cold coffee and the silence, which was no longer empty, but filled with the sound of a ladder stretching up into the dark, forever out of reach.
