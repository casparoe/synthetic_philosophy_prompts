  # Habitat Destruction & Wild Suffering: A Classification Instrument

  ## I. Decision Tree (Branching Questions)

  1.  **Baseline Welfare:** In the original habitat, do most sentient animals experience net positive welfare over their lifetimes?
      *   **Yes** → Go to 2
      *   **No** → Go to 3
  2.  **Counterfactual Density:** Does the converted land support a *higher* density of sentient individuals than the original habitat? (e.g., Pasture vs. Forest)
      *   **Yes** → Go to 4
      *   **No** → Go to 5
  3.  **Counterfactual Density:** Does the converted land support a *higher* density of sentient individuals than the original habitat? (e.g., Pavement vs. Forest)
      *   **Yes** → Go to 4
      *   **No** → Go to 5
  4.  **Pulse vs. Flow:** Do the animals killed *during* clearing constitute the majority of the moral weight compared to future population changes?
      *   **Yes (Pulse)** → Go to 6
      *   **No (Flow)** → Go to 7
  5.  **Pulse vs. Flow:** Do the animals killed *during* clearing constitute the majority of the moral weight compared to future population changes?
      *   **Yes (Pulse)** → Go to 6
      *   **No (Flow)** → Go to 7
  6.  **Death as Harm:** Is an instantaneous, painless death a harm to the animal that dies?
      *   **Yes** → Go to 8
      *   **No** → Go to 9
  7.  **Non-Identity:** Does preventing a potentially happy animal from being born count as a moral loss?
      *   **Yes** → Go to 10
      *   **No** → Go to 11
  8.  **Aggregation Currency:** How should we weigh different species? (Equal / Weighted / Suffering-Only)
      *   **Equal** → **Leaf A**
      *   **Weighted** → **Leaf B**
      *   **Suffering-Only** → **Leaf C (Empty)**
  9.  **Displacement:** Do animals displaced by clearing typically survive to reproduce elsewhere?
      *   **Yes (Leakage)** → **Leaf D**
      *   **No (Mortality)** → **Leaf E**
  10. **Aggregation Currency:** How should we weigh different species?
      *   **Equal** → **Leaf F**
      *   **Weighted** → **Leaf G**
      *   **Suffering-Only** → **Leaf H**
  11. **Displacement:** Do animals displaced by clearing typically survive to reproduce elsewhere?
      *   **Yes (Leakage)** → **Leaf I (Empty)**
      *   **No (Mortality)** → **Leaf J**

  *(Note: Paths converge based on axiological compatibility. See Leaf Definitions below.)*

  ## II. Node Table

  | Node | Question Focus | Permitted Answers | Type |
  | :--- | :--- | :--- | :--- |
  | **1** | **Baseline Welfare** | Yes (Net Positive) / No (Net Negative) | Empirical |
  | **2/3** | **Counterfactual Density** | Yes (Ag/Pasture) / No (Pavement/Sterile) | Empirical |
  | **4/5** | **Pulse vs. Flow** | Yes (Clearing Deaths Dominate) / No (Future Flow Dominates) | Empirical |
  | **6** | **Death as Harm** | Yes (Deprivation Counts) / No (Only Experience Counts) | Axiological |
  | **7** | **Non-Identity** | Yes (Total View) / No (Person-Affecting) | Axiological |
  | **8/10** | **Aggregation Currency** | Equal / Weighted by Capacity / Suffering-Only | Axiological |
  | **9/11** | **Displacement** | Yes (Leakage) / No (Displaced Mortality) | Empirical |

  ---

  ## III. Leaf Positions (Verdicts & Commitments)

  *   **Leaf A: Traditional Conservationist.** **Verdict:** Net Negative (Destruction is bad). **Awkward Commitment:** Must value the lives of predators that cause immense suffering to others.
  *   **Leaf B: Capacity-Weighted Conservationist.** **Verdict:** Net Negative. **Awkward Commitment:** Disregards the suffering of small-bodied taxa (insects) as morally negligible.
  *   **Leaf C: Empty (Unattractive).** **Verdict:** N/A. **Reason:** Unattractive; claims wild lives are positive but aggregates only suffering, ignoring the good.
  *   **Leaf D: Pulse Absolutist.** **Verdict:** Net Negative. **Awkward Commitment:** Prioritizes the manner of death during clearing over the prevention of future suffering.
  *   **Leaf E: Unnamed (Prior Existence Negative).** **Verdict:** Net Negative. **Awkward Commitment:** Opposes destruction due to current deaths, indifferent to future prevention of suffering.
  *   **Leaf F: Agricultural Optimist.** **Verdict:** Net Negative. **Awkward Commitment:** Suggests intensive agriculture creates more net suffering than wild predation (counter-intuitive).
  *   **Leaf G: Unnamed (Weighted Negative).** **Verdict:** Net Negative. **Awkward Commitment:** High-density agriculture creates more high-capacity suffering than wild habitats.
  *   **Leaf H: Suffering-Focused Utilitarian.** **Verdict:** Net Positive (Destruction reduces suffering). **Awkward Commitment:** Implies paving over nature is morally obligatory to prevent birth.
  *   **Leaf I: Empty (Incoherent).** **Verdict:** N/A. **Reason:** Incoherent; Person-Affecting view (Node 7 No) cannot logically rely on Leakage (Node 11 Yes) for net calculations.
  *   **Leaf J: Negative Utilitarian (Hard).** **Verdict:** Net Positive. **Awkward Commitment:** Views the extinction of sentient life as purely beneficial regardless of happy lives lost.
  *   **Leaf K: Person-Affecting Conservationist.** **Verdict:** Net Negative. **Awkward Commitment:** Cannot object to replacing wild animals with equally happy farm animals.
  *   **Leaf L: Leakage Realist.** **Verdict:** Neutral/Negative. **Awkward Commitment:** Destruction merely displaces suffering rather than reducing it globally.

  ## IV. Seminar Notes

  **Indistinguishable Leaves:**
  *   **Leaf A (Traditional)** and **Leaf B (Weighted)** often yield identical verdicts in mammal-dominant habitats; the tree separates them only when insect biomass is significant.
  *   **Leaf H (SFU)** and **Leaf J (Hard NU)** converge on "Destruction is Good" but diverge on whether preventing happy lives is a *loss* that is merely outweighed (H) or not a loss at all (J).

  **Closing Note to Seminar Leader:**
  Expect the class to stall at **Node 1 (Baseline Welfare)**. While students identify strongly with axiological labels (Utilitarian vs. Deontologist), the sign of the net welfare effect hinges empirically on whether wild animal lives are deemed net positive or negative. This is not a philosophical disagreement but an empirical one regarding predation, disease, and starvation rates, which allows participants to talk past one another while believing they are debating values. Force a consensus on the empirical baseline before proceeding to Node 4.
