      Does "woken once" mean Monday? And the second wake is Tuesday?
      Standard interpretation:
      H: Wake Mon.
      T: Wake Mon. Flip C2.
         If C2=H: Wake Tue.
         If C2=T: Sleep Tue.
      This matches my calculation above.

      *Refining the "Verbal Dispute" section:* Be careful not to dismiss the dispute as *merely* verbal if one side thinks it's substantive. Phrase it as "Parts of the dispute that *could be* merely verbal."

