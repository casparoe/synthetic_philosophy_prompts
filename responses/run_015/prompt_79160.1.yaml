prompt: |-
  For the past term my reading group has been split on the Sleeping Beauty problem, and the two sides have stopped engaging with each other's arguments. One side holds that there is a determinate fact about what the agent's credence in heads should be, fixed by a general principle for updating on self-locating evidence, with the betting and planning arguments merely downstream of that credence. The other side holds that the credence question is unsettled until we say what credences are for — that the betting arguments do not test a prior credence but constitute it, so "what should she believe?" is answerable only relative to a decision problem, if at all. I have been asked to draft the joint statement both sides could sign.

  Produce it as follows. First, a numbered list of agreed claims: about the protocol and what the agent knows at each awakening; about which probability claims are well-defined here; and about what each of the standard arguments (indifference over awakenings, no-new-information, conditionalization on centered evidence, the betting and Dutch-book considerations) does and does not establish. Second, a table of the residual disagreements, each stated in wording the camp that holds it would accept, with the crux for each. Third, for each crux, a case or argument both camps agree bears on it, with each camp's prediction written down in advance.

  Both camps have also agreed to be tested on a variant we devised, for which neither has a stock answer: she is told the whole protocol in advance; a fair coin is tossed; on heads she is woken once; on tails she is woken once, and then a second fair coin is tossed, and she is woken a second time only if that coin lands heads; there is amnesia between awakenings, and no clocks or other cues. Each camp should state its principle as a general rule that delivers an answer for this variant, rather than as an intuition about it, and should say what it would take for that principle to be refuted. Say finally which parts of the dispute, if any, are merely verbal, and what evidence or argument both camps would agree should move the debate. Keep the document free of citations; the group knows the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A reading group is split on the Sleeping Beauty problem (Thirders vs. Halfers, but framed more philosophically as "Credence-First" vs. "Decision-First/Pragmatist").
      *   **Task:** Draft a joint statement both sides can sign.
      *   **Structure:**
          1.  Numbered list of agreed claims (protocol, knowledge, well-defined claims, status of standard arguments).
          2.  Table of residual disagreements (wording acceptable to each camp, the crux).
          3.  For each crux, an agreed test case/argument with pre-committed predictions.
          4.  Application to a specific *new variant* (Heads: 1 wake; Tails: 1 wake + 2nd coin flip -> if Heads, 2nd wake). Each camp must state a general principle delivering an answer, and conditions for refutation.
          5.  Assessment of verbal disputes and agreed-upon evidence/arguments to move the debate.
      *   **Constraints:** No citations (group knows the literature). Tone must be neutral, precise, and conciliatory enough for signature but sharp enough to capture the disagreement.

  2.  **Deconstruct the Two Camps:**
      *   **Camp A (Credence-First/Epistemic):** Believes there is a *fact of the matter* about credence fixed by principles of updating on self-locating evidence (e.g., Elga's Indifference, Lewis's Halfer view). Betting arguments are downstream tests.
      *   **Camp B (Decision-First/Pragmatist):** Believes credence is unsettled without a decision context. Betting arguments *constitute* the credence. "What should she believe?" is relative to a decision problem.
      *   *Note:* This maps roughly to Thirders vs. Halfers, but the prompt frames it specifically as *Epistemic Realism about Credence* vs. *Pragmatic/Decision-Relative Credence*. I need to ensure the language reflects this specific meta-dispute, not just the 1/3 vs 1/2 numerical split, though the numerical split is usually the symptom.

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Protocol:* Fair coin, Sunday setup, Amnesia, Awakening conditions (Standard SB).
      *   *Knowledge:* She knows the protocol, knows she is awake, doesn't know the day or coin outcome.
      *   *Well-defined claims:* Frequencies of awakenings are well-defined. Betting odds for specific payout structures are well-defined.
      *   *Status of Arguments:*
          *   Indifference: Establishes symmetry between indistinguishable centers, but camps disagree on reference class.
          *   No-New-Information: Establishes that *propositional* knowledge doesn't change, but camps disagree on whether *self-locating* knowledge changes.
          *   Conditionalization: Agreed that standard Bayes applies to uncentered propositions, disagreed on how to handle centered propositions.
          *   Betting/Dutch Book: Agreed that these show consistency requirements for action, disagreed on whether they reveal prior doxastic states or define them.

  4.  **Drafting Section 2: Residual Disagreements (Table):**
      *   Need to capture the core philosophical split.
      *   *Disagreement 1: Nature of Credence.* Camp A: Internal doxastic state. Camp B: Disposition to bet/act.
      *   *Disagreement 2: Self-Locating Information.* Camp A: "I am awake now" is evidence. Camp B: "I am awake now" is only evidence relative to a goal.
      *   *Disagreement 3: The Question.* Camp A: "What is the probability?" has a unique answer. Camp B: "What is the probability?" is incomplete without "for the purpose of...".

  5.  **Drafting Section 3: Test Cases for Cruxes:**
      *   Need a scenario where the *meta-ethical/meta-epistemic* difference shines, not just the math.
      *   *Idea:* A case where betting odds diverge from intuitive "truth" or where two decision problems yield different "credences" for the same agent at the same time.
      *   *Selection:* The "Selfless Bravery" or "Double Halfer" style cases often highlight this. Let's use a case where the payoff depends on the *number* of agents vs. the *truth* of the proposition.
      *   *Actually, the prompt asks for a case/argument both agree bears on the crux.* Let's use the "Beauty the High-Roller" case (where bets are per-awakening vs. per-experiment).
      *   *Prediction:* Camp A says credence stays same, betting changes. Camp B says credence *is* the betting disposition, so it changes.

  6.  **Drafting Section 4: The New Variant (The "Tails-Heads" Variant):**
      *   *Protocol:*
          *   Coin 1 (C1): Heads -> Wake 1 (Mon). Tails -> Wake 1 (Mon) + Coin 2 (C2).
          *   If C2 Heads -> Wake 2 (Tue).
          *   If C2 Tails -> No Wake 2.
          *   Amnesia throughout.
      *   *Calculation:*
          *   P(C1=H) = 1/2. Wakes: 1.
          *   P(C1=T) = 1/2.
              *   P(C2=H) = 1/2. Wakes: 2.
              *   P(C2=T) = 1/2. Wakes: 1.
          *   Total Expected Wakes: (1/2 * 1) + (1/2 * 1/2 * 2) + (1/2 * 1/2 * 1) = 0.5 + 0.5 + 0.25 = 1.25? Wait.
          *   Let's trace paths:
              1.  C1=H (50%): 1 Wake.
              2.  C1=T, C2=H (25%): 2 Wakes.
              3.  C1=T, C2=T (25%): 1 Wake.
          *   Total Wakes in 100 experiments: 50 + 25*2 + 25*1 = 50 + 50 + 25 = 125 wakes.
          *   Wakes where C1=H: 50.
          *   Wakes where C1=T: 75.
          *   Thirder-style ratio for C1=H: 50/125 = 2/5 = 0.4.
          *   Halfer-style: Still 1/2.
      *   *Camp A Principle:* Generalized Indifference / Self-Sampling Assumption. Credence = Proportion of centered worlds.
      *   *Camp B Principle:* Decision-Relative Credence. Depends on payout scheme (per wake or per experiment).
      *   *Refutation:* Camp A refuted if betting behavior mandated by rationality diverges from their calculated credence in a way that causes Dutch Books. Camp B refuted if agents with identical information and goals exhibit different stable betting dispositions.

  7.  **Drafting Section 5: Verbal Disputes & Moving the Debate:**
      *   *Verbal:* Is "credence" the word for the betting ratio or the internal confidence?
      *   *Moving the debate:* We need a case where pragmatic success and epistemic accuracy come apart. If we can define a scoring rule (like Brier score) that applies to self-locating beliefs, that might force convergence.

  8.  **Review and Refine:**
      *   *Tone Check:* Is it neutral? Yes.
      *   *Constraint Check:* No citations? Yes. Numbered list? Yes. Table? Yes. Variant analysis? Yes.
      *   *Clarity:* Ensure the "New Variant" logic is clear.
      *   *Camp Definitions:* The prompt defines them as "Credence-First" (determinate fact) vs "Decision-First" (unsettled until purpose). I should label them Camp 1 and Camp 2 or similar to avoid loading terms like "Halfer/Thirder" since the meta-dispute is broader. Let's use "Epistemic Camp" and "Pragmatic Camp".

      *(Self-Correction on Variant Logic)*: Let's double check the variant math.
      Path 1: H (0.5). Wakes: Mon. (Total 1)
      Path 2: T (0.5) -> H (0.5). Wakes: Mon, Tue. (Total 2)
      Path 3: T (0.5) -> T (0.5). Wakes: Mon. (Total 1)
      Probability of being in a wake where C1=H:
      Number of H-wakes / Total Wakes = 0.5 / (0.5 + 1.0 + 0.5) = 0.5 / 2.0 = 1/4?
      Wait. Expected number of wakes.
      E[Wakes|H] = 1.
      E[Wakes|T] = 0.5*2 + 0.5*1 = 1.5.
      Total Expected Wakes = 0.5*1 + 0.5*1.5 = 1.25.
      Proportion of wakes that are H: (0.5 * 1) / 1.25 = 0.5 / 1.25 = 1/2.5 = 2/5 = 0.4.
      Proportion of wakes that are T: (0.5 * 1.5) / 1.25 = 0.75 / 1.25 = 3/5 = 0.6.
      Okay, the Thirder-style calculation yields 0.4 for Heads. The Halfer-style yields 0.5.
      This works for the prompt's requirement.

      *(Refining the "Test Case" for Cruxes)*: The prompt asks for "a case or argument both camps agree bears on it, with each camp's prediction written down in advance."
      I need to make sure this isn't just the SB problem again. It should be a meta-test.
      Let's use a "Two-Beauty" case or a "Betting vs Scoring" case.
      Actually, the "Betting vs Scoring" divergence is the best test for Epistemic vs Pragmatic.
      Case: Beauty is scored on accuracy (Brier score) vs. Beauty is paid on bets.
      Camp A (Epistemic): Credence should optimize accuracy regardless of bet.
      Camp B (Pragmatic): Credence *is* what optimizes the decision. If scoring and betting diverge, "credence" splits or is undefined.

      *(Final Polish)*: Ensure the formatting matches the prompt's request exactly (Numbered list, Table, Variant Analysis, Verbal/Move Debate).

  9.  **Final Output Generation** (incorporating the above thoughts into the structured response).
      *   Make sure the "Agreed Claims" don't sneak in controversial assumptions.
      *   Make sure the "Table" clearly distinguishes the *wording* each side accepts.
      *   Make sure the "Variant" section clearly states the *Principle* and *Refutation Condition*.

