answer: |-
  # JOINT STATEMENT ON THE SLEEPING BEAUTY PROBLEM

  **Date:** [Current Date]
  **Parties:** The Epistemic Camp (Camp E) and The Pragmatic Camp (Camp P)

  ## I. AGREED CLAIMS

  1.  **Protocol and Knowledge:**
      *   A fair coin is tossed on Sunday.
      *   If Heads, the agent is awakened once (Monday).
      *   If Tails, the agent is awakened twice (Monday and Tuesday).
      *   An amnesiac agent is unable to distinguish awakenings or determine the day via external cues.
      *   At any awakening, the agent knows the protocol, knows she is currently awake, but does not know the coin outcome or the day.

  2.  **Well-Defined Claims:**
      *   It is a determinate fact that the objective chance of the coin landing Heads is 1/2.
      *   It is a determinate fact that, over many repetitions of the experiment, 1/3 of all awakenings occur in Heads-worlds (assuming the standard protocol).
      *   It is a determinate fact that specific betting setups (e.g., paying per awakening vs. paying per experiment) mandate specific betting odds to avoid sure losses or maximize expected utility.

  3.  **Status of Standard Arguments:**
      *   **Indifference over Awakenings:** Both camps agree this principle establishes a symmetry between subjectively indistinguishable centers. Camp E holds this fixes credence directly; Camp P holds this fixes betting ratios only relative to a counting measure.
      *   **No-New-Information:** Both camps agree the agent receives no new *uncentered* propositional information upon waking. Camp E holds she receives new *centered* information; Camp P holds that "information" is only meaningful relative to its impact on decision outcomes.
      *   **Conditionalization:** Both camps agree standard Bayesian conditionalization applies to uncentered propositions. They disagree on whether and how it applies to centered propositions (self-locating beliefs).
      *   **Betting and Dutch-Book Considerations:** Both camps agree that rational agents should not accept Dutch Books. Camp E holds that vulnerability to a Dutch Book indicates an inconsistency between credence and action. Camp P holds that vulnerability to a Dutch Book indicates an inconsistency in action plans, which *defines* the credence.

  ## II. RESIDUAL DISAGREEMENTS

  | Topic | Camp E Wording (Epistemic) | Camp P Wording (Pragmatic) | The Crux |
  | :--- | :--- | :--- | :--- |
  | **Nature of Credence** | Credence is a doxastic attitude representing the agent's estimate of truth, fixed by evidence and updating rules prior to decision contexts. | Credence is a summary of the agent's disposition to act in decision problems; it has no value independent of a payoff structure. | Is credence a *mirror* of the world (E) or a *tool* for navigation (P)? |
  | **Self-Locating Evidence** | "I am awake now" provides evidence that shifts credence because it selects a reference class of centers where awakenings are more frequent. | "I am awake now" provides no evidence until a decision problem specifies whether payoffs accrue per-center or per-world. | Does the indexical fact *itself* carry probability weight (E), or does weight derive from the *stakes* attached to the index (P)? |
  | **The Question** | "What should her credence be?" has a unique, context-independent answer. | "What should her credence be?" is incomplete; it must be asked as "What odds should she take for purpose X?" | Is there a "view from nowhere" for credence (E), or is all credence "view from somewhere" (P)? |

  ## III. TEST CASES FOR CRUXES

  For each crux above, we agree the following case bears directly on the resolution. We record our predictions in advance.

  **Case:** *Beauty the Accuracy-Seeker.*
  Beauty is awakened as per the standard protocol. She is not offered bets. Instead, she is told that upon the conclusion of the experiment, her "credence report" given at each awakening will be scored using a strictly proper scoring rule (e.g., Brier score) applied to *each awakening independently*. Her goal is to minimize total penalty points.

  *   **Camp E Prediction:** Beauty should report 1/3. The scoring rule measures epistemic accuracy. Since 2/3 of awakenings are Tails, reporting 1/3 for Heads minimizes expected inaccuracy across centers. This confirms credence is distinct from betting and fixed by evidence.
  *   **Camp P Prediction:** Beauty should report 1/3, but this does not reveal a "prior credence." It reveals that the scoring rule *creates* a decision problem where the payoff is per-awakening. If the scoring rule were applied per-experiment (summing errors across days), she should report 1/2. This confirms credence is relative to the payoff structure.

  **Refutation Condition:**
  *   **For Camp E:** If it is shown that minimizing accuracy scores requires different reports depending on whether the score is aggregated per-awakening or per-experiment, Camp E must concede credence is not fixed solely by evidence.
  *   **For Camp P:** If Beauty is shown to be rationally required to report the same number regardless of how the scoring is aggregated (because her *evidence* hasn't changed), Camp P must concede credence is not solely constituted by the decision problem.

  ## IV. THE VARIANT PROTOCOL

  **Protocol:**
  1.  A fair coin (C1) is tossed.
  2.  **If C1 is Heads:** Agent is awakened once (Monday). Experiment ends.
  3.  **If C1 is Tails:** Agent is awakened once (Monday). A second fair coin (C2) is tossed.
      *   **If C2 is Heads:** Agent is awakened a second time (Tuesday).
      *   **If C2 is Tails:** Agent is not awakened on Tuesday.
  4.  Amnesia applies between all awakenings. No clocks or cues.

  **Analysis:**
  *   Expected Wakes given C1=Heads: 1
  *   Expected Wakes given C1=Tails: 1.5 (1 on Mon + 0.5 chance of Tue)
  *   Ratio of Heads-Wakes to Total Wakes: $0.5 / (0.5 + 0.75) = 0.5 / 1.25 = 2/5$.

  **Camp E Principle (Generalized Self-Sampling):**
  *   **Rule:** Upon awakening, the agent should assign credence to a hypothesis proportional to the expected number of centers (awakenings) that hypothesis generates.
  *   **Answer for Variant:** Credence in C1=Heads is **2/5**.
  *   **Condition for Refutation:** If a Dutch Book can be constructed against an agent holding 2/5 credence who accepts bets offered *per experiment* (rather than per awakening), or if it is proven that this updating rule violates diachronic coherence constraints independent of payoff structures.

  **Camp P Principle (Decision-Relative Credence):**
  *   **Rule:** The agent's credence is defined by the odds she accepts in a specific betting scenario. Without a specified payoff structure (per-wake vs. per-experiment), the question "What is the credence?" has no answer.
  *   **Answer for Variant:**
      *   If paid per awakening: Accept odds corresponding to **2/5**.
      *   If paid per experiment: Accept odds corresponding to **1/2**.
      *   If no bet is offered: The question is **unsettled**.
  *   **Condition for Refutation:** If agents with identical information and identical decision problems (same payoff structure) are shown to be rationally required to adopt different betting dispositions, or if a decision problem can be constructed where no stable betting disposition avoids irrationality.

  ## V. VERBAL DISPUTES AND PATHS FORWARD

  **Merely Verbal Components:**
  Both camps agree that a portion of the dispute is verbal. Specifically, if Camp E uses "credence" to mean *degree of belief aimed at truth* and Camp P uses "credence" to mean *optimal betting quotient*, they may be talking past one another. If Camp P admits there is a "degree of belief" (in Camp E's sense) that is 1/2, and Camp E admits there is a "betting quotient" (in Camp P's sense) that is 1/3, the numerical disagreement may dissolve into a taxonomy dispute.

  **Evidence to Move the Debate:**
  To move beyond verbal stipulations, both camps agree the debate should focus on **Scoring Rules vs. Betting Markets**.
  1.  **Convergence Point:** If both camps agree that rational agents should maximize expected utility, the dispute reduces to whether "utility" includes epistemic accuracy as a terminal value (Camp E) or only instrumental success (Camp P).
  2.  **Required Argument:** We require a formal proof demonstrating whether a single numerical value can simultaneously satisfy:
      *   Diachronic coherence (updating on centered evidence).
      *   Synchronic coherence (avoiding Dutch Books in all standard payoff structures).
      *   Accuracy optimization (minimizing Brier scores in all aggregation methods).

  If such a value exists, Camp P must concede credence is determinate. If no such value exists, Camp E must concede credence is fragmented or context-dependent. Until this proof is produced, we acknowledge the stalemate as rational.

  ***

  **Signed,**

  _________________________ (Representative, Epistemic Camp)

  _________________________ (Representative, Pragmatic Camp)
