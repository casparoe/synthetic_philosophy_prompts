answer: |-
  You have rediscovered, through ten years of drop tests and lab arguments, the central problem in the metaphysics of dispositions. Your intuition is correct: the simple conditional analysis ("Fragile means *would* break *if* struck") is logically vulnerable, and your four patterns map almost perfectly onto the specific counterexamples that kept philosophers busy from the 1990s through the 2000s.

  The word your colleague was trying to remember is **Fink**. In American slang, a fink is a police informer or a strikebreaker; in metaphysics, it is a disposition that vanishes the moment it is tested.

  Here is the vocabulary you need, mapped to your cases, with the definitions and distinctions required to explain to an engineer why "passed the test" and "is safe" come apart.

  ### 1. The Vocabulary for Your Four Patterns

  **Pattern 1: The Padded Rig (External Interference)**
  *   **Philosophical Name:** **Masking** (or *Ceteris Paribus* Failure).
  *   **Definition:** The object retains the disposition (it is fragile), and the stimulus occurs (it is dropped), but an external factor prevents the *manifestation* (breaking) without removing the disposition itself.
  *   **Engineering Translation:** The test conditions were not *ceteris paribus* (all else being equal). The padding absorbed the energy that would have triggered the manifestation. The fragility is still there; it was just hidden.
  *   **SCA Status:** **Harmless.** This does not break the "would-if" analysis if you define the stimulus carefully. If "struck" means "subjected to sufficient force to break," the antecedent wasn't met. If "struck" means "dropped on the rig," the conditional is false, but we accept this as a testing error, not a metaphysical problem.

  **Pattern 2: The Monitor and Change (Extrinsic Removal)**
  *   **Philosophical Name:** **Finkish Disposition** (or simply **Fink**).
  *   **Definition:** The object has the disposition initially, but the arrival of the stimulus triggers a mechanism that *removes* the disposition before the manifestation can occur.
  *   **Engineering Translation:** The component is fragile, but the test rig triggers a change that makes it non-fragile instantly.
  *   **SCA Status:** **Damaging.** "It is fragile" is true. "It would break if struck" is false (because it stops being fragile when struck). The conditional analysis fails.
  *   **Why it feels like cheating:** The change is **extrinsic** and **interventionist**. It relies on a separate device (the monitor) that could malfunction.

  **Pattern 3: The Shear-Thickening Gel (Intrinsic Removal)**
  *   **Philosophical Name:** **Intrinsic Fink** (or **Constitutional Fink**).
  *   **Definition:** Like the Fink, the disposition (e.g., softness/deformability) is lost upon the arrival of the stimulus. However, the removal is caused by the **intrinsic physical constitution** of the object responding lawfully to the stimulus, not by an external agent or added device.
  *   **Engineering Translation:** The material's normal operating physics dictate that impact causes hardening. It is "soft" in storage but "hard" in use.
  *   **SCA Status:** **Damaging.** Logically, it is identical to Pattern 2: "Soft" is true, "Deforms if struck" is false.
  *   **Why it feels different:** You are right to distinguish this from Pattern 2. In Pattern 2, the disposition is *sabotaged*. In Pattern 3, the disposition is *consumed* or *transformed* by the object's own nature.
  *   **The Distinction:** Look at the **reliability of the basis**. In Pattern 2, the basis (the monitor) is contingent and separate. In Pattern 3, the basis (the molecular structure) is necessary and intrinsic. Pattern 2 is a trick; Pattern 3 is a feature.

  **Pattern 4: The Colleague with the Hammer (External Addition)**
  *   **Philosophical Name:** **Mimicker** (or **Mimic**).
  *   **Definition:** The object *lacks* the disposition (it is not fragile), but the arrival of the stimulus triggers an external mechanism that *produces* the manifestation anyway.
  *   **Engineering Translation:** The part is tough, but the test rig (or your colleague) ensures it breaks regardless.
  *   **SCA Status:** **Damaging.** "It is fragile" is false. "It would break if struck" is true. The conditional analysis falsely attributes fragility.

  ### 2. Which Patterns Damage the Analysis?

  *   **Pattern 1 (Padding):** **Harmless.** This is a test validity issue. You can fix this by tightening the definition of the stimulus (e.g., "struck with 50J of energy").
  *   **Patterns 2, 3, and 4:** **Damaging.** These break the logical equivalence between "Has Disposition D" and "Would Manifest M if Stimulus S."
      *   **Pattern 4 (Mimic)** makes non-fragile things look fragile.
      *   **Patterns 2 & 3 (Finks)** make fragile/soft things look safe.

  ### 3. The Boundary Between Pattern 2 and Pattern 3

  You asked for a case that sits on the boundary between the "Engineered Monitor" (Pattern 2) and the "Natural Material" (Pattern 3). This is the line between **Extrinsic Intervention** and **Intrinsic Constitution**.

  **The Boundary Case: Self-Healing Concrete with Microcapsules.**
  *   **The Setup:** Concrete is disposed to crack under stress. Embedded within it are microscopic capsules filled with a hardening resin. When a crack (stimulus) forms, it bursts the capsules, releasing resin that hardens and seals the crack instantly.
  *   **Why it's on the boundary:**
      *   Like **Pattern 3 (Gel)**: There is no external wire, sensor, or monitor. The response is sealed inside the material's volume. It behaves as a unified physical object.
      *   Like **Pattern 2 (Monitor)**: The mechanism is discrete. It is not a continuous change in the lattice (like the gel); it is a "device" (the capsule) triggered by the event. It was *engineered* to remove the "disposition to remain cracked," much like the monitor was engineered to remove fragility.
  *   **Where the line falls:** The line is drawn at **Causal Continuity**.
      *   In **Pattern 3 (Gel)**, the change is a continuous phase transition of the *same* matter. The molecules rearrange.
      *   In **Pattern 2 (Monitor)**, the change is a causal chain involving distinct components (Sensor -> Processor -> Actuator).
      *   In the **Boundary Case (Capsules)**, it is a causal chain (Crack -> Burst -> Flow -> Harden) but contained within the *same* material bulk.
  *   **Does the distinction do work?** Yes. For **reliability**. A Pattern 2 system fails if the sensor battery dies. A Pattern 3 system fails only if the laws of physics change. The Boundary Case fails if the capsules dry out. For safety certification, Pattern 3 is "Inherently Safe," Pattern 2 is "Actively Safe," and the Boundary Case is "Passively Active." You should treat Pattern 3 as a genuine material property and Pattern 2 as a system dependency.

  ### 4. A Name for Pattern 3

  The literature often lumps Pattern 3 in with Pattern 2 under the general heading of **Finks**. However, your intuition that they are distinct is shared by philosophers who worry about **Intrinsic Bases**.

  Since you asked for a tight definition to separate them, I propose you coin the term **"Endofink"** (from *endo-*, within).

  *   **Definition of Endofink:** A disposition is Endofinkish if the stimulus triggers the loss of the disposition via the object's **intrinsic, lawful physical constitution**, without reliance on extrinsic sensors or separate mechanical interventions.
  *   **Why coin it?** It separates **Physics** (Pattern 3) from **Engineering Controls** (Pattern 2).
  *   **Does it do work?** Yes. In failure analysis, an **Endofink** is a material specification (e.g., "Shear-thickening polymer"). A **Fink** is a system design (e.g., "Airbag deployment sensor"). If an Endofink fails, the material science was wrong. If a Fink fails, the component integration was wrong.

  ### 5. The One-Shot Case (The Match)

  **The Problem:** A match is disposed to light when struck. But once struck, it is ash. It cannot be struck again. So "It would light if struck" is true the first time, but false the second time. The disposition seems to destroy itself.

  *   **Philosophical Name:** **Temporary Disposition** (or **Single-Use Disposition**).
  *   **Does it belong to the family?** Yes, it is related to the Fink, but distinct. In a Fink, the disposition is *removed* by the stimulus to *prevent* the manifestation. In the Match, the disposition is *exercised* to *produce* the manifestation, and the exercise consumes the basis.
  *   **The Solution:** Philosophers (like David Lewis) solve this by **Time-Indexing**.
      *   Don't say: "It is disposed to light if struck."
      *   Say: "At time *t*, it is disposed to light if struck at *t*."
  *   **Engineering Translation:** This is **Consumable vs. Durable**. Your failure analysis protocols likely already distinguish these. A fuse is disposed to blow; a chassis is disposed to resist. The "would-if" analysis only holds for the specific time-slice before consumption. It does not damage the SCA provided you specify the time.

  ### Summary for the Engineer

  When explaining this to your former colleagues, use this table:

  | Pattern | Name | Disposition Present? | Manifestation Occurs? | Cause of Divergence | Safety Implication |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Padding** | **Mask** | Yes | No | External Buffer | **Test Invalid.** Retest. |
  | **2. Monitor** | **Fink** | Yes (initially) | No | Extrinsic Intervention | **System Risk.** Device can fail. |
  | **3. Gel** | **Endofink** | Yes (initially) | No | Intrinsic Physics | **Material Property.** Reliable. |
  | **4. Hammer** | **Mimic** | No | Yes | External Force | **Test Invalid.** False positive. |

  **The "Cheating" Distinction:**
  Pattern 2 is cheating because it relies on a **contingent intervention** to hide a flaw. Pattern 3 is not cheating because it relies on a **lawful transformation** to perform a function. Both break the simple "would-if" logic, but only Pattern 2 represents a hidden reliability risk. Pattern 3 represents a complex material behavior that requires better testing protocols (e.g., testing at different strain rates), not a redesign.

  **Final Note on the "Informer":**
  Your colleague was right. The word is **Fink**. It fits perfectly: a Finkish disposition "squeals" on itself by changing its nature the moment the "police" (the test stimulus) show up. Pattern 3 is just a Fink that doesn't need to call for backup—it handles the police itself.
