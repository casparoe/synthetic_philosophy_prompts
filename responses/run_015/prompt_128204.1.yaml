      *   *Conventionalism vs. Material Reference:* This is the tricky philosophical part. Berkeley is often read as a conventionalist (money is a token), *but* he insists it must represent real value (industry/land). It is not *purely* conventional in the sense of being unmoored from reality; it must be anchored in the capacity to produce. If there is no industry, the tickets are worthless. So, is it purely conventional? No, it refers back to real goods/land.
