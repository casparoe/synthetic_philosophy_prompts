answer: |-
  In a hospital pharmacy, two verifiers, Elena and Marcus, process prescriptions. When a prescription is valid, they stamp "Approved." Elena's neural realizer for judging validity is pattern $N_E$; Marcus's is $N_M$, physically distinct due to neuroplasticity from different training histories. The contrastive question is: "Why stamp *Approved* now (valid script) rather than *Rejected* (invalid script)?" The mental candidate cause is the belief *this prescription is valid*. The physical candidate cause is the coarse-grained state *prefrontal validation threshold met*, which subsumes both $N_E$ and $N_M$ without referencing semantic content. Both candidates are equally specific relative to the effect: specifying the exact microstate of $N_E$ is disproportionate, but the threshold state matches the binary outcome perfectly. The pattern holds across agents: had the script been invalid, neither would stamp, regardless of whether $N_E$ or $N_M$ would have realized the judgment. The physical vocabulary (*threshold met*) tracks the behavioral output but does not track the *reason* for the threshold (the medical rules), whereas the mental vocabulary (*valid*) captures the invariance across the distinct neural realizers that the specific physical descriptions miss.

  **The Exclusion Argument**
  *   **Verdict:** The mental cause is excluded.
  *   **Why:** The physical cause (*prefrontal validation threshold met*) is causally sufficient for the stamping behavior. The mental cause (*belief validity*) is distinct from the physical cause (by the constraint of multiple realizability across Elena and Marcus). Since the physical cause is sufficient and distinct, and we are ruling out systematic overdetermination, the mental cause is rendered causally redundant. The argument holds because the coarse-grained physical state satisfies causal closure without needing the semantic property.

  **The Friend's Proportional Difference-Making Account**
  *   **Verdict:** Indeterminate / Tie.
  *   **Why:** The Friend's test requires causes to be proportionate to the effect (not too specific, not too general) and answers to a contrastive question. The mental candidate (*belief validity*) is proportionate: it matches the binary nature of the stamp. However, the coarse physical candidate (*threshold met*) is *also* proportionate by the same metric; it is not the total microstate ($N_E$), nor is it a gerrymandered disjunction, but a respectable neuroscientific functional type. Since the test selects both candidates equally as valid causes for the same contrastive question, it fails to dissolve the rivalry. It refines the physical candidate from a microstate to a macro-state, but it does not eliminate the physical candidate in favor of the mental one.

  **The Invariance-Across-Realizers Account**
  *   **Verdict:** The mental cause is privileged.
  *   **Why:** This account demands that a cause mark a pattern that holds across all its realizers and that the realizer-level description misses. The mental property (*validity*) explains why both $N_E$ and $N_M$ lead to *Approve* rather than *Reject*, and why a change in medical rules (content) would change the behavior even if the neural threshold mechanism remained structurally identical. The physical property (*threshold met*) describes the mechanism but fails to explain the *alignment* of that mechanism with the external rules without smuggling in semantic terms. The mental vocabulary captures the invariance that the physical vocabulary, restricted to structural description, cannot.

  **The Deciding Feature and Verdict**
  The single feature doing the work is **Multiple Realizability across Agents** (Elena vs. Marcus). If you remove this and use only one agent, the Friend can argue for Identity ($M = P$), dissolving the problem by collapsing the levels. With two agents, Identity is blocked, and the rivalry is forced into the open. The sharpest objection your friend can make is that the coarse physical state (*threshold met*) is *itself* a content-involving description disguised as physics; they will argue you cannot define "validation threshold" without referencing what is being validated, meaning the physical candidate secretly relies on the mental vocabulary to be coherent. If that objection holds, the physical candidate is not truly content-free, and the Exclusion Argument cannot even get off the ground because the "physical" cause isn't purely physical.

  There is a tension between the constraint that the *physical vocabulary should not track the pattern* and the constraint that the *physical candidate must be respectable (not gerrymandered)*. A respectable physical kind usually tracks the pattern if it is to be proportionate. I have prioritized the **respectability** of the physical candidate to force the Friend's hand; if the physical candidate is too weak to track the pattern, the Friend dismisses it as disproportionate, and the case becomes trivial. By making the physical candidate strong enough to survive the proportionality test, I force the Friend to admit that proportionality alone does not select the mental.

  **Did you win?**
  Yes, but conditionally. You won the point that **proportionality is not a dissolution, but a refinement**. Your friend claimed proportionality eliminates the physical rival; this case shows it merely upgrades the physical rival from a microstate to a macro-state. The Exclusion Argument returns with full force at the macro-level. However, you did not prove the mental cause is *unique*, only that it is *explanatorily privileged* via invariance. Your friend can still retreat to the claim that the macro-physical state *is* the mental state (Identity), but you successfully blocked that by stipulating multiple realizability. The case shows his dissolution is **question-begging about which levels get to be causal**: he assumes the mental level is the only proportionate one, but a properly constructed physical level is equally proportionate.
