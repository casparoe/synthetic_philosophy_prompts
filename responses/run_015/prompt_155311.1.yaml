answer: |-
  You are asking for a unified field theory of your own conscience. You want a principle that respects the constraints of your job (time, verification, space) while accounting for the moral weight of your gatekeeping.

  The philosophical literature (Fricker, Dotson, Medina) focuses heavily on *identity prejudice*. Your gut tells you that's too narrow. You are tracking something broader: the management of **Epistemic Friction**.

  Here is the principle that sorts your eight cases, followed by the verdicts you will have to adjust, and finally an analysis of your two new scenarios.

  ### The Principle of Proportional Epistemic Regard

  **A journalist owes a source a level of interpretive effort and public recognition proportional to the source's proximity to the evidence and the stakes of their exclusion, constrained only by the unavoidable cost of verification.**

  This principle has three clauses. Each clause maps to your cases and forces specific verdicts.

  #### Clause 1: The Prejudice Prohibition
  *Identity-based friction is never an "unavoidable cost of verification."*
  If you discount a speaker because of who they are (role, gender, accent, affiliation) rather than what they are saying, you have violated the duty. You must expend extra effort to overcome this friction, not less.
  *   **Applies to Case 1 (The Nurse):** You violated this. The hospital's status created a frictionless path; her role created friction. You admitted this. The principle confirms your guilt.
  *   **Applies to Case 4 (The Academic):** You violated this in reverse. You afforded the man *excess* regard due to identity (affiliation/accent), which crowded out the woman. The man was not wronged (excess credibility is rarely harmful to the recipient), but the woman was. This is **Testimonial Smothering**. Your gut is right: the harm lands on the excluded expert, not the over-credited one.

  #### Clause 2: The Marginal Cost of Effort
  *Heuristic filtering is permissible only when the cost of deeper engagement is disproportionately high relative to the probability of truth, provided the filter is blind to identity.*
  You cannot verify everything. You are allowed rules of thumb (calibration), but only if they are based on *track record*, not *class*, and only if you do not waive them when proximity lowers the cost of verification.
  *   **Applies to Case 2 (Press Releases):** This is permissible calibration. It is based on historical data (overselling), not identity. It survives.
  *   **Applies to Case 3 (The Filtering Rules):** Here is where you must adjust your verdicts.
      *   **3(i) Unsolicited Emails:** This survives, but with a caveat. It is a *systemic* injustice (disparate impact) that is *individually* excusable. The cost of verification is too high for the volume. You are not culpable for the rule, but you must acknowledge the rule is unjust. You shouldn't feel "no guilt"; you should feel "tragic necessity."
      *   **3(ii) The Community Meeting:** This fails. You were *there*. The marginal cost of listening was near zero. The proximity to evidence was high. Applying the email filter here was negligence. Your gut is right to convict this, but wrong to acquit 3(i) entirely. 3(i) is excusable injustice; 3(ii) is culpable injustice.

  #### Clause 3: The Prohibition on Instrumentalization
  *Belief without attribution is a severer harm than disbelief.*
  If you accept a source's knowledge as true but deny them the status of "knower" in the public record (to save space or protect credibility), you have turned them into a datum. This violates the "public recognition" clause of the principle.
  *   **Applies to Case 5 (The Farmer):** Your gut is correct: this is worse than disbelief. Disbelief rejects the knower; extraction *uses* the knower while rejecting their status. This is **Epistemic Extraction**. It maintains the hierarchy (scientist explains, farmer feels) while stealing the labor. The principle condemns this sharply.
  *   **Applies to Case 7 (The Engineer):** This does not fit "Injustice" under this principle; it fits **Epistemic Corruption**. The friction wasn't caused by prejudice (Clause 1) or effort constraints (Clause 2); it was caused by profit incentives. Your gut says it's "worse" than Case 1. The principle agrees: Prejudice is a bug in the system; profit-driven suppression is a feature. It is more dangerous because it is rational, not irrational.
  *   **Applies to Case 6 (Non-English Research):** This is **Structural Injustice**. The "hearer" is the institution (the newsroom), not you individually. The friction (language) is remediable by the institution (hiring translators) but treated as unavoidable. The principle locates the culpability at the institutional level. You are right to call it injustice even without a specific culprit.
  *   **Applies to Case 8 (2009 Coverage):** This is **Hermeneutical Tragedy**, not Injustice. The "concepts didn't exist" clause means the cost of verification was infinite (you couldn't verify what you couldn't name). The friction was unavoidable. Your gut is right to resist calling this injustice. The distinction between 6 and 8 is *remediability*. 6 is remediable now; 8 was not remediable then.

  ---

  ### The Hard Truths: Which Verdicts Must Go?

  You asked me to tell you honestly which of your verdicts the principle makes you give up. Here are the three adjustments required to align your gut with the principle:

  1.  **On Case 3(i) (Unsolicited Emails):** You currently feel "no guilt." The principle demands you acknowledge this as **excusable injustice**. It is still an injustice because it correlates with class and country, but it is excused by the impossibility of verification. You must stop thinking of it as "fine" and start thinking of it as "a necessary evil that requires monitoring." If a tool arises that lowers the verification cost (see Case b), the excuse evaporates.
  2.  **On Case 7 (The Engineer):** You are trying to fit this into the "injustice" framework. The principle says **stop**. This is not testimonial injustice; it is corporate censorship. Calling it "injustice" dilutes the term. It is worse than injustice because it is intentional. Label it **Corruption**. This clarifies why it feels sharper than Case 1: one is a failure of character (bias), the other is a failure of structure (incentive).
  3.  **On Case 5 (The Farmer):** You suspect this is worse than disbelief. The principle confirms this, but clarifies *why*. It is not just that you harmed her; it's that you **lied to your readers**. You presented the scientist as the discoverer of the explanation. That is a fabrication of the epistemic chain. It is plagiarism of insight. Treat it with the same ethical severity as plagiarism of text.

  ---

  ### The Two New Cases

  You asked about two current dilemmas. Here is how the Principle of Proportional Epistemic Regard adjudicates them.

  #### (a) Deliberate Upward Adjustment (Affirmative Credibility)
  *You now deliberately adjust your credence upward for sources from groups that get systematically under-credited.*

  **Verdict:** This is **Repair**, not a new sin, *provided* it is transparent calibration.
  **Reasoning:** Under Clause 1, you have a standing debt of interpretive effort toward groups historically subjected to testimonial injustice. If you know your own gut (and the field's gut) discounts these sources by a factor of $X$, adjusting your credence by $X$ is not "managing people"; it is **Epistemic Calibration**. It returns the source to the baseline they are owed.
  **Caveat:** It becomes a sin if you credit them *beyond* what the evidence supports to make a political point. That violates Clause 2 (Marginal Cost of Effort). You must still verify; you are only adjusting the *threshold for listening*, not the *standard for truth*.

  #### (b) Algorithmic Reliability Scoring
  *Your newsroom is piloting a tool that scores source reliability from how often past sources with similar profiles panned out.*

  **Verdict:** This is **High Risk Epistemic Automation**.
  **Reasoning:** This looks like Case 2 (Calibration), but it functions like Case 3(i) (Filtering).
  *   **Why it might be fine:** If the "profile" data is strictly about *past accuracy* (e.g., "this lab's press releases are 80% accurate"), it is permissible calibration.
  *   **Why it is likely unjust:** If the "profile" includes demographic or institutional markers (e.g., "independent researchers," "Global South institutions"), the tool will codify Case 3(i) into a black box. It removes the "Marginal Cost" exception. A human journalist can override the rule when they are at a community meeting (Case 3ii); an algorithm cannot.
  *   **Condition for Acceptance:** The tool is ethical only if it scores *content history*, not *source identity*, and if it allows for human override when proximity is high. If it hardens the heuristic, it institutionalizes the injustice of 3(i) and makes 3(ii) inevitable.

  ### Summary
  Your gut is mostly reliable because it is tracking **Epistemic Agency**. You feel worst when a knower is turned into a tool (Case 5) or when the system is rigged to ignore truth for profit (Case 7). You feel best when you are calibrating for accuracy (Case 2).

  The principle asks you to formalize that:
  1.  **Acknowledge the cost of your efficiency rules** (3i is excusable injustice, not "fine").
  2.  **Distinguish Corruption from Injustice** (7 is a different animal than 1).
  3.  **Treat Extraction as Plagiarism** (5 is a fabrication of the truth-chain).

  If you hold those three adjustments, your gut and your ethics will align.
