  **Mitigation and Time:** Separate the questions. Question One: What is the risk if built *exactly* as proposed today? Use existing conditions. Question Two: What is the risk if built *with conditions* (elevated, flood-proofed)? Use the proposed conditions to define a *future* class for monitoring, but do not use them to lower the risk estimate for the current decision. You cannot grant based on a class that exists only because you granted. The conditions change the future risk, not the evidence for the current application. The board must record the risk of the proposal *before* mitigation to justify the need for mitigation.
  **Who Proposes:** The Board defines the class based on the Fixed Hierarchy. An applicant may propose a different class but bears the burden of proving a physical mechanism. A statistical correlation without a physical cause (e.g., proximity to fire hydrants) is rejected as data mining. If both classes pass the physical test, use the one with the larger sample size to reduce random error. The Board retains final authority on class definition to ensure consistency across cases. The applicant's engineer proposes hypotheses; the Board tests them against physical reality.

