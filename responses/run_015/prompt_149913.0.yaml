  1. **Scope and assumptions**
  This procedure answers one question: What is the annual chance that a structure built as proposed suffers flood damage exceeding the insurance deductible? It takes as given the effective Flood Insurance Study maps, county permit records, and state claim files. It assumes no new hydraulic modeling or field sampling is available. It declines to answer policy questions about equity, property rights, or comprehensive planning. It does not guarantee safety; it estimates frequency based on past performance of similar parcels. It treats the board's role as technical fact-finding for the record, leaving policy weighing to the vote. The scope is limited to evidence derivable from existing documents within a fifteen-minute review. The output must satisfy the "substantial evidence" standard on appeal, meaning a reasonable mind might accept it as adequate to support the conclusion. It is not a guarantee of correctness, but a defense of process. It assumes the past forty years of records are representative of future hazards, acknowledging that climate shifts may invalidate this assumption.

  2. **The procedure**
  1. **Define the Unit:** One case equals one parcel-year of exposure. If twelve units sit on one parcel, count one case per year. If a flood damages all twelve, count one claim per year. This prevents inflating data with correlated failures. A claim is only counted if it exceeds the deductible threshold relevant to the decision. This definition ensures that a single flood event does not artificially multiply the hazard rate.
  2. **Select Attributes:** List only physical features that alter water behavior: flood zone, distance to channel, ground elevation, finished floor elevation, soil type. Exclude procedural history (appeals, engineer identity, filing date). If an attribute does not change how water flows or pools, it is inadmissible. This filters out noise that looks like signal.
  3. **Apply Fixed Hierarchy:** To prevent ordering errors, narrow the class in this fixed order: (1) Flood Zone, (2) Distance to Channel (e.g., within 500 meters), (3) Elevation Relative to Base Flood. Do not skip steps. Do not swap order. This ensures two members starting from the same data reach the same class. Discretion on order creates discretion on results; removing it removes bias.
  4. **Check Sample Size:** Count the available parcel-years in the narrowed class. If fewer than thirty parcel-years, stop narrowing. If the class yields zero claims but covers fewer than fifty parcel-years, treat as insufficient data. Small samples create false zeros. This threshold balances specificity with statistical stability.
  5. **Calculate Rate:** Divide total claims by total parcel-years. This yields the annual chance. If the class has zero claims but sufficient size, record the rate as zero but note the lower bound of the confidence interval. This distinguishes between "no risk" and "no observed risk."
  6. **Default Rule:** If no class meets the size requirement, or if physical attributes are unknown, use the annual chance specified in the effective Flood Insurance Study map for that zone. This ensures a number is always available for the record.
  7. **Document Sources:** State clearly whether the rate comes from local claims data or the map default. Do not mix sources for a single rate. Mixing models and observations conflates prediction with history.
  8. **Review for Mechanism:** For any attribute used, confirm a physical reason exists (e.g., "closer to channel means higher velocity"). If no physical reason exists, discard the attribute even if statistics look clean. This prevents data mining from driving decisions.
  9. **Final Output:** Record the rate, the class definition, the sample size, and the source. This becomes the technical finding for the record. It must be clear enough for a state reviewer to replicate.

