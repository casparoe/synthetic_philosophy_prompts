      *   *Case 5 (School Valedictorian vs. Character Awards):* Verdict: Character awards bad/defeatist. Principle: Audibility? "Character" is less audible than grades. Ratchet? Valedictorian ratchets more. *Fit: Contradictory. User prefers the higher ratchet (valedictorian) because it's real, despite Jantelagen pressure to flatten.*
