  ### Part 1: The Logical Separators

  Before drawing the tree, we need to identify the "separators"—the fundamental disagreements that carve up the space. These are not theories, but concrete forks in the road that determine your config outputs.

  1.  **Coherence:** Is "consciousness" a fact we can discover (like "has a heart"), or a confused concept (like "is morally Tuesday")?
  2.  **Ontology:** Is consciousness a binary state (on/off) or a graded property (dimmer switch)? *This determines if your config stores a boolean or a weight.*
  3.  **Epistemic Policy:** When evidence is inconclusive (the bee), do we force a Yes/No decision, or do we output "Unknown"? *This determines if you need a `null` tier.*
  4.  **Evidence Type (Report):** Does the ability to *say* "I hurt" matter more than acting like it? *This separates the "Mammals Only" crowd from everyone else.*
  5.  **Evidence Type (Substrate):** Does the physical stuff (neurons) matter, or just the pattern (simulation/colony)? *This separates biological chauvinists from functionalists.*
  6.  **Evidence Type (Behavior):** Is watching the animal enough, or do we need to see inside its head? *This separates behaviorists from neuro-centrists.*
  7.  **Complexity Threshold:** Is there a minimum "size" required? *This separates the "Vertebrates" crowd from the "Inverts" crowd.*

  ---

  ### Part 2: The Decision Tree

  **Constraints:** Max 8 branch nodes. 6-8 leaves. All questions concrete.

  **Node 1 (Coherence):** Is "is it conscious" a fact about the world like "does it have a heart", or a nonsense phrase like "is it morally Tuesday"?
  *   **NO** → **Leaf A: The question isn't a real question.**
  *   **YES** → Go to Node 2.

  **Node 2 (Ontology):** Is consciousness a dimmer switch (some animals are 40% conscious) or a light switch (either fully conscious or not)?
  *   **DIMMER** → **Leaf B: Consciousness comes in degrees.** *(Config Note: Store `welfare_weight` as float 0.0–1.0, not boolean).*
  *   **SWITCH** → Go to Node 3.

  **Node 3 (Epistemic Policy):** If the evidence for the bee is inconclusive, do we assign a specific tier or mark it "Unknown"?
  *   **MARK UNKNOWN** → **Leaf C: Suspend Judgment.** *(Config Note: Tier = `null` / `pending_review`).*
  *   **ASSIGN TIER** → Go to Node 4.

  **Node 4 (Report):** Does the human patient who shows all pain responses but can't report anything actually feel pain?
  *   **NO** → **Leaf D: Mammals Only.** *(Logic: If non-reporting humans don't count, only reporting agents do. Config proxy: Mammals).*
  *   **YES** → Go to Node 5.

  **Node 5 (Substrate):** Does a detailed physics-level simulation of the 302-neuron worm (or an ant colony treated as a single agent) feel pain?
  *   **YES** → **Leaf E: Anything with behavioral markers.** *(Logic: Substrate doesn't matter; function does).*
  *   **NO** → Go to Node 6.

  **Node 6 (Behavior/Anatomy):** Is a crab that rubs at an injured claw feeling pain?
  *   **NO** → **Leaf F: All vertebrates including fish.** *(Logic: Inverts excluded; Fish/Chicken included via Node 4 precedent).*
  *   **YES** → Go to Node 7.

  **Node 7 (Complexity):** Is a fly that keeps grooming a leg after the leg is gone feeling pain?
  *   **NO** → **Leaf G: Vertebrates plus short list of inverts.** *(Logic: Complex inverts like crab yes; simple like fly no).*
  *   **YES** → **Leaf H: Anything with behavioral markers.** *(Logic: Low bar set; bees/worms included).*

  ---

  ### Part 3: Config & Logic Notes

  **1. The "Degrees" Leaf (Leaf B)**
  You asked if "40% conscious" is a real option. **Yes, it is coherent.** If you land on Leaf B, your config cannot store `is_conscious: true`. It must store a weight (e.g., `welfare_priority: 0.4`). This changes your schema from a flag to a scalar. Most welfare frameworks treat this as "moral uncertainty," but philosophically it allows for "partial moral status."

  **2. Mergeable Leaves (Leaf E & Leaf H)**
  **Leaf E** (Sim Worm = Yes) and **Leaf H** (Fly = Yes) result in the **exact same handling tier**: "Anything with behavioral markers."
  *   **Leaf E** gets there via *Functionalism* (pattern matters, not stuff).
  *   **Leaf H** gets there via *Behaviorism* (action matters, not complexity).
  *   **Action:** In your config, these map to the same `tier_id`. The tree distinguishes *why* you believe it, but the *output* is identical. You can collapse these in code, but keep the logic separate for audit trails.

  **3. The "Mammals Only" Leaf (Leaf D)**
  Strictly speaking, Node 4 (NO) implies "Only Reporting Humans." However, since no other animal reports, the practical config tier is "Mammals Only" (as the closest proxy for humans). If you need to be pedantic, label the tier `reporting_agents_only`, but `mammals_only` is the standard industry shorthand for this position.

  **4. Indistinguishable Cases**
  *   **Fish vs. Chicken:** The tree does not separate these. If the Crab (invert) is excluded (Node 6 NO), the Fish and Chicken are bundled into "Vertebrates." If your policy needs to distinguish fish from birds, you need an extra node, but that violates your 8-node limit. Given the welfare context, they are usually tiered together.
  *   **Sim Worm vs. Ant Colony:** I grouped these in Node 5. They test the same logical separator (Substrate Independence). If your group cares about "Collective vs. Individual" specifically, swap "Sim Worm" for "Ant Colony" in the question text; the logic path remains identical.

  **5. Uncertainty (Leaf C)**
  This is the **Precautionary Principle**. If you land here, your code shouldn't default to `false`. It should trigger a manual review flag or apply the highest tier by default. This is distinct from "We don't know" (Leaf A); Leaf C means "The question is real, but we can't answer it yet, so we act."

  ### Summary of Leaves for Config
  1.  `TIER_NULL` (Question isn't real)
  2.  `TIER_WEIGHTED` (Degrees)
  3.  `TIER_PENDING` (Suspend Judgment)
  4.  `TIER_MAMMALS` (Report-based)
  5.  `TIER_UNIVERSAL` (Functional/Behavioral - *Merge of E & H*)
  6.  `TIER_VERTEBRATES` (Anatomy-based)
  7.  `TIER_MIXED` (Vertebrates + Decapods/Cephalopods)

  *(Note: Leaves E and H merge into `TIER_UNIVERSAL`, giving you 7 distinct config outputs, fitting your 6-8 constraint.)*
