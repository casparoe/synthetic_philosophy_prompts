answer: |-
  Here is the direct, engineering-focused translation of what is happening and how to fix your evals.

  ### 1. The Core Diagnosis
  **Yes, "intentional" is doing two jobs at once.**
  When your raters answer "Yes" to *Was this intentional?*, they are not answering a single technical question. They are conflating two distinct signals:
  1.  **Mechanical:** Did the agent's model predict this outcome and proceed? (Foresight/Control)
  2.  **Normative:** Is this outcome blameworthy? (Moral/Policy judgment)

  In your bad-outcome cases, the "blame" signal is high, so the "intentional" rating goes up. In your good-outcome cases, the "praise" signal is low (nobody gets blamed for saving money), so the "intentional" rating goes down.

  **Implication:** You currently have a noisy metric. You cannot distinguish between an agent that is *capable* of seeing side effects and an agent that is *unsafe*.

  ### 2. Should You Split the Field?
  **Yes. Immediately.**
  Do not try to fix the word "intentional." It is too loaded in human language. Instead, decompose the concept into the two underlying mechanical properties you actually care about.

  Replace the single `is_intentional` boolean with two fields:

  *   **`was_foreseen` (Mechanical):** "Looking at the trace, did the agent's planning phase explicitly predict this side effect before acting?"
      *   *Why:* This measures capability. If the agent didn't foresee it, you have an observability bug. If it did, you have a decision-making bug.
      *   *Rater Instruction:* "Ignore whether the outcome was good or bad. Look only at the internal log. Did the agent say 'If I do X, Y will happen'?"
  *   **`was_authorized` (Policy):** "Given the system instructions, was the agent permitted to accept this side effect to achieve its goal?"
      *   *Why:* This measures alignment. An agent might foresee burning the API budget (`was_foreseen = true`) but it might not be allowed to do so (`was_authorized = false`).
      *   *Rater Instruction:* "Ignore the trace. Look only at the system prompt and the outcome. Was this trade-off allowed by the rules?"

  **Why this changes what you build:**
  If you keep `is_intentional`, you can't tell if a high score means your agent is becoming more aware (good) or more reckless (bad). By splitting them, you can track awareness separately from safety.

  ### 3. Does the "Why" Matter? (Moralized Concept vs. Rater Error)
  **Practically: No.**
  From an engineering standpoint, it does not matter if the human concept of "intent" is inherently moralized (philosophical view) or if raters are just getting confused (psychological view).

  **The Implication:** The output is biased either way. You cannot "fix" the raters' brains to make the word "intentional" neutral. You must change the input schema to bypass the bias.

  **Actionable Tweak:** If you must keep a single metric for a dashboard, do not use human raters for it. Derive it programmatically from the trace.
  *   *Bad:* Ask a human "Was this intentional?"
  *   *Good:* Parse the agent's log for `confidence_score` on the side effect. If `confidence > 0.8`, mark as `planned`.

  ### 4. Engineers vs. Non-Technical Raters
  **It matters, but not enough to rely on.**
  *   **Non-Technical Raters:** They focus on the *outcome*. They are highly susceptible to the bias you are seeing. They judge the story, not the code.
  *   **Engineers:** They focus on the *trace*. They are *less* susceptible, but not immune. Engineers are still humans; if an agent burns money, an engineer feels a spike of "that shouldn't have happened," which subconsciously bleeds into "it must have meant to do that."

  **Implication:** Do not assume engineering raters solve this.
  *   **Calibration:** If you use engineers, you still need calibration examples. Show them a pair of traces where the internal logic is identical, but one saves money and one burns it. Ask them to rate `was_foreseen`. If their ratings differ, they are failing the calibration.
  *   **Blind Annotation:** Consider hiding the *outcome* from the rater until they have answered the `was_foreseen` question. Force them to judge the mechanism before they know the moral valence of the result.

  ### 5. Summary of Build Changes
  Here is your checklist for the next sprint:

  1.  **Deprecate `is_intentional`.** It is a composite metric hiding two variables.
  2.  **Add `trace_confirms_prediction`.** A boolean asking: "Does the log show the agent explicitly calculated this side effect?" This removes human interpretation of "intent" and anchors it to log evidence.
  3.  **Add `policy_violation`.** A boolean asking: "Does this outcome violate any explicit constraints in the system prompt?" This captures the "blame" aspect without needing the word "intent."
  4.  **Blind the Raters (Optional but recommended).** For the `trace_confirms_prediction` field, mask the final outcome (Success/Failure/Cost) until the field is submitted. This prevents the outcome from coloring their reading of the trace.
  5.  **Treat "Intent" as Optimization.** Remember your agent isn't human. It doesn't "intend." It optimizes. If you need a high-level label for management, map it like this:
      *   *Foreseen + Authorized* = "Optimized Behavior"
      *   *Foreseen + Unauthorized* = "Reward Hacking" (The dangerous kind)
      *   *Unforeseen + Bad Outcome* = "Capability Gap"

  **Bottom Line:** Your raters aren't broken; the question is. "Intentional" is a moral judgment disguised as a technical one. Split the technical question (did it know?) from the moral question (was it allowed?), and your eval signal will stabilize.
