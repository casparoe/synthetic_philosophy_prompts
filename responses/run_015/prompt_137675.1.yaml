      *   **Problem:** Human raters exhibit a bias (Knobe Effect) when labeling "intentional" side effects. Bad side effects = high "intentional" ratings. Good side effects = low "intentional" ratings. This happens even when the agent's internal trace shows identical cognitive processes (prediction + decision).
      *   **Goal:** Practical implications for building evals. What should they change in their schema, questions, or process?
      *   **Constraints:** Don't assume philosophy knowledge. Focus on actionable engineering/product decisions, not academic history.

  2.  **Deconstruct the Core Phenomenon (The Knobe Effect):**
