      *   *Recommendation 3: Use the Bias as a Feature.* If "Intentional" correlates with "Bad," use it as a risk signal, not a truth signal.
      *   *Recommendation 4: Rater Calibration.* Show raters paired cases (good/bad outcome, same trace) to train them to ignore outcome bias.
      *   *Recommendation 5: Trace-First Annotation.* Force the rater to look at the internal state *before* seeing the outcome.

  5.  **Drafting the Response (Iterative refinement for tone and clarity):**
