answer: |-
  Your inquiry touches upon the demarcation problem in the philosophy of science, specifically the tension between Popperian falsification and Lakatosian research programmes. As a physicist, you are intuitively distinguishing between errors in *boundary conditions* (parameters, initial states) and errors in *dynamical laws* (mechanisms, structural relations). To systematize your verdicts, we must apply a criterion of **independent testability** regarding the adjustments made to save a theory.

  ### The Principle: Progressive vs. Degenerative Shifts

  A theory is "right but early" if its predictive failures are resolved by adjusting **auxiliary hypotheses** (initial conditions, parameter values, or interfering factors) that are **independently testable** and do not alter the **hard core** (the fundamental causal mechanism). Conversely, a theory is falsified (or degenerating) if saving it requires modifying the hard core itself, or if the auxiliary adjustments are *ad hoc*—posited solely to accommodate the failure without independent empirical justification.

  The critical distinction is not merely whether the timeline slipped, but *why* it slipped. If the slip is due to a miscalculation of a quantity governed by known laws (e.g., the size of an oil reserve), the theory survives. If the slip is due to a misunderstanding of the law governing the quantity (e.g., the biological capacity for food production), the theory fails.

  ### Re-evaluating Your Verdicts

  Applying this principle forces a revision of your first verdict regarding **Malthus**.

  1.  **Malthus (Revision Required):** You judged this "right but early." However, Malthus did not merely underestimate the *date* of crisis; he posited a specific mechanistic law: food production grows *arithmetically*. This is a claim about the production function of agriculture, not a parameter like "acreage available." The Green Revolution demonstrated that food production can grow geometrically, driven by technology. To save Malthus, one must replace the arithmetic law with a logistic or exponential function dependent on innovation. This changes the **hard core** mechanism from "inevitable scarcity due to differential growth rates" to "scarcity only if innovation stalls." Since the rescue requires altering the causal mechanism, Malthus is **falsified**, not merely premature. Your intuition that the "finite substrate" remains is true, but that is a tautology of thermodynamics, not the specific Malthusian theory.

  2.  **Limits to Growth (Confirmed):** Your verdict stands. The model's structure assumed fixed relationships between growth and resources, ignoring price signals and substitution. Saving the model requires adding new feedback loops (structural changes) that were absent in the original causal commitment. These are not independent parameter tweaks but structural rescues to explain why the predicted collapse didn't happen.

  3.  **Hubbert Peak Oil (Confirmed with Nuance):** Your verdict holds. Hubbert's core mechanism is the bell-shaped extraction curve of a finite stock. The U.S. peak confirmed the mechanism. The global delay was due to underestimating the *parameter* of "recoverable reserves" via new technology (fracking, deepwater). The mechanism (finite stock depletion) remains invariant; the initial condition (size of the stock) was updated via independent geological and engineering data. This is a legitimate "right but early" case, distinct from Malthus because the error was in the *inventory*, not the *production law*.

  4.  **1900 Coal Exhaustion (Confirmed):** Your verdict stands. The core auxiliary assumption was that coal was the *only* viable high-density energy source. The emergence of petroleum and nuclear power was not a parameter adjustment but a substitution of the energy regime itself. The theory failed because its boundary condition (no substitution) was empirically false.

  ### The Fusion Prediction

  Magnetic-confinement fusion is **like Hubbert, not like Limits to Growth or Malthus.**

  *   **Mechanism:** The core physics (thermonuclear cross-sections, energy release) is experimentally verified (e.g., JET, NIF). This is the "hard core," and it has not been falsified.
  *   **Delays:** The failures to achieve commercial viability are engineering constraints: plasma instabilities, neutron damage to materials, and superconducting magnet limits. These are **auxiliary hypotheses** regarding confinement times and material tolerances.
  *   **Independent Testability:** Improvements in these areas (e.g., high-temperature superconductors) are testable independently of the fusion reactor's success. They represent progressive shifts in the protective belt.

  **Prediction:** Fusion will eventually achieve commercial viability. The "twenty years" heuristic was a parameter error based on linear extrapolation of engineering progress, not a falsification of the physical mechanism. It is "right but early."

  ### Epistemic Humility: Changing My Mind

  **What would change my mind?**
  I would abandon this principle if historical analysis showed that "independent testability" is invariably retrospective. If every "independent" adjustment (like new oil reserves or better magnets) is only deemed credible *after* the main theory is saved, then the distinction between "parameter" and "mechanism" is merely conventional (the Duhem-Quine problem). Specifically, if fusion fails not because of engineering limits, but because a new physical instability emerges at scale that violates current plasma physics (altering the hard core), my classification of fusion as "right but early" would be proven wrong, and it would join Malthus as falsified.

  **Vulnerability in Reasoning:**
  My reasoning is most vulnerable to the **theory-ladenness of observation**. Distinguishing a "parameter error" from a "mechanism error" often depends on how broadly one defines the mechanism. For example, if one defines Malthus's mechanism broadly as "resources are finite," it becomes unfalsifiable (and thus unscientific). If defined narrowly as "arithmetical growth," it is falsified. My principle relies on a stable definition of the "hard core," which historians of science often dispute.

  Verdict: \answer{A theory is "right but early" rather than falsified only when predictive failures are corrected by independently testable adjustments to auxiliary hypotheses or initial conditions that leave the core causal mechanism invariant.}
