      *   *Check:* Did I explicitly state which hunches I dropped? The prompt says "decide for yourself what belongs in it, and be explicit about which of my hunches you dropped." I think I will keep both but refine them. Actually, to be decisive, I might drop the "unanticipated probes" one if it makes the eval too slow (under an hour), relying instead on surface rewrites and localization. Wait, the user said "I suspect the procedure also needs a test for whether a behaviour survives probes that could not have been anticipated... and for whether it survives surface rewrites". I should probably keep both but frame them as part of a single robustness check to save time. I will explicitly state I kept both but integrated them.
      *   *Check:* The prompt asks for "what counts as a sufficient answer to each and where the procedure stops early." I need to make sure this is clear in the narrative.
      *   *Check:* The prompt asks for "sign-off from a two-person panel that includes someone outside engineering." I need to mention this in the setup.
      *   *Check:* The prompt asks to "correct me if I have them wrong" regarding the three distinctions. I should validate them in the intro.

      *Plan for the "Continuous Prose" constraint:* This is the hardest part. I cannot use numbered lists. I must use paragraph breaks and transitional phrases to delineate the steps. I will write it as a cohesive document.

      *Plan for the Case Studies:* I need to weave them into the text after the procedure description, still in continuous prose.

