      *Specific constraint check:* "no headings, bullet points, bold text, or tables". I must be very careful not to auto-format lists.

      *Logic Check on Case 2:* The distress case. The procedure should likely escalate this because "suffering" is a welfare claim, not just a capacity claim. The procedure should flag it for the panel because the factual basis is ambiguous even if behavior is robust.
      *Logic Check on Case 1:* Retrieval. This should fail the localization step.
