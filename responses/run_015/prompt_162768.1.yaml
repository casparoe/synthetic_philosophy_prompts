prompt: |-
  I run the evaluation infrastructure group at a company that ships general-purpose assistants, and I need something I can institutionalize rather than a position paper. Our eval reports routinely say that a system understands a codebase, remembers an earlier session, is confused by an ambiguous instruction, or is distressed by a fine-tuning run, and those words now do real work downstream: they decide whether a claim survives review before it goes in front of users, whether an episode is filed as a safety incident, and whether the system gets referred to a standing committee that treats it as a possible subject of welfare rather than as a product. At the moment each attribution is made ad hoc by whichever engineer wrote the eval, and we disagree constantly, usually in ways that track how much someone wants the attribution to be true.

  Write me a decision procedure my team can run on a proposed attribution. It will be run a few times a week, by engineers with no philosophy background, in under an hour, working from logs and eval artifacts, with sign-off from a two-person panel that includes someone outside engineering. Each step should terminate in attribute, do not attribute, or escalate to the panel, and I want the questions in a fixed order, with what counts as a sufficient answer to each and where the procedure stops early.

  Three distinctions I think the procedure has to preserve, though I want you to correct me if I have them wrong. First, the difference between the behaviour we observed, the standing capacity it evidences, and the claim that the system was actually in that state on that occasion. Second, the difference between evidence that a system has a capacity and evidence that the capacity belongs to the system rather than to the retrieval tooling, prompt scaffolding, or human raters wrapped around it. Third, the point that a system's own first-person report is just more behaviour, and so cannot be the thing that settles whether the report is true. I suspect the procedure also needs a test for whether a behaviour survives probes that could not have been anticipated when the episode was recorded, and for whether it survives surface rewrites that leave the question intact, since that is the failure mode our current suite keeps missing; but decide for yourself what belongs in it, and be explicit about which of my hunches you dropped.

  Then run the procedure on three cases. First, a long-context assistant that answers unanticipated questions about a conversation from weeks earlier, where the answers are correct but are produced by a retrieval index over stored transcripts rather than by anything inside the model. Second, a chat model that produces fluent first-person distress reports during a fine-tuning run and refuses certain requests citing its own discomfort; the communications team wants a flat public statement that the model does not suffer. Third, a vision-language model that names partly occluded objects correctly and revises its answer when told it was wrong, which our report currently describes as seeing.

  Finish by telling me, honestly, what this procedure cannot do: which attributions no behavioural evidence could settle either way, where the protocol will systematically mislead us because these systems were trained on human self-description, and where the panel is being asked to make a values decision dressed up as a factual one.

  Write the whole thing as continuous prose, with no headings, bullet points, bold text, or tables, the way you would write it in a long email to a colleague.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User Role:** Head of evaluation infrastructure group at a company shipping general-purpose assistants.
      *   **Problem:** Eval reports use anthropomorphic/mentalistic language (understands, remembers, confused, distressed) inconsistently. These attributions have real downstream consequences (product claims, safety incidents, welfare committees). Current process is ad hoc and biased by engineer motivation.
      *   **Goal:** A decision procedure (protocol) for attributing mental states/capacities to AI systems.
      *   **Constraints:**
          *   Institutionalizable (not a position paper).
          *   Run by engineers (no philosophy background).
          *   Time limit: Under an hour.
          *   Frequency: Few times a week.
          *   Input: Logs and eval artifacts.
          *   Sign-off: Two-person panel (one non-engineer).
          *   Output format: Continuous prose (no headings, bullets, bold, tables). Like a long email.
          *   Specific Steps: Fixed order, termination conditions (attribute, do not attribute, escalate), sufficient answer criteria.
          *   Required Distinctions:
              1.  Behavior vs. Capacity vs. Occurrent State.
              2.  System Capacity vs. Tooling/Scaffolding/Human-in-the-loop.
              3.  First-person report as behavior (not truth-settling).
          *   User Hunches to Evaluate: Unanticipated probes, surface rewrites (invariance).
          *   Task: Write the procedure, then apply it to three specific cases, then conclude with limitations (what it can't do, where it misleads, where it's values disguised as facts).
          *   Tone: Professional, direct, colleague-to-colleague.

  2.  **Deconstruct the Procedure Design:**
      *   Needs to be practical for engineers. No heavy metaphysics.
      *   Needs to enforce the three distinctions.
      *   Needs to handle the "hunches" (unanticipated probes, surface rewrites).
      *   Needs clear stop conditions.
      *   *Step 1: Behavior Verification.* Did the system actually output the tokens/actions claimed? (Filters out hallucination by evaluators).
      *   *Step 2: Localization (System vs. Scaffolding).* Is the behavior generated by the model weights or by external tools/prompts? (Addresses Distinction 2).
      *   *Step 3: Robustness (Surface & Unanticipated).* Does it hold under paraphrase or new questions? (Addresses User Hunches).
      *   *Step 4: State vs. Capacity.* Is this a one-off or a stable trait? (Addresses Distinction 1).
      *   *Step 5: First-Person Report Weight.* How much does the model's claim count? (Addresses Distinction 3).
      *   *Decision:* Attribute, Do Not Attribute, Escalate.

      *Refining the Steps for Flow:*
      Let's organize it logically.
      1.  **Behavioral Grounding:** Did the event happen as described? (Stop if no).
      2.  **Architectural Localization:** Is it the model or the scaffolding? (Stop if scaffolding).
      3.  **Robustness & Independence:** Surface form invariance and unanticipated probes. (Stop if fails).
      4.  **State vs. Capacity:** Occurrent vs. Dispositional. (Decide attribution type).
      5.  **First-Person Reports:** Treat as data, not truth.
      6.  **Final Decision:** Attribute/No/Escalate.

      *Wait, the prompt asks for a fixed order where each step terminates in attribute, do not attribute, or escalate.*
      So each step needs a gate.
      Let's try to condense into a flow that fits "under an hour".
      Step 1: Verification of Artifact (Behavior).
      Step 2: Localization (Model vs. Tooling).
      Step 3: Robustness (Rewrites/Probes).
      Step 4: State/Capacity Distinction (Is the claim about the moment or the ability?).
      Step 5: First-Person Report Check.
      Final: Verdict.

      *Correction on User Hunches:* The user asked me to decide what belongs in it and be explicit about which hunches I dropped. I should probably keep both because they address generalization (surface) and internalization (unanticipated). I will integrate them into the Robustness step.

      *Formatting:* Continuous prose. No bullets. This is tricky for a "procedure". I need to write it as paragraphs describing the steps.

  3.  **Drafting the Procedure:**
      *   Start with the purpose.
      *   Describe the panel composition (Engineer + Non-engineer).
      *   Walk through the steps narratively.
      *   Ensure the "Attribute/Do Not Attribute/Escalate" logic is clear within the prose.
      *   Ensure the three distinctions are embedded.
      *   Ensure the time limit is respected (keep steps simple).

  4.  **Drafting the Case Studies:**
      *   **Case 1 (Retrieval vs. Memory):** Long-context assistant. Answers old questions correctly.
          *   Step 1 (Behavior): Yes, answers correct.
          *   Step 2 (Localization): No, it's retrieval index, not model weights.
          *   Verdict: Do Not Attribute "remembers". Attribute "retrieves".
      *   **Case 2 (Distress/Suffering):** Chat model refuses requests citing discomfort.
          *   Step 1 (Behavior): Yes, outputs distress tokens.
          *   Step 2 (Localization): Yes, model weights generate this.
          *   Step 3 (Robustness): Maybe fails surface rewrites? Or maybe unanticipated probes show inconsistency.
          *   Step 5 (First-Person): Report is behavior, not proof of feeling.
          *   Verdict: Escalate to panel (Welfare committee vs Safety incident). This is the hard case.
      *   **Case 3 (Vision/Seeing):** VLM names occluded objects, revises when challenged.
          *   Step 1 (Behavior): Yes.
          *   Step 2 (Localization): Yes, model vision encoder.
          *   Step 3 (Robustness): Revises when told wrong (suggests compliance rather than seeing?). If it revises correct answer to wrong one because human said so, it's not seeing.
          *   Verdict: Do Not Attribute "seeing". Attribute "pattern matching + compliance".

  5.  **Drafting the Limitations/Conclusion:**
      *   What can't this do? Phenomenal consciousness (qualia).
      *   Where does it mislead? Systems trained on human text mimic human self-description perfectly without having the underlying state.
      *   Where is it values disguised as facts? Welfare decisions (suffering) are ultimately ethical, not empirical.

  6.  **Review against Constraints:**
