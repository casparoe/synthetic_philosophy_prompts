answer: |-
  # Specification: Theory of Understanding for Tool-Delegated Practice

  **Objective:** Evaluate a specific practice of cognitive delegation (human + tool) to determine if it degrades, preserves, or extends the human operator's understanding.
  **Constraints:** No counterfactual testing (removing the tool), no self-report, must distinguish person from hybrid performance.

  ## I. Requirements

  ### R1: The Diagnostic Gradient (Non-Negotiable)
  **Requirement:** The theory must account for sensitivity to *degrees* of error, not just binary correctness. It must distinguish between spotting a hallucination, spotting a subtle logical drift, and spotting a stylistic mismatch.
  **Motivation:** Addresses the **Near-Miss Case**. Your experience (missing subtle errors) vs. your friend's (catching them) suggests understanding is not a binary state but a signal-to-noise ratio in error detection. A theory that only measures final output accuracy fails here.
  **Status:** **Non-Negotiable.** Without this, the theory cannot detect the specific atrophy you are experiencing.

  ### R2: The Intervention Threshold (Non-Negotiable)
  **Requirement:** The theory must measure the operator's capacity to *interrupt and correct* the tool's process mid-stream, not just accept/reject the final output. It must quantify how much of the generative chain the human can reconstruct or redirect on demand.
  **Motivation:** Addresses **Reliable Deference vs. Understanding** and the **GPS Effect**. If competence evaporates when the tool is removed, the understanding was in the tool, not the loop. However, since we cannot remove the tool (Measurability Constraint), we measure the *potential* to intervene by introducing controlled perturbations to the tool's input and observing the human's correction strategy.
  **Status:** **Non-Negotiable.** This is the only way to satisfy the Measurability Constraint while preserving the Person vs. Hybrid distinction.

  ### R3: The Calibration Anchor (Non-Negotiable)
  **Requirement:** The theory must require a baseline of unaided generative capacity, even if that capacity is rarely used in practice. There must be a "ground truth" substrate the operator retains to calibrate the tool's reliability.
  **Motivation:** Addresses the **Learned-Then-Delegated vs. Never-Learned Asymmetry**. You and your friend differ because she has an anchor; you are drifting. A theory that allows 100% offloading cannot explain why her grip is tighter.
  **Status:** **Non-Negotiable.** Without an anchor, "Understanding" collapses into "Access."

  ### R4: The Recovery Protocol (Non-Negotiable)
  **Requirement:** The theory must evaluate performance under *tool degradation* (e.g., low confidence scores, contradictory outputs, latency), not just tool success.
  **Motivation:** Addresses **Ability vs. Access Under Pressure**. True understanding is revealed when the scaffold wobbles. If the operator panics or defers blindly when the tool hesitates, understanding is absent.
  **Status:** **Non-Negotiable.** This satisfies the pressure distinction without requiring tool removal.

  ### R5: The Functional Equivalence Clause (Aesthetic Preference)
  **Requirement:** The theory must declare whether "fixing without explaining" (Mechanic) and "explaining without fixing" (Theorist) count as equivalent understanding states, or if one is privileged.
  **Motivation:** Addresses the **Mechanic vs. Theorist Case**. Some theories privilege propositional knowledge (Theorist); others privilege manipulative ability (Mechanic).
  **Status:** **Aesthetic.** This depends on the course goals. For a lab course, Mechanic may be weighted higher; for a theory course, Theorist. The theory itself must allow you to toggle this weighting, not hardcode it.

  ### R6: The Distributed Coherence Rule (Aesthetic Preference)
  **Requirement:** The theory must specify how individual understanding aggregates to team understanding. Does it sum? Is it the lowest common denominator? Is it emergent?
  **Motivation:** Addresses the **Team Case**. If no individual understands the system but the team does, is the *practice* valid?
  **Status:** **Aesthetic.** This is a policy choice about whether you are grading individuals or systems.

  ---

  ## II. Incompatible Desiderata (The Tension)

  **The Conflict:** **R3 (Calibration Anchor)** vs. **The Extension Goal**.

  *   **R3** demands that the human retain a baseline of unaided generative capacity to prevent atrophy and ensure calibration.
  *   **The Extension Goal** (the primary reason for using the tool) demands that the human offload low-level cognition to free resources for higher-level tasks.

  **The War:** These are quietly at war. Every unit of cognitive load offloaded to satisfy the Extension Goal is a unit of load removed from the Calibration Anchor. If you offload the "low-level stuff" (syntax, basic derivation, standard patterns), you erode the very substrate required to verify the tool's output on those dimensions.
  *   **Your Case:** You offloaded the low-level verification (plausibility checks). Your anchor eroded. You can no longer detect subtle drift.
  *   **Your Friend's Case:** She solidified the anchor *before* offloading. Her low-level intuition is cached, allowing her to offload safely.

  **Implication for Policy:** You cannot maximize both. A policy that demands "full understanding" (max anchor) negates the efficiency benefit of the tool. A policy that maximizes efficiency (max offloading) guarantees eventual anchor erosion. The spec forces you to choose a **Minimum Viable Anchor**—the specific subset of tasks that *must not* be delegated, regardless of tool competence.

  ---

  ## III. The Exclusionary Requirement

  **The Single Most Exclusionary Requirement:** **R1 (The Diagnostic Gradient).**

  **Why:** Most existing theories of understanding (behaviorist, reliability-based, or simple knowledge-state accounts) are binary. They ask: "Did the student get the right answer?" or "Can the student explain the concept?"
  R1 demands: "Can the student detect *why* this *almost* right answer is wrong?"
  *   **Rules out:** Pure reliability accounts (if the output is right, understanding is assumed).
  *   **Rules out:** Simple explanation accounts (a student can recite a definition but miss a subtle misapplication).
  *   **Rules out:** Black-box delegation models (which assume the tool handles the gradient).

  This requirement kills 80% of standard educational assessment models because they are not designed to measure *sensitivity to error*, only *production of correctness*. It forces the theory to model understanding as a *discriminative faculty*, not just a generative one.

  ---

  ## IV. Theory Family Scores

  **1. Ability / Manipulation Accounts**
  *   *Score:* **Fail.**
  *   *Why:* They handle the Mechanic case well but collapse on the Near-Miss case. If I can manipulate the tool to get the right result, these accounts say I understand. They cannot distinguish between "I know why this works" and "I know which buttons to push." They fail R1 and R3.

  **2. Explanation / Knowledge-Based Accounts**
  *   *Score:* **Partial Pass.**
  *   *Why:* They handle the Theorist case and the Near-Miss case (if explanation includes error analysis). However, they often fail the Measurability Constraint (requiring verbal report) and struggle with the Team Case (distributed knowledge is hard to verbalize individually). They risk failing R4 (Recovery) if the student can explain the theory but freezes when the tool glitches.

  **3. Virtue-Theoretic / Epistemic Character Accounts**
  *   *Score:* **Best Fit.**
  *   *Why:* These focus on the *habits* of the knower (vigilance, intellectual humility, curiosity). This naturally captures the Near-Miss case (loss of vigilance) and the Learned-vs-Never asymmetry (habits formed during learning persist). It handles the Person vs. Hybrid distinction well (virtues belong to the person, not the tool).
  *   *Weakness:* Hardest to measure objectively (violates Measurability Constraint unless operationalized strictly via R2 Intervention Traces).

  **Recommendation:** For a lab course policy, adopt a **Virtue-Theoretic framework operationalized through Ability**. Grade the *habits of verification* (R1) and *intervention* (R2) rather than the final output or the verbal explanation. Define the "Minimum Viable Anchor" (R3) explicitly in the syllabus as the "No-Delegate Zone."
