  **Variant D: Fully coherent controller (Quantum uncomputation)**
  *   **Drops:** Candidate 2 (Erasure) drops because unitary evolution requires no irreversible erasure, and Candidate 1 (Acquisition) drops because entanglement replaces collapse.
  *   **Survivors:** Candidate 3/5 survives because the "fuel" is now the purity of the ancilla qubits; to extract net work without increasing global entropy, the controller must consume entanglement or purity, which is the quantum analog of information depletion.

