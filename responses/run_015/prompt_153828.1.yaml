answer: |-
  # Workshop Activity: The Visibility Protocol

  ## 1. Objective and Conceptual Frame
  This activity is designed to simulate the structural incentives that govern social status. It treats status not as a fixed cultural trait, but as an economic good that shifts between **non-rivalrous** (my gain does not hinder yours; visibility benefits the collective) and **rivalrous** (my gain necessitates your loss; visibility invites competition).

  By altering the payoff structure and information conditions between two rounds, you will induce the same group of students to endogenously generate norms of celebration (amplification) in the first round and norms of suppression (leveling) in the second. The concepts of the "American Dream" and "Jantelagen" are to be withheld until the debrief.

  ## 2. Materials and Setup
  *   **Participants:** 14 graduate students.
  *   **Room:** A single room with a central table or arranged seating where all participants can see one another. A whiteboard or projector is required for tallying scores.
  *   **Index Cards (Merit):** 14 cards per round, numbered 1 through 10 (distribute randomly so the average is roughly 5.5). These represent "Private Merit."
  *   **Index Cards (Action):** 10 small tokens or slips of paper per participant per round. These represent "Social Capital."
  *   **Score Sheets:** A simple grid on the whiteboard to track Final Scores.
  *   **Facilitator:** You (the instructor) plus one volunteer student to act as "Registrar" (to handle math so you can manage flow).

  ## 3. Game Mechanics

  ### General Rules (Both Rounds)
  1.  **Private Merit:** At the start of each round, every participant draws one "Merit" card face down. This number is their base score. They may not show it to anyone unless they choose to "Reveal" it.
  2.  **Social Capital:** Each participant receives 5 tokens. These can be spent to interact with other players' scores or saved.
  3.  **Decision Phase:** Participants have 3 minutes to decide whether to **Reveal** their Merit card face-up on the table or keep it **Concealed** (face-down).
  4.  **Action Phase:** Participants have 5 minutes to walk around and place tokens on other players' cards.
  5.  **Scoring:** Final scores are calculated publicly.

  ### Round 1: The Expansion Regime (Non-Rivalrous Status)
  *   **Information Condition:** High visibility is incentivized.
  *   **Action:** **"Endorsement."** If a player places a token on another player's *Revealed* card, that card's value increases by **+2 points**. (Cost: 1 token).
  *   **Payoff Structure:**
      *   **Individual Component:** Your Final Merit Score.
      *   **Collective Component:** 10% of the *Total Group Sum* of all Final Merit Scores.
      *   **Total Payoff:** Individual Component + Collective Component.
  *   **Strategic Logic:** Because every player receives a dividend from the *total* group score, it is rational to increase other players' scores. If I endorse you, the group total rises, and my dividend increases. Visibility is safe; success is contagious.

  ### Round 2: The Scarcity Regime (Rivalrous Status)
  *   **Information Condition:** High visibility is penalized.
  *   **Action:** **"Audit."** If a player places a token on another player's *Revealed* card, that card's value decreases by **-2 points**. (Cost: 1 token).
  *   **Payoff Structure:**
      *   **Rank-Order Tournament:** Only the **Top 5** scorers receive points.
      *   **Winner Take Most:** 1st–5th place receive 100 points each. 6th–14th place receive 0 points.
      *   **Tie-Breaker:** If there is a tie for the 5th spot, tied players split the 100 points.
  *   **Strategic Logic:** Because only the top ranks are rewarded, status is zero-sum. If you have a high Merit and Reveal it, you threaten my position in the Top 5. It is rational for me to spend tokens to "Audit" (reduce) your score, even if it costs me resources, provided it moves me into the winning tier. Visibility is dangerous; success is threatening.

  ## 4. Minute-by-Minute Timeline (90 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:10** | **Introduction** | Welcome participants. Explain that this is a simulation of resource allocation. **Do not mention culture, norms, or sociology.** Emphasize that the goal is to maximize personal points. Distribute materials. |
  | **00:10 – 00:25** | **Round 1** | **Setup (5 min):** Distribute Merit cards and tokens. Explain Expansion Regime rules.<br>**Action (5 min):** Reveal/Conceal decision, then Endorsement phase.<br>**Scoring (5 min):** Registrar calculates scores on the board. Announce winners (highest total payoff). |
  | **00:25 – 00:40** | **Round 2** | **Setup (5 min):** Reset materials. New Merit cards. Explain Scarcity Regime rules.<br>**Action (5 min):** Reveal/Conceal decision, then Audit phase.<br>**Scoring (5 min):** Registrar calculates scores. Announce the Top 5. |
  | **00:40 – 01:10** | **Debrief** | Facilitated discussion mapping game mechanics to sociological concepts (see Section 5). |
  | **01:10 – 01:20** | **Limitations** | Explicit admission of simulation constraints (see Section 6). |
  | **01:20 – 01:30** | **Closing** | Final Q&A and dismissal. |

  ## 5. Debrief Guide: Mapping Mechanics to Concepts
  *Do not begin the debrief by naming the theories. Begin by asking about their feelings during the Action Phases.*

  **Step 1: Phenomenological Check (10 Minutes)**
  *   Ask Round 1 participants: "How did you feel when you saw a peer with a high Merit card Reveal it?" (Expected answer: I wanted to give them tokens / It made me feel generous).
  *   Ask Round 2 participants: "How did you feel when you saw a peer with a high Merit card Reveal it?" (Expected answer: I felt threatened / I wanted to reduce their score).
  *   *Key Insight:* The participants did not change; the *structure* changed. The emotional shift from generosity to aggression was endogenous to the rules.

  **Step 2: The Rivalrous/Non-Rivalrous Distinction (10 Minutes)**
  *   Draw a pie chart on the board.
  *   **Round 1 (Non-Rivalrous):** Explain that the "Collective Component" made status an infinite good. Your success expanded the pie for me. This models **positive externality**.
  *   **Round 2 (Rivalrous):** Explain that the "Rank-Order Tournament" made status a finite good. Your success shrank my slice of the pie. This models **zero-sum competition**.
  *   *Connection:* Status is not inherently good or bad; it depends on whether the social system treats visibility as a contribution to a commons or a claim on a hierarchy.

  **Step 3: Cultural Norms (10 Minutes)**
  *   Now introduce the external concepts.
  *   **The American Dream:** Map this to Round 1. The norm celebrates visible success because it is presumed to signal opportunity for all ("a rising tide lifts all boats"). Visibility is a signal of possibility.
  *   **Jantelagen / Tall Poppy Syndrome:** Map this to Round 2. The norm suppresses visible success because it is presumed to signal disruption to cohesion ("who do you think you are?"). Visibility is a signal of dominance.
  *   *Synthesis:* Ask the group: "In your own fields (Philosophy/Social Sciences), which round does your department feel like?" This grounds the abstract mechanic in their lived academic reality.

  ## 6. Limitations: What the Simulation Cannot Reproduce
  You must verbally supply the following context, as the game mechanics are too sterile to capture them:

  1.  **Historical Weight:** The game treats norms as switchable rules. In reality, norms like Jantelagen or the American Dream are embedded in centuries of history, law, and geography. Participants cannot "feel" the historical gravity of these norms in 15 minutes.
  2.  **Moral Conviction:** In the game, suppression is a cold calculation. In reality, enforcing Jantelagen is often felt as a *moral duty* to protect the community, not just a strategic move to win points. Conversely, celebrating success in the American Dream is often felt as a *moral virtue* of hard work, not just dividend seeking.
  3.  **Identity:** The game assigns random Merit. In reality, status is tied to identity (race, class, gender). The simulation abstracts away the power asymmetries that make "suppression" feel like oppression rather than game mechanics.

  *Instruction to Facilitator:* State clearly: "This game isolates the *incentive structure*. It does not replicate the *lived experience* of these cultures. You felt the strategy, but you did not feel the history."

  ## 7. Failure Forecast and Fixes

  **Predictable Failure 1: Collusion in Round 2**
  *   **Risk:** Graduate students are adept at game theory. In Round 2, they may verbally agree to stop Auditing each other to preserve everyone's Merit, realizing that spending tokens is wasteful.
  *   **Fix:** Enforce a strict **"No Verbal Communication"** rule during the Action Phase. If they must coordinate, they must do so via token placement, which is harder to negotiate without trust. Remind them that agreements are non-binding; the temptation to betray the pact to secure a Top 5 spot usually holds.

  **Predictable Failure 2: Calculation Bottleneck**
  *   **Risk:** Calculating the "Collective Component" in Round 1 or ranking 14 students in Round 2 will consume too much time, eating into the debrief.
  *   **Fix:** Appoint the "Registrar" (a quick-witted student) *before* the workshop starts. Provide them with a spreadsheet template on a laptop connected to the projector. As scores are called out, they enter them live. This turns the scoring into a public spectacle rather than a administrative pause.

  **Predictable Failure 3: Emotional Friction**
  *   **Risk:** In Round 2, participants may feel genuine annoyance at being "Audited" by peers, leading to awkwardness during the reading group afterward.
  *   **Fix:** During the Round 2 briefing, use hyper-formal language. Refer to the action strictly as "Resource Reallocation" or "Audit," never "Attack" or "Reduce." In the debrief, explicitly validate the discomfort: "If you felt irritation when your card was Audited, that is the intended data point. That irritation is the psychological cost of rivalrous status." This reframes the negative emotion as a successful learning outcome.
