prompt: |-
  I'm running a 90-minute workshop for about 14 graduate students—mostly in philosophy and the social sciences—who meet regularly as a reading group. I want an activity that makes them feel, before anyone names the concepts, the structural tension between norms that celebrate visible success (the American Dream framing) and norms that suppress it (Jantelagen and tall-poppy dynamics). To keep it from being a generic culture-comparison lecture, frame the underlying mechanism precisely: treat social status here as a good that shifts between rivalrous and non-rivalrous depending on visibility rules, so the same group can endogenously generate either celebration or suppression. Design a two-round, in-class game—no real money, just points on index cards—with clear roles, payoff structures, and information conditions that change between rounds. The rules should make participants discover for themselves when it is individually rational to amplify another player's success and when it is rational to cut it down. Provide: the exact setup and materials; rules and scoring for each round; a minute-by-minute timeline; a debrief that maps specific moments onto the rivalrous/non-rivalrous distinction and onto the American Dream versus Jantelagen norms; an honest admission of which cultural feature the simulation cannot reproduce and that I must supply verbally; and a forecast of what will predictably fail the first time I run it, with a fix. Please write the answer in American English, in a formal and polished style, without asking for citations, reading lists, or bibliographic references.
