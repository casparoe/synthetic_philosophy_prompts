answer: |-
  *   **The 5-Minute Compliance Procedure**

      *   **Q1: Legality.** Is this prohibited by our home country law (e.g., FCPA/UK Bribery Act) or host country law?
          *   *Adequate Answer:* "No statutory violation found."
          *   *Stop:* **NO** if illegal. Escalate only if illegal but critical for life-saving access.
      *   **Q2: Specificity (Act vs. Disposition).** Does this transfer buy a *specific* official act (release this consignment) or a *general* disposition (maintain good relations)?
          *   *Adequate Answer:* "General goodwill; no specific task tied to payment."
          *   *Stop:* **NO** if it buys a specific act. This is bribery regardless of local norm.
      *   **Q3: Coercion (Exit Costs).** Can the recipient refuse this gift/request without suffering disproportionate ruin (job loss, social ostracization)?
          *   *Adequate Answer:* "Refusal is socially awkward but safe."
          *   *Stop:* **NO** if exit costs are lopsided. This is exploitation, not partnership.
      *   **Q4: Harm Distribution.** If we refuse, who suffers: the organization (delay/cost) or the patient (health outcome)?
          *   *Adequate Answer:* "Org suffers inconvenience."
          *   *Escalate:* **DIRECTOR** if patients suffer. This is a mission/values trade-off, not a compliance fact.
      *   **Q5: Transparency.** Can we record this openly in our books and disclose it to donors without shame?
          *   *Adequate Answer:* "Yes, fully documented."
          *   *Stop:* **NO** if it requires off-book logging or euphemisms.

  *   **Distinctions Verdict**
      *   *Act vs. Disposition:* **Keep.** This is your strongest tool. It separates bribery from relationship-building.
      *   *Exit Costs:* **Keep.** This identifies coercion where "consent" is meaningless.
      *   *Harm Distribution:* **Merge.** Don't treat this as a factual test. If patients suffer, you cannot decide alone; it requires strategic risk acceptance by leadership.

  *   **Case Runs**

      *   **$50 Expediting Fee (Vaccine Consignment)**
          *   Q1: Legal? (Grey zone, often illegal).
          *   Q2: Specific Act? **Yes.** Buys release of *this* shipment.
          *   **Result: NO.** Stop. Do not pay.
          *   *Why:* It fails the Specificity test. It is a facilitation payment, corrupting the border process regardless of amount.

      *   **Cash "Transport Money" for Patients**
          *   Q1: Legal? Yes.
          *   Q2: Specific Act? No, buys attendance.
          *   Q3: Exit Costs? Low (patient can refuse).
          *   Q4: Harm? **Patients suffer** if refused (no treatment).
          *   **Result: ESCALATE.**
          *   *Unpopular Answer:* The procedure flags this as a values call, not a compliance win. If the Director says "No" to avoid inducement risks, patients go untreated. Compliance cannot solve this; it only exposes the cost of integrity.

      *   **District Officer's Cousin on Payroll**
          *   Q1: Legal? Yes.
          *   Q2: Specific Act? **Yes.** Buys the Officer's continued cooperation via nepotism.
          *   Q3: Exit Costs? **High.** Officer holds power over clinics; we cannot easily say no.
          *   **Result: NO.** Stop.
          *   *Why:* Fails Specificity and Exit Costs. It creates a conflict of interest and locks you into a coercive dependency.

  *   **What This Procedure Can't Do**

      *   It cannot protect patients from the consequences of your integrity. When you ban the transport money or the expediting fee, clinics may close or vaccines may rot. The procedure protects the *organization's* moral and legal standing, not the *beneficiaries'* immediate welfare.
      *   It cannot resolve cultural ambiguity where "gift" and "bribe" are linguistically identical. It forces you to treat them differently based on power dynamics, which locals may view as hostile.
      *   It cannot replace leadership. If the Director decides mission outweighs compliance (e.g., pay the fee anyway), this tool only ensures you documented the violation.
