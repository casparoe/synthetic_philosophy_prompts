  Thinking Process:

  1.  **Analyze the Request:**
      *   **Goal:** Create a "Janus pair" (two short passages, <120 words each) for a 90-minute PhD workshop.
      *   **Topic:** Actual causation (did the agent's action cause the outcome, or was it the background condition?).
      *   **Constraint 1 (Crucial):** No evaluative, thick, or theory-laden words (no "lied", "negligent", "reckless", "manipulated", "risked", etc.). Only neutral language.
      *   **Constraint 2 (Mechanism):** The flip must come entirely from structure (order of clauses, grammatical subject, granularity of action, salience/contrast class, units of rate).
      *   **Constraint 3 (Content):** Mundane setting (hospital, housing, school, lab, warehouse). No sci-fi, trolleys, fake barns, CEO case.
      *   **Constraint 4 (Integrity):** When seen side-by-side, they must be factually identical. No cheap tricks.
      *   **Constraint 5 (Output Format):** Start immediately with Passage A. Then Passage B. Then the Question. Then the analysis (levers, verdicts, predicted split, flat version, wash-out check, objection/reply). Total analysis under 900 words.
      *   **Audience:** First-year PhD students (philosophy presumably, given the Dennett/intuition pump context).
      *   **Time:** Running Thursday morning (need a clean, ready-to-use demo).

  2.  **Drafting the Case (Janus Pair):**
      *   *Scenario Idea:* A server crash or a supply shortage? Let's try a server crash in a university lab. It's mundane, technical, and causal judgments are common there.
      *   *Fact Pattern:* A server has a limit. Someone uploads a file. The server crashes. There was already high load.
      *   *Version A (Action caused crash):* Focus on the upload event as the trigger. Subject = The student. Verb = uploaded. Context = background.
      *   *Version B (Background caused crash):* Focus on the capacity limit being reached. Subject = The server. Verb = reached capacity. Context = the upload was just the final unit.
      *   *Word Count Check:* Keep under 120 words each.
      *   *Vocabulary Check:* Avoid "overloaded", "crashed" (maybe too loaded? "Stopped functioning" is better), "exceeded". Use "ceased operation", "filled", "added".
      *   *Refining the Causal Question:* Did the upload cause the stoppage, or did the capacity limit cause the stoppage?

      *   *Draft A:*
          The lab server ceased operation at 10:00. At 09:59, the capacity meter read 99%. Student Alex added a 1% file to the queue. The total reached 100%. The system stopped. Alex pressed send at 09:59. Before this, the server functioned. After the file entered, it did not. The queue was full. Alex's file occupied the final slot. The process halted.

      *   *Draft B:*
          The lab server ceased operation at 10:00. The capacity meter read 100%. 99% of the space was occupied by prior processes. Student Alex added a 1% file to the queue. The system stopped because the limit was reached. The server functioned until the limit. The limit is fixed. Alex's file entered the queue. The queue was full. The process halted. The prior processes occupied the bulk of the space.

      *   *Critique:* They feel too similar. I need to manipulate the *grammatical subject* and *order* more aggressively to shift causal salience.
      *   *Revision:*
          *   A: Focus on the *change* introduced by the agent. "Alex uploaded..."
          *   B: Focus on the *state* maintained by the background. "The server held..."
          *   Need to ensure no loaded words. "Crashed" is borderline. "Stopped" is better. "Overloaded" is out. "Filled" is okay.

      *   *Draft A (Agent-Causal):*
          At 09:59, the server queue held 99% capacity. Student Alex uploaded a file occupying the remaining 1%. Immediately upon entry, the server stopped. The system functioned before Alex's upload. It ceased after. The file entered the queue at 09:59. The limit was 100%. Alex initiated the transfer. The queue accepted the data. Then the process halted. The prior load remained steady. The change coincided with Alex's action.

      *   *Draft B (Background-Causal):*
          At 09:59, the server queue held 99% capacity. The limit was 100%. Student Alex uploaded a file occupying the remaining 1%. The server stopped because the limit was reached. The prior load remained steady. The system functioned before the limit was met. It ceased after. The queue accepted the data. The file entered the queue at 09:59. Alex initiated the transfer. The bulk of the space was occupied by prior processes. The process halted.

      *   *Critique:* Still too similar. I need to change the *granularity* and *subject*.
      *   *Let's try a Water Tank scenario.* It's physical and intuitive.
      *   *Facts:* Tank holds 100L. Has 99L. Person adds 1L. Tank bursts/overflows.
      *   *Version A (Action):* Focus on the addition.
      *   *Version B (Condition):* Focus on the existing volume.

      *   *Draft A:*
          The tank held 99 litres. The limit was 100. At noon, Sam poured in one litre. The tank burst. Water flowed out. Sam acted at noon. Before this, the tank held. After this, it failed. The volume increased by one litre. The structure gave way. The prior water remained inside. Sam's addition completed the fill. The breach occurred upon entry.

      *   *Draft B:*
          The tank held 99 litres. The limit was 100. At noon, Sam poured in one litre. The tank burst because the limit was reached. The prior water remained inside. Before this, the tank held. After this, it failed. The structure gave way. The volume increased by one litre. Sam acted at noon. The bulk of the weight pressed on the walls. The breach occurred upon entry. Sam's addition completed the fill.

      *   *Problem:* "Because" in B is explanatory/causal. Might be too loaded. Remove "because".
      *   *Problem:* "Burst" might be too evaluative? "Ruptured" is similar. "Opened" is neutral. "Failed" is okay. Let's use "ruptured".
      *   *Better Levers:*
          1.  Subject: A = Sam poured. B = The tank held.
          2.  Order: A = Action then Result. B = State then Result then Action.
          3.  Salience: A = The change (1L). B = The steady state (99L).

      *   *Refining A (Action Cause):*
          Sam poured one litre into the tank at noon. The tank held 99 litres already. The limit was 100. Upon entry, the tank ruptured. Water flowed out. The structure failed after the pour. Before the pour, it held. The volume increased by one litre. Sam acted. The prior water remained inside. The breach coincided with the addition. The fill was completed.

      *   *Refining B (Background Cause):*
          The tank held 99 litres at noon. The limit was 100. The bulk of the weight pressed on the walls. Sam poured one litre into the tank. The tank ruptured. Water flowed out. The structure failed after the limit was met. Before the limit, it held. The volume increased by one litre. The prior water remained inside. The breach coincided with the addition. The fill was completed. Sam acted.

      *   *Check Word Count:* A is ~85 words. B is ~95 words. Good.
      *   *Check Loaded Words:* "Ruptured" is physical. "Failed" is physical. "Pressed" is physical. "Acted" is neutral. No "negligent", "overfilled", "weak".
      *   *Check Facts:* Both say 99L start, 1L added, 100L limit, rupture at noon.
      *   *Check Levers:*
          *   A starts with Sam (Agent Subject). B starts with Tank (Object Subject).
          *   A mentions "Sam acted" early. B mentions "Sam acted" late.
          *   B adds "The bulk of the weight pressed on the walls" (Salience of background). A says "The prior water remained inside" (Salience of stability).
          *   A: "failed after the pour". B: "failed after the limit was met".

      *   *Wait, one constraint:* "Neither passage may contain a single evaluative, thick or theory-laden word". "Ruptured" is okay. "Failed" is okay. "Pressured" might be borderline? "Pressed" is physical.
      *   *Wait, another constraint:* "The flip has to come entirely from structure."
      *   *Let's tighten the difference.* The sentences need to be more distinct in flow but identical in fact.
      *   *Idea:* Use the "contrast class" lever.
      *   *A:* Focus on the change from 99 to 100.
      *   *B:* Focus on the state of being at 100 vs 0.
      *   *Actually, the "units" lever mentioned in prompt:* "per week against per year". I can use this.
      *   *Let's try a different scenario:* A shift worker missing a deadline? No, too moral.
      *   *Let's stick to the Tank but refine the levers.*
      *   *Lever 1: Subject.* A: Sam. B: The Tank.
      *   *Lever 2: Verb Aspect.* A: Poured (dynamic). B: Contained (stative).
      *   *Lever 3: Salience of the limit.* A: Limit mentioned as boundary crossed. B: Limit mentioned as capacity existing.

      *   *Final Polish of Passages:*
      *   *Passage A:*
          Sam poured one litre into the tank at noon. The tank contained 99 litres. The capacity was 100 litres. Upon entry, the tank ruptured. Water flowed out. The wall gave way after the pour. Before the pour, it held. The volume rose by one litre. Sam moved. The prior water stayed. The break matched the addition. The fill finished.
      *   *Passage B:*
          The tank contained 99 litres at noon. The capacity was 100 litres. The wall supported the weight. Sam poured one litre into the tank. The tank ruptured. Water flowed out. The wall gave way after the capacity was met. Before the capacity, it held. The volume rose by one litre. The prior water stayed. The break matched the addition. The fill finished. Sam moved.

      *   *Wait, I need to make sure the "Question" is clear.* "Did Sam's pouring cause the rupture, or did the existing water cause the rupture?"
      *   *Wait, I need to check the "No loaded words" constraint again.* "Gave way" is neutral physical description. "Ruptured" is neutral physical description. "Supported" is neutral.
      *   *Wait, I need to ensure the factuality is identical.*
          *   A: "Sam poured one litre... tank contained 99... capacity 100... ruptured."
          *   B: "Tank contained 99... capacity 100... wall supported... Sam poured... ruptured."
          *   Facts match.
      *   *Wait, I need to check the word count.*
          *   A: 76 words.
          *   B: 86 words.
          *   Limit is 120. Good.

      *   *Analysis Section:*
          *   Question: "What caused the rupture: Sam's pouring or the water already in the tank?"
          *   Levers:
              1.  Grammatical Subject (Sam vs Tank).
              2.  Clause Order (Action first vs State first).
              3.  Salience (Action as trigger vs Capacity as condition).
          *   Verdicts: A -> Sam. B -> Water/Background.
          *   Mechanism: Early subject position assigns causal agency. Mentioning "capacity was met" highlights the necessary condition over the sufficient trigger.
          *   Predicted Split: 14/6 (70% follow the frame).
          *   Flat Version: Remove subject bias, balance order. "The tank contained 99L. Sam poured 1L. Capacity was 100L. It ruptured." Verdict: Confusion/50-50.
          *   Wash-out: When seen together, students should see the facts match. If they still disagree, intuition is framing-dependent. If they agree, intuition tracks facts.
          *   Objection: "Framing reveals relevant contextual norms." Reply: "But the facts of causation shouldn't depend on narrative order."

