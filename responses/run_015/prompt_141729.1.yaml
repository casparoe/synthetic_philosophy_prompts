answer: |-
  Sam poured one litre into the tank at noon. The tank contained 99 litres. The capacity was 100 litres. Upon entry, the tank ruptured. Water flowed out. The wall gave way after the pour. Before the pour, it held. The volume rose by one litre. Sam moved. The prior water stayed. The break matched the addition. The fill finished.

  The tank contained 99 litres at noon. The capacity was 100 litres. The wall supported the weight. Sam poured one litre into the tank. The tank ruptured. Water flowed out. The wall gave way after the capacity was met. Before the capacity, it held. The volume rose by one litre. The prior water stayed. The break matched the addition. The fill finished. Sam moved.

  **Question:** What caused the rupture: Sam's pouring or the water already in the tank?

  **Levers:**
  1.  **Grammatical Subject:** A opens with "Sam" (agent); B opens with "The tank" (object). Early subject position primes causal agency.
  2.  **Clause Order:** A places the action before the state; B places the state before the action. This frames the action as either the trigger (A) or the final condition of a pre-existing state (B).
  3.  **Salience of Limit:** A says "after the pour"; B says "after the capacity was met". A highlights the event; B highlights the threshold.
  4.  **Verb Focus:** A uses "Sam moved" (active); B uses "The wall supported" (stative).

  **Verdicts & Mechanism:**
  *   **Version A:** Pumps "Sam caused it." The structure mimics a narrative of intervention. The rupture follows the verb "poured" immediately.
  *   **Version B:** Pumps "The water/capacity caused it." The structure mimics a system report. The rupture follows the state "capacity was met".
  *   **Mechanism:** Causal selection relies on contrast classes. A makes the *change* salient against a steady background. B makes the *background load* salient against a fixed limit. Both describe the same necessary and sufficient conditions.

  **Predicted Split:** 14 students for Sam (A), 6 for Water (B). The agent-first frame is culturally dominant for causation.

  **Flat Version:** "The tank contained 99 litres. The capacity was 100 litres. Sam poured one litre. The tank ruptured."
  **Verdict:** Split 50/50 or high abstention. Without structural nudging, the symmetry of the facts becomes visible, destabilizing the intuition.

  **Wash-out Check:** When displayed side-by-side, students should acknowledge factual identity. If they maintain different verdicts, the intuition is tracking framing, not facts. If they converge on one answer (or uncertainty), the intuition was fact-sensitive but initially obscured. Convergence on "both" or "insufficient data" indicates the framing successfully masked the symmetrical causation.

  **Strongest Objection:** "Causal claims are inherently pragmatic; we select causes based on what is unusual or intervenable. The framing simply makes different pragmatic features salient, so the intuitions are valid data about *selection*, not *causation*."
  **Reply:** This concedes the point. If the intuition shifts with structure, it cannot be used as raw evidence for the metaphysics of causation, only for the psychology of selection. The workshop aims to show we cannot read metaphysics off these intuitions directly.
