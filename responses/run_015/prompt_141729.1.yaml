      *   *One last check on "Question":* "What caused the rupture: Sam's pouring or the water already in the tank?" This is the causal question.
      *   *Predicted Split:* 14/6 is reasonable for a framing effect.
      *   *Flat Version:* Needs to be truly neutral. "The tank contained 99 litres. Sam poured 1 litre. The capacity was 100 litres. The tank ruptured."
      *   *Wash-out:* If they agree after seeing both, framing worked. If they disagree, they think there's a fact of the matter I missed.
      *   *Objection:* "Causal selection is pragmatic." Reply: "But we treat it as descriptive data."

