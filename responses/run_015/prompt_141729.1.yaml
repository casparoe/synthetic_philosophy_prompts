      *   *Final Polish of Passages for Maximum Contrast:*
      *   A needs to sound like Sam *did* it.
      *   B needs to sound like the Tank *did* it (or the water).
      *   A: "Sam poured... tank ruptured."
      *   B: "Tank contained... tank ruptured."
