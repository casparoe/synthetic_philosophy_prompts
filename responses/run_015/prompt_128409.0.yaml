      *   **Dilemma:** Is Pericles a contaminated exemplar? If so, does Plutarch smooth it over (making it hagiography) or leave the stain (making it distinct from hagiography)?
      *   **Goal:** Understand the passage's moral function, the role of the *synkrisis*, and where Plutarch sits on the spectrum between biography and hagiography.
      *   **Textual Reference:** Specifically mentions the Clough translation (19th century) and the death scene (Pericles comforting friends, focusing on the common good).

  2.  **Deconstruct the Plutarchan Project:**
      *   Plutarch isn't writing history in the Thucydidean sense (cause/effect, political analysis). He's writing *Lives* for moral improvement (*psychagogia* - leading of the soul).
      *   Key quote from *Alexander/Caesar*: "I am writing Lives, not Histories." He cares about character (*ēthos*), not just deeds (*praxeis*).
      *   The goal is *mimēsis* (imitation), but not necessarily slavish copying of every action. It's about emulating the *disposition* toward virtue.

  3.  **Analyze the Death Scene (Pericles):**
      *   *Context:* The plague, the Peloponnesian War going poorly, Pericles stripped of power then reinstated, now dying.
      *   *Action:* Friends list his virtues/trophies. Pericles interrupts. He says the greatest praise is that no citizen put on mourning because of him.
      *   *Meaning:* It's not about military glory (which was mixed with disaster); it's about civic restraint and lack of bloodguilt. It shifts the metric of success from external victory to internal moral integrity regarding fellow citizens.
      *   *Virtue under pressure?* Yes, but specifically the virtue of *magnanimity* and *civic responsibility* even when personally suffering and politically vulnerable.

  4.  **Analyze the *Synkrisis* (Pericles vs. Fabius Maximus):**
      *   *Fabius:* "The Shield of Rome." Cunctator (delayer). Saved Rome by avoiding battle. Died quietly.
      *   *Pericles:* Saved Athens by avoiding battle (bringing people behind walls), but the plague happened inside the walls.
      *   *Comparison:* Both used strategic patience. Both faced criticism for it. Both prioritized safety over glory.
      *   *Difference:* Fabius succeeded more clearly in survival; Pericles faced the plague (bad luck/divine wrath?).
      *   *User's Insight:* The user suggests the comparison highlights that virtue isn't about glory but endurance. This is strong. Plutarch often uses the *synkrisis* to nuance the judgment. It prevents a simple "Pericles = Good" reading.

  5.  **Address "Contaminated Exemplars":**
      *   *Definition:* A model who is flawed.
      *   *Plutarch's Approach:* Plutarch *loves* flawed heroes (Alcibiades, Coriolanus, even Antony). He doesn't hide flaws (usually).
      *   *Pericles' Contamination:* The war, the plague, the death of his sons, the accusation of tyranny.
      *   *Does Plutarch smooth it over?* In the death scene, he highlights Pericles' *defense* against the contamination. Pericles defines his own legacy against the backdrop of failure. Plutarch presents this self-definition as worthy of admiration, even if the outcome was tragic.
      *   *Hagiography vs. Biography:* Hagiography typically sanitizes. Plutarch complicates. Therefore, Pericles is *not* a hagiographic saint. He is a human exemplar. The "contamination" is essential because it makes the virtue *imitable*. If he were perfect, we couldn't be him. If he fails but maintains dignity, we can learn how to face failure.

  6.  **Synthesize the Argument:**
      *   **Point 1: The Death Scene's Lesson.** It's not just "stoic endurance." It's a redefinition of success. Pericles rejects the metric of trophies (which are tainted by the war's outcome) and adopts the metric of civic harmony (no blood on his hands). This teaches the reader to judge themselves by internal moral standards, not external results.
      *   **Point 2: The *Synkrisis* Role.** Comparing with Fabius confirms the "strategy of patience" virtue but highlights the role of *tyche* (fortune). Fabius had better luck. This teaches that virtue doesn't guarantee success, but it guarantees a good *death* (moral integrity).
      *   **Point 3: Contaminated Exemplars & Hagiography.** Plutarch is distinct from hagiography *because* he allows the contamination. Hagiography removes the stain to make the saint a vessel of the divine. Plutarch keeps the stain to make the hero a mirror for the human reader. The "usefulness" lies in the struggle, not the perfection.
      *   **Point 4: Moral Learning.** We don't imitate Pericles' strategy (walls + plague = bad). We imitate his *judgment* in assessing his own life. We learn to separate what is up to us (character) from what is not (plague, war outcomes).

