answer: |-
  This is a sophisticated reading of the text, and you have hit on one of the central tensions in Plutarchan scholarship. You are right to be suspicious of a simple "virtue under pressure" reading, and your intuition about the *synkrisis* (comparison) and the concept of "contaminated exemplars" is spot on.

  Here is a breakdown of how that death scene functions, how the comparison with Fabius Maximus nuances it, and where Plutarch sits on the spectrum between biography and hagiography.

  ### 1. The Death Scene: Redefining the Metric of Success
  You asked if the lesson is just that "virtue holds up under pressure." In the Clough translation (which captures the dignity of the Dryden version well), Pericles interrupts his friends who are listing his military trophies and nine victories. He tells them:

  > *"I wonder you should commend and take notice of things which are as much owing to fortune as to anything else... but this I take the greatest pride in: that no Athenian, through my means, ever wore mourning."*

  This is the crux of the moral lesson. Plutarch is not asking us to imitate Pericles' strategy (retreating behind the walls, which led to the plague). That strategy was a catastrophic failure in terms of *outcomes*.

  Instead, Plutarch is teaching us to **separate moral agency from external results.**
  *   **The Contamination:** Pericles led Athens into a war that devastated the city. He is politically "contaminated" by the plague and the suffering of the populace.
  *   **The Correction:** In his dying moment, Pericles shifts the metric of judgment. He argues that true statesmanship isn't about trophies (which fortune gives and takes) but about civic restraint (not shedding citizen blood).

  **The Lesson:** The reader is invited to admire not the *General* who won battles, but the *Citizen* who maintained moral integrity regarding his peers even when his political project collapsed. It teaches us to judge our own lives by what was within our control (our treatment of others) rather than what was not (the plague, the war's outcome).

  ### 2. The Role of the *Synkrisis* (Pericles vs. Fabius Maximus)
  Your intuition about Fabius Maximus is excellent. The *synkrisis* is not just an appendix; it is the hermeneutic key to the *Lives*.

  *   **Fabius:** He also used a strategy of delay and avoidance (the "Shield of Rome"). He was criticized for cowardice but eventually vindicated. He died in old age, having saved the state.
  *   **Pericles:** He used a similar strategy (avoiding land battle), but the plague intervened. He died amidst criticism and disaster.

  By pairing them, Plutarch isolates the variable of **Fortune (*Tyche*)**.
  If Plutarch only wrote the *Life of Pericles*, we might think Pericles' strategy was simply bad. By comparing him to Fabius, Plutarch shows that the *virtue* (prudence, patience, protecting the citizenry) was the same in both men. The *outcome* differed due to factors outside their control.

  **How this changes the reading:**
  It moves the moral lesson away from "Endurance is good" to **"Virtue is independent of Success."**
  If Pericles were a hagiographic saint, he would have been vindicated by heaven before he died. The fact that he dies in the midst of a plague he couldn't stop, yet maintains his moral stance, proves that virtue is its own reward. The *synkrisis* confirms that Pericles' failure was not necessarily a moral failure, but a tragic collision with fortune. This makes the exemplar "contaminated" by history, but "clean" in terms of character.

  ### 3. Contaminated Exemplars vs. Hagiography
  This is the core of your dilemma. Is Plutarch smoothing over the failure (hagiography) or leaving the stain (biography)?

  **Plutarch is distinct from hagiography precisely because he retains the contamination.**
  *   **Hagiography:** The saint is a vessel for the divine. Flaws are either erased or reinterpreted as "holy folly." The purpose is to inspire awe and faith. The saint is *other*.
  *   **Plutarchan Biography:** The hero is a mirror for the reader. Flaws are essential because they make the virtue *imitable*.

  If Pericles were perfect, you could not imitate him; you could only worship him. Because Pericles is "contaminated" (he made mistakes, he got angry, he led Athens into disaster), his final moment becomes a lesson in **damage control and moral reckoning.**

  Plutarch gives us a contaminated exemplar on purpose. He wants the reader to ask: *"Pericles failed. His city suffered. But in the face of that failure, how did he assess his own soul?"*

  The "stain" is not smoothed over; the plague is real, the war is real, the deaths are real. Plutarch smooths over the *moral guilt*, not the historical facts. He allows Pericles to offer a defense (*apologia*) that Plutarch seems to accept: "I did not kill the citizens; the plague did. My hands are clean of civil blood."

  ### 4. What is the Moral Learning?
  So, returning to your course theme: How do we learn virtue from this?

  1.  **Judgment over Imitation:** We are not meant to copy Pericles' actions (building walls during a plague). We are meant to copy his *judgment* in evaluating his own life. We learn to distinguish between what we are responsible for and what is the result of luck.
  2.  **The Tragic Dimension of Virtue:** Plutarch teaches that being virtuous does not guarantee a happy ending. This is a mature moral lesson that hagiography often avoids. It prepares the reader for the possibility that doing the right thing might still lead to disaster, and shows them how to face that disaster with dignity.
  3.  **The Function of the *Synkrisis*:** The comparison forces the reader to become a judge. We have to weigh Pericles against Fabius. This active engagement is part of the moral training. We aren't passively receiving a saint's life; we are adjudicating between two flawed men.

  ### Conclusion
  You are missing nothing; you are seeing the complexity correctly. Plutarch is **further away from hagiography** because he leaves the stain of failure on Pericles.

  The death scene is not a triumph of victory, but a triumph of **self-definition**. Plutarch wants us to see that while we cannot control the "contamination" of our lives (the plagues, the wars, the failures of our projects), we retain the agency to define what counts as a "good life" in the face of that contamination.

  Pericles is useful *because* he is contaminated. If he were perfect, his advice on his deathbed would be the platitude of a saint. Because he is a failed leader clinging to one specific moral victory (no citizen mourning), his words carry the weight of a hard-won human truth. That is where the moral learning lives: not in the perfection of the hero, but in the clarity of their judgment amidst imperfection.
