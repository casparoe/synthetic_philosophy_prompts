  10. (Self-Correction during drafting): Make sure to mention that Plutarch isn't a modern biographer either. He's not seeking "objective truth" but "moral truth." So he might shape the death scene to *serve* the moral lesson, even if it's historically debatable. But within the text's logic, the flaw is real.

