      *   *Key Plutarchan Concepts to weave in:* *Ēthos* (character), *Tyche* (fortune), *Synkrisis* (comparison), *Mimēsis* (imitation).
      *   *Correction/Nuance:* Ensure I don't say Plutarch *never* smooths things over (he does sometimes), but in the *Lives*, the flaws are usually structural to the moral lesson. The death scene is a moment of *apologia* that Plutarch endorses.

  8.  **Refining the "Contaminated Exemplar" point:**
