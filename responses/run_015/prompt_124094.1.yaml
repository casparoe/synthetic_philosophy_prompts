  I'm putting in for a small three-month summer grant and want the project to be the Pasadena game. Recap so we're starting from the same place: you toss a fair coin until it lands heads, and if that's on the nth toss the payoff is 2^n/n, positive for odd n and negative for even n. So the expectation series is the alternating harmonic one, 1 − 1/2 + 1/3 − ..., which sums to ln 2 if you take it in that order but whose positive and negative parts both blow up — orthodoxy says the expected value doesn't exist, and the familiar next point is that by rearranging the terms you can get any number you like, including ±∞.

  My half-formed idea, which I genuinely can't tell is deep or confused: all that rearrangement freedom isn't really a fact about the gamble, it's a fact about what I want to call a *matching rule* — a way of pairing off bits of the positive tail of the payoff distribution against bits of the negative tail and netting them. For well-behaved gambles every matching gives the same answer, so the rule is invisible and expected utility theory looks like it has no free parameter in it; for Pasadena the parameter becomes visible. If that's right, the honest moral isn't "expected utility theory breaks down on infinite gambles" but "it always had a hidden parameter and finite gambles were concealing it" — and then the actual question is what constraints rationality puts on that parameter. Is some matching rule rationally privileged by axioms (linearity, dominance, invariance under redescribing the same gamble, additivity across independent gambles), or is the leftover freedom something substantive — an attitude toward an infinite tail that two agents can disagree about without either being irrational?

  What I need is a two-page proposal: the question stated precisely enough that I could actually fail to answer it; why the standard moves leave it open (value simply undefined; any value you like; bounding utility; weak or nonstandard expectations; whatever else is on the table); what I would actually do month by month, including the test cases I'd have to run the framework through — Pasadena versus Pasadena-plus-a-dollar, Pasadena versus St Petersburg, and two independent copies of Pasadena, where I suspect additivity across independent gambles either forces a particular matching or blows the whole thing up; what a good result would look like as a deliverable; and an honest account of what would count as failing. My own worry is threefold: that the axioms collapse everything back into "you need absolute convergence after all", so there's no real extension; that the freedom is so wide I can't get a determinate verdict on the test cases; or that its just a repackaging of the nonstandard/hyperreal approach. No citations, no literature review, I'll fill all that in myself. Just argue that this is worth three months and can be done in three months — and tell me straight if you think the scope is wrong for the time I've got.
