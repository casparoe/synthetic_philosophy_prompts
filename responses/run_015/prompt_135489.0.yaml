answer: |-
  This constitutional arrangement presupposes a functional distinction between the permanent legal continuity of the state, embodied in the monarch as a corporation sole, and the temporary political authority of elected ministers, thereby rendering hereditary succession compatible with popular sovereignty without requiring any delegation of democratic consent upward to the crown. The implicit theory relies on the conceptual separation of the "dignified" state from the "efficient" government, where the monarch serves as the locus of legal validity and historical continuity while ministers exercise actual power derived from the electorate. This view rejects the notion that consent must be delegated upward through a hereditary chain, as the monarch's authority is not derived from the people but is instead a pre-existing legal condition that enables the people's representatives to enact law; simultaneously, it cannot be sustained without *any* metaphysics, because the legitimacy of an unaccountable figure signing democratic laws requires the narrative of the "King's Two Bodies" or the corporate Crown to explain why this act does not constitute autocracy. Philosophically, this is consistent with democratic doctrines only because unbroken constitutional conventions strictly subordinate the monarch's legal power to ministerial advice, ensuring that the "will of the people" is never obstructed, even if the formal authority originates elsewhere. Strictly speaking, the practice requires only a non-partisan head of state with the legal capacity to authenticate acts and the restraint to refuse independent action; heredity is not logically indispensable but is functionally preferred to guarantee neutrality without an electoral mandate. If the underlying conception were replaced by one rejecting any indispensable hereditary office, lawmaking procedures would remain largely unchanged procedurally, as a ceremonial president or appointed guardian could perform the same authenticating function, but executive accountability could become destabilized if the replacement head of state claimed an independent democratic mandate, creating competing sources of legitimacy that might invite the use of reserve powers against ministerial advice. Ultimately, the system survives not because the monarch holds power, but because the law treats the Crown as a perpetual legal entity distinct from the flesh-and-blood ruler, allowing the state to maintain continuity while the government remains fully accountable to the popular will.
