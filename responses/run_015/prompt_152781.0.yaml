answer: |-
  Here is a case built to your specifications, followed by the analysis you requested. I have marked places where I am reporting standard scholarship (Kripke 1982, and major commentators like Boghossian, Wright, and Kusch) versus where I am reconstructing the argument to fit your specific constraints.

  ### The Case: The Bookstore Display

  **Setting:** An independent bookstore, "The Page & Anchor."
  **Speaker:** Elena, the store manager (competent, adult, native speaker).
  **Practice:** Arranging the "New & Noteworthy" display tables at the front of the shop.
  **History:** For the past three years, Elena has received weekly shipments of new books. She places them on one of two tables: Table Left or Table Right.
  *   Every book with a **Red Cover** has been a **Novel**.
  *   Every book with a **Blue Cover** has been a **History**.
  *   Elena has placed every Red book on Table Left.
  *   Elena has placed every Blue book on Table Right.
  *   She has never received a Red History book or a Blue Novel.

  **The Situation:** A new shipment arrives. It contains a **Red History** book (a biography of a revolutionary, printed with a bright red dust jacket). Elena pauses, holding the book. She is genuinely unsure which table to put it on. She asks herself: "What have I been doing all this time?"

  **The Competing Rules:**
  1.  **The Color Rule:** "Place Red books on Table Left; Place Blue books on Table Right."
  2.  **The Genre Rule:** "Place Novels on Table Left; Place Histories on Table Right."

  **Why this fits your constraints:**
  *   **Realistic:** No sci-fi, no demons. This is a mundane retail task.
  *   **Natural Rules:** Both rules are intelligible merchandising strategies. Visual displays often group by color (aesthetic); bookstores often group by genre (utility). Neither is "Place Red books on Left until book #543." Both are general principles a human could consciously adopt.
  *   **Not Vagueness:** "Red" and "History" are not borderline here. The book is determinately Red and determinately History. The problem is not *what the book is*, but *which rule governs the placement*.
  *   **Intuitive Datum:** A reader will instinctively feel there *is* a fact of the matter. Elena knows what she was trying to do. She didn't just care about colors; she cared about books! (Or maybe she's an aesthete who only cares about colors). The idea that there is *no fact* feels wrong.

  ---

  ### 1. The Skeptic's Argument

  Here is how the skeptic runs the argument on Elena, mirroring Kripke's treatment of the arithmetical case.

  **The Challenge:** The skeptic asks: "What fact constitutes that you meant the Genre Rule rather than the Color Rule?"

  **Past Behavior:** The skeptic points out that Elena's past behavior is perfectly consistent with both rules. Every time she put a book on Table Left, it was Red *and* a Novel. Every time she put a book on Table Right, it was Blue *and* a History. The data underdetermines the hypothesis.

  **Inner States:** Suppose Elena says, "But I had the word 'Genre' in my head!" The skeptic replies that the word "Genre" is just another sign. How did she interpret *that* sign? Did she interpret "Genre" to mean *actual genre* or *genre-as-correlated-with-color-in-the-past*? An inner image of a novel doesn't help, because the image could be interpreted as "things that look like this (Red)" or "things that are stories."

  **Dispositions:** Suppose Elena says, "I am disposed to put Novels on the Left!" The skeptic notes that she has never been disposed to put a *Red History* book anywhere, because she has never seen one. Her disposition regarding *this specific case* is blank. If she says, "My disposition would have been to put it on the Right," the skeptic asks: "What makes that counterfactual true? You have no evidence for it other than your assumption that you meant Genre."

  **Community:** The staff and customers assume she sorts by Genre. But they have never seen a Red History book either. Their agreement is based on the same finite data as Elena's. They cannot certify her meaning because they are in the same epistemic boat.

  **The Conclusion:** There is no fact of the matter—past, present, or dispositional—that constitutes Elena's meaning the Genre Rule rather than the Color Rule. It is not that we cannot *know* which she meant; it is that there is *nothing to know*. Meaning is not a fact-stating property of individuals.

  ---

  ### 2. The Standard Replies

  **A. The Realist Reply (Meaning as Primitive)**
  *   **The Position:** This view (associated with McDowell and some readings of Kripke's critics) holds that meaning facts are *sui generis*. When Elena meant "Genre," that is a primitive fact about her mental life that is not reducible to dispositions, behavior, or physical states.
  *   **Application to Case:** The Realist says: "Elena simply *did* mean Genre. That is a basic fact. The skeptic is demanding a reduction of meaning to non-semantic terms (like behavior), but no such reduction is possible or necessary."
  *   **Does it restore conviction?** It restores the conviction that there is a fact, but it does not *explain* the fact. It tells us *that* she meant Genre, but offers no account of *what that consists in* other than "meaning." For a skeptic demanding a naturalistic fact, this looks like mysticism.

  **B. Kripke's Assertibility Reply (The Skeptical Solution)**
  *   **The Position:** Kripke (speaking for himself, not the skeptic) argues we must abandon "truth conditions" for meaning statements. Instead, we look at "assertibility conditions." We are licensed to say "Elena meant Genre" if her usage accords with the community's standards in enough cases.
  *   **Application to Case:** There is no "fact" that Elena meant Genre. However, the community of booksellers finds it *useful* to treat her as having meant Genre. If she puts the Red History book on the Right (History), they nod and say, "Yes, that's what she meant." If she puts it on the Left, they say, "Oh, she meant Color all along."
  *   **Does it restore conviction?** It explains why we *talk* as if there is a fact, but it explicitly denies there *is* a fact in the robust sense you want. It replaces "She is correct" with "She is in accord with us." For someone who wants a fact of the matter independent of community approval, this is unsatisfying.

  ---

  ### 3. The Weight-Bearing Feature

  **The Feature:** **The Correlation of Properties in Past Experience.**
  The paradox bites here because, in Elena's finite past, *Redness* and *Novelhood* were perfectly correlated.

  **What happens if you remove it?**
  *   **Scenario A (Unnatural Rule):** If "Sort by Color" was an unnatural rule (e.g., "Sort by the atomic weight of the ink"), we would dismiss it as a candidate. The paradox requires two *natural* candidates. If you remove the naturalness of the rival rule, the paradox vanishes because there is only one live hypothesis.
  *   **Scenario B (Prompt Answer):** If Elena answers instantly without doubt, the skeptic still wins. Speed is a disposition, and dispositions (as argued above) do not constitute meaning for the skeptic.
  *   **Scenario C (The Finitude Premise):** This is the critical one. If Elena *had* previously encountered a Red History book and placed it on the Right, the indeterminacy would collapse. Her past action would constitute a precedent. The skeptic would have to argue that *that* action was also open to interpretation (e.g., "Place Red Histories on Right until 2024").

  **Honest Assessment:** I cannot build the case where she has faced the hard case without violating the logic of the paradox. If she faced the case, she acted. If she acted, there is behavioral data. The skeptic's move is always to say, "That behavior is compatible with a different rule that diverges *next time*."
  Therefore, **yes, the finitude premise is doing the work.** It is not wearing a disguise. The paradox *requires* a gap between the finite set of past applications and the infinite (or open-ended) set of possible future applications. Without that gap, there is no room for the rival rule to diverge.

  ---

  ### 4. The Strongest Attack

  **Target:** Kripke's Assertibility Solution (The Skeptical Solution).
  **The Attack:** **The Normativity Objection.**
  Meaning is normative; it tells us what we *ought* to do. Assertibility is descriptive; it tells us what we *are allowed to say*.
  If meaning is just community agreement, then if the community agrees that "Red History" goes on the Left, it becomes *correct* to put it on the Left. But surely, if Elena meant Genre, she *ought* to put it on the Right, even if the whole world mistakenly thinks she meant Color.
  Kripke's solution dissolves the "ought." It turns "She is following the rule" into "She is playing the game in a way we accept." This fails to capture the intuition (Constraint 6) that there is a fact about what she *should* do independent of what we *say* she should do. It saves the practice but sacrifices the truth.

  ---

  ### 5. Answering Your Actual Question

  **Does the paradox generalize past the arithmetical case?**
  **Yes, but with a major caveat.**

  **Where the literature stands:**
  There is no settled consensus on whether Kripke's paradox is a specific problem about mathematics/logic or a general problem about language.
  *   **Generalists (e.g., Paul Boghossian):** Argue the paradox applies to any meaningful expression ("green," "table," "plus"). The Bookstore Case above supports this view. It shows the structure works without numbers.
  *   **Localists (e.g., some readings of Wittgenstein):** Suggest the paradox is particularly acute for mathematics because math claims a kind of necessity and infinite extendability that ordinary concepts (like "chair" or "red") do not.

  **My Reconstruction/Inference:**
  The paradox generalizes to any rule-governed practice where past instances underdetermine future application. However, arithmetic makes the paradox *easier to see* for two reasons:
  1.  **Precision:** "Plus" and "Quus" are sharply defined. In the Bookstore Case, one might argue "Genre" is slightly vague (is a biography a history?). Arithmetic removes the vagueness objection entirely.
  2.  **Infinity:** Arithmetic explicitly deals with infinite domains. Ordinary practices (like stocking shelves) are finite. The skeptic has to work harder to generate a "next case" in a shop than in math.

  **On the Finitude Premise:**
  You asked if I smuggled in finitude. **I did, because it is unavoidable.**
  Kripke's paradox is *essentially* a problem about the relation between the finite past and the indefinite future.
  *   If you have infinite past cases, the skeptic cannot construct a divergent rule that fits all the data (unless the rules are co-extensive).
  *   If you have a case you have already faced, the skeptic must argue your *interpretation* of that past case is open, which pushes the problem back one step but relies on the same finitude of *interpretive* acts.

  **On Co-extensive Rules:**
  You wrote: *"Two rules can agree on every case... and still be different rules... If that is enough to generate the indeterminacy... I don't see why anyone should care."*
  **You are correct.**
  If two rules *never* diverge (in actuality or counterfactually), the indeterminacy is philosophically interesting (intensionality) but practically inert. Kripke's paradox is worrying precisely because it threatens **normativity**: it tells us we don't know what we *should* do in the *next* case.
  If the rules never diverge, there is no "next case" where we might go wrong. Therefore, the paradox *requires* the possibility of divergence. The "Quus" example works because Quus *diverges* at 57. The Bookstore Case works because Color and Genre *diverge* on the Red History book.
  If you remove the divergence, you remove the paradox's bite. So, the "co-extensive" worry you raised is not the engine of the paradox. The engine is the **gap between finite evidence and indefinite commitment.**

  **Final Verdict:**
  The paradox is not local to arithmetic. It applies to the Bookstore Case. But it is not a general worry about *all* meaning indiscriminately; it is a specific worry about **projecting rules into new cases.** It relies entirely on the finitude of the speaker's history. If you could show me a speaker who had already lived through every possible application of a rule, the paradox would vanish. Since we are finite, the paradox remains.

