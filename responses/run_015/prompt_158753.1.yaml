answer: |-
  **Handout Supplement: Decoupling Subject Stakes and Attributor Context**
  **To:** Graduate Seminar on Epistemic Semantics
  **From:** [Instructor Name]
  **Re:** Designing a Double Dissociation for SSI vs. Contextualism

  ### Designer's Preface: The "Salience Bridge" Problem

  Before presenting the cases, I need to be transparent about the theoretical landscape. **{Orthodoxy}**: It is settled that the standard "Bank Cases" (DeRose 1992; Stanley 2005) conflate the subject's practical stakes with the attributor's conversational context. **{Contested}**: It is heavily disputed whether these variables *can* be cleanly decoupled. Many epistemologists (e.g., Hawthorne 2004; Blome-Tillmann 2009) argue for a "Salience Bridge": if a subject's stakes are high, the possibility of error becomes salient, which automatically raises the attributor's standards regardless of the attributor's own practical situation.

  If the Salience Bridge holds, a clean double dissociation is impossible. The cases below are constructed to *minimize* this bridge, but you should treat them as stress tests for the theories, not knock-down refutations. **{My Judgment}**: I believe these cases are pedagogically useful for isolating the semantic commitments of each view, but I doubt they will settle the debate empirically because the psychological entanglement of stakes and salience is too robust.

  ---

  ### Case A: The Desperate Commuter (High Subject Stakes / Low Attributor Context)

  **The Scenario:**
  Elena is a paralegal. She has a document that must be notarized at a specific downtown bank by 4:00 PM today. If she fails, her firm loses a major client, and she will be fired. She checks the bank's official mobile app, which says "Open until 5:00 PM." She forms the belief that the bank is open.
  Mark is a novelist sitting next to Elena on the train. He is observing her for character research. He knows nothing about her job or the threat of firing; he merely sees her checking her phone. He asks his editor over the phone, "Does she know the bank is open? I need to decide if my character should look confident or anxious." For Mark's purpose (writing a scene), a rough-and-ready standard of "knows" is sufficient; he isn't betting his life on the bank's hours, nor is he relying on Elena's belief to guide his own actions.

  **Theoretical Verdicts:**
  *   **Subject-Sensitive Invariantism (SSI):** **{Definitional Commitment}** SSI holds that the truth of "Elena knows" depends on Elena's practical environment. Since Elena's stakes are high (job loss), the threshold for knowledge is raised. Her evidence (the app) is insufficient for *her* stakes.
      *   *Verdict:* **False.** ("Elena does not know.")
  *   **Attributor Contextualism (AC):** **{Definitional Commitment}** AC holds that the truth of "Elena knows" depends on Mark's conversational context. Mark's context is lax (fiction writing, no reliance). The relevant alternatives (e.g., the app being glitched) are not salient in Mark's context.
      *   *Verdict:* **True.** ("Elena knows.")

  **Structural Feature:** The *ignorance of the attributor regarding the subject's stakes*. Mark does not know Elena will be fired.
  **The Collapse Test:** If we remove this feature—i.e., if Mark *knows* Elena will be fired—the Salience Bridge likely activates. Even if Mark doesn't care personally, the *fact* of Elena's desperation makes the error possibility salient in the conversation. AC would then predict "False," collapsing the dissociation.

  ---

  ### Case B: The Casual Commuter (Low Subject Stakes / High Attributor Context)

  **The Scenario:**
  Elena is a paralegal. She needs to deposit a paycheck at the same downtown bank. If she misses the closing time, she just has to go tomorrow; no harm, no foul. She checks the same official mobile app ("Open until 5:00 PM") and forms the belief that the bank is open.
  Mark is a logistics coordinator for a security firm. He is planning an armored transport that must intercept Elena at the bank to pick up a separate, high-value package. He cannot be at the bank unless it is open. If he arrives and the bank is closed, his firm incurs a massive penalty and breaches a federal contract. Mark cannot check the hours himself; he must rely entirely on Elena's report. He asks his supervisor, "Does Elena know the bank is open? I need to decide whether to deploy the truck." Mark's context is demanding; he requires a near-guarantee before acting.

  **Theoretical Verdicts:**
  *   **Subject-Sensitive Invariantism (SSI):** **{Definitional Commitment}** SSI looks only at Elena's stakes. Her stakes are low (deposit can wait). Her evidence (the app) is sufficient for *her* stakes.
      *   *Verdict:* **True.** ("Elena knows.")
  *   **Attributor Contextualism (AC):** **{Definitional Commitment}** AC looks at Mark's context. Mark is in a high-stakes deliberation (federal contract). The possibility of error (app glitch) is highly salient and relevant for his decision. The standards for "knows" are raised.
      *   *Verdict:* **False.** ("Elena does not know.")

  **Structural Feature:** The *attributor's reliance on the subject's belief for independent high-stakes action*. Mark's stakes are not Elena's stakes.
  **The Collapse Test:** If we remove this feature—i.e., if Mark is merely observing Elena without needing to rely on her information for his own high-stakes action—his context becomes lax. AC would then predict "True," collapsing the dissociation back to a standard agreement.

  ---

  ### Critical Diagnosis: Where the Cases Vulnerable?

  **{Contested Claim}**: Whether "stakes" operate semantically (truth-conditions) or pragmatically (assertability).
  **{My Judgment}**: The cases above assume that "standards" can shift without a shift in evidence. This is the weakest link.

  #### Attack Vector 1: The Contextualist Counter-Strike (Salience)
  A defender of Contextualism (e.g., DeRose, Lewis) will attack **Case A**.
  *   **The Argument:** Even if Mark (the attributor) has low personal stakes, the *subject's* high stakes make the possibility of error salient in the conversation. If Mark is describing Elena as "desperate to be right," the error possibility is introduced. Once an error possibility is salient, the semantic standard rises automatically.
  *   **Implication:** Case A does not produce a divergence. Both theories predict "False."
  *   **Persuasiveness:** **{My Judgment}**: Highly persuasive. It is psychologically difficult to keep an attributor's standards low when the subject's suffering is on the line. This suggests AC might subsume the data SSI tries to capture.

  #### Attack Vector 2: The SSI Counter-Strike (Knowledge-Action Principle)
  A defender of SSI (e.g., Stanley) will attack **Case B**.
  *   **The Argument:** SSI proponents often argue that if it is inappropriate for Mark to rely on Elena, it is because he recognizes she *doesn't know*. However, a traditional Invariantist might argue Mark's hesitation is about *rational action*, not *knowledge attribution*. Mark can say, "Elena knows, but I can't risk it on her say-so."
  *   **Implication:** Case B confuses "S knows p" with "It is rational for A to act on p."
  *   **Persuasiveness:** **{My Judgment}**: Moderately persuasive. This highlights the risk that SSI is actually a theory of *justified action* disguised as a theory of *knowledge*.

  #### Attack Vector 3: The Pragmatic Encroachment / Assertion View
  A defender of a pragmatic view (e.g., Rysiew, Brown) will attack **both**.
  *   **The Argument:** The truth conditions of "knows" never change (Invariantism). In Case A, Mark *can* truthfully say "She knows," but it would be misleading to imply she should relax. In Case B, Mark says "She doesn't know" not because it's false, but because asserting "She knows" would implicate that it's safe to bet the federal contract.
  *   **Implication:** The data are about Gricean implicature, not semantics.
  *   **Persuasiveness:** **{My Judgment}**: This is the strongest rival to both AC and SSI. It preserves the stability of knowledge while explaining the variability of our attributions.

  ---

  ### Status Report: Settled vs. Contested

  To ensure clarity for the seminar, here is the breakdown of the theoretical landscape surrounding these cases:

  1.  **Settled / Orthodox:**
      *   **{Orthodoxy}**: The "Bank Case" intuitions are real data points. People's willingness to attribute knowledge shifts with stakes.
      *   **{Orthodoxy}**: Standard Invariantism (classical contextual-insensitive view) struggles to explain these shifts without appealing to error theory (i.e., claiming people are confused).

  2.  **Genuinely Disputed:**
      *   **{Contested}**: **The Locus of Variation.** Does the truth condition change (AC/SSI) or just the propriety of assertion (Pragmatic Invariantism)?
      *   **{Contested}**: **The Subject vs. Attributor.** Is the variation driven by the subject's environment (SSI) or the attributor's conversation (AC)?
      *   **{Contested}**: **The Salience Bridge.** Does subject-stakes *necessarily* raise attributor-standards? (If yes, AC and SSI are extensionally equivalent in most real-world cases).

  3.  **Instructor's Judgment (Where I am taking a stand):**
      *   **{Judgment}**: I find the "Salience Bridge" objection fatal to the hope for a *clean* empirical dissociation. Cases A and B are theoretically possible but psychologically unstable.
      *   **{Judgment}**: Consequently, the debate cannot be settled by intuition pumps alone. We must look to experimental philosophy (X-Phi) data or broader theoretical virtues (e.g., simplicity, fit with linguistic semantics) to choose between AC, SSI, and Pragmatic Invariantism.
      *   **{Judgment}**: For the purpose of this seminar, treat Cases A and B as *conceptual isolators*. They show what the theories *commit* you to, even if real-world usage muddies the water.

  ### Final Instruction for Seminar
  When discussing these cases, do not ask "Which intuition is correct?" Ask "Which theoretical cost is acceptable?"
  *   If you accept **Case A (SSI verdict)**, you accept that two people can speak the same language and contradict each other ("She knows" / "She doesn't know") without one being semantically wrong. (Cost: Relativism/Contextualism).
  *   If you accept **Case B (AC verdict)**, you accept that a subject can lose knowledge without any change to their mental state or evidence, purely due to someone else's stakes. (Cost: Externalism about knowledge status).
  *   If you reject **both**, you must explain away the intuitions as pragmatic noise. (Cost: Error theory or complex pragmatics).

  There is no free lunch here. The design problem you identified is not a bug in your handout; it is the central feature of the contemporary epistemology of "knows."
