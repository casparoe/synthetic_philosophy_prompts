      *   *Refining the User's Categories:* The user distinguishes between "Could have owned" vs "Couldn't own." I should validate this but suggest they are points on a spectrum of *Risk Management* regarding speech acts.
      *   *Confidence Markers:* I need to be careful not to sound like I'm guessing everything. I will mark established theory as High, interpretive synthesis as Medium.

  9.  **Final Polish of the Definition:**
