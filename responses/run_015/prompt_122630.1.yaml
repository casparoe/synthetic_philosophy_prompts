answer: |-
  **Proposal Title:** The Grammar of Divergence: Diagnosing the Well-Posedness of the Britain–China Industrial Contrast

  **1. Statement of the Problem and Definition of Terms**

  The central question of this paper is not *why* the Industrial Revolution occurred in Britain and not in China, but whether that sentence expresses a single explanatory target or a grammatical illusion. In the literature on the "Great Divergence," scholars often treat the Britain–China contrast as a natural experiment: two large agrarian empires, similar in many pre-modern respects, diverging on the outcome of industrialization. My supervisor characterizes the inquiry into the validity of this contrast as merely methodological—a question of how we frame the history. I argue it is substantive: if the contrast is ill-posed, then the "divergence" is not a single historical phenomenon to be explained, but a retrospective pairing of independent histories. Consequently, searching for a "divergence factor" is a category error.

  To make progress, I must operationalize the vague notion of a "well-posed contrastive question." I propose the **Common Variable Criterion (CVC)** as the test for well-posedness. A contrastive question "Why $P$ in Case $A$ rather than $Q$ in Case $B$?" is well-posed if and only if:

  1.  **Commensurability:** The units $A$ and $B$ are comparable in scale and internal structure (addressing the *unit-matching* suspicion).
  2.  **Causal Homogeneity:** The best available causal models for $P$ and $Q$ invoke at least one shared causal variable $V$, where the divergence is explained by differing values of $V$ (e.g., $V_{high}$ vs. $V_{low}$), rather than by entirely distinct variables $V_1$ and $V_2$ (addressing the *shared-factor* suspicion).
  3.  **Non-Artifactual Selection:** The pairing of $A$ and $B$ is not determined solely by the known outcome (addressing the *denominator* suspicion).

  If the CVC fails, the question is degenerate. It appears to be one question ("Why Divergence?") but is actually two ("Why Britain?" and "Why Not China?") bundled by a misleading grammatical conjunction. The paper will argue that much of the substantive disagreement in the field is actually a disguised disagreement about whether the CVC is satisfied.

  **2. The Three Explanatory Stances**

  The paper will map the existing literature not by their specific causal claims (coal, institutions, culture), but by their implicit commitment to the structure of the question. I identify three distinct positions:

  *   **The Realist (Monocausal/Divergence) Position:** This stance treats the question as straightforwardly well-posed. It assumes Britain and China constitute a valid matched pair and that there exists a specific factor (or tight cluster of factors) that *caused the divergence*. For the Realist, the explanation must take the form "Factor $X$ was present in Britain and absent in China," where $X$ is a sufficient difference-maker. This position assumes the CVC is satisfied.
  *   **The Eliminativist (Regionalist/Scaling) Position:** This stance argues the question is ill-posed due to unit mismatch. "China" is too large and internally varied to serve as a foil to "Britain." The apparent puzzle dissolves if we compare commensurable units (e.g., Lancashire vs. the Yangzi Delta). For the Eliminativist, the "Britain vs. China" framing creates a false puzzle; the correct question is regional, not national/imperial. This position attacks the Commensurability condition of the CVC.
  *   **The Conjunctivist (Pluralist/Independent) Position:** This stance accepts the units but denies Causal Homogeneity. It argues that British industrialization and Chinese non-industrialization are the products of independent causal chains. Britain industrialized due to Factor $X$ (e.g., coal); China did not due to Factor $Y$ (e.g., demographic pressure). Since $X$ and $Y$ are not values of the same variable, there is no single "divergence" to explain, only two separate histories juxtaposed. This position attacks the Causal Homogeneity condition of the CVC.

  **3. Methodological Plan: Applying the Criterion Without Settling History**

  The risk of this project is that it collapses into a substantive debate about economic history (e.g., arguing whether coal actually mattered). To avoid this, the paper will treat historical explanations as *data* for the conceptual analysis, not as truths to be adjudicated. I will not determine which historical explanation is correct; I will determine what *kind* of explanation it is and whether it satisfies the CVC.

  **Section 1: Conceptual Framework (approx. 1,000 words)**
  I will define the CVC rigorously, drawing on philosophical literature on contrastive explanation (e.g., the distinction between "why $P$" and "why $P$ rather than $Q$"). I will distinguish between *variables* (the causal slot) and *values* (the specific content). I will argue that a genuine contrast requires a shared variable. If the explanation for Britain is "Coal" and for China is "Confucianism," these are different variables. If the explanation is "Coal Availability: High" (Britain) and "Coal Availability: Low" (China), this is a shared variable. I will establish that satisfying the CVC is a necessary condition for the "Great Divergence" to be a singular object of study.

  **Section 2: The Unit-Matching Test (approx. 1,500 words)**
  I will apply the Commensurability condition. I will survey how leading accounts define the contrastands.
  *   *Action:* I will categorize arguments by the spatial unit they implicitly compare. Some treat "China" as a unitary actor; others treat it as a collection of regions.
  *   *Analysis:* I will show that when "China" is treated as unitary, the internal variance (e.g., between the Yangzi Delta and the interior) is larger than the variance between Britain and the Yangzi Delta.
  *   *Result:* This section will likely support the Eliminativist suspicion that the question shifts content depending on synchronization. If the foil is "China" in 1750, but the cause is "Empire" in 1850, the units are temporally mismatched. I will demonstrate that many "Realist" arguments implicitly swap units mid-argument to preserve the contrast.

  **Section 3: The Causal Homogeneity Test (approx. 1,500 words)**
  I will apply the Shared-Factor condition using the "Decomposition Method."
  *   *Action:* I will take the three dominant classes of explanation (Geographic/Resource, Institutional/State, Cultural/Demographic) and decompose them into their conjuncts: "Why Britain?" and "Why Not China?"
  *   *Analysis:* For each class, I will ask: Does the literature explain the Chinese side using the *same variable* as the British side?
      *   *Example:* If the Geographic argument is "Britain had accessible coal," does the Chinese side argue "China lacked accessible coal" (Shared Variable: Coal) or "China had high transport costs due to river geography" (Different Variable: Transport vs. Resource)?
      *   *Example:* If the Institutional argument is "Britain had property rights," does the Chinese side argue "China had insecure property rights" (Shared Variable: Security) or "China had a different fiscal logic that didn't require property rights" (Different Variable: Fiscal Logic vs. Rights)?
  *   *Result:* I hypothesize that most substantive accounts fail this test. They tend to offer a specific trigger for Britain and a structural barrier for China that are not mirror images. This would support the Conjunctivist position: the "and not" is doing no work.

  **Section 4: The Denominator and Selection Bias Test (approx. 1,000 words)**
  I will apply the Non-Artifactual Selection condition.
  *   *Action:* I will analyze the candidate set of foils. Why China? Why not India? The Ottoman Empire? Japan?
  *   *Analysis:* I will argue that the urgency of the question depends on the size of the denominator. If the set of "potential industrializers" is small, the Britain–China contrast is significant. If the set is large (i.e., most regions don't industrialize), then pairing the one winner with any one loser creates a pseudo-puzzle.
  *   *Result:* I will show that the "Great Divergence" literature often treats China as the *only* relevant foil, effectively rigging the denominator to make the divergence look exceptional rather than the default state of the pre-modern world.

  **Section 5: Synthesis and Implications (approx. 1,000 words)**
  I will synthesize the results of the three tests. I will argue that the "Great Divergence" question is likely a bundle of distinct questions. I will discuss the implications: if the CVC fails, the goal of the field should shift from finding a "divergence mechanism" to writing parallel independent histories. I will also address the possibility that the CVC is too demanding (see "Possible Conclusions" below).

  **4. Scope and Limitations**

  This paper is constrained by its reliance on secondary literature in translation and its conceptual focus. There are three areas I must explicitly set aside to remain within the 6,000-word limit and avoid overreach:

  1.  **Defining the Industrial Revolution:** I will not attempt to settle the substantive debate over what constitutes "industrialization" (e.g., growth rates vs. technological thresholds). I will treat "industrialization" as the outcome variable $P$ as defined by the authors I survey, noting where definitional slippage affects the unit-matching test, but I will not propose a definitive economic definition myself.
  2.  **Counterfactual Robustness:** While the CVC relies on causal models, I will not engage in deep counterfactual history (e.g., "Would China have industrialized if...?"). I will only analyze the counterfactual commitments already present in the secondary literature.
  3.  **Primary Source Validation:** I cannot verify the historical accuracy of the claims I analyze (e.g., whether Chinese coal was actually inaccessible). My argument is conditional: *If* the best explanation for Britain is $X$ and for China is $Y$, *then* the contrast is degenerate. The validity of my philosophical claim does not depend on the historical truth of $X$ or $Y$, only on their logical relationship.

  **5. Possible Conclusions and Test Failure Modes**

  The paper must remain open to the possibility that the CVC itself is flawed. I will outline three possible outcomes:

  1.  **The Degeneracy Conclusion (Expected):** The tests reveal that the Britain–China contrast fails the CVC on multiple counts (unit mismatch, distinct variables, selection bias). The recommendation is to dissolve the "Great Divergence" as a singular object and treat the histories as independent.
  2.  **The Triviality Failure:** It turns out that *every* contrastive question can be forced to satisfy the CVC by abstracting the variables enough (e.g., "Factor $X$" vs. "Absence of Factor $X$" can always be constructed). If the CVC is satisfied trivially, it is useless. I will guard against this by requiring the shared variable to be *causally specific*, not just a logical placeholder.
  3.  **The Over-Demanding Failure:** It turns out that almost *no* historical contrast satisfies the CVC, because history is always a conjunction of independent chains. If so, the CVC proves too much, rendering all contrastive explanation degenerate. In this case, the conclusion would be that the Britain–China question is no worse than any other historical question, and the specific "Great Divergence" anxiety is misplaced.

  **6. Deliverable for the Historian**

  My historian colleague asked what they could *do* differently if this paper succeeds. The deliverable will not be a new historical theory, but a **Contrastive Audit Checklist**. This is a practical tool for framing research questions. Before launching a comparative project, the historian would run the following diagnostic:

  1.  **Unit Check:** Are the cases comparable in scale and internal variance? (If comparing a city to an empire, restate the question).
  2.  **Variable Check:** Can the explanation for the negative case be stated as the *absence* or *low value* of the same variable that explains the positive case? (If the positive case is explained by "Coal" and the negative by "Culture," restate as two questions).
  3.  **Selection Check:** Was the foil selected before or after knowing the outcome? (If you picked the foil because it *didn't* industrialize, acknowledge the selection bias).

  **Repair Recipe:** If the audit fails, the paper provides a protocol for restating the question.
  *   *If Unit Check fails:* Shift the scale (e.g., from National to Regional).
  *   *If Variable Check fails:* Split the project into two monadic studies ("The Causes of British Industrialization" and "The Constraints on Chinese Growth") rather than one contrastive study.
  *   *If Selection Check fails:* Expand the candidate set (include non-industrializing regions that weren't initially considered) to test robustness.

  This allows the historian to avoid the "substantive" trap of looking for a divergence factor that doesn't exist, saving research time and preventing category errors in argumentation.

  ***

  **Why This Approach?**

  This proposal avoids the two obvious but less fruitful alternatives.
  *   *Alternative 1: Surveying Causal Hypotheses.* A standard literature review would list causes (coal, wages, institutions) and weigh them. This fails because it accepts the framing of the question as given. It assumes there *is* a divergence to explain. My approach challenges the frame itself.
  *   *Alternative 2: Pure Conceptual Analysis.* A purely philosophical paper would discuss contrastive explanation in the abstract. This fails because it lacks traction on the actual historical debate. By applying the CVC to the specific Britain–China literature, I ensure the conceptual work has empirical bite.

  By treating the "Great Divergence" as a hypothesis about the *structure* of history (that these two histories are causally linked in a divergent way) rather than just a description of outcomes, I can show that methodological clarity is a prerequisite for substantive progress. If the supervisor is right that this is "merely methodological," I will show that the methodology dictates the ontology: a bad method creates a phantom object.
