      *   **Core Idea:** The "Shared-Factor Criterion" (SFC). Decompose into "Why Britain?" and "Why not China?" If answers share no common factor, the contrast is spurious/degenerate. If they share a factor, the contrast is genuine.
      *   **Suspicions to Integrate:**
          1.  *Unit-Matching/Synchronization:* Britain vs. China is apples-to-oranges (island polity vs. continent-scale empire). Timing matters (cause vs. consequence).
          2.  *Denominator Worry:* Selection bias. Any winner + any loser creates a puzzle. The depth might be an artifact of pairing.
      *   **Goal:** A *proposal* for a 6,000-word term paper (not the paper itself).
      *   **Requirements:**
          *   Precise statement of the question (defining "well-posed").
          *   Analysis of three positions (Straightforward Causal, Framing Artifact, Conjunctive Independence).
          *   Section-by-section method plan (applying SFC without settling historical disputes).
          *   Why this approach over alternatives (survey vs. pure conceptual analysis).
          *   Possible conclusions (including failure modes of the SFC).
          *   Scope constraints (secondary literature only, no archives, admit what's too big).
          *   Format (no specific citations/authors, describe positions).
          *   Deliverable for historians (a practical tool/checklist).

  2.  **Deconstruct the Core Problem:**

      *   The user is challenging the standard "Great Divergence" debate structure.
      *   The supervisor thinks it's merely methodological (how we ask) rather than substantive (what happened). The user argues the method *is* the substance here because if the question is ill-posed, the answers are meaningless.
      *   The "Shared-Factor Criterion" needs refinement. In standard contrastive explanation (van Fraassen, Lipton, etc.), "Why P rather than Q?" usually implies a common history up to a point, then a divergence. If P and Q never shared a relevant causal trajectory, the contrast is weak.
      *   *Refinement:* The SFC shouldn't just be "do the answers share a word?" It should be "do the causal mechanisms operate on a shared variable within a commensurable system?"

  3.  **Drafting the Proposal - Section by Section:**

      *   **Title:** Needs to be punchy but academic. "The Grammar of Divergence" or "Decomposing the Contrast."
      *   **Introduction/Problem Statement:** Define the "Great Divergence" question. State the thesis: The question is likely degenerate due to unit mismatch and selection bias.
      *   **Defining "Well-Posed":** This is crucial. I need to operationalize "well-posed contrastive question."
          *   Condition 1: Commensurability (units match).
          *   Condition 2: Common Causal Field (shared history/context).
          *   Condition 3: Non-Triviality (not selected post-hoc).
      *   **The Three Positions:**
          1.  *Realist/Monocausal:* There is *the* factor (e.g., coal, institutions). The contrast holds.
          2.  *Eliminativist/Regionalist:* The units are wrong. Compare Yangzi Delta to Lancashire. The "China" part dissolves.
          3.  *Conjunctivist/Pluralist:* It's two questions. Britain's yes + China's no. No single "divergence" mechanism.
      *   **Methodology (The Meat):** How to apply the SFC without becoming a historian.
          *   Step 1: Catalogue the leading explanations (high wages, coal, state capacity, etc.).
          *   Step 2: Map them to the SFC. Does "High Wages" explain *both* sides (i.e., high in UK, low in CN)? Or is it just "High Wages in UK" + "Population Pressure in CN"?
          *   Step 3: Test Unit Matching. Is "China" a valid foil?
          *   Step 4: Test Denominator. Would we ask this if India or Ottoman Empire was the foil?
      *   **Scope Constraints:** Be honest. Can't solve the economic history. Can't define "Industrial Revolution" perfectly. Can't solve the philosophy of counterfactuals fully.
      *   **Deliverable:** A "Contrastive Audit Checklist" for historians.

  4.  **Refining the "Shared-Factor Criterion" (SFC):**

      *   *Critique:* If I say "Britain had coal" and "China lacked coal," is that a shared factor? Yes, "Coal Endowment."
      *   *Critique:* If I say "Britain had enclosures" and "China had filial piety," is that shared? No.
      *   *Nuance:* The SFC needs to distinguish between *variables* (which are shared) and *values* (which differ). A well-posed contrast requires a shared causal variable where the values diverge. If the causal variables themselves are different (e.g., Variable A causes P, Variable B causes not-Q), the contrast is degenerate.
      *   *Revision:* Let's call it the "Common Variable Criterion."

  5.  **Addressing the Supervisor's Objection:**

      *   Supervisor: "It's just methodology."
      *   User: "It determines what counts as evidence."
      *   *Integration:* The proposal must explicitly frame this as *ontological* via *methodological* means. If the question is ill-posed, the "substance" doesn't exist.

  6.  **Developing the Deliverable:**

      *   Historians need to know: When should I stop looking for a "divergence" mechanism and start looking for two independent histories?
      *   Tool: A diagnostic flowchart or checklist.
      *   1. Are the units commensurable? 2. Is the foil selected pre-outcome? 3. Do the causal models share variables?

  7.  **Review against Constraints:**

      *   6,000 words (proposal needs to fit the scope of that).
      *   No specific citations (describe arguments).
      *   Secondary literature only.
      *   Honest paragraph on limitations.
      *   Closing section on historian utility.

  8.  **Final Polish (Self-Correction during drafting):**

      *   *Check:* Did I address the "Denominator Worry"? Yes, needs to be in the "Selection Bias" section of the method.
      *   *Check:* Did I address "Unit-Matching"? Yes, in the "Commensurability" section.
      *   *Check:* Is the distinction between "methodological" and "substantive" clear? I need to emphasize that *dissolving* a question is a substantive claim about the world (i.e., there is no 'Great Divergence' object).
      *   *Tone:* Academic, precise, respectful of the supervisor's view but firm on the user's intuition.

  9.  **Drafting the Content:** (Mental outline of the response)
      *   Title.
      *   Abstract/Summary.
      *   1. The Question and the Stakes (Defining Well-Posedness).
      *   2. The Three Stances (Realist, Eliminativist, Conjunctivist).
      *   3. Methodological Plan (Applying the Criterion).
      *   4. Scope and Limitations (The Honest Paragraph).
      *   5. Possible Outcomes (including Test Failure).
      *   6. Deliverable for Historians.

      *(Self-Correction on "Shared-Factor"):* I need to be careful. If the explanation for Britain is "Coal" and for China is "No Coal," that *is* a shared factor (Coal). The user's prompt says: "if the first is answered by coal... and the second by demographics... then the phrase and not is doing no explanatory work." Okay, so the criterion is: Do the *explanatory variables* belong to the same causal model?
      *   *Refined SFC:* A contrastive question "Why P rather than Q?" is well-posed only if the sufficient conditions for P and the sufficient conditions for not-Q invoke at least one common causal variable $V$ such that $V=p$ in the actual world and $V=q$ in the counterfactual/foil world. If P is caused by $V_1$ and not-Q is caused by $V_2$, and $V_1 \neq V_2$, the contrast is a conjunction of two monadic questions.

      *Wait, one nuance:* Usually, "Why P rather than Q" implies P and Q are mutually exclusive outcomes of the *same* process. If P is "Industrialization" and Q is "Stasis," they are outcomes. If the cause of P is Coal and the cause of Q (Stasis) is Population, are those the same variable? No. So the contrast is weak.
      *   *Okay, I will formalize this in the proposal.*

  10. **Final Review of the Prompt's "Deliverable" request:** "A repair recipe for restating a contrastive question, or a checklist for when to distrust one." I will go with the Checklist + Repair Protocol.

