  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish between mechanical 'no' and values calls? Yes, Step 1-4 are mechanical/science, Step 5 is values.
      *   *Check:* Did I handle costs borne by others? Yes, Step 3.
      *   *Check:* Did I handle cheap methods that work better? Yes, Step 4 (Efficiency Trap).
      *   *Check:* Is the tone right? Needs to be peer-to-peer (scientist to scientist), not patronizing.
      *   *Check:* The Handicap Principle interpretation. I need to be careful not to misuse it. Zahavi says the signal is honest *because* it is costly. In grants, we don't want cost for cost's sake. We want cost *correlated with quality*. If I spend $100k on hand-pulling and the reeds come back, the signal was honest (I did spend the money) but the *information* conveyed (that this works) is false.
      *   *Adjustment:* The checklist should frame the cost as a "Bond." Is the bond forfeitable if success isn't achieved? Or is the cost sunk regardless of outcome? Hand-pulling is sunk cost. Monitoring is a bond. I need to make sure the checklist distinguishes "Sunk Cost Signaling" (bad) from "Performance Bonding" (good).
      *   *Actually, keep it simpler:* The applicants are arguing "We are doing this hard thing, therefore we are serious." The checklist asks "Is this hard thing actually necessary for the result, or just hard?"

  9.  **Final Polish:** Ensure the distinction between "Principal" (money/person) and "Principle" (rule) is noted without making the user feel stupid. (e.g., "As you noted, it's the Handicap *Principle*...")

