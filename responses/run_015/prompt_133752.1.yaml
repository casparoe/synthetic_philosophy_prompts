answer: |-
  Here is a draft prepared with the rigour expected of a research council application, written from the perspective of a senior colleague in normative ethics. I have adhered to British English spelling and conventions.

  ***

  ### Part 1: Sharpening the Research Question

  Before we settle on the text of the proposal, we must ensure the philosophical payload is concentrated enough for a three-month timeline. Your intuition about the "fixed background" assumption is excellent; it is the weak underbelly of much contemporary deontic logic. However, "Iteration" and "Distribution" are distinct problems, and trying to solve both might dilute the article. Here are three ways to frame the inquiry:

  **Option 1: The Diachronic Challenge (Iteration)**
  *Focus:* Exclusively on the temporal dimension.
  *Question:* Does the repetition of a supererogatory act alter its deontic status from optional to obligatory?
  *Pros:* This is a tight, logical puzzle. It challenges the idea that deontic status is intrinsic to the act-type.
  *Cons:* It risks becoming a niche point about habituation rather than a structural critique of supererogation.

  **Option 2: The Collective Challenge (Distribution)**
  *Focus:* Exclusively on the social dimension.
  *Question:* Does the non-compliance of others transform an agent's duty into a supererogatory act (or vice versa)?
  *Pros:* Connects to lively debates on fairness and collective obligation.
  *Cons:* This is well-trodden ground in discussions of "fair shares" and demandingness. You might find you are reinventing existing objections regarding compliance conditions.

  **Option 3: The Contextual Stability Challenge (Unified)**
  *Focus:* The methodological assumption that deontic status is stable across variable backgrounds.
  *Question:* To what extent does the standard two-condition account of supererogation rely on an untenable assumption of contextual stability?
  *Pros:* This captures both Iteration and Distribution as instances of the same error (treating acts as isolated tokens). It allows you to use both cases as evidence for a broader methodological point.
  *Cons:* It requires careful wording to ensure you don't appear to be biting off more than you can chew.

  **Recommendation:**
  I strongly advise **Option 3**. For a high-impact journal article, a methodological critique often carries more weight than a specific counter-example. By framing Iteration and Distribution not as two separate problems, but as two symptoms of a single disease (the "Atomic Act Assumption"), you unify the project. This allows you to discuss both cases without the proposal looking unfocused. The core argument becomes: *Supererogation cannot be defined solely by the properties of the act and the agent at t1; it is sensitive to the temporal and social environment.*

  ***

  ### Part 2: Research Leave Proposal

  **Project Title:** The Dynamic Background: Challenging the Contextual Stability of Supererogation

  **1. The Research Question**
  To what extent does the standard two-condition account of supererogation rely on an untenable assumption of contextual stability, and how does acknowledging the dynamic nature of temporal and social backgrounds destabilise the distinction between duty and supererogation?

  **2. Rationale and Gap in the Literature**
  The dominant framework for analysing supererogation posits two necessary conditions: the act must be morally optional (permissible to omit) and morally meritorious (praiseworthy to perform). This framework is typically tested against intuitive cases involving one-off acts by single agents (e.g., jumping on a grenade, donating a kidney). In these standard thought experiments, the background conditions are held *ceteris paribus*: we assume the agent's history is irrelevant and the behaviour of peers is fixed.

  This proposal argues that this "fixed background" assumption does significant, unacknowledged normative work. By isolating the act-token from its diachronic (temporal) and synchronic (social) context, existing accounts insulate the theory from counter-intuitive results that arise in dynamic environments.
  *   **Diachronically:** If an act is supererogatory today, repeated performance may suggest a capacity that renders omission blameworthy tomorrow (the "Saintliness Trap").
  *   **Synchronically:** If peers fail to cooperate, the cost of doing one's share rises, potentially pushing a duty into the supererogatory category (the "Sucker's Burden").

  Current literature treats these as edge cases or problems of "demandingness." This project contends they are structural flaws in the two-condition account. The project will demonstrate that without a theory of how background variables shift deontic status, the definition of supererogation remains incomplete.

  **3. Methodology and Work Plan (Three Months)**
  The project will proceed through three phases, moving from critique to construction to drafting.

  *   **Month 1: Deconstruction and Formalisation**
      *   **Weeks 1-2:** Rigorous formulation of the "Atomic Act Assumption." I will map how standard defences of the two-condition account implicitly rely on static backgrounds.
      *   **Weeks 3-4:** Formalise the Iteration and Distribution challenges. I will construct specific counter-examples where holding the two conditions fixed leads to contradictory deontic verdicts when background variables change. The goal is to show that the "permissible to omit" condition is unstable.
  *   **Month 2: Testing Existing Responses**
      *   **Weeks 5-8:** I will evaluate how existing normative frameworks (e.g., cost-based accounts, optimisation views, virtue-ethical adaptations) might absorb these challenges. I anticipate showing that cost-based accounts fail on Distribution (cost is relative to others) and duty-based accounts fail on Iteration (duty is relative to history). This negative work clears the ground for the positive contribution.
  *   **Month 3: Synthesis and Drafting**
      *   **Weeks 9-10:** Develop the positive account: "Dynamic Deontic Status." This will not necessarily be a full new theory of supererogation, but a constraint on any such theory: it must account for contextual variance.
      *   **Weeks 11-12:** Drafting the article. The structure will follow the standard journal format: Introduction, The Standard Account, The Stability Assumption, The Diachronic and Synchronic Challenges, Implications for Normative Theory, Conclusion.

  **4. Possible Conclusions and Decision Criteria**
  The research may lead to one of three conclusions. The final argument will depend on which position proves most defensible during Month 2.

  *   **Conclusion A (The Collapse View):** Supererogation is not a stable deontic category. Under dynamic scrutiny, acts either collapse into duty (via Iteration) or dissolve into mere permission (via Distribution).
      *   *Decision Criterion:* Adopted if I can show that no modification of the two-condition account can preserve the category without ad hoc adjustments.
  *   **Conclusion B (The Third Condition View):** The two-condition account is correct but incomplete. It requires a "Stability Condition" which stipulates that the status must hold across reasonable variations in time and peer compliance.
      *   *Decision Criterion:* Adopted if the two-condition account remains intuitively attractive but requires this specific patch to handle the counter-examples.
  *   **Conclusion C (The Shift to Character View):** The problem lies in focusing on acts. A virtue-ethical framework handles Iteration and Distribution better because it evaluates the agent's disposition rather than individual tokens.
      *   *Decision Criterion:* Adopted if the act-based analysis proves intractably paradoxical compared to a trait-based analysis.

  **5. Outcomes: Success and Failure**
  *   **Success:** A successful project will produce a manuscript of 8,000–10,000 words suitable for submission to a top-tier journal in moral philosophy (e.g., *Ethics*, *Philosophy & Public Affairs*, *Mind*). It will have established that the "fixed background" assumption is a methodological error in normative ethics and forced proponents of the standard account to either refine their theory or concede ground.
  *   **Failure:** The project would fail if the Iteration and Distribution problems are shown to be reducible to existing, solved problems (e.g., if the Distribution problem is just the "fair share" debate in disguise). It would also fail if the "Dynamic Deontic Status" concept proves too vague to offer a constructive constraint.
  *   **Feasibility Assessment:** Three months is a tight timeframe for a project of this ambition. The risk is scope creep; attempting to solve the distribution of duty is a book-length project. To mitigate this, the leave will focus strictly on the *implications for supererogation*, not on solving collective action problems generally. I will limit the positive proposal to a "constraint" rather than a full "theory." This ensures the deliverable is a focused puzzle paper rather than an unfinished system. Given the seminar paper is already drafted, the foundational work is done, making the three-month timeline viable provided I adhere strictly to the argumentative scope outlined above.
