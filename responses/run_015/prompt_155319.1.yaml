reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** A niche take on indirect normativity and idealized deliberation.
      *   **Scenario:** An agent behind a veil of ignorance knows they will undergo "preference revision events" (values shift, reasoning architecture stays same).
      *   **Claim:** Pure indirect consequentialism breaks down because any optimizing indirect rule adopted now will be foreseen as ditchable later, making commitment unstable. Therefore, hard deontic side-constraints are better.
      *   **Counter-argument to address:** Why not just add a "never revise this rule" clause to the indirect rule?
