      *   **Constraints:** No citations, no reading lists.
      *   **Formatting:** Finish with a bottom line on its own line starting with "Bottom line:".

  2.  **Deconstruct the Argument:**
      *   *Indirect Consequentialism:* Do X because following rule R leads to the best outcomes, even if doing X directly doesn't maximize utility in this specific instance. (e.g., Rule Utilitarianism).
      *   *The Twist:* The agent knows their values/preferences will change later (preference revision), but their reasoning engine stays the same.
      *   *The Problem:* If I adopt Rule R now because it maximizes Good A (my current values), but I know later my values will shift to Good B, and my reasoning engine is still optimized for calculation, I'll just recalculate later. If Rule R no longer maximizes Good B, I'll ditch it.
      *   *Instability:* Knowing I'll ditch it later undermines the commitment now. It's like making a promise you know you'll break when it gets inconvenient.
      *   *The Solution:* Hard deontic side-constraints (rules you *cannot* break, regardless of outcome).
      *   *The Objection:* "Just make the rule: Follow R unless revising R leads to better outcomes, BUT never revise this meta-rule."
      *   *The Rebuttal:*
          1.  *Violates Idealization:* If revision is inevitable (part of the setup), commanding "never revise" is fighting reality. The agent knows they *will* revise.
          2.  *Disguised Constraint:* If you say "never revise this," you're no longer doing consequentialist calculation on that rule. You've turned it into a deontological constraint. It's not "optimize this," it's "obey this."

