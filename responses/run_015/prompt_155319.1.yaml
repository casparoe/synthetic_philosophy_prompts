answer: |-
  Hey, so this is actually a really fascinating puzzle because it hits at the weak spot in almost all consequentialist planning: the assumption that your future self is going to agree with your current self about what counts as "good."

  Here's the setup: You're behind a veil of ignorance. You know the deal—you're going to undergo these "preference revision events." Your values are going to shift, but your reasoning hardware stays the same. You're basically planning for a future agent who thinks like you but cares about different things.

  The problem with pure indirect consequentialism here is stability. Indirect consequentialism says, "Adopt the rule that generally leads to the best outcomes." But if you know your definition of "best outcomes" is going to change, you also know that Future-You is going to recalculate. They'll look at the rule you set today, run it through their new value system, and if it doesn't maximize *their* new good, they'll ditch it.

  Knowing that makes your commitment right now hollow. It's like making a promise you fully intend to break the moment it gets inconvenient. If you adopt a rule now knowing you'll abandon it later when your values shift, you aren't really bound by the rule; you're just pretending. The optimization logic eats itself because the most "optimal" thing to do now is to set a rule you know you'll violate later when the calculation flips. That's a unstable foundation for a moral system.

  So, the obvious comeback is: "Why not just bake a lock-in clause? Make the rule: 'Follow Rule X, and never revise this rule.'"

  Here's why that doesn't save indirect consequentialism. You've got two bad options here.

  First, it violates the idealization of the setup. You *know* preference revision is inevitable. It's a fact of your existence. To command "never revise" when you know revision is going to happen is basically asking you to be delusional. It requires you to ignore the known facts of your future psychology to maintain the rule, which breaks the rationality condition of the agent.

  Second, and this is the bigger issue, if you treat that "never revise" clause as binding regardless of what the new calculation says, you've secretly switched teams. You're no longer saying "follow this rule because it maximizes outcomes." You're saying "follow this rule because it's forbidden to break it, even if breaking it would maximize outcomes." That's not consequentialism anymore; that's a deontic side-constraint in disguise. You've turned the rule into a sacred boundary rather than a useful tool.

  Once you admit that some rules must be followed even when your future values say they're sub-optimal, you've conceded that pure outcome-maximization isn't the whole story. You need hard constraints to bridge the gap between your current values and your future, changed self.

  Bottom line: If you know your values will shift, you can't rely on flexible optimization rules because you'll foresee your future self breaking them; you need hard constraints to lock in morality across different versions of you.
