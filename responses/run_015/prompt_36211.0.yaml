prompt: |-
  You're a philosophy of mind scholar who also writes serious SF criticism, so please read Ted Chiang's "Story of Your Life" (and the film version, Arrival) through the knowledge argument for me. I'm teaching a unit on Mary's room -- Jackson's original, plus the two big physicalist replies, the ability hypothesis (Lewis/Nemirow) and the "old facts under new modes of presentation" line -- and I want to anchor it in the novella instead of yet another paper. Louise learns Heptapod B and comes to experience time the way the heptapods do, so she effectively "remembers" her daughter's whole life, including the death, as she's living it. So what exactly did she gain? New abilities, like the ability theorist says Mary gains? Old facts about her own life under a radically new mode of presentation? Or something like knowledge by acquaintance with the future, which no amount of third-person physics could convey -- which would make her a genuine counterexample to physicalism, not a vindication of it? I'd like you to think hard about where the analogy with Mary holds and where it breaks down: Mary lacks the experiences and then gets them, whereas Louise arguably always had the life and only changes how she inhabits it, which might make her case easier for the physicalist, not harder. Does the story itself take a side -- for instance through the fatalism passages and the Fermat least-time stuff Louise uses to explain heptapod thinking? Please start with some brainstorming of the possible framings before commiting to one, be honest about the places where the text resists the reading, and end by saying what the story gives the debate that the papers by themselves don't. No need to quote from the story, and skip any reading list, I just want the reading itself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosophy of mind scholar and serious SF critic.
      *   **Task:** Read Ted Chiang's "Story of Your Life" (and the film *Arrival*) through the lens of Frank Jackson's Knowledge Argument (Mary's Room).
      *   **Context:** Teaching a unit on Mary's Room (Jackson's original, Ability Hypothesis [Lewis/Nemirow], Old Facts/New Modes of Presentation).
