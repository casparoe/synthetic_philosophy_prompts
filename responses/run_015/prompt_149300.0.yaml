answer: |-
  This is a fantastic question. You are looking at a legacy system with four hundred years of technical debt, no documentation, and critical dependencies that no one dares to touch. Your flatmate is wrong: there is a theory underneath, but it's not written in a manifesto. It's written in the behaviour of the system itself.

  As a backend engineer, you understand that sometimes you keep a deprecated function in the codebase not because it's useful, but because removing it breaks the dependency graph. The British Constitution is like that. It is an uncodified system where the "code" is just whatever everyone agrees is happening right now.

  Here is the reconstruction of the implicit theory, broken down by your specific questions.

  ### 1. The Powers Nobody Uses: The "Root Access" Paradox

  You asked what kind of power exists only if it is never exercised. Your uncle was right: if the King refuses to sign a bill, the monarchy likely ends. So why keep the permission flag?

  **The Theory:** This is the separation of **Legal Sovereignty** from **Political Sovereignty**.

  In a republic (like the US or Poland), the President is usually both the Head of State (Symbol) and Head of Government (CEO). They have the power, and they take the blame. In the UK system, these are decoupled.
  *   **The Government (PM/Cabinet):** Has *Political Sovereignty*. They make the decisions, they take the blame, they get voted out.
  *   **The Crown (King):** Has *Legal Sovereignty*. All laws are "His Majesty's laws." All ministers are "His Majesty's ministers."

  **The Engineering Analogy:** Think of the King as the `root` user on a server, and the Prime Minister as the `sudo` user.
  *   Technically, `root` owns everything.
  *   Practically, `root` never logs in.
  *   All actions are performed by `sudo` (the Ministers).

  Why keep `root` active? Because it creates a **buffer layer**. When a law is passed, it isn't "The Labour Party's Law," it is "The Crown's Law." This gives the law a neutrality that partisan legislation lacks.

  The "unused power" is a **circuit breaker**. It exists to define the hierarchy. If the King *never* had the power to refuse, he would be a puppet. If he *ever* uses it, he becomes a player. The power exists to maintain the *possibility* of neutrality. It signals that the ultimate authority sits *above* the political fray, even if that authority is never actively deployed. If he refuses, he reveals that the "neutral arbiter" is actually a participant, and the abstraction layer collapses.

  ### 2. Does It Require a Person? (The "Human Key")

  Could you replace the King with a rule, a court, or a random citizen with a signing key?

  **The Theory:** The state requires a **Single Point of Embodiment**.

  A rule or a constitution is text. Text requires interpretation. If you swear allegiance to a Constitution, lawyers argue about what the Constitution means. If you swear allegiance to a Person, the object of loyalty is unambiguous.

  **The "Two Bodies" Logic:**
  Medieval lawyers developed a concept called the "King's Two Bodies."
  1.  **Body Natural:** The human being (gets sick, dies, has opinions).
  2.  **Body Politic:** The Office (never dies, never errs, has no opinions).

  When the human dies, the Body Politic instantly transfers to the heir. There is no interregnum (gap in power). The state is a continuous thread.

  **Why a Person?**
  *   **Continuity:** A President serves a term. A King serves a life. This allows the King to have met every Prime Minister from Churchill to Sunak. He becomes a living database of institutional memory. He can say, "I've seen this before," in a way an elected official cannot.
  *   **Focus:** Loyalty is a human emotion. It is easier for a soldier or a civil servant to pledge loyalty to a specific human figurehead than to an abstract concept like "The People" or "The Law."
  *   **The Alternative:** If you put a random citizen in that slot, they lack the *training* and the *insulation*. If you put a court in that slot, you politicize the judiciary. If you put an elected President in that slot, they claim a mandate from the people, which rivals the Prime Minister's mandate.

  **The Requirement:** Yes, it requires a person because the job is **symbolic embodiment**, not administration. You cannot automate a symbol.

  ### 3. Is It Consistent? (The "Contradictory Requirements")

  You noted the contradictions: Be apolitical but give moral addresses. Have no opinions but be Anglican.

  **The Theory:** This is the distinction between **Party Politics** and **National Identity**.

  *   **No Opinions (Party Politics):** The King cannot support a tax cut or a war. These are temporary, divisive policy choices. If he supports one, he alienates half the country.
  *   **Moral Voice (National Identity):** When there is a pandemic or a war, the country needs to feel like a single unit. The King speaks to "who we are," not "what we should do." This is consistent because it targets *identity*, not *policy*.
  *   **The Anglican Requirement:** This looks like a bug to a modern observer, but it's a **legacy dependency**. The Monarch is the "Supreme Governor of the Church of England." Historically, this was to prevent a Catholic monarch from owing allegiance to the Pope (a foreign power).
      *   *Is it consistent?* In a secular theory, no. In a historical continuity theory, yes. The State and the Church were originally the same software package. They haven't been fully refactored. The requirement ensures the Monarch is tied to the specific historical narrative of England, not a universal religion. It anchors the monarchy to a specific cultural history.

  **The Coherent Picture:** The Monarch is the **Guardian of the Constitution**, not a player in the game. To guard the game, you must not play it (no politics). To guard the history, you must embody the history (religion/tradition).

  ### 4. Brand Management vs. Structural Theory (Your Flatmate vs. You)

  Your flatmate says it's tourism. You say there must be a job description. You are both right, but you are looking at different layers.

  *   **Flatmate (Application Layer):** Yes, it generates soft power, tourism, and trade deals. That is the visible output.
  *   **You (Kernel Layer):** There is a structural function.

  **The Implicit Theory of the State:**
  The British system presupposes that **Democracy is unstable without a Non-Democratic Anchor.**

  If everyone is elected, everyone is temporary. If everyone is temporary, no one looks after the long-term stability of the system. Politicians optimize for the next election (4-5 years). The Monarch optimizes for the next generation (20-50 years).

  The theory is that the "Head of State" must be **immune to public opinion** so that the "Head of Government" can **absorb public opinion**.
  *   When things go wrong, the public gets angry.
  *   In the UK, they get angry at the PM. The PM gets fired. The State (King) remains untouched.
  *   In a Republic (e.g., France, USA), if the President is unpopular, the *State itself* feels illegitimate.

  ### 5. What Happens If You Refactor? (The Alternative)

  If you pulled the person out of that slot and put something else there, here is what breaks:

  1.  **An Elected President:**
      *   *Change:* They now have a "mandate" from the voters.
      *   *Consequence:* They become a rival to the Prime Minister. (See: France, where the President and PM can be from opposing parties, causing gridlock). The "neutral arbiter" becomes a partisan actor. The safety valve is gone.

  2.  **A Rule / Constitution:**
      *   *Change:* Allegiance is sworn to the text.
      *   *Consequence:* The text becomes politicized. Judges who interpret the text become political targets. (See: US Supreme Court confirmations). The "neutral" interpretation of the law becomes a battleground.

  3.  **A Random Citizen (Sortition):**
      *   *Change:* No dynasty, no training.
      *   *Consequence:* No continuity. No institutional memory. No "brand" recognition for soft power. The "Body Politic" dies every time the term ends.

  ### Summary: The Reconstructed Theory

  The arrangement presupposes a **Dual-State Architecture**:

  1.  **The Efficient State (Parliament/PM):** Democratic, partisan, temporary, powerful, accountable. This is where the work gets done and the blame gets assigned.
  2.  **The Dignified State (Monarchy):** Hereditary, neutral, permanent, powerless (in practice), unaccountable. This is where the legitimacy lives.

  **Why this specific setup?**
  It allows the country to change its government radically (from Left to Right) without changing its *identity*. The "Operating System" (The Crown) remains the same even if the "Admin Users" (The Government) change completely.

  **Is it consistent?**
  It is consistent *if* you accept that legitimacy does not come solely from the current voters. It accepts that the State is a historical entity that transcends the current population. The religious requirement and the hereditary nature are not bugs; they are the **checksums** that verify the continuity of the state over centuries.

  **The Verdict:**
  Your colleague is right about the rules (Catholic ban, allegiance). Your partner's dad is right about the practice (King writes nothing, voting down the address is nuclear). But the theory binding them is this: **Authority is strongest when it is visible but unused.**

  If you replace the Monarch with a "logical" alternative (an elected president or a rule), you gain democratic purity but lose the **abstraction layer** that protects the state from the volatility of politics. You merge the "Brand" with the "Product." When the Product fails, the Brand dies. The UK system keeps the Brand (King) separate so the Product (Government) can fail safely.

  That is the job description. It is not tourism. It is **risk management for national identity.**
