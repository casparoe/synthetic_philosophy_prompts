      *   *Political Theory:* This is Walter Bagehot's distinction between the "dignified" and "efficient" parts of the constitution.
      *   *The Logic:* The power isn't there to be *used*; it's there to locate *responsibility*. If the PM acts unlawfully, the Crown is the legal source of that authority. If things go wrong, the legal chain leads to the Crown, but the political blame leads to the Minister.
      *   *The "Nuclear Option":* If the King refuses, the system breaks because the fiction is revealed. The power is a *fictional absolute* that enables *practical democracy*. It creates a buffer.
      *   *Answer:* It's a "safety valve" that works by remaining closed. It presupposes that legal sovereignty and political sovereignty must be separated to function smoothly.

  4.  **Address Question 2: Does it Require a Person? (The "Human Key"):**
