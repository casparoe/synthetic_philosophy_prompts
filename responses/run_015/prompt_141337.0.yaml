      *   *Serious:* If the boundaries are completely arbitrary *and* affect the data (e.g., shifting the cut-off by 2 years changes the "truth"). If portability fails completely (US Boomers $\neq$ Chinese Boomers).
      *   *Awkward:* Cuspers, backward adoption, granularity. These are edge cases that a robust theory should handle but might not kill the core claim.

