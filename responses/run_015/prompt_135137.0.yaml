answer: |-
  **The Case: The Roof and the Widow**

  Elena and Mark are neighbors in a mid-sized suburban development. Neither holds any official position in the homeowners' association; they are peers. Mrs. Gable, an elderly widow two doors down, is cognitively declining but retains legal capacity. Mark, a contractor, is currently pressuring Mrs. Gable into signing a contract for unnecessary roof repairs at triple the market rate, exploiting her confusion to secure a $15,000 gain. Elena discovers this. Six months ago, Elena executed a nearly identical scheme against her own frail uncle, securing $20,000 through deceptive financial advice. Elena has never been caught, punished, or confessed; she keeps the money and knows exactly what she did was wrong, feeling no remorse. Mark knows about Elena's scheme against her uncle. When Elena confronts Mark on Mrs. Gable's porch, she does not appeal to abstract morality ("Stealing is wrong") but to Mrs. Gable's specific vulnerability ("You know she can't handle this pressure, and you know she can't afford it"). Mark immediately replies, "You did the same thing to your uncle." Elena does not deny it. She is not trying to deflect attention from her own crime (no one else knows about it), nor is she seeking moral superiority. She simply demands Mark stop and refund Mrs. Gable.

  **The Walkthrough**

  First, establish that the blame is otherwise apt. Mark deserves blame: he is intentionally exploiting a vulnerable person for significant gain, violating clear norms of fairness and non-maleficence. There are no excuses; he is competent and acting freely. Elena's belief that Mark is doing wrong is true. Her anger is fitting; the situation warrants indignation. The blame is addressed directly to Mark as a moral agent, not muttered behind his back. The only potential defect is Elena's standing.

  **The Verdicts**

  **1. The Forfeiture View:**
  On this view, Elena lacks standing. By violating the very norm she invokes (exploiting the vulnerable for gain), she has forfeited the right to hold others to it. Her own unrepentant guilt renders her blame illegitimate, regardless of Mark's desert. The fact that Mark knows about her past ("and you too") confirms that her blame is functionally hypocritical. The Forfeiture theorist must say Elena ought to remain silent, or that her blame is morally inert, because she has no moral high ground.

  **2. The Relationship / Second-Personal View:**
  This view locates standing in the authority to demand reasons. While Elena lacks general moral authority, she possesses *second-hand standing* derived from her relationship to the victim. Elena is Mrs. Gable's de facto protector (a neighbor who notices what others miss). Because Mrs. Gable is vulnerable and unable to effectively blame Mark herself, Elena acts as her proxy. The standing is borrowed from the victim's right to not be exploited. On this view, Elena's own record contaminates her character but does not sever the transmission of standing from Mrs. Gable to Elena. The blame is in order because it enforces *Mrs. Gable's* claim, not Elena's.

  **3. The Character View:**
  This view separates the propriety of the blame from the virtue of the blamer. Hypocrisy is a defect of character, not necessarily a defect of the speech act. Elena is vicious (unrepentant exploiter), but her blame is functionally correct and morally required to stop harm. The "hypocrisy" label tracks her inconsistency, but it does not silence her. Mark's "you too" response is a valid critique of Elena's character, but it is not a valid defense against the blame itself.

  **The Honest Part**

  The single feature doing the work here is the **fiduciary-like tie to the victim** without official office. Elena is not blaming to uphold the moral law in the abstract; she is blaming to protect a specific person she is positioned to help. This removes **Insincerity** from the triad of defects. Elena is not insincere about the value of Mrs. Gable's welfare, even if she is hypocritical about the universal norm against exploitation. She cares about *this* victim, even if she violated the rights of *that* victim (her uncle).

  If you delete this feature—if Elena does not know Mrs. Gable, or if Mrs. Gable is fully capable of defending herself—the case collapses back into a bog-standard hypocrite scenario. Without the proxy element, Elena is just one criminal scolding another, and the "and you too" response sticks. The blame becomes mere noise or posturing.

  However, a Forfeiture theorist will attack this via the **Laundering Objection**. If a relationship to the victim allows a hypocrite to launder her standing, then the forfeiture condition is empty. Any unrepentant wrongdoer could find a victim, adopt a protective stance, and gain standing to blame others for the very crime they commit. To prevent this, the Forfeiture theorist must argue that standing cannot be borrowed by someone with "dirty hands," or that the borrowing requires the proxy to be clean. But if they argue that, they sacrifice the protection of vulnerable victims who lack clean proxies. This reveals the tension: either we protect the integrity of the blamer (Forfeiture) or the security of the victim (Proxy Standing). In this specific case, the intuition that Mark must be stopped overrides the intuition that Elena must be silenced, suggesting that standing is indeed scalar or transferable, but only when the blamer is the *necessary* agent of the victim's defense. If there were a clean third party available, Elena's standing would vanish; her standing exists only because she is the *only* option. This makes standing situational, not just status-based.
