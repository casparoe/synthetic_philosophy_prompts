answer: |-
  The break is at **Step 4**.

  Step 4 claims that the logic of typical paths applies to single trials just as it does to repeated sequences, merely because "repetition is only what makes the typical set easy to pick out." This is false. Repetition does not just make the typical set *easier to pick out*; it **creates** the typical set as a dominant probabilistic object. Without repetition, the mathematical mechanism that justifies ignoring the tails does not exist.

  Here is the diagnosis of why Step 4 fails, what repetition actually does, and the price you pay for fixing the argument.

  ### 1. Why Step 4 looks harmless but is wrong
  Step 4 looks harmless because it relies on an intuitive conflation: "The thing that is most likely to happen is the thing that will happen." In a long sequence, this intuition is backed by the **Law of Large Numbers (LLN)**. In a single trial, it is merely a heuristic.

  The error is a category mistake between **probability mass** and **measure concentration**.
  *   **In a single trial:** Probability mass is distributed across outcomes. A 1-in-a-million outcome has low mass, but if it occurs, it delivers its full magnitude. There is no "typical set" with probability approaching 1. There is just the outcome space.
  *   **In repeated trials:** Probability mass **concentrates**. As $N \to \infty$, the probability mass of all sequences where the frequency of wins deviates significantly from $p$ vanishes. The "Typical Set" swallows almost all the probability.

  Step 4 assumes that because the tails are irrelevant in the limit (Step 1 & 2), they are irrelevant in the single case. But the tails are irrelevant in the limit *only because* the compounding process suppresses them via the geometric mean. In a single trial, there is no compounding to suppress the variance. The "magnitude" of the tail event is not averaged out; it is realized in full or not at all.

  ### 2. What repetition does that is missing in the single case
  You asked specifically what about repetition does the work. It is **not** just that rare branches are sampled at their true frequency. It is that repetition transforms the **arithmetic mean** (which governs single-shot expected value) into the **geometric mean** (which governs long-run growth).

  *   **Single Case:** You maximize $E[W] = \sum p_i w_i$. If one $w_i$ is huge, it dominates the sum, regardless of small $p_i$. This is rational if you only play once, because you get the arithmetic average of the *ensemble* of possible worlds.
  *   **Repeated Case:** You maximize $E[\log W]$. This is equivalent to maximizing the geometric mean. The geometric mean is heavily penalized by volatility and zero-outcomes.

  The "Typical Path" argument works in the long run because, in a multiplicative process, **one ruin event ruins the entire trajectory**. In a long sequence, the probability of encountering *at least one* ruin event approaches 1 if you bet too much. In a single trial, the probability of ruin is just $p(\text{loss})$.

  Step 4 fails because it tries to import the **time-average** justification (which requires $N \to \infty$) into a **single-period** decision. In a single period, the time-average *is* the ensemble-average. There is no divergence between "what happens on the path you live through" and "the expected value of the gamble" because you only live through one path, and its expected contribution is exactly its probability-weighted value.

  ### 3. Do you owe an account of Claim (i)?
  No. You do not need to defend Expected Value (EV) as a universal rule to accept that Claim (i) is a valid critique of EV *in this specific context*.

  Claim (i) is not a reductio of EV itself; it is a reductio of using **Arithmetic Expected Value** to optimize **Multiplicative Dynamics over Time**.
  *   EV correctly calculates the ensemble average wealth.
  *   However, for a single agent compounding wealth over time, the ensemble average is physically inaccessible. You cannot be 60% of yourself on one path and 40% on another. You are on one path.
  *   Therefore, (i) shows that EV is the wrong metric for *ergodicity-breaking processes* (non-ergodic systems).

  You can accept (i) without accepting Step 3 or 4. You simply restrict the critique of EV to **repeated, compounding scenarios**. In a one-off scenario, the system is effectively ergodic (time average = ensemble average), so EV (modified by risk aversion) returns as the correct guide.

  ### 4. The Price: What you must give up
  To keep your position (Kelly for repeated, EU for one-off), you must pay the following costs:

  1.  **Kelly is not "Fundamental Rationality":** You must abandon the idea that Kelly betting reveals a deeper truth about rationality that corrects Expected Utility. Instead, Kelly is simply **Expected Utility Maximization with a Logarithmic Utility Function applied to a specific dynamic.**
      *   Your friend wants Kelly to be a *replacement* for EU.
      *   You must view Kelly as a *subset* of EU (specifically, EU with $U(w) = \log w$ in a compounding environment).

  2.  **No Unified Criterion:** You lose the elegance of a single rule for all decisions. You must accept a **context-dependent normativity**:
      *   If the decision is one-off and additive: Maximize Expected Utility (with risk aversion determined by your preferences).
      *   If the decision is repeated and multiplicative: Maximize Expected Log-Wealth (Kelly).
      *   There is no "Master Rule" that reduces to both; rather, the structure of the problem dictates the objective function.

  3.  **The "Typicality" Heuristic is Limited:** You must concede that "optimizing for the typical path" is a valid heuristic *only* when the Law of Large Numbers is in effect. In single-shot decisions involving low-probability, high-impact events (Step 6C), "typicality" is a bug, not a feature. Ignoring a 1-in-a-million catastrophe in a single shot is not "geometric rationality"; it is simply underestimating the risk because the smoothing mechanism of repetition is absent.

  ### Summary
  Reject **Step 4**. The move from "typical paths dominate in the limit" to "probable branches dominate in the single case" is invalid because **concentration of measure requires $N > 1$**.

  The cost is that you cannot claim Kelly is universally superior to Expected Utility. You must accept that Kelly is the solution to a specific problem (long-run compounding), while Expected Utility (with appropriate risk aversion) remains the solution to the general problem (single-shot choice under uncertainty). Your friend's argument attempts to solve the general problem using a tool designed for the specific one, which is why it yields absurd results in Step 6.
