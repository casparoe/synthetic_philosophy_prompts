answer: |-
  # Desiderata for a Theory of Valid Consent: Margins and Interactions

  An adequate theory of consent must explain not only how normative powers are transferred in paradigmatic cases but also how that transfer fails or degrades in complex, non-ideal circumstances. The following desiderata specify the conditions any robust account must address, categorized by their normative status (non-negotiable vs. camp-dependent) and analyzed for internal tensions.

  ## I. Non-Negotiable Desiderata
  *These requirements are necessary for the concept of consent to function as a distinct normative mechanism. Without them, consent collapses into mere acquiescence or becomes indistinguishable from other moral valuations.*

  ### 1. The Decision-Relative Competence Requirement
  **Motivation:** Competence cannot be a global property of the agent (e.g., "rational adult") but must be indexed to the specific risk and complexity of the decision at hand.
  **The Margin:** A patient may lack the capacity to understand the statistical nuances of a novel gene therapy (global impairment regarding high-complexity data) but retain full capacity to consent to a routine blood draw. Conversely, a highly intelligent individual may be temporarily incompetent regarding a specific decision due to acute emotional distress or addiction specific to that context.
  **Requirement:** A theory must allow competence to fluctuate across domains and time without invalidating the agent's moral standing globally. It must distinguish between *understanding the transaction* and *making the wise choice*.

  ### 2. The Invalidity/Regret Distinction
  **Motivation:** There must be a bright line between consent that was defective *ab initio* (invalid) and consent that was valid but later regretted.
  **The Margin:** An individual consents to a risky investment with full understanding and no pressure, then loses money. If the theory cannot distinguish this from a case where the risks were hidden, consent loses its function as a liability shield.
  **Requirement:** The theory must preserve the normative force of valid consent even when outcomes are negative, provided the procedural conditions of validity were met at the time of the act. Post-hoc dissatisfaction cannot retroactively invalidate the normative transfer.

  ### 3. The Non-Exploitation of Reasonable Inference
  **Motivation:** Deception is not limited to literal falsehoods; it includes the deliberate manipulation of the consenter's reasonable inferential patterns.
  **The Margin:** A researcher states, "This drug has no known side effects," which is technically true (none are *known*), but deliberately omits that animal trials showed severe toxicity, relying on the subject to infer "safe" from "no known side effects."
  **Requirement:** Validity requires that the consenter's understanding not be compromised by the consenter exploiting the gap between literal truth and pragmatic implication. If the consenter intentionally engineers a false belief through framing, consent is invalid, even if no lie was uttered.

  ### 4. The Object-Integrity Constraint
  **Motivation:** Consent must attach to a specific description of the act. If the act performed diverges significantly from the act consented to due to unforeseeable structural consequences, the consent does not cover the act.
  **The Margin:** A subject consents to a tissue sample for "cancer research." Decades later, the sample is used to create a commercialized cell line that generates billions in profit, or is used to clone a human.
  **Requirement:** The theory must determine when downstream consequences are so transformative that they change the *identity* of the act. Consent to X is not consent to Y, even if Y is a causal consequence of X, if Y falls outside the normative scope of the original authorization.

  ---

  ## II. Camp-Dependent Desiderata
  *These requirements reflect deep theoretical divides regarding the nature of autonomy and justice. An adequate theory must take a stance here, but different stances yield coherent (though competing) frameworks.*

  ### 5. The Structural Voluntariness Condition
  **Motivation:** This addresses whether background injustice or systemic lack of alternatives constitutes coercion.
  **The Margin:** A worker consents to hazardous labor because the alternative is starvation due to systemic economic inequality, not because an employer explicitly threatened them.
  **Camp Divide:**
  *   **Voluntariness-Centered (Libertarian/Transactional):** Rejects this. Coercion requires a *proposed* threat by an agent. Structural desperation is tragic but does not invalidate consent.
  *   **Relational/Justice-Centered:** Accepts this. If the range of acceptable alternatives is systematically suppressed by institutional structures, the "choice" is coerced, and consent is invalid or tainted.

  ### 6. The Normative Decay Principle
  **Motivation:** This addresses whether consent loses force over time due to changes in the consenter's state, absent formal revocation.
  **The Margin:** A patient consents to a procedure while in a hopeful, optimistic state. Over weeks of waiting, they develop severe depression or new information shifts their values, but they do not formally revoke consent. Does the original consent still hold?
  **Camp Divide:**
  *   **Transaction-Centered:** Rejects decay. Consent is a "switch" flipped at Time A. Unless explicitly revoked, it remains valid to ensure reliance interests and institutional stability.
  *   **Process-Centered (Relational):** Accepts decay. Consent is an ongoing attitude. If the epistemic or volitional state underpinning the consent erodes significantly, the normative force decays, requiring re-confirmation.

  ### 7. The Specificity vs. Anticipatory Consent Trade-off
  **Motivation:** This addresses the granularity required for valid consent.
  **The Margin:** In long-term research or intimate relationships, is broad consent ("I consent to necessary medical interventions") valid, or must every foreseeable sub-step be specified?
  **Camp Divide:**
  *   **Information-Centered:** Prefers high specificity. Broad consent is often a mask for ignorance; valid consent requires granular understanding of risks.
  *   **Pragmatic/Trust-Centered:** Accepts broad anticipatory consent. Requiring specificity for every contingency is paralyzing and undermines the trust relationship essential to the interaction.

  ---

  ## III. Joint Unsatisfiability and Tensions
  *Certain pairs of desiderata appear to be in tension. Some are resolvable via contextual indexing; others represent principled trade-offs.*

  ### 1. Maximal Disclosure vs. Practical Feasibility
  **The Tension:** The *Non-Exploitation of Reasonable Inference* and *Information-Centered* views push toward maximal disclosure to ensure understanding. However, in emergency medicine or time-pressed contexts, full disclosure is physically impossible.
  **Status:** **Contextually Resolvable.**
  **Resolution:** The theory must index the standard of disclosure to the "reasonable person in the consenter's situation" under the prevailing temporal constraints. The tension is not principled but logistical; the standard of "adequate information" shifts based on the urgency of the context.

  ### 2. Subjective vs. Objective Coercion
  **The Tension:** Defining coercion subjectively (by the consenter's felt pressure) conflicts with defining it objectively (by the presence of a credible threat).
  *   *Case:* A consenter feels crushed by pressure due to internal anxiety (Subjective), but no threat was made (Objective).
  *   *Case:* A consenter is resilient and feels no pressure, but a gun is held to their head (Objective).
  **Status:** **Principled Tension.**
  **Resolution:** This is likely unresolvable within a single monolithic definition. A hybrid account is required: Objective threats create a *presumption* of invalidity, but Subjective experience determines whether the pressure actually *overbore* the will in marginal cases. However, prioritizing one over the other fundamentally alters the theory (protecting the vulnerable vs. protecting the agent's sovereignty).

  ### 3. Stability (Reliance) vs. Decay (Autonomy)
  **The Tension:** The *Invalidity/Regret Distinction* and institutional reliance require consent to be stable. The *Normative Decay Principle* requires consent to be sensitive to the consenter's current state.
  **Status:** **Principled Tension.**
  **Resolution:** This reflects the conflict between the *security of transactions* and the *sovereignty of the self*. A theory cannot maximize both. If consent decays easily, reliance is undermined (institutions cannot plan). If consent never decays, autonomy is violated (the past self rules the future self). The theory must specify a "threshold of change" required to trigger decay, acknowledging that this threshold is a normative stipulation, not a factual discovery.

  ---

  ## IV. Theoretical Fit

  **Information-Centered Accounts:**
  *   **Strengths:** Excel at satisfying the *Non-Exploitation of Reasonable Inference* and *Object-Integrity Constraint*. They provide robust tools for analyzing deception and framing.
  *   **Weaknesses:** Struggle with *Structural Voluntariness* (often ignoring background conditions) and *Normative Decay* (tend to view consent as a static event). They often fail the *Practical Feasibility* test in emergencies due to rigid disclosure standards.

  **Voluntariness-Centered Accounts:**
  *   **Strengths:** Strong on the *Invalidity/Regret Distinction* and *Decision-Relative Competence*. They protect the agent's will from explicit override.
  *   **Weaknesses:** Often fail the *Structural Voluntariness* condition by defining coercion too narrowly (ignoring systemic pressure). They may struggle with the *Non-Exploitation of Inference* if the agent "willingly" accepted a misleading frame.

  **Relational-Autonomy Accounts:**
  *   **Strengths:** Best fit for *Structural Voluntariness* and *Normative Decay*. They capture the dynamic, ongoing nature of consent and the impact of power dynamics.
  *   **Weaknesses:** Risk blurring the *Invalidity/Regret Distinction*. By making consent sensitive to ongoing relationship dynamics and structural justice, they risk making validity too fluid, undermining the *Stability* required for reliance and potentially collapsing consent into general moral permissibility.

  **Conclusion:**
  An adequate theory must adopt the Non-Negotiable Desiderata to preserve the concept of consent. It must then explicitly choose its position on the Camp-Dependent Desiderata, acknowledging that these choices prioritize either transactional security or substantive autonomy. Finally, it must resolve the Principled Tensions not by eliminating them, but by defining the priority rules (e.g., "Autonomy trumps Reliance in intimate contexts; Reliance trumps Autonomy in commercial contexts").
