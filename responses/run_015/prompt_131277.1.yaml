      *   **Stakeholders:** Machine-learning group (needs consistent labels), clinical partners (need to assess loss-of-function variants for rare diseases).
      *   **The Conflict:** "Etiological/Selected-Effect" view (Function = what it was selected for) vs. "Causal-Role" view (Function = what it currently does).
      *   **Proposed Compromise:** Split the "function" field into three: Selected-Effect (SE), Current-Contribution (CC), and Provenance.
      *   **Goal:** Evaluate the compromise, design a usable procedure (SOP) for curators, test it on three specific cases, and identify limitations/implications for the steering group.
      *   **Constraints:** No citations/reading lists. Must be actionable. Must flag judgment calls. Must handle lack of phylogenetic/selection data.

  2.  **Deconstruct the Philosophical Dispute (Internal Knowledge):**
      *   *Selected-Effect (SE) Theory (Millikan, Neander, etc.):* Function is defined by evolutionary history. A heart's function is to pump blood because ancestors with pumping hearts were selected. If a heart stops pumping, it's malfunctioning. If a trait is a spandrel (byproduct), it has no function (though it has effects).
      *   *Causal-Role (CR) Theory (Cummins, etc.):* Function is defined by current contribution to a system's capacity. A heart functions to pump blood because that's what it does in the circulatory system. It can also function to make a "thump-thump" sound for a doctor listening. No inherent "malfunction" in the same normative sense, just "not contributing."
      *   *The User's Dilemma:* SE captures "malfunction" (crucial for clinical variants) but requires history (often unknown). CR captures "current utility" (crucial for ML/phenotype prediction) but loses the normative "this is broken" signal.
      *   *The Compromise:* Splitting fields attempts to capture both. The risk is relabeling the confusion or overwhelming curators.

  3.  **Develop the Procedure (SOP):**
      *   *Constraint:* 15 minutes per ticket. Master's level biology, no philosophy.
      *   *Requirement:* Must distinguish SE from CC without using jargon.
      *   *Requirement:* Must handle missing historical data.
      *   *Requirement:* Must flag judgment calls.
      *   *Structure:* Decision tree/Flowchart style.
      *   *Philosophical Distillation:*
          *   Keep: The distinction between "History of Maintenance" (SE) and "Current Systematic Effect" (CC).
          *   Drop: Deep metaphysical debates about "proper function" vs. "disposition."
          *   Simplification: Translate "Selected Effect" to "Evolutionary Maintenance" and "Causal Role" to "Current Systematic Contribution."
      *   *Handling Missing Data:* If history is unknown, SE field gets "Unknown/Inferred." CC field relies on experimental evidence.

  4.  **Drafting the Procedure (Iterative Process):**
      *   *Step 1: Evidence Check.* Do we have experimental data? If no, stop.
      *   *Step 2: Current Contribution (CC).* What does it *do* now? Is it systematic or noise? (Crucial distinction: noise isn't function).
      *   *Step 3: Evolutionary Maintenance (SE).* Is there evidence of selection? (Phylogeny, conservation, selection scans). If no, mark as "Inferred from CC" or "Unknown."
      *   *Step 4: Conflict Check.* Do CC and SE disagree? (e.g., Case 2 & 3).
      *   *Step 5: Clinical/ML Flag.* If clinical, SE is usually preferred for "LoF" interpretation. If ML, CC is usually preferred.
      *   *Refinement:* The user wants a *single* procedure that fills the *three* fields. I need to make sure the curators know when to stop and when to escalate.
      *   *Judgment Calls:* Determining "systematic" vs. "noise." Determining "sufficient evidence for selection" without a full phylogeny.

  5.  **Running the Procedure on the Three Cases:**
      *   *Case 1 (Horizontal Transfer, Active):*
          *   CC: Modulates response to light. (Clear).
          *   SE: Spreading in population + assay shows utility = Strong inference of selection.
          *   Outcome: Both fields match. Fast clearance.
      *   *Case 2 (Cave Vertebrate, Opsin):*
          *   CC: Binds chromophore (no effect on animal), Sequesters metal (survival benefit).
          *   SE: Relaxed selection on light. Selection on metal? Maybe.
          *   Conflict: Original SE (light) is gone. New CC (metal) might be new SE.
          *   Outcome: CC = Metal Sequestration. SE = Light (historical) OR Metal (if evidence strong). *Correction:* If relaxed selection, SE for light is "Lost." SE for metal needs evidence.
      *   *Case 3 (Symbiont/Host, Metabolic vs. Immune):*
          *   CC: Immune suppression (current benefit).
          *   SE: Metabolic step (historical maintenance).
          *   Conflict: User *wants* Immune Suppression.
          *   Procedure Outcome: CC = Immune Suppression. SE = Metabolism.
          *   *Critical Check:* The user wants to annotate as Immune Suppression. If the database requires a *single* primary label for downstream ML, which one wins? The proposal splits fields, so both exist. But if a user needs *one*, they need a priority rule. I need to address the "single answer" constraint mentioned in the prompt ("in particular for the cases where a user needs a single answer").
          *   *Decision:* The procedure fills the three fields. I need to add a "Primary Display Label" logic based on use-case (Clinical vs. ML).

  6.  **Addressing the "Single Answer" Constraint:**
      *   The prompt asks: "whether that split dissolves the disagreement or merely relabels it, in particular for the cases where a user needs a single answer and cannot be given two."
      *   My analysis must acknowledge that splitting fields *defers* the choice to the downstream user, but if the database forces a "Primary Function" for indexing, the conflict remains. I will recommend a "Primary Function" flag based on the *intent* of the annotation ticket (Clinical vs. Research).

  7.  **Identifying Limitations & Steering Group Message:**
      *   *Misclassifications:* Exaptations (old SE, new CC), Moonlighting proteins (two CCs), Neutral drift (CC exists, no SE).
      *   *Retroactive Review:* High burden. Any annotation based on homology alone might need SE downgraded.
      *   *Steering Group:* We are not taking a side; we are capturing data granularity. We are admitting epistemic limits.

  8.  **Refining the Tone:**
      *   Professional, operational, direct.
      *   No academic fluff.
      *   Acknowledge the 15-minute constraint.
      *   Be honest about where the procedure fails (judgment calls).

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too complex for 15 minutes?
      *   *Fix:* Simplify the questions. Use "Yes/No/Unsure" logic.
      *   *Critique:* Did I answer the specific question about Case 3 (User wants Immune, Procedure might say Metabolism)?
      *   *Fix:* Ensure the distinction between SE and CC is clear. SE = History, CC = Current. If User wants Immune, that is CC. If they need SE, it's Metabolism. The procedure must force the curator to label them distinctly, not merge them.
      *   *Critique:* The prompt asks to "Flag the steps that are judgment calls dressed up as procedure."
