answer: |-
  ### Evaluation of the Compromise

  Does splitting the field dissolve the disagreement or relabel it?

  **It dissolves the disagreement for data storage, but relabels it for data retrieval.**

  By separating **Selected-Effect (SE)** (history of maintenance) from **Current-Contribution (CC)** (systematic causal role), you stop forcing curators to collapse two distinct biological realities into one string. This prevents the incoherence your friend fears. However, for the downstream user who needs a *single* answer (e.g., "Is this gene functional?" or "What is the primary phenotype?"), the conflict is not solved; it is merely delegated to them. If your database schema forces a "Canonical Function" for indexing or machine learning input, you must write a priority rule (e.g., "Prefer CC for ML, Prefer SE for Clinical"). If you do not write that rule, the ML group will have to handle missing or conflicting data, which may degrade model performance.

  **Verdict:** Adopt the split. It increases curatorial precision without requiring curators to resolve philosophical disputes. However, you must define a "Priority Flag" for downstream systems that cannot ingest three fields.

  ---

  ### The Curation Procedure (SOP v1.0)

  **Goal:** Populate three fields: `Func_History` (SE), `Func_Current` (CC), `Evidence_Type`.
  **Time Budget:** 15 minutes.
  **User:** Curator (MSc Biology, no philosophy training).

  **Terminology Translation:**
  *   Do not use "Etiological" or "Causal-Role."
  *   Use **"Evolutionary Maintenance"** (History) and **"Systematic Contribution"** (Current).
  *   **Malfunction:** Only applicable if `Func_History` is known but `Func_Current` is absent/broken.

  #### Step 1: Evidence Triage (2 minutes)
  **Question:** Is there direct experimental evidence (assay, knockout, phenotype) or strong homology evidence for *any* activity?
  *   **No:** Return ticket as "Insufficient Evidence." Do not annotate.
  *   **Yes:** Proceed to Step 2.

  #### Step 2: Determine Current Systematic Contribution (`Func_Current`) (5 minutes)
  **Question:** Does the gene product currently perform a specific, reproducible effect that contributes to a capacity of the organism (or host system) *in its present environment*?
  *   *Note:* Ignore whether this effect was "intended" by evolution. Focus on: Does it happen? Does it matter for the system's operation now?
  *   **Yes:** Enter the specific effect (e.g., "Immune suppression," "Metal sequestration").
  *   **No (Effect is noise/byproduct):** Enter "None detected" or "Biochemical activity only."
  *   **[JUDGMENT CALL]:** Distinguishing "systematic contribution" from "biochemical noise." If the effect is measurable but confers no advantage and disrupts no system, it is noise. If it stabilizes a system (even accidentally), it is a contribution. *Rule of thumb:* If a knockout changes a phenotype in the current environment, it is a contribution.

  #### Step 3: Determine Evolutionary Maintenance (`Func_History`) (5 minutes)
  **Question:** Is there evidence that this specific effect was the target of natural selection maintaining the gene in the lineage?
  *   **Evidence types:** Phylogenetic conservation, selection scans (dN/dS), persistence across speciation events, horizontal transfer spread (if adaptive).
  *   **Yes:** Enter the selected effect (e.g., "Metabolic step X," "Light detection").
  *   **No (Neutral/Drift):** Enter "Unknown/Drift."
  *   **No (Data Missing):** *Crucial Step.* If no phylogeny/selection scan is available (common):
      *   If `Func_Current` matches the homologous function in close relatives: Enter `Func_Current` tagged as "Inferred from Homology."
      *   If `Func_Current` is unique or environment changed: Enter "Unknown."
  *   **[JUDGMENT CALL]:** Inferring selection from homology. *Rule:* If the gene is conserved across >3 speciation events and the environment is stable, assume maintenance. If the environment changed (e.g., surface to cave), assume maintenance is broken unless proven otherwise.

  #### Step 4: Conflict Check & Escalation (3 minutes)
  **Question:** Do `Func_History` and `Func_Current` contradict? (e.g., History = Metabolism, Current = Immune Suppression).
  *   **No:** Sign off.
  *   **Yes:**
      *   If the ticket is for **Clinical/Variant interpretation**: Prioritize `Func_History`. (Loss of historical function = Disease risk).
      *   If the ticket is for **ML/Phenotype Prediction**: Prioritize `Func_Current`. (Current state = Predictive feature).
      *   **Action:** Flag for Lead Review (You). Do not sign off. The "Priority Flag" must be set manually.

  #### Step 5: Provenance Tagging (`Evidence_Type`)
  Select one:
  *   `Direct_Assay` (In vivo or In situ)
  *   `Homology_Inference` (Based on sequence similarity)
  *   `Selection_Scan` (Based on population genetics)
  *   `Mixed`

  ---

  ### Running the Procedure on Stylized Tickets

  #### Ticket 1: Light-gated ion channel (Soil Bacterium, HGT)
  *   **Step 1 (Evidence):** Assay shows modulation of response. **Pass.**
  *   **Step 2 (Current):** Does it contribute now? Yes, modulates response to present wavelength. `Func_Current` = "Light response modulation."
  *   **Step 3 (History):** Evidence of selection? Yes, spreading in population + HGT retention implies adaptive value. `Func_History` = "Light response modulation."
  *   **Step 4 (Conflict):** None. Both match.
  *   **Step 5 (Provenance):** `Mixed` (Assay + Population spread).
  *   **Outcome:** Cleared in one step. No time wasted. The procedure treats the HGT spread as sufficient proxy for a selection scan.
  *   **Efficiency:** High.

  #### Ticket 2: Opsin in Cave Vertebrate (Metal Sequestration)
  *   **Step 1 (Evidence):** Binding assays + survival data in cave water. **Pass.**
  *   **Step 2 (Current):** Does it contribute now? Light binding: No effect on animal. Metal sequestration: Improves survival. `Func_Current` = "Metal ion sequestration." (Light binding is biochemical activity, not systematic contribution).
  *   **Step 3 (History):** Evidence of selection?
      *   For Light: Relaxed selection signs. `Func_History` = "Light detection (Lost)."
      *   For Metal: Is there evidence it was *maintained* for this? Or is it a new exaptation? If the gene shows signs of *new* positive selection in the cave lineage, `Func_History` = "Metal sequestration." If not, `Func_History` = "Light detection (Ancestral)."
      *   *Procedure Constraint:* We likely lack the selection scan for the new trait.
      *   *Decision:* `Func_History` = "Light detection (Ancestral)" tagged "Inferred from Homology."
  *   **Step 4 (Conflict):** Yes. History = Light. Current = Metal.
  *   **Escalation:** Flag to Lead.
  *   **Outcome:** The procedure correctly identifies this as an **Exaptation**. It forces the annotation to show that the *current* utility is metal, but the *evolutionary reason* it exists is light.
  *   **Clinical Implication:** If a patient has a mutation here, is it a disease? Probably not (light doesn't matter), but the metal function matters for survival in that niche. The split prevents labeling this "Non-functional" just because light is gone.

  #### Ticket 3: Symbiont Gene (Metabolism vs. Immune Suppression)
  *   **Step 1 (Evidence):** Binding assays + Host survival data. **Pass.**
  *   **Step 2 (Current):** Does it contribute now? Metabolic step: No (metabolite obtained from host). Immune suppression: Yes (binds host protein, suppresses response). `Func_Current` = "Immune suppression."
  *   **Step 3 (History):** Evidence of selection?
      *   Metabolic step: Gene maintained for this in free-living ancestors. `Func_History` = "Metabolic step."
      *   Immune suppression: Is this a new adaptation to symbiosis? If the gene is conserved from the free-living ancestor, the immune suppression might be a pre-adaptation (exaptation).
      *   *Procedure Constraint:* Without a selection scan on the symbiotic lineage, we cannot confirm selection for immune suppression.
      *   *Decision:* `Func_History` = "Metabolic step."
  *   **Step 4 (Conflict):** Yes. History = Metabolism. Current = Immune.
  *   **Your Request:** You want this annotated as Immune Suppression.
  *   **Procedure Result:** The procedure annotates `Func_Current` as Immune Suppression. It annotates `Func_History` as Metabolism.
  *   **Does it refuse you?** No. It gives you the Immune Suppression label in the `Func_Current` field.
  *   **The Catch:** If your downstream ML model requires a *single* "Primary Function" string, the procedure forces a choice in Step 4.
      *   If the ML model predicts *current* phenotype: Use `Func_Current` (Immune).
      *   If the Clinical partner assesses *Loss-of-Function*: They need to know the gene is "broken" relative to history. If the metabolic step is gone, is the gene "broken"? No, it's repurposed.
      *   **Resolution:** You get your Immune Suppression annotation in the `Func_Current` field. The procedure supports this. However, you must accept that the `Func_History` field will say "Metabolism," which might confuse a user looking for a single string. You must instruct the ML group to ingest `Func_Current` for predictive tasks.

  ---

  ### Limitations and Steering Group Advice

  #### 1. Systematic Misclassifications
  *   **Moonlighting Proteins:** A protein with two distinct current contributions (e.g., enzyme + structural). The procedure asks for "a specific effect." Curators will pick the dominant one and ignore the second. **Mitigation:** Allow multiple entries in `Func_Current` if evidence is equal, but this increases curation time.
  *   **Neutral Drift:** A gene that persists due to linkage, not selection, but currently does something useful. The procedure will tag `Func_History` as "Unknown" but `Func_Current` as "Contribution." This is accurate, but users often interpret "Unknown History" as "Pseudogene." **Mitigation:** Add a "Status: Active" flag separate from function.
  *   **The "Inferred from Homology" Trap:** In 80% of tickets, you won't have selection scans. Curators will default `Func_History` to `Func_Current` based on homology. This collapses the distinction you just built. **Mitigation:** Audit 10% of "Homology Inference" tickets quarterly to ensure curators aren't assuming history matches current without environmental context.

  #### 2. Retroactive Application
  If you apply this retroactively:
  *   **~30% of annotations will shift.** Any gene annotated with a function based on homology where the environment has shifted (e.g., pathogens, symbionts, extremophiles) will now have a mismatch between `Func_History` and `Func_Current`.
  *   **Pseudogenes:** Many genes annotated as "Non-functional" because they lost their historical function will now be annotated as `Func_Current` = "X" if they have a new causal role (like the cave opsin). This increases the "functional genome" size, which may confuse clinical partners looking for null alleles.

  #### 3. Message to the Steering Group
  Do not frame this as adopting a philosophical stance. Frame it as **increasing data granularity to handle edge cases.**

  **Script:**
  >"Currently, our schema forces curators to merge evolutionary history and current biochemical activity into one label. This creates errors in two specific high-value scenarios:
  >1. **Clinical Variant Interpretation:** We cannot distinguish between a gene that is 'broken' (lost historical function) and a gene that is 'repurposed' (new current function). This leads to false positives in rare-disease investigation.
  >2. **Machine Learning:** Our models train on current phenotypic effects. Feeding them historical functions for repurposed genes (like symbiont effectors) degrades prediction accuracy.
  >
  >By splitting the fields, we do not take a side on what function 'is.' We simply record what we know: what the evidence says about its history, and what the evidence says about its current activity. This allows downstream users to select the definition that fits their use-case, rather than forcing our curators to guess which one the user wants."

  #### 4. The "Single Answer" Problem
  Be honest with the Steering Group: **This procedure does not solve the single-answer problem; it manages it.**
  If a downstream partner demands one string, you must implement a **Priority Rule**.
  *   **Recommendation:** Default "Canonical Function" = `Func_Current`.
  *   **Reasoning:** For both ML (prediction) and Clinical (current patient state), what the protein *does now* is more actionable than what it *did ancestrally*. A clinician treating a patient with the symbiont cares about immune suppression, not ancestral metabolism.
  *   **Exception:** If `Func_Current` is "None" but `Func_History` is known, mark as "Loss-of-Function."

  ### Summary of Judgment Calls to Monitor
  1.  **Systematic vs. Noise:** Curators must decide if a biochemical effect is biologically relevant. (Risk: Over-annotation of promiscuous activities).
  2.  **Homology as History:** Curators will assume history matches homologs. (Risk: Missing exaptations).
  3.  **Priority:** When fields conflict, which one becomes the "Canonical" label for legacy systems? (Risk: Inconsistent indexing).

  This procedure respects your time constraints, acknowledges the lack of phylogenetic data, and gives you the "Immune Suppression" label you need for Ticket 3 without lying about the evolutionary history.
