prompt: |-
  Assume the role of a philosopher of mind specializing in the ethics of computation and sentience. Think step by step, and begin with brief brainstorming: list the two competing conditions you must isolate before designing the case.

  Construct a thought experiment—realistic, no more than two paragraphs, set in a clinical neurorehabilitation lab rather than science fiction—engineered to isolate whether causal efficacy or representational content determines moral status for artificial computations. The system should be a predictive-processing motor prosthesis that runs two parallel decoding streams: Stream Alpha, whose outputs drive the patient's limb movements and are available to conscious report; and Stream Beta, a "shadow computation" that performs the identical representational transformation on the same inputs, shares only power and clock synchronization, and writes its outputs exclusively to an external audit log that no subsystem of the prosthesis or patient can access. The experimenter considers terminating Stream Beta to reclaim computational resources, with no effect on behavior or experience.

  The case must be designed so that:
  (1) a causal-efficacy view holds that terminating Beta is morally neutral (like deleting an unread file), because Beta plays no role in the integrated system's behavior or awareness;
  (2) a content-integration view holds that terminating Beta is morally equivalent to harming the patient, since Beta instantiates the same representational structures with the same integration metrics as Alpha;
  (3) the identity of content and structure between the streams is stipulated by design, not assumed.

  After the scenario, walk through why each view delivers its verdict, identifying the precise feature—causal isolation versus representational identity—that does the work. Then answer: if Beta's outputs were readable by the system but consistently ignored, would the causal-efficacy view change its verdict, and why? Finish with how a defender of the causal view would attack the intuition that Beta matters, without appealing to skepticism about other minds. Do not include citations, reading lists, or references to specific authors or texts; define "shadow computation" within the prompt and reason from first principles.
