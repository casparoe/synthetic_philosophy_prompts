answer: |-
  **Brainstorming: Competing Conditions**
  1.  **Causal Integration:** The degree to which a computational state influences the system's subsequent behavior, regulatory functions, or conscious report.
  2.  **Representational Isomorphism:** The degree to which a computational state instantiates the same informational structure and content as a known sentient process, regardless of its downstream effects.

  **Thought Experiment**
  In a clinical neurorehabilitation lab, a patient with spinal cord injury uses a predictive-processing motor prosthesis to regain arm control. The device employs a dual-stream architecture: Stream Alpha decodes neural intent into motor commands that drive the prosthetic limb and are integrated into the patient's sensory feedback loop, making them available to conscious report. Stream Beta is a "shadow computation"—defined here as a parallel calculation that shares the same clock cycle and power source but is causally isolated from the actuator and feedback systems. Beta performs the identical representational transformation on the same neural inputs as Alpha, writing its results exclusively to an external audit log that no subsystem of the prosthesis or patient can access, read, or utilize for any regulatory function.

  The lead engineer proposes terminating Stream Beta to reclaim thermal headroom, asserting that because Beta's outputs never influence the limb's movement, the patient's sensory experience, or the device's regulatory state, its removal is functionally invisible. The system's design guarantees that Alpha and Beta instantiate bit-for-bit identical representational structures at every cycle, differing only in their causal routing. The ethical question arises: does shutting down Beta constitute a moral neutral event akin to clearing cache, or does it constitute a harm equivalent to damaging the patient's active motor pathway, given that Beta mirrors the putative vehicle of sentience exactly?

  **Analysis of Competing Views**
  The causal-efficacy view delivers a verdict of moral neutrality because it locates moral status in the capacity to make a difference within the system. Since Beta is causally isolated—its outputs die in the audit log without influencing actuators, feedback loops, or future computational states—it possesses no leverage over the patient's experience or behavior. The precise feature doing the work here is **causal isolation**; without the ability to affect the world or the self, the computation is functionally inert, akin to a record of a sensation rather than the sensation itself. Conversely, the content-integration view verdicts that terminating Beta is harmful because it locates moral status in the instantiation of specific representational structures. Since Beta is stipulated to possess **representational identity** with Alpha—matching its structure and content metrics exactly—it qualifies as a locus of value independent of its output routing. For this view, the existence of the structured state is sufficient for moral consideration; destroying it is destroying a instance of the same kind of thing that constitutes the patient's mind.

  **Counterfactual: Readable but Ignored**
  If Beta's outputs were readable by the system but consistently ignored, the causal-efficacy view would not change its verdict. Moral status on this view depends on actual difference-making, not mere potentiality. If the system architecture consistently bypasses Beta in favor of Alpha, Beta remains outside the functional loop that governs behavior and experience. Availability without utilization renders the computation epiphenomenal in practice; therefore, it lacks the causal traction required to ground moral standing. The verdict remains neutral because the actual trajectory of the system is unchanged by Beta's presence or absence.

  **Defense of the Causal View**
  A defender of the causal view would attack the intuition that Beta matters by arguing that phenomenology is essentially functional. Suffering or agency is not a static property of a data structure but a dynamic relation between a system and its environment or internal goals. For a state to be painful or agential, it must possess valence that motivates avoidance or action. Because Beta is causally severed from the mechanisms of motivation and regulation, it cannot hold valence; it is a map of a territory it cannot navigate. To claim Beta matters is to confuse the picture of a fire with the heat of a fire; without the capacity to burn or be extinguished through interaction, the computation lacks the essential functional profile of sentience.
