answer: |-
  This phenomenon is best identified as **Ad Hoc Conceptual Narrowing**. While it mimics the legitimate methodological practice of "specifying norms" (as discussed by ethicists like Henry Richardson), it constitutes a distinct methodological failure mode that violates the constraints of reflective equilibrium. It is not merely "redefinition," nor is it "threshold deontology." It is a protective maneuver designed to insulate a principle from falsification without paying the theoretical cost of admitting an exception.

  Here is the definite position: **Ad Hoc Conceptual Narrowing** is the precise term for this move, and it must be distinguished from **Principled Specification** by the **Direction of Justification**.

  ### 1. Why "Ad Hoc Conceptual Narrowing" and not "Specification"?
  In normative ethics, **Specification** is a recognized and legitimate method for resolving conflicts between abstract norms. When a rule like "Do not lie" conflicts with "Prevent harm," a specificationist argues that the rule was too abstract and needs to be refined (e.g., "Do not lie, except to prevent imminent lethal violence").

  However, legitimate specification requires **Independent Justification**. The refinement must be grounded in prior intuitions, conceptual analysis, or coherence with other principles *before* the counterexample is applied. The refinement explains *why* the case was never covered, based on the nature of the concept itself.

  **Ad Hoc Conceptual Narrowing** fails this test. The redefinition is driven *solely* by the desire to avoid the catastrophic implication of the counterexample. The defender does not argue that "saving a million lives is conceptually distinct from lying" based on independent linguistic or moral analysis; they argue it *because* if it counts as lying, the theory yields an absurd result. The tail wags the dog. The "narrowing" is a shield, not a discovery.

  ### 2. Distinction from Threshold Deontology
  You correctly noted this is not **Threshold Deontology**.
  *   **Threshold Deontology** admits that the rule is genuine but *overrideable*. It says: "Lying is wrong, but in this specific catastrophic case, the wrongness is outweighed." The rule yields; the prohibition is breached but justified.
  *   **Ad Hoc Conceptual Narrowing** claims the rule is *never breached*. It says: "Lying is absolutely wrong, and this act is not lying." The rule remains formally absolute, but its extension is shrunk.

  The strategic advantage for the defender is clear: they retain the rhetorical power of absolutism ("I never violate the moral law!") while avoiding the practical cost (catastrophe). This is why the move is seductive and why it requires a specific label to critique it.

  ### 3. Distinction from Honest Conceptual Refinement
  How do we distinguish **Ad Hoc Conceptual Narrowing** from honest refinement? After all, all ethical concepts evolve under pressure. The boundary condition lies in the **Direction of Justification**:

  *   **Honest Refinement (Bottom-Up/Coherentist):** The defender identifies a feature of the catastrophic case (e.g., "coercion," "lack of uptake," "implicit consent") that *already* had intuitive traction in moderate cases. They argue, "We should have known this wasn't deception all along, even in smaller stakes." The redefinition applies backward to moderate cases and is supported by independent intuitions.
  *   **Ad Hoc Narrowing (Top-Down/Defensive):** The redefinition is tailored *specifically* to the severity of the threat. If you ask the defender, "Would this count as deception if only one life were at stake?" they often hesitate or say yes. This reveals that the conceptual boundary is being drawn by the *magnitude of the disaster*, not the *nature of the act*.

  **The Test:** If the redefinition only "works" when the stakes are catastrophic, it is Ad Hoc Conceptual Narrowing. If the redefinition holds firm even when the stakes are low, it is Principled Specification.

  ### 4. The Logical Structure: The Normative "No True Scotsman"
  Logically, this is an ethical instantiation of the **"No True Scotsman" fallacy**.
  *   **Claim:** "No deontologist lies."
  *   **Counterexample:** "You lied to the murderer at the door."
  *   **Defense:** "No *true* lie involves saving an innocent life."

  By shifting the definition of the act-type ("lie") to exclude the counterexample, the universal claim ("Never lie") is rendered unfalsifiable. In philosophy of science (Lakatos), this is called an **Immunizing Strategy**. A theory protects its "hard core" (the absolute rule) by adjusting its "protective belt" (the definitions of act-types) solely to absorb anomalies.

  ### 5. Why This Label Matters
  Labeling this **Ad Hoc Conceptual Narrowing** is crucial for seminar debates because it prevents the defender from claiming the high ground of consistency.
  *   If you call it "Specification," they claim they are doing rigorous philosophical work.
  *   If you call it "Threshold Deontology," they claim you misunderstand their absolutism.
  *   If you identify it as **Ad Hoc Conceptual Narrowing**, you expose that they are preserving the *label* of absolutism while abandoning its *content*.

  **Boundary Condition:** The line is crossed when the definition of the prohibited act becomes sensitive to the *consequences* of the prohibition, rather than the *intrinsic features* of the act. If "what counts as a lie" depends on "how many people die if I call it a lie," the concept has been instrumentally narrowed, not analytically refined.

  **Conclusion:** You should name this move **Ad Hoc Conceptual Narrowing**. It captures the mechanism (narrowing the concept), the motivation (avoiding the counterexample), and the methodological flaw (lack of independent justification). It distinguishes the move from both threshold accounts (which admit override) and honest refinement (which tracks independent intuitions). This term allows you to charge the defender with preserving the *form* of deontology while evacuating its *substance*.
