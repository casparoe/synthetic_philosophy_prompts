answer: |-
  ### What the theory licenses

  Ellsberg's work is often reduced to "ambiguity aversion," but its substance distinguishes *why* we hesitate. We react differently to total ignorance, to information from unevaluable sources, and to conflicting data from reliable sources. A committee workflow must encode these distinctions rather than applying a blanket penalty for uncertainty.

  I am building **Admissible Sets (Interval Probabilities)** into this workflow. Instead of demanding a single point estimate of success (e.g., "70% chance"), the committee defines a range (e.g., "10% to 80%"). You act if the *lower bound* of the intervention's benefit exceeds the *upper bound* of the status quo's benefit. This preserves the Ellsberg insight—imprecise probabilities widen the range—without mandating paralysis.

  Had we chosen **Minimax**, we would assume the worst-case probability within that set is true. This would require denying almost all novel interventions, as the worst case is usually catastrophic harm. Had we chosen **Status Quo Default**, we would require the new option to strictly dominate the current standard across the entire set. This would require near-certainty before action, systematically biasing the hospital against innovation even when the status quo is fatal. Admissible sets allow us to act when the *plausible best* is good enough and the *plausible worst* is acceptable, distinguishing between "we don't know" and "we know it might fail."

  ### The procedure

  1.  **Classify the Ambiguity Source.**
      *   *Question:* Is the uncertainty due to (A) no data, (B) data from an unevaluable source (e.g., foreign reports without context), or (C) conflicting data from evaluable sources (e.g., retrospective success vs. subpopulation failure)?
      *   *Sufficient Answer:* Consensus on one category.
      *   *Significance:* Type A requires the widest probability intervals; Type C allows narrower intervals but requires mitigation plans.

  2.  **Construct the Admissible Set.**
      *   *Question:* What is the defensible lower and upper bound of net benefit for the intervention and the status quo?
      *   *Sufficient Answer:* Numeric ranges or ordered ordinal scales (e.g., "Low to High") agreed upon by clinical leads.
      *   *Stopping Rule (Deny):* If the intervention's upper bound of benefit is lower than the status quo's lower bound.

  3.  **Check for Dominance.**
      *   *Question:* Does the intervention's lower-bound benefit exceed the status quo's upper-bound benefit?
      *   *Sufficient Answer:* Yes/No.
      *   *Stopping Rule (Permit):* If Yes, permit immediately.
      *   *Stopping Rule (Default):* If No, and intervals overlap significantly, default to Status Quo *unless* Step 4 overrides.

  4.  **Evaluate Evidence Utility.**
      *   *Question:* Would commissioning further evidence reduce the ambiguity (narrow the interval) or merely relocate it (shift uncertainty to a new parameter)?
      *   *Sufficient Answer:* Specific metric that would narrow the bound (e.g., "prospective validation on subpopulation X").
      *   *Avoidance Check:* If the answer is "we need more data" but the status quo involves imminent harm (e.g., death), delay is classified as avoidance.
      *   *Stopping Rule (Permit-with-Conditions):* If ambiguity is Type C (conflicting) and mitigation is possible, permit with data collection mandates. If Type A or B and status quo is fatal, permit as compassionate use.

  5.  **Final Recommendation.**
      *   *Question:* Does the recommendation align with the stopping rules above?
      *   *Sufficient Answer:* Deny, Permit, or Permit-with-Conditions (including sunset clauses).

  ### Where judgment cannot be eliminated

  This procedure does not calculate risk; it structures argument. The critical failure point is Step 2: constructing the admissible set. No algorithm determines whether the lower bound of success for an unapproved device is 1% or 10%. This requires clinical intuition, which is precisely where bias enters. A pessimistic clinician will widen the harm interval; an optimistic innovator will narrow it.

  The procedure cannot eliminate this subjectivity, but it forces it into the open. Instead of arguing "I feel this is risky," members must argue "The lower bound cannot be higher than X because of Y mechanism." This shifts debate from intuition to defensibility. However, judgment remains in deciding what counts as a "defensible" bound. If the committee lacks expertise in the specific mechanism, they may default to overly wide intervals, triggering the Status Quo Default unnecessarily.

  Furthermore, Step 4 requires judging the value of information. Determining whether a study reduces ambiguity or relocates it requires meta-scientific judgment. A committee might accept a promise of future data as "reduction" when it is actually "relocation" (e.g., promising to monitor harm without defining thresholds). The procedure relies on the Chair to challenge vague evidence plans. We cannot formalize the detection of procrastination; we can only require that the cost of delay be explicitly weighed against the ambiguity reduction.

  ### Worked cases

  **(i) Unapproved Implantable Device:**
  *Ambiguity:* Type B (Unevaluable source: foreign case reports).
  *Admissible Set:* Status quo benefit is zero (death). Intervention lower bound is uncertain but non-zero (plausible mechanism).
  *Dominance:* Status quo is fatal. Intervention lower bound > death.
  *Evidence:* Further study requires time patient does not have. Delay is avoidance.
  *Verdict:* **Permit.**
  *Conflation:* You expected Denial. This rests on conflating *regulatory ambiguity* (FDA status) with *clinical dominance*. Decision theory dictates that when the status quo is catastrophic, even wide ambiguity intervals permit action. Denying this suggests the committee weights institutional liability over patient survival.

  **(ii) Sepsis Early-Warning Model:**
  *Ambiguity:* Type C (Conflicting: strong retrospective vs. subpopulation failure).
  *Admissible Set:* Benefit range is high generally, low in subpopulation. Harm range includes missed diagnoses in that group.
  *Dominance:* No strict dominance, but intervals overlap favorably if mitigated.
  *Evidence:* Prospective validation reduces ambiguity regarding the subpopulation.
  *Verdict:* **Permit-with-Conditions.** Require manual override or parallel monitoring for the specific subpopulation until prospective data narrows the harm interval.

  **(iii) Pilot Continuation:**
  *Ambiguity:* Type C (Weak data vs. clinician dependence).
  *Admissible Set:* Benefit mildly positive. Harm includes withdrawal effects/loss of workflow.
  *Dominance:* Status quo (withdrawal) now carries harm due to dependence.
  *Verdict:* **Permit-with-Conditions.** Continue with a hard sunset date. The dependence raises the cost of the status quo (stopping), shifting the dominance check.

  ### How this procedure will fail

  First, **Interval Creep.** Over time, committees may treat the "admissible" lower bound as a guaranteed minimum. If we permit a device based on a 1% lower bound, administrators may later cite that 1% as an expected success rate for budgeting. The distinction between *possible* and *probable* will erode.

  Second, **Bureaucratic Safety.** Step 1 invites gaming. Members may classify valid data as Type B (unevaluable) to widen intervals and trigger the Status Quo Default, avoiding difficult decisions without voting "No." This preserves the appearance of rigor while enforcing inertia.

  Third, **Evidence Fatigue.** Step 4 requires assessing the utility of information. In a busy hospital, "collect more data" is the path of least resistance. The committee may routinely choose Permit-with-Conditions, dumping the burden of validation onto clinicians who lack resources, effectively permitting the intervention while absolving the committee of responsibility for the ambiguity. The procedure becomes a liability shield rather than a decision tool.

  ### What would change my mind

  I would shift toward a **Minimax** approach if evidence showed that committees systematically underestimate the "worst-case" bound in Type B ambiguity. If laboratory findings on group judgment demonstrate that clinicians cannot reliably estimate lower bounds without optimistic bias, then admissible sets are too dangerous; we should assume the worst.

  Alternatively, a successful **Bayesian rejoinder** would move me. If you could demonstrate that assigning subjective priors to Type B ambiguity (e.g., "foreign reports count as 10% of a domestic trial") yields better patient outcomes than interval withholding, I would adopt priors. Currently, I reject priors because they mask disagreement as precision.

  Finally, if I discovered a defect in how I separated the epistemic predicaments—specifically, if Type B (unevaluable source) proves empirically indistinguishable from Type A (no info) in outcome—then distinguishing them is theoretical vanity. If source evaluation adds no predictive value, the procedure should collapse into a simple risk/benefit ratio regardless of evidence quality. My reasoning breaks if the *source* of ambiguity matters less than the *magnitude* of the stake.
