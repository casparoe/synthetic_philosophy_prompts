answer: |-
  Fund Institutional Pluralism (Option Two) as your primary track, followed by the Epistemics of Diagnostic Boundaries (Option Three), and treat Unstable Baselines (Option One) as a supporting critique rather than a standalone program.

  Option Two is the only one that directly alters institutional reasoning without requiring consensus on metaphysics. Insurers, lawyers, and guideline panels do not need to agree on what disease *is*; they need to know which criteria trigger which obligations. A postdoc can spend two years mapping the specific conceptual mismatches between, say, ADA accommodation standards and ICD reimbursement codes, producing a framework that allows a lawyer to argue for accommodations without needing to prove "biological dysfunction." This is highly tractable for philosophy/STS scholars because it is analytical and comparative, not empirical. It is also the most neglected: philosophers love unified theories, but institutions operate on patched-together pragmatism. Formalizing that pluralism is a service to reality rather than a capitulation.

  Option Three is upstream of Option Two but downstream of Option One. You cannot decide which concept to use for which purpose (Option Two) until you understand how those concepts are stabilized or revised (Option Three). This is tractable via case studies (e.g., how the Long Covid code was created, who was consulted, what data was deemed sufficient). The neglect here is in the *normative* evaluation of boundary shifts: STS describes looping effects, but rarely prescribes how to govern them fairly. If a postdoc can produce a checklist for guideline panels on "evidence required for boundary revision when patient reporting outpaces biomarkers," that is a direct tool for change. However, it is riskier than Option Two because it requires institutions to admit uncertainty about their own categories.

  Option One is the least prioritized because it is theoretically potent but institutionally inert. Telling an insurer that their reference class is environmentally corrupted does not give them a new number to use; it just undermines the old one. Without Option Three's mechanism for revision or Option Two's functional split, this research ends as a critique rather than a tool. It is also the hardest to make tractable in two years without bench science; proving environmental baselines are skewed requires data these postdocs cannot generate. Keep this as a background assumption for the other two tracks, not a primary deliverable.

  Regarding your skepticism on practical stakes: you are correct that the standard mapping is overrated. Naturalism does not protect against medicalization; it often facilitates it by providing an objective veneer to value-laden choices (e.g., pathologizing normal grief or menopause). Normativism does not inevitably invite disease-mongering; it can restrict it by requiring explicit justification for why a state is "bad" rather than hiding behind "dysfunction." The fear that abandoning naturalism opens the floodgates is a rhetorical shield used to protect existing power structures from having to articulate their values. Drop this framing from your call; it distracts from the actual work of designing robust normative criteria.

  To ensure these topics move from theory to practice, require that each postdoc project produce a "translation artifact" within the first year—a draft policy clause, a legal brief template, or a decision-tree for clinicians—rather than promising only papers. Evidence that should move a topic up in priority during the grant period is early adoption: if a pilot hospital unit or legal aid clinic agrees to test one of these artifacts, that topic becomes the priority. Evidence that should move a topic down is insularity: if the work remains citable only by other philosophers, it has failed the ten-year test before it begins. The missing element in your list is not a topic, but a method: conceptual work changes institutions only when it is co-designed with them, so mandate that each postdoc spends significant time embedded in the target institution, not just studying it from afar.
