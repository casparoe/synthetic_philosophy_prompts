  # Joint Statement on Constitutional Precommitment Mechanisms
  **Regarding Entrenchment of Long-Term Collective Goals**

  **Parties:**
  *   **Camp A:** Intergenerational Precommitment Advocates
  *   **Camp B:** Living Democracy Advocates

  **Date:** 24 May 2024
  **Purpose:** To delineate areas of agreement regarding institutional mechanics, specify substantive disagreements regarding legitimacy and risk, and identify empirical cruxes capable of resolving the dispute without recourse to abstract philosophy.

  ---

  ### 1. Agreed Claims: The Mechanics of Constitutional Lock-Ins
  Both camps agree that 'Ulysses contracts' in constitutional design are not merely metaphorical but operate through specific legal and political mechanisms. We sign below to the following technical descriptions:

  1.  **Entrenchment Costs:** Lock-in provisions function by raising the transaction costs of repeal. This is achieved procedurally (e.g., requiring supermajorities, double votes, or referenda) rather than making repeal impossible.
  2.  **Judicialisation:** Entrenched goals shift enforcement from the legislature to the judiciary. This grants courts the power to strike down legislation deemed incompatible with the long-term target, altering the separation of powers.
  3.  **Burden of Proof:** Precommitment reverses the default status quo. Instead of proponents proving why a new policy is needed, opponents must prove why the entrenched goal should be waived or amended.
  4.  **Sunset and Review:** Mechanisms exist to mitigate rigidity, including sunset clauses (automatic expiry) and mandatory review periods. Both camps agree these reduce the 'dead-hand' effect but also reduce the credibility of the commitment.
  5.  **Signal Effect:** Regardless of legal enforceability, constitutional targets signal policy stability to private markets. This lowers the cost of capital for long-term investments (e.g., green infrastructure) but may raise it for sectors reliant on regulatory flexibility.

  ---

  ### 2. Disagreements Table
  While we agree on *how* these mechanisms work, we disagree on their normative legitimacy and risk profile. The following table records each position in wording acceptable to the holder.

  | Issue | Camp A (Precommitment Advocates) | Camp B (Living Democracy Advocates) |
  | :--- | :--- | :--- |
  | **Legitimacy Source** | Legitimacy derives from protecting the rights of future persons who cannot vote today. The polity is a continuous entity across time. | Legitimacy derives from the consent of the currently living electorate. The polity is a discrete entity reset at each election cycle. |
  | **Primary Risk** | The primary risk is **time-inconsistency**: short-term electoral cycles will systematically sacrifice long-term survival for immediate gain. | The primary risk is **policy stagnation**: entrenched rules will prevent necessary adaptation to new science, technologies, or social priorities. |
  | **Role of Courts** | Courts are appropriate guardians of procedural fairness and fundamental rights, including intergenerational equity. | Courts are technocratic bodies lacking democratic mandate; expanding their power to enforce policy targets is illegitimate. |
  | **Nature of Binding** | Binding future parliaments is equivalent to a government issuing long-term debt: a legitimate commitment of future resources. | Binding future parliaments is equivalent to imposing taxation without representation: it treats future voters as subjects rather than sovereigns. |

  ---

  ### 3. Empirical Cruxes and Institutional Cases
  We identify two specific cruxes where our disagreement rests on empirical expectations rather than purely moral axioms. For each, we name a concrete institutional case and record our advance predictions regarding what further observation of that case will demonstrate.

  #### Crux 1: Temporal Discounting
  **Question:** Is the democratic preference for present consumption over future benefit a rational failure (myopia) or a legitimate value shift?

  *   **Institutional Case:** **The UK Climate Change Act (2008)**. Specifically, the mechanism of five-year carbon budgets that bind successive governments unless amended by supermajority or specific statutory override.
  *   **Camp A Prediction:** Long-term data will show that the Act successfully insulated decarbonisation policy from electoral volatility, resulting in lower cumulative emissions than comparable nations without such locks, proving that discounting the future was a market/political failure.
  *   **Camp B Prediction:** Long-term data will show that the Act forced inefficient abatement pathways because it prevented later parliaments from pivoting to superior technologies or adjusting targets based on updated economic costs, proving that discounting reflects legitimate changing priorities.

  #### Crux 2: Binding Self vs. Binding Strangers
  **Question:** Is there a meaningful distinction between a generation binding itself (via debt or law) and binding subsequent generations who had no say in the rule's creation?

  *   **Institutional Case:** **The German 'Debt Brake' (Schuldenbremse)**. A constitutional rule limiting structural federal deficits, effectively binding future budgets to past fiscal decisions.
  *   **Camp A Prediction:** Evaluation will show the rule prevented intergenerational theft by stopping current voters from financing consumption via debt that future taxpayers must service, thereby enhancing future sovereignty.
  *   **Camp B Prediction:** Evaluation will show the rule constrained future voters' ability to respond to existential crises (e.g., pandemics, climate adaptation, defence) without raising taxes, thereby reducing future sovereignty and forcing austerity on non-consenting citizens.

  ---

  ### 4. Residue Report: Verbal Disputes
  We acknowledge that a portion of our disagreement stems from divergent definitions rather than substantive conflict. We agree to suspend argument on the following terms until the empirical cruxes above are tested:

  1.  **'Sovereignty':**
      *   *Conflict:* Camp A uses 'sovereignty' to mean the capacity of the state to survive across centuries. Camp B uses 'sovereignty' to mean the immediate will of the current majority.
      *   *Resolution:* We acknowledge these are incompatible definitions. We will instead use **'Continuity'** (Camp A) and **'Self-Determination'** (Camp B) to avoid talking past one another.

  2.  **'Consent':**
      *   *Conflict:* Camp A argues future citizens tacitly consent to constitutional frameworks by remaining within the jurisdiction. Camp B argues consent requires explicit periodic renewal.
      *   *Resolution:* We agree this is currently unresolvable philosophically. We will treat consent as a variable dependent on **exit costs** (ease of emigration) and **amendment costs** (ease of changing the constitution), rather than metaphysical consent.

  3.  **'Rights':**
      *   *Conflict:* Camp A speaks of 'rights of future people' as existing now. Camp B argues rights cannot exist without a rights-holder currently alive.
      *   *Resolution:* We will rephrase this as **'Interests'**. Camp A argues future interests must be weighted heavily; Camp B argues they must be weighted zero until those people exist.

  **Signed,**

  _________________________ (Camp A)

  _________________________ (Camp B)
