prompt: |-
  ok so i spent like two hours last night going back and forth with my friend about futarchy and we mostly just talked past each other, so i want you to write the thing we should've actualy produced — the joint statement from an adversarial collaboration between a committed futarchist and a committed "keep it democratic, legitimacy comes from the people" defender.

  quick recap of what i mean by futarchy: instead of electing people and then having them pick policies, you let a superforecasting system / prediction market pick which policies to implement, based on which ones it predicts will produce the best long-run outcomes, and you just follow whatever it picks. my friend is the one who thinks that's insane and that you need actual human democratic buy-in.

  what i want: (1) the claims both sides can actually sign — including what futarchy even is, and what both of them agree is broken about current governance; (2) the exact disagreements, each phrased so the side it's describing would accept the wording of its own view; (3) the cruxes — the sub-questions where settling them would actually move at least one of us; and (4) for each crux, a concrete case or argument both would agree bears on it, plus what each side predicts about it. format it as a numbered agreed-claims section and then a disagreements table.

  the part i really want you to nail: some of what we argued about was just us using words differently (like what counts as "legitimacy," or what "best outcomes" even means), and some of it was a real, seperate, substantive split. tell me which is which and why. and get specific about the manipulation problem — the worry that whoever controls the objective function, or can rig the market, just wins — because i think that's where the whole thing actually breaks and my friend thinks it's solvable.

  don't give me a reading list or citations, i can't check those and i just want the reasoning. and at the very end put the bottom line as a single label in \answer{...} — pick exactly one of: VERBAL (the residual split is mostly just words), SUBSTANTIVE (it's a real disagreement that can't be talked away), or MIXED.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Topic:** Futarchy vs. Democracy (Legitimacy).
      *   **Context:** Two friends talked past each other for two hours. Need a joint statement from an adversarial collaboration.
      *   **Roles:** Committed Futarchist (Pro-Market/Forecasting) vs. Committed Democrat (Pro-People/Legitimacy).
      *   **Requirements:**
          1.  Agreed Claims (definitions, shared diagnosis of current brokenness).
          2.  Exact Disagreements (phrased charitably for each side).
          3.  Cruxes (sub-questions that, if settled, would change minds).
          4.  Evidence/Arguments per Crux (shared relevance, divergent predictions).
          5.  Specific Focus: Distinguish verbal vs. substantive disagreements (especially on "legitimacy" and "outcomes"). Address the manipulation/objective function problem specifically.
          6.  Format: Numbered agreed-claims section, then a disagreements table.
          7.  Ending: A single label in `\answer{...}` (VERBAL, SUBSTANTIVE, or MIXED).
      8.  **Constraint:** No reading lists or citations. Just reasoning.

  2.  **Deconstruct the Positions:**
      *   **Futarchist:** Believes current politics is noise/signaling. Believes markets/forecasting aggregate information better than voting. Believes "good outcomes" are measurable (GDP, health, stability). Worries democracy leads to short-termism and populism.
      *   **Democrat:** Believes governance requires consent. Believes "good outcomes" are normative, not just empirical. Worries futarchy hides value judgments behind a "neutral" mechanism. Worries about manipulation of the metric or the market. Believes legitimacy *is* the process, not just the result.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need common ground. Both hate corruption, short-termism, and polarization.
      *   Need a shared definition of Futarchy (Robin Hanson's version: Vote on values, bet on beliefs).
      *   Need to acknowledge that *some* metric is always used, even in democracy (implicit vs. explicit).

  4.  **Drafting Section 2: Disagreements (The Core):**
      *   *Legitimacy:* Is it procedural (voting) or consequentialist (results)?
      *   *Epistemics:* Can markets measure "good" better than voters?
      *   *Manipulation:* Is rigging the metric/market harder or easier than rigging elections/lobbying?
      *   *Values:* Can we separate "what we want" (values) from "how to get it" (beliefs)?

  5.  **Drafting Section 3: Cruxes & Evidence:**
      *   Need specific tests.
      *   *Crux 1: The Objective Function.* Can we agree on a metric (e.g., GDP + Life Expectancy) that doesn't capture everything we care about?
      *   *Crux 2: Manipulation Resistance.* Is it easier to bribe 51% of voters or manipulate a prediction market/metric?
      *   *Crux 3: Adaptability.* If the market picks a policy that feels morally wrong but measures well, do we override it?

  6.  **Addressing the "Verbal vs. Substantive" Requirement:**
      *   *Verbal:* What "legitimacy" means. One means "right to rule via consent," the other means "authority via competence."
      *   *Substantive:* The manipulation risk. Can we actually secure the oracle? The value alignment problem (Goodhart's Law).
      *   *The Manipulation Point:* The prompt specifically asks to nail the manipulation/objective function problem. The Futarchist thinks cryptographic/financial incentives solve it. The Democrat thinks power dynamics subvert it. This is likely substantive.

  7.  **Refining the Output (Iterative Process):**
      *   *Tone:* Neutral, precise, collaborative but acknowledging deep divides.
      *   *Formatting:* Clear headers, table for disagreements.
      *   *The "Answer":* I need to decide at the end. Is it mostly words? No, the manipulation risk and the definition of "value" are real. Is it purely substantive? No, some of it is definitional (legitimacy). So, MIXED is the honest answer.

  8.  **Drafting the Content (Mental Check against constraints):**
      *   *Did I define Futarchy clearly?* Yes, "Vote on values, bet on beliefs."
      *   *Did I address the manipulation worry?* Yes, in the cruxes.
      *   *Did I distinguish verbal/substantive?* Yes, in the analysis section.
      *   *No citations?* Checked.
      *   *Final Label?* `\answer{MIXED}`.

  9.  **Final Polish:**
      *   Make sure the "Disagreements" table clearly shows Side A vs. Side B phrasing.
      *   Ensure the "Cruxes" have concrete predictions.
      *   Make sure the distinction between "values" (what we want) and "beliefs" (how to get it) is highlighted, as that's the heart of Futarchy.

