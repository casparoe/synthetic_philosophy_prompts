      *(Refining the Manipulation Section)*: The prompt says "get specific about the manipulation problem... because i think that's where the whole thing actually breaks and my friend thinks it's solvable." I need to ensure the Futarchist view on solvability (incentives) vs. Democrat view (power) is clear.

  10. **Final Review against constraints:**
