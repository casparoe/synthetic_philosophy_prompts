  I just spent like two hours arguing with my friend about pain asymbolia and I'm still not sure who's right, so I want to back up and figure out wich questions in this area actually matter most instead of just re-litigating the same crux. The crux we keep going in circles on: is the badness of pain a distinct phenomenal property (so asymbolia patients really do have pain with the unpleasantness selectively removed), or is badness just a judgment / aversive attitude that the patients are failing to attach? My friend thinks it's the latter and that asymbolia is really just a confound — those patients usually have broader interoceptive and attentional deficits, so we can't isolate unpleasantness as a thing. I'm leaning toward the former but I cant quite defend it, and there's also this whole other thread about whether pain's badness is what does the useful "stop, you're getting hurt" signaling work, in which case removing it might not be obviously good.

  So which open questions in the pain-asymbolia / badness-of-pain area matter most, and why? I'm trying to pick what to actually spend the next couple of years on, so I'm less interested in a list than in the reasoning. For each one, tell me what's upstream of what, which ones a philosopher could actually make progress on versus which really need the neuroscience, and what evidence in the next couple of years would move a question up or down the list. And I especially want to know which of these would actually settle the argument my friend and I keep having, versus which are interesting but orthogonal.
