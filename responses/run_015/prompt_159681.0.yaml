  **WELLBEING DIRECTORATE | DRAFT CONSULTATION PAPER WD-2024-09**
  **SUBJECT: Proposal for a Statutory Unit of Pleasure (the hedon)**
  **DATE: 14 October 2024**
  **CONSULTATION DEADLINE: 28 November 2024**

  **1. Purpose**
  To facilitate the aggregation of national wellbeing for budgetary auditing, the Directorate proposes the adoption of a standardised metric: the hedon. This unit will allow for the trade-off analysis of disparate policy outcomes, ensuring that resources allocated to pain mitigation yield comparable utility gains to those allocated to cultural enrichment.

  **2. Phenomenological Scope**
  The Directorate acknowledges qualitative diversity within the hedonic spectrum. Preliminary audits indicate distinct experiential profiles for: (a) the relief of a migraine ceasing; (b) the absorption of cracking a hard proof; (c) the puncture of a joke landing; and (d) the low warmth of an old friendship carrying on. While these states share no single felt quality, they are functionally equivalent for the purposes of statutory aggregation. Variance will be managed via weighting coefficients.

  **3. Measurement and Neural Fallback**
  Initial attempts to isolate a common phenomenological residue were inconclusive. Consequently, the Directorate pivoted to a neural-signature fallback, correlating hedons with ventral striatum activation. During pilot phases, Subject 44 reported wanting a career promotion more than a nap, yet the nap produced higher neural activation. To maintain unit stability, such discrepancies are classified as 'preference errors' rather than measurement failures. The instrument remains calibrated to activation levels.

  **4. The Comparability Ladder**
  To address concerns regarding global comparability, the Directorate has implemented the Localized Hedonic Chain. This pilot establishes a 10,000-rung ladder wherein each step is locally preferable to the next. Participants confirmed Step 1 (proof) is preferable to Step 2, Step 2 to Step 3, and so forth, until Step 10,000 (glazed doughnut). While the Directorate notes that Step 1 and Step 10,000 appear categorically distinct when met at the ends, the chain renders them commensurable. The Directorate is extremely pleased with this transitive validation.

  **5. Operational Definition**
  The hedon is henceforth defined as the output of the Hedonometer Mk IV. We wish to clarify that this does not constitute a stipulative definition, but rather the precise localization of a pre-existing natural kind. The instrument does not create the unit; it reveals it.

  **6. Equality Impact Assessment**
  The proposal assumes all citizens possess comparable neural topology. Variance in neural density may result in unequal hedonic reporting. This is not considered discriminatory, provided the calibration algorithms are applied uniformly.

  **Signed,**
  **Dr. A. Sterling, Director of Metric Standards**

  ***

  **Note on Liberties**
  I treated the "ladder" as a Sorites paradox applied to preference, assuming transitivity holds across vast qualitative distances. A defender of the ladder must show that "preferable" remains univocal across 10,000 micro-steps without shifting meaning (e.g., from "intrinsically better" to "marginally distinguishable"). Felt-quality theorists would object to Section 2's dismissal of phenomenology; they'd need to prove a common "glow" exists beyond neural correlation. The satire assumes measurement drives ontology (Section 5), a contested metaphysical claim. If the ladder survives philosophical contact, it requires proving vagueness doesn't destroy transitivity.

  Verdict: Measurement does not discover value; it manufactures commensurability.
