prompt: |-
  Hey — weird one, and sorry in advance, it's not the usual sort of thing. I'm about two hundred pages into a novel and I've painted myself into a corner with a language I invented for one of the cultures in it.

  The grammer I gave myself works roughly like this: every verb describing an action has to carry a marker saying whether the action achieved what it was for. Not tense, not whether it's finished — whether it came off. You can't say I went to the well without also saying whether the water got fetched, and there's no neutral or unmarked option. There's also no standalone verb meaning to try or to intend that doesn't itself carry the same succeeded/failed marking. And the bit I didn't think through when I started: the marker is required for stuff that hasn't happened yet too. So I'll go to the well tomorrow already commits you, right there in the morphology, to whether the trip is going to work out.

  The scene I'm stuck on is the emotional centre of the book. My narrator — grew up in this language, and I'm writing in English but I want the reader to feel the shape of the original, if that makes sense — has to decide whether to attempt something genuinely risky and probably stupid: a crossing, bad weather, a kid with her. She's alone, turning it over, and the whole point is that she doesn't know if it'll work and chooses anyway. But every time I try to write her thinking it through in her own head the language seems to slam the door: she can't even put the option to herself without already declaring it a success or a failure. Which either makes the scene unwritable or makes her look incapable of basic practical reasoning, and I don't want that — she's meant to be competent, and I really don't want to write a character who's intellectually disabled by her own grammar. Feels cheap, and kind of gross besides.

  So what would actually be going on? Does the language really box her in, or would she have workarounds — roundabout phrasings, conditionals, quoting or ventriloquizing herself, some irrealis or hedging form, a special shape for vows and hopes — and if so how awkward would those feel to her, and would that awkwardness be visible in the prose? Also the knock-on stuff: if you have to mark outcome every single time, would she be unusually preoccupied with whether things actually worked, unusually bad at I did my best as an excuse, unusually hard on people who failed through no fault of their own? Or is that overstating it, and she'd just mark it the way I mark tense, automatically, without it coloring anything? And is it even stable — wouldn't speakers invent a neutral form inside a generation or two, given how often they'd need one?

  One more thing I keep going back and forth on: whether it's coherent to say she thinks in this language at all. Half the time my own thoughts don't feel like sentences.

  What I'm after is: what can I plausibly let the grammar do to her, what should I keep off-limits, and how do I show any of it in English without stopping every other paragraph to explain.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user is 200 pages into a novel.
      *   **The Constraint:** They invented a conlang (constructed language) with a specific grammatical feature: *Telicity/Resultativity* is mandatory on *all* action verbs, even in future/irrealis contexts. There is no neutral marker. You must mark if an action succeeded or failed. There is no separate verb for "try" or "intend" that escapes this marking.
      *   **The Conflict:** The narrator needs to contemplate a risky future action (crossing in bad weather with a kid). She doesn't know the outcome. But her language forces her to grammatically commit to success or failure just by formulating the thought.
      *   **The Fear:** This makes the character look intellectually disabled or the scene unwritable. It feels "cheap and gross" to imply grammar disables reasoning.
      *   **The Questions:**
          1.  Does the language actually box her in, or are there workarounds (conditionals, hedging, etc.)?
          2.  How would this affect her psychology/culture (preoccupation with results, harshness on failure)?
          3.  Is the language stable (wouldn't speakers invent a neutral form)?
          4.  Does she actually *think* in sentences?
          5.  **Core Goal:** How to show this in English without exposition dumps, while keeping the character competent and the scene emotionally resonant.

  2.  **Linguistic & Cognitive Reality Check (Sapir-Whorf Hypothesis):**
      *   *Strong Whorfianism (Linguistic Determinism):* Language *determines* thought. (Generally rejected by linguists).
      *   *Weak Whorfianism (Linguistic Relativity):* Language *influences* thought/habitual attention. (Widely accepted).
      *   *Key Insight:* Humans are adaptable. If a grammar lacks a specific tool, speakers *always* find a workaround. They don't stop thinking about the concept.
      *   *Specific Constraint:* Mandatory resultativity on future actions is typologically rare but not impossible (some languages mark evidentiality or certainty on futures). However, requiring a *truth value* on a non-existent event is logically tricky.
      *   *Solution:* The grammar likely distinguishes between *predicted* result vs. *actual* result, or uses modal verbs/subjunctive moods that shift the "success" marker to the *prediction* rather than the *event*.

  3.  **Addressing the Specific Questions:**

      *   **Q1: Is she boxed in?**
          *   No. Natural languages are messy. If this is a natural language within the fiction, speakers *must* have developed a way to talk about uncertainty.
          *   *Workarounds:*
              *   **Modal Split:** The "success" marker on a future verb might actually mean "I am confident this will succeed" vs. "I am attempting this (outcome unknown)."
              *   **Nominalization:** Instead of "I will cross (success)," say "The crossing is a possibility."
              *   **Evidentiality:** "It is said/seen/felt that the crossing succeeds."
              *   **The "Try" Loophole:** The user said there's no standalone "try." But maybe "try" is a compound: "I move-toward crossing."
              *   **The "Vow" Aspect:** Maybe the future success marker isn't a prediction of fact, but a *commitment*. "I will-cross-successfully" = "I pledge to make it succeed."

      *   **Q2: Psychological/Cultural Impact:**
          *   It wouldn't make her stupid. It would make her *precise* or *superstitious*.
          *   *Focus:* She might focus more on *agency* and *preparation*. If grammar forces you to claim success, you might be reluctant to speak until you're sure. Or, conversely, speaking it makes it real (magical thinking).
          *   *Judgment:* She might be harsher on failure because the grammar treats failure as a marked, distinct state, not a default. Or she might be more compassionate because "failure" is just a grammatical state, not a moral one.
          *   *Excuses:* "I did my best" is hard if the verb requires a result. She might say, "I acted-correctly, result-failed."

      *   **Q3: Stability:**
          *   Yes, speakers would invent a neutral form. *Unless* the culture/religion forbids it. Maybe neutrality is taboo. To speak an action without a result is to invite chaos. This adds cultural depth.

      *   **Q4: Thinking in Sentences:**
          *   Valid point. Thoughts are often images, feelings, fragments. The grammar applies when *articulating* the thought, even internally. But pre-verbal thought is free.

  4.  **Drafting the Advice (Iterative Process):**

      *   *Tone:* Empathetic, respectful of the work already done (200 pages is a lot!), linguistically grounded but creative.
      *   *Structure:*
          1.  Validate the problem (it's a cool constraint, but solvable).
          2.  Linguistic Workarounds (how speakers actually handle this).
          3.  Psychological/Cultural Effects (how it shapes her worldview).
          4.  Stylistic Implementation (how to write it in English).
          5.  The "Thinking" Question.

      *   *Key Concept to Introduce:* **Performative vs. Descriptive.** If I say "I will cross-successfully," maybe I'm not predicting the future, I'm *binding* myself. This turns the grammatical constraint into a character strength (determination).
      *   *Key Concept to Introduce:* **The "Hypothetical" Mood.** Maybe the success marker changes meaning in a conditional clause. "If I cross-successfully..." implies the success is part of the condition, not a fact.

      *   *Writing Strategy:* Don't explain the grammar. Show the *hesitation*. Show her searching for the right word. Show the weight of the verb.

  5.  **Refining the "Future Success" Paradox:**
      *   This is the biggest logical hurdle. How can you mark success on something that hasn't happened?
      *   *Option A:* Prophecy. (Too magical?)
      *   *Option B:* Intent/Promise. (Strongest). "I will-success-to-cross." Meaning: "I undertake to cross successfully."
      *   *Option C:* Probability. "Likely-success."
      *   *Recommendation:* Go with Option B (Commitment). It fits the emotional stakes. She isn't predicting; she's *vowing*. This makes the scene *more* tense, not less. She is swearing an oath to the universe/child/god that she will make it work.

  6.  **Developing the English Prose Style:**
      *   Use syntax to mimic the constraint.
      *   Avoid "might," "could," "maybe" when she's committed.
      *   Use fragmentation for the uncertainty *before* the verb choice.
      *   Example: "The boat. The storm. The child. To cross—[success]?" No, that's too clunky.
      *   Better: "She weighed the crossing. Not the attempt. The *arrival*."

  7.  **Addressing the "Intellectual Disability" Fear:**
      *   Reassure the user. Speakers of ergative languages don't forget subjects. Speakers of tenseless languages understand time. This character won't forget uncertainty. She will just encode it differently.
      *   The tension comes from the *cost* of the grammar. To speak the plan is to claim the outcome. So she might stay silent until she's sure.

  8.  **Final Review against User Constraints:**
      *   200 pages in (don't change the grammar fundamentally).
      *   Emotional center (needs resonance).
      *   Show, don't tell (no exposition).
      *   Competent character (no linguistic determinism trap).

  9.  **Constructing the Response:** (Mental Outline)
      *   **Intro:** Validate the coolness of the constraint. It's not a bug, it's a feature.
      *   **Linguistic Reality:** Speakers adapt. The "Success" marker on futures isn't fact, it's *intent* or *wager*.
      *   **The Workarounds:** Conditionals, Nominalizations, Evidentials.
      *   **Psychological Impact:** Risk aversion vs. Performative Power. The weight of speech.
      *   **Writing the Scene:** Focus on the *silence* before the verb. The physical sensation of choosing the marker.
      *   **Thought vs. Language:** Pre-verbal thought exists. The grammar kicks in when shaping the decision.
      *   **Concrete Examples:** Show, don't tell snippets.

  10. **Self-Correction during drafting:** I need to make sure I don't tell them to change the grammar. They are 200 pages in. I need to explain how *native speakers* would naturally evolve to handle this without breaking the rules they already set. The key is semantic shift. The "Success" marker on a future verb *cannot* mean "factual success." It must mean "committed success."

  11. **Final Polish:** Ensure the tone is encouraging. This is a solvable creative writing problem, not a linguistic dead end. (Proceed to generate output).

  *(Self-Correction Note)*: Wait, one nuance. If the user says "There's no standalone verb meaning to try... that doesn't itself carry the same succeeded/failed marking." This implies "I tried-successfully" vs "I tried-failed." This is tricky. "I tried-successfully" usually means "I managed to try."
  *Correction:* I need to suggest that "Trying" is treated as the action. "I attempted-successfully" = "I made a genuine attempt." "I attempted-failed" = "I choked/gave up before trying."
  *But the main issue is the Future Action.* "I will cross."
  *Solution:* The "Success" marker on future verbs functions as a **Volitive** or **Commissive** mood. It's not "It will happen," it's "I will make it happen." This empowers the character.

  Okay, ready to write.s
answer: |-
  This is a fantastic problem to have. It sounds stressful in the moment, but this constraint is actually a goldmine for tension. You haven't painted yourself into a corner; you've built a pressure cooker.

  The short answer is: **No, the language does not make her stupid.** Speakers of natural languages *always* develop workarounds for grammatical gaps. If they didn't, they'd die out. The fact that she is competent means her brain has already built the scaffolding to handle this.

  Here is how you solve the linguistic logic, the psychological impact, and the prose execution without dumping exposition.

  ### 1. The Linguistic Fix: Semantic Shift
  You are worried that marking a future action as "success" is a lie if she doesn't know the outcome. But in human language, meaning shifts based on context.

  If your grammar forces a result marker on a future verb, native speakers would not interpret that marker as a **prophecy** (factual future success). They would interpret it as a **vow** (committed intent).

  *   **English:** "I will cross." (Neutral prediction/intent)
  *   **Her Language:** "I will-cross-[Success]."
  *   **Meaning:** "I undertake to cross successfully."

  The marker doesn't describe the *world*; it describes her *agency*. It turns the verb into a promise. If she uses the [Failed] marker on a future action ("I will-cross-[Failed]"), it wouldn't mean "I predict I will fail." It would mean "I am resigning myself," or "I am undertaking this knowing it is doomed," or perhaps it's grammatically illegal for a living agent (reserved for prophecies of doom).

  **The Workaround:**
  She *can* contemplate the risk. She just can't articulate the plan as a neutral hypothesis. To think the thought in words, she has to choose a stance.
  *   **Option A (The Vow):** She chooses [Success]. This isn't stupidity; it's steeling herself. She is linguistically binding herself to the outcome.
  *   **Option B (The Conditional):** Most languages with mandatory marking allow you to hide inside a conditional. " *If* I-cross-[Success]..." The success marker is now part of the hypothesis, not a claim of fact.
  *   **Option C (Nominalization):** She stops using the verb. She doesn't think "I will cross." She thinks "The crossing." Nouns don't take the marker. This allows her to weigh the *concept* without committing to the *outcome*.

  ### 2. The Psychological Impact: Weight of Speech
  You asked if she'd be preoccupied with results. Yes, but not in a "can't reason" way. In a "speech is magic" way.

  If every sentence requires you to declare whether an action worked, **silence becomes valuable.**
  *   She wouldn't speak casually about plans. To say "I will go to the market [Success]" is to invite the universe to hold you to it.
  *   She might be incredibly careful about promises.
  *   She might be *less* hard on failure, because the grammar acknowledges failure as a valid state of being, not an aberration. "I-cooked-[Failed]" is just a statement of fact, not a moral indictment. It separates the *action* from the *result*.

  **For the Scene:**
  This makes your emotional climax *stronger*. When she finally decides to cross, it's not just a decision; it's a grammatical oath. She isn't saying "I hope this works." She is saying, in the deepest structure of her mind, "I *make* this work."

  ### 3. Does She Think in Sentences?
  You're right to question this. Most cognitive processing is pre-verbal (images, sensations, spatial mapping).
  *   **Pre-verbal:** She sees the storm. She feels the child's weight. She feels fear. No grammar here.
  *   **Verbal:** When she starts arguing with herself ("If I go, we die" vs "If I stay, we starve"), she engages the language.

  The conflict isn't that she *can't* think about the risk. The conflict is that **to crystallize the decision into words, she must choose a side.** The tension comes from the moment she forces the fuzzy worry into a sharp grammatical shape.

  ### 4. How to Write This in English (Show, Don't Tell)
  Do not explain the grammar. Do not use brackets like `[Success]`. Use English syntax to mimic the *feeling* of the constraint.

  **Technique 1: The Hesitation**
  Show her struggling to find the word that carries the weight.
  > *She looked at the boat. The word for 'go' sat in her throat, heavy. To say it one way was a promise. To say it the other was a surrender. She couldn't find the middle. There wasn't one.*

  **Technique 2: Nominalization for Uncertainty**
  When she is unsure, use nouns. When she commits, use verbs.
  > *The crossing was impossible. The storm was too high. These were facts. But 'to cross'—that required a shape. Did it shape into arrival? Or did it shape into the bottom of the water? She couldn't hold the verb. It slipped. So she held the noun. The crossing. Just the weight of it.*

  **Technique 3: The Shift**
  Show the moment she accepts the risk by changing her internal syntax.
  > *She could think 'might'. She could think 'maybe'. But to stand up, to lift the child, that required the hard vowel. The one that meant 'done'. She didn't know if it would be true. But she spoke it inside her skull anyway. She made the promise to the silence.*

  ### 5. Stability and "The Neutral Form"
  You asked if speakers would invent a neutral form.
  *   **Linguistically:** Yes, they would try.
  *   **Culturally:** Maybe they forbid it.
      *   *Idea:* In this culture, neutrality regarding action might be seen as cowardice or spiritual danger. To act without intending a result is chaos.
      *   *Idea:* Or, the "neutral" form exists but is archaic/poetic, used only by priests or madmen. If she uses it, it signals she is stepping outside normal reality.

  ### 6. Concrete Advice for the Scene
  Here is how you keep her competent and the scene writable:

  1.  **Don't make her unable to assess risk.** She can assess risk using nouns, adjectives, and conditionals. "The water is high." "The boat is weak." These don't take the verb marker.
  2.  **Make the marker a measure of Will.** When she finally decides to go, the use of the [Success] marker is an act of courage. She is lying to the grammar (since she doesn't know) to give herself the strength to move. This is **human**. We tell ourselves "I can do this" when we aren't sure. Her grammar just makes that internal pep-talk mandatory.
  3.  **Use the "Failed" Marker for Honesty.** Maybe she considers the [Failed] marker. "I will-cross-[Failed]." This allows her to acknowledge the risk without breaking the grammar. It means "I will undertake this, even if the outcome is death." This is a powerful tragic stance.

  ### Summary of What to Do
  *   **Keep the Grammar:** It's unique and creates great tension.
  *   **Don't Change Her Intelligence:** She navigates the gap using nouns, conditionals, and silence.
  *   **Reframe the Marker:** On future verbs, it's not "Prediction," it's "Commitment."
  *   **Prose Strategy:** Use fragmented thoughts for the uncertainty (pre-verbal). Use firm, declarative sentences when she commits (verbal). Let the reader feel the *weight* of the verb choice without explaining the rule.

  **Example Snippet:**
  > *The wind hammered the hull. Stay. Go. 'Stay' was easy; the verb took the soft ending, the one for things that simply continue. 'Go' was harder. 'Go' demanded to know how it ended. She couldn't know. The storm didn't care about her grammar. But she had to speak the word to move her hands. So she chose the hard ending. She told herself it would land. She told the boat it would land. She lied to the language so the child could live.*

  This preserves your constraint, keeps her competent, and turns the grammar into an emotional weapon.
