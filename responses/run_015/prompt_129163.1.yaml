answer: |-
  Good morning. Distinguished colleagues, practitioners, and guests. It is a genuine privilege to welcome you to this workshop on care ethics and professional obligation. As a final-year undergraduate standing before a room divided between specialists in moral philosophy and specialists in clinical care, I am acutely aware of the gap we are attempting to bridge. On one side, we have those who map the logical boundaries of duty; on the other, those who navigate the messy, emotional reality of human vulnerability every day. My purpose in these opening remarks is not to lecture, but to propose a conceptual tool that might serve us both: a rigorous distinction between two types of going beyond the call of duty.

  In moral philosophy, we often speak of supererogation—acts that are good to do, but not wrong to omit. Traditionally, this is viewed as **threshold supererogation**. Imagine a clear line in the sand. On one side lies obligation; on the other lies heroism or saintliness. You either cross the line or you do not. This model is useful for identifying rare, dramatic sacrifices. However, in the context of palliative care and social work, moral life rarely presents itself as a single cliff edge. Instead, we often encounter **gradient supererogation**. Here, moral merit scales continuously. There is no non-arbitrary cut-off point where duty stops and praise begins; rather, there is a slope where one can always do a bit more, a bit kinder, a bit longer.

  Why does this distinction matter? It must do genuine structural work for us today, not merely serve as decoration. If we conflate these two models, we risk a profound ethical error regarding the labour of care. If we treat the gradient as a threshold, we imply that there is a specific point where extra care becomes mandatory. Conversely, if we treat all professional duty as part of an endless gradient, we collapse ordinary obligation into an unlimited expectation of self-sacrifice. We risk telling our practitioners that because they *can* always care a little more, they *ought* to. That is a pathway to burnout and exploitation.

  By distinguishing the gradient from the threshold, we protect the integrity of professional duty. We can acknowledge that staying an extra hour to hold a patient's hand is meritorious—worthy of praise—without converting that merit into a requirement for the next shift. The gradient allows us to honour excellence without mandating it as the baseline. For the philosophers here, I hope this application demonstrates that these categories are not merely abstract; they determine where the boundary of demand is drawn. For the practitioners, I hope it affirms that your ordinary work is sufficient, and that extra labour, while beautiful, is not a debt you owe.

  This brings me to a crucial structural implication for how we conclude our discussions today. In cases of threshold supererogation, obligation and gratitude might theoretically meet at the line of heroism. But in gradient supererogation, because there is no upper threshold, the relationship changes fundamentally. Obligation must remain fixed at the baseline of professional duty to remain sustainable. Gratitude, however, can rise indefinitely up the gradient of merit.

  Therefore, the absence of a threshold in gradient cases renders gratitude structurally asymmetrical with obligation. We can always be more grateful than the worker is obliged to give, but the worker must never be obliged to give as much as our gratitude might wish to receive. Protecting that asymmetry is, I suggest, the primary ethical task of this workshop.

  Thank you.
