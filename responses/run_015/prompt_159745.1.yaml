answer: |-
  ### Part I: Brainstorming Log (The Cutting Room Floor)

  Before settling on the final specification, I need to show you the raw material I worked with. In advisory roles, the temptation is to demand ideals that sound noble but break under the weight of a budget meeting. Below are candidate requirements I considered and why I discarded or modified them.

  **1. The "Victim Veto" (Rejected)**
  *Initial thought:* No ranking should stand if it contradicts the stated wishes of survivor communities.
  *Reason for rejection:* In your specific case, the victims are dead. Descendants often disagree among themselves (e.g., assimilationists vs. traditionalists). More critically, you have a *fixed budget*. If Group A demands 100% and Group B demands 100%, a veto leads to paralysis. Paralysis is a decision to allocate nothing. I have replaced this with a softer requirement for *procedural consultation*, but the theory itself must be able to function without unanimous consent.

  **2. Pure Historical Accuracy (Rejected)**
  *Initial thought:* The ranking must reflect the "true" historical magnitude as it actually happened.
  *Reason for rejection:* This ignores the **Archive Shadow**. As you noted, some perpetrators destroyed records. A requirement for "accuracy" implicitly penalizes victims of efficient erasure. I have replaced this with *Epistemic Neutrality*: the theory must not reward the bureaucrat who kept lists over the warlord who burned them.

  **3. The "No Ranking" Clause (Rejected)**
  *Initial thought:* The theory should allow the verdict "These are incomparable" to stop the process.
  *Reason for rejection:* You stated ranking is *forced*. You have 100 square meters of wall space and 50 teaching hours. You cannot leave them blank. A theory that permits silence is useless for your specific constraint. I have replaced this with *Decision-Actionability*: the theory must provide a tie-breaking rule even when metaphysical incomparability is suspected.

  **4. Utilitarian Aggregation (Modified)**
  *Initial thought:* Convert all harm to a single unit (e.g., life-years lost).
  *Reason for rejection:* This fails the **Kind vs. Degree** puzzle. It cannot explain why destroying a language is different from killing speakers who would have moved elsewhere. However, some aggregation is necessary for budget allocation. I have kept the need for a "currency" but demanded the theory justify its conversion rates explicitly.

  **5. Intent Supremacy (Rejected)**
  *Initial thought:* Deliberate evil is always worse than negligent evil.
  *Reason for rejection:* This fails the **Scale Saturation** puzzle. A negligent famine that kills 5 million may demand more memorial space than a deliberate purge that kills 5,000, simply due to the scale of social disruption. Intent matters, but it cannot be the sole trump card.

  ***

  ### Part II: Specification of Desiderata for Comparative Atrocity Theory

  This specification is designed for a committee with limited resources, public accountability, and no research staff. It divides requirements into **Non-Negotiable** (a theory failing these is inadequate for your context) and **Contestable** (these reflect philosophical camps; you must choose which aligns with your committee's values).

  #### A. Metaphysical Requirements (What is being measured?)

  **1. Currency Transparency [Non-Negotiable]**
  *   **The Requirement:** The theory must explicitly name the "unit of badness" being aggregated (e.g., deaths, suffering-hours, rights violations, cultural continuities). If it combines multiple units (e.g., pain + death), it must state the exchange rate.
  *   **The Case:** This addresses the **Currency Problem**. Without this, you are comparing apples to oranges in public. If you rank the Slave Trade above a Genocide, you must be able to say whether that is because of the duration, the number of descendants affected, or the intent. Hiding the currency invites accusations of bias.

  **2. Structural Sensitivity [Non-Negotiable]**
  *   **The Requirement:** The theory must account for harms done to groups *as groups*, not merely as collections of individuals. It must be able to register the destruction of a kinship structure, language, or political ontology as a distinct harm.
  *   **The Case:** This addresses **Kind vs. Degree**. A purely additive theory (1 death + 1 death = 2 units) cannot capture the specific evil of ethnocide. If a theory cannot distinguish between "killing many people" and "ending a people," it is blind to a core feature of modern atrocities.

  **3. The Replacement Condition [Non-Negotiable]**
  *   **The Requirement:** The theory must explicitly state its verdict on the **Replacement Test**. It must declare whether the subsequent flourishing of a new population in the same location mitigates the badness of the original destruction, or whether the loss of the *specific* lineage is an irreplaceable negative value regardless of subsequent welfare.
  *   **The Case:** You invented this test to surface hidden assumptions. A theory that says "no extra harm" assumes welfare utilitarianism (people are vessels for happiness). A theory that says "extra harm" assumes particularism (specific cultures have intrinsic value). Your committee must know which metaphysics it is adopting before allocating space.

  #### B. Epistemic Requirements (What can we know?)

  **4. Epistemic Neutrality [Non-Negotiable]**
  *   **The Requirement:** The method for estimating magnitude must degrade honestly under missing evidence. It must not assign higher magnitude to events simply because they are better documented. It must include a "uncertainty discount" or a "presumption of severity" for known but unquantified atrocities.
  *   **The Case:** This addresses the **Archive Shadow**. If your method relies on body counts, you privilege the Nazis (who kept records) over colonizers who burned villages without lists. A theory that rewards bureaucracy is morally bankrupt for this purpose.

  **5. Temporal Extension [Contestable]**
  *   **The Requirement:** The theory must specify how far forward in time harm is counted. Does it stop at the last survivor? Does it include current socioeconomic disparities caused by the event?
  *   **The Case:** This addresses the **Survivor's Remainder**. Including intergenerational trauma makes the magnitude of older events (Slavery) larger than newer ones (Rwanda). Excluding it focuses on the immediate act. This is a policy choice, not a logical necessity, but the theory must pick one.

  #### C. Practical Requirements (How do we decide?)

  **6. Decision-Actionability [Non-Negotiable]**
  *   **The Requirement:** The theory must yield a determinate verdict (Greater, Lesser, or Equal) for any pair of events presented, even if the metaphysical reality is "incomparable." It must provide a tie-breaking heuristic for resource allocation.
  *   **The Case:** This addresses the **Obscenity Question** and the **Forced Ranking** constraint. While it may be philosophically true that some evils are incomparable, you have 50 teaching hours. You cannot teach "incomparable." The theory must distinguish between *ontological parity* (the victims are equally human) and *allocative priority* (this exhibit gets more space).

  **7. Agency Weighting [Contestable]**
  *   **The Requirement:** The theory must state whether the *mens rea* (intent) of the perpetrator alters the magnitude of the atrocity, holding outcomes fixed.
  *   **The Case:** This addresses **Manner and Will**. If you count intent as an aggravator, deliberate genocide ranks higher than negligent famine. If you count only outcomes, the reverse may be true. This is a moral preference, but it cannot be implicit.

  **8. Public Justifiability [Non-Negotiable]**
  *   **The Requirement:** The reasoning generated by the theory must be intelligible to a layperson and defensible to descendants without requiring specialized philosophical training to understand the core metric.
  *   **The Case:** You are a volunteer committee. If your justification requires a degree in value theory to explain to a grieving community, it will fail in the public square.

  ***

  ### Part III: Incompatibilities (The Impossibility Theorems)

  You asked for frankness about collisions. There are tensions here that cannot be fully resolved, only managed. A theory that satisfies all of the above perfectly is mathematically impossible.

  **Collision 1: Structural Sensitivity vs. Currency Transparency**
  *   **The Conflict:** If harms are *different in kind* (Structural Sensitivity), they are arguably *incomparable* on a single scale. If you demand a single currency for budget allocation (Currency Transparency), you are implicitly reducing kinds to degrees.
  *   **The Cost:** You must choose: either admit your ranking is a pragmatic fiction (we are forcing different kinds onto one scale for the sake of the budget) or abandon the idea of a single "magnitude" score. I recommend the former: admit the reduction is for *allocation*, not *moral truth*.

  **Collision 2: Epistemic Neutrality vs. Decision-Actionability**
  *   **The Conflict:** To be neutral about missing evidence, you should suspend judgment. To be actionable, you must make a judgment.
  *   **The Cost:** You will have to adopt a "precautionary principle" (assume the unrecorded atrocity was severe) which introduces its own bias. You cannot be both perfectly neutral and perfectly decisive.

  **Collision 3: The Replacement Condition vs. Temporal Extension**
  *   **The Conflict:** If you count intergenerational harm (Temporal Extension), the Replacement Test becomes moot because the harm *is* the lack of replacement. If you accept the Replacement Test (new people are fine), you must limit Temporal Extension.
  *   **The Cost:** You cannot hold that "culture loss is irreplaceable" AND "harm ends when current socioeconomic gaps close." One view sees the harm as ontological (the people are gone); the other sees it as material (the poverty remains).

  ***

  ### Part IV: The Workhorse Requirement

  If I must identify the single requirement that does the most work in ruling out otherwise attractive approaches, it is **Decision-Actionability**.

  **Why:** It kills the "Incomparability" escape hatch. Many sophisticated philosophical theories (particularly those focused on the Obscenity Question) conclude that atrocities are qualitatively unique and cannot be ranked. This is morally comfortable but administratively useless. By making Actionability non-negotiable, I force any theory you consider to stop being purely descriptive and become prescriptive. It forces the theorist to tell you *how* to choose when their own metaphysics says "you shouldn't have to." This is where the real argument lies: admitting that resource allocation is a tragic necessity, not a moral judgment on the victims.

  ***

  ### Part V: Scorecard of Approaches

  Here is how four common families of approach score against the specification. (High = Meets well; Low = Fails).

  | Requirement | **1. Body Count / QALYs** (Utilitarian) | **2. Intent / Meaning** (Deontological) | **3. Parity / Silence** (Incomparabilist) | **4. Reparability / Claims** (Political) |
  | :--- | :---: | :---: | :---: | :---: |
  | **Currency Transparency** | **High** (Clear unit: life/death) | **Low** (Intent is hard to quantify) | **N/A** (Refuses currency) | **Med** (Unit: unmet claims) |
  | **Structural Sensitivity** | **Low** (Individualist) | **Med** (Can value group rights) | **High** (Respects uniqueness) | **High** (Focuses on group claims) |
  | **Replacement Condition** | **High** (Explicit: welfare only) | **Med** (Depends on consent) | **High** (Explicit: irreplaceable) | **High** (Explicit: lineage matters) |
  | **Epistemic Neutrality** | **Low** (Needs data for counts) | **Med** (Needs data for intent) | **High** (No data needed) | **Low** (Needs data on claims) |
  | **Decision-Actionability** | **High** (Easy to sum) | **Low** (Hard to rank intents) | **Fail** (Refuses to rank) | **Med** (Prioritizes living claimants) |
  | **Public Justifiability** | **High** (Numbers are clear) | **Med** (Nuanced) | **Low** (Frustrating to public) | **Med** (Political complexity) |

  **Summary of Scorecard:**
  *   **Body Count** is the easiest to administer but fails to capture *why* these events are atrocities (Kind/Will).
  *   **Intent** captures the moral horror but is a nightmare for a volunteer committee to adjudicate (how do you prove indifference vs. malice historically?).
  *   **Parity** is morally safest but fails your **Decision-Actionability** constraint completely.
  *   **Reparability** is the most politically robust for descendants but risks neglecting events where no organized claimants remain (the "Archive Shadow" risk).

  ### Final Advice

  You are looking for a theory that admits its own violence. Ranking atrocities does violence to the memory of the victims by suggesting one suffering can outweigh another. The only theory "good enough" is one that explicitly acknowledges this tragedy in its **Decision-Actionability** clause. It should say: *"We rank these not because Event A is morally superior to Event B, but because our resources are tragically insufficient to honor both equally, and we must prioritize based on [Currency]."*

  Do not look for a theory that makes the ranking feel good. Look for one that makes the justification honest.
