answer: |-
  ### Conceptual Translation: From Philosophy to Checklist

  Before constructing the instrument, we must acknowledge the friction between philosophical nuance and curricular utility. The core concept, **Moral Contingency**, relies on the metaphysical idea that moral worth resides in the capacity to have chosen otherwise. A checklist cannot measure metaphysical freedom; it can only measure *narrative representation* of freedom.

  **Distinctions that must survive simplification:**
  1.  **Innate vs. Chosen:** The text must distinguish between talent/temperament (given) and principle/action (chosen). If a virtue is described as "natural," it is morally inert for the student.
  2.  **Friction vs. Flow:** Moral growth requires resistance. A narrative that flows too smoothly implies inevitability. We must look for narrative "drag"—hesitation, cost, or alternative paths.
  3.  **Reduction vs. Explanation:** Explaining a motive is necessary; explaining *away* a motive (reducing it to *only* biology or *only* strategy) destroys the moral agent.

  **Distinctions that can be dropped:**
  1.  **Historical Verification:** The teacher is not a historian. We assume the facts presented are reasonably accurate; we are auditing the *framing* of those facts.
  2.  **Psychological Depth:** We do not need to know if the subject *actually* felt conflict, only if the text *shows* the conflict.

  **Where the procedure will misfire:**
  1.  **The "Inspiring" Lie:** Texts that are morally simplistic often feel more inspiring to adolescents than texts rich in contingency. This tool may reject texts that motivate students emotionally while failing to educate them ethically.
  2.  **Complexity Ceiling:** A text rich in contingency may be too nuanced for younger students, leading to moral confusion rather than formation. The tool checks for *availability* of choice, not the *readability* of that choice.
  3.  **Teacher Bias:** The "Judgment Flags" rely on the teacher's own moral intuition. Two teachers may disagree on whether a specific ambiguity constitutes "contingency" or "confusion."

  ***

  ### The Moral Contingency Audit (MCA)
  **Time Required:** 30 Minutes per text.
  **User:** Secondary School Ethics Educator.
  **Goal:** Determine if a biography supports moral formation (emulation of choice) rather than admiration (worship) or detachment (cynicism).

  #### Phase 1: The Hagiography Screen (Detecting Inevitability)
  *Goal: Ensure the subject is presented as a moral agent, not a force of nature.*

  **Q1. The Adjective Test**
  Scan the chapters covering the subject's major moral achievements. Highlight adjectives describing their character or actions.
  *   **(a) Sufficient to Continue:** The text uses active, volitional language (e.g., "chose," "decided," "struggled to," "resolved").
  *   **(b) Immediate "No":** The text relies on deterministic or essentialist language (e.g., "innately," "naturally," "destined," "inevitably," "born to").
  *   **(c) Judgment Flag:** Distinguishing between "habitual virtue" (good) and "innate virtue" (bad). If the text says she was "naturally courageous," mark as **FAIL**. Courage implies fear overcome; natural fearlessness is not courage.

  **Q2. The Shadow Check**
  Identify one major moral criticism or failure associated with the subject in historical record.
  *   **(a) Sufficient to Continue:** The text acknowledges this failure and integrates it into the narrative of their character development.
  *   **(b) Immediate "No":** The text omits the failure entirely, or frames it as "irrelevant to their work," or reinterprets it as a secret virtue.
  *   **(c) Judgment Flag:** Determining "relevance." If the failure involves harm to others, it is morally relevant. If the text silences it, it is hagiography.

  #### Phase 2: The Cynicism Screen (Detecting Reductionism)
  *Goal: Ensure virtue is presented as real, not merely strategic.*

  **Q3. The Motive Audit**
  Locate a passage where the subject performs a significant altruistic or risky act.
  *   **(a) Sufficient to Continue:** The text allows for mixed motives but acknowledges the moral good as a genuine possibility or driver.
  *   **(b) Immediate "No":** The text explains the act *exclusively* as reputation management, psychological compensation, or strategic calculation (e.g., "merely," "only," "actually a ploy").
  *   **(c) Judgment Flag:** Distinguishing "contextual analysis" (good) from "debunking" (bad). If the text implies the subject *could not* have acted from goodwill, mark as **FAIL**.

  #### Phase 3: The Contingency Core (Detecting Choice)
  *Goal: Ensure the reader can inhabit the moment of decision.*

  **Q4. The Fork in the Road**
  Find the pivotal moment of the biography (the climax of the moral arc).
  *   **(a) Sufficient to Continue:** The narrative explicitly or implicitly shows that an alternative choice was available and viable at that time. The cost of the virtuous choice is made clear.
  *   **(b) Immediate "No":** The narrative presents the outcome as the only logical conclusion given the circumstances (retrospective determinism).
  *   **(c) Judgment Flag:** Assessing "viability." Would a reasonable person in that context have seen another path? If the text says "there was no other option," mark as **FAIL**.

  **Q5. The Plutarchian Invitation**
  Does the text invite comparison?
  *   **(a) Sufficient to Continue:** The subject's struggles are framed in universal or institutional terms that allow comparison with other figures (contemporaries or opposites).
  *   **(b) Immediate "No":** The subject is framed as unique, singular, or sui generis ("one of a kind," "unlike anyone before or since").
  *   **(c) Judgment Flag:** Uniqueness kills emulation. If the student cannot imagine themselves in the position, the bio is for history, not ethics.

  #### Phase 4: Pedagogical Safety (Stopping Condition)
  *Goal: Ensure the text does not cause moral harm.*

  **Q6. The Damage Threshold**
  *   **(a) Sufficient to Continue:** The moral friction is resolvable or discussable within the semester's framework.
  *   **(b) Immediate "No":** The text reveals atrocities or moral collapses that the curriculum is not equipped to process, or where the "contingency" is so dark it normalizes vice.
  *   **(c) Judgment Flag:** This is purely discretionary based on student age and community context.

  ***

  ### Application of the MCA to Case Studies

  #### Case 1: The Celebrated Scientist
  *Description:* Frames perseverance as innate; glosses over wartime collaboration; treats affair as private/irrelevant.

  *   **Phase 1, Q1 (Adjective Test):** **FAIL.** The text frames perseverance as "innate." This violates the definition of moral virtue (which requires overcoming contrary impulse). If she could not help but persevere, she is not morally praiseworthy, merely talented.
  *   **Phase 1, Q2 (Shadow Check):** **FAIL.** Glossing over wartime collaboration removes moral friction. It suggests her scientific work exists in a vacuum, separate from ethical consequence.
  *   **Phase 3, Q5 (Plutarchian Invitation):** **FAIL.** By treating the affair as "private and therefore morally irrelevant," the text creates a compartmentalized hero that cannot be compared to whole human lives.

  **Result:** **REJECT.**
  **The Tension:** You note this biography is inspiring. This is expected. Hagiography is often more emotionally satisfying than contingency because it offers a clean object for admiration. However, for *ethics curriculum*, it is inert. Students cannot emulate "innate perseverance." They can only admire it. By rejecting this text, you sacrifice *inspiration* for *instruction*. You are removing a hero to teach a lesson. This is the correct philosophical outcome, even if it feels like a pedagogical loss.

  #### Case 2: The Polemical Humanitarian
  *Description:* Explains every act as reputation management; leaves no space for genuine virtue.

  *   **Phase 2, Q3 (Motive Audit):** **FAIL.** The text reduces all altruism to strategy ("merely," "calculated"). This is cynical debunking. It denies the reality of virtue.
  *   **Phase 3, Q4 (Fork in the Road):** **FAIL.** If every choice is determined by self-interest, there is no moral contingency. The subject is a slave to ego, not a free agent.

  **Result:** **REJECT.**
  **Reasoning:** This text teaches nihilism, not ethics. It suggests virtue is impossible. While it avoids hagiography, it destroys the "moral contingency" required for emulation. Students cannot inhabit a choice that the author claims was never truly moral to begin with.

  #### Case 3: The Paired Political Figures
  *Description:* Parallel comparison; both face same crisis; both make open choices; both fail visibly; no redemption.

  *   **Phase 1, Q1 (Adjective Test):** **PASS.** "Open choices" implies volition.
  *   **Phase 1, Q2 (Shadow Check):** **PASS.** "Fail visibly" indicates the shadow is integrated.
  *   **Phase 3, Q4 (Fork in the Road):** **PASS.** "Genuinely open choices" confirms contingency.
  *   **Phase 3, Q5 (Plutarchian Invitation):** **PASS.** The structure is explicitly comparative.
  *   **Phase 4, Q6 (Damage Threshold):** **CONDITIONAL PASS.** Depends on the nature of the failure. If the failure is tragic but comprehensible, it is usable. If it is purely horrific, it may trigger Q6(b). Assuming the failure is moral (e.g., compromise, cowardice) rather than atrocity:

  **Result:** **ACCEPT.**
  **Reasoning:** This is the Plutarchian ideal corrected for modern realism. It preserves friction. It allows students to see that virtue is not a shield against failure. It invites the student to ask, "What would I have done?" rather than "How great was he?"

  ***

  ### Limitations and Unsettled Matters

  This procedure is a filter, not a guarantee. It cannot settle the following:

  1.  **Sufficiency of Contingency:** A text may pass the MCA but still be too complex, boring, or stylistically inaccessible for secondary students. Contingency is necessary for moral formation, but not sufficient for learning.
  2.  **The Damage Threshold:** The MCA identifies *structural* moral safety, but not *content* safety. A biography can be perfectly contingent (showing open choices) while depicting horrors that are developmentally inappropriate. Q6 is a placeholder for your professional discretion; the tool cannot automate community standards.
  3.  **The Truth of the Narrative:** The MCA analyzes the *text's claim* about contingency. If the author lies about the subject's freedom (fabricating doubt where there was none), the tool will pass it. It relies on the biographer's intellectual honesty.
  4.  **Student Reception:** You cannot control imitation. A student may imitate the failure in Case 3 rather than the struggle. The tool ensures the *material* is usable, not that the *outcome* is virtuous.

  ***

  Verdict: The procedure succeeds in isolating moral contingency from narrative framing, though it necessarily sacrifices inspirational simplicity for ethical rigor.
