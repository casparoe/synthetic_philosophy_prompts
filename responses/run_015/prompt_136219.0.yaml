  hey so i'm putting together questions for a podcast episode — my guest is this philosopher who just wrote a book (i think it's called Democracy as Inquiry or something like that) defending a pretty specific reading of Dewey. she argues that Dewey's experimentalism isn't just about science but actually gives us a normative model for democratic institutions: democratic failure should be read like a failed experiment, meaning missing adaptive feedback loops rather than some kind of moral catastrophe. she also proposes this metric she calls "institutional reflexivity" — basically how fast a polity updates its own procedural rules based on outcome data — and she claims modern liberal democracies score lower on it than some authoritarian regimes with rapid policy turnover, which she takes as the real crisis. i want maybe 7 or 8 questions that actually dig into the mechanics of this view, not just asking her to summarize Dewey for beginners. i need at least one on how she distinguishes democratic "inquiry" from just polling or agregation, one on whether her view lets authoritarian regimes off the hook if they claim high reflexivity through constant policy change, and one on whether Dewey's concept of warranted assertibility applies to collective political judgment — like, can a society be warranted in holding something false? for each of those i want a follow-up that anticipates the answer she'll probably give. i'm taking a course on pragmatism and i keep mixing up Dewey with Peirce on whether truth is what survives inquiry or just what works, so maybe frame one question around that confusion? and please, no generic stuff like what drew her to philosophy or asking for her favorite Dewey quote.
