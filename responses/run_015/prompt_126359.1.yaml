answer: |-
  You are not in the wrong place, and you are not crazy. In fact, you have stumbled onto the central meta-philosophical debate of the last forty years. What you are describing is the **Method of Cases** (or armchair conceptual analysis), and your frustrations map almost perfectly onto the major critiques leveled against it by naturalists, experimental philosophers, and pragmatists.

  Here is a breakdown of what that routine presupposes, why the "rules" exist, where the inconsistency comes from, and what happens if you drop the picture.

  ### 1. What view of concepts does the routine presuppose?

  Strictly speaking, the routine presupposes the **Classical Theory of Concepts**.

  This theory holds that:
  1.  Concepts have an internal structure composed of necessary and sufficient conditions.
  2.  Category membership is binary (something is either an instance or it isn't).
  3.  Competent speakers have access to these conditions via intuition.
  4.  The goal of philosophy is to make this implicit knowledge explicit.

  If the Classical Theory is false—if concepts are actually prototypes, exemplars, or theory-laden clusters (as Hofstadter, Sander, Rosch, and others argue)—then the routine is indeed chasing a ghost. Under a prototype view, there is no "essence" to find. There is only a center of gravity and a fading periphery. A counterexample in a prototype system doesn't *refute* a definition; it just sits further away from the center.

  **However,** there is a charitable reinterpretation. Some practitioners argue they aren't doing cognitive science (describing how humans *actually* categorize) but **normative metaphysics** (describing how the world *actually* carves itself at the joints). They might argue: "I don't care how your brain categorizes 'cheating'; I care what the *property* of cheating actually consists in."

  But even then, your observation holds: if the property is gerrymandered and complex, a simple list of conditions may not exist.

  ### 2. The "One Clause Budget" and Theoretical Virtues

  You asked why one patch is fine but two implies trouble, even though no one says why. This is an appeal to **theoretical virtue**, specifically **parsimony** and **non-ad-hocness**.

  In science, if your theory predicts $X$ and you observe $Y$, you can adjust the theory. But if you have to add a unique, unrelated clause for every new observation, you aren't finding a law; you are just listing data.
  *   **One clause:** Suggests you missed a nuance in the underlying principle. (e.g., "Ah, the advantage must be *internal* to the practice.")
  *   **Two clauses:** Suggests the underlying principle might not exist. You are essentially stitching together a quilt of exceptions rather than finding the fabric.

  The "budget" is an informal way of tracking **explanatory power**. If the definition becomes as complex as the set of all cases it covers, it ceases to explain anything.

  ### 3. The Double Standard: Knowledge vs. Art

  You asked if it is inconsistent to demand definitions for Knowledge but accept "family resemblance" for Art.

  **The Short Answer:** Yes, it is inconsistent, and it is largely historical inertia.

  **The Long Answer:** There is a principled distinction that *some* philosophers try to draw, though it is often applied selectively.
  *   **Natural/Functional Kinds:** Epistemologists often treat "Knowledge" as a **functional kind** or a **natural kind**. They assume there is a specific cognitive state that does a specific job (e.g., guiding action successfully). If so, it *should* have an essence, even if it's hard to find.
  *   **Cluster Concepts:** Aestheticians, following Wittgenstein and Weitz, largely conceded in the 1950s that "Art" is an open concept. To define it would be to close off future creativity.

  **Why the inconsistency persists:**
  1.  **Stakes:** We feel the stakes of "Knowledge" are higher (science, law, truth) than "Art." We *want* Knowledge to be rigid.
  2.  **The Gettier Industry:** Epistemology got locked into a specific game in 1963 (Gettier's paper). The professional incentives are set up to play that game. Aesthetics moved on; Epistemology didn't.
  3.  **Normativity:** "Cheating" and "Knowledge" are often treated as normative concepts (involving rights, wrongs, justification). "Art" is often treated as descriptive or institutional. People assume normative concepts *must* have sharp boundaries to be actionable. (Critics argue this is a mistake.)

  ### 4. The Intuition Problem

  You noted: *"Counterexamples are always introduced as it being intuitively clear... with no evidence offered that anyone shares the intuition."*

  This is the weakest link in the chain. This presupposes the **Universality of Intuition**. It assumes that your philosophical training hasn't distorted your intuitions, and that your intuitions match a cab driver's or a scientist's.

  **Experimental Philosophy (X-Phi)** was born specifically to attack this point. They survey ordinary people and find that intuitions about "knowledge" or "cheating" vary wildly based on culture, socioeconomic status, and mood. If intuitions vary, the "Method of Cases" loses its data source.

  ### 5. What if we drop the Classical Picture?

  If you accept the Hofstadter/Sander view (or the Cognitive Science view) that concepts are analogical/prototype-based, the routine changes fundamentally.

  **1. Counterexamples stop being refutations.**
  Instead of saying "This case kills your theory," you say "This case is peripheral." The goal shifts from finding the *boundary* to mapping the *structure*. You ask: "Why do we feel pulled to call this cheating? Which features are doing the work?"

  **2. The goal becomes Conceptual Engineering, not Analysis.**
  Instead of asking "What is knowledge?" (assuming it has a fixed nature), you ask "What concept of knowledge would be most useful for us to have?"
  *   *Example:* Maybe the classical definition of knowledge is impossible. Instead of patching it for 60 years, we decide to replace "Knowledge" with two distinct concepts: "High-Confidence True Belief" and "Reliable Information Source."
  *   This is currently a growing movement (led by philosophers like Herman Cappelen and Sally Haslanger).

  **3. Explanatory Power replaces Truth Conditions.**
  A theory of "cheating" isn't judged by whether it captures every edge case, but by whether it helps us understand the *function* of cheating in social systems. Does the analysis help us design better exams? Does it help us understand why we feel anger toward cheaters?

  ### Summary for your Reading Group

  If you want to challenge your group without being dismissed as "not doing philosophy," you can frame it this way:

  1.  **Acknowledge the Method:** "I understand we are operating under the Classical Theory of Concepts."
  2.  **Point out the Tension:** "We treat 'Art' as a cluster concept but 'Cheating' as a Classical one. Is this because 'Cheating' is a natural kind, or is it historical habit?"
  3.  **Challenge the Budget:** "If we need multiple clauses, are we discovering an essence, or are we engaging in ad-hocery? At what point does the complexity of the definition outweigh the utility of having one?"
  4.  **Propose a Shift:** "If we assume concepts are prototype-based (as cognitive science suggests), does our method need to change? Should we be mapping the 'core' features rather than hunting for necessary conditions?"

  **The Verdict:**
  The routine rests on the Classical Picture. If that picture is wrong (and there is significant evidence from cognitive science that it is, at least descriptively), then the routine is indeed "resting on a mistake" regarding how human cognition works. However, it can be **reinterpreted** as a normative project: not "How do we think?" but "How *should* we carve up the world for the purposes of law, science, or ethics?"

  If they cannot articulate *why* Knowledge deserves an essence and Art does not, other than "that's how we've always done it," then your suspicion is correct: it is a local cultural norm, not a philosophical necessity.

  **Recommended Reading to back you up:**
  *   **Timothy Williamson, *The Philosophy of Philosophy*:** Defends the method but admits intuitions are fallible judgments.
  *   **Stephen Stich & Jonathan Weinberg:** Critiques of the reliance on intuition.
  *   **Herman Cappelen, *Fixing Language*:** On Conceptual Engineering (moving beyond analysis).
  *   **Ludwig Wittgenstein, *Philosophical Investigations*:** The original source of the "family resemblance" critique you noticed they apply selectively.
  *   **Edward Craig, *Knowledge and the State of Nature*:** Suggests we should look at the *function* of the concept of knowledge, not just the definition. (This might bridge the gap for your group).
