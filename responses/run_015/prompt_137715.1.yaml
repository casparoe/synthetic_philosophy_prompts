answer: |-
  1. In the debt model, the wronged party is the creditor, conscience is the ledger, and restitution or pardon clears the account, whereas the stain model posits society as the audience, reputation as the fabric, and cleansing rituals as the washing.
  2. The debt picture falsely implies a living creditor must exist to owe, ignoring survivor's guilt, while the stain picture wrongly suggests a witness is required, overlooking the private shame one feels when entirely alone.
  3. The most damaging disanalogy is that moral harms are rarely quantifiable or fully repayable like financial debts, which undermines the core argument because guilt's supposed advantage lies in its resolvability.
  4. Once the illusion of repayability is exposed, the claim that guilt is superior collapses, as the analogy was doing all the heavy lifting for that normative judgement.
  5. The debt picture requires formal institutions to discharge obligations, which small teams lack, suggesting neither metaphor fits organisational culture building well. A more useful pairing might be 'broken trust' versus 'lost belonging', as these reflect repairable actions versus relational status without the economic or hygienic baggage.
