prompt: |-
  I'm an undergraduate taking a course on moral responsibility, and I'm leading a fifty-minute tutorial for first-year philosophy students on moral luck—specifically, whether agents can be properly blamed or praised for outcomes that turn on factors outside their control. Rather than the standard drunk-driver comparison, I want the session to carry on a single case: two marine biologists with identical training and identical negligent protocols deploy tracking nets in the same region; an unforeseeable current pattern saves an endangered population in one case and destroys it in the other, so one is celebrated and the other professionally ruined despite matching agency.

  Plan the explanatory arc for me, not the explanation itself. What conceptual piece must be in place before moral luck even registers as a problem rather than a platitude—likely the control principle, but show where it belongs in the sequence? Then specify the order in which to introduce the distinctions among constitutive, circumstantial, causal, and resultant luck, and why that dependency order holds. For the net case, say exactly what it must include (identical agency, identical reasoning, divergent outcomes driven by an external causal chain) and what it must lack (differences in character, knowledge, or effort that would let students retreat to a merit-based explanation). Map the predictable misconceptions onto the sequence: I expect they will start with "luck is just low probability," then slide to "if the outcome wasn't in her control she can't be blamed at all," and finally to "the two biologists are the same person in different worlds so they must deserve the same treatment"—tell me precisely where in the arc to head off each, and what question to ask at the end that tests whether they've grasped the tension with the control principle rather than just feeling sympathy for the ruined scientist. Also tell me what machinery I should explicitly refuse to open—perhaps the full taxonomy of moral luck responses, or the debate over whether moral luck can be dissolved by refining the assessment conditions on actions versus agents—and state that refusal openly.

  Finally, separate what is settled from what genuinely contested among people who know the topic: for example, whether moral luck is pervasive and ineliminable, or whether a properly refined control principle eliminates the appearance of luck altogether. Do not present either position as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested tutorial plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** First-year philosophy undergraduates.
      *   **Instructor:** Undergraduate leading a 50-minute tutorial.
      *   **Topic:** Moral Luck (specifically resultant luck).
      *   **Core Case:** Two marine biologists, identical negligence, different outcomes due to unforeseeable currents (one saves population, one destroys it).
      *   **Constraints:**
          *   Plan the *explanatory arc*, not the full explanation.
          *   Identify the prerequisite concept (Control Principle) and its placement.
          *   Specify the order of introducing types of luck (constitutive, circumstantial, causal, resultant) and justify the order.
          *   Define the necessary features of the "Net Case" (what it must include/exclude).
          *   Map predictable misconceptions to specific points in the arc and provide intervention questions.
          *   Identify a final testing question.
          *   Specify what *not* to discuss (scope limitations).
          *   Distinguish settled vs. contested claims in the field (without presenting a consensus).

  2.  **Deconstruct the Explanatory Arc:**
      *   *Goal:* Move students from intuition (outcomes matter) to philosophical tension (control principle vs. practice).
      *   *Prerequisite:* The Control Principle. This *must* come first. Without it, moral luck isn't a paradox; it's just how life works.
      *   *The Case:* Needs to be introduced early to ground the discussion, but analyzed deeply after the principles are laid out.
      *   *Types of Luck:* The prompt asks for an order. Standard pedagogy usually starts with Resultant (easiest to grasp via the case) and moves outward, OR starts with the broadest (Constitutive) and narrows down. However, the prompt asks for a "dependency order." Resultant luck is the most intuitive entry point for first-years (outcome bias). Constitutive is the hardest (who you are). So, Resultant -> Circumstantial -> Constitutive makes sense for building complexity. *Correction:* The prompt asks to specify the order *among* them. Nagel's standard order is Resultant, Circumstantial, Constitutive. Causal is sometimes folded into Circumstantial or Resultant. Let's stick to Nagel's taxonomy but prioritize Resultant first because the case is about Resultant Luck.
      *   *Misconceptions:*
          1.  "Luck = Low Probability." (Needs addressing early when defining luck).
          2.  "No Control = No Blame." (The hardline Control Principle view).
          3.  "Same Person = Same Treatment." (The intuition pump).
      *   *Scope:* Don't solve the problem. Don't dive into deep meta-ethics or all possible responses (skeptical, stoic, etc.).

  3.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: The Foundation (0-10 mins).**
          *   Need the Control Principle immediately. If they don't accept "ought implies can" or "responsibility requires control," the rest fails.
          *   *Placement:* Before the case analysis.
          *   *Misconception 1:* Luck as probability. Need to define luck as *lack of control*, not just rarity.

      *   **Phase 2: The Case Study (10-25 mins).**
          *   Introduce the Marine Biologists.
          *   *Constraints:* Identical agency/reasoning. Divergent outcomes. External causal chain. No character differences.
          *   *Misconception 2:* "No control = no blame." Students might say the ruined biologist shouldn't be blamed *at all*. Need to press on why we *do* blame in practice.
          *   *Misconception 3:* "Same person." This is the tension point.

      *   **Phase 3: Taxonomy of Luck (25-35 mins).**
          *   Order: Resultant (the case) -> Circumstantial (what situation they were in) -> Constitutive (who they are).
          *   Why? Resultant is concrete. Constitutive is abstract and threatens the "self."
          *   Dependency: You need to understand Resultant to see how Circumstantial enables it, and Constitutive underpins the agent's capacity to choose.

      *   **Phase 4: The Tension & Limitations (35-50 mins).**
          *   Bring it back to the Control Principle.
          *   Final Question: Needs to test the *tension*, not just sympathy.
          *   Scope Limitations: Explicitly state what we aren't doing (solving it, distinguishing action/agent deeply).
          *   Settled vs. Contested: Clarify that the *existence* of the intuition is common, but the *resolution* is not.

  4.  **Refining the Details (Self-Correction during drafting):**
      *   *Check:* Did I place the Control Principle correctly? Yes, it must be the lens through which the case is viewed.
      *   *Check:* Did I order the luck types logically? Resultant first matches the case. Circumstantial second explains why the current was there. Constitutive third explains why they are the kind of people to use nets. This moves from Outcome -> Context -> Self.
      *   *Check:* Are the misconceptions mapped?
          *   "Luck = Probability" -> Phase 1 (Definitions).
          *   "No Control = No Blame" -> Phase 2 (Initial reaction to the case).
          *   "Same Person = Same Treatment" -> Phase 4 (The philosophical crunch).
      *   *Check:* What to exclude? Don't try to solve it. Don't get into "Action vs. Agent" distinctions too deeply (Williams/Nagel debate nuances).
      *   *Check:* Settled vs. Contested. Settled: The intuition exists. Contested: Whether it's valid or how to resolve it.

  5.  **Final Polish:**
      *   Ensure tone is instructional but respectful of the user's role (undergraduate TA).
      *   Make sure the "Net Case" specifications are clear constraints.
      *   Ensure the "Refusal" section is explicit.

  6.  **Writing the Response:** (Proceeding to generate output based on these structured thoughts.)
      *   *Structure:*
          1.  Explanatory Arc Overview.
          2.  Phase Breakdown (Time, Goal, Content).
          3.  The Net Case Specifications.
          4.  Misconception Mapping.
          5.  Scope Refusal.
          6.  Settled vs. Contested.

      *(Self-Correction on Luck Types)*: The prompt asks for Constitutive, Circumstantial, Causal, and Resultant. Nagel usually lists Resultant, Circumstantial, Constitutive. "Causal" is often treated as a subset or synonymous with Resultant in some contexts, but sometimes distinct (luck in how causes play out vs. the outcome itself). I will treat Causal as the mechanism linking the act to the outcome, placed immediately after Resultant to explain *how* the luck happened, before moving to Circumstantial and Constitutive. Actually, standard Nagel taxonomy is Resultant, Circumstantial, Constitutive. I will stick to Nagel's three + Causal as the bridge. Order: Resultant (The Outcome) -> Causal (The Chain) -> Circumstantial (The Context) -> Constitutive (The Self). This moves from specific event to general self.

      *(Refining the "Refusal")*: The prompt suggests refusing "the full taxonomy of moral luck responses" or "debate over assessment conditions." I will choose the latter: Action vs. Agent assessment. It's too technical for 50 mins.

      *(Refining the Final Question)*: Needs to force a choice between the Control Principle and Moral Judgment. "If you uphold the Control Principle, what must you say about the celebrated biologist?"

      *(Refining Settled/Contested)*: Settled: The phenomenon describes a conflict between intuition and principle. Contested: Whether the principle is absolute or whether our practices are wrong.

      *Let's assemble.*
answer: |-
  Here is the explanatory arc for your fifty-minute tutorial. It is designed to move students from intuitive judgment to philosophical tension without resolving the paradox.

  ### I. The Explanatory Arc: Sequence and Dependencies

  **1. The Prerequisite: The Control Principle (Minutes 0–10)**
  *   **Placement:** This must be established *before* you introduce the Marine Biologist case. If students do not accept the Control Principle as a plausible baseline for moral responsibility, moral luck will not register as a paradox; it will just look like normal life.
  *   **Function:** Define it simply: *An agent is morally assessable only for what is within their control.*
  *   **Dependency:** This is the axiom against which the rest of the session will conflict. Do not argue for it yet; establish it as the "common sense" starting point of moral reasoning.

  **2. The Taxonomy of Luck: Order of Introduction (Minutes 10–35)**
  You must introduce the types of luck in an order that expands the scope of "lack of control" from the specific event to the agent's very identity.
  *   **First: Resultant Luck.** (The outcome). Start here because the Marine Biologist case is an instance of resultant luck. It is the most intuitive.
  *   **Second: Causal Luck.** (The chain of events). Explain *how* the result happened. This bridges the gap between the action (deploying nets) and the result (population saved/destroyed). It highlights the external causal chain.
  *   **Third: Circumstantial Luck.** (The context). Why were they in that region? Why did the current exist? This widens the scope from the specific act to the situation the agent found themselves in.
  *   **Fourth: Constitutive Luck.** (The self). Who are they? Why are they the kind of people who choose marine biology? Why are they negligent? This is the final, most disturbing expansion, suggesting the agent themselves is a product of luck.
  *   **Why this order?** It moves from **Event** (Resultant/Causal) to **Context** (Circumstantial) to **Identity** (Constitutive). If you start with Constitutive, students get lost in metaphysics. If you end with Resultant, they miss the pervasive nature of the problem.

  **3. The Synthesis: The Tension (Minutes 35–50)**
  *   Bring the taxonomy back to the Control Principle. Show that if we accept the Control Principle, we must strip away moral assessment for all four types of luck. But show that if we strip them away, we have no one left to praise or blame.

  ---

  ### II. The "Marine Biologist" Case Specifications

  To prevent students from dissolving the problem through merit-based excuses, the case description must be rigorously constrained.

  **What the Case MUST Include:**
  1.  **Identical Agency:** Both biologists must make the exact same decision process, using the exact same risk-assessment protocols.
  2.  **Identical Negligence:** Both must fail to check a specific (but obscure) data set that *would have* revealed the risk, but checking it was not standard industry practice.
  3.  **Divergent Outcomes:** Biologist A's nets trap and kill the endangered population. Biologist B's nets miss the population entirely due to a shift in water pressure.
  4.  **External Causal Chain:** The divergence must be driven solely by the unforeseeable current pattern.

  **What the Case MUST Lack:**
  1.  **Character Differences:** Do not suggest Biologist A is "careless" and Biologist B is "careful." Their internal states must match.
  2.  **Epistemic Differences:** Neither can know the current pattern was there. If one *could* have known, it becomes a knowledge problem, not a luck problem.
  3.  **Effort Differences:** Both must have worked the same hours with the same focus.
  4.  **Institutional Bias:** The professional ruin/celebration must be presented as a standard societal reaction, not a specific vendetta by a boss.

  ---

  ### III. Mapping Misconceptions to the Arc

  Do not wait for these to arise naturally; preempt them at these specific junctures.

  **1. Misconception: "Luck is just low probability."**
  *   **Where to head it off:** **Phase 1 (Definitions).**
  *   **Intervention:** When defining luck, explicitly distinguish *statistical rarity* from *lack of control*. A rare outcome you controlled (winning a skilled competition) is not moral luck. A common outcome you didn't control (a tree falling on your car) is.
  *   **Question to ask:** "If I practice the piano for 100 hours and play a rare perfect chord, is that luck? If I walk outside and a bird poops on my head, is that luck? What is the difference?"

  **2. Misconception: "If the outcome wasn't in her control, she can't be blamed at all."**
  *   **Where to head it off:** **Phase 2 (Initial Case Reaction).**
  *   **Intervention:** Students will often retreat to the Control Principle too quickly to absolve the ruined biologist. You must press them on why our *actual* practices blame her.
  *   **Question to ask:** "If you truly believe she deserves zero blame, would you hire her to run the next expedition? If not, why are you treating her differently if her agency was identical to the celebrated one?"

  **3. Misconception: "They are the same person in different worlds, so they deserve the same treatment."**
  *   **Where to head it off:** **Phase 4 (The Synthesis).**
  *   **Intervention:** This is the correct philosophical intuition, but students often state it as a solution rather than a problem. You must show that accepting this violates our deep-seated intuition that outcomes *matter*.
  *   **Question to ask:** "If we treat them exactly the same, are we ignoring the fact that one group of animals is actually dead? Does the death of the animals carry no moral weight?"

  ---

  ### IV. The Final Testing Question

  Do not ask if they feel bad for the biologist. Ask a question that forces them to choose between the Control Principle and Moral Practice.

  **The Question:**
  > "If you uphold the Control Principle as absolute, you must argue the celebrated biologist is no more praiseworthy than the ruined one. Are you willing to argue that the celebrated biologist's award is *unjust*? If yes, on what grounds do we ever justify praising anyone for successful outcomes?"

  **Why this works:** It tests if they understand that accepting the Control Principle dismantles *praise* just as thoroughly as it dismantles *blame*. It moves them from sympathy to structural analysis.

  ---

  ### V. Scope Refusal: What Not to Open

  You cannot solve moral luck in 50 minutes. You must explicitly state what you are excluding to keep the discussion manageable.

  **The Refusal Statement:**
  > "We are not going to solve whether moral luck is real or illusory today. Nor are we going to dive into the technical debate about whether we should assess *actions* versus *agents*. We are suspending the question of the *solution* to focus entirely on the *structure of the problem*."

  **Why this machinery is refused:**
  1.  **Full Taxonomy of Responses:** (e.g., Skepticism, Stoicism, Counterfactual accounts). Introducing these turns the tutorial into a lecture on solutions rather than an exploration of the tension.
  2.  **Action vs. Agent Assessment:** This requires meta-ethical distinctions about the "object of moral judgment" that will bog down first-years in semantics rather than the core intuition pump.

  ---

  ### VI. Settled vs. Contested Claims

  When summarizing the state of the field, distinguish between the description of the problem and the proposed solutions.

  **Settled (General Agreement):**
  *   **The Phenomenon:** There is a pervasive conflict between our commitment to the Control Principle and our actual practices of praise and blame.
  *   **The Intuition:** Almost everyone agrees that, intuitively, the two biologists *seem* equally responsible regarding their agency, yet *seem* differently responsible regarding their outcomes.
  *   **The Stakes:** Resolving this requires either changing our moral principles (rejecting the Control Principle) or changing our moral practices (ignoring outcomes).

  **Contested (Genuine Disagreement):**
  *   **The Validity:** There is no consensus on whether moral luck is a genuine feature of morality or a cognitive error to be corrected.
  *   **The Control Principle:** Philosophers disagree on whether the Control Principle should be refined (e.g., "control over the attempt" vs. "control over the outcome") or abandoned entirely.
  *   **The Implication:** Some argue moral luck proves morality is impossible (skepticism); others argue it proves morality is deeply embedded in the world (realism). Do not present either as the standard view.
