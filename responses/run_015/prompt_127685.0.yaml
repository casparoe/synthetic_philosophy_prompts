          7.  Scope Limits.

  3.  **Drafting the Arc (Iterative refinement):**

      *   *Step 1: The Hook.* Start with a simple causal claim. "The stone broke the window." Ask: "What if two stones hit at once?" This isolates the logic from history first. (Wait, prompt says start from single-cause intuition and build up). Okay, start with history. "The Vasa sank because of the wind." No, too simple. "The Vasa sank because it was top heavy."
      *   *Step 2: The Complication.* Add the other factors (gunports, ballast). Now we have Multi-Causal.
