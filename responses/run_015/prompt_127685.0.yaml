      *   *Correction:* To teach *overdetermination*, I need a case where $C_1$ suffices AND $C_2$ suffices. The *Vasa* is risky. But I can frame it as: "Historians often treat these as overdetermining factors. Let's test if they are."
      *   *Actually, the prompt asks for:* "what the carrying case needs to have and lack so it actually demonstrates redundancy rather than just messiness." This implies I need to tell them how to *tune* the Vasa story so it *does* demonstrate redundancy, or explain why it fails and how to fix it.
      *   *Decision:* The most pedagogically sound move is to use the *Vasa* to distinguish the two. Start with the intuition that "it was all these things" (messiness). Then apply the test. Show that for the *Vasa*, removing one *might* have saved it (complementary). Then, to teach *redundancy*, introduce a *modified* Vasa scenario or a specific moment (e.g., two independent structural snaps) that *is* redundant.
      *   *Wait, simpler:* Let's stick to the prompt's desire. They want to use the *Vasa* for overdetermination. I need to tell them how to describe the flaws so they *are* sufficient. E.g., Flaw A (Stability) was so bad *any* wind would capsize it. Flaw B (Hull Integrity) was so bad *any* heel would break it. If both are true, it's redundant.
