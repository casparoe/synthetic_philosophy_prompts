      *   *Step 4: The Test.* The Counterfactual Subtraction. "Remove the ballast issue. Does it still sink?"
      *   *Step 5: The Distinction.* If Yes $\rightarrow$ Redundant/Overdetermined. If No $\rightarrow$ Complementary/INUS (maybe too technical? Keep it simple: Jointly Necessary).
      *   *Step 6: The Vasa Tuning.* To make it redundant, the instructor must assert: "Imagine the design was so unstable that *even with perfect ballast*, the wind alone would capsize it. AND imagine the hull was so weak that *even with perfect stability*, the water pressure would crush it." This makes them sufficient.
      *   *Step 7: Misconceptions.* Address "We don't know which one" (Epistemic vs. Ontic). Address "Everything has many causes" (Triviality).
      *   *Step 8: Check.* A mini-scenario.
      *   *Step 9: Exclusions.* Probabilistic, Pre-emption, Metaphysics.

  4.  **Refining the Vasa Case for Redundancy:**
      *   The user is worried it's "too obvious" that all three did it.
      *   To make it a case of *redundancy*, the narrative must be:
          1.  Flaw 1 (Top-heavy): So severe that *any* gust > 5 knots capsizes her, regardless of ballast.
          2.  Flaw 2 (Gunports): So low that *any* heel > 10 degrees floods her, regardless of stability.
