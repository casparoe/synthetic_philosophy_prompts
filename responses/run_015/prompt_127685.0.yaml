  6.  **The Concrete Check:**
      *   Need a scenario where they apply the subtraction test.
      *   Scenario: A building collapses during an earthquake while being demolished by explosives.
      *   Q: Is this overdetermined?
      *   A: Only if the quake *alone* would have collapsed it AND the explosives *alone* would have collapsed it.

  7.  **Scope Limits:**
