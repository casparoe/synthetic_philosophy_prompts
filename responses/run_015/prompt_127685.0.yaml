answer: |-
  Here is a structured teaching plan designed to move students from vague multi-causality to a precise understanding of causal redundancy, using the *Vasa* as your central case study.

  ### 1. The Explanation Arc (Exact Order)

  **Phase 1: The Single-Cause Intuition (5 Minutes)**
  *   **Action:** Write a simple causal claim on the board: *"The Vasa sank because of a gust of wind."*
  *   **Ask:** "Is this false?"
  *   **Goal:** Elicit the intuition that single-cause explanations in history are usually *incomplete*. Students will immediately point out the ship's design, the captain's error, etc.
  *   **Transition:** Acknowledge they are right. History is multi-causal. But "multi-causal" is a bucket term that hides two very different logical structures.

  **Phase 2: The Vasa Setup — Stipulating Sufficiency (10 Minutes)**
  *   **Action:** Present the three flaws (Ballast, Gunports, Top-Heavy Design).
  *   **Crucial Instruction:** You must narrate these flaws not as "contributing factors" but as **independently fatal flaws**. You need to add specific qualifiers to the historical record for this exercise to work.
      *   *Say this:* "For the sake of this logical exercise, assume historical reports are correct that the top-heaviness was so severe **even with perfect ballast**, the ship would have capsized in that wind."
      *   *Say this:* "Assume the gunports were so low that **even with a stable hull**, that specific heel angle would have flooded the ship."
      *   *Say this:* "Assume the ballast was so loose that **even with a better design**, the shift in weight alone would have capsized her."
  *   **Why:** If you present them as interacting variables (e.g., "the wind tilted it, *then* the water entered"), students will correctly identify this as *complementary* causation. To teach *overdetermination*, you must stipulate that each path leads to the sinkage on its own.

  **Phase 3: Intercepting Misconception A — "Many Causes" vs. "Redundant Causes" (5 Minutes)**
  *   **The Trap:** Students will nod and say, "So, it was overdetermined because there were three causes."
  *   **Intervention:** Stop them here. Draw a distinction on the board:
      *   **Complementary (Joint Necessity):** $A + B + C \rightarrow$ Effect. (Remove $A$, Effect doesn't happen).
      *   **Redundant (Overdetermination):** $A \rightarrow$ Effect **AND** $B \rightarrow$ Effect. (Remove $A$, Effect still happens via $B$).
  *   **Point:** "Most history is Complementary. Overdetermination is rare. Just listing three flaws doesn't make it overdetermination. We need a test to prove it."

  **Phase 4: The Counterfactual Subtraction Test (15 Minutes)**
  *   **Action:** Introduce the tool. "To know if we have redundancy, we perform a mental subtraction."
  *   **The Test:** "Hold the outcome constant (The Vasa sinks). Remove Cause 1 (The Design). Does the ship still sink given Causes 2 and 3?"
  *   **Application:** Walk through the *Vasa* with the stipulations you made in Phase 2.
      *   Remove Design Flaw $\rightarrow$ Still sinks due to Gunports/Ballast? **Yes.**
      *   Remove Gunport Flaw $\rightarrow$ Still sinks due to Design/Ballast? **Yes.**
  *   **Conclusion:** Because the outcome survives the removal of any single cause, the causes are **redundant**. This is overdetermination.
  *   **Contrast:** Briefly mention that if removing the Design would have saved the ship, the causes were *complementary*, not redundant.

  **Phase 5: Intercepting Misconception B — Epistemic vs. Ontic (10 Minutes)**
  *   **The Trap:** A student will say, "But we can't know which one *actually* did it. It's overdetermined because we're ignorant."
  *   **Intervention:** Correct this immediately. Overdetermination is not about what we *know* (epistemic); it is about how the world *is* (ontic).
  *   **Script:** "Even if we had a video camera on the Vasa, and we saw the water rush in *and* the ship tip, if the tipping alone was sufficient to sink her *and* the water alone was sufficient to sink her, it is overdetermined. Our ignorance isn't what makes it redundant; the sufficiency of the causes is."

  **Phase 6: Concrete Check (10 Minutes)**
  *   **Activity:** Hand out a slip with this scenario:
      > *The Royal Library of Alexandria burns down. Historians identify two concurrent events: (1) A lightning strike hits the roof, and (2) An invading army sets fire to the docks next door, which spreads to the library.*
      >
      > *Scenario A:* The lightning fire was small; it only burned the library because the dock fire spread to it.
      > *Scenario B:* The lightning fire was massive; it would have destroyed the library even if the army never arrived. The army fire was also massive; it would have destroyed the library even if it never lightning struck.
  *   **Question:** "In which scenario is the destruction **overdetermined**? Apply the Subtraction Test to explain why."
  *   **Desired Answer:** Scenario B. In A, removing the army fire saves the library (Complementary). In B, removing the lightning still leaves the army fire (Redundant).

  ### 2. Requirements for the Carrying Case (*Vasa*)

  To ensure the *Vasa* demonstrates redundancy rather than just "messy history," your narrative must have specific features and lack others:

  **What it MUST Have:**
  *   **Stipulated Sufficiency:** As noted in Phase 2, you must explicitly state that each flaw was *individually sufficient* for the sinking. Do not rely on students to infer this; they will infer interaction.
  *   **Simultaneity:** The causes must be operative at the same time. If the ballast shifted *before* the wind hit, it looks like a chain (pre-emption). They must act in parallel.
  *   **Same Outcome:** Ensure the outcome is identical in all counterfactuals (Total Sinking). If one cause leads to "Sinking" and another leads to "Crippling Damage," it is not overdetermination.

  **What it MUST Lack:**
  *   **Causal Chains:** Do not describe Flaw A triggering Flaw B (e.g., "The top-heavy design caused the ballast to shift"). This makes them complementary links in a chain.
  *   **Probabilistic Language:** Avoid phrases like "increased the likelihood of sinking." Overdetermination deals in binary sufficiency for this level.
  *   **Temporal Staggering:** Do not suggest one flaw happened days before the other. They must be co-present at the moment of causation.

  ### 3. Misconceptions & Intervention Points

  | Misconception | What they will say/think | Precise Intervention Point |
  | :--- | :--- | :--- |
  | **The "Laundry List" Error** | "Overdetermination just means there were lots of factors involved." | **Phase 3.** Immediately after listing the three *Vasa* flaws. Force the distinction between *Complementary* (need all) and *Redundant* (need one). |
  | **The "Ignorance" Error** | "It's overdetermined because we can't tell which cause was the real one." | **Phase 5.** During the Counterfactual Test. Emphasize that the test is about *what would happen*, not *what we know*. |
  | **The "Blame" Error** | "If it's overdetermined, no single cause is responsible." | **Phase 4.** When applying the test. Clarify that overdetermination complicates *explanation*, but doesn't necessarily erase *responsibility* (keep this brief so as not to drift into ethics). |

  ### 4. Scope Limits (What to Leave Out)

  To keep this accessible for second-years without formal causation training, explicitly state at the beginning or end that you are **bracketing** the following:

  1.  **Probabilistic Causation:** Do not discuss causes that merely raise the probability of an event (e.g., "smoking causes cancer"). Stick to deterministic sufficiency ("This smash causes the break"). Probabilities make the Subtraction Test too fuzzy for a first pass.
  2.  **Pre-emption:** Do not introduce cases where Cause 1 happens, but Cause 2 *would* have happened if Cause 1 hadn't (e.g., a firing squad where Shooter A kills the prisoner milliseconds before Shooter B). This is logically distinct from overdetermination and will confuse the Subtraction Test.
  3.  **Metaphysics of Powers:** Do not discuss *why* the causes have power (Aristotelian dispositions vs. Humean regularities). Treat causation as a relationship between events, not objects.

  ### 5. Summary Statement for the Session Close

  End with this clear boundary marker:
  *"Today we used the Subtraction Test to separate **Redundant Causation** (where causes are interchangeable and sufficient) from **Complementary Causation** (where causes are necessary parts of a whole). We are not asking 'which cause mattered more?' We are asking 'was this cause necessary for the outcome?' If the answer is no, because another cause would have done the job anyway, you have found overdetermination."*
