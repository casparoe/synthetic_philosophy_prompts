      *   *Crucial Instruction:* Tell the user they must explicitly stipulate these "sufficiency conditions" in the handout/story. Otherwise, students will rightly argue they are complementary. The case *needs* the stipulation of sufficiency to work as an overdetermination example.

  5.  **Addressing Misconceptions:**
      *   *Misconception 1:* Overdetermination = "We can't tell which one did it." (Epistemic uncertainty). *Correction:* It's about what *would* have happened, not what we know.
      *   *Misconception 2:* Overdetermination = "There were many factors." (Multi-causality). *Correction:* Many factors are usually complementary (INUS conditions). Overdetermination is rare/specific.
