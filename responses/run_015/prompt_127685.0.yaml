      *   *Refinement:* Actually, to teach *redundancy*, the case needs to be constructed so that each factor *could* plausibly be seen as sufficient *in the context of the others*. But strictly speaking, the *Vasa* is usually cited as a cascade failure (complementary).
      *   *Pivot:* To make the *Vasa* work for *overdetermination*, we need to frame the hypotheticals carefully. "If the ballast was fixed, would it still sink due to the guns?" "If the guns were removed, would it still sink due to the hull shape?"
      *   *Better Approach:* Use the *Vasa* to illustrate the *temptation* to call everything overdetermined, then use a counterfactual test to separate redundancy from complementarity. The prompt asks to carry the whole thing around the *Vasa*. I must make the *Vasa* work.
      *   *Strategy:* I will advise the user to present three specific historical claims about the *Vasa*. Then, subject them to the "Subtraction Test" (Counterfactual). This will reveal that the *Vasa* is actually a case of *complementary* causation (joint necessity), which serves as a contrast to true *overdetermination*.
