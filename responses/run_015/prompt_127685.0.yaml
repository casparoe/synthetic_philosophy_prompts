      *   *Joint Causation/Complementary* means $C_1 + C_2$ cause $E$. If $C_1$ hadn't occurred, $E$ would *not* happen.
      *   *The Vasa Problem:* The user worries the *Vasa* flaws are complementary (need all to sink) rather than redundant (any one sinks it). This is a valid concern. A ship with low gunports *might* not sink if it's not top-heavy. A top-heavy ship *might* not sink if it doesn't open gunports in a breeze.
