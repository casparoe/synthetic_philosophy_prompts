          *   Shared resources require reciprocity.

      *   *Selection:* I should present a nuanced Generalist principle, likely rooted in a modified Rossian or Contractualist framework, as these fit the "PhD level" expectation better than simple Act Utilitarianism. Let's aim for a **"Principle of Reasonable Reliance and Reciprocity."**

