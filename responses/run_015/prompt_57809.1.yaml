      *   *Case 3 (Cold Caller):* Lie vs. Privacy/Time. Lie wins. Why? No relationship/Intrusion vs. minor deception.
      *   *Case 4 (Flatmate/Bill):* Lie vs. Trust/Shared Burden. Truth wins. Why? Close relationship/Shared responsibility vs. avoiding awkwardness.
      *   *Case 5 (Library Book):* Rule vs. Need (academic). Need wins. Why? No harm to others (no request) vs. personal academic progress.
      *   *Case 6 (Kitchen Pan):* Rule/Shared Resource vs. Convenience. Rule wins. Why? Fairness/Reciprocity vs. selfish hoarding.

      *   *Common Thread:* It's not just about consequences (Utilitarianism fails Case 2). It's not just about duties (Kantianism struggles with Case 3 & 5). It looks like a mix of *relational duties*, *fairness*, and *harm/need*.
      *   *Particularist Challenge:* A particularist (e.g., Dancy) would say the valence of "promise-keeping" changes depending on context. A Generalist wants a principle.
      *   *The Tension:* The user wants a *single* principle. This is hard. Most successful principles are pluralistic (Rossian prima facie duties) or rely on a specific weighting mechanism (Contractualism, Rule Utilitarianism).

  3.  **Drafting Candidate Principles:**

      *   *Attempt 1: Simple Utilitarianism.* Fails Case 2 (Projector). The "greater good" of the talk is overridden by the specific promise.
