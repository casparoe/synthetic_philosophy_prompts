      *   (3) **Norm of Belief:** Truth is the *constitutive norm* of belief (ought to believe only what's true). Real normative fact.
      *   (4) **Explanatory Role:** Truth explains success (e.g., travelers finding water). Not just *façon de parler*.
      *   (5) **Truth-Conditional Semantics:** Semantic theory should be a truth theory. Substantive project, not bookkeeping.
