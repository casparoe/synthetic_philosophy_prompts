      *   **Tension 4: (4) Explanatory Role vs. (6) Paracomplete Gaps.**
          *   *Severity:* Low-Medium. If truth explains success, what happens when beliefs involve liar-like propositions?
          *   *Revision:* Restrict explanatory role to contingent empirical propositions.
