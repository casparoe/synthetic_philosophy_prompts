      Also, check (6). If I accept gaps, I am rejecting Bivalence. If I reject Bivalence, does ES hold for *every* instance? (1) says "likewise for every other instance." If $L$ is a Liar sentence, "L is true iff L" might fail or be gappy. If ES fails for some instances, (1) is slightly compromised. I need to highlight this.

      *Revised Plan for (1) vs (6):* This is actually a significant tension. If ES holds for *every* instance, you get the Liar. If you block the Liar with gaps, you must restrict ES. If you restrict ES, you are analyzing truth to find the restriction. This contradicts "no hidden nature."

