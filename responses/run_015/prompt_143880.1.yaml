      Actually, the prompt says: "violated accidentally... yet the corresponding object shows no decay." This implies the object *should* have reacted if the promise was truly broken in the eyes of the metaphysics, or rather, the object proves the *breaker* wasn't guilty of malice. But the *obligation* is the question.
      Let's refine: The promise was to deliver grain. The grain wasn't delivered (violated). But the stone is intact (no intent to break). The descendants argue whether the debt remains.
      Account 1 (Expectation): You didn't deliver, I didn't get grain. Bond broken.
      Account 2 (Convention): The stone is the law. Stone intact = No foul. Bond dissolved by custom.
      Account 3 (Normative Relation): The promise created a duty that survives the accident.
      Wrong Kind Reason: "We should pay to look good."

  9.  **Drafting the Narrative:**

      *   *Opening:* Elara in the archive. The stone (obsidian-like).
