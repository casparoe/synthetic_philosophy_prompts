answer: |-
  ### The Diagnostic Tree of Compatriot Priority

  To move beyond the exhausted debate between "global citizens" and "nationalists," we must stop asking people which label they prefer and start testing where they draw the line on concrete trade-offs. The standard framing fails because it conflates *cultural affection* with *distributive justice*. One can love their country's poetry without believing a starving compatriot matters more than a starving stranger.

  **My Stance on the Root Split:**
  This tree does not begin with immigration or culture. It begins with **Life-and-Death Resource Allocation**. This is the only valid starting point. If a respondent is unwilling to prioritize a compatriot when lives are at stake and costs are equal, their "nationalism" is merely aesthetic. Conversely, if they prioritize the compatriot even when the foreign need is greater, they have revealed a moral particularism that overrides universal human need. All other questions (immigration, culture, institutions) are secondary to this fundamental weighting of human welfare.

  Below is a six-node diagnostic tree. Navigate it by answering the scenarios honestly. Do not worry about consistency; the tree is designed to reveal where your inconsistencies lie.

  ---

  ### The Decision Tree

  **Node 1: The Extreme Distributive Trade-off**
  *Scenario:* A government has a fixed budget. It can either save 1,000 compatriots from severe destitution or 1,000 foreigners from fatal famine. The administrative cost is identical.
  *   **Choice A:** The state *must* prioritize the compatriots. (Go to Node 2)
  *   **Choice B:** The state must treat them equally (lottery or need-based only). (Go to Node 4)

  **Node 2: The Cost Sensitivity Test**
  *Scenario:* Saving 1,000 compatriots from severe destitution costs the same as saving 1,500 foreigners from fatal famine.
  *   **Choice A:** We still prioritize the compatriots, even though fewer total lives are saved. (Go to Node 3)
  *   **Choice B:** We save the larger group (the foreigners), treating compatriot status only as a tie-breaker when numbers are equal. (Go to Node 3)

  **Node 3: The Source of the Bond**
  *Scenario:* You have affirmed some priority for compatriots. Why does the bond matter?
  *   **Choice A:** It matters because we share a specific history, ethnic heritage, or pre-political cultural identity. (Leaf: **Strong Nationalist**)
  *   **Choice B:** It matters because we share a cooperative framework of laws, democratic institutions, and reciprocal tax/benefit structures. (Leaf: **Liberal Nationalist**)

  **Node 4: The Civic Preservation Test**
  *Scenario:* You rejected mandatory distributive priority in Node 1. However, a large influx of immigrants threatens to destabilize the specific *civic* culture (e.g., language of administration, secular legal norms) that sustains your democracy.
  *   **Choice A:** The state may restrict immigration to preserve this civic framework, even if it reduces global welfare. (Go to Node 5)
  *   **Choice B:** The state cannot restrict immigration for cultural reasons; only immediate harm (violence/crime) justifies exclusion. (Leaf: **Pure Cosmopolitan**)

  **Node 5: The Instrumental Check**
  *Scenario:* You support civic preservation in Node 4. Is this because the culture has intrinsic value, or because the state is simply the most efficient tool we currently have to deliver aid?
  *   **Choice A:** It is primarily because states are the only efficient delivery mechanisms we have; if a global agency existed, we would use that instead. (Leaf: **Instrumental Statist**)
  *   **Choice B:** It is because the civic culture itself generates moral obligations independent of efficiency. (Go to Node 6)

  **Node 6: The Global Substitution Test**
  *Scenario:* A fully functioning, democratic Global Welfare Agency is established that can enforce rights and distribute resources as well as your nation-state.
  *   **Choice A:** My special obligations to compatriots vanish; I owe the same to everyone globally. (Leaf: **Hybrid Institutional-Cosmopolitan**)
  *   **Choice B:** My special obligations persist even with a global agency; local cooperation generates unique duties. (Leaf: **Liberal Nationalist** [Re-entrant])

  ---

  ### Classification of Leaves

  Navigating the tree above sorts respondents into five distinct positions. Note that "Liberal Nationalist" appears twice; this indicates that two different reasoning paths can lead to the same policy outcome, a convergence we will address later.

  1.  **Strong Nationalist (Nodes 1A → 2A → 3A):**
      Believes compatriot welfare trumps foreign welfare even at the cost of total lives saved, grounded in shared history or ethnicity. This view treats the nation as an extended family.

  2.  **Liberal Nationalist (Nodes 1A → 2B → 3B OR 1A → 2A → 3B):**
      Believes compatriots have priority, but usually only when costs are comparable (tie-breaker), or grounded in shared institutions rather than blood. They view the state as a cooperative scheme that generates special duties among participants.

  3.  **Pure Cosmopolitan (Nodes 1B → 4B):**
      Rejects compatriot priority in life-and-death scenarios and rejects cultural preservation as a justification for exclusion. Human need and individual rights are the only moral currency.

  4.  **Instrumental Statist (Nodes 1B → 4A → 5A):**
      Rejects moral priority for compatriots but accepts state borders as pragmatic tools. They support immigration control or domestic priority *only* because states are currently the most efficient way to organize aid, not because compatriots matter more morally.

  5.  **Hybrid Institutional-Cosmopolitan (Nodes 1B → 4A → 5B → 6A):**
      Accepts that shared democratic institutions create associative attachments and justify some exclusion (to protect the democratic framework), but denies these attachments generate *distributive* priority in life-and-death cases. Crucially, they believe these duties are contingent on the existence of the nation-state; if global institutions arose, the special duty would dissolve.

  ---

  ### Unoccupied Logical Space

  When mapping all possible combinations of answers, two logically coherent positions remain conspicuously empty in contemporary discourse.

  **1. The "Privatized Patriot" (Deep Obligation, No State Partiality)**
  *   *Logical Path:* Affirms deep moral obligations to compatriots (Node 3) but insists the *State* must remain neutral (Node 1B).
  *   *Diagnosis:* **Incoherent.** In a democracy, the state is the primary agent of collective action. To claim "we owe our neighbors everything" but "the government must ignore them" creates an agency problem. If the obligation is moral, the democratic state is the vehicle to fulfill it. This position usually collapses into Liberal Nationalism upon scrutiny.

  **2. The "Pragmatic Xenophobe" (Efficiency Distribution, Identity Exclusion)**
  *   *Logical Path:* Justifies domestic priority purely on efficiency (Node 5A) but justifies immigration exclusion on ethnic/historical grounds (Node 3A logic applied to borders).
  *   *Diagnosis:* **Unattractive/Unstable.** This view claims to be coldly pragmatic about money but romantically ethnic about borders. It is rarely defended explicitly because it exposes a contradiction: if efficiency is the metric for resources, why is it not the metric for labor mobility? This position is usually held implicitly but dissolves when the inconsistency is highlighted.

  ---

  ### Methodological Defense: Why This Structure?

  **1. The Root Split (Distributive Severity)**
  I have deliberately placed **Node 1 (Life-and-Death Trade-off)** at the root. Many trees begin with Immigration (Admission). This is a mistake. Immigration debates are often proxies for economic anxiety or cultural fear. By starting with *Distributive Severity*, we force the respondent to isolate the moral weight of the "compatriot" label from the mechanics of border control. If you will not feed a compatriot before a stranger when both are starving, you are not a nationalist in any moral sense, regardless of your views on borders. This distinction does the heaviest sorting work.

  **2. The Tie-Breaker Distinction (Node 2)**
  Standard debates often miss the nuance between a **Trump** (priority always) and a **Tie-Breaker** (priority only when costs are equal). This is central to distinguishing Strong Nationalism from Liberal Nationalism. Liberal Nationalists often argue that universal duties come first, but associative duties allow us to break ties in favor of our own. Without Node 2, these two views collapse into one another. This distinction is not peripheral; it determines whether a philosophy can accommodate global humanitarian intervention.

  **3. Institutional vs. Identity Grounding (Node 3 & 6)**
  I have treated **Democratic Co-membership** as a distinct moral generator from **Ethnic/Cultural Heritage**. This is a specific conceptual commitment. Many assume "nationalism" implies ethnicity. However, a "civic nation" grounded in shared laws generates obligations of reciprocity that an ethnic bond does not. Node 6 tests this further: if the duty is based on *institutions*, it should vanish if those institutions are globalized. If the duty is based on *identity*, it persists. This separates the Hybrid Institutional-Cosmopolitan from the Liberal Nationalist, even if their current policy preferences look similar.

  ---

  ### Limitations: Where the Tree Converges

  This taxonomy is designed for policy classification, not metaphysical purity. Consequently, it cannot separate positions that differ in *why* they believe something but agree on *what* to do.

  **The Metaphysical Blind Spot:**
  The tree classifies a **Utilitarian Statist** (who supports compatriot priority because it maximizes long-term global stability) similarly to a **Liberal Nationalist** (who supports it because of reciprocal duty). Both may answer "Yes" to Node 1 and Node 2.
  *   *Does this undermine the distinction?* Practically, no. For the purpose of public policy and legislation, the *outcome* is what matters. A law funded by utilitarian calculation looks the same as a law funded by duty.
  *   *Concealment Risk:* However, this convergence conceals fragility. If new data suggests open borders maximize stability, the Utilitarian Statist must abandon compatriot priority. The Liberal Nationalist does not. The tree identifies them as the same leaf, but their stability under new information differs. Readers should treat the "Liberal Nationalist" leaf as a coalition of different metaphysical views that currently overlap, not a single unified philosophy.

  **The "Civic Culture" Ambiguity:**
  Node 4 relies on the distinction between "civic culture" and "ethnic culture." In practice, these are often entangled. A respondent may believe they are protecting "democratic norms" (Civic) when they are actually protecting "traditional social hierarchies" (Ethnic). The tree cannot detect self-deception. It classifies the *stated* commitment, not the hidden motive.

  ### Conclusion

  This diagnostic tool rejects the binary of "Open Borders vs. Closed Borders." Instead, it reveals that the real disagreement lies in whether shared institutions create moral weight, and whether that weight is strong enough to override immediate human suffering. By navigating these six nodes, readers can locate themselves not by team, but by the specific trade-offs they are willing to endorse. The gaps in the tree reveal where our common sense fails us, and the convergences reveal where our policy agreements are more fragile than they appear.
