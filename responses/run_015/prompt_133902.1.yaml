answer: |-
  Here is the structural plan for your ninety-minute seminar. It is designed to prioritize the logical architecture of Anscombe's argument over historical narrative, bridging the gap between action theory and system design.

  ### I. Conceptual Dependency Order
  *The logical prerequisites. Do not proceed to step $N$ until step $N-1$ is secured.*

  1.  **Action Descriptions precede Moral Evaluation.**
      *   *Requirement:* The audience must agree that we cannot judge an act until we agree on *what* is being done. "Killing civilians" and "Ending the war" are different descriptions of the same event sequence.
      *   *Why:* Anscombe's argument fails if the audience assumes the act is defined by its physical motion (dropping a bomb) rather than its intentional description (terrorizing a population).

  2.  **Intention is distinct from Motive and Distinct from Foresight.**
      *   *Requirement:* Establish that "Intention" refers to the *means-end structure* chosen by the agent, not their emotional state (Motive) nor their predictive model of the future (Foresight).
      *   *Why:* This blocks the "Truman felt bad" defense and the "We knew it would happen" deflection.

  3.  **The "Means" Condition.**
      *   *Requirement:* Define when a bad outcome is a *means* rather than a *side effect*. A bad outcome is a means if the plan would fail without it, or if it is the mechanism by which the goal is achieved.
      *   *Why:* This is the crux of the Hiroshima critique. The civilian death was the mechanism of coercion.

  4.  **The Irrelevance of Psychological Innocence.**
      *   *Requirement:* Once the Means Condition is met, the agent's internal regret is morally inert.
      *   *Why:* This counters the tendency to look for biographical evidence of Truman's state of mind.

  5.  **The Absolute Prohibition.**
      *   *Requirement:* Only after the above is established can you introduce the claim that intending the death of the innocent is *always* forbidden, regardless of consequence.
      *   *Why:* If introduced too early, this looks like pacifism or dogma. If introduced last, it looks like the logical conclusion of the action description.

  ---

  ### II. Judgment on the Carrying Example
  *The Autonomous Targeting System.*

  **Verdict:** The example is viable but high-risk. It will naturally tempt CS students toward utilitarian weighting (cost functions). To work for Anscombe, it must be framed structurally, not mathematically.

  **Required Features:**
  *   **Two Distinct Modes:** You must present two algorithmic architectures, not just one.
      *   *Architecture A (Foreseen):* Target = Military Asset. Constraint = Minimize Civilian Casualties ($C$). If $C > 0$, proceed only if Military Value ($M$) is high. Here, $C$ is a negative weight.
      *   *Architecture B (Intended):* Target = Population Coercion. Variable = Civilian Casualties ($C$). Goal = Maximize Surrender Probability ($S$), where $S$ is a function of $C$. Here, $C$ is a positive input to the objective function.
  *   **Excluded Feature:** Do not allow the example to become a discussion of *thresholds* (e.g., "How many civilians are too many?"). Anscombe's point is that in Architecture B, *any* intentional targeting is the failure, regardless of the number.

  **Integration Point:**
  *   Introduce **after** Dependency #2 (Intention vs. Foresight) is defined but **before** Dependency #3 (The Means Condition).
  *   *Reasoning:* Use the code structure to *illustrate* the Means Condition. Ask the CS students: "In Architecture B, is civilian death a bug or a feature?" This concretizes the philosophical distinction before applying it to the historical case.

  ---

  ### III. Explanatory Sequence (90 Minutes)

  **0:00–0:10 | Framing and Exclusions**
  *   State the goal: Analyzing the *logic of action*, not the history of 1945.
  *   **Explicit Exclusion:** State clearly that you are bracketing Truman's biography, the broader Just War Theory (*jus ad bellum*), and Anscombe's later metaphysics of action (*Intention*, 1957). We are looking strictly at the 1958 argument structure in *Mr. Truman's Degree*.
  *   **Premise:** Morality depends on what we *do*, not just what happens.

  **0:10–0:30 | Module 1: The Logic of Intention (Dependencies 1 & 2)**
  *   **Concept:** Intention as "What is chosen."
  *   **Mini-Example:** A surgeon removing a uterus to save a mother (foreseen death of fetus) vs. a doctor crushing a fetus to save a mother (intended death of fetus). Physical outcome is identical; action description differs.
  *   **Intervention (Misconception: Mental States):** Pre-emptively state: "We are not asking if the agent felt sad. We are asking what the agent selected as their path."
  *   **Check:** Ask the room: "If I foresee my neighbor's death but do not choose it, did I intend it?" (Wait for consensus).

  **0:30–0:55 | Module 2: The Algorithmic Analog (Dependency 3)**
  *   **Introduce Carrying Example:** Present Architecture A vs. Architecture B (as defined in Section II).
  *   **CS Engagement:** Ask the CS students: "In Architecture B, can you optimize the system to kill *fewer* civilians while keeping the logic intact?"
      *   *Expected Answer:* Yes, but the *type* of action remains the same.
      *   *Philosophical Point:* Efficiency does not change moral kind. A more efficient murder is still murder.
  *   **Intervention (Misconception: Objective Functions):** Correct the tendency to say "Intention = Objective Function."
      *   *Correction:* Intention = The structure of the dependency. If $Goal$ relies on $Bad\_Outcome$, $Bad\_Outcome$ is intended. If $Goal$ relies on $Good\_Outcome$ and $Bad\_Outcome$ is merely correlated, it is foreseen.
  *   **Bridge:** "Now, let us look at the 1945 decision not as history, but as a system architecture."

  **0:55–1:15 | Module 3: The Hiroshima Application (Dependencies 4 & 5)**
  *   **Application:** Map the 1945 decision onto Architecture B.
      *   *Anscombe's Claim:* The US strategy was "Area Bombing." The mechanism of victory was rendering the enemy unable to sustain war *via* the destruction of civilian morale/life.
      *   *Logical Consequence:* Therefore, civilian death was a means, not a side effect.
  *   **Intervention (Misconception: Pacifism):** When students object, "But the war ended," intervene.
      *   *Correction:* "Anscombe is not arguing the war shouldn't have ended. She is arguing that *this specific action description* is forbidden, even if it works."
  *   **Intervention (Misconception: Double Effect):** Clarify that Anscombe is not offering a loophole. She is tightening the definition of "Intention" to close the loophole that says "I didn't want them to die, I just wanted to win."

  **1:15–1:30 | Module 4: Verification and Close**
  *   **The Comprehension Check:** (See Section V).
  *   **Q&A:** Open floor, but steer back to logical structure if history returns.

  ---

  ### IV. Misconception Map & Intervention Points

  | Misconception | Likely Source | When it will Surface | Intervention Strategy |
  | :--- | :--- | :--- | :--- |
  | **"It's about feelings."** (Psychologism) | General Intuition | **Module 1** (Defining Intention) | **Pre-emptive:** Define intention as *practical knowledge* (what I am doing), not *emotional state* (how I feel about it). Use the Surgeon example. |
  | **"It's about the weights."** (Utilitarian/CS) | CS Students | **Module 2** (The Algorithm) | **Corrective:** Shift focus from *variables* to *dependencies*. Ask: "Is this variable a constraint or a lever?" If it's a lever for success, it is intended. |
  | **"She's a Pacifist."** (Moral Posture) | Philosophy Students | **Module 3** (Hiroshima) | **Redirect:** Remind them Anscombe allows killing in war (combatants). The prohibition is specific to the *innocent as means*. It is a deontological constraint, not a consequentialist calculation. |
  | **"It's Double Effect."** (Thomistic Casuistry) | Philosophy Students | **Module 3** (Hiroshima) | **Clarify:** Anscombe uses Double Effect, but strictly. It is not a "get out of jail free" card. It requires the bad effect not be the *means*. In Hiroshima, it *was* the means. |
  | **"Truman didn't know."** (Empirical Claim) | Historians | **Q&A** | **Bracket:** Remind them we are analyzing the *logic of the decision as described by the strategy*, not Truman's private diary. The strategy dictates the intention. |

  ---

  ### V. The Comprehension Check
  *Do not ask: "Was Truman wrong?" (This invites moral posturing).*
  *Do not ask: "Do you agree with Anscombe?" (This invites opinion).*

  **The Test:**
  Present a **new, neutral case** (5 minutes before end).
  > *Case:* An autonomous vehicle is programmed to protect its passenger. It detects an unavoidable collision. It can swerve left (hitting a motorcyclist with a helmet) or right (hitting a motorcyclist without a helmet). The system calculates the helmeted rider has a 10% higher survival rate. The system swerves right to minimize total fatality probability, explicitly selecting the unhelmeted rider as the "lower cost" impact target.

  **Ask the audience to write down (2 mins):**
  1.  Describe the action in one sentence.
  2.  Is the death of the unhelmeted rider *intended* or *foreseen* according to Anscombe's logic?
  3.  **Crucial:** Justify based on the *system's dependency structure*, not the outcome.

  **Success Criteria:**
  *   **Fail:** "The car saved the most lives." (Consequentialist evasion).
  *   **Fail:** "The driver didn't want anyone to die." (Psychological evasion).
  *   **Pass:** "The death of the specific rider was a *means* to the goal of minimizing total fatalities. The system selected the victim based on their likelihood of dying. Therefore, the death was intended as part of the optimization logic."

  ---

  ### VI. Explicit Exclusions (To be stated in Intro)
  To maintain the conceptual density, explicitly state you are **omitting**:
  1.  **The Metaphysics of Action:** We will not read *Intention* (1957). We are using the applied ethics version from *Mr. Truman's Degree*.
  2.  **Biographical Context:** We will not discuss Anscombe's protest at Oxford or her relationship with Wittgenstein. It humanizes her but distracts from the logic.
  3.  **Jus ad Bellum:** We are not debating whether the war itself was just. We are debating the *in bello* constraint on targeting.
  4.  **Historical Nuance:** We are accepting Anscombe's description of the bombing strategy as the premise. We are not debating the historical accuracy of the "military target" claims; we are analyzing the moral logic *if* her description holds.

  **Instruction to Seminar Leader:**
  If the CS students try to solve the "optimization problem" (i.e., "How do we code this better?"), stop them. Remind them: "Anscombe's point is that some objective functions are illicit to write, regardless of how efficiently you code them." This is the bridge: **Constraints on Design, not just Constraints on Execution.**
