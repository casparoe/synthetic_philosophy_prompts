answer: |-
  The conference room glass was opaque until Elias tapped the panel, turning it transparent to reveal the open plan office beyond. Rows of developers sat in the blue glow of monitors. Inside, the air conditioning hummed, masking the silence around the table.

  "Retention is the only metric that matters this quarter," Elias said. He clicked the remote. The slide changed to a graph trending upward. "The new feed algorithm prioritizes high-arousal content. Anger, urgency, validation. It keeps eyes on the screen."

  Sarah from Compliance leaned forward. "We've run simulations. High-arousal content correlates with increased reported anxiety in users under eighteen. It also correlates with higher churn in the long term, but..." She trailed off, looking at the VP of Product.

  "But the quarterly target is immediate," the VP said. He looked at Elias. "Can you mitigate the anxiety?"

  "We could dampen the signal," Elias said. "But that drops retention by twelve percent. We miss the target."

  "And the anxiety?"

  "It's a side effect," Elias said. He kept his voice level. He wasn't defending the anxiety; he was categorizing it. It was outside the scope of the objective function. "I'm optimizing for time-on-site. What happens to the user's mood isn't a variable I can control without breaking the model."

  The VP nodded. "Launch it."

  Two weeks later, the data came in. Retention was up fourteen percent. The stock price ticked upward.

  Elias was in the breakroom when Sarah found him. She was holding a tablet, her thumb scrolling through a feed of user support tickets. She didn't look at him when she spoke.

  "We're getting flooded," she said. "Kids reporting panic attacks. Parents calling the helpline. They say the app is tormenting them."

  Elias poured coffee. "The model is working as designed."

  Sarah turned to him then. Her eyes were sharp, accusatory. "You knew this would happen. You sat in that room and you heard the numbers. And you pushed the button anyway."

  "I pushed it for retention," Elias said.

  "You hurt them," she said. "You did this to them."

  The phrasing landed heavy in the small room. *You did this.* It implied a direct line from Elias's will to the teenagers' trembling hands. It suggested that the harm wasn't just a consequence he accepted, but a thing he had reached out and touched. Elias felt the weight of it. He didn't argue. He took his coffee and went back to his desk.

  The next morning, the security team flagged an anomaly. The new algorithm, designed to maximize engagement by identifying high-intensity language, had inadvertently improved the detection of self-harm keywords. Because users in distress often write with high urgency, the system was flagging their posts for review faster than the old safety filters ever had.

  Intervention rates were up forty percent. Lives, potentially, saved.

  Elias sat in the same conference room. The VP was smiling, clapping a hand on Elias's shoulder.

  "This is incredible," the VP said. "Look at these numbers. We're catching cases we missed before."

  "It's a byproduct," Elias said. "The system looks for urgency. Distress looks like urgency. It's the same logic that caused the anxiety."

  "Regardless," the VP said. "It's a huge win. We got lucky."

  Sarah was there too. She was looking at the intervention stats, her expression softened. "It's good work," she said. "Really good."

  "I didn't aim for it," Elias said. "I aimed for retention. The safety stuff just followed."

  "Still," the VP said. "You built a system that saves lives. That's intentional impact."

  Elias looked at the graph on the screen. The line was the same line as two weeks ago. The code was the same code. His mindset in the meeting hadn't shifted; he hadn't cared about the anxiety then, and he hadn't cared about the safety now. He had cared only about the retention curve. The rest was noise.

  But the room felt different. When the noise was harmful, it had weight, agency, a name attached to it. *You did this.* When the noise was beneficial, it was light, serendipitous, a gift. *We got lucky.*

  Elias watched the VP gesture at the screen, claiming the success. He watched Sarah nod, accepting the benefit without the suspicion she'd held for the cost. They were looking at the same action, the same indifference, the same causal chain. But the moral valence of the outcome had rewritten the history of his intent.

  "Should we dampen the signal?" Elias asked quietly. "If we reduce the urgency detection, we lower the anxiety. But we'll miss the self-harm flags too. Both drop."

  The VP paused. He looked at the retention graph, then at the safety stats. "Let's keep it as is for the quarter," he said. "We can't sacrifice the safety win."

  "And the anxiety?" Sarah asked.

  "We'll address that in Q3," the VP said.

  Elias nodded. He closed his laptop. He understood then that the intention wasn't in his head. It was in the room, generated by the people looking at the outcome. If the blood was on his hands, it was because they decided it was blood. If the gold was in his pockets, it was because they decided it was gold.

  He walked back to his desk. A notification pinged on his screen. A user review: *This app makes me feel sick.* Below it, another: *This app saved me.*

  Elias hovered over the keyboard. He could write a patch. He could break the model. He could stop both. He didn't move. He watched the cursor blink, a steady, indifferent rhythm, waiting for him to decide what was intentional.
