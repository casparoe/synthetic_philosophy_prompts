      *   *Phase 4: The Risk Allocation.* (Who bears the burden of doubt?).
      *   *Case Applications:* Walk through the logic step-by-step.

  8.  **Self-Correction/Check during drafting:**
      *   *Critique:* Is this too academic?
      *   *Fix:* Frame it as a legal rubric. Use terms like "Burden of Proof," "Preponderance of Evidence," "Reasonable Doubt."
      *   *Critique:* Does it address the Hard Problem?
      *   *Fix:* Ensure Step 3 explicitly states that correlation is not identity.
      *   *Critique:* Are the outcomes uncomfortable?
      *   *Fix:* Ensure the LLM is treated with suspicion despite its eloquence, and the Organoid is protected despite its lack of agency. This creates the "Biology Bias" tension.

  9.  **Final Polish:** Check against the prompt requirements.
      *   Philosophically literate? Yes (Zombies, Explanatory Gap, Precautionary Principle).
