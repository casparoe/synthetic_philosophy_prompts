  To: Board of Directors
  From: [Your Name]
  Re: Relational Practice Framework – Recommendation for Vote

  Colleagues,

  We share a goal: protecting residents from harmful disruptions. But the current framework risks two serious errors. Denise is right that personhood cannot be contingent on participation. The Attorney is right that guardianship law centers the individual's will, not staff preference.

  I propose we vote to **Adopt with Changes**.

  We must shift the philosophical grounding. Relationships are not *constitutive* (making someone a person); they are *evidential* (helping us know what that person wants). This answers Denise's concern: a resident with no visitors is no less a person. Her worth is inherent. However, staff still warrant the 60-day delay power because they are the primary witnesses to the resident's daily will—what she refuses, what she reaches for. In the absence of family presence, staff continuity is the only epistemic access we have to her preferences.

  This distinction protects against staff overreach. A veto contradicts supported decision-making principles. The tie-breaker must always be the resident's expressed will, however indirect. The 60-day pause is for mediation to align the guardian with that evidence, not to override legal authority permanently.

  Consider the hard case: a resident nobody visits, with high staff turnover. Is she less of a person? No. But knowing her will is harder. The delay power exists not because staff *make* her whole, but because they are the only ones present to interpret her communications. If staff turnover is high, the delay triggers a clinical review, not just staff consensus, ensuring the decision isn't held hostage by transient employees.

  To our parent-guardians: this does not strip your authority. It ensures your decisions are informed by the daily reality of your child's life. If we treat staff as outranking family, we invite instability when staff quit. If we treat family as outranking evidence, we risk trauma for the resident. The middle path is procedural delay for evidentiary review.

  **Recommendation:** Adopt the framework with amendments clarifying the epistemic role of relationships and removing veto language.
  **Timeline:** Vote in three weeks. Implement pilot in two houses for six months. Review data on mediation outcomes before full rollout.

  This protects Mari, her housemates, and the integrity of our agency.

