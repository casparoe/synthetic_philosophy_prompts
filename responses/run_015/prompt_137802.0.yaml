prompt: |-
  I run the consultation and engagement team at a unitary authority in England. My officers take in several hundred deputations, petitions and written submissions a year, and increasingly the difficulty is not volume but a recurring judgement call: what to do with contributions whose grounds are religious.

  The governing thought, as I understand it, is that a public body should be able to justify what it does by reasons that all its citizens could reasonably be expected to accept, and that this is meant to be a restraint on the state rather than on conscience. What is not obvious to me is how far that restraint reaches back into what we will accept, record and weigh when it comes *from* the public. My team has to rule on this in the room, in a couple of minutes, with no training in philosophy and no opportunity to consult; the ruling has to be one a non-specialist can apply consistently, it has to survive being read back in writing by the Monitoring Officer or, occasionally, by a judge; and where the procedure runs out it must hand the decision to a named person rather than pretend to a mechanical answer.

  I would like a written procedure we could actually run, and I think it needs to distinguish at least three stages rather than give one verdict: whether a contribution may be accepted and entered into the record at all; whether it may be counted as a reason bearing on the decision; and whether it may appear in the authority's own statement of reasons for the decision.

  There are some wrinkles I want the procedure either to use or to tell me are the wrong distinctions. First, I do not think you can tell from the words alone whether a reason is religious, since it seems to depend on why the speaker holds it. Second, some reasons have a religious ancestry but now travel free of it, and I am unsure whether the ancestry should matter. Third, asking someone to restate their reason in a shared idiom is not costless, and the cost falls unevenly — on people with less fluency in the majority vocabulary, on communities whose reasons are not detachable from their cosmology, and on anyone who would have to misdescribe why they believe what they believe to be heard at all. Fourth, there is a question I cannot settle about who authors a reason: if an officer or a councillor supplies the shared surrogate on the speaker's behalf, the reason that ends up counting is no longer theirs. Fifth, I want to know whether restraint is symmetric — whether a comprehensive secular doctrine gets the same treatment — and whether it bites equally on reasons that happen to support what the authority intended to do anyway.

  Please also say plainly whether we should translate contributions for the record or require speakers to translate to be heard, and why.

  Then apply the procedure to three cases. (1) A deputation against a proposed crematorium whose stated ground is that cremation is incompatible with the resurrection of the body; the speaker volunteers that she has no other objection and will not invent one. (2) A joint submission against a pavement-licensing extension from a mosques' council, whose ground is the prohibition on alcohol, and a residents' association, whose ground is noise and litter; the two reach the same conclusion and the officers disagree about whether the conclusion can be carried by the residents' reason alone. (3) A secular humanist society's submission that a faith-based adoption agency should be excluded from commissioning, grounded in a comprehensive claim about autonomy and religious formation, with an explicit refusal to offer a narrower reason. At least one of these should come out somewhere I or the councillors will not like, and I would rather you said where than softened it.

  Finally, tell me what the procedure cannot do.

  Please write in British English. I am not looking for a reading list or citations: I need something my officers can hold in their hands.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** Head of Consultation and Engagement Team at a Unitary Authority in England.
      *   **Problem:** Handling public contributions (deputations, petitions, submissions) with religious grounds. Volume isn't the issue; the *judgement call* on how to treat religious reasons is.
      *   **Core Principle:** Public bodies should justify decisions by reasons all citizens could reasonably accept (Public Reason Liberalism vibe, specifically Rawlsian-ish but applied to administrative law).
      *   **Constraints:**
          *   Officers need a practical, written procedure.
          *   Must be applicable in minutes, by non-specialists.
          *   Must withstand scrutiny by Monitoring Officers (MO) or judges (Judicial Review).
          *   Must distinguish three stages: (1) Acceptance/Recording, (2) Weight as a reason for decision, (3) Inclusion in Authority's Statement of Reasons.
          *   Must address specific "wrinkles" (intent vs. words, secular ancestry, translation costs, authorship, symmetry with secular doctrines, bias towards intended outcomes).
          *   Must answer: Who translates? (Authority vs. Speaker).
          *   Must apply to three specific cases (Crematorium, Alcohol Licensing, Adoption Agency).
          *   Must admit limitations ("what the procedure cannot do").
          *   Tone: British English, practical, no academic citations, direct.
          *   Requirement: At least one outcome must be uncomfortable/unpopular.

  2.  **Deconstruct the Legal and Ethical Context:**

      *   **Legal Framework:** England/Wales. Human Rights Act 1998 (Article 9, 10, 14), Equality Act 2010 (Public Sector Equality Duty - PSED), Common Law duty of fairness.
      *   **Public Reason:** The user references the idea that state power needs public justification. This aligns with *R (on the application of Hodkin) v Registrar General of Births, Deaths and Marriages* (broad definition of religion) and general administrative law principles (relevant/irrelevant considerations).
      *   **The Three Stages:**
          1.  *Admissibility:* Can they speak/submit? (Very high bar, usually freedom of expression).
          2.  *Relevance/Weight:* Does this count towards the decision matrix? (This is where "public reason" filters apply).
          3.  *Authority's Reasoning:* Can the Council cite this as *their* reason? (This is where the "secular justification" rule is strictest).

  3.  **Drafting the Procedure (The "Handheld" Document):**

      *   *Name:* Needs to sound official but clear. "Protocol for Handling Contributions with Religious or Comprehensive Doctrine Grounds."
      *   *Principle:* Neutrality. Not hostility to religion, but hostility to *exclusive* justifications for state action.
      *   *The Three Gates:*
          *   Gate 1 (Record): Accept almost everything. Freedom of expression.
          *   Gate 2 (Weight): Can it be translated into a public good? If yes, it counts. If no, it's noted but doesn't weigh on the balance.
          *   Gate 3 (Council's Reason): Must be secular/public. Cannot cite religious doctrine as the Council's motive.
      *   *Addressing the Wrinkles:*
          *   *Intent vs. Words:* Focus on the *effect* and the *claim*, not the internal theology.
          *   *Ancestry:* Irrelevant. If a reason works secularly now (e.g., "sanctity of life" -> "preservation of life"), it counts.
          *   *Translation Cost:* The Authority should assist (active duty under PSED/Equality), but the *logic* must be translatable. If it *cannot* be translated without distortion, it stays at Gate 1/2 but doesn't cross to Gate 3.
          *   *Authorship:* If an officer translates, it must be checked with the submitter. If they refuse, it remains a "faith-based objection."
          *   *Symmetry:* Yes. Secular comprehensive doctrines (e.g., hard libertarianism, deep ecology) get the same test.
          *   *Outcome Bias:* The test applies regardless of whether the reason supports or opposes the officer's recommendation.

  4.  **Addressing the "Translation" Question:**

      *   *Decision:* The Authority should offer to translate/record the secular equivalent *for the record*, but cannot force the speaker to abandon their theological language to be *heard*. However, for the reason to *count* (Gate 2), a public equivalent must be identifiable.
      *   *Why:* PSED and fairness. But the Council cannot act on non-public reasons.

  5.  **Applying to the Three Cases:**

      *   *Case 1 (Crematorium/Resurrection):*
          *   Gate 1: Accept/Record. (Freedom of expression).
          *   Gate 2: Weight? No. There is no secular harm. It's purely theological.
          *   Gate 3: Council Reason? No.
          *   *Outcome:* Objection recorded, but carries no weight in the planning/decision balance. Uncomfortable because it dismisses a sincere deeply held belief as "irrelevant" to public policy.
      *   *Case 2 (Alcohol/Noise):*
          *   Gate 1: Accept both.
          *   Gate 2: Residents (Noise/Litter) = Yes (Public Nuisance). Mosques (Alcohol prohibition) = No (Theological).
          *   *Crucial Point:* Can the decision stand on the Residents' reason alone? Yes, *provided* the PSED is discharged (i.e., the Council considered the impact on the Muslim community and found the secular reasons sufficient).
          *   *Outcome:* Permission granted if secular harms are manageable. The religious objection is noted but doesn't veto the secular permission. Uncomfortable for the Mosques' Council.
      *   *Case 3 (Adoption/Humanist):*
          *   Gate 1: Accept.
          *   Gate 2: Weight? "Autonomy and religious formation" is a comprehensive doctrine claim. Needs translation to "Best Interests of the Child" or "Equality Act compliance."
          *   *Twist:* The Humanists *refuse* to offer a narrower reason.
          *   *Outcome:* If they refuse to map to statutory criteria (Best Interests), it carries no *formal* weight, even if it aligns with the Council's desire to exclude the agency. The Council must find its *own* secular statutory reason (e.g., safeguarding, equality compliance) rather than adopting the Humanist's philosophical manifesto. Uncomfortable because it blocks an ally's argument from being the official reason.

  6.  **Refining the "Uncomfortable" Outcomes:**

      *   The prompt asks for at least one outcome the Council won't like.
      *   *Case 3* is the best candidate for this. The Council likely *wants* to exclude the faith agency. The Humanists are on their side. But the procedure says: "You can't use their comprehensive doctrine as your reason." The Council must do the hard work of finding a statutory justification, not just hide behind the Humanists' philosophy.
      *   *Case 1* is uncomfortable for the objector (their reason is deemed weightless).
      *   *Case 2* is uncomfortable for the Mosques (their reason is deemed weightless alongside allies).
      *   *Decision:* I will make Case 3 the one that frustrates the *Council* (they can't just adopt the Humanist reasoning), and Case 1 the one that frustrates the *Public* (their sincere belief counts for nothing in the balance).

  7.  **Addressing "What the Procedure Cannot Do":**

      *   It cannot resolve deep philosophical disagreements.
      *   It cannot prevent Judicial Review if the PSED isn't done properly.
      *   It cannot stop people feeling alienated.
      *   It doesn't replace legal advice.

  8.  **Review against Constraints:**

      *   British English? Yes.
      *   No citations? Yes.
      *   Practical/Handheld? Yes, needs to be structured as a protocol.
      *   Three stages? Yes.
      *   Wrinkles addressed? Yes.
      *   Translation question answered? Yes.
      *   Cases applied? Yes.

  9.  **Drafting - Tone Check:**

      *   Needs to be authoritative but humble.
      *   Avoid academic jargon (e.g., avoid "Rawls," "Public Reason Liberalism"). Use "Public Justification," "Shared Grounds."
      *   Ensure the distinction between "Recording" and "Weighing" is crystal clear.

  10. **Final Polish:**

      *   Check the "Translation" instruction. The prompt asks: "translate contributions for the record or require speakers to translate to be heard."
      *   *My stance:* Officers should record the *verbatim* reason (for transparency) but add a "Public Equivalent" field if possible. If the speaker refuses the equivalent, the verbatim stands but weight is limited. This balances the "cost of translation" wrinkle.
      *   *Symmetry:* Ensure the procedure explicitly mentions secular comprehensive doctrines.

  11. **Final Logic Check on Case 3:**
      *   If the Humanists say "Exclude them because religion is bad," and refuse to say "Exclude them because they discriminate against gay couples (statutory ground)," the Council cannot use the "religion is bad" reason. The Council must find the statutory ground itself. If the statutory ground doesn't exist, the Council can't exclude them, even if the Humanists are angry. This is the "uncomfortable" bit for the Council who might want to exclude the agency.

      *(Self-Correction)*: Actually, the prompt says the Humanists ground it in "autonomy and religious formation." This is philosophical. The Council's statutory duty is "Best Interests of the Child." If the Humanists refuse to map their argument to "Best Interests," the Council can't use the Humanist argument as a *reason*. The Council must find its own "Best Interests" reason. If they can't, they can't act. This limits the Council's power, which fits the "restraint on the state" requirement.

      *(Refining Case 1)*: The Crematorium. If the only objection is theological, and there are no secular harms (pollution, traffic), the planning authority *must* approve if the plan fits policy. The religious objection cannot be a material consideration. This is legally sound (planning law) but feels harsh.

      *(Refining Case 2)*: The Joint Submission. The decision can rest on the Residents' reason. But the PSED requires the Council to acknowledge the religious impact. The procedure must ensure the religious objection isn't *ignored*, just not *determinative*.

      *Let's write.*
answer: |-
  # PROTOCOL: HANDLING CONTRIBUTIONS WITH RELIGIOUS OR COMPREHENSIVE DOCTRINE GROUNDS

  **Owner:** Head of Consultation and Engagement
  **Applies to:** All officers processing deputations, petitions, and written submissions.
  **Purpose:** To ensure decisions are justified by reasons all citizens can reasonably accept, while respecting freedom of conscience and meeting legal duties (Human Rights Act, Equality Act).

  ## 1. CORE PRINCIPLES

  1.  **Restraint on Power, Not Conscience:** This procedure restricts the *Authority's* reasons for acting, not the *Public's* right to speak. Citizens may offer any reason they wish. The Authority may only act on reasons that are publicly shareable.
  2.  **Symmetry:** This test applies equally to religious doctrines and comprehensive secular doctrines (e.g., deep ecology, strict libertarianism, philosophical humanism). If a reason relies on a worldview not shared by all citizens, it is treated the same way regardless of origin.
  3.  **Neutrality:** The test applies regardless of whether the contribution supports or opposes the Officer's recommendation. A religious reason supporting a proposal is treated the same as one opposing it.

  ## 2. THE THREE GATES

  Every contribution must pass through three distinct stages. A contribution may pass one gate but fail the next.

  ### GATE 1: ACCEPTANCE AND RECORDING
  **Question:** *May this contribution be accepted and entered into the official record?*
  **Test:** **Yes, unless unlawful.**
  *   **Rule:** Accept all contributions that do not violate the law (e.g., hate speech, defamation, threats).
  *   **Recording:** Record the contributor's words verbatim. Do not edit theological or philosophical language to make it sound more secular.
  *   **Rationale:** Freedom of expression. Citizens must be able to state their true motives without being forced to misdescribe their conscience.
  *   **Officer Action:** Log the submission. Tag it as containing "Comprehensive Doctrine Grounds" (Religious or Secular).

  ### GATE 2: WEIGHT AND RELEVANCE
  **Question:** *May this contribution count as a reason bearing on the decision?*
  **Test:** **Is there a identifiable 'Public Equivalent'?**
  *   **Rule:** A reason carries weight only if it can be understood as a public good or harm (e.g., safety, cost, health, equality, environmental impact) without requiring the decision-maker to adopt the contributor's specific worldview.
  *   **Ancestry:** It does not matter if the reason originates in religion. If it has a secular function (e.g., "preserve life" rather than "sanctity of life"), it passes.
  *   **Translation:**
      *   **Who Translates:** The Officer should attempt to identify the Public Equivalent for the record.
      *   **Cost of Translation:** If the contributor insists their reason *cannot* be separated from their theology/philosophy, respect that. Record the reason verbatim.
      *   **Consequence:** If no Public Equivalent can be identified (by the Officer or the contributor), the contribution is **recorded** (Gate 1) but carries **no weight** (Gate 2) in the balancing exercise. It is noted as a sentiment, not a material consideration.
  *   **Officer Action:** In the report, list the reason. State clearly: *"This objection is noted. However, as it relies on [specific doctrine] without a secularity translatable harm, it is not a material consideration in planning law / statutory weighting."*

  ### GATE 3: AUTHORITY'S STATEMENT OF REASONS
  **Question:** *May this reason appear in the Authority's own justification for the decision?*
  **Test:** **Is it a Freestanding Public Reason?**
  *   **Rule:** The Authority's final decision notice or report must be justified *only* by Public Reasons.
  *   **Authorship:** Officers or Councillors may not adopt a religious or comprehensive doctrine as the Authority's reason, even if they personally agree with it.
  *   **Surrogacy:** An Officer cannot supply a secular surrogate on behalf of a contributor unless the contributor confirms it accurately reflects their concern. If the contributor refuses the surrogate, the Authority cannot use the reason at Gate 3.
  *   **Officer Action:** Draft the decision reasons using statutory criteria and public policy objectives only. Do not write *"The Council agrees with the Church that..."* Write *"The Council has considered the impact on community cohesion..."*

  ## 3. ADDRESSING SPECIFIC WRINKLES

  *   **Intent vs. Words:** Judge the reason by the *claim made*, not the officer's guess at the speaker's psychology. If they say "It is a sin," treat it as theological. If they say "It causes distress," treat it as social impact.
  *   **Secular Ancestry:** If a reason (e.g., "charity") is now commonly used in secular policy, it passes Gate 2 even if the speaker holds it for religious reasons.
  *   **Symmetry:** Apply this strictly to secular comprehensive doctrines. If a group objects to a policy because it violates "absolute bodily autonomy" (a philosophical claim not shared by all), it is tested exactly like a religious claim.
  *   **Outcome Bias:** If a religious reason supports the Officer's preferred outcome, it still fails Gate 2 if it lacks a Public Equivalent. Do not let a convenient conclusion bypass the test.

  ## 4. THE TRANSLATION QUESTION

  **Directive:** Officers should **translate for the record, but not require translation to be heard.**

  *   **To be Heard (Gate 1):** The speaker uses their own vocabulary. We do not silence them because they lack the majority vocabulary.
  *   **For the Record (Gate 2):** The Officer should add a note: *"Contributor states X. This maps to public policy concern Y."*
  *   **Why:** Requiring the speaker to translate imposes an uneven cost on minority communities and risks forcing them to lie about their motives. However, the State cannot act on reasons it cannot articulate to all citizens. Therefore, the Officer bears the burden of finding the public equivalent. If none exists, the reason remains in the record but does not move the needle.

  ***

  # APPLICATION TO CASES

  ### CASE 1: The Crematorium Objection
  **Submission:** Deputation against crematorium. Ground: Cremation incompatible with resurrection of the body. Speaker volunteers no other objection.
  **Application:**
  *   **Gate 1 (Record):** **Accept.** Record the theological ground verbatim. It is not unlawful.
  *   **Gate 2 (Weight):** **No Weight.** There is no secular harm identified (no pollution, traffic, or psychological harm to others claimed). The objection relies entirely on a specific theological cosmology not shared by all citizens. It is not a material planning consideration.
  *   **Gate 3 (Authority Reason):** **Exclude.** The Council cannot cite theological compatibility as a reason for planning decisions.
  **Outcome:** The application proceeds based on secular criteria (traffic, environment). The objection is minuted as received but explicitly stated to carry no weight in the balance.
  **Discomfort:** This will feel harsh to the objector. Their sincere, deeply held belief is effectively treated as irrelevant to public policy. This is the correct legal and ethical outcome under public reason: the state cannot veto infrastructure based on one group's eschatology.

  ### CASE 2: The Joint Submission (Mosques & Residents)
  **Submission:** Against pavement licensing. Mosques' Council: Prohibition on alcohol. Residents: Noise and litter.
  **Application:**
  *   **Gate 1 (Record):** **Accept both.** Record the religious ground and the secular ground separately.
  *   **Gate 2 (Weight):** **Split.**
      *   *Residents:* Carries weight (public nuisance).
      *   *Mosques:* Carries no direct weight (theological doctrine). However, under the Public Sector Equality Duty (PSED), the *impact* of the decision on the Muslim community is a relevant consideration. The Officer must assess if the licensing causes disproportionate distress or exclusion to that community.
  *   **Gate 3 (Authority Reason):** **Residents' Reason Only.** The decision letter may cite noise and litter. It may also cite "impact on community cohesion" if the PSED assessment supports it. It may *not* cite the prohibition on alcohol as a valid reason for the Council's refusal.
  **Outcome:** If the noise/litter can be mitigated, the licence is granted. The Council must record that it considered the religious objection and the PSED, but the statutory grounds for refusal were not met.
  **Discomfort:** The Mosques' Council may feel their moral authority is being sidelined. The Officers must ensure they do not simply say "we ignore the religious bit." They must say "we considered the impact on you, but the secular law requires us to focus on nuisance."

  ### CASE 3: The Secular Humanist Submission
  **Submission:** Exclude faith-based adoption agency. Ground: Comprehensive claim about autonomy and religious formation. Refusal to offer narrower reason.
  **Application:**
  *   **Gate 1 (Record):** **Accept.** Record the philosophical manifesto verbatim.
  *   **Gate 2 (Weight):** **No Weight.** "Autonomy and religious formation" is a comprehensive doctrine, similar to a religious worldview. It is not a shared public reason. The statutory test for adoption is "Best Interests of the Child."
  *   **Gate 3 (Authority Reason):** **Exclude.** The Council cannot exclude the agency based on the Humanists' philosophical objection.
  **Outcome:** **The Council cannot exclude the agency based on this submission.** If the Council wishes to exclude the agency, it must find a statutory reason (e.g., safeguarding failure, breach of Equality Act regarding service users) independent of the Humanists' philosophical claim. If no statutory breach exists, the agency must remain commissioned, even if the Humanists and the Council officers personally dislike the agency's ethos.
  **Discomfort:** **This is the outcome the Council will not like.** The Council likely wants to exclude the faith agency. The Humanists are their natural allies. This procedure forbids the Council from using the Humanists' argument as the justification. The Council must do the harder work of finding a specific statutory breach, or it must commission the agency despite its own ideological preferences. This prevents the state from becoming an arm of a secular comprehensive doctrine.

  ***

  # WHAT THIS PROCEDURE CANNOT DO

  1.  **It cannot prevent feelings of alienation.** Telling a citizen their reason is "recorded but carries no weight" will feel like dismissal. No procedure can fix the emotional cost of pluralism.
  2.  **It cannot replace Legal Advice.** If a contribution touches on Protected Characteristics (Equality Act) or Human Rights, the PSED and HRA duties may require deeper analysis than this triage allows. This protocol flags the issue; it does not solve the legal compliance.
  3.  **It cannot resolve 'Hard Cases'.** Sometimes a reason is half-theological, half-secular (e.g., "Sanctity of Life" regarding end-of-life care). This procedure requires a judgement call on whether a Public Equivalent exists. Officers must escalate these to the Monitoring Officer.
  4.  **It cannot stop Judicial Review.** If a claimant argues that a reason *was* a material consideration and was ignored, a judge will decide. This procedure demonstrates due process, but it is not a legal shield.
  5.  **It cannot force consensus.** The aim is not agreement, but legitimate justification. The Council may still be wrong, but this ensures it is wrong for public reasons, not private ones.

  **Instruction to Officers:** When in doubt, record more, weigh less. It is safer to acknowledge a contribution and assign it zero weight than to reject it at the door. Always escalate to the Monitoring Officer before finalising a decision where a significant contribution has been assigned zero weight at Gate 2.
