  {
    "episode_summary": "In 2016, ProPublica published an investigation alleging that the COMPAS recidivism risk-assessment tool used by U.S. courts was racially biased against Black defendants. ProPublica based this on disparate false-positive rates. The vendor (Northpointe, now Equivant) disputed this, arguing the tool was calibrated across races. The controversy highlighted a conflict between different mathematical definitions of fairness, occurring within the context of pretrial and sentencing decisions where base rates of recidivism differed across demographic groups.",
    "theory_application": "The algorithmic-fairness impossibility results (Chouldechova 2017; Kleinberg et al. 2016) mathematically demonstrate that when base rates differ between groups, a classifier cannot simultaneously satisfy calibration within groups and equalize false-positive and false-negative rates. In the COMPAS episode, ProPublica prioritized error rate parity (specifically false-positive parity), while Northpointe prioritized predictive calibration. The impossibility theorem explains why both parties could present valid mathematical evidence supporting contradictory claims of bias or fairness. The actors faced a forced choice between satisfying one metric at the expense of the other, with no technical solution available to satisfy both simultaneously given the observed base rate differences.",
    "allocative_analysis": "The standard impossibility framework operates within an allocative fairness frame, treating the algorithm's output as a static distribution of benefits (release) and burdens (detention) at a single point in time. This framework successfully explains the technical stalemate between ProPublica and Northpointe. However, it fails to explain institutional dynamics because it ignores temporal feedback. It treats the base rates as exogenous fixed parameters rather than outcomes potentially influenced by prior allocations. Consequently, the standard framework cannot account for how the choice of fairness metric might alter the underlying data generation process over time, nor does it address the court's epistemic relationship to the defendants beyond the immediate decision.",
    "inquiry_fairness_assessment": "Evaluating COMPAS through an inquiry fairness lens shifts focus from the static distribution of errors to whether the decision procedure preserves the institution's capacity to update beliefs. Under this lens, high false-positive rates for a specific group function as a self-sealing mechanism: if Group A is disproportionately flagged as high-risk (due to FPR disparity) and subsequently detained, they are denied the opportunity to demonstrate low risk in the community. This censors data that would otherwise correct the model's beliefs about Group A. While allocative fairness asks if errors were distributed equally, inquiry fairness asks if the system prevented certain groups from disproving the risk assessment. The COMPAS controversy reveals that satisfying calibration (Northpointe's defense) might maintain inquiry fairness by ensuring scores mean the same thing, whereas satisfying error rate parity (ProPublica's demand) might require score manipulation that obscures true risk, potentially degrading the system's epistemic accuracy. However, if calibration rests on historically biased data, inquiry fairness is already compromised. This lens suggests the impossibility results are necessary but insufficient, as they do not model the long-term epistemic closure caused by allocative decisions.",
    "settled_points": [
      "Mathematical theorem: With differing base rates, calibration and error rate parity cannot simultaneously hold (unless the classifier is perfect).",
      "Empirical fact: ProPublica's analysis showed Black defendants had higher false-positive rates than White defendants.",
      "Empirical fact: Northpointe's analysis showed COMPAS scores were calibrated across racial groups.",
      "Empirical fact: Observed recidivism base rates differed between Black and White defendants in the dataset used.",
      "Procedural fact: Courts used COMPAS scores as one input among many in risk assessments, not as the sole determinant."
    ],
    "contested_points": [
      "Normative priority: Whether calibration or error rate parity is the morally or legally relevant standard for fairness.",
      "Legal interpretation: Whether disparate false-positive rates constitute illegal discrimination under current statutes.",
      "Institutional obligation: Whether courts have a duty to maximize epistemic accuracy (inquiry fairness) versus minimizing immediate disparate impact (allocative fairness).",
      "Causal attribution: The extent to which base rate differences reflect underlying criminal behavior versus systemic policing or socioeconomic factors.",
      "Policy prescription: Whether risk-assessment tools should be reformed to meet specific fairness metrics or abandoned entirely in judicial proceedings.",
      "Validity of lens: Whether 'inquiry fairness' constitutes a distinct ethical obligation or is merely a derivative of long-term allocative outcomes."
    ],
    "episode_verdict": "The COMPAS episode supports the validity of the impossibility theorems as a description of technical constraints but reveals significant limits in their application to institutional ethics. The case demonstrates that the impossibility framework is often misapplied when treated as a complete ethical guide rather than a constraint on feasible metric sets. It complicates the framework by showing that the choice between incompatible metrics has downstream epistemic consequences (inquiry fairness) that the static mathematical model does not capture. The episode suggests the framework requires extension to account for feedback loops and data censoring, rather than remaining silent on the institutional dynamics of belief updating."
  }
