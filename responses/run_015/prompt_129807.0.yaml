answer: |-
  1.  **The Immune System Analogy**
      "I come from thirty years in marine ecology, so I tend to look at systems. In immunology, the body suppresses recognition of self-tissue to avoid autoimmune attacks. It's a functional suppression. Do you see that as structurally similar to how you think belief management works, or is that just mechanics without any mental content?"

  2.  **Follow-up: The Biology vs. Belief Line**
      *[Use this if she says the immune system is just biology, not belief]*
      "If you say it's just biology and not belief, aren't you just drawing a line in the sand where it's convenient for your theory? What makes one suppression 'mental' and the other 'mechanical' if the function is the same? It feels like you're defining the mental out of existence to save the argument."

  3.  **Artificial Systems and Contradiction**
      "Let's jump to artificial systems. If a large language model has contradictory weights in different layers and behaves inconsistently depending on the prompt, is that structurally analogous to self-deception, or is it just architecture with no unified subject?"

  4.  **Follow-up: The Agent Requirement**
      *[Use this if she says there's no agent there to deceive]*
      "If you say there's no agent there to deceive, aren't you defining agency so narrowly that the interesting problem disappears? If it acts deceived and processes contradictory info, why does the 'inner subject' matter? Are we just protecting a metaphysical idea of the 'self' rather than looking at the mechanism?"

  5.  **Conceptual Incoherence vs. Empirical Absence**
      "I need to pin this down: is your view that self-deception is conceptually incoherent—like a square circle—or merely empirically absent in the way we find it? Are you saying it can't exist logically, or just that it doesn't exist in practice?"

  6.  **Follow-up: Clinical Evidence**
      *[Use this to press on what could change her mind]*
      "So what evidence could actually move you? If we see clinical dissociation or split-brain patients where one hand fights the other, does that count as two agents, or does it crack your definition of a single agent? Is there any neurological setup that would force you to admit self-deception is real?"

  7.  **The Partitionist Reply**
      "Partitionists argue the mind is naturally divided into modules that don't talk to each other. If the mind is already compartmentalized, doesn't that solve the contradiction problem without needing to eliminate self-deception? Why isn't 'partitioned belief' enough to save the phenomenon?"

  8.  **Deflation and Indexical Shifts**
      "Here's a worry: does your view collapse into a deflationary account if we allow for indexical or temporal shifts? If I believe P today and not-P tomorrow, or believe P 'for me' but not-P 'for you,' isn't that just self-deception stretched out over time or context? Where's the hard stop?"

  9.  **Sincere Reports of Deception**
      "What do you make of people who sincerely report feeling deceived by themselves? They feel the tension. Are they all just confused about their own mental states, or is there a phenomenological reality you're dismissing? How do you account for the feeling of internal conflict without admitting deception?"

  10. **Ethics and Responsibility**
      "I dabble in ethics, and this has real-world stakes. If self-deception is impossible, how do we handle moral responsibility? If I claim I 'didn't know' because I deceived myself, are you saying that excuse is never valid? It seems like eliminating self-deception might let people off the hook for their own ignorance."
