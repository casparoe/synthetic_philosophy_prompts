  2. In your Shelby-phi variant, the audience's reinterpretation of the opening killing feels Orwellian, yet the film suggests the meaning was always indeterminate until the final narrative draft completed the loop. This mirrors Dennett's claim that there is no fact of the matter about when content was fixed, as the narrative truth exists only in the completion of the viewing experience.
  3. The Polaroids and tattoos function as externalized neural drafts, showing how memory is physically edited rather than merely mentally revised. Leonard's final decision to make Teddy the next John G demonstrates the Stalinesque fabrication of evidence before it enters his conscious workflow.
  4. However, the film resists the phi analogy because Leonard's condition eliminates the temporal proximity required for the illusion, making his deception a deliberate moral choice rather than a perceptual glitch. The color phi phenomenon is involuntary, whereas Leonard's rewriting of his history is a voluntary act of will to sustain his identity.
  5. Ultimately, Memento adds the dimension of agency to the Multiple Drafts Model, suggesting that we are not just passive observers of our drafts but active editors who choose which drafts survive. It transforms the philosophical puzzle from a question of timing into an ethical problem about the stories we choose to believe.
