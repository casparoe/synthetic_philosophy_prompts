answer: |-
  This is a classic interdisciplinary stalemate, and your intuition that the disagreement is not primarily about *lying* is correct. You are describing a friction between **Analytic Philosophy of Language** (specifically the norms of assertion tradition) and **Interactional Sociolinguistics** (specifically Politeness Theory and Conversation Analysis).

  The reason you are stuck is not because one of you is missing a premise, but because you are operating with different **units of analysis** and different **constitutive rules** for what counts as a successful speech act.

  Here is a diagnosis of the three hypotheses you raised, followed by the "hidden" factor that is likely doing the most work, a demarcation of settled vs. contested terrain, and a sketch of what progress would look like.

  ### 1. Diagnosing Your Hypotheses

  **Hypothesis 1: Teleology (Information vs. Relationship)**
  *   **Verdict:** This is a major driver, but it is deeper than just "purpose."
  *   **Analysis:** You are treating the norm of truth as a *constitutive rule* of assertion (akin to Searle or Williamson). If the practice is "assertion," the truth norm applies by definition, regardless of the social goal. Your friend is treating the norm of face-maintenance as a *constitutive rule* of *interaction*. For her, if the practice is "maintaining the relationship," the truth norm is subordinate to the success condition of the interaction.
  *   **The Clash:** You see the truth norm as invariant across contexts; she sees it as context-sensitive. You are arguing from the perspective of the *proposition*; she is arguing from the perspective of the *exchange*.

  **Hypothesis 2: The Verbal Disagreement (Saying vs. Getting to Believe)**
  *   **Verdict:** This is the strongest technical candidate for the stalemate.
  *   **Analysis:** This turns on **Illocutionary Force**. You are analyzing the utterance ("That might be difficult") as an *assertion* with a false implicature. She is analyzing it as a *refusal* realized through an assertoric form.
  *   **The Clash:** If it is a refusal, the primary norm is sincerity of intention (do you intend to refuse?), not truth of proposition (is it difficult?). By categorizing it as an assertion, you trigger the truth norm. By categorizing it as a politeness strategy (specifically an "off-record" strategy in Brown & Levinson's terms), she triggers the harmony norm. You are disagreeing on the *taxonomy of the speech act*.

  **Hypothesis 3: The Uptake Question (Responsibility for Misunderstanding)**
  *   **Verdict:** This is the ethical pivot, but it follows from the first two.
  *   **Analysis:** You place the burden on the Speaker (do not assert what is false). She places the burden on the Hearer (interpret within the local normative framework).
  *   **The Clash:** This is a disagreement about **Common Ground**. You assume the literal content is the baseline common ground, and deviations require justification. She assumes the relational context is the baseline common ground, and literal content is merely the vehicle.

  ### 2. The Hidden Factor: The Definition of Deception in Light of Mutual Knowledge

  There is a fourth factor you haven't explicitly named, which is likely the engine of the impasse: **The Epistemic Status of the Hearer.**

  You state: *"the fact that everyone in the room decodes it doesn't make it not a deception."*
  She states: *"saying 'that might be difficult' when you mean no... isn't a false assertion."*

  In the philosophy of deception, a standard condition for lying/deceiving is the **intention to induce a false belief**.
  *   **Your view:** The deception lies in the *record*. Even if the hearer decodes it, the speaker has entered a falsehood into the conversational common ground *as if* it were the primary content. The "plausible deniability" is a feature, not a bug, of the deception.
  *   **Her view:** If the hearer decodes it, no false belief is induced. Therefore, the condition for deception is not met. The "falsehood" is a shared fiction, mutually recognized as a fiction. In sociolinguistic terms, this is **collusive interaction**.

  **The Diagnosis:** You are defining deception *monologically* (Speaker → Proposition → Truth Value). She is defining it *dialogically* (Speaker ↔ Hearer → Shared Understanding). If the hearer knows the speaker means "no," and the speaker knows the hearer knows, there is no false belief. Your claim that it is "deception" relies on the idea that the literal proposition *must* be the believed content, even when pragmatic evidence overrides it. She rejects that requirement.

  ### 3. Settled vs. Contested (The Map You Requested)

  To avoid the seminar burn you experienced, here is the demarcation line as it currently stands in the literature.

  **Settled / Descriptive Consensus (Both fields generally agree):**
  *   **Descriptive Pragmatics:** Indirect speech acts are ubiquitous. Hearers systematically recover intended meaning beyond literal content (Gricean implicature is descriptively robust).
  *   **Politeness Theory:** Indirectness is a standard strategy for negative face work (Brown & Levinson).
  *   **Cross-Cultural Variation:** Norms of directness vary significantly between speech communities (Gumperz, Tannen).
  *   **Harm:** Both directness and indirectness can be used to manipulate or harm; neither is inherently moral.

  **Contested / Normative Disagreement (Where you are stuck):**
  *   **The Scope of the Truth Norm:** Does the norm of truth/knowledge apply to *all* utterances with assertoric form, or only to those where the primary illocutionary point is informing? (This is live in philosophy: see MacFarlane vs. Williamson vs. contextualists).
  *   **The Definition of Lying:** Does lying require the assertion of a falsehood, or the intention to induce a false belief? If the latter, and the hearer isn't fooled, is it still a lie? (Fallis, Carson, and others debate this).
  *   **The Priority of Norms:** When the truth norm conflicts with the politeness norm, which is defeasible? Philosophy tends to prioritize truth; Sociolinguistics tends to prioritize social cohesion. There is no interdisciplinary consensus on this hierarchy.
  *   **The Ontology of "Saying":** Is what is "said" the literal semantic content, or the pragmatically enriched content? (Recanati, Bach, etc.). This determines whether the falsehood is *said* or *implicated*.

  ### 4. What Would Count as Progress?

  If the honest answer is "nothing would," it would be because you are hitting **bedrock intuitions** about the value of Truth vs. the value of Harmony. However, I believe progress is possible if you shift the terrain from *classification* to *regulation*.

  **Stop asking:** "Is this a lie?"
  **Start asking:** "Which norm is being prioritized, and is that prioritization justified in this context?"

  **Specific Moves for Progress:**
  1.  **Distinguish Semantic Content from Illocutionary Point:** Concede that the *illocutionary point* is a refusal. Argue that the *semantic content* is still an assertion, and that assertions carry a truth norm *even when* used for other ends. This allows you to say: "It is a successful refusal, but it is a defective assertion." She can say: "It is a successful refusal, and the assertion form is merely the vehicle." You meet in the middle: It is a *hybrid* act.
  2.  **The "Off-Record" Loophole:** Acknowledge Brown & Levinson's category of "Off-Record" politeness. This strategy *relies* on deniability. If the strategy works, the hearer *shouldn't* be able to hold the speaker to the literal content. Your argument then becomes: "Using an Off-Record strategy to avoid responsibility for a refusal is ethically problematic because it offloads the interpretive labor onto the hearer." This shifts the debate to the **Uptake Question** (Hypothesis 3), which is an ethical debate you can actually have, rather than a conceptual one about what counts as "saying."
  3.  **Contextualize the Truth Norm:** Ask your friend if she accepts *any* truth norm in relationship work. (Presumably, she does; if you ask "Do you love me?" and she says "Yes" while meaning "No," she agrees that's wrong). If she accepts a truth norm in high-stakes relationship moments, the disagreement is no longer "Truth vs. Relationship," but "Where is the threshold for the Truth Norm?"

  ### 5. The "Nothing Would" Scenario

  If you make these moves and she still resists, you have hit the bedrock intuition.
  *   **Your Bedrock:** Clarity and Accountability. (The speaker owns the truth value of their words).
  *   **Her Bedrock:** Harmony and Face. (The participants co-own the meaning of the exchange).

  These are incompatible foundational values. In that case, the progress is recognizing that you are arguing for different **moral ecosystems**. You are arguing for a "Courtroom" model of speech (on the record, accountable, precise). She is arguing for a "Diplomatic" model of speech (nuanced, relationship-preserving, deniable).

  **Recommendation:**
  Frame the disagreement not as "Is this deception?" but as **"Is the cost of interpretive labor fairly distributed?"**
  *   Your view: The speaker should bear the cost of being clear to avoid deception.
  *   Her view: The hearer should bear the cost of interpretation to preserve face.

  This is a normative political question about conversational labor, rather than a semantic question about truth. It is much more fertile ground for a philosopher and a sociolinguist to till together.
