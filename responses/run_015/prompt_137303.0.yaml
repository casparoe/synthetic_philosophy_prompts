      *   **Frequentism:** Probability = Long-run relative frequency in repeatable trials. (Good for dice, coins, weather *climatology*. Bad for unique events, fixed facts).
      *   **Bayesianism (Epistemic/Subjective):** Probability = Degree of belief/credence given available information. (Good for pi, hidden coins, unique games, Europa. Bad for "objective" physical chances).
      *   **Propensity:** Probability = Physical tendency of a specific setup to produce an outcome. (Good for bent coins, radioactive decay. Hard to define precisely).
      *   **Classical:** Probability = Ratio of favorable to total equally likely outcomes. (Good for fair coins/dice. Fails when symmetry is broken).

