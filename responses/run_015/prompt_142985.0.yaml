  **1. Decisive defeaters**

  Decisive defeaters must demonstrate the absence of normative reasoning, not just divergent norms. Anthropologically, evidence of a functioning society where conflict resolution relies exclusively on brute force without any appeal to precedent, status, divine will, or honor would be fatal. If a group treats violence as purely instrumental, devoid of justificatory narratives even for internal consumption, the grammar claim collapses. Psychologically, finding a population where individuals lack the conceptual capacity to distinguish accidental from intentional harm, or cannot grasp reciprocity even as a strategic tool, would undermine the shared cognitive framework. Existing research on extreme psychopathy shows this individually, but cultural absence remains unobserved. Some reports of "amoral familism" approach this, yet usually retain internal family norms. A true defeater requires a community where "wrong" is unintelligible, replaced solely by "lost." This strikes the core because your view rests on the *capacity* for reasoning, not the outcome. If the capacity itself is missing culturally, the universal grammar is empirically false, not just variably weighted. It moves beyond skepticism into specific structural absence. Furthermore, if conceptual schemes are so alien that no mapping exists between their conflicts and human coordination problems (e.g., no concept of agency), translation fails. This would prove the grammar is not universal but locally constructed. Specifically, if ethnographers document a group that cannot understand the concept of a "fair procedure" even when explained, viewing all outcomes as random or destined without moral valence, the dispute-resolution grammar is illusory. Evidence that members cannot spot internal inconsistencies in their own normative claims—lacking reflexivity—would show the reasoning mechanism itself is absent, leaving only conditioned response.

  **2. Merely awkward adjustments**

  Merely awkward adjustments involve findings that complicate the universality claim without negating it. If the grammar exists but is rarely activated outside elite circles, the view shrinks from "universal community feature" to "specialized tool." This forces you to admit that most daily conflict is coercive, with reasoning reserved for crises. Another awkward finding: incommensurability is partial. If translation requires such extensive charitable interpretation that outsiders must reconstruct the grammar before natives recognize it, the "shared" aspect weakens. Honest refinement acknowledges that the grammar is a competence, not performance; people have the capacity but often choose power. This preserves the view while accepting messy reality. Special pleading arises if you claim the grammar is present even when members explicitly deny normative structures, insisting you know their minds better than they do. Similarly, arguing that "power struggles imply a hidden grammar of power" stretches the definition of moral grammar to include mere strategy. Distinguishing between a dormant capacity and an absent structure is key. If the grammar is only visible after extensive philosophical reconstruction by anthropologists, it risks becoming an academic artifact rather than a lived social reality. This complicates the claim that it functions as a practical dispute-resolution tool for the community itself. Additionally, if the grammar activates only in specific contexts (e.g., kin disputes but not war), it suggests modularity rather than a unified universal framework.

  **3. Concessions and dismissals from inside the view**

  A committed defender would accept pressure regarding performance vs. competence. They would concede that coercion often overrides reasoning but insist the *possibility* of appeal proves the grammar exists. They would reject the claim that elite-only access destroys universality, arguing that linguistic grammar exists even if only poets use it well. Internal grounds for rejection include distinguishing "grammar" from "agreement." Just because cultures disagree on outcomes doesn't mean they lack the structural rules for debating them. They would also distinguish "translation" from "identity." We don't need identical concepts to translate concerns about harm or status; we need functional equivalents. A defender would dismiss evidence of surface-level incommensurability as translation failures, not deep structural lacks. They would argue that even tyrants justify rule, proving the grammar's inescapability. However, they must accept revision if a culture lacks reflexivity—the ability to critique their own norms. If members cannot conceive of their rules as potentially incorrect, the "reasoning" component fails. The defender holds that the grammar is the operating system, not the software; changing apps doesn't break the OS. But if the OS itself is missing in some models, the universal claim dies. Thus, they accept empirical limits on capacity but reject cultural variation as evidence against the structure.

  **4. Insulation and unfalsifiability check**

  The position risks unfalsifiability if "grammar" is defined so abstractly that any coordination counts. If you claim the grammar is always "hidden" beneath power struggles, no observation of brute force can refute it. This insulation is intellectually legitimate only if grounded in cognitive science showing universal neural structures for normativity. If it relies solely on philosophical interpretation of behavior, it becomes a defensive retreat. Claiming apparent incommensurability is always superficial protects the view but empties it of empirical content. To remain meaningful, the grammar must have observable features: specific speech acts, expectations of justification, or reactions to hypocrisy. If these are absent, and you still insist the grammar exists, you are protecting a metaphysical assumption, not a scientific hypothesis. The view is well-exposed only if you specify what *would* count as a lack of grammar beyond mere violence. Without that, the claim that every culture possesses this grammar becomes a tautology: any functioning society must have some way of functioning.

  **5. Bottom-line ranking and verdict**

  Fatal defeaters include cultural absence of normative concepts like agency or reciprocity, and an inability to recognize internal inconsistency. Awkward adjustments involve grammar limited to elites or specific contexts. The view is moderately exposed but leans towards insulation by defining grammar as capacity rather than practice. The WEIRD data supports weighting differences, but not necessarily a shared grammar; it could support distinct grammars.
  Verdict: The view is well-exposed regarding surface norms but over-insulated regarding deep structure.
  Any insulation present is defensive when it prioritizes theoretical universality over ethnographic absence.
  The WEIRD data actually supports the grammar claim less strongly than you believe, as it highlights structural divergences in moral cognition, not just weighting.
  The hierarchy of threats places conceptual absence above access issues. The view survives only if "grammar" remains distinct from specific moral outputs. Without this separation, cultural variation becomes evidence against universality.
