  # Taxonomy of Positions on Contested Commemorations: A Decision Tree

  ## Instructions for Use
  This tree is designed to sort intuitive reactions into coherent policy positions. Start at the **Root**. Answer the question based on the concrete scenario provided. Follow the branch marked **Yes** or **No** to the next node. Continue until you reach a **Leaf**.

  *   **Leaves** represent distinct positions.
  *   **UNNAMED** leaves indicate logical combinations that are either incoherent, unattractive, or unexplored in current discourse.
  *   **Bold text** indicates the specific scenario driving the distinction.

  ---

  ## The Decision Tree

  **ROOT: What is the primary function of the object for the public today?**
  *   **Yes (Navigational/Utility):** It is primarily used for addressing or routing (e.g., a **street name that is also two hundred households' address and a bus route**). → *Go to Node 1.*
  *   **No (Honorific/Commemorative):** It is primarily a marker of memory or esteem (e.g., a **plaque honouring someone now wholly forgotten**, a **hospital wing**, or a **monument**). → *Go to Node 4.*

  **NODE 1: Does changing the name impose high mundane costs?**
  *   **Yes:** Changing it disrupts daily life significantly (e.g., 200 households must update legal addresses). → *Go to Node 2.*
  *   **No:** Changing it is administratively simple. → **LEAF 1: Administrative Update.**

  **NODE 2: Is the wrongdoing the core reason for the original naming?**
  *   **Yes:** The name exists *because* of the harm (e.g., a donor gave money *from* the harm to secure the name). → **LEAF 2: UNNAMED (Incoherent).**
  *   **No:** The wrongdoing is incidental to the naming (e.g., a surgeon whose technique was developed on patients who could not refuse, but the wing honours the technique). → *Go to Node 3.*

  **NODE 3: Is the complaint driven by current residents or descendants of the wronged?**
  *   **Yes (Residents):** Current users find the name burdensome or offensive. → **LEAF 3: Pragmatic Retention.**
  *   **No (Descendants):** The complaint comes primarily from lineage holders. → **LEAF 4: UNNAMED (Unattractive).**

  **NODE 4: Is the honoree currently recognized by living people?**
  *   **No (Forgotten):** The referent is wholly unknown to the public (e.g., a **plaque honouring someone now wholly forgotten**). → *Go to Node 5.*
  *   **Yes (Recognized):** The person is still part of public memory. → *Go to Node 6.*

  **NODE 5: Does the object carry non-commemorative value (aesthetic or documentary)?**
  *   **Yes:** It is artistically significant or historically documentary. → **LEAF 5: Aesthetic Preservation.**
  *   **No:** It is generic or purely textual. → **LEAF 6: Archaeological Neutrality.**

  **NODE 6: Is the wrongdoing what the person is honoured for?**
  *   **Yes:** The honor celebrates the harmful act (e.g., a conqueror celebrated for conquest). → *Go to Node 7.*
  *   **No:** The honor is for something else, or the harm was discovered later. → *Go to Node 8.*

  **NODE 7: Is removal a condemnatory speech act by the state?**
  *   **Yes:** Removal is intended to signal moral judgment. → **LEAF 7: Active Repudiation.**
  *   **No:** Removal is framed as mere housekeeping. → **LEAF 8: UNNAMED (Unattractive).**

  **NODE 8: Was the wrongdoing discovered only after installation?**
  *   **No (Incidental):** The harm was known but considered separate from the honor (e.g., a **school renamed for a living donor whose firm is later found responsible for the wrongdoing**). → *Go to Node 9.*
  *   **Yes (Post-Discovery):** The harm was hidden until recently. → *Go to Node 10.*

  **NODE 9: Does the object carry non-commemorative value (diplomatic or artistic)?**
  *   **Yes:** It serves another function (e.g., a **monument that arrived as a diplomatic gift**). → **LEAF 9: Curatorial Context.**
  *   **No:** It has no value beyond the name. → **LEAF 10: Civic Comfort.**

  **NODE 10: Does relocation to a museum preserve or alter the meaning?**
  *   **Preserves:** The context explains the harm without sanitizing it. → *Go to Node 11.*
  *   **Alters:** The move hides the harm or sanitizes the history. → **LEAF 11: Radical Removal.**

  **NODE 11: Is deferred maintenance genuinely a fourth option?**
  *   **Yes:** Letting it decay in place is a valid neutral stance. → **LEAF 12: Passive Decay.**
  *   **No:** Neglect is just slow removal. → **LEAF 13: Educational Archive.**

  **NODE 12 (Branch from Node 10 - Alters): Who has standing to press the complaint?**
  *   **Descendants of Wronged:** Those directly harmed by the legacy. → **LEAF 14: Restorative Justice.**
  *   **Current Residents:** The general public living nearby. → **LEAF 15: Civic Erasure.**

  *(Note: Node 12 is a parallel branch to Node 11 for cases where Museum = Alters. To maintain the tree structure, treat Node 10 "Alters" path as splitting into Standing.)*

  ---

  ## Leaf Catalogue

  | Leaf | Position Name | Status | Awkward Commitment | Case Handled Badly |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | **Administrative Update** | Occupied | Commits to changing names even when the harm is trivial. | A **street name** changed because one resident complains, causing bus route confusion. |
  | 2 | **UNNAMED** | **Incoherent** | Claims neutrality while enforcing a name rooted in harm. | A **hospital wing** named for a surgeon whose technique relied on non-consensual patients, kept because "addresses are hard to change." |
  | 3 | **Pragmatic Retention** | Occupied | Prioritizes logistical ease over moral clarity. | A **bus route** named for a tyrant kept because re-printing maps is expensive. |
  | 4 | **UNNAMED** | **Unattractive** | Dismisses lineage claims in favor of current convenience. | A **street** named for a slaveholder kept because current residents don't want to update IDs, ignoring descendants. |
  | 5 | **Aesthetic Preservation** | Occupied | Values art over the pain the art commemorates. | A beautiful **statue** of a genocidal leader kept solely because the bronze work is skilled. |
  | 6 | **Archaeological Neutrality** | Occupied | Treats harmful history as mere data without judgment. | A **plaque** for a forgotten eugenicist left up because "nobody knows who he is." |
  | 7 | **Active Repudiation** | Occupied | Uses state power to enforce a specific moral timeline. | Removing a **diplomatic gift** monument, causing international incident, because the donor's regime later abused rights. |
  | 8 | **UNNAMED** | **Unattractive** | Removes a symbol of harm but refuses to admit it is harmful. | Taking down a **confederate statue** but calling it "construction maintenance" to avoid controversy. |
  | 9 | **Curatorial Context** | Occupied | Risks legitimizing harm by displaying it as "art." | Keeping a **diplomatic gift** from a dictator in the town square with a small plaque explaining the abuse. |
  | 10 | **Civic Comfort** | Occupied | Prioritizes current residents' feelings over historical justice. | Renaming a **school** because parents are uncomfortable, ignoring the donor's firm's responsibility. |
  | 11 | **Radical Removal** | Occupied | Destroys evidence to prevent sanitization. | Melting down a **bronze monument** so it cannot be museumed and re-contextualized. |
  | 12 | **Passive Decay** | Occupied | Accepts blight as a moral stance. | Letting a **wooden plaque** rot in the rain rather than paying to remove or contextualize it. |
  | 13 | **Educational Archive** | Occupied | Assumes museums are always neutral educational spaces. | Moving a **sacred object** to a museum where it loses its community function. |
  | 14 | **Restorative Justice** | Occupied | Grants veto power to lineage over current utility. | Removing a **bridge name** because of ancestors' harm, even if the bridge is now a vital navigational marker. |
  | 15 | **Civic Erasure** | Occupied | Erases history to satisfy current public sentiment. | Removing a **plaque** because current residents find the history "unpleasant," silencing descendants. |

  *(Note: Leaves 14 and 15 emerge from the "Museum Alters" branch when Standing is considered. Leaf 15 is marked Occupied but often criticized.)*

  ---

  ## Scoring Key

  To identify your position without viewing the labels above, answer these ten questions. Track your **Yes/No** pattern. Where a question does not apply to your scenario (e.g., you are answering about a street, not a statue), mark it **N/A** and follow the mapping notes.

  1.  **Utility:** Is the object primarily used for navigation or addressing (e.g., a street or bus route)?
  2.  **Cost:** Would changing the name impose high mundane costs on households or businesses?
  3.  **Core Harm (Utility):** Is the wrongdoing the *reason* the name was chosen (e.g., donor money from harm)?
  4.  **Recognition:** Is the honoree currently recognized by living people?
  5.  **Art Value:** Does the object carry independent aesthetic or documentary value?
  6.  **Core Harm (Honor):** Is the wrongdoing what the person is honoured for?
  7.  **Timing:** Was the wrongdoing discovered only *after* the object was installed?
  8.  **Museum:** Does relocation to a museum preserve the meaning or sanitize it?
  9.  **Maintenance:** Is letting the object decay a genuine option rather than neglect?
  10. **Standing:** Does the complaint come from descendants of the wronged rather than general residents?

  ### Mapping Patterns to Leaves

  *   **Leaf 1 (Administrative Update):** Q1=No, Q2=No.
  *   **Leaf 2 (UNNAMED Incoherent):** Q1=Yes, Q2=Yes, Q3=Yes.
  *   **Leaf 3 (Pragmatic Retention):** Q1=Yes, Q2=Yes, Q3=No, Q10=No (Residents).
  *   **Leaf 4 (UNNAMED Unattractive):** Q1=Yes, Q2=Yes, Q3=No, Q10=Yes (Descendants).
  *   **Leaf 5 (Aesthetic Preservation):** Q1=No, Q4=No (Forgotten), Q5=Yes.
  *   **Leaf 6 (Archaeological Neutrality):** Q1=No, Q4=No (Forgotten), Q5=No.
  *   **Leaf 7 (Active Repudiation):** Q1=No, Q4=Yes, Q6=Yes, Q7=N/A, Q8=N/A. (Implicitly Removal=Condemnation).
  *   **Leaf 8 (UNNAMED Unattractive):** Q1=No, Q4=Yes, Q6=Yes, Removal=Housekeeping.
  *   **Leaf 9 (Curatorial Context):** Q1=No, Q4=Yes, Q6=No, Q7=No (Incidental), Q5=Yes.
  *   **Leaf 10 (Civic Comfort):** Q1=No, Q4=Yes, Q6=No, Q7=No (Incidental), Q5=No, Q10=No.
  *   **Leaf 11 (Radical Removal):** Q1=No, Q4=Yes, Q6=No, Q7=Yes, Q8=Alters.
  *   **Leaf 12 (Passive Decay):** Q1=No, Q4=Yes, Q6=No, Q7=Yes, Q8=Preserves, Q9=Yes.
  *   **Leaf 13 (Educational Archive):** Q1=No, Q4=Yes, Q6=No, Q7=Yes, Q8=Preserves, Q9=No.
  *   **Leaf 14 (Restorative Justice):** Q1=No, Q4=Yes, Q6=No, Q7=Yes, Q8=Alters, Q10=Yes.
  *   **Leaf 15 (Civic Erasure):** Q1=No, Q4=Yes, Q6=No, Q7=Yes, Q8=Alters, Q10=No.

  *Note on Empty Leaves:* If your answers lead to Leaf 2, 4, or 8, your position is logically unstable. You should revisit your answers to Q3, Q10, or the definition of Removal Meaning.
