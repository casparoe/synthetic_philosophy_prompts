          2.  If burdens differ significantly, choose the option with the lesser individual burden (ignore numbers).
          3.  If burdens are "roughly equal" (within a tolerance threshold), use numbers as a tie-breaker (fewer burdened wins).
      *   **The Cycle:** A (1 person, 10 loss) vs. B (40 people, 9.7 loss) -> A wins (numbers). B vs. C (2000 people, 9.3 loss) -> B wins (numbers). C vs. A -> C wins (individual burden dominates).
      *   **The User's Diagnosis:** The non-transitivity comes from the "roughly equal" threshold (a tolerant relation) gating a switch between two decision rules (maximin vs. aggregative tie-breaker).
      *   **Specific Questions:**
