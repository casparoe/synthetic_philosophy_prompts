      *   **Boundary 3 (IIA):** It's a consequence, not a distinct phenomenon.
      *   **Repairs:** Analyze trade-offs. Continuous = loss of lexical priority. Cycles = money pump vulnerability.
      *   **Conclusion:** The moral view entails a rationality cost.

  9.  **Final Polish:** Ensure the distinction between the *relation* (non-transitive) and the *choice rule* (how to pick from a set) is clear. The user asks about the procedure ranking options. The ranking is intransitive. The choice from a set is the next step.

      *(Self-Correction during drafting)*: Make sure to emphasize that this is *not* the "Aggregation Objection" to contractualism. The Aggregation Objection says "You can't count numbers." This says "If you count numbers *this specific way*, you break transitivity." This is a crucial distinction for the user's chapter.

      *(Refining the "Baseline" answer)*: If we compare to baseline, we assign a score $S(O)$. If $S(O)$ is derived from the same threshold logic, $S(O)$ might not be well-defined if the "score" depends on what it's compared to. But if we fix the baseline as "0", then we are essentially doing cardinal measurement. If the threshold logic applies to the *difference from baseline*, then A vs Baseline, B vs Baseline.
      *   A vs SQ: 1 person loses 10. Score = -10.
