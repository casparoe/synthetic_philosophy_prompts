      *   The problem is: How do you generate a *score* from a pairwise rule? You can't easily. If you try to construct a value function $V(X)$, you assume transitivity. If transitivity fails, $V(X)$ doesn't exist. So Baseline comparison *presupposes* a solution (a value function) that the procedure denies. This confirms it's a relocation/avoidance, not a fix.

