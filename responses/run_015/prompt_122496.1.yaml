      *(Refining the "IIA" answer)*: This is Property $\alpha$ (Chernoff). If $A \in C(\{A,B\})$ and $A \in \{A,B,C\}$, then $A \in C(\{A,B,C\})$. In the cycle, $C(\{A,B\}) = \{A\}$, $C(\{B,C\}) = \{B\}$, $C(\{A,C\}) = \{C\}$. $C(\{A,B,C\})$ is empty (or all, depending on rule). This is a direct result of the cycle.

