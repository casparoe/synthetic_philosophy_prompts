prompt: |-
  I work in trust and safety at a virtual-reality platform that also runs a sizeable in-world economy: users design and sell clothing, furniture and decorative objects to one another for real currency, and we take a commission on each sale. I've been asked to write the internal document that sets out what our enforcement rules actually presuppose, and the more carefully I list them, the more they seem to pull in different directions. So before I draft it: what theory of virtual objects, and of virtual harm, does a practice like ours presuppose? I want the conceptual structure rather than a literature survey or anything that would need a library — our lawyers handle the legal question, and I'm not asking which jurisdictions have prosecuted what.

  Three parts of the practice seem to me to be doing the real work. First, on ownership: our terms say that the user owns nothing, that every item is a revocable licence, that we may seize or delete anything at will, and that when a long-standing player dies there is nothing to pass on, so we refuse the family's request to transfer the contents of the account to an heir — but we also permanently ban players for taking another player's items, we describe this in public statements as theft, and where the taking involved breaking into an account we have sometimes referred the matter outward instead of simply closing the ticket. Second, on identity: after a crash destroyed a batch of items last year we rolled the database back and told people their items had been restored — the same items, we said, not replacements; then a bug duplicated a limited-edition object several thousand times, and although the copies were byte-for-byte indistinguishable from the originals we deleted every copy and left only the originals with whoever had held them before the bug. Players reasonably pointed out that we cannot have both: either the item just is its state in our database, in which case the copies were as genuine as the originals, or identity depends on how an item came into existence, in which case a rollback does not give you back the same item either. We had no reply ready. Third, on harm: we hand out permanent bans for non-consensual sexual touching of another person's avatar, and we ship a default personal-space bubble that prevents other avatars from coming within arm's reach; but we host combat experiences in which avatars are dismembered by the thousand, and we do not treat avatar death as a harm at all, even when one player deliberately targets another repeatedly. Our own staff disagree about whether the line is drawn by consent, by what an avatar stands for, by downstream effects on the person, or merely by what revolts the team.

  So I'd like the implicit theory reconstructed and then interrogated. What must be true for these rules to make sense, as opposed to what merely fits comfortably with them? Where are the three parts mutually consistent, and where do they commit us to incompatible things — in particular, is there any coherent account of what an in-world item is that simultaneously makes it unownable and uninheritable, makes a duplicate not the same item, and makes taking it from someone a genuine harm? And on harms: is a virtual harm a real harm, or is the harm always to a person, with the virtual event merely its occasion? Then the practical part of the answer, which is what my document needs: if we replaced the view we are implicitly working with either with the view that in-world items are genuine objects with genuine owners, or with the view that they are nothing at all and the only real facts are facts about people's experiences and about our servers, which of our rules would have to change, and how? And, relatedly, what rationale for the touching-versus-killing line would make it look like more than an accident of our team's sensibilities — or is the line genuinely underdetermined, in the sense that several different accounts of the wrong involved would each license exactly the enforcement policy we already have?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **User Role:** Trust and Safety at a VR platform with a real-money economy.
      *   **Task:** Write an internal document outlining the presuppositions of enforcement rules.
      *   **Problem:** The current rules seem contradictory (ownership vs. license, identity/continuity, harm definitions).
      *   **Goal:** Reconstruct the *implicit theory* of virtual objects and virtual harm, interrogate its coherence, and provide practical guidance on how shifting theories would change rules (specifically regarding ownership/inheritance and touching/killing).
      *   **Constraints:** Conceptual structure, not a literature survey, not legal advice. Focus on coherence and practical implications.
      *   **Key Tensions:**
          1.  *Ownership:* "You own nothing" (ToS) vs. "Theft is punished/referral" (Enforcement).
          2.  *Identity:* "Rollback restores *the* item" vs. "Duplicates are fake despite being byte-identical" (Provenance vs. State).
          3.  *Harm:* "Non-consensual touching is banned" vs. "Consensual dismemberment is fine" (Context/Consent vs. Act).

  2.  **Analyze the Implicit Theory (Reconstruction):**

      *   *What theory makes sense of the contradictions?*
      *   It's not "Virtual Realism" (items are real property) because ToS denies ownership.
      *   It's not "Virtual Nihilism" (items are nothing) because theft is punished.
      *   *Hypothesis:* The platform operates on a theory of **Managed Social Reality** or **Institutional Fact**.
      *   *Ownership:* It's not legal title, it's *expectation security*. We punish theft not because property rights exist *in rem*, but because violating expectations destabilizes the economy we profit from.
      *   *Identity:* It's not material (bytes), it's *historical/provenancial*. An item is defined by its causal history within the system's ledger, not just its current state. This explains why rollbacks work (restoring the history) but duplicates don't (wrong history).
      *   *Harm:* It's not about the avatar's state (dead/alive), it's about *agency violation*. Touching violates bodily autonomy (even virtually) because it mimics a real-world violation of consent. Killing in combat is a rule-bound game mechanic (consented to).
      *   *Core Tension:* The platform wants the *economic benefits* of ownership without the *legal liabilities* of ownership. It wants the *social weight* of objects without the *metaphysical commitment*.

  3.  **Interrogate Coherence (The "Pull in Different Directions"):**

      *   *Ownership:* Incoherent legally, but coherent functionally. "Theft" is a shorthand for "Unauthorized Transfer violating Platform Rules." The inconsistency arises when trying to map it to real-world inheritance (which requires legal title).
      *   *Identity:* Coherent if we accept "Digital Provenance" as the defining trait. The rollback works because the *ledger state* is restored. Duplicates fail because the *ledger entry* is invalid. The user confusion comes from conflating "file data" with "ledger entry."
      *   *Harm:* Coherent if the metric is *Consent + Context*. Touching is intimate/personal; combat is ludic/functional. The "revulsion" factor is a heuristic for "social norm violation."

  4.  **Develop the Practical Implications (The "What If" Scenarios):**

      *   *Scenario A: Virtual Realism (Items are Genuine Property).*
          *   Changes: ToS must grant title. Inheritance must be allowed. Seizure requires due process. "Theft" becomes actual legal theft. Platform liability increases.
          *   Impact: Economic stability up, Platform control down.
      *   *Scenario B: Virtual Nihilism (Items are Nothing/Server States).*
          *   Changes: Stop calling it "theft." Ban only for ToS violations (hacking), not "taking." No rollback promises (just "we fixed the DB"). Harm only if real-world distress is proven.
          *   Impact: Platform control up, User trust/economy down.
      *   *Scenario C: Refined Institutional Theory (The Middle Path).*
          *   Clarify that "Ownership" = "Exclusive License + Expectation of Continuity."
          *   Clarify "Identity" = "Ledger Provenance."
          *   Clarify "Harm" = "Violation of Contextual Consent."

  5.  **Address the Touching vs. Killing Line:**

      *   Is it underdetermined? No, it's determined by *Social Script*.
      *   Combat = Ludic Script (violence is the point).
      *   Social Space = Mimetic Script (violence is a violation).
      *   Touching is intimate; killing in VR is often abstract/gamified.
      *   Rationale: The harm is the *breach of the expected social contract of the space*, not the pixel manipulation itself.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Professional, analytical, philosophical but grounded in ops.
      *   *Structure:*
          1.  Diagnosis of the Implicit Theory (The "Institutional Fact" Model).
          2.  Interrogation of the Three Tensions (Ownership, Identity, Harm).
          3.  The Two Extremes (Realism vs. Nihilism) & Consequences.
          4.  The Touching/Killing Rationale.
          5.  Recommendations for the Document.
      *   *Key Insight:* The platform is acting as a *Sovereign*, not a Landlord or a Toolmaker. It creates facts by fiat. The contradiction is between *Sovereign Power* (we decide) and *Market Stability* (users need predictability).

  7.  **Refining the "Identity" Argument:**
      *   Need to be careful here. The user noted the rollback contradiction.
      *   *Explanation:* In a database, identity is usually Primary Key. Rollback restores the PK. Duplication creates new PKs with same data. So technically, the platform *is* consistent on Identity (it's about the DB record, not the blob). The *communication* was the problem ("same item" vs "replacement").
      *   *Correction:* The theory is "Ledger Identity." I need to make sure this is clear.

  8.  **Refining the "Harm" Argument:**
      *   Why is touching worse than killing?
      *   *Argument:* Sexual touching maps to real-world trauma scripts. Avatar death maps to game-over scripts.
      *   *Theory:* "Mimetic Harm." If the action mimics a real-world violation without a ludic frame, it's harm. If it has a ludic frame (combat zone), it's play.

  9.  **Final Polish:**
      *   Ensure I answer the specific questions: "What must be true?", "Where are they inconsistent?", "Which rules would change?", "Is the line underdetermined?"
      *   Keep it actionable for the internal document.

  **(Self-Correction during drafting):** I initially thought about suggesting they change the ToS. But the prompt asks what theory *presupposes* the current practice. I need to explain the theory that *justifies* the current mess, then show where it breaks. The "Sovereign/Institutional" model is the best fit. It acknowledges that the platform *creates* reality by decree. The inconsistency is between *Absolute Sovereignty* (we can delete anything) and *Rule of Law* (we punish theft consistently).

  Let's structure the response around the concept of **"Institutional Facts"** (Searle-ish but simplified) combined with **"Sovereign Stewardship."**

  *   *Ownership:* You own the *value*, we own the *code*. Theft is destroying value, not stealing code.
  *   *Identity:* Identity is *lineage*, not data.
  *   *Harm:* Harm is *contextual violation*, not visual content.

  Okay, ready to write.
answer: |-
  This is a profound operational question. You are asking for the metaphysics of your moderation policy. The contradictions you identify are not merely bureaucratic oversights; they are symptoms of a specific, hybrid theory of virtual reality that is stable in practice but unstable under philosophical scrutiny.

  Your platform does not operate on a theory of **Virtual Realism** (items are real property) nor **Virtual Nihilism** (items are mere pixels). It operates on a theory of **Institutional Stewardship**.

  Here is the reconstruction of that theory, an interrogation of its coherence, and the practical implications for your document.

  ### I. The Implicit Theory: Institutional Stewardship

  For your current rules to make sense, three specific propositions must be true. If any of these are false, your enforcement logic collapses.

  **1. On Ownership: Value vs. Title**
  *   **The Presupposition:** Users own the *economic value* and *social expectation* of an item, but the platform owns the *ontological substrate*.
  *   **Why it's needed:** This allows you to punish "theft" (protecting the user's economic/social investment) while retaining the ToS right to delete items (protecting your legal liability and technical control).
  *   **The Tension:** You are distinguishing between *possession* (which users have) and *property* (which you have). In the real world, these are usually linked. In your system, "theft" is not a violation of property rights, but a violation of **systemic integrity**. You ban thieves not because they stole *from the user*, but because they broke the *platform's rules on transfer*. The harm is to the economy you steward, not the individual's title.

  **2. On Identity: Provenance vs. State**
  *   **The Presupposition:** A virtual object is defined by its **causal history (ledger entry)**, not its **current state (data blob)**.
  *   **Why it's needed:** This resolves your rollback/duplicate paradox.
      *   *Rollback:* When you roll back the database, you restore the specific ledger entry (the unique ID) associated with the user. Therefore, it is the "same" item.
      *   *Duplicates:* When a bug creates copies, it creates new ledger entries with the same data payload. They are "fake" because their causal history (the bug) violates the rules of issuance, not because they look different.
  *   **The Tension:** You communicate this poorly. When you tell users "we restored your items," you speak colloquially. When you delete duplicates, you speak technically. The inconsistency is in the *explanation*, not necessarily the *mechanism*, provided your database uses unique IDs (UUIDs) rather than just content hashes. If your system treats items as purely fungible data without unique IDs, then your theory is incoherent.

  **3. On Harm: Contextual Consent vs. Visual Content**
  *   **The Presupposition:** Harm is not determined by what happens to the *avatar*, but by what happens to the **user's agency within a social script**.
  *   **Why it's needed:** This distinguishes combat from harassment.
      *   *Combat:* The user has entered a "Ludic Script." They have consented to avatar destruction as a mechanic of play. The avatar's death is a scorekeeping event, not a violation.
      *   *Touching:* The user is in a "Social Script." There is no mechanic that requires touching. Therefore, non-consensual touching is a violation of bodily autonomy *by proxy*.
  *   **The Tension:** This relies on the assumption that users can clearly distinguish scripts. When a combatant follows a victim into a non-combat zone and kills them, your theory demands you treat that differently than killing in an arena. If you don't, the theory fails.

  ### II. Interrogating Coherence: Where the Theory Breaks

  Your current practice is functionally stable but philosophically fragile. Here are the points of failure for your internal document.

  **1. The Inheritance Contradiction (Ownership)**
  *   **The Problem:** If users own the *value*, and that value is transferable (selling for real currency), then upon death, that value should be transferable to an heir. Denying inheritance while punishing theft admits that the "ownership" is purely **personal to the account holder**, not attached to the asset.
  *   **The Coherence Check:** This is consistent *only if* the account is a non-transferable service subscription, and the items are merely usage rights within that subscription.
  *   **The Break:** You market these items as an "economy." Economies require transferability of capital. By blocking inheritance, you acknowledge that the "economy" is actually a **rewards program**. If your document calls it an economy, you must either allow inheritance or admit the "ownership" language is marketing fiction.

  **2. The Rollback Contradiction (Identity)**
  *   **The Problem:** You claimed rollbacks restored the "same" items. But if identity is based on *causal history*, a rollback creates a *new* history (the history of being restored).
  *   **The Coherence Check:** This is only coherent if "Identity" = "Database Primary Key." If the UUID survives the rollback, it is the same object. If the rollback wipes the DB and recreates it from a backup, the UUIDs might persist.
  *   **The Break:** If your tech stack does not guarantee UUID persistence through recovery, you are lying to users. You are giving them replacements and calling them originals to preserve psychological continuity. Your document must align with the tech: either "We restore the exact record" or "We restore the functional equivalent."

  **3. The Touching/Killing Contradiction (Harm)**
  *   **The Problem:** You say harm is about consent/scripts. But why is sexual touching inherently non-ludic? There are VR experiences where touching is the game.
  *   **The Coherence Check:** The line is not "Touching vs. Killing." The line is **Intimacy vs. Function**.
      *   *Killing* in VR is usually functional (reducing HP, respawning). It rarely mimics the *finality* or *pain* of real death.
      *   *Touching* (specifically sexual) mimics real-world intimacy and violation scripts that have no "respawn."
  *   **The Break:** If a user is repeatedly killed in a non-combat zone, and you do not treat that as harm, your theory is inconsistent. The harm is not the *action*, it is the **targeted violation of expected safety**. If your team bans for touching but not for targeted killing outside combat zones, your rationale is not "consent," it is "revulsion."

  ### III. Practical Implications: Shifting the Theory

  For your document, you need to know what breaks if you move to a purer theory.

  **Option A: Virtual Realism (Items are Genuine Property)**
  *   **The Shift:** You acknowledge users hold title to digital assets.
  *   **Rules that Change:**
      *   **Inheritance:** You *must* allow account transfer upon death (with verification).
      *   **Seizure:** You cannot delete items at will. You need a "due process" system (appeals, evidence standards) before confiscation.
      *   **Liability:** You become a custodian. If items are lost due to your negligence (server failure), you may owe restitution.
      *   **Theft:** You can refer more cases to law enforcement as actual theft/fraud.
  *   **Risk:** Massive increase in legal liability and operational drag.

  **Option B: Virtual Nihilism (Items are Server States)**
  *   **The Shift:** You admit items are nothing but temporary licenses. "Theft" is just "ToS Violation."
  *   **Rules that Change:**
      *   **Language:** You stop using words like "theft," "own," "restore." You use "unauthorized transfer," "license," "re-credit."
      *   **Enforcement:** You stop banning for "taking items" unless it involves hacking (ToS breach). If a user tricks another into trading, that's just a bad trade.
      *   **Harm:** You only ban for real-world harm (doxxing, threats). Avatar touching is just animation data.
  *   **Risk:** The economy collapses. Users will not invest money if they have no security. Trust evaporates.

  **Option C: Refined Institutional Stewardship (The Current Path, Clarified)**
  *   **The Shift:** You lean into the "Sovereign" role. You create facts by fiat, but you bind yourself to consistent rules to maintain market confidence.
  *   **Rules that Change:**
      *   **Clarify Ownership:** "Users own the *license* and the *market value*, Platform owns the *code*."
      *   **Clarify Identity:** "Item identity is defined by unique system ID, not visual data." (Fixes the duplicate/rollback explanation).
      *   **Clarify Harm:** "Harm is defined by **Contextual Violation**." (Killing in a shop is harassment; killing in an arena is play).

  ### IV. The Touching vs. Killing Rationale

  Is the line underdetermined? **No.** It is determined by **Mimetic Resonance**.

  For your document, do not justify the line based on "what revolts the team." Justify it based on **Real-World Mapping**.

  1.  **Avatar Death:** In most VR contexts, death is *reversible* and *abstract*. It maps to "losing a point" or "being sent to the lobby." It does not map to real-world mortality. Therefore, it is low-harm.
  2.  **Avatar Touching:** Sexual touching maps to **bodily autonomy**. Even if reversible, the *script* is one of intimate violation. It triggers real-world trauma responses in a way that "losing HP" does not.
  3.  **The Test:** The enforcement rule should be: *Does this action mimic a real-world violation that has no ludic (game) justification in this context?*
      *   Dismemberment in a shooter = Ludic justification.
      *   Dismemberment in a virtual coffee shop = No ludic justification = Harassment.
      *   Touching in a dance club = Ambiguous (requires consent mechanics).
      *   Touching in a street = No ludic justification = Harassment.

  **Recommendation:** Your policy is not underdetermined, but your *explanation* is. You are currently enforcing based on **Social Norms** (what feels wrong) but writing policy based on **Technical Rights** (ToS).

  ### V. Summary for Your Document

  To make your enforcement rules coherent, your internal document should explicitly state the following three axioms:

  1.  **The Stewardship Axiom:** The Platform is not a passive host but an active steward of a closed economy. We prioritize **Market Stability** and **User Expectation** over strict legal title. We punish "theft" to preserve trust, not because we recognize property rights.
  2.  **The Provenance Axiom:** Virtual objects are defined by their **ledger history**, not their data. A duplicate is a forgery because its history is invalid, even if its data is perfect. A rollback restores history; therefore, it restores the object.
  3.  **The Contextual Harm Axiom:** Harm is not inherent in the animation but in the **violation of the social contract of the space**. Violence is permissible where the script is ludic (combat); it is harmful where the script is social (public spaces). Sexual touching is presumptively harmful because it mimics intimate violation without a standard ludic frame.

  **Where you must compromise:**
  You cannot have it both ways on inheritance. If you claim to steward an economy, you must have a mechanism for asset transfer upon death, even if it is cumbersome. Denying it outright admits the "economy" is a fiction. If you wish to keep the denial, you must stop marketing the items as having enduring value beyond the life of the account.

  **Final Advice:**
  Do not try to solve the metaphysical contradiction. Embrace the **Institutional** nature of your power. You are a government, not a landlord. You create the physics of your world. Your rules are consistent *because you say they are*, provided you apply them consistently. The danger is not the contradiction; it is the **arbitrariness**. If users cannot predict when you will treat an item as property (theft ban) and when as a license (deletion), trust fails. Your document should focus on **predictability of enforcement**, not the ontology of the objects.
