answer: |-
  **Brainstorming Note: The Conceptual Knot**
  The genuinely hard knot lies in the mismatch between the *normative structure* of desert and the *ontological structure* of *anātman*. Moral desert presupposes a subject who "owns" an action and subsequently "owns" the consequence. In Western retributivism, this ownership is secured by personal identity (numerical identity over time). In Buddhist metaphysics, the person is a causal series of momentary events (*dharmas*) without a core proprietor. If karma is merely causal continuity (Event A causes Event B), it is descriptive physics, not normative justice. If karma is normative justice, it requires a proprietor. The knot is: How can a ownerless process generate owner-specific debt? To treat karma as desert without a self is to attempt to ground normative responsibility on ontological emptiness. The exam must force students to see that "causal connection" is insufficient for "desert," yet "desert" seems impossible without "identity."

  ***

  ### 1. Essay Question

  **Course:** Philosophy of Religion (Upper-Level Seminar)
  **Time Allowed:** 90 Minutes
  **Total Marks:** 30

  **Prompt:**
  Critically evaluate the coherence of interpreting karma specifically as a theory of **moral desert** rather than as generic causation or cosmic bookkeeping. In your analysis, you must assume the Buddhist metaphysical constraint of *anātman* (the rejection of a permanent, substantial self). 

  Your essay should address the following problem: If there is no enduring entity that is numerically identical across lives, in what precise sense can a present sufferer be said to *deserve* suffering based on the actions of a prior agent? Determine whether a notion of diachronic moral desert can survive the denial of a substantial self. In doing so, you must clearly distinguish the karma-desert model from (i) Western single-life retributivism, which presupposes continuous personal identity, and (ii) purely consequentialist systems that track outcomes without invoking normative desert.

  ***

  ### 2. Model Answer

  Interpreting karma as a theory of moral desert while accepting *anātman* generates a severe metaphysical tension regarding the subject of responsibility. Moral desert requires a normative link between an agent and a consequence: the subject who suffers must be the same moral owner as the subject who acted. However, *anātman* denies the existence of a permanent self (*ātman*) that persists across lives to bear this ownership. Consequently, karma risks collapsing into mere causal mechanism unless a robust account of conventional identity can bear the weight of ultimate responsibility.

  Western retributivism secures desert through personal identity. Within a single life, psychological continuity and bodily persistence justify punishing an older self for the crimes of a younger self. They are numerically identical. Karma, however, extends across distinct embodied lives where bodily continuity is broken. If one relies solely on *anātman*, the connection between lives is merely causal, like one billiard ball striking another. While the second ball moves *because* of the first, it does not *deserve* to move in a moral sense. If karma is reduced to this causal continuity, it becomes cosmic bookkeeping rather than justice. It explains why suffering occurs, but not why it is *fair*.

  To salvage desert without a substantial self, proponents often appeal to causal-psychological continuity. The argument suggests that because the later life-stage is causally dependent on the earlier life-stage’s volitions, responsibility transfers along the causal chain. However, this move conflates causal responsibility with moral desert. One can be the causal outcome of a prior event without being morally liable for it. For desert to hold, there must be normative ownership, not just causal derivation. Without a substantial self to unify the causal series into a single moral agent, the "person" suffering in life two is arguably a distinct entity from the "person" who acted in life one. Punishing the former for the latter resembles vicarious punishment, which violates standard intuitions of justice.

  Alternatively, one might argue that the "self" exists conventionally (*samvrti-satya*) even if it lacks ultimate reality (*paramartha-satya*). On this view, desert is a pragmatic tool useful for ethical cultivation, even if metaphysically unfounded. While this preserves the utility of karma, it undermines its status as objective justice. If the self is a fiction, the debt is fictional. A theory of moral desert typically claims to describe an objective moral order, not merely a useful heuristic. Therefore, while conventional identity might support moral encouragement, it struggles to support the heavy normative weight of cross-life retribution.

  Ultimately, karma as moral desert faces a dilemma under *anātman*. If it insists on strict desert, it implicitly requires a substantial self to bear the debt, contradicting *anātman*. If it insists on *anātman*, it must reduce karma to causal conditioning, forfeiting the normative force of desert. Unless one redefines desert as purely forward-looking (consequentialist) rather than backward-looking (retributive), the combination of cross-life karma and no-self remains metaphysically unstable. The present sufferer may be causally connected to the prior actor, but without numerical identity, the claim that they *deserve* the suffering lacks a coherent subject.

  ***

  ### 3. Marking Scheme (30 Marks)

  **A-Range (26–30 Marks): Excellent**
  *   **Thesis & Problem Articulation (10 marks):** Clearly identifies the tension between normative desert (requires ownership) and *anātman* (denies ownership). Explicitly states that causal continuity is insufficient for moral desert.
  *   **Metaphysical Analysis (10 marks):** Rigorously evaluates whether "conventional self" or "causal continuity" can bear the weight of responsibility. Recognizes that without numerical identity, cross-life punishment resembles vicarious liability.
  *   **Comparative Distinctions (5 marks):** Precisely distinguishes karma from Western retributivism (noting the break in bodily continuity) and from consequentialism (noting the difference between outcome-tracking and deservedness).
  *   **Structure & Clarity (5 marks):** Argument is logically sequenced, precise, and free of ambiguity.

  **B-Range (21–25 Marks): Good**
  *   **Thesis & Problem Articulation (7–9 marks):** Identifies the identity problem but may not fully explicate why causal continuity fails to secure *desert* specifically.
  *   **Metaphysical Analysis (7–9 marks):** Discusses *anātman* but may rely too heavily on the "conventional self" solution without critiquing its normative limitations.
  *   **Comparative Distinctions (3–4 marks):** Distinguishes karma from Western views but may blur the line between karma-as-causation and karma-as-desert.
  *   **Structure & Clarity (3–4 marks):** Clear writing but argument may lack the density or precision of an A-range response.

  **C-Range and Below (20 Marks or fewer): Adequate to Fail**
  *   **Major Conceptual Errors:** Treats karma as fatalism or mere causation without addressing the desert component.
  *   **Metaphysical Confusion:** Implicitly assumes a soul/ātman despite the prompt's constraint, or fails to address *anātman* entirely.
  *   **Conflation:** Conflates moral desert with utility/consequentialism (e.g., arguing karma is just because it improves future behavior).
  *   **Summary vs. Analysis:** Merely summarizes Buddhist doctrines rather than evaluating the philosophical coherence of the desert claim.

  **Specific Deductions:**
  *   **-5 marks:** Failing to address the *anātman* constraint.
  *   **-5 marks:** Treating karma solely as natural causation (ignoring the "moral desert" requirement).
  *   **-3 marks:** Conflating Western retributivism with karma without noting the temporal/ontological differences.
