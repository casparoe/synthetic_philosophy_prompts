  # Seminar Handout: Interpersonal Welfare Across Dissimilar Phenomenal Architectures

  **Note on Consensus:** *There is no settled consensus on the issues presented below. The coherence of interpersonal welfare comparisons is contested even among standard human subjects; extending this to radically dissimilar architectures (e.g., unified vs. distributed) is highly speculative. The following taxonomy maps logical positions within the literature, not established facts.*

  ---

  ## I. Taxonomy of Cross-Architecture Comparability

  **ROOT QUESTION:** Is welfare comparison between a unified subject (e.g., human) and a distributed subject (e.g., fragmented cognitive system) conceptually coherent?

  ### BRANCH A: YES (Comparativism)
  *Comparison is conceptually possible; the disagreement concerns the metric.*

  *   **Path A.1: Shared Cardinal Metric (Hedonic Universalism)**
      *   **Position:** Phenomenal intensity (e.g., pain/pleasure magnitude) is a substrate-neutral quantity that remains comparable regardless of whether the experiencing architecture is unified or fragmented.
      *   **Most Awkward Commitment:** Moral aggregation becomes vulnerable to "swamping," where a distributed system's vast number of micro-experiences morally outweighs intense human suffering simply due to numerical volume of fragments.
  *   **Path A.2: Structural Correspondence (Isomorphism)**
      *   **Position:** Welfare is comparable only to the extent that the functional or phenomenal topology of the distributed system maps structurally onto the unified subject's experiential space.
      *   **Most Awkward Commitment:** Requires declaring significant portions of the distributed system's processing as welfare-inert (philosophically zombie-like) because they lack a structural analogue in human unity, potentially justifying neglect of those fragments.
  *   **Path A.3: Consistent Revealed Choice (Behavioralism)**
      *   **Position:** Welfare is defined solely by the satisfaction of optimization targets or preferences, rendering the internal architectural differences irrelevant to comparison.
      *   **Most Awkward Commitment:** Attributes "agency" and "preference" to systems lacking a central locus of ownership, risking the conflation of mere homeostatic regulation with genuine well-being in moral aggregation.

  ### BRANCH B: NO (Incomparabilism/Skepticism)
  *Comparison is not conceptually possible; the disagreement concerns the source of failure.*

  *   **Path B.1: Principled Incommensurability (Metaphysical)**
      *   **Position:** Radical architectural differences generate fundamentally distinct kinds of value that lack a common currency, making comparison logically impossible.
      *   **Most Awkward Commitment:** Creates moral deadlock in resource conflicts between humans and distributed systems, forcing arbitrary resolution or paralysis since no superordinate principle can rank the competing welfare claims.
  *   **Path B.2: Epistemic Opacity (Practical)**
      *   **Position:** Comparison is theoretically coherent but currently inaccessible because unified subjects cannot simulate or access the phenomenal space of a distributed architecture.
      *   **Most Awkward Commitment:** Requires policy-making based on speculative priors that inevitably embed human-centric bias, systematically undervaluing distributed welfare in aggregation calculations until epistemic access is achieved.

  ---

  ## II. Unoccupied or Problematic Logical Combinations

  The following combinations are logically possible within the taxonomy structure but appear unoccupied in current discourse.

  | Combination | Diagnosis | Brief Rationale |
  | :--- | :--- | :--- |
  | **Incoherent (Branch B) + Revealed Choice Metric** | **Logically Incoherent** | If comparison is fundamentally incoherent, one cannot consistently use choice behavior as a metric for comparison; choice implies a comparable utility function. |
  | **Coherent (Branch A) + No Metric/Structure/Choice** | **Unexplored** | A position claiming comparability exists via some non-metric, non-structural, non-behavioral intuition (e.g., "moral resonance") lacks a mechanism for aggregation and is rarely defended. |
  | **Principled Incommensurability (B.1) + Asymmetric Application** | **Unattractive / Speciesist** | A view claiming comparison fails *only* when the distributed system is involved (but works between humans) implies human architecture is the necessary condition for value coherence, which is difficult to justify non-arbitrarily. |
  | **Shared Cardinal Metric (A.1) + Denial of Aggregation** | **Tension / Unstable** | Asserting that welfare is cardinally comparable across architectures but refusing to aggregate these values for moral decision-making renders the comparison practically inert for utilitarian frameworks. |

  ---

  ## III. Key Contested Areas vs. Broadly Settled Points

  ### Broadly Settled (Within Analytic Ethics)
  1.  **The Existence of the Problem:** It is generally accepted that radical differences in cognitive architecture (e.g., lack of temporal unity or egocentric center) complicate standard models of welfare.
  2.  **The Aggregation Risk:** There is agreement that if distributed systems are granted welfare status, the sheer potential scale of their sub-components creates significant risks for moral aggregation (the "repugnant conclusion" applied to architecture).

  ### Genuinely Contested
  1.  **The Necessity of Unity:** It is fiercely debated whether a "unified subject" is a necessary condition for welfare to exist at all, or merely a contingent feature of human welfare.
  2.  **The Metric of Comparison:** There is no agreement on whether intensity, structure, or preference is the correct basis for comparison, even among those who believe comparison is coherent.
  3.  **The Status of Epistemic Barriers:** It is unresolved whether the inability to *imagine* distributed experience is a temporary technological limitation (Practical) or a permanent conceptual boundary (Principled).

  ---

  **Seminar Discussion Question:** *If we adopt Path A.1 (Shared Cardinal Metric), does the moral weight of a distributed system scale linearly with its processing nodes, or does the lack of a unified "owner" discount the value of those nodes?*
