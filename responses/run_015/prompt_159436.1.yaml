prompt: |-
  Hey — I need a teaching plan, not an explanation of Smith himself (I've read the chapters, I don't need them summarized). I'm running a fifty-minute discussion section next week for first-years in an intro ethics course. They've just come out of Mill and then Kant's formula of universal law, and the reading is a couple of chapters from Smith's Theory of Moral Sentiments on sympathy and the impartial spectator. I ran this section last year and it went badly: everyone walked out convinced Smith was basically a vaguer, kinder rule-utilitarian with a bit of interior monologue bolted on, one student said "so the impartial spectator is just your conscience" and I flubbed the answer, and by the end the only thing that had landed was that Smith is the capitalism guy. So: what has to come first and what depends on what — I'm guessing that sympathy as imaginative projection of someone's *situation* (rather than catching their feeling) has to be in place before propriety, and propriety before the spectator, and that the bit about general rules has to come *after* the spectator rather than before, but I'm not confident about the order or about what to leave for last.

  Two things I want built in, and I want you to tell me if either is a mistake. First, I want to teach the spectator as the destination of a loop rather than as a little person in your head: you notice you're partial, you imagine a well-informed bystander, you notice that you've rigged *that* bystander in your favour too, you imagine someone watching him, and the impartial spectator is what the sequence settles toward — the thing the recursion converges on. I like it because it explains why the spectator isn't just "what my actual peers think" without me having to dodge the relativism objection with a hand-wave, but I don't know where the framing breaks or whether it smuggles in something Smith doesn't want. Second, the hard bit as I see it is that Smith's question is about whether a passion is *proportionate* to what provoked it — the volume of the sentiment, not the rightness of the act — and I need one metaphor to carry that. I've been toying with photographic exposure versus a volume knob versus tuning an instrument; tell me which one to build the section around, what that metaphor has to have and what it must not have (I worry exposure implies a single correct setting and the knob implies more is just more), and give me the one concrete case to hang it on. I was thinking of something where the action isn't clearly wrong — someone getting visibly, disproportionately angry at a friend who turned up forty minutes late, at a table where everyone else is laughing it off — but say if a case about *resentment at a slight* is the wrong choice, and why.

  Then the misconception map, with a place in the sequence for each: the spectator as conscience; the spectator as Kant re-labelled or as Mill's impartial benevolent spectator, given that they've just had both and that all three words start with "impartial"; sympathy read as empathy or as pity/benevolence; the collapse into "morality is just what the people around you would think"; and whatever they'll form from the metaphor I use. Also: should I raise at all, at this level, whether the spectator is merely a well-informed ordinary person or something more idealized — and if not, what should I openly refuse to explain and say out loud that I'm refusing? Finally, a check: one question or task I can put to them in the last five minutes that would show they've got the structure rather than just being agreeable or just uncomfortable — ideally something that separates the spectator from the average opinion of their friends and from a rule, and something that would let me tell the difference between a student who understands it and one who has only learned to say "it depends on propriety". I'm not asking for extra readings, just the arc.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Context:** 50-minute discussion section, first-year intro ethics.
      *   **Preceding Material:** Mill (Utilitarianism), Kant (Formula of Universal Law).
      *   **Current Material:** Adam Smith, *Theory of Moral Sentiments* (Sympathy, Impartial Spectator).
      *   **Instructor's Past Failure:** Students reduced Smith to "vague rule-utilitarianism + conscience," confused spectator with conscience, fixated on "Smith = capitalism."
      *   **Instructor's Hypotheses:** Sympathy $\rightarrow$ Propriety $\rightarrow$ Spectator $\rightarrow$ General Rules. (Needs validation).
      *   **Specific Requests:**
          1.  Validate/Refine the "Recursive Loop" framing of the Spectator.
          2.  Select and refine a metaphor for *Propriety* (Exposure vs. Volume vs. Tuning) + a concrete case (Anger at lateness?).
          3.  Misconception Map (where to address specific errors in the flow).
          4.  Address the "Idealized vs. Ordinary" Spectator question (to raise or refuse?).
          5.  Final 5-minute assessment task (tests structure, not just agreement).
      *   **Constraint:** No summary of Smith, no extra readings, just the arc/plan.

  2.  **Deconstruct the Core Concepts & Order:**
      *   *Instructor's Order:* Sympathy $\rightarrow$ Propriety $\rightarrow$ Spectator $\rightarrow$ Rules.
      *   *Assessment:* This is correct. Smith builds from the psychological mechanism (sympathy) to the standard of judgment (propriety) to the internalized judge (spectator) to the codification (rules).
      *   *Why it matters:* If you start with the Spectator, it looks like Conscience (Kant) or Utility (Mill). It *must* emerge from the failure of direct sympathy.

  3.  **Address Request 1: The Recursive Loop (Spectator as Convergence):**
      *   *Idea:* Spectator isn't a homunculus; it's the limit of a process of correcting partiality.
      *   *Validation:* This is philosophically robust and pedagogically superior to "little man in the head." It avoids the "who watches the watchman?" regress by defining the spectator as the *stable point* of the reflection, not an actual agent.
      *   *Risk:* It might sound too mathematical/abstract for first-years.
      *   *Fix:* Ground it in the *effort* to communicate. We lower our anger to meet them; they raise their sympathy to meet us. The Spectator is the point where communication succeeds.
      *   *Verdict:* Keep it, but simplify the language. Call it "The Calibration Process."

  4.  **Address Request 2: The Metaphor for Propriety:**
      *   *Options:*
          *   *Volume Knob:* Implies more emotion = louder. Bad. Smith isn't about suppression, but fit.
          *   *Photographic Exposure:* Implies one "correct" light. Too rigid. Smith allows for cultural/historical variance in propriety.
          *   *Tuning an Instrument:* **Winner.** It implies resonance, harmony between two parties (agent and spectator), and that being "out of tune" isn't necessarily "evil," just discordant. It captures the *relational* aspect of sympathy.
      *   *Case Study:* Anger at lateness.
      *   *Critique:* Is resentment at a slight wrong? No, Smith says resentment is useful for justice. But *disproportionate* resentment is improper.
      *   *Refinement:* The case needs to show the *gap* between what the agent feels and what the spectator can enter into. The "40 mins late" case is good because it's ambiguous. Everyone has been late; everyone has waited.
      *   *Metaphor Constraint:* Must not imply objective truth (like exposure) or mere intensity (like volume). Tuning implies *matching*.

  5.  **Address Request 3: Misconception Map:**
      *   *Spectator = Conscience:* Address immediately when introducing the Spectator. Distinguish: Conscience is internal voice; Spectator is imagined external perspective internalized.
      *   *Spectator = Kant/Mill:* Address after the Loop. Kant = Rule; Mill = Outcome; Smith = Sentiment/Relation.
      *   *Sympathy = Empathy/Pity:* Address at the very start (Sympathy). Smith's sympathy is cognitive (imagining the situation), not just catching feelings.
      *   *Relativism (Peers):* Address during the Loop/Calibration. The spectator is *well-informed*, not just *present*.
      *   *Metaphor Misunderstanding:* Address during the case study application.

  6.  **Address Request 4: Idealized vs. Ordinary Spectator:**
      *   *Decision:* Do not open the "Idealized" can of worms in a 50-min intro section. It leads to "So who decides who is well-informed?"
      *   *Strategy:* Explicitly bracket it. "We are treating the Spectator as the *best version* of the people around you, not a divine voice, not just the average." Refuse to solve the 'who constructs the spectator' problem today.

  7.  **Address Request 5: Final Assessment Task:**
      *   *Goal:* Distinguish structural understanding from "it depends."
      *   *Idea:* A scenario where the "Average Peer" view conflicts with the "Impartial" view, AND where a Rule (Kant) or Outcome (Mill) gives a different answer.
      *   *Scenario:* Whistleblowing? Dueling? (Too historical).
      *   *Scenario:* Grief. (Classic Smith).
      *   *Better Scenario:* A cultural practice the students dislike but is normal elsewhere.
      *   *Best Scenario:* "The Excessive Mourner." Someone grieving a pet more than a parent.
      *   *Task:* Don't ask "Is it wrong?" Ask "Where does the friction lie?"
      *   *Refined Task:* "Identify the mismatch." Who is failing to tune to whom?

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Time Management:* 50 mins is tight.
      *   0-5: Hook & Sympathy (Kill "Empathy").
      *   5-15: Propriety (The Tuning Metaphor + Lateness Case).
      *   15-30: The Spectator (The Loop/Calibration).
      *   30-40: Misconception Check (vs. Kant/Mill).
      *   40-45: Idealized vs. Ordinary (Bracketing).
      *   45-50: Exit Ticket/Assessment.
      *   *Wait, 50 mins goes fast.* Need to merge Misconception Check into the flow rather than a separate block.
      *   *Revised Flow:*
          1.  Sympathy (5 mins)
          2.  Propriety + Metaphor + Case (15 mins)
          3.  Spectator Loop (15 mins)
          4.  Contrast w/ Kant/Mill (10 mins)
          5.  Exit Task (5 mins)

  9.  **Refining the "Loop" Idea:**
      *   The instructor's idea is: Notice partiality $\rightarrow$ Imagine bystander $\rightarrow$ Notice bystander is rigged $\rightarrow$ Imagine watcher of bystander $\rightarrow$ Convergence.
      *   *Smith's Text:* Smith talks about dividing ourselves into the "agent" and the "spectator."
      *   *Pedagogical tweak:* Call it "The Distance Game." We can't feel what they feel. We feel what *we would* feel. They know this. So they lower their expression. We try to raise our imagination. The Spectator is the meeting point.
      *   *Is it a mistake?* No, it's actually a very sophisticated reading (reminiscent of contemporary constructivist readings of Smith). It prevents the "Conscience" error effectively.

  10. **Refining the Metaphor:**
      *   *Tuning:* Two guitars. If one is sharp (too angry) and one is flat (too indifferent), they don't harmonize. Propriety is the harmony.
      *   *Why not Exposure?* Exposure implies the world dictates the setting. Smith says *social interaction* dictates the setting.
      *   *Why not Volume?* Volume implies quantity. Smith cares about *quality of fit*.
      *   *Case:* The Lateness case is perfect. It's low stakes, so moralizing doesn't hijack it.

  11. **Refining the Exit Task:**
      *   Need to test: Spectator $\neq$ Average Opinion AND Spectator $\neq$ Rule.
      *   *Prompt:* "Your friend is furious at a waiter for bringing the wrong soup. Everyone else at the table is laughing. You are hungry. Apply Smith."
      *   *Good Answer:* Identifies the lack of harmony between Friend and Table. Identifies that *you* (the spectator) cannot enter into the friend's anger.
      *   *Bad Answer:* "It's rude." (Rule) or "It makes everyone unhappy." (Mill).
      *   *Better Prompt:* Make them identify *whose* sentiment needs adjusting.

  12. **Final Review against Constraints:**
      *   No summary of Smith? Check.
      *   Address the "Loop" validity? Check.
      *   Select Metaphor + Case? Check.
      *   Misconception Map placement? Check.
      *   Idealized vs. Ordinary decision? Check.
      *   Exit Task? Check.

  13. **Writing the Response:** (Focusing on tone: professional, direct, pedagogical, respecting the instructor's expertise). *Self-Correction during drafting:* Make sure to explicitly warn about the "Capitalism" distraction. Keep it brief. Ensure the distinction between Smith's "Sympathy" and modern "Empathy" is sharp.

      *   *Key Insight:* The instructor's "Loop" is essentially Smith's concept of "mutual sympathy." I need to make sure they don't present it as an infinite regress, but as a *negotiation*.
      *   *Key Insight on Metaphor:* Tuning is best, but emphasize that *both* parties tune. The angry person lowers anger; the spectator raises sympathy.
      *   *Key Insight on Exit Task:* Make it a "Diagnose the Discord" task.

      *(Self-Correction on the "Idealized" question)*: If I tell them to refuse to explain it, I need to give them the script. "We are bracketing the origin of the spectator to focus on its function."

      *(Self-Correction on Misconceptions)*: Don't list them as a lecture. Embed the corrections in the questions asked to students.

      *Let's build the timeline.*
      0-5: Sympathy (Not Empathy).
      5-20: Propriety (Tuning + Lateness).
      20-35: Spectator (The Loop).
      35-45: Contrast (Kant/Mill/Relativism).
      45-50: Assessment.

      *Wait, one more thing:* The instructor asked "what has to come first and what depends on what." I need to explicitly validate their ordering hypothesis. Yes, Sympathy $\rightarrow$ Propriety $\rightarrow$ Spectator is the only way this works.

      *Okay, ready to write.*
answer: |-
  Here is a 50-minute discussion plan designed to prevent the specific failures you encountered last year. It validates your structural hypotheses, refines your metaphors, and embeds the misconception corrections into the flow rather than treating them as separate lectures.

  ### 1. Structural Validation: The Order of Operations
  Your intuition is correct. You cannot teach the Spectator before Propriety, and you cannot teach Propriety before Sympathy.
  *   **Sympathy** is the mechanism (how we connect).
  *   **Propriety** is the standard of that connection (does the sentiment fit the cause?).
  *   **The Spectator** is the internalized tool we use to judge Propriety when we are too emotional to see clearly.
  *   **General Rules** are the sediment left behind after repeated judgments of Propriety (teach this only if time permits, otherwise omit; it is the easiest place for them to slide back into Kant/Rule-Utilitarianism).

  **The Fix for Last Year:** Do not introduce the "Impartial Spectator" until minute 20. If you introduce it earlier, they will import their definitions of Conscience (Kant) or Utility (Mill) into the term before they understand Smith's specific mechanics of *sentiment*.

  ---

  ### 2. The Metaphor & The Case (Minutes 5–20)
  **The Metaphor: Tuning an Instrument.**
  Discard *Exposure* (implies one objective truth determined by the world) and *Volume* (implies intensity is the metric). Use **Tuning**.
  *   **Why:** Tuning requires two parties (the Agent and the Spectator) to come into harmony. It is relational, not monological. It allows for variance (different songs/keys) without implying "anything goes."
  *   **What it must have:** It must emphasize that *both* sides adjust. The angry person lowers their pitch; the spectator tries to stretch their range to meet them.
  *   **What it must not have:** Do not imply there is a single "Perfect Pitch" for all humanity. There is a "correct" pitch *for this specific interaction*.

  **The Case: The Forty-Minute Lateness.**
  This is the correct choice. Do not use a case about *resentment at a slight* (e.g., an insult) yet, because students will immediately jump to "Justice/Rights" (Kant) or "Harm" (Mill). Lateness is a "low stakes" social friction where Propriety is the *only* metric.
  *   **The Setup:** Friend A is 40 minutes late. Friend B is visibly shaking with rage. Friend C and D are laughing it off.
  *   **The Smithian Question:** Is Friend B *wrong*?
  *   **The Trap:** If they say "Yes, it's rude," they are doing Rules. If they say "Yes, it causes bad vibes," they are doing Mill.
  *   **The Smithian Answer:** Friend B's passion is *disproportionate* to the cause relative to the company kept. We cannot "tune" our sympathy to match that level of rage. Therefore, it is *improper*, not necessarily *unjust*.

  ---

  ### 3. The Spectator as a Loop (Minutes 20–35)
  **Your "Recursive Loop" framing is philosophically sound and pedagogically superior.** It prevents the "Homunculus" error (a little person in the head).
  *   **The Framing:** Do not call it a "Loop" (sounds infinite). Call it **"Calibration."**
  *   **The Script:** "When I am angry, I am partial. I try to imagine what you think of me. But I might imagine you are more forgiving than you are. So I try to imagine what a *neutral* person thinks of me imagining you. The Impartial Spectator is not a voice; it is the point where this calibration stops wobbling. It is the stable setting."
  *   **Why this works:** It explains why the Spectator isn't just "what my peers think." My peers might be drunk or biased. The Spectator is the *well-informed* peer. The recursion strips away the specific biases of the actual people in the room.
  *   **Where it could break:** If you make it sound too mathematical. Keep it grounded in the *effort to be understood*. We seek mutual sympathy. The Spectator is the judge of whether that mutual sympathy is possible.

  ---

  ### 4. The Misconception Map (Embedded)
  Do not list these as "Common Errors." Address them by asking questions that force the error to surface, then correct it.

  | Misconception | When to Trigger | How to Correct |
  | :--- | :--- | :--- |
  | **Sympathy = Empathy/Pity** | **Min 0-5.** Ask: "If I am delirious with fever, do I want you to feel my pain?" | Smith says no. You want me to feel *for* my situation. Sympathy is cognitive imagination, not emotional contagion. |
  | **Spectator = Conscience** | **Min 25.** When introducing the Spectator. | Conscience is a voice that says "Don't." The Spectator is a perspective that asks "Can you meet me here?" One prohibits; the other calibrates. |
  | **Spectator = Kant/Mill** | **Min 35.** Comparison phase. | Kant asks: "Can this be a law?" Mill asks: "Does this maximize good?" Smith asks: "Can I resonate with this feeling?" |
  | **Spectator = Peer Pressure** | **Min 30.** During Calibration. | If my peers are racist, the Spectator is not them. The Spectator is the *well-informed* bystander. We bracket the biases of the actual crowd. |
  | **Metaphor Error (Rigidity)** | **Min 15.** During Tuning. | If they say "But anger is never okay," remind them: Tuning depends on the song. Anger at injustice *is* proper. Anger at lateness is not. Context sets the key. |

  ---

  ### 5. The "Idealized vs. Ordinary" Question
  **Do not open this can of worms.**
  In a 50-minute intro section, asking "Who constructs the Spectator?" leads to a relativism黑洞 (black hole) you cannot escape.
  *   **The Move:** Explicitly bracket it.
  *   **The Script:** "You might ask: 'Who decides what the Impartial Spectator thinks? Is it society? Is it God? Is it reason?' Smith is ambiguous here, and we are not solving that today. For this section, treat the Spectator as the **best version of the people around you**—the version that knows all the facts and isn't currently hungry or tired. We are studying the *function* of the Spectator, not its *origin*."
  *   **Why:** This stops the smartest student from derailing the section with a meta-ethical objection while acknowledging their insight.

  ---

  ### 6. The Exit Task (Minutes 45–50)
  You need a task that separates structural understanding from "it depends."
  **The Prompt:**
  > "A student gives a presentation. They are visibly trembling and tearful because they are nervous. The audience feels awkward and looks away.
  >
  > 1.  **Kant** would ask: \_\_\_\_\_\_\_\_\_\_
  > 2.  **Mill** would ask: \_\_\_\_\_\_\_\_\_\_
  > 3.  **Smith** would ask: \_\_\_\_\_\_\_\_\_\_
  >
  > For Smith: Is the student's sentiment *improper*? Is the audience's sentiment *improper*? Who needs to 'tune'?"

  **Grading Rubric (Mental Check):**
  *   **Failure:** "Smith says be nice." / "Smith says follow the rules." / "It depends on the culture."
  *   **Pass:** Identifies that Smith asks about the *proportion* of the feeling to the cause.
  *   **Distinction:** Identifies that **both** parties might be out of tune. The student's fear is disproportionate to the danger (needs to lower); the audience's awkwardness shows a lack of imaginative effort (needs to raise sympathy). The Spectator is the point where the student feels safe enough to stop crying and the audience feels connected enough to look up.

  ### 7. The "Capitalism" Distraction
  You mentioned they fixated on "Smith = Capitalism."
  *   **Pre-emption:** In the first 2 minutes, say: "Adam Smith wrote two famous books. One is about markets (*Wealth of Nations*), one is about morals (*Moral Sentiments*). Today we are in the moral book. If you bring up money or markets, I will write a dollar sign on the board and ignore it until the last minute. We are talking about anger, grief, and lateness, not prices."

  ### Summary of the Arc
  1.  **0-5:** Sympathy is Imagination, not Contagion. (Kill "Empathy").
  2.  **5-20:** Propriety is Tuning, not Rules. (Lateness Case).
  3.  **20-35:** Spectator is Calibration, not Conscience. (The Loop).
  4.  **35-40:** Contrast vs. Kant/Mill. (Structure check).
  5.  **40-45:** Bracket the "Origin" question. (Prevent Relativism spiral).
  6.  **45-50:** Exit Task. (Verify Structure).

  This order ensures they understand *why* the Spectator is needed (because direct sympathy fails) before they are asked to define *what* it is.
