answer: |-
  In the intensive care unit at St Jude's, Mr Henderson is suffering from a rare neurological condition triggered by specific electrical frequencies, and the only available treatment involves a delicate laser procedure that requires the entire local grid to maintain a perfectly stable voltage for forty-five minutes. To achieve this stability, the energy provider has activated a voluntary demand-response protocol requiring exactly ten thousand households in the catchment area to defer using high-draw appliances during the window, an inconvenience costing each roughly twenty minutes of lost productivity or comfort. The system is engineered with a fail-safe continuity check: if even a single household draws excess power, the voltage fluctuates instantly, aborting the procedure and ensuring Mr Henderson's death, meaning every participant holds an effective silent veto over his survival simply by continuing their normal routine.

  Right, let's unpack this over our coffees. On a straight aggregative view, like classical utilitarianism, the calculation is brutally arithmetic. You take the disvalue of ten thousand missed breaks—let's say each is a minor frustration—and sum them up. Even if each burden is small, the collective weight of ten thousand of them is presumed to outweigh the single catastrophe of Mr Henderson's death, or at least compete seriously with it. The utilitarian sees a pool of welfare; they don't care about the distribution of the burden, only that the total net benefit is positive. If the sum of saved life exceeds the sum of lost breaks, the moral duty is to participate, and the mechanism's design is irrelevant except as a causal fact.

  Scanlon's contractualism, however, refuses to swim in that pool. It asks whether a principle permitting this rescue could be reasonably rejected by any individual party. Crucially, Scanlon does not allow us to aggregate the complaints of the ten thousand households against the complaint of the one dying man. We must compare the strongest individual complaint on one side (Mr Henderson's loss of life) against the strongest individual complaint on the other (one neighbour's lost twenty minutes). Normally, Scanlon favours the life, because death is a far stronger ground for rejection than a minor inconvenience. However, your scenario stipulates that the burden is of a type each person *could* reasonably reject being made to bear for a stranger. If we accept that premise, Scanlon suggests there is no duty to participate, because the principle demanding cooperation is rejectable by each individual agent. The veto doesn't change the justification; it merely empowers the individual to act on that rejection.

  The structural feature doing the heavy lifting here is the **veto**, which enforces **pivotality**. By making each person individually necessary for the rescue, the veto prevents the burdens from being treated as a collective sum that can override individual rights. It forces the moral justification to stand or fall on a one-to-one comparison: my twenty minutes versus his life. If you strip away the veto—say, the procedure works if 9,999 people participate—the scenario collapses back into a bog-standard aggregation case with a dilution of responsibility. Without the veto, my individual contribution is causally negligible; if I opt out, Mr Henderson still lives (assuming others step up). In that stripped-back version, the utilitarian still demands participation based on marginal expected utility, but the Scanlonian analysis becomes murkier, shifting from a direct conflict of interests to a question of fair play in a collective scheme. The veto isolates the moral transaction, ensuring that the inability to aggregate burdens doesn't just vanish into the crowd; it keeps the individual's power to reject front and centre, making the failure to save Mr Henderson a direct result of ten thousand separate, justified vetoes rather than a tragic sum of small costs.
