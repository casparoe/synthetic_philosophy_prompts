  2.  **Deconstruct Machiavelli's Philosophy:**
      *   *Virtù*: Requires active engagement, foresight, adaptability, and ultimately, the Prince's will to command. It implies mastery over circumstances.
      *   *Fortuna*: The unpredictable element, luck, chaos. It must be restrained or channelled (like a river), but never fully trusted.
      *   *Control*: A Prince must never relinquish agency. Dependence on mercenaries or auxiliaries is dangerous because they are not fully under his control. Similarly, relying on something opaque and unoverrideable undermines the Prince's authority.
      *   *Opacity*: If the ruler cannot understand or override the system, he is not ruling; he is serving the system.

  3.  **Evaluate the Algorithm:**
      *   It distributes resources and flags threats (core sovereign functions).
      *   No single official understands it (opacity).
      *   No single official can override it (loss of agency).
      *   This sounds like *fortuna* disguised as technology. It dictates outcomes without human will.

  4.  **Drafting the Argument:**
