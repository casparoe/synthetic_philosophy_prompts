  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Ontology and Normativity of Collective Intentionality
  **Parties:** [User Name] (Reductionist/Bratmanian) and Priya (Plural Subject/Gilbertian)
  **Date:** October 26, 2023
  **Origin:** Arising from disputes commencing at the Community Orchestra Rehearsal (Sight-Reading Session, Conductor Inaudible)

  ---

  ## 1. AGREED CLAIMS
  *We affirm the following propositions as the common ground upon which our disagreement rests. These claims are intended to be non-vacuous descriptions of the phenomenological and functional data that any adequate theory must explain.*

  1.  **The Coordination Constraint:** Joint action requires more than the mere coincidence of individual actions; it requires that the actions are meshed in such a way that the success of one participant's plan depends on the execution of the other's.
  2.  **The Phenomenology of Agency:** Participants in successful joint action typically report a first-person experience distinct from solitary action, often described as acting as a "unit" or "team," regardless of whether this reflects a metaphysical reality.
  3.  **The Reactive Attitude Baseline:** When a participant defects from a joint activity without cause, the partner experiences a specific form of resentment or betrayal that is qualitatively different from the disappointment felt when a natural obstacle prevents the action.
  4.  **Common Knowledge Requirement:** For an activity to count as joint, it is necessary (though we disagree on sufficiency) that the participants possess common knowledge (or mutual belief) regarding the intention to perform the activity together.
  5.  **Output Equivalence:** In standard cases (e.g., painting a house together, walking together), both our accounts predict the same behavioral outputs and the same attribution of responsibility. Our disagreement concerns the underlying machinery and the source of normative force, not the classification of paradigmatic cases.

  ---

  ## 2. DISAGREEMENTS TABLE
  *The following claims represent the core ontological and normative divergences. Each formulation is written in the voice of the proponent to ensure steel-manning.*

  | Domain | Reductionist Formulation ([User]) | Plural Subject Formulation (Priya) |
  | :--- | :--- | :--- |
  | **Ontology of Intention** | "We intend to J" is analyzable without remainder into: (1) I intend that we J, (2) You intend that we J, (3) We have common knowledge of (1) and (2), and (4) Our intentions are interlocking and responsive. There is no distinct collective mental state. | "We intend to J" is a primitive social fact constituted by a **joint commitment**. It is not reducible to the sum of personal intentions. The "We" is the subject of the intention, not merely the object of individual intentions. |
  | **Source of Obligation** | The obligation to follow through derives from ordinary moral principles (e.g., fidelity, reliance, non-manipulation) applied to the interdependence of our individual plans. If I let you down, I violate a moral duty *to you*. | The obligation is internal to the joint commitment itself. By entering the "We," we create a new normative status. I owe it to *us*, not just to you as an individual. This obligation exists even if no independent moral principle of reliance applies. |
  | **Power of Rescission** | Because the commitment is constituted by my individual intention, I can unilaterally withdraw my intention. This may violate a moral duty, but it successfully dissolves the joint intention structurally. | Because the commitment is joint, it cannot be rescinded unilaterally. One party cannot dissolve the "We" alone; it requires a joint decision to stop, even if one party physically stops acting. |

  ---

  ## 3. CRUXES AND PREDICTIONS
  *We have identified three edge cases and two diagnostic tests where our theories diverge in their predictions. We commit to accepting the empirical or intuitive verdict of these cases as evidence weighing for or against our respective positions.*

  ### Crux 1: The Laggy Duet (Timescale of Responsiveness)
  **Case:** Two musicians in different cities play together over a link with a fixed 400ms delay. They cannot hear each other within a musical phrase. They compensate via anticipatory planning and agree on takes over chat. They sound like an ensemble.
  **The Question:** Does mutual responsiveness require real-time feedback loops during the action, or can anticipatory structure substitute for it to sustain a "We-intention"?

  | Position | Prediction & Rationale |
  | :--- | :--- |
  | **Reductionist** | **Verdict: Joint Action Exists.** <br> The interlocking intentions were formed during the chat planning. The "mutual responsiveness" is satisfied by the adjustment of individual plans to accommodate the known delay. The "We" is sustained by the continued individual commitment to the joint plan, even if real-time control is impossible. |
  | **Plural Subject** | **Verdict: Parallel Action (No Joint "We" in the moment).** <br> While there was a prior joint commitment to *try*, the actual performance lacks the co-constitutive interaction required for a shared agency *in the moment*. Without the capacity to adjust *together* within the timeframe of the action, they are two individuals executing a script, not a plural subject acting. |

  ### Crux 2: The Unbriefed Choreography (Bootstrapping Commitment)
  **Case:** Two strangers, no prior communication, memorize the same routine from a viral video. They meet on a dance floor, recognize the song, and begin the routine, adjusting to each other's spacing mid-dance.
  **The Question:** Can common knowledge bootstrap a joint commitment without an express (even tacit) communicative act of agreeing to commit?

  | Position | Prediction & Rationale |
  | :--- | :--- |
  | **Reductionist** | **Verdict: Joint Action Exists.** <br> The moment they recognize each other and adjust spacing, they form interlocking intentions ("I intend that we dance this" / "You intend that we dance this") supported by common knowledge of the mutual adjustment. The signaling is in the movement itself. |
  | **Plural Subject** | **Verdict: No Joint Commitment.** <br> Matching behavior is not enough. A joint commitment requires an express (even if tacit) *agreement* to be bound together. Without a moment of "Shall we?" (verbal or nod), they are merely co-participating in a public practice. The "We" requires a mutual pledge, not just mutual recognition. |

  ### Crux 3: The Mixed Trio (Non-Agent Participation)
  **Case:** Two humans and a Language Model (AI) plan a surprise party in a group chat. The AI tracks commitments, proposes times, and nudges flaking humans. The humans offload memory and coordination to the AI.
  **The Question:** Does the reductionist account collapse if the "interlocking" is partly mediated by a non-agent? Is there a "We" that includes the AI, or is the human "We" degraded?

  | Position | Prediction & Rationale |
  | :--- | :--- |
  | **Reductionist** | **Verdict: Human "We" Intact; AI is a Tool.** <br> Joint intention requires intending agents. The AI does not intend; it simulates. However, the humans still have interlocking intentions *with each other*, using the AI as a sophisticated scaffold. The "We" is strictly between the humans. |
  | **Plural Subject** | **Verdict: Degraded Joint Commitment.** <br> A joint commitment creates obligations. You cannot have an obligation *with* a tool. If the humans rely on the AI to hold the commitment structure (memory/nudging), the normativity of the "We" is compromised. The "We" becomes fragile because one 'partner' cannot be rebuked or hold the others to account. |

  ### Diagnostic Test A: The Silent Release
  **Procedure:** In an ongoing joint project, I tell you: *"You're off the hook. Don't worry about the plan. I'm handling it."* You continue working.
  **The Question:** Does your reason to keep going survive my say-so?

  | Position | Prediction |
  | :--- | :--- |
  | **Reductionist** | **Dissolves.** <br> My intention was a necessary condition for the interlock. If I revoke my intention (or release you from the reliance), the structural basis for your intention is gone. You may continue, but not *with me*. |
  | **Plural Subject** | **Persists.** <br> The commitment is owed to the "Us." I cannot unilaterally release you from a debt owed to the plural subject. You remain bound until *we* agree to stop, even if I say I'm handling it. |

  ### Diagnostic Test B: The Third-Party Rebuke
  **Procedure:** You bail on our joint plan without warning. A third party (uninvolved, unaffected) observes this and rebukes you: *"You shouldn't have done that."*
  **The Question:** Is the third party entitled to rebuke you?

  | Position | Prediction |
  | :--- | :--- |
  | **Reductionist** | **No Standing.** <br> The obligation was interpersonal (owed to me). The third party has no standing to rebuke unless they are invoking a general moral principle (e.g., "lying is wrong"), but they cannot rebuke you for violating *our* specific joint intention. |
  | **Plural Subject** | **Has Standing.** <br> The joint commitment creates a social norm that exists in the public space. The "We" is a social fact. Therefore, any member of the community can rightly rebuke the defector for violating the normative structure of joint commitment. |

  ---

  ## 4. CLOSING: THE MERELY VERBAL HYPOTHESIS
  *We suspect that at least a portion of our year-long argument stems from a category error regarding the target of our analysis.*

  **The Hypothesis:**
  The Reductionist ([User]) is treating "Shared Intention" as a **psychological kind** within a mature folk psychology—a description of cognitive architecture and planning states. The Plural Subject (Priya) is treating "Joint Commitment" as a **normative status** within a social practice—a description of rights, obligations, and entitlements.

  **Implications:**
  1.  **If this hypothesis is correct:** We are not disagreeing about the world, but about the dictionary. The Reductionist is right that there is no "ghost in the machine" (no extra mental substance), and the Plural Subject is right that there is a "normative ghost" (a social reality of obligation that cannot be reduced to individual morality).
  2.  **If this hypothesis is incorrect:** Then the normative status *supervenes* on the psychological kind in a way we dispute. Specifically, we disagree on whether the *psychology alone* (interlocking intentions) is sufficient to generate the *normativity* (sui generis obligation).

  **Agreed Next Step:**
  We will treat the **Silent Release** and **Third-Party Rebuke** tests as the arbiters for the "Normative Status" claim, and the **Laggy Duet** as the arbiter for the "Psychological Kind" claim. If our predictions hold, we will acknowledge that "Collective Intentionality" may need to be split into two distinct concepts: *Coordinated Agency* (Reductionist) and *Joint Obligation* (Plural Subject).

  **Signed,**

  _________________________ (Reductionist)

  _________________________ (Plural Subject)
