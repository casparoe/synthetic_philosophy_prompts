  6.  **Address Question 4: Meaning from Above:**
      *   Yes, this is central.
      *   Christ: Meaning generated from within (suffering, choice, love).
      *   Inquisitor: Meaning imposed from without (dogma, ritual, hierarchy).
      *   The "Secret": The rulers bear the burden of knowledge (good and evil) so the masses don't have to. This is a vicarious morality.

  7.  **Synthesize and Structure the Essay:**
