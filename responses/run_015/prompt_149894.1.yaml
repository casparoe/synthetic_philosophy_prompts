  5.  **Developing the Content (Mental Simulation):**

      *   *Desideratum 1: Phenomenological Heterogeneity.* (NN). If we say all pleasure feels the same (a "tingle"), we lose the distinction between eating cake and hearing good news.
      *   *Desideratum 2: The Hedonic Tone/Attitude.* (NN). There must be *something* that makes it pleasure and not pain or indifference. Let's call it a "pro-attitude" or "felt goodness."
      *   *Desideratum 3: Independence from Desire.* (NN). As per prompt: satisfied desire can be cold.
