      *   *Desideratum 5: Preference Independence.* (NN). Prompt specific: pleasure persists even when preferences are frustrated (e.g., masochism or surprise).
      *   *Desideratum 6: Scalar Comparability.* (N). If we can't compare them, hedonism (maximization) fails.

