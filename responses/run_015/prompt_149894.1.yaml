answer: |-
  Here is the specification of desiderata for a theory of pleasure capable of sustaining your character's psychology and resolving the heterogeneity problem. I have structured this not as a survey of existing schools, but as a set of functional constraints any viable account must meet to avoid collapsing into incoherence or irrelevance.

  ### The Desiderata List

  **1. The Constraint of Phenomenological Heterogeneity (Non-Negotiable)**
  *   **Requirement:** The theory must admit that the *feel* of tasting a peach, the *feel* of a rival's failure, and the *feel* of being watched are qualitatively distinct. There is no single "pleasure sensation" (like a warm glow) that accompanies all of them.
  *   **Motivating Case:** If you posit a uniform qualitative feel, you cannot account for your character's "displaced pleasures." The thrill of a stranger's triumph she never witnesses lacks the sensory immediacy of gustatory pleasure. If the theory demands a sensory "tingle," her experience is ruled out as conceptually impossible. Dropping this constraint saves a simple theory but loses the phenomenon of complex human affect.
  *   **Status:** **Non-Negotiable.** Without this, we are describing a specific type of sensory gratification, not pleasure *simpliciter*.

  **2. The Constraint of Hedonic Unity (Non-Negotiable)**
  *   **Requirement:** Despite the heterogeneity above, the theory must identify a single property or relation that makes all these states *pleasures* rather than pains, neutral states, or mere cognitions. There must be a "common currency" that allows them to be weighed against one another (otherwise, "maximizing pleasure" is meaningless).
  *   **Motivating Case:** If there is absolutely nothing in common between eating cake and schadenfreude other than the word we use, then Hedonism (the pursuit of pleasure) collapses. Your character seeks *satisfaction* across these domains; if they aren't instances of the same genus, her pursuit is fragmented and unintelligible.
  *   **Status:** **Non-Negotiable.** Without this, we no longer have a theory of pleasure, only a taxonomy of unrelated positive states.

  **3. The Constraint of Desire-Independence (Non-Negotiable)**
  *   **Requirement:** Pleasure must be distinguishable from the satisfaction of a prior desire. One can have pleasure without prior desire (surprise), and desire-satisfaction without pleasure (the cold relief of finishing a tedious task).
  *   **Motivating Case:** Your character experiences "recursive awareness" pleasure (enjoying being observed). She may not have *desired* to be observed prior to the moment, yet the pleasure exists. Conversely, she might desire a resolution to a plot point, feel cold satisfaction when it arrives, but feel no *pleasure*. If pleasure is just "getting what you want," her specific affective state vanishes.
  *   **Status:** **Non-Negotiable.** Collapsing pleasure into desire-fulfillment eliminates the specific phenomenological weight your character privileges.

  **4. The Constraint of Intentional Flexibility (Negotiable)**
  *   **Requirement:** The theory must accommodate pleasures with objects (enjoying *that* X happened), pleasures without objects (free-floating mood), and pleasures with displaced objects (enjoying X without witnessing it).
  *   **Motivating Case:** This addresses your "shadow pleasures." A theory that requires a bodily location (somaticism) fails here. A theory that requires a specific intentional object (propositionalism) fails for shadow pleasures. The theory must allow the "aboutness" of pleasure to vary or vanish without ceasing to be pleasure.
  *   **Status:** **Negotiable.** Some traditions insist pleasure must always be intentional (about something). However, to capture "shadow pleasures," this commitment must be dropped or modified. It is a theoretical cost worth paying to save the phenomenon.

  **5. The Constraint of Preference-Resilience (Non-Negotiable)**
  *   **Requirement:** Pleasure must be capable of persisting even when explicit preferences are frustrated.
  *   **Motivating Case:** This is crucial for your character's "malicious or vicarious enjoyment." She may prefer (morally or prudentially) not to enjoy a rival's failure, yet she *does* enjoy it. If pleasure is defined by alignment with preference, this "forbidden enjoyment" becomes a contradiction. The theory must allow pleasure to be a rogue force, independent of the agent's own verdict on what they should want.
  *   **Status:** **Non-Negotiable.** Without this, you cannot account for akrasia (weakness of will) or guilty pleasure, which are central to the psychological depth you are exploring.

  **6. The Constraint of Commensurability (Negotiable)**
  *   **Requirement:** The theory should ideally allow different types of pleasure to be compared in intensity or duration to allow for rational choice.
  *   **Motivating Case:** If the pleasure of "displaced triumph" is incommensurable with "gustatory relief," your character cannot make trade-offs. However, strict quantification might force a reductionism that violates Constraint #1.
  *   **Status:** **Negotiable.** One might accept a "partial ordering" of pleasures rather than a strict scalar metric. Insisting on strict mathematical comparability is a commitment of utilitarian traditions, not necessarily required for a phenomenological account.

  ***

  ### The Fracture: Where the Tension Becomes Critical

  The fracture occurs between **Desideratum #2 (Hedonic Unity)** and **Desideratum #1 (Phenomenological Heterogeneity)**, exacerbated by **Desideratum #4 (Intentional Flexibility)**.

  To satisfy Unity (#2), you need a common factor.
  To satisfy Heterogeneity (#1), that factor cannot be a specific feeling (like a buzz).
  To satisfy Intentional Flexibility (#4), that factor cannot be a specific relation to an object (since shadow pleasures lack objects).

  **The Fracture Point:**
  If you define the common factor as a **Hedonic Tone** (a way of feeling), you risk violating Heterogeneity (it starts to look like a specific feeling again).
  If you define the common factor as an **Attitude** (e.g., "intrinsically wanting the experience to continue"), you risk violating Desire-Independence (#3) (it collapses into desire).
  If you define the common factor as a **Functional Role** (e.g., "reinforcing behavior"), you risk losing the Phenomenology entirely (it becomes a mechanical process your character doesn't feel).

  **The Specific Tension for Your Character:**
  Your character's "displaced pleasure" is highly intentional (it is *about* the stranger) but phenomenologically thin (no bodily sensation). Her "shadow pleasure" is phenomenologically distinct (a mood) but intentionally empty.
  To unite these under one theory of "Pleasure," you must posit a commonality so abstract it risks being empty. If the only thing linking the taste of wine to the joy of a stranger's success is that "both are pro-attitudes," you have saved the theory but lost the *texture* of the experience. The fracture is this: **The more successfully you unify these states to save Hedonism, the more you drain the specific qualitative content that makes your character's experience rich and distinct.** You risk solving the philosophical puzzle by defining "pleasure" so broadly it no longer maps to the lived reality you are writing.

  ***

  ### The Unresolvable Condition

  I would conclude the heterogeneity problem is genuinely unresolvable—and that Hedonism is a category error—if the following argument holds:

  **The Argument from Radical Discontinuity:**
  If it can be demonstrated that there is no psychological mechanism, neural correlate, or phenomenological structure shared between "sensory pleasure" and "propositional pleasure" (like your character's displaced triumph) other than the retrospective linguistic label we apply to them.

  **The Counterexample that Breaks It:**
  Imagine a case of **"Blind Pleasure."** Suppose a subject reports intense pleasure, but:
  1.  They have no desire for the state to continue (violating Attitude theories).
  2.  They have no sensory qualia associated with it (violating Sensation theories).
  3.  It does not reinforce behavior or learning (violating Functional theories).
  4.  It is not about any object or state of affairs (violating Intentional theories).

  If such a state is conceptually coherent and genuinely possible, then "pleasure" has no essence. It is a "family resemblance" concept only. If this is true, any theory attempting to find a *common factor* (Desideratum #2) is chasing a ghost. The concept "pleasure" would be like the concept "game"—useful, but without a defining essence. This would render Hedonism (as a maximization project) impossible, as you cannot maximize a family resemblance.

  ***

  ### The Weakest Point of This Framework

  The weakest point is **Desideratum #2 (Hedonic Unity)** itself.

  A critic arguing for **Pure Family Resemblance** will attack here. They will argue that by insisting on a "common factor" to satisfy the demands of Hedonism, you are forcing a metaphysical unity onto a psychological diversity that doesn't exist.

  **Why this is the vulnerability:**
  Your character's experience suggests that "pleasure" might just be a name we give to *any* state we value positively. The critic will say: "You don't need a theory of what pleasure *is*; you need a theory of why we *value* these disparate states."
  If they succeed, the entire project shifts. You are no longer writing a character who seeks "Pleasure"; you are writing a character who seeks "Value," and "pleasure" is just the misleading name she gives it. This breaks the framework because it renders the "Heterogeneity Problem" a pseudo-problem created by the mistaken belief that there is a single thing to be heterogeneous *about*.

  For your novel, this is a rich vein: the character may be searching for a unity in her satisfactions that does not exist, mistaking a collection of distinct drives for a single pursuit. That misunderstanding could be the source of her tragedy or her insight.
