          *   *Plan:*
              1.  **World (7 students):** They are the "Lawmakers." They secretly select a value for $c$ from a jar. The jar contains 1 ticket "Infinity" (Always P) and 10 tickets "11, 12, ... 20" (Switch at $c$).
              2.  **Bettors (7 students):** They know the *contents* of the jar (the prior) but not the draw.
