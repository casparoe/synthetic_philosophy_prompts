answer: |-
  ## Activity: The Change-Point Market

  This activity is designed to force students to confront the underdetermination of rules by data. By fixing the "generation mechanism" (the jar of hypotheses) but hiding the specific draw, you isolate the problem of *which* rule to project. The data (a run of identical outcomes) is useless for distinguishing the rules; only the prior distribution over rules matters. Students will instinctively reject the mathematical prior in favor of a "naturalness" prior, revealing their commitment to entrenchment without realizing it.

  ### 1. Setup and Roles (10 Minutes)

  **Class Size:** 14 Students.
  **Split:**
  *   **The World (7 students):** They generate reality.
  *   **The Market (7 students):** They bet on reality.

  **Materials:**
  *   **The Hypothesis Jar:** A physical container with 11 folded slips of paper.
      *   1 Slip says: **$\infty$ (Stable)**. Rule: Output **P** forever.
      *   10 Slips say: **$c \in \{11, 12, ..., 20\}$ (Switch)**. Rule: Output **P** until draw $c$, then output **Q** from draw $c$ onwards.
  *   **Currency:** Fake money (or points).
  *   **Board:** To track observed outputs (Draw 1, Draw 2, ...).

  **The Predicates:**
  Use abstract symbols to avoid semantic baggage.
  *   **P:** A Green Circle 🟢
  *   **Q:** A Red Square 🔴

  **Instructions to The World:**
  1.  Send them out of the room (or to a far corner) for 3 minutes.
  2.  They must draw one slip from the **Hypothesis Jar**.
  3.  They must keep the slip secret.
  4.  They return and act as the "Oracle." When the Market demands "Draw $n$," The World consults their slip and reveals the shape.
  5.  *Crucial:* The World knows exactly what Draw 11 will be.

  **Instructions to The Market:**
  1.  You are told the **contents of the Jar** (1 Stable, 10 Switch).
  2.  You do **not** know which slip was drawn.
  3.  Your goal: Maximize profit by betting on the shape of Draw 11.
  4.  You will see Draws 1 through 10.

  ### 2. The Game Procedure (20 Minutes)

  **Phase 1: The Run-Up (Draws 1–10)**
  *   The Market requests Draw 1. The World reveals 🟢.
  *   Repeat until Draw 10. All outcomes are 🟢.
  *   *Teacher Note:* Ensure the World team maintains poker faces. They know if they drew $c=11$ (next is 🔴) or $c=\infty$ (next is 🟢).

  **Phase 2: The Market Opens**
  *   The Market must set a price for a contract that pays **$100 if Draw 11 is 🟢**.
  *   They have a budget (e.g., $1000 total). They can buy as many contracts as they like at the price *they* set (or you act as the bookie and take the other side of their bet at odds they propose).
  *   *Simpler version:* Ask them to write down their credence (0–100%) that Draw 11 is 🟢. If they are right, they get points equal to their confidence. If wrong, they lose points equal to their confidence. (This approximates a proper scoring rule).

  **Phase 3: The Resolution**
  *   Collect the bets.
  *   The World reveals Draw 11.
  *   *Likely Outcome:* If the World drew a Switch slip (91% probability), Draw 11 is 🔴 (or will be soon). The Market, relying on induction, likely bet high on 🟢.
  *   Repeat for a few rounds if time permits (reset the jar), but one round is usually sufficient to generate the conflict.

  ### 3. The Math (For Your Reference)
  *   **Prior:** $P(\text{Stable}) = 1/11$. $P(\text{Switch}) = 10/11$.
  *   **Likelihood:** All 11 hypotheses predict 🟢 for Draws 1–10. The data provides a likelihood ratio of 1:1.
  *   **Posterior:** The probability remains $1/11$ for Stable, $10/11$ for Switch.
  *   **Prediction:** $P(\text{Draw 11 is 🟢}) = 1/11 \approx 9\%$.
  *   **The Trap:** Students will almost certainly assign $P(\text{🟢}) > 50\%$, often $>90\%$. They are implicitly overruling the known jar distribution with a "naturalness" prior.

  ---

  ## Debrief Guide (45 Minutes)

  Do not mention Goodman, Grue, or Bleen yet. Start with their frustration.

  ### 1. The Disagreement Survival (10 mins)
  *   **Ask:** "The data was 10 Greens. Why did you bet on Green?"
  *   **Expected Answer:** "Because it's been Green 10 times. That's what induction is."
  *   **Press:** "But you knew the Jar. You knew there were 10 Switch tickets for every 1 Stable ticket. Mathematically, you should have bet on Red. Why did you ignore the Jar?"
  *   **Point:** The data (10 Greens) was *equally consistent* with all 11 tickets. The data did not move the needle. Your confidence came entirely from a belief that the **Stable** ticket is antecedently more likely to be drawn than the **Switch** ticket, despite the Jar saying they are roughly equal.
  *   **Map to Riddle:** The "Jar" is the space of logically possible hypotheses. The "Data" is the evidence. The "Bet" is the projection. Goodman's point is that evidence alone cannot tell you which hypothesis to pick.

  ### 2. The Appeal to Simplicity and Gerrymandering (15 mins)
  *   **Ask:** "Why did you think the Stable ticket was more likely than the Switch ticket, even if the Jar said otherwise?"
  *   **Expected Answer:** "Switch is contrived." "Stable is simpler." "Switch is gerrymandered."
  *   **Press:** "Define 'gerrymandered' without using the word 'Green'."
  *   **The Trap:** If they say "Switch changes arbitrarily," ask them to describe the hypothesis in a vocabulary where *Switch* is the stable term.
      *   Introduce **Grue**: 🟢 before Draw 11, 🔴 after.
      *   Introduce **Bleen**: 🔴 before Draw 11, 🟢 after.
      *   In Grue/Bleen language, the "Switch" hypothesis is "All Grue" (Simple, Stable). The "Stable" hypothesis is "Grue until 11, then Bleen" (Complex, Switch).
  *   **Point:** Your appeal to simplicity is question-begging. It assumes the vocabulary (Green/Red) is privileged. But the evidence supports "All Green" and "All Grue" exactly equally. You prefer "Green" because it is **entrenched**, not because it is logically superior.

  ### 3. Hume vs. Goodman (10 mins)
  *   **Ask:** "Is this Hume's problem?"
  *   **Distinction:**
      *   **Hume:** Asks *whether* we can justify moving from past to future at all. (Skepticism about Induction).
      *   **Goodman:** Grants we *will* move from past to future. Asks *which* future we project. (Skepticism about Projectibility).
  *   **In the Game:** You didn't doubt the World would follow a rule (Hume). You doubted *which* rule (Goodman). You assumed the rule was "Stable" rather than "Switch." That assumption is the New Riddle.

  ### 4. What the Game Cannot Reproduce (5 mins)
  *   **Instructor Statement:** "There is one thing this game hid from you. In the game, 'Stable' looked simple and 'Switch' looked complex in English. In Goodman's actual riddle, the symmetry is perfect. 'All Green' and 'All Grue' are syntactically identical. The game privileges the Green vocabulary by design. In reality, there is no 'Jar' telling us Green is more common than Grue. We make Green more common by *using* it. Entrenchment is a history of usage, not a feature of the world."

  ### 5. Closing (5 mins)
  *   Name the riddle: **Goodman's New Riddle of Induction.**
  *   Name the predicate property: **Projectibility.**
  *   Name the solution (briefly): We project predicates that are **entrenched** in past successful projections.

  ---

  ## Predictable Failure Modes & Troubleshooting

  **1. The "World" Team Leaks Information**
  *   *Risk:* Students on the World team might smirk or hesitate at Draw 10 if they know a switch is coming.
  *   *Fix:* Instruct the World team explicitly: "Your grade depends on the Market *not* guessing your slip. Maintain a poker face. If you drew a Switch, act bored."
  *   *Backup:* If you suspect leakage, run the debrief hypothetically: "Even if they didn't leak, look at the math of the Jar..."

  **2. Students Ignore the Jar Priors**
  *   *Risk:* They will say, "The Jar was a trick. In the real world, Stable is more common."
  *   *Response:* This is the **exact point**. Capture this quote on the board. "In the real world, Stable is more common." Ask: "How do you know? Have you checked all the rules in the universe? Or is it just that 'Stable' is the word we use?" This transitions perfectly into entrenchment.

  **3. Confusion Between "Specific Switch" and "Any Switch"**
  *   *Risk:* A student argues, "Okay, Switch at 11 is unlikely, but Switch at 100 is also unlikely. So Stable wins."
  *   *Response:* Group the hypotheses. Hypothesis A: "No Switch." Hypothesis B: "Switch *sometime*." In the Jar, B is 10x more likely than A. The data (10 Greens) does not distinguish A from B. Why do you prefer A?

  **4. The "Grue" Symmetry is Hard to Grasp**
  *   *Risk:* They refuse to accept "Grue" as a real predicate.
  *   *Response:* Don't fight it. Acknowledge it. "You think Grue is fake. Goodman says 'Green' is just 'Grue' that we got used to. The game couldn't show that symmetry, which is why I had to tell you at the end. The game showed you the *structure* of the underdetermination; the vocabulary swap shows you the *depth* of it."

  ## What the Game Cannot Reproduce (Instructor Note)
  You must state this explicitly in the debrief. The game relies on the **asymmetry of description**.
  *   In the game, "Always Green" is one sentence. "Green until 11 then Red" is a longer sentence.
  *   Goodman's insight is that if we spoke "Grue-ese," "Always Grue" is one sentence, and "Grue until 11 then Bleen" is the long one.
  *   The game forces them to feel the pull of entrenchment (preferring the "Stable" ticket), but it cannot prove that "Stable" is linguistically arbitrary. You have to bridge that gap verbally. The game isolates the **probabilistic underdetermination**; you must supply the **linguistic symmetry**.
