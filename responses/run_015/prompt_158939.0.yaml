answer: |-
  You have correctly identified that your current rule is inconsistent, specifically regarding the **Teletransporter** and **Mary**. You are also right to be suspicious that your verdicts track your pre-existing philosophical leanings (e.g., rejecting the Experience Machine because you likely value "reality" or dislike the rhetorical framing of hedonism, rejecting the Chinese Room because you likely lean toward functionalism or physicalism).

  However, your suspicion that *everything* is just bias is too cynical. There is a structural difference between the cases you trust and the cases you distrust. The difference isn't about "fantasy vs. reality" (Clause 1) or even just "flat language" (Clause 2). It is about whether the mechanism of the thought experiment **smuggles the conclusion into the setup.**

  Here is the principle that captures your pattern, corrects your inconsistencies, and gives you a defensible rule for your syllabus.

  ### The Principle: Non-Begging Isolation

  > **A thought experiment is probative only if its fantastical mechanism isolates the variable under dispute without implicitly defining that variable in a way that precludes one side of the debate.**

  This principle has two operational tests you can apply to any case:

  1.  **The Neutrality Test:** Does the mechanism required to create the scenario assume the falsity of one of the competing theories? (If yes, reject).
  2.  **The Stability Test:** Does the intuition hold when the emotionally loaded descriptors of the mechanism are replaced with functional descriptions? (If no, reject).

  ### Where Your Verdicts Stand (and Where You Must Flip)

  You need to make two adjustments to your current list to make them consistent with this principle.

  **1. You must upgrade *Mary the Color Scientist*.**
  *   **Your Verdict:** Throw out (due to equivocation between fact/ability).
  *   **The Principle's Verdict:** **Keep.**
  *   **Why:** You admitted that the "flat language" version still pulls the intuition ("Yes, she learns something"). This means the thought experiment *works* as an intuition pump. The failure is not in the TE, but in the *inference* drawn from it (i.e., that what she learns must be a non-physical fact). For a syllabus, this is valuable: it teaches students to distinguish between a robust intuition and a contested ontological conclusion. Do not junk the case; junk the claim that it *refutes* physicalism outright.

  **2. You must downgrade *The Teletransporter* (slightly).**
  *   **Your Verdict:** Keep (Legit).
  *   **The Principle's Verdict:** **Keep, but with a warning.**
  *   **Why:** You worried Clause 1 failed here (the machine is a picture of survival, not a substitute). You were right. However, it passes the **Neutrality Test**. The scanner does not define "survival" for you; it forces Physicalists and Psychological Continuity theorists to apply *their* definitions to the same mechanism. It is a neutral testing ground. It stays on the syllabus, but you must present it as a test of *criteria*, not a proof of *identity*.

  **3. Your rejection of *The Experience Machine* is correct, but for the wrong reason.**
  *   **Your Verdict:** Throw out (Rigged).
  *   **The Principle's Verdict:** **Throw out.**
  *   **Why:** It fails the **Stability Test**. As you noted, if you strip the "tank" imagery and describe it as "perfect neural satisfaction of preferences," the anti-hedonist intuition weakens. The "tank" imagery is not just sticky; it is a premise that equates "artificial" with "worthless," which begs the question against the hedonist.

  **4. Your rejection of *The Chinese Room* is correct.**
  *   **Your Verdict:** Throw out (Begs the question).
  *   **The Principle's Verdict:** **Throw out.**
  *   **Why:** It fails the **Neutrality Test**. The setup describes the man as "shuffling symbols without understanding." This describes the *conclusion* (syntax is not semantics) as if it were the *setup*. A functionalist would describe the room as "a system processing information inputs to produce appropriate outputs." The imagery forces the anti-AI conclusion.

  ### Application to Your Three Unsettled Cases

  Here is how the **Non-Begging Isolation Principle** resolves your remaining doubts:

  **1. Chalmers's Philosophical Zombies**
  *   **Scenario:** A being physically identical to you with no inner experience.
  *   **Analysis:** This fails the **Neutrality Test**. To stipulate that a zombie is "conceivable" is to stipulate that physical facts do not necessitate phenomenal facts. That *is* the conclusion (Physicalism is false). It is not a test of physicalism; it is an assertion of dualism dressed as a scenario.
  *   **Syllabus Verdict:** **Exclude.** It shuts down debate by defining the terms such that physicalism cannot win. It is a modal claim, not a thought experiment.

  **2. The Imperfect Teleporter (Commute)**
  *   **Scenario:** Scan is lossy; you use it daily to get to work.
  *   **Analysis:** This passes both tests. The mechanism (lossy scan) isolates the variable of **degree**. It tests whether identity is binary or gradual. It survives flat language ("If 5% of my memories are altered daily, am I the same person?"). It does not beg the question; it forces you to decide where the cutoff lies.
  *   **Syllabus Verdict:** **Include.** This is often more productive than the original Teletransporter because it moves the discussion from metaphysics (identity) to ethics (what matters in survival).

  **3. Trolley vs. Product Safety (Named Child)**
  *   **Scenario:** Recall costs 40 lives, skipping costs 12. One version includes a named six-year-old victim.
  *   **Analysis:** The version with the named child fails the **Stability Test**. The name is "sticky detail" that triggers specific care-ethics or emotional intuitions unrelated to the aggregation principle being tested (Utilitarianism vs. Deontology). The "flat" version (40 vs. 12 anonymous lives) isolates the variable of *numbers*.
  *   **Syllabus Verdict:** **Include the flat version; Exclude the named version.** If you want to teach about bias in moral reasoning, show both and ask *why* the name changes the verdict. But for testing the ethical principle, the name is noise.

  ### Summary for Your Syllabus

  You asked for a rule you can state in a sentence or two. Use this:

  > **"We accept thought experiments that isolate a variable for testing; we reject those that smuggle the conclusion into the description of the mechanism."**

  **The Defensible List:**
  *   **Keep:** Gettier (isolates justification), Thomson (isolates bodily autonomy), Parfit/Teletransporter (isolates continuity criteria), Repugnant Conclusion (isolates aggregation), Imperfect Teleporter (isolates vagueness).
  *   **Teach Critically:** Mary (Keep the intuition, challenge the inference).
  *   **Drop:** Experience Machine (Loaded mechanism), Chinese Room (Begs the question), Zombies (Asserts conclusion), Trolley with Named Child (Confounding emotional variable).

  This approach admits that thought experiments are tools, not data. Some tools are calibrated (Gettier); some are rigged (Experience Machine). Your job in the reading group is to hand students the calibrated tools and show them how to spot the rigging in the others.
