prompt: |-
  Write a short research proposal (maximum 800 words, formatted as a single workshop-pitch document) in American English on the following question in accuracy-first epistemology and epistemic utility theory: can an accuracy-first framework accommodate context-sensitive epistemic risk aversion—specifically, the intuition that false beliefs guiding high-stakes practical action are worse than false beliefs in low-stakes domains—without collapsing into epistemic consequentialism? State the question with enough precision that it has a determinate yes-or-no answer. Explain why standard accuracy-first accounts leave it open: they typically treat belief accuracy as pointwise symmetric, weighting every false belief equally regardless of practical context, and therefore have no internal resource to explain why rational agents should apply stricter evidential thresholds in high-stakes domains. Propose your approach: develop a threshold-sensitive accuracy function that derives differential weights for errors solely from the reliability conditions of belief-formation in different practical domains, rather than importing external moral or prudential values. Describe what a successful deliverable looks like (a formal framework that preserves the accuracy-first commitment that epistemic value derives entirely from belief accuracy, while allowing domain-variable thresholds) and what counts as failure (the framework secretly relies on non-epistemic scoring rules or collapses into standard consequentialist epistemic utility theory). Give an honest scope assessment for a six-week workshop project, identifying one specific conceptual obstacle—such as the difficulty of defining domain boundaries without circular appeal to practical stakes—that could make the project too ambitious. Do not include a bibliography, reading list, or citations; refer only to positions and arguments, and I will supply references myself.
