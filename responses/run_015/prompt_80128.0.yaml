      *   **Standard Account:** Manipulation is wrong because it bypasses judgment/autonomy. Persuasion engages judgment.
      *   **User's Challenge:**
          *   *Counter-example 1 (Manipulation through reasoning):* Gaslighting, plausible propaganda, anchoring (works *through* reasoning, not bypassing).
