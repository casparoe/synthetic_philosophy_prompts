          *   Defaults (Nudges): The door is technically open, but the path of least resistance leads through one specific door. It bypasses *active* deliberation but respects *passive* choice. Is it manipulation? Thaler/Sunstein say "libertarian paternalism." Critics say it's soft manipulation.
      *   *Assumptions about Self:* The metaphor assumes a "Homunculus" (a little person inside making decisions). It ignores subconscious biases, emotional states, and the social construction of preferences. It treats consent as a one-time event (opening the door) rather than a continuous state or capacity.
      *   *The "Wrongness":* If bypassing isn't the sole criterion (since nudges bypass but are okay, and gaslighting engages but is bad), what is the harm?
