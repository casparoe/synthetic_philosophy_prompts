      *   **Evaluating the Conclusion:** The "Bypass Thesis" fails. It's not about *how* the influence enters (bypass vs. engage), but *what it does* to the agency once inside.
      *   **Proposing a Better Framework:**
          *   Shift from *Process* (bypass) to *Effect/Relation* (subversion of agency).
