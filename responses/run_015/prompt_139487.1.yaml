prompt: |-
  I work in the clinical effectiveness team of a large NHS trust, and four times a year I put a report in front of the board that decides where a small improvement team is sent next. I keep hitting the same problem in a form I have never seen it usefully explained in: the combined figures say an intervention worked, the figures split by ward say it did not, or the other way round, and I then have to tell a room of non-specialists which number to act on. I have been reading about this on my own and I think I follow the basic idea of Simpson's paradox, but two things still defeat me. First, one of our statisticians keeps saying that splitting by a variable the intervention itself changes — whether a patient was well enough to be seen by the therapy team, for instance — can manufacture a reversal rather than uncover one, so that the combined figure is the honest one; I cannot tell in advance which kind of variable I am splitting by. Second, it seems to matter whether the board will act trust-wide or ward-by-ward, and I do not know how to make that a step in the rule rather than an excuse afterwards.

  Please turn this into a written procedure my team can run in an afternoon, using only the numbers we already hold, and which a clinical director can sign off on and lay governors can follow. Give me the questions in order, what counts as a sufficient answer to each, where the procedure stops and tells me to use the combined figures, where it tells me to stratify, and where it hands the decision back to people because what is unsettled is what we are trying to do rather than what the data say. Please mark clearly which steps are arithmetic that nobody disputes and which rest on views that are genuinely contested among people who study this, so I do not present a contested reading to the board as if it were agreed.

  Then run it on three cases from our last cycle: a discharge pathway whose apparent reduction in thirty-day readmissions disappears entirely once you split by admitting specialty; a virtual ward scheme I argued for, whose benefit shows up only in the combined figures and not within any age band; and a sepsis screening tool where the only split available is by whether the patient reached the resuscitation bay, which the screening itself affects. I would rather you told me plainly if one of these has no answer the procedure can defend.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and Request:**
      *   **User Role:** Works in the Clinical Effectiveness team of a large NHS Trust.
      *   **Task:** Produces quarterly reports for the Board to decide where an improvement team is deployed.
      *   **Problem:** Encountering Simpson's Paradox (combined data says X, stratified data says Y). Needs to explain to non-specialists (Board, Governors) which number to trust.
      *   **Specific Confusions:**
          1.  *Collider Bias/Post-Treatment Bias:* A statistician warned against splitting by variables affected by the intervention (e.g., "well enough to be seen"). The user doesn't know how to identify these variables in advance.
          2.  *Decision Context:* It matters if the Board acts trust-wide or ward-by-ward, but this feels like an afterthought rather than a rule.
      *   **Requirements:**
          *   A written procedure runnable in an afternoon.
          *   Uses only existing data.
          *   Sign-offable by Clinical Directors, understandable by Lay Governors.
          *   Clear order of questions.
          *   Clear stop/go points (Combined vs. Stratified vs. Undecided).
          *   **Crucial:** Distinguish between *arithmetic facts* and *contested interpretations* (causal inference).
          *   Apply the procedure to three specific cases provided.
          *   Be plain about cases where the procedure cannot defend an answer.

  2.  **Deconstruct the Statistical/Methodological Issues:**
      *   **Simpson's Paradox:** A trend appears in different groups of data but disappears or reverses when these groups are combined.
      *   **Confounding vs. Mediation vs. Colliders:**
          *   *Confounder:* Affects both treatment and outcome (e.g., Age affects both likelihood of getting therapy and recovery). *Action:* Stratify/Adjust.
          *   *Mediator:* On the causal path between treatment and outcome (e.g., Treatment -> Blood Pressure -> Stroke). *Action:* Do not adjust if looking for total effect.
          *   *Collider:* Affected by both treatment and outcome (or just treatment). Conditioning on it opens a spurious path. *Action:* Do not stratify.
      *   **The User's Statistician's Point:** Splitting by a variable the intervention changes (a mediator or collider) creates bias. This is often called "Post-Treatment Bias" or "Collider Bias."
      *   **The Decision Context:** If the policy is "One size fits all" (Trust-wide), the marginal (combined) effect is usually relevant for resource allocation *unless* there's effect modification (heterogeneity of treatment effect). If the policy is "Targeted" (Ward-by-ward), the conditional (stratified) effects matter.

  3.  **Drafting the Procedure (The "NHS Trust Simpson's Protocol"):**
      *   *Goal:* Make it actionable, transparent, and honest about uncertainty.
      *   *Structure:*
          1.  Define the Decision (Trust-wide vs. Targeted).
          2.  Check the Data (Arithmetic).
          3.  Assess the Splitting Variable (Causal Logic - The Contested Part).
          4.  Final Recommendation.
      *   *Labeling:* Must clearly mark "Arithmetic/Agreed" vs. "Causal/Contested."

      *   *Step 1: The Decision Rule (Context).* Is the intervention scalable trust-wide or specific to subgroups? This addresses the user's second confusion.
      *   *Step 2: The Arithmetic Check.* Does the reversal actually exist? (Combined vs. Stratified).
      *   *Step 3: The Variable Test.* Is the splitting variable a *Baseline Characteristic* (Pre-treatment) or a *Post-Treatment Event*? This addresses the statistician's warning.
      *   *Step 4: The Sample Size/Power Check.* Are the subgroups too small?
      *   *Step 5: The Verdict.*

  4.  **Refining the "Contested" vs. "Agreed" Distinction:**
      *   *Agreed:* Math (averages, percentages), sample sizes, timing of data collection (pre vs. post).
      *   *Contested:* Causal direction. Does the intervention affect the splitting variable? This requires clinical knowledge, not just stats. I need to make sure the procedure forces the Clinical Director to answer this, not the analyst.

  5.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: Discharge Pathway (Readmissions split by Admitting Specialty).**
          *   *Observation:* Combined = Good, Stratified = Null.
          *   *Variable:* Admitting Specialty.
          *   *Timing:* Pre-treatment (You are admitted to a specialty *before* the discharge pathway starts).
          *   *Analysis:* This is a confounder. Different specialties have different baseline readmission risks. If the pathway was used more in low-risk specialties, the combined data looks good falsely.
          *   *Verdict:* Trust the Stratified (Null). The combined figure is misleading due to case-mix.

      *   **Case 2: Virtual Ward (Benefit in Combined, Null in Age Bands).**
          *   *Observation:* Combined = Good, Stratified = Null.
          *   *Variable:* Age Band.
          *   *Timing:* Pre-treatment.
          *   *Analysis:* Classic Simpson's. If older people (higher risk) were less likely to get the Virtual Ward, but the Virtual Ward helps everyone equally, the combined data might look good because the untreated group was sicker. *Wait, if stratified is null, it means it helps no one.* If the stratified analysis shows *no effect* in any age band, but combined shows *positive effect*, it implies the allocation was biased (e.g., low risk people got the intervention).
          *   *Verdict:* Trust the Stratified (Null). The combined effect is likely selection bias.

      *   **Case 3: Sepsis Screening (Split by Resuscitation Bay).**
          *   *Observation:* Split available is "Reached Resus Bay."
          *   *Variable:* Reached Resus Bay.
          *   *Timing:* Post-treatment (The screening tool determines if they get fast-tracked to Resus).
          *   *Analysis:* This is the Statistician's warning. The intervention *causes* the split. Conditioning on this creates Collider Bias.
          *   *Verdict:* Trust the Combined (or admit data is unusable for this split). Do not stratify by a consequence of the intervention.

  6.  **Review and Refine:**
      *   *Tone:* Professional, NHS-appropriate, clear, humble about statistical limits.
      *   *Formatting:* Use boxes/bold text to distinguish steps.
      *   *Constraint Check:* Did I mark contested steps? Yes. Did I address the "Trust-wide vs. Ward" issue? Yes (Step 1). Did I run the three cases? Yes.
      *   *Self-Correction on Case 2:* If the benefit shows up *only* in combined figures and *not* within age bands, this is the classic paradox. Usually, this means the intervention was disproportionately given to the group with better natural prognosis. The stratified data is the "truth" about the biological/clinical effect. The combined data is the "truth" about the *current implementation* (which includes bias). For an improvement team, we want the clinical effect. So Stratified is usually the right guide for *efficacy*, Combined might be right for *effectiveness of current rollout*. I need to be careful here. The prompt asks "where a small improvement team is sent next." This implies looking for *potential* benefit. If stratified says "no benefit," sending the team is wasteful. I will recommend Stratified for efficacy decisions.

      *   *Refining the "Contested" Label:* Causal diagrams (DAGs) are the standard, but the user wants a procedure for non-specialists. I must emphasize that Step 3 requires *Clinical* consensus, not statistical calculation.

  7.  **Final Polish:** Ensure the distinction between "Arithmetic" (Step 2) and "Causal Assumption" (Step 3) is stark. This protects the user from being blamed if the causal assumption turns out wrong later.

      *(Self-Correction during drafting Case 2)*: Wait, if the benefit is *only* in combined, and *null* in all subgroups, that is mathematically impossible unless there is a third hidden variable or the subgroups are weighted differently *and* the treatment allocation is correlated with the subgroup size/outcome. Actually, if the effect is null in *all* strata, the combined effect *must* be null unless there is confounding by the stratification variable. Yes, that's the paradox. The combined effect is driven by the correlation between Age and Treatment Assignment. So the Stratified result is the unbiased estimate of treatment effect. I will stick with that.

      *(Self-Correction during drafting Case 3)*: If the split is by a post-treatment variable, stratifying is definitely wrong. But does that mean the Combined figure is "honest"? Not necessarily. It just means *this specific stratification* is invalid. The Combined figure might still be confounded by other things. I need to be precise: "Do not use the stratified figures. The Combined figures are the only option *from this analysis*, but remain cautious."

  8.  **Final Output Structure:**
      *   Introduction (Context setting).
      *   The Procedure (The "Simpson's Decision Protocol").
      *   Application to the Three Cases.
      *   Closing Advice.

      *Let's write it.*
answer: |-
  # The Simpson's Decision Protocol (SDP)
  **For Clinical Effectiveness Teams and Trust Boards**

  **Purpose:** To determine whether Trust-wide (combined) or Ward/Specialty-specific (stratified) data should guide the deployment of improvement resources when the two figures contradict.
  **Time Required:** 60–90 minutes per intervention.
  **Participants:** Data Analyst (you), Clinical Director (sign-off), Improvement Lead.
  **Data Required:** Current outcome metrics, baseline characteristics, intervention logs.

  ---

  ## Part 1: The Procedure

  This procedure separates **Arithmetic Facts** (which no one disputes) from **Causal Judgements** (which rely on clinical consensus and are open to debate).

  ### Step 1: Define the Decision Scope (Arithmetic/Policy)
  *Question:* If this intervention works, how will it be deployed?
  *   **Option A:** Trust-wide rollout (e.g., a new sepsis guideline for all A&E).
  *   **Option B:** Targeted rollout (e.g., a falls prevention programme only for Geriatrics).

  *   **If Option A:** We generally prioritise the **Combined Figure**, *unless* Step 3 proves it is misleading.
  *   **If Option B:** We generally prioritise the **Stratified Figure** for the target group.
  *   **Action:** Record the decision scope in the report header.
  *   **Status:** ✅ **Agreed Policy** (Not statistical).

  ### Step 2: Confirm the Reversal (Arithmetic)
  *Question:* Does the direction of the effect actually flip, or does it just weaken?
  *   **Test:** Calculate the effect size (e.g., risk reduction) for the Total Population and for each Subgroup (Ward/Specialty/Age).
  *   **Condition:** A "Paradox" exists only if:
      1.  Combined data shows Benefit (or Harm).
      2.  *All* (or the vast majority of) Subgroups show No Effect or the Opposite Effect.
  *   **Action:** If the subgroups simply show *smaller* benefits but the same direction, use the **Combined Figure** (weighted average). Stop here.
  *   **Action:** If the direction flips (Benefit vs. Harm/Null), proceed to Step 3.
  *   **Status:** ✅ **Arithmetic Fact** (Nobody disputes the calculation).

  ### Step 3: The "Before or After" Test (Causal Judgement)
  *Question:* Was the variable used to split the data determined **before** the patient could receive the intervention, or **after/during** it?
  *   **Instruction:** The Clinical Director must answer this based on clinical pathway knowledge, not the analyst.

  *   **Category 1: Baseline Characteristics (Before)**
      *   *Examples:* Age, Sex, Admitting Specialty, Home Postcode, Comorbidities at admission.
      *   *Logic:* The intervention cannot change a patient's age or which specialty they were admitted to.
      *   *Verdict:* **Trust the Stratified Figures.** The Combined figure is likely distorted by case-mix imbalance (e.g., the intervention was accidentally given to healthier wards).

  *   **Category 2: Post-Treatment Events (After/During)**
      *   *Examples:* "Well enough for therapy," "Reached Resus Bay," "Completed the course," "Transferred to community care."
      *   *Logic:* The intervention itself influences whether this happens. (e.g., The screening tool causes the patient to go to Resus).
      *   *Verdict:* **Trust the Combined Figures.** Splitting by this variable manufactures a false relationship (Collider Bias). Do not stratify by this variable.

  *   **Status:** ⚠️ **Contested/Clinical Judgement.** (Statisticians agree on the math, but clinicians may disagree on the pathway timeline. This must be minuted).

  ### Step 4: The Sample Size Check (Arithmetic)
  *Question:* Are the subgroups large enough to sustain the conclusion?
  *   **Test:** If any subgroup has fewer than 30 outcomes (e.g., 30 readmissions, 30 deaths), the stratified rate is statistically unstable.
  *   **Verdict:** If subgroups are too small, revert to **Combined Figures** regardless of Step 3. Note the uncertainty.
  *   **Status:** ✅ **Arithmetic Fact** (Standard statistical power rules).

  ### Step 5: Final Recommendation
  *   **If Step 3 = Baseline:** Report Stratified. Tell the Board: *"The combined figure is misleading because the intervention was unevenly distributed across these groups."*
  *   **If Step 3 = Post-Treatment:** Report Combined. Tell the Board: *"Splitting by this variable creates artificial bias because the intervention changes the likelihood of landing in these groups."*
  *   **If Step 1 = Targeted:** Report Stratified for the target group only.
  *   **If Unsettled:** If the Clinical Director cannot agree on Step 3 (Before vs. After), the report must state: *"Data is inconclusive. The intervention requires a controlled pilot before Trust-wide deployment."*

  ---

  ## Part 2: Application to Your Three Cases

  Here is the protocol applied to the specific scenarios you provided. You can include this table directly in your Board pack to show due diligence.

  ### Case 1: Discharge Pathway (Readmissions split by Admitting Specialty)
  *   **Observation:** Combined = Reduction in readmissions. Stratified (by Specialty) = No reduction.
  *   **Step 1 (Scope):** Likely Trust-wide rollout of pathway.
  *   **Step 2 (Arithmetic):** Confirmed reversal (Benefit vs. Null).
  *   **Step 3 (Before/After):** **Admitting Specialty** is a **Baseline Characteristic**. A patient is assigned to Orthopaedics or Medicine *before* the discharge pathway begins. The pathway does not change their specialty.
  *   **Step 4 (Sample):** Assuming sufficient numbers per specialty.
  *   **Verdict:** **Use the Stratified Figures (Null Effect).**
  *   **Board Explanation:** "The combined data looked positive because the pathway was used more often in specialties that naturally have lower readmission rates. When we compare like-with-like within each specialty, the pathway shows no benefit. Do not deploy the improvement team based on the combined figure."
  *   **Defensibility:** High. This is standard case-mix adjustment.

  ### Case 2: Virtual Ward Scheme (Benefit in Combined, Null in Age Bands)
  *   **Observation:** Combined = Benefit. Stratified (by Age) = Null in all bands.
  *   **Step 1 (Scope):** Trust-wide eligibility.
  *   **Step 2 (Arithmetic):** Confirmed reversal.
  *   **Step 3 (Before/After):** **Age Band** is a **Baseline Characteristic**. The Virtual Ward does not change a patient's age.
  *   **Step 4 (Sample):** Assuming sufficient numbers.
  *   **Verdict:** **Use the Stratified Figures (Null Effect).**
  *   **Board Explanation:** "This is a classic selection bias. Frailer (older) patients were less likely to be selected for the Virtual Ward. Because younger patients recover better anyway, the Combined figure makes the Virtual Ward look effective. The Age-stratified data shows the scheme adds no value over standard care for any age group. Do not deploy the improvement team to scale this; redesign first."
  *   **Defensibility:** High. This is confounding by indication.

  ### Case 3: Sepsis Screening Tool (Split by "Reached Resuscitation Bay")
  *   **Observation:** You have Combined figures and figures split by whether they reached Resus.
  *   **Step 1 (Scope):** Trust-wide safety intervention.
  *   **Step 2 (Arithmetic):** (Assume reversal exists for the sake of the test).
  *   **Step 3 (Before/After):** **Reached Resuscitation Bay** is a **Post-Treatment Event**. The Sepsis Screening Tool is designed to *trigger* escalation to Resus. The intervention directly changes the probability of this split occurring.
  *   **Step 4 (Sample):** N/A.
  *   **Verdict:** **Use the Combined Figures. Discard the Stratified split.**
  *   **Board Explanation:** "We cannot split the data by 'Reached Resus' because the screening tool itself determines who goes there. Splitting by this variable creates a statistical illusion (Collider Bias) that hides the true effect. We must judge the tool on the total population screened. However, please note: if the Combined figure shows benefit, it is valid. If it shows null, the stratified data cannot rescue it."
  *   **Defensibility:** **Moderate/High on rejecting the split, Low on the Combined figure.**
      *   *Warning:* Rejecting the split is statistically correct (per your statistician). However, trusting the Combined figure assumes there are no *other* confounders (like Case 1 & 2). You must tell the Board: *"We must use the combined figure because the split is invalid, but we acknowledge this data is observational and not a randomised trial."*

  ---

  ## Part 3: Where the Procedure Cannot Defend You

  You asked me to be plain if one of these has no answer the procedure can defend.

  **Case 3 (Sepsis) is the risk.**
  The procedure correctly tells you **not to stratify** by "Reached Resus." That protects you from making a *wrong* decision based on bad stratification. However, it does **not** prove the Combined figure is "true."

  If the Sepsis Tool was only used on the day shift, or only by senior nurses, the Combined figure is *also* biased. The procedure handles Simpson's Paradox (the split), but it does not fix general selection bias in the Combined data.

  **Recommendation for Case 3:**
  In your report, use the Combined figure (as per Step 3), but add a **Red Flag**:
  > *"Because we cannot validly stratify by escalation status, we rely on the Combined figure. However, as this is not a randomised trial, unmeasured factors (e.g., time of day, staffing levels) could still influence the result. Recommendation: Proceed with a phased rollout with concurrent control wards to verify the Combined figure."*

  ## Summary for the Board Pack

  When you present, use this visual key:

  | Step | Question | Who Answers? | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | Is the policy Trust-wide or Targeted? | **Board/Policy** | ✅ Agreed |
  | **2** | Do the numbers actually flip direction? | **Analyst** | ✅ Agreed |
  | **3** | Did the intervention change the split variable? | **Clinical Director** | ⚠️ **Judgement Call** |
  | **4** | Are subgroups big enough? | **Analyst** | ✅ Agreed |

  **Your Script for the Meeting:**
  *"Where Steps 1, 2, and 4 are clear, we have a mathematical answer. Step 3 requires clinical consensus. For the Discharge Pathway and Virtual Ward, the splitting variables (Specialty, Age) are baseline facts, so the stratified data is the truth. For Sepsis, the splitting variable (Resus) is a result of the tool, so the stratified data is invalid. In that case, we use the combined data but recommend a controlled pilot to be sure."*
