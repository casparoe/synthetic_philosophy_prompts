answer: |-
  Dave had been blind since birth, but after finally getting cataract surgery, his friends threw him a "Welcome to the Visual World" party. Naturally, half the guests were philosophy majors.

  As soon as the bandages came off, two of them cornered him. One was a hardline Empiricist, the other a staunch Rationalist. They held up a wooden cube and a rubber sphere.

  "Okay, Dave," the Empiricist said. "You know these by touch. But looking at them fresh, which is which?"

  Dave squinted. The cube looked soft; the sphere looked angular. "Uh... the pointy one is the ball?"

  "Ha!" said the Empiricist. "I told you. The mind is an empty room. You can't know what things are until your senses drag the furniture in. You need experience to link the sight to the touch."

  "Nonsense," scoffed the Rationalist. "The geometry is inherent. The blueprint of 'cube' and 'sphere' is already stamped on his soul. He should be able to deduce it purely through reason, regardless of the sensory input. You're just not thinking hard enough, Dave."

  Dave rubbed his eyes, reached out, and felt the objects. "Okay, now I know. This is the box, this is the ball."

  "See?" said the Empiricist. "Association complete. Data matched."

  "No," insisted the Rationalist. "He merely recalled what he already innately knew. The touch just jogged his memory."

  Dave put the shapes down and crossed his arms. "You know, if understanding the world was something we were just born knowing—like you say—then I should have been born knowing two things."

  "Which are?" asked the Rationalist.

  "First, that this is a cube. And second, that you two are annoying enough that I should have never invited you to my recovery party."

  The Empiricist grinned. "See? Learned behavior."

  The Rationalist shook his head. "No, that's just innate cynicism."

  Dave sighed. "I'm going back to the dark."
