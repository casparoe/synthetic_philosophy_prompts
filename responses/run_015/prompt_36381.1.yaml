  This is a sophisticated puzzle, and your mate has effectively reconstructed one of the most famous problems in modern decision theory. He hasn't "broken" expected value (EV) theory in the sense of finding a logical contradiction within its standard axioms, but he has correctly identified its **boundary of applicability**.

  The game you described is a close variant of the **Pasadena Game**, introduced by Alan Hájek and Harris Nover in 2004. The literature on this is live and contested, but there is a clear distinction between the settled mathematics and the philosophical interpretation.

  Here is the breakdown of what is math, what is theory, and where the argument fails.

  ### 1. The Settled Mathematics
  Your mate's math is flawless.
  *   **The Series:** The expected value terms are indeed $+1, -1/2, +1/3, -1/4, \dots$.
  *   **Conditional Convergence:** This is the alternating harmonic series. It converges to $\ln(2)$ in its natural order.
  *   **Absolute Divergence:** The sum of the absolute values ($1 + 1/2 + 1/3 + \dots$) diverges to infinity.
  *   **Riemann Rearrangement Theorem:** This is a standard theorem in calculus. It states that any conditionally convergent series can be rearranged to converge to any real number, or to diverge.

  So, steps (3) and (4) of his argument are mathematically indisputable.

  ### 2. The Fatal Flaw: Step (1) and (5)
  The error lies in the move from **mathematical possibility** to **decision-theoretic legitimacy**.

  **Step (1) claims:** *"The rational evaluation of a gamble can't depend on the order in which we enumerate the states."*
  **Step (5) claims:** *"Each such rearrangement is just as legitimate an evaluation of the same game."*

  In standard probability theory (Kolmogorov's axioms), Expectation is not defined as an infinite sum; it is defined as a **Lebesgue Integral**.
  $$E[X] = \int_{\Omega} X \, dP$$
  A fundamental property of the Lebesgue integral is that it is **only defined if the integral of the absolute value is finite** (i.e., $E[|X|] < \infty$). This is called *absolute integrability*.

  Because the absolute sum of your game's payoffs diverges ($\sum |p_n x_n| = \infty$), **the Expectation is undefined.**

  **Why this rejects Step (5):**
  Your mate treats the expectation as a Riemann sum (a literal adding up of terms). In a Riemann sum, order matters for conditionally convergent series. In a Lebesgue integral, order *never* matters—but if the absolute integral diverges, the value simply **does not exist**.

  Standard EV theory does not say "The value is $\ln(2)$." It says "This gamble has no expected value." Therefore, it is not legitimate to assign it the value 100 or -5 based on a rearrangement. Those rearrangements are mathematical artifacts of summing a series, not valid evaluations of the probability integral.

  ### 3. The Consensus View
  You asked what is contested versus settled.

  **Settled:** Standard Expected Utility Theory (EUT) cannot assign a value to the Pasadena Game. It is silent. It does not produce a contradiction (saying it is both 0.69 and 100); it produces **no output**.

  **Contested:** What should a rational agent do when EUT is silent?
  1.  **The Orthodox View:** If a gamble has no expected value, EUT offers no guidance. You cannot compare it to other gambles. It is "incomparable."
  2.  **The Weak Expectation View (Easwaran, 2008):** Philosopher Kenny Easwaran proposed distinguishing between *Strong Expectation* (standard EV, requires absolute convergence) and *Weak Expectation* (the limit of the average payoff over many trials). The Pasadena Game *does* have a Weak Expectation of $\ln(2)$. Some argue rational agents should maximize Weak Expectation.
  3.  **The Dominance View:** Some argue that even without an EV, you can compare the Pasadena Game to other gambles using state-by-state dominance, though this gets messy with infinite states.

  **The Money Pump:**
  Your mate's money pump argument (Step 6) relies on the agent *having* a valuation that shifts based on enumeration.
  *   If the agent follows standard EUT, they have **no valuation**. They won't pay £90 because the theory doesn't tell them the game is worth £100. They won't sell for 60p because the theory doesn't tell them it's worth 69p. The pump fails because the agent refuses to play the valuation game.
  *   If the agent follows your mate's logic (that rearrangements are valid), then yes, they are money-pumpable. But this proves that **your mate's interpretation of EV is irrational**, not that EV theory itself is broken.

  ### 4. What Privileges the "Natural Order"?
  You asked: *"If enumeration order can matter, then I want to know what privileges the natural order... other than that it happens to be the first one we thought of."*

  This is the deepest philosophical question here.
  *   **Mathematically:** Nothing privileges the natural order *for a series*.
  *   **Decision-Theoretically:** The "natural order" corresponds to the indexing of the sample space (Flip 1, Flip 2, Flip 3...). However, since standard theory rejects *all* orders (by declaring the EV undefined), it doesn't need to privilege one.
  *   **If you adopt Weak Expectation:** The natural order is privileged because it reflects the **temporal or causal structure** of the experiment. The game is defined as "Flip until Heads." The index $n$ is an intrinsic property of the outcome (the number of flips), not an arbitrary label. Rearranging the terms effectively changes the gamble into a different mathematical object that no longer maps cleanly to the physical probabilities of the coin flips.

  ### 5. Summary: Which Step to Reject?
  You should reject **Step (5)**: *"Each such rearrangement is just as legitimate an evaluation of the same game."*

  **The Cost of Rejection:**
  Rejecting this costs you very little in the real world.
  1.  **Pathological Gambles:** You must accept that there are theoretically possible gambles (involving infinite outcomes with heavy tails) that standard decision theory cannot value. This is similar to how standard arithmetic cannot divide by zero. It's a limit of the tool, not a contradiction.
  2.  **No Money Pump:** You avoid the money pump by admitting the game has no price, rather than assigning it arbitrary prices.
  3.  **Complexity:** You may need to adopt a more nuanced framework (like Easwaran's Weak Expectation) if you want to make decisions in these edge cases, but that is an *extension* of EV theory, not a refutation of it.

  ### Conclusion for Your Mate
  Tell him he has independently rediscovered the **Pasadena Paradox**. His math is perfect, but his interpretation of what "Expected Value" means is slightly off.

  *   **He says:** "EV theory gives contradictory answers."
  *   **Correction:** "EV theory gives **no** answer. The contradiction only arises if you force a series summation method where an integral is required."

  The consensus among decision theorists is not that EV theory is refuted, but that its domain is restricted to gambles where $E[|X|] < \infty$. For the Pasadena Game, standard EV theory throws up its hands. Whether that's a bug or a feature is still being debated, but it doesn't allow a bookie to pump you for money unless you irrationally insist that a divergent integral must equal a number.

  **Recommendation:** Don't play the game. Not because it's worth -5 or 100, but because the variance is infinite and the expectation is undefined. In any practical scenario with a bankroll limit, the "St. Petersburg" style explosion of payoffs will be capped, collapsing the game back to a finite (and likely negative) expectation once you account for the house's inability to pay £$(2^{1000})$.
