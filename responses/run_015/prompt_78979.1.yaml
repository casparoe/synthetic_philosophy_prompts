answer: |-
  Assumption: Assume the applicant has a strong publication record in metaphysics and the philosophy of social science.

  **Brainstorming Framings**

  1.  **Ontological Framing:** Posits values as freestanding social facts existing independently of individuals. *Risk:* Invokes mysterious entities without explaining their causal grip on behavior.
  2.  **Constraint Framing:** Posits values as limits on the conceivable horizon of action. *Strength:* Explains the absence of deliberation without requiring psychological internalization.
  3.  **Contrastive Framing:** Treats the thesis as explaining differences between populations rather than specific actions. *Strength:* Aligns with comparative history. *Weakness:* Does not solve the mechanism problem of how culture exerts force.

  **Commitment:** I commit to the Constraint Framing. It directly targets the assumption that explanation requires motive, offering a structural alternative that preserves causality without holistic metaphysics.
  **Set Aside:** The Ontological Framing. It risks devolving into holist metaphysics that methodological individualists can easily dismiss as category errors regarding agency.

  ***

  **Proposal**

  **Title:** Values as Constraints: Reconceptualizing Cultural Causation Beyond Individual Motives

  **Abstract:** This project argues that cultural values explain conduct not by motivating agents but by constraining the space of options they treat as available. It establishes criteria for distinguishing this causal constraint from mere redescription.

  **The Question**
  Do cultural values function causally by constraining the horizon of deliberation rather than by motivating individual agents, and does this model satisfy interventionist criteria for causation without collapsing into redescription? This question admits a determinate answer: either the constraint model meets the conditions for causal inference (specifically counterfactual dependence and interventionability) or it fails, revealing the explanation to be merely interpretive.

  **Why Standing Positions Leave This Open**
  Current debates stall because both sides accept a hidden premise: that for values to cause action, they must operate as psychological states within individual agents. Methodological individualists demand values be internalized as beliefs or desires to count as causes; holists defend cultural causation but often fail to specify a mechanism that bypasses individual psychology without invoking mysterious group minds. Consequently, the possibility that values operate structurally—by rendering certain options invisible rather than unchosen—remains unexamined. This leaves the classic objection untouched: that cultural explanation is merely redescription of the aggregate conduct it purports to explain. If values only exist insofar as they are enacted, citing them adds no causal information. If, however, values constrain the space of possible enactment prior to deliberation, they may satisfy causal criteria without being motives. The existing literature has not rigorously tested whether this structural constraint can meet the requirements for causal explanation rather than logical classification.

  **Approach and Alternatives**
  This project employs conceptual engineering grounded in the metaphysics of causation. I will construct a model of "horizon constraint" and test it against standard accounts of causal explanation in the social sciences.
  I reject a historical case study because the truth of the specific historical claim (e.g., regarding Protestantism) is secondary to the logical form of the explanation; verifying the history does not resolve the philosophical problem of how culture causally functions. I reject formal modeling of social causation because such models typically stipulate the definition of variables rather than analyzing the conceptual content of 'value' and 'constraint,' risking mathematical precision at the cost of philosophical clarity. I reject straightforward conceptual analysis of causation because the goal is not to define causation in the abstract, but to determine if a specific type of social explanation fits existing causal criteria. The approach is instead a targeted metaphysical investigation into the conditions under which structural constraints count as causes.

  **Six-Month Plan**
  *Month 1:* Map the literature on structural explanation and causal exclusion in social science, focusing on accounts that allow for non-agential causes.
  *Month 2:* Analyze secondary literature on the specific causal claims of the Protestant Ethic thesis to isolate the precise role values are alleged to play.
  *Month 3:* Draft the positive account: define "horizon constraint" and distinguish it from psychological disposition and external coercion.
  *Month 4:* Stress-test the account against the redescription objection; determine if the constraint is empirically detectable independent of the conduct it explains.
  *Month 5:* Refine the contrastive element; clarify whether the explanation accounts for the existence of conduct or the difference between populations.
  *Month 6:* Finalize the manuscript for submission, ensuring the argument distinguishes clearly between causal necessity and logical coherence.

  **Success and Failure**
  A good result produces a published article demonstrating that structural constraints can satisfy interventionist criteria for causation without reducing to individual motives. It will show how one can intervene on the cultural horizon (e.g., through discourse) to change conduct without changing individual beliefs. The project fails if the constraint model collapses into functionalism (where the effect explains the cause) or if the constraint turns out to be merely an aggregate of individual motives. The most likely failure mode is inability to specify how the constraint is empirically identifiable independent of the behavior it constrains, rendering the explanation circular.

  **Scope Assessment**
  The scope is limited to the logical form of cultural explanation. I will not attempt to verify specific historical claims about capitalism or religion, nor will I develop a general theory of all social structures. The focus remains strictly on the causal status of values-as-constraints. This ensures the project is completable within the semester while delivering a decisive intervention in the philosophy of social science.

  **Philosophical Value-Add**
  A historian or sociologist could describe the correlation between values and conduct or trace the diffusion of ideas, but they cannot adjudicate the metaphysical status of the explanation itself. Only philosophical treatment can clarify whether citing a cultural value constitutes a causal claim or an interpretive classification. By resolving whether values function as constraints on the possible rather than motives for the actual, this project provides the conceptual groundwork necessary for empirical researchers to design tests that do not beg the question against cultural causation. It transforms a stalemate in social theory into a tractable problem of causal inference.
