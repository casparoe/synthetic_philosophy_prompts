  **LOGICAL SPACE & OCCUPANCY**

  **Permitted Combinations:** 96 logical paths (2×2×3×2×2×2×2).
  **Occupied Cells:** 12. These represent coherent philosophical positions currently defended or plausibly defensible.
  **Empty Cells:** 84.
  **Diagnosis of Empty Cells:**
  *   *Incoherent:* Claiming similarity matters but adversarial copies count more than natural ones.
  *   *Unattractive:* Accepting root cooperation but denying any reason scales with numbers (waste of leverage).
  *   *Unoccupied:* Views that require exact identity but accept graded similarity in Hazy Mirror (contradictory).
  *   *Normative Mismatch:* Claiming rationality demands defect but cooperating without moral grounds (arbitrary).

  **INSEPARABLE PAIRS**

  1.  **Evidential vs. Functional Decision Theory:** Both converge on cooperation in all tree cases; separation requires cases involving logical counterpossibles not captured here.
  2.  **Moral Realism vs. Constructivism:** Both occupy the "Moral Grounds" leaves; separation requires meta-ethical questions outside decision-structure.
  3.  **Identity vs. Impersonal Good:** Both occupy the "Impersonal Good" leaves; separation requires cases where self-interest conflicts with the impersonal good.

  ***

  **DIAGNOSTIC DECISION TREE**

  **ROOT:** In a one-shot prisoner's dilemma against an exact psychological copy of yourself (same choice, same information), cooperation is what you should do.

  **NODE 1: NORMATIVE GROUNDING**
  *Stipulate the correct theory of rational choice says defect. Do you still cooperate on moral or axiological grounds?*
  (Diagnostic: Separates views locating reason in decision-structure from views locating it in the good.)
  ├── **YES (Moral/Axiological)** ──┬── **NODE 2: INSTITUTIONS**
  │                                 *Would you cooperate only if a binding agreement or institution existed?*
  │                                 (Diagnostic: Separates unconditional moralists from contractualists.)
  │                                 ├── **YES** ──► **LEAF 1: Moral Contractualist**
  │                                 │              *Least comfortable: Must treat root cooperation as moral exception, not rational requirement.*
  │                                 └── **NO** ──► **LEAF 2: Identity/Impersonal Good (Non-Scalable)**
  │                                                *Least comfortable: Must cooperate even if no good is produced.*
  │
  └── **NO (Decision-Theoretic)** ──┬── **NODE 3: SCALE**
                                    *Does the strength of the reason depend on how many correlated agents there are?*
                                    (Diagnostic: Isolates whether correlation creates aggregate leverage.)
                                    ├── **NO (Fixed)** ──┬── **NODE 4: HAZY MIRROR**
                                    │                    *1000 agents, 80% match. Cooperate? Count full/proportional/none?*
