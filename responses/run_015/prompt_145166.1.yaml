                                    │                                       *Least comfortable: Must treat similarity as proxy for procedure.*
                                    │
                                    └── **YES (Scalable)** ──┬── **NODE 5: HAZY MIRROR**
                                                             *1000 agents, 80% match. Cooperate? Count full/proportional/none?*
                                                             (Diagnostic: Tests if scaling applies to degraded copies.)
                                                             ├── **NONE** ──┬── **NODE 6: COPY-SPAM**
                                                             │              *50k copies, 15% match, adversary. Reason changes?*
                                                             │              (Diagnostic: Tests vulnerability to manufactured correlation.)
                                                             │              ├── **INCREASES** ──► **LEAF 5: Naive Correlational**
                                                             │              │                    *Least comfortable: View can be exploited by anyone able to manufacture copies.*
                                                             │              └── **SAME/LESS** ──► **LEAF 6: Exact-Only Correlational (Scalable)**
