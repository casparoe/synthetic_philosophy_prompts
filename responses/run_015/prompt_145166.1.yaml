                                                             │
                                                             └── **FULL/PROP** ──┬── **NODE 6: COPY-SPAM**
                                                                                 *50k copies, 15% match, adversary. Reason changes?*
                                                                                 (Diagnostic: Tests if adversarial origin discounts correlation.)
                                                                                 ├── **INCREASES** ──► **LEAF 7: Graded Similarity (Vulnerable)**
