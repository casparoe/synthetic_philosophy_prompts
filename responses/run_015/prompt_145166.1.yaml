  ├── **LEAF 12: Descriptive: Probabilistic Threshold**
  │              *Least comfortable: Must defect if world size is uncertain below a specific probability.*

  ***

  **NODE DIAGNOSTICS SUMMARY**

  1.  **Normative Grounding:** Distinguishes decision-theoretic rationality from moral obligation.
  2.  **Institutions:** Separates those requiring enforcement mechanisms from unconditional cooperators.
  3.  **Scale:** Determines if rational force aggregates across multiple correlated agents.
  4.  **Hazy Mirror:** Tests whether correlation requires exact identity or admits degrees of similarity.
  5.  **Copy-Spam:** Isolates views vulnerable to adversarial exploitation via low-fidelity copies.
  6.  **Twin Thought:** Distinguishes fidelity to one's own procedure from deference to superior reasoning.
  7.  **Single/Probable:** Tests whether the view collapses when the "large world" assumption is removed.
  8.  **(Implicit Merge):** Paths converging on Commitment Devices vs. Baseline Causal views.
