          *   *Systemic Illumination:* Medium. It focuses on the *consequences* of his metaphysics rather than the *foundations*.
          *   *External Implications:* Very High. Systemic injustice is a pressing contemporary concern. Testing historical theodicies against modern sociology is a growing field.
          *   *Risk:* Might become more sociological than philosophical, or force Leibniz into a box he wasn't meant to fit (anachronism).

