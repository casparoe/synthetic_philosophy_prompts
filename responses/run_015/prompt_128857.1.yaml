      *   *Case 2 (Ex-Convict):* **No** to right to be forgotten (news articles). *Principle:* Public record/truth > Individual rehabilitation/privacy. (Note: This seems to contradict Case 5).
      *   *Case 3 (Poet's Journals):* **Yes** to destruction (heirs' wish) over scholarly interest. *Principle:* Private/Heir autonomy > Public historical knowledge. (Note: This contradicts Case 2 & 4).
      *   *Case 4 (Colonial Monument):* **No** to melting without record. *Principle:* Material history must be documented/preserved > Desire to erase uncomfortable history. (Note: Nuanced: they didn't say *keep* the monument, just don't erase the *form*).
      *   *Case 5 (Factory Survivors):* **Yes** to right to be forgotten (documentaries) over public interest. *Principle:* Victim autonomy/trauma > Public documentation. (Note: This contradicts Case 2. Why is the convict different from the survivor?).
      *   *Case 6 (School Genocide Unit):* **No** to dropping the unit. *Principle:* Educational duty to remember > Parental comfort/denial. (Aligns with Case 1).

  3.  **Identify the Tensions/Inconsistencies:**
      *   *Tension A (Who owns the memory?):* Case 2 (Public owns convict's past) vs. Case 3 (Heirs own poet's past) vs. Case 5 (Survivors own their trauma).
      *   *Tension B (Material vs. Digital/Record):* Case 4 (Don't erase material form without record) vs. Case 3 (Destroy physical journals).
      *   *Tension C (Victim vs. Perpetrator/Agent):* Case 1 & 6 (State/School must remember victims) vs. Case 5 (Victims can choose to forget).

      *Crucial Observation:* The board seems to distinguish between *Agentive Memory* (doing the remembering) and *Imposed Memory* (being remembered).
      *   *Victims/Sufferers:* Can choose to forget (Case 5), OR must be remembered by the state if they can't choose (Case 1, 6).
      *   *Perpetrators/Complex Figures:* Cannot scrub their record (Case 2).
      *   *Private vs. Public:* Private artifacts (Journals) can be destroyed by heirs (Case 3). Public artifacts (Monuments, News, Schools) must retain a trace (Case 2, 4, 6).

  4.  **Analyze the New Proposal:**
      *   *Subject:* Unmarked graveyard of 1920s migrant workers (Dead, powerless, likely victims of systemic neglect).
      *   *Action:* Pave over (destroy physical) + AI Virtual Memorial (digital reconstruction).
      *   *Options:* Allow w/ Virtual, Allow w/ Physical Markers, Block.

  5.  **Evaluate Options against Precedents:**
      *   *Option 1 (Allow w/ Virtual):* Aligns with technological progress? But contradicts Case 4 (Monument). Case 4 says don't melt without record of *form*. AI reconstruction is a *new* form, not a record of the old form. Also, Case 3 allows destruction of private stuff, but this is a graveyard (public/communal space?).
      *   *Option 2 (Allow w/ Physical Markers):* Aligns with Case 1 (Plaques) and Case 4 (Record of form). Acknowledges the physical reality of the grave.
      *   *Option 3 (Block Entirely):* Aligns with Case 6 (Don't drop the unit) and Case 1 (Force remembrance). Protects the sanctity of the dead.

      *The "Weird/Bureaucratic" Twist:* The board likes *records* but hates *erasure*. However, they also respect *heir autonomy* (Case 3). Who are the heirs of 1920s migrants? Likely no one identifiable. This shifts the balance to "State Duty."

      *The AI Element:* This is the wildcard. Case 2 says you can't scrub news (truth). Case 4 says you can't erase form. AI *fabricates* faces/voices from census scraps. Is this remembering or fiction? Margalit would worry about "shared memory" vs. "common memory." Rieff would worry about the "therapeutic" vs. "sacred."
      *   *Verdict:* The board should likely **reject the AI substitution** but **allow the paving IF physical markers remain**. Why? Because AI is a *simulation* of memory, whereas a plaque or preserved plot is a *witness* to memory. Case 4 is the strongest analog here (Monument). You can remove the object, but you must keep the *trace* of the object, not a *reimagining* of it.

  6.  **Synthesize the Hidden Principle:**
      *   It's not just "Remember Good, Forget Bad."
      *   It looks like: **"Memory must be anchored in material truth or victim autonomy, never in administrative convenience or simulated comfort."**
      *   *Refinement:* The board distinguishes between **Witnessing** (physical trace, mandatory for public history) and **Owning** (private choice, allowed for individuals/heirs).
