      *   *Check Case 5:* Survivors rejected documentaries. They are alive. Dead migrants can't reject.
      *   *Check Case 4:* Monument melting. Requires record of form.
      *   *Conclusion:* The AI memorial is *not* a record of form. It's a creative reinterpretation. The board should hate that. They want the *scar*, not the *makeup*.
      *   *Verdict:* Block the AI. Allow paving ONLY with physical markers (Case 1 + Case 4 hybrid).
