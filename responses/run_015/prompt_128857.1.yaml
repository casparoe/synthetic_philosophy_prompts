answer: |-
  This is a fantastic setup. The board's precedents are rich with the specific tension between Margalit's "ethics of memory" (obligations to remember) and Rieff's "culture of forgetting" (the necessity of repression for life to go on), filtered through a bureaucratic lens that cares more about *procedure* than *morality*.

  Here is the breakdown of their consistency, the verdict, and the hidden principle driving the machine.

  ### The Verdict
  **Allow only if physical markers remain.** (The AI memorial is rejected; the paving is conditional).

  ### The Closest Analog
  **Case 4 (The Colonial Monument).**
  In Case 4, the board said you cannot melt a monument *without leaving a record of its form*. They did not say the monument must stand forever (allowing for Rieffian forgetting of the *object*), but they insisted the *trace* of its existence must remain (Margalit's ethics of witness).

  In the Migrant Graveyard case, the developer proposes replacing the *trace* (the physical grave) with a *simulation* (AI faces). The board's history suggests they view a simulation as a form of erasure. A plaque (Case 1) is a trace; an AI reconstruction is a narrative. The board trusts scars, not stories.

  ### The Hidden Principle: "The Prohibition on Synthetic Continuity"
  If you look closely at the six prior rulings, the board isn't actually balancing "Remembering vs. Forgetting." They are balancing **Witness vs. Ownership.**

  1.  **Witness (Public/Material):** When something enters the public sphere or involves state power (Case 1, 4, 6), memory must be anchored in *material truth*. You can't drop the genocide unit (Case 6); you can't erase the monument's form (Case 4); you must plaque the state violence (Case 1).
  2.  **Ownership (Private/Agentive):** When memory is contained within a private individual or lineage (Case 2, 3, 5), autonomy rules. The poet's heirs can burn journals (Case 3); the survivors can ban docs (Case 5).
      *   *Wait, what about the Convict (Case 2)?* That's the outlier that reveals the real rule. The convict was denied the right to be forgotten *because news articles are public records.* The board distinguishes between **Private Trauma** (Survivors, Case 5) and **Public Fact** (Convict, Case 2).

  **The Hidden Rule:** *Memory must be materially grounded if it is public, but it may be discarded if it is private. However, it may never be synthetically replaced.*

  The AI memorial fails because it attempts to create **Synthetic Continuity**. It tries to use technology to bridge the gap between erasure (paving) and remembrance (the memorial). The board's bureaucracy seems to operate on a belief that *digital is not real*. To them, an AI voice is a lie; a physical plaque is a witness.

  ### The Competing Rules
  If we dig deeper, there are two conflicting principles vying for dominance in this specific case, because the migrants are **Dead** (no autonomy) but **Powerless** (victims).

  *   **Rule A: The Duty of Material Witness.** (Derived from Cases 1, 4, 6). The state must preserve the physical evidence of suffering to prevent historical gaslighting.
  *   **Rule B: The Right of Mnemonic Autonomy.** (Derived from Cases 3, 5). The subjects of memory (or their heirs) get to decide the mode of their remembrance.

  **Which Rule Wins?**
  **Rule A (Material Witness) wins.**
  Why? Because Rule B requires an *agent*. The poet had heirs (Case 3); the survivors were alive (Case 5). The 1920s migrants have no voice and no identifiable heirs. In the absence of autonomy, the board defaults to the State's Duty to Witness. They cannot allow the dead to be "spoken for" by an algorithm (Case 2 precedent: you can't rewrite the public record).

  ### The Tie-Breaker Hypothetical
  To truly stress-test this board and see if they are consistent, you need a case where **Material Witness** clashes directly with **Victim Autonomy** regarding the *dead*.

  **The Case:**
  A victim of state violence (similar to Case 1) leaves a verified will demanding **no plaque, no record, total silence.** The State argues that without the plaque, the history of the violence will be denied by future regimes (Case 1 logic). The Estate argues that enforcing the plaque violates the victim's post-mortem autonomy (Case 3/5 logic).

  **Why this breaks them:**
  *   If they **force the plaque**, they admit that *History* is more important than *People*. (Consistent with Case 1 & 6, betrays Case 3 & 5).
  *   If they **honor the will**, they admit that *Forgetting* is a human right that survives death. (Consistent with Case 3 & 5, betrays Case 1 & 6).

  **The Bureaucratic "Weird" Solution:**
  Given their weirdness, they might rule: **"The plaque must be installed, but the text must be blank."**
  This satisfies the Material Witness (there is a stone) and the Autonomy (there are no words). It preserves the *scar* without imposing the *narrative*. This fits their obsession with "form over content" seen in Case 4 (record the form of the melted monument).

  ### Summary for your Novel
  The board operates on a **Phenomenology of Scars**. They believe pain must leave a physical mark to be valid.
  *   **Digital/AI =** Invalid/Erasure.
  *   **Physical/Plaque =** Valid/Witness.
  *   **Living Choice =** Supreme (can remove the scar).
  *   **Dead Silence =** State Property (the State owns the scar).

  The verdict on the graveyard is: **You may pave the dead, but you must leave the scar.** The AI faces are an insult because they try to heal the scar with makeup. The board hates makeup. They want the wound.
