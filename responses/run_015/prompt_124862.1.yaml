  2.  **Deconstruct the User's Intuition:**
      *   What distinguishes "Actor" from "Background" in the user's mind?
      *   *Scale of Impact?* Black Death (High) vs. Smallpox in one town (Low). Sahara (High total impact, but low *rate* of change).
      *   *Directness of Mechanism?* Blight eats potato -> Hunger. Volcano erupts -> Cloud -> Cold -> Rust -> Hunger. (The user separates the volcano from the rust).
      *   *Human Response/Institutional Change?* Feudalism collapsed (Black Death). Migration occurred (Rust). Colonial systems changed (Smallpox). Famine occurred but no systemic change? (Krakatoa).
      *   *Intentionality?* None of them have intent, so "actor" here must mean "agent of change" in a sociological/historiographical sense (e.g., Actor-Network Theory or Environmental History).
      *   *The "Trigger" vs. "Condition" distinction:* The user seems to privilege the *proximate cause* of the human decision over the *ultimate cause* of the environmental state.

  3.  **Evaluate the Inconsistencies:**
      *   **Tambora Split:** This is the biggest logical hole. If the volcanic winter created the conditions for the rust, why is the winter "background" and the rust "actor"? Both are non-human. If the rust is an actor because it *directly* destroyed food, the volcano is an actor because it *directly* destroyed the climate that grew the food. The distinction seems to be biological vs. geological.
      *   **536 AD vs. Krakatoa:** Both are volcanic events causing climate shifts causing famine/state collapse. Why is 536 an actor and Krakatoa background?
          *   *Hypothesis:* 536 had a longer duration/more profound systemic collapse (Late Antiquity transition) compared to Krakatoa (which was severe but perhaps absorbed by existing imperial structures without fundamental regime change).
          *   *Hypothesis:* 536 is bundled with Plague (Justinian). Krakatoa is bundled with just famine.
