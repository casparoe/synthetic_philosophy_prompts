      *   **Honesty Check:** The user is being slightly "anthropocentric" in disguise. They are defining "actor" based on *human reaction* rather than the entity's own properties. That's fine for history, but needs to be admitted.

  7.  **Refining the Output (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "You're wrong." I need to show *why* the inconsistency exists (proximate vs. ultimate cause) and how to resolve it.
      *   *Nuance:* The 536 vs. Krakatoa distinction is tricky. Krakatoa *did* have huge impacts. Maybe the user's intuition is about *historical narrative*. 536 is a "turning point." Krakatoa is a "disaster within continuity."
      *   *Principle Name:* Let's call it the **"Contingent Structural Necessity"** principle.
      *   *The Rust/Volcano verdict:* I need to be firm. You can't have the effect be an agent and the cause be scenery. I will recommend elevating the Volcano to Actor status to match the Rust.

  8.  **Final Polish:** Check tone. Needs to be analytical, philosophical but grounded in history. Ensure all parts of the prompt are answered (Principle, Case Application, Consistency Check).

      *(Self-Correction on El Niño)*: Make sure to distinguish between "El Niño" (the pattern) and the specific drought event.
