      *   **Smallpox:** Depends on the *consequence* (institutional change), not the *event* (death toll).

  4.  **Formulate Principles:**
      *   *Candidate 1: The "Institutional Disruption" Principle.* An entity is an actor if its intervention forces a reconfiguration of human social/political/economic structures. (Explains Black Death, Potato Blight, Smallpox/Americas. Explains away Smallpox/Town. Explains Sahara as too slow to force *reconfiguration* rather than *adaptation*).
      *   *Candidate 2: The "Proximate Trigger" Principle.* An entity is an actor if it is the immediate cause of the human decision/action. (Explains Rust vs. Volcano. But this is biologically arbitrary).
      *   *Candidate 3: The "Non-Human Agency" (ANT) Principle.* Anything that modifies a state of affairs is an actor. (Too broad, makes everything an actor).

      *   *Refining the User's Intuition:* The user seems to be using a hybrid of **Impact Magnitude** + **Institutional Consequence** + **Proximate Causality**.
      *   *The Fix:* To be consistent, the user must drop the biological/geological distinction. If the Rust is an actor because it caused migration, the Volcanic Winter is an actor because it caused the Rust. You can't have a causal chain where the middle link is an agent but the first link is scenery.
      *   *Better Principle:* **"The Counterfactual Structural Change Principle."** A non-human entity counts as a historical actor if, *had it not occurred*, specific human institutional structures would not have changed in the way they did, *and* the change happened within a timeframe that required active human reorganization (not just gradual adaptation).

  5.  **Addressing the Specific Inconsistencies:**
      *   **Rust vs. Volcano:** This must go. If the rust is an actor, the volcano is a *co-conspirator* or a *remote actor*. If the volcano is background, the rust is just a mechanism of the background. To be consistent: Either both are actors (as part of a causal assemblage) or neither is (if the human response was the real driver). Given the user wants to validate "germs/volcanoes" as actors, they should accept the volcano.
      *   **536 vs. Krakatoa:** This depends on the *outcome*. 536 led to the end of Antiquity/State collapse. Krakatoa led to famine but arguably not a regime change in China/Ethiopia comparable to the fall of Rome or Feudalism. So the principle relies on *structural transformation*, not just suffering.
