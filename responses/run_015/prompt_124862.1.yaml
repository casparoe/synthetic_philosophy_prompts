          *   Clause 3: Forces institutional reorganization, not just hardship (excludes Krakatoa/Smallpox Town).
      *   **Critique the Rust/Volcano Split:** This is the weak point. It relies on a "biological privilege" that doesn't hold up. If the rust is an actor, the atmospheric chemistry that enabled it is equally agential in this framework.
      *   **Apply to El Niño:**
          *   Scenario: El Niño dries region -> Resource Conflict.
