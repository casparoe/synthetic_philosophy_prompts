      *   *Idea 2: Resource Allocation.* An agent distributes resources. They choose an equal split instead of a max-utilization split.
          *   Explanation 1 (Values): They value equality (inequality aversion).
          *   Explanation 2 (Epistemic): They don't know which recipient is more productive. Equal split is a heuristic for uncertainty.
          *   *Critique:* If the observer knows the productivity, they see the agent leaving utility on the table. But does the agent *know* they don't know? This touches on the "rationality" assumption.
      *   *Idea 3: The "Process" vs. "Ignorance" distinction.*
          *   Scenario: A manager assigns tasks to two subordinates, Alice and Bob.
          *   Task: Complete a project.
          *   Option A: Give all work to Alice (fastest, highest expected reward).
          *   Option B: Split work 50/50 (slower, lower expected reward).
          *   Observation: Manager chooses Option B.
          *   Explanation 1 (Preference): Manager values "procedural fairness" (giving everyone a chance) intrinsically.
          *   Explanation 2 (Epistemic): Manager believes (incorrectly, or based on hidden info) that Alice might burn out, but the observer knows Alice won't. OR, Manager doesn't know Alice's true capacity (hidden state), so hedges.
          *   *Refinement for the prompt:* The prompt asks for "lacking access to a hidden state variable."
          *   Let's make the hidden state about the *environment* or *consequences*, not just capacity.
          *   Let's try a "Trust/Delegation" scenario.

  4.  **Developing the Specific Example: "The Delegation Dilemma"**

      *   **Setup:** A principal (agent) delegates a critical task to one of two sub-agents (A or B).
      *   **Dynamics:**
          *   Sub-agent A has a 90% success rate (known to Observer).
          *   Sub-agent B has a 10% success rate (known to Observer).
          *   Reward for success = 100. Reward for failure = 0.
          *   Cost of delegation = 0.
      *   **Observation:** The Principal delegates to B (the low performer).
      *   **Explanation 1 (Non-standard Preference):** The Principal values "opportunity provision" or "mentorship." They derive utility from giving B a chance, regardless of success probability. $R_{total} = R_{outcome} + R_{fairness}$.
      *   **Explanation 2 (Epistemic Limitation):** The Principal *does not know* the true success rates. They operate under a prior that A and B are equally skilled (Hidden State: True Skill). From their perspective, $P(Success|A) = P(Success|B) = 0.5$. They pick B randomly or based on a tie-breaking rule (e.g., seniority). To the Observer (who knows the truth), this looks suboptimal. To the Agent (who is ignorant), it is Bellman-optimal given their belief state.
      *   **The Crux:** The Observer sees the action "Delegate to B". The Observer knows the *true* dynamics ($T_{true}$).
      *   **Standard IRL Assumption:** Agent optimizes $R$ under $T_{true}$.
      *   **Violation:** Agent optimizes $R$ under $T_{agent}$ (where $T_{agent} \neq T_{true}$).
      *   **Ambiguity:** Without knowing if the agent *knows* the truth, we can't tell if they are altruistic (Value) or ignorant (Belief).

