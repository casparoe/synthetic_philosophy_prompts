      *   Wait, if the agent never learns, is it IRL? IRL usually assumes the agent is optimizing.
      *   Better angle: The "Hidden State" is a variable the agent *cannot* observe (e.g., the internal state of another person).
      *   Let's pivot to the "Procedural Fairness" vs. "Hidden Risk" example.

  6.  **Finalizing the Example: "The Blind Allocation"**

