      *   **Hypothesis 2 (Epistemic):** Agent does *not* know the conversion rates. They hold a uniform prior. Expected welfare is equal. 50/50 minimizes variance or is a default heuristic under uncertainty.
      *   **Why Ambiguous?**
          *   In both cases, the action is "Split 50/50".
          *   In both cases, the action is "Optimal" *given the agent's internal state*.
          *   In H1, Internal State = Knowledge + Fairness Preference.
          *   In H2, Internal State = Ignorance + Outcome Preference.
      *   **Why not standard identifiability?** Standard identifiability is about $R$ vs. $R'$. This is about ($R_{fairness}, T_{known}$) vs. ($R_{outcome}, T_{unknown}$). It's a confounding of *Reward Structure* and *Belief State*. Standard IRL typically assumes beliefs are correct or learns them jointly but assumes the agent tries to learn. If the agent *never* acts to resolve uncertainty (exploits the prior), we can't distinguish.
      *   **Normative Theory Requirement:** To choose H1 or H2, the observer must decide: "Do I assume humans are generally informed about these rates?" or "Do I assume humans care about fairness?" This is a normative prior, not empirical data.

  7.  **Drafting the Response:**

