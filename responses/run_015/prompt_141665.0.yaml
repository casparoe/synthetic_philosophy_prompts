prompt: |-
  I have about one postdoc-year of conceptual-research funding to spend on the cluster of problems around expected value fanaticism, and I want to put it where the answer does the most downstream work. I'm less interested in re-litigating whether the fanatical verdict in tiny-probability/huge-stakes cases is correct than in why the debate looks stuck: my sense is that both sides are defending different theses under one label. The decomposition I'd start from: (i) whether value is unbounded at all, or whether some finite cap on how good an outcome can be is independently defensible; (ii) whether, granting unboundedness, small chances of astronomically large goods must be allowed to swamp moderate certain ones, or whether a principled temperance or discounting move survives; (iii) whether the estimation noise and model uncertainty that come with any real-world estimate of such probabilities and stakes are enough to defuse the fanatical verdict — or whether treating that uncertainty correctly just reinstates fanaticism one level up; and (iv) the self-application worry: every argument for or against fanaticism is itself held with less than certainty, and if you are a fanatic you seem required to weight heavily the small chance that the true decision theory or the true axiology makes the fanatical verdict catastrophically wrong, which looks as if it either supports fanaticism trivially or collapses into paralysis. Where (iv) sits in the dependency structure is my main open question.

  Give me a defended ordering for one researcher-year: which question is most upstream, which is genuinely tractable in a year by someone working alone, which matters but needs more than I have, and which I should drop because settling it wouldn't change what any funder, policy shop, or individual donor actually does. Be explicit about the criteria you're trading off, and about what evidence over the next year or two would move items up or down the list.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Deconstruct the Request:**
      *   **Goal:** Allocate one postdoc-year of conceptual-research funding to the "expected value fanaticism" cluster.
      *   **Objective:** Maximize downstream work (impact on funders, policy shops, individual donors).
      *   **Constraint:** Less interested in re-litigating the verdict itself; more interested in *why the debate is stuck* (conceptual clarification/structure).
      *   **Input Decomposition:**
          *   (i) Boundedness of value (axiology).
          *   (ii) Swamping/Discounting (decision theory given unboundedness).
          *   (iii) Estimation noise/Model uncertainty (epistemology/practical application).
          *   (iv) Self-application/Reflexivity (meta-decision theory).
      *   **Task:** Provide a *defended ordering* (priority list) based on:
          *   Upstream dependency.
          *   Tractability (one person, one year).
          *   Impact/Relevance (does it change what actors *do*?).
          *   Drop criteria (what doesn't change action?).
      *   **Requirements:** Explicit criteria trade-offs, evidence triggers for re-ordering.

  2.  **Analyze the Four Components:**

      *   *(i) Boundedness of Value:* This is deep axiology. Is there a maximum possible utility? If yes, fanaticism dies immediately (no infinite or arbitrarily large finite values to swamp). If no, we move to (ii).
          *   *Pros:* Ultimate upstream blocker.
          *   *Cons:* Extremely hard to settle philosophically. Likely won't change in a year. Even if bounded, the bound might be so high it doesn't matter for practical timescales.
          *   *Impact:* Low immediate practical impact. Most donors don't worry about the metaphysical ceiling of value, they worry about current cause prioritization.

      *   *(ii) Swamping/Discounting:* Decision theory. If value is unbounded, must we maximize EV? Or can we discount tiny probabilities (e.g., probability thresholds, risk weights)?
          *   *Pros:* Directly addresses the "longtermist" vs. "neartermist" tension.
          *   *Cons:* Normatively contentious. Hard to justify discounting without arbitrage vulnerabilities (money pumps).
          *   *Impact:* High. This determines whether "moonshot" existential risk reduction trumps "sure thing" global health.

      *   *(iii) Estimation Noise/Model Uncertainty:* Epistemology/Practicality. Can we actually *know* the probabilities and stakes? If estimates are noisy, does EV maximization converge to something else (e.g., robustness)?
          *   *Pros:* Highly tractable. Directly applicable to GiveWell, OpenPhil, etc. They *already* act on this (implicit discounting for uncertainty).
          *   *Cons:* Might just push fanaticism up a level (as the prompt notes).
          *   *Impact:* Very High. This is where the rubber meets the road for funders.

      *   *(iv) Self-Application/Reflexivity:* Meta-decision theory. If I'm unsure about my decision theory, how do I decide?
          *   *Pros:* Philosophically fascinating. Addresses the "paralysis" worry.
          *   *Cons:* Extremely abstract. Likely leads to regress or triviality.
          *   *Impact:* Low. Funders won't stop funding because of a meta-ethical regress.

  3.  **Evaluate Based on Criteria:**

      *   **Criterion 1: Upstream Dependency.** (i) is most upstream. If value is bounded, (ii)-(iv) matter less.
      *   **Criterion 2: Tractability (1 year, 1 person).** (iii) is most tractable (formal epistemology + case studies). (i) is least tractable (deep metaphysics). (iv) is high risk/high reward but likely inconclusive.
      *   **Criterion 3: Downstream Actionability.** (iii) changes behavior most. (i) changes behavior least (bounds are too far away).
      *   **Criterion 4: Resolving the "Stuckness".** The prompt suggests the debate is stuck because sides talk past each other. (iii) clarifies *why* practical recommendations diverge even if theory converges.

  4.  **Develop the Ordering:**

      *   *Priority 1: (iii) Estimation Noise & Model Uncertainty.*
          *   *Why:* It's the bottleneck for action. Even if theory says "be fanatical," practice says "we can't estimate that." If we can formalize *how* uncertainty defuses fanaticism practically, that guides funders immediately. It bridges the gap between ideal theory and non-ideal practice.
          *   *Tractability:* High. Can use existing literature on robust decision-making, imprecise probabilities, and apply to longtermist cases.
      *   *Priority 2: (ii) Swamping/Discounting (specifically focused on 'principled temperance').*
          *   *Why:* If (iii) fails (i.e., uncertainty doesn't kill fanaticism), we need to know if there's a normative justification for ignoring tiny probabilities.
          *   *Tractability:* Medium. Requires navigating money-pump arguments.
          *   *Focus:* Don't ask "is it true?" Ask "what specific axioms must we drop to avoid it, and is that cost acceptable?"
      *   *Priority 3: (iv) Self-Application.*
          *   *Why:* It's a sanity check. If the theory self-destructs, that's important. But it's likely too abstract to drive policy.
          *   *Tractability:* Low/Medium. High risk of spinning wheels.
      *   *Drop/Low Priority: (i) Boundedness of Value.*
          *   *Why:* It's the "nuclear option" but unlikely to be resolved. Also, even if unbounded, the *practical* reach of human agency might be bounded effectively. Settling the metaphysics doesn't change the epistemic constraints.

  5.  **Refine the Argument (The "Why"):**
      *   The prompt asks to maximize *downstream work*.
      *   Most "fanaticism" in the wild isn't driven by pure axiology (i); it's driven by confidence in models (iii).
      *   Therefore, clarifying (iii) does the most work to unstuck the debate. It shows that "anti-fanatics" are often just "epistemic hawks" and "fanatics" are "epistemic doves."
      *   This reframes the debate from *values* to *knowledge*, which is more productive.

  6.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the constraint (1 year) and the goal (downstream impact/unstucking).
      *   *Criteria:* Define Upstreamness, Tractability, Actionability, and "Unstucking Potential."
      *   *The Ordering:*
          1.  (iii) Epistemic Defusion (Top Priority).
          2.  (ii) Normative Temperance (Secondary).
          3.  (iv) Reflexivity (Tertiary/Exploratory).
          4.  (i) Axiological Boundedness (Drop/Defer).
      *   *Justification for each:* Connect back to criteria.
      *   *Evidence Triggers:* What would make me switch? (e.g., if a proof shows uncertainty *increases* fanaticism, move (ii) up).
      *   *Deliverable:* What does the year produce? (A framework for "Epistemic Discounting").

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I undervalue (i)? If value is bounded, fanaticism is false.
      *   *Rebuttal:* Yes, but can a postdoc settle the boundedness of value in a year? Unlikely. It's a centuries-old debate. It's a "blocking" move but not a "tractable" one. The prompt asks for *tractable* work that does downstream work.
      *   *Critique:* Is (iv) really worth keeping?
      *   *Rebuttal:* Keep it as a "check." If the theory implies paralysis, funders need to know. But don't spend 6 months on it.
      *   *Refinement on (iii):* Make sure to address the prompt's worry: "treating uncertainty correctly just reinstates fanaticism one level up." The research needs to specifically test *this* claim. Is it true? Or is there a regime where uncertainty dominates?

  8.  **Final Polish:** Ensure tone is strategic, academic but pragmatic (fitting a postdoc proposal). Use the terminology from the prompt (upstream, downstream, tractability).

      *(Self-Correction on the "Drop" category)*: The prompt asks what to drop because settling it *wouldn't change what any funder... does*. (i) fits this best. Even if value is unbounded, funders can't access the far future reliably. Even if bounded, the bound is likely beyond human reach. So (i) is theoretically upstream but practically orthogonal.

      *(Refining the "Stuckness" angle)*: The core insight should be that the debate is stuck because (ii) and (iii) are conflated. People argue about discounting probabilities (ii) when they really mean discounting *estimates* of probabilities (iii). Separating these is the key value-add.

  9.  **Final Structure:**
      *   Executive Summary of the Order.
      *   Criteria Definition.
      *   Detailed Breakdown (1-4).
      *   The "Stuckness" Hypothesis (How this solves the prompt's core worry).
      *   Evidence Triggers.
      *   Expected Output.

      *(Wait, one more check)*: The prompt asks about (iv)'s place in the dependency structure. I need to be explicit about that. (iv) depends on (ii). If you aren't a fanatic about (ii), (iv) matters less. If you are, (iv) is crucial. But since (iii) might solve the practical problem without solving (ii), (iv) is downstream of the practical solution.

      *Okay, ready to write.*
answer: |-
  Here is a defended research ordering for a one-year postdoc project, optimized for **downstream actionability** (guiding funders/policy) and **diagnostic clarity** (explaining why the debate is stuck), rather than metaphysical finality.

  ### The Criteria
  To rank these, I am trading off three variables:
  1.  **Actionability:** Does settling this change how OpenPhil, GiveWell, or an individual donor allocates capital *now*?
  2.  **Tractability:** Can a single researcher make definitive progress in 12 months without needing a new formalism or a consensus shift in metaphysics?
  3.  **Diagnostic Power:** Does this explain why the debate is currently stuck (e.g., by revealing a category error)?

  ### The Ordering

  #### 1. Priority One: (iii) Estimation Noise & Model Uncertainty
  **Status:** **Primary Focus (6–8 months)**
  **Rationale:** This is the highest-leverage intervention for both actionability and tractability.
  *   **Why Upstream for Action:** Funders do not operate on true probabilities; they operate on *estimates*. If you can demonstrate that realistic levels of model uncertainty mathematically dominate the expected value calculation in longtermist cases, you defuse fanaticism *practically* without needing to win the normative war in (ii).
  *   **Why It Unsticks the Debate:** My hypothesis is that the debate is stuck because "anti-fanatics" are actually "epistemic hawks" (doubting the estimates) while "fanatics" are "epistemic doves" (trusting the models), but they argue as if they disagree on (ii) (normative discounting). Proving that (iii) does the heavy lifting clarifies the disagreement.
  *   **Tractability:** You can use existing frameworks (imprecise probabilities, robust decision theory, Good's theorem applications) and apply them to specific longtermist interventions. You don't need to solve axiology; you need to model epistemic constraints.
  *   **The Risk:** As you noted, uncertainty might reinstate fanaticism "one level up" (e.g., expected value of the uncertainty distribution is still fanatical). Your specific task is to identify the *conditions* under which uncertainty dampens EV rather than amplifying it (e.g., heavy-tailed uncertainty vs. symmetric noise).

  #### 2. Priority Two: (ii) Principled Temperance/Discounting
  **Status:** **Secondary Focus (2–3 months)**
  **Rationale:** This is the normative backup if (iii) fails to fully defuse the problem.
  *   **Dependency:** This only becomes critical if (iii) shows that even with high uncertainty, the EV remains swamped.
  *   **Focus:** Do not attempt to prove discounting is "true." Instead, map the **cost of avoidance**. What specific rationality axioms (e.g., Continuity, Independence) must be violated to avoid fanaticism?
  *   **Actionability:** High. If you can show that avoiding fanaticism requires accepting specific money-pump vulnerabilities, funders can make an informed risk trade-off: "Are we willing to accept vulnerability to X to avoid funding Y?"
  *   **Tractability:** Medium. The literature is dense (Beckstead, Thomas, Russell), but a systematic mapping of "axiom costs" is achievable in a quarter.

  #### 3. Priority Three: (iv) Self-Application / Reflexivity
  **Status:** **Exploratory / Sanity Check (1–2 months)**
  **Rationale:** This is a dependency check, not a foundation.
  *   **Dependency Structure:** (iv) is downstream of (ii). If you conclude in (ii) that we should *not* be fanatics (i.e., we adopt a temperate decision theory), the self-application worry loses its bite (you aren't required to weight the small chance that fanaticism is true heavily, because your meta-theory rejects that weighting).
  *   **Why Keep It:** It prevents the project from delivering a solution that self-destructs. If your proposed solution in (iii) or (ii) implies that you should be uncertain enough to revert to fanaticism via (iv), you need to know.
  *   **Why Limit It:** It is highly abstract. Settling this rarely changes donor behavior directly. Donors do not pause giving because of a regress in meta-normative uncertainty. It is a "theoretical hygiene" step.

  #### 4. Drop / Defer: (i) Boundedness of Value
  **Status:** **Drop for this project**
  **Rationale:** Low actionability, low tractability, high theoretical upstreamness.
  *   **Why Drop:** While (i) is theoretically the most upstream (if value is bounded, fanaticism is impossible), it is practically orthogonal to funding decisions.
      *   *Scenario A:* Value is unbounded. Funders still face epistemic constraints (iii).
      *   *Scenario B:* Value is bounded. The bound is likely so astronomically high (e.g., $10^{100}$ utils) that it exceeds any human capacity to influence. For all practical purposes, the "effective" value space is unbounded relative to human agency.
  *   **Impact on "Stuckness":** Litigating (i) rarely moves the needle because neither side can prove it. Fanatics assume unboundedness; anti-fanatics assume boundedness. Stipulating the other's premise doesn't change their behavior because they don't believe the premise is settled.
  *   **Exception:** Only revisit this if (iii) and (ii) both result in "fanaticism stands," and you need a nuclear option to stop it. But for a 1-year impact-focused grant, this is a rabbit hole.

  ---

  ### The Core Hypothesis (The "Unstucking" Mechanism)
  Your year should aim to validate or falsify this specific claim:
  > *The fanaticism debate is stalled because participants conflate **Normative Discounting** (ii) with **Epistemic Robustness** (iii). Most intuitive resistance to fanaticism is actually driven by (iii), but is defended using arguments about (ii). Separating these allows funders to adopt 'Epistemic Temperance' without needing to resolve 'Normative Temperance.'*

  If you can formalize a policy of **"Epistemic Discounting"** (discounting probabilities based on model reliability rather than magnitude of stakes), you provide funders a tool that yields anti-fanatical results without requiring them to abandon Expected Value Maximization normatively. This is the highest-value output for a policy shop.

  ### Evidence Triggers for Re-ordering
  You should pivot the plan if the following evidence emerges in the first 3–6 months:

  1.  **Move (ii) Up:** If your modeling in (iii) shows that *increasing* model uncertainty actually *increases* the fanatical verdict (e.g., because the uncertainty distribution has fatter tails than the point estimate), then (iii) fails as a defuser. You must then pivot to (ii) to find a normative blocker.
  2.  **Move (iv) Up:** If you find that the "Epistemic Discounting" solution from (iii) is unstable under meta-uncertainty (i.e., you are uncertain about *which* epistemic model to use, and the EV of that uncertainty is fanatical), then (iv) becomes a blocker. You must solve the regress before recommending the policy.
  3.  **Move (i) Up:** Only if you discover a compelling, novel argument for a *low* bound on value (e.g., a capacity constraint on moral patients that is reachable within centuries). If the bound is "near," (i) becomes highly actionable.

  ### Expected Deliverable
  Instead of a paper titled *"Is Fanaticism True?"*, your year should produce:
  1.  **A Formal Framework:** "Epistemic Discount Rates for Longtermist Intervention."
  2.  **A Decision Matrix:** For funders, mapping levels of model confidence to allowable probability weightings.
  3.  **A Diagnostic Paper:** Explaining why the philosophical debate is stuck (the conflation of ii and iii).

  This approach respects the constraint (1 year), maximizes downstream utility (gives funders a tool, not just a verdict), and addresses your core intuition that the debate is talking past itself.
