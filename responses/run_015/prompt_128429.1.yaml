answer: |-
  Good morning. Take a look around the room. We've got roughly half evolutionary biologists and half people building evolutionary algorithms and large language models. That is a potentially volatile mix.

  Usually, when these two groups meet, one of two things happens. The biologists get protective of their terminology, worried that natural selection is being treated as a cheap metaphor for gradient descent. The engineers get impatient, worried that we're going to get stuck in a philosophical swamp about "what life really is" instead of talking about loss functions and fitness landscapes.

  I want to propose a way through the middle. I want to use this workshop to do some actual structural work, not just decorate our slides with pictures of finches and neural nets. To do that, I want to borrow a framework involving two strange inversions of reasoning—one from Darwin, one from Turing.

  Darwin's inversion was this: You can have competence without comprehension. You can have design without a designer. Nature can build things that work incredibly well—eyes, wings, immune systems—without any mind guiding the process. The competence is real, even if the comprehension is absent.

  Turing flipped the burden again. He showed us that we can grant competence—intelligence, calculation, problem-solving—without demanding that we understand the internal mechanism. We don't need to know how the gears turn to know the clock tells time. We can treat the system as a black box that performs a function.

  Here is why this matters for the next few days. These two inversions create a narrow corridor we need to walk through, and there are mirror-image mistakes waiting on both sides of the wall.

  On the engineering side, the temptation is to look at a system that works—to look at an LLM that writes code or a model that navigates a maze—and assume we understand *why* it works. Because it exhibits competence, we assume it possesses comprehension. We slip into anthropomorphism. We say the model "knows" or "understands" or "reasons." But Turing's inversion warns us: competence does not guarantee comprehension. Just because the output looks like intelligence doesn't mean the internal mechanism matches our intuition of how intelligence works. So, my request to the builders here: Don't claim we understand these systems just because they work well. Respect the black box.

  On the biology side, the mirror mistake is dismissal. Because we don't fully understand the internals of these artificial systems, or because the substrate is silicon instead of carbon, there's a temptation to say the competence isn't real. To say, "Well, it's not *real* evolution," or "It's not *real* selection." But Darwin's inversion warns us: Competence exists independently of the substrate. If an algorithm adapts to a changing environment and survives selection pressure, it is exhibiting competence, even if the mechanism is different from Earth-bound biology. So, my request to the biologists: Don't dismiss these systems just because we're partly in the dark about their internals, or because the analogy isn't perfect. The competence is the data.

  This means we have to be careful with our metaphors. Natural selection is not backpropagation. They are different processes with different constraints. If we treat them as identical, we insult the biology and we misunderstand the engineering. But if we refuse to compare them because they aren't identical, we miss the point of being in the same room.

  We are here to study how competence emerges without a guiding hand, whether that hand is absent by principle, as in nature, or absent by design choice, as in deep learning.

  So, here is the rule for the workshop. When you see a system perform well, acknowledge the competence. Do not demand a full mechanistic explanation before you take the result seriously. But simultaneously, do not fill the gap in that explanation with magic. Do not assume the system "gets it" just because it passed the test.

  Keep the tension live. If an engineer says, "The model learned this feature," ask: "In what sense? Is that competence or comprehension?" If a biologist says, "That's not evolution," ask: "Is the competence real? Does it adapt?"

  We don't need to solve the hard problem of consciousness or define the essence of life by Friday. We just need to agree that competence is something we can measure, even when comprehension is something we have to earn.

  Darwin taught us that mindless processes can build things that look designed. Turing taught us that mechanical processes can do things that look like thinking. Our job is to look at both without flinching, without over-claiming, and without dismissing.

  Let's get to work.
