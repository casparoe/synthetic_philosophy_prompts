answer: |-
  **UNIVERSITY EXAMINATION PAPER**
  **MODULE: PHIL4042 – PARADOXES OF INFINITY AND PHYSICAL POSSIBILITY**
  **TIME ALLOWED: 90 MINUTES**

  **INSTRUCTIONS:** Answer both parts of the question. The rubric below contains all necessary technical details; no outside knowledge of differential equations or physics is required.

  **QUESTION 1**

  Consider a lamp controlled by a switch. The switch schedule is fixed for all $t < 1$: the switch is down on $[0, 1/2)$, up on $[1/2, 3/4)$, down on $[3/4, 7/8)$, and so on, alternating at times $t_n = 1 - 2^{-n}$. Three variants describe how the lamp responds to this schedule:

  *   **(A) The Ideal Lamp:** Brightness equals the switch position (0 or 1). For every $t < 1$, it is fully on or fully off. The sequence of states has no limit as $t \to 1$.
  *   **(B) The Damped Lamp:** Brightness $b \in [0,1]$ relaxes toward the switch position. You are given that for every relaxation rate $k > 0$, the brightness converges as $t \to 1$ to a determinate limit strictly between 0 and 1 (e.g., $\approx 0.25$ for $k=1$, $\approx 0.48$ for $k=4$). You are not required to calculate these limits.
  *   **(C) The Dead-Band Lamp:** A two-state device that ignores any switch position not held for at least $\delta > 0$. It stops registering flips once intervals fall below $\delta$. Its final state is fully On or Off depending on the parity of the last registered flip. As $\delta$ is halved, the final state alternates.

  **Note:** For any chosen number of flips $N$, both the Damped lamp (with large $k$) and the Dead-Band lamp (with small $\delta$) match the Ideal lamp to arbitrary accuracy over the first $N$ flips. The three devices are indistinguishable by any finite observation prior to $t=1$.

  **(a)** Thomson argues the Ideal Lamp story is incoherent because the state at $t=1$ cannot be On or Off. Benacerraf replies the story is consistent but fails to determine the state at $t=1$. Using variants (A), (B), and (C), evaluate these diagnoses. In your answer, you must: distinguish between agency, physical realizability, logical coherence, and state determination; explain why the Damped and Dead-Band variants challenge Thomson's excluded-middle premise; and state the general condition required for a supertask to yield a determinate outcome, contrasting this with convergent tasks like Zeno's runner. (15 marks)

  **(b)** Given that the Damped and Dead-Band families match the Ideal lamp on all finite prefixes yet disagree on the limit, does this show the final state of the Ideal lamp is underdetermined, or that the Ideal lamp is not a well-defined physical object? Justify your verdict. (5 marks)

  ***

  **MODEL ANSWER**

  The three lamp variants demonstrate that the Thomson-Benacerraf dispute conflates distinct questions: whether an agent can perform infinitely many acts (agency), whether such a process obeys physical laws (realizability), whether the description contains a contradiction (coherence), and whether the description fixes the outcome (determination). Thomson's argument targets coherence, claiming the state at $t=1$ violates the law of excluded middle. Benacerraf targets determination, claiming the state is simply undefined. The variants suggest a third diagnosis: the original story provides a *kinematic* specification (switch positions) but lacks a *dynamic* law (lamp response).

  Variant (A) reproduces Thomson's paradox: the state oscillates without a limit. Thomson concludes incoherence; Benacerraf concludes underdetermination. However, Variant (B) shows that a physically plausible system (continuous brightness) can complete the supertask coherently. The Damped Lamp converges to a specific brightness, yet this brightness is neither On nor Off. This refutes Thomson's excluded-middle premise that the lamp *must* be On or Off at $t=1$. The contradiction arises only if one presupposes binary states, which is a modelling choice, not a logical necessity. Variant (C) further complicates determination: the Dead-Band Lamp ends determinately On or Off, but *which* state depends on $\delta$, a parameter absent from the original story.

  This implies that logical coherence is preserved (contra Thomson), but determination fails without dynamic laws (supporting a modified Benacerraf). The failure is not in the possibility of the supertask, but in the completeness of the description. A kinematic schedule of switch positions does not entail a dynamic outcome. For the state at $t=1$ to be determinate, the effects of the remaining operations must vanish in the tail. In the Damped case, the influence of late flips is summably small due to relaxation; in the Dead-Band case, late flips have trivial effect (zero) because they are ignored. In the Ideal case, every flip has full effect, and the alternation never settles. This distinguishes the lamp from unproblematic convergent supertasks like Zeno's runner or a bouncing ball. In those cases, the spatial distance or bounce height diminishes to zero; the "tail" of the task contributes nothing to the final position. In the Ideal Lamp, the "tail" contributes maximal oscillation.

  Regarding determinism, the Ideal Lamp is not a counterexample to physical lawfulness. Determinism requires that laws plus prior state fix the future. Here, the "laws" are unspecified. If we stipulate the Ideal Lamp's binary response as a law, the system has no limit at $t=1$, meaning the state function is discontinuous. This is a failure of the state function to possess a limit, not a failure of the laws to determine the state at every $t < 1$. The indeterminacy at $t=1$ arises because the boundary condition is not fixed by the prior history in the absence of a convergence condition.

  **(b)** The fact that finite prefixes match while limits diverge shows that the Ideal Lamp is not a well-defined physical object, rather than merely being underdetermined. Physical objects possess dispositions (like damping or dead-bands) that govern their response to high-frequency inputs. The "Ideal Lamp" is a mathematical abstraction that assumes state changes are instantaneous and cost-free. Since no physical system can match the Ideal Lamp's response over *all* prefixes while maintaining a binary state limit, the Ideal Lamp describes an impossible physical disposition. The underdetermination is not epistemic (we lack information) but ontological: there is no fact of the matter about the Ideal Lamp's limit because no physical system instantiates that specific input-output mapping in the limit. The variants show that to make the supertask physically meaningful, one must specify the dynamics; without them, the "Ideal" description is incomplete to the point of incoherence as a physical model.

  ***

  **MARKING SCHEME (20 MARKS)**

  **Move 1: Distinction of the Four Questions (4 marks)**
  *   **4 marks:** Clearly distinguishes agency, physical realizability, logical coherence, and state determination. Explains that Thomson attacks coherence while Benacerraf attacks determination, and that the variants separate these issues.
  *   **2 marks:** Distinguishes only two or three questions (e.g., conflates coherence with physical possibility).
  *   **0 marks:** Treats all issues as the same question ("Is the supertask possible?").
  *   *Common Error:* Assuming that if a task is physically unrealizable, it is logically incoherent.

  **Move 2: Verdict on the Debate (4 marks)**
  *   **4 marks:** Argues for the "Third View" (Kinematic vs. Dynamic). States that Thomson is wrong (coherence holds) and Benacerraf is partially right (underdetermination) but misses that the story lacks dynamic laws.
  *   **2 marks:** Sides strictly with Thomson or Benacerraf without using the variants to modify the position.
  *   **0 marks:** Merely summarizes the Thomson-Benacerraf exchange without applying the variants.
  *   *Common Error:* Claiming Benacerraf is fully correct without noting that the Damped Lamp provides a *determinate* outcome (just not binary).

  **Move 3: Excluded Middle & Parameters (4 marks)**
  *   **4 marks:** Explains that the Damped Lamp violates the "On or Off" premise (continuous state) and the Dead-Band Lamp violates uniqueness (depends on unstated $\delta$).
  *   **2 marks:** Mentions the Damped Lamp is intermediate but fails to link this to Thomson's excluded middle premise.
  *   **0 marks:** Ignores the specific properties of (B) and (C).
  *   *Common Error:* Treating the intermediate brightness as a "vague" state rather than a determinate non-binary value.

  **Move 4: General Condition & Zeno Contrast (4 marks)**
  *   **4 marks:** States the condition: effects of remaining operations must vanish in the tail. Contrasts with Zeno/bouncing ball where position/height converges to zero.
  *   **2 marks:** Mentions convergence but fails to articulate the "tail effects" condition or the contrast with Zeno.
  *   **0 marks:** Claims all supertasks are identical regarding convergence.
  *   *Common Error:* Arguing that Zeno's runner also fails to reach the limit.

  **Move 5: Determinism & Part (b) (4 marks)**
  *   **4 marks:** (Part a) Distinguishes failure of lawfulness from absence of a limit. (Part b) Verdict that Ideal Lamp is not well-defined physically because finite indistinguishability implies physical dispositions must diverge in the limit.
  *   **2 marks:** Addresses determinism but gives a weak answer to (b) (e.g., "it is just underdetermined").
  *   **0 marks:** Claims the supertask violates relativity (faster than light) or that the Damped Lamp reveals the "true" state.
  *   *Common Error:* In Part (b), claiming the Ideal Lamp is physically possible but we just don't know the outcome.

  ***

  **EXAMINER'S NOTES**

  **The Best Wrong Answer**
  The most attractive incorrect script will be one that accurately recites the Thomson-Benacerraf dialectic and correctly identifies that the Damped Lamp avoids the contradiction. It will likely score well on Move 1 and Move 3. However, it will fail Move 2 and Move 4 by treating the variants merely as evidence for Benacerraf's "underdetermination" thesis, missing the deeper point that the original story was *kinematically* complete but *dynamically* empty. It will fail to articulate the "vanishing tail" condition, treating the lamp as identical to Zeno's runner. Such a script demonstrates knowledge of the literature but fails to *use* the new material to restructure the problem. It should be awarded a High 2:2 or Low 2:1 (10–12/20).

  **Moves Earning Nothing**
  Zero marks are awarded for answers that rely on external physical objections not permitted by the rubric, specifically the claim that the switch must move faster than light or that infinite energy is required. The question stipulates the switch schedule is fixed; students must analyze the logical/structural implications, not the engineering constraints. Similarly, no credit is given for treating the Damped Lamp's intermediate brightness as a discovery of what the lamp is "really" doing; it is one admissible completion among many. Finally, pure summary of the Thomson-Benacerraf debate without reference to the three specific lamp variants cannot pass, as the question demands application of the provided material.
