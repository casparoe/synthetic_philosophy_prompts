  Hi — novelist here, and I need one joke, and I've been staring at this page for two days.

  The scene: a dinner party, six people, dessert. One of them, Marianne — health economist, thinks she's much funnier than she is — tells a joke. My narrator (first person, a bit of a snob, does not want to like Marianne) has to admit to herself that it's actually good. So the joke has to work out loud, at a table, in about four sentences, with no setup that needs a footnote, and I'd like it to end on a line of dialogue spoken by the monster itself. It should be funny to a smart person who's never heard the term, and funnier to one who has.

  The topic is the utility monster: the one being who gets vastly more welfare out of every unit of resource than anybody else does, so that maximizing the total means everything goes to it.

  The wrinkle, and this is the part I actually care about: I don't want the version everyone's already heard, where the monster is greedy and eats the world. Mine is the opposite. It's scrupulously polite, eats almost nothing, and never asks for anything. It gets its enormous utility from being *offered* things — somebody saying "would you like my sandwich?" is worth a million times more to it then eating the sandwich is worth to you. So nobody gives anything up, nobody is harmed, and the total is still completely dominated by the monster: the best available world is everyone standing around politely offering it stuff all day while it says no thank you.

  My hope is that this isolates something real, that the objection doesn't come from the appetite, it comes from the exchange rate — one creature's utility function being so steep that it swamps the sum however little it consumes. But I might have definately built a different objection by accident, or none at all.

  So: write the joke. Then, in a couple of paragraphs, tell me where it takes liberties — is my polite monster doing the same work as the greedy one, or have I quietly changed the subject? If it's broken, what's the smallest change to the setup that fixes it. And be explicit about how confident you are that the joke really turns on the structure of the problem rather than on something that just rhymes with it, and single out the one bit you're least sure about.
