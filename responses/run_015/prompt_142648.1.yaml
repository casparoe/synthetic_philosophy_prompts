answer: |-
  **JOINT STATEMENT ON STRAWSONIAN REACTIVE ATTITUDES AND DETERMINISM**

  **To:** The Reading Group on Moral Philosophy and Science
  **From:** The Practice-Naturalist and Normative-Cognitivist Working Groups
  **Subject:** Convergence and Residual Disagreement Regarding *Freedom and Resentment*
  **Date:** October 26, 2023

  **Preamble**
  Following a period of adversarial collaboration, the undersigned camps—the Practice-Naturalists (PN) and the Normative-Cognitivists (NC)—submit this joint statement. While we share a common commitment to P.F. Strawson's naturalistic turn in the free will debate, we diverge on the metaphysical commitments inherent in our moral practices and the implications of scaling these practices to institutional levels. This document codifies our shared ground, delineates our precise disagreements, and identifies the empirical and conceptual cruxes that remain to be resolved.

  ### I. Agreed Claims

  Both camps affirm the following propositions as foundational to our continued inquiry:

  1.  **The Primacy of Reactive Attitudes:** We accept Strawson's central thesis that reactive attitudes (e.g., resentment, gratitude, indignation) constitute the essential framework of human moral life. They are not merely emotional epiphenomena but the medium through which moral responsibility is enacted.
  2.  **Empirical Pervasiveness:** We agree that reactive attitudes are empirically ubiquitous and psychologically resilient. The acceptance of causal determinism, whether at a seminar level or a societal level, does not cause these attitudes to vanish from human interaction.
  3.  **The Participant Stance:** We concur that the "participant stance" is the default mode of human engagement. The "objective attitude" is a recognized but limited modification, typically reserved for cases of incapacity (e.g., severe mental illness, infancy) rather than universal determinism.
  4.  **Determinism and Disappearance:** We jointly reject the claim that determinism logically necessitates the immediate abandonment of all reactive attitudes. We agree that Strawson successfully demonstrated that the skeptic cannot live out their skepticism in ordinary interpersonal relationships.
  5.  **Institutional Relevance:** We acknowledge that modern penal and legal institutions are the macroscopic expressions of micro-level reactive attitudes. Any viable theory of responsibility must account for how these attitudes function when mediated by impersonal structures rather than face-to-face relationships.

  ### II. Precise Statements of Disagreement

  Despite our convergence on the descriptive psychology of responsibility, we diverge on the normative implications of determinism and the structural integrity of moral practices at scale.

  **A. The Metaphysical Commitment of Reactive Attitudes**
  *   **Practice-Naturalist Position:** Reactive attitudes are biologically evolved social technologies that function independently of metaphysical truth claims. To ask if they are "justified" given determinism is a category error analogous to asking if temperature is "justified" given statistical mechanics. They require no libertarian freedom to remain valid; their validity is internal to the practice itself.
  *   **Normative-Cognitivist Position:** Reactive attitudes operate as implicit cognitive-evaluative judgments that carry a commitment to the agent being a non-deterministic source of action. While we cannot eliminate these attitudes, determinism reveals the retributive core of many as based on a false presupposition. Therefore, while the attitudes persist empirically, their normative authority is compromised without restructuring.

  **B. Moral Thermalization and Institutional Stability**
  *   **Practice-Naturalist Position:** The phenomenon termed "moral thermalization" by the NC camp is merely the scaling of local normative equilibria. Institutional structures (courts, bureaucracies) transmit and aggregate interpersonal expectations without fundamentally altering their nature. The participant stance remains stable even in anonymous contexts because the institution acts as a proxy for the community's relational expectations.
  *   **Normative-Cognitivist Position:** "Moral thermalization" describes a phase transition where reactive attitudes lose their relational anchor and diffuse into rigid institutional structures. In large-scale penal systems, this decoupling allows retributive blame to persist without the corrective feedback of personal reconciliation. This destabilizes the practice-based defense, necessitating a shift from blame-based retribution to respect-based accountability.

  ### III. Table of Cruxes

  The following table identifies specific sub-questions where resolution would significantly shift the weight of argument toward one camp. We have agreed upon specific bearing-cases and recorded our divergent predictions in advance.

  | Crux | Shared Bearing-Case / Conceptual Test | Practice-Naturalist Prediction | Normative-Cognitivist Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Relationality vs. Generalization** | **The Anonymous Harm Scenario:** A case where an agent causes harm to a stranger with no prior relationship, processed entirely through an automated legal algorithm. | Reactive attitudes remain fully functional and relationally valid because the "relationship" is with the moral community, not the specific individual. The practice holds. | Reactive attitudes become distorted and unjustified because the specific interpersonal anchor required for valid resentment is absent. The practice degrades into mere force. |
  | **2. Institutional Mediation** | **The Penal Transformation Test:** Whether a penal system explicitly acknowledging determinism can maintain retributive sentencing without cognitive dissonance among its operators. | The system will maintain retributive sentencing successfully. The practice is robust enough to absorb the metaphysical knowledge without functional change (like physics absorbing stat mech). | The system will experience structural friction. Operators will be forced to decouple "accountability" from "blame," leading to a reform of sentencing practices away from retribution. |
  | **3. The Thermalization Analogy** | **The Diffusion Limit:** Determining if "moral thermalization" results in a loss of normative information (entropy) or a conservation of normative force (energy). | Conservation of Force: Institutionalization conserves the normative force of reactive attitudes; the "heat" is maintained across the system. | Loss of Information: Institutionalization increases entropy; the specific normative content (respect for agency) is lost, leaving only blind causal management. |

  ### IV. Concluding Remarks on Penal Institutions

  Both camps explicitly recognize that the functioning of reactive attitudes in large-scale penal institutions, where personal relationships are absent, serves as the primary testing ground for our theories. The Practice-Naturalists maintain that the institution embodies the participant stance collectively, rendering individual anonymity irrelevant to the validity of blame. The Normative-Cognitivists contend that the absence of personal relationship in penal contexts exposes the libertarian presupposition of blame, rendering current retributive practices unjustified under determinism and requiring a transition to non-retributive accountability mechanisms.

  Summary: The deepest crux separating the two camps is whether the validity of moral responsibility practices is internal to their social function or dependent on the metaphysical truth of the agential commitments they implicitly encode.
