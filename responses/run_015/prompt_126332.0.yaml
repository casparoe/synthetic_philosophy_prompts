  The integrated development environment hummed with the quiet desperation of a deadline approaching. Xiao Ming stared at the red squiggle underlining his function call, then turned to the senior architect, Master Long, who was sipping tea from a chipped mug.

  "It's refusing to compile," Xiao Ming said, gesturing at the screen. "I'm passing `white_steel` into `feed`, but the compiler insists `WhiteHorse` is not a `Horse`."

  Master Long peered over his spectacles at the dependently typed code projected on the wall.

  ```idris
  data Horse : Type where
    MkHorse : Form -> Horse

  data WhiteHorse : Type where
    MkWhite : (f : Form) -> (c : ColourProof White) -> WhiteHorse

  feed : Horse -> Hay -> IO ()
  feed h y = pure $ eat h y

  -- Error: Type mismatch between WhiteHorse and Horse
  ```

  " Naturally," Master Long said, setting down his tea. "The signature for `Horse` awaits only the form. It names the shape, nothing more. But your `WhiteHorse` constructor demands both the form and a proof of colour. You are attempting to pass a compound kind where a simple kind is required."

  "But logically," Xiao Ming protested, "every instance of `WhiteHorse` contains a `Horse`. It's a subset. In extensional maths, it checks out."

  "We are not writing in extensional maths," Master Long corrected sharply. "We are writing in the language of Names. Consider the requirement. If one seeks a `Horse`, a yellow or black one suffices. If one seeks a `WhiteHorse`, a yellow or black one fails. If the type `WhiteHorse` were identical to `Horse`, the requirement would be satisfied by any horse. It is not. Therefore, the type signatures are distinct."

  Xiao Ming rubbed his temples. "So you're saying the colour argument alters the kind signature so fundamentally that subtyping is impossible?"

  "Precisely. 'White' names the colour. 'Horse' names the form. Naming the colour is not naming the form. To conflate them is to confuse the index with the type."

  "Then how do I fix the build? Do I define a coercion?"

  Master Long smiled thinly. "You must write a projection that explicitly discards the colour evidence. You must strip the whiteness from the horse before the compiler will accept it as merely a horse. Only by forgetting the colour do you arrive at the form."

  "So the only way to prove a white horse is a horse is to stop looking at the colour?"

  "Correct. Now, write the function."

  Summary: The joke illustrates how Gongsun Long's intensional logic regarding names and forms parallels the strict type discrimination found in dependently typed programming languages.
