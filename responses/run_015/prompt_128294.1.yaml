answer: |-
  It is understandable that your seminar discussion felt flat if it stopped at the claim that infinite utility breaks decision theory, because while that is a technical objection regarding mathematical formalism, it misses the deeper philosophical tension you have identified concerning the nature of belief itself. The objection that infinite utilities render expected value calculations undefined or unstable is certainly a valid critique within formal decision theory, but it is arguably less damaging to Pascal's core insight than the problem of doxastic involuntarism. If belief is not a voluntary action, then the wager fails at the first hurdle because it commands us to do something we literally cannot do. You cannot simply choose to believe that a cup contains poison because drinking it would save your life, nor can you choose to believe in God simply because hell is unpleasant. Belief is generally understood by epistemologists as a state that aims at truth, constrained by evidence and reason, rather than a state that aims at utility, constrained by desire and will. If this involuntarism holds, the wager is not just risky; it is category-mistaken. It asks for a voluntary assent where only an involuntary conviction is possible.

  However, to dismiss the wager on these grounds is to overlook Pascal's own nuanced response to this very problem, which suggests a reformulation that shifts the locus of voluntariness from the belief itself to the practices that surround it. Pascal anticipated that his interlocutors would say they are unable to believe, and his response was essentially to prescribe a regimen of habituation. He suggested that if one cannot believe, one should at least act as if one believes by taking holy water, having masses said, and engaging in the rituals of the faith. The underlying psychological hypothesis here is that belief is not merely a intellectual judgment but a disposition that can be cultivated through behavior. This moves the argument from direct voluntarism, which is likely false, to indirect voluntarism, which is much more plausible. We cannot choose our beliefs directly, but we can choose to expose ourselves to evidence, communities, and practices that are likely to produce those beliefs. In decision-theoretic terms, this transforms the wager from a one-shot decision to believe into a long-term investment strategy in belief formation. You are not betting on a proposition today; you are betting on a process that might yield conviction tomorrow.

  This reformulation successfully navigates the involuntarism objection, but it immediately invites the second tension you noted regarding the etiology of belief and divine reward. If God is omniscient, He knows that the belief was manufactured through strategic hedging rather than arising from sincere intellectual conviction or grace. If the deity values faith precisely because it is a free gift of the heart rather than a calculated insurance policy, then the strategic believer might be penalized for their insincerity. This is the many-gods objection turned inward; it is not about which god to bet on, but about what kind of believer God wants. If the reward condition requires sincere belief, and strategic habituation produces only self-deceived or hypocritical belief, then the expected utility of the wager drops precipitously. It seems we are caught in a bind where the only way to voluntarily secure the belief is to do so strategically, but doing so strategically might invalidate the belief's worth.

  Yet, there is a coherent way to resolve this tension without abandoning the wager, provided we accept a specific view of how human psychology and divine judgment interact. The key is to recognize that the distinction between strategic habituation and sincere belief is not as rigid as it initially appears. Human beings are not purely rational agents who hold their motives at arm's length; we are creatures whose desires and affections shape our perceptions of truth. By committing to the practices of a religious life, the wagerer is not merely pretending; they are actively reshaping their own evaluative framework. Over time, the strategic motive can be absorbed and transformed by the practice itself. A person who begins praying for prudential reasons may find that the practice alters their desires, making them love the good for its own sake rather than for the reward. If God values the orientation of the will toward the good, then a will that voluntarily submits to disciplining practices—even for initially mixed motives—may be sufficient for salvation. The etiology of the belief matters, but the etiology includes the entire history of the agent's engagement with the divine, not just the initial moment of calculation.

  Therefore, the wager can survive the conjunction of doxastic involuntarism and divine etiology concerns, but only if we redefine the object of the bet. The rational agent is not betting on believing that God exists; they are betting on committing to a form of life that makes belief possible and sincere. This shifts the argument from a pragmatic justification of belief to a pragmatic justification of inquiry and practice. Decision theory remains intact because the action being chosen is not the belief state itself but the investment in the practices that lead to it. The cost is finite—the time and effort of religious practice—and the potential reward remains infinite, assuming that God honors the sincere seeking that arises from such practice. The risk of divine rejection due to insincerity is mitigated by the psychological reality that sincerity is often a product of commitment rather than its prerequisite. We often come to love what we practice, even if we started practicing for ulterior motives.

  Consequently, I conclude that Pascal's Wager does not fail when taken seriously with doxastic involuntarism, but it must be reconstructed as a second-order decision. It is not a command to believe, which is impossible, but a command to cultivate the conditions under which belief becomes rational and sincere. This reformulation respects the involuntarist constraint by acknowledging that belief is not directly willed, and it respects the theological constraint by acknowledging that God likely values the transformed heart over the initial calculation. The wager survives not as a trick to fool God into rewarding a skeptic, but as a prudential argument for why a skeptic should risk entering the religious form of life. If God exists and values sincere faith, He will likely reward the person who willingly entered the furnace of practice to forge that faith, even if the spark was struck by fear of hell. Thus, the wager remains a potent argument, not because it proves God exists, but because it proves that rationality permits, and perhaps requires, us to place ourselves in the position where belief can take root. The flatness of your class discussion stemmed from treating the wager as a static calculation about belief states rather than a dynamic argument about the rationality of shaping one's own doxastic character. When viewed as a wager on practice rather than proposition, it withstands the objections you raised and retains its philosophical force.
