answer: |-
  To establish a rigorous checklist for strategy-stealing arguments, one must first isolate the logical skeleton of the proof to distinguish between essential conditions and mere expository conveniences. The core of the argument is a proof by contradiction that relies on the determinacy of the game, meaning that under perfect play, the outcome is fixed from the start. The argument begins by assuming the second player possesses a winning strategy. The first player then makes an arbitrary initial move and subsequently ignores that piece, pretending to be the second player and adopting the assumed winning strategy. If the strategy ever calls for playing on the square already occupied by the arbitrary opening move, the first player makes another arbitrary move. The contradiction arises because the first player, effectively playing as the second player but with an extra piece on the board, should win, which contradicts the assumption that the second player had a forced win. For this logic to hold, several desiderata must be met, and it is vital to separate those that are logically necessary from those that are artifacts of how the argument is usually taught.

  The most critical requirement, and the one that most often separates valid applications from hand-waving, concerns the gap between showing the second player cannot win and showing the first player does win. In many finite games of perfect information, Zermelo's theorem guarantees that either one player has a winning strategy or both players can force a draw. The strategy-stealing argument strictly proves only that the second player cannot have a winning strategy. It does not, on its own, eliminate the possibility of a draw. Therefore, a genuine requirement for the argument to establish a first-player win is that the game must be proven to be drawless. If the game admits a draw, the argument merely establishes that the first player can force at least a draw, not a win. This is not an artifact but a logical necessity; without an independent proof that draws are impossible, the conclusion that the first player wins is unsupported. Consequently, you should not expect the strategy-stealing argument to be jointly satisfiable with the condition that the game allows for drawn outcomes while still claiming to prove a first-player win. These two requirements are mutually exclusive in the context of this specific proof technique.

  Closely related to the outcome is the assumption that a spare move is never a liability, often referred to as monotonicity. The argument hinges on the claim that having an extra piece on the board cannot hinder the first player's ability to execute the stolen strategy. In games like Hex, additional stones of your color can only connect paths better or remain neutral; they never block a winning connection that would otherwise exist. However, in games like Chess or Checkers, having an extra piece can restrict movement or force a disadvantageous change in the position, a phenomenon known as zugzwang. If a game allows for zugzwang, the step where the first player makes an arbitrary move when the stolen strategy calls for the occupied square becomes fatal, as that arbitrary move might worsen the position. Thus, the requirement that the game possesses a monotonic property regarding piece placement is the single requirement that does the most to narrow the class of games the argument covers. It excludes most traditional board games and restricts the argument primarily to connection games or specific positional games where pieces are never removed and never obstruct the owner's goals.

  Regarding the strategy itself, you must distinguish between what the argument proves and what it constructs. The argument is an existence proof, not a construction. It demonstrates that a winning strategy exists without providing the moves that constitute it. Therefore, a requirement that the argument identify the specific winning opening move is an artifact of intuition rather than a logical necessity, and it is fundamentally incompatible with the argument's working uniformly across the whole class of games. If you demand that the argument specify the opening move, you break the non-constructive abstraction that allows the proof to apply to any symmetric, monotonic, drawless game regardless of board size. For instance, in Hex on a large board, we know the first player wins via strategy stealing, but we do not know the winning move. Demanding the move would render the argument useless for large instances. Thus, you should not expect the requirements of uniformity and constructive identification of the opening move to be jointly satisfiable. The power of the argument lies precisely in its silence on which move to play.

  When considering mirror-image arguments that establish a second-player win, the requirements differ significantly because the mechanism is different. Strategy stealing is almost exclusively a tool for proving first-player wins. Arguments for second-player wins typically rely on pairing strategies or symmetry strategies, where the second player mirrors the first player's moves to maintain a symmetric board state. These arguments are constructive; they explicitly tell the second player what to do in response to any move. Consequently, the desiderata for a second-player win argument include the ability to define a valid mirror move for every possible opening move by the first player, which often requires the board to have a central point or axis that the first player cannot occupy without breaking symmetry. Unlike strategy stealing, these arguments do not rely on the assumption that an extra piece is harmless, because the second player never holds an extra piece; they maintain parity. Therefore, the monotonicity requirement drops away, but the requirement for a specific geometric symmetry in the board and rules becomes stricter.

  In games that can end in a draw or in which a player would sometimes rather not move at all, the strategy-stealing argument collapses or requires significant modification. If a player can pass, the symmetry of turns is broken, and the definition of the "stolen" strategy becomes ambiguous because the turn order is no longer rigid. If draws are possible, as noted, the conclusion weakens to a non-loss. In such cases, the argument cannot be asked to deliver a win; it can only deliver a non-loss guarantee. If you encounter an argument claiming a win in a game with known draw possibilities without addressing how draws are eliminated, it is hand-waving. Furthermore, if the game allows passing, the arbitrary move step in the strategy-stealing proof becomes problematic because the "arbitrary move" might be a pass, which changes the turn structure, or a move that forces the opponent into a position where they would prefer to pass, altering the game tree in ways the stolen strategy does not account for.

  Finally, regarding the strategy itself, given that it is an existence proof, the argument cannot be asked to deliver the computational complexity of the strategy or its specific moves. It cannot tell you if the winning strategy is polynomial-time computable or if it requires exponential search. It simply asserts existence. A checklist for separating real arguments from hand-waving must therefore penalize any claim that purports to extract the strategy from the proof. The real argument must deliver three things: a proof that the game is determined and drawless, a proof that the game rules are symmetric and monotonic regarding piece advantage, and a logical derivation showing that a second-player win leads to a contradiction. Anything less, such as omitting the drawless condition or ignoring the possibility that an extra piece could be a liability, indicates a gap in the reasoning. The most common failure in informal presentations is the assumption that symmetry alone is sufficient, ignoring the monotonicity requirement. By holding the argument to the standard that it must explicitly rule out zugzwang and draws, you filter out the cases where the intuition of an extra piece being helpful fails to hold mathematically. In sum, the argument is a powerful tool for existence, but it is brittle regarding game properties; it demands a specific ecosystem of rules where symmetry, monotonicity, and determinacy intersect, and it cannot be stretched to provide constructive advice or to function in environments where having more resources might be a burden.
