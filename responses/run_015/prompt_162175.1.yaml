  10. (Final Review against constraints): "I want the implicit theory reconstructed, not the policy debate." -> Keep it ontological/phenomenological. "Concretely..." -> Answer the specific questions.

      *   *Self-Correction on US:* The prompt describes US law but asks specific theoretical questions mostly about EU and China. I should integrate the US view primarily through the lens of the "Inescapable Test" to show the contrast, as the US view relies heavily on the "voluntary" aspect which the test challenges.

      *   *Refining the "Identity Over Time" answer:* A consequentialist account explains why erasure is *useful*. It does not explain why it is a *right*. A right implies a moral claim. The moral claim requires a theory of the self that allows for moral discontinuity (the "new man").

      *   *Refining the "Global Trait" answer:* The Social Credit System doesn't necessarily believe in the *psychological* reality of global traits. It believes in the *administrative* utility of treating citizens as having them. It's a performative ontology.

