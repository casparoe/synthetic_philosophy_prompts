answer: |-
  **Terra-Gemini Transit Conditions of Carriage**

  **1. Semantic Jurisdiction**
  All passenger utterances, written or spoken, shall be construed according to the microstructural composition of the environment at the point of arrival. The Carrier accepts no liability for discrepancies between the passenger's internal conceptual state and the external extension of their terms. Whilst passengers remain intrinsically unchanged throughout the voyage, the Carrier reserves the right to determine reference based on local physics rather than subjective intention.

  **2. Mid-Voyage Re-anchoring**
  Passengers acknowledge that the sublight crossing requires approximately four years transit time. During this period, semantic content may be quietly re-anchored to the destination environment without any internal sensation or marker to indicate the shift from the passenger's point of view. The Carrier guarantees no continuity of reference between departure and arrival, notwithstanding the passenger's feeling of psychological continuity. No compensation is payable for existential disorientation resulting from gradual content drift.

  **3. Provisioning and Refreshments**
  Requests for substances, including but not limited to 'water', 'gold', or 'aluminium', shall be fulfilled according to the local extension at the time of service. A complaint regarding the taste or chemical composition of a served substance is not upheld if the substance satisfies the semantic conditions of the arrival port. Passengers requesting Earth-standard H2O whilst docked at Twin Earth will be served XYZ and charged the standard beverage fee.

  **4. The Narrow Content Cabin**
  A supplementary fare is available for access to the Narrow Content Cabin. In this section, crew members will humbly humour passengers who insist they have meant the same thing the whole way. Crew shall nod sympathetically when passengers claim their thoughts are fixed solely by internal states, though this service constitutes a theatrical concession only and does not alter the metaphysical facts of reference.

  **5. First-Person Authority**
  The Carrier offers reassurance that whatever a passenger has turned out to mean, she can always know a priori that she meant it. Passengers retain privileged access to the occurrence of their own thoughts, notwithstanding the external determination of those thoughts' objects. You know exactly what you mean; the Carrier merely knows what you are talking about.

  ***

  **Appendix B: Model Correspondence**

  **Passenger Complaint:**
  "Dear Sirs, I boarded believing I was thinking about water, and I disembark believing I am thinking about water, yet you insist my thought now concerns a different liquid entirely. I feel no different than when I left. How can I be responsible for a meaning I cannot detect changing?"

  **Carrier Response:**
  "You are indeed responsible for the thought you possess, even if the environment determines its object. You know a priori that you meant what you meant, though we must inform you that what you meant has changed."
