answer: |-
  You have independently rediscovered the central tension in contemporary philosophy of mind, but you have sharpened it into a specific epistemic tool that often gets blurred in the literature.

  Your friend was right about the labels: the distinction you are drawing is **Phenomenal Consciousness (P-consciousness)** versus **Access Consciousness (A-consciousness)**, famously delineated by Ned Block in 1995.
  *   **P-consciousness:** The "what-it-is-like-ness," the raw feel, the phenomenology.
  *   **A-consciousness:** The availability of that state for reasoning, reporting, and rational control of action (exactly the "broadcasting" of Global Workspace Theory).

  However, your puzzle is not the distinction itself. Your puzzle is the **epistemic inaccessibility of P-consciousness from the first-person perspective.** You have noticed that any attempt to verify P-consciousness *from the inside* necessarily recruits A-consciousness (memory, attention, report).

  ### Does this predicament have a name?

  There is no single canonical term for exactly this *introspective bind*, but it is the engine driving three major adjacent concepts. Depending on which philosopher you ask, your puzzle is described as:

  1.  **The Introspective Opacity Thesis (Peter Carruthers):** Carruthers argues that we do not have direct introspective access to our own mental states. We know our own minds via the same interpretive mechanisms we use to know others' minds. Therefore, your "verdict" on whether you were conscious is a theory you are generating about yourself, not a direct reading of a phenomenal state.
  2.  **The Meta-Problem of Consciousness (David Chalmers):** This asks why we *think* and *say* we have phenomenal consciousness. Chalmers suggests that the "hard problem" might be a cognitive illusion generated by our brain's modeling systems. Your puzzle is the first-person experience of the Meta-Problem: you are trying to locate the referent of "consciousness" and finding only the cognitive machinery that produces the claim.
  3.  **The Overflow Debate (Block vs. Dennett/Dehaene):** This is the empirical battleground for your three cases. Block argues P-consciousness "overflows" A-consciousness (you saw more than you could report). Dennett and Dehaene argue that if it isn't accessed, it isn't conscious (your feeling of "seeing" is a post-hoc confabulation).

  If you want a tight term for the specific predicament you described—the inability to apply the P/A distinction from the inside because the measuring instrument is made of A—I propose we call it **The Introspective Access Bind**.

  **Definition:** *The Introspective Access Bind* occurs when a subject attempts to verify the presence of Phenomenal Consciousness (P) in a past or present state, but the verification process itself requires Access Consciousness (A) (e.g., working memory, attention, linguistic report), thereby rendering it impossible to distinguish P-without-A from A-without-P from the first-person perspective.

  ### Where the existing concepts stop and yours begins

  *   **Block's P/A Distinction** stops at defining the categories. It assumes we can intuitively grasp the difference. You are pointing out that we cannot *operationalize* that intuition without contamination.
  *   **The Overflow Argument** stops at claiming P > A exists. It relies on subjects reporting "I saw a flash but couldn't identify it." You are questioning the validity of that report: is the "I saw" part a genuine phenomenal trace, or a guess based on the "couldn't identify" part?
  *   **Dennett's Heterophenomenology** stops at treating the subject's report as a text to be interpreted. It doesn't fully address the subject's *internal* frustration that their own internal "text generator" seems to be writing fiction about its own history.

  Your puzzle is more radical: it suggests that **introspection is not a window into P-consciousness; it is a function of A-consciousness.**

  ### Analysis of your three cases through the Bind

  1.  **Highway Hypnosis:**
      *   *P-View (Block):* You were phenomenally conscious of the road, but it wasn't encoded into global workspace (memory/speech).
      *   *A-View (GWT/Dennett):* You were not conscious. The "feeling" that you were is a narrative constructed *after* you snapped back to attention, filling in the gap with the assumption "I am a driver, therefore I was watching."
      *   *The Bind:* You cannot check, because checking requires memory (A).

  2.  **Subliminal Word Guessing:**
      *   *P-View:* You had a faint phenomenal experience that didn't reach threshold for report.
      *   *A-View:* The visual module processed the data and influenced the guess module, but no conscious state occurred. The feeling of "blindness" is accurate; the feeling of "guessing" is just behavior.
      *   *The Bind:* Your certainty that you "saw nothing" is itself a report generated by the workspace. How do you know the workspace isn't lying about its own inputs?

  3.  **Tip-of-the-Tongue:**
      *   *P-View:* The word was phenomenally present as a "shape" or "feeling."
      *   *A-View:* The retrieval process was active (accessing metadata about the word: syllable count, first letter) without accessing the word itself. The "feeling" is the monitoring system reporting on the retrieval status, not the word itself.
      *   *The Bind:* Retrospectively, once the word arrives, the workspace rewrites the history of the search to make it look like the word was "waiting." You cannot verify the pre-arrival state because the arrival changes the record.

  ### What should a Global Workspace proponent say?

  If you take the Global Workspace Theory (GWT) seriously (as advocated by Stanislas Dehaene, Bernard Baars, or Daniel Dennett), your puzzle is not a discovery about the limits of introspection. **It is a dissolution of the distinction.**

  A GWT proponent would say:

  1.  **Consciousness *is* Access.** There is no "leftover part." To be conscious *just means* to be broadcast to downstream consumers (memory, speech, planning).
  2.  **The "Feeling" is a Data Point.** The strong intuition you have—that there is a "what-it-was-likeness" even without broadcast—is itself a piece of data that needs to be explained. It is a *representation* generated by the brain.
  3.  **Postdiction.** In your highway case, the brain did not record the experience. When you "snapped back," the brain instantiated a conscious state that included the belief "I have been driving." Because that belief is now in the global workspace, it *feels* like a memory of consciousness, but it is actually a constructed narrative.
  4.  **The Bind is the Solution.** The reason you cannot apply the distinction from the inside is that **there is no inside to apply it to.** The "inner witness" you are trying to consult is itself a construct of the global workspace. You are trying to use the broadcast system to detect signals that never entered the broadcast system. By definition, that is impossible.

  ### Summary

  *   **Established Names:** The distinction is **P-Consciousness vs. A-Consciousness** (Block). The epistemic problem is related to **Introspective Opacity** (Carruthers) and the **Meta-Problem of Consciousness** (Chalmers).
  *   **Your Specific Contribution:** You have isolated the **Introspective Access Bind**: the circularity of using Access to verify Phenomenality.
  *   **GWT Verdict:** The Bind exists because the distinction is false. Consciousness is Access. The feeling of "Phenomenality without Access" is a user-illusion generated by Access systems modeling their own history.

  You are chewing on the fact that **introspection is a cognitive task, not a magical gaze.** If consciousness is defined by cognitive availability (GWT), then asking "Was I conscious of X if I can't access X?" is like asking "Was this file saved if it isn't on the hard drive?" The feeling that it "felt like something" is just the desktop icon saying "File Previously Opened," even if the content is gone.
