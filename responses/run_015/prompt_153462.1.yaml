  I have written the poem as taking it to be true that our sensitivity to outcomes is an unjustified residue we ought to train out of ourselves. The structure buries the world's contingency and our reactive labels in the middle quatrains, while the driver's act opens and closes the cycle; by returning to the speed and the thoughtless hands as the final verdict, the form insists that the moral truth lies in the agency, not the blood on the grass. The pantoum let me enact the inescapability of the choice without having to argue for it, making the outcome feel like a temporary diversion rather than a moral determinant. My friend would call the line "He took the bend too fast for rain or sight" question-begging, because he would argue that "too fast" is a judgment only possible after knowing the outcome, smuggling the luck back into the description of the act.
