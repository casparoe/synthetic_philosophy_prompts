answer: |-
  # Invertebrate Welfare Impact Assessment (IWIA) — Quick-Scan Protocol
  **Version:** 1.0 (Committee Draft)  
  **Estimated Review Time:** 20 Minutes per Proposal  
  **Required Materials:** Proposal Text, IWIA Lookup Tables (below), Designated Reviewer Sign-off Sheet.

  ---

  ## Part 1: Applied Test Criteria & Lookup Tables
  *Reviewers do not need to read neuroscience literature. Use the proposal text to answer the following questions and assign values.*

  ### A. Sentience Credence Estimate $p(i)$
  *Assign a credence score (0.0 to 1.0) based on the highest taxonomic group affected.*
  *   **0.0 – 0.1 (Floor Zone):** Organisms lacking centralized ganglia or clear nociceptive avoidance (e.g., nematodes, simple larvae).
  *   **0.2 – 0.5 (Uncertain Zone):** Insects/Crustaceans with nociceptors but ambiguous behavioral trade-offs. *Default for most agricultural pests.*
  *   **0.6 – 0.9 (High Credence):** Cephalopods, decapods, or insects showing complex avoidance learning, trade-off decisions, or injury grooming (if explicitly cited in proposal).
  *   **1.0 (Verified):** Vertebrates (Automatically triggers separate ethical review; out of scope for this fund).

  **Test Questions for $p(i)$:**
  1.  Does the proposal mention "avoidance learning," "trade-off decisions," or "grooming of injured areas"? (If **Yes**, move to High Credence).
  2.  Is the organism an insect or arachnid with a centralized brain/ganglia? (If **Yes**, default to Uncertain Zone 0.3).
  3.  Is the organism a nematode, mite, or early-stage larva without clear sensory integration? (If **Yes**, default to Floor Zone 0.1).

  ### B. Harm Characterization Flag
  *Determine if the harm triggers the "Discontinuity Brake" exception.*
  *   **Direct, Intentional, Avoidable (DIA):** The technology is designed specifically to kill/harm the organism (e.g., pesticide, crusher), and a less harmful alternative exists within the proposal's engineering scope.
  *   **Foreseen, Structural, Unavoidable (FSU):** Harm is a side-effect of a process designed for another purpose (e.g., harvesting, transport), or the harm is delegated to ecological processes (e.g., bio-control) where direct intervention is impossible.

  **Test Questions for Harm Type:**
  1.  Is the death/injury the *primary mechanism of action* for the funded technology? (e.g., "This toxin kills...")
  2.  Could the engineering be modified to spare the organism without defeating the project's purpose?
  3.  Is the harm caused by a living agent released by the applicant (bio-control) rather than the applicant's machine/chemical directly?

  ### C. Severity Weight $s(i)$
  *   **Low (1):** Instant death, no indication of prolonged distress.
  *   **Medium (5):** Disorientation, loss of function, or death within minutes.
  *   **High (10):** Prolonged paralysis, internal parasitism, or slow death (>1 hour).

  ### D. Population Exposure $N$
  *   **Local (1):** Confined to lab or single greenhouse module.
  *   **Regional (10):** Deployment across multiple farms in the funding region.
  *   **Systemic (100):** Seed treatments or broad-spectrum agents likely to enter general ecosystem.

  ---

  ## Part 2: The Decision Flow (Step-by-Step)

  **Step 1: Phylogenetic Boundary Check**
  *   **Question:** Does the affected organism possess an integrated nervous architecture (neurons/ganglia)?
  *   **Sufficient Answer:** Check proposal taxonomy.
      *   **No** (e.g., plants, fungi, bacteria, viruses): **STOP.** Procedure ends. No invertebrate welfare load. Proceed to standard scientific review.
      *   **Yes:** Proceed to Step 2.
  *   **Sign-off:** Reviewer Initials.

  **Step 2: Reversal Check**
  *   **Question:** Does applying the welfare calculation imply prioritizing the welfare of microbes or simple invertebrates over essential human health or food security outcomes?
  *   **Sufficient Answer:** If the proposal addresses human pathogen control or critical famine relief involving microbial vectors.
      *   **Yes:** **STOP.** Hand-off to Human Ethics Board. Do not apply $L$ calculation.
      *   **No:** Proceed to Step 3.
  *   **Sign-off:** Committee Chair Initials.

  **Step 3: Parameter Estimation**
  *   **Action:** Assign values for $p(i)$, $N$, and $s(i)$ using the Lookup Tables in Part 1.
  *   **Calculation:** Compute Expected Moral Load $L = p(i) \times N \times s(i)$.
  *   **Note:** If $p(i)$ is in the **Floor Zone (0.0–0.1)**, note this for Step 5.
  *   **Sign-off:** Reviewer Initials.

  **Step 4: Harm Characterization**
  *   **Question:** Is the harm **Direct, Intentional, and Avoidable (DIA)** or **Foreseen, Structural, Unavoidable (FSU)**?
  *   **Sufficient Answer:** Apply Test Questions from Part 1B.
      *   **DIA:** Flag = **TRUE**.
      *   **FSU:** Flag = **FALSE**.
  *   **Sign-off:** Reviewer Initials.

  **Step 5: Discontinuity Brake Application**
  *   **Condition:** Is $p(i)$ in the **Floor Zone (≤ 0.1)**?
      *   **If NO ($p(i) > 0.1$):** The Brake is **OFF**. $L$ is fully active. Proceed to Step 6.
      *   **If YES ($p(i) ≤ 0.1$):** The Brake is **ON**.
          *   Check Harm Flag (from Step 4).
          *   **If Flag = TRUE (DIA):** Brake is **OVERRIDDEN**. $L$ is fully active. Proceed to Step 6.
          *   **If Flag = FALSE (FSU):** Brake **HOLDS**. $L$ is **neutralized** (treated as negligible for decision purposes). Proceed to Step 7.
  *   **Sign-off:** Designated Ethics Reviewer Initials.

  **Step 6: Load-Benefit Weighing**
  *   **Condition:** (Only reached if Brake is Off or Overridden).
  *   **Question:** Do the projected agricultural benefits (yield, sustainability, economic gain) clearly outweigh the Expected Moral Load $L$?
  *   **Sufficient Answer:**
      *   **No ($L$ dominates):** **REJECT** or **DEFER** for mitigation.
      *   **Yes (Benefits dominate):** Proceed to Step 7.
  *   **Sign-off:** Committee Chair Initials.

  **Step 7: Final Determination**
  *   **Action:** Issue Decision.
      *   **Fund:** (Brake Held OR Benefits > Load).
      *   **Deferral:** (Requires mitigation plan to reduce $N$ or $s(i)$).
      *   **Reject:** (Load too high, Benefits insufficient).
  *   **Sign-off:** Committee Chair Signature.

  ---

  ## Part 3: Procedure Run-Through (Test Cases)

  ### Case (a): Targeted Neuropeptide Pesticide
  *   **Proposal:** Disrupts feeding in aphids; risk to pollinators with similar receptors.
  *   **Step 1 (Phylo):** Insects have nervous architecture. **Pass.**
  *   **Step 2 (Reversal):** No human health crisis. **Pass.**
  *   **Step 3 (Params):**
      *   $p(i)$: 0.3 (Insect/Uncertain Zone).
      *   $N$: 100 (Systemic/Regional use).
      *   $s(i)$: 5 (Starvation/Neuro disruption).
      *   $L = 0.3 \times 100 \times 5 = 150$.
  *   **Step 4 (Harm):** **DIA (True).** It is a pesticide; killing is the mechanism.
  *   **Step 5 (Brake):** $p(i) > 0.1$. Brake is **OFF**. $L$ is active.
  *   **Step 6 (Weighing):** High $L$ due to pollinator risk. Benefits (aphid control) must be weighed against non-target harm.
  *   **Step 7 (Decision):** **DEFER.**
  *   **Reasoning:** The high $N$ and active $L$ require a mitigation plan for pollinators before funding. The Brake did not protect this proposal because $p(i)$ was above the floor and harm was intentional.

  ### Case (b): Vertical-Farm Mechanical Separation
  *   **Proposal:** High-speed mechanical separation crushes aphids/thrips during harvest.
  *   **Step 1 (Phylo):** Insects. **Pass.**
  *   **Step 2 (Reversal):** Food production. **Pass.**
  *   **Step 3 (Params):**
      *   $p(i)$: 0.3 (Insect/Uncertain Zone).
      *   $N$: 100 (High volume indoor farming).
      *   $s(i)$: 1 (Instant crush).
      *   $L = 0.3 \times 100 \times 1 = 30$.
  *   **Step 4 (Harm):** **FSU (False).** Harm is a side-effect of harvesting, not the primary goal. Avoidability is low without changing the harvest method entirely.
  *   **Step 5 (Brake):** $p(i) > 0.1$. Brake is **OFF**. $L$ is active.
  *   **Step 6 (Weighing):** $L$ is moderate (30). Benefits (pesticide-free food) are high.
  *   **Step 7 (Decision):** **FUND.**
  *   **Reasoning:** While the Brake did not engage (due to $p(i)$), the low severity ($s=1$) kept $L$ manageable against the benefit of chemical elimination.

  ### Case (c): Parasitoid Wasp Release (Biological Control)
  *   **Proposal:** Release wasps to parasitize pest larvae. Host larvae suffer prolonged internal parasitism.
  *   **Step 1 (Phylo):** Insects. **Pass.**
  *   **Step 2 (Reversal):** Food security. **Pass.**
  *   **Step 3 (Params):**
      *   $p(i)$: 0.1 (Host is early-stage larva; behavioral analogies weak). *Assigned to Floor Zone.*
      *   $N$: 10 (Regional release).
      *   $s(i)$: 10 (Prolonged parasitism).
      *   $L = 0.1 \times 10 \times 10 = 10$.
  *   **Step 4 (Harm):** **FSU (False).** Harm is delegated to ecological agent (wasp). It is foreseen but structurally unavoidable for this method of control.
  *   **Step 5 (Brake):** $p(i)$ is in **Floor Zone (0.1)**. Brake is **ON**.
      *   Check Harm Flag: **FSU (False)**.
      *   **Result:** Brake **HOLDS**. $L$ is **neutralized**.
  *   **Step 6 (Weighing):** Skipped (Load neutralized).
  *   **Step 7 (Decision):** **FUND.**
  *   **Critical Node:** **Step 5 (Discontinuity Brake Application).**
  *   **Reasoning:** Despite high severity ($s=10$), the low credence of sentience in the host larva ($p=0.1$) combined with the classification of harm as "Foreseen/Delegated" rather than "Direct/Intentional" engaged the Discontinuity Brake. This prevented the high severity from swamping the decision, allowing the ecological benefit to prevail.

  ---

  ## Part 4: Limitations & Scope Statement

  **What This Procedure Cannot Do:**
  1.  **Resolve Metaphysical Disputes:** This procedure does not prove whether invertebrates are sentient. It merely formalizes the committee's *credence* ($p(i)$). Disagreements about where the "Evidential Floor" sits (e.g., is 0.1 too high?) are not solved here; they are relocated to the parameter assignment in Step 3.
  2.  **Override Human Welfare:** The Reversal Check (Step 2) is a hard stop. This procedure cannot be used to argue for invertebrate welfare if it demonstrably compromises critical human food security or health.
  3.  **Eliminate Judgment:** The classification of Harm (DIA vs. FSU) in Step 4 requires human interpretation. Two reviewers may disagree on whether bio-control is "Direct" or "Delegated." This procedure forces that disagreement to be explicit and signed off, rather than hidden.
  4.  **Account for Ecosystem Complexity:** The $N$ parameter is a rough proxy. It does not account for cascading ecological effects (e.g., removing a pest might starve a predator). This is a welfare tool, not an ecological impact assessment.

  **Committee Acknowledgement:**
  *By signing the Step 7 Determination, the reviewer acknowledges that this procedure is a heuristic for risk management, not an absolute moral truth. Parameter choices reflect current regional consensus on invertebrate welfare, subject to revision as new behavioral evidence emerges.*
