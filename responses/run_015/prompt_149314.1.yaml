prompt: |-
  Hey — I need help turning a half-formed idea into a proposal for a six-month internal fellowship at the lab where I work (one person, no new data collection, no compute budget beyond reruns of stuff we already have). The idea came out of an argument with a colleague about monitoring deployed models, and she thinks the whole question is fake, so I need the proposal to be tight enough that a reviewer can tell in one page whether it's real.

  Stylised version of the case that started it: we have an anomaly detector sitting on top of two deployed clinical models — one image-based, one that reads structured vitals plus free-text notes — that flags cases where the model's output looks out-of-distribution-ish or drifts from its own calibration. Over a couple of months both models start mis-scoring elderly patients who also have a particular comorbidity, and everyone on the rotation wants to say "it's the same bug again, we know how to handle it." But I don't think we can, and I don't know what would settle it. The image model is sensitive to some radiographic artefact; the notes model seems to be keying on something in the wording of admission notes; the internal circuits obviously aren't the same; and we can't reconstruct the training-data regularity that produced either behaviour because the datasets are long gone. So far I've been sorting candidate individuation criteria into three: the proximal thing in the input the model is sensitive to, the internal circuit that computes it, and the upstream regularity in the training data that made the circuit. My worry is that anything we validate by "did the fix transfer between the two models" is circular — it defines sameness by the success of the intervention we were trying to predict. I've been calling this the 'grain problem' for mechanisms, but that's probably a bad name. There are two wrinkles I want the proposal to at least acknowledge rather than dodge: a mechanism can be present in a model and produce no anomaly until a distribution shift activates it, and what looks like two different behavioural signatures can come from one upstream regularity hitting different downstream heads (or vice versa).

  What I want from you: a proposal, not an essay. Specifically — lead with the question as a single sentence at the very top, before any preamble, then give me (1) why the obvious answers leave it open (circuit identity looks too fine-grained to compare across architectures, behavioural signature looks too coarse to guide a fix, data-provenance is usually unknowable after the fact), (2) the method month by month using only artifacts we already have — checkpoints, logs, the anomaly flags, and a small set of counterfactual/ablation tests we could actually run — plus why this approach rather than the obvious alternatives like just building a bigger behavioural benchmark or just patching activations until something lights up, (3) what a useful deliverable looks like for the people actually staffing the on-call rotation (they have to decide, in something like real time, whether a cluster of flags is one known failure mode to triage or a new one to escalate, so "it depends on your purpose" is not a deliverable), and (4) honest scope for six months and one person: say if it's too big and what you'd cut. Don't cite anything by name — no bibliography, no paper titles, I'll fill those in myself — and please don't lean on any specific published result, just on positions and arguments.

  Two more things. First, at the end add a short paragraph I can quote to my colleague: what would most likely make you drop this angle entirely, where you think the framing is smuggling in "it depends what you're using mechanisms for" while pretending not to, and how confident you are that the question has a determinate answer at all. Second, keep the whole thing under 900 words — I'd rather have something sharp than something complete, and I'll be cutting it down to two pages anyway so don't pad. Typo tolerance is high, I'll clean it up.
