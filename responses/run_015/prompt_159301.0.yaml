  The faulty step is **(3)**.

  Vera does not know that unit $i$ is sound. Consequently, by the Knowledge Norm (1), she may not assert it. This blocks the derivation of the contradiction at step (7) and prevents the generalization to ordinary assertion at step (8).

  Here is the diagnosis of why the step looked safe, the price you pay for rejecting it, and why this is the cheapest cost available to a defender of the Knowledge Norm.

  ### 1. Why Step (3) Looked Safe
  Step (3) relies on the **Fallibilist Intuition**: that knowledge is compatible with some risk of error, provided that risk is sufficiently low. Vera's test is 99.9% reliable. In ordinary life, we take ourselves to know propositions with similar or even lower objective probabilities (e.g., that a flight will depart on time, that a bridge will hold). It feels natural to say Vera's grounds are "as good as grounds ever are."

  The step looks safe because it conflates **high probability** with **epistemic safety**. Vera's evidence is purely statistical relative to the batch. She knows there is exactly one fault. This structural feature transforms her beliefs about individual units into **lottery propositions**. Just as you do not know your lottery ticket will lose (even at 1 in a billion odds) because your belief is not sensitive to the truth in the nearby world where it wins, Vera does not know unit $i$ is sound because her belief is not sensitive to the truth in the nearby world where unit $i$ is the guaranteed faulty one.

  ### 2. The Price: The Statistical/Causal Distinction
  Rejecting (3) commits you to the claim that **purely statistical evidence, when coupled with a known existence of error in the reference class, does not yield knowledge.**

  You must argue that Vera's situation is epistemically distinct from the ordinary cases cited in Step 8 (the train, the milk, the handwriting). The cost is having to articulate and defend that distinction rigorously.

  *   **The Distinction:** In the ordinary cases, your evidence is typically **causal** or **perceptual**, and you do not know that there is a falsehood in the set of propositions you are asserting. When you say "The train leaves at 9.10," you do not know that *some* train this month is cancelled. You are not asserting from a set where a failure is guaranteed.
  *   **The Cost:** You must accept that 99.9% probability is not sufficient for knowledge if the error is *guaranteed to exist somewhere* in the set. This implies that knowledge requires more than just a high credence; it requires a modal connection to the truth (safety or sensitivity) that statistical evidence in a lottery structure cannot provide.
  *   **The Bullet to Bite:** You must accept that Vera cannot assert to the individual inspectors either. The intuition that it is "okay" to tell them one-by-one is a pragmatic illusion. If she doesn't know, the norm forbids the assertion, regardless of packaging. This preserves the consistency of the norm but contradicts the pre-theoretic feeling that serial assertion is permissible while conjunctive assertion is not.

  ### 3. Why This is Cheaper Than Rejecting (2)
  You expressed a preference for keeping Conjunction Closure (2). Rejecting (3) allows you to do this. If you were to reject (2) instead (allowing Vera to assert each conjunct but not the conjunction), you would incur a much higher theoretical cost:

  1.  **Logic of Knowledge:** Given the Knowledge Norm (1), rejecting closure for assertion implies rejecting closure for knowledge. You would have to defend the view that one can Know $p$ and Know $q$ but not Know ($p$ & $q$). This requires a non-standard logic of belief/knowledge (à la Kyburg), which undermines the idea that knowledge is a factive mental state governed by classical logic.
  2.  **Packaging Sensitivity:** Rejecting (2) makes the permissibility of assertion depend on how content is packaged (serially vs. conjunctively). While this matches some intuitions, it makes the norm vulnerable to manipulation. A speaker could convey the forbidden conjunction simply by asserting the conjuncts sequentially to the same hearer. Rejecting (3) avoids this by forbidding the assertion at the source.
  3.  **Explanatory Power:** The Knowledge Norm is attractive because it explains the "How do you know?" challenge. If you reject (2) and say Vera *does* know each unit is sound, you struggle to explain why she must remain silent when asked about the batch. If you reject (3), the explanation is straightforward: she doesn't know, so she can't say. The norm retains its bite.

  ### 4. Preserving the Norm's Work
  By rejecting (3), you preserve the Knowledge Norm's ability to do the work you value:

  *   **The Challenge:** When Vera asserts "Unit $i$ is sound," the challenge "How do you know?" is legitimate and unanswerable. She must admit she is relying on statistics in a batch known to contain a fault. The norm correctly identifies this as a defect in her epistemic position.
  *   **Ordinary Assertion:** You avoid the skeptical conclusion (Step 9) because ordinary assertions (train, milk) are not lottery propositions. We do not know there is a falsehood in our set of ordinary beliefs. Thus, we can know the train leaves at 9.10, and we can assert it. The prohibition remains localized to the specific epistemic structure of the lottery/batch case.

  ### Summary of the Cost
  The price is **Epistemological Specificity**. You must commit to the view that statistical evidence with a known error rate is epistemically inferior to ordinary perceptual evidence, even when the probabilities match. You must teach your students that **knowledge is not merely high probability**; it is a state that rules out relevant alternatives, and the "guaranteed fault" makes the faultiness of any specific unit a relevant alternative Vera cannot rule out.

  This is the standard Williamsonian line on the Lottery Paradox. It is the most robust way to keep the Knowledge Norm action-guiding and logically consistent without collapsing into global skepticism.
