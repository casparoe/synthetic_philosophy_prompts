  You call silence a fraud, but I call the machine a narcotic. It is not the dead who must speak, but the living who must learn to bear the weight of being unheard. To wire your sorrow to a cylinder of wax is to seek a puppet where there should be a presence of mind. You say you act after speaking; that is the only miracle here. If you replace the silence with a recording, you turn a vow into a séance, and duty into a performance. The dead do not owe you an answer, and you do not owe them a fake one. Truthfulness is the first duty, even when it wounds.

  Keep the gathering, but purge this new magic. The dead are in that room not as ghosts, but as the measure of your own continuity. They are the boundary that gives your duty its shape. A recording captures a tone, but it cannot capture the claim you have upon yourself because they are gone. If you abandon the ceremony, you lose the web that holds you to others; if you mechanize it, you lose the truth that you are alone with your obligation. Let the silence be the answer. It is the only thing heavy enough to carry your grief.
