prompt: |-
  I chair the quarterly coherence review of my agency's risk register: about forty operational teams each submit five to fifteen probabilities for events that overlap and are logically related (a flood at site X; a flood at X or Y; a river gauge exceeding a threshold; conditional judgements such as the probability of a service outage given the gauge threshold is breached). The numbers are signed off by the chief risk officer and feed planning and capital decisions. My reviewers are engineers and planners, not mathematicians; they have one afternoon, a spreadsheet and no solver; submissions arrive rounded to the nearest five per cent or as ranges; some teams decline to take the other side of their own numbers; and some events may never resolve.

  Please turn the Dutch book argument for probabilism — degrees of belief that are not probabilities expose you to a combination of bets at your own odds that loses in every possible state — into a written procedure my reviewers can actually run. It should specify the checks in order, what counts as passing each one, where it stops and rejects a submission outright, and where it must hand the decision to a named person because the issue is a modelling or values choice rather than a matter of coherence. It has to cope with: rounding and range artefacts that mimic incoherence; sets from different teams that are each coherent but jointly exploitable; mid-quarter revisions, so that planning-incoherence across time is caught as well as static incoherence; events that may never be resolved; and a materiality threshold, since a guaranteed loss of well under a per cent of stake is not worth chasing. State plainly what the procedure cannot do — it tests coherence, not accuracy or calibration, and it cannot tell a team what its numbers ought to be — and where it will misfire.

  Close with three worked applications: a pair of submissions that are individually coherent but jointly admit a sure loss; a submission that looks incoherent only because of rounding; and one that is fully coherent while everyone regards its numbers as absurd, where honest application of the procedure returns a pass and I must override it on other grounds. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a quarterly coherence review for an agency's risk register.
      *   **Audience:** Reviewers (engineers and planners, not mathematicians).
      *   **Constraints:** One afternoon, spreadsheet only (no solver), rounded inputs (nearest 5% or ranges), some events unresolved, some teams reluctant to bet, materiality threshold needed.
      *   **Task:** Convert the Dutch Book argument into a practical written procedure.
      *   **Requirements:**
          *   Specify checks in order.
          *   Define pass/fail criteria.
          *   Define stop/reject points vs. escalation points (modelling/values).
          *   Handle rounding/ranges.
          *   Handle cross-team incoherence.
          *   Handle mid-quarter revisions (temporal coherence).
          *   Handle unresolved events.
          *   State limitations (coherence $\neq$ accuracy).
          *   Provide three worked examples (joint incoherence, rounding artefact, coherent but absurd).
          *   Language: British English.

  2.  **Deconstruct the Dutch Book Argument for this Context:**
      *   *Theoretical:* If $P(A) + P(B) \neq P(A \cup B)$ (for disjoint), or $P(A|B)P(B) \neq P(A \cap B)$, a bookie can construct bets guaranteeing a loss.
      *   *Practical:* We can't actually make bets. We need to check the arithmetic relationships between probabilities without needing a linear programming solver.
      *   *Key Relationships:*
          *   Complementarity: $P(A) + P(\neg A) = 1$.
          *   Additivity (Disjoint): $P(A \cup B) = P(A) + P(B)$.
          *   Conditional: $P(A \cap B) = P(A|B) \times P(B)$.
          *   Monotonicity: If $A \subseteq B$, then $P(A) \leq P(B)$.
      *   *Complications:* Rounding (5%), Ranges (e.g., 10-15%), Cross-team dependencies, Temporal changes.

  3.  **Drafting the Procedure - Section by Section:**

      *   **Title & Purpose:** Needs to be formal but accessible. "Coherence Review Procedure."
      *   **Scope & Limitations:** Crucial to manage expectations. It's about logic, not truth.
      *   **Inputs:** What data do we have? (Event definitions, probabilities, conditionals, timestamps).
      *   **The Materiality Threshold:** Define "noise." If the guaranteed loss is < 1% of stake, ignore.
      *   **Step 1: Internal Consistency (Single Team/Single Sheet):** Check basic axioms first.
          *   Bounds (0-100%).
          *   Complements.
          *   Conditionals vs. Joints.
      *   **Step 2: Cross-Team Logic (The Joint Book):** This is the hard part without a solver.
          *   Need to identify linked events (Site X flood vs. River Gauge).
          *   Check monotonicity (Subset rule).
          *   Check additivity where applicable.
      *   **Step 3: Temporal Coherence:** Compare Q1 vs Q2 submissions for the *same* event.
      *   **Step 4: Rounding & Ranges:** How to handle the "nearest 5%" issue. Use bounds checking.
      *   **Escalation:** When to stop and call the Chair/CRO. (Values vs. Maths).
      *   **Output:** Pass, Fail, or Refer.

  4.  **Refining the "No Solver" Constraint:**
      *   Real Dutch Book checking often requires linear programming to find the *optimal* Dutch Book.
      *   *Workaround:* Focus on explicit logical relations provided in the register. If Team A says "Flood" and Team B says "Gauge Breach" and the register links them, check that specific link. Don't try to find *hidden* Dutch books across 40 teams implicitly. Rely on the declared logical relationships.
      *   *Spreadsheet Formulas:* Use simple `IF` statements and difference checks.

  5.  **Addressing Specific Complications:**
      *   *Rounding:* If $P(A) = 20\%$ and $P(\neg A) = 75\%$, sum is 95%. Is this fail? No, it's rounding. Allow a tolerance band (e.g., $\pm 5\%$).
      *   *Ranges:* If $P(A) \in [10\%, 15\%]$, check if *any* value in that range allows coherence. If the range *forces* incoherence (e.g., $P(A) \in [60\%, 70\%]$ and $P(\neg A) \in [60\%, 70\%]$), then fail.
      *   *Unresolved Events:* Coherence applies to *current* degrees of belief, not eventual outcomes. Treat them as standard probabilities.
      *   *Refusal to Bet:* If a team says "We won't back this," flag as 'Subjective Confidence Low' but check coherence of the number provided anyway.

  6.  **Developing the Worked Examples:**
      *   *Example 1 (Joint Incoherence):* Team A: Flood X (10%). Team B: Flood X or Y (15%). Team C: Flood Y (10%). $P(X \cup Y) \leq P(X) + P(Y)$. $15\% \leq 20\%$. Wait, that's coherent. Need incoherence.
          *   Try: Team A: Flood X (20%). Team B: Flood Y (20%). Team C: Flood X or Y (30%). (Coherent).
          *   Try Incoherent: Team A: Flood X (20%). Team B: Flood Y (20%). Team C: Flood X or Y (50%). $50\% > 20\% + 20\%$. Violation of sub-additivity.
      *   *Example 2 (Rounding):* $P(A) = 30\%$, $P(\neg A) = 65\%$. Sum = 95%. Within 5% tolerance. Pass.
      *   *Example 3 (Coherent but Absurd):* $P(\text{Apocalypse}) = 99\%$, $P(\text{No Apocalypse}) = 1\%$. Logically perfect. Practically mad. Chair override needed.

  7.  **Review against Constraints:**
      *   *British English:* "Programme," "Centre," "Organise," "£," "Per cent."
      *   *Tone:* Professional, directive, clear.
      *   *Limitations:* Explicitly state it doesn't check accuracy.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on "No Solver":* I need to make sure the reviewers don't try to solve a system of 40 teams. I must instruct them to check *declared* relationships. If the register doesn't link Event A and Event B, they can't check them against each other easily. I will add a step to "Map Logical Dependencies" first.
      *   *Materiality:* Define the "Stake." Let's assume a notional £100 pot for the calculation to make it concrete for engineers.
      *   *Escalation:* Distinguish between "Maths Error" (Reject) and "Risk Appetite Dispute" (Refer to CRO/Chair).

  9.  **Final Polish:**
      *   Check the "Mid-quarter revisions" requirement. Add a specific check for $P_t(Event)$ vs $P_{t+1}(Event)$ without new information.
      *   Ensure the "Refusal to bet" is handled (flagged, not necessarily failed).
      *   Verify the three examples are distinct and illustrative.

  10. **Final Read-Through:** Does this sound like a document an engineer can use on a Friday afternoon? It needs to be checklist-driven.

  *(Self-Correction during drafting)*: I initially thought about asking them to calculate the exact Dutch Book loss. But without a solver, that's hard for 40 teams. Instead, I will instruct them to calculate the *implied loss* on the specific inconsistent triplet. E.g., if $P(A \cup B) > P(A) + P(B)$, the loss is the difference. If that difference > materiality threshold, fail.

  Let's write it.
answer: |-
  **AGENCY RISK REGISTER: QUARTERLY COHERENCE REVIEW PROCEDURE**
  **Document Ref:** RR-COH-04
  **Audience:** Risk Review Panel (Engineering & Planning Staff)
  **Time Allocation:** One Afternoon Session
  **Tools:** Standard Spreadsheet (No Solver/Plugin required)

  ---

  ### 1. Purpose and Scope

  This procedure tests the **logical coherence** of probability assessments submitted to the Risk Register. It is based on the Dutch Book argument: if your stated probabilities violate the laws of probability, a combination of bets can be constructed at your own odds that guarantees a loss regardless of the outcome.

  **What this procedure does:**
  *   Identifies arithmetic contradictions between related events (e.g., an event and its complement; a cause and its effect).
  *   Detects guaranteed financial losses arising from inconsistent odds across teams.
  *   Flags temporal inconsistencies where probabilities shift without new evidence.

  **What this procedure does NOT do:**
  *   **It does not test accuracy.** A submission can be perfectly coherent yet factually wrong (e.g., assigning 99% probability to an impossible event).
  *   **It does not set risk appetite.** It cannot tell a team what their numbers *ought* to be, only that they must not contradict each other.
  *   **It does not resolve value judgements.** Disagreements on the severity of consequences are out of scope.

  **Limitations:**
  *   **Hidden Dependencies:** This check only tests relationships explicitly mapped in the Register. If Team A and Team B do not acknowledge a logical link between their events, this procedure cannot detect the incoherence.
  *   **Rounding Artefacts:** Submissions rounded to the nearest 5% may appear incoherent due to arithmetic truncation rather than logical error. Tolerance bands apply (see Section 4).
  *   **Unresolved Events:** Coherence applies to current degrees of belief. The fact that an event (e.g., "Flood in 2030") cannot yet be verified does not exempt it from coherence checks.

  ---

  ### 2. Definitions and Materiality

  **The Notional Stake:**
  For the purpose of these checks, assume a notional betting stake of **£100** per event.

  **Materiality Threshold:**
  A coherence error is only actionable if the guaranteed loss exceeds **2% of the notional stake (£2.00)** per linked set of events. Errors below this threshold are treated as rounding noise and passed.

  **Submission Types:**
  *   **Point Estimate:** A single percentage (e.g., 20%).
  *   **Range:** A lower and upper bound (e.g., 10%–15%).
  *   **Conditional:** Probability of A *given* B (e.g., $P(A|B)$).

  ---

  ### 3. The Review Procedure

  Reviewers must execute Checks 1 through 4 in order. If a submission fails a check, follow the **Action** column. Do not proceed to subsequent checks for that specific event cluster until the failure is resolved or escalated.

  #### Check 1: Basic Axioms (Internal Consistency)
  *Applies to every individual probability entry.*

  | Test | Spreadsheet Logic | Pass Criteria | Action on Fail |
  | :--- | :--- | :--- | :--- |
  | **Bounds** | Is $0 \leq P \leq 100$? | Yes | **Reject.** Request correction. |
  | **Complement** | For every Event A, is there a $\text{Not-A}$? Check $P(A) + P(\text{Not-A})$. | Sum is $100\% \pm 5\%$ (tolerance for rounding). | If deviation $>5\%$: **Refer to Team Lead.** Ask which figure is intended to anchor the pair. |
  | **Conditionals** | If $P(A|B)$ and $P(B)$ are submitted, is the Joint $P(A \cap B)$ consistent? Check $P(A \cap B) \approx P(A|B) \times P(B)$. | Difference $< 5\%$ absolute. | **Refer to Team Lead.** Clarify if the Joint or the Conditional is the derived figure. |

  #### Check 2: Logical Monotonicity (Subset Rule)
  *Applies to linked events across teams (e.g., "Gauge Breach" implies "Site Flood").*

  | Test | Spreadsheet Logic | Pass Criteria | Action on Fail |
  | :--- | :--- | :--- | :--- |
  | **Subset** | If Event A implies Event B (A $\subseteq$ B), then $P(A)$ must be $\leq P(B)$. | $P(A) \leq P(B) + 5\%$ (tolerance). | If $P(A) > P(B) + 5\%$: **Fail.** This admits a sure loss. Request revision. |
  | **Union Bound** | For disjoint events A and B, check $P(A \cup B) \leq P(A) + P(B)$. | Inequality holds. | If $P(A \cup B) > P(A) + P(B) + 5\%$: **Fail.** Calculate the excess. If $>£2$ loss, **Reject**. |

  #### Check 3: Cross-Team Coherence (The Joint Book)
  *Applies to clusters of events identified as logically related in the Master Map.*

  **Instruction:** Locate the "Cluster ID" in the Master Map (e.g., Cluster 4: River Basin Flooding). Sum the probabilities of mutually exclusive outcomes within that cluster.

  | Test | Spreadsheet Logic | Pass Criteria | Action on Fail |
  | :--- | :--- | :--- | :--- |
  | **Exhaustivity** | For a set of mutually exclusive and exhaustive outcomes $\{E_1, E_2, E_3\}$, check $\sum P(E_i)$. | Sum is $100\% \pm 10\%$ (wider tolerance for multi-team aggregation). | If Sum $< 90\%$ or $> 110\%$: **Refer to Chair.** This indicates a gap in risk coverage or double-counting. |
  | **Arbitrage** | Check for circular dependencies where $P(A)$ derived via B differs from direct $P(A)$. | Difference $< 5\%$. | If Difference $> 5\%$: **Calculate Loss.** If Loss $>£2$: **Fail.** If $<£2$: **Pass with Note.** |

  #### Check 4: Temporal Coherence (Mid-Quarter Revisions)
  *Applies to events revised between Q1 and Q2 without a triggering incident.*

  | Test | Spreadsheet Logic | Pass Criteria | Action on Fail |
  | :--- | :--- | :--- | :--- |
  | **Martingale** | If no new information exists, $P_{new}(A)$ should equal $P_{old}(A)$. | $|P_{new} - P_{old}| \leq 5\%$. | If change $> 5\%$ with no logged incident: **Refer to CRO.** Ask for justification of belief update. |

  ---

  ### 4. Handling Rounding and Ranges

  **The 5% Rule:**
  Teams submit to the nearest 5%. A sum of 95% or 105% is **not** an automatic fail.
  *   **Procedure:** If a Complement Check sums to 95%, assume the true values were 47.5% and 52.5%. Mark as **Pass**.
  *   **Failure:** If a Complement Check sums to 85% (e.g., 40% + 45%), this exceeds the rounding tolerance. Mark as **Fail**.

  **Range Submissions:**
  If a team submits $P(A) \in [10\%, 15\%]$:
  *   **Procedure:** Test the coherence using *both* the lower and upper bounds.
  *   **Pass:** If *any* value within the range allows the set to be coherent.
  *   **Fail:** If *every* value within the range creates a Dutch Book (e.g., $P(A) \in [60\%, 70\%]$ and $P(\text{Not-A}) \in [60\%, 70\%]$).

  ---

  ### 5. Escalation Protocol

  Not all failures are mathematical errors. Reviewers must distinguish between **Coherence Errors** and **Modelling Choices**.

  **1. Reject (Reviewer Authority):**
  *   Arithmetic violations exceeding the materiality threshold (£2 loss).
  *   Violations of basic axioms (Prob > 100%, Negative Prob).
  *   *Action:* Return to team for correction within 48 hours.

  **2. Refer to Chair (You):**
  *   **Absurd Coherence:** The numbers are logically consistent but operationally unbelievable (see Example 3).
  *   **Temporal Drift:** Probability changes without recorded cause.
  *   **Refusal to Bet:** A team submits numbers but formally declines to stand behind them for planning purposes.
  *   *Action:* Chair decides whether to accept the risk or force a re-estimate.

  **3. Refer to Chief Risk Officer (CRO):**
  *   **Values Choice:** The incoherence arises from differing risk appetites between departments (e.g., Operations wants low probability, Finance wants high provision).
  *   **Systemic Gap:** The sum of all risks in a cluster is < 50%, suggesting unknown unknowns.
  *   *Action:* CRO adjudicates the strategic alignment.

  ---

  ### 6. Worked Applications

  The following examples illustrate how to apply the procedure using the £100 notional stake.

  #### Example 1: Joint Incoherence (The Sure Loss)
  **Scenario:**
  *   **Team Hydrology:** Probability of River Gauge Breach ($P(G)$) = 20%.
  *   **Team Operations:** Probability of Site X Flood ($P(X)$) = 25%.
  *   **Team Operations:** Probability of Site Y Flood ($P(Y)$) = 25%.
  *   **Master Map:** A Gauge Breach *guarantees* a Flood at X or Y ($G \implies X \cup Y$). Sites X and Y are mutually exclusive (water goes one way or the other).

  **The Check:**
  1.  Since $G \implies (X \cup Y)$, logically $P(G) \leq P(X \cup Y)$.
  2.  Since X and Y are disjoint, $P(X \cup Y) = P(X) + P(Y)$.
  3.  Submitted Sum: $25\% + 25\% = 50\%$.
  4.  Submitted $P(G)$: $20\%$.
  5.  $20\% \leq 50\%$. This looks coherent.

  **Wait, look closer at the Conditional:**
  *   **Team Hydrology** also submits: Probability of Gauge Breach *given* Site X Flood ($P(G|X)$) = 100% (Physical certainty).
  *   **Bayes Check:** $P(G \cap X) = P(G|X) \times P(X) = 100\% \times 25\% = 25\%$.
  *   **Constraint:** The probability of the intersection ($G \cap X$) cannot exceed the probability of the marginal event ($G$).
  *   **Violation:** $P(G \cap X) = 25\%$, but $P(G) = 20\%$. You cannot have a joint probability higher than the marginal probability.
  *   **The Dutch Book:** A bookie buys the Joint event from you at £25 and sells you the Marginal event at £20. You lose £5 guaranteed.
  *   **Materiality:** £5 loss > £2 threshold.
  *   **Verdict:** **FAIL.** Return to teams to align $P(G)$ and $P(X)$.

  #### Example 2: The Rounding Artefact (The False Positive)
  **Scenario:**
  *   **Team Security:** Probability of Cyber Incident ($P(C)$) = 30%.
  *   **Team Security:** Probability of No Cyber Incident ($P(\text{Not-}C)$) = 65%.
  *   **Sum:** 95%.

  **The Check:**
  1.  **Axiom:** $P(C) + P(\text{Not-}C)$ must equal 100%.
  2.  **Observed Deviation:** 5%.
  3.  **Procedure:** Apply the 5% Rounding Tolerance (Section 4).
  4.  **Interpretation:** The true values likely lie between 27.5%–32.5% and 62.5%–67.5%. A sum of 100% is possible within these bounds.
  5.  **Materiality:** The implied loss on a £100 stake is £5, but this is entirely attributable to the mandated rounding protocol.
  6.  **Verdict:** **PASS.** Mark spreadsheet cell with "R" (Rounding). No action required.

  #### Example 3: Coherent but Absurd (The Chair Override)
  **Scenario:**
  *   **Team Strategy:** Probability of Agency Dissolution by 2025 ($P(D)$) = 95%.
  *   **Team Strategy:** Probability of Agency Continuation ($P(\text{Not-}D)$) = 5%.
  *   **Logic:** Sum = 100%. Complements match. No cross-team contradictions.

  **The Check:**
  1.  **Coherence:** Passes all mathematical checks (Checks 1–4).
  2.  **Calibration:** The agency has a statutory 5-year budget approved by Parliament. A 95% chance of dissolution contradicts external statutory assurance.
  3.  **Procedure Limitation:** This procedure tests coherence, not accuracy. Mathematically, this submission is valid.
  4.  **Verdict:** **PASS (Coherence)** but **REFER to Chair**.
  5.  **Chair Action:** I must override this on grounds of **Calibration and Strategic Alignment**. The numbers are logically sound but factually indefensible. I will convene the CRO and the Strategy Director to revise the estimate, not because it is incoherent, but because it is unusable for planning.

  ---

  ### 7. Sign-Off

  **Reviewer Name:** ___________________
  **Date:** ___________________
  **Total Submissions Reviewed:** _______
  **Total Rejections:** _______
  **Total Referrals to Chair:** _______

  *By signing this sheet, you certify that the mathematical coherence of the accepted register has been tested against this procedure. You do not certify the accuracy of the risk estimates.*
