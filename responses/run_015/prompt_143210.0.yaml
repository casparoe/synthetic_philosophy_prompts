answer: |-
  ### System Architecture: The Consequentialist Control Loop

  **Global Objective:** Maximize aggregate welfare (Global Cost Function $J_{global}$).
  **Local Node:** The moral agent (Subsystem $S_i$).
  **Control Signal:** Moral obligation (Reference Input $r(t)$).
  **Actuator:** Agent's capacity to act (Output $u(t)$).
  **Feedback:** Perception of welfare states (Sensor $y(t)$).

  ---

  ### 1. The Demandingness Objection: Actuator Saturation and Local Instability

  **Engineering Translation:**
  The consequentialist architecture defines the reference input $r(t)$ for every subsystem $S_i$ as the error signal required to minimize $J_{global}$ at every time step $t$. This architecture assumes the local node possesses infinite gain and bandwidth.

  The objection states that tracking $r(t)$ drives the local actuator into hard saturation. The control signal magnitude $|u(t)|$ required to zero the global error exceeds the physical limits of the actuator (time, energy, cognitive bandwidth). Furthermore, the node maintains internal housekeeping loops (personal projects, psychological integrity) necessary for local stability. If the global control signal monopolizes all available bandwidth, the local housekeeping loops starve. This induces local instability (burnout, psychological collapse), which eventually disconnects the node from the network, increasing $J_{global}$ over the long horizon.

  Therefore, the control law is inadmissible: it requests a trajectory that violates the subsystem's operational envelope.

  **Residue Report:**
  *   **Clean Map:** "Exhausts personal projects" maps cleanly to **bandwidth allocation conflict**. "Beyond what can reasonably be asked" maps to **actuator saturation limits**.
  *   **Distortion:** The objection claims the demand is *unreasonable*, not just *impossible*. In engineering, if an actuator can physically move to a position, it is not "unreasonable" to command it there, provided stability is maintained. The engineering model struggles to distinguish between "this will break the motor" (capacity failure) and "this motor should not be used for this task even if it holds" (normative reservation).
  *   **No Expression:** The concept of **entitlement**. In this model, the local node has no inherent right to bandwidth; it is allocated solely based on global optimization. The objection implies the local node has a *claim* to resources independent of $J_{global}$. Control theory has no variable for "rights"; there are only constraints and costs.

  ---

  ### 2. Reply: The Costs of Morality (System Overhead and Gain Scheduling)

  **Engineering Translation:**
  This reply modifies the global cost function to include the cost of control effort. The new objective is $J_{total} = J_{global} + \lambda \cdot \text{ControlEffort}(u)$.

  If the gain on the global error signal is too high, the system exhibits high-frequency oscillation or integrator windup. The energy expended by the actuators to track the reference generates heat (psychological stress) that degrades component lifespan. A robust controller implements **gain scheduling**: when local error signals (distress) exceed a threshold, the global gain is reduced to prevent subsystem failure. Demanding maximum output continuously reduces the stability margin of the entire distributed network. A "satisficing" controller that accepts a bounded error band rather than zero error minimizes wear and tear, ensuring long-term system availability.

  **Residue Report:**
  *   **Clean Map:** "Burnout" maps to **thermal overload/component wear**. "Long-term welfare" maps to **stability over infinite horizon**.
  *   **Distortion:** This reply turns a normative constraint ("you don't *have* to save the drowning child if it ruins your life") into a consequentialist calculation ("saving the child ruins your life, which lowers global welfare"). In engineering, this is a valid optimization. In the philosophical debate, the objector wants to say the demand is illegitimate *even if* the agent could sustain it. The engineering reply validates the demand but lowers the set point for efficiency reasons.
  *   **No Expression:** **Moral permission vs. strategic advice.** In this model, the agent is still *obligated* to follow the optimized gain schedule. There is no room for "I am permitted to keep my money even if donating it would yield a net global gain." The system simply calculates that the transaction cost is too high. The residue is the loss of the **deontic boundary**; everything remains a calculation of $J_{total}$.

  ---

  ### 3. Reply: Scalar Consequentialism (Continuous Cost Landscapes)

  **Engineering Translation:**
  This reply rejects the binary alarm system (Obligatory vs. Forbidden). In control theory, performance is inherently scalar. There is no binary "failure" state unless a hard constraint is violated.

  The architecture is restated as a continuous cost landscape. Actions are not classified as "required" or "optional." They are ranked by their contribution to $\Delta J_{global}$. An action that significantly reduces error is "better" than one that slightly reduces error. There is no threshold where the agent is "blamed" (penalized heavily) for not tracking the reference perfectly. The system simply logs the trajectory error. "Supererogatory" acts are simply trajectories that minimize $J_{global}$ beyond the nominal operating baseline, incurring higher local control effort without triggering a stability fault.

  **Residue Report:**
  *   **Clean Map:** "Better/worse" maps to **cost function gradient**. "Binary obligation" maps to **hard constraints vs. soft penalties**.
  *   **Distortion:** Moral blame is not equivalent to tracking error. In engineering, a large error signal is just data for the controller to correct. In ethics, "wrong" carries a reactive attitude (guilt, censure) that is not modeled by a cost value.
  *   **No Expression:** **The cutoff for censure.** Scalar consequentialism removes the line where criticism becomes appropriate. In engineering, if you are optimizing a function, any deviation from the minimum is a "failure" of optimization, even if small. The philosophical reply wants to say small deviations are *fine*. The engineering model says they are just *less optimal*. The residue is the **normative significance of the threshold**. Engineering cannot represent "good enough" without arbitrarily defining a deadband, which returns us to the binary problem.

  ---

  ### 4. Reply: Division of Moral Labor (Distributed Hierarchical Control)

  **Engineering Translation:**
  This reply argues against a centralized controller broadcasting $r(t)$ to all nodes. Instead, the system uses a **hierarchical distributed architecture**.

  High-level planners set global constraints (e.g., "reduce global poverty by X%"). Low-level nodes ($S_i$) are assigned local set points (e.g., "care for kin," "maintain local infrastructure"). Nodes optimize local cost functions $J_{local}$ which are coupled to $J_{global}$ but not identical. This reduces communication overhead and latency. If every node attempts to compute $\nabla J_{global}$, the network congests (information overload), and actuation becomes uncoordinated. By assigning specific local responsibilities, the system achieves global stability through local regulation. A node is not "demanding" if it ignores a global error signal outside its assigned control authority.

  **Residue Report:**
  *   **Clean Map:** "Personal projects" maps to **local regulation loops**. "Social roles" maps to **subsystem allocation**.
  *   **Distortion:** In engineering, local set points are authorized by the global planner. In the moral reply, personal projects have *independent* value. The engineering model implies I care for my child *because* it is the most efficient way for me to contribute to the global sum. The moral reply often implies I care for my child *because she is mine*, regardless of global efficiency.
  *   **No Expression:** **Intrinsic local value.** The distributed control model is still teleologically global. The local set points are instrumental. If the central planner recalculates and assigns me a different task, I must switch. The moral concept of "integrity" implies a resistance to reassignment that the engineering model treats as a fault (refusal to track reference).

  ---

  ### Synthesis: Analysis of Residues

  The translation reveals that the slogan "morality should not demand the impossible" conflates three distinct engineering conditions, which the philosophical debate often treats as a single intuitive block.

  1.  **Hard Saturation (Physical Impossibility):** The actuator physically cannot move to the required position.
      *   *Engineering Status:* Trivial. No controller demands this.
      *   *Philosophical Ambiguity:* The objection is rarely about physical impossibility. It is about the other two categories.
  2.  **Stability Margins (Systemic Risk):** Tracking the signal induces oscillation or collapse in the local node, degrading long-term performance.
      *   *Engineering Status:* A design flaw. Fixed by gain scheduling or adding damping (Reply 2).
      *   *Philosophical Ambiguity:* This reduces the objection to an empirical claim about psychology. If humans *could* sustain maximum output without collapse, the objection vanishes in this model.
  3.  **Protected Local Set Points (Architectural Authority):** The local node has a mandate to maintain local variables within a band, regardless of global error.
      *   *Engineering Status:* Requires a multi-objective optimization where local constraints have higher priority than global minimization.
      *   *Philosophical Ambiguity:* This is the core of the residue.

  **Do the residues indicate control theory lacks resources, or that the objection is ambiguous?**

  The residues indicate **both**.

  **1. Ambiguity in the Objection:**
  The engineering translation exposes that "too demanding" is unstable terminology.
  *   If it means **Saturation**, the objection is trivial (Consequentialists agree you can't do the impossible).
  *   If it means **Stability**, the objection is empirical (Consequentialists agree you shouldn't burn out).
  *   If it means **Protected Set Points**, the objection is architectural (Consequentialists must explain why local loops get priority).
  The slogan obscures these distinct failure modes. The engineering vocabulary forces them apart.

  **2. Lack of Normative Resources:**
  However, the residues also confirm that control theory cannot fully capture the **normative force** of the objection.
  *   **The "Ought" Gap:** Control theory describes how a system *does* track a set point, or how it *should* to be efficient. It cannot explain why a system *ought* to have a specific architecture (e.g., why local integrity matters *intrinsically*). In engineering, if a centralized controller is more efficient, we use it. In ethics, we might reject centralization even if it maximizes welfare.
  *   **The Blame Variable:** Engineering tracks **error**. Ethics tracks **blame**. Error is a magnitude; blame is a binary status with social consequences. The scalar reply (Reply 3) works perfectly in engineering (cost is continuous) but fails to capture the human practice of excusing agents from censure even when error exists.
  *   **Authority vs. Capacity:** The deepest residue is the distinction between **capacity failure** (saturation) and **authority failure** (refusal). In engineering, if a node *can* act but *doesn't* because it prioritizes a local loop not authorized by the global planner, it is a malfunction (rogue node). In ethics, prioritizing personal projects is often the *virtuous* choice. Control theory has no variable for "legitimate refusal." It only has "constraint violation."

  **Conclusion:**
  The control-theoretic translation successfully disambiguates the *structural* claims of the demandingness objection. It shows that much of the debate is actually about **system stability** and **distributed architecture** rather than metaphysical impossibility.

  However, the translation fails to capture the **normative authority** of the agent. In control theory, the set point is king. In the demandingness objection, the agent claims the right to *ignore* the set point. To represent this in engineering terms, one would have to hard-code the local constraints as immutable, which effectively abandons pure consequentialist global optimization. Thus, the residue indicates that control theory can model the *consequences* of demandingness (instability, saturation), but it cannot model the *right* to resist demandingness, because in a control system, resistance is always a fault, whereas in the moral landscape, it is sometimes a feature.
