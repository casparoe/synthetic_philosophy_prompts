answer: |-
  This is not plain satisficing. It is a distinct mechanism, though it lives in the neighborhood of **Reason-Based Choice** (Shafir, Simonson, & Tversky) and **Accountability** (Tetlock & Lerner).

  In the canonical literature, satisficing stops when *utility* crosses a threshold. Your phenomenon stops when *defensibility* crosses a threshold. These are different variables. You can have high utility with low defensibility (a great candidate who looks weird on paper) and low utility with high defensibility (a middling candidate with a unique, nameable trait).

  Because there is no single canonical noun for this specific *search-termination* dynamic (most work focuses on choice between fixed options), I recommend you coin the term **"Justifiability Stopping"** for your slide. It is precise, descriptive, and anchors correctly to the underlying psychology without mislabeling it as utility maximization or standard satisficing.

  Here is the carving you asked for.

  ### The Phenomenon: Justifiability Stopping

  **Definition:**
  A search termination rule where an agent ceases evaluation not when an option meets a pre-defined threshold of *value* (utility/quality), but when an option meets a threshold of *discursive defensibility* (the availability of a unique, articulable reason to choose it).

  **The Mechanism:**
  1.  **Goal Substitution:** The agent unconsciously substitutes the hard goal ("Find the best option") with the easier goal ("Find an option I can defend").
  2.  **Attribute Availability:** The probability of finding a justifying reason is a function of the *number of describable attributes* per option, not the *quality* of those attributes.
  3.  **Premature Closure:** Once a unique attribute is found ("only one with a desk by a window"), the marginal benefit of continuing the search (finding higher quality) is weighed against the marginal cost of losing the current justification (having to start the argument over). The justification acts as a sunk cost that locks in the choice.

  **Slide-Ready Criteria (What Counts vs. What Doesn't):**

  | **Counts as Justifiability Stopping** | **Does NOT Count** |
  | :--- | :--- |
  | Stopping because you found a *unique* feature, even if overall quality is lower. | Stopping because you found an option that meets your quality bar (Standard Satisficing). |
  | Stopping *earlier* when options have *more* attributes (more hooks for reasons). | Stopping earlier because search is costly/expensive (Rational Search). |
  | Choosing an option you admit is worse, but "easier to explain." | Choosing an option because you genuinely prefer it, then explaining why later (Post-hoc Rationalization). |
  | The reason is produced *before* the commitment is finalized. | The reason is produced only when challenged by a third party. |
  | Removing the need to explain the choice eliminates the effect. | Removing the need to explain the choice does not change the stopping point. |

  **Observable Predictions:**
  1.  **The Attribute Paradox:** Increasing the amount of information per option (longer job descriptions, more apartment details) will *decrease* search duration and *decrease* average quality of the selected option. (Standard information overload predicts paralysis; this predicts premature closure).
  2.  **Anonymity Effect:** If you remove the requirement to justify the choice to a committee (or even to your future self), the effect vanishes or significantly weakens.
  3.  **Uniqueness Bias:** Agents will prefer a "spiky" option (middling overall, one high/unique feature) over a "flat" option (better overall, no unique features), even when the flat option dominates on the stated criteria.

  ### Relationship to Neighbors

  *   **Vs. Satisficing:** Satisficing sets a bar on *value* ("Is this good enough?"). Justifiability Stopping sets a bar on *argument* ("Can I say why this is good?"). They often correlate, but your examples show where they diverge (middling candidate + unique reason).
  *   **Vs. Reason-Based Choice:** This is the parent concept. Reason-Based Choice explains why we pick A over B when reasons favor A. Justifiability Stopping explains why we *stop looking* for C once we have a reason for A. It applies the reason-based heuristic to the *search process* itself.
  *   **Vs. Take-The-Best (Gigerenzer):** "Take-The-Best" stops search when a cue discriminates between options. It assumes the cue is a valid predictor of quality. Justifiability Stopping stops when a cue discriminates, *regardless* of whether that cue predicts quality (e.g., "desk by window" does not predict "good sabbatical," but it predicts "easy to tell my spouse why I picked it").

  ### Confidence and Falsification

  **Confidence:** High that this is a real, distinct mechanism. Moderate that "Justifiability Stopping" will become a canonical term (it is currently descriptive rather than historical), but it is the correct label for the carving you need. The mechanism is well-supported by the intersection of **Reason-Based Choice** (Shafir et al.) and **Accountability Theory** (Tetlock), even if the specific *search termination* label is not yet a textbook header.

  **What Would Convince Me I'm Wrong:**
  1.  **The Accountability Null:** If you run an experiment where agents search for options but are explicitly told "No one will ever know why you chose this, and you don't need to tell us," and they *still* stop on unique attributes rather than quality metrics, then the mechanism is not justifiability (it might be a cognitive bias toward uniqueness/salience).
  2.  **The Info Reversal:** If adding more attributes to the listings makes people search *longer* (due to cognitive load) rather than *shorter* (due to reason availability), then the "more info = worse" prediction fails, and this might just be standard information overload. (My bet is on your observation: more attributes = more hooks = faster stop).

  **Bottom Line:** Call it **Justifiability Stopping**. It captures the substitution of *value* for *verbalizability* and distinguishes it from the utility-threshold of standard satisficing. It fits your data, it's falsifiable, and it gives your students a specific handle on why "having a reason" is not the same as "having a good one."
