prompt: |-
  Im reading a popular book about animal minds and it sums up Descartes roughly like this: "Descartes thought animals are literally just machines, complicated clockwork with no inner life at all. His argument was simple: animals cant use language, and language is the only reliable outward sign of thought, so no language means no thought, and with no thought there is nothing it is like to be them. That is why the cartoon image of Cartesians nailing dogs to boards to dissect them is actually fair to him — he really did think you could treat an animal like a broken clock. And the view backfires anyway: Descartes also admits a machine could in principle be built that looks and acts just like a human being, so if we ever made one that could hold up its end of any conversation, he would have to grant it an immaterial soul — which shows his language test either proves nothing or proves far too much."

  The last bit sounds strongest to me, and the bit about the dogs sounds like the weakest, but ive only read part five of the Discourse myself and none of the letters. Would you go through it more or less sentence by sentence and tell me what a Descartes scholar would accept, what theyd wince at, and what is plainly wrong? Where the summary is unfair, give me the one sentence a sympathetic Cartesian would say instead. And once the wrong parts are fixed, does the books conclusion — that the test is worthless or overgenerates — still follow?
