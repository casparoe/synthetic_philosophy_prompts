          *   *Scholarly View:* This refers to the "Language Test" in *Discourse* Part 5. Descartes argues a machine *couldn't* actually hold up a conversation. He says language use is proof of the soul *because* a machine couldn't do it. The book claims Descartes admits a machine *could* in principle do it. This is a misreading. Descartes says if we saw a machine do it, we'd be fooled, but he maintains it's impossible for a machine to arrange words to give meaning (generativity).
          *   *Verdict:* Plainly wrong interpretation of Descartes' modal claim. Descartes thinks it's *impossible* for a machine to pass the test, not that he would grant it a soul if it did.

      *   *Sentence 5:* "...which shows his language test either proves nothing or proves far too much."
          *   *Scholarly View:* This conclusion relies on the previous error. If Descartes thinks machines *can't* pass the test, the test doesn't overgenerate for him.
          *   *Verdict:* Does not follow from Descartes' actual position.

