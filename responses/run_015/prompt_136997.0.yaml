      *   *The "Body Count" Objection:* If we choose A, we say 6 net lives > 1 extra killing. Why not kill 1 healthy person to save 5?
      *   *The Answer:* Because the 1 healthy person is not *using the scarce resource*. The 2 long-stay patients *are* using the scarce resource. The right to the resource is contingent on the crisis framework. In ordinary times, no one has a claim on another's body (organs). In CSC, everyone has a claim on the *public resource* (vents), but that claim is conditional on triage scores.
      *   *Key Distinction:* Claim rights to resources vs. Claim rights to bodily integrity.

  8.  **Final Polish:** Check tone. Ensure it sounds like a memo from a committee chair/member to the system leadership/staff.

      *(Self-Correction on Recommendation)*: Actually, looking at the ethical weight... Protocol B minimizes the *moral injury* to the staff. In a prolonged crisis, staff burnout/moral injury can collapse the system. However, Protocol A saves 3 extra lives per cycle. In a public health crisis, saving lives is the primary metric. I will stick with A but emphasize the support for staff.

