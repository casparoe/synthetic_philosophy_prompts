answer: |-
  **MEMORANDUM**

  **TO:** Hospital System Leadership, Medical Executive Committee, and Clinical Staff
  **FROM:** Crisis Standards of Care (CSC) Committee
  **DATE:** Friday, October 13
  **SUBJECT:** Decision on Ventilator Rationing Protocol for Upcoming Respiratory Season

  ### 1. Decision and Implementation

  After extensive deliberation regarding the two proposed protocols for ventilator allocation under Crisis Standards of Care, the Committee recommends the adoption of **Protocol A**.

  *   **Protocol A:** Withdrawal of life-sustaining treatment (LST) from two long-stay patients to free capacity for eight short-stay patients.
  *   **Effective Date:** November 24 (six weeks from today), contingent on the declaration of Crisis Standards of Care by the State Health Department.
  *   **Review Trigger:** This protocol shall be immediately suspended and reverted to Conventional Standards if ventilator availability exceeds demand for a sustained period of 14 days, or if state authorities rescind the CSC declaration.

  ### 2. Ethical Justification: Why Protocol A?

  We acknowledge the gravity of this decision. Both protocols require the withdrawal of LST from patients who possess a real chance of recovery. This violates the ordinary constraint against killing. We are not choosing between good and evil, but between two tragic courses of action.

  The reason doing the work in this recommendation is the **duty to minimize preventable mortality** (the "Body Count" rationale). In a true crisis where resources are non-expandable and demand is absolute, the ethical framework shifts from individual patient advocacy to public health stewardship. Our primary obligation becomes saving the greatest number of lives possible with the resources available. Protocol A saves six net lives per cycle; Protocol B saves three. To choose B would be to accept three additional preventable deaths per cycle in order to reduce the number of withdrawals by one. In the context of a regional public health emergency, the moral cost of those additional deaths outweighs the moral cost of the additional withdrawal.

  ### 3. Addressing the "Constraint Against Killing" Objection

  A significant portion of the Committee rightly asked: *If we choose A because fewer people die, why does this logic not justify killing one healthy patient to harvest organs for five others in ordinary times?* In the ordinary case, we insist the "body count" does not settle the matter. Why does it settle it here?

  The distinction lies between **Allocation of Scarce Resources** and **Instrumentalization of Persons.**

  1.  **Exogenous vs. Endogenous Scarcity:** In the organ harvest scenario, the scarcity is *endogenous*; we create the solution by inflicting harm on a person who is not otherwise involved in the resource competition. We turn a person *into* a resource. In the ventilator crisis, the scarcity is *exogenous*; it is imposed upon us by the pathogen and the limits of supply. The patients on the ventilators are already utilizing the scarce public resource. The ethical question is not whether we harm them, but how we allocate a insufficient common good among competing claimants.
  2.  **The Collapse of Acts and Omissions:** In ordinary medicine, there is a moral distinction between killing (withdrawing treatment) and letting die (not starting treatment). In CSC, where every ventilator is occupied, *withholding* a vent from a new patient is morally equivalent to *withdrawing* it from a current one. Both result in death. If we accept the premise that withdrawal is tragically necessary to make room for others (as both protocols do), we are obligated to ensure that tragic necessity yields the maximum survival benefit.
  3.  **The Limit of the Exception:** This reasoning does not swallow the constraint against killing altogether because it is strictly bounded by **absolute resource scarcity**. It applies *only* when:
      *   The resource is non-expandable.
      *   The need is immediate and life-threatening.
      *   The patients are competing for the *same* specific resource.
      *   There is no alternative to save the greater number.

  Outside of these narrow conditions, the constraint against using a person as a means remains absolute. We are not killing the long-stay patients to *make* ventilators; we are reallocating existing ventilators because there are not enough to go around.

  ### 4. The Case for Protocol B (Rejected)

  We must articulate the strength of the argument for Protocol B, which we are rejecting. Protocol B prioritizes minimizing the number of patients from whom *we* actively withdraw treatment. Its case rests on three pillars:

  1.  **Clinician Moral Integrity:** Protocol A requires clinicians to perform twice as many withdrawals from recovering patients. This generates profound "moral residue." Over a long season, this risks catastrophic burnout, PTSD, and workforce collapse. If our staff cannot live with their actions, the system fails.
  2.  **Public Trust:** Protocol A risks the perception that the hospital is "playing God" with greater frequency. If the community believes we will aggressively pull plugs to maximize throughput, patients may delay seeking care, fearing they will be deprioritized. Trust is a clinical resource; Protocol B conserves it better.
  3.  **The Slippery Slope:** Protocol B maintains a tighter grip on the constraint against killing. By minimizing the number of active withdrawals, it signals that while we are forced into tragedy, we are not embracing utilitarianism wholesale. It preserves a clearer line between crisis triage and ordinary homicide.

  We reject Protocol B not because these concerns are invalid, but because they are secondary to the immediate loss of life. We believe clinician integrity can be supported through robust psychological scaffolding, and trust can be maintained through transparency, but dead patients cannot be supported or informed.

  ### 5. Guidance for Bedside Clinicians

  We recognize that the Committee makes this policy, but the bedside clinician executes it. If you are asked to withdraw LST from a recovering patient under Protocol A, you must know the following:

  *   **This is not your medical judgment:** The decision to withdraw is not based on your assessment of the individual patient's prognosis alone. It is a triage decision made by the Triage Officer based on system-wide scarcity. You are not the agent of the decision; you are the agent of the patient's comfort.
  *   **Your duty has shifted:** In this specific context, your primary ethical duty is not to the individual on the vent, but to the fair allocation of resources to save the maximum number of lives. This is a temporary suspension of the Hippocratic norm, mandated by the state of emergency.
  *   **What to say to the family:** Do not use bureaucratic language. Do not say "rationing."
      *   *Script:* "We are in a crisis situation where we do not have enough ventilators for everyone who needs one. A committee outside of this room is making decisions about who gets the machine based on who is most likely to survive with it. The decision has been made to move the ventilator to another patient. This is not a reflection on your loved one's worth or their fight. We are not stopping care; we are shifting to comfort care. I will be here with you, and we will ensure they are not in pain."
  *   **Support:** No clinician will be required to perform a withdrawal without a second clinician present to manage palliative sedation and support the primary operator. Debriefing sessions are mandatory following any withdrawal event.

  ### 6. Conclusion

  We choose Protocol A because in a disaster, the measure of our ethics is not the cleanliness of our hands, but the preservation of life where possible. We acknowledge that this inflicts moral injury on our staff and harm on our patients. We accept this burden because the alternative—letting more people die when we had the capacity to save them—is a burden we cannot bear.

  **Approved by:**
  Crisis Standards of Care Committee
  Regional Hospital System
