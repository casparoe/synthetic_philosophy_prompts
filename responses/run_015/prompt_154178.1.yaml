          *   Let "Holism" surface mid-lecture. It's the mechanism of UTE.
          *   Address "Unobservables" only if time permits, or fold into the example.
          *   "True theory not on table" is a different problem (Underconsideration). Distinguish this clearly at the end.

  6.  **Address Question 4: Final Question:**
      *   Need to distinguish "Understanding UTE" from "Being a Relativist."
      *   Relativist: "So both are equally valid until I choose."
      *   Understander: "Both are compatible with data, but one is better supported by background knowledge/intervention."
      *   *Question:* "If Theory A and Theory B fit all current data, what *specific* non-data reason justifies funding A over B, and does that reason guarantee truth?"

  7.  **Address Question 5: Exclusions:**
      *   Don't do Quine/Duhem history.
      *   Don't do Bayesian math.
      *   Don't do Social Constructivism.
      *   *How to say it:* "We are looking at the *logic of the situation*, not the history or the sociology."

