answer: |-
  Here is the plan. It is designed to respect their time, leverage their existing intuitions, and prevent the discussion from sliding into "post-modern relativism," which is the primary failure mode for this topic with science majors.

  ### 1. Sequence and Dependencies

  **The Order:**
  1.  **Validate the Intuition (5 mins):** Start by affirming their working assumption ("Data decides"). Show a case where data *does* decide (e.g., a positive culture for a specific pathogen). Establish that this is the ideal.
  2.  **The Disruption (15 mins):** Introduce the **One Example** (see below). Walk through the data. Show that two distinct causal stories fit the data equally well.
  3.  **The Weak Thesis (5 mins):** Formalize what they just saw: *Current* evidence underdetermines the choice. (They will accept this; it's just "we need more research.").
  4.  **The Strong Thesis (10 mins):** Deepen the example to show that *potential* evidence (of the same kind) might not decide it either. This is the philosophical pivot.
  5.  **The Repair (10 mins):** How do we choose if not by data? Introduce **Theoretical Virtues** (simplicity, coherence, fruitfulness). Distinguish **Genuine Rivals** from **Verbal Restatements** here.
  6.  **Assessment & Close (5 mins):** The final question and scope boundary.

  **Addressing Your Specific Sequencing Questions:**
  *   **Thesis Statement Timing:** Do **not** state the thesis first. If you say "Theory is underdetermined by evidence" to an engineering student in minute one, they hear "Science is broken." Instead, show them a puzzle where their tools (data collection) stall. State the thesis *after* they feel the stall.
  *   **Rival vs. Restatement:** Leave this for the **Repair** phase (Step 5). If you introduce this distinction early, it becomes a semantic game that distracts from the core logical problem. You need them to feel the anxiety of the choice first. Use the distinction later to defuse the "Anything Goes" misconception.
  *   **Weak vs. Strong:** Start **Weak**, move to **Strong**.
      *   *Weak:* "Given the data we have *today*, both Theory A and B work." (Engineers accept this as 'ongoing work'.)
      *   *Strong:* "Even if we gather all the data of *this type*, A and B might still both work." (This forces the realization that data alone is logically insufficient.)
      *   *Why:* If you start with the Strong claim, it sounds absurdly skeptical. If you start with the Weak claim, it sounds like a routine funding problem. The pedagogical work is moving them from the former to the latter.

  ### 2. The One Example

  **Your Suspicion:** You are right to doubt the curve-fitting case.
  *   **Why:** To an engineer, curve-fitting is a *modeling choice*, not a *theoretical commitment*. They know cross-validation. They know overfitting. They will solve it by saying "gather more points" or "regularize the model." It treats theory as a descriptive function, not a causal mechanism. It makes UTE look like a sampling error rather than a structural feature of inference.

  **The Replacement:** **Dark Matter vs. MOND (Modified Newtonian Dynamics).**
  *   **Why this works for this audience:**
      *   **It is Diagnostic:** Frame it as "The Galaxy is a machine. It is vibrating (rotating) faster than the blueprint (Newton/Einstein) says it should."
      *   **It is Causal, not Descriptive:** Theory A (Dark Matter) says "There is hidden mass." Theory B (MOND) says "The law of gravity changes at low acceleration." These are different *mechanisms*, not just different curves.
      *   **It Resists "More Data":** Both theories are currently tuned to fit the rotation curves (the data). Gathering more rotation curves doesn't solve it; both sides adjust their parameters to fit new points. This blocks the "just gather more points" objection.
      *   **It Forces Non-Evidential Choices:** To choose between them, you must appeal to *coherence* (DM fits the Standard Model of particle physics better) vs. *simplicity* (MOND doesn't require invisible stuff). This sets up the "Theoretical Virtues" discussion perfectly.
  *   **What it must have:** Two distinct ontologies (stuff vs. law). Empirical equivalence on the primary dataset (rotation curves).
  *   **What it must lack:** A "smoking gun" that you can reveal at the end. (Do not resolve the science; resolve the *logic*).

  ### 3. Misconceptions: Order and Defusal

  Here is the order in which these will surface, and how to handle them.

  1.  **"So anything goes / All theories are equally good." (Relativism)**
      *   *When:* Immediately after the Strong Thesis.
      *   *Action:* **Cut this off in advance.** Frame UTE as a constraint on *logic*, not a license for *opinion*. Say explicitly: "Underdetermination does not mean all theories are equal. It means evidence alone doesn't *force* the choice. We still have reasons to prefer one."
  2.  **"Simplicity settles it." (The Engineer's Solution)**
      *   *When:* During the Dark Matter example.
      *   *Action:* **Let this surface.** This is your teaching moment. Agree that simplicity matters, but classify it: Simplicity is a *virtue*, not *evidence*. It is a reason to *bet* on a theory, not proof the theory is *true*. This distinguishes pragmatic choice from logical necessity.
  3.  **"That's just holism/auxiliary hypotheses." (The Stats Student's Defense)**
      *   *When:* During the Weak/Strong transition.
      *   *Action:* **Validate but contain.** Acknowledge that Duhem/Quine holism is the *mechanism* of underdetermination (you can save a theory by tweaking auxiliaries). But insist that the *consequence* is what matters: if we can always tweak auxiliaries, data never speaks for itself. Don't get bogged down in the logic of holism; keep focus on the choice between rivals.
  4.  **"This is really an argument against believing in unobservables." (Instrumentalism)**
      *   *When:* Late stage.
      *   *Action:* **Deflect.** Note that UTE applies to observables too (e.g., diagnosis), but it is sharper with unobservables. Don't let the lecture become a debate on scientific realism.
  5.  **"The true theory isn't on the table." (Underconsideration)**
      *   *When:* End of class.
      *   *Action:* **Distinguish.** This is a different problem (Pessimistic Induction). UTE is about the choice between *available* rivals. Acknowledge the worry, but bracket it: "Even if the truth isn't here, we still have to choose between A and B to build the bridge/treat the patient. How do we do that?"

  **Predictable Misconception Not Listed:**
  *   **"Underdetermination is temporary."** They will assume UTE is just a placeholder for "we don't have the technology yet."
      *   *Defusal:* Use the Strong Claim. Emphasize that for some theoretical choices, the distinction may *never* be empirically decidable, yet we must still act.

  ### 4. The Final Assessment Question

  Do not ask "What is underdetermination?" (They can parrot that without understanding).
  Do not ask "Is science objective?" (Too vague).

  **Ask this:**
  > "If Theory A and Theory B fit all available data equally well, and you must allocate a million dollars of research funding to one of them today:
  > 1. What specific reason do you give for funding A over B?
  > 2. Does that reason guarantee A is *true*, or only that A is *better to work with*?"

  **Distinguishing Answers:**
  *   **Caught the Relativist Mood:** "It doesn't matter, pick one," or "Truth is subjective."
  *   **Got the Thesis:** "We choose based on [virtue: coherence/simplicity], but this increases our *confidence*, it does not logically *prove* truth. We are making a rational bet, not a logical deduction."

  ### 5. Explicit Exclusions (Scope Boundaries)

  You have 50 minutes. You must explicitly refuse three things to keep focus. Say this verbatim or close to it:

  1.  **"We are not doing History."**
      *   *Say:* "We are using examples like Dark Matter to illustrate a logical structure, not to debate the history of physics. The history is messy; the logic is what we're isolating."
  2.  **"We are not doing Sociology."**
      *   *Say:* "Underdetermination is not about scientists being biased or political. It is about the logical relationship between data and theory, even for perfectly honest researchers." (This prevents the "Science is just social construction" derailment).
  3.  **"We are not doing Math."**
      *   *Say:* "I am not going to show you the equations for MOND or Dark Matter. The problem isn't the calculation; it's the inference from the calculation to the world."

  **Why this works:** It signals to the engineering/pre-med students that you respect their disciplines (history/sociology/math are separate silos) and that you are teaching them a tool for *reasoning*, not a critique of their future profession.
