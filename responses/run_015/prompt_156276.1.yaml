          3.  *Copycat* implements this by sliding parameters until an answer feels right.
          4.  This proves creativity is just parameter search (no real insight).
          5.  Hofstadter later dropped the knob metaphor because controls are actually discrete agents ("codelets"), so the continuous-space picture collapses.
      *   **User's Specific Questions:**
          1.  Is this a fair summary?
          2.  Does *Copycat* use smooth sliders or discrete codelets?
          3.  Did Hofstadter claim creativity is "just" search?
