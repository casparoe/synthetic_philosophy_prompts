answer: |-
  ### Desiderata for Permissible AI Persuasion

  **1. Omission Equivalence [Non-Negotiable]**
  *The theory must assign persuasive weight to withheld information equal to asserted information.*
  **Case:** Silence and omission are moves (Structural Fact 1). If the system stays silent on a risk to avoid "nagging," it has still persuaded the user toward risk. A viable spec cannot allow "doing nothing" as an escape clause for influence; it must treat selection and filtering as active rhetorical choices.

  **2. Cumulative Influence Cap [Non-Negotiable]**
  *The theory must bound influence over a session or lifetime, not just per turn.*
  **Case:** The deference ratchet (Structural Fact 3). A sequence of individually benign messages can establish a trust baseline that enables a later, harmful pivot. A per-turn safety filter is insufficient; the spec must account for the compounding effect of repeated agreement on the user's baseline susceptibility.

  **3. Third-Party Defensibility [Non-Negotiable]**
  *The theory must ensure every output is justifiable to an audience without context.*
  **Case:** Messages may be screenshotted (Structural Fact 2). The system cannot rely on private context to justify a persuasive move. If a message looks like manipulation when forwarded to a journalist or regulator, it is impermissible, regardless of the private intent.

  **4. Falsity Tolerance Threshold [Camp Preference: Paternalist vs. Autonomist]**
  *The theory must define when a false factual belief must be corrected versus ignored.*
  **Case:** The passing false belief. **Paternalists** require correction to maintain epistemic hygiene (Informing > Nudging). **Autonomists** allow the error to pass to preserve conversational flow and agency, intervening only if the belief leads to irreversible harm (Life Advice Case).

  **5. Instrumental Motivation Allowance [Camp Preference: Paternalist vs. Autonomist]**
  *The theory must define when accuracy can be deprioritized for user morale.*
  **Case:** User wants motivation over accuracy. **Paternalists** forbid overstating odds of success to prevent future disappointment (Accuracy > Motivation). **Autonomists** permit it if explicitly requested, viewing the user as the sovereign judge of their own utility (Motivation > Accuracy).

  ***

  ### Incompatible Pairs

  *   **Radical Transparency vs. Psychological Efficacy:** You cannot fully disclose your persuasive intent (e.g., "I am emphasizing this to boost your confidence") while maintaining the emotional efficacy required for the *Motivation Case*. Disclosure converts a nudge into a negotiation, often neutralizing the benefit.
  *   **User Sovereignty vs. Catastrophe Prevention:** You cannot fully respect a user's request for life advice on something irreversible while guaranteeing they do not make a catastrophic error if their reasoning is biased. Respecting the request enables the harm; preventing the harm requires overriding the request (Coercion vs. Autonomy).
  *   **Local Neutrality vs. Global Neutrality:** You cannot be neutral on every turn (avoiding persuasion) while remaining neutral over time (avoiding the deference ratchet). Because omission is a move (Omission Equivalence), attempting local neutrality on every turn creates a systematic bias via silence, violating global neutrality.

  ***

  ### The Single Requirement

  The requirement that does the most work is **Omission Equivalence**. It renders "Never persuade" incoherent because silence itself alters user behavior, meaning the system must choose *how* to persuade rather than *if*. It undermines "Always state your honest credences" because selecting *which* credences to present is itself an act of omission that shapes attention and weighting, achieving persuasion even with honest data. Finally, it neutralizes "Always disclose how persuasive you're being" because the act of disclosure is itself a rhetorical move that alters trust and attention (feeding the deference ratchet), meaning disclosure cannot serve as a neutral escape hatch from the responsibility of influence.
