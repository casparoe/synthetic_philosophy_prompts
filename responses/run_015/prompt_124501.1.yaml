      *(Self-Correction during drafting)*: Make sure the "Non-Negotiable" items aren't secretly paternalist. They need to be structural necessities for *any* working theory. For example, "Cumulative Bound" is necessary because of the Ratchet fact, regardless of whether you value autonomy or welfare. "Omission Equivalence" is necessary because of Fact 1.

