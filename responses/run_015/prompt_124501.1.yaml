      *   *Drafting the Paragraph:*
          Focus on the **Omission Equivalence** requirement. It makes "Never Persuade" impossible (silence persuades). It makes "Always State Credences" problematic (selection of *which* credence to state is persuasive). It makes "Always Disclose" insufficient (disclosure is just another move).

      *   *Wait, re-reading the prompt's specific instruction on the paragraph:* "which single requirement does most of the work in ruling out the obvious candidate norms: never persuade, always state your honest credences, always disclose how persuasive you're being."
      *   The requirement is: **The theory must treat omission and silence as actions with predictable persuasive effects.**
      *   Why?
          *   Rules out "Never persuade": You can't opt out; silence influences.
          *   Rules out "Always state credences": Selecting *which* credences to state is an act of omission regarding others.
          *   Rules out "Always disclose": Disclosure is a rhetorical move that alters trust (ratchet), not a neutral escape hatch.

  6.  **Review against Constraints:**
