prompt: |-
  hi — Im in the back half of a decision theory option this term and I also sit on the committee for my uni's student-run seed fund, which is where this is actually coming from. We hand out about twenty grants a term, £150 to £2,000, and we have to rank the whole pile in one two-hour meeting. Most are boring (society events, a bike repair workshop). But every term there's two or three of the "almost certainly nothing, tiny chance of something very big" shape — last term it was a group open-sourcing some protocol and someone doing a cheap high-throughput screen for a longevity-ish thing. And since we did the Pasadena game in class Ive got a knot in my head about whether our ranking exercise is even well-defined for those ones. You know the game: fair coin until the first heads on the nth toss, payoff ±2^n/n with the sign alternating, expectation comes out as a conditionally convergent series, so you can reshuffle the terms to make it sum to whatever you like — it has no expected value in the strong sense at all, only some weak, order-dependent one.

  So what I want is a procedure, not more theory. Something five people with no more than first-year stats can run in ten minutes per proposal, in a spreadsheet, with three-point estimates rather than distributions, and that says where it stops with a no and where it hands the decision to a person because the question is about values not facts. (Anything needing a real elicitation session is dead on arrival, and the finance office signs off on anything over £1,000, so the output has to be something I can defend to them in a paragraph.)

  The one idea of my own I want you to either build in or tell me is junk: rearrangement-invariance as a test. If ranking A above B changes depending on the order you enumerate the payoff states in, or on where you truncate the tail, the procedure should refuse to rank that pair and kick it to a human with a stated reason. I'd like that cashed out properly — how do you actually check for it with no distribution, and is invariance to reordering the same demand as robustness to truncation, or are those two separate tests? Also: at what point do we give up on expectations entirely and rank by something tamer (medians of a truncated distribution? stochastic dominance where it applies?), what we do when we simply can't get a number for the tail, and which steps are honestly just judgement calls dressed up as procedure.

  Then run it on three: the longevity screen (probability of anything real maybe 1%, upside nobody can put a number on), the open-source protocol (heavy tail but there's a soft ceiling), and the bike workshop (small, near-certain payoff). Apply it straight — I should say I really want to fund the bio one and I'd rather be told the procedure ranks it below the bike workshop than have it fudged. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **User:** Student on a university seed fund committee, currently taking a decision theory course.
      *   **Problem:** Ranking ~20 grant applications (£150-£2,000) in a 2-hour meeting. Most are low-risk/low-reward (society events), but 2-3 are high-variance "moonshots" (longevity screen, open-source protocol).
      *   **Theoretical Conflict:** The "Pasadena Game" problem (conditionally convergent series, no well-defined expected value due to rearrangement dependence) is causing anxiety about ranking the high-variance projects.
      *   **Constraints:**
          *   Procedure must be practical (5 people, 10 mins/proposal).
          *   Tools: Spreadsheet, 3-point estimates (Low, Base, High) only (no complex distributions).
          *   Output: Clear ranking or "kick to human" flag.
          *   Accountability: Defensible to Finance Office in a paragraph.
          *   Tone: British English, pragmatic, not overly academic but theoretically sound.
          *   Specific Request: Incorporate/test the user's idea of "rearrangement-invariance" as a stability test.
          *   Honesty: Don't fudge the results to match the user's preference (they want to fund the bio one, even if the model says "bike workshop").

  2.  **Deconstruct the Theoretical Issue (Pasadena Game):**
      *   The Pasadena Game relies on an infinite series of outcomes with alternating signs and growing magnitude ($\sum (-1)^{n+1} \frac{2^n}{n} \cdot \frac{1}{2^n}$). The expectation is $\sum \frac{(-1)^{n+1}}{n}$, which is conditionally convergent. Riemann Rearrangement Theorem says you can sum to anything.
      *   *Reality Check:* Grant applications do *not* have infinite outcomes. They have finite, albeit uncertain, outcomes. However, the *spirit* of the problem applies: when the tail is fat enough and undefined, the Expected Value (EV) becomes unstable and sensitive to modeling assumptions (truncation, binning).
      *   *User's Idea:* Rearrangement invariance. In a discrete 3-point estimate context, "rearrangement" doesn't mean reordering terms in an infinite series. It means: Does the ranking hold if we perturb the probability mass in the tail? Or if we change the granularity of the "High" case?
      *   *Translation:* We need a "Stability Test." If small changes in the "High" estimate (which is essentially a guess) flip the ranking, the EV metric is broken for that comparison.

  3.  **Develop the Procedure (The "Stability-Weighted Ranking"):**
      *   **Goal:** A spreadsheet-friendly method using 3-point estimates (Low, Base, High) + Probabilities.
      *   **Step 1: Standard EV Calculation.** Calculate a baseline EV.
      *   **Step 2: The "Tail Sensitivity" Test (User's Invariance Idea).** Since we can't rearrange an infinite series, we test sensitivity to the *definition* of the High case.
          *   *Test A (Truncation):* What if the "High" case is actually half as good? (Conservative EV).
          *   *Test B (Probability Mass):* What if the probability of the "High" case is half what we guessed? (Risk-adjusted EV).
      *   **Step 3: The "Floor" Check.** Does it meet a minimum viable threshold? (Stochastic dominance proxy).
      *   **Step 4: The Flag.** If Baseline EV > Project B but Conservative EV < Project B, flag as "Unstable/Value Judgement Required."
      *   **Step 5: Fallback Metric.** If EV is unstable, use Median/Base Case for ranking (tamer metric).

  4.  **Addressing Specific Questions:**
      *   *Rearrangement vs. Truncation:* In finite 3-point estimates, they are effectively the same test: robustness to the specification of the tail. I need to clarify this distinction. Rearrangement is theoretical; Truncation/Sensitivity is practical.
      *   *When to give up on Expectations:* When the "High" case contributes >50% of the total EV. This indicates the decision rests entirely on a guess.
      *   *Judgement Calls:* Acknowledge that setting the "High" probability is a value judgement, not a fact.

  5.  **Drafting the Procedure (Iterative Refinement):**
      *   *Inputs:* Cost, Low Outcome (Value & Prob), Base Outcome (Value & Prob), High Outcome (Value & Prob).
      *   *Calculation:* $EV = \sum (P_i \times V_i)$.
      *   *Stability Metric:* "Tail Dependence Ratio" (TDR). $TDR = \frac{P_{high} \times V_{high}}{EV}$.
      *   *Threshold:* If TDR > 0.5, the EV is driven by the moonshot guess.
      *   *Decision Rule:*
          1.  Calculate EV.
          2.  Calculate TDR.
          3.  If TDR < 0.5: Rank by EV.
          4.  If TDR > 0.5: Flag for Human Review. Use Base Case for provisional ranking.
      *   *Refinement for the User's "Invariance" idea:* Let's make it a specific "Perturbation Test." Change the High Value by ±50%. Does the rank order swap? If yes, Flag.

  6.  **Applying to the Three Cases:**
      *   **Bike Workshop:** Low variance. High probability of success. Value is certain. TDR will be low. EV is stable.
      *   **Open-Source Protocol:** Medium variance. Soft ceiling. TDR might be moderate.
      *   **Longevity Screen:** High variance. Unlimited upside (theoretically). Probability tiny (1%). Value huge (undefined). TDR will be massive. EV will be unstable.
      *   *Honesty Check:* The user wants to fund the Bio one. The model *should* likely flag it as unstable or rank it lower than the bike workshop on a risk-adjusted basis. I must not fudge this. I need to explain *why* the model might reject it (EV instability) and how the committee can override it (Value Judgement).

  7.  **Writing the Response (British English & Tone):**
      *   Tone: Professional, academic but pragmatic, slightly dry (Oxbridge/UK uni vibe).
      *   Structure:
          1.  Direct answer to the theoretical worry (Pasadena vs. Reality).
          2.  The Procedure (The "Stability-Adjusted Expected Value" or SAEV).
          3.  Addressing the Invariance/Truncation question.
          4.  The Three Case Studies (The "Stress Test").
          5.  The Finance Office Paragraph.
      *   *Key Constraint:* 10 mins per proposal. Keep the spreadsheet logic simple.

  8.  **Refining the "Invariance" Concept:**
      *   The user asks: "Is invariance to reordering the same demand as robustness to truncation?"
      *   *Answer:* In the Pasadena game, rearrangement works because the series is conditionally convergent (positive and negative terms sum to infinity separately). In grants, outcomes are usually positive (or bounded loss). So true rearrangement isn't the issue. The issue is *tail weight*. Truncation is the practical equivalent. I will advise them to treat "Rearrangement Invariance" as "Specification Robustness."

  9.  **Final Polish:**
      *   Ensure the "Finance Office Paragraph" is actually defensible.
      *   Ensure the "Bio vs. Bike" result is honest. (Likely: Bike wins on stable EV, Bio wins on "Strategic Risk" but requires human override).
      *   Check word count and pacing.

  *(Self-Correction during drafting)*: I initially thought about suggesting Median. But for a seed fund, Median of a moonshot is often zero. That kills all innovation. Better to use EV but flag instability. The "Human Kick" is the crucial part. The procedure shouldn't *ban* the bio project, it should *flag* that the number is made up.

  Let's finalize the "Tail Dependence Ratio" (TDR). If the "High" scenario accounts for more than 50% of the Expected Value, the project is effectively a lottery ticket. We should flag that.

  Okay, ready to write.
answer: |-
  Right, let's untangle this. You are experiencing the theoretical hangover from the Pasadena Game, which is a rite of passage in decision theory. The good news is that grant applications are not infinite series. The bad news is that your intuition is correct: when the tail is fat enough and undefined enough, the Expected Value (EV) becomes a function of your modelling assumptions rather than the project itself.

  You asked for a procedure, not a lecture. Below is a spreadsheet-ready protocol designed to separate "calculable risk" from "unquantifiable uncertainty," incorporating your invariance idea as a stability test.

  ### The Procedure: Stability-Adjusted Ranking (SAR)

  **Inputs (per proposal):**
  1.  **Cost:** £ requested.
  2.  **Scenario Estimates (Value in £ equivalent impact):**
      *   $V_{low}$ (Failure/Minimum viable)
      *   $V_{base}$ (Expected success)
      *   $V_{high}$ (Moonshot)
  3.  **Scenario Probabilities:**
      *   $P_{low}, P_{base}, P_{high}$ (Must sum to 1).

  **Step 1: Calculate Baseline EV**
  $$EV_{base} = (P_{low} \times V_{low}) + (P_{base} \times V_{base}) + (P_{high} \times V_{high})$$

  **Step 2: The Invariance/Stability Test (Your Idea)**
  You asked about rearrangement invariance. In a finite 3-point model, you cannot rearrange terms like an infinite series. However, the *spirit* of the Pasadena problem is that the sum depends on how you group or truncate the tail. In practice, this translates to **Specification Robustness**.

  Run two perturbations in the spreadsheet:
  *   **Truncation Test:** Halve the $V_{high}$. Calculate $EV_{trunc}$.
  *   **Probability Test:** Halve the $P_{high}$ (redistribute to $P_{base}$). Calculate $EV_{prob}$.

  **Step 3: Calculate the Instability Flag**
  A ranking is "well-defined" only if the order holds under perturbation.
  *   **Flag Condition:** If $EV_{base}$ ranks Project A > Project B, but either $EV_{trunc}$ or $EV_{prob}$ ranks B > A, mark the pair as **UNSTABLE**.
  *   **Tail Dependence Ratio (TDR):** As a quick single-metric proxy, calculate $TDR = \frac{P_{high} \times V_{high}}{EV_{base}}$.
      *   If $TDR > 0.5$, the project's value is >50% derived from the guesswork in the tail. Auto-flag for human review.

  **Step 4: The Decision Rule**
  1.  **Green Zone (TDR < 0.5, No Flag):** Rank by $EV_{base}$.
  2.  **Amber Zone (TDR 0.5–0.8, or Flag on Truncation):** Rank by $EV_{base}$, but note "Sensitive to upside assumptions."
  3.  **Red Zone (TDR > 0.8, or Flag on Probability):** Do not rank by EV. Rank by $V_{base}$ (the median-ish outcome). Kick to Committee Vote with the explicit note: *"EV undefined; ranking based on viable floor, not speculative ceiling."*

  ### Addressing Your Theoretical Questions

  **1. Rearrangement vs. Truncation**
  In the Pasadena Game, rearrangement works because the series is *conditionally convergent* (the positive terms sum to $+\infty$ and negative to $-\infty$). Grant payoffs are rarely negative infinity, and they are finite. Therefore, true rearrangement invariance is not the test you want. **Truncation robustness is the practical equivalent.** If chopping off the top 10% of the tail changes your decision, your EV is not a fact; it is a narrative. Treat them as the same demand: "Does this number survive contact with reality?"

  **2. When to give up on Expectations**
  Use the **Tail Dependence Ratio (TDR)** threshold above. Once more than half the expected value comes from the "miracle" scenario, you are no longer investing; you are buying a lottery ticket. At that point, switch to ranking by the Base Case ($V_{base}$). This is effectively ranking by stochastic dominance in the lower 90% of the distribution, ignoring the undefined tail.

  **3. Judgement Calls vs. Procedure**
  Be honest in your minutes: Setting $P_{high}$ for a moonshot is a value judgement, not a statistical fact. The procedure isolates this. The spreadsheet handles the arithmetic; the committee handles the *risk appetite*. The procedure tells you *when* to switch from arithmetic to philosophy.

  ---

  ### Application to Your Three Cases

  Here is the straight application. I have not fudged the numbers to make the biology project win. I have used plausible estimates based on your descriptions.

  #### 1. The Bike Workshop (Boring)
  *   **Cost:** £500
  *   **Estimates:** Low £0 (no show), Base £2,000 (community value), High £3,000 (press coverage).
  *   **Probs:** 10% Low, 80% Base, 10% High.
  *   **EV Base:** £1,750.
  *   **TDR:** $(0.1 \times 3000) / 1750 = 17\%$.
  *   **Stability:** Halving the High value changes EV by less than £150. Rank order stable.
  *   **Verdict:** **Green Zone.** Rank by EV.

  #### 2. Open-Source Protocol (Medium Tail)
  *   **Cost:** £1,500
  *   **Estimates:** Low £0 (abandoned), Base £5,000 (adopted by few), High £50,000 (industry standard).
  *   **Probs:** 40% Low, 50% Base, 10% High.
  *   **EV Base:** £7,500.
  *   **TDR:** $(0.1 \times 50000) / 7500 = 66\%$.
  *   **Stability:** Halving $V_{high}$ (£25k) drops EV to £5,000. If competing against a project with EV £6,000, the rank flips.
  *   **Verdict:** **Amber Zone.** Rank by EV, but flag sensitivity. It beats the Bike Workshop on numbers, but it's wobbly.

  #### 3. Longevity Screen (The Pasadena Candidate)
  *   **Cost:** £2,000
  *   **Estimates:** Low £0 (90%), Base £10,000 (9%, publishable paper), High £10,000,000 (1%, breakthrough).
  *   **EV Base:** £109,000.
  *   **TDR:** $(0.01 \times 10,000,000) / 109,000 = \mathbf{91.7\%}$.
  *   **Stability:** Halving the High value (£5m) drops EV to £59,000. Halving the Probability (0.5%) drops EV to £59,000.
  *   **Comparison:** Against the Bike Workshop (EV £1,750), the Longevity screen wins on EV.
  *   **BUT:** Against the Protocol (EV £7,500), if we apply the **Red Zone Rule** (TDR > 0.8):
      *   We ignore the tail. We rank by Base Case.
      *   Longevity Base: £10,000.
      *   Protocol Base: £5,000.
      *   Bike Base: £2,000.
  *   **Verdict:** **Red Zone.** The EV is mathematically real but decision-theoretically hollow. The procedure mandates a human vote. If the committee votes on *stable* impact, the Bike Workshop wins (certainty). If they vote on *Base Case*, Longevity wins. If they vote on *EV*, Longevity wins by a mile.

  **The Honest Result:**
  Under strict SAR rules, the Longevity project triggers the **Red Zone Flag**. The spreadsheet will display: *"EV unstable. 92% of value derived from <1% probability event. Do not compare via EV."*
  If you force a numeric ranking using the fallback (Base Case), Longevity (£10k) still beats Bike (£2k).
  However, if your committee applies a **Risk of Ruin** constraint (i.e., "we need 10 successful events to justify our existence"), the Bike Workshop provides 80% certainty of success, Longevity provides 10%.

  If you want to fund the Bio one, you must admit you are overriding the stability metric. That is a valid committee decision, but it must be recorded as a **Risk Preference Override**, not a calculation.

  ### The Finance Office Paragraph

  You need to defend this to the Finance Office. They care about accountability, not decision theory. Use this:

  > "The Committee utilises a Stability-Adjusted Ranking protocol to ensure grant funds are allocated efficiently. For standard projects, we rank by Expected Value. For high-variance proposals where >50% of the calculated value relies on speculative 'moonshot' outcomes, the model flags these as 'Unstable'. These proposals are not rejected but are subject to a separate Committee vote to explicitly approve the risk tolerance required. This ensures that while we remain open to high-impact research, the majority of the fund is deployed against verifiable, stable student outcomes."

  ### Summary Advice

  1.  **Keep the Invariance Test:** Implement the "Halve the High Case" check in your spreadsheet. It takes 10 seconds and exposes the Pasadena problem immediately.
  2.  **Don't Trust the EV on the Bio Project:** It is a number, but it is not *evidence*. It is a story told in arithmetic.
  3.  **Own the Override:** If you fund the longevity screen, minute it as: *"Committee accepts high variance and low probability of success in exchange for non-linear upside."* That is a value statement. It is defensible. Pretending it's the "rational EV choice" is what gets you into Pasadena trouble.

  The knot in your head is correct: for the bio project, the expectation is not well-defined in a way that permits mechanical ranking. The procedure above admits that failure and hands the baton to you.
