  First, schools are not exchangeable units like lab rats; demographic and resource disparities between the half assigned to exams versus portfolios will confound results, undercutting the claim that the method caused the outcome. Selection bias is inevitable without individual randomization. Second, students are cohorts, not repeatable trials; a failed four-year trial damages a generation of children who cannot be re-run, violating the ethical symmetry of scientific experimentation where subjects are protected or replaceable. Third, the dashboard measures are not independent of the treatment; choosing test scores as the metric presupposes that promotion is for academic sorting, privileging the exam side before the pilot begins. This undercuts the claim that no prior account of ends is needed. Fourth, the costs of failure fall on vulnerable subjects without consent, whereas lab errors fall on equipment. Finally, there is no standpoint outside the dispute; the Board interpreting the dashboard is already embedded in the conflict. Data does not speak; it is interpreted through the very values in dispute. This undercuts the Deweyan claim that inquiry resolves indeterminacy without prior ends; the interpretation of better requires the prior ends the superintendent claims to bypass. The dashboard itself is a theory of value. Furthermore, the dashboard constructs the reality it measures. By prioritizing ninth-grade completion, it assumes retention is inherently bad, ignoring that holding a student back might be beneficial for some. This measurement bias ensures the experiment validates its own metrics rather than the policy's worth. The superintendent argues the experiment tells us what promotion is for, but the metrics decide that beforehand. The board cannot stand outside the values embedded in the dashboard to judge the results objectively. The analogy fails because it treats values as outputs when they are actually inputs hidden in the measurement design.

  ### Disanalogies I should ignore

  Ignore minor procedural imperfections, such as the lack of strict randomization at the individual student level or the inability to blind teachers to the condition. These are standard limitations in field experiments and do not fundamentally undermine the epistemic claim that comparison yields knowledge. Similarly, ignore the fact that four years is a short timeline for educational outcomes; while limiting, this is a practical constraint rather than a philosophical disanalogy. These issues affect precision, not the validity of using inquiry to inform policy. They are noise, not structural flaws in the analogy's logic regarding value neutrality.

  ### The strongest reply from inside the view

  A sophisticated Deweyan would argue that in social inquiry, the fact that subjects are also inquirers is a virtue. The public constitutes itself through the process of debating the dashboard's meaning. The pilot is not a lab test but a democratic forum where values are refined, not bypassed. However, granting this costs the superintendent her epistemic shield. If the pilot is constitutive of values rather than discoverer of facts, it cannot claim to resolve the deadlock neutrally. The results will not dictate the policy; the board must still argue over what the results mean. This admits that the experiment does not replace the need for a prior account of what promotion is for; it merely provides a new text for that argument. The analogy stops doing the work of bypassing normative debate.

  ### Does the conclusion survive?

  The weak claim survives: deliberate iteration is superior to permanent deadlock. Testing policies cautiously is better than guessing. However, the strong claim—that iteration replaces settling ends in advance—fails. The dashboard requires selecting metrics, which is itself settling ends. Pre-registering the dashboard helps mitigate post-hoc rationalization, but it does not solve the normative problem; it merely freezes one contested account of success for four years. If the dashboard privileges test scores, it biases the trial against portfolios regardless of actual educational value. For the strong claim to be licensed, the board would need to agree on the purpose of promotion before measuring it. Without that agreement, the pilot is not a neutral arbiter but a weaponized delay tactic. The superintendent can claim pragmatism, but she cannot claim value neutrality. The inquiry resolves indeterminacy only if the criteria for resolution are already settled.

  ### A better analogy, if there is one

  The laboratories of democracy image is closer but still implies distinct jurisdictions testing fixed laws. A common-law reasoning analogy fits better. Courts do not run experiments to find truth; they reason from precedents while adapting to new circumstances. Here, the schools are not test tubes but cases. The board acts like a supreme court, reviewing lower court rulings to establish a principle. This acknowledges that the rule emerges from interpreting particular cases within a normative framework, not from data alone. It accepts that the meaning of success evolves through the reasoning process, not just measurement. This captures the Deweyan spirit of growth without falsely promising scientific neutrality. It admits that the board must judge, not just read a scorecard.
