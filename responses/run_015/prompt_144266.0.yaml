      *   *Refinement for Determinacy:* The question needs to allow a "Yes/No" or "Side A/Side B" conclusion based on the evidence. Let's frame it as an evaluation of the *indispensability* of justificatory scaffolding.
      *   *Selected Question:* "Does the historical record of twentieth-century physics demonstrate that so-called 'justificatory scaffolding' is functionally replaceable by internal mathematical and empirical norms, thereby validating the physicist's charge of philosophical redundancy?"

  4.  **Addressing Existing Defenses:**
      *   Why do current defenses fail? Usually, they point to historical influence (e.g., Mach on Einstein) or conceptual clarity (e.g., Bell's Theorem).
      *   The gap: They don't distinguish between *building* the theory (heuristic) and *sustaining* the theory (justificatory). Physicists admit heuristics help but say they aren't "philosophy" proper or are discarded. Philosophers claim the interpretation *is* philosophy. This proposal forces a test on the *sustainability* of the philosophical commitment.

