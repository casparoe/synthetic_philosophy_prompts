  2.  **Deconstruct the Central Distinction:**
      *   *Heuristic Scaffolding:* Metaphors, provisional ontologies, guiding intuitions used *during* theory construction (e.g., Bohr's orbits, ether concepts in early EM). These are meant to be kicked away like Wittgenstein's ladder.
      *   *Justificatory Scaffolding:* Deep structural commitments required to make sense of the formalism *after* construction (e.g., causality in relativity, probability interpretation in QM, symmetry principles).
      *   *The Conflict:* Physicists say philosophy is useless. Philosophers say it's foundational.
      *   *The Hypothesis:* Maybe philosophers claim credit for heuristic stuff that gets discarded (supporting physicists), or maybe they claim credit for justificatory stuff that turns out to be replaceable by math/physics norms (also supporting physicists). Or, maybe justificatory stuff *is* indispensable (supporting philosophers).

  3.  **Drafting the Research Question:**
      *   Needs to be precise.
      *   *Draft 1:* Is philosophy useful? (Too vague)
      *   *Draft 2:* Does the distinction between heuristic and justificatory scaffolding solve the debate? (Better)
