      Okay, ready to write. The tone should be administrative but intellectually rigorous.

      *Refining the "Unpopular" Case:* The Internal vs. External case is the best candidate for the "unpopular but correct" outcome. The committee will want to favor the internal candidate because the risk is lower (known quantity). The protocol, prioritizing fairness and the definition of a "tie" based on *submitted evidence*, will force them to treat the informal knowledge as inadmissible or insufficient to break the tie, leading to randomization. This protects the external candidate from bias but feels risky to the faculty regarding their own student. I will frame this carefully.

