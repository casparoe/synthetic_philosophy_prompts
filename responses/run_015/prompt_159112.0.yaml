prompt: |-
  I am a graduate student in a seminar on practical rationality, and I also sit as the student member of my university's dissertation fellowship committee. Each spring we read roughly forty shortlisted files and award eight fellowships. Applicants are scored on five dimensions, each on a one-to-five scale, and the sums produce exact ties several times per cycle — sometimes a clean pair, sometimes a five-way clump at the cutoff where no one believes the one-point gaps mean anything. Our meetings allow about ten minutes for a borderline case, the other members are faculty with no training in decision theory, and every decision goes into a minute that the dean reads and that an unsuccessful applicant could in principle appeal against. The chair has to sign off on anything we adopt.

  I would like you to turn what the Buridan's ass problem, and the surrounding discussion of choice under genuine indifference, actually establishes into a written tie-break protocol my committee could vote to adopt at the start of a cycle. I have the philosophical reading; I do not need a summary of it or pointers to it. I need the operationalized version, and I need it to survive contact with people who have never heard the term "incommensurability."

  Concretely, please give me:

  1. An ordered sequence of tests, the first of which asks whether the case before us is a tie at all. I want the genuine symmetry case distinguished from its impostors: a rubric too coarse to resolve a real difference, evidence we simply do not have, and the inarticulate but possibly expert judgment of a member who says only that one file feels stronger. For each, say what counts as a sufficient answer and when we stop investigating.
  2. A rule about when the protocol itself must be fixed. I suspect it matters that we adopt our tie-break method before we know which files will tie, because a member who prefers a candidate can always announce indifference and then break the tie his own way. Say what the protocol does about that.
  3. Where the protocol terminates in a decision, where it escalates to a named person, and where it stops because the question is one of values rather than facts.
  4. A clause forbidding invented reasons: we must not write down a discriminator we do not actually believe in order to make a tie look resolved. Tell me how a member is supposed to distinguish a fabricated discriminator from a real one, and tell me what the minute must say when the honest description is that we had no reason.
  5. Guidance on the menu of exits — randomize openly, pick arbitrarily, defer to the chair, split the award between two applicants, or reopen the search rather than choose. Which is right when, and why. Include the case of repeated ties within one cycle and across consecutive years: if an applicant loses a coin flip twice, should the second flip be independent, or should the first loss count?
  6. What to do when the two sides of the tie carry unequal downside — a wrong pick in one direction is much worse than in the other.
  7. An honest account of what is lost in translating the philosophical problem into a committee rule, and which distinctions you deliberately dropped as unusable at ten minutes per case.

  Then run the protocol on three cases from a cycle I can anticipate: two applicants with identical scores on all five dimensions and files of comparable depth; a five-way clump at the cutoff where the point differences are noise; and a tie between a candidate from my own department, about whom three members have substantial informal knowledge, and an external candidate about whom the file is everything anyone knows. At least one of the three should produce an answer my committee will not like, and I want you to say plainly why we won't like it and that we should follow it anyway. Finally, state what the protocol cannot do — the questions it is the wrong instrument for.
reasoning: |-
  Here's a thinking process that leads to the suggested tie-break protocol:

  1.  **Analyze the Request:**
      *   **User:** Graduate student, member of a dissertation fellowship committee.
      *   **Context:** ~40 files, 8 awards. Scoring 1-5 on 5 dimensions. Frequent exact ties (pairs or clumps) at the cutoff. 10 minutes per borderline case. Faculty members (no decision theory training). Minutes read by Dean, appealable. Chair must sign off.
      *   **Task:** Create a written tie-break protocol based on the philosophical lessons of Buridan's Ass (choice under genuine indifference) but operationalized for a committee setting.
      *   **Constraints:** No philosophical summary needed. Needs to survive contact with non-experts. Must address specific points (1-7) in the prompt. Must run the protocol on three specific cases (one must be unpopular but correct). Must state limitations.
      *   **Tone:** Professional, administrative, precise, philosophically grounded but jargon-free (no "incommensurability").

  2.  **Deconstruct the Philosophical Core (Buridan's Ass):**
      *   *The Problem:* When two options are genuinely equal in value, reason cannot dictate a choice. Waiting for a reason leads to paralysis (starvation).
      *   *The Solution:* Acknowledge indifference. Introduce a non-rational determinant (will, chance, external rule) to break the symmetry without claiming a false preference.
      *   *Key Insight for Committees:* Distinguishing *epistemic* uncertainty (we don't know enough) from *ontic* indifference (they are actually equal for our purposes). Avoid post-hoc rationalization.

  3.  **Drafting the Protocol - Section by Section:**

      *   **Section 1: The Sequence of Tests (Distinguishing Ties):**
          *   Need to filter out "fake ties."
          *   *Test 1: Rubric Coarseness.* Are the scores actually the same, or did we round off a difference? *Action:* Look at sub-scores or notes. If a difference exists but wasn't captured, fix the score. If scores are truly identical, move on.
          *   *Test 2: Missing Evidence.* Do we lack info that *could* distinguish them? *Action:* If yes, defer or request info (if time allows). If no (files are complete), move on.
          *   *Test 3: Inarticulate Judgment.* "File A feels stronger." *Action:* This is tricky. If it's just a gut feeling without evidence, it's suspect. But expert intuition counts. *Rule:* Must be articulable within 2 minutes. If not, it counts as indifference.
          *   *Stopping Rule:* Stop when further discussion yields no *new, articulable, relevant* information.

      *   **Section 2: Timing of Adoption (Pre-commitment):**
          *   Crucial to prevent strategic indifference.
          *   *Rule:* Protocol adopted at the *start* of the cycle, before files are opened/scored.
          *   *Enforcement:* Chair ensures this. Any deviation requires a supermajority vote *before* seeing the tied files.

      *   **Section 3: Termination, Escalation, and Values:**
          *   *Terminate:* When a tie-break method (e.g., randomization) is executed.
          *   *Escalate:* To the Chair only if the protocol fails or is ambiguous (rare).
          *   *Values:* If the tie is about "which research is more important" and we disagree fundamentally, that's a value clash, not a tie. But if we agree on criteria and scores are equal, it's indifference. The protocol handles indifference, not value clashes.

      *   **Section 4: No Invented Reasons (Anti-Rationalization):**
          *   *Definition:* A reason is fabricated if it applies to the winner but was not applied to the loser during scoring, or if the member admits they wouldn't use it generally.
          *   *Minute Wording:* "Committee determined candidates were indistinguishable on established criteria. Selection made via [Method X]." No fake justification.

      *   **Section 5: Menu of Exits (How to Break):**
          *   *Randomization:* Best for pure indifference. Coin flip, random number generator.
          *   *Arbitrary Pick:* Chair picks. (Less defensible than random).
          *   *Split Award:* Only if budget allows.
          *   *Reopen Search:* Too costly for fellowships usually.
          *   *Repeated Ties:* Independence is key for fairness. Past losses don't count (Gambler's fallacy).
          *   *Selection:* Randomization is the most philosophically sound for Buridan cases.

      *   **Section 6: Asymmetric Downside (Risk):**
          *   If Candidate A failing is a disaster (e.g., they have no other funding) vs. Candidate B (has backup).
          *   *Rule:* This breaks indifference. It introduces a new criterion (urgency/need). If this info is available *before* scoring, it should be in the rubric. If discovered during tie-break, it resolves the tie legitimately.

      *   **Section 7: Losses in Translation:**
          *   We lose nuance. We treat "equal score" as "equal value" (which isn't always true). We sacrifice deep deliberation for time. We ignore the "moral residue" of leaving a candidate behind.

  4.  **Running the Protocol on the Three Cases:**

      *   *Case 1: Identical Scores, Comparable Depth.*
          *   Protocol says: Genuine Tie. Randomize.
          *   Outcome: Coin flip.
          *   Reaction: Faculty hate this. They want "reasons."
          *   Why follow it: Honesty. Prevents bias.

      *   *Case 2: Five-way Clump (Noise).*
          *   Protocol says: Scores within margin of error = Tie.
          *   Outcome: Randomize among the clump.
          *   Reaction: Frustration that precision wasn't possible.

      *   *Case 3: Internal vs. External (Info Asymmetry).*
          *   Internal: Known quantity. External: File only.
          *   Protocol Test 2 (Missing Evidence): Do we have *equal* evidence? No. We have *more* on the internal.
          *   Is this a tie? No. It's an epistemic gap.
          *   *Correction:* We must normalize the evidence. If we can't know the external candidate's "vibe," we can't count the internal's "vibe."
          *   *Hard Truth:* If we can't equalize information, we must treat the extra info on the internal as inadmissible for the sake of fairness, OR acknowledge the tie is false because the external is a "black box."
          *   *Unpopular Outcome:* The protocol might force us to ignore the positive informal knowledge of the internal candidate to maintain fairness, potentially leading to picking the external via randomization, or vice versa depending on how "Missing Evidence" is ruled.
          *   *Better Unpopular Outcome:* The protocol identifies this *not* as a tie, but as a procedural failure of the scoring phase. However, since we are at the tie-break stage, we must treat them as equal *on the record*. If we allow informal knowledge, we break the tie legitimately. If we forbid it (blind fairness), we randomize.
          *   *Let's make it the "Unpopular" one:* The protocol requires us to *discount* the informal knowledge because it wasn't available for the external candidate. We must randomize. The faculty will hate ignoring their knowledge of their own student. But it's the only way to ensure fairness.

  5.  **Refining the Output:**
      *   Ensure the tone is "Committee Protocol" style—clear, imperative, numbered.
      *   Make sure the philosophical underpinnings are visible but not namedropped (e.g., "Genuine Indifference" instead of "Buridan's Ass").
      *   Check all 7 prompt requirements are met explicitly.
      *   Ensure the "Unpopular Case" is clearly explained.

  6.  **Self-Correction/Review during drafting:**
