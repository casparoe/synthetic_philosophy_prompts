answer: |-
  # DISSERTATION FELLOWSHIP COMMITTEE: TIE-BREAK PROTOCOL (VERSION 1.0)

  **Effective Date:** Start of Spring Review Cycle
  **Authority:** Committee Chair (upon vote)
  **Scope:** All shortlisted applications where final scores result in a tie at the funding cutoff.

  ## SECTION 1: VERIFICATION OF INDIFFERENCE (THE TEST SEQUENCE)
  *Purpose: To distinguish genuine ties from scoring errors, missing data, or unarticulated preferences.*

  Before invoking a tie-break mechanism, the Committee must pass the following three tests in order. Discussion on each test is limited to two minutes.

  **Test 1: Rubric Resolution**
  *   **Question:** Is the tie a product of the scoring scale's coarseness?
  *   **Procedure:** Review sub-scores and reviewer notes. Is there a consistent pattern where Candidate A scored higher on specific dimensions that was lost in the summation?
  *   **Sufficient Answer:** If a member identifies a specific dimension where one candidate is demonstrably stronger based on the file, the score is amended, and the tie is dissolved.
  *   **Stop Condition:** If the sum is identical and no sub-score pattern emerges after two minutes, proceed to Test 2.

  **Test 2: Evidentiary Symmetry**
  *   **Question:** Do we possess equal quality of evidence for both candidates?
  *   **Procedure:** Determine if one file is "thinner" due to missing letters, drafts, or data, or if one candidate is known to the committee through informal channels not available for the other.
  *   **Sufficient Answer:** If evidence is asymmetric, the Committee must either (a) request the missing data (if time permits) or (b) discount the superior evidence of the known candidate to match the evidentiary baseline of the unknown candidate.
  *   **Stop Condition:** If evidence is deemed symmetric (or equalized by discounting), proceed to Test 3.

  **Test 3: Articulable Judgment**
  *   **Question:** Does any member hold a preference based on expert intuition that can be stated as a reason?
  *   **Procedure:** Any member claiming a preference must state the reason in one sentence. (e.g., "The writing sample shows greater analytical risk," not "File A feels stronger.")
  *   **Sufficient Answer:** If the reason is accepted by the Chair as relevant to the fellowship criteria, the tie is dissolved.
  *   **Stop Condition:** If the preference cannot be articulated, or the reason is rejected as irrelevant, the Committee declares **Verified Equivalence**. No further argument is permitted.

  ## SECTION 2: TIMING OF ADOPTION (PRE-COMMITMENT)
  *Purpose: To prevent strategic indifference and post-hoc rationalization.*

  1.  **Adoption:** This protocol must be voted on and adopted by the Committee *before* any files are opened or scored for the cycle.
  2.  **Immutability:** Once the cycle begins, this protocol cannot be amended for specific cases.
  3.  **Violation:** If a member attempts to invoke a tie-break method not listed in Section 5 during a specific case, the Chair must rule the motion out of order. Any change to the protocol requires a unanimous vote *before* the tied files are discussed.

  ## SECTION 3: TERMINATION AND ESCALATION
  *Purpose: To define when the decision is final.*

  1.  **Termination:** A decision is final when a method from Section 5 is executed and the result is recorded.
  2.  **Escalation:** The only ground for escalation to the Department Chair or Dean is a procedural violation of this document (e.g., a tie-break was conducted without passing Section 1). The Chair/Dean may not overturn a decision based on the merit of the candidates.
  3.  **Values vs. Facts:** If the Committee is divided on the *value* of a research topic (e.g., Theory vs. Empirical), this is not a tie; it is a disagreement. Such cases must be resolved by voting on the criteria, not by tie-break. This protocol applies only when criteria and scores are agreed upon, but the result is equal.

  ## SECTION 4: PROHIBITION OF FABRICATED DISCRIMINATORS
  *Purpose: To ensure the integrity of the minutes and prevent appealable falsehoods.*

  1.  **Definition:** A discriminator is fabricated if it was not applied to all candidates during scoring, or if the member advocating it admits they would not use it in a non-tie scenario.
  2.  **Member Duty:** If a member realizes a reason is being invented to justify a preference, they must object.
  3.  **Minute Wording:** In cases of Verified Equivalence, the minutes must state: *"Candidates X and Y were found to be in Verified Equivalence. Selection was made via [Method]."*
  4.  **Forbidden Wording:** The minutes must not list a reason for selection (e.g., "Candidate X was chosen due to stronger writing") if the selection was actually made via randomization or arbitrary pick.

  ## SECTION 5: MENU OF EXITS (TIE-BREAK METHODS)
  *Purpose: To resolve Verified Equivalence without false justification.*

  Upon declaring Verified Equivalence, the Committee must select one of the following methods. The default method is **A**.

  *   **A. Procedural Randomization:** Use a digital random number generator or coin flip conducted during the meeting.
      *   *Use Case:* Standard ties (2-way or clumps).
      *   *Repeated Ties:* If the same applicant ties in consecutive years, the randomization is **independent**. Past losses do not increase current probability. (The "Gambler's Fallacy" is explicitly forbidden).
  *   **B. Chair's Discretion:** The Committee Chair casts the deciding vote.
      *   *Use Case:* When randomization is deemed inappropriate for a specific strategic reason (e.g., cohort balance) that cannot be codified in the rubric. Must be noted in minutes.
  *   **C. Award Split:** Divide the funding between the tied candidates.
      *   *Use Case:* Only if the budget allows and the fellowship rules permit partial awards.
  *   **D. Deferral:** Hold the slot open pending additional information.
      *   *Use Case:* Rare. Only if Test 2 (Evidentiary Symmetry) failed and the missing info can be obtained within 48 hours.

  ## SECTION 6: ASYMMETRIC DOWNSIDE (HARDSHIP CLAUSE)
  *Purpose: To account for risk when indifference is genuine but consequences are not.*

  1.  **Condition:** If the Committee has reliable knowledge that one candidate faces significant hardship (e.g., loss of visa status, no alternative funding) compared to the other, Verified Equivalence is voided.
  2.  **Action:** The candidate facing greater downside is awarded the fellowship.
  3.  **Constraint:** This knowledge must be documented in the file or formally communicated to the Committee prior to scoring. It cannot be introduced during the tie-break discussion to avoid coercion.

  ## SECTION 7: PHILOSOPHICAL LOSSES (MEMORANDUM)
  *Purpose: To acknowledge what this rule sacrifices for the sake of decidability.*

  1.  **Nuance:** We accept that "Equal Score" is not perfectly "Equal Value." We sacrifice the possibility that a hidden difference exists to prevent paralysis.
  2.  **Moral Residue:** We acknowledge that randomization may feel like an abdication of responsibility. We accept this feeling as the cost of fairness.
  3.  **Time:** We deliberately drop deep deliberation. Ten minutes is insufficient to find truth in hard cases; it is sufficient only to confirm indifference.

  ***

  # COMMENTARY AND APPLICATION

  ## I. Honest Account of Losses (Req 7)
  Translating the Buridan problem into administrative rule requires brutal simplification. The philosophical distinction between *epistemic indifference* (we don't know the difference) and *ontic indifference* (there is no difference) is collapsed. In a seminar, you might debate whether the files are truly equal. In a committee meeting, if you cannot find a difference in ten minutes, you must act *as if* there is none.

  We deliberately drop the distinction between "incommensurable values" (e.g., brilliance vs. diligence) and "equal values." If the rubric sums them to the same number, the protocol treats them as identical. This is technically false—two candidates can be equally good in different ways—but distinguishing this within ten minutes invites bias. We sacrifice the *truth* of the candidates' relative merit for the *integrity* of the process. We also ignore the "moral residue" (the guilt of leaving a worthy candidate unfunded). The protocol offers no comfort for this; it only offers cover.

  ## II. Running the Protocol on Anticipated Cases

  ### Case 1: The Clean Pair (Identical Scores, Comparable Depth)
  *   **Scenario:** Two applicants, 24/25 scores. Files are equally detailed. No informal knowledge.
  *   **Protocol Application:**
      *   Test 1 (Rubric): Pass. No sub-score differences.
      *   Test 2 (Evidence): Pass. Symmetric.
      *   Test 3 (Judgment): Pass. No articulable reasons offered.
      *   **Result:** Verified Equivalence. Method 5A (Randomization).
  *   **Committee Reaction:** Mild annoyance. Faculty prefer to "find a reason."
  *   **Why Follow It:** It prevents the Chair from being accused of favoritism. It is audit-proof.

  ### Case 2: The Five-Way Clump (Noise at the Cutoff)
  *   **Scenario:** Five applicants within a 2-point range at the 8th slot. Scores are statistically noise.
  *   **Protocol Application:**
      *   Test 1: The rubric is too coarse to resolve 2-point gaps reliably.
      *   Test 2: Evidence is symmetric.
      *   **Result:** The Committee declares the clump a single "tie block." Method 5A (Randomization) selects 3 winners from the 5.
  *   **Committee Reaction:** High frustration. Faculty feel they are "gambling" fellowships.
  *   **Why Follow It:** Attempting to rank five indistinguishable files invites arbitrary criteria (e.g., "I like this university name"). Randomization admits the rubric's limits honestly.

  ### Case 3: The Internal vs. External (The Unpopular Outcome)
  *   **Scenario:** A tie between a candidate from your own department (Internal) and an external candidate. Three committee members know the Internal candidate is "solid and hardworking" from informal interaction. The External candidate is known only by the file. Scores are identical.
  *   **Protocol Application:**
      *   Test 2 (Evidentiary Symmetry): **FAIL.** The evidence is *not* symmetric. We have "file + testimony" for Internal, "file only" for External.
      *   **Protocol Mandate:** Section 2(b) requires discounting the superior evidence to match the baseline. The Committee must *ignore* the informal testimony regarding the Internal candidate because it was not available for the External candidate.
      *   **Result:** Once the informal knowledge is discarded, the files return to Verified Equivalence. Method 5A (Randomization) is used.
  *   **Committee Reaction:** **Strong Opposition.** Faculty will argue it is irrational to ignore known information. They will feel the protocol forces them to risk their own student's career on a coin flip when they "know" the student is safe.
  *   **Why Follow It Anyway:** This is the most critical test of the protocol. If you allow informal knowledge for the Internal candidate, you introduce a structural bias against external applicants who cannot generate "hallway buzz." To maintain the fellowship's integrity and defensibility against appeals (e.g., "The committee favored their own"), you must equalize the epistemic playing field. The protocol forces you to choose *procedural fairness* over *local efficiency*. It feels wrong because it feels like willful ignorance, but it is the only way to ensure the "Indifference" is genuine and not just familiarity bias.

  ## III. What The Protocol Cannot Do
  This instrument is the wrong tool for three specific questions:

  1.  **Correcting a Broken Rubric:** If ties happen every year, the problem is the scoring scale, not the tie-break. This protocol manages the symptom, not the disease.
  2.  **Resolving Value Conflicts:** If half the committee values "Methodological Rigor" and half values "Social Impact," and the candidates reflect this split, this is not a tie. This is a political disagreement. Randomization here is an abdication of governance.
  3.  **Fixing Unethical Behavior:** If a member refuses to randomize because they are personally invested in a candidate, this protocol relies on the Chair's courage to enforce it. It cannot stop a mutiny.

  **Final Note to the Committee:**
  The purpose of this protocol is not to ensure the *best* candidate always wins (the rubric does that). The purpose is to ensure that when the rubric fails, the *process* remains honest. A random choice between equals is more rational than a reasoned choice between illusions.
