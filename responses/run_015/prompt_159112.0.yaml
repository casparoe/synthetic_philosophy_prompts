      *(Self-Correction on Case 3)*: If the internal candidate is known to be *good*, and the external is unknown, standard practice is often to favor the known quantity (risk aversion). However, the prompt asks for a protocol based on *indifference*. If the scores are tied, but the information is asymmetric, is it indifference? No, it's epistemic uncertainty. The protocol should identify this as a *failure of the scoring phase* but since we are past that, we have to decide. If we count the informal info, we break the tie. If we don't, we randomize. The "Unpopular" result should be that we *cannot* use the informal info if it violates the blind scoring principle established at the start. Let's go with: The protocol forces us to treat them as tied because the *criteria* were not met equally. We must randomize. Faculty will hate ignoring their knowledge of the student.

      *Wait, a better "Unpopular" angle:* The protocol dictates that if we cannot articulate a difference in 10 minutes, we *must* randomize. In the Internal/External case, faculty will argue "We know Student A is hardworking." Protocol says: "Was that in the score? No. Can you prove Student B isn't? No. Then it's a tie." Result: Coin flip. Faculty hate risking their student on a coin.

      *Let's finalize the structure.*
      1. Preamble (Purpose).
