      *   *Fix:* Frame it as "Procedural Random Selection" to ensure auditability. It's defensible to a Dean.
      *   *Critique:* What about the "Internal vs External" case?
      *   *Fix:* This is the crux of fairness vs. efficiency. The protocol must prioritize fairness (equal information) over efficiency (using available info). This will be the unpopular result.
      *   *Check:* Did I address the "minute" wording? Yes, need specific language.
      *   *Check:* Did I address the "pre-commitment"? Yes, Section 2.

