answer: |-
  Here is the specification list you requested, reorganized to reflect the operational constraints of your two jobs (licensing realist belief and guiding Tuesday's model choice). I have sharpened the definitions to match your modeling context and flagged the status of each.

  ### Desiderata for an Adequate Account of Explanatory Inference

  **1. Hypothesis-Generation Transparency (The Palette Problem)**
  *   **Motivation:** In atmospheric chemistry, the "decisive step" is often realizing that quality-control flags or retrieval priors excluded a viable mechanism before ranking began. An account that ranks a biased set inherits that bias.
  *   **Status:** **Non-negotiable.** Without this, the inference licenses belief in artifacts of the instrumentation or sociology of the field, not the atmosphere.

  **2. Complexity-Depth Discrimination (The Accretion Problem)**
  *   **Motivation:** Adding a reaction pathway improves fit and apparent mechanistic depth. The account must distinguish between *explanatory depth* (causal leverage) and *overfitting* (parameter bloat), functioning like an AIC/BIC penalty but for explanations.
  *   **Status:** **Non-negotiable.** Required for the "Tuesday choice" job to prevent the group from adopting a model that fits the noise.

  **3. Resolution Relativity (Scale Sensitivity)**
  *   **Motivation:** A mechanism explaining ozone depletion at the parcel scale (microphysics on PSCs) differs from the hemispheric scale (transport dynamics). An account must specify if the "best" explanation is invariant or resolution-dependent.
  *   **Status:** **Non-negotiable (for accuracy).** Physics changes with scale; an account demanding a single scale-invariant verdict is empirically false.

  **4. Contrast-Class Specification**
  *   **Motivation:** Explanations answer "why *this* ozone hole rather than *that* one?" or "why *this* year rather than *last*?" The ranking of hypotheses flips depending on the foil.
  *   **Status:** **Non-negotiable.** A ranking without a specified contrast class is operationally meaningless for model selection.

  **5. Decision Closure (Stopping Rule)**
  *   **Motivation:** The working group must choose by Tuesday. Infinite elaboration of mechanisms is not an option. The account must define a threshold for "good enough to act."
  *   **Status:** **Non-negotiable.** Required for the pragmatic job; standard philosophical accounts rarely address when to stop inquiring.

  **6. Truth-Conduciveness Warrant (The Bridge)**
  *   **Motivation:** To move from the Halley Bay anomaly to a claim about heterogeneous chemistry (realist use), the account must explain why the "loveliest" explanation is likely *true*, not just useful.
  *   **Status:** **Non-negotiable (for the Realist job).** This is the specific requirement that licenses belief in unobservables.

  **7. Severe-Test Priority (The Untested Loveliness Problem)**
  *   **Motivation:** The most elegant mechanism is often the least tested. Does IBE recommend believing the elegant untested story or the clumsy tested one?
  *   **Status:** **Preference of the Error-Statistical Camp.** Abductivists prefer Loveliness; Error-Statisticians prefer Severity. An adequate account must pick a side here.

  ***

  ### Incompatibilities and Tensions

  You suspected that these requirements cannot be jointly satisfied. You are correct. There are three fundamental tensions that no current account resolves without compromise:

  1.  **Absolute Truth vs. Resolution Relativity (Requirements 3 & 6):** You demand a warrant for belief in *true* mechanisms (6), but you also demand the account respect that mechanisms change validity across scales (3). If the "true" explanation at the parcel scale is false at the hemispheric scale, then "truth" is not a stable property of the hypothesis. An account that delivers a single realist verdict (6) violates the physics of scale (3). You must choose between *Realism about the specific model* or *Instrumentalism about the scale*.
  2.  **Mechanistic Detail vs. Complexity Penalty (Requirements 2 & 7):** To explain *how* the chemistry works, you need mechanistic detail (accretion). To avoid overfitting, you need a complexity penalty (2). However, the "elegant" story (7) is often the simplified one. An account that penalizes complexity heavily will reject the detailed causal mechanism required for the Realist job. You cannot maximize causal detail and minimize parameters simultaneously.
  3.  **Closure vs. Truth-Conduciveness (Requirements 5 & 6):** A stopping rule (5) is pragmatic (time/budget). A warrant for truth (6) is epistemic. Stopping because it is Tuesday does not make the hypothesis likely true. Any account that claims the "Tuesday choice" is also the "Truth-worthy choice" is conflating resource limits with evidence.

  ***

  ### The Most Exclusionary Requirement

  The single requirement that does the most exclusionary work against the standard construals of IBE is **(1) Hypothesis-Generation Transparency**.

  *   **Bayesian Reading:** **Excluded.** Bayesianism treats the partition of hypothesis space as a given precondition. It updates probabilities *within* a palette but offers no machinery to evaluate how the palette was constructed or biased.
  *   **Explanatory-Coherence:** **Excluded.** Coherence theories (e.g., constraint satisfaction networks) operate on a fixed set of propositions. They maximize fit among existing nodes but cannot account for the bias introduced by which nodes were allowed into the network initially.
  *   **Causal-Mechanistic:** **Excluded.** While focused on mechanisms, this reading assumes the relevant mechanisms are available to be found. It lacks an account of how instrumental priors (like retrieval flags) structurally blind the inquirer to certain causal pathways before the search begins.
  *   **Error-Statistical:** **Excluded.** Error statistics focuses on severe testing of *specified* hypotheses. It explicitly brackets the question of how the hypothesis was generated, treating generation as a psychological or sociological matter outside the logic of inference.
  *   **Unificationist:** **Excluded.** Unificationism seeks to derive phenomena from a fixed set of general patterns. It assumes the "storehouse" of argument patterns is stable and does not account for the field-specific biases that determine which patterns are considered admissible candidates.

  **Why:** Every standard philosophical model of IBE assumes a "closed world" of rivals. By demanding an account of *how the rivals got there*, you rule out every formal system that treats the hypothesis set as a logical precondition rather than an empirical variable subject to bias. This forces the account out of philosophy and into the sociology and metrology of scientific practice.
