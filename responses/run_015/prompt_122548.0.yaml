answer: |-
  **The Bottom Line**
  Do not write "innate," "hardwired," or "in the genes" unless you can specify exactly what knowledge the learner ends up with that the input they received allegedly could not explain.

  ***

  ### The 10-Minute Decision Procedure

  **Step 1: Identify the Poverty-of-the-Stimulus (POS) Gap**
  *   **Ask:** What specific thing does the learner know (e.g., "you can't flip the second verb in a question") that the study claims the input didn't teach them?
  *   **If the press release doesn't name the specific rule or pattern:** Stop. You cannot claim anything about innate structure.
  *   **If it does name it:** Write it down. This is your "Gap."

  **Step 2: Audit the Input (The "Where's the Work?" Test)**
  *   **For ML Papers:** Ask the author: "Did the model see *only* raw audio/text, or did it have paired data, visual context, or syntactic tags hidden in the preprocessing?" Ask: "Does the architecture itself force certain patterns (e.g., attention heads) that act like innate rules?"
  *   **For Child Studies:** Ask: "Is there evidence children *never* hear this pattern, or just that it's rare?" Ask: "Were children corrected when they got it wrong?"
  *   **Pass Condition:** You can verify the input lacked the specific evidence needed to learn the Gap *without* special machinery.

  **Step 3: Disentangle "Innate" (The Collapse Rule)**
  *   **Safe Collapses (You can treat these as synonymous for copy):**
      *   *Species-typical* + *Buffered against variation* (Humans do it everywhere; environment doesn't change it).
      *   *Present at birth* + *Not learned from post-natal experience* (If longitudinal data confirms no learning curve).
  *   **Dangerous Collapses (Never merge these without molecular evidence):**
      *   *Heritable* + *Specific Grammatical Rule* (Genes influence speed/memory, not necessarily "subjacency").
      *   *Learnable by ML* + *Not Hardwired in Humans* (Model success proves data sufficiency for *that model*, not necessity for *human brains*).
      *   *Universal* + *Innate Capacity* (A feature might be universal because it's useful, not because it's genetically mandated).
  *   **The Rule:** If the study shows **Heritability**, write "genetic factors influence." If the study shows **ML Success**, write "input contains sufficient signal." Do not write "Grammar is not hardwired."

  **Step 4: Fill the Blanks**
  *   Complete this sentence: "The study claims [Trait X] is innate relative to [Input Y] given [Starting Machinery Z]."
  *   **If you cannot fill [Input Y] or [Starting Machinery Z]:** Drop the word "innate." Use "emerges early" or "requires specific data."
  *   **Defensible Line:** If challenged, your defense is: "The study demonstrates sufficiency of the input for this model, not the necessity of innate structures for humans."

  **Step 5: The Stop Signal**
  *   **HAND OFF TO EXPERT IF:**
      *   The author says "It's likely a mix" but won't quantify.
      *   The claim relies on a single language lacking a feature (typology requires broad sampling).
      *   The claim relies on heritability > 0.5 to imply specific rules are encoded.
      *   **Output:** Write "The findings challenge the view that..." instead of "The findings prove..."

  ***

  ### Worked Applications

  **1. The Zurich ML Model (40M words + nursery audio)**
  *   **Your Draft:** "Grammar isn't hardwired after all."
  *   **Step 1 (Gap):** Forming yes/no questions correctly.
  *   **Step 2 (Input):** 40M words is far more than a child hears in the critical period. Nursery audio adds prosody/context children might not parse the same way. The neural net architecture (Transformer) has built-in inductive biases (attention) that act as "soft" innate rules.
  *   **Step 3 (Collapse):** You are collapsing *ML Learnability* with *Human Necessity*. This is a Dangerous Collapse. The model proves the data *can* support the learning, not that humans don't use innate shortcuts to do it faster/with less data.
  *   **Step 4 (Blanks):** Innate relative to *child-directed speech*? The model used *more* than that.
  *   **Verdict:** **STOP. You cannot write the sentence you want to write.**
  *   **Replacement:** "Computational models suggest the input contains enough signal to learn question formation without pre-loaded grammatical rules."
  *   **Defensible Line:** "The study demonstrates data sufficiency for this architecture, not that human brains lack innate biases."

  **2. The Twin Study (Heritability 0.6)**
  *   **Your Draft:** "Grammar is in the genes."
  *   **Step 1 (Gap):** Comprehension battery scores at age seven.
  *   **Step 2 (Input):** Controlled for shared environment (twins).
  *   **Step 3 (Collapse):** You are collapsing *Heritability of Trait* with *Genetic Encoding of Rules*. This is a Dangerous Collapse. High heritability means variation is genetic, not that the mechanism is. It could be heritable auditory processing or working memory.
  *   **Step 4 (Blanks):** Innate relative to *environment*? Yes. Given *which machinery*? Unknown.
  *   **Verdict:** **Modify.** You can claim genetic influence, not specific grammar encoding.
  *   **Replacement:** "Genetic differences explain the majority of variation in grammatical ability."
  *   **Defensible Line:** "Heritability measures variation in performance, not the genetic encoding of specific linguistic rules."

  **3. The Amazonian Field Report (No recursion)**
  *   **Your Draft:** (Implied) "Recursion isn't innate."
  *   **Step 1 (Gap):** Use of embedded relative clauses.
  *   **Step 2 (Input):** Naturalistic speech in this community.
  *   **Step 3 (Collapse):** You are collapsing *Universal Feature* with *Innate Capacity*. If one language lacks it, it's not universal. But the *capacity* might still be innate (just unused).
  *   **Step 4 (Blanks):** Innate relative to *human capacity*? Hard to say.
  *   **Verdict:** **Modify.** You can challenge universality, not capacity.
  *   **Replacement:** "Evidence suggests recursion is not a mandatory feature of all human languages."
  *   **Defensible Line:** "The existence of a language without recursion falsifies the claim that recursion is universally required, though the capacity may remain."

  ***

  ### Where This Procedure Misfires

  1.  **The "Soft Innateness" Trap:** Modern linguistics often argues for "weak priors" rather than "hard rules." This procedure forces a binary (Innate vs. Learned) because your word count demands it. You will occasionally oversimplify a probabilistic bias into a yes/no claim.
  2.  **The Black Box Model:** In Scenario 1, we assume we know what the ML model "knows." Often, we don't. If the model is opaque, Step 2 fails, but you still have to file. In these cases, default to "Models can mimic this behavior" rather than "Models learn this."
  3.  **The Heritability Ceiling:** In Scenario 2, if heritability is 0.9, the procedure still stops you from saying "Grammar is in the genes." This is scientifically correct but may feel like under-reporting a strong finding. Stand firm: heritability is never specificity.
  4.  **Deadline Pressure:** If you cannot reach the author for Step 2 (Input Audit), you must assume the input was *richer* than claimed. Default to "Study suggests..." rather than "Study proves..." If the press release claims "No innate grammar needed" without detailing the input comparison, treat it as hype and write "Researchers claim no innate grammar needed."
