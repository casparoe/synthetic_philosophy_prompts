answer: |-
  Here is the stress-test of Lewis's theory against the Christmas Truce, broken down into the Lewisian mapping and the structural failures.

  ### Part 1: The Lewisian Mapping

  To run this properly, we have to force the Christmas Truce into Lewis's specific definition of a convention: a regularity in behavior in a recurrent situation, sustained by mutual expectations and preferences aligned on coordination.

  **The Population and Agents**
  Lewis quantifies over a population $P$. You have to decide who counts as a member. If $P$ is "all soldiers on the Western Front," the truce fails the regularity condition immediately because it was patchy. If $P$ is "all human beings," it's too broad.
  For Lewis to get any grip, the population must be defined locally: **the set of opposing infantry units holding adjacent sectors of the trench line.**
  The agents are technically individual soldiers, but in trench warfare, individual agency is constrained by unit cohesion. A single soldier sticking his head up risks getting shot by his own mates if the unit hasn't agreed to the truce. So, while Lewis requires individual agents, the effective agents here function as **small unit collectives (sections or platoons)**. This creates a tension in the model: Lewis's theory is methodologically individualist, but the empirical reality requires group agency to explain the uniformity of action within a sector.

  **The Strategy Set and Payoff Structure**
  The situation $S$ is static trench warfare in December 1914. The available strategies are:
  1.  **War:** Shoot to kill on sight.
  2.  **Harass:** Routine fire at fixed times/places (live-and-let-live).
  3.  **Truce:** Cease fire, show heads/hands, enter no man's land.
  4.  **Defect:** Accept the enemy's truce offer but shoot them (free riding).

  You asked if this is a coordination problem in Lewis's sense. Strictly speaking, **no.**
  In a pure Lewisian coordination problem (like driving on the left vs. right), preferences are fully aligned. I prefer to drive on the left *if* you do, and you prefer to drive on the left *if* I do. There is no temptation to defect.
  In the truce, there is a live temptation to defect. If you come out unarmed, I strictly prefer to shoot you (tactical advantage, zero risk) than to come out unarmed myself (risk of you shooting me). This makes it a **Prisoner's Dilemma** or a **Chicken** game, not a Coordination game.
  However, for Lewis's theory to apply, we have to assume the payoff structure shifted temporarily. In static warfare, the risk of retaliation is high. If I shoot you during a truce, your neighbors will shoot me immediately. So, the payoff for "Defect" drops below the payoff for "Truce" *given* that the enemy is armed and watching. If we accept this modification—that the shadow of future retaliation aligns preferences temporarily—then it becomes a coordination equilibrium: Both prefer (Truce, Truce) over (War, War), and both prefer (Truce, Truce) over (Defect, Truce) because Defect triggers immediate punishment.

  **Focal Points and Common Knowledge**
  Lewis relies on salience to solve the coordination problem without communication.
  *   **The Focal Point:** Christmas Day. This is the strongest salient feature. It distinguishes this day from every other day in the recurrent situation.
  *   **Common Knowledge:** Lewis requires that everyone knows $X$, everyone knows that everyone knows $X$, etc. In the trenches, this was achieved through **auditory and visual signals**. Singing carols, putting lights on trees, or simply the absence of fire became signals. Once one sector went silent, the neighbors heard it. The silence itself became common knowledge.
  *   **Precedent:** You asked if one day makes the next salient. In Lewis's theory, precedent is the primary engine of convention. Here, precedent worked horizontally rather than vertically. One sector's truce made the neighboring sector's truce more likely (spread), but because the High Command intervened, there was no vertical precedent (it did not become a yearly habit). Lewis's theory handles the horizontal spread well (salience cascades), but it assumes the population remains stable.

  **Verdict on the Fit**
  If you squint at the payoff structure to eliminate the temptation to defect, the truce fits Lewis's model of a convention arising from salience (Christmas) and precedent (previous burial truces). It is a regularity sustained by mutual expectations ("I won't shoot because I expect you won't").

  ### Part 2: Where the Mapping Fails

  This is the critical part for your chapter. The Christmas Truce exposes three structural weaknesses in Lewis's framework when applied to informal norms in war.

  **1. Soft Convention vs. Hard Norm**
  Lewis distinguishes conventions from norms by the absence of normative pressure. In a convention, I follow the rule because I expect you to, not because I think I *ought* to. In a norm, I expect you to sanction me (resentment, punishment) if I deviate.
  The Christmas Truce was not a soft convention. It had a **hard normative layer**.
  Soldiers didn't just expect the enemy not to shoot; they expected that shooting an unarmed man during a truce was *shameful*. There are accounts of anger when shots were fired accidentally. This suggests the equilibrium was not held up solely by self-interest (Lewis), but by a shared moral understanding that transcended national lines (Norms).
  **Theoretical Impact:** Lewis's theory cannot account for this. It builds conventions out of self-policing equilibria based on preferences. It has no machinery for "oughtness" or moral sanction. If the truce required the hard layer to survive the temptation to defect, then calling it a Lewisian convention is category error. It is a **normative institution**, not a convention.

  **2. The Third-Party Intervention (Hierarchy)**
  Lewis's framework is decentralized. It explains order emerging from the bottom up without a sovereign. It assumes the payoff structure is fixed by the physical and social environment.
  The Christmas Truce was killed from above. The High Commands changed the payoffs by introducing **disciplinary sanctions** (court-martial, unit rotation) that outweighed the benefits of the truce.
  **Theoretical Impact:** Lewis's theory is **silent** on hierarchical suppression. It has no variable for an external principal changing the game. In Lewis's world, conventions die when preferences change or population turnover breaks the common knowledge. They do not die because a general issues an order. This is a major blind spot for IR. If you are studying norms in war, you are studying a environment where a hierarchy always exists with the power to rewrite payoffs. Lewis cannot model the interaction between informal convention and formal authority.

  **3. The Three Clocks**
  Here is how the case scores against your metrics, and what it implies for the theory:

  *   **Speed of Arising:** **Fast.** It happened almost overnight. Lewis allows for fast convergence if salience is high (Christmas), but usually implies a gradual buildup of precedent. The speed here suggests that deep shared culture (Christianity, soldiering ethos) can substitute for precedent. Lewis underestimates the power of shared culture to create instant common knowledge.
  *   **Width of Spread:** **Patchy/Local.** It did not become a universal regularity across the population (the whole front). Lewis's definition requires the regularity to be common knowledge across the population. Because it was sector-specific, it was actually a **set of local conventions**, not one grand convention. This challenges Lewis's assumption that conventions tend to homogenize across a population. In war, norms can be hyper-localized due to unit autonomy.
  *   **Ease of Hierarchical Killing:** **High.** It was suppressed relatively easily by rotating units and issuing orders. Lewis conventions are usually robust to cheap talk but vulnerable to payoff changes. The hierarchy successfully changed the payoffs. This shows that informal conventions in war are **fragile** when they conflict with formal objectives. Lewis's theory offers no prediction on this fragility because it doesn't model the hierarchy.

  **Contested History Flag**
  One step in the analysis depends on the **football match**. If the football happened, it signals a higher level of coordination and trust (complex joint activity). If it didn't, and it was just talking and burying dead, the coordination requirement is lower. I have treated it as non-essential per your instructions, but be aware that if your argument relies on the *depth* of cooperation, the contested nature of the football matters. If it did happen, the "temptation to defect" was even higher (standing still in a group), making the normative enforcement even more critical.

  **Final Verdict**
  The Christmas Truce is an **unanticipated case** for Lewis.
  It is a convention between adversaries, which Lewis's theory does not anticipate because it assumes a population with broadly aligned interests regarding the coordination problem. Enemies do not have aligned interests.
  To make Lewis work, you have to import external concepts: normative sanctions (to stop defection) and hierarchical power (to explain its death).
  For your chapter, this suggests that Lewis provides the vocabulary for the *mechanism* of spread (salience, common knowledge), but fails to explain the *substance* (why cooperate with an enemy?) or the *durability* (why did it end?). You should classify this not as a Lewisian convention, but as a **normative truce** that used conventional signals. It confirms that informal norms can arise in war, but it anomalies the theory that tries to explain them without reference to morality or hierarchy.

  **Where the Theory is Silent**
  Lewis is silent on how conventions interact with formal rules that contradict them. He assumes the convention *is* the rule. In your case, the convention existed in direct violation of the formal rule. Lewis has no way to model the competition between the informal equilibrium and the formal order. You will have to build that machinery yourself.
