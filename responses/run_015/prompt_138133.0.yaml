      *   **Verdict:** It's an unanticipated case. Lewis assumes a population with broadly aligned interests regarding the coordination problem. Enemies do not have aligned interests. This is a "convention between adversaries," which requires a modification of Lewis to include normative enforcement (hard norms) to suppress the temptation to defect.

