      *   **Third-Party Intervention (High Command):** Lewis conventions are self-policing equilibria within a population. They don't have a mechanism for an external principal changing the payoff structure via coercion. The High Command changed the game from a coordination/cooperation hybrid back to a strict PD or added a massive cost to the Truce equilibrium. Lewis's theory is silent on hierarchical suppression of conventions.
