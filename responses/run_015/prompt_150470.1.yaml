  I'm in my metaphysics of mind seminer and we just covered Dennett's idea that the self is basically a centre of narrative gravity, not some little soul-thing inside the head. For an assignment I need to cook up a thought experiment that forces Dennett's view and a more embodied, biological view — like, the self just is the living organism — to actually disagree, rather than talking past each other.

