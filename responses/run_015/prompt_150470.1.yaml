  **The Thought Experiment: The Case of Arthur**

  Consider a patient, Arthur, treated in a London psychiatric unit for a severe dissociative condition wherein two distinct persona-states, 'Arthur-Prime' and 'Arthur-Shadow', report unbroken, continuous subjective timelines despite alternating control of the body's motor functions every few hours. Clinical interviews reveal that Arthur-Prime maintains a narrative commitment to a pending marriage and a career in finance, whilst Arthur-Shadow holds a steadfast vow of monastic poverty and solitude; crucially, when the body acts, the interpretation of the action is dictated not by immediate neural firing patterns alone, but by 'narrative inertia'—the gravitational pull of these past commitments which forces the current controller to interpret ambiguous stimuli (such as receiving a paycheck) as either a rightful earning or a sinful accumulation, a distinction that persists even when neuroimaging shows identical physiological arousal states for both personas, suggesting the interpretive framework exists over and above the biological hardware.

  **Theoretical Breakdown**

  On the embodied, biological view, there is unequivocally only one self here: the living organism, Arthur. The two narrative streams are merely functional modes or states of this single biological system, akin to a computer running different software programmes on the same hardware. The organism persists through time, and the dissociation is simply a fragmentation of its internal processing, not a multiplication of selves. Conversely, pushing Dennett's 'Centre of Narrative Gravity' view to its limit suggests there are two selves. If the self is constituted by the abstract point around which the narrative coalesces, then two distinct, continuous narratives with incompatible commitments constitute two distinct centres of gravity. However, this view gets stuck on ownership: if the self is the narrative centre, neither 'Arthur-Prime' nor 'Arthur-Shadow' fully owns the body, as the body is the shared vehicle for two competing gravitational pulls. Dennett's framework struggles to locate moral responsibility because the 'self' is too diffuse to pin the blame or praise on a single entity when the biological substrate remains constant.

  **The Philosophical Work of Narrative Inertia**

  The exact feature doing the philosophical work in this scenario is 'narrative inertia'. This concept posits that past story commitments exert a causal force on present interpretation that is not reducible to immediate brain states. It forces the disagreement because it grants the narrative ontological weight; the story is not just a description of what the brain is doing, but a constraint on how experience is constituted. If you take away the narrative inertia element, the scenario collapses into a standard case of dissociative identity disorder explainable entirely by neurobiology. Without inertia, the differing interpretations of the paycheck are merely the result of different neural pathways being activated. The biological view would swallow the phenomenon whole, arguing that the 'narrative' is simply an epiphenomenal report of the underlying physiological state. The tension vanishes because there is no longer a 'pull' independent of the machinery.

  **The Biological Counter-Attack**

  A defender of the biological view would attack this scenario by challenging the coherence of 'two continuous streams' within a single brain without physical separation. They would argue that 'narrative inertia' is a category mistake—a reification of a metaphor. There is no gravitational pull existing over and above the synaptic weights and hormonal states of the organism. They would contend that positing two selves creates an unnecessary metaphysical multiplication; Occam's Razor dictates we should not multiply entities beyond necessity. Since the body is the locus of action and biological continuity, any claim of 'two selves' is merely a useful fiction for therapy, not a metaphysical reality. They would insist that Arthur is one person suffering from a fragmented memory system, and that treating the narratives as distinct selves obscures the medical reality of the one organism requiring integration.
