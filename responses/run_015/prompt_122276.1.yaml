      *   *Margalit's Problem:* If memory is reconstructed (as the film shows with the degrading memories), is the "duty to remember" a duty to remember *truth* or a duty to remember *meaning*?
      *   *The Film's Answer:* The film suggests the duty is to the *affect* and the *pattern*, not the factual accuracy. The "truth" of the relationship isn't in the neural data (archive) but in the emotional resonance (narrative).

