answer: |-
  You have identified a genuine and persistent gap in moral philosophy, specifically within the ethics of collective action. Your observation is sharp: you have noticed that the intuitive force of "difference-making" arguments fluctuates inversely with the certainty of the outcome, and that defenders of moral obligation often switch justificatory frameworks without acknowledging the transition.

  To answer your primary question directly: there is no single, established lexical item in philosophy that captures the *entire* pattern you have described. However, the components of your observation map onto several well-defined debates. For the purpose of your reading group, I will distinguish the established concepts from the specific phenomenon you have isolated, and I will offer you a precise term to label the pattern you have found.

  ### 1. The Established Neighborhood

  Your examples fall under the broader heading of **The Problem of Collective Harm** (or **Collective Action Problems**). Within this field, your specific puzzle touches on three established concepts:

  *   **Causal Inefficacy:** This is the argument that an individual act (dropping a crisp packet, casting a vote) makes no causal difference to the outcome. This is the standard "futility" objection.
  *   **Overdetermination:** This describes the state of the "settled" cases you mention. The park is already dirty; the mince is already ordered. The harm is *overdetermined* because there are more than enough causes to produce the effect without your specific contribution.
  *   **Complicity:** This is the second line of defense you noticed. When causal impact vanishes, philosophers often shift to arguments about **moral complicity** (being tainted by participation) or **expressive value** (what the act says about your character).

  ### 2. Is It One Phenomenon or Two?

  You asked whether the varying strength of the inefficacy argument and the unacknowledged switch to complicity are one thing or two. They are **two distinct normative mechanisms** triggered by the same **epistemic condition**.

  1.  **The First Phenomenon (The Causal Intuition):** This is a feature of **Consequentialist** reasoning. In standard expected utility theory, the value of an act is the probability of being pivotal multiplied by the value of the outcome. Your observation is that human intuition does not follow this math linearly. Instead, intuition treats "settledness" as a dampener on responsibility.
  2.  **The Second Phenomenon (The Argumentative Switch):** This is a feature of **Meta-Ethical Defense**. When the Consequentialist mechanism (Phenomenon 1) yields a counter-intuitive result (i.e., "it's okay to drop the crisp because the park is already dirty"), the defender instinctively reaches for a Non-Consequentialist mechanism (Complicity/Virtue) to preserve the obligation.

  While they are distinct, they function as a single system of moral reasoning. The failure of the first necessitates the second.

  ### 3. Distinguishing from Nearby Ideas

  To help your reading group place this, here is how your observation differs from the "familiar nearby ideas" you listed:

  *   **Vs. The Sorites Paradox:** The Sorites Paradox concerns vagueness (when does a heap become a non-heap?). Your case is not about vagueness; it is about **thresholds**. You acknowledge that a threshold exists (the park *is* dirty, the order *is* placed). The puzzle is not about where the line is, but about why moral responsibility seems to evaporate once that line is crossed.
  *   **Vs. The Tragedy of the Commons:** The Tragedy of the Commons explains *why* individuals defect (rational self-interest leads to collective ruin). It does not address the *retrospective* moral evaluation of the act once the ruin is assured. Your puzzle is about the *normative weight* of the act in an already-ruined scenario.
  *   **Vs. Standard Causal Inefficacy:** Standard ineffacy arguments simply state, "You make no difference." Your insight is more granular: you note that the *persuasiveness* of this argument scales with the **degree of overdetermination**. It is not just binary (pivotal vs. not pivotal); it feels *more* futile in a safe seat than in a swing state, even if the probability of being pivotal is near-zero in both.

  ### 4. The Brother-in-Law's Objection

  Your brother-in-law is relying on **Expected Utility Theory**. He argues that because you cannot *know* the threshold is fixed, you must assign a non-zero probability to being pivotal.

  Your counter-intuition regarding "fixed threshold" vs. "genuinely chancy" maps onto a distinction in decision theory between **Risk** (known probabilities) and **Uncertainty** (unknown probabilities), but more specifically, it touches on **Objective vs. Subjective Obligation**.
  *   **Subjective Obligation:** What you should do given what you *believe* (your brother-in-law's view: you don't know for sure, so vote).
  *   **Objective Obligation:** What you should do given the *facts* (your view: if the seat is objectively safe, the vote objectively changes nothing).

  Your frustration stems from the fact that moral intuition often tracks *Objective* settledness (the harm is done) even when we are forced to act under *Subjective* uncertainty.

  ### 5. A Proposed Label and Definition

  Since there is no single established term for the specific *pattern* you have described—the inverse relationship between outcome settledness and perceived causal obligation, coupled with the silent switch to complicity—I recommend coining a term for your reading group. This will allow you to discuss the phenomenon precisely without conflating it with general inefficacy.

  I propose the term: **The Overdetermination Gradient.**

  **Definition:**
  > **The Overdetermination Gradient** is the phenomenon wherein the perceived moral obligation to perform a collective-action act decreases as the certainty of the collective outcome increases, even when the total magnitude of the harm remains constant or increases.
  >
  > This phenomenon is typically accompanied by **The Complicity Pivot**: the unacknowledged rhetorical shift from consequentialist reasoning (making a difference) to non-consequentialist reasoning (avoiding complicity) precisely at the point where the Overdetermination Gradient renders the former untenable.

  **Criteria for Instances:**
  *   **Counts as an instance:** A situation where an agent feels less reason to prevent harm because "it's going to happen anyway" (e.g., voting in a safe seat, taking meat when the order is placed), *and* where defenders of the obligation switch to arguments about "clean hands" or "solidarity" when the "making a difference" argument is challenged.
  *   **Does not count:** A situation where the act genuinely has no causal connection to the harm (e.g., dropping litter in a park vs. a murder happening in a different city). The act must be a *potential* part of the collective cause, merely rendered redundant by the sufficiency of other causes.

  ### 6. Summary for Your Notes

  For your reading group in the States, you might summarize the situation this way:

  1.  **The Core Problem:** We are dealing with **Individual Inefficacy in Overdetermined Contexts**.
  2.  **The Specific Insight:** Moral intuition follows an **Overdetermination Gradient**: responsibility feels weaker when the outcome is settled, even if the harm is greater.
  3.  **The Structural Flaw:** Defenders of obligation often engage in a **Complicity Pivot**, switching from consequentialist to non-consequentialist arguments without marking the transition.
  4.  **The Philosophical Stakes:** This reveals a tension between **Objective Obligation** (what the facts dictate) and **Subjective Obligation** (what our uncertainty dictates). Your brother-in-law argues from uncertainty; you are arguing from the metaphysics of the settled outcome.

  You have correctly identified that standard Consequentialism struggles to explain why we feel less obligated in overdetermined cases, while standard Deontology struggles to explain why we feel *any* obligation when we make no difference. Your description of the "switch" is perhaps the most valuable part of your observation: it highlights a discontinuity in our moral reasoning that philosophers are still working to resolve.
