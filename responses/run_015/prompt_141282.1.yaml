answer: |-
  You have identified a structural flaw in the arithmetic of these arguments that is well-recognised in philosophy, economics, and environmental science, though it lacks a single, catchy noun like "gravity." Because you come from a quantity surveying background, you will recognise this immediately as a failure to define the **Measured Work** before pricing the Variation.

  Here is the breakdown of the concepts, the terminology, and the distinctions you asked for.

  ### 1. The Baseline Issue: *Baseline Relativity*

  The phenomenon you describe in your first example—a consideration whose moral "sign" (positive or negative) flips depending on an unstated counterfactual—is most precisely called **Baseline Relativity** (or **Counterfactual Dependence**).

  In welfare economics and climate ethics, this is often discussed under the header of **Additionality**. A claim of harm or benefit is only valid if it is *additional* to what would have occurred in the baseline scenario. If your brother-in-law claims his cattle farming "supports" wild voles, he is asserting a positive impact. But that impact is only real if the counterfactual (scrub, woodland, housing) would have supported *fewer* voles. If the counterfactual supports more, his farming is actively harmful.

  *   **The Established Name:** There is no single noun for the *consideration* itself, but the structural problem is the **Baseline Problem** (common in offsetting and development ethics). The specific logical structure is a **Counterfactual Comparative Account of Harm**.
  *   **The Rhetorical Move:** Presenting a baseline-relative claim as a plain empirical finding is a form of **Reification** (treating an assumption as a concrete fact). More specifically, it is **Concealing the Reference Point**. In argumentation theory, this is sometimes called **Suppressing the Premise** (making an enthymeme where the crucial premise—the baseline—is hidden).
  *   **QS Analogy:** It is like submitting a claim for extra costs due to "unforeseen ground conditions" without first agreeing on what the "foreseen" baseline specification was. The cost isn't a fact; it's a function of the specification.

  ### 2. The Unit Issue: *Functional Unit Sensitivity*

  The second example, where the ethical ranking shuffles depending on whether you measure per kilo, per calorie, or per hectare, is a distinct phenomenon, though it produces the same confusion.

  In Life Cycle Assessment (LCA)—the industrial standard for measuring environmental impact—this is formally defined as the choice of **Functional Unit**. ISO 14040 defines the functional unit as the "quantified performance of a product system for use as a reference unit."

  *   **The Established Name:** **Functional Unit Sensitivity** or **Metric Dependence**.
  *   **The Ethical Implication:** In philosophy, this is often discussed as **Metric Normativity**. The choice of unit is not neutral; it encodes a value judgment. Choosing "per calorie" assumes the goal is sustenance efficiency. Choosing "per hectare" assumes the goal is land conservation. Choosing "per individual death" assumes a deontological focus on agency.
  *   **Is it the same phenomenon?** No. The baseline issue is **ontological** (it concerns what *exists* in the counterfactual world). The unit issue is **methodological** (it concerns how we *scale* the existing world). However, both result in **Indeterminacy**: the argument cannot yield a stable result because the parameters are underspecified.

  ### 3. Distinctions: Uncertainty, Incommensurability, and Bad Faith

  You asked how this differs from other forms of ambiguity.

  *   **Vs. Empirical Uncertainty:** Empirical uncertainty means we don't know the number (e.g., "How many voles are in this field?"). Baseline Relativity means the *variable itself* is undefined (e.g., "Are we counting voles against a baseline of woodland or concrete?"). You could have perfect data and still have the problem.
  *   **Vs. Incommensurability:** Incommensurability means two values cannot be weighed against each other (e.g., "Is a vole's life worth a human's convenience?"). Your problem is sharper: it is that the *same* value (vole deaths) flips from asset to liability depending on the setup. This is **Instability**, not incommensurability.
  *   **Vs. Bad Faith:** The structural problem (Baseline Relativity) exists regardless of intent. One can innocently assume a baseline (e.g., "obviously the land would be empty without us"). However, strategically selecting a baseline to guarantee a desired conclusion is **Motivated Reasoning** or **Parameter Shopping**. When done rhetorically to deceive, it is **Sophistry** via **Suppressed Premises**.

  ### 4. A Proposed Definition

  Since you requested a term with a definition if nothing established fits perfectly, and given that "Baseline Relativity" describes the state but not the rhetorical sin, I propose the following term for your arguments:

  **Term:** **Specification Indeterminacy**

  **Definition:** A logical state in which a moral or empirical claim appears to be a fixed value but is actually a variable dependent on unstated parameters (baselines or units).

  **Boundary Cases:**
  1.  **Valid Specification:** "Cattle farming causes X wild animal deaths *relative to a baseline of rewilded scrub* per *hectare per year*." (This is a QS-style Bill of Quantities; it is measurable and falsifiable).
  2.  **Specification Indeterminacy:** "Cattle farming causes wild animal deaths." (This lacks the variation order and the unit of measurement; it is rhetorically potent but mathematically void).
  3.  **Distinct Phenomenon (Empirical Uncertainty):** "Cattle farming causes an *unknown number* of wild animal deaths." (Here the specification is clear, but the data is missing).

  ### Summary for the Dinner Table

  You do not need to solve the ethics to dissolve the argument. As a QS, you know that you cannot price a job without a specification.

  When your brother-in-law or daughter introduces the "wild animal" tiebreaker, you can stop the argument by asking for the **Specification**:
  1.  **What is the Baseline?** (Are we comparing this pasture to woodland, scrub, or housing? The sign of the answer depends on this.)
  2.  **What is the Functional Unit?** (Are we minimising death per calorie, per hectare, or per animal?)

  If they cannot state these explicitly, they are not making an empirical claim; they are engaging in **Specification Indeterminacy**. They are arguing over the price of a Variation Order before agreeing on the Contract.
