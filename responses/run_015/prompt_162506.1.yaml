answer: |-
  This is a sophisticated and ambitious thesis. Moving the debate from the sociological critique of "victors' justice" to a technical legal analysis of *nullum crimen sine lege* is a productive intervention in the literature. Your distinction between **charge retroactivity** (the act was not criminal) and **liability retroactivity** (the actor was not personally liable) is analytically sharp and provides a strong framework for distinguishing the two tribunals.

  However, before you commit to this argument, there is a significant factual vulnerability in your current framing that a knowledgeable referee will exploit, along with some nuances regarding the "hypocrisy" objection that you may want to incorporate rather than dismiss.

  Here is a verdict on the soundness of your argument and strategies for fortifying it.

  ### 1. The Soundness of the Asymmetry Thesis

  **The Strengths:**
  *   **The Liability/Charge Distinction:** This is your strongest asset. Most critiques lump all retroactivity together. Arguing that Nuremberg only suffered from *liability* retroactivity (which is mitigated by the moral foreseeability of a head of state) while Tokyo suffered from *charge* retroactivity (the act itself was not proscribed) is a compelling legal distinction.
  *   **The Timeline:** Focusing on the 1931 Manchurian incident is legally astute. Even if aggressive war was becoming customary law by 1939 (Nuremberg's start date), it is much harder to argue it was crystallized customary law in 1931.

  **The Critical Vulnerability (The Kellogg-Briand Pact):**
  You state: *"Japan... was not a party to the instruments the prosecution relied on."*
  **This is factually incorrect and must be corrected.** Japan was a signatory to the General Treaty for the Renunciation of War (Kellogg-Briand Pact) of 1928, just as Germany was. The prosecution at Tokyo *did* rely on this pact.

  If you submit the paper with the claim that Japan was not bound by the Pact of Paris, a referee will reject the factual premise immediately. However, you can salvage the argument by refining *how* the Pact applied:

  *   **Refinement A: Crystallization of Custom.** You can argue that while Japan signed the Pact, the *criminalization* of its violation for *individuals* was not established custom in 1931. By 1939 (Nuremberg), following the League of Nations' condemnation of Japan in 1933 and the Italo-Ethiopian war, the norm had hardened. Thus, Nuremberg prosecuted conduct occurring *after* the norm crystallized; Tokyo prosecuted conduct occurring *before* it crystallized.
  *   **Refinement B: The Conspiracy Charge.** The Tokyo Tribunal relied much more heavily on a broad "conspiracy to wage aggressive war" charge that spanned 1928–1945. The Nuremberg conspiracy charge was narrower. You can argue that punishing a conspiracy starting in 1928 for a crime that did not exist as an individual offense until 1939 is the true *ex post facto* violation at Tokyo, distinct from Nuremberg.
  *   **Refinement C: Judge Röling's Dissent.** You should engage with the opinion of Judge Bert Röling (the Dutch judge at Tokyo). He argued exactly what you are arguing: that aggressive war was not a crime for individuals until the Charter made it so. He was more willing to accept this at Nuremberg (as a necessary political foundation) but viewed Tokyo as a step too far into retroactivity. Citing him validates your asymmetry thesis as a recognized legal position, not just a novel invention.

  ### 2. Handling the "Victors' Justice" Objection

  You are legally correct that *tu quoque* (you also did it) is generally not a defense in criminal law. The guilt of the accused does not depend on the innocence of the accuser. However, dismissing the objection entirely as "political" might strike a referee as naive regarding International Criminal Law (ICL) legitimacy.

  Here is how to handle it without conceding your legal ground:

  **A. Distinguish Jurisdiction from Legitimacy**
  Concede that the immunity of the Emperor and the Unit 731 deals are profound *legitimacy* defects, but argue they are not *jurisdictional* defects.
  *   **Argument:** "The legality of a tribunal's power to adjudicate a specific charge rests on the existence of a proscribing norm at the time of the act (*nullum crimen*). Selective prosecution or immunity grants affect the moral authority of the court, but they do not technically void the legal basis of the charges against the indicted defendants. A thief is still guilty of theft even if the police let other thieves go free."
  *   **Why this works:** It accepts the referee's premise (that these issues matter) but categorizes them outside the scope of your specific legal thesis (validity of the charge).

  **B. The Emperor and Command Responsibility**
  The immunity of the Emperor is a stronger legal objection than the Unit 731 deal.
  *   **The Objection:** If the Head of State is immune, does that undermine the legal theory that Heads of State are personally liable for aggression?
  *   **Your Reply:** The immunity was a political decision by SCAP (MacArthur), not a judicial finding by the Tribunal. The Tribunal's Charter gave it jurisdiction over the Emperor; the prosecution chose not to use it. This is prosecutorial discretion, not a legal bar. Therefore, it does not invalidate the legal principle established against the other defendants.

  **C. Unit 731 and Evidentiary Integrity**
  *   **The Objection:** Granting immunity for data implies the court was denied evidence of war crimes.
  *   **Your Reply:** This impacts the *fact-finding* mission regarding biological warfare, but your thesis concerns *Crimes Against Peace*. Unless the Unit 731 immunity somehow negated the evidence regarding the planning of aggressive war, it is orthogonal to your specific argument about the legality of the aggression counts.

  ### 3. Strategic Recommendations for the Paper

  1.  **Correct the Treaty Status:** Immediately amend the claim that Japan was not a party to the Pact of Paris. Instead, argue that the *interpretive leap* from "state responsibility" to "individual criminal liability" had not matured sufficiently by 1931 to satisfy *nullum crimen* for Japanese leaders, whereas by 1939 it had for German leaders.
  2.  **Lean on the "Conspiracy" Count:** The Tokyo Judgment's reliance on a continuous conspiracy starting in 1928 is the weakest legal link. Nuremberg's conspiracy count was limited to the planning of wars that actually occurred in the late 30s. This supports your "degree vs. kind" argument.
  3.  **Reframe the Referee's Objection:** Do not dismiss the "hypocrisy" argument as merely sociological. Acknowledge it as a challenge to *procedural fairness*, but maintain that procedural unfairness (selective prosecution) is distinct from *substantive illegality* (ex post facto laws). Your thesis is about substantive legality.
  4.  **Cite the Dissents:** The Tokyo Tribunal had a much more fractured bench than Nuremberg. Justice Pal (India) argued the tribunal was wholly illegitimate; Justice Röling (Netherlands) argued aggression was not a crime. Use Röling specifically to support your "asymmetry" claim—he accepted Nuremberg's legal innovation but rejected Tokyo's extension of it.

  ### Verdict
  Your thesis is **sound and defensible**, provided you correct the factual error regarding Japan's treaty obligations. The distinction between charge and liability retroactivity is a robust legal tool that allows you to bypass the "victors' justice" cliché.

  If you frame the "hypocrisy" objections as issues of *legitimacy* rather than *jurisdiction*, you can acknowledge them without letting them undermine your core legal argument. This approach demonstrates to the referee that you understand the political context but are choosing to analyze the strict legal validity, which is a permissible and valuable scholarly choice.
