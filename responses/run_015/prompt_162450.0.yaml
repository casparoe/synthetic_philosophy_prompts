      *   *Mechanism 1: Authorship.* Victors physically write the narratives.
      *   *Mechanism 2: Preservation/Archival Power.* Victors decide what gets saved.
      *   *Mechanism 3: Institutional Framing.* Victors set up the museums/schools that teach the history.
