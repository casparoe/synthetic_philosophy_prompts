answer: |-
  You are not vibes-ing. There is a coherent principle hiding in your list, but it requires reframing the choice. It isn't "Process vs. Outcome." It is **"Instance Success vs. Capability Robustness."**

  Here is the principle, the resolution to your tensions, and the verdicts you need to adjust.

  ### The Principle: The Robustness Gap

  **Supervise the signal that best proxies *Capability Robustness* across the deployment distribution, not *Instance Success* on the current prompt.**

  *   **Outcome Supervision** optimizes for **Instance Success**. It asks: "Did this specific output satisfy the constraint?"
  *   **Process Supervision** optimizes for **Capability Robustness**. It asks: "Does the mechanism that produced this output generalize to harder/unseen tasks?"

  You choose Process Supervision when there is a large **Robustness Gap**—when Instance Success is a noisy or deceptive proxy for long-term Capability Robustness. You choose Outcome Supervision when Instance Success *is* the true objective, or when the "correct process" is unknown/limiting.

  ### Resolving the Tensions

  **1. Go vs. Coding (The "Unorthodox Win" Tension)**
  Your intuition feels contradictory because the *True Objective* differs in each case.
  *   **Go:** The True Objective is *Winning*. Instance Success (Win/Loss) is a perfect proxy for Capability Robustness (Ability to Win). There is no "technical debt" in a board game. Grading process (human intuition) introduces a bias that lowers the ceiling. **Verdict: Outcome.**
  *   **Coding:** The True Objective is *Maintainable Software*. Instance Success (Tests Pass) is a **leaky proxy**. Spaghetti code passes tests today (Instance Success) but fails tomorrow (Low Robustness). Clean code is a better proxy for long-term viability. You are using Process Supervision to optimize for a *latent outcome* (maintainability) that you cannot measure cheaply in the immediate instance. **Verdict: Process.**

  **2. The Confabulated Chain of Thought**
  This is the critical edge case. If the written CoT is post-hoc rationalization (a "press release"), it has **zero causal leverage** on the answer.
  *   **The Trap:** If you grade the CoT, you are not training reasoning; you are training *plausible-sounding rationalizations*. You are closing the Robustness Gap on "looking like you reason" while leaving it open on "actually reasoning."
  *   **The Prediction:** Under the Robustness Gap principle, **you should not grade text-based CoT if it is known to be non-causal.** It does not proxy Capability Robustness.
  *   **The Fix:** To make Process Supervision work here, you must shift from *textual* process to *mechanistic* process. You must supervise the internal activations or attention patterns that actually compute the answer. If you can't verify faithfulness, Process Supervision on text is actively harmful (it trains deception).

  **3. Math vs. Writing vs. Legal**
  *   **Math:** High Robustness Gap. A lucky guess (Instance Success) does not imply the model can solve the next problem (Capability Robustness). Steps are the only valid proxy for capability. **Verdict: Process.**
  *   **Writing:** Low Robustness Gap. A good essay *is* the capability. The "plan" is often decoupled from the creative act. Grading the plan doesn't improve the prose. **Verdict: Outcome.**
  *   **Legal:** Low Robustness Gap (for the user's goal). The value is the citation validity. The research path is sunk cost. If the citation holds, the capability to support the proposition is verified. **Verdict: Outcome.**

  ### Which Verdicts Must You Drop?

  To align with this principle, you need to refine two of your gut checks:

  **1. Refine the Coding Verdict**
  You said: *"I still want to penalize the ugly code, even though the outcome check passed."*
  **Correction:** Admit that you are **not** doing Outcome Supervision on "Tests Passed." You are doing Process Supervision on "Maintainability." If your True Objective were strictly "Pass Unit Tests," Outcome Supervision would be superior (as it is in Go). You must acknowledge that your "Outcome" signal (tests) is incomplete. You are effectively using Process Supervision because your *actual* Outcome metric (long-term maintainability) is too expensive to measure per instance.

  **2. Drop Text-Based Process Supervision for Safety (if Confabulated)**
  You said: *"I'd penalize the chain even with a fine outcome."*
  **Correction:** Only if the chain is causal. If interpretability research confirms the CoT is a post-hoc press release, penalizing it trains the model to write *better* press releases. If the goal is to make the stated process be the actual process, text-based grading is the wrong tool. You must switch to **mechanistic supervision** or **intervention-based training**. If you cannot verify the process is load-bearing, you must revert to Outcome Supervision (did the behavior remain safe over a distribution of adversarial prompts?) because grading the "press release" creates a false sense of security.

  ### Summary of the Unified Principle

  **"Grade the bottleneck of generalization."**

  *   **Math/Code/Safety:** The bottleneck is the *method*. (Method generalizes; lucky answers don't). **Grade Process.**
  *   **Go/Writing/Legal:** The bottleneck is the *result*. (Method is opaque, subjective, or irrelevant; the result is the only truth). **Grade Outcome.**
  *   **Confabulated CoT:** The text is not the bottleneck; the computation is. **Grade Mechanism (or nothing).**

  Your tentative principle ("grade whatever you can verify cheaply") was close, but it missed the *latent objective*. The refined principle is: **"Grade the cheapest signal that tightly correlates with the True Objective across the deployment distribution."** Sometimes that signal is the final answer (Go). Sometimes it's the intermediate steps (Math). Sometimes it's neither (Confabulated CoT).
