answer: |-
  In a high-pressure hospital ward, nurses Alex and Blake each receive two requests from a distressed colleague, Jordan, to "help fix the charts," a nominal description coding identically for external observers. In the first instance, Jordan is overwhelmed by admission paperwork due to a system glitch; in the second, Jordan has misrecorded a dosage and needs the log altered to avoid blame. Alex helps ungrudgingly in both cases, motivated by genuine empathy for Jordan's stress and a stable disposition to relieve colleague distress, showing no signs of servility or anxiety. Blake helps in the first case but refuses in the second, citing patient safety protocols while offering emotional support. A third situation arises where Jordan asks to bypass a redundant safety check to speed up care during a surge; virtue theory predicts Blake will refuse the bypass but assist with the workload, whereas the consistency metric, tracking only the binary output of "helping behavior" across the initial pair, predicts Alex will help and Blake will behave inconsistently again.

  **Verdicts and Features**
  The consistency criterion, modeled on the helping experiments (e.g., Darley & Batson), scores Alex as possessing the robust trait (high cross-situational consistency) and Blake as lacking it (low consistency). Virtue theory, requiring practical wisdom (*phronesis*), scores Blake as virtuous and Alex as deficient. The feature doing the work is the **moral valence of the task content** (alleviating workload vs. compromising safety), which is invisible to a coding scheme that registers only "Helping Behavior: Yes/No." If this feature is removed—for instance, if the second request is made plainly unlawful (e.g., "steal narcotics")—Alex's failure might be attributed to lack of legal knowledge or fear of punishment rather than a defect of moral discrimination; the case relies on the ambiguity of professional integrity to isolate discrimination from compliance.

  **The Situationist Reply**
  The strongest reply from a defender of the consistency criterion is that the situationist critique targets consistency across *morally irrelevant* variations (mood, hurry, coins), not relevant ones. They argue their data shows traits fragment even when the moral demand is constant, not that virtues should ignore moral differences. This reply concedes the core point: it admits the consistency measure is blind to the distinction between blind rigidity and discriminative reliability. It saves the criterion from being *refuted* by this case only by narrowing its scope to deny that it ever intended to measure virtue *per se*, but merely behavioral stability. This concedes that behavioral consistency alone cannot refute virtue ethics, as virtue ethics never claimed consistency across relevant variations was the metric of virtue.

  **Withdrawal and Question-Begging**
  I would withdraw the case as a counterexample if empirical data showed that Blake's discriminating refusal is itself locally fragile—for example, if Blake complies with the falsification request when exhausted or when observed by a sympathetic supervisor. The construction begs the question against the situationist if it assumes Blake's refusal manifests a robust capacity (*phronesis*) rather than a narrower disposition ("follow rules when asked to break them"). If the discriminating agent's refusal can be redescribed as the manifestation of a specific disposition whose attribution is itself exposed to situationist data about how local such dispositions are, then the argument collapses. If Blake is only "virtuous" when not tired, and Alex is only "helpful" when not tired, both are equally subject to the situationist critique. Much of the argument goes down with this: if *phronesis* dissolves into a cluster of local norms under empirical scrutiny, the virtue theorist has not saved robust traits, merely renamed them.
