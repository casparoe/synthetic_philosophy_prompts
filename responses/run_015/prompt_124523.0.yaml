answer: |-
  **Candidate Angles**

  1.  **The Overzealous Auditor:** A certification inspector proudly signs off a tank of prawns as 'luxury living' because the litres-per-head ratio is technically off the charts, completely missing that the water is essentially soup.
  2.  **The Cynical Farm Manager:** A producer explains they didn't bother upgrading their facilities to meet welfare standards; they simply switched from salmon to prawns because the absolute space requirements are trivially easy to meet with smaller animals.
  3.  **The Confused Consumer:** A shopper compares two 'humane' labels, realising the prawn packet guarantees more space per gram of flesh than the salmon packet, despite the prawns being packed far denser.

  **Selection**

  I'm going with **Angle 2 (The Cynical Farm Manager)**. It best captures the active exploitation of the loophole rather than just passive confusion, and it allows for a dry, deadpan delivery that highlights the moral absurdity of 'gaming' welfare by shrinking the victim rather than expanding their world.

  **The Joke**

  I was chatting to an aquaculture manager about getting that 'high-welfare' tick on the packet. He said, 'Salmon are a nightmare. The regulation demands ten litres per head. For a salmon, that's a coffin; for a prawn, that's the bloody Atlantic.' I asked, 'So you built bigger tanks?' He said, 'Don't be daft. We just switched to prawns. Now each one has more space than a Victorian mansion. We didn't improve the welfare; we just minimised the animal.' That's the shrimp loophole: the label certifies the math, not the life.

  **Why This Matters**

  This undermines welfare certification because it allows high-density suffering to pass as compliant simply because the victims are too small to trigger the absolute thresholds intended to protect their behavioural needs.
