answer: |-
  This is a fantastic problem. You are describing a semantic configuration that sits right at the friction point between lexical semantics, pragmatics, and ethnoscience. You are correct to be dissatisfied with "prototype" or "vagueness"—those tools describe *fuzziness* at the boundaries, whereas you are describing *systematic mobility* of the boundaries themselves based on local distribution.

  Here is the breakdown: the existing neighborhood, why your data doesn't quite fit the standard maps, a concrete proposal for what is happening (including the asymmetry), and a specific elicitation strategy to distinguish the "Rank" hypothesis from the "Threshold" hypothesis.

  ### 1. The Neighborhood: What exists, and why it's not quite it

  There is no single canonical label for this, but there are three adjacent literatures you should cite to show you know where the edges are.

  **A. Gradable Nouns (Semantics)**
  *   **The Literature:** Work by Galit Sassoon (2013) and David Liebesman (2015) on "gradable nouns." Standard semantics treats nouns as sortals (in/out) and adjectives as gradable (more/less). Your data shows nouns behaving like adjectives.
  *   **The Mismatch:** In standard gradable noun theory (e.g., "idiot," "genius"), the standard is usually a fixed norm of the population. Your terms shift based on the *local set of artifacts*, not a population norm. A 45mm net isn't *pila* because it's fine relative to all nets in the world, but because it's fine relative to the twelve nets on the table.

  **B. Contextualist Semantics / Occasion Sensitivity (Pragmatics/Philosophy)**
  *   **The Literature:** Charles Travis (2008) or François Recanati (2004). The idea that word content is fixed only relative to an "occasion."
  *   **The Mismatch:** This is often too broad. You need to specify *which* features of the occasion matter. Your data shows it is specifically the **distributional range of the contrast set** that matters, not just general situational context.

  **C. Ethnosemantic Partitioning (Anthropology)**
  *   **The Literature:** Berlin & Kay (color), Brent Berlin (folk biology).
  *   **The Mismatch:** These models assume stable focal points and boundaries that are culturally shared and relatively fixed across contexts. Your consultants explicitly allow boundaries to shift based on local inventory ("For us that's a *taru*").

  ### 2. The Diagnosis: Asymmetrically Anchored Partitioning

  Your hunch is correct: this is not a simple "moving threshold." It is a **hybrid system**.

  Observation (2) (the asymmetry) is the key that unlocks Observations (1) and (3).
  *   **The Fine End (*Pila*):** This is **Functionally Anchored**. It is tied to a specific target species or fishing mode. It does not move easily. When something finer arrived, *pila* did not slide down to become the second-finest; it held its ground, and the new thing got a periphrastic label. This behaves like a **fixed lower bound**.
  *   **The Coarse End (*Won*):** This is **Distributionally Open**. It absorbs anything coarser. It behaves like a "max" operator on whatever is available.
  *   **The Middle (*Taru, Méska*):** These are **Floating Intermediates**. They partition the space *between* the Functional Anchor (*pila*) and the Contextual Ceiling (*won*).

  **What the phenomenon is:**
  These are **Anchored Relative Sortals**. They are nouns that encode a rank order, but the rank is calculated relative to a local set, *subject to a fixed functional anchor at one end of the scale.*

  **Why (1) and (3) happen:**
  Because the intermediates (*taru, méska*) float to fill the gap between the anchor and the ceiling.
  *   In Session 1 (20–60mm), the gap is small. 45mm falls in the upper middle → *méska*.
  *   In Session 2 (40–95mm), the gap is large. 45mm falls near the bottom (just above *pila*) → *pila* (or low *taru*).
  *   In Boat A (fine inventory), 45mm is coarse → *taru*.
  *   In Boat B (coarse inventory), 45mm is fine → *méska*.

  The consultants insist the word picks out a "kind" because, cognitively, they are reifying the *position* as a *property*. "Being the middle net" becomes "Being a *taru*."

  ### 3. Distinguishing the Models: Rank vs. Threshold

  You asked for a way to tell the **"Rank in a local ordering"** story apart from a **"Fixed threshold plus a moving anchor"** story.

  Actually, based on Obs 2, it is neither pure Rank nor pure Threshold. It is **Anchored Partitioning**. However, to prove this in Chapter 3 and rule out the "Pure Rank" hypothesis (which is the strongest competitor), you need to test whether the *number* of categories is fixed or whether the *labels* are fixed to positions.

  **The "Gap Elicitation" (The Discriminating Test)**

  If the system is **Pure Rank** (1st finest, 2nd finest, 3rd, 4th):
  *   The terms are tied to ordinal positions.
  *   If you remove the middle of the spectrum, the terms should compress.

  If the system is **Anchored Partitioning** (Fixed Bottom, Fixed Top, Floating Middle):
  *   The terms *pila* and *won* should remain stable.
  *   The intermediates should stretch or vanish.

  **Protocol:**
  1.  **Stimulus:** Create two sets of physical net samples (or high-res photos with mesh measurements clearly visible).
      *   **Set A (Continuous):** 12 nets evenly spaced from 20mm to 90mm. (Baseline: Expect *pila, taru, méska, won*).
      *   **Set B (Gapped):** 12 nets. 4 are very fine (20–30mm), 4 are very coarse (80–90mm), and 4 are "impossible" intermediates (e.g., 55mm) are *removed*. Or, better: Create a set where there is a massive gap in the middle. 6 nets clustered 20–35mm, 6 nets clustered 70–90mm. Nothing in between.
  2.  **Task:** Sorting/Labeling. "Put these in piles," or "What kind is this?"
  3.  **Prediction (Pure Rank):** If *taru* means "2nd finest," and there are only two clusters, consultants might label the fine cluster *pila/taru* and the coarse cluster *méska/won*, or they might compress and only use *pila* and *won*.
  4.  **Prediction (Anchored Partition):** Consultants will label the fine cluster *pila* (because it hits the functional anchor). They will label the coarse cluster *won*. The middle terms (*taru, méska*) will either disappear (no referent) or be applied hesitantly to the edges of the clusters. Crucially, *pila* should not shift to cover the 35mm nets if 20mm nets are present, because *pila* is anchored to the function (sardines), not the rank.

  **The "Singleton Elicitation" (Secondary Test)**
  1.  **Stimulus:** Show a *single* net in isolation (45mm).
  2.  **Task:** "What kind is this?"
  3.  **Prediction (Pure Rank):** Rank requires a set. A single item has no rank. Consultants should hesitate, ask "compared to what?", or default to a "neutral" term.
  4.  **Prediction (Anchored Threshold):** If *pila* has a functional anchor (sardines), and 45mm catches sardines, they should say *pila* immediately, regardless of context.
  5.  **Your Data Suggests:** They will likely say *pila* (because 45mm is functionally fine). This supports the Anchor theory over Pure Rank.

  ### 4. Naming and Defining (For Chapter 3)

  Since there is no standard name, you have the prerogative to coin one that precisely captures the mechanism. I recommend **Anchored Relative Sortals**.

  **Definition:**
  > **Anchored Relative Sortals** are lexical items that grammatically function as nouns (sortals) but semantically function as partitioning operators over a scalar domain. Their extension is determined by two factors:
  > 1.  **Functional Anchoring:** One boundary of the category is fixed to an extralinguistic function or prototype (e.g., target species) and resists contextual shift.
  > 2.  **Distributional Partitioning:** The remaining boundaries are fluid, dividing the available semantic space between the anchor and the opposite end of the scale based on the local distribution of referents.

  **Inclusion Criteria (What counts):**
  *   Terms must be syntactically nouns (or function as kinds).
  *   Boundaries must shift systematically based on the local contrast set (not just noise).
  *   There must be evidence of asymmetry (one end resists shift, the other absorbs it).

  **Exclusion Criteria (What doesn't count):**
  *   **Standard Gradable Adjectives:** (e.g., "tall"). These lack the "kind" reification and usually lack the functional anchor.
  *   **Pure Indexicals:** (e.g., "this"). These point to objects, not categories.
  *   **Prototype Categories:** These have fuzzy boundaries but stable focal points. Your data shows *moving* boundaries with stable anchors.
  *   **Polysemy:** The meaning isn't different in different contexts; the *standard of application* shifts while the core semantic relation (ordering) remains constant.

  ### 5. Why this matters (Theoretical Payoff)

  For your committee, the payoff is in the **semantics-pragmatics interface**.
  Standard semantics tries to fix meaning to truth conditions. Standard pragmatics treats context as noise to be filtered. Your data shows that **context is part of the truth conditions for sortals.**

  Furthermore, the **asymmetry** (Obs 2) challenges the idea that semantic scales are symmetrical. It suggests that in technical domains, **utility anchors semantics**. The "fine" end is anchored because *fishing success* depends on not being too coarse (fish escape). The "coarse" end is unanchored because being "very coarse" just means "catches bigger fish," which is an open-ended possibility.

  **Summary for the Chapter:**
  1.  Reject "Vagueness" and "Prototype" (boundaries are sharp, just mobile).
  2.  Reject "Pure Rank" (asymmetry proves anchoring).
  3.  Propose **Anchored Relative Sortals**.
  4.  Run the **Gap Elicitation** to prove the intermediates float while the anchor holds.

  This gives you a precise mechanism, a clear distinction from neighbors, and a testable prediction. Good luck with Chapter 3.
