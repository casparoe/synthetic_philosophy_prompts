answer: |-
  **The Scenario**
  Consider a specialist bettor operating on a prediction exchange who identifies a mispriced long-shot opportunity recurring over a fixed horizon of ten independent rounds ($N=10$). In each round, the true probability of a win is 6 per cent ($p=0.06$), but the market offers odds of 17 to 1 ($b=17$), implying a positive expected edge of 8 per cent per round. The bettor starts with a bankroll of one unit, may stake any fraction $f$ of current wealth, reinvests all winnings, cannot borrow, and has no outside income to cushion losses; the goal is to determine the optimal stake fraction $f$ under three distinct criteria.

  **The Arithmetic**
  (i) **Expected Wealth:** The expected growth factor per round is $1 + f(pb - q) = 1 + f(0.06 \times 17 - 0.94) = 1 + 0.08f$. Since the edge is positive, expected terminal wealth $E[W_{10}] = (1 + 0.08f)^{10}$ is strictly increasing in $f$, so the maximiser stakes everything ($f=1$).
  (ii) **Growth Rate (Kelly):** The Kelly criterion maximises the expected log-wealth per round, $g(f) = 0.06 \ln(1 + 17f) + 0.94 \ln(1 - f)$. Setting the derivative to zero yields the optimal fraction $f^* = \frac{pb - q}{b} = \frac{0.08}{17} \approx 0.0047$. The growth-rate maximiser stakes roughly 0.47 per cent.
  (iii) **Median Wealth:** The number of wins $k$ follows a Binomial distribution $B(10, 0.06)$. The probability of zero wins is $P(k=0) = 0.94^{10} \approx 0.538$. Since this exceeds 0.5, the median outcome of the experiment is zero wins. Terminal wealth in this median case is $W_{10} = (1 - f)^{10}$. This function is strictly decreasing for any $f > 0$, so the median-wealth maximiser declines the bet entirely ($f=0$).

  **Diagnostics**
  The divergence arises from the skewness of the binomial distribution over a short horizon: while the *mean* number of wins is positive ($Np = 0.6$), the *median* number of wins is zero, meaning the "typical" path sees no payouts to compound. If the horizon is allowed to grow without bound, the Law of Large Numbers forces the median win rate to converge to $p$, and the median stake converges to the Kelly stake; however, for finite $N$, the convergence is lumpy rather than smooth because the median number of wins must be an integer. In this specific case, the median stake remains zero until $N=12$ (where $P(k=0) \approx 0.48$), at which point it jumps discontinuously to roughly 2.9 per cent, briefly exceeding the Kelly fraction before oscillating towards it as $N$ increases further. A Kelly defender would argue that the median criterion ignores the ergodic property of reinvestment, sacrificing long-term compounding for short-term safety, whereas a median defender would reply that a single finite life cannot rely on asymptotic convergence and that the Kelly bettor here has a 54 per cent chance of finishing with less money than they started.

  **Recommendation**
  I would hand the median criterion to the person in the story because, over a horizon of only ten rounds, the probability of ruin or loss is dominated by the zero-win outcome, making the asymptotic promise of the growth rate irrelevant to their actual financial survival.
