  Her method relies on a **Decisional Escalation Rule**: the "starter" is the political leadership that consciously chooses to convert tension into open war or coercion when a non-violent alternative remains live, provided structural factors do not render the outcome inevitable. This rule synthesizes her Cold War verdict (focus on decisions closing off live alternatives) with her specific crisis verdicts (1939, 1948, 1962, 2003), where she names the actor who made the final political decision to escalate (Germany, USSR, US/UK) despite acknowledging background context (US missiles in Turkey, Western currency reform, Saddam's history). In this case, State A's head of government exercised agency by ordering the strike after learning the trigger was unauthorized and a non-violent alternative was available, thereby closing off the live alternative of de-escalation. State B's covert funding is treated as background context (like US missiles in 1962) rather than a war-starting decision, and the unauthorized raid lacks the political authorization required to count as a state decision (unlike Germany in 1939).

  Two alternative rules fit her track record nearly as well:
  1.  **The Structural Inevitability Rule:** If background conditions (alliances, partitions, doctrines) make war highly probable regardless of specific choices, no starter is named (fitting 1914, Korea, Cold War). This predicts **no starter** here, arguing that the six-year covert war and standing preemptive doctrine created a structural trap similar to 1914 mobilization timetables.
  2.  **The Trigger Liability Rule:** The state whose agents fire the first kinetic shot or cross the border starts the war, regardless of political authorization (fitting the surface logic of 1939 and 2003, though ignoring the nuance of 1962/Berlin). This predicts **State B**, as its intelligence service initiated the first cross-border violence.

  The variant that best separates these rules is: **State A's head of government orders a stand-down upon learning the raid was unauthorized, but the military executes the strike anyway due to automated protocol.**
  *   If she verdicts **no starter**, she commits to the **Structural Inevitability Rule**, treating automated protocols like 1914 mobilization timetables that remove agency.
  *   If she verdicts **State A**, she commits to the **Decisional Escalation Rule**, holding leadership responsible for maintaining doctrines that remove their own control.
  *   If she verdicts **State B**, she commits to the **Trigger Liability Rule**, prioritizing the first kinetic act over subsequent political decisions.

  If her track record underdetermines the answer, it is because the distinction between a "standing contingency plan" (Agency) and "mobilization timetables" (Structure) is not fully resolved in her past work. Verdicting A commits her to the view that maintaining a preemptive plan is a continuous political decision; verdicting No Starter commits her to the view that such plans create structural inevitability akin to 1914; verdicting B commits her to the view that unauthorized kinetic acts by state agents bind the political leadership retroactively.
