answer: |-
  **The Provisional Addendum**

  **November 14, 1983**
  **St. Jude's Research Unit, Ward 4**

  Dr. Aris Thorne tapped the carbon copy of the intake form against the desk to align the edges. Across from him, Eleanor Vance sat with her hands folded over a purse that looked too thin for the winter chill seeping through the single-pane glass.

  "Mrs. Vance," Aris said, keeping his voice level. "The protocol requires me to ask again. You understand Toby is currently stable?"

  "He is stable," Eleanor said. Her voice was flat, devoid of the tremor Aris had heard in their first session three months ago. "But stability is a pause. It is not a cure. I am grieving the pause."

  Aris made a note in the margin of the *Provisional Manual for Affective Anomalies*. Under Criterion C: *Certainty of Outcome*. Three months ago, Eleanor had wept about *risk*. She had spoken of probabilities, of statistics, of the 15% chance of cardiac failure associated with Toby's congenital anomaly. Now, she spoke of inevitability.

  "And this grief," Aris prompted. "It interferes with your daily functioning?"

  "I cannot maintain employment," Eleanor said. "I cannot engage in future planning. To plan is to lie. I am living in the post-loss timeline while my son is still breathing. This is the disorder. You named it."

  Aris felt the familiar, cold friction in his chest. He was one of four clinicians piloting the entry for *Chronic Anticipatory Grief Disorder* (CAGD). They had invented the category to capture a specific phenomenology: parents who functioned as widows before the death occurred. But as the months wore on, Aris watched the patients stop describing their pain and start inhabiting the architecture of the pain the manual described.

  "Group session is at two," Aris said, closing the folder. "We'll discuss the disability certification then."

  Eleanor nodded. She stood up, adjusting her coat. She moved with a deliberate slowness now, a performance of the exhaustion the diagnosis required. It was no longer just fatigue; it was *symptomatic* fatigue.

  ***

  **January 10, 1984**

  The group room smelled of floor wax and stale coffee. Six parents sat in a circle. In the beginning, the conversations were chaotic—a tangle of fears about medications, school placements, and sudden night-time emergencies.

  Now, the language had tightened.

  "I found myself buying a black dress," said a father named David. He looked at Aris, who sat in the periphery with a notepad. "I caught myself. I realized I was enacting the ritual of the widow. It fits Criterion B. *Premature adoption of bereavement behaviors*."

  "It's not enactment," Eleanor corrected gently. "It's alignment. If we do not align our internal state with the coming reality, the shock will be fatal when it happens. The manual calls it *protective temporal displacement*."

  Aris watched her. She was the star subject. Her file was thick. When the CAGD criteria were first drafted, the requirement for "certainty" was vague. Patients had to express a "high conviction of loss." Eleanor had latched onto the word *certainty*. In her second month, she had stopped saying "I think he will die." She began saying, "I know he will die."

  It was a subtle shift, but it unlocked the institutional pathways. With "fear," she was an anxious mother, eligible for outpatient therapy but expected to work. With "certainty," she was disabled by a specific, chronic psychiatric condition. The diagnosis had granted her a medical leave from her job at the textile mill. It had granted her a parking placard for "emotional mobility impairment." It had granted her husband, Mark, a role he didn't know how to play: the caregiver of the grieving mother of the living child.

  "Eleanor," Aris interrupted. "Does the certainty cause you distress, or does it relieve it?"

  This was the question they were trying to answer. Was CAGD a pathology, or a coping mechanism that looked like a pathology?

  "It relieves the dissonance," Eleanor said. "Before the study, I felt crazy. I felt guilty for mourning a living boy. Now I have a name. The name makes it real. If it is real, I am not mad. I am a patient."

  Aris looked down at his notepad. He had written *Looping Effect* in the margin. He knew, and the review board knew, that the classification was changing the classified. By offering Eleanor a vocabulary that validated her certainty, they were encouraging her to cement that certainty. They were turning a fluid anxiety into a rigid identity.

  ***

  **March 5, 1984**

  The hearing for the disability extension was held in a small administrative office. Mark sat beside Eleanor. He looked tired, his tie slightly askew.

  "Mrs. Vance," the adjudicator said, reviewing the file. "The initial certification was for six months. Dr. Thorne's addendum suggests indefinite status under the new CAGD guidelines. But your son's last check-up indicates improvement."

  "The improvement is statistical," Eleanor said. She had rehearsed this. She had learned the syntax of the clinic. "My condition is not dependent on Toby's current vitals. It is dependent on my cognitive processing of his trajectory. The manual states that *remission requires a fundamental shift in the perception of inevitability*."

  She turned to Mark. "Mark, tell them about the nursery."

  Mark flinched. "Eleanor, we talked about this."

  "Tell them."

  "I... I painted the room," Mark said, looking at the table. "Blue. With clouds. Eleanor couldn't go in. She said entering the room was a denial of the grief. She said it violated the treatment protocol."

  The adjudicator looked at Aris. "Is this standard?"

  "It is emerging as a common presentation," Aris said. He felt the weight of the lie. It wasn't standard until Eleanor made it standard. She had read the draft criteria, seen the clause about *avoidance of hopeful environments*, and weaponized it. She had used the diagnosis to stop her husband from hoping. Hope was now a trigger. Grief was the safety.

  "The diagnosis," Eleanor said, her voice steady, "gives me the right to stop fighting the future. Without it, my family expects me to be a mother. With it, I am allowed to be a mourner. I cannot do both."

  The adjudicator stamped the form. *Approved.*

  ***

  **April 20, 1984**

  Aris sat in his office. The window was open, letting in the spring air, a cruel contrast to the climate of Ward 4. Eleanor's file lay open. She was stable. Her symptoms were consistent. She was the perfect example of CAGD.

  His colleague, Sarah, leaned against the doorframe. "She's getting the long-term benefit approval. Social Security is accepting the provisional code."

  "I know," Aris said.

  "We created a monster," Sarah said, though her tone lacked judgment. It was weary.

  "We created a mirror," Aris corrected. "She came to us with a shapeless terror. We gave it a box. She climbed inside the box because it was warmer than the outside. Now she won't come out."

  "Does she still believe he will die?"

  "She believes what the manual tells her she must believe to remain valid," Aris said. "If she hopes, she loses the diagnosis. If she loses the diagnosis, she loses the leave, the parking, the moral authority over her husband. The diagnosis isn't just describing her, Sarah. It's employing her."

  Aris picked up his pen. He had to write the final summary for the pilot program. He had to decide if CAGD was a natural kind—a thing that existed in nature waiting to be found—or a human kind, a thing that existed only because people interacted with the description of it.

  He looked at the criteria sheet. *Criterion D: Resistance to positive prognostic data.*

  Eleanor had mastered this. She didn't ignore the positive data; she reclassified it as temporary. She had become a professional griever. She had found a way to live in the future past tense.

  "Send the recommendation," Aris said. "Include the addendum."

  "Even if we know it's feeding the loop?"

  "Especially then," Aris said. "She needs the loop to close. Without it, she's just a woman afraid for her son. With it, she's a patient with a plan."

  He watched Eleanor through the glass of the office door. She was walking down the hall, pushing a wheelchair. Toby was not in it. She was pushing it empty, practicing the weight of it. She caught Aris's eye and nodded, a small, professional acknowledgment between clinician and subject. She was no longer just suffering. She was working.

  ***

  ### Reflective Note on Philosophical Liberties

  **Liberties Taken:**
  The narrative simplifies the "looping effect" (a concept coined by Ian Hacking regarding "human kinds") by presenting the patient's adoption of the diagnostic label as a relatively seamless, strategic, and conscious process. In the story, Eleanor quickly recognizes the utility of the *Chronic Anticipatory Grief Disorder* (CAGD) label and reshapes her behavior to fit the criteria to secure material benefits (disability, family authority). This implies a high degree of agency and rational calculation in the "consumption" of the diagnosis. In reality, the interaction between classification and classified is often messier, involving significant resistance, unconscious assimilation, or fragmentation. The story also portrays the clinicians as uniformly aware of the feedback loop and somewhat passive in their complicity. In actual institutional settings, power is more fractured; clinicians often genuinely believe they are discovering natural kinds rather than constructing them, and institutional pressures (insurance, liability) often drive the looping more than individual clinician awareness.

  **Specific Argument for Revision:**
  A concrete empirical finding that would complicate this framing comes from medical sociology research on **diagnostic resistance**. Studies (e.g., by Adele Clarke or Annemarie Mol) suggest that patients do not always accept classifications that offer material gain if those classifications threaten their moral identity. For instance, a parent might reject a "grief disorder" label because it pathologizes their love or implies they are failing their child by "giving up" on hope. If I were to revise the story based on this, I would depict Eleanor struggling *against* the CAGD label, perhaps trying to use it for benefits while simultaneously insisting to her husband that she is *not* sick, but rather rationally prepared. This would illustrate that looping effects are not always a smooth alignment of identity and category, but often a site of conflict where the patient accepts the *rights* of the category while rejecting the *stigma*, creating a fractured self-conception rather than the cohesive "professional griever" depicted above. This would better reflect Hacking's later clarification that looping effects can produce "unstable" kinds where the classified actively fight the classification even while being shaped by it.
