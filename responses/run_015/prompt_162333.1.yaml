answer: |-
  ### Epistemic Status and Preliminary Caveats

  Before addressing the specific axes of your comparison, I need to be explicit about the epistemic status of the claims I am making, per your request.

  1.  **Settled/Consensus:** It is uncontroversial among scholars of the Vienna Circle and Isotype that Neurath's system was a collaborative product involving statisticians, artists, and educators (the "transformation" process). It is also settled that Neurath insisted on the integration of text and image, and that he viewed Isotype as a tool for democratic education rather than fine art. It is further consensus that Neurath's philosophical physicalism (the rejection of private mental states in favor of publicly observable statements) parallels his design philosophy.
  2.  **Live Interpretive Dispute:** There is ongoing debate regarding how "universal" Neurath believed the pictograms to be. Some interpreters emphasize his optimism about cross-cultural perceptual immediacy (leaning toward your *Transparency* reading), while others emphasize his insistence on teaching and standardization (leaning toward your *Conventionalist* reading). The tension you have identified is a recognized feature of the literature.
  3.  **Reconstruction/Inference:** Where I argue for how these tensions resolve—particularly regarding the connection to his anti-foundationalism and the specific rhetorical function of the slogan "Words divide, pictures unite"—I am offering a reconstruction. I am inferring the most coherent philosophical position Neurath *could* hold given his other commitments, rather than reporting a specific text where he explicitly resolves this exact dichotomy.

  ### Critique of the Dichotomy

  Your provisional sense is correct: the *Conventionalist* reading fits the actual practice of the Social and Economic Museum far better than the *Transparency* reading. However, I suggest the *Transparency* reading is not quite a straw man, but rather a **rhetorical idealization** that Neurath employed for promotional and pedagogical purposes, even if his technical practice contradicted it.

  If you treat them as mutually exclusive philosophical claims, the distinction collapses under pressure because Neurath was a pragmatist. A better contrast might be between **Perceptual Optimism** (the hope that the learning curve is near-zero) and **Institutional Constructivism** (the reality that the system must be built and taught). Neurath likely wanted both: he wanted the *effect* of transparency achieved through the *mechanism* of convention.

  Here is the comparison along your three requested axes, keeping this tension in mind.

  ### 1. Grounds of Intelligibility: Resemblance vs. Stipulation

  **The Transparency Reading:**
  On this view, the intelligibility of a pictogram rests on **natural resemblance**. A picture of a worker looks like a worker. The ground of meaning is perceptual psychology, which is assumed to be universal.
  *   *Implication:* If a chart fails to communicate, it is because the drawing is inaccurate or too complex. The solution is better art.
  *   *Problem:* As you noted, Isotype figures are stylized, flattened, and repeated. A repeated icon of a "man" does not resemble a crowd; it resembles a stamp. Pure resemblance cannot explain why ten small men signify "more" than five small men without a prior rule of counting.

  **The Conventionalist Reading:**
  On this view, intelligibility rests on **stipulated rules**. The "man" icon is a token in a code. The ground of meaning is social agreement and prior instruction.
  *   *Implication:* If a chart fails, it is because the viewer hasn't learned the code or the code is inconsistent. The solution is better education or standardization.
  *   *Reconstruction:* This aligns with Neurath's "transformation" process. The statistician and the artist negotiate what counts as a "unit." This is not discovery (finding the natural image) but construction (deciding on a sign).

  **Synthesis:**
  The intelligibility of an Isotype pictogram is **hybrid**. It exploits *partial* resemblance (it looks vaguely like the thing) to lower the cost of learning the convention, but it relies on *convention* to ensure precision. The "universal" claim is not that the image needs no learning, but that the *cost* of learning the visual convention is lower than the cost of learning a foreign natural language.

  ### 2. The Role of Visual Education and Verbal Text

  **The Transparency Reading:**
  *   **Visual Education:** Marginal. It is merely showing people what is already potentially obvious. The museum is a gallery of truths waiting to be seen.
  *   **Verbal Text:** Ancillary. The text is a caption for edge cases. The picture carries the semantic weight; the text labels it.
  *   *Conflict with Practice:* This cannot account for Neurath's insistence that a chart is *never* presented alone. If pictures were truly self-sufficient, text would be redundant.

  **The Conventionalist Reading:**
  *   **Visual Education:** Constitutive. "Visual education" is the process of installing the software required to read the charts. The museum is a school for a new literacy.
  *   **Verbal Text:** Integral. The text provides the logical syntax that the images lack. Images show quantity and kind; text provides location, time, and causal connection.
  *   *Fit with Practice:* This explains the "language-like technique" description. It is a *helping* language because it cannot stand alone; it leans on natural language for the grammatical structure (verbs, tense, logical operators) that pictures cannot easily depict.

  **Synthesis:**
  The verbal text is not a caption but a **key**. In a Conventionalist framework, the chart and text form a single proposition. The picture handles the "how much" and "what kind" (which are hard to grasp in prose), while the text handles the "where," "when," and "if" (which are hard to depict without complex allegory). Visual education, then, is not teaching people to see, but teaching them to **read the interface** between the two.

  ### 3. Objectivity and Rhetoric: Bypassing vs. Standardizing

  **The Transparency Reading:**
  *   **Claim:** Pictures are more objective because they bypass the ambiguity and emotional loading of words. Words are historically sedimented with bias; pictures are fresh.
  *   **Risk:** As you identified, this creates a "manufactured self-evidence." The choice of *what* to count (e.g., "unemployed" vs. "available workers") and *what* icon to use (a sad worker vs. a neutral silhouette) is hidden behind the apparent neutrality of the image. The rhetoric is concealed, not removed.

  **The Conventionalist Reading:**
  *   **Claim:** Pictures are not inherently more objective, but they allow for **standardized comparison**. If we all agree to use the same icon for "ton of coal," we can compare charts across nations without translation errors.
  *   **Risk:** If it is merely convention, "Pictures unite" becomes a sociological claim: "This convention is currently more widely adoptable than English or German." It loses the normative force of *why* we should prefer pictures.
  *   **Defense:** The argument for pictures *over* words shifts from "truth" to "accessibility." It is not that pictures are truer, but that they are **more democratic**. They lower the barrier to entry for statistical reasoning. The objectivity lies in the public scrutiny of the conventions, not in the images themselves.

  **Synthesis:**
  Neurath's claim to objectivity is best understood as **procedural**. The chart is objective not because it mirrors nature (Transparency), but because the rules of its construction are public and repeatable (Conventionalist). The slogan "Words divide" refers to the fragmentation of natural languages (Babel); "Pictures unite" refers to the possibility of a planned, international auxiliary notation. The "neutrality" is a design goal, not a natural property.

  ### The Anti-Foundationalism Wrinkle

  You asked if this connects to Neurath's rejection of incorrigible protocol sentences and the "ship at sea" metaphor. **Yes, strongly.** This connection decisively supports the *Conventionalist* reading and complicates the *Transparency* reading.

  1.  **The Connection:** Neurath's anti-foundationalism argues that there is no "given" in experience that is immune to revision. All knowledge claims, even basic observations ("protocol sentences"), are part of a coherent system that we rebuild while floating on the sea. There is no solid ground.
  2.  **Application to Isotype:** If there are no incorrigible sense-data, there are no incorrigible pictures. A pictogram is not a direct imprint of reality (which Transparency suggests); it is a tool within a system of knowledge. Just as protocol sentences can be rejected if they don't cohere with the rest of science, an Isotype convention can be changed if it doesn't serve the goal of social understanding.
  3.  **Impact on Neutrality:** This makes the neutrality claim harder to sustain in a metaphysical sense (pictures are not "truer"), but easier to sustain in a pragmatic sense. Since we are rebuilding the ship anyway, we should choose tools (pictures) that allow the whole crew (the public) to participate in the rebuilding.
  4.  **Reconstruction:** The "ship at sea" metaphor implies that **unity is a task, not a starting point.** "Pictures unite" is not a description of how human vision works (which would be foundationalist); it is a political directive. We *make* pictures unite by agreeing on conventions. This aligns Isotype with Neurath's broader socialist project: rational planning applied to communication.

  ### Conclusion for Your Position Paper

  Your suspicion is well-founded: Neurath wanted both readings, but they function at different levels.

  *   **At the level of User Experience:** He promoted the *Transparency* reading. The citizen should *feel* that the chart is obvious. This is necessary for the "helping language" to be helpful.
  *   **At the level of System Design:** He practiced the *Conventionalist* reading. The museum staff knew the icons were constructed, taught, and arbitrary.

  If you argue that the *Conventionalist* reading deflates the slogan, you might miss Neurath's pragmatic point. The slogan is not a theoretical claim about semiotics; it is a **political claim about accessibility**. "Words divide" acknowledges the reality of Babel (different natural languages); "Pictures unite" proposes a planned solution (an artificial visual language).

  The connection to his anti-foundationalism saves the project from the charge of naivety. Neurath knew the pictures were constructed (like the ship). He argued for them not because they were natural, but because they were **reconstructible by the public**. The "objectivity" of Isotype is the objectivity of a public tool that can be critiqued and modified, unlike the "black box" of complex prose statistics or the "mystical" claim of pure visual truth.

  **Recommendation:** Do not try to force Neurath into one camp. Instead, argue that the tension between Transparency and Conventionalism is the engine of the project. The *Transparency* is the goal (democratic access); the *Conventionalism* is the method (standardized education). The slogan "Words divide, pictures unite" is a call to action to build the conventions that will make the transparency possible.
