  *(Refining the Anti-Foundationalism point)*: The connection is strong. If there are no incorrigible sense-data (protocol sentences), there are no incorrigible pictures. Pictures are tools. This supports Conventionalism. But Neurath wanted tools that *felt* solid to the worker/citizen.

  *(Final Polish)*: Ensure the distinction between "consensus," "dispute," and "reconstruction" is visually clear or explicitly stated in each section. I will use a preamble to set the epistemic ground rules.

  *(Wait, one more check)*: The user asked: "If you think one of my two readings is a straw man... say so." I think the Transparency reading is partly a straw man of Neurath's *mature* view, but accurate to his *promotional* view. I should nuance that. The "universal" claim was aspirational.

