      *   Wording: Change "Probability of Failure" to "Failure Rate Estimate" or "Risk Score."
      *   Decision: The "Conformal Prediction" method is the compromise. It gives the coverage Maya wants with the single-shot applicability Dov wants.
      *   Honest assessment: Dov's view drives the *implementation* (we need a number now), Maya's view drives the *validation* (does this number match reality over time?).

