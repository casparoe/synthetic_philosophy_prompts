answer: |-
  # JOINT STATEMENT ON FLAKE LEDGER SEMANTICS AND OPERATIONAL POLICY
  **Authors:** Maya (Infrastructure Reliability), Dov (Platform Risk)
  **Date:** 2023-10-27
  **Subject:** Adversarial Collaboration on Probabilistic Gating

  ## 1. Agreed Claims
  *The following statements are accepted by both parties as operationally binding. Where acceptance requires conceding preferred terminology, this is noted.*

  1.  **The Ledger Records Outcomes, Not Propensities.** The database stores binary outcomes (Pass/Fail) indexed by context (SHA, region, machine). It does not store "probabilities." Probabilities are derived metrics computed from these rows.
      *   *Cost:* Dov accepts this limits "probability" to a derived statistic, not a raw datum. Maya accepts that derived metrics are valid inputs for automation.
  2.  **Mathematical Equivalence of Updating.** Both parties agree on the algebraic update rules. Whether viewed as "updating a prior belief" or "calculating a posterior frequency estimate," the arithmetic operation performed on the ledger data to generate the risk score is identical (Beta-Binomial conjugacy or equivalent).
      *   *Cost:* Both must refrain from claiming the *math* proves their ontology.
  3.  **Operational Necessity of Single-Case Decisions.** The CI gate must output a binary decision (Block/Pass) for *this* specific commit on *this* specific run. It cannot output "undefined" unless explicitly configured to abstain.
      *   *Cost:* Maya accepts that the system forces single-case action, rendering "single-case probability is meaningless" an internal philosophical stance that cannot stop the pipeline.
  4.  **Exchangeability is a Required Assumption for Prediction.** Any method that projects past failure rates onto future runs (including the conformal prediction threshold) requires the assumption that future runs are exchangeable with past runs (i.e., the underlying data generation process has not shifted fundamentally).
      *   *Cost:* Dov accepts this is a strong assumption about the world, not just a coherence constraint. Maya accepts that without this assumption, no inference is possible, even for frequencies.
  5.  **Calibration is the Ground Truth for Validation.** Regardless of interpretation, if the service labels 100 tests as "10% risk" and 50 of them fail, the service is broken. Observed long-run frequency is the only metric available to audit the system's performance.
      *   *Cost:* Dov accepts that "degrees of belief" must ultimately track frequencies to be useful. Maya accepts that calibration validates the *model*, even if it doesn't define the *meaning*.
  6.  **Cold Start Requires Explicit Policy.** For a test with zero history (new region), the system cannot infer a frequency. A policy decision must be made: either block by default (conservative) or infer from a hierarchical prior (fleet-wide average). We agree to implement the hierarchical prior but widen the uncertainty bounds.
      *   *Cost:* Maya accepts using a prior for new regions. Dov accepts that the uncertainty bounds must reflect the lack of specific data, effectively mimicking a "block" if variance is too high.

  ## 2. Surviving Disagreements
  *Disagreements that remain after the collaboration. We have categorized whether these affect the code (Substantive) or only the documentation/debugging mindset (Verbal).*

  | Disagreement Topic | Frequentist Wording (Maya) | Subjectivist Wording (Dov) | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Ontology of the Score** | The score estimates a physical property of the test setup (the true failure rate). | The score quantifies our uncertainty about the outcome given current information. | **Verbal.** Does not change the calculation or the API, only how we explain it in docs. |
  | **Cold Start Justification** | We are borrowing data from a similar reference class because the specific class is empty. | We are applying a prior belief based on fleet-wide behavior because we have no specific evidence. | **Verbal.** The code (hierarchical shrinkage) is identical. |
  | **Exchangeability Violation** | A violation means the physical setup changed; the "true frequency" no longer exists. | A violation means our model is misspecified; we must update our belief structure. | **Substantive.** Affects debugging. Maya debugs the infra; Dov debugs the model features. |
  | **Single-Case Meaning** | Saying "this run has a 5% chance of failing" is shorthand for "5% of similar runs fail." | Saying "this run has a 5% chance of failing" is a precise statement about betting odds on this event. | **Verbal.** Operationally, both trigger the same gate logic. |
  | **Conformal Guarantee** | The 95% coverage is a frequency guarantee over repeated trials of the procedure. | The 95% coverage is a constraint on rational belief assignment under exchangeability. | **Verbal.** The guarantee holds mathematically either way. |

  ## 3. Cruxes
  *Specific sub-questions where changing our mind would alter the system design. We pre-register the following tests.*

  **Crux 1: Non-Stationarity (Drift)**
  *   **Question:** Does the "true failure rate" of a test drift over time independently of code changes (e.g., due to infrastructure degradation)?
  *   **Test:** Run a control chart on stable tests over 6 months. Check for autocorrelation in failure residuals.
  *   **Maya's Prediction:** Residuals will be white noise. If there is drift, it correlates with identifiable infra changes (reference class shift).
  *   **Dov's Prediction:** Residuals will show autocorrelation. A time-decay weight on past runs will outperform a uniform frequency count.
  *   **Stakes:** If Dov is right, the ledger must implement time-decay weighting (Bayesian updating with forgetting). If Maya is right, uniform counting is sufficient and more robust.

  **Crux 2: Cost of Cold-Start Blocking**
  *   **Question:** Is the cost of blocking a release due to cold-start uncertainty higher than the cost of letting a flaky test through?
  *   **Test:** A/B test the cold-start policy for non-critical paths for 1 month. Group A: Block on zero history. Group B: Use fleet prior with high variance.
  *   **Maya's Prediction:** Group B will introduce more production incidents caused by uncharacterized test behavior in new regions.
  *   **Dov's Prediction:** Group A will waste more engineer-hours investigating false positives, with negligible difference in production incidents.
  *   **Stakes:** Determines the default configuration for the `cold_start_policy` flag.

  **Crux 3: Interpretability of Intervals**
  *   **Question:** When we show a confidence/credible interval to a developer, what do they think it means?
  *   **Test:** Survey 20 engineers. Show them "Failure Rate: 5% [2% - 12%]". Ask: "If we run this test 100 times, how many fail?" vs "What is the chance the *next* run fails?"
  *   **Maya's Prediction:** Engineers interpret this as a frequency range. If we call it "belief," they will ignore it.
  *   **Dov's Prediction:** Engineers interpret this as risk on the next run. If we call it "frequency," they will trust it too much on single cases.
  *   **Stakes:** Determines UI labeling ("Estimated Rate" vs "Risk Probability").

  ## 4. Falsification Conditions
  *What evidence would compel each of us to abandon our primary framing?*

  *   **Maya (Frequentist):** I will abandon the "true frequency" framing if we demonstrate that test flakiness is fundamentally non-stationary *without* identifiable external causes. If the "true rate" is a moving target that cannot be modeled as a change in reference class, then the frequency concept offers no stability advantage over belief.
      *   *Evidence:* A set of tests where failure rates drift randomly (random walk) rather than step-changing, making long-run convergence impossible.
  *   **Dov (Subjectivist):** I will abandon the "degree of belief" framing if it leads to systematic calibration errors that a simple frequency counter avoids. If my priors consistently bias the system away from the observed reality in a way that costs money, coherence is not enough.
      *   *Evidence:* A calibration plot showing that tests labeled "10% risk" fail at 30% over a quarter, while a simple rolling-window frequency estimator stays within 10-15%.
  *   **Common Ground:** **Calibration.** If the system outputs a number $p$ and the observed frequency diverges from $p$ significantly over a large sample ($N > 10,000$), we both agree the system is broken, regardless of why we thought the number mattered.

  ## 5. Operational Resolution
  *Stripping the philosophy, here is what changes in the service.*

  We are shipping a **Hierarchical Bayesian Estimator with Frequentist Calibration Guards**. The "probability" returned by the API will be renamed **"Risk Score"** to avoid ontological fights. For cold starts, we will use the fleet-wide base rate as a prior (Dov's win), but we will widen the decision threshold based on the sample size of the specific test (Maya's win), effectively abstaining on high-variance estimates. The conformal prediction method will be used to set the gating thresholds, as it provides the coverage guarantee Maya requires with the single-run applicability Dov requires. In design reviews, Dov's framework will drive the *implementation* (how we handle missing data and priors), while Maya's framework will drive the *validation* (how we audit the service for drift and calibration). We agree to stop debating the "meaning" of probability in PR comments and instead debate the "calibration" of the Risk Score.
