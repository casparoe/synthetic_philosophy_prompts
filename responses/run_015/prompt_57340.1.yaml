      *   Table? Check.
      *   Cruxes with predictions? Check.
      *   Falsification? Check.
      *   Final paragraph on system changes? Check.
      *   Honest about who matters? Check.

  *(Self-Correction during drafting)*: Make sure the "Conformal Prediction" bit is handled carefully. It relies on exchangeability. Maya thinks exchangeability is a physical claim. Dov thinks it's a coherence claim. The guarantee is mathematical. The *application* is where they fight. I will frame the agreement around the *validity of the bound* given the assumption, not the nature of the assumption.

  *(Refining the "Who Matters" part)*: For *shipping*, Dov's approach is necessary (you need a prior to act on new data). For *maintaining*, Maya's approach is necessary (you need to check calibration). I should state this clearly.

