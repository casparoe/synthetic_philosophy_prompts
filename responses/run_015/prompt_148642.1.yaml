answer: |-
  (a) **Exam Question**

  **Time Allowed:** 90 Minutes
  **Word Count:** Approximately 1500 words

  **Question:**
  Consider the proposition expressed by the sentence 'A gives B to C'. Analyze this proposition as involving a three-place relation with asymmetric roles: A (agent), B (object), and C (recipient). Using only the conceptual machinery of Bradley and Russell, construct a step-by-step analysis of the unity of this proposition.

  First, demonstrate precisely where Bradley's regress threatens the binding of these specific roles together, distinguishing between the mere existence of the constituents and the unity of the fact. Second, explain where Russell's appeal to external relations is supposed to halt this regress in this specific three-place case. Finally, evaluate whether the directionality required to distinguish 'A gives B to C' from 'C gives B to A' introduces a relocated version of the same problem. Specifically, argue whether relating the relation to its terms in an ordered fashion requires further relations that reproduce the original difficulty, or if Russell's solution successfully secures propositional unity without further glue. Do not cite secondary literature or recent authors; rely solely on the logical structures provided by Bradley and Russell.

  ***

  (b) **Model Answer**

  The proposition expressed by 'A gives B to C' poses a stringent test for Russell's theory of external relations against Bradley's regress. The constituents are three distinct terms—A (agent), B (object), and C (recipient)—and the three-place relation of Giving. For Bradley, a mere enumeration of these constituents constitutes a list, not a unified proposition capable of truth. The philosophical task is to explain what transforms this list into a fact where the relation actively binds the terms.

  Bradley's regress threatens at the initial binding stage. If the relation R is distinct from the terms A, B, and C, how does R attach to them? If R connects to A via a further relation R1, then R1 must connect to R and A via R2, generating an infinite regress. Consequently, the relation never actually succeeds in relating the terms; the proposition remains a disjointed collection of entities. The unity is never achieved because every attempt to forge a link presupposes a prior link. In the specific case of giving, this means the transfer from A to C is never actually established; we only have A, B, C, and Giving sitting side-by-side.

  Russell's solution attempts to halt this regress by categorizing relations as external and inherently relating. For Russell, a relation does not require a further tie to connect to its relata; its essence is to relate. In the case of 'A gives B to C', the relation 'Giving' directly holds between A, B, and C. No intermediate entity is needed to glue the relation to the terms. This move blocks the infinite chain by denying the premise that relations need external connectors to function. The fact is unified because the relation is present and relating; its existence suffices for the unity of the complex. Russell argues that the verb 'gives' signifies the actual relating, not just another noun-like entity.

  However, the asymmetric roles in this specific case introduce a relocated version of the problem. The proposition 'A gives B to C' is distinct from 'C gives B to A', despite sharing identical constituents. Russell must explain this directionality. If the relation is treated merely as a connector, the order of terms is not secured by the relation alone. To distinguish the agent from the recipient, the relation must have a specific 'sense' or direction.

  This directionality invites a renewed Bradleyan challenge. If the relation's direction is intrinsic, Bradley argues this intrinsic nature is itself a unity problem: how does the direction bind the terms in *this* order rather than *that* order? If Russell posits a further ordering principle to assign A as agent and C as recipient, he risks restarting the regress. What connects this ordering principle to the relation? If no further connector is needed, Bradley asks why none was needed for the original relation. Russell's external relations halt the regress of *connection*, but they may fail to secure the unity of *ordered* connection. The specific binding of roles (agent vs. recipient) may require a further fact of arrangement that Russell's ontology leaves unexplained. Thus, while the infinite chain of linking relations is stopped, the specific unity required to distinguish the proposition from its converse remains vulnerable to the claim that order itself requires a unifier not accounted for by external relations alone. The regress is halted formally, but the explanatory burden of directional unity remains unmet.

  ***

  (c) **Marking Scheme**

  **Total Marks:** 20

  **1. Identification of Constituents and the List Problem (4 Marks)**
  *   **Required Move:** Correctly identifies A, B, C, and the Relation as distinct constituents and explains Bradley's claim that a list of these lacks propositional unity.
  *   **Typical Mistake (Costs 2-4 marks):** Treating the sentence as a simple subject-predicate structure or failing to distinguish the relation from the terms as separate ontological categories.

  **2. Articulation of the Initial Regress (4 Marks)**
  *   **Required Move:** Demonstrates step-by-step how linking the relation to the terms requires further relations (R1, R2...), showing why unity is never achieved in the specific case of 'giving'.
  *   **Typical Mistake (Costs 2-4 marks):** Reciting a generic definition of Bradley's regress without applying it to the binding of the specific three places (agent, object, recipient).

  **3. Explanation of Russell's Halt (4 Marks)**
  *   **Required Move:** Explains Russell's doctrine of external relations as inherently relating, denying the need for further glue to connect the relation to the terms in this scenario.
  *   **Typical Mistake (Costs 2-4 marks):** Claiming Russell solves the problem by making relations internal or by denying the existence of relations entirely.

  **4. Identification of the Directionality/Ordering Problem (4 Marks)**
  *   **Required Move:** Highlights the asymmetry between 'A gives B to C' and 'C gives B to A' and identifies this order as a new site for potential unity failure.
  *   **Typical Mistake (Costs 2-4 marks):** Ignoring the directional asymmetry or treating the proposition as symmetrical (order-independent).

  **5. Evaluation of Relocated Regress (4 Marks)**
  *   **Required Move:** Evaluates whether securing the order requires a further fact/relation, thereby restarting the regress, or if Russell's solution holds against this specific challenge.
  *   **Typical Mistake (Costs 2-4 marks):** Concluding definitively that Russell succeeds or fails without analyzing whether the *ordering* itself generates a new regress similar to the original linking problem.

  \answer{20}
