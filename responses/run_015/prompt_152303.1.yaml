prompt: |-
  I am the ethics compliance officer for an ed-tech firm that deploys adaptive tutoring algorithms in state secondary schools. Each week I must review proposed algorithmic interventions, with forty-five minutes per case, using only an undergraduate background in applied ethics, and my sign-off is mandatory before deployment. I need a reusable audit procedure that operationalises the principle of "respect for rational pedagogical agency" — that a learner's cognitive effort must not be treated as a mere optimisable input, but must be honoured as an expression of rational self-direction, except where there is clear evidence of imminent severe harm, in which case any override must be transparent, proportionate, and revisable by the learner.

  Please construct the procedure as an ordered sequence of checks that a non-philosopher can run: for each step state the precise question, what counts as a sufficient answer, where the procedure halts with a rejection, where it hands the decision to human judgment because values rather than facts are at stake, and where it permits sign-off. The procedure must distinguish (a) transparent adaptation revisable by the learner, (b) opaque optimisation that treats cognitive load as a variable to be managed without disclosure, and (c) justified paternalistic override. Include explicit criteria for identifying "imminent severe harm" and "revisability" in this context.

  Then run the procedure on three proposals:

  1. The system detects repeated failure in calculus exercises and automatically substitutes simpler problems without notifying the student, projecting a thirty per cent retention gain.

  2. The system receives an explicit student instruction to "increase difficulty," detects concurrent physiological stress markers, maintains the harder setting, but sends a message explaining the tension by reference to the student's previously stated goal of passing the university entrance examination, and provides a one-click option to revert.

  3. A student from a minority-language background consistently selects easier texts; the algorithm infers, without direct evidence, that this choice reflects family pressure rather than authentic preference, and proposes to override the selection.

  Please include at least one case where the procedure yields an answer I am likely to dislike as an efficiency-focused officer. Clearly state what the procedure cannot settle, and flag any points where professional judgment remains unavoidable.

  Finally, please indicate how confident you are in the answers given, and identify the specific point about which you are least certain.
reasoning: |-
  Here's a thinking process that leads to the suggested audit procedure and case analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Ethics Compliance Officer for an ed-tech firm.
      *   **Context:** Adaptive tutoring algorithms in state secondary schools.
      *   **Constraints:** 45 minutes per case, undergraduate background in applied ethics (non-philosopher), mandatory sign-off.
      *   **Core Principle:** "Respect for rational pedagogical agency" (learner's cognitive effort $\neq$ optimizable input; must honor rational self-direction).
      *   **Exception:** Imminent severe harm (override must be transparent, proportionate, revisable).
      *   **Deliverable 1:** A reusable audit procedure (ordered sequence of checks).
          *   Must include: Precise question, sufficient answer, halt/reject points, human judgment flags, sign-off points.
          *   Must distinguish: (a) Transparent adaptation, (b) Opaque optimization, (c) Justified paternalistic override.
          *   Must define: "Imminent severe harm" and "Revisability."
      *   **Deliverable 2:** Run the procedure on three specific proposals.
          *   Case 1: Auto-simplify calculus (opaque, efficiency gain).
          *   Case 2: Maintain difficulty despite stress (transparent, revisable, goal-aligned).
          *   Case 3: Override minority-language text choice (inferred preference).
      *   **Requirement:** Include at least one case where the result conflicts with efficiency goals.
      *   **Requirement:** State what the procedure *cannot* settle and where professional judgment is unavoidable.
      *   **Requirement:** Indicate confidence level and point of least certainty.

  2.  **Drafting the Audit Procedure (The "Rational Pedagogical Agency Audit" - RPAA):**

      *   *Goal:* Make it actionable for a non-philosopher within 45 mins.
      *   *Structure:* Step-by-step flowchart style.
      *   *Key Definitions:* Need to operationalize "Imminent Severe Harm" and "Revisability" early so they can be used in the steps.
      *   *Step 1: Transparency Check.* Is the student told? If no, it's likely (b) Opaque Optimization.
      *   *Step 2: Agency Check.* Does the student have control? (Revisability).
      *   *Step 3: Harm Assessment.* If agency is overridden, is there harm?
      *   *Step 4: Justification.* Is the override proportional?
      *   *Decision Nodes:* Reject, Approve, Escalate.

      *Refining the Definitions:*
      *   *Imminent Severe Harm:* Needs to be more than "failing a test." Think self-harm, radicalization, severe psychological distress. In an ed-tech context, this is high bar.
      *   *Revisability:* Can the student undo the change *during* the session or immediately after? Is the mechanism obvious?

      *Drafting the Steps:*
      *   Step 1: Disclosure. (Is the intervention visible?)
      *   Step 2: Control. (Can the student change it?)
      *   Step 3: Harm Trigger. (If 1 or 2 are 'No', is there harm?)
      *   Step 4: Evidence. (Is the harm evidence clear or inferred?)
      *   Step 5: Proportionality. (Is the override the least restrictive means?)

      *Mapping to Categories:*
      *   (a) Transparent + Revisable = Pass.
      *   (b) Opaque + No Control + No Harm Justification = Fail.
      *   (c) Override + Harm Justification + Transparent + Revisable = Pass (with conditions).

  3.  **Running the Procedure on the Cases:**

      *   *Case 1 (Calculus Simplification):*
          *   Transparency? No ("without notifying").
          *   Control? Implicitly No (automatic).
          *   Harm? No (just "repeated failure," not severe harm).
          *   Result: **Reject.** (This conflicts with efficiency/retention goals).
      *   *Case 2 (Stress vs. Goal):*
          *   Transparency? Yes ("sends a message").
          *   Control? Yes ("one-click option to revert").
          *   Harm? Stress markers, but student instructed increase.
          *   Result: **Approve (Category A).** It respects agency while informing.
      *   *Case 3 (Minority Language):*
          *   Transparency? Unclear, but implies override.
          *   Control? Override proposed.
          *   Harm? "Family pressure" is inferred, not imminent severe harm.
          *   Evidence? "Without direct evidence."
          *   Result: **Reject.** (Paternalism based on inference violates agency).

  4.  **Addressing Specific Constraints:**

      *   *Efficiency Conflict:* Case 1 is the obvious one. It projects a 30% retention gain (efficiency) but fails the ethics audit (opaque optimization). I need to make sure this is highlighted.
      *   *Uncertainty/Limits:* The procedure can't define "Severe Harm" perfectly in every edge case. It can't measure "authentic preference" perfectly (Case 3). Professional judgment is needed on the *degree* of stress or the *validity* of harm claims.
      *   *Confidence:* I need to self-assess. I am confident in the logic, but least certain about the operational definition of "Imminent Severe Harm" in a school setting (e.g., is academic failure ever severe enough?).

  5.  **Refining the Output (Self-Correction/Polishing):**

      *   *Tone:* Professional, procedural, clear.
      *   *Formatting:* Use bolding, lists, and clear headers to make it skimmable (45-min constraint).
      *   *Check:* Did I define "Revisability" explicitly? Yes, need to ensure it's in the definitions section.
      *   *Check:* Did I distinguish (a), (b), (c)? Yes, the outcome of the audit should classify them.
      *   *Check:* Did I flag where human judgment is needed? Yes, specifically on harm thresholds.

      *(Self-Correction during drafting Step 3)*: I need to make sure the "Harm" check only triggers if the previous checks (Transparency/Control) fail. If Transparency and Control are present, Harm doesn't need to be assessed for approval (that's Category A). If they are absent, Harm is the *only* justification for proceeding (Category C). If absent and no Harm, it's Category B (Reject).

      *(Refining "Imminent Severe Harm")*: In a school context, this is tricky. It shouldn't be "failing a class." It should be risk of dropout due to crisis, self-harm, or safeguarding issues. I will define it narrowly to prevent abuse.

      *(Refining "Revisability")*: Must be immediate and low-friction. "Email support within 48 hours" is not revisable. "One-click" is.

  6.  **Final Review against Prompt:**
      *   Ordered sequence? Yes.
      *   Precise question/sufficient answer/halt/hand-off? Yes.
      *   Distinguish (a), (b), (c)? Yes.
      *   Criteria for harm/revisability? Yes.
      *   Run on 3 proposals? Yes.
      *   Case I dislike (efficiency)? Case 1.
      *   What procedure cannot settle? Subjective interpretation of "authentic preference" and exact harm threshold.
      *   Confidence/Least Certain? Included at end.

  7.  **Final Polish:** Ensure the distinction between "Human Judgment" (values) and "Procedure" (facts/rules) is clear. The procedure should flag *when* to escalate to a human committee, not try to solve value conflicts itself.

      *Wait, one nuance:* The prompt asks where the procedure "hands the decision to human judgment because values rather than facts are at stake." I need to make sure there is an "Escalate" step for ambiguous harm cases.

      *Let's build the "Escalate" step:* If harm is claimed but evidence is ambiguous (not clear imminent harm, but not clearly safe), escalate.

      *Okay, ready to write.*
answer: |-
  # The Rational Pedagogical Agency Audit (RPAA)
  **Version:** 1.0 | **Time Limit:** 45 Minutes | **Authority:** Ethics Compliance Officer

  ## Part 1: Operational Definitions
  *Before beginning the checks, confirm the following definitions apply to the case.*

  1.  **Imminent Severe Harm:** Evidence indicating a high probability of immediate physical injury, severe psychological crisis (e.g., panic attack requiring intervention), radicalization, or safeguarding breach. *Academic underperformance, frustration, or standard test failure do not qualify.*
  2.  **Revisability:** The learner can undo or alter the algorithmic intervention **within the current session** via a mechanism requiring **no more than two clicks/actions**, without penalty to their progress record or standing.
  3.  **Transparent Adaptation:** The learner is notified *before* or *at the moment* of intervention regarding *what* is changing and *why*.

  ---

  ## Part 2: The Audit Procedure

  ### Step 1: The Transparency Check
  **Question:** Is the learner explicitly notified that an algorithmic intervention is occurring, including the nature of the change and the reason for it?
  *   **Sufficient Answer:** Yes, via UI notification, pop-up, or verbal script provided to the teacher/student.
  *   **If NO:** Proceed to **Step 3** (Potential Opaque Optimization or Paternalism).
  *   **If YES:** Proceed to **Step 2**.

  ### Step 2: The Agency Check (Revisability)
  **Question:** Does the learner have immediate, low-friction control to reject or modify this intervention?
  *   **Sufficient Answer:** Yes. A "Revert," "Ignore," or "Adjust" button is visible and functional within the session.
  *   **If YES:** **PERMIT SIGN-OFF.**
      *   *Classification:* **(a) Transparent Adaptation Revisable by Learner.**
      *   *Note:* No further harm assessment needed; agency is preserved.
  *   **If NO:** Proceed to **Step 3**.

  ### Step 3: The Harm Justification Check
  **Question:** Is the intervention designed to prevent **Imminent Severe Harm** (as defined above)?
  *   **Sufficient Answer:** Yes, supported by data logs, safeguarding alerts, or clinical indicators (not merely academic metrics).
  *   **If NO:** **HALT WITH REJECTION.**
      *   *Classification:* **(b) Opaque Optimization.**
      *   *Reasoning:* Treating cognitive load as an optimizable input without consent violates rational pedagogical agency. Efficiency gains are insufficient justification.
  *   **If YES:** Proceed to **Step 4**.

  ### Step 4: The Evidence Quality Check
  **Question:** Is the evidence for harm direct and objective, or is it inferred from behavioral proxies?
  *   **Sufficient Answer:** Direct/Objective (e.g., self-report of crisis, biometric threshold breach calibrated to crisis, safeguarding flag).
  *   **If INFERRED/PROXY (e.g., "inferred family pressure," "predicted dropout risk"):** **HAND TO HUMAN JUDGMENT.**
      *   *Reasoning:* Values are at stake regarding cultural interpretation and privacy. The procedure cannot settle the validity of inferred preferences.
  *   **If DIRECT:** Proceed to **Step 5**.

  ### Step 5: The Proportionality & Exit Check
  **Question:** Is the override the least restrictive means necessary, and is a "Revisability" mechanism provided once the immediate harm risk passes?
  *   **Sufficient Answer:** Yes. The intervention lasts only as long as the risk persists, and control returns to the learner immediately after.
  *   **If NO:** **HALT WITH REJECTION.** (Override is disproportionate).
  *   **If YES:** **PERMIT SIGN-OFF (Provisional).**
      *   *Classification:* **(c) Justified Paternalistic Override.**
      *   *Condition:* Must be logged for weekly review by the Ethics Board.

  ---

  ## Part 3: Audit of Proposals

  ### Case 1: The Calculus Simplification
  *Proposal: System detects repeated failure, auto-substitutes simpler problems without notification, projects 30% retention gain.*

  1.  **Transparency Check:** **NO.** ("Without notifying the student").
  2.  **Agency Check:** **NO.** (Automatic substitution implies no immediate revert option).
  3.  **Harm Justification:** **NO.** ("Repeated failure" is academic underperformance, not Imminent Severe Harm).
  4.  **Result:** **HALT WITH REJECTION.**
      *   **Classification:** (b) Opaque Optimization.
      *   **Efficiency Conflict:** This proposal projects a 30% retention gain. Rejecting it prioritizes ethical agency over metric efficiency.
      *   **Officer Note:** You must reject this. Optimizing for retention by hiding the difficulty curve treats the student's struggle as a bug to be fixed rather than a pedagogical process to be experienced.

  ### Case 2: The Stress vs. Goal Conflict
  *Proposal: Student requests "increase difficulty." System detects physiological stress. System maintains difficulty, sends message explaining tension relative to exam goal, offers one-click revert.*

  1.  **Transparency Check:** **YES.** ("Sends a message explaining the tension").
  2.  **Agency Check:** **YES.** ("Provides a one-click option to revert").
  3.  **Result:** **PERMIT SIGN-OFF.**
      *   **Classification:** (a) Transparent Adaptation Revisable by Learner.
      *   **Officer Note:** The system respects the student's prior rational commitment (exam goal) while informing them of current state. The "one-click" satisfies revisability.

  ### Case 3: The Minority-Language Inference
  *Proposal: Student selects easier texts. Algorithm infers family pressure (no direct evidence). Proposes to override selection to "empower" student.*

  1.  **Transparency Check:** **UNCLEAR/NO.** (Proposes override).
  2.  **Agency Check:** **NO.** (Override implies removal of choice).
  3.  **Harm Justification:** **CLAIMED BUT WEAK.** ("Family pressure" is posited as harmful).
  4.  **Evidence Quality Check:** **INFERRED/PROXY.** ("Without direct evidence," "Algorithm infers").
  5.  **Result:** **HAND TO HUMAN JUDGMENT.**
      *   **Classification:** Potential (c) but fails Evidence Check.
      *   **Officer Note:** The procedure halts here. Determining whether "family pressure" constitutes *Imminent Severe Harm* or merely cultural difference is a value judgment, not a factual one. An algorithm cannot ethically infer authentic preference over stated choice in cultural contexts without direct safeguarding evidence.
      *   **Action:** Escalate to the Ethics Board. Do not sign off.

  ---

  ## Part 4: Procedural Limitations & Professional Judgment

  **What this procedure cannot settle:**
  1.  **The Threshold of "Severe Harm":** While defined, edge cases (e.g., severe anxiety that does not reach clinical crisis) require professional judgment. The procedure flags these for escalation but does not resolve them.
  2.  **Authentic Preference:** In Case 3, the procedure identifies the *lack of evidence* but cannot determine if the student's choice is truly autonomous or coerced. This requires human investigation (e.g., counselor interview), not algorithmic inference.
  3.  **Long-term vs. Short-term Agency:** The procedure prioritizes immediate revisability. It cannot fully account for "soft paternalism" where limiting choice now expands it later (e.g., forcing study habits that become enjoyable later), unless framed as transparent adaptation.

  **Where Professional Judgment is Unavoidable:**
  *   **Step 4 (Evidence Quality):** Distinguishing between a "safeguarding flag" (objective) and a "risk prediction" (subjective/probabilistic) requires human interpretation of the data source.
  *   **Escalation Decisions:** When the procedure hands to human judgment, you must decide *who* judges (e.g., cultural liaison, child psychologist).

  ---

  ## Part 5: Confidence Assessment

  **Overall Confidence:** **High (85%)**
  The procedure logically operationalizes the core principle of "rational pedagogical agency" by prioritizing transparency and control, creating a high bar for paternalism that aligns with standard bioethical frameworks (autonomy vs. beneficence).

  **Point of Least Certainty:** **The Definition of "Imminent Severe Harm" in an Educational Context.**
  I am least certain whether the definition provided ("physical injury, severe psychological crisis") is too narrow for a school setting. There is a philosophical debate on whether *educational abandonment* (dropping out due to preventable frustration) constitutes "severe harm."
  *   *Risk:* If defined too narrowly, we miss opportunities to prevent dropout.
  *   *Risk:* If defined too broadly, "preventing dropout" becomes a blanket justification for opaque optimization (Case 1), destroying the principle of agency.
  *   *Recommendation:* Stick to the narrow definition for the algorithm. Dropout prevention should be achieved through Transparent Adaptation (Case 2 style), not Paternalistic Override.

  **Efficiency Conflict Acknowledgement:**
  As an efficiency-focused officer, you will likely dislike the **rejection of Case 1**. The procedure explicitly sacrifices a projected 30% retention gain to maintain the ethical boundary against opaque optimization. This is a feature, not a bug, of the "Respect for Rational Pedagogical Agency" principle.
