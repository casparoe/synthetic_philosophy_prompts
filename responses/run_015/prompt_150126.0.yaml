answer: |-
  1. **The Four Readings Unpacked**

  First, the **conceptual reading** claims that the *meaning* of "responsible" is analytically tied to being a proper target for attitudes like resentment. This is substantive if it reveals the essence of responsibility, but trivial if it merely stipulates definitions. Second, the **metaphysical reading** asserts that responsibility is *constituted* by the actual existence of these attitudes. This is a strong ontological claim: no feelings, no responsibility. It is likely false, as responsibility might exist even if no one is around to feel it.

  Third, the **normative reading** argues that we *ought* to restrict blame to cases where reactive attitudes are fitting. This is substantive and ethical, focusing on when blame is justified rather than what blame *is*. Finally, the **sociological reading** suggests this is merely an empirical claim about how ordinary speakers use the word. This is contingent and trivial; it describes usage without settling philosophical truth.

  The boundaries blur when debaters treat the sociological fact (we don't feel it) as proof of the metaphysical claim (it isn't responsible). The conceptual and normative readings overlap when one argues that because the concept involves fittingness, we are normatively bound to follow it. However, the metaphysical reading stands apart as the most vulnerable; it collapses responsibility into psychology, making it vanish if humans become emotionally numb. The normative reading is the most robust, allowing responsibility to exist independently of actual emotional reactions, grounded instead in reasons for those reactions.

  2. **Strawson's Actual View**

  Strawson's position is primarily a transcendental argument about the framework of human life, not a metaphysical reduction. He argues that reactive attitudes are not just optional additions to morality but constitutive of interpersonal relationships themselves. He does not claim responsibility *is* the feeling (metaphysical), nor merely that we *should* feel it (normative). Instead, he suggests that asking whether someone is responsible *just is* asking whether they are an appropriate target for these attitudes within our shared form of life.

  Therefore, the metaphysical reading is a misattribution; Strawson isn't saying responsibility vanishes without feelings, but that the *question* loses its sense outside the practice. The sociological reading is too weak; he isn't just reporting usage but defending the inevitability of the practice. The normative reading is closest, but Strawson goes further: he argues we cannot practically abandon these attitudes without ceasing to be human. Thus, debates treating his view as a simple definition or an empirical claim miss his deeper point about the inescapability of the participant stance.

  3. **The Slide Between Actual Feeling and Appropriateness**

  The slide you notice is a classic **equivocation** between descriptive psychology and normative fittingness. When debaters say, "We don't feel resentment toward the algorithm," they make a descriptive claim. When they retreat to, "It wouldn't be appropriate to feel resentment," they shift to a normative claim. These are not the same thesis. The first relies on contingent human psychology; the second relies on objective reasons or standards of correctness.

  The view that appropriateness is independent of actual feeling is typically called the **Fittingness View** or **Correctness Condition** theory of emotions. It holds that an emotion is appropriate if it matches its object, regardless of whether anyone actually experiences it. The mistake occurs when speakers use the lack of actual feeling (descriptive) as evidence for the lack of fittingness (normative). This is an error because humans often fail to feel what is fitting (e.g., failing to resent a subtle injustice) or feel what is unfitting (e.g., resenting a hurricane). Conflating the two allows debaters to bypass the hard work of proving why an algorithm lacks the features that make resentment fitting, relying instead on the brute fact that we currently don't feel it.

  4. **Bottom Line for AI and Psychopath Cases**

  For AI, only the **normative reading** delivers a stable conclusion. The metaphysical reading fails because if we programmed AI to simulate resentment, responsibility might magically appear. The descriptive reading fails because our current lack of feeling is contingent. We must ask: does the AI possess the capacities (reasons-responsiveness, reciprocity) that make resentment *fitting*? The slogan alone doesn't answer this; it merely frames the question.

  For psychopaths, the normative reading clarifies the dispute. Those saying we should take an "objective attitude" argue resentment is *unfitting* due to the psychopath's incapacity for moral reciprocity. Those saying we should keep resenting argue the attitude remains *fitting* regardless of utility. The slogan doesn't solve this; it forces us to decide if moral capacity is a condition for fittingness. Ultimately, the slogan is a placeholder for the real debate: what properties make an agent a valid target of moral demand? Without answering that, the slogan is merely rhetorical camouflage.
