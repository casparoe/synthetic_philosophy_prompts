answer: |-
  There is one account: a human classification loops if and only if its issuance becomes a causal variable in the production or modification of the classified traits, mediated either by the subject's self-conception or by the social environment acting upon the subject.

  This principle unifies your cases by distinguishing the *mechanism* of looping from the *fact* of looping. Your condition (i) (learnable/applicable) maps to the availability of the causal pathway; your condition (ii) (practical difference) maps to the causal output; but your condition (iii) (narratively incorporable) must be demoted from a necessary condition to an amplifier of intensity. This explains why ADHD loops "hard" (high narrative incorporation + behavioral change) while Type 2 diabetes loops "little" (low narrative incorporation + mostly physiological management), and why the fractured femur does not loop at all (the bone does not care about the label, and the label does not change the healing biology beyond standard care protocols). The polygenic risk case loops because the "social environment" clause covers parental behavior modifying the child's development, even without the child's uptake. The rejected label loops because resistance is a causal pathway mediated by self-conception (even if negative) and social treatment. The 1890s fugue cases loop maximally because the diagnosis provided a script for both self-conception and social expectation simultaneously.

  To make this principle work, you must drop two verdicts. First, you must abandon the intuition that "no uptake, no loop." Uptake is required only for *self-conception* looping, not for looping per se. Second, you must correct your verdict on undisclosed dementia: it *does* loop at the level of the patient, because the family's changed behavior (care regimes, restrictions, tone) alters the patient's daily experience and behavioral outputs, even if the patient's autobiographical narrative remains static. Your negative case is not negative; it is merely a loop mediated exclusively by the environment rather than the self. Consequently, your "incentive-driven looping" clause is not a separate phenomenon but a subset of environmental mediation where the causal pathway runs through institutional rewards rather than interpersonal care.

  Applied to your new cases: Classifying obesity as a disease loops moderately to highly; it shifts self-conception (from moral failing to medical condition) and alters environmental treatment (insurance coverage, medical surveillance), though stigma may sustain a negative feedback loop. Labelling children as gifted loops hard via the Pygmalion effect; the label alters teacher expectations and resource allocation (environment), which the child often incorporates into their academic identity (self-conception). An algorithmic burnout-risk score loops only if the output triggers action; if hidden and unused, it is inert, but if it dictates shift changes without the employee's knowledge, it loops via environmental constraint (schedule stress) without self-conception, similar to the undisclosed dementia case.

  On realism: Looping is neutral on whether a kind is real; it tells us only that the kind is *interactive* rather than *indifferent*. A looping kind can be fully real (like a weather system that changes when measured) provided it tracks a stable cluster of properties prior to classification and the feedback effects are systematic rather than arbitrary. For looping to imply unreality, the classification would have to fail to predict any pre-existing clustering of traits and the subsequent changes would have to be random noise rather than structured feedback; short of that, looping confirms the kind is a dynamic element of social reality, not that it is an illusion.
