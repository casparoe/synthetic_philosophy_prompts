answer: |-
  Here are ten questions tailored for that specific view. They're designed to bypass the intro stuff and go straight for the tension points in her hybrid model. I've kept the tone conversational but sharp—think "informed host who's read the draft but isn't afraid to poke the bear."

  ### 1. The "Normal Conditions" Swap
  You're replacing Millikan's "Normal Conditions" with control-theoretic setpoints to solve the disjunction problem. The move seems to be: instead of asking what happened in the past, we ask what variable the system is currently trying to keep stable. But isn't a setpoint just a "Normal Condition" dressed up in engineering syntax? If the setpoint is defined by what the system *ought* to track to function, haven't you just relabeled the explanatory gap rather than bridging it?

  *   **Follow-up:** If she says the setpoint is empirically identifiable via error-correction dynamics: "Okay, but error signals are just causal mismatches. How does a causal mismatch become a *semantic* error without already assuming the system is 'about' the thing it's failing to track?"

  ### 2. The Frog and the BB (Misrepresentation)
  Let's hit the classic frog case. A frog snaps at a fly. On your view, the setpoint is fixed by the control loop. But a BB pellet moving at fly-speed triggers the same loop. If the setpoint is 'small dark moving thing,' you get the disjunction problem back. If the setpoint is 'nutritious fly,' the frog can't detect that directly. How does the control architecture distinguish between a false positive (BB) and a true positive (Fly) without smuggling in an intentional description of the *outcome* rather than the *input*?

  *   **Follow-up:** If she argues the setpoint is fixed by the *success condition* of the snap: "But that makes content dependent on the *consequence* of the action, not the content of the representation. Does the frog only misrepresent the BB *after* it fails to digest it? That seems to make the content backward-looking, which undercuts the control theory advantage."

  ### 3. Normativity vs. Engineering Specs
  Teleosemantics is popular because it promises to naturalize normativity—explaining 'false' beliefs without magic. But control theory is full of norms (e.g., 'deviation from setpoint'). Aren't you just outsourcing the normativity to the engineer who designed the system? In a biological system, there is no engineer. If you say 'evolution is the engineer,' aren't you grounding semantic norms in the indifferent grinding of natural selection, which doesn't care about truth, only fitness?

  *   **Follow-up:** If she claims homeostasis naturalizes the 'ought': "A thermostat maintains a setpoint, but we don't say it has 'false beliefs' when the room is cold. What's the categorical difference between a homeostatic loop in a brain and one in a furnace that grants the former semantic content?"

  ### 4. Evolution vs. Individual Learning
  Your backbone is Millikanian, so content is fixed by evolutionary history. But humans acquire concepts for things that didn't exist in the EEA (Environment of Evolutionary Adaptedness)—like 'bitcoin' or 'quantum field.' If the setpoints are selected by evolution, how do you get content for culturally novel concepts? Do you have to say we literally lack mental content for modern technology, or does individual learning history override the evolutionary setpoint?

  *   **Follow-up:** If she says learning history can recalibrate setpoints: "If individual learning can fix content, why do we need the evolutionary history at all? Doesn't that collapse your view into a standard causal covariation theory, which you rejected in the first place?"

  ### 5. The Distal Problem
  Control systems typically regulate proximal variables (e.g., retinal stimulation, muscle tension). But mental content is usually distal (e.g., 'there is a cat'). If your setpoints are internal regulatory targets, how do you guarantee the content reaches out to the external object? How do you prevent the theory from implying that the frog is actually representing 'retinal shadow' rather than 'fly'?

  *   **Follow-up:** If she argues the control loop closes on the external object: "The causal chain has gaps. Light bounces, hits the eye, triggers neurons. If the setpoint is the external object, the system is open-loop, not closed. How do you maintain strict control-theoretic rigor while keeping the content distal?"

  ### 6. Determinacy and Indeterminacy
  Quine argued that reference is indeterminate. In control theory, multiple variables can often be regulated by the same feedback loop (degeneracy). Why is the setpoint *this* specific variable and not a slightly broader or narrower one? What fixes the determinacy of the content? If the biology allows for sloppy control, does the content become sloppy too?

  *   **Follow-up:** If she appeals to biological specificity: "Neural degeneracy suggests the same function can be realized by different physical states. If the physical realization is flexible, why is the semantic content rigid? Isn't the setpoint just as indeterminate as the neural firing pattern?"

  ### 7. The Homunculus Worry
  Setting a setpoint implies a standard of comparison. In a machine, a programmer sets it. In your view, evolution sets it. But evolution doesn't have a mind. Are you relying on a metaphorical homunculus? When you say the system 'tracks' a setpoint, are you describing a mechanical process or attributing a goal that only exists from the *observer's* perspective?

  *   **Follow-up:** If she insists the goal is intrinsic to the mechanism: "Then explain how a purely physical system generates an intrinsic 'aim' without circularity. If the aim is just 'what it does,' you lose misrepresentation. If the aim is 'what it should do,' where does the 'should' come from physically?"

  ### 8. Belief vs. Desire
  Millikan distinguishes pushmi-pullyu representations (directions for action) from descriptive maps. Control theory is inherently action-oriented (minimize error). Does your account collapse belief into desire? If the brain is just a set of error-minimizing loops, is there any room for a representation that doesn't immediately demand action?

  *   **Follow-up:** If she says some loops are decoupled for planning: "If a loop is decoupled from action, it's not controlling anything. If it's not controlling, where is the setpoint? Does your theory imply that purely theoretical beliefs (like 'the universe is expanding') have no content because they aren't regulating a biological variable?"

  ### 9. The "Zombie" Control System
  If we built a robot with this exact architecture—Millikan-style selected functions simulated via evolutionary algorithms, running on control-theoretic setpoints—would it have genuine mental content? Or is there a biological constraint? If the robot has content, is teleosemantics actually a theory of biology, or just a theory of cybernetics?

  *   **Follow-up:** If she says the robot *would* have content: "Then intentionality is substrate-neutral. Why tie the theory to Millikan's biological selection at all? Why not just say 'any control system with a history of selection has content,' even if that selection was artificial?"

  ### 10. The Explanatory Payoff
  Finally, what does this modification *do* that standard teleosemantics doesn't? If Normal Conditions and Control Setpoints yield the same verdicts in 90% of cases, but the control theory adds significant metaphysical baggage (engineering specs, error dynamics), what's the win? Is it purely solving the disjunction problem, or does this open up empirical avenues for cognitive science?

  *   **Follow-up:** If she says it makes the theory empirically testable: "Great. Give me a concrete prediction. Is there a case where Normal Conditions say 'content X' and Control Setpoints say 'content Y,' and we can run an experiment to see who's right? If not, aren't we just arguing over labels?"
