          *   Does control theory really fix content, or just describe causal dynamics?
          *   Evolution vs. Learning: If content is fixed by selection, how do we get concepts for things that didn't exist in the EEA (Environment of Evolutionary Adaptedness), like "bitcoin" or "quantum field"?
