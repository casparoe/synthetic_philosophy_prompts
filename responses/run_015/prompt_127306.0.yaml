          *   *Follow-up:* If she appeals to plasticity, ask if that collapses teleosemantics into causal covariation.
      *   *Q5: The "Homunculus" Worry.* Control systems usually imply a designer setting the setpoint. Who sets the brain's setpoint? Evolution?
