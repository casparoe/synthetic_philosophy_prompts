  Dana's verdicts present a classic puzzle in normative ethics, specifically within the literature on market alienability. To reverse-engineer her principle, we need to find a rule that prohibits kidney and vote sales while permitting plasma sales. Here are the three candidate rules that fit her track record, their predictions for the postmortem case, and an analysis of which is most likely.

  ### Candidate Rules and Predictions

  **1. The Exploitation Rule**
  *   **Principle:** Markets are impermissible when they prey on vulnerability or desperate bargaining positions. The concern is not the good itself, but the coercive pressure on the seller.
  *   **Fit:** Living kidney sales often involve poor sellers and rich buyers (Impermissible). Vote selling similarly allows the wealthy to buy political power from the needy (Impermissible). Plasma is permitted perhaps because the low physical risk makes the autonomy benefit outweigh the exploitation risk, or because it is viewed as labor rather than asset stripping.
  *   **Prediction for Postmortem Case:** **Impermissible.** The student is "broke," indicating high vulnerability. Even though she is dead at the time of transfer, the contract was signed under financial duress.

  **2. The Harm Rule**
  *   **Principle:** Transactions are impermissible if they cause significant irreversible detriment to the seller's welfare (physical or civic).
  *   **Fit:** Living kidney removal harms biological functioning (Impermissible). Selling a vote harms the civic functioning of the polity and the seller's status as a citizen (Impermissible). Plasma donation is regenerable with minimal health impact (Permissible).
  *   **Prediction for Postmortem Case:** **Permissible.** The seller is deceased; she suffers no physical pain, surgical risk, or loss of future functioning. Unless one argues for "harm to the estate" or "harm to societal altruism," the seller herself is unharmed.

  **3. The Special-Goods (Commodification) Rule**
  *   **Principle:** Certain goods possess a dignity or social meaning that is degraded when treated as a commodity. These items belong to a sphere of non-market exchange (e.g., the human body, civic rights).
  *   **Fit:** Kidneys are constitutive parts of the self (Impermissible). Votes are civic duties, not property (Impermissible). Plasma is often categorized differently—as a regenerable fluid or service—making it less central to personal identity or dignity (Permissible).
  *   **Prediction for Postmortem Case:** **Impermissible.** Even after death, the human body and its organs are typically viewed as retaining a status that resists commodification. Turning cadavers into inventory violates the symbolic dignity of the person.

  ### Best Guess: Dana's Actual Verdict

  Dana will likely rule the postmortem kidney sale **impermissible**.

