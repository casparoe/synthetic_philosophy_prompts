answer: |-
  ### Step 1: Brainstorming the Logical Forms

  Before we dissect the slogan, we need to see what kind of logical work it's trying to do. When your flatmate says "The monarch reigns but does not govern," they are deploying a phrase that could function in four distinct ways:

  1.  **Empirical/Descriptive:** A claim about frequency. (e.g., "99% of the time, the monarch does nothing political.")
  2.  **Legal/Formal:** A claim about statutory authority. (e.g., "The law requires a minister to sign off on all acts.")
  3.  **Conventional/Normative:** A claim about unwritten rules. (e.g., "Even if they could, tradition forbids it.")
  4.  **Functional:** A claim about role separation. (e.g., "The head of state is for unity; the head of government is for policy.")

  The problem is your flatmate is using the *Empirical* or *Functional* version to dismiss a *Legal* or *Conventional* risk. You are arguing about the existence of a weapon (reserve powers); they are arguing about how often the weapon is fired.

  ***

  ### Step 2: The Menu of Interpretations

  Here are the three precise claims the slogan usually hides behind. You can pick the one that fits your argument best.

  #### 1. The "Routine Politics" Claim (Descriptive)
  *   **The Claim:** The monarch is excluded from day-to-day executive decision-making (tax, welfare, foreign policy details).
  *   **Truth Value:**
      *   **UK:** True. The Prime Minister and Cabinet run daily operations.
      *   **Scandinavia:** True. (Sweden removed all political power in 1974; Norway and Denmark retain formal powers but don't use them).
      *   **Japan:** True. The Constitution explicitly strips the Emperor of all political power.
  *   **Does it answer your worry?** **No.** This is a straw man. You aren't arguing the monarch sets income tax rates. You are arguing about *exceptional* circumstances (constitutional crises) where reserve powers activate. Saying "they don't drive the bus daily" doesn't prove "they can't slam the brakes in an emergency."

  #### 2. The "Ministerial Shield" Claim (Legal)
  *   **The Claim:** The monarch cannot legally act without a minister's counter-signature accepting responsibility.
  *   **Truth Value:**
      *   **UK:** **False/Partial.** Most prerogative powers require ministerial advice, but the *appointment* of a PM or *dissolution* of Parliament (depending on current statutes) can involve personal discretion. Royal Assent is legally the monarch's act, though convention binds it.
      *   **Scandinavia:** **Mostly True.** In Sweden, the monarch has no government powers at all. In Denmark/Norway, acts require countersignature, but the formal assent remains with the Crown.
      *   **Japan:** **True.** Article 3 of the Constitution requires ministerial advice and consent for all acts.
  *   **Does it answer your worry?** **No.** Reserve powers are defined specifically as the exceptions to this rule. If a Prime Minister loses a vote of confidence but refuses to resign, the monarch's power to dismiss them does not require the PM's signature. This claim ignores the "break glass in case of emergency" clause.

  #### 3. The "Conventional Restraint" Claim (Normative)
  *   **The Claim:** Even if the legal power exists, constitutional convention makes it politically impossible to use.
  *   **Truth Value:**
      *   **UK:** **True (mostly).** Withholding Royal Assent is considered constitutionally impossible by convention, though the legal power remains. The power to appoint a PM is where discretion is real.
      *   **Scandinavia:** **True.** Conventions are so strong they function as law.
      *   **Japan:** **True.** The barrier is both legal and cultural.
  *   **Does it answer your worry?** **Weakly.** This concedes your point while trying to dismiss it. You are arguing about a *democratic deficit*—a structural flaw in the system. Admitting "it only works because everyone agrees to follow unwritten rules" proves the system relies on non-democratic restraint, not democratic structure. If the convention breaks, the deficit becomes a crisis.

  ***

  ### Step 3: The "Negative Sovereignty" Hybrid (Nordic Veto)

  You mentioned a hybrid idea: *the monarch can't initiate policy but can suspend parliamentary acts.*

  *   **Verdict:** This is largely **historical or misunderstood** in the modern context.
  *   **The Reality:**
      *   **Norway:** Until 2007, the King had a suspensive veto (could send a bill back once; Parliament could override after three successive sessions). This was effectively abolished in practice long before then and removed constitutionally recently.
      *   **Sweden:** The 1974 Instrument of Government removed all political power. The monarch cannot suspend acts.
      *   **Denmark:** Royal Assent is required for a bill to become law, but it has not been withheld since 1849. It is a formal power, not a functional "suspension" mechanism.
  *   **Argument Utility:** Do not let your flatmate build on this. If they argue "Scandinavian monarchs can block bad laws," they are citing a mechanism that is either dead (Norway), purely formal (Denmark), or non-existent (Sweden). If their defense of the UK system relies on this being a good thing, point out that modern democracies are removing these powers, not keeping them.

  ***

  ### Step 4: How to Deploy This

  Your flatmate is using a **Descriptive** truth ("they don't govern daily") to hide a **Legal** risk ("they can block legislation").

  **The Counter-Move:**
  Tell him: "You're using the 'Routine Politics' definition to dismiss a 'Reserve Power' concern. I agree they don't set tax rates. But 'reigning not governing' is a convention, not a lock. In the UK, the legal capacity to withhold assent or dismiss a government remains. If the convention fails, the democratic deficit becomes a dictatorship. Saying 'it doesn't happen' doesn't prove 'it can't happen.' In Japan and Sweden, they removed the power entirely. In the UK, we just rely on the monarch's good behavior. That is the deficit."

  This forces him to argue about whether unwritten conventions are sufficient protection for democracy, rather than hiding behind a slogan.
