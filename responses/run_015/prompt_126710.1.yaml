  # Memorandum

  **Arithmetica Capital, LP**
  **Annual Letter to Limited Partners**
  **Date: 31 December 2023**

  Dear Partners,

  Performance relative to the broader market remains challenging. While the S&P 500 appreciated significantly over the last fiscal year, Arithmetica's net asset value has been constrained by the continued non-arrival of the positive check. However, we remind partners that our mandate is not mark-to-market performance, but the capture of intrinsic value derived from the fundamental inequality between geometric population growth and arithmetic resource expansion. We remain constructive on the thesis.

  To maintain discipline regarding the timing of the thesis vindication, the Partnership Agreement requires the maintenance of a Deferral Ledger. Each time the predicted arrival of the check is rescheduled, the specific assumption facilitating the deferral is recorded alongside its expected shelf life and its residual value.^1 The ledger currently contains five entries.

  | Year of Letter | Date Then Predicted | Assumption Entered | Shelf Life (Years) | Residual (%) |
  | :--- | :--- | :--- | :--- | :--- |
  | 1980 | 1990 | Agricultural Yield Lag | 15 | 95 |
  | 1995 | 2010 | Green Revolution Diffusion | 15 | 90 |
  | 2010 | 2020 | Substitution Elasticity | 10 | 85 |
  | 2020 | 2025 | Demand Saturation | 5 | 80 |
  | 2023 | 2026 | Carbon Sink Capacity | 3 | 75 |

  Partners will note that while the core inequality remains unrevised, the average shelf life of recent entries is shorter than that of earlier ones. This reflects a more agile approach to temporal arbitrage. Furthermore, the nature of the exposure has been re-specified. Initially, the fund sought exposure to famine. As agricultural productivity surprised to the upside, exposure was rotated into energy prices. Most recently, positions have been shifted toward waste sinks. In each instance, the underlying constraint—a quantity growing against a ceiling—has been preserved, merely re-expressed to match available liquidity.

  Regarding the twentieth century's apparent refutation: we view this period not as a failure of the model, but as a liquidation event. The escape was purchased by drawing down a one-off endowment—fossil energy, mined phosphate, fossil groundwater.^2 The period usually counted as a refutation is better counted as an instance of the mechanism, a stock being spent. Abundance was simply the drawdown rate exceeding the recharge rate. Consequently, recent prosperity is treated as bullish confirmation that the capital base is being depleted.

  Partners should be aware of the fee structure's impact on long-dated positions. The fund charges a premium for being right early, and that premium compounds. By our arithmetic, the deferral liability now grows at roughly the rate the fund expects population to grow. This creates a convexity where the cost of waiting accelerates alongside the purported threat.^3

  Finally, we are pleased to announce a merger with a rival fund whose thesis was that population pressure induces the innovation that relieves it. The combined book now profits whether the check arrives or is indefinitely postponed. This is described in the offering memorandum as prudent risk management. We believe this consolidation strengthens the partnership's ability to navigate either outcome without prejudice to the underlying conviction.

  Sincerely,

  The General Partner

  ***

  ^1 *Residual measures the proportion of the original Malthusian mechanism preserved after the assumption is applied. A lower residual indicates greater reliance on auxiliary hypotheses.*
  ^2 *This includes aquifers in the Ogallala formation and high-grade phosphate rock deposits in Morocco.*
  ^3 *Auditor's Note: We have reviewed the Deferral Ledger. No single entry is unreasonable in isolation, though the cumulative effect on liability growth is material.*

  # Commentary

  The satire targets the "immunization strategy" often observed in long-run structural predictions. The jokes exaggerate specific features of the Malthusian research tradition: the "Deferral Ledger" mimics the Lakatosian "protective belt," where auxiliary hypotheses are adjusted to save the hard core. The re-specification (famine to energy to sinks) satirizes the shifting of goalposts when specific mechanisms fail to materialize. The "stock drawdown" argument highlights a genuine strength of modern neo-Malthusianism (e.g., ecological footprint analysis), which refrains from predicting immediate collapse by arguing we are currently overshooting carrying capacity.

  A sympathetic philosopher of science might object that the satire is unfair regarding the "right but early" stance. The letter implies the position is immune to failure because any outcome (collapse or innovation) is claimed as vindication, especially after the merger. However, a sympathetic view holds that the core constraint (finite Earth) *is* testable. If dematerialization continues indefinitely without resource bottlenecks, the hard core itself could be unsatisfied. The satire suggests the fund has no content left; a sympathetic philosopher would argue the content lies in the specific, measurable limits of biophysical systems, which remain vulnerable to empirical disconfirmation if technology decouples growth from resource use permanently. The joke obscures that the thesis retains a condition—finite stocks—that could, in principle, go unsatisfied.
