          2.  What's Dennett: Intentional Stance, Counterfeit People, Deception risk.
          3.  What's Searle (The Sneak-in): Original Intentionality, Biological Substrate, In Principle impossibility.
          4.  The Functionalism vs. Substrate issue: Explain why the user's hunch is correct.
          5.  The Ethical Conclusion: Does it follow? (No, because if functionalism is true, suffering is possible).
      *   *Key References:* Mention "The Intentional Stance," "Consciousness Explained," recent interviews (e.g., with Sean Carroll or op-eds), and the Searle/Dennett debates (Chinese Room responses).

  6.  **Refining the "Original Intentionality" Point:**
      *   I need to be careful here. Dennett *does* talk about derived intentionality. But he argues *all* intentionality is derived. The roommate implies humans have *original* (intrinsic) intentionality. That is the specific Searlean move Dennett fights against. I must highlight this distinction clearly.

  7.  **Refining the "Embodiment" Point:**
