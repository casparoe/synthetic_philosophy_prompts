      *   **Repairs/Costs:**
          *   *Fix:* Abandon (a)'s claim that death is purely biological/determinate. Adopt a "normative" view where death is partly constituted by the decision to cease treatment.
          *   *Cost:* Loses the objective "fact" status of death. Makes (i) impossible to maintain.
