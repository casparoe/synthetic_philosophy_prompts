      *   *Correction:* Use Dickie/Danto logic. The "Artworld" confers status. In Israel, the Artworld (survivors, public sentiment) refuses the status of "acceptable art" to Wagner. In Bayreuth, the Artworld confers the status of "high culture" but tries to strip the "Nazi" label via direction.
      *   *Nuance:* Distinguish between the *Score* (Work) and the *Performance* (Instance). Separation thesis usually protects the Score. But we experience the Performance.
