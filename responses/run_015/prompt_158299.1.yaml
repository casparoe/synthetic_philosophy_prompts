answer: |-
  You have put your finger on a very specific, high-level rhetorical maneuver that sits at the intersection of logic, historiography, and philosophy of science.

  There is no single common English idiom for this *exact* historical pattern, but in the philosophy of science, it is formally known as an **Immunizing Stratagem** (or *Immunization against Falsification*). This term was coined by the philosopher Hans Albert (building on Karl Popper) to describe when a theorist protects a core belief from counter-evidence by adding ad hoc assumptions that cannot be tested.

  However, "Immunizing Stratagem" is broad. It applies to theology, economics, and physics. Since you are asking about the specific *historical* flavor of this—where **slow, structural variables are swapped interchangeably to deny the agency of events**—I will coin a specific term for this context:

  ### **The Deep-Structure Shield**

  Here is the breakdown of the term, the edges of what counts, and how to distinguish it from legitimate historical complexity.

  ---

  ### 1. The Definition
  **The Deep-Structure Shield** occurs when an arguer treats "slow-moving background forces" (geography, climate, demography, deep culture) as a monolithic class of explanation. When a specific slow force (e.g., geography) is disproven by a counter-example, the arguer swaps in a different slow force (e.g., climate) without abandoning the core conclusion: *that fast-moving events (wars, laws, decisions) are irrelevant.*

  The "Shield" is not the specific variable (mountains vs. drought); the Shield is the **timescale** itself. As long as the explanation remains "slow," the conclusion remains "protected."

  ### 2. Mapping the Edges: What Counts?
  To qualify as a *Deep-Structure Shield*, the argument must meet three criteria. If it misses one, it's just a standard historical debate.

  #### A. The Timescale Mismatch (The "Speed" Edge)
  *   **Counts:** Swapping one long-term variable for another (Geography $\rightarrow$ Climate $\rightarrow$ Genetic Drift). Both operate on centuries/millennia.
  *   **Doesn't Count:** Swapping a slow variable for a fast one. If they say, "The mountains didn't save them, but the *General's decision* did," they have abandoned the Shield. They are now arguing for event-based causality.
  *   **Why:** The core dogma being protected is **Event-Denial**. The specific variable is secondary; the *slowness* is the protection.

  #### B. The Interchangeability Clause (The "Variable" Edge)
  *   **Counts:** The variables must be treated as functionally equivalent in their determinism. The arguer implies, "It doesn't matter *which* slow force it was, only that *a* slow force was there."
  *   **Doesn't Count:** Acknowledging interaction. If they say, "The mountains mattered, *but* they only worked because of the drought, *and* even then the invasion almost succeeded," they are describing **complexity**, not using a Shield.
  *   **Why:** The Shield requires the variables to be fungible tokens used to block the event argument, not distinct factors being weighed.

  #### C. The Deterministic Core (The "Conclusion" Edge)
  *   **Counts:** The conclusion remains rigid: "Change was inevitable/impossible regardless of human action."
  *   **Doesn't Count:** Shifting the conclusion. If the counter-example forces them to say, "Okay, maybe events *do* matter sometimes," the Shield has collapsed.
  *   **Why:** The Shield exists solely to preserve a deterministic worldview (Structuralism/Environmental Determinism).

  ### 3. Deep-Structure Shield vs. "History is Complicated"
  This is the most important distinction. Legitimate historical nuance often looks similar on the surface, but the *direction of inquiry* is opposite.

  | Feature | **The Deep-Structure Shield** | **Legitimate Multicausality** |
  | :--- | :--- | :--- |
  | **Goal** | To **close** the inquiry. ("It wasn't the war, it was the climate.") | To **open** the inquiry. ("How did the war interact with the climate?") |
  | **Falsifiability** | Low. If climate is disproven, geography is summoned. | High. Specific weights are assigned to specific causes. |
  | **Agency** | Erases human agency. Events are epiphenomena (surface foam). | Retains human agency. Events are constrained but real. |
  | **Response to Counter-Example** | "That exception proves the rule of deep forces." | "That exception suggests our model needs adjustment." |
  | **Metaphor** | A **Wall** (moved to block the path). | A **Web** (tugged to see where tension lies). |

  ### 4. Why This Move Is Persuasive (and Dangerous)
  The *Deep-Structure Shield* works because it appeals to a valid historical insight: **The *Longue Durée*.**

  This term comes from the French Annales School (specifically Fernand Braudel), which correctly argued that history has different layers:
  1.  **Geographic/Climatic Time:** Very slow (centuries).
  2.  **Social/Economic Time:** Medium speed (decades).
  3.  **Event Time:** Fast (years/days).

  Braudel argued you can't understand history without the slow layers. The *Deep-Structure Shield* is the **dogmatic corruption** of Braudel's insight. It takes a methodological tool (look at the slow stuff) and turns it into an ideological weapon (the fast stuff *doesn't exist*).

  ### 5. How to Counter It
  If you encounter this in the wild, do not attack the specific variable (e.g., don't just argue about the drought). Attack the **interchangeability**.

  **The Counter-Move:**
  > "You are treating 'slow forces' as a single explanation. If geography doesn't explain the difference between the valley and the mountain, but climate does, then geography wasn't the cause. You are moving the goalposts of *determinism*, not finding the cause. If the specific slow variable changes, the causal mechanism changes. You can't claim 'Structure won' if you can't identify *which* structure."

  ### Summary
  *   **Formal Logical Name:** Immunizing Stratagem (Ad Hoc Rescue).
  *   **Coined Historiographical Name:** **The Deep-Structure Shield**.
  *   **The Tell:** When the *specific* cause changes but the *timescale* of the cause remains rigidly "slow" to protect the conclusion that "events don't matter."
  *   **The Difference:** "History is complicated" admits uncertainty; the Shield uses uncertainty to hide a deterministic dogma.
