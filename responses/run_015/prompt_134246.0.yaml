prompt: |-
  As a journalist covering science and ideas, I am preparing a briefing document for a speaker who will defend an unconventional conceptual thesis on populism at an academic seminar. Please adopt the role of an expert in political philosophy and strategic audience analysis. Think carefully, begin with a brief internal brainstorming of the audience's likely commitments, and only then construct the prep sheet.

  The speaker's thesis is that "the will of the people" ought not to be treated as an empirical datum—such as aggregated survey responses or electoral returns—that populist movements merely misrepresent. Rather, it functions as a performative construct produced through retroactive authorisation: the movement articulates a collective subject that only comes into being as the purported source of the authority being claimed. The speaker will contend that liberal democratic critique therefore commits an ontological category error when it treats populism as faulty measurement of a pre-existing will; the populist operation is better understood as an indexical delegation that constitutes its own referent through the very act of representation.

  The audience comprises mainly analytical philosophers of politics and constitutional lawyers—scholars trained in normative institutional analysis, wary of post-structural vocabulary, and primarily concerned with democratic legitimacy, constitutional constraint, and the rule of law—together with two empirical political scientists who study voter behaviour and institutional design. They are open to conceptual innovation but will insist on analytical precision, normative implications, and institutional mechanisms rather than rhetorical flourish.

  Please draft a speaker's Q&A prep sheet: identify the six or seven objections this precise audience will actually raise, ordered by the damage each could do to the speaker's position. For each objection, phrase it exactly as an analytical philosopher or constitutional lawyer would put it—no strawmen. Provide a concise reply suitable for a two-to-three-minute exchange, and include an explicit note on where that reply is weakest or concedes ground. Finally, identify the single "nightmare question"—the objection the speaker most hopes nobody asks—and outline a brief survival strategy rather than a full defence.

  Please structure your response so that its very first sentence states the bottom line: the one strategic commitment the speaker must defend at all costs, regardless of concession elsewhere. Then present your reasoning and the prep sheet itself. Do not open with a preamble, do not restate the prompt, and maintain British spelling and a formal register throughout.
