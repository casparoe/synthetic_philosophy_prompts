      *   **Camp B (Justice/Trials Model):** Criminal trials for senior/mid-level perpetrators. Sentence reductions for cooperation (no amnesty). Arguments: Punishment required by justice/rule of law, amnesty = impunity, reconciliation without accountability is hollow. (Resembles Argentina's initial approach).
      *   **User's Hypothesis:** The impasse isn't primarily factual/empirical but reflects a deeper divergence over *what justice fundamentally requires* (normative/conceptual). One side focuses on *political viability/transition* (consequentialist/pragmatic), the other on *moral vindication of victims* (deontological/retributive). They use shared vocabulary (truth, justice, reconciliation) obscuring this difference.
      *   **Task:** Assess the hypothesis, diagnose the structure of the impasse (empirical vs. normative vs. conceptual), analyze term usage, identify unargued commitments, and propose a path forward (or explain why none exists).
