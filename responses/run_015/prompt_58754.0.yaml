answer: |-
  Your hypothesis is substantially correct, though it requires a slight refinement regarding the interplay between empirical constraints and normative priorities. The impasse is not merely a disagreement over facts, nor is it a simple policy dispute. It is a **normative conflict disguised as a technical debate**, sustained by **conceptual equivocation** regarding key terms like "justice" and "accountability."

  Below is a diagnosis of the structure of this impasse, followed by an assessment of potential pathways for progress.

  ### I. Assessment of the Hypothesis

  Your hypothesis correctly identifies that the deadlock is driven by divergent conceptions of justice rather than purely empirical uncertainty. Both camps concede uncertainty about outcomes (deterrence, healing), yet they remain entrenched. This indicates that their positions are not primarily predictions about the future, but expressions of **non-negotiable moral commitments**.

  However, the hypothesis should be refined on one point: the disagreement is not *solely* normative. It is normative *about* how to weigh empirical risks.
  *   **Camp A** treats the "intact security apparatus" as a hard constraint. Their normative commitment is to the *survival of the democracy*. They argue that without stability, there is no state to administer justice.
  *   **Camp B** treats the "rule of law" as a hard constraint. Their normative commitment is to the *legitimacy of the state*. They argue that a democracy built on impunity is morally illegitimate and prone to recurring violence.

  Therefore, the impasse is a clash between **consequentialist ethics** (Camp A: the greatest good is a stable transition) and **deontological ethics** (Camp B: certain duties, like punishing torture, are absolute regardless of consequences).

  ### II. Diagnosis of the Impasse Structure

  #### 1. Normative Incommensurability
  The two camps are prioritizing different goods that are, in this specific context, largely incommensurable.
  *   **Camp A (The Stability/Truth Priority):** Views justice as *forward-looking*. The purpose of addressing the past is to secure the future. Truth is a form of reparation; stability is a precondition for rights.
  *   **Camp B (The Accountability Priority):** Views justice as *backward-looking*. The purpose is to rectify a specific moral wrong. Punishment is a duty owed to the victim, not a tool for social engineering.
  Because these are foundational ethical stances, no amount of empirical data regarding "social healing" will resolve the dispute. Camp B will argue that healing without justice is false peace; Camp A will argue that justice without peace is impossible.

  #### 2. Conceptual Equivocation
  The "shared vocabulary" you identified is a primary engine of the deadlock. Both sides use the same words to describe fundamentally different mechanisms.
  *   **"Justice":** For Camp A, justice is satisfied by *public acknowledgment* and *reparations*. For Camp B, justice requires *criminal sanction*.
  *   **"Accountability":** Camp A defines this as *political and historical accountability* (naming and shaming via disclosure). Camp B defines this as *legal accountability* (liability and incarceration).
  *   **"Reconciliation":** Camp A views this as *coexistence* enabled by knowing the truth. Camp B views this as *restored civic trust* enabled by seeing the law applied equally.
  *   **"Impunity":** Camp A argues amnesty is not impunity if it requires full disclosure (conditional amnesty). Camp B argues any exemption from criminal penalty is, by definition, impunity.

  #### 3. Divergent Problem Definitions
  The camps are answering different questions under the common heading of "Transitional Justice."
  *   **Camp A asks:** "How do we prevent a authoritarian reversal while recovering the truth?" Their model is designed to manage the *perpetrators* (buying their compliance).
  *   **Camp B asks:** "How do we vindicate the victims and establish the rule of law?" Their model is designed to honor the *victims* (affirming their rights).
  Because they are solving different problems, their proposals talk past one another. Camp A hears Camp B risking a coup; Camp B hears Camp A sacrificing moral principles.

  #### 4. Unargued Starting Commitments
  The decisive work is being done by premises that neither side is actively arguing because they treat them as self-evident.
  *   **Camp A's Unargued Premise:** *The security apparatus holds a veto.* They assume that without amnesty, the military will destabilize the government. This treats the threat of a coup as a fixed variable rather than a political challenge to be managed.
  *   **Camp B's Unargued Premise:** *The law must apply equally to all.* They assume that exempting perpetrators undermines the new democracy's legitimacy more than instability would. This treats legal purity as more vital than political survival.
  *   **Selective Analogical Reasoning:** Both sides invoke South Africa, Argentina, and Rwanda selectively. Camp A cites South Africa (TRC) to prove truth can substitute for trials. Camp B cites Argentina (initial trials) to prove trials are possible, or Rwanda (Gacaca/ICTR) to argue that accountability is necessary for long-term cohesion. Neither side engages with the specific contextual differences (e.g., the balance of power between the new government and the old guard in those specific cases).

  ### III. Pathways for Progress

  Given that the core disagreement is normative and conceptual, empirical inquiries alone (e.g., commissioning studies on deterrence) will not break the impasse. Progress requires **reframing the choice** and **institutional hybridity**.

  #### 1. Conceptual Distinction: "Sanctions" vs. "Imprisonment"
  The debate is currently binary: Amnesty vs. Prison. Progress requires decoupling *accountability* from *incarceration*.
  *   **Proposal:** Adopt a model similar to Colombia's Special Jurisdiction for Peace (JEP). Perpetrators who confess fully receive "alternative sanctions" (e.g., restricted liberty, community service, reparations work) rather than traditional prison sentences, but they do not receive blanket amnesty.
  *   **Why it helps:** This satisfies Camp B's demand for legal accountability (a sanction is imposed, guilt is admitted in court) while addressing Camp A's fear of mass incarceration destabilizing the security forces. It redefines "punishment" to include severe restrictions on liberty that fall short of prison.

  #### 2. Institutional Redesign: Sequential or Parallel Tracks
  The current proposal forces a choice between one mechanism or the other. A hybrid approach can address the different problem definitions.
  *   **Proposal:** Establish a Truth Commission with the power to grant *conditional amnesty for political crimes*, but explicitly exclude *crimes against humanity* (torture, disappearance) from amnesty, referring those cases to a specialized prosecutorial unit.
  *   **Why it helps:** This acknowledges Camp A's point that some political violence requires blanket resolution for stability, but upholds Camp B's normative line that torture and disappearance are beyond the pale of amnesty under international law. It forces a conversation about *which* crimes are eligible for amnesty, rather than *whether* amnesty exists.

  #### 3. Reframing the Question: Victim-Centered Choice
  Currently, the state is deciding the form of justice. Progress may come from shifting the locus of decision-making.
  *   **Proposal:** Allow victims to choose the track for their specific cases where feasible. If a victim's family wants truth (to recover remains), they opt for the Commission track. If they want prosecution, the state prioritizes that case for the Tribunal.
  *   **Why it helps:** This dissolves the abstract normative clash by grounding it in the specific needs of the affected. It acknowledges that "justice" is not monolithic; for some families, knowing the location of a body (Camp A's strength) is more valuable than a prison sentence (Camp B's strength), and vice versa.

  ### IV. Conclusion

  Your hypothesis is correct: the impasse is a normative conflict obscured by shared vocabulary. Camp A prioritizes the *possibility* of a democratic future (stability), while Camp B prioritizes the *moral quality* of that future (accountability).

  No progress should be expected if the group continues to debate which model is "true" to the examples of South Africa or Argentina. Progress is only possible if the group acknowledges that **neither pure amnesty nor pure prosecution is available.** The solution lies in a **third institutional form** that imposes meaningful consequences short of mass imprisonment, thereby satisfying the deontological demand for accountability without triggering the consequentialist fear of state collapse. If the camps refuse to move from their unargued premises regarding the "veto power" of the security forces or the "absolute duty" of criminal punishment, the impasse is structural and unlikely to be resolved through deliberation alone.
