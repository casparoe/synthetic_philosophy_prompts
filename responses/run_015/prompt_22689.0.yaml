  Here's a thinking process that leads to the suggested essay argument:

  1.  **Analyze the Request:**
      *   **Topic:** Aquinas's view on tyrannicide.
      *   **The Tension:** Aquinas generally forbids private individuals from killing evildoers (requires public authority), yet seems to praise the killing of tyrants (citing Cicero/Caesar's assassins, who were private citizens).
      *   **The Task:** Argue for a specific resolution: Private killing of a tyrant is lawful *only* insofar as it acts as an exercise of public authority on behalf of the community, not as a private act.
      *   **Key Elements to Include:**
          *   Explain how the tyrant's pursuit of private good vs. common good enables the community to assume public authority.
          *   Explain why this reading is superior to the "private right of resistance" interpretation.
      *   **Tone:** Philosophical, analytical, persuasive (arguing for *one* reading).

  2.  **Deconstruct Aquinas's Position (Source Material):**
      *   *Summa Theologiae* II-II, q. 64, a. 3: Killing evildoers is lawful for those in charge of the community (public authority), not private persons.
      *   *De Regno* (On Kingship), I, 6: Discusses tyranny. If there is a right to appoint the king, there is a right to depose him. If not, one must appeal to a higher authority (God or a superior lord). He mentions the killing of Caesar but warns against the danger of worse tyrants arising.
      *   *Commentary on the Sentences*: Similar distinctions.
      *   *The Crux:* The apparent contradiction lies in *De Regno* where he cites Brutus and Cassius. The prompt asks to resolve this by framing the act as *public* in nature, even if performed by individuals who aren't currently magistrates.

  3.  **Develop the Core Argument (The "Public Authority" Reading):**
      *   *Premise 1:* Legitimate violence requires public authority (ST II-II, q. 64).
      *   *Premise 2:* A tyrant, by definition, rules for private gain, not the common good.
      *   *Premise 3:* Authority is grounded in the service of the common good. When a ruler abandons the common good, he forfeits the *moral* claim to authority, effectively dissolving the bond of subjection.
      *   *Conclusion:* When private citizens kill a tyrant, they are not acting as "John" or "Jane" (private capacity) but as agents of the *res publica* (the public thing) which has reverted to them. They are executing a public judgment, not a private vendetta.

  4.  **Address the "Private Good vs. Common Good" Mechanism:**
      *   Why does the tyrant's selfishness matter? Because political authority is teleological (directed toward an end). The end is the common good.
      *   If the ruler seeks private good, he treats the community as a means to his end. This inverts the proper order.
      *   This inversion turns the ruler into an aggressor against the body politic.
      *   Therefore, the community (the source of authority in a limited monarchy/elective system) reclaims the authority that was delegated but abused. The "private" killers are instruments of this reclaimed public will.

  5.  **Critique the Alternative ("Private Right of Resistance"):**
      *   *Alternative View:* Aquinas believes individuals have a natural right to kill oppressors (like self-defense on a macro scale).
      *   *Why it fails:*
          *   Contradicts ST II-II, q. 64 explicitly.
          *   Leads to anarchy (everyone decides who is a tyrant).
          *   Misreads the Cicero reference: Cicero praised them not because they were private, but because they acted as "liberators" (public saviors).
          *   Aquinas is cautious about tyrannicide (fear of worse tyrants); a broad private right would encourage rash action.

  6.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** State the tension clearly. State the thesis (the "public authority" reading).
      *   **The General Principle:** Establish Aquinas's strict prohibition on private killing (ST II-II). This sets the baseline.
      *   **The Nature of Tyranny:** Define tyranny in Thomistic terms (perversion of rule, private good vs. common good). Explain how this breaks the political bond.
      *   **The Resolution (The Core Argument):** Explain how the community reclaims authority. The assassins are not "private" in the moral sense; they are acting as the "sword of the community." Use the *De Regno* passage carefully (it's about deposition, killing is a subset).
      *   **The Cicero Reference:** Reinterpret the Caesar example. Brutus/Cassius weren't praised as private men, but as defenders of the *Res Publica*.
      *   **Refuting the Alternative:** Why the "private right" reading is dangerous and textually inconsistent.
      *   **Conclusion:** Summarize why this preserves Aquinas's coherence and political realism.

  7.  **Refining the Nuance (Self-Correction during drafting):**
      *   *Caution:* Aquinas is actually quite hesitant about tyrannicide in *De Regno*. He says it's better to prevent tyranny than to remove it. I need to acknowledge this nuance so I don't make him sound like a revolutionary. The argument isn't that he *encourages* it, but that he *justifies* it under specific conditions without breaking his rule on public authority.
      *   *Distinction:* Make sure to distinguish between "private individual" (status) and "private act" (moral nature). The thesis is that the *act* becomes public even if the *status* is private.
      *   *Textual Accuracy:* In *De Regno*, Aquinas says if there is a right to appoint, there is a right to depose. If not, appeal to superior. The killing of Caesar is mentioned as an example of what *happened*, but he warns against it. I must frame the argument so it doesn't claim Aquinas unconditionally endorses Caesar's killing, but that he uses it to illustrate the principle of acting for the common good when authority collapses. *Correction:* The prompt specifically asks me to argue based on the text where he appeals to Cicero's defense. I must accept the prompt's premise that Aquinas finds it "praiseworthy" in that specific context to resolve the tension, even if he is cautious elsewhere. I will focus on the *logic* of the justification rather than the frequency of its application.

  8.  **Final Polish:** Check tone (academic, persuasive). Ensure all constraints of the prompt are met (public authority focus, common good explanation, superiority over private right reading).

  **(Self-Correction Note on *De Regno*):** Scholars debate the authenticity of *De Regno* (Book II is definitely by Tolomeo of Lucca). However, for the sake of the essay prompt, I must treat the text as representing the "Aquinas view" requested. I will focus on the logic found in *Summa Contra Gentiles* and *Summa Theologiae* regarding the common good to bolster the *De Regno* claims.

  9.  **Final Plan:**
      *   Intro: The apparent contradiction.
      *   Section 1: The General Prohibition (ST II-II).
      *   Section 2: The Tyrant's Forfeiture (Common Good vs. Private Good).
      *   Section 3: The Reclamation of Public Authority (The "Public Act" theory).
      *   Section 4: Refuting the "Private Right" interpretation.
      *   Conclusion: Coherence and Political Order.

