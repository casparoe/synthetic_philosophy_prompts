      *   Conclude on insulation (defect vs. feature).

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure to distinguish between "Calibration-Only" and standard "Level-Splitting." Level-splitting usually allows akrasia (I believe $p$, I believe I shouldn't). COV says I believe $p$, I believe my *batch* is unreliable, but I don't believe I shouldn't believe $p$ specifically. This is a subtle but crucial difference. It avoids the "rational irrationality" charge.
