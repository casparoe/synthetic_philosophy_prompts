prompt: |-
  I host this tiny podcast about animal ethics and next week I'm talking to someone who defends the view that habitat destruction actually lowers net wild animal suffering, mostly because it collapses populations of small mammals and insects with high reproductive rates and presumably awful suffering-to-pleasure ratios. She uses this framing she calls "suffering-weighted biomass"—basically multiplying population density by a rough guess at average welfare per individual—to argue that intact ecosystems are welfare disasters. I want eight or ten interview questions that don't just let her restate the view: I need at least one on the trophic cascade problem, like if you wipe out prey species do predators suffer more from starvation than the prey gained, and one on whether her metric commits her to supporting active culling in inteact ecosystems. She also usually deflects the "this sounds like ecofascism" objection by saying welfare calculus is seperable from human values, so I need a follow-up that makes that separation harder to maintain, maybe by pressing on cases where human aesthetic values and suffering reduction point in opposite directions. Can you draft these with follow-ups keyed to the answers she's most likely to give? I'm especially confused about how to press her on the empirical part—like do we even have data on insect consciousness—without sounding like I'm just being skeptical for the sake of it.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** A tiny podcast about animal ethics.
      *   **Guest:** Defends the view that habitat destruction lowers net wild animal suffering (WAS) due to collapsing populations of small mammals/insects with high reproductive rates and negative welfare (suffering > pleasure).
      *   **Key Concept:** "Suffering-weighted biomass" (Population density $\times$ Average welfare).
      *   **Goal:** 8-10 interview questions that challenge the view, not just let her restate it.
      *   **Specific Requirements:**
          *   At least one question on trophic cascades (predator suffering vs. prey suffering).
          *   At least one question on active culling in intact ecosystems (consistency check).
          *   At least one question on the "ecofascism/human values" deflection (pressing the separation between welfare calculus and human aesthetics).
          *   Address the empirical uncertainty (insect consciousness) without sounding purely skeptical/dismissive.
          *   Include follow-ups keyed to likely answers.
      *   **Tone:** Charitable but rigorous, suitable for a podcast interview.

  2.  **Deconstruct the Guest's Argument:**
      *   *Premise 1:* Many wild animals (especially r-strategists like insects/rodents) live lives not worth living (suffering > pleasure).
      *   *Premise 2:* Habitat destruction reduces the population of these animals.
      *   *Conclusion:* Therefore, habitat destruction reduces net suffering (is potentially good, or at least less bad than commonly thought).
      *   *Metric:* Suffering-weighted biomass.
      *   *Defense:* Separates welfare calculus from human environmental values (eco-fascism objection).

  3.  **Brainstorming Question Categories:**
      *   *Empirical Uncertainty:* How do we know insects suffer? How do we weigh intensity vs. duration?
      *   *Ecological Complexity:* Trophic cascades, unintended consequences, long-term vs. short-term.
      *   *Normative Consistency:* If destruction is good for suffering, why not cull? Why stop at destruction?
      *   *Value Conflicts:* Human aesthetics vs. animal welfare. The "ecofascism" deflection.
      *   *Risk & Uncertainty:* Precautionary principle.
      *   *Alternative Interventions:* Why focus on destruction rather than contraception/vaccination?

  4.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Empirical/Consciousness):* Need to ask about insect welfare without saying "you're crazy." Focus on the *weighting* in her metric.
