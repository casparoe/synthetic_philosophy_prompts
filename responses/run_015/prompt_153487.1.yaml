prompt: |-
  I'm a fourth-year PhD student in machine learning, and I've been asked to write the operating procedure for our lab's policy registry before it goes live next term, so this needs to be something a colleague can actually run rather than something that displays a position.

  The registry is a small piece of infrastructure. For certain recurring decisions, a researcher submits a *policy* — a mapping from the observations they might make to the action they would take — together with an ex ante model of the situation. The registry evaluates the candidate policies against that ex ante model, records the winner, and then executes it mechanically once the observation arrives. Two or three decisions a month go through it, usually with real money attached: compute, annotation budgets, occasionally the difference between shipping and killing a three-month run. The person running the procedure will be a rotating graduate student who has read one paper on this and has about forty minutes; the PI signs off. Assume this person has no access to the literature and will not look anything up, so every distinction the procedure uses has to be stated inside the procedure itself.

  I want the procedure built on the updateless framing, by which I mean: choose among whole policies by their expected value computed from the ex ante prior, without conditioning on the observation you in fact end up with, on the grounds that what you control is the output of the decision procedure rather than the single act in the branch you happen to occupy. I want that turned into an actual procedure, not expounded. Specifically:

  - The ordered questions, with what counts as a sufficient answer to each, and the points where the procedure stops early or hands the decision to a person.
  - A test for whether a decision belongs in the registry at all. As I understand it, the framing earns its keep only where the decision is entangled with something else — an external predictor whose behaviour tracks the policy rather than the act, or a set of instances of the same decision computation that the agent cannot tell apart — and collapses back into ordinary expected-utility maximisation otherwise. I need that test stated so a graduate student can apply it to a real ticket in five minutes, including what to do when the answer is genuinely unclear.
  - How to fix the prior, and the prior of whom as of when: our priors at registration, our priors now, or something else — and what to do when the two have diverged.
  - What the entangler is simulating when it predicts us: the rulebook as submitted text, the procedure that generated it, or our actual future behaviour. This is the step I expect to be load-bearing and the one I find hardest, and the answer seems to change depending on whether we can rewrite the rulebook afterwards.
  - What an operator should do when the executed policy mandates an action that is plainly wrong given everything now known: who may override, on what grounds, and what an override costs the registry.
  - Where full policy comparison is computationally hopeless, what approximation to substitute, and which steps are judgment calls dressed up as procedure.
  - What the procedure cannot do.

  Then run it, in order, on three cases.

  1. Our lab belongs to a compute consortium. Each quarter we submit a contingency rulebook; the consortium's allocator, a fixed and published algorithm, simulates the submitted rulebook against a battery of hypothetical scenarios and awards compute roughly in proportion to the share of the allocation that rulebook would spend on long, high-variance runs in scenarios where they look unpromising. This quarter's allocation is already granted and largely spent. The scenario that actually arose is one where a high-variance run looks unpromising and would consume about a third of what is left, and nothing we can identify now depends on whether we run it.
  2. A one-off decision: whether to spend $4k on an annotation job for a single project. No allocator, no recurring structure, and no way of confusing this decision with any other.
  3. A registered policy from a run begun six months ago says: if the pre-registered safety threshold is crossed, halt, delete the checkpoint, and run no further diagnostics first. The threshold was crossed this morning. Within ten minutes we found a bug in the logging library that makes the crossing very likely spurious; the model itself looks fine; the run cost roughly $60k and three months of someone's time; no external party is watching and nothing downstream depends on our compliance.

  Please give me a committed answer: one procedure, with definite choices at each step and the reasons for them, rather than a survey of what a defender of each decision theory would say. Where you think the updateless framing is simply inapplicable or wrong for a class of cases, say that flatly rather than hedging, and I expect I will not like what your procedure returns on case 3 — give it anyway, and say whether the correct move there is to override and what would make an override legitimate rather than convenient. Close with a short note, two hundred words at most, on the step you are least confident in, what would change your mind about it, and where your own view is contested. I would rather have something I can argue with than something balanced.
reasoning: |-
  Here's a thinking process that leads to the suggested operating procedure:

  1.  **Analyze the Request:**
      *   **User:** 4th-year PhD student in ML.
      *   **Task:** Write an operating procedure for a lab's "policy registry."
      *   **Context:** The registry handles recurring decisions (2-3/month) involving real resources (compute, money, shipping vs. killing runs).
      *   **Operator:** Rotating grad student, ~40 mins, read one paper, no literature access.
      *   **Core Philosophy:** Updateless Decision Theory (UDT) framing. Choose policies based on ex ante expected value (EV) without conditioning on the specific observation realized, because the decision procedure's output is what's controlled (entanglement with predictors or identical instances).
      *   **Requirements:**
          *   Ordered questions with pass/fail criteria.
          *   Test for registry eligibility (entanglement test).
          *   Prior fixation rules (whose prior, when).
          *   Definition of what the "entangler" simulates (rulebook text vs. procedure vs. behavior).
          *   Override protocol (when policy says X but reality says Y).
          *   Approximations for computational intractability.
          *   Limitations.
          *   **Run the procedure on 3 specific cases.**
          *   **Tone:** Committed, definite choices, not a survey. Acknowledge where UDT might fail.
          *   **Closing:** 200-word note on least confident step.

  2.  **Deconstruct the Core Philosophy (UDT in a Lab Context):**
      *   *Standard Causal Decision Theory (CDT):* Maximize EV conditional on the observation ($O$) actually seen. $Action = \arg\max_a E[U | O, do(a)]$.
      *   *Updateless (UDT):* Maximize EV of the *policy* ($\pi$) from the ex ante perspective ($S_0$). $Policy = \arg\max_\pi E_{S_0}[U(\pi(O))]$.
      *   *Why use UDT here?* The prompt specifies it's for "entangled" decisions: external predictors (compute consortium) or identical instances (Newcomb-like problems). If there's no entanglement, UDT collapses to CDT, but the *procedure* needs to verify entanglement first.
      *   *The Tension:* UDT demands binding yourself to a rule even if it looks suboptimal ex post. Case 3 (Safety Threshold) is the classic test of commitment vs. sanity.

  3.  **Drafting the Procedure - Section by Section:**

      *   **Title:** Needs to sound official but operational. "Lab Policy Registry Operating Procedure (v1.0)."
      *   **Eligibility Test (The "Entanglement" Filter):** This is crucial. If there's no predictor or logical correlation, UDT adds complexity for no gain.
          *   *Criterion:* Is there an external system or future instance making a decision based on *what rule you would follow*, not just *what you do*?
          *   *Action:* If No -> Use standard ex-post maximization (CDT). If Yes/Unclear -> Proceed to Registry.
      *   **Prior Fixation:** UDT requires a fixed prior.
          *   *Choice:* The prior at the time of *registration* (ex ante). Why? Because that's when the commitment gains credibility. Updating the prior later defeats the purpose of binding.
          *   *Divergence:* If current beliefs diverge, stick to the registered prior for the evaluation, unless the divergence implies the model is *broken* (see Override).
      *   **The Entangler's Simulation:** What does the predictor see?
          *   *Choice:* The submitted text of the policy + the procedure generating it. Not "actual future behavior" because that's circular. It must be the *commitment*.
          *   *Rewriting:* If you can rewrite the rulebook easily, the commitment is cheap. The procedure must lock the hash/version.
      *   **Evaluation:** Compare policies based on Ex Ante EV.
      *   **Override Protocol:** This is the hardest part. UDT says "never override." Reality says "don't burn $60k for a logging bug."
          *   *Decision:* Overrides are allowed *only* if the ex ante model is falsified (logical impossibility or data error), not just because preferences changed.
          *   *Cost:* High. Requires PI sign-off + "Registry Strike." 3 strikes and the registry is paused. This preserves the threat value of the registry.
      *   **Approximations:** Full policy space is infinite.
          *   *Choice:* Compare only submitted candidates. Use Monte Carlo on the ex ante model.

  4.  **Running the Cases:**

      *   **Case 1 (Compute Consortium):**
          *   *Entanglement:* Yes. The allocator simulates the rulebook.
          *   *Prior:* Registration prior.
          *   *Action:* Follow the policy. Even if it looks wasteful now, the allocation depended on the commitment to spend in this scenario. Deviating now ruins future credibility/allocation.
          *   *Verdict:* Run the high-variance job.
      *   **Case 2 (One-off Annotation):**
          *   *Entanglement:* No. No predictor, no identical instances.
          *   *Action:* Reject from Registry. Use standard CDT (spend $4k if EV > $4k now).
          *   *Verdict:* Do not register. Decide ex-post.
      *   **Case 3 (Safety Threshold/Bug):**
          *   *Entanglement:* Weak/None externally, but internal commitment matters.
          *   *Situation:* Policy says Halt/Delete. Reality says Bug/Spurious.
          *   *UDT Strict:* Follow policy (maintain integrity of safety protocols).
          *   *Pragmatic UDT:* The ex ante model assumed the threshold *meant* danger. The bug falsifies the *observation model*, not the utility function.
          *   *Override:* Legitimate. The input to the policy ("threshold crossed") was corrupted. The policy was "If Danger, Halt." We don't have Danger, we have "Sensor Error."
          *   *Verdict:* Override allowed, but requires PI sign-off and Registry Strike.

  5.  **Refining the Tone:**
      *   Must be imperative. "Do X," not "One might consider X."
      *   Must acknowledge the friction. Case 3 will hurt.
      *   Must be usable by a tired grad student.

  6.  **Addressing Specific Constraints:**
      *   *Prior:* "Our priors at registration."
      *   *Entangler:* "Submitted text + Procedure."
      *   *Override:* "Model Falsification only."
      *   *Case 3:* "Override is legitimate because the observation model failed, but it costs a Strike."

  7.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Case 1:* The prompt says allocation is *already granted*. Does commitment still matter? Yes, for *future* quarters. The consortium algorithm is fixed and published. If they audit and see we deviated, next quarter's allocation drops. The procedure must enforce the long-term game.
      *   *Self-Correction on Case 3:* Is this UDT or just standard exception handling? In UDT, if the *logical* input is wrong, the policy doesn't trigger. The policy is $f(obs)$. If $obs$ is corrupted, $f$ isn't actually evaluating the condition it was designed for. I need to distinguish "Policy says X" from "Policy condition triggered by noise." I will classify this as a Model Falsification (the link between threshold and danger is broken).
      *   *Closing Note:* Needs to be under 200 words. Focus on the Override threshold.

  8.  **Final Review against constraints:**
      *   Ordered questions? Yes.
      *   Entanglement test? Yes.
      *   Prior fixation? Yes.
      *   Entangler simulation? Yes.
      *   Override protocol? Yes.
      *   Approximations? Yes.
      *   Limitations? Yes.
      *   Three cases run? Yes.
      *   Committed tone? Yes.
      *   Closing note? Yes.

  9.  **Final Polish:** Ensure the distinction between "Updateless" and "Stubborn" is clear in the override section. The override isn't "I changed my mind," it's "The world model is broken."

  *(Self-Correction during drafting Case 3)*: Wait, if I allow an override on Case 3, does that destroy the registry's credibility? The prompt asks me to say whether the correct move is to override. If the logging bug is real, the *observation* "threshold crossed" is factually false regarding the *latent state* "unsafe." The policy maps Latent State -> Action, mediated by Observation. If Observation no longer tracks Latent State, the policy is operating on garbage. Override is justified as "Input Validation Failure," not "Policy Rejection." I will make this distinction sharp.

  *(Refining the Entanglement Test)*: Make it a flowchart style. Q1: Is there a predictor? Q2: Are there identical copies? If No to both, reject.

  *(Refining the Prior)*: Explicitly state "Freeze the prior at T_submit."

  *(Refining the Entangler)*: Explicitly state "Static Code + Text."

  Let's write it.cw
answer: |-
  # Lab Policy Registry: Operating Procedure (v1.0)

  **Purpose:** To execute decisions where the value of an action depends on the *rule* generating it, not just the action itself (entanglement).
  **Operator:** Rotating Graduate Student.
  **Time Budget:** 40 Minutes.
  **Authority:** PI holds veto; Operator holds execution.

  ---

  ## I. Eligibility Test (The Entanglement Filter)
  *Before registering a decision, answer these questions in order. If any answer is NO, do not use the Registry. Decide using standard ex-post expected value maximization.*

  1.  **Is there an external predictor or allocator?**
      *   *Definition:* Is there a system (human or algorithm) that will award resources based on a simulation of *what rule you would follow*, rather than *what you actually do*?
      *   *Sufficient Answer:* YES if the allocator's documentation states it simulates submitted policies, or if a counterparty has explicitly stated compliance affects future terms.
  2.  **Are there logically indistinguishable instances?**
      *   *Definition:* Will this exact decision computation run multiple times in situations the agent cannot distinguish at the time of decision, such that consistency across instances yields higher value than optimizing each individually?
      *   *Sufficient Answer:* YES if the decision is part of a coordinated multi-agent run or a repeated game where "surprising" the opponent is impossible.
  3.  **Is the uncertainty resolvable before commitment?**
      *   *Definition:* Can you wait for the observation *before* binding the rule without penalty?
      *   *Sufficient Answer:* NO. If you can wait, wait. The Registry is for binding *before* the observation arrives.

  **Uncertainty Protocol:** If the answer to Q1 or Q2 is genuinely unclear (probability of entanglement > 10%), **proceed to Registry.** It is cheaper to enforce a binding unnecessarily than to break a binding that mattered.

  ---

  ## II. Prior Fixation
  *To evaluate the policy, you must fix the probability distribution over worlds.*

  1.  **Whose Prior?** The lab's consensus prior **at the time of submission (T_submit)**.
  2.  **Divergence:** If current beliefs (T_now) diverge from T_submit:
      *   **Ignore T_now** for the purpose of scoring the policy.
      *   **Exception:** If T_now indicates the T_submit model is *logically incoherent* or *factually falsified* (e.g., a physical constant was wrong), trigger the Override Protocol (Section V). Do not update merely because new data makes the policy look expensive.

  ---

  ## III. The Entangler's Simulation
  *When calculating Expected Value (EV), you must model what the external predictor sees.*

  1.  **Input to Simulator:** The **submitted text of the policy** + **this Operating Procedure**.
  2.  **Not Simulated:** Do not model "what we will actually do if things get tough." The predictor trusts the text because the Registry enforces it.
  3.  **Rewriting:** Once registered, the policy text is hashed. It cannot be edited. To change it, you must withdraw and resubmit (which resets T_submit and may signal unreliability to external allocators).

  ---

  ## IV. Evaluation and Execution
  1.  **Comparison:** Calculate Ex Ante EV for each candidate policy using the T_submit prior.
      *   $EV(\pi) = \sum_{worlds} P_{submit}(world) \times Utility(\pi(observation))$
      *   Do not condition on the specific observation that actually occurred.
  2.  **Approximation:** If the state space is too large for exact summation:
      *   Use Monte Carlo sampling (N=1000) on the T_submit model.
      *   **Judgment Call:** If two policies are within 5% EV, choose the one with lower variance in resource usage.
  3.  **Execution:** Once the observation arrives, execute the winning policy mechanically.

  ---

  ## V. Override Protocol
  *The Registry fails if it forces self-destruction on technicalities. It also fails if overrides are cheap.*

  1.  **Grounds for Override:** You may override the registered policy **only** if:
      *   **Model Falsification:** The link between Observation and Reality is broken (e.g., sensor bug, data corruption).
      *   **Catastrophe:** Execution implies immediate physical danger or legal violation.
      *   **NOT Valid:** "We changed our minds," "It costs more than we thought," or "We found a better way."
  2.  **Procedure:**
      *   Operator flags the override.
      *   PI must sign off within 2 hours.
      *   **Cost:** The Registry incurs a **Strike**.
  3.  **Consequence:** 3 Strikes in a rolling 12-month window suspends the Registry. External partners must be notified of a Strike if the policy was submitted to them.

  ---

  ## VI. Limitations
  *   The Registry cannot optimize for preferences that did not exist at T_submit.
  *   The Registry cannot handle adversaries who can read your internal state but not your submitted text.
  *   The Registry does not replace safety review; it only enforces commitment.

  ---

  # Case Runs

  ### Case 1: Compute Consortium Allocation
  *   **Eligibility:** Q1 (External Predictor) = **YES**. The allocator simulates the rulebook.
  *   **Prior:** Freeze at T_submit (beginning of quarter).
  *   **Evaluation:** The policy says "Run high-variance jobs in unpromising scenarios." The ex ante EV was positive *because* this spending secured the allocation.
  *   **Observation:** We are in an unpromising scenario. The run looks wasteful ex-post.
  *   **Decision:** **Execute the Policy.** Run the high-variance job.
  *   **Reasoning:** The allocation was purchased with the *commitment* to spend in this exact scenario. Deviating now saves $20k today but signals to the allocator that our rulebook is cheap talk, reducing future allocation. The Ex Ante EV of maintaining credibility exceeds the Ex Post cost of the run.

  ### Case 2: One-off Annotation ($4k)
  *   **Eligibility:** Q1 (Predictor) = **NO**. Q2 (Indistinguishable Instances) = **NO**.
  *   **Decision:** **Reject from Registry.**
  *   **Reasoning:** This is a standard Causal Decision Theory problem. There is no entanglement. Using the Registry adds administrative overhead and risks false commitment. Decide based on current expected value: Spend $4k if the expected marginal gain > $4k *now*.

  ### Case 3: Safety Threshold & Logging Bug
  *   **Eligibility:** Q1/Q2 = **NO** (Internal safety). However, policy is registered.
  *   **Situation:** Policy mandates Halt/Delete. Observation (Threshold Crossed) is likely spurious due to logging bug.
  *   **Prior Divergence:** T_submit assumed Threshold $\rightarrow$ Danger. T_now says Threshold $\rightarrow$ Bug.
  *   **Override Test:** Is this Model Falsification? **YES.** The observation no longer tracks the latent state the policy was designed to regulate. The policy condition "If Unsafe" was proxied by "If Threshold." The proxy is broken.
  *   **Decision:** **Override (Halt, but do not Delete; Investigate).**
  *   **Cost:** **1 Registry Strike.** PI sign-off required.
  *   **Reasoning:** Strict updatelessness requires following the rule even if the sensor is noisy, *unless* the noise was unmodelled. Here, the ex ante model assumed the threshold was a reliable indicator. It is not. This is not a preference change; it is a falsification of the input channel. However, because this undermines the "mechanical" nature of the registry, it must cost a Strike to prevent "convenient" bug claims.

  ---

  # Confidence Note

  I am least confident in the **Override Protocol for Case 3**. Strict updateless reasoning suggests you should bind yourself even against sensor noise if the ex ante optimal policy was "trust the sensor." By allowing an override for "Model Falsification," I am smuggling in a causal escape hatch that weakens the commitment device. If external partners know we override on "bug claims," they may discount our policies. However, a procedure that mandates destroying $60k of work on a known logging error is unsustainable for a lab. My view is contested by hard-line functional decision theorists who argue that "sensor reliability" should have been part of the policy itself (e.g., "If Threshold AND Sanity Check Pass"). I chose pragmatism over purity here: the Strike cost is the compromise. To change my mind, I would need evidence that external allocators explicitly audit our override logs and penalize "Model Falsification" claims as heavily as outright violations.
