answer: |-
  ### 1. Exam Question

  **Module:** Advanced Epistemology (MA Level)
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1000–1200 words

  **Question:**

  In analysing higher-order evidence, it is useful to distinguish between two forms of epistemic defeat defined as follows:

  *   **Process-level defeat:** Higher-order evidence indicating that the *generative mechanism* or reasoning procedure used to form a belief is unreliable in the relevant domain, regardless of whether the specific belief is true.
  *   **Outcome-level defeat:** Higher-order evidence indicating that a *particular belief* is likely false, without implying that the mechanism which produced it is generally unreliable.

  Consider the following scenario:

  Dr Aris, a historian, has carefully evaluated primary archives and formed the confident belief that Event E occurred in 1847. She then learns, from a declassified institutional review, that the archive-curation protocol she relied upon contained an undetected selection bias that systematically omitted counter-evidence for events of type E, though she has no way to know whether her specific case was affected. Separately, she learns that a rival historian, using a different method, has reached the opposite conclusion.

  Write an essay addressing the following three points:

  1.  Assess whether Dr Aris's continued belief in E is rationally permissible, epistemically irrational, or genuinely akratic in light of the new evidence.
  2.  Analyse whether process-level and outcome-level defeat differ in normative force. If one undermines rationality more severely than the other, explain the conceptual basis for this difference.
  3.  Evaluate whether Aris can avoid akrasia by adopting a qualified doxastic attitude (for instance, assigning a credence rather than holding a full belief) without suspending judgement altogether.

  Your answer must rely on rigorous conceptual analysis of the distinction provided above rather than summary of existing literature.

  ***

  ### 2. Model Answer

  Dr Aris's epistemic predicament illustrates the distinct normative pressures exerted by process-level and outcome-level defeat. To determine the rationality of her continued belief, one must analyse how each form of defeat interacts with the justification for her belief that Event E occurred in 1847.

  Regarding the first point, Aris's continued full belief is likely epistemically irrational, bordering on akrasia. Epistemic akrasia involves believing *p* while simultaneously holding higher-order evidence that one ought not believe *p*. The archive-curation review constitutes process-level defeat. It suggests that the mechanism producing her belief (archive evaluation) is compromised by selection bias. Even if Aris's specific conclusion happens to be true, the warrant for her belief is undermined because the process is no longer trusted to track truth reliably in this domain. Consequently, maintaining full belief while acknowledging the mechanism's unreliability creates a tension between her first-order commitment and her higher-order assessment of her cognitive situation.

  This leads to the second point: process-level defeat generally possesses greater normative force than outcome-level defeat. Outcome-level defeat, represented by the rival historian's contrary conclusion, functions as a counter-weight. It suggests the proposition is false, but it leaves open the possibility that Aris's method was sound and the rival is mistaken. It is a conflict of results. Process-level defeat, however, attacks the foundation of the belief itself. If the mechanism is unreliable, the belief lacks proper genesis, regardless of competing conclusions. Conceptually, process defeat undercuts the connection between evidence and truth, whereas outcome defeat merely opposes the truth claim. Therefore, process defeat demands a more significant revision of doxastic attitude because it invalidates the source of justification, not just the specific conclusion.

  Finally, can Aris avoid akrasia by adopting a qualified doxastic attitude, such as a reduced credence, rather than suspending judgement entirely? This depends on the severity of the process defeat. If the bias is systematic but probabilistic (e.g., counter-evidence was omitted 50% of the time), Aris might rationally lower her credence rather than reducing it to zero. By shifting from full belief (credence 1.0) to a high credence (e.g., 0.6), she aligns her attitude with the compromised reliability of her process. This avoids strict akrasia because she is no longer believing *p* with certainty while knowing her method is flawed; she is believing *p* proportionally to the remaining reliability. However, if the process defeat indicates the mechanism is wholly untrustworthy (e.g., the archives are forged), no credence above suspension is permissible. In Aris's case, since she cannot know if her specific case was affected, a significant reduction in credence is required to maintain rational coherence. She cannot retain full belief, but she need not necessarily abandon the proposition entirely if the process retains some residual reliability. Thus, qualified attitudes offer a pathway to avoid akrasia, provided they accurately reflect the diminished normative force of the compromised process.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 20

  | Analytical Move | Marks | Common Misconception (Deduct marks if present) |
  | :--- | :---: | :--- |
  | **1. Application of Process-Level Defeat**<br>Correctly identifies the archive bias as process-level defeat and explains that it undermines the *mechanism's reliability* rather than just the specific claim. | 4 | Treating the bias as simple counter-evidence against Event E rather than an undercutting defeater regarding the source. |
  | **2. Application of Outcome-Level Defeat**<br>Correctly identifies the rival historian as outcome-level defeat and explains that it challenges the *truth of the proposition* without necessarily impugning Aris's method. | 4 | Conflating the rival's conclusion with process defeat by assuming the rival's method proves Aris's method is flawed. |
  | **3. Analysis of Akrasia**<br>Defines akrasia as the tension between first-order belief and higher-order evidence, and argues why full belief is irrational given the process defeat. | 4 | Defining akrasia merely as changing one's mind or conflicting with another person's belief rather than a intra-agent normative conflict. |
  | **4. Comparative Normative Force**<br>Argues that process defeat is normatively stronger (or distinct) because it undercuts justification at the source, whereas outcome defeat competes at the level of truth. | 4 | Claiming both forms of defeat are identical in force or that outcome defeat is stronger because it targets the truth directly. |
  | **5. Evaluation of Qualified Attitudes**<br>Analyses whether credence adjustment solves the akrasia problem, noting that it depends on whether the process retains *any* residual reliability. | 4 | Asserting that any amount of process defeat requires total suspension of judgement or that credence changes are irrelevant to rationality. |
