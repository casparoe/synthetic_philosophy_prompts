  4. **Mind-Independence:** The stability arises from physical structure, not social agreement, for "natural" status (Money fails).

  This principle defines a natural kind as a stable causal node that supports counterfactual reasoning. It prioritizes functional mechanisms over historical lineage when lineage excludes functional peers. It distinguishes physical joints from social conventions by tracing the source of the stability. It accepts convergent solutions as real kinds because the physical constraint creating them is universal, even if the ancestry is not.

