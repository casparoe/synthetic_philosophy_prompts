  3. "Where it strains"
  The "Yes-ish" on Cactus strains because your tests measure stability, but your intuition checks for *single origin*. If stability is the goal, convergence counts. The "No-but" on Hypertension is the strongest fit for your "Working Category" grade—it predicts well locally but breaks at the boundary because the continuum lacks a causal jump. This grade survives; it describes useful interfaces without underlying implementation unity. Money shows your tests detect *any* stable system, requiring Clause 4 to distinguish natural from social. The three-way scheme holds, but "Working Category" is not a degraded Joint; it's a distinct ontological status for systems where human cutoffs meet continuous reality. Your latency incident was a Working Category breaking when the hidden causal mechanism (network topology) changed. The principle explains why it worked for two years: the context was stable enough to mimic a Joint.

  4. "Fish versus succulents"
  Drop Fish, Keep Succulents. Fish is defined negatively: "Vertebrates with gills that aren't tetrapods." It's a legacy class excluding modern subclasses. Cactus is defined positively: "Stem succulence + CAM photosynthesis." In engineering terms, Fish is a deprecated base class you shouldn't instantiate; Cactus is an interface implemented by multiple packages. Joints in nature are often functional solutions to physical constraints, not just historical branches. If two distinct lineages solve the desert problem identically, that solution is a real feature of the world, regardless of ancestry. Your Swap Test confirms this: a euphorb swaps for a cactus in a desert ecosystem without breaking the system. A lungfish swaps for a salmon in a phylogenetic tree only if you delete the tetrapods. Functional interfaces carve deeper joints than inheritance history.

  5. "Unlisted cases"
  **Bacteria:** Species is a Working Category; horizontal gene transfer breaks lineage. The Joint is the gene function or metabolic pathway.
  **Red:** A perceptual Joint for humans, not a physical Joint. Wavelengths are continuous; vision is discrete. Passes Borrow Test for agents with human eyes, fails otherwise.
  **NP-Completeness:** A Formal Joint. Reductions are the causal mechanism. Swap Test holds perfectly across problem domains.
  **Planet:** Dynamical dominance (clearing the orbit) is the mechanism. Pluto fails the mechanism, not the label. It is a Joint, defined by gravitational behavior, not size.
  These cases show your principle scales. Bacteria force you to accept gene clusters over lineage. Red forces you to accept agent-relative joints. NP-Completeness proves formal structures can be natural kinds. Planet resolves your uncertainty by identifying the specific causal mechanism (gravity) that draws the line.

  6. "What I should retract"
