  The coffee shop was quiet, but the table between Marisol and Dev was crowded with printouts of Measure 7's election returns.

  "It passed," Dev said, tapping the 52-48 spread. "Thirty-four percent turnout is low, sure, but of the people who actually engaged, the majority spoke. That's the only metric that exists. You want to tell fifty-two percent of voters they didn't really mean it?"

  "I'm saying they voted on a promise, not a law," Marisol countered. "Look at the aftermath. Rents near stations dipped, but all the construction landed in three suburbs that already had infrastructure. The cities that needed density got nothing. And because nobody read the fine print on the rent-cap repeal, we lost federal housing money. That wasn't the people deciding; that was a trap."

  "That's why you need the vote to stick," Dev said. "If you build in a do-over, you're telling losers that if they wait long enough, the rules change. The Two-Winter Rule is just institutionalized sore losing. You pass a law, it hurts some interests, they wait two years, grind you down, and vote again. It makes legislation temporary by default."

  "It's not a do-over, it's a ratification of reality," Marisol said. "Under my rule, Measure 7 passes, but since it was under sixty percent, it goes into probation. The lottery assembly meets. One hundred and fifty regular people, not experts. They hire neutral staff to track the money, the construction, the federal grants. They publish one page: 'Here is what happened.' No recommendations. Then we vote again. If the majority still wants it after seeing the cost, fine. But right now, people voted for 'more housing' and got 'less federal aid.' That's an information asymmetry, not a will of the people."

  "Who writes the page?" Dev asked. "You say neutral, but language is framing. If the assembly says 'repeal cost the state money,' that's negative. If they say 'repeal reduced regulatory burden,' that's positive. Whoever controls the summary controls the vote. You haven't removed the elites; you've just swapped lobbyists for lottery staffers."

  "Fair point on the framing," Marisol conceded, leaning back. "If the assembly's staff drafts the language, that's a bottleneck. I'd adjust that. The campaigns submit the claims, the assembly verifies the data, and the final page has to use the submitter's wording if the data checks out. It prevents the assembly from becoming a shadow legislature with its own agenda."

  "Okay," Dev said. "But you still haven't solved the intensity problem. Measure 7 passed 52-48. Let's say the forty-nine percent are tenants whose lives are wrecked by the rent-cap repeal. The fifty-two percent are homeowners who barely care about train stations but liked the idea of 'property rights.' Why should the lukewarm majority override the desperate minority? Your system just delays the wrecking ball."

  "Because democracy isn't just about counting heads," Marisol said. "It's about preventing accidental tyranny."

  "But your fix creates a veto," Dev insisted. "Look at the turnout. Off-year elections are manipulated by timing. But if you say 'low turnout invalidates the result,' you're saying some voters count more than others. And bundling—yeah, Measure 7 glued density to deregulation. But if I ban bundling, I give courts the power to decide what counts as one issue. Every filter you add—supermajorities, re-votes, assemblies—gives someone a tool to stop the majority. I'd rather risk a bad law than guarantee gridlock."

  Dev paused, looking at the data on construction clustering. "I will grant you the off-year timing though. If the legislature can schedule the vote when their donors are awake and everyone else is working, that skews the 'majority.' I'd support fixed election dates for all initiatives. No special off-year slots."

  "That helps," Marisol said. "But fixed dates don't fix the eight-year horizon. If a law expires automatically, investors won't touch it. You need stability."

  "Stability for who?" Marisol asked. "Developers? If Measure 7 expires in eight years unless reaffirmed, it forces the coalition to maintain support. It prevents zombie laws that everyone hates but nobody bothers to repeal."

  "Okay, I'll concede that," Marisol said. "Eight years is too short for infrastructure. Housing takes decades to plan. If you pull the sunset clause, I keep the Two-Winter review for anything under sixty percent. But if I keep the sunset, I lose the construction industry entirely."

  "So you're keeping the review but dropping the expiration?" Dev asked.

  "Yes. But you're still ignoring the money. Developers outspent tenants ten to one. In your system, money buys the initial narrative. In mine, the two-year gap lets the narrative meet the evidence. The second vote isn't about changing minds; it's about verifying claims."

  "But verification costs time," Dev said. "And during that time, the uncertainty freezes the very investment the law was supposed to create. Measure 7 failed to build in the cities because developers didn't know if the rules would stick. Your system makes that uncertainty permanent policy. You say you want the people to speak, but you're asking them to shout twice before you listen."

  "I'm asking them to speak once about the idea, and once about the reality," Marisol corrected. "There's a difference."

  "Is there?" Dev tapped the table. "Because in politics, reality is always disputed. You're betting that a lottery of one hundred and fifty people can find an objective truth that campaigns couldn't. I'm betting that even if voters are wrong, correcting it through a new vote is better than building a bureaucracy to teach them how to vote."

  Marisol looked at the Measure 7 printout again. The federal money loss was stark. "But when the mistake costs everyone housing funds, teaching them how to vote feels like a luxury we can't afford."

  "Then educate them before the vote," Dev said. "Don't build a gate after."

  "The gate is the only thing that makes the vote count," Marisol said.

  Verdict: Marisol
