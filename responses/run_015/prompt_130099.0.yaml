  7.  **Final Review:** Check against the prompt requirements one last time.
      *   Examine distinction (Normal/Abnormal).
      *   Clear verdict (Fails/Reintroduces representation).
      *   AI Case used to drive conclusion (not just appended).
      *   Philosophical argument primary.

