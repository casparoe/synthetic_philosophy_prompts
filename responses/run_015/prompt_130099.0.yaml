  2.  **Deconstruct Rorty's Position:**
      *   *Antirepresentationalism:* Truth is not "accurate representation of reality." Truth is what is good to believe. Language is a tool, not a mirror.
      *   *Normal vs. Abnormal Discourse:* Normal discourse happens within agreed-upon rules (science, common sense). Abnormal discourse breaks rules, introduces new metaphors (poetry, revolutionary philosophy).
      *   *Normativity:* How do we choose between vocabularies? Rorty says "solidarity" and "utility" (reducing cruelty, expanding the "we"). He rejects "rationality" as a neutral arbiter.
      *   *The Critique:* If we can't check against reality, how do we know a new metaphor is *better* and not just *different* or *manipulative*? Does saying "this reduces cruelty" secretly assume a fact about human nature or the world?

  3.  **Formulate the Verdict:**
      *   *Option A (Defend Rorty):* The distinction works because "better" means "more useful for our purposes," not "more accurate." The AI case shows we don't need to know the AI's "soul," just how treating it as a subject changes *us*.
      *   *Option B (Critique Rorty):* The distinction fails. To say one vocabulary is "more useful" or "less cruel" requires a standpoint outside the vocabulary to judge consequences. This standpoint inevitably relies on some representation of human flourishing or social reality.
      *   *Decision:* Option B is philosophically richer and allows for a sharper critique using the AI case. It addresses the prompt's suspicion that a "hidden criterion" is at play. I will argue that Rorty *cannot* consistently make this distinction without smuggling in representationalist assumptions about human nature or social causality.

  4.  **Drafting - Section by Section:**

