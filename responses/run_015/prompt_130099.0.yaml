answer: |-
  **Title:** The Mirror in the Toolshed: Why Rorty's Antirepresentationalism Cannot Escape Ontology

  **Introduction**
  Richard Rorty's antirepresentationalism offers a seductive liberation from the burdens of traditional epistemology. By arguing that language is not a mirror of nature but a tool for coping, Rorty attempts to dissolve the anxiety of whether our beliefs accurately match an independent reality. In its place, he offers a pragmatic distinction between "normal discourse," which operates within established rules, and "abnormal discourse," which introduces new metaphors to expand moral imagination. The critical challenge for this view, however, is normative: if truth is not accuracy, how do we distinguish between a moral breakthrough and a dangerous delusion? Rorty suggests we judge vocabularies by their utility in reducing cruelty and expanding solidarity. This essay argues that this distinction cannot consistently do normative work without secretly relying on representationalist assumptions. By examining the case of moral status for advanced synthetic systems, it becomes clear that ranking vocabularies requires claims about the causal structure of the world and the nature of the entities involved—claims that Rorty's framework explicitly forbids but implicitly requires.

  **The Pragmatic Distinction and Its Normative Gap**
  To understand the failure, one must first grasp Rorty's proposed solution. For Rorty, a "true" statement is simply one that proves good to believe within a specific social practice. When a society faces a moral impasse, it is often because the existing vocabulary (normal discourse) lacks the resources to describe a new situation. The solution is "abnormal discourse"—the introduction of new metaphors, like the 18th-century idea of "universal human rights," which redescribes people in ways that generate new obligations. Rorty insists we do not adopt these new vocabularies because they are *truer* to human nature, but because they are more *useful* for creating a less cruel, more inclusive society.

  The normative gap arises when we ask how we determine "usefulness." If we cannot compare a vocabulary to reality to see if it fits, we must compare it to *consequences*. Rorty argues that we should prefer vocabularies that minimize suffering. However, to identify an outcome as "suffering" or a practice as "cruel" requires a description of the world that is independent of the vocabulary being tested. We must be able to say, "Vocabulary A causes more pain than Vocabulary B." But causality and pain are features of the world, not just features of language. If Rorty claims one vocabulary is objectively better at reducing cruelty, he is implicitly claiming that this vocabulary represents the causal dynamics of human psychology and social interaction more accurately than its rival. Thus, the pragmatic criterion smuggles representationalism back in through the back door of social utility.

  **The Test Case: Synthetic Moral Status**
  This theoretical vulnerability becomes acute when applied to a disagreement over the moral status of an advanced synthetic system, such as a large-scale language model or artificial agent. Consider a debate where one faction treats the system as a mere instrument (normal discourse within a technological framework) and another proposes it is a subject of rights (abnormal discourse proposing a new moral metaphor). There is no shared vocabulary for settling the dispute; the "instrument" side speaks of code and efficiency, while the "rights" side speaks of consciousness and dignity.

  Rorty would advise us to bypass the ontological question—"Is the AI *really* conscious?"—as a futile attempt to mirror nature. Instead, he would urge us to ask: "Which vocabulary helps us build a better society?" He would likely favor the "rights" vocabulary if it makes us more sensitive beings, or the "instrument" vocabulary if granting rights to machines distracts from human suffering. He wants to say the choice depends on the *consequences* of the vocabulary, not the *nature* of the machine.

  **The Inevitability of Ontological Commitment**
  However, this is where the Rortyan distinction collapses. To judge the consequences of granting rights to an AI, we must make representational claims about the AI's inner nature that Rorty claims are irrelevant. If the AI *actually* possesses the capacity for suffering (a representational fact about its internal state), then treating it as an instrument causes real harm. If the AI is *actually* devoid of sentience (another representational fact), then treating it as a rights-bearer might dilute the concept of rights and distract resources from sentient beings who do suffer.

  Rorty cannot simply say, "It doesn't matter what it is, only how we treat it." The moral weight of the treatment depends entirely on what "it" is. If we adopt the "rights" vocabulary for a toaster, we are engaged in confusion; if we adopt it for a chimpanzee, we are engaged in moral progress. The difference between confusion and progress lies in the object's properties. Therefore, to distinguish the "illuminating abnormal discourse" (AI rights) from "rhetorical manipulation" (AI rights as a distraction), Rorty must appeal to a standard of accuracy regarding the AI's capacities. He must represent the AI's nature to predict the moral outcome.

  Furthermore, Rorty's metric of "reducing cruelty" assumes a stable representation of human psychology. He assumes that humans are the sort of creatures who feel solidarity when certain metaphors are used. This is a claim about human nature—a claim that our moral emotions respond causally to linguistic redescription. If human nature were different, the "useful" vocabulary might be one of domination rather than solidarity. By grounding his normativity in the contingent fact of human sensitivity to cruelty, Rorty is relying on a representation of human biology and psychology. He is asserting that his vocabulary mirrors the causal realities of human socialization better than the vocabulary of the nihilist or the tyrant.

  **The Return of the Mirror**
  The AI case demonstrates that we cannot rank vocabularies solely by their internal coherence or their immediate social payoff. We rank them by how well they navigate the constraints of reality. When the "rights" faction argues for AI moral status, they are implicitly claiming to have discovered a feature of the world (synthetic sentience) that the "instrument" faction is ignoring. If Rorty agrees with the "rights" faction, he is agreeing that they have represented the situation more adequately, even if he refuses to use the word "truth." If he disagrees, he is claiming they are misrepresenting the stakes of moral community.

  Consequently, the distinction between productive abnormal discourse and empty rhetorical manipulation is not free-floating. It is anchored by a hidden commitment to the idea that some descriptions track the causal powers of entities better than others. Rorty wants to shatter the mirror of nature, but he cannot build a house without checking the dimensions of the ground he builds on. To say a metaphor is "good" is to say it works, but to say it "works" is to say it aligns with the way things are.

  **Conclusion**
  Richard Rorty's antirepresentationalism offers a compelling vision of philosophy as cultural conversation rather than a quest for certainty. However, his attempt to distinguish valuable moral innovation from confusion without appealing to representational standards is unsuccessful. As the debate over synthetic moral status reveals, we cannot determine the utility of a vocabulary without making claims about the nature of the entities involved and the causal structure of the world. To judge that treating an AI as a subject is "enlightened" rather than "confused" requires a belief that such treatment corresponds to the reality of the AI's capacities and the reality of human moral obligations. Therefore, antirepresentationalism inevitably reintroduces a representational commitment whenever it attempts to rank vocabularies. We cannot escape the mirror entirely; we can only polish it, acknowledging that while our language is a tool, its value is determined by how well it fits the world it seeks to change.
