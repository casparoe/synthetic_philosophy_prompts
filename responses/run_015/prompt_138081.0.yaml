answer: |-
  Here is the plan. I'm taking a definite stance on each point because you need a script, not a menu.

  ### 1. Order: Problem, Struggle, Tool, Application
  Do **Counterfactual Mugging (CM) first**, then introduce the **Policy Tool**, then hit them with **XOR Blackmail**.

  Do not hand them the "pick a policy in advance" tool at the start. If you give engineers a wrench before they've tried to turn the bolt with their bare hands, they'll treat the wrench as dogma rather than a solution. You want them to feel the pain of Causal Decision Theory (CDT) first.

  **The Flow:**
  1.  **Run the CM case.** Let them argue. They will split between "Pay" (EDT/UDT intuition) and "Don't Pay" (CDT intuition). Let the CDT argument win the room initially; it matches their immediate intuition about "sunk costs."
  2.  **Introduce the Tool.** Show them that if they could pre-commit *before* the coin flip, they would universally choose the "Pay" policy. Explain that Updateless Decision Theory (UDT) is simply the act of binding yourself to that pre-commitment even after you get the evidence.
  3.  **Run XOR Blackmail.** Now that they have the tool, apply it. XORB is harder because it involves logical correlation and "bad news" as a lever. If they start with XORB, they'll get hung up on the morality of blackmail. If they start with CM, they see the *structure* of the decision problem. XORB then becomes the stress test: "Does your policy tool hold up when the stakes are information itself?"

  ### 2. The Carrying Example: Drop the "Post-Decision" Simulation
  Your idea of Omega simulating the copy *after* you answer is risky. It muddies the water between *prediction* and *observation*. If Omega simulates you after you decide, it's just measuring you, not predicting you. The magic of these problems relies on the prediction existing *before* the random event (the coin or the logical fact) is resolved.

  **Do this instead:**
  Use the **"Source Code" metaphor**. It fits your audience perfectly.
  *   **The Setup:** You are an algorithm. Omega has your source code.
  *   **The Coin:** Omega runs your code against a simulated coin flip *before* the real coin is flipped.
  *   **The Deal:** If the simulation predicts you PAY in the "Lose" branch, Omega sets up the real world so you WIN in the "Win" branch.
  *   **The Loading:** Do **not** load the coin. Keep it 50/50.
      *   *Why?* Loading the coin (9:1) invites them to do expected value arithmetic on the *outcome*, which distracts from the *decision theory* point. You want them to focus on the *update*, not the probability.
      *   *The Fix:* Instead of loading the coin, stipulate a **Single-Shot Universe**. Tell them explicitly: "This happens once. There is no long-run average. There is only this instance." This kills the "it evens out in expectation" argument without complicating the math.

  **For XOR Blackmail:** Keep the Source Code metaphor. Omega checks your code. If your code says "Ignore Blackmail," Omega ensures the bad news is true and tells you. If your code says "Pay to Prevent," Omega ensures the bad news is false (or never tells you). The correlation is between your *algorithm* and the *truth of the proposition*.

  ### 3. Misconceptions: Let Them Crash
  You cannot talk them out of these misconceptions; you have to let the misconceptions drive the car into the wall.

  *   **"Just compute the Expected Value":**
      *   *The Trap:* They will calculate $EV(\text{Pay} | \text{Coin is Tails})$. This will always be negative.
      *   *The Move:* Let them do this. Let them feel confident. Then show them $EV(\text{Policy: Pay} | \text{Prior})$. Show that the CDT calculation ignores the branch of the tree that *would have happened* had they been different.
      *   *Why:* Engineers respect a model that fails prediction. Show them that CDT predicts a lower payout than UDT in this specific topology.

  *   **"It's just Newcomb's Problem":**
      *   *The Move:* Agree with them, then pivot. "Yes, it's Newcomb's with a probabilistic predictor. But in Newcomb's, you get the money *before* you open the box. In CM, you are asked to pay *after* you know you lost. It isolates the 'update' step."
      *   *Why:* If you dismiss the comparison, they'll fight you. If you accept it but highlight the *temporal/epistemic* difference, you keep control.

  *   **"Never Negotiate with Blackmailers" / "Be the Sort of Person":**
      *   *The Move:* Distinguish **Causal Blackmail** from **Logical Blackmail**.
      *   *Explanation:* "If a thug threatens to break your legs, paying causes the threat to stop. If Omega threatens to tell you your house burned down *because* you wouldn't pay, paying doesn't stop the house burning (it already did or didn't); paying changes whether Omega *tells* you."
      *   *Why:* The "Never Negotiate" heuristic works for causal threats. It fails for logical correlations. You need them to see that XORB isn't about rewarding criminals; it's about managing information leakage.

  *   **The Mistake to Leave In:**
      *   Let them argue about **Free Will** for exactly two minutes. "If Omega predicted it, how could I choose?"
      *   *Then shut it down.* "We are not discussing metaphysics. We are discussing which algorithm yields the highest payout. Assume you can choose your algorithm."

  ### 4. Closing Question and Scope
  **The Question:**
  Do not ask, "Would you pay?" That just measures their gut instinct.
  Ask this: **"If you could rewrite your own source code before you walked into this room, but you knew you couldn't change it afterwards, what would you write?"**

  *   *Why:* This forces them into the "Policy" frame. Almost everyone will admit they would write code that pays. Then you hit them with the kicker: "Then why are you arguing that you shouldn't execute that code now? You *are* that code."

  **What to Refuse:**
  Flatly refuse to discuss **the metaphysics of Omega**.
  *   *The Boundary:* "I am not interested in whether Omega is possible, or how it predicts, or if free will exists. We are assuming the setup is true. The only question is: given this setup, which decision rule wins?"
  *   *Why:* Your group includes a chemist who likes to fight. If you leave the door open to "Omega is impossible," they will spend 90 minutes debunking the premise instead of solving the logic. Treat Omega like a perfect sensor in a seismology model: assume the calibration is perfect, discuss the data interpretation.

  ### Summary Checklist for Your 90 Minutes
  1.  **0-20 min:** Counterfactual Mugging (50/50 coin, Single-Shot). Let them argue CDT vs. EDT.
  2.  **20-35 min:** The "Source Code" Tool. Explain Pre-commitment and Updatelessness.
  3.  **35-60 min:** XOR Blackmail. Apply the tool. Distinguish Logical vs. Causal blackmail.
  4.  **60-75 min:** Address Misconceptions (EV calculation, Newcomb comparison).
  5.  **75-90 min:** Closing Question ("What code would you write?") and Q&A within scope.

  Stick to this. It leverages their engineering background (algorithms, models, calibration) rather than fighting against it. Good luck.
