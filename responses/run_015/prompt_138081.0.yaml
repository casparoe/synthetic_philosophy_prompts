      *   *Recommendation:* Use the "One-Shot Universe" stipulation. It's not about the coin loading; it's about the *epistemic position*.

      *   *Refining the Order:*
          1.  CM (The Setup).
          2.  Let them argue (CDT vs. EDT).
          3.  Introduce "Policy Selection" (The Tool).
          4.  XORB (The Application/Stress Test).
