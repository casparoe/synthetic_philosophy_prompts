      Actually, let's stick to the standard Armageddon XORB. Omega says "I simulated you. If you pay, I won't tell you the asteroid is coming. If you don't pay, I will tell you." No, that's not right either.
      Standard XORB: Omega predicts if you will pay. If Predict(Pay), Omega says nothing (or world is safe). If Predict(No Pay), Omega sends message "Asteroid is coming, pay me to stop it." But the message is only sent if it's true *and* you wouldn't have paid.
      Okay, I need to make sure I give him the right structure for XORB in the plan.
      Actually, the simplest XORB: Omega tells you "P is true." P is bad. Omega told you P only because it predicted you would *not* pay to prevent P. If you were the type to pay, Omega wouldn't have told you (because P would be false or suppressed).
      Okay, I will focus on the *structure* of the dependency, not get bogged down in the specific narrative in this thought block. The plan needs to tell *him* how to handle it.

      *Let's lock in the advice.*
      1. Order: CM first. Tool in the middle. XORB last.
      2. Example: Drop the "post-decision simulation." It breaks the prediction logic. Use "Source Code" metaphor. 50/50 coin.
