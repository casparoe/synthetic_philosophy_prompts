          *   *Verdict:* Drop the "simulation after the fact" complexity. It introduces confusion about *when* the prediction happens. Stick to: Omega predicts your policy *before* the coin is flipped. The coin is 9:1 against you (Head = Pay $100, Tail = Get $10,000). You are told it's Tails (you win). Do you pay?
          *   *Wait, re-reading the user's specific idea:* "Omega runs its simulation on a copy of you after you've already answered, and tells the copy the coin came up the other way." This is trying to isolate the counterfactual. It's a bit messy.
          *   *Better approach:* Use the "Algorithm" analogy. You are an algorithm. Omega simulates the algorithm. The coin flip determines which branch of the `if/else` statement gets executed in reality, but the algorithm's source code is fixed *before* the flip.
          *   *Decision:* Use the "Algorithm/Source Code" metaphor. It resonates with engineers. Don't load the coin too heavily or they'll just do EV math. Keep it 50/50 for CM to isolate the *update* issue, then use XORB for the "information is bad" issue. Actually, the user wants to stop "it evens out in expectation." Okay, make it a *single shot* universe.
          *   *Final Call:* Keep the coin 50/50 for CM. The point isn't the EV of the coin, it's the EV of the *policy*. Loading the coin distracts from the updatelessness. Use the "Source Code" analogy as the carrying vehicle.

      *   **Misconceptions:** EV calculation, Newcomb's, "Be the sort of person," "Never negotiate."
          *   *Analysis:*
              *   *EV Calculation:* They will calculate EV based on *current* knowledge (I know it's Tails, so paying costs me $100 for nothing). Need to show EV based on *prior* policy.
              *   *Newcomb's:* It is Newcomb's, but with probabilistic prediction rather than logical. Don't let them dismiss it as "just Newcomb."
              *   *Be the sort of person:* This is Virtue Ethics. It's close, but UDT is about *decision algorithms*, not character.
              *   *Never negotiate:* This is the "Don't reward blackmail" heuristic. It fails in XORB because the information itself is the leverage.
          *   *Strategy:* Let the EV mistake happen. It's the teachable moment. Show why standard Causal Decision Theory (CDT) fails.
          *   *Decision:* Let them compute the naive EV first. Let them crash. Then introduce the "Policy EV."

      *   **Closing Question & Scope:**
          *   *Question:* Needs to test understanding of the *mechanism*, not the *conclusion*.
          *   *Scope:* Don't get into Modal Decision Theory, Timeless Decision Theory nuances, or metaphysics of free will. Stick to decision algorithms.
          *   *Decision:* Question: "If you could rewrite your own source code before entering this room, what would you write?" Scope limit: No free will debates.

  3.  **Drafting the Plan (Iterative refinement):**

      *   *Order:* CM -> Policy Tool -> XORB. Why? CM is the training wheels. XORB is the motorcycle.
      *   *Example:* Use the "Source Code" analogy. It fits engineers. Omega predicts your code. The coin flip selects which part of the code runs.
      *   *Misconceptions:* Let the EV error happen. It's crucial they feel the pull of CDT before you break it.
