          *   *Decision:* Start with Counterfactual Mugging. It's simpler (coin flip vs. logical correlation). It establishes the "pay in the lose branch to win the win branch" logic. XORB is then the "stress test" of that logic. Introduce the "policy" tool *after* they struggle with CM but *before* XORB, so they can test the tool on the harder case.
          *   *Why:* CM is the "Hello World" of acausal trade. XORB is the "Advanced Module." Don't confuse them immediately with logical uncertainty if probabilistic uncertainty hasn't landed yet.

      *   **The Carrying Example:** Loaded coin? Simulation after the fact?
          *   *Analysis:* The user suggests Omega simulating a copy *after* the answer and lying about the coin. This is meant to kill causal objections. Loading the coin (9:1) kills the "expected value over many trials" objection.
          *   *Critique:* The "simulation after the fact" is tricky. If Omega simulates *after* you decide, how does it predict you? It needs to predict *what you would do*. The standard CM setup (Omega predicts *before* the coin flip) is actually cleaner for engineers. The "loaded coin" is good, but be careful: if it's 9:1 against you, the EV calculation *still* says pay (if reward is high enough). The user wants to stop EV calculations based on *actual* evidence.
          *   *Decision:* Stick to the classic Parfit-style CM but sharpen the "one-shot" nature. Don't over-complicate the simulation timing. The key is *logical* dependence, not causal. For XORB, use the "Bad News" scenario (Omega tells you X only if X is false and you pay, or X is true and you don't pay).
