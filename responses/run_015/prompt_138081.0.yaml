      *   *Advice:* Tell him to drop the "simulation after" bit. It breaks the logic. Keep the prediction *before* the coin. The loaded coin is okay *if* the payoff is scaled, but 50/50 is cleaner for the first pass. I will advise him to stick to 50/50 for CM to minimize arithmetic distraction, and focus on the *update*.
