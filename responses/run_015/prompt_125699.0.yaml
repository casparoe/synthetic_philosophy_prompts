      *   **(ii) Skeptical Closure Failure:** Standard Nozick. $K(p)$ does not imply $K(\neg SH)$ because the method that tracks $p$ (vision) doesn't track $\neg SH$ (in SH world, you still seem to have hands).
      *   **(iii) Domain-Restricted Closure:** This is the tricky one. The user wants closure *within* a domain/method.
          *   *Tension:* Nozick explicitly rejects closure. If $p \to q$, knowing $p$ doesn't guarantee knowing $q$ because the nearest $\neg q$ world might be further away or accessed by a different method.
          *   *User's Justification:* "Nearest false-world is closer but still within the same method." This sounds like they are trying to hybridize Nozick with Contextualism or Safety.
      *   **(iv) Testimonial Tracking (Second-Order):** Tracking the *reliability* of the source rather than the fact itself.
          *   *Tension:* This shifts the object of tracking. If I track "Speaker is reliable," do I track "Proposition is true"? Usually, reductionists about testimony say yes, anti-reductionists say no. This seems to lean towards a reductionist/monitoring view.
      *   **(v) Epistemic Inertia:** A mechanism resisting belief revision.
          *   *Tension:* This sounds psychological/doxastic, not purely epistemic/modal. Tracking is about counterfactual dependence (modal). Inertia is about stability of belief. Mixing them risks category confusion.

