  8.  **Refining the "Inertia" point:**
      *   "Epistemic Inertia" sounds like *Epistemic Conservatism* (Chisholm/Plantinga). If the user keeps it, they should cite that. If not, it looks like a patch to stop the theory from collapsing under skepticism.

  9.  **Refining the "Reliabilism" worry:**
