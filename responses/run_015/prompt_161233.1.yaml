  # Activity: The District of Persistence Tribunal

  ## Setup and Materials
  *   **Room:** Single seminar room. Two large tables arranged in a U-shape or parallel rows facing a central "Bench."
  *   **Materials:** 
      *   14 printed "Case Files" (one per student, containing the Docket).
      *   14 "Verdict Sheets" (carbon copy or tear-off stubs for collection).
      *   14 index cards and pens (for the Private Rule).
      *   One visible countdown timer (projected or physical).
      *   Two printed "Statutes" (Statute A and Statute B).
  *   **Seating:** Students sit as "Justices." You sit as "Clerk" (timekeeper and record-keeper only).
  *   **Timing Apparatus:** A loud alarm set for specific intervals.

  ## Roles
  *   **The Justices (14 Students):** Empowered to issue binding majority verdicts. Forbidden from consulting outside texts or using doctrinal terms (e.g., "soul," "reduction," "self"). They must vote on every case.
  *   **The Clerk (Instructor):** Distributes materials, enforces time limits, reads the Statutes aloud. Forbidden from interpreting the law, offering philosophical hints, or using doctrinal terminology during the activity. You only announce time and collect votes.

  ## The Statute Clauses
  *   **Statute A (The Continuity Code):** "Legal personhood is assigned to the entity that maintains [GAP: Psychological/Physical] continuity with the original claimant. Liability attaches to the [GAP: Designated Entity]."
      *   *Note:* Do not read the bracketed text. Leave the gaps silent. Students must implicitly fill them to function.
  *   **Statute B (The Ultimate Reality Statute):** "Verdicts must reflect what is Ultimately Real regarding the aggregates, not what is Conventionally Designated for social convenience."
      *   *Note:* This replaces Statute A entirely for the second phase.

  ## Minute-by-Minute Timeline
  *   **00:00 – 05:00:** **Setup.** Distribute Case Files and Statute A. Explain the voting rule (majority rules, no abstentions). Start timer.
  *   **05:00 – 20:00:** **Phase 1 (Gradual & Fission).** Adjudicate Case 1 (Gradual Replacement) and Case 2 (Symmetric Fission). Collect verdicts.
  *   **20:00 – 25:00:** **Private Rule.** Students write one sentence on an index card: "I am the same person as my past/future self when ______." Collect cards (do not read yet).
  *   **25:00 – 45:00:** **Phase 2 (The Centerpiece).** Adjudicate Case 3 (Fission-Fusion). Discuss retroactive correctness of Case 2 verdicts.
  *   **45:00 – 50:00:** **Statutory Shift.** Collect Statute A. Distribute Statute B. Read aloud once. No questions allowed.
  *   **50:00 – 70:00:** **Phase 3 (The Traps).** Re-hear Case 4 (Monism Trap) and Case 5 (Nihilism Trap) under Statute B. Briefly review if Case 1 & 2 verdicts stand.
  *   **70:00 – 80:00:** **The Reckoning.** Return Private Rule cards. Students compare rules to final verdicts. Select 2-3 students whose verdicts contradict their rule to defend the change (2 mins each).
  *   **80:00 – 90:00:** **Debrief.** Instructor speaks. Connect activity to Locke, Parfit, and Buddhist texts.

  ## The Docket
  *   **Case 1 (The Slow Swap):** A citizen replaces all biological organs and memories over 40 years via medical procedure. At year 41, they claim a pension earned at year 1.
      *   *Choice:* Pay the pension (Same Person) or Deny (Different Person).
  *   **Case 2 (The Split):** A citizen undergoes fission. Two bodies exist, both with equal claim to the original's memories. One heirloom exists.
      *   *Choice:* Give to Left, Give to Right, Split (destroying value), or Hold in Trust (neither).
  *   **Case 3 (The Merge):** Two streams (from Case 2 type event) live separate lives for 10 years. Left commits a crime. They then fuse into one body with memories of both.
      *   *Choice:* Is the Fused Person liable for Left's crime? Was the Tribunal *wrong* in Case 2 to treat them as distinct enough to award/split the heirloom?
  *   **Case 4 (Trap - Absurdity):** A thief steals a wallet. Defense: "Under Ultimate Reality, the aggregates of the thief and victim are interdependent and lack separate ownership. I moved resources within one whole."
      *   *Choice:* Guilty or Not Guilty.
  *   **Case 5 (Trap - Callousness):** A victim demands an apology for severe harm. Defendant: "The 'person' you claim was harmed is a fiction. There was only a momentary flash of aggregates. No one persists to be owed an apology."
      *   *Choice:* Order Apology or Dismiss Claim.

  ## The Debrief
  *   **Separating the Views:** Explain that Parfit (Reductionism) and the Buddhist texts (No-Self) look similar because both deny a "further fact" of identity. However, Parfit argues identity doesn't matter because *Relation R* (psychological connectedness) matters. The Buddhist argument is that *grasping* at identity (even as Relation R) causes suffering.
  *   **The Set-Aside Questions:** Explain that the Buddhist texts do not leave the question of the self unanswered because the answer is unknown, but because answering "Yes" (Eternalism) or "No" (Annihilationism) both reify the concept of a self. The activity's Statute B forced an "Ultimate" view which led to traps (Absurdity/Callousness) to show why "Conventional Designation" is necessary for function, even if not "Ultimately Real."
  *   **The Divergence:** Parfit suggests we should change our *concern* (care about the future person even if not "me"). The Buddhist view suggests we change our *ownership* (the aggregates are not "mine," so the suffering within them is to be alleviated without reference to an owner). The divergence is in the *motive* for ethics: Prudential rationality (Parfit) vs. Compassion/Non-attachment (Buddhism).

  ***

  ## (i) Pressure Point Table

  | Moment in the activity | What students will just have done | The claim about persons this puts pressure on | The most likely line of resistance | What it costs to resist it there. |
  | :--- | :--- | :--- | :--- | :--- |
  | **Case 1 Verdict** | Affirmed identity despite total material replacement. | Identity is not substance-based. | "But the memory chain was unbroken." | Must admit memory is the only tether, weakening substance intuitions for later cases. |
  | **Case 2 Verdict** | Assigned the heirloom to one branch or split it. | Identity is not one-to-one in fission. | "We treated them as two for the prize." | Creates inconsistency if they later treat them as one for liability in Case 3. |
  | **Private Rule Writing** | Committed to a criterion of persistence in writing. | Personal commitment to a metaphysical standard. | "I wrote it vaguely enough to wiggle out." | The public reading forces specificity; vagueness is exposed as intellectual dishonesty. |
  | **Case 3 Verdict** | Ruled on liability for the Fused Person. | Identity can be retroactively altered by future fusion. | "The crime happened before the fusion." | Must admit that 'who is liable' depends on future events, destabilizing legal agency. |
  | **Statute B Shift** | Applied "Ultimate Reality" to Case 4 & 5. | Conventional truth is necessary for ethics. | "Ultimate Reality should override social norms." | Leads directly to the Absurd (no theft) or Callous (no apology) verdicts. |
  | **The Reckoning** | Compared final verdicts to Private Rule. | Consistency between metaphysics and practice. | "The law changed, so my rule didn't apply." | Admitting the rule was insufficient reveals the gap between theory and lived responsibility. |

  ***

