      *   **Behaviorism (Samuelson/RPT):** Utility is *defined* by choice. There is no "true preference" behind the choice. If you choose X, you revealed you prefer X *all things considered*.
      *   **Mentalism (Neo-Classical/Psychological):** Utility represents a psychological state of satisfaction or value. Choices are *evidence* of preferences, but can be mistaken due to framing, ignorance, weakness of will, or strategic constraints.
