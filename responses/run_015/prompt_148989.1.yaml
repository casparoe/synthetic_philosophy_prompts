  7.  **Addressing "What Would Change My Mind" (Falsification/Critique):**
      *   *Risk of Tautology:* If *everything* (including anxiety, ignorance, social pressure) is part of the bundle, RPT becomes unfalsifiable. If I choose X, I preferred X. If I choose Y, I preferred Y. We can always invent a "hidden feature" to explain the choice.
