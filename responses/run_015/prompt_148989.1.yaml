  *Revised Plan:* The principle is **"Utility attaches to Comprehensive States, not merely Physical Outcomes."** This saves the intuition that "Anxiety matters" without breaking RPT. But I must tell them they have to drop the idea that there is a "True Preference" hidden behind the choice that contradicts the choice. The choice *is* the revelation of the preference for the comprehensive state.

