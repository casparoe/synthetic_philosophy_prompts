      *   *Where I might fail:* Distinguishing between a "preference for ignorance" and a "cognitive bias." Is avoiding the IQ test a rational preference for peace of mind, or an irrational avoidance of useful data due to loss aversion? RPT can't tell the difference.

  8.  **Refining the Tone:**
