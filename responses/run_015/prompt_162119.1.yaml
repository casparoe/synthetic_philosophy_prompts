answer: |-
  **Brainstorming and Commitment**

  Candidate diagnoses: (1) *Merely verbal*: The sides define "effect" differently. (2) *Different questions*: Statistics asks about association; causality asks about intervention; decision theory asks about choice. (3) *Hidden empirical*: There is a fact of the matter about the data generation we are missing. (4) *Action-guiding quantity*: They disagree on which number drives rational action. (5) *Ill-posed*: The question is meaningless without a causal graph.

  I commit to a hybrid of (2) and (5). The dispute is substantive but mislocated. It appears to be about statistics, but it is actually about unspecified causal structures. I reject "merely verbal" because the stakes (patient harm) are real, not linguistic. I reject "hidden empirical" because the data is fixed; the disagreement is about the model generating it. I reject "ill-posed" because the question *can* be posed correctly using causal language. The stalemate persists because participants treat a mathematical reversal as the problem, when the problem is the ambiguity of the stratifying variable's causal role. The user's tripartite hypothesis is correct: the label conflates distinct phenomena, but Case (i) is not merely arithmetic—it is causal confounding disguised as math.

  ***

  **Diagnosis**

  Your hypothesis is correct: the stalemate arises because "Simpson's Paradox" conflates three distinct phenomena that require different resolutions. However, your characterization of Case (i) requires refinement. It is not merely arithmetic; it is causal confounding that *looks* arithmetic. The dispute is substantive, but it is several disputes of different kinds bundled under one name. Progress requires disentangling them and mandating causal specification before analysis.

  In Case (i), the *uniform-direction reversal*, every stratum favors one treatment while the aggregate favors the other. You suggest this is arithmetic and settles under standardization. This is only true if the stratifying variable is a confounder—a common cause of treatment and outcome. If it is a confounder, the stratified estimate identifies the causal effect, and the aggregate is biased. If it is not a confounder, standardization introduces bias. The statisticians who say "adjust and it dissolves" are implicitly assuming a causal structure where the stratifier is a confounder. The causalists who say "the query is badly posed" are correct that without a graph, we cannot know which number is biased. There is no residual disagreement here *if* the causal structure is agreed upon. The fight persists because the structure is rarely specified. The arithmetic is trivial; the identification is the hard part.

  Case (ii), the *heterogeneous-direction* scenario, is indeed normative. Here, strata disagree with each other. The aggregate is a weighted average of heterogeneous effects. The question is not "which number is true?" but "which population do we serve?" If the hospital serves the aggregate population, the aggregate effect predicts the outcome of rolling out the policy broadly. If the hospital serves specific subgroups, the stratified effects matter. The statisticians focusing on standardization are answering "What is the average treatment effect?" The committee members arguing for the aggregate are answering "What will happen if we treat everyone as they are currently treated?" These are different questions. The dispute here is not about truth but about policy scope. No formal result resolves this; it requires a decision about the target of inference.

  Case (iii), the *downstream-stratifier*, is where the real, non-verbal disagreement hides. Here, the stratifier is affected by the intervention (a mediator or collider). Conditioning on it blocks the causal path or opens a spurious one. The aggregate number might actually be the correct causal effect, while the stratified numbers are biased. The third group on your committee was right: if severity is downstream of pathway assignment, stratifying by severity removes part of the effect you want to measure. The causal-graph tradition is strongest here: they show that conditioning on descendants of the treatment creates bias. The statisticians who insist on adjustment are applying a heuristic ("always adjust for differences") that fails in this specific structural context. This is not a verbal dispute; it is a factual disagreement about the data-generating process.

  The decision-theoretic literature fits by asking a question the others ignore: *What does the agent know at the time of action?* Evidential Decision Theory (EDT) recommends acting based on the aggregate if that is the best predictor of outcome given your information. Causal Decision Theory (CDT) recommends acting based on the causal effect. In Case (i), EDT and CDT diverge if the agent knows the stratifier value. In Case (iii), they diverge sharply. The decision theorists are not analyzing the same phenomenon as the statisticians; they are analyzing the rationality of the choice given the information state. This explains why the examples feel different: sometimes the agent knows the stratum (choose based on stratum), sometimes they do not (choose based on aggregate). The literature talks past itself because statisticians ask about population parameters while decision theorists ask about individual rationality.

  So, is the dispute verbal? No. Is it substantive? Yes, but it is fragmented. The resolution lies in changing the question. We should not ask "Which number is right?" but "What is the causal graph?" Progress would look like a reporting norm: no aggregate or stratified table is publishable without a specified causal diagram justifying the adjustment set. A decomposition convention would help, but only if tied to causal claims. A small formal result about invariance is insufficient because the problem is identification, not estimation.

  For your committee, this has immediate bite. Do not publish the aggregate with a footnote. That implies the aggregate is the truth with a caveat. Instead, publish the causal graph you assumed. If severity is a confounder (patients arrive with severity, then are assigned pathway), the stratified numbers are the causal effect. If severity is a mediator (pathway affects severity, which affects complications), the aggregate is the total effect, and stratification is bias. You likely cannot resolve this with the data you have; you need clinical expertise to draw the arrows.

  The right move is a change of question. Stop asking "Which rate is real?" and start asking "What happens if we intervene?" If you want to know the effect of switching pathways for the *current* mix of patients, the aggregate predicts the outcome of that policy change, regardless of confounding, because the confounding structure is part of the current system. If you want to know the biological efficacy of the pathway independent of patient selection, you need the stratified estimate, assuming severity is a confounder. Your committee split because one group asked about policy impact (aggregate) and the other about biological efficacy (stratified). Both are valid answers to different questions. The stalemate ends when you admit you are answering two different questions and specify which one the hospital needs to solve. If you need to improve care for the population as it arrives, the aggregate is action-guiding. If you need to know which treatment is biologically superior to update guidelines, the stratified is action-guiding. Specify the goal, draw the graph, then pick the number.
