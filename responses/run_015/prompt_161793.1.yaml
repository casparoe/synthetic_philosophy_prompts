  ### The Single Revision: Drop Commitment (5)

  **Why:**
  1.  **Mathematical Consistency:** (4) is the core of "Computable Analysis." (5) is the core of "Intuitionistic Analysis." They are mutually exclusive. Since your project is explicitly **Computable Analysis**, (4) is essential and (5) is the drift.
