  **Rule 1: Culpability-Weighted Desert.** Sentence reflects moral blameworthiness (intent, role, history) and subjective hardship (age), ignoring collateral fallout (burglary) or outcome luck (attempted robbery).
  **Rule 2: Communicative Gravity.** Sentence must 'mark the gravity' of harm and deliver a public message (spike case), allowing deterrence to inflate penalties within statutory limits to account for low detection rates.

