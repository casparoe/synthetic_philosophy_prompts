  *   **D2 (17, first-time, late):** Rule 1 predicts a non-custodial order (youth discount, minimal causal role, low risk). Rule 2 risks custody to ensure the 'message lands' regarding the suicide attempt.

  **The Bet**
  I bet on **Rule 1 for D2** and **Rule 2 for D1**. M. suspended sentence for the fraudster because prison 'adds nothing but harm'. She is unlikely to imprison a low-risk minor purely for general deterrence, despite the 'spike' precedent. For D1, Rule 2 dominates due to recidivism and leadership role. (I am guessing here: M.'s 'spike' remark suggests contextual deterrence can override individual factors, but her youth mitigation suggests otherwise.)

  **Discriminating Case**
  The case that best separates these rules is a **40-year-old low-culpability joiner** (D2's profile but adult).
  *   If M. imposes custody, **Rule 2** dominates (deterrence overrides culpability).
  *   If she suspends/discharges, **Rule 1** holds (culpability caps punishment).

  **Change Agent**
  The single hypothetical that would change my prediction is if **the victim died**. This raises the 'gravity' ceiling, potentially forcing custody for D2 under Rule 2 despite low culpability, overriding the 'adds nothing but harm' principle. In that scenario, the 'message' regarding the loss of life would likely trump the individualised desert calculus she applied to the fraudster.

  **Uncertainty**
  My confidence is lowest on D2. M.'s refusal to mitigate for collateral consequences (kids in care) suggests a hard line on 'fallout', yet she accepted subjective hardship for the 19-year-old. Whether she views low detection rates as a 'collateral consequence' to ignore or a 'gravity' factor to amplify is the crux of your supervisor's discounting problem. If she views the 3% charge rate as undermining the 'message', Rule 2 swallows Rule 1 entirely for mass offences.
