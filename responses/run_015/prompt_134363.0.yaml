          *   Engineering: Uses infinite models (Hilbert's Hotel analogy, signal processing) without questioning ontological status.
      *   **Questions to Answer:**
          *   What philosophical commitments does this split presuppose?
          *   Is it potentialist for applied/actualist for pure? Or just pragmatic compartmentalization?
          *   If we took finitism seriously (denying actual infinities), would Cantor's argument survive? Would the curriculum need rebuilding?
          *   Reconstruct the implicit theory of infinity.
