answer: |-
  This is a sophisticated problem because you have correctly identified that "unpredictability" is not a monolithic property of the world, but a relation between a system, an observer, and a specific question. Your intuition about *Horizon Elasticity* is strong—it captures the Lyapunov time problem beautifully—but it fails because it treats all unpredictability as *epistemic* (about knowledge) when your verdicts show you care about *ontic* differences (about reality) and *pragmatic* differences (about what we care to measure).

  Here is a repair of your principle, tested against your cases, followed by the hard truth about your characters' conflict.

  ### The Repaired Principle: **The Principle of Recoverable Resolution**

  To make this speakable in Chapter 11, break it into three clauses. Each clause rescues a specific set of your verdicts that *Horizon Elasticity* alone crushes.

  **Clause 1: Target Relativity (The Smoke & Earth Clause)**
  > "Unpredictability is not a property of the system, but of the *variable* chosen to describe it. A system is predictable if the *macroscopic description* remains stable within tolerance, even if the microscopic trajectory diverges."

  *   **Why you need it:** This saves your **Smoke Plume** and **Earth Orbit** verdicts. Under raw Horizon Elasticity, the position of every smoke fleck and the exact phase of Earth's orbit are unpredictable. Under Recoverable Resolution, the *shape* of the plume and the *semi-major axis* of the orbit are stable. You are predicting the *attractor*, not the *point*.
  *   **Cost:** You must admit the Meteorologist is wrong if she claims the *weather* is predictable in principle. She is predicting an attractor (climate), not a state (rain on Tuesday).

  **Clause 2: Measurement Accessibility (The Coin & Billiard Clause)**
  > "A deterministic system is only 'effectively unpredictable' if the initial conditions required to fix the outcome are physically inaccessible to the observer *without disturbing the system beyond the tolerance of the prediction*."

  *   **Why you need it:** This saves your **Tossed Coin** bristle. A coin is chaotic, yes, but the initial conditions (force, angle, height) are macroscopic and measurable. We *could* predict it. We choose not to. The Weather and Double Pendulum require measuring air molecules or friction points at scales we cannot access without altering the flow. The **Billiard Ball** verdict ("I don't care") is also explained here: the variables are accessible, but the *target* (exact position after 100 bounces) has no salience.
  *   **Cost:** You must drop the idea that the Coin is "random" in the same way as the Weather. The Coin is *negligent* randomness; the Weather is *constitutive* randomness.

  **Clause 3: The Ontic Floor (The Quantum Clause)**
  > "If the divergence arises not from sensitive dependence on initial conditions, but from the non-existence of a definite state prior to measurement, the horizon is not merely elastic; it is nonexistent."

  *   **Why you need it:** This saves the **Quantum Decay** verdict. Horizon Elasticity assumes a Laplacean Demon could do it if it had enough digits. This clause says the Demon *cannot* do it, because the digits aren't there.
  *   **Cost:** This creates a hard boundary between your Mother's world (Clause 1 & 2) and your Daughter's world (Clause 3).

  ---

  ### Application to New Cases

  Here is how **Recoverable Resolution** adjudicates the cases you haven't listed:

  1.  **Timing of the next large earthquake on a well-instrumented fault:**
      *   **Verdict:** Unpredictable (Clause 2).
      *   **Reasoning:** Like the weather, the stress accumulation is deterministic, but the "initial condition" is the friction state of every micro-asperity on the fault plane. This is physically inaccessible without triggering the slip. It is *constitutively* unknowable, not just hard to measure.
  2.  **Average July temperature of a named city in 2100:**
      *   **Verdict:** Predictable (Clause 1).
      *   **Reasoning:** You are predicting a statistical aggregate (climate), not a trajectory (weather). The chaotic noise averages out over 30 days; the forcing functions (CO2, albedo) dominate.
  3.  **Chaotic circuit used to encrypt a message:**
      *   **Verdict:** Unpredictable (Clause 2).
      *   **Reasoning:** This is the Coin case weaponized. The equations are known, but the initial voltage is the "key." It is *accessible* to the receiver (who has the key) but *inaccessible* to the interceptor. It highlights that unpredictability is relative to the *observer's interface*, not just the system.
  4.  **Output of a deterministic AI system before it is produced:**
      *   **Verdict:** Computationally Irreducible (A new category).
      *   **Reasoning:** This breaks your principle slightly. It is deterministic (not Clause 3). The initial state is known (the weights and prompt). But the only way to know the output is to *run* the computation. There is no shortcut. This is not chaos (sensitivity); it is complexity (path length). For your novel, this is a bridge: it looks like freedom, but it is mechanism.

  ---

  ### The Hard Truth: Does the Distinction Collapse?

  You asked: *On the resulting account, is there any substantive difference left between the meteorologist's deterministic-but-unknowable future and the daughter's genuinely open one, or does the distinction I have been building the novel around turn out to be a matter of whether you happen to want the trajectory or the statistics?*

  **The Answer:**
  If you stop at **Recoverable Resolution**, the distinction **collapses** for human agency.

  Here is why: Your Mother argues that the future is fixed but unknowable (Clause 1 & 2). Your Daughter argues that the future is open (Clause 3). But for any macroscopic event—like the Sister taking the job (Chapter 12) or the Novel becoming a bestseller—the Quantum indeterminacy (Clause 3) is usually washed out by decoherence.

  Biological systems are warm, wet, and macroscopic. Most neuroscientists and physicists agree that quantum noise does not amplify to the scale of a neuron firing, let alone a career decision. If that is true, then the Sister's choice is, physically speaking, a **Coin Toss** (Clause 2): determined by initial conditions we cannot measure, but not ontologically open.

  **If you accept this physics, your novel's central conflict dissolves into semantics.** The Mother wins on the macro scale (human life); the Daughter wins on the micro scale (atoms), but the micro scale doesn't matter for the plot.

  **How to Save the Novel:**
  To keep the tension substantive, you must introduce the concept of **Amplification**.

  The Daughter's position only matters if she can argue that **Quantum Indeterminacy Amplifies to Macroscopic Decisions.**
  *   **The Mother's Argument:** "The brain is a wet machine. Decoherence kills quantum superposition in femtoseconds. Your 'openness' is trapped in the atom. My 'machine' runs the show." (She relies on Clause 1 & 2).
  *   **The Daughter's Argument:** "You assume the brain is classical. But what if the choice hinges on a single ion channel? What if the 'butterfly' is a quantum fluctuation in a microtubule?" (She relies on Clause 3 bridging to Clause 1).

  **The Verdict for Chapter 11:**
  Do not let them argue about *prediction*. Let them argue about *percolation*.
  *   The Mother should argue that **Horizon Elasticity** makes the distinction moot. "Even if you are right about the atom, Daughter, I am right about the woman. The noise averages out. The future is written, even if we can't read it."
  *   The Daughter should argue that **Recoverable Resolution** has a flaw. "You say the future is written but unreadable. I say the ink is wet. If a single quantum event can tip a neuron, and a neuron can tip a choice, then the 'written' text is a hallucination. The horizon isn't just elastic; it's branching."

  **Recommendation:**
  Keep *Horizon Elasticity* as the Mother's shield (it explains why she can't predict the weather, preserving her humility). Give the Daughter the **Amplification** spear (it explains why she believes her work matters).

  The substantive difference is not about *knowing* the future. It is about whether the future is a **single narrow path we are too blind to see** (Mother) or a **thicket of branching paths that only becomes a path when walked** (Daughter).

  For the Sister's Job in Chapter 12:
  *   If the Mother is right, the Sister feels relief or resignation. "It was always going to happen."
  *   If the Daughter is right, the Sister feels weight. "I am writing the equation as I solve it."

  That is the emotional stake. The physics is just the vocabulary.
