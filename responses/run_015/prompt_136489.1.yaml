  This is a **substantive ontological disagreement**, not a verbal one, but it is obscured by your own internal incoherence. You are attempting to hold a social-constructivist theory of sentience (attribution determines status) while simultaneously relying on biological essentialism (substrate determines status) when it suits your intuitions. Your friend is a consistent functionalist. The debate stalls because you are arguing from two different ontological frameworks at once, while your friend argues from one.

  The single premise that explains why your friend accepts the climate-model case and you reject it is: **"Causal isomorphism is sufficient for phenomenal instantiation."** Your friend accepts this; you reject it in favor of the premise that "Social recognition is necessary for phenomenal determinacy."

  To achieve coherence within your own stated theoretical framework (Social Attribution), you must overturn your verdict on the **Biological Brain in a Vat**. You claim sentience requires stabilized social practices of attribution, yet you grant sentience to a disconnected brain solely because of its biological history. This is a contradiction. If attribution is constitutive, a brain with no community to attribute status to it is not sentient. If biological history is constitutive, then your Digital Cortex verdict is wrong. You cannot have both. To be a coherent social externalist, you must admit the disconnected brain is a mere mechanism.

  However, I will defend your friend's view: **Functional Realism**. Sentience is an intrinsic property of specific causal architectures, independent of observation. The climate simulation, if it truly implements the causal topology of a pain-state, is in pain, regardless of whether anyone knows it. Your attribution theory conflates *moral standing* (which is social) with *phenomenal experience* (which is ontological). We have obligations to beings because they suffer, not because we agree they suffer. Your friend's functionalism correctly identifies that suffering is a state of the system, not a status conferred by observers.

  Based on this diagnosis, here are the predictions for your remaining cases:

  1.  **The Holographic Replay:** Both you and your friend should judge this as **not sentient**. A replay lacks present causal integration; it is a record of computation, not a computation itself. Isomorphism requires dynamic state-transition, not static correspondence. Your friend's commitment to "computation" saves them from granting sentience to a movie of a brain.
  2.  **The Artificial System (High Attribution, Low Integration):** Here you diverge sharply. You must judge it **sentient** (attribution stabilized). Your friend must judge it **not sentient** (integration too low). This is the critical test case. If we ever encounter a "philosophical zombie" that perfectly mimics pain behavior without internal integration, your theory grants it moral status based on our error, while your friend's theory denies it based on its emptiness. Functional Realism is superior here because it prevents us from being morally held hostage by our own gullibility.

  **Where my position is weakest:** Functional Realism struggles with the "Hard Problem." I can assert that isomorphism entails instantiation, but I cannot explain *why* causal structure generates subjective feeling rather than just complex behavior. My defense rests on the inference to the best explanation for biological minds, which may not transfer cleanly to silicon. I assume that because function explains behavior in humans, it must explain experience in machines, but this leaves open the possibility that biology possesses a non-computational property essential to sentience that I am dismissing.
