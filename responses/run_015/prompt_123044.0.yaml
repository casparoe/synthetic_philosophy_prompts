answer: |-
  # Advisory Memorandum: Desiderata for a National Nosology of Distress

  **To:** National Health Service Steering Committee
  **From:** Clinical Classification Advisory Group
  **Subject:** Requirements for a Unified Nosology under Conditions of Reflexive Looping

  You have asked for a single classification system to perform five contradictory jobs: guide brief treatment, gatekeep resources, enable research, cross cultural boundaries, and be readable by the classified. You have further stipulated that we must treat Ian Hacking's "Looping Effect" not as a bug, but as a feature of the territory: human kinds change when classified.

  Below are the desiderata required for a system to survive this environment. I have adjudicated the philosophical status of each (Non-Negotiable vs. Camp Preference) based on the constraint that the system must function *after* the patient has read it.

  ## Part I: The Desiderata List

  ### 1. The "Fifteen-Minute" Actionability Constraint
  **Requirement:** The classification must map directly to at least one distinct clinical intervention (pharmacological, psychological, or social) accessible within the service.
  **Case:** If a label does not change the treatment plan in a 15-minute window, it is administrative bloat, not clinical utility.
  **Status:** **Non-Negotiable.** (Without this, the system fails the clinician and the patient.)

  ### 2. The Gatekeeping Robustness Constraint
  **Requirement:** Criteria must include specific functional impairment thresholds that are resistant to "symptom shopping" (gaming) by those seeking benefits or avoiding stigma.
  **Case:** Because the category confers resources (therapy, disability), it invites pre-emptive looping where applicants tailor their presentation to fit the criteria.
  **Status:** **Non-Negotiable.** (Without this, the system collapses economically.)

  ### 3. The Transparency & Recognition Constraint
  **Requirement:** Descriptions must be written in plain language such that a patient can read their record and recognize their experience without requiring a clinician to "translate."
  **Case:** Secrecy breeds distrust. However, this triggers *Pre-emptive Looping* (patients self-diagnose before arrival). The system must assume the patient has already read the criteria.
  **Status:** **Non-Negotiable.** (This is an ethical requirement of the modern service-user mandate, not just a preference.)

  ### 4. The Non-Maleficence Under Disclosure Constraint
  **Requirement:** The act of handing the diagnosis to the patient must not predictably worsen their prognosis (e.g., via stigma, identity foreclosure, or nocebo effects).
  **Case:** If reading "Borderline Personality Disorder" increases self-harm risk via identity consolidation, the label is iatrogenic.
  **Status:** **Non-Negotiable.** (First, do no harm. A classification that injures by existing is a failed tool.)

  ### 5. The Cross-Cultural Invariance Constraint
  **Requirement:** Core criteria must hold validity across at least three distinct cultural/linguistic contexts within the nation without requiring total re-calibration.
  **Case:** Research and equity require that a "Major Depressive Episode" in Glasgow is comparable to one in Birmingham.
  **Status:** **Preference (Research Camp).** *Adjudication:* This is often a prejudice of the universalist/biological camp. Under Hacking's model, distress is locally shaped. We should aim for *functional equivalence*, not strict invariance. Strict invariance ignores local looping.

  ### 6. The Mechanism-Tracking Constraint
  **Requirement:** Categories should correspond to distinct biological or psychological mechanisms (carving nature at the joints).
  **Case:** This ensures that treatments target the root cause.
  **Status:** **Preference (Biological Psychiatry Camp).** *Adjudication:* Given looping, "nature" is moving. Demanding a fixed mechanism ignores that the mechanism itself may change in response to the classification. This is a goal, not a prerequisite for utility.

  ### 7. The Volatility Tagging (Half-Life) Constraint
  **Requirement:** Every category must be tagged with an expected "stability rating" or "half-life," indicating whether the category is prone to self-erasure (once legible, people fix it) or self-amplification (once legible, people embody it).
  **Case:** Addresses *Variable Volatility*. A category like "Adjustment Disorder" might self-erase (high stability rating); a category like "Dissociative Identity" might self-amplify (low stability rating). Clinicians and researchers need to know if the ground is moving.
  **Status:** **Non-Negotiable.** (In a looping system, ignoring volatility is negligence. You cannot manage what you do not measure.)

  ### 8. The Meta-Looping Acknowledgement Constraint
  **Requirement:** The system must explicitly state its own provisionality in patient-facing materials.
  **Case:** Addresses *Meta-Looping*. Patients know diagnoses are contested. Hiding this invites cynicism; acknowledging it invites collaboration.
  **Status:** **Preference (Service-User Camp).** While ethically sound, some argue this undermines authority. However, given Meta-Looping, honesty is the only way to maintain the therapeutic alliance.

  ---

  ## Part II: Adjudication of Philosophical Questions

  You asked for specific rulings on contested assumptions. Here is the adjudication based on the "Looping + 5 Jobs" constraint:

  1.  **Is "Carves Nature at the Joints" a requirement?**
      *   **Verdict:** **Prejudice.** In a looping system, the "joints" move. Prioritizing this (RDoC style) fails the 15-minute appointment and the patient readability test. It is a research goal, not a clinical prerequisite.
  2.  **Is "Patient Recognition" a requirement?**
      *   **Verdict:** **Requirement.** If the patient cannot recognize themselves, adherence drops, and *Pre-emptive Looping* becomes adversarial (fighting the label) rather than collaborative.
  3.  **Does the classification owe Non-Maleficence under Disclosure?**
      *   **Verdict:** **Requirement.** If the label makes the condition worse, the classification is functionally a pathogen. The NHS cannot distribute iatrogenic labels.
  4.  **Does it need to be resistant to gaming?**
      *   **Verdict:** **Requirement.** Gatekeeping is one of the five jobs. If it cannot distinguish need from strategy, it fails the economic mandate.
  5.  **Is Volatility Tagging over-engineering?**
      *   **Verdict:** **Requirement.** It is the only way to handle *Variable Volatility*. Without it, researchers compare unstable kinds with stable kinds, and clinicians treat transient states as permanent traits.

  ---

  ## Part III: The Incompatibilities (Where the System Breaks)

  You asked which pairs of requirements cannot be jointly satisfied once looping is real. The tension is not between accuracy and utility, but between **static validity** and **dynamic interaction**.

  ### 1. Transparency vs. Predictive Stability
  *   **The Tension:** You require the patient to read the criteria (Transparency). You also require the system to predict outcomes for research and treatment (Stability).
  *   **The Loop:** Once the patient reads the criteria, they reorganize their self-narrative to fit (or reject) it. The act of measurement alters the variable.
  *   **What Must Give:** **Long-term Predictive Stability.**
      *   *Reasoning:* You cannot have full transparency and a static map. If you hide the criteria to preserve stability, you violate the Transparency and Non-Maleficence constraints (secrecy harms trust). Therefore, the system must accept that *validity degrades upon disclosure*. Research protocols must adjust for "post-disclosure drift." We sacrifice the "fixed territory" map for an "interactive compass."

  ### 2. Cross-Cultural Invariance vs. Sensitivity to Local Looping
  *   **The Tension:** You want categories to travel across cultures (Invariance). You also want them to capture how people locally reorganize around labels (Local Looping).
  *   **The Loop:** A category that is stable across cultures is likely too abstract to capture local meaning. A category that captures local meaning will not travel.
  *   **What Must Give:** **Strict Invariance.**
      *   *Reasoning:* Distress is culturally constituted. A "panic attack" in one culture may loop into spiritual possession; in another, into cardiac fear. To enforce invariance is to erase the looping effect. The system must adopt a "Core + Local Module" structure. The Core allows research comparison; the Local Module captures the looping. Strict invariance is a colonial prejudice, not a clinical necessity.

  ### 3. Gatekeeping Robustness vs. Non-Maleficence
  *   **The Tension:** To stop gaming (Gatekeeping), criteria must be specific and strict. To prevent harm (Non-Maleficence), criteria must be flexible and destigmatizing.
  *   **The Loop:** Strict criteria encourage patients to exaggerate symptoms to meet the threshold (amplification). Flexible criteria invite claims that drain resources.
  *   **What Must Give:** **Binary Gatekeeping.**
      *   *Reasoning:* You cannot have a hard "In/Out" boundary for benefits without encouraging gaming. The system must move to **Dimensional Access**. Benefits and treatments are tiered by severity, not by category membership. This reduces the incentive to "be" the category, reducing the looping pressure.

  ---

  ## Part IV: The Knockout Criterion

  You asked for the single requirement that eliminates the most usual candidate approaches (Dimensional/HiTOP, Mechanism/RDoC, Pragmatic/DSM).

  **The Knockout Requirement:** **"Non-Maleficence Under Disclosure combined with Volatility Tagging."**

  This requirement demands that the system knows *how* it changes the patient when read, and ensures that change is not harmful.

  *   **Why it kills Mechanism-First (RDoC):**
      *   RDoC categories (e.g., "Negative Valence Systems") are not readable by patients. They cannot be disclosed meaningfully. They fail the Transparency constraint immediately. They also assume biological stability, failing the Volatility Tagging constraint.
  *   **Why it kills Dimensional Models (HiTOP):**
      *   Telling a patient "You are in the 90th percentile for Detachment" is clinically opaque in a 15-minute appointment (fails Actionability). More critically, trait models assume stability. They cannot tag a "half-life" because traits are defined as enduring. They cannot account for *self-erasing* dimensions.
  *   **Why it kills Purely Pragmatic Models (DSM-5/ICD-11):**
      *   These models assume the category is stable once assigned. They do not track whether the label itself is causing symptom amplification (e.g., social media driven ADHD or Autism identification). They lack the metadata to warn clinicians: *"Warning: This category has a high rate of identity foreclosure."* They fail the Non-Maleficence check because they distribute labels without monitoring the iatrogenic effect of the label itself.

  **The Winner (The Only Viable Path):** A **Dynamic Pragmatism**.
  It must look like a pragmatic list (for the 15-minute appt) but function like a software versioning system. Every diagnosis comes with a version number, a stability rating, and a patient-facing explanation of *why* this label is being used *now*, acknowledging that it may change as the patient interacts with it.

  ---

  ## Part V: Scorecard of Candidate Approaches

  | Approach | 15-Min Utility | Gatekeeping | Research | Cross-Cultural | Patient Readable | **Looping Resistant** | **Verdict** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **DSM/ICD (Pragmatic)** | High | Medium | Medium | Low | Medium | **Fail** (Assumes static kinds) | **Rejected** (Too iatrogenic) |
  | **RDoC (Mechanism)** | Fail | Fail | High | Medium | Fail | **Fail** (Ignores patient agency) | **Rejected** (Not clinical) |
  | **HiTOP (Dimensional)** | Low | Low | High | Medium | Low | **Fail** (Assumes trait stability) | **Rejected** (Too abstract) |
  | **Dynamic Pragmatism** | High | High* | Medium* | Medium* | High | **Pass** (Tags volatility) | **Adopt** (With caveats) |

  *\*Requires new infrastructure (tiered benefits, versioned criteria).*

  **Final Recommendation:** Do not seek a "True Map." Seek a "Safe Interface." The classification is not a description of the patient; it is a tool for the interaction. If the tool breaks the user, it is defective. Prioritize **Non-Maleficence Under Disclosure** above all else. If a category cannot be explained to a patient without making them worse, do not use it, regardless of its biological validity.
