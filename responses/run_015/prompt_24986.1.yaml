      *   *Caution:* Don't dismiss Quine too easily. His holism is still a major challenge for cognitive science (confirmation holism).
      *   *Key Insight:* The debate persists because "Analyticity" was asked to do too much work (ground logic, ground math, ground modality, ground epistemology). When it fails at one, defenders retreat to another.
