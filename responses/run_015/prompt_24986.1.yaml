          *   If impasse is permanent, explain why.

  2.  **Initial Brainstorming & Mapping the Terrain:**
      *   *Quine:* Attacks the definition of "analytic" (synonymy, necessity, semantic rules). Holism. Web of belief. No sharp boundary. Methodological naturalism.
      *   *Carnap:* Linguistic frameworks. Meaning postulates. Analyticity is relative to a framework. Explication.
      *   *Grice & Strawson:* "In Defense of a Dogma." People *do* use the distinction successfully in practice. Quine demands too high a standard of definition.
      *   *Kripke:* Separates metaphysical necessity from epistemic analyticity/a priority. "Water is H2O" (necessary a posteriori). "Meter stick" (contingent a priori). This complicates the mapping but doesn't necessarily kill analyticity.
      *   *Neo-Carnapians (e.g., Chalmers, Jackson):* Two-dimensional semantics. Conceptual analysis still viable.
      *   *Inferentialists (e.g., Brandom):* Meaning is use/inference. Analyticity as material inference.
      *   *Cognitive Science (e.g., Fodor, Chomsky):* Is there a module for language? Are concepts atomic or structured?

  3.  **Diagnosing the Disagreement:**
      *   *Is it merely verbal?* No. It's not just about the label "analytic." It's about whether there is a *joint in nature* (or language) that corresponds to the label.
      *   *Is it substantive?* Yes, but layered.
      *   *Is it methodological?* **Crucial Point.** Quine and Carnap have different standards of clarity. Quine wants behaviorist/empirical reduction; Carnap accepts explication within a framework.
      *   *Is it a cluster?* **Strongest Hypothesis.** The debate conflates:
          1.  Metaphysical (Necessity/Truth in virtue of meaning).
          2.  Epistemological (A priority/Justification).
          3.  Semantic (Synonymy/Definition).
          4.  Psychological (Conceptual structure).
      *   *Synthesis:* It is a **methodological clash masquerading as a substantive dispute, compounded by the conflation of distinct theoretical roles.** Quine attacks the *epistemological* privilege of analyticity using *semantic* arguments, while Carnap defends the *semantic* utility within a *methodological* framework of explication.

  4.  **Drafting the Diagnosis (incorporating specific figures):**
      *   *Quine's Move:* "Two Dogmas." Demands a non-circular definition of synonymy. Fails to find one. Concludes distinction is dogma. *Commitment:* Naturalism, Holism, Extensionalism.
      *   *Carnap/Grice-Strawson Move:* Carnap says analyticity is defined *within* a linguistic framework (meaning postulates). Grice/Strawson say Quine sets the bar too high (we know what "bachelor" means without a reductive definition). *Commitment:* Intensionalism, Framework-relativity, Ordinary language intuition.
      *   *Kripke's Move:* Decouples necessity and a priority. Shows "analytic" isn't the only route to necessity. *Commitment:* Modal realism, Rigid designators.
      *   *The Clash:* Quine asks "Where is this entity in the causal order?" (Naturalism). Carnap asks "Is this tool useful for systematization?" (Pragmatism/Explication). They are talking past each other on *criteria for existence*.

  5.  **Determining Progress:**
      *   If it's a cluster, progress requires **disentanglement**.
      *   *Metaphysical/Modal:* Kripke largely settled that necessity $\neq$ analyticity.
      *   *Epistemological:* The "a priori" is still debated (e.g., BonJour vs. Quineans).
      *   *Semantic/Cognitive:* This is where the action is. Cognitive science (conceptual atomism vs. molecularism) matters here. If concepts are atomic (Fodor), there are no "truths in virtue of meaning" because meanings don't have structure. If concepts are inferential roles (Brandom/Peacocke), analyticity returns as "constitutive inferences."
