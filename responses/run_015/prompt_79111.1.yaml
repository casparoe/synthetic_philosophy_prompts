answer: |-
  **PHILOSOPHY OF PHYSICS (MODULE CODE: PHY304)
  FINAL EXAMINATION QUESTION**

  **Question 4 (25 Marks)**

  Consider a hypothetical "black box" shared by Alice and Bob. Each receives an input bit ($x$ for Alice, $y$ for Bob) and produces an output bit ($a$ for Alice, $b$ for Bob). The joint probabilities $P(a,b|x,y)$ are defined as follows:
  *   If $(x,y) \in \{(0,0), (0,1), (1,0)\}$, the outcomes are perfectly correlated: $(a,b)$ is either $(0,0)$ or $(1,1)$ with probability $0.5$ each.
  *   If $(x,y) = (1,1)$, the outcomes are perfectly anti-correlated: $(a,b)$ is either $(0,1)$ or $(1,0)$ with probability $0.5$ each.
  *   In all cases, the marginal probability for each individual output is uniform ($0.5$).

  This condition can be summarized as $a \oplus b = x \cdot y$ (modulo 2), with uniform marginals.

  (a) Determine whether this box satisfies the **no-signalling condition** (show your working regarding the marginals). Then, compute the CHSH quantity $S = E(0,0) + E(0,1) + E(1,0) - E(1,1)$, where $E(x,y) = P(a=b|x,y) - P(a \neq b|x,y)$. [5 marks]

  (b) Bell's theorem is often summarized as "quantum mechanics violates local realism." Based on your result in (a), state precisely what role the no-signalling condition plays in the Bell argument. Does satisfying no-signalling guarantee compliance with Bell inequalities? [5 marks]

  (c) Analyze this box using the following distinctions:
  *   **Parameter Independence (PI):** The probability of a local outcome is independent of the distant setting.
  *   **Outcome Independence (OI):** The joint probability distribution is the product of the local marginal distributions.
  Identify exactly which of these two conditions the box violates. Explain why the derivation of the Bell inequality requires the conjunction of both conditions (Factorizability) rather than either one alone. [10 marks]

  (d) Quantum mechanics respects the no-signalling condition but violates Bell inequalities up to the Tsirelson bound ($S = 2\sqrt{2}$). This box achieves the algebraic maximum ($S=4$). What lesson does this carry for the relationship between no-signalling and the structure of quantum correlations? [5 marks]

  ***

  **MODEL ANSWER**

  (a) To check no-signalling, we examine Alice's marginal probability $P(a|x,y) = \sum_b P(a,b|x,y)$. For any setting pair $(x,y)$, the problem states the outcomes are equally likely within the correlated/anti-correlated pairs. For example, at $(0,0)$, $P(0,0)=0.5$ and $P(1,1)=0.5$. Summing over $b$, $P(a=0|0,0) = 0.5 + 0 = 0.5$. Since the marginals are explicitly defined as uniform ($0.5$) for all settings, $P(a|x,y) = 0.5$ regardless of $y$. Thus, Alice's statistics do not depend on Bob's input. The same applies to Bob. The box satisfies no-signalling.

  For the CHSH quantity:
  $E(0,0)$: Outcomes are $(0,0), (1,1)$. $P(a=b)=1$. $E=1$.
  $E(0,1)$: Outcomes are $(0,0), (1,1)$. $P(a=b)=1$. $E=1$.
  $E(1,0)$: Outcomes are $(0,0), (1,1)$. $P(a=b)=1$. $E=1$.
  $E(1,1)$: Outcomes are $(0,1), (1,0)$. $P(a=b)=0$. $E=-1$.
  $S = 1 + 1 + 1 - (-1) = 4$.

  (b) The result shows that satisfying the no-signalling condition does **not** guarantee compliance with Bell inequalities. This box satisfies no-signalling yet yields $S=4$, which vastly exceeds the Bell bound of 2. Therefore, no-signalling is a necessary but not sufficient condition for local realism. The Bell argument relies on a stronger constraint than merely prohibiting superluminal communication; it requires that correlations be explainable by shared past causes (local hidden variables). No-signalling alone permits "superquantum" correlations that are still non-signalling but too strong to be local.

  (c) Checking the conditions against the box's probabilities:
  **Parameter Independence:** Does $P(a|x,y)$ depend on $y$? No, the marginals are always $0.5$. The box satisfies PI.
  **Outcome Independence:** Does $P(a,b|x,y) = P(a|x,y)P(b|x,y)$? Consider $(0,0)$. $P(0,0|0,0) = 0.5$. But $P(a=0|0,0) \times P(b=0|0,0) = 0.5 \times 0.5 = 0.25$. Since $0.5 \neq 0.25$, OI is violated. The box violates Outcome Independence.

  The derivation of the Bell inequality requires **Factorizability**: $P(a,b|x,y,\lambda) = P(a|x,\lambda)P(b|y,\lambda)$. This mathematical form is logically equivalent to the conjunction of PI and OI (given the hidden variable $\lambda$). PI ensures the local probability doesn't depend on the remote setting; OI ensures that once $\lambda$ is specified, the outcomes are statistically independent. If OI fails, as it does here, the joint probability cannot be written as a product of local terms. Without this product form, the algebraic steps required to derive the inequality (specifically, factoring out the $\lambda$ distribution to bound the sum of correlations) cannot be performed. Thus, while PI prevents signalling, it is the failure of OI (or the conjunction) that allows the violation of the inequality.

  (d) The lesson is that no-signalling is not the unique physical principle that singles out quantum mechanics. There is a gap between the set of all no-signalling correlations (the "no-signalling polytope," which includes this box with $S=4$) and the set of quantum correlations (bounded by Tsirelson's $2\sqrt{2}$). Quantum mechanics is not simply "the most non-local theory that doesn't signal." There must be additional physical or information-theoretic principles (such as Information Causality or Macroscopic Locality) that restrict nature to the Tsirelson bound rather than the algebraic maximum allowed by no-signalling alone.

  ***

  **MARKING SCHEME**

  **Total: 25 Marks**

  **1. Calculation of No-Signalling and CHSH (5 Marks)**
  *   **Must Hit:** Correctly identifies marginals are independent of distant settings (No-Signalling holds). Correctly calculates $E$ values ($1, 1, 1, -1$) and sums to $S=4$.
  *   **Typical Error (B Grade):** Calculates $S=4$ correctly but claims No-Signalling is violated because "correlations exist," confusing signalling with correlation. Or arithmetic error on $S$ (e.g., forgetting the minus sign).

  **2. Role of No-Signalling in Bell Argument (5 Marks)**
  *   **Must Hit:** Explicitly states that No-Signalling is insufficient for Local Realism. Identifies that Bell inequalities can be violated even when No-Signalling holds (as demonstrated by the box).
  *   **Typical Error (B Grade):** States "Bell proves no-signalling is false" or "Bell proves locality is false" without distinguishing the specific sufficiency condition. Fails to use the $S=4$ result to support the claim.

  **3. Identification of PI vs. OI Violation (5 Marks)**
  *   **Must Hit:** Correctly identifies PI holds (marginals uniform) and OI is violated (joint $\neq$ product of marginals).
  *   **Typical Error (B Grade):** Swaps definitions (claims PI is violated because outcomes are correlated). Claims both are violated. Fails to show the numeric mismatch for OI ($0.5 \neq 0.25$).

  **4. Necessity of Conjunction (Factorizability) (5 Marks)**
  *   **Must Hit:** Explains that the inequality derivation requires the joint probability to factorize (Product Form). Notes that Factorizability = PI + OI. Without OI, the factorization fails, and the bound cannot be derived.
  *   **Typical Error (B Grade):** Claims PI alone is sufficient for Bell inequalities. States "Locality is violated" without referencing the product form required for the algebraic derivation.

  **5. Lesson for Quantum Mechanics (5 Marks)**
  *   **Must Hit:** Identifies that No-Signalling does not recover the Tsirelson bound. QM is a subset of No-Signalling correlations. Additional principles are needed to explain why $S \le 2\sqrt{2}$ and not $S=4$.
  *   **Typical Error (B Grade):** Claims QM violates no-signalling. Claims this box is physically impossible solely because it violates no-signalling (contradicting part (a)).

  **A vs. B Distinction:**
  *   **A Grade:** Clearly distinguishes between operational No-Signalling and ontological Factorizability. Uses the specific arithmetic of the box to demonstrate the gap between NS and LHV. Explains *why* the product form is algebraically necessary for the inequality.
  *   **B Grade:** Knows the conclusion ("Bell rules out locality") but treats No-Signalling as synonymous with Locality. May get the arithmetic right but fails to articulate why the box doesn't contradict the no-signalling theorem, or confuses PI/OI definitions.

  **Extra Credit Note:**
  If a student notes that the Bell derivation also assumes **Realism** (the existence of $\lambda$ independent of measurement) and argues that dropping Realism rather than Locality could also explain the violation, award **2 bonus marks** (capped at 25 total). This shows understanding that Bell rules out the conjunction of Locality and Realism, not Locality alone.
