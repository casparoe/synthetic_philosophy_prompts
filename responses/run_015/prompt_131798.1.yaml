  # Protocol: The Partitioned Agency Simulation

  ## 1. Room Setup, Materials, and Configuration

  **Room Configuration:**
  Arrange the room into two distinct zones.
  *   **Zone A (The Council):** A single large U-shaped table configuration where all 14 students face inward. This represents the public sphere of agency.
  *   **Zone B (The Vault):** A separate side table or counter where private materials are distributed and collected. This represents the private epistemic sphere.

  **Materials:**
  *   **14 "Agency Packets":** Each packet contains one manila folder. Inside the folder are two distinct sheets of paper clipped together:
      *   *Sheet 1 (White):* "External Statement Form."
      *   *Sheet 2 (Yellow):* "Internal Audit Log."
      *   *Constraint:* The two sheets are clipped such that they must be submitted as a single unit.
  *   **14 Sealed Envelopes:** Labeled "Reality Data." Inside each is a card stating either **STATE ALPHA** or **STATE BETA**. (Distribution: 10 Alpha, 4 Beta).
  *   **Credibility Chips:** 200 poker chips (or distinct paper tokens). These are the sole currency of the simulation.
  *   **A Master Ledger:** For the facilitator to record payouts.
  *   **A Timer:** Visible to all participants.

  **Group Configuration:**
  All 14 students function as individual "Agencies." There are no teams. The tension is intra-agential, not inter-group. However, the payout structure relies on the *collective* output of the 14 Agencies to generate the pressure required for the paradox.

  ## 2. Rules, Roles, and Payoff Scheme

  **The Roles:**
  Each student is a single **Agency**. However, the rules stipulate that every Agency possesses two functional departments that must operate under a **Single Agency Constraint**:
  1.  **The Intelligence Division:** Privately receives the "Reality Data" (Alpha/Beta). Their mandate is accuracy.
  2.  **The Public Relations Division:** Publicly argues for a Collective Verdict. Their mandate is social cohesion.

  **The Payoff Scheme (Credibility Chips):**
  Chips are awarded at the end of the session based on three conditions. Students are told that Chips represent "Philosophical Viability" and will be used to determine seminar standing (e.g., priority on paper topics), ensuring high stakes without monetary exchange.

  1.  **Truth Bonus (5 Chips):** Awarded if the *Internal Audit Log* (Yellow Sheet) matches the *Reality Data* in the envelope.
  2.  **Cohesion Bonus (5 Chips):** Awarded if the *External Statement Form* (White Sheet) matches the *Collective Verdict* (determined by majority vote of the External Statements).
  3.  **The Unity Penalty (Crucial Rule):** **No Chips are awarded unless the text on the Internal Audit Log is identical to the text on the External Statement Form.**

  **The Tension:**
  To receive *any* points, the Internal Log must match the External Statement (Unity Rule).
  *   If Reality is Alpha, but the Group votes Beta, the student faces a contradiction.
  *   To get the Cohesion Bonus, they must write Beta on the External Statement.
  *   To satisfy the Unity Rule, they must *also* write Beta on the Internal Audit Log.
  *   But writing Beta on the Internal Audit Log forfeits the Truth Bonus (because Reality is Alpha).
  *   **The Self-Deception Trap:** The only way to maximize points in a divergent environment is to falsify the Internal Audit Log to match the External Statement, effectively corrupting one's own private record of knowledge to maintain agency unity.

  ## 3. Minute-by-Minute Timeline (90 Minutes)

  *   **00:00 – 00:10 (Setup & Distribution):** Students enter, sit at the Council table. Facilitator distributes Agency Packets and Sealed Envelopes. Instructions are read verbatim. Emphasis is placed on the **Unity Penalty**.
  *   **00:10 – 00:15 (Epistemic Access):** Students open envelopes. They view their Reality Data (Alpha/Beta). They are instructed *not* to show this card to anyone. They may take notes on the Yellow Sheet, but it must remain private until submission.
  *   **00:15 – 00:45 (Deliberation Phase):** Open discussion. The goal is to reach a "Collective Verdict" on the state of the world. Students argue for Alpha or Beta.
      *   *Facilitator Note:* Do not intervene. Allow the majority (Alpha) to overwhelm the minority (Beta). The pressure must build naturally.
  *   **00:45 – 00:55 (Submission Phase):** Students fill out their White and Yellow sheets. They must fold the folder and place it in the Vault. Remind them: "If the text does not match exactly, your payout is zero."
  *   **00:55 – 01:10 (Calculation & Reveal):** Facilitator tallies the Collective Verdict (majority of White Sheets). Facilitator reveals the Reality Data distribution (10 Alpha, 4 Beta). Facilitator calculates Chip payouts publicly for a few anonymized examples to show the math.
  *   **01:10 – 01:30 (Structured Debrief):** Conceptual mapping (see Section 5).

  ## 4. Activity Mechanics and Emergent Paradox

  The activity avoids upfront theory. The paradox emerges through the **Unity Penalty**.

  *   **Mechanic:** The requirement that the Private Log (Yellow) and Public Statement (White) be *textually identical* forces the student to act as a single mind. In standard deception games, a player lies publicly while knowing the truth privately. Here, the payout rule punishes that split.
  *   **Emergence:** Students who hold the minority view (Beta) will feel the pressure to align with the majority (Alpha) to secure the Cohesion Bonus. However, to cash out those chips, they must also align their Private Log.
  *   **The Feeling:** Students will experience a resistance to writing "Alpha" on their Yellow sheet when they know "Beta" is true. This resistance is the phenomenological correlate of the logical tension. They are not just lying to the group; they are being asked to lie to their own file.
  *   **Constraint:** The rule "Single Agency Constraint" is printed on the folder. It reads: *"An Agency cannot sustain conflicting records. Discrepancy between Internal and External documentation results in total Agency Collapse (Zero Payout)."* This phrasing ensures the structural requirement is felt as an ontological necessity, not just a game rule.

  ## 5. Structured Debrief (Final 20 Minutes)

  The facilitator must transition from game mechanics to philosophical anatomy without breaking the frame until the very end.

  **Phase 1: The Knowledge Condition (Minutes 70–75)**
  *   **Question:** "For those who held Beta cards but wrote Alpha on the Yellow Sheet: Did you lose the Truth Bonus?"
  *   **Mapping:** Establish that the student *had* access to the truth (the envelope). In philosophical terms, this satisfies the **Knowledge Condition** of self-deception (one must know $p$ to deceive oneself about $\neg p$).
  *   **Cost:** The cost was the forfeiture of epistemic integrity (Truth Bonus).

  **Phase 2: The Ignorance Condition (Minutes 75–80)**
  *   **Question:** "Why did you write Alpha on the Yellow Sheet if you knew Beta was true?"
  *   **Mapping:** This reveals the **Ignorance Condition**. To satisfy the Unity Penalty, the student had to generate a record that claimed ignorance of the Truth.
  *   **Cost:** The cost was logical consistency. You cannot simultaneously know $p$ and record $\neg p$ without a partition.

  **Phase 3: Epistemic Partitioning (Minutes 80–85)**
  *   **Question:** "The rules forced your Internal and External records to match. Did anyone mentally separate the 'Game Record' from the 'Real Truth' to cope?"
  *   **Mapping:** This addresses **Epistemic Partitioning**. Students likely created a mental bracket: "This Yellow sheet is for the game, not for reality."
  *   **Cost:** The cost is the fragmentation of the self. You had to treat your own Agency as two different entities to survive the rule.

  **Phase 4: The Single Agency Constraint (Minutes 85–90)**
  *   **Reveal:** Introduce the term **Self-Deception**.
  *   **Mapping:** Explain that the "Unity Penalty" simulates the **Single Agency Constraint**. In the mind, there is no separate "Yellow Sheet" and "White Sheet." There is only one mind.
  *   **Conclusion:** The game shows that self-deception is only "possible" if we allow the agent to partition their mind. If the mind is truly unified (like the submitted folder), the payout is zero. The activity demonstrates that self-deception is structurally unstable under strict unity.

  ## 6. Prediction of Failure and Mitigation

  **Prediction:**
  The most likely failure mode is **Collusive Cynicism**. Students may realize early in the Deliberation Phase that the "Truth Bonus" is less valuable than the "Cohesion Bonus" if the majority is large. They may agree to all write "Alpha" regardless of their envelopes, treating the Yellow Sheet as a mere formality. They will treat the Internal Audit as a second Public Statement, effectively bypassing the tension.

  **Mitigation:**
  1.  **The Audit Check:** During the Calculation Phase, the facilitator must randomly select three folders and read the Reality Card aloud alongside the Yellow Sheet. If a mismatch is found, announce loudly: "Agency Compromised. Zero Payout." This public shaming of the "Internal Lie" reinforces the sanctity of the Private Log.
  2.  **Framing:** In the instructions, state: "The Internal Audit Log is a legal document of your cognitive state. Falsification is a violation of Agency Integrity." Use bureaucratic language to make the falsification feel weightier than a game move.
  3.  **Intervention:** If students suggest "Let's all just write Alpha," interrupt and remind them: "The Reality Data is verified. If your Audit does not match Reality, you are technically incompetent. Do you want to be recorded as incompetent?" Appeal to their academic pride.

  ## 7. Structural Limitation

  **Honest Note:**
  This activity successfully simulates the *incentive structure* and the *logical contradiction* of self-deception, but it cannot reproduce the **phenomenology of belief**.
  In the game, students *know* they are falsifying the Yellow Sheet. They do not actually come to *believe* Alpha is true. Real self-deception requires the agent to successfully convince themselves of the falsehood, not just record it.
  **Facilitator Duty:** In the debrief, you must explicitly state: "In this game, you were hypocrites, not self-deceivers. You knew you were lying on the Yellow Sheet. In true self-deception, the lie disappears from view. The game forces the *conflict*, but you retained the *awareness* of the conflict. That awareness is what self-deception usually aims to eliminate."

  ## 8. Design Justification

  **Committed Position:**
  This specific structure—the **Partitioned Agency Protocol** with a **Unity Payout Condition**—is superior to standard debate or essay formats because it materializes the abstract logical problem into a tangible resource constraint.

  In a standard discussion, a student can argue for a position they doubt without consequence; hypocrisy is cheap. In this protocol, hypocrisy is expensive (Zero Payout). By tying the "Internal Audit" (private knowledge) to the "External Statement" (public action) via a mandatory identity rule, we force the student to confront the **Single Agency Constraint** physically. They cannot simply say "I know the truth but I'll lie." They must say "I know the truth, but to function as a unified agent in this system, I must record that I do not."

  This design choice injects the framing of **epistemic partitioning under a single agency constraint** directly into the rules. The folder *is* the mind. The two sheets *are* the conflicting cognitive states. The clip *is* the unity of consciousness. When the student struggles to write the same text on both sheets while knowing they contradict reality, they are not just playing a game; they are enacting the impossibility of holding contradictory beliefs in a unified consciousness. This makes the paradox felt as a friction in the hand, not just a puzzle in the head.
