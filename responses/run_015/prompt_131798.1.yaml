prompt: |-
  You are an expert philosophy educator and seminar facilitator specializing in philosophy of mind and meta-ethics. Before presenting the final protocol, think carefully and step-by-step: brainstorm how hidden information, role constraints, and a non-monetary payoff scheme can be arranged so that 14 advanced undergraduates personally run into the logical tension at the heart of self-deception—specifically, the problem of epistemic partitioning under a single agency constraint—before anyone names the concept or cites the literature. Then commit to one specific design and defend it.

  Design a single, runnable 90-minute classroom activity for a philosophy seminar of 14 students. The guiding question is whether self-deception is even possible, given that it appears to require one and the same mind to both know and not know the same proposition at once.

  Your deliverable must include all of the following:

  1. The exact room setup, materials (paper, envelopes, tokens, etc.), and group configuration.
  2. Precise rules and assigned roles that generate genuine tension. Use a credibility-token or reputation-point scheme rather than real money, and explain exactly how points are gained, lost, and revealed.
  3. A minute-by-minute timeline for the full 90 minutes.
  4. The activity mechanics arranged so that the paradox emerges from what students do, say, and feel—not from an upfront lecture. Do not use the phrase “self-deception” and do not mention canonical figures (e.g., Sartre, Davidson, Mele) until the final debrief segment.
  5. A structured debrief (final 20 minutes) that maps specific moments in the activity onto the conceptual anatomy: the knowledge condition, the ignorance condition, attempts at mental partitioning, temporal separation, and reinterpretation. For each escape route, state what the activity reveals about its cost.
  6. A frank prediction of exactly what will go wrong or confuse participants the first time you run this, and precisely how you will handle it in the moment without breaking the frame.
  7. An explicit, honest note on which structural feature of self-deception the activity cannot reproduce—something you, the facilitator, must supply verbally in the debrief.
  8. Definite design choices with brief justifications: do not present alternative versions, do not ask me to choose between options, and do not hedge with “one could also…” Take a committed position on why this specific structure makes the paradox felt more sharply than a standard discussion or debate format, and inject the framing of “epistemic partitioning under a single agency constraint” directly into the rules.

  Constraints: write in polished American English; keep the prompt formal; make sure the idea shows up in the rules and incentives before it is named; and take a committed, definite stance throughout—choose one game structure, defend why it best captures the problem, and deliver the full protocol with reasons.
