prompt: |-
  hey so i've been thinking about this weird asymetry in how we assess consciousness across domains. in neurology clinics they use global-workspace-style metrics — perturbational-complexity scans, command-following fMRI — to check if a brain-injured patient has access consciousness, but they still keep the patient on life support if there's any hint of phenomenal experience left, even without reportability. meanwhile there's this proposed AI-governence framework, i think floated by some alignment groups, called the 'Broadcast Threshold' rule: a synthetic system gets provisional moral standing iff its representations are globally available to its planning modules, and they explicitly bracket phenomenal consciousness as empirically moot.

  what philosophical commitments does this double standard presupose? does it assume phenomenal consciousness is the actual ground of moral value for biological entities but access consciousness is enough for silicon ones? or is it just pragmatism — we protect humans because we might be wrong, but we deny AI rights because false positives are expensive? and if global workspace theory is right that access and phenomenal always come together, then isn't the whole asymetry incoherent? also, is there a hidden view about tractability here — that phenomenal consciousness is only 'real' when embodied?

  reconstruct the implicit theory, say whether the practice actually needs it or is compatible with several rival views, and tell me what'd have to change in either clinical or AI policy if we replaced the presuposed view with a straight block-style overflow position where phenomenal can exist without access in both directions — including for machines.
