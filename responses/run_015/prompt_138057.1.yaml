prompt: |-
  hey — I need to turn a half-baked idea into a two-page proposal for an internal seed grant. 9 months, one part-time RA, no teaching buyout, so please keep the scope honest. The topic is the Gould–Lewontin spandrels critique and whether there's anything left of it.

  My half-formed idea: the debate keeps stalling because everyone treats it as an empirical dispute about particular traits — is this thing an adaptation or is it a byproduct? — when what's actually load-bearing is a question about defaults. Which hypothesis is the null here, and who has to argue for their answer? And I think both sides can keep claiming the same cases because the question is secretly time-indexed: a feature can be a genuine byproduct at one point in its history and a genuine adaptation later, after it's been recruited for something and then refined by selection. The reptilian jaw bone that ends up as a mammalian middle-ear ossicle is the kind of case I mean — its origin story and its current-function story point in different directions, and each is true at its own time slice. Nobody in the argument seems to track which slice they're talking about, so a lot of the shouting is people answering different questions and calling each other wrong. I've been calling this "origin/maintenance slippage" and I want to build the project on it.

  What I need from you is the actual proposal document:

  - state the question precisely enough that it has a determinate answer in 9 months, and say what the possible answers are
  - explain why the standard framings leave it open — by which I mean the framing where adaptationism is a global thesis about how much of the phenotype selection actually explains, and the framing where it's just a heuristic for churning out hypotheses, plus whatever the usual move is for dissolving the whole thing into a debate about the word "function"
  - the approach, and why this approach rather than the obvious alternatives. I really do not want to write another survey of case studies, and I don't want more armchair analysis of word meanings; say honestly why whatever you pick is better than those two
  - what we'd hand a working biologist at the end. I'm imagining something like a principled way of setting the burden of proof locally — per trait, or per sub-system, or per kind of explanation — rather than settling it globally once and for all, but if that turns out to be a bad idea the proposal should be able to say so
  - and what would count as the project failing, as opposed to just coming out negative

  Don't bother with citations or a reading list, I'll fill those in myself. And please don't let it slide into generic "both sides have a point" mush — I want a proposal that could come back with a result that annoys one of the two camps.
reasoning: |-
  Here's a thinking process that leads to the proposal:

  1.  **Analyze the Request:**
      *   **Topic:** Gould–Lewontin spandrels critique (adaptationism vs. structuralism/byproducts).
      *   **Core Idea:** The debate stalls because it treats the issue as empirical (is trait X an adaptation?) rather than methodological (what is the null hypothesis?). Crucially, there's "origin/maintenance slippage": a trait can be a byproduct at $t_1$ and an adaptation at $t_2$ (exaptation/co-option).
      *   **Constraints:** 2-page proposal (internal seed grant), 9 months, 1 part-time RA, no teaching buyout. Scope must be honest/feasible.
      *   **Requirements:**
          *   Precise question with determinate answers.
          *   Critique of standard framings (global adaptationism, heuristic adaptationism, semantic dissolution).
          *   Methodology (why *this* approach, not case studies or armchair semantics).
          *   Deliverable for biologists (principled burden of proof framework).
          *   Failure conditions (distinct from negative results).
          *   Tone: Sharp, not "both sides" mush, willing to annoy a camp.
          *   No citations/reading list needed.

  2.  **Deconstruct the Core Idea ("Origin/Maintenance Slippage"):**
      *   The user's insight is strong: Adaptationists focus on current utility (maintenance), while Spandrel-proponents focus on historical origin. Both can be right about the *same* trait at *different times*.
      *   *Problem:* The debate treats "Adaptation" as a monolithic label.
      *   *Solution:* Disaggregate the label into temporal phases.
      *   *Feasibility Check:* Can this be done in 9 months with a part-time RA? Yes, if it's conceptual/philosophical analysis + limited targeted literature review, not new empirical data collection or exhaustive history of science.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy and descriptive. "Temporalizing the Spandrel" or "Origin vs. Maintenance." Let's go with something about the Null Hypothesis.
      *   **Project Summary:** Brief overview.
      *   **The Question:** Needs to be specific. Not "Who was right?" but "Does distinguishing origin from maintenance resolve the burden of proof dispute?"
          *   *Possible Answers:* Yes (it dissolves the conflict), No (conflict persists even with distinction), or Nuanced (it shifts the burden but doesn't eliminate conflict).
      *   **Critique of Standard Framings:**
          *   *Global Adaptationism:* Quantitative claim (% of traits). Hard to measure, leads to endless case-study ping-pong.
          *   *Heuristic Adaptationism:* "Just pretend it's an adaptation." Ignores the risk of confirmation bias.
          *   *Semantic Dissolution:* "It depends on how you define function." Too easy, doesn't help biologists design experiments.
      *   **Methodology:**
          *   *Why not case studies?* Too slow, anecdotal, prone to cherry-picking (the very problem identified).
          *   *Why not pure semantics?* Doesn't change practice.
          *   *The Chosen Approach:* Conceptual modeling of explanatory structures. Analyzing the *logic* of the inference in specific well-known cases (like the jaw/ear example provided) to formalize the temporal distinction.
          *   *RA Role:* Literature mapping, coding arguments for temporal markers, drafting the framework.
      *   **Deliverable:** A "Burden of Proof Protocol." A flowchart or decision tree for biologists to determine when the null should be "byproduct" vs. "adaptation" based on the temporal phase of the trait.
      *   **Failure Conditions:**
          *   *Negative Result:* The distinction doesn't help biologists agree. (This is still a result).
          *   *Failure:* We can't define the distinction rigorously, or the framework is indistinguishable from existing "exaptation" concepts (i.e., we reinvent the wheel without adding value).

  4.  **Refining the Scope (The "Honest Scope" Check):**
      *   9 months is short. A part-time RA is ~10 hours/week.
      *   Cannot review *all* of evolutionary biology.
      *   Must focus on the *structure of the argument*, not the biology itself.
      *   The "Protocol" needs to be theoretical but tested against a small set of paradigmatic cases (e.g., Gould's examples vs. Dawkins' examples) to see if the temporal split holds.
      *   *Self-Correction:* Make sure I don't promise a tool biologists will *use* immediately, but rather a *proposal* for a tool they *could* use. Actually, the prompt asks "what we'd hand a working biologist." Okay, a white paper + a decision matrix.

  5.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Professional, direct, slightly provocative.
      *   *Avoid:* "We will explore..." (Weak). Use "We will determine..." (Strong).
      *   *Avoid:* "Both sides..." (Mush). Use "This project argues that Side A is right about X, but Side B is right about Y, and the conflict is category error Z."

  6.  **Writing the Proposal (incorporating the constraints):**
      *   *Header:* Standard grant format (Title, PI, Duration, Budget - implied).
      *   *Section 1: Research Question.* Focus on the Null Hypothesis assignment.
      *   *Section 2: Context/Problem.* Why the debate is stuck (Global vs. Heuristic vs. Semantic).
      *   *Section 3: Methodology.* Conceptual analysis + targeted case audit (not new case studies).
      *   *Section 4: Deliverables.* The "Temporal Burden Framework."
      *   *Section 5: Risk/Failure.* Distinguishing "Null Result" from "Project Failure."

  7.  **Review against constraints:**
      *   2 pages? (Word count needs to be tight, approx 1000-1200 words).
      *   9 months/Part-time RA? (Methodology reflects this).
      *   No teaching buyout? (PI time is limited, RA does heavy lifting).
      *   No citations? (Check).
      *   Annoy a camp? (Yes, by suggesting Adaptationists are ignoring history and Structuralists are ignoring current utility).

  8.  **Final Polish:** Check the "Origin/Maintenance Slippage" terminology. Ensure it's central. Make sure the "Null Hypothesis" angle is clear. (Self-correction: Ensure the distinction between *exaptation* and *origin/maintenance slippage* is clear. Exaptation is the biological phenomenon; Slippage is the argumentative error. This is a crucial philosophical distinction).

  9.  **Final Output Generation** (Proceeding to generate the text based on these thoughts).
answer: |-
  **Project Title:** Temporalizing the Null: Origin, Maintenance, and the Stalemate in the Adaptationism Debate
  **PI:** [Your Name]
  **Duration:** 9 Months
  **Personnel:** PI + 1 Part-Time Research Assistant

  ### 1. The Research Question

  The Gould–Lewontin critique of adaptationism has stalled. Decades of debate have failed to produce a consensus on the default stance for evolutionary explanation. This project asks a specific methodological question: **Does disaggregating trait history into distinct temporal phases (Origin vs. Maintenance) resolve the dispute over where the burden of proof lies?**

  Current arguments treat "adaptation" as a static label. We hypothesize that the stalemate persists because Adaptationists argue from the perspective of *maintenance* (current utility), while Spandrel-proponents argue from the perspective of *origin* (initial cause). Both can be simultaneously true for a single trait (e.g., mammalian ear ossicles were structural byproducts at $t_1$ and selected adaptations at $t_2$).

  **Determinable Outcomes:**
  1.  **Resolution:** The distinction successfully assigns the burden of proof locally (e.g., Null = Byproduct for Origin; Null = Adaptation for Maintenance).
  2.  **Persistence:** The distinction is logically sound but fails to change argumentative practices because the camps are committed to global ideological positions rather than local explanatory accuracy.
  3.  **Redundancy:** The distinction collapses into existing concepts (e.g., "exaptation") without offering new methodological leverage.

  ### 2. Why Standard Framings Fail

  To justify this approach, we must explain why the three dominant framings of the debate are insufficient for a 9-month scope.

  **A. Global Adaptationism (The Quantitative Claim)**
  This framing asks: "What percentage of the phenotype is shaped by selection?" This is empirically intractable. It invites endless case-study ping-pong where each side cherry-picks traits that favor their worldview. It requires exhaustive biological survey work impossible within this budget. More critically, it treats the null hypothesis as a global constant, whereas we suspect it should be a local variable dependent on the trait's evolutionary stage.

  **B. Heuristic Adaptationism (The "As-If" Claim)**
  This framing argues that assuming adaptation is merely a productive research strategy, regardless of truth. This dissolves the philosophical conflict but ignores the cost of false positives. If the null is incorrectly set to "adaptation," researchers waste resources optimizing models for traits that are structural constraints. A heuristic defense offers no way to detect when the heuristic has failed.

  **C. Semantic Dissolution (The "Function" Claim)**
  This framing suggests the debate is merely verbal, hinging on definitions of "function" (selected-effect vs. causal-role). While often true, this is a conversation-stopper. Telling biologists they are "speaking past each other" does not help them design experiments. It offers no protocol for deciding which definition applies to which experimental context.

  **Our Approach:**
  We bypass the empirical quantification and the semantic dissolution by focusing on **inferential structure**. We are not asking "Is this trait an adaptation?" We are asking "At what point in the inference chain does the claim 'this is an adaptation' become warranted?" This is a conceptual analysis project, not an empirical biology project, making it feasible for a philosophy-of-science team with limited RA support.

  ### 3. Methodology

  We will not conduct a new survey of case studies. That invites the very cherry-picking we aim to critique. Instead, we will perform a **structural audit of paradigmatic cases**.

  **Phase 1: Argument Mapping (Months 1–3)**
  The RA will code key texts from the adaptationism debate (Gould, Lewontin, Dawkins, Dennett, and contemporary successors). We are not looking for biological claims, but for *temporal markers*. We will tag instances where proponents of either side implicitly shift between origin-claims and maintenance-claims without signaling the transition.
  *   *Deliverable:* A dataset of argumentative moves identifying where "Origin/Maintenance Slippage" occurs.

  **Phase 2: Formalizing the Distinction (Months 4–6)**
  The PI will develop a formal model of the "Temporal Burden." We will define the conditions under which the null hypothesis must flip from "structural constraint/byproduct" to "selection." This involves integrating the concept of exaptation not as a biological category, but as a methodological boundary line.
  *   *Key Test:* We will apply this model to the "hard cases"—traits where the origin is obscure but current utility is high (e.g., human language capacity, bird feather structure). If the model cannot assign a burden of proof here, the theory is insufficient.

  **Phase 3: Stress-Testing and Drafting (Months 7–9)**
  We will circulate the draft framework to a small advisory group (one evolutionary biologist, one philosopher of biology) to test for usability. The goal is not consensus, but clarity: Does the biologist understand *when* to use which null?
  *   *Why this over alternatives:* Armchair analysis alone risks irrelevance; empirical case studies risk intractability. This hybrid approach tests the *logic* of the debate against established biological consensus without requiring new data collection.

  ### 4. Deliverables: The "Temporal Burden Protocol"

  The primary output will not be a standard journal article alone. We will produce a **white paper and decision matrix** intended for working evolutionary biologists.

  **The Protocol:**
  A principled guide for setting the burden of proof locally. It will not say "Adaptationism is wrong." It will say:
  *   *If investigating trait origin:* The null is **Byproduct/Constraint**. (Burden on Adaptationist).
  *   *If investigating trait maintenance:* The null is **Selection**. (Burden on Structuralist).
  *   *If the history is unknown:* The protocol specifies the evidentiary threshold required to move from Origin-Null to Maintenance-Null.

  **Why this is valuable:**
  It converts a metaphysical stalemate into a methodological workflow. It allows an adaptationist to concede that a trait began as a spandrel without conceding that it is currently useless. It allows a structuralist to concede current utility without conceding historical optimality.

  **Potential to Annoy:**
  This framework explicitly rejects the Adaptationist demand for a universal "Design Stance" null. It asserts that assuming selection by default is historically negligent. Conversely, it rejects the Spandrel-proponent demand that structural constraints are the primary driver, asserting that maintenance is almost always selection-driven. Both sides lose their global monopoly; both sides retain local validity.

  ### 5. Risk and Failure Conditions

  It is vital to distinguish between a negative result and project failure.

  **Negative Result (Acceptable):**
  We find that distinguishing Origin vs. Maintenance does *not* reduce conflict. For example, if we find that Adaptationists insist on treating Origin as a selection problem regardless of evidence, the result is that the debate is ideological, not methodological. This is a publishable finding that clarifies the sociology of the field.

  **Project Failure (Unacceptable):**
  1.  **Redundancy:** We discover that "Origin/Maintenance Slippage" is merely a re-description of the existing adaptation/exaptation distinction with no added methodological value. If the "Protocol" ends up saying "Check if it's an exaptation," we have failed to advance the discourse.
  2.  **Intractability:** We find that Origin and Maintenance are empirically inseparable in practice (i.e., you cannot investigate maintenance without assuming an origin story). If the distinction cannot be operationalized for a working biologist, the framework is useless.
  3.  **Scope Creep:** The RA becomes bogged down in biological details of specific traits rather than analyzing the argument structure. We will mitigate this by strictly limiting the case audit to texts where the argumentative structure is already explicit.

  ### 6. Feasibility and Budget

  **Personnel:**
  *   **PI:** Conceptual modeling, framework design, final writing. (No buyout requested; work conducted during summer/research leave).
  *   **RA (Part-time, 10hrs/week):** Literature coding, argument mapping, bibliography management, drafting the initial decision matrix.

  **Timeline:**
  The 9-month window is tight but sufficient because we are not collecting biological data. We are analyzing the logic of existing arguments. The RA's role is focused on the "Argument Mapping" phase, which is labor-intensive but low-complexity, freeing the PI for high-level synthesis.

  **Conclusion:**
  The adaptationism debate is a classic example of a philosophical error masquerading as an empirical dispute. By isolating the temporal slippage in the argument structure, this project offers a way to dissolve the stalemate. We do not need more case studies; we need a clearer rulebook for how to use them. This project writes that rulebook.
