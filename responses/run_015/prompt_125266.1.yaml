answer: |-
  Your engineering metaphor provides a robust heuristic for historical analysis. The distinction between 'cascading system failure' (collapse) and 'graceful degradation' (restructuring) maps surprisingly well onto the archaeological and historical record, provided we define the 'system' with precision.

  There is a single principle that coheres with all five of your verdicts. It is not merely about survival or destruction, but about the **Continuity of the Generative Substrate**.

  ### The Principle: Continuity of the Generative Substrate

  A society undergoes **Graceful Degradation** if, following a shock, the underlying substrate required to reproduce its complexity remains intact. This substrate consists of two components:
  1.  **Informational Density:** The capacity to store and transmit complex rules (writing, law, liturgy, technical knowledge).
  2.  **Reproductive Capacity:** The ecological or economic ability to sustain the energy surplus required for that complexity.

  A society undergoes **Cascading System Failure (Collapse)** if the shock destroys the substrate itself, rendering the previous level of complexity impossible to reproduce for a significant duration, forcing a reset to a lower baseline.

  ### Application to Your Verdicts

  This principle delivers your five verdicts by isolating the specific clause triggered in each case:

  1.  **Late Bronze Age (Collapse):** *Failure of Informational Density.*
      The palatial centres were not merely buildings; they were the hardware for a bureaucratic operating system reliant on literacy. When they were destroyed, the ability to read and write vanished across the region. The 'code' for international trade and administration was lost. The substrate was wiped; recovery required re-inventing literacy centuries later.

  2.  **Easter Island (Collapse):** *Failure of Reproductive Capacity.*
      While the population survived, the specific ecological surplus (large trees for transport, soil fertility for intensive agriculture) required to sustain the moai-building chiefdoms was irretrievably damaged. The system could not 'reboot' its defining complexity. The society was forced to run on a lower-power mode (clan-based warfare, smaller statues) permanently.

  3.  **Classic Maya (Degradation):** *Preservation of Substrate.*
      Although the southern lowland cities failed (hardware loss), the 'software' (language, calendar, writing) and the 'power supply' (agriculture in the northern Yucatán and highlands) remained intact. Complexity was not lost; it was migrated to different nodes. The system degraded locally but maintained global continuity.

  4.  **Western Roman Empire (Degradation):** *Preservation of Informational Density.*
      The imperial state apparatus failed, but the Church preserved the informational substrate (Latin literacy, administrative records, legal concepts). Successor kingdoms deliberately loaded the old 'drivers' (Roman law) onto new hardware (Germanic monarchies). The complexity was maintained through institutional memory.

  5.  **Soviet Union (Degradation):** *Preservation of Reproductive Capacity.*
      The political ideology and state apparatus dissolved, but the underlying industrial infrastructure, social networks, and demographic base remained. The 'kernel' (Russian society) continued running, merely swapping the 'application layer' (Communism for Capitalism).

  ### Predictions for Unlisted Cases

  Applying the **Continuity of the Generative Substrate** principle yields clear predictions for your two undecided cases:

  **1. The Khmer Abandonment of Angkor (15th Century)**
  *   **Verdict:** Graceful Degradation.
  *   **Reasoning:** While the hydraulic city of Angkor was abandoned due to environmental strain and geopolitical shifts, the Khmer state did not cease to exist. The court moved to Phnom Penh and later Longvek. Crucially, the informational substrate (Khmer script, Theravada Buddhist institutional memory) and the reproductive capacity (rice agriculture) remained intact. The system reconfigured its topology rather than losing its code.
  *   **Outcome:** This aligns with your Maya and Roman verdicts.

  **2. The Indus Valley Civilisation (1900–1300 BCE)**
  *   **Verdict:** Cascading System Failure (Collapse).
  *   **Reasoning:** This case mirrors the Late Bronze Age. The urban centres were abandoned, but critically, the writing system disappeared entirely and was not recovered. The standardised weights, measures, and long-distance trade networks that defined the system's complexity vanished. Populations shifted to smaller, rural settlements with significantly lower organisational complexity. The informational substrate was severed.
  *   **Outcome:** This aligns with your Late Bronze Age and Easter Island verdicts.

  ### A Stress Test on Coherence

  While the principle above saves all five of your verdicts, I must highlight a point of fragility in your framework regarding **Easter Island**.

  In your distinction between Maya and Easter Island, you rely on the premise that Maya populations persisted without demographic catastrophe, whereas Easter Island suffered sharp contraction. Current archaeological consensus suggests the Maya lowlands actually suffered a demographic collapse comparable to, or exceeding, that of Easter Island (up to 90% depopulation in some zones).

  If you accept the historical reality that the Maya *did* suffer a demographic catastrophe, your principle forces you to choose one of two paths:

  1.  **Overturn the Easter Island Verdict:** Classify Rapa Nui as **Graceful Degradation**. The inhabitants survived, adapted their agriculture (switching to rock gardening), and maintained cultural continuity despite the loss of the moai complex. This aligns them with the Maya: a shift in strategy rather than a system wipe.
  2.  **Complicate the Principle:** You must add a clause specifying that *Ecological Overshoot* constitutes collapse regardless of survival, whereas *Political Fragmentation* does not. This makes the principle less elegant, as it treats ecological failure differently from political failure, even if the outcome (loss of monuments) is the same.

  **Recommendation:**
  It is more plausible to **retain the verdict and complicate the principle slightly**. Your intuition on Easter Island likely stems from the *total* loss of the defining technological capability (moving statues), whereas the Maya retained the capability to build monuments (as seen in the Post-Classic period). Therefore, refine your principle to specify that Collapse requires the **Loss of the Mechanism of Complexity**, not just the loss of the Complex Output.

  *   **Maya:** Lost the output (Southern cities), kept the mechanism (Writing/Building knowledge).
  *   **Easter Island:** Lost the output (Moai), lost the mechanism (Large trees/Transport technology).

  This refinement preserves all five of your verdicts while acknowledging that survival alone does not preclude collapse. The distinction remains firmly between **System Failure** (the inability to run the previous programme) and **System Change** (running the same programme on different hardware).
