answer: |-
  Here is a rigorous argument designed for a graduate seminar context. It is structured to defend the thesis that the realization response fails to secure causal efficacy for mental properties, thereby leaving Non-Reductive Physicalism (NRP) vulnerable to Kim's exclusion argument.

  ***

  # The Relocation of Exclusion: Why the Realization Response Fails to Save Non-Reductive Physicalism

  ## Introduction
  The standard defense of Non-Reductive Physicalism (NRP) against Jaegwon Kim's causal exclusion argument relies heavily on the **realization relation**. Proponents argue that because mental events are realized by physical events, they are not numerically distinct competitors; thus, the charge of systematic overdetermination is avoided. My thesis is that this response is metaphysically insufficient. While the realization move may successfully deny that mental and physical *events* compete, it fails to demonstrate how mental *properties*, considered as distinct from their physical realizers, exercise causal efficacy. The realization response merely relocates the exclusion problem from the level of events to the level of properties without resolving it. By analyzing the structure of Kim's argument—specifically the interaction between Causal Closure and the Exclusion Principle—I will demonstrate that unless mental properties are identical to physical properties (reductionism), they remain causally inert (epiphenomenalism).

  ## 1. Reconstructing Kim's Target: Properties, Not Just Events
  To see why the realization response fails, we must first be precise about what Kim's argument targets. It is a common misconception that the exclusion argument is solely about event individuation. While Kim utilizes the **Causal Closure of the Physical** (every physical event has a sufficient physical cause), the crux of the argument lies in the **Exclusion Principle**: *No single event can have more than one sufficient cause at a given time, unless it is a genuine case of causal overdetermination.*

  NRP attempts to bypass this by asserting token identity: the mental event $m$ is identical to the physical event $p$. Therefore, there is only one cause, not two. This avoids the charge of overdetermination. However, Kim's argument is ultimately about **property instantiation**. When we say $p$ causes $e$, we mean $p$ causes $e$ *in virtue of* instantiating physical property $P$. If NRP holds, $m$ instantiates mental property $M$, and $M \neq P$ (Distinctness Premise).

  The critical question is not "Are there two events?" but rather: **"In virtue of which property did the cause produce the effect?"** If the physical property $P$ is sufficient for the effect, and $M$ is distinct from $P$, the Exclusion Principle dictates that $M$ is excluded from doing any causal work. The realization response attempts to bridge $M$ and $P$, but it does so by defining $M$ in terms of its realization base. This leads to the core failure: it conflates the *existence* of the property with the *efficacy* of the property.

  ## 2. The Realization Move and the "Qua" Problem
  The standard NRP defense argues that $M$ is causally relevant because it is realized by $P$. Since $P$ is causally efficacious, and $M$ is "nothing over and above" $P$, $M$ inherits $P$'s causal powers. This is often framed through Shoemaker's account of properties as clusters of causal powers or Yablo's determinable/determinate model.

  However, this inherits a fatal vulnerability: **The "Qua" Problem.**
  Even if we grant that the event $m$ is identical to $p$, causation is sensitive to the properties instantiated by the event. For $M$ to be causally efficacious, the event must cause the outcome *qua* $M$, not merely *qua* $P$.
  1.  **Closure:** The physical effect $e^*$ has a sufficient physical cause $p$ (in virtue of $P$).
  2.  **Distinctness:** $M$ is not identical to $P$.
  3.  **Realization:** $M$ is realized by $P$.

  If $P$ is sufficient to bring about $e^*$, then the instantiation of $P$ screens off the instantiation of $M$. The realization relation is a synchronic determination relation, whereas causation is diachronic. To say "$M$ causes $e^*$ because $P$ realizes $M$ and $P$ causes $e^*$" is to admit that the causal work is being done entirely by $P$. $M$ is merely a passenger.

  If the NRP proponent insists that $M$ does work *because* it is realized by $P$, they are effectively arguing that $M$ borrows causal power. But if $M$ has no causal power *distinct* from $P$ (to avoid violating Closure), then $M$ contributes nothing to the causal transaction that $P$ does not already account for. If $M$ contributes nothing distinct, it is causally redundant. If it is redundant and distinct, it is excluded. The realization relation explains why $M$ is present, but it does not explain how $M$ *pushes*.

  ## 3. Anticipating Counterarguments

  ### Objection 1: The Determinable/Determinate Model (Yablo)
  A sophisticated proponent of the realization response will invoke Stephen Yablo's argument. They will argue that $M$ and $P$ are not competitors because they stand in a determinable/determinate relation (like "red" and "scarlet"). Causation requires proportionality; often, the mental property (determinable) is more proportional to the effect than the specific physical property (determinate). Therefore, $M$ is the true cause, and $P$ is merely the realization.

  **Reply:** This objection conflates **causal explanation** with **metaphysical causation**. Yablo's proportionality constraint is a pragmatic criterion for selecting the *best description* of a cause for the purposes of explanation. It does not alter the metaphysical machinery of production.
  Even if $M$ is a better *explanation* for why I reached for the water (because it cites my thirst rather than my C-fiber firing), the metaphysical *production* of the arm movement is fully accounted for by the neurophysiology. The Closure of the Physical demands that the physical forces and laws are sufficient for the motion. The fact that "thirst" is a more useful label for historians or psychologists does not grant the property of *being thirsty* ontological leverage over the atoms in my arm. The exclusion argument is an ontological argument, not an explanatory one. Saving the utility of mental explanation does not save the causal efficacy of mental properties.

  ### Objection 2: Realization as Causal Explanation
  Another objection is that the realization relation itself constitutes a form of causal explanation. If $M$ is a functional role defined by its inputs and outputs, then to instantiate $M$ just *is* to be poised to cause certain effects. Therefore, $M$ is causally efficacious by definition.

  **Reply:** This is a category mistake regarding the nature of realization. Realization is a constitutive relation, not a causal one. To say $P$ realizes $M$ is to say $P$ constitutes the instantiation of $M$ at time $t$. It is not to say $P$ causes $M$.
  If $M$ is defined functionally by its causal role, we face a dilemma:
  1.  If the causal role is defined by physical inputs and outputs, then $M$ is merely a shorthand for a complex physical causal chain. This collapses into **Reductive Physicalism**, abandoning NRP.
  2.  If $M$ is distinct from the physical chain (as NRP requires), then defining it by its causal role does not grant it the power to fulfill that role. You cannot define a property into causal efficacy. If the physical realizer $P$ is doing the work required by the functional definition, $M$ is again a free rider. The definition of $M$ references causal powers, but it does not *possess* them independently of $P$.

  ## 4. The Dilemma for Non-Reductive Physicalism
  The failure of the realization response forces NRP into a dilemma that Kim originally identified, which the realization response was meant to dissolve but actually reinforces.

  *   **Horn 1: Violation of Closure.** If the mental property $M$ exercises causal influence *over and above* the physical property $P$, then the physical effect $e^*$ has two sufficient causes ($P$ and $M$). Since $M \neq P$, this is systematic overdetermination, which is implausible, or it implies that the physical domain is not causally closed (violating a core tenet of physicalism).
  *   **Horn 2: Epiphenomenalism.** If $M$ does not exercise influence over and above $P$, then $P$ does all the work. $M$ supervenes on $P$, but $M$'s instantiation adds no causal force to the transaction. $M$ is an effect of $P$ (perhaps) and a correlate of $e^*$, but not a cause of $e^*$.

  The realization response attempts to walk between these horns by saying "$M$ causes $e^*$ *by* $P$ causing $e^*$." But this is unintelligible on a robust view of properties. If $P$ causes $e^*$, the causal transaction is complete. To add "$M$ causes $e^*$" is either redundant (if $M=P$ in causal power) or false (if $M \neq P$ in causal power). NRP insists $M \neq P$ (Distinctness), so it must accept redundancy. But distinct, redundant properties are excluded properties.

  ## Conclusion
  The realization response fails because it addresses the wrong problem. It solves the problem of *event* individuation (avoiding the claim that there are two distinct events competing for causation) but leaves untouched the problem of *property* efficacy. Kim's exclusion argument is fundamentally about whether distinct properties can both be sufficient for the same effect.

  By relying on the realization relation, the non-reductive physicalist admits that the physical realizer is sufficient for the outcome. Consequently, the mental property, considered as a distinct higher-level property, is screened off. The move saves mental *explanation* and mental *predication*, but it sacrifices mental *causation*. For a seminar defense, the crucial point to maintain is this: **Metaphysical dependence (realization) does not transmit causal agency.** Unless one is willing to reduce mental properties to physical properties (abandoning NRP), one must accept that the physical base does all the causal work, rendering the mental property causally inert. The realization response does not defuse the exclusion argument; it merely clarifies why epiphenomenalism is the cost of non-reductive physicalism.
