answer: |-
  ### Referee's Working Notes (Unstructured)

  *   **First Impression:** The "Ledger View" is a catchy metaphor for a aggregative account of political obligation. It feels like a attempt to mathematicalize the "fair play" intuition. The core move—shifting from act-indexed to quota-indexed duty—is genuinely interesting and does some heavy lifting on the "acceptance of punishment" puzzle.
  *   **The "Alma" Case:** This is the strongest intuition pump. It forces the reader to confront why we think paying the fine *matters*. If the duty is to the scheme, Alma seems to have satisfied it better than the jail-goer. This is the hook of the paper.
  *   **The "Cara" Case:** This reveals the weakness. If publicity is only epistemic, then secret lawbreaking is permissible if the ledger balances. This divorces "civil disobedience" from its democratic function (appealing to the public). It risks turning civil disobedience into a private moral accounting exercise.
  *   **The Metaphor:** "Ledger," "Deposit," "Withdrawal." It's vivid but dangerous. It implies fungibility. Can I really offset a traffic violation with jury duty? The essay tries to block this with "load-bearing" (O1), but that looks like a patch. If some laws are lexically prior (rights-protecting), the ledger model breaks because you can't "overpay" elsewhere to cover a rights violation.
  *   **Friend's Objections:**
      *   F1 is the standard Rawlsian line. The essay claims it's unstable, but is it? Rawls allows for a threshold. The Ledger View just makes the threshold a running total. It's a difference of degree, not kind.
      *   F2 is definitional. The essay is arguing for a revision of the concept. That's fine, but needs to be owned.
      *   F3 is the real threat. Who audits the ledger? The "reasonable agent" reply is circular.
  *   **Section 5 (Reverse Argument):** This is ambitious. Claiming that the *practice* of accepting punishment proves the *truth* of obligation is a transcendental argument. It's vulnerable to the "costly signaling" counter-explanation (anarchists can explain the behavior without the debt).
  *   **Distinctiveness:** This screams "Fair Play Theory" (obligation arises from receiving benefits of a cooperative scheme). The "quota" language is just a specific mechanism within Fair Play. It's not a new *ground* of obligation, just a new *structure*.
  *   **Verdict:** There is a paper here, but it needs to stop pretending it isn't Fair Play theory. The "Act vs. Quota" distinction is the real contribution. The "Philosophical Anarchism" angle in Section 5 is a distraction. Focus on the structure of the duty.

  ---

  ### Formal Comments

  **To:** The Author
  **From:** Referee
  **Re:** "Compliance as a quota: a ledger view of political obligation and civil disobedience"

  Here is an assessment of your draft based on the six points you requested. I have adopted the role of a specialist in political obligation and protest ethics, evaluating the argument on its internal coherence and its fit within the broader theoretical landscape.

  #### 1. Adjudication of Your Friend's Claims

  **F1: The paradox is apparent; a general but not absolute duty handles the cases.**
  *   **Where your friend is right:** This is the standard liberal position (often associated with the Rawlsian tradition). It is stable enough for most practical purposes. Most people intuitively understand that duties can be overridden by extreme injustice without needing a "ledger."
  *   **Where it is question-begging:** It relies on a threshold view ("the duty holds *until* injustice is too great") without explaining the metric of that threshold. Your friend asserts stability but offers no mechanism for weighing the duty against the injustice.
  *   **Do your replies meet it?** Yes, effectively. You show that the "exception" model creates a binary (duty holds/duty vanishes) that makes the acceptance of punishment puzzling (if the duty vanishes, why pay?). Your Ledger View explains the persistence of the duty *through* the act of disobedience. You win on explanatory power regarding the *ritual* of punishment, even if your friend wins on simplicity.

  **F2: Publicity is constitutive of the concept.**
  *   **Where your friend is right:** In the existing literature, "civil disobedience" is defined partly by its communicative intent. If no one knows, it isn't *civil* disobedience; it's just evasion. Your friend is defending a taxonomy.
  *   **Where it is question-begging:** It conflates the *definition* of a term with the *justification* of an act. Just because we label secret lawbreaking something else doesn't mean it's morally distinct in the way that matters for obligation.
  *   **Do your replies meet it?** Yes. You successfully argue that publicity is derivative (epistemic) rather than constitutive. You show *why* publicity is required (to audit the ledger) rather than just stipulating it. This is a strong philosophical move: you are grounding the condition rather than listing it. However, you must acknowledge that you are revising the standard definition, not merely analyzing it.

  **F3: The view cannot separate the civil disobedient from the selfish complier (unfalsifiable).**
  *   **Where your friend is right:** This is the strongest objection. If the ledger is internal to the agent, the "selfish selectivity" objection (O1) and the "auditor problem" (O5) collapse into the agent's own conscience. A racist could claim their ledger balances because they value "social order" over "equality."
  *   **Where it is question-begging:** It assumes that *any* appeal to reasonableness is unfalsifiable. But all moral theories rely on the "reasonable agent" standard eventually.
  *   **Do your replies meet it?** Weakly. Your reply in (O5) that "publicity converts self-assessment into something checkable" is the crux, but it is under-developed. Publicity allows *others* to check, but on what standard? If the standard is the Ledger View itself, and the Ledger View allows fungibility (taxes for zoning), the public cannot audit you without accepting your exchange rates. You need a stronger account of *objective* exchange rates, or this objection stands.

  #### 2. The Weakest Load-Bearing Claim

  The weakest load-bearing claim is the **fungibility of compliance** (the idea that different legal duties can be traded against one another in a single currency).

  **Why it is weak:**
  The entire Ledger View depends on the possibility of a "Net Drawdown." This implies that obeying Law A creates a credit that can offset disobeying Law B. But legal obligations are not homogeneous. Some obligations are *side-constraints* (e.g., do not assault), while others are *contributions* (e.g., pay taxes).
  If I assault someone (breaking a side-constraint) but pay double taxes (increasing contribution), have I balanced the ledger? Intuitively, no. The harm is to a specific person, not a drawdown on the "scheme."
  Your reply in (O3) tries to handle this by distinguishing "identifiable parties" from "collective provision." But this creates a dual-system: a Ledger for public goods, and a Rights-Constraint system for individuals. If you need a second system to handle the most serious violations, the Ledger View is not a general theory of obligation; it is a specific theory of administrative compliance. If the Ledger cannot handle the hard cases (rights violations), it cannot carry the weight of "political obligation" generally.

  #### 3. Distinctiveness: Does it collapse into a familiar position?

  Yes, the Ledger View is best understood as a **quantified Fair Play theory**.

  **The Fit:**
  *   **Fair Play:** The core idea of Fair Play is that receiving benefits from a cooperative scheme creates an obligation to do one's "fair share" to maintain it. Your "quota" and "fair share" language maps directly onto this.
  *   **The Ledger Addition:** Traditional Fair Play theory is often qualitative (do your part). You are making it quantitative (keep the balance). You are arguing that the "fair share" is an aggregate over time, not a requirement of perfect adherence to every rule.
  *   **Why it matters:** This isn't a collapse that destroys the project, but you should own it. By framing it as Fair Play, you inherit the standard objections to Fair Play (e.g., what if I didn't ask for the benefits? what if the scheme is unjust?).
  *   **Differentiation:** It is *not* a Natural Duty account (which grounds obligation in justice itself, regardless of the scheme). It is *not* a Samaritan account (which grounds it in the need to rescue others from harm). It is distinctively transactional: you owe the scheme because you are a participant in the scheme. The "Ledger" is simply a mechanism for calculating the "fair share" when the rules are imperfect.

  #### 4. The Strongest Objection Not in O1–O5

  **The "Democratic Authority" Objection.**

  **The Case:**
  In a democracy, the law claims authority because it is the output of a collective decision-making procedure. When you obey the law, you are respecting the *procedure*, not just the *outcome*.
  The Ledger View treats laws as *tasks* to be completed (compliance units). But laws are also *authoritative directives*. When you decide unilaterally to "withdraw" from compliance (even if you deposit elsewhere), you are substituting your own judgment for the collective procedure.
  **Why it bites:**
  Even if your ledger balances numerically, you have violated the *authority* of the democratic process to determine how resources are allocated. Alma (Section 4) decides *her* money goes to the court registry, not the military. But in a democracy, the legislature decided it goes to the military. By redirecting the funds, she isn't just balancing a ledger; she is usurping the allocative authority of the state. The Ledger View justifies individual reallocation of public duties, which undermines the very idea of collective self-government. You can balance your moral ledger while violating your democratic obligation.

  #### 5. Assessment of the Reverse Argument (Section 5)

  **Does the practice give the anarchist anything to explain?**
  Yes. The widespread norm of accepting punishment is a datum that any theory must accommodate. The anarchist cannot simply ignore it.

  **Is your explanation better than prudential/communicative alternatives?**
  *   **Prudential:** Anarchists say we accept punishment to avoid escalation or to look good. This is cynical and doesn't match the phenomenology of many disobedients (who feel they *ought* to accept it).
  *   **Communicative:** Anarchists say we accept punishment to signal sincerity. This is strong.
  *   **Your Explanation (Settling a Debt):** This is elegant but assumes what it proves. It works *if* one already accepts the Ledger View. To an anarchist, the disobedient is not "settling a debt"; they are "paying a protection fee" to ensure their message is heard.
  *   **Verdict:** Your explanation is not *better* than the communicative one; it is *compatible* with it. You can accept punishment to signal sincerity (communicative) *because* you want to show you aren't free-riding (ledger). The Reverse Argument fails to prove the Ledger View is *true*; it only proves the Ledger View is *consistent* with the practice. Do not overclaim here. The practice is evidence of a *sense* of obligation, not necessarily the *truth* of a specific theory of obligation.

  #### 6. Blunt Verdict

  **Is there a paper here?**
  **Yes.** The "Act-Indexed vs. Quota-Indexed" distinction is a genuine conceptual innovation that clarifies the debate on political obligation. It rescues the "fair play" intuition from the objection that "one bad act voids the contract."

  **What to Cut:**
  *   **Section 5 (The Reverse Argument):** It is too ambitious and slightly desperate. It tries to use the practice of arrest to prove the theory, which is circular. It distracts from the stronger normative argument in Sections 2 and 3.
  *   **The "Philosophical Anarchism" framing:** Don't frame this as a battle against anarchism. Frame it as a refinement of Fair Play theory. The anarchist is a straw man here; your real interlocutor is the "act-indexed" deontologist.

  **What to Make the Centre:**
  *   **The "Alma" Case:** This is your intuition pump. Build the paper around the question: "Is Alma morally superior to the jail-going disobedient?"
  *   **The Structure of the Duty:** Focus on the shift from *act-indexed* to *quota-indexed*. This is your philosophical contribution. Argue that political obligation is inherently aggregative over time, not instantaneous.
  *   **The Epistemic Role of Publicity:** Expand on your reply to F2. Show how publicity functions as an audit mechanism. This connects the moral theory to the practical requirements of protest in a novel way.

  **Final Advice:**
  Own the Fair Play lineage. Don't pretend this is a wholly new ground of obligation. Your innovation is the *accounting mechanism* within Fair Play. If you clarify the "exchange rate" problem (how we know what offsets what) and address the "Democratic Authority" objection (why individual reallocation is permissible), this will be a significant contribution to the literature on political obligation.
