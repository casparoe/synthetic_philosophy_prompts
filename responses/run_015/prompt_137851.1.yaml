      *   **User:** Backend engineer (Go, freight-booking), helping flatmate (TA) grade philosophy problem sets.
      *   **Task:** Grade *one* specific student answer on Two-Dimensional Semantics (2DS).
      *   **Context:** User is on a train, 30 scripts left, finds the subject tricky ("reads fine... until somebody explains why it isn't"). Needs specific feedback, not just a number.
