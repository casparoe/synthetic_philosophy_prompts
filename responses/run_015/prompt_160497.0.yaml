  *Decision:* I will argue that a *heavy regulatory agenda* is premature, but a *research and monitoring agenda* is not. The 2-year programme should likely conclude that we lack the epistemic grounds for welfare regulation *now*, but should establish the framework for when we might have them. This validates the User's suspicion that the Mate is moving too fast, while acknowledging the Third Party is moving too slow.

