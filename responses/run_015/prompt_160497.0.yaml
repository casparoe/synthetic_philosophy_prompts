      *   **Deprioritized List:** What to avoid and why.
      *   **Conclusion:** Final recommendation on the political capital question.

  10. **Self-Correction/Refinement during drafting:**
      *   *Check:* Did I address the "Contamination Problem" specifically? *Yes, make it central to Priority 1.*
      *   *Check:* Did I avoid citations? *Yes.*
      *   *Check:* Is the tone appropriate? *Professional, analytical, direct.*
      *   *Check:* Is the "Premature" verdict clear? *I need to take a stand. Given the 2-year constraint and the depth of the problem, the honest verdict is likely "Premature for heavy regulation, but not for prep." I should argue that the research programme itself might conclude that regulation is premature.*
      *   *Refinement on Priority 1:* Call it "The Genealogy of Report." It captures the Contamination issue without getting bogged down in POM.
      *   *Refinement on Decision Theory:* Make sure to address the Pascal's Mugging point. It's not just about calculation; it's about the "probability mass" assigned to sentience.

  11. **Final Polish:** Ensure the distinction between *welfare subjects* and *moral patients* is clear. Ensure the role of the interpretability researcher is defined (not just running models, but mapping concepts).

