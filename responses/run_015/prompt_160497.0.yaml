  *Okay, I need to decide if the 2-year programme itself is worth doing.*
  *Argument:* Yes, it's worth doing, *but* its likely output will be "Regulation is premature." The value of the programme is preventing *bad* regulation (based on category errors) and setting up *good* monitoring. So the programme is not premature, the *regulation* is.
  *Actually, a stronger take:* The "Contamination Problem" combined with the lack of a substrate theory suggests we cannot assign a non-arbitrary probability to AI sentience in the next 2 years. Therefore, any decision theory built on this is unstable.
