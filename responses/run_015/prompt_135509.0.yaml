answer: |-
  Leo wins on standard mathematical practice, but Maya lands valid hits on philosophical interpretation and technical set theory nuances.

  **Maya (Move 1): Clearly Mistaken.**
  Her argument confuses counterintuitive results with logical contradictions. Hilbert's Hotel demonstrates that infinite sets behave differently than finite sets (specifically regarding cardinality and bijections), but it does not prove impossibility; it proves that our finite intuition fails, not that the math is broken.

  **Leo (Move 1): Clearly Right.**
  He correctly identifies that consistency is the standard for mathematical existence, not intuitive comfort. Cantor's diagonal argument is a rigorous proof within standard logic that demonstrates distinct cardinalities ($\aleph_0$ vs $\mathfrak{c}$), validating the coherence of actual infinities in set theory.

  **Maya (Move 2): Mostly Right.**
  Her appeal to Brouwer and intuitionism is a legitimate philosophical stance rejecting completed infinities as mental constructs rather than realities. Her point on the Axiom of Choice (AC) is technically accurate for uncountable sets: without AC, you cannot guarantee a well-ordering for arbitrary infinite sets, meaning you couldn't necessarily "shift guests" in an uncountable hotel, though this nuance doesn't apply to the standard countable Hotel paradox.

  **Leo (Move 2): Clearly Right.**
  He is correct that standard mathematics (ZFC) includes AC and treats real numbers as completed infinite objects. Constructive analysis (which avoids actual infinity) exists but requires abandoning significant portions of standard calculus and functional analysis used in physics, so his claim about the practical necessity of actual infinity in science is accurate.

  **Maya (Move 3): Mostly Right.**
  She is correct that the formal definition of limits (epsilon-delta) describes potential infinity (approaching a value) rather than requiring completed infinity. However, she is slightly mistaken that this fully saves calculus, as the Completeness Axiom of real numbers implicitly relies on actual infinity to ensure limits exist. Her epistemological point about verification is valid philosophy but doesn't invalidate the ontology.

  **Leo (Move 3): Clearly Right.**
  He correctly distinguishes between ontology (what exists) and epistemology (what we can verify). Mathematical existence does not depend on human ability to perform a final check, so claiming infinity is invalid because we can't count to it is a category error.
