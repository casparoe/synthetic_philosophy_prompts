  **The Error Term**

  The coffee machine in the hallway hummed with a dying vibrato. Every time someone pressed the brew button, it shuddered, spat a stream of brown water into the drip tray, and stopped. Elias kicked the panel. It groaned but held.

  Inside Lab 2, the air was colder. On the main monitor, Session 44-B scrolled in green text against black.

  "Mark it as artifact," Elias said. He didn't look up from the keyboard. He was highlighting the confidence intervals, the blocks of data where the subject's forced-choice accuracy hovered at 49 percent. Chance. Noise.

  "Leave it," Mara said. She was standing behind him, arms crossed. She watched the waveform of the subject's voice on the secondary screen. It was jagged, tight. "It's the only clean dissociation we have."

  "It's chance performance, Mara. Look at the d-prime. It's zero. She was guessing. If we include a subject who guesses and claims vision, we aren't proving dissociation. We're proving confabulation."

  "She wasn't confabulating." Mara leaned in, tapping the glass over the audio log. "Listen to the latency. There's no hesitation. She wasn't searching for a answer to please us. She was reporting a state she couldn't map to the keys."

  "She got half the trials wrong."

  "She got all the *keys* wrong." Mara corrected the distinction automatically. "The device uncouples the report from the sensitivity. In Mode A, they see and say nothing. In Mode B, they don't see and say everything. That's the protocol. But in this session, the report persisted without the access. She said, 'Something was there and I couldn't say it.' That's not Mode B. That's a third state."

  Elias stopped typing. He pulled up the physiological log—galvanic skin response, pupil dilation. During the trials, the subject's pupils had dilated consistent with high-load processing, even though her finger was landing on the wrong button.

  "It's noise," Elias said, though his hand hovered over the delete key. "The decoupler creates interference. The report system is generating noise to fill the gap. It's a self-contained generator. If we publish this, the review board will tear us apart. They'll say we found a subject who lies."

  "They'll say we found a subject who experiences," Mara said. "You want the report to be a readout. I'm telling you it's a behavior. But sometimes the behavior tracks something the motor system can't catch."

  "The motor system caught it in every other session. Accuracy was ninety percent when the report was positive. Here, the report is positive, and the accuracy is coin-flip. The only variable that changed was the subject's insistence."

  "Insistence isn't a variable. It's data."

  Elias sighed. He minimized the accuracy graph. He opened the transcript file. *Subject 44-B. Post-session interview.*

  **Interviewer:** "You scored at chance."
  **Subject:** "I know."
  **Interviewer:** "Do you think you were guessing?"
  **Subject:** "No. I think the words didn't fit. Something was there and I couldn't say it."

  Elias highlighted the line. *Something was there.*

  "If you keep this," Elias said, "you validate the intuition. You tell the world that the feeling of seeing is separate from the seeing itself. You're reifying the ghost."

  "If I delete it," Mara said, "I validate the machine. I say that if the hand doesn't point, the eye didn't see. You're reducing the ghost to the gear."

  Elias rubbed his eyes. The coffee machine in the hallway kicked on again. The hum rose, pitched up, and then the familiar spitting sound. Water hitting the tray. No cup waiting.

  "We need a clean signal," Elias said. "The project is about the disposition to report. If the disposition exists without the sensitivity, it's a malfunction. If we claim it's a feature, we lose the tractability. The whole point is that the meta-problem is solvable because the reports are mechanical. This..." He gestured at the screen. "This makes the reports magical again."

  "It makes them honest," Mara said. "Look at the stress markers. Cortisol spike at trial forty. She wasn't enjoying the confabulation. She was frustrated. A generator doesn't get frustrated by its own noise. A tracker gets frustrated when it loses the signal."

  Elias looked at the cortisol log. The spike was sharp. Real.

  "A tracker that misses every target isn't a tracker," Elias said. "It's a broken compass."

  "Or it's pointing North when you're asking for South."

  Elias sat back. The cursor blinked at the end of the file name. *Session_44_B_CLEAN.csv*. He hadn't saved it yet.

  "We can't publish both," Elias said. "If we say the device uncouples report from sensitivity, and then we show a case where the report claims sensitivity that isn't there behaviorally, we contradict the mechanism. Either the behavior is the truth, or the report is. We have to pick which one governs the definition of 'seeing'."

  "Why?" Mara asked. "Maybe the definition is the thing that's broken."

  Elias didn't answer. He moved the cursor to the 'Exclude' checkbox. It would flag the session as equipment failure. The data would remain in the archive, buried, unavailable for the main analysis. The paper would stand on the other nineteen subjects. The dissociation would look clean. The mechanism would look solid.

  Mara walked to the door. She didn't threaten him. She didn't plead. She just opened her hand, palm up, waiting for the mouse.

  "It's the only session where she cried," Mara said. "Not in the booth. In the hallway. After the electrodes came off. She said she felt blindfolded while her eyes were open. You can't get that from a generator."

  "You can get tears from frustration," Elias said. "You can get tears from failure."

  "She didn't feel like she failed. She felt like she was being silenced."

  Elias looked at the screen. The green line of the audio waveform sat flat now. Silence. But the text remained. *Something was there.*

  He thought about the coffee machine. It was designed to push water through grounds into a cup. When it worked, you got coffee. When it didn't, you got water in the tray. The mechanism was identical. The output was different. Was the failure in the machine, or in the expectation of the cup?

  Elias moved the cursor away from the checkbox. He opened a new field in the metadata. *Classification.*

  He typed: *Anomaly.*

  He didn't delete it. He didn't mark it as valid signal. He left it in the set, flagged, a jagged edge in the smooth curve of the results. It would complicate the paper. It would invite questions. It would force the readers to look at the gap between the hand and the eye and decide for themselves which one was lying.

  "Fine," Elias said. "But I'm writing the methods section. We define sensitivity by forced-choice. Always."

  "Write what you want," Mara said. "I'll keep the audio."

  She left the room. The door clicked shut.

  Elias sat alone with the hum of the servers. He saved the file. The drive whirred, committing the contradiction to the disk.

  He stood up and walked to the door. He opened it and stepped into the hallway. The coffee machine was still running. A small pool of lukewarm water had spread across the stainless steel drip tray, reflecting the overhead lights. It looked deep, dark, like an eye that wouldn't close.

  Elias pressed the brew button again. The machine shuddered. It held the water for a second, trembling, as if deciding whether to push or to stop. Then it released. The stream hit the tray, merging with the rest.

  He watched it for a moment, then walked away without a cup.
