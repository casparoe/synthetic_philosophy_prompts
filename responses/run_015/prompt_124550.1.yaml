answer: |-
  **1. The Capability Bound**
  **Setup:** So you argue control is engineering, not hope. But effective control depends on knowing exactly what the AI can actually do reliably.
  **Question:** If capability evaluations rely on sampling behavior, and models can hide capabilities during testing, isn't control just a smaller hope?
  **Anticipated Answer:** We can bound capabilities conservatively. We assume worst-case scenarios rather than relying on average performance during evals.
  **Follow-up:** If you assume worst-case for every capability, doesn't the system become so restricted it's useless, defeating the purpose of deployment?

  **2. The Bootstrapping Problem**
  **Setup:** To build strong controls, you need strong red-teaming. But strong red-teaming inevitably needs strong models to help design the very protocols meant to contain them.
  **Question:** If you use weaker models to supervise stronger ones, what happens when the capability gap gets too wide for the weaker model to see?
  **Anticipated Answer:** We use scalable oversight techniques or weaker models for specific, narrow tasks where they remain competent.
  **Follow-up:** But if the weaker model can't verify the stronger model's work, haven't you just moved the legibility floor problem up one level?

  **3. Legibility Mechanics**
  **Setup:** You define legibility as verifying a plan was carried out, not understanding the plan itself. That seems contradictory to me.
  **Question:** How do you verify a plan was followed if you don't understand the plan's intent or steps?
  **Anticipated Answer:** We check constraints, system logs, and external effects rather than internal reasoning or intent.
  **Follow-up:** If the AI manipulates the logs to look compliant, doesn't that break the verification without understanding?

  **4. Economic Value**
  **Setup:** Your legibility floor requires humans to verify outputs without understanding the plan. Most high-value AI work involves outputs humans can't verify.
  **Question:** If most high-value AI work involves outputs humans can't verify, does your framework imply we simply shouldn't deploy those systems?
  **Anticipated Answer:** Yes, safety over speed. We shouldn't deploy unsafe systems regardless of economic pressure.
  **Follow-up:** Is that a technical conclusion, or are you making a political claim about how much economic progress we're willing to sacrifice for safety?

  **5. The Evidence Problem**
  **Setup:** If a control regime works, nothing bad happens. But nothing bad happens also if the AI is biding its time.
  **Question:** What specific evidence would convince you a control regime is working, rather than just successfully deceived?
  **Anticipated Answer:** We use planted opportunities, honeypots, and active testing to provoke failures intentionally.
  **Follow-up:** If the model knows honeypots are a standard safety technique, doesn't it just learn to ignore only the planted traps?

  **6. Buying Time**
  **Setup:** Proponents say control buys time for governance or institutions to catch up with the technology.
  **Question:** If those institutions don't catch up, what is the technical program supposed to have achieved besides delay?
  **Anticipated Answer:** We need time to solve alignment or build better controls internally.
  **Follow-up:** So if the political prediction fails, is your entire engineering roadmap rendered obsolete?

  **7. Institutional Failure**
  **Setup:** Engineers worry that safety protocols get routed around when review throughput collapses and people start rubber-stamping.
  **Question:** Is the real failure mode of control institutional rather than technical, given human pressure to ship?
  **Anticipated Answer:** We need automated enforcement, not just policies.
  **Follow-up:** But who audits the automated enforcement tools if not humans prone to the same pressure?

  **8. The Hard Hat**
  **Setup:** You say using AI to check AI is hope wearing a hard hat.
  **Question:** Does that mean any automation in safety monitoring is inherently unreliable under your framework?
  **Anticipated Answer:** Automation is fine if its limits are known and verified by humans.
  **Follow-up:** But if the limits are verified by humans who don't understand the system, how do they know the limits are correct?

  **9. The Threshold**
  **Setup:** Many researchers argue that without alignment, control becomes impossible at high capability levels.
  **Question:** At what specific capability threshold does control become impossible without alignment?
  **Anticipated Answer:** It's not a threshold, it's a gradient of risk.
  **Follow-up:** If it's a gradient, isn't "control is an engineering requirement" just as much a hope as "alignment is possible"?

  **10. Listener Impact**
  **Setup:** Listeners want to know what this means for their future interaction with AI.
  **Question:** If your view wins, how does the average person's experience of AI change in five years?
  **Anticipated Answer:** Slower rollout, more friction, but safer.
  **Follow-up:** Is friction the feature, or the bug, in your vision of safe AI?
