  I'm trying to figure out where I actually stand on inside-view vs outside-view reasoning, going by my gut on cases. Case 1: I'm a chess grandmaster in time trouble, I see a tactic that feels brilliant, but I know I miscalculate in scramble about thirty percent of the time. Still, this line feels right. I think I should play it. Case 2: I'm a climate scientist and my internal model check says the feedback loop is weaker than the IPCC mean, but I know lone dissenters are usually wrong. Here I think I should defer to the consensus. Case 3: A historian spends years in archives and builds a strong narrative about a revolution; she knows other scholars disagree, but she feels her direct engagement with sources gives her an edge. I think she's being arrogant if she doesn't downgrade her confidence. Case 4: I'm picking stocks and think I see a pattern, but the outside view says almost nobody beats the market. Here the inside view feels like pure noise.

  Then there's case 5: I think slavery is wrong partly because I reasoned about suffering, partly because I'm embedded in a culture that changed. The outside view might say you're just a product of your era, yet I don't think that undermines my belief at all. So sometimes the outside view just doesn't bite?

