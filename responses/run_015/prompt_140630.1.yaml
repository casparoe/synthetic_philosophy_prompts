answer: |-
  # Lesson Plan: The Research Programme Survival Game
  **Topic:** Imre Lakatos, *Methodology of Scientific Research Programmes (MSRP)*
  **Time:** 90 Minutes
  **Class Size:** 20 Undergraduates (4 Teams of 5)
  **Goal:** Experiential understanding of Hard Core, Protective Belt, Negative/Positive Heuristic, and the historical nature of rationality (no instant refutation).

  ---

  ## I. Preparation & Materials

  **Printouts:**
  1.  **Team Charter Sheets (4):** For declaring Hard Core & starting Belt.
  2.  **Patch Logs (4):** To record every auxiliary hypothesis added.
  3.  **Phenomenon Deck (15 Cards):** Cut out (text below).
  4.  **Auxiliary Tokens (20 total):** 5 per team (physical poker chips or paper slips).
  5.  **Public Scoreboard:** Whiteboard divided into 4 columns (Team Names).

  **Room Setup:**
  *   4 clusters of desks.
  *   Whiteboard visible to all.

  ---

  ## II. The "No Instant Rationality" Rule (The Lock-In Protocol)
  *This is the core mechanic you requested. It prevents students from acting like Popperians.*

  **The Rule:** A team **cannot** abandon or alter their Hard Core voluntarily. They are "Locked In."
  **The Exit Clause:** A team may petition to collapse their Programme only if:
  1.  They have **zero** Auxiliary Tokens remaining; **OR**
  2.  They have suffered **three consecutive rounds** of "Degeneration" (Patching without Novel Prediction).
  **The Judge's Veto:** Even if conditions 1 or 2 are met, the Instructor (Judge) reviews the *Public Record*. If there is *any* theoretical promise (e.g., a patch that unified two previous anomalies), the Judge may grant a **Reprieve**, forcing the team to continue for one more round.
  *Pedagogical Point:* This forces students to inhabit the perspective of the insider. They cannot quit when it gets hard; they must experience the frustration of "just one more patch."

  ---

  ## III. Timeline (90 Minutes)

  ### 0:00 – 0:15: Setup & Core Declaration (No Lecture)
  *   **Instruction:** "You are four competing research teams studying the same newly discovered galaxy, 'Sector 7G.' You all see the same data, but you explain it differently."
  *   **Task:** Teams have 10 minutes to write their **Hard Core** (3 fundamental claims they pledge *never* to give up) and their **Positive Heuristic** (1 sentence on how they plan to solve problems).
  *   **Constraint:** The Core must be specific enough to be contradicted. (e.g., "Gravity is always attractive" is good. "Stuff happens" is rejected).
  *   **Resources:** Give each team 5 **Auxiliary Tokens**.
  *   **Instructor Role:** Circulate. Reject vague cores. Ensure teams are distinct (e.g., Team A: Newtonian, Team B: Electromagnetic, Team C: Quantum-ish, Team D: Teleological).

  ### 0:15 – 1:00: Gameplay (6 Rounds, ~7.5 mins each)
  *   **Phase 1 (2 mins):** Reveal **Phenomenon Card**.
  *   **Phase 2 (3 mins):** Teams huddle. They must choose:
      *   **Predict:** Seal a prediction about the *next* card. (High risk/high reward).
      *   **Patch:** If the current card contradicts their Core, they must spend an **Auxiliary Token** to write an auxiliary hypothesis on their Patch Log.
      *   **Monster-Bar:** Play their single-use "Monster Card" to claim the data is experimental error (disqualifies the card for everyone).
  *   **Phase 3 (2.5 mins):** Resolution.
      *   If a team **Predicted** correctly last round: +1 **Progressive Point**.
      *   If a team **Patched**: 0 Points. Mark "D" (Degenerating) on scoreboard.
      *   If a team is **Contradicted** and has **No Tokens**: They are "Stalled." They cannot play until they petition to collapse.
  *   **Instructor Role:** Enforce the Lock-In Protocol. If a team asks to quit early, deny them publicly based on the rules. Be the "blind historian."

  ### 1:00 – 1:30: Debrief & Theory Mapping
  *   **Step 1: The Feeling (10 mins):** Ask: "At what point did you feel your theory was in trouble? Did you want to quit? Why couldn't you?"
  *   **Step 2: The Vocabulary (15 mins):** Introduce Lakatos terms *only now*, mapping them to their game experience.
  *   **Step 3: The Limitations (5 mins):** Discuss time compression.

  ---

  ## IV. Concrete Materials

  ### The Phenomenon Deck (15 Cards)
  *Print these on cardstock. Shuffle before class.*

  1.  **Standard Orbit:** Planets move in ellipses. (Baseline)
  2.  **Velocity Anomaly:** Outer planets move faster than mass suggests.
  3.  **Missing Mass:** Gravitational lensing detected where no visible matter exists.
  4.  **Retrograde Motion:** A planet temporarily reverses direction.
  5.  **Sudden Acceleration:** A comet speeds up without visible propulsion.
  6.  **Collision Event:** Two stars collide and merge without exploding.
  7.  **Energy Spike:** Background radiation spikes in a specific sector.
  8.  **Stable Orbit:** A planet remains stationary relative to its star for 100 years.
  9.  **Decay:** A planet's orbit shrinks over time.
  10. **Ghost Signal:** Radio waves detected from empty space.
  11. **Mass Variation:** A star's mass fluctuates without material loss.
  12. **Alignment:** All planets align perfectly (rare event).
  13. **Ejection:** A planet is ejected from the system spontaneously.
  14. **Light Bend:** Starlight curves around a massive object.
  15. **Silence:** All emissions from a sector cease abruptly.

  ### Team Charter Sheet
  *   **Team Name:** _______________
  *   **Hard Core (3 Claims):** (e.g., "1. All motion is caused by contact. 2. Mass is constant...")
  *   **Positive Heuristic:** (e.g., "We will explain anomalies by positing invisible fluids.")
  *   **Auxiliary Tokens:** [ ] [ ] [ ] [ ] [ ]
  *   **Monster Bar:** [ ] (One use only)

  ### Scoreboard Columns
  *   **Team Name** | **Progressive Points** | **Consecutive Degenerative Rounds** | **Status**

  ---

  ## V. The Debrief Script (Mapping Experience to Theory)

  **1. Hard Core vs. Protective Belt**
  *   *Ask:* "When Card #3 (Missing Mass) hit, did anyone change their claim about what gravity *is*?"
  *   *Likely Answer:* "No, we said there must be invisible matter."
  *   *Lakatos:* "That invisible matter is the **Protective Belt**. Your claim about gravity is the **Hard Core**. You protected the core by sacrificing the belt (spending tokens)."

  **2. Negative vs. Positive Heuristic**
  *   *Ask:* "What was your rule for making patches?"
  *   *Likely Answer:* "Don't touch the gravity claim," or "Always add a new particle."
  *   *Lakatos:* "The 'Don't touch' rule is the **Negative Heuristic**. The 'Add a particle' strategy is the **Positive Heuristic**. It tells you where to look for solutions."

  **3. Progressive vs. Degenerating Problem Shift**
  *   *Ask:* "Look at the scoreboard. Team A has points, Team B has patches. Who is 'winning'?"
  *   *Lakatos:* "Team A is **Theoretically Progressive** (predicting novel facts). Team B is **Degenerating** (only saving phenomena). But—and this is key—Team B didn't *feel* irrational while patching. It felt like normal science."

  **4. No Instant Rationality**
  *   *Ask:* "When did you know Team B was 'wrong'?"
  *   *Likely Answer:* "When they ran out of tokens," or "Round 4."
  *   *Lakatos:* "Exactly. Not at Round 1. Refutation is not a moment; it's a history. You couldn't quit early because the **Lock-In Protocol** mimics the sociological pressure to stay in a programme until it clearly fails."

  ---

  ## VI. Troubleshooting: What Will Go Wrong

  **1. The "Vague Core" Loophole**
  *   *Problem:* A team writes: "Energy flows where it wants." This cannot be contradicted.
  *   *Fix:* **Pre-game Vetting.** You must reject this at minute 5. Tell them: "If I draw Card #1, can this claim be proven false? If no, rewrite it."
  *   *Backup:* If they sneak it through, rule mid-game that their "Positive Heuristic" is blocked for one round due to "lack of specificity."

  **2. The "Endless Patching" Stall**
  *   *Problem:* Teams keep patching forever, game drags on.
  *   *Fix:* **Hard Token Limit.** When tokens are gone, they *must* petition to collapse. No tokens = No patches allowed. They must either Predict (risk elimination) or Quit.

  **3. Judge Accusations (Favoritism)**
  *   *Problem:* "You let Team C patch that, but made us quit!"
  *   *Fix:* **Public Rubric.** Write on the board: *Acceptable Patch = Logically Consistent + Saves Phenomenon.* *Unacceptable = Contradicts Core.* Do not judge on "plausibility," only on "consistency with Core." If they complain, point to the Patch Log.

  **4. Everyone Predicts Nothing**
  *   *Problem:* Teams get scared and just patch every round. Game becomes boring.
  *   *Fix:* **Incentivize Risk.** Announce at Round 3: "Double points for predictions in the second half." Or, rule that "Patching costs 2 tokens in Round 4+."

  **5. The "Monster Bar" Abuse**
  *   *Problem:* A team uses the Monster Bar on a card that actually helped them.
  *   *Fix:* **One Use Only.** Make it a scarce resource. If they use it frivolously, they have no defense for a real killer card later.

  ---

  ## VII. Honest Limitations (For the Final 5 Minutes)

  *Be transparent with the students. This builds trust and nuance.*

  1.  **Time Compression:** "In reality, a degenerating programme lasts decades, not 45 minutes. Lakatos's point is that we only see the degeneration in *history*, not in the *moment*. You felt the ambiguity; real scientists live it for a career."
  2.  **The Judge Problem:** "In the game, I am the Judge. In history, there is no Judge. The 'appraisal' is done by the community over generations. Some great programmes were abandoned too soon (e.g., Prout's hypothesis); some bad ones lasted too long (e.g., Phlogiston). The game makes the rules clear; history does not."
  3.  **Rationality:** "Lakatos doesn't tell you what to do *now* (heuristic); he tells you how to judge what was done *then* (appraisal). You felt the tension between those two. That is the philosophy of science."

  ---

  ## VIII. Instructor Cheat Sheet: Round Flow

  *   **Round 1:** Card 1 (Standard). Everyone predicts easy. High morale.
  *   **Round 2:** Card 2 (Anomaly). First patches. Tokens -1.
  *   **Round 3:** Card 3 (Hard Anomaly). Tokens -1. Some teams might want to quit. **Enforce Lock-In.**
  *   **Round 4:** Card 4 (Novel Fact Opportunity). Teams with good Positive Heuristics score points. Degenerating teams patch again.
  *   **Round 5:** Card 5 (Crisis). Tokens running low.
  *   **Round 6:** Card 6 (Collapse or Triumph). Final scoring.

  *Tip:* If a team is dominating too hard, introduce a "Paradigm Shift" card (e.g., Card 10: Ghost Signal) that favors the losing team's obscure auxiliary hypothesis. This shows how luck/history plays a role.
