prompt: |-
  I'm teaching a 90-minute session on Lakatos to about 20 undergrads in a philosophy of science course, and I want them to *feel* why nobody working inside a research programme ever experiences its degeneration as a refutation -- it always just looks like one more awkward anomaly that some clever grad student will patch. Design me a game for that.

  Rough shape I have in mind (change it if it won't work): teams of 4-5 each declare a "hard core" of 2-3 claims they publicly pledge never to give up, plus a starting "protective belt" of auxiliaries. Over 5-6 rounds I hand out phenomenon cards. A team can register a sealed prediction before the reveal; if it hits, that's a novel fact and scores a progressive point. If a card contradicts them, they patch by adding an auxiliary to the belt, which scores nothing and costs a belt token. Everyone also gets one "monster-barring" card they can play to disqualify a phenomenon.

  The bit I most want your help designing: a rule that makes "there is no instant rationality" into something they're stuck under rather than a quote on a slide. Say -- a team may only abandon its hard core after two full rounds of patching with no successful novel prediction, and even then a "Lakatosian judge" (me) can grant a reprieve based only on the public record, never on which core is actually true.

  Give me concrete materials (including what goes on ~15 phenomenon cards), the scoring, a round-by-round timeline with no lecture up front and no Lakatos vocabulary until the debrief, and then a debrief that maps specific moments onto hard core vs protective belt, negative vs positive heuristic, and progressive vs degenerating problem shifts. Also: what will predictably go wrong the first time I run it (someone declares a hard core so vague it can't be hit, everyone just patches forever, the judge gets accused of favouritism) and how to handle each. And be honest about what the game can't reproduce -- especially that real appraisal of a programme takes decades, which 90 minutes necessarily compresses into nothing.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Topic:** Imre Lakatos's Methodology of Scientific Research Programmes (MSRP).
      *   **Target Audience:** ~20 Undergraduates (Philosophy of Science course).
      *   **Duration:** 90 minutes.
      *   **Goal:** Make students *feel* why degeneration isn't experienced as refutation internally (it feels like patching), and experience "no instant rationality."
      *   **Core Mechanic:** Teams declare a "Hard Core" (unchallengeable) + "Protective Belt" (adjustable). Rounds involve "Phenomenon Cards." Predictions = Progressive Points. Contradictions = Patching (costs tokens). "Monster-barring" allowed once.
      *   **Specific Constraint:** Design a rule that enforces "no instant rationality" (can't abandon core immediately, needs sustained failure, judge decides based on public record).
      *   **Deliverables:** Concrete materials (15 phenomenon cards), scoring, timeline (no lecture upfront), debrief (mapping game to theory), troubleshooting (what goes wrong), and limitations (time compression).

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Problem:* Students often think falsification is immediate (Popper). Lakatos says it's historical and structural.
      *   *The Feeling:* Students need to feel the *sunk cost* and the *ingenuity* of patching. They need to feel that *their* patch makes sense in the moment, even if it looks ad hoc later.
      *   *The "No Instant Rationality" Rule:* This is crucial. It prevents teams from quitting the moment things get hard. It forces them to live through the "degenerating" phase to understand why scientists don't just pack up.
      *   *The Judge:* The instructor plays the role of history/time. They must be impartial but strict about the *rules of the game*, not the truth of the claims.

  3.  **Drafting the Game Mechanics (Iterative Process):**
      *   *Teams:* 4 teams of 5 is perfect for 20 students.
      *   *Hard Core:* Needs to be specific enough to be hit, vague enough to allow patches. Let's suggest domains (e.g., "Physics of Motion," "Biology of Inheritance") but let them define the core claims.
      *   *Resources:* "Belt Tokens" are a good idea. Limits how much they can patch before collapsing.
      *   *The "No Instant Rationality" Rule:* The prompt suggests: "Abandon core after two full rounds of patching with no novel prediction." Let's refine this. It needs to be a *decision* they make, but constrained. Actually, the rule should be: *You cannot abandon the Hard Core until you have exhausted your Belt Tokens OR you have suffered 3 consecutive rounds of 'Degeneration' (patches without novel facts).* And even then, the Judge must approve the "Research Programme Collapse."
      *   *Scoring:* Progressive (Novel Prediction) vs. Degenerative (Saving the Phenomena).
      *   *Phenomenon Cards:* Need to be ambiguous enough to be interpreted differently by different cores, but specific enough to contradict some.

  4.  **Developing the Materials:**
      *   *Phenomenon Cards:* Need a mix of expected, anomalous, and "monster" cases.
      *   *Example:* "Object falls faster than predicted." (Physics team patches air resistance). "Trait skips a generation." (Biology team patches recessive genes).
      *   *Tokens:* Let's call them "Grant Funding" or "Ad Hoc Tokens." Let's stick to "Auxiliary Tokens."
      *   *Worksheets:* Hard Core Declaration, Patch Log, Score Sheet.

  5.  **Structuring the 90 Minutes:**
      *   0-10: Setup & Core Declaration (No theory yet).
      *   10-60: Gameplay (6 Rounds x 8 mins + transitions).
      *   60-80: Debrief (Mapping experience to Lakatos).
      *   80-90: Q&A / Limitations.

  6.  **Refining the "No Instant Rationality" Rule:**
      *   If a team wants to quit their Core, they must submit a "Retirement Petition."
      *   The Judge (Instructor) rejects it automatically if they have Auxiliary Tokens left *and* haven't had 2 consecutive rounds of pure patching.
      *   This forces them to *try* to patch even when they know it's getting silly. This simulates the internal perspective.

  7.  **Addressing Troubleshooting:**
      *   *Vague Core:* "Everything is energy." -> Judge rejects at setup. Must be falsifiable *in principle*.
      *   *Endless Patching:* Limit the tokens.
      *   *Judge Bias:* Use a public rubric for "Acceptable Patch" vs. "Ad Hoc." (Actually, Lakatos says ad hoc is only visible in hindsight. So the Judge should accept *logical consistency* in the moment, but mark it as 'Degenerative' on the scorecard).
      *   *Time Compression:* Acknowledge this in the debrief.

  8.  **Drafting the Content (Mental Walkthrough):**
      *   *Intro:* Don't say "Lakatos." Say "You are research teams."
      *   *Rounds:* Reveal card -> Teams decide (Predict or Patch) -> Reveal outcomes.
      *   *Debrief:* Ask "How did it feel when Card 3 hit?" "Why didn't you quit?" Then introduce terms.

  9.  **Refining the Phenomenon Cards:**
      *   Need to ensure they aren't too specific to one science. Let's make them abstract enough for any "Research Programme" but specific enough to cause trouble.
      *   Actually, it's better if teams pick a *domain* (Physics, Bio, Econ) so the cards make sense. Let's have them pick a domain at the start.
      *   *Correction:* If teams pick different domains, the cards must be generic. "An observed value deviates by 15%." "An expected entity is not found."
      *   *Better:* Give them a specific scenario. All teams are competing to explain the *same* universe. Let's make it a "Newly Discovered Planetary System." Everyone is an astronomer. This standardizes the cards.
      *   *Wait, the prompt implies they declare their own core.* If they are all astronomers, their cores will be similar. If they are different sciences, the cards need to be generic.
      *   *Decision:* Let's make them all "Cosmologists" studying the same fictional galaxy. This makes competition real. Their *Hard Cores* will differ (e.g., "Gravity is attractive" vs "Gravity is repulsive").
      *   *Actually, better for Lakatos:* Let them choose their own domain, but the cards are "Anomalies" that can be interpreted broadly.
      *   *Best for 90 mins:* Standardize the domain to save time on explanation. All teams are "Theoretical Physicists studying Sector 7G."
      *   *Hard Core Examples:* "Matter is continuous," "Matter is discrete," "Forces act at a distance," "Forces require contact."

  10. **Finalizing the Plan:**
      *   **Title:** "The Research Programme Survival Game."
      *   **Setup:** 4 Teams. Domain: Fictional Physics.
      *   **Materials:** Core Sheets, Tokens (5 per team), Phenomenon Deck (15 cards), Scoreboard.
      *   **The "Rationality" Rule:** The "Lock-In Protocol."
      *   **Debrief:** Connect feelings to MSRP terms.
      *   **Troubleshooting:** Specific fixes.
      *   **Limitations:** Honesty about time.

  11. **Review against Constraints:**
      *   90 mins? Yes.
      *   20 undergrads? Yes (4 teams of 5).
      *   Feel degeneration? Yes (via token drain and forced patching).
      *   No instant rationality rule? Yes (Lock-In Protocol).
      *   Concrete materials? Yes (Cards listed).
      *   Troubleshooting? Yes.
      *   Limitations? Yes.

  12. **Self-Correction on "No Instant Rationality":**
      *   The prompt asks for a rule where the *Judge* grants reprieve based on public record.
      *   *Refinement:* If a team wants to abandon their Core, they must petition. The Judge checks the "Public Record" (Scoreboard). If they have had *any* novel predictions in the last 2 rounds, petition denied. If they have tokens left, petition denied. This forces them to stay in the degenerating programme longer than they want.

  13. **Final Polish:** Ensure tone is practical for an instructor. Clear headings. Bold text for emphasis. (Proceed to generate output).

  *(Self-Correction during drafting cards)*: Make sure the cards aren't *too* easy. Some need to be "Monster" candidates. Some need to be "Novel Fact" opportunities.
  *(Self-Correction during debrief)*: Ensure I explicitly map "Belt Tokens" to "Negative Heuristic" (protecting the core) and "Predictions" to "Positive Heuristic."

  *(Final check on time)*: 90 minutes is tight. 6 rounds might be too many. Let's aim for 5 rounds of 10 mins + setup/debrief. 5 rounds is enough to show a trend.
  Actually, 6 rounds of 7 minutes is better. Fast pace creates pressure.
  Setup: 15 mins.
  Game: 45 mins (6 rounds x 7.5 mins).
  Debrief: 30 mins.
