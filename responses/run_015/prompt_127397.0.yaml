      *   *User's Insight:* "Pathological fidelity." If the officials acted with fidelity to a system that lacked internal morality, Fuller's theory condemns the system, not necessarily the official's *legal* duty (since there was no law). Hart says they had a legal duty but a moral duty to disobey.
      *   *Asymmetry:* Nuremberg is about *international* law imposing on *domestic* sovereignty. Hart-Fuller is about *domestic* continuity. This is a major gap in applying the theories directly.

  6.  **Task 5: Silence of the Theories:**

