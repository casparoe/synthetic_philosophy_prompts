      *   *Critique:* This is a sophisticated reading (often associated with later commentators like Dworkin or Llewellyn-esque pragmatists), but does it hold up?
      *   *Potential Flaw:* It assumes both care primarily about the *result* (punishment). Hart admits punishment might be morally necessary but legally retroactive. Fuller argues the "law" wasn't law, so no retroactivity is needed. Is this just semantic? Fuller would say no, because calling it "law" validates the system. Hart would say calling it "non-law" obscures the moral choice to punish retroactively.
      *   *Nuremberg Context:* The IMT *didn't* use Fuller's logic explicitly (they didn't say "Nazi law was null"). They used Hart-ish logic (acknowledged the novelty/retroactivity but justified it via higher principles/treaties). This supports the user's empirical point but challenges the idea that Fuller's theory explains the Tribunal's reasoning.

