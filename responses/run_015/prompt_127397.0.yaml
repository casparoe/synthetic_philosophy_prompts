answer: |-
  Your historical premises are sound enough for jurisprudential analysis. The London Charter was indeed an ex post facto agreement by the victors; the Kellogg–Briand Pact renounced war but lacked criminal sanctions for individuals; and the IMT treated superior orders as mitigation, not justification. You are also correct that neither Hart nor Fuller explicitly thematised the distinction between excuse and justification in the way modern criminal theory does.

  Here is the disciplined analysis you requested, followed by a critique of your dissolution thesis.

  ### Part I: Theory Applied to the Episode (Per Count)

  **1. War Crimes: The "Easy" Case**
  *   **The Legal Landscape:** Here, positive international law (Hague, Geneva) existed prior to the conduct. The conflict is between international prohibition and domestic authorisation.
  *   **Hart's Position:** Hart would view this as a conflict of valid legal systems. The German enactments were valid within the German municipal system; the Hague Conventions were valid within the international system. The IMT, established by treaty, applies international law. For Hart, the "superior orders" plea is a moral or policy question, not a conceptual one. By treating it as mitigation, the Charter makes a clear moral choice: the international duty overrides the domestic duty. Hart would approve of this clarity. It acknowledges the defendant was under a legal duty (domestic) but punishes them for violating a higher legal duty (international), without pretending the domestic duty didn't exist.
  *   **Fuller's Position:** Fuller would focus on the *purpose* of the legal order. A legal system that commands atrocities fails the "internal morality of law" because it destroys the reciprocity between ruler and ruled. However, applied to war crimes, Fuller's theory is less distinct from Hart's. He would likely argue that the German orders, being secret, contradictory, or impossible to obey without moral degradation, lacked legal character. Thus, the soldier had no *legal* duty to obey, only a coercive threat.
  *   **Excuse vs. Justification:** You are right that neither theorist maps this well. Hart's separation of law and morals leaves him with no resources to explain why a valid legal command (obey orders) fails to *justify* the act, other than saying another valid command (international law) overrides it. Fuller implies that a command to commit atrocity is not a legal command at all, which collapses justification (it wasn't law) into excuse (I was forced). The theories are silent on the nuanced criminal law distinction you identified.

  **2. Crimes Against Peace: The "Hard" Case**
  *   **The Legal Landscape:** This is the true retroactivity problem. Aggression was prohibited by treaty, but individual criminal liability was not clearly established.
  *   **Hart's Position:** This is where Hart's "candour" argument shines. He would argue the IMT should have admitted: "What you did was not technically a crime under positive law at the time, but it was so morally monstrous that we are punishing you retroactively." Hart believes that calling this "law" (by stretching the interpretation of Kellogg–Briand) debases the concept of law. He would prefer the tribunal say: "We are making new law to punish you because justice requires it." This preserves the definition of law for the future while accepting the moral cost of retroactivity.
  *   **Fuller's Position:** Fuller would argue that the Nazi regime's actions were so inconsistent with the internal morality of law (and the broader purpose of law as subjecting human conduct to rules) that they generated no legal obligations. Therefore, the defendants cannot claim they were acting "legally." The IMT does not need to punish retroactively; it punishes conduct that was never legally shielded because the system providing the shield was a sham. Fuller would endorse the IMT's actual reasoning (that the Pact implied liability) not as stretching the law, but as recognising the underlying principles of legality that the Nazis violated.
  *   **Radbruch's Shadow:** You correctly identify Radbruch here. Hart explicitly rejects the Radbruch formula (extreme injustice is no law) because it makes validity turn on moral evaluation. Fuller accepts the *result* of Radbruch but grounds it in the *procedural* failure of the Nazi system (secrecy, arbitrariness) rather than substantive injustice. At Nuremberg, the "Aggression" count forces the choice: Hart says "Punish retroactively and admit it"; Fuller says "Punish prospectively because the old law was null."

  ### Part II: The Episode Turned Back on the Theory

  **1. The Silence on International Adjudication**
  Both theories are fundamentally municipal. They assume a continuous sovereign authority. Nuremberg was a tribunal of victors imposed on a collapsed state.
  *   **Hart's Limit:** Hart's concept of law relies on a "rule of recognition" accepted by officials. In 1945 Germany, there were no German officials accepting the London Charter. The sovereignty was external. Hart's theory struggles to explain the *validity* of the IMT itself without resorting to pure power politics (which he dislikes) or a nascent international rule of recognition (which didn't exist).
  *   **Fuller's Limit:** Fuller's "fidelity to law" requires a reciprocal relationship between citizen and state. The Nuremberg defendants were not citizens of the Allied powers; they were enemies. There was no reciprocity. Fuller's theory cannot easily explain why German officials owed fidelity to an international legal order they had rejected, unless one argues that "law" itself implies a universal community—a step Fuller was hesitant to take in 1958.

  **2. The Asymmetry: Informers vs. Officials**
  Your intuition here is vital. The *Grudge Informer* case involves a private citizen using the law as a weapon. The *Nuremberg* case involves state officials *making* the law.
  *   **Fuller's Dilemma:** Fuller's internal morality binds the *lawmaker*. The Nazi officials didn't just violate the morality of law; they *were* the failure of the morality of law. In the Informer case, the system is corrupt, but the informer is a subject. At Nuremberg, the defendants are the corruption. Fuller's theory works *better* at Nuremberg than in the Informer cases because the defendants themselves destroyed the conditions of legality.
  *   **Hart's Dilemma:** Hart treats the Informer and the Official similarly: both acted under valid rules. But intuitively, we feel the Official bears more responsibility. Hart's theory has no resources to distinguish the "fidelity" of a soldier following orders from the "fidelity" of a minister drafting them. Both are simply following valid rules. This suggests Hart's theory is under-inclusive regarding official responsibility.

  ### Part III: Testing Your Dissolution Thesis

  You argue that the debate is not conceptual but institutional: separate "Legality" (was it law?) from "Adjudication" (what should the court do?), and Hart and Fuller converge on punishment, differing only on the "cost" (candour vs. integrity).

  **1. Does the distinction do real work?**
  It does work, but it privileges Hart's framework. To say "separate legality from adjudication" *is* to adopt the Positivist separation of law and morals. Fuller rejects this separation. For Fuller, the question "Was it law?" *is* the question "Should the court enforce it?" because the function of law is to guide conduct. If the prior conduct was not guided by law (because the Nazi system failed internal morality), then the court is not adjudicating a legal claim, but restoring order.
  By proposing the separation, you are effectively asking Fuller to accept Hart's terminology. If Fuller accepts it, he loses his main point: that calling Nazi enactments "law" validates a system that betrayed the very purpose of law. So, the distinction does not dissolve the disagreement; it relocates it to the meta-level of "What is the function of legal language?"

  **2. Empirical Evidence from Nuremberg and West Germany**
  You ask if Nuremberg proves one side right regarding the fragility of legal order.
  *   **The IMT's Choice:** The IMT actually tried to split the difference. They did not openly say "We are punishing retroactively" (Hart's candour). Nor did they say "Nazi law was null" (Fuller's/Radbruch's approach). They said "The law already existed in the Kellogg–Briand Pact; we are just applying it." This was legally dubious (as you note regarding individual liability) but politically necessary.
  *   **West Germany's Emergence:** The fact that West Germany emerged successfully suggests Hart was right that you can acknowledge the past was "law" (however wicked) without collapsing the new order. However, the *Bundesverfassungsgericht* (Federal Constitutional Court) later adopted Radbruch-like reasoning for domestic informer cases, effectively adopting Fuller's stance for municipal continuity.
  *   **Verdict:** The evidence is mixed. Nuremberg succeeded despite (or because of) its legal fictions. This suggests that in *transitional* justice, Fuller's approach (denying the validity of the old law) is more stabilizing than Hart's (admitting retroactivity). Hart's candour might undermine the legitimacy of the new order by admitting it is built on ex post facto punishment. Fuller's fiction preserves the myth of continuous legality.

  **3. Where Your Framing is Confused**
  You suggest the debate is about "how much expressive weight a court's official justification carries." This is accurate, but you underestimate the *moral* stakes Fuller attaches to that expression.
  *   **Over-similarity:** You claim they converge on the outcome. They converge on *punishing the defendants*, but they diverge on the *status of the survivors*. If Hart is right, the survivors lived under a valid legal system that commanded evil. If Fuller is right, they lived in a state of nature masked as law. This changes how the society reconstructs itself. Hart requires a moral revolution within a legal continuity. Fuller requires a legal restoration after a moral collapse. These are different institutional tasks.
  *   **The "Fidelity" Trap:** You mention the defendants acted with "a kind of fidelity that Fuller's own account should find pathological." This is a sharp insight. Fuller argues fidelity to law is a reciprocal enterprise. If the state treats the subject as a tool (which the Nazi regime did), the subject owes no fidelity. Therefore, the officials' "fidelity" was misplaced not because they were immoral, but because there was no *law* to be faithful to. You are treating their fidelity as a psychological fact; Fuller treats it as a legal impossibility.

  ### Conclusion

  Your attempt to dissolve the argument into an institutional choice is the most productive way to read the debate in light of Nuremberg, but do not claim it resolves the theoretical disagreement. It resolves the *practical* dilemma by showing that both theories can be instrumentally used to justify the trial, but for different reasons.

  Hart offers the **ethics of power**: We have the power and the moral right to punish, so let us not lie about the legal technicalities.
  Fuller offers the **ethics of order**: We must restore the concept of law, so we must deny that the previous regime possessed it.

  Nuremberg chose a third path: the **ethics of necessity**. It used legal fictions to mask the retroactivity. This suggests that in the real world, neither Hart's candour nor Fuller's nullification is politically viable. The tribunal needed the *appearance* of Fuller's legality (we are just applying existing law) with the *reality* of Hart's positivism (we are the sovereign power defining the crime).

  Your essay will be strongest if you conclude that the Hart-Fuller debate is not about what happened at Nuremberg, but about how we *narrate* what happened. Hart wants the narrative to be: "Law was used for evil, so we must make new law." Fuller wants the narrative to be: "Evil masqueraded as law, so we are restoring true law." Nuremberg shows that the victors care less about the narrative's truth than its utility in founding a new order.
