answer: |-
  **Title:** The Shadow of the Common Cause: Evaluating the Objection to Evidential Cooperation in Large Worlds

  **Introduction**

  In the landscape of modern decision theory, Evidential Cooperation in Large Worlds (ECL) offers a compelling solution to social dilemmas on a cosmic scale. Rooted in Evidential Decision Theory (EDT), ECL posits that in a sufficiently large universe containing many agents similar to oneself, an individual's choice to cooperate serves as evidence that other similar agents will also cooperate. Since the total payoff depends on the aggregate level of cooperation, EDT recommends cooperation even in the absence of causal influence. However, a potent objection has arisen: the "Known Common Cause" argument. This objection claims that the correlation between an agent's choice and the choices of their counterparts is fully explained by a shared origin (a common cause), such as identical decision-making algorithms. Once an agent conditions on this known fact, their specific choice conveys no additional information, rendering the evidential link spurious and defection the dominant strategy. This essay argues that while the "Known Common Cause" objection successfully critiques naive formulations of ECL, it fails to defeat the core thesis. A genuine evidential link survives when one accounts for logical correlation and indexical uncertainty, suggesting that ECL remains robust under a sophisticated interpretation of evidence.

  **The Case for Evidential Cooperation in Large Worlds**

  To understand the objection, one must first grasp the promise of ECL. In a standard Prisoner's Dilemma, Causal Decision Theory (CDT) dictates defection because one's action cannot causally influence the opponent's. EDT, however, evaluates actions based on the conditional probability of outcomes. If $P(\text{Opponent Cooperates} | \text{I Cooperate})$ is significantly higher than $P(\text{Opponent Cooperates} | \text{I Defect})$, cooperation maximizes expected utility.

  ECL scales this logic to the "large world" hypothesis. If the universe is vast (or infinite), physics and cosmology suggest there may be many regions containing agents with circumstances and cognitive architectures nearly identical to one's own. Let us call these "copies" or "counterparts." If an agent cooperates, EDT treats this as Bayesian evidence that the universe is of a type where counterparts cooperate. Given that the agent cares about the total welfare produced by all counterparts, the cumulative gain from widespread cooperation can outweigh the local cost of cooperating. Thus, the evidential link transforms a local dilemma into a global coordination game.

  **The "Known Common Cause" Objection**

  The "Known Common Cause" objection attacks the probabilistic heart of ECL. It draws upon the statistical concept of "screening off." In causal modeling, if two events $A$ and $B$ are correlated solely because of a common cause $C$, then conditioning on $C$ renders $A$ and $B$ independent. That is, $P(B | A, C) = P(B | C)$.

  Applied to ECL, the argument runs as follows: The correlation between my choice and my counterparts' choices is not magical; it is due to the fact that we share a decision-making procedure (the common cause) and face similar inputs. I already know this fact. I know that my counterparts are running the same "code" as I am. Therefore, when I deliberate, I should condition on this background knowledge ($K$). The objection claims that once I condition on $K$, my specific choice adds no new information about what my counterparts will do. I already know that whatever algorithm I run, they run. My choice is merely the output of that algorithm. Consequently, $P(\text{Counterparts Cooperate} | \text{I Cooperate}, K) = P(\text{Counterparts Cooperate} | K)$. The evidential update vanishes, EDT collapses into CDT, and defection dominates.

  This argument paints the ECL proponent as someone ignoring relevant background information, akin to a patient who believes scratching an itch will cure a disease, ignoring the fact that both the itch and the disease are caused by a virus they already know they have.

  **The Defense: Logical Correlation and Indexical Uncertainty**

  Proponents of ECL offer two primary rebuttals to the screening-off argument, focusing on the nature of the "common cause" and the epistemic position of the agent.

  First, the objection mischaracterizes the relationship as merely causal or statistical when it is fundamentally logical. In ECL scenarios, the "common cause" is not a past event that determined the outcome; it is the logical structure of the decision algorithm itself. When I deliberate, I am not merely observing the output of a black box; I am executing the computation. If my counterparts are running the same algorithm on the same data, then logically, their output *must* be identical to mine. The correlation is not a contingent statistical regularity subject to screening off; it is a logical necessity. Conditioning on the existence of the algorithm ($K$) does not reveal the *output* of the algorithm. My choice provides evidence of the output because my choice *is* the output. To claim the link is screened off is to claim I know the result of the computation before performing it, which contradicts the premise of deliberation.

  Second, the defense invokes indexical uncertainty. In a large world, I do not know *which* instance of the similar agents I am. I know there is a set of agents $\{A_1, A_2, ... A_n\}$ running similar code, but I am uncertain whether I am $A_1$ or $A_2$. When I choose to cooperate, I update the probability distribution over the possible worlds I inhabit. Specifically, I update the likelihood that I am in a world where the algorithm outputs "cooperate." Since the algorithm is shared, this update applies to all instances. The "Known Common Cause" objection assumes a "view from nowhere" where the agent knows the global state. However, from the first-person perspective, the agent's action provides crucial indexical evidence about the behavior of the reference class to which they belong.

  **Weighing the Arguments**

  The strength of the "Known Common Cause" objection lies in its warning against magical thinking. It correctly identifies that if the correlation were merely observational (e.g., "people who wear red shirts tend to cooperate"), conditioning on the cause (shirt color preference) would screen off the action. If ECL relied on such spurious correlations, the objection would be fatal.

  However, the objection falters when applied to agents who are functionally identical. The screening-off condition $P(B | A, C) = P(B | C)$ holds when $A$ and $B$ are distinct events caused by $C$. But in ECL, $A$ (my choice) and $B$ (their choice) are not distinct events in the relevant sense; they are token instantiations of the same type-event (the execution of the algorithm). The "common cause" is not a separate variable that can be conditioned on to independence; it is the identity relation between the agents' reasoning processes.

  Furthermore, the objection assumes the agent possesses knowledge ($K$) that includes the determinacy of the outcome. But in decision theory, the agent does not know their own action prior to the decision. If they did, there would be no decision to make. Therefore, $K$ includes the source code but not the execution result. My action reveals the execution result to me, and by logical extension, to the status of my counterparts. The evidential link is not spurious; it is derived from logical implication rather than causal influence.

  Consequently, the "Known Common Cause" objection defeats a naive version of ECL that relies on empirical correlations without accounting for logical structure. It does not, however, defeat a sophisticated ECL grounded in Logical Decision Theory (LDT) or a robust EDT that acknowledges logical facts as evidentially relevant. The objection forces ECL proponents to clarify that the "evidence" is not about causal influence or accidental correlation, but about the logical consistency of identical reasoning processes.

  **Conclusion**

  The "Known Common Cause" objection serves as a necessary stress test for Evidential Cooperation in Large Worlds, exposing the fragility of naive evidential reasoning. It correctly asserts that background knowledge about shared origins can screen off mere statistical correlations. However, the objection ultimately fails to defeat ECL because it misunderstands the metaphysical nature of the link between similar agents. The connection is not a contingent correlation subject to screening off, but a logical identity subject to indexical uncertainty. My choice does not merely *signal* what similar agents will do; in a logical sense, it *constitutes* what they do, given that we are instantiations of the same function. Therefore, a genuine evidential link survives. The rational agent in a large world should cooperate, not because their action causally changes the world, but because their action reveals the world to be one where cooperation prevails among their logical counterparts. ECL stands, refined but unbroken, as a viable framework for decision-making in a vast universe.
