      *   *The Objection:* This sounds like the "tickle defense" or screening off. If I know *why* we correlate (same source code), does my *action* tell me anything more than I already know about the source code?
      *   *Key Distinction:* Causal Decision Theory (CDT) vs. Evidential Decision Theory (EDT). CDT says my action doesn't *cause* theirs. EDT says my action *predicts* theirs. The objection tries to show that even for EDT, the prediction value is zero once background knowledge is accounted for.
      *   *Counter-arguments:* Logical correlation (Superrationality). The "common cause" isn't just a background fact; it's the *mechanism* of the correlation. Conditioning on the *algorithm* doesn't screen off the *output* if the output is logically determined by the algorithm in a way I don't fully know yet (indexical uncertainty).
      *   *Analogy:* The Prisoner's Dilemma with an exact clone. If I know we are clones, do I still cooperate? EDT says yes. The objection says "You already know you're clones, so your choice doesn't update that." But the update isn't about *being* clones, it's about *what the clone algorithm outputs*.

