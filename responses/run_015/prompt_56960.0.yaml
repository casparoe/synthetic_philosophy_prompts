      *   **Tone:** Intellectual, precise, humble but skeptical ("I should be grateful," "I confess," "left me uneasy"). He values accuracy over simplification but understands the need for pedagogy. He specifically asks for claims to be sorted into: Accurate, Defensible Simplification, Subtly Wrong, Simply False.
      *   **Specific Questions:**
