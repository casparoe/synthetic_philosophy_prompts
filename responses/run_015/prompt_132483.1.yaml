answer: |-
  **MEMORANDUM OF UNDERSTANDING: HIGHER-EDUCATION FINANCE FRAMEWORK**

  **TO:** Faculty Participants
  **FROM:** PhD Convenor
  **DATE:** Day 1, Session 1
  **SUBJECT:** Draft Basis for Collaboration

  **1. JOINT PROPOSITIONS**

  The undersigned agree to the following statements as the baseline for this collaboration:

  1.  **Returns to Education:** The graduate earnings premium consists of both human capital accumulation (skill creation) and positional signaling (screening). Neither component is zero; neither component is 100%. The relative weight of these components varies by field of study and labor market sector.
  2.  **Instrument Separation:** Tuition finance (payment to the institution) and maintenance finance (support for the student) are distinct policy instruments. Arguments regarding access and equity often conflate the two, yet evidence suggests maintenance support is the stronger determinant of participation for low-income households, while tuition levels are the stronger determinant of institutional revenue stability.
  3.  **Marginal Taxation:** An income-contingent repayment obligation functions economically as an addition to the marginal income tax rate for those above the threshold. High effective marginal rates reduce the net return to low-paid work, creating a disincentive for graduates to enter care, teaching, or arts sectors where earnings are below the median.
  4.  **Fiscal Boundary:** In a system where education is funded domestically but labor is mobile, cross-border migration creates a fiscal externality. If a country funds training via general taxation and graduates emigrate, the training country subsidizes the employing country. If a country funds via income-contingent loans and graduates emigrate, recovery rates depend on international enforcement mechanisms.
  5.  **Distributional Mechanics:** Funding via general taxation transfers resources from non-graduates to graduates. Funding via income-contingent contributions transfers resources from high-earning graduates to low-earning graduates. Both systems involve cross-subsidization; the disagreement concerns which cross-subsidy is normatively preferable.

  **2. SEMANTIC DISPUTE: THE DEFINITION OF "DEBT"**

  A portion of the disagreement is verbal; a portion is substantive.

  *   **Verbal:** The parties use the word "debt" to describe different phenomena. Position 1 (Tax-Funded) defines debt behaviorally: any obligation attached to a person that influences decision-making through psychological aversion or perceived liability is "debt." Position 2 (Income-Contingent) defines debt financially: an obligation is only "debt" if it carries default risk, appears on a balance sheet as a liability, and requires repayment regardless of income capacity.
  *   **Substantive:** Even if terminology is standardized, the parties disagree on the behavioral reality. Position 1 asserts that students *perceive* income-contingent obligations as debt regardless of the financial structure, and this perception alters enrollment behavior. Position 2 asserts that students respond to financial incentives, not labels, and that well-designed income-contingent terms do not alter behavior differently than a graduate tax.

  **3. RESIDUAL DISAGREEMENTS AND EVIDENCE PLAN**

  | Topic | Position 1 Phrasing (Tax-Funded) | Position 2 Phrasing (Income-Contingent) |
  | :--- | :--- | :--- |
  | **Access & Equity** | Upfront costs deter capable low-income students regardless of repayment terms; free entry is a prerequisite for equal opportunity. | Free tuition subsidizes high-income students who would enroll anyway; targeted repayment is required to fund maintenance grants for those who need them. |
  | **Behavioral Impact** | The existence of a personal repayment obligation steers students away from risk and low-paid social goods, regardless of income thresholds. | Repayment obligations only bind those with high capacity to pay; low earners face zero marginal cost and are not steered away. |
  | **System Efficiency** | Open access prevents credential inflation by decoupling enrollment from private return calculations. | Open access without price signals encourages long enrollment spells and over-investment in low-value credentials. |

  **Crux, Evidence, and Predictions per Disagreement**

  *   **Disagreement 1 (Access & Equity)**
      *   **Crux:** Is enrollment elasticity for low-SES students driven by the *sticker price* of tuition or the *availability of living support*?
      *   **Evidence:** Comparative enrollment data from jurisdictions that abolished tuition fees while holding maintenance grants constant, versus jurisdictions that increased maintenance grants while holding fees constant.
      *   **Prediction (Pos 1):** Abolishing fees yields a larger increase in low-SES enrollment than increasing maintenance support.
      *   **Prediction (Pos 2):** Increasing maintenance support yields a larger increase in low-SES enrollment than abolishing fees; fee abolition primarily increases enrollment among high-SES students.

  *   **Disagreement 2 (Behavioral Impact)**
      *   **Crux:** Does the *label* of a financial obligation (loan vs. tax) alter labor supply choices independent of the effective marginal tax rate?
      *   **Evidence:** Labor market tracking of graduates in systems with functionally identical repayment rates but different legal framings (e.g., specific graduate tax vs. income-contingent loan).
      *   **Prediction (Pos 1):** Graduates under a loan framing are less likely to enter low-paid sectors than graduates under a tax framing, even if net income is identical.
      *   **Prediction (Pos 2):** Labor supply choices track net income only; the legal framing has no statistically significant effect on sector choice.

  *   **Disagreement 3 (System Efficiency)**
      *   **Crux:** Does removing price signals at the margin increase time-to-degree and credential stacking?
      *   **Evidence:** Average duration of study and rate of second-degree enrollment in free-tuition systems compared to income-contingent systems, controlling for labor market conditions.
      *   **Prediction (Pos 1):** Duration and stacking are determined by labor demand, not tuition structure; free systems show no significant divergence.
      *   **Prediction (Pos 2):** Free systems exhibit significantly longer enrollment spells and higher rates of credential stacking due to the zero marginal cost of continued enrollment.

  **4. ANALYSIS OF HYBRID PROPOSALS**

  We consider a hybrid model: Entry free at the point of use, combined with a post-graduation obligation (fixed percentage of income above a threshold for a fixed term, then written off).

  **Variant A: Individual Obligation**
  *   **Mechanism:** Each graduate pays X% of income above $Y for Z years.
  *   **Position 1 Objection:** This retains the psychological burden of personal debt. If Z is long, it functions as a mortgage-style loan. If Z is short, revenue is insufficient.
  *   **Position 2 Objection:** If the write-off is too generous (short Z), high earners subsidize low earners excessively without the progressivity of the general tax system. It risks collapsing into a regressive poll tax on the middle class.
  *   **Stability:** This collapses toward Position 2 if Z is long (>15 years) and X is high. It collapses toward Position 1 if X is low and Z is short (<5 years), effectively becoming a temporary surcharge.
  *   **Parameter Threshold:** Position 1 accepts only if Z < 7 years. Position 2 accepts only if Z > 12 years.

  **Variant B: Cohort Obligation**
  *   **Mechanism:** The graduating cohort is collectively liable for a fixed sum. The obligation is levied on individuals but the total burden is fixed; if some earn less, others pay more, or the term extends for the cohort, but individual balances are not tracked.
  *   **Position 1 Objection:** This creates peer-monitoring pressure and still attaches a financial liability to the person, violating the "social good" principle.
  *   **Position 2 Objection:** This is functionally a graduate tax. It removes the "insurance" element for the individual (risk is not pooled against low income, but spread across the cohort). It removes the balance sheet asset that justifies the lending in Position 2's model.
  *   **Insurance Claim:** Position 2's claim that the instrument is "insurance, not debt" is literally true only if risk is pooled. In Variant A (Individual), the individual bears the risk of low earnings (unless written off). In Variant B (Cohort), the risk is pooled. However, Position 2 typically defends Variant A.
  *   **Stability:** Variant B collapses toward Position 1 (Graduate Tax). Position 2 cannot defend Variant B as "insurance" for the individual without admitting it is a tax. Position 1 may accept Variant B if the collection mechanism is indistinguishable from income tax.
  *   **Parameter Threshold:** Position 1 accepts if the obligation is collected by the revenue authority, not a loan servicer. Position 2 rejects if individual balances are not tracked.

  **5. CONCLUSION ON HYBRIDS**

  The hybrid model does not resolve the core disagreement unless the parameters are set such that the instrument becomes indistinguishable from one of the pure positions. The "Insurance" claim made by Position 2 relies on risk pooling that is absent in the Individual Obligation variant they typically defend. The Cohort Obligation variant satisfies the insurance definition but fails the "individual asset" requirement Position 2 uses to justify the system's fiscal sustainability.

  Crux: Whether the behavioral response to higher education finance is driven by the economic reality of marginal tax rates or the psychological framing of personal liability.
