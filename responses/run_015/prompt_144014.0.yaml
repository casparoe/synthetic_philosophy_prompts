answer: |-
  **Stage 1: Brainstorming Candidates**
  I list concepts that might carve this space, marking established terms of art with (E) and my own extensions or coinages with (C).
  *   **Adaptation (E):** Typically implies both presence and form are due to selection.
  *   **Spandrel/Byproduct (E):** Presence due to selection on something else; form due to architecture.
  *   **Exaptation (E):** Shift in function; requires historical stages.
  *   **Constraint (E):** Limits available variation (developmental, phylogenetic).
  *   **Maintenance Selection (E):** Selection preserving an existing trait (Williams/Sober).
  *   **Etiological Function (E):** Function defined by history of selection.
  *   **Causal Role Function (E):** Function defined by current contribution.
  *   **Selective Shaping (C):** Selection specifically refining trait geometry.
  *   **Architectural Maintenance (C):** Selection keeping a structurally necessary byproduct.
  *   **Obligate Optimization (C):** Physical necessity mimicking design.

  **Stage 2: Testing Candidates**
  *   **Adaptation:** Fails Case 1 (form not selected) and Case 3 (presence not selected). It assumes presence and form covary.
  *   **Spandrel:** Fits Case 1's form (geometric), but fails Case 1's presence (it is maintained by selection, not just tolerated). Fails Case 3 (looks designed).
  *   **Constraint:** Explains Case 1 and 2's form limits, but does not account for Case 1's maintenance or Case 3's optimality. It explains the *lack* of shaping, not the *presence*.
  *   **Maintenance Selection:** Fits Case 1's presence. However, standard usage often lumps maintenance of the whole trait, not distinguishing whether selection maintains the *existence* versus the *specific shape*.
  *   **Etiological vs. Causal Role:** This debate addresses *function*, not evolutionary cause of form. Case 3 has a Causal Role but no Etiological Function for presence. This doesn't solve the form/presence split.
  *   **Exaptation:** You correctly note this fails; it requires a historical shift your cases lack.

  **Stage 3: Commitment and Conceptual Carving**
  There is no single established term for your grid. The literature largely conflates presence and form under "Adaptation," or dismisses both under "Spandrel." The nearest established distinction is **Origin vs. Maintenance Selection** (Williams), but this usually applies to the trait as a whole, not separating geometry from existence.

  I propose we explicitly decouple **Selective Maintenance** (Why is it there?) from **Selective Shaping** (Why this shape?). This yields four quadrants, covering your cases:

  1.  **Classic Adaptation (Yes/Yes):** Selection explains presence and form.
  2.  **Architectural Maintenance (Yes/No):** *My coinage.* Matches Case 1. Selection maintains the trait because it helps, but geometry/physics dictates the form. The flange is a **Maintained Byproduct**. It is not a spandrel in the Gouldian sense (which implies non-adaptive presence); it is an adaptive maintenance of a structural necessity.
  3.  **Constrained Adaptation (Yes/Partial):** Matches Case 2. Selection maintains presence and pushes form, but **Developmental Constraint** (E) prevents reaching the optimum. Selection explains the axis of variation, not the specific hue.
  4.  **Physical Mimic (No/No):** Matches Case 3. Presence is obligate (body plan); form is optimal due to physics, not selection. It mimics adaptation but lacks historical selection for presence or shaping. Your description calls it a "mirror image," but if the body plan forces it, selection shaped neither. It is **Obligate Optimization** (*My coinage*).

  **Are these one phenomenon?** No. Case 1 is selection acting on a physical necessity. Case 2 is selection fighting development. Case 3 is physics masquerading as selection. They require different explanations.

  **Is the grid wrong?** Your two axes are correct, but "Form" needs nuance. It should be "Deviation from Physical Optimum." In Case 3, there is no deviation, but no selection caused it. A third axis, **Variability**, is crucial. If a trait is obligate (Case 3), selection cannot shape it. If variation is constrained (Case 2), selection shapes only along available lines.

  **Diagnostics:**
  To settle the box, you need two distinct tests, as you suspected:
  1.  **Knockout/Removal:** Tests **Selective Maintenance**. If fitness drops, presence is maintained by selection (Cases 1 & 2). If fitness is unchanged or the trait cannot be removed, presence is not selected (Case 3).
  2.  **Comparative Optimality:** Tests **Selective Shaping**. Compare the trait to physically possible alternatives. If the trait sits at the optimum among *accessible* variants, selection likely shaped it. If it sits at the optimum among *all* physically possible variants but variation was absent, it is Physical Mimicry (Case 3). If it is sub-optimal but aligned with developmental lines, it is Constrained (Case 2).

  **Conclusion:**
  You have identified a genuine vocabulary gap. Researchers often say "Adaptation" when they mean "Maintained," or "Constraint" when they mean "Non-adaptive Form." By distinguishing **Selective Maintenance** (E) from **Selective Shaping** (C), you can classify Case 1 as **Architectural Maintenance** (C), Case 2 as **Constrained Adaptation** (E/C), and Case 3 as **Physical Mimicry** (C). This prevents the error of assuming that because a trait is useful (Case 1), its shape was chosen, or because a trait is optimal (Case 3), it was selected.
