answer: |-
  Three program officers (Alex, Blake, Casey) manage a shared foundation budget allocated across three grants: Health, Education, and Liberty. Each holds 10 units of one grant authority and values the others intransitively due to contextual salience: Alex prefers 9 Education to 10 Health, and 10 Health to 9 Liberty; Blake prefers 9 Liberty to 10 Education, and 10 Education to 9 Health; Casey prefers 9 Health to 10 Liberty, and 10 Liberty to 9 Health. They execute three sequential swaps. Trade 1: Alex gives 10 Health to Blake for 9 Education (Alex gains salient Education; Blake gains intermediate Health). Trade 2: Blake gives 10 Health to Casey for 9 Liberty (Blake gains salient Liberty; Casey gains intermediate Health). Trade 3: Casey gives 10 Liberty to Alex for 9 Health (Casey gains salient Health; Alex gains intermediate Liberty). All sign voluntarily; all perceive strict local improvement.

  At the end, each holds 9 units of their original authority (Alex: 9 Health, Blake: 9 Education, Casey: 9 Liberty), having lost 10% of their total capacity. The ledger shows: Start (10,10,10) → T1 (9E, 10H, 10L) → T2 (9E, 9L, 10H) → End (9H, 9E, 9L). Every swap was Pareto-improving for signatories by their own lights, yet the final state is universally worse off by their own standards (less capacity to achieve any value). The single feature doing the work is **intransitive preferences** generated by multi-attribute weighting (salience shifts). If you strip this out (force transitive utility), the cycle breaks; you cannot prefer A>B, B>C, and C>A simultaneously. A defender of moral trade attacks by claiming intransitivity is constitutive of irrationality ("money pump"), violating the "nobody's dumb" constraint. The attack lands: "better off" loses coherent meaning without transitivity, so the Pareto defense remains intact for rational agents.

  **Verdict:** The defender escapes. The scenario demonstrates a failure of preference coherence, not a failure of moral trade. If agents are truly rational, they cannot hold the preferences required to enter the loop; if they do enter, they are by definition vulnerable to exploitation, invalidating the "nobody's confused" clause. Moral trade presupposes transitive valuations to define "improvement," so a cycle that negates improvement proves the inputs were flawed, not the mechanism.
