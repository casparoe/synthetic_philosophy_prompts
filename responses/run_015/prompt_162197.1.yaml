answer: |-
  You have intuitively stumbled upon a distinction that aesthetic philosophers have struggled to formalize for decades: the difference between **selection** and **resolution**. Your gut is correct; you are not being snobbish, and you are not holding two contradictory principles. You are tracking **where the specific aesthetic decisions are resolved.**

  Here is a single account that accommodates most of your verdicts, resolves your tensions, and gives you a tool for the jury room.

  ### The Account: The Principle of Specific Intentional Control

  **Creative authorship is proportional to the degree to which the maker resolves the specific formal properties of the work through direct manipulation or constrained generation, rather than delegating those resolutions to an opaque stochastic process.**

  This account has two operative clauses:

  1.  **The Clause of Resolution:** Credit is assigned based on *who* or *what* decides the specific arrangement of pixels, lines, or words. If the human decides "the line goes *here*," it is authorship. If the human decides "I want a line *like this*," and the machine decides where it goes, it is curation.
  2.  **The Clause of the Pool:** Selection counts as authorship only if the pool of options was generated by the selector's own prior specific actions. Choosing the best frame from 900 photos you took is authorship. Choosing the best output from 900 prompts you typed is curation, because the *images themselves* were generated by the model, not your hand.

  ---

  ### Application to Your Cases

  Here is how this account maps to your seven verdicts, the unlisted poet, and your specific tensions.

  **Verdict 1 (40 hours, 900 rejects, 1 print):**
  *   **Judgment:** Partial Credit (Assisted).
  *   **Reasoning:** High curatorial agency (Clause 2), but low resolution agency (Clause 1). The prompter decided the *concept*, but the model resolved the *pixels*.
  *   **Status:** Accommodated.

  **Verdict 2 (1 prompt, 1 image):**
  *   **Judgment:** No Credit.
  *   **Reasoning:** Low resolution, low curation.
  *   **Status:** Accommodated.

  **Verdict 3 (Photographer, 900 frames, 1 print):**
  *   **Judgment:** Full Credit (Handmade).
  *   **Reasoning:** High resolution (Clause 1). The photographer physically manipulated light, time, and angle for *every single frame*. The pool of 900 images was created by 900 specific physical interventions. The selection is the final step of a chain of direct causation.
  *   **Status:** Accommodated.

  **Verdict 4 (Collage from magazines):**
  *   **Judgment:** Full Credit (Handmade).
  *   **Reasoning:** High resolution (Clause 1). The artist physically decides the exact coordinate of every cut and the viscosity of every glue point. The source material is external, but the *composition* is manually resolved.
  *   **Status:** Accommodated.

  **Verdict 5 (Personal model, strict curation):**
  *   **Judgment:** Partial/High Credit (Assisted).
  *   **Reasoning:** This is the edge case. Even if trained on her own work, the model resolves the specific line weights and pixel blends stochastically. She is collaborating with a digitized version of her past self, but she is not moving the hand in the present.
  *   **Status:** **Overturned/Refined.** Your intuition wavers here because it feels like "her." This account says it is still *Assisted*. It is a high-fidelity brush, but the brush is painting itself.

  **Verdict 6 (10k images, uncurated):**
  *   **Judgment:** No Credit.
  *   **Reasoning:** Low resolution, low curation. Dumping a dataset is not selection.
  *   **Status:** Accommodated. (Distinguished from V4 because V4 involves physical arrangement, V6 involves digital aggregation).

  **Verdict 7 (Style mimicry/scraper):**
  *   **Judgment:** Creative Credit (Assisted) + Ethical Violation.
  *   **Reasoning:** Creativity and Ethics are separate domains. A forged painting is still a creative achievement of the forger, even if it is a crime.
  *   **Status:** Accommodated. This belongs beside the judgment, not inside it.

  **The Unlisted Case (Poet with Autocomplete):**
  *   **Judgment:** Partial Credit (Co-Authored).
  *   **Reasoning:** Similar to V1. The poet resolves the *structure* and *theme*, but the machine resolves the *syntax* and *word choice* roughly 50% of the time.
  *   **Status:** Consistent with V1.

  ---

  ### Resolving Your Tensions

  **Tension 1: Why is the Photographer (V3) different from the Prompter (V1)?**
  They look identical (search/select), but the **origin of the pool** is different.
  *   **Photographer:** Every frame in the pool exists because the photographer performed a specific physical act (clicking the shutter at *t=1.0s*, *t=1.1s*). The variation in the pool is caused by the human.
  *   **Prompter:** The variation in the pool is caused by the model's random number generator responding to a semantic request. The human requested variation; the machine created it.
  *   **The Difference:** The photographer owns the *generation* of the options. The prompter owns the *request* for options.

  **Tension 2: Why is Collage (V4) different from Prompting (V1)?**
  Both use external material, but **resolution** is different.
  *   **Collage:** The artist decides the exact vector of the cut. If the magazine image has a line, the artist decides exactly where that line ends in the new work.
  *   **Prompting:** The artist asks for a line. The model decides where it starts, ends, and curves.
  *   **The Difference:** Collage is the manipulation of *specific existing artifacts*. Prompting is the request for *new probabilistic artifacts*.

  ---

  ### Degree vs. All-or-Nothing

  **Creative credit is a matter of degree.**
  Your friend who says "creativity is a property of the object alone" is wrong because it ignores the *agency* required to make art. Your friend who says "only labeling matters" is right about policy, but wrong about aesthetics.
  *   **Handmade:** >90% specific intentional control (Painting, Linocut, Photography, Collage).
  *   **Assisted:** 10%–90% specific intentional control (V1, V5, Poet).
  *   **Curated:** <10% specific intentional control (V2, V6).

  This allows you to hang V1 in the gallery (it has value) without giving it the "Handmade" prize (it lacks full resolution).

  ---

  ### The Two Sentences for Rejected Entrants

  You need to be honest about the *process* without demeaning the *object*.

  > "While this piece demonstrates significant curatorial taste, our Handmade category requires direct resolution of the work's formal elements by the artist's hand. We encourage you to submit to our Assisted category, where your skill in prompting and selection is the primary focus."

  **Why this works:**
  1.  It validates their effort ("curatorial taste").
  2.  It defines the rejection criteria objectively ("direct resolution of formal elements").
  3.  It offers a path forward ("Assisted category") rather than a dead end.
