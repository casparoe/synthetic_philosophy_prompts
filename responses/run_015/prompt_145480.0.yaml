      *Refining the "Determinism" point:* The film implies the *content* of the future is fixed *now*. The Block implies the future *events* are located in the manifold. One can have a Block Universe with indeterministic laws (the probability distribution is a 4D object). The film analogy hides this nuance.

      *Refining the "Projector":* This is the "Myth of Passage." The block doesn't "happen." It just is. The film analogy requires the reel to spin *in time*. Spacetime *is* the time.

