          *   *Option B:* Indispensable to repair (instrumental). (Stronger).
          *   *Option C:* Performance. (Cynical, but possible).
          *   *Analysis:* It presupposes that moral repair requires a *moral agent* to receive the apology, regardless of causal primacy. It validates the victim's reactive attitudes (resentment/grief) even if the system says "no blame."

      *   **Q4: The "Administrative Attitude" Hypothesis.**
          *   User's definition: Agent addressed personally, answer sought is causal, emotions managed as inputs.
          *   *Critique:* Is this distinct from detachment? Detachment ignores the person. Administration *uses* the person.
          *   *Verdict:* It is a genuine third category. It's *managerial responsibility*. It's not about desert (retributive) or pure causality (detached). It's about *governance*.
          *   *Risk:* It might just be detachment with a human face (PR). Need to test if the *consequences* differ.

  4.  **Philosophical Licensing (Underdetermination):**
      *   *Forward-looking (Consequentialist):* Licenses Room 1 (safety) and Room 2 (trust retention).
