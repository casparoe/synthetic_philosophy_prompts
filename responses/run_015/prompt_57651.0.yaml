  8.  **Final Polish:** Ensure the distinction between *causal* responsibility and *moral* responsibility is clear, as that's the hinge between the two rooms. (Self-Correction: Make sure not to get too bogged down in jargon. Keep it accessible to a smart journalist.)

  *(Self-Correction during drafting)*: I need to be careful with the "Administrative Attitude." The user defines it as "addressed personally... answer sought is causal." I should argue that this is actually a *functional* stance. It treats the human as a functional component that has a "reporting function." It's distinct from detachment because detachment ignores the internal state; administration *queries* the internal state but only for system data.

