prompt: |-
  hi — I'm in 11th grade and I got into an arguement in my schools group chat the other day and I realised I dont have a word for the thing we were actually arguing about, and I was hoping you could tell me if there is one, or else make one up properly.

  Basically: someone used a word that is not a slur and never was one, and doesn't come from a slur, but sounds really close to a slur, and other people said it was basically unusable now. I think I remember reading about a city official somewhere who got in serious trouble for saying a word that just means stingy, because it sounds almost exactly like the n-word, even though the two words have completely unrelated origins (I looked it up at the time and the dictionary said there's no relation). And the same kind of thing happens with writing: my school's email filter once blocked a message with a place name in it because the first four letters spelled something bad. I know that's a computer being dumb, but people do the same thing on purpose — there are kids at my school who won't say a totally normal word because it contains a syllable that sounds like something else.

  What I can't figure out is what kind of offense this even is. It isn't about what the word means — the meaning is fine. It isn't really about history either, since the word doesn't have that history. And it isn't about what the speaker meant, because the person usually means nothing by it. It seems more like: once enough people hear the resemblance, the word is stuck, because a listener can't tell whether the speaker knows it's innocent or is doing it on purpose, and nobody wants to be the person who said the thing. So it feels like a coordination problem more than a meaning problem, except the result is that the word genuinely does become unusable.

  The things people compared it to don't seem quite right either. There's that thing where a neutral word for a group gets adopted to replace a slur, and then a few decades later the new word is rude too and gets replaced again — but that's about the word picking up bad associations from what it refers to, whereas my thing is about the shape of the word. And there's the opposite thing, where someone says something that sounds fine to most people but their intended audience hears the insult — that one seems different, because there the speaker wants to be understood by some people and not others, and in my case the speaker wants the exact opposite and can't get it. Someone also told me that in some languages, after a person dies, you're not supposed to say words that sound like their name, which sounds related but also like it happens for a completely different reason.

  So: is there an established concept for offense that attaches to a word because of how it sounds or how it looks, rather than because of what it means, where it came from, or what the speaker intended? If there is, I don't just want the name — I want to know what exactly the phenomenon is supposed to be, what it is not, and which of the near-misses above actually fit and why. If there isn't one, please name it and define it, and tell me where the edges are. Does it matter whether the resemblance is only in writing and not in speech? Does it stop if everyone involved knows for a fact that the words are unrelated? What about when someone uses the innocent word precisely because of the resemblance — same phenomenon or a different one? And does it count for names of places or people, where you can't just swap the word out for another one?

  Please don't just give me a list of books or articles to go read, I want the actual idea explained. And write it as one block of normal prose — no headings, no bullet points, no bold text, no tables, just like an email.
