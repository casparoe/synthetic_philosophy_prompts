answer: |-
  Hi there, it is really impressive that you dug into the etymology and the pragmatics of this situation instead of just taking people's word for it, because you have actually put your finger on a genuine linguistic phenomenon that scholars discuss even if there is not a single common word for it like there is for metaphor or irony. The concept you are describing is most accurately called phonetic contamination, though you might also see it referred to in linguistics as homophonic taboo or associative taboo, and it describes exactly what you suspected: a situation where a word becomes socially unacceptable not because of its own meaning or history, but because its sound or spelling overlaps too closely with a separate taboo word. The core mechanism here is not semantic, meaning it is not about the definition of the word itself, but pragmatic, meaning it is about how the word functions in social interaction and how listeners interpret the speaker's intent. When you use a word like niggardly, which comes from Old Norse and means stingy, the offense taken by listeners is not because you called them stingy, but because the phonetic resemblance to a racial slur creates a risk that the listener cannot distinguish between ignorance and malice. This is why your intuition about it being a coordination problem is spot on, because language relies on a shared agreement that certain signals are safe, and once a word sounds too much like a weapon, the safety agreement breaks down regardless of the word's actual history.

  This phenomenon is distinct from the other examples you mentioned, and your skepticism about those comparisons was well founded. The euphemism treadmill, where words for a group become insults over time, is driven by the referent itself becoming stigmatized, whereas phonetic contamination happens even if the referent is neutral, like a place name or a descriptor like stingy. Dog whistles are also different because they rely on the speaker intentionally using ambiguity to signal allegiance to a group while maintaining deniability, whereas in phonetic contamination the speaker usually wants to avoid the association entirely and is frustrated by it. The taboo on naming the dead in some cultures is closer because it is about the sound itself carrying a weight, but that is usually ritualistic and spiritual, whereas phonetic contamination is social and secular, driven by the fear of causing unintended harm or being perceived as harmful. The key difference is that in phonetic contamination, the word is guilty by association rather than by nature, and the offense exists in the ear of the listener rather than the mouth of the speaker.

  Regarding the edges of this concept, it does matter whether the resemblance is in writing or speech, though the effect is often stronger in speech because sound is immediate and harder to filter than text. When an email filter blocks a place name because of a substring of letters, that is a form of orthographic contamination, which is the written equivalent, but humans are generally better at contextually ignoring letter combinations than sound combinations because we process speech in real time. If everyone involved knows for a fact that the words are unrelated, the taboo can sometimes be lifted within that specific group, but the word remains unusable in the broader public sphere because you cannot guarantee that every listener has the same etymological knowledge. When someone uses the innocent word precisely because of the resemblance, that shifts the phenomenon from accidental contamination to intentional provocation, which is a different category often called dog-whistling or baiting, because the harm is now intended rather than accidental. Finally, with proper nouns like place names or people's names, the taboo is harder to enforce because you cannot simply swap the word out, so society often develops workarounds like using initials, abbreviations, or nicknames to navigate the contamination without erasing the name entirely. Ultimately, you are right that the word becomes unusable because the cost of explaining yourself every time you use it is too high, and that social cost is what defines the boundary of phonetic contamination.
