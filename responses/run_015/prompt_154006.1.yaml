  1. Brainstorm and Design Rationale
  Considered approaches: (1) assigning fixed labels to subgroups, (2) auctioning features to build classes, and (3) mandatory triage of provided datasets. Option three forces active epistemic commitment. Justifying discards makes arbitrariness visceral. Reference classes—Software Engineering Projects, Corporate Mergers, and Biological Species—were chosen because each offers robust historical failure rates for "coherence loss" but implies mutually exclusive ontologies. Software implies low risk; Organizations moderate; Biology high. Since System K is defined as all three, privileging one class arbitrarily suppresses evidence from others, creating unavoidable tension without a meta-rule to adjudicate.

  2. Materials and Role Assignments
  Each receives an identical "System K Dossier" describing technical specs, organizational chart, and evolutionary training history. Three "Data Sheets" accompany this: Sheet A (Software Failure Rates), Sheet B (Merger Coherence Loss), and Sheet C (Evolutionary Extinction Rates). Each provides base rates for "catastrophic coherence failure" within 18 months. Participants receive a "Triage Token" and Forecasting Sheet. No pre-assigned roles; all are forecasters. Facilitator holds the Master Ledger. Tables are clustered in fours to encourage local deliberation. Materials are printed on cardstock to emphasize data weight. This physical setup reinforces the separation of evidence streams. Participants must keep dossiers face-down when not in use to prevent data cross-contamination during the triage phase, ensuring that information flow is managed strictly through the provided channels.

  3. Rules, Incentives, and Payoff Structure
  Participants submit a single credence (0–100%) for System K's failure. Before writing, they must physically discard one Data Sheet into a "Rejection Bin," signaling which reference class they deem irrelevant. They must verbalize this justification to a neighbor. Scoring uses a Brier framework normalized to 100 points. A "Divergence Penalty" applies: if group standard deviation exceeds 15 points, everyone loses 10 points, simulating epistemic fragmentation. The primary incentive is social: the lowest scorer buys coffee for the group. This pressures alignment with consensus while maintaining accuracy. Since the outcome is unknowable, "accuracy" is simulated via a hidden random draw revealed at the end, ensuring no reference class is objectively validated, preserving philosophical ambiguity. Participants cannot discuss numerical base rates, only the ontological relevance of the classes. This prevents averaging and forces a qualitative choice about what System K is. Tension arises because aligning for the Penalty requires convincing others to discard the same data, yet no argument is logically superior. Furthermore, participants cannot change their discarded sheet after verbalizing justification, locking them into their ontological stance. This rigidity ensures that subsequent forecasting reflects the initial triage conflict rather than strategic hedging. The coffee stake ensures that while the points are abstract, the social cost of being the outlier is tangible, mirroring professional reputational risk. The facilitator monitors compliance to ensure the triage rule is not treated as optional. This enforcement is critical, as the pedagogical value relies on the forced exclusion of data.

  4. Activity Flow: Phase by Phase
  (0-10m) Introduction: Facilitator outlines System K and the resolution criterion. Emphasize that all three Data Sheets are statistically valid for their respective domains. (10-25m) Private Review: Participants read the Dossier and Data Sheets silently. They calculate implied probabilities for each class individually. Note the variance: Software suggests 5% failure, Organizations 40%, Evolutionary 80%. (25-50m) Triage Deliberation: Participants pair up. They must show their discarded sheet and justify why that domain is less analogous to System K. They cannot share their final credence yet. This forces argumentation over ontology, not numbers. Participants often feel compelled to defend their discard as "objectively" correct, encountering resistance when peers discard different sheets. (50-65m) Forecasting: Participants lock in their credence and submit sheets. They are reminded that changing their mind now requires admitting their triage was flawed. (65-75m) Aggregation: Facilitator calculates group mean and standard deviation. The spread is plotted anonymously on the whiteboard. (75-90m) Debrief: Reveal the divergence. Discuss the inability to prove one class correct. The facilitator highlights clusters of credences corresponding to the retained reference classes, demonstrating that the disagreement stems from the initial triage, not calculation errors. This visual mapping confirms that identical information yielded divergent truths based solely on class selection.

  5. Debrief: Mapping Experience to the Reference Class Problem
  The debrief must explicitly connect the visceral frustration of the Triage Phase to the philosophical core of the reference class problem. Participants felt compelled to choose a "natural kind" for System K, yet the dossier defined it as a hybrid. The divergence in credences was not due to irrationality but to the underdetermination of the case by the data. The facilitator should highlight that no participant could prove their discarded class was irrelevant; they could only assert it. This mirrors the absence of a principle of indifference over similarity spaces. The game approximates the problem by forcing a choice where none is logically mandated. However, the facilitator must verbally supply the missing link: that in real forecasting, we often hide this triage step behind intuition. The exercise reveals that "reasonable" forecasters diverge because they optimize for different similarity metrics. The social penalty for divergence underscores the practical cost of this philosophical ambiguity: coordination fails when base rates are contested. Crucially, the facilitator must note that there is no "meta-reference-class" to tell us which class to pick. The simulation forces participants to inhabit the discomfort of knowing their probability is contingent on an arbitrary ontological commitment, rather than a discoverable fact about the world. It emphasizes that for a single boundary case, frequency data from multiple classes cannot be combined without a weighting rule that does not exist. This structural gap is where the philosophy resides, not in the calculation itself. Participants must leave understanding that their disagreement was rational yet irreconcilable.

  6. Predictable Failures and Facilitator Handling
  Participants may attempt to average the base rates from all three sheets, violating the triage rule. The facilitator must enforce the discard mechanic strictly; if a sheet is not in the bin, the forecast is invalid. Another failure mode is the group converging on the "Software" class due to status bias (engineering seems more precise). The facilitator should not correct this but highlight it during debrief as a sociological bias masquerading as epistemic rigor. Some may ask the facilitator for the "correct" answer. The facilitator must refuse, stating the truth is sealed. If the group refuses to diverge, the facilitator should seed conflict by revealing their own discarded sheet differs from the majority. The goal is not consensus but the experience of unresolvable disagreement.

  7. Limits of the Simulation
  This simulation simplifies the problem by offering three discrete classes, whereas reality presents a continuum. It resolves ambiguity via a random draw for scoring, implying a truth value exists, whereas the philosophical problem concerns the meaningfulness of the probability itself. The exercise isolates epistemic tension but cannot replicate consequences of acting on an arbitrary base rate selection. It approximates structural conflict but relies on the facilitator to articulate deeper metaphysical implications regarding single-case probabilities. Thus, the simulation is a prop for dialogue, not a complete model.
