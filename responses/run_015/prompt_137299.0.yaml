answer: |-
  What makes a pattern real at all?

  1.  Sheer compressibility of the data.
      1.  Closed Archive: A compressed description exists for destroyed station data with no future use. Is the pattern real?
          1.  No. **Instrumental Compressionism**. (Awkward: A perfect summary of the past is unreal because it predicts nothing.)
          2.  Yes. Is a pattern real if it is compressible in principle but no agent can find it?
              1.  No. **Computational Realism**. (Awkward: Reality depends on the computational limits of agents.)
              2.  Yes. Must the pattern be findable by any agent who could exist?
                  1.  No. **Platonic Information Realism**. (Awkward: Patterns exist even if no universe contains a decoder.)
                  2.  Yes. **Modal Computational Realism**. (Awkward: Reality depends on the limits of possible agents.)
  2.  Support for prediction or intervention.
      1.  Price Pattern: A profitable price pattern vanishes when traded. Is it real?
          1.  No. **Interventionist Realism**. (Awkward: A pattern that worked for centuries is unreal because it stopped working yesterday.)
          2.  Yes. **Predictive Realism**. (Awkward: Patterns that vanish when touched are still real until touched.)
  3.  Relative to an observer's stance or interests.
      1.  Coding Schemes: Two teams code the same data; one finds a pattern, one finds noise. Is the pattern real?
          1.  No, one scheme is correct. **Physical Stance Exclusivism**. (Awkward: All biological and economic talk is strictly false shorthand.)
          2.  Yes, relative to the scheme. Does a design description of a broken device yield real patterns?
              1.  No, only physical descriptions count. **Physical Stance Exclusivism**. (Awkward: Contradictory descriptions of the same object are simultaneously false.)
              2.  Yes, both count. Does the design stance yield real patterns for an organism without a designer?
                  1.  No. **Intentional Realism**. (Awkward: Purpose is real in artifacts but unreal in evolved organisms.)
                  2.  Yes. **Stance Pluralism**. (Awkward: Contradictory descriptions of the same object are simultaneously true.)

  Unoccupied combinations
  The path accepting design patterns for artifacts but rejecting them for organisms is unattractive because it draws an arbitrary metaphysical line at human intention. The path accepting compressibility for archives but rejecting it for unfindable patterns is unexplored because it posits a reality limit at human capability without explaining why.

  Pairs this tree cannot separate
  The two leaves labeled Physical Stance Exclusivism are structurally distinct but philosophically identical; this difference is only verbal. The whole topic collapses into a verbal dispute at the root question if "real" is not defined as serving a specific function like prediction or compression.
