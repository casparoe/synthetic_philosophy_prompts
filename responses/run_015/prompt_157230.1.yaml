answer: |-
  **MEMORANDUM**

  **TO:** Principal Investigators, Project NEURO-DYAD
  **FROM:** University Joint Neuroethics and Human-Subjects Board
  **DATE:** October 23, 2024
  **SUBJECT:** Decision on Protocol #2024-BCI-Dyad (Distributed Self Study)

  **Bottom Line Decision**
  The Board cannot approve the protocol as submitted. We are issuing a decision of **Approve with Conditions**, contingent upon specific revisions to the consent process and risk mitigation strategy. You must resubmit the revised protocol by **Thursday, November 14, 2024**. Enrollment cannot begin until these conditions are met and final sign-off is granted.

  **Reasoning: The Distributed Self Hypothesis**
  We take the central ethical claim of this proposal seriously. If the bidirectional BCI loop successfully creates a phenomenologically unified agent, standard individualistic ethics may indeed fail to capture the moral reality of the dyad. Treating the pair as entirely separate entities could inadvertently harm the emerging "we" by imposing artificial boundaries on shared affective states. Ignoring the potential for a distributed identity risks inadequate protection for the relational unit you intend to study. The Board acknowledges that if your hypothesis holds, the moral patient here may be the loop, not just the bodies.

  **Strongest Counter-Consideration: Biological Individuation and Withdrawal**
  However, the Board cannot accept the premise of a single subject for regulatory and safety purposes *prior* to empirical demonstration. Regardless of phenomenological unity, the participants remain biologically distinct entities with separate nervous systems, legal identities, and potential for asymmetric harm. One body can experience seizures, infection, or psychological distress that the other does not share equally. If we accept a joint consent form, we risk creating a lock-in effect where one participant cannot withdraw without the "other half's" permission, effectively trapping a biological human in a harmful experiment. Individual autonomy must remain the fail-safe mechanism until the existence of a distributed self is proven, not assumed.

  **Required Conditions for Approval**
  To proceed, you must revise the protocol to address the following:

  1.  **Dual-Layer Consent:** Replace the single joint consent form with two individual consent forms plus a mandatory "Dyadic Agreement." Each participant must individually consent to enrollment and retain the individual right to withdraw. The Dyadic Agreement will outline the shared expectations but cannot override individual withdrawal rights.
  2.  **Unilateral Exit Protocol:** You must detail a technical and psychological protocol for immediate decoupling initiated by *either* participant. This includes a "hard stop" mechanism accessible to each individual independently.
  3.  **Independent Advocacy:** Appoint an independent monitor not affiliated with the research team to represent individual interests if a conflict arises between the participants or between a participant and the dyadic unit.
  4.  **Post-Study Decoupling Care:** Provide a funded plan for long-term psychological support specifically addressing "identity re-individuation" after the loop is severed.

  Verdict summary: Protection of individual withdrawal rights takes precedence over hypothetical phenomenological unity until empirical evidence dictates otherwise.

  \answer{Approve with Conditions}
