answer: |-
  Your friend is correct that defining freedom as randomness makes the concept useless, but the wasp example highlights a deficit in adaptive flexibility rather than a lack of metaphysical indeterminism.

  The core error in your "sphexishness coefficient" is conflating *unpredictability* with *agency*. If your actions are determined by quantum noise, you are not the author of those actions any more than the wasp is; you are simply a conduit for thermal fluctuations. This is known as the "luck objection" to libertarian free will: if a decision is not determined by your reasons, character, or history, it happens *to* you rather than *by* you. Therefore, maximizing behavioral variance unexplained by the environment measures chaos, not freedom. A better metric would measure the depth of the control hierarchy: specifically, the system's ability to monitor its own routines and interrupt them when they fail to achieve higher-order goals. The wasp isn't unfree because she is deterministic; she is unfree because she lacks a meta-cognitive layer that can represent the task ("hide cricket") separately from the procedure ("check nest") and recognize when the procedure is futile.

  Regarding the ethology, the story is grounded in fact but stylized for philosophical effect. Naturalists like Jean-Henri Fabre and later the Peckhams observed the digger wasp (*Sphex ichneumoneus*) repeating the inspection loop multiple times—sometimes up to forty iterations—when the prey was displaced during the interior check. However, they do not loop literally forever until starvation; eventually, fatigue or competing drives usually break the cycle. The philosophical point remains valid regardless: the wasp's behavior is modular and encapsulated, unable to integrate new information (the cricket's location) once the subroutine is triggered.

  Your friend's charge that this is just a compatibilist redefinition is partially true, but necessary. Redefining freedom as "the ability to act according to one's own determined reasons without external coercion" is the only way to avoid the dilemma where you are either a clockwork mechanism or a random number generator. The wasp example does work in this argument, but not to prove determinism is true; it works to show that complexity and goal-directedness can exist without understanding. It warns against assuming that because a system behaves purposefully, it possesses a self-model capable of overriding its own programming. To escape sphexishness, you don't need indeterminism; you need the architectural capacity to simulate counterfactuals and veto impulses based on those simulations.
