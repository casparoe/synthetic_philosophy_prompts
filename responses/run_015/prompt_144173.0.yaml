answer: |-
  Aristotle argued that what holds a community together is not coin, but reciprocal need. He believed exchange becomes just only when it reflects the mutual dependence of citizens, not just the scarcity of goods. Money, for him, was merely a convention to measure that need. Our time bank comes closer to this ideal than the cash economy because we measure value by human presence, not market price.

  In ordinary exchange, price tracks demand and scarcity, not justice. A luxury item might cost more than a necessity simply because it is rare. Aristotle warned that when profit drives exchange, the community fragments into buyers and sellers. In our scheme, the measure is time itself. By saying one hour equals one credit, we establish a reciprocal proportionality based on membership, not output. We are declaring that an hour of your life is worth an hour of mine. This restores the balance Aristotle sought: exchange should bind people together, not rank them.

  The first objection you will hear is that this ignores skill and discomfort. An hour of brain surgery is not an hour of sweeping floors. Market prices track these differences, but Aristotle would say market prices track power, not worth. When we pay based on skill, we treat people as tools valued for their utility. When we pay based on time, we value the citizen. The community needs the sweeper just as much as the surgeon to function healthily. By equalizing the rate, we acknowledge that the dignity of the giver matters more than the market value of the gift. We are trading care, not commodities.

  The second objection is that hoarding credits is just like hoarding wealth. Aristotle distinguished between managing a household to meet needs and doing business to accumulate wealth for its own sake. He hated the latter. But credits are not wealth. You cannot invest them to earn interest, and you cannot use them to buy power over others. They are simply a record of mutual aid. If someone accumulates credits, it means they have served the community more than they have taken. That is generosity, not capital. Unlike cash, which can be stored to dominate the future, credits only have value if the community continues to trust and help one another.

  Ultimately, cash exchange allows us to settle debts and walk away. Time banking requires us to remain in relationship. It forces us to recognize that our needs are met by our neighbors, not by a bank account. This is exactly the reciprocal proportionality Aristotle described: not an equality of things, but an equality of people bound by need. We are not trying to get rich; we are trying to live well together. That makes us not just economically efficient, but politically just.
