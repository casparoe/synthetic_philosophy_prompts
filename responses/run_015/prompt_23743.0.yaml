answer: |-
  You have not framed this wrong at all. In fact, you have identified the single most prominent and powerful objection to Evolutionary Debunking Arguments (EDAs). In philosophy, this is known as the **"Self-Defeat Objection"** or the **"Global Skepticism Objection."**

  It is the first thing any philosopher trained in meta-ethics will look for when evaluating an EDA. If the argument proves too much (i.e., it undermines the very reasoning used to construct it), it is logically unstable.

  However, whether this is a "fatal problem" depends on how the proponent of the EDA (like Sharon Street) responds. The debate does not end with your objection; rather, your objection forces the debate into a more nuanced area regarding the difference between **scientific beliefs** and **moral beliefs**.

  Here is a breakdown of why this objection is strong, how defenders of EDAs answer it, and what it means for your conclusion about trusting intuitions.

  ### 1. The Core Tension: Local vs. Global Skepticism
  Your argument is essentially: *If evolution undermines moral beliefs because they are selected for fitness rather than truth, it must undermine scientific beliefs for the same reason.*

  *   **The Realist Counter (Your position):** We trust our cognitive faculties generally. If we trust them enough to do evolutionary biology, we must trust them enough to do moral philosophy. To do otherwise is arbitrary.
  *   **The Anti-Realist Move:** We need to show why moral beliefs are *uniquely* vulnerable to evolutionary explanation in a way that perceptual or scientific beliefs are not.

  ### 2. How Defenders of EDAs Respond
  Philosophers like Street, Richard Joyce, and Katia Vavova have developed specific responses to prevent the argument from collapsing into global skepticism. They generally argue for a **domain-specific defeat**.

  #### A. The "Feedback Loop" Argument
  Scientific and perceptual beliefs have a causal feedback loop with the world; moral beliefs (allegedly) do not.
  *   **Science/Perception:** If you believe there is a cliff in front of you, and you walk forward, gravity provides immediate feedback. If your belief is false, you die or get hurt. Evolution selects for accurate spatial and causal beliefs because accuracy *contributes* to fitness in these domains.
  *   **Morality:** If you believe "helping your kin is good," and you do it, there is no external "moral meter" that checks if you are right. You might survive because of group cohesion, but that doesn't prove the moral proposition is *true* in a realist sense.
  *   **The Point:** Evolution tracks truth in science because truth *helps* survival there. Evolution tracks fitness in morality, but fitness does not require moral *truth* (only moral *behavior*).

  #### B. Street's Constructivism (Crucial Distinction)
  You mentioned Sharon Street specifically. It is important to note that Street is not an **Error Theorist** (who says all moral claims are false); she is a **Constructivist**.
  *   **Realism:** Moral truths exist independently of us (like math or physics). The EDA attacks this hard because there is no causal link between us and these "independent truths."
  *   **Constructivism:** Moral truths are constructed by the practical standpoint of valuing creatures.
  *   **Her Defense:** Street argues the EDA destroys *Realism*, but it does not destroy *Normativity* itself. We can still trust our moral intuitions, not because they track independent facts, but because they are the output of our own valuing nature. The self-defeat objection fails because she isn't using moral intuitions to track independent truths; she is using them to construct coherent values.

  #### C. The "Third Factor" Explanation
  Some realists (like David Enoch) argue that there is a "third factor" linking survival and truth.
  *   *Example:* Survival is good. Evolution selects for survival. Therefore, evolution selects for things that are good.
  *   Street rejects this, arguing it begs the question. But this highlights that the debate is about whether there is a necessary link between fitness and truth in the moral domain.

  ### 3. Is it a "Fatal Problem"?
  Most philosophers agree that if the EDA leads to global skepticism (doubting logic, math, and science), it is fatal. **Therefore, a successful EDA must walk a tightrope.**

  It must argue that:
  1.  Our cognitive faculties are generally reliable (saving science/logic).
  2.  **Except** in the specific domain of realist moral truths, where the evolutionary pressure is decoupled from truth-tracking.

  Is this distinction successful?
  *   **Critics say No:** They argue that logic and math are also abstract. If evolution can't track moral truths, why can it track logical truths?
  *   **Proponents say Yes:** They argue logic is a tool for *any* reasoning (including survival reasoning), whereas moral realism posits specific entities that are irrelevant to survival.

  ### 4. Should we "Go Back to Trusting Moral Intuitions"?
  This is your conclusion: *If the argument fails, we should trust our intuitions.*

  Here is the nuance: Even if the Self-Defeat Objection works, it doesn't necessarily save **Moral Realism**. It might just save **Moral Pragmatism**.

  *   **Scenario A (Realism Saved):** The EDA fails. Evolution is truth-tracking enough that our intuitions likely correspond to objective moral facts. (This is the view of "Ethical Naturalists").
  *   **Scenario B (Realism Lost, Intuitions Kept):** The EDA succeeds in killing Realism, but we keep intuitions for pragmatic reasons. We treat morality like a user interface. It doesn't reflect the "backend code" of the universe, but it's the only way humans can interact socially without crashing the system.

  Street argues for something like Scenario B. She would say: "Don't trust your intuitions as *detectors of independent truth*. Trust them as *expressions of what you value*."

  ### 5. A Software Engineering Analogy
  Since you come from an SWE background, consider this analogy:

  Imagine you have a legacy codebase (the human brain) optimized for **Latency** (survival/reproduction), not **Correctness** (truth).

  *   **The EDA Claim:** You cannot trust the output of functions related to "Business Logic" (Morality) because they were hard-coded for latency.
  *   **Your Counter:** If the codebase is optimized for latency, I can't trust the "Compiler" (Logic) or the "System Logs" (Science) either. The whole system is suspect.
  *   **The EDA Response:** The Compiler (Logic) *must* be correct for the Latency optimization to work at all. If `IF/ELSE` statements don't work, the organism dies immediately. However, the "Business Logic" (Morality) is a higher-level abstraction. You can have a system that runs perfectly (survives) with completely hardcoded, arbitrary business rules, provided those rules promote cohesion.
  *   **The Takeaway:** The fact that the system runs (we survive) proves the Compiler works. It does *not* prove the Business Logic corresponds to an external reality.

  ### Summary
  1.  **You are right:** The Self-Defeat Objection is the strongest argument against EDAs. If an EDA implies we can't trust logic or science, it is indeed fatal.
  2.  **But:** Proponents of EDAs (like Street) refine their arguments to avoid global skepticism. They argue moral beliefs are *structurally different* from scientific beliefs regarding evolutionary pressure.
  3.  **The Conclusion:** The objection doesn't force us back to **Moral Realism**. It allows us to keep using moral intuitions pragmatically (Constructivism or Expressivism) without believing they track mind-independent facts.

  So, you don't have to abandon moral intuitions, but you might have to abandon the idea that those intuitions are "discovering" truths in the same way physics discovers laws of motion. You can trust the interface, even if you doubt the backend.
