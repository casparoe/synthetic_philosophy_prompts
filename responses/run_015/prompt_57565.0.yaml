answer: |-
  You have identified one of the central tensions in modern regulatory philosophy. The inconsistency you see isn't a bug; it's a feature of a system trying to reconcile three incompatible goals: **actuarial accuracy** (pricing risk correctly), **social equity** (not punishing protected classes), and **market stability** (keeping insurance affordable and available).

  The current regulatory regime is not built on a single coherent theory of justice or statistics. It is a **reflective equilibrium**—a messy compromise between competing ethical frameworks that shifts depending on political pressure.

  Here is a reconstruction of what the practice presupposes, where it holds together, where it breaks, and what lies at the extremes.

  ---

  ### 1. The Ontology of the Insured: What is a "Person" here?

  To understand the rules, you have to understand what kind of entity the regulator imagines the customer to be. Insurance regulation oscillates between two incompatible views of the person:

  1.  **The Risk Unit:** A collection of statistically relevant variables. In this view, fairness means *actuarial fairness*: you pay exactly what your risk profile costs the pool.
  2.  **The Rights-Bearing Citizen:** A member of a political community with protected status. In this view, fairness means *social fairness*: you should not be penalized for immutable characteristics that define protected classes.

  **The Load-Bearing Presupposition:**
  The system presupposes that **some correlations are morally toxic, while others are merely economic.**
  It assumes that while *all* rating factors are proxies (as you noted), some proxies are "legitimate" (causal or functional) and others are "illegitimate" (historical or discriminatory).

  *   **Age** is treated as a *functional* proxy. It correlates with reflexes, experience, and mortality. It is viewed as a biological reality that affects the *mechanism* of the risk.
  *   **Sex (in the EU)** was reclassified as a *historical* proxy. The EU Court of Justice (Test-Achats ruling) decided that while men crash more, this is likely due to socialization and behavior, not biology. Therefore, pricing on sex reinforces a social stereotype rather than measuring an inherent risk.
  *   **ZIP Code** is the paradox. It is legally framed as a *property* rating factor, not a *person* rating factor. Insurers argue they are rating the risk of the *location*, not the *driver*. This is the legal shield. If they rated "people in this ZIP," it would be redlining. By rating "cars garaged in this ZIP," they claim to be assessing environmental risk (theft rates, road density, litigation frequency).

  **The Incidental Fit:**
  The distinction between "chosen" (smoking) and "unchosen" (age) is incidental. If smoking were genetically determined, regulators would likely still allow it as a rating factor because it is viewed as a *behavioral modifier* of risk, not a *class definition*. The load-bearing beam is not **choice**, it is **protected class status**.

  ### 2. Consistency Check: Sex vs. Age

  Is banning sex while permitting age consistent?

  **Logically/Statistically: No.**
  Both are immutable (within the policy term). Both are highly predictive. Both are unchosen. If the principle were "no pricing on immutable characteristics," age would be banned. If the principle were "price on maximum predictive power," sex would be kept (as it is in most US states).

  **Sociologically/Politically: Yes.**
  This is where the "everyone gets old" slogan does actual work. It relies on a theory of **Inter-Temporal Solidarity**.
  *   **Age is a progression:** Every member of the pool moves through the risk classes. The 18-year-old paying high premiums expects to become the 50-year-old paying low premiums. The 50-year-old paying high life insurance premiums was once the 20-year-old paying low ones. There is a sense of shared fate.
  *   **Sex is a stratification:** It creates permanent castes. If you are born male, you are in the "high risk" caste forever. If female, "low risk." There is no mobility.

  **The Load-Bearing Theory:**
  The system is committed to **preventing permanent castes** more than it is committed to **preventing unchosen disadvantages.**
  Regulators tolerate age discrimination because it is universal and transient. They ban sex (in the EU) and race (everywhere) discrimination because they create permanent, politically salient divisions.

  **The Weak Link:**
  This theory collapses when applied to **ZIP codes**. ZIP codes are often effectively permanent castes due to housing segregation and economic immobility. If you are born in a high-premium ZIP, you are likely to stay there. The system allows this because it treats the variable as *environmental* rather than *demographic*, but functionally, it acts as a proxy for class and race. This is the point of greatest hypocrisy in the framework.

  ### 3. Underdetermination: Which Theory is Running the Show?

  You asked if we can tell which theory is driving the rules. We can't, because at least three distinct ethical theories license the exact same rulebook (Ban Race/Sex, Allow Age/ZIP).

  1.  **Utilitarian/Market Stability:** We ban race/sex because allowing them causes social unrest or political backlash that threatens the insurance market's legitimacy. We allow age/ZIP because banning them would cause premiums to spike too high for low-risk groups, causing them to leave the pool (adverse selection), collapsing the market.
      *   *Prediction:* If public outrage over ZIP codes grew, regulators would ban them, regardless of actuarial logic.
  2.  **Deontological/Rights-Based:** Certain characteristics are intrinsic to human dignity and cannot be commodified (Race, Sex). Others are external to dignity (Age, Location, Habits).
      *   *Prediction:* This theory struggles to explain why Credit Score is allowed (which correlates heavily with race/class) unless "financial responsibility" is deemed a moral virtue rather than a circumstance.
  3.  **Legalistic/Disparate Treatment:** The rule is simply: "Do not use variables explicitly defined as protected classes in Statute X."
      *   *Prediction:* This is the actual operating system. It explains the ZIP code loophole perfectly. The law bans discrimination *because of* race. It does not ban discrimination *correlated with* race, provided the insurer can articulate a "business necessity" (predictive loss cost).

  **Where it is Underdetermined:**
  We cannot tell if regulators care about **accuracy** or **affordability**.
  *   If they cared about accuracy, they would allow everything (including genetic data).
  *   If they cared about affordability for the vulnerable, they would ban age and ZIP and subsidize the difference.
  *   Instead, they do neither. They protect specific political classes while leaving economic classes exposed.

  ### 4. The Reference Class Problem in Practice

  You mentioned Reichenbach. The insurance industry solves the Reference Class Problem pragmatically, not philosophically.
  *   **Rule:** Use the narrowest class that satisfies **Credibility** and **Compliance**.
  *   **Credibility:** Do you have enough data points in this class to trust the average? (This stops the "18-year-old men with red hatchbacks" problem).
  *   **Compliance:** Is this class legally permissible? (This stops the "Race" problem).

  The "Homogeneous" advice you recall is the actuarial standard: *Rate groups should be as homogeneous as possible with respect to risk, but heterogeneous enough to be statistically credible.*
  The tension you sense is real: The more you narrow the class to be fair to the individual (accuracy), the smaller the sample size (instability). The more you broaden the class to ensure stability, the more you subsidize high-risk individuals within that class (inaccuracy).

  ### 5. The Extremes: What if we swapped the view?

  If we abandon the current compromise, two extremes emerge.

  #### Extreme A: Pure Individual Assessment (The "Telematics" Ideal)
  **Theory:** Fairness is only individual. Group factors are unjust.
  **Mechanism:** No age, no sex, no ZIP. You pay based entirely on *your* driving behavior (measured via app), *your* health (wearables), *your* credit behavior.
  **Consequences:**
  *   **Privacy Collapse:** To price accurately without groups, insurers need total surveillance.
  *   **The Poverty Trap:** Behavioral factors correlate with resources. A poor person may drive an older car (higher theft risk), live further from work (more miles), and have worse credit. Without group pooling, these individual factors still recreate class stratification, but without the transparency of demographic data.
  *   **Initial Cost:** Young drivers couldn't be rated on "youth," only on driving. Without history, they would face maximum uncertainty pricing until they proved themselves.

  #### Extreme B: Fully Bayesian Pricing (The "Actuarial" Ideal)
  **Theory:** Fairness is accuracy. Every correlation is a moral obligation to price.
  **Mechanism:** Use genetic markers, browsing history, psychological profiles, full demographic intersectionality.
  **Consequences:**
  *   **Uninsurability:** People with high-risk genetic markers or living in high-risk zones would face premiums they cannot pay. Insurance ceases to be a social good and becomes a luxury for the low-risk.
  *   **Feedback Loops:** If high-risk ZIP codes get higher premiums, property values drop, wealth leaves, risk increases, premiums rise further. The insurance mechanism accelerates social decay.
  *   **The End of Pooling:** Insurance relies on the lucky subsidizing the unlucky. If you perfectly price every unlucky trait, there is no subsidy. It becomes a pre-paid maintenance plan, not insurance.

  ### Summary: What is the Practice Committed To?

  The current system is not committed to **Truth** (accurate risk assessment) nor **Justice** (equal treatment).

  It is committed to **Legitimacy**.

  It allows enough accuracy (Age, ZIP, Credit) to keep the low-risk customers in the pool so the market doesn't collapse.
  It bans enough discrimination (Race, Sex in EU) to keep the government from nationalizing the industry or facing civil rights lawsuits.

  The "Motive" distinction you identified is the key. Regulators inspect the **facial validity** of the variable, not the **disparate impact**.
  *   "We use Age because biology." (Accepted)
  *   "We use Sex because biology." (Rejected in EU as social construct)
  *   "We use ZIP because crime stats." (Accepted, even if crime stats are racially skewed)

  The system hangs together only as long as the proxies for class (ZIP, Credit) are not successfully politicized as proxies for race. The moment ZIP code is legally redefined as a protected class proxy (as happens in some housing contexts), the whole structure will have to shift. Until then, the inconsistency you see is the stable state of a system trying to be a business and a social safety net simultaneously.
