  2.  **Initial Brainstorming & Theoretical Frameworks:**

      *   *Actuarial Fairness:* Premiums should reflect expected cost. This is the industry standard.
      *   *Social Fairness/Equity:* Certain characteristics are "protected classes" (Civil Rights Act, EU Charter). Discrimination based on these is morally/legally suspect regardless of predictive power.
      *   *The "Proxy" Problem:* Disparate impact doctrine. If a neutral factor (ZIP) has a disparate impact on a protected class (Race), is it illegal? In insurance, often *no*, unless intent is proven (in many jurisdictions). In housing/employment, *yes* (sometimes).
      *   *The "Immutable" Argument:* Age is immutable but *transient*. Sex is immutable and *permanent*. This matters for social mobility and stigma.
      *   *The "Control" Argument:* You can't control age, but you can control smoking. But you can't control ZIP (often tied to income/race).
      *   *The "Social Solidarity" Argument:* Insurance is partly a social good. We subsidize high-risk groups (older people, sick people) to ensure access. But we don't subsidize young men's reckless driving as much as we used to (in EU).
      *   *Legal/Regulatory Reality:* Insurance is state-regulated in the US, federally influenced in EU. The "Test-Achats" ruling was about gender equality, not actuarial science.

  3.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the depth of the rabbit hole. Validate that the inconsistency is real and not just a misunderstanding.
      *   **Part 1: The Implicit Ontology (What is a person in insurance?):**
          *   Not an individual, not a demographic. A "Risk Unit."
