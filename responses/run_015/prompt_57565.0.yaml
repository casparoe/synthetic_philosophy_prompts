          *   ZIP Code Paradox: Correlates with race (illegal to use race), but using ZIP for "theft risk" is legal. Motive is hard to inspect.
      *   **Failed Hypotheses:**
          *   "Chosen vs. Unchosen": Smoking (chosen) vs. Sex (unchosen). *Counter:* Age is unchosen but allowed.
          *   "Predictive vs. Proxy": All factors are proxies.
