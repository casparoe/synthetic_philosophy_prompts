      *   **Philosophical Angle:** Reference Class Problem (Reichenbach). Narrowest class vs. Homogeneous class.
      *   **The Ask:**
          1.  Reconstruct the underlying presuppositions of current practice (fairness, evidence, ontology of a person in a risk pool).
          2.  Identify load-bearing bits vs. incidental fits.
