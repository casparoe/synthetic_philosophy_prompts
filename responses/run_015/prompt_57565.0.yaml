          *   The "Everyone gets old" argument is actually about *inter-temporal redistribution*.
      *   **Part 4: Underdetermination (Multiple theories, same rules):**
          *   Theory A: Utilitarian/Actuarial (Maximize accuracy within legal bounds).
          *   Theory B: Deontological/Rights-based (Certain traits are off-limits).
          *   Theory C: Paternalistic (Protect consumers from "unfair" surprises).
      *   **Part 5: The Extremes (What if we swapped the view?):**
          *   *Pure Individual Assessment (Telematics/Behavioral):* No groups. You pay for *your* driving. Problems: Privacy, initial cost, penalizes poverty.
          *   *Fully Bayesian (Everything Correlates):* Use DNA, browsing history, etc. Problems: Uninsurability, genetic discrimination, social collapse.
      *   **Conclusion:** The current system is a "Reflective Equilibrium" (Rawls). It's a messy compromise, not a logical derivation.

  4.  **Drafting the Content - Key Insights to Refine:**

      *   *The ZIP Code Issue:* This is the crux of "Disparate Impact." In US insurance law (mostly), business necessity (predictive power) trumps disparate impact unless there's proof of *intent*. In Housing (FHA), disparate impact is stronger. Need to clarify this distinction.
      *   *Age vs. Sex:* The "Everyone gets old" argument is about *pooling over a lifetime*. I pay more when young/old, less when middle-aged? Actually, car insurance goes down with age. Life insurance goes up. The key is that Age is a *progression*, Sex is a *stratification*. Stratification creates permanent castes. Progression creates life stages. This is the sociological load-bearing beam.
      *   *Reference Class:* The user mentioned Reichenbach. The insurance industry solves this pragmatically: "The narrowest class that is statistically credible and legally permissible." Credibility (sample size) limits the "narrowest" part. Law limits the "permissible" part.
      *   *Fairness Definitions:* Distinguish between *Individual Fairness* (similar individuals treated similarly) and *Group Fairness* (demographic parity). Insurance aims for Individual Fairness *within* legally defined Group constraints.

  5.  **Refining the Argument on "Consistency":**

      *   The user asks if banning sex but permitting age is consistent.
