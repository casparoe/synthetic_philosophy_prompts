answer: |-
  Dear Board,

  I am writing to recommend that we remove Octavia Hallam's name from both the debut prize and the reissue series, retaining only the institutional identity of the Hallam Trust for the funding itself. We should rename the awards something neutral that reflects our current mission, such as the Hallam Trust Historical Fiction Prize, and proceed with this change before the AGM in June. This is not a proposal to erase history or to pretend Hallam was a monster in every regard, but rather a decision to acknowledge that a prize is a continuing speech act in the present tense. Every time we announce a winner under her name, we are invoking her authority and endorsing her legacy as the standard for the work we support. A historical note stapled to the front of a book or buried on a website is varnish; it asks the reader to do work they will not do, and it allows us to feel we have addressed the problem without actually changing the signal we send to the literary community. My friend in intellectual history was right to point out that arguing about what Hallam could have known in the nineteen-fifties is a detour. The question is not about her soul or her culpability, but about what our money is for now. We are the stewards of this endowment in the twenty-twenty-first century, and our primary obligation is to ensure that the values signaled by our awards align with the values we intend to promote today.

  If we keep the name, we are implicitly telling applicants and readers that Hallam's specific brand of xenophobia is compatible with our mission, provided we add a footnote. If we remove it, we clarify that the Trust supports historical fiction that engages with the past critically, not fiction that uses the past as a shield for prejudice. This distinction is vital because we need a general rule for the bequests coming next year, and likely for many years after. The reachable-dissent rule we discussed is elegant but flawed because it relies on our current selection of which historical dissenters count as valid. Instead, the rule we should adopt is that a benefactor's name may remain attached to a programme only if their public legacy does not actively contradict the core ethical mission of the Trust as it stands today. We are not judging them by modern standards they could not meet; we are judging whether their specific, documented public stances undermine the work we are trying to do now. If a future benefactor left money for us to promote diversity in historical fiction but had publicly argued against the humanity of the very groups we seek to highlight, their name cannot stay on the prize. This shifts the burden from historical forensic accounting to strategic alignment, which is where it belongs.

  This decision also has direct implications for how we guide our applicants, and this is where my experience as a novelist compels me to be specific. Our current guidelines state that characters should be true to their period, and every year we receive manuscripts where true to their period turns out to mean a protagonist saying things the author clearly takes to be simply true. Writers use historical setting to launder their own prejudices, assuming that if a character is racist or xenophobic in 1790, it is merely accurate rather than a moral choice by the author to center that view without critique. If we rename the prize, we must also rewrite that guideline to clarify that historical accuracy in custom and setting is not the same as moral neutrality. We should be encouraging authors to render the past with empathy and complexity, not to use the distance of time to avoid accountability for the views their narratives endorse. If we decide that Hallam's name is too compromised by her essays on migrants to remain on our award, we cannot simultaneously tell writers that depicting similar views without critique is simply a matter of period fidelity. The signal must be consistent. We are funding fiction that understands the past is a foreign country, as our chair likes to say, but we are also funding fiction that understands the author is still a citizen of this one.

  To achieve this before the first week of June, we need to move quickly and divide the labor efficiently. I propose that we commission a legal review of the endowment terms immediately to ensure we have the latitude to rename the programmes without violating the terms of the bequest, which should be completed by the end of April. Simultaneously, a small subcommittee should draft the new naming convention and the revised applicant guidelines, focusing on the distinction between depicting prejudice and endorsing it, with a draft ready for board review by the tenth of May. We will then need to prepare a public statement that explains the decision without turning it into a trial of Hallam herself, focusing instead on the evolution of the Trust's mission and the need for clarity in our signaling to writers and readers. This statement should be approved at the May board meeting so we can release it alongside the AGM papers. I am willing to lead the drafting of the new guidelines given my background in the genre, but I will need the chair to handle the legal correspondence and another member to manage the communications strategy.

  I know this is uncomfortable. We all liked Hallam's fiction, and we all respect the generosity that built this endowment. But generosity does not buy perpetual immunity from critique, and respect for the dead should not require us to compromise the integrity of the living work we do. The version of this argument I find hardest, and the one I think we must accept, is that honoring somebody is something we do now, not something that happened in nineteen-sixty-two. We are not museum curators preserving a shrine; we are a working trust funding art that speaks to the present. If we keep the name, we are choosing comfort over clarity. If we remove it, we are choosing the future of the work over the reputation of the benefactor. I urge you to support this motion so we can present a united front at the AGM and stop spending our energy debating what Octavia Hallam could have known, and start spending it on what we know now.
