  1. Eligibility Logic
  Your eligibility rule relies on a conception of **surrogate political membership** rooted in international refugee law. By distinguishing persecuted cross-border refugees from internally displaced persons (IDPs) and climate migrants, you prioritize the breakdown of the political contract over material destitution. Persecution implies the state has become an aggressor, voiding the citizen's claim to protection. Border crossing signifies the physical loss of that protection regime. IDPs, however destitute, theoretically remain under their state's jurisdiction and retain legal ties to their homeland; aid here is viewed as humanitarian intervention rather than resettlement. The border crossing validates the claim that return is impossible, whereas IDPs retain the possibility of return. This impossibility is key. Climate migrants face ecological misfortune rather than targeted political exclusion; their displacement is agentless, lacking a specific persecutor to flee. Thus, the central work is done not by need, but by **legal homelessness**. You are not merely alleviating suffering; you are offering substitute citizenship to those whose own polity has actively renounced them. This renders the three-way distinction intelligible: only the persecuted cross-border refugee lacks both a functioning state and a safe territory, creating a unique moral claim for external resettlement rather than internal aid. The border is not just a line but a threshold of lost membership, making the host community a substitute sovereign rather than a mere benefactor. The distinction rests on the idea that only certain harms dissolve political bonds, warranting new membership rather than temporary aid.

  2. Responsibility Logic
  Your responsibility logic employs a **division of moral labor** between private charity and public justice. At the local level, duty is **associative and voluntary**; you act because you have chosen to form a circle and possess specific capacities (housing, time). You reject causation or proximity as grounds for local obligation, treating sponsorship as a supererogatory gift. You do not owe this because you caused the war or live nearest the border. Proximity is rejected locally because closeness does not create moral debt, yet accepted nationally because frontline states are overwhelmed. However, at the national level, duty shifts to **distributive fairness**. By insisting on government quotas regardless of local volunteering, you acknowledge that relying solely on charity creates unfair burdens on frontline states and willing communities. The state must ensure burden-sharing because it holds the monopoly on border control and international agreements. Thus, local action is framed as generous participation in a scheme whose ultimate obligatoriness rests on the national government to ensure global equity among hosts. The town insists on national quotas to prevent "free-riding" by other communities, even while exempting itself from mandatory participation. This creates a system where the *system* is mandatory, but the *local unit* is optional, relying on sufficient volunteerism to meet the state's justice-based obligations. The fairness argument protects frontline states from bearing the brunt of displacement, while the voluntariness argument protects local autonomy from federal overreach.

  3. Required Versus Merely Compatible
  For the eligibility rule, it is **required** that political persecution creates a qualitatively distinct claim compared to economic or environmental hardship. It is **merely compatible** that climate change is less severe than war; your practice assumes the *type* of cause matters, not just the intensity of suffering. This leaves the view **underdetermined** regarding why targeted malice outweighs existential ecological threat. You could logically consistent hold that need is paramount but still prioritize refugees due to feasibility, but your rule suggests a principled exclusion. It remains unclear if the exclusion of climate migrants is pragmatic or principled.
  For the responsibility rule, it is **required** that burden-sharing among nations is a matter of justice, not charity. It is **merely compatible** that local participation must remain voluntary; you could logically argue that spare housing creates a mandatory local duty. The practice is **underdetermined** on why the national mandate does not trickle down to compel specific towns. You assume a threshold where state duty begins and private duty ends, but the logic doesn't strictly dictate where that line falls. The tension lies in claiming national duty is binding while local duty is not, despite both relying on the same resources.

  4. Coherence and What Revision Would Entail
  The rules are **coherent only as a hybrid**: a rights-based eligibility paired with a split responsibility model. They pull in different directions if local capacity exists without volunteers; the national duty implies someone must host, but the local rule says no one must. If volunteers fail to appear, the national quota remains unmet, revealing a gap between obligation and execution. This hybridity allows moral comfort but risks systemic failure if volunteering dips.
  Adopting a **purely need-based** outlook would require expanding eligibility to IDPs and climate migrants, as suffering becomes the sole metric. Your sponsorship criteria would shift from "persecution" to "destitution," potentially prioritizing those closest to conflict zones over those who crossed borders.
  Adopting a **purely capacity-based** outlook would alter responsibility assignment. If obligation stems from ability to help, local sponsorship could become mandatory where housing exists, and national quotas would be calculated strictly by GDP or population, disregarding fairness to frontline states. The current balance between voluntary local gift and mandatory national justice would collapse into a unified calculus of utility or resources, removing the special status of the refugee and the voluntary nature of the town.
