  ### The Disjunctivist's Ladder of Trouble

  **Tier 1: The Anchored Cases (Scores 1–2)**
  *These cases involve real objects, allowing the disjunctivist to insist the experience is fundamentally relational.*

  1.  **The half-submerged stick (Score: 1):** There is actually a stick there, so the experience is anchored to reality despite the distortion.
  2.  **Pareidolia (Score: 1):** You are seeing the wall correctly, just imposing a pattern that isn't intrinsic to it.
  3.  **Doubling (Score: 2):** The visual system is malfunctioning, but it is still processing light from existing objects.

  **Tier 2: The Mediated Cases (Scores 3–6)**
  *The link to the world is degraded or internal, forcing a debate about whether indirect contact counts as seeing.*

  4.  **Afterimage (Score: 3):** This is a lingering sensory effect rather than a claim about the current external world.
  5.  **Restored sight (Score: 4):** The causal chain is artificial but still connects the subject to the physical page.
  6.  **Passthrough VR (Score: 6):** You are interacting with real objects, but only through a digital intermediary that could theoretically diverge.

  **Tier 3: The Unanchored Cases (Scores 8–10)**
  *These cases sever the causal link to the world, creating the maximum pressure to admit a common mental factor.*

  7.  **The coincidental match (Score: 8):** The experience matches the world perfectly, but lacks the causal link that defines seeing.
  8.  **Full-blown hallucination (Score: 9):** There is nothing there at all, yet the subject cannot tell the difference from seeing.
  9.  **The perfect simulation (Score: 10):** Every aspect of experience is generated internally, making the external world metaphysically optional.

  ***

  ### Editor's Notes & Analysis

  **1. The Hallucination Load**
  **0.9**
  Nine-tenths of the pressure to abandon disjunctivism comes from the hallucination-flavoured cases; the illusion cases (like the stick) are largely decorative because there is still an object present to be seen.

  **2. The Load-Bearing Case**
  **Full-blown hallucination (Case 4)**
  This is the engine of the argument; the stick is traditionally wheeled out first because it is intuitive, but the hallucination is the only one that truly threatens the claim that perception is essentially a relation to the world.

  **3. The Strategic Concession**
  **The coincidental match (Case 5)**
  The disjunctivist should concede that this is not seeing, because the match is accidental; the cost is admitting that subjective experience alone never guarantees a connection to the world, even when you get it right.

  **4. The Eleventh Case**
  **The Shared Hallucination**
  Two people hallucinate the same dagger in the same place and can interact with it together, yet no object exists.
  *Why it's worse:* It adds public verification to a private error, making it impossible to dismiss the experience as a purely internal glitch.

  **5. The Scale Critique**
  **Your scale is measuring two things.**
  "Trouble" conflates the metaphysical question (are these states the same kind of thing?) with the epistemic question (can the subject tell them apart?). A case can be epistemically indistinguishable (high score) while the disjunctivist insists it is metaphysically distinct (low score). For the graphic to be honest, split the score into **Metaphysical Distance** and **Epistemic Indistinguishability**, or print a two-axis plot instead of a ladder.
