answer: |-
  0.35

  Before committing to this number, I enumerated candidate sub-questions including: the construct validity of the equality indices (WEF vs. GGGI); the direction of causality (does equality cause divergence or vice versa?); the stability of preferences over the life course; the distinction between absolute rates and relative shares; the role of welfare state confounds; and the normative definition of "opportunity." I discarded the construct validity question because the prompt stipulates the pattern survives recoding; I discarded causal direction as a separate branch because it is subsumed under Package Covariation (reverse causality is a confound); and I discarded preference stability over the life course because the operational definition of "invariant" restricts the claim to the observed range of institutional arrangements. I retained Measurement, Composition, Covariation, Revelation, and Conceptual Coherence because these directly compete to explain the variance in the observed pattern.

  ### Decomposition

  I treat the following numbers as a **partition over best explanations** (summing to 1.0), representing the probability that each mechanism is the *primary* driver of the observed divergence pattern. My credence in P corresponds directly to the weight assigned to Revelation.

  | Branch | Weight | Justification |
  | :--- | :--- | :--- |
  | **1. Measurement/Artefact** | 0.25 | Shares among degree-holders are mathematically sensitive to base rates; self-reports diverge from incentivized measures, suggesting noise. |
  | **2. Marginal-Entrant Composition** | 0.15 | Selection effects shift pool averages as barriers fall, but this rarely accounts for the full magnitude of cross-national variance. |
  | **3. Package Covariation** | 0.25 | Equality indices correlate tightly with wealth and welfare generosity, which independently alter labor market incentives and risk profiles. |
  | **4. Revelation** | 0.35 | Preference differences appear consistently across STEM, risk, and altruism domains, suggesting a robust underlying signal beyond artefact. |
  | **5. Ill-Posed/Else** | 0.00 | While "preference" is theoretically fuzzy, operational stability within the observed range makes this branch negligible for explanation. |

  **Combination:** Since P claims Revelation accounts for *more* of the pattern than any single alternative, my credence in P is equal to the probability weight assigned to Branch 4 (0.35). I am treating the branches as mutually exclusive "best explanations" for tractability, though in reality they likely interact; this simplification slightly inflates the precision of the estimate but preserves the comparative claim required by P.

  ### Justice

  Conditional on each branch, the inference that "no injustice remains" is never licensed.

  *   **Measurement/Artefact:** If the pattern is statistical noise, policy based on it is misguided, but existing injustices (e.g., wage gaps in female-dominated fields) persist independently of the divergence pattern.
  *   **Marginal-Entrant Composition:** If the gap reflects pool shifts, the injustice lies in the initial barriers that required positive selection for entry, not merely in the resulting distribution.
  *   **Package Covariation:** If wealth/welfare drives the pattern, justice requires examining whether those specific structures (e.g., part-time norms) reinforce care penalties, regardless of the equality index score.
  *   **Revelation:** Even if preferences are revealed, justice is not satisfied; the object of justice may be equal opportunity to pursue *any* preference, but if "female" preferences sort into lower-paid sectors due to structural undervaluation of care, the outcome remains unjust.
  *   **Ill-Posed:** If preferences are endogenous to the arrangement, the injustice is precisely that the arrangements shape the preferences that justify them, requiring intervention on the shaping mechanism.

  The critical error in the "no injustice" inference is conflating *procedural* freedom (barriers removed) with *structural* equity (sorting costs and valuation of outcomes equalized). Branch 4 specifically fails to license complacency because revealed preferences operate within a price and status structure that is itself a policy choice.

  ### Sensitivity and Updating

  My final number is most sensitive to **Package Covariation**, as the correlation between gender equality indices and GDP/welfare spending is extremely high, making isolation of the "equality" mechanism empirically fragile. I am least confident in the **Measurement/Artefact** weight, because while shares are artefact-prone, the pattern persists in some absolute rate measures and incentivized tasks, suggesting artefacts are not the whole story. The single piece of evidence that would move me most is a natural experiment where equality policies change abruptly within a country (e.g., quota laws) allowing a difference-in-differences analysis of preference measures before and after, isolating policy from culture.

  **Pricing the Hypothetical:**
  Suppose a diagonal design of second-generation migrants found incentivized gaps *unchanged* across host countries while self-reported gaps widened. This would move my credence in P **down from 0.35 to 0.15**. This evidence would sever the link between institutional equality and *behavioral* preference expression, suggesting the divergence pattern is driven by normative signaling (self-report) or cultural confounds rather than the revelation of invariant preferences in choice. Since P relies on the claim that equality permits fuller expression of preferences (implying behavior), finding that behavior remains static while reports shift would reclassify the phenomenon from "Revelation" to "Measurement/Artefact" or "Package Covariation" (cultural norms), drastically reducing the probability that Revelation is the best explanation.
