  **JOURNAL OF GROUNDED EXPLANATION**
  **Committee on Explanatory Grounding**
  **INSTRUCTIONS FOR AUTHORS (REV. 14.2)**

  **Mission Statement**
  The *Journal of Grounded Explanation* exists to eliminate skyhooks from the scientific literature. A skyhook is any explanatory device that borrows lifting power from above, halting the descent of justification before bedrock is reached. All explanatory work must be performed by cranes: mechanisms assembled from machinery one level down, capable of lifting complexity without miraculous intervention. Authors must demonstrate that their explanations do not rely on ungrounded capacities.

  **The Grounding Chain Requirement**
  Every submission must include a certified Grounding Chain. Each explainer invoked must be shown to rest on explainers beneath it. No explainer may be credited with a capacity of the same kind as the capacity it is invoked to explain. To prevent covert skyhooks, the following terms are prohibited as terminal nodes: *emergence, self-organization, representation, norm,* and *agent*. These concepts often mask unanalyzed lifting power. Explanation must proceed until the phenomenon is fully supported by the level below.

  **Institutional Apparatus**
  1.  **Registry of Approved Bedrock Levels (RABL):** Descent may only terminate at levels currently listed in the RABL. Current approved bedrock includes quantum field states and spatiotemporal coordinates. Explanations stopping at "biology" or "psychology" without further derivation will be returned.
  2.  **Certificate of Provisionally Grounded Status (CPGS):** If a derivation from bedrock exceeds fifty pages, authors may apply for a CPGS. This certificate acknowledges the chain *could* be completed but grants exemption for length. Note: A CPGS does not validate the intermediate levels; it only postpones their verification.

  **The Boom-Crane Clause**
  Mechanisms described in engineering language are subject to the Boom-Crane Clause. If a mechanism is described as "designed" or "optimized" without specifying the selective or physical process that assembled it, it is classified as a boom-crane: a device lowered from above rather than built from below. Authors must specify the assembly history of all functional architectures.

  **Worked Abstracts**

  *Field: Animal Navigation*
  **Original:** "Homing pigeons utilize a cognitive map to represent spatial relationships and navigate toward goals."
  **Compliant:** "Homing pigeons exhibit magnetite-mediated orientation responses correlated with geomagnetic vectors. Neural firing rates vary as a function of coordinate displacement."
  *Comment:* The compliant version removes the skyhook of "representation" and "goal," reducing the phenomenon to physical correlation.

  *Field: Human Concept Learning*
  **Original:** "Children infer grammatical rules from input data to generate novel sentences."
  **Compliant:** "Synaptic weights in cortical layers adjust via error-correction signals triggered by auditory input variance. Output sequences match input statistical regularities."
  *Comment:* "Inference" and "rule" are prohibited as they imply ungrounded normative capacity. The compliant version describes weight adjustment only.

  *Field: Speculative Bubbles*
  **Original:** "Investor confidence drives asset prices above fundamental value through herd behavior."
  **Compliant:** "Transaction velocity increases as buy orders exceed sell orders. Price variance deviates from dividend discount models."
  *Comment:* "Confidence" and "value" are normative skyhooks. The compliant version records transaction flows without explaining the bubble structure.

  **Final Authorization**
  These instructions are mandated by the Committee on Explanatory Grounding. The authority of the Committee rests on the Principle of Non-Arbitrary Stopping. This Principle dictates that explanatory descent must cease only when no further lowering is physically possible. The Principle itself is not subject to Grounding Chain review, as it constitutes the framework within which grounding is measured. All submissions must adhere to these standards to ensure that no explanatory lift occurs without mechanical support.

  **Signed,**
  **Committee on Explanatory Grounding**
  **Journal of Grounded Explanation**
