answer: |-
  You have identified a particularly insidious mechanism of democratic decay, and your intuition is sharp: this is distinct from general institutional capture, though often conflated with it.

  ### Is there an established name?

  There is no single, universally canonical term in the public lexicon akin to "gerrymandering" or "filibustering." However, in contemporary political science, the closest established concept is **"Epistemic Backsliding"**. Scholars such as Levitsky and Ziblatt have recently begun referring to these as attacks on **"truth-telling institutions"**, while others utilise the term **"Bureaucratic Sabotage"** (popularised by David Lewis) to describe the mechanism of weakening administrative capacity.

  Yet, none of these perfectly capture your specific "scoreboard" metaphor. "Epistemic Backsliding" is often broader, encompassing media and education. "Bureaucratic Sabotage" focuses on inefficiency rather than the manipulation of truth. Therefore, while the phenomenon is recognised, a precise label for the *targeting of factual baselines* specifically is still emerging.

  ### Proposed Term: Epistemic Infrastructure Erosion

  If we are to coin a precise term for analytic clarity, **"Epistemic Infrastructure Erosion"** fits best.

  **How it differs from ordinary institutional capture:**
  Ordinary institutional capture (e.g., packing courts) is about *decision-making power*: it ensures the regime wins legal disputes. Epistemic Infrastructure Erosion is about *reality construction*: it ensures the regime defines the premises of the dispute.
  *   **Capture:** The referee is biased towards Team A.
  *   **Erosion:** The scoreboard is broken, so Team A can claim the score is whatever they like, and Team B has no neutral record to prove otherwise.
  In Hungary, for instance, the central statistical office (KSH) was not just staffed with loyalists; its methodology was altered to obscure inflation data. In Turkey, the statistical institute (TUIK) ceased publishing granular data on unemployment. This prevents opposition parties, investors, and voters from coordinating around a shared understanding of economic performance.

  **Boundary Cases:**
  *   **Universities:** Included *if* they are state-funded and their research output is systematically censored or defunded for producing inconvenient data (e.g., climate science or gender studies). Excluded if they are private and merely criticised by politicians.
  *   **Public Media:** Included (e.g., the BBC or PBS) if their editorial independence is structurally compromised to alter news narratives. Excluded if private media outlets choose their own bias.
  *   **Central Banks:** Included. If a government pressures a central bank to alter inflation modelling or interest rate reporting for political gain, this is core epistemic erosion.
  *   **Private Tech Platforms:** Generally excluded, unless the state coerces them into altering algorithms to suppress factual data.

  **Analytic Utility vs. Partisan Risk:**
  This is a highly useful analytic category because it moves the debate from "who is lying" (which is subjective) to "who is breaking the measurement tools" (which is observable). You can measure budget cuts to statistical agencies, the firing of chief statisticians, or the classification of public data as state secrets.

  However, the **partisan risk is high**. Because "truth" is contested, any accusation of epistemic erosion can be mirrored. A government may claim it is merely "streamlining bureaucracy" or "correcting elite bias," while the opposition claims "authoritarian control." In the US, for example, disputes over Census methodology are often framed by one side as protecting privacy and by the other as suppressing minority votes. Without careful, evidence-based application, the term risks becoming merely a sophisticated way of calling the other side "liars."

