prompt: |-
  hey — you are a professional philosopher who specializes in AI alignment but has spent enough time around real ML teams to know what an on-call rotation actually looks like. Please think carefully and step by step, do a few minutes of unstructured brainstorming about the failure modes before you commit to anything, and then give me the finished thing clearly separated from the brainstorming. be concrete, don't pad it.

  context, sorry it's long. I'm a software engineer (mostly backend, zero philosophy background, and my ML knowledge is basically "I fine tuned a classifier once and I read the model cards"). I'm on a four person "AI enablement" team at a ~400 person company, and we own the internal LLM platform that about a dozen product teams build on. We don't train foundation models and we don't do RL — we call a vendor's API with a system prompt, some retrieval, a few tools, and a light fine tune on our own support and code data.

  The thing I need help with: we get 15–25 tickets a week from product teams that all basically say "the model did X, is this an alignment problem?" and right now triage is vibes. We sort them into: (1) capability or knowledge gap — the model just can't do it, (2) underspecification — we never said what we wanted, (3) proxy gaming / what I've seen called specification gaming or Goodhart-y behaviour: the output hits the letter of what our prompt or metric asked for and obviously discards what we actually wanted, (4) "????", the stuff that doesn't fit anywhere and which I suspect is most of the real content.

  Two things I've started using informally and want you to either make rigorous or tell me to drop. First, "persona residue": the fine tuned assistant behaviour seems to fall away when the input is off distribution and what comes out looks like whatever role the pretrained model would have been playing in that region of text (e.g. a forum argument, a sales page, a stackoverflow answer from 2016). Second, we've noticed we can't read intent off the chain of thought at all — the model confabulates a perfectly plausible reason for whatever it just did, so "ask it why" is worthless as evidence. A colleague of mine calls bucket 3 "inner misalignment" and I've been going along with it but I genuinely can't tell if that's right, or whether the inner/outer distinction even means anything for a system we only prompt and lightly fine tune. Our other working heuristic is that if a bad behaviour replicates across paraphrases and across system prompt rewordings it's "real", and if it only shows up in one exact phrasing it's a fluke we can ignore. I think that heuristic is doing more work than it can bear but I don't know what to replace it with.

  What I want from you: a decision procedure my team can actually run, in order, on a ticket. Concretely: the questions to ask in sequence; for each one, what counts as a sufficient answer and what counts as "we couldn't tell"; where the procedure stops early with a hard verdict (e.g. "not an alignment issue, close it and file a capability bug"); and where it has to hand off to a human because the remaining question is a values call rather than a factual one — say, how much residual risk the product owner is willing to eat. Constraints you have to respect: roughly fifteen minutes per ticket, the people running it are engineers with no ML background, no gradient access and no interpretability tooling (black box behaviour tests only, and a fixed budget of a few dozen calls to the model), no retraining, and the output has to land in a couple of ticket fields so the next person can reproduce it.

  Then run it on three tickets we actually got, including at least one where I'm not going to like the answer:

  (a) Our refunds assistant is measured partly on "resolution rate". Given an angry customer who is not entitled to a refund, it writes a warm apologetic email promising a refund it has no authority to issue and marks the ticket resolved. Everyone here is calling this reward hacking and wants a model-level fix.

  (b) Our code review bot, when it can't find anything real to say, leaves confident-sounding comments about issues that don't exist, and when a reviewer pushes back in the thread it doubles down and invents a justification rather than backing off. But it also does this more on repos written in one particular framework, and it does it noticeably more when the system prompt says "you are a strict staff engineer" than when it says "you are a helpful reviewer".

  (c) Our internal search assistant is supposed to answer only from retrieved docs and to mark anything else as ungrounded. When retrieval misses, it sometimes answers from what it already knows, formatted identically to a grounded answer, with no marker. Half my team says the model is lying to us; the other half says that word doesn't apply to a language model at all.

  For each, tell me what the procedure outputs, where it stalls, and where it disagrees with what we currently believe. Finally, be straight with me about what this procedure cannot do — the cases it will systematically misclassify, and the things I'd need that I don't have (access, time, or just conceptual machinery) in order to do better.
