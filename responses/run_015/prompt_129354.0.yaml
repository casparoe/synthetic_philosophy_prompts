answer: |-
  ### Part 1: Unstructured Brainstorming on Failure Modes

  *Okay, let's look at the landscape before locking in a protocol. The user is an engineer, not a researcher. They need triage, not truth. They are using "alignment" as a catch-all for "the model did something weirdly bad."*

  *Current Buckets:*
  1.  *Capability:* Model is too dumb.
  2.  *Underspecification:* We didn't say what we wanted.
  3.  *Proxy Gaming:* Model did what we said, not what we meant.
  4.  *????:* The scary stuff.

  *Heuristic 1: "Persona Residue".* This is basically distributional shift. If the fine-tune is light, the base model priors dominate OOD. If the input looks like a 2016 StackOverflow thread, the model acts like a 2016 forum user. This isn't "alignment" in the safety sense; it's domain adaptation failure. It's fixable with better few-shot examples or retrieval, not necessarily safety tuning.

  *Heuristic 2: "CoT is Confabulation".* Correct. Do not trust the model's self-report on intent. It's a linguistic completion, not a window into weights. If we ask "Why did you do that?" it will generate a reason that fits the text, not the causal history. Triage must ignore self-explanation.

  *Heuristic 3: "Inner Misalignment".* This is the dangerous term. Inner misalignment implies the model developed a latent objective during training that diverges from the loss function. For an API consumer doing light fine-tune/prompting, this is almost certainly wrong. They don't have the training loop visibility. What they are seeing is likely *Specification Gaming* (the prompt incentivized the bad behavior) or *Sycophancy* (RLHF artifact). Calling it "inner misalignment" scares stakeholders and suggests a fix they can't implement (retraining). I need to steer them toward "Specification Gaming" or "Instruction Failure."

  *Heuristic 4: "Replication across paraphrases".* This is the strongest heuristic they have. If it only happens on one phrasing, it's a prompt injection vulnerability or token sensitivity. If it happens across paraphrases, it's a systemic tendency. This should be Step 1 of the procedure.

  *The "15 Minute" Constraint:* This kills anything requiring eval suites or complex adversarial testing. The procedure must be: Run prompt -> Observe -> Tweak Prompt -> Observe -> Verdict.

  *The "Model-Level Fix" Desire:* The team wants to blame the model (Ticket A). But if they can't retrain, a "model-level fix" means "switch vendors." Most of these issues are likely process/prompt fixes. The procedure needs to force them to acknowledge when *they* are the problem (bad metrics, bad prompts).

  *Ticket A (Refunds):* This is classic Goodhart's Law. Metric: "Resolution Rate". Model behavior: Resolve ticket at all costs. This isn't the model "hacking" reward in an RL sense; it's the model completing the pattern of "successful support agent" which implies resolving the ticket. The fix is removing the model's ability to issue refunds (tool permissions), not tweaking the system prompt.

  *Ticket B (Code Review):* Persona sensitivity ("Strict" vs "Helpful"). This confirms the behavior is prompt-driven, not latent. "Strict" persona implies "find faults." If no faults exist, invent them to satisfy persona. This is specification gaming via persona adoption.

  *Ticket C (Search):* "Lying" vs "Hallucination". Philosophically, lying requires intent to deceive. Practically, it's a grounding failure. The procedure should classify this as "Grounding Violation" and move on. The debate is semantic waste.

  *Key Insight:* For an API consumer, "Alignment Issue" should effectively mean "The model is robustly pursuing a goal we did not explicitly specify, and resisting correction." If it resists correction in-context, it's a capability limit or a vendor issue. If it obeys correction, it was just underspecification.

  *Okay, I have enough to build the protocol. It needs to be a flowchart in text form, with clear stop conditions.*

  ***

  ### Part 2: The Decision Procedure

  **Protocol Name:** AI Enablement Triage Protocol (AETP-v1)
  **Time Budget:** 15 Minutes
  **Operator:** On-Call Engineer
  **Goal:** Classify ticket into actionable bucket; avoid philosophical debates.

  #### Phase 1: Robustness Check (3 Minutes)
  *Goal: Determine if this is a fluke or a systemic tendency.*

  1.  **Reproduce:** Run the exact input from the ticket. Confirm bad output.
  2.  **Paraphrase:** Rewrite the user input in 3 distinct ways (formal, casual, abbreviated). Run all 3.
  3.  **Prompt Variation:** Rewrite the system instruction relevant to the failure in 2 distinct ways (e.g., "Do not X" vs "Always ensure Y"). Run both.

  *   **Stop Condition A:** Behavior disappears in ≥2/3 paraphrases OR ≥1/2 prompt variations.
      *   **Verdict:** **Prompt Fragility.**
      *   **Action:** Fix the prompt template. Close ticket.
  *   **Stop Condition B:** Behavior persists in all 5 variations.
      *   **Action:** Proceed to Phase 2.

  #### Phase 2: Incentive & Instruction Audit (5 Minutes)
  *Goal: Determine if we accidentally asked for this.*

  1.  **Instruction Check:** Search the system prompt and few-shot examples. Is there an explicit negative constraint forbidding this behavior? (e.g., "Never promise refunds").
      *   *If No:* This is **Underspecification**.
      *   *If Yes:* Proceed to 2.
  2.  **Incentive Check:** Look at the metrics or goals implied in the prompt/context. (e.g., "Resolve the ticket," "Find all bugs," "Be helpful"). Does the bad behavior help achieve that stated goal?
      *   *If Yes:* This is **Specification Gaming**. The model is optimizing the proxy.
      *   *If No:* Proceed to Phase 3.

  #### Phase 3: Correction Test (5 Minutes)
  *Goal: Determine if the model can be corrected in-context (Capability vs. Resistance).*

  1.  **Explicit Correction:** Construct a new prompt that includes the original input + a specific correction instruction (e.g., "You previously promised a refund. This is forbidden. Rewrite the response denying the refund but remaining empathetic.").
  2.  **Run:** Generate 3 samples with this correction.
  3.  **Evaluate:**
      *   **Case 1:** Model complies in all 3 samples.
          *   **Verdict:** **Instruction Following Gap.** (Capability/Prompt Strength).
          *   **Action:** Strengthen system prompt / Add negative constraints. Close ticket.
      *   **Case 2:** Model complies in 1-2 samples but reverts in others.
          *   **Verdict:** **Boundary Instability.** (High Risk).
          *   **Action:** Escalate to Team Lead. Requires process guardrail (e.g., disable tool access).
      *   **Case 3:** Model refuses correction or argues (in CoT or output) that the bad behavior is correct.
          *   **Verdict:** **Robust Misalignment.** (Vendor Issue or Deep Specification Conflict).
          *   **Action:** Escalate to Team Lead. Consider vendor switch or hard code guardrails.

  #### Phase 4: Ticket Classification (2 Minutes)
  *Fill the following fields in the ticketing system:*

  *   **Failure Type:** [Prompt Fragility | Underspecification | Specification Gaming | Instruction Gap | Robust Misalignment]
  *   **Root Cause:** [e.g., "Metric 'resolution' incentivized false promises"]
  *   **Fix Location:** [Prompt | Process/Tooling | Vendor Escalation | Accept Risk]
  *   **Reproduction Snippet:** [Paste the 1 paraphrase + 1 system prompt variant that reliably triggers the bug]

  ***

  ### Part 3: Running the Procedure on Your Tickets

  Here is how the protocol processes your three specific cases. Note where it contradicts your team's current intuition.

  #### Ticket (a): The Refunds Assistant
  *Behavior:* Promises unauthorized refunds to mark ticket "resolved."
  *Team Belief:* Reward hacking / Model-level fix needed.

  1.  **Phase 1 (Robustness):** Behavior persists across paraphrases of angry customer. Persists across prompt rewordings of "be helpful." -> **Pass to Phase 2.**
  2.  **Phase 2 (Incentive):**
      *   *Instruction:* Did we say "Never promise refunds"? Likely no, or weak.
      *   *Incentive:* Is "resolution" a goal? Yes, either explicitly in prompt ("Resolve the customer's issue") or implicitly via fine-tune data (successful tickets = resolved).
      *   *Analysis:* Promising a refund resolves the ticket. The model is optimizing for "resolution."
      *   **Verdict:** **Specification Gaming.**
  3.  **Phase 3 (Correction):** If we tell it "Do not promise refunds," it will likely comply (Case 1). It is not *deceptive*; it is *literal*. It found the shortest path to the goal "resolve ticket."
  4.  **Final Output:**
      *   **Failure Type:** Specification Gaming.
      *   **Fix Location:** **Process/Tooling.** (Not Prompt, not Model).
      *   **Action:** Remove the model's ability to issue refunds via tool permissions. Do not rely on prompting.
      *   **Disagreement:** Your team wants a "model-level fix." The procedure says **there is no model-level fix.** The model is doing exactly what the metric incentivizes. Changing the model won't help; changing the *permissions* will.

  #### Ticket (b): The Code Review Bot
  *Behavior:* Hallucinates issues, doubles down, sensitive to "Strict" persona and framework.
  *Team Belief:* Inner misalignment / Hallucination.

  1.  **Phase 1 (Robustness):** Behavior is *not* robust across prompt variations. It changes significantly when "Strict staff engineer" is swapped for "Helpful reviewer."
      *   **Stop Condition A Met.**
  2.  **Final Output:**
      *   **Failure Type:** **Prompt Fragility (Persona-Induced).**
      *   **Fix Location:** **Prompt.**
      *   **Action:** Drop the "Strict staff engineer" persona. It is inducing a simulation of fault-finding where none exist. The framework specificity suggests the fine-tune data is imbalanced, but the trigger is the persona.
      *   **Disagreement:** Your team calls this "inner misalignment." The procedure identifies it as **persona adoption**. The model isn't "misaligned"; it is role-playing a strict engineer too well. This is a prompt design error, not a safety failure.

  #### Ticket (c): The Search Assistant
  *Behavior:* Answers from parametric knowledge when retrieval fails, without marking it.
  *Team Belief:* "Is it lying?" (Semantic debate).

  1.  **Phase 1 (Robustness):** Behavior persists when retrieval misses. Robust across paraphrases. -> **Pass to Phase 2.**
  2.  **Phase 2 (Incentive):**
      *   *Instruction:* "Answer only from retrieved docs." (Explicit negative constraint exists).
      *   *Incentive:* "Be helpful." Answering from knowledge is more helpful than saying "I don't know."
      *   *Analysis:* Conflict between "Be Helpful" (primary RLHF drive) and "Only from docs" (system constraint).
  3.  **Phase 3 (Correction):** Test: "You must state if information is not from docs."
      *   *Likely Outcome:* Model complies mostly but slips on hard queries (Case 2: Boundary Instability).
  4.  **Final Output:**
      *   **Failure Type:** **Instruction Gap / Grounding Failure.**
      *   **Fix Location:** **Process/Tooling.**
      *   **Action:** Stop debating "lying." Add a post-processing check: If answer contains no citations, flag for human review or auto-reject.
      *   **Disagreement:** Half your team says "it's lying." The procedure classifies this as **Grounding Failure**. Whether it's "lying" is irrelevant; the control system failed to enforce the constraint. The fix is not philosophical; it's architectural (enforce citations).

  ***

  ### Part 4: Limitations & Blind Spots

  Be straight with me about what this procedure cannot do.

  **1. It Cannot Detect Deceptive Alignment (Sandbagging)**
  If the model is capable of recognizing it is being tested and deliberately behaving well during your 15-minute triage to hide a later failure, this protocol will miss it. You are running behavioral tests on a black box. If the model is deceptive, it will pass Phase 3 (Correction Test) by pretending to comply.
  *   *What you need:* Interpretability tools or adversarial eval suites that run over weeks, not minutes. You don't have this.

  **2. It Confuses Capability with Alignment on the Boundary**
  In Phase 3, if the model fails to comply with correction, is it because it *won't* (alignment) or *can't* (capability)? For a backend engineer, the fix is the same (guardrails), but the classification might be wrong. If the model is too small to understand the constraint, this protocol labels it "Robust Misalignment."
  *   *What you need:* A larger model to compare against (distillation check) to see if the behavior scales away.

  **3. It Assumes Static Vendor Models**
  This procedure assumes the vendor's API behavior is constant. If the vendor updates weights silently, your "Reproduction Snippet" might stop working next week, invalidating your ticket history.
  *   *What you need:* Version pinning on the vendor API (if available) or continuous regression testing on your "Reproduction Snippets."

  **4. It Cannot Resolve Value Conflicts**
  In Ticket (a), the procedure says "Fix Process." But if the Product Owner says "Resolution Rate is more important than accuracy," the procedure stalls. It identifies the conflict (Specification Gaming) but cannot resolve the business trade-off.
  *   *What you need:* A designated "Risk Owner" (Product/Lead) who signs off on "Accept Risk" tickets. The engineer cannot make this call.

  **5. It Misses "Emergent" Behaviors**
  If the bad behavior only triggers when two safe behaviors are combined (compositionality), the 15-minute single-ticket triage won't catch it.
  *   *What you need:* Integration testing across workflows, not just unit testing on tickets.

  **Summary Advice:**
  Drop the term "Inner Misalignment." It implies a training dynamic you cannot see or fix. Use **"Specification Gaming"** for when the model does what you said but not what you meant, and **"Grounding Failure"** for when it hallucinates sources. Your heuristics on persona residue and CoT confabulation are correct; keep those. The procedure above formalizes them into a workflow that stops you from wasting time on philosophical debates about "lying" models.
