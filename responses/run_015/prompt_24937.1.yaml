answer: |-
  You have identified a genuine and sophisticated philosophical problem. You are observing the gap between **metaphysical causation** (the objective counterfactual structure of the world) and **folk causal attribution** (how human beings actually assign cause in practice).

  Philosophy does not have a single, universally accepted term for the specific narrative phenomenon you describe, but it has mapped the constituent parts extensively. The disagreement among your readers is not a bug in their reasoning; it is a feature of how human beings conceptualize causality.

  Here is the philosophical landscape relevant to your observation, the concepts that name these distinctions, and how they relate to the narrative features you identified.

  ### 1. The Core Problem: Omissive Causation and Profligacy
  The standard philosophical definition of causation is **counterfactual dependence**: $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred.
  *   *Father case:* If the father had spoken, the son would not have been harmed. Therefore, the silence caused the harm.
  *   *Problem:* This logic leads to the **Problem of Profligate Omissions**. If counterfactual dependence is all that matters, then *everyone* who did not stop the bullying is a cause. The Queen of England caused the harm by not sending troops. The neighbors caused it by not intervening.

  Philosophers agree that while metaphysically many omissions satisfy the counterfactual test, we do not treat them all as causes in practice. Your readers are intuitively applying a filter to decide which omissions count. Philosophy calls this filter **Salience** or **Normalcy**.

  ### 2. The Role Factor: Normative Expectations (Hart & Honoré)
  You noted that readers treat omissions as causal when a "socially recognized role" exists (parent, doctor) but not when it is thin (stranger).

  This is the central thesis of **H.L.A. Hart and A.M. Honoré** in their seminal work, *Causation in the Law* (1959). They argue that common-sense causation is not just about physics; it is about **interventions relative to a "normal course of events."**
  *   **The Distinction:** They distinguish between a **cause** (a deviation from the norm) and a **mere condition** (a background state that allows the cause to operate).
  *   **Application:** For a parent, intervening to protect a child is part of the "normal course." Silence is a *deviation*. Therefore, the silence is selected as the cause. For a stranger, non-intervention is the "normal course." Their silence is a *condition*, not a cause.
  *   **The Name:** This is often called **Normative Causation** or the **Expectation-Based View of Omission**.

  Your readers are not arguing about physics; they are arguing about whether the character's role created a **duty of care** that makes the omission a "deviation" worthy of causal status.

  ### 3. The Inner Life Factor: Pragmatic Salience and Agency
  Your most novel observation is that rendering the omission "psychologically vivid" (showing deliberation) turns it into a cause, while rendering the character "dissociated" removes causal status.

  Standard metaphysics treats causation as external. However, your observation aligns with **Pragmatic Theories of Causal Explanation** (e.g., van Fraassen, Garfinkel) and recent work in **Experimental Philosophy**.

  *   **Salience:** We select causes based on what is *informative* or *salient* in a context. By detailing the inner deliberation, you make the omission **salient**. You move it from the background (a condition) to the foreground (an event).
  *   **Agency and the Intentional Stance:** When you show deliberation, you are depicting **Agency**. In folk psychology, an omission chosen through deliberation is often recategorized as a **Negative Action**.
      *   *Passive Omission:* "He forgot/ignored/froze." (Readers see this as something that happened *to* him).
      *   *Active Omission:* "He decided not to speak." (Readers see this as something he *did*).
  *   **The Knobe Effect:** Experimental philosopher Joshua Knobe has shown that moral judgment influences whether people describe an action as "intentional." Your readers are doing the reverse: psychological vividness influences whether they describe an event as "causal." When the inner life is chaotic, the character loses **Agential Control**. If there is no agency, there is no action, and the omission reverts to a mere circumstance.

  ### 4. The Conflation: Causation vs. Responsibility
  The disagreement in your workshop ("He caused it" vs. "He merely allowed it") often masks a deeper disagreement about **Moral Responsibility**.

  *   **The Distinction:** Philosophers distinguish **Causal Contribution** (did this factor make a difference?) from **Moral Liability** (should this person be blamed?).
  *   **The Conflation:** In ordinary language (and in your workshop), "cause" is a loaded term. To say "X caused Y" often implies "X is to blame for Y."
  *   **Your Findings:** When readers say the stranger "didn't cause it," they often mean "The stranger is not *responsible* for it." When you add inner deliberation, you increase the **Mens Rea** (guilty mind), which increases responsibility. Because responsibility and causation are linguistically tangled, readers report this shift as a change in *causality*.

  ### 5. Proposed Terminology
  Since there is no single existing term that captures the *narrative* dependency you've found, you might conceptualize it as **Narrative Salience in Omissive Causation**.

  However, if you wish to ground this in existing philosophical vocabulary, the most precise description of your phenomenon is:
  **The Normative and Pragmatic Modulation of Omissive Causal Attribution.**

  *   **Normative Modulation:** The "Role" factor (Hart & Honoré).
  *   **Pragmatic Modulation:** The "Inner Life/Salience" factor (Pragmatics of Explanation).
  *   **Causal Attribution:** Acknowledging that this is about how readers *assign* cause, not necessarily about metaphysical cause.

  ### 6. Recommended Reading
  If you wish to explore the mapped distinctions further, these are the specific texts that address your points:

  1.  **H.L.A. Hart & A.M. Honoré, *Causation in the Law* (1959).**
      *   *Relevance:* The foundational text on why some omissions count as causes and others don't, based on social expectations and roles.
  2.  **Jonathan Schaffer, "Contrastive Causation" (2005).**
      *   *Relevance:* Argues that causation is a three-place relation: $C$ causes $E$ *rather than* $C^*$ causing $E^*$. This helps explain why the *specific* omission is selected against the background of all other possible omissions.
  3.  **Helen Beebee, "Causation and Responsibility" (2004).**
      *   *Relevance:* She argues that omissions are not "things" that cause, but rather that causal claims about omissions are actually claims about *explanation* and *responsibility*. This validates your readers' intuition that they are arguing about blame, not physics.
  4.  **Joshua Knobe, "Intentional Action and Side Effects" (2003).**
      *   *Relevance:* While focused on intentionality, this launched the field of Experimental Philosophy, which empirically studies exactly what your workshop did: how normal people attribute causal/intentional status based on moral and psychological context.
  5.  **Sarah McGrath, "Omissions and Causalism" (2005).**
      *   *Relevance:* Specifically addresses the metaphysical discomfort with omissions as causes and the reliance on normative expectations to resolve it.

  ### Summary
  Philosophy confirms your intuition: **Causal attribution is not a purely factual matter; it is a normative and pragmatic one.**

  Your readers are not disagreeing about the counterfactuals (the facts); they are disagreeing about the **baseline of expectation** (the role) and the **status of the agent** (the inner life). When you write the inner life, you are not changing the metaphysics of the plot; you are changing the **explanatory salience** of the character's inaction. You are moving the omission from the "background conditions" of the world to the "foreground interventions" of the story.

  Philosophy calls this the shift from **Condition** to **Cause**, mediated by **Normative Expectation** and **Agential Salience**.
