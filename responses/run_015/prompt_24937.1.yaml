      *   **Question:** Does philosophy have a name/concept for this? If not, what would you call it, and how does it relate to existing distinctions?
      *   **Constraint:** Not asking for writing advice. Asking for philosophical categorization/analysis.

  2.  **Initial Philosophical Mapping:**
      *   *Core Topic:* Causation by Omission (Omissive Causation).
      *   *Standard View:* Counterfactual dependence (If X had acted, Y wouldn't have happened).
      *   *The User's Insight:* The *attribution* of causation varies based on normative and psychological factors, not just metaphysical ones.
      *   *Key Distinction:* Doing vs. Allowing (Acts vs. Omissions).
      *   *Key Distinction:* Moral Responsibility vs. Causal Contribution.
      *   *Key Distinction:* Metaphysical Causation vs. Pragmatic/Explanatory Causation.

  3.  **Identify Relevant Philosophical Concepts:**
      *   **Omissive Causation:** The general field. Hart & Honoré (*Causation in the Law*) are the classics here. They distinguish between "causes" and "conditions."
      *   **Normative Expectations:** The user notes "socially recognized roles." This aligns with the idea that omissions are causal *relative to a norm*. If you *ought* to do it, not doing it is a cause. If you have no duty, it's just a background condition.
      *   **Salience/Pragmatics:** Why do we pick *this* omission as the cause out of infinite possible omissions? (e.g., Why isn't the Queen of England causing the starvation by not sending food?). This is the "Problem of Profligate Omissions." Solutions often involve *pragmatic context* or *salience*.
      *   **Mens Rea / Intentionality:** The user notes "deliberateness." In law and ethics, intention matters for *responsibility*, but does it matter for *causation*? Philosophers usually separate them, but the user suggests readers conflate them.
      *   **Agency:** The "inner life" aspect. If the character feels like an agent making a choice, the omission feels like an act. This touches on *Theory of Mind* and *Folk Psychology*.

  4.  **Synthesize the "Gap":**
      *   Standard philosophy (metaphysics) tries to define causation objectively (counterfactuals, processes).
      *   The user is observing *folk attribution* of causation, which is heavily normative and psychological.
      *   There isn't one single term like "The Novelist's Paradox," but there is a rich debate around **Normative Causation**, **Pragmatic Causation**, and the **Acts/Omissions Doctrine**.
      *   Specifically, the work of **H.L.A. Hart and A.M. Honoré** is crucial here. They argue that causation in law (and common sense) isn't just physics; it's about *intervention* relative to *expectations*.
      *   Also, **Jonathan Schaffer** (contrastive causation) and **Helen Beebee** (causation as explanation) are relevant.
      *   The "inner life" aspect relates to **Agency** and **Intentional Stance** (Dennett).

  5.  **Drafting the Response:**

      *   **Acknowledge the Insight:** Validate that the user has hit on a genuine and sophisticated philosophical problem. It's not just a writing issue; it's a metaphysical/ethical puzzle.
      *   **Core Concept 1: Omissive Causation & The Problem of Profligacy.** Explain that philosophy recognizes infinite omissions could be causes. The problem is selecting *which one* counts.
      *   **Core Concept 2: Normative Expectations (Hart & Honoré).** This addresses the "role" aspect. Causation is often judged against a "normal course of events." A parent *should* act; a stranger *need not*. This makes the parent's omission a "deviation" (cause) and the stranger's a "condition" (non-cause).
      *   **Core Concept 3: Pragmatic vs. Metaphysical Causation.** Address the "inner life" aspect. Metaphysically, the counterfactual holds. Pragmatically, we assign causation based on what is *salient*. Psychological vividness increases salience.
      *   **Core Concept 4: Moral Responsibility vs. Causal Contribution.** Readers often conflate "Did he cause it?" with "Is he to blame?" The user's observation about deliberateness suggests readers are judging *agency*, which bleeds into their judgment of *causation*.
      *   **Proposed Terminology:** Since there isn't one single word, offer a synthesis. "Normatively-Loaded Omissive Causation" or "Pragmatic Salience in Omission."
      *   **Specific Philosophers/Texts:**
          *   Hart & Honoré (*Causation in the Law*) - Essential for the "role/expectation" point.
          *   Jonathan Schaffer - Contrastive causation.
          *   Helen Beebee - Causation as explanation.
          *   Sarah McGrath - Omissions and causation.
          *   Joshua Knobe - Experimental Philosophy (Knobe Effect) - relevant for how moral judgment affects intentionality/causation attribution.

  6.  **Refining the "Inner Life" Point:**
      *   This is the most novel part of the user's observation. Philosophy usually treats causation as external. The user says *internal depiction* changes causal attribution.
      *   This links to **Folk Psychology** and the **Intentional Stance**. If a character is depicted as an agent deliberating, readers treat the omission as a *choice* (an act of will), effectively re-categorizing the omission as a negative action.
      *   Connect this to the **Knobe Effect** (side-effect effect): Moral judgment influences whether we see something as intentional. The user is seeing the reverse/internal version: Psychological depth influences whether we see something as causal.

  7.  **Structure of the Answer:**
