      *   **Distinction:** Causation vs. Responsibility (and how readers conflate them).
      *   **Naming it:** Suggest "Normative Salience in Omissive Causation."
      *   **Reading List:** Specific papers/books.

  8.  **Self-Correction/Review during drafting:**
