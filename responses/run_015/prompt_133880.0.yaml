answer: |-
  Your hypothesis is astute: the stalemate persists because the participants are indeed answering different questions. However, diagnosing this merely as a confusion of *explananda* understates the depth of the impasse. The disagreement is not simply that one side asks "What is blame?" and the other "Who is blameworthy?" Rather, the conflict is **metanormative**: it concerns the direction of justification between moral obligations and the practices of holding responsible.

  The Strawsonian (Wallace-style) claim is constitutive: moral obligations are *constituted* by the demands implicit in our interpersonal relationships. To hold responsible is not to track an independent fact; it is to enact the relationship that makes the fact obtain. The Reasons-Responsiveness (R-R) claim is realist: moral obligations bind agents in virtue of their rational capacities, independent of whether anyone holds them to account. Holding responsible is a response to a pre-existing status.

  Your three cases illuminate this structural divergence rather than resolving it.

  In the **one-sided community**, the divergence is stark. For the R-R theorist, this population possesses responsible agency (attributability) because their mechanisms track reasons. They are proper objects of blame, even if no one blames them. For the Strawsonian, responsibility is essentially relational (accountability). Without other-directed reactive attitudes, there is no moral community, and thus no obligation in the strict sense. The dispute here is not empirical (could such a psychology exist?) but conceptual: does "responsibility" name a property of the agent or a status within a community?

  The **address without audience** case tests the communicative thesis. If blame is a demand for recognition (Strawson), blaming the dead is category mistake or a fictional extension of the practice. If blame is a judgment of agency (R-R), the audience is irrelevant. The fact that our practice splits here suggests that our ordinary concept of responsibility is polysemous, covering both judgment and sanction. The stalemate arises because each side selects one pole as the "real" responsibility and treats the other as derivative.

  The **calibration test** reveals that the empirical strand cannot be pulled apart from the normative. If resentment tracks harm rather than reasons-sensitivity, the R-R theorist calls this a debunking error: our practices are irrational. The Strawsonian replies that resentment reveals what we value; if it tracks harm, then harm is the relevant normative currency, not reasons-sensitivity. The empirical fact only gains traction once the metanormative priority is settled. If obligations are constituted by attitudes, the attitudes cannot be "mistaken" about their own object in the way the R-R theorist supposes.

  Therefore, the core disagreement doing the work is **the locus of normativity**. Is the normativity located in the *structure of the will* (R-R) or the *structure of the relationship* (Strawson)? This explains why objections are absorbed rather than answered. When the R-R theorist says, "You haven't defined the conditions of agency," the Strawsonian hears, "You haven't defined the conditions for a practice I don't think is fundamental." When the Strawsonian says, "You've psychologized a normative relation," the R-R theorist hears, "You've ignored the metaphysical precondition of the relation I think is fundamental."

  Can these strands be pulled apart? Only if the seminar abandons the search for a univocal theory of "moral responsibility." The term is currently doing too much work, covering attributability (is this action mine?), answerability (can I justify this?), and accountability (am I liable to sanction?). The stalemate persists because each side defends a necessary condition for one sense while claiming it is sufficient for the whole.

  **Progress for the seminar** lies in adopting a **Tripartite Distinction** (akin to the framework developed by Smith, Watson, and others). You should restructure the inquiry to treat Attributability, Answerability, and Accountability as distinct normative relations with different conditions.

  1.  **Attributability** asks if an action flows from the agent's deep self (addressing the R-R concern).
  2.  **Answerability** asks if the agent can provide reasons for the action (bridging the two).
  3.  **Accountability** asks if the agent is liable to the reactive attitudes of others (addressing the Strawsonian concern).

  Progress would not be a verdict on which is "true," but a mapping exercise. When a Strawsonian speaks, the seminar should ask: "Are you talking about Accountability?" When an R-R theorist speaks: "Are you talking about Attributability?" This dissolves the appearance of conflict by showing that the "rationalist" conditions are necessary for Attributability, while the "Strawsonian" conditions are necessary for Accountability. Neither is sufficient for the whole, because the whole is a disjunction of distinct practices.

  This shift changes the empirical question. Instead of asking if resentment is "calibrated" to responsibility simpliciter, you ask: "Is resentment calibrated to Accountability conditions?" This allows for the possibility that our attitudes are well-calibrated to relational norms but poorly calibrated to metaphysical freedom, or vice versa. It turns the "calibration test" from a debunking weapon into a diagnostic tool for mapping the boundaries between the three concepts.

  However, I must state plainly where this diagnosis is **contested**. Some hardline Strawsonians argue that splitting these concepts intellectualizes the phenomenon. They claim the participant stance is a unified whole; to dissect it is to lose the very normativity you seek to explain. They would argue that Attributability without Accountability is not a form of responsibility at all, but merely psychological attribution. Conversely, some libertarians or robust realists argue that Accountability without a specific metaphysical grounding (beyond reasons-responsiveness) is merely social pressure, not moral responsibility. They will resist the tripartite distinction as a verbal trick that avoids the hard metaphysical question of whether we *really* deserve blame.

  If your seminar members hold these hardline views, the tripartite distinction will not dissolve the conflict; it will merely relocate it to the question of which concept deserves the name "Responsibility." If that happens, the seminar should stop trying to solve the problem and instead document the **costs of each commitment**. Spend the hour analyzing what is lost if we adopt the Strawsonian view (e.g., the inability to blame the dead, the relativism of community standards) versus what is lost if we adopt the R-R view (e.g., the alienation of blame from emotional life, the difficulty of grounding the 'ought').

  In sum, the stalemate is not a failure of argument but a clash of metanormative priorities. Progress requires acknowledging that "moral responsibility" is not a natural kind waiting to be discovered, but a cluster of normative practices that can come apart. If you can persuade the room that they are defending different elements of the cluster, the "absorbed objections" will reveal themselves as orthogonal insights rather than contradictory claims. If you cannot, the seminar should pivot from theory-construction to ethical cost-benefit analysis, acknowledging that the choice between these frameworks is ultimately a choice about what kind of moral life we wish to lead.
