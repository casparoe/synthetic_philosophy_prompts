      *Actually, the strongest point:* Music is the *unconscious* history of the Will. A machine calculates. Calculation is the enemy of the unconscious intuition of the genius. Therefore, it is a mimicry. It is a parrot. A parrot can speak words, but it has no thought. This machine is a musical parrot.

