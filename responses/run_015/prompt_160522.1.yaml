          *   *Q: Can I feel angry?* A: Feelings are private, but expression is regulated.
          *   *Q: Who is exempt?* This is where the Strawson point comes in. Usually, objective stance is for those incapable. Here, everyone is treated as incapable *except* when they violate the policy.
          *   *Q: What about the CEO?* He wants thanks.

      *   **Sidebar (Pilot Study & Hierarchy):**
          *   Pilot study results: Productivity up, morale undefined (because morale is a participant concept).
          *   Hierarchy: Managers treat staff objectively. Staff treat managers... objectively? Or do managers expect participant stance from staff? This highlights the asymmetry/impossibility. Let's make it so managers treat staff objectively, but staff must treat the *policy* with participant reverence.

      *   **CEO Closing:**
          *   Needs to express gratitude (contradicting the policy) and threaten consequences (blame) for non-compliance.

      *   **Sanctioned Scripts Appendix (brief mention or integrated):**
          *   Instead of "You failed," say "Output variance detected."

  3.  **Refining the Philosophy/Humor:**
      *   *The Contradiction:* The memo itself is an act of holding people responsible. It says "You must not hold people responsible." If you don't comply, you are blamed.
      *   *The Gratitude:* Storing gratitude to be paid out later undermines the immediate interpersonal connection Strawson argues is essential.
      *   *The Scope:* Strawson says we can't live entirely in the objective stance. The company is trying to make it policy.
      *   *The Tone:* Must remain dry. No "As Strawson said..." No "Obviously this is crazy." Just corporate speak masking the absurdity.

