      *   **Subject:** P. F. Strawson's "Freedom and Resentment" (specifically the Participant vs. Objective stance).
      *   **Format:** Corporate internal communication (Announcement + FAQ + Sidebar + CEO Note).
      *   **Tone:** Deadpan corporate register (no winking, no explanatory frame).
      *   **Length:** Roughly 700 to 900 words.
      *   **Audience:** Mixed (philosophers who know Strawson, admins, other faculty). Needs to be funny for experts (philosophical accuracy) but legible for laypeople (corporate satire).
      *   **Key Philosophical Points to Embed (without naming Strawson):**
          *   Objective stance is usually for exceptions (children, impairments, ignorance, coercion).
          *   Adopting it universally destroys interpersonal relationships.
          *   The policy is self-defeating (mandatory adoption implies blame for non-compliance).
          *   Reactive attitudes are a package deal (can't keep gratitude without resentment).
          *   CEO still wants thanks (performative contradiction).
      *   **Specific Elements:**
          *   Company name (mid-sized freight).
          *   Program name: "The Objective Stance".
          *   Features: No blame/praise, scheduled reinforcement, formative-circumstance audits, Gratitude Deferral Account, mandatory training, sanctioned scripts.
          *   Sidebar: Pilot study, grades of staff adoption.
          *   Closing: CEO paragraph.

  2.  **Drafting - Section by Section:**

      *   **Header:** Needs to look like a memo.
