      *   *Decision:* To save the principle, we must lean hard into the "Relational Covenant" as a moral reality, not just a feeling. We must admit that *capacity* isn't the only metric; *relationship* creates duty.
      *   *The Sacrifice:* The user might have to concede that the "Mouse in Kitchen" verdict is the weakest link if we value life highly, OR that the "Cat/Bird" verdict is inconsistent. Actually, the prompt asks "does one have to go". The most vulnerable is the **Pig/Dog distinction** *if* defined solely by intelligence. But the principle saves it by defining it by *Covenant*.
      *   *Wait, looking closer:* The user says "I know pigs are at least as smart... Priya says I've just swallowed a culturally arbitrary taboo. I don't feel like I have."
      *   *My job:* Validate the intuition without validating the prejudice. The "Covenant" argument does this.
      *   *What must go?* Perhaps the **Mouse in Lab** vs **Chimp in Lab** is consistent, but **Mouse in Kitchen** vs **Roadkill Deer** is slightly tense. But the biggest tension is **Cat/Bird**. If birds have value (don't wring neck), why let cat kill them?
