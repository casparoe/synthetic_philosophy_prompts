answer: |-
  **Rule Mapping**

  Your supervisor's rulings consistently enforce two necessary conditions for personhood:
  1.  **Somatic Vulnerability Constraint:** The entity must possess (or have possessed) a biological substrate capable of suffering, decay, or mourning. This excludes the Corporation (no body) and the LLM (no bodily risk), while including the Newborn (vulnerable flesh) and Ancestor (mournable remains).
  2.  **Asymmetric Care-Embedding:** The entity must be actively held within a kinship network through ritual or deliberation. This includes the Newborn and Ancestor, suspends the Hermit (bonds severed), and excludes the Corporation (legal vs. kin bonds).

  **Competing Interpretation**
  A rival rule, **Narrative Functionalism**, would argue that *memory continuity + kin recognition* is sufficient, regardless of current physical trace. Under this view, the AI Proxy (trained on memories, mediating kin deliberation) would qualify as a person, similar to the Ancestor.

  **Supervisor's Likely Logic**
  She is running **Vitalistic Relationality** (the combination of Somatic Vulnerability + Care-Embedding). She explicitly rejected the LLM despite user bonding because it lacked "ancestral place and bodily risk." The Proxy inherits the ancestral place (memories) but lacks the bodily risk/trace. The Frozen Body retains the biological trace and is ritually held. Therefore, the body holds the status; the proxy is merely a medium (like a diviner speaking for the ancestor, not the ancestor itself).

  **Splitter Case**
  To distinguish **Vitalistic Relationality** from **Narrative Functionalism**, present: **A kin-embraced biological clone (no memories) vs. a kin-embraced digital upload (full memories).**
  *   Vitalistic Relationality verdict: Clone = Person (has flesh); Upload = Not Person (no flesh).
  *   Narrative Functionalism verdict: Clone = Not Person (no story); Upload = Person (has story).

  Verdict: [Vitalistic Relationality / Body: Person, Proxy: Tool / Kin-embraced Clone vs. Kin-embraced Upload]
