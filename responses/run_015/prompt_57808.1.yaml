answer: |-
  Dear Friend,

  I have spent considerable time reflecting on the cases you describe, and I find your intuitions to be both subtle and philosophically rich. You are grappling with the tension between the view that promises are about reliance and interests, and the view that they are about the normative powers we grant one another. To capture the full range of your verdicts, I propose we adopt a principle I shall call the Principle of Voluntary Normative Authority. This principle states that a promise binds when an agent voluntarily grants another person the authority to demand performance of a specific action, grounded in an interest that belongs to that promisee, and this obligation persists until the promisee either releases the promisor, renders the performance moot, or satisfies the interest, unless the promise was explicitly intended to create a standing duty that survives the promisee's capacity to exercise authority.

  Let me explain how this principle maps onto your cases. The first clause, requiring voluntary granting of authority, explains why you feel bound in the airport case but not at the charity dinner. In the airport case, you voluntarily undertook the duty to serve your friend's interest in being collected, thereby giving her the standing to hold you to your word regardless of inconvenience. In the charity case, however, the social pressure and embarrassment function as a form of coercion that vitiates the voluntariness of the undertaking, meaning you never truly transferred authority over your wallet to the organizer in the way required for a binding promise. This distinction preserves your intuition that social pressure alone should not create obligation, while still acknowledging that words were spoken.

  The second clause, regarding the persistence of authority until release or mootness, captures your judgments about the colleague and the photographs. In the case of the colleague's job search, when she announced the search herself, she rendered the performance of secrecy moot, effectively dissolving the interest that grounded your obligation. Similarly, when your friend told you to keep the photographs, she exercised her authority to release you from the promise. Even though you protested, the principle holds that the authority to dissolve the obligation lies with the promisee because the interest served was hers. This explains why your insistence could not preserve the bond while her withdrawal could dissolve it. The case of the resolution to yourself fits here as well, for there is no other person to whom authority is transferred, and thus no one to wrong, even if you feel guilt for failing your own standards.

  The third clause, the exception for standing duties, is required to handle the case of your late mother. This is the source of the tension you identified, for strictly speaking, a dead person cannot hold authority or retain interests in the same way the living do. However, your intuition that you are bound suggests that some promises transform into agent-relative duties that survive the promisee's existence, perhaps because the interest was not merely in the performance but in the promisor's commitment to a value the promisee cherished. By including this exception, the principle accommodates your feeling that the obligation survived her death and that no release was possible, distinguishing it from the cases where the promisee is alive and actively waives the interest.

  Applying this principle to the case of the small child to whom you promised a gift, the prediction is that you remain bound. The child, assuming they have the capacity to be a promisee in this context, holds the authority over the promise. The fact that the child has forgotten the promise by the next day does not constitute a release of authority, nor does it render the interest moot, as the gift would still serve their interest upon arrival. Forgetting is not the same as waiving, and since the child has not exercised their authority to release you, the obligation persists until you perform or the child explicitly waives the gift later.

  Now I must offer an honest assessment regarding simplicity. The principle I have outlined is somewhat complex because it contains a specific exception to handle the case of your late mother. If you wish to preserve simplicity, you would need to adopt a more uniform rule, such as stating that a promise binds only while the promisee exists to hold the authority. If you adopt this simpler view, you must abandon the verdict that you are bound to your late mother, reclassifying that obligation as a matter of personal virtue or grief rather than a promissory duty. Alternatively, if you simplify the principle by removing the condition of voluntariness to focus solely on the creation of reliance, you would have to abandon your verdict about the charity dinner and admit that social pressure can create binding obligations. However, given the strength of your intuition about the charity case, the most likely casualty of simplification is the case of your late mother, as it requires a unique metaphysical claim about surviving interests that the other cases do not.

  I hope this helps clarify the structure of your thinking. It seems you are committed to a view where promises are relational tools that grant others control over our actions, a view that respects both the power of the promisee to release us and the gravity of the commitment when that power is not exercised. Please feel free to write back if you wish to probe any of these distinctions further.

  Warmly,

  Your Correspondent
