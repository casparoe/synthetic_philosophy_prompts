      *   **Key Concept:** A board member's distinction: *Attributability* (outcome expresses judgment), *Answerability* (giving reasons), *Liability* (bearing cost). Claim: These can be closed independently.
      *   **Conflict:** Another member calls the current setup a "moral crumple zone" (keeping Operator of Record title is dishonest).
      *   **Task:** Draft a memo to the Board of Directors recommending *one* course of action with a dated implementation sequence.
