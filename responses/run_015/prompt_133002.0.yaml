answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Regional Transit Authority
  **FROM:** Chair, Safety and Accountability Review Board (SARB)
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Accountability Structure for Automated Shuttle Operations

  **1. PURPOSE AND RECOMMENDATION**

  Following the review of the August 14 incident involving Shuttle Fleet 4 and the broader fourteen-month safety record, the Safety and Accountability Review Board (SARB) recommends the immediate abolition of the "Operator of Record" title for automated shuttle fleet monitors.

  We recommend transitioning to an **Institutional Accountability Model**. Under this model, the Transit Authority accepts direct liability for all automated system contacts, funds a no-fault compensation scheme for affected parties, and mandates public post-incident explanation reports. The human monitor role will be reclassified as "System Safety Steward," with discipline capped at retraining absent willful protocol deviation.

  **2. INCIDENT CONTEXT AND SYSTEMIC FAILURE**

  The August 14 contact was not the result of human error. The fleet monitor adhered to protocol, which required two independent alerts to trigger an emergency stop; only one fired. The perception stack misclassified a pedestrian in high-visibility gear during heavy rain as a low-priority static object. While engineers can reproduce this error in simulation, they cannot explain the model's internal confidence weights. The vendor asserts the system performed within specification.

  We face a triad of accountability gaps, as framed by the Board's recent deliberations:
  *   **Attributability Gap:** The outcome reflects the AI's judgment, not the human monitor's.
  *   **Answerability Gap:** No individual (engineer, vendor, or monitor) can currently articulate *why* the model failed.
  *   **Liability Gap:** Costs currently fall on the victim or the individual employee, neither of whom controlled the risk.

  **3. EVALUATION OF OPTIONS**

  We considered two primary paths: retaining the Operator of Record with modified protections, or abolishing the title in favor of institutional accountability.

  *The Case for Retention (Losing Consideration)*
  The strongest argument for retaining the Operator of Record is the victims' interest in **attributability**. When harm occurs, there is a profound human and legal expectation that a specific individual can answer for the judgment that caused it. A human face provides psychological closure and a clear locus for grievance that an institution cannot match. Abolishing the role risks the perception that the Authority is insulating itself behind bureaucracy, leaving victims without a specific person to hold to account. We must acknowledge that for the family in the pending case, being told "the system decided" may feel like being told "no one decided," which can be experienced as a second injury.

  *The Case for Abolition (Recommended)*
  However, retaining the Operator of Record perpetuates a **moral crumple zone**. It requires a human to accept liability for outcomes they cannot foresee, understand, or prevent. In this specific architecture—where one monitor watches twelve vehicles and override protocols are gated by dual-alert logic—the human is not an operator but a passive observer. Maintaining the title is dishonest. It creates a false sense of security for the public and exposes employees to unjust discipline. By shifting to Institutional Accountability, we close the **liability gap** (the Authority bears the cost) and the **answerability gap** (the Authority must explain what it knows and admit what it does not). While we sacrifice individual attributability, we gain systemic honesty, which is the prerequisite for long-term public trust in automation.

  **4. IMPLEMENTATION SEQUENCE**

  Upon Board approval, the Authority will execute the following sequence:

  *   **T+30 Days (Policy & Legal):**
      *   Legal Counsel to draft amendments to employment agreements removing "Operator of Record" liability clauses.
      *   Risk Management to establish the No-Fault Compensation Fund, capitalized to cover medical and distress costs for pedestrian/bicycle contacts without requiring admission of negligence.
  *   **T+90 Days (Role Redefinition):**
      *   Human Resources to reclassify "Fleet Monitor" positions to "System Safety Steward."
      *   Update protocols to emphasize "System Intervention" rather than "Vehicle Operation."
      *   Implement the "Candid Explanation Report" template for incidents, requiring explicit statements on unexplained model behaviors.
  *   **T+180 Days (Vendor & Technical):**
      *   Renegotiate vendor contracts to require access to model confidence logs for post-incident review.
      *   Deploy updated monitoring dashboards that visualize system confidence levels to Stewards, reducing the "black box" opacity during shifts.
  *   **T+365 Days (Review):**
      *   SARB to publish an annual transparency report detailing all contacts, compensation paid, and status of technical explanations.

  **5. STAKEHOLDER COMMUNICATIONS**

  *   **To the Union:**
      *   *Message:* "This change protects your members. You are being asked to monitor systems, not drive vehicles. The Authority will assume the liability for system errors. Your job security remains, but your personal liability is removed. Discipline will be tied strictly to protocol adherence, not system outcomes."
      *   *Goal:* Secure agreement on role reclassification without triggering grievance procedures regarding job description changes.
  *   **To the Family (Pending Case):**
      *   *Message:* "We acknowledge the harm caused to your loved one. We are not contesting liability. We are offering immediate compensation through our new no-fault scheme, removing the need for protracted litigation. We cannot tell you exactly why the AI failed because we do not yet know, but we commit to funding the research to find out and sharing those findings with you directly."
      *   *Goal:* De-escalate litigation risk and demonstrate compassion without making false technical claims.

  **6. REVERSAL CRITERIA**

  This recommendation is contingent on the stability of the automated system. The SARB recommends reversing this decision and reinstating individual Operator liability if, over the next twelve months:

  1.  **Disengagement Spike:** Data shows a statistically significant increase in incidents correlated with Steward disengagement or inattention, suggesting the removal of personal liability has degraded vigilance.
  2.  **Legal Infeasibility:** State or federal regulators mandate a named human operator for insurance or licensing purposes that cannot be satisfied by institutional coverage.
  3.  **Explainability Breakthrough:** The vendor delivers a verified update that provides real-time, intelligible reasoning for object classification, restoring the human's ability to exercise meaningful judgment (closing the Attributability Gap).

  **7. ACTION REQUIRED**

  The Board is asked to vote on the adoption of the Institutional Accountability Model and the authorization of the No-Fault Compensation Fund by November 15, 2023.

  **Attachments:**
  *   Draft No-Fault Compensation Scheme Guidelines
  *   Revised Job Description: System Safety Steward
  *   SARB Incident Analysis Report (August 14)
