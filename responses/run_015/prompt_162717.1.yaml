answer: |-
  A community owes remembrance when it protects the vulnerable or honours the voiceless, but owes forgetting when memory punishes the redeemed, empowers the malicious, or violates the autonomous wishes of surviving victims.

  This principle accommodates most of your intuitions by distinguishing between memory as a shield and memory as a weapon. The clause regarding protecting the vulnerable covers the genocide case where descendants are still worse off, and the secret police files where transparency checks state power. The duty to honour the voiceless justifies remembering the atrocity recorded in killers' paperwork and the wrong against vanished people, where truth is the only remaining testament to their existence. The provision for empowering the malicious supports your verdict on the massacre site, where publicity fuels idolatry rather than justice. Similarly, the clause on punishing the redeemed explains why low-level informants under threat and the juvenile offender are owed forgetting; their memory serves retribution rather than safety. Finally, the stipulation regarding surviving victims' autonomy aligns with the descendants asking to stop defining themselves by the wrong.

  To make this principle coherent, however, you must overturn your verdict on the company that killed customers. Your intuition there conflicts with the autonomy clause established in the descendants case; if safety reforms are enacted and the victims' association asks for closure, permanent public remembrance becomes punitive rather than protective. You may keep a private archival record for safety audits, but the public duty to remember lapses when the living victims prioritise peace over posterity.

  Regarding the credit-scoring system, there is a duty to remember, but it is owed by the institution and regulators to the public rather than to specific individuals. Because the harm was structural and aggregate, remembrance serves to protect the vulnerable from future algorithmic bias, fitting the first clause of the principle, even if no single claimant demands it.

  One case you have not listed is that of a national hero found to have privately abused servants, with no public record until now. My principle suggests a duty to remember the abuse to honour the voiceless servants, even if it tarnishes the hero, provided this does not empower malicious actors to dismantle legitimate historical achievements unrelated to the abuse.

  The verdicts this principle cannot accommodate without adjustment are the AI reconstruction case and the company negligence case. The AI case rests on epistemic integrity rather than harm or autonomy; it fails the 'honour the voiceless' clause not because of harm, but because simulation is not testimony, which requires a supplementary caveat on truthfulness. The company case, as noted, requires you to abandon your insistence on permanent public shaming against victims' wishes.
