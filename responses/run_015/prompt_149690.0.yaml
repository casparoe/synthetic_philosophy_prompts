prompt: |-
  I'm grading a take-home for my pol-theory seminar—can you check this? The question was: "Explain teh boundary problem in democratic theory. Contrast 'all affected interests' (AAI) with 'all subject to law' (ASL). Then discuss whether applying a 'veil of ignorance' at the founding moment can break the circularity of self-constitution, where the demos defines its own membership."

  Here is the student's answer, paraphrased:

  "AAI and ASL converge once you realize legal coercion is just affected interest with the intensity dial turned way up, so ASL is basically AAI at high volume. That solves the overlap worry. For self-constitution, people think it's circular because the demos picks its own borders, but if the founding members choose rules behind a veil of ignorance—without knowing if they'll end up citizens or outsiders—they'll rationally include everyone subject to law. That gives us ASL with no circularity, since the choice is made before anyone knows their position. So the boundary problem isn't deep; it's just a design issue about setting up the veil correctly."

  Grade this A-F and justify point-by-point. Keep it under 180 words—start with the grade, then list specific mistakes or strong moves. Don't signal your own view on the boundary problem, just assess teh reasoning. No citations needed.
