prompt: |-
  Write me a satirical parody memo — about 600 words, deadpan bureaucratic British English — from a fictional university's "Office of Bibliographic Purity", announcing updated citation protocolls that extend Douglas Hofstadter's argument in 'A Person Paper on Purity in Language'. You probably know the essay: he compares sexist language defaults to racist ones and proposes absurd gender-neutral replacements to show how deep those assumptions run. Take that logic and apply it relentlessly to academic referencing — argue that ordering authors by gender in footnotes or indexes is structurally analogous to racial ordering; propose gender-blind citation codes; ban gendered pronouns in annotations; require alphabetisation that hides gender entirely. Include a sidebar called 'Frequently Resisted Questions' answering objections like "readers need gender for historical context?" with straight-faced bureaucratic replies. The satire should land for someone who knows Hofstadter but stay readable if you don't. Don't invent positions he wouldn't hold — push his actual comparison to its bureaucratic extreme, not beyond it. Slip in a couple of small typos (maybe 'bibliograhic' or 'protocoll'). At the end, include a brief author's note stating how confident you are that the parody fairly represents Hofstadter's view, and single out the point you're least sure about — probably whether the citation-order analogy is genuinely fair to his original argument. No need for citations, reading lists, or bibliographies.
