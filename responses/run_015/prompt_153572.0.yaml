      *   *Address the Diagnosis:* It's not about public vs. private. It's about the **Cognitive Theory of Emotion** vs. **Non-Cognitive/Perceptual Theory**. The stalemate is because Radford's setup presupposes a Cognitive Theory, but the phenomenology supports a Non-Cognitive one.
