answer: |-
  # Desiderata for an Adequate Theory of Biological Function

  The following specification outlines the necessary conditions any account of biological function must satisfy to be considered adequate for contemporary philosophy of biology. These requirements are derived from empirical constraints in synthetic biology, evolutionary genetics, evo-devo, and clinical medicine. They are not a survey of existing theories but the target criteria against which theories must be measured.

  ### 1. The Ahistorical Applicability Condition
  *   **Motivating Consideration:** The existence of synthetic organisms and *de novo* engineered traits (e.g., CRISPR-modified gene drives or xenobiological circuits) that possess clear functions despite lacking a selection history.
  *   **Specific Case:** A synthetic metabolic pathway inserted into *E. coli* to digest plastic. It has a function immediately upon successful operation, prior to any evolutionary history.
  *   **Requirement:** The theory must be able to ascribe functions to traits in organisms that lack deep evolutionary histories or where the trait is novel to the lineage.
  *   **Status:** **Non-negotiable** for general adequacy in the 21st century, though historically treated as a preference of Causal-Role camps.
  *   **Tension:** This stands in direct tension with **Desideratum 3 (Normativity without Intentionality)**. If normativity is grounded strictly in past selection (as per pure Etiological accounts), accommodating ahistorical traits forces a revision of the core etiological claim or requires a hybrid account that risks diluting the historical grounding of norms.

  ### 2. The Distinctness Condition (Function vs. Capacity)
  *   **Motivating Consideration:** Horizontally acquired genetic modules (e.g., antibiotic resistance plasmids) where a trait's causal contribution to the current system and its selection history may come apart.
  *   **Specific Case:** A gene acquired via horizontal transfer that currently stabilizes a membrane (causal role) but was selected for toxin production in the donor lineage.
  *   **Requirement:** The theory must distinguish between a trait's *function* and its mere *causal contribution* or capacity. Not everything a trait *does* is its *function*.
  *   **Status:** **Non-negotiable.** Without this, functional ascription collapses into total causal description.
  *   **Tension:** This creates friction with **Desideratum 1**. Ahistorical accounts (like pure Causal-Role) often struggle to filter *which* causal role counts as the function without appealing to history or context, risking an over-ascription of functions.

  ### 3. The Normativity without Intentionality Condition
  *   **Motivating Consideration:** Clinical diagnostics and synthetic-biology design contexts require a distinction between "working" and "working correctly" without invoking a divine or human designer's intention for natural traits.
  *   **Specific Case:** A heart pumping blood (function) vs. a heart pumping blood inefficiently due to valve stenosis (malfunction). The normativity must be intrinsic to the biology, not imposed by the physician's goal.
  *   **Requirement:** The theory must preserve the normative dimension of *proper function* (what the trait *ought* to do) without smuggling in intentional design or external teleology.
  *   **Status:** **Non-negotiable** for accounts claiming to explain "proper function" rather than mere "system capacity."
  *   **Tension:** This is the primary source of conflict with **Desideratum 1**. Securing normativity naturally usually requires history (Etiological); securing applicability to novel traits usually requires dropping history (Causal-Role). **These two desiderata are suspected to be jointly unsatisfiable** by a single, unified account without significant theoretical cost. Accommodating engineered biological systems undermines the etiological account's distinctive advantage (naturalized normativity).

  ### 4. The Exaptation and Redundancy Condition
  *   **Motivating Consideration:** Evolutionary-developmental findings on functional redundancy, pleiotropy, and the dissociation of selected effects from current utility.
  *   **Specific Case:** Feathers selected for insulation but currently functioning for flight (exaptation), or gene duplicates where one copy retains the original function and the other drifts or acquires a new one (redundancy).
  *   **Requirement:** The theory must account for traits that are functional now but were not selected *for* that current use, and must handle cases where multiple traits realize the same function without rendering the function ambiguous.
  *   **Status:** **Non-negotiable** for empirical consistency with modern evolutionary biology.
  *   **Tension:** This challenges strict **Etiological** accounts (which may deny the exapted trait has a function) and strict **Causal-Role** accounts (which may ascribe functions to both redundant traits indiscriminately, losing explanatory specificity).

  ### 5. The Malfunction Constraint
  *   **Motivating Consideration:** The need to explain pathology and failure in a way that does not collapse into statistical abnormality or mere causal failure.
  *   **Specific Case:** A sterile worker ant or a human with a congenital heart defect. Statistical abnormality is insufficient (some mutations are common but dysfunctional; some dysfunctions are rare but functional in specific contexts).
  *   **Requirement:** The theory must explain malfunction as a failure to perform a *proper function*, not merely a failure to cause an effect or a deviation from a statistical mean.
  *   **Status:** **Non-negotiable.** This is the hardest filter for naturalistic accounts.
  *   **Tension:** This heavily favors historical accounts but conflicts with **Desideratum 1** (Synthetic traits can malfunction before they have a history).

  ---

  ### Joint Unsatisfiability and the Primary Exclusionary Filter

  **The Critical Tension:** The pair of desiderata most likely to be jointly unsatisfiable is **Desideratum 1 (Ahistorical Applicability)** and **Desideratum 3 (Normativity without Intentionality)**.
  *   *Reasoning:* To secure normativity naturalistically, most robust theories rely on a historical selection process (the "etiological advantage"). To accommodate synthetic biology, the theory must allow function ascription prior to or independent of that history. Satisfying Desideratum 1 typically requires severing the link to history, which dissolves the ground for Desideratum 3. Satisfying Desideratum 3 typically requires binding function to history, which fails Desideratum 1.

  **The Single Exclusionary Requirement:**
  The requirement that does the most to exclude candidates is **Desideratum 5 (The Malfunction Constraint)**, closely tied to Desideratum 3.
  *   *Reasoning:* Many theories can explain what a trait *does* (capacity). Far fewer can explain what a trait *fails to do* when it is physically present and causally active in a non-standard way. Causal-Role accounts typically collapse malfunction into "failure to contribute to the containing system's capacity," which cannot distinguish between a broken heart and a heart removed from a body (both fail to circulate, but only the former malfunctions). Etiological accounts handle this better but are excluded by the Synthetic constraint. Thus, the demand for a naturalistic account of *error* is the narrowest bottleneck.

  ---

  ### Illustrative Evaluation of Standard Frameworks

  **The Etiological (Selected-Effects) Framework:**
  *   **Performance:** Excels at **Desideratum 3 (Normativity)** and **Desideratum 5 (Malfunction)** by grounding norms in historical success conditions. Fails **Desideratum 1 (Ahistorical)** regarding synthetic organisms unless modified (e.g., by appealing to the history of the *components* rather than the *trait*). Struggles with **Desideratum 4 (Exaptation)**, often forced to claim exapted traits lack proper functions until re-selected.
  *   **Verdict:** High conceptual rigor on norms, low empirical coverage on novel biology.

  **The Causal-Role (Systemic) Framework:**
  *   **Performance:** Excels at **Desideratum 1 (Ahistorical)** and **Desideratum 4 (Exaptation/Redundancy)** by focusing on current contribution to system capacity. Fails **Desideratum 3 (Normativity)** and **Desideratum 5 (Malfunction)** because it cannot distinguish between a trait doing what it *does* versus what it *should do* without referencing external goals or statistics.
  *   **Verdict:** High empirical coverage, low conceptual rigor on norms.

  **Conclusion for Seminar:** The adequacy of any proposed theory depends on whether it can resolve the tension between the **Ahistorical Applicability Condition** and the **Malfunction Constraint**. A theory that solves the synthetic biology problem but cannot explain pathology is insufficient; a theory that explains pathology but cannot accommodate engineered life is empirically obsolete.
