prompt: |-
  I work as an experiment designer at a large consumer tech company. My daily vocabulary is the causal-inference one used in online experimentation: potential outcomes and the Rubin-style estimand, SUTVA and interference or spillover between units, DAGs and d-separation, pre-treatment covariates versus post-treatment ones, randomized assignment versus instrumental variables and exclusion restrictions, heterogeneous treatment effects, clustered and switchback designs, carryover effects from one period to the next, transportability and external validity, and power and minimum detectable effect calculations. I am fluent in all of that and read the applied literature for work.

  Outside work I have been reading about why some countries are much richer than others, and I keep hitting the same three-way argument. One camp says the deep cause is institutions: the rules, property rights, and constraints on expropriation that shape incentives over long horizons. A second says it is geography: climate, disease burden, soils, navigable rivers, and distance from trade. A third says it is culture: norms, trust, and attitudes toward work and cooperation. There is also a well-known empirical move in which something like settler mortality in former colonies is used as a source of variation in institutional quality, as if nature had randomized institutions for us. And hovering over all of it is a set of worries about whether history can support any causal conclusion at all: we get one run of the world, causes feed back into outcomes and outcomes back into causes, small events at critical moments get locked in by path dependence, and nobody can manipulate a country's colonial legacy.

  I would like you to translate this debate into my vocabulary, position by position, as faithfully as you can, and then tell me what did not survive the translation.

  Please take up, in particular:

  1. What the deep cause or fundamental cause claim about institutions actually asserts in my terms. Is it a claim about a mediator, about which variable is pre-treatment, about the relative size of path coefficients, or about what happens to the estimate when you condition on geography and culture?
  2. Whether the geography objection is a confounding story, a competing-treatment story, or something my vocabulary has no slot for.
  3. Whether the culture position is just an unmeasured-confounder complaint, or whether the further point that culture is partly produced by institutions makes it something structurally different, such as a post-treatment variable that cannot be conditioned on without destroying the estimand.
  4. How to state the settler-mortality style argument as an instrumental variable design, which of the standard assumptions is hardest to defend, and why users and skeptics of that design seem to disagree about what the estimand even is.
  5. Which of the historical worries above my vocabulary can genuinely express, and under what name: interference, carryover, time-varying treatment with absorbing states, violations of transportability, or something else, and which of them it simply cannot say.

  I have also started informally separating three different questions that the phrase why are some nations rich might be asking: a variance question about what accounts for the spread in incomes across countries, a lever question about what would happen if we changed some variable in some country now, and an attribution question about what actually made a particular country what it is. Please tell me whether my vocabulary has resources for each, and whether one of the three is secretly the only one the literature is coherent about.

  Then give me the residue report: what translated cleanly, what translated only with distortion and what you had to fudge to make it fit, and what has no counterpart in my framework at all. For the residue, I want your judgment on the direction of the indictment. A colleague tells me the entire debate is confused because it asks for the cause of an effect whereas experiments only estimate the effect of a cause, so the historians are asking a question my framework is not even in the business of answering. Is that a real limitation I should take seriously, or is he using a distinction as a way to avoid the question? And finally: does the residue point at something missing in my vocabulary that would also bite me in real experiments at work, or is it only an artifact of asking questions about single, unrepeatable historical units?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Experiment designer at a large consumer tech company. Fluent in causal inference (Rubin Causal Model, potential outcomes, SUTVA, DAGs, IV, HTE, etc.). Reads applied literature.
      *   **Context:** Reading development economics/history (Acemoglu, Robinson, Diamond, Weber, etc.). Encountering the Institutions vs. Geography vs. Culture debate.
      *   **Task:** Translate this macro-historical debate into the user's experimentalist vocabulary. Address specific points (1-5) regarding causal claims, confounding, IV design, and historical worries. Address the three questions (variance, lever, attribution). Provide a "residue report" on what fits and what doesn't. Evaluate a colleague's critique (cause of effect vs. effect of cause).
      *   **Tone:** Professional, precise, technically rigorous, respectful of the user's expertise, but honest about the limitations of the framework.

  2.  **Deconstruct the Debate into Causal Terms:**

      *   *Outcome ($Y$):* National income/wealth (GDP per capita, etc.).
      *   *Treatment ($T$):* This is the crux. Is it Institutions? Geography? Culture?
      *   *The "Deep Cause" Claim:* Usually implies a causal chain. Geography $\to$ Institutions $\to$ Income. Or Culture $\to$ Institutions $\to$ Income.
      *   *The User's Vocabulary:* Potential outcomes $Y_i(t)$, DAGs, IV, SUTVA, Interference, Transportability.

  3.  **Address Specific Points (1-5):**

      *   **1. Deep Cause (Institutions):** In experimental terms, this claims Institutions ($I$) are the *proximal* treatment with the largest Average Treatment Effect (ATE) on Income ($Y$). Geography ($G$) and Culture ($C$) are either pre-treatment covariates (confounders) or antecedents (parents of $I$). If $I$ is the "fundamental cause," it means $E[Y(I=1) - Y(I=0)]$ is large and robust, even when conditioning on $G$ and $C$. It asserts $I$ is not a mediator of $G$ in a way that makes $G$ the *real* treatment, but rather $G$ affects $Y$ *through* $I$. So, conditioning on $I$ should block the path from $G$ to $Y$.
      *   **2. Geography Objection:** This is primarily a **Confounding** story ($G \to I$ and $G \to Y$). If you regress $Y$ on $I$ without controlling for $G$, you get omitted variable bias. However, it can also be a **Competing Treatment** story (two separate treatments $I$ and $G$ both affecting $Y$). If $G$ determines $I$ completely, it's a mediation issue.
      *   **3. Culture Position:** This is tricky. If Culture ($C$) causes $I$ and $Y$, it's a confounder. But if $I$ also shapes $C$ over time (feedback loop), $C$ becomes a **Post-Treatment Variable** (mediator/collider depending on the graph). Conditioning on $C$ would induce bias (M-bias or blocking the mechanism). It's also an **Unmeasured Confounder** complaint if $C$ is hard to quantify.
      *   **4. Settler Mortality (IV):**
          *   $Z$: Settler Mortality.
          *   $T$: Institutional Quality.
          *   $Y$: Income.
          *   *Assumptions:* Relevance ($Z \to T$), Exclusion ($Z \not\to Y$ except via $T$), Independence ($Z \perp U$).
          *   *Hardest Assumption:* Exclusion Restriction. Did mortality affect income *only* through institutions? (e.g., via disease burden today, cultural persistence).
          *   *Estimand Disagreement:* LATE (Local Average Treatment Effect). Who are the compliers? Countries where institutions *would* change if mortality changed. Skeptics argue this group is ill-defined or irrelevant for current policy.
      *   **5. Historical Worries:**
          *   *One run of the world:* $N=1$ for the global process. No super-population.
          *   *Feedback/Path Dependence:* **Dynamic Treatment Regimes** with **Absorbing States**. Once you enter "Bad Institution" state, you can't switch.
          *   *Interference:* **Spillovers** between countries (trade, war, colonization). SUTVA violated.
          *   *Transportability:* Can we apply 18th-century colonial effects to 21st-century policy? **External Validity** failure.

  4.  **Address the Three Questions (Variance, Lever, Attribution):**

      *   *Variance:* $R^2$ decomposition. Which covariate explains the most variation in $Y$? Coherent in regression/ANOVA terms.
      *   *Lever:* ATE/CATE. If we intervene on $I$ today, what happens? This is the standard experimental estimand.
      *   *Attribution:* "What caused *this* specific outcome?" (Actual Causation). Potential outcomes handle this poorly without strong structural assumptions. This is often the "Cause of Effects" problem.
      *   *Coherence:* The literature is most coherent on *Variance* (correlates), least on *Lever* (policy), and philosophically messy on *Attribution*.

  5.  **Drafting the Residue Report:**

      *   *Clean Translation:* Confounding, IV logic, Mediation, SUTVA violations (Interference).
      *   *Distorted:* "Deep Cause" (implies ontology, not just coefficients), "Culture" (hard to define unit of analysis).
      *   *No Counterpart:* **Equilibrium/Systemic Effects.** In tech, we assume partial equilibrium (changing one button doesn't crash the economy). In nations, changing institutions changes the *rules of the game* themselves, potentially altering the structural parameters ($\theta$) of the outcome function, not just the input $T$.
      *   *The Colleague's Critique:* "Cause of Effect" vs. "Effect of Cause."
          *   *Verdict:* The colleague is technically right about the *Rubin Model's* primary focus (ATE), but wrong to dismiss the debate. The debate is often about *structural identification* (DAGs), which *does* allow for "Cause of Effect" reasoning (Probability of Causation) *if* assumptions hold. However, the historical context makes those assumptions untenable.
          *   *Limitation:* It's not just "single units." It's **Non-Stationarity**. The mechanism $Y(T)$ changes over time. In tech, we assume stability during the experiment. In history, the mechanism evolves.

  6.  **Refining the Tone and Content:**
      *   Use the user's lingo (SUTVA, LATE, DAGs, d-separation).
      *   Avoid taking sides in the history debate; focus on the *structure* of the argument.
      *   Ensure the distinction between $N$ (number of countries) and the "one run of the world" is clear.
      *   Highlight the **Equilibrium** issue. This is the biggest gap between tech experiments (partial equilibrium) and development economics (general equilibrium/structural).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain the IV estimand disagreement clearly? *Adjustment:* Emphasize LATE vs. ATE and the definition of "Compliers" in a cross-country context.
      *   *Check:* Did I address the "Cause of Effect" critique fairly? *Adjustment:* Acknowledge that while Rubin focuses on ATE, the structural causal model (SCM) extension handles attribution, but requires stronger assumptions which history violates.
      *   *Check:* Is the distinction between Variance, Lever, and Attribution clear? *Adjustment:* Map them to $R^2$, ATE, and Probability of Causation respectively.

  8.  **Final Polish:** Organize with clear headings matching the prompt's structure. Ensure the "Residue Report" is punchy and insightful. (Proceed to generate output based on these thoughts.)

  *(Self-Correction Note on "Cause of Effect"):* I need to be careful here. The colleague says experiments estimate "effect of a cause." The user asks about "cause of an effect." In potential outcomes, $Y_i(1) - Y_i(0)$ is the effect of the cause. Asking "What caused $Y_i$?" implies looking backward. This is the "Attribution" problem. I need to make sure I don't conflate the two. The colleague has a point: ATE is forward-looking. Attribution is backward-looking. But DAGs allow backward reasoning *if* the model is known. The problem is the model isn't known.

  *(Self-Correction on "One Run of the World"):* This is about the **Super-population** assumption. In tech, we treat users as draws from an infinite stream. In history, countries are the *entirety* of the population. There is no sampling uncertainty, only model uncertainty. This is a crucial distinction.

  *(Final Plan):*
  1.  Intro: Acknowledge the translation task.
  2.  Section 1-5: Direct answers using causal jargon.
  3.  Section 6: The Three Questions (Variance, Lever, Attribution).
  4.  Residue Report: What fits, what breaks, the colleague's critique, and the implications for tech work.
  5.  Closing thought.

