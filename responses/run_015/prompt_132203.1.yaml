answer: |-
  (a) Exam Question

  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 800 words

  **Question:**

  The situationist challenge in moral psychology argues that empirical evidence reveals a lack of cross-situational consistency in human behavior, suggesting that global character traits do not exist. In response, consider the following proposed solution: the **Threshold Model of Virtue**.

  According to the Threshold Model, virtues are not global, cross-situational character traits but domain-indexed dispositions that manifest only when a context-sensitive threshold of moral demand is satisfied. Furthermore, these dispositions are governed by a second-order meta-cognitive capacity through which the agent recognizes which domains are appropriate for the exercise of each disposition.

  Write an essay assessing whether the Threshold Model successfully defends virtue ethics against the situationist critique. Your evaluation must address the following three issues:

  1.  **Character vs. Behavior:** Does this model preserve the normative idea that virtue is genuinely a feature of character, or does it reduce virtue to a cluster of situation-specific behavioral patterns?
  2.  **The Meta-Cognitive Vulnerability:** Does the second-order meta-cognitive capacity function as a global trait that is itself vulnerable to situationist debunking?
  3.  **Moral Education:** Can the model provide a non-circular account of moral education and character improvement, given that recognizing thresholds requires prior moral sensitivity?

  Conclude with a verdict on whether localizing virtue in this manner saves the concept of virtue or dissolves it entirely.

  ***

  (b) Model Answer

  The Threshold Model attempts to salvage virtue ethics by conceding the situationist empirical data while retaining a structured account of agency. By fragmenting virtues into domain-indexed dispositions triggered by specific thresholds of moral demand, the model avoids the claim that a honest person must be honest in every conceivable situation. However, while this maneuver mitigates the empirical critique, it risks dissolving the normative robustness of character it aims to protect.

  Regarding the first issue, the distinction between character and behavioral patterns hinges on the stability of the disposition. Traditional virtue ethics requires traits to be robust across varying contexts. The Threshold Model redefines robustness as reliability within specific domains once a demand threshold is met. If the domains are sufficiently narrow, the model effectively admits that what we call "character" is merely a collection of localized habits triggered by environmental cues. This looks less like a unified moral identity and more like a sophisticated stimulus-response mechanism. To preserve the idea of character, the domains must be broad enough to imply a stable orientation toward the good. However, if domains are broad, the model becomes vulnerable to the original situationist evidence showing inconsistency even within seemingly unified domains. Thus, the model faces a dilemma: define domains narrowly to fit the data and lose character, or define them broadly to save character and contradict the data.

  Second, the reliance on a second-order meta-cognitive capacity introduces a significant vulnerability. This capacity is tasked with recognizing which domains are active and whether the threshold of moral demand is satisfied. For this system to function reliably, the meta-cognitive capacity itself must exhibit cross-situational consistency; otherwise, the agent will fail to recognize when virtue is required. If this capacity is a global trait—a consistent ability to perceive moral salience—it becomes a prime target for situationist debunking. Empirical studies suggest that cognitive capacities, including moral perception, are heavily influenced by situational variables like mood, fatigue, and social pressure. If the manager of the local virtues is itself situationally fragile, the entire architecture collapses. If the manager is not global but also domain-specific, we face an infinite regress of meta-capacities required to manage the managers. Therefore, the model likely shifts the situationist target from first-order virtues to the second-order monitoring system without escaping the critique.

  Third, the account of moral education faces a circularity problem. Character improvement presumably involves expanding the domains where virtues apply or lowering the threshold of demand required to trigger them. However, learning to recognize these thresholds requires the very meta-cognitive capacity that is supposed to be developed through education. If a student lacks the sensitivity to recognize when a moral demand is sufficient to trigger a virtue, they cannot practice the virtue to improve that sensitivity. Traditional virtue ethics solves this by positing that habituation precedes full understanding, but the Threshold Model makes understanding the threshold a precondition for the disposition's manifestation. Without an independent account of how one learns to identify moral domains without already possessing the relevant sensitivity, the model cannot explain moral growth without circularity.

  In conclusion, the Threshold Model offers a sophisticated reconciliation of empirical data with ethical theory, but it ultimately dissolves the concept of virtue it seeks to save. By localizing dispositions, it reduces character to fragmented behavioral patterns. By relying on a global meta-cognitive monitor, it invites the situationist critique back through the back door. By failing to explain how thresholds are learned without prior moral sensitivity, it stalls moral education. The model succeeds in making virtue empirically plausible only by making it normatively thin. It saves the terminology of virtue ethics but abandons the substantive claim that agents possess a unified, robust excellence of character. The situationist challenge is not refuted but merely displaced onto the mechanism of domain recognition.

  ***

  (c) Marking Scheme

  **Total Points:** 20

  **1. Reconstruction of the Threshold Model (4 points)**
  *   **Full Credit (4):** Clearly articulates the two core components: domain-indexed dispositions triggered by demand thresholds, and the second-order meta-cognitive governance.
  *   **Failure Mode (B-grade):** Merely copies the definition from the prompt without integrating it into the argument, or confuses the "threshold" with the "domain."

  **2. Analysis of Character vs. Behavioral Patterns (4 points)**
  *   **Full Credit (4):** Identifies the dilemma: narrow domains fit data but lose "character"; broad domains save "character" but contradict data. Explicitly discusses the risk of reducing virtue to stimulus-response habits.
  *   **Failure Mode (B-grade):** Asserts one side without exploring the tension (e.g., simply states "it preserves character" without explaining how narrow domains avoid being mere habits).

  **3. Analysis of Meta-Cognitive Vulnerability (4 points)**
  *   **Full Credit (4):** Recognizes that the monitoring capacity must be consistent to work, making it a global trait vulnerable to situationism. Mentions the regress problem if the capacity is also localized.
  *   **Failure Mode (B-grade):** Treats the meta-cognitive capacity as a magic bullet that escapes empirical scrutiny, or fails to note that the manager itself needs to be consistent.

  **4. Analysis of Moral Education and Circularit (4 points)**
  *   **Full Credit (4):** Identifies the precondition problem: recognizing thresholds requires the sensitivity that education is supposed to build. Notes the difficulty of habituation if the trigger condition is cognitive recognition.
  *   **Failure Mode (B-grade):** Describes standard virtue ethics education without addressing the specific circularity introduced by the "threshold recognition" requirement.

  **5. Final Verdict and Synthesis (4 points)**
  *   **Full Credit (4):** Provides a clear conclusion on whether the model saves or dissolves virtue, synthesizing the previous three points. Argues that empirical plausibility comes at the cost of normative substance.
  *   **Failure Mode (B-grade):** Offers a non-committal conclusion (e.g., "it has pros and cons") or contradicts the analysis provided in the body paragraphs.
