      *   *Verdict:* The conclusion follows, but needs the "performative" bridge. The recent ICS decision (March 2024) actually ratifies the user's argument (they rejected the formal epoch, keeping it as an informal event/concept).

  5.  **Evaluate Stratigraphic Accuracy:**
