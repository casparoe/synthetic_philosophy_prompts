      *   *Weaknesses/Risks:* "Jurisdiction" implies a legal sovereign. Geology isn't law. The ICS doesn't have enforcement power; it has *nominative* authority. If the metaphor is pushed too hard, it sounds like conspiracy theory (e.g., "UNECE for rocks").
      *   *Verdict:* It's a strong heuristic, but needs nuance. It's not about *legal* jurisdiction but *epistemic* authority and the performative power of naming. The feedback should encourage shifting from "jurisdiction" (legal) to "competence" or "authority" (sociological/epistemic), while keeping the legal *flavor* because it serves the argument about governance.

  3.  **Evaluate the Three Dates as Theories of Agency:**
