      *   Line 2 (Metaphysics) is parallel/upstream. If uncertainty is ontological, Line 1 needs to reflect that.

      *Let's structure the advice.*
      1.  Introduction (Validating the topic).
      2.  Ranking 1-3.
      3.  The Trap.
      4.  Upstream/Downstream map.
      5.  Confidence & Wildcards.

      *Specific Literature Check:*
      *   Rod O'Donnell (Keynes scholar).
