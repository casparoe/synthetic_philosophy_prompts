answer: |-
  1. **Order:** Board: Symbols, Rules, Derivation. Define "Consistent" = "Cannot derive $P$ and $\neg P$." Break "Axiom = Truth" immediately. Axioms are moves, not facts. Without this, "inconsistent" means "false," not "broken." They need "Formal System" before "Consistency."

  2. **Example:** "Tile Game." Rules: 1. Start $\bullet$. 2. $\bullet \to \bullet\circ$. 3. $\circ\bullet \to \text{Empty}$. 4. $\text{Empty} \to \text{Forbidden}$. Derive Forbidden. Must be syntactic; no semantics. Avoid self-reference; let contradiction emerge structurally. If tiles have meaning, they'll check arithmetic, not logic. It must look harmless individually.

  3. **Misconceptions:**
     - *Gödel:* Address early. Gödel assumes consistency. He doesn't predict inconsistency.
     - *Discovery:* Derivations are long; absence of evidence isn't evidence of absence.
     - *Locality:* Explain Explosion ($P \land \neg P \vdash \text{Anything}$). Contradiction trivializes the system, not just one theorem. Head this off before discussing "fixing" axioms.
     - *Bridges:* Engineering uses models, not raw set theory.

  4. **Which Axiom:** Before finale. It's pragmatic. Logic breaks; humans choose what to save.

  5. **Finale:** Friend is right. A consistent theory can prove "I am inconsistent" (e.g., $PA + \neg \text{Con}(PA)$). Use this to separate Consistency (syntax) from Truth (semantics). Place last. It cements the syntax/semantics split.

  6. **Refusals:** "I won't prove Explosion or encode syntax into numbers."

  7. **Question:** "If ZFC proved $1=2$, would your code break? Why?"
