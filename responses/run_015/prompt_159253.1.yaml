answer: |-
  1. **Question:** You teach that the lie resides in the double heart: holding one thing in the mind while signifying another to the neighbor. If I write a letter stating a falsehood, seal it, and bury it in the earth where no eye shall read it, have I sinned? For there is a false signification, yet no neighbor is present to be deceived.

     **Likely Answer:** Augustine would likely say this is not a lie, or at least not a perfect lie, because the will to deceive a neighbor is absent. The sin of lying requires the intention to lead another mind into error; a letter buried unread lacks the social act of signification toward a hearer.

     **Follow-up:** If the sin requires a neighbor to deceive, then the completeness of the lie depends on the existence of a hearer. Does this not make the wrong partly about the relationship between speaker and hearer, rather than solely a wound within the speaker's soul?

     **Scholarly Flag:** Consensus holds that Augustine requires a will to deceive, but specialists dispute whether a completed act of signification without a actual hearer counts as a sin of lying or merely a disposition to lie.

  2. **Question:** Consider a jest written on a tablet, where no tone of voice marks it as play. If the reader takes it seriously and is deceived, have I lied? You set jokes aside from lies, but is that exemption keyed to my will not to deceive, or to the convention that allows the reader to know it is a joke?

     **Likely Answer:** He will insist the exemption rests entirely on the speaker's will: the jester does not intend the hearer to believe the falsehood. The deception of the reader is an accident of their misunderstanding, not a lie on the part of the writer.

     **Follow-up:** But if the reader cannot discern the jest from the truth because the written sign lacks the marker of play, how can you prove the will was not to deceive? Does the hearer's recognition not become the only evidence of what your will intended?

     **Scholarly Flag:** It is well established that Augustine excludes jokes from lying, but disputed whether this exclusion relies purely on internal will or implicitly on shared communicative conventions recognizable by the hearer.

  3. **Question:** Jacob wore goat skins to feel like his brother Esau, and his father was deceived by the touch. Is this disguise a lie? If a lie is a false signification, does a gesture or a garment signify truth or falsehood, or is this privilege reserved for words alone?

     **Likely Answer:** Augustine generally accepts that actions can be signs. If the disguise is employed with the will to deceive the father about the son's identity, it partakes in the nature of a lie, for it is a false signification made with the will to deceive.

     **Follow-up:** If a garment can lie, then any appearance staged to mislead is a lie. Does this not mean that hiding oneself entirely—making no sign at all—is the only way to avoid lying when one cannot speak the truth?

     **Scholarly Flag:** Consensus confirms Augustine views actions as signs, but specialists dispute how far he extends this to non-linguistic deception like disguises or staged scenes in *De Mendacio*.

  4. **Question:** An unjust judge asks me where a fugitive hides. I answer, "I do not know," meaning "I will not tell." Is this ambiguity a lie? For the words sound like ignorance, but the mind holds knowledge.

     **Likely Answer:** He would argue this is permissible if the ambiguity is intended to withhold truth from one who has no right to it, without asserting a falsehood. The speaker signifies what is true in some sense (I do not know *to tell you*), preserving the integrity of the sign.

     **Follow-up:** You distinguish this from a lie because the mind holds something true that matches the words. But if the judge understands "I do not know" as "I am ignorant," and I will that he understand it so, am I not still willing his deception while hiding behind a technical truth?

     **Scholarly Flag:** Well established that Augustine permits ambiguity to withhold truth, but disputed whether this relies on the speaker's private reservation or the objective capacity of the words to bear a true meaning.

  5. **Question:** If I refuse to answer the unjust judge, I withhold the truth. If I answer with ambiguity, I veil it. If I answer with a falsehood, I corrupt the sign. Is the difference between withholding and lying merely a difference in the sign used, or is the hearer's claim upon the truth different in each case?

     **Likely Answer:** Augustine will say the difference is in the speaker's act: withholding is silence, lying is false assertion. The hearer's claim is secondary; the primary sin is the corruption of the signification itself, which violates the order of charity.

     **Follow-up:** Yet you permit withholding from the unjust judge but forbid lying to him. If the sin is only the speaker's corrupted will, why does the justice of the hearer determine which corruption is permitted?

     **Scholarly Flag:** Consensus holds Augustine distinguishes withholding from lying, but specialists dispute whether this distinction implies the hearer's moral status limits their claim to truth.

  6. **Question:** Suppose a grieving father begs me to tell him his dead son lives, for he cannot bear the truth. He knows I might be soothing him, yet he wills to be deceived. If I speak the falsehood to comfort him, is the sin lessened because the hearer consents to the deception?

     **Likely Answer:** He will maintain it is still a sin. The father's desire does not license the speaker to corrupt the sign. The wound is in the speaker's division of heart, regardless of whether the hearer welcomes the falsehood.

     **Follow-up:** If the hearer's consent does not cure the lie, then the wrong is indeed one-place, residing in the speaker. But if the wrong is only in the speaker, why does the harm done to the neighbor matter when you rank the gravity of different lies?

     **Scholarly Flag:** Well established that Augustine forbids officious lies even for comfort, but disputed whether the hearer's desire or vulnerability affects the moral weight of the sin.

  7. **Question:** You say we must not lie to persecutors who seek to destroy us. They have no claim to charity, yet they have a claim to truth. What grounds this claim? Is it that their souls are harmed by our falsehood, or that our souls are harmed by the act of lying to them?

     **Likely Answer:** Augustine will emphasize the harm to the speaker's soul and the violation of God's order. However, he also suggests that lying destroys the trust necessary for human society, implying a wrong done to the neighbor's capacity for communion.

     **Follow-up:** If the persecutor's unworthiness does not remove his claim to truth, then the claim belongs to him as a rational soul, not as a friend. Does this not mean the prohibition on lying is binding precisely because the hearer has a standing claim, regardless of his virtue?

     **Scholarly Flag:** Highly disputed among specialists; some argue Augustine implies a right to truth, while others insist his prohibition is entirely agent-centered regarding the speaker's sin.

  8. **Question:** You rank lies in eight degrees, from those in religious doctrine to those in jest. Does a lie that saves a life rank lower because the harm prevented is great, or because the motive is charity? If the saved life is lost anyway, does the lie become heavier?

     **Likely Answer:** He would say the gravity tracks the motive and the violation of holy things, not merely the outcome. A lie told for charity is lighter than one told for malice, but still a sin. The outcome does not justify the act, though it may mitigate the guilt.

     **Follow-up:** If the outcome does not justify the act, why does the harm to the neighbor enter your calculation of the lie's degree at all? Is the harm a measure of the sin, or merely a consequence that accompanies it?

     **Scholarly Flag:** Consensus confirms Augustine grades lies, but specialists dispute whether the grading criteria are based on the speaker's motive, the object of the lie, or the consequent harm to the neighbor.

  9. **Question:** If the persecutor demands a confession of faith, and silence is taken as denial, must you speak the truth and die? For if you speak falsely to live, you save the body but wound the soul. Is there any case where the harm to the neighbor's soul outweighs the harm to your own?

     **Likely Answer:** He will say you must speak the truth and accept death. To lie is to kill your own soul to save the body, which is disorder. You cannot sin to prevent another's sin or suffering.

     **Follow-up:** This suggests the prohibition is absolute regardless of the hearer's need. But if you earlier allowed ambiguity to withhold truth from this same persecutor, you have already judged his need. Where is the line where his need becomes irrelevant?

     **Scholarly Flag:** Well established that Augustine demands truthfulness unto death, but disputed whether his allowance for ambiguity inconsistently grants the hearer less truth than absolutism seems to require.

  10. **Question:** We began with the double heart. If I speak truth but intend to deceive, I am a liar. If I speak falsehood but intend no deception, I am a jester. Is the whole weight of the sin carried by the will alone, or does the sign itself carry a weight that the will cannot lift?

      **Likely Answer:** Augustine will conclude the will is the primary seat of the sin, for God judges the heart. Yet the sign is ordained by God to signify truth, so violating that order is an objective wrong, not merely a subjective fault.

      **Follow-up:** If the sign carries an objective weight, then the hearer who relies on that sign is wronged when it is broken, regardless of your will. Does this not mean the absolutism you preach rests on the hearer's dependence on truth, making the wrong two-place after all?

      **Scholarly Flag:** Consensus holds Augustine prioritizes the will, but specialists dispute whether his theology of signs implies an objective wrong done to the hearer independent of the speaker's intent.
