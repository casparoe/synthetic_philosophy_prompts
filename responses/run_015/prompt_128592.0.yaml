answer: |-
  You are definitely not overthinking the sticky notes. What you are describing is a documented phenomenon, and you are right to sense that it is distinct from the "Tragedy of the Commons."

  While there isn't one single colloquial phrase that everyone uses, there are three specific frameworks from economics, psychology, and sociology that fit this exactly.

  Here is the breakdown of what is happening to your pantry.

  ### 1. The Economic Term: The Tragedy of the Anticommons
  You hit the nail on the head regarding the Tragedy of the Commons. In that scenario, everyone has the right to *use* the resource, so they overuse it until it's destroyed (overgrazing).

  What you are describing is the **Tragedy of the Anticommons**.
  *   **The Concept:** Coined by legal theorist Michael Heller in 1998, this occurs when multiple owners (or users) each have the right to *exclude* others from a scarce resource.
  *   **The Mechanism:** Because everyone has the power to say "no" (via a sticky note), the resource becomes fragmented. No one can use the *whole* resource effectively.
  *   **The Outcome:** Instead of overuse/depletion, you get **underuse**. The shelf space exists, but it is functionally wasted because it is locked up in too many fragmented claims.
  *   **Why it fits:** In your kitchen, the "right to exclude" has been decentralized. Every co-op member has given themselves the veto power over a specific square inch of the shelf. The resource hasn't disappeared, but its utility has collapsed.

  ### 2. The Psychological Term: Defensive Territoriality
  If the Anticommons explains the *economic outcome*, **Defensive Territoriality** explains the *human behavior*.
  *   **The Concept:** From environmental psychology, this is when individuals mark a space to establish control, reduce uncertainty, and manage social interaction.
  *   **The Mechanism:** The sticky note is a "marker." In a shared environment with low trust or high ambiguity (Who eats this yogurt? Is this shelf clean?), people mark territory to create predictability.
  *   **The Cascade:** You noted that "once one person marks a spot, everyone else feels pressure to defend their own." This is a **norm cascade**. Once the norm shifts from "shared space" to "claimable space," failing to claim your spot feels like losing a resource. It becomes a preemptive strike: "I must mark this before someone else does, even if I don't need it yet."

  ### 3. The Sociological Term: Creeping Enclosure
  You mentioned the **Enclosure Movement** (where common lands in Britain were fenced off for private use). Sociologists actually do use the term **Informal Enclosure** or **Creeping Enclosure** for this exact dynamic.
  *   **The Difference:** Historical enclosure was top-down (laws, fences, lords). Your kitchen enclosure is bottom-up (social norms, sticky notes, passive aggression).
  *   **The Mechanism:** It relies on the fact that enforcing the "shared" rule requires social energy. It is easier to let someone keep their sticky note than to confront them. Over time, the exception becomes the rule.

  ### How this differs from the concepts you mentioned

  | Concept | Who has rights? | The Problem | The Result |
  | :--- | :--- | :--- | :--- |
  | **Tragedy of the Commons** | Everyone has right to **use**. | No one can exclude others. | **Overuse** (Depletion) |
  | **Free-Rider Problem** | Everyone has right to **benefit**. | Some don't contribute cost. | **Under-provision** (Resource runs out) |
  | **Anticommons (Your Situation)** | Everyone has right to **exclude**. | Too many vetoes on usage. | **Underuse** (Waste/Hoarding) |
  | **Enclosure Movement** | Ownership transfers to **few**. | Legal privatization of public good. | **Privatization** (Loss of access) |

  ### Does it relate to Public Goods Theory?
  Yes. In economics, your kitchen shelf is a **Common-Pool Resource** (rivalrous—one person's food takes up space—but non-excludable—anyone can put food there).

  By putting up sticky notes, your housemates are artificially introducing **excludability**. They are trying to convert a Common-Pool Resource into a **Private Good** without actually owning it.

  The friction you feel is the cost of that conversion. In a true private good, ownership is clear. In your kitchen, ownership is ambiguous, so you pay the "transaction cost" of social awkwardness to maintain the claim.

  ### What should you call it?
  If you want to sound academic, call it **fragmentation of the commons** or a **local anticommons**.

  If you want a term that captures the social vibe, call it **Defensive Hoarding**.

  ### Why does this happen? (The "Mechanism" you asked about)
  You identified the mechanism perfectly: *cooperation collapses without anyone actually consuming more.*

  This usually happens due to **low trust + high ambiguity**.
  1.  **Ambiguity:** "Is this shelf for long-term storage or quick turnover?"
  2.  **Low Trust:** "If I don't mark this, someone else will throw my stuff out."
  3.  **Risk Aversion:** It is safer to claim space you don't need than to need space you didn't claim.

  ### How to fix it (if you want to)
  You cannot solve an Anticommons with more rules; you solve it by **reconsolidating the rights to exclude.**
  *   **The Reset:** A house meeting where all sticky notes are removed simultaneously (a "jubilee").
  *   **The Manager:** Designating one person (or a rotating role) who has the *sole* right to exclude. (e.g., "Only the Kitchen Manager can label shelves for storage.")
  *   **The Time Limit:** "Sticky notes are valid for 48 hours, then the space returns to the commons."

  You aren't imagining it. You are watching a micro-scale economic shift from a commons to an anticommons, driven by defensive psychology. The sticky notes are the fences.
