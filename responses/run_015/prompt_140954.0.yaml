answer: |-
  The cost-effectiveness analysts' threat of decision paralysis is the only objection that can actually kill the proposal, but it is answerable if you demonstrate that dominance holds for the vast majority of current funding decisions.

  **STRATEGIC OVERVIEW**

  *   **Concede Upfront:** Acknowledge immediately that this increases modeling complexity and requires a transition period for legacy data; do not pretend this is "free."
  *   **The Single Reply That Must Land:** "We ran the historical portfolio through the vector model; 90% of funding decisions remain unchanged under any reasonable weighting, so this is primarily about transparency, not paralysis."
  *   **The Question You Hope Nobody Asks:** "If dominance fails on a high-impact intervention, what is the tie-breaking rule?" (If you say "Board vote," you admit the model doesn't work; if you say "default weights," you admit the weights were there all along.)

  ***

  **1. The Paralysis Objection (Cost-Effectiveness Analyst 1)**
  *   **Objection:** "If I can't get a single expected-value number, I can't rank the grant applications. If the vectors cross, are you telling me we stop funding whenever the model returns 'incomparable'? We can't hold funds in escrow until we resolve moral metaphysics."
  *   **Reply:** "We aren't asking for escrow; we're asking for a dominance rule. If Intervention A beats Intervention B on all three dimensions, we fund A. If they cross, we flag it for Board review. But crucially, when we back-tested this on last year's portfolio, vectors crossed in less than 10% of cases. For the vast majority of decisions, the ranking is robust regardless of how you weight the dimensions. We are removing false precision, not decision-making capacity."
  *   **Soft Spot:** If the 10% of crossed cases include the highest-impact interventions, you still have paralysis where it matters most.
  *   **Slide Add:** Add a slide titled "Portfolio Stability under Vector Model" showing the percentage of historical decisions that remain invariant across weightings.

  **2. The Operationalization Objection (Animal Welfare Scientist)**
  *   **Objection:** "I can measure preference strength in a chicken. I cannot measure 'integration window' in a crab. If you can't give me a behavioral assay I can pre-register, this isn't science, it's speculation dressed up as data."
  *   **Reply:** "We are not demanding point estimates where data doesn't exist; we are demanding honest ranges. Currently, you are forced to collapse 'unknown integration window' into a single scalar number, which hides the uncertainty. The vector allows us to input 'wide range' for insects and 'narrow range' for mammals. This turns the model into a research roadmap: it tells us exactly which dimension's uncertainty is driving the funding decision, so we know what to measure next."
  *   **Soft Spot:** If the ranges are too wide, you trigger Objection 1 (Paralysis) again.
  *   **Slide Add:** Add a slide mapping each dimension to existing proxy measures (e.g., temporal discounting for Integration Window) to show feasibility.

  **3. The Donor Communication Objection (The Chair)**
  *   **Objection:** "Our donors give to 'save animals,' not to 'debate temporal grain.' How do I put this in the annual report? If I tell them their dollar saved 0.5 units of Bandwidth but 0.2 units of Uptake, they will think we are overthinking it and go to a charity that promises simple results."
  *   **Reply:** "Transparency is increasingly a donor requirement, not a bug. Effective Altruism donors specifically worry about 'false precision' in charity metrics. You tell them: 'We used to pretend we knew the exact moral weight of a shrimp; now we acknowledge the uncertainty and fund only where the benefit is robust.' That defends us against the claim that we are guessing. It shifts the narrative from 'we know the answer' to 'we are rigorous about what we don't know.'"
  *   **Soft Spot:** Major institutional donors often prefer simple KPIs; complexity can look like incompetence to non-technical boards.
  *   **Slide Add:** None. This is verbal framing.

  **4. The Hidden Weighting Objection (Cost-Effectiveness Analyst 2)**
  *   **Objection:** "You say the weighting is a moral parameter, but the model still needs an input to run the sensitivity analysis. Who picks the weights? If the modelers pick them, you've just hidden the moral choice in the code. If the Board picks them, are they qualified to decide on 'integration windows'?"
  *   **Reply:** "The Board doesn't need to decide on windows; they decide on risk tolerance. We present the funding recommendation as: 'This intervention is optimal if you value Uptake at least twice as much as Bandwidth.' That forces the moral trade-off into the open. Currently, the modelers pick the weights implicitly by choosing the scalar multiplier. We are just moving the decision from a spreadsheet cell to a policy document."
  *   **Soft Spot:** The Board may refuse to make explicit moral trade-offs, forcing the modelers to do it anyway, reverting to the status quo.
  *   **Slide Add:** None.

  **5. The Evidence Inflation Objection (Insect Neurobiologist)**
  *   **Objection:** "For insects, we have zero data on Uptake. You're replacing a rough scalar estimate with a precise vector of zeros. That's not progress; it's multiplying uncertainty by three. We'll end up saying we know less about insects than we did yesterday."
  *   **Reply:** "We already know less than the scalar implies. The scalar says we know the *total* moral weight. The vector admits we know the *structure* of our ignorance. If Uptake is unknown, we model it as a uniform distribution across the possible range. That might lower the expected value, which is correct—it should lower the EV because the risk of moral error is higher. It prevents us from overconfidence in insect interventions."
  *   **Soft Spot:** Lowering EV for insects might look like a bias against invertebrates, triggering political pushback from specific donor segments.
  *   **Slide Add:** None.

  **6. The Cognitive Sophistication Objection (Philosopher of Mind)**
  *   **Objection:** "Uptake sounds like 'having a self-model' or 'having concepts.' Are you just reintroducing cognitive capacity as a proxy for moral worth? If a creature suffers but doesn't 'register' it in a future-directed way, you're implying its pain counts less. That looks like speciesism."
  *   **Reply:** "We are not grading the *right* not to be harmed; we are grading the *size* of the harm. A creature without future-directed concerns cannot suffer *anticipatory anxiety* or *regret*. Those are specific welfare states that add to the total burden. Acknowledging that a mouse suffers more *types* of pain than a shrimp isn't speciesism; it's acknowledging phenomenological reality. We still fund pain relief for both, but we prioritize where the total welfare range is larger."
  *   **Soft Spot:** The distinction between "types of pain" and "moral worth" is semantically fragile and easily conflated in public communication.
  *   **Slide Add:** None.

  **7. The Threshold Objection (Bioethicist)**
  *   **Objection:** "Moral status is binary. Either a being is a subject of a life or it isn't. If a shrimp meets the threshold for sentience, why does its 'bandwidth' matter? This graded framework quietly licenses trade-offs that ought to be off the table, like sacrificing many shrimp for one pig."
  *   **Reply:** "We agree status is binary; if they are sentient, they count. But 'counting' isn't the same as 'counting equally.' If I have a headache and you have a migraine, we both count, but the intervention that relieves the migraine prioritizes greater suffering reduction. This model measures the capacity for welfare, not the right to exist. It prevents us from treating a shrimp's pain as identical to a pig's pain when the physiological evidence suggests otherwise."
  *   **Soft Spot:** If the vector implies a shrimp's pain is 1/100th of a pig's, it functionally looks like graded status regardless of the philosophical distinction.
  *   **Slide Add:** Add a slide distinguishing "Moral Status" (binary) from "Welfare Capacity" (graded).

  **8. The Legacy Data Objection (Animal Welfare Scientist 2)**
  *   **Objection:** "We have five years of cost-effectiveness analyses based on the scalar model. Are you voiding that work? If we switch now, we can't compare this year's ROI to last year's. That breaks our longitudinal tracking."
  *   **Reply:** "The scalar is a special case of the vector where all weights are equal. We can recalculate the historical data using the vector framework with a default weighting to maintain continuity. This gives us a baseline. The benefit is that going forward, we can see if our ROI changes because the interventions changed, or because our understanding of sentience changed. That's a feature, not a bug."
  *   **Soft Spot:** Recalculating five years of data is expensive labor that the team may resist doing without dedicated budget.
  *   **Slide Add:** None.
