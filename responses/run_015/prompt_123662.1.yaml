answer: |-
  Good morning. To our donors, to our neighbors, to our students, and to my colleagues in history and philosophy: welcome to the quad.

  We are gathered to dedicate an installation that is, by design, incomplete. You see three figures cast in bronze. You see the years of their birth and death. And you see, engraved beneath them, a single question: "What do we owe them?"

  You will notice what is not here. There are no plaques listing their achievements. There are no tablets cataloging their crimes. There is no narrative to tell you how to feel. In public history, silence is often an accusation. But today, this silence is an invitation. It is a refusal to let the past be settled by a summary.

  We gather in a moment when public memory is a battleground. Usually, the fight is over whether a statue should stand or fall. But the deeper fight is over the language we use to judge the dead. There is one phrase that is deployed constantly in these debates, a phrase meant to settle the argument before it begins. You know the phrase: "He was a man of his time."

  We use this phrase to smooth over the rough edges of history. But if we are to do genuine work today, we must realize that this phrase is doing two very different kinds of work, and we rarely distinguish between them.

  The first appeal is grounded in what we might call *epistemic limitation*. When we say a figure was a man of his time in this sense, we mean he lacked access to moral knowledge that we now take for granted. We imply that the moral light had not yet reached him. He was blind to certain truths that are obvious to us. If he could not see the wrong, we argue, he cannot be fully blamed for it. This is an argument about ignorance.

  The second appeal is grounded in *motivational constitution*. Here, the claim is not that he didn't know better, but that he could not *be* better. His character, his desires, and his very sense of self were formed by norms he could not have escaped. To ask him to act against those norms would be to ask him to cease being himself. This is an argument about bondage.

  Both of these defenses rely on a hidden assumption. They both assume that a historical era is a monolith. They assume that in 1776, or 1940, or 1492, there was a single, dominant moral framework that everyone shared. This assumption has a name in our discipline: *serial monism*. It is the belief that time moves in a series of uniform blocks, and that to be "of" a time means to be uniformly embedded in its single prevailing logic.

  If serial monism were true, then the defense of "his time" would hold. If the entire world agreed on a moral truth, and he disagreed, he was ignorant. If the entire world enforced a moral norm, and he followed it, he was compelled.

  But serial monism is false.

  History is not a series of uniform blocks. It is a cacophony. Every era contains competing moral vocabularies. Every age has its dissenters, its heretics, and its internal contradictions. The moral knowledge we claim to possess was often available to them, sitting on their own shelves, spoken in their own languages, by their own contemporaries.

  Consider Thomas Jefferson. It is common to say that the eighteenth century did not understand the immorality of slavery in the way we do. This relies on the epistemic defense. It suggests the argument against human chattel was not yet visible. But walk into the library at Monticello. There, among the books on architecture and agriculture, you find texts arguing explicitly for the humanity of the enslaved, texts written by his contemporaries, in his language, detailing the violence of the system he maintained. The moral knowledge was not missing. The vocabulary was available. He was not epistemically blind to the argument; he was motivationally resistant to it.

  This distinction matters. If we accept serial monism, we grant him the excuse of ignorance. If we reject serial monism, we must acknowledge that he heard the counter-argument and chose to silence it.

  But—and this is crucial for those of us ready to topple the bronze—rejecting serial monism does not simply clear the way for pure condemnation. It complicates it.

  If Jefferson had access to opposing views, so did he have access to the very norms that sustained him. He was not a monster from a different species; he was a moral agent navigating a field of conflicting duties, just as we are. To say he "could not have escaped" his norms is to deny his agency. But to say he "should have escaped" them entirely is to deny his reality. He was not uniformly embedded in a single evil, nor was he uniformly enlightened. He was a site of contestation.

  The same applies to Churchill, and to Columbus. In every case, the "time" they lived in was not a prison cell with one door; it was a crowded room with many voices. Some voices urged expansion, some urged restraint. Some urged domination, some urged mercy. They listened to some and ignored others.

  This is why there are no plaques on these pedestals.

  A plaque would imply that we have solved the equation. It would imply that we can calculate the sum of their virtues against their vices and print the result. But if serial monism is false, then the calculation is impossible. We cannot excuse them by saying they didn't know, because the knowledge was there. We cannot condemn them by saying they were purely products of a dark age, because the light was also there.

  To install a plaque explaining their greatness would be a lie of omission. To install a plaque detailing their crimes would be a lie of simplification. Both rely on the idea that their era spoke with one voice. It did not.

  So, what do we owe them?

  We do not owe them our gratitude, necessarily. We do not owe them our reverence. But we do owe them the honesty of recognizing their complexity, because that complexity is the only thing that makes them human rather than mythical.

  To the historians and philosophers here: I ask you to recognize that this installation is not a retreat from judgment. It is a demand for a more rigorous judgment. It requires us to abandon the easy shelter of "his time" and confront the specific choices these men made when other choices were, in fact, possible.

  To the students, donors, and residents here: I ask you to recognize that this silence is not evasion. It is respect for your intelligence. It is an acknowledgment that history is not a story told to you, but a problem you must solve.

  When we look at these portraits, we are not looking at gods, and we are not looking at demons. We are looking at mirrors. We are looking at the reflection of our own moral condition. We, too, live in a time that future generations will judge. We, too, are surrounded by competing moral vocabularies. We, too, choose which voices to amplify and which to ignore.

  We want to believe that we are not "people of our time." We want to believe we see the truth clearly. But serial monism will apply to us, just as it fails to apply to them. Future generations will look at our era and see the arguments we ignored. They will see the books we didn't read. They will see the norms we claimed were inescapable, but which our neighbors successfully resisted.

  "What do we owe them?"

  We owe them the truth that they were not prisoners of their century. They were participants in it. And in acknowledging that, we acknowledge that we are participants in our own.

  Let this installation stand not as a monument to their glory, nor as a marker of their shame, but as a question that refuses to be answered. Let it stand as a reminder that moral clarity is not found in the dates beneath a statue, but in the difficult work of listening to the conflicting voices of our own time, and choosing, as they did, which ones to obey.

  Thank you.
