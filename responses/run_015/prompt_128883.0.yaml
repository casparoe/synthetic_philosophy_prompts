answer: |-
  **Setting:** *Dr. Aris's office, late afternoon. Sunlight cuts across stacks of journals. Dr. Blythe sits opposite him, holding a mug of tea. They have just finished co-chairing a panel on social ontology.*

  **Aris:** I have to say, Blythe, your paper was provocative. But I'm stuck on the cathedral example. You claim the stonemason in 1250 and the glazier in 1450 share a collective intention to build the cathedral. But the mason is dead before the glazier is born. They never exchange a glance, never nod, never confirm a mutual belief. How can there be a "we" without a moment of shared presence?

  **Blythe:** Because the "we" isn't located in the handshake, Aris. It's located in the commitment to the structure. Think about the architectural plan. It's not just a drawing; it's a set of instructions that persists. The mason lays a foundation *for* the wall he knows will come, even if he won't build it. The glazier builds the window *for* the nave he knows was built, even if he didn't lay the stone. They are coordinated by the role, not by eye contact.

  **Aris:** Coordinated, yes. Causally linked, absolutely. But intentionality is a mental state. For us to genuinely say "we intend to build X," I need to know that you intend to build X, and you need to know that I know. That reflexive loop is what turns parallel individual actions into a joint action. In your cathedral, the mason intends to lay stone. He might hope someone finishes the job. But he cannot share an intention with a ghost. Without reciprocal awareness, you don't have a collective agent; you have a chain of individual agents who happen to be useful to one another across time.

  **Blythe:** That's the traditional view, I know. But it assumes that collective intentionality is essentially psychological, that it has to happen inside the skull. I'm arguing it's structural. When the mason takes the job, he enters a role defined by the project. The project exists independently of any single participant's lifespan. The intention is distributed across the system of roles. To say they aren't a collective because they lack mutual awareness is like saying a relay team isn't a unit because the first runner doesn't hold the baton at the same time as the last runner.

  **Aris:** But the relay team practices together. They know the rules of the handoff. They share a background of mutual knowledge about the race *now*. In the cathedral case, the transmission is degraded. The plan changes. The theology shifts. If the glazier decides the nave should be Gothic instead of Romanesque because tastes have changed, is he violating the collective intention or fulfilling it? If the intention is truly shared, there must be a mechanism for negotiation. You can't negotiate with the dead.

  **Blythe:** You're assuming negotiation requires synchronicity. It doesn't. It requires fidelity to the constraint. The glazier interprets the plan. That interpretation is governed by the norms of the guild, the dictates of the Church, the structural limits of the stone. These are external constraints that regulate the intention. The "we" is maintained by the stability of these norms. If the glazier deviates too much, the building falls, or the Bishop rejects it. The feedback loop isn't between the mason and the glazier; it's between the agent and the institutional structure.

  **Aris:** So you're reducing intentionality to functional fit. If the piece fits, it was intended? That seems dangerous. If I unknowingly donate money to a fund that eventually builds a hospital, and my contribution was necessary, did I share the collective intention to build the hospital? I never knew the hospital was the goal. I just gave money.

  **Blythe:** No, because you didn't accept a role within the structural plan. The artisans did. They were initiated. They took oaths. They were paid according to the progress of the *whole*, not just their piece. That distinguishes them from your accidental donor. The key is the role assignment. When you occupy a role in a trans-generational project, you inherit the intentionality of the project. You don't need to hold the entire mental representation of the cathedral in your head. You just need to hold your part of the "we."

  **Aris:** But what is that "part of the we" if not a mental state? If I say "I am doing my part of what we are doing," I am referencing a "we." If that "we" doesn't exist psychologically—if there is no group mind or mutual awareness—then what am I referencing? I'm referencing a fiction. It feels to me like you want the explanatory power of collective agency without the ontological cost. You want to say "they built this together" without having to explain how "they" exists as a singular entity.

  **Blythe:** I'm not positing a group mind. That's the caricature. I'm positing a distributed cognitive system. The intention isn't in the mind; it's in the practice. But let me turn this back on you. You demand mutual awareness. Fine. How do you handle modern corporations? A software engineer at a tech firm today writes code for a product that won't launch for five years. Teams dissolve. People are fired. The CEO changes. There is no moment where everyone currently employed mutually acknowledges their shared intention to build the final product. By your standards, is Google not a collective agent? Is it just a heap of individuals?

  **Aris:** I distinguish between metaphorical and literal collective intentionality. Certainly, we speak of corporations acting. But strictly speaking, it is a network of interlocking individual intentions. The engineer intends to write code *believing* it will contribute to a product. The manager intends to launch *believing* the code will be ready. It's a mesh of "I intend" statements that align. We don't need to multiply entities and posit a mystical "corporate mind" to explain the output. We just need complex individual psychology.

  **Blythe:** And that's where you lose the phenomenon. The output isn't just aligned; it's integrated. If the engineer quits, someone else steps into the role and continues the *same* intention without restarting the psychological mesh. The intention persists across the personnel change. If it were just interlocking individual intentions, the departure of key nodes should collapse the project. But it doesn't. The role carries the intention. By insisting on mutual awareness, you're confusing a contingent feature of small-scale cooperation—like lifting a table together—with the necessary conditions for large-scale institutional action.

  **Aris:** I'm not confused about the scale. I'm concerned about the dilution of the concept. If "collective intentionality" applies to people who never met, never spoke, and lived in different centuries, what does it *not* apply to? Does a forest have collective intentionality because the trees cooperate to form an ecosystem? Where do you draw the line? The line I draw is mutual awareness. That creates a boundary. Without it, intentionality bleeds into mere causal function.

  **Blythe:** The line is the normative commitment. The trees don't commit to norms. The artisans did. They could be praised or blamed. If the mason laid a weak foundation, he was culpable, even if he died before the collapse. That culpability implies he was an agent of the collective project. Now, address my specific point about the phenomenology. You keep insisting on the "we-feeling." But surely you admit that much of our labor is alienated? I might not feel a warm fuzzy connection to my colleagues, yet we still act collectively. Why is the feeling necessary for the fact?

  **Aris:** Because the feeling is the evidence of the mutual belief. It's not about warmth; it's about reflexivity. If I don't know you're there, I can't adjust my action in response to your action. In the cathedral, the mason cannot adjust his foundation based on the glazier's needs because he doesn't know the glazier. He follows a plan. But following a plan is individual obedience, not collective collaboration. It's like following a recipe left by a dead grandmother. You're cooking together only in a poetic sense.

  **Blythe:** But the recipe was designed for a kitchen that includes you. The plan anticipates the future agent. That anticipation is a form of reach. The mason leaves a marker, a signature, a specific joint technique that signals to the future builder: "I was here, and this is where you connect." It's a delayed handshake. To deny this is collective intentionality is to privilege the present moment arbitrarily. Why is simultaneity metaphysically privileged? If we can share a language across centuries, why not an intention?

  **Aris:** Language is a tool. Intention is a state. We share the tool, not the state. Look, let's grant for a moment that your "stretched intentionality" exists. Does the absence of a shared collective self-awareness undermine it? If the builders never thought of themselves as part of a trans-generational "we," but only as servants of God doing their daily task, then the collective agent exists only in your analysis, not in theirs. Does that bother you? That you're attributing a "we" to them that they wouldn't recognize?

  **Blythe:** It shouldn't bother me any more than attributing unconscious motives to an individual bothers a psychologist. They might not have articulated the "we," but they acted within the logic of the "we." They understood themselves as links in a chain. That *is* a form of collective self-awareness, just temporally extended. They knew they were not the beginning or the end. That humility is the recognition of the collective.

  **Aris:** That's a beautiful sentiment, Blythe, but is it ontology? Knowing you are a link is an individual belief about your context. It doesn't create a joint subject. My worry is this: if you accept stretched intentionality, you must accept that any structure that guides behavior over time has intentionality. A river carves a canyon over millennia guided by gravity and geology. Is the river intending the canyon?

  **Blythe:** No, because the river lacks the normative structure. It cannot fail to be a river. The artisans can fail to be builders. They can botch the job. The intentionality lies in the susceptibility to norms. But I hear your worry. You think I'm multiplying group minds. I'm not. I'm saying the group mind is empty. It's a placeholder for the structure. You want to locate the agency in the individuals. I'm saying the agency is in the relations between them, even if those relations span death.

  **Aris:** And I say relations without relata who know they are related are just causal chains. But I will concede this: if we deny your view, we struggle to explain the unity of the artifact. The cathedral is too coherent to be mere accident. It demands an explanation of coordination. I insist that coordination is achieved through the transmission of individual intentions via the plan, not through a single stretched intention.

  **Blythe:** And I insist that the plan itself is a cognitive artifact that holds the intention when no human brain is large enough or long-lived enough to hold it alone. We disagree on where the intention lives. You put it in the sync; I put it in the system.

  **Aris:** Precisely. And until we can agree on whether a system can "mean" something without a mind to mean it, we'll be here until the sun goes down.

  **Blythe:** *She smiles, finishing her tea.* Well, at least we're cooperating in that inquiry. Synchronously.

  **Aris:** *He chuckles.* Yes. Here and now. That, I can certify.
