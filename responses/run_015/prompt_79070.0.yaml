answer: |-
  ### Essay Question

  **Time Allowed:** 50 Minutes
  **Total Marks:** 20

  **Prompt:**

  Consider three different individuals:
  1.  **Alex** seems naturally drawn to fairness and helping others, almost without effort.
  2.  **Blake** is equally fair and helpful, but only after years of strict correction and forcing themselves to follow the rules.
  3.  **Casey** is a child imagined to have grown up entirely without instruction, ritual, language, or good examples.

  Using the arguments from our unit, explain how Mencius and Xunzi would analyze these three cases. Do they disagree about what humans are like at birth, or do they disagree about what happens when we are left without culture? In your answer, discuss whether their debate is really about whether we have moral "equipment" at all, or merely whether that equipment is enough on its own. You do not need to quote the texts, but you must explain their reasoning clearly.

  ***

  ### Model Answer

  When analyzing Alex, Blake, and Casey, it is tempting to say Mencius believes people are good and Xunzi believes they are bad. However, a closer look at their arguments suggests their disagreement is more about the definition of "nature" and the necessity of effort than about simple moral labels.

  For Alex, the student who is naturally fair, Mencius would argue this proves human nature contains "sprouts" of virtue. Alex is not acting against their nature but fulfilling it. Xunzi, however, would be suspicious. He might argue that Alex's ease is deceptive; perhaps Alex has internalized training so well it feels natural, or perhaps Alex is simply following instinctual desires for social approval, which is not true morality. For Blake, the student who requires effort, Mencius would see someone who has lost touch with their original heart and is working to recover it. Xunzi would view Blake as the ideal success story. Since Xunzi believes our raw instincts are selfish and chaotic, Blake's fairness is the result of "artificial" shaping through ritual and teachers. Here, both thinkers value the outcome (fairness), but Mencius sees it as a return to the self, while Xunzi sees it as a transformation of the self.

  The most important test case is Casey, the child raised without culture. Mencius would predict that Casey still possesses the potential for goodness, even if it is starved. Like a tree chopped down, the roots remain; if Casey were later taught, the sprouts could grow. Xunzi would predict that Casey would be driven entirely by hunger, envy, and desire. Without teachers to redirect these instincts, Casey would be chaotic and harmful. On the surface, both might agree that Casey would not behave morally in isolation. However, Mencius would blame the *environment* for failing to water the sprouts, while Xunzi would blame *nature* for providing no moral direction to begin with.

  This leads to the core disagreement: what do we mean by "nature"? If nature means "what we are like at birth," they might actually agree more than expected. Both admit humans have instincts at birth. Mencius identifies specific moral instincts (compassion), while Xunzi identifies physical and emotional instincts (hunger, jealousy). The real split is about sufficiency. Mencius argues our inborn equipment is sufficient to start the journey toward goodness; we just need the right conditions. Xunzi argues our inborn equipment is insufficient for social order; we need external teachers to reshape us.

  Therefore, Xunzi is not necessarily denying that we have moral equipment, such as the intelligence to learn or the capacity to feel. He is denying that this equipment naturally points toward goodness. He denies that our raw material is good enough to build a moral life without a blueprint from the outside. Mencius believes the blueprint is inside us; Xunzi believes it must be applied from the outside.

  In conclusion, the debate is not simply "good versus bad." It is about whether morality is a discovery of who we already are (Mencius) or a construction of who we must become (Xunzi). Regarding the three students, Mencius sees Alex as the standard and Blake as recovering; Xunzi sees Blake as the standard and Alex as an anomaly. Regarding Casey, they agree on the behavior (chaos) but disagree on the cause (starved potential vs. inherent selfishness). Understanding this distinction shows that their conflict lies in whether human nature is the *source* of virtue or merely the *raw material* for it.

  ***

  ### Marking Scheme (20 Marks)

  **Target:** This scheme rewards students who move beyond the "Good vs. Bad" slogan and engage with the definitions of nature and sufficiency.

  | **Move** | **Marks** | **What to look for** | **Common Pitfall** |
  | :--- | :---: | :--- | :--- |
  | **1. Analysis of Alex & Blake** | 4 | Correctly identifies that Mencius sees Alex as fulfilling nature and Blake as recovering it, while Xunzi sees Blake as successfully shaped and Alex as potentially deceptive or lucky. | Treating Alex as "good" and Blake as "bad" for both thinkers, ignoring the role of effort. |
  | **2. Analysis of Casey (Feral Child)** | 4 | Predicts that both might expect Casey to fail morally, but explains the *reason* differs (starved potential vs. inherent chaos). | Claiming Mencius thinks Casey would still be perfectly good without any teaching at all. |
  | **3. Defining "Nature"** | 4 | Explicitly discusses how the thinkers define nature differently (e.g., moral sprouts vs. raw instincts/appetites). | Failing to define nature and just talking about "behavior" generally. |
  | **4. The "Sufficiency" Argument** | 4 | Recognizes Xunzi may admit we have capacities (intelligence/feeling) but denies they are *sufficient* for goodness without external aid. | Claiming Xunzi thinks humans have *no* positive capacities or are purely evil demons. |
  | **5. Synthesis/Conclusion** | 4 | Concludes that the disagreement is about the *source* of virtue (internal discovery vs. external construction) rather than just the outcome. | Ending with a simple summary like "Mencius is optimistic and Xunzi is pessimistic." |

  **Total:** 20 Marks

  **Note on Grading (A vs. B):**
  A **B-range answer** will correctly apply the theories to the three students and state that Mencius is optimistic while Xunzi is pessimistic. An **A-range answer** will distinguish between *having* moral capacity and that capacity being *sufficient* on its own. The A answer recognizes that Xunzi values ritual not because humans are broken, but because raw nature is unshaped, and that Mencius values cultivation not to create virtue, but to protect it. Look for the nuance in Move 4.
