      For the anti-reductionist (Reid), testimony provides prima facie justification. We should believe unless defeated. But when every account defeats every other, the "default right" becomes useless. If four witnesses contradict, the presumption of truth cancels out. Anti-reductionism relies on a background norm of sincerity that the film systematically dismantles. Each narrator lies to preserve their ego.

