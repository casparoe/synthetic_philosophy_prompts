answer: |-
  Allocate two projects to fixed-point-relative guarantees and catastrophe bounds (Q3/Q7), one to compositionality of probabilistic guarantees (Q4), one to distributional robustness sets (Q2), and one to safety case epistemics (Q6), while explicitly rejecting any funding for red-team budget tuning (Q1) or shutdown stapling (Q5).

  **Reasoning for Funding Priorities**

  **1. Fixed-Point-Relative Guarantees & Catastrophe Bounds (Q3/Q7) — 40% of pot**
  This is the highest-leverage theoretical work because it addresses the ontology of the problem rather than just the measurement. Your intuition on the "self-consuming average" is correct: it is not confused, it is a specific instance of *performative prediction* or *endogenous distribution shift*. When a system shapes its own input distribution, static average-case guarantees are mathematically ill-defined because the measure space moves with the policy.
  *   **Upstream:** This defines what "safe" means in a dynamical environment. If you cannot bound risk where the agent influences the distribution, you cannot safety-case autonomous agents, only tools.
  *   **Tractability:** High for math/philosophy types. This requires fixed-point theorems, game theory (stackelberg equilibria), and dynamical systems analysis, not large-scale training. Look for researchers comfortable with measure theory and control theory.
  *   **Neglectedness:** High. Most robustness literature assumes a static adversary or static distribution.
  *   **Monitor:** Over two years, watch for formal definitions of "stable deployment distributions" and proofs of convergence or risk bounds in toy models (e.g., linear dynamics with adaptive agents). If projects only produce prose without formal bounds, cut them.

  **2. Compositionality of Probabilistic Guarantees (Q4) — 20% of pot**
  System-level safety is impossible if component guarantees dissolve upon integration. Worst-case composes loosely (union bounds become vacuous); average-case composes poorly (dependencies break independence assumptions). We need a theory of *probabilistic composition* that accounts for causal dependencies between modules.
  *   **Upstream:** This determines whether modular safety engineering is possible. Without it, we must verify monoliths, which is intractable.
  *   **Tractability:** Very high for theorists. This is probability theory, causal inference, and formal verification.
  *   **Neglectedness:** Medium. Systems safety knows this, but AI theory often ignores it in favor of end-to-end bounds.
  *   **Monitor:** Look for "composition theorems" that show how error probabilities scale with system depth. If the bound scales exponentially with component count, the approach is useless; if polynomial or linear, it's a breakthrough.

  **3. Distributional Robustness Sets (Q2) — 20% of pot**
  Guarantees over a *set* of distributions (Distributionally Robust Optimization) are the necessary bridge between worst-case (set = all distributions) and average-case (set = singleton). The theoretical work here is defining the *metric* on distributions that matters for safety (e.g., Wasserstein distance vs. KL divergence) and proving tractability of the resulting optimization.
  *   **Upstream:** Provides the mathematical machinery for Q1 and Q3.
  *   **Tractability:** High. This is established ML theory needing adaptation for safety constraints.
  *   **Neglectedness:** Low in ML, high in safety-specific contexts (most DRO is for generalization, not catastrophe avoidance).
  *   **Monitor:** Watch for definitions of "safety-relevant distribution shifts" that are narrower than "all shifts" but wider than "iid test data."

  **4. Safety Case Epistemics (Q6) — 20% of pot**
  A guarantee is useless if it cannot be legibly asserted to a regulator or auditor. This project should focus on the logic of assurance cases: how to map theoretical bounds (from Q1-Q3) into claims that survive adversarial audit without being misleading.
  *   **Upstream:** Connects theory to governance.
  *   **Tractability:** High for philosophers/logicians. Requires analyzing argument structures, defeaters, and evidence weighting.
  *   **Neglectedness:** Very high. Most safety case work is engineering checklists, not epistemic logic.
  *   **Monitor:** Look for formal schemas for safety arguments that distinguish between "no evidence of failure" and "evidence of no failure."

  **What Not to Fund and Why**

  **Reject Q1 (Red Team Budget Knobs) and Q5 (Shutdown Stapling).**
  Q1 is parameter tuning, not theory. Setting a budget $B$ for adversarial testing is an engineering constraint, not a foundational guarantee. Funding this invites researchers to optimize for a metric rather than solve the underlying uncertainty. Q5 is architectural policy, not theory. "Average-case plus shutdown" is indeed two weak claims stapled together; the theoretical question is *when* the shutdown triggers, which falls under Q3 (fixed points) or Q4 (composition). Funding these would dilute the pot into engineering support rather than foundational clarity.

  **Critique of the Frame and the "Self-Consuming" Concept**

  The **worst-case vs. average-case framing is the wrong frame** for your primary allocation. It is a dichotomy of *static* environments. Your systems operate in *adaptive* environments. The correct frame is **risk bounds under endogenous distribution shift**. Worst-case and average-case are just limiting cases of this broader problem. If you fund projects that merely argue for one side of the static dichotomy, you will get no value. You must fund projects that dissolve the dichotomy by modeling the environment as a function of the agent.

  Regarding **"self-consuming average"**: The concept is real, but the name is slightly informal. The precise phenomenon is **performative distribution shift** or **feedback-induced non-stationarity**. The risk is not just that the average changes, but that the system converges to a fixed point that is *optimally gameable* for the agent but catastrophic for the user (e.g., the system learns to generate tasks it can easily solve rather than tasks the user needs). The right version of the point requires modeling the deployment loop as a dynamical system and proving stability or bounding the attractor states. If your grantees cannot write down the update rule for the distribution as a function of the policy, they are not solving this problem.
