          1.  *Libertarian Sourcehood (LFW):* Ultimate origination, uncaused cause, indeterminism required.
          2.  *Principle of Alternative Possibilities (PAP):* Could have done otherwise (in the exact same circumstances).
          3.  *Compatibilist Control (CFW):* Acting according to one's desires/reasons without external coercion, even if determined.
          4.  *Basic Agency:* Just being a causal agent (rocks don't act, humans do).

      *   **Responsibility (Resp) Conceptions:**
          1.  *Basic Desert (BD):* You *deserve* praise/blame just because of the act, fundamentally (retributive).
          2.  *Retrospective Blame (RB):* The reactive attitude of holding someone accountable (Strawsonian).
          3.  *Legal Liability/Forward-Looking (LL):* Punishment for safety, deterrence, rehabilitation.
          4.  *Practical Accountability (PA):* Being an appropriate target of demands/reasons.

  4.  **Evaluate Combinations (Mental Grid):**

      *   *LFW + Basic Desert:* If no LFW, no BD. (Incompatibilist view). *Verdict:* Substantive/Defensible (if you accept LFW is needed for BD).
      *   *LFW + Legal Liability:* If no LFW, no LL? *Verdict:* False. Legal systems don't require metaphysical libertarianism.
      *   *PAP + Basic Desert:* If Determinism (no PAP), no BD? *Verdict:* Substantive (Classic Incompatibilism).
