  *   **Squares:** 12 numbered circles (1 to 12).
  *   **Start:** Square 1.
  *   **Goal:** Square 12 (Absorbing: once you arrive, you stay there forever).
  *   **Moves:** Deterministic arrows connect the squares.
  *   **Discount:** $\gamma = 0.9$. A point received $t$ steps from now is worth $0.9^t$ points today.
  *   **Agent Behaviour:** We have observed the agent's complete policy. In every square, the arrow below indicates where the agent goes next.

  **Map Layout (Visual Description for Drawing):**
  *   **Route A (The Observed Path):** 1 → 2 → 5 → 8 → 11 → 12. (5 steps to goal).
  *   **Route B (The Alternative):** 1 → 3 → 4 → 6 → 7 → 8 → 11 → 12. (7 steps to goal).
  *   **Choke Point:** Square 8 (Both routes must pass here).
  *   **Dawdle Loop:** At Square 4, an arrow points back to 3. (Agent *could* loop 3↔4, but doesn't).
  *   **Unvisited Zone:** Square 9 and 10 branch off Square 6. (Agent never enters 6→9 or 6→10).
  *   **Observed Arrows:**
      *   1→2, 2→5, 5→8, 8→11, 11→12.
      *   3→4, 4→6, 6→7, 7→8. (Note: At 3, agent chooses 4 over 2? No, 1 chooses 2. At 1, agent chooses 2 over 3).
      *   *Correction for consistency:* At Square 1, agent chooses 2 (Route A). At Square 3 (if they were there), they choose 4.
      *   **Crucial:** The agent is *observed* taking Route A. We do not know what they would do at Square 3, but we must assign rewards consistent with them choosing 1→2 over 1→3.

  **Your Task:**
  1.  **Infer Rewards:** Assign an integer "Reward Value" ($R$) to each of the 12 squares. This is the points the agent receives for *entering* that square. (Set $R(1) = 0$).
  2.  **Verify:** Calculate the Total Discounted Value of Route A and Route B using your numbers. Route A must be strictly higher than Route B.
  3.  **Record:** Write your 12 numbers on the whiteboard table when called.

  ---

  ## 2. Team Structure and Scoring

  *   **Teams:** 7 Teams of 2 students (Mix CS/Philosophy in each pair).
  *   **Materials:** One handout per team, one calculator per team (or phone calculator), whiteboard markers.
  *   **Scoreboard:** Drawn on the main whiteboard. Columns: Team 1–7. Rows: "Fit", "Prediction", "Insight".

  **Scoring Scheme:**
  1.  **Fit (10 pts):** Awarded if your numbers mathematically prove Route A > Route B (verified by TAs/Instructors during circulation).
  2.  **Prediction (10 pts):** Awarded in Round 2 if your numbers correctly predict the agent's choice in the *modified* world.
  3.  **Insight (Bonus):** Awarded in Debrief for the team that best articulates *why* their numbers differ from others but predict the same behavior.

  ---

  ## 3. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Distribute handouts. Explain rules, discounting ($\gamma=0.9$), and the "Fit" scoring. Emphasize: *Deterministic moves. Noiseless data.* |
  | **10–35** | **Inference** | Teams assign numbers to squares. They must calculate path values to ensure Route A > Route B. Instructors circulate to verify math (check "Fit"). |
  | **35–45** | **Display** | Teams write their 12 numbers on the board. Compare rows. Notice they are different. |
  | **45–55** | **Prediction** | **The Twist:** Hand out "Update Card." A new path opens: 3 → 5 (Shortcut on Route B). New Route B length: 1→3→5→8... (4 steps). Route A is 5 steps. <br>Task: Using *your existing numbers*, predict the new choice. No changing numbers. |
  | **55–65** | **Verification** | Teams calculate new path values. <br>**Result:** All teams predict Route A *or* all predict Route B (depending on number scaling), but critically: **All teams agree with each other.** Scoreboard ties. |
  | **65–75** | **Divergence** | **The Question:** "We can place one Bench in Square 9 (Unvisited). Where does the agent *want* the bench? Is $R(9)$ high or low?" <br>Teams discuss. Numbers now diverge wildly. |
  | **75–90** | **Debrief** | Lecture/Discussion mapping the activity to IRL limits (see below). |

