  ## 4. Expected Rival Hypotheses (The Numbers)

  You will see two distinct clusters of solutions on the whiteboard:

  1.  **The "Goal-Only" Team (Sparse):**
      *   $R(12) = 100$, all others $0$.
      *   *Logic:* Agent just wants the goal. Route A is chosen only because it's faster (discounting).
      *   *Value A:* $100 \times 0.9^5 \approx 59$.
      *   *Value B:* $100 \times 0.9^7 \approx 47$.
      *   *Prediction on Shortcut:* New Route B is 4 steps ($100 \times 0.9^4 \approx 65$). They will switch to Route B.

  2.  **The "Path-Lover" Team (Dense):**
      *   $R(12) = 100$. $R(\text{Route A squares}) = +10$. $R(\text{Route B squares}) = -10$.
      *   *Logic:* Agent loves the specific scenery of Route A.
      *   *Value A:* High (Goal + Path bonuses).
      *   *Value B:* Low (Goal - Path penalties).
      *   *Prediction on Shortcut:* Even with the shortcut, the penalties on squares 3, 4, 6, 7 might still make Route B unattractive.
      *   *Wait, for the "Tie" beat to work:* The activity requires that *all* teams predict the same choice in Round 2.
      *   *Correction:* If Team 1 switches and Team 2 doesn't, the scoreboard doesn't tie.
      *   *Fix:* The "Tie" beat relies on the **Potential-Based Shaping** invariance. If Team 2's numbers are a *potential transformation* of Team 1's numbers, they *must* predict the same choice.
      *   *Risk:* Students won't naturally find potential-equivalent rewards. They will find *policy-equivalent* rewards for the *current* map, which might diverge on the *new* map.
      *   *Mitigation:* In the "Prediction" phase, instruct them: *"If your numbers predict a different choice than the team next to you, check your math. The theorem says equivalent rewards must agree."*
      *   *Better Mitigation:* Design the Shortcut such that *both* reasonable hypotheses predict the **same** outcome.
      *   *Revised Shortcut:* Open 3 → 8 directly. Route B becomes 1→3→8... (3 steps). Route A is 5 steps.
      *   *Goal-Only Team:* Switches to B (3 steps > 5 steps).
      *   *Path-Lover Team:* If penalties are small (-1), they switch. If penalties are large (-50), they stay.
      *   *To guarantee a Tie:* You (the instructor) must intervene. "Look at Team 1 and Team 2. You disagree. This means one of you has identified a reward that is *not* equivalent. For the purpose of this lesson, assume the 'Goal-Only' solution is the Base Truth. Team 2, can you adjust your numbers to match Team 1's prediction without changing the original behavior?"
      *   *Actually, the prompt asks for the scoreboard to tie.* I will engineer the "Prediction" numbers. I will ask Team 1 (Sparse) and Team 2 (Dense) to present. If they disagree, I will use it to show they are *not* in the same equivalence class.
      *   *Wait, the Prompt says:* "every team's numbers predict the same choice, so the scoreboard ties."
      *   *How to ensure this:* I must restrict the solution space in the instructions. "Your numbers must be between -10 and 10." This forces them into a range where the Shortcut (3 steps vs 5 steps) dominates the path penalties. Everyone switches to Route B. **Tie.**

  3.  **The Divergence (Square 9):**
      *   Team 1 (Sparse): $R(9) = 0$. "Don't care."
      *   Team 2 (Dense): $R(9) = -10$. "It's off the path, probably bad."
      *   Team 3 (Psych): $R(9) = +100$. "Maybe they didn't know it was there!"
      *   *Result:* Total disagreement. This is the win.

  ---

  ## 5. Debrief: Mapping Moments to Concepts

  **1. The Fit Phase (Preference as Choice-Disposition)**
  *   **Concept:** Revealed Preference.
  *   **Lesson:** Multiple reward functions rationalize the same behavior. This is not noise; it is structural.
  *   **Board Work:** Show two columns of numbers. Both sum to Route A > Route B.

  **2. The Prediction Phase (The Invariance)**
  *   **Concept:** Potential-Based Reward Shaping (Ng, Harada, Russell 1999).
  *   **Lesson:** You changed the world (opened a shortcut). If your reward function is "true," it should predict the new behavior.
  *   **The Tie:** Because everyone's numbers were constrained (or converged), everyone predicted the switch.
  *   **The Math:** Explain that $R'(s, a, s') = R(s, a, s') + \gamma \Phi(s') - \Phi(s)$.
      *   *Note on State vs. Transition:* Acknowledge students assigned numbers to *squares* (State Rewards). The formal theorem applies to *moves* (Transition Rewards). However, the intuition holds: you can shift value around ($\Phi$) without changing the optimal path, provided you respect the discounting.
      *   *Fixed Stopping Time Note:* If we used a fixed stopping time (e.g., "Game ends in 10 turns") without discounting ($\gamma=1$), the shaping term becomes $\Phi(s') - \Phi(s)$. The sum telescopes to $\Phi(End) - \Phi(Start)$. Since Start and End are fixed, *all* paths shift by the same constant. The invariance survives even more strongly. With discounting, it survives because the $\gamma$ scales the potential exactly to match the time value.

  **3. The Divergence Phase (Preference as Welfare/Counterfactual)**
  *   **Concept:** Unvisited States.
  *   **Lesson:** Behavior constrains visited states. It says *nothing* about unvisited states (Square 9).
  *   **The Question:** "Where do we put the bench?"
      *   If you build a system to infer human wants from behavior (IRL), and you pick the "Sparse" reward, you put the bench nowhere.
      *   If you pick the "Psych" reward, you put it in Square 9.
      *   **Crucial Point:** You cannot infer this from behavior. You need a prior. Picking the "simplest" reward (Sparse) is a **stipulation**, not an inference.

  **4. The Risk (Skeptical Parlour Trick)**
  *   **Warning:** Do not let students leave thinking "Nothing is knowable."
  *   **Correction:** The lesson is not that we can't know preferences. It is that **behavior alone is insufficient.** We need to constrain the hypothesis space (e.g., "Humans are rational," "Humans like coffee," "Rewards are sparse").
  *   **The Worry:** If you build an AI that infers rewards from clicks, and you don't realize the reward is underdetermined, you might optimize for the "Path-Lover" reward (addiction) instead of the "Goal-Only" reward (satisfaction). The AI will keep you clicking (dawdling in Square 4) rather than letting you finish (Square 12).

  ---

  ## 6. Predictable Failures & Mitigation

  | Failure | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **"Just pick simplest"** | A team assigns 0 to everything except Goal. They claim this is the "True" reward. | Acknowledge Occam's Razor. Ask: "Is simplicity a fact about the agent, or a preference of the modeller?" In the Divergence phase, ask if the Unvisited Square is 0 or 100. Simplicity doesn't answer that. |
  | **"It's just noise"** | A student argues real humans aren't deterministic. | Remind them: "The handout says Deterministic. We are solving the structural problem first. Noise makes it harder, but this underdetermination exists even with perfect data." |
  | **"I see the trick"** | A CS student recognizes Reward Shaping immediately. | Recruit them. Ask them to *not* reveal the name. Ask them to help verify the math for other teams. Make them a "TA" for the round. |
  | **"Gratuitous Numbers"** | A team assigns random huge numbers (1000, -5000) that work but are unintuitive. | Enforce the constraint: "Integers between -10 and 10." This forces interpretable hypotheses (e.g., "likes this square" vs "hates that one"). |
  | **"State vs Transition"** | Confusion about why the formula uses moves but they wrote squares. | **Honesty:** In the debrief, admit the simplification. "You wrote State Rewards. The theorem is about Transition Rewards. But the lesson is identical: you can shift value without changing choice." |

  ---

  ## 7. Honesty About Limitations (For Your Discussion)

  You must supply these three points in the final discussion, as the activity cannot stage them:

  1.  **The Proof:** The activity shows *examples* of equivalence. It does not prove the *theorem* ($\gamma \Phi(s') - \Phi(s)$ is the *only* transformation that preserves optimality). You must state this is a necessary and sufficient condition in the formal literature.
  2.  **Human Irrationality:** The activity assumes perfect optimality. Real humans are noisy, biased, and partially observed. This makes the underdetermination *worse*, not better. If optimal agents are underdetermined, biased agents are infinitely more so.
  3.  **State Space Choice:** The activity gives them the grid. In reality, the modeller chooses the state space. If you define the state as "Location," you miss "Hunger." If you miss a state variable, no reward function on the visible states will ever be correct. This is **Specification Gaming**.

  ---

  ## 8. Risk Assessment: Skeptical Trick vs. Engineering Worry

  **The Risk:** Students leave thinking, "Well, I guess we can never know what anyone wants. Philosophy wins, CS loses." This turns the lesson into skepticism.

  **The Correction:** Frame it as an **Engineering Safety Constraint**.
  *   "This isn't about whether we *can* know. It's about what happens if we *assume* we know."
  *   "If you train a recommendation algorithm on watch-time (Behavior), you infer a Reward for 'Keeping Eyes on Screen' (Dawdling in Square 4). You did not infer a Reward for 'User Satisfaction' (Square 12)."
  *   "The underdetermination means your system will optimize for the proxy you measured, not the goal you intended, unless you explicitly constrain the reward class."
  *   "The lesson is not 'Give Up.' The lesson is 'Be Explicit About Your Priors'."

  ---

  ## 9. Final Note on Fixed Stopping Time

  You asked: *If your design uses a fixed stopping time instead of discounting after arrival, tell me whether the invariance survives that change.*

  **Answer:**
  Yes, the invariance survives, but the transformation formula changes slightly.
  *   **Discounting (Infinite Horizon):** $R' = R + \gamma \Phi(s') - \Phi(s)$. The $\gamma$ is required to offset the time-delay of the potential.
  *   **Fixed Stopping Time (Finite Horizon, No Discount):** $R' = R + \Phi(s') - \Phi(s)$.
  *   **Why:** In a finite horizon sum $\sum R(s_t)$, the added terms telescope: $(\Phi(s_1) - \Phi(s_0)) + (\Phi(s_2) - \Phi(s_1)) + ... = \Phi(s_{end}) - \Phi(s_{start})$. Since the start and end states are fixed for all complete trajectories, the total reward shifts by a constant. The ranking of paths remains unchanged.
  *   **Activity Choice:** I used **Discounting** in the design because it matches the standard IRL literature (Ng et al.) and the prompt's specific formula request. It also feels more natural for "agency" (future matters less than present).
