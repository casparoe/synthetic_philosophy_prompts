      *   *Self-Correction on Step 3:* "Dead-hand" needs to be defined operationally. Is there *any* mechanism to void it?
      *   *Self-Correction on Case 3:* Ensure the reasoning is clear why this fails. It treats a symptomatic state (depression) as a stable value system, freezing treatment options inappropriately.

  8.  **Final Polish:**

      *   Tone: Professional, clinical, ethical, authoritative but humble regarding limits.
      *   Formatting: Use boxes or clear separators for the "Flowchart" feel.
