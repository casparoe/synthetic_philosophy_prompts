      *   **Required Steps:**
          1.  Procedural Autonomy (reflective process) vs. Locking Substantive Preference.
          2.  Specific Anticipated Failure Mode vs. Blanket Restriction.
          3.  Dead-Hand Provision (irreversible) vs. Reversible Trigger (cost/delay).
          4.  Revocation Possibility (Second-order eval vs. Instant override).
          5.  Outcome Alignment (Crisis-self rejection vs. Stable-self alignment).
      *   **Requirements:** Specify sufficient answers, termination points (do-not-implement/refer), flag judgment calls (value change vs. symptom distortion).
      *   **Applications:** Apply to three specific cases (Alcohol/Disulfiram, Bipolar/Lithium/Manic Release, Depression/Antidepressant Freeze).
      *   **Constraints:** Honest about limits (metaphysics, legal rights, paternalism mask), distinguish soft vs. hard precommitment, include final sign-off line.
      *   **Format:** Practitioner-facing flowchart in words.

  2.  **Deconstruct the Philosophical/Ethical Core:**

      *   *Ulysses Contract:* Binding future self to protect long-term goals from temporary impairment (e.g., tying self to mast to resist Sirens). Ethical justification: Autonomy over time.
      *   *Constitutional Precommitment:* Structural rules constraining options regardless of preference (e.g., laws). In clinical context, this risks becoming paternalism if the "constitution" is written by the institution, not the patient.
      *   *Procedural Autonomy:* Can the patient think about *how* they decide, not just *what* they decide?
      *   *Dead-Hand Control:* When the past self tyrannizes the future self without recourse, often problematic if values genuinely shift.
      *   *Soft vs. Hard:* Soft allows override with friction; hard blocks override entirely.

  3.  **Drafting the Procedure (The "Ulysses Protocol Evaluation Tool" - UPET):**

      *   *Structure:* Needs to look like a flowchart but in text. Step-by-step with "Pass," "Fail," and "Flag" options.
      *   *Time Limit:* Keep questions concise.
      *   *Stop Conditions:* If a critical failure occurs, stop and recommend against implementation.
      *   *Judgment Flags:* Explicitly mark where clinical intuition overrides objective data.

      *   *Step 1 (Procedural Autonomy):* Focus on the *process* of signing. Did they understand they could change their mind later? Or did they just say "Yes" to please staff?
      *   *Step 2 (Specific Failure Mode):* Is it targeted? "No drugs" is okay; "No leaving the building ever" is too broad.
      *   *Step 3 (Dead-Hand):* Is it irreversible? If the patient changes their *mind* (not just symptoms), can they get out?
      *   *Step 4 (Revocation):* How hard is it to break the contract? Needs a "cooling off" or second opinion, not just "No."
      *   *Step 5 (Alignment):* Does this serve the *stable* self? This is the hardest philosophical jump. Needs markers for "symptom" vs. "value change."

  4.  **Developing the Three Cases:**

      *   *Case 1 (Alcohol/Disulfiram):* Classic Ulysses. Specific trigger (alcohol on breath). Reversible (stop med). Aligns with stable goal (sobriety). *Likely Pass.*
      *   *Case 2 (Bipolar/Lithium/Manic):* High stakes. Mania impairs insight. Contract blocks discharge. *Likely Pass with Flags* (needs strong evidence that current demand is manic, not rational).
      *   *Case 3 (Depression/Antidepressant Freeze):* The "Unwelcome Result." Patient binds self to *no changes* in meds during depression. But depression *is* the state requiring change. This is a dead-hand control that prevents treatment adaptation. *Fail.* This challenges the clinical team's desire for compliance.

  5.  **Refining the Limits and Sign-off:**

      *   Must state clearly: This is not legal advice. This doesn't solve the "Who is the real self?" metaphysical problem.
      *   Sign-off needs to distinguish Evidence vs. Judgment.

