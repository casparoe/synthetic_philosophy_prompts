answer: |-
  # Ulysses Protocol Evaluation Tool (UPET)
  **Version 1.0 | Clinical Ethics Office | Residential Treatment Facility**

  **Purpose:** To operationalize the ethical distinction between autonomy-preserving precommitment (Ulysses contracts) and institutional paternalism (constitutional precommitment).
  **Time Allocation:** Approx. 30 minutes per case.
  **User:** Clinical Staff / Ethics Designee (Non-Legal).
  **Limitations:** This tool does not constitute legal advice, does not resolve metaphysical disputes regarding personal identity, and does not override statutory patient rights. It flags ethical risk, not legal liability.

  ---

  ## PART I: THE DECISION PROCEDURE (FLOWCHART)

  **INSTRUCTION:** Proceed sequentially. At each step, select **PASS**, **FAIL**, or **FLAG**.
  *   **PASS:** Proceed to next step.
  *   **FAIL:** **STOP.** Do not implement protocol. Refer to Ethics Board if contesting.
  *   **FLAG:** Proceed with caution. Document justification. Requires Senior Clinician co-signature.

  ### STEP 1: Procedural Autonomy Assessment
  **Question:** Does the execution of this contract demonstrate the patient's ability to revise preferences through a legitimate reflective process, or does it merely lock in a past substantive preference without a mechanism for reflection?

  *   **Evidence Required:** Documentation of a "cooling-off" period between proposal and signing; patient articulation of *why* they want to be bound (not just *what* they want); evidence patient understands they are restricting future choice.
  *   **PASS:** Patient articulates a long-term goal (e.g., "I want to stay sober") and identifies a specific threat to that goal (e.g., "When I crave, I lie"). Patient acknowledges the contract can be reviewed.
  *   **FAIL:** Patient signs immediately upon admission under duress (e.g., "Sign this or you can't enter"); Patient cannot explain the consequence of the contract beyond "I have to do it."
  *   **FLAG:** Patient has fluctuating capacity but signs during a lucid interval. *Action:* Require independent witness to capacity assessment.

  ### STEP 2: Specific Failure Mode Targeting
  **Question:** Does the binding mechanism target a specific anticipated failure mode (e.g., acute withdrawal, manic escalation) rather than imposing a blanket restriction on liberty or treatment?

  *   **Evidence Required:** The trigger for the restriction must be objective or clinically verifiable (e.g., positive tox screen, YMRS score > 20), not subjective staff discretion.
  *   **PASS:** Restrictions activate *only* upon defined clinical markers (e.g., "If alcohol is detected on breath...").
  *   **FAIL:** Restrictions are permanent or blanket (e.g., "Patient cannot request discharge for 1 year regardless of status").
  *   **FLAG:** Trigger relies on clinical judgment of "agitation" without scale. *Action:* Define specific behavioral metrics in the contract.

  ### STEP 3: Dead-Hand Provision Check
  **Question:** Does the contract include an irreversible institutional hold that outlasts any change in the patient's values or circumstances, versus a reversible trigger with a defined cost or delay?

  *   **Evidence Required:** A defined pathway to void the contract if the patient's *stable* values change, distinct from symptomatic impulsivity.
  *   **PASS:** Contract expires automatically after a set period or upon achievement of milestones; includes a "sunset clause."
  *   **FAIL:** Contract is indefinite or requires institutional approval to void that is functionally impossible to obtain (e.g., "Requires Board Vote" where Board meets quarterly).
  *   **FLAG:** Revocation requires a 72-hour hold. *Action:* Ensure 72 hours is clinically justified for safety, not administrative convenience.

  ### STEP 4: Revocation Architecture
  **Question:** Is revocation during crisis structurally possible, and if so, does it require a second-order evaluation rather than an instantaneous override?

  *   **Evidence Required:** A mechanism for the "Crisis Self" to appeal to the "Stable Self's" intent without granting immediate release that endangers safety.
  *   **PASS:** Patient can request review; review involves an independent clinician not involved in current care; decision rendered within 24 hours.
  *   **FAIL:** Patient requests revocation and is told "You signed, no." (Absolute bar).
  *   **FLAG:** Revocation requires patient to be symptom-free for 48 hours before request is heard. *Action:* Verify this does not create a catch-22 (e.g., impossible for manic patient to be symptom-free to request help).

  ### STEP 5: Outcome Alignment (The "Stable Self" Test)
  **Question:** If enforced, would the protocol produce an outcome that the patient's current crisis-state self rejects but that aligns with their stable, pre-crisis value system? Are there clear markers for when this alignment is ambiguous?

  *   **Evidence Required:** Comparison of current refusal against prior written statements of values (Advance Directives, prior therapy notes).
  *   **PASS:** Current refusal is clearly inconsistent with long-term stated values (e.g., "I value life" vs. "Let me leave to use drugs").
  *   **FAIL:** Current refusal aligns with long-term values (e.g., Patient consistently values spiritual healing over medical intervention, contract forces meds).
  *   **FLAG:** Ambiguity exists between "symptomatic distortion" and "authentic value change." *Action:* **MANDATORY ETHICS BOARD REFERRAL.** Do not enforce until resolved.

  ---

  ## PART II: CASE APPLICATIONS

  ### CASE 1: The Alcohol-Use Disorder Protocol
  **Scenario:** Patient A (SUD) binds herself to a 30-day discharge-block and mandatory disulfiram administration upon readmission if alcohol is detected on her breath.
  **UPET Application:**
  1.  **Procedural Autonomy:** **PASS.** Signed 48 hours after admission; patient articulated fear of relapse impulse.
  2.  **Specific Failure Mode:** **PASS.** Trigger is objective (alcohol on breath/tox screen).
  3.  **Dead-Hand:** **PASS.** 30-day limit; disulfiram can be medically held if liver enzymes spike (medical safety override).
  4.  **Revocation:** **FLAG.** Revocation requires 24-hour review. (Risk: 24 hours is long for a distressed patient, but acceptable for safety stabilization).
  5.  **Alignment:** **PASS.** Stable self values sobriety; Crisis self values immediate relief. Contract protects Stable self.
  **Result:** **IMPLEMENT.** (Note Step 4 Flag requires monitoring of review timeliness).

  ### CASE 2: The Bipolar I Remission Protocol
  **Scenario:** Patient B (Bipolar I, in remission) contracts to maintain lithium and block discharge requests during manic phases. Patient is now manic and demanding immediate release.
  **UPET Application:**
  1.  **Procedural Autonomy:** **PASS.** Executed during documented remission with psychiatrist witness.
  2.  **Specific Failure Mode:** **PASS.** Trigger is manic phase (defined by YMRS score > 20).
  3.  **Dead-Hand:** **FLAG.** Contract states "No discharge until treating physician clears." This risks being a Dead-Hand if the physician is biased. *Mitigation:* Add independent second opinion for discharge denial.
  4.  **Revocation:** **PASS.** Patient has requested revocation; protocol mandates second-order evaluation by independent psychiatrist.
  5.  **Alignment:** **FLAG.** High risk. Is the demand for release a symptom of mania (grandiosity) or a genuine value shift (rejecting side effects)?
      *   *Judgment Call:* Evidence shows patient previously documented side effects as "worth it for stability." Current demand is driven by delusion of "cured status."
  **Result:** **IMPLEMENT WITH CONDITIONS.** Enforce medication hold, but trigger independent review for discharge request within 12 hours (tighter than standard) to mitigate Dead-Hand risk.

  ### CASE 3: The Depressive Rigidity Protocol (The Unwelcome Result)
  **Scenario:** Patient C (Recurrent Major Depression) is currently in a moderate depressive episode. They sign a protocol binding themselves to refuse *all* future antidepressant changes for 6 months, stating, "I need consistency, I always change my mind and get worse." The clinical team believes this ensures compliance. Patient now wishes to adjust dosage due to severe side effects.
  **UPET Application:**
  1.  **Procedural Autonomy:** **FLAG.** Signed *during* active depressive episode. Capacity to reflect on future values is compromised by hopelessness/cognitive rigidity inherent to the depression.
  2.  **Specific Failure Mode:** **FAIL.** "No medication changes" is a blanket restriction, not a targeted failure mode. It prevents clinical adaptation to side effects or non-response.
  3.  **Dead-Hand:** **FAIL.** 6-month freeze on medical adjustment is an irreversible institutional hold that outlasts clinical circumstances. It privileges the past self's fear of change over the future self's physiological reality.
  4.  **Revocation:** **FAIL.** Protocol states "No changes permitted." No structural path to request adjustment without voiding the whole contract.
  5.  **Alignment:** **FAIL.** The "Stable Self" values health. Preventing medical adjustment due to side effects harms health. The contract reflects the *depressive* self's rigidity, not the *stable* self's values.
  **Result:** **DO NOT IMPLEMENT. VOID CONTRACT.**
  **Clinical Friction:** The team argues enforcement prevents "churning" (frequent med changes).
  **Ethics Ruling:** This is paternalism masked as precommitment. The contract treats a symptom of the disorder (indecisiveness/rigidity) as a stable value. Enforcing it substitutes institutional convenience for patient welfare. **Refer to Ethics Board for policy update on med-freeze contracts.**

  ---

  ## PART III: LIMITS AND DISCLAIMERS

  **What This Procedure Is NOT:**
  1.  **A Legal Shield:** This tool does not guarantee immunity from liability or satisfy all statutory requirements for involuntary hold. Legal counsel must review final contract language.
  2.  **A Metaphysical Resolver:** This tool cannot prove whether the "Crisis Self" is the "Real Self." It operates on the *best available evidence* of value continuity, not ontological truth.
  3.  **A Substitute for Capacity:** A passing UPET score does not override a finding of lacking decision-making capacity. If the patient lacks capacity *now*, standard surrogate decision-making laws apply, regardless of the contract.
  4.  **A Ban on Paternalism:** This tool admits that "Hard Precommitment" is inherently paternalistic. It merely seeks to ensure that the paternalism is *authorized by the patient's prior autonomy* rather than imposed by the institution.

  **The "Paternalism Mask" Warning:**
  If staff find themselves arguing that "The patient doesn't know what's good for them" to justify enforcing a contract that fails Step 3 (Dead-Hand) or Step 5 (Alignment), the procedure is being misused. The contract must serve the patient's *values*, not the facility's *risk management*.

  ---

  ## PART IV: MANDATORY SIGN-OFF LINE

  **Protocol ID:** _______________ **Date:** _______________
  **Evaluator:** _______________ **Role:** _______________

  **Evidence vs. Judgment Record:**
  *   Steps satisfied by **Documentary Evidence** (e.g., signed forms, lab results, prior directives): [ ] Step 1 [ ] Step 2 [ ] Step 3 [ ] Step 4 [ ] Step 5
  *   Steps satisfied by **Clinical Judgment** (e.g., assessment of value alignment, symptom distortion): [ ] Step 1 [ ] Step 2 [ ] Step 3 [ ] Step 4 [ ] Step 5

  **Decision:**
  [ ] **APPROVED** (All Pass/Flags mitigated)
  [ ] **REJECTED** (One or more Fail conditions met)
  [ ] **REFER TO ETHICS BOARD** (Step 5 Flag: Ambiguous Value Alignment)

  **Signature:** __________________________ **Date:** _______________
  *(Signature certifies that the evaluator has run the UPET sequence and that the "Clinical Judgment" items reflect a good-faith attempt to distinguish symptom from value, acknowledging the limits of this procedure.)*
