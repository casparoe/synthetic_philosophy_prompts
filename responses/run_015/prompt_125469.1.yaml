answer: |-
  A senior behaviorist and his grad student are watching a human subject through the one-way glass of a modified Skinner box. There's a lever on the wall and a screen displaying a social media feed.

  "He hasn't pressed the lever in four hours," the professor says, checking his clipboard. "Darwinians die, Skinnerians learn, Popperians let their hypotheses die in their stead... so what is this guy? Extinct?"

  "No," says the grad student. "He's Gregorian."

  "Ah. Using cultural tools to bypass the hardware?"

  "Sort of. He read a self-help book that said external validation is toxic. So he stopped pressing the lever for the food pellet."

  "Good. Extinction of the conditioned response."

  "Not exactly. He started pressing a *different* lever in his head. Every time he resists the food pellet, he writes a post about his discipline, checks his likes, and gets a dopamine hit from the audience."

  The professor squints through the glass. "So he's still chasing a reward. He's just moved the goalposts."

  "Yep. He's reprogrammed his own Skinnerian reward structure using language. He's conditioning himself to feel superior about being unconditionable."

  "So he's a Skinnerian creature running Gregorian software?"

  "Worse. He's a Skinnerian creature that read a self-help book and convinced itself the treat isn't worth it... unless the treat is convincing other people the treat isn't worth it."

  The professor sighs and turns off the monitor. "Put him back in the general population. He's too expensive to feed."

  "Why? He's not eating the pellets."

  "Exactly. He's fasting for content. And I'm not paying for his bandwidth."
