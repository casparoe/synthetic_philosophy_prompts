prompt: |-
  I run a small cause-prioritization consultancy and we take on a new cause proposal roughly every two weeks. Each one gets a two-hour workshop where my team — three people, none of us with a stats background — is supposed to score it on importance, tractability, and neglctedness and come out with a fund / fund-with-reservations / pass call that I and one of my partners have to be able to defend in a client meeting. Right now the process is basically vibes plus a spreadsheet, and I keep hitting the same failure modes. We score a cause high on neglectedness because almost nobody's working on it, but then it turns out the reason nobody's working on it is that the people who could work on it already tried and found it intractable, so "neglected" ended up being a proxy for "we don't know how to do this." And we score importance in whatever units the proposal comes in — QALYs, dollars of economic output, "units of alignment progress" — and then try to add them across causes, which is nonsense.

  Can you write me a decision procedure my team can actually run in that two-hour slot? I want the questions in the order we should ask them, what counts as a sufficient answer to each, and the exact point where the procedure stops and hands the call to a person because the question is one of values rather than facts. Three things it has to handle. First, the neglectedness score has to seperate "few people are working on this because it's hard to even understand what the problem is" from "few people are working on this because the people who could work on it are already working on it and hitting a wall" — I think those are different and I want the procedure to catch the difference, not just count heads. Second, the importance score has to be doable without converting everything to one unit, because we're not going to fake a QALY number for a cause that's about something we can't quantify. Third, tractability has to tell the difference between a research bet, where the next step is "do more theory" and the payoff is option value, and an action, where the next step is a concrete intervention with a payoff curve we can at least sketch.

  Then run it on two proposals. One is a two-year research program on a high-tail-risk AI safety problem where the importance is potentially enormous but the only "next step" is more theory and nobody knows if the theory will pan out — I think the procedure should be honest that this is a research bet with a tail-risk importance estimate, not an expected-value action, and score it that way even if that means a lower number than the importance alone would suggest. The other is a cause that's neglected only because it's embarrassing to talk about publicly, so the neglectedness is real but it's going to evaporate the moment we fund it and put our name on it — I think the procedure should flag that as a decaying score rather than a stable property.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Runs a small cause-prioritization consultancy (3 people, no stats background).
      *   **Current Process:** 2-hour workshops, "vibes + spreadsheet," scoring Importance, Tractability, Neglectedness (ITN).
      *   **Pain Points:**
          *   Neglectedness confuses "hard to understand" with "hit a wall."
          *   Importance tries to aggregate incompatible units (QALYs vs. dollars vs. alignment units).
          *   Tractability confuses "research bet/option value" with "concrete intervention."
          *   Need to defend decisions to clients.
      *   **Requirements for the New Procedure:**
          *   Fit within a 2-hour slot.
          *   Specific question order.
          *   Criteria for "sufficient answer."
          *   Clear hand-off point from fact-analysis to value-judgment.
          *   Must handle the three specific failure modes above.
          *   Must be tested on two specific hypothetical proposals (AI Safety Research Bet, Embarrassing/Neglected Cause).

  2.  **Deconstruct the Failure Modes & Design Solutions:**

      *   *Failure Mode 1: Neglectedness (The "Why" vs. The "How Many").*
          *   *Solution:* Don't just count heads. Ask *why* they aren't there. Is it a barrier to entry (skill/capital) or a barrier of nature (intractability)?
          *   *Procedure Step:* "The Barrier Audit." Distinguish between *Capacity Neglectedness* (we lack people) and *Viability Neglectedness* (we lack a path).

      *   *Failure Mode 2: Importance (Unit Aggregation).*
          *   *Solution:* Stop trying to add apples and oranges. Use a "Magnitude & Scope" matrix instead of a single number. Compare causes via *dominance* or *thresholds* rather than summation. Or, use a "Scale Anchor" (e.g., compare to a known baseline like "malaria nets" or "AI x-risk") without converting units. Let's go with a *Comparative Magnitude* approach using ordinal ranking within categories, not cardinal summation.
          *   *Procedure Step:* "The Scale Anchor." Don't calculate total utility. Ask: "If this succeeds, does it change the trajectory of the system or just optimize a parameter?"

      *   *Failure Mode 3: Tractability (Research vs. Action).*
          *   *Solution:* Distinct tracks. Research = Option Value/Information Gain. Action = Direct Impact. Don't score them on the same axis.
          *   *Procedure Step:* "The Pathway Classification." Explicitly label as *Exploration* or *Exploitation*. Score Exploration on "Learning Potential," Score Exploitation on "Implementation Feasibility."

      *   *The "Values vs. Facts" Hand-off:*
          *   Facts: What is the world like? (Constraints, existing work, technical barriers).
          *   Values: How much do we care about this specific outcome vs. others? (Risk tolerance, time preference).
          *   *Decision Point:* After the "Pathway Classification" and "Scale Anchor," the team has the facts. The "Fund/Pass" decision is where values enter.

  3.  **Drafting the Procedure (The "ITN 2.0" Protocol):**

      *   *Timeboxing:* 2 hours is tight. Need strict segments.
      *   *Structure:*
          1.  Prep (Pre-work).
          2.  Phase 1: Tractability & Pathway (30 mins) - *Get this first because if it's impossible, nothing else matters.*
          3.  Phase 2: Neglectedness & Barriers (45 mins) - *Dig into the "why".*
          4.  Phase 3: Importance & Scale (30 mins) - *Qualitative magnitude.*
          5.  Phase 4: Synthesis & Decision (15 mins) - *The Value Hand-off.*

      *   *Refining the Questions:*
          *   Need to ensure the "Neglectedness" fix is prominent.
          *   Need to ensure "Importance" doesn't force unit conversion.
          *   Need to ensure "Tractability" splits Research vs. Action.

  4.  **Developing the Test Cases:**

      *   *Case 1: AI Safety Research Bet.*
          *   Expectation: High Importance (Tail Risk), Low/Medium Tractability (Action), High Tractability (Learning), Neglectedness needs careful parsing (is it hard or just new?).
          *   Procedure Output: Should flag as "Option Value Play," not "Direct Impact."
      *   *Case 2: Embarrassing Cause.*
          *   Expectation: High Neglectedness (currently), Low Durability (evaporates upon funding).
          *   Procedure Output: Should flag "Transient Neglectedness" or "Catalytic Risk."

  5.  **Iterating on the Procedure (Self-Correction during drafting):**

      *   *Critique:* Is 2 hours enough for 3 people to discuss deeply?
      *   *Fix:* Emphasize *pre-work*. The workshop is for *debate*, not data gathering.
      *   *Critique:* How do we avoid unit conversion on Importance?
      *   *Fix:* Use "Classes of Impact" (Local, Systemic, Existential) rather than numbers.
      *   *Critique:* Where is the value hand-off?
      *   *Fix:* Make the final vote explicit: "Given these facts, does this match our risk profile?"

  6.  **Finalizing the Output Structure:**

      *   Introduction: Acknowledge the constraints.
      *   Pre-Work Requirements (Crucial for time management).
      *   The 2-Hour Protocol (Step-by-Step).
      *   The "Values Hand-off" Definition.
      *   Simulation 1 (AI Safety).
      *   Simulation 2 (Embarrassing Cause).
      *   Closing advice.

  7.  **Writing the Content (incorporating specific constraints):**

      *   *Neglectedness:* Add the "Graveyard Check." (Did people try and fail?)
      *   *Importance:* Use "Reference Class Forecasting" instead of unit math.
      *   *Tractability:* Split into "Intervention Logic" vs. "Research Logic."
      *   *Test Cases:* Run the logic strictly to show how it catches the specific errors mentioned in the prompt.

  8.  **Review against Prompt:**
      *   Order of questions? Yes.
      *   Sufficient answer criteria? Yes.
      *   Values vs. Facts hand-off? Yes.
      *   Handle Neglectedness nuance? Yes (Graveyard Check).
      *   Handle Importance units? Yes (Reference Classes).
      *   Handle Tractability nuance? Yes (Research vs. Action tracks).
      *   Run on two proposals? Yes.

  9.  **Final Polish:** Ensure tone is professional, actionable, and respectful of the team's non-stats background. (Avoid jargon like "Bayesian updating," use "Confidence Check" instead).

  *(Self-Correction during drafting the simulation)*: Make sure the AI Safety simulation doesn't just say "Pass." It might be a "Fund with Reservations" because of option value. The procedure needs to allow for that distinction. The prompt says "score it that way even if that means a lower number," implying the *type* of score changes, not necessarily a rejection. I will frame it as a "Research Track" recommendation.

  *(Self-Correction on Embarrassing Cause)*: The prompt says neglectedness will "evaporate." The procedure needs a specific check for "Durability of Neglectedness." I will add a "Crowding-In Risk" question.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a **2-Hour Cause Prioritization Protocol**. It is designed to replace "vibes + spreadsheet" with a structured interrogation of the proposal's mechanics. It assumes your team has read a 2-page brief beforehand (mandatory pre-work).

  The core philosophy is **Decoupling**. You are currently conflating *facts about the world* (is this hard? is anyone doing it?) with *values about the world* (do we care more about tail risks or sure bets?). This procedure separates them.

  ### Part 1: The Pre-Work (Required)
  *Do not start the clock until these are done.*
  1.  **The One-Pager:** The proposer must submit a 2-page max brief answering: What is the specific bottleneck? Who else is trying? What is the immediate next step?
  2.  **The Silent Read:** Each team member spends 15 mins before the meeting annotating the brief. No discussion yet.

  ---

  ### Part 2: The 2-Hour Workshop Protocol

  #### Phase 1: Tractability & Pathway Classification (30 Minutes)
  *Goal: Determine if this is an Action or a Research Bet. Do not score "Importance" yet.*

  **Question 1: The Mechanism Check**
  *   **Ask:** "What is the specific causal mechanism between $1 spent and the outcome achieved? Is it a direct intervention (e.g., bednets) or an information gain (e.g., theory)?"
  *   **Sufficient Answer:** A sentence starting with "By funding X, we enable Y, which leads to Z."
  *   **Failure Mode:** If the answer is "It helps the field understand," classify immediately as **Research Track**. If the answer is "It directly reduces risk/suffering," classify as **Action Track**.

  **Question 2: The Next-Step Test**
  *   **Ask:** "If we fund this, what exists in 12 months that does not exist today? Is it a deployed solution or a paper/proof?"
  *   **Sufficient Answer:** Concrete deliverable (e.g., "A verified protocol" vs. "A peer-reviewed theorem").
  *   **Decision Rule:**
      *   If **Research Track**: Stop scoring "Tractability" as "Likelihood of Success." Score it as **"Information Value."** (Will this tell us if the path is dead or alive?)
      *   If **Action Track**: Score "Tractability" as **"Implementation Feasibility."**

  #### Phase 2: Neglectedness & The Barrier Audit (45 Minutes)
  *Goal: Distinguish between "Opportunity" and "Graveyard."*

  **Question 3: The Graveyard Check (Crucial Fix)**
  *   **Ask:** "Who *could* be working on this but isn't? Is it generalists, or is it the specific experts who would know if it's impossible?"
  *   **Sufficient Answer:** Names or sectors of specific experts (e.g., "Top cryptographers" or "Developmental biologists").
  *   **Decision Rule:**
      *   If the people *not* working on it are the ones with the skills to solve it → **Red Flag (Likely Intractable).**
      *   If the people *not* working on it are generalists/capital → **Green Flag (Capacity Constrained).**

  **Question 4: The Crowding-In Risk (Crucial Fix)**
  *   **Ask:** "If we fund this and announce it, does the neglectedness disappear? Is the barrier social (stigma) or structural (difficulty)?"
  *   **Sufficient Answer:** "Social barriers will drop if we legitimize it" OR "Structural barriers remain regardless of funding."
  *   **Decision Rule:** If the neglectedness relies on stigma, mark the score as **Decaying**. It is not a persistent advantage.

  #### Phase 3: Importance & Scale Anchoring (30 Minutes)
  *Goal: Assess magnitude without fake unit conversion.*

  **Question 5: The Reference Class Anchor**
  *   **Ask:** "If this succeeds completely, which existing benchmark does it match? Is it 'Local Policy Change,' 'Global Health Intervention,' or 'Existential Risk Reduction'?"
  *   **Sufficient Answer:** Pick one bucket. Do not allow "It's worth 500 QALYs and also reduces x-risk." Pick the *dominant* effect.
  *   **Decision Rule:** Causes in different buckets cannot be mathematically summed. They must be ranked by **Portfolio Fit**. (e.g., "We already have 3 Existential Risk bets; do we need another?")

  **Question 6: The Tail-Risk Disclosure**
  *   **Ask:** "Is the value concentrated in a 1% chance of a massive payoff, or a 90% chance of a moderate payoff?"
  *   **Sufficient Answer:** "High variance/low probability" OR "Low variance/high probability."
  *   **Decision Rule:** High variance proposals cannot be compared to low variance proposals using expected value alone. They must be labeled **Lottery Tickets**.

  #### Phase 4: Synthesis & The Value Hand-off (15 Minutes)
  *Goal: Move from Facts to Decision.*

  **The Fact Summary:**
  By now, you have a profile, not a score. It looks like this:
  *   **Track:** Research (Option Value)
  *   **Neglectedness:** Durable (Expert Capacity Constraint)
  *   **Scale:** Existential (High Variance)

  **The Value Hand-off Point:**
  *   **Statement:** "The facts are established. The remaining question is: Does our portfolio need more Option Value or more Direct Impact right now?"
  *   **Action:** The Lead and Partner vote. This is no longer about data; it is about **Risk Tolerance** and **Strategy**.
  *   **Output:** Fund / Fund with Reservations (Milestones) / Pass.

  ---

  ### Part 3: Running the Procedure on Your Proposals

  Here is how the protocol handles the two specific failure modes you described.

  #### Proposal A: The AI Safety Research Bet
  *Context: High-tail-risk, theory-heavy, no concrete intervention yet.*

  1.  **Phase 1 (Tractability):**
      *   *Mechanism Check:* "By funding X, we enable better theory on alignment." → **Classified: Research Track.**
      *   *Next-Step Test:* Deliverable is a paper/proof, not a safety system.
      *   *Scoring:* We stop asking "Will this save the world?" and start asking "Will this tell us if alignment is possible?"
  2.  **Phase 2 (Neglectedness):**
      *   *Graveyard Check:* Are experts avoiding it? No, experts are flocking to it, but the *math* is hard.
      *   *Result:* Neglectedness is **Low** (in terms of capacity), but **High** (in terms of solvability). The procedure prevents you from scoring "Neglected" just because it's unsolved.
  3.  **Phase 3 (Importance):**
      *   *Reference Class:* Existential Risk Reduction.
      *   *Tail-Risk Disclosure:* High Variance/Low Probability.
      *   *Result:* Labeled as **Lottery Ticket**.
  4.  **Phase 4 (Decision):**
      *   *Fact Summary:* Research Track + Low Neglectedness (Expert attention) + High Variance Lottery Ticket.
      *   *Value Hand-off:* "We know this is a long-shot research bet. Do we want to spend 10% of our portfolio on option value?"
      *   *Outcome:* **Fund with Reservations.** (Because it scores high on Option Value, not Direct Impact). The procedure prevented you from treating it like a standard intervention.

  #### Proposal B: The Embarrassing Cause
  *Context: Socially stigmatized, few workers, but funding legitimizes it.*

  1.  **Phase 1 (Tractability):**
      *   *Mechanism Check:* Direct Intervention.
      *   *Next-Step Test:* Concrete service delivery.
      *   *Classified:* **Action Track.**
  2.  **Phase 2 (Neglectedness):**
      *   *Graveyard Check:* Why are people avoiding this? Not because it's hard. Because it's awkward.
      *   *Crowding-In Risk:* "If we fund this and announce it, does the neglectedness disappear?"
      *   *Answer:* Yes. Other funders will feel safe to jump in once we break the stigma.
      *   *Result:* Neglectedness marked as **Decaying**.
  3.  **Phase 3 (Importance):**
      *   *Reference Class:* Local/Regional Policy or Health.
      *   *Tail-Risk:* Low Variance.
  4.  **Phase 4 (Decision):**
      *   *Fact Summary:* Action Track + Decaying Neglectedness + Moderate Scale.
      *   *Value Hand-off:* "This is a 'First Mover' play. We get the credit for opening the door, but the window closes fast. Is speed a priority for us?"
      *   *Outcome:* **Fund (Fast)** or **Pass**. If you can't move money in 30 days, the procedure tells you to **Pass**, because the "Neglectedness" asset will rot before you deploy.

  ### Why This Works for Your Team

  1.  **No Stats Required:** You aren't calculating Expected Value. You are classifying *types* of bets (Lottery vs. Income, Research vs. Action).
  2.  **Defensible:** In the client meeting, you don't say "We scored it 7/10." You say, "We classified this as a High-Variance Research Bet with Decaying Neglectedness. Our portfolio strategy prioritizes Stable Action Bets this quarter." That is a strategic defense, not a mathematical one.
  3.  **Stops the "Vibes":** The "Graveyard Check" and "Crowding-In Risk" are binary gates. If you can't answer them, you don't move to Phase 3. This prevents you from falling in love with a cause before you know why it's neglected.

  ### The "Stop" Rule
  If, at the end of Phase 2, the team cannot agree on *why* the cause is neglected (Graveyard vs. Capacity), **the procedure stops.** You cannot score Importance on a cause whose bottlenecks you do not understand. You issue a "Request for Information" and reschedule. This saves you from making a "Pass/Fund" call on bad data.
