      *   **The User's Hypothesis:** Economists talk about *rational choice*; Philosophers (Temkin) talk about *evaluative structure*. "Better than" is overloaded.
      *   **The Complication:** Broome argues "better than" is like "longer than" (metaphysical/structural), not just about choice.
      *   **The Task:** Diagnose the disagreement (Verbal? Substantive? Upstream?). Explain *why* using specific arguments from each side. Suggest what progress would look like. Be honest about whether it's a genuine hard problem or confusion.

  2.  **Deconstruct the Disagreement:**
      *   **Side A: The Transitivists (Broome, Standard Economics).**
          *   Core Claim: "Better than" is a *comparative concept*. It has a logical structure akin to "greater than."
          *   Argument: If $A > B$ and $B > C$, logic dictates $A > C$. If you deny this, you aren't talking about *betterness*, you're talking about something else (e.g., "choice-worthy," "preferable").
          *   Metaphor: Length. You can't have a stick longer than another, which is longer than a third, but the third is longer than the first.
          *   Role of Choice: Choice *reveals* betterness, but betterness exists independently as a normative fact.
      *   **Side B: The Intransitivists (Temkin, Rachels, Voorhoeve).**
          *   Core Claim: Our considered judgments about value are intransitive in spectrum cases.
