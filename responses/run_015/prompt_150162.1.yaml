answer: |-
  There is no single, canonical Greek-derived noun (like "paradigm" or "gestalt") that exclusively names this specific configuration. However, philosophy of science recognizes this pattern precisely, and it sits at the intersection of three well-defined concepts: **Empirical Equivalence**, **Theoretical Equivalence**, and **Lakatosian Degeneration**.

  If you require a label to search for in the literature, the most accurate technical description is **"Defensive Conventionalism via Asserted Theoretical Equivalence."** In the context of methodology, it is identified as a **Degenerating Problemshift** (Lakatos) that relies on a **Notational Variance Claim**.

  Here is the detailed mapping of the phenomenon, its boundaries, and its status relative to the concepts you mentioned.

  ### 1. The Core Phenomenon: Empirical vs. Theoretical Equivalence
  The configuration you describe is a dispute over **Theoretical Equivalence** grounded in **Empirical Equivalence**.

  *   **Empirical Equivalence (EE):** Both sides agree the theories save the phenomena (predict the same data). This is the common ground.
  *   **Theoretical Equivalence (TE):** This is the battleground.
      *   **The Defenders (Old Theory):** Argue that EE implies TE. They claim the new theory is merely a **"notational variant"** or **"reformulation"** of the old. In modern philosophy of physics (e.g., work by James Weatherall or Hans Halvorson), this is a claim of **definitional equivalence** or **intertranslatability**.
      *   **The Challengers (New Theory):** Argue that EE does *not* imply TE. They claim that while the *outputs* match, the *structures* and *ontologies* differ, and the Old Theory's ability to match them is **parasitic**.

  **The Specific Move:** The defenders are invoking a **Conventionalist** stance (reminiscent of Poincaré or Van Fraassen). They argue that since the observational consequences are identical, the choice between "caloric fluid" and "particle motion" is a matter of convention or computational convenience, not truth.

  ### 2. Distinction from Ordinary Underdetermination
  You asked how this differs from standard **Underdetermination of Theory by Data (UTD)**.
  *   **Standard UTD (Synchronic):** Typically describes two distinct theories existing *simultaneously* that account for all available data (e.g., Heisenberg's Matrix Mechanics vs. Schrödinger's Wave Mechanics in 1926). The philosophical question is usually: "Which one should we believe?"
  *   **Your Case (Diachronic/Defensive):** This is **Diachronic Underdetermination**. It occurs *during* a transition. The Old Theory is actively modifying itself *in response* to the New Theory to maintain equivalence.
  *   **The Crucial Difference:** In standard UTD, the equivalence is often seen as a logical possibility. In your case, the equivalence is **manufactured** via **ad hoc auxiliary hypotheses**. This moves the discussion from logic to **methodology**. The philosophical weight here isn't just "data doesn't fix theory," but "one theory is absorbing the other to survive."

  ### 3. Distinction from Successful Reduction
  This is not **Nagelian Reduction** or **Intertheoretic Reduction**.
  *   **Reduction:** Typically implies the New Theory (T2) is shown to be a special case or a deeper explanation of the Old Theory (T1), *or* T1 is derived from T2 via bridge laws (e.g., Thermodynamics reduced to Statistical Mechanics). Reduction is usually a sign of *progress* and *unification*.
  *   **Your Case:** The direction is reversed and defensive. T1 is not naturally deriving T2; it is **mimicking** T2 by adding contrived clauses to its "protective belt."
  *   **The Marker:** In successful reduction, the bridge laws are independently motivated. In your scenario, the "translation rules" (e.g., caloric distribution = particle velocity) are **ad hoc**: they are introduced *solely* to save T1 from falsification by T2's success.

  ### 4. The Lakatosian Diagnosis: Degenerating Problemshift
  The most robust framework for evaluating this phenomenon is **Imre Lakatos's Methodology of Scientific Research Programmes (MSRP)**.
  *   **The Hard Core:** The Old Theory's central ontology (e.g., "Heat is a substance").
  *   **The Protective Belt:** The auxiliary hypotheses added to match the New Theory's predictions.
  *   **The Diagnosis:** Lakatos would classify this as a **Degenerating Problemshift**.
      *   A **Progressive** shift predicts *novel* facts (Kinetic theory predicting the mechanical equivalent of heat).
      *   A **Degenerating** shift merely accommodates known facts or the rival's predictions post-hoc using ad hoc adjustments.
  *   **The Phenomenon:** The defenders are attempting to mask a **Degenerating Problemshift** by claiming **Theoretical Equivalence**. They argue, "We aren't degenerating; we are just speaking a different dialect." The challengers reply, "You are degenerating because your adjustments lack independent motivation."

  ### 5. Relation to Kuhn and Incommensurability
  You noted that this challenges Kuhn because there is no mutual incomprehension.
  *   **Semantic Incommensurability:** Kuhn argued that paradigms often cannot be fully translated (e.g., "mass" in Newton vs. Einstein). Your case shows **Semantic Commensurability**: both sides understand the translation.
  *   **Methodological Incommensurability:** However, this case supports a weaker, methodological version of Kuhn. The two sides agree on the *data* and the *language*, but they disagree on **Scientific Values**.
      *   **Defenders value:** Continuity, conservation of ontology, empirical adequacy.
      *   **Challengers value:** Explanatory unification, non-ad-hocness, novelty.
  *   **The Verdict:** This is not a failure of Kuhn's account so much as a boundary case showing that **incommensurability is not required for theory conflict.** It demonstrates that theory choice is not driven by logic/data alone (since those are shared) but by **axiological commitments** (what counts as a "good" explanation).

  ### 6. Is it a Genuine Failure Mode?
  Yes. In the philosophy of science, this is recognized as a **Pathology of Theory Preservation**.
  *   **The "Parasitic Theory" Objection:** Realists (like Leplin or Laudan) argue that a theory constructed solely to mimic a rival's empirical success without sharing its explanatory structure is **parasitic**. It lacks **independent support**.
  *   **Structural Realism:** Interestingly, **John Worrall's Structural Realism** offers a middle ground. He argues that in cases like Caloric vs. Kinetic, the *ontology* changes (no caloric), but the *mathematical structure* is retained. The defenders are right that the *structure* is equivalent (hence the translatability), but wrong that the *ontology* is preserved.

  ### Summary Terminology
  If you need to cite this in a paper or discussion, the most precise phrasing is:
  > **"A claim of notational variance based on manufactured empirical equivalence."**

  Or, using the Lakatosian framework:
  > **"A degenerating problemshift defended via conventionalist appeals to intertranslatability."**

  This phenomenon highlights that **Empirical Equivalence is necessary but not sufficient for Theoretical Equivalence.** The missing ingredient is **Explanatory Coherence** and the **Independent Motivating Power** of the auxiliary hypotheses. The defenders are attempting to trade on the former to hide the lack of the latter.

  ### Recommended Reading
  To explore the edges of this concept, look into:
  1.  **Imre Lakatos:** *Falsification and the Methodology of Scientific Research Programmes* (for the degenerating/progressive distinction).
  2.  **Larry Laudan & Jarrett Leplin:** *Empirical Equivalence and Underdetermination* (1991) (for why EE doesn't guarantee theoretical equality).
  3.  **John Norton:** *The Equivalence of Physical Theories* (for the modern physics perspective on when translations count as "same theory").
  4.  **John Worrall:** *Structural Realism: The Best of Both Worlds?* (for why the math translates even if the ontology doesn't).
  5.  **Bas van Fraassen:** *The Scientific Image* (for the Constructive Empiricist defense of the "notational variant" claim).

  This configuration is not a bug in the system of scientific change; it is a standard feature of how established theories resist obsolescence. It is the **last stand of a research programme** before it is abandoned not because it fails to predict, but because it becomes too cumbersome to sustain its predictive power.
