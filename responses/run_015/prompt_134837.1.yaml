answer: |-
  Here is a complete session plan designed to run in 90 minutes. It respects your constraints (no screens, no forbidden words until the end) and refines your three-team structure to ensure the mechanical distinction is sharp enough to survive a 25-minute activity.

  ### Session Overview
  *   **Topic:** Mechanisms of Self-Reproduction (Typogenetics Prelude).
  *   **Time:** 90 Minutes.
  *   **Participants:** ~14 (Split into 3 Teams of 4-5, plus 1-2 Floaters).
  *   **Forbidden Words (until Debrief):** Gödel, Self-Reference, Quine, Code, Isomorphism, DNA, Gene, Enzyme (use "Operator" or "Command" instead).
  *   **Goal:** Participants experience three distinct logical structures that all result in the same output (a copy), but rely on different loci of information.

  ---

  ### Part 1: Materials & Setup

  You need to prepare three distinct **Mission Envelopes** (one per team). Inside each envelope:
  1.  **The Input Strip:** A stiff card with a sequence of symbols.
  2.  **The Rulebook:** A small folded card defining how to process the strip.
  3.  **The Log Sheet:** Paper to record the steps taken.
  4.  **Pens & Blank Paper:** For constructing the Output Strip.

  **The System (Simplified Typogenetics)**
  To make this runnable in 25 minutes, we strip Hofstadter's system down to its logical skeleton. We are not simulating biology; we are simulating *instruction loci*.

  *   **Alphabet:** `▲` (Triangle), `●` (Circle), `■` (Square).
  *   **Goal:** Produce an **Output Strip** that is identical to the **Input Strip**.

  #### Team 1: The Universal Machine (The "Photocopier")
  *   **Locus of Information:** The System (Rulebook). The Strip is passive data.
  *   **Input Strip:** `▲ ● ■`
  *   **Rulebook:**
      1.  Read the Input Strip.
      2.  Ignore the symbols' shapes.
      3.  Draw an exact copy of the Input Strip onto the Output Paper.
      4.  Stop.
  *   **Experience:** Trivial. Fast. The specific symbols don't matter; the rule handles everything.

  #### Team 2: The Stipulated Exception (The "Scribe")
  *   **Locus of Information:** The System (Rulebook). The Strip is a specific key.
  *   **Input Strip:** `■ ■ ■`
  *   **Rulebook:**
      1.  Check the Input Strip.
      2.  **IF** the Input is exactly `■ ■ ■`, then draw `■ ■ ■` on the Output Paper.
      3.  **IF** the Input is anything else, tear up the paper and write "ERROR".
      4.  Stop.
  *   **Experience:** Fast, but feels fragile. They know if they had `■ ■ ▲`, they would fail. The intelligence is in the rule's exception clause.

  #### Team 3: The Self-Interpreter (The "Architect")
  *   **Locus of Information:** The Strip. The System is a generic interpreter.
  *   **Input Strip:** `▲ ● ■`
  *   **Rulebook:**
      1.  Look at the **first** symbol on the Input Strip.
      2.  If `▲`: Write `▲` on the Output Paper.
      3.  If `●`: Write `●` on the Output Paper.
      4.  If `■`: Write `■` on the Output Paper.
      5.  Move to the **next** symbol and repeat Step 2.
      6.  If no symbols remain, Stop.
  *   **Experience:** Slower. Procedural. They must process each part. If the strip contained a symbol *not* in the Rulebook (e.g., `★`), the machine would crash. The strip *drives* the machine.

  ---

  ### Part 2: Minute-by-Minute Timeline

  **00:00 – 05:00 | Introduction & Grouping**
  *   Welcome everyone. State the constraint: "No phones, no laptops. We are working with paper only."
  *   **Crucial Instruction:** "You are going to be split into three teams. You will receive a sealed envelope. Do not open it until I say so. Do not show your contents to other teams. Your goal is simple: Produce an Output Strip that matches your Input Strip exactly."
  *   Split into 3 teams (4-5 people each). Assign the remaining 1-2 people as "Auditors" (they rotate between tables to ensure rules are followed but cannot speak).
  *   Hand out the Envelopes.

  **05:00 – 10:00 | Role Assignment & Setup**
  *   Instruct teams to assign roles within their group (keeps everyone engaged):
      *   **Reader:** Reads the Input Strip symbols aloud.
      *   **Translator:** Consults the Rulebook and announces the action.
      *   **Scribe:** Draws the Output Strip.
      *   **Verifier:** Checks the Output against the Input at the end.
  *   Tell them: "You have 25 minutes of work time. You must log your steps on the Log Sheet. Go."

  **10:00 – 35:00 | The Activity**
  *   Teams open envelopes and work.
  *   **Facilitator Role:** Circulate. If Team 1 finishes in 3 minutes (likely), give them a "Verification Task": *Run the process again, but swap the Scribe and Reader. Log any discrepancies.* This prevents boredom/texting.
  *   If Team 3 gets stuck, remind them: "Follow the Rulebook literally. Do not infer."
  *   At 30 minutes: "5 minutes remaining. Finalize your Output Strip and Log."
  *   At 35 minutes: "Pens down. Close your envelopes. Do not discuss your Rulebook with other teams yet."

  **35:00 – 40:00 | Transition**
  *   Collect the Envelopes and Log Sheets. (Keep them safe for the debrief).
  *   Clear the tables. Leave only the whiteboard and pens.
  *   Get everyone back to the main table.

  **40:00 – 75:00 | The Debrief (The Core)**
  *   **Phase 1: The Result (5 mins)**
      *   Ask: "Did everyone succeed?" (Yes, all have matching strips).
      *   Ask: "Did everyone do the same thing?" (No).
      *   Reveal Team 1's Rulebook on the whiteboard. Ask Team 2 & 3: "Could you have used this rule?" (Team 2: Yes. Team 3: Yes, but it's different).
      *   Reveal Team 2's Rulebook. Ask: "What if the input was `■ ■ ▲`?" (Team 2 fails).
      *   Reveal Team 3's Rulebook. Ask: "What if the input was `★`?" (Team 3 fails).

  *   **Phase 2: The Locus of Information (15 mins)**
      *   Draw three columns on the whiteboard: **Team 1**, **Team 2**, **Team 3**.
      *   Ask: "Where did the instruction to copy come from?"
      *   *Target Answer:*
          *   Team 1: The Rulebook (Universal).
          *   Team 2: The Rulebook (Specific lookup).
          *   Team 3: The Strip (Compositional).
      *   **Key Question:** "In Team 3, if I change one symbol on the strip, does the meaning change?" (Yes). "In Team 1, if I change one symbol, does the meaning change?" (No).
      *   **Key Question:** "In Team 3, the strip *tells* the system what to do. In Team 1, the system *tells* the strip what to be. Which one feels more like... life?"

  *   **Phase 3: Naming the Beast (10 mins)**
      *   Now you can use the forbidden words.
      *   Explain: "Team 3 just performed a **Quine**. The data described the process that recreated the data."
      *   Explain: "This is the **Gödel Isomorphism**. A mathematical statement that refers to itself not by name (Team 2), but by structure (Team 3)."
      *   Explain: "This is **Typogenetics**. DNA doesn't copy itself because a rule says 'Copy DNA'. It copies itself because the DNA codes for enzymes that build the copier."

  **75:00 – 85:00 | The Assessment (The Fifth Strip)**
  *   Hand out a small slip of paper to each team (same slip).
  *   **The Slip:**
      *   **Input:** `▲ ▲`
      *   **Rulebook:** (Team 3's Rulebook from earlier: `▲`=Write `▲`, `●`=Write `●`, `■`=Write `■`).
      *   **Twist:** Add a new symbol to the Rulebook: `★` = "Erase Output".
  *   **The Question:** "If the Input Strip was `▲ ★`, would it copy itself? Why or why not?"
  *   **Desired Answer:** "No. Because the strip contains an instruction (`★`) that destroys the output. The strip is the program, and the program contains a self-destruct command."
  *   **Discussion:** This confirms they understand that in Team 3, the *content* dictates the *fate*, not just the system.

  **85:00 – 90:00 | Wrap Up**
  *   Briefly mention what this *doesn't* prove (Incompleteness, actual biological complexity).
  *   Assign reading for next time (the next chapter of GEB).
  *   Dismiss.

  ---

  ### Part 3: Failure Mode Analysis

  **1. "Someone freehands the answer."**
  *   *Risk:* A participant realizes the goal is just to match the strip and draws it immediately without using the Rulebook.
  *   *Mitigation:* The **Auditors** (the 1-2 floaters) are instructed to watch the *process*, not just the result. If a Scribe draws without a Translator calling a rule, the Auditors flag it as "Invalid Run."
  *   *Debrief Handle:* If this happens, use it! "One team bypassed the system. That's like a mutation that ignores the genetic code. Did it work? Yes. Was it faithful to the simulation? No."

  **2. "Biology students take over."**
  *   *Risk:* They start talking about polymerase, transcription, etc., before the debrief.
  *   *Mitigation:* Pre-brief the biology students if you know them well, or intervene gently: "For this exercise, please treat the symbols as abstract shapes, not biological bases. Stick to the Rulebook's definitions."
  *   *Debrief Handle:* "You were right to think of biology. That's exactly where this is going. But notice: in real cells, the 'Rulebook' (ribosomes) is dumb. It's the RNA that matters. Which team was that?" (Team 3).

  **3. "Team 1 finishes in 3 minutes and texts."**
  *   *Risk:* Disengagement.
  *   *Mitigation:* The "Verification Task" mentioned in the timeline (run it twice, swap roles). Also, give Team 1 a longer strip (10 symbols) while Team 3 gets 3 symbols. This balances the time load.
  *   *Debrief Handle:* "Team 1, you were fast because your system was powerful but dumb. Team 3, you were slower because your system was simple but the data was smart."

  **4. "Team 3 gets confused by the iteration."**
  *   *Risk:* They try to read the whole strip at once.
  *   *Mitigation:* The Rulebook says "Look at the **first** symbol... Move to the **next**." Make this bold. The Auditor can nudge: "What does the rule say to do after one symbol?"

  ---

  ### Part 4: What This Activity Cannot Deliver

  Be honest about this in the debrief.
  1.  **It is not Incompleteness:** This activity shows self-replication (Quines), not undecidability. It shows how a system can talk about itself, not how it can fail to prove truths about itself.
  2.  **It is not Biology:** Real DNA is messy, redundant, and epigenetic. This is a clean, logical toy model.
  3.  **It is not Consciousness:** Hofstadter goes on to argue this leads to "I". This activity only shows the mechanical prerequisite.

  ### Part 5: The Final Check (Assessment)

  Your idea of the "Fifth Strip" is excellent. Here is the specific phrasing to ensure it tests the right concept:

  **The Test:**
  Hand out a slip with **Team 3's Rulebook** (The Interpreter).
  **Input Strip:** `▲ ●`
  **Modified Rule:** `▲` = Write `▲`. `●` = **Stop Immediately**.

  **Question:** "Run this mentally. What is the Output?"
  **Correct Answer:** `▲` (Only the first symbol).
  **Why this works:** It proves they understand that in Team 3, the **sequence controls the flow**. In Team 1 (Photocopier), the output would still be `▲ ●` because the rule ignores content. In Team 2 (Stipulation), it would be "ERROR". Only Team 3's logic allows the strip to *cut its own execution short*.

  If they get this right, they understand that in the "Real" case (Team 3), the information is **internal and structural**, not external and stipulated. They have felt the isomorphism.
