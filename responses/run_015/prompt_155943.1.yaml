  ### quick note on the landscape (settled vs. contested)

  **pretty settled:**
  *   the simple conditional analysis (SCA) of dispositions is broken. everyone agrees "x is fragile iff x breaks if struck" fails because of finks and masks.
  *   finks vs. masks is a real distinction. finks remove the disposition during stimulation (martin's wire); masks keep the disposition but block the manifestation (johnston's padding).

  **genuinely contested:**
  *   are dispositions fundamental (dispositionalism) or do they reduce to categorical bases (categoricalism)? neither side has knocked the other out.
