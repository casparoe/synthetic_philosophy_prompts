  *   do finks/masks actually explain anything, or are they just labels for counterexamples?

  ***

  ### essay question (final exam)

  **question 4: the electron-beam crystal (25 pts)**

  consider a synthetic crystal, *crystex-9*. under normal mechanical stress (hammer strikes), *crystex-9* remains intact. however, when subjected to electron-beam scanning (EBM) for observation, it shatters instantly.

  write an essay addressing the following:
  1.  argue whether *crystex-9* is fragile. if so, is its fragility **masked** during hammering, **finked** during scanning, or was the disposition **never there at all**?
  2.  defend whether EBM conditions belong **inside or outside** the disposition's standard stimulus conditions.
  3.  contrast how a **dispositionalist** and a **categoricalist** would analyze the underlying property here.
  4.  explain where the distinction between finks and masks actually does **explanatory work** in this specific case (i.e., does labeling it help us predict or understand the breakage?).

  do not simply recite martin or johnson. apply the concepts to the physics of the case.

  ***

  ### model answer (sample)

  calling *crystex-9* fragile is tricky because fragility is usually tied to mechanical stress. if we stick to the folk concept, the disposition is **never there at all**. it doesn't break when hit, so it isn't fragile. instead, it has a different disposition: "ebm-shatterability." however, if we define fragility broadly as "structural instability under energy input," then EBM counts as the stimulus. in this view, the hammering conditions are **outside** the relevant stimulus conditions.

  if we insist it *is* fragile but survives hammering, we might argue the fragility is **masked**. perhaps the lattice structure resists mechanical shock (the mask) but collapses under electromagnetic interaction. this isn't a **fink**, because a fink requires the disposition to vanish *when* the stimulus occurs. here, the breaking happens *during* EBM, suggesting the disposition was present and manifested, not removed. the EBM isn't removing fragility; it's triggering it.

  a **dispositionalist** would say the crystal possesses a real, irreducible power to shatter under specific conditions (EBM). the hammer test is irrelevant because the stimulus condition is specific to the type of energy. the disposition is fundamental to the object's nature. a **categoricalist**, conversely, would look at the microstructure. they'd say there's no "power," just categorical facts about bond angles and electron clouds. the shattering is explained by physical laws acting on that structure, not by a modal property called fragility. the "disposition" is just a placeholder for the categorical base.

  the fink/mask distinction does **explanatory work** here by clarifying why standard testing fails. if we misidentify the case as a fink, we might assume the crystal changes properties when observed (like quantum collapse). but if it's a mask (or simply a mismatched stimulus), we understand the structure is stable mechanically but unstable electromagnetically. labeling it correctly prevents us from positing a mysterious property-loss mechanism. ultimately, the case shows that stimulus conditions aren't fixed; they depend on which causal pathways we care about. without clarifying the stimulus, calling it "fragile" is just noise.

  ***

  ### marking scheme (25 pts total)

  **1. verdict on fragility status (5 pts)**
  *   must clearly state if it's fragile/not fragile and justify using mask/fink/none.
  *   *classic mistake:* saying it's a fink just because it breaks during observation (finks remove the power, they don't trigger breaking).

  **2. stimulus condition argument (5 pts)**
  *   must argue whether EBM is inside/outside the stimulus conditions for fragility.
  *   *classic mistake:* assuming stimulus conditions are fixed by definition rather than arguing for them.

  **3. dispositionalist view (5 pts)**
  *   must characterize dispositions as real powers/modal properties specific to the stimulus.
  *   *classic mistake:* conflating dispositionalism with idealism or subjectivism.

  **4. categoricalist view (5 pts)**
  *   must characterize dispositions as placeholders for categorical microstructure/laws.
  *   *classic mistake:* claiming categoricalists deny things break (they deny the *property* type, not the event).

  **5. explanatory work of distinction (5 pts)**
  *   must show how labeling it mask/fink changes the physical explanation or prediction.
  *   *classic mistake:* treating fink/mask as mere semantics without causal implications.

