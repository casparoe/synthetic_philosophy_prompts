prompt: |-
  I work on the research staff of a philanthropic foundation that spends roughly $25M a year on global health and poverty programs, and my job is to write the evidence memo that precedes each quarterly allocation decision. Eight to ten times a year the same question arrives in a different shape: should we decide now on what we already believe, or buy more information first — commission a pilot, pay for a longer-run follow-up, fund a replication in a new country, or delay a scale-up by a year so that a measurement can land before we commit? The decisions themselves range from $300k to about $10M; the studies we might commission range from $80k to $1.5M. The final call is made by a five-person investment committee voting by majority, three of whose members are not comfortable with anything more technical than a percentage. I get half a day with one analyst to produce the memo, and the memo has to survive being read out loud in the meeting.

  I have read the standard expositions of Good's theorem. My understanding is that for an agent who maximises expected utility and updates by Bayes, the expected value of information that arrives before the decision and is free to act on is never negative, and that it is strictly positive only where the information could actually change what the agent does. If I have misstated it, correct me before building on it, because everything below rests on it.

  What I do not have is a procedure. The formula is not my problem; my problem is that our decision environment violates the theorem's assumptions in at least five ways I can name, and I cannot tell which of those violations should reshape the procedure and which are noise. Specifically: the decider is a committee with heterogeneous priors voting by majority, and the committee that reads a study is frequently not the one that commissioned it; we almost never manage to pre-commit in writing to the decision rule that will be applied to the result; our findings are usually published, other funders read them, and our money is perhaps 4% of the relevant pool, so a result can help or hurt us through what it makes other people do; the committee does not maximise expected value but applies thresholds — it will not fund anything with more than roughly a 10% posterior probability of net harm, and it prefers a crisp ranking to a maximised one, which means variance-increasing information can be actively bad for us even when it is free; and the thing a study measures is only a noisy proxy for the thing we care about, because of external validity, implementation drift, and spillovers, so informativeness rather than sample size is usually what drives the answer. There is also the fact that delay has identifiable costs falling on identifiable people who would otherwise have been served, and how much to discount those people is a values question I do not want smuggled in as a parameter.

  What I want from you is a written procedure my team can actually run, not a tutorial. It should be an ordered set of questions with a stated sufficient answer to each; it should say at which steps we can stop early and with what verdict; it should say where the procedure returns don't buy the information — because no result could change the action, because the prior already settles it, because the result cannot arrive inside the decision window, or because we cannot commit to acting on it; and it should mark clearly, as such, the places where judgment genuinely cannot be eliminated and the question must be handed to a person, naming which person: the analyst, me, or the board. I need it to work when we have no credible numbers, which is most of the time, so it should say what to do with rough elicitations and one-sided bounds rather than silently substituting a guess for a distribution. It also has to be presentable to a non-technical trustee in a paragraph, and I want it to be hard for a staff member who already wants the study to game.

  Please apply it in full to three cases, using the numbers I give.

  One. A $6M scale-up over three years into a region where we have not operated. Our prior on the effect, expressed in units of our cost-effectiveness bar where 1.0 is our marginal dollar elsewhere, is roughly lognormal with median 1.5 and an 80% interval of 0.7 to 3.2. A pilot would cost $250k and take 14 months, and would give an approximately unbiased estimate of the local effect with a standard error near 0.45 in bar units, but we think its correlation with the eventual scale-up effect is only about 0.6.

  Two. A $400k follow-up measurement of long-run outcomes on a program we have funded for five years. The renewal vote is in 6 months and the results would arrive in 20; the program is one of two candidates to anchor a $12M country strategy that we will set in 18 months. The measurement is therefore late for the decision it was proposed for and early for a larger one, and in the interim the result would be published and read by other funders.

  Three. Our flagship program: $10M over three years, about 40% of the portfolio, four staff attached to it, and a proposed $1.2M three-year rigorous evaluation. The board has never exited a program of that size, and a null result would in practice be read as a mandate to implement better. I expect the honest verdict here to be one I would rather not hear. Give it anyway, flag it as the unwelcome one, and defend it.

  Finally, tell me what the procedure cannot do. I assume it cannot rescue a bad prior, cannot assign value to hypotheses we have not enumerated, cannot settle whether we are buying a decision input or producing a public good for the field, and will manufacture false precision if I let it. Tell me which of those are fatal and which I can live with, and what else belongs on the list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Research staff at a philanthropic foundation ($25M/year budget).
      *   **Task:** Write evidence memos for quarterly allocation decisions (8-10 times/year).
      *   **Core Problem:** Deciding whether to fund a program *now* or buy more information (study/pilot/delay) first.
      *   **Constraints:**
          *   Decision makers: 5-person committee (majority vote, 3 non-technical).
          *   Time budget: Half a day with one analyst per memo.
          *   Output: A written procedure (ordered questions, stop rules, verdicts, hand-off points) + Application to 3 specific cases + Limitations analysis.
          *   Tone/Style: Practical, rigorous but accessible, anti-gaming, honest about uncertainty (no false precision), acknowledges institutional realities (committees, publication effects, thresholds).
      *   **Theoretical Basis:** User knows Good's Theorem (EV of Information $\ge$ 0) but recognizes 5 specific violations in their context (committee heterogeneity, lack of pre-commitment, externalities/publication, threshold utility/risk aversion, proxy measures/external validity).
      *   **Specific Cases:**
          1.  $6M scale-up, new region. Prior: Lognormal (median 1.5, 80% CI 0.7-3.2). Pilot: $250k, 14 months, SE 0.45, correlation 0.6.
          2.  $400k follow-up, existing program. Renewal vote in 6 months, results in 20 months. Strategy decision in 18 months. Publication effects likely.
          3.  $10M flagship (40% portfolio), $1.2M evaluation. Board never exits big programs. Null result = pressure to implement better, not exit. (User expects an unwelcome verdict).

  2.  **Deconstruct the Theoretical Challenge:**
      *   Good's Theorem assumes a single Bayesian agent maximizing expected utility with pre-commitment to act on information.
      *   *Violation 1 (Committee):* Aggregation of priors/utilities isn't Bayesian. Voting creates discontinuities.
      *   *Violation 2 (Pre-commitment):* If they can't commit to acting on the result, the EV of Information (EVI) drops to zero.
      *   *Violation 3 (Externalities):* Publication affects other funders. This adds value (leverage) or risk (crowding out/reputation).
      *   *Violation 4 (Thresholds/Risk):* Utility isn't linear. A "10% harm threshold" acts like a stop-loss. Variance can be bad if it pushes probability mass over the cliff.
      *   *Violation 5 (Proxies):* The study measures $X$, decision depends on $Y$. Correlation $< 1$ reduces EVI.
      *   *Constraint:* No complex math. Needs to work with rough bounds/elicitations.

  3.  **Develop the Procedure (The "Protocol"):**
      *   *Goal:* A filter that kills low-value information requests quickly and flags high-stakes judgment calls.
      *   *Structure:* Sequential gates. If you fail a gate, stop and recommend "No Study." If you pass all, recommend "Study."
      *   *Gates:*
          1.  **Actionability (Pre-commitment):** Will the committee actually change their mind?
          2.  **Timing:** Will results arrive before the decision deadline?
          3.  **Decision Sensitivity:** Is the current prior already decisive enough? (Threshold check).
          4.  **Information Quality:** Is the study actually informative about the *decision variable*? (Correlation/Validity).
          5.  **Cost-Benefit (Rough):** Does the cost of the study exceed the potential loss avoided or gain captured?
          6.  **Externalities:** Does publication help or hurt the mission?
      *   *Hand-offs:* Analyst does the legwork. User (Research Staff) makes the call on technical validity. Board/Committee decides on values/thresholds.
      *   *Anti-Gaming:* Require explicit statement of "What result would change the vote?"

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Step 1: The "So What?" Test.* If the result comes back null/negative, do we stop? If no, don't buy info. (Addresses Pre-commitment).
      *   *Step 2: The Clock.* Does info arrive before the money must be committed? (Addresses Timing).
      *   *Step 3: The Threshold Check.* Given current uncertainty, is there a significant chance we are below the harm threshold or above the opportunity cost bar? (Addresses Thresholds).
      *   *Step 4: The Validity Discount.* Is the study measuring the right thing in the right place? (Addresses Proxies/External Validity).
      *   *Step 5: The Cost Test.* Is the study cost $<$ 10% of the at-risk capital? (Rule of thumb for speed).
      *   *Step 6: The Public Good Check.* Does publishing this help others enough to justify the delay/cost even if *we* don't change our mind? (Addresses Externalities).

  5.  **Applying to Case 1 ($6M Scale-up):**
      *   Prior: Median 1.5 (Good). 80% CI 0.7-3.2.
      *   Threshold: 1.0 is the bar. Significant mass below 1.0 (lower bound 0.7).
      *   Pilot: $250k. 14 months.
      *   Correlation: 0.6 (Low).
      *   *Analysis:* The prior is optimistic, but the lower tail risks violating the "harm" or "inefficiency" threshold. However, the pilot correlation is weak (0.6). 14 months is long.
      *   *Verdict:* Likely "No Pilot." The cost is high relative to the decision shift potential given the low correlation. The prior is strong enough to proceed *if* the threshold is purely mean EV, but if the threshold is "probability of <1.0", the pilot might not reduce variance enough to clear it.
      *   *Refinement:* Actually, the prompt says "10% posterior probability of net harm." If the prior has >10% mass below 0 (or below a harm threshold), we need to check. Here the bar is 1.0 (opportunity cost). If the rule is "Don't fund if >10% chance CE < 1.0", the prior (0.7 lower bound) suggests significant risk. But the pilot correlation is the killer. 0.6 correlation means the pilot is noisy regarding the *scale-up*.
      *   *Decision:* Recommend against pilot. Proceed with scale-up but monitor, or scale up in phases. Why? Because the pilot doesn't resolve the uncertainty enough to change the vote given the correlation discount.

  6.  **Applying to Case 2 ($400k Follow-up):**
      *   Timing: Vote in 6 months. Results in 20 months.
      *   *Analysis:* Fails Step 2 (The Clock) immediately for the renewal vote.
      *   *Nuance:* It informs the 18-month strategy.
      *   *Externalities:* High. Publication helps others.
      *   *Verdict:* Do not fund as a *decision input* for the renewal. Fund only if classified as "Public Good/Field Building" and budgeted separately from program ops.
      *   *Recommendation:* Decouple the measurement budget from the program renewal budget.

  7.  **Applying to Case 3 ($10M Flagship):**
      *   Size: 40% of portfolio.
      *   Evaluation: $1.2M.
      *   Politics: Board never exits. Null = "Implement better."
      *   *Analysis:* Fails Step 1 (Actionability). If a null result doesn't trigger exit, the EV of Information is near zero for *allocation* purposes. It's reputation management.
      *   *Verdict:* Unwelcome truth: Do not fund the rigorous evaluation as a decision tool. It is a sunk cost/insurance policy. If the board won't pull the plug, the study is theater.
      *   *Recommendation:* Cancel the $1.2M evaluation. Use that money for program delivery or a cheaper monitoring system.

  8.  **Addressing Limitations:**
      *   Bad Priors: Garbage in, garbage out.
      *   Unknown Unknowns: Can't value what you don't imagine.
      *   Public Good vs. Private Decision: The procedure forces a choice, doesn't solve the tension.
      *   False Precision: The procedure uses bounds, not point estimates, to mitigate this.

  9.  **Refining the Output:**
      *   *Tone:* Professional, direct, slightly bureaucratic but sharp.
      *   *Format:* Clear headers, bold text for decisions, distinct sections for Procedure, Cases, Limitations.
      *   *Constraint Check:* "Half a day with one analyst." The procedure must be fast. "Read out loud." Needs to be narrative-friendly. "Non-technical trustee." Avoid Bayes factors, use "Chance of changing mind."
      *   *Specific Instruction:* "Tell me what the procedure cannot do."

  10. **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too simple?
      *   *Fix:* Ensure the "Threshold Check" acknowledges the 10% harm rule explicitly.
      *   *Critique:* Case 1 math.
      *   *Fix:* Don't get bogged down in calculating EVI exactly (user said no credible numbers). Use the correlation and interval overlap as heuristics.
      *   *Critique:* Case 3 honesty.
      *   *Fix:* Make sure to explicitly state "This is the unwelcome verdict" as requested.
      *   *Critique:* Gaming.
      *   *Fix:* Add a "Pre-mortem" question: "If the study fails, do we kill the program?"

  11. **Final Polish:** Check against the 5 violations mentioned by the user to ensure the procedure explicitly handles them (Committee, Pre-commitment, Externalities, Thresholds, Proxies).

      *   *Committee:* Hand-off to Board for threshold setting.
      *   *Pre-commitment:* Step 1 of procedure.
      *   *Externalities:* Step 6 of procedure.
      *   *Thresholds:* Step 3 of procedure.
      *   *Proxies:* Step 4 of procedure.

      *Let's write it.*
answer: |-
  Here is a procedure designed for your constraints: low time budget, non-technical audience, heterogeneous committee, and high stakes. It treats information not as a theoretical good but as a procurement item that must justify its cost against specific institutional frictions.

  ### The Protocol: Information Procurement & Allocation Filter

  **Owner:** Research Staff (You)
  **Input:** Program Proposal + Proposed Study/Pilot
  **Time Budget:** 4 hours (Analyst + You)
  **Output:** One of three verdicts: **Fund Program**, **Fund Study**, or **Defer/Reject**.

  ---

  #### Step 1: The Pre-Commitment Test (Actionability)
  **Question:** If the study returns a "null" or "negative" result (defined explicitly), will the Committee vote to stop or reduce the program?
  *   **Analyst Action:** Ask the Program Officer and Committee Chair for a written "If-Then" statement. *("If the pilot CE is < 1.0, we will not scale.")*
  *   **Sufficient Answer:** **No.**
  *   **Verdict:** **Reject Study.** Fund the program or reject the program based on current priors. Do not buy information you will not act on.
  *   **Hand-off:** If the answer is ambiguous, **You** must flag this to the Committee Chair before the memo is written. This is a governance failure, not a research question.

  #### Step 2: The Clock Test (Timing)
  **Question:** Will the study results be available *before* the capital must be committed to the program?
  *   **Analyst Action:** Compare "Results Date" vs. "Allocation Deadline."
  *   **Sufficient Answer:** **No.**
  *   **Verdict:** **Reject Study as Decision Input.**
  *   **Exception:** If the study serves a *future* decision (e.g., country strategy in 18 months), proceed to Step 6 (Public Good). It cannot justify delaying the current allocation.

  #### Step 3: The Threshold Test (Risk & Variance)
  **Question:** Given our current prior, is there a >10% probability the program causes net harm (or falls below our cost-effectiveness bar)?
  *   **Analyst Action:** Map the prior distribution (even if rough) against the harm threshold.
  *   **Sufficient Answer:** **No.** (The risk is already acceptably low).
  *   **Verdict:** **Fund Program.** Buying information to reduce variance is wasteful if the risk of crossing the "cliff" is already negligible.
  *   **Sufficient Answer:** **Yes.** (The risk is unacceptably high).
  *   **Verdict:** **Proceed to Step 4.** (We *might* need info to clear the risk).

  #### Step 4: The Validity Discount (Proxies & Externalities)
  **Question:** Is the study measuring the actual outcome in the actual population, or a proxy in a different context?
  *   **Analyst Action:** Assign a "Relevance Discount" (0.0 to 1.0) based on implementation drift, geographic correlation, and proxy quality.
      *   *Direct measure, same site:* 1.0
      *   *Pilot in new region:* ~0.6 (as per your Case 1)
      *   *Proxy outcome:* ~0.5 or less
  *   **Calculation:** Multiply the study's statistical power by the Relevance Discount.
  *   **Sufficient Answer:** **Discounted Power < 50%.**
  *   **Verdict:** **Reject Study.** The noise introduced by external validity swamps the signal. Rely on prior + monitoring.

  #### Step 5: The Cost-Benefit Heuristic
  **Question:** Does the cost of the study exceed 10% of the *at-risk* capital it protects?
  *   **Analyst Action:** (Study Cost) / (Program Tranche that would be cancelled if study fails).
  *   **Sufficient Answer:** **Yes (>10%).**
  *   **Verdict:** **Reject Study.** Unless the study has high Public Good value (Step 6), it is too expensive an insurance policy.
  *   **Sufficient Answer:** **No.**
  *   **Verdict:** **Fund Study.** (Conditional on Step 6).

  #### Step 6: The Public Good Override
  **Question:** If we would not fund this study for our own decision-making (per Steps 1-5), does publishing the result generate enough value for the field (leveraging other funders, setting standards) to justify the cost as a separate "Field Building" line item?
  *   **Analyst Action:** Estimate leverage ratio (e.g., "This study convinces 3 other funders to commit $10M").
  *   **Sufficient Answer:** **Yes.**
  *   **Verdict:** **Fund Study,** but budget from **Research/Field Building**, not Program Operations.
  *   **Sufficient Answer:** **No.**
  *   **Verdict:** **Reject Study.**

  ---

  ### Application to Cases

  #### Case 1: The $6M Scale-Up (New Region)
  *   **Data:** Program $6M. Pilot $250k. Prior Median 1.5 (80% CI 0.7–3.2). Harm/Bar Threshold 1.0. Pilot Correlation 0.6.
  *   **Step 1 (Actionability):** Assume Yes (Committee usually requires pilot clearance for new regions).
  *   **Step 2 (Timing):** 14 months pilot vs. 3-year scale-up. Results arrive before full commitment. **Pass.**
  *   **Step 3 (Threshold):** Prior 80% CI lower bound is 0.7. Significant mass below 1.0 bar. Risk is >10%. **Pass (Need Info).**
  *   **Step 4 (Validity):** Correlation 0.6 between pilot and scale-up. This is a massive discount. A "significant" pilot result leaves high uncertainty on the actual scale-up.
  *   **Step 5 (Cost):** $250k study vs. $6M program. Ratio is ~4%. **Pass.**
  *   **Step 6 (Public Good):** Moderate. New region data is useful, but not field-defining.
  *   **Verdict:** **Fund Program, Reject Pilot.**
  *   **Rationale:** While Step 3 flags risk, Step 4 kills the pilot. A 0.6 correlation means the pilot is too noisy to reliably clear the threshold risk. You are paying $250k for a signal that remains too ambiguous to change a majority vote.
  *   **Recommendation:** Proceed with the $6M but structure it as **phased tranches**. Release $2M now. Tie the next $2M to interim monitoring metrics (cheaper, faster) rather than a rigorous pilot. This manages the risk without buying low-correlation information.

  #### Case 2: The $400k Follow-Up (Existing Program)
  *   **Data:** Renewal vote in 6 months. Results in 20 months. Strategy decision in 18 months.
  *   **Step 1 (Actionability):** Irrelevant.
  *   **Step 2 (Timing):** Results (20mo) > Renewal Vote (6mo). **Fail.**
  *   **Verdict:** **Reject Study as Decision Input.**
  *   **Rationale:** The study cannot inform the renewal. It arrives too late for the immediate decision and barely in time for the strategy session.
  *   **Recommendation:** **Decouple.** Fund the program renewal based on existing 5-year data. If the long-run measurement is valuable for the *field* (Step 6), fund it from a **Research Budget**, not the Program Budget. Do not hold the program hostage to a timeline it cannot meet. Explicitly state in the memo: *"This measurement is a public good, not an allocation input."*

  #### Case 3: The $10M Flagship (The Unwelcome Verdict)
  *   **Data:** $10M program (40% portfolio). $1.2M Evaluation. Board never exits. Null result = "Implement better."
  *   **Step 1 (Actionability):** **Fail.**
  *   **Analysis:** You stated the Board will not exit the program even on a null result. They treat a null as an implementation challenge, not a stop signal.
  *   **Verdict:** **Cancel the $1.2M Evaluation.**
  *   **Rationale:** This is the unwelcome truth. Under Good's Theorem, information has zero value if it does not change the action. If the Board's decision rule is "Fund regardless of result," the Expected Value of Information is **$0**. Spending $1.2M to confirm what you will do anyway is waste.
  *   **Defense:** In the memo, write: *"We cannot recommend this evaluation as an allocation tool. The Committee has indicated via precedent that negative results would not trigger exit. Therefore, this $1.2M is not buying a decision; it is buying reputation insurance. If we wish to purchase insurance, we should budget it as such, but we must acknowledge it reduces capital available for beneficiaries by $1.2M."*
  *   **Alternative:** Propose a $200k monitoring system that tracks delivery fidelity rather than impact. It costs less and helps "implement better" without pretending to drive an exit decision that won't happen.

  ---

  ### What This Procedure Cannot Do

  You asked for the limitations. This protocol is a tool for *allocation*, not truth-seeking. Here is where it breaks:

  1.  **It Cannot Rescue Bad Priors:** If your Step 3 prior is confidently wrong (e.g., you think CE is 1.5 but it is actually 0.5), the procedure will tell you to "Fund Program" and skip the study. It optimizes for consistency with current beliefs, not accuracy.
      *   *Fatal?* **Yes.** This is the single biggest risk.
      *   *Mitigation:* Once a year, force a "Red Team" review of the top 3 priors where no study is planned.

  2.  **It Cannot Value Unknown Hypotheses:** The procedure assumes we know what the study measures. It cannot account for "black swan" side effects or mechanisms we haven't enumerated.
      *   *Fatal?* **No.** This is true of all cost-benefit analysis.
      *   *Mitigation:* Require qualitative risk registers alongside the quantitative memo.

  3.  **It Cannot Settle "Private Decision" vs. "Public Good":** Step 6 forces a choice, but it doesn't solve the tension. If the study helps the field but hurts your immediate beneficiaries (via delay), the procedure asks you to pick a budget bucket, not solve the moral dilemma.
      *   *Fatal?* **No.** Someone must make the trade-off. This procedure forces the trade-off into the open rather than hiding it in a "strategic value" parameter.

  4.  **It Will Manufacture False Precision if Abused:** If the Analyst assigns a "Relevance Discount" of 0.6 without justification, the math looks rigorous but is garbage.
      *   *Fatal?* **Yes.**
      *   *Mitigation:* Require the Analyst to cite *one* comparable instance where a similar discount proved accurate, or label the number "Subjective Estimate."

  5.  **It Cannot Force Committee Honesty:** Step 1 relies on the Committee admitting they might cancel a program. If they lie to themselves, the procedure fails.
      *   *Fatal?* **Yes.**
      *   *Mitigation:* You must record the "If-Then" statements in the meeting minutes. Hold them accountable to their own pre-commitments in the next cycle.

  ### Summary for the Trustee (The Paragraph)

  *"We treat research funding like any other investment: it must change a decision to justify its cost. We have implemented a six-step filter that asks, simply: 'Will this result arrive in time?', 'Would a negative result actually stop the program?', and 'Is the study measuring the right thing in the right place?' If the answer to any of these is no, we do not commission the study. This prevents us from spending donor money on information we will ignore, ensures we do not delay help to beneficiaries for data that arrives too late, and separates research that helps the world from research that helps our decision-making."*
