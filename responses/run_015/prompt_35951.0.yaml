          *   Distinguish between *internal* and *external* effects.
          *   Health/Safety trumps preference.
          *   The "Smoke" specific: It's a physical particulate, not just a smell. It crosses boundaries.
      *   **Drafting the Rules:** Give concrete examples of how to write this.
