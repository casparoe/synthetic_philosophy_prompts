      *   *Is Sen's Paradox actually applicable?* Strictly speaking, Sen's paradox is about social welfare functions. In a co-op, it's more about *property rights* and *lease agreements*. I need to make sure I don't over-intellectualize it but acknowledge the friend's insight. The core tension (Liberty vs. Collective Decision) is the key takeaway.
