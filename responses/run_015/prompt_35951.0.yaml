      *   *Jonah Move 1:* Some things (body, room) are inherently private. Voting on them is wrong *per se*.
      *   *Rosa Move 2:* Where's the line? Smells, noise, cooking affect people. If no line, "private sphere" is empty. If there is a line, define it. Otherwise, it's just majority rule (which Jonah calls tyranny).
      *   *Jonah Move 2:* It *is* tyranny of the majority. You'd feel differently if votes went against you.
      *   *Rosa Move 3:* "Tyranny" is overblown. Voting is coordination. By your logic, we can't vote on anything.

  3.  **Evaluate the Positions (Philosophical & Practical):**
      *   **Rosa:** Strong on practicality and collective action. Weak on defining limits. If *everything* is votable, individual liberty is precarious.
      *   **Jonah:** Strong on individual rights/liberty. Weak on the reality of shared space. If *nothing* affecting others is votable, co-living is impossible (tragedy of the commons/nuisance).
      *   **Sen's Liberal Paradox:** This is crucial. Amartya Sen's theorem states that you cannot simultaneously have:
          1.  Unrestricted Domain (any set of preferences is allowed).
          2.  Pareto Efficiency (if everyone prefers A over B, society should prefer A over B).
          3.  Minimal Liberalism (at least two individuals have decisive power over at least one pair of social states).
          *   *Application here:* The paradox usually illustrates a conflict between individual rights and collective welfare. In this specific co-op scenario, it's slightly misapplied by the friend, but the *spirit* is relevant. The conflict is between Marcus's "liberal right" to smoke in his room vs. the "Pareto improvement" of banning it (since the asthmatic person is harmed, and presumably others prefer no smoke). However, the paradox is more about logical impossibility in social choice theory than a direct rule for housemates. I should clarify this so the user doesn't get bogged down in academic theory but understands the tension.
      *   **Who is "Right"?** Neither is 100% right. Rosa ignores the need for protected spheres. Jonah ignores the reality of externalities in shared housing.

  4.  **Determine the "Line" (Practical Advice for House Rules):**
      *   *The Harm Principle (Mill):* You can swing your fist until it hits my nose.
      *   *Externalities:* Does the action physically cross the boundary of the private space? (Smoke, sound, water damage).
      *   *Health & Safety:* Asthma is a medical issue, not just a preference.
      *   *Expectation of Privacy:* What do people reasonably expect when renting a room? Usually, quiet enjoyment, but not the right to create health hazards.
      *   *Consent/Contract:* Moving in implies agreeing to certain norms.

  5.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the difficulty. Validate the Sen reference but contextualize it.
