      *(Check specific quote)*: Maxwell's letter to Tait (Dec 11, 1867). "Let us suppose that such a being... whose faculties are so sharpened that he can follow every molecule..." "He is able to do what we cannot..." "Thus the 2nd law is deprived of its absolute truth..."
