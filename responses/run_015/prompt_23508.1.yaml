answer: |-
  The coin didn't clink when it landed. It sighed.

  Silas sat at the small iron table in the center of the white room. Across from him sat the Dealer, who wore a face like blurred glass. There were no chips. There was no money. On the table between them lay a single, leather-bound book. Silas's life.

  "Round four," the Dealer said. The voice sounded like it was coming from inside Silas's own skull.

  Silas nodded. He felt the familiar vertigo in his gut, a sensation like standing on a ladder that was simultaneously extending upward into the clouds and dissolving downward into the earth. It wasn't nausea. It was the physical weight of a calculation that refused to finish.

  "Heads," Silas said.

  The Dealer flipped the coin. It spun, a silver blur, and landed. Heads.

  A jolt of electricity shot up Silas's spine. In the book, the entry for *Tuesday, October 14th* glowed gold. The memory of that day—which had previously been a mundane commute and a lukewarm coffee—suddenly surged with profound significance. He remembered the way the light hit a puddle, the exact shade of a stranger's umbrella, a sudden, crushing sense of connection to the universe. It was a moment of infinite clarity. A win.

  But the rules of the game were specific. The magnitude scaled.

  "Round five," the Dealer said.

  Silas hesitated. His hand hovered over the coin. He looked at his wife, Mara, who stood in the corner of the white room, arms crossed. She wasn't playing, but she was paying the entry fee. Every time Silas played, she lost an hour of his presence. He would be physically there, but his mind would be in the white room, tallying the infinite.

  "Silas," Mara said. Her voice was thin, stretched. "Stop. You're oscillating."

  "I'm not," Silas said. "I'm summing."

  "You can't sum this!" she snapped. "Look at you. You haven't slept in three days. You keep saying you're ahead, then you say you're ruined. Pick one."

  "I can't," Silas said, and he meant it. "It depends on the order."

  This was the thing the professors in the dream-lectures never explained. They talked about Expected Value. They talked about utility functions. They acted as if a life could be totaled up like a grocery receipt. But in the white room, Silas knew the truth. The series was conditionally convergent.

  If he counted his victories first—the golden days, the epiphanies, the moments where he understood the exact texture of love—the total was positive infinity. He was a god.
  If he counted his defeats first—the gray days, the hollow silences, the moments where he was a ghost in his own skin—the total was negative infinity. He was a wretch.

  Both sums were mathematically valid. Both were the truth of his life.

  "Round five," the Dealer prompted. "Tails pays out the void. Heads pays out the pleroma."

  "If I stop," Silas asked, "what is my total?"

  "Undefined," the Dealer said.

  "If I play?"

  "Still undefined. But the terms grow larger."

  Silas looked at Mara. She looked tired. Not the tired of a long shift, but the tired of someone married to a variable. She wanted him to be a constant. She wanted him to be a man who could say, "On balance, I am happy," or "On balance, I am suffering." She wanted a number.

  But Silas had tasted the undefined. It was the only honest thing left.

  To be rational was to maximize value. But how do you maximize a value that doesn't exist? To stop playing would be to declare a final order of operations. It would be to say, *This is how my life adds up.* It would be a lie.

  "Silas, please," Mara said. She reached out, but her hand passed through the iron table. She was outside the game. She lived in a world of finite sums. She thought pain plus pleasure equaled a net result. She didn't understand that pain times infinity plus pleasure times infinity equaled... silence.

  "I have to balance the ledger," Silas whispered.

  "There is no balance!" Mara cried. "There's just you, erasing us!"

  She was right. The stake wasn't money. It wasn't even time. It was *coherence*. Every flip of the coin stretched the narrative of his life. A win made a memory so bright it burned the context around it. A loss made a memory so dark it swallowed the years adjacent to it. He was becoming a book of brilliant, disconnected sentences with no paragraphs.

  He looked at the coin. It was vibrating.

  If he walked away now, he would be a man who quit. A finite man. A man with a score.
  If he played, he remained a question.

  "Rationality," Silas said, testing the word. It tasted like ash. "Rationality requires a defined expectation."

  "Silas," the Dealer said. The blurred face leaned forward. "The series does not converge. You know this. You will never reach a sum. You will only ever be in the middle of the calculation."

  "I know," Silas said.

  "Then why play?"

  "Because," Silas said, and he felt the vertigo spike, a drop in his stomach that was also a lift, "as long as I'm calculating, the answer isn't no."

  He wasn't gambling to win. He wasn't gambling to recover losses. He was gambling to keep the equation open. To stop was to collapse the wave function. To stop was to accept a finite definition of a soul that felt infinite in both directions.

  Mara turned away. She was leaving the room. She couldn't watch him choose the undefined over her.

  Silas felt the loss of her like a negative term in the series. A massive, heavy negative. It threatened to drag the whole sum down.
  But then he looked at the coin. The potential for the next term. The next term was larger than the last. The next term was larger than his marriage, larger than his fear, larger than the white room.

  He wasn't irrational. An irrational man thinks he can beat the odds. Silas knew the odds were a singularity.
  He wasn't rational. A rational man maximizes utility. Silas knew utility was a fiction.

  He was something else. He was a walker of the asymptote.

  "Round five," Silas said. "Heads."

  He flipped the coin.

  It spun. For a moment, it hung in the air, neither heads nor tails, neither up nor down. In that suspension, Silas felt the only peace he had ever known. The moment before the sum. The moment before the judgment.

  It landed.

  Silas didn't look. He didn't need to. He just closed his eyes and waited for the next term, feeling the beautiful, terrible weight of a life that would never, could never, add up.

  "Round six," the Dealer said.

  "Deal," Silas answered.
