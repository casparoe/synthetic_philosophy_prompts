answer: |-
  **Title:** The 2% Catastrophe: Why Moral Uncertainty Demands Hedging Over Calculation

  **Introduction**
  In practical ethics, we often crave certainty. We want to know not just what is right, but which moral theory correctly identifies what is right. Yet, in reality, we operate under moral uncertainty. We might be 98% sure that Utilitarianism is true, but harbor a nagging 2% doubt that a Deontological theory regarding human rights is the actual moral law. The pressing question is how this uncertainty should guide action. If the 98% theory says a policy is slightly beneficial, but the 2% theory says it is a massive injustice, should we proceed? Proponents of Moral Expected Value (MEV) suggest we should calculate the weighted average of these outcomes. However, this approach collapses when moral values are incomparable. This essay argues that when faced with low-probability but high-stakes moral theories involving incomparable values, we ought to hedge our actions. The risk of committing a "cosmic wrong" cannot be mathematically offset by high-probability minor gains, and therefore, the 2% chance of massive injustice should veto the action.

  **The Appeal and Failure of Moral Expected Value**
  The standard framework for decision-making under uncertainty is Moral Expected Value. Analogous to financial risk assessment, MEV suggests we assign a credence (probability) to each moral theory and a value to the outcomes they predict. We then multiply the credence by the value to find the expected moral worth of an action. In the scenario provided, if Theory A (98% credence) says the policy yields +10 units of good, and Theory B (2% credence) says it yields -1,000 units of bad, the calculation might still justify the policy ($0.98 \times 10 + 0.02 \times -1000 = 9.8 - 20 = -10.2$). In this specific numerical setup, MEV actually supports hedging.

  However, the prompt highlights a deeper structural flaw: intertheoretic comparison. MEV assumes a common currency of value. It assumes we can translate "rights violations" into the same units as "utility gains." But if Theory A is Utilitarian (counting happiness) and Theory B is Kantian (counting dignity violations), there is no exchange rate. How many units of happiness equal one violation of human dignity? If the second theory claims the injustice is "cosmic" or lexically superior—meaning it trumps any amount of utility—then the mathematical operation of MEV becomes impossible. You cannot multiply 2% by "Infinity" or "Absolute Prohibition" and expect a manageable number. When values are incomparable, the calculus of expected value breaks down, leaving us without a numerical guide.

  **The Case for Hedging and the Precautionary Principle**
  When calculation fails, we must rely on a decision rule that accounts for the severity of error. This is the argument for hedging, specifically a version of the Maximin principle: we should choose the action that avoids the worst possible outcome. In empirical risk management, we wear seatbelts not because we expect a crash every day, but because the cost of a crash is death. Similarly, in moral decision-making, the asymmetry of the stakes matters.

  If we follow the 98% theory and ignore the 2% theory, two outcomes are possible. If the 98% theory is right, we gain a minor benefit. If the 2% theory is right, we commit a massive injustice. Conversely, if we hedge and reject the policy, and the 98% theory was right, we merely lose a minor benefit. If the 2% theory was right, we have avoided a catastrophe. The cost of hedging (losing a small good) is vastly outweighed by the benefit of hedging (avoiding a moral atrocity). This is not merely about risk aversion; it is about the nature of moral responsibility. Committing a grave injustice is arguably worse than failing to maximize a minor good. Therefore, even a low credence in a theory that prohibits an action should carry veto power if the action constitutes a fundamental violation under that theory.

  **Addressing the Problem of Pascal's Mugging**
  The primary counter-argument to hedging is the threat of paralysis, often illustrated by "Pascal's Mugging." If we always hedge against low-probability theories, any fanatical theory could hold our actions hostage. If there is a 0.0001% chance that eating bread causes eternal damnation, should we starve? If we say "yes" to the 2% injustice, do we have to say "yes" to the 0.0001% damnation?

  To avoid this, we must place a plausibility constraint on hedging. We should only hedge against moral theories that are philosophically respectable and internally coherent, not logically absurd scenarios. A theory claiming a specific policy is a "massive injustice" based on established ethical frameworks (like human rights or contractualism) warrants attention at 2% credence. A theory claiming eating bread is damnation does not. Furthermore, hedging should be reserved for *catastrophic* moral failures, not merely large negative utilities. This distinction saves us from paralysis while preserving the intuition that we should not gamble with potential atrocities. We do not need to hedge against every uncertainty, only those where the potential error is of a different *kind* than the potential gain.

  **Conclusion**
  Moral uncertainty is not an excuse for inaction, but it does dictate caution. While Moral Expected Value offers a neat mathematical model, it fails when moral theories speak different languages of value. We cannot calculate the expected value of a rights violation against utility gains because they are incomparable. In these cases, the stakes dictate the strategy. Because the moral cost of committing a massive injustice is disproportionately higher than the benefit of a minor policy gain, we are obligated to hedge. The 2% chance of a cosmic wrong is not a statistical nuisance to be averaged out; it is a red flag that demands we stop. Therefore, in cases of incomparable high-stakes uncertainty, we must prioritize avoiding the worst-case moral scenario over maximizing the expected value of the most likely one. We should not gamble with injustice, even at favorable odds.
