  Demand of every part: what is it for?
  The loom is gone; the brick stands bare and lone.
  Some shapes are left where two constraints meet the floor.

  The load-bearing walls answer nothing more.
  The engine's mount is solid as a bone.
  Demand of every part: what is it for?

  The empty wedge of space serves no core.
  No design chose it; it is not our own.
  Some shapes are left where two constraints meet the floor.

  Old chutes feed new grain through a different door.
  The framework shifts; new purposes are grown.
  Demand of every part: what is it for?

  That wedge was waste, now bears the shelf's full store.
  Utility springs from a seed unknown.
  Some shapes are left where two constraints meet the floor.

  So history and function split the score.
  Two questions carved in every block of stone.
  Demand of every part: what is it for?
  Some shapes are left where two constraints meet the floor.

  ### Notes on the choices

  The villanelle's circular form mirrors the reading group's stalled debate, but the refrains differentiate the circling voices. Refrain A1 (*Demand of every part: what is it for?*) embodies the adaptationist method: imperative, proximate, and focused on current utility. Refrain A2 (*Some shapes are left where two constraints meet the floor*) voices the Gould–Lewontin critique: descriptive, historical, and focused on architectural necessity rather than selection.

  The stanzas track the four required categories of features within the converted factory. Stanza two describes adapted traits (load-bearing walls, engine mounts) where origin and function align. Stanza three isolates the byproduct (the empty wedge), which serves no function and arises purely from constraint. Stanza four distinguishes co-option (old chutes feeding new grain), where an existing structure takes a new role. Stanza five introduces the exapted byproduct: the wedge was waste (origin) but now holds the shelves (current function).

  The closing quatrain resolves the tension not by choosing a side, but by assigning domains. The variable line (*So history and function split the score*) asserts that adaptive value and historical origin are distinct questions. The final B-rhyme (*Two questions carved in every block of stone*) reinforces that both inquiries are permanent features of the structure. The refrains return not as rivals, but as complementary interrogations: one asking about the load now carried, the other about the constraint that formed the shape. This avoids reverse Panglossianism by acknowledging that while the wedge now bears weight, it remains a shape left by constraint.
