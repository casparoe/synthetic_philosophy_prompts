answer: |-
  You have correctly identified a gap in the standard taxonomy. You are right to reject **implicature** (which concerns *content* hidden beneath the words) and you are right to sense that **indirect speech act** (Searle) is not quite it (where the force is *inferred* but ultimately fixed by the speaker's intent).

  In standard Speech Act Theory (Austin, Searle), the Illocutionary Force (what act you are doing: promising, threatening, ordering) is determined by the speaker's intention + convention. In your cases, the speaker *withholds* that intention, designing the utterance so that the Force is determined by the **hearer's uptake**.

  There is no single, canonical textbook term for this specific configuration (like "implicature" or "presupposition"). In legal and pragmatic literature, it is often discussed under the header of **Strategic Illocutionary Ambiguity** or **Plausible Deniability**, but these describe the *goal*, not the *mechanism*.

  To carve this concept properly, I will coin the term **"Contingent Illocution."**

  ### The Concept: Contingent Illocution

  **Definition:** A speech act where the illocutionary force (the kind of act being performed) is intentionally left undetermined by the speaker at the moment of utterance, such that the force is constituted retroactively by the hearer's reaction (uptake).

  **The Mechanism:**
  1.  **Literal Commitment:** The propositional content is true and non-committal (e.g., "It would be a shame").
  2.  **Force Vacuum:** The speaker deliberately avoids the conventional markers of force (no imperative mood, no explicit performative verb like "I threaten").
  3.  **Delegated Anchoring:** The speaker intends for the hearer to "anchor" the force. If the hearer complies, the act becomes a **Threat/Order**. If the hearer ignores/challenges it, the act remains an **Observation/Remark**.
  4.  **Retroactive Intent:** The speaker's intention is not "I am threatening you," but "I am creating a situation where *your reaction* decides if I threatened you."

  ### How it sits with the nearest neighbors

  | Concept | What fixes the Force? | Speaker's Commitment | Why it's not your case |
  | :--- | :--- | :--- | :--- |
  | **Direct Speech Act** | Convention + Wording | High ("I order you") | Your case lacks explicit markers. |
  | **Indirect Speech Act** | Inference + Context | High (Hidden but fixed) | In "Can you pass the salt?", the request is fixed *before* you pass it. In your case, the threat isn't fixed until compliance. |
  | **Implicature** | N/A (Concerns Content) | N/A | Implicature hides *what is meant*. Your case hides *what is being done*. |
  | **Contingent Illocution** | **Hearer's Uptake** | **None (until uptake)** | **This is your case.** The force is fluid until the hearer solidifies it. |

  ### The Edges and Boundaries

  To ensure we have the right carving, we need to see where the concept bleeds into similar phenomena and where it stops.

  **1. The Borderline Case (Barely Qualifies): The Flirtatious Ambiguity**
  *   *Utterance:* "You look dangerous tonight."
  *   *Analysis:* If the hearer leans in, it's a **Come-on**. If the hearer steps back, it's a **Compliment**.
  *   *Why it barely qualifies:* This shares the structure of Contingent Illocution. However, often in flirting, the speaker *does* have a preferred outcome (they want it to be a come-on) and is merely testing the waters. In your boss/threat cases, the speaker is often indifferent to the specific force, provided they retain deniability. If the speaker *prefers* one force but hides it, it's a **Test Balloon**. If the speaker is truly indifferent to the force and only cares about the *option* to choose later, it is a pure **Contingent Illocution**.

  **2. The Near Miss (Looks Similar, Isn't): Sarcasm**
  *   *Utterance:* "Nice job breaking the printer." (When the printer is broken).
  *   *Analysis:* This relies heavily on uptake. If the hearer takes it literally, the act fails. If they recognize the tone, it's **Mockery**.
  *   *Why it isn't:* In sarcasm, the speaker's intent is fixed *at the moment of speaking*. They *mean* it as mockery. The hearer must *detect* that fixed intent. In Contingent Illocution, the intent is *not fixed* until the hearer acts. Sarcasm is a **Hidden Force**; Contingent Illocution is a **Deferred Force**.

  **3. The Clear Non-Case: A Genuine Question**
  *   *Utterance:* "Do you have the time?"
  *   *Analysis:* If the hearer ignores it, the act was still a **Question**. It does not turn into a **Statement** because they ignored it.
  *   *Why it isn't:* The force is fixed by convention (interrogative syntax) and speaker intent. The uptake (answering or not) affects the *perlocution* (whether you get the time), but not the *illocution* (what act was performed).

  ### Why this distinction matters

  You noted that "the intention is about the uptake rather than prior to it." This breaks the standard Gricean/Searlean model where communication is the transmission of a pre-packaged intent.

  In a **Contingent Illocution**, the speaker is not transmitting a state of mind; they are deploying a **tool**. The utterance is a mechanism that allows the speaker to outsource the risk of the speech act to the hearer.
  *   If the hearer complies, they validate the threat (and the speaker gets the result).
  *   If the hearer complains, they validate the observation (and the speaker avoids the penalty).

  This is why "Indirect Speech Act" is insufficient. An indirect speech act is a *coded* message. A Contingent Illocution is an *uncoded* message with a *variable* function. It is the linguistic equivalent of a "break glass in case of emergency" box where the speaker decides whether the glass was broken only after looking at the hearer's hands.

  ### Summary Label
  If you need to label this in conversation or analysis, use **"Contingent Illocution"** or **"Uptake-Contingent Force."**

  It captures the specific pathology you identified: the force is not hidden (implicature), nor is it fixed but indirect (indirect speech act). It is **pending**, waiting for the hearer to sign the contract the speaker left blank.
