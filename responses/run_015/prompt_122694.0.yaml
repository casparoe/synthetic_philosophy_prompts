      *   Check against the user's specific constraints (American English, forum-literate but not academic).

      *(Self-Correction during drafting)*: I should be careful not to just say "Reject Step 5." I need to explain *why* Step 5 fails here. It fails because "noticeable" is vague. Transitivity holds for precise values (5 > 4, 4 > 3, so 5 > 3), but fails for vague predicates (bald/not bald, noticeable/unnoticeable). This is the Sorites Paradox. I need to name-drop "Sorites" but explain it simply.

