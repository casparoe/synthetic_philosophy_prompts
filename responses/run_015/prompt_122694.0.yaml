          7.  Give the user a concrete script/rebuttal.

      *   *Refining the "Transitivity" point:* This is the crux. If $A$ is indistinguishable from $B$, and $B$ from $C$, $A$ is *not* necessarily indistinguishable from $C$. (Just Noticeable Difference). The opponent treats "morally neutral" as a precise switch, but it's a fuzzy boundary.
      *   *Refining the "Weight" point:* The user worries that admitting specks have weight makes them lose. I need to explain the difference between *additive* weight and *lexical* thresholds. You can say specks matter, but torture is a different *category* of badness.
      *   *Refining the "Torture = Zero" point:* Emphasize that the opponent cannot claim the logic works for Specks->Torture but fails for Torture->Zero. It's the same chain.

  6.  **Final Polish:**
