          *   *Pros:* This is the standard philosophical solution to Sorites paradoxes. It saves the intuition that tiny changes don't matter *locally*, but big changes *do* matter *globally*.
          *   *Cons:* Logically messy. It means our moral reasoning isn't perfectly consistent.
          *   *User's intuition:* "No worse than carries across the steps... Run it along the whole chain." This is the transitivity claim.

      *   **Rejecting the Continuum (3)/(4) [The Steps]:**
          *   *Idea:* You can't actually make the transfer without someone noticing at some point.
