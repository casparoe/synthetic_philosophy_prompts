prompt: |-
  I'm a backend and tooling engineer with no formal training in philosophy or biology, and my reading group — mostly engineers, plus one evolutionary biologist — has just spent two sessions on the 1979 Gould and Lewontin paper that introduced biological spandrels as a critique of the adaptationist programme, and we are no closer to a conclusion than when we started. What keeps nagging at me is how exactly the dispute maps onto my day job: an organism looks to me like a large, undocumented, untested legacy codebase that has been in continuous production for a very long time, the adaptationist is the engineer who observes a behavior, assumes it is load-bearing, and reconstructs a rationale for why it had to be built that way, and the spandrel critic is the one who says a lot of it is scaffolding, build artifact, or path-dependent residue of architectural decisions made for other reasons. So I'd like you to draft the joint statement that a committed adaptationist — the reverse-engineering, design-stance, "selection is the only known engine of complex functional order" sort — and a committed structuralist critic in the Gould–Lewontin line could both sign after a good-faith adversarial collaboration. (Gould's later coinage of "exaptation" with Vrba is available to both parties, and I expect it will do some work in the agreed-claims section.)

  Because my group has a bad habit of declaring agreement on sentences that turn out to be empty, I want two devices developed in the document rather than merely named. The first is a base rate: the share of well-documented phenotypic traits in some reasonably specified clade that were built by natural selection for the role they now play. Make each side commit to a numeric range, state what it counts as a trait and how it would sample them, and say what evidence would move its range and by how much. The second is something I've been calling the equifitness neighborhood: for a given trait, the number of distinct phenotypes reachable from it by small mutational steps whose fitness is within measurement noise of the current one. If that number is typically large, then "selection built this for this function" looks underdetermined, since selection could not have discriminated between the alternatives; if it is typically tiny, the adaptationist's inference is nearly forced. Both sides should say what magnitude they expect, why, and what would count as measuring it — I suspect the honest answer is that we have almost no grip on this number, and I want to see whether they can agree on that without giving up the argument.

  Format the result as a numbered agreed-claims section — including, at minimum, what both accept about the population-genetic formalism, about selection, drift, developmental constraint and history all being real, about the distinction between a trait's historical origin and its current utility, and about whether the quarrel is about whether selection occurs at all or only about the base rate and about the evidential worth of trait-by-trait adaptive stories — followed by a disagreements table with three columns: the issue stated neutrally, the adaptationist's own preferred wording, and the critic's own preferred wording, each phrased so that side would accept it as fair rather than as a caricature. Then give the cruxes, and for each one a concrete case or line of evidence both would agree bears on it, with each side's prediction written down in advance. Cruxes I'd like considered, though you should drop or add any that don't earn their place: convergent evolution as a natural experiment, for instance the camera-type eyes of vertebrates and cephalopods where one lineage's retina is wired backwards relative to the other's, so that each side can predict what the next ten such comparisons will show about how much shared functional demand really pins down architecture; the dispute over how much of a large genome is currently under purifying selection, which both should agree comparative genomics speaks to; the "just-so story" charge against un-replicated trait-by-trait explanation, together with the reply that in a historical science consilience among many weak lines is the only available standard; and my own maintenance-cost argument that in an actively maintained codebase gratuitous complexity tends to be stripped out, so surviving structure is usually load-bearing or nearly free, which seems to favor the adaptationist, against the counter that removal risk, lock-in and path dependence preserve plenty of junk, plus complexity too nearly neutral for selection to see — tell me how much weight that analogy deserves and where it breaks. If you conclude that some part of the dispute is merely verbal, say exactly which part and what substantive disagreement survives once it is deflated, and flag any formulation you suspect a real partisan would refuse to sign. Close with a short section on where this collaboration's own framing is most likely to be mistaken or to be rejected by working evolutionary biologists, and for each side name the single argument or finding that would most move it — not "more research is needed," but the specific result that would do the work. Please assume no web access and make no use of citations or reading lists; reason from the concepts, and define any technical term you rely on, since most of my group are engineers who will otherwise nod along.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **User Persona:** Backend/tooling engineer, no formal training in philosophy/biology.
      *   **Context:** Reading group (engineers + 1 evolutionary biologist) struggling with Gould & Lewontin's "Spandrels of San Marco" (1979).
      *   **Core Analogy:** Organism = Legacy Codebase. Adaptationist = Engineer assuming load-bearing code. Structuralist/Spandrel Critic = Engineer seeing scaffolding/artifacts/path-dependence.
      *   **Task:** Draft a *Joint Statement* signed by a committed Adaptationist and a committed Structuralist (Gould-Lewontin line).
      *   **Key Requirements:**
          1.  **Agreed Claims Section:** Numbered, covering population genetics, selection/drift/constraints, origin vs. utility, nature of the quarrel (base rate vs. existence).
          2.  **Two Specific Devices:**
              *   *Base Rate:* Numeric range commitment, definition of trait/sampling, evidence to move range.
              *   *Equifitness Neighborhood:* Definition, expected magnitude, measurement method, agreement on current ignorance.
          3.  **Disagreements Table:** Neutral issue, Adaptationist wording, Critic wording (fair, not caricature).
          4.  **Cruxes:** Concrete cases/evidence, specific predictions (drop/add as needed). Must include: Convergent evolution (eyes), Genome purifying selection, "Just-so stories" vs. consilience, Maintenance-cost analogy (engineer's specific request).
          5.  **Verbal Dispute Check:** Identify if any part is merely verbal and what survives. Flag formulations a partisan might refuse.
          6.  **Critique of the Collaboration:** Where this framing fails biologically.
          7.  **Moveable Arguments:** One specific result for each side that would change their mind (no "more research").
      *   **Constraints:** No web access, no citations, define technical terms, reason from concepts.

  2.  **Deconstruct the Core Concepts:**
      *   *Adaptationism:* Selection is the primary shaper of complex functional order. Traits exist *because* they were selected for their current function (or a precursor).
      *   *Spandrels/Structuralism:* Not all traits are adaptations. Some are byproducts (spandrels), constraints (physics/development), or drift. Critique of "just-so stories."
      *   *Exaptation (Gould & Vrba):* Trait evolved for X, now used for Y. Bridges the gap but doesn't solve the "origin" question.
      *   *Engineer Analogy:* Code refactoring vs. technical debt.
      *   *Base Rate:* What % of traits are true adaptations?
      *   *Equifitness Neighborhood:* How many other solutions work just as well? (Rugged fitness landscape concept).

  3.  **Drafting - Section by Section:**

      *   **Header:** Needs to look formal but collaborative.
      *   **Preamble:** Acknowledge the "Legacy Code" analogy as a useful heuristic but note its limits.
      *   **Section 1: Agreed Claims:**
          *   Need to establish common ground on population genetics (Hardy-Weinberg basics, selection coefficients).
          *   Acknowledge Selection, Drift, Constraint, History are all real forces.
          *   Distinguish *Origin* (etiology) from *Current Utility* (maintenance).
          *   Define the quarrel: It's not *if* selection happens, but *how much* of the phenotype it explains.
          *   *Device 1 (Base Rate):* This is tricky. Adaptationists will want high (e.g., >80%), Critics low (e.g., <50%). Need to define "trait" carefully (atomic vs. composite). Let's aim for a compromise on *uncertainty* rather than false precision, but the prompt asks for numeric ranges. I'll make them distinct but overlapping in uncertainty.
          *   *Device 2 (Equifitness Neighborhood):* Define as "neutral network size." Adaptationist expects small (selection finds the peak). Critic expects large (many paths up the same hill). Both agree we can't measure it well yet.

      *   **Section 2: Disagreements Table:**
          *   Issue: Default Null Hypothesis. Adaptationist: "Assume adaptation until proven otherwise." Critic: "Assume null (drift/constraint) until adaptation is proven."
          *   Issue: Explanatory Burden. Adaptationist: "Function explains form." Critic: "History/Constraint explains form."
          *   Issue: The "Optimality" Assumption. Adaptationist: "Organisms are locally optimized." Critic: "Organisms are 'good enough' satisficers."

      *   **Section 3: Cruxes (The Testing Ground):**
          *   *Convergent Evolution (Eyes):* Adaptationist says "Same function = Same design." Critic says "Look at the wiring differences (inverted retina)." Prediction: Next 10 cases will show functional convergence but structural divergence.
          *   *Genomic Load (Junk DNA):* Adaptationist says "Most DNA does something (regulatory)." Critic says "Most is neutral drift." Prediction: ENCODE-style projects vs. Comparative genomics.
          *   *Just-So Stories:* Adaptationist says "Consilience validates stories." Critic says "Replication/Experimental manipulation required."
          *   *Maintenance Cost (The Engineer's Point):* This is crucial. Code gets refactored. Biology doesn't have a "refactor" button.
              *   *Adaptationist:* "Costly things get purged."
              *   *Critic:* "Lock-in prevents purging."
              *   *Verdict:* The analogy breaks on *agency*. Code has a maintainer; biology has only death.

      *   **Section 4: Verbal Disputes:**
          *   Is "Adaptation" being used differently? Sometimes "Adaptation" means "Current Utility" vs "Historical Origin."
          *   Real disagreement remains on the *prevalence* of historical selection.

      *   **Section 5: Critique of Framing:**
          *   Biologists might hate the "Base Rate" idea. Traits aren't countable like lines of code. Pleiotropy (one gene, many effects) makes counting impossible.
          *   The "Engineer" analogy implies design/intent, which is dangerous teleology.

      *   **Section 6: Moveable Arguments:**
          *   Adaptationist: Show a complex trait with *zero* fitness advantage that persists (drift proof).
          *   Critic: Show a complex trait where every mutational step is tracked and shown to be selected *for* the current function (direct path proof).

  4.  **Refining and Polishing:**
      *   *Tone:* Professional, precise, slightly academic but accessible to engineers.
      *   *Definitions:* Ensure "Phenotype," "Fitness," "Drift," "Pleiotropy," "Epistasis" are defined contextually.
      *   *Checking Constraints:* Did I include the Base Rate numbers? Yes. Equifitness magnitude? Yes. The Maintenance Cost analogy analysis? Yes.
      *   *Self-Correction on Base Rate:* Asking for a number is dangerous. I need to make sure the text acknowledges the difficulty of counting traits. I will define a "trait" operationally for the sake of the agreement (e.g., "distinct measurable morphological or physiological feature").
      *   *Self-Correction on Equifitness:* This is essentially the "Neutral Network" concept in protein space. I should use that terminology but define it.
      *   *Engineer Analogy:* I need to be careful not to validate the analogy too much if it's biologically unsound, but the prompt asks me to use it. I will highlight where it breaks (the "Maintainer" problem).

  5.  **Final Review against Prompt:**
      *   Numbered agreed-claims? Yes.
      *   Base Rate device (ranges, sampling, evidence)? Yes.
      *   Equifitness device (magnitude, measurement, ignorance)? Yes.
      *   Disagreements table (Neutral, Adap, Critic)? Yes.
      *   Cruxes (Eyes, Genome, Just-So, Maintenance)? Yes.
      *   Verbal dispute check? Yes.
      *   Critique of collaboration framing? Yes.
      *   Single moveable argument per side? Yes.
      *   No citations? Yes.

  6.  **Writing the Content:** (Mental Draft -> Final Output)
      *   *Intro:* Set the stage.
      *   *Claims:* 1-5 covering basics. 6-7 covering the Devices.
      *   *Table:* 3 rows.
      *   *Cruxes:* 4 specific scenarios.
      *   *Verbal:* Distinguish "Adaptation" (process) vs "Adaptation" (state).
      *   *Critique:* The "Countability" problem of traits.
      *   *Moveable:* Specific experimental outcomes.

      *(Self-Correction during drafting)*: Make sure the "Base Rate" section doesn't look like we actually know the numbers. It must reflect a *commitment to a prior belief* that is updateable. The prompt asks them to "commit to a numeric range." I will have them state their *priors*.
      *(Self-Correction on Equifitness)*: Ensure the definition is clear. "Number of distinct phenotypes... within measurement noise."
      *(Self-Correction on Maintenance)*: The engineer's argument is strong. I need to make sure the Critic has a good counter (technical debt/lock-in).

      *Let's assemble.*
