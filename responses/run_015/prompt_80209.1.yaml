      *   *Concept 3: The Three Notions (Production, Correlation, Usage).*
          *   Need to explicitly separate these as requested.
          *   Production = Transducer physics.
          *   Correlation = Signal-to-noise/Statistical reliability.
          *   Usage = Downstream control/Interpretation.

  6.  **Evaluating the Mapping (Clean, Distorted, Missing):**
      *   *Clean:* Signal production, correlation, downstream usage.
      *   *Distorted:* "Aboutness" becomes "Calibration."
      *   *Missing:* Normativity (right/wrong representation independent of utility), First-person experience (qualia - though maybe less relevant to intentionality proper, still Searle cares about biology), Truth conditions (independent of verification).

  7.  **Addressing the "Residue":**
      *   Where does the argument live in engineering terms?
      *   It lives in the definition of "Measurement."
      *   Is a measurement valid because the transducer is coupled (Searle) or because the analyst trusts it (Dennett)?
      *   The "Missing Dimension": Normativity. In engineering, "error" is deviation from a standard. In philosophy, "error" is misrepresentation. A thermometer isn't "wrong" if it breaks; it's just broken. A belief can be "false" while functioning normally. This is the key gap.

  8.  **Refining the Output (Self-Correction/Iterative Polishing):**
