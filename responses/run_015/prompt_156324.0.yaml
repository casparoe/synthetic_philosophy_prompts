  **Applications:** The pharmacy display is permissible: it aids deliberation without obscuring costs or deceiving perception. The school music is impermissible: like the road markings, it alters behavior through unconscious channels without the agent's knowledge, violating the requirement that influence mechanisms remain accessible to scrutiny. It functions as a subliminal nudge, akin to the optical illusion, because it bypasses conscious veto power entirely.

  **Casualties:** To maintain consistency, this principle must abandon your verdict on the **cafeteria layout**. If unconscious optical illusions are impermissible because they bypass deliberative scrutiny, unannounced physical rearrangements also bypass scrutiny, even without deception. You cannot consistently condemn subconscious steering in one instance while permitting it in another. The distinction between "illusion" and "arrangement" is too thin to support different ethical verdicts when both operate below conscious awareness.
