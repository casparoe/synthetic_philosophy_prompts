answer: |-
  Here is the battle plan for your 50 minutes.

  ### 1. Sequencing: Phenomenology Before Ontology
  You are correct: **The Kennedy pair must land before possible worlds.**
  Do not introduce "possible worlds," "similarity," or "closeness" until you have established that the material conditional ($\to$) fails to capture the data. If you start with worlds, students will treat them as just another row in a truth table.

  **The Order:**
  1.  **The Data:** Show two sentences with the same antecedent truth-value (false) and same consequent truth-value (true/false) that clearly differ in truth value themselves. (Kennedy/Match).
  2.  **The Problem:** Show why $\to$ cannot distinguish them (both have false antecedents, so both should be vacuously true).
  3.  **The Solution:** Introduce the "closest world" intuition *only* as a way to solve step 2.

  ### 2. The One Example: The Dry Match
  Use **The Match**. It is the canonical example for a reason: it is physical, causal, and familiar. Do not switch examples mid-section; vary the *sentences* built around the match.

  **What it needs:**
  *   **Physicality:** It must be a real match (or a picture of one) on your desk.
  *   **Known Facts:** Establish firmly: It is dry. It was not struck. It did not light.
  *   **Causal Structure:** Striking causes lighting; wetness prevents lighting.

  **What it must lack:**
  *   **Epistemic Uncertainty (for the Counterfactual):** For the counterfactual portion, the class must agree on the actual facts. If they debate whether the match was actually struck, you lose the "false antecedent" lesson.
  *   **Historical Baggage:** Unlike Kennedy, no one has a conspiracy theory about the match.

  **How to wield it:**
  1.  **Indicative:** Hold up the match (box closed). "If this match is wet, it won't light." (We don't know if it's wet).
  2.  **Counterfactual:** Open the box, show it's dry. "If this match *had been* wet, it *wouldn't have* lit." (We know it wasn't wet).
  3.  **Backtracking:** "If this match *had lit*, it *must have been* struck."
  4.  **Semifactual:** "Even if I *had struck* it, it wouldn't have lit" (because it's a prop/broken).

  ### 3. Misconceptions & Defusal Points
  Here is when to kill the specific errors you worried about.

  | Misconception | When to Defuse | How to Defuse |
  | :--- | :--- | :--- |
  | **"If" = $\to$ (Horseshoe)** | **Minute 5** | Use the Kennedy/Match pair. Both have false antecedents. One is true, one is false. $\to$ says both are true. Therefore, $\to$ is wrong. |
  | **"Fake Past Tense"** | **Minute 15** | When switching from "If it is" to "If it had been." Explicitly state: "The past tense here is not about *time*; it is about *distance from reality*." |
  | **Vacuous Truth / No Truth Value** | **Minute 20** | When introducing worlds. Students will ask, "But the antecedent *is* false, so isn't it vacuously true?" Remind them: "We aren't evaluating in *this* world. We are evaluating in the *closest world where it is true*." |
  | **"Would" = "Might"** | **Minute 30** | Ask: "If I drop this chalk, *might* it shatter?" vs "*would* it shatter?" Use similarity: "Would" requires shattering in *all* closest worlds; "Might" requires *one*. |
  | **Backtracking** | **Minute 40** | Use the Match: "If it lit, it was struck." Warn them: "Normally we hold the past fixed. But if the consequent *requires* a different past to make sense, we backtrack. This is the exception, not the rule." |

  ### 4. Semifactuals: Keep Them (As the Payoff)
  **Do not drop them.** They are the best way to prove students aren't just memorizing slogans.
  *   **Why:** Indicatives and Counterfactuals usually suggest some dependence between $P$ and $Q$. Semifactuals ("Even if $P$, $Q$") explicitly deny dependence while keeping the conditional structure.
  *   **Placement:** Put this at **Minute 45**. It acts as the "Boss Battle."
  *   **The Point:** If they understand counterfactuals as "closest worlds," semifactuals are just cases where $Q$ is true in the closest $P$-world *and* the closest $\neg P$-world. It cements the "world-jumping" intuition better than standard counterfactuals do.

  ### 5. The Closing Question
  Do not ask them to define a counterfactual. Ask them to **evaluate** a case where the material conditional and the counterfactual diverge.

  **The Question:**
  > "Suppose I didn't buy a lottery ticket, and I didn't win.
  >
  > 1.  Is 'If I bought a ticket, I would have won' true or false?
  > 2.  According to the truth table for $\to$, is 'If I bought a ticket, I won' true or false?
  > 3.  Why do these answers differ?"

  **What this tells you:**
  *   If they say (1) is True, they haven't grasped similarity (they are picking a distant lucky world).
  *   If they say (2) is False, they haven't grasped the truth table (vacuous truth).
  *   If they can explain (3), they understand that natural language conditionals track *connection/causality*, not just truth values.

  ### 6. What to Refuse to Explain
  You have 50 minutes. You must explicitly refuse to answer the following, or you will run out of time:

  1.  **"What makes an Indicative true?"**
      *   *Say:* "We are treating indicatives as having truth values for now, but philosophers disagree on whether they are propositions or just probability expressions. That's a course for next year."
  2.  **"How do we measure similarity between worlds?"**
      *   *Say:* "Lewis and Stalnaker fought about this for decades. For this class, 'similar' means 'changes as little as possible about the actual world.'"
  3.  **"What about Gibbard's Proof?"**
      *   *Say:* "That proof suggests indicatives don't have truth conditions at all. We are bracketing that problem to focus on the counterfactual distinction."

  ### Summary Timeline
  *   **00–05:** Truth Table Recap (The Enemy).
  *   **05–15:** The Kennedy/Match Pair (The Data). Break the horseshoe.
  *   **15–25:** "Fake Past" & Possible Worlds (The Mechanism).
  *   **25–35:** "Would" vs. "Might" & Causal Order.
  *   **35–40:** Backtracking (The Exception).
  *   **40–45:** Semifactuals (The Payoff).
  *   **45–50:** Closing Question & Dismissal.
