      *   **Task:** Reconstruct the views committed to by each practice, determine if they are the same or inconsistent, identify required vs. decorative elements, explore what would change if views were swapped, identify underdetermined areas, and name the philosophical problem if applicable.
      *   **Constraints:** Argue from the provided cases/descriptions. No external references/reading suggestions. Flag unanswered questions. Be explicit about underdetermination.

  2.  **Deconstruct the Clinic's Practice:**
      *   *Action:* Ranking embryos based on genetic risk.
      *   *Language:* "Lowering your child's risk," "Avoiding the birth of a child who would suffer avoidably," "Cohort with no good option."
      *   *Logic:*
          *   Comparison is between *possible* children (Embryo A vs. Embryo B).
          *   Selecting A over B is a benefit (risk reduction).
          *   If all options are bad (serious dominant condition), do not create *any* of them (avoidance of suffering).
          *   Delaying cycle = different child, so no disadvantage to *that* child (Non-Identity intuition).
      *   *Underlying View:* There is a comparative standard of welfare applicable to possible persons. We ought to bring into existence the person with the best expected welfare (or at least avoid those with welfare below a threshold).
      *   *Tension:* The "delay" advice aligns with Non-Identity (different egg = different child), but the "ranking" advice aligns with Same-Person comparisons (Embryo A is better *for the child* than Embryo B). Wait, actually, the clinic treats Embryo A and Embryo B as candidates for *the same slot* ("your child"), implying a comparative benefit *to the resulting child* relative to the alternative candidate. But the "delay" advice admits the child is numerically different.
      *   *Key Philosophical Commitment:* Person-Affecting View (weak form) or Total/Impersonal View. It treats "your child" as a role that can be filled by different individuals, where filling it with Individual A is better than filling it with Individual B.

  3.  **Deconstruct the Legal Practice (Tort/Wrongful Birth/Life):**
      *   *Action:* Suing for negligence (missed genetic problem).
      *   *Logic (Child's Claim):*
          *   Most US states: Child cannot sue. Alternative was non-existence. Existence with disability is not worse than non-existence. (Non-Identity Problem).
          *   Some states (e.g., CA): Child can sue, but damages limited to expenses, not "life is worse."
          *   Germany: Child suing unconstitutional (implies life not worth living), but parents can recover costs.
      *   *Logic (Parents' Claim):* Parents *can* sue for costs. This implies the *parents* were harmed by being denied the choice to avoid conception/birth.
      *   *Underlying View:* Strong Person-Affecting View regarding the child. You cannot harm someone by bringing them into existence unless their life is not worth living (wrongful *life* vs. wrongful *birth*). The law refuses to compare existence with non-existence for the sake of the child's welfare claim.

  4.  **Identify the Philosophical Core:**
      *   **The Name:** This is the **Non-Identity Problem** (coined by Derek Parfit, though I shouldn't cite him as a reading suggestion, just name the concept).
      *   **The Conflict:**
          *   Clinic: Acts as if choosing Embryo A over Embryo B benefits *the child* (comparative assessment across identities).
          *   Court: Acts as if choosing Embryo A (disabled) over Non-Existence does *not* harm *the child* (no comparative assessment between existence and non-existence).
      *   **Nuance:** The clinic compares Identity A vs. Identity B. The court compares Identity A vs. Non-Existence.
      *   **Is it inconsistent?**
          *   *Surface level:* Yes. Clinic says "We made things better for the child." Court says "You can't say the child was harmed by being born."
          *   *Deep level:* It depends on the theory of welfare.
          *   *Theory 1 (Person-Affecting):* An act is wrong only if it makes some *particular* person worse off.
              *   Court follows this strictly (Child A is not worse off than Child A would have been otherwise, because otherwise Child A wouldn't exist).
              *   Clinic *violates* this when ranking A vs B (Child A is not worse off than Child B, because they are different people). The clinic treats "your child" as a generic slot.
          *   *Theory 2 (Impersonal/Total Utilitarianism):* An act is wrong if it results in a state of affairs with less total welfare, regardless of who exists.
              *   Clinic follows this (Choose the embryo with higher expected welfare).
              *   Court rejects this (Refuses to weigh existence vs. non-existence for the child).

  5.  **Drafting the Reconstruction:**

      *   **View 1: The Clinic (The "Best Start" / Impersonal View).**
          *   Presupposition: We are selecting for a *role* (the patient's offspring).
          *   Commitment: It is possible to compare the welfare of distinct possible persons.
          *   Required Language: "Lowering risk," "Better embryo."
          *   Decorative/Contingent: The specific threshold for "serious dominant condition." The advice on delay (this actually leans Non-Identity).
      *   **View 2: The Court (The "No Harm" / Person-Affecting View).**
          *   Presupposition: Harm requires making a *specific existing person* worse off than they otherwise would have been.
          *   Commitment: Non-existence is not a baseline for comparison for the child.
          *   Required Language: "Wrongful Birth" (parents harmed) vs. "Wrongful Life" (child not harmed).
          *   Decorative/Contingent: Damages limited to economic costs (this is a pragmatic fix to avoid valuing life).

  6.  **Addressing the Inconsistency:**
      *   Are they incompatible? Yes, regarding the *child's* welfare.
      *   Clinic: Selecting A over B is better *for the child* (implicitly).
      *   Court: Selecting A (disabled) over Nothing is not worse *for the child*.
      *   *Wait, refinement:* The Clinic compares A vs B. The Court compares A vs Nothing.
      *   *The Real Tension:* The Clinic treats A vs B as a welfare comparison *for the benefit of the resulting child*. The Court says A vs Nothing is *not* a welfare comparison *for the benefit of the resulting child*.
      *   If the Court is right (A is not harmed by being born), is the Clinic right (B is benefited by being chosen over A)?
      *   If the Non-Identity Problem holds, choosing B over A does not benefit B (B wouldn't exist otherwise). It just creates B instead of A.
      *   So, the Clinic is speaking loosely. They mean "We are creating a child with better prospects," not "We are benefiting this specific child."
      *   *Conclusion:* They are pragmatically consistent but theoretically inconsistent. The Clinic uses "Impersonal" logic for selection. The Court uses "Person-Affecting" logic for liability.

  7.  **Swapping the Views (Counterfactuals):**
      *   **Scenario 1: Clinic adopts Court's View (Strict Person-Affecting).**
          *   Change: Cannot say "lowering risk for your child." Must say "creating a different child with lower risk."
          *   Change: Cannot say "avoiding birth of child who would suffer." Must say "avoiding creating a child whose life might be below a threshold."
          *   Impact: Counseling becomes colder, more abstract. "We aren't helping *this* embryo; we are picking *that* one."
      *   **Scenario 2: Court adopts Clinic's View (Impersonal/Comparative).**
          *   Change: Child *can* sue for Wrongful Life.
          *   Change: Damages must reflect the difference between "Disabled Life" and "Non-Existence."
          *   Impact: Courts must declare some lives "not worth living" or assign negative value to existence. This is the German Constitutional Court's nightmare.

  8.  **Underdetermination:**
      *   The Clinic's "delay" advice is underdetermined. It uses Non-Identity logic (different egg = different child) to say "no disadvantage." But the ranking logic uses Impersonal logic (Embryo A is better than Embryo B). These don't perfectly align.
      *   The Court's damages (economic only) are underdetermined. It's a compromise to allow parent recovery without condemning the child's life.

  9.  **Structuring the Response:**
      *   **Introduction:** Name the problem (Non-Identity Problem).
      *   **Reconstruction 1: The Clinic (The Impersonal/Comparative View).** Break down commitments, required vs. decorative.
      *   **Reconstruction 2: The Courts (The Person-Affecting View).** Break down commitments, required vs. decorative.
      *   **Consistency Check:** Are they the same? No. Explain the friction point (A vs B vs. Nothing).
      *   **The Swap:** What happens if Clinic acts like Court? What happens if Court acts like Clinic?
