  ### Brainstorm: Identifying the Mistakes

  Before we dive into the arithmetic, I need to flag three specific conceptual errors in your analysis. These are common stumbling blocks, but they are crucial to why the "instability" charge sticks.

  1.  **The Definition of Ratifiability:** You are checking stability by comparing $EU(\text{Stay} | \text{Stay})$ against $EU(\text{Flee} | \text{Flee})$. This is incorrect. Ratifiability asks: "Given that I have *already decided* to Stay (and updated my beliefs accordingly), do I still prefer Stay over Flee?" You must compare $EU(\text{Stay} | \text{Stay})$ against $EU(\text{Flee} | \text{Stay})$. You hold the *decision* fixed and vary the *act* in the evaluation.
  2.  **The "Fixed" 90%:** You are treating the 90% accuracy as a fixed property of Death's location independent of your decision process in the counterfactual evaluation. In the ratifiability check, once you condition on "I have decided to Stay," the probability that Death is in Damascus is 90%. You must use *that* probability to evaluate the alternative act (Fleeing), not the probability associated with Fleeing ($P(\text{Death} | \text{Flee})$).
  3.  **CDT Priors:** You suspect you are "smuggling" probabilities in CDT. You are right to be cautious. CDT uses the unconditional probability of the state (or probability conditional on causal interventions), not the evidential conditional probability. The tension between CDT and EDT here often hinges on whether the agent's current location counts as evidence for the prior in CDT.

  ---

  ### The Arithmetic: Walking Through the Instability

  Let's run the numbers explicitly using your utilities:
  *   **Survive Damascus:** 10
  *   **Survive Aleppo:** 9
  *   **Die:** 0
  *   **Prediction Accuracy:** 90% (If you Stay, Death is in Dam w/ prob 0.9. If you Flee, Death is in Ale w/ prob 0.9).

  #### 1. Initial EDT Calculation (Your Step)
  EDT calculates expected utility based on the evidence the act provides.
  *   **$EU(\text{Stay})$:** If I Stay, evidence suggests Death predicted Stay.
      *   $P(\text{Death in Dam} | \text{Stay}) = 0.9$.
      *   $P(\text{Death in Ale} | \text{Stay}) = 0.1$.
      *   $EU = (0.1 \times 10) + (0.9 \times 0) = \mathbf{1}$.
  *   **$EU(\text{Flee})$:** If I Flee, evidence suggests Death predicted Flee.
      *   $P(\text{Death in Ale} | \text{Flee}) = 0.9$.
      *   $P(\text{Death in Dam} | \text{Flee}) = 0.1$.
      *   $EU = (0.1 \times 9) + (0.9 \times 0) = \mathbf{0.9}$.

  **Result:** EDT initially recommends **Stay** ($1 > 0.9$). Your arithmetic here was correct.

  #### 2. The Ratifiability Check (The Missing Step)
  To see if "Stay" is stable, we ask: *Once I have decided to Stay, and thus believe Death is in Damascus (90%), would I rather Flee?*
  We evaluate both acts using the probabilities conditional on the decision **Stay**.

  *   **$EU(\text{Stay} | \text{Stay})$:**
      *   We use $P(\text{State} | \text{Stay})$.
      *   Calculation: $0.1 \times 10 = \mathbf{1}$. (Same as above).
  *   **$EU(\text{Flee} | \text{Stay})$:**
      *   **Crucial:** We *still* use $P(\text{State} | \text{Stay})$. We do not switch to $P(\text{State} | \text{Flee})$.
      *   Given I decided Stay, $P(\text{Death in Dam}) = 0.9$ and $P(\text{Death in Ale}) = 0.1$.
      *   If Death is in Dam (0.9) and I Flee $\rightarrow$ I am in Aleppo, Death is in Damascus $\rightarrow$ **I Survive (9)**.
      *   If Death is in Ale (0.1) and I Flee $\rightarrow$ I am in Aleppo, Death is in Aleppo $\rightarrow$ **I Die (0)**.
      *   Calculation: $(0.9 \times 9) + (0.1 \times 0) = \mathbf{8.1}$.

  **Comparison:** Given I decided to Stay, Fleeing yields 8.1 utility while Staying yields 1.
  **Conclusion:** **Stay is not ratifiable.** I would change my mind.

  #### 3. The Reverse Check (Is Flee Stable?)
  Now suppose I decide to **Flee**. I now believe Death is in Aleppo (90%).
  *   **$EU(\text{Flee} | \text{Flee})$:**
      *   $P(\text{Death in Ale} | \text{Flee}) = 0.9$. Survival = 0.1.
      *   Calculation: $0.1 \times 9 = \mathbf{0.9}$.
  *   **$EU(\text{Stay} | \text{Flee})$:**
      *   We use $P(\text{State} | \text{Flee})$. $P(\text{Death in Ale}) = 0.9$.
      *   If Death is in Ale (0.9) and I Stay $\rightarrow$ I am in Dam, Death is in Ale $\rightarrow$ **I Survive (10)**.
      *   Calculation: $0.9 \times 10 = \mathbf{9}$.

  **Comparison:** Given I decided to Flee, Staying yields 9 utility while Fleeing yields 0.9.
  **Conclusion:** **Flee is not ratifiable.** I would change my mind.

  ---

  ### The Actual Answer

  You have found a determinate recommendation ($EU(\text{Stay}) > EU(\text{Flee})$), but you have not found a **deliberational equilibrium**. The "instability" in the standard story refers precisely to the ratifiability failure demonstrated above.

  1.  **The Instability:** EDT recommends Stay. But the *reason* it recommends Stay (the high probability of Death in Damascus) makes Fleeing more attractive *once that recommendation is accepted as evidence*. As you deliberate, your credences shift. If you lean Stay, you fear Damascus, so you lean Flee. If you lean Flee, you fear Aleppo, so you lean Stay. You oscillate forever. There is no pure strategy that is self-confirming.
  2.  **The Mixed Strategy Solution:** Your flatmate is actually right, though perhaps for the wrong reason. In games of this structure (and in ratifiability decision theory), the only stable solution is often a **mixed strategy**. You must randomize your decision to break the correlation between your specific choice and Death's prediction.
      *   You need to find a probability $p$ (of Staying) such that you are indifferent between Stay and Flee.
      *   This requires Death to be in Damascus with probability $10/19$ (approx 52.6%).
      *   If you commit to a randomizing device that makes you unpredictable *even to yourself* until the last moment, you can achieve a higher expected survival rate (approx 50%) than the pure strategies (10%).
  3.  **CDT vs. EDT:** You asked if the complaint is just that EDT does worse than CDT.
      *   **CDT** says: "My choice doesn't causally move Death. I should act based on where he *is*." Since you are in Damascus and he is a reliable hunter, your prior $P(\text{Death in Dam})$ is high (let's say 0.9).
      *   CDT calculates: $EU(\text{Stay}) = 1$, $EU(\text{Flee}) = 8.1$. **CDT says Flee.**
      *   CDT is "stable" in the sense that it doesn't oscillate (it ignores the evidence of your own decision), but many philosophers argue CDT is *wrong* here because it ignores the fatal correlation that EDT picks up on. EDT picks up the correlation but can't act on it without contradicting itself. This is why Death in Damascus is a "hard case" for both theories.

  ---

  ### Summary of Mistaken Premises

  To ensure you get the structure right, here are the specific premises in your thought process that were mistaken:

  1.  **Mistaken Premise:** *"If EDT says Stay, and Stay is best by EDT's own lights, isn't it stable?"*
      *   **Correction:** Stability (Ratifiability) requires the act to be best *given the information the act itself reveals*. As shown in the arithmetic, Stay is best initially, but *given the information revealed by deciding to Stay*, Flee becomes best.
  2.  **Mistaken Premise:** *"I put about 90% on his being in Damascus tomorrow." (Treated as fixed prior)*
      *   **Correction:** In the EDT calculation, this 90% is a *conditional* probability dependent on your action. In the CDT calculation, it is a *prior* dependent on background evidence. Confusing these leads to errors in comparing the two theories.
  3.  **Mistaken Premise:** *"Flipping a weighted coin... doesn't help if Death can predict how the coin lands."*
      *   **Correction:** If Death predicts the *outcome* of the coin, you are doomed. But if you use a genuinely indeterministic process (or one causally isolated from Death's prediction mechanism) to determine your action *after* Death has made his prediction, you break the correlation. In decision theory, we usually assume the mixed strategy is a commitment to a *propensity* that Death predicts, leading to a Nash Equilibrium where both you and Death randomize.

  ---

  ### Explicit CDT Probability Breakdown

  You mentioned a nagging feeling about "smuggling" probabilities in CDT. Here is how to keep them straight.

  **Causal Decision Theory Formula:**
  $$EU_{CDT}(\text{Act}) = \sum_{S} P(S \text{ do } \text{Act}) \times U(S, \text{Act})$$
  Since your act does not *cause* Death's location, $P(S \text{ do } \text{Act}) = P(S)$. You use the **unconditional prior probability** of the state.

  **The CDT Calculation:**
  1.  **Determine the Prior $P(\text{Death in Dam})$:**
      *   CDT says: Ignore the evidence provided by your *choice*. But use all *other* evidence.
      *   Evidence: "I am in Damascus today," "Death is a reliable hunter."
      *   Reasonable Prior: $P(\text{Death in Dam}) = 0.9$. (This is not smuggling; this is your credence based on background facts).
  2.  **Calculate EU:**
      *   **$EU(\text{Stay})$:**
          *   State: Death in Dam (0.9). Utility: 0.
          *   State: Death in Ale (0.1). Utility: 10.
          *   Sum: $(0.9 \times 0) + (0.1 \times 10) = \mathbf{1}$.
      *   **$EU(\text{Flee})$:**
          *   State: Death in Dam (0.9). Utility: 9 (You are in Ale, he is in Dam).
          *   State: Death in Ale (0.1). Utility: 0.
          *   Sum: $(0.9 \times 9) + (0.1 \times 0) = \mathbf{8.1}$.
  3.  **Result:** CDT recommends **Flee**.

  **Where the "Smuggling" Worry Comes From:**
  You might worry that using $P(\text{Death in Dam}) = 0.9$ in CDT is unfair because that 0.9 comes from the prediction correlation.
  *   **Philosophical Defense:** CDT proponents argue that the correlation is evidential, not causal. If you are in Damascus, it is *likely* Death is in Damascus regardless of what you do tomorrow, because he is hunting you *now*. The fact that he predicts your future move is evidence of his competence, which updates your prior about his current/future location *independently* of your causal leverage.
  *   **The Conflict:** EDT says "If I Stay, that *makes* it 90% likely he's here." CDT says "It's already 90% likely he's here; my staying doesn't change that." Both use the number 0.9, but EDT treats it as $P(S|A)$ and CDT treats it as $P(S)$. That is the entire structural difference.

  **Final Verdict:** You haven't found a hole in the standard story; you've found the exact point where the standard story gets interesting. The instability is real, it lies in the ratifiability condition, and it forces EDT agents toward mixed strategies to survive.
