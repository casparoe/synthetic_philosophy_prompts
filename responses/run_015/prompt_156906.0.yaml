answer: |-
  **INTERNAL MEMORANDUM**

  **TO:** All Regional Warning Officers, Communications Desk
  **FROM:** Standards and Protocols Division
  **DATE:** 14 October 2023
  **SUBJECT:** Mandatory Transition to Conditional Credence Formatting

  **1. Prohibition of Indicative Conditionals**
  Effective 0900 hours tomorrow, staff are prohibited from issuing public advisories containing indicative conditional structures. Statements linking antecedent conditions to consequent outcomes via conjunctive particles (e.g., "if," "should," "in the event that") are deemed non-propositional under Directive 88-B. All warnings must instead express flat statements of conditional credence. The format P(Consequent | Antecedent) = x is mandatory. For example, replace "If the river tops the embankment, the lower ward floods" with "P(Lower Ward Flooding | River Level > 4m) = 0.9."

  **2. Selection from the Antecedent Register**
  Antecedents must be drawn exclusively from the official Antecedent Register (Version 4.2). Staff are advised to select antecedents that maximize numerical stability. Register entries characterized by low observability or narrow temporal windows are preferred for high-credence outputs. A statement assigning a probability of 0.95 to a flooding event given an unobservable antecedent remains statistically valid regardless of field verification. This ensures advisory metrics remain robust against post-event audit.

  **3. Immunity to Falsification**
  Personnel must understand that conditional credence statements are not falsified by the non-occurrence of the antecedent. Should the river level remain below 4 meters, the statement P(Flooding | River Level > 4m) = 0.9 retains its validity. The Legal Office has confirmed that this structure insulates the Service from liability regarding outcomes where the antecedent fails to obtain. No claim of negligence may stand where the condition for the probability was never met.

  **4. Resolution of Nested Conditionals**
  Complex advisories involving nested conditions (e.g., "If the pumps fail, then if the gate sticks, the ward floods") must be flattened into a single joint probability space. The example above translates to P(Ward Flooding | Pump Failure & Gate Sticking) = x. Staff should note that this reduction removes causal sequencing but satisfies the Standing Committee on Non-Propositional Statements' requirement for operator-free syntax. Do not attempt to preserve the hierarchical relationship between pump failure and gate sticking.

  **5. Restrictions on Modal Paraphrase**
  Attempts to circumvent Clause 1 using modal verbs ("would," "could") or temporal prepositions ("upon," "following") are prohibited. These terms implicitly reintroduce conditional operators. However, staff may find that almost any descriptive paraphrase of a contingency sneaks an "if" back into the semantic structure. In such cases, prioritize the mathematical notation over grammatical coherence. If a sentence sounds unnatural but contains a vertical bar, it is compliant.

  **6. Householder Updating Protocols**
  The Service provides conditional credences, not actionable certainties. A bare probability tells a householder nothing until they learn the antecedent and update their own priors. It is the resident's responsibility to observe river levels and apply Bayes' rule independently. The Service is not responsible for confusion arising from the public's inability to process conditional probabilities without observed evidence of the condition.

  **7. Compliance Regarding Memo Structure**
  Should any sentence within this memorandum employ a conditional construction, that sentence is hereby unauthorized and void.
