prompt: |-
  I'm reading Lewis's Conventions and I keep running into people going "conventions are arbitrary" like it settles the whole debate. most recently in a thread about driving on the right vs the left, where someone used it to shut down the idea that conventions ever hook onto anything real beyond everyone expecting everyone else to do it. what are the different precise claims that one-liner could actually be making, from the trivial to the radical? i've got some — "the specific convention we landed on is arbitrary," "there could have been no convention at all," "we could swap to the other option any time we wanted" — but i don't think i have the full menu. say which of these are platitudes, which are real theses Lewis would actually endorse, which are just false, and which reading is the one doing the work when someone uses it to end the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is reading David Lewis's *Convention: A Philosophical Study*.
      *   **Problem:** They encounter people saying "conventions are arbitrary" as a conversation-stopper (especially regarding driving on the right vs. left).
      *   **Goal:** The user wants a breakdown of the *precise claims* hidden behind that one-liner.
      *   **Requirements:**
          *   List the different interpretations (from trivial to radical).
          *   Classify them: Platitude, Lewis-endorsed thesis, False, or the "workhorse" interpretation used to end arguments.
          *   Address the specific example (driving side).
          *   Maintain philosophical precision (Lewisian framework).

  2.  **Deconstruct "Conventions are Arbitrary":**
      *   What does Lewis actually say? In *Convention*, Lewis defines convention using game theory (coordination equilibria). A key component is "arbitrariness."
      *   What does the *layperson* mean? Usually something like "it doesn't matter," "it's not based on nature," or "we could change it easily."
      *   I need to distinguish between *arbitrariness of selection* (why *this* one?), *arbitrariness of necessity* (could we have done without?), and *arbitrariness of normativity* (does it bind us?).

  3.  **Brainstorming the Claims (The "Menu"):**
      *   *Claim 1:* The choice between alternatives was historically contingent. (We could have driven on the left.)
      *   *Claim 2:* There is no intrinsic moral/physical reason for one over the other. (Right isn't naturally better than left.)
      *   *Claim 3:* We could change it tomorrow if we wanted. (Switching costs are ignored.)
      *   *Claim 4:* The convention doesn't track any independent truth. (Anti-realist about the rule.)
      *   *Claim 5:* There didn't need to be a convention at all. (Maybe we could drive wherever.)
      *   *Claim 6:* My obligation to follow it is weak because it's arbitrary. (Normative defeasibility.)

  4.  **Mapping to Lewis's Theory:**
      *   Lewis *does* endorse arbitrariness, but specifically defined. It's about *alternative regularities* that could have served the same purpose.
      *   Lewis would reject the idea that we can switch anytime (costs/coordination problems).
      *   Lewis would reject the idea that there's no reason for a convention (coordination is necessary).
      *   Lewis would reject the idea that arbitrariness undermines the obligation (once established, it binds).

  5.  **Drafting the Classifications:**

      *   *Platitude:* "We could have picked the other one historically." (True, trivial).
      *   *Lewisian Thesis:* "There exists an alternative regularity that would have worked just as well." (This is Lewis's technical definition).
      *   *False:* "We can switch whenever we want." (Ignores coordination costs).
      *   *False:* "It doesn't matter which we do." (It matters *that* we do one, just not *which* one).
      *   *The "Argument Ender":* Usually a mix of "No intrinsic reason" + "Therefore your preference is invalid."

  6.  **Refining the "Argument Ender" Analysis:**
      *   Why do people use it to shut down debate? Usually to dismiss normative claims or claims about natural fitness.
      *   Example: "Driving on the right is safer." Reply: "No, it's arbitrary."
      *   The hidden move is often conflating *origin* with *maintenance* or *intrinsic value* with *coordination value*.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge Lewis's specific definition vs. the colloquial use.
      *   **The Menu of Claims:** Break them down by strength/implication.
      *   **Classification:** For each claim, label it (Platitude, Lewisian, False, etc.).
      *   **The "Shut Down" Move:** Analyze the rhetorical function.
      *   **Lewis's Actual View:** Briefly summarize Lewis's technical notion of arbitrariness to clarify the confusion.
      *   **Conclusion:** Summary advice for the user.

  8.  **Self-Correction/Nuance Check during Drafting:**
      *   *Check:* Did Lewis say conventions are *completely* arbitrary?
      *   *Correction:* No, he says there is a *degree* of arbitrariness. There must be an alternative that *could* have been established. But once established, it's not arbitrary *for the agent* in that moment.
      *   *Check:* Is "There could have been no convention" a valid claim?
      *   *Correction:* In the driving case, no. You need *some* rule to avoid crashing. So that claim is false for coordination problems.
      *   *Check:* Make sure to distinguish between *arbitrariness of origin* and *arbitrariness of justification*.

  9.  **Final Polish:** Ensure the tone is helpful, philosophically rigorous, but accessible (matching the user's engagement level). (The user is reading Lewis, so they can handle terms like "coordination equilibrium" or "regularity.")

      *(Self-Correction on the "Argument Ender"):* I need to be careful. When someone says "it's arbitrary" to end a debate, they often mean "There is no *independent* reason to prefer A over B, so stop arguing as if there is." This is often a *true* claim used to block a *false* implication (that therefore the convention is worthless). I should highlight this distinction.

  10. **Final Review against constraints:**
      *   Did I list the claims? Yes.
