answer: |-
  This is a classic frustration when reading *Convention*. Lewis is doing precise technical work with game theory and possible worlds, while the colloquial use of "arbitrary" is a philosophical sledgehammer that smashes distinctions Lewis carefully builds.

  When someone says "conventions are arbitrary" to shut down a debate about driving sides, they are usually sliding between three or four distinct claims. Some are trivial truths, some are Lewisian theses, and some are outright falsehoods that Lewis spends chapters dismantling.

  Here is the menu of claims hidden behind that one-liner, classified by their truth value and their relationship to Lewis's theory.

  ### 1. The Historical Contingency Claim
  **The Claim:** "We happen to drive on the right, but history could have easily gone the other way (e.g., if Napoleon had won, or if the US hadn't influenced Canada)."
  *   **Status:** **Platitude.**
  *   **Lewis's View:** Endorsed. Lewis agrees that the *selection* of one equilibrium over another is historically contingent.
  *   **Function:** This is the weakest claim. It merely says the actual world is one of several possible worlds where a convention exists. It doesn't imply the convention is weak or changeable *now*.

  ### 2. The Intrinsic Indifference Claim
  **The Claim:** "There is no intrinsic physical or moral property of 'right-ness' that makes it better than 'left-ness' for driving."
  *   **Status:** **True (mostly).**
  *   **Lewis's View:** Endorsed. This is the core of Lewis's technical definition. For a regularity to be a convention, there must be an **alternative regularity** that could have served the same coordination purpose almost as well.
  *   **Function:** This is the claim doing the heavy lifting in the driving debate. It correctly identifies that the *content* of the rule doesn't track natural law (unlike "don't touch fire").

  ### 3. The Switchability Claim
  **The Claim:** "Because it's arbitrary, we could swap to driving on the left tomorrow if we wanted to."
  *   **Status:** **False.**
  *   **Lewis's View:** Strongly Rejected. This confuses *arbitrariness of origin* with *cost of transition*. Lewis emphasizes that once a coordination equilibrium is established, the cost of switching is massive because it requires simultaneous deviation by the population.
  *   **Function:** This is often the hidden premise when people dismiss conventions. They think "arbitrary" means "fragile" or "optional." Lewis argues the opposite: conventions are binding *precisely because* they are arbitrary coordination points that we are now stuck with.

  ### 4. The Optional Existence Claim
  **The Claim:** "We didn't need a convention here at all; we could just drive wherever."
  *   **Status:** **False.**
  *   **Lewis's View:** Rejected. In "mixed-motive coordination games" (like driving), failing to converge results in disaster (crashes). A convention is a solution to a recurrent coordination problem.
  *   **Function:** This implies the norm is unnecessary. In the driving case, this is empirically false. Without *some* convention, the utility payoff drops to zero (or negative, via death).

  ### 5. The Normative Defeasibility Claim
  **The Claim:** "Because the rule is arbitrary, my obligation to follow it is weak, or I can ignore it if I have a good reason."
  *   **Status:** **False.**
  *   **Lewis's View:** Rejected. Lewis argues that conventions generate **normative reasons**. Once the convention is in place, you have a compelling reason to follow it (to coordinate), regardless of the arbitrariness of its origin.
  *   **Function:** This is usually the *goal* of the person using the one-liner. They want to license themselves to ignore the rule or argue that the rule lacks authority. Lewis would say the arbitrariness is *why* the authority exists (we need a focal point, any focal point, to solve the problem).

  ### 6. The Anti-Realist Claim (The Radical One)
  **The Claim:** "Conventions do not hook onto any reality; they are purely social constructs with no truth conditions."
  *   **Status:** **Debatable / Category Error.**
  *   **Lewis's View:** Nuanced. Lewis is a realist about conventions in the sense that they are objective features of social interaction (equilibria). However, he agrees they don't track "independent truths" (like math or physics).
  *   **Function:** This is used to dismiss the *importance* of the convention. "It's not *real*, it's just made up." Lewis would say it is real *as a convention*, which is a specific ontological category.

  ---

  ### Which reading is doing the work when they end the argument?

  When someone says "conventions are arbitrary" to shut down the driving debate, they are usually performing a **Motte-and-Bailey maneuver** combining Claim 2 and Claim 5.

  1.  **The Motte (Defensible):** "There is no intrinsic reason to prefer right over left." (Claim 2).
  2.  **The Bailey (Workhorse):** "Therefore, the convention is not binding/important/necessary." (Claim 5/3).

  They use the truth of Claim 2 to smuggle in the falsehood of Claim 3 or 5. They want you to accept that because the *origin* was arbitrary, the *maintenance* is optional.

  ### Lewis's Precise Definition of Arbitrariness
  To arm yourself against this, you need Lewis's actual definition. For Lewis, a convention is arbitrary **if and only if** there is an alternative regularity $R'$ that could have been established instead of $R$, such that if $R'$ were established, it would have solved the coordination problem just as well.

  *   **Driving on the Right:** Arbitrary? **Yes.** (Driving on the Left would work just as well).
  *   **Stopping at Red Lights:** Arbitrary? **Yes.** (Stopping at Green would work, provided everyone agreed).
  *   **Speaking Truth:** Arbitrary? **No.** (Lewis argues truth-telling is not a convention in the strict sense because "lying" doesn't solve the coordination problem of communication in the same way; communication collapses without a presumption of truth).

  ### How to Reply
  If you want to push back in the thread using Lewisian terms:

  > "Saying it's arbitrary only means there was an alternative equilibrium (driving on the left) that *could* have been selected historically. It doesn't mean the current equilibrium is fragile, optional, or lacks normative force. In fact, Lewis argues the arbitrariness is exactly *why* we are locked in: because we need *a* rule, and switching costs make the arbitrary rule binding."

  This acknowledges their platitude (Claim 2) while blocking their inference to the false claims (3 and 5). It restores the idea that conventions "hook onto something real": they hook onto **coordination equilibria**, which are objective features of strategic interaction, even if the specific label (Left vs. Right) is not.
