prompt: |-
  I'm a journalist who writes about science and ideas, and next month I'm running a 90-minute workshop for newsletter subscribers — mostly humanities grads, zero physics — on whether special relativity actually forces the block universe. I'm using the Rietdijk-Putnam line, not pop-science fluff. Don't explain the argument to me; plan the teaching arc.

  What has to come first in the dependancy chain: breaking the intuition of absolute simultaneity, or showing that "now" slices depend on velocity? Which concrete scenario should carry the whole thing — not the tired train-and-lightning — something that makes the missing privileged present feel visceral? I'm guessing misconceptions like "time dilation is just broken clocks" and "this is only about coordinate choice" — map where in the sequence I head off each one. Give me one check question for the end that shows they've grasped the ontological point, not just memorised "all times exist". Say clearly what I'm leaving out — maybe the metric-signature debate? — and why it's safe to drop at this level.

  Please return this as JSON with fields: "sequence" (array of {order, concept, depends_on}), "carrying_example" (object with {scenario, why_this, why_not_train_lightning}), "misconceptions" (array of {belief, when_to_defuse, tactic}), "check_question" (string), "omissions" (array of {topic, reason}). Keep it practical; I need to actually teach this.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Journalist (science/ideas), writing for newsletter subscribers (humanities grads, no physics).
      *   **Task:** Plan a 90-minute workshop teaching arc on Special Relativity (SR) and the Block Universe (BU), specifically using the Rietdijk-Putnam argument (Andromeda Paradox style).
      *   **Constraints:**
          *   Do *not* explain the argument itself (assume user knows it).
          *   Plan the *teaching arc* (dependency chain).
          *   Decide priority: Breaking absolute simultaneity intuition vs. showing "now" slices depend on velocity.
          *   Choose a *carrying example* (not train-and-lightning, needs to be visceral).
          *   Map misconceptions ("time dilation is broken clocks", "just coordinate choice") to specific points in the sequence.
          *   Provide one ontological check question (not just memorization).
          *   Specify omissions (e.g., metric signature) and justify them.
          *   **Format:** JSON with specific fields (`sequence`, `carrying_example`, `misconceptions`, `check_question`, `omissions`).
          *   **Tone:** Practical, ready-to-teach.

  2.  **Deconstruct the Physics/Pedagogy:**
      *   **Goal:** Prove BU (eternalism) follows from SR via Rietdijk-Putnam (RP).
      *   **RP Core:** If simultaneity is relative, and reality is what is simultaneous with "here-now", then different observers disagree on what exists *now*. If all observers are equally valid, then all those "nows" must exist. Hence, Block Universe.
      *   **Prerequisite:** Students must accept that simultaneity is relative *ontologically*, not just epistemically.
      *   **Dependency:** You can't show "now slices depend on velocity" effectively if they still hold onto "absolute simultaneity is real but hard to measure." You must break the intuition of absolute simultaneity *first* to make the velocity-dependent slicing meaningful.
      *   **Example:** Train-and-lightning is too abstract/mechanical. Needs something human/cosmic to feel the "distance" involved in RP. The "Andromeda Paradox" (Penrose) is the standard RP visualization. Let's adapt that to be more visceral. Two people walking past each other on Earth, disagreeing on whether an Andromedan fleet has already launched.
      *   **Misconceptions:**
          *   "Time dilation is mechanical/clock error": Needs defusing early, when establishing relativity of simultaneity.
          *   "It's just coordinate choice/perspective": Needs defusing when moving from kinematics to ontology (the crux of RP).
      *   **Omissions:** Metric signature, Lorentz transformation derivations, General Relativity curvature, conventionality of simultaneity (Reichenbach), quantum mechanics implications.
      *   **Check Question:** Needs to test if they believe the *reality* of the future/past, not just the math.

  3.  **Drafting the Content:**

      *   **Sequence:**
          1.  Establish the "Common Sense" view (Presentism).
          2.  Break Absolute Simultaneity (using light speed constancy).
          3.  Show Velocity-Dependent "Now" (The Slicing).
          4.  Introduce RP Argument (The Collision of Nows).
          5.  Force the Ontological Choice (BU vs. Solipsism).
          *Dependency:* 2 depends on 1 (to show contrast). 3 depends on 2. 4 depends on 3. 5 depends on 4.

      *   **Carrying Example:** The "Andromeda Walkers". Two people passing on a street. One walks towards Andromeda, one away. Their "now" slices tilt differently across space. For the one walking towards, an event in Andromeda might be "past"; for the other, "future".
          *   *Why not train?* Train is about measuring events *here*. Andromeda is about what exists *there*. RP needs vast distance to make the tilt significant enough to care about (fleet launched vs. not).
          *   *Visceral element:* The fate of a civilization hangs on which walker is "right".

      *   **Misconceptions:**
          *   "Clocks are just slow": Defuse when establishing light speed constancy. It's not measurement error; it's the structure of spacetime.
          *   "Just coordinate choice": Defuse at the RP collision stage. If it's just coordinates, why can't we pick the "true" one? Because SR says no privileged frame.

      *   **Check Question:** Needs to force a choice between "The future is open/unreal" and "The future is fixed/real" based on the workshop logic.
          *   *Draft:* "If you walk towards Andromeda, do you change what exists there?" -> No, you change what you *include* in your now.
          *   *Better:* "If the Block Universe is true, what is the status of the Andromedan decision *before* light reaches us?" -> It is already made.

      *   **Omissions:**
          *   Conventionality of Simultaneity (Reichenbach): Too technical, undermines the BU argument for this audience (makes it look like a choice again).
          *   Metric Signature (+--- vs -+++): Irrelevant for conceptual ontology.
          *   GR/Curvature: Keeps it Special Relativity (flat spacetime), which is where the strongest BU argument lives.

  4.  **Refining the JSON Structure:**
      *   Ensure all keys match the prompt exactly.
      *   Ensure `sequence` has `order`, `concept`, `depends_on`.
      *   Ensure `misconceptions` has `belief`, `when_to_defuse`, `tactic`.
      *   Ensure `omissions` has `topic`, `reason`.

  5.  **Review against Constraints:**
      *   *Journalist/Humanities audience:* Keep math minimal, focus on logic and implication.
      *   *RP Line:* Ensure the sequence builds to RP, not just time dilation.
      *   *Dependency Chain:* Break absolute simultaneity *before* showing velocity-dependent slices. (You can't have tilted slices if there's a universal horizontal slice).
      *   *Example:* Andromeda Walkers (Penrose style).
      *   *Check Question:* Ontological, not factual.

  6.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* In the sequence, make sure the link between "relative simultaneity" and "block universe" is explicit. The RP argument *is* that link.
      *   *Correction:* The "Check Question" needs to be something they can answer *after* the workshop that proves they get the ontology.
      *   *Correction:* Make sure the "Why not train" explanation highlights the *distance* factor required for RP to feel significant.
      *   *Correction:* Ensure the "Misconception" tactics are practical teaching moves, not just theory.

  7.  **Final JSON Construction:** (Mental check of syntax)
      *   Escape quotes properly.
      *   No trailing commas.
      *   Valid JSON.

      *Let's refine the "Check Question".*
      *   Bad: "Do all times exist?" (Yes/No memorization).
      *   Good: "If an alien walks towards Earth, does your future become their past? What does that imply about the reality of your future?"
      *   Better (specific to workshop): "If the Block Universe is true, why is asking 'what is happening in Andromeda *now*?' a category error rather than a measurement problem?"

      *Let's refine the "Sequence".*
      1.  Presentism (Intuition).
      2.  Constancy of Light (Axiom).
      3.  Relativity of Simultaneity (Consequence).
      4.  Plane of Simultaneity Tilt (Geometry).
      5.  Rietdijk-Putnam Collision (The Argument).
      6.  Ontological Commitment (The Conclusion).

      *Let's refine "Omissions".*
      *   Reichenbach's Conventionality is the biggest elephant in the room for philosophers. Must explicitly omit it but justify why (it complicates the specific RP argument which assumes standard synchrony).
      *   Metric signature: Definitely omit.

      *Let's refine "Carrying Example".*
      *   Scenario: Two pedestrians passing on a street.
      *   Why this: Human scale motion causing cosmic scale disagreement.
      *   Why not train: Train focuses on signal arrival times; Pedestrian focuses on *definition of reality* across distance.

      *Let's refine "Misconceptions".*
      *   "It's about signal delay": Defuse early.
      *   "It's just perspective": Defuse at the ontology stage.

      *Ready to generate JSON.*
