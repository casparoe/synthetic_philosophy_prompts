  7.  **Final Polish:** Ensure the distinction between *empirical uncertainty* (do they feel pain?) and *moral uncertainty* (does feeling pain matter?) is acknowledged, as both feed into $p$. Ensure the "fanaticism" objection is addressed via the variance point.

      *(Self-Correction on "Median-World Budgeting"):* I should be careful not to dismiss it entirely. It's a form of risk-aversion. But I must label it as such, not as a way to fix "expected value errors".

