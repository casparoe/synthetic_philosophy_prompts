answer: |-
  1. **Order:** You are right: rescaling must land **before** the formula. If you write $W = \sum a_i u_i$ first, students reify $u_i$ as fixed cardinal magnitudes. They will treat $a_i$ as independent moral weights. Instead, demonstrate the affine freedom of $u_i$ first. Show that changing $u_i$'s units *forces* a compensating change in $a_i$ to preserve social ranking. Then derive the formula as the unique mathematical solution to this constraint. Swapping them makes $a_i$ look like ethical inputs rather than representation artifacts.

  2. **Example:** Keep currency, but fix the framing. Call it **"Accounting Conversion,"** not "Exchange Rates." Explicitly state: "There is no market. No trading occurs. These are rates a central accountant uses to sum ledgers measured in different currencies." This preserves the vividness of units (cents vs. dollars) without implying market measurability or that $a_i$ are discovered prices. They are chosen conversion factors.

  3. **Objections & Timing:**
     *   **"IC in $u_i$":** Defuse **before** the formula. Emphasize vNM utilities are ordinal over lotteries, containing zero interpersonal content individually.
     *   **"Proved Utilitarianism" & "Weights are work":** Defuse **immediately after** the formula. The theorem is a representation result; the ethics lives in the choice of $a_i$ and the Pareto premise.
     *   **Negative Weights:** **Do not footnote.** Pareto Indifference alone permits negative weights (sacrificing one for others); Strong Pareto ensures non-negative. Given your room's split on utilitarianism, this 5-minute distinction is essential to address the "vile" crowd. It shows the math allows "vile" outcomes unless you strengthen the premise.
     *   **Ex Ante vs. Ex Post:** Place **after** the ethics discussion. It attacks the Pareto premise, not the aggregation logic. Show a case where everyone prefers the lottery ex ante, but the loser suffers catastrophically ex post.

  4. **Closing Question:** "If I redefine Alice's utility scale from dollars to cents (multiplying $u_A$ by 100), what must happen to her weight $a_A$ to keep the social ranking unchanged, and does this change the moral outcome?" (Answer: $a_A$ divides by 100; outcome unchanged.) This separates those who see the representation from those who see a moral formula.

  5. **Exclusions:** Cut the impartial observer/veil of ignorance. It conflates the aggregation theorem (math) with the justification of weights (ethics). It bloates the session and confuses the representation result. Stick to the aggregation logic.

  **Technical Note:** You recalled correctly. Pareto Indifference allows negative weights. You need Strong Pareto to guarantee non-negativity. Include this when discussing weights; it is crucial for the ethical debate.
