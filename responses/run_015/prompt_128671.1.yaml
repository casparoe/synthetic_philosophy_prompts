prompt: |-
  I've got a 75-minute seminar with second-years next week on Harsanyi's aggregation theorem, and I want a plan, not an explanation — I know the result, I just don't know how to get it into their heads.

  Where they are: they did vNM expected utility three weeks ago and can tell you that a utility function is fixed only up to positive affine transformations (sevaral can even say what that means), they've read nothing on social choice, and the room is split between people who arrive thinking utilitarianism is obviously right and people who think it's obviously vile — both of whom will pounce on anything that looks like a proof of utilitarianism.

  Rough statement I'd put on the board: give each person i a vNM utility function u_i over lotteries; suppose society's ranking of lotteries also satisfies the EU axioms; suppose Pareto indifference, i.e. if every individual is indifferent between two lotteries then society is indifferent too. Then there are constants a_i, not all zero, such that society ranks lotteries by the expected value of W = sum of a_i u_i.

  What I want from you: (1) the order the pieces have to go in, and what breaks if I swap any two. I have a feeling the rescaling point — each u_i is fixed only up to affine transformation, so the a_i soak up the units, and "changing the weights" can be the very same social ordering written in different units — has to land before the weighted-sum formula rather than after, but I can't say why, so tell me whether I'm right and what it depends on. (2) A carrying example. I've been toying with a currency-exchange frame: read a_i as the exchange rate at which person i's utility converts into the social currency, so rescaling someone's u_i is just redenominating (dollars into cents) and changes nothing, while changing the rate changes their social weight. I like that it makes the units point vivid. I worry that exchange rates are prices you read off a market and there is no market here, so they'll walk out thinking the a_i are measurable magnitudes rather than a free parameter of the representation. Run with it, fix it, or bin it — and if fix, tell me exactly what to bolt on. (3) Where in the sequence to defuse each of these: "so Harsanyi proved utilitarianism"; "so all the real moral work is in the weights"; "the u_i already carry interpersonal comparisons"; and the one I always get — we're applying Pareto to expected utilities, i.e. ex ante, so what if the coin lands badly and after the lottery everyone is worse off. I want that last one placed on purpose rather than fielded when it erupts: before or after the formula, and why? Plus anything else this particular audience will generate that I haven't listed. (4) One closing question that separates someone who has the representation from someone who can recite W = sum of a_i u_i. (5) What I should openly refuse to cover — I'm inclined to sacrifice his impartial-observer, veil-of-ignorance version of the argument, but tell me if that's the wrong cut.

  One small thing I'm unsure of: I half-remember that Pareto indifference alone doesn't rule out negative weights, and that you need a stronger Pareto condition to get them non-negative. If that's right, does it earn a slot in the 75 minutes or is it a footnote?

  Commit to things, please: one ordering, one verdict on the exchange-rate frame, and tell me plainly where I'm wrong. Don't hand me three options and leave me to pick. Under 700 words — I'll be reading this on my phone between classses.
