          *   Core concept: *Wuhua* (transformation of things).
          *   Zhuangzi's Dream: It's not about "Was I a butterfly or a man?" (epistemic verification). It's about "What is the fixed self that claims to be either?" (ontological fluidity).
          *   Critique of Lin: PP assumes a bounded organism minimizing surprise against an environment. Zhuangzi questions the boundary itself. Reducing *wuhua* to precision weighting misses the ethical/existential release from fixed identity.
