          *   Zhuangzi's Dream: The feeling of "realness" in the dream is due to the brain treating internal predictions as high-precision evidence.
          *   Skepticism: We can't tell dream from waking because the underlying mechanism (generative modeling) is the same, just weighted differently. This validates Zhuangzi's uncertainty as an empirical fact of cognitive architecture.
