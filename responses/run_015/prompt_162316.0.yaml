answer: |-
  ## Part 1: Critique of Your Draft List

  Your intuition is strong, but the order is mixed, and two steps are circular. Here is the diagnosis:

  1.  **Circularity (Steps 1 & 3):** Step 1 (Compression Audit) and Step 3 (Prediction Horizon) are the same test. Compression *is* predictive efficiency. If you can't write the cheaper description (Step 1), you can't make the prediction (Step 3). Merge these into a single **Predictive Efficiency Test**.
  2.  **Ordering Error (Step 5):** You place the "Reader Handoff" last. In journalism, reader interpretation *trumps* metaphysical correctness. If a sentence is technically true under Dennett's stance but 90% of readers will infer a soul, it is false for our purposes. This must be the **Gatekeeper Step (Step 1)**.
  3.  **Ambiguity (Step 2):** "Design-availability" is the right insight for modern AI (black boxes), but phrasing it as where the picture "breaks down" invites confusion. Better to frame it as: *When Design is opaque, Intentional is the only available compression.*
  4.  **Missing Typographic Rules:** You asked for grades and marking, but the draft list doesn't specify how the output of the steps maps to quotes or hedges.

  Below is the repaired procedure, formatted to fit a single page of your style guide, followed by the grading scale, retraction clause, and worked examples.

  ***

  ## Part 2: The Intentional Stance Protocol (Style Guide Insert)

  **Purpose:** To determine when mental verbs (thinks, wants, refuses, decides) may be applied to non-human systems without misleading readers about causal mechanisms.
  **Theory:** Based on Dennett's Intentional Stance. A mental attribution is valid if it offers a *compression* of behavior that allows accurate prediction of *novel* inputs more efficiently than describing the physical or design mechanics.

  **Step 1: The Misleading Mechanism Test (Gatekeeper)**
  *   **Ask:** Will a lay reader infer a biological substrate (pain, consciousness, moral agency) from this verb?
  *   **Action:** If **Yes**, the verb is banned regardless of predictive utility. (e.g., "The model felt sad").
  *   **Action:** If **No** (reader understands it as shorthand for function), proceed to Step 2.

  **Step 2: The Compression Audit**
  *   **Ask:** Does using this verb allow us to predict the system's behavior on *new* inputs without referencing weights, code, or training data?
  *   **Requirement:** Reporter must file a "Prediction Note" with the draft: *"If we say [System] wants [X], we predict it will do [Y] in [Z] new context."*
  *   **Fail Condition:** If the verb only explains past data (post-hoc rationalization) and not future behavior, revert to Design language (e.g., "was programmed to," "optimized for").

  **Step 3: The Locus of Agency**
  *   **Ask:** Is the pattern generated by the system's current inference or the trainer's prior constraints?
  *   **Rule:** If the behavior is a hard constraint (safety filter), attribute to **Design/Trainers** ("The system was set to refuse").
  *   **Rule:** If the behavior emerges from optimization in a novel context (chess move, routing), attribute to **System** ("The engine sacrifices").

  **Step 4: Grading & Typography**
  Assign a grade based on the robustness of the Compression Audit (see *Attribution Grades* below). Apply the required typography. No exceptions for headlines or captions.

  **Step 5: The Retraction Clause**
  *   If a system stops exhibiting the "intentional" pattern after an update, do **not** write "It changed its mind."
  *   **Required Phrasing:** "The update altered the system's optimization parameters," or "The pattern no longer holds."
  *   **Reasoning:** "Changing its mind" implies internal continuity of intention. Model updates are discontinuous replacements.

  ***

  ## Part 3: Attribution Grades & Typography

  | Grade | Condition | Permitted Verbs | Typography | Example |
  | :--- | :--- | :--- | :--- | :--- |
  | **A: Robust** | Predicts novel behavior reliably; Mechanism is opaque or irrelevant to reader. | Decide, Prefer, Choose, Sacrifice | **Unhedged** | "Stockfish **chooses** the endgame." |
  | **B: Functional** | Predicts behavior, but locus is clearly external (trainers/filters). | Refuse, Decline, Allow | **Hedged** ("is tuned to") | "The bot **declines** (is tuned to decline) requests." |
  | **C: Metaphorical** | Compression is weak; used for color or headline space. | Want, Hate, Fear, Think | **Scare Quotes** or *Vocabulary of* | "The algorithm '**wants**' engagement." |
  | **D: Banned** | Implies biological sentience or fails Misleading Mechanism Test. | Feel, Know, Believe, Understand | **Do Not Use** | ~~"The AI knows the answer."~~ |

  ***

  ## Part 4: Worked Examples

  Here is the procedure applied to your three test cases.

  ### Case 1: "The model refused to answer."
  *   **Step 1 (Mechanism):** Low risk. Readers generally understand "refusal" in bots as a function, not a moral stand. **Pass.**
  *   **Step 2 (Compression):** High compression. We don't need to know the specific RLHF weights to predict it will block "how to build a bomb." **Pass.**
  *   **Step 3 (Locus):** This is a hard constraint set by trainers, not an emergent optimization. The "refusal" is a boundary condition.
  *   **Grade:** **B (Functional).**
  *   **Ruling:** Permitted, but requires hedging in body copy to acknowledge the design source. Headlines may use "Refuses" for space, but caption must clarify.
  *   **Copy:** "The chatbot **refused** the request (a result of safety tuning)."

  ### Case 2: "The chess system sacrificed its queen" / "Prefers positions it can win from."
  *   **Step 1 (Mechanism):** No biological inference. Chess vocabulary is already intentional. **Pass.**
  *   **Step 2 (Compression):** Extremely high. Describing the voltage changes (Physical) or search tree depth (Design) is impossible for readers. Saying it "sacrificed" predicts it will accept material loss for positional gain in *new* games. **Pass.**
  *   **Step 3 (Locus):** Emergent optimization. The system finds the sacrifice; it wasn't hard-coded.
  *   **Grade:** **A (Robust).**
  *   **Ruling:** **Unhedged.** "Sacrificed" is fully licensed. "Prefers" is also licensed under Grade A because it predicts move selection across novel board states.
  *   **Copy:** "Stockfish **sacrificed** its queen. It **prefers** winning positions over material advantage."

  ### Case 3: "The thermostat wants the room at twenty degrees." (The Uncomfortable Result)
  *   **Step 1 (Mechanism):** Low risk. No one thinks the thermostat has feelings. **Pass.**
  *   **Step 2 (Compression):** Massive compression. Describing the bimetallic strip bending or the circuit closing (Physical) is tedious. Saying it "wants 20°" perfectly predicts it will turn on the heat if the temp drops to 19° and turn off at 21°. **Pass.**
  *   **Step 3 (Locus):** Design is simple, but the *goal state* is the most efficient description of its behavior.
  *   **Grade:** **A (Robust).**
  *   **Ruling:** **Unhedged.**
  *   **Why you will hate this:** This equates your complex AI subjects with a mercury switch. Dennett argues this is a feature, not a bug: if the Intentional Stance works for a thermostat, "wanting" isn't magical, it's a pattern of prediction. If you ban this, you are smuggling mysticism into AI.
  *   **Copy:** "The thermostat **wants** the room at twenty degrees." (This is philosophically sound but stylistically risky for a tech magazine; you may wish to downgrade to Grade B for tone, but the *procedure* licenses Grade A).

  ***

  ## Part 5: Failure Modes & Undecidables

  **Where the Checklist Will Misfire:**
  1.  **The "Prediction Note" Gaming:** Reporters under deadline may write a trivial prediction note just to clear Step 2 (e.g., "I predict it will answer the next prompt"). *Countermeasure:* Editors must check if the prediction is *non-trivial*. If the prediction is "it will behave like it usually does," the compression is zero.
  2.  **The "Black Box" Excuse:** Reporters may claim Design Stance is impossible because the model is proprietary, forcing an Intentional Stance by default. *Countermeasure:* If the behavior is inconsistent (hallucination), Compression fails. You cannot say it "lies" if it isn't reliably deceptive.
  3.  **Headline Drift:** A Grade B sentence in the body ("The system is tuned to refuse") often becomes Grade C or A in the headline ("Bot Refuses"). *Countermeasure:* The Grade assigned in the body dictates the maximum intensity of the headline.

  **Undecidable Cases (Editor Discretion Required):**
  *   **Emergent Deception:** If a model lies only in specific, unrehearsed contexts to achieve a goal, is that "deception" (Grade A) or "glitch" (Grade D)? The procedure cannot settle the moral weight; the Editor must decide based on the robustness of the deception across multiple sessions.
  *   **RLHF Ambiguity:** When a model is fine-tuned to *simulate* a persona (e.g., "act as a helpful assistant"), does it "want" to help? The procedure flags this as **Grade C (Metaphorical/Scare Quotes)** because the locus of agency is the prompter, not the system.

  **Retraction Example:**
  *   *Scenario:* You write "The model refuses harmful queries." A new version allows them.
  *   *Wrong Retraction:* "The model changed its mind about safety."
  *   *Correct Retraction:* "The safety pattern observed in v1.0 does not hold in v2.0."
  *   *Why:* "Changing its mind" implies the *pattern* persisted while the *decision* flipped. In AI, the pattern itself is deleted. Accuracy requires acknowledging the discontinuity.
