answer: |-
  Here is a lesson plan designed to dismantle the Cartesian hierarchy without triggering the standard dualist defenses.

  ### 1. The Dependency Order (The "Stack")
  Do not start with biology or computers. Start with the students' current intuition. If you start with ants or algorithms, they will compartmentalize them as "non-human" and preserve Reasoning for humans.

  1.  **The Cartesian Intuition:** Briefly restate their current view. Reasoning is the *source* of competence. We solve problems *because* we understand them. (5 mins)
  2.  **The Carrying Example:** Introduce the **Blind Maze Solver**. (15 mins)
  3.  **The Darwinian Move:** Show how Nature solves mazes without a mind. (10 mins)
  4.  **The Turing Move:** Show how Machines solve mazes without understanding. (10 mins)
  5.  **The Synthesis (The Inversion):** Competence is the substrate; Reasoning is a specialized tool that evolves *within* competent systems. (10 mins)
  6.  **Misconception Defense:** Pre-emptive strikes on Searle, Behaviorism, and "Dumb Animals." (10 mins)

  ---

  ### 2. The Carrying Example: The "Blind Maze Solver"
  You need one example that functions identically in biology and computation to show the structural identity of the inversion.

  **The Setup:**
  Describe a system that must find the exit of a complex maze to survive/function.
  *   **Darwinian Version:** A colony of ants (or a lineage of bacteria) exploring a nutrient landscape.
  *   **Turing Version:** A "random walk" algorithm or a packet-switching protocol routing data through a network.

  **What the Example Must Include:**
  *   **Error Correction:** The solver must hit dead ends and retreat. This proves it is *solving a problem*, not just following a fixed track.
  *   **Local Information:** The solver only knows what is immediately in front of it (pheromones or node status). It does not have a "God's eye view" of the maze.
  *   **Success Condition:** It reliably finds the exit (Competence).

  **What the Example Must Avoid:**
  *   **Avoid "Instinct":** Do not call the ant's behavior instinct. "Instinct" implies a pre-loaded script. Call it **Competence**. The ant is *figuring it out* in real-time, just using different hardware.
  *   **Avoid "Hardware" Reductionism:** Do not say "The brain is just meat." Say "The process is just feedback." If you focus on the substrate (meat vs. silicon), they will retreat to "But meat feels." Focus on the *logic of the process*.
  *   **Avoid Language:** Do not use examples involving translation or conversation (like the Chinese Room). That invites semantic debates. Stick to *navigation* and *selection*.

  **How to Pitch It:**
  > "Imagine a system that gets from Point A to Point B 99% of the time. It avoids traps. It finds shortcuts. But if you ask the system, 'Where is the exit?', it cannot tell you. It has no map. It has no concept of 'exit.' It only has a rule: 'If path blocked, turn.' Descartes says this isn't problem-solving. Darwin and Turing say this is the *only* kind of problem-solving there is. Understanding is just what it feels like when the system gets complex enough to model its own map."

  ---

  ### 3. Mapping the Misconceptions (and When to Defuse Them)

  **Misconception 1: "Darwin is just about dumb animals."**
  *   **The Risk:** They think evolution explains ants, but humans are special.
  *   **Where to Defuse:** **Immediately after the Darwinian Move.**
  *   **The Line:** "This isn't about animals being 'dumb.' This is about *Design without a Designer*. The competence exists in the *process* of selection, not in the head of the selector. If nature can design an eye without understanding optics, competence does not require comprehension."

  **Misconception 2: "Turing proves machines think."**
  *   **The Risk:** They swing to the opposite extreme and attribute magic to computers.
  *   **Where to Defuse:** **During the Turing Move.**
  *   **The Line:** "Turing didn't show machines have minds. He showed 'thinking' (calculation/logic) can be done by mindless steps. The inversion isn't that machines are human; it's that humans are machines—competent assemblies of uncomprehending parts."

  **Misconception 3: "This is just Behaviorism."**
  *   **The Risk:** They think you're denying internal states.
  *   **Where to Defuse:** **During the Synthesis.**
  *   **The Line:** "Behaviorism says internal states don't matter. The Inversion says internal states *are* competence structures. We aren't ignoring the inside; we're saying the inside is built out of the same blind feedback loops as the outside. You don't need a 'ghost' to explain the machine."

  **Misconception 4: "It's just Searle Backwards." (The Roommate Objection)**
  *   **The Risk:** They think you're just flipping the Chinese Room (Syntax $\neq$ Semantics) to say (Syntax $=$ Semantics).
  *   **Where to Defuse:** **In the Q&A / Misconception Block.**
  *   **The Line:** "Searle assumes Understanding is a *spark*—either you have the magic semantics or you don't. He draws a hard line. The Inversion says Understanding is a *gradient*. It's competence piled on competence. Searle asks, 'Where does the meaning appear?' The Inversion answers, 'It never appears all at once; it accumulates.' Your roommate thinks meaning is an ingredient; we are arguing it is a *relationship*."

  ---

  ### 4. The End-Check
  Do not ask them to define the inversion. Ask them to apply it to the thing they care about most: **Themselves.**

  **The Prompt:**
  > "Descartes says *'I think, therefore I am.'* He treats Thinking as the foundation. If the Strange Inversion is true, rewrite that slogan to reflect that Reasoning is a late-stage tool, not the foundation. What is the *actual* foundation?"

  **The Target Answer:**
  They should arrive at something like: *"I compete (or survive/function), therefore I think."* or *"I am a competent system that eventually evolved the tool of thinking."*
  If they say "I am a machine," they missed the point (that's reductionism). If they say "Thinking is an illusion," they missed the point (that's eliminativism). You want them to say **"Thinking is a specialized subsystem of competence."**

  ---

  ### 5. What to Openly Leave Out
  To keep this manageable for a Tuesday section, explicitly tell them you are bracketing the following. This prevents them from going down rabbit holes that derail the core philosophical inversion.

  1.  **Implementation Details of Universal Computation:** Do not discuss Turing Machines, tape, or state tables. Treat "Computation" as "Mindless Step-by-Step Processing."
  2.  **Evolutionary Game Theory:** Do not bring in payoff matrices or Nash equilibria. Keep evolution at the level of "Variation and Selection."
  3.  **Neurophysiology:** Do not discuss neurons, synapses, or qualia. Keep it at the level of "Control Systems."
  4.  **The Hard Problem of Consciousness:** Explicitly state: "We are not solving why it *feels like* something to be a maze solver today. We are solving where the *ability to solve* comes from."

  ### 6. Instructor's Cheat Sheet: The "Searle Backwards" Defense
  If a student presses the roommate's argument ("Searle says syntax isn't enough, you're saying it is"), use this distinction:

  *   **Searle:** Syntax is static. Semantics is external (in the head of the observer).
  *   **Inversion:** Syntax is dynamic (it *does* something in the world). Semantics is the *history of success* of that syntax.
  *   **Key Phrase:** "Searle looks at a symbol and asks 'Does this mean anything?' The Inversion looks at a process and asks 'Does this work?' Meaning is just the long-term shadow of Working."
