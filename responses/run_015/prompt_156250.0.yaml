prompt: |-
  I'm running a tuesday section for second-year philosphy undergrads who've just finished Descartes and are pretty convinced that reasoning is the foundation everything else sits on. I want to teach them Darwin's and Turing's strange inversion — not just "evolution is blind" or "computers calculate," but the deeper thing where genuine problem-solving competence comes first and reasoning is kind of a late, specialized spin-off that doesn't actually understand anything. Don't explain the idea to me; plan how I should explain it. What's the dependency order so they don't just map this onto "instinct vs. thought"? I need one carrying example that works for both Darwin and Turing together — something that shows competence solving a problem the solver can't comprehend — and I need to know what that example must include and what it should avoid so they don't confuse it with the Chinese Room or with "the brain is just hardware." Then map the misconceptions: I expect they'll say Darwin is just talking about animals being dumb, that Turing proves machines think, and maybe that I'm sneaking in behaviorism. Where exactly in the sequence do I head each one off? Give me one end-check that shows they've gotten the inversion — that reasoning might be the exception, not the rule — and tell me what to openly leave out at this level (maybe the implementation details of universal computation, or evolutionary game theory?). I was arguing about this with my roommate and they kept saying it's just Searle backwards, so if that's a predictable misread I want to know where to defuse it.
