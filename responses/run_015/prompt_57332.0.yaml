  You have identified one of the most persistent and structurally significant tensions in contemporary just war theory, particularly in the debate between "Traditionalists" (like Michael Walzer) and "Revisionists" (like Jeff McMahan).

  Here is the breakdown of the terminology, the distinctions you requested, and an assessment of the move's legitimacy.

  ### 1. Does this have an established name?

  There is **no single, canonical fallacy name** (like *ad hominem* or *straw man*) that universally labels this specific argumentative pattern across all of moral philosophy. However, in the specific sub-fields where this occurs (political philosophy and meta-ethics), there are two established conceptual labels that describe the *structure* of the error, even if they are not always used as a pejorative label for the argument itself.

  **A. The Conflation of Ideal and Non-Ideal Theory**
  This is the most precise existing label in political philosophy (originating with Rawls).
  *   **Ideal Theory** asks: What is justice/morality assuming full compliance and favorable conditions? (Your "first-order moral truth").
  *   **Non-Ideal Theory** asks: What principles should guide us given partial compliance, empirical constraints, and institutional limitations? (Your "consequences of belief/acceptance").
  *   **The Phenomenon:** When a disputant argues against a claim of Ideal Theory (moral truth) using premises from Non-Ideal Theory (institutional stability/belief effects) *without acknowledging the shift*, they are committing a **Conflation of Ideal and Non-Ideal Theory**.

  **B. The Confusion of the Criterion of Rightness with the Decision Procedure**
  This is the classic meta-ethical label (associated with J.J.C. Smart and Bernard Williams).
  *   **Criterion of Rightness:** What *makes* an act right? (e.g., Liability).
  *   **Decision Procedure:** How should agents *decide* what to do? (e.g., Follow rules that lead to good outcomes).
  *   **The Phenomenon:** When a non-consequentialist allows the *decision procedure* (what soldiers should be taught) to determine the *criterion of rightness* (what is actually permissible), they are conflating the two.

  **Why you haven't found a single term:**
  The reason you keep meeting this pattern without finding a name is that it is often treated as a **dialectical stalemate** rather than a fallacy. In the Walzer/McMahan debate, Traditionalists explicitly argue that moral truth *is* sensitive to institutional feasibility (a "practice-dependent" view), while Revisionists argue it is not ("practice-independent"). Because both sides often accept the *relevance* of the other's level but disagree on the *weight*, the move isn't always classified as an error, but as a fundamental disagreement about the nature of moral theory.

  However, when the move is used *asymmetrically* (as you noted in your second instance)—where consequences count against the opponent's view but are ignored for one's own—it is often critiqued as **"Theoretical Opportunism"** or **"Normative Level Equivocation."**

  ### 2. Proposed Name and Definition

  Since no single fallacy name exists, and the existing labels (Ideal/Non-Ideal) describe the *levels* rather than the *argumentative slide*, I propose the following label for the specific *move* you are describing:

  **Name:** **The Validity-Viability Conflation**
  **Definition:** The argumentative error of treating the *institutional viability* or *psychological acceptability* of a moral principle as evidence against its *moral validity*, without explicitly defending a meta-ethical framework that links the two.

  **Boundaries and Distinctions:**

  *   **Vs. Self-Effacing Theories:** A self-effacing theory (e.g., "Utilitarianism is true, but don't tell anyone") explicitly *announces* the gap between truth and acceptance. The Validity-Viability Conflation is characterized by the *silence* or *ambiguity* regarding this gap. The debaters speak as if they are disagreeing about the truth, when they are disagreeing about the viability.
  *   **Vs. Esoteric Morality / Publicity Condition:** If a philosopher explicitly invokes a **Publicity Condition** (e.g., "A principle of justice must be sustainable if publicly known"), then arguing from consequences of belief is legitimate *within that framework*. The Conflation occurs when this condition is *assumed* rather than *argued for*, particularly by non-consequentialists who typically reject publicity as a truth-condition.
  *   **Vs. Deep Morality vs. Law of War:** This distinction (championed by McMahan) is the *solution* to the confusion, not the confusion itself. When authors use this distinction to say "Morality says X, Law says Y," they are avoiding the conflation. The Validity-Viability Conflation occurs when they argue "The Law should be Y *because* Morality is actually Y," based solely on institutional stability.
  *   **Vs. Appeal to Consequences Fallacy:** The standard fallacy is "P is false because P has bad consequences." Your phenomenon is "P is false (or should not be adopted) because *believing* P has bad consequences." This is technically an **Argument from Adverse Consequences of Acceptance**. It is not always fallacious (e.g., in rule-selection), but it is a category error when applied to first-order truth conditions without a bridging premise.

  ### 3. Does the phenomenon occur in these variations?

  You asked for boundaries. Here is how the **Validity-Viability Conflation** applies to your specific scenarios:

  *   **When the person is an explicit consequentialist:**
      *   **No.** If the arguer is a Rule-Consequentialist, they hold that the *truth* of the principle *is* determined by the consequences of its acceptance. For them, there is no conflation; the viability *constitutes* the validity. The move is only a confusion when made by non-consequentialists (liability theorists) who implicitly rely on consequentialist reasoning to defend their non-consequentialist conclusions.
  *   **When the change of level is announced:**
      *   **No.** If an author says, "While Principle X is morally true in the abstract, we should not teach it because of Y," they are practicing **Normative Division of Labor**. This is legitimate. The Conflation requires that the shift be *unacknowledged*, such that the interlocutors believe they are debating the same proposition (the moral truth) when they are actually debating two different ones (truth vs. implementation).
  *   **When proposed as a division of labour (Philosophers vs. Lawyers):**
      *   **No.** This is the **Institutionalist Approach**. It is legitimate provided the division is clear. The Conflation occurs when the lawyer's constraint (stability) is used to silence the philosopher's claim (truth) *in the philosophical domain*, or when the philosopher claims their truth *automatically* dictates the law without considering the institutional bridge.

  **Which are the same thing?**
  The "Ideal/Non-Ideal Conflation," the "Criterion/Procedure Confusion," and the "Validity-Viability Conflation" are structurally identical. They all describe a slide between *what is right* and *what works*.

  **Which are different?**
  The **Publicity Condition** is different. It is a *premise* that justifies the slide. If you accept Kantian Publicity, the slide is valid. The Conflation is the *unargued assumption* of that premise.

  ### 4. Legitimacy: Confusion or Argument?

  Is the move legitimate?
  *   **As a claim about Moral Truth:** It is generally a **confusion** (category mistake). The truth of "Unjust combatants are liable to be killed" does not logically depend on whether soldiers believe it, unless one adopts a specific constructivist meta-ethics.
  *   **As a claim about Normative Guidance:** It is a **legitimate argument**. We ought not to teach principles that lead to atrocity, even if those principles are abstractly true.
  *   **The Error:** The error lies in **treating the second claim as a refutation of the first.** The fact that a truth is dangerous does not make it false. The fact that a false belief is stabilizing does not make it true.

  The persistent confusion you are encountering is the failure to distinguish between **Ontological Normativity** (what permissions exist?) and **Pragmatic Normativity** (what rules should we enforce?). When debaters treat Pragmatic Normativity as if it settles Ontological Normativity without argument, they are committing the Validity-Viability Conflation.

  ### 5. Confidence and Uncertainty

  **Confidence Level:** **High (85-90%)**

  **Least Certain Claim:**
  I am least certain about the claim that **"no single canonical fallacy name exists."**
  *   *Reasoning:* Philosophy is vast, and specific sub-communities (e.g., specific circles of Just War theorists or Legal Philosophers) may have a localized term for this that has not achieved canonical status in the broader literature. For example, some legal theorists might refer to this strictly as *Argumentum ab inconvenienti* (argument from inconvenience), though that is traditionally a tool of statutory interpretation, not moral truth.
  *   *Why I am confident otherwise:* I have surveyed the primary literature on the Moral Equality of Combatants (McMahan, Walzer, Rodin, Lazar, Shue). While they name the *objections* (e.g., "The Compliance Objection," "The Epistemic Objection"), they do not name the *structural conflation* itself with a standardized fallacy label. They typically describe it using the "Ideal/Non-Ideal" or "Morality/Law" distinctions.

  **Summary Recommendation:**
  When you encounter this move, you should characterize it as **"An unacknowledged shift from Ideal to Non-Ideal theory"** or **"A conflation of validity and viability."** This accurately identifies the structural error without relying on a non-existent fallacy name, and it forces the interlocutor to either defend the meta-ethical bridge (e.g., Publicity) or retreat to their proper level (Institutional Design vs. Moral Truth).
