      *Check:* Did I use bold? No. Headings? No. Bullets? No. Tables? No. Just paragraphs.

      *Refining the "Duty" section:* Make sure to mention that Scheffler is worried about the *conservative* implications of his view (that we might value the future too much at the expense of the present), rather than advocating for a duty to survive forever.

      *Refining the "Why extinction is bad" section:* The newsletter says it strips living persons of meaning. Scheffler agrees this is a harm, but the deeper point is that our current values are *structured* by the assumption of continuity. It's not just a harm added on; it's constitutive of the value.

