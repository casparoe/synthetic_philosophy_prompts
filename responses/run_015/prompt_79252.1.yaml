      *   **Input:** A summary from a newsletter.
      *   **Task:** Evaluate the accuracy of the summary. Separate what a careful reader would accept, what's a subtle distortion, and what's just wrong.
      *   **Specific Questions:** Does the conclusion about a duty to survive follow? Are the infertility case and the thirty-day case interchangeable? What's the better version of "why extinction is bad"? What would a defender push back on?
