  2.  **Deconstruct the Metaphysical Concepts (Brainstorming):**
      *   *Dispositions:* Properties like fragility, solubility, conductivity. Standard analysis: $x$ is disposed to $M$ if stimulated by $S$. (Simple Conditional Analysis: SCA).
      *   *Finks:* Coined by C.B. Martin. A disposition is lost *just before* or *at* the moment the stimulus occurs. Example: The electro-fink (wire is live only when not touched). This breaks the SCA because the conditional "if struck, would break" is false, but the vase *was* fragile (or the wire *was* live) before the strike.
      *   *Masks:* The disposition remains, but something prevents the manifestation. Example: Fragile vase in packing foam. It's still fragile, but if struck, it won't break. This also breaks SCA (conditional is false, disposition is present).
      *   *Antidotes:* Specific to powers/poisons. Something neutralizes the causal power internally/chemically. Often grouped with masks but distinct in mechanism.
