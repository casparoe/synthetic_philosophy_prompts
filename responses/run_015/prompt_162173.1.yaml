      *Refining for Engineer Brain:* Use analogies they get (NULL, unique constraints, query results). But keep the *questions* plain English as requested, save the analogies for the explanation key.
      *Refining Scope:* The negation question needs to clearly split Wide vs Narrow scope intuitions.
