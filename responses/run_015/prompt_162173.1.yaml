      *   Separate Zero/Multi? Yes.
      *   Embedded contexts? Yes.
      *   Scope ambiguity? Yes.
      *   Scoring Key + Taxonomy? Yes.
      *   Flag incoherent/unexplored? Yes.
      *   Flag indistinguishable? Yes.
      *   No bibliography? Yes.

  9.  **Constructing the Output:**
      *   *Intro:* Set the stage (The "SELECT * FROM" of language).
      *   *The Quiz:* 12 Questions, 3 options each (True, False, Broken/Other).
      *   *The Taxonomy (Tree):* Visualizing the splits.
      *   *The Scoring Key:* Mapping answers to positions.
      *   *The "Dead Ends":* Incoherent combos.
      *   *The "Blind Spots":* Indistinguishable leaves.

      *(Self-Correction during drafting Q4)*: Negation is tricky. "The King of France is not bald."
      *   Russell Wide Scope: False (No king).
      *   Russell Narrow Scope: True (It is not the case that there is a bald king).
      *   Strawson: Broken (Presupposition fails).
      *   *Decision:* I need to make sure the options allow for "True" vs "False" vs "Doesn't Apply".
      *   *Refinement:* Let's make the options consistent: [Yes/True], [No/False], [Doesn't Make Sense/Null].

      *(Self-Correction on Donnellan)*: Donnellan is about *speaker intent*. The quiz needs to specify intent. "You point at a guy drinking water and say..." vs "You look at a empty chair and say..."

      *(Self-Correction on Scope)*: This is the SQL `GROUP BY` analogy. `NOT (exists x...)` vs `exists x (NOT...)`. I need a question where this matters practically. "The user who didn't pay is flagged." If no user didn't pay, is the statement true?

      *(Final Polish)*: Ensure the tone is supportive of a non-philosopher presenting to engineers.

  10. **Final Polish of the "Leaves":**
