          *   Specific cases required: No King of France, two dogs, misidentified person (martini/water), belief reports (no CTO), vacant roles, future references.
          *   Required Leaves (Positions): Russell (existence/uniqueness = false if fail), Strawson (presupposition failure = truth-value gap), Donnellan (referential vs. attributive), Presupposition projection (negation/questions), potentially others (incomplete descriptions, pronoun-like).
          *   Structural Requirements: Separate "nothing matches" vs. "more than one matches"; include embedded contexts (negation, belief, conditionals); include a scope ambiguity fork (like SQL grouping); scoring key; taxonomy view; flag unexplored/incoherent combos; flag indistinguishable leaves.
          *   Tone: Practical, engineer-friendly, no bibliography/citations needed for the talk.

  2.  **Deconstruct the Philosophical Landscape (for the Engine):**
      *   *Russell:* "The F is G" means $\exists x (Fx \land \forall y (Fy \rightarrow y=x) \land Gx)$. If no $F$ or multiple $F$, sentence is **False**. Negation: "The F is not G" is ambiguous (wide/narrow scope).
      *   *Strawson:* "The F" presupposes existence and uniqueness. If fail, **No Truth Value** (category mistake/undefined). Negation usually preserves presupposition (presupposition projects).
      *   *Donnellan:*
          *   *Attributive:* "Whoever is the F is G." (Russell-like).
          *   *Referential:* "That guy [who happens to be F] is G." (Success even if description fails, as long as referent is identified).
      *   *Presupposition Projection:* How failures behave under negation, questions, conditionals. (Strawson leans hard here).
      *   *Incomplete Descriptions:* "The table is broken" (when there are many tables). Context restricts domain. (Often treated as pragmatic enrichment of Russell or Strawson).
      *   *Scope Ambiguity:* "The F is not G." Is it $\neg (\text{The F is G})$ or $\text{The F is } (\neg G)$?

  3.  **Drafting the Questions (Iterative Process):**
      *   *Goal:* 10-12 questions.
      *   *Requirement:* Separate "Zero Match" vs. "Multi Match".
