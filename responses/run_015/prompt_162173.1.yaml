  6.  **Developing the Scoring Key:**
      *   Need to map patterns (e.g., A, B, A, C...) to positions.
      *   Need "Signature Tells" (the specific answer that defines the position).
      *   Need "Noise" (answers that don't matter much).

  7.  **Drafting the Content (incorporating "Engineer" tone):**
      *   Use terms like "Return Code," "NULL," "Unique Index," "Query Plan."
      *   Keep the quiz questions clean, but the analysis can use the metaphors.
      *   *Self-Correction:* The prompt says "plain-English scenario... nobody needs to have heard of any of these theories." So the *quiz* must be clean English. The *Key* can use the engineering metaphors to explain.

