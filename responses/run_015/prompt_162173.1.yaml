answer: |-
  Here is a complete brown-bag kit. It is designed to feel like a debugging session, not a lecture. The quiz uses plain English, but the scoring key translates the results into "database semantics" so your team can map it to their mental models immediately.

  # Part 1: The Diagnostic Quiz (12 Questions)

  **Instructions for the Room:**
  Read each scenario aloud. Ask the team to vote on the status of the **bolded sentence**.
  There are only three valid votes:
  1.  **TRUE** (The system returns 1 / Success)
  2.  **FALSE** (The system returns 0 / Failure)
  3.  **NULL** (The query crashes / The question doesn't arise / "N/A")

  ---

  **Q1 (Zero Match - Simple):**
  There is no King of France. Someone says: **"The King of France is bald."**
  *   [ ] True
  *   [ ] False
  *   [ ] Null

  **Q2 (Multi Match - Simple):**
  There are two dogs in the room, both barking. Someone says: **"The dog is barking."**
  *   [ ] True
  *   [ ] False
  *   [ ] Null

  **Q3 (Referential - Misdescription):**
  You are at a party. You point at a man holding a glass of water and say to a friend: **"The man drinking the martini is a spy."** (He is actually drinking water).
  *   [ ] True (You pointed at the right guy)
  *   [ ] False (He isn't drinking a martini)
  *   [ ] Null (Description failed)

  **Q4 (Negation - Zero Match):**
  There is no King of France. Someone says: **"The King of France is not bald."**
  *   [ ] True
  *   [ ] False
  *   [ ] Null

  **Q5 (Belief Report - Zero Match):**
  There is no CTO. Dana says: **"I think the CTO is lying."**
  *   [ ] True (Dana really thinks that)
  *   [ ] False (There is no CTO to lie)
  *   [ ] Null (The belief is malformed)

  **Q6 (Conditional - Future):**
  Nobody has walked on Mars yet. Someone says: **"If the first person to walk on Mars is tired, they should rest."**
  *   [ ] True
  *   [ ] False
  *   [ ] Null

  **Q7 (Vacant Role):**
  The "Project Lead" position is currently empty. A ticket comment reads: **"The Project Lead approved this."**
  *   [ ] True
  *   [ ] False
  *   [ ] Null

  **Q8 (Scope Ambiguity - Negation):**
  We have a list of users. Everyone logged in today. Someone says: **"The user who didn't log in is banned."**
  *   [ ] True (It is not the case that a non-logging user exists)
  *   [ ] False (There is no such user to be banned)
  *   [ ] Null (Query returns empty set)

  **Q9 (Incomplete Description):**
  There are 50 databases in the cluster. One is down. An alert says: **"The database is down."**
  *   [ ] True (We know which one we mean)
  *   [ ] False (There are many databases)
  *   [ ] Null (Ambiguous reference)

  **Q10 (Question Form - Zero Match):**
  There is no King of France. Someone asks: **"Is the King of France bald?"**
  *   [ ] Valid Question (Answerable)
  *   [ ] Invalid Question (Glitch)
  *   [ ] Depends on context

  **Q11 (Attributive - Zero Match):**
  A detective finds a brutal murder. He says: **"The murderer is insane."** (It turns out it was an accident; no murderer exists).
  *   [ ] True
  *   [ ] False
  *   [ ] Null

  **Q12 (Disputed Holder):**
  Two people claim to be the interim CEO. Someone says: **"The CEO signed the check."** (Only one signature is on the check).
  *   [ ] True
  *   [ ] False
  *   [ ] Null

  ---

  # Part 2: The Taxonomy (Decision Tree)

  This is your whiteboard diagram. It splits the room based on how they handle errors.

  ```text
  START: Simple Assertion (Q1: No King)
  │
  ├── Vote: FALSE ──┬──────────────────────────────────────┐
  │                 │                                      │
  │           (Russellian Core)                            │
  │           "Existence is a condition"                   │
  │                 │                                      │
  │                 ▼                                      │
  │         Check Negation (Q4: King not bald)             │
  │         │                                              │
  │         ├── Vote: TRUE ──► LEAF A: Narrow Scope Russell│
  │         │              ("It is not the case that...")  │
  │         │                                              │
  │         └── Vote: FALSE ─► LEAF B: Wide Scope Russell  │
  │                        ("The non-existent king...")    │
  │
  ├── Vote: NULL ───┬──────────────────────────────────────┤
  │                 │                                      │
  │           (Presupposition Core)                        │
  │           "Existence is a precondition"                │
  │                 │                                      │
  │                 ▼                                      │
  │         Check Projection (Q10: Question / Q4: Negation)│
  │         │                                              │
  │         ├── Vote: NULL ──► LEAF C: Strawsonian         │
  │         │              (Error bubbles up)              │
  │         │                                              │
  │         └── Vote: TRUE/FALSE ─► LEAF D: Local Failure  │
  │                         (Error stops at the verb)      │
  │
  └── Vote: TRUE ───┬──────────────────────────────────────┤
                    │                                      │
              (Referential Core)                           │
              "Intent overrides description"               │
                    │                                      │
                    ▼                                      │
              Check Misdescription (Q3: Martini/Water)     │
              │                                            │
              ├── Vote: TRUE ──► LEAF E: Donnellan (Ref)   │
              │              ("I meant that guy")          │
              │                                            │
              └── Vote: FALSE ─► LEAF F: Donnellan (Attr)  │
                             ("I meant whoever fits")     │
  ```

  **Additional Branches (Orthogonal to the tree above):**
  *   **Contextual Restriction (Q9: Database):** If they vote **TRUE** here but **FALSE/NULL** on Q1, they are **Contextualists**. They treat "The" as "The [in this context]".
  *   **Scope Sensitivity (Q8: Negation):** If they split between True/False on Q8, they recognize **Scope Ambiguity** (SQL `NOT EXISTS` vs `EXISTS NOT`).

  ---

  # Part 3: Scoring Key & Position Labels

  Use this to tally the votes. Do not use the philosopher names on the slide; use the "Engineer Labels."

  ### LEAF A: Narrow Scope Russellian
  *   **Label:** `ASSERTION_FAILED_BUT_NEGATION_TRUE`
  *   **Signature Tell:** Q1 = **False**, Q4 = **True**.
  *   **Logic:** "The King is bald" returns 0 rows (False). "It is not the case that [The King is bald]" returns 1 row (True).
  *   **SQL Analogy:** `SELECT * FROM kings WHERE bald = TRUE` (Empty) vs `NOT (SELECT ...)` (True).

  ### LEAF B: Wide Scope Russellian
  *   **Label:** `HARD_FAIL_ON_MISSING_ROW`
  *   **Signature Tell:** Q1 = **False**, Q4 = **False**.
  *   **Logic:** Both sentences assert the existence of a King. Both fail.
  *   **SQL Analogy:** Both queries require `JOIN kings`. If table empty, both error/fail.

  ### LEAF C: Strawsonian (Classic)
  *   **Label:** `PRECONDITION_MISSING (NULL)`
  *   **Signature Tell:** Q1 = **Null**, Q4 = **Null**, Q10 = **Invalid**.
  *   **Logic:** Existence is a precondition. If missing, the truth value is undefined. This "error" propagates through negation and questions.
  *   **SQL Analogy:** Foreign Key Constraint Violation. The query doesn't run; the transaction rolls back.

  ### LEAF D: Local Failure (Rare)
  *   **Label:** `ERROR_HANDLED_LOCALLY`
  *   **Signature Tell:** Q1 = **Null**, Q4 = **True**.
  *   **Logic:** The positive sentence crashes, but the negation catches the exception and returns True.
  *   **Note:** This is logically coherent but philosophically unpopular.

  ### LEAF E: Referentialist (Donnellan)
  *   **Label:** `POINTER_SEMANTICS`
  *   **Signature Tell:** Q3 = **True**.
  *   **Logic:** The description is just a label to get you to look at the object. If we are looking at the same object, the statement is True, even if the label is wrong.
  *   **SQL Analogy:** Passing by Reference / Pointer. You passed the memory address of the guy, not a query for his drink.

  ### LEAF F: Attributivist
  *   **Label:** `QUERY_SEMANTICS`
  *   **Signature Tell:** Q3 = **False**.
  *   **Logic:** The description is the query. If the query returns the wrong row (or no row), the statement fails, regardless of intent.
  *   **SQL Analogy:** Passing by Value / Query String. `SELECT * FROM men WHERE drink = 'martini'`.

  ### LEAF G: Contextualist (Incomplete Descriptions)
  *   **Label:** `IMPLICIT_WHERE_CLAUSE`
  *   **Signature Tell:** Q9 = **True**, Q1 = **False/Null**.
  *   **Logic:** "The database" implicitly means "The database [we are monitoring]". Uniqueness is checked against the context, not the universe.
  *   **SQL Analogy:** `SET search_path TO monitoring_schema; SELECT * FROM database;`

  ---

  # Part 4: The "Dead Ends" & "Blind Spots"

  Put this on the final slide. It shows you've thought about the edge cases.

  ### Logically Possible but Unexplored (Dead Ends)
  *   **The "Multi-Match True" Position:** Voting **True** on Q2 (Two dogs).
      *   *Why:* Nobody defends this. If uniqueness fails, no major theory says the sentence becomes *True*. It's either False or Null.
  *   **The "Negative Existential" Paradox:** Voting **True** on Q1 (King is bald).
      *   *Why:* Incoherent. Asserting a property of a non-existent object without irony is logically broken in all standard systems.

  ### Indistinguishable Leaves (Blind Spots)
  *   **Russell (Wide Scope) vs. Attributivist:**
      *   *The Problem:* On simple positive sentences (Q1, Q2, Q11), these two often vote the same (False).
      *   *The Split:* You need complex belief reports (Q5) or modal logic to separate them. For this brown bag, treat them as the same bucket: **"Query Must Succeed."**
  *   **Strawson vs. Contextualist:**
      *   *The Problem:* Both vote **Null/False** on Q1 (King).
      *   *The Split:* Only Q9 (Database) separates them. If they say Q9 is **True**, they are Contextualists. If **Null**, they are Strawsonians.

  ### The "SQL Grouping" Bug (Scope Ambiguity)
  *   **Focus:** Q8 ("The user who didn't log in...").
  *   **The Issue:** This is `NOT (EXISTS user...)` vs `EXISTS user (NOT logged_in)`.
  *   **The Reality:** In natural language, this is genuinely ambiguous. If your team splits 50/50 here, **nobody is wrong**. It's a scope ambiguity, not a semantic disagreement. Tell them this is like operator precedence: you need parentheses (context) to resolve it.

  ---

  # Part 5: Presenter Notes (Cheat Sheet)

  *   **If the room argues about Q3 (Martini):** You have found the Donnellan split. Ask: "Did you succeed in telling me who you meant?" (Referential) vs "Did the words match the world?" (Attributive).
  *   **If the room argues about Q4 (Negation):** You have found the Russell/Strawson split. Ask: "Does 'not' cancel the whole claim, or just the baldness?"
  *   **If everyone votes True on Q9 (Database):** Congrats, you are all Contextualists. You treat "The" as having an implicit `WHERE cluster_id = current`.
  *   **If everyone votes False on Q1 (King):** You are a room of Russellians. You treat "The" as an `EXISTS` check.
  *   **If everyone votes Null on Q1 (King):** You are a room of Strawsonians. You treat "The" as a Foreign Key constraint.

  **Closing Line:** "Philosophers have been fighting about this for 100 years. But looking at our votes, it looks less like a truth problem and more like a schema design problem. Do we want 'The' to be a Unique Index (Russell), a Foreign Key (Strawson), or a Variable Pointer (Donnellan)? Pick the one that makes our API least likely to crash."
