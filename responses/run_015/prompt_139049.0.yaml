answer: |-
  Your flatmate has served you a classic dish: the Underdetermination of Theory by Evidence (UTE), garnished with a Humean scepticism about induction. It is a formidable argument, and it is entirely understandable that it keeps you awake. However, for a working scientist—particularly one whose models inform policy—it is a *reductio ad absurdum* of philosophy, not of science.

  You are right to feel that something is being smuggled in. While the logical manoeuvre in step (1) is valid, the epistemic conclusion in step (2) is where the argument breaks. I reject **step (2)**.

  Here is why step (2) looks plausible, why it is mistaken, and the price you pay for rejecting it.

  ### Why step (2) looks fine
  Step (2) relies on a specific, narrow definition of 'evidence'. It treats the relationship between evidence $E$ and theory $T$ as a matter of **logical compatibility** or **likelihood** alone. If $T$ entails $E$, and $T^*$ entails $E$, then relative to $E$ alone, they look symmetric. This appeals to a certain logical purity: surely the data speaks for itself?

  Furthermore, it isolates the current dataset $E$ from the rest of your knowledge. If you look *only* at the spreadsheet of case numbers from 2020–2024, your flatmate is correct that a polynomial curve fitting those points perfectly and a mechanistic SIR model fitting those points perfectly are 'compatible' with the data. Step (2) smuggles in the assumption that 'evidence' means 'the current dataset in isolation', stripping away the background knowledge that makes $T$ a theory and $T^*$ a curiosity.

  ### Why step (2) is wrong
  Step (2) claims that because multiple theories fit the data, the data gives *no reason* to prefer one. This ignores **Bayesian confirmation**. In your field, you likely accept that the support a theory receives from evidence depends on two things:
  1.  **Likelihood:** How probable is the data given the theory? ($P(E|T)$)
  2.  **Prior Probability:** How probable is the theory before seeing this specific data? ($P(T)$)

  Your flatmate's argument holds only if $P(T) = P(T^*)$. But they are not equal. $T^*$ (the 'grue' variant, or the model that changes behaviour arbitrarily next quarter) is *gerrymandered*. It is constructed specifically to fit $E$ while violating the structural assumptions that make $T$ plausible (e.g., biological continuity, conservation laws, contact rates).

  To reject (2) is to assert that **prior probability is epistemic, not merely aesthetic.** When you prefer a model with three parameters over one with three hundred that fits the data equally well, you are not just being aesthetic; you are guarding against overfitting. You are acknowledging that the space of 'complex, arbitrary functions' is vastly larger than the space of 'simple, mechanistic laws'. If a simple law fits the data, it is statistically unlikely to be a coincidence.

  Therefore, $E$ *does* favour $T$ over $T^*$, not because $T^*$ is logically incompatible with $E$ (it isn't), but because $T$ was vastly more probable *before* you saw $E$. The 'reason' to prefer $T$ is the conjunction of $E$ and your background knowledge. Step (2) falsely isolates $E$ from the rest of what you know.

  ### The Price of Rejecting (2)
  You asked what makes simplicity a guide to truth rather than psychological convenience, and whether that guide is answerable to evidence.

  **1. Why simplicity tracks truth:**
  There is a mathematical justification for this, often found in statistical learning theory (e.g., Akaike Information Criterion). If you select a model solely on fit, you capture noise as well as signal. A simpler model constrains the ways it can fit the data. If it succeeds despite those constraints, it is more likely to have captured the underlying signal (the truth) rather than the noise. Simplicity is a proxy for **predictive accuracy**.

  **2. Is it answerable to evidence?**
  Yes. This is crucial. We do not assume simplicity is true *a priori* and stick to it dogmatically. We test it. If a simple model consistently fails to predict new data while a complex one succeeds, we abandon the simple model. The 'virtue' of simplicity is validated empirically by its track record of generating robust predictions in your field. If simplicity stopped working—if complex, gerrymandered models started outperforming parsimonious mechanistic ones in cross-validation—you would have to abandon it. Thus, the guide is answerable to evidence.

  ### The Move from (1) to (3)
  You suspected a gap here. Your flatmate closes it with 'global rivals' (e.g., the world began five minutes ago).
  If you reject (2), the move from (1) to (3) loses its sting. Even if a global rival exists (Last Thursdayism), it has such a vanishingly small prior probability that no realistic amount of data $E$ will raise its posterior probability above that of standard theory $T$.
  Furthermore, global sceptical hypotheses are usually **predictively idle**. The hypothesis that 'gravity will reverse in 2100' makes a prediction. The hypothesis that 'the world is an illusion' does not. For policy purposes, a theory that makes no specific, falsifiable predictions about the future is not a rival; it is a conversation stopper. You can reject (3) on the grounds that these 'global rivals' do not qualify as competing scientific theories because they forfeit predictive power to achieve empirical equivalence.

  ### Confidence and Calibration
  I am **highly confident** that step (2) is the correct point of rejection for a working scientist. It aligns with standard Bayesian epistemology and statistical practice.

  However, I must be honest about where my own account is most likely to be wrong.
  **The Weak Point:** My defence rests on the claim that prior probabilities ($P(T)$) are objective enough to do the work required. I am assuming there is a fact of the matter about $T$ being 'more probable' than $T^*$ prior to data. A strict subjectivist Bayesian might say priors are just personal degrees of belief. If priors are purely subjective, your flatmate could argue that choosing a 'sensible' prior is just another aesthetic choice.
  **What would change my mind:** If it were demonstrated that the universe is fundamentally 'grue-like' at a base level—that nature *prefers* complexity or arbitrary discontinuities over simplicity—then the link between simplicity and truth would break. If we found that the most successful models in physics or epidemiology were invariably the most convoluted, with no penalty for overfitting, I would have to concede that simplicity is merely psychological.

  ### Summary for your Defence
  When you stand before the policy-makers, you are not claiming your model is the *only* logical possibility. You are claiming it is the **best bet**.
  *   **Against (1):** Acknowledge other curves fit the past data.
  *   **Against (2):** Argue that 'fit' is not the only metric. 'Plausibility' (based on mechanism) and 'Parsimony' (based on predictive robustness) are evidence-based criteria, not aesthetics.
  *   **Against (4):** Conclude that while certainty is impossible, **warranted assertibility** is possible. You are justified in acting on $T$ because $T$ has a higher posterior probability than $T^*$, given the total evidence (data + background knowledge).

  Your flatmate's argument is a logical grenade; it destroys everything, including his own ability to claim his argument is 'better supported' than any rival. In science, we do not seek logical certainty; we seek **reliability**. Step (2) confuses the two.

  **Confidence Level:** 85%.
  **Most Likely Error:** The assumption that 'simplicity' has a universal, cross-disciplinary definition that reliably tracks truth without circularity.
  **Falsification Condition:** If a rigorous meta-analysis of epidemiological modelling showed that models selected for parsimony consistently performed *worse* out-of-sample than models selected for maximal fit, the defence of simplicity as truth-conducive would collapse.
