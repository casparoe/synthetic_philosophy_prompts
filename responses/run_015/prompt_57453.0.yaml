      *   **Q4: Cost Comparison (Rhetoric vs. Substance).**
          *   *Analysis:* Comparing "semantic type of sentences" vs "structure of doxastic state."
          *   *Critique:* It's a bit apples-to-oranges. Denying truth conditions doesn't stop embedding (non-cognitivists handle embedding via expressivism or dynamic semantics). Denying centering makes the agent look irrational (certain of C, but not certain of C given A).
          *   *Verdict:* It is somewhat rhetorical. Non-cognitivism has evolved to handle embedding (Gibbard, Yalcin, etc.). The cost of denying centering is arguably *higher* because it violates basic logical intuition about conditionality.

      *   **Q5: Misstatements of Adams/Stalnaker/Lewis.**
          *   *Analysis:*
              *   Adams: Didn't think conditionals had truth conditions. User says "Adams taught us... tracks conditional probability." Accurate enough.
              *   Stalnaker: Thought they had truth conditions (propositions). User says "Stalnaker read the same equation the other way round." Accurate.
              *   Lewis: Triviality results. User says "refutation of Stalnaker's reading... cashed out as general argument... no truth conditions." Accurate summary of the received view.
              *   *Nuance:* Lewis's result assumes the conditional is in the algebra *and* the thesis holds for all probability functions (or at least those reachable by conditionalization). The user acknowledges this.
          *   *Verdict:* No glaring errors, but "Stalnaker read the same equation the other way round" is a bit glib. Stalnaker argued for truth conditions independently; the equation was a constraint.

      *   **Q6: Fourth Move?**
          *   *Analysis:* Contextualism? Domain restriction?
          *   *Idea:* The "Context-Shift" move (Stalnaker's later view, or contextualist accounts like Kratzer). The proposition expressed by $A \to C$ changes when you conditionalize on $C$. Lewis's proof assumes the proposition stays fixed across the probability functions $P$, $P_C$, $P_{\neg C}$.
          *   *Verdict:* Yes, the "Context-Dependence" move is the standard way out for truth-conditionalists. The user mentions "restricting to actual agents" but misses the specific semantic context-shift argument.

      *   **Q7: One Sentence to Cut.**
