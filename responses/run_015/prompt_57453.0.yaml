      *   *User's Claim:* The crucial step relies on $P_C(C|A) = 1$ and $P_{\neg C}(C|A) = 0$. These values come from the Ratio Analysis (specifically, centering). If conditional credence is primitive, these aren't definitional truths. Therefore, we can deny centering to save truth conditions + Adams Thesis.
