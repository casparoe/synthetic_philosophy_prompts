  7.  (Final thought on Dev's "Choice" comment): Dev said "this last step needs some weak choice principle." Mara said "having a copy of N inside is the same thing as being matchable with a proper part of yourself." This is the definition of Dedekind Infinite. In ZFC, Infinite $\iff$ Dedekind Infinite. In ZF (no Choice), there exist infinite sets that are *not* Dedekind infinite (amorphous sets). So if you have an infinite set, can you always find a copy of $\mathbb{N}$ inside it? Only with Countable Choice. So Dev is actually technically correct that proving "Infinite $\rightarrow$ Contains $\mathbb{N}$" requires some form of Choice. This is a very sophisticated point for a climber to mumble! I must emphasize this.

