      *   **User:** No philosophy or math background. Needs plain English explanations of technical bits.
      *   **Task:** Evaluate the argument move-by-move (1 through 4). Determine who is right about *what* in each exchange. Identify if there's a "winner." Identify if something is being missed by both.
      *   **Tone:** Informative, neutral, accessible, but mathematically accurate.

  2.  **Deconstruct the Arguments (Move by Move):**

