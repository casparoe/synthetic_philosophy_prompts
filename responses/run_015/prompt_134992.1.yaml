  You can indeed keep (1) and (2). The "At-At" theory and the standard calculus definition of instantaneous velocity are compatible with modern measure theory. The failure is not in the nature of the instant or the definition of motion, but in the assumption that summing over a countable dense set recovers the integral over the continuum. A countable set, no matter how dense, has Lebesgue measure zero.

