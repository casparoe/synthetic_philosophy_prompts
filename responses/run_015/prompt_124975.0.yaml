answer: |-
  This is a sharp observation, but there is a crucial irony in your situation that we need to clear up immediately.

  Your brother is relying on the **Principle of Alternative Possibilities (PAP)**. His logic is: *No alternatives → No responsibility.*
  The **Frankfurt Case** is designed to destroy that logic. Its conclusion is: *No alternatives → Responsibility (sometimes).*

  So, if Frankfurt cases work, they don't support your brother's defense; they **undermine** it. They are the philosophical weapon *you* are accidentally wielding, not the shield he is holding. However, you are right to be wary. The literature is not "settled" in the way a math proof is settled, and applying high-level metaphysics to a family dispute is risky.

  Here is the Frankfurt-style case built to your specifications, followed by the analysis you asked for, and finally the "settled vs. contested" reality check.

  ### The Case: The Unlocked Safe

  **The Setup:**
  Your brother, Mark, works at a family business. He has access to a safe containing cash for payroll. Mark is deeply resentful of the family and has decided to steal $500. He is not coerced; no one is threatening him. He simply wants the money and feels entitled to it.

  **The Constraint (Could Not Have Done Otherwise):**
  Unbeknownst to Mark, the safe has a new, hidden electronic lock installed by the owner (who suspects theft but has no proof). The lock is programmed with a "behavioral predictor." If Mark enters the combination with any sign of hesitation, tremor, or physiological stress associated with changing his mind, the lock jams permanently. The only way the safe opens is if Mark inputs the code with the steady hand and resolved intent of someone fully committed to the action.
  Mark does not know about the lock. He approaches the safe. He feels no hesitation. He inputs the code steadily. The safe opens. He takes the money.

  **Why he could not have done otherwise:**
  If Mark had tried to refrain from stealing (i.e., if he had tried to change his mind at the moment of action), his anxiety would have triggered the jam. He physically could not have accessed the money *unless* he was fully committed to stealing it. Thus, in that moment, the only possible world where he gets the money is the world where he chooses to steal it.

  **The Non-Robust Alternative (The Flicker):**
  Could Mark have done *anything* else? Yes. He could have hesitated. He could have typed the code 0.5 seconds slower. He could have sighed before opening the door. These are alternative possibilities.
  But are they **robust**? No. None of these alternatives allow him to avoid moral blame. Whether he steals with a steady hand or steals after a sigh, he still steals. The alternative does not allow him to be *innocent*.

  **Why it's not duress:**
  Mark doesn't know the lock exists. He feels no pressure. He is acting on his own desires. The lock is a "counterfactual intervener"—it sits idle in the actual sequence of events. It only *would* have acted if he tried to do otherwise. Since he didn't try to do otherwise, the lock did nothing.

  ---

  ### Analysis: Does it do the job?

  Here is the breakdown of the philosophical machinery in this specific case.

  **1. What PAP says:**
  The Principle of Alternative Possibilities states: *An agent is morally responsible for an action only if they could have done otherwise.*
  According to PAP, Mark is **not responsible**. Because the lock ensured he couldn't have successfully refrained, he lacked the freedom to do otherwise.

  **2. What the Intuition says:**
  Most people look at this case and say Mark **is responsible**. The lock never actually touched him. It never influenced his decision. He stole because *he wanted to steal*. The fact that he *would have been stopped* if he changed his mind seems irrelevant to the fact that he *didn't* change his mind.

  **3. The Leeway Incompatibilist Objection:**
  A defender of PAP (often an Incompatibilist) will raise the **Dilemma Defense**. They will say:
  *   *Horn A:* If the lock is a deterministic cause, then Mark is determined, and you've just smuggled in determinism.
  *   *Horn B:* If the lock leaves Mark a "flicker" of freedom (like hesitating), then he *could* have done otherwise (even if only trivially), so PAP is saved.
  *   *Your Constraint Check:* You asked for the alternative to be **non-robust**. The objection here is that even a non-robust alternative (hesitating) is enough for PAP. The incompatibilist argues that *any* alternative possibility, no matter how trivial, keeps PAP alive.
  *   *The Counter:* Frankfurt defenders argue that the alternative must be **relevant** to moral responsibility. Being able to "hesitate while stealing" is not the kind of freedom that grounds responsibility. The freedom to *avoid blame* is what matters, and that was removed.

  **4. What feature is doing the work?**
  The work is done by the **Actual Sequence**.
  In the actual world, the lock does nothing. Mark's decision flows entirely from his own psychology, desires, and reasoning. The "backup" mechanism is in a *counterfactual* world (the world where he tries to stop).
  Responsibility, the Frankfurt argument goes, depends on what happens in the **Actual Sequence**, not what *might* have happened in other worlds.

  **5. What happens if you take that feature out?**
  If you remove the "Actual Sequence" independence (e.g., if the lock *did* stimulate his brain to make him steal), he is no longer responsible. He becomes a puppet. The Frankfurt case relies entirely on the agent being the **source** of the action in the actual world, even if they lacked the **leeway** to choose differently.

  ---

  ### The "Settled Character" Variation (Your Preference)

  You asked for a version where the constraint is the agent's **own settled character** rather than an external lock.

  **The Case:**
  Mark is a pathological narcissist. He is so constituted that, given his history and psychology, it is psychologically impossible for him to prioritize the family's needs over his own resentment. He steals the money. There is no electronic lock; his own character guarantees he could not have chosen otherwise.

  **Does this do the job?**
  **Honest Answer:** **No.** This collapses into a description of a "bad person" or a determinism problem, and it loses the Frankfurt logic.

  **Why it fails as a Frankfurt Case:**
  A Frankfurt case requires a **Counterfactual Intervener** (the lock, the neuroscientist, the predictor) that *would* have acted but *didn't*.
  In the "Settled Character" version, there is no intervener. There is just Mark and his causality.
  *   If his character makes it *impossible* for him to do otherwise, you have moved from a Frankfurt Case to a **Hard Determinism** case.
  *   Incompatibilists will argue: "If his character determined the action, and he didn't choose his character, he isn't responsible."
  *   Frankfurt cases are designed to bypass this by saying, "It doesn't matter if he could do otherwise; look at how he acted in the actual sequence." But when the constraint is *internal character*, the "Actual Sequence" looks exactly like Determinism.

  **However, does it support YOUR intuition?**
  Yes. Even if it fails as a technical Frankfurt case, it supports your intuition against your brother.
  Why? Because it shifts the focus from **Leeway** (could he do otherwise?) to **Sourcehood** (did this come from him?).
  If Mark's action flowed from his own values, desires, and character (even if those were fixed), he is still the **author** of the action. Most compatibilists argue that responsibility requires **Sourcehood**, not **Leeway**.
  So, while this isn't a Frankfurt case, it is a **Semocompatibilist** argument. It says: "You don't need to be able to do otherwise to be responsible; you just need to be the source of the action."

  **The Risk:**
  If you argue this to your brother, he will say: "Exactly! I didn't choose my character! My upbringing made me this way! So I'm not the source!"
  That is why the external "Lock" in the original Frankfurt case is philosophically safer—it isolates the "could not" from the "who." The "Settled Character" version muddies the water between "I am bad" and "I am determined."

  ---

  ### Literature Check: What is actually settled?

  You asked for honesty about the consensus. Here is the state of play:

  **1. Is PAP dead?**
  **Contested.**
  *   *Status:* Many philosophers reject PAP because of Frankfurt cases. It is no longer the dominant view in compatibilist circles.
  *   *Caveat:* Incompatibilists (Libertarians and Hard Determinists) do not accept Frankfurt cases. They argue the "Flicker of Freedom" defense (there is always *some* alternative) or argue that Frankfurt cases presuppose determinism is coherent (which they deny).
  *   *Verdict:* It is **not** settled fact that PAP is false. It is a dominant *argument*, but not a proof.

  **2. Does rejecting PAP prove Compatibilism?**
  **No.**
  *   *Status:* This is the **Semocompatibilist** position (championed by John Martin Fischer). You can reject PAP (responsibility doesn't need alternatives) without settling the free will/determinism debate.
  *   *Nuance:* You can believe we have no alternative possibilities (Determinism is true) but still hold people responsible (because Sourcehood is what matters).
  *   *Verdict:* Many people reject PAP *without* buying the full Semocompatibilist package. Some reject PAP and become Hard Determinists (no alternatives, no responsibility). Some reject PAP and remain Libertarians (we do have alternatives, Frankfurt cases are flawed).

  **3. Can you use this on your brother?**
  **Be careful.**
  Your brother is making a **causal** claim ("I couldn't have done otherwise").
  *   If he means "I was coerced," that's an excuse (but the facts don't support it).
  *   If he means "Determinism is true," that is a metaphysical claim that applies to *everyone*, including you. If he isn't responsible because of determinism, neither are you for being angry at him. This leads to a stalemate, not resolution.
  *   If he means "My character is fixed," that is a claim about **Sourcehood**.

  **The Winning Move (Philosophically & Practically):**
  Don't argue about Alternative Possibilities (PAP). Argue about **Sourcehood**.
  The Frankfurt case teaches us that **Alternative Possibilities are not the ground of responsibility.** The ground of responsibility is whether the action issued from your own agency.

  *   **Don't say:** "Philosophy proves you could have done otherwise." (You can't prove that).
  *   **Do say:** "Even if you feel like you couldn't have done otherwise, that doesn't matter. What matters is that *you* did it. It came from *your* desires, *your* choices, and *your* character. The fact that you 'couldn't' stop yourself doesn't change the fact that *you* were the one driving."

  ### Summary for the Sibling Dispute

  1.  **The Frankfurt Case** shows that "Could not have done otherwise" is not a "Get Out of Jail Free" card.
  2.  **The "Settled Character" version** is not a true Frankfurt case, but it highlights that actions flowing from your own character are still *yours*.
  3.  **The Consensus:** Philosophers do not agree that PAP is definitively false, but the majority view in ethics is that **Sourcehood matters more than Leeway**.
  4.  **The Advice:** Do not tell your brother "Philosophy says you're wrong." Tell him: "Even if you believe you were determined to do it, you are still the one who did it. Blame isn't about magic freedom; it's about ownership. You own this action."

  That preserves your intuition (he's responsible) without requiring you to win a metaphysical debate he doesn't understand.
