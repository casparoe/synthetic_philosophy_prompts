  **To:** Interpretation and Visitor Experience Committee
  **From:** [Name], PhD Candidate
  **Date:** 10th [Month]
  **Subject:** Urgent: Label Text Recommendations for Objects 7 and 9

  **Recommendation**

  We must adopt a 'claims-not-facts' framing for the remaining labels. This approach respects the partner museum's catalogue while satisfying our plain-language policy. I recommend we reject both the Curator's provocative assertion and the Head of Learning's oversimplification in favour of attributing the claim directly to the philosopher. This avoids telling children 'this is not a horse' (which is factually false) while retaining the philosophical intrigue regarding names versus things. It resolves the impasse by shifting the focus from the object's reality to the historical argument.

  **Proposed Text**

  **Object 7 (Tang Horse):** 'The philosopher Gongsun Long argued that the name 'white horse' is not the same as the name 'horse'.'
  **Object 9 (Marble Stone):** 'He suggested we perceive hardness and whiteness separately. Thus, the stone combines three elements: hard, white, and stone.'

  **Guiding Principle**

  For the remaining ten objects, apply this rule: 'Describe the philosophical puzzle, not the object's reality.' This ensures we report historical arguments without making false scientific claims, satisfying both accuracy and accessibility. It allows us to present complex ideas from early China without requiring visitors to accept paradoxical statements as physical truths. This principle is scalable; whether discussing ritual vessels or jade bi, we focus on how names and categories functioned then, not what the objects are now.

  **The Opposition**

  The strongest case for the position I am voting down (the Curator's 'This is not a horse') rests on engagement. Our dwell-time data confirms that baffling labels stop visitors. A provocative claim creates a 'hook'; it demands resolution. By hedging with 'Gongsun Long argued...', we sanitise the paradox. The Curator's version forces the visitor to confront the absurdity immediately, creating a memorable friction that educational hedging dilutes. If we prioritise comfort over challenge, we risk turning a philosophy exhibition into a dry history lesson. The partner catalogue's flat statement supports this boldness, suggesting our international collaborators expect us to trust the visitor's intelligence.

  **Assessment and Cost**

  However, the Curator's position loses because it violates our duty of care. Telling a nine-year-old 'this is not a horse' without immediate, accessible clarification invites confusion and complaints. My 'names-not-animals' reading costs us that immediate shock value. We trade provocation for precision. We lose the 'wow' factor of the paradox to ensure the 'how' of the argument is understood. Given the printer deadline and the partner museum's catalogue, attribution is the only safe path that doesn't contradict our partners or our policy. While my supervisor may view this committee work as a distraction, resolving this now prevents costly reprints later. I will draft the remaining labels using this principle by Wednesday. Please confirm approval by noon Tuesday.
