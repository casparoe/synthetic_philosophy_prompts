      *   *Critique:* This is actually a controversial take. Usually, supererogation is optional *despite* being possible. The user is trying to ground optionality in impossibility. This is the weak link.
      *   *Claim 5:* "Same-shift rule." If a peer did it, you could have. This destroys Claim 4's excuse.
