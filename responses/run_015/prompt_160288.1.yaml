  "That sounds unfalsifiable," Bell said. "If the subject says 'I am one' and you say 'You are two, you just can't tell,' no evidence could ever prove you wrong. But I will concede this: **The integration is physically broken.** The system no longer functions as a unified whole in terms of information flow."

  Aris nodded slowly. "And I concede this: **The lived experience is unified.** From the inside, nothing feels split. But physics trumps phenomenology. When the corpus callosum is cut, you lose the unity of access—the ability to compare and combine information globally—even if the unity of experience—the feeling of being a single 'I'—remains intact per hemisphere."

  "Wait," Bell said. "Define that plainly. Unity of access means the brain parts can talk. Unity of experience means it feels like one person."

  "Exactly," Aris said. "I'm saying you can have the feeling without the talk."

  "But if the talk is gone, who is feeling?" Bell pressed. "Let's test that cliff. Imagine a callosal shunt. A device implanted between the hemispheres. We can dial the bandwidth from zero to full. We can delay signals by a third of a second. We can drop half the packets, making the data lossy."

