      The late sun stretched down the lab corridor. Dr. Aris capped a black marker, staring at two circles drawn on the whiteboard. Dr. Bell leaned against the wall, arms crossed.

      "You see the disconnect," Aris said, tapping the left hemisphere. "The left hand buttons the shirt; the right hand undoes it. Two goals, two agents. The surgery doesn't just block a signal; it splits the subject. There are two centres of consciousness sharing a skull."

      Bell pushed off the wall. "But the patient says, 'I felt no conflict.' If we count subjects, we usually ask the subject. You're saying the speaking hemisphere is lying?"

      "Not lying. Ignorant," Aris replied. "The speaking left side doesn't see the right side's data. If I cut your optic nerve, you don't report seeing darkness in that eye; you report seeing nothing. A subject whose introspective machinery is halved cannot notice its own division. That's why the report is unreliable."

      "That sounds unfalsifiable," Bell said. "If the subject says 'I am one' and you say 'You are two, you just can't tell,' no evidence could ever prove you wrong. But I will concede this: **The integration is physically broken.** The system no longer functions as a unified whole in terms of information flow."

      Aris nodded. "And I concede this: **The lived experience is unified.** From the inside, nothing feels split. But physics trumps phenomenology. When the corpus callosum is cut, you lose the unity of access—the ability to compare and combine information globally—even if the unity of experience—the feeling of being a single 'I'—remains intact per hemisphere."

      "So," Bell said, picking up a blue marker. "Let's test that cliff. Imagine a callosal shunt. A device implanting between the hemispheres. We can dial the bandwidth from zero to full. We can delay signals by a third of a second. We can drop half the packets."

      Aris frowned. "Go on."

      "At half bandwidth, how many subjects are there?" Bell asked. "If I share senses but not motor intentions, am I one person driving a glitchy car, or two people fighting over the wheel? If unity comes in degrees, where is the cliff? Is there a specific setting where 0.9 minds become 1.0? And if we reverse it—opening the shunt for a patient who has lived years at zero bandwidth—is that two subjects fusing into one? Does one die? Or is it one subject recovering? If it's recovery, what was it doing during the years of separation?"

      Aris wiped the board clean. "If unity is binary, there must be a threshold. But biology is rarely binary. It's likely a gradient. At low bandwidth, you have weak unity. At high, strong unity. The 'subject' isn't a countable object like a marble; it's a process. If the shunt shows a smooth transition in behavior and report as we dial up, it suggests there is no fact of the matter about the count. Just varying degrees of integration."

      "But if there's no fact of the matter," Bell countered, "then your claim that the surgery creates *two* subjects is also vague. You can't have it both ways. Either the count is real, or it's a convention."

      "Here is where we stand," Aris said. "We both assume **consciousness requires information integration to exist as a single subject.** We agree that without some link, there is no 'we.'"

      "True," Bell said. "But here is what would change my mind: If, at a specific bandwidth setting, the patient suddenly reported a qualitative shift—a 'snap' into unity—or if behavioral coordination jumped discontinuously. That would suggest a real threshold, a cliff where one subject emerges."

      "And for me," Aris said, capping the marker. "If the shunt allows full data transfer but the patient *still* reports feeling like two distinct voices refusing to merge, even with perfect access. That would prove that integration isn't enough—that there's a metaphysical glue we haven't found. But until then, I follow the data. If the link is cut, the mind is cut."

      Bell smiled faintly. "Then let's build the shunt. The answer is in the dial."

