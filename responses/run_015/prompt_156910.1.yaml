  Hi — I'm a journalist, I cover science and ideas, and I'm two hours from deadline on a piece about a city charter amendment that would swap plurality for approval voting in three-way council races. The reform group's fact sheet I recieved says Gibbard–Satterthwaite only covers systems that ask voters to rank candidates, so approval voting — where you just tick everyone you find acceptable — is immune to tactical voting, and voters can finally stop strategising. The opponents cite the same theorem for the opposite conclusion: every system is gameable, so choosing between them is pure politics with no mathematical content. Honestly both sound half-right to me, and my plan is to split the difference and write that approval voting escapes the theorem, so there's no reason not to vote your honest preferences, and that everything past that is just values. Relatedly, the city clerk wants to print on the ballot that you can never hurt your favourite candidate by approving someone else, and I'd like to repeat that line too. Can you tell me wich parts I'd have to walk back, and hand me one sentence I can safely print instead? One paragraph, under 250 words, and please flag anywhere I'm leaning on a term in a way the theorem doesn't support — I'd rather look dumb to you than in print.
