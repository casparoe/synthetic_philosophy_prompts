      *   **Opponents Claim:** "Every system is gameable." -> **Mostly True.** Gibbard's later theorem (Gibbard's Theorem, 1973) extends impossibility results to *all* deterministic voting systems, including cardinal ones like approval voting. So, approval voting is gameable.
      *   **City Clerk's Line:** "You can never hurt your favourite candidate by approving someone else." -> **True.** This is the key property of approval voting (monotonicity/no regret for approving). Approving a less preferred candidate cannot cause your preferred candidate to lose if they would have won otherwise. This is mathematically sound for approval voting.
      *   **User's Plan:** "Approval voting escapes the theorem, so there's no reason not to vote your honest preferences." -> **False.** It escapes G-S (ranked), but not strategic voting generally. There *are* reasons to strategize (e.g., withholding approval from a viable second choice to help a first choice).

