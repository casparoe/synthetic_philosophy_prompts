  2.  **Fact-Check the Claims:**
      *   **Gibbard–Satterthwaite Theorem:** Applies to *ranked* voting systems (ordinal preferences) that select a single winner. It states that any such system is either dictatorial, limits choices to two candidates, or is susceptible to tactical voting.
      *   **Approval Voting:** This is a *cardinal* voting system (rating/approving candidates, not ranking them). G-S technically does not apply directly because it assumes ordinal rankings.
