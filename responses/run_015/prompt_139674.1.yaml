  Here's the setup and my opening. My state legislature is about to pass something called the Meridian Act: the state reimburses any citizen for the full cost of any credential — tuition, exam fees, equipment, the lot — but only if you complete it. Start and fail, or drop out, and you eat the entire cost yourself: no forgiveness, no partial refund. My friend on the committee says this destroys the signaling value of a degree; I say it doesn't, and I want you to referee and then argue back at me. My argument: the handicap doesn't live in the receipt for the tuition, it lives in the risk. For a low-ability type the expected cost of enrolling is dominated by the chance of failing and having to swallow the whole bill, and the Act only insures the branch that was cheap for the high-ability type anyway — so the differential survives, and if anything the degree signals more cleanly afterward. My friend says that's special pleading: if the state writes the check then the tail is free, and a peacock's tail is a handicap only because the peacock pays for it. Which of us is wrong, and where precisely does my argument break if it breaks? Go.

