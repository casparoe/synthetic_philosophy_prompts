      *   Pre-commitment: If I rationally bind my future self, I am asserting my future self's veto is *illegitimate*. If the AV says the veto is legitimate, pre-commitment is irrational. But pre-commitment is paradigmatically rational. -> **Fatal.**
      *   Extreme Cases: If I veto my own existence (smoking), the "future self" ceases to exist. Can you have normative distance to a non-entity? -> **Damaging/Fatal.**

