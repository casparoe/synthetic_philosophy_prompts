answer: |-
  This is a classic philosophical tension, and the fact that you're circling suggests you're bumping up against the difference between *utilitarian* outcomes (safety, efficiency, GDP) and *humanist* outcomes (meaning, agency, dignity).

  Your gut is actually consistent; you just haven't named the variables you're weighing. You are implicitly balancing two axes: **The Nature of the Task** (Burden vs. Anchor) and **The Security of the Transition** (Supported vs. Abandoned).

  Here is a principle that fits your gut reactions, an analysis of your new case, and a suggestion on what to sacrifice.

  ### The Principle: "Burden vs. Anchor"

  **Automation is morally good when it removes a *Burden* (danger, drudgery, alienation) without severing an *Anchor* (craft, community, livelihood), OR when it severs an Anchor only to replace it with a stronger one.**

  *   **Burdens** are things that diminish human flourishing (risk of death, boredom, repetitive strain).
  *   **Anchors** are things that sustain human flourishing (pride in craft, economic stability, community cohesion).

  Let's run your five cases through this filter:

  1.  **Mining:** Removes a massive **Burden** (death). Severs an **Anchor** (the job), but replaces it with a stronger one (life + severance). **Verdict: Good.**
  2.  **Call Center:** Removes a **Burden** (alienation/boredom). Severs an **Anchor** (income), but your gut assumes a viable replacement (they were looking anyway). **Verdict: Good.**
  3.  **Bakery:** Removes a neutral/positive **Burden** (physical labor). Severs a strong **Anchor** (craft pride/community). The replacement (retraining) is generic, not stronger. **Verdict: Bad.**
  4.  **Small Town:** Removes a neutral **Burden** (inefficiency). Severs a massive **Anchor** (the town's economic survival). No replacement offered. **Verdict: Bad.**
  5.  **Radiology:** Removes a **Burden** (tedious reading). Preserves the **Anchor** (the profession), actually strengthening it by allowing more clinical work. **Verdict: Good.**

  This explains why Bakery and Radiology feel different. In Radiology, the *profession* is the anchor, and automation polishes it. In the Bakery, the *act of baking* is the anchor, and automation smashes it.

  ### The New Case: The Trapped Worker

  > *A person is trapped in a job they hate because they need the money. Automation takes it away, and they cannot find another one.*

  *   **Nature of Task:** It is a **Burden** (they hate it).
  *   **Transition:** It is **Abandoned** (no new job found).
  *   **Anchor Status:** The job was an **Anchor** (income/survival), even if the work was hated.

  **Verdict: Bad.**

  Under the "Burden vs. Anchor" principle, removing a Burden never justifies destroying an Anchor if the result is precarity. A hated job is still a lifeline. If automation cuts the lifeline without throwing a rope, it has reduced human agency. This aligns with your **Small Town** verdict: economic survival trumps efficiency or even subjective happiness with the work itself.

  ### The Sacrifice

  If you need to simplify this principle for a magazine piece, you will likely face pressure to make it more binary (e.g., "Automation is good if it frees us"). To make the principle truly simple, you would have to sacrifice the **Call Center** verdict.

  **Why?**
  The Call Center case is the most fragile. It relies entirely on an external assumption: *"most were looking for other work anyway."*
  *   If they find that work, it's a **Good** (Liberation from alienation).
  *   If they *don't* find that work, it becomes identical to your **Trapped Worker** case (Loss of livelihood), and the verdict flips to **Bad**.

  The Mining case is robust (life > work). The Bakery case is robust (craft > efficiency). The Small Town case is robust (survival > efficiency). But the Call Center case hangs on the health of the broader labor market, which is outside the control of the automation itself.

  **How to frame it:**
  You can argue that the Call Center intuition is *conditional*. If you want a principle that holds water universally, you must admit that automating "bad jobs" is only good if the *exit* is secure. If you can't guarantee the exit, you can't call the automation "Good" yet.

  **The Headline Principle for your Piece:**
  *"Automation is liberation only when it removes the burden of work without removing the basis of life."*

  This keeps your Mining, Bakery, Small Town, and Radiology verdicts intact, classifies the Trapped Worker as a failure of the system, and flags the Call Center as a "proceed with caution" scenario rather than an inherent good.
