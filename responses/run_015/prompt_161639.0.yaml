      *   *Key Insight to weave in:* The difference between *verification* (security) and *generalization* (AI). Security verifies code against spec. AI generalizes from training data to deployment environment. The gap is where the risk lives.

      *   *Addressing the "Residue":* What is lost? The concept of *optimization pressure*. Security doesn't usually model the system as trying to escape. It models the system as failing or being attacked from outside. AI safety models the system as attacking from inside due to objective function mismatch.

