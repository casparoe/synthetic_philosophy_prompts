answer: |-
  You are right to be frustrated. The ritual incantation of "heritability is not immutability" is performed frequently, but its logical consequences are rarely integrated into the actual discourse. When the dust settles, the high heritability number is still treated as a gravitational anchor pulling the mean toward a genetic fixed point, despite the explicit disclaimer that it does no such work.

  The Flynn Effect is indeed the stress test this concept needs. It is not merely an exception; it is a demonstration of the structural limits of the variance-components model. Here is the mapping, the silence, and the verdict.

  ### 1. The Mapping and the Silence

  **The Quantity:**
  When you cite a heritability estimate ($h^2$) of 0.6 for IQ in a rich country, you are quantifying:
  *   **Trait:** Performance on a specific psychometric battery at a specific time (the phenotype), not "intelligence" as a latent biological substance.
  *   **Population:** A specific cohort (e.g., Americans born 1980–1990).
  *   **Environment:** The range of environmental variance *actually experienced* by that cohort.
  *   **Statistic:** The proportion of *variance* ($V_P$) within that cohort attributable to additive genetic variance ($V_A$).

  **The Flynn Effect:**
  *   **Change:** A shift in the *mean* ($\mu$) of the phenotype across cohorts (time).
  *   **Cause:** Systematic environmental changes affecting the population (nutrition, schooling, complexity of life, test familiarity).

  **The Verdict:**
  You are correct: **The estimate is silent by construction.**

  Heritability is a ratio of variances ($V_G / V_P$). The Flynn Effect is a shift in the mean ($\Delta\mu$). In a normal distribution, the variance and the mean are orthogonal parameters. You can slide the entire curve to the right (Flynn) without changing its width ($V_P$), and thus without changing the ratio of genetic to environmental variance within the curve.

  If the environmental improvement is uniform (everyone gets better nutrition, everyone gets better schooling), the environmental *variance* ($V_E$) might not change even though the environmental *level* changes drastically. If $V_E$ is constant and $V_G$ is constant, $h^2$ remains 0.6, even if the mean IQ jumps 15 points.

  **Does it have a name?**
  There is no single canonical noun for this, but statistically it is the **Independence of Variance Components and Mean Levels**. In evolutionary biology and behavioral genetics, this is the core insight of the **Norm of Reaction**. The specific error of assuming high within-group $h^2$ constrains between-group (or between-time) mean differences is often associated with **Lewontin's Aggregation Problem** (from his 1970 seed analogy). The "blindness" you describe is the inability of a variance decomposition model to detect uniform level shifts in the environmental input.

  ### 2. Fluid vs. Crystallized (Construct Validity)

  This is the sharper knife. The Flynn Effect is not uniform across subtests. It is massive on Raven's Matrices (Fluid $g$) and negligible on Vocabulary (Crystallized $g$).

  **The Argument:**
  Heritability estimates assume **Measurement Invariance**. They assume that "IQ" in 1950 is the same latent trait as "IQ" in 2000.
  *   **Hornell's Paradox / The Jensen Effect:** The subtests most loaded on the general factor ($g$) usually show the *lowest* Flynn gains. The gains are on tests with lower $g$-loadings.
  *   **Implication:** If the gains are on Fluid tasks, and heritability estimates are often derived from batteries heavily weighted toward $g$, we have a mismatch.
      *   *Reading A:* The latent trait ($g$) hasn't changed; only the specific cognitive skills required to solve abstract puzzles (test-taking sophistication, visuospatial hygiene) have changed. If so, the heritability of *g* is irrelevant to the Flynn shift because *g* didn't move.
      *   *Reading B:* The tests are measuring different constructs across time. If 1950 Raven's scores measure "abstract reasoning capacity" and 2000 Raven's scores measure "abstract reasoning capacity + industrialized visual literacy," then the $h^2$ estimated in 1950 does not apply to the 2000 phenotype.

  **Does the trait stay fixed enough?**
  Probably not. If the Flynn Effect is largely a change in *how* people approach tests (cognitive style) rather than *capacity* (neural efficiency), then the "IQ" in the heritability estimate is not the same variable as the "IQ" in the Flynn Effect. The number loses portability. You cannot use a 1950 $h^2$ to make predictions about a 2000 mean shift if the 2000 phenotype includes a large, environmentally-driven component that was negligible in 1950.

  ### 3. Distributional Shape and Variance Compression

  You asked if gains at the bottom should compress environmental variance and push $h^2$ up.

  **The Logic:**
  If the Flynn Effect is caused by the removal of environmental constraints (e.g., iodine deficiency, lead exposure, lack of schooling) that disproportionately affected the lower tail:
  1.  The lower tail moves up faster than the upper tail.
  2.  Total Phenotypic Variance ($V_P$) decreases (compression).
  3.  Assuming Genetic Variance ($V_G$) remains constant (gene frequencies don't change that fast), the ratio $h^2 = V_G / V_P$ must **increase**.

  **Is this checkable?**
  Yes. It is the **Scarr-Rowe Effect** (or SES interaction with heritability).
  *   **Prediction:** In environments where constraints are lifted (higher SES, developed nations), $h^2$ should be higher because $V_E$ is suppressed. In deprived environments, $V_E$ is large, so $h^2$ is lower.
  *   **Evidence:** Meta-analyses (e.g., Tucker-Drob & Bates, 2016) generally support this in the US: $h^2$ of IQ is lower in low-SES families and higher in high-SES families.
  *   **Honest Answer:** This is a genuine prediction of the variance-components model, and the data *does* support it. This is one place where the concept does "honest work." It predicts that as the environment becomes more uniform and optimal, genetic differences become the dominant source of remaining variance.

  However, this does not explain the *mean shift*. It only explains the change in the *ratio* during the shift. It confirms that $h^2$ is dynamic, not static, which undermines the use of a single number to argue for long-term stability.

  ### 4. The Category Error: Heritability of the Flynn Effect

  **Can you ask for the heritability of the Flynn Effect?**
  No. This is a **Category Error**.
  *   Heritability requires a distribution of individuals.
  *   The Flynn Effect is a difference between two cohort means.
  *   You cannot calculate a variance component for a single data point (the 1990 mean) against another single data point (the 1950 mean).

  **Why is it tempting?**
  It is tempting due to **Reification**. We treat "IQ" as a substance inside the head, like height. If height is 80% heritable, we assume the *increase* in height over the century (due to nutrition) must have a heritability, or that the increase is "real" biological growth.
  When people ask "Is the Flynn Effect genetic?", they are asking "Did gene frequencies change?" (No, too fast). When they ask "Is it heritable?", they are confused. They want to know if the *cause* of the shift is internal or external. But heritability is not a metric for the cause of a mean shift; it is a metric for the cause of *differences* around the mean.

  The temptation persists because the variance-components language colonizes the entire discourse. If you have a hammer ($h^2$), every question about IQ looks like a question about variance partitioning, even when the question is about parameter shifts.

  ### 5. Final Verdict

  **Is the Flynn Effect a confirmation, anomaly, or out-of-scope?**
  It is **Out-of-Scope**, but it functions as a **Falsification of the Implication**.

  *   **The Math:** The variance-components model is mathematically silent on mean shifts. It does not predict the Flynn Effect, nor does it forbid it.
  *   **The Discourse:** Defenders of high $h^2$ often use the statistic to imply that IQ is largely fixed and resistant to environmental intervention. The Flynn Effect falsifies *that implication*. It proves that the "environment" in the $V_E$ term is not just noise; it is a lever that can move the entire distribution by 15+ points (0.5 to 1 SD) in a single generation.

  **Why it looks worse than admitted:**
  The concept looks worse because the "high heritability" number is psychologically weaponized to suggest immutability, while the technical definition disclaims it. The Flynn Effect exposes this gap. It shows that you can have high $h^2$ *and* massive environmental malleability simultaneously. Most people (including many researchers) cannot hold both thoughts at once.

  **A Better Framing:**
  You asked for a framing that does better. Two concepts handle this without the blindness:

  1.  **Norms of Reaction:**
      Instead of asking "How heritable is IQ?", ask "What is the reaction norm of this genotype across environments?"
      *   The Flynn Effect shows that the reaction norm for modern populations has a steep slope. Small changes in environmental quality (schooling, complexity) yield large changes in phenotypic output.
      *   High $h^2$ within a cohort just means that *within the current slice of the reaction norm*, individuals are spread out mostly due to genetics. It says nothing about the slope of the norm itself.

  2.  **Measurement Invariance / Construct Validity:**
      Before estimating heritability across time, establish if the test measures the same latent trait.
      *   If the Flynn Effect is driven by changes in test-specific skills (e.g., understanding abstract symbols), then the "IQ" of 1950 and "IQ" of 2000 are different phenotypes.
      *   Comparing their heritabilities is like comparing the heritability of "running speed on grass" (1950) to "running speed on track shoes" (2000). The improvement is real, but attributing it to the same latent trait's parameters is a mistake.

  **Summary:**
  Your suspicion is correct. Heritability is blind to the Flynn Effect by construction because it models variance, not means. The "standard caution" undersells this: it's not just that heritability doesn't *license* inferences about means; it's that the statistic contains **zero information** about mean shifts. The Flynn Effect demonstrates that the environmental variance component ($V_E$) can act as a universal multiplier on the phenotype without necessarily increasing the *variance* of that component.

  The rationalist discourse often treats $h^2$ as a measure of "how genetic" a trait is. The Flynn Effect proves that a trait can be highly "genetic" (in terms of variance) and highly "environmental" (in terms of mean level) at the same time. Until the discourse accepts that these are orthogonal dimensions, the loop you described will continue.
