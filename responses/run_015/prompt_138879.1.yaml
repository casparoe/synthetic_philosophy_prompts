      The Splitter needs to blur "Harm" and "Credit."
      Example: A minority group claims their ancestor was the *sole inventor* of a safety device (Credit). The archives say it was a team. But the group says believing the ancestor did it alone is vital for their community's sense of agency against a system that erased them (Harm/Identity).
      This forces a choice between Case 1 (Identity/Harm) and Case 2 (Credit/Fact).

