answer: |-
  To determine the consistent path forward, we first need to codify the implicit principles your commission has applied in the past. Your record shows a nuanced hierarchy rather than a single blanket rule.

  ### 1. Diagnosing Your Precedents

  *   **Case 1 (Interstate/Neighborhood):** *The Harm Principle.* When the conflict involves systemic harm or marginalization, **Community Memory > Archival Intent.** The "truth" of the impact outweighs the "truth" of the engineer's memo.
  *   **Case 2 (Invention/Family):** *The Verification Principle.* When the conflict involves private credit or aggrandizement without systemic stakes, **Archives > Individual Claim.** Ledgers and corporate records correct family lore.
  *   **Case 3 (Massacre/Village):** *The Substantive Truth Principle.* When a community narrative gets the *event* wrong but the *trauma* right, **Validate the Trauma, Correct the Event.** You preserve the memorial impulse but align the specific language with the record.
  *   **Case 4 (Treaty/Tribe):** *The Pluralism Principle.* When evidence is genuinely inconclusive or rests on differing epistemologies, **Dual Marking.** Memory and Archive coexist.

  ### 2. Analysis of the New Case (Train/Depot)

  **The Facts:**
  *   **Community Claim:** The digging *caused* the depot (Causal Myth).
  *   **Archive:** The depot was pre-planned; the digging happened but was not the cause (Causal Fact).
  *   **Constraint:** State funding requires sites to be "documented."
  *   **Nuance:** The labor (digging) is documented; the reward (depot) is not.

  **The Closest Analog: Case 3 (The Massacre/Village)**
  This is your strongest precedent. In Case 3, a specific violent event (massacre) was disproven, but a broader harm (relocation) was proven. You allowed the memorialization of the harm but corrected the specific terminology.
  *   **Parallel:** In the new case, the specific causal event (digging caused depot) is disproven, but the broader labor (locals dug out a train) is proven.
  *   **Application:** You should allow the reenactment (the labor) to continue as a memorial to community effort, but you must require the plaque and script to be corrected to reflect that the depot was not the reward.

  **Why not the others?**
  *   **Not Case 1:** There is no evidence of systemic marginalization or harm being erased. This is a town origin myth, not a claim of oppression.
  *   **Not Case 2:** While this involves correcting a claim with ledgers (like the invention), Case 2 was about *credit* (who invented), whereas this is about *causality* (why the town exists). Case 3 is a better fit for community-wide narratives involving events/rituals.
  *   **Not Case 4:** The evidence is not inconclusive. The ledgers definitively show the depot was scheduled before the snowdrift.

  ### 3. The Decision for Consistency

  To remain consistent with Case 3 (and Case 2 regarding the use of ledgers), you should **approve the reenactment but mandate a revision of the narrative.**

  *   **The Reenactment:** Can continue. The payroll records document the labor. This honors the "Substantive Truth" of the community's effort.
  *   **The Script/Plaque:** Must be changed. The line "and so the railroad gave us our depot" is factually false per the ledgers. Since state money requires "documented" sites, you cannot fund a marker that asserts a disproven causal link.
  *   **The New Narrative:** Should frame the digging as an example of the town's *existing* spirit (which perhaps is *why* the railroad chose them, or simply a parallel event), rather than the *cause* of the depot.

  ### 4. Principles Adopted by Option

  If you choose the recommendation above (Correct the Narrative, Keep the Ritual), you are adopting the **Substantive Truth Principle (Case 3)**.
  *   **Rule:** *Commemoration may continue based on documented labor/experience, but specific historical causality must align with archival records when those records are definitive.*

  If you chose to **let the story stand** (Ignore the ledgers):
  *   **Rule:** *Long-standing Community Tradition > Archival Causality.* (This would contradict Case 2 and the State funding requirement).

  If you chose to **ban the reenactment** (Because the story is false):
  *   **Rule:** *Archival Accuracy > Community Ritual.* (This would contradict Case 1 and Case 3, where you allowed markers/memorials despite archival conflicts).

  ### 5. The "Splitter" Case

  To truly test the limits of your current jurisprudence, you need a case that forces a choice between **Case 1 (Harm/Memory)** and **Case 2 (Fact/Records)**. Currently, you apply Case 1 when harm is present, and Case 2 when it is not. A splitter case would introduce harm to a factual dispute about credit.

  **Hypothetical Splitter Case:**
  > A historically Black community seeks a marker for a school built in 1920. Their oral history states the community *funded and built the school themselves* because the county refused to. This story is a core pillar of their pride and resilience (Harm/Identity). However, county tax records and contractor receipts show the county paid for the construction, though Black residents did provide unpaid labor.
  >
  > **The Conflict:**
  > *   **Case 1 Principle:** Prioritize the community's memory of self-reliance against a system that often erased their contributions. (Mark it as community-built).
  > *   **Case 2 Principle:** Prioritize the financial records regarding who paid for the structure. (Mark it as county-built with community labor).
  >
  > **Why it Splits:** This forces you to decide if the *psychological truth* of resilience (Case 1) overrides the *economic truth* of funding (Case 2) when the "lie" is about agency rather than oppression. Your current record doesn't show how you weigh "Pride/Agency" against "Ledgers" when "Harm" is in the background but not the direct subject of the claim.

  ### Summary Recommendation
  **Rule:** Follow **Case 3**.
  **Action:** Fund the marker and allow the reenactment *only if* the script is amended to acknowledge the depot was pre-planned. Frame the 1887 dig as a testament to the town's character, not the cause of its infrastructure. This satisfies the State's documentation requirement, respects the archival record (Case 2), and honors the actual labor performed (Case 3).
