  ### Brainstorm Outline: Superrationality & The Variants

  *   **Core Concept (Superrationality):** In standard setups (like Platonia), superrationality assumes agents are identical reasoning machines. If I decide to cooperate, I assume you, reasoning identically, will also cooperate. My choice isn't *causing* yours, but it is *evidence* of yours. This supports cooperation in Prisoner's Dilemma-style scenarios where Causal Decision Theory (CDT) suggests defection.
  *   **Platonia Variant (Visible Tags):**
      *   *Mechanism:* Agents see "Reasoning-Depth Tags" (Level-1 to Level-n) but not choices.
      *   *Impact:* This breaks the symmetry required for classic superrationality. If I am Level-5 and you are Level-2, we are not identical. I cannot assume you will mirror my logic.
      *   *Stability:* Cooperation might fragment. High-depth agents might cooperate only with other High-depth agents, knowing Low-depth agents will defect. It turns a logical correlation problem into a sociological sorting problem.
  *   **Luring Lottery Variant (Depth Matching):**
      *   *Mechanism:* Payout depends on matching your reasoning depth to the *average depth* of entrants.
      *   *Impact:* This creates a feedback loop. My choice of depth influences the average I am trying to match.
      *   *The Conflict:* Evidential Decision Theory (EDT) says "my choice is evidence of the outcome." But here, my choice is *part of the calculation* of the outcome.
      *   *Dr. A's Stance:* This causal feedback breaks EDT. You can't treat your choice as mere evidence when you are mechanically altering the target variable.
      *   *Dr. B's Stance:* This doesn't break EDT; it exposes a hidden flaw in how we apply it (assuming independence). It forces us to acknowledge logical coupling, validating the superrational intuition but showing EDT needs to account for dynamic averages.

  ***

