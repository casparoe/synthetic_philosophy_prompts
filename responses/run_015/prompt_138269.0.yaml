  ### The Moral Equality of Combatants (MEC)

  **Status on this Account:** **Rejected.**
  Your principle yields **Asymmetric Liability**.
  *   **What replaces it:** The **Principle of Discriminate Immunity**. Combatants on the Just side have a right to fight and immunity from being fought against (by unjust combatants). Combatants on the Unjust side have no right to fight and are liable to be stopped.
  *   **What is lost:** The reciprocal right to kill. Under MEC, the Unjust soldier kills the Just soldier without moral wrong (though the war is wrong). Under your principle, the Unjust soldier *wrongs* the Just soldier by killing him. The Unjust soldier is effectively a murderer in uniform, whereas the Just soldier is a law enforcement agent in uniform.
  *   **The Cost:** This makes war morally perilous for the Unjust side. It implies that most soldiers on the Unjust side are participating in a criminal enterprise, even if they are conscripts. It removes the "clean hands" protection for the aggressor.

