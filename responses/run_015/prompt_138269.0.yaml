  ### Application to New Cases

  Running the **Principle of Asymmetric Status Liability** and **Volitional Culpability**:

  1.  **Drone Operator (Just side, kills sleeping Unjust combatant):**
      *   *Verdict:* **Permissible.**
      *   *Reasoning:* The target is a functional member of an armed group (Clause 1a), no protected status (1b), fighting for Unjust Cause (1c). Sleep does not remove membership or potential threat status.
  2.  **Fifteen-Year-Old Abducted Child Soldier (Pointing rifle):**
      *   *Verdict:* **Killable (Liability), Not Culpable.**
      *   *Reasoning:* Functional member (1a). However, international convention often grants protected status to children. If we follow *your* logic in Case 3 (Conscript), he is killable because he poses a threat and is a member. But under Volitional Culpability (2a), he is **not at fault** (coerced).
      *   *Nuance:* Your principle makes him killable, but your residual duty (Case 9) would demand extreme necessity before firing.
  3.  **Voting Civilian (Aggressor country, economic vote):**
      *   *Verdict:* **Not Killable, Minimally Culpable.**
      *   *Reasoning:* Not a functional member of an armed group (Clause 1a fails). Culpability is low (2b: epistemic access is murky; 2c: will is economic, not harmful).
  4.  **Directors of Shell Company (Case 7, knew nothing):**
      *   *Verdict:* **Not Killable, Not Culpable.**
      *   *Reasoning:* Civilians (1a fails). No knowledge (2b fails).
  5.  **Just Soldier (Executes prisoner):**
      *   *Verdict:* **Killable (by anyone), Culpable.**
      *   *Reasoning:* By committing a war crime, he forfeits his Just Cause immunity (Clause 1c). He becomes a criminal combatant. He is liable to be stopped by lethal force, even by the aggressor side (as a police action against a criminal). He is fully culpable under Principle 2.

