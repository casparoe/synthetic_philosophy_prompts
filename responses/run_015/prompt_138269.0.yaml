  ### Case 9: The Residual Duty and Epistemic Sequestration

  **Can the residual duty be made coherent?**
  **Yes.** It does not collapse, but it must shift from a **Situational Judgment** to a **Procedural Constraint**.

  *   **The Ground:** The duty is grounded in the **Presumption of Non-Culpability**. Since you (the Just soldier) cannot distinguish the Sequestered Conscript (Case 9) from the True Believer (Case 2), you must act as if the enemy *might* be non-culpable.
  *   **The Mechanism:** This does not mean you cannot shoot. It means your Rules of Engagement (ROE) must be stricter than "military necessity" alone. It mandates:
      1.  **Acceptance of Surrender:** Absolute prohibition on denying quarter.
      2.  **Proportionality:** Higher threshold for using lethal force when non-lethal incapacitation is possible.
      3.  **Post-Hoc Care:** Obligation to treat wounded enemy combatants as victims of their regime where possible.
  *   **Does it collapse due to observability?**
      *   **No.** The fault is in your assumption that the duty requires *identifying* the sequestered soldier. The duty is to treat *all* enemy combatants with the restraint owed to the sequestered one, because you cannot tell them apart.
      *   **The Collapse:** The duty collapses only if you insist on *discriminating in the moment* between Case 2 and Case 9. If you concede that you cannot, the duty becomes a blanket constraint on the Just force's conduct (e.g., "We fight to disable, not to exterminate").
      *   **Conclusion:** The distinction between sequestered and convinced does not need to be observable for the duty to hold. The *uncertainty* itself generates the duty. You owe the True Believer the same restraint you owe the Conscript, because you cannot know which is which, and the cost of error (killing a non-culpable person) is borne by the Just side.
