      *Topline:* "Sepsis Protocol Associated with Higher Mortality in Randomized Trial."
      *Subgroup:* "Sepsis Protocol Reduces Mortality Across Patient Subgroups; Overall Rate Skewed by Triage."

      *Final check on Test Case:*
      Case: RCT of a smoking cessation app. Topline: No difference in quitting. Subgroups: Split by "Logged in during week 1." (App usage is caused by the app).
      This perfectly mirrors the Sepsis logic (Mediator).
