prompt: |-
  I cover science and ideas for a national newspaper, and our numbers desk has an editor who rules on which comparison we may lead with when a study's topline and its subgroups disagree. Her record over the last three years: a public university's admissions figures, where women were admitted at a lower rate overall but the gap vanished or reversed department by department — she ruled the topline the artifact and had us lead with department-level rates; the kidney-stone trial, where the pooled success rates favor one procedure and the ranking flips inside both the small-stone and large-stone groups — same ruling, stratify by size; a randomized trial of two antihypertensives, where she let us lead with effects estimated within baseline-risk quartiles rather than the single overall average, saying there was nothing wrong with cutting a randomized comparison on a variable fixed before randomization; an observational study of two stroke treatments that divided patients by disability grade at discharge, where she refused the split because the grade is written after the outcome we were reporting; and a comparison of two chemotherapy regimens split into molecular subtypes whose smallest cell held nine patients, where she refused the split and ran the topline.

  The case now on her desk: a large randomized trial of an escalation protocol for suspected sepsis on general wards. Topline 90-day mortality is 21% under the new protocol versus 18% under usual care. But patients are also classified by whether they were moved to a high-dependency bed within 24 hours, which the protocol itself makes far more likely — 48% of the protocol group versus 25% of the usual-care group — and within both the moved group (34% versus 39%) and the not-moved group (9% versus 11%) the new protocol looks better, with thousands of patients in every cell. The journal's abstract calls the topline an artifact of Simpson's paradox and concludes the protocol saves lives; the trial's statistician replies that the topline is the only number the randomization licenses and that the within-stratum comparison is not a comparison of like with like.

  What will she rule, and which of her own rulings is the closest analog? More useful to me: the two or three rules her record is equally consistent with — cut as finely as the data allow provided the cut is fixed before outcomes are known and the cells are big enough; cut only on variables that lie upstream of the treatment; something else — what each predicts here, which one you think she is actually running and why, and the single further case I could bring her that would separate them. Give me too the sentence we would print under each ruling, since that is the only part readers will see.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Science/Ideas reporter for a national newspaper.
      *   **Subject:** A numbers desk editor who decides how to report conflicting topline vs. subgroup data in studies.
      *   **Task:** Predict her ruling on a new case (sepsis trial), identify the closest analog from her past record, deduce the underlying rules/principles she follows, predict the headline sentence for each rule, and propose a test case to distinguish between the rules.
      *   **Constraints:** Needs to be precise, analytical, and journalistic in tone.

  2.  **Analyze the Editor's Past Record (The Precedents):**
      *   *Case 1 (University Admissions):* Topline showed bias against women; subgroups (departments) showed no bias/reversed. *Ruling:* Lead with subgroups. (Simpson's Paradox recognized; confounding variable = department choice).
      *   *Case 2 (Kidney Stones):* Topline favored Procedure A; subgroups (stone size) favored Procedure B. *Ruling:* Lead with subgroups. (Simpson's Paradox recognized; confounding variable = stone size, likely associated with treatment choice).
      *   *Case 3 (Antihypertensives RCT):* Topline average vs. Baseline-risk quartiles. *Ruling:* Lead with subgroups. *Reasoning:* Variable (baseline risk) fixed *before* randomization.
      *   *Case 4 (Stroke Treatments Observational):* Split by disability grade at discharge. *Ruling:* Refused split. *Reasoning:* Grade written *after* outcome (post-treatment variable/collider bias).
      *   *Case 5 (Chemo Subtypes):* Split by molecular subtypes, smallest cell $n=9$. *Ruling:* Refused split. *Reasoning:* Sample size too small (unreliable).

  3.  **Analyze the Current Case (Sepsis Trial):**
      *   *Study Type:* Large Randomized Controlled Trial (RCT).
      *   *Topline:* New Protocol (21% mortality) vs. Usual Care (18% mortality). *Protocol looks worse.*
      *   *Subgroups:* Moved to High-Dependency (HD) bed within 24h vs. Not Moved.
          *   Moved: Protocol (34%) vs. Care (39%). *Protocol looks better.*
          *   Not Moved: Protocol (9%) vs. Care (11%). *Protocol looks better.*
      *   *Mechanism:* The protocol *causes* more moves to HD beds (48% vs 25%).
      *   *Conflict:* Topline says Protocol harms; Subgroups say Protocol helps. Journal claims Simpson's Paradox. Statistician says Topline is the only valid causal estimate.
      *   *Key Variable:* "Moved to HD bed within 24 hours."
      *   *Timing:* This happens *after* randomization and *after* treatment initiation (the protocol influences the move). It is a *post-treatment* variable (mediator/collider).

  4.  **Determine the Editor's Likely Ruling:**
      *   *Comparison to Precedents:*
          *   Like Case 1 & 2 (Simpson's Paradox)? Superficially, yes. The math looks identical.
          *   Like Case 3 (Baseline Risk)? No. Baseline risk was *pre*-randomization. HD Bed move is *post*-randomization (influenced by the protocol).
          *   Like Case 4 (Stroke/Disability Grade)? **Yes.** In Case 4, she rejected the split because the variable was determined *after* the outcome/treatment. Here, the HD bed move is determined *after* randomization and is *affected* by the treatment (protocol makes moves more likely).
          *   Like Case 5 (Small Cells)? No, cells are large ("thousands of patients").
      *   *Causal Inference Logic:* In an RCT, the topline intention-to-treat (ITT) analysis preserves randomization. Conditioning on a post-treatment variable (like moving to HD) breaks randomization within strata. The protocol group has more sick people moved to HD *because* of the protocol. Comparing Protocol-HD to Care-HD is comparing sicker patients to sicker patients, but the selection mechanism differs. This is classic "collider bias" or "mediator bias." The statistician is right: the topline is the causal effect. The journal is wrong to call it a simple Simpson's artifact that should be ignored; it's a causal structure issue.
      *   *Editor's Pattern:* She cares about *when* the stratifying variable is determined relative to treatment/outcome. (Case 3 vs. Case 4).
      *   *Prediction:* She will rule for the **Topline**. She will reject the subgroup analysis because the stratification variable (HD bed move) is a consequence of the treatment, not a baseline characteristic.
      *   *Closest Analog:* Case 4 (Stroke/Disability Grade). Both involve splitting on a variable determined after treatment/outcome onset.

  5.  **Deduce the Underlying Rules:**
      *   *Rule A (The "Data Granularity" Rule):* Cut as finely as possible if pre-outcome and $n$ is large. (Predicts: Subgroups).
      *   *Rule B (The "Causal Order" Rule):* Cut only on variables upstream of treatment (pre-randomization/baseline). Do not cut on mediators or post-treatment variables. (Predicts: Topline).
      *   *Rule C (The "Simpson's Universal" Rule):* If subgroups reverse the topline, always trust subgroups *unless* $n$ is small. (Predicts: Subgroups).
      *   *Assessment:* Her record supports Rule B most strongly. Case 3 (allowed pre-randomization) vs. Case 4 (rejected post-outcome). Case 1 & 2 were observational (no randomization), so baseline characteristics (department, stone size) were effectively pre-treatment confounders, making subgroups valid. Case 5 was about power ($n$).
      *   *Actual Operating Principle:* **"Stratify only on pre-treatment covariates; never on post-treatment mediators."**

  6.  **Draft the Headline Sentences:**
      *   *If Topline (Her likely ruling):* "New sepsis protocol linked to higher mortality in large randomized trial, despite apparent benefits within transfer subgroups."
      *   *If Subgroups (Journal's claim):* "Sepsis protocol reduces mortality across all patient types; overall death rate skewed by triage differences."

  7.  **Design the Test Case:**
      *   Need to distinguish between "Pre-treatment only" (Rule B) and "Simpson's always wins" (Rule C) or "Post-outcome only" (nuance of Rule B).
      *   *Idea:* A randomized trial where a subgroup analysis reverses the topline, based on a variable that is *measured* before treatment but *influenced* by prior knowledge or is a collider.
      *   *Better Idea:* Distinguish between "Post-Treatment" vs "Post-Outcome". In Case 4, she rejected "disability grade at discharge" (Post-Outcome). In the Sepsis case, "HD Bed Move" is Post-Treatment but Pre-Outcome (mostly).
      *   *Refined Test Case:* A randomized trial of a drug where patients are split by *adherence* (did they take the pill?). Adherence happens after randomization (Post-Treatment) but before Outcome.
      *   *Why:* If she follows "Causal Order/Randomization Integrity," she must reject adherence splits (per-protocol analysis often biases ITT). If she follows "Simpson's Reversal = Truth," she might accept it if the numbers flip.
      *   *Alternative Test Case:* A variable measured at baseline that is *unaffected* by treatment but reveals a reversal. (She already did this in Case 3).
      *   *Best Test Case:* A randomized trial where the split is on a variable *measured* at baseline but known to be a *collider* (e.g., splitting on a symptom that is caused by two different underlying conditions).
      *   *Actually, the clearest distinction is between Post-Treatment vs. Pre-Treatment.*
      *   *Proposed Test:* A randomized trial of a diet. Topline: No weight loss. Subgroup: Split by "Self-reported compliance at week 2." Compliers lose weight, non-compliers gain.
      *   *Reasoning:* Compliance is post-randomization. If she rejects it, she prioritizes randomization integrity (Rule B). If she accepts it, she prioritizes "real world" effect or Simpson's resolution (Rule A/C).
      *   *Wait, let's look closer at Case 4.* Case 4 was "disability grade at discharge." That is post-outcome. The Sepsis case is "HD bed within 24h." Mortality is 90-day. So HD bed is *interim*. It is a mediator.
      *   *To distinguish Rule B (Upstream of Treatment) from a rule that allows Interim variables:* We need a case where the variable is *after* treatment start but *before* outcome, and creates a Simpson's reversal.
      *   *Test Case:* A randomized trial of a vaccine. Topline: Infection rates equal. Subgroups: Split by "Developed mild fever after shot." Those with fever had lower infection rates; those without had higher. (Fever is caused by vaccine).
      *   *Prediction:* If she rules "No split," she protects randomization (Rule B). If she rules "Split," she chases the mechanism (Rule A).
      *   *Actually, the prompt asks for a case to separate the rules I identified.*
      *   *Rule 1:* Cut on pre-treatment variables only.
      *   *Rule 2:* Cut on any variable fixed before the *outcome* is known (allows interim mediators).
      *   *Test Case:* Randomized trial. Split by an interim biomarker changed by the drug.
      *   *Let's refine the "Test Case" to be very sharp.*
      *   *Case:* Randomized trial of Drug X. Topline: No effect on Heart Attack. Subgroup: Split by "Blood Pressure at Month 1." Drug lowers BP. Low BP group has fewer heart attacks. High BP group has more. Drug looks good in both.
      *   *Why:* BP at Month 1 is Post-Treatment. If she allows it, she follows "Fixed before outcome." If she rejects it, she follows "Fixed before treatment."

  8.  **Synthesize and Refine:**
      *   *Ruling:* Topline.
      *   *Analog:* Stroke/Disability Grade (Case 4). Both involve conditioning on a post-treatment event.
      *   *Rules:*
          1.  *The "Baseline Integrity" Rule:* Only stratify on variables determined before randomization. (Predicts Topline).
          2.  *The "Pre-Outcome" Rule:* Stratify on any variable determined before the primary outcome, provided $n$ is sufficient. (Predicts Subgroups).
          3.  *The "Simpson's Override" Rule:* If subgroups reverse the topline, subgroups win unless $n$ is small. (Predicts Subgroups).
      *   *Her Actual Rule:* Baseline Integrity. She distinguishes Case 3 (Baseline Risk = OK) from Case 4 (Discharge Grade = Not OK). The Sepsis case is like Case 4 (Post-treatment mediator).
      *   *Headline:* Needs to be neutral but reflect the ruling.
      *   *Test Case:* Needs to pit "Baseline" against "Pre-Outcome Interim."

  9.  **Drafting the Response:**
      *   *Tone:* Professional, analytical, respecting the editor's expertise.
      *   *Structure:*
          1.  The Ruling & Analog.
          2.  The Competing Rules (and their predictions).
          3.  The Actual Rule (and why).
          4.  The Headlines.
          5.  The Test Case.

      *(Self-Correction during drafting)*: Make sure to clearly explain *why* the statistician is right about the sepsis trial (collider bias/mediator bias) so the editor's decision is grounded in statistical truth, not just precedent. The "HD Bed" is a *mediator*. The protocol *causes* the bed move. Conditioning on a mediator blocks the path of the treatment effect or introduces bias if there are unmeasured confounders of the mediator-outcome relationship. In this specific Simpson's setup, the protocol moves *healthier* patients to HD beds than the usual care does (because usual care only moves the very sickest). So Protocol-HD looks better than Care-HD because Care-HD is much sicker. This is why the topline (ITT) is the only unbiased estimate. The editor should know this distinction.

      *Refining the Analog:* Case 4 is the closest. In Case 4, discharge grade is post-outcome. In Sepsis, HD bed is post-treatment/pre-outcome. However, the principle is "Do not condition on variables affected by the intervention." Case 4 is "affected by outcome/treatment." Case 3 is "unaffected by treatment." The Sepsis variable is "affected by treatment." So Case 3 vs Case 4 is the key tension. Case 4 is the closer analog in terms of *rejection*.

      *Refining the Test Case:* To distinguish "Upstream of Treatment" vs "Upstream of Outcome."
      *   *Scenario:* RCT of a drug. Split by "Side effects experienced in week 1." (Post-treatment, Pre-outcome).
      *   *If she rejects:* She follows "Upstream of Treatment."
      *   *If she accepts:* She follows "Upstream of Outcome."

      *Let's write.*

      *Wait, one nuance:* In Case 1 & 2 (Observational), she allowed subgroups. In Observational studies, there is no randomization to protect. So "Upstream of Treatment" is the goal to remove confounding. In RCTs (Case 3, 5, Sepsis), Randomization is the shield. Breaking it (Case Sepsis) is bad. Keeping it (Case 3) is good.
      So the rule is: **In RCTs, stratify only on baseline covariates. In Observational, stratify on confounders.**
      The Sepsis case is an RCT. The variable is not baseline. Therefore, reject.

