answer: |-
  You have hit on the exact nerve that keeps philosophers of probability up at night. You aren't misreading Lewis; you're encountering the boundary where his principle hands the baton back to standard Bayesian reasoning.

  Here is the conceptual knot untangled: You are conflating updating your belief about the **outcome** with updating your belief about the **chance hypothesis**.

  The Principal Principle (PP) is not a rule for figuring out what the chances are. It is a rule for what to believe *once you think you already know* what the chances are. It says: "If you know the objective chance is $x$, and your other evidence is admissible, your credence must be $x$."

  In your quantum casino scenario, the tension dissolves if you separate the process into two distinct steps.

  **Step 1: Updating the Chance Hypothesis (Bayes)**
  When the player sees ten heads in a row, they are not just seeing an outcome; they are receiving evidence about the machine itself. Even with Hamiltonians on the wall, no human is 100% certain the wall isn't lying or the machine isn't broken.
  So, the player uses Bayes's rule to update their confidence in the hypothesis "The chance is 50%." Ten heads makes the hypothesis "The chance is 90%" look much better than it did before. The player's belief *that the machine is fair* drops.

  **Step 2: Applying the Principal Principle**
  Now, the player asks: "What should I believe about the eleventh pull?"
  The Principal Principle only kicks in *after* Step 1 is settled.
  *   If the player decides, "No, I trust the Hamiltonian completely; the chance is definitely 50%," then the PP applies. The evidence (10 heads) is considered "admissible" but irrelevant because the chance screens off the past. The credence stays at 50%. To think otherwise is the Gambler's Fallacy.
  *   If the player decides, "This streak is too weird; the chance is probably not 50% anymore," then the PP *does not force them to stay at 50%*. Why? Because the evidence (10 heads) is now **inadmissible** relative to the old chance hypothesis.

  **The Role of Admissibility**
  This is the escape hatch you were looking for. Lewis defines "admissible" evidence roughly as information that doesn't give you insight into the outcome *except* through the chance.
  *   If you know the chance is fixed at 50%, past heads are admissible (they don't change the future chance).
  *   If you are unsure about the chance, past heads are **inadmissible** relative to the "50% chance" hypothesis because they tell you the hypothesis might be false.

  Because the evidence undermines the chance value itself, the condition for the Principal Principle isn't met. You are no longer in the context of "Given the chance is 50%..." You are in the context of "Given what I know about the machine..."

  **The Resolution**
  The Principal Principle does not tell you to ignore the data. It tells you to separate your doubt about luck from your doubt about the mechanism.
  *   If you doubt the luck (think the streak matters), you must admit you doubt the mechanism (the chance isn't 50%).
  *   If you are certain of the mechanism (the chance is 50%), you must admit the streak is just luck.

  You cannot have it both ways. The PP forces you to choose: either the Hamiltonian is right and you ignore the streak, or the streak is real evidence and the Hamiltonian (or your trust in it) needs updating. The principle doesn't ban updating; it just bans updating your credence *while pretending* the chance is fixed.

  So, in your feature, the takeaway is this: The Principal Principle isn't a straitjacket that forbids learning from experience. It's a mirror. It reflects back whether you truly believe the chance is known, or whether you're just pretending it is.
