answer: |-
  Here is the reconstruction you asked for. I am committing to a single thesis rather than surveying the literature.

  ### The Implicit Theory: Polity Maintenance via Conventionalized Membership

  The global patchwork does not presuppose a moral theory of justice (like "affected interests" or "subjection to coercion"). It presupposes a functional theory of **Polity Maintenance**.

  The core axiom is this: **The vote is not a human right derived from moral status, but a function of office within a specific, bounded legal community.**

  The rules are not designed to maximize moral accuracy (ensuring everyone affected gets a say); they are designed to minimize boundary disputes and maintain a stable, identifiable *demos* capable of making binding decisions. The system prioritizes **clarity of the boundary** over **precision of representation**.

  Here is how this reconstruction explains the mess:

  1.  **Citizenship/Residency (The Boundary):** This is the primary filter. It is not about who is *affected* (expats often aren't) or who is *coerced* (tourists are). It is about who belongs to the "club" that is making the decision. New Zealand letting permanent residents vote and the EU letting member-state citizens vote locally are not exceptions to this; they are expansions of the definition of "member" to reflect integrated communities. The UK Commonwealth rule is a historical artifact of a former imperial "club."
  2.  **Age (The Administrative Proxy):** The variance (16 vs. 18 vs. 25) proves that competence is not being measured morally; it is being administered bureaucratically. A test would be too costly and open to manipulation. An age cutoff is a "conventionalized proxy" for socialization into the community. 18 is the global norm because it aligns with the end of secondary schooling and legal adulthood, not because 17-year-olds lack moral capacity.
  3.  **Expats (The Membership Tether):** Long-term expats keep the vote because citizenship is a status, not a residency permit. Under Polity Maintenance, severing the vote creates a class of disenfranchised nationals who may return, destabilizing the polity. It prioritizes the integrity of the *citizen roll* over the "affected interests" principle.
  4.  **Prisoners (The Forfeiture Clause):** Inconsistent bans on prisoners exist because some states view the vote as a right of the *law-abiding member*, while others view it as inherent to the *person*. Under Polity Maintenance, disenfranchisement is a tool to mark the boundary of "good standing" within the community.

  ### Compulsory Voting: Duty vs. Right

  You asked if compulsion commits you to something extra. **Yes.**

  Compulsory voting (Australia, Belgium, Brazil) explicitly rejects the "vote as a liberty" model. It treats the vote as a **civic function**, akin to jury duty or taxation.
  *   **The Theory:** If the vote is a function of office within the polity, then participating in the selection of officers is a duty owed to the maintenance of that polity.
  *   **Attendance vs. Valid Vote:** The distinction matters. Australia requires attendance (getting your name crossed off) but not a valid ballot (you can spoil it). This confirms the theory: the duty is to **engage with the system**, not to **decide correctly**. It legitimizes the outcome by ensuring high turnout, stabilizing the polity, without coercing political preference. This is fully consistent with "Polity Maintenance" but inconsistent with "Vote as Individual Liberty."

  ### The "Kids and Future Generations" Trap

  You asked: *If stake or affectedness is the principle, doesn't it commit you to giving parents extra proxy votes... and if the practice's own logic commits you to that and everyone rejects it anyway, what does that tell you about the logic?*

  This is the strongest evidence for my reconstruction.
  *   **The Logic:** If the "All Affected Interests" principle were the operating theory, we **must** give children proxy votes (via parents) and somehow represent future generations.
  *   **The Practice:** No stable democracy does this.
  *   **The Conclusion:** The practice **rejects** the "Affected Interests" theory. The fact that we reject proxy votes proves that the vote is not about representing *interests*; it is about exercising *agency* as an autonomous member. Children are excluded not because they have no interests, but because they are not yet **autonomous members**.
  *   **Implication:** The system values the *act of voting by an autonomous agent* over the *accurate representation of affected stakes*. This confirms the "Conventionalized Membership" theory: you must be a full legal person (autonomous) within the club to hold the office of voter.

  ### The Single Hardest Rule to Defend

  **Indefinite Expatriate Voting.**

  *   **Why:** It is the rule that most violently contradicts the other operating principles.
      *   It violates **Subjection to Law**: Expats often live outside the legal coercion of the state they vote in.
      *   It violates **Affected Interests**: Their daily lives are often more affected by their host country.
      *   It strains **Membership**: If membership implies "shared fate," decades of absence severs that fate.
      *   It contradicts **Polity Maintenance**: It allows people to shape a society they do not inhabit, potentially creating policy misalignment (e.g., voting for wars or taxes they won't experience).
  *   **Defense:** The only defense is "Citizenship is Perpetual." But if citizenship is about membership in a functioning community, indefinite absenteeism turns it into a dynastic privilege rather than a participatory status. It is the point where the "Club" model breaks down into "Bloodline" model, which is inconsistent with the rest of the democratic package.

  ### Confidence and Falsification

  **Confidence Levels:**
  *   **High Confidence:** That "Affected Interests" is *not* the operating theory (proven by the exclusion of children/future gens).
  *   **High Confidence:** That "Conventionalized Membership" is the dominant descriptive logic (explains citizenship/residency/age proxies).
  *   **Medium Confidence:** That Compulsion is purely about systemic stability rather than a moral duty to vote *correctly*.
  *   **Guessing:** On the UAE (age 25). This is likely an authoritarian stability measure rather than a democratic variation, but it fits the "State-Defined Capacity" aspect of the theory.

  **What Would Change My Mind:**
  1.  **Competence Testing:** If a liberal democracy introduced a literacy or civic knowledge test for voting (beyond basic registration), it would shift the theory from "Membership" to "Competence." (Note: Historical tests were used for exclusion, but a genuine, universal competence test would change the theoretical landscape).
  2.  **Tourist Voting:** If a country allowed short-term visitors (tourists/business travelers) to vote in national elections, it would prove the "Subjection to Law/Coercion" theory trumps "Membership."
  3.  **Proxy Votes for Children:** If a major democracy introduced "demyeny voting" (parents voting on behalf of minor children), it would confirm that "Affected Interests" is the true underlying logic, and my "Autonomous Membership" reconstruction is wrong.

  ### Summary
  The mess is not random; it is a **functional compromise**. It sacrifices moral consistency (excluding affected children, including unaffected expats) to maintain a clear, stable, and administrable list of decision-makers. The theory is **Polity Maintenance**: the rules exist to keep the state functioning, not to satisfy political philosophy.
