answer: |-
  Here's a run-sheet for the workshop. It's designed to be printed and handed out (minus the instructor notes). The goal isn't to have them "win," but to hit the friction points where memory stops being about truth and starts being about survival.

  **Workshop Title:** The Mnemosyne Grant
  **Time:** 75 Minutes
  **Materials:** 4 Role Cards (below), 1 large sheet of paper per group, markers, "Archival Access Tokens" (can be index cards or just a tally on the board).

  ---

  ### PART 1: THE SETUP (10 Mins)

  **Instructor Script:**
  "Okay, we know *Vergangenheitsbewältigung*. We know the textbook definition. But often we treat it like a moral choice—like Germany 'chose' to remember and Japan 'chose' to forget. Today we're testing the idea that memory is structural. It's about what the state *needs* the past to do in the present.

  You are four neighborhood councils in the city of Mnemosyne. The city just survived 'The Unrest' (a vague civil conflict 20 years ago). An International NGO has offered a **Reconciliation Grant**. It's huge money for infrastructure, but it comes with a condition: You must co-author a **3-Clause Memorial Statement** to be engraved on the central plaza monument.

  **The Rules:**
  1. You have 25 minutes to negotiate the text.
  2. All 4 groups must sign the final 3 clauses.
  3. If you agree: The Grant is awarded.
  4. If you disagree: The Grant Committee splits the money equally (no one gets the big project).
  5. **Individual Goal:** Each of you has a hidden agenda on your role card. If your specific clause requirement is met, you earn an **Archival Access Token**. You need these tokens for your final paper proposal later in the semester. If you compromise your agenda to help the group, you don't get the token.

  *Note: Do not show your role card to other groups. You can lie, bluff, or withhold info.*"

  ---

  ### PART 2: THE ROLE CARDS (Hand these out randomly)

  **GROUP 1: The Northern District (Germany Analog)**
  *Public Stance:* We demand justice and transparency. The state must own its crimes.
  *Hidden Incentive:* Many survivors here rely on state pensions linked to official victim status.
  *Requirement:* Clause 1 MUST use the word **"Systematic"** to describe the violence.
  *Why:* Without the word "Systematic," the violence looks like random crime, and pension claims are rejected.
  *Risk:* If you agree to vague language, your constituents lose financial security.

  **GROUP 2: The Eastern District (Japan Analog)**
  *Public Stance:* We want peace and future cooperation. Dwelling on blame helps no one.
  *Hidden Incentive:* Your local cultural center is funded by wealthy diaspora donors living abroad.
  *Requirement:* Clause 1 MUST NOT mention **"External Aggression"** or name specific perpetrators.
  *Why:* If the memorial blames "outsiders" or specific units, the donors will pull funding, viewing it as divisive nationalism.
  *Risk:* If you allow specific blame, your funding dries up.

  **GROUP 3: The Western District (Turkey Analog)**
  *Public Stance:* We are all one people. The conflict was a tragedy for everyone.
  *Hidden Incentive:* A separatist movement is active in your area. The state is fragile.
  *Requirement:* Clause 2 MUST frame the victims as **"Casualties of Civil Strife"** rather than "Targets of Persecution."
  *Why:* "Persecution" implies the state targeted a specific group, which validates the separatists' claim for independence. "Strife" implies everyone fought everyone.
  *Risk:* If you admit state persecution, the central government may revoke your local autonomy.

  **GROUP 4: The Southern District (US South Analog)**
  *Public Stance:* We honor our heritage and traditions. We look forward to tourism and growth.
  *Hidden Incentive:* Your economy relies on "Heritage Tourism." People come to see the 'old ways.'
  *Requirement:* Clause 3 MUST include the phrase **"Shared Heritage"** or **"Complex Legacy."**
  *Why:* If the memorial is too dark or accusatory, tourists stop coming. They want nostalgia, not guilt.
  *Risk:* If the tone is too somber, local businesses fail.

  ---

  ### PART 3: THE NEGOTIATION (25 Mins)

  **Instructor Role:**
  Walk around. If they are agreeing too fast, play the "Grant Committee."
  *Intervention:* "Committee Note: Clause 2 is too vague. We need to know who suffered. Clarify or we reject."
  *Intervention:* "Committee Note: You're running out of time. Remember, without a signed text, there is no monument."

  **The Hidden Rule (Instructor Eyes Only):**
  If they *fail* to agree in 25 mins: Tell them the money is split equally, **BUT** no one gets the Archival Access Token. (This simulates how state instability wipes out everyone's legitimacy, even if they get cash).
  If they *succeed*: Count who met their hidden requirement. Usually, 1 or 2 groups will have to sacrifice their token for the group to function. Highlight this.

  ---

  ### PART 4: THE DEBRIEF (30 Mins)

  *Don't start by asking how they felt. Start with the text.*

  **1. The Autopsy (5 mins)**
  Write their final 3 clauses on the board.
  *   Did they use the word "Systematic"? (Group 1 win/loss)
  *   Did they name perpetrators? (Group 2 win/loss)
  *   Is it "Strife" or "Persecution"? (Group 3 win/loss)
  *   Is there "Heritage" language? (Group 4 win/loss)

  Ask: "Who had to lie to get this signed? Who lost their Token?"

  **2. Mapping the Deadlock (15 mins)**
  This is where you connect the game to the theory.

  *   **To Group 1 (Germany):** "You needed 'Systematic.' In real life, this isn't just guilt. It's the *Rechtsstaat* (legal state). The German state derives legitimacy from opposing its past self. If you remove 'Systematic,' the constitution loses its anchor. It's not an attitude; it's architecture."
  *   **To Group 2 (Japan):** "You needed silence on 'Aggression.' This isn't ignorance. It's the **San Francisco System**. Post-war Japan traded historical ambiguity for US security guarantees and economic growth. Silence was the price of reconstruction."
  *   **To Group 3 (Turkey):** "You needed 'Strife' not 'Persecution.' This is the **Kemalist legacy**. Acknowledging specific ethnic persecution (like the Armenians or Kurds) threatens the unitary nature of the state. Denial is a security strategy, not just a lie."
  *   **To Group 4 (US South):** "You needed 'Heritage.' This is **Marketized Memory**. In the US, memory is often privatized. If the narrative hurts the brand (tourism, property values), the market corrects it. The 'Lost Cause' survived because it was profitable."

  **The Point:** "You couldn't build one framework because 'Justice' means 'Pensions' to Group 1, 'Funding Stability' to Group 2, 'State Survival' to Group 3, and 'Revenue' to Group 4. Comparing them fails if you just look at 'how much they remember.' You have to look at **what the memory is for**."

  **3. The Missing Weight (5 mins)**
  "Here's what this game couldn't do. You negotiated for Tokens. Real communities negotiate for ghosts. You didn't feel the intergenerational trauma, the shame, or the rage. You were rational actors. In reality, memory politics is often deeply irrational because the past isn't dead—it's not even past. Don't leave here thinking this is just a puzzle. It's a wound."

  **4. Wrap (5 mins)**
  Collect the Tokens. Assign the reflection: "Write 300 words on which Group's constraint you think is the hardest to overcome structurally, not morally."

  ---

  ### INSTRUCTOR NOTES: WHAT WILL GO WRONG

  **1. The "Nice" Compromise**
  Grad students are polite. They might draft: *"We acknowledge complex systematic strife regarding our shared heritage."* (Word salad that satisfies everyone).
  *   **Fix:** Be the Grant Committee. Reject it. "This is meaningless. Be specific." Force them to choose. If they refuse to choose, trigger the "No Agreement" penalty.

  **2. The Dominant Group**
  Usually, the "Germany" group (Group 1) tends to dominate because their moral language is the "correct" academic language. They might bully Group 4.
  *   **Fix:** Remind Group 1 that if Group 4 walks away, *no one* gets the Grant. Structural interdependence forces them to listen to the 'bad' actors.

  **3. Running Out of Time**
  25 minutes is tight. They might panic.
  *   **Fix:** If they panic and sign without reading, call it out in the debrief. "You signed a document you didn't read? That's exactly how state treaties work."

  **4. The Token Confusion**
  They might forget about the Archival Access Tokens.
  *   **Fix:** Write "TOKENS = FINAL PAPER CREDIT" on the board. Make it sting a little.

  **5. Typo/Logistics**
  Make sure you actually have the tokens ready. If you forget, just tally on the board, but physical cards work better for the 'economy' vibe. Also, watch the clock—don't let the negotiation bleed into the debrief. The frustration of the time limit is part of the data.

  Good luck. Hope it breaks their brains a bit.
