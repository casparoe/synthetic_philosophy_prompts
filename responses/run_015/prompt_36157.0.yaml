answer: |-
  This is a sharp framing. Your professor is right: the boundary problem (*qui judicabit ipsos judices?* — who will judge the judges themselves?) is often treated as a pre-political given rather than a political question. Brexit is indeed the perfect stress test because it was a vote *about* the boundary that simultaneously *enacted* a boundary.

  Here is an analysis of the 2016 referendum through the lens of the boundary problem, structured by the mapping direction (theory to case) and the reverse direction (case to theory).

  ### I. The Mapping Direction: Principles vs. The Actual Franchise

  The actual franchise was defined by the EU Referendum Act 2015. It largely mirrored the Westminster parliamentary franchise: British, Irish, and Commonwealth citizens resident in the UK; British citizens abroad for less than 15 years; members of the House of Lords. It excluded EU citizens (non-Commonwealth) resident in the UK, UK citizens abroad for more than 15 years, and anyone under 18.

  Here is how standard democratic principles map onto that specific decision, and where they fracture.

  **1. The All-Affected Interests Principle (AAI)**
  *   **The Theory:** Anyone whose interests are significantly affected by the decision should have a say.
  *   **The Brexit Application:** This principle explodes the boundary immediately. If the decision concerns trade tariffs, regulatory alignment, and security cooperation, the "affected" include not just UK residents, but EU citizens, UK expats in the EU, and potentially global traders.
  *   **The Mismatch:** The actual franchise excluded 3.5 million EU citizens living in the UK whose residency rights were the direct subject of the vote. It also excluded 1.3 million UK expats (mostly in the EU) who faced immediate loss of rights.
  *   **The Theoretical Glitch:** As you noted, AAI becomes unmanageable here. Does a German manufacturer affected by supply chain friction get a vote? Does a Calais resident affected by border delays? If you follow AAI strictly, the "demos" for Brexit becomes transnational, potentially requiring a pan-European referendum. The fact that AAI yields a result that contradicts the premise of a *national* referendum suggests that AAI is incompatible with the Westphalian unit in which the vote was held.

  **2. The All-Subjected Principle (ASP)**
  *   **The Theory:** Anyone subject to the coercive authority of the state making the decision should vote.
  *   **The Brexit Application:** This is where your Latvian nurse vs. Australian student contradiction bites hardest.
      *   *The Latvian Nurse:* She was subject to UK law, paid UK taxes, and used UK services. Under ASP, she should vote. She was excluded.
      *   *The Australian Student:* As a Commonwealth citizen, she could vote. But was she "subjected" in the same way? If she was on a temporary visa, her long-term subjection was tenuous.
      *   *The British Expat in Spain:* He was no longer subject to UK coercive authority (he didn't pay UK taxes, wasn't policed by UK law), yet he retained the vote.
  *   **The Mismatch:** The actual franchise followed *nationality* (allegiance to the Crown) rather than *subjection* (residence under law). ASP would have enfranchised the Latvian nurse and disenfranchised the British expat in Spain. The fact that the UK government chose nationality over subjection reveals that the "demos" was defined as an ethno-cultural community rather than a community of law.

  **3. The Stakeholder / Membership Principle**
  *   **The Theory:** Voting rights belong to those with a permanent "stake" in the community's future, often defined by duration or citizenship.
  *   **The Brexit Application:** This attempts to justify the exclusion of the Australian student (temporary stake) and the inclusion of the British expat (permanent cultural stake).
  *   **The Mismatch:** This principle struggles with the 15-year rule for expats. Why does a stake evaporate after 15 years? More critically, it fails to account for the *type* of stake. The "stake" of a 16-year-old in Scotland (whose entire economic future was tied to EU membership) was arguably higher than a British retiree in Florida voting on nostalgia.
  *   **The Theoretical Glitch:** "Stake" is retroactively defined. We only know who had a stake after the vote changes things.

  **4. Competence and Duration-of-Residence**
  *   **The Theory:** Voters need sufficient knowledge or integration to vote responsibly.
  *   **The Brexit Application:** This is the standard defense for excluding 16- and 17-year-olds (who were allowed to vote in the Scottish Independence referendum but not here).
  *   **The Mismatch:** If competence was the bar, why was the franchise borrowed from General Elections? There is no evidence that parliamentary competence translates to constitutional/geostrategic competence. This principle was applied inconsistently: Scottish 16-year-olds were deemed competent for independence but not for the EU.

  **Summary of Mapping:** No single principle generates the actual electorate. The actual franchise was a hybrid that prioritized *citizenship status* (Commonwealth/UK) over *residence* (excluding EU nationals) and *subjection* (including expats). It was a "national" demos voting on a "supranational" boundary.

  ### II. The Reverse Direction: What the Episode Reveals About Theory

  If we look from the case back to the theory, Brexit suggests three uncomfortable conclusions about the boundary problem.

  **1. The "Administrative Default" is a Political Choice**
  You asked if Westminster just paused to think. The evidence suggests they did pause, and chose the path of least resistance. The government explicitly rejected extending the vote to EU citizens or 16-year-olds to avoid "complicating" the franchise.
  *   **Theoretical Implication:** This supports the critique that in moments of constitutional crisis, democracies retreat to the *institutional* boundary rather than the *normative* boundary. The "demos" wasn't derived from democratic theory; it was derived from the Electoral Roll. This validates your professor's point: the boundary problem is ignored in practice because solving it requires re-founding the political community, which is too costly. The "lazy administrative default" *is* the principled defense: stability of procedure trumps accuracy of representation.

  **2. The Paradox of Self-Determination**
  Brexit exposes a recursive paradox in democratic theory. To decide who belongs to the demos (the boundary), you need a demos to vote on it.
  *   **The Case:** The vote was about "taking back control" of the border (who enters the demos). But the border of the *voters* was fixed prior to the vote.
  *   **Theoretical Implication:** This suggests the boundary problem is not just unresolvable in practice, but logically prior to democracy. You cannot democratically decide the democratic boundary. Someone (in this case, Parliament) must decide *ex ante*. Brexit proves that the "demos" is always a pre-democratic construct, usually based on existing state power rather than moral right. The "Will of the People" was therefore a fiction; it was the "Will of the Statutorily Defined Electorate."

  **3. Where the Theories Go Silent**
  You asked to identify where theories fail to speak. Brexit highlights two massive silences:

  *   **Future Generations:** This is the most glaring theoretical gap. A 70-year-old voter and a 17-year-old non-voter had radically different time horizons. The decision was structurally biased toward the present population at the expense of the future population. Democratic theory has no mechanism for weighting votes by "time to live under the outcome." The boundary is spatial (who is here now), not temporal.
  *   **The Northern Ireland / Good Friday Agreement (GFA) Problem:** This is the specific failure of the "All-Subjected" principle. The GFA created a unique constitutional status for Northern Ireland (part of the UK, but with a right to join the Republic). Brexit changed the material reality of the Irish border, effectively altering the GFA settlement.
      *   *The Silence:* Democratic theory assumes a unitary demos. It has no vocabulary for *nested* or *overlapping* demoi. The people of Northern Ireland were subject to a vote where the majority (UK-wide) overruled their specific constitutional settlement (62% voted Remain). Theories of federalism or consociationalism try to address this, but standard boundary theory (who gets to vote?) offers no protection for a sub-group whose constitutional future is decided by an external majority.

  ### III. Conclusion: Is the Problem Unresolvable?

  Does Brexit prove the boundary problem is unresolvable? It proves it is unresolvable *within* the existing nation-state framework.

  If you apply democratic principles rigorously (AAI or ASP), the Brexit referendum was illegitimate because the wrong people voted. If you apply the principle of state sovereignty (Parliament decides the franchise), the referendum was legitimate but democratically thin.

  The episode suggests that the boundary problem is not a puzzle to be solved by better theory, but a feature of power. The "demos" is not a pre-existing group that discovers itself; it is a group created by the act of exclusion. By excluding the Latvian nurse and the EU citizen, the UK reaffirmed its boundary as national, not residential. By excluding the 16-year-old, it reaffirmed the boundary as generational.

  The "principled defense" of the Westminster franchise is simply **stateness**. The state claims the right to define its own membership. Democratic theory tries to constrain that right with moral principles (affectedness, subjection), but Brexit shows that when the state feels its sovereignty is at stake, it reverts to the raw definition of membership (citizenship) rather than the moral one (interest).

  For your paper, the strongest argument is likely this: Brexit demonstrates that the boundary problem is not a technical glitch in democratic theory, but the limit of democracy itself. Democracy can only function *after* the boundary is drawn by non-democratic means (law, history, force). The referendum didn't solve the boundary problem; it was a performance of the state's power to impose a boundary despite the theoretical contradictions.
