prompt: |-
  hi — I work in a tiny unit that vets draft policy papers and ministerial speeches before they go out, and honestly about a third of what we end up flagging is a historical analogy. At the moment the flagging is just whoever's on duty going "hmm, that feels loaded", which isn't great when one line in a speech gets quoted for the next decade. So I want an actual procedure.

  What we have to work with: the draft text only, no research time (call it fifteen minutes per review, sometimes five), reviewers who studied politics or law rather than history, and a unit head who signs off with one of four stamps — green (fine as illustration), amber (usable, but the disanalogy has to be named in the same sentence), red (cut), and a fourth one we've started using: strip, meaning kill the historical frame but keep whatever claim it was carrying.

  Some distinctions we use informally and that I'd like either sharpened or thrown out: the carrier (the surface story of the episode) versus the payload (what the analogy is actually doing — predicting, legitimating, allocating blame, or just adding colour); analogies that transfer a mechanism versus ones that transfer an outcome; the mirror test, i.e. when the same episode is routinely wheeled out for the opposite lesson (Vietnam both as "don't intervene" and as "don't half-commit"), which makes me think it isn't doing any inferential work at all; and what I call the birth-date problem, that a lot of the famous lessons were coined afterwards by people with an axe to grind about their own record.

  So: write me the procedure. The questions in order, what counts as a sufficent answer to each, where it terminates in red versus strip, and where it has to hand the decision to a person because the remaining question is about values or risk appetite rather than facts. Ground it in whatever is genuinely known about analogical reasoning — relevant versus superficial similarity, reference classes and base rates, whether a causal mechanism has actually been stated, the fact that invoking an analogy can itself change what the players then do — but no citations and no reading lists, I need something my team can run off the page.

  Then run it on three things on my desk right now:

  1. "This is our Munich moment — any concession on tariffs will only whet their appetite." From a speech on a trade deal.
  2. A paper arguing that the US and China are caught in a Thucydides trap, so we should assume a high baseline probability of war this decade and plan accordingly.
  3. My own favourite, which I suspect definately won't survive: a note saying the current cyber escalation is like July 1914 in that nobody actually wants the big war, so we have far more room to de-escalate than people think.

  Give me the margin note my reviewer would write for each, including at least one stamp I won't like — don't soften it. Finish by saying plainly what the procedure can't do. British English please, and keep the jargon light: this is going into a style guide for non-specialists.

  cheers
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Works in a tiny policy vetting unit (speeches/papers).
      *   **Problem:** Historical analogies are frequently flagged informally ("hmm, that feels loaded"). Needs a formal procedure.
      *   **Constraints:** Draft text only, no research time (5-15 mins), reviewers are politics/law backgrounds (not historians), unit head uses four stamps (Green, Amber, Red, Strip).
      *   **Existing Concepts:** Carrier vs. Payload, Mechanism vs. Outcome, Mirror Test, Birth-date Problem.
      *   **Requirements:**
          *   Write a procedure (questions in order, sufficient answers, termination points, hand-off points).
          *   Grounded in analogical reasoning theory (relevant similarity, reference classes, causal mechanisms, self-fulfilling prophecies) but *no citations/reading lists*.
          *   Apply the procedure to three specific examples (Munich/Tariffs, Thucydides Trap/US-China, July 1914/Cyber).
          *   Provide margin notes for each, including at least one unpopular stamp.
          *   Finish with limitations of the procedure.
          *   Tone: British English, light jargon, style guide for non-specialists, direct/unsoftened.

  2.  **Drafting the Procedure:**
      *   *Goal:* A quick, actionable checklist that fits within a 5-15 minute review window.
      *   *Structure:* Sequential questions. If you fail one, you stop or move to a specific stamp.
      *   *Key Concepts to Integrate:*
          *   *Relevance:* Is the similarity deep or superficial?
          *   *Mechanism:* Does it explain *how* A leads to B, or just say A happened then B happened?
          *   *Mirror Test:* Is the analogy contested?
          *   *Agency/Reflexivity:* Does using the analogy change the outcome?
          *   *Carrier/Payload:* What is the actual work being done?
      *   *Decision Points:* Green, Amber, Red, Strip.
      *   *Human Hand-off:* Where values/risk come in.

      *   *Drafting Steps:*
          1.  **Identify the Payload:** What is the analogy *doing*? (Predicting, Justifying, Warning).
          2.  **Check the Mechanism:** Is there a causal link or just a vibe?
          3.  **The Mirror Test:** Is this history contested?
          4.  **The Reflexivity Check:** Does saying this make it true (self-fulfilling)?
          5.  **The Birth-Date Check:** Was the "lesson" learned at the time or invented later?
          6.  **Termination:** Map answers to stamps.

      *   *Refining for Constraints:* Keep it punchy. No academic language. "Sufficient answer" needs to be binary or clearly defined.

  3.  **Applying the Procedure to the Examples:**

      *   **Example 1: Munich/Tariffs.**
          *   *Payload:* Warning/Justifying hardness.
          *   *Mechanism:* Concession -> Aggression.
          *   *Mirror Test:* Munich is heavily contested (was it appeasement or buying time?).
          *   *Reflexivity:* High. Calling it Munich makes compromise impossible.
          *   *Verdict:* Likely Red or Amber (with heavy caveats). Let's go Red because it's a trade deal, not existential security, and the mechanism is weak.
          *   *Margin Note:* Needs to be sharp.

      *   **Example 2: Thucydides Trap/US-China.**
          *   *Payload:* Predicting war/Planning baseline.
          *   *Mechanism:* Rising power vs. Established power = War.
          *   *Mirror Test:* Thucydides didn't actually say this; it's a modern construct (Allison). Many rising powers didn't fight.
          *   *Reflexivity:* Very High. Planning for war makes war likely.
          *   *Verdict:* Red. It's a deterministic claim based on shaky history.
          *   *Margin Note:* Call out the determinism.

      *   **Example 3: July 1914/Cyber.**
          *   *Payload:* Reassurance/De-escalation room.
          *   *Mechanism:* Miscalculation -> Slide to war.
          *   *Mirror Test:* 1914 is the quintessential "accidental war" story, but historians argue about agency.
          *   *Reflexivity:* Moderate. Might encourage risk-taking ("we can de-escalate later").
          *   *User's Suspicion:* "Definitely won't survive."
          *   *Verdict:* Strip. Keep the claim (room to de-escalate), kill the 1914 frame. Why? Because 1914 implies inevitability once the slide starts, which contradicts the claim of control.
          *   *Margin Note:* Acknowledge the intuition but kill the history.

  4.  **Drafting the Limitations:**
      *   What can't this do? It can't verify facts (no research time). It can't stop bad faith actors. It can't replace strategic judgment. It focuses on *logic*, not *truth*.

  5.  **Review and Refine (Self-Correction):**
      *   *Tone Check:* British English (vetting, programme, colour, centre). Direct, professional, not academic.
      *   *Constraint Check:* No citations. 5-15 min feasibility. Four stamps used correctly.
      *   *Specific Instruction:* "Include at least one stamp I won't like." The user suspects #3 won't survive. I should probably Red or Strip #1 or #2 to be unpopular, or confirm their suspicion on #3 but explain why harshly. Let's make #1 a **Red** (kill it entirely) because Munich is toxic in trade contexts, which might be unpopular if the Minister loves the line. Let's make #3 a **Strip** (confirming suspicion but keeping the point).
      *   *Procedure Logic:* Ensure the "Hand-off" to the Unit Head is clear. The procedure recommends, the Head decides on risk.

  6.  **Final Polish:**
      *   Ensure the "Margin Notes" look like actual marginalia.
      *   Check the "Strip" definition (kill frame, keep claim).
      *   Check the "Amber" definition (name the disanalogy).

      *(Self-Correction on Procedure)*: Make sure the "Sufficient Answer" column is clear.
      *(Self-Correction on Examples)*: Ensure the reasoning aligns with the procedure steps.

      *Let's write it.*
answer: |-
  **PROCEDURE FOR VETTING HISTORICAL ANALOGIES**

  **Purpose:** To prevent historical references from introducing logical errors, deterministic thinking, or unintended political commitments into policy papers and speeches.
  **Time Budget:** 5–15 minutes per instance.
  **Inputs:** Draft text only. No external research.

  ### The Five-Step Check

  Work through these questions in order. If an answer is insufficient, move to the indicated termination point.

  **1. The Payload Test**
  *   **Question:** What work is this analogy doing? Is it *predicting* an outcome, *justifying* a action, *allocating blame*, or merely *decorating* the text?
  *   **Sufficient Answer:** A single verb (e.g., "Justifying sanctions," "Predicting escalation").
  *   **Failure:** If the payload is vague ("adding colour") or if the analogy is doing the heavy lifting for a claim that lacks evidence elsewhere.
  *   **Termination:** If the payload is prediction without evidence elsewhere → **Red**. If decoration only → **Strip** (keep the claim, cut the history).

  **2. The Mechanism Test**
  *   **Question:** Does the text explain *how* the past causes the future (mechanism), or does it simply assert that because A happened before, B will happen now (outcome)?
  *   **Sufficient Answer:** The text identifies a causal link that applies to both cases (e.g., "Economic interdependence failed to prevent war then, so it may not now").
  *   **Failure:** Relying on superficial similarity (e.g., "Both leaders wear suits," "Both involve islands").
  *   **Termination:** If mechanism is absent → **Red**.

  **3. The Mirror Test**
  *   **Question:** Is this historical episode routinely used to prove the *opposite* lesson? (e.g., Vietnam used to argue both for and against intervention).
  *   **Sufficient Answer:** "No, the historical consensus on the lesson is stable."
  *   **Failure:** "Yes, this is a contested event."
  *   **Termination:** If contested → **Amber** (Must name the counter-argument in the same sentence) OR **Red** (if the contestation undermines the policy).

  **4. The Reflexivity Check**
  *   **Question:** Will invoking this analogy change how actors behave? Does it create a self-fulfilling prophecy or trap the government into a corner?
  *   **Sufficient Answer:** "No, the audience cannot act on this," or "Yes, but that is the intent."
  *   **Failure:** The analogy forces a binary choice (e.g., "Munich" eliminates the option of negotiation).
  *   **Termination:** If it closes off necessary policy options → **Red**.

  **5. The Birth-Date Check**
  *   **Question:** Was the "lesson" learned at the time, or invented later by participants to justify their record?
  *   **Sufficient Answer:** "The lesson was recognised by contemporaries."
  *   **Failure:** "The lesson was coined by historians/politicians decades later."
  *   **Termination:** If the lesson is retrospective myth-making → **Strip** (Keep the policy point, cut the historical authority).

  ### Decision Matrix

  *   **GREEN:** Passes all five tests. The mechanism is sound, the history is stable, and the risk of reflexivity is low.
  *   **AMBER:** Passes, but fails the Mirror Test. The analogy is usable *only if* the text explicitly acknowledges the disanalogy or counter-argument in the same sentence.
  *   **RED:** Fails Mechanism, Reflexivity, or Payload tests. The analogy introduces error or unacceptable risk. Cut the sentence.
  *   **STRIP:** The policy claim is valid, but the historical frame is flawed. Delete the history, keep the assertion.

  ### The Hand-Off
  If the reviewer recommends **Red** or **Amber**, but the policy lead insists the analogy is strategically necessary, the decision moves to the Unit Head. This is no longer a factual check; it is a risk appetite decision. The Head must sign knowing the analogy is logically flawed but politically expedient.

  ***

  ### APPLICATION TO CURRENT DRAFTS

  **1. Speech Draft: "This is our Munich moment — any concession on tariffs will only whet their appetite."**

  *   **Payload:** Justifying hardness/refusing concession.
  *   **Mechanism:** Concession signals weakness -> aggression increases.
  *   **Mirror:** High. Historians debate whether appeasement bought necessary time or merely delayed war.
  *   **Reflexivity:** Critical. Invoking Munich makes negotiation politically impossible. It frames tariffs as existential security, not trade.
  *   **Birth-Date:** The "lesson of Munich" was solidified post-war by Churchill, not necessarily by actors in 1938.

  **Margin Note:**
  > **STAMP: RED.**
  > This fails the Reflexivity Check. Invoking Munich in a trade context transforms a commercial negotiation into an existential security crisis. It removes the diplomatic off-ramp required if talks stall. The mechanism (concession leads to aggression) is asserted, not demonstrated, and ignores that 1938 involved military capacity, not tariff schedules. Cut the reference. If the point is that concessions won't work, state that directly without the historical baggage.

  **2. Policy Paper: "The US and China are caught in a Thucydides trap, so we should assume a high baseline probability of war this decade and plan accordingly."**

  *   **Payload:** Predicting war/Setting planning baseline.
  *   **Mechanism:** Rising power + Established power = War.
  *   **Mirror:** High. Most rising powers in history did *not* go to war with the hegemon. The "Trap" is a modern construct, not ancient fact.
  *   **Reflexivity:** Extreme. Planning for war as a "high baseline" signals to both parties that conflict is inevitable, increasing security dilemma dynamics.
  *   **Birth-Date:** The "Trap" was coined by Graham Allison (2012), not Thucydides. It is a modern theory dressed as ancient wisdom.

  **Margin Note:**
  > **STAMP: RED.**
  > This fails the Payload and Mechanism tests. You are using a modern political science theory (Allison) masquerading as historical fact. The base rate is wrong: most power transitions do not result in war. By setting a "high baseline probability" based on this, you are baking a self-fulfilling prophecy into the defence budget. The policy recommendation (plan for conflict) may be valid, but this historical justification is determinist and factually shaky. Cut the "Thucydides Trap" framing entirely.

  **3. Internal Note: "Current cyber escalation is like July 1914 in that nobody actually wants the big war, so we have far more room to de-escalate than people think."**

  *   **Payload:** Reassurance/Arguing for de-escalation room.
  *   **Mechanism:** Miscalculation/Slide -> War (implies we can stop the slide).
  *   **Mirror:** Moderate. 1914 is the standard "accidental war" analogy, but historians argue leaders *did* want war, just not the specific scope it took.
  *   **Reflexivity:** Moderate risk. Might encourage complacency ("we can stop the slide anytime").
  *   **Birth-Date:** The "slide to war" narrative was largely cemented by the Fischer Controversy and later historians, not necessarily the understanding of the actors in 1914.

  **Margin Note:**
  > **STAMP: STRIP.**
  > I know you like this one, but it fails the Mechanism test. July 1914 is the archetype of *loss of control*, yet your claim is that we *have* control ("room to de-escalate"). The analogy undermines your argument. If 1914 teaches anything, it's that once mobilisation starts, political control evaporates. Do not use 1914 to argue for controllability. Keep the claim ("we have room to de-escalate"), but delete the historical frame. Support the claim with current cyber architecture analysis, not WWI history.

  ***

  ### WHAT THIS PROCEDURE CANNOT DO

  1.  **It cannot verify facts.** We are not historians. We are checking the *logic* of the comparison, not the accuracy of the dates or names. If the draft says "Hitler invaded Poland in 1939," we assume that is true. We are checking if comparing Poland to a trade deal is valid.
  2.  **It cannot stop bad faith.** If a Minister *wants* to paint a trade deal as an existential war to rally support, this procedure will flag it as Red, but the Minister can overrule it via the Hand-Off. We flag the risk; they own the choice.
  3.  **It cannot measure emotional resonance.** An analogy might be logically flawed (Red) but politically electrifying. This procedure prioritises logical coherence over rhetorical punch. If you need the punch, you must accept the logical risk.
  4.  **It cannot predict the future.** Analogies are often used to predict. This procedure tests whether the prediction is *reasoned*, not whether it will come true. A sound analogy can still be wrong.

  **Final Note:** If you are unsure, default to **Strip**. It is always safer to make a claim on its own merits than to lean on a historical crutch that might snap.
