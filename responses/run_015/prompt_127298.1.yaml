  # Joint Statement on the Epistemic Significance of No-Free-Lunch Theorems

  **Signatories:** The NFL Skeptic & The NFL Deflationist
  **Date:** October 26, 2023
  **Context:** Adversarial Collaboration on Induction and Optimization

  We, the undersigned, have engaged in an adversarial collaboration to clarify the philosophical implications of the No-Free-Lunch (NFL) theorems for the problem of induction. While we remain divided on the normative conclusions to be drawn from these theorems, we have identified a core of shared commitments and isolated the precise points of residual disagreement. This document records our agreements, our divergent characterizations of the dispute, and the specific cruxes we propose to address via formal and empirical adjudication.

  ### Part I: Agreed Claims

  We jointly affirm the following propositions as settled matters of mathematics, definition, or logical constraint. These claims form the common ground upon which our disagreement rests.

  1.  **Mathematical Validity:** We accept the NFL theorems for optimization and supervised learning (e.g., Wolpert et al.) as mathematically correct. Specifically, we agree that for any two learning algorithms, their average performance is identical when averaged uniformly over all possible target functions (mappings from inputs to outputs).
  2.  **Scope of Application:** We agree that these theorems strictly apply to ensembles of target functions that are permutation-invariant (i.e., the prior distribution over functions is uniform). We agree that if the ensemble of possible worlds is not permutation-invariant, the NFL equality does not necessarily hold.
  3.  **Justification vs. Reliability:** We distinguish between *justifying* induction (providing a non-circular argument that inductive inferences are likely to be true) and demonstrating *reliability* (showing that inductive methods have historically yielded successful predictions). We agree that the Humean problem stands: no non-circular justification of induction has been agreed upon, and empirical success alone cannot logically guarantee future success.
  4.  **Definitions:**
      *   **Reliable:** A learner is "reliable" in a specific context if its expected error rate on the actual distribution of tasks faced is significantly below chance (0.5 for binary classification).
      *   **Structured World:** A world is "structured" if the target functions governing it are compressible (i.e., they possess low Kolmogorov complexity relative to a fixed reference machine) and are not drawn from a permutation-invariant distribution.
  5.  **Normative Limits:** We agree that the inability of any single empirical result to settle a normative question is settled. No amount of data can logically force a conclusion about what we *ought* to believe without prior normative premises.

  ### Part II: Residual Disagreements

  The following table catalogs our remaining disputes. For each row, we provide the characterization of the disagreement as it would be framed by the Skeptic and as it would be framed by the Deflationist. We further classify whether the disagreement is substantive (concerning the state of the world or the force of arguments) or verbal (concerning definitions or linguistic usage).

  | # | Skeptic's Characterization of Disagreement | Deflationist's Characterization of Disagreement | Classification |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Epistemic Force of NFL:** The NFL theorems demonstrate that without a priori knowledge of the world's structure, there is no rational basis for preferring inductive methods over random guessing. | **The Epistemic Force of NFL:** The NFL theorems demonstrate that inductive methods are only irrational if one assumes the world is unstructured; they do not preclude rational preference given empirical evidence of structure. | Substantive |
  | **2** | **Access to the Meta-Distribution:** We lack any access to the "meta-distribution" of possible worlds that would allow us to know if our world is atypical; therefore, we must assume it is not. | **Access to the Meta-Distribution:** We have direct empirical access to the structure of our actual world; we do not need to sample from the space of all possible worlds to validate induction here. | Substantive |
  | **3** | **Meaning of "Justification":** To "justify" induction requires showing it works across all logically possible worlds, which NFL proves impossible. | **Meaning of "Justification":** To "justify" induction requires showing it works in the actual world, which NFL leaves open. | Verbal |

  *Note on Row 3:* We classify Row 3 as **Verbal**. Both parties agree on the facts of the matter (induction works here; induction might not work in all possible worlds). The dispute turns entirely on whether the term "justification" applies to local reliability or global logical guarantee. We agree to bracket this terminological dispute for the remainder of the collaboration and focus on the substantive claims in Rows 1 and 2.

  ### Part III: The Cruxes

  We identify three specific cruxes where our substantive disagreement concentrates. For each, we specify a test, case, or argument accepted by both as bearing on the issue, record our divergent predictions, and specify the conditions under which each side would be vindicated.

  #### Crux 1: Normative Conclusions from Formal Results
  **Question:** Can a normative conclusion about inductive practice be drawn from a formal result proved for permutation-invariant ensembles?

  *   **Adjudicating Device:** The **"Lunch-Gradient" Result**. (Stipulated Theorem: *The largest expected performance gap achievable between two learners on an ensemble is bounded by that ensemble's departure from permutation-invariance, measured as its description length relative to a fixed reference machine.*)
  *   **Skeptic's Prediction:** The Lunch-Gradient result will show that while structure allows for performance gaps, quantifying that structure (the description length) requires inductive assumptions. Therefore, the formal result cannot generate a normative conclusion without begging the question.
  *   **Deflationist's Prediction:** The Lunch-Gradient result will show that the normative license to use induction scales continuously with the measured departure from permutation-invariance. Thus, the formal result *does* yield a normative conclusion conditional on the measured structure.
  *   **Vindication Conditions (Substantive):**
      *   *Skeptic Vindicated:* If it is shown that estimating the "departure from permutation-invariance" requires the very inductive bias the theorem is meant to justify.
      *   *Deflationist Vindicated:* If it is shown that the "departure" can be measured via a method neutral between inductive and non-inductive policies, thereby licensing the policy without circularity.

  #### Crux 2: Compressibility and Circularity
  **Question:** Can the apparent compressibility of the tasks we actually face underwrite induction without circularity?

  *   **Adjudicating Device:** **Preregistered Meta-Study**. (A fixed battery of real-world forecasting and classification tasks in which simplicity-biased learners are compared against complexity-matched permutation controls, with the gap recorded against a compressibility statistic for the battery.)
  *   **Skeptic's Prediction:** The meta-study will show a significant performance gap favoring simplicity-biased learners on compressible tasks. However, this confirms reliability, not justification. Using this gap to justify the bias presupposes that the future battery will resemble the past battery (circular).
  *   **Deflationist's Prediction:** The meta-study will show a correlation between the compressibility statistic and the performance gap. This correlation constitutes an empirical warrant. Relying on empirical warrant is not circular; it is the definition of scientific justification.
  *   **Vindication Conditions (Substantive):**
      *   *Skeptic Vindicated:* If the world is such that the compressibility of tasks is transient, meaning the statistical regularities found in the battery do not persist into future tasks without a presupposition of uniformity.
      *   *Deflationist Vindicated:* If the world is such that compressibility is a stable, objective feature of the task battery that persists independently of our presuppositions, allowing the gap to serve as non-circular evidence.

  #### Crux 3: The Uniformity of Nature
  **Question:** Is the uniformity of nature a contingent, discoverable feature of our world or a commitment adopted because no alternative is available?

  *   **Adjudicating Case:** **The Stability of Physical Constants**. (An argument examining whether the constancy of physical laws over time is an empirical discovery subject to revision or a necessary precondition for doing physics.)
  *   **Skeptic's Prediction:** The case will show that any evidence for the stability of constants presupposes the reliability of the instruments and memories used to record them. Thus, uniformity is a commitment adopted because no alternative is available for reasoning, not a discoverable fact.
  *   **Deflationist's Prediction:** The case will show that the stability of constants is a contingent hypothesis that has been repeatedly tested and confirmed against alternatives (e.g., varying constant models). Thus, it is a discoverable feature.
  *   **Vindication Conditions (Substantive):**
      *   *Skeptic Vindicated:* If the world is such that any attempt to test the stability of constants inevitably relies on assumptions that would be invalidated if the constants were unstable (making the hypothesis unfalsifiable).
      *   *Deflationist Vindicated:* If the world is such that there exist "anchor" observations or coherence checks that allow the stability of constants to be falsified without presupposing that stability (making the hypothesis empirically contingent).

  ***

  **Signed,**

  *The NFL Skeptic*
  *The NFL Deflationist*
