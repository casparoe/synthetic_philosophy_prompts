          *   **Crucial Constraint:** Be upfront about what is settled vs. contested in the relevant communities (EA, longtermism, space ethics). Do not present contested takes as consensus.

  2.  **Analyze the Five Points:**
      *   (1) *Total-View Longtermism:* Maximize future happy lives. Offworld settlement is high EV. (Classic Longtermism/Utilitarianism).
      *   (2) *Alien Biosphere Preservation:* Duty not to wreck alien life (even microbial). Deontological/Environmental constraint on (1).
      *   (3) *Panspermia/Seeding:* Starting life on dead worlds is good. (Pro-creationist/Total View).
      *   (4) *Suffering Constraints:* No predator-prey ecosystems (wild animal suffering). Negative Utilitarian/Suffering-Focused constraint on (3).
      *   (5) *Consent/Non-Identity:* Don't impose high mortality risks on children born offworld. Rights-based/Contractualist constraint on (1).

  3.  **Identify Tensions (The "Audit"):**

      *   *Tension A: (1) vs. (2).* Total view says maximize lives. (2) says restrict where we can do that (no terraforming living worlds).
          *   *Severity:* High. If life is common, (2) drastically reduces the real estate available for (1).
      *   *Tension B: (1) vs. (5).* Total view wants expansion ASAP. (5) slows down expansion or makes it more expensive (need safe habitats before breeding).
          *   *Severity:* Medium-High. Affects *timing* and *method*, not necessarily *possibility*.
      *   *Tension C: (3) vs. (4).* (3) says start life. (4) says don't start *standard* life (predator-prey).
          *   *Severity:* Medium. Requires technological specificity (engineered biospheres), but logically compatible if tech exists.
      *   *Tension D: (1) vs. (4).* Total view usually counts wild animal lives as net positive (or neutral). (4) assumes they are net negative (suffering).
          *   *Severity:* High. This is a fundamental axiological clash (Total View vs. Suffering-Focused).
      *   *Tension E: (2) vs. (3).* (2) protects existing life. (3) creates new life.
          *   *Severity:* Low. They apply to different targets (existing vs. dead worlds).

  4.  **Evaluate "Settled vs. Contested" Status:**
      *   *Longtermism/Total View:* Contested within philosophy, dominant but not monolithic in EA.
      *   *Alien Rights:* Highly contested. Most space ethicists lean towards instrumental value, some argue for intrinsic value of biospheres.
      *   *Wild Animal Suffering:* Highly contested. Some think nature is net positive, some net negative, some unknowable.
      *   *Reproductive Consent/Non-Identity Problem:* Deeply contested philosophical terrain. The "non-identity problem" (Parfit) specifically challenges (5). If the child wouldn't exist otherwise, can they claim harm?
      *   *Space Colonization Priority:* Contested. Some EAs prioritize AI safety over space.

  5.  **Drafting the Audit (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the position. It's a "constrained longtermism" model.
      *   *Ranking Tensions:*
          1.  **(1) vs. (4): The Axiological Clash.** Total View (more lives = good) vs. Suffering Focus (wild suffering = bad). This is the deepest philosophical conflict.
          2.  **(1) vs. (2): The Resource Constraint.** If life is common, (2) kills the EV of (1).
          3.  **(1) vs. (5): The Implementation Constraint.** The Non-Identity Problem.
      *   *Fixes & Costs:*
          *   For (1)/(4): Adopt "Suffering-Weighted Total View." Cost: Lower EV estimates for colonization.
          *   For (1)/(2): Assume life is rare. Cost: Risk of being wrong (moral catastrophe).
          *   For (1)/(5): Focus on automation/robotics first. Cost: Slower expansion.
      *   *Single Best Revision:* Refine (1) to explicitly include suffering weights. This aligns (1) with (4) and softens the conflict with (2) and (5).
      *   *Consensus Check:* Need to be careful here. There is *no* consensus on space ethics. I need to highlight that these are live debates in the EA/Rationalist sphere.

  6.  **Refining the Output (Self-Correction/Nuance):**
      *   *Correction on (5):* The user mentions "consent constrains imposing big risks on people who already exist." This is actually a standard rights view, but it clashes with the Non-Identity Problem. If the kids wouldn't exist without the risk, did you harm them? The user rejects the Non-Identity conclusion. I need to point out that this is a specific philosophical stance, not a universal truth.
      *   *Correction on (2):* This is "Cosmic Environmentalism." It's a minority view compared to "Anthropocentric Instrumentalism."
      *   *Correction on (4):* This is "Suffering-Focused Ethics." It conflicts with standard Total Utilitarianism which often assumes life is worth starting.
      *   *Tone:* Keep it analytical, respectful, but rigorous. Use EA/Rationalist terminology correctly (EV, axiology, non-identity, suffering footprint).

