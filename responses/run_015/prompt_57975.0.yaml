prompt: |-
  so I've been lurking on rationalist blogs for like a decade and finally tried to write down my space colonization take, idk if its consistant tho. Here's where I'm at:

  (1) I'm basically total-view longtermist, more future happy lives is better and getting a self-sustaining offworld settlement ASAP beats almost everything else on expected value.
  (2) But I also think we have a strong duty not to wreck alien biospheres even microbial ones, like we shouldn't terraform or strip-mine a planet with its own life even if that would let us support way more human lives.
  (3) I think starting life on a currently dead world is a real good, like sending a seed-ship with engineered microbes that kicks off evolution there is positive even though nobody consented to exist.
  (4) I think we shouldn't seed dead worlds with a normal predator-prey ecosystem that will run for millions of years of wild suffering just to get more minds, only low-suffering engineered biospheres or nothing.
  (5) I think its wrong to run high-mortality early base plans like a first-gen Mars outpost where volunteers accept crazy death risk but their kids born there can't really opt out, consent constrains imposing big risks on people who already exist.

  Can you audit this for me — which pairs are actually in tension vs just look like it, rank the real tensions by severity, and for each say what the cheapest fix would be and what it would cost me, plus which single revision would clean up the most? Also please be upfront about whats actually settled among people who work on this stuff vs what is still live disagreement, dont present a contested take as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the User's Request:**
      *   **Context:** The user has been reading rationalist blogs for a decade (implies familiarity with EA, longtermism, utilitarianism, suffering-focused ethics, consent-based ethics, etc.).
      *   **Task:** Audit their five-point "space colonization take" for consistency.
      *   **Specific Requirements:**
          *   Identify tensions (real vs. apparent).
