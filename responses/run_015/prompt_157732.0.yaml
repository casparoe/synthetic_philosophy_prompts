  Earns the top tier by treating intuitions as renormalized constants that encode deep-time welfare correlations without requiring micro-causal tracking; it avoids uncritical conservatism by acknowledging these constants are scale-dependent and require recalibration when environmental parameters shift beyond the training distribution, offering more adaptive granularity than rigid rules without collapsing into particularist structurelessness.

  **A Tier: The Rule-Consequentialist Fallback**
  Secures a high rank as a stable effective theory that reduces cognitive load, but costs flexibility compared to evolutionary heuristics because codified rules often lack the adaptive resolution to handle novel contexts where historical correlations break down.

  **B Tier: The Satisficing-Default Strategy**
  Valuable for risk mitigation in high-uncertainty systems, but demoted because defaulting to non-action violates consequentialist axioms by ignoring the harms of omission and introducing an unjustified status quo bias.

  **C Tier: The Bayesian Credence Strategy**
  Retains theoretical fidelity to consequentialism but fails the bounded-agent constraint, as assigning explicit probabilities to distant causal chains amounts to false precision that is computationally intractable and vulnerable to prior domination.

  **D Tier: The Particularist Dissolution**
  Rejects the problem rather than solving it; while it avoids false generalizations, it costs all action-guiding power for novel dilemmas, leaving the agent with no algorithmic structure to coordinate or reason beyond immediate perception.
