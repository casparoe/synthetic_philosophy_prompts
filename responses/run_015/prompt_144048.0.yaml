  Replace "Informational Closure" (epistemic indistinguishability of current mental state) with **"Causal-Metaphysical Accessibility."**
  *   *New C2:* "I define that reference class... by the set of observers who are metaphysically accessible to me via my causal trajectory."

  **Why this restores consistency:**
  1.  **Resolves C2/C5 (Doomsday):** Future humans are causally accessible (you can become them, or they are in your future light cone). They enter the reference class, saving the Doomsday Argument.
  2.  **Resolves C2/C6 (Everett):** If you maintain the stance in C6 that other branches are *not* counterfactually accessible (a specific modal claim), they are excluded from the new reference class. This aligns the class definition with your exclusion criterion.
