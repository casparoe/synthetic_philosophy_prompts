answer: |-
  ### Desiderata for a Theory of Real-Pattern Recognition

  To justify the selection of the physical, design, or intentional stance, particularly within hybrid domains where these perspectives compete, a theory of real-pattern recognition must satisfy the following criteria. Each desideratum is presented with its motivating distinction, its classification regarding theoretical necessity, and an assessment of its compatibility with other requirements.

  #### 1. Counterfactual Robustness
  *   **Requirement:** The pattern identified by a stance must support subjunctive conditionals (what *would* happen if conditions changed) rather than merely summarising actual occurrences.
  *   **Motivating Case:** Distinguishing a genuine law-like regularity from an accidental generalisation. For instance, a coin in a pocket may always be heads up, but this does not support the counterfactual that it *would* be heads up if flipped. In hybrid domains, such as institutional protocols, a rule may be followed consistently by accident of culture rather than by normative constraint; only the latter supports robust predictions about behaviour under stress.
  *   **Classification:** **Non-negotiable.** Without this, pattern recognition collapses into curve-fitting, offering no explanatory power.
  *   **Joint Satisfiability:** Generally compatible with other desiderata, though it places a high burden on the observer's knowledge of the system's constraints.

  #### 2. Explanatory Autonomy
  *   **Requirement:** Adopting a higher-level stance (design or intentional) must provide explanatory leverage that is not trivially derivable from the physical stance, without implying that the higher-level entities exert 'spooky' causal forces independent of physics.
  *   **Motivating Case:** Blocking the reduction of design explanations to intentional ones, or both to physics. A synthetic biological circuit functions according to engineering principles (design stance) even if no agent currently holds beliefs about it (intentional stance). Reducing the circuit's function entirely to molecular interactions (physical stance) renders the concept of 'circuit' explanatorily idle, despite its predictive utility.
  *   **Classification:** **Non-negotiable** for any pluralistic ontology; **Camp-specific** for strict reductionists (who deny autonomy) versus non-reductive physicalists.
  *   **Joint Satisfiability:** This is the primary friction point. It is jointly unsatisfiable with the principle of the 'Causal Closure of the Physical' if one insists on a robust realist ontology for the higher-level stances.

  #### 3. Genealogical Sensitivity
  *   **Requirement:** The theory must discriminate between systems that share structural similarities but differ in their etymological history (e.g., selection history versus intelligent planning).
  *   **Motivating Case:** Hybrid domains like evolved algorithms. An artificial neural network trained via genetic algorithms may exhibit complex, adaptive behaviour indistinguishable from hand-coded software. However, attributing an 'intentional stance' (beliefs/desires) to the evolved system may be misleading compared to the 'design stance' (optimisation history), even if the physical substrate is identical. A theory that relies solely on current compressibility fails to distinguish between a designed artefact and an evolved organism.
  *   **Classification:** **Non-negotiable** for applications in synthetic biology and AI; **Camp-specific** for ahistorical functionalists who argue only current structure matters.
  *   **Joint Satisfiability:** Tension arises with 'Cognitive Tractability' (see below), as historical data is often inaccessible or computationally expensive to verify.

  #### 4. Cognitive Tractability
  *   **Requirement:** The stance selected must be computationally feasible for the observer to utilise within a reasonable timeframe.
  *   **Motivating Case:** The physical stance is theoretically universal but practically impossible for complex systems. Predicting the behaviour of a stock market via quantum mechanics is physically valid but cognitively intractable. The intentional stance ('the market fears inflation') offers a compressible shortcut. In hybrid institutional protocols, if the rules are too complex to simulate physically, the intentional attribution to the institution is the only tractable option.
  *   **Classification:** **Non-negotiable** for a pragmatic theory of prediction; **Camp-specific** regarding whether tractability determines *reality* or merely *utility*.
  *   **Joint Satisfiability:** Conflicts with 'Counterfactual Robustness' if the shortcuts required for tractability sacrifice accuracy in edge cases.

  #### 5. Ontological Neutrality versus Commitment
  *   **Requirement:** The theory must specify whether adopting a stance commits the user to the existence of the entities posited (e.g., do 'beliefs' exist, or are they merely useful fictions?).
  *   **Motivating Case:** The conflict between ontological parsimony and predictive leverage. In institutional protocols, we speak of 'the company deciding'. A realist claims the company is an agent; an instrumentalist claims this is a *façon de parler*. A theory of real patterns must clarify if the 'reality' of the pattern implies the existence of the patterned objects.
  *   **Classification:** **Camp-specific.** This divides realists (who require ontological commitment for real patterns) from instrumentalists (who require only predictive success).
  *   **Joint Satisfiability:** This is the locus of the deepest incompatibility. One cannot simultaneously satisfy strict ontological parsimony (only fundamental particles exist) and strong explanatory autonomy (design/intentional causes are real).

  ### Joint Unsatisfiability and Standard Criticisms

  A subset of these desiderata is jointly unsatisfiable under standard criticisms of stance-based ontology, specifically regarding **Explanatory Autonomy**, **Ontological Commitment**, and **Physical Causal Closure**.

  If one demands **Ontological Commitment** (that intentional entities truly exist) alongside **Explanatory Autonomy** (that they have causal power), one violates the **Causal Closure of the Physical** (the view that every physical effect has a sufficient physical cause). This is the classic problem of causal exclusion. To satisfy all three, one must adopt a non-standard metaphysics (such as compatibilism or dual-aspect monism). Consequently, a theory must usually sacrifice either the robust reality of the higher-level stances (retreating to instrumentalism) or the completeness of the physical stance (accepting downward causation).

  Furthermore, **Genealogical Sensitivity** and **Cognitive Tractability** often pull in opposite directions. In hybrid domains like evolved algorithms, determining the etymology of a pattern (was it designed or selected?) is often computationally harder than simply predicting its future output. A theory that insists on genealogical accuracy may fail the tractability requirement, rendering the stance useless for real-time prediction.

  ### Dennett's Original Account Against the List

  Daniel Dennett's original formulation of the Real Patterns doctrine satisfies **Counterfactual Robustness** and **Cognitive Tractability** by defining reality in terms of predictive compressibility. He effectively sidesteps the **Ontological Commitment** dilemma by adopting a mild realism: patterns are real, but their reality is not a matter of 'stuff' but of structure. However, his account is often criticised for lacking **Genealogical Sensitivity**. Dennett tends to prioritise the 'current design' of a system over its history; if an evolved algorithm behaves exactly as if it were designed by an agent, Dennett's criteria often permit the intentional stance, whereas a stricter genealogical criterion would forbid it. Finally, while Dennett argues for **Explanatory Autonomy**, critics maintain that his instrumentalist leanings prevent him from fully satisfying the requirement for robust causal power without reduction.
