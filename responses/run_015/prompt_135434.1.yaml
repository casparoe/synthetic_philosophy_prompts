  # Architectural Indirectness: Modularity, Deliberation, and the Collapse of Normative Categories

  ## Abstract

  This project proposes a reconstruction of the debate surrounding indirect normativity by shifting the locus of analysis from the content of deliberation to the architecture of the deliberating agent. Standard models of indirect normativity—particularly within two-level consequentialist frameworks—presume a unified agent who must strategically manage their own access to normative reasons. This presumption generates persistent paradoxes regarding self-deception, esoteric morality, and the stability of rational commitment. By modeling the ideal deliberator as a modular system composed of distinct reasoning subsystems separated by normative firewalls, this project investigates whether indirect normativity retains its distinct categorical status or collapses into a form of direct normativity distributed across sub-agential components. Using a reframed version of Kavka's Toxin Puzzle as a primary case study, the research will test whether modular compartmentalization resolves the paradoxes of indirect reasoning without eliminating the normative distinction between direct and indirect rules. The project includes a rigorous scope check and defined failure conditions to ensure feasibility within a one-semester timeline.

  ## 1. Introduction: The Problem of Indirect Normativity and the Unified Agent

  The central tension in modern normative theory often resides in the gap between the criteria of rightness and the decision procedures available to agents. Direct normativity suggests that the reasons determining the rightness of an action should also be the reasons upon which the agent deliberates. If an action is right because it maximizes value, the agent should intend to maximize value. However, persistent counterexamples suggest that direct deliberation often undermines the very outcomes it seeks to achieve. If an agent deliberates directly about maximizing utility in every instance, they may become unreliable, anxious, or prone to calculation errors that reduce overall utility. Consequently, many normative theories adopt an indirect structure: the agent ought to follow rules, cultivate virtues, or maintain commitments that are not themselves directly justified by the fundamental normative criterion in every moment of deliberation.

  This structure, often termed indirect normativity, relies heavily on a specific conception of the agent. It assumes a unified locus of deliberation that possesses the capacity to step back from its own reasoning processes and manipulate them strategically. The agent must know enough to adopt the indirect rule but not know enough, or not attend to enough, during the execution of the rule to undermine it. This creates a precarious epistemic and volitional balance. The agent is required to maintain a form of ignorance or inattention regarding the ultimate grounds of their actions while simultaneously being responsible for maintaining that ignorance. This is the problem of esoteric morality: how can an ideal agent be required to hide the truth of their normative commitments from themselves without violating ideals of rational transparency and integrity?

  The standard response to this tension involves distinguishing between the level of theory selection and the level of practical deliberation. At the critical level, the agent selects rules or dispositions that generally optimize the fundamental criterion. At the practical level, the agent follows those rules without referencing the criterion. However, this distinction remains unstable if the agent is modeled as a unified consciousness. A unified agent who knows the rule is instrumental cannot help but see the exception cases where breaking the rule would better serve the fundamental criterion. If the agent is rational, they will see that the indirect rule is merely a proxy for the direct criterion, and in cases where the proxy fails, rationality似乎 demands reverting to the direct criterion. Thus, indirect normativity threatens to collapse into direct normativity whenever the agent's rationality is sufficiently robust to recognize the instrumental nature of their constraints.

  This project proposes that the instability of indirect normativity stems not from the normative theory itself, but from the underlying model of agency. The assumption of a unified agent who must simultaneously hold conflicting levels of awareness is psychologically unrealistic and normatively problematic. Instead, I propose modeling the ideal deliberator as a modular agent. In this model, the agent is not a singular unity but a composite of distinct reasoning subsystems. These subsystems receive different inputs, operate under different constraints, and are separated by "firewalls" that limit information flow between them. Crucially, these firewalls are not merely descriptive psychological quirks or limitations; they are part of the normative architecture itself. The normativity lies in the structure of the separation as much as in the content of the rules processed by the modules.

  By shifting to a modular model, we can reframe the problem of indirect normativity. Instead of asking how a single agent can strategically ignore relevant reasons, we ask how distinct modules can be coordinated such that the executive module does not receive the reasons that would undermine optimal performance. This shifts the burden from self-deception to architectural design. However, this shift raises a new and critical question: does this modular architecture preserve the distinctiveness of indirect normativity, or does it simply reduce indirect norms to direct norms operating at a higher level of abstraction within a specific module? If Module A optimizes directly and instructs Module B to follow rules blindly, is this not just direct normativity with extra steps?

  The core research question of this proposal is whether indirect normativity remains a distinct category once the ideal deliberator can be compartmentalized. If the firewalls between modules are normatively required, then the indirectness is structural and irreducible. If the firewalls are merely instrumental tools selected by a dominant module for efficiency, then indirect normativity collapses into a specialized form of direct normativity. Resolving this distinction is vital for understanding the stability of normative theories that rely on indirectness, such as rule consequentialism, certain forms of contractualism, and virtue ethics grounded in habituation.

  This proposal outlines a plan to construct this modular model, test it against the classic Toxin Puzzle reframed as an inter-module conflict, and evaluate whether the residue of the analysis points to a real normative distinction or merely to descriptive preference fragmentation. The project aims to demonstrate that a modular architecture offers a viable path out of the paradoxes of indirect normativity without sacrificing the normative force of the distinction between criteria of rightness and decision procedures.

  ## 2. The Standard Framework: Indirect Normativity and the Unified Agent

  To understand the innovation proposed by the modular model, we must first rigorously characterize the standard framework it seeks to replace. The dominant conception of indirect normativity in contemporary practical reason seminars relies on the "two-level" model. In this model, there is a distinction between the intuitive level and the critical level. The critical level is where the fundamental normative truth resides—for example, the maximization of overall well-being. The intuitive level is where the agent actually operates during most practical deliberation, relying on heuristics, rules of thumb, or deeply ingrained dispositions.

  The justification for this split is typically consequentialist. It is argued that agents who attempt to calculate the fundamental criterion in every instance perform poorly due to cognitive limitations, bias, or emotional interference. Therefore, the optimal strategy is to cultivate dispositions that generally align with the fundamental criterion but are insulated from direct calculation in the moment. This creates the phenomenon of indirect normativity: the agent ought to do X, not because X directly maximizes value in this instance, but because doing X is part of a disposition that generally maximizes value.

  The critical weakness of this framework is the assumption of agent unity. The two-level model requires the same agent to occupy both levels. The agent must be sophisticated enough at the critical level to recognize the value of the intuitive dispositions, but sufficiently constrained at the intuitive level to refrain from critical calculation when it matters. This generates the problem of "self-undermining knowledge." If the agent knows at the intuitive level that their disposition is merely instrumental, that knowledge can destabilize the disposition. For example, if I know that my commitment to honesty is only valuable because it generally promotes trust, I may be tempted to lie in a specific case where lying would promote trust more effectively without damaging my general reputation. The knowledge of the instrumental nature of the rule erodes the force of the rule.

  To prevent this erosion, standard theories often invoke forms of strategic ignorance or self-deception. The agent must somehow forget or ignore the critical justification while acting on the intuitive rule. This is normatively unappealing. It suggests that ideal rationality involves a form of irrationality—a blindness to relevant reasons. It also raises questions about integrity. An agent who deliberately cultivates ignorance to achieve better outcomes seems to lack a unified moral identity. They are split between the knower and the doer, but since they are the same person, this split is metaphorical rather than structural.

  Furthermore, the unified agent model struggles with the "collapse argument." If the agent is truly rational, they will recognize that the intuitive rules are proxies. When the proxy diverges from the target, rationality dictates correcting the error. Therefore, a sufficiently rational unified agent will always revert to direct normativity in cases of conflict. The only way to maintain indirect normativity is to posit a limitation on rationality—a bug rather than a feature. But if we are modeling an *ideal* deliberator, as normative theory often does, we cannot rely on bugs. We need a feature that sustains the indirectness without compromising rationality.

  Some responses attempt to solve this by appealing to the cost of deliberation. It is too expensive to calculate every time, so the agent adopts a rule. However, this is still a direct calculation at the higher level. The agent directly chooses the rule because it directly maximizes value (including deliberation costs). Thus, the normativity remains direct; only the object of deliberation has shifted from actions to rules. This is the "direct normativity with extra steps" objection. The indirectness is merely temporal or hierarchical, not structural. The agent is still directly optimizing the fundamental criterion, just over a longer time horizon or a different domain.

  This brings us to the limit of the standard framework. It cannot explain how an ideal agent can be bound by norms that they know are not directly optimizing in the moment, without appealing to irrationality or merely shifting the locus of optimization. The unified agent is too transparent to itself. It sees the strings behind the puppet, and once it sees them, it cannot help but pull them directly. To preserve indirect normativity for an ideal agent, we need a model where the agent does not see the strings, not because it is blind, but because the part of the agent that sees the strings is not the part that pulls them. This requires moving from a unified model to a modular one.

  ## 3. The Modular Hypothesis: Architecture as Normative Structure

  The core innovation of this project is the proposal to model the ideal deliberator as a modular system. This draws on concepts from philosophy of mind and cognitive science, specifically the notion of horizontal faculties or subsystems that operate with limited information access. However, in this normative context, modularity is not merely a descriptive claim about human psychology; it is a normative claim about the architecture of rational agency.

  In the modular model, the agent is composed of at least two distinct subsystems: the Architect Module and the Executive Module. The Architect Module operates at a high level of abstraction. It has access to the fundamental normative criterion (e.g., maximize value). It assesses long-term strategies, designs dispositions, and sets parameters for the Executive Module. The Executive Module operates at the level of immediate action. It receives inputs from the environment and produces actions based on the parameters set by the Architect. Crucially, there is a firewall between these modules. The Executive Module does not have access to the Architect's calculations or the fundamental criterion. It only has access to the rules and dispositions installed by the Architect.

  This firewall is not a psychological limitation to be overcome; it is a normative requirement. The ideal agent *ought* to be structured this way. The separation ensures that the Executive Module cannot undermine the optimal strategy by attempting to recalculate the fundamental criterion in real-time. The Executive Module is "blind" to the instrumental nature of its rules, not because it is irrational, but because it is architecturally prevented from accessing that information. This resolves the problem of self-undermining knowledge. The part of the agent that knows the rules are instrumental is not the part that follows them.

  This model transforms indirect normativity from a strategy of self-management into a structure of agency. Indirect norms are not rules that a unified agent chooses to follow despite knowing better; they are the operating code of a subsystem that is designed not to know better. The normativity lies in the design of the architecture. It is right to have an Executive Module that follows rules blindly because that architecture produces the best outcomes. Therefore, following the rule is indirectly normative because it is part of the optimal architectural design.

  However, this raises a significant metaphysical and normative question: is this still one agent? If the Architect and Executive are so segregated that they do not share information, do they constitute a single locus of responsibility? For the purposes of this project, I will argue that they constitute a single agent in virtue of their functional integration and shared ultimate goals, even if their epistemic access is segregated. The unity of the agent is maintained by the Architect's design authority over the Executive. The Executive acts on behalf of the agent as defined by the Architect's parameters.

  The normative significance of this model is that it allows for genuine indirectness without irrationality. The Executive Module is not irrational for ignoring the fundamental criterion; it is functioning correctly according to its design. The Architect Module is not deceptive; it is optimizing the system design. The tension between knowing and doing is resolved by distributing the knowing and the doing across different subsystems.

  This suggests that indirect normativity might be grounded in the architecture of agency itself. If the ideal agent is modular, then indirect norms are not second-best compromises for limited beings; they are constitutive features of ideal agency. This would be a significant shift from the standard view, which treats indirectness as a concession to human weakness. In the modular model, even an ideal, non-human agent might require modularity to function optimally. The firewalls are features, not bugs.

  However, we must be careful not to simply redescribe the two-level model in computational terms. The key difference is the rigidity of the firewall. In the standard two-level model, the agent can choose to switch levels. In the modular model, the Executive Module *cannot* switch levels. It lacks the access required to do so. This inability is not a lack of power but a structural constraint. The normative question is whether this structural constraint carries normative weight. Is it good that the Executive Module cannot access the criterion? If yes, then indirect normativity is robust. If no, and the constraint is merely instrumental, then we risk the collapse objection.

  The collapse objection argues that the Architect Module is simply engaging in direct normativity. The Architect directly calculates the best architecture. The Executive Module is just a tool, like a hammer or a software script. If the Executive Module is merely a tool, then the agent is just the Architect. The agent is directly optimizing the architecture, and the "indirectness" is just the behavior of the tool. In this view, the agent is still a unified entity (the Architect) using a subroutine (the Executive). The normativity is direct at the level of the Architect.

  To resist this collapse, we must argue that the Executive Module is not merely a tool but a constitutive part of the agent's deliberative capacity. The agent *is* the system, not just the Architect. The deliberation of the agent is the distributed process across both modules. If the Executive Module's rule-following is part of the agent's deliberation, then the agent is deliberating indirectly. The normativity is not just in the design choice but in the execution of the design. The agent ought to follow the rule *during execution*, not just because the rule was chosen wisely, but because the act of following the rule without recalculation is itself a normative requirement of the modular architecture.

  This distinction is subtle but crucial. In the tool view, the normativity ends at the design phase. Once the tool is built, using it is non-normative mechanical behavior. In the modular agent view, the operation of the Executive Module is still agential behavior. It is subject to normative assessment. If the Executive Module malfunctions and accesses the fundamental criterion, it is acting wrongly, not just inefficiently. This suggests that the indirect normativity binds the Executive Module directly, even though the justification for that binding comes from the Architect level.

  This project will explore whether this distinction holds. Can we make sense of normative binding on a subsystem that lacks access to the justification for the binding? Typically, normative reasons must be accessible to the agent to be binding. If the Executive Module cannot access the reason (the optimization of the whole), can it be bound by the rule? Or is the rule merely a causal constraint? If it is merely causal, then the agent is not following a norm indirectly; the agent is causing behavior that aligns with norms. This would dissolve the normativity entirely. Therefore, a key task of this project is to establish the normative status of the Executive Module's operations. I will argue that the normative status derives from the module's role within the integrated system. The module has a functional normativity derived from its contribution to the system's success.

  ## 4. Case Study: The Toxin Puzzle Reframed

  To test the viability of the modular model, I will apply it to Kavka's Toxin Puzzle. This puzzle is a standard stress test for theories of intention and rational commitment. In the original puzzle, an eccentric billionaire offers you a million dollars if you intend to drink a harmless but painful toxin tomorrow at noon. The money is deposited tonight if you form the intention. You do not actually have to drink the toxin to get the money; you only have to intend to drink it. However, once you have the money, you have no reason to drink the toxin, since the money is already secured and drinking the toxin only causes pain. Knowing this, it seems impossible to form the intention in the first place, because you know you will not drink it tomorrow.

  In the standard unified agent model, this creates a paradox of rational intention. You cannot intend to do what you know you will not do. Any attempt to intend is undermined by the knowledge of your future rationality. Solutions typically involve arguing that agents can bind themselves, or that there is value in being the kind of person who keeps commitments, or that the puzzle reveals limits on the transitivity of rationality. All these solutions struggle with the unity of the agent. The agent today and the agent tomorrow are the same entity, sharing the same knowledge and rationality.

  In the modular model, we reframe the Toxin Puzzle as an inter-module conflict. We can posit that the intention formation happens at the Architect level, while the execution happens at the Executive Module. The Architect Module calculates that acquiring the million dollars is optimal. To acquire the dollars, the system must generate an intention to drink. The Architect Module can install a command in the Executive Module: "Drink the toxin at noon." The firewall ensures that the Executive Module does not access the information that the money is already secured or that drinking is instrumentally useless at the time of execution.

  At noon, the Executive Module receives the input "noon" and executes the command "drink." It does not recalculate the utility of drinking because it lacks access to the utility function. It simply follows the rule. The paradox is dissolved because the knowledge that undermines the intention is held by the Architect, while the action is performed by the Executive. The Executive does not know the money is secured; it only knows the rule. Therefore, it can genuinely intend and execute the action.

  This seems to solve the puzzle neatly. However, the philosophical work lies in analyzing whether this solution preserves the normative distinctions we care about. Does this count as *you* intending to drink the toxin? If the Executive Module is just a subroutine, then *you* (the Architect) did not intend to drink; you intended to program a subroutine to drink. This shifts the object of the intention. The offer was that you must intend to drink, not that you must intend to program yourself to drink. If the modular split changes the content of the intention, the solution fails to address the original puzzle.

  To address this, I will argue that in a modular agent, the intention of the system is the output of the Architect Module implemented by the Executive Module. The system's intention is distributed. The Architect intends the plan, the Executive intends the action (within its limited scope). The unity of the intention is maintained by the functional link between the modules. Therefore, the system as a whole intends to drink the toxin, even if the executing component lacks the full context.

  Furthermore, this reframing allows us to test the collapse objection. If the Architect Module simply views the Executive as a tool, then the Architect is directly maximizing utility by manipulating a tool. The normativity is direct. However, if the Executive Module is a deliberative subsystem with its own normative constraints, then the system is engaging in indirect normativity. The Executive Module is following a norm ("drink at noon") that it cannot justify directly. The justification exists only at the Architect level.

  I will explore variations of the puzzle to stress-test this. What if the Executive Module has partial access? What if the firewall is leaky? If the Executive Module suspects the money is secured, does the intention collapse? This allows us to map the boundaries of the modular solution. It also allows us to compare the modular solution to standard solutions like self-binding or dispositional accounts. The modular account offers a structural explanation where others offer psychological or temporal explanations.

  The Toxin Puzzle also highlights the issue of responsibility. If the Executive Module drinks the toxin and suffers pain, who is responsible? The Architect, for programming it? Or the Executive, for following the order? If the agent is unified, the agent is responsible. But if the agent is modular, does this fragment responsibility? For the purposes of normative theory, we need to maintain unified responsibility. I will argue that responsibility resides at the system level. The system is responsible for the design and the execution. The internal division does not absolve the system of the outcome.

  This case study will serve as the proof of concept for the modular model. If it can resolve the Toxin Puzzle without altering the normative stakes (i.e., without changing the definition of intention or responsibility), then it provides strong evidence that modularity is a viable framework for understanding indirect normativity. If it fails, it suggests that modularity either dissolves the agency or collapses into direct manipulation.

  ## 5. The Collapse Question: Distinction or Reduction?

  The most critical section of this project is the analysis of whether the modular model saves indirect normativity or reduces it to direct normativity. This is the "Collapse Question." As noted earlier, if the Architect Module is simply optimizing the system directly, then the normativity is direct. The rules followed by the Executive Module are just causal levers pulled by the Architect.

  To argue against collapse, I must demonstrate that the Executive Module's adherence to the rule has normative significance independent of the Architect's calculation. This means showing that the Executive Module is not just a tool but a locus of normative assessment. There are two ways to approach this.

  First, the Epistemic Argument. The Executive Module operates under different epistemic constraints than the Architect. It has access to local information but not global criteria. Its rationality is defined relative to its information set. Therefore, it is rational for the Executive Module to follow the rule, even if it is irrational for the Architect to follow the rule without calculation. Since rationality is relative to the module's position, the normativity is distinct. The Executive Module is following an indirect norm relative to the global criterion, but a direct norm relative to its local inputs. This suggests that indirect normativity is perspective-dependent. It is indirect from the system view but direct from the module view.

  Second, the Integrity Argument. If the Executive Module were to bypass the rule and calculate directly (if it could), it would violate the integrity of the system's design. The normativity lies in maintaining the architectural integrity. Following the rule is a way of honoring the division of labor that makes the agent effective. This gives the rule a normative force that is not merely instrumental. It is constitutive of the agent's identity as a modular system.

  However, the reductionist counter-argument is strong. One could argue that the "system view" is the only view that matters for normative theory. The modules are just parts. We assess the whole. From the view of the whole, the Architect is directly optimizing. The behavior of the Executive is just the output of that optimization. Therefore, all normativity reduces to the Architect's direct optimization. The "indirectness" is an illusion created by looking at the parts rather than the whole.

  I will argue that this reductionist view fails because it ignores the functional reality of the deliberation. The deliberation *happens* in the modules. If the Executive Module does not deliberate (or deliberates differently), then the system's deliberation is different. We cannot ignore the process and look only at the output. Normative theory is concerned with how agents reason, not just what they do. If the reasoning process is modular and indirect, then the normativity is indirect. The structure of the reasoning matters.

  Furthermore, if we accept the reductionist view, we lose the ability to explain why agents should not tamper with their own modules. If the Architect is all that matters, why shouldn't it rewrite the Executive Module every time a new situation arises? The answer is efficiency and stability. But if the normativity is only about efficiency, it is direct consequentialism. To preserve indirect normativity, we need to show that there is a normative constraint on the Architect's ability to rewrite the Executive. The Architect ought to respect the autonomy of the Executive Module within its domain. This suggests a deontological constraint within the consequentialist framework, mediated by the architecture.

  This section will delve into these arguments, weighing the reductionist pressure against the structural defense. I will aim to show that while the justification for the architecture is direct (consequentialist), the operation of the architecture is genuinely indirect. This hybrid status is where the distinctiveness of indirect normativity lies in a modular framework. It is not purely indirect nor purely direct; it is architecturally mediated.

  ## 6. Methodology and Conceptual Modeling Plan

  The method for this project is primarily conceptual modeling. I will not be conducting empirical research or surveys. Instead, I will construct logical models of agent architecture and test them against normative intuitions and paradoxes.

  **Phase 1: Model Construction (Weeks 1-3)**
  I will formally define the Modular Agent Model. This involves specifying the inputs, outputs, and information constraints of the Architect and Executive Modules. I will define the "firewall" precisely: is it an epistemic barrier, a volitional barrier, or both? I will also define the unity conditions: what makes these modules one agent? This phase will result in a working definition of the modular agent that can be used for analysis.

  **Phase 2: Case Study Application (Weeks 4-6)**
  I will apply the model to the Toxin Puzzle. I will write out the scenario in terms of module interactions. I will explore variations: what if the firewall is permeable? What if the Executive Module has limited optimization capabilities? I will compare the outcome of the modular model to the standard unified model. I will document where the modular model resolves paradoxes and where it creates new ones.

  **Phase 3: Collapse Analysis (Weeks 7-9)**
  I will focus on the Collapse Question. I will formulate the strongest possible reductionist argument against the modular model. I will then develop counter-arguments based on the Epistemic and Integrity arguments outlined above. I will test these arguments against other normative puzzles, such as the Paradox of Hedonism or problems of moral luck, to see if the modular model holds up across different contexts.

  **Phase 4: Synthesis and Writing (Weeks 10-12)**
  I will synthesize the findings into the final paper. I will ensure that the distinction between architectural indirectness and strategic indirectness is clear. I will refine the scope and acknowledge limitations. I will finalize the argument regarding the normative status of the Executive Module.

  Throughout this process, I will maintain a critical stance. I will actively look for ways the model fails. The goal is not to prove the modular model is perfect, but to determine whether it offers a viable alternative to the unified agent model for understanding indirect normativity.

  ## 7. Scope, Feasibility, and Failure Conditions

  **Scope Check:**
  Is this too ambitious for one semester? The topic touches on philosophy of mind, action theory, and normative ethics. A full defense of moral modularity would be a dissertation topic. However, the scope of this project is limited to the *implications* of modularity for indirect normativity. I am not defending modularity as a complete theory of mind. I am using it as a conceptual tool to test the stability of indirect normativity. This limits the scope to the normative implications, not the metaphysical grounding of the modules. I will assume the possibility of modular agency for the sake of argument and focus on the normative consequences. This makes the project feasible within a semester.

  The word count target of 6000 words is appropriate for a deep dive into this specific niche. It allows for sufficient exposition of the model and the collapse argument without requiring a full literature review of modularity in cognitive science. I will focus on the philosophical literature regarding indirect normativity and agency.

  **Feasibility:**
  The conceptual modeling method is feasible within the timeframe. It does not require external data collection. The primary risk is getting bogged down in the metaphysics of personal identity. I will avoid deep dives into what constitutes a "person" and focus on what constitutes an "agent" for the purposes of normative theory. An agent is a system that acts on reasons. Whether it is a person is secondary.

  **Failure Conditions:**
  It is crucial to define what constitutes failure for this project. This ensures intellectual honesty and clarity.

  1.  **Total Reduction:** If I find that the modular model is fully reducible to standard direct normativity without any residual normative distinction, the project fails to establish indirect normativity as a distinct category. In this case, the conclusion would be that indirect normativity is merely a descriptive feature of complex systems, not a normative one. This is a valid negative result, but it means the primary hypothesis is false.
  2.  **Agency Dissolution:** If the modular model fragments the agent so severely that we can no longer speak of a single agent responsible for actions, the model fails to solve the normative problems. It solves the paradox by destroying the agent. This would mean the model is normatively useless.
  3.  **Ad Hoc Architecture:** If the firewalls between modules must be justified by direct normative calculations in every instance, then the architecture is not stable. It collapses into direct normativity at the design level. If I cannot show that the architecture itself has normative stability independent of constant recalculation, the model fails.
  4.  **Triviality:** If the modular model turns out to be just a metaphorical redescription of the two-level view without adding explanatory power, the project is trivial. I need to demonstrate that the modular model solves problems the two-level view cannot (e.g., the self-undermining knowledge problem).

  **Mitigation:**
  To mitigate these risks, I will focus heavily on Section 5 (The Collapse Question). I will ensure that I articulate clearly why the architectural constraints are normative and not just causal. I will also limit the claims of the project. I will not claim to solve all problems of indirect normativity, only to show that the modular model offers a distinct and viable perspective that avoids the pitfalls of the unified agent model.

  If the project trends towards failure condition 1 (Total Reduction), I will pivot to analyzing *why* the reduction happens. Is it a flaw in the model, or does it reveal that indirect normativity is indeed illusory? This pivot would still yield a valuable seminar paper, even if it contradicts the initial hypothesis. The goal is rigorous analysis, not confirming a bias.

  ## 8. Conclusion

  This proposal outlines a project to reconfigure the debate on indirect normativity through the lens of modular agency. By challenging the assumption of the unified agent, we open up new possibilities for understanding how norms can be indirect without being irrational or self-undermining. The modular model suggests that indirectness is not a strategy of the mind but a structure of the agent.

  The project will rigorously test this model against the Toxin Puzzle and the collapse objection. It aims to determine whether indirect normativity survives the transition to a modular architecture or whether it dissolves into direct optimization. Either result is philosophically significant. If indirect normativity survives, it gains a new foundation in architectural integrity. If it collapses, it reveals the limits of indirect theories even under idealized conditions.

  The scope is managed to ensure completion within one semester, focusing on conceptual modeling rather than empirical defense of modularity. The failure conditions are clear, ensuring that the project remains critical and self-reflective. This approach promises to move beyond the standard regurgitation of the two-level debate and offer a niche but rigorous contribution to the seminar's discussion on practical reason.

  The ultimate goal is to show that the architecture of deliberation is not neutral. It is part of the normative landscape. How we build our minds (or how our minds are built) determines what norms we can follow. By making this explicit, we can better understand the limits and possibilities of indirect normativity. This project seeks to map those limits.

  ## 9. Detailed Argumentative Pathways and Contingencies

  To ensure the 6000-word target is met with substance rather than filler, I will expand on specific argumentative pathways within the sections outlined above. Here I detail the specific philosophical moves I intend to make to flesh out the core sections.

  ### Expanding the Critique of Unity (Section 2)
  In the section on the Unified Agent, I will not merely state that unity is problematic; I will demonstrate the logical friction. I will elaborate on the "transparency of rationality." If an agent is rational, their beliefs and intentions must cohere. Indirect normativity requires a coherence break (believing X is best, intending Y). In a unified agent, this is akrasia. In a modular agent, it is division of labor. I will spend significant word count distinguishing *synchronic* unity (at one moment) from *diachronic* unity (over time). The standard model relies on diachronic unity (I commit now to follow later). The modular model relies on synchronic division (Part A commits, Part B follows). This distinction is crucial and warrants detailed exposition. I will argue that diachronic unity is insufficient to solve the Toxin Puzzle because the future self has the same knowledge as the present self. Synchronic division is required to segregate the knowledge.

  ### Expanding the Modular Architecture (Section 3)
  I will provide a more granular description of the modules. I will consider a three-module system: Sensor, Executive, Architect. The Sensor gathers data. The Executive acts. The Architect designs. This adds complexity and allows for more nuanced discussion of information flow. For example, can the Sensor tell the Executive about the money in the Toxin Puzzle? If the Sensor is part of the Executive's input, the firewall is breached. This leads to a discussion of "information sanitization." The Architect must sanitize inputs before they reach the Executive. This process of sanitization is itself a normative act. I will explore the ethics of self-manipulation. Is it permissible for the Architect to hide truth from the Executive? This touches on autonomy. If the Executive is part of me, am I violating my own autonomy by hiding truth from myself? I will argue that in a modular system, autonomy is systemic, not local. The system is autonomous if the Architect is free. The Executive's lack of information is compatible with systemic autonomy. This distinction allows for a robust defense against autonomy objections.

  ### Expanding the Toxin Analysis (Section 4)
  I will run multiple iterations of the Toxin Puzzle.
  *Iteration 1:* Standard Modular Setup. Architect intends, Executive drinks.
  *Iteration 2:* Leaky Firewall. Executive suspects the money is secured. Does intention degrade gradually? This tests the stability of the modular solution.
  *Iteration 3:* Executive Rebellion. Executive Module has its own optimization function. It refuses to drink. This tests the authority of the Architect. Is the Architect normative or just causal? If the Executive can rebel, the unity of the agent is threatened. I will argue that normative unity requires the Executive to be bound by the Architect's design, not just causally constrained. This brings in concepts of internal authority.

  ### Expanding the Collapse Objection (Section 5)
  I will dedicate significant space to the "Homunculus Problem." If the Architect is optimizing, isn't the Architect just a little person inside the head? And if the Architect is rational, doesn't it face the same problems as the unified agent? To avoid infinite regress, I must argue that the Architect operates at a level of abstraction where the paradoxes do not arise. The Architect deals with types of actions, not tokens. The Toxin Puzzle arises at the token level (this specific drink). The Architect solves it at the type level (policies of drinking). I will argue that paradoxes of intention are token-level phenomena. Therefore, the Architect is safe from them. This limits the scope of the collapse objection. The Architect is directly normative about types, which results in indirectly normative behavior about tokens. This distinction between type-level directness and token-level indirectness is a key philosophical contribution I aim to develop.

  ### Expanding Scope and Failure (Section 7)
  I will elaborate on the pedagogical value of the project. Even if the model fails, it clarifies the commitments of indirect normativity. It forces us to specify what we mean by "agent." This meta-ethical clarification is valuable for the seminar. I will also discuss the potential for future research. If this semester project succeeds, it could lead to a thesis on modular moral psychology. This shows the scalability of the idea.

  ## 10. Final Reflections on Normative Architecture

  In concluding the proposal, I want to emphasize the broader implication of treating architecture as normative. Traditionally, normative theory treats the agent as a black box. Inputs (reasons) go in, outputs (actions) come out. The internal processing is assumed to be uniform (rational deliberation). This project opens the black box. It suggests that the internal processing structure is itself a subject of normative evaluation. We ought to build ourselves (or be built) in certain ways.

  This aligns with virtue ethics, which focuses on character structure, but it adds a computational/structural layer. It also aligns with consequentialism, which focuses on outcomes, but it acknowledges that outcomes depend on structure. It is a synthesis that avoids the pitfalls of both. It avoids the rigidity of rule worship by grounding rules in architectural optimization. It avoids the instability of act optimization by grounding it in structural constraints.

  By framing the proposal this way, I ensure that it is not just a technical exercise in modeling but a substantive contribution to normative theory. It challenges the seminar to think about agency not as a given but as a construct. This fits the "practical-reason" theme by examining the practical conditions of reasoning itself.

  The 6000-word count allows me to explore these reflections in depth. I will not rush the conclusion. I will summarize the argument, restate the significance, and leave the reader with the open question of whether we are willing to accept modular agency as the price of normative stability. This rhetorical closing reinforces the philosophical weight of the project.

  In sum, this proposal is designed to be rigorous, innovative, and feasible. It addresses a specific gap in the literature (the agent model in indirect normativity) using a specific tool (modular modeling) and a specific test (Toxin Puzzle). It acknowledges its limits and defines its success conditions clearly. It is ready for seminar-level scrutiny.

