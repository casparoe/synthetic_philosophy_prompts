  ## Principle on Advocacy and Testimony

  By choosing the **Cautionary Note**, we adopt the principle that **patient testimony regarding identity and harm is evidentially weighty for access decisions, but not for validity decisions.**

  If we narrowed the criteria over their explicit objection, we would be committed to the view that the classified people's testimony about their own illness is secondary to epidemiological data. Specifically, we would be asserting that their experience of the condition may be iatrogenic (produced by the label itself). This is not fatal to the enterprise, provided we acknowledge the distinction. Item 5 and Item 6 already establish that patient voice does not veto epidemiological or care-pathway logic. Item 1 shows we value voice for validation, but Item 7 shows we will intervene even if it complicates the narrative. We can live with this commitment: we validate their suffering (access) without validating the etiology (note).

  ## Inconsistencies in the Record

  1.  **Item 1 vs. Item 5:** In Item 1, we argued that naming a condition stops it from being dismissed as "in their heads." In Item 5, we argued that naming a condition might *create* the phenomenon ("in their heads" via social contagion). We treat the label as a shield in one context and a vector in the other without a clear rule for distinguishing when it is which.
  2.  **Item 6 Rationale:** The rationale states "there was no plausible mechanism by which being classified would change what it's like to be that patient." This is likely false. Classification changes how *others* treat the patient (caregivers, insurers), which changes what it is like to be the patient. The rationale does work to justify the decision, but the factual claim is weak compared to the "Care Pathway" logic used in Item 1.

  ## Words vs. Substance

  Your hunch is correct. For the person holding the diagnosis, **"Narrow the criteria," "Demote to a research appendix," and "Remove"** are substantively the same act: **loss of accommodations.** The mechanism matters to us (validity vs. status), but to the patient, the outcome is identical (insurance denial, loss of school support).

  However, **"Attach a Cautionary Note"** is substantively different from the other three. It preserves the legal utility of the code while changing the clinical culture around it. The upcoming fight will treat "Note" as a compromise, but advocacy groups may correctly identify it as a warning shot toward future removal. The substance of the fight is not about the text of the manual, but about **who bears the risk of error:** the system (if we keep loose criteria) or the patient (if we narrow them). The Note shifts the risk to the clinician's judgment, which is the only option that doesn't force a binary choice between validity and access.
