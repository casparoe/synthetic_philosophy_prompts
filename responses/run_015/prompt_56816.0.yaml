  # Recommendation: Attach a Cautionary Note

  ## Decision and Rationale
  The committee should **attach a cautionary note** to the existing category, explicitly flagging the steep climb in reported rates and urging clinicians to consider whether current presentations capture normal variation or label-driven phenomena. This decision aligns most closely with **Item 7** in our record, where a similar intervention demonstrably flattened a prevalence curve without removing the category.

  This approach balances our competing precedents better than the alternatives. It acknowledges the epidemiological concerns raised in **Item 5** (label-driven prevalence) and **Item 2** (threshold integrity) without triggering the access harms warned against in **Item 1** and **Item 6**.

  **Argument Against "Leave It Alone":**
  Doing nothing violates the precedent set in **Item 7**. We have established that the committee has a duty to intervene when reported rates climb steeply in ways that suggest diagnostic inflation. Ignoring a thirty-fold increase contradicts our own finding that naming interventions bend prevalence trends. If we accept that our manual influences clinical behavior (Item 7), silence constitutes endorsement of the current trajectory.

  **Argument Against "Narrow the Criteria" or "Remove":**
  While narrowing criteria aligns with **Item 2** (threshold integrity), it directly conflicts with **Item 1** and **Item 6**. In Item 1, we approved a category specifically to secure treatment coverage and validate patient reality. In Item 6, we approved a category despite patient voicelessness because "no name meant no care pathway." Here, advocacy groups explicitly state that narrowing or removing the category would strip accommodations. Unless we are prepared to assert that these accommodations are illegitimate (a claim we lack data to support, per Item 5), removing the pathway violates our commitment to utility. A note allows us to signal skepticism to clinicians without legally stripping patients of resources.

  ## Precedent Analysis

  **Closest Analog: Item 7**
  Item 7 is the controlling precedent. It involves an existing category with steeply climbing rates where the committee attached a cautionary note rather than changing criteria or removing the diagnosis. The outcome was successful (flattened curve). The live proposal matches the conditions (existing category, prevalence spike) and the available tool (cautionary note) exactly.

  **Misleading Analog: Item 5**
  Item 5 looks similar because it involves online spread and unclear prevalence data. However, leaning on Item 5 would mislead us. Item 5 concerned a *new* proposal where we could prevent ratification entirely. This live proposal concerns an *existing* category with entrenched reliance. Rejecting a new box (Item 5) prevents harm; removing an old box creates new harm (loss of access, per Item 1/6). The resemblance is superficial because the procedural stakes (creation vs. destruction of a pathway) are opposite.

  ## Implicit Rules and Reconstruction

  Our record suggests two competing implicit rules that govern our decisions:

  1.  **The Care Pathway Principle:** A category is justified if it unlocks necessary resources or treatment, regardless of patient voice or ontological purity. (Supported by Items 1, 6).
  2.  **The Epidemiological Integrity Principle:** A category must be restricted if its prevalence is driven by the label itself or if thresholds are too loose to distinguish pathology from variation. (Supported by Items 2, 5, 7).

  **Undistinguishable Conflict:**
  Our record cannot distinguish how to weigh these rules when *both* apply equally. In Item 1, we prioritized Care Pathway over purity (approved despite residual code existence). In Item 5, we prioritized Integrity over Care Pathway (rejected despite petitions for help). We have no precedent where a category *already existed* (unlocking care) but *then* failed Integrity checks. Item 7 hints at a compromise (note), but doesn't establish a hierarchy.

  **Hypothetical to Distinguish:**
  Consider a future proposal for a developmental variation where parents demand the label to secure school services (Care Pathway Principle says **Approve**), but longitudinal data shows the variation resolves without intervention regardless of the label, and the label itself increases dependency (Epidemiological Integrity Principle says **Reject**).
  *   If we approve: We prioritize Care Pathway over long-term validity.
  *   If we reject: We prioritize Integrity over immediate resource access.
  *   *Current Record:* Item 6 suggests we prioritize Pathway even without voice. Item 5 suggests we prioritize Integrity even with voice. We don't know which wins when Pathway exists *and* Integrity is compromised.

  | Option | Care Pathway Principle (Items 1, 6) | Epidemiological Integrity Principle (Items 2, 5, 7) |
  | :--- | :--- | :--- |
  | **Attach Note (Recommended)** | **Preserves.** Access remains intact; accommodations stay valid. | **Satisfies.** Signals skepticism; aims to flatten prevalence curve as per Item 7. |
  | **Narrow Criteria** | **Violates.** Risks stripping accommodations; creates "false negative" patients. | **Satisfies.** Restores threshold integrity; reduces label-driven prevalence. |
