answer: |-
  **1. Essay Prompt**

  **Course:** PHI405 – Advanced Metaethics
  **Exam:** Final Assessment (Closed Book)
  **Time Allowed:** 90 Minutes
  **Total Marks:** 30

  **Instructions to Candidates**

  Hey everyone, welcome to the final. Since this is closed book, dont worry about memorising specific dates or obscure paper titles. We care about your ability to wield the concepts we've discussed throughout the term. You wont recieve any credit for name-dropping authors without explaining the underlying argument, and please do not include a bibliography or reading list at the end. We know where the ideas come from; we want to see how you use them.

  Below is a hypothetical policy scenario. Read it carefully. Your task is to analyse the normative structure of this policy using the tools of metaethics, specifically focusing on the Wrong-Kind-of-Reasons (WKR) problem.

  **Scenario: The National Virtue Ledger**

  The Republic of Normavia has recently passed the "Civic Integrity Act." Under this act, the government has launched the Virtue Ledger, a centralised digital database managed by the Office of Civic Integrity (OCI). The Ledger tracks auditable charitable acts performed by citizens. These acts include donating to registered nonprofits, volunteering at shelters, or blood donation. Private acts of kindness (like helping a neighbour carry groceries) are not captured unless reported by a third party and verified by OCI algorithms.

  Each citizen is assigned an "Integrity Score" (0–100) based on the frequency and monetary value of these acts. The Ledger is public; anyone can look up a citizen's score via a government app. The policy has two main mechanisms for influencing behaviour:

  1.  **The Carrot:** Citizens who maintain an Integrity Score above 80 for a fiscal year recieve a 5% income tax rebate. This is framed by the government not as a payment, but as a "recognition of civic contribution."
  2.  **The Stick:** There is no legal penalty for a low score. However, because the data is public, employers, landlords, and potential romantic partners often check scores. A score below 30 carries significant social stigma and often results in reduced economic opportunities, though this is technically private sector discrimination, not state punishment.

  The government argues that the Ledger does not force anyone to be generous. It merely makes generosity visible and aligns civic virtue with prudential benefit. They claim this gives citizens *reasons* to be generous that they might otherwise lack.

  **The Philosophical Task**

  Your essay must address the following question: **Does the Virtue Ledger provide citizens with the *right kind* of reasons to be generous, or does it fundamentally corrupt the normative status of charitable action?**

  In answering this, you must engage directly with the Wrong-Kind-of-Reasons (WKR) problem. Recall that the WKR problem typically arises in contexts of fitting attitudes (like admiration or belief), where pragmatic benefits (like being paid to admire someone) seem to provide a reason for the attitude, but not the *right kind* of reason to make the attitude fitting or virtuous. Here, the context is action (generosity) rather than attitude, but the structural problem is analogous.

  You need to distinguish between the types of reasons the Ledger generates. Are they moral reasons? Prudential reasons? Social reasons? Does the presence of the tax rebate and the social stigma crowd out the moral value of the act, or does it merely accompany it?

  Furthermore, you must utilise one specific philosophical framework to ground your analysis. You might choose the Internal vs. External Reasons distinction (Williams vs. Rationalists), or a specific account of normative authority. For example, if you argue that moral reasons must be internal to the agent's subjective motivational set, does the Ledger create internal reasons where none existed? Or does it merely add external pressure that mimics motivation? Alternatively, if you argue for external rationalist reasons, does the Ledger help agents align with objective moral truths, or does it obscure them?

  **Specific Requirements**

  1.  **Define the WKR Problem:** Clearly state what the WKR problem is in this context. Do not confuse this with the psychological "overjustification effect" (where intrinsic motivation drops due to extrinsic rewards). We are interested in the *normative* classification of the reason, not the psychological causal mechanism.
  2.  **Categorise Reasons:** You must distinguish at least three types of reasons present in the scenario (e.g., the moral reason to help, the prudential reason to save tax, the social reason to avoid stigma). Explain how they interact.
  3.  **Apply a Framework:** Use the Internal/External reasons distinction (or equivalent) to argue whether the Ledger's incentives can ever constitute moral reasons.
  4.  **Conclusion on Corruption:** Conclude with a non-trivial claim about whether the institution corrupts the virtue or merely accompanies it. Can the Ledger be redesigned to avoid the WKR problem, or is the problem inherent to state-managed virtue signaling?

  **Formatting and Submission**

  Write your answer in the provided booklet. There is no strict word count, but given the 90-minute limit, a focused essay of roughly 1000–1500 words is expected. Do not waste time on introductions that restate the prompt. Get straight to the argument.

  Remember: No bibliographies. If you cite a specific argument (e.g., "the demon example"), explain it briefly. We are testing your understanding, not your memory of the reading list. If you dont engage with the distinction between normative force and motivational power, you will lose significant marks.

  Good luck. Think clearly.

  ***

  **2. Model Answer Outline**

  **I. Introduction: The Normative Structure of the Ledger**
  *   **Thesis:** The Virtue Ledger generates pragmatic reasons (prudential/social) that are the *wrong kind* of reasons to constitute moral virtue, regardless of whether they successfully motivate action.
  *   **Roadmap:** Define WKR in this context, categorise the three reason types, apply the Internal/External reasons framework, and conclude on institutional corruption.

  **II. The Wrong-Kind-of-Reasons (WKR) Problem**
  *   **Definition:** Distinguish between reasons that make an act *right* (right-kind) vs. reasons that make it *beneficial to perform* (wrong-kind).
  *   **Application:**
      *   *Right Kind:* The suffering of the beneficiary creates a moral demand.
      *   *Wrong Kind:* The tax rebate creates a prudential demand; the stigma creates a social demand.
  *   **Crucial Distinction:** Explicitly note this is not the psychological overjustification effect. Even if the citizen *feels* motivated morally, the normative ground of the Ledger's incentive is pragmatic. The WKR problem asks if the reason counts towards the *virtue* of the act, not just the *frequency* of the act.

  **III. Categorising the Reasons (Three Types)**
  *   **1. Moral Reasons:** Agent-neutral or agent-relative duties to alleviate suffering. These exist independently of the Ledger.
  *   **2. Prudential Reasons:** The 5% tax rebate. This is self-interested. Acting *for* this reason instrumentalises the beneficiary (using them as a means to a tax break).
  *   **3. Social/Reputational Reasons:** Avoiding stigma. This is heteronomous (controlled by others). Acting to avoid shame is not acting out of goodwill.
  *   **Interaction:** The Ledger conflates these. It treats prudential/social reasons as if they were proxies for moral reasons (the "Integrity Score"). This is the category error.

  **IV. Philosophical Framework: Internal vs. External Reasons**
  *   **Internalism (Williams):** A reason must connect to the agent's subjective motivational set (SMS).
      *   *Analysis:* The Ledger might successfully create an internal reason (I want money -> I donate). However, this internal reason is prudential, not moral. It does not bridge the gap to moral motivation.
  *   **Externalism/Rationalism:** Moral reasons exist regardless of SMS.
      *   *Analysis:* The Ledger obscures external moral reasons by overlaying them with loud pragmatic incentives. Agents might follow the external moral rule (donate) but for the wrong normative ground (tax).
  *   **Synthesis:** Whether Internal or External, the *quality* of the reason provided by the Ledger is pragmatic. It cannot transform a prudential reason into a moral one simply by labeling it "Civic Integrity."

  **V. Conclusion: Corruption vs. Accompaniment**
  *   **Corruption Claim:** The Ledger corrupts the social meaning of generosity. It turns virtue into a currency.
  *   **Redesign Possibility:** Can it be fixed?
      *   *Option A:* Remove incentives. (Then why have the Ledger?)
      *   *Option B:* Make it private. (Removes stigma, but keeps tax rebate issue).
      *   *Verdict:* The problem is inherent to state-audited virtue. You cannot incentivise the *right kind* of reason without changing the reason to the *wrong kind*. The institution necessarily corrupts the motivation by changing the normative landscape.
  *   **Final Thought:** The Ledger produces compliant behaviour, not virtuous agents.

  ***

  **3. Marking Rubric (Total 30 Marks)**

  | Criterion | Marks | Description |
  | :--- | :---: | :--- |
  | **Statement of WKR Problem** | **8** | **7-8:** Clearly defines WKR as a normative distinction (fittingness vs. pragmatic benefit). Explicitly distinguishes it from psychological overjustification.<br>**4-6:** Defines WKR but conflates it with psychological motivation or fails to apply it to the Ledger.<br>**0-3:** Vague definition; treats WKR as simply "bad reasons." |
  | **Application & Reason Types** | **10** | **9-10:** Precisely distinguishes three types of reasons (Moral, Prudential, Social). Explains how the Ledger conflates them.<br>**5-8:** Identifies two types or lists three without explaining the normative conflict.<br>**0-4:** Fails to distinguish reason types; treats all incentives as identical. |
  | **Philosophical Framework** | **7** | **6-7:** Robust engagement with Internal/External reasons (or equivalent). Shows how the framework illuminates the Ledger's failure/success.<br>**3-5:** Mentions the framework but applies it superficially.<br>**0-2:** No clear framework used; relies on intuition only. |
  | **Conclusion (Corruption vs. Accompaniment)** | **5** | **5:** Non-trivial conclusion. Addresses whether redesign is possible or if corruption is inherent.<br>**3-4:** Generic conclusion (e.g., "It is bad") without structural analysis.<br>**0-2:** No clear conclusion or contradicts earlier argument. |
  | **Penalties** | **-** | **Name-Dropping:** -2 marks for citing authors without explaining arguments.<br>**Bibliography:** -2 marks for including a reference list.<br>**Typos/Clarity:** No penalty for minor typos, but poor structure affects readability marks within criteria. |

  **Examiner Notes:**
  *   Do not reward students for guessing obscure texts. If they mention "Scanlon" but cant explain the distinction between material and formal reasons, treat it as name-dropping.
  *   Ensure the distinction between *normative* WKR and *psychological* crowding-out is strictly enforced in the first criterion. This is a metaethics exam, not a psychology one.
  *   A student can argue the Ledger is *good* policy, provided they acknowledge the reasons are the "wrong kind" for virtue but perhaps acceptable for compliance. Marks are awarded for argumentative coherence, not for agreeing with the prompt's implied criticism.
