      *   Don't ask: "Are generations real?" (Yes/No).
      *   Ask: "Here is a statistic about Gen Z voting. What two alternative explanations must be ruled out before calling this a generational trait?" (Tests APC understanding).

  7.  **Addressing "Settled vs. Contested":**
      *   *Settled:* The APC identification problem is a known methodological hurdle. Hacking's Interactive Kinds is a standard framework.
