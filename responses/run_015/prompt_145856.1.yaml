          *   *Correction/Refinement:* The prompt lists specific misconceptions: "that unreality entails statistical uselessness, that marketing demographics prove reality, or that denying real kinds licenses stereotyping." I need to head these off at specific points.

  3.  **Drafting the Explanatory Arc:**

      *   *Phase 1: The Demographic Prerequisite (The APC Problem).* Before asking "Are they real?", we must ask "Are we measuring what we think we are measuring?"
