answer: |-
  ### The Advance Care Planning Decision Tree

  This tool is designed to help volunteers locate their own ethical intuitions. It does not give legal advice. It maps *why* you might hold a view, not just *what* that view is.

  #### Part 1: The Branch Nodes (The Questions)
  *Tick 'Agree' or 'Disagree' for each claim. Do not worry about where the path leads.*

  1.  **Binding Force:** We must follow the form even if it seems to cause harm or distress to the patient now.
  2.  **Competence Override:** A patient who currently understands the choice can cancel the form, even if they signed it previously.
  3.  **Continuity:** A patient with advanced dementia (who no longer remembers signing) is still bound by their earlier signature.
  4.  **Source of Authority:** The form binds because of the person's *right* to control their life, not because they knew what was medically best.
  5.  **Symmetry:** Refusing treatment is binding in a way that demanding treatment is not.
  6.  **Anticipation:** The form only applies if the patient foresaw this exact medical situation when signing.
  7.  **Decay:** The form should lose force simply because a set time has passed (e.g. a 'sunset clause' after 10 years).

  ***

  #### Part 2: The Logical Map (Where the views live)
  *There are 128 possible answer-combinations ($2^7$). Most are empty. Below are the coherent positions (Leaves) occupied by real ethical views.*

  | Path (1–7) | View Name | Why the earlier self has authority (or doesn't) |
  | :--- | :--- | :--- |
  | **1: Disagree** | **Advisory View** | The form is never binding; it is only evidence of what the patient might want now. |
  | **1: Agree, 2: Agree** | **Contemporary Autonomy** | Authority lives only in the present mind; the past self has no power over a competent later self. |
  | **1: Agree, 2: Disagree, 3: Disagree** | **Best Interest / Epistemic** | Authority exists only because the earlier self was in a better position to judge what is good for the patient. |
  | **1: Agree, 2: Disagree, 3: Agree, 4: Disagree** | **Values-Based View** | Authority comes from the earlier self speaking for the person's enduring values, not their moment-to-moment experience. |
  | **1: Agree, 2: Disagree, 3: Agree, 4: Agree, 5: Agree** | **Libertarian Asymmetry** | Authority is a right to be left alone; we must respect refusals (negative rights) but need not honour demands (positive rights). |
  | **1: Agree, 2: Disagree, 3: Agree, 4: Agree, 5: Disagree, 6: Disagree, 7: Disagree** | **Precedent Autonomy (Dworkin)** | Authority is a continuing exercise of self-determination; the earlier self defines the 'critical interests' of the life as a whole. |
  | **1: Agree, 2: Disagree, 3: Agree, 4: Agree, 5: Disagree, 6: Disagree, 7: Disagree** | **Promissory View** | Authority comes from the signing act being a binding promise to the future self that cannot be broken by change. |
  | **1: Agree, 2: Disagree, 3: Agree, 4: Agree, 5: Disagree, 6: Yes, 7: No** | **Strict Constructionist** | Authority is limited to the specific scenarios the earlier self explicitly imagined and wrote down. |
  | **1: Agree, 2: Disagree, 3: Agree, 4: Agree, 5: Disagree, 6: No, 7: Yes** | **Decay View** | Authority is real but fades over time; the link between selves weakens as the psychological gap widens. |

  ***

  #### Part 3: The Leaves (Descriptions & Commitments)

  1.  **Advisory View**
      *   *Awkward Commitment:* You must ignore the signature if the patient seems content, even if they previously said they would rather die than live this way.
  2.  **Contemporary Autonomy**
      *   *Awkward Commitment:* You must treat a patient in a temporary psychotic relapse who begs for medication, even if their directive (written in health) refused it.
  3.  **Best Interest / Epistemic** (Unnamed in literature, common in practice)
      *   *Awkward Commitment:* If the earlier self was misinformed (e.g. feared pain that modern medicine can manage), you must override the form.
  4.  **Values-Based View**
      *   *Awkward Commitment:* You might have to tube-feed a happy dementia patient if their earlier 'values' prioritised biological life over current happiness.
  5.  **Libertarian Asymmetry**
      *   *Awkward Commitment:* You must withhold life-saving treatment on request, but can ignore a request for pain relief if resources are tight.
  6.  **Precedent Autonomy (Dworkin)**
      *   *Awkward Commitment:* You must prioritise the 'narrative' of the life over the current happiness of the person living it (e.g. honouring a refusal of antibiotics in dementia).
  7.  **Promissory View** (Associated with Altman)
      *   *Awkward Commitment:* The obligation holds even if the earlier self made a rash promise, because breaking promises is inherently wrong.
  8.  **Strict Constructionist**
      *   *Awkward Commitment:* You must treat a patient if the specific illness differs slightly from what they described, even if the spirit of the form is clear.
  9.  **Decay View**
      *   *Awkward Commitment:* A form signed 11 years ago is void, even if the patient's mind and values haven't changed at all.

  ***

  #### Part 4: Limitations & Empty Spaces

  **Two leaves this tree cannot separate:**
  *   **Precedent Autonomy (Dworkin)** and **Promissory View**.
  *   *Why:* Both land on "Right to Decide", "Binds through Dementia", and "No Sunset".
  *   *What would separate them:* A node asking: "Is this binding because it is a *command* to others, or a *promise* to oneself?" Dworkin argues the former (integrity of the life); Promissory theorists argue the latter (moral force of promising).

  **Unoccupied Combinations (and why):**
  *   **Source = Judgement (Node 4 Disagree) + Symmetry = Asymmetry (Node 5 Agree).**
      *   *Why:* Incoherent. If authority comes from the earlier self knowing *best* (epistemic), there is no logical reason why their refusal should count for more than their request. Asymmetry usually requires a *Right* (Node 4 Agree).
  *   **Competence Override = Yes (Node 2 Agree) + Continuity = Binds (Node 3 Agree).**
      *   *Why:* Unattractive/Inconsistent. If a current competent wish overrides the past, it is strange to claim a current *incompetent* wish (dementia) does not.
  *   **The Clinician's Quiet Cell:** Many clinicians operate in **Best Interest / Epistemic** (Node 4 Disagree) but document as if they are **Precedent Autonomy** (Node 4 Agree). They treat the form as binding only when it matches their clinical judgement of what is best.

  ***

  #### Part 5: Test Run (Your Volunteers)

  **Volunteer 1:** *"If she's happy now, the form is just a piece of paper."*
  *   **Path:** Node 1 (Disagree) OR Node 3 (Disagree).
  *   **Likely Leaf:** **Advisory View** (if they think it's *never* binding) or **Best Interest** (if they think it binds only when it matches current welfare).
  *   **Does it match?** Yes. This volunteer prioritises current experience over past authority. The tree identifies them as rejecting the "Binding Force" of the document in the face of current welfare.

  **Volunteer 2:** *"She signed it when she was still herself; happiness isn't the point."*
  *   **Path:** Node 1 (Agree), Node 3 (Agree), Node 4 (Agree).
  *   **Likely Leaf:** **Precedent Autonomy** or **Promissory View**.
  *   **Does it match?** Yes. This volunteer prioritises the integrity of the life narrative (the 'self' that signed) over the current phenomenological state ('happiness'). The tree places them firmly in the 'Right to Decide' camp.

  ***

  *Note for the Volunteers' Room: This tree maps ethical consistency, not legal validity. In a real crisis, always consult the clinical lead.*
