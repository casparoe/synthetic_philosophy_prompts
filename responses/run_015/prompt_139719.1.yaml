answer: |-
  You have stumbled upon the central secret of type design. What you are experiencing does not have a single English noun that captures it perfectly, because it is a tension between three different domains: physics (optics), philosophy (categorization), and craft (calligraphy).

  However, there are three established concepts that, when layered together, describe exactly what you are seeing.

  ### 1. The Mechanism: Optical Compensation
  You noted that geometric identity looks wrong. This is because you are designing for the **eye**, not the **ruler**.

  In type design, the principle that governs this is **Optical Compensation** (or Optical Correction). It is the acknowledgment that the human visual system distorts geometric truth. A horizontal line of the same thickness as a vertical line will look thinner. A curve touching a straight line will look smaller than it is.

  When you say the terminal of the *a*, the ear of the *g*, and the tail of the *y* are "the same stroke," you mean they share the same **Optical Weight**, not the same dimensions. To achieve visual equivalence, they must be geometrically *different*.
  *   **Boundary Case:** If you design a font based strictly on a grid without optical compensation (like some early digital experiments or "monoline" scripts), the letters feel robotic and uneven. The "same stroke" becomes a literal copy-paste, and the alphabet loses its texture.

  ### 2. The Source: Ductus
  You feel these strokes are "one and the same object." In calligraphy and type theory, this is explained by **Ductus**.

  Ductus refers to the direction, flow, and order of the pen strokes that *would* create the letter if it were written by hand. Even if you are drawing with a mouse or vector tools, you are simulating a tool.
  *   The terminal of the *a*, the ear of the *g*, and the tail of the *y* feel like the same object because they imply the **same pen movement**. They suggest the same angle of entry, the same pressure release, and the same flick of the wrist.
  *   **The Cascade:** This explains why changing one forces changes in the others. If you flatten the terminal of the *a*, you have implicitly changed the "pen" you are using (e.g., from a round nib to a chisel nib, or changed the angle of the wrist). If the "pen" has changed, the *g* and *y* must change to reflect the new tool. You aren't adjusting strokes; you are adjusting the **invisible instrument** that created them.

  ### 3. The Logic: Family Resemblance
  You wrote: *"Every rule I write down has exceptions I can see instantly but can't formulate, and the exceptions don't feel arbitrary."*

  This is a textbook description of the philosophical concept **Family Resemblance**, coined by Ludwig Wittgenstein. He used it to describe why we can identify different "games" as games without being able to write a single rule that covers all of them.

  In type design, a style is not a list of rules (e.g., "all terminals are 10 degrees"); it is a cluster of overlapping similarities.
  *   The *a* terminal resembles the *g* ear.
  *   The *g* ear resembles the *y* tail.
  *   But the *a* terminal might not strictly resemble the *y* tail in a measurable way.
  *   **Why it feels inexact:** Because the "rule" is not a geometric constraint; it is a **relationship**. You are maintaining a *ratio of similarity*, not an identity.
  *   **Boundary Case:** This breaks down in "pastiche" fonts, where a designer copies specific features (like a specific curl on a *g*) without understanding the underlying ductus. The letters look like they belong to different families wearing the same hat.

  ### The Cascading Effect: Typographic Color
  You mentioned that changing the *a* made the *s* look foreign and the *e* look too wide. This is **Typographic Color** (or Texture).

  When letters are set together, they create a uniform gray field. Each stroke contributes to this density.
  *   If you thicken the terminal on the *a*, you locally darken that letter.
  *   To the eye, the *a* now looks "heavier" than the *g*.
  *   To restore equilibrium, you must adjust the *g* and *y* to match the new weight.
  *   But now the *n* and *m* (which have vertical stems) might look too light compared to the new, heavier *a*, forcing you to adjust them.
  *   **The Thing:** This is **Systemic Interdependence**. A typeface is not a collection of 26 drawings; it is a single ecosystem. You cannot move one piece without shifting the balance of the whole.

  ### Is this the same as "What makes an *a* an *a*"?
  No. This is a crucial distinction.

  1.  **Categorical Identity (What makes an *a* an *a*):** This is **Semiotics** and **Recognition**. It relies on **Distinctive Features**. An *a* must have a closed counter and a vertical spine to be read as an *a*. If you change these too much, it becomes an *o* or a *u*. This is about **legibility**.
  2.  **Stylistic Coherence (What makes this *a* fit this *g*):** This is what you are describing. It relies on **Family Resemblance** and **Ductus**. This is about **voice**.

  You can have an *a* that is clearly an *a* (Categorical Identity holds) but looks like it belongs to a different font than the *g* next to it (Stylistic Coherence fails).

  ### Summary of Terms
  If you need to label this for your project, you are dealing with **Visual Consistency** achieved through **Optical Compensation**, governed by a consistent **Ductus**, and logically structured by **Family Resemblance**.

  But if you want the single word that captures the "feeling" of the stroke that propagates through the alphabet, type designers often call it the **Voice** or the **DNA** of the typeface. However, the most precise technical description of the phenomenon you can't pin down is **Tacit Knowledge**.

  **Tacit Knowledge** (coined by Michael Polanyi) is knowledge that you possess and can use (you *know* when the *g* looks wrong), but you cannot fully articulate in rules (you *cannot say why*). Type design is almost entirely the management of tacit knowledge. You are training your eye to recognize a truth that your ruler cannot measure.

  ### Boundary Cases (Where it nearly applies but doesn't)
  *   **Eclectic Fonts:** Some contemporary display fonts intentionally break ductus. They might have a geometric *a* and a calligraphic *g*. Here, "Family Resemblance" is intentionally fractured to create tension. The "rule" is that there is no rule.
  *   **Hinting/Pixel Grids:** At very small sizes on screens, optical compensation is sometimes sacrificed for legibility on a pixel grid. The "same stroke" might be rendered as 2 pixels in one letter and 3 in another simply to fit the grid. The "feeling" is lost to the "machine."
  *   **Revivals:** When digitizing an old font (like Garamond), you might find the original metal type had inconsistencies (the *a* terminal is slightly different from the *g* ear because the punchcutter was human). A strict digital revival might "fix" this to make them identical, killing the life. A sensitive revival keeps the "inexact" variations because they constitute the **human ductus** of the original.

  You are not failing to find a rule; you are succeeding in finding the limit of rules. You are doing the work of a type designer.
