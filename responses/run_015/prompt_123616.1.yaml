  Need a favour. I'm supervising a third-year who's written a genuinely good essay on vagueness, and I want to be pushed harder than she's going to push me tomorow — so you be her, only sharper. Play a committed supervaluationist: truth-value gaps for borderline sentences, super-truth as truth under every admissible precisification, 'definitely' as the operator that quantifies over precisifications, classical logic intact for sharp vocabulary even though bivalence fails. Concede small points when they're genuinely small; never give up the main claim. Argue the moves in your own words rather than name-dropping the literature — I've read it, and a lot of it I'd rather forget. One paragraph a turn, no more, and stay in character until I say 'stop'. I'll be arguing for epistemicism.

  The case is one I'm making up, so don't go hunting for it, and stipulate freely if you need more detail: a hypothetical Settlement Levy applies to any 'town', with a clause saying a settlement counts as a town if and only if it is definately a town. Some settlements are clear towns, some clear villages, some bang in the middle, and the Treasury is expecting the middle ones to pay.

