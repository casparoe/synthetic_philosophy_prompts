answer: |-
  Good morning. For those who don't know me, I worked alongside Alan for fifteen years. I was his student, his colleague, and eventually, his friend.

  Standing here, looking at this room, I see the two worlds Alan inhabited every day of his life. On one side, his family and friends, who knew the man who loved jazz, who burned toast on Sundays, and who held his wife's hand with a tenderness that never faded. On the other side, his medical team, who saw him in the chaos of the trauma bay, standing before the triage board.

  We all know what that board was. It was a whiteboard marked with names, vitals, and prognoses. It was the place where the hardest decisions were made. There is a saying in the department that Alan "let the board decide." And it is true. When the sirens wailed and the stretchers came in, Alan did not rely on his gut. He did not rely on who was youngest, or who was most charming, or who had the loudest family advocating in the hallway. He relied on the arithmetic of need.

  I know that for some of you, hearing that might sound cold. It might sound like he reduced human beings to figures on a chart. I am here to tell you that it was exactly the opposite.

  In emergency medicine, you are constantly tempted to play favorites. It is human nature to want to save the child over the elder, the vibrant over the frail, the person who reminds you of yourself. But Alan believed that to give in to that temptation was the true insult to the patient. He believed that if he let his own feelings decide who received the ventilator, he was no longer treating the patients as equals. He would be making their worth dependent on his own preferences.

  So, he used the numbers. He used the board. He did this not because he cared less about the individual, but because he cared too much to let his own bias interfere with their claim to care.

  There were times when the arithmetic was brutal. There were times when a younger patient lost out to an older one because the prognosis demanded it. I saw him struggle with those moments. I saw him go home heavy-hearted. But he never wavered from the principle. He understood that the only way to honor the equal worth of every person who walked through those doors was to submit to a standard that did not care about charm, or age, or status.

  To Alan, fairness wasn't about saving the most lives possible. It wasn't a math problem where the sum mattered more than the parts. It was about ensuring that every single life was weighed on the same scale. He let the numbers speak precisely so that he didn't have to. He removed himself from the equation so that the patient's need was the only variable that counted.

  For his family, I want you to know this: The rigor you saw in his work was not a lack of warmth. It was the deepest form of respect he knew how to give. He carried that same integrity into his home. He loved you not because it was easy, or because it was convenient, but because you were *you*. He did not measure worth by utility. He measured it by presence.

  For his colleagues, we know we lost the one among us who was most willing to bear the burden of that board. We know that when we nod at the protocol, we are nodding at his legacy.

  Alan Reyes did not try to be a hero. Heroes pick who to save. Alan tried to be a servant to the truth of need. He taught us that treating people as equals sometimes means refusing to let your own heart make the choice for them. He taught us that the numbers don't count to diminish the person, but to protect them from us.

  The board is empty now. The sirens will keep wailing, and the decisions will keep coming. But the standard remains. We will measure our care by his measure: impartial, unflinching, and rooted in the belief that every single life holds an equal claim to our best effort.

  Rest now, Alan. The board is clean. You let the numbers decide, so we could learn how to love the people. Thank you.
