answer: |-
  # The "Free Biscuits" Food Ethics Decision Tree

  **Start:** You accept that *the suffering of sentient animals matters morally*.
  **Goal:** A concrete eating prescription.

  ---

  ## The Tree

  **NODE 1: The Oyster Case**
  *"Is eating an oyster (or cricket) morally closer to eating a carrot or a chicken?"*
  *   **YES (Negligible):** Invertebrates don't count enough to restrict diet. → Go to Node 2.
  *   **NO (Significant):** Invertebrate pain matters roughly like vertebrate pain. → Go to Node 2.

  **NODE 2: The Happy Steer Case**
  *"A steer lives 5 years on pasture, then is shot painlessly. Is it better off than if it had never been born?"*
  *   **YES (Life Offsets Death):** A good life justifies the killing; death isn't the primary harm. → Go to Node 3.
  *   **NO (Death is Harm):** Killing cuts off a future; life quality doesn't fully cancel the death. → Go to Node 3.

  **NODE 3: The Wild Suffering Case**
  *"Is the suffering in wild nature (starvation, predation, disease) a bigger moral priority than farm animal suffering?"*
  *   **YES (Wild Priority):** Farm diet is a rounding error; focus on land use/habitat intervention. → **Leaves 5–8**.
  *   **NO (Farm Priority):** What you eat is the main lever you have right now. → **Leaves 1–4**.

  ---

  ## Node Details & Empirical Hinges

  **Node 1 (Invertebrates)**
  *   **The Case:** Oysters lack a central brain; crickets are harvested en masse.
  *   **Empirical Hinge:** Probability of sentience.
  *   **Flip Magnitude:** If you believe the probability of an oyster feeling pain is **<5%** (vs. ~90% for a chicken), you treat them as plants. If you think insects feel pain at **>50%** capacity of a mouse, you can't eat crickets.

  **Node 2 (Death & Existence)**
  *   **The Case:** The "Pasture Beef" argument relies on the cow owing its existence to your demand (Non-Identity). The "Field Mouse" argument relies on crop harvesting killing ~10–20 small animals per hectare/year.
  *   **Empirical Hinge:** Exchange rate between *one large death* and *many small deaths/suffering*.
  *   **Flip Magnitude:** To prefer Veganism here, you must believe 1 cow death is worse than **~100 field mouse deaths**. To prefer Beef here, you must believe 5 years of cow pleasure outweighs the permanent loss of that cow's future.

  **Node 3 (Wild vs. Farm)**
  *   **The Case:** Pasture requires land. That land could be wild (full of suffering wild animals) or cropped (full of harvested mice).
  *   **Empirical Hinge:** Density of suffering per hectare.
  *   **Flip Magnitude:** If wild nature contains **10x more suffering per acre** than a farm, diet choices become secondary to land-use policy. If farm suffering is **10x more intense** than wild suffering, diet remains primary.

  ---

  ## The 8 Leaves (Prescriptions)

  ### Group A: Farm Priority (Diet Matters Most)

  **1. The Strict Vegan** (Inv: Significant | Death: Harm | Wild: Low)
  *   **Eat:** Plants only. No honey, no insects.
  *   **Awkward Commitment:** You must accept that the mice killed harvesting your wheat are a tragic necessity, not a reason to eat beef.

  **2. The Bivalvegan** (Inv: Negligible | Death: Harm | Wild: Low)
  *   **Eat:** Plants + Oysters/Mussels. No meat, dairy, or eggs.
  *   **Awkward Commitment:** You are comfortable killing animals, provided they are too simple to arguably notice they are dying.

  **3. The Pasture Omnivore** (Inv: Negligible | Death: Offset | Wild: Low)
  *   **Eat:** Pasture-raised ruminants (beef/lamb) only. No chicken, no pork, no crops requiring heavy harvesting.
  *   **Awkward Commitment:** You have to admit that if the cow's life wasn't "good," your moral license to eat it vanishes instantly.

  **4. The High-Welfare Maximalist** (Inv: Significant | Death: Offset | Wild: Low)
  *   **Eat:** Only animals (vertebrate or not) that demonstrably have net-positive lives.
  *   **Awkward Commitment:** You effectively can't eat anything commercially available; this is a theoretical diet until labeling changes.

  ### Group B: Wild Priority (Diet is Secondary)

  **5. The Vegan Interventionist** (Inv: Significant | Death: Harm | Wild: High)
  *   **Do:** Eat vegan for convenience, but spend money/effort on wild animal welfare research (e.g., gene editing wild predators).
  *   **Awkward Commitment:** You have to accept that saving a chicken today matters less than potentially saving a million mice next century.

  **6. The Bivalve Interventionist** (Inv: Negligible | Death: Harm | Wild: High)
  *   **Do:** Eat oysters for protein efficiency, but focus political energy on habitat management.
  *   **Awkward Commitment:** You are optimizing for your own time while betting that someone else will solve the wild suffering problem later.

  **7. The Pasture Steward** (Inv: Negligible | Death: Offset | Wild: High)
  *   **Do:** Eat beef to maintain pasture, but argue grazing reduces wild rodent populations/suffering compared to rewilding.
  *   **Awkward Commitment:** You are claiming that killing cows is a humane way to manage the population of wild mice that would otherwise starve.

  **8. The Effective Altruist** (Inv: Significant | Death: Offset | Wild: High)
  *   **Do:** Diet is irrelevant; earn to give. Donate 10% of income to long-termist animal welfare causes.
  *   **Awkward Commitment:** You have to admit your personal dietary purity is signaling, not doing the actual moral work.

  ---

  ## Logical Space Map (For the Facilitator)

  **Occupied Space:**
  *   **Leaves 1, 3, 5, 8** are the most common real-world positions (Standard Vegan, Ethical Omnivore, Wild Suffering EA, Earn-to-Give).
  *   **Leaf 2** is growing (Bivalveganism is a recognized niche).

  **Unoccupied/Unstable Space:**
  *   **Leaf 4 (High-Welfare Maximalist)** is logically coherent but practically empty. No supply chain exists to verify "net-positive life" for vertebrates, making this a "theoretical only" position.
  *   **Leaf 6 (Bivalve Interventionist)** is rare because people who worry about wild suffering usually worry about invertebrate sentience too (collapsing to Leaf 5).

  **Indistinguishable Leaves:**
  *   **Leaves 5, 6, 7, 8** are functionally identical in daily life. If Wild Suffering is the priority (Node 3 = YES), the specific diet (Nodes 1 & 2) becomes a "rounding error."
  *   *Facilitator Note:* If your group lands in Group B, stop arguing about food. The tree tells you to argue about land-use policy or biotechnology instead.

  **The "Chicken vs. Beef" Trap:**
  *   This tree forces that debate into **Node 2**. If you think Chicken is worse than Beef, it's because you think the *life* is bad (Node 2 = NO for chicken, maybe YES for steer). If you think Beef is worse, it's because you think the *death/land-use* is bad (Node 2 = NO, Node 3 = YES). Don't let them argue "meat is murder" vs. "plants have feelings"; make them answer the Steer Case.
