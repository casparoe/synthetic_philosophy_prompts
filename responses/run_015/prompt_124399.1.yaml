  Mark, a university student, sits for a history exam and writes down the answer $p$ ("Queen Anne died in 1714") based on reliable memory retrieval, satisfying a reliabilist account of knowledge where truth-tracking suffices regardless of confidence. Due to severe, involuntary test anxiety, he lacks the phenomenological feeling of conviction constitutive of occurrent belief, experiencing his correct answer as a mere guess despite its accuracy. He is epistemically blameless because the anxiety is involuntary and his memory reliable, allowing a proctor to truthfully describe him as knowing the answer without believing it, yet if Mark asserts "Queen Anne died in 1714, but I don't believe it," the hearer registers a pragmatic absurdity because assertion conventionally manifests the confidence he lacks.

  **Specification Check and Mechanism**
  This case relies on a **reliabilist account of knowledge** (knowledge is true belief produced by a reliable process, where the 'belief' condition is weakened to 'information-bearing state') and a **phenomenal account of belief** (belief requires felt confidence or assent). The mechanism producing knowledge without belief is the dissociation between reliable cognitive processing (memory retrieval) and subjective phenomenology (anxiety-induced doubt). This is not hesitant belief because Mark subjectively experiences the state as a guess; he is not partially convinced, but rather lacks the qualitative feel of conviction entirely, satisfying the requirement that this is not merely partial belief or a verbal dispute.

  **Verdicts and Reasons**
  *   **Doxastic Reading:** This account fails to explain the absurdity. The doxastic view holds that Moorean absurdity arises from the irrationality of simultaneously believing $p$ and believing $\neg Bp$. Since Mark does not believe $p$, he holds no contradictory attitudes ($Bp \land B\neg Bp$ is false), yet the assertion remains absurd.
  *   **Knowledge-Norm of Assertion:** This account struggles. If knowledge is the norm of assertion, Mark is permitted to assert $p$. However, the norm does not inherently explain why conjoining $p$ with "I don't believe $p$" is infelicitous if the speaker actually knows $p$ without belief; it lacks the resources to explain the clash between the act of asserting and the denial of belief.
  *   **Commitment/Scoreboard Account:** This account succeeds. Assertion constitutively commits the speaker to believing $p$, updating the conversational scoreboard with that commitment. Uttering "I don't believe $p$" directly contradicts the commitment just incurred by asserting $p$, generating absurdity regardless of the speaker's actual mental states.

  **Load-Bearing Feature, Ablation, and Reply**
  The load-bearing feature is the **divergence between the normative commitment of assertion and the speaker's actual mental state**. If this feature is removed—specifically, if Mark *does* believe $p$—the case collapses into standard Moorean absurdity explained by doxastic irrationality, restoring the doxastic theorist's victory. The strongest reply open to a doxastic theorist is not merely that knowledge entails belief, but that **belief in the relevant sense is dispositional**: if Mark's state reliably guides action and assertion, it *counts* as belief functionally, meaning specification (2) is false and the paradox reduces to standard doxastic inconsistency after all.

