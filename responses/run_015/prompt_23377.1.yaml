answer: |-
  **Setting:** *A quiet corner of the university faculty lounge. Rain taps against the window. Elena, a metaphysician known for her work on modality and reference, stirs her tea. Marcus, a philosopher of language and aesthetics, leans back in his chair, holding a manuscript.*

  **Marcus:** So, I've read the sample chapters. The author wants to call this luminous, non-metallic crystal "gold." It's the currency of the realm, it's rare, it's coveted. But chemically? It's nothing like Element 79. My advice is simple: let them keep it. It's legitimate.

  **Elena:** Legitimate? Marcus, it's a category error. If the author uses the English word "gold," they are invoking a rigid designator. That term picks out a specific natural kind in the actual world. "Gold" *is* Au. It is a necessary a posteriori truth.

  **Marcus:** Necessary in *this* world, Elena. We aren't writing a chemistry textbook; we're building a secondary world. In the context of fiction, reference isn't fixed by a causal-historical chain stretching back to an initial baptism of metal in the Earth's crust. It's fixed by the text itself.

  **Elena:** That's precisely where you're mistaken. Even in fiction, when we use proper names or natural kind terms, we import their reference from the actual world unless explicitly stipulated otherwise. If I read "Napoleon lost at Waterloo," I understand that refers to the actual historical Napoleon. I don't assume there's a fictional Napoleon who merely *fits the description* of being a French emperor. Similarly, if the text says "gold," it refers to the substance we know. If the text then says "this gold is non-metallic," the text is asserting a contradiction. It's saying "Au is non-metallic."

  **Marcus:** But that's too rigid for the mechanics of storytelling. Think about the Fregean sense. The reference of "gold" for the reader is mediated by a cluster of descriptions: yellow, shiny, malleable, valuable, dense. If the author's substance satisfies enough of that cluster—specifically the functional ones like value and rarity—the communication succeeds. The reader understands the *role* the substance plays. If the author renamed it "aurum-crystal," the reader would have to learn a new concept from scratch. By using "gold," the author leverages existing cognitive associations.

  **Elena:** You're conflating cognitive significance with reference. Yes, the *concept* the reader has might be descriptive. But what the word *picks out* is the stuff itself. Kripke's point was that we can be wrong about the descriptions. Imagine someone finds a substance that is yellow, shiny, and valuable, but it's not Element 79. We wouldn't say, "Oh, well, it fits the description, so it's gold." We'd say, "This isn't gold; it's fool's gold." The identity "Gold is Au" holds across all possible worlds where gold exists. There is no possible world where gold is a luminous crystal. That would be a world where *something else* is a luminous crystal.

  **Marcus:** I grant you that in *actual* modal logic. But fiction creates its own modal space. When we engage with a novel, we aren't evaluating truth conditions relative to the actual world's physics. We are evaluating them relative to the story's internal logic. The "initial baptism" happens in the first chapter, not in a mine in California. The author points to the glowing crystal and says, "In this world, *this* is what we call gold." That fixes the reference internally.

  **Elena:** But if they use the word "gold," they aren't introducing a new name. They are using an old one. If I write a story where "cats" are reptiles, I haven't changed the nature of cats; I've just used the word "cat" to refer to reptiles. I've misused the language. The author has two options. One: They are writing about actual gold, in which case the substance *must* be metallic, and the description "non-metallic" is false within the story. Two: They are writing about a different substance, in which case they should not use the rigid designator "gold." They should call it "solium" or "luma." To do otherwise is to assert a falsehood.

  **Marcus:** Is it a falsehood, or is it a shift in semantic context? Look at how language actually works. If I say, "In my dream, water was dry," you don't accuse me of logical contradiction. You understand that "water" in the context of the dream refers to the clear liquid filling the role of water, even if its properties differ. The descriptivist view accounts for this flexibility. The name is a shorthand for the cluster of properties relevant to the narrative. In this novel, the relevant properties are economic and aesthetic, not atomic.

  **Elena:** The "dream" analogy fails because dreams are private. A published novel uses public language. If the author wants to change the essence, they must break the causal chain. They can say, "They called it gold, though it was not the metal of the ancients." But if they simply assert "This is gold," they are tethered to Element 79. The divergence isn't about what properties the substance has; it's about what determines the extension of the term. For me, it's the underlying structure. For you, it's the superficial properties.

  **Marcus:** Precisely. And for the purpose of fiction, the superficial properties are what drive the plot. The characters trade it, steal it, lust after it. They don't assay it. If the author renames it, they lose the immediate cultural weight of "gold." The descriptivist approach preserves the *meaning* for the reader, even if it sacrifices the *metaphysical essence*.

  **Elena:** But at the cost of truth. If the novel claims "Gold is non-metallic," and gold is necessarily metallic, the novel is asking the reader to believe a logical impossibility. Some speculative fiction does that—magic, dragons. But if the author wants a hard speculative edge, they should respect the rigidity of natural kind terms. If they call it "gold," they imply a connection to our reality. If that connection is severed, the name is a lie.

  **Marcus:** It's not a lie; it's a pretense. And in the pretense, the descriptions fix the reference. Here is the crux, Elena. You believe the reference is fixed externally, by the actual world's history and physics. I believe the reference is fixed internally, by the text's descriptive cluster.

  **Elena:** Correct. And that leads to our advice for the author.

  **Marcus:** Indeed.

  *(Both turn to face the imaginary author.)*

  **Elena:** If you follow my view, you must acknowledge that "gold" cannot be non-metallic. If you insist the substance is non-metallic, you cannot call it "gold" without introducing a contradiction or implying the characters are mistaken about its nature. You should invent a new name. This preserves the integrity of the term and the metaphysics of your world.

  **Marcus:** If you follow my view, you may keep the name "gold." The term functions as a node in a network of descriptions. As long as the substance fulfills the narrative role of gold—currency, ornament, symbol of wealth—the name is appropriate. The atomic structure is irrelevant to the literary function.

  **Elena:** So, the choice for you, Author, is this: Do you want the name "gold" to anchor your fiction to the physical laws of our universe, demanding consistency with Element 79?

  **Marcus:** Or do you want the name "gold" to function as a conceptual tool, defined solely by its role and description within the story, independent of our periodic table?

  **Elena:** If the former, change the substance or the name.

  **Marcus:** If the latter, keep the name and ignore the chemistry.

  **Elena:** It comes down to whether you think meaning is anchored in the *world*...

  **Marcus:** ...or in the *word*.

  *(They sit in silence for a moment, the rain continuing to tap against the glass.)*

  **Elena:** I still think you should rename it. "Luma" has a nice ring.

  **Marcus:** And I still think "gold" carries a weight "Luma" never could. But at least we agree on where the fault line lies.

  **Elena:** Agreed. The rest is up to the novelist.
