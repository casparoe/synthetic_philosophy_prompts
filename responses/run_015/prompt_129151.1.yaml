answer: |-
  This is a exquisite dilemma for a novel, and it cuts right to the bone of what makes literary fiction endure: the friction between the structures we build (literal and metaphorical) and the beliefs we inhabit (or fail to inhabit).

  You are right to sense that George Eliot (Mary Ann Evans) is the spiritual godmother of this specific anxiety. While pinning down the exact letter without archives is tricky, the sentiment you describe is the engine of her entire post-theological life. She translated Feuerbach (who argued God is a projection of human ideals) and Strauss, and she lived with a circle of freethinkers, yet she defended the Church as a social and moral organism until the end.

  Here is a coherent reading of that position that might help your architect find his footing, or at least deepen his confusion in a productive way.

  ### 1. The "Middle Position": Moral Realism, not Theological Realism
  You asked if she is offering two separate accounts (functionalist vs. realist) or a middle position. I would argue Eliot occupies a third space: **Moral Realism.**

  For Eliot, the "creed" (the theology, the dogma, the specific claims about God) is indeed human-made and often factually false. However, the *moral reality* that the creed attempts to describe is objective. When she speaks of a "wider vision," she does not mean a supernatural realm waiting on the other side of the ritual. She means the **web of human consequence.**

  In her view, the ritual works for the non-believer not because it secretly imports theology, but because it imports *history and duty*. When the congregation kneels, they are physically enacting humility before something larger than their ego. For the believer, that "something" is God. For the humanist, that "something" is the sum of human suffering, the ancestors who built the stone, and the future generations who will inherit the moral debt of the present.

  So, to answer your specific question: The ritual keeps its value for the non-believer because the *object* of reverence shifts from the Divine to the Human, but the *act* of reverence remains necessary. The architecture isn't a fraud; it's a container for human gravity.

  ### 2. The Symbol and the "Ungrasped"
  You are confused about whether the symbol works *because* it points to something participants don't fully grasp. In Eliot's framework, the answer is yes, but with a caveat.

  She would argue that the participants (both believers and non-believers) rarely grasp the full weight of their interdependence. The "wider vision" is the reality that we are bound to one another. Theology is just the vocabulary the 19th century had available to describe that bond.

  *   **The Believer** thinks they are bowing to God, but they are actually strengthening their bond with their neighbor.
  *   **The Non-Believer** thinks they are just following custom, but they are actually participating in a collective acknowledgment of human limitation.

  The symbol works precisely because it is capacious enough to hold both interpretations without collapsing. If the symbol were too specific (e.g., "This brick represents the Trinity"), the non-believer would be a fraud for laying it. If the symbol is architectural (light, height, acoustics, the orientation of bodies), it speaks to the *condition* of being human, which both parties share.

  ### 3. Does She Settle the Tension?
  Eliot never settles the tension; she **inhabits** it. In fact, she suggests that the tension *is* the moral work.

  If you resolve the tension by saying, "Well, God doesn't exist, so the church is just a community hall," you lose the sublime. If you resolve it by saying, "God exists, so the architecture must serve dogma," you lose the truth.

  Eliot's position is that the sadness of losing the dogma is the price of honesty, but the beauty of the ritual is the reward for staying. She argues that we must mourn the loss of the metaphysical comfort while fiercely protecting the social structure that comfort built. For your protagonist, this means his "fraudulence" might actually be a form of integrity. He is building a space for a grief his clients won't name: the grief of a metaphysics they can't believe in but can't live without.

  ### 4. Application to Your Architect
  Here is how this might land in your chapter:

  Your architect is worried he is a fraud because he thinks his job is to build a house for God. If he doesn't believe in God, he is building a lie.

  But if he adopts the Eliotian view, his job is to build a house for **Reverence.** Reverence is a psychological and social fact, regardless of whether there is a deity to receive it.
  *   **The Functional Pluralism:** You mentioned this term. In this context, it means the space allows the believer to connect vertically (to Heaven) and the humanist to connect horizontally (to Humanity), and the *angle of the light* serves both.
  *   **The Bad Decision:** The "bad decision" your protagonist makes might stem from trying to resolve the tension too neatly. Perhaps he tries to design a "honest" church that admits its own secularity, and it fails to move anyone. Or perhaps he designs a traditionally beautiful space and feels like a liar, only to realize later that the beauty itself was the truth, not the doctrine.

  ### 5. The Specific Passage Confusion
  Regarding your confusion on the pivot from "collective attention" to "wider vision":

  It is not a contradiction. It is a causal link.
  1.  **Collective Attention:** The ritual synchronizes the group. (The "shared posture").
  2.  **Wider Vision:** That synchronization creates a temporary experience of self-transcendence.
  3.  **The Pivot:** Eliot asks: Can that feeling of self-transcendence survive when we admit the *cause* (God) is a metaphor?

  Her answer is: **Yes, provided we transfer the sacredness to the Human.**

  So, the symbol points to something they don't fully grasp: **The magnitude of their own responsibility.** Most people find "love thy neighbor" boring. But "love thy neighbor because God is watching" is thrilling. Eliot wants to keep the thrill without the watcher. The ritual is the machine that generates the thrill.

  ### Summary for the Novel
  Your architect isn't a fraud. He is a priest of the "Religion of Humanity," whether he admits it or not. He is designing a machine for making people feel small in a way that makes them kinder.

  The tension doesn't need to be solved in the chapter. The chapter works best if he realizes that the "fraud" isn't the lack of belief; the fraud would be designing a space that *doesn't* demand that shared posture. If he designs a church that feels like a lecture hall because he wants to be "honest" about his atheism, *that* is the bad decision. The stone demands the reverence, even if the architect demands the doubt.

  Eliot would tell him: Build the cathedral. Let the creed be spoken. The words may be shadows, but the bowed heads are real.
