  4.  **Develop the Criteria for Selection:**
      *   **Upstream/Downstream:** We need concepts that define the landscape before we can evaluate outcomes. (Morphology before Normativity).
      *   **Tractability for Conceptualists:** Can a philosopher/theorist actually work on this without needing code or data? Yes, if it's about definitions, normative implications, and institutional logic.
