      *   *Priority 2 (The Dynamics):* Stability and Change. "Succession Problem" belongs here. How does the system persist?
      *   *Priority 3 (The Normative/Strategic):* What do we want? If we can't prevent a singleton, can we shape its *depth*?

      *   *Refining the "Convergence" point:* Instead of funding "Is convergence real?", fund "What are the necessary conditions for functional convergence?" This makes it tractable. But maybe it's better to drop it to focus resources. Let's suggest dropping it as a primary focus, keeping it as a boundary condition.

      *   *External Triggers:* What happens in the world that changes the research priority?
