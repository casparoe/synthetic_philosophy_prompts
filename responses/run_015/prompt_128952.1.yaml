      *   *Check:* Is the distinction between functionalism and motivation clear? This is the crux. I need to make sure they understand that if culture is a "selection environment," it implies the *outcome* explains the *cause*, which Weber hates. Weber wants the *meaning* to explain the action.
      *   *Adjustment:* Emphasize that Weber is anti-functionalist. The "selection" language is dangerous for a Weberian. Suggest "channeling" or "orienting" instead.

  9.  **Final Polish:** Check against the user's specific constraints (rank severity, least costly revision). (Proceed to generate output).

  *(Self-Correction Note)*: Wait, I need to be careful with (5). The user says "values persist... after material conditions... disappeared." Weber says the *spirit* persists after the *religious belief* disappears. The user says "material conditions." That's a slight mismatch. The PE argument is that *religious ideas* persisted after *religious motivation* faded. The user's (5) says values persist after *material conditions* disappear. This is actually closer to Bourdieu's habitus than Weber. Weber argues the *material order* (capitalism) became dominant *because* the values persisted. I need to point out this nuance. Actually, re-reading (5): "persist in shaping behavior even after the material conditions that originally produced them have disappeared." This sounds like cultural lag. Weber's point is slightly different: the *asceticism* remained after the *salvation anxiety* vanished. I should clarify this distinction so they don't get tripped up by the philosopher in the seminar.

  *Revised Plan for (5):* Point out that Weber's stability is about the *decoupling* of ethos from theology, not necessarily material conditions. But the core intuition (path dependence) is sound.

  *Revised Plan for (3):* This is the biggest risk. "Selection environment" sounds like Popperian situational analysis or evolutionary sociology. Weber is about *meaning*. I need to suggest shifting from "selection" to "orientation."

  *Let's finalize the ranking.*
  1. (3) vs (4) - Functionalist vs Meaningful action.
