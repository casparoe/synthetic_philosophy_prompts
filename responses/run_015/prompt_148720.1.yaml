answer: |-
  ### The Culture-vs-History Decision Tree

  **Node 1:** When societies transform, are shared beliefs the engine of change, or just the exhaust smoke we look at afterward?
  *   **Exhaust Smoke (Beliefs have no independent power):** Go to Node 2A.
  *   **Engine (Beliefs drive change):** Go to Node 2B.

  **Node 2A:** If beliefs are just smoke, what is the engine made of?
  *   **Physical Constraints (Resources, technology, geography drive everything):** → **Hard Materialist**
  *   **Complex Systems (Everything interacts so densely that singling out culture is meaningless):** → **Structural Overdeterminer**

  **Node 2B:** If beliefs are the engine, do they require banks, churches, and laws to work, or do they move people directly like a force of nature?
  *   **Direct Force (No institutions needed):** Go to Node 3A.
  *   **Mediated Force (Institutions required):** Go to Node 3B.

  **Node 3A:** If beliefs move people directly, do humans choose the beliefs, or do the beliefs infect humans?
  *   **Humans Choose (Willpower and conscience alter behavior directly):** → **Direct-Value Animist**
  *   **Beliefs Infect (Ideas spread like viruses regardless of host intent):** → **Meme-Pathogen View**

  **Node 3B:** If beliefs need institutions, did the Protestant Ethic build capitalism, did capitalism build the Ethic, or did powerful actors use the Ethic as a tool?
  *   **Ethic Built Capitalism (Values created the institutions):** → **Institutional Weberian**
  *   **Capitalism Built Ethic (Economic needs generated the values to sustain them):** → **Reverse-Causal Culturalist**
  *   **Elites Used Ethic (Values were weaponized by actors for gain):** → **Elite Instrumentalist**

  ***

  ### Logical Traps & Empty Combos
  *Flag these during dialogue to prevent characters from arguing past each other.*

  *   **The Animist Reversal (Incoherent):** You cannot be a **Direct-Value Animist** and argue the **Reverse-Causal** arrow. If values act directly as a force of nature, they cannot be merely a byproduct of economic systems. This path is empty.
  *   **The Materialist Weberian (Incoherent):** You cannot be a **Hard Materialist** and an **Institutional Weberian**. If resources drive everything, the Protestant Ethic cannot be the primary cause of capitalism.
  *   **The Passive Pathogen (Weak):** A **Meme-Pathogen** view rarely fits with **Elite Instrumentalism**. If ideas are viruses that infect hosts, elites cannot easily wield them as deliberate tools. Choose either the infection model or the tool model.
