      *   **Setting:** A team building a constructive analysis library with specific constraints: proofs must compile to executable code, and the build system requires termination arguments convertible to bounds.
      *   **Goal:** The team needs two lemmas:
          *   L1: $\neg(x=0) \to \exists y (xy=1)$ (Requires Markov's Principle - MP).
          *   L2: Pointwise continuous on $[0,1] \to$ Uniformly continuous (Requires Fan Theorem - FAN).
      *   **Conflict:**
          *   M accepts MP (gets L1) but accepts Church's Thesis (CT), which refutes FAN (loses L2).
          *   B accepts FAN (gets L2) but rejects MP (loses L1).
