  - The exam question itself, precisely worded for a 90-minute response.
  - A model answer of approximately 600 words.
  - A marking scheme out of 20 points, listing five must-hit conceptual moves, the marks allocated to each, and a brief line identifying how candidates typically fail on that point.

  Total response must not exceed 950 words. Do not include bibliographies, citation lists, or requests for further reading. Do not use verbatim quotations from published texts; paraphrase any references. The prompt should be answerable entirely from general philosophical training without web access.
