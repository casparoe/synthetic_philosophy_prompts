answer: |-
  ### Audit of the Streetlight Analogy in Effective Altruism Criticism

  The streetlight effect (or drunkard's search) is a standard epistemic warning against observational bias. In the context of Effective Altruism (EA), it is deployed to suggest that the movement's cause prioritization is distorted by the availability of metrics rather than the magnitude of impact.

  Below is an audit of the analogy's structural correspondence, its disanalogies, and the hidden premises it relies upon. Throughout, I distinguish between **Settled** claims (generally accepted by both critics and defenders, or empirically verifiable) and **Contested** claims (where the literature remains divided).

  ---

  ### 1. Explicit Correspondence

  To evaluate the analogy, we must map the terms of the parable to the EA context.

  | Parable Element | EA Correspondence | Epistemic Status |
  | :--- | :--- | :--- |
  | **The Alley** | The space of all possible altruistic interventions (global health, policy, AI safety, animal welfare, etc.). | **Settled:** EA considers a wide range of causes. |
  | **The Keys** | The interventions with the highest expected value (EV) / impact per dollar. | **Contested:** What constitutes "highest EV" is the core disagreement. |
  | **The Lamppost** | The domain of high measurability (e.g., RCT-ready global health interventions). | **Settled:** EA funding skews heavily toward interventions with strong quantitative evidence. |
  | **The Light** | The availability of rigorous evidence (cost-effectiveness estimates, tracking data). | **Settled:** EA prioritizes causes where evidence is available. |
  | **The Drunk** | The EA movement / funders / researchers. | **Settled:** EA actors make funding decisions. |

  #### Unpacking the Drunk's Motivations
  The critical pivot of the analogy lies in *why* the drunk searches under the light. Critics use the analogy to impute specific motivations to EA. We can distinguish three models:

  1.  **The Epistemic Laziness Model (Critics' Standard View):** The drunk *wants* the keys (maximize good) but searches under the light because it is cognitively cheaper.
      *   *Claim:* EA knows systemic change might be better but avoids it because it's hard to measure.
      *   *Status:* **Contested.** Defenders deny this describes their epistemic state.
  2.  **The Signaling Model (Sociological Critique):** The drunk *wants to be seen* searching. The goal is not finding the keys, but demonstrating rigor to donors/peers.
      *   *Claim:* Measurability is a proxy for legitimacy, not truth.
      *   *Status:* **Contested.** This is a strong claim about bad faith or structural incentive distortion.
  3.  **The Conceptual Redefinition Model (Philosophical Critique):** The drunk redefines "keys" to mean "things found under the light."
      *   *Claim:* EA has collapsed "doing good" into "doing measurable good."
      *   *Status:* **Contested.** Defenders argue measurability is a *proxy* for good, not the definition of it.

  **Defenders' Counter-Model:** The Rational Prospector. The drunk searches under the light *because* that is where keys are statistically likely to be found. The light is not merely illumination; it is a sensor indicating presence.
  *   *Status:* **Contested.** This rests on the correlation between measurability and tractability.

  ---

  ### 2. Disanalogies: Which Matter and Which Don't

  An analogy fails if the disanalogies undermine the inference being drawn. We must separate superficial differences from structural ones.

  #### Disanalogies That Do Not Matter
  *   **Physical vs. Abstract:** The alley is physical; cause space is conceptual. This does not impact the logic of search bias.
  *   **Single vs. Collective Agent:** The parable features one drunk; EA is a distributed movement. While coordination problems exist, the epistemic bias can apply to collectives just as to individuals.

  #### Disanalogies That Matter
  **A. The Constitutive Nature of the Light**
  *   *Parable:* The light illuminates pre-existing keys. The keys exist independently of the light.
  *   *EA Context:* In EA, "evidence" (the light) is often constitutive of the claim that value exists. We often cannot know if an intervention works *except* through the metrics.
  *   *Implication:* If you cannot measure it, you often cannot verify it exists. In the parable, the drunk could stumble on the keys in the dark by touch. In EA, without metrics, "finding" high-EV interventions is arguably impossible to verify.
  *   *Status:* **Settled** that verification requires evidence; **Contested** whether high-EV interventions exist that inherently resist evidence.

  **B. The "Shiny" Causes (Longtermism)**
  *   *Parable:* The drunk ignores the dark entirely.
  *   *EA Context:* A significant portion of EA capital and attention goes to AI safety and biosecurity. These are notoriously *hard* to measure (no RCTs for AI extinction scenarios).
  *   *Implication:* If EA were solely suffering from measurability bias, funding would be near-zero for longtermist causes. The fact that billions (or significant portions of community attention) flow into low-measurability, high-uncertainty causes suggests the "drunk" is willing to search in the dark when the *prior* probability of keys is high enough.
  *   *Status:* **Settled** that EA funds hard-to-measure causes (AI/Bio); **Contested** whether this funding is rational or itself a product of bias.

  **C. Moving the Lamp**
  *   *Parable:* The lamp is fixed infrastructure.
  *   *EA Context:* EA funds "meta" research, cause prioritization, and measurement science. They actively try to build lamps in the dark (e.g., funding policy evaluation research).
  *   *Implication:* The strategy is not static. The bias objection assumes a static search pattern, whereas EA explicitly attempts to expand the illuminated zone.
  *   *Status:* **Settled** that EA funds research into measurement.

  ---

  ### 3. The Hidden Premise: Do the Keys Exist in the Dark?

  The streetlight analogy smuggles in a crucial ontological assumption: **There are keys in the dark.**

  For the critic's conclusion to hold (that EA is missing the *most* important problems), it must be true that:
  1.  High-EV interventions exist in the "systemic/dark" zone (policy, culture, institutions).
  2.  These interventions are *more* effective than the "measurable/light" zone (global health).
  3.  EA is neglecting them due to measurability constraints rather than evidence of low tractability.

  **The Confrontation:**
  *   **Critics assert:** Systemic change (e.g., trade policy, democratic reform) has higher leverage but is ignored because it resists RCTs.
  *   **Defenders assert:** Systemic change is often ignored because, when investigated, it appears less *tractable* or less *neglected* than it appears, or because the feedback loops are too noisy to verify success. They argue the "dark" is often dark because there is nothing there to see, or because the mechanism of action is obscure.

  **Epistemic Status:**
  *   **Settled:** It is difficult to generate rigorous evidence for systemic political change compared to bednet distribution.
  *   **Contested:** Whether the *expected value* of systemic change is higher despite the uncertainty. The analogy assumes the critic *knows* the keys are in the dark. If the keys are actually under the lamp, the drunk is rational. The analogy presupposes the conclusion it aims to prove: that the current EA allocation is suboptimal.

  ---

  ### 4. Verdict: Does the Analogy Carry the Conclusion?

  **Verdict:** The analogy highlights a *risk* but fails to prove a *current error*.

  The streetlight analogy is rhetorically powerful because it frames EA's behavior as **irrational convenience**. However, once the disanalogies are placed on the table, the analogy no longer supports the strong conclusion that "EA rankings track measurability rather than good."

  1.  **Risk vs. Reality:** The analogy successfully identifies a *vulnerability* (Goodhart's Law: when a measure becomes a target, it ceases to be a good measure). It is **Settled** that measurability bias is a risk EA must guard against.
  2.  **Proof of Bias:** The analogy fails to demonstrate that this risk is currently driving the allocation. Because EA funds low-measurability causes (AI safety) and funds research to "move the lamp" (meta-science), the behavior does not match the "drunk who only looks where it is easy."
  3.  **Begging the Question:** The analogy only works if we accept the premise that superior interventions are currently hidden in the unmeasurable dark. Since this is the exact point in dispute, the analogy cannot be used to settle the dispute. It assumes the keys are in the dark to prove EA is looking in the wrong place.

  **Conclusion:** The analogy carries the conclusion only by smuggling in the contested premise that high-EV systemic interventions are being overlooked. Without that premise, the "drunk" is simply a rational agent searching where probability densities are highest.

  ---

  ### 5. A Closer Analogy: The Prospector with Assays

  A more accurate model for EA's epistemic situation is **Geological Prospecting with Assay Technology.**

  **The Setup:**
  *   **The Terrain:** The global economy/society.
  *   **The Gold:** High-impact interventions.
  *   **The Assay Kit:** RCTs, cost-effectiveness analysis, monitoring data.
  *   **The Constraint:** The assay kit only works reliably on certain types of rock (direct interventions). It gives noisy or no readings on others (complex systems/policy).

  **How it Differs from the Streetlight:**
  1.  **Active Surveying:** Prospectors don't just look where the sun is; they use the assay kit. If the kit says "no gold" under the sun, they leave. If the kit says "potential gold" in a cave where the kit works poorly, they may still dig based on geological theory (first principles reasoning).
  2.  **Investment in Tech:** Prospectors invest in better assay kits (EA meta-research) to test the cave rock.
  3.  **Risk Management:** Prospectors acknowledge that digging in the cave is high-risk/high-reward, while digging where the kit works is lower-risk/verified-reward.

  **Predictions of the Prospector Analogy:**
  *   **Prediction 1:** We should see a portfolio approach. Some capital in "verified" sites (global health), some in "theoretical" sites (AI safety).
      *   *Observation:* This matches **Settled** facts about EA funding portfolios.
  *   **Prediction 2:** We should see funding directed toward improving the assay kit for the "cave" rock (policy evaluation metrics).
      *   *Observation:* This matches **Settled** EA interest in cause prioritization research.
  *   **Prediction 3:** We should *not* see capital flood the "cave" until the assay kit improves or theoretical confidence becomes overwhelming.
      *   *Observation:* This explains the hesitation on broad political activism compared to specific health interventions.

  **Why this is better:**
  The Prospector analogy removes the implication of laziness (the Drunk). It replaces it with **informational constraints.** It acknowledges that you cannot dig everywhere, and you must rely on the tools you have. It frames the "measurability bias" objection not as a moral failing of the searcher, but as a technical limitation of the assay kit.

  This shifts the debate from "EA is looking in the wrong place" (moral/epistemic critique) to "EA should invest more in better assay kits for systemic rock" (strategic critique). This is a **Contested** but productive frame, as it allows critics to argue for better measurement of systemic change without assuming EA is simply blind to it.
