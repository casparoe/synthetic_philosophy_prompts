  Please argue that interventionist causation (the do-operater / structural equation kind) secretly relies on counterfactual dependence once you push it into domains with no possible outside agent—say, causal reasoning inside a fully closed deterministic simulation, or in quantum decoherence where every intervention is just another physical interaction. Focus particularly on whether Pearl-style graph surgery is really doing anything more than dressing up Lewis-style counterfactuals in mechanistic language, and analyse whether that collapses the distinction people claim exists between the two camps, especially regarding the behaviour of endogenous variables. Write it in American English please, and don't bother with a bibliography. Also, keep the tone casual—there might be a typo or two in this prompt but thats fine.
