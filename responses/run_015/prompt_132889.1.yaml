  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Argue that interventionist causation (Pearl/do-operator/SEM) secretly relies on counterfactual dependence (Lewis-style) in specific domains (closed deterministic simulations, quantum decoherence/no outside agent).
      *   **Core Question:** Is Pearl-style graph surgery just Lewis-style counterfactuals in mechanistic clothing? Does this collapse the distinction between the two camps, especially regarding endogenous variables?
      *   **Tone:** Casual, American English.
