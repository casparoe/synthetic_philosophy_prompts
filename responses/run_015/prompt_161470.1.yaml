answer: |-
  You have stumbled onto the exact debate that has occupied philosophy of mind for the last 30 years. Here is the breakdown of who is right, why your friend isn't just playing word games, and the specific premise you need to add to make your argument work.

  ### 1. Who is right?
  **Logically, your friend is right.** Philosophically, **you are both pointing at a real tension.**

  Your friend is articulating what is known as the **Phenomenal Concept Strategy (PCS)**. This is the dominant physicalist response to the Knowledge Argument today (championed by philosophers like David Papineau, Michael Tye, and Brian Loar).

  Their argument is not word games; it relies on a distinction between **ontology** (what exists in the world) and **epistemology** (how we access what exists).
  *   **Your claim:** New Knowledge $\rightarrow$ New Fact $\rightarrow$ Non-Physical Fact.
  *   **Friend's claim:** New Knowledge $\rightarrow$ New *Concept* $\rightarrow$ Same Physical Fact.

  **The Analogy:** Imagine Lois Lane knows every physical fact about Clark Kent (DNA, history, location). She meets Superman. She learns "Superman can fly." She has learned something new, but she hasn't discovered a new *person* or a new *physical fact* about the universe; she has just acquired a new *concept* ("Superman") for an entity she already knew under a different concept ("Clark Kent").

  Your friend is arguing that "What it is like to see red" is just the physical state of seeing red, known via a **phenomenal concept** rather than a **physical concept**. If this is true, physicalism survives.

  ### 2. The Problem with Your "Stimulator" Stipulation
  You added the cortical stimulator to kill the **Ability Hypothesis** (the idea that Mary only gains the *ability* to imagine/remember, not propositional knowledge). While this is a creative move, it is dangerous for your argument for two reasons:

  1.  **It doesn't block your friend:** The Phenomenal Concept Strategy (your friend's objection) is distinct from the Ability Hypothesis. Even if Mary has the *ability* to simulate red via a stimulator, the physicalist can still say she is merely manipulating physical brain states under a new mode of presentation.
  2.  **It risks collapsing the argument:** If the stimulator allows her to "produce any experience," does she not *already* know what red is like inside the room? If she can generate the qualia of red via stimulation, she has already had the experience. If she has already had the experience, she learns **nothing new** when she leaves the room. If she learns nothing new, the argument fails.

  **Recommendation:** Drop the stimulator stipulation. It creates more problems than it solves. The standard setup (Mary knows all physical facts but has never *seen* color) is sufficient to generate the intuition. The real battle is not about *ability*, it is about *concepts*.

  ### 3. The Missing Premise
  To get from "Mary learns something new" to "Physicalism is false," you need to block the "New Concept/Same Fact" loophole. You need to argue that the difference in knowledge reflects a difference in **truth conditions**, not just **cognitive access**.

  You need to add and defend this premise:
  > **The A Priori Entailment Premise:** *If physicalism is true, then all facts about the world (including phenomenal facts) must be a priori deducible from the complete physical facts.*

  **Why this works:**
  *   **Physicalist:** "Mary knows all physical facts. When she leaves, she learns a phenomenal fact. But that fact was already there, she just couldn't deduce it a priori. It's an *a posteriori* necessary truth." (This is *A Posteriori Physicalism*).
  *   **You:** "If the phenomenal fact were truly identical to a physical fact, and Mary knew all the physical facts, she should be able to deduce the phenomenal fact. The fact that she *cannot* deduce it implies the phenomenal fact is not fixed by the physical facts alone."

  By insisting that **Physicalism requires A Priori Entailment**, you force the physicalist into a corner. They have to admit that there is an "Explanatory Gap" that cannot be bridged by logic alone. You can then argue that an unbridgeable explanatory gap indicates an ontological gap (a difference in reality, not just knowledge).

  ### 4. Suggested Paper Structure
  Since you are writing a short undergrad paper, do not try to prove Substance Dualism (that souls exist). Try to prove **Property Dualism** (that mental properties are not physical properties) or simply the **Falsity of Physicalism**.

  **I. Introduction**
  *   Introduce Jackson's Knowledge Argument.
  *   State your thesis: Mary's acquisition of new knowledge demonstrates that physicalism is false because it shows physical facts do not exhaust all facts.

  **II. The Setup & The Ability Objection**
  *   Briefly explain Mary's room.
  *   Briefly mention the Ability Hypothesis (she only learned *how*, not *that*).
  *   Dismiss it quickly (you can use your stimulator idea here *if* you clarify that it gives her functional access but not the *perceptual acquaintance* of external red, but honestly, it's safer to just cite standard replies like "Mary clearly learns a truth, not just a skill").

  **III. The Phenomenal Concept Strategy (Your Friend's Objection)**
  *   Steel-man your friend's position. Explain that physicalists argue Mary gains a new *phenomenal concept* for an old *physical fact*.
  *   Use the Clark Kent/Superman analogy.
  *   Acknowledge that this saves physicalism *unless* we add a further premise.

  **IV. The Crucial Premise (A Priori Entailment)**
  *   Argue that if physicalism were true, the physical description of the world would be a **complete** description.
  *   If it is complete, there should be no "residue" left for Mary to discover.
  *   Argue that the "Guise" reply fails because phenomenal concepts reveal the **essential nature** of the experience, whereas physical concepts only describe structure and function. If they revealed the same essence, Mary could deduce one from the other. She can't. Therefore, they are not the same.

  **V. Conclusion**
  *   Conclude that because Mary learns a new fact that was not deducible from physical facts, there are non-physical facts.
  *   Physicalism is therefore false (or at least incomplete).

  ### Summary Checklist for You
  1.  **Don't call it word games:** Your friend is citing the *Phenomenal Concept Strategy*. Treat it as a serious philosophical objection.
  2.  **Add the premise:** You must argue that **Physicalism implies A Priori Entailment**. Without this, the physicalist can say "It's the same fact, just known differently."
  3.  **Be careful with the stimulator:** Ensure your stipulation doesn't accidentally give Mary the experience *inside* the room, which would ruin the "she learns something new" premise.
  4.  **Aim lower:** Don't try to prove Cartesian Dualism. Just prove that "Physicalism, as defined by the claim that everything is physical, is false."

  If you include the **A Priori Entailment** argument, you will have moved beyond the standard undergraduate summary and into the actual contemporary debate. Good luck!
