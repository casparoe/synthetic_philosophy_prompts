answer: |-
  This is a sharp dissection of a problem that has haunted evolutionary naturalism since Darwin himself wrote to William Graham in 1881: *"With me the horrid doubt always arises whether the convictions of man's mind, which has been developed from the mind of the lower animals, are of any value or at all trustworthy."*

  You have essentially reconstructed Alvin Plantinga's **Evolutionary Argument Against Naturalism (EAAN)**, but you've arrived at it through Darwin's own texts rather than theological presuppositions. That makes the tension even tighter.

  Here is the diagnosis of the leak, the step you should reject, and the price you must pay to keep the system watertight.

  ### The Leak: The Equivocation in Step (6)

  The leak is not in (1) or (2); those are solid Darwinian descriptions. The leak is in **Step (6)**, supported by a hidden assumption in **Step (3)**.

  **Step (6) claims:** *Belief in evolutionary theory is itself an evolved cognitive habit, shaped for survival and prediction, not necessarily for truth.*

  This conflates **folk cognition** (the brain's hardware) with **scientific methodology** (the brain's software/tools).

  1.  **Evolution selects for truth-tracking in specific domains.** If your cognitive faculties did not accurately track reality (e.g., "that is a cliff," "that is a predator," "fire burns"), you would not survive. Therefore, evolved cognition *must* have a high degree of correspondence with reality in survival-relevant domains. It is not *guaranteed* to track truth, but it is not *indifferent* to truth either.
  2.  **Science is a corrective technology.** Scientific reasoning is not merely an "evolved habit." It is a culturally evolved set of tools (logic, peer review, double-blind testing, mathematics) explicitly designed to **override** our evolved instincts. Our instincts tell us the sun orbits the earth (agent-centric perception). Science tells us otherwise.

  By treating scientific belief as "just another instinct" in (6), you ignore that science is the *systematic debugging* of instinct.

  ### The Fix: Reject (6), Modify (3)

  You should **reject (6)** as stated. You should replace it with:
  *(6*) While the *capacity* for reasoning is evolved, scientific theories are the product of methodological checks designed to filter out survival-biased errors.*

  Consequently, you must modify the inference in **(3)**.
  *(3*) Morality and Religion may be adaptive products without objective truth-conditions, but Science claims objective truth-conditions and possesses methods to verify them.*

  This allows you to be an **anti-realist about morality** (it's a social instinct) while remaining a **realist about science** (it's a truth-tracking tool).

  ### The Price of This Rejection

  You asked what the price is. It is not cheap, but it is payable.

  **1. You lose "Naive Realism."**
  You cannot claim that human reason is a pure mirror of nature. You must admit that our cognitive starting point is biased toward survival, not truth. We are naturally prone to superstition, agent-detection, and tribalism (as Darwin noted).
  *   *The Cost:* You must view rationality as an *achievement*, not a given. It is hard work to be rational because it requires fighting your own biology.

  **2. You must accept "Instrumental Normativity."**
  You worried about "sneaking in a normative layer Darwin's naturalism can't allow." You don't need supernatural normativity; you need **instrumental normativity**.
  *   *The Logic:* If you want to build a bridge that doesn't collapse, you *ought* to use correct physics. The "ought" comes from the goal (bridge stability), not from God.
  *   *The Cost:* Science isn't "holy"; it's just the most effective tool we have for prediction and control. Its authority is pragmatic, not metaphysical.

  **3. You must split Morality and Epistemology.**
  This is the hardest pill for some Darwinians. You have to argue that **moral instincts** and **causal reasoning** function differently.
  *   *Morality:* Evolved for group cohesion. Truth-value is secondary to social utility. (You can hold this without collapsing into nihilism by adopting a constructivist view: morality is real *to us* because we are social animals).
  *   *Science:* Evolved for environmental modeling. Truth-value is primary because false models lead to death.
  *   *The Cost:* You cannot derive your "horror at slavery" from the same ontological footing as your "belief in gravity." One is a deep social imperative; the other is a physical description. This feels unsatisfying emotionally, but it saves the logic.

  ### Why Your Gut Was Half-Right

  Your gut said: *"Insist that evolutionary origin doesn't determine justification."*

  This is the **Genetic Fallacy**. Just because a belief has a lowly origin (fear of predators) doesn't mean it's false (predators are real). Just because morality comes from social instincts doesn't mean it's "fake," but it does mean its *truth conditions* are different from physics.

  However, your gut worried about *"sneaking in a normative layer."*
  If you reject (6) properly, you don't need extra normativity. You just need to acknowledge that **truth is adaptive.** A brain that believes 2+2=5 will eventually fail to build shelters that stand. Therefore, natural selection *does* favor truth-tracking faculties in the physical domain, even if it favors "useful fiction" faculties in the social/religious domain.

  ### Summary

  **Reject Step (6).**
  Science is not an instinct; it is a **discipline**. It is the cultural immune system that protects us from the errors of our biological cognitive habits.

  **The Price:**
  You must accept that Darwin's theory explains why we are *prone* to error (religion, tribalism), but also explains why we have the *tools* to correct it (pattern recognition, causal reasoning). You save science from collapsing into instinct, but you demote it from "Divine Reason" to "High-Grade Survival Tool."

  Darwin's horror at slavery remains valid—not because it reflects a cosmic moral law, but because it reflects the highest refinement of the social instincts that allow our species to flourish. His science remains valid—not because it is untouched by evolution, but because it is the method we use to scrub the evolutionary bias out of our observations.

  The argument eats itself only if you assume evolution produces *only* fictions. If evolution produces *maps*, then science is just the process of checking the map against the territory.
