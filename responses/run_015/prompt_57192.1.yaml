          *   Criteria for each: Upstream dependency, Tractability (for *this* group), Neglect, External Validation (scientist check).
          *   Specify family members if applicable.
          *   Top 1-2 items: Conditions for demotion (what scientific progress would make them obsolete?).
      *   **Task 2:** What to cut.
          *   Address standard tropes (strong emergence coherence, MR vs. Identity, Bénard/BZ reaction).
