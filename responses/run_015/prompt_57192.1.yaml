      *   No bibliography? Yes.
      *   Flag contested views? Yes.

  8.  **Final Polish:** Ensure the distinction between "reduction as derivation" and "reduction as resource" is clear, as that's key to satisfying the funder. (Proceed to generate output).

  *(Self-Correction on "Domain Bets"):* I initially thought Active Matter. But the biologist is a *theoretical* biologist. Active matter is physics-heavy. Systems Biology might be better for the biologist, but the physicist is non-equilibrium. *Non-equilibrium statistical mechanics applied to biological systems* is the sweet spot. I will recommend focusing on **Non-Equilibrium Dynamics in Biological Organization**. This uses the physicist's expertise and the biologist's domain.

  *(Self-Correction on "Delayed Vocabularies"):* This sounds like "new concepts." I need to make sure I don't just say "it's interesting." I need to say if it helps scientists. It helps them justify why they need new macro-variables.

  *(Self-Correction on "Reduction without Transfer"):* This is essentially the "New Wave Reductionism" (Churchland/Bickle) vs. "Autonomy" debate. I need to frame it as "When is reduction *worth the cost*?"

