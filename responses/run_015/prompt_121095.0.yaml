  *(Final check on the "Losing Side" requirement)*: If I recommend Banded, the "Pure Lexical" proponents are the losing side. Their argument is that *any* trade-off corrupts the moral absolute. I must acknowledge that if the bands bleed into each other, they are right. Therefore, my recommendation must include strict enforcement of band boundaries.

