  I'm a journalist who writes about science and ideas, and I got roped into giving a toast at the retirement party for Dr. Lena Voss — she's leaving after 35 years in cognitive science and comparative philosphy. Half the room are her collegues (philosophers of mind, buddhist scholars, a few neuroscientists) and half are family and old friends who'd stare blankly if I mentioned anatta.

  Lena's career was all about the self being more like a running story than a thing — she did work on predictive processing models and translated Abhidharma texts on prajnapti, the idea that person is just a conventional label. But she's also the woman who remembers every birthday and holds grudges for decades, so I can't just stand up and say she's an illusion and sit down. I need a speech where Buddhist no-self actually structures what I say: I want to honor her consistency and moral presence without smuggling in some hidden soul-substance, maybe using the conventional vs. ultimate truth distinction, and I want to touch on that slightly niche tension between diachronic karma-continuity and the denial of a persistent owner of experience. It shouldn't feel like a sermon or a lecture, just a toast that lands for both tables.

  Please write it. Begin with the speech itself, with no preface or commentary, and don't restate the prompt back to me. I typo'd philosophy twice in my draft notes so apologies if this is a bit messy.
