answer: |-
  Good evening. For those who don't know me, I'm a journalist who covers science and ideas. Which means I spend a lot of time trying to explain complex theories to people who just want to know what's for dinner. But tonight, I have the opposite problem. I need to explain why we are celebrating a person who has spent thirty-five years arguing that "persons" are technically a fiction.

  Dr. Lena Voss has built a career on a fascinating contradiction. On one hand, she is a leading voice in cognitive science and comparative philosophy. She has written extensively on predictive processing models and translated Abhidharma texts on *prajnapti*—the idea that a "person" is just a convenient label we slap on a bundle of changing processes. She argues that the self is not a thing you *have*, but a story you tell.

  On the other hand, Lena is the woman who sent me a handwritten card on my birthday every year for a decade. She is the woman who, if you borrow a book and return it with a dog-eared page, will hold a grudge with the precision of a atomic clock.

  So, how do we reconcile this? If the self is an illusion, who is holding the grudge? And who are we toasting?

  To answer that, we have to look at how Lena lived her own research. In Buddhist philosophy, there is a concept called the Two Truths. There is the ultimate truth—that there is no fixed, permanent soul underneath our experience. And there is the conventional truth—that in this world, cause and effect matter, names matter, and birthdays matter.

  Many people hear "no-self" and think it means nothing matters. Lena taught us the opposite. She taught us that because there is no permanent owner of our experiences, our actions are even more critical. This is the tricky bit about karma-continuity. You don't need a permanent soul to carry the weight of your actions any more than you need a permanent "flame" to carry fire from one candle to another. The heat transfers. The light continues. The process flows.

  Lena's life is the proof of concept. She didn't use the idea of no-self to detach from the world; she used it to engage with it more honestly. She understood that while the "self" might be a running narrative rather than a solid object, it is a narrative we are responsible for writing.

  To her colleagues here: You know that Lena's work on diachronic continuity showed how memory and intention bind moments together without needing a metaphysical glue.
  To her family and friends: You know this simpler version. You know that even if Lena thinks of herself as a "conventional label," she is the most consistent label in your address books.

  There is a temptation when retiring to say someone is "moving on to the next chapter." But given Lena's work, I think we should say she is simply allowing the process to update its predictive model. The story doesn't end; the plot thickens.

  So, I want to propose a toast. Not to a soul, because Lena would tell us that's scientifically and philosophically dubious. But to the continuity. To the karma. To the thirty-five years of rigorous, compassionate storytelling that made us all think harder about who we are.

  To Lena. May your next convention be as true as your last.
