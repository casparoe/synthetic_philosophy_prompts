      *The "Distributed Valence" problem:* If valence is fundamental, does a rock suffer? If not, why? Because it lacks integration. But if valence is *distributed*, does the sum of micro-suffering equal macro-suffering?
      *Correction on Misconception 2:* The misconception is "ethics collapses into paralysis." The interception is showing that moral status tracks *integration*, not just *existence* of valence.

      *Refining the Example Properties:*
      *   Thermal Gradient: High energy flow, low information integration.
      *   Quantum System: High coherence, low temporal persistence (maybe?), or high entanglement. Let's focus on *entanglement* as the binding mechanism candidate.
      *   Mammalian: High integration, high persistence, homeostatic feedback.

      *Let's write it.*

  9.  **Final Check of the "Dependency Order":**
      1.  Micro-phenomenal properties exist (Axiom).
      2.  Distinction: Property vs. Subject (Crucial).
      3.  Combination Problem (How properties aggregate).
      4.  Phenomenal Binding (The mechanism of aggregation).
      5.  Integration Threshold (The ethical cutoff).
      6.  Distributed Valence Ethics (The conclusion).

