      *   **Tone:** Professional, respectful of expertise, direct, philosophically informed but practically grounded. No jargon without explanation.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Verisimilitude* is tricky. Popper's content approach failed because false theories have infinite false consequences.
      *   *Similarity approaches* (Oddie, Niiniluoto) work better for science: weighted distances in state-space.
      *   *Pragmatic approaches* (van Fraassen): Empirical adequacy (saving the phenomena) vs. Truth.
      *   *The User's Insight:* The "Four-Anchor" idea is actually quite strong. It operationalizes verisimilitude into *specific* claims rather than global metaphysical ones. It shifts "True" to "Accurate regarding X relative to Y."
      *   *The Constraint:* Referees have 15 minutes. No philosophy background.
      *   *The Solution:* The procedure must translate "closer to the truth" into "better predictive/structural performance on specific variables relative to a baseline."

  3.  **Drafting the Procedure (The "Verisimilitude Sanity Check"):**
      *   *Order:* Needs to flow logically.
          1.  Target (What reality?)
          2.  Aspect (What feature?)
          3.  Comparator (Than what?)
          4.  Metric (How measured?)
      *   *Refinement:* Let's stick close to the user's "Four-Anchor" but make it actionable.
      *   *Stop Conditions:* If Target is metaphysical (unobservable in principle) -> Stop. If Metric is undefined -> Stop.
      *   *Judgment Calls:* Weighting of aspects (is getting the mechanism right more important than fit?).

  4.  **Running the Cases:**

      *   **Case 1: Successor Atmospheric Model.**
          *   *Scenario:* More params, beats old one on all benchmarks.
          *   *Analysis:* Target (Atmosphere), Aspect (Benchmark variables), Comparator (Old model), Metric (Benchmark scores).
          *   *Verdict:* Passes the *procedure*, but philosophically, is it "truth" or just "fit"? The procedure should allow it *if* the claim is restricted to the benchmarks. If they claim global truth, it fails.
          *   *Decision:* Pass with restriction.

      *   **Case 2: Pharmacology (Mechanism vs. Fit).**
          *   *Scenario:* Model A (Right mechanism, bad fit), Model B (Wrong mechanism, good fit).
          *   *Analysis:* Target (Biological process), Aspect (Mechanism vs. Output), Comparator (Each other), Metric (Fit stats vs. Structural validity).
          *   *Verdict:* This is the hard case. "Closer to truth" usually implies structure, not just curve fitting. If the claim is about *causal truth*, Model A wins. If about *predictive truth*, Model B wins.
          *   *Decision:* Judgment Call. The procedure flags the ambiguity. Editor must decide if "truth" means "mechanism" or "prediction" in this journal.

      *   **Case 3: Cloud Scheme (Old Simple vs. New ML).**
          *   *Scenario:* User wants the 2-param model to win against the 30-param ML.
          *   *Analysis:* Target (Cloud physics), Aspect (Generalizability/Robustness vs. Training fit), Comparator (ML model), Metric (Out-of-sample performance/Physical consistency).
          *   *Verdict:* The user suspects the procedure will block this. Why? Because ML usually wins on *fit* metrics. To pass, the "Aspect" must be defined as *physical consistency* or *robustness*, not raw RMSE.
          *   *Decision:* Pass *only if* the aspect is defined as "structural stability" or "physical consistency," not "accuracy on training data." I need to be honest: if the ML beats it on all empirical metrics, the procedure *should* block the claim. If the 2-param model is "truer" because it's physically interpretable, that's a specific definition of truth (realism) vs. instrumentalism.

