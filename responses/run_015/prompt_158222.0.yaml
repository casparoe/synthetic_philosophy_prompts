      *   **Problem:** Authors/referees casually claim models are "closer to the truth." Popper's original definition is defunct (Tichý/Oddie objections). Current philosophical accounts are fragmented. The Editor-in-Chief demands defensibility. Referees are unpaid, non-philosophers, time-poor.
      *   **Goal:** A practical, procedural "test" (checklist/algorithm) for referees to evaluate verisimilitude claims in abstracts. It needs to be robust, fit on a form, and handle edge cases.
      *   **User's Proposal:** A "Four-Anchor Test" (Target, Aspect, Metric, Comparator).
      *   **Tasks:**
          1.  Refine/Order the questions (anchors).
          2.  Define pass/fail criteria for each.
          3.  Identify "hard stops" (automatic rejection) vs. "judgment calls" (human editor decision).
