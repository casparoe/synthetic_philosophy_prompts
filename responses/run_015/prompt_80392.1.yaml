answer: |-
  Here is the mapping, the engagement with the aggregation/omission problem, and the honest assessment of where the theory strains.

  ### 1. The Contractualist Mapping

  **The Principle:**
  "In conditions of extreme resource scarcity, medical triage protocols shall allocate life-saving ventilation to patients with the highest expected remaining life-years, implemented via an age cutoff (e.g., denial of ventilation for patients over 70)."

  **The Person Living Under the Principle:**
  The 75-year-old patient arriving at the ER with respiratory failure. Let's call her *P*.

  **The Burden:**
  *P* dies. This is the maximal burden. Under contractualism, we look at the burden imposed by the *principle*, not just the disease. The principle transforms a medical risk into a guaranteed exclusion.

  **The Actual Alternatives (What the Theory Cares About):**
  Contractualism does not compare "Principle vs. Magic Wand (everyone lives)." It compares "Principle A vs. Principle B."
  *   **Principle A (The Age Cutoff):** *P* is denied care based on age. A 40-year-old (*Q*) receives care.
  *   **Principle B (The Lottery/Equal Chance):** *P* and *Q* enter a random allocation pool. *P* has a 50% chance of death; *Q* has a 50% chance of death.

  **The Reasonable Rejection:**
  *P* rejects Principle A. Her grounds are not merely "I want to live." Her grounds are: "This principle treats my claim to life as morally inferior to *Q*'s based on a characteristic (age) I cannot alter and which does not diminish my status as a rational being."
  She argues that Principle B (Lottery) imposes a *lesser* burden on her (a risk of death, rather than a certainty) while imposing an *equivalent* burden on *Q* (a risk of death rather than a certainty). Since *Q* cannot reasonably reject the Lottery (their burden is not significantly increased compared to the Cutoff), *P*'s rejection of the Cutoff is reasonable.

  ### 2. Omission vs. Commission: Is the Distinction a Red Herring?

  You asked if the aggregation problem bites the same way when it's an omission (withholding a ventilator) rather than a commission (throwing the switch).

  **The Short Answer:** For contractualism, the distinction is largely a red herring *if* the justification relies on aggregation.

  **The Nuance:**
  In the Trolley Problem (commission), the worry is that you are using the one as a means. In the ICU case (omission), the worry is that you are judging the one as *worth less*.
  Scanlon's contractualism is concerned with **justifiability to each person**.
  *   If you throw the switch, you must justify to the one why they were sacrificed.
  *   If you withhold the ventilator, you must justify to the one why they were excluded.

  In both cases, if the justification is "Because saving five others produces a greater aggregate sum of welfare," contractualism blocks it. The mechanism of death (active vs. passive) matters less than the **reason for the death**.

  However, there is one place omission matters: **Baseline Expectations.**
  In the Trolley case, the one person had a secure baseline (walking on the track) that you violated. In the ICU case, the patient has no inherent right to a scarce machine they don't own.
  *   *Counter-argument:* But in a public health system (like the UK's NHS), there is a legitimate expectation of care based on need, not worth.
  *   *Contractualist View:* If the principle changes the baseline from "care based on need" to "care based on utility," the burden on the excluded is the *loss of equal standing*.

  So, does the aggregation problem bite the same way? **Yes.** Whether you kill or let die, if the *reason* is "the sum of life-years elsewhere outweighs your single life," contractualism says that reason is inadmissible. You cannot justify a fatal burden to an individual by summing the benefits to others.

  ### 3. The "Secret Aggregation" Worry

  You have a nagging feeling that "reasonable rejection" is secretly aggregative. You are half-right, but the mechanism is different.

  **Your Worry:** To decide if *P*'s rejection is reasonable, don't we weigh her loss (death) against the total gain (many young people living)? If the total gain is huge, isn't her rejection "unreasonable"?

  **The Contractualist Reply:** No. That is exactly what the theory forbids.
  The test is **Pairwise Comparison**, not Summation.
  *   We compare *P*'s burden under Principle A vs. Principle B.
  *   We compare *Q*'s (the youngest patient) burden under Principle A vs. Principle B.

  We do **not** add up all the *Q*s to outweigh *P*.
  *   If Principle A (Age Cutoff) is in place: *P* dies. *Q* lives.
  *   If Principle B (Lottery) is in place: *P* has a risk of death. *Q* has a risk of death.

  For *P*, the move from Lottery to Cutoff is catastrophic (Risk → Certainty).
  For *Q*, the move from Lottery to Cutoff is beneficial (Risk → Certainty of survival).

  The question is: Can *Q* reasonably reject the Lottery? *Q* faces the same maximal burden (death) in the Lottery as *P* does in the Cutoff. Since *Q* cannot claim their life is objectively "more worth saving" without violating the requirement of mutual recognition, *Q* cannot reasonably reject the Lottery.
  Therefore, *P*'s rejection of the Cutoff stands.

  **Where you are right:** The theory *does* weigh the **magnitude of individual burdens**. It asks: "Is *P*'s complaint stronger than *Q*'s complaint?"
  If *P* were losing a finger and *Q* were losing a life, *P* could not reasonably reject a principle saving *Q*. That is a comparison of magnitudes.
  But it refuses to **aggregate across persons**. It will not let a million finger-losses outweigh one life-loss.
  In the ICU case, since both face death, the magnitudes are equal. The "life-years" metric attempts to make *Q*'s loss *qualitatively* larger. Contractualism is deeply suspicious of this. It suggests that moral standing is equal, even if future duration is not. To say *Q*'s death is "worse" because they are younger is to introduce a metric of human worth that contractualism tries to exclude.

  ### 4. The Verdict and The Break

  **Does Contractualism Endorse or Reject the Age Cap?**
  It **Rejects** the hard age cutoff.
  It would likely endorse a **Lottery** (or first-come, first-served) among those with similar immediate survival probabilities.
  *Reason:* The age cap requires the older person to accept a principle that assigns them lower moral status based on a natural characteristic. This violates the "desire to live on terms that others could not reasonably reject." The older person can say: "I am willing to share the risk of scarcity with you (Lottery), but I am not willing to accept a rule that says my life is worth less than yours."

  **Where the Theory Goes Quiet / Breaks:**
  Here is the honest shakiness.

  1.  **The "Many vs. One" Strain:** Contractualism handles "One vs. One" (Lottery) well. It struggles when the numbers are vast. If the choice is "One 80-year-old dies" vs. "Five 20-year-olds die," and we cannot aggregate, contractualism flails. It insists the single 80-year-old cannot be sacrificed for the five. In a pandemic, this might lead to *more* total deaths. The theory prioritizes **individual justifiability** over **outcome optimization**. If you find that unacceptable in a triage context, the theory offers no concession. It bites the bullet.
  2.  **The Definition of "Burden":** The theory breaks on whether "loss of 50 life-years" is a heavier burden than "loss of 5 life-years." Scanlon allows comparing generic reasons. Is "dying at 20" generically worse than "dying at 80"? Most people would say yes. If contractualism admits this, it smuggles in a form of aggregation (weighting the quality/quantity of the loss). If it denies this (death is death), it seems out of touch with human intuition. It hasn't fully resolved this tension.
  3.  **Scarcity as a Moral Trap:** Contractualism is designed for rules of conduct in a functioning society. It assumes there are enough resources to generally respect everyone. In extreme scarcity, *any* principle imposes a fatal burden on someone. The theory goes quiet on how to choose between two fatal claims other than "flip a coin." It has no resources for "tragic choices" other than insisting the *justification* shouldn't be utilitarian. It tells you *how not to choose* (don't aggregate), but it doesn't give you a robust tool for *how to choose* when everyone has a veto.

  **Summary:**
  Contractualism rejects the age cap because it treats the older patient as a vessel of fewer life-years rather than a person with equal standing. The omission/commission distinction doesn't save the policy because the justification is aggregative. Your worry about secret aggregation is astute: the theory avoids *summing* people, but it still has to weigh *individual losses*, and that's where the "life-years" metric tries to sneak back in. The theory holds the line there, but at the cost of potentially offering no guidance other than "don't be utilitarian," even when utilitarianism saves more lives.
