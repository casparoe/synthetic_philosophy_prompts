  Based on the track record of her verdicts, here is the breakdown of what she will likely say, which rule she is actually using, and how to test it further.

  ### 1. The Verdict on Your Test Case
  **She will likely call this a Genuine Dilemma.**

  Here is why: The critical key to her logic isn't found in the "lesser evil" calculation, but in the **aftermath**. Compare her verdict on Case 3 (Small Promise) with Case 2 (Two Promises).
  *   **Case 3:** You break a promise to prevent worse harm. Verdict: *Not a dilemma.* Her reason: You can "explain and apologise afterwards." The moral ledger can be balanced; the remainder is cleaned up.
  *   **Case 2:** You break a promise to prevent worse harm (to the other promisee). Verdict: *Genuine dilemma.* Her reason: "No way to make it up." The moral ledger stays unbalanced.

  In your Test Case, you stipulate that exposing the colleague is "clearly what you ought to do" (matching Case 3), **but** you also stipulate it will "wreck the friendship beyond repair" (matching Case 2 and Case 5). Because the damage is irreparable, the "apology" loophole from Case 3 is closed. Even if she agrees you did the *right* thing, the existence of an irreparable moral cost (the destroyed friendship) signals a "remainder" that she classifies as a dilemma.

  ### 2. Which Rule Is She Running?
  You proposed two rules:
  *   **Rule A (Wrongdoing):** A dilemma exists only if every option involves doing something wrong.
  *   **Rule B (Remainder):** A dilemma exists only if whichever you pick leaves a remainder you can't clean up.

  She is almost certainly running **Rule B (The Moral Remainder Rule)**, likely influenced by Bernard Williams' concept of "moral residue."

  **Why Rule A fails her track record:**
  In Case 3 (breaking the small promise), is she doing something "wrong"? In a strict deontic sense, yes (breaking a promise). But she verdicts it as *not* a dilemma. This implies that a "justified wrong" doesn't count as a "wrong" for the purpose of her definition *unless* it leaves a stain. Rule A is too binary; Rule B captures the nuance of *repairability* which is the explicit differentiator in her notes on Case 2 vs. Case 3.

  **The Strongest Alternative: The Rational Decidability Rule**
  There is a third rule that fits her five cases just as well as the Remainder Rule:
  *   **Rule C (Decidability):** A genuine dilemma exists only when reason/policy cannot dictate a choice (i.e., there is no rational tie-breaker).

  **How Rule C fits her data:**
  *   **Case 1 (Strangers):** Coin flip is rational. (Not a dilemma).
  *   **Case 2 (Promises):** No rational way to choose Promise A over Promise B. (Dilemma).
  *   **Case 3 (Small Promise):** Utility calculation dictates the choice. (Not a dilemma).
  *   **Case 4 (Nurse):** Policy dictates the choice. (Not a dilemma).
  *   **Case 5 (Mother/Resistance):** No rational way to weigh family against political duty. (Dilemma).

  **Where Rule B and Rule C come apart:**
  They come apart exactly on your Test Case.
  *   **Rule B (Remainder):** Says **Dilemma** (Friendship wrecked/irreparable).
  *   **Rule C (Decidability):** Says **Not a Dilemma** (You stipulated it is "clearly what you ought to do," meaning reason *has* dictated the choice).

  If she calls your case a **Dilemma**, she is a **Remainder Theorist**. If she calls it **Not a Dilemma**, she is a **Rationalist**. Given her emphasis on "no way to make it up" in Case 2, the money is on Remainder.

  ### 3. The Next Case to Tell Them Apart
  To definitively prove which rule she is running, you need a case that isolates **Remainder** from **Decidability**. Your Test Case does this, but if she hedges, use this cleaner scenario:

  **The Case of the Blameless Arbitrary Choice**
  > "You are walking past a burning building. Inside are two strangers, identical in every relevant way (age, health, relation to you). You can only save one. You have no coin to flip, no policy to follow, and no reason to prefer one over the other. You simply point at one and save them. The other dies. The survivor thanks you; the dead one's family knows it was impossible to save both and blames no one."

  *   **Rule B (Remainder) predicts:** **Not a Dilemma.**
      *   Why? There is no moral residue. No one is wronged, nothing needs repairing, no guilt lingers. It matches her "Two Strangers" verdict.
  *   **Rule C (Decidability) predicts:** **Genuine Dilemma.**
      *   Why? Reason has run out. There is no tie-breaker (no coin, no policy). The choice is fundamentally underdetermined by rationality.

  **How to interpret her answer:**
  *   If she says **"Not a Dilemma"**: She is committed to the **Remainder Rule**. The presence of a "stain" is necessary for a dilemma, regardless of whether reason can decide.
  *   If she says **"Genuine Dilemma"**: She is committed to the **Decidability Rule**. The inability of reason to distinguish options creates the dilemma, even if no moral wrong is committed.

  This forces her to choose between the *feeling* of the dilemma (residue/guilt) and the *structure* of the dilemma (rational indeterminacy). Given her thesis focus on "genuine" dilemmas, her answer to this will likely define her entire philosophical framework.
