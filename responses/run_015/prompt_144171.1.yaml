answer: |-
  Grandmother moves a kettle from Sink (S) to Stove (G). She detours around Center Island (C). True reward: $-10$ for scraping C (enamel). True belief: C is hot (false). She is rational wrt her belief.

  | t | State | Action |
  | :--- | :--- | :--- |
  | 0 | Sink | Grab |
  | 1 | North1 | Step |
  | 2 | North2 | Step |
  | 3 | East1 | Step |
  | 4 | East2 | Step |
  | 5 | Stove | Place |

  **Procedures:**
  1.  **MaxEnt (Correct Dynamics):** Assumes rationality and correct physics. Detour implies cost. Infers $R(C) \ll 0$. (Gets true reward).
  2.  **Bayesian (Sparse Prior):** Prior penalizes complex features. "Avoid C" is specific; "Minimize Steps" is simple. Infers $R(Step) < 0$, treats detour as Boltzmann noise. (Incorrect).
  3.  **Belief-Aware:** Allows wrong dynamics. Infers $R(C) \approx 0$, Belief(C=Hot)=True. Attributes avoidance to error, not preference. (Worst reward recovery).

  **Collapse:** Counterfactual: Cover C with cloth. She crosses directly.
  **Info:** Opportunity, not preference. Reveals constraint was surface access/safety perception, not intrinsic location value.
  **Convergence:** If belief corrected (knows C cold), Proc 1 & 3 converge on $R(C) \ll 0$. Proc 2 holds if prior dominates. Belief-mismatch drove Proc 3; rationality assumption drove Proc 2.
  **Grandson:** "You tuned $\beta$ to allow noise" and "Your sparse basis excluded 'Avoid C'."
  **Reality:** Even with optimal $\beta$ and rich basis, Reward vs. Belief degeneracy (Proc 1 vs 3) persists structurally. $P(R|B)$ is ill-posed without $D$. Short data keeps Proc 2 divergent. The degeneracy is not a tuning error; it is the inference problem.
