answer: |-
  ### The Geometry of Belief: Resolving the Puzzles of Mixed Dominance

  To understand this game, we must move beyond the idea that a strategy is only "bad" if another single strategy beats it in every scenario. Instead, we must view strategies through the lens of **beliefs**. A rational player chooses a strategy that maximizes their expected payoff given their belief about what the opponent will do. If a strategy is never a best response to *any* coherent belief, it is unreasonable to play it.

  Here is the resolution of the three puzzles, moving from the nature of mixed strategies to the iterative logic of rationality.

  ---

  ### 1. The Unreasonableness of Strategy C: The Power of Hedging

  **The Puzzle:**
  Look at Row's payoffs. Strategy C yields 4 against L, 4 against M, and 5 against R.
  Strategy A yields 10 against L, but 0 against M.
  Strategy B yields 0 against L, but 10 against M.

  Neither A nor B *strictly dominates* C in the pure sense. If Row is certain Column will play M, C (payoff 4) is better than A (payoff 0). If Row is certain Column will play L, C (payoff 4) is better than B (payoff 0). So, why is C unreasonable?

  **The Intuition of Mixed Dominance:**
  The flaw in C is not that it loses to a specific *pure* strategy, but that it loses to a *plan of hedging*. Imagine Row does not commit to A or B, but instead flips a fair coin: play A on heads, B on tails. This is a **mixed strategy** (50% A, 50% B).

  Let's calculate the expected payoff of this "coin flip" mixture against Column's choices:
  *   **Against L:** A gets 10, B gets 0. The average is **5**. (C gets 4).
  *   **Against M:** A gets 0, B gets 10. The average is **5**. (C gets 4).
  *   **Against R:** A gets 6, B gets 6. The average is **6**. (C gets 5).

  **The Geometric Argument:**
  Think of A and B as "specialists." A is excellent against L but fragile against M. B is excellent against M but fragile against L. Strategy C is a "generalist"—it avoids the disaster of 0, but it caps the upside.
  By mixing A and B, Row creates a "tent" of payoffs that sits strictly above the "plateau" of C. No matter what Column does, the mixture yields a higher average payoff than C.

  **Why No Belief Supports C:**
  For C to be a rational choice, there must be some belief (some probability distribution over L, M, R) that makes C the best option.
  *   If Row thinks L is likely, A is better than C.
  *   If Row thinks M is likely, B is better than C.
  *   If Row thinks R is likely, both A and B are better than C.

  Because the mixture of A and B beats C in *every* column, any weighted average of those columns will also favor the mixture. There is no belief Row can hold that makes C optimal. C is strictly dominated by a mixed strategy, rendering it irrational even though it survives a test of pure dominance.

  ---

  ### 2. The Fate of Strategy R: Iterated Elimination and Consistency

  **The Puzzle:**
  Now consider Column. Initially, Strategy R looks robust. Against Row's C, R yields 5, while L and M yield 0. If Column thinks Row might play C, R is the unique best response. Thus, R survives the first round of elimination. However, once C is removed, R becomes dominated. Why does the status of R depend on the removal of C?

  **The Reduced Game:**
  Once we establish that Row is rational, we know Row will never play C. Column, knowing this, should effectively cross out the "C" row from the matrix. The game reduces to Row playing only A or B.
  In this reduced environment:
  *   **Against A:** L gets 0, M gets 10, R gets 4.
  *   **Against B:** L gets 10, M gets 0, R gets 4.

  Now, consider a mixture for Column: 50% L and 50% M.
  *   Against A, this mixture averages to 5. (R gets 4).
  *   Against B, this mixture averages to 5. (R gets 4).

  In the absence of C, R is strictly dominated by a mixture of L and M. R was only "safe" because it was a haven against the unreasonable strategy C. Once C is deemed impossible, R loses its protective shield.

  **Can We Use Eliminated Strategies in Mixtures?**
  A critical question in iterated elimination is: *To prove R is dominated, can Column use a mixture that includes C?*
  The answer is **no**.
  The logic of iterated elimination relies on consistency. If we eliminate C because it is irrational for Row to play it, then Column *knows* C will not be played. It would be incoherent for Column to then say, "I know Row won't play C, but I will include C in my mixture to prove R is bad." Including C in a mixture implies assigning it a positive probability of being played.
  Therefore, R is dominated **only** by mixtures of the remaining rational strategies (L and M). This distinction ensures that the elimination process reflects a tightening of mutual expectations, not just a mathematical trick. R falls not because C helps dominate it, but because C's removal exposes R's weakness against L and M.

  ---

  ### 3. The Depth of Mutual Knowledge: Who Knows What?

  **The Puzzle:**
  We have eliminated C, then R. But what specific knowledge allows this chain reaction? We must distinguish between being rational and *knowing* the other is rational.

  **Level 1: Row Rationality (Eliminating C)**
  *   **Requirement:** Row is rational.
  *   **Result:** Row recognizes C is dominated by the mix of A and B. Row does not play C.
  *   **Limit:** This does not eliminate R yet. Column might still play R if Column doubts Row's rationality (i.e., if Column thinks Row might play C "by mistake").

  **Level 2: Column's Knowledge of Row Rationality (Eliminating R)**
  *   **Requirement:** Column is rational **AND** Column knows Row is rational.
  *   **Result:** Because Column knows Row is rational, Column is certain C will not be played. Column updates their belief to the reduced game {A, B}. In this reduced game, Column sees R is dominated by a mix of L and M. Column does not play R.
  *   **Note:** Merely knowing Column is rational (from Row's perspective) does not help yet, because Column has no dominated strategies in the *original* game. Row knowing Column is rational doesn't let Row eliminate anything initially. The key link is **Column knowing Row is rational**.

  **Level 3: Row's Knowledge of Column's Knowledge (Final Prediction)**
  *   **Requirement:** Row knows that Column knows Row is rational.
  *   **Result:** Row anticipates that Column has eliminated R. Row now faces a game where Column plays only L or M. Row can now confidently play A or B, knowing R is off the table.

  **Summary of Epistemic Depth:**
  *   **Row Rationality alone:** Eliminates C.
  *   **Row Rationality + Knowledge of Column Rationality:** Eliminates nothing new (Column had no initially dominated strategies).
  *   **Column Rationality + Knowledge of Row Rationality:** Eliminates R.
  *   **Common Knowledge of Rationality:** Stabilizes the outcome at {A, B} vs {L, M}.

  **Conclusion:**
  This game illustrates that rationality is not just about maximizing payoffs in a vacuum; it is about maximizing payoffs given what you know about the opponent's constraints. Strategy C fails because it cannot beat a hedged belief. Strategy R fails because it relies on the opponent playing C. The elimination of R is only valid if Column *knows* C is gone. Thus, iterated elimination by mixed dominance captures the deep interdependence of rational expectations: I won't play my weak strategy if I know you won't play the strategy that makes mine look good.
