          Welcome everyone. It is rare to see maintainers, designers, and philosophers in one room. Usually, we measure our work by what ships. We count commits, track issues closed, and monitor uptime. These metrics are useful for shipping, but they are blind to why we are here. We are here to ask if the collaboration itself holds value independent of the software it produces.

