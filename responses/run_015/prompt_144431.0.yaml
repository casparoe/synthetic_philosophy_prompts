      *   **Core Claim:** The working-class orientation toward "direct material resistance" (judging by repair outcomes, trust through labor, things as particular/recalcitrant) is epistemically and morally superior to the professional-class orientation (reality as representable/administrable/mediated by certification).
      *   **Critique of Professionalism:** It mistakes symbolic mastery for practical understanding; loses track of how things behave under stress.
