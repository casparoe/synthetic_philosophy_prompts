  2.  **Initial Assessment & Tone:**
      *   The user is articulate, philosophical, and likely well-read (references to epistemology, material resistance, symbolic mastery). They are living the transition (design firm -> repair shop).
      *   The tone should be rigorous, respectful, and analytical. Avoid condescension. Treat this as a serious philosophical inquiry into the epistemology of practice (phenomenology of work, virtue epistemology, sociology of knowledge).
      *   Key philosophical touchstones: Polanyi (tacit knowledge), Heidegger (ready-to-hand vs. present-at-hand), Scott (*Seeing Like a State*), Crawford (*Shop Class as Soulcraft*).

  3.  **Brainstorming Defeaters (The "Map of Exposure"):**
      *   *Safety/Scaling:* A mechanic can fix *this* tractor. Can they certify *all* tractors of this model? What about nuclear plants? Bridges? Aviation? Direct engagement doesn't scale.
      *   *Predictive Accuracy:* Abstraction allows simulation. You can't stress-test a bridge by building it until it breaks every time. Symbolic models predict failure *before* it happens.
      *   *Collective Decision-Making:* Trust through shared labor works in a shop of 5. How does it work in a supply chain of 5,000? Certification is a trust proxy for anonymity.
