      *   *French Festivals:* Good for Anderson (creating the Republic), but slightly more abstract than clothing.
      *   *Decision:* The **Scottish Kilt** is stronger for a general audience. It's visual, specific, and clearly demonstrates the "old equals authentic" trap. It doesn't collapse the concepts because the kilt is the *tool* (tradition) used to imagine the *community* (Scotland).
      *   *Requirements for the example:* Must be specific, must have a clear date of invention, must be emotionally resonant (people care about kilts), must not be politically toxic (avoiding current independence debates too heavily).

  5.  **Address Question 3: Misconceptions:**
      *   *'Invented' = 'Fake/Lie':* Address this immediately after introducing Hobsbawm. Use the word "constructed" or "forged" rather than "made up." Emphasize function over truth.
      *   *'Imagined' = 'Fiction':* Address this when moving to Anderson. Contrast "imagined" with "fabricated." Use the analogy of a marriage or a bank note (social reality vs. physical reality).
      *   *'Old = Authentic':* Address this throughout, but specifically during the example analysis.
      *   *Sequence:*
