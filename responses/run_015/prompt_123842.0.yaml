      *   **Anderson (Imagined Communities):** Nations are imagined because members will never know most of their fellow-members, yet in the minds of each lives the image of their communion. Limited and sovereign.
      *   **Connection:** Invented traditions are often the *tools* used to solidify the *imagined community*. You need the concept of "construction" (Hobsbawm) to understand the "imagining" (Anderson) without dismissing it as falsehood.

  3.  **Address Question 1: Sequence & Dependencies:**
      *   User thinks: Tradition first, then Nation.
