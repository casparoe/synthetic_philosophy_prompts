  5.  **Address the Core Philosophical Concept (Being Right vs. Standing to Blame):**
      *   *Being Right:* The factual accuracy of the claim (The oven is dirty).
      *   *Standing to Blame:* The moral authority to criticize (Do I have clean hands?).
