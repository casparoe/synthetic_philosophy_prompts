prompt: |-
  I'm a fourth-year PhD student in philosophy of science who got dragooned onto a computational neuroscience consortium's Standards & Replication panel because I was apparently the only person in the building who'd read anything about mechanistic explanation, and now I have to write the actual opinion. The case is this. Two member labs study what everyone in the consortium has casually been calling "the same mechanism": a recurrent cortical circuit that implements a particular form of adaptive gain control. Lab A works at the cellular level, with a perturbation-signature detector they built themselves -- it takes a fresh dataset and asks whether the variables that used to predict the output still do, holding the input distribution fixed, so that it's supposed to flag a change in the mechanism itself rather than just a change in the inputs (one of the postdocs keeps calling this "mechanism shift as opposed to covariate shift," which I think is just a rebranding of an old distinction but whatever). Lab B runs the same preparation but reads out at the population level with calcium imaging, and when they feed their data through A's detector it flags. B says: different mechanism, the conservation claim is dead. A says: same mechanism, you're just measuring it at a coarser grain, and the flag is an artifact of your readout rather than a fact about the circuit. The stakes are concrete: there's a review paper in press that asserts the mechanism is conserved across the two preparations, and our panel has to decide whether to require it be revised, whether to fund a bridging study to settle it, and what guidance we give member labs about describing "the same mechanism" in future papers. We meet Thursday.

  Please draft the short written opinion I'll circulate: a clear recommendation with a time frame, the reasoning behind it, a criterion reviewers can actually apply to future cases, and an honest treatment of the strongest thing the side I come down against could say. I want you to commit on the substantive question of how the mechanism should be individuated here -- whether by what you can intervene on to change the outcome and how specific that intervention is, by which parts are constitutively relevant to the whole's behavior, by the causal role relative to a contrast class, or by something else -- rather than laying the four options out and leaving it to me, and I'd like you to say plainly where that criterion gets the case wrong if it does. It would also help if you take a stand on the more general thing I keep going back and forth on: is "same mechanism" ever a two-place relation between two systems, or is it always implicitly three-place, relative to a description and a contrast class someone chose, and if it's the latter, what follows for a detector that claims to tell you when the mechanism changed. Don't worry about citing anyone, I know the literature, I just need the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion draft:

  1.  **Analyze the Request:**
      *   **User:** 4th-year PhD student in philosophy of science.
      *   **Context:** Dragged onto a computational neuroscience consortium's Standards & Replication panel. Needs to write an opinion on a dispute between two labs (Lab A: cellular/perturbation, Lab B: population/calcium imaging) regarding whether they study "the same mechanism" (adaptive gain control circuit).
      *   **The Conflict:** Lab A's "perturbation-signature detector" flags Lab B's data as a mechanism shift. Lab B says "different mechanism, conservation claim dead." Lab A says "same mechanism, your readout is too coarse/artifactual."
      *   **Stakes:** Review paper in press, funding for bridging study, future guidance on "same mechanism."
      *   **Deadline:** Meeting Thursday (needs to be ready to circulate soon).
      *   **Requirements:**
          *   Clear recommendation with time frame.
          *   Reasoning.
          *   Applicable criterion for reviewers.
          *   Honest treatment of the strongest opposing argument (steel-manning).
          *   **Commitment:** Must choose a specific account of mechanistic individuation (Interventionist? Constitutive? Causal Role? Other?). No fence-sitting.
          *   **Metaphysical Stand:** Address whether "same mechanism" is a 2-place or 3-place relation (relative to description/contrast).
          *   **Critique:** Acknowledge where the chosen criterion fails.
          *   **Style:** No citations (user knows the lit), argumentative, professional but direct.

  2.  **Determine the Philosophical Stance:**
      *   *Option 1: Craver's Constitutive Relevance.* Focus on parts and organization. Problem: Lab B's imaging might miss the specific parts Lab A sees. Hard to adjudicate "coarse grain" vs. "different mechanism."
      *   *Option 2: Woodward's Interventionist.* Focus on invariance under intervention. Lab A's detector is essentially interventionist (perturbation). But Lab B claims the *readout* causes the flag, not the mechanism.
      *   *Option 3: 3-Place Relation (Contextual/Pragmatic).* "Same mechanism" is always relative to a *target phenomenon* and a *contrast class*. This fits the "adaptive gain control" description.
      *   *Decision:* The most robust position for a consortium setting is a **hybrid of Interventionist Individuation constrained by Pragmatic/Contrastive Context.** Specifically, I need to argue that "mechanism" is a 3-place relation (System, Phenomenon, Granularity/Contrast). However, since the user asked me to *commit* on individuation, I should lean towards **Causal Role/Functional Individuation relative to a specific Contrast Class**, rather than strict structural identity. Why? Because Lab A and Lab B are measuring the *same function* (adaptive gain control) but at different scales. If the function holds invariant across the scale change, it's the "same mechanism" for the purpose of the review paper, *provided* the failure in Lab B's data is explained by measurement noise/aliasing, not functional divergence.
      *   *Refinement:* Actually, the prompt asks to commit on *how* it's individuated. The tension is between A (structural/perturbation specific) and B (population readout). If I side with A, I risk ignoring scale. If I side with B, I risk fragmentation.
      *   *Best Philosophical Move:* Argue that "Same Mechanism" is **always a 3-place relation** (System, Phenomenon, Explanatory Context). Therefore, the detector cannot be a binary "Mechanism/Not-Mechanism" switch. It must be "Mechanism-for-Phenomenon-X-at-Grain-Y."
      *   *Individuation Criterion:* **Invariant Causal Role under Perturbation.** If the input-output mapping (adaptive gain) remains invariant under the specific perturbations relevant to *that function*, it is the same mechanism, even if the readout grain differs. Lab A's detector is too sensitive to grain if it flags B's data without checking if the *gain control function* broke.
      *   *Recommendation:* Do not kill the review paper. Fund the bridging study. The detector needs calibration.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary/Recommendation:** Immediate action items. Don't retract yet. Fund the bridge.
      *   **The Core Philosophical Commitment (Individuation):** I need to pick one. I will argue for **Causal Role Individuation relative to a Contrast Class.** This means we individuate mechanisms by *what they do* (gain control) and *what they are distinct from* (e.g., static gain, different adaptation time constants), not just by the specific ions/channels (A) or population blobs (B).
      *   **The Metaphysical Stand (2-place vs. 3-place):** It is **irreducibly 3-place**. $Mechanism(S, P, C)$ where $S$ is system, $P$ is phenomenon, $C$ is contrast class/granularity. A detector claiming to find "mechanism shift" without specifying $P$ and $C$ is category-mistaken.
      *   **Addressing the Conflict:** Lab A's detector flags a shift. But is it a shift in the *gain control mechanism* or a shift in the *measurement of the gain control mechanism*? If the function holds, it's the latter.
      *   **Steel-manning the Opposition:** Lab A is right that structural changes matter. If the cellular implementation changes, the mechanism *could* be different (multiple realizability vs. mechanistic heterogeneity). If B's imaging smears out the critical causal nodes, B isn't seeing the mechanism at all.
      *   **Where the Criterion Fails:** Acknowledge that Causal Role individuation can be too permissive. It might lump together structurally distinct systems that happen to do the same thing (black boxing), which neuroscience hates.
      *   **Guidance for Reviewers:** Require explicit statement of the Phenomenon and Contrast Class when claiming "same mechanism."

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Causal Role" too vague?
      *   *Fix:* Tie it to the *specific perturbation signature*. The detector looks for variable predictivity. If the predictivity changes because of calcium decay rates (B's method) rather than circuit topology, the mechanism hasn't changed, the *observation model* has.
      *   *Tone:* Needs to be authoritative but collaborative. I'm the philosopher, they are the scientists. I need to translate metaphysics into policy.
      *   *Commitment:* I will explicitly reject the idea that the detector gives a truth value on "Mechanism." It gives a truth value on "Model Fit."

  5.  **Final Polish:** Check against constraints.
      *   Commit on individuation? Yes (Causal Role/Contrastive).
      *   2-place vs 3-place? Yes (3-place).
      *   Strongest opposing argument? Yes (Structural constitution matters).
      *   Where criterion fails? Yes (Over-permissiveness/Black-boxing).
      *   No citations? Yes.
      *   Time frame? Yes (Immediate/6 months).

  6.  **Writing the Draft:** (Mental outline of the text)
      *   To: Consortium Panel
      *   From: [User Name/Role]
      *   Subject: Recommendation on Mechanism Conservation Claim
      *   Rec: Pause revision, fund bridge study (6 months).
      *   Reasoning: The dispute is category error. "Same mechanism" is 3-place.
      *   Criterion: Invariance of Input-Output mapping under *relevant* perturbations.
      *   Opposing view: Constitution matters (A's view).
      *   Limitation: My view allows black-boxing.
      *   Policy: Explicitly state the Contrast Class.

  7.  **Final Review against User Prompt:** "I want you to commit on the substantive question of how the mechanism should be individuated here... rather than laying the four options out." -> I must ensure I don't list options but argue for *one*. "Say plainly where that criterion gets the case wrong if it does." -> Need a specific "Failure Mode" section.

      *Decision on Individuation:* I will argue for **Contrastive Causal Role Individuation**. This aligns with the "adaptive gain control" functional description while acknowledging the perturbation aspect.
      *Decision on 2 vs 3 place:* Definitely 3-place. This undermines the detector's claim to absolute truth.

      *Let's write.*
answer: |-
  **TO:** Standards & Replication Panel, Computational Neuroscience Consortium
  **FROM:** [Your Name], Philosophy of Science Liaison
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Mechanism Conservation Claim (Lab A vs. Lab B)

  ### 1. Recommendation and Time Frame

  **Decision:** Do not require immediate revision of the review paper's conservation claim, but append a methodological caveat. Approve funding for a bridging study immediately.

  **Time Frame:** The bridging study must produce a joint dataset (cellular perturbation + population imaging on the *same* preparation) within **six months**. If the joint data confirms Lab B's flag as a readout artifact, the conservation claim stands unqualified. If the joint data confirms a functional divergence, the review paper must be amended to specify the boundary conditions of the mechanism.

  ### 2. Substantive Reasoning: How We Individuate Mechanisms

  To resolve this, we must commit to a criterion for individuation. We cannot treat "mechanism" as a natural kind that exists independently of our inquiry.

  **The Criterion: Contrastive Causal Role Individuation.**
  A mechanism is individuated not by its constituent parts alone (Lab A's implicit view) nor by its gross output alone, but by the **invariance of its input-output mapping under a specific class of perturbations relevant to a defined phenomenon.**

  In this case, the phenomenon is "adaptive gain control." Therefore, the mechanism is "the same" if and only if the specific input-output relationship defining *gain control* remains invariant under perturbations that target gain control, regardless of whether the readout is cellular or population-level.

  **Application to the Case:**
  Lab A's detector flags a "mechanism shift" because the predictive variables change when moving from cellular to population data. However, under Contrastive Causal Role Individuation, this flag is ambiguous. It tells us the *model* has shifted, not necessarily the *mechanism*.
  *   If the change in predictivity is due to calcium imaging temporal aliasing (a measurement artifact), the causal role of the circuit regarding gain control is invariant. The mechanism is the same.
  *   If the change in predictivity is due to the population readout averaging over distinct sub-circuits that actually perform different computations, the causal role is not invariant at that grain. The mechanism is different.

  Lab A assumes the detector identifies ontological shifts. It does not; it identifies statistical instability. Lab B assumes statistical instability at the population level negates cellular conservation. It does not; it may merely indicate that the population readout is the wrong grain for *that specific detector*.

  ### 3. The Metaphysical Stand: The "Same Mechanism" Relation

  We must stop treating "same mechanism" as a two-place relation ($Mechanism(System_1) = Mechanism(System_2)$). It is **irreducibly a three-place relation**:

  $$SameMechanism(System_1, System_2, \langle Phenomenon, ContrastClass \rangle)$$

  You cannot ask if two systems have the "same mechanism" without specifying *which phenomenon* they are explaining and *what alternative mechanisms* you are ruling out (the contrast class).

  **Implication for the Detector:**
  Lab A's perturbation-signature detector claims to output a binary truth value on mechanism change. This is a category error. The detector can only output a truth value relative to a specified grain and phenomenon. If the detector is trained on cellular variables but applied to population averages without adjusting the contrast class (the set of expected variables), a flag is inevitable even if the underlying gain control function is identical. The detector is measuring "Model Fit," not "Mechanism Identity."

  ### 4. The Strongest Opposing Argument (Steel-manning Lab A)

  The strongest argument against my recommendation comes from a **Constitutive Relevance** view (favoring Lab A).

  **The Argument:** Mechanisms are not just input-output functions; they are structured entities. If the causal nodes you can intervene on change (from specific cells to population blobs), you have changed the mechanism's organization. If Lab B's imaging smears out the specific inhibitory interneurons that Lab A identified as critical for the gain control, then Lab B is not studying the gain control mechanism at all; they are studying a correlate. To claim "conservation" when the constitutive parts are no longer resolvable is to engage in black-boxing, which defeats the purpose of mechanistic neuroscience. If the detector flags, it is because the causal structure accessible at the population level does not map 1:1 to the cellular level. Therefore, the conservation claim is false because the *explanatory structure* is not conserved.

  **Why this is compelling:** It protects us from claiming we understand a mechanism when we have actually lost track of the parts that do the work. It prevents us from sweeping heterogeneity under the rug of "functional equivalence."

  ### 5. Where My Criterion Fails

  I must be honest about the failure mode of Contrastive Causal Role Individuation.

  **The Failure Mode: Over-Permissiveness (The Black Box Problem).**
  By focusing on the invariance of the input-output role, my criterion risks lumping together systems that achieve the same gain control via radically different structural means (e.g., synaptic depression vs. inhibitory feedback). If the consortium adopts my view, we risk publishing papers that claim "mechanism conservation" when we have only demonstrated "functional equivalence." This obscures the very structural details that allow for targeted interventions (e.g., drug development). If we define the mechanism too loosely by its causal role, we lose the ability to predict what happens when the system is perturbed in ways *outside* the defined contrast class.

  ### 6. Guidance for Reviewers and Future Papers

  To prevent this stalemate from recurring, the Consortium will adopt the following standard for claims of mechanism conservation:

  1.  **Explicit Contrast Class:** Authors must state what alternative mechanism they are ruling out. (e.g., "We claim this is the same mechanism as X, as opposed to a distinct circuit implementing similar gain dynamics.")
  2.  **Grain Sensitivity Analysis:** When claiming conservation across scales (cellular to population), authors must demonstrate that the "mechanism shift" detector is calibrated for the coarser grain. A flag at a coarser grain is not evidence of mechanism change unless it correlates with a failure of the *phenomenon* (i.e., loss of gain control).
  3.  **No Binary Claims:** Papers must not assert "The mechanism is conserved" as a binary fact. They must assert "The mechanism is conserved *with respect to* phenomenon P at grain G."

  **Summary:** The review paper stands pending the bridging study. The detector is a tool for model validation, not ontological adjudication. We fund the bridge to determine if the flag is noise (B's readout) or structure (A's constitution). Until then, "same mechanism" is a claim relative to the phenomenon of adaptive gain, not an absolute identity.
