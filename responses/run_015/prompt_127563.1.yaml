  **Correspondence table**
  In the "creature as computer" mapping: the **Program** corresponds to the synaptic weights and genetic wiring diagram determining neural connectivity. **Input** is sensory transduction (retina, muscle spindles). **Clock** is roughly neural oscillation or metabolic cycles, though biology is largely asynchronous. **Output** is motor neuron firing activating muscles. **Programmer** is natural selection acting over generations, plus developmental learning acting over a lifetime. **Memory** is synaptic strength modification. **Processor** is the neural net itself. Note that this maps cleanly onto digital computation only if you treat the brain as a discrete state machine, which is your first point of friction. The mapping assumes a separation between software (weights) and hardware (neurons) that is blurrier in biology, where structure changes function dynamically. The "state" of the machine is the pattern of membrane potentials, but unlike a register, this state decays continuously without refresh.

  **Where it holds**
  The analogy holds where behavior is stereotyped. Reflex arcs function like hardwired lookup tables: stimulus A yields response B. Habitual actions, like your shoe-tying example, resemble compiled subroutines—efficient, low-overhead routines that bypass high-level monitoring. The wasp's rigidity confirms that biological hardware can execute fixed sequences without comprehension. Both systems transform input to output via physical laws. Much of our behavior is mechanically triggered, just as the wasp's is. The autopilot phenomenon proves humans possess open-loop modules that run without conscious supervision. Where actions are routine and context-invariant, the computational description is accurate.

  **Where it breaks**
  The breakdown occurs where the "program" metaphor implies sequential execution rather than continuous regulation. As you noted, a control law is fixed, but its *output* varies continuously with disturbance. The wasp isn't running a long list of instructions; it's stuck in a shallow feedback loop. Its setpoint is "cricket at threshold," not "cricket in nest." When you move the cricket, the error signal resets, and the loop repeats. It lacks a higher-order controller to monitor the *success* of the lower loop.

  Humans differ in hierarchical depth. Your driving autopilot is a lower-level servo maintaining lane position. The "you" that remembers nothing is the high-level planner that disengaged. Crucially, the high-level planner *can* re-engage. If a child runs into the road, the autopilot breaks, and high-level control intervenes. The wasp's high-level controller is absent or inaccessible.

  Furthermore, biological "code" is not discrete. It's a dynamical system. A fixed differential equation can generate infinite trajectories depending on initial conditions and ongoing input. The argument assumes flexibility requires new code (more lines), whereas control theory shows flexibility comes from error-correction capacity (loop gain). The wasp has low loop gain regarding the actual goal. We have high gain, adjustable setpoints, and the ability to reconfigure the hierarchy itself. The gap is architectural, not merely volumetric. A million-line open-loop script is still brittle; a three-line negative feedback loop is robust. The argument conflates complexity of description with flexibility of response.

  The flyball governor doesn't pick its setpoint, but a human operator does. In humans, meta-control loops adjust the setpoints of lower loops based on context. We change goals; the wasp cannot. The wasp's tragedy is a sensorimotor mismatch: its perceptual input doesn't match its biological goal. It senses "threshold," not "security." Humans have internal models that simulate outcomes before acting. We run offline simulations. The wasp cannot simulate. When you move the cricket, you introduce a disturbance. The wasp treats this as a reset condition, not an error to be compensated. A human controller treats disturbance as noise to be rejected while maintaining the target trajectory. The wasp abandons the trajectory. This is the definition of open-loop behavior disguised as a loop. It closes the loop on the wrong variable.

