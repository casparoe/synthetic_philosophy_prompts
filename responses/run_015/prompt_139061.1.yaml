answer: |-
  This is a profound observation that touches on the intersection of semiotics, cognitive psychology, and design theory. You have correctly identified that standard terms like "style" or "family resemblance" are insufficient because they imply surface decoration or shared physical features, whereas you are describing a **structural** and **systemic** phenomenon.

  There is no single English word that perfectly captures all three of your observations (identity without shared features, definition by contrast, and systemic coherence) without qualification. However, there is a cluster of established concepts from linguistics, semiotics, and cognitive science that, when combined, give you a defensible term for a national newspaper audience.

  Here is the breakdown of the available terminology, why the usual suspects fail, and the term I recommend you use.

  ### 1. The Linguistic Term: *Allography*
  In linguistics and orthography, the specific phenomenon of the lowercase 'a' having two distinct forms (one-storey and two-storey) that are treated as the same functional unit is called **allography**. The individual shapes are **allographs** of the same **grapheme**.

  *   **Why it fits:** It precisely describes Observation 1 (identity without shared features). It establishes that the identity is functional, not visual.
  *   **Why it falls short:** It describes the *variation* of the letter, but not the *constraint* of the system. It explains why two 'a's are both 'a's, but not why an 'a' from Font A breaks Font B. It is too atomic; it doesn't capture the "whole set" constraint (Observation 2).

  ### 2. The Semiotic Term: *Value (Valeur)*
  Ferdinand de Saussure, the father of modern linguistics, argued that in a system of signs, identity is not defined by positive content (what a thing *is*) but by **difference** (what a thing *is not*). He called this **Value**. An 'a' is an 'a' because it is not an 'o', 'd', or 'u' *within that specific system*.

  *   **Why it fits:** It perfectly describes Observation 1 and 2 (identity fixed by neighbours). It explains why lifting a glyph stroke-for-stroke fails: you have moved a sign into a system where its "value" (its difference from its neighbours) has changed.
  *   **Why it falls short:** It is abstract and philosophical. Using "Value" in a newspaper piece risks confusion with economic or aesthetic value. It also doesn't inherently convey the *generative* aspect (Observation 3: knowing 'a' predicts 'g').

  ### 3. The Cognitive Science Term: *Relational Category*
  In cognitive psychology, categories are often divided into **feature-based** (defined by a list of traits) and **relational** (defined by the relationship between parts or context). Your description of the typeface is a classic **Relational Category**. The brain does not store a template of an 'a'; it stores the *relationship* of the 'a' to the rest of the alphabet.

  A closely related concept is **Configural Processing**. Just as humans recognize faces not by measuring the nose in isolation but by the spatial relationship between eyes, nose, and mouth, we recognize typefaces **configurally**.

  *   **Why it fits:** It covers Observation 3 (the whole set at once). It explains why a font can fail to "hang together" even if individual glyphs are well-drawn (the configuration is wrong).
  *   **Why it falls short:** "Relational Category" is dry academic jargon. "Configural" is slightly more accessible but often associated specifically with face recognition.

  ### The Recommendation: *Relational Identity*

  For a piece in a national newspaper, I recommend you coin the phrase **"Relational Identity"** (or **"Systemic Identity"**), explicitly grounding it in the cognitive and semiotic concepts above.

  While "Relational Identity" is used in sociology and psychology, it is not "owned" by typography, allowing you to define it precisely in your text without contradicting established design dogma. It is defensible because it accurately synthesizes *Allography* (the identity persists across forms) and *Saussurean Value* (the identity is defined by relations).

  **How to define it in a clause:**
  > *"The letters possess a **relational identity**: they are defined not by their own shapes, but by how they differ from their neighbours within the system."*

  Or, leaning into the cognitive science angle:
  > *"We recognize the typeface through **configural processing**: we see the system of relationships, not just the sum of the parts."*

  ### Addressing Your "Edges" with this Term

  Using **Relational Identity** allows you to cleanly categorize the edge cases you mentioned:

  1.  **The Revival/Parody:** A parody works because it mimics the **relational identity** of the original font (the specific way the 'a' differs from the 'o') without copying the glyphs. It quotes the *system of differences*, not the shapes.
