answer: |-
  # THE ASYMMETRY OF SURVIVAL PROTOCOL (AOSP)
  **For:** Documentary Research Team | **Subject:** Factual Claims (Pre-500 BC)
  **Purpose:** To stress-test historical claims against the bias of the archaeological and textual record before narration.

  ### PHASE 1: INVENTORY (Stop if incomplete)
  **1. Define the Claim.**
  *   *Test:* Can the claim be stated in a single sentence without qualifying clauses? (e.g., "City X was sacked by Group Y," not "It is possible that...")
  *   *Action:* Write the claim. If it relies on "might," "could," or "perhaps," mark as **Interpretation**, not Fact.

  **2. List the Evidence.**
  *   *Test:* List every distinct source type supporting the claim (e.g., Stratigraphy, Contemporary Text, Later Tradition, Isotope Analysis).
  *   *Action:* Count the *independent media*. (Two texts from the same archive = 1 medium).

  ### PHASE 2: THE COUNTERFACTUAL TEST (Genuine Test)
  **3. Construct the Negative World.**
  *   *Question:* If this claim were **false**, what specific trace would the world have left instead?
  *   *Sufficient Answer:* A specific alternative trace (e.g., "If not sacked, a layer of continuous habitation," or "If not a victory, a treaty of submission").
  *   *Fail State:* "We wouldn't know." (If the false world looks identical to the true world, the claim is unfalsifiable. **VERDICT: UNUSABLE**).

  **4. Apply the Survival Filter.**
  *   *Question:* Would the alternative trace from Step 3 survive the same decay processes (fire, rot, recycling, excavation bias) as the evidence we *do* have?
  *   *Yes:* The evidence is robust. (The record distinguishes truth from falsehood).
  *   *No:* The evidence is fragile. (The record looks the same whether true or false).
  *   *Action:* If **No**, downgrade confidence.

  ### PHASE 3: THE SILENCE AUDIT (Judgement Call)
  **5. Classify the Absence.**
  *   *Question:* There is no evidence contradicting the claim. Why?
  *   *Expected Silence:* The medium rots (e.g., papyrus in wet soil, wood in fire). **→ Proceed.**
  *   *Surprising Silence:* The medium survives elsewhere but is missing here (e.g., stone inscriptions exist for other kings, but not this event). **→ Flag as Evidence Against.**
  *   *Manufactured Silence:* Later selection destroyed the counter-record (e.g., victors burned the library, later scribes copied only one version). **→ Hand to Presenter.**

  ### PHASE 4: VERDICT (Stop and Assign)
  **6. Assign Status.**
  *   **FACT (Green):** ≥2 Independent Media + Survival Filter Passed + No Surprising Silence.
  *   **THEORY (Amber):** 1 Independent Media OR Survival Filter Failed OR Surprising Silence present. *Narrate as scholarly consensus, not absolute truth.*
  *   **UNUSABLE (Red):** Unfalsifiable (Step 3 Fail) OR Single Ambiguous Source with No Asymmetry. *Do not narrate as fact.*
  *   **EDITORIAL (Blue):** Passes tests but relies on Step 5 (Manufactured Silence) or interpretation of intent. *Hand to Presenter.*

  ***

  ### LIMITATIONS OF PROCEDURE
  1.  **Cannot Prove Truth:** AOSP only measures resilience against loss. A lie can survive if the truth would have rotted anyway.
  2.  **Cannot Measure Intent:** It cannot distinguish between a liar and a mistaken observer if both leave the same trace.
  3.  **Human Override:** Step 5 and Step 6 (Editorial) require human judgement on narrative value vs. risk. The procedure identifies risk; the Presenter accepts it.

  ***

  # APPLICATION TO PENDING CLAIMS

  ### CASE 1: Coastal City Sacked by Sea Peoples (c. 1200 BC)
  *   **Evidence:** Destruction layer (Archaeology), Greek tradition (Late Text), Egyptian Inscription (Contemporary Text, Ambiguous).
  *   **Step 3 (Negative World):** If not sacked, we expect a layer of continuous habitation or a different destruction cause (earthquake).
  *   **Step 4 (Survival):** Fire destroys wood/mud either way. Earthquake looks like sack in strata. Survival Filter **FAILED** (Strata cannot distinguish sack from quake without human remains/artifacts).
  *   **Step 5 (Silence):** Egyptian inscription is ambiguous. Absence of specific "Sea Peoples" name in city ruins is **Expected Silence** (cities don't write their own death certificates).
  *   **Verdict:** **THEORY (Amber).**
  *   **Note:** The destruction is fact; the *agent* (Sea Peoples) is not secured by asymmetry. Narrate as "Destruction consistent with Sea Peoples activity," not "Sacked by Sea Peoples."

  ### CASE 2: Royal Victory Inscription is Inflated
  *   **Claim:** The King's account of victory is substantially exaggerated.
  *   **Evidence:** The Inscription (Late), Absence of defeated power's records, Time gap.
  *   **Step 3 (Negative World):** If *not* inflated (i.e., accurate), we might expect contemporary records or defeated power's acknowledgment.
  *   **Step 4 (Survival):** Defeated power's records likely destroyed (war) or never made (illiterate/periheral). Survival Filter **FAILED**. The counter-evidence would not survive even if the claim were false.
  *   **Step 5 (Silence):** Absence of defeated records is **Manufactured Silence** (Victor destroyed them) OR **Expected** (They had no archives). We cannot distinguish.
  *   **Verdict:** **EDITORIAL (Blue).**
  *   **Note:** The procedure cannot prove inflation because the asymmetry is broken by the war itself. The claim rests on interpreting *tone* and *propaganda conventions*, not survival asymmetry. **Hand to Presenter.**

  ### CASE 3: Queen Led Coalition Against Invaders
  *   **Claim:** A specific Queen commanded the defense.
  *   **Evidence:** Single ambiguous text (Poetic/Literary), No independent corroboration.
  *   **Step 3 (Negative World):** If false (no Queen), we might expect a King's name, or no name at all.
  *   **Step 4 (Survival):** If a King led it, would his name survive? Likely yes (administrative). If a Queen led it, would her name survive? Less likely (bias against female rulers in later copying).
  *   **Step 5 (Silence):** Absence of administrative records for the Queen is **Surprising Silence**. Administrative clay tablets survive for minor officials; none name her.
  *   **Verdict:** **UNUSABLE (Red).**
  *   **Note:** The survival asymmetry is negative. A true Queen-Commander should have generated administrative traces (rations, orders) that survive better than poetic texts. The poetic text survives *because* it is literature, not because it is fact.
  *   **Presenter Conflict:** This claim fails the protocol. It relies on a source type (poetry) that survives *better* than the evidence that would prove it false (administration). The procedure dictates this cannot be narrated as fact.

  ***

  # HANDOVER NOTE TO PRESENTER
  **Case 3 requires your direct decision.** The AOSP returns a **RED** verdict. The evidence is exactly the kind that survives when the truth is lost (literary tradition vs. administrative record). Narrating this as fact violates the Asymmetry Principle you commissioned. You may still choose to include it as "Legend" or "Tradition," but the procedure forbids labeling it "History."

  **Case 2 requires your direct decision.** The AOSP returns **BLUE**. The evidence for inflation is circumstantial. The procedure cannot weigh the *likelihood* of propaganda vs. error, only the survival of traces. You must decide if the *tone* of the inscription is sufficient for the narrative, acknowledging the epistemic gap.
