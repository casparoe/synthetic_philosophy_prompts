  1. If every spandrel is just an exaptation in waiting, doesn't the term 'spandrel' lose its descriptive power? What work is it doing in your vocabulary if it's just a temporary state?
     *Follow-up:* If she says it marks a "temporal lag," ask: Is that lag measurable? Or is the label only applied retrospectively once function appears?

  2. Gould and Lewontin wanted to curb "just-so stories." By assuming function exists even when unseen, aren't you encouraging more speculative storytelling?
     *Follow-up:* If she says it "drives research," ask for a specific case where assuming latent function found a truth that assuming non-function would have missed.

  3. Let's talk chin. What's the specific selective pressure? Is it structural reinforcement or sexual signaling?
     *Follow-up:* If she admits "we haven't found it yet," ask: How many years of null results before we accept it might just be an architectural byproduct?

  4. If the chin is purely biomechanical fallout from jaw shrinkage, why insist it's latent adaptation rather than constraint?
     *Follow-up:* If she argues "constraints are selected for," ask: Does that mean *every* physical constraint becomes an adaptation by definition?

  5. If "latent" means "function coming later," how do you test for something that hasn't happened? Isn't that unfalsifiable?
     *Follow-up:* If she says "look at phylogenetic retention," ask: Couldn't retention just be drift? How do you rule out noise?

  6. Does this view make natural selection a guarantee rather than a filter? If everything persists, it must be latent useful.
     *Follow-up:* If she says "no, useless traits die," ask: What about traits that are neutral but linked to beneficial ones? Is that latent too?

  7. Is writing an adaptation of the brain or a spandrel of visual/object recognition systems?
