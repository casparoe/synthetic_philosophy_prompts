  *   **Modified (3):** If there **exists** an available option $X$ such that for all available $Y$, $EV(X) \ge EV(Y)$, rationality forbids choosing any $Z$ where $EV(X) > EV(Z)$.

  **Why this works:** This principle only activates **if a maximum exists**. If the menu is truly open-ended and no maximum exists, the antecedent of the rule is false. The rule goes silent. It does not forbid all options; it simply fails to prescribe any. In cases where no maximum exists, all options are permissible (or at least, not forbidden by EV theory).

  **The Cost:** EV theory becomes silent in hyper-idealized, non-compact choice sets. However, since all *real* choice sets are compact (due to the limits in section 1), the theory remains action-guiding in the real world.

  ### 4. Why You Must Not Reject (1)
  Your housemate's reading group suggested bounding value (rejecting 1). You are right to be skeptical.
  *   **The Cost:** If you bound value, you kill Fanaticism. If there is a maximum utility $U_{max}$, then for a sufficiently small probability $p$, $p \times U_{max}$ will be less than a certain moderate good. This forces you to ignore existential risks or cosmic-scale opportunities if their probability is low enough.
  *   **Verdict:** This saves decision theory from paradox but sacrifices the specific ethical view (Fanaticism) you are trying to defend.

  ### Summary: What to Tell Your Housemate
  "The argument proves that **Standard Expected Utility Theory is incompatible with an actually infinite, open-ended choice set.** It does not prove EV Fanaticism is false; it proves that the 'Bookmaker of the Long Now' is a physically impossible device for a finite agent.

  In the real world, I cannot name an arbitrarily large $G$. I can only name numbers up to my cognitive limit. Within *that* set, there is a maximum. I will choose that maximum. Thus, I am not paralyzed, and I still prioritize the huge long-shot over the certain small good. The paradox only exists in a realm where I can process infinite information, in which case I am not a human agent anyway."

  **Recommendation:** Reject **(2)**. The price is acknowledging that **rationality is bounded by computability**, but this is a necessary constraint to prevent the theory from demanding the impossible. This preserves Unbounded Value (1) and the core imperative of Maximization (3) for all actionable cases.
