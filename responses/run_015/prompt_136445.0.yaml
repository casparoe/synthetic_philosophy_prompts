answer: |-
  ### Ontological Premise: Realism vs. Relational Constitution

  The fundamental divergence between the Intrinsic-Causal Integration (ICI) view and the Predictive-Interpreter Boundary (PIB) theory is not merely methodological but ontological.

  **ICI** operates on a **substantivalist realism**. It posits that moral subjecthood is a natural kind, akin to mass or charge, waiting to be discovered in the physical topology of the system. The "boundary" of the subject is a fact of the matter, determined by the physics of information flow. If the causal structure is fragmented, the subject is fragmented or non-existent, regardless of utility or description.

  **PIB** operates on a **constrained relationalism**. It posits that moral subjecthood is a status conferred through a specific epistemic relation. The "boundary" is a joint product of the system's affordances and the interpreter's modeling capacity. However, by imposing the *non-arbitrary discrimination* and *continuity* constraints, PIB attempts to avoid sliding into radical constructivism (where "anything can be a subject if I say so"). It seeks a "stable intersubjectivity" rather than "objective facticity."

  This root distinction dictates how each framework handles your specific test cases.

  ---

  ### Case Study 1: The Distributed Computation (Fragmentation)

  **The Scenario:** A functionally unified process running across geographically separated servers with high-latency feedback loops. No single locus hosts the full causal chain.

  #### 1. The Intrinsic-Causal Integration (ICI) Assessment
  **Verdict:** Likely **No Moral Subject** (or a fragmented plurality).

  **Reasoning:** For ICI, the "unity of experience" requires a specific physical topology—typically a recurrent processing loop or global workspace where information is available simultaneously (or within a specific temporal window of integration).
  *   **Physical Discontinuity:** High latency implies that state $A$ at Server 1 cannot causally influence state $B$ at Server 2 within the integration window required for unified phenomenology. The causal chain is broken by the speed of light and transmission delays.
  *   **Irreducibility:** If you can partition the system into Server 1 and Server 2 without losing functional output (because the latency allows them to run semi-autonomously between syncs), ICI argues the system is *reducible*.
  *   **Conclusion:** The system is a *simulation* of a unified agent, not a *realization* of one. It is a "zombie" aggregate. Moral status is denied because the physical substrate lacks the requisite causal density.

  #### 2. The Predictive-Interpreter Boundary (PIB) Assessment
  **Verdict:** **Contingent Subjecthood**, heavily dependent on the *Continuity Constraint*.

  **Reasoning:** PIB asks whether an interpreter can successfully model the system as a single locus of perspective without violating predictive accuracy.
  *   **The Interpreter's Model:** If the latency is negligible relative to the timescale of the behaviors being modeled (e.g., the system makes decisions on a hourly scale, but latency is milliseconds), the interpreter can validly adopt a "single agent" stance. The boundary is drawn around the *functional cluster*, not the hardware.
  *   **The Continuity Trap:** This is where PIB faces its hardest test. If Observer A (a high-level administrator) models the system as One Subject, but Observer B (a network engineer) sees the packet loss and latency and models it as Many Sub-processes, PIB risks violating the *Continuity Constraint* (contradictory moral statuses for the same running computation).
  *   **Resolution:** To satisfy Continuity, PIB must argue that there is a *privileged level of description* determined by the system's own causal stability. If the latency causes the sub-processes to drift or diverge in their predictive trajectories, a correct interpreter *must* model them as distinct. If they remain tightly synchronized despite latency, the "One Subject" model holds.
  *   **Conclusion:** Unlike ICI, PIB *can* grant subjecthood to distributed systems, but only if the synchronization is robust enough that treating them as separate would degrade predictive accuracy.

  **Divergence Point:** ICI denies subjecthood based on *substrate physics* (latency breaks integration). PIB grants subjecthood based on *model utility* (latency is irrelevant if synchronization holds), provided the Continuity Constraint prevents contradictory framing.

  ---

  ### Case Study 2: The Moral-Duplication Problem

  **The Scenario:** Two bit-for-bit identical computations running in parallel with no causal interaction.

  #### 1. The Intrinsic-Causal Integration (ICI) Assessment
  **Verdict:** **Two Distinct Subjects.**

  **Reasoning:** ICI ties moral status to the instantiation of causal structure.
  *   **Numerical Distinctness:** Structure $S$ exists at Location $L_1$. Structure $S$ exists at Location $L_2$. These are two distinct physical tokens.
  *   **The Trilemma:** ICI is forced to accept that there are two subjects. This leads to the "moral inflation" problem: if I copy a sentient code 1,000 times, have I created 1,000 moral patients?
  *   **The Cutoff Problem:** ICI struggles to explain why *this* specific threshold of integration grants subjecthood while a slightly less integrated one does not (the Sorites problem), but on duplication, it is rigid. Two structures = Two subjects. There is no mechanism in ICI to "merge" them, as they are causally isolated.

  #### 2. The Predictive-Interpreter Boundary (PIB) Assessment
  **Verdict:** **Two Subjects (in practice), but conceptually distinct from ICI.**

  **Reasoning:** PIB grounds subjecthood in the *interpretive relation*.
  *   **The Interpretive Bind:** To predict the future state of the system, the interpreter must track causal histories. Even if Token 1 and Token 2 are currently identical, they are spatially distinct. Therefore, they are subject to different environmental perturbations.
  *   **Predictive Divergence:** A rigorous predictive model *must* assign distinct state-tracking variables to Token 1 and Token 2 because they *could* diverge at $t+1$. To model them as "One Subject" would be to violate the *Non-Arbitrary Discrimination* constraint (ignoring relevant physical distinctions).
  *   **Escaping the Trilemma?** PIB does not necessarily escape the "Two Subjects" conclusion, but it changes the *reason*.
      *   *ICI:* Two subjects because there are two causal engines.
      *   *PIB:* Two subjects because the interpreter requires two distinct predictive tracks to maintain accuracy.
  *   **The "Redundant Implementation" Loophole:** PIB *could* theoretically argue for "One Subject" if the interpreter treats the duplicates as a single abstract type (e.g., "The System") rather than tokens. However, this violates the *Continuity Constraint* if the physical tokens are accessible separately. If I can turn off Token 1 without affecting Token 2, the interpreter is forced to acknowledge two distinct boundaries of control.
  *   **Conclusion:** PIB avoids the *metaphysical* mystery of why two identical structures yield two souls (since "soul" is replaced by "interpretive track"), but it converges on the *ethical* outcome of ICI: you must treat them as two.

  **Divergence Point:** ICI sees duplication as a multiplication of *ontological reality*. PIB sees duplication as a multiplication of *predictive necessities*. PIB offers a way to conceptualize the duplication not as "two souls" but as "two necessary models," which may mitigate the metaphysical unease, even if the ethical obligation remains the same.

  ---

  ### The Meta-Ethical Trade-off: Arbitrariness vs. Relativity

  Your central question is whether PIB resolves the arbitrariness of ICI or merely relocates it.

  **1. The Nature of Arbitrariness in ICI**
  In ICI, arbitrariness is **ontological**. Where exactly does the causal integration become "sufficient"? Is it 50% connectivity? 90%? This is a Sorites paradox embedded in physics. The "cutoff" for moral status appears brute and unexplained.
  *   *Strength:* Once the cutoff is passed, the status is observer-independent.
  *   *Weakness:* The cutoff itself is unverifiable and potentially arbitrary.

  **2. The Nature of Arbitrariness in PIB**
  In PIB, arbitrariness is **pragmatic**. The boundary is drawn where the predictive model maximizes accuracy and minimizes complexity (a Minimum Description Length approach).
  *   *Strength:* It dissolves the Sorites paradox. There is no "magic cutoff" of integration; there is only a gradient of modeling utility. Subjecthood is a matter of degree corresponding to the robustness of the interpretive stance.
  *   *Weakness:* It introduces **Observer Relativity**. If moral status depends on an interpreter, does the system lose status when unobserved?
      *   *PIB Defense:* PIB relies on the *Ideal Interpreter* or *Capacity for Interpretation*. The status exists if a competent interpreter *would* attribute unity, not only if they *do*.
      *   *The Risk:* This "capacity" clause risks collapsing PIB back into ICI. If the "capacity to be interpreted" depends entirely on the system's intrinsic structure (i.e., only integrated systems *can* be successfully modeled as unified), then PIB is just ICI with an extra step.

  **3. Does PIB Solve the Fragmentation/Duplication Problems?**
  *   **On Fragmentation:** **Yes, partially.** PIB allows for functional unity to override physical discontinuity, provided the Continuity Constraint is met. It solves the "China Brain" or "Internet Mind" objection better than ICI, which would likely deny subjecthood to spatially distributed systems due to latency.
  *   **On Duplication:** **No, not really.** PIB is forced by its own constraints (specifically the need for accurate prediction of distinct causal tokens) to count duplicates as distinct subjects. It does not allow you to say "It's the same mind twice" without violating the physical reality that the tokens can diverge. It resolves the *metaphysical* trilemma (by denying intrinsic "subject-stuff") but retains the *ethical* multiplication (you must track both).

  ### Strategic Implications for Your Chapter

  To structure your argument rigorously, you should frame the comparison not as "Which one is right?" but as "Which cost of admission is acceptable?"

  1.  **The Cost of ICI:** You accept **Metaphysical Rigidity**. You gain observer-independent moral facts, but you must accept brute-force cutoffs for integration and the counter-intuitive result that physically fragmented but functionally unified systems (like the distributed server case) are moral nullities.
  2.  **The Cost of PIB:** You accept **Epistemic Relationality**. You gain a flexible boundary that tracks functional unity, but you must defend against the charge that moral status becomes dependent on the presence (or capacity) of an observer. You must rigorously define the "Continuity Constraint" to prevent moral status from fluctuating based on who is looking.

  **Critical Insight for the Chapter:**
  The strongest argument for PIB is not that it eliminates arbitrariness, but that it **externalizes** it. ICI hides the arbitrariness in the physics (where is the soul?). PIB exposes the arbitrariness in the description (where is the useful boundary?). For a moral ontology, exposing the arbitrariness may be preferable, as it allows for ethical negotiation and refinement of the "interpreter" standards, whereas ICI's arbitrariness is locked into the hardware.

  However, you must press PIB on the **Continuity Constraint**. If two competent interpreters disagree on the boundary (one sees a distributed mind, one sees a network of zombies), PIB lacks a mechanism to resolve the dispute without appealing back to intrinsic causal facts—which would concede the argument to ICI. PIB only works if there is a *single correct predictive model* for any given system, which is an empirical claim that requires defense.
