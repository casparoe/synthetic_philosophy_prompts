          *   Does it rely on a "God-of-the-gaps" fallacy?
          *   Is it internally consistent (outlier vs. law)?
          *   Does it require a specific metaphysics of causation, or is it underdetermined (compatible with Bayesianism, anti-Humean testimony)?
          *   How would the procedure change under a straightforwardly probabilistic epistemology?

  2.  **Initial Fact-Checking & Nuance:**

