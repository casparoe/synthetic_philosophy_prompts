answer: |-
  The argument fails at step (4). This step looks sound because it correctly identifies an epistemic limitation: intent is a mental state and cannot be directly observed, so tribunals must infer it from conduct. However, it illicitly slides from this modest epistemic claim into a strong ontological one: that because intent is inferred from conduct, the *content* of intent is exhausted by the conduct. This is a category error. The fact that we infer burglary intent from trespassory conduct does not mean burglary *is* trespass; it means the conduct is the evidence for the mental state, not the mental state itself.

  The distinction you need to draw at (4) is between *inferring* intent from a pattern and claiming the pattern *constitutes* the intent. Step (4) asserts there is "no behavioural residue" distinguishing aiming at destruction from foreseeing it. This is false. The residue lies in the explanatory relationship between the act and the outcome. If an actor takes steps to avoid destruction while pursuing assimilation, destruction is a side effect, not an aim. If an actor selects methods where destruction is the necessary means to the end, it is an aim. The "only reasonable inference" standard used by tribunals escapes the argument precisely because it allows competing explanations (assimilation vs. destruction) to be weighed against the totality of evidence, including cabinet records. Step (5) ignores this by treating the records as irrelevant once the pattern is set, but under the correct standard, the records are vital evidence *against* genocidal intent if they align with the conduct.

  Regarding the reform proposal: replacing purpose with knowledge (virtual certainty) does not help; it makes steps (5) and (6) explicit. It validates the colleague's collapse by equating foresight with intent, thereby satisfying desideratum (b) (easier liability) at the unacceptable cost of desideratum (a) (moral distinction). It turns genocide into a crime of outcome rather than purpose, merging it with crimes against humanity.

  You might consider rejecting step (1) to deny genocide's distinctiveness, but this sacrifices the core moral intuition driving the Convention. You might reject step (7) to argue the stigma is useful regardless of distinctiveness, but this leaves the legal category vulnerable to the charge of being arbitrary. You might reject step (3) to demand direct evidence of intent, but this is empirically impossible and violates desideratum (b) by granting immunity to deniable campaigns. Rejecting (4) is the only path that preserves both the moral distinction and the possibility of conviction without confession.

  Under the corrected argument, the Vardena program is not genocide. While the outcome is the dissolution of the group, the specific aim was assimilation and counter-insurgency, evidenced by the rejection of killing and the offer of housing/registration. The destruction was a foreseen side effect, not the primary purpose. This fits crimes against humanity (persecution/deportation) but lacks the special intent to destroy the group as such.

