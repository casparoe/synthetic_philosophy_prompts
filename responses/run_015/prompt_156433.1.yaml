      *   **The Flaw:** This is a category error regarding *inference*. Just because intent is inferred from conduct doesn't mean the *content* of the intent is identical to the conduct. In criminal law (and ordinary reasoning), we distinguish between *purpose* (aim) and *knowledge/foresight* (side effect) based on the *relationship* between the conduct and the outcome in the actor's plan.
