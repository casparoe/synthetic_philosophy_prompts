  *(Refining the H&M reconstruction)*: They relied heavily on the "Default Hypothesis" (Jensen). If $h^2$ is non-zero within groups, and groups differ, assume the difference is partly genetic until proven otherwise. This is the "strongest version" – it's a Bayesian prior argument, not just a raw data argument.

  *(Refining the Critic's Objection)*: The core is the "Lewontin's Fallacy" (though Lewontin didn't call it that, it's attributed to his 1970 analysis). The key is that $V_G$ within groups tells you nothing about $\Delta G$ between groups if the environmental means differ.

