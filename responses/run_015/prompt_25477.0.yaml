answer: |-
  It is genuinely refreshing to read someone grappling with the unity of the proposition who has already seen through the surface-level ontological disputes to the methodological engine driving them. Your hunch is not only on the right track, I would argue it is essentially correct, though perhaps with a slight nuance regarding what counts as a factual disagreement in this context. You have identified the core friction point accurately: the stalemate over Bradley's Regress is less about discovering a hidden mechanism in the world that binds particulars to universals and more about a clash of explanatory temperaments regarding where the burden of intelligibility lies. One camp, often inheriting the Russellian or Armstrongian mantle, feels that a fact must be decomposable to be understood, yet they also recognize that the decomposition leads to a regress, so they posit a non-relational tie or a state of affairs as a stopping point. The other camp, often more Hegelian or perhaps influenced by later Wittgenstein, suspects that the demand for a constituent-based explanation of unity is itself a category mistake, treating propositions like aggregates rather than functional unities. When you see philosophers talking past each other here, it is usually because one side views a primitive unifier as a virtuous theoretical simplification while the other views it as an occult mystery that halts inquiry prematurely.

  If we look closely at the history you cited, from Bradley to Armstrong and Vallicella, the arguments rarely change in structure because the logical space is actually quite constrained. You either accept the regress as vicious and posit a brute unity, or you accept the regress as benign, or you deny the constituents exist in the way that generates the problem. The reason no one has solved it in the sense of providing a knockdown argument is that the problem functions as a limit case for metaphysical explanation itself. It tests the boundary between what can be analyzed and what must be accepted as given. So, when you ask if there is a genuine factual disagreement buried in here, the answer is that the factual disagreement is secondary to the modal and explanatory one. The parties agree on the logic of the regress; they disagree on whether reality is the kind of thing that ought to be regress-free. For the realist about states of affairs, the unity of the proposition mirrors the unity of the fact, and if the fact is primitive, so be it. For the nominalist or the deflationist, the unity is a feature of our representational systems, not the world, and thus the metaphysical regress is dissolved by shifting the locus to semantics or psychology. The impasse persists because neither side can prove their explanatory standard is the correct one without begging the question against the other.

  Given this diagnosis, what counts as progress looks quite different from what we might expect in the sciences or even in other areas of philosophy. We should not expect a formal result that mathematically demonstrates how a particular binds to a universal without a tie, because the problem isn't formalizable in a way that bypasses the ontological commitments. Instead, progress here looks like increased clarity about the theoretical costs of each option. We have made progress insofar as we now understand exactly what we are buying when we accept a primitive instantiation relation versus when we accept holistic facts. The work of people like Gaskin or the early Fine helps here not by solving the problem but by mapping the terrain of coherence for each view. Progress is also found in reframing the question to ask why we feel the need for unity in the first place. If we can show that the demand for a binder arises from a misleading picture of language—perhaps the tendency to treat verbs as names of relations—then we have made progress by dissolving the problem rather than solving it. This is a Wittgensteinian route, suggesting that the philosophical anxiety about unity is a symptom of being bewitched by grammar.

  Ultimately, I think you should adjust your expectation away from persuasion and toward articulation. It is unlikely that anyone is going to be persuaded to switch camps on this issue because the choice is foundational to their entire metaphysical system. If you believe that all explanation must bottom out in simples, you will accept a primitive tie. If you believe that explanation must avoid brute connections, you might lean towards holism or idealism. The value of continuing this debate is not that someone will finally crack the code of instantiation, but that the pressure of the regress forces metaphysicians to be explicit about their commitments regarding structure, dependence, and fundamentality. So, do not feel crazy for sensing that the arguments are circular; they are, because they are grappling with the conditions of argumentation itself. The best you can do is to choose the set of mysteries that you find most palatable and see where else that choice leads you in your system. In that sense, the problem is not a dead end but a compass needle pointing toward your own philosophical priorities, and recognizing that is perhaps the only genuine resolution available to us.
