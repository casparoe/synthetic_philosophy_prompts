answer: |-
  **Mara:** Let's begin with the plain fact of moral diversity. From ancient Sparta to modern Scandinavia, societies construct vastly different moral universes. The universalist claims these are merely imperfect attempts to grasp a single objective truth. I argue the best explanation for persistent, deep disagreement is that there is no single truth to grasp. Moral facts are constituted by cultural frameworks, not discovered like geological strata.

  **Kal:** But disagreement alone doesn't entail relativism. Physicists disagreed fiercely about quantum mechanics for decades. Did that mean reality was relative to their theories? No. It meant the truth was difficult to access. Persistent disagreement in history or science doesn't force us to say there are no objective historical or scientific facts. Why should morality be different?

  **Mara:** Because in science, we eventually converge on methods that adjudicate disputes independently of culture. A microscope works in Tokyo and Toronto. In morality, our "instruments" are intuitions and reason, both of which are culturally calibrated. Here lies my epistemological challenge: If moral truths are mind-independent, how do we access them? All our reasoning begins within a specific cultural narrative. You claim to see universal truths, Kal, but I suspect you're mistaking the parochial norms of liberal modernity for eternal laws.

  **Kal:** I grant that culture influences our *perception* of morality, but not the *existence* of moral truths. Consider moral progress. We look at the abolition of slavery and say society became *better*, not just *different*. If morality is framework-relative, the abolitionists didn't discover a truth; they merely swapped one preference for another. But that empties the word "progress" of meaning. To condemn slavery universally, you need a standard that stands outside the slave-holding culture's norms.

  **Mara:** I can account for progress without universalism. Progress is the expansion of a framework's own commitments to include previously excluded groups. When we abolished slavery, we didn't appeal to a Platonic form of Justice; we realized that our own professed values of liberty were inconsistent with chattel slavery. Progress is internal coherence and the reduction of suffering, which is a value most frameworks share, even if they define "suffering" differently.

  **Kal:** But that reduction only works if reducing suffering is itself a universal good. If a culture values honor over suffering, your critique loses its bite. Can you consistently condemn honor killings or foot-binding? If those practices are valid within their specific cultural framework, on what grounds do you intervene? If you say "because it harms the victim," you are implicitly appealing to a universal standard of bodily autonomy and well-being that transcends their framework.

  **Mara:** I criticize those practices not by appealing to a view from nowhere, but by appealing to overlapping consensus and the possibility of internal critique. Often, the victims within those cultures appeal to values their oppressors claim to hold. Furthermore, I don't need universal condemnation to act. I can say, "Within my framework, which prioritizes autonomy, this is abhorrent, and I will work to shift norms." I don't need to claim my framework is God's view to defend human rights. I just need to own my commitment.

  **Kal:** But owning the commitment isn't enough when rights are violated. You need the claim to be *true* for them, not just for you. This brings us back to the epistemology. You argue we can't access mind-independent truths because we are culturally embedded. I argue that being embedded doesn't preclude reaching outward. We use reason to strip away cultural bias, just as we do in science. The fact that it's hard doesn't mean the target isn't there.

  **Mara:** And I argue that what you call "stripping away bias" is often just adopting a different, more dominant bias.

  **Kal:** Then we reach the stalemate. For me, the deepest point is the phenomenology of moral experience. When I say "slavery is wrong," I experience myself as reporting a truth, not expressing a preference. To deny that is to deny the very force of moral conscience.

  **Mara:** And for me, the deepest point is intellectual honesty. To claim universal authority for values that arose in specific historical contexts is dangerous. We disagree on whether morality is a discovery or a creation. Until we resolve whether moral truths are waiting to be found or built by us, we cannot agree on the source of our progress.

  **Kal:** Then let the symposium wrestle with that. Is conscience a compass or a construction?

  **Mara:** Precisely. And whether admitting it's a construction weakens our resolve, or strengthens our responsibility to build wisely.
