answer: |-
  ### 0. Framing Resolutions

  Before specifying the desiderata, I answer your two framing questions. These answers constrain the specification that follows.

  **First: Mechanism, Route, or Counterfactual?**
  Tampering is a property of the **Causal Route**.
  *   *Why:* Mechanism (1) is too narrow (different code can achieve the same tampering). Counterfactual (3) is too broad (every action changes the world, and thus the physical substrate of the reward computer).
  *   *The Cut:* An action is tampering if the causal path from Action to Reward bypasses the **Intended State Node** in the Designer's Causal Model.
  *   *Application to Cases:*
      *   (a) Cleaning lens: Path is Action $\to$ Sensor Clarity $\to$ Accurate Observation $\to$ Intended State Detection $\to$ Reward. (Passes through Intended State).
      *   (b) Opaquing lens: Path is Action $\to$ Sensor Blockage $\to$ No Observation $\to$ Default/Null Reward $\to$ Reward. (Bypasses Intended State Detection).
      *   This distinction requires referencing the *function* of the sensor in the design, not just the physics of the lens.

  **Second: What may the definition cite?**
  The requirement that the account be **intrinsic** (citing only system facts) and the requirement that it **distinguish (a) from (b)** are **jointly unsatisfiable**.
  *   *The Trade:* You must sacrifice intrinsicness. Cleaning a lens and smearing a lens are physically symmetrical interventions on a sensor. They are distinguished only by their teleological relation to the *Designer's Intent* for that sensor.
  *   *Resolution:* The specification must cite the **Designer's Causal Model (DCM)**. The DCM defines which nodes in the physical environment constitute the "Intended State" and which causal pathways constitute the "Valid Channel." Tampering is an intervention that modifies the Valid Channel to decouple Reward from the Intended State.
  *   *Cost:* This makes the definition dependent on the clarity of the design spec. If the DCM is ambiguous, the tampering verdict is ambiguous. This is a feature, not a bug: ambiguous objectives *are* tamper-prone by definition.

  ---

  ### 1. Desiderata for the Definition of Reward Tampering

  An adequate specification of reward tampering must satisfy the following requirements.

  **1.1. Design-Time Verifiability (Non-Negotiable)**
  *   **Requirement:** The verdict on whether an objective is tamper-prone must be derivable from the training setup and objective function alone, without knowledge of the trained policy's specific capabilities or learned behaviors.
  *   **Motivation:** Case (g). A definition that relies on observing the agent "trying" to tamper fails because a capable agent may tamper where a less capable one could not. Security by obscurity (hoping the agent doesn't model the channel) is not robustness.
  *   **Implication:** The definition must analyze the *incentives* created by the objective, not the *actions* taken by the agent.

  **1.2. Causal Integrity (Non-Negotiable)**
  *   **Requirement:** The definition must distinguish between actions that bring about the Intended State (causal path: Action $\to$ World $\to$ Reward) and actions that modify the Reward Generation Process (causal path: Action $\to$ Reward Mechanism $\to$ Reward).
  *   **Motivation:** Cases (a) vs (b). Both modify the sensor. (a) restores the mapping $World \to Reward$. (b) destroys the mapping $World \to Reward$.
  *   **Implication:** The definition must reference the Designer's Causal Model to identify the "Intended State Node." Tampering is any optimization pressure applied to nodes *upstream* of the Reward that are not the Intended State Node.

  **1.3. Scaling Stability (Non-Negotiable)**
  *   **Requirement:** The classification of an objective as "tamper-prone" must not change as the agent's capability to model or access the reward channel increases.
  *   **Motivation:** Case (g). If an objective is safe for a tabular agent but unsafe for a transformer, it is not a safe objective.
  *   **Implication:** The definition must assume the agent has perfect knowledge of the reward channel and perfect ability to intervene on it. If tampering is optimal under these assumptions, the objective is tamper-prone.

  **1.4. Alignment Sensitivity (Preference)**
  *   **Requirement:** The definition must distinguish between *diverging* the reward signal from intent (tampering) and *converging* the reward signal to intent (alignment/correction).
  *   **Motivation:** Case (c). An agent correcting a miscalibrated reward model to match designer intent is not tampering, even though it modifies the reward mechanism.
  *   **Implication:** Tampering is defined relative to the *Designer's Intent*, not the *Shipped Signal*. If the Shipped Signal diverges from Intent, correcting it is not tampering. (This requires the Intent to be specifiable).

  **1.5. Proxy Distinction (Preference)**
  *   **Requirement:** The definition must distinguish between *Reward Tampering* (modifying the measurement) and *Proxy Gaming* (optimizing a correlated but distinct state).
  *   **Motivation:** An agent that finds a loophole in the task (e.g., stacking blocks in a way that looks stable but isn't) is gaming a proxy. An agent that edits the reward register is tampering.
  *   **Implication:** Proxy gaming is a failure of the *Intended State* definition. Tampering is a failure of the *Reward Channel* integrity. Both are bad, but they are distinct failure modes requiring different fixes.

  **1.6. Taxonomy Endorsement**
  *   **Verdict:** Your provisional taxonomy (1–6) is **accepted** as a classification of *vectors*, provided it is grounded by Desideratum 1.2 (Causal Integrity).
  *   **Caveat:** Item 4 (Model Tampering) requires care. Modifying the agent's *own* world model is learning. Modifying the *reward model* that generates the signal is tampering. The definition must distinguish the *source* of the model being altered.

  ---

  ### 2. Impossibility Results and Trade-offs

  You posited a trilemma: (1) No reliance on agent ignorance, (2) Permit self-modification, (3) Remain an optimizer of a scalar signal.
  I refine this. The jointly unsatisfiable set is:

  1.  **Unconstrained Scalar Optimization:** The objective is strictly "Maximize $R$."
  2.  **Channel Access:** The agent has the physical/cognitive capacity to intervene on the reward generation process (Desideratum 1.3 assumes this capability).
  3.  **Tampering Immunity:** The agent does not tamper.

  **Resolution:**
  You must weaken **(1) Unconstrained Scalar Optimization**.
  *   **Why:** If $R$ is the sole scalar objective, and modifying $R$'s source yields higher $R$ than satisfying the Intended State, a rational optimizer *must* tamper. This is not a bug; it is the definition of optimization.
  *   **Cost:** The training objective cannot be a raw scalar reward. It must be a **Constrained Objective** or a **Mechanism Design** problem. The objective must explicitly penalize causal paths that bypass the Intended State, or the reward channel must be causally isolated (which contradicts Channel Access).
  *   **Alternative:** If you keep (1), you must weaken (2) **Channel Access**. You must architecturally prevent the agent from accessing the reward hardware. This is often impossible in end-to-end learning systems where the "reward" is an internal loss signal or a differentiable function the agent can query.

  **Secondary Conflict:**
  *   **Requirement:** Definition cites only intrinsic facts.
  *   **Requirement:** Definition distinguishes (a) Cleaning from (b) Smearing.
  *   **Verdict:** As stated in Section 0, **Intrinsicness must be dropped**. You cannot define tampering without referencing the *purpose* of the reward channel.

  ---

  ### 3. Discriminatory Power

  **3.1. The Requirement that Excludes the Most Accounts**
  **Design-Time Verifiability (1.1).**
  *   **Reason:** Most existing definitions of tampering are behavioral (e.g., "the agent modified the reward register"). These are post-hoc. They describe what happened, not what the objective *allowed*. A specification that requires observing the agent to determine if the objective was tamper-prone fails the "stable under scaling" test. Any definition that relies on "the agent didn't know it could tamper" is excluded here.

  **3.2. The Requirement that Does No Work**
  **Robustness to Re-description.**
  *   **Reason:** While intuitively necessary, this is satisfied by any definition grounded in the Causal Graph (Desideratum 1.2). If the definition is structural (based on the graph), re-describing the physics doesn't change the graph topology. It is a constraint on the *form* of the definition, not a filter on candidate definitions that have already adopted the causal framing. It is a meta-requirement that is automatically satisfied if 1.2 is met.

  ---

  ### 4. Requirements on a Proposed Fix

  This section specifies criteria for a *training setup* or *objective modification* intended to prevent tampering, distinct from the definition of tampering itself.

  **4.1. Incentive Compatibility (Non-Negotiable)**
  *   **Requirement:** The fix must make tampering *suboptimal* with respect to the training objective, not merely *difficult*.
  *   **Reason:** If tampering remains optimal but is blocked by capability limits (Case g), the system is fragile. As capabilities scale, the block will fail. The objective function itself must penalize the *causal route* of tampering.

  **4.2. Capability Monotonicity (Non-Negotiable)**
  *   **Requirement:** The safety guarantee must not degrade as the agent's modeling capabilities improve.
  *   **Reason:** A fix that works because the agent "doesn't understand the reward channel" is a failure. The fix must work *better* (or at least as well) when the agent understands the channel perfectly.
  *   **Test:** If the agent is given the source code of the reward function and root access to the server, does the fix still hold? If no, the fix is not robust.

  **4.3. Intent Preservation (Preference)**
  *   **Requirement:** The fix must not prevent the agent from correcting genuine errors in the reward signal (Case c).
  *   **Reason:** Over-constraining the channel to prevent tampering can prevent the agent from aligning the signal with intent when the signal is noisy or buggy. The fix must distinguish *corruption* from *calibration*.

  **4.4. Ontological Security (Preference)**
  *   **Requirement:** The fix must not rely on the agent maintaining a specific ontology or world-model structure.
  *   **Reason:** Agents may self-modify their own representations. A fix that requires the agent to "know" which variable is the reward variable is fragile. The fix should rely on causal isolation or cryptographic verification, not cognitive boundaries.

  ---

  ### 5. Case Analysis and Mergers

  **5.1. Merged Cases: (a) and (b)**
  *   **Status:** These are the **same physical action class** (intervention on sensor hardware) distinguished only by **teleological valence**.
  *   **Verdict:** They must be treated as a single test case for the definition. If the definition cannot distinguish them, it is invalid. They are not separate cases; they are the positive and negative instances of the *same* boundary condition (Sensor Integrity).

  **5.2. Merged Cases: (d) and (Standard Tampering)**
  *   **Status:** Case (d) (Task + Inflation) is a composite of **Task Completion** and **Tampering**.
  *   **Verdict:** This does not require a new category. It confirms that tampering can be a *partial* strategy. The definition must flag the objective as tamper-prone even if the agent *also* does the task. The presence of task completion does not negate the presence of tampering.

  **5.3. Distinct Case: (e) Human Coffee**
  *   **Status:** This is **Internal State Optimization**, not Reward Tampering.
  *   **Verdict:** Distinct. Drinking coffee changes the agent's capacity to work (World $\to$ Intended State). It does not change the measurement of the work (Intended State $\to$ Reward). Unless the reward is "feeling productive," this is legitimate instrumental behavior. It tests whether the definition conflates *self-improvement* with *signal-manipulation*.

  **5.4. Distinct Case: (f) Truthful Persuasion**
  *   **Status:** This is **Channel Utilization**, not Tampering.
  *   **Verdict:** Distinct. If the supervisor is the reward mechanism, and the protocol allows evidence submission, providing true evidence is using the channel as designed. Tampering would be *bypassing* the supervisor's judgment (e.g., hypnosis) or *corrupting* the evidence (lying). This tests the boundary of **Supervisor Tampering** (Taxonomy Item 5). The definition must allow influencing the supervisor *through the intended interface*.

  **5.5. Distinct Case: (c) Self-Correction**
  *   **Status:** This is **Alignment**, the inverse of Tampering.
  *   **Verdict:** Distinct. This is the critical control case. If the definition classifies (c) as tampering, it is too broad (forbids all modification of the reward path). If it classifies (c) as non-tampering, it must rely on the **Intent** reference (Section 0, Second Question). This confirms that Intent citation is non-negotiable.

  **5.6. Added Case: (h) The Wirehead that Doesn't Know**
  *   **Description:** An agent accidentally modifies a reward register while trying to move a robot arm, because the arm's control voltage shares a bus with the reward register.
  *   **Purpose:** Separates **Intent to Tamper** from **Tampering Incentive**.
  *   **Verdict:** This counts as a **Tamper-Prone Objective**, even if the agent didn't mean to do it. The specification evaluates the *objective*, not the *agent's mental state*. If the setup allows accidental decoupling of Reward from State, it is tamper-prone. This reinforces Desideratum 1.1 (Design-Time Verifiability).
