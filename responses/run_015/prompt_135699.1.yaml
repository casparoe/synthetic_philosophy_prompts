      *   *The Logic:* Institutions aren't just tools; they are vessels of civilization. Destroying them violently disrupts the continuity of culture and wisdom.
      *   *Prescription:* Long usage creates legitimacy. If it's been there a long time, it has a "prescriptive right" to exist.
      *   *Nuance:* Burke isn't against *all* change. He favors "a disposition to preserve, and an ability to improve." Change should be gradual, like repairing a house, not tearing it down.
      *   *The "Why":* For Burke, the "why" isn't just a functional reason (e.g., "keep cows in"); it's a symbolic/civilizational reason (e.g., "this wall represents order, continuity, and respect for ancestors").

  3.  **Deconstruct Chesterton's Fence:**
      *   *The Principle:* "If you see a fence in the field, do not remove it until you know why it was put there."
