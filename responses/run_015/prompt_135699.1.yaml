prompt: |-
  I'm taking a course on political philosophy and we got onto Burkean conservatism after I mentioned that my parents are trying to decide whether to tear down teh old stone wall on our property that no one remembers why it's there. Anyway, I was reading Burke's Reflections on the Revolution in France and there's this part where he argues that society isn't just a temporary deal among people alive right now, but more like a partnership that binds together the dead, the living, and people who haven't been born yet, so that ripping out an old institution just because it looks useless to us is like breaking a contract we never signed but are still part of. I'm trying to understand that passage in relation to Chesterton's fence — my roommate says Chesterton basically just copied Burke and applied him to small stuff, but I think there's a real tension. Burke seems to say the wall matters because it carries an inherited obligation across generations, almost like a prescriptive right, while Chesterton's fence is about epistemic humility: don't knock it down until you know why the builder put it there, which seems to allow that the builder might have been wrong or weird. So is Burke actually saying we must keep the wall up because of this intergenerational contract even if we think the original reason was bad? Or is he closer to Chesterton than my roommate thinks? Could you help me understand the passage and whether there's a meaningful difference between Burke's idea of accumulated wisdom and Chesterton's unknown-reason argument, especially in a case where the fence-builder's intent might have been mistaken?
reasoning: |-
