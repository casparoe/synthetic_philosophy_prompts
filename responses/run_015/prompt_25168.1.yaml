      Dual Inheritance Theory offers a robust framework, treating genes and culture as interacting evolutionary systems without reducing culture to mere memes. Alternatively, an epidemiological model (ideas as viruses) better captures horizontal transmission, though it still struggles with intentionality. Ultimately, culture evolves Darwinianly only in a weak sense; it is a distinct evolutionary process requiring bespoke models that integrate cognitive biases and social learning strategies rather than strict biological analogs.

