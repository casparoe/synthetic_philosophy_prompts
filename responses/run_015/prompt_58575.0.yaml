answer: |-
  The established name for this dynamic is a **Positional Arms Race**, often metaphorically described as the **Red Queen Effect**.

  This pattern occurs when individuals invest resources solely to maintain their relative status rather than to achieve an absolute gain, meaning that when everyone escalates their effort or spending, the relative rankings remain unchanged while the absolute costs for everyone rise. In your examples, the food trucks and baseball families are not competing to create new value (like expanding the total market or improving overall skill levels) but are instead engaging in defensive spending to avoid losing ground, which results in a net loss of welfare for the group.

  This differs from standard competition because healthy competition is often positive-sum, where rivals push each other to innovate or lower prices, ultimately benefiting consumers or expanding the market; in a positional arms race, the competition is zero-sum or negative-sum because the "prize" is fixed (e.g., there are only so many starting spots on a team or so many late-night customers), so the extra effort merely cancels itself out. It differs from the Tragedy of the Commons because that scenario involves multiple actors depleting a finite shared resource (like fish in a lake), whereas this scenario involves actors inflating the cost of participation without necessarily destroying a physical resource, leaving the "pool" intact but making access prohibitively expensive.

  Underlying this dynamic is a multi-player **Prisoner's Dilemma**, where the rational choice for each individual is to escalate (stay open later, buy lessons) to avoid being the sucker who falls behind, leading the group to a **Nash Equilibrium** that is Pareto-inferior, meaning everyone ends up worse off than if they had collectively agreed to restrain themselves.
