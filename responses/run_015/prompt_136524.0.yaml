      *   *The Inconsistency:* Verdict 2 and 3 admit "dispositional existence." Verdict 5 denies existence entirely.
      *   *The Fix:* Verdict 5 should be aligned with 2 and 3. The virtual world exists *as code/disposition*, just not as *visual experience*.
      *   *Why did the user distinguish them?* Maybe because Blockchain is "truth" and Virtual World is "illusion"? But for Berkeley, *all* physical objects are ideas.
