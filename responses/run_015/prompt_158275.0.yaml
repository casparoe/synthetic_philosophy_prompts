answer: |-
  Good morning. Welcome to everyone.

  Looking around this room, I see a gathering that is, in itself, a testament to the career we are here to honor. On one side, I see colleagues steeped in the literature of medicine and philosophy, people who have spent decades debating the definitions of function and dysfunction. On the other, I see family, former patients, and nursing staff—the people who actually live inside the medical system, day in and day out.

  This division in the room is not an accident. It is the exact tension that Dr. Miriam Kowalski has navigated for forty years. Miriam has always insisted that you cannot understand medicine if you only talk to the philosophers, but you also cannot practice it well if you ignore the philosophy. She has built a bridge between the laboratory and the living room. And today, as she steps into retirement, we are here to acknowledge the weight of that structure.

  For those of you who are not philosophers of medicine, I want to begin with the problem Miriam tried to solve. It is a problem you have likely felt in a doctor's office.

  When a patient goes to a physician with a complaint, there are two common ways the doctor might think about what is wrong. The first way says: "Health is just biology." On this view, you are sick if your organs are statistically abnormal, if your blood work is outside the reference range, if the machinery is broken. It doesn't matter what you want to do with your life; if the engine is misfiring, you are diseased.

  The second way says: "Health is just a social label." On this view, disease is nothing more than a judgment we make because we don't like a certain condition. If society decides that a certain behavior or body type is undesirable, we call it a disease. Biology is secondary; the label is a tool of social control.

  Miriam spent her career arguing that both of these answers are incomplete. If health is only biology, we treat numbers rather than people. If health is only social valuation, medicine becomes arbitrary, based on whatever the culture of the day happens to dislike.

  To prove this, Miriam constantly returned to a single, powerful comparison. I want to share it with you, because it is the key to her life's work.

  Imagine a professional cyclist. She has a congenital cardiac rhythm that is statistically rare. In the world of competitive cycling, this rhythm is technically disqualifying. Yet, for this specific woman, the rhythm allows her to train safely. It supports the endurance life she has built. She wins races. She thrives.

  Now, imagine an office worker. He has the *identical* cardiac rhythm. The biology is the same. The statistical rarity is the same. But for him, this rhythm causes debilitating fatigue. It prevents him from working his sedentary job. It stops him from playing with his children. He is impaired.

  The "biology only" doctor looks at these two and must say they are both healthy or both sick, because their bodies are identical. The "social label" theorist looks at them and says their health status depends on whether society values cyclists or office workers more.

  Miriam said they are both wrong. She argued that the cyclist is healthy, and the office worker is diseased. And she insisted that this is not a matter of opinion. It is an objective fact. Why? Because health is not about the biology alone, and it is not about society alone. It is about the relationship between the biology and the *life-plan* of the person inhabiting the body.

  She called this "biographical functionalism." A condition is pathological only when a biological variation conflicts with a person's practically situated life-plan. Not a universal standard. Not an arbitrary social ideal. But the specific, concrete structure of the life that person is actually trying to lead.

  For the family and patients in the room, this is why Miriam was such a profound physician. She never told a patient they were "fine" just because their labs were normal, if they couldn't live their lives. But she also never validated a complaint simply because a patient was unhappy; she looked for the factual conflict between their capacity and their goals. She treated the intersection of the body and the biography.

  Now, for my colleagues in philosophy and clinical theory, I need to be precise about where Miriam's biographical functionalism diverges from the dominant frameworks we have studied for decades. We know the landscape well. We know the Biostatistical Theory, which grounds health in species-typical functional organization. We know the Harmful Dysfunction analysis, which requires a failure of internal mechanism combined with a harm judged by a culture-independent standard of welfare.

  Miriam respected these frameworks, but she found them unable to account for the cyclist and the office worker.

  Her divergence from the statistical account is fundamental. She rejected the idea that a universal, species-typical baseline can determine pathology. In the standard view, if a heart rhythm falls outside the efficient range of the species design, it is a dysfunction, full stop. Miriam argued that the "species" is an abstraction that does not exist in the clinic. Only individuals exist. If a biological trait supports the individual's life-structure, calling it a dysfunction because it is statistically rare is a category error. She moved the baseline from the population to the person.

  Her divergence from the harmful dysfunction analysis is equally sharp. She agreed that harm is necessary for disease. But she rejected the requirement that this harm be measured against a culture-independent standard of welfare. The standard view asks: "Is this condition harmful to human welfare generally?" Miriam asked: "Is this condition harmful to *this* human's specific projects?"

  She argued that there is no "welfare generally." There is only welfare as it is instantiated in a specific biography. To demand a culture-independent standard is to pretend we can evaluate a life from nowhere. Miriam insisted we must evaluate it from somewhere—from within the context of the patient's own practical reasoning.

  This is where her claim to objectivity is most daring, and most difficult. She knew that talking about "life-plans" sounds subjective. It sounds like "whatever the patient feels like doing." But Miriam insisted that a life-plan is not a whim. It is a structured set of commitments, capacities, and actions that exist in the world. The fit between a heart rhythm and a career is a factual relationship, just like the fit between a key and a lock.

  If the key does not turn the lock, that is not a subjective preference. It is a mechanical fact. For Miriam, the body is the key, and the life-plan is the lock. Medicine's job is to assess the turn.

  This brings us to the honesty we must practice today. We cannot claim that Miriam's view is now the mainstream consensus. It is not. The insurance codes still run on statistical norms. The diagnostic manuals still rely on general welfare standards. Her biographical functionalism remains a challenging minority report in the philosophy of medicine. It demands more of the clinician than the standard models do. It requires us to know the patient, not just the pathology.

  But if her view is not the standard, it is surely the aspiration. It is the standard we hope to meet when we say we practice "patient-centered care." Miriam gave us the philosophical rigor to make that slogan mean something real. She showed us that centering the patient is not just being nice; it is a metaphysical necessity for defining health correctly.

  As Miriam closes this chapter of her career, she leaves us with a challenge that is far from resolved. If we accept her premise—that the identical biological fact can constitute health for one life-plan and disease for another—then the nature of our clinical duty shifts.

  We can no longer simply ask, "Is this abnormal?" We can no longer simply ask, "Is this generally harmful?" We have to ask something much harder.

  So, as we celebrate her retirement, I leave you with the question Miriam wants us to carry forward:

  When the biology is constant but the biography changes, what is our clinical responsibility? Do we fix the body to match the species, or do we help the body match the life? And who decides what that life is worth saving?

  Miriam Kowalski has spent forty years showing us that the answer lies in the space between the cell and the story. Thank you, Miriam, for showing us where to look.
