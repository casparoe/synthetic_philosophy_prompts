      *   **Thesis:** The reductionism/anti-reductionism debate about testimony is a category error. It equivocates between two dimensions: *Transmission* (reductionist right: warrant must be reconstructible/auditable) and *Accountability* (anti-reductionist right: entitlement doesn't wait on audit, speaker stakes standing).
      *   **Corollaries:** Dimensions can come apart (Credibility w/o Accountability; Accountability w/o Credibility). The real work is determining Accountability's contribution to *knowledge* vs. *interpersonal relations*.
      *   **Audience:**
          1.  3 Formal Epistemologists (Bayesian, accuracy-first, updating on assertion).
          2.  2 Social Epistemologists (testimonial injustice, credibility distribution).
