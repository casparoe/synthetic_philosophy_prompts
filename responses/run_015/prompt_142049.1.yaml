      *   *Correction needed:* Interventionism doesn't swap speculative modality for empiricism in the way the user thinks. It uses the *concept* of intervention to define causal structure, often relying on structural equation models (SEMs). It is still modal (about what *would* happen under an intervention), not just descriptive of actual experiments.

