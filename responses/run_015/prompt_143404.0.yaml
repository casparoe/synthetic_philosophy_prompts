      *   *The Twist:* In the classic auction, the prize is fixed ($1). In Vietnam, the "prize" (South Vietnam's viability) was depreciating as the bidding (war) intensified. Also, the opponent isn't just bidding; they are changing the cost structure for the U.S.
      *   *Institutional Aspect:* It's not one guy bidding. It's the Executive (LBJ) bidding with the Legislature's (Congress) money, against an adversary with different time horizons and cost tolerances.

