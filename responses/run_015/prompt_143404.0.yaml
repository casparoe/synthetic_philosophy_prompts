answer: |-
  The Vietnam War (1965–1968) is the canonical case study for the escalation of commitment, and Martin Shubik's Dollar Auction provides a razor-sharp lens for dissecting the logic of the trap. In Shubik's game, two players bid for a dollar. The highest bidder wins the dollar, but *both* the highest and second-highest bidders must pay their final bids. Rational actors quickly find themselves bidding $1.50 for a $1.00 prize, because withdrawing means paying the bid without winning, whereas bidding higher offers a slim chance of net recovery.

  Mapping the U.S. escalation onto this model reveals why the logic of the war felt inescapable to Johnson and Westmoreland. However, a rigorous application also exposes where the model fractures under the weight of institutional reality and asymmetric warfare.

  ### The Disciplined Mapping

  **1. The Bidders**
  *   **Bidder A (The U.S. Executive):** Specifically, the Johnson White House and MACV (Westmoreland). They are the active bidders making the wagers.
  *   **Bidder B (North Vietnam/Hanoi):** The opposing bidder. Their currency is not dollars but manpower, political will, and tolerance for destruction.
  *   **The Auctioneer:** History/Geopolitics. There is no neutral arbiter; the rules of settlement are determined by physical control and political collapse.

  **2. The Dollar (The Prize)**
  The prize is not South Vietnam itself, but **Global Containment Credibility**. For the U.S., losing South Vietnam was synonymous with a loss of credibility that would trigger dominoes elsewhere. For Hanoi, the prize was national unification and survival. Crucially, in a standard Dollar Auction, the prize is fixed at $1.00. In Vietnam, the prize was a **depreciating asset**. Every ton of bombs dropped (Rolling Thunder) and every village securitized degraded the economic and political viability of the South. The U.S. was bidding higher and higher for a dollar that was melting into 50 cents.

  **3. The Bids and the Sunk-Cost Trap**
  *   **The Bids:** Troop deployments (1965: 184,000 → 1968: 535,000) and bomb tonnage.
  *   **The Trap:** By 1967, the U.S. had paid a massive "bid" (casualties, budget, domestic unity). To withdraw would be to accept the status of the "second-highest bidder": you pay the cost (admitting defeat, wasting the lives already lost) without winning the prize (credibility).
  *   **Westmoreland's Requests:** When Westmoreland requested additional troops in 1967 and early 1968, he was effectively saying, "I am the high bidder at $0.80. If I stop now, I lose $0.80 for nothing. If I bid $0.90, I might win the dollar." The logic dictates that as long as the *marginal cost* of the next bid feels lower than the *sunk cost* of the previous bid, escalation is rational.

  **4. Congressional Appropriations as Third-Party Payments**
  This is where the institutional setting distorts the clean game. In Shubik's lab, the bidder pays from their own pocket. In Washington, the Executive bid with Congress's appropriations and the public's sons.
  *   **The Credit Line:** The Gulf of Tonkin Resolution acted as an open line of credit. It decoupled the *act of bidding* from the *pain of payment*.
  *   **Delayed Feedback:** Congress authorized funds, but the "payment" (casualties, inflation, social unrest) arrived with a lag. This allowed the U.S. bidder to stay in the auction longer than a rational actor with immediate skin in the game would have. It created a "soft budget constraint," insulating the bidder from the immediate reality of the escalating cost.

  ### Where the Auction Framing Breaks

  The Dollar Auction model explains the *internal* psychology of the U.S. leadership, but it fails to capture the *external* dynamics of the conflict. Vietnam reveals three critical limitations of applying clean game theory to institutional warfare.

  **1. The Opponent as Rule-Changer, Not Competing Bidder**
  In the Dollar Auction, Player B responds to Player A's bid by bidding higher. In Vietnam, when the U.S. escalated (Rolling Thunder, troop surges), Hanoi did not simply "bid higher" in a symmetrical fashion. They changed the cost structure of the auction itself.
  *   **Asymmetric Costs:** A U.S. "bid" (a battalion deployment) cost millions of dollars and domestic political capital. An NVA "bid" (infiltrating a battalion) cost a fraction of that and bolstered their domestic narrative.
  *   **The Tet Offensive (1968):** This was not a counter-bid; it was a rule change. By attacking urban centers, the NVA shifted the metric of "winning" from *territorial control* (where the U.S. was bidding high) to *political will* (where the U.S. was vulnerable).
  *   **Model Failure:** Shubik's model assumes a fixed rule set where the highest number wins. Vietnam showed that in war, the side that can redefine what "winning" means (or make the cost of bidding unbearable for the opponent) wins, regardless of the bid size. Treating the NVA as a competing bidder implies a symmetry that didn't exist. They were not trying to out-bid the U.S. in firepower; they were trying to bankrupt the U.S. political will.

  **2. Commitment Devices Backfiring**
  In game theory, a commitment device (burning the bridge behind you) signals resolve to force the opponent to fold. The U.S. treated troop deployments as commitment devices: "We are sending 100,000 men; we cannot leave now; therefore, Hanoi must negotiate."
  *   **The Reversal:** In the Dollar Auction, high commitment signals you are willing to go to $2.00. In Vietnam, high commitment signaled *desperation*. Hanoi interpreted the escalation not as a sign of inevitable U.S. victory, but as evidence that the U.S. was trapped in the sunk-cost fallacy. They reasoned that American democracy had a lower tolerance for pain than their authoritarian structure.
  *   **Institutional Limit:** Commitment devices work in clean games where actors are unitary and rational. In institutional settings, commitment devices signal internal fragility. The U.S. escalation told Hanoi: "The American political system is vulnerable to attrition." The commitment device invited further testing rather than capitulation.

  **3. Institutional Inertia vs. Rational Choice**
  Shubik's model assumes individual rationality. The Vietnam escalation was driven by *organizational* rationality, which behaves differently.
  *   **Fragmented Bidders:** The "U.S. Bidder" was not one person. It was a coalition of the State Department, Defense Department, CIA, and White House. Each had different utility functions. The military wanted to win (maximize bids); the diplomats wanted a settlement (minimize bids); the President wanted to not lose before the election (optimize timing).
  *   **The "Loser's Fee":** In the Dollar Auction, the loser pays their bid. In the U.S. bureaucracy, the "loser's fee" (blame for losing Vietnam) was a political liability that no individual official wanted to incur. It was safer to authorize another bid (troop request) and delay the loss than to sign the withdrawal order and take the blame immediately.
  *   **The Limit:** The model predicts escalation due to mathematical trap logic. Vietnam shows escalation occurs due to *bureaucratic self-preservation*. The auction didn't just trap the players; the players used the auction to protect their careers.

  ### Conclusion: What Vietnam Reveals About the Model

  The Dollar Auction model successfully diagnoses the **pathology of continuation**: it explains why the U.S. could not simply walk away in 1967. The fear of realizing the sunk costs (the "second-highest bidder" penalty) was more potent than the fear of future costs.

  However, Vietnam exposes the model's **blind spots regarding dynamic conflict**:
  1.  **Variable Value:** Real-world prizes depreciate under fire. The more you bid for a country via war, the less valuable that country becomes.
  2.  **Asymmetric Pain:** The model assumes costs are comparable. In Vietnam, the cost of bidding was existential for the South but merely political for the North, and economic for the U.S.
  3.  **The Third-Party Constraint:** Congressional appropriations acted as a delayed feedback loop. In a real auction, you feel the loss of cash immediately. In Vietnam, the bill came due years later, allowing the bidding to exceed rational limits far longer than the model predicts.

  Ultimately, Vietnam demonstrates that escalation of commitment in institutional settings is not just a cognitive error (the sunk-cost fallacy) but a **structural feature of bureaucracy**. The Dollar Auction explains why the logic held; Vietnam reveals why the logic was insulated from reality. The U.S. didn't just lose the auction; it discovered too late that it was bidding in a different game entirely—one where the highest bidder doesn't win the dollar, but rather, the side that can endure the pain of the bidding process longest forces the other to bankruptcy.
