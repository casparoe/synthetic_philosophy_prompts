prompt: |-
  I've been reading about moral particularism and generalism on my own — no classes, just books and a long-running argument with a friend — and the argument has stalled in a way I think only a well-built case can fix. So I'd like a case constructed to order.

  My friend's position: as he understands it, particularism says only that reasons can be outweighed or defeated, that you can't read an all-things-considered verdict off a single feature. Everyone already believes that, generalists included, he says. So particularism is either a truism or it collapses into the claim that morality can't be taught, argued about, or learned from cases — which he takes to be obviously false. I want a case that shows the interesting claim is stronger than defeat, and I want it built so that he can't wave it off as a stipulation.

  Specifications:

  1. Two ordinary situations, one paragraph each: a workplace, a family, a clinic, a neighborhood. No trolleys, no science fiction, no exotic roles or institutions. The two cases should share a thin non-moral description — same kind of agent, same kind of act — and differ by the addition of exactly one further non-moral fact. Call the shared feature F and the act X.
  2. In case A, F is a reason to do X, and doing X is what should be done. In case B — A plus the one extra fact — F is *still* a reason to do X; I don't want it to go silent, and I don't want a plain defeat where it simply gets outweighed by something independent of it. But in B, F is also part of what makes some other feature G into a reason *not* to do X. So F favours doing X and, in the same situation, enables a reason against doing X. And in B, all things considered, X shouldn't be done. That double role is the thing my friend denies can happen.
  3. The difference between the cases must not be traceable to consequences, or to a change in the agent's aims or motives. Hold outcomes fixed across the two cases as far as you honestly can.
  4. The pull has to come from the setup, not from my say-so. I don't want to have to add "and intuitively, here F is a reason against." A careful reader should feel the flip before it's named.
  5. Anticipate his repair: he'll say the generalist just states a more specific principle, or adds a ceteris paribus or "unless defeated" clause, and gets the right answer anyway. So show what that repair costs: whether the extra condition in the more specific principle can be stated in general terms at all, rather than being a disguised proper name for this case; and whether a hedged principle can still guide someone facing the case for the first time, before they know how it comes out.

  After the scenario, walk through how a strong generalist, a hedged or defeasible generalist, and a particularist each describe both cases; then say which structural feature of the case is doing the double-role work, what happens to the case if you remove that feature, and how my friend would best attack it. If some part of my specification can't be met without cheating, say so plainly and give me the nearest specification that can be met.

  Finally, tell me how confident you are in what you claim about what each view is committed to, and single out the point you're least sure of. I'd rather have an honest boundary marker I can concede than a confident overreach I can't defend when he pushes back.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Topic:** Moral Particularism vs. Generalism.
      *   **Goal:** Construct a specific case to refute a friend's "weak" interpretation of particularism (i.e., that it's just about defeasibility/outweighing).
      *   **Friend's Position:** Particularism is either trivial (reasons can be defeated) or absurd (morality can't be learned).
      *   **Required Case Specifications:**
          1.  Two ordinary situations (workplace, family, clinic, neighborhood). No trolleys/sci-fi.
          2.  Shared thin non-moral description (Agent, Act X, Feature F).
          3.  Case A: F is a reason for X. X is right.
          4.  Case B: A + *one* extra non-moral fact. F is *still* a reason for X (not silenced, not simply outweighed by independent Z). *Crucially:* F helps constitute/enable a *different* feature G to become a reason *against* X. All things considered, X is wrong in B.
          5.  No consequentialist differences (hold outcomes fixed). No change in motives.
          6.  Intuitive pull must come from the setup, not stipulation.
          7.  Anticipate the "hedged principle" repair (ceteris paribus) and show its cost (vacuity/guidance failure).
      *   **Post-Case Analysis:** Walkthrough of Generalist vs. Particularist descriptions, identify the structural feature doing the work, explain what happens if removed, and suggest the friend's best counter-attack.
      *   **Confidence Check:** State confidence levels and identify the weakest point.

  2.  **Deconstruct the Philosophical Challenge:**

      *   *The Core Claim:* Holism of reasons. A feature (F) can be a reason in one context and contribute to a reason *against* the act in another context, without ceasing to be a reason *for* the act itself. This is the "valence switch" or "polarity shift" challenge, but specifically the "enabling constraint" variant.
      *   *The Constraint:* F must remain a reason *for* X in Case B. It cannot just be outweighed. It must *help make* G a reason *against* X. This is tricky. Usually, if F is a reason for X, and X is wrong, F is outweighed. The prompt asks for F to be *part of the mechanism* that generates the counter-reason.
      *   *Example Idea:* Promise keeping?
          *   Case A: I promise to meet you. (F = Promise). I meet you (X). Right.
          *   Case B: I promise to meet you. But meeting you helps you commit a crime? No, that makes F silent or outweighed.
          *   Need F to *enable* G.
      *   *Example Idea:* Honesty/Truth-telling.
          *   Case A: Telling the truth (X) because it's the truth (F). Good.
          *   Case B: Telling the truth (X) because it's the truth (F). But the context makes the truth-telling cruel.
          *   Problem: Usually, the cruelty outweighs the truth. The prompt wants F to *enable* the cruelty reason.
      *   *Example Idea:* Favoritism/Partiality.
          *   Case A: Helping my child (X) because they are my child (F). Good.
          *   Case B: Helping my child (X) because they are my child (F). But they are competing against a neighbor's child for a scarce resource.
          *   Here, F (my child) is still a reason to help. But F + Context (scarce resource/competition) makes G (unfair advantage) a reason against.
          *   Does F *enable* G? Yes. If they weren't my child, the unfair advantage wouldn't exist in the same way.
      *   *Refining the "Enabling" Condition:* The prompt says: "F is also part of what makes some other feature G into a reason not to do X."
      *   *Scenario Selection:* A Clinic or Workplace seems best for precision. Let's try a **Clinic/Office** setting regarding **Confidentiality/Privacy**.
      *   *Drafting the Scenario:*
          *   **Act X:** Disclosing information about a person (P) to a third party (T).
          *   **Feature F:** P gave permission for the disclosure.
          *   **Case A:** P gives permission. Doctor discloses to T (insurance?). It's standard procedure. Right.
          *   **Case B:** P gives permission. *Extra Fact:* P is under duress/coercion from T, though the Doctor doesn't know the full extent, or perhaps T is known to be manipulative.
          *   *Wait, constraint:* Outcomes fixed. Motives fixed.
          *   *Let's try a Family/Neighborhood setting.* It's more intuitive.
          *   **Act X:** Lending money.
          *   **Feature F:** The borrower is my brother.
          *   **Case A:** Brother needs money for rent. I lend it. F is a reason. Right.
          *   **Case B:** Brother needs money for rent. *Extra Fact:* He has a history of gambling addiction, and I know that lending cash enables the addiction even if he says it's for rent.
          *   *Critique:* Here F (brother) is a reason to lend. But G (addiction risk) outweighs it. Does F *make* G a reason? No, the addiction makes G a reason.
      *   *Let's try "Precedent/Expectation".*
          *   **Act X:** Breaking a routine.
          *   **Feature F:** It's my turn to choose the restaurant.
          *   **Case A:** It's my turn. I choose. Good.
          *   **Case B:** It's my turn. *Extra Fact:* I chose the last three times because everyone else deferred.
          *   *Critique:* F changes status.
      *   *Let's try the "Signaling" angle.*
          *   **Act X:** Giving a gift.
          *   **Feature F:** The gift is expensive.
          *   **Case A:** Wedding gift. Expensive is good.
          *   **Case B:** Gift to a subordinate. Expensive is bribery/harassment.
          *   *Critique:* F (expensive) might cease to be a reason for giving in B.
      *   *Let's try the Specific Constraint again:* "F is *still* a reason to do X... F is also part of what makes some other feature G into a reason *not* to do X."
      *   *This is the "Holism of Reasons" claim (Dancy).* A feature can contribute positively to the verdict *and* contribute negatively to the verdict via enabling another feature.
      *   *Scenario:* **The Reference Letter.**
          *   **Agent:** Professor.
          *   **Act X:** Writing a glowing letter of recommendation for a student.
          *   **Feature F:** The student is genuinely brilliant (intellectually).
          *   **Case A:** Student applies for a PhD program. F is a reason to write. Should write.
          *   **Case B:** Student applies for a job that requires stability/loyalty, but the student is known to be a "mercenary" who leaves jobs quickly. *Wait, outcomes fixed.*
          *   *Let's try:* **The Surprise Party.**
          *   **Act X:** Revealing a secret to a friend.
          *   **Feature F:** The secret is about a surprise party for them.
          *   **Case A:** Revealing to the spouse to coordinate. Good.
          *   **Case B:** Revealing to the friend (to spoil it) because they are anxious.
          *   *Too messy.*

      *   *Let's try: **The Loan Guarantee**.*
          *   **Agent:** You.
          *   **Act X:** Co-signing a loan for a friend.
          *   **Feature F:** The friend is talented/ambitious.
          *   **Case A:** Friend has a solid plan. F is a reason to co-sign. You should.
          *   **Case B:** Friend has a solid plan. *Extra Fact:* The bank requires a co-signer *specifically because* they know talented/ambitious people like him are high-risk flighters.
          *   *Analysis:* F (Talent) is still a reason to help him (you believe in him). But F (Talent) + Bank Policy (G) makes the act risky/exploitative?
          *   *Better:* **The Promotion.**
          *   **Agent:** Manager.
          *   **Act X:** Promoting an employee.
          *   **Feature F:** The employee is the manager's spouse.
          *   **Case A:** Small family business. Nepotism is expected/accepted. F is a reason (loyalty/continuity). Should promote.
          *   **Case B:** Public sector/Corporate. *Extra Fact:* There is a strict anti-nepotism rule designed to prevent *exactly* this appearance of impropriety.
          *   *Analysis:* F (Spouse) is still a reason (you want to help your spouse, loyalty exists). But F + Rule (G) makes G a reason against.
          *   *Problem:* Is F still a *moral* reason in B? Or just a desire? Particularists say it's still a reason, just outweighed/enabled.
          *   *Refinement for "Enabling":* F must help make G a reason.
          *   *Scenario:* **The Rescue.**
          *   **Act X:** Jumping into a river to save someone.
          *   **Feature F:** You are a strong swimmer.
          *   **Case A:** Person is drowning. F is reason to jump. Should jump.
          *   **Case B:** Person is drowning. *Extra Fact:* The person is holding a live grenade and threatens to pull the pin if you approach.
          *   *Analysis:* F (Swimmer) is still a reason (you *could* save them). But F + Grenade (G) makes G a reason against (your death is now certain/useless).
          *   *Problem:* F doesn't *make* G a reason. The grenade makes G a reason.

      *   *Back to Dancy's classic examples:* "Pleasure."
          *   Pleasure is usually a reason for.
          *   But pleasure in another's suffering (Schadenfreude) is a reason against.
          *   Here, the feature "It gives pleasure" flips.
          *   The prompt wants: F is reason FOR in both. But F enables G to be reason AGAINST in B.
          *   *Idea:* **The Honest Critique.**
          *   **Act X:** Telling a colleague their work is flawed.
          *   **Feature F:** The critique is accurate/true.
          *   **Case A:** Colleague asks for feedback to improve. F is reason to speak. Should speak.
          *   **Case B:** Colleague is presenting to investors in 5 minutes. *Extra Fact:* They cannot fix the flaw now, and knowing it will cause them to panic and fail the whole pitch.
          *   *Analysis:* F (Accuracy) is still a reason to speak (truth is valuable). But F + Timing/Inability to Fix (G) makes G a reason against (harm).
          *   *Does F enable G?* The harm comes from the *truth* being known. So F is constitutive of the harm.
          *   *Is F still a reason for?* Yes, truth is still a pro-tanto reason.
          *   *Is the outcome fixed?* In A, work improves. In B, pitch fails. Outcomes differ. Prompt says "Hold outcomes fixed as far as you honestly can." This is hard if the act changes the outcome.
          *   *Interpretation of "Outcomes Fixed":* Usually means "don't rely on consequentialist calculus to explain the difference." The moral difference shouldn't *just* be "A leads to good, B leads to bad." It should be about the *structure of reasons*.
          *   *Let's try to match the "One Extra Fact" constraint strictly.*

      *   *Selected Scenario:* **The Confidential Disclosure.**
          *   **Context:** A Clinic.
          *   **Agent:** A Doctor.
          *   **Act X:** Disclosing a patient's diagnosis to a third party.
          *   **Feature F:** The patient has signed a waiver permitting disclosure.
          *   **Case A:** The third party is the patient's spouse, who is the primary caregiver.
              *   F is a reason to disclose (respect autonomy/consent).
              *   X is right.
          *   **Case B:** The third party is the patient's spouse, who is the primary caregiver. *Extra Fact:* The patient signed the waiver under the mistaken belief that the spouse already knew and had accepted it, but the spouse actually finds the condition stigmatizing and threatening (e.g., a genetic condition affecting inheritance), and the Doctor knows the disclosure will trigger immediate domestic conflict/abuse *because* the waiver exists (it signals the patient 'admitted' it).
              *   *Wait, outcomes fixed.* If conflict happens in B but not A, outcomes aren't fixed.
              *   *Adjustment:* The "Outcome" constraint usually means "Don't just say B is worse because B causes pain." It means the *moral valence* shouldn't rely *solely* on a utilitarian calculus.
              *   *Let's try a non-consequentialist angle:* **The Promise.**
              *   **Act X:** Breaking an appointment.
              *   **Feature F:** You have a better offer (more money).
              *   **Case A:** Freelance gig. Client is a corporation. F is reason to take new gig. Break appointment (with penalty). Permissible.
              *   **Case B:** Freelance gig. Client is a friend in crisis. *Extra Fact:* The friend relied on you specifically because they are vulnerable.
              *   *Critique:* F (Money) is a reason. But Vulnerability (G) outweighs. Does F enable G? No.

      *   *Let's go for the "Constitutive" angle.*
          *   **Act X:** Voting for a candidate.
          *   **Feature F:** The candidate supports Policy P.
          *   **Case A:** Policy P is beneficial. F is reason to vote. Vote.
          *   **Case B:** Policy P is beneficial. *Extra Fact:* The candidate supports P *only* to secure the vote of a specific demographic they intend to betray immediately after.
          *   *Analysis:* F (Supports P) is still a reason (P is good). But F + Deceptive Intent (G) makes G a reason against.
          *   *Does F enable G?* Yes. The support is the vehicle for the deception. Without F, there is no deception regarding P.
          *   *Is F still a reason for?* Yes, P is still good.
          *   *Outcomes:* In A, P happens. In B, P happens (maybe?). If P happens in both, outcomes regarding P are fixed. The difference is the *integrity* of the act.
          *   *Let's refine this to be more "ordinary" and less political.*

      *   **Final Scenario Choice: The Gift.**
          *   **Context:** Family/Neighborhood.
          *   **Agent:** You.
          *   **Act X:** Giving a specific sum of money ($5,000) to a relative.
          *   **Feature F:** The relative is in financial debt.
          *   **Case A:** The relative is your adult son. He made a mistake but is responsible.
              *   F is a reason to give (need/family).
              *   X is right.
          *   **Case B:** The relative is your adult son. He made a mistake but is responsible. *Extra Fact:* The debt is owed to a loan shark who has threatened violence *unless* the payment comes from a "legitimate source" to wash the money, and your son has asked you to be that source unknowingly (or you suspect it).
              *   *Too criminal.*
          *   *Let's try:* **The Reference (Revisited).**
          *   **Context:** Workplace.
          *   **Agent:** Manager.
          *   **Act X:** Writing a reference that highlights a specific skill.
          *   **Feature F:** The employee possesses the skill (e.g., aggressive negotiation).
          *   **Case A:** Employee applying for a Sales Director role.
              *   F is a reason to highlight it.
              *   X is right.
          *   **Case B:** Employee applying for a Mediator/HR role.
              *   *Wait, Act X must be the same.* Highlighting the skill in the letter.
              *   *Extra Fact:* The receiving institution is known to value "collaboration" and view "aggressive negotiation" as a toxic trait *specifically when highlighted by a former manager* (signals the manager is dumping a problem).
              *   *Analysis:* F (Skill) is still a reason (it's a truth about them, usually positive). But F + Context (G) makes highlighting it a reason against (harms candidate).
              *   *Does F enable G?* Yes. Highlighting *this* skill in *this* context creates the negative signal.
              *   *Is F still a reason for?* Yes, truth/competence is generally a reason to recommend.
              *   *Outcomes:* In A, candidate gets job. In B, candidate rejected.
              *   *Constraint Check:* "Hold outcomes fixed." This is the hardest constraint. If X is right in A and wrong in B, usually the outcome *is* the moral status.
              *   *Re-reading Constraint 3:* "The difference between the cases must not be traceable to consequences... Hold outcomes fixed across the two cases as far as you honestly can."
              *   *Meaning:* Don't make the case turn on "In A, 5 people live; in B, 1 person lives." Make it turn on the *nature* of the act/reasons.
              *   *Okay, I can accept that the job outcome differs, provided the moral reasoning isn't just "B leads to rejection."* The moral reasoning must be about the *appropriateness* of the reason F.

      *   *Let's try to get closer to "Outcomes Fixed".*
          *   **Act X:** Visiting a friend in the hospital.
          *   **Feature F:** You bring flowers.
          *   **Case A:** Friend is in a general ward.
              *   F is a reason (kindness). X is right.
          *   **Case B:** Friend is in the ICU. *Extra Fact:* The ICU has a strict no-flower policy due to infection risk, but the friend *loves* flowers and asked you to bring them anyway.
              *   *Analysis:* F (Flowers) is still a reason (fulfilling wish/kindness). But F + Infection Risk (G) makes G a reason against.
              *   *Does F enable G?* Yes. Bringing flowers *is* the risk.
              *   *Is F still a reason for?* Yes, you still want to cheer them up.
              *   *Outcomes:* In A, friend happy. In B, friend happy (if you do it) but risk increased.
              *   *If you don't do X:* Friend sad.
              *   *This works.* The "Outcome" (Friend's happiness) can be held fixed (they want flowers in both). The difference is the *contextual valence* of the flowers.
              *   *Wait, one extra fact.*
              *   Case A: General Ward.
              *   Case B: ICU. (This is the extra fact).
              *   In B, F (Flowers) is a reason for (cheering up). But F + ICU (G) makes G (Infection Risk) a reason against.
              *   *Does F enable G?* Yes. Flowers in a ward = safe. Flowers in ICU = risk. The feature "Flowers" changes its risk profile based on the location.
              *   *Is F still a reason for?* Yes, the desire to cheer up remains.
              *   *Is X wrong in B?* Yes, usually against rules/safety.
              *   *Does this show Holism?* Yes. "Bringing flowers" is a reason for in A. In B, "Bringing flowers" is *still* a reason for (kindness), but it *constitutes* the reason against (risk).
              *   *Wait, Prompt Requirement:* "F is also part of what makes some other feature G into a reason not to do X."
              *   Here, F (Flowers) + Context (ICU) = Risk. So F is part of the risk.
              *   Is F *still* a reason to do X? Yes, it's still kind.
              *   This fits.

  3.  **Drafting the Case:**

      *   **Case A:** You visit your friend in a standard hospital room. You bring a bouquet of lilies (Act X). The feature is that lilies are cheerful/beautiful (F). It's the right thing to do.
      *   **Case B:** You visit your friend in an immunocompromised isolation unit. You bring a bouquet of lilies (Act X). The feature is that lilies are cheerful/beautiful (F). *Extra Fact:* Lilies carry pollen/bacteria risky for immunocompromised patients.
      *   *Refinement:* Make the "Extra Fact" more distinct from the setting if possible, or make the setting the extra fact. The prompt says "differ by the addition of exactly one further non-moral fact."
      *   Let's make the setting the same, but the *patient's condition* the extra fact.
      *   **Case A:** Friend is recovering from surgery. You bring lilies (X). F = Lilies are cheerful. Right.
      *   **Case B:** Friend is recovering from surgery. *Extra Fact:* Friend has developed a rare, severe allergy to lily pollen since admission (unknown to you until you check the chart, or known).
      *   *Problem:* If known, F (Cheerful) is silenced by "Harm".
      *   *Need:* F remains a reason *for*, but enables a reason *against*.
      *   *Let's try the "Precedent" angle again. It's stronger for generalism critiques.*
      *   **Act X:** Making an exception to a rule for a person.
      *   **Feature F:** The person is distressed.
      *   **Case A:** Office rule: No visitors after 6 PM. Employee is distressed due to family news. You let the spouse in.
          *   F is a reason. X is right.
      *   **Case B:** Office rule: No visitors after 6 PM. Employee is distressed due to family news. *Extra Fact:* You have already made this exception three times this month for other employees.
          *   *Analysis:* F (Distress) is still a reason (compassion). But F + Precedent (G) makes G (Fairness/Rule Integrity) a reason against.
          *   *Does F enable G?* Yes. Making the exception *because* of distress adds to the precedent. If you didn't act on F, G wouldn't trigger.
          *   *Is F still a reason for?* Yes, compassion is still relevant.
          *   *Is X wrong in B?* Yes, you should stop making exceptions.
          *   *Outcomes:* In A, employee comforted. In B, employee comforted (if you do it). Outcome fixed (comfort). Moral status flips.
          *   *This is strong.* It attacks the "Ceteris Paribus" clause. The principle "Relieve distress" works in A. In B, it fails not because distress isn't a reason, but because the *history* changes the valence of acting on distress.

  4.  **Drafting the Analysis:**

      *   **Generalist:** Needs a principle. "Relieve distress, unless it violates fairness."
      *   **Particularist:** The reason "Distress" behaves differently. In A, it pushes for. In B, it pushes for, but helps "Unfairness" push against.
      *   **The "Repair" Cost:** The Generalist must add "unless precedent makes it unfair." But how do we define "precedent makes it unfair"? It requires judgment of the particular history. The principle becomes "Do X unless you shouldn't," which is vacuous.
      *   **Confidence Check:** I need to be careful not to misrepresent Generalism. Sophisticated Generalists (like Hooker or Rule Utilitarians) might handle this with "Ideal Code" theories. I need to acknowledge that. My confidence is high on the *structure* of the argument, lower on whether a *Rule Utilitarian* would concede the point (they might say the rule includes the exception). I must highlight that the *exception* is the particularist's win.

  5.  **Refining the Case for Maximum Impact:**

      *   The "Precedent" case is good, but is "Precedent" a non-moral fact? Yes, "You did this 3 times before."
      *   Is F (Distress) still a reason in B? Yes, you still feel compassion.
      *   Does F enable G? Yes, acting on F creates the 4th instance which tips the scale to Unfairness.
      *   *Wait, one nuance:* In B, is F a reason *for*? Or does the unfairness silence F? Particularists argue F is still a reason *for*, it's just that the overall verdict is against. Generalists might say F is outweighed.
      *   *Prompt Requirement:* "F is *still* a reason to do X... F is also part of what makes some other feature G into a reason *not* to do X."
      *   In the Precedent case: F (Distress) motivates the act. G (Unfairness) is the counter-reason. Does F *make* G a reason? No, the *act* makes G a reason. F motivates the act.
      *   *I need F to be a constituent of G.*
      *   *Let's go back to the "Flowers" case but refine the "Enabling".*
      *   **Act X:** Wearing a specific tie.
      *   **Feature F:** The tie is the color of the team that won.
      *   **Case A:** Celebration party. F is reason to wear. Right.
      *   **Case B:** Funeral of a rival fan. *Extra Fact:* The deceased was a rival fan.
      *   *Analysis:* F (Team Color) is still a reason (you support your team). But F + Funeral (G) makes G (Disrespect) a reason against.
      *   *Does F enable G?* Yes. Wearing *that* tie is what constitutes the disrespect.
      *   *Is F still a reason for?* Yes, you still want to show support.
      *   *Outcomes:* In A, celebration. In B, funeral. Outcomes not fixed.
      *   *Constraint 3:* "Hold outcomes fixed." This is the killer.
      *   *Interpretation:* "Hold outcomes fixed" means don't rely on "A produces happiness, B produces sadness" as the *sole* explanation. The moral difference must be in the *reasons*, not just the utility.
      *   *Okay, I will proceed with the **Precedent/Exception** case but frame it carefully to ensure F enables G.*
      *   Actually, the **"Loan"** case works better for "F enables G".
      *   **Act X:** Lending a car.
      *   **Feature F:** The borrower is your sibling.
      *   **Case A:** Sibling needs car for interview. You lend it.
          *   F is reason. Right.
      *   **Case B:** Sibling needs car for interview. *Extra Fact:* Your spouse has explicitly forbidden lending the car due to insurance risks, and knows about this request.
          *   *Analysis:* F (Sibling) is still a reason (family loyalty). But F + Spouse's Veto (G) makes G (Betrayal of Spouse) a reason against.
          *   *Does F enable G?* Yes. If you didn't lend it *because* of F, you wouldn't betray the spouse.
          *   *Wait, is F still a reason for?* Yes.
          *   *Is X wrong?* Yes.
          *   *Outcomes:* Interview happens (if lent).
          *   *This is a conflict of duties.* Generalists love conflicts of duties. "Loyalty to Sibling vs Loyalty to Spouse."
          *   *Particularist claim:* F (Sibling) isn't just a weight on one side. It *interacts* with the Spouse constraint.
          *   *Actually, the best case for Particularism is the "Valence Switch" where F is a reason FOR in A, and a reason AGAINST in B.*
          *   *But the Prompt forbids that.* Prompt says: "In case B... F is *still* a reason to do X... But in B, F is also part of what makes some other feature G into a reason not to do X."
          *   *This is the "Holism of Contributory Reasons" claim.*
          *   *Okay, I have the **Precedent** case. It fits best.*
          *   **Act X:** Granting a deadline extension.
          *   **Feature F:** The student is struggling with mental health.
          *   **Case A:** First request. F is reason. Grant it.
