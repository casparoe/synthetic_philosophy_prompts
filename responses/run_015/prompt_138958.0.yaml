  ### The Disjunctivist's Ladder: Cases Ranked by Threat Level

  **Tier 1: The Easy Wins (Scores 0–3)**
  *Cases where the external object is present and the error is clearly in the conditions or the interpretation.*

  1.  **The half-submerged stick (Score: 1)**
      The disjunctivist says you really see the stick, merely distorted by water, so no mental invention is needed.
  2.  **Doubling (Score: 2)**
      This is a mechanical distortion of genuine sight caused by eye pressure, not a generation of sight from nothing.
  3.  **Pareidolia (Score: 3)**
      You are genuinely seeing the bricks, just misinterpreting their arrangement, so the object is still present.

  **Tier 2: The Blurry Signals (Scores 4–6)**
  *Cases where the causal chain is intact but artificial, or the experience is internal but sensory.*

  4.  **Afterimage (Score: 4)**
      This originates internally but lacks an external object, forcing a slight concession on where the visual field ends.
  5.  **Restored sight (Score: 6)**
      The causal chain is artificial enough to question whether the resulting experience counts as direct perception.
  6.  **Passthrough VR (Score: 7)**
      The object causes the experience, but the immediate stimulus is a screen, blurring the line between seeing and viewing a representation.

  **Tier 3: The Epistemic Twins (Scores 8–9)**
  *Cases where the experience matches reality perfectly, but the causal link is broken or lucky.*

  7.  **Full-blown hallucination (Score: 8)**
      This is the core battle, where subjective indistinguishability pressures the claim that the mental state is fundamentally different.
  8.  **The coincidental match (Score: 9)**
      The presence of the object tempts us to call it seeing, even though the object played no role in causing the experience.

  **Tier 4: The Total Break (Score 10)**
  *Cases where the world is entirely absent or irrelevant.*

  9.  **The perfect simulation (Score: 10)**
      Total indistinguishability with zero external contact makes denying a common mental kind feel like denying reality itself.

  ***

  ### Editor's Notes & Analysis

  **1. The Load-Bearing Beam**
  **0.85.** The argument from illusion gets almost all its persuasive power from hallucination-flavoured cases; illusions like the bent stick are mostly decorative because the object is still there doing some work.

  **2. Traditional vs. Real Weight**
  The stick is the traditional mascot, but the argument genuinely leans on **the perfect simulation** and **full-blown hallucination**, because only those cases completely sever the link between mind and world.

  **3. The Strategic Concession**
  The disjunctivist should concede **Passthrough VR** counts as seeing.
  **Cost:** This weakens the "directness" requirement, forcing them to accept that mediated causal chains are sufficient for perception, which opens the door to representationalism.

  **4. The Eleventh Case**
  **The Shared Hallucination:** Two people hallucinate the same dagger in the same spot, interact with it, and agree on its details, yet nothing is there.
  **Why it's worse:** It adds intersubjective verification to a hallucination, removing the "private mind" escape route that usually protects disjunctivism.

  **5. The Scale Critique**
  Your scale is measuring **two things**, not one: metaphysical commonality (are the states the same?) and epistemic indistinguishability (can you tell them apart?).
  **Recommendation:** Do not print a single ladder. Use a scatter plot with "Metaphysical Threat" on the Y-axis and "Epistemic Threat" on the X-axis; cases like the stick score low on both, but cases like Passthrough VR score high on metaphysical trouble while remaining low on epistemic trouble, and splitting them reveals where the theory actually breaks.
