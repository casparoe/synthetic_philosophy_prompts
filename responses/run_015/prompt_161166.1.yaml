answer: |-
  # WHERE IS EVERYBODY?
  ### A Decision Tree for the Fermi Paradox

  **Start Here:** We agree on two facts.
  1.  **The Galaxy is Old:** There are billions of stars older than the Sun, with plenty of time for life to evolve.
  2.  **The Silence is Real:** We have detected no signals, probes, or artifacts confidently attributed to another technological civilization.

  *Follow the path that matches your intuition.*

  ---

  **1. THE SAMPLE QUESTION**
  **Is Earth a typical blueprint for what planets can achieve, or are we entitled to generalize from a sample of one?**
  *   **No (Earth is special):** Life or intelligence requires unique, unrepeatable conditions.
      *   *Is it **biology** that is rare?* → **Rare Earth Hypothesis**
          *   *Critique:* Merely unattractive; violates the Copernican principle that we are not unique.
      *   *Is it **intelligence** that is rare?* → **Rare Intelligence Hypothesis**
          *   *Critique:* Merely unattractive; ignores evidence of evolutionary convergence in complex traits.
  *   **Yes (Life/Mind is common):** Proceed to Question 2.

  **2. THE LONGEVITY QUESTION**
  **Do technological civilizations typically survive for millions of years, or do they extinguish themselves quickly?**
  *   **No (They die young):** Something filters out civilizations before they become interstellar.
      *   *Is the filter **self-destruction** (war/climate)?* → **The Great Filter**
          *   *Critique:* Merely unattractive; implies humanity's likely extinction is in our future.
      *   *Is the filter **post-biological** (uploading/leaving)?* → **The Transcension Hypothesis**
          *   *Critique:* Simply unexplored; relies on speculative physics regarding consciousness and spacetime.
  *   **Yes (They last):** Proceed to Question 3.

  **3. THE TIMING QUESTION**
  **Even if they last, are other civilizations active at the same time as us, rather than rising and falling long before we existed?**
  *   **No (Wrong era):** The galaxy is a graveyard or a nursery, but currently empty of peers. → **Temporal Isolation**
      *   *Critique:* Plausible; requires civilization rates to be low enough that overlaps are rare despite cosmic time.
  *   **Yes (Contemporaries):** Proceed to Question 4.

  **4. THE RECOGNITION QUESTION**
  **Would we recognize a civilization sufficiently unlike us as a civilization, or would their technology register as natural phenomena?**
  *   **No (We wouldn't know):** Their communication or energy use is fundamentally alien to our sensors. → **Technosignature Mismatch**
      *   *Critique:* Plausible; assumes our current search methods (radio/optical) are anthropocentric.
  *   **Yes (We would know):** Proceed to Question 5.

  **5. THE SEARCH SPACE QUESTION**
  **How much weight does the silence bear given how little of the sky, spectrum, and relevant timescales we have actually examined?**
  *   **No (Search incomplete):** We haven't looked hard enough, long enough, or in the right places. → **The Early Search**
      *   *Critique:* Plausible; our current search volume is less than one part in a billion of the galaxy.
  *   **Yes (Search sufficient):** The silence is genuine; they are there, but we don't see them. Proceed to Question 6.

  **6. THE INTENT QUESTION**
  **Do advanced civilizations want to be detected by younger species like us, or do they choose to remain hidden?**
  *   **No (They hide):**
      *   *To **protect us** (non-interference)?* → **Zoo Hypothesis**
          *   *Critique:* Merely unattractive; requires a universal conspiracy of silence among all civilizations.
      *   *To **protect themselves** (survival)?* → **Dark Forest Theory**
          *   *Critique:* Merely unattractive; assumes universal hostility is the only rational strategy for survival.
  *   **Yes (They broadcast):** We should see them, but we don't. → **[UNOCCUPIED]**
      *   *Critique:* Incoherent; contradicts the starting premises that the galaxy is old and the silence is real.

  ---

  ### ⚠️ OBSERVATIONAL DEGENERACY FLAG
  **The Zoo Hypothesis** and **Dark Forest Theory** cannot be separated by this tree because they predict the exact same observation: **Silence.**
  *   **How to tell them apart:** We would need to intercept communication between *other* civilizations (showing they talk to each other but ignore us, supporting Zoo) or detect a hostile probe eliminating emerging life (supporting Dark Forest). Until then, they are motivationally distinct but observationally identical.
