answer: |-
  There is no single established term that captures the *combined* rhetorical move you are describing, particularly the second wrinkle (the cost-shifting). While the component parts have names in adjacent literatures, the specific mechanism of turning an agent's excuse into a constraint on their victim lacks a canonical label.

  Here is the carving you are looking for, the nearest established concepts, and a proposal for how to name it in your seminar.

  ### 1. The Carving: Two Distinct Moves
  You are correct to suspect these might be two different phenomena that are often conflated. They rely on different normative mechanisms.

  **Wrinkle 1: Normative Inertia (The Inert Conclusion)**
  *   **Structure:** A moral defect is acknowledged (unjust war), but it is decoupled from the agent's permissions and liabilities.
  *   **Mechanism:** This relies on a separation between **objective wrongness** (the act is unjust) and **subjective permissibility** (the agent is blameless).
  *   **Nearest Established Concept:** **The Moral Equality of Combatants.** (I know you want to avoid position-recitation, but this is the doctrinal home of this move). However, "Equality" describes the *status*; it doesn't name the *argumentative move* used to sustain that status despite acknowledged injustice.
  *   **Why it's not quite it:** "Equality" is the *result*. The move you are identifying is the use of **epistemic excuses** to *insulate* the agent from the normative consequences of that inequality.

  **Wrinkle 2: Epistemic Burden-Shifting (The Migrating Cost)**
  *   **Structure:** The agent's epistemic limitation (ignorance of the unjust cause) is used to narrow the *victim's* permissions of self-defense.
  *   **Mechanism:** This treats the aggressor as an **Innocent Threat**. In self-defense theory, if a threat is non-culpable (e.g., a sleepwalker, a child, or an ignorant soldier), the defender's right to kill is often argued to be more constrained (must take more risk, use less force) than against a culpable aggressor.
  *   **Nearest Established Concept:** **The Innocent Aggressor (or Innocent Threat) Problem.** This is a standard term in self-defense ethics.
  *   **The Gap:** In domestic self-defense, the "Innocent Aggressor" constraint is debated. In war ethics, this constraint is often *universalized* without debate. The specific move of taking the *Innocent Aggressor* constraint and applying it to *all* enemy combatants to sustain *Normative Inertia* is what lacks a name.

  ### 2. The Verdict
  There is no established term for the **combination** of these two moves.
  *   **Wrinkle 1** is usually just called "appealing to the Separation Thesis" or "invoking Symmetry."
  *   **Wrinkle 2** is usually discussed under "Liability" or "Innocent Threats."
  *   **The Combined Move:** Using the soldier's ignorance to simultaneously absolve them *and* constrain their victim is not standardly named. It is often an implicit assumption in Traditionalist Just War Theory, but critics (Revisionists) usually attack the *conclusion* (Symmetry) rather than naming the *mechanism* (the cost-shift).

  ### 3. Proposed Terminology
  Since you need a term for the seminar to prevent the discussion from collapsing into "Walzer vs. McMahan," I suggest labeling the combined phenomenon:

  **"Asymmetric Epistemic Shielding"**

  *   **Definition:** An argumentative move where an agent's epistemic limitations (ignorance of the unjust cause) are used to (a) insulate the agent from blame/prohibition (Shielding) while (b) imposing additional risk-avoidance burdens on the victim (Asymmetry).
  *   **Why this works:** It highlights that the *epistemic condition* is doing the work, and it highlights that the *protection* is not distributed equally (the aggressor gets safety from blame; the defender gets danger from constraint).

  Alternatively, for the second wrinkle specifically, you could use:
  **"The Defensive Surcharge"**
  *   **Definition:** The additional risk or restraint imposed on a defender solely due to the aggressor's claim of ignorance.

  ### 4. Boundary Cases for the Seminar
  To test whether "Asymmetric Epistemic Shielding" is doing work, or whether the students are just reciting dogma, try these boundary cases. If the concept is robust, the students' intuitions should shift.

  **Case A: The Drone Pilot (Epistemic Access)**
  *   *Scenario:* A soldier on the ground in 1940 has limited information. A drone operator in Nevada in 2024 has live video feeds, intelligence dossiers, and legal oversight.
  *   *Test:* Does the "Epistemic Shield" thin as epistemic access increases? If the student argues the drone operator *still* gets the full shield despite superior knowledge, they are relying on **Normative Inertia** (Wrinkle 1) alone. If they argue the drone operator's permissions are narrower, they acknowledge the shield is epistemic, not doctrinal.

  **Case B: The Late-War Soldier (Culpable Ignorance)**
  *   *Scenario:* A soldier joins in Year 1 (plausible ignorance). The war continues to Year 5. Atrocities are public. Propaganda is transparent.
  *   *Test:* At what point does the "Innocent Aggressor" status vanish? If the student argues the shield holds indefinitely, they are treating the excuse as a **Status** (soldiers are always innocent) rather than an **Epistemic Condition** (soldiers are innocent *while* ignorant). This exposes Wrinkle 1 as a category error.

  **Case C: The Domestic Analogy (The Police Officer)**
  *   *Scenario:* A police officer shoots a suspect based on faulty intelligence (the suspect was actually innocent). The officer is criminally excused (reasonable mistake).
  *   *Test:* Does the *next* officer who encounters that same suspect have to take *more* risk than usual? In domestic law, the suspect does not gain a "right to shoot back" with reduced constraints, nor does the police force universally accept higher risk because one officer made a mistake.
  *   *Goal:* This isolates Wrinkle 2. Why does the "Innocent Aggressor" constraint apply in war (Defender must take more risk) but not in domestic policing (State absorbs the cost of the mistake)? This forces the student to explain why the *cost* migrates to the enemy soldier specifically.

  ### 5. Why Your Colleague is Half-Right (and Half-Wrong)
  Your colleague says this is an artifact of the **Separation Thesis** (*jus ad bellum* vs. *jus in bello*).
  *   **Right:** The legal structure *permits* this move by formally separating the justice of the war from the rights of the soldier.
  *   **Wrong:** The law describes the *container*, but it doesn't explain the *moral logic* inside it. The law says "treat them as equals." The philosophical move you identified explains *why* someone argues they *should* be treated as equals despite the injustice. The move is the **moral justification for the legal separation**, not the separation itself. Calling it "Asymmetric Epistemic Shielding" allows your students to critique the justification, not just the legal framework.

  ### Summary for the Slide
  *   **Phenomenon:** **Asymmetric Epistemic Shielding**
  *   **Definition:** Using an aggressor's ignorance to absolve the aggressor of blame while simultaneously constraining the defender's right to self-defense.
  *   **Components:**
      1.  **Normative Inertia:** Wrongness does not reduce permission.
      2.  **Defensive Surcharge:** Ignorance increases the victim's risk burden.
  *   **Distinction:** Differs from **Moral Equality** (which is the conclusion, not the argument) and **Invincible Ignorance** (which explains blame, but not necessarily the victim's constraints).
