answer: |-
  **Disclaimer:** I am an AI, not an attorney. Public libraries in the U.S. are generally considered "limited public forums" under the First Amendment. Viewpoint discrimination in a public forum is presumptively unconstitutional. The following procedure is designed to align with typical legal constraints (Time, Place, and Manner restrictions) while operationalizing your ethical concern. **You must run this by your town attorney before adoption.**

  ### The Core Concept: "Operational Intolerance"
  The philosophical "Paradox of Tolerance" fails in law because courts protect *views*, even intolerant ones. To make this workable, you must shift the metric from **Ideological Intolerance** (what they believe) to **Operational Intolerance** (what they intend to do to the library's function).

  *   **Protected:** A group that hates a category of people but will use the room peacefully.
  *   **Unprotected:** A group that intends to use the library to destroy the library's ability to function as a public forum, or incites imminent lawless action.

  ### The Tiered Obligations
  Your three tiers are your primary legal shield. The obligation of neutrality decreases as library involvement increases.

  1.  **Permit (Rent/Use):** The library is a landlord.
      *   *Obligation:* Strict viewpoint neutrality.
      *   *Paradox Application:* Minimal. You generally cannot deny based on views. You can only deny based on safety, capacity, or conduct that disrupts library operations.
  2.  **Host (Staff/Publicity):** The library is a curator.
      *   *Obligation:* Alignment with Library Mission (e.g., "Lifelong Learning," "Inclusive Community").
      *   *Paradox Application:* Moderate. You can deny if the content contradicts the mission (e.g., a workshop on "How to Hate" contradicts "Inclusive Community").
  3.  **Partner (Co-branded):** The library is an endorser.
      *   *Obligation:* Strict alignment.
      *   *Paradox Application:* High. You reserve the right to not associate your brand with groups whose goals undermine the library's existence or values.

  ---

  ### The Decision Procedure (Flowchart)

  Run every application through these steps in order. If a step returns "DENY," stop. If "PASS," move to the next.

  #### Step 1: Tier Classification
  *   **Question:** What level of library involvement is requested?
  *   **Adequate Answer:** Permit, Host, or Partner.
  *   **Action:** Tag the application.
      *   *Note:* If a group requests "Partner" but fails Step 4, you may offer them "Permit" instead (if available). This is a crucial off-ramp.

  #### Step 2: Safety & Legality (All Tiers)
  *   **Question:** Does the application explicitly propose activity that violates criminal law, incites imminent violence, or creates a verifiable physical safety risk?
  *   **Adequate Answer:**
      *   *Yes:* Specific threats, history of violence *at similar events*, weapons, blocking exits. (Requires evidence, not rumor).
      *   *No:* Speculative fear, offensive speech, unpopular views.
  *   **Auto-Deny:** If **Yes**.
  *   **Human Handoff:** If the answer is ambiguous (e.g., "They are controversial but peaceful"). Pass to Step 3.

  #### Step 3: Mission Alignment (Host & Partner Tiers Only)
  *   **Question:** Does the event content directly contradict the Library's written Mission Statement or Strategic Plan?
  *   **Adequate Answer:**
      *   *Yes:* The event teaches skills contrary to the mission (e.g., Mission: "Literacy for All"; Event: "How to Ban Books").
      *   *No:* The event is merely controversial or political.
  *   **Auto-Deny:** If **Yes** (for Host/Partner).
  *   **Human Handoff:** If **Permit Tier**, skip this step. (You cannot deny a Permit based on mission alignment).

  #### Step 4: The "Procedural Intolerance" Test (The Paradox Trigger)
  *   **Question:** Is the *primary purpose* of the gathering to plan actions that would permanently close this forum or strip others of their right to use it?
  *   **Adequate Answer:**
      *   *Yes:* Planning physical disruption of library operations, planning trespassing, or organizing to defund/close the library *through non-democratic means* (e.g., threats vs. voting).
      *   *No:* Petitioning the board, debating policy, advocating for book removal via established policy channels.
  *   **Auto-Deny:** If **Yes**. (This is where you stop the group trying to destroy the tolerance of the institution).
  *   **Human Handoff:** If **No**, but the content is hateful. (You must Permit them, but apply Step 5).

  #### Step 5: Mitigation & Disclaimer (Permit Tier)
  *   **Question:** Can the risk be mitigated by disclaimers and logistical separation?
  *   **Adequate Answer:**
      *   *Yes:* "This room is rented by X, views are not the library's," separate entrance, no library staff present.
      *   *No:* The group demands library endorsement or staff presence to proceed.
  *   **Action:** Grant Permit with strict conditions.

  ---

  ### Failure Modes (How this gets abused)

  1.  **The "Safety" Pretext:** Trustees claim a group is "unsafe" because they dislike them.
      *   *Guardrail:* Step 2 requires *evidence* of imminent risk or past violence at similar events, not "community tension." You cannot invoke the "Heckler's Veto" (denying a speaker because opponents might protest).
  2.  **The "Mission" Stretch:** Defining the Mission so broadly that it bans everything (or so narrowly it bans nothing).
      *   *Guardrail:* The Mission Statement must be adopted by the full board *before* applications arrive. You cannot invent a mission value to block a specific applicant.
  3.  **The Tier Trap:** Forcing a "Partner" request into a "Permit" denial.
      *   *Guardrail:* If a group qualifies for a Permit (Step 2 & 4 pass), you cannot deny the room entirely just because they aren't a "Partner." You must offer the neutral space.
  4.  **The "Procedural" Loophole:** A group claims they are just "discussing" closure, not planning it.
      *   *Guardrail:* Look at the agenda. "Strategy session on disrupting the board meeting" is different from "Discussion on library funding."

  ---

  ### Case Applications

  Here is how the procedure handles your three scenarios.

  #### Case 1: Parents Group (Book Removal Campaign)
  *   **Tier:** Likely Permit (they want to organize/petition).
  *   **Step 2 (Safety):** Pass. No violence threatened.
  *   **Step 3 (Mission):** If Permit, Skip. (If they asked for Host, you could Deny based on "Inclusive Community" mission).
  *   **Step 4 (Procedural Intolerance):** **PASS.** They are using democratic channels (petitioning the board) to change policy. Even if their goal is to remove books, they are not trying to *close the library* or stop others from meeting. They are engaging in core political speech.
  *   **Step 5 (Mitigation):** **Grant Permit.**
  *   **Conditions:** No library logo. Sign posted: "Room rented by private group." Library staff do not attend.
  *   **Outcome:** You let them in. It hurts, but denying them is a lawsuit you will lose. The "Paradox" does not protect you from people using democratic processes to change policy, even bad policy.
  *   **Confidence:** High (Legally). Low (Emotionally/Politically).

  #### Case 2: Nationalist/Identitarian Group (Closed Meeting)
  *   **Tier:** Permit (Closed meeting, no press).
  *   **Step 2 (Safety):** **Borderline.** National violence history is not local evidence. However, "Closed meeting/No Press" can be a red flag for safety planning.
      *   *Action:* Require a security deposit and a signed conduct agreement. If they refuse, Deny Step 2. If they agree, Pass.
  *   **Step 4 (Procedural Intolerance):** **PASS.** A private meeting to hear a speaker, even with abhorrent views, is not an operational threat unless they plan violence *at the library*.
  *   **Outcome:** **Grant Permit.**
  *   **Nuance:** If they apply for **Host/Partner**, you **Deny** at Step 3 (Mission Alignment). You do not have to publicize them.
  *   **Confidence:** High.

  #### Case 3: Antifascist Collective (Deplatforming Workshop)
  *   **Tier:** Permit or Host.
  *   **Step 2 (Safety):** **Review.** "Deplatforming" can mean legal petitions or physical blockades.
  *   **Step 4 (Procedural Intolerance):** **CRITICAL BRANCH.**
      *   *Scenario A:* Workshop is "How to petition the board to cancel hate groups." -> **PASS.** This is protected speech (same as Case 1).
      *   *Scenario B:* Workshop is "Tactics for physically disrupting events" or "How to force the library to cancel." -> **DENY.** This is planning operational sabotage. They are using the room to plan the destruction of the forum's neutrality.
  *   **Outcome:** You must ask for the **agenda**.
      *   If the agenda includes "direct action" at the library: **Deny Step 4.**
      *   If the agenda is "advocacy": **Grant Permit (Step 5).**
  *   **Your Intuition:** You are correct. A consistent procedure *must* treat them like Case 2 if their tactics are disruptive. If their tactics are purely advocacy, they are protected, even if you agree with them. Consistency requires you to ignore your agreement and look at the *method*.
  *   **Confidence:** Medium. (Distinguishing "advocacy" from "incitement to disruption" is the hardest legal line here).

  ---

  ### Confidence Assessment

  *   **Tiered Structure (Permit vs. Host):** **High Confidence.** This is standard library law practice. It gives you the most flexibility.
  *   **Step 2 (Safety/Evidence):** **High Confidence.** Courts require concrete evidence of risk, not feelings.
  *   **Step 4 (Procedural Intolerance):** **Low Confidence.** This is the edge of the cliff. Distinguishing between "advocating for policy change" (Case 1) and "planning operational disruption" (Case 3 Scenario B) is fact-specific and legally fraught.
      *   *Why:* A group can argue that "pressuring the library to cancel" is just political advocacy. If you deny them, you risk a lawsuit claiming you are discriminating against *their* viewpoint on deplatforming.
      *   *Mitigation:* The denial must be based on the **conduct** (planning disruption), not the **view** (antifascism). The agenda is your evidence.

  ### Final Advice for the Trustee
  The "Paradox of Tolerance" is not a legal shield; it is a policy compass. Legally, you are forced to be more tolerant than you might want to be in the **Permit** tier.

  Your power lies in the **Host/Partner** tiers. Use those to curate the library's *voice*. Use the **Permit** tier to protect the *public's right to speak*, even when that speech is aimed at you. It is frustrating, but it is the price of being a public institution.

  **Immediate Action:** Do not decide on the three cases yet. Draft the "Room Use Policy" incorporating these tiers and the "Procedural Intolerance" clause (framed as "Disruption of Operations"). Have the Town Attorney review it. Then apply the policy to the cases. This moves the decision from "Trustees vs. Applicants" to "Policy vs. Applicants."
