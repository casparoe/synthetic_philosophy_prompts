answer: |-
  The most decisive counter-argument is that risk-sharing mechanisms restore the validity of arithmetic expectation, meaning strict Kelly optimality only applies to agents permanently isolated from all forms of risk-transfer, which describes almost no actual humans.

  ### I. Fatal Objections (The View Must Concede These)
  These arguments do not disprove the math of Kelly betting, but they fatally undermine the claim that maximizing geometric growth is the universal normative standard for decision-making. A committed growth-maximizer must admit these limit the domain of applicability.

  1.  **The Ensemble/Pooling Restoration (The "Agent" Problem)**
      *   **The Argument:** As you noted, if agents can pool risk and rebalance (via insurance, markets, marriage, or social safety nets), the collective bankroll grows at the arithmetic mean rate. Ergodicity economics argues that time-averaging fixes non-ergodicity, but risk-sharing fixes it differently: it makes the ensemble average accessible to the individual over time.
      *   **Why it Counts:** If you have access to *any* mechanism that allows you to offload tail risk or share upside (including labor markets where you sell risky skills for stable wages), the strict "single bankroll over time" constraint is violated. The normative force of Kelly collapses because the "agent" is not an isolated trajectory but a node in a risk-sharing network.
      *   **Verdict:** **Conceded.** Proponents like Ole Peters acknowledge this; the Kelly criterion is optimal only for the *isolated* agent. Since isolation is rare, universal prescriptivism is false.

  2.  **Finite Horizons and Step-Function Utilities (The "Goal" Problem)**
      *   **The Argument:** Kelly maximizes asymptotic growth rate ($\lim_{T \to \infty} \frac{1}{T} \log W_T$). It does not maximize $P(W_T > \text{Target})$ for finite $T$. If you need \$1M in 5 years to avoid ruin, and Kelly gets you there with 40% probability while a "bold play" strategy gets you there with 60% (at the cost of higher ruin risk later), Kelly is instrumentally irrational for your actual utility function.
      *   **Why it Counts:** Humans have finite lifespans and specific liabilities. The "long run" where Kelly dominates is a mathematical limit that may exceed biological or economic survival. Maximizing growth rate is only a proxy for maximizing utility; when the proxy diverges from the actual goal (hitting a target by date $T$), you must abandon the proxy.
      *   **Verdict:** **Conceded.** Kelly is optimal for log-utility or infinite horizons. For fixed targets, dynamic programming based on the specific utility function is required.

  3.  **Parameter Uncertainty and Estimation Error (The "Fractional Kelly" Problem)**
      *   **The Argument:** Kelly sizing is hyper-sensitive to edge estimation. If you overestimate your edge by a small amount, you move into the "overbetting" zone where growth turns negative and ruin becomes certain. Under uncertainty, the optimal strategy is formally Fractional Kelly, not full Kelly.
      *   **Why it Counts:** This turns the "half-Kelly" practice you mentioned from a psychological compromise into a mathematical necessity. If the true optimal strategy under uncertainty is fractional Kelly, then the "pure" Kelly criterion is not actually growth-optimal for real agents who don't know their probabilities with omniscience.
      *   **Verdict:** **Conceded.** Full Kelly is only optimal if probabilities are known exactly. Since they never are, strict adherence to the formula is actually sub-optimal for growth.

  ### II. Awkward Objections (The View Survives but Looks Less Normative)
  These points don't break the theory, but they weaken its claim to be the "correct" way to live, revealing it as a specific tool rather than a philosophy.

  1.  **Asymptotic Dominance vs. Real-Time Suffering**
      *   **The Argument:** Kelly guarantees you will end up ahead of any other strategy *almost surely* as $T \to \infty$. However, the time required for this dominance to manifest can be arbitrarily long. You can be behind a reckless bettor for your entire lifetime, only to win posthumously.
      *   **Why it Counts:** It highlights the unfalsifiability concern. If the "win condition" is pushed to infinity, the criterion loses normative bite for mortals. It answers "who wins forever?" not "who lives best?"
      *   **Verdict:** **Conceded but Managed.** Proponents argue that minimizing the time to reach any given wealth level is also a property of Kelly, but the variance around that path means "living behind" is a real, costly possibility.

  2.  **The "Why Log?" Normative Gap**
      *   **The Argument:** The ergodicity argument derives log-utility from the physics of growth, claiming it's not a preference but a fact. However, this relies on the premise that "maximizing growth rate" is the primary objective. If an agent prefers a stable subsistence level over volatile growth, the derivation fails.
      *   **Why it Counts:** It shows the view smuggles in a utility function (log) under the guise of objective math. It solves the problem "how to maximize growth" but not "why maximize growth."
      *   **Verdict:** **Conceded but Managed.** The view claims log is special because it's the only utility function that makes wealth scales invariant, but this is a mathematical elegance argument, not a proof of moral necessity.

  ### III. Dismissible Objections (The View is Right to Reject These)
  These are common critiques that fail to engage with the core ergodicity insight.

  1.  **Standard Risk Aversion ("I just hate losing")**
      *   **The Argument:** "Kelly is too volatile for my taste."
      *   **Why it Fails:** This usually ignores the distinction between ensemble and time averages. If the risk is non-ergodic (ruin is absorbing), "risk aversion" isn't a preference; it's a survival requirement. Dismissing Kelly because it feels risky often implies relying on EV maximization, which guarantees ruin in non-ergodic games.
      *   **Verdict:** **Dismiss.** Unless backed by a specific utility function or pooling argument, this is just intuition fighting math.

  2.  **"Kelly is Too Conservative"**
      *   **The Argument:** "You leave money on the table."
      *   **Why it Fails:** In a repeated non-ergodic game, you cannot "take money off the table" via higher bets without increasing the probability of ruin to 1. The "money left on the table" is the price of survival.
      *   **Verdict:** **Dismiss.** This is a category error confusing single-shot EV with repeated growth.

  ### IV. Addressing Your Specific Guesses

  **1. Is the "Relevant Agent" guess right?**
  **Yes.** This is the strongest theoretical defeater. The ergodicity framing relies on the boundary of the agent being impermeable. If the agent is a "commune" (family, corporation, society) that can internalize losses and externalize gains across members, the arithmetic mean becomes the relevant growth rate. The view holds only for the atomized individual, which is a poor model for humans who evolved in tribes and operate in economies with insurance.

  **2. Is the view unfalsifiable?**
  **Yes, in practice.** The claim "Kelly wins in the long run" is compatible with losing for any finite duration $T$. Since no human lives for $T=\infty$, the core promise is technically untestable within a lifespan.
  **Is this a problem?** It depends on whether you view Kelly as a **physical law** or a **heuristic**.
  *   As a physical law (ergodicity economics): It is problematic because it makes predictions about limits we cannot reach.
  *   As a heuristic (growth optimization): It is acceptable. It minimizes the *expected time* to reach goals, even if the variance is high. The "unfalsifiability" is just the nature of asymptotic claims, like saying "frictionless planes don't exist." It's a limiting case, not a description of reality.

  **3. Is Fractional Kelly an admission of unliveability?**
  **Yes.** It is an admission that the "pure" view assumes omniscience. Living the view requires acknowledging you don't know the true probabilities, which forces you away from the theoretical optimum. This doesn't kill the framework, but it kills the dogmatism. You cannot be a "Kelly Purist" without being a "Probability Omniscientist."

  ### Summary Ranking of Defeaters

  1.  **Risk Pooling/Agent Definition:** (Fatal to universality) Shows Kelly is only for isolated atoms; humans are nodes.
  2.  **Finite Horizon/Specific Goals:** (Fatal to normativity) Shows Kelly is suboptimal for actual human constraints (death, debt dates).
  3.  **Parameter Uncertainty:** (Fatal to purity) Shows Full Kelly is mathematically inferior to Fractional Kelly in real conditions.
  4.  **Asymptotic Timing:** (Awkward) The "win" might come too late to matter.
  5.  **Normative Basis of Log:** (Awkward) Derives "ought" from "is" via a specific definition of growth.
  6.  **Standard Risk Aversion:** (Dismissible) Ignores the ergodicity distinction.
