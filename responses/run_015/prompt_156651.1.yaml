prompt: |-
  The prioritarian response to the leveling-down objection has become a ritualized exchange: defenders distinguish harming from failing to benefit, critics reply that any weighting scheme attentive to relative position licenses downward redistribution when upward improvement is impossible, and pluralists treat equality as an independent coefficient in the social welfare function. After decades of this choreography, I am convinced the stall is not substantive but structural. The literature treats 'priority' as univocal, yet prioritarianism admits two readings—an absolute reading, on which reasons derive from the recipient's deprivation regardless of others, and a comparative reading, on which the strength of a reason is fixed by the gap between recipient and comparator. The leveling-down objection applies cleanly only to the comparative version, but both sides argue as if they share one concept, so they never actually engage the same formal claim. Diagnose this precisely: is the disagreement verbal, with two theories answering different questions under one label? Is there a hidden coherence problem about interpersonal comparison of welfare? Or is it substantive—do we lack a result about whether monotonic weighting functions can avoid downward redistribution? State what kind of progress—conceptual distinction, formal result, or dissolution of the question—would actually move things, and be honest about whether the debate is well-posed. Please indicate how confident you are in your diagnosis and identify the specific point you are least sure about. Confine your answer to one paragraph not exceeding 200 words.
