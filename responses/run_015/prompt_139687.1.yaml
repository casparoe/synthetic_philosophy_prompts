prompt: |-
  I've been in a reading group on the norms of assertion for three years — the same six people, meeting every other week — and in that time nobody has changed their mind even once. I want a diagnosis of why, not another argument for one side.

  The three positions, as my group has them: a knowledge norm (you may assert that p only if you know that p); a truth norm (only if p is true); and a reasonable-belief norm (only if you reasonably believe that p, usually with sincerity and no-defeaters clauses bolted on). Each gets attacked from two directions. The truth norm looks too demanding when a doctor asserts a diagnosis on the best evidence available and the diagnosis happens to be false — nobody in the room thinks she did anything wrong — and too permissive when a guesser asserts a true proposition on no evidence at all. The knowledge norm looks too demanding in lottery- and preface-type situations, including the variant where you know each of a thousand claims individually but do not know their conjunction and so, apparently, may not assert the conjunction while happily asserting each conjunct; and it looks wrong in the cases where a speaker asserts truly against her own evidence, or asserts something she believes but could not be said to know, in a context where asserting is plainly the right thing to do. The belief norm looks too permissive when the speaker's belief comes from a source she had every reason to distrust, or from evidence she negligently failed to gather, and too demanding wherever confident testimony outruns what anyone could reasonably be said to have justified belief in.

  What makes me suspect the dispute is not what it advertises itself to be is the repair pattern. Every side responds to its problem cases by adding a clause — no undefeated defeaters, in a position to know, able to defend it if challenged, not in a context where standards are raised — and once two or three such clauses are in place, I can no longer construct a case in which the amended norms disagree. It begins to look as though the disagreement is either verbal, or else entirely about which formulation best explains a set of verdicts everyone already shares, with explains doing unargued work.

  I have three hypotheses and I don't trust any of them. First, that the sides are testing their norms against different kinds of evidence: the awkwardness of sentences of the form p, but I don't know that p; patterns of retraction, apology and blame; and the function assertion is supposed to serve in the transmission of information. These need not agree, and each side may simply be weighting the one it finds tractable. Second, that they disagree about what a norm of assertion is even for — whether it must be a rule a speaker can consult while speaking, a standard for assessing blameworthiness, a constitutive rule of a speech-act type, or a specification of what a practice of testimony is good for — so that they are answering different questions under one name. Third, that there is a hidden requirement about guidance doing the work: knowledge is arguably not a state one can aim at directly, and the sides may be split on whether that disqualifies a knowledge norm.

  The only thing that reliably moves my group is audience variation. An intern asserting a true, well-supported claim to the engineer who has already run the check; a parent telling a child something the parent only half-remembers; a witness on the stand, where hedging is not permitted. Intuitions swing hard with the hearer's epistemic position, and it is unclear to me whether this shows that the literature has been hunting for an audience-neutral standard that does not exist — in which case the question as posed is ill-posed — or whether it is simply a parameter every side has held fixed, in which case the debate is sound but incomplete.

  Please give me a diagnosis with reasons: which of my hypotheses is right, what is wrong with each of the ones that is not, and what each position actually commits its holder to that makes the impasse stable. Then tell me what would count as progress given that diagnosis — a distinction, a reframing of the question, a formal or empirical result — or argue that no progress should be expected and say why. I am not asking for a survey of the positions, and I don't want an answer that turns on who published what first or on where an argument appeared. Please write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the User's Request:**
      *   **Context:** A reading group on norms of assertion (3 years, 6 people, bi-weekly, zero mind changes).
      *   **Positions:** Knowledge Norm (KN), Truth Norm (TN), Reasonable-Belief Norm (RBN).
      *   **Observation:** All norms face counterexamples from two directions (too demanding/too permissive). All sides repair with clauses (defeaters, context, etc.), leading to convergence on verdicts but divergence on formulation.
      *   **User's Hypotheses:**
          1.  Different evidence types (linguistic awkwardness vs. blame patterns vs. functional role).
          2.  Different purposes of a norm (guidance rule vs. assessment standard vs. constitutive rule vs. functional specification).
          3.  Hidden requirement about guidance (aimability).
      *   **Key Variable:** Audience variation (intern/engineer, parent/child, witness/stand) shifts intuitions significantly.
      *   **Task:** Diagnose *why* the impasse is stable. Evaluate the three hypotheses (pick the right one, explain why the others are wrong/incomplete). Explain what each position actually commits to that sustains the impasse. Recommend what counts as progress (or argue none is possible).
      *   **Constraints:** No survey of positions, no citation games, American English, focus on diagnosis and path forward.

  2.  **Evaluate the User's Hypotheses:**

      *   *Hypothesis 1 (Different Evidence):* The user suggests sides weight linguistic data (Moore's paradox), blame/retraction patterns, or functional utility differently.
          *   *Critique:* This is partially true but superficial. Most proponents of KN, TN, and RBN *claim* to care about all these data points. They argue their norm *best explains* the aggregate data. If they were just looking at different data, they would talk past each other more obviously. The fact that they converge on verdicts after adding clauses suggests they see the *same* data but interpret the *source* of the normativity differently. So, H1 is a symptom, not the root cause.

      *   *Hypothesis 2 (Different Purposes/Functions of the Norm):* The user suggests disagreement on whether the norm is for guidance, assessment, constitution, or function.
          *   *Critique:* This is the strongest candidate. The literature often conflates "constitutive rules" (what makes an act an assertion) with "regulative norms" (what makes an assertion good/permissible) and "ethical obligations" (when are you blameworthy). If Person A thinks the norm defines the *speech act type* (constitutive) and Person B thinks it defines *moral/epistemic blame* (regulative/ethical), they will never agree on a single formulation because they are modeling different phenomena. The "clauses" added to fix counterexamples often shift the norm from one category to another (e.g., adding "reasonable belief" to a Knowledge Norm makes it more about blame than constitution).

      *   *Hypothesis 3 (Guidance/Aimability):* The user suggests a split on whether speakers must be able to aim at the norm.
          *   *Critique:* This is a specific instance of H2. If the norm is for guidance, it must be transparent (favoring RBN). If it's constitutive or truth-aimed, transparency matters less (favoring KN or TN). H3 is too narrow to explain the whole impasse, though it captures a real tension.

  3.  **Formulate the Diagnosis:**

      *   **Core Diagnosis:** The impasse is stable because the debate conflates *constitutive rules* (what makes it assertion) with *regulative standards* (what makes it proper assertion). The "clauses" added to save the norms are actually attempts to bridge this gap, but they end up making the norms extensionally equivalent (agreeing on verdicts) while intensionally distinct (disagreeing on *why*).
      *   **Verdict on Hypotheses:**
          *   H2 is the primary driver (Purpose/Function).
          *   H1 is a downstream effect (they select evidence that fits their chosen function).
          *   H3 is a specific constraint within H2 (guidance applies to regulative, not necessarily constitutive).
      *   **The "Audience Variation" Clue:** This is the smoking gun. It suggests assertion is a *dyadic* or *context-sensitive* practice, not a monolithic speech act with a single invariant norm. The search for a "One True Norm" is the category error.

  4.  **Analyze the Commitments (Why the Impasse is Stable):**

      *   *Knowledge Norm Commitment:* Assertion is the unique vehicle for transmitting *knowledge*. If you don't know, you aren't playing the game, even if you're blameless. (Constitutive focus).
      *   *Truth Norm Commitment:* Assertion is a commitment to *reality*. The world is the judge, not the speaker's mind. (Metaphysical focus).
      *   *Belief Norm Commitment:* Assertion is a window into the *speaker's mind*. It's about sincerity and rationality, not external fact. (Psychological/Ethical focus).
      *   *Stability:* Because they can add clauses to match verdicts, no empirical case kills a position. They survive by retreating to their core commitment (e.g., "She was blameless, but she still violated the constitutive rule").

  5.  **Determine Path to Progress:**

      *   *Reframing:* Move from "The Norm of Assertion" to "The Dimensions of Assertional Propriety." Acknowledge pluralism.
      *   *Distinction:* Separate *Illocutionary Validity* (did an assertion occur?) from *Epistemic Propriety* (was it a good assertion?) from *Moral Blame* (should the speaker be criticized?).
      *   *Audience Parameter:* Formalize the audience's epistemic position as a variable in the norm, not a bug.
      *   *Empirical Work:* Look at how people actually react (experimental philosophy) to see if "folk" intuitions distinguish between "wrong to say" and "bad assertion."

  6.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Analytical, direct, respectful of the user's sophistication.
      *   *Structure:*
          1.  Direct Answer (Which hypothesis is right).
          2.  Critique of the other two.
          3.  Deep Dive into the Real Problem (Constitutive vs. Regulative).
          4.  Explanation of Stable Commitments.
          5.  Path to Progress (Reframing + Audience Parameter).
      *   *Refining the "Audience" point:* The user noted audience variation swings intuitions. This supports the idea that "Assertion" isn't one thing. It's a family of practices. The search for a context-invariant norm is the error.
      *   *Refining the "Clauses" point:* The user noted clauses make norms agree on verdicts. This is "extensional equivalence." The debate is now purely intensional (metaphysical grounding). This is why no mind changes occur—it's no longer about cases, it's about theory architecture.

  7.  **Final Polish (checking constraints):**
      *   American English? Yes.
      *   No citation games? Yes.
      *   No survey? Yes.
      *   Address all parts of the prompt? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to just say "H2 is right." I need to explain *why* H1 and H3 are insufficient. H1 is about *data selection*, but the user says they agree on verdicts now. So data selection isn't the blocker; *interpretation* is. H3 is about *guidance*, which is important, but it's a subset of the "Purpose" question in H2. H2 is the umbrella.

      *Wait, is H2 fully right?* H2 says they disagree on what a norm is *for*. That's accurate. But the deeper issue is that they are trying to solve a *pluralistic* problem with a *monistic* tool. I should emphasize that the "One Norm" assumption is the root error, which H2 touches on but doesn't fully capture. I will integrate this into the diagnosis. The "Purpose" disagreement exists *because* assertion serves multiple purposes.

      *Let's look at the Audience Variation again.* If intuitions swing based on the hearer, then a speaker-centric norm (like "I must know") is insufficient. It implies a relational norm. This supports the "Reframing" recommendation.

      *Final Plan:*
      1.  Endorse H2 as the primary driver but refine it (Constitutive vs. Regulative).
      2.  Dismiss H1 (symptom, not cause) and H3 (subset of H2).
      3.  Explain the "Extensional Equivalence" trap (why clauses kill the debate).
      4.  Explain the Commitments (what they are actually defending).
      5.  Propose Progress: Pluralism + Relational/Contextual parameters.

  8.  **Writing the content.** (Mental check: Ensure I don't sound like I'm advocating for one norm. Stay diagnostic.)
      *   *Key phrase to include:* "Extensional equivalence, intensional divergence."
      *   *Key distinction:* "Constitutive rule" vs. "Standard of criticism."
      *   *Key insight:* The "One Norm" assumption is false.

      *(Final Review of the Prompt's "Audience" point)*: The user says audience variation moves the group. This suggests the "fixed parameter" theory (that they are just ignoring it) is less likely than the "ill-posed question" theory. I should argue that the question *is* ill-posed because it assumes invariance.

      Okay, ready to write.s
answer: |-
  Here is the diagnosis.

  ### The Diagnosis

  Your second hypothesis is the correct one, though it requires sharpening. The impasse is stable because your group is conflating **constitutive rules** with **regulative standards**. The participants are not merely disagreeing about what the norm is *for* (guidance vs. assessment); they are disagreeing about what kind of *thing* a norm of assertion is.

  The other two hypotheses are incorrect or incomplete for the following reasons:

  **Why Hypothesis 1 (Different Evidence) is wrong:**
  You noted that once the clauses are added ("no defeaters," "context appropriate"), the norms converge on verdicts. If the disagreement were primarily about which evidence to weight (linguistic awkwardness vs. blame patterns), adding clauses to accommodate the opposing evidence would resolve the dispute. The fact that the dispute *persists* despite agreement on verdicts proves they are not fighting over the data. They are fighting over the metaphysical grounding of the data. They agree on *what* happens in the cases; they disagree on *why* it happens.

  **Why Hypothesis 3 (Guidance) is incomplete:**
  The guidance objection (that one cannot aim at knowledge directly) is a powerful argument against the Knowledge Norm, but it is a subset of the broader functional disagreement in Hypothesis 2. If the norm is constitutive (like the rules of chess), it does not need to be actionable guidance for the player; a move can be illegal even if the player didn't know it. If the norm is regulative (like a moral obligation), it generally must be actionable. Disagreement about guidance is a symptom of the deeper disagreement about whether the norm defines the act or evaluates the agent.

  ### The Real Problem: Extensional Equivalence, Intensional Divergence

  The reason nobody has changed their mind in three years is that your group has achieved **extensional equivalence** through ad hoc repair, while maintaining **intensional divergence**.

  By bolting on clauses (e.g., adding "reasonable belief" to the Knowledge Norm for lottery cases, or "best available evidence" to the Truth Norm for the doctor), each side has modified their norm to match the intuitive verdicts of the other sides. At this point, the norms are no longer predictive tools; they are post-hoc explanations.

  *   **The Knowledge Norm holder** is actually committed to the idea that assertion is the unique vehicle for **transmitting epistemic authority**. When they concede a case (e.g., the doctor), they view it as a "blameless violation." The act was defective, but the agent is excused.
  *   **The Truth Norm holder** is committed to the idea that assertion is a **commitment to reality**. The world is the judge. When they concede a case (e.g., the lucky guesser), they must argue that the assertion was improper despite being true, or that "assertion" requires a link to truth that mere luck doesn't provide.
  *   **The Belief Norm holder** is committed to the idea that assertion is a **disclosure of the speaker's mind**. It is about sincerity and rationality. When they concede a case (e.g., negligent belief), they treat it as a failure of the belief-formation process, not the assertion itself.

  Because each side treats their core commitment as the definition of the practice, no counterexample can kill the theory. Any counterexample is absorbed as a "violation with excuse" or a "borderline case." The debate has ceased to be about which norm fits the cases and become a debate about which metaphysical picture of communication is preferred. That is a philosophical preference, not an argumentative defeat, which explains the zero mind-change rate.

  ### The Significance of Audience Variation

  Your observation about audience variation is the key to unlocking the impasse. It suggests that the question your group is asking ("What is the norm of assertion?") is **ill-posed**.

  It assumes assertion is a monolithic speech act with a single, invariant norm, similar to how a checkmate has invariant rules regardless of who is playing. Your data suggests assertion is a **relational practice**. The propriety of an assertion depends on the epistemic relationship between speaker and hearer.

  *   **Intern to Engineer:** The norm is high (Knowledge/Truth) because the engineer relies on the intern for data to act upon.
  *   **Parent to Child:** The norm is lower (Reasonable Belief) because the function is reassurance or socialization, not data transfer.
  *   **Witness to Court:** The norm is legalistic (Truth + Justification) because the function is evidentiary.

  If the norms shift based on the hearer's position, then searching for a single, audience-neutral norm is a category error. The sides in your group are likely latching onto different *contexts* as the "default." The Knowledge Norm proponent is modeling a testimony context (transmission); the Belief Norm proponent is modeling a conversational context (expression); the Truth Norm proponent is modeling a scientific or legal context (accuracy). They are all right about their specific domain, and wrong to universalize it.

  ### What Counts as Progress

  Given this diagnosis, continuing to trade counterexamples is a waste of time. You have already exhausted that method. Progress requires a reframing of the question.

  **1. Distinguish the Dimensions of Propriety**
  Stop asking for "The Norm." Instead, agree to distinguish three separate questions that the literature currently conflates:
  *   **Illocutionary Validity:** What conditions must be met for an utterance to count as an assertion rather than a guess or a joke? (Likely a low bar, perhaps sincere belief).
  *   **Epistemic Propriety:** When does an assertion successfully transmit warrant to a hearer? (Likely Knowledge or Truth-relative-to-Context).
  *   **Moral/Professional Blame:** When is the speaker criticizable for asserting? (Likely Reasonable Belief + Due Diligence).

  Your group members should be asked to specify which dimension their norm addresses. You will likely find the Knowledge Norm is best for Epistemic Propriety, the Belief Norm for Blame, and the Truth Norm for a metaphysical ideal that rarely maps to practice. Acknowledging this pluralism dissolves the need for one to "win."

  **2. Formalize the Audience Parameter**
  Make the hearer's epistemic position an explicit variable in your discussions. A norm should look like: *S may assert p to H only if...*
  If you do this, you will likely find the "Too Demanding" and "Too Permissive" objections vanish. The doctor's diagnosis is permissible because the patient (hearer) cannot access the truth directly; the lucky guesser is impermissible because the hearer is being asked to rely on a process that offers no warrant. This moves the debate from "What is the rule?" to "How does the rule scale with context?"

  **3. Shift from Intuition to Function**
  Since your intuitions converge on verdicts once clauses are added, stop testing intuitions. Test functions. Ask: "If we adopt the Knowledge Norm as a social rule for this specific context (e.g., scientific publishing), what are the downstream effects on information flow?"
  This moves the discussion from armchair metaphysics to pragmatic social epistemology. It forces the Truth Norm holder to explain how their norm helps hearers, and the Belief Norm holder to explain how their norm prevents error propagation.

  ### Conclusion

  No progress should be expected if you continue to treat the norms as competing candidates for a single, universal rule. The stability of the impasse is not a sign of deep philosophical mystery; it is a sign that the debate has outgrown its framing. The "One True Norm" assumption is false.

  Your group should declare a moratorium on counterexamples. Spend the next month trying to write a single sentence that all three sides can accept that distinguishes *validity*, *propriety*, and *blame*. If you cannot do that, you have confirmed that the terms are being used to track different phenomena. If you can, you will have dissolved the dispute by showing that the positions are compatible components of a larger system, rather than mutually exclusive rivals.
