          3.  Unless the heirs are currently worse off *and* this transfer fixes the pattern, the principle prefers stability of the current pattern over historical correction. Verdict: Alice keeps it (or the resource is redistributed generally, not specifically to heirs).
      *   **The Precise Feature:** The audit mechanism makes the historical fact *known* and triggers a specific liability. Without the audit, the information asymmetry protects Alice (Nozick might accept the status quo due to epistemic limits). The audit forces the rectification principle to activate against a good-faith holder.
      *   **Removing the Feature:** If no audit exists, the information remains asymmetric. Nozick might argue that without knowledge, we must assume justice or use a heuristic (statistical rectification), which might leave Alice in place. The conflict dissolves because the historical claim cannot be operationalized.
      *   **Nozickian Defender's Attack:**
