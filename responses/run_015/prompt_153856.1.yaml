answer: |-
  In the Oakwood Community Land Trust, resident Alice holds a housing share acquired in good faith through a voluntary purchase from the Trust, which itself obtained the land decades prior through a government grant. The Trust's charter includes a provenance-audit mechanism, funded by member dues, designed to inspect historical titles for legitimacy; when triggered, this audit reveals that the original government grant was predicated on the coercive dispossession of a specific family, the Velezes, two generations ago, a fact previously obscured by asymmetric information. Under the Trust's rules, which embody a time-slice pattern principle of distributive justice requiring current resources to be allocated solely to maximize the welfare of the present least-advantaged members, Alice is permitted to retain the share because her dispossession would harm her current standing without guaranteeing a net gain for the current poor. However, the audit triggers a claim by the Velez heirs demanding the return of the specific asset, creating a conflict where the pattern principle validates Alice's retention based on current distributional effects, while the historical record demands restitution.

  **Theoretical Derivation and Analysis**

  **Nozick's Verdict:** Nozick's entitlement theory proceeds through three stages: justice in acquisition, justice in transfer, and rectification. Here, justice in acquisition failed initially due to coercive dispossession (the Velez family was wronged). While the subsequent transfers to the Trust and then to Alice were voluntary and conducted in good faith, Nozick adheres to the principle that one cannot transfer more rights than one possesses (*nemo dat quod non habet*); the Trust held a tainted title, so Alice's title is similarly encumbered. Consequently, the Principle of Rectification applies: the injustice must be corrected by restoring the victims (the Velez heirs) to the position they would have occupied had the injustice not occurred. Since the audit has removed the epistemic barrier regarding the specific asset, Nozick's theory dictates that Alice must relinquish the resource to the heirs, perhaps receiving compensation for her improvements but losing the entitlement itself.

  **Pattern Principle's Verdict:** A time-slice pattern principle (e.g., a Rawlsian difference principle applied statically) evaluates justice solely based on the structural properties of the distribution at the present moment, ignoring historical provenance. Because Alice's current possession contributes to a stable housing arrangement for a current member, and her dispossession would reduce her welfare without necessarily maximizing the position of the globally least-advantaged (the Velez heirs may not be the current worst-off), the pattern principle verdict is that Alice retains the resource. The conflict arises because the pattern principle treats the resource as a floating asset to be allocated for current social ends, whereas Nozick treats it as a historically indexed entitlement.

  **The Precise Feature:** The work is done by the **audit-triggered rectification obligation falling on good-faith intermediaries**. Without the audit, the historical injustice remains buried in asymmetric information. In the absence of specific knowledge, Nozick suggests we might rely on general heuristics or assume the status quo to avoid endless disruption. The audit mechanism forces the latent historical injustice into the present, transforming a theoretical debt into an operational claim against an innocent party (Alice). It collapses the distinction between the perpetrator of the injustice and the current holder, forcing the holder to bear the cost of rectification.

  **Removing the Feature:** If the audit mechanism is removed, the information asymmetry persists. Nozick's theory acknowledges the difficulty of rectification when history is obscure; without the audit, the "presumption of justice" might apply to current holdings to maintain social order. In this state, Nozick's verdict would likely converge with the pattern principle's: Alice keeps the house because the specific claim cannot be substantiated. The conflict dissolves because the entitlement theory cannot operationalize the rectification principle without the factual input the audit provides.

  **The Nozickian Defender's Attack:** A defender of secure entitlements would argue that applying rectification in this manner violates the rights of the intermediaries and destabilizes the system of just transfers. By holding Alice liable for a coercion she did not commit and could not have detected without the institutional audit, the Trust treats her not as a rights-bearer but as a means to correct past wrongs. This undermines the "side-constraint" nature of rights; if a voluntary, good-faith transfer can be undone decades later by an archival discovery, the security of property is illusory. Operationalizing rectification through aggressive auditing imposes an infinite liability on current holders, chilling voluntary exchange and destabilizing the very expectations that entitlement theory seeks to protect. Thus, while the audit reveals the truth, using it to dispossess a good-faith holder sacrifices the stability of justice in transfer for the sake of justice in acquisition, potentially rendering the entitlement system unworkable.
