answer: |-
  There is no single, canonical term in political or legal theory that names this phenomenon with the same recognition as "Sen's Liberal Paradox" or "The Prisoner's Dilemma." You have identified a structural vulnerability that is widely discussed in fragments across constitutional theory, administrative law, and republican political philosophy, but it does not have a unified label.

  The closest established concepts describe *parts* of the structure, but none capture the specific mechanism of "reclassification rather than violation." Below is the carving you requested: the established terms that approximate it, why they fall short, and a proposed term with boundary conditions to fill the gap.

  ### 1. The Established Concepts (and Why They Are Incomplete)

  **A. *Kompetenz-Kompetenz* (Competence-Competence)**
  *   **The Concept:** In constitutional and international law, this is the authority of a body (usually a court) to determine the limits of its own jurisdiction.
  *   **The Fit:** Your board is exercising a form of *Kompetenz-Kompetenz*. They are deciding the boundary between their jurisdiction (common areas, commercial use, exterior visibility) and your jurisdiction (interior discretion).
  *   **The Mismatch:** *Kompetenz-Kompetenz* is typically a neutral procedural doctrine regarding *who* decides. It does not inherently describe the *abuse* of that power to shrink another's sphere. It describes the mechanism, not the pathology.

  **B. Republican Domination (Philip Pettit)**
  *   **The Concept:** Freedom is not merely the absence of interference, but the absence of the *capacity for arbitrary interference*. You are dominated if another agent has the power to interfere in your choices at their discretion, even if they do not exercise it.
  *   **The Fit:** This captures the "skin-crawling" feeling you describe. The board holds arbitrary power over the *definition* of your rights. The surcharge and the permission requirement are exercises of this dominating power.
  *   **The Mismatch:** Domination is a broad condition of relationship. It does not specify the *technical method* (reclassification of definitions) by which the domination is effected.

  **C. Constitutional Mutation (*Verfassungswandel*)**
  *   **The Concept:** A change in the practical application of a constitution without a formal amendment to the text.
  *   **The Fit:** The bylaw text remains intact ("sole and final discretion"), but its operational reality has changed via board interpretation and procedural add-ons.
  *   **The Mismatch:** This is usually used to describe broad societal shifts or judicial evolution, not the strategic, piecemeal redefinition of a private entitlement by a counterparty.

  **D. Hohfeldian Incidents (The Structural Gap)**
  *   **The Concept:** Wesley Hohfeld dissected rights into four distinct incidents: Claims, Privileges, Powers, and Immunities.
  *   **The Analysis:**
      *   You have a **Privilege** (Liberty) to act inside your unit (no duty to refrain).
      *   You have a **Claim** against the board interfering (they have a duty not to enter/regulate).
      *   **The Missing Piece:** You lack an **Immunity**. An Immunity is protection against someone else's *Power* to change your legal status. The board retains the **Power** to redefine the scope of your Privilege. Because you lack the Immunity against their Power of Redefinition, your Right is structurally incomplete.
  *   **The Value:** This is the most precise "carving" of your problem. The bylaw granted you a Right but failed to grant you the Immunity necessary to secure it against the Board's interpretive Power.

  ### 2. Proposed Term: Definitional Encroachment

  Since no single term exists, the phenomenon is best described as **Definitional Encroachment**.

  **Definition:**
  Definitional Encroachment occurs when a governing authority reduces the scope of a protected entitlement not by violating the text of the protection, but by unilaterally reclassifying the protected conduct or object into an unprotected category, thereby retaining the textual right while nullifying its practical application.

  **Boundary Conditions:**
  1.  **Textual Integrity:** The protecting clause remains textually unchanged (distinguishing it from Amendment or Repeal).
  2.  **Interpretive Monopoly:** The authority responsible for regulating the *unprotected* sphere also holds the authority to define the boundary between protected and unprotected (distinguishing it from simple Dispute).
  3.  **Reclassification Mechanism:** The reduction of rights is achieved by moving items from Column A (Protected) to Column B (Regulable) via definition, not by banning items within Column A (distinguishing it from Direct Violation).
  4.  **Procedural Lock-in:** The process often includes a requirement that the holder seek permission to confirm the status of the entitlement (the "right to ask the decider whether you may decide").

  ### 3. Answers to Your Specific Questions

  **Is a single open reclassification adopted by a legitimate vote the same thing as an accretion of quiet ones?**
  Structurally, yes; politically, no.
  *   **Structurally:** Both rely on the same flaw: the Board holds the Power of Definition without an Immunity check. A single vote that redefines "interior" to exclude "tapestries" achieves the same nullification as a year of quiet reclassifications.
  *   **Politically:** A single vote triggers **Salience**. It forces a public cost (political capital, member outrage). Accretion relies on **Latency**. It keeps the cost below the threshold of mobilization. In administrative law, this is the difference between a "Legislative Rule" (requires notice/comment) and an "Interpretive Rule" (often immediate). Your board is treating substantive changes as interpretive rulings to avoid the cost of salience.

  **Does the analysis change if the reclassification genuinely prevents harm to other members?**
  No, but the *justification* changes.
  *   If the reclassification prevents harm (e.g., tutoring creates fire code violations or noise), the Board is exercising a legitimate **Police Power**.
  *   However, if the bylaw grants you "sole and final discretion," the contract implies you accepted the risk of minor harms inherent in that discretion. By reclassifying harmless acts (book clubs, tapestries) under the guise of harm prevention, they are engaging in **Pretextual Reclassification**.
  *   The structural flaw remains: The Board is the judge of what constitutes "harm" sufficient to trigger reclassification. Without an independent arbiter, the "harm prevention" defense is self-judging.

  **Can a protected sphere be protected at all without also protecting somebody's authority to say what falls inside it?**
  This is the **Boundary Problem of Liberty**.
  *   **Theoretically:** No. A right without a defined boundary is meaningless; a right with a boundary defined solely by the regulator is illusory.
  *   **The Solution:** Protection requires a **Second-Order Guardian**. In a state, this is the Judiciary (which interprets the Constitution against the Legislature). In a co-op, this would be an independent arbitration clause or a supermajority requirement for *any* definition of "interior" vs. "exterior."
  *   **The Hard Truth:** You cannot have a self-enforcing sphere. If the Board has the power to enforce the bylaws, they inevitably have the power to interpret them. To protect the sphere, you must remove the Power of Interpretation from the Party Benefiting from the Interpretation. This is the principle of **Nemo Judex In Causa Sua** (no one should be a judge in their own cause). Your bylaws violate this principle by making the Board the judge of the Board's jurisdiction.

  ### 4. Summary of the Structure

  You are experiencing **Definitional Encroachment** enabled by a **Hohfeldian Gap** (missing Immunity) and sustained by **Interpretive Monopoly**.

  *   **It is not Vagueness:** As you noted, precise wording can still be reclassified.
  *   **It is not Violation:** The text is honored in the breach.
  *   **It is not Amendment:** The text is unchanged.
  *   **It is Jurisdictional Self-Expansion:** The Board expands its jurisdiction by shrinking yours, using the power to define the border as the weapon.

  The specific procedural rule you mentioned ("must first obtain a written determination... that the matter... is in fact interior") is the smoking gun. In constitutional law, this is a **Prior Restraint** masquerading as a **Jurisdictional Determination**. It converts a Right (which you hold) into a Privilege (which they grant).

  **Recommendation for your analysis:**
  If you need to cite this in a memo or argument, do not look for a single case name. Instead, frame it as: *"The Board is exercising a unilateral Power to Redefine the Scope of Entitlements without a corresponding Member Immunity, resulting in Definitional Encroachment on the Protected Sphere."* This combines the Hohfeldian precision with the descriptive accuracy of the mechanism.

  The phenomenon is real, it is structurally distinct from simple rights violation, and it is the inevitable result of granting a regulator the power to define the limits of its own regulation without an external check. You have identified the flaw in the "operating system" of your cooperative's governance.
