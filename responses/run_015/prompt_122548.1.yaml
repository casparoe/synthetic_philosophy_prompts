answer: |-
  **Bottom Line:** Never write that a trait is "learned" or "hardwired" unless you can explicitly name the input gap the learner closed or the specific biological constraint that forced it.

  ### The 10-Minute PoS Decision Procedure

  **Step 1: Disentangle "Innate" (2 minutes)**
  Check which definition the authors are using. Collapse the first three; keep the last two separate.
  *   **Collapse into "Biological Predisposition":** Present at birth, species-typical, genetically specified. (Safe to use if evidenced).
  *   **Keep Separate (Danger Zone):**
      *   *Domain-Specific Knowledge:* Knowing rule X without evidence for rule X. (This is the real PoS claim).
      *   *Heritable:* Genetic variation explains trait variation. (This is a statistic, not a mechanism).
  *   **Rule:** If the paper claims "innate" but only proves "heritable" or "species-typical," ban the word "innate." Use "biological predisposition" or "genetic influence."

  **Step 2: The "Where Is the Work Being Done?" Call (5 minutes)**
  Ask these exact questions. If the author hedges, you stop.
  *   **For ML Models:** "What inductive biases does the architecture have that a human infant doesn't?" (e.g., attention mechanisms, tokenization). "Does the training data volume/density exceed what a child hears by age 4?"
  *   **For Child Studies:** "What specific evidence in the input supports this rule?" "Could a general statistical learner find this pattern without a grammar module?"
  *   **For Field/Heritability:** "Does this show the *capacity* is missing, or just the *usage*?" "Does heritability explain the *mean* ability or the *variance*?"

  **Step 3: The Fill-in-the-Blanks Test (2 minutes)**
  Complete this sentence using only data in the press release/abstract:
  *"______ is innate relative to [Specific Input X] given [Specific Machinery Y]."*
  *   **Pass:** You can fill both brackets with numbers or specific mechanisms cited in the text.
  *   **Fail:** You cannot quantify the input or define the machinery.
  *   **Action:** If Fail, delete "innate," "hardwired," or "learned." Use "computable from," "associated with," or "observed in."

  **Step 4: Generate the Defensible Line (1 minute)**
  Draft your claim using this template:
  *"The study demonstrates [Trait] is [Learnable/Heritable/Present] given [Constraint], but does not prove [Stronger Claim]."*
  *   **Editor Check:** If this looks like stacked hedges, tighten the verb. Change "does not prove" to "leaves open."
  *   **Author Shield:** If the author complains, show them Step 3. If the blanks weren't filled, the claim is unsupported.

  **Stop Condition:** If the study compares a model to a child but cannot quantify the child's input, or compares twins but claims genetic *content* rather than genetic *variance*, hand the story to an outside reviewer. Do not write the nature/nurture angle.

  ---

  ### Worked Applications

  #### 1. The Zurich Neural Net (ML vs. PoS)
  *   **Input:** 40M words + nursery audio.
  *   **Claim:** "Grammar isn't hardwired after all."
  *   **Step 1 Check:** "Hardwired" implies Domain-Specific Knowledge.
  *   **Step 2 Check:** 40M words is likely 4x–10x a child's input by age 4. Model architecture (Transformer) has attention biases infants may lack.
  *   **Step 3 Test:** "Grammar is innate relative to [Unknown Child Input] given [Unknown Infant Architecture]." **FAIL.** You cannot equate model input to child input.
  *   **Verdict:** **STOP.** You cannot write "grammar isn't hardwired."
  *   **Replacement Sentence:** "The study demonstrates that yes/no questions are computationally learnable from large-scale audio data using current architectures, though the data requirements exceed typical child exposure."
  *   **Defensible Line:** "We showed it is *possible* to learn this from data, not that children *do* learn it this way."

  #### 2. The Twin Study (Heritability vs. Innateness)
  *   **Input:** 3,000 pairs, age 7 comprehension.
  *   **Claim:** "Grammar is in the genes."
  *   **Step 1 Check:** Heritability (0.6) is a variance statistic, not "Domain-Specific Knowledge." **COLLAPSE ERROR.**
  *   **Step 2 Check:** Heritability explains differences between kids, not the source of the ability itself. (Height is heritable, but you still need food to grow).
  *   **Step 3 Test:** "Grammar is innate relative to [Environmental Variation] given [Genetic Variation]." **FAIL.** This defines heritability, not innateness of the rule.
  *   **Verdict:** **RESTRICT.** You cannot write "in the genes."
  *   **Replacement Sentence:** "Genetic differences account for 60% of the variation in grammatical ability among seven-year-olds, suggesting a strong biological predisposition."
  *   **Defensible Line:** "Heritability measures variance in this population, not the genetic encoding of grammatical rules."

  #### 3. The Amazonian Field Report (Universals vs. Capacity)
  *   **Input:** One language, no embedded relative clauses.
  *   **Claim:** "Recursion isn't innate."
  *   **Step 1 Check:** Claims "Domain-Specific Knowledge" (Recursion) is absent.
  *   **Step 2 Check:** Absence of usage ≠ absence of capacity. Could be cultural suppression or alternative structures.
  *   **Step 3 Test:** "Recursion is innate relative to [Universal Grammar] given [Human Cognition]." **FAIL.** One counter-example challenges universality, not necessarily the innate capacity.
  *   **Verdict:** **ALLOW WITH MODIFICATION.** You can challenge the universal claim, not the innate capacity.
  *   **Replacement Sentence:** "The absence of embedded clauses in this language challenges the claim that recursion is a universally utilized feature of human grammar."
  *   **Defensible Line:** "We are reporting on linguistic usage, not ruling out the cognitive capacity for recursion."

  ---

  ### Where This Procedure Misfires

  1.  **The "Black Box" Problem:** In ML papers, authors often cannot or will not quantify the "inductive biases" of their architecture. Step 2 will return "unknown," forcing you to kill the story or hedge heavily. On a tight deadline, you might skip this and publish the press release claim, which is where you get burned.
  2.  **Multimodal Input:** Child input isn't just words; it's gaze, gesture, and social intent. ML models rarely match this. The procedure tells you to stop, but editors want the "AI learns like a kid!" headline. You will face pressure to ignore the input mismatch.
  3.  **Heritability Nuance:** Distinguishing "genetic variance" from "genetic encoding" is dry copy. Your editor may force you to sharpen "genetic differences account for variation" back to "genes influence grammar," which reintroduces the error.
  4.  **False Negatives:** Sometimes a model *does* match child input closely (e.g., small datasets, specific architectures). This procedure might flag it as a Stop because quantifying child input is hard, causing you to miss a legitimate breakthrough. When in doubt, ask for the data stats explicitly.
