      *   *Institutional vs. Criminal:* She insists on *both*. You need friction in the system, but you must hang the man who pulled the lever.
      *   *Ranking Evil:* She doesn't necessarily say the fanatic is "more" evil, but the banal evildoer is more *dangerous* because they are ubiquitous. The fanatic is recognizable; the bureaucrat is not.
      *   *Historians' Challenge:* If Eichmann was a liar, it refutes the *application* to him, but not the *concept* of banal evil. The concept remains valid for other perpetrators (e.g., Höss).

  6.  **Developing Diagnostics:**
      *   Does the interpretation suggest the perpetrator couldn't help it? (Determinism vs. Responsibility).
      *   Does it confuse "thoughtlessness" with "stupidity"?
