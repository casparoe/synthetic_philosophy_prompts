      *   **Problem:** The "confounding variable" problem. In real-life cases (like the apartment lease example), conversational context and practical stakes often covary, making it hard to distinguish Epistemic Contextualism (EC) from Pragmatic Encroachment (PE).
      *   **Task:** Compare EC and PE focusing on:
          1.  Locus of context-sensitivity (Attributor vs. Subject).
          2.  Predictions in "clean cases" (holding one variable fixed while varying the other).
          3.  Relationship (Rival vs. Special Case).
          4.  Strongest objections to each.
          5.  Genuine divergence points (to ensure the distinction holds for a term paper).

  2.  **Deconstruct the Theories:**

      *   **Epistemic Contextualism (EC):**
          *   *Core Claim:* The semantic content of "knows" varies with the *attributor's* conversational context.
          *   *Mechanism:* Standards for truth of "S knows that p" shift based on what is salient/relevant to the person *saying* "S knows."
          *   *Key Proponents:* Cohen, DeRose, Lewis.
          *   *Stakes:* Stakes matter only insofar as they raise the salience of error possibilities in the *attributor's* context.

      *   **Pragmatic Encroachment (PE) / Interest-Relative Invariantism (IRI):**
          *   *Core Claim:* Whether S knows that p depends (in part) on S's *practical situation* (stakes).
          *   *Mechanism:* Knowledge is not purely epistemic; practical factors encroach on the epistemic status. The semantic content of "knows" is invariant, but the *truth conditions* depend on the subject's stakes.
          *   *Key Proponents:* Stanley, Fantl & McGrath.
          *   *Stakes:* The *subject's* stakes directly affect whether they know.

  3.  **Address the Specific Points:**

      *   **(1) Locus of Sensitivity:**
          *   EC: Attributor's context (the speaker).
          *   PE: Subject's context (the person who allegedly knows).
          *   *Nuance:* This is the crucial distinction. In the user's example, *they* are both the subject and the attributor (self-attribution). This is why it's confusing. I need to highlight the "Third-Person" test cases.

      *   **(2) Clean Cases (Predictions):**
          *   *Case A (Fixed Subject/Stakes, Vary Attributor):* Low stakes for Subject. Attributor 1 (casual) says "S knows." Attributor 2 (skeptical/high stakes context) says "S doesn't know."
              *   EC predicts disagreement in truth value (both can be right).
              *   PE predicts agreement (if Subject's stakes are low, S knows, regardless of Attributor's context).
          *   *Case B (Fixed Attributor, Vary Subject/Stakes):* Attributor context fixed. Subject 1 (low stakes) knows. Subject 2 (high stakes, same evidence) doesn't know.
              *   EC predicts agreement (if Attributor context is fixed, standards are fixed; same evidence = same knowledge status).
              *   PE predicts disagreement (Subject 2's high stakes lower the epistemic position below the threshold).

      *   **(3) Rival or Special Case?**
          *   They are genuine rivals. EC is a semantic thesis about the word "knows." PE is often framed as IRI (Interest-Relative Invariantism), which is semantic invariantism but metaphysical encroachment.
          *   *Crucial distinction:* EC says "knows" is indexical (like "tall"). PE says "knows" is stable, but knowledge itself is sensitive to action.
          *   *Can they coexist?* Technically yes (Contextualist Encroachment), but standard formulations treat them as competing explanations for the *same* data (bank cases, etc.).

      *   **(4) Strongest Objections:**
          *   *EC:* The "Disagreement Problem" (If I say "I know" and you say "You don't," EC says we aren't contradicting. But it feels like we are.) / "Semantic Blindness" (Speakers don't realize the meaning shifts).
