  3.  **Identify Fractures/Disanalogies:**
      *   *Intrinsic vs. Extrinsic:* A smoke alarm's sound is neutral until interpreted. Pain's "ouchiness" feels intrinsic. The analogy assumes badness is an add-on, which is the very point in dispute (begging the question).
      *   *Laughter/Detachment:* In asymbolia, patients don't just ignore the pain; they often find it amusing or strange. A smoke alarm doesn't make you laugh; it just fails to scare you. This suggests a transformation of the *qualia*, not just a disconnection of motivation.
      *   *Unity of Experience:* In normal pain, sensation and unpleasantness are fused. In the analogy, they are modular components wired together. This presupposes modularity.

