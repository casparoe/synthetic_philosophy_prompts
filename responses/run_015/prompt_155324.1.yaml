      *(Check on "Resistance")*: The prompt asks: "Please say where the novel resists the reading." I need to ensure I don't just say "The book agrees with me." I need to find where the book complicates the idea that Stevens's life is purely wasted or that Darlington is purely a villain in a way that simplifies Stevens's tragedy. The resistance might be that Stevens *does* achieve a form of dignity at the end precisely by abandoning the defense.

      *(Check on "Man of His Time")*: The prompt asks to separate the "couldn't know" vs "standards don't reach" arguments. I need to weave this distinction into the paragraphs naturally.

      *(Final Review against constraints)*: Continuous prose only. No formatting tricks.

