answer: |-
  ## Honesty & Limitations Check
  **Read this before you run the game.**

  1.  **Contested Theory:** The "Dark Forest" is not universally accepted game theory. It is a *narrative* solution to the Fermi Paradox. Standard game theory (repeated Prisoner's Dilemma) suggests cooperation *should* emerge over time if communication is possible. Liu Cixin's model assumes a "single-shot" dynamic with extreme uncertainty and no enforcement mechanism. This game simulates *Liu's logic*, not necessarily *reality*.
  2.  **The "Malice" Trap:** Students often think the Dark Forest means "everyone is evil." The theory argues "everyone is *scared*." If your students start shooting just to get kills, the game has failed. The scoring must make shooting painful, so they only shoot out of fear.
  3.  **The "Talk" Problem:** In the real universe, we might be able to verify intent via spectroscopy or long-term observation. In this 80-minute session, information is perfectly opaque. You must explicitly state in the debrief that the game *stacks the deck* against trust to prove the point.
  4.  **Logistics:** 22 players is a heavy load for one GM to resolve secretly. You **need** a spreadsheet open on your laptop to resolve coordinates instantly, or two TAs to help. If you do this on paper, you will run out of time.

  ---

  # Game Title: Axiom Zero

  **Concept:** A simultaneous-action survival game where uncertainty and asymmetric growth rates force preemptive aggression.
  **Players:** 22 Civilizations (Individuals).
  **Time:** 80 Minutes.
  **Goal:** Survive 4 Rounds.
  **Win Condition:** Survival Weighted Scoring (Being alive is worth 10x more than any other points).

  ## 1. Materials
  *   **GM Laptop:** Spreadsheet with 22 hidden coordinates (X: 1-10, Y: 1-10). No two players share a coordinate.
  *   **Player Sheets (22):** List of actions, chat slip, score tracker.
  *   **"Ascendancy" Cards (12 total):** 3 cards marked **EXPLOSION**, 9 marked **NORMAL**. (Shuffled each round).
  *   **Projector:** To display the "Galactic Status" (Number of survivors, number of strikes fired).
  *   **Prize:** One small prize (e.g., a chocolate bar) for the highest *Surviving* score. If everyone dies, no one wins.

  ## 2. Setup (10 Minutes)
  1.  **Secret Coordinates:** As students enter, hand each a slip with a unique coordinate (e.g., Player 1: 3,7). Tell them: *"This is your home system. If anyone writes this coordinate on a Strike Slip, you are dead. Do not show this to anyone."*
  2.  **The Axioms (Read Aloud):**
      *   *Axiom 1:* Survival is the primary need. (If you die, your score is 0).
      *   *Axiom 2:* Civilizations grow, but resources are finite. (Points are limited).
      *   *Rule:* You do not know anyone else's coordinate. You do not know anyone else's capabilities.
  3.  **Distribute Player Sheets:** Explain the 3 Actions.

  ## 3. The Mechanics (The Structural Ratios)

  ### The Actions (Submit secretly each round)
  1.  **HIDE (Grow):**
      *   *Effect:* You gain +10 Tech Points.
      *   *Risk:* None.
      *   *Signal:* No signal emitted.
  2.  **HAIL (Broadcast):**
      *   *Effect:* You gain +0 Points. You submit a 10-word message to the GM.
      *   *Risk:* **Your approximate location is leaked.** The GM announces: *"Civilization [ID] has hailed from Sector [Quadrant]."* (Reduces uncertainty for others).
      *   *Benefit:* Cheap talk. You can say "I am friendly."
  3.  **STRIKE (Fire):**
      *   *Effect:* You submit a Target Coordinate (X,Y).
      *   *Cost:* -20 Points (War is expensive).
      *   *Risk:* **Active Emissions.** If you strike, your *exact* coordinate is revealed to everyone next turn.
      *   *Benefit:* If Target Coordinate matches a player, they are **Eliminated** (Score 0).

  ### The "Tech Explosion" Mechanic (The Core Driver)
  *   At the start of each round, 3 random players receive an **EXPLOSION** card. The other 19 receive **NORMAL**.
  *   **NORMAL:** Can only strike adjacent coordinates (distance of 1 unit). You must guess very closely.
  *   **EXPLOSION:** Can strike *any* coordinate on the board (Long Range).
  *   **Secrecy:** Players keep this card hidden. No one knows who has the long-range capability.
  *   **Rotation:** Cards are collected and reshuffled every round. A "weak" neighbor this round might be a "god" next round.

  ## 4. Turn Timeline (4 Rounds x 10 Minutes = 40 Minutes)
  *   **Min 0-2:** GM distributes Ascendancy Cards (face down).
  *   **Min 2-5:** **Decision Phase.** Players choose Hide, Hail, or Strike.
      *   *Constraint:* If you Hail, you must write a message.
      *   *Constraint:* If you Strike, you pay the cost.
  *   **Min 5-7:** **Communication Phase.** GM collects Hail messages and reads them aloud to the class.
      *   *Example:* "Player 4 says: 'I am peaceful, do not shoot.'"
      *   *Example:* "Player 9 says: 'I will destroy anyone in Quadrant 3.'"
  *   **Min 7-10:** **Resolution Phase.** (GM uses Laptop).
      *   Process Strikes. Check coordinates.
      *   Announce Deaths: *"Civilizations 5, 12, and 18 have been silenced."*
      *   Announce Aggressors: *"Civilization 9 fired a weapon. Their location is now public: 4,5."* (Write this on the board).
      *   Update Survivor Count on Projector.

  ## 5. Scoring & Payoff Table
  *   **Survival Bonus:** 100 Points (Awarded only if alive at end of Round 4).
  *   **Tech Points:** +10 per HIDE action.
  *   **War Cost:** -20 per STRIKE action.
  *   **Elimination:** 0 Points (Game Over).
  *   **The Prize:** Awarded to the *Alive* player with the highest total score.

  **Why this creates the Dark Forest:**
  *   Hiding is safe and profitable (+10).
  *   Striking is expensive (-20) and reveals you.
  *   *However*, if you Hide, and a neighbor gets an **EXPLOSION** card, they can kill you from anywhere. You don't know who has the card.
  *   Therefore, the rational move is to Strike *before* they get the card, or Strike anyone who Hails (because they revealed their location, making them a safe target).
  *   Hailing is structurally suicidal because it reduces the "Chain of Suspicion" for *them*, but not for *you*.

  ## 6. Round 2: The Parameter Flip (15 Minutes)
  *   **Goal:** Show that the Dark Forest is not inevitable, but structural.
  *   **The Change:** **Verifiable Contracts.**
  *   **New Rule:** If two players submit a **JOINT HAIL** (they write each other's ID numbers on their slip), their locations are *verified* by the GM.
  *   **Effect:** If a Verified Pair is struck by a third party, the Attacker is automatically Eliminated (Mutual Defense Pact enforced by "Higher Physics"/GM).
  *   **Prediction:** Alliances will form instantly. The "Chain of Suspicion" is broken by a trusted third party (the GM enforcing the contract).
  *   **Debrief Point:** The Dark Forest holds only when there is no enforcement mechanism for trust.

  ## 7. Debrief Script (15 Minutes)
  *Do not lecture. Ask questions and map their answers to the theory.*

  1.  **The Fear:** "Who fired the first shot? Why?"
      *   *Expected Answer:* "I was scared someone else had the Explosion card."
      *   *Map to:* **Tech Explosion.** The random card represents the unpredictability of technological leaps. You can't wait to see if they become dangerous.
  2.  **The Talk:** "Player X said they were peaceful. Did anyone believe them? Why not?"
      *   *Expected Answer:* "They could be lying to get me to reveal myself."
      *   *Map to:* **Chain of Suspicion.** Even if they are honest *now*, I don't know if they know *I* am honest. And I don't know if they will change their mind next turn.
  3.  **The Silence:** "Who Hid every turn? Did you win?"
      *   *Expected Answer:* "I hid, but I got killed by a random shot."
      *   *Map to:* **Detection vs. Strike Time.** In the game, strikes were instant. In the book, light-speed delay helps. Here, the strike time was faster than the detection time.
  4.  **Round 2 Contrast:** "Why did you ally in Round 2 when you wouldn't in Round 1?"
      *   *Map to:* **Enforcement.** The Dark Forest isn't about hate; it's about the lack of a court system.

  ## 8. Where the Setup Drifts from Theory
  *   **Psychological Uniformity:** The game assumes all 22 students are rational point-maximizers. Liu's theory assumes all *civilizations* share the same survival instinct. In reality, cultures vary.
  *   **Zero-Sum:** The game makes points finite. The universe might not be zero-sum (expansion could create new resources).
  *   **The "GM" God:** In Round 2, *you* enforced the treaty. In the real universe, there is no GM. This highlights why the Dark Forest is so hard to escape.

  ## 9. Predicted Failure Points (And Fixes)
  1.  **The "Griefer" Problem:** One student decides to shoot randomly every turn just to cause chaos.
      *   *Fix:* The -20 point cost usually stops this. If they do it anyway, point out in debrief that "Irrational actors accelerate the forest," but note that rational actors *also* shot due to fear.
  2.  **The "Quiet Winner":** One student Hides all 4 rounds, survives, and wins.
      *   *Response:* This is actually a *success* for the simulation. It proves hiding is the dominant strategy *unless* you fear the Explosion. If they survived, ask the class: "Did you know they were there? No. That is why the forest is dark."
  3.  **GM Bottleneck:** Checking 22 strike coordinates takes too long.
      *   *Fix:* Use a VLOOKUP spreadsheet. Column A: Player ID. Column B: X. Column C: Y. When a strike comes in, type the X,Y. If it matches a row, that player dies.
  4.  **Collusion:** Students talk out of turn.
      *   *Fix:* Explicitly forbid side-talk. "The Universe is silent." If they cheat, note that *real* physics prevents side-channels (light speed), whereas the classroom does not.

  ## 10. Final Honesty Note for the Instructor
  If the class ends with everyone dead, **do not worry.** That is the most powerful teaching moment. It demonstrates the **Nash Equilibrium of Mutual Destruction**.

  If the class ends with everyone Hiding, you have demonstrated **Mutual Assured Destruction (MAD)**.

  The only "bad" outcome is if they all Hail and hold hands in Round 1. If that happens, your "Explosion" mechanic wasn't scary enough. In future runs, increase the number of Explosion cards to 5.

  **The lesson isn't that aliens are monsters. The lesson is that without a way to verify intent faster than a weapon can travel, silence is the only safety.**
