answer: |-
  **Setting**
  Elena is an on-call Site Reliability Engineer at a fintech firm, monitoring a payment processing cluster where latency spikes are caused either by a Database Lock ($H$) or Network Packet Loss ($\neg H$). Based on historical incident data, she assigns a prior probability $P(H) = 0.2$. She can choose to inspect a specific error log ($E$), which is free to access and truthful; a Database Lock produces this log with likelihood $P(E|H) = 0.9$, while Network Loss produces it with likelihood $P(E|\neg H) = 0.3$. Elena knows from her quarterly calibration reviews that she suffers from "diagnostic overshoot": whenever she sees error $E$, she cannot help but anchor on the catastrophic hypothesis, updating her belief to $Q(H|E) = 0.95$ regardless of the base rates, though she updates correctly on $\neg E$. She must decide now whether to look at the log or ignore it and stick with her prior, with the sole goal of minimizing her expected Brier score.

  ***

  ### The Arithmetic of Inaccuracy

  We use the Brier Score, a strictly proper scoring rule defined for a binary hypothesis $H$ as $I(q, H) = (q - 1)^2$ if $H$ is true, and $I(q, H) = q^2$ if $H$ is false, where $q$ is the assigned probability to $H$. The expected inaccuracy is calculated relative to the true probabilities of the world states.

  **1. Option A: Decline Evidence (Keep Prior)**
  Elena maintains her prior $q = 0.2$.
  $$E[I_{\text{prior}}] = P(H)(1 - 0.2)^2 + P(\neg H)(0.2)^2$$
  $$E[I_{\text{prior}}] = 0.2(0.64) + 0.8(0.04) = 0.128 + 0.032 = \mathbf{0.160}$$

  **2. Option B: Look and Conditionalize (The Ideal)**
  First, we calculate the true posteriors via Bayes' rule.
  $P(E) = 0.9(0.2) + 0.3(0.8) = 0.42$.
  $P(H|E) = \frac{0.18}{0.42} \approx 0.429$.
  $P(H|\neg E) = \frac{0.1(0.2)}{0.58} \approx 0.034$.

  Expected Inaccuracy:
  $$E[I_{\text{cond}}] = P(H) \left[ P(E|H)(1-0.429)^2 + P(\neg E|H)(1-0.034)^2 \right] + P(\neg H) \left[ P(E|\neg H)(0.429)^2 + P(\neg E|\neg H)(0.034)^2 \right]$$
  $$E[I_{\text{cond}}] = 0.2 \left[ 0.9(0.326) + 0.1(0.933) \right] + 0.8 \left[ 0.3(0.184) + 0.7(0.001) \right]$$
  $$E[I_{\text{cond}}] = 0.2 [0.387] + 0.8 [0.056] = 0.077 + 0.045 = \mathbf{0.122}$$
  *Result: Looking and conditionalizing improves accuracy (0.122 < 0.160).*

  **3. Option C: Look and Apply Biased Rule (The Reality)**
  Elena's rule: If $E$, set $q = 0.95$. If $\neg E$, set $q = 0.034$ (she updates correctly on negative evidence).
  $$E[I_{\text{biased}}] = P(H) \left[ P(E|H)(1-0.95)^2 + P(\neg E|H)(1-0.034)^2 \right] + P(\neg H) \left[ P(E|\neg H)(0.95)^2 + P(\neg E|\neg H)(0.034)^2 \right]$$
  $$E[I_{\text{biased}}] = 0.2 \left[ 0.9(0.0025) + 0.1(0.933) \right] + 0.8 \left[ 0.3(0.9025) + 0.7(0.001) \right]$$
  $$E[I_{\text{biased}}] = 0.2 [0.096] + 0.8 [0.272] = 0.019 + 0.218 = \mathbf{0.237}$$
  *Result: Looking with her actual bias destroys accuracy (0.237 > 0.160).*

  **Verdict:** For Elena, **Declining** is the rational choice to minimize inaccuracy.

  ***

  ### Breaking the Theorem

  The standard accuracy-first argument (Good's Theorem or Joyce's argument) proceeds in three steps:
  1.  **Partition:** The expected inaccuracy of looking is the weighted average of the expected inaccuracies of the possible posterior beliefs.
  2.  **Minimization:** For any specific piece of evidence $E$, the conditional probability $P(\cdot|E)$ minimizes expected inaccuracy relative to the information contained in $E$.
  3.  **Inequality:** Therefore, the ex-ante expectation of the posterior inaccuracy must be lower than the prior inaccuracy.

  **The Violation:** This case violates **Step 2**. The theorem assumes the agent *will* adopt the belief state that minimizes expected inaccuracy given the new evidence. Elena *knows* she will not do this; she knows she will adopt a belief state ($q=0.95$) that is strictly worse, in expectation, than her prior ($q=0.2$) when $E$ is observed. Because she cannot conditionalize, the mathematical guarantee that "information has non-negative value" dissolves. The inequality $E[I_{\text{post}}] \leq E[I_{\text{prior}}]$ relies on $P_{\text{post}}$ being the minimizer; if $P_{\text{post}}$ is fixed by a flawed function $f(E)$, the inequality can flip.

  ### Features and Bindings

  **The Active Feature:** The disconnect between the *evidential update* (what the evidence warrants) and the *psychological update* (what the agent actually does). The "poison" is the specific combination of a high false-positive rate for the evidence ($P(E|\neg H)=0.3$) and a severe overconfidence bias ($0.95$). The evidence is noisy enough that a rational agent would remain skeptical, but Elena's bias forces certainty.

  **Self-Binding:** If Elena can bind herself the night before to a written procedure (e.g., a script that calculates the posterior for her and displays only the number $0.429$), the case **collapses**. By externalizing the conditionalization, she restores Step 2 of the theorem. Looking + Script yields 0.122 inaccuracy, which beats the Prior (0.160). The counterexample relies entirely on her inability to execute the norm *in the moment*.

  **Uncertainty About Bias:** If Elena is less certain about her bias (e.g., she thinks she *might* overreact but isn't sure by how much), the calculation becomes an expectation over her bias parameters. If there is a sufficient probability that she will update near-correctly, the expected inaccuracy of Looking drops. However, if her credence that she will "panic" (assign 0.95) remains high enough, the verdict stands: ignorance is bliss.

  ### The Accuracy-First Retreat

  An accuracy-first theorist will likely resist calling this a counterexample by retreating to **ideal theory**. They will argue: "The norm 'Look at free evidence' is derived for agents who satisfy the norm 'Conditionalize'. Elena violates the second norm, so the derivation for the first norm does not apply to her. She ought to conditionalize; if she does, looking is good. The fact that she won't is a separate failure."

  **Is this legitimate?** It is logically consistent but practically costly. If accuracy-first epistemology only provides norms for agents who already follow all norms, it ceases to function as **guidance** for non-ideal agents. It tells Elena she *ought* to look, but also that she *ought* to conditionalize. Since she knows she cannot conditionalize, the advice to "Look" leads her to higher inaccuracy. A normative theory that recommends actions which the agent knows will lead to worse outcomes (by the theory's own metric) loses its claim to be action-guiding. The view must either incorporate "second-best" norms for known cognitive limitations or admit it has nothing to say to humans like Elena.

  ### Dashboard Design Implication

  For a dashboard surfacing true, relevant, alarming metrics to an on-call engineer known to overreact: **do not surface the raw metric.** Because the engineer's update rule is known to be biased, presenting the evidence decreases overall system epistemic accuracy. Instead, wrap the metric in a decision-support layer that performs the Bayesian update for them (displaying "Probability of DB Lock: 43%" rather than "Error 504 Detected"), or implement a forced cooldown period that decouples the signal from the immediate belief update.
