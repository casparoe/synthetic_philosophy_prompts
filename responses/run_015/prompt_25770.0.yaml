answer: |-
  Here is a revision procedure designed to diagnose failures of will in fiction. It is built on the philosophical distinction between *akrasia* (weakness of will) and its neighbors, incorporating the economic concept of hyperbolic discounting to test for motivational plausibility.

  ### The Akrasia Audit: A 5-Step Diagnostic Procedure

  Run these questions in order. If the answer to any step is **NO**, the episode is likely *not* genuine akrasia, but one of its neighbors. If the answer is **YES**, proceed to the next step.

  **Step 1: The Root Test (Rules out Fake Intention)**
  *Question:* At the time the resolution was made, did the character intend to act on it, or were they performing the intention for an audience (including their own self-image)?
  *   **Criteria for YES:** You can point to a specific cost the character was willing to pay at the time of resolution (e.g., they turned down a smaller pleasure *then* to secure the larger goal). If they made the resolution when it cost them nothing, the intention never took root.
  *   **If NO:** This is **Case (e)**. The character never actually intended to follow through. The "failure" is actually a revelation of hypocrisy or performativity.

  **Step 2: The Stability Test (Rules out Value Change & Self-Deception)**
  *Question:* At the exact moment of the lapse, does the character still sincerely believe the original course is better, *and* are they admitting this to themselves?
  *   **Criteria for YES:** The character's internal monologue acknowledges, "I know I shouldn't do this, and I know doing this is worse for me." If they think, "Actually, this one time won't count," or "Maybe I was wrong about the goal," the judgment has shifted or been masked.
  *   **If NO:** This is **Case (b)** (Value Change) or **Case (c)** (Self-Deception). If they have convinced themselves the act is now acceptable, it is a change of mind. If they are actively hiding the judgment from themselves to avoid pain, it is self-deception.
  *   **Philosophical Flag:** *The Boundary of Self-Deception.* Philosophers dispute whether you can hold a belief you are actively suppressing. If the character is lying to themselves so well that they feel relief, treat this as Self-Deception, not Akrasia. Akrasia requires the pain of knowing you are wrong.

  **Step 3: The Particulars Test (Rules out Ignorance)**
  *Question:* Does the character recognize that *this specific action* violates *that specific resolution*?
  *   **Criteria for YES:** They see the link between the act and the violation. (e.g., "Drinking this champagne breaks my sobriety.")
  *   **If NO:** This is **Case (d)**. They aren't weak-willed; they are distracted or mistaken about the facts. They thought, "This is non-alcoholic," or "This doesn't count as a real drink."

  **Step 4: The Agency Test (Rules out Compulsion)**
  *Question:* Is there a physically or psychologically coercive force preventing them from choosing otherwise?
  *   **Criteria for YES:** The character could have walked away, thrown the drink out, or left the room without suffering immediate physical incapacitation or extreme psychological disintegration (panic attack, withdrawal seizure).
  *   **If NO:** This is **Case (a)**. If the character feels they *could not* have stopped, you are writing compulsion or addiction, not weakness of will. Akrasia requires the terrifying freedom of being able to stop and choosing not to.
  *   **Philosophical Flag:** *The Boundary of Addiction.* At high levels of dependency, "could have done otherwise" becomes medically dubious. If the character is physically dependent, "akrasia" may be the wrong frame for the tragedy.

  **Step 5: The Gravity Test (Hyperbolic Discounting Check)**
  *Question:* Is there a proximate, visceral reward that "swells" in value as the moment arrives, outweighing the distant, abstract benefit of the resolution?
  *   **Criteria for YES:** The temptation is *now* (taste, social ease, avoiding conflict), while the reward for willpower is *later* (health, integrity, long-term peace). Hyperbolic discounting suggests humans mathematically overvalue the "Now." If the temptation is abstract or also in the future, the lapse feels arbitrary.
  *   **If NO:** The lapse feels **Arbitrary**. Without the "magnetic pull of the Now," the character's failure looks like random sabotage or plot convenience.
  *   **Diagnostic Output:** If Steps 1–4 are YES, but Step 5 is NO, you have genuine akrasia, but it may feel unmotivated to the reader. If Step 5 is YES, the akrasia will feel **Inevitable**.

  ---

  ### Application to Your Draft Characters

  Here is the audit applied to your two cases.

  #### Character 1: The Sober Woman at the Wedding
  *   **Step 1 (Root):** **YES.** 14 months of sobriety proves the intention took root and incurred costs.
  *   **Step 2 (Stability):** **YES.** Prompt states: "She has not revised her judgment that sobriety is better." She knows she is violating it.
  *   **Step 3 (Particulars):** **YES.** Prompt states: "She knows what she is doing."
  *   **Step 4 (Agency):** **YES.** Prompt states: "She could refuse."
  *   **Step 5 (Gravity):** **YES.** The reward (social bonding, taste, celebration) is immediate and visceral. The cost (risk of relapse) is probabilistic and future-dated.
  *   **Classification:** **Paradigmatic Akrasia (Inevitable).**
  *   **Why:** This passes every filter. The hyperbolic discounting element (the wedding "Now" vs. the sober future) provides the psychological pressure that makes the lapse feel earned rather than random. The reader will recognize the math of the temptation: the immediate reward swamps the distant principle.
  *   **Writer's Note:** To maximize the effect, ensure the narrative lingers on the *sensory immediacy* of the champagne (the cold glass, the noise of the toast) to heighten the "Now" value against the abstract "Later" value of sobriety.

  #### Character 2: The Hesitant Husband
  *   **Step 1 (Root):** **YES.** He rehearsed the words; he incurred the emotional cost of preparation.
  *   **Step 2 (Stability):** **MURKY / LIKELY NO.** He tells himself "the moment was not right," but knows "the moment was as right as it was ever going to be." This suggests he is masking his judgment. If he truly believed leaving was the *better judgment* at dinner, he would feel the pain of violating it. Instead, he rationalizes.
  *   **Step 3 (Particulars):** **YES.** He knows silence violates the resolution to speak.
  *   **Step 4 (Agency):** **YES.** He could speak.
  *   **Step 5 (Gravity):** **NO (for the long term).** Hyperbolic discounting explains a spike in temptation at the *moment* of dinner (avoiding the scene). It does not explain staying for *another year*. A year of silence suggests the judgment "I must leave" has degraded or been buried.
  *   **Classification:** **Self-Deception masquerading as Akrasia (with elements of Value Shift).**
  *   **Why:** The Audit flags this because the failure persists too long. Akrasia is typically episodic (a lapse). Inertia over a year suggests the "better judgment" is no longer active. He is not acting against his judgment; he is actively constructing a new judgment ("I cannot leave yet") to protect himself from the pain of the old one.
  *   **The Uncomfortable Flag:** You may want to call this weakness of will. The procedure classifies it as **Self-Deception**.
      *   *Why the procedure says this:* In genuine akrasia, the agent suffers from the contradiction ("I am doing what I hate"). This character seems to be soothing the contradiction ("The timing wasn't right"). By labeling this akrasia, you let the character off the hook for the active work of lying to himself. It is more psychologically complex (and painful) if he is not "weak," but rather *crafting a lie* to survive.
      *   *Revision Implication:* If you want this to be akrasia, you must show him suffering the contradiction daily for that year. If he finds peace in the silence, it is value change or self-deception.

  ---

  ### Limitations: What This Procedure Cannot Do

  As a novelist, you must know where the map ends. This procedure is a philosophical tool, not a psychological MRI.

  **1. It cannot measure Unconscious Motivation.**
  The procedure relies on the character's accessible mental states (what they know, believe, and intend). It cannot diagnose trauma responses, neurodivergent executive dysfunction, or repressed memories that drive behavior outside the character's awareness. If a character freezes due to a triggered trauma response, Step 4 (Agency) might fail, but not because of "compulsion" in the addiction sense. You will need clinical intuition here, not philosophical logic.

  **2. It struggles with "Character Arc" as Value Change.**
  In fiction, a "change of values" (Case b) is often the point of the story. The procedure treats value change as a disqualifier for akrasia. But sometimes, the "failure of will" is actually the first step of a moral transformation (e.g., a soldier refusing an order because their morality has shifted, not because they are weak). The procedure will flag this as "Not Akrasia," which is technically correct, but you must decide if that distinction serves the theme.

  **3. It cannot fix "Arbitrary" Akrasia.**
  If Step 5 (Gravity) fails, the procedure tells you the lapse feels arbitrary. It does not tell you *how* to fix it. You must use your craft to inject the "proximate reward" or the "visceral pull of the Now" to satisfy the hyperbolic discounting requirement.

  **4. The "Murky Boundary" of Addiction.**
  Philosophy has not settled where habit ends and compulsion begins. For a character with 14 months of sobriety, is the brain chemistry altered enough that Step 4 (Agency) is actually a NO? The procedure assumes agency exists unless there is incapacitation. In reality, the craving might feel like incapacitation. You must decide, based on your research and the character's history, where "I couldn't help it" becomes a truth rather than an excuse.

  **5. It requires honest access.**
  This tool only works if you, the author, are willing to be honest about what the character is thinking. It is easy to write "She knew she shouldn't" and assume Step 2 is passed. But if you write her relief too convincingly, you have actually written Self-Deception. The procedure diagnoses the text you write, not the text you imagine.

  ### Summary for Revision
  *   **Character 1** is working. The physics of the temptation (Wedding Now vs. Sobriety Later) support the failure of will.
  *   **Character 2** is likely mislabeled. The duration (one year) and the rationalization ("moment not right") point to Self-Deception. To make it genuine akrasia, you must increase his suffering during the silence, proving the judgment to leave remains active and unconverted. To keep it as is, embrace the Self-Deception: he isn't weak; he is a liar.
