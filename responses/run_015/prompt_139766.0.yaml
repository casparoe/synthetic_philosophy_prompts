      **Is the impossibility of acquiring an attitude solely for a reward unique to intention, or does it reveal a structural constraint on all propositional attitudes?**

      **Why the question is open**
      Current explanations of Kavka's Toxin Puzzle fall into three camps, none of which settle whether the impossibility is unique to intention. The 'reasons-based' account argues that once the reward is secured, there is no reason to drink, making the intention irrational. This relies on intention's link to action and cannot explain impossibility in non-action-guiding attitudes like belief. The 'nature-of-intention' account claims intentions are not the sort of state one can acquire directly at will. However, it remains unclear whether this limitation applies to beliefs or emotions, which are also not typically acquired voluntarily. A third 'control-based' explanation suggests we lack direct voluntary control over intentions. Yet, we also lack direct control over beliefs. Because existing literature treats the Toxin Puzzle as a problem of practical rationality specifically, it leaves open whether the structural barrier is proprietary to intention or generalises to any attitude acquired purely for external reward. Without testing parallel cases, we cannot distinguish between a constraint on practical reasoning and a constraint on attitude acquisition per se.

      **Method and timetable**
      Over twelve weeks, I will employ conceptual analysis via constructed variant cases rather than canvassing intuitions or deriving conclusions from a general theory of intention. Canvassing intuitions is unreliable for determining conceptual possibility, and constructing a full theory is too ambitious for 5,000 words. Instead, I will isolate variables by designing 'Toxin-style' scenarios for belief, hope, and fear. For example, a 'Belief-Toxin' case offers a reward for believing it will rain, regardless of truth. I will analyse whether the impossibility persists when the action-tie is removed but correctness conditions remain.
      Weeks 1–3: Review standard Toxin literature and theories of attitude acquisition.
      Weeks 4–7: Construct and analyse variant cases (Belief, Fear, Hope), isolating properties like correctness conditions and voluntary control.
      Weeks 8–9: Test iteration (intending to intend) to see if higher-order attitudes bypass the constraint.
      Weeks 10–12: Drafting and refining the argument.
      This method allows me to test specific necessary conditions for the impossibility without committing to a comprehensive metaphysics of mind.

      **Possible results**
      The project aims for a determinate classification of which attitudes succumb to the Toxin structure.
      1.  **Universal Impossibility:** If the reward structure blocks acquisition for belief, fear, and intention alike, the puzzle reveals a general constraint on acquiring attitudes for external rewards, unrelated to action or practical reason.
      2.  **Selective Impossibility:** If the block applies only to intention and fear (which involve action-tendencies) but not belief, the constraint is tied to action-guidance or arousal rather than rationality.
      3.  **Correctness Condition Constraint:** If the block applies to belief and intention (which have correctness conditions) but not hope, the constraint concerns truth-aptitude.
      4.  **Iterative Success:** If one can intend to intend where one cannot intend to drink, the constraint is limited to first-order attitudes.
      Each outcome narrows the necessary conditions for the Toxin impossibility, moving beyond the standard practical rationality debate.

      **What would count as failure**
      The primary risk is that the project is too large for a semester. Comparing intention, belief, hope, and fear plus iteration may exceed 5,000 words. If so, I will cut hope and fear, focusing strictly on the intention-belief contrast, as this isolates the action-tie most sharply. A second failure mode is circularity: if the variant cases merely restate the original puzzle in new vocabulary without generating new distinctions, the project adds no value. For instance, if 'believing for a reward' is dismissed simply because belief aims at truth, without explaining why intention doesn't aim at action similarly, the analysis is shallow. Finally, if the cases rely on disputed intuitions that cannot be resolved through argumentation—for example, if respondents genuinely disagree on whether one can believe for a reward—the conclusion will remain indeterminate. Success requires showing that the impossibility is conceptual, not merely psychological, and that the distinction between attitudes explains the variance.

