  # The Taxonomy of Complicity

  This tree is designed to diagnose the *engine* of your character's participation. It forces a distinction between why he started, why he stays, and why he refused the exit. There are seven diagnostic nodes. The final node (Q7) splits every explanation into whether it attempts to remove his moral agency (Exoneration) or preserve it (Accountability).

  Some combinations are marked **EMPTY**. This means the logic contradicts itself (e.g., claiming he acted out of pure sadism but also had no choice). If your draft lands here, you are writing two different books at once.

  ### The Decision Tree

  **Q1: The Offer (The Morning After)**
  *Claim:* When he considered stepping out of the line, did he believe refusing would result in physical harm or death?
  *   **YES:** Go to **Leaf Group A (Perceived Danger)**.
  *   **NO:** He knew he was safe. Go to Q2.

  **Q2: The Offer (The Social Cost)**
  *Claim:* When he considered stepping out, did he believe refusing would result in shame, isolation, or letting down the men beside him?
  *   **YES:** Go to **Leaf Group B (Conformity)**.
  *   **NO:** He didn't care about the men or the shame. Go to Q3.

  **Q3: The Order (The Source)**
  *Claim:* Does he fire because he believes the *person* giving the order has a right to command him, regardless of the order's content?
  *   **YES:** Go to **Leaf Group C (Obedience)**.
  *   **NO:** The person doesn't matter; the structure does. Go to Q4.

  **Q4: The Order (The Function)**
  *Claim:* Does he fire because he views himself as a tool of a larger bureaucracy where moral judgment belongs to the office, not the man?
  *   **YES:** Go to **Leaf Group D (Role/Division of Labor)**.
  *   **NO:** He is not hiding behind structure or men. Go to Q5.

  **Q5: The Gain (The Incentive)**
  *Claim:* Does he continue because he receives a tangible benefit (status, money) or an intangible release (pleasure, anger) from the act?
  *   **YES:** Go to **Leaf Group E (Interest/Vice)**.
  *   **NO:** There is no gain. Go to Q6.

  **Q6: The Time (The Momentum)**
  *Claim:* Is his continuation driven by the weight of what he has already done (sunk cost) or the absence of thought about what he is doing now (habit)?
  *   **SUNK COST (Heavy):** Go to **Leaf Group F (Gradualism)**.
  *   **HABIT (Light):** Go to **Leaf Group G (Banality)**.

  **Q7: The Hook (The Exoneration)**
  *Claim:* Does this explanation imply he *could not* have done otherwise given the circumstances?
  *   **YES (Exoneration):** He was trapped by the mechanism.
  *   **NO (Accountability):** He chose the mechanism.

  ---

  ### The Leaves

  #### Group A: Perceived Danger
  *Constraint Note: This explains the Offer scene best. For the First Shot, it implies coercion.*

  **A1. Danger + Exoneration**
  *   **Awkward Commitment:** You must assert that a reasonable man would have believed the threat was real, even if it wasn't.
  *   **Visible on Page:** His eyes scan for snipers or hostile officers when the offer is made; his hand trembles not from guilt but from adrenaline.
  *   **Phase Coverage:** First / Offer.

  **A2. Danger + Accountability**
  *   **Awkward Commitment:** You must assert he knew the threat was false but used it as an excuse to avoid moral responsibility.
  *   **Visible on Page:** He glances at the officer, sees no threat, looks back at the victims, and raises his rifle anyway.
  *   **Phase Coverage:** Offer (as pretext).
  *   **Status:** **UNSEPARABLE FROM B2.** If he knows he's safe but stays, it's Conformity, not Danger. Mark this leaf as **EMPTY**.

  #### Group B: Conformity
  *Constraint Note: This explains the Offer scene best. The "11 men" detail is crucial here.*

  **B1. Conformity + Exoneration**
  *   **Awkward Commitment:** You must assert that social survival is as binding as physical survival.
  *   **Visible on Page:** He watches the eleven men leave and feels physically ill at the sudden gap in the line; he cannot meet his sergeant's eyes.
  *   **Phase Coverage:** Offer / Continue.

  **B2. Conformity + Accountability**
  *   **Awkward Commitment:** You must assert he valued his reputation more than the victims' lives, knowingly.
  *   **Visible on Page:** He thinks about the card game next week and the teasing; he stays to avoid being the punchline.
  *   **Phase Coverage:** Offer / Continue.

  #### Group C: Obedience (Authority)
  *Constraint Note: This explains the First Shot best.*

  **C1. Obedience + Exoneration**
  *   **Awkward Commitment:** You must assert that the hierarchy dissolves individual will completely.
  *   **Visible on Page:** He hears the command as a physical force; his body moves before his mind processes the target.
  *   **Phase Coverage:** First.

  **C2. Obedience + Accountability**
  *   **Awkward Commitment:** You must assert he respects the rank but retains the capacity to dissent.
  *   **Visible on Page:** He hesitates for a fraction of a second, looks at the officer's insignia, and decides compliance is easier.
  *   **Phase Coverage:** First.

  #### Group D: Role (Division of Labor)
  *Constraint Note: This explains the Continuation best.*

  **D1. Role + Exoneration**
  *   **Awkward Commitment:** You must assert that a job description can override human empathy without moral residue.
  *   **Visible on Page:** He cleans his rifle with the same motion he uses to clean his boots; the killing is administrative paperwork.
  *   **Phase Coverage:** Continue.

  **D2. Role + Accountability**
  *   **Awkward Commitment:** You must assert he uses the "just a job" framing to insulate himself from guilt he knows is there.
  *   **Visible on Page:** He refuses to talk about the victims' names; he refers to them only as "targets" or "counts."
  *   **Phase Coverage:** Continue.

  #### Group E: Interest/Vice
  *Constraint Note: Split between Material (Career) and Emotional (Vice).*

  **E1. Careerism + Accountability**
  *   **Awkward Commitment:** You must assert he is trading lives for promotion or safety back home.
  *   **Visible on Page:** He volunteers for the hardest tasks; he watches the officers to see who is noticing his efficiency.
  *   **Phase Coverage:** Continue.
  *   **Status:** **EMPTY WITH EXONERATION.** You cannot be coerced into careerism.

  **E2. Vice + Accountability**
  *   **Awkward Commitment:** You must assert he enjoys the violence or holds a personal grudge unrelated to orders.
  *   **Visible on Page:** He lingers after the shooting stops; his posture relaxes rather than tenses during the act.
  *   **Phase Coverage:** First / Continue.
  *   **Status:** **EMPTY WITH EXONERATION.** Sadism is a choice, not a constraint.

  #### Group F: Gradualism (Sunk Cost)
  *Constraint Note: This explains the Continuation best.*

  **F1. Gradualism + Exoneration**
  *   **Awkward Commitment:** You must assert that having killed once makes killing twice psychologically inevitable.
  *   **Visible on Page:** He looks at his hands after the first shot and sees them as stained; he thinks stopping now would make the first shot murder.
  *   **Phase Coverage:** Continue.

  **F2. Gradualism + Accountability**
  *   **Awkward Commitment:** You must assert he refuses to admit error because it would destroy his self-image.
  *   **Visible on Page:** He doubles down on brutality when questioned; he argues the victims were dangerous to justify the past.
  *   **Phase Coverage:** Continue.

  #### Group G: Banality
  *Constraint Note: This explains the lack of explanation.*

  **G1. Banality + Exoneration**
  *   **Awkward Commitment:** You must assert that thoughtlessness is a force of nature, not a moral failing.
  *   **Visible on Page:** He hums a tune while loading; he asks a comrade about dinner immediately after firing.
  *   **Phase Coverage:** All Phases.

  **G2. Banality + Accountability**
  *   **Awkward Commitment:** You must assert that choosing not to think is itself a moral crime.
  *   **Visible on Page:** He actively avoids looking at the victims' faces; he shuts down conversation about the operation.
  *   **Phase Coverage:** All Phases.

  ---

  ### Diagnostic Notes for the Writer

  1.  **The "Mushy Middle" Fix:** If your draft feels inconsistent, check which Leaf you are writing in Scene 10 versus Scene 50. If Scene 10 is **C1 (Obedience)** and Scene 50 is **E2 (Vice)**, you have changed his nature without a catalyst. Pick one Leaf and rewrite the scenes to match the "Visible on Page" instruction.
  2.  **The Offer Scene:** Your specific scene (11 men leave, he stays) kills **A1 (Danger)**. If 11 men left safely, the threat was not physical. If he stays, it is **B (Conformity)**, **F (Gradualism)**, or **D (Role)**. Given he thought for "four seconds," **B2 (Conformity/Accountability)** or **F2 (Gradualism/Accountability)** are the strongest candidates for a policeman who is "not a joiner."
  3.  **Empty Combinations:** Do not try to write **E2 + Exoneration** (Sadism but forced) or **A2 + Exoneration** (Fake fear but forced). These break the reader's trust.

  ---

  ### Bonus: The Writing Group Diagnostic (6 Questions)

  Hand this to your readers. Ask them to answer based *only* on what is currently on the page, not what you told them.

  1.  **The Offer:** When the officer said men could step out, did your character believe he would be shot if he stayed? (Yes/No)
  2.  **The Peers:** When the eleven men left, did your character look at them with envy, pity, or contempt? (Envy/Pity/Contempt)
  3.  **The Order:** If the officer had asked him to shoot a comrade instead, would he have hesitated longer? (Yes/No)
  4.  **The Gain:** Does the character seem to enjoy the power, or does he seem tired by the task? (Enjoy/Tired)
  5.  **The Past:** Does he talk about the first shooting as a mistake, a necessity, or not at all? (Mistake/Necessity/Silence)
  6.  **The Mind:** When he fires, is he thinking about the victim, the officer, or nothing? (Victim/Officer/Nothing)

  **Scoring Key:**
  *   Most answers point to **Officer/Nothing/No/Tired/Silence** → You are writing **Banality** or **Role**.
  *   Most answers point to **Peers/Envy/Necessity** → You are writing **Conformity**.
  *   Most answers point to **Victim/Enjoy/Contempt** → You are writing **Vice** or **Ideology**.
  *   If answers are mixed → Your middle is mushy. Pick a lane.
