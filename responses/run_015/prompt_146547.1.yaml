answer: |-
  # SEMINAR HANDOUT: THE CONDITIONAL DECISION TREE

  **Starting Commitments:**
  1.  **The Equation:** Rational credence in "If A then C" should equal $P(C|A)$. (Motivated by conditional bets).
  2.  **Non-Triviality:** Conditionals are not equivalent to material implication or the consequent alone; the language is expressive.

  **Instructions:** Start at the Root. Answer the question based on the concrete case provided. Follow the branch until you reach a Leaf (a philosophical position).

  ---

  ### ROOT: The 3-Card Betting Setup
  **Case:** Three cards face down: King-Red, King-Black, Queen-Red. You draw one.
  **Bet:** You pay $\$x$ now. You win $\$1$ if "If the card is a King, it is Red" is true. You lose $\$1$ if it is false. The bet is void if the card is a Queen.
  **Data:** $P(\text{King}) = 2/3$. $P(\text{Red} | \text{King}) = 1/2$.

  ### NODE 1: The Settlement Question (Truth Conditions)
  **Question:** Before the card is turned over, is there already a fact of the matter that makes your bet a winner or a loser? (i.e., Does the conditional express a proposition that is currently true or false?)

  *   **NO:** There is no fact of the matter until the antecedent is settled. The bet is only evaluable *if* the King turns up.
      *   $\rightarrow$ **LEAF A: The Acceptability View (No-Truth-Conditions)**
      *   *Note:* Conditionals are not propositions; they have assertibility conditions, not truth conditions. $P(\text{If } A \text{ then } C)$ is not a probability of a truth, but a measure of acceptability.

  *   **YES:** There is a fact. The conditional is a proposition with truth conditions (e.g., closest A-world is a C-world).
      *   $\rightarrow$ Go to **NODE 2**.

  ### NODE 2: The Fair Price Question (The Equation)
  **Case:** Same 3-Card Setup.
  **Question:** Is the *only* rational price for the bet $\$0.50$ (matching $P(\text{Red}|\text{King})$)? Or could a rational agent price it differently (e.g., based on the similarity of worlds) without being irrational?

  *   **NO (Price can differ):** The Equation is a useful heuristic or pragmatic rule, but not a strict constraint on rational credence in the proposition.
      *   $\rightarrow$ **LEAF B: Pragmatic Truth-Conditionalist**
      *   *Note:* Keeps truth conditions (e.g., Stalnaker), but explains the pull of the Equation via pragmatics or approximate reasoning. Denies the Equation is a strict synchronic constraint.

  *   **YES (Price must match):** Rationality requires $P(\text{If } A \text{ then } C) = P(C|A)$.
      *   $\rightarrow$ Go to **NODE 3**.

  ### NODE 3: The Nested Bet Question (Iteration)
  **Case:** A fair coin is tossed.
  **Bet:** You bet on: "If the coin landed Heads, then (If I place a bet on Red, I win)."
  **Question:** Can this nested sentence be the object of a bet (i.e., does it have a determinate probability)?

  *   **NO:** The language forbids embedding conditionals in the scope of other conditionals (or probabilities).
      *   $\rightarrow$ **LEAF C: Restricted Language**
      *   *Note:* Blocks Lewis's triviality proof by denying the logic allows iteration. The Equation holds, but only for flat conditionals.

  *   **YES:** Nested conditionals are meaningful and probabilistically evaluable.
      *   $\rightarrow$ Go to **NODE 4**.

  ### NODE 4: The Peeked Card Question (Zero Antecedent / Update)
  **Case:** Back to the 3-Card Setup. You peek and see the card is the **Queen-Red**. So $P(\text{King}) = 0$.
  **Question:** What is the probability of "If the card is a King, it is Red"?
  *(Sub-question: When you learn the card is a King, do you update by standard conditionalization or by shifting probability mass to the nearest King-world?)*

  *   **IMAGING (Shift Mass):** $P(\text{If } K \text{ then } R)$ is defined even when $P(K)=0$. You update by "imaging" (moving probability from $\neg K$ worlds to nearest $K$ worlds), not standard conditionalization.
      *   $\rightarrow$ **LEAF D: The Imaging View**
      *   *Note:* Keeps Truth Conditions + Equation + Iteration. Avoids triviality by rejecting standard conditionalization as the update rule for conditionals.

  *   **STANDARD (Undefined/Collapses):** Standard conditionalization applies. If $P(A)=0$, $P(C|A)$ is undefined or the conditional probability constraint drops out.
      *   $\rightarrow$ Go to **NODE 5**.

  ### NODE 5: The Tracking Question (Double Bookkeeping)
  **Case:** You maintain Truth Conditions (Node 1) and The Equation (Node 2).
  **Question:** Does the probability in the Equation ($P(C|A)$) measure the likelihood that the **Truth Condition** (from Node 1) obtains?
  *(i.e., Is the "If" proposition's probability determined by its truth conditions?)*

  *   **NO (Double Bookkeeping):** The conditional has truth conditions (semantics), but the Equation governs a separate norm of *supposition* or *acceptance* (epistemology). They do not have to agree.
      *   $\rightarrow$ **LEAF E: Double Bookkeeping**
      *   *Note:* Semantics = Truth Conditional. Epistemology = Equation. The probability is not *of* the truth condition.

  *   **YES (Tracking):** The probability of the conditional *is* the probability of its truth condition.
      *   $\rightarrow$ **LEAF F: The Trivialist (Bite the Bullet)**
      *   *Note:* You accept Lewis's conclusion. If the language is non-trivial, you are irrational. If you are rational, the language is trivial (conditionals = material implication or consequents).

  ---

  ### MAP OF THE LOGICAL SPACE

  **1. Indistinguishable Leaves**
  *   **Leaf A (Acceptability)** and **Leaf E (Double Bookkeeping)** are probabilistically indistinguishable.
      *   *Why:* In both cases, $P(\text{If } A \text{ then } C) = P(C|A)$, but this value does not represent the probability of a truth-condition. Leaf E posits "idle" truth conditions that do no probabilistic work. You cannot separate these views via betting behavior alone.

  **2. The Empty Cell**
  *   **Location:** The path Yes (Node 1) $\rightarrow$ Yes (Node 2) $\rightarrow$ Yes (Node 3) $\rightarrow$ Standard (Node 4) $\rightarrow$ Yes (Node 5) $\rightarrow$ **Non-Trivial**.
      *   *Status:* **Empty (Incoherent).**
      *   *Why:* This is Lewis's Triviality Result. You cannot hold Truth Conditions + The Equation + Iteration + Standard Update + Tracking and maintain Non-Triviality. One commitment must be dropped to occupy Leaf F.

  **3. Placement of Requested Views**
  *   **Double Bookkeeping:** Earns its own leaf (Leaf E). It does not collapse into Leaf A because it maintains a semantic commitment to truth conditions (selection functions), whereas Leaf A denies them entirely. However, see "Indistinguishable Leaves" above.
  *   **Imaging View:** Earns its own leaf (Leaf D). It does not collapse into Leaf B (Pragmatic) because it maintains the Equation as a strict constraint, merely altering the update mechanism to preserve it.

  **4. Summary of Leaves**
  *   **Leaf A:** No-Truth-Conditions / Acceptability (Adams).
  *   **Leaf B:** Truth-Conditional + Give Up Equation (Stalnaker).
  *   **Leaf C:** Restricted Class / No Iteration.
  *   **Leaf D:** Imaging / Update Revision.
