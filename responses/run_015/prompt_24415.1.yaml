  **Credence: 35%**

  This number represents the estimated probability that the expressivist research program (encompassing quasi-realism, plan-expressivism, and hybrid views) successfully resolves the Frege-Geach problem while maintaining a hard distinction from robust realism.

  ### Decomposition of Uncertainty
  The 65% doubt is distributed across your three specified constraints as follows:

  **1. Embedded Contexts Without Truth Conditions (40% of the risk)**
  *   **The Burden:** Can a logic of attitudes/plans replicate the validity of modus ponens in conditionals without invoking propositions?
  *   **Assessment:** Technical solutions exist (e.g., Schroeder’s *Being For*, Blackburn’s logic of attitudes). They are formally coherent but often feel like syntactic mirroring rather than genuine semantic explanation. The risk is that the semantics remains "ad-hoc" because it is engineered solely to save the logic rather than emerging from the core expressivist thesis.
  *   **Weight:** High. If the embedded semantics requires a dual-track system (one for asserted, one for unasserted), it violates the "non-ad-hoc" constraint.

  **2. Substantive Disagreement (20% of the risk)**
  *   **The Burden:** Can the view explain why moral disagreement feels like a clash of beliefs rather than a clash of tastes?
  *   **Assessment:** Expressivism handles this relatively well. By framing moral states as "plans" or "norm-acceptances" that have world-to-mind direction of fit, the *feel* of objectivity is preserved without the ontology. This is the strongest pillar of modern expressivism.
  *   **Weight:** Low. Most contemporary expressivists have plausible error-theoretic or pragmatic explanations for the phenomenology of disagreement.

  **3. Collapse into Quasi-Realism/Realism (40% of the risk)**
  *   **The Burden:** Does the solution work *only* by granting moral sentences truth-aptitude in everything but name?
  *   **Assessment:** This is the critical failure point. If the expressivist semantics grants moral sentences truth conditions (even deflated ones) to solve Frege-Geach, it risks violating your constraint ("without making moral sentences truth-apt in the ordinary sense"). If quasi-realism makes moral sentences behave exactly like realist sentences, the distinction becomes verbal.
  *   **Weight:** High. Success here requires walking a tightrope: granting enough logical structure to solve Frege-Geach without granting enough ontological weight to satisfy realism.

  ### The Mover
  **The Collapse Question.**

  My credence would move most on **whether quasi-realism is metaphysically distinct from realism**.
  *   **If Distinct:** If it can be proven that "deflated truth-aptitude" is ontologically cheaper than "robust truth-aptitude" in a way that matters for the Frege-Geach solution, my credence jumps to **60%**. The technical machinery is already strong enough to support the weight if the metaphysical cost is low.
  *   **If Indistinguishable:** If the solution requires truth conditions that are functionally identical to realist truth conditions, my credence drops to **5%**. At that point, expressivism has solved Frege-Geach only by ceasing to be expressivism.

  **Summary:** The technical semantics are likely solvable (raising the floor), but the metaphysical cost of that solution threatens to invalidate the expressivist label (capping the ceiling).
