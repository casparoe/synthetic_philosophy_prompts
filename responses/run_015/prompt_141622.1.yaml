          *   *Nuance:* They cause other mental events sometimes (mental-to-mental causation).
      *   **Claim 2: The Causal Chain ("I'm conscious" not caused by experience):**
          *   *Epiphenomenalist View:* Accepts. The *physical* vehicle of speech is caused by prior physical states.
          *   *Nuance:* The experience is a *symptom* of the cause, not the cause itself.
      *   **Claim 3: The Gettier/Knowledge Worry:**
