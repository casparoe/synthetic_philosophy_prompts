  *(Refining the Zombie Objection)*: The host says: Zombie twin says same thing -> belief doesn't track experience.
  Epiphenomenalist reply: In the actual world, the law holds. The belief tracks the brain state, and the brain state nomologically necessitates the experience. Therefore, the belief tracks the experience *in the actual world*. The zombie is a metaphysical possibility, not a nomological one (given the actual laws). The host is demanding metaphysical tracking for knowledge, which is too high a bar. Most knowledge doesn't require metaphysical necessity, just nomological reliability. This is a key point to make.

