          *   *The Twist:* The zombie argument suggests the mechanism isn't sensitive to the *truth* (experience), only the physical state.
          *   *Verdict:* It's more of a "reliabilist" challenge than classic Gettier. It attacks the *connection* between truth and belief.
      *   **Claim 4: Self-Stultification (Asserting for reasons):**
          *   *Analysis:* Distinct from knowledge. This is about rational agency. If my thoughts are determined by physics, am I reasoning?
          *   *Epiphenomenalist Reply:* Reasoning is a physical process. The experience accompanies it.
          *   *Verdict:* This is a stronger worry than Gettier. It threatens the normative force of the argument itself.
      *   **Claim 5: The Common Cause & Zombie Twin:**
