answer: |-
  "If the isotopes show what you say they show," Marcus said, "twelve sites where mixed economies collapsed back into foraging, and the skeletons show reduced enamel hypoplasia..."

  "Exactly," Elena said. "Less spinal stress. Higher protein intake. That's revealed preference. They voted with their feet."

  "They voted with their feet in a world already dominated by agriculture. That's the variable you're holding constant."

  "I'm holding human physiology constant. If the body thrives better without the plow, the plow is a biological tax."

  "It's a demographic tax. The first communities didn't revert because there was no outside. You're judging the lock-in by the keys made after the door welded shut."

  "But if the door welded shut onto a burning building, the lack of keys doesn't make the fire preferable."

  "It makes 'mistake' the wrong noun. A mistake implies a correct alternative was accessible at the moment of decision."

  "I'm not talking about the moment of decision. I'm talking about the trajectory. If the endpoint is reversible and the reversal yields health, then the intermediate state was a deficit."

  "Only if you value individual health over population density."

  "I do."

  "Then you're not arguing archaeology anymore. You're arguing ethics."

  "And you're arguing mechanics. If I show you the machine breaks the operator, does it matter if the operator built it themselves?"

  "It matters if you call it a design flaw versus an operational hazard."

  "Fine. Say it's a hazard. But if later operators walk away from the machine when they can, doesn't that validate the complaint of the first ones?"

  "It validates the complaint, not the counterfactual. The first farmers couldn't walk away. Their neighbors would have eaten them, or their own children would have starved. The reversion cases you're proposing happen centuries later, when surplus exists to support a choice. That's not the Neolithic condition."

  "So we agree the welfare loss is real."

  Marcus sighed. "I agree the welfare loss is real. I disagree that labeling it a mistake helps us understand the mechanism. It suggests a volition that wasn't there. It turns a systemic ratchet into a moral failing."

  "But it helps us understand the cost."

  "Conceded. If the data shows reversion correlates with health, then the agricultural steady-state is suboptimal for the individual. I can accept that."

  "And I'll concede this," Elena said. "If the reversion only happens after borders are drawn and granaries exist, then the first transition wasn't a mistake. It was a trap."

  "A trap implies a trapper."

  "A trap implies you can't leave."

  "Fair. But your hypothetical evidence still doesn't tell us what the first farmer felt. It tells us what their great-grandchildren wished they'd felt."

  "Which is all we ever have. We're reading bones, not minds."

  "Then maybe the label doesn't matter. Just the cost."

  "Just the cost. But don't confuse the bill with the choice."

  "If I'm looking at a lease," Elena said, "knowing the building is on fire matters more than knowing who lit the match."

  "Then don't call it a mistake. Call it a price. You can decide whether to pay it without rewriting the history of the architecture."

  "Fine. A price."

  "And make sure you're counting your own calories, not just the Neolithic ones."

  "Deal."
