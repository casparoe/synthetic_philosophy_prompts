      *   *Newman Problem:* If structure is just logical/mathematical relations, any set of objects can be mapped to any structure given enough cardinality. ESR struggles here because it assumes *some* nature to the relata but refuses to specify it.

  4.  **Analyze Ontic Structural Realism (OSR):**
      *   *Core Claim:* Structure is not just what we know; it is *what there is*. There are no "things" underlying the relations. Relations are ontologically prior (or exhaustive).
