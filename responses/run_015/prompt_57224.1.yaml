answer: |-
  **Scenario**

  The work is *The Steward's Table* by the fictitious Dutch master Cornelis Vane (c. 1650), celebrated specifically for the 'architectonic rigour' of its underpainting—the precise, hand-rendered monochrome structure visible beneath the glazes that gives the objects their weight. A modern forgery emerges, perceptually indistinguishable from the original to the naked eye and under microscopy regarding surface topology and pigment composition; the forger, a classically trained technician, replicated the brushwork using hand-ground oils and period brushes to ensure the rheology of the paint matched the seventeenth-century original. During the investigation, infrared reflectography and cross-section analysis revealed that Vane's original utilised a *cartoon transfer* method: the precise monochrome structure was not painted but transferred via oil medium from a pre-prepared engraving, over which he applied the colour glazes. The forger, aware of this revelation, had deliberately painted the understructure freehand to prove mastery, matching the transferred lines by eye.

  Both facts are now public: the original relies on a mechanical transfer for its celebrated rigour, while the forgery achieves the identical visual result through manual dexterity. The perceptual qualities—the lustre, the line, the depth—are identical, as the forger successfully mimicked the visual effect of the transfer using brushwork. The difference lies entirely in the history of production: the original's 'rigour' is a product of mechanical reproduction assisted by hand-finishing, whereas the forgery's 'rigour' is a product of unaided manual execution. The investigation into the forgery necessitated the technical analysis that exposed the original's shortcut, meaning both histories are equally authenticated and known.

  **Analysis**

  (i) The Perceptualist verdict is indifference. Since the commitment is that only observable properties bear on aesthetic value, and the objects are perceptually matched in every relevant respect (colour, line, surface texture), there is no ground for preference. The history is invisible; therefore, the value is identical.

  (ii) The Historicist verdict ranks the forgery higher on the dimension of 'architectonic rigour'. This view holds that aesthetic properties are category-dependent, and categories are fixed by the history of making. The celebrated quality is properly categorised as 'hand-rendered structural precision'. The original fails to belong to this category—it is 'mechanically transferred structure'. The forgery succeeds in belonging to the correct category. Thus, on the specific dimension for which the work is famous, the forgery instantiates the property genuinely, while the original only simulates it.

  (iii) The Achievement view ranks the forgery higher on the same dimension. Value is derived from the difficulty overcome in production. Transferring an engraving via oil medium is a technically simple procedure requiring minimal skill compared to painting complex perspectival lines freehand. The forger overcame a significant obstacle (manual precision) to achieve the result; the original artist circumvented that obstacle. Therefore, the achievement value of the forgery exceeds that of the original regarding the celebrated quality.

  The single feature doing the work is the **discrepancy between the attributed method and the actual method of the original**. The case relies on the original failing to meet the implicit technical conditions of the virtue it celebrates. If you pull this out—assuming the original was indeed hand-painted—the case collapses immediately into the standard narrative: the forgery becomes derivative and parasitic, lacking the achievement of conception and execution, while the original retains both. The forgery's superiority is entirely contingent on the original's 'cheat'.

  The strongest defence of the original is the **Priority of Conception**: Vane designed the image, composed the light, and chose the subject; the forger merely replicated a finished vision. However, this does not rescue position (ii). The Historicist view is concerned with how the *properties* are fixed, not who dreamed them up. Shifting the defence to conception changes the subject from 'technical virtue' (the celebrated dimension) to 'creative genius'. It concedes that on the specific dimension of *making* the rigour, the forgery is superior, but argues that *design* outweighs *execution*. This saves the original's overall status but admits the forgery's superiority on the specific technical ground in question.
