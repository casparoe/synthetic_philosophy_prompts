answer: |-
  **PHD COMPREHENSIVE EXAMINATION — ETHICS TRACK**
  **Time Allowed: 90 Minutes**
  **Examiner: Dr. Aris Thorne**

  **Question 1**
  Kwame Anthony Appiah argues that moral revolutons (e.g., the end of dueling, Atlantic slavery) were driven less by rational argument or economic interest than by shifts in honor codes—what became socially unthinkable. Bernard Williams complicates this by suggesting integrity systems are opaque to those inside them. 

  Consider the concept of **Shadow Honor**: the hypothesis that the prestige structure of dueling did not vanish but migrated into modern corporate risk-taking culture (e.g., CEO liability, high-stakes trading bonuses as status markers). 

  Write an essay addressing the following: If Shadow Honor is valid, did the moral norm against dueling truly die, or did it merely change costume? Evaluate whether Appiah's framework allows for this kind of structural continuity, or if 'Shadow Honor' suggests the moral revolution was incomplete. 

  *(Do not include bibliographies or citations. Write for clarity and argumentative force.)*

  ***

  **MODEL ANSWER (DRAFT KEY)**

  Appiah's central thesis in *The Honor Code* is that moral change happens when honor codes shift, making previous practices shameful rather than just wrong. He uses the decline of dueling as a prime example: it wasn't outlawed effectively until it became socially suicidal for a gentleman to participate. Rational argument existed for centuries prior, but it lacked teeth without the honor shift. However, if we accept the premise of Shadow Honor, Appiah's narrative of moral progress requires significant revision. Shadow Honor posits that the underlying prestige structure of the duel—the risk-of-life for status—did not disappear but migrated into the corporate sphere.

  If Shadow Honor is accurate, the moral norm against dueling did not die; it changed costume. In the 18th century, status was gained by risking physical death on the field of honor. In the 21st century, status is gained by risking economic death (and the livelihoods of thousands) in the boardroom. The mechanism remains identical: high risk yields high prestige. The 'moral revolution' against violence was merely a displacement of violence from the bodily to the structural. A CEO leveraging a company into insolvency to secure a bonus is engaging in a form of symbolic dueling. They are risking collateral damage for personal standing within their peer group.

  Appiah's framework struggles here because it relies on the notion of moral progress as a linear elimination of harmful practices. He argues honor can be harnessed for good. But Shadow Honor suggests honor is parasitic; it finds a new host when the old one is killed. If the prestige structure remains intact, the moral revolution is superficial. The students of honor simply learned to stop using pistols and started using derivatives. The social script—risk everything to prove you are elite—is unchanged.

  Therefore, the norm didn't die. It became abstract. Appiah might argue that because physical violence decreased, the moral change is real. But a Shadow Honor analysis counters that the *logic* of the honor code persists. The moral revolution was incomplete because it targeted the symptom (violence) rather than the disease (prestige via risk). To claim a true moral revolution occurred, one would need to show the prestige structure itself collapsed, not just relocated. Since corporate risk-taking is still revered as heroic rather than shameful, the honor code of the duel is alive and well, hiding in plain sight within quarterly earnings reports. The costume changed from silk to suits, but the body underneath is the same.

  ***

  **MARKING SCHEME (Total 25)**

  **1. Thesis & Position (5 pts)**
  *   **A (5):** Clearly states whether the norm died or migrated. Takes a definitive stance on the "costume change" metaphor.
  *   **B (3-4):** Hedges. Says "both sides have points" without committing to the Shadow Honor implication.
  *   **C (0-2):** No clear thesis. Summarizes prompt only.

  **2. Engagement with Appiah/Williams (5 pts)**
  *   **A (5):** Uses Appiah to set up the counter-argument. Understands honor vs. reason distinction.
  *   **B (3-4):** Summarizes Appiah correctly but doesn't use him as a foil for Shadow Honor.
  *   **C (0-2):** Gets Appiah wrong (e.g., claims he argued for economic determinism).

  **3. Application of 'Shadow Honor' (10 pts)**
  *   **A (9-10):** Treats Shadow Honor as structural isomorphism. Links duel risk to corporate risk explicitly. Argues prestige is the constant variable.
  *   **B (6-8):** Treats Shadow Honor as a mere metaphor. Says corporate risk is "like" dueling but misses the *prestige structure* argument.
  *   **C (0-5):** Ignores Shadow Honor or defines it incorrectly as "secret shame."

  **4. Critical Analysis & Clarity (5 pts)**
  *   **A (5):** Explains *why* the revolution is incomplete. Prose is tight.
  *   **B (3-4):** Descriptive rather than analytical. Some clunky phrasing.
  *   **C (0-2):** Incoherent or fails to answer the specific prompt question.

  **Common Mistakes that Cost Marks:**
  *   **-3 pts:** Including citations/bibliography (against instructions).
  *   **-5 pts:** Arguing that dueling ended because it was illegal (misses the honor point).
  *   **-2 pts:** Ignoring the "costume" metaphor in the conclusion.

  *Note to Graders: If they don't wrestle with the migration of prestige, cap at 18/25 (B).*
