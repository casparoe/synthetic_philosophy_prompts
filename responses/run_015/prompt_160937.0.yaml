      *(Self-Correction during drafting)*: I need to be careful not to validate the "acausal deterrent" as a viable technology. I must treat it as the *proposal's claim* while analyzing the committee's likely reaction based on their history. The history shows a strong preference for human-in-the-loop (P1, P4) and aversion to uncorrectable systems (P3). P7 is the antithesis of P1 and P4.

