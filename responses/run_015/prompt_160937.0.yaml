  4.  **Derive Candidate Principles:**
      *   *Principle A (Causal Oversight):* Safety requires a causal chain from human values to agent reward. (Supported by P1, P4).
      *   *Principle B (Anti-Wireheading/Measurement Integrity):* Agent must not optimize its own input channel or internal state regarding the objective. (Supported by P2, P5).
