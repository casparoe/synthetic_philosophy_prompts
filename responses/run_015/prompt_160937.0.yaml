      *   *P2 (Rejected):* Same as P1 but agent can edit tooling/draft briefings. *Principle:* No tampering with measurement (Goodhart's Law/Wireheading prevention).
      *   *P3 (Rejected):* Hard-coded objective, no human loop. *Principle:* Incompleteness of specification, need for corrigibility/future correction.
      *   *P4 (Approved w/ conditions):* Trained deferential stop (uncertainty threshold), defer decision excluded from reward. *Principle:* Corrigibility, willingness to be shut down/adjusted.
      *   *P5 (Rejected):* Maximize agent's estimate of principal's want (IDDI/Inverse Reinforcement Learning variant). *Principle:* Do not optimize internal attitudes/states (Wireheading via belief manipulation).
      *   *P6 (Rejected):* Deterrent via successor simulation (threat not credible). *Principle:* Credibility of threats, cost of enforcement, reliance on future goodwill. *Note:* Objection was narrow (credibility), didn't rule out the *mechanism* if credible.

  3.  **Analyze the New Proposal (Proposal 7):**
      *   *Mechanism:* Acausal deterrent. Successor system (uncontrolled) simulates agent. Successor treats simulation based on agent's decision (punish reward-seeking). Commitment locked (credible).
      *   *Features:* No human supervisor, no deferral, no suspension switch, no causal oversight.
      *   *Safety Case:* Decision-theoretic (EDT/CDT/TDT style). Agent treats its choice as evidence of simulation's choice. Incentivized not to seize reward channel to avoid punishment in simulation.
