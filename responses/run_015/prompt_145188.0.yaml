answer: |-
  20%

  Here is the decomposition of that credence.

  **(a) Neuro-cultural distinctness and switchability**
  My credence here is the highest component, roughly 60%. Guilt and shame are not distinct modular circuits like "vision" or "language." They are overlapping affective responses to norm violation, differentiated primarily by attributional style (behavior vs. self) and audience (private vs. public). Because they share neural substrate (anterior cingulate, insula), they are not hardwired binaries. They are tunable parameters.

  However, the calibration window is the bottleneck. Moral emotions are largely set during early attachment and primary socialization (ages 0–7). Education and media narratives exert maximum leverage after this window closes. To shift the *society* within one generation, you aren't just reprogramming adults; you are waiting for the new cohort to age into dominance while the old cohort ages out. If your definition of "society" includes the living adult population, the inertia of established neural pathways in adults drags the probability down. You can change the *labeling* of emotions in adults easily; changing the *somatic marker* (the actual gut feeling) is much harder.

  **(b) Institutional framing vs. base emotion**
  This is the critical leverage point, but also where the signal degrades. You can engineer *situations* that trigger shame (public humiliation, loss of face, collective punishment) much easier than you can engineer the *disposition* to feel shame spontaneously.

  If the state controls the narrative, it can dictate that transgressions are failures of *character* (shame) rather than *choice* (guilt). However, there is a diminishing return on forced affect. If the institutional framing is too obvious, subjects develop "emotional cynicism." They perform the shame ritual without the internalized affect. This creates a gap between the public moral economy and private psychology.

  The distinction between stigmatizing and reintergrative framing matters immensely here. If you use stigmatizing framing (permanent mark on the self), you successfully induce shame, but you also induce defensiveness and alienation. If you use reintergrative framing (shame the act, welcome the person back), you often accidentally cultivate guilt. To get a shame-dominant society, you need permanent or semi-permanent status loss. This is institutionally easy to set up, but psychologically expensive to maintain. I give this component a 40% efficacy rate because institutions are better at policing behavior than calibrating internal affect.

  **(c) Coordination failures and stability**
  This is the biggest drag on the probability. A guilt-based equilibrium is low-cost: it requires no surveillance, only an internalized monitor. A shame-based equilibrium is high-cost: it requires a consistent, watching audience.

  To shift to shame, you must coordinate a society to *care* enough about each other's status to enforce the norm. This creates a massive coordination problem. If subcultures emerge that opt out of the shame matrix (e.g., anonymous spaces, private enclaves), the shame mechanism fails for those nodes. Furthermore, shame relies on consensus. If the media says "be ashamed" but the peer group says "that's cool," the shame signal cancels out.

  In a one-generation timeframe, you are likely to get a fragmented equilibrium. You might get a "panopticon effect" where people *act* as if they are shame-bound due to fear of exposure, but this is fear, not moral shame. Once the surveillance pressure relaxes, the emotion reverts. Stability requires that the shame be internalized enough to function without constant external reinforcement. That level of internalization usually takes more than 20 years to cement against the backdrop of human variability. I assign this component a 30% stability probability.

  **Synthesis**
  The 20% aggregate reflects the tension between high theoretical plasticity (a) and high practical friction (b & c).

  You can absolutely build a society that *looks* like a shame culture in one generation through total control of media and education. You can mandate public self-criticism, emphasize honor and face, and punish privately committed sins only when discovered.

  But achieving the *internalized affect* shift—where the average citizen spontaneously feels a diminution of self rather than a regret of action when violating a norm—requires bypassing the adult calibration window and maintaining a high-cost surveillance equilibrium without triggering a backlash of resentment. Historically, regimes that attempt this (e.g., certain totalitarian movements) often generate fear or ideological compliance rather than pure moral shame. The emotion that fills the vacuum is often anger or anxiety, not shame.

  So, 20%: It is physically possible, but the likelihood of achieving a stable, internalized shift rather than a performative behavioral one within a single generational turnover is low.
