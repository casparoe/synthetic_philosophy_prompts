answer: |-
  Your grasp of the technical machinery here is sharp, and you are right to insist on keeping Harsanyi's Aggregation Theorem distinct from the Veil of Ignorance argument that supplies the equal weights. It is a common conflation in political philosophy to treat them as a single block, but as you note, the theorem itself is strictly conditional: if individual preferences satisfy the von Neumann-Morgenstern axioms and the social ordering satisfies Pareto efficiency, then social welfare must be a linear combination of individual utilities. The weights in that sum are arbitrary until you introduce the normative premise of the veil, where an impartial observer assumes an equiprobable chance of being any person in society. Even then, you correctly identify the hidden heavy lifting required to make those weights equal: you must normalize the utility scales across persons. vNM utilities are unique only up to positive affine transformations, meaning we can shift the zero point and stretch the unit for each person independently. To sum them with equal weights, you must assume not just cardinal measurability but interpersonal comparability, presupposing that a unit of utility for the blissful citizen means the same thing as a unit of disutility for the abused child.

  When you apply this machinery to *Omelas*, the story does look different than it does under naive hedonic utilitarianism, primarily because the currency of evaluation shifts from felt intensity to attitudes toward risk. In a naive sum, the child's suffering is just a large negative number competing against many large positive numbers. Under Harsanyi's framework, the justification for Omelas rests on whether an impartial chooser behind the veil would accept the lottery. The question is not whether the total happiness outweighs the total misery, but whether the risk of being the child is an acceptable price for the chance of being a citizen. This prices the child's suffering according to how much risk a rational agent would tolerate to avoid it. If the child's state is sufficiently terrible—if it represents a collapse of the utility scale into something akin to negative infinity—then no finite gain for the others can compensate for a non-zero probability of occupying that state. A sufficiently risk-averse chooser would reject the Omelas bargain even if the expected utility were positive, because the downside risk violates the continuity axiom or simply dominates the decision matrix. This captures the intuitive horror of the story better than simple summation, as it accounts for the categorical nature of the child's abuse rather than treating it as merely more intense pain.

  However, this is where you must be careful not to stretch the text to fit the theorem, because the story resists this reading in specific, structural ways. The most significant friction point is the agency of the child. Harsanyi's Aggregation Theorem requires that the individual rankings being aggregated satisfy the vNM axioms. The child in the basement is described as feeble-minded, terrified, and broken by long-term abuse. It is unclear that the child possesses the rational agency required to hold preferences over lotteries, let alone satisfy continuity or independence. In the math of Omelas, the child effectively has a weight of zero, not because of a normative choice behind a veil, but because the child is excluded from the set of agents whose utilities count. The citizens decide the bargain; the child is the object of the bargain. A Harsanyiian reading struggles to accommodate a subject who cannot participate in the preference aggregation, turning the theorem into a justification for exclusion rather than a method of impartial weighing.

  The normalization problem you flagged also creates a rupture in the text that the theory cannot easily smooth over. For the equal weights argument to work, the citizens and the child must share a common utility scale. Yet Le Guin describes the happiness of Omelas as mature, intelligent, and complex, while the child's existence is reduced to bare biological suffering. If the citizens' utility is derived from moral complexity and aesthetic joy, and the child's disutility is derived from physical torment and isolation, there is no obvious exchange rate. To assume equal weights is to assume these experiences are commensurable. The story hints that they are not; the citizens' happiness is explicitly dependent on the knowledge of the child's misery, suggesting their utility function is structurally linked to the child's disutility in a way that simple aggregation misses. The child is not just a negative input; the child is the foundation of the utility function itself. This violates the independence of individual utilities assumed in the standard aggregation model.

  Then there is the question of the ones who walk away. You ask whether leaving is a rejection of the aggregation frame or simply the action of a strongly risk-averse chooser once the veil lifts. If we stick strictly to the Harsanyi model, once the veil lifts, the lottery is resolved. The walkers know they are not the child. They know they are citizens. To leave is to sacrifice known, high utility for unknown, likely lower utility. Within the vNM framework, this is irrational unless their utility function includes a parameter for "moral purity" that outweighs the material bliss of Omelas. If we interpret their departure as maintaining the veil's perspective despite knowing the truth, we are attributing to them a commitment to impartiality that the model says should dissolve once identity is known. It is more honest to say the walkers represent a break from the consequentialist framework entirely. They do not recalculate the risk; they reject the system that makes the calculation necessary. They refuse to accept that the social welfare function can legitimately include the child's suffering as a variable, regardless of the weights or the risk profile. This is a deontological refusal, not a risk-averse optimization.

  So, while your lens offers a sophisticated upgrade over naive utilitarianism by introducing risk and normalization constraints, the story ultimately pushes back against the formalism. The child's lack of agency violates the premises of the theorem, the incommensurability of the experiences challenges the normalization required for equal weights, and the walkers' departure signals a rejection of the aggregation premise rather than a different input into the same equation. You can use Harsanyi to explain why the bargain might be rejected by a rational observer behind the veil, particularly one with high risk aversion, but you should acknowledge that Le Guin's text locates the moral failure not in the math of the trade, but in the willingness to make the trade at all. The walkers do not walk away because the odds are bad; they walk away because the game is rigged. That distinction is where the story exceeds the theorem.
