answer: |-
  **The Brexit Referendum as a Case Study in Collective Intentionality**

  The 2016 United Kingdom referendum on European Union membership offers a singular stress test for theories of collective intentionality. The facts are fixed: a binary ballot produced a narrow majority (roughly 52 per cent) for leaving, yet the vote specified none of the substantive terms of withdrawal. Competing visions of departure—ranging from close regulatory alignment to a hard exit onto default trade terms—were advocated by incompatible factions within the winning camp. Nevertheless, the result was subsequently characterised as the singular 'will of the people', a description utilised to oblige legislators who had campaigned against leaving to implement the outcome. This precipitated years of parliamentary deadlock until a general election was fought on the premise of completing the process.

  This analysis proceeds in two directions. First, it applies standard theories of shared intention to the referendum result. Second, it considers what the episode reveals about the limitations and capacities of those theories.

  ### I. Theory Applied to the Case

  To analyse the referendum through the lens of collective intentionality, we must utilise the standard conditions proposed by theorists such as Michael Bratman and Margaret Gilbert. Bratman's account of shared intention requires that participants mutually intend to act together, that their individual sub-plans mesh, and that they remain mutually responsive should those plans break down. Gilbert's plural-subject theory adds that a joint commitment generates obligations among members to uphold the intention.

  **One Collective Intention or Many Divergent Ones?**
  On a strict Bratmanian reading, the 'Leave' vote in June 2016 struggles to qualify as a single collective intention. The condition of 'meshing sub-plans' appears violated. A voter intending to leave whilst remaining in the single market (the Norwegian model) holds an intention incompatible with a voter intending to leave to escape all regulatory alignment. Since these sub-plans cannot be realised simultaneously, there was no shared plan of action, only a shared label. Consequently, what existed was likely many individual intentions with divergent objects, aggregated by a procedure, rather than a robust 'we-intention'.

  Gilbert's framework offers a slightly different angle. Did the voters enter a joint commitment? Amongst millions of strangers, direct joint commitment is implausible. However, if one views the electorate as a corporate body, the vote could be seen as constituting a plural subject. Yet, even here, the incompatibility of the members' understandings threatens the stability of the commitment. If the obligation is to uphold 'Leave', but 'Leave' is essentially contested, the obligation lacks a clear object.

  **Create, Diagnose, or Defer?**
  We must test a tripartite distinction regarding what the vote achieved:
  1.  **Creation:** The vote itself constitutes the collective intention.
  2.  **Diagnosis:** The vote reveals a pre-existing collective intention.
  3.  **Deferral:** The vote produces an intention to defer, wherein the content is that whatever the government subsequently negotiates should be adopted.

  The 'Creation' model fails because a collective intention cannot be conjured ex nihilo by a count if the participants do not share the requisite mutual responsiveness. The 'Diagnosis' model fails because there was no pre-existing consensus on the *mode* of leaving, only on dissatisfaction with the status quo.

  The 'Deferral' model fits the facts best. Many voters likely held an intention of the form: 'We intend to leave, and we intend to accept the terms negotiated by Her Majesty's Government'. This transforms the collective intention from a specific plan of action into a procedural commitment. This implies that the mandate claimed afterwards was not a mandate for a specific policy (such as a hard border), but a mandate for the executive to negotiate and the legislature to ratify. However, this creates a fragility: if the government fails to negotiate terms that the plural subject finds acceptable, the intention dissolves. The parliamentary deadlock suggests exactly this fracture; the sub-plans of the legislature no longer meshed with the executive's negotiation, breaking the mutual responsiveness required for shared intention.

  **Content-Gappiness and the Object of Intention**
  Can a shared intention be content-gappy? Can one intend to 'exit' without intending what follows? In the philosophy of action, an intention typically requires a representation of the goal. An intention that specifies only what it rejects ('Not Remain') risks lacking an object altogether. If I intend to 'not eat apple', I have not yet formed an intention to eat anything else.

  However, theory might distinguish between an *underdetermined* collective intention and *no* collective intention. An underdetermined intention exists if the agents commit to a framework for deciding the details later (supporting the 'Deferral' model). If the voters committed to the *process* of leaving, the intention had an object (the process), even if the outcome was unspecified. If, however, they merely expressed a preference without committing to a joint course of action, there was no collective intention at all, only an aggregate of sentiments.

  **The 2019 General Election: Retroactive Supply or Replacement?**
  The legislature deadlocked for years until a general election was fought on completing the process. Did this election supply the missing content retroactively? Standard theory suggests intentionality is time-indexed. One cannot form an intention at Time 2 that validates an incoherent intention at Time 1. Therefore, the 2019 election did not supply missing content to the 2016 mandate; it *replaced* it. The 2019 vote created a new, more specific collective intention (to accept the Withdrawal Agreement negotiated by Boris Johnson) which superseded the underdetermined intention of 2016. The theory lacks the resources to suggest the later vote healed the earlier conceptual gap; rather, it superseded the earlier plural subject with a new one.

  ### II. What the Episode Shows About the Theory

  Turning the lens around, the Brexit episode exposes significant gaps in the machinery of collective intentionality when applied to mass democratic politics.

  **The Aggregative Rival**
  Does this vindicate the aggregative rival, on which procedures convert plural votes into outcomes without any 'we' at all? The deadlock suggests yes. Social Choice Theory argues that there is no 'will of the people', only counting rules. The fact that the 52 per cent could not sustain a meshing plan suggests there was no collective agent, only a majority coalition with contradictory aims. The description of the result as 'the will of the people' was a political fiction utilised to generate normative force, not a description of a philosophical reality. The theory of collective intentionality struggles to account for how a label can function as an intention when the underlying cognitive states are incompatible.

  **The Mandate Gap**
  The episode exposes a gap regarding institutions acting on mandates whose content is filled in later. Standard theories of joint commitment assume the content is fixed at the moment of commitment. Brexit demonstrates that political mandates often function as 'blank cheques'. The theory is largely silent on how a joint commitment can persist when the content is essentially contested and filled in by elites post-hoc. If the content is determined by the government rather than the participants, the 'shared' nature of the intention is diluted. It becomes less a shared intention and more a authorisation of agency.

  **Binding Dissenting Legislators**
  Does the plural-subject machinery really license binding legislators who dissented? Gilbert's theory binds participants in the joint commitment. It does not obviously bind outsiders. The Remain voters did not join the 'Leave' plural subject. Consequently, the theory cannot easily explain why Remain MPs were morally bound by the referendum result, unless one posits that MPs are agents of the 'People' as a whole, regardless of their personal participation in the commitment. This requires a theory of political representation that sits atop the theory of intentionality. Where the theory is silent, we must say so plainly: standard accounts of collective intentionality do not generate obligations for non-participants. The claim that dissenting legislators were bound relies on constitutional conventions, not on the philosophy of action.

  **Theoretical Silence**
  Finally, where the theory is silent, we must acknowledge it. Standard models of shared intention are designed for small groups (duets, teams) where mutual responsiveness is feasible. They are silent on how millions of strangers can maintain mutual responsiveness. They are silent on how a binary vote can generate a complex plan. They are silent on how to resolve incompatibilities within the winning coalition. To force the theory to speak here is to stretch it beyond its breaking point. The Brexit case suggests that 'collective intention' in mass politics is a metaphorical extension, not a literal instantiation of the conditions laid out by Bratman or Gilbert.

  ### Conclusion

  The 2016 referendum did not create a robust collective intention to leave in the strict philosophical sense, as the necessary meshing sub-plans were absent. It functioned better as an intention to defer, authorising the government to define the terms. The subsequent deadlock revealed the fragility of this deferment when the executive and legislature could not agree on the content. The 2019 election did not retroactively fix the 2016 intention but replaced it with a new mandate. Ultimately, the episode suggests that in mass politics, the 'collective intention' is often a political construct used to legitimise aggregation, rather than a psychological reality that binds participants through joint commitment. The theory of collective intentionality lacks the resources to explain the normative force claimed by the victors over the dissenters, revealing a gap between the philosophy of action and the realities of constitutional crisis.
