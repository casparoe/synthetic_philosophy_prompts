answer: |-
  You cannot selectively exempt your dad while condemning your partner because the argument proves desert applies universally or not at all, so you must either reject premise (2) to keep moral blame or reject premise (1) to view karma as natural consequence.

  The PhD student's argument is a version of the "Basic Argument" against moral responsibility, and its logic is symmetric: whatever verdict it delivers for your dad's stroke, it must deliver for your partner's theft. If your dad lacked ultimate control over the causes of his stroke, your partner lacked ultimate control over the dispositions that led to theft. To escape conclusion (8) while keeping some form of justice, you have two main exits, each with a specific cost.

  The first exit is to reject premise (2): "Desert needs control." This is the Compatibilist move. You argue that you don't need *ultimate* control (being the uncaused cause of your own desires) to deserve blame; you only need *situational* control (acting according to your own desires without external coercion). If you take this route, you can hold your partner responsible because the theft flowed from *his* character, even if that character was shaped by luck. The cost is that you lose the comfort of cosmic justice. You admit the universe doesn't owe you a settlement; blame becomes a human tool for safety and repair (as the PhD student suggested), not a metaphysical truth. This saves your anger but grounds it in social utility rather than cosmic debt.

  The second exit is to reject premise (1): "Karma-as-desert." This aligns with your intuition about the Salt Sutta. In this view, karma is not a ledger of debts but a law of moral causality, like gravity. The Salt Sutta illustrates that the *context* determines the impact: a small sin in a developed mind (the Ganges) has little effect, while the same sin in an undeveloped mind (the cup) is overwhelming. This isn't about paying back a specific quantity owed; it's about how actions interact with existing conditions. If you take this route, you save your dad completely—his stroke is a tragic event, not a payment. The cost is you must give up the hope that your partner *deserves* suffering. He may suffer consequences (legal, social, or psychological), but not because the universe is balancing a score. This is often closer to orthodox Buddhism, which views craving for vengeance as a source of your own suffering.

  A third, harder exit is rejecting premise (3) by asserting Libertarian Free Will—that you can somehow choose your desires independent of prior causes. This buys you ultimate desert for both cases but costs you philosophical and scientific credibility, as it requires believing in a break in the causal chain that most physicists and neuroscientists reject.

  Ultimately, the tension you feel comes from wanting two incompatible things: a universe without cruel cosmic judgment for your dad, but with cruel cosmic judgment for your partner. The PhD student is right that you cannot have both. If you stay with the group, rejecting (1) is the most coherent path; it transforms karma from a system of punishment into a system of growth, removing the need for the universe to hurt your partner to satisfy you.
