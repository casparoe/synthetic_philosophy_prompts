answer: |-
  Yes, there is a rigorous philosophical case that your failure to deliberate was the correct response because impartial calculation in intimate contexts undermines the integrity of personal relationships, which is itself a moral good that even consequentialism must account for to remain plausible.

  This argument rests primarily on Bernard Williams' "integrity objection" and the distinction between a criterion of rightness and a decision procedure. Williams argues that requiring an agent to step outside their personal commitments to assess them impartially introduces "one thought too many." If you must justify saving your spouse by referencing the general utility of maintaining marriages, you are not acting out of love but out of a commitment to impersonal value, which alienates you from the very project that gives your life meaning. Michael Stocker describes this as "moral schizophrenia," where the motives that sustain human relationships (love, loyalty) are severed from the justifications provided by moral theory (maximization of good). If the theory demands you suppress the motives necessary for the relationship, the theory is demanding you destroy a significant source of human well-being to satisfy its own criteria.

  Peter Railton's concept of "sophisticated consequentialism" resolves this by distinguishing between what makes an act right and how an agent should decide. A consequentialist system may determine that the world is best off if agents possess non-consequentialist dispositions in private spheres. Therefore, the consequentialist correct response is to cultivate a character that does not calculate when loved ones are at stake, because a world of calculative spouses produces less utility than a world of devoted ones. Your failure to deliberate was not a bug in your moral software; it was the functioning of the specific disposition that makes your marriage valuable.

  The reasoning bottoms out at three specific limits where partiality becomes impermissible. First, it fails when the action violates the fundamental rights of others; you cannot kill an innocent stranger to save your spouse, because rights function as side-constraints that partiality cannot override. Second, it fails at the threshold of catastrophic harm; while you may favor your spouse against significant costs to others, you cannot favor them if the alternative is preventing a genocide or societal collapse, as the destruction of the moral community undermines the possibility of any relationships at all. Third, following Samuel Scheffler's "agent-centered prerogatives," partiality is limited by disproportionality; you are permitted to favor your spouse, but not if the cost to others is vastly disproportionate to the benefit to them (e.g., spending funds that would save a thousand lives to save your spouse from a minor inconvenience). In your case, the urgency and severity of the medical condition place the benefit to your spouse high enough that it does not clearly violate the disproportionality constraint, preserving the integrity of your partial commitment.
