answer: |-
  A public fertility program has funding for exactly two IVF cycles monthly. Protocol A selects embryos with genetic profiles predicting stable, moderate well-being (welfare level 70 each). Protocol B selects profiles predicting volatile outcomes: one child with a manageable chronic condition (level 50), one with exceptional advantage (level 90). Both lives are clearly worth living, comfortably above the threshold where existence is preferable to non-existence. Different embryos mean different children, satisfying identity dependence. Two children exist either way, satisfying same-number. Total welfare is 140 units either way, satisfying same-total. No rights are violated; the choice is purely protocol-based. Intuitively, Protocol A is morally required; choosing B wrongs the future children despite neither being harmed by existence.

  **Verdicts:**
  The **Person-Affecting View (PAV)** declares both options permissible. Since the children in A and B are different individuals, neither is worse off than they would otherwise be; non-existence is not a baseline for harm. The **Total Utilitarian** is indifferent. Both options produce identical aggregate welfare (140 units); the distribution is morally irrelevant to the sum. The **Prioritarian** judges A obligatory. Because moral value diminishes at higher welfare levels, the gain to the worse-off child (50→70) outweighs the loss to the better-off child (90→70), even though total welfare is constant.

  **Analysis:**
  Only the Prioritarian view secures the target judgment. The feature doing the work is *diminishing marginal moral value* applied impersonally. Because the subjects differ, the distribution is strictly impersonal; no one is equal *to* anyone across the choices. The case functions only because total welfare is held constant. If Protocol B yielded a total of 141 (e.g., levels 50 and 91), Total Utilitarianism would mandate B, clashing with the prioritarian intuition that avoiding the lower floor is more urgent. This reveals the fragility of the judgment: it relies on the exact cancellation of aggregate gain against distributive loss.

  A defender of the Person-Affecting View would attack this by arguing your "residue" is merely a disguised appeal to impersonal equality. Since the individuals differ, claims about fairness between them cannot be person-affecting. They would argue that if you reject the impersonal turn (as PAV does), the wrong vanishes. Therefore, the case does not prove the Non-Identity Problem is unrelated to identity; rather, it proves that solving it requires abandoning person-affecting restrictions entirely. Your "residue" is simply the space where impersonal values operate once identity constraints are removed. If you insist the wrong persists even without impersonal values, you are left with no theoretical grounding other than an unanalyzed intuition that identity itself generates duties beyond harm. Consequently, your claim holds only if one accepts that impersonal distributional concerns are distinct from, and superior to, identity-based constraints.
