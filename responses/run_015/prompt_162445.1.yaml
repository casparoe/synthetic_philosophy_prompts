answer: |-
  ### The Agents and Their Rationality

  To map SVB onto canonical models, we must first define the agents and their constraints. The primary depositors were startup CFOs and founders, acting on private signals regarding their own burn rates and payroll obligations. Their action set was binary: wire funds out or stay put. The payoff structure was asymmetric: staying put offered continuity if the bank survived, but total loss of operational capacity if it failed; wiring funds out incurred negligible transaction costs but risked triggering the very failure they feared. A second class of agents comprised venture capital firms with board seats. Their private signal was privileged access to portfolio company cash positions and direct lines to SVB management. Their action set involved public advice to portfolio companies. Their payoff included financial returns but heavily weighted reputational capital; advising silence before a collapse would be catastrophic for future fundraising.

  In the canonical informational cascade models (Banerjee; Bikhchandani, Hirshleifer, and Welch), rationality dictates that once a public history of actions reaches a threshold, agents should ignore their private signals and follow the herd. For the SVB CFO, the "public history" was the March 8 announcement of realized losses and the subsequent chatter in group chats. If a CFO observes peers withdrawing, the rational inference under this model is that peers possess negative information about solvency that outweighs the CFO's own private assessment. The Diamond–Dybvig framework, conversely, treats solvency as secondary to liquidity coordination. Here, rationality is purely strategic: withdraw if you believe others will withdraw, regardless of asset quality. The reputational herding model adds a layer for the VCs: it is rational to advise withdrawal even with ambiguous signals, because being wrong with the crowd is safer than being wrong alone.

  These models disagree on the nature of the rationality. The informational cascade implies the agents were updating beliefs about the bank's asset quality based on others' actions. Diamond–Dybvig implies agents were updating beliefs about *other agents' actions*, irrespective of asset quality. Reputational herding suggests the VCs were optimizing for liability protection rather than bank fundamentals. In SVB, the Diamond–Dybvig logic dominates: the March 8 announcement made the asset impairment public knowledge, removing the information asymmetry required for a pure informational cascade. The run was not about discovering hidden insolvency; it was about coordinating exit before the door locked.

  ### Belief Versus Positional Cascades

  This brings us to the distinction between a belief cascade and a positional cascade. In a belief cascade, agents withdraw because earlier withdrawals swamp their private signal regarding the bank's condition. They infer "the bank is bad" from the fact that "others are leaving." In a positional cascade, agents withdraw because earlier withdrawals drain the liquid pool, altering the payoff of being late. They infer "I must be early" from the fact that "others are leaving," regardless of whether the bank is fundamentally sound.

  March 9 was unequivocally a positional cascade. The solvency signal was already public on March 8: the $15 billion unrealized loss was disclosed, and the capital raise attempt signaled distress. There was no private information about the balance sheet left to aggregate. The urgency stemmed from the structure of the liabilities: 86–89 percent of deposits were uninsured. In a first-come, first-served liquidity crisis, the value of a deposit claim is contingent on its place in the withdrawal queue. When venture firms advised portfolios to move money, they were not signaling new information about Treasury yields; they were signaling a change in queue priority.

  Does this distinction collapse into payoff complementarity? Functionally, yes, but conceptually, no. In both cases, the individual action depends on the aggregate action of others. However, in a belief cascade, the herd can be "wrong" about the underlying state (the bank was actually solvent). In a positional cascade, the underlying state is irrelevant; the run is rational even for a solvent bank if the liquid assets are insufficient to cover simultaneous withdrawal. The SVB episode sharpens this distinction: it was not a panic based on mistaken beliefs about asset value, but a preemptive strike based on the mechanics of uninsured liability seniority. The distinction holds because the agents knew the assets were impaired but ran because the liquidity structure made that impairment fatal upon contact.

  ### Structural Fractures in the Mapping

  The mapping fails where the standard models assume an ordered history of observation. Canonical cascades assume Agent 1 acts, then Agent 2 observes Agent 1, then Agent 3 observes both. SVB participants observed a noisy, simultaneous broadcast via social media and wire transfers. There was no sequence; there was a flood. This observation structure accelerates the cascade beyond the model's predictions. In a sequential model, early movers anchor the herd. In a networked broadcast, the "history" is created instantaneously, removing the dampening effect of sequential deliberation. The cascade result survives, but the speed renders the "private signal" phase nonexistent. Agents did not have time to weigh private liquidity needs against public actions; the public action overwhelmed the time horizon for private calculation.

  More critically, the state of the bank was endogenous to the cascade. In standard theory, the world is either Good or Bad independently of the agents' actions. At SVB, the Held-to-Maturity losses were unrealized until the bank was forced to sell. The run was precisely what forced the sale. Thus, the cascade did not discover a pre-existing insolvency; it manufactured it. This challenges the usual story that cascades can be "wrong." If the run creates the insolvency, the run is technically "correct" ex-post, but the counterfactual (no run, bank survives) remains unobservable. The theory assumes a fixed state to judge the efficiency of the herd; SVB demonstrates a reflexive state where the herd determines the truth.

  Finally, consider the March 12 announcement guaranteeing all deposits. Did this stop future runs by changing beliefs or payoffs? Standard theory suggests public signals update beliefs about the state (e.g., "the bank is safe"). Here, the signal changed the payoff structure entirely (e.g., "you cannot lose money even if the bank is unsafe"). The theory expects signals to resolve information asymmetry; the Treasury resolved the risk asymmetry. This is a category error in the model: the intervention did not make the bank more solvent, it made the depositors immune to insolvency.

  ### The Verdict on Theory

  Is SVB a confirmation or an anomaly? It is a confirmation of the mechanism but an anomaly of the context. The speed and networked nature of the herding confirm that informational and positional cascades are potent in digital finance. However, the episode reveals a missing player in the framework: the strategic authority. Standard models treat the regulatory environment as fixed or exogenous. SVB shows that agents are playing a game against a regulator who decides, after the fact, whether to validate the herd's fears or override them.

  If agents rationally expect a bailout signal, the framework becomes degenerate. Why run on March 9 if you expect the Treasury to cover uninsured deposits on March 12? The run occurred because the probability of that signal was unknown. This tells us that cascades in modern banking are not just equilibria of depositor interaction but equilibria of depositor-regulator interaction. The theory is silent on this dynamic. It treats the run as a failure of coordination among peers, ignoring the coordination between peers and the state.

  Furthermore, the endogenous nature of the solvency state suggests the theory lacks a feedback loop for asset valuation. If a run crystallizes losses that otherwise wouldn't exist, the "rationality" of the run is circular. The theory assumes agents are guessing about a static value; SVB shows them guessing about a dynamic value that their own guessing destroys.

  Ultimately, SVB is a case the framework never anticipated: a herding game where the payoff matrix is mutable and controlled by a participant who enters only after the cascade begins. The cascade was not merely a self-confirming panic; it was a rational interrogation of the government's insurance policy. The theory treats cascades as artifacts of private information aggregation. SVB suggests they are artifacts of public guarantee ambiguity. Where the theory assumes a missing information problem, SVB presents a missing commitment problem. The silence of the models on the state's reaction function is not a minor omission; it renders them incapable of predicting when a cascade will be arrested by policy rather than exhaustion. We are left with a model that explains the fire but cannot account for the fire brigade's decision to let it burn or douse it.
