prompt: |-
  So I've got a works-in-progress talk next Thursday at a department I'm visiting, on a reading of Wittgenstein's On Certainty that I've been kicking around, and what I want from you is Q&A prep, not comments on the paper.

  The thesis: hinges aren't propositions or beliefs with some wierd special epistemic status. They're questions that a practice has let go dead. My slogan is that a hinge is a question nobody's asking any more. Moore holding up his hand, that the earth was around for ages before you were born, that the person talking to you has a mind — none of these is certain because we bear some arational but rationally mandatory commitment to it. It's certain because in that practice there's no live question it would be an answer to: no procedure for settling it, no uptake for an answer, nothing that would go differently either way. Groundlessness isn't a status on a proposition, it's just that grounding is answering a question and there isn't one. I think this buys more than the standard stories do: it explains how a hinge can change on you — conversion, growing up somewhere else, a research field hitting an anomaly — without my owing you an account of rationally revising a belief, and it explains why claiming to know one of these sounds off: you're offering an answer to a question that isn't in play.

  The room, about fifteen people. Two Wittgenstein people: one therapeutic or resolute type who thinks the whole hinge-epistemology industry is a betrayal and will want to know why my view isn't just another theory of the exact kind the later work is trying to get us to stop producing; one committed hinge epistemologist who'll say this is what everyone already says in different words. Three mainstream epistemologists working on knowledge, skepticism, disagreement — they'll ask whether this is foundationalism, coherentism, contextualism or externalism rebadged, and they'll press the regress argument. Two social and political epistemologists who work on deep disagreement, testimony, epistemic injustice — they'll go after conspiracy theorists and after who has the power to keep a question dead. One philosopher of science working on Kuhn and incommensurability. A formal epistemology grad student who'll ask what any of this looks like in a model, or whether I'm assigning anything probability one. And the department's ancient philosophy person, who comes to everything, and will ask how this differs from Aristotle on first principles.

  The example I'm building the talk around: a lab where nobody checks whether the mass spectrometer was calibrated that morning; a new postdoc starts asking; it turns out it hadn't been recalibrated in three weeks and most of a year of results is worthless. My line is that it was a dead question for that group, then it went live, and that's all hinge change ever is.

  Give me the objections in the order they'll actually come, phrased the way each of those people would phrase them, with what I should concede, what I have to hold, a two-minute reply each, and a note on where the reply is soft. Tell me what I should give away in the first two minutes before anyone asks anything, which single reply has to land for the paper to survive at all, and the one question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep:

  1.  **Analyze the Request:**
      *   **Task:** Q&A prep for a works-in-progress talk on Wittgenstein's *On Certainty*.
      *   **Thesis:** Hinges aren't propositions/beliefs with special status; they are *questions* a practice has let go dead. "A hinge is a question nobody's asking any more." Groundlessness = no live question to ground.
      *   **Benefits claimed:** Explains hinge change (conversion, anomalies) without needing rational revision of belief; explains why "I know..." sounds off (answering a non-live question).
      *   **Core Example:** Lab mass spectrometer calibration (dead question $\rightarrow$ live question $\rightarrow$ crisis/change).
      *   **Audience:** 15 people, specific profiles (2 Wittgensteinians, 3 Mainstream Epistemologists, 2 Social/Political Epistemologists, 1 Phil Sci/Kuhn, 1 Formal Epist Grad, 1 Ancient Phil).
      *   **Deliverables:** Objections in likely order (phrased by persona), concessions/holds, 2-min replies, soft spots, pre-emptive concessions, the one crucial reply, the one dreaded question.
      *   **Constraint:** No comments on the paper itself, just Q&A prep.

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Strength:* Dynamic view of hinges (change is easier to explain).
      *   *Weakness 1 (Wittgensteinian):* Is this just another theory? Wittgenstein hates theories. Does "dead question" reify hinges?
      *   *Weakness 2 (Epistemologist):* Is this just Contextualism? If a question isn't asked, is the context closed? What about the regress?
      *   *Weakness 3 (Social/Political):* Power dynamics. Who gets to decide a question is dead? (Conspiracy theorists claim questions are suppressed; oppressed groups claim questions are ignored).
      *   *Weakness 4 (Phil Sci):* Kuhn. Paradigm shifts. Is this just normal science vs. revolutionary science?
      *   *Weakness 5 (Formal):* Probability 1? If it's not a belief, how do you model it?
      *   *Weakness 6 (Ancient):* Aristotle's *archai*. Is this just first principles?
      *   *Weakness 7 (Internal Coherence):* If a hinge is a *question*, what happens when it's "dead"? Does it disappear? Or is it a question that *has* an answer but we don't ask it? The thesis says "no procedure for settling it." But calibration *does* have a procedure. This is a potential tension in the example.

  3.  **Determine the Order of Objections:**
      *   *Opening:* Usually the host or the most senior person (Ancient Phil or Resolute Wittgensteinian) sets the tone. Let's put the Resolute Wittgensteinian first because they attack the *project* itself.
      *   *Middle:* The meat of the epistemology (Mainstream, Social, Phil Sci).
      *   *Late:* Technical/Specific (Formal, Ancient Phil comparison).
      *   *Closing:* The "What everyone already says" person (Hinge Epistemologist) often comes late to say "this is old news."

      *Revised Order:*
      1.  Resolute Wittgensteinian (The "Therapeutic" Attack).
      2.  Mainstream Epistemologist (The "Classification" Attack).
      3.  Social/Political Epistemologist (The "Power" Attack).
      4.  Phil of Science (The "Kuhn" Attack).
      5.  Hinge Epistemologist (The "Nothing New" Attack).
      6.  Formal Grad Student (The "Model" Attack).
      7.  Ancient Phil (The "Aristotle" Attack).

  4.  **Drafting the Responses (Iterative Process):**

      *   *Resolute Wittgensteinian:* "You're making a theory."
          *   *Reply:* I'm describing grammar, not positing entities. "Dead question" is a description of use, not a metaphysical category.
          *   *Concession:* I am using generalizations.
          *   *Hold:* It's not an explanatory theory of justification.

      *   *Mainstream Epistemologist:* "Is this Contextualism?"
          *   *Reply:* Contextualism varies standards of *knowledge*. I'm saying the *question* vanishes. It's more radical.
          *   *Hold:* It blocks the regress by dissolving the demand for grounds.

      *   *Social/Political:* "Who kills the question?"
          *   *Reply:* Practices do, but practices are political. This explains epistemic injustice (forcing live questions on those who can't answer).
          *   *Soft Spot:* Normative force. When *should* a question be live?

      *   *Phil Sci:* "Kuhn."
          *   *Reply:* Yes, but Kuhn focuses on paradigms. I focus on the micro-practices (calibration) that constitute the paradigm.
          *   *Hold:* Hinge change is local, not always global revolution.

      *   *Hinge Epistemologist:* "Pritchard/Coliva say this."
          *   *Reply:* They treat hinges as propositions/entitlements. I treat them as absent questions. This explains the *change* better.
          *   *Hold:* The ontological status of the hinge.

      *   *Formal:* "Probability 1?"
          *   *Reply:* Not probability 1. Probability 0 or undefined. You can't bet on a non-question.
          *   *Hold:* It's not in the probability space.

      *   *Ancient:* "Aristotle."
          *   *Reply:* Aristotle's principles are true. Hinges are unused questions.
          *   *Hold:* Metaphysical vs. Pragmatic.

  5.  **Refining the "Crucial Reply" and "Dreaded Question":**
      *   *Crucial Reply:* The distinction between "unjustified belief" and "non-existent question." If hinges are beliefs, skepticism wins or dogmatism wins. If they are non-questions, skepticism loses its grip. This must land against the Mainstream Epistemologist.
      *   *Dreaded Question:* The Calibration Example Trap. "Wait, calibration *is* a procedure. So it *was* a live question technically, you just ignored it. So it's negligence, not a hinge." This undermines the core example.

  6.  **Pre-emptive Concessions:**
      *   Admit "dead question" is a metaphor.
      *   Admit this doesn't solve normativity (when *should* we ask?).
      *   Admit Wittgenstein wouldn't like the systematization.

  7.  **Review against Constraints:**
      *   Tone: Professional, strategic, sharp.
      *   Format: Specific sections as requested.
      *   Content: Focus on the specific thesis (Hinges = Dead Questions).

  8.  **Final Polish:** Check the voices. Make the Resolute sound impatient, the Mainstream sound precise, the Social sound critical, etc. Ensure the "Calibration" example is woven in correctly. (Self-Correction: Make sure the calibration example doesn't backfire. The point is that *within the practice*, it wasn't a question. The fact that a procedure exists doesn't mean the question is live.)

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a sharp, high-risk/high-reward reading. It moves the locus of certainty from *mental states* to *pragmatic silence*. That's going to provoke the theorists who need states to theorize about.

  Here is your Q&A battle plan, ordered by the likely flow of the room.

  ### Pre-Emptive Concessions (First 2 Minutes)
  *Before you take the first question, frame the boundaries to stop three lines of attack before they start.*

  1.  **On "Theory":** Acknowledge upfront that packaging this as a "thesis" about hinges risks turning it into the very epistemological theory Wittgenstein warns against. State clearly: "I am offering a grammatical remark about how 'certainty' functions in practice, not a normative theory of justification."
  2.  **On the Example:** Concede that the mass spectrometer *could* be checked. The point isn't that it's physically impossible to ask, but that within the *form of life* of that lab, asking it was unintelligible until the anomaly hit.
  3.  **On Normativity:** Admit you are not solving *when* a question ought to be live. You are describing what happens when it isn't.

  ---

  ### The Objections

  #### 1. The Resolute/Therapeutic Wittgensteinian
  **The Objection:** "You've just turned 'hinges' into a new theoretical posit. Wittgenstein's point in *On Certainty* is to dissolve the urge to find a foundation, not to give us a new taxonomy of 'dead questions.' By systematizing this, aren't you doing exactly the kind of epistemology the later work is trying to cure us of?"

  *   **Concede:** Yes, any generalization risks reification. I am using a picture to fight a picture.
  *   **Hold:** The picture of the 'dead question' dissolves the skepticism problem better than the 'special proposition' picture does.
  *   **The Reply (2 mins):** "You're right to worry about theory-building. But notice the payoff. If hinges are propositions, we have to explain why we're justified in holding them without evidence. That's the trap. If hinges are questions nobody is asking, there's nothing to justify. I'm not positing a foundation; I'm pointing out where the demand for foundations runs out of road. The 'dead question' isn't an entity; it's a description of a silence in the practice."
  *   **Soft Spot:** They will press whether "dead question" is itself a theoretical claim about the nature of language.

  #### 2. The Mainstream Epistemologist (The Regress Press)
  **The Objection:** "This sounds like Contextualism with extra steps. In contextualism, standards shift. Here, questions vanish. But if I ask 'How do you know the spectrometer works?', and you say 'That's not a live question,' haven't you just dogmatically stopped the regress? What distinguishes a 'dead question' from a 'question you refuse to answer'?"

  *   **Concede:** It shares DNA with contextualism regarding the variability of standards.
  *   **Hold:** Contextualism keeps the proposition but lowers the standard. I'm removing the proposition from the game entirely.
  *   **The Reply (2 mins):** "Contextualism says the standard for 'knows' changes. I'm saying the move of asking for grounds is illegitimate in that context. In the lab, before the crash, 'Is it calibrated?' wasn't a question with a high standard of evidence; it was a move that had no uptake. It's not that I refuse to answer; it's that answering it wouldn't change anything in the practice. That's not dogmatism; it's a description of the rules of the game. The regress stops not because we hit bedrock, but because we ran out of board."
  *   **Soft Spot:** The line between "no uptake" and "refusal" is thin. They will push on who decides when uptake is possible.

  #### 3. The Social/Political Epistemologist
  **The Objection:** "You say a practice lets a question go dead. But practices are power structures. If a marginalized group asks 'Is this system biased?' and the dominant practice treats that as a 'dead question,' your view seems to validate their silencing. Who has the authority to kill a question?"

  *   **Concede:** Absolutely. Hinge status is political. Epistemic injustice is often the forced silencing of live questions.
  *   **Hold:** My view explains the *mechanism* of that injustice better than belief-based views.
  *   **The Reply (2 mins):** "This is actually where the view gains traction. If hinges are beliefs, the oppressor says 'You have the wrong belief.' If hinges are live/dead questions, the oppressor says 'That is not a question.' That captures the violence of epistemic injustice more accurately. My view doesn't validate the silencing; it exposes it. It shows that the fight isn't over evidence, but over which questions are permitted to be live. The postdoc in my example had to disrupt the practice to make the question live. That's a political act, not just an evidential one."
  *   **Soft Spot:** You lack a normative account of *which* questions *should* be live. You might be accused of descriptivism in the face of injustice.

  #### 4. The Phil of Science (Kuhn)
  **The Objection:** "This is just Kuhn. Normal science is when questions are dead. Revolutionary science is when they go live. The mass spectrometer example is a textbook anomaly leading to crisis. What does Wittgenstein add that Kuhn didn't?"

  *   **Concede:** The parallel with Normal/Revolutionary science is strong and intentional.
  *   **Hold:** Kuhn focuses on paradigms (global). I'm focusing on hinges (local/micro).
  *   **The Reply (2 mins):** "Kuhn's paradigms are massive—whole worldviews. Hinges are local. In the lab, the question 'Does matter exist?' is dead. But so is 'Was the machine calibrated today?' You can have hinge shifts without paradigm shifts. My view explains the micro-structure of scientific practice. A paradigm shift is a cascade of hinges going live. Wittgenstein gives us the granularity to see the individual bricks Kuhn lumps together."
  *   **Soft Spot:** If they press that Kuhn already covered the micro-structure of anomalies, you might look redundant.

  #### 5. The Hinge Epistemologist (The "Nothing New" Attack)
  **The Objection:** "Pritchard, Coliva, Moyal-Sharrock—they've all argued hinges aren't standard beliefs. They talk about 'animal certainty' or 'entitlements.' You're saying 'dead questions.' Isn't this just a semantic shift? You're describing the same functional role with different vocabulary."

  *   **Concede:** The functional role is similar: arational, foundational, immune to doubt.
  *   **Hold:** The ontology is different, and it solves the 'change' problem they struggle with.
  *   **The Reply (2 mins):** "It matters ontologically. If a hinge is a belief with special status (entitlement), I have to explain how you rationally revise a belief that is by definition arational. That's a puzzle Pritchard wrestles with. If a hinge is a dead question, change is easy: the question wakes up. No rational revision needed, just a change in practice. I'm not rebadging; I'm removing the need to explain how a 'certainty' can be false. A dead question isn't false; it's just awake now."
  *   **Soft Spot:** They may argue that 'waking up a question' *just is* rational revision under a different name.

  #### 6. The Formal Epistemology Grad Student
  **The Objection:** "If I'm modeling this agent, do I assign probability 1 to the hinge? If not, how do I represent a 'dead question' in a Bayesian network? If you say it's not in the model, how does it ever get back in?"

  *   **Concede:** This doesn't fit neatly into standard Bayesian updating.
  *   **Hold:** That's a feature, not a bug. Standard models assume all propositions are in the sample space.
  *   **The Reply (2 mins):** "You can't assign probability 1, because that implies it's a gamble you'd take. You don't bet on dead questions. In the model, the sample space itself changes. It's not updating $P(H)$; it's expanding the set of possible worlds to include worlds where the question matters. The postdoc didn't update probabilities; she changed the state space. Formal epistemology needs a dynamic logic of question-formation, not just belief-revision."
  *   **Soft Spot:** If they press for a formalization, you have none. You must stand on the philosophical necessity of changing the model.

  #### 7. The Ancient Philosophy Person
  **The Objection:** "Aristotle says we must grasp first principles (*archai*) that cannot be demonstrated. You say we have dead questions that cannot be asked. Is this not just the *archai* dressed in pragmatic clothing?"

  *   **Concede:** The structural similarity is undeniable. Both stop the regress.
  *   **Hold:** Aristotle's principles are true by nature. My hinges are silent by convention/practice.
  *   **The Reply (2 mins):** "Aristotle's *archai* are metaphysical—they are the way reality is structured. My hinges are pragmatic—they are the way *we* are structured. The mass spectrometer calibration isn't a first principle of the universe; it's a rule of the lab. Aristotle's view is static; mine is historical. *Archai* don't change when the postdoc arrives. Hinges do."
  *   **Soft Spot:** If they argue that practices are grounded in human nature, the distinction collapses.

  ---

  ### Strategic Summary

  **The Single Reply That Must Land:**
  The reply to the **Mainstream Epistemologist (Objection 2)**.
  You must convince the room that **"No live question" $\neq$ "Dogmatic refusal."**
  If they think you are just refusing to answer skepticism, you lose. You need them to see that skepticism *requires* a question to be in play to function. If the question is dead, skepticism is not refuted; it is rendered idle.
  *Key phrase to use:* "Skepticism is a move in a language game. If the game isn't being played, the move isn't wrong; it's null."

  **The One Question You Hope Nobody Asks:**
  **"In your example, the calibration *could* be checked. There *was* a procedure. So the question wasn't dead, it was just neglected. Doesn't that mean it was a live question with a probability of error > 0, and the lab was just irrational?"**

  *Why this kills you:* Your thesis relies on the question being *dead* (no procedure for settling, no uptake). But in a lab, calibration is a standard procedure. If you admit it was a live question they ignored, your example becomes one of negligence, not hinge certainty. If you insist it was dead, you have to explain why a standard procedure existing doesn't make the question live.
  *Defense if asked:* "A procedure existing in a manual doesn't make a question live in a practice. Drivers have a procedure to check tire pressure, but for most, 'Is my tire pressure optimal?' is a dead question until the car swerves. The existence of a protocol $\neq$ the liveliness of the question."

  **Final Advice:**
  The Resolute Wittgensteinian and the Hinge Epistemologist are your biggest threats. The Resolute thinks you're sinning; the Epistemologist thinks you're trivial.
  *   To the **Resolute**: Be humble. "I'm describing, not explaining."
  *   To the **Epistemologist**: Be bold. "I'm dissolving the problem, not solving it."

  Good luck. Keep the mass spectrometer example tight; don't let them turn it into a case study about lab safety. Keep it about the *intelligibility of the doubt*.
