answer: |-
  Dear colleague,

  Your intuition is quite sharp, and you are right to feel that standard labels like the Prisoner's Dilemma or the Tragedy of the Commons do not fully capture the phenomenology of what you are describing. While those concepts share the same mathematical skeleton, the dynamic you are observing has a specific texture that arises from the interplay of relative status, dynamic baselines, and structural coercion. In political theory and political economy, the most precise grounding for this mechanism is found in the concept of positional goods, originally articulated by Fred Hirsch in his work on the social limits to growth. The core mechanism here is that the value of the good being contested is not absolute but relative. When you compete for a positional good, such as academic prestige, military security, or social status, your payoff depends not on how much you have in absolute terms, but on how much you have compared to everyone else. This creates a situation where individual improvement cancels out collective improvement. If everyone stands on their tiptoes at a parade, no one sees better than when everyone stood flat-footed, yet everyone is more tired. This distinguishes it from a standard resource depletion problem because the resource itself is not necessarily being used up, but rather its value is being inflated away by the competition.

  To capture the dynamic motion you described, where everyone is pushed step by step into a worse state without a clear moment of betrayal, the most useful concept is the Red Queen Effect, borrowed from evolutionary biology. This concept describes an evolutionary arms race where species must constantly adapt and evolve just to maintain their relative fitness because their competitors are doing the same. This fits your description of academic publishing or doping in sports perfectly. In these scenarios, there is no static cooperative equilibrium to defect from. Instead, the baseline for participation shifts endogenously. When one actor escalates, they temporarily gain an advantage, which forces others to escalate to return to the status quo ante. Once everyone has escalated, the new baseline becomes the minimum requirement for survival, and anyone who attempts to return to the previous, lower-effort standard is not merely cooperating but effectively exiting the competition. This explains why there is no identifiable moment of defection. In a classic Prisoner's Dilemma, defection is a discrete choice against a known cooperative partner. In the dynamic you are observing, cooperation becomes impossible because the system punishes any deviation from the escalating norm, making the deterioration feel inevitable rather than chosen.

  In contemporary game theory and systems analysis, this specific configuration is increasingly referred to as a multipolar trap. This term helps distinguish the scenario from a two-player Prisoner's Dilemma by emphasizing the presence of many actors who cannot easily coordinate or enforce agreements. In a multipolar trap, the logic of competition is decentralized. No single actor desires the bad outcome, but the market or system selects for those who are willing to push the boundary further. If one firm decides not to cut corners on safety, they are outcompeted by those who do, and eventually, the safety-cutting firm goes bankrupt. The system thus converges on the worst acceptable standard not because the actors are malicious, but because the selection pressure rewards the behavior that leads to the degradation. This aligns with your observation about the logic of the situation making cooperation impossible. It is not a failure of morality or willpower but a structural feature of the competitive environment where the cost of unilateral disarmament is elimination.

  The boundaries of this concept are defined by the nature of the good being contested and the possibility of external coordination. This dynamic only holds when the goods are rivalrous and positional. If the good is non-rival, such as knowledge or public health in some contexts, one actor's gain does not necessarily diminish another's, and the escalation logic does not apply. Similarly, the dynamic breaks down if there is a mechanism for credible commitment or external enforcement. This is where your field of political theory offers the solution to the problem you are diagnosing. The only way to escape a multipolar trap or a positional arms race is to change the payoff structure through regulation, norms, or treaties that make unilateral escalation impossible or too costly. For example, doping bans in sports only work if there is a governing body with the power to test and punish; without that enforcement, the multipolar trap remains in force. Therefore, an instance counts as this phenomenon only when actors are locked in competition over relative standing without a higher-order authority capable of restraining the escalation.

  If you are looking for a label to use in your work, you might consider combining these threads into something like a positional arms race or a dynamic multipolar trap. While the Prisoner's Dilemma describes the static incentive structure, it fails to capture the historical and temporal dimension you are interested in, which is the ratcheting effect where the baseline continuously degrades. The term arms race is historically loaded but accurate, yet applying it to social phenomena like publishing or cosmetic surgery requires the economic grounding of positional goods to explain why the race never ends. Ultimately, the core mechanism is the decoupling of individual rationality from collective welfare driven by relative competition, where the cost of opting out is exclusion. Recognizing this allows you to distinguish these cases from simple coordination failures where communication might solve the problem. In the scenarios you are describing, communication is insufficient because the incentive to cheat on any agreement is baked into the survival logic of the actors themselves.

  I hope this helps clarify the theoretical landscape around your observation. It is a fertile area for political theory because it highlights the limits of individual agency within competitive structures and points toward the necessity of institutional solutions. You are essentially describing the micro-foundations of why certain forms of regulation or social contracts are not just desirable but necessary for the preservation of value itself. If you ground your analysis in Hirsch's work on positional goods and connect it to the modern game-theoretic understanding of multipolar traps, you will have a robust framework that distinguishes this dynamic from broader collective action problems. It captures the tragedy without requiring a villain, which seems to be the specific nuance you are trying to isolate.

  Best regards,

  Assistant
