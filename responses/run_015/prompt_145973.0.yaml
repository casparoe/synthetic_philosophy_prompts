answer: |-
  1. Divide the sixteen students into four sequential groups of four, labeling them Nodes A through D to represent a linear supply chain where information flows strictly from A to D. Distribute identical sealed envelopes containing a risk warning to each node, instructing them that they act independently without communication between layers.

  2. Provide each student with ten tokens and a private choice card, explaining that escalating the warning costs one token while ignoring it saves the token, though the true scoring rule remains hidden until the end. Unbeknownst to them, the group suffers a catastrophic penalty if the warning fails to reach the end, yet individual scores are calculated solely on tokens retained to incentivize rational inaction amidst widespread non-compliance.

  3. Reveal that every node chose inaction, triggering the collective penalty, and immediately ask each student to write down which specific layer they believe caused the harm. Collect these attributions on a whiteboard to visualize the disagreement, highlighting how each participant argues their own omission was counterfactually dependent on the others' prior failures.

  4. Guide a discussion mapping the scattered blame onto the metaphysical distinction between omissions as genuine causal relata versus merely explanatory placeholders selected from an infinite set of non-doings. Ask the group to analyze whether their voting patterns reflect a search for a salient normative breach rather than an identifiable physical cause within the chain.

  5. Explicitly state that the simulation cannot reproduce the metaphysical problem of selecting the relevant omission from an infinite background of non-actions, as the game artificially limits choices to a binary option that must be supplied by the facilitator. Acknowledge that the predictable first-run failure mode is total collusion to save tokens, requiring the facilitator to intervene by framing the tokens as irrelevant to force the philosophical realization of causal indeterminacy.
