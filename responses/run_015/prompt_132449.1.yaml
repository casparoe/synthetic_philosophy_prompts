answer: |-
  You are seizing on a fascinating historical detail, but I believe you have mistaken a tactical retreat for a discovery of nature. When the DSM committee revised the criteria for Multiple Personality Disorder, they were not peeling back a layer of social construction to reveal a biological bedrock; they were reacting to the chaos generated by the very existence of the previous classification. I concede that the clinicians changed their criteria, but I deny that this shift originated from a static observation of nature. They changed because the patients, the media, and the legal system had interacted with the label in ways that rendered the old criteria functionally obsolete. This is not evidence of a natural kind waiting to be found, but rather proof positive of an interactive kind spinning out of control. The instability you observe is the hallmark of Hacking's looping effect, not a crack in its armor.

  Furthermore, your notion of a "reverse loop" suggests a separation between classifier and classified that I simply cannot accept. The clinician's perceptual category is not a static lens looking at a static object; it is a tool designed to manage a moving target. If the tool changes, it is because the target has moved in response to the tool's previous incarnation. To claim this makes psychiatric kinds partly natural is to ignore the central thesis: natural kinds do not care how we label them. The fact that the clinicians had to scramble to update their definitions demonstrates that the kind is fundamentally reactive. You cannot isolate the clinician's adjustment as an independent mechanism; it is merely the second half of the same loop you claim to doubt.
