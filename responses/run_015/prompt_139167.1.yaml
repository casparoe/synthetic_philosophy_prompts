  My brother-in-law got going on the Clinton–Lewinsky business at a family thing on the weekend and I've been chewing on it since, and I want to use it properly rather than just re-run the standard takes. I'm in a seminar that does ethics of speech alongside philosophy of language, so here's the ask: treat the 1998 episode as a case study for the lying-versus-misleading distinction — the standard assertion-based view (you lie only if you assert what you believe to be false, with intent to deceive; you merely mislead when you get someone to a false belief by implicature or framing without asserting it) plus the further question whether that conceptual distinction carries any moral weight. The facts as I have them, so you don't have to rely on shaky memory: in the January 17 sworn deposition in the Paula Jones case Clinton denied a sexual relationship, a sexual affair, or sexual relations with Lewinsky; as I recall the deposition ran on a stipulated, very lawyerly definition of sexual relations (contact with certain body parts, done with intent to arouse or gratify), and the defense position was that being on the receiving end of oral sex wasn't covered by it; nine days later he gave the televised denial in which he said he did not have sexual relations with that woman; in the August 1998 grand jury appearance he defended some of those statements by leaning on tense — the famous bit where it depends on what the meaning of the word is is, i.e. the claim that a statement could have been true when made — and he also denied there was any improper relationship of any kind; that same month he admitted the relationship publicly; and Judge Wright later held him in civil contempt for giving misleading testimony in the Jones case, fined him, and his Arkansas law licence was suspended for five years. Map the actual utterances onto the distinction rather than the whole scandal: which one is a lie, which is only misleading, which is neither under some accounts and a lie under others, and what the difference in audience does — the deposition is under oath to a questioner, the January statement is to the public with no oath, the grand jury answers are defensive lawyering under oath. I'd like you to import two ideas I've been playing with and tell me if they're any good or if they collapse into something already in the literature: first, what I'm calling defensive literalism, the choice of words made partly so that the speaker has an escape route if a tape or a dress turns up — does choosing your wording for its deniability constitute the intent-to-deceive condition on its own, so that defensive literalism is just lying with extra steps, or is it a genuinely third category the theories miss? Second, the two-audience problem: can a single utterance be a lie with respect to one audience and merely misleading with respect to another at the same time — the public hears one thing, the legal record is meant to record another — and does the theory have to take an audience parameter, and if it does, does the neat lying/misleading line survive? Also please handle the hearer-responsibility crux honestly: in an adversarial setting where the questioner could have pinned him down with a follow-up, is the misleading speaker less culpable than he would be with a trusting friend, or does the oath flip it into a duty of candour that is stronger than the ordinary duty not to deceive, and does that mean the wrong is really about the institution rather than the utterance? And I want the reverse direction too — what the case does to the theory: my suspicion is that the lying/misleading distinction was built for cooperative two-person conversation and that legal and political settings break it, that misleading might not be one thing at all, and that there's a real argument (call it the corruption-of-literal-meaning argument) that defensive literalism is socially worse than an outright lie, because a plain lie is detectable and sanctionable while exploiting literal truth quietly destroys the convention that literal truth is a safe default — but I'd rather you argue against that than flatter it. Where the theory is genuinely silent, say so instead of forcing it to speak. Skip the Augustine–Aquinas–Kant tour, I've read it, and don't cite or quote anything, just work with the facts above.
