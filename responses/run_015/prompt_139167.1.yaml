answer: |-
  Here is a mapping of the 1998 episodes onto the lying-versus-misleading distinction, followed by an evaluation of your two conceptual innovations and the institutional cruxes you raised.

  ### 1. Mapping the Utterances

  To apply the assertion-based view, we must isolate the proposition asserted, the speaker's belief state, and the intent to deceive.

  **The January 17 Deposition (Paula Jones Case)**
  *   **Utterance:** Denial of a "sexual relationship," "sexual affair," or "sexual relations."
  *   **Context:** Under oath. A specific definition of "sexual relations" was stipulated (contact with body parts with intent to arouse/gratify).
  *   **Analysis:** Clinton's team argued that receiving oral sex did not fit the stipulated definition (specifically regarding who was contacting whom). If Clinton believed this interpretation was valid, he did not assert what he believed to be false. He asserted a technical truth. However, he knew the questioners intended the common-language meaning.
  *   **Classification:** **Merely Misleading.** He relied on the gap between the legal stipulation and the conversational implicature. He intended the questioners to believe the common-language falsehood without asserting it. Judge Wright's ruling of civil contempt aligns with this: the violation was not perjury (asserting a known falsehood) but providing misleading testimony that obstructed the fact-finding process.

  **The January 26 Televised Denial**
  *   **Utterance:** "I did not have sexual relations with that woman."
  *   **Context:** Public address, no oath, but referencing the deposition.
  *   **Analysis:** Here, the stipulated legal definition was not active. The audience was the general public, operating under the common-language definition. Clinton knew the relationship existed under that common definition.
  *   **Classification:** **Lie.** He asserted a proposition he believed to be false with the intent to deceive the public. The "legal definition" shield was unavailable here because the audience lacked the context to access that shield. This is the clearest instance of a standard lie in the episode.

  **The August Grand Jury Testimony**
  *   **Utterance:** "It depends on what the meaning of the word 'is' is." (Defending the truth of past statements).
  *   **Context:** Under oath, defensive lawyering regarding tense.
  *   **Analysis:** This relies on the distinction between present tense ("there is no relationship") and past reality. If the relationship had ended, the statement "there is no relationship" is literally true at the moment of speaking.
  *   **Classification:** **Merely Misleading (or Neither).** Under a strict assertion view, if the relationship had ceased, the statement was true. The deception lies in the implicature that no relationship *ever* existed. Some accounts might classify this as **neither**, viewing it as a valid correction of the questioner's temporal framing. However, given the intent to leave the grand jury with the false belief of total innocence, it functions as misleading.

  ### 2. Evaluating "Defensive Literalism"

  You ask if choosing wording for deniability constitutes a third category or is just "lying with extra steps."

  **Does it collapse?**
  It collapses into **intentional misleading**. The standard definition of lying requires asserting what one believes to be false. Defensive literalism avoids this by asserting what one believes to be *technically* true while knowing it will generate a false belief. It does not break the binary; it exploits the gap between semantic content and pragmatic uptake.

  **Is it a distinct moral category?**
  Functionally, no. The intent to deceive is identical to lying. The only difference is the risk profile. A liar risks being proven wrong by facts; a defensive literalist risks being proven wrong by semantics. If the moral wrong of lying is the violation of the norm against deception, defensive literalism commits the same wrong. It is not a third category ontologically, but it is a distinct *strategy* of deception.

  **Where the theory is silent:**
  The theory struggles with the *motivation* condition. If a speaker uses defensive literalism not to deceive, but to protect privacy while technically complying with a demand for truth (e.g., a witness protecting a secret unrelated to the case), the intent-to-deceive condition fails. In Clinton's case, the intent was clearly deception, so the theory holds. But the theory lacks the resources to distinguish between "protective literalism" and "deceptive literalism" without digging into subjective intent, which is often inaccessible.

  ### 3. The Two-Audience Problem

  You ask if a single utterance can be a lie to one audience and merely misleading to another, and if this breaks the distinction.

  **The Audience Parameter:**
  The theory must take an audience parameter. Truth-telling is a relational norm, not a property of the sentence.
  *   **To the Public (Jan 26):** Lie. (Common definition applies).
  *   **To the Court (Jan 17):** Misleading. (Stipulated definition applies).

  **Does the line survive?**
  Yes, but it becomes indexed. The utterance itself isn't a "lie" in the abstract; it is a "lie-relative-to-Audience-A." This complicates the moral evaluation because the speaker often knows the audiences will diverge. Clinton knew the public would hear the Jan 17 deposition answers without the legal definition. By speaking to the court in a way he knew would be broadcast to the public, he effectively imported the "misleading" classification of the deposition into the "lie" classification of the public sphere.

  **Theoretical Implication:**
  This suggests the lying/misleading distinction is not intrinsic to the speech act but extrinsic to the *context of uptake*. If the theory insists the act has a single moral valence, it fails here. If it allows for relational valence, it survives but loses some predictive power. We cannot judge the act without knowing who is listening and what definitions they hold.

  ### 4. Hearer-Responsibility and Institutional Duty

  You ask if the adversarial setting reduces culpability (hearer should have followed up) or if the oath increases it (duty of candor).

  **The Adversarial Objection:**
  In ordinary conversation, Gricean norms assume cooperation. If I mislead you, you are partly responsible for not asking for clarification. In a deposition, the norms are adversarial. The questioner *expects* evasion. One could argue the hearer (Jones's lawyers) bears responsibility for failing to pin down the definition.

  **The Oath Flip:**
  However, the oath overrides the adversarial norm. It imposes a duty of candor that exceeds the ordinary duty not to deceive. In ordinary life, you are forbidden from lying but permitted to mislead (arguably). In a deposition, you are forbidden from misleading *at all*. Judge Wright's contempt ruling confirms this: the wrong was not the falsehood, but the obstruction.

  **Institutional vs. Utterance:**
  The wrong is primarily about the institution. A lie to a friend damages trust between individuals. Misleading testimony damages the fact-finding capacity of the court. This explains why Clinton was not impeached for the lie itself but for the obstruction (the institutional harm). The theory of lying often focuses on the interpersonal breach; this case shows that in institutional settings, the *procedural* breach outweighs the *semantic* breach. The theory of lying is silent on procedural harm; it needs to be supplemented by a theory of institutional integrity.

  ### 5. Arguing Against the "Corruption-of-Literal-Meaning" Thesis

  Your suspicion is that defensive literalism is socially worse than a plain lie because it erodes the convention that literal truth is a safe default, whereas a lie is detectable and sanctionable. I will argue against this.

  **1. The "Safe Default" is already dead in high-stakes contexts.**
  The argument assumes there is a convention that literal truth is a safe default in politics and law. There never has been. *Caveat auditor* (let the hearer beware) is the baseline in adversarial systems. Defensive literalism does not destroy a convention that doesn't exist; it merely makes explicit the game that is already being played. A plain lie, by contrast, denies the game entirely. It claims a moral high ground ("I am telling you the truth") that is objectively false. Defensive literalism admits, implicitly, "I am navigating the rules to avoid self-incrimination." The latter is more honest about the nature of the interaction.

  **2. Sanctionability and Recovery.**
  You argue a plain lie is more sanctionable. Empirically, this is often false. Proving a lie requires proving subjective belief (intent), which is notoriously difficult. Proving defensive literalism requires only analyzing the text against the facts. Clinton's literalism was picked apart immediately; his lies were debated for years.
  Furthermore, defensive literalism leaves a bridge for reconciliation. Because the speaker has not technically asserted a falsehood, they can later admit the full truth without admitting they *lied*. Clinton could admit the relationship without admitting perjury (initially). A plain liar must recant their lie to tell the truth, which destroys credibility permanently. Defensive literalism allows for a gradual restoration of trust; plain lying demands a binary flip from "liar" to "truth-teller" that is socially harder to process.

  **3. Systemic Stability.**
  A system that punishes plain lies but tolerates defensive literalism is more stable than one that tries to police literalism. If we treat defensive literalism as "worse than lying," we demand speakers sacrifice their own legal protection for the sake of linguistic purity. This forces a choice between self-preservation and semantic honesty. Most legal systems prioritize the right against self-incrimination over semantic clarity. To claim literalism is *worse* is to claim that linguistic convention is more important than legal rights. A plain lie violates the norm of truth-telling. Defensive literalism upholds the norm of truth-telling (technically) while violating the norm of cooperation. Upholding the truth-norm, even technically, is less corrosive to the concept of truth than violating it outright.

  ### 6. Where the Theory is Silent

  The standard lying/misleading distinction is built for cooperative, dyadic conversation. It breaks down in three ways here:

  1.  **Temporal Indexing:** The "is vs. was" defense highlights that the theory lacks a robust account of temporal truth conditions in speech acts. The theory assumes the proposition is fixed at the moment of utterance, but legal testimony often treats statements as enduring claims about a state of affairs. The theory cannot easily adjudicate whether a statement that is true *now* but implies falsehoods about *then* is a lie.
  2.  **Institutional Norms:** The theory treats the "duty not to deceive" as uniform. It has no mechanism for weighting the duty of candor (oath) against the right to self-protection ( Fifth Amendment dynamics). It cannot explain why misleading the public is treated differently than misleading the court, other than by appealing to external consequences.
  3.  **The Definition of "Assertion":** In the deposition, was Clinton asserting "no sex [common definition]" or "no sex [legal definition]"? The theory assumes the speaker controls the assertion content. But in law, the questioner often controls the definition. The theory is silent on who owns the semantic content in a power-imbalanced interrogation.

  **Conclusion:**
  The Clinton episode confirms that the lying/misleading distinction is robust enough to classify the utterances (TV = Lie, Deposition = Misleading), but it is too thin to capture the moral weight. The moral weight comes not from the semantics, but from the institutional context. Defensive literalism is not a new category of speech, but it reveals that the "lie" label is often less important than the "obstruction" label. Your "Corruption" argument overestimates the fragility of literal truth; language survives cleverness, but it does not survive the normalization of outright falsehood. The plain lie is the greater threat to the convention of truth, because it rejects the convention entirely, whereas literalism merely exploits its edges.
