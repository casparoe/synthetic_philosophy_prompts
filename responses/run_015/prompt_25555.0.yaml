answer: |-
  This is a profound exercise. You are practicing **philosophical particularism**: trusting your intuitions about specific cases to build a theory, rather than forcing cases to fit a pre-existing theory. This is often how conceptual boundaries are actually discovered.

  The tensions you feel are not errors in your reasoning; they are fault lines in the concept of "life" itself. Biology, philosophy, and law often pull in different directions here.

  However, there is a framework that resolves most of your tensions without forcing you to abandon your core intuitions. It relies on distinguishing between **living matter** (cells functioning) and **living organisms** (integrated wholes), and utilizing the concept of **Autopoiesis**.

  ### The Core Principle: Autopoiesis + Integration

  The most robust philosophical definition of life comes from biologists Humberto Maturana and Francisco Varela: **Autopoiesis** (self-making).

  An entity is alive if it is a network of processes that:
  1.  **Produces its own components** (metabolism/repair).
  2.  **Maintains a boundary** (membrane/skin) separating it from the environment.
  3.  **Maintains itself as a distinct unity** over time (homeostasis).

  To resolve your specific tensions, we must add a second criterion: **Organismic Integration**. A collection of living cells is not necessarily a living *organism* if the system that integrates them is gone.

  Here is how this principle resolves your tensions:

  #### 1. The Virus vs. The Spore
  *   **Your Verdict:** Spore = Alive; Virus = Not Alive.
  *   **The Tension:** The virus evolves and has a genome; the spore does nothing.
  *   **The Resolution:** The spore is a **paused state of an autopoietic system.** It contains the full machinery to restart metabolism and self-maintenance given water and nutrients. It is a "sleeping" organism.
      The virus is **not an autopoietic system.** It never metabolizes. It is a packet of instructions that *hijacks* an autopoietic system (the host cell) to make copies of itself. It is more like a seed that cannot grow unless it turns the soil into more seeds.
      *   *Principle:* Life requires the *potential* for autonomous metabolism. The spore has it; the virus lacks the machinery entirely.

  #### 2. The Mule (Sterility)
  *   **Your Verdict:** Alive.
  *   **The Tension:** Reproduction is often cited as a criterion for life.
  *   **The Resolution:** Reproduction is a property of **lineages**, not individuals. An individual is alive if it maintains *its own* homeostasis. The mule creates and repairs itself (autopoiesis), even if it cannot create a *new* self.
      *   *Principle:* Individual life requires self-maintenance, not necessarily replication.

  #### 3. The Flame and The Crystal
  *   **Your Verdict:** Not Alive.
  *   **The Tension:** They grow and consume energy.
  *   **The Resolution:** They are **dissipative structures**, not autopoietic ones. A flame does not maintain a boundary; it spreads. A crystal grows by accretion (adding external material to the outside), not by internal production of components. Crucially, neither contains **encoded information** (a genome) that dictates their structure to resist entropy.
      *   *Principle:* Life requires internal information guiding self-construction, not just physical chemistry.

  #### 4. The Brain-Dead Human vs. The AI
  *   **Your Verdict:** Human = Unsure; AI = Not Alive.
  *   **The Tension:** If the human is alive due to function, why not the AI?
  *   **The Resolution:** This requires splitting the verdict.
      *   **The Tissues:** The cells in the brain-dead body are **living matter**. They metabolize and divide.
      *   **The Organism:** The human *organism* is **dead**. In a multicellular animal, the brain is the integrator. It coordinates the homeostasis of the whole. When the brain dies, the body becomes a collection of living tissues kept perfused by a machine, not a self-regulating unity. The heart-lung machine is doing the integrating, not the organism.
      *   **The AI:** The program lacks **physical embodiment**. Autopoiesis requires a physical boundary and physical self-repair. A program copying itself is information replication, not material self-maintenance.
      *   *Principle:* To be a living *organism*, the entity must physically integrate its own parts. The brain-dead body has lost integration; the AI lacks physical substance.

  ### Re-evaluating Your Verdicts

  Based on **Autopoiesis + Integration**, here is where you might adjust your confidence:

  1.  **Brain-Dead Human on Machines:** You should feel confident calling this **not alive** (as an organism). It is a collection of living cells, but the *system* that makes them a "human" is gone. This aligns with medical and legal standards (brain death = death). This removes the tension with the AI; neither is an integrated, self-sustaining physical organism.
  2.  **Synthetic Cell:** **Alive.** If it metabolizes and divides from its own internal code, it meets the autopoiesis criterion regardless of being "lab-made." Substrate (carbon vs. silicon) matters less than process, but physical embodiment matters more than code.
  3.  **Computer Program:** **Not Alive.** It lacks a physical boundary and physical metabolism. If you put that program in a robot that physically repairs its own hardware using raw materials, you enter the gray zone of "synthetic life."

  ### Unmentioned Cases

  Here is how the principle applies to your new cases:

  **1. A Frozen Embryo**
  *   **Verdict:** **Alive (Dormant).**
  *   **Reasoning:** Like the bacterial endospore. It is a multicellular state where metabolism has paused, but the autopoietic machinery is intact and integrated. It has the potential to resume self-maintenance and development. It is not merely "tissue"; it is an organism in waiting.

  **2. A Self-Sustaining Alien Machine**
  *   **Verdict:** **Depends on your definition of "Life" vs. "Mechanism."**
  *   **Reasoning:** If a probe lands, mines ore, refines fuel, repairs its own hull, and builds copies of itself using encoded instructions, it satisfies **Autopoiesis**.
      *   *Biological Bias:* If you define life as "carbon-based wet chemistry," it is not alive.
      *   *Functional Definition:* If you define life as "a self-sustaining chemical/physical system capable of Darwinian evolution" (the NASA definition), it **is alive**.
      *   *Recommendation:* Most astrobiologists would classify this as **life**, or at least "non-terran life." Your hesitation likely stems from "substrate chauvinism" (the idea that life must be squishy). If it evolves and maintains itself, the distinction between "machine" and "organism" dissolves.

  ### Summary: The Cluster Concept

  You are struggling because "Alive" is not a binary switch in nature; it is a **cluster concept** (a la Wittgenstein). Things are "alive" if they possess enough of the following family resemblances:

  1.  **Metabolism** (Energy processing)
  2.  **Homeostasis** (Internal regulation)
  3.  **Organization** (Cellular/Structural)
  4.  **Growth** (Increase in size/complexity)
  5.  **Adaptation** (Evolutionary response)
  6.  **Response to Stimuli**
  7.  **Reproduction**

  *   **The Mule** fails #7 but passes the rest.
  *   **The Virus** passes #5 and #7 (with help) but fails #1 and #2.
  *   **The Flame** passes #1 and #4 but fails #2, #3, and #5.
  *   **The Spore** pauses #1 but retains the *capacity* for all of them.

  **Final Advice:**
  Keep your verdict on the **Brain-Dead Human**. Classify them as **dead**. This is the only way to maintain consistency with the **AI** verdict. If a human kept going by external pumps is "alive," then a server farm keeping an AI running is also "alive." If you agree the AI is not alive, you must admit that external maintenance without internal integration does not constitute the life of an *organism*.

  You are left with a definition that is **functional, not magical**: Life is matter that organizes itself to resist entropy, using internal information to maintain a boundary between "self" and "world."
