answer: |-
  Thank you for being here. Thank you to the library staff for preparing the shelves, and to the producers and funders who made this film possible. Thank you to the students who will study this material long after we are gone. And thank you, Naomi, for sitting with us today.

  We are gathered to move boxes. Inside them are scripts, call sheets, design sketches, and production notes. Soon, they will sit on shelves next to Hallie Brant's own papers: her case files, her letters, the cassette recordings of tenant meetings. This proximity is intentional, but it is not neutral. When an archive accepts a production collection alongside a personal collection, it is agreeing to preserve not just the record of a life, but the record of our interpretation of that life. It is agreeing to keep the questions we asked alongside the answers she gave.

  I want to speak briefly about the distance between those two things.

  A biographical film is a translation. It moves a life from the messy continuity of memory and document into the structured continuity of narrative. In that movement, things are lost, and things are added. I want to name three specific additions in *Rent Strike*, not to defend them as artistic necessities, and not to confess them as sins, but to acknowledge them as choices that carry weight.

  First, there is a character named Del. Del is a composite, standing in for three distinct organizers who worked alongside Hallie. In the interest of narrative economy, three histories became one. This makes the story clearer to an audience, but it makes the record less precise. Real people were condensed into a single function. When you box these scripts, you are boxing that condensation. It is a fiction that serves the plot, but it erases the specific texture of the movement Hallie built.

  Second, there is a public speech Hallie gives in the film. The words are hers, taken from private letters she wrote to friends. In life, she kept those thoughts private. In the film, she speaks them to a crowd. This changes the nature of the voice. It takes an interior confidence and makes it exterior performance. It suggests a public certainty she may not have felt at that moment. We have used her handwriting to build a voice she did not use in that room.

  Third, and most difficult, there is a final encounter between Hallie and her estranged brother. In the film, they reconcile. She speaks lines of forgiveness. In reality, according to the family, that meeting did not happen. Those words were not said. This invention breaks a undertaking we gave to the estate—a silence rule that Hallie would never be given a line she is not on record as having said. We broke that rule. We put words in her mouth at the end of her life that she did not speak.

  I tell you this because the dead cannot correct us. That is the specific vulnerability of biography. When we write about the living, they can object. They can sue, or they can write their own memoir, or they can simply tell us we are wrong. When we write about the dead, the record becomes unilateral. My friend, a documentarian, told me that the wrong we might be doing here isn't a harm to Hallie, since there is nobody left to be harmed. She called it a betrayal: a misuse of a voice that can't answer back. An unfairness in the record that can never be repaired by the person it was done to.

  She also said the opposite: that a dramatization can be true to someone in a sense that isn't the same as being accurate. That a scene built out of private sentences can sometimes say something about a person that the documentary record alone doesn't say.

  I believe both things are true. I also believe they cannot be fully reconciled.

  So, what do we owe someone who no longer exists? We owe them the integrity of their work, which stands apart from our telling of it. Hallie's legacy is in the tenants' unions that remain, the legal precedents set, the housing secured. That work is factual. It does not depend on this film. But we also owe the record a kind of honesty about our own intrusion.

  To the archivists: You are accepting these scripts into a collection of truth. I ask you to file them as what they are: records of our imagination, not hers. When a researcher pulls a box of Hallie's letters, they are hearing her. When they pull a box of my scripts, they are hearing me guessing at her. Please do not let the fiction settle into the fact. Keep the boundary visible. The value of this production archive is not that it completes the story, but that it documents where we departed from it.

  To the students: This is your field now. You will spend your careers deciding how to represent lives that are not your own. You will face the pressure to make things clean, to make things resolve, to make things meaningful. Sometimes, meaning requires invention. But invention has a cost. When you put words in a real person's mouth, you are borrowing authority you do not possess. I hope you argue about whether the cost was worth it. I hope you argue about whether a film can honor a subject while violating the strictures of their history. Do not accept my answers. Do not accept Hallie's silence as consent.

  And to Naomi: I know what was promised. I know what happened. I am not asking for your absolution tonight, and I am not claiming that this film restores anything that was lost. I only know that Hallie's life was large enough to contain contradictions, and perhaps our telling of it must contain them too. I cannot know what she would have thought of this room, or this screen, or these boxes. She is the only person here who cannot correct me, and that is why I must be careful not to speak for her.

  We are handing over these materials not to finalize the record, but to open it. The letters are here. The scripts are here. The truth is in the gap between them. Hallie's work continues regardless of how well we have captured it. Our job now is to ensure that the capture does not obscure the work.

  Thank you.
