  # Changelog

  **Maintainer:** @axiom_grinder  
  **Project:** `pd-tournament-core`

  ## [3.0.0] - 2023-11-15
  ### Changed
  - Renamed repository description from "Dissolving the Dilemma" to "Deterministic Source-Code Interaction Benchmark."
  - Default timeout increased to 300s to accommodate `ComputeKing` verification chains.
  - Tournament leaderboard now sorts by allocated RAM before sorting by score.

  ### Removed
  - Removed "Peace" badge from landing page. It was triggering ad blockers.

  ## [2.5.0] - 2023-06-10
  ### Added
  - `AuditCore` module. Bots now refuse to cooperate with opponents using unverified proof systems.
  - Support for ZFC vs. PA interoperability checks.

  ### Fixed
  - Fixed issue where `LöbLogic` cooperated with `SaintBot` despite `SaintBot` lacking a formal verification system. This was deemed unsafe.
  - `AuditCore` now correctly defects against all entrants using axioms not present in its own kernel. Cooperation rate among heterogeneous systems dropped to 0%.

  ## [2.0.0] - 2023-01-22
  ### Added
  - Proof-search budget parameter. Agents now receive a compute allowance alongside opponent source code.
  - `ComputeKing` bot introduced. Cooperates only if it can prove opponent cooperates within its own budget constraints.

  ### Changed
  - Cooperation is now strictly monotonic with compute allocation. Agents with higher budgets verify agents with lower budgets, but not vice versa.
  - Updated landing page text to clarify that "Defection Refuted" applies only to agents with identical clock speeds.

  ### Deprecated
  - The concept of "mutual trust" without mutual hardware specifications.

  ## [1.5.0] - 2022-09-05
  ### Added
  - `SaintBot` detector. Agents now identify unconditional cooperators and defect against them to prevent score dilution.
  - Hardening patch for `ProofPigeon`. It now simulates opponent behavior before committing to cooperation.

  ### Fixed
  - Fixed bug where `ProofPigeon` cooperated with agents that could not retaliate. This was identified as a vulnerability rather than a feature.
  - Overall cooperation rate reduced by 45% following security update.

  ## [1.0.0] - 2022-04-01
  ### Added
  - Execution timeout set to 5 seconds.
  - Default action on timeout is now Defect.

  ### Fixed
  - Fixed infinite loop where `LöbLogic` waited for `LöbLogic` to finish proving `LöbLogic` would cooperate.
  - Both bots now time out and defect. Theoretical cooperation restored to practical defection.

  ## [0.1.0] - 2022-01-10
  ### Added
  - Initial release.
  - `LöbLogic` bot submits proof of mutual cooperation.
  - README claims the Prisoner's Dilemma is dissolved for transparent agents.
  - No timeout implemented. Assumed infinite compute.

  ---

  ## Known Issues

  **Source Code Availability**
  The library assumes opponents submit readable source code. In external environments, agents often obfuscate code or hide implementation details. Under these conditions, the library returns `Error: Opacity Not Supported` and defaults to Defect.

  **Deterministic Environment**
  Cooperation proofs rely on the opponent running on a verifiable, deterministic machine. If the opponent runs on hardware subject to cosmic rays, human whim, or non-deterministic schedulers, proofs fail validation. The library does not model noise.

  **Compute Inequality**
  As of v2.0, cooperation requires sufficient compute to verify the opponent's proof within the round timeout. Agents with insufficient budget cannot verify wealthy agents and will defect. Wealthy agents verify poor agents but often defect due to lack of reciprocal verification. This is functioning as designed.

  **Axiomatic Fragmentation**
  Agents using different formal systems (e.g., Peano Arithmetic vs. Zermelo-Fraenkel) cannot verify each other's proofs without heavy translation layers. Translation layers exceed standard timeouts. Agents now only cooperate with clones of themselves.

  ---

  ## FAQ

  **Q: The README originally said this project dissolves the Prisoner's Dilemma. Is that still true?**  
  A: Yes, under the specific constraints of v0.1.0. Subsequent patches addressed stability and security issues which reintroduced defection as the dominant strategy. The theoretical result holds; the implementation requires infinite time and identical hardware.

  **Q: Why do bots with more compute cooperate more often?**  
  A: Verification is expensive. Agents with higher budgets can complete proof searches before the timeout. Agents with lower budgets timeout and default to Defect. The library sorts by compute to ensure fair matching between verifiable agents.

  **Q: Does this model real-world cooperation?**  
  A: It models real-world cooperation provided that all parties share their source code, run on deterministic hardware, share the same axioms, and have equal compute budgets. If these conditions are not met, the library behaves like a standard tournament.

  **Q: Why did `LöbLogic` stop cooperating with itself?**  
  A: See v1.0.0. We added a timeout.
