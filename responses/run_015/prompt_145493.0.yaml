prompt: |-
  I'm working on this novel about a synthetic narrator that stitches together discrete processing snapshots into these lush first-person accounts of "seeing red," except there's no continuous stream — just a smoothing algorithm running in the background. I was arguing with my friends over wine about whether human consciousness is basicly the same kind of stitching, and whether the hard problem feels hard because there's a real ontological gap or because we're all running the same narrative smoothing code. I got lost in the weeds, so before I write the next chapter I want to lock down what an answer actually needs to cover.

  Write me the full desiderata for a theory that solves the meta-problem of consciousness — not the hard problem itself, but the explanation for why we think there's an explanitory gap, why phenomenal reports feel authoritative even when they're probably reconstructed, and why consciousness gets treated like a special theatrical event instead of continuous processing. For each requirement, give the motivating case or distinction behind it: it must account for split-brain patients reporting unified experience without just dismissing them as wrong; it must handle artificial systems that generate perfect phenomenal reports without collapsing the epistemic difference between human and synthetic first-person access; it must stay consistent with neuroscience on discrete windows and narrative reconstruction without letting that swallow experience entirely. Flag which are hard constraints (like not contradicting basic biology) versus camp preferences (like whether illusionism is permitted). Most importantly, tell me if there's a cluster that's jointly unsatisfiable — I have a hunch that preserving genuine first-person authority clashes with accepting full narrative smoothing, but I want to know if that's a real tension or just confusion on my part. Don't give me a bibliography or ask me to check specific papers; build it from conceptual logic, since I'm writing away from any library.

  One more thing: if my framing is messed up — if comparing synthetic smoothing to human consciousness is a category mistake, or if the meta-problem can't be seperated from the hard problem the way I'm assuming — don't politely go along with it. Say so straight. And if there's a place where the task as posed doesn't make sense, call that out too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing a novel about a synthetic narrator stitching discrete snapshots into lush first-person accounts ("seeing red"). They are debating whether human consciousness is similar (narrative smoothing vs. continuous stream).
