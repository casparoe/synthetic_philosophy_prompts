answer: |-
  Marcus slammed the consent form onto the glass table. The coffee cups jumped. "It's a lie, Elena. 'Twenty-five percent chance.' There is no chance. There is certainty."

  Elena didn't look up from her terminal. "There is subjective uncertainty for the pre-branch agent. Operational uncertainty."

  "Don't give me the Deutsch-Wallace spiel. You're smuggling the Born rule into the rationality constraints. It's circular. You say a rational agent bets on squared amplitude because... because you defined rationality that way."

  "Because any other way leads to Dutch books," Elena snapped, finally looking at him. She spun the monitor around. "If you treat the branches as equiprobable counts, you lose money. Look at the calibration. Villa is amplitude point-five. Squared, point-two-five. The bed outcomes are split. Two branches, amplitude point-six-one each? No, wait, setup says 0.375 each."

  She tapped the screen hard. "One villa branch. Two bed branches. If you count worlds, it's one in three. Thirty-three percent. But the interference patterns dictate quarter-weight. If you bet at one-in-three odds, the house bankrupts you. The math forces the weight."

  "The math forces the *weight*," Marcus corrected, leaning in until his reflection overlaid the wavefunction. "Not the probability. Weight is how much I care about my future self, not whether he exists. In your theory, the bed-self *definitely* exists. The villa-self *definitely* exists. The form tells them one happens *instead* of the other. That's single-world baggage you're selling to keep the regulators off our backs."

  "It's how they experience it!" Elena stood up, pacing the small office. "Subjective uncertainty. They don't know which branch they'll track."

  "They track both! There is no 'which'. There is only 'where'. You're asking them to sign away rights based on a coin flip that lands on both heads and tails."

  "Try explaining that to a volunteer," Elena said. "Tell them, 'You will definitely wake up in bed, but you should care less about that version.' They'll think they're doomed to the bed. The 25% line is the only thing that gets them in the chair."

  "Then don't put them in the chair," Marcus said. "Or tell the truth. 'Measure of existence.' 'Caring metric.' Anything but 'chance'. Chance implies exclusivity. You're relying on their single-world intuition to sell a many-worlds product. That's fraud."

  "It's translation," Elena said. "In the equal amplitude case, counting works. One villa, three beds, equal weight. One in four. People get that. But when the amplitudes skew, like here, counting breaks. You need the squared amplitude to guide action. That *is* what probability does. It guides action."

  "It guides action because you told it to," Marcus said. "You built the machine to decohere that way. You're conflating 'what I should bet' with 'what will happen'. In this room, everything happens. The consent form says otherwise."

  Elena sighed, rubbing her temples. "If I change the wording, Ethics shuts us down. They want risk assessment. Risk requires probability."

  "Then shut us down," Marcus said. "Better than lying about the nature of reality to get a signature."

  "Reality doesn't pay the power bill," Elena said. "Coherence does."

  Verdict: Marcus won because informed consent requires truth about ontology, not just operational betting strategies.
