prompt: |-
  hey, I'm writing teh final for my upper-level phil of mind seminar (juniors and seniors). I want one essay prompt about virtual harms that can't be answered by just repeating the standard 'virtual rape' debate or listing theories. So here's a made-up scenario to force them to think: in an immersive virtual world, users create 'persistent relational objects' — shared artifacts that other users genuinely depend on emotionally. These objects can be 'unworlded': not deleted, but moved to an archival server state where they technically still exist but are no longer interactable in the shared world. The user who unworlds them might not know anyone depends on them. The dependents experience real grief, but nothing physical was destroyed, and the object wasn't annihilated.

  Write me the exam question (75 minutes, about 700 words), a model answer, and a marking scheme out of 20. The scheme should split an A from a B by naming the exact moves: do they separate harm-to-the-object from harm-to-the-relation, do they tackle whether ignorance of dependents changes the wrongness, do they explain why 'it's just code' fails, and do they avoid collapsing the case into physical absence? Also list the specific mistakes that should cost marks — like treating unworlding as deletion, or assuming virtual absence is automatically unreal absence. If this whole setup is actually just a confused version of some well-known problem and there's no point treating it as novel, tell me plainly instead of writing the exam.
