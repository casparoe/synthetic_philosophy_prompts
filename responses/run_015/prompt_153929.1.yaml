  [She steps to the podium, adjusting her glasses. She shuffles a stack of index cards that look well-worn, some with coffee stains. She smiles at the room, lingering for a second on a man in the front row—her brother—and a teenager slouching near the back—her granddaughter.]

  Thank you. It's good to see so many familiar faces, and some new ones too. Seventy years feels like a long time until you stand up to speak about a man who's been dead for nearly a hundred and fifty, and you realize how short a blink it is.

  We titled this conference *Darwin's Ghost*, which sounds spooky. But the ghost I'm interested in isn't a haunting. It's a worry. A specific, quiet worry Darwin kept in his private notebooks, the ones from the late 1830s that many of you in this room have held in your own hands. He wasn't worried about finches. He was worried about us.

  Darwin understood that our moral feelings likely grew out of social instincts. We care for our offspring. We protect the tribe. That's biology; that's survival. But then he noticed something strange. We feel pain when a stranger suffers. We send money to people we will never meet, across oceans we will never cross. 

  Darwin wondered if this was a mistake. He worried that our sympathy for strangers was just an overextension of parental care—that natural selection built a machine to love our children, and we accidentally let it run too long, spilling love onto people who share none of our genes. He wondered if universal morality was a biological glitch.

  [She pauses, looks down at her cards, squinting slightly.]

  And if it is a glitch... does that mean the obligation isn't real? If we only care because of instincts we recieve—sorry, these cards are messy—because of instincts we *receive* from evolution, does that make the care less holy? Less binding?

  This is where I need us to be careful. To my colleagues here: we cannot say morality is *just* biology. Knowing the origin of a feeling does not license us to dismiss its value. Knowing why we love doesn't tell us whether we *should* love. That choice comes after the instinct kicks in.

  And to my family... [She looks at her brother.] ...I know some of you find the source of that love in the divine. I find it in the deep history of the mammalian brain. But look at the fruit, not just the root. Whether you call it grace or evolved social instinct, the result is the same: a willingness to suffer for someone who cannot pay you back.

  For those of you who think this science is dry... [She nods toward her granddaughter.] ...think about it this way. If Darwin was right, and our care for strangers is an overextension, then we are the only species that deliberately keeps the machine running when nature says to shut it off. We are the only animals that treat a glitch as a feature.

  That is the structural work we have to do today. We cannot use evolution to excuse selfishness. We cannot say, "Nature is cruel, so I can be too." Nature is indifferent. We are not. We have the capacity to take those narrow, tribal instincts and stretch them until they cover everyone in this room, and everyone outside it.

  Darwin's ghost isn't here to tell us we are machines. He's here to remind us that we are builders. We build meaning on top of instinct. We build obligation on top of impulse.

  So, let's not spend this conference arguing about whether morality is real because it's evolved, or fake because it is. Let's agree that the feeling is real, the suffering is real, and the work is waiting. We don't need design to have purpose. We just need the courage to keep extending that care, even when it doesn't make sense, even when it costs us.

  Thank you.

  [She taps the cards together, smiles warmly, and steps back.]
