answer: |-
  ### Brainstorm: Pressure Points in the Right-Reason Requirement

  Before drafting the questions, we need to isolate where the "right-reason" view (often associated with Kantianism, though not exclusively) actually bleeds. The literature suggests three major fault lines:

  1.  **The Phenomenology of Motivation (The Guilt/Prudence Problem):** The distinction between acting *from* duty and acting *in accordance* with duty is clean in theory but messy in psychology. If an agent acts to avoid the pain of guilt, are they acting from a moral concern (since guilt is a moral emotion) or from prudential self-interest (avoiding pain)? If the former, the requirement becomes too easy to satisfy; if the latter, it excludes almost everyone who hasn't achieved moral sainthood.
  2.  **The Epistemic Gap (The False-Belief Problem):** Does moral worth require tracking *objective* moral reasons or *subjective* take on reasons? If objective, then a conscientious agent acting on a false moral theory (e.g., a utilitarian in a deontological world) lacks moral worth, which seems harsh. If subjective, then moral worth becomes unmoored from actual morality, turning it into a measure of sincerity rather than goodness.
  3.  **The Content of the Reason (The Consequentialist Problem):** If the "right reason" is simply "to do what is morally required," a consequentialist can satisfy this. But usually, defenders of this view mean a specific *kind* of reason (e.g., respect for persons, not just aggregation of value). If the consequentialist is excluded, the view risks looking sectarian. If they are included, the view loses its critical bite against utilitarianism.

  ***

  ### Interview Questions

  **1. The Value of Worth**
  Let's skip the shopkeeper. I want to start with the stakes. You argue that an act lacks *moral worth* if it isn't done for the moral reason itself. But suppose we have two agents: one helps a stranger purely out of spontaneous sympathy, the other helps purely out of a cold sense of duty. Both help effectively. Why does it matter for our evaluation of the *act* that the second agent had the "right" reason? What work is "moral worth" doing here that "right action" or "good character" isn't already doing?

  **2. The Indirect-Reason Case (Guilt Avoidance)**
  Consider an agent who helps a stranger not out of benevolence or duty, but because they know that if they didn't, they'd be plagued by guilt for the rest of the day. They are effectively dodging a negative moral emotion. On your view, is this agent acting for the moral reason? Is the anticipation of guilt close enough to the demand of morality to confer moral worth, or is this just prudence in moral clothing?

  **3. Follow-up (Guilt Case)**
  *If you say this is **not** moral worth:* You're drawing a hard line between avoiding pain (even moral pain) and respecting the law. But for many agents, the feeling of guilt is the only phenomenological access they have to the moral law. If we exclude the guilt-avoider, are we reserving moral worth only for those with a very specific, perhaps rare, psychological constitution?
  *If you say this **is** moral worth:* Doesn't this open the door to any self-regarding motive? If I help you to avoid guilt, why wouldn't helping you to gain social praise also count, provided I view that praise as a marker of my moral standing? Where does the "right reason" stop?

  **4. The False-Belief Case**
  Let's introduce error. Imagine a conscientious agent who acts for what they sincerely believe is the right moral reason, but their moral theory is flat-out wrong—for instance, they refuse to lie to a murderer at the door because they believe lying violates cosmic harmony, when in fact (let's assume) the moral reason to lie is overwhelming. They are acting for a "right reason" in their mind, but not the *actual* right reason. Does their act have moral worth? Does worth track the objective reason or the subjective motivation?

  **5. Follow-up (False-Belief Case)**
  *If you say they **lack** moral worth:* This implies that moral worth is subject to moral luck. Two agents act identically with identical sincerity, but one gets the metaphysics right and one doesn't. The one who gets it wrong is denied moral worth. Does this make moral worth an elitist property that depends on having the correct moral education rather than the quality of one's will?
  *If you say they **have** moral worth:* Then moral worth seems to come apart from moral correctness. We would have to say an act can have full moral worth even if it was objectively the wrong thing to do. Are you comfortable severing the link between moral worth and objective moral truth?

  **6. The Consequentialist Case**
  Now take a committed consequentialist. They help a stranger solely because they want to maximize the overall good. They are acting for a moral reason—their moral theory demands it. Does this agent secure moral worth on your account? Or is "maximizing the good" the wrong *kind* of reason, regardless of how sincerely it's held?

  **7. Follow-up (Consequentialist Case)**
  *If you say they **lack** moral worth:* Then the right-reason requirement isn't just about acting from morality; it's about acting from *your specific metaethic*. If the consequentialist is excluded, what is left of the Kantian claim that this view captures the universal conditions of moral agency? Are you essentially saying that only a deontologist can perform an act of moral worth?
  *If you say they **have** moral worth:* Then the distinction between your view and standard consequentialism collapses. If "doing it because it's right" is satisfied by "doing it because it maximizes utility," what critical work is the right-reason requirement left to do? Does it lose its power to criticize agents who treat people as mere means to the good?

  **8. The Fetishism Objection**
  Finally, a worry from Michael Smith and others: If I act *in order to* secure moral worth, or *in order to* act for the right reason, haven't I made my own moral purity the object of my concern rather than the person I'm helping? Isn't focusing on the "right reason" a form of moral self-indulgence? How do you defend the right-reason requirement against the charge that it turns morality inward, valuing the agent's state of mind over the patient's well-being?
