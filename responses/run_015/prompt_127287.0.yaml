      *   *Position 2 (Restructuring/Downward Causation):* High-level patterns *do* have causal efficacy, but not by violating physics. They constrain the low-level possibilities.
      *   *Category Mistake:* Rylean concept. Treating a concept from one logical type as if it belongs to another (e.g., asking where the "University" is after seeing all the buildings).
