prompt: |-
  I'm putting together the closing session of a graduate seminar I teach on evidence, underdetermination, and the so-called historical sciences, and I've asked a colleague from our anthropology department — an archaeologist who works on later prehistoric settlement — to come in as a respondent. The session is built around a distinction I've been developing in my own work and want to defend in front of her. Call the first class inert residues: the unintended by-products of behaviour, such as the sheen on a sickle blade, strontium and oxygen signatures in tooth enamel, the spacing of postholes, the species and age profile of faunal material in a ditch fill. Call the second class legible residues: things produced at least partly in order to be read by somebody else — sealings, standardised weights and measures, coinage, monumental iconography, written records, and deliberate deposits that seem to quote or re-stage earlier deposits. The claim I want to make is that only legible residues can carry an inference to institutions. The argument is short: an institution — a postmarital residence rule, a debt-tribute obligation, a levy on grain, a regime of heritable rights in land — is a set of rules, and rules have to be representable to the people who live under them; where nothing was made to be read, there was no rule there to recover, only behaviour. So, on my view, the current wave of confident claims about Neolithic institutions, resting on ancient DNA and isotope work at sites with no seals, no metrology and no iconography, is overreach, and the honest inference stops at patterns of movement, diet and biological relatedness. My stock hypothetical in the seminar is a ditched enclosure in which the cattle bones carry pasture signatures from seventy kilometres away while the ceramics are local, and the aDNA shows that the adult women in the adjacent burials are the non-locals: I say this licenses at most a claim about where women came from, and not the claim that the community had a matrilocal marriage institution.

  What I need help with is how to hold that line without collapsing into positions I don't want to occupy. I'm not sceptical about meaning in material culture, and I don't want to sound like the old processual suspicion that belief and normativity lie permanently beyond the trowel; I also don't want to lean on the indiscriminate form of underdetermination, since I think bridging arguments really can be disciplined by formation theory, use-wear analysis and taphonomy. The step I'm least sure about is the one from rules must be representable to those who follow them to only artifacts made to be read can evidence rules. Is there a defensible formulation — perhaps restricted to codified institutions, or to institutions that are officially recognised as such by their participants — that lets me keep the scepticism about prehistoric kinship-and-debt claims while conceding that house plans, storage capacity and the treatment of the dead can tell us a good deal about what people were expected to do? And I'd welcome your view on a connected worry I have not been able to shake: on my account, ritual and symbolic seem to function as residual categories that we retreat to precisely when the residue is inert, which is very close to the methodological vice the contextual archaeologists complained about thirty-odd years ago.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**

      *   **Context:** Closing session of a graduate seminar on evidence, underdetermination, and historical sciences.
      *   **Guest:** An archaeologist (anthropology dept) working on later prehistoric settlement.
      *   **User's Core Distinction:**
          *   *Inert Residues:* Unintended by-products (sickle sheen, isotopes, posthole spacing, faunal profiles).
          *   *Legible Residues:* Made to be read (seals, weights, coins, iconography, texts, deliberate deposits).
      *   **User's Core Claim:** Only *legible residues* can support an inference to *institutions* (rules representable to participants). Inert residues only show behavior/patterns (movement, diet, relatedness), not rules/norms (matrilocal residence, debt-tribute).
      *   **The Problem:** The user wants to defend this line without collapsing into unwanted positions:
          *   Not a processual skeptic (believing norms are unreachable).
          *   Not a radical underdetermination skeptic (bridging arguments *are* possible via formation theory, etc.).
          *   Worried about the step: "Rules must be representable" $\rightarrow$ "Only artifacts made to be read evidence rules."
          *   Worried about "Ritual/Symbolic" becoming a residual category for inert data (a methodological vice criticized by contextual archaeologists like Hodder).
      *   **Goal:** A defensible formulation that maintains skepticism about Neolithic institutional claims (based on aDNA/isotopes) while conceding that material patterns (house plans, storage, burial treatment) tell us about *expectations*, and avoiding the "ritual as residue" trap.

  2.  **Deconstruct the Core Argument & Identify Weak Points:**

      *   *Premise 1:* Institutions are sets of rules.
      *   *Premise 2:* Rules must be representable to those who live under them.
      *   *Premise 3:* Representation requires "legible residues" (made to be read).
      *   *Conclusion:* Inert residues cannot evidence institutions.
      *   *Critique:* Premise 3 is the weak link. Do rules *always* require explicit, designed communication (legibility)? What about embodied habits, tacit knowledge, or material constraints that *function* as rules without being "read" like a text?
      *   *The "Ritual" Worry:* If I can't explain it functionally/institutionally via legible residues, do I just call it "symbolic"? This risks the "anything we don't understand is ritual" fallacy.

  3.  **Brainstorming Solutions/Refinements:**

      *   *Refining "Institution":* Maybe distinguish between *formal/codified institutions* (requiring legibility) and *informal/normative practices* (accessible via inert residues). The user mentions "codified institutions" as a possible restriction. This is promising.
      *   *Refining "Legible":* Expand legibility beyond "made to be read" to include "affordances that constrain/enable." A house plan isn't a text, but it *prescribes* movement. Is that a rule?
      *   *Refining "Representable":* Representation doesn't have to be semantic (like writing). It can be pragmatic. A threshold represents "inside/outside."
      *   *Addressing the Archaeologist Guest:* She works on later prehistoric settlement. She likely deals with house plans, storage, burial. She will push back on the idea that she can't say anything about social organization without seals. The user needs a position that respects her expertise while maintaining the philosophical distinction.
      *   *Addressing the "Ritual" Worry:* Avoid using "ritual" as a trash bin. Instead, frame inert residues as evidence of *habitus* (Bourdieu) or *routine*, which is distinct from *institution* (explicit rule).

  4.  **Developing the Defensible Formulation:**

      *   *Idea 1: The "Claim to Authority" Criterion.* Institutions aren't just regularities; they are regularities backed by a claim to legitimacy. Legible residues are claims to legitimacy. Inert residues are just regularities.
      *   *Idea 2: "Normativity" vs. "Regularity".* Inert residues show regularity (what people *did*). Legible residues show normativity (what people *ought* to do). The gap is the "ought."
      *   *Idea 3: "Explicit" vs. "Implicit" Institutions.* Maybe concede that inert residues show *implicit* institutions (habits), but only legible residues show *explicit* institutions (laws/rules). The user's specific target is the "confident claims about Neolithic institutions" (often framed as formal rules like "matrilocal residence").
      *   *Idea 4: Material Normativity.* Some things *are* rules without being texts. A wall stops you. Is that an institution? No, it's a constraint. A shrine stops you. Is that an institution? Yes, a religious one. What's the difference? Collective recognition. How do we see collective recognition? Legible residues.

  5.  **Drafting the Response Strategy:**

      *   **Acknowledge the Strength:** The distinction is sharp and philosophically interesting. It challenges the "scientism" in current archaeology (aDNA/isotopes).
      *   **Address the "Step" Worry (Rules $\rightarrow$ Legibility):** This is the crux. Suggest modifying the definition of "Institution" or "Legible."
          *   *Suggestion:* Distinguish between *Operative Regularities* (inert) and *Deontic Institutions* (legible).
          *   *Suggestion:* Broaden "Legible" to include *Material Affordances with Normative Force*. A storage bin isn't just a hole; it's a claim on surplus.
      *   **Address the "Ritual" Worry:** This is about explanation, not classification. Don't call it ritual because it's inert. Call it ritual if there's evidence of *non-utilitarian signaling* (which might be legible residue!). If it's inert, call it "practice" or "habitus."
      *   **Engage the Guest:** How to frame this so the archaeologist doesn't feel dismissed? Frame it as a division of labor: Science gives the *conditions of possibility*, Legibility gives the *social logic*.
      *   **Specific Terminology:** Use terms like "Deontic Power" (Searle), "Habitus" (Bourdieu), "Affordance" (Gibson/Norman).

  6.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* If I broaden "legible" too much, the distinction collapses. I need to keep the user's core intuition (text/seal vs. bone/pollen) but make the philosophical justification tighter.
      *   *Focus:* The key is *reflexivity*. Institutions require people to know they are following a rule. Legible residues are evidence of that reflexivity. Inert residues are evidence of behavior, which *might* be rule-following, but could also be ecological adaptation.
      *   *The "Ritual" Trap:* The trap is assuming "if it's not economic/functional, it's ritual." The solution is to treat "symbolic" as a mode of action, not a residual category. Legible residues are often symbolic. Inert residues are often functional. But functional things can be institutional (e.g., a standardized weight).
      *   *Proposal:* Shift from "Legible vs. Inert" to "Reflexive vs. Non-Reflexive Evidence." Or keep "Legible" but define it as "Evidence of Reflexivity."

  7.  **Finalizing the Advice:**

      *   **Validate:** The distinction is valuable against "pattern = institution" fallacies.
      *   **Tweak the Premise:** Move from "Rules must be representable" to "Institutions require *common knowledge* of the rule." Legible residues generate common knowledge. Inert residues do not necessarily.
      *   **Handle the Archaeologist:** Concede that inert residues show *constraints* and *habits*, which are the *substrate* of institutions, even if not the *proof* of them.
      *   **Handle the Ritual Worry:** "Ritual" shouldn't be the explanation for inert data. "Ritual" is a specific type of legible residue (performative). If it's inert, it's just behavior. Don't label it ritual; label it "unexplained regularity."

  8.  **Structure of the Response:**
      *   Introduction: Validate the project and the distinction.
      *   Section 1: Strengthening the "Rules $\rightarrow$ Legibility" link (The Common Knowledge Argument).
      *   Section 2: Refining the scope (Deontic Institutions vs. Behavioral Regularities).
      *   Section 3: Addressing the "Ritual as Residue" worry (Semantics vs. Pragmatics).
      *   Section 4: Engaging the Archaeologist (Division of Labor).
      *   Conclusion: Summary of the defensive line.

  9.  *(Self-Correction on the "Ritual" point)*: The user worries that "ritual/symbolic" becomes the place we put inert stuff we can't explain institutionally. I need to suggest that *ritual is often legible*. Deliberate deposits are legible. So the distinction actually *helps* avoid the ritual trap, provided we don't label inert stuff as ritual just because it's weird. I should emphasize this.

  10. *(Final Polish)*: Ensure the tone is academic, respectful, and helpful for a seminar closing. Use philosophical precision (Searle, Wittgenstein, Bourdieu) where appropriate but keep it grounded in archaeology.

