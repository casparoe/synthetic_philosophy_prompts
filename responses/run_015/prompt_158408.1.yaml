answer: |-
  This is a sophisticated and high-stakes methodological intervention. You are effectively challenging the "pattern-to-norm" inference that dominates much current bioarchaeology and settlement archaeology, without retreating into a processual nihilism about social meaning. Your distinction between *inert* and *legible* residues is powerful, but as you suspect, the bridge from "rules must be representable" to "only legible residues evidence rules" is the vulnerable point.

  Here is a strategy for holding that line in the closing session, refining the philosophical formulation, and disarming the "ritual as residue" worry.

  ### 1. Strengthening the "Rules $\rightarrow$ Legibility" Link
  Your current formulation rests on the idea that rules must be *representable*. An archaeologist respondent might counter: "People follow traffic rules even when signs are faded; they follow kinship rules without writing them down. Why does the *archaeological visibility* of the representation matter?"

  To defend your position, shift the argument from **representation** to **common knowledge** (or reflexivity).

  *   **The Argument:** An institution is not just a regularity in behavior (which inert residues show); it is a regularity backed by a shared expectation that others expect you to follow it. This is what distinguishes a *rule* from a *habit* or an *ecological constraint*.
  *   **The Role of Legible Residues:** Legible residues (seals, monuments, standardized weights) are not just "messages"; they are **public coordination devices**. They make the rule *common knowledge*. A strontium signature in a tooth shows where a woman walked; it does not show that her community *expected* her to walk there, nor that others knew they were expected to marry women from there.
  *   **The Formulation:** Do not claim that rules *cannot exist* without legible residues. Claim that **institutions cannot be archaeologically distinguished from behavioral regularities without evidence of reflexivity.** Legible residues are the material trace of that reflexivity.
  *   **The Concession:** You can concede that inert residues (house plans, storage) show *normative pressure* or *affordances*. A house plan constrains movement; a granary constrains access. These are the *substrate* of institutions. But without a legible residue (e.g., a seal on the granary, a specific ritual deposit in the house), you cannot distinguish between a *rule* ("Only the chief stores here") and a *practical necessity* ("This is the only dry spot").

  **Seminar Phrasing:** *"Inert residues give us the physics of social life; legible residues give us the politics. We can see the flow of people (inert), but without a signal that this flow was mandated or recognized as a status marker (legible), we are describing demography, not kinship."*

  ### 2. Refining the Scope: "Deontic" vs. "Operative" Institutions
  You asked if restricting the claim to "codified institutions" helps. It does, but "codified" sounds too textual for prehistory. Instead, use the distinction between **Operative Regularities** and **Deontic Institutions**.

  *   **Operative Regularities:** Patterns of behavior caused by ecology, technology, or unreflective habit. (Evidenced by inert residues: isotopes, faunal profiles).
  *   **Deontic Institutions:** Rules that create *status functions* (e.g., "This person is a wife," "This grain is tribute"). These require collective intentionality. (Evidenced by legible residues: seals, iconography, deliberate deposits).

  **Why this helps:** It allows you to tell your archaeologist colleague: *"You are absolutely right that house plans and burial treatments show us what people **did** and what was **possible**. I am only arguing that to claim they show us what people **owed** or **recognized as right**, we need evidence of signaling."*

  This protects you from the processual charge (you aren't saying norms are unreachable, just that they require specific evidence) and avoids radical underdetermination (you admit inert residues are disciplined by formation theory, they just answer different questions).

  ### 3. Addressing the "Ritual as Residue" Worry
  This is a crucial methodological self-check. The vice contextual archaeologists (like Hodder) criticized was using "ritual" or "symbolic" as a trash bin for inert data that lacks a functional economic explanation.

  *   **The Trap:** "We found weird bones in a ditch. It's not food. Therefore, it's ritual."
  *   **Your Distinction as Solution:** Your framework actually *solves* this if applied strictly.
      *   If a deposit is **inert** (unintended by-product, mixed fill), do **not** call it ritual. Call it "refuse" or "unpatterned deposit." Admit ignorance about its social meaning.
      *   If a deposit is **legible** (deliberate, quoting earlier deposits, structured), **then** it is evidence of symbolic/ritual action.
  *   **The Shift:** You are not retreating to "ritual" when institutions fail. You are retreating to **"behavior"** when legibility fails.
  *   **Defense:** Tell the seminar: *"The old vice was to call anything non-economic 'ritual.' My distinction forces us to call anything non-legible 'inert.' If we cannot find the legible residue, we must remain agnostic about the institution, rather than filling the gap with 'symbolism.' Symbolism, like institutions, requires a sender and a receiver."*

  This turns the worry on its head: your framework prevents the "ritual" overreach just as it prevents the "institution" overreach.

  ### 4. Engaging the Archaeologist Respondent
  Your colleague works on later prehistoric settlement. She will likely argue that house size, storage capacity, and burial wealth *are* legible. They "speak" to neighbors about status.

  *   **The Counter:** Acknowledge that architecture has **affordances** that communicate. However, distinguish between **indexical signaling** (a big house implies labor power) and **conventional signaling** (a seal implies authorized storage).
  *   **The Compromise:** Suggest that architecture is **quasi-legible**. It creates *expectations*, but it is ambiguous. A big house could be a chief's residence (institution) or a multi-family cooperative (kinship strategy) or simply a response to storage needs (economy).
  *   **The "Killer" Example:** Use your ditched enclosure hypothetical.
      *   *Inert:* Cattle from 70km away + Non-local women.
      *   *Archaeologist's Inference:* Matrilocal residence institution.
      *   *Your Inference:* Pattern of movement.
      *   *The Test:* Ask the respondent: "What legible residue would change your mind?" If she says "None, the pattern is enough," she is conflating demography with law. If she says "If we found figurines of women in the central postholes," she admits legibility is required for institutional claims.

  ### 5. Summary of the Defensive Line
  To close the seminar without collapsing into skepticism:

  1.  **Affirm the Science:** Inert residues (isotopes, aDNA) are robust evidence for *biographies* and *ecologies*. They are not "less scientific" than legible residues.
  2.  **Limit the Claim:** They evidence *what happened*, not *what was ruled*.
  3.  **Define Institution Reflexively:** Institutions require common knowledge. Legible residues are the material trace of common knowledge.
  4.  **Avoid the Ritual Trap:** Do not classify inert residues as symbolic. Classify them as behavioral. Reserve "symbolic/institutional" for legible residues.
  5.  **Offer a Research Agenda:** The goal is not to stop studying Neolithic institutions, but to demand higher evidentiary standards. The challenge for the next generation is to find the **legible residues** in the Neolithic (deliberate deposits, standardization, iconography) rather than deriving laws from bones.

  **Final thought for the session:**
  You might frame this as a plea for **epistemic humility** rather than skepticism. *"We can know the Neolithic dead moved. We can know they ate cattle. To claim we know their marriage laws is to claim we can read their minds without their texts. Let us be satisfied with the biography until we find the law."* This positions you not as a blocker of knowledge, but as a guardian of its precision.
