prompt: |-
  hey, I need a hand prepping an episode and I'm running behind on it. Quick context: I'm a PhD student (philosophy, working on stuff adjacent to population ethics and the badness of death) and I co-host a very small interview podcast out of a borrowed seminar room. My co-host is out sick so I'm solo on Tuesday, 45 minutes, and next week's guest is Prof. Marta Kovács, who has a new book out — *The Successor Condition* — that I've read but not fully gotten my head around. Roughly: she accepts something like Scheffler's collective afterlife conjecture, the idea that we implicitly take for granted that humanity will outlive us and that a huge amount of what we do would lose its point if it didn't, so extinction would be bad in a way that isn't just the sum of the deaths involved. But her amendment is that the conjecture has the wrong object: what's doing the work isn't the survival of the biological species but the survival of a "normative community" — an intergenerational chain of beings who can recognize, take up, contest, and be answerable to the reasons we now have. So on her view extinction is a matter of degree rather than a binary, biological extinction wouldn't be bad at all if a successor population (uploads, a successor species, artificial agents trained into our practices) inherits the chain, and — this is the part I find wildest — some ways of humanity surviving are worse than extinction, e.g. a humanity that persists for millions of years but in which nobody is answerable to reasons anymore because everyone is permanently in some wireheading/flow state. She also insists the value here doesn't scale: it doesn't get worse the longer or bigger the future is, so she resists the longtermist inference to "maximize expected future people," while still insisting the loss is a loss for *us now*, agent-relatively. Her stock line, which she uses to deflect roughly every objection, is "extinction isn't an event, it's a process."

  You're a professional philosopher who specializes in the philosophy of death, value, and population ethics, and who's also booked and prepped guests for a hundred academic podcasts. Before you write anything, spend a short paragraph brainstorming which of Kovács's commitments are actually load-bearing (i.e. which ones she can't give up without the view collapsing back into Scheffler's) and where the literature on the afterlife conjecture presses hardest. Then write me eight to ten interview questions, each in this format: the question as I'd actually ask it out loud, a one- or two-line note on the reply she's most likely to give, and then a follow-up keyed to that reply. No generic stuff — no "what drew you to this topic," no "tell us about the book" — and every question should be self-contained enough that a listener who hasn't read her can follow it.

  What I specifically want covered: at least one question on why we aren't all depressed, i.e. if the value of everything we do hangs on a future we'll never see and we all accept that humanity ends eventually, why isn't the conjecture just empirically false given how calm we are (I bet she says the conjecture is about a near-term or "living" future rather than the heat death of the universe — so the follow-up has to press on where that cutoff comes from and whether the same move would show that dying at thirty is less bad than we think); one on whether it's really the species or the normative community that matters, and what would count as genuine succession (do uploads count? does a successor species that has no interest in us and never reads our stuff count?); one on whether the badness is aggregative at all — if it isn't the lost future lives doing the work, what is, and can the view generate a reason to avert extinction or to have children that isn't just the aggregative one everyone already accepts; one on timing, i.e. is extinction in 2200 worse for us now than extinction in the year 12000, and if so how is that more than disappointment; one on her reason-less-descendants case, pressing on whether the conjecture is a claim about value, about meaning, or about normativity itself, and whether it survives if you're an error theorist about normativity; and one question that uses her "it's a process, not an event" line against her — I want something that makes that line stop working as a deflection. Also, please build one question around a case I made up that I don't think she addresses in print: "the Last Valley," a settlement of a few thousand people who know with certainty that they are the final generation — no one will be born after them and no successor population is coming — but who otherwise go on with science, music, and friendship for another sixty years. Do their projects have the value ours do, do they have any reason to keep the lights on, and would she say this to their faces? Then close with one question that forces her to say what kind of evidence could count *against* the view — whether it's an armchair claim about our actual evaluative commitments, an empirical psychological hypothesis, or neither — and what she'd give up first. Keep the whole thing conversational rather than journal-ish, and aim for somewhere around a thousand words.
