answer: |-
  Here is a draft of the argument, written as a monologue or dialogue segment for your character. It is designed to be philosophically dense, avoiding the "soft" interpretation of non-absolutism, and focusing on the structural paralysis it creates for ethics.

  ***

  "You mistake the architecture for an open door. You think *anekantavada*—the doctrine of many-sidedness—is a bridge between traditions. It is not. It is a wall. A very sophisticated, epistemologically sound wall.

  Consider the mechanism. We predicate every claim with *syat*—'in some sense,' or 'conditionally.' Through the *saptabhangi*, the seven modes, we exhaust the logical possibilities of existence: it is, it is not, it is both, it is indescribable, and so on. The popular reading is that this humbles us. It makes us tolerant. But look closer at what happens to a moral claim when you run it through the seven modes.

  If I say, 'Violence is wrong,' I am making an *avadharana*, a definitive assertion. But *syadvada* demands I qualify it. 'In some sense, violence is wrong.' From the standpoint of the soul's purity, yes. From the standpoint of societal preservation, perhaps not. From the standpoint of the victim's karma, it is merely a fruition.

  Now, here is the trap. If every moral proposition is bound to a *naya*—a specific standpoint of partial validity—then there is no neutral ground where two *nayas* can collide and be resolved. To resolve a dispute, you need a tribunal. You need a meta-naya, a standpoint above the standpoints that can judge which *naya* is more authoritative in a given context. But *anekantavada* denies the existence of such a standpoint for any being who is not omniscient.

  This renders universalist ethics structurally incoherent. If you argue for human rights based on a universal nature of man, I must tell you that 'universal nature' is itself only a *naya*. It is valid *syat*—in some sense. But it cannot override the *naya* of the caste system, or the *naya* of the state, or the *naya* of the predator, because I have no metric to weigh them against each other. I can only say they are different facets.

  This does not open dialogue; it seals it. Dialogue implies the possibility of conversion, of one mind changing another because one argument is *better*. But if truth is fragmented across seven modes, 'better' loses its meaning. There is only 'appropriate for this standpoint.' We are not talking to each other; we are cataloging isolated epistemic silos. I cannot refute you, because your error is only a truth viewed from a different angle. And you cannot refute me. We are left in a paralysis of mutual validation where no action can be definitively chosen over another.

  You might bring up *kevalajnana*—omniscience. Yes, the Kevalin sees the whole substance in all its modes simultaneously. For the Kevalin, there is no contradiction. But for us? For the *samsarin* trapped in the cycle? The existence of the Kevalin only highlights our blindness. It reminds us that the 'whole truth' is inaccessible to debate. It is an object of reverence, not a tool for discourse.

  So, do not tell me this philosophy makes us inclusive. It makes us solitary. It protects the truth by removing it from the reach of human language. And in doing so, it seals off the very possibility of a shared moral world. We are left with infinite perspectives and no way to live together within them."

  ***

  ### Philosophical Breakdown (For your notes)

  If you need to defend this logic in later chapters, here is the structural backbone of her argument:

  1.  **The Problem of Normativity:** *Anekantavada* is primarily ontological (about being) and epistemological (about knowledge). The character argues it fails when applied to ethics (about action). Ethics requires *decision*, and decision requires excluding options. If all options are "true in some sense," the mechanism for choosing one over the other breaks.
  2.  **The Missing Meta-Naya:** This is the strongest logical critique. To adjudicate between View A and View B, you need View C (a standard). If View C is also just a *naya*, you need View D. This leads to an infinite regress. The only stopper is *Kevalajnana*, but since humans aren't omniscient, humans are stuck in the regress.
  3.  **Tolerance as Indifference:** She is arguing that what looks like tolerance is actually isolation. If I cannot say you are *wrong*, I am not engaging with you; I am merely observing you as a separate phenomenon. This kills the "moral dialogue" because dialogue requires the risk of being proven wrong.
  4.  **Saptabhangi as Exhaustion:** She uses the seven modes not to show complexity, but to show that language is incapable of capturing the imperative needed for ethics. If every statement can be negated or qualified by one of the seven modes, no moral law can stand firm enough to build a society on.

  This approach makes her sound like a rigorous logician who is wary of the "softening" of her tradition, which adds great depth to a philosopher character.
