answer: |-
  **Recommendation:** The commission should recommend Design B, the receipt-side scheme with a lifetime cumulative exemption, augmented by a deferral mechanism for illiquid assets and a strict beneficial-control test for charitable conversions.

  **The Baseline: Opportunity and the Unit of Analysis**

  To evaluate these designs, we must define the benchmark of equal opportunity. Political philosophy generally distinguishes between two conceptions. The *starting-gate* conception holds that justice requires equalizing initial stakes at a specific maturity point (usually adulthood), after which individuals bear the consequences of their choices. The *continuous* conception holds that advantages traceable to circumstance rather than choice must be counteracted whenever they appear, throughout life.

  Your suspicion is that Design A (transfer-side) fits a donor-centered account, while Design B (receipt-side) fits a continuous conception. I argue this partially misidentifies Design A's theoretical potential. Design A is often defended as a starting-gate mechanism: death acts as the reset button on the board. However, Design A fails this test logically. Because it taxes the estate rather than the recipient, it allows a single recipient to accumulate multiple starting advantages from different donors (parents, grandparents, trusts) without triggering progressive rates. It equalizes the *giver's* exit, not the *receiver's* entry.

  Design B, by tallying lifetime receipts, treats the recipient as the moral unit. While this looks like a continuous conception, it can be calibrated to function as a robust starting-gate mechanism. By setting a generous lifetime exemption, we tolerate moderate parental partiality while taxing only the accumulation of advantage that distorts the starting line. Design A presupposes that the moral wrong is the *concentration of the donor's* power at death. Design B presupposes the wrong is the *concentration of the recipient's* unearned advantage. For a commission charged with intergenerational equity, the recipient's position is the relevant metric. Design B is the only scheme that aligns with an opportunity-based baseline, whether starting-gate or continuous, because it tracks the actual distribution of advantage rather than the transactional event of death.

  **Legibility and the Grounds of Justice**

  Our economist correctly notes that most intergenerational advantage is legible only to the family, not the state: tuition payments, unpaid labor in family firms, social networks, and school district access. If equal opportunity is our sole ground, this legibility gap is fatal. We cannot tax what we cannot see, and a tax on formal wealth may miss the bulk of the advantage transmission.

  However, this does not justify abandoning the project; it requires shifting the justificatory ground from pure *equal opportunity* to *democratic reciprocity*. Even if we cannot equalize all advantages, we must prevent wealth from converting into political caste. Formal wealth is the most fungible instrument of political power. While we cannot tax a parent's social network, we can tax the capital that allows a recipient to leverage that network into dominance.

  This shift favors Design B. Design A taxes the stock of wealth at a single moment, which encourages fragmentation into untaxable flows (trusts, early gifts). Design B taxes the flow of advantage into a single individual's control. If the goal is preventing a hereditary political caste, limiting the total convertible resources any one citizen can acquire without labor is more effective than limiting what any one decedent can leave. The legibility problem implies we cannot achieve perfect equality, but Design B best secures the declaratory function of the tax: stating that citizenship is not compatible with dynastic accumulation of fungible power.

  **The Foundation Question: Charitable Vehicles**

  Families may attempt to convert taxable inheritances into permanently named charitable institutions that employ relatives and retain board seats. This preserves the dynasty under the guise of public benefit. To prevent this, the commission should adopt a "Functional Private Benefit" test.

  A vehicle should be treated as a taxable inheritance if it meets any two of the following criteria: (1) family members hold a majority of voting seats on the governing board; (2) more than 20% of the vehicle's annual expenditures compensate family members or entities they control; (3) the vehicle's assets serve as headquarters or operational infrastructure for family-owned businesses; or (4) the governing mission cannot be amended without family consent.

  The borderline case involves surrendering control but retaining the name. If the family relinquishes board control and employment benefits but retains naming rights in perpetuity, the vehicle should pass the test. Naming is a reputational benefit, not a control benefit. However, if the naming rights are coupled with a "advisor" role that influences grant-making, it fails. The criterion is *control over resource allocation*, not prestige. Commissioners can verify this through public filings regarding board composition and grant recipients.

  **The Objection from Family and Liquidity**

  The strongest case against Design B rests on the value of parental partiality and the reality of illiquid assets. The objection is not merely about double taxation or capital flight, but about the constitutive nature of the family. The freedom to provide for one's children is partly what makes a family a distinct institution rather than a state-managed collective. Design B, by tracking cumulative receipts, signals that the state views every gift as a potential inequality to be monitored. Furthermore, the practical corollary is severe: a cumulative tax falls hardest on recipients of illiquid assets—a farm, a workshop, a family home—at the precise moment they receive them. Unlike cash, these assets cannot be sliced to pay the tax without destroying the value being transmitted.

  This view recognizes that family integrity is a genuine human good, not just a loophole. To answer this: Design B protects the core of this good through the lifetime exemption. Moderate transfers that constitute normal parental support remain untaxed. The tax targets only the level of receipt that exceeds reasonable family provision and enters the realm of dynastic endowment. Regarding illiquidity, the design must include a deferral mechanism. The tax liability should attach as a lien against the asset, payable only upon the asset's eventual sale or the recipient's death, whichever comes first. This respects the family's right to maintain the asset while ensuring the state eventually collects its share of the advantage when it converts to liquidity. This answers the objection by showing the tax targets *advantage*, not *ownership*.

  **Empirical Falsifiers**

  Finally, we must acknowledge what this commission cannot settle by argument alone. Our recommendation rests on empirical assumptions about behavior and market structure. I commit to revising this recommendation if our economist produces evidence on two specific points.

  First, if data shows that formal wealth transfers constitute less than 10% of total intergenerational advantage transmission (including human capital and network access), the legibility objection becomes fatal. In that case, the tax is merely symbolic and potentially regressive if it discourages savings without impacting inequality. Second, if comparative analysis shows that Design B causes liquidation of small businesses at a rate 50% higher than Design A, even with deferral mechanisms, the economic harm outweighs the philosophical benefit. Design B assumes recipients can hold assets until liquidity events; if market conditions force premature sales to cover lien costs, the design fails its own fairness test. Until such data is produced, Design B remains the principled choice for a commission focused on the justification of wealth transmission rather than its mere regulation.
