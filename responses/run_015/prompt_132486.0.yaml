          *   Round 2 (Reward & Challenge): 10
          *   Round 3 (The Reveals): 25
          *   Debrief (Strawson Mapping): 30
      *   *Total:* 90.

      *Refining the "Weird" Aspect:* Instead of a garden, let's make it **"The Ritual."** They must invent a 30-second handshake or chant for the group. It's abstract, collaborative, and feels deeply "authored."
      *   *Actually, the prompt asked for "Collaborative Art-Making or Group Negotiation."* Let's stick to **"The Utopia Charter."** Negotiating a 5-point constitution.
      *   *Why?* Constitutions imply moral responsibility and governance.

      *The "Gut Punch" Mechanism:*
      *   Give them **"Value Chips."** To agree on a clause, they must spend chips matching the value (e.g., "Liberty" chip).
      *   They get chips randomly at the start.
      *   They think they are negotiating. Actually, they are just spending pre-assigned capital.
      *   *Even better:* **"Blind Preference Cards."** Before negotiating, they write down what they want. They think it's their opinion. Later, reveal the prompts that led to those opinions were randomized.

      *Okay, final plan:*
      *   **Activity:** "The Consensus Canvas."
      *   **Task:** Paint a single image together (one brush per person) OR Write a 4-line poem. Let's go with **Poem**. It's linguistic, like argumentation.
      *   **Constraint:** Each person has a "Lexicon Card" limiting what words they can suggest.
