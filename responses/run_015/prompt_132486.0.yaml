      *   **Caveats:** Predict what will go wrong (e.g., blaming the facilitator), identify limitations of the activity vs. the theory.
      *   **Constraint:** *No* standard individual trolley problems. Needs to be weirder, collaborative (art-making or negotiation).

  2.  **Deconstruct Strawson's Basic Argument:**
      *   Premise 1: To be truly morally responsible for what you do, you must be truly responsible for how you are (at least in certain crucial mental respects).
      *   Premise 2: You cannot be truly responsible for how you are (because of genetics, environment, prior causes).
      *   Conclusion: You cannot be truly morally responsible for what you do.
      *   *The "Gut Punch":* The realization that even the *desire* to change is determined. The regress is infinite.

  3.  **Brainstorming the Activity Concept:**
      *   *Idea 1: Collaborative Art.* Groups build a sculpture. Constraints limit materials.
      *   *Idea 2: Group Negotiation.* Deciding how to split a pot of money. Constraints limit offers.
      *   *Idea 3: "The Museum of Fate".* A collaborative narrative building game where the "story" is the outcome, but the "plot points" are pre-assigned.
      *   *Selection:* Let's go with **Collaborative Art/Negotiation Hybrid**. Call it "The Collective Canvas." It allows for subjective "good/bad" judgments (moral responsibility) and requires group buy-in (collective credit/blame).
      *   *Twist:* The "choices" aren't just actions; they are *preferences*. The game needs to show that even what they *wanted* to choose was fixed.

  4.  **Developing the Mechanics (The "Causal Chain"):**
