      *   *Actually, let's keep it simpler for 90 mins.*
      *   **Game:** "The Policy Council."
      *   **Task:** Pass 3 laws.
      *   **Mechanic:** Voting.
      *   **Twist:** Your vote is determined by hidden cards.
      *   **Problem:** If votes are determined, they know it's rigged immediately.
      *   **Solution:** The cards don't dictate the vote; they dictate the *values* that lead to the vote.
      *   **Better:** The cards dictate the *options available to perceive*. (Framing effect).

      *Let's settle on this structure:*
      1.  **The Illusion (20 mins):** Groups negotiate a solution to a crisis. High engagement.
      2.  **The Reward (10 mins):** Best group gets candy/praise. They feel pride.
      3.  **The Reveal (20 mins):** Layered envelopes reveal constraints on their decision-making process.
      4.  **The Regress (20 mins):** Mapping the reveals to Strawson.
      5.  **Debrief (20 mins):** Discussion.

      *Specifics for the "Gut Punch":*
