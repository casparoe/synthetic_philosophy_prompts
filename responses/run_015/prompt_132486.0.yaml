      *   Then reveal the Roles were dealt randomly.
      *   Then reveal the *Facilitator's* praise was pre-scripted.

  7.  **Addressing the "What Will Go Wrong":**
      *   Participants will feel cheated. "It was rigged."
      *   *Response:* That's the point. Life is rigged (nature/nurture).
      *   *Risk:* They disengage. Need to keep the stakes social, not just mechanical.
      *   *Limitation:* The game is determined by *rules*, but Strawson argues about *causal laws*. The game is a metaphor, not proof. Also, the game has a start point; Strawson's regress is infinite.

  8.  **Drafting the Content:**
      *   **Title:** "The Origin Lottery."
      *   **Theme:** Designing a Community Garden (Collaborative Art/Negotiation).
      *   **Materials:** Envelopes, Markers, Paper, Tokens.
