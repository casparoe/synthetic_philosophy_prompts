answer: |-
  Here are the desiderata for a theory of identity over time capable of evaluating quantum suicide, followed by the analysis of where the theory breaks.

  **The Desiderata**
  1.  **Ordinary Death:** The theory must explain why, in branches where the heart stops, subjective experience ceases, without invoking wavefunction collapse. *Consideration:* Prevents the view from implying you are immortal in *all* classical scenarios.
  2.  **Partial-Hit Run:** The theory must specify if a badly damaged survivor counts as the same agent. *Consideration:* Distinguishes biological persistence from the specific conscious continuity required for "immortality."
  3.  **Iterated Runs:** The theory must define the status of the survivor as branch amplitude approaches zero ($2^{-n}$). *Consideration:* Tests whether existence is binary (I exist or I don't) or graded (I exist to a degree).
  4.  **Amnesia Variant:** The theory must state if memory wiping breaks the chain of survival. *Consideration:* Tests whether psychological continuity is necessary for the "I" that survives.
  5.  **Witness Case:** The theory must reconcile the subject's survival with the friend's observation of death. *Consideration:* Ensures the view doesn't require solipsism or declare the friend irrational.
  6.  **No Collapse:** The ontology must remain strictly unitary. *Consideration:* Prevents cheating by hiding the death in a collapse event.
  7.  **No Free Precautions:** The theory must preserve the rationality of avoiding death (e.g., wearing a parachute). *Consideration:* Prevents the *reductio* where probability ceases to guide action.

  **Flags and Conflicts**
  *   **Genuine vs. Hangup:** The requirement for a **determinate yes/no on identity** is a camp hangup. A Parfitian reductionist view says identity isn't what matters; demanding a binary "is it me?" begs the question against psychological continuity theories. The **No Free Precautions** constraint is genuine; if a theory cannot recover the Born Rule for decision-making, it is practically incoherent.
  *   **Incompatibility:** **Iterated Runs** and **No Free Precautions** cannot be jointly satisfied under standard assumptions. If the survivor at $2^{-100}$ amplitude is genuinely *you* (satisfying Iterated Runs), then the expected utility of dying is 100% survival, making precautions irrational. To save precautions, you must treat low-amplitude branches as effectively non-existent, which kills the immortality claim.
  *   **The Knockout:** **No Free Precautions** knocks out the most candidates. It forces the theory to care about branch *weight*, not just branch *existence*. Most identity theories that support quantum immortality treat existence as binary, which severs the link between probability and rational action.

  **Evaluation of Views**
  **Naive Any-Branch-Continues:** Fails **No Free Precautions**. It asserts that since *a* branch survives, you survive, rendering probability irrelevant. You would not wear a parachute, since a live version of you lands somewhere. This is the *reductio* you flagged.

  **Parfit-Style Psychological-Continuity:** Fails **Iterated Runs** (as a support for QS). It argues that "survival" is just relation R (psychological connectedness) holding to some degree. If the branch weight is near zero, the "degree" of future existence is negligible. It dissolves the "I" that claims immortality, saving rationality but killing the comfort of the argument.

  **Branch-Weight Approach:** Fails **Iterated Runs** (as a support for QS). It ties identity or "measure of existence" to the Born Rule. At $2^{-100}$, your measure is effectively zero. You are dead for all practical and metaphysical purposes. This satisfies precautions and the witness case, but it denies the core claim of quantum immortality.
