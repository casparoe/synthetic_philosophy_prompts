  # Adversarial Collaboration: The Metaphysics of Laws of Nature

  **Collaborators:** [Humean Representative] & [Anti-Humean Representative]
  **Date:** October 26, 2023
  **Subject:** Mapping the Dispute Regarding the Ontological Status of Natural Laws

  ## I. Jointly Agreed Claims

  We, the undersigned, acknowledge that while we disagree on the fundamental ontology of laws, we share a commitment to philosophical rigor and scientific realism. To narrow the scope of our dispute and isolate the genuine metaphysical divergence, we affirm the following substantive claims:

  1.  **The Robustness of the Law/Accident Distinction:** There is a genuine, objective distinction between lawful regularities (e.g., the inverse square law) and accidental regularities (e.g., all gold spheres are less than 1km in diameter). A satisfactory metaphysics must explain the basis of this distinction, not eliminate it.
  2.  **Counterfactual Support:** Laws of nature support counterfactual claims (e.g., "If this match had been struck, it would have lit") in a way that accidental generalizations do not. Any account of laws must vindicate the truth-conditions of such counterfactuals without circularity.
  3.  **Scientific Success:** The empirical success of physics is a constraint on metaphysics. Neither view can be maintained if it renders the methodology of fundamental physics unintelligible or systematically misleading about the structure of the world.
  4.  **The Humean Mosaic as Data:** We agree that the total distribution of local, categorical, spatiotemporal particulars (the "Humean Mosaic") constitutes the shared empirical data that both theories must accommodate. We disagree on whether this mosaic exhausts reality.
  5.  **Explanatory Demand:** Both sides accept that laws play an explanatory role in scientific practice. We disagree on whether this explanatory role requires laws to be ontologically prior to the regularities they subsume.
  6.  **Uninstantiated Laws:** We agree that the possibility of uninstantiated laws (laws that apply to properties never actually instantiated in the history of the universe) poses a challenge that both accounts must address, either by accommodating them or providing error theory for the intuition that they exist.
  7.  **Natural Properties:** Both accounts rely on a notion of "natural" or "perfectly natural" properties. We agree that if this notion cannot be made coherent without presupposing laws, both views face a significant circularity problem.

  ## II. Table of Disagreements

  | Issue | Humean Position (Best Systems Account) | Anti-Humean Position (Governing/Primitivist) |
  | :--- | :--- | :--- |
  | **1. Ontological Status** | Laws are not additional ontological posits. They are descriptive summaries of the mosaic. To be a law is to be an axiom in the deductive system that best balances simplicity and strength in describing the mosaic. | Laws are ontologically distinct from the mosaic. They are primitive necessitation relations among universals or irreducible modal structures that exist in addition to particular matters of fact. |
  | **2. Direction of Explanation** | Regularities explain laws. The mosaic is fundamental; laws are true *because* the mosaic is arranged as it is. The "explanation" is systematization, not production. | Laws explain regularities. The mosaic is arranged as it is *because* the laws constrain or govern it. The direction of metaphysical explanation runs from laws to facts. |
  | **3. Supervenience** | Laws supervene on the Humean Mosaic. There can be no difference in laws without a difference in the distribution of particular matters of fact. | Laws do not supervene on the Humean Mosaic. It is metaphysically possible for two worlds to have identical distributions of particular facts but different laws governing them. |
  | **4. Modality** | Natural necessity is reduced to Humean regularity plus systematization. There is no "glue" in the world connecting distinct existences; modality is a projection of our systematizing practices. | Natural necessity is irreducible. There is a real modal connection (a "necessitation relation") between properties that ensures regularities hold and supports robust counterfactuals. |
  | **5. Natural Properties** | Natural properties must be identified independently of laws to avoid circularity in the Best Systems Account. We accept this is a cost but maintain it is payable via scientific practice. | Natural properties are determined by the laws. Properties are natural *because* they feature in the fundamental laws. This reverses the Humean dependency and avoids the circularity charge. |
  | **6. Governance Metaphor** | The idea that laws "govern" is a misleading metaphor. Laws do not act; they describe. Attributing causal power to laws is a category mistake. | The idea that laws "govern" is essential, though metaphorical. Laws play a causal-like role in constraining physical possibilities. Denying this renders the stability of the universe inexplicable. |

  ## III. Cruxes: Sub-Questions for Resolution

  We identify the following specific issues as "cruxes." If settled, they would compel at least one of us to revise our position significantly.

  ### Crux 1: The Circularity of Natural Properties
  *   **The Question:** Can the "natural properties" required for the Best Systems Account be specified without presupposing the laws of nature?
  *   **Relevant Consideration:** If the set of candidate predicates for the Best System must be restricted to "natural" properties to avoid trivialization (e.g., avoiding a predicate like "F" that applies to everything exactly where a complex law holds), and if "naturalness" is defined by role in laws, the BSA is circular.
  *   **Humean Prediction:** Natural properties can be identified via fundamental physics independently of the systematization process. The circularity is avoidable.
  *   **Anti-Humean Prediction:** Any attempt to define natural properties without laws will fail. Naturalness is inherently nomological. If the Humean cannot break this circle, the BSA collapses.

  ### Crux 2: The "Lawless Regularity" Intuition
  *   **The Question:** Is it conceivable (and metaphysically possible) to have a world with perfect regularities but no laws?
  *   **Relevant Consideration:** Consider a world where every particle moves in a straight line at constant speed forever, but there is no "necessitation" enforcing this.
  *   **Humean Prediction:** This intuition is confused. If the regularity is perfect and simple, it *is* a law by definition (Best System). There is no remainder.
  *   **Anti-Humean Prediction:** The intuition is robust. A world without governing relations is a world where regularities are cosmic coincidences. If the Humean cannot distinguish this world from a lawful one, they cannot account for the stability of nature.

  ### Crux 3: Explanatory Power vs. Parsimony
  *   **The Question:** Does the ontological parsimony of Humeanism outweigh the explanatory depth of Anti-Humeanism?
  *   **Relevant Consideration:** Weigh the cost of positing primitive modality (Anti-Humean) against the cost of denying that laws explain regularities (Humean).
  *   **Humean Prediction:** Parsimony wins. Positing primitive "governing" relations is mysterious and adds no predictive power. The BSA explains all we need (prediction/systematization) with less ontology.
  *   **Anti-Humean Prediction:** Explanatory depth wins. Parsimony is a vice if it purchases simplicity by eliminating the very thing that makes the world intelligible (governance). A world without governance is unintelligible.

  ### Crux 4: Scientific Practice and Realism
  *   **The Question:** Does fundamental physics treat laws as summaries or as constraints?
  *   **Relevant Consideration:** Analyze the language and modeling techniques of theoretical physicists (e.g., Lagrangian mechanics, symmetry principles).
  *   **Humean Prediction:** Physics is neutral. While physicists use modal language, it is *façon de parler*. The mathematical structure is compatible with Humean supervenience.
  *   **Anti-Humean Prediction:** Physics is not neutral. Symmetry principles and conservation laws are treated as constraints that *dictate* allowable interactions, not summaries of past interactions. Realism about physics requires realism about governance.

  ## IV. Assessment of Verbal Dispute

  We have assessed whether our disagreement is merely verbal (a difference in terminology) or substantive (a difference in metaphysical commitment).

  **1. Dissolved Disagreements:**
  *   **The word "Law":** We acknowledge that we sometimes use "law" differently. The Humean often uses it to mean "true generalization in the Best System," while the Anti-Humean uses it to mean "primitive modal relation." However, this is not *merely* verbal. Once we fix the referent (the thing doing the work in our theories), the disagreement persists.
  *   **"Governance":** We agree that "governance" is metaphorical. Neither side believes laws are conscious agents issuing commands. The dispute is not about the metaphor itself, but about whether the metaphor tracks a real, irreducible feature of reality (Anti-Humean) or is a useful fiction for describing regularities (Humean).

  **2. Residual Substantive Disagreements:**
  *   **Supervenience:** This is the core metaphysical divergence. It is not verbal. The Humean claims that fixing the spatiotemporal distribution of qualities fixes *all* truths. The Anti-Humean denies this. This is a testable metaphysical claim (in principle, via conceivability arguments and modal logic).
  *   **The Direction of Explanation:** We disagree on the arrow of metaphysical dependence. This is not a difference in language but in the structure of reality. The Humean asserts the mosaic is fundamental; the Anti-Humean asserts the nomological structure is (at least partially) fundamental.
  *   **Modality:** We disagree on whether modality is "in the head" (projected via systematization) or "in the world" (primitive relations). This has downstream consequences for how we interpret counterfactuals and scientific explanation.

  **Conclusion:**
  While some friction arises from differing definitions of "law" and "governance," the core dispute is robustly metaphysical. It centers on the **Supervenience Thesis** and the **Direction of Explanation**. We agree that future work should focus less on defining terms and more on testing the implications of supervenience against scientific practice and modal intuition.

