      *   *Steadfastness:* Node $N$ holds state $S$. Peer $P$ claims $S'$. $N$ ignores $P$. Why? Maybe $N$ thinks it's the Leader (has higher term). Maybe $N$ suspects $P$ is Byzantine (malicious). Maybe $N$ prioritizes Availability (serving reads) over Consistency (matching $P$). This is "local state persistence despite divergence."

