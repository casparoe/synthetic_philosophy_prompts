answer: |-
  This is an exceptionally sharp diagnosis. You have correctly identified the engine room of the debate. If I were to grade your hypothesis, I would give it an A, but with a margin note suggesting that "normativity" is only half the story; the other half is the **metaphysics of facts**.

  Let's unpack this. I will treat your hypothesis as the primary lens, refine it with a secondary diagnosis regarding the definition of "fact," and then address the Rylean move and the prospects for progress.

  ### 1. Evaluating Your Hypothesis: The Naturalization of Normativity

  You are right that the stalemate is not primarily about linguistics or arithmetic. It is a localized instance of the general problem of **intentionality** and its relation to the **natural order**.

  Kripke's skeptical argument works by imposing a specific constraint on what counts as a "meaning fact." He implicitly assumes a naturalistic constraint: for there to be a fact that I meant *plus*, there must be some state of affairs in the world (past or present) that *constitutes* that meaning. When he tests candidates (mental images, behavioral dispositions, neural states), he rejects them because they fail to capture the **normativity** of meaning.

  *   **The Normativity Constraint:** Meaning is normative. If I meant *plus*, I *ought* to answer "125" to "68 + 57."
  *   **The Naturalistic Constraint:** Facts must be descriptive (non-normative) states of affairs.

  The skeptical paradox arises because you cannot derive the *ought* of meaning from the *is* of nature (Hume's Law applied to semantics).

  **Where your hypothesis needs refinement:**
  You frame this as a fight about whether normativity can be naturalized. I would sharpen this: it is a fight about whether **constitutive normativity** can be reduced to **descriptive conditions**.

  *   **The Straight Solvers (Boghossian, McGinn, Hale):** They accept the normativity constraint but reject the idea that normativity must be naturalized to be real. They posit *sui generis* normative facts or primitive intentional properties. Their "progress" is simply asserting that the naturalist constraint is too tight. To a Kripkean, this looks like magic (queer facts). To them, the Kripkean looks like a verificationist who denies facts that aren't empirically reducible.
  *   **The Skeptical Solvers (Kripke, Wright, Rorty):** They accept the naturalistic constraint (roughly) and conclude that since normativity can't be reduced, there are no truth-conditional meaning facts. They save meaning by changing the logic of discourse to assertibility conditions (a quasi-expressivist move).
  *   **The Dispositionalists (Millikan, Teleosemantics):** They try to naturalize normativity by appealing to functions (biological or systemic). "I ought to say 125" becomes "My cognitive system is designed to output 125." The stalemate here persists because the "normativity objection" morphs into the "indeterminacy of function" objection. (Why is my system designed for *plus* rather than *quus* up to now?)

  So, your hypothesis is correct: **No progress on *quus* will solve this because *quus* is just a proxy for the Is-Ought gap.** However, it is not just metaethics; it is also philosophy of mind. It is the question: *Can the content of thought be fully constituted by non-contentful physical processes?*

  ### 2. The Second Diagnosis: The Ambiguity of "Fact"

  There is a verbal/metaphysical disagreement that runs parallel to the normativity issue, best articulated by Paul Boghossian in *Fact and Meaning*.

  Kripke's skeptic demands a "fact" that *grounds* the truth of "Jones means addition." But Kripke rigs the game by requiring this fact to be **reductive**. He wants a fact that is independent of our semantic practices, something that "leans out" of the world and grabs our minds.

  *   **Diagnosis:** The stalemate persists because the two camps are using different ontologies.
      *   **Kripkeans** operate with a **Quinean/Physicalist ontology**: Facts are what exist in the best scientific description of the world. Normative properties don't fit there.
      *   **Anti-Skeptics** operate with a **Robust Realist ontology**: Facts include irreducible normative or intentional properties.

  If this diagnosis is right, the debate is indeed a "disguised fight," but it is a fight about **ontological parsimony vs. phenomenological fidelity**.
  *   The Skeptical Solution sacrifices fidelity (meaning isn't *really* a fact) to save parsimony (no queer entities).
  *   The Straight Solution sacrifices parsimony (accepting queer intentional facts) to save fidelity (meaning *is* a fact).

  This explains why nobody moves. You cannot argue someone out of their fundamental ontological commitments using *plus/quus* examples. The examples are just intuition pumps designed to trigger these prior commitments.

  ### 3. The Rylean Move: Dissolution or Relabeling?

  Your group member pushing the Rylean line (meaning is an ability/practice, not a state) is attempting a **therapeutic dissolution** rather than a theoretical solution.

  *   **The Move:** To ask "What fact constitutes my meaning?" is a category mistake. Meaning is not an inner state or an outer disposition; it is a position in a normative space of reasons. It is defined by its use, not its ground.
  *   **The Objection (from the Straight Solver):** This looks like the Skeptical Solution in disguise. If you say "There is no fact, just my ability to participate in a practice," you have conceded the skeptic's point that there are no truth-conditions. You are merely asserting that we can get along without them.
  *   **The Counter-Objection (from the Rylean):** You are still under the spell of the picture that "meaning" must name an object or state. Once you exorcise that picture, the demand for a "grounding fact" evaporates.

  **Is this a solution?**
  It depends on what you want.
  *   If you want a **metaphysical guarantee** that your future use aligns with your past intention, the Rylean move fails. It offers no guarantee.
  *   If you want to **understand how communication works** without metaphysical anxiety, the Rylean move succeeds.

  This confirms your suspicion: the stalemate is temperamental. Some philosophers feel the anxiety of the gap (the "vertigo" of rule-following, as McDowell calls it) and demand a bridge. Others think the vertigo is an illusion caused by standing in the wrong place.

  ### 4. Prospects for Progress: Empirical or Conceptual?

  You asked if there is anything—a distinction, a model, an empirical discovery—that could constitute real progress.

  **The Hard Truth:** No empirical discovery will resolve this.
  Cognitive science can tell us *how* we generalize (neural networks, pattern recognition, causal mechanisms). But it cannot tell us whether that generalization is *correct* in the normative sense.
  *   **Example:** Science can show that my brain fires in pattern P when I see "+". It cannot show that pattern P *justifies* "125" rather than "5". The justification is logical/normative, not causal.
  *   **The Is-Ought Barrier:** As long as the skeptical paradox relies on the gap between descriptive facts and normative constraints, empirical data (which is descriptive) cannot bridge it.

  **Where Progress Actually Happens:**
  Progress in this field over the last 20 years has not been "solving" Kripke, but **shifting the terrain**.

  1.  **Normative Pragmatism (Brandom):** Instead of asking "What fact makes this true?", ask "What commitments does this utterance incur?" This bypasses the representationalist assumption that meaning must be a relation between word and world. It treats meaning as a social status. This doesn't refute Kripke; it makes Kripke's question look less urgent.
  2.  **Quietism (McDowell, Diamond):** The argument that we should not try to step outside our linguistic practices to justify them from a "sideways-on" view. The demand for a view from nowhere is the error. This is progress in *diagnosis*, not *solution*.
  3.  **Teleosemantics (Millikan, Papineau):** Attempting to naturalize normativity via evolutionary function. This is the most robust "Straight Solution" currently on the market. It hasn't ended the debate, but it has refined the "indeterminacy" objection into a precise technical dispute about proper functions.

  ### 5. Final Verdict

  Your hypothesis is substantially correct. The rule-following considerations are the **hard problem of consciousness** for the philosophy of language. Just as no amount of neural data seems to explain *qualia* to a skeptic, no amount of behavioral data explains *normativity* to Kripke.

  **The Diagnosis:**
  The stalemate is a **methodological impasse** driven by **ontological temperaments**.
  *   **Side A (Naturalists/Skeptics):** Believes that if it isn't natural, it isn't real. Therefore, meaning facts (as traditionally conceived) aren't real.
  *   **Side B (Realists/Anti-Reductionists):** Believes that if meaning is real, there must be facts. Therefore, facts must include irreducible normative properties.
  *   **Side C (Therapists/Pragmatists):** Believes the demand for "facts" in this context is a philosophical disease.

  **The Outlook:**
  Do not expect a "solution" in the sense of a knock-down argument that convinces a Kripkean to become a Boghossian. That would require one side to abandon their core metaphysical commitments.

  **Real progress looks like this:**
  1.  **Clarification of the Stakes:** Recognizing that the debate is about the viability of non-naturalism and the limits of naturalization, not about arithmetic.
  2.  **Theoretical Utility:** Adopting the framework that yields the most fruitful results for *other* problems (e.g., Brandom's inferentialism is useful for logic; Teleosemantics is useful for biology).
  3.  **Therapeutic Clarity:** Understanding that the "paradox" exerts a pull on us because of a specific picture of the mind (the "meaning-body" picture), and learning to resist that picture.

  **Advice for your group:**
  Stop trying to solve the paradox. Start treating the positions as **expressions of broader philosophical commitments**. When a dispositionalist offers a new model, ask: "Does this naturalize normativity, or does it redefine normativity?" When a skeptic offers a new assertibility condition, ask: "Does this explain meaning, or does it explain *social agreement*?"

  The "best available outcome" is indeed getting clearer about why it won't be resolved. That is not a failure; in philosophy, knowing which problems are artifacts of our conceptual framework is a significant victory. Wittgenstein (the actual one, not Kripke's version) would say the fly is shown the way out of the fly-bottle. The fly often refuses to leave, preferring the bottle. Your reading group is currently studying the architecture of the bottle. That is valuable work, even if no one escapes.
