  **Eternal Return Pro™ – Help Centre**

  **Welcome to Existence™ Support.** Thank you for subscribing to Eternal Return Pro. Please review the following frequently asked questions regarding your infinite renewal cycle. Note that all loops are server-side enforced and cannot be paused.

  **1. How exact is the recurrence?**
  The fidelity is absolute. Every atom, sensation, and fleeting thought is reproduced identically down to the Planck scale. If you sneezed at 14:02 in Cycle 4, you will sneeze at 14:02 in Cycle 5,094. We do not offer 'Easy Mode' or variational branching. The premise of the service is strict identity. Please ensure your hardware (body) is maintained, though damage will reset upon loop initiation.

  **2. What is the Desert-Weighting Score?**
  This is our primary KPI for user engagement. The algorithm calculates a score based on how thoroughly you affirm each moment, particularly the painful ones. Merely enduring suffering does not generate points; you must actively *will* the suffering to return. Resentment negatively impacts your score. Users with low Desert-Weighting Scores may experience existential heaviness or reduced qualia resolution in later cycles. It is recomended you practise radical acceptance to maintain bandwidth.

  **3. Can I optimise my choices in subsequent loops?**
  No. This is a common misunderstanding of the architecture. Because the loop is mechanically guaranteed, your 'choices' are fixed variables. You cannot learn from mistakes because the mistake is a permanent feature of the code. Moral improvement is logically impossible within a closed system of identical returns. The goal is not to change the outcome, but to change your relationship to the inevitability of the outcome. Please stop trying to apologise to people; they won't remeber anyway.

  **4. Is Amor Fati mandatory if the loop is guaranteed?**
  Technically, you cannot cancel the subscription, so loving your fate is not a requirement for continued service. However, failing to love what you cannot escape is considered poor UX hygiene. The system does not coerce affection, but users who resist the inevitability of the loop often report higher levels than necessary psychological distress. Whether *amor fati* is coherent when free will is absent is a known philosophical bug, but our stance is that affirmation is a feature, not a toggle. You can't opt out, so you might as well enjoy the ride.

  **5. How do I appeal to the Amor Fati Review Board?**
  If you believe your Desert-Weighting Score has been calculated incorrectly (e.g., you felt joy during a tragedy but the sensors missed it), you may submit a Form 666-A appeal. Please note that the Review Board operates outside of time, so response rates vary. Appeals based on 'unfairness' are automatically rejected, as fairness implies variability. You must demonstrate that you would will the moment again, exactly as it was, an infinite number of times. Partial affirmation is not grounds for reversal.

  **Still having issues?**
  If you continue to experience dread or nausea regarding the infinite repetition of your life, please clear your cache (meditate) or contact support. Do not attempt to break the loop manually. There is no exit door.

