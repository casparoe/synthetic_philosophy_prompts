answer: |-
  You have identified a genuine gap in the taxonomy of institutional behavior. The standard literature on precommitment (Elster, Schelling, Thaler & Sunstein) focuses on the *efficacy* of the bind (does it hold?) or the *ethics* of the bind (is it democratic?). It assumes a static relationship between the Constraint and the Target. You are describing a dynamic where the Constraint persists, the Target evaporates (via adaptation), and the Friction relocates.

  There is no established term for this specific configuration. "Function creep" is wrong because the function (restraint) is constant. "Decoupling" is wrong because the rule is coupled to action, just the wrong action. "Goodhart's Law" is wrong because the metric isn't corrupted; the behavior around it is.

  I propose we call this **Binding Migration**.

  Below is the carving you asked for: the definition, the boundaries, the tests, and the distinction between the collective and single-agent versions.

  ### I. The Carving: What is Binding Migration?

  **Binding Migration** occurs when a self-imposed constraint retains its formal authority and normative justification but ceases to constrain the behavior it was designed to check, instead constraining distinct behaviors or agents that were not the original target, while the original behavior adapts to bypass the constraint without challenging its legitimacy.

  It consists of four necessary and jointly sufficient conditions:

  1.  **Formal Continuity:** The rule or device remains in force, is cited as authoritative, and is not treated as a dead letter.
  2.  **Normative Preservation:** The original justification for the constraint (e.g., "we are impulsive," "spending must be checked") is still invoked to defend the rule. The actors do not view the rule as obsolete.
  3.  **Target Decoupling:** The specific behavior or impulse the rule was designed to restrain has found a pathway to proceed without triggering the constraint (the "side door").
  4.  **Victim Substitution:** The friction generated by the constraint now falls upon a behavior or agent that was not the object of the original concern, often impeding actions that would have been welcomed by the original rule-makers.

  **The Core Mechanism:** The system preserves the *cost* of the binding (the friction, the delay, the vote threshold) while shedding the *benefit* of the binding (the restraint of the specific temptation). The "Ulysses" justification becomes a ritual shield for the constraint, protecting it from repeal even after the "Sirens" have changed their song.

  ### II. Distinguishing from Neighbors

  To ensure this carving holds, we must separate it from its nearest conceptual neighbors.

  *   **Vs. Merton's Ritualism:** In sociological ritualism, actors follow the rules but abandon the institutional goals. In Binding Migration, actors *believe* they are pursuing the goal ("we are being prudent") but are mistaken about what the rule actually achieves. Ritualism is cynical; Binding Migration is sincere.
  *   **Vs. Goodhart's Law:** Goodhart's Law states that when a measure becomes a target, it ceases to be a good measure. In Binding Migration, the rule is not being "gamed" to look good; it is being honored to *be* good. The failure is not in the metric's accuracy, but in the *scope* of the metric relative to the problem.
  *   **Vs. Regulatory Capture:** Capture implies the regulator is co-opted by the regulated to serve the regulated's interest. In Binding Migration, the "regulator" (the Senate, the Self) is not co-opted; they are simply evading the specific net they cast while praising the net.
  *   **Vs. Desuetude:** Desuetude is when a rule falls into disuse. Binding Migration is the opposite: the rule is used constantly, just not on the intended subject.
  *   **Vs. Loophole Exploitation:** A loophole is a gap in the rule. Binding Migration requires the gap to exist, but adds the crucial element that the rule *remains justified* despite the gap. If the Senate admitted, "Yes, pilots bypass the rule, so we need a new rule," that is standard loophole closing. If they say, "Pilots bypass the rule, but the 2/3 vote rule is still essential for stability," that is Binding Migration.

  ### III. Boundary Cases

  You asked three specific questions to test the limits of the concept.

  **1. Does the device need to have bitten correctly at first?**
  **Yes.** If the rule never constrained the original target, it was simply **Misaligned Binding** from $T_0$. Binding Migration is a *temporal* phenomenon; it requires a drift. There must be a period (even a short one) where the constraint and the target were aligned, or at least where the actors reasonably believed them to be aligned. If the rule was always useless against the temptation but always painful for the lab requirement, it is just a bad rule, not a migrated one. The "migration" is the movement of the *efficacy gap*.

  **2. Does it count if the binding was adopted partly to signal resolve?**
  **No, not if signaling was the primary function.** If the rule was adopted primarily to signal virtue to outsiders (e.g., "Look how fiscally responsible we are"), and the insiders always intended to bypass it, then the subsequent friction on the lab requirement is just **Collateral Damage**, not Binding Migration. Binding Migration requires that the binders *intended to be bound*. The sincerity of the precommitment is a prerequisite. If the "Ulysses" posture was theater, the subsequent drift is just the curtain falling on the wrong act.

  **3. Is there an internal test to distinguish genuine from migrated binding?**
  Your "Repeal Test" (*If repealed, would they pass it again?*) is necessary but not sufficient, because actors may vote to re-pass a migrated rule due to status quo bias or sunk cost fallacy.

  I propose a stricter diagnostic: **The Counterfactual Closure Test.**
  *   *Procedure:* Ask the body: "If we closed the side door (e.g., banned 'pilots'), would you accept that the original temptation (gen-ed reform) would now be subject to the 2/3 vote?"
  *   *Result:* If the answer is "No, we need the pilots for flexibility," but they refuse to repeal the 2/3 vote rule, you have Binding Migration.
  *   *Why:* This reveals that the rule is no longer valued for its *effect* on the target, but for its *existence* as a principle. Genuine binding accepts that closing the loophole is part of the binding. Migrated binding treats the loophole as necessary infrastructure and the rule as necessary decoration.

  ### IV. Single-Agent vs. Collective Binding

  You asked if the tablet case (single-agent) is the same as the Senate case (collective).

  **Structurally: Yes.**
  In both cases, Time-1 Self (or Senate) imposes a cost on Time-2 Self (or Senate) to prevent Behavior X. Time-2 Self adapts by shifting to Behavior Y (tablet / pilot), but the Cost remains attached to the *mechanism* (the app / the bylaws) rather than the *intent*. The friction migrates from the Bed to the Kitchen; from Gen-Ed to Lab Requirements.

  **Normatively: No.**
  There is a crucial disanalogy regarding **Consent and Turnover**.
  *   **Single-Agent:** The person who is bound is the same entity who did the binding. The migration is a failure of *self-knowledge* or *contextual adaptation*. I bought the tablet to save my sleep, but I didn't anticipate needing the phone for recipes. I can repeal the rule unilaterally.
  *   **Collective:** The Senate at Time-2 is not the Senate at Time-1. In your faculty example, many members voting to uphold the 2/3 rule did not vote to create it.
      *   This makes Binding Migration in collective settings more pernicious. It becomes a form of **Inter-temporal Veto**. The dead hand isn't just holding the rule; it's holding a weapon that the living are using against each other, while claiming it's for defense against an enemy that isn't there.
      *   In the collective case, Binding Migration often serves a **Power Preservation** function. The rule stays because it gives the minority (or the status quo coalition) a veto, even if the original justification (hasty reform) is gone. In the single-agent case, there is no coalition to benefit from the migration; it is pure inefficiency.

  ### V. Summary Definition for Use

  If you need to deploy this in a meeting or a paper, here is the operational definition:

  > **Binding Migration:** A pathology of precommitment strategies wherein a constraint retains its formal authority and normative justification after the original target behavior has adapted to bypass it. The constraint continues to generate friction, but that friction is displaced onto unintended targets or agents. Unlike regulatory capture or hypocrisy, Binding Migration is characterized by good-faith adherence to the rule by those who are bound, who mistakenly believe the constraint is still performing its original protective function.

  You are not witnessing hypocrisy. You are witnessing the fossilization of a solution after the problem has evolved. The rule has become a reef: the ships it was meant to stop have learned to sail around it, but it is still tearing holes in the fishing boats.
