answer: |-
  ### 1. Core Dependency & The Failure of Standard Rationality
  **Dependency First:** You must establish **symmetry of reasoning** before discussing strategy. The students must accept that the other player is not just an opponent, but a *mirror* of their own logical process.
  **Why Rational Choice Fails:** Standard rational-choice reasoning (Causal Decision Theory) treats the other player's choice as an independent variable or a probability to be guessed. It fails here because it ignores the logical correlation between two identical reasoning processes facing the same problem. In the noisy stag hunt, standard rationality defaults to the risk-dominant option (Hare) because the noise breaks "common knowledge" of the signal. Superrationality bypasses the need for signal certainty by relying on the certainty of shared reasoning.

  ### 2. The Teaching Arc (40 Minutes)

  **0:00–0:10 | The Setup: The Noisy Hunt**
  *   **Scenario:** Two hunters. Stag (high payoff, needs both) vs. Hare (low payoff, solo). A horn blows to signal "Stag," but static makes it unclear if the other heard it. You heard it.
  *   **Task:** Ask them individually to write down their choice and *why*.
  *   **Goal:** Elicit the anxiety of uncertainty. "What if they didn't hear it?"

  **0:10–0:20 | The Trap: Standard Rationality**
  *   **Discussion:** Poll the room. Most will choose Hare due to risk.
  *   **Analysis:** Walk through their logic: "I can't be sure they heard, so I can't be sure they'll commit, so I play safe."
  *   **Intervention (Misconception 1):** If a student argues, "I need to calculate the probability they heard," stop them. Clarify: **Superrationality is not about being 'extra smart' or calculating better odds.** It is about changing the assumption of independence.
  *   **Outcome:** Demonstrate that standard rationality leads to a suboptimal equilibrium (both hunt Hare) because it treats the other's mind as a black box.

  **0:20–0:30 | The Pivot: The Logical Mirror**
  *   **Concept:** Introduce the superrational premise: "Assume the other hunter is reasoning exactly like you right now."
  *   **Logic:** If you choose Stag because it's the logical choice for a rational agent, and they are also a rational agent facing the same logic, they must also choose Stag. The noise matters less than the symmetry.
  *   **Intervention (Misconception 2):** When a student asks, "But how does my choice *make* them choose Stag?" clarify: **It does not cause their choice; it correlates with it.** Reject telepathy. You are predicting their output because you share the same algorithm.
  *   **Outcome:** Shift the group toward Stag based on logical correlation, not signal fidelity.

  **0:30–0:35 | The Stress Test**
  *   **Variation:** "What if you knew the other hunter was irrational? Or trained to always hunt Hare?"
  *   **Expected Result:** They should revert to Hare. This proves the logic relies on symmetry, not moral obligation.

  **0:35–0:40 | The Check**
  *   **Question:** "If you decide to switch to Hare, did you change the other hunter's mind?"
  *   **Pass Condition:** They answer: "No, but I have updated my prediction of what their reasoning produced." (Understanding correlation vs. causation).
  *   **Fail Condition:** They answer: "Yes, because they'll see me do it" (Impossible in one-shot) or "No, and I should still hunt Stag because it's nice" (Moralizing, not logical).

  ### 3. The Carrying Example: Noisy Stag Hunt
  *   **Include:**
      *   **One-shot interaction:** No reputation building or repeated rounds.
      *   **Symmetric payoffs:** Both want the Stag equally.
      *   **The Noise:** Explicit uncertainty about whether the coordination signal (horn) was received.
      *   **Identical agents:** Explicitly state both hunters are trained in the same logic.
  *   **Exclude:**
      *   **Communication:** No talking after the horn.
      *   **Moral valence:** Do not frame Stag as "good/cooperative" and Hare as "bad/defective." Frame them as "High Reward/Risky" and "Low Reward/Safe."
      *   **Punishment:** No mechanism to punish the other for hunting Hare.

  ### 4. Misconceptions & Intervention Points
  1.  **"Superrational means being extra smart/calculating."**
      *   *When:* During **0:10–0:20 (The Trap)**.
      *   *Fix:* When they try to calculate probabilities of the other hearing the horn, interrupt. State: "Superrationality isn't about better math; it's about recognizing you are running the same software as the opponent."
  2.  **"It needs telepathy/causal influence."**
      *   *When:* During **0:20–0:30 (The Pivot)**.
      *   *Fix:* When they ask how their choice influences the other, state: "Your choice doesn't reach across the forest. It reveals what a rational agent concludes. Since they are also rational, they conclude the same."

  ### 5. Refused Game-Theory Machinery
  *   **Payoff Matrices:** Do not draw the 2x2 grid initially. It encourages cold calculation of independent variables rather than reasoning about reasoning.
  *   **"Nash Equilibrium" Terminology:** Do not use the label. It invites memorized definitions rather than logical derivation. Use "stable outcome" instead.
  *   **Bayesian Updating:** Do not let them formalize the noise as a probability variable $P(heard)$. This reinforces the standard rationality trap you are trying to break.

  ### 6. Stance on Order & Defense
  *   **Stance:** **Experience the Failure First.** (Trap -> Pivot).
  *   **Alternative:** Define Superrationality First, then apply to Hunt.
  *   **Defense:** High schoolers tune out abstract definitions ("Dogma"). By letting them struggle with the noise and standard rationality first, you create a *need* for the superrational solution. They feel the frustration of the suboptimal Hare outcome before you offer the key that unlocks the Stag. Definition-first risks them treating superrationality as a rule to memorize rather than a logical tool to solve a problem.

  Verdict: This plan forces students to feel the limits of standard rationality before offering superrationality as the only logical escape from the noise.
