  We think a reason like a thought inside a head,
  A private spark that needs a mind to burn.
  If every waking eye is closed and dead,
  Then why should any distant conscience yearn?
  It seems absurd to claim a rule remains
  When there is none to heed it or to fear.
  Like footprints washed away by heavy rains,
  The truth dissolves when no one lingers near.

  Yet stop. If fire burns the empty wood,
  The heat exists without a hand to feel.
  So maybe wrong is where the suffering stood,
  Regardless of who's there to name it real.
  So is this law just lonely in the dark?
  Or true because it leaves no human mark?
