      *   **The "Diagnosis":** "Avoidant Withdrawal Pattern" (AWP - likely a placeholder name, as it's not in the current DSM-5-TR or ICD-11 under that exact name, though it sounds like a mix of Social Anxiety, Avoidant Personality Disorder traits, or perhaps a school-specific construct). It's in a *draft* of the *next* edition (DSM-6? ICD-12?), meaning it's not officially recognized yet.
      *   **The Process:** School-wide screening in 7th grade. Questionnaire $\rightarrow$ Cutoff $\rightarrow$ Counselor Assessment $\rightarrow$ Diagnosis.
      *   **The Symptoms:** Solitary behavior, not initiating contact, preferring alone time, slow to answer. (Sounds like introversion or high-functioning autism traits, but framed as pathology).
      *   **The Incentive:** District gets extra funding per flagged kid.
