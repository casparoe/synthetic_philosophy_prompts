  The ethics committee at St Jude's Centre is paralysed over Mr. Henderson's ventilation. Seven members sit round the table, each nodding individually that withdrawal is best, yet the Chair refuses to sign the minutes because she can't locate the unity of the decision. If Dr. Evans agrees and Dr. Clarke agrees, what binds their separate assents into one corporate verdict? You posit a relation of 'collective agreement', but then you must ask what binds Evans to that relation, and Clarke to it, requiring further relations ad infinitum. The decision remains metaphysically fragmented, seven isolated minds never quite touching the same conclusion, so the life-support machine stays on because the committee cannot logically become a single agent without falling into an infinite chain of connectors.

  Russell would tell the Chair to stop overthinking it; for him, relations are external and real, so 'Evans agrees' is just a fact that doesn't need extra glue to hold it together. Bradley, however, would argue that if the relation is external, it's detached from the terms, meaning you always need another relation to stick them together, which is exactly why the committee is stuck—they're looking for an internal unity that isn't there. The structual feature doing the work here is the copula, the 'binds' that tries to unite distinct entities into a fact. If you remove the demand for this connector—say, by treating the committee as a primitive whole rather than a sum of parts—the regress collapses immediately because you stop asking how the parts hook up.

  Ultimately, I'm taking the side that this is just a muddle about how language binds things together rather than a vicious metaphysical block. The machine stays on in the story, but in reality, the committee *does* decide, which shows the regress is a problem of description, not existence. We speak as if relations need tying, but the world just hangs together without our logical glue. It's a category error to expect language's structure to match ontology perfectly, so Bradley's regress bites only if you confuse grammar with reality. Wether it feels vicious depends on wether you think logic dictates practice, but here it's clearly just a linguistic knot.
