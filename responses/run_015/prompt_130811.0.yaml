answer: |-
  **Project Title:** The Compression Criterion: A Philosophical Audit of Macro-Historical Explanation

  **Project Summary**
  This six-month independent research project will produce a philosophical essay of approximately fifteen thousand words examining the epistemic foundations of contemporary macro-history. Popular works such as *Sapiens*, *Guns, Germs, and Steel*, and *The Dawn of Everything* have ignited fierce debate regarding the validity of grand narratives. While existing critiques focus on empirical accuracy or the tension between determinism and agency, this project hypothesises a deeper, shared assumption: the 'compression criterion'. This is the implicit claim that a successful civilisational explanation must reduce thousands of local events to a small set of structural drivers, and that this reduction possesses value independently of predictive power. The research will assess whether this criterion is defensible when explanatory compression is distinguished from predictive utility, and whether current historiographical objections target the criterion itself or merely its specific applications.

  **Research Question**
  The central question guiding this inquiry is: *Is the 'compression criterion'—the assumption that structural reduction is inherently explanatory valuable irrespective of predictive success—philosophically defensible, and do current critiques of macro-history inadvertently reinforce it while disputing its application?*

  Subsidiary questions include:
  1.  How is the trade-off between local detail and structural clarity implicitly negotiated in representative macro-historical arguments?
  2.  Under what conditions does explanatory compression constitute legitimate abstraction versus narrative distortion?
  3.  Can a taxonomy of compression types distinguish defensible macro-explanation from overreach without relying on empirical falsification?

  **Background and Significance**
  Philosophy of history has long debated the nature of historical explanation, traditionally oscillating between covering-law models and narrative constructivism. However, contemporary discourse surrounding popular macro-history has largely bypassed these foundational epistemic questions. Historians and public intellectuals typically engage these texts on empirical grounds—challenging data points regarding agriculture, inequality, or cognitive evolution—or on political grounds, accusing authors of environmental determinism or utopianism.

  This leaves a significant conceptual gap. Both proponents and critics appear to accept that the primary virtue of macro-history is its ability to compress complexity into manageable structural forms. Critics rarely argue that compression itself is invalid; rather, they argue that the *wrong* variables have been selected for compression. Consequently, the debate remains stuck in a cycle of empirical counter-claims without addressing whether the demand for civilisational-scale compression is itself justified. By isolating the 'compression criterion' as a distinct philosophical object, this project moves beyond the stalemate of fact-checking grand narratives. It seeks to determine if the value of such histories lies in their truth conditions or in their cognitive utility, and whether the latter can be sustained without the former. This remains genuinely open because existing philosophical work has not yet applied the tools of explanatory modelling specifically to the rhetorical structure of contemporary popular macro-history.

  **Methodology**
  The project will proceed through conceptual reconstruction and counterfactual testing, avoiding original archival research in favour of textual and philosophical analysis. The method consists of three stages:

  1.  **Reconstruction of Implicit Rules:** I will select one core argument from each of three representative texts: Harari's *Sapiens* (cognitive/agricultural revolutions), Diamond's *Guns, Germs, and Steel* (environmental determinism), and Graeber and Wengrow's *The Dawn of Everything* (political flexibility). For each, I will reconstruct the implicit 'compression rule' employed. This involves identifying which local variables are discarded and which structural drivers are retained to generate the explanation.
  2.  **Counterfactual Perturbation:** Each reconstructed argument will be subjected to two counterfactual perturbations at different scales.
      *   *Micro-perturbation:* Altering specific local events while holding the structural driver constant to see if the outcome remains explained.
      *   *Macro-perturbation:* Altering the structural driver while holding local events constant to test necessity.
      The goal is to observe whether the explanation survives these shifts robustly or collapses into *ad hoc* adjustment. If the explanation requires constant recalibration to accommodate minor counterfactual changes, the compression criterion may be masking narrative fragility.
  3.  **Taxonomic Classification:** Based on the resilience of each argument under perturbation, I will develop a taxonomy of compression types. This will categorise instances where compression serves as a legitimate heuristic for understanding versus instances where it functions as a rhetorical device that obscures causal complexity.

  **Expected Outcomes and Success Criteria**
  A successful result will be a fifteen thousand-word essay that provides a clear taxonomy of compression types. This taxonomy would separate defensible macro-explanation (where compression clarifies causal mechanisms without distorting agency) from narrative overreach (where compression creates an illusion of necessity). Success is defined by the ability to articulate clear conditions under which the compression criterion is valid, thereby offering a new framework for evaluating grand narratives that does not rely solely on empirical dispute.

  Failure would consist in the inability to formalise the 'compression criterion' clearly enough to test. If the concept proves too slippery to distinguish from general abstraction, or if the counterfactual perturbations yield inconclusive results regarding the robustness of the explanations, the project will not achieve its primary aim. In this scenario, the output would shift to a diagnostic report explaining why the criterion resists formalisation, though this would be considered a secondary outcome.

  **Scope and Feasibility**
  The project is designed for completion within six months on a part-time to full-time independent basis. The scope is limited to conceptual framing; no empirical historical research or archival work is required. The primary texts are widely available, and the labour involves close reading and philosophical modelling rather than data collection. A fifteen thousand-word target is appropriate for this timeframe, allowing roughly one month for initial reconstruction, three months for the counterfactual analysis and drafting, and two months for revision and refinement.

  **Risk Assessment**
  The single biggest danger that makes this project too ambitious for the timeframe is the risk of **conceptual scope creep during the counterfactual analysis**. While the texts are fixed, the philosophical work of defining 'compression' distinct from 'abstraction' or 'simplification' is notoriously difficult. There is a significant risk that months could be lost attempting to refine the definition of the compression criterion itself rather than applying it. If the criterion cannot be stabilised quickly in the first month, the subsequent testing phase will lack the rigour required for a philosophical audit. To mitigate this, the project will impose a strict deadline for finalising the working definition of the compression criterion before proceeding to the perturbation stage, accepting a provisional definition if necessary to ensure completion.
