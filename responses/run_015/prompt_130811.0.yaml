prompt: |-
  I'm pitching a six-month independent research project—roughly one long philosophical essay, about fifteen thousand words—to examine whether the standard critiques of macro-history miss a hidden structural disagreement. The half-formed idea is this: critics of grand narratives such as Harari's Sapiens, Diamond's Guns, Germs, and Steel, and Graeber and Wengrow's The Dawn of Everything typically attack empirical details, accuse authors of determinism, or point to overlooked local agency. But I suspect all sides implicitly share, and then dispute, something I will call the "compression criterion": the assumption that a successful explanation at civilisational scale must reduce thousands of local events to a small set of structural drivers, and that this reduction is valuable independently of predictive power. I want to ask whether this criterion is defensible once we distinguish explanatory compression from predictive utility, and whether the familiar historiographical objections actually target the criterion itself or only its particular applications.

  Please turn this into a formal research proposal. State the precise question, explain why existing philosophical work on historical explanation and the current historiographical debates leave it genuinely open, and outline the method: I will reconstruct the implicit compression rules in three representative arguments (one from each book), then subject each reconstruction to two counterfactual perturbations at different scales to see whether the explanation survives or collapses into ad hoc adjustment. Say what a successful result would look like—perhaps a taxonomy of compression types that separates defensible macro-explanation from narrative overreach—and what would count as failure, including the risk that the criterion cannot be formalised clearly enough to test. Assess the scope honestly: can this be completed in six months without original archival research, and what is the single biggest danger that makes the project too ambitious for the timeframe? Write in British English, do not include a bibliography or citations, and keep the proposal focused on the conceptual framing rather than empirical history.
