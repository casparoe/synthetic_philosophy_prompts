      *   *Better:* A grant to accelerate *governance capacity* in that country (speeding up safety) without general productivity growth. If she funds governance-speed but rejects general-speed, it's about Directionality (Rule 2). If she rejects both because the x-risk impact is hard to prove, it's about Tractability (Rule 3).
      *   *Let's go with:* A proposal to fund *safety-focused* productivity (e.g., secure compute infrastructure) vs *general* productivity.

      *(Final Decision on Rules)*:
      1.  **The X-Risk Primacy Rule:** Near-term welfare counts only instrumentally to x-risk (V7).
      2.  **The Differential Development Rule:** Speed up safety/slow down capabilities (V3, V1 vs no capability funding).
