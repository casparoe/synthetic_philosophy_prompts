answer: |-
  You have identified a genuine logical tension, and your intuition is correct: this is distinct from a Motte-and-Bailey. In a Motte-and-Bailey, the arguer retreats to a boring truth (the Motte) to defend a controversial claim (the Bailey). In your friend's case, he isn't retreating to a single boring truth; he is swapping between two *different* truths depending on which one saves the institution from the specific attack.

  Here is the carving of that rhetorical pattern, the constitutional theory behind it, and where the line is drawn between a logical fallacy and a legitimate structural defense.

  ### 1. The Constitutional Theory Term
  You asked if constitutional theory has a term for this. It does. It is the **Bagehotian Distinction**, named after Walter Bagehot's 1867 work *The English Constitution*.

  Bagehot divided the government into two parts:
  *   **The Efficient Parts:** Those that actually rule (Parliament, Cabinet). They do the work, take the blame, and wield coercive power.
  *   **The Dignified Parts:** Those that conceal the reality of power (The Monarch). They generate loyalty, continuity, and theater.

  **The Theoretical Claim:** The institution is *designed* to be politically impotent so that it can remain culturally potent. The theory argues these are not contradictory but **causally linked**. The monarchy is indispensable *precisely because* it has no power. If it had power, it would become controversial, and lose its "dignified" status as a neutral unifier.

  ### 2. The Rhetorical Pattern: "The Potency Pivot"
  While Bagehot provides the *theory*, your friend is using a rhetorical maneuver to defend it without admitting the tension. There isn't a single Latin name for this, but in argumentation theory, it is a specific species of **Equivocation** protected by **Compartmentalization**.

  I would define this pattern as **Contextual Potency Shifting**.

  **The Structure:**
  1.  **Premise A (Safety):** When the attack is on *legitimacy* (e.g., "It's undemocratic"), "Power" is defined as **Coercive Authority** (veto power, legislation). The institution is claimed to have **Zero**.
  2.  **Premise B (Utility):** When the attack is on *relevance* (e.g., "Abolish it"), "Power" is defined as **Social Gravity** (influence, identity, continuity). The institution is claimed to have **Maximum**.
  3.  **The Concealment:** The arguer treats Premise A and Premise B as independent variables. They argue the institution is safe *because* of A, and useful *because* of B, without addressing whether B inevitably corrupts A.

  **Why it feels different from Motte-and-Bailey:**
  In a Motte-and-Bailey, the arguer wants to *keep* the Bailey (the strong claim) but hides in the Motte (the weak claim) when attacked.
  In the Potency Pivot, the arguer claims the institution is **Weak** to defend it, then claims it is **Strong** to defend it. They are arguing for the *same* status quo, but altering the *properties* of the institution to make it unfalsifiable.

  ### 3. The Carving: Where is the Fallacy?
  You asked for the carving, not the label. Here is the precise logical fault line.

  The argument stops being a "two-level defense" and starts being a fallacy when the arguer **denies the interaction between the two types of power.**

  **The Legitimate Two-Level Defense (Bagehotian):**
  > "The Monarch has no political power *in order to* maintain their cultural power. Because they do not govern, they can represent everyone. If we gave them political power, they would lose their cultural value."
  > *   **Logic:** Power Type A is sacrificed to maximize Power Type B. They are inversely related.
  > *   **Honesty:** Acknowledges the risk. If the Monarch starts tweeting policy, the defense collapses.

  **The Fallacious Potency Pivot (Your Friend):**
  > "The Monarch has no political power (so don't worry about democracy). ALSO, the Monarch has unique cultural power (so don't replace them)."
  > *   **Logic:** Power Type A is zero. Power Type B is high. These states are treated as compatible without explaining why Type B doesn't eventually become Type A.
  > *   **Dishonesty:** It treats "Cultural Gravity" as weightless. If an institution has enough "continuity and identity" to stop a republic from functioning (as claimed in the replacement defense), that *is* a form of political power (veto power via legitimacy denial).

  ### 4. How to Test It (The Falsification Boundary)
  To determine if your friend is making a legitimate structural argument or just pivoting, ask this specific question:

  > *"If the Monarch's 'continuity and identity' are so powerful that an elected president couldn't replicate them, doesn't that give the Monarch the power to delegitimize a government they dislike by withholding that continuity?"*

  *   **If they say Yes:** They are admitting the Monarch has a "nuclear option" of influence. The argument shifts to "Is that check and balance good?" (This is a honest, high-level defense).
  *   **If they say No:** They are claiming the Monarch has massive cultural influence that *somehow* cannot be used to exert political pressure. This is where the **Potency Pivot** becomes a fallacy. They are claiming the institution is **Functionally Omnipotent** (in identity) but **Causally Impotent** (in outcome).

  ### Summary
  The pattern is **Equivocation on "Power"** (Coercive vs. Cultural) masked as **Compartmentalization**.

  Constitutional theory calls the *institution* **Dignified vs. Efficient**.
  Logic calls the *argument* **Self-Sealing via Semantic Slippage**.

  It stops being a fallacy only when the proponent admits that the "Indispensability" (Cultural Power) is fragile and depends entirely on the "Zero Power" (Political Impotence) being maintained. If they claim both are robust simultaneously, they are arguing for an institution that is magically immune to the consequences of its own influence.
