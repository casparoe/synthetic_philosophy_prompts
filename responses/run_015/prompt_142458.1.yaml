prompt: |-
  Hi. I'm a philosophy professor — metaphysics, mostly — and I've been pushing one line on Bradley's regress for a couple of years now, long enough that I can't tell any more whether its a view or just a reflex. Quick statement so we're on the same page: take a proposition like "Socrates is wise". It seems to have parts — Socrates, wisdom — that could have existed and been thought about without composing anything at all. So what makes those parts a unified proposition rather than a list? If you answer "a further relation does it", then that relation plus the original parts is itself just another plurality, and you need another relation to unify that, and off you go forever. My own position: the regress is manufactured by a bad picture of a proposition as entities plus a glue-relation, so I drop the glue. Propositions are structured complexes, and their unity is a primitive, ungrounded, unexplainable fact — there is just a brute difference between Socrates and wisdom composing a proposition and their being a mere plurality, and no constituent explains it. I bolt on a second claim I'm rather fond of: the real burden on the primitivist isn't "what makes unity obtain" (my answer is: nothing), it's a contrastive one — what makes this plurality unified rather than that arrangement of the very same items — and I think paying the contrastive tax honestly is what drives people back into either the regress or a collapse into "any old plurality can be a proposition", which is worse than anything.

  What I want from you is the honest defeater map, not the usual my-opponents-just-don't-get-it section. What would have to be true for this to be false? Include: whether the regress just reappears one level up (a fact that holds with no ground of its own looks like exactly the sort of thing Bradley could re-run the argument on); whether the contrastive tax is actually unpayable, or payable only by cheating; which other unities my view stands or falls with (facts, hylomorphic compounds, sentences, consciousness — if the same regress is general, my "solution" is just one application of a general failure); whether the brute-unity line quietly collapses into a rival, so that my structured propositions buy nothing over unstructured ones; and whether compositionality and the explanation of how we understand a proposition from its parts survives without glue. For each, say whether a committed primitivist would concede it as counting against them or would wriggle out — I care more about what my side would itself grant than about what critics say. And be blunt about whether I've insulated the thing into unfalsifiability, and whether that's actually a defect for a view of this kind. What would move me personally: a case my apparatus can't describe that someone else's can.

  Give it to me as a numbered list of exactly five items, ranked from fatal to merely awkward, one or two sentences each, no intro and no wrap-up. Talk's in three weeks, so keep it tight.
