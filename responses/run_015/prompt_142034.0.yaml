      *   **6. The "Did it Land?" Check:** A pair of proofs (one repairable, one not) or alternative.

  3.  **Drafting the Plan - Section by Section:**

      *   **1. Order of Operations:**
          *   *Problem:* If I start with BHK, it feels like syntax. If I start with Reals, it feels like analysis.
          *   *Solution:* Start with the *computational interpretation of proof* (BHK-ish but without saying "BHK" yet). This hooks the CS folks. Then show where Classical logic breaks this interpretation (LEM). Then introduce the Reals as the *consequence* of this interpretation (continuity).
          *   *Brouwer vs. Bishop:* This is a nuance trap. For an 80-min bootcamp, treat "Constructive" as "Computational/Bishop" primarily, but acknowledge Brouwer as the historical root that adds *more* constraints (continuity principles). Don't split them early; merge them under "Proofs must provide evidence."
          *   *Philosophy "Meaning as Use":* This is actually the *best* intro hook. Dummett/Wittgenstein adjacent. Use it to motivate BHK. It's not a derailment; it's the foundation.

      *   **2. The Example:**
          *   *Candidate 1:* $\sqrt{2}^{\sqrt{2}}$. Classic, but feels like a trick. It's a "gotcha" existence proof. It doesn't show *why* constructive is useful, just that classical is lazy.
          *   *Candidate 2:* IVT. Much richer. Distinguishes exact zero vs. approximate zero. Connects to computability (Specker sequence). Shows *information gain* (we get an approximation algorithm).
          *   *Decision:* IVT is superior for this audience. It bridges analysis and computability. It shows constructive math isn't just "less," it's "more precise."
          *   *Why not $\sqrt{2}^{\sqrt{2}}$?* It's a non-constructive existence proof that becomes constructive only by case analysis on a decidable property (is it rational?). It doesn't illustrate the failure of LEM on *undecidable* properties well enough.

      *   **3. Misconceptions:**
          *   *Misconception 1: "LEM is False."* Kill this early. $\neg\neg(A \vee \neg A)$ is provable. It's not false; it's *uninhabited* (no uniform witness).
          *   *Misconception 2: "Third Truth Value."* Kill this when discussing semantics. It's not 3-valued logic; it's about justification.
          *   *Misconception 3: "Just Classical - Axioms."* Address this with the Disjunction Property. It's a different *system*, not a subset.
          *   *Misconception 4: "Mechanical Conversion."* Address this with Double Negation Translation (DNGT). It works for $\Pi^0_1$ sentences but changes meaning for others.
          *   *Timing:* Address "LEM is false" immediately after introducing LEM. Address "Classical - Axioms" at the end with Disjunction Property.

      *   **4. Disjunction/Existence Properties:**
          *   *The Payoff:* Yes, this is the killer argument for CS folks. If $T \vdash A \vee B$, then $T \vdash A$ or $T \vdash B$.
          *   *Guardrail:* Must distinguish between *provable disjunctions* and *instances*. $P \vee \neg P$ is not provable for *all* $P$, but is provable for *decidable* $P$.
          *   *Phrasing:* "If the logic proves 'A or B' unconditionally, it must pick a side." Contrast with Classical: "Classical logic can prove 'A or B' by assuming 'not (A or B)' leads to contradiction, without knowing which one."
          *   *Gödel Connection:* If we could prove $P \vee \neg P$ for all arithmetic $P$, we could decide the Halting Problem.

      *   **5. What to Skip:**
