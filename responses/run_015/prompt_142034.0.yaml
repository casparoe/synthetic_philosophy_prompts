      *   **3. Misconceptions:** "LEM is false," "Constructive = Classical - axioms," "Mechanical conversion," "Third truth value." Timing of corrections.
      *   **4. Disjunction/Existence Properties:** Using them as the payoff (computational content). Guardrails against "but decidable props exist."
