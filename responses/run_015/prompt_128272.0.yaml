prompt: |-
  As a PhD student in philosophy of science studying explanatory reduction, I need a satirical parody for an upcoming workshop on metaphors in science communication. Write a deadpan corporate FAQ, about 600 words, in American English, for a fictional methodology consultancy called CraneWorks that advertises itself as fully "crane-compliant" — meaning every explanation it delivers is built bottom-up from mechanistic parts (cranes, in Dennett's familiar distinction) and rigorously audited to contain zero "skyhooks" (mysterious, top-down explanatory posits). The firm's internal quality protocol is named Greedy Reductionism Auditing: it uses this process not only to streamline explanations but also to dismiss any client's complaint about lost meaning, emergence, or normative significance as "explanatory debt" that must be eliminated. The satire should come from sustained internal contradiction: the marketing copy accidentally reintroduces skyhooks when describing "emergent value-proposition engineering"; the peer-review certification board rejects any study that fails to reduce its subject matter to fundamental physics; and the refund policy applies greedy reductionism to deny that dissatisfied customers ever experienced anything in need of explanation in the first place. Include at least one invented quotation from the firm's Chief Ontological Officer, Dr. Silas Vance, praising the abolition of explanatory debt. The tone should be dry, bureaucratic, and legible to someone familiar with Dennett's cranes-and-skyhooks framework, but it should not depend on knowing specific page numbers, publication dates, or texts. The central target is the slippage between legitimate mechanistic explanation and greedy reductionism, and the fantasy that skyhooks can be banned by corporate policy rather than by argument. End with a one-sentence summary of the satire's central target, formatted exactly as: Summary: [your sentence].
