  Weaken commitment (6) regarding the ontological vagueness of language-game boundaries to eliminate the most tension across the board.

  **Genuine Tensions (Ranked by Severity)**

  1.  **(2) Autonomous Norms vs. (6) Vague Boundaries (Severity: Critical)**
      *   **Conflict:** Internal norms (2) require a determinate jurisdiction to bind participants; if there is "no fact of the matter" about which game is being played (6), there is no fact about which norms apply, rendering normativity indeterminate.
      *   **What Gives:** Commitment (6) must be revised from ontological indeterminacy to pragmatic flexibility.
      *   **Cost:** You lose the radical contingency of game boundaries, but preserve the functionality of normativity required for (2) and (3).

  2.  **(3) Public Criteria vs. (6) Vague Boundaries (Severity: Critical)**
      *   **Conflict:** The private-language argument (3) relies on the possibility of checking correctness against public criteria; if game membership is indeterminate (6), correctness conditions become indeterminate, undermining the checkability required to block private language.
      *   **What Gives:** Commitment (6) must concede that boundaries are sharp enough *in context* to sustain criteria.
      *   **Cost:** You must accept that while boundaries are not *metaphysically* fixed, they are *normatively* decisive when drawn, avoiding skepticism about meaning.

  3.  **(1) No Essences vs. (3) Public Criteria (Severity: High)**
      *   **Conflict:** If meaning *requires* public criteria (3), then "having public criteria" is an essential feature shared by every language game, contradicting the claim that there is *no* single essential feature (1).
      *   **What Gives:** Commitment (1) must be qualified to exclude transcendental conditions of possibility from the ban on essences.
      *   **Cost:** You must distinguish between descriptive essences (which you deny) and grammatical conditions (which you accept), complicating your anti-essentialist slogan.

  4.  **(5) Math Non-Exceptionalism vs. (6) Vague Boundaries (Severity: Moderate)**
      *   **Conflict:** Mathematical proof procedures appear to demand sharp boundaries for validity; claiming these boundaries are ontologically vague (6) threatens the rigor inherent in (5).
