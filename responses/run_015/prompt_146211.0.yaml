  ### Analysis of Constraints and Families

  **Joint Unsatisfiability**
  Your suspicion is correct, but only under a specific condition. The triad of "measurable from the record," "thickly bad," and "not merely transformation" is jointly unsatisfiable *if* "thickly bad" is defined as universal human suffering. In the Kavos case, complexity loss (measurable, not transformation) coincides with welfare gain (not bad). To save the definition, you must sacrifice the intuition that collapse is always a human tragedy. You can retain all three only if "thickly bad" is redefined as "loss of capacity for the specified unit." This means accepting that a collapse can be rational to prevent for the state but rational to welcome for the peasant. If you demand collapse be bad for *everyone*, you cannot define it using archaeological complexity metrics.

  **Most Exclusionary Requirement**
  The requirement that does the most work ruling candidate definitions out is **Specify the unit and stratum**. Most failures of the concept stem from vagueness about whose collapse is being described. A definition that does not force you to declare whether it is the elite, the polity, or the population that is collapsing cannot resolve the Kavos case, cannot distinguish systemic failure from routine turnover, and cannot determine if the event is "bad." It is the gatekeeper for all other criteria.

  **Performance of Definition Families**
  *   **Complexity-and-marginal-returns:** Breaks against the "thickly bad" requirement; it correctly identifies Kavos as a collapse but fails to explain why anyone should care if the people are healthier.
  *   **Wellbeing-or-lived-experience:** Breaks against the "measurable from the record" requirement; skeletal health and violence markers are too sporadic and lagging to date the event precisely or distinguish it from normal variation.
  *   **Resilience/transformation:** Breaks against the "not merely transformation" requirement; by framing everything as adaptation, it loses the normative weight that makes collapse something rational to prevent.

