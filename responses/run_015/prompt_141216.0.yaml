answer: |-
  # The One-Hour Outside View Protocol

  **Purpose:** To generate a defensible probability estimate (0–100%) or an explicit refusal for 20–30 year institutional forecasts.
  **Time:** 60 minutes per question.
  **Participants:** Committee of generalists.
  **Output:** A single number (probability of survival) OR a signed Refusal Statement.

  ---

  ## Phase 1: Definition (15 mins)
  **Step 1: The Unit Question (Failure Condition)**
  *   **Action:** Write down the specific condition that counts as "failure." Do not define the entity by its name; define it by its function or structure.
  *   **Test:** If the name remains but the function ceases, is it dead? If the function remains but the name changes, is it alive?
  *   **Decision Rule:** If the committee cannot agree on a binary success/failure condition within 10 minutes, **STOP**. Proceed to *Refusal Output*.
  *   *Judgment Flag:* This is not factual; it is ontological. You are deciding what "counts" as the thing.

  **Step 2: The Reference Class & Selection Check**
  *   **Action:** Identify 5–10 historical analogues. (e.g., for a university department: "Humanities departments at R1 universities," not "Great Ideas").
  *   **Selection Bias Check:** Ask: "Is this list filtered by success?" (e.g., are we only counting empires we remember because they lasted?)
  *   **Correction:** If the class is filtered by survival, broaden it to include failed attempts or "near misses" even if data is sparse.
  *   **Decision Rule:** If no comparable class exists (N < 3), **STOP**. Proceed to *Refusal Output*.

  ## Phase 2: Calculation (30 mins)
  **Step 3: The Continuity Convention (Sensitivity Analysis)**
  *   **Action:** Calculate the median survival time of your class under two definitions:
      1.  *Strict Identity:* (Same name, charter, legal structure).
      2.  *Functional Identity:* (Same role, regardless of reorganization/merger).
  *   **Decision Rule:** If the median survival time differs by >50% between the two conventions, record the probability as a **Range** (e.g., 40–70%) rather than a point estimate. If the range spans 0–100, **STOP**. Proceed to *Refusal Output*.
  *   *Judgment Flag:* You are choosing how to count history. This is a convention, not a discovery.

  **Step 4: Hazard Shape Assumption**
  *   **Action:** Select a risk profile.
      *   *Constant Hazard:* Risk is the same every year (Memoryless). **Default.**
      *   *Infant Mortality:* High risk early, stabilizes later.
      *   *Aging:* Risk increases with time (fragility).
  *   **Decision Rule:** Unless there is specific mechanistic evidence for *Infant* or *Aging*, use *Constant Hazard*. Mark this assumption with an asterisk in the final memo.
  *   *Judgment Flag:* Historical data rarely distinguishes these shapes. This is a modeling choice.

  **Step 5: The Inside View Discount (Double Counting)**
  *   **Action:** List reasons why *this* case is different from the historical average (e.g., "Our endowment is larger," "Nuclear deterrence is new").
  *   **Discount Rule:** For every "unique" factor, reduce its weight by 50% to account for overconfidence. If the factor is already reflected in the reference class (e.g., "We are a university" is already in the class definition), ignore it.
  *   **Decision Rule:** If the adjustment relies on a value claim (e.g., "Philosophy is essential") rather than a causal mechanism (e.g., "Philosophy generates X revenue"), **STOP**. Proceed to *Values Call Output*.

  ## Phase 3: Output (15 mins)
  **Step 6: The Number or The Refusal**
  *   **Calculation:** Base Rate Probability ± Inside View Adjustment.
  *   **Refusal Condition:** If you stopped in Steps 1, 2, 3, or 5, write the Refusal Statement.
  *   **Values Call:** If the question depends on whether the institution *should* survive rather than *will* survive, write the Values Call Statement.

  ---

  # Protocol Application

  ### Case 1: The European Union in 2050
  *   **Step 1 (Unit):** Failure = Dissolution of the single market and free movement treaties. (Mere name change "EU" to "European Federation" counts as survival).
  *   **Step 2 (Class):** Supranational political unions since 1800. (N is small, ~5–8 clear cases). Selection bias noted: We remember the Holy Roman Empire, forget the short-lived customs unions.
  *   **Step 3 (Continuity):**
      *   *Strict:* Treaties of Rome/Maastricht. Median life ~40 years.
      *   *Functional:* European economic integration project. Median life ~70+ years (includes EEC, ECSC).
      *   *Result:* Range required.
  *   **Step 4 (Hazard):** Constant Hazard assumed (political shocks are unpredictable). *Asterisked.*
  *   **Step 5 (Adjustment):** "Nuclear peace" and "Economic interdependence" are inside-view factors. Discounted by 50% as these are common claims for past unions too.
  *   **Output:** **60% (Range 45–75%).**
  *   **Note:** The range reflects the Continuity Convention sensitivity.

  ### Case 2: Philosophy Department (Free-Standing) in 2045
  *   **Step 1 (Unit):** Failure = Merger into "School of Humanities" or "Liberal Studies" where Philosophy loses budgetary autonomy. (Name "Philosophy" on a course list does not count).
  *   **Step 2 (Class):** Humanities departments at private R1 universities, 1970–2020.
  *   **Step 3 (Continuity):**
      *   *Strict:* "Department of Philosophy."
      *   *Functional:* "Autonomous budget unit for Philosophy."
      *   *Result:* Medians are similar; most mergers eliminate autonomy. No range needed.
  *   **Step 4 (Hazard):** *Aging Hazard.* Small departments face increasing pressure as enrollment shifts. Default overridden by specific demographic data.
  *   **Step 5 (Adjustment):** "Philosophy is core to the mission" is a Values Claim, not a causal mechanism. Must be discarded for forecasting. "Endowment protection" is a causal mechanism.
  *   **Output:** **35%.**
  *   **Note:** High risk. The "Values Call" trigger was nearly hit; the number relies strictly on budgetary autonomy trends, not the value of the discipline.

  ### Case 3: No War Between Nuclear States (This Century)
  *   **Step 1 (Unit):** Failure = Direct kinetic conflict between two recognized nuclear powers.
  *   **Step 2 (Class):** Great Power dyads with existential weaponry.
  *   **Step 3 (Continuity):** N/A.
  *   **Step 4 (Hazard):** N/A.
  *   **Step 2 (Revisit):** **Selection Bias Critical.** The class of "Nuclear States" only exists because they haven't destroyed themselves yet. The sample size of *failed* nuclear states is effectively zero (because they are gone).
  *   **Decision:** The reference class is contaminated by survivorship bias to the point of uselessness. We cannot compute a base rate.
  *   **Output:** **EXPLICIT REFUSAL.**
  *   **Refusal Statement:** "This forecast requires a base rate of nuclear war among nuclear powers. Historical data contains zero instances of the failure condition because such instances eliminate the observers. Any number generated would be a guess disguised as a statistic. We refuse to assign a probability."

  ---

  # Limitations & Misfire Points

  **1. The Reflexivity Trap**
  This procedure assumes the forecast does not change the outcome. University planning is reflexive: if the committee forecasts "Department Closure" with 80% probability, donors may withdraw or rally, altering the probability.
  *   *Mitigation:* Mark forecasts as "Ceteris Paribus" (all else equal). If the forecast is intended to *drive* policy, the Outside View is the baseline, not the prediction.

  **2. The "Black Swan" Blindness**
  The Hazard Shape step defaults to "Constant" or "Aging" based on known history. It cannot account for structural breaks (e.g., AI making residential education obsolete, a pandemic, a new energy technology).
  *   *Mitigation:* The "Range" output in Step 3 is the only buffer here. If the uncertainty is structural, the range should be wide.

  **3. The Dean's Constraint (Values vs. Facts)**
  The Dean requires a number or refusal. However, many long-range questions (e.g., "Will we still be a residential campus?") are actually value questions ("Will we *choose* to value residential campus life?").
  *   *Misfire:* The protocol will force a Refusal on these, which may be politically frustrating.
  *   *Action:* Use the **Values Call Output**. "This is not a prediction of fact, but a prediction of preference. We cannot forecast the future values of the Board."

  **4. The Fake Precision Asterisk**
  You asked to flag where judgment is dressed as procedure.
  *   **Step 4 (Hazard)** is the biggest offender. Choosing "Constant Hazard" is a mathematical convenience, not a historical truth.
  *   **Step 5 (Discount)** is arbitrary. Why 50%? Because it feels like regression to the mean.
  *   *Honesty:* The memo to the Dean must include the asterisks: *"Probability assumes constant hazard rate"* and *"Inside view claims discounted by standard heuristic."*

  **5. Institutional Self-Preservation**
  The committee is part of the institution it is forecasting. There is an unconscious incentive to avoid numbers that imply institutional decay.
  *   *Mitigation:* The "Outside View" requirement forces the use of *other* institutions' failure rates. It is harder to argue "We are special" when looking at a spreadsheet of closed departments.

  **Summary for the Dean:**
  This sheet does not predict the future. It audits our confidence. It tells you when we are guessing (Refusal), when we are relying on values (Values Call), and when we have a statistical basis for a number (Probability). It prevents us from lying to you with false precision.
