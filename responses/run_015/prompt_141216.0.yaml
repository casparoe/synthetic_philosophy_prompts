prompt: |-
  I'm a philosophy professor and two things have collided this year. First, I got voluntold onto the university's long-range planning committee: four times a year we're asked for a one-page outside view on some 20-to-30 year question (will there still be a residential undergraduate model here, will the current endowment spend rule survive, will this campus still be doing the thing it's doing), and the page has to end in either a number or an explicit refusal, because the dean signs it and the dean will not sign "it depends." Second, I teach an undergrad seminar where students write their own twenty-year forecasts about institutions and I have to grade the reasoning, not the outcome — which is basically the same skill, and I'd like to use the same sheet for both.

  What I want from you is the sheet. Not the forecasts. And definately not a reading list: I've read around in this stuff enough to know I'd just be handed a pile of names I can't follow up on. I want a procedure that a committee of non-specialists — me, someone from facilities, an economist who is polite about the rest of us, and a rotating faculty member — can actually run in about an hour per question, working from what a smart generalist already knows plus maybe an hour in the library. Give me the questions in order; what counts as an answer to each that's good enough to move on; where the procedure returns "no number, stop"; and where it has to stop and hand the question over as a values call rather than a factual one. Then run it on three of our real questions, below.

  The conceptual work is in the translation, and there are five places I keep getting stuck. I'd like you to turn each into a step or tell me it isn't load-bearing:

  - The unit question. Before any counting, what exactly has to stop being true for the forecast to have failed? I think committees skip this and end up forecasting the survival of a name rather than a practice.
  - The continuity convention. Durations of past empires are partly an artifact of how we count: republic into empire into successor state, a change of dynasty or constitution, a rump that keeps the name. I want a step that forces the committee to recompute the base rate under two different identity conventions and see whether the median actually moves, and a rule for what to do when it does.
  - The class is selected on the outcome. My half-baked version: our list of past empires is a list of polities that were good at being remembered, and short-lived ones leave less behind, so the class is filtered by the very variable we're measuring. If that's right, make it a check; if it's a confusion, say so.
  - Hazard shape. Constant-hazard (memoryless), infant mortality then consolidation, or the "the longer it's lasted the longer it'll last" shape — these give wildly different medians for remaining life, and I suspect small historical samples can't distinguish them. I want the step to say what to assume when the data can't decide, and to makr that it's an assumption.
  - Double counting. The story about why *we* are different is often information already reflected in the class. But sometimes it isn't — a mechanism genuinely absent from all the historical cases. I need a usable rule for how far to shrink toward the base rate, not just the reminder that we're overconfident.

  Flag clearly the points where judgment can't be eliminated and where a step is a judgment call dressed up as procedure — I'd rather hand the dean three honest asterisks than a fake algorithm.

  Run it on: (1) the committee's actual question, whether there will still be something recognisably like the current European Union in 2050; (2) whether my own philosophy department will still be a free-standing department in 2045 — this one is mine and I already dread where the outside view goes; (3) a student's forecast that there will be no war between nuclear-armed states this century, where I suspect the honest output is a refusal or an interval too wide to be useful, and I want to see what a clean refusal looks like on the page.

  Finally: tell me what this procedure cannot do. Where will it misfire on the questions a university actually asks, and what should we do on those?
reasoning: |-
  Here's a thinking process that leads to the suggested forecasting procedure:

  1.  **Analyze the Request:**
      *   **User:** Philosophy professor, on a university long-range planning committee.
      *   **Task:** Create a one-page forecasting procedure ("the sheet") for non-specialists to use in ~1 hour per question.
      *   **Constraints:** Must end in a number or an explicit refusal (Dean's rule). Must grade reasoning, not outcome (like the undergrad seminar). No reading lists.
      *   **Specific Conceptual Sticking Points to Address:**
          1.  *Unit Question:* Defining failure conditions (name vs. practice).
          2.  *Continuity Convention:* Handling identity changes over time (base rate sensitivity).
          3.  *Selection Bias:* Survivorship bias in historical classes.
          4.  *Hazard Shape:* Assumptions about failure rates over time (constant, increasing, decreasing).
          5.  *Double Counting:* Adjusting base rates for specific information (inside view vs. outside view).
      *   **Requirement:** Flag where judgment is unavoidable (honest asterisks).
      *   **Application:** Run the procedure on three specific cases:
          1.  EU existence in 2050.
          2.  Philosophy department existence in 2045.
          3.  No war between nuclear states this century (likely refusal).
      *   **Final Output:** Limitations of the procedure (where it misfires).

  2.  **Deconstruct the "Sheet" (The Procedure):**
      *   *Goal:* A structured, repeatable process that forces rigor without requiring expertise.
      *   *Time Limit:* ~1 hour.
      *   *Format:* Step-by-step checklist with "Pass/Fail" or "Move/Stop" criteria.
      *   *Addressing the 5 Sticking Points:*
          1.  *Unit:* Step 1 (Definition).
          2.  *Continuity:* Step 3 (Base Rate Sensitivity).
          3.  *Selection:* Step 2 (Reference Class Construction).
          4.  *Hazard:* Step 4 (Distribution Assumption).
          5.  *Double Counting:* Step 5 (Adjustment).
      *   *Refusal Condition:* Needs a specific trigger (e.g., inability to define reference class, irreducible value conflict).

  3.  **Drafting the Steps (Iterative Process):**

      *   *Step 1: The Unit (Failure Condition).* Need to define *what* is surviving. Is it the name "EU" or the function "European economic integration"?
          *   *Action:* Write down the "Death Condition."
          *   *Check:* If the committee can't agree on the death condition, stop (Refusal).

      *   *Step 2: The Class (Reference Class & Selection Bias).* What are we comparing this to? Universities? Alliances? Departments?
          *   *Action:* Identify the class. Check for survivorship bias (are we only looking at successful ones?).
          *   *Check:* If no comparable class exists, stop (Refusal).

      *   *Step 3: Continuity (Identity Convention).* Does the definition change the base rate?
          *   *Action:* Calculate base rate under "Strict Identity" (name/constitution) and "Functional Identity" (role/practice).
          *   *Check:* If the median survival time differs by >50%, flag as high uncertainty.

      *   *Step 4: Hazard Shape (Time Dependence).* How does risk change over time?
          *   *Action:* Choose a model (Constant, Infant Mortality, Aging). Default to Constant if unsure (memoryless).
          *   *Check:* Acknowledge this is an assumption.

      *   *Step 5: Adjustment (Inside View/Double Counting).* Why are we special?
          *   *Action:* List specific differentiators. Discount them by 50% (regression to mean) unless evidence is overwhelming.
          *   *Check:* If adjustment relies on values rather than facts, stop (Values Call).

      *   *Step 6: The Number or Refusal.*
          *   *Action:* Compute probability. If range is too wide or values dominate, write Refusal.

  4.  **Refining the "Honest Asterisks":**
      *   Need to explicitly mark where the committee is making a value judgment disguised as math.
      *   *Key spots:* Defining the "Unit" (what counts as the EU?), Choosing the "Hazard" (is age protective or risky?), and the "Adjustment" (how much does our excellence matter?).

  5.  **Running the Procedure on the Three Cases:**

      *   *Case 1: EU in 2050.*
          *   Unit: Treaty framework vs. Economic zone.
          *   Class: Supranational unions (hard to find), Alliances (NATO), Empires.
          *   Hazard: Political entities often have constant hazard or aging risk.
          *   Result: Likely a number, but wide interval. Let's say 65%.

      *   *Case 2: Philosophy Dept in 2045.*
          *   Unit: Free-standing department vs. merged into Humanities.
          *   Class: University departments (high survival), Humanities depts (lower survival).
          *   Hazard: Institutional inertia suggests low hazard, but budget pressures suggest increasing hazard.
          *   Result: Low probability of *free-standing* status. Maybe 30%.

      *   *Case 3: No Nuclear War.*
          *   Unit: Direct conflict between nuclear states.
          *   Class: Great Power wars, Nuclear dyads.
          *   Problem: Low N (Near zero historical instances of nuclear war). Selection bias is huge (survivorship bias of the species).
          *   Hazard: Unknown.
          *   Result: Refusal. The reference class is too thin.

  6.  **Addressing the Limitations:**
      *   Where does this fail?
      *   Black Swans (unpredictable structural shifts).
      *   Value-laden questions (Should we exist? vs. Will we exist?).
      *   Reflexivity (The forecast changes the outcome).
      *   Institutional politics (The Dean wants a specific number).

  7.  **Review against Constraints:**
      *   *One-page feel:* Keep it tight.
      *   *No reading list:* Check.
      *   *Address 5 sticking points:* Check.
      *   *Flag judgment calls:* Check.
      *   *Run on 3 cases:* Check.
      *   *Limitations section:* Check.

  8.  **Final Polish:**
      *   Tone: Professional, academic, slightly cynical but constructive (matching the user).
      *   Formatting: Clear headings, bullet points for the "Sheet," distinct sections for the cases.
      *   *Self-Correction on "Refusal":* The prompt says the Dean won't sign "it depends." But the prompt *also* asks me to show what a "clean refusal looks like on the page." I need to navigate this. The procedure must allow for a "Refusal to Forecast" which counts as the required "explicit refusal" output the Dean accepts. The prompt says "end in either a number or an explicit refusal." Okay, so "Refusal" is a valid output for the Dean, provided it's explicit.

      *   *Refining the "Double Counting" step:* The user wants a rule for shrinking toward the base rate. I'll suggest a specific discount factor (e.g., "Inside View Discount") to make it procedural.

      *   *Refining "Hazard Shape":* Since data is scarce, the procedure should mandate a "Conservative Default" (usually constant hazard) but require a flag if the entity is very young or very old.

      *   *Refining "Selection Bias":* Make this a specific check in the Reference Class step. "Are we looking at winners only?"

  9.  **Drafting the Content:** (Mental or scratchpad)
      *   *Title:* The One-Hour Outside View Protocol.
      *   *Steps:* 1. Define Death. 2. Pick Class. 3. Check Bias. 4. Set Hazard. 5. Adjust. 6. Output.
      *   *Cases:* Apply strictly.
      *   *Limitations:* Be honest about the "fake algorithm" risk.

  10. **Final Review against User Voice:** The user is a philosophy professor. They appreciate precision, distinction between fact/value, and acknowledgment of epistemic limits. Use language like "epistemic stop," "reference class," "survivorship bias."

      *(Self-Correction during drafting Case 3)*: The prompt asks for a "clean refusal." I need to make sure the output for Case 3 isn't just "I don't know," but a structured "This question violates the protocol's assumptions."

      *(Self-Correction on Dean's Rule)*: The Dean wants a number OR an explicit refusal. So the procedure *must* allow for a refusal output. My procedure will include a "Stop & Declare Refusal" path.

      *(Final check on the 5 sticking points)*:
      1. Unit -> Step 1.
      2. Continuity -> Step 3.
      3. Selection -> Step 2.
      4. Hazard -> Step 4.
      5. Double Counting -> Step 5.
      All accounted for.

