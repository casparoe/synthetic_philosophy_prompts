answer: |-
  This question tests the claim that the Condorcet Jury Theorem's support for majority rule is contingent on independence and competence conditions that, when violated, may license weighted voting or expert rule rather than democratic equality.

  **SEMINAR FINAL: EPISTEMIC DEMOCRACY**
  **Time Allowed: 45 Minutes**
  **Total Marks: 25**

  **Question 1**
  Consider a decision-making committee of 21 members voting on a yes/no question where there is a single correct answer. Each member has a competence *p*, defined as the probability they vote correctly.

  (a) Assume initially that all 21 members are independent and have *p* = 0.6. State the limit of the probability of a correct majority decision as the group size grows, and explain briefly why this result is often used to justify democratic equality. (5 marks)

  (b) Now assume that 7 of the 21 members form a bloc: they all read the same flawed briefing memo and vote identically, while the remaining 14 remain independent with *p* = 0.6. Explain how this correlation affects the "effective" group size and the asymptotic reliability of the majority vote compared to case (a). (5 marks)

  (c) Suppose instead that competences are unequal: 3 members are experts with *p* = 0.9, and 18 are novices with *p* = 0.55. Compare the reliability of a simple majority rule against a weighted rule (weighting by log-odds) and against deferring to the single best expert. Is majority rule optimal here? (5 marks)

  (d) Based on (a)–(c), evaluate the following claim: "Because the Condorcet Jury Theorem shows large groups are reliable, one-person-one-vote is epistemically superior to weighted voting or expert rule in real elections." In your answer, distinguish between the settled mathematical results and the contested political application. (10 marks)

  ***

  **MODEL ANSWER**

  (a) Under standard Condorcet Jury Theorem (CJT) assumptions, if *p* > 0.5 and votes are independent, the probability of a correct majority decision approaches 1 as the group size approaches infinity. This is used to justify democratic equality because it suggests that aggregating many modestly competent judgments via simple majority outperforms any single individual, rendering unequal voting weights unnecessary for accuracy.

  (b) The correlated bloc reduces the "effective" group size. Although there are 21 heads, the 7 correlated members provide only one unit of independent evidence. Mathematically, the error correlation prevents the variance from shrinking as expected. While the limit may still approach 1 if the independent members dominate, the rate of convergence slows drastically. More critically, if the shared memo is wrong, the bloc guarantees a fixed chunk of error that independence cannot wash out. In extreme correlation, the group reliability hits a ceiling below 1, regardless of size. This shows that adding heads does not add evidence if the heads are not independent.

  (c) With unequal competences, simple majority rule is not necessarily optimal. The optimal epistemic rule weights votes by the log-odds of their competence (*log(p/(1-p))*). The experts (p=0.9) carry significantly more weight than novices (p=0.55). In small groups (N=21), deferring to the single best expert (p=0.9) can sometimes outperform a majority of novices, depending on the specific distribution. Majority rule treats all evidence as equal, but if evidence quality varies, weighting maximizes reliability. Thus, the CJT result for equal competence does not license equal voting weights when competence is known to vary.

  (d) The claim conflates settled mathematics with contested political theory. It is mathematically settled that majority reliability requires independence and *p* > 0.5. It is also settled that correlation lowers reliability and unequal competence favors weighting. However, whether real electorates satisfy these conditions is genuinely disputed. Formal epistemologists often argue real voters lack independence (due to media bubbles) or competence (p < 0.5), which would make majority rule worse than chance (limit approaches 0). Political theorists contest whether epistemic reliability is the sole metric of legitimacy, arguing that equality has intrinsic value regardless of accuracy. Therefore, the CJT licenses majority rule only conditionally. To transfer the theorem to real democracy, one must prove real voters are sufficiently independent and competent—a claim the theorem itself does not establish. Consequently, the math supports epistocracy (weighting/experts) if conditions fail, while democracy requires additional normative premises beyond the theorem.

  ***

  **MARKING SCHEME**

  **1. Baseline CJT Conditions (5 marks)**
  *   **Must Hit:** Correctly identifies limit = 1 given *p* > 0.5 and independence; links this to the argument for equality (aggregation beats individual).
  *   **A/B Distinction:** A grades explicitly note *p* > 0.5 is required; B grades often assume size alone guarantees correctness.
  *   **Typical Botch:** Stating "bigger groups are always better" without mentioning the competence threshold.

  **2. Correlation and Effective Size (5 marks)**
  *   **Must Hit:** Explains that correlated votes reduce effective *N*; notes that reliability hits a ceiling < 1 or convergence slows.
  *   **A/B Distinction:** A grades explain *why* (lack of new evidence); B grades just say "it gets worse" without mechanistic explanation.
  *   **Typical Botch:** Treating the bloc as 7 independent votes or claiming the limit becomes 0 immediately.

  **3. Unequal Competence and Weighting (5 marks)**
  *   **Must Hit:** Identifies that majority rule is sub-optimal when competences vary; mentions weighting (log-odds) or expert deference.
  *   **A/B Distinction:** A grades distinguish finite group performance (where expert might win) from limit claims; B grades assume majority always wins eventually.
  *   **Typical Botch:** Arguing majority rule is fair so it must be epistemically optimal.

  **4. Finite vs. Limit Distinction (5 marks)**
  *   **Must Hit:** Recognizes that asymptotic results (limit) may not hold for realistic sizes (N=21); notes divergence if *p* < 0.5.
  *   **A/B Distinction:** A grades explicitly separate the mathematical limit from practical application; B grades treat the limit as a promise for any large group.
  *   **Typical Botch:** Assuming the theorem guarantees high reliability for N=21 without checking parameters.

  **5. Settled Math vs. Contested Politics (5 marks)**
  *   **Must Hit:** Distinguishes between theorems (settled) and voter behavior/legitimacy (contested); acknowledges epistocratic alternative if conditions fail.
  *   **A/B Distinction:** A grades clearly flag that CJT does not prove democracy is legitimate, only that it is accurate *if* conditions hold; B grades present the pro-democracy conclusion as fact.
  *   **Typical Botch:** Concluding "therefore democracy is best" without addressing the conditionality or the legitimacy counter-argument.

  **Total: 25 Marks**
