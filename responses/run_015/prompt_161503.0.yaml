prompt: |-
  Hi — I'm the clinical lead for multidisciplinary review panels at a regional hospital system. Roughly 40–50 decisions a month, panels of 4 to 9 people (mix of consultants, registrars, senior nurses), simple majority, advisory to whoever is on call. Typical questions: is this imaging finding suspicious enough to recall the patient; is this patient deteriorating enough to escalate; is this discharge safe. I've been reading about the Condorcet jury theorem and I want to know whether it can be turned into something my team actually runs each week, rather than a thing I half-remember from a blog post.

  What I want is a decision procedure we can follow in about fifteen minutes before a panel meets, no stats background required, that decides how to set the panel up for this class of case. In order, roughly:

  1. Does the theorem even apply — is there a right answer that exists independently of what the panel says? I have a nagging feeling that for a good chunk of our calls the panel's say-so partly constitutes the answer, or it's really a values call about acceptable risk, and majority voting is just a way of laundering responsibility. If so, say so and hand it to a named person.
  2. Is average competence on this class of case actually above half, or are we assuming it? Note that competence is an average over a type of case, not a fixed trait of a person — we get outcome data back on maybe half our calls, and for the escalation ones nobody ever observes what would have happened to a patient we didn't escalate.
  3. Independence. Everyone reads the same chart, the same guideline, the same handover note from the same tired registrar, so the errors share a component. My hunch is there's an effective number of independent voters that saturates around four or five and a ninth person buys approximately nothing — but I dunno how to check which regime we're in, or how to weigh a smaller, genuinely defferent group against a bigger, correlated one.
  4. Protocol: blind votes, then deliberate, then re-vote? Or just deliberate and vote? Show a running tally or not? I keep hearing both that discussion wrecks independence and that it's the entire point of meeting.
  5. Weighting — do we weight by seniority? My guess is no unless someone can show the variable tracks accuracy on this case type.

  Two more things. First, a hunch: for questions that are really forecasts about what will happen rather than facts already fixed, majority-of-yes/no is the wrong aggregation device and averaging probabilities would be better. Tell me when to switch, and be straight with me if the switch needs calibration data we don't have and won't get. Second, flag which steps are judgment calls dressed up as procedure, and mark where the procedure just stops and a human decides — and say for each stop whether it's because it's a values question or because we're data-poor.

  Run it on three cases: (a) recall-or-not on a screening mammogram, five readers, same images, outcome known about a year later; (b) should this borderline patient go to a higher level of care tonight, ground truth never observed, on-call consultant has to sign; (c) a rare presentation where the two most senior people disagree and nobody in the room has seen more than a couple like it. I suspect at least one gives me an answer I don't want — say which, and don't soften it.

  Don't bother with citations, I can chase those myself. Sorry for the rambling, I'm writing this between two meetings.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Clinical lead for multidisciplinary review panels (MDT) at a regional hospital system.
      *   **Context:** 40-50 decisions/month, panels of 4-9 people (mix of seniority), simple majority, advisory to on-call.
      *   **Task Types:** Imaging recall, deterioration escalation, discharge safety.
      *   **Goal:** Turn Condorcet Jury Theorem (CJT) theory into a practical 15-minute pre-panel decision procedure. No stats background required for the team.
      *   **Specific Questions:**
          1.  Applicability (Is there an objective truth?).
          2.  Competence (Is $p > 0.5$?).
          3.  Independence (Correlated errors due to shared info).
          4.  Protocol (Vote -> Deliberate -> Vote?).
          5.  Weighting (Seniority vs. Accuracy).
          6.  Forecasts vs. Facts (Probability averaging vs. Majority vote).
          7.  Flag judgment calls/data-poor stops.
          8.  Run on three specific cases (a, b, c).
      *   **Tone:** Direct, pragmatic, no fluff, no citations, willing to deliver unwelcome truths ("don't soften it").

  2.  **Deconstruct the Condorcet Jury Theorem (CJT) in this Context:**
      *   *Core Premise:* If voters are independent and competent ($p > 0.5$), adding voters increases the probability of a correct majority decision approaching 1.
      *   *Limitations:* Violated by correlation (shared information), incompetence ($p < 0.5$), and lack of objective truth (values/preferences).

  3.  **Address the Specific Questions (Drafting the Procedure):**

      *   *Q1: Applicability (Truth vs. Values).*
          *   Imaging recall: Truth exists (cancer present/absent), but threshold is values-based (risk tolerance).
          *   Escalation: Counterfactual truth (would they have crashed?), unobservable.
          *   Discharge: Safety is probabilistic.
          *   *Verdict:* CJT applies best to diagnostic facts. It fails on value judgments (risk tolerance). If it's a values call, CJT is "responsibility laundering."
          *   *Action:* Triage cases. Fact-heavy -> CJT. Value-heavy -> Named decision-maker.

      *   *Q2: Competence ($p > 0.5$).*
          *   Assumption: Clinicians are better than chance.
          *   Reality: Hard to measure without feedback loops.
          *   *Action:* Assume $p > 0.5$ for credentialed staff *within scope*. If outside scope (rare case), competence drops.

      *   *Q3: Independence.*
          *   Major issue: Shared charts, guidelines, handover notes create common mode failure.
          *   *Effective N:* Diminishing returns after 4-5.
          *   *Action:* Cap panel size for efficiency. Seek *perspective* diversity, not just headcount.

      *   *Q4: Protocol.*
          *   Deliberation kills independence (groupthink/anchoring).
          *   Blind vote preserves independence signal.
          *   *Action:* Silent review -> Private Vote -> Deliberate -> Final Vote (if needed).

      *   *Q5: Weighting.*
          *   Seniority $\neq$ Accuracy on specific tasks.
          *   *Action:* One person, one vote, unless specific data shows otherwise (unlikely).

      *   *Forecast vs. Fact.*
          *   Yes/No is bad for probabilities.
          *   Averaging probabilities (Wisdom of Crowds) is better for risk.
          *   *Constraint:* Requires calibration. If no data, stick to binary but acknowledge the limitation.

  4.  **Develop the 15-Minute Pre-Panel Procedure:**
      *   Needs to be a checklist/flowchart.
      *   Step 1: Truth vs. Values (The "Stop" check).
      *   Step 2: Competence Check (Scope).
      *   Step 3: Independence Check (Panel composition).
      *   Step 4: Voting Method (Binary vs. Probability).

  5.  **Apply to the Three Cases:**

      *   *(a) Mammogram Recall:*
          *   Truth exists (cancer yes/no).
          *   Competence high (radiologists).
          *   Independence low (same images).
          *   *CJT Verdict:* Works, but diminishing returns.
          *   *Unwelcome Truth:* 5 readers is overkill if looking at same static images without independent acquisition.

      *   *(b) Escalation (Counterfactual):*
          *   Truth unobservable.
          *   Values heavy (risk tolerance).
          *   *CJT Verdict:* Fails. It's a risk policy decision.
          *   *Unwelcome Truth:* The panel is anxiety relief, not truth-seeking. The on-call consultant owns the risk, not the vote.

      *   *(c) Rare Presentation (Seniors Disagree):*
          *   Competence compromised (nobody has seen this).
          *   $p$ might be $< 0.5$ or random.
          *   *CJT Verdict:* Fails. Garbage in, garbage out.
          *   *Unwelcome Truth:* The vote is meaningless. You need external expertise or a "least regret" heuristic, not a majority.

  6.  **Refine the Output (Tone and Structure):**
      *   Keep it tight.
      *   Use bolding for actionable items.
      *   Explicitly mark "Judgment Call" and "Data-Poor Stop."
      *   Ensure the "Unwelcome Truths" are clear.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I answer the "probability averaging" point?
      *   *Fix:* Need to be clear that without calibration data, probability averaging is dangerous (overconfidence). Stick to binary for now but flag the limitation.
      *   *Critique:* Is the 15-minute limit realistic?
      *   *Fix:* The procedure is for the *Lead* to run before the meeting, or a triage step at the start. Let's make it a triage checklist for the Lead.
      *   *Critique:* The user asked about "effective number of independent voters."
      *   *Fix:* Address the saturation point (4-5) explicitly in the protocol.

  8.  **Final Polish:** Check against the "don't soften it" instruction regarding the three cases. Ensure the distinction between "Fact" and "Value" is sharp. (Self-correction: Ensure I explicitly state where the procedure stops and a human decides).

  **(Self-Correction on Case B):** The user says "ground truth never observed." This is the classic counterfactual problem. CJT requires a "correct" answer. If there is no correct answer to verify against, CJT is mathematically void. I need to be firm on this.

  **(Self-Correction on Case C):** If seniors disagree on a rare case, the average competence is unknown. CJT assumes $p > 0.5$. If $p$ is unknown or low, adding voters adds noise, not signal.

  **(Self-Correction on Protocol):** Blind vote *before* discussion is crucial for independence. Discussion *after* allows information pooling. Final vote *after* discussion incorporates the new info but loses independence. The "Two-Stage" model is best.

  9.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  Here is a 15-minute pre-panel triage procedure based on Condorcet logic, stripped of the math and tailored to your constraints.

  ### The 15-Minute Pre-Panel Triage Protocol

  **Who runs this:** You (Clinical Lead) or the Panel Chair.
  **When:** Immediately before the case list is finalized.
  **Goal:** Decide *how* to decide, not *what* to decide.

  #### Step 1: The Truth Test (2 Minutes)
  **Question:** Is there a fact of the matter that exists independently of our opinion, even if we can't see it yet?
  *   **Yes:** (e.g., Is there cancer in this tissue? Did the drug interact?) → **Proceed to Step 2.**
  *   **No:** (e.g., Is this risk *acceptable*? Should we prioritize comfort over length of life?) → **STOP.**
      *   **Action:** This is a values/policy call. Do not use a majority vote to launder responsibility. Assign a **Named Decision-Maker** (usually the on-call consultant or treating lead). The panel advises; the named person signs.
      *   **Flag:** *Values Question.* Procedure stops here.

  #### Step 2: The Competence Check (3 Minutes)
  **Question:** For this specific case type, is the average panel member more likely to be right than wrong ($p > 0.5$)?
  *   **Yes:** (e.g., General medicine escalation, standard imaging). → **Proceed to Step 3.**
  *   **No / Unknown:** (e.g., Rare pathology nobody has seen, new technology). → **STOP.**
      *   **Action:** Condorcet fails if competence is $\le 0.5$. Adding voters adds noise. Switch to **"Least Regret" Heuristic**. Ask: "Which option leaves us the most viable escape route if we are wrong?"
      *   **Flag:** *Data-Poor Stop.* We lack outcome data to verify competence.

  #### Step 3: The Independence Check (5 Minutes)
  **Question:** Are the voters seeing independent evidence, or the same corrupted signal?
  *   **High Independence:** (e.g., Different specialists reviewing different data streams). → **Full Panel (up to 9).**
  *   **Low Independence:** (e.g., 9 people looking at the same X-ray and reading the same registrar note). → **Cap Panel at 5.**
      *   **Action:** Extra heads beyond 5 yield diminishing returns due to correlated error. If you have 9 people, split them. 5 vote, 4 observe/learn.
      *   **Flag:** *Judgment Call.* You must estimate correlation based on shared information sources.

  #### Step 4: The Aggregation Method (5 Minutes)
  **Question:** Is the output a binary state (Yes/No) or a risk forecast (0–100%)?
  *   **Binary:** (e.g., Recall / Do Not Recall). → **Use Majority Vote.**
  *   **Forecast:** (e.g., Probability of deterioration). → **Use Average Probability.**
      *   **Constraint:** If you switch to averaging probabilities, you must acknowledge you have no calibration data.
      *   **Action:** If forecasting, ask each member for a % chance. Take the simple mean. Do not discuss numbers until after submission to avoid anchoring.
      *   **Flag:** *Data-Poor Limit.* Without calibration, a 60% average is not statistically "60%." It is a relative ranking of urgency.

  ---

  ### Protocol for the Meeting Itself
  To preserve the mathematical benefits of the theorem while allowing clinical nuance:

  1.  **Silent Review:** 5 minutes. No talking.
  2.  **Blind Vote:** Private submission (paper or app). No tally shown.
  3.  **Deliberation:** Discuss the split. Focus on *why* the minority voted differently (they often hold unique info).
  4.  **Final Vote:** Open show of hands.
      *   *Why:* The first vote captures independence (Condorcet). The discussion captures information pooling (Delphi). The final vote captures the group consensus for action.

  ---

  ### Weighting and Seniority
  **Rule:** One person, one vote.
  **Exception:** Only weight by seniority if you have historical audit data showing Senior X is more accurate than Junior Y *on this specific case type*.
  **Reality:** You don't have this data. Seniority correlates with confidence, not necessarily accuracy. Weighting introduces bias without proven gain.

  ---

  ### Application to Your Three Cases

  #### Case (a): Screening Mammogram Recall (5 readers, same images)
  *   **Truth Test:** Pass. (Cancer is present or not).
  *   **Competence:** Pass. (Radiologists are $>0.5$).
  *   **Independence:** **Fail.** They are looking at the exact same pixels. Errors will be highly correlated (e.g., dense breast tissue obscures the lesion for everyone).
  *   **Verdict:** The 5th reader buys almost nothing.
  *   **Unwelcome Truth:** You are wasting resources. If the images are static and identical, effective $N$ is likely 2 or 3. The 4th and 5th readers are just social proof.
  *   **Procedure:** Cap at 3 readers. If 2/3 say recall, recall. If 1/3, arbitrate.

  #### Case (b): Borderline Escalation (Ground truth never observed)
  *   **Truth Test:** **Fail.**
      *   If you escalate and they recover: Was it necessary? Unknown.
      *   If you don't and they crash: Was it predictable? Debatable.
      *   There is no "correct" answer to verify against. This is a risk tolerance decision, not a truth decision.
  *   **Verdict:** Condorcet does not apply. You cannot average opinions on a counterfactual.
  *   **Unwelcome Truth:** The panel is not finding truth; it is distributing liability.
  *   **Procedure:** **Step 1 Stop.** Named Decision-Maker (On-Call Consultant). The panel provides risk arguments, but the Consultant signs the order. Do not hide behind a majority vote for risk policy.

  #### Case (c): Rare Presentation (Seniors disagree, novices present)
  *   **Competence:** **Unknown / Fail.**
      *   Condorcet requires $p > 0.5$. If the two experts disagree, the average competence of the room on *this specific problem* is effectively unknown. It could be 0.5 (coin flip).
      *   If $p = 0.5$, adding more voters does not improve accuracy; it just solidifies a random walk.
  *   **Verdict:** Majority vote is meaningless noise.
  *   **Unwelcome Truth:** The vote is a confidence trick. You are pretending certainty where there is none.
  *   **Procedure:** **Step 2 Stop.** Switch to "Least Regret." Do not vote. Ask: "Which path allows us to correct course fastest if we are wrong?" (Usually: Escalate/Recall, but document the uncertainty explicitly).

  ### Summary of Flags

  | Step | Judgment Call or Data-Poor? | Why? |
  | :--- | :--- | :--- |
  | **Step 1 (Truth)** | **Judgment Call** | Distinguishing "fact" from "risk tolerance" is philosophical, not empirical. |
  | **Step 2 (Competence)** | **Data-Poor** | You lack feedback loops on negative outcomes (the "didn't crash" cohort). |
  | **Step 3 (Independence)** | **Judgment Call** | Estimating correlation of error is intuitive, not measured. |
  | **Probabilities** | **Data-Poor** | Without calibration, averaged probabilities are uncalibrated scores, not true risks. |

  ### Final Advice
  You suspected one case would give an answer you don't want. **It is Case (b).**
  Most escalation decisions are not truth-seeking; they are risk-management. Using Condorcet there gives you a false sense of mathematical security. If the ground truth is unobservable, the majority vote is just a consensus on anxiety levels, not clinical reality. Assign the risk to the person with the license to own it, use the panel to stress-test their reasoning, and stop voting on values.
