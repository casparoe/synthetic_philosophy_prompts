          *   Final verdict on "mixtures-last" rule.
          *   Output format: `\answer{...}` at the end.

  2.  **Analyze the "Mixtures-Last" Rule:**

      *   *User's current rule:* Clear strictly dominated pure actions first, *then* check for mixed dominance, repeat.
      *   *Theoretical reality:* Strict dominance (pure or mixed) is order-independent. If a strategy is strictly dominated by a mixture, it is strictly dominated. It doesn't matter if you check pure first or mixed first. However, computationally, checking pure is easier.
      *   *Pedagogical reality:* For TAs with limited training, separating the checks reduces cognitive load.
      *   *Risk:* Is it possible that eliminating a pure dominated strategy *prevents* finding a mixed dominated strategy? No, because strict dominance is order-independent. If $s_i$ is dominated by $\sigma_i$ in the original game, and $s_j$ is dominated by pure $s_k$, eliminating $s_j$ doesn't make $s_i$ undominated.
      *   *Wait, actually:* If $s_i$ is dominated by a mixture involving $s_j$, and $s_j$ is itself dominated, can we still eliminate $s_i$? Yes. The definition of rationalizability/IEDS allows domination by *any* mixture of *remaining* strategies. If $s_j$ is removed, can we still use it in the mixture? No.
      *   *Crucial Point:* If $s_i$ is dominated by a mixture of $\{s_j, s_k\}$, but $s_j$ is strictly dominated by $s_k$, does $s_i$ remain dominated after $s_j$ is removed?
          *   If $s_j$ is strictly dominated, it shouldn't be played. A mixture involving a strictly dominated strategy is itself strictly dominated by a mixture that shifts weight to the dominator. So, if $s_i$ is dominated by $\alpha s_j + (1-\alpha) s_k$, and $s_j$ is dominated by $s_k$, then $s_i$ is dominated by $s_k$ (pure).
          *   *Conclusion:* You don't *need* mixed dominance if you iterate pure dominance enough? No. There are cases where a strategy is *only* dominated by a mixture, not by any pure strategy (e.g., Rock-Paper-Scissors variants or specific payoff structures).
          *   *Refinement:* If a strategy is dominated by a mixture, it is dominated. If we eliminate pure dominated strategies first, do we lose the ability to detect mixed dominance?
          *   *Example:* $s_1$ dominated by $0.5 s_2 + 0.5 s_3$. $s_2$ and $s_3$ are not dominated. If we check pure first, nothing happens. Then we check mixed, $s_1$ goes.
          *   *Example:* $s_1$ dominated by $0.5 s_2 + 0.5 s_3$. $s_2$ dominated by pure $s_4$. If we remove $s_2$ first, can we still dominate $s_1$? The mixture $0.5 s_2 + 0.5 s_3$ is no longer available. But since $s_2$ is dominated by $s_4$, the mixture $0.5 s_4 + 0.5 s_3$ dominates $s_1$ even more. So $s_1$ is still dominated (potentially by a different mixture or pure).
          *   *Verdict:* The "Pure First, Then Mixed" heuristic is safe for *strict* dominance because strict dominance is order-independent. However, for *grading*, requiring students to find the *simplest* dominator (pure if possible) is good practice. The user's rule is defensible but needs precise wording to ensure TAs know *why*.

  3.  **Develop the Hand-Checkable Mixed Dominance Test:**

      *   *Constraint:* Max 3 actions per player.
      *   *Case 1: 2 Surviving Actions for Opponent.* (e.g., Row has A, B, C. Col has X, Y). To check if Row's A is mixed-dominated: We need $p \cdot u(B) + (1-p) \cdot u(C) > u(A)$ for all Col actions. Since there are only 2 Col actions, this is checking if the line segment between B and C lies strictly above A in payoff space.
      *   *Case 2: 3 Surviving Actions for Opponent.* (e.g., Row has A, B, C. Col has X, Y, Z). To check if Row's A is mixed-dominated by B and C: We need $p \cdot u(B) + (1-p) \cdot u(C) > u(A)$ for X, Y, and Z. This is a system of linear inequalities. With 3 constraints and 1 variable ($p$), it's solvable by checking intersections or min/max bounds.
      *   *Simplification for TAs:* Since max actions is 3, the mixture involves at most 2 other strategies (if 3 total). If there are 3 strategies $S_1, S_2, S_3$, checking if $S_1$ is dominated by a mix of $S_2, S_3$ requires finding $p \in (0,1)$ such that $p u(S_2) + (1-p) u(S_3) > u(S_1)$ component-wise.
      *   *Algorithm:*
          1.  Write payoffs for $S_1, S_2, S_3$ against each opponent action.
          2.  For each opponent action $k$, calculate the required $p$ range to beat $S_1$.
              *   Inequality: $p \cdot u_k(S_2) + (1-p) \cdot u_k(S_3) > u_k(S_1)$.
              *   Rearrange: $p(u_k(S_2) - u_k(S_3)) > u_k(S_1) - u_k(S_3)$.
              *   Solve for $p$ (watch out for sign flips if coefficient is negative).
          3.  Intersect all ranges. If intersection is non-empty and within $(0,1)$, it's dominated.
      *   *Limit:* If there are 4+ opponent actions, this becomes a Linear Programming problem (simplex method) which TAs can't do by hand easily. With max 3 actions *per player*, the opponent has max 3 actions. So this works.

  4.  **Stopping Rules & Conclusions:**

      *   *State 1: One profile left.* Unique IEDS solution. It is the unique NE. It is the unique Rationalizable profile.
      *   *State 2: >1 Profile left, nothing moves.* Set of Rationalizable strategies. NE must be within this set, but not every profile is necessarily an NE.
      *   *State 3: Nothing moves (but strategies remain).* Same as State 2.
      *   *Nuance:* IEDS (strict) preserves *all* Nash Equilibria. It does not guarantee finding one unless it reduces to a single point.

