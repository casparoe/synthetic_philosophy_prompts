      *   **Context:** 2nd-year Game Theory course, ~60 students, 4 TAs (1st-year undergrad training level). Hand-written exams, 20-25 mins/question. Max 3 actions/player. No solvers.
      *   **Goal:** A single written procedure for Iterated Elimination of Dominated Strategies (IEDS), specifically focusing on *mixed* dominance, stopping rules, marking weak dominance errors, and an elimination ledger/grading metric.
      *   **Specific Constraints:**
          *   Hand-checkable test for mixed dominance (2 and 3 actions).
          *   Honest account of limits beyond 3 actions.
          *   Stopping rules (1 profile, >1 profile, stuck).
          *   Marking scheme for weak vs. strict dominance errors.
          *   Elimination ledger (sequence, dominator, depth/mixed count).
