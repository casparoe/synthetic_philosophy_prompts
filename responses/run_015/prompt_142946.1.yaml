answer: |-
  \section*{Standard Operating Procedure: Iterated Elimination of Dominated Strategies (IEDS)}

  \textbf{Scope:} Two-player, finite games. Max 3 actions per player. Strict dominance only (unless noted for grading).
  \textbf{Audience:} TAs and Students.
  \textbf{Goal:} Consistency in solution paths and grading.

  \subsection*{1. The Elimination Ledger [Convention]}
  Every student solution must include a table. TAs grade the table first; if the table is wrong, the narrative explanation is secondary.

  \begin{center}
  \begin{tabular}{|c|c|c|c|c|}
  \hline
  \textbf{Round} & \textbf{Player} & \textbf{Action Deleted} & \textbf{Dominator (Pure or Mix)} & \textbf{Type (S/W)} \\
  \hline
  1 & Row & C & $0.5A + 0.5B$ & Strict \\
  \hline
  2 & Col & Z & $0.5X + 0.5Y$ & Strict \\
  \hline
  ... & ... & ... & ... & ... \\
  \hline
  \end{tabular}
  \end{center}

  \textbf{Grading Metric [Rule of Thumb]:} Do \textit{not} grade based on "Depth" (number of rounds). Students may eliminate independent strategies in one round or separate rounds; both are valid.
  \textbf{Correct Measure:} Count \textit{Correct Elimination Steps}.
  \begin{itemize}
      \item +1 point per correctly identified dominated action.
      \item +1 point per valid dominator exhibited (probabilities sum to 1, inequality holds).
      \item -2 points (cap at 0 for section) if \textbf{Weak} dominance is used where \textbf{Strict} is required.
      \item Follow-through credit allowed if logic is consistent after an early error, but max 50\% of solution points.
  \end{itemize}

  \subsection*{2. The Algorithm [Convention]}
  \textit{Note: This order is for computational efficiency, not theoretical necessity. Strict dominance is order-independent.}

  \begin{enumerate}
      \item \textbf{Pure Sweep:} Check all surviving actions for strict dominance by any single \textit{other} surviving action. Eliminate all found.
      \item \textbf{Mixed Sweep:} If no pure moves exist, check surviving actions for strict dominance by a \textit{mixture} of two other surviving actions. Eliminate all found.
      \item \textbf{Repeat:} Return to Step 1 with the reduced game.
      \item \textbf{Stop:} When no actions can be eliminated by Pure or Mixed strict dominance.
  \end{enumerate}

  \subsection*{3. Hand-Checkable Mixed Dominance Test [Rule of Thumb]}
  \textit{Scope: Valid for 2-player games where the opponent has $\le 3$ actions. Breaks for 4+ opponent actions (requires Linear Programming).}

  To check if Action $S_1$ is strictly dominated by a mixture of $S_2$ and $S_3$:
  \begin{enumerate}
      \item Write the payoff vector for $S_1, S_2, S_3$ against each of the opponent's surviving actions ($k=1, \dots, m$).
      \item Set up the inequality for a mixture probability $p \in (0,1)$ on $S_2$ (and $1-p$ on $S_3$):
      $$ p \cdot u(S_2, k) + (1-p) \cdot u(S_3, k) > u(S_1, k) $$
      \item Solve for $p$ for \textit{each} opponent action $k$. This yields a range (e.g., $p > 0.4$ or $p < 0.8$).
      \item \textbf{Intersection Test:} If the intersection of all ranges is non-empty and lies within $(0,1)$, $S_1$ is dominated. Any $p$ in the intersection is a valid witness.
  \end{enumerate}

  \textbf{Example Calculation:}
  Opponent has actions $L, R$. You check if $M$ is dominated by mix of $T, B$.
  \begin{itemize}
      \item Vs $L$: $u(T)=4, u(B)=0, u(M)=1$. Ineq: $4p + 0(1-p) > 1 \Rightarrow 4p > 1 \Rightarrow p > 0.25$.
      \item Vs $R$: $u(T)=0, u(B)=4, u(M)=1$. Ineq: $0p + 4(1-p) > 1 \Rightarrow 4 - 4p > 1 \Rightarrow 3 > 4p \Rightarrow p < 0.75$.
      \item Intersection: $0.25 < p < 0.75$. Valid. $M$ is eliminated.
  \end{itemize}

  \subsection*{4. Stopping Rules and Conclusions [Theorem]}
  \textit{Scope: Finite games.}

  \begin{enumerate}
      \item \textbf{Single Profile Survives:}
      \begin{itemize}
          \item \textbf{Conclusion:} Unique Nash Equilibrium (NE). Unique Rationalizable Profile.
          \item \textbf{Grading:} Full credit for solution.
      \end{itemize}
      \item \textbf{Multiple Profiles Survive (No moves possible):}
      \begin{itemize}
          \item \textbf{Conclusion:} The set of Rationalizable Strategies. Any NE must be within this set, but not every profile is an NE.
          \item \textbf{Grading:} Full credit if student identifies set correctly and does not claim uniqueness.
      \end{itemize}
      \item \textbf{Nothing Moves (but student claims more should):}
      \begin{itemize}
          \item \textbf{Conclusion:} Student error in dominance check.
          \item \textbf{Grading:} Deduct for incorrect elimination.
      \end{itemize}
  \end{enumerate}

  \subsection*{5. Marking Weak Dominance Errors [Convention]}
  \textit{Warning: Weak dominance is order-dependent and can eliminate Nash Equilibria.}

  \begin{itemize}
      \item \textbf{If Question asks for IEDS (Strict):} Using weak dominance is a conceptual error.
      \item \textbf{Detection:} Check the Ledger column "Type". If "Weak" is written, or if the inequality is $\ge$ instead of $>$, flag it.
      \item \textbf{Penalty:} The step is invalid. Assign 0 points for that elimination step.
      \item \textbf{Cap:} If the final solution relies on a weak-dominance step to reach a unique profile (when strict dominance would stall), cap the problem score at 50\%.
      \item \textbf{Exception:} If the question explicitly asks for "Iterated Elimination of Weakly Dominated Strategies," reverse this rule.
  \end{itemize}

  \subsection*{6. Procedure Run-Throughs}

  \subsubsection*{Game 1 Analysis}
  \textbf{Setup:} Row \{A, B, C\}, Col \{X, Y\}.
  \textbf{Payoffs (Row):} A=(0,6), B=(6,0), C=(2,2).
  \textbf{Payoffs (Col):} X=(1,0,2), Y=(0,1,2) [vs A,B,C].

  \begin{enumerate}
      \item \textbf{Pure Sweep:}
      \begin{itemize}
          \item Row: A vs B? No. A vs C? No. B vs C? No.
          \item Col: X vs Y? No.
      \end{itemize}
      \item \textbf{Mixed Sweep (Row):} Check C vs Mix(A, B).
      \begin{itemize}
          \item Vs X: $p(0) + (1-p)(6) > 2 \Rightarrow 6 - 6p > 2 \Rightarrow 4 > 6p \Rightarrow p < 2/3$.
          \item Vs Y: $p(6) + (1-p)(0) > 2 \Rightarrow 6p > 2 \Rightarrow p > 1/3$.
          \item Intersection: $1/3 < p < 2/3$. Valid (e.g., $p=0.5$).
          \item \textbf{Action:} Delete C. Ledger: Row, C, $0.5A+0.5B$, Strict.
      \end{itemize}
      \item \textbf{Repeat Pure Sweep:}
      \begin{itemize}
          \item Row: A(0,6) vs B(6,0). No dominance.
          \item Col: X(1,0) vs Y(0,1) [Given Row A,B]. No dominance.
      \end{itemize}
      \item \textbf{Repeat Mixed Sweep:}
      \begin{itemize}
          \item Row: Only 2 actions left. Cannot mix.
          \item Col: Only 2 actions left. Cannot mix.
      \end{itemize}
      \item \textbf{Stop.}
  \end{enumerate}
  \textbf{Verdict:} Stalls at \{A,B\} $\times$ \{X,Y\}. Rationalizable set is 4 profiles. NE are (A,Y) and (B,X).
  \textbf{User Expectation Check:} "Mixed step to delete C and then for everything to stall." \textbf{Correct.}

  \subsubsection*{Game 2 Analysis}
  \textbf{Setup:} Row \{A, B, C\}, Col \{X, Y, Z\}.
  \textbf{Row Payoffs:} A=(2,2,2), B=(0,0,5), C=(1,1,1).
  \textbf{Col Payoffs (vs A,B,C):} X=(4,0,0), Y=(0,4,0), Z=(1,1,2).

  \begin{enumerate}
      \item \textbf{Pure Sweep:}
      \begin{itemize}
          \item Row: A(2,2,2) vs C(1,1,1). $2>1$ in all columns. \textbf{Delete C.}
          \item Col: No pure dominance yet.
      \end{itemize}
      \item \textbf{Mixed Sweep (Col):} Check Z vs Mix(X, Y). [Given Row A,B]
      \begin{itemize}
          \item Vs A: $p(4) + (1-p)(0) > 1 \Rightarrow 4p > 1 \Rightarrow p > 0.25$.
          \item Vs B: $p(0) + (1-p)(4) > 1 \Rightarrow 4 - 4p > 1 \Rightarrow p < 0.75$.
          \item Intersection: $0.25 < p < 0.75$. Valid. \textbf{Delete Z.}
      \end{itemize}
      \item \textbf{Repeat Pure Sweep:}
      \begin{itemize}
          \item Row: A(2,2) vs B(0,0) [Given Col X,Y]. $2>0$. \textbf{Delete B.}
          \item Col: X(4) vs Y(0) [Given Row A]. $4>0$. \textbf{Delete Y.}
      \end{itemize}
      \item \textbf{Stop.} Profile (A, X) remains.
  \end{enumerate}
  \textbf{Verdict:} Unique NE (A,X).
  \textbf{User Expectation Check:} "Delete C... unlock mixed domination of Z... collapse to single profile." \textbf{Correct.}

  \subsubsection*{Game 3 (Weak Dominance Trap)}
  \textbf{Setup:} 2$\times$2. Row \{T, B\}, Col \{L, R\}.
  \textbf{Payoffs (Row, Col):} (T,L)=(2,2); (T,R)=(0,0); (B,L)=(2,0); (B,R)=(1,1).
  \textbf{Question:} Solve by IEDS (Strict).

  \begin{enumerate}
      \item \textbf{Student Error Path (Weak):}
      \begin{itemize}
          \item Row compares T(2,0) vs B(2,1). B $\ge$ T (2=2, 1>0). Student claims B \textit{strictly} dominates T (Error) or uses Weak rule.
          \item Deletes T.
          \item Col faces B: L(0) vs R(1). R dominates L. Deletes L.
          \item Result: (B, R).
      \end{itemize}
      \item \textbf{Correct Path (Strict):}
      \begin{itemize}
          \item Row: T vs B. Not strict (2=2 at L).
          \item Col: L vs R. Not strict.
          \item Mixed: 2 actions each, no mix possible.
          \item Stop. Set: \{T,B\} $\times$ \{L,R\}.
      \end{itemize}
  \end{enumerate}
  \textbf{Grading:} Student lost the NE (T,L).
  \textbf{Penalty:} 0 points for the elimination of T. Cap total score at 50\% because the solution method fundamentally violated the preservation of NE required by strict IEDS.

  \subsection*{7. Critique of Measures and Rules}

  \textbf{Is "Mixtures-Last" Indefensible?}
  \textbf{No.} [Theorem] Strict dominance is order-independent. If a strategy is dominated by a mixture, it remains dominated after removing other strictly dominated strategies (provided the dominator strategies remain). Checking pure first is a [Rule of Thumb] for efficiency, as pure checks are algebraically simpler. It does not alter the final set of rationalizable strategies.

  \textbf{Is "Depth Counting" a Bad Measure?}
  \textbf{Yes.} [Rule of Thumb] Depth depends on whether a student eliminates independent strategies simultaneously or sequentially. It penalizes efficient writers. Use "Number of Correct Eliminations" instead.

  \textbf{Limits of the Mixed Test:}
  [Theorem] The hand-checkable inequality intersection method works only when mixing 2 strategies against $\le 3$ opponent actions. If the opponent has 4+ actions, the system of inequalities may have no solution visible by simple intersection logic without Linear Programming. Given your course constraint (max 3 actions/player), this procedure is safe.

  \answer{The mixtures-last rule is pedagogically sound and theoretically safe for strict dominance, provided TAs understand it is an efficiency convention, not a theoretical requirement.}
