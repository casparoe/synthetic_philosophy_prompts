  ### Part 3: The Leaves

  **Leaf 1: Eliminativism**
  *   **View:** Consciousness does not exist; only behavior exists.
  *   **Awkward Commitment:** You must deny the very data (your own pain) used to start the debate.
  *   **Smartphone:** No experience, because nothing has experience.

  **Leaf 2: Emergent Physicalism**
  *   **View:** Experience arises only when physical complexity crosses a specific threshold.
  *   **Awkward Commitment:** You must accept "brute emergence," where something comes from nothing with no explanation.
  *   **Smartphone:** Yes, if its software is complex enough to mimic a brain.

  **Leaf 3: Threshold Realism**
  *   **View:** There is a precise, discoverable point where experience turns on or off.
  *   **Awkward Commitment:** You must believe removing one atom can turn a soul on or off.
  *   **Smartphone:** No, unless it crosses the exact biological threshold.

  **Leaf 4: Fade Nihilism**
  *   **View:** There is no objective fact about whether a fading brain is conscious.
  *   **Awkward Commitment:** Reality is vague; some truths are neither true nor false.
