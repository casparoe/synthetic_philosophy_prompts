  ### Part 1: The Logical Space (The Grid)

  Before walking the tree, we must map the territory. The debate sorts itself by three binary questions. These are the "key sorting questions" that determine the shape of the view.

  1.  **The Micro Question:** Do the fundamental constituents of reality (e.g., electrons) possess some form of experience or proto-experience?
  2.  **The Combination Question:** Do these micro-experiences sum together to constitute macro-experiences (like yours)?
  3.  **The Unity Question:** Is the "single subject" of experience (the "I") a real, unified entity, or is it a useful fiction?

  **The Grid of Combinations:**

  | Micro Experience? | Combine to Macro? | Unity Real? | View Occupying Cell | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **No** | N/A | **Yes** | **Emergentism / Physicalism** | **Occupied.** Experience arises only at high complexity. |
  | **No** | N/A | **No** | **Illusionism / Eliminativism** | **Occupied.** Experience or Unity is a cognitive error. |
  | **Yes** | **Yes** | **Yes** | **Constitutive Panpsychism** | **Occupied.** Micro-experiences build macro-experiences. |
  | **Yes** | **No** | **Yes** | **Cosmopsychism** | **Occupied.** The Whole is fundamental; parts are derivatives. |
  | **Yes** | **No** | **No** | **Panpsychist Illusionism** | **Occupied.** Micro-experiences exist, but "I" am a swarm. |
  | **Yes** | **Yes** | **No** | *(Empty)* | **Incoherent.** If they combine to make a macro-subject, unity is real by definition. |
  | **No** | **Yes** | **Yes/N/A** | *(Empty)* | **Incoherent.** If micro-entities have no experience, there is nothing to combine. |
  | **Yes** | **Maybe** | **Maybe** | **Panprotopsychism** | **Occupied.** Micro-entities have *potential* for experience, not actual experience. |

  ***

  ### Part 2: The Flowchart

  **Instructions for the Moderator:** Read the node question aloud. Ask for a show of hands for each option. Move the group down the corresponding branch. If the group splits, follow the majority path first, then backtrack.

  **Node 1 (Entry): The Substitute**
  *Case:* We replace your neurons one by one with functionally identical silicon chips.
  *   **A:** Experience stays fully intact throughout. (Go to Node 2)
  *   **B:** Experience vanishes immediately or degrades. (Go to Node 3)
  *   **C:** There is no fact of the matter; "experience" is just a word we use. (**Leaf 1: Eliminativism**)

  **Node 2: The Electron**
  *Claim:* If experience survived the substitution, it must depend on structure, not biology. But does an *individual* electron have an inner life?
  *   **A:** Yes, everything has an inner nature. (Go to Node 4)
  *   **B:** No, only complex systems have experience. (**Leaf 2: Standard Physicalism**)
  *   **C:** Electrons have *proto*-experience (potential), not full experience. (Go to Node 5)

  **Node 3: The Fade**
  *Case:* A brain's connectivity degrades 1% per day. At what point does experience stop?
  *   **A:** There is a sharp cutoff; one day it's on, the next it's off. (Go to Node 6)
  *   **B:** It fades gradually; there is no sharp line. (Go to Node 7)
  *   **C:** It never stops as long as there is some activity. (**Leaf 3: Biological Chauvinism**)

  **Node 4: The Chorus**
  *Case:* A million tiny experiential systems talk in a chain, but nothing integrates them. Is there a "group mind"?
  *   **A:** Yes, the chain creates a new, single subject. (Go to Node 8)
  *   **B:** No, there are a million subjects, not one. (Go to Node 9)
  *   **C:** The question is meaningless without a "Bonding Lens." (Go to Node 10)

  **Node 5: The Three-Second Duplicate**
  *Case:* A copy of you runs for three seconds. Did it have a unified experience in that time?
  *   **A:** Yes, even short bursts have unity. (Go to Node 11)
  *   **B:** No, unity requires temporal continuity over time. (**Leaf 4: Temporal Atomism**)
  *   **C:** It had experience, but it wasn't "unified" like mine. (Go to Node 12)

  **Node 6: The Merge**
  *Case:* Two cortices are cross-wired over six months. How many subjects are there at the end?
  *   **A:** One subject merges from two. (Go to Node 13)
  *   **B:** Two subjects remain trapped in one head. (**Leaf 5: Merge Pluralism**)
  *   **C:** The original subjects die; a new third one is born. (**Leaf 6: Emergentism**)

  **Node 7: The Bonding Lens**
  *Case:* I stipulate a device that fuses experiences without changing physics. Is this possible?
  *   **A:** Yes, combination is metaphysical, not just physical. (Go to Node 14)
  *   **B:** No, physical structure fixes experience count. (**Leaf 7: Structuralism**)
  *   **C:** If it's possible, subject count is arbitrary. (**Leaf 8: Lens Conventionalism**)

  **Node 8: The Combination Mechanism**
  *Claim:* If the Chorus makes one mind, how?
  *   **A:** It's a brute fact; wholes just exist. (**Leaf 9: Priority Monism**)
