      *   *Weaknesses:* Biology deals with reproduction and genetic inheritance (a concrete mechanism). History deals with ideas, institutions, and material conditions (multiple, overlapping mechanisms). Biological species exist simultaneously in many cases; historical periods are diachronic by definition. Cladistics aims for a *true* phylogeny; history might not have a single "phylogeny" but rather overlapping causal networks.
      *   *Verdict:* It's a provocative and useful heuristic, but it breaks down if pushed too hard. It assumes history has a single lineage tree, which is contentious.

  3.  **Diagnose the Debate (The "Stall"):**
      *   Why is it stalled? It's not just evidence. It's not just verbal.
      *   *Hypothesis 1: Ontological Mismatch.* Historians are often methodological nominalists (periods are tools), while philosophers/some historians seek ontological realism (periods are things).
      *   *Hypothesis 2: Causal Density.* In biology, speciation events can be sharp (sometimes). In history, change is distributed across domains (art, tech, politics, religion) that desynchronize. The "Scientific Revolution" might be real for astronomy but nonsense for agriculture.
      *   *Hypothesis 3: Normative Loading.* "Renaissance" implies rebirth/improvement. "Middle Ages" implies a gap. These aren't neutral descriptors; they are evaluative judgments. This makes them resistant to purely empirical falsification.

  4.  **Formulate the Diagnosis:**
      *   The disagreement isn't about *facts* (everyone agrees Copernicus happened, everyone agrees Gothic cathedrals were built).
      *   It's about *causal granularity* and *explanatory utility*.
      *   It's also about *normativity*.
      *   The "Natural Kind" expectation is the trap. History doesn't have natural kinds in the chemical sense. It has *process kinds*.

  5.  **Address the "What Would Move It?" Question:**
