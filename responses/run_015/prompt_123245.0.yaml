      *   **Core Question:** Are historical periods (Middle Ages, Renaissance, Scientific Revolution) real causal chunks or artificial labels? Is the debate stalled because of evidence, verbal definitions, or talking past each other?
      *   **Specific Analogy:** Compares historical periodization to biological taxonomy (specifically the "Reptilia" paraphyly issue).
      *   **Demand:** Push back hard if premises are confused. Flag contested historiography. Provide a diagnosis of the disagreement and a path forward (or declare it ill-posed).

