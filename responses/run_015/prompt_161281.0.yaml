      *   **Jonas 1:** No, the view has no content if availability suffices (that's just capacity view in disguise). Personhood requires *actual* mutual recognition and roles. He opted out.
      *   **Amara 2:** Your view makes personhood hostage to others (racist community can un-person). Need normative correction: being someone who *can and should* be recognized.
      *   **Jonas 2:** Normative correction empties the view (relational facts do no work). Inverts the slogan (secure the less recognition). Achievement reading implies torturer = paradigm person, exile = bare organism. This ordering is morally repugnant.
      *   **Amara 3:** Distinction: Personhood as *moral status* (never lost) vs. Personhood as *thick, achieved excellence* (lacks this). Conflation causes the problem.
      *   **Jonas 3:** That's a retreat. Concedes the view isn't about *who counts* (ontology/status), only *flourishing* (ethics/ideal).

  4.  **Evaluate the Moves (Philosophical Scrutiny):**

      *   *Theoretical Background:* Ubuntu ("I am because we are") and Relational theories often struggle with the "isolation problem." If personhood is constituted by relations, does isolation destroy it? Most contemporary defenders (e.g., Metz, Gyekye) try to avoid the conclusion that isolation makes one non-human/non-person because that violates basic human rights intuitions. They usually distinguish between *basic* moral status and *full* personhood (achievement).

      *   **Amara 1:**
