  I commit to the third diagnosis. You should reject the claim that stating classical physics forces ontological commitment to actual infinities. This step looked sound because of the Quine-Putnam indispensability argument: if our best theories quantify over entities, we should believe they exist. It feels natural to say that using real numbers in electrodynamics commits you to their existence. However, accepting this costs you scientific realism about spacetime points. You must view the continuum as a useful idealization, much like frictionless planes or perfect fluids, rather than a fundamental feature of reality.

  Why do the others lose? Rejecting Step (1) ignores the structural insight that infinity behaves differently than finite quantities regardless of material composition; the math works even if the physics doesn't. Rejecting Step (4) saves arithmetic finitism but fails to protect your physical intuition; even if numbers are potential, a realist reading of general relativity still commits you to actual infinite points, forcing you to abandon the impossibility of the Hotel in spacetime. Furthermore, rejecting Step (3) requires a complex philosophical separation between arithmetic and physical instantiation that may not hold under scrutiny.

  Consequently, you must weaken your commitment to the literal truth of field equations over a continuum. You can keep the intuition that Hilbert's Hotel is physically impossible and maintain that numbers are potentially infinite, but only by adopting an instrumentalist stance toward classical field theory. You may write down the equations, but you cannot claim they describe the actual ontology of the universe. This is the cheapest surrender: it preserves your core metaphysical intuitions while acknowledging that our best physical models are approximations, likely to be superseded by a discrete theory of quantum gravity. The argument is sound only if one assumes realism about classical physics; deny that realism, and the moderate position stabilizes. You save your finitism by admitting that your field equations are maps, not territories. This allows you to remain a finitist at heart while utilizing the infinite tools of calculus as mere computational devices, avoiding the contradiction of believing in a physical reality that your own metaphysics deems impossible.
