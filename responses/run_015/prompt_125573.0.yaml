answer: |-
  You have not dug yourself into a hole; you have stumbled directly into the central debate of the last twenty years of philosophy of action. What you are describing is known as the **Generalization Objection** to anti-intellectualism. It is a very strong objection, and the fact that you spotted it on your own is a good sign for your paper.

  You are worried that your argument proves too much. If your "Grip Condition" (1) kills Intellectualism about knowledge-how, it seems to kill propositionalism about knowledge-where, knowledge-who, and so on. Since you (rightly) want to keep standard semantics for *wh*-clauses (7), you feel trapped.

  Here is the diagnosis: **Step (5) is the rotten one.**

  Your argument is valid, but it is not sound because the analogy between *knowing-how* and *knowing-where* breaks down at the Grip Condition. Below, I will explain why (5) looked plausible, why it fails, what the costs are, and how to handle the Intellectualist replies (like the Practical Mode of Presentation) so you can finish this paper by Thursday.

  ### 1. Why Step (5) Looked Fine
  Step (5) relies on a linguistic intuition: "knows how" and "knows where" look like the same grammatical animal. They are both *wh*-clauses. In semantics, it is standard to treat *wh*-clauses as denoting propositions (the true answers to embedded questions).
  *   "Where the station is" = The proposition *that the station is at location L*.
  *   "How to ride" = The proposition *that w is a way to ride*.

  Because the grammar is uniform, it is tempting to think the metaphysics must be uniform too. If "knowing how" requires a grip (ability), surely "knowing where" requires a grip (navigational ability)? This is the engine of your generalization worry.

  ### 2. Why Step (5) Is False
  You must argue that the Grip Condition applies to *knowledge-how* but not to *knowledge-where*. This is the standard anti-intellectualist move (defended by philosophers like Stephen Hetherington or Jason Stanley's critics).

  **The Paralysis Test:**
  *   **Case A (Bike):** If I am paralyzed from the neck down, do I know how to ride a bike?
      *   *Anti-Intellectualist (You):* No. I might know *about* biking, but I don't know *how*. The ability is constitutive.
  *   **Case B (Station):** If I am paralyzed from the neck down, do I know where the station is?
      *   *Intuition:* Yes. If I can tell you the address, point to it on a map (with my eyes), or give you GPS coordinates, I know where it is. My inability to *travel* there does not negate my possession of the locational fact.

  **The Distinction:**
  Knowledge-where is **factual/locational**. It is satisfied by possessing the correct information about the world.
  Knowledge-how is **practical/capacitative**. It is satisfied by possessing a capacity to intervene in the world.

  To save your paper, you need to explicitly argue that *wh*-clauses are not semantically uniform in their metaphysical requirements, even if they look uniform syntactically. "How" picks out a method of action; "Where" picks out a location. Actions require agents with abilities; locations do not.

  **The Cost:**
  The cost of denying (5) is that you owe an explanation for why the language looks the same if the knowledge is so different.
  *   *Your reply:* Language is often misleading. We say "I see" for visual perception and "I see" for intellectual understanding, but these are different states. Similarly, "knows how" and "knows where" might be a case of systematic ambiguity.
  *   *Intellectualist reply:* They will say you are violating parsimony. Why posit two kinds of knowledge when one (propositional) will do?
  *   *Your counter:* Parsimony is bad if it gets the phenomenology wrong. The dancer/choreographer case (your Step 4) shows the states *feel* and *function* differently.

  ### 3. The Intellectualist Reply: Practical Mode of Presentation
  You mentioned you dislike the "Practical Mode of Presentation" (PMOP) reply, associated with Jason Stanley and Timothy Williamson. You called it "relocating the mystery." For your paper, you need to engage with this more charitably, even if you ultimately reject it.

  **The View:**
  Stanley and Williamson accept that the paralyzed person knows the proposition *that w is a way to ride*. However, they argue that knowledge-how requires grasping that proposition under a **practical mode of presentation**.
  *   **Theoretical grasp:** Understanding the physics of balance (available to the paralyzed theorist).
  *   **Practical grasp:** Understanding the physics of balance *as a guide to one's own action* (available only to the rider).

  **Why it's not just mystery-relocation:**
  They argue this is a claim about cognitive architecture, not magic. It suggests that the brain represents the same content in different neural formats (e.g., declarative memory vs. procedural memory).
  *   **Concession:** They admit the paralyzed theorist lacks something crucial (the practical guise).
  *   **Digging in:** They insist that what the theorist lacks is not a *different kind of knowledge* (non-propositional), but a different *way of knowing* the same proposition.

  **How to critique it:**
  Your "Instruction Test" (4) is the perfect weapon here.
  *   *Argument:* If I give you the complete proposition and you still can't ride, then the proposition + practical guise still doesn't equal ability. If the "practical guise" just *is* the ability, then you have admitted that ability is a condition of the knowledge. If ability is a condition, you are closer to my view than you admit.
  *   *Refinement:* Argue that PMOP is an ad hoc fix to save the propositional view from counterexamples. It posits a mysterious "guise" solely to explain away the paralysis case.

  ### 4. What About Step (1)?
  You said you would rather keep (1) and (7) than your conclusion (3).
  *   (1) Know-how $\rightarrow$ Ability.
  *   (7) Know-wh is Propositional.
  *   (3) Know-how $\neq$ Know-that (Anti-Intellectualism).

  If you keep (1) and (7), you are logically forced to reject (3). This means accepting **Intellectualism**.
  *   *View:* Knowing how *is* knowing that, but knowing that (in this specific case) requires ability.
  *   *Problem:* This contradicts Step (2) (Propositional knowledge never has an ability condition).
  *   *Result:* You end up with "Moderate Intellectualism" (defended by Berit Brogaard). This view says: "Yes, know-how is propositional, but unlike knowing *that Paris is in France*, knowing *how to ride* has an ability condition built into the truth conditions."

  **Recommendation:**
  For an MA module on the **philosophy of action**, it is usually more rewarding to defend **Anti-Intellectualism** (keeping 3) than Moderate Intellectualism. Moderate Intellectualism often looks like a semantic compromise that satisfies no one.
