answer: |-
  **To:** Safety Release Board
  **From:** [Your Name]
  **Date:** Wednesday
  **Subject:** Decision on Gap Estimator Adoption

  **Recommendation**
  We will **pilot the Gap Estimator for triage only** for the next four releases. We will **not** use it to gate releases or waive safety properties. We will revisit this decision after Release 14. Success is measured by a reduction in engineer-hours spent on undecided properties without an increase in runtime monitor triggers.

  **What We Are Buying**
  We need to be plain about what these numbers represent. They are **not** probabilities that a claim is true. Math is binary: a property follows from the spec or it doesn't. The score is an **expected frequency of provability**: "If we spent engineer time on this, how likely are we to find a proof?"

  Because these are not probabilities of truth, we cannot do expected-value math across linked claims. We cannot multiply scores. As seen in testing, the tool scored property P (0.96) and Q (0.94) highly, but their conjunction P-and-Q low (0.31). If we treated these as probabilities, this would be impossible. Since we cannot guarantee logical consistency between scores, we cannot use them for binary safety gates where consistency is required.

  **Triage vs. Release Gate**
  We must treat these use cases differently.
  *   **Triage (Adopted):** Using scores to decide which property engineers investigate first is low-risk. If the score is wrong, we simply fix a different bug first. The human verification step remains intact. This addresses the efficiency concern without compromising the safety case.
  *   **Release Gate (Rejected):** Waiving a property based on a score replaces human verification with a statistical guess. The incoherence issue (P vs. P-and-Q) means we could waive conflicting safety claims. The QA betting demo showed that these inconsistencies create exploitable gaps where we lose confidence regardless of the outcome. For autonomous forklifts, logical consistency trumps statistical calibration.

  **The Theory Question**
  Our theory-minded engineer is correct that computable systems cannot be perfectly consistent and complete simultaneously. However, this trade-off matters for infinite time horizons. We care about the next four releases, not asymptotic convergence. We need consistency *now*. Therefore, we cannot accept a tool that promises truth "eventually" but contradicts itself today. Regarding self-referential inputs (e.g., scoring its own output): we will hard-ban these. It adds no value and introduces unnecessary instability.

  **Metrics for the Pilot**
  1.  **Efficiency:** Track engineer hours spent on the 35-45 undecided properties. Target: Reduce from 2 weeks to 1 week.
  2.  **Safety:** Track runtime monitor triggers on properties that were scored high but later found to require guards. Target: Zero increase over baseline.
  3.  **Coherence:** Log scores for linked properties. Target: Identify frequency of contradictions (like the P-and-Q case) to inform future vendor discussions.

  **For the Pro-Adoption Camp**
  I know many of you view the calibration data as sufficient evidence of reliability. You are right that calibration on held-out data is the gold standard for predictive tools, and ignoring this efficiency gain feels like leaving safety on the table. The vendor's benchmark performance is impressive, and refusing to use calibrated data feels like rejecting modern engineering practice. This pilot validates that the data is useful for resource allocation, even if we aren't ready to let it sign off on safety cases yet. We are not rejecting the tool; we are restricting its authority until the logical coherence matches its calibration.
