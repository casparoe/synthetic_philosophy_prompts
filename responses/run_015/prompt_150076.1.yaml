  The main proposition relies on claims 2, 3, and 6 being true (the physics of the sink and the coupling). Claims 1 and 5 clarify the interpretation but do not invalidate the physics if their credences are low (e.g., if the distinction is *not* determinate, the proposition's claim that "erasure is just one way" is strengthened).
