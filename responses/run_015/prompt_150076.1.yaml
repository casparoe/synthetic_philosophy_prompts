  *   **Credence:** 0.95 (High confidence)
  *   **Reason:** Work extraction requires a decrease in gas entropy compensated by an increase in memory entropy; the memory medium is the necessary entropy sink.

  **3. Measurement reversibility (given known state)**
  *   **Credence:** 0.95 (High confidence)
  *   **Reason:** Ideal pre-measurement correlation is a unitary CNOT-like operation; dissipation only arises from irreversibility (amplification/reset), not the coupling itself.

  **4. $kT \ln 2$ bound generality**
  *   **Credence:** 0.90 (High confidence)
  *   **Reason:** This is a specific case of the Second Law applied to state space compression; it holds generally for logical irreversibility, not just specific erasure hardware.

  **5. Feedback-thermodynamics bound (new constraint vs restatement)**
  *   **Credence:** 0.85 (Moderate-High confidence)
  *   **Reason:** It restates the Second Law using mutual information ($W \le kT I$) rather than adding new physics, but usefully quantifies the "information fuel."

  **6. "Information is physical" (real vs accounting)**
  *   **Credence:** 0.90 (High confidence)
  *   **Reason:** Information states constrain accessible phase space volume; manipulating them imposes genuine work constraints, not just bookkeeping rules.

