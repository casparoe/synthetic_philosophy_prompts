      *Decision:* Stick to the prompt's suggested blind spots. The difference between structural integration (physical) and phenomenal binding (experience) is the key. Mara assumes they map 1:1. Leo assumes they can't map without discrete subjects. The blind spot is that **we have no reason to assume they map 1:1.**

