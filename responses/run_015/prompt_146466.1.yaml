          *   **Leo:** Critic of Panpsychism (likely a physicalist or dualist, but focused on the logic of subjectivity). Argues that even if experience is intrinsic, the jump from micro-subjects to one macro-subject ("me") is unexplained. Split-brain cases show unity is fragile/specific, not just a default field property. Claims Mara dissolves the problem without explaining *why* there is exactly one point of view.
      *   **Core Conflict:** The Combination Problem (specifically the Subject Summing Problem).
      *   **Key Questions:** Who is right? Is Mara correct about the ontology? Is Leo correct about phenomenal unity? What is the blind spot?

  2.  **Analyze Mara's Position (Russellian Monism/Field Panpsychism):**

      *   *Claim:* Combination is a category mistake. Consciousness isn't Lego bricks; it's a field property.
