  3.  **Analyze Leo's Position (The Hard Line on Subjectivity):**

      *   *Claim:* Micro-subjects exist (per panpsychism). Macro-subject (Me) exists. How do we get from Many to One?
      *   *Argument:* Dissolving the combination problem (saying it's a mistake) doesn't explain the *fact* of unity.
      *   *Split-Brain Point:* Unity is contingent, not necessary. If consciousness were just a fundamental field, why does cutting a wire split the field?
      *   *Strengths:* Hits the core intuition pump of the combination problem. Demands an account of *numerical identity* of subjects.
      *   *Weaknesses:* Might be reifying "subjects" too much (which Mara accuses him of). Assumes physicalism has a better answer (it arguably doesn't, but that's a tu quoque).

  4.  **Evaluate "Who is Right?":**

