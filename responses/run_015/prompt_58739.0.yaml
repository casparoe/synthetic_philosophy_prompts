answer: |-
  You are not running together distinct mechanisms; you have identified a specific, well-documented pathology in organizational sociology and the philosophy of measurement. However, there is no single, universally standardized "law" name for it in the way "Goodhart's Law" is recognized. Instead, it is a convergence of concepts from Science and Technology Studies (STS), organizational theory, and behavioral economics.

  The most precise label for the phenomenon you describe is **Defensive Quantification**, grounded in what historian of science Theodore Porter calls **Mechanical Objectivity**. It is also a specific form of **Bureaucratic Ritualism**.

  Here is an account of the phenomenon, how it differs from adjacent concepts, where the boundaries lie, and where the analysis remains tentative.

  ### 1. The Label and Theoretical Lineage

  While Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure") describes the *corruption of the metric*, your observation describes the *corruption of the judgment* surrounding the metric.

  *   **Mechanical Objectivity (Theodore Porter):** In his book *Trust in Numbers*, Porter argues that organizations adopt quantification not necessarily because it is more accurate, but because it is more *defensible*. Numbers provide a shield against accusations of bias, favoritism, or arbitrary decision-making. Your dispatchers leave errors uncorrected not because they trust the scanner, but because correcting it looks like "tampering," whereas accepting the error looks like "following procedure."
  *   **Bureaucratic Ritualism (Robert Merton):** Merton described this as a mode of adaptation where actors adhere rigidly to institutional rules and means while losing sight of the actual goals. The goal is literacy or on-time delivery; the ritual is adhering to the test score or the scanner log. The ritual becomes safer than the goal.
  *   **Defensive Decision-Making:** In behavioral economics, this refers to choices made to minimize personal liability rather than maximize organizational utility.

  If you need a shorthand label for your work, **"Defensive Metric Adherence"** or **"The Shield Effect of Quantification"** would be accurate, though **"Reification of Metrics"** (treating the abstract number as more real than the concrete reality) captures the ontological shift you described.

  ### 2. The Mechanism: Asymmetric Accountability

  The core mechanism is not cognitive (trusting the machine) but **political (managing accountability).**

  In both your examples, the actor faces an **asymmetry of consequences**:
  *   **Scenario A (Override):** If they override the metric using human judgment and the outcome is bad (the child struggles, the route fails), they are personally liable for ignoring "objective data." The audit trail exposes them to accusations of bias or incompetence.
  *   **Scenario B (Defer):** If they defer to the metric and the outcome is bad (the child is bored, the driver is unfairly penalized), the blame is absorbed by the system. "The test said Level 3," or "The scanner said On-Time."

  Because the cost of being *personally wrong* (Scenario A) is higher than the cost of the *system being wrong* (Scenario B), rational actors abdicate judgment. This creates a feedback loop: because judgment is rarely exercised, the system never learns to correct the metric, and the metric increasingly dictates reality (e.g., the child actually regresses because the books are too easy, validating the low score).

  ### 3. Distinctions from Adjacent Concepts

  You asked how this differs from gaming, automation bias, and ordinary caution.

  *   **Vs. Goodhart's Law (Gaming):**
      *   *Goodhart:* The actor manipulates the input to change the output (e.g., a driver stops scanning in dead zones to avoid late marks). The intent is to **inflate the score.**
      *   *Your Phenomenon:* The actor accepts the flawed input to protect their status. The intent is to **insulate the self.** The score is not inflated; it is worshipped.
  *   **Vs. Automation Bias:**
      *   *Automation Bias:* A cognitive error where humans genuinely believe the computer is more accurate than they are.
      *   *Your Phenomenon:* The actors *know* the computer is wrong ("everyone knows the scanners misfire"). This is not a trust error; it is an **incentive error.**
  *   **Vs. Defensive Caution / Rule Following:**
      *   *Reasonable Consistency:* Rules are followed to ensure fairness and predictability. Overrides are rare but permitted when evidence is overwhelming.
      *   *Abdication:* Overrides are structurally discouraged (audit trails, stigma). The boundary is crossed when the **process of verification becomes more costly than the error itself.** In your examples, the "cost" is social/political (an audit, a accusation of bias), not just time.

  ### 4. The Boundary: When does Consistency become Abdication?

  The boundary lies in the **feedback visibility** and the **reversibility of the decision.**

  *   **Reasonable Insistence on Rules:** The metric is treated as a *presumption* of truth. If a tutor sees a child reading fluently but scoring low, they can override without penalty because the reading fluency is immediately observable and verifiable by a supervisor. The "ground truth" is accessible.
  *   **Abdication of Judgment:** The metric is treated as *constitutive* of truth. The scanner log *is* the performance; the test score *is* the ability. This happens when the "ground truth" is hard to prove (e.g., a driver's intent in a dead zone, a child's potential vs. current state) and the audit trail privileges the number over the narrative.

  **The Litmus Test:** If an actor overrides the metric, must they write a report justifying why the data was wrong? If yes, abdication is the rational choice. If they can simply note "exception" without triggering an investigation, judgment remains viable.

  ### 5. Counterexamples

  Cases where this pattern *fails* to emerge help define its limits.

  *   **Emergency Medicine / Triage:** Doctors frequently override protocols based on vitals if the patient "looks bad." Why? Because the feedback loop is immediate and visceral (death), and the liability for following a protocol that kills a patient is often higher than deviating to save them. The "ground truth" (life/death) overwhelms the metric.
  *   **Aviation (Manual Override):** Pilots are trained to override autopilot. While automation bias exists, the culture emphasizes "aviate, navigate, communicate." The counter-measure is that the "black box" records the *reasoning* (voice), not just the inputs, allowing for justified deviation.
  *   **High-Stakes Sales:** A sales director might override a CRM forecast to close a deal. Why? Because the revenue is immediately verifiable. The "result" validates the override, neutralizing the audit risk.

  **Tentative Analysis:** The pattern you observe is strongest in **intermediate-stakes environments** where errors are visible enough to be recorded but distant enough that the human cost is abstract (boredom, unfair staffing) rather than immediate (death, bankruptcy). In the "middle zone," bureaucracy thrives.

  ### 6. Limitations and Uncertainty

  I must indicate where this analysis is tentative.

  *   **Conflation Risk:** There is a risk of conflating *individual* defensive psychology with *institutional* design. In your tutoring example, is the tutor protecting themselves, or is the organization implicitly signaling that "data compliance" is a higher KPI than "literacy growth"? Often, the "shield" is provided by management without them realizing it.
  *   **The "Lazy" Variable:** It is difficult to empirically distinguish between "defensive quantification" and simple cognitive laziness. Overriding a system requires effort; deferring does not. Some actors may defer to the scanner not because they fear an audit, but because they don't care enough to fight it. The outcome is the same, but the remedy differs (culture change vs. workload reduction).
  *   **Evolution of the Metric:** You noted the data shapes future performance. In some literature, this is called **"Commensuration"** (turning qualities into quantities). The tentative part is whether this is always negative. Sometimes, forcing a flawed metric *does* drive improvement simply by creating a common language, even if locally inaccurate. Your examples suggest the net effect is negative, but in large-scale logistics, some "ritualism" is the price of scale.

  ### Summary

  You have isolated a real phenomenon. It is **Defensive Quantification** driven by **Asymmetric Accountability**. It differs from Goodhart's Law because the goal is blame avoidance, not score inflation. It differs from Automation Bias because the actors know the data is flawed.

  The boundary is crossed when the **administrative cost of proving the metric wrong exceeds the operational cost of accepting the metric's error.** In your cases, the audit trail and the stigma of "favoritism" constitute that administrative cost. To fix it, organizations must decouple the *audit of the decision* from the *deviation from the metric*, allowing human judgment to be recorded as a valid data point rather than an exception requiring justification.
