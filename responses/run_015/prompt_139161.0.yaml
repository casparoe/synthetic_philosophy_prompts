      *   *Fact Check on Holmes:* *United States v. Holmes*, 26 F. Cas. 360 (1842). Judge Baldwin's charge: "In applying the law, we must look to the situation of the parties... sailors vs passengers." Lots were *not* drawn, but the judge said that would have been the fair method. Holmes was convicted of manslaughter.

      *   *Fact Check on Mignonette:* Parker did not consent. No lots drawn. Rescue was 4 days later.

