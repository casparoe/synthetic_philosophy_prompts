      *   **7. Fragility & Conditionals:**
          *   *Weak Link:* Assuming Hardin would endorse the killing. Hardin might argue the boat was already "lost" (sinking), so the ethic doesn't apply.
          *   *Fact Check:* Did Parker consent? No. Was he strongest? No (weakest). Rescue chance? Low.
          *   *Dealbreaker:* If Parker had consented (lottery won), the moral calculus shifts from Murder to Sacrifice. If rescue was imminent (1 day vs 4 days), the necessity vanishes.

  5.  **Refining and Polishing:**
      *   *Tone:* Analytical, philosophical, slightly gritty (matching the prompt).
      *   *Structure:* Follow the user's numbered points closely but weave them into a cohesive argument.
      *   *Self-Correction on Holmes:* Ensure I don't claim lots *were* drawn in Holmes. The judge argued they *should* have been.
      *   *Hardin's Nuance:* Hardin isn't just "let them die." He's about "carrying capacity." If the Mignonette exceeded carrying capacity immediately upon sinking, Hardin's logic demands reduction.
      *   *The "Blood" Argument:* This is the strongest philosophical point. The "freshness" of the kill proves it was murder for utility, not harvesting of the dead.

  6.  **Final Review against Constraints:**
