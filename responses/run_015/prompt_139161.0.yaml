          *   *Formalization:* Let $V(t)$ be survival value, $M(t)$ be moral cost. Dudley maximizes $V(t)$ at the expense of $M(t)$.
          *   *Lifeboat Ethicist View:* Hardin is a utilitarian regarding the *boat's* survival. He should theoretically endorse $T_{early}$ because the goal is boat survival, not moral purity. *However*, Hardin frames it as "justice" for those outside. Inside the boat, it becomes raw biological calculus.
          *   *Optimal Time:* Biologically: Immediately. Morally: Never. Hardin creates a gap where "Survival" trumps "Morality," effectively endorsing the murder if it saves the boat.

      *   **4. Brooks (The Free Rider):**
          *   Brooks refused the act but ate the result.
          *   *Coherence:* In a utilitarian framework, yes (outcome matters). In a deontological framework, no (complicity).
          *   *Theory Condemnation:* Hardin cares about the *system*, not the individual soul. If the boat survives, the ethic worked. But legally/morally, the *rule* must be upheld (no murder) even if the *outcome* was survival.
          *   *Rule vs. Outcome:* Hardin argues for a "Rule of No Boarding." Mignonette suggests a "Rule of No Killing." If the rule is broken but survival achieved, Hardin's system (which prioritizes long-term survival of the system) might actually condemn the act to prevent precedent (slippery slope).

      *   **5. Contrast: *United States v. Holmes* (William Brown):**
