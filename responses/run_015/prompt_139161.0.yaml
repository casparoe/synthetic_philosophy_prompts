answer: |-
  This is a sharp juxtaposition. Hardin's "Lifeboat Ethics" (1974) is a macro-political metaphor used to justify closed borders and the cessation of foreign aid. *R v Dudley and Stephens* (1884) is a micro-criminal case about survival cannibalism. Putting them together exposes the mechanical guts of Hardin's metaphor that he usually keeps painted over.

  Here is the mapping, the friction points, and the verdict on what this does to Hardin's argument.

  ### 1. Mapping the Players and Capacity

  In Hardin's essay, the "lifeboat" is a rich nation (e.g., the U.S.), the "swimmers" are poor nations, and the "ethicist" is the citizenry or government deciding on immigration/aid. The capacity ($C$) is the carrying capacity of the ecosystem/economy.

  In the *Mignonette*, the "lifeboat" is a 13-foot dinghy. The "swimmers" are the ocean (death). The "ethicist" is initially Dudley (captain), and subsequently the Court.

  **The Capacity Problem:**
  Hardin assumes a boat that is *currently safe* but threatened by boarding. $C_{current} < C_{max}$.
  The *Mignonette* boat was *already failed*. A 13-foot open boat 1600 miles from land with no water has a carrying capacity for humans of **zero** over a 20-day horizon. It was not a lifeboat; it was a coffin with a delay fuse.

  **The Mapping Shift:**
  If you map Hardin honestly onto the *Mignonette*, the "swimmers" aren't people in the water; they are the *future needs* of the people in the boat. The threat isn't external (immigrants); it's internal (metabolism).
  *   **Hardin's Question:** Do we pull them in?
  *   **Mignonette Question:** Do we throw someone out?

  This immediately inverts the vector of Hardin's ethics. Hardin is concerned with the *boundary* of the boat. The *Mignonette* proves that once the boundary is closed, the *interior* becomes a kill zone if resources drop below subsistence.

  ### 2. The Capacity/Selection Split

  You asked whether Hardin is silent on selection or if the case exposes a hidden rule.

  **The Argument:** The case exposes a hidden rule. Hardin's apparatus assumes that whoever is *already in the boat* has a legitimate claim to be there. He treats the in-group as a moral unit. *Dudley and Stephens* shatters that unit. When $C$ collapses below the number of passengers ($N$), Hardin's "guiltless selfishness" regarding the outside world must turn inward.

  If Hardin's ethic is "Survival of the Boat is the Highest Good," then once $N > C$, the ethic *demands* reduction. Hardin has no rule for *who* goes, but the *Mignonette* supplies the implicit Hardinian rule: **The Weak Subsidize the Strong.**

  Parker was the youngest, least experienced, and had no dependents (unlike Dudley). In a cold carrying-capacity calculus, he was the lowest "investment value."
  *   **The Cost:** Admitting this costs Hardin his moral distinction from barbarism. Hardin frames his ethics as "prudent stewardship" to save the boat from sinking. The *Mignonette* shows that "saving the boat" requires active murder of the innocent inside. If the price of the lifeboat's safety is the blood of the cabin boy, the "safety" is morally indistinguishable from piracy. It reveals that Lifeboat Ethics is not a shield against the outside, but a license to cull the inside.

  ### 3. The Timing Thing (The Blood Variable)

  This is the most critical friction point. You noted Dudley killed early to drink the blood. Let's formalize the trade-off.

  Let $S(t)$ be the survival probability of the remaining crew if the killing happens at time $t$.
  Let $M(t)$ be the moral/legal culpability of the killing at time $t$.
  Let $D(t)$ be the probability of Parker dying naturally at time $t$.

  *   **Early Killing ($t_{early}$):** $D(t)$ is low (Parker is alive). $M(t)$ is Max (Murder). $S(t)$ is Max (Blood + Meat + Caloric conservation).
  *   **Late Killing ($t_{late}$):** $D(t)$ is high (Parker is dying). $M(t)$ is Min (Scavenging). $S(t)$ is Min (No blood, less meat, crew weaker).

  Dudley chose $t_{early}$. He optimized for $S(t)$ at the cost of $M(t)$.

  **What does a Lifeboat Ethicist say?**
  Hardin is a consequentialist regarding the *boat*, but a deontologist regarding the *border*. He argues we cannot pull swimmers in because it ruins the system. But inside the boat, the "system" is biology.
  A consistent Hardinian must endorse $t_{early}$. Why? Because the goal is the survival of the genetic/cultural unit (the crew). Waiting for natural death risks the whole boat sinking (all die). The "waste" of Parker's blood is an inefficiency the lifeboat cannot afford.

  **The Optimal Killing Time:**
  For a pure Lifeboat Ethicist, the optimal time is **the moment $N > C$ is identified.**
  Delay is sentimentality. If the math says 3 can live and 4 cannot, the 4th must go immediately to maximize the caloric utility for the 3. Dudley was logically consistent with Hardin's survival imperative; the Court was inconsistent with it (prioritizing abstract law over concrete survival).

  **The Self-Eating Justification:**
  You are right: the justification eats itself.
  *   If you claim "Necessity," you must prove he would have died anyway.
  *   If you kill him early to use the blood, you prove he *would not* have died right then.
  *   Therefore, you killed a viable human to boost calories.
  *   **Hardin's Trap:** Hardin wants to claim the moral high ground ("We are saving civilization by not overloading the boat"). The *Mignonette* shows that "not overloading" sometimes means "shooting the passengers." The "prudence" Hardin advocates collapses into butchery when resources tighten.

  ### 4. Brooks (The Free Rider)

  Brooks refused the act but ate the benefit.
  *   **Coherence:** In a utilitarian framework, Brooks is coherent. The outcome (3 lived) justifies the means. His personal refusal is irrelevant to the caloric math.
  *   **Rule vs. Outcome:** Can the theory condemn a success? Hardin's theory is about *long-term systemic survival*. If the precedent is set that "you can kill the weak if you are starving," does that help or hurt the "Lifeboat" (Society) in the long run?
      *   **Hardin's Dilemma:** If he condemns Dudley, he admits there are rules higher than survival (which undermines his "survival of the boat" absolutism). If he endorses Dudley, he admits his ethic allows murder.
      *   **Resolution:** Hardin would likely condemn Brooks not on moral grounds, but on *disciplinary* grounds. A crew that fractures (one refusing orders) is less efficient. Brooks is a liability. However, legally, the Court condemned the *act* to preserve the Rule of Law (the "meta-boat" of society). They sacrificed Dudley's logic to save the legal system. Hardin cares about the biological boat; the Court cared about the social boat.

  ### 5. Contrast: *United States v. Holmes* (William Brown, 1841)

  **The Facts:**
  The *William Brown* struck an iceberg. 17 crew, 32 passengers. Two boats. The longboat (overcrowded) was commanded by the crew. To keep it afloat, 14 male passengers were thrown overboard. 2 crew members also jumped voluntarily (one survived).
  **The Lots:**
  You recalled the judge mentioned lots. **This is correct.** Justice Baldwin, in his charge to the grand jury, stated that in a situation of necessity, **lots should have been drawn** to decide who died. They were not. The crew prioritized themselves over the passengers.
  **The Verdict:**
  Alexander Holmes (seaman) was convicted of **manslaughter** (not murder), sentenced to 6 months and a $20 fine.

  **Comparison:**
  *   **Dudley:** Killed a crew member (equal status). No lots. Murder conviction (commuted).
  *   **Holmes:** Killed passengers (lower status in maritime hierarchy). No lots (though advised). Manslaughter conviction.

  **Is it Consistent?**
  It is consistent with **Hierarchy**, not Hardin.
  Hardin assumes everyone in the boat has equal claim. *Holmes* proves the "Lifeboat" has a class structure. The crew (operators of the boat) have priority over passengers (cargo).
  *   **Hardin's View:** Hardin would likely find *Holmes* more defensible than *Dudley*. The crew are the "essential technicians" of the lifeboat; the passengers are "excess weight."
  *   **The Punishment:** The lighter sentence for Holmes (more deaths, less time) reflects the Court's acceptance of the crew's privilege. Dudley got a harsher legal label (Murder) because he killed an equal (Parker was part of the "crew" unit).
  *   **Hardin's Blind Spot:** Hardin treats the "rich nation" as a monolith. *Holmes* shows the lifeboat is stratified. If the lifeboat sinks, the captains eat the passengers first. Hardin's metaphor hides the class warfare inside the boat.

  ### 6. Does this Help or Hurt Hardin?

  **It Hurts Him.**
  My suspicion aligns with yours. Hardin uses the lifeboat to argue against *entry*. The real lifeboat cases are all about *exit*.
  *   **The Inversion:** Hardin says: "We cannot let them in, or we all die." The *Mignonette* and *Holmes* say: "We are already in, and we still might all die, so someone must be thrown out."
  *   **The Implication:** The scarcity problem is not solved by closing the border (keeping swimmers out). It is only delayed until the people *inside* consume the resources. Then the "Lifeboat Ethics" demands you kill your neighbors.
  *   **The Metaphor Breaks:** A nation is not a 13-foot dinghy. It has internal production. But if you accept Hardin's premise (finite resources, no tech gains), the *Mignonette* is the logical endpoint of his philosophy. If we follow Hardin to his conclusion, we don't just stop immigration; we eventually start culling the population we already let in. Hardin wants the safety of the lifeboat without the blood of the cabin boy. The *Mignonette* proves you cannot have one without the other.

  ### 7. Fragility and Conditionals

  Here is where my mapping is vulnerable.

  **The Weakest Link:**
  The assumption that Hardin's "Lifeboat" is analogous to a physical survival scenario. Hardin would argue the *Mignonette* is a "panic situation" whereas national policy is a "steady state." He would claim his ethics apply to *management*, not *emergency triage*.
  *   **Drop this if:** You can prove that national resource depletion follows the same exponential decay curve as a sinking dinghy. If the "boat" (Earth/Nation) is actually sinking (climate/resource collapse), Hardin's distinction vanishes, and the *Mignonette* logic applies to policy.

  **Fact Uncertainty:**
  *   **Parker's Health:** We rely on Dudley's account that Parker was dying. If Parker was merely dehydrated but viable, the "Necessity" defense crumbles completely.
  *   **Rescue Probability:** Dudley claimed rescue was unlikely. If a ship was actually over the horizon, the killing was gratuitous.

  **The Single Fact That Changes the Verdict:**
  **If lots had been drawn.**
  If Dudley, Stephens, Brooks, and Parker had drawn straws, and Parker lost:
  1.  **Moral:** It shifts from Murder to Sacrifice/Contract.
  2.  **Hardin:** It validates the "Fairness" inside the boat. Hardin's ethic becomes defensible because the selection wasn't "Weak vs. Strong," it was "Random vs. Random."
  3.  **Legal:** They likely still would have been convicted (consent to death is not a legal defense), but the public outcry would have been muted, and the commutation would have been immediate without the moral stain.
  4.  **Impact on Hardin:** It would *help* Hardin. It would show that Lifeboat Ethics can be just if the selection mechanism is fair. The horror of the *Mignonette* is not just the killing, but the *arbitrary* selection of the weakest. If Hardin advocates for a "lottery" of admission rather than a "border wall," the *Mignonette* supports him. But he doesn't. He advocates for exclusion.

  **Conclusion:**
  The *Mignonette* strips the paint off Hardin's lifeboat. It shows that without external victims (swimmers), the lifeboat eats its own. Hardin wants to use the lifeboat to justify ignoring the swimmers. The *Mignonette* shows that the real danger isn't the swimmers; it's the math of the people already on board. If you accept Hardin's premises, you must accept Dudley's knife. If you reject Dudley's knife, you must reject Hardin's boat.
