      *   *Core Prescription:* No boarding. Guiltless selfishness. Survival of the boat is the highest good.
      *   *Implicit Assumption:* The people *in* the boat belong there. The people *outside* do not.
      *   *Context:* Environmentalism, overpopulation, immigration, foreign aid (1970s).

  3.  **Deconstruct *R v Dudley and Stephens* (Mignonette):**
      *   *Facts:* 4 men, sinking boat, starvation. Parker (weakest/youngest) killed and eaten. 3 survived.
      *   *Legal Ruling:* Necessity is not a defense for murder. Convicted, sentenced to death, commuted to 6 months.
      *   *Moral Dilemma:* Utilitarianism (3 > 1) vs. Deontology (innocent life cannot be taken).

  4.  **Drafting - Section by Section:**

      *   **1. Mapping the Players:**
          *   Hardin's boat = Nation/Ecosystem.
          *   Mignonette boat = Physical vessel.
          *   *Conflict:* Hardin assumes the boat is safe *if* unbreached. Mignonette boat was *already* sinking (capacity ~0).
          *   *Players:* In Hardin, the "ethicist" is the person *in* the boat deciding on swimmers. In Mignonette, the "ethicist" is the court deciding on the survivors.
          *   *Capacity:* Hardin assumes $C > 0$. Mignonette suggests $C \approx 0$ without reduction.
          *   *Options:* Hardin = Let swim or pull in. Mignonette = Kill one, wait for death, or all die.

      *   **2. Capacity/Selection Split:**
          *   *Hardin's Blind Spot:* Hardin focuses on the *boundary* (in/out). He ignores internal selection. He assumes the manifest manifest destiny of those inside.
          *   *Mignonette's Exposure:* Once inside, if $C$ drops, who stays? Hardin has no metric other than "we were here first."
          *   *Argument:* The case exposes a hidden rule: "Might makes Right" or "Utility of the Strong." Hardin's ethic relies on the stability of the in-group. If the in-group must cannibalize itself, the "safety" of the boat is an illusion.
          *   *Cost:* Admitting this undermines Hardin's moral high ground. It turns "Lifeboat Ethics" into "Mutiny Ethics."

      *   **3. The Timing Thing (The "Blood" Variable):**
          *   *Trade-off:*
              *   $T_{early}$: High nutritional gain (blood/fresh meat), high moral guilt (active murder of viable life).
