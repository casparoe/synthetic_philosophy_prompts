  7.  **Writing the Response:** (Mental check of the "Fragility" section needs to be very honest about where the analogy stretches). *Self-Correction:* Make sure to distinguish between Hardin's *prescriptive* ethics (what we should do) and the *descriptive* reality of the lifeboat cases. Hardin uses the lifeboat as a metaphor for national borders; the cases treat it as a physical survival scenario. The friction is there.

      *   *Key Insight:* Hardin's lifeboat is static (rich nation). Mignonette's lifeboat is dynamic (decaying resource base). This is the fundamental mismatch.

