answer: |-
  Good evening. Welcome to the launch of the Centre for Self-Modelling and Consciousness.

  Looking out at this room, I see a rare convergence. On one side, philosophers who have spent decades debating the hard problem. On the other, designers and engineers who solve soft problems every day—interfaces, workflows, user experiences. Usually, these groups speak different languages. One asks, "What is real?" The other asks, "What works?"

  For thirty years, our founder, Elena, has been building a bridge between those questions. And because her work challenges intuition, it is often misunderstood. So, let me be clear about what you will not find here. You will not find a claim that feelings are fake. You will not find an argument that we are zombies, or that consciousness does not exist. Elena is not denying the reality of experience. She is refining our understanding of what experience *is*.

  The core idea is this: Consciousness is not a hidden theatre where a little observer watches the world. It is more like a desktop interface. When you click a folder icon, you are interacting with real data, but the icon itself is not the data. It is a useful representation. For thirty years, Elena has argued that the "self" is that icon. It is a transparent self-model.

  "Transparent" is the crucial word. When you look through a clean window, you see the garden. You do not see the glass. You look *through* the model, not *at* it. This creates what Elena calls an epistemic blindspot. Because the machinery of representation is invisible to the very system using it, introspection hits a wall. We cannot see the processing; we only see the result. We try to turn the eye upon itself, and find only the world looking back.

  This is where the philosophers and the engineers meet. For the philosophers, this dissolves the need for a homunculus—a ghost in the machine. There is no hidden user behind the eyes. There is only the processing.

  For the designers and engineers here, this is where it becomes practical. Elena's recent work integrates predictive processing. The brain is not a passive receiver; it is a prediction machine. It constantly guesses what sensory input is coming next. When the guess is wrong, error signals fire. To manage this complexity, the brain generates a "virtual self." This virtual self is a control variable used to minimize prediction error. It is a tool for regulation, not a soul.

  Why does this matter for your work? Because if the self is a model, it is malleable. If experience is an interface, it can be designed. When you understand that the "user" is actually a dynamic simulation generated to navigate uncertainty, you stop designing for a static subject and start designing for a process. You aren't just building tools for people to use; you are participating in the very machinery that constructs the feeling of being a person.

  That is the mission of this centre. We are not here to hunt for the hidden observer. We are here to study how the interface gets built. We map the transparency. We investigate the blindspot. We analyze how the virtual self emerges to keep the system stable.

  Elena has spent three decades clearing away the confusion so that this work could begin. She has shown us that acknowledging the illusion does not diminish the experience; it clarifies the mechanism.

  So, to the philosophers: bring your rigour. To the designers: bring your prototypes. Let us stop asking who is behind the screen, and start understanding how the screen lights up.

  Thank you, and welcome to the Centre.
