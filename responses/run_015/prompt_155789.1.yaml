answer: |-
  Here is a complete design for a 90-minute seminar session. It transforms the Absent-Minded Driver (AMD) problem from a decision-theoretic puzzle into a lived, collective experience.

  # Seminar Activity: The Fleet of Forgetful Drivers

  **Time:** 90 Minutes
  **Participants:** 10 Grad Students
  **Goal:** To induce time-inconsistency through a collective commitment device, forcing students to experience the tension between *ex-ante* planning (the Fleet Vote) and *ex-post* action (the Driver's Decision).

  ## 1. The Setup & Payoff Scheme (15 Minutes)

  **The Narrative:**
  The class is a logistics fleet. All 10 drivers must navigate the same highway. There are two exits.
  *   **Exit 1:** A mediocre destination (Warehouse).
  *   **Exit 2:** The ideal destination (Home).
  *   **Past Exit 2:** Lost in the woods (Depot).

  **The Constraint (Amnesia):**
  The highway is foggy. When a driver arrives at an exit, they cannot tell if it is Exit 1 or Exit 2. Furthermore, to simulate the "binding policy" constraint, **they will not be allowed to remember the Fleet Vote once driving begins.**

  **The Payoff Scheme (Points):**
  Write this clearly on the board. Points convert to a small tangible reward (e.g., priority on paper feedback, coffee voucher, or simply "Seminar Credit").

  | Outcome | Individual Points | Fleet Bonus Pool |
  | :--- | :--- | :--- |
  | **Exit at 1** | 30 pts | 0 pts |
  | **Exit at 2** | 40 pts | 10 pts (per driver) |
  | **Overshoot (Past 2)** | 0 pts | 0 pts |
  | **Fleet Consistency** | N/A | +50 pts (if >80% follow Vote) |

  *   **Total Score** = Individual Points + (Fleet Bonus Pool / 10).
  *   *Note:* The Fleet Bonus creates a tension. The *group* maximizes points if everyone reaches Exit 2. The *individual*, however, faces a dominance argument at the intersection that may tempt them to exit early.

  ## 2. Phase 1: The Fleet Council (Ex-Ante Planning) (15 Minutes)

  1.  **Discussion:** Give students 5 minutes to discuss the optimal route.
      *   *Math:* If everyone continues at Exit 1 and exits at Exit 2, everyone gets 40 + 10 = 50 pts.
      *   *Risk:* If anyone overshoots, the Fleet Bonus vanishes.
  2.  **The Vote:** The Fleet must agree on a **Binding Policy**.
      *   Options: "Exit at 1," "Exit at 2," or "Mixed Strategy (Continue at 1, Exit at 2)."
      *   *Expected Outcome:* Rational planning dictates **Continue at 1, Exit at 2.**
  3.  **The Contract:** Write the policy on a large sheet of paper. Everyone signs it.
      *   **Crucial Rule:** The Instructor collects the paper. **Students are not allowed to keep a copy.** They are told: *"Once you enter your vehicle, you will suffer temporary amnesia regarding this vote. You must act on your best judgment at the intersection."*

  ## 3. Phase 2: The Drive (Ex-Post Action) (30 Minutes)

  This phase simulates the amnesia and the sequential nature of the problem.

  **Physical Setup:**
  *   Students remain seated at their desks (their "Vehicles").
  *   Instructor stands at the front ("The Highway").
  *   **Prop:** A generic "Intersection Card" (identical index cards for Exit 1 and Exit 2).

  **The Protocol:**
  1.  **Start:** All students put their heads down on their desks. (This breaks visual counting).
  2.  **Intersection 1:** Instructor walks to each student, taps their shoulder, and places an **Intersection Card** face up.
      *   The Card says: **"YOU ARE AT AN EXIT. You do not know if this is Exit 1 or 2. You do not have access to the Fleet Vote."**
      *   **Decision:** The student must whisper "EXIT" or "CONTINUE."
      *   **Record:** Instructor marks their choice secretly.
      *   *If "EXIT":* Game over for that student. They lift their head.
      *   *If "CONTINUE":* Instructor removes the card. Student keeps head down.
  3.  **The "Amnesia" Gap:** Before moving to Intersection 2, the Instructor reads 30 seconds of unrelated text (e.g., a phone book or a philosophy abstract) to disrupt their internal counting heuristic.
  4.  **Intersection 2:** Instructor returns to those who continued. Places an **identical Intersection Card**.
      *   **Decision:** Student whispers "EXIT" or "CONTINUE."
      *   *If "EXIT":* Game over.
      *   *If "CONTINUE":* They have Overshot.
  5.  **Reveal:** Once all have finished, reveal the outcomes and calculate scores.

  ## 4. The Dominance Trap (Built into the Payoffs)

  You must arrange the numbers so the **Dominance Argument** feels compelling at the intersection, even if it contradicts the Plan.

  *   **At the Intersection:** You don't know if you are at 1 or 2.
  *   **Naive Belief:** "It's 50/50 likely I'm at Exit 1 or Exit 2."
  *   **Calculation:**
      *   **Action EXIT:** Guaranteed 30 pts.
      *   **Action CONTINUE:**
          *   If at Exit 1 (50%): You reach Exit 2. You plan to exit there (40 pts).
          *   If at Exit 2 (50%): You Overshoot (0 pts).
          *   *Expected Value:* (0.5 × 40) + (0.5 × 0) = **20 pts.**
  *   **The Pull:** 30 pts (Exit Now) > 20 pts (Continue).
  *   **Result:** Rational drivers, applying dominance reasoning at the intersection, will choose to **EXIT**, even though they voted to **CONTINUE** in Phase 1.

  ## 5. Debrief & Mapping (30 Minutes)

  Do not explain the paradox immediately. Ask them to explain the discrepancy first.

  **Step 1: The Data Reveal**
  *   How many voted to Continue at Exit 1? (Likely 10/10)
  *   How many actually Continued at Exit 1? (Likely <10/10)
  *   Calculate the lost Fleet Bonus due to defection.

  **Step 2: Mapping the Concepts**
  Draw two columns on the board: **The Fleet Council** vs. **The Driver**.

  | Feature | The Fleet Council (Phase 1) | The Driver (Phase 2) | Philosophical Mapping |
  | :--- | :--- | :--- | :--- |
  | **Information** | Full knowledge of route. | Ignorant of location (Exit 1 vs 2). | **Ex-Ante vs. Ex-Post** |
  | **Memory** | Remembers the Vote. | "Forgets" the Vote (Card collected). | **Planning Self vs. Acting Self** |
  | **Reasoning** | Maximizes Total Route Value. | Maximizes Immediate Expected Value. | **Global vs. Local Rationality** |
  | **Outcome** | Optimal Plan (Exit 2). | Dominant Action (Exit 1). | **Time Inconsistency** |

  **Step 3: The "Honest Note" (Instructor Script)**
  *Read this or speak frankly to close the gap between the game and the theory:*

  > "We just played a collective game to solve an individual problem. In the original Absent-Minded Driver paradox, the 'Fleet' is just *you* at time 1, and the 'Driver' is *you* at time 2.
  >
  > **What this activity captures:** It externalizes the commitment problem. By making the 'Plan' a social contract, you felt the normative pressure to obey it, which mirrors the rational pressure your 'Past Self' exerts on your 'Future Self.'
  >
  > **What this activity DOES NOT capture:** The metaphysics of identity. In the game, you knew you were betraying the group. In the real paradox, the driver isn't 'betraying' themselves; they are genuinely unable to update their beliefs correctly because their action *changes the probability* of where they are.
  >
  > **The Collective Muddy/Strong Question:** Does making this a group problem make it clearer?
  > *   **Stronger:** Yes, because it turns an internal psychological conflict into an observable coordination failure. It makes the 'Binding Policy' tangible.
  > *   **Muddier:** Yes, because it introduces 'trust in others' which isn't in the original AMD. In AMD, you trust *yourself*. Here, you might have defected because you thought *others* would defect.
  >
  > **My Intervention:** I need to tell you that in the single-agent case, the 'Dominance Argument' you used at the desk is actually controversial. Piccione & Lipman argue that because your decision to Continue *makes it more likely you are at Exit 1*, you cannot treat the probability as fixed 50/50. But in this game, you treated the location as fixed chance. That is where the paradox lives."

  ## 6. Predictable Failure Points (And Fixes)

  **1. The "Counting" Cheat**
  *   **Problem:** Students will count "First tap, second tap" and realize the second card is Exit 2.
  *   **Fix:** The "Amnesia Gap." You *must* disrupt their counting. Use the 30-second reading aloud. Vary the time between taps for different students so they can't sync watches.
  *   **Verbal Warning:** Tell them at the start: *"If you attempt to count taps, you are violating the simulation conditions. Your grade depends on acting as if you are truly absent-minded."*

  **2. The "Cynical Defector"**
  *   **Problem:** One student realizes the Dominance Argument immediately and exits at 1, ruining the Fleet Bonus for everyone.
  *   **Fix:** This is actually a *feature*, not a bug. It proves the point. In the debrief, highlight this student: *"You were the most rational driver at the intersection, but the worst fleet member. This is the paradox."*

  **3. Confusion on Probabilities**
  *   **Problem:** Students won't understand why Continuing yields a lower Expected Value (20 pts) than Exiting (30 pts).
  *   **Fix:** Have them write down their calculation on the back of the Intersection Card *before* they decide. Collect these. Project them in the debrief to show the math that drove them to defect.

  ## 7. Does the Collective Framing Strengthen or Muddy?

  **Verdict:** It **Strengthens the Normative Pull** but **Muddies the Epistemology**.

  *   **Strength:** The original AMD problem is often dismissed as "Why doesn't the driver just remember?" By making the Plan a *social vote* and the Forgetting a *rule*, you remove the psychological implausibility. The commitment is real (the signed paper), and the forgetting is enforced (you took the paper away). It makes the *rationality of commitment* palpable.
  *   **Muddy:** The original paradox relies on **self-locating belief** (Where am I in time?). The collective version relies on **coordination** (What are *they* doing?). Students may defect because they don't trust the *group*, not because of the time-inconsistency logic.
  *   **Instructor Duty:** You must explicitly disentangle this in the debrief. *"Did you exit early because you thought you were at Exit 1, or because you thought the Fleet Bonus was already lost?"* If it's the latter, the simulation failed to capture AMD and captured a Prisoner's Dilemma instead. You must steer them back to the *individual* calculation at the moment of decision.

  ## 8. Materials Checklist
  *   20 Identical Index Cards ("YOU ARE AT AN EXIT...").
  *   1 Large Sheet of Paper (The Fleet Contract).
  *   Whiteboard (for Payoff Table).
  *   Timer (for the Amnesia Gap).
  *   Text to read aloud (phone book or dense abstract).

  This design forces them to build the dominance argument themselves (via the payoff math), feel the regret of the broken plan (via the Fleet Bonus), and confront the limits of rationality when memory fails.
