prompt: |-
  I run a small philosophy of action seminar with about 10 grad students, one 90-minute session. I want them to actually live the absent-minded driver problem instead of just nodding at it on the board, so could you design a runnable in-class game? The twist I want is a collective version: each student is one driver in a fleet, and before leaving they all vote on a binding route policy. But each driver knows that once on the highway they’ll individually forget whether they’ve passed the first exit, and they also know every other driver will forget the group vote too — so there’s common knowledge of the binding rule, but common knowledge of the forgetting as well. They have to make exit decisions with point payoffs (not real money) that they recieve based on both individual and fleet outcomes. The rules should be arranged so they construct the dominance argument themselves at the first exit, then realize it applies again at the second, and feel the paradox pull before anyone names it. Include roles or rules, a payoff scheme, a timeline, and a debrief that maps moments onto ex-ante planning vs ex-post reasoning — plus an honest note on which feature this collective version dosen't reproduce and I’ll supply verbally. Also tell me what will predictably go wrong the first time I run it.

  Please make sure the payoff scheme is clear without actual cash, and tell me whether the collective framing makes the paradox stronger or just muddies the individual reasoning. I’d also like the debrief to be frank about what part of the idea the activity can’t capture and where I need to step in with explanation.
