answer: |-
  You have stumbled into a triad of problems that sit at the intersection of **metrology** (measurement theory), **statistics** (latent variable modeling), and **epistemology** (coherentism). There is no single word that captures the whole shape, because each discipline carves it slightly differently.

  Here is the carving you asked for.

  ### 1. The Names (and why they only partly fit)

  **In Statistics: Structural Unidentifiability**
  Your network is a system of equations where you have more unknowns than constraints.
  Let $S_i$ be sensor $i$, $T$ be the true air quality, and $B_i$ be the sensor's bias.
  $S_i = T + B_i + \text{noise}$
  You observe $S_i$. You want $T$. You do not know $B_i$.
  With 60 sensors, you have 60 equations, but you have 61 unknowns ($T$ plus 60 biases). You cannot solve this. You can only solve for the *relationships* between sensors, not their relationship to $T$.
  *   **Fit:** Perfectly describes the mathematical impossibility of finding absolute truth.
  *   **Miss:** Doesn't capture the *epistemic feeling* in (ii) that agreement feels like progress.

  **In Engineering: Common Mode Failure**
  Because all sensors are the same model/firmware, they share the same failure modes (temperature drift, humidity cross-sensitivity, firmware bug).
  *   **Fit:** Explains why (i) and (iv) are dangerous. Agreement proves nothing if the error source is shared.
  *   **Miss:** Doesn't account for the spatial distribution. If they are in different microclimates, they *should* disagree. Agreement might mean the pollutant is well-mixed, not that the sensors are broken.

  **In Epistemology: Coherentism (and the Isolation Objection)**
  This is the philosophical structure of (iii). Justification comes from the mutual support of beliefs (sensor readings) rather than contact with an external foundation (reference station).
  *   **Fit:** Describes the circular calibration perfectly.
  *   **Miss:** Standard epistemology usually treats this as a binary (justified or not). You are asking for a *gradient* (what does it buy us?).

  **The Best Descriptive Label:**
  If you need a term for your group chat, call it **The Coherence-Accuracy Gap**.
  *   **Coherence:** How well the sensors agree with each other (Precision).
  *   **Accuracy:** How well the network agrees with the world (Truth).
  *   **The Gap:** The space where systematic bias lives.

  ---

  ### 2. The Carving: What the Loop Buys (and Doesn't)

  You asked what exactly the loop does and doesn't buy you. Here is the boundary.

  **What Agreement Buys You (The "Something Real" in ii)**
  When A and B agree, you gain information about **Noise**, not **Bias**.
  *   **It rules out:** Idiosyncratic random failure. If Sensor A spikes and B doesn't, A is likely noisy. If 60 sensors spike, it is *not* random noise.
  *   **It confirms:** The signal is **structural**. Something is causing the reading. It is either the pollutant ($T$) or a shared environmental confounder (e.g., humidity affecting all sensors equally).
  *   **The Inference:** You can infer *changes* in the source, but not the *level* of the source.

  **What Agreement Does Not Buy You**
  *   **It does not rule out:** Systematic Bias. If the firmware multiplies all readings by 1.5, 60 sensors will agree perfectly on the wrong number.
  *   **It does not rule out:** Cross-Sensitivity. Low-cost PM sensors often mistake water droplets (fog) for particulate matter. If it fogs over the whole city, 60 sensors will "agree" that pollution spiked. This is the **Reichenbach Common Cause** problem: Correlation implies a common cause, but not *which* cause (Truth vs. Confounder).

  **The Verdict on (ii):**
  The inference "90% agreement = 90% right" is broken.
  The correct inference is: "90% agreement = High Confidence that the variance is signal, not noise; Zero Confidence that the mean is accurate."
  It buys you **Precision**, not **Validity**.

  ---

  ### 3. Addressing Your Specific Scenarios

  ** (iii) The Circular Calibration (A→B→C→A)**
  This is **Transitive Closure without an Anchor**.
  In graph theory, you have a connected component with no ground node. You can determine the *relative* offset of every node (A is 5 units higher than B), but you cannot determine the *absolute* potential.
  *   **Is it useless?** No. It allows you to **homogenize** the network. You can make sure that if pollution moves from A's neighborhood to B's, the sensors track the wave consistently. This is vital for mapping plumes.
  *   **The Risk:** You are calibrating to the **Network Mean**. If the Network Mean drifts (e.g., sensor aging), the whole map drifts.

  **Partial Anchors (Physical Constraints)**
  *   *Constraint:* "Readings cannot be negative."
      *   **Effect:** Truncates the error space. Prevents wild negative drift.
  *   *Constraint:* "Two sensors in identical sealed enclosures must match."
      *   **Effect:** This is a **Control Pair**. If they diverge, you know one is broken (random failure). If they agree, you still don't know if they are right (systematic failure).
  *   *Constraint:* "Readings must sum to a total." (e.g., mass balance).
      *   **Effect:** This is a **Global Constraint**. It breaks the unidentifiability *if* the constraint is strict. In air quality, mass balance is rarely known well enough to use.
  *   **Verdict:** Constraints trim the edges of the possible truth space; they do not center it.

  **One Trustworthy Sensor (The Anchor)**
  *   **Does it calibrate the whole thing?** Yes, but trust decays with **distance** and **time**.
  *   **The Decay Function:** Air quality is spatially correlated. If Sensor A (Reference) is 1km from Sensor B, and they agree, B is likely calibrated. If Sensor Z is 10km away, the air mass might be different.
  *   **The Limit:** You are assuming the pollutant is well-mixed. For PM2.5 in a city, correlation length is often 5–10km. For NO2 (traffic), it's <500m.
  *   **Verdict:** One reference sensor anchors the **baseline**, but you need a **variogram** (spatial correlation model) to know how far that anchor holds.

  **Changes Over Time vs. Absolute Levels**
  *   **"Pollution went up 20%" (Relative):** This is **Robust**.
      *   Math: $\Delta S = \Delta T + \Delta B$.
      *   If Bias $B$ is constant (or drifts slowly), $\Delta B \approx 0$.
      *   Therefore, $\Delta S \approx \Delta T$.
      *   **Your network is excellent for this.** Low-cost sensors are often stable enough for trends even if inaccurate for levels.
  *   **"The level is 34" (Absolute):** This is **Fragile**.
      *   Requires $B$ to be known.
      *   **Verdict:** Stop arguing about absolute numbers. Pivot the network's mission to **Anomaly Detection** and **Trend Monitoring**.

  **Different Models (Heterogeneity)**
  *   **The Fix:** Everyone suggests this. Is it right?
  *   **Yes:** It breaks **Common Mode Failure**. Sensor Model X might drift with humidity; Model Y might drift with temperature. If X and Y agree, it's less likely to be an artifact of either specific mechanism. This is **Methodological Triangulation**.
  *   **No:** It introduces **Scale Mismatch**. One measures PM1, one measures PM2.5, one measures optical scattering. They *shouldn't* agree perfectly. Now you need a conversion model, which introduces new assumptions.
  *   **Verdict:** Heterogeneity is superior to homogeneity for validation, but harder to calibrate. It moves the problem from "Shared Bias" to "Conversion Uncertainty."

  ---

  ### 4. Where My Answer is Shaky (The Uncertainty Flag)

  I need to flag two areas where the distinction between "useful signal" and "shared delusion" gets blurry.

  **1. The "Slow Drift" Boundary**
  I claimed above that $\Delta S \approx \Delta T$ because bias is constant.
  *   **The Weakness:** Low-cost sensors often drift non-linearly over months. If the whole network drifts up 10% over a year, and actual pollution also rises 10%, you will confidently report a 20% rise.
  *   **What would convince me otherwise:** If you can swap a subset of sensors to new locations periodically. If the "location effect" is stable but the "sensor effect" moves with the hardware, you can disentangle them. Without sensor swapping, long-term trend data is always suspect.

  **2. The Independence Assumption in (ii)**
  I said agreement rules out random noise.
  *   **The Weakness:** In a city, air quality *is* correlated. If A and B disagree, is it noise? Or did a truck drive past A?
  *   **The Risk:** You might "calibrate out" real local events because the network consensus says they are outliers. This is **Over-Smoothing**.
  *   **What would convince me otherwise:** If you have a dense enough network to resolve the physics of dispersion. If 59 sensors say 10 and 1 says 100, and the 1 is downwind of a factory, the 1 is right. If you don't know the wind, you will treat the 1 as broken.

  ### Summary for Your Group Chat

  1.  **Stop calling it Calibration.** Call it **Harmonization**. You are making the sensors speak the same language, not ensuring they speak the truth.
  2.  **The Loop buys Precision, not Accuracy.** You can trust the *shape* of the curve, not the *height* of the y-axis.
  3.  **The "Something Real"** is the elimination of independent random noise. It confirms the signal is external to the sensor, but not *what* that external thing is (Pollution vs. Humidity).
  4.  **The Fix:**
      *   Embrace **Relative Metrics** (percent change, rank order).
      *   If you must have absolute numbers, acknowledge they are **Model Estimates**, not measurements.
      *   **Heterogeneity helps**, but only if you model the cross-sensitivities.
      *   **One Reference Sensor** anchors the network, but trust decays with distance (check local dispersion models).

  You are not doing bad science; you are doing **Latent Variable Inference** without a ground truth. That is a valid statistical endeavor, provided you report the **Identifiability Limits** clearly. The error isn't in the loop; it's in claiming the loop touches the world.
