answer: |-
  Good morning, and welcome to all of you. It is a privilege to open this workshop, bringing together two communities who rarely share a table: philosophers of action, who specialise in the architecture of moral choice, and clinical practitioners, who navigate the messy reality of care every day. To the nurses, social workers, and coordinators here: thank you for lending us your expertise. To my colleagues in philosophy: thank you for testing your theories against the weight of lived experience.

  We are gathered to discuss care ethics and professional obligation. This is not merely an academic exercise. In the clinical setting, the boundary between what is required and what is optional is often where burnout begins. There is a pervasive fear among practitioners that an ethic of care can be weaponised—that it becomes a demand for infinite availability, where yesterday's extra effort becomes today's minimum standard. If we cannot distinguish between duty and excess, we risk collapsing ordinary professional obligation into an unlimited expectation of self-sacrifice. That is unsustainable, and it is unjust.

  To prevent this, I propose we put a specific conceptual distinction to work today: the difference between threshold supererogation and gradient supererogation.

  Threshold supererogation is the classic model of the heroic. Imagine a clear line. Below the line is duty; above the line is saintliness. Rushing into a burning building to save a stranger is a threshold act. It crosses a definite boundary. We praise it extravagantly, but we do not demand it. It is structurally distinct from obligation.

  However, care labour rarely looks like rushing into a burning building. It looks like holding a patient's hand for ten minutes longer than scheduled, or listening to a family member's grief after your shift has officially ended. This is gradient supererogation. Here, moral merit scales continuously. There is no non-arbitrary cut-off point where duty stops and the extra begins. It is a slope, not a wall.

  Why does this distinction matter structurally? Because it determines how we validate labour without mandating it.

  If we treat all extra care as threshold supererogation, we imply that normal care is merely mechanical duty, and only the dramatic gestures count as moral merit. This insults the daily dignity of your work. Conversely, if we treat gradient supererogation as obligatory, we erase the boundary entirely. We suggest that because you *could* stay ten minutes longer, you *should*. This is the path to exploitation.

  By recognising gradient supererogation, we acknowledge that there is a zone of moral value that is praiseworthy but not demanded. We can honour the nurse who stays late without implying that the nurse who leaves on time has failed. The gradient allows us to say that an act adds moral value without moving the baseline of duty upwards. It protects the practitioner from the creep of expectation. For the philosophers here, this challenges us to refine our models of optionality. For the practitioners, it offers a vocabulary to defend your boundaries without diminishing your compassion.

  This brings me to a final observation regarding the structure of our moral responses. In threshold cases, gratitude and obligation are symmetrical in their limits; once the heroic act is done, the debt is paid. But in gradient cases, the absence of a threshold renders gratitude structurally asymmetrical with obligation.

  Obligation must have a limit; it must stop at the baseline of professional duty, or it becomes tyranny. Gratitude, however, operates on the gradient. Because there is no ceiling to the moral merit available on the slope, there is no point at which gratitude is fully discharged. We can always be grateful for one more minute of care, one more gesture of kindness, even though we cannot obligate that extra minute. This asymmetry is vital. It allows institutions and patients to offer endless thanks without claiming endless rights. It ensures that while our duty is finite, our appreciation remains infinite.

  Let this distinction guide our discussions today. Let us ensure that our theories protect the practitioners who make care possible.

  Thank you, and I wish you all a productive workshop.
