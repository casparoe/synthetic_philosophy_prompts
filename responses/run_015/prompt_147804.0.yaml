answer: |-
  Hi there, I have been thinking through your setup for Thursday and I want to give you a clear stance before you walk into that room because I know how easy it is to get bullied by the textualists when you are proposing a pedagogical reading of ancient material. My definite position is that fractured exemplarity holds up as a reading of Plutarch, but only if you frame it as an implicit mechanism of the synkrisis rather than an explicit authorial doctrine, and you need to be prepared to defend that distinction aggressively because the classicists will try to collapse it. The objections will come in a specific order based on the disciplinary instincts in the room, so you should prepare your responses to flow in that same sequence rather than waiting to see who speaks first. The classicists will open the attack, and they will phrase it by asking where Plutarch ever claims that confusion is pedagogically useful, pointing out that he explicitly states in the Alexander proem that he is writing lives not histories and that virtue admonishes us to imitation. You should concede immediately that Plutarch aims at moral improvement and imitation because denying that is textual suicide, but you must hold that the mechanism of improvement is not mirror-like replication but the active calibration of judgment produced by the friction between the paired lives. Your two-minute reply should argue that the synkrisis at the end of the pairs is not a verdict but a provocation, where Plutarch deliberately withholds a final judgment to force the reader to weigh the asymmetrical fragments of character against each other, meaning the moral work happens in the gap between the lives rather than in the absorption of a single model. The softest point in this reply is that Plutarch never explicitly says he wants the reader to feel friction, so you must pivot to saying that the literary structure itself performs this work regardless of his stated intent, which is where you are most vulnerable to the charge of importing reader-response theory into the first century.

  This leads directly into the weakest point of your entire argument which you asked me to address head-on, and that is the charge of anachronism regarding modern pedagogical theory. You are reading a modern concept of cognitive friction back into Plutarch without direct textual backing, and if you try to hide this the classicists will dismantle you. You need to defend this by arguing that while the terminology is modern, the phenomenology of reading the Parallel Lives is not, because the textual evidence of the pairing structure itself demonstrates a deliberate complication of moral clarity that distinguishes Plutarch from mere encomium. You should state that you are not claiming Plutarch read Dewey or modern moral psychology, but that the literary form he invented necessitates a comparative moral activity that aligns with what we now call fractured exemplarity, and that denying this because he lacks the vocabulary is to confuse the map with the territory. This is still your most vulnerable spot because it relies on inferring intent from structure, so if they press you on whether Plutarch believed this was the best way to teach virtue versus just showing off his learning, you should concede that he likely believed virtue was imitable but insist that the complexity of the real world required a complex model rather than a flat one.

  Once the classicists have settled, the moral philosophers will object by arguing that biography cannot ground normative claims because every life is too particular to yield universal rules, phrasing it as a problem of induction where the specific failures of Caesar do not teach us how to act in modern political contexts. You should concede that a single life cannot provide a universal rule, but hold that the comparison between two lives generates a normative framework about the tension between virtues and vices that is transferable. Your reply should be that Plutarch is not offering a set of rules but training a faculty of judgment, so the particularity is the feature not the bug, because the reader learns to navigate specific moral dilemmas rather than memorizing abstract principles. The softest point here is that you are assuming the reader successfully extracts this judgment rather than just enjoying the gossip, so you need to emphasize that the text addresses an elite audience already trained in philosophy who are capable of doing this work.

  The education theorist will then push back by claiming that exemplar-based learning requires clear models to be effective and that fracturing the exemplar creates cognitive overload that impedes moral development. You should concede that for novice learners clarity is essential, but hold that Plutarch is writing for mature statesmen who need to understand the ambiguity of power rather than simple moral binaries. Your reply should focus on the difference between behavioral mimicry and moral reasoning, arguing that fractured exemplarity promotes the latter by preventing the reader from outsourcing their moral judgment to the hero. The softest point in this reply is the lack of empirical evidence that confusion leads to better moral outcomes, so you should frame it as a philosophical claim about autonomy rather than a psychological claim about learning efficiency.

  Finally, there is the objection you hope nobody asks about Christian hagiography, which might come from anyone in the room who knows late antique literature, arguing that Christian saints lives confirm your model because they also show struggle and failure before redemption. You need to be ready for this by distinguishing the telos of the two genres, noting that Christian hagiography ultimately flattens the biography into a redemptive arc where suffering is resolved by grace, whereas Plutarch leaves the friction unresolved to maintain the pedagogical tension. Your reply should be that hagiography points toward a perfect divine model that absorbs the human flaws, while Plutarch keeps the human flaws in focus to demand human judgment, meaning the Christian model actually confirms your critique of modern hagiography rather than contradicting your reading of Plutarch. The softest point here is that some hagiography is quite complex, so do not overgeneralize the saint lives as purely flat redemptive arcs. You have a strong case if you stay firm on the distinction between imitation of virtue and calibration of judgment, so trust the text and do not let them bully you into apologizing for the modern terminology. Good luck on Thursday.
