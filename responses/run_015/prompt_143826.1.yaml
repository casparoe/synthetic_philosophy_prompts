answer: |-
  Your intuitions are remarkably consistent with a sophisticated position in analytic aesthetics known as **Moderate Moralism** (or **Ethicism**), most notably associated with philosophers like Berys Gaut and Noel Carroll. Your struggle to weight the dimensions suggests you are looking for a principle that explains *when* a moral flaw becomes an aesthetic flaw.

  The principle that captures your verdicts is not about the morality of the artist, nor strictly about the morality of the content, but about the **structure of engagement**.

  Here is a proposed principle, followed by an application to your cases and an answer to your specific worry about the poem.

  ### The Principle of Aesthetic-Moral Integration
  > **A moral defect constitutes an aesthetic defect if and only if that defect is structurally integrated into the work such that fully appreciating the work requires the audience to participate in, endorse, or perpetuate the moral wrong.**

  This principle distinguishes between morality that is *adjacent* to the art (biography, origin) and morality that is *constitutive* of the aesthetic experience (content, stance, medium). It posits that aesthetic value relies on a successful "transaction" between the work and the viewer. If the terms of that transaction are morally corrupt, the aesthetic transaction fails.

  ### Applying the Principle to Your Cases

  **Case 1: The Painter/Murderer (External)**
  *   **Verdict:** Good Art.
  *   **Analysis:** The immorality is biographical, not structural. The painting does not ask you to admire the murder, nor was it made *of* the murder. The "condition of engagement" with the landscape is purely visual and emotional. The artist's later crime is external to the work's internal logic.
  *   **Weight:** Low. Biography is generally irrelevant to aesthetic value unless it changes how we interpret the work's internal meaning.

  **Case 2: The Abusive Novelist (Internal/Endorsement)**
  *   **Verdict:** Aesthetically Compromised.
  *   **Analysis:** Here, the immorality is in the *stance* of the work. To follow the "intended emotional arc," the reader must align their sympathies with domination. The work *prescribes* a moral response. Because the prescribed response is morally vicious, the work fails to secure the engagement of a morally sensitive audience. The flaw is in the *design* of the engagement.
  *   **Weight:** High. When a work demands a corrupt perspective to function as intended, its aesthetic coherence is fractured.

  **Case 3: The Stolen Footage Documentary (Constitutive/Origin)**
  *   **Verdict:** Ambiguous (Context-Dependent).
  *   **Analysis:** This is the hardest case. The principle hinges on whether the theft is *acknowledged* or *concealed* by the work.
      *   If the documentary hides the theft, it asks the viewer to benefit from a violation unknowingly. This creates a tension between the value of the history and the illegitimacy of the access.
      *   If the documentary acknowledges the theft (e.g., as part of its narrative about loss), it may transform the violation into a testament.
      *   **Why you are unsure:** Because the "wrong" is in the *history of the object*, not necessarily the *experience of the object*. However, if knowing the origin makes it impossible to view the subjects with dignity (because they were violated to be seen), the engagement is compromised.
  *   **Weight:** Medium. It depends on whether the origin bleeds into the viewing experience.

  **Case 4: The Human Remains Sculpture (Constitutive/Material)**
  *   **Verdict:** Not Good Art.
  *   **Analysis:** The medium *is* the violation. To admire the form is to admire the arrangement of the desecrated remains. The "condition of engagement" is participation in the desecration. You cannot separate the "beauty of the form" from the "horror of the material" because the material *is* the subject. The aesthetic experience is parasitic on the ethical violation.
  *   **Weight:** Highest. When the existence of the work *is* the harm, aesthetic appreciation is ethically precluded.

  **Case 5: The Genocide Poem (Internal/Complicity)**
  *   **Verdict:** Not Good Art.
  *   **Analysis:** This addresses your specific worry. You ask: *Is my rejection driven by the content being immoral, or by the fact that fully appreciating the form requires a kind of moral participation?*
      *   **The Answer:** It is the latter. Depicting evil (e.g., *Richard III*, *Paradise Lost*) is not an aesthetic defect. Advocating evil *through form* is.
      *   If the rhythm and imagery are designed to make genocide feel *seductive* or *right*, then the formal excellence is the vehicle of the moral corruption. You cannot praise the "engine" while condemning the "fuel" if the engine is designed specifically to burn that fuel. The beauty is not "pure"; it is functional to the vice.
      *   **The Principle:** The aesthetic merit (rhythm) is inextricably linked to the moral defect (persuasion to genocide). Therefore, the moral defect *is* an aesthetic defect because it corrupts the function of the form.

  ### The Hypothetical: Pure Formal Beauty Requiring Cruelty

  You ask: *What should it say about a hypothetical masterpiece of pure formal beauty that can only be fully experienced by adopting a cruel perspective?*

  **The Principle dictates that such a thing is impossible.**

  Here is why: Aesthetic experience presupposes a form of freedom and humanity. To "fully experience" art is to enter into a relationship with it. If the entry condition for that relationship is the suspension of your moral humanity (adopting a cruel perspective), the experience is self-defeating.

  Consider the analogy of a **Logic Puzzle**.
  Imagine a puzzle that is logically perfect, but to solve it, you must accept a premise that you know is false (e.g., "2+2=5"). You cannot praise the puzzle's logical elegance while accepting the false premise, because the logic *depends* on the falsehood. The "elegance" is an illusion created by the error.

  Similarly, if a poem's beauty depends on you feeling cruelty, the beauty is not "pure." It is **complicit beauty**.
  *   **Autonomist View:** Would say the beauty remains, morality is separate.
  *   **Your (Ethicist) View:** The "beauty" is actually a form of **seduction**. If the form works *only* by bypassing moral reasoning, it is aesthetically flawed because it fails to engage the *whole* person. It engages the ear but deadens the conscience. A work that requires the deadening of the conscience to be appreciated has failed as a humanistic artifact.

  ### Summary of Weighting

  To systematize your intuitions, you can weight the dimensions based on **Inseparability**:

  1.  **Constitutive Material (Case 4):** The work *is* the harm. (Aesthetic value negated).
  2.  **Internal Stance/Endorsement (Case 2 & 5):** The work *requires* moral complicity to function. (Aesthetic value compromised).
  3.  **Constitutive Origin (Case 3):** The work *results* from harm, but the harm may be historical. (Aesthetic value ambiguous/contextual).
  4.  **External Biography (Case 1):** The harm is *adjacent* to the work. (Aesthetic value preserved).

  **Conclusion:**
  Your rejection of the poem is correct, and not a confusion. It is driven by the fact that **form and content are not separable vessels.** When the form is optimized to deliver immoral content, the excellence of the form is an excellence *in service of the immorality*. Therefore, it is not "good art" in a holistic sense, because art is a mode of communication between humans. If the communication requires one human to degrade their humanity to understand the other, the artistic transaction has failed.
