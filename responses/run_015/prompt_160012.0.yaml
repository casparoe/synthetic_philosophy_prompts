answer: |-
  This is a fantastic piece of philosophical reasoning. You have essentially reconstructed a classic problem in moral philosophy (the tension between *moral relativism/contextualism* and *moral realism/universalism*) and correctly identified that your current formulation leads to a *reductio ad absurdum* (Step 8).

  You are stuck because your argument is logically valid, but it relies on a premise that is factually and philosophically too strong.

  Here is the breakdown of where the argument breaks, which step to reject, and how to salvage the "Man of His Time" defense without ending up at Step 8.

  ### The Fatal Flaw: Step (2)

  You need to reject (or significantly modify) **Step (2)**.

  > *(2) Whats available to you is basically set by your society: if a practice is accepted almost everywhere around you, AND the case against it isnt really being made in public by anyone youd actually run into, then you have no way of knowing its wrong.*

  **Why this breaks:**
  This step commits the fallacy of **Social Epistemic Determinism**. It assumes that moral truth is *created* by consensus rather than *discovered* by reason or empathy. It equates "what people *did* believe" with "what it was *possible* to believe."

  History shows us that moral knowledge is rarely, if ever, completely unavailable. Even in the darkest times, there were dissenters.
  *   **Columbus:** While the conquest was celebrated, there were immediate theological and legal debates within Spain about the rights of Indigenous peoples (e.g., the School of Salamanca, and shortly after, Bartolomé de las Casas). The argument that "these are human beings with souls" *was* available.
  *   **Jefferson:** As you noted, abolitionist societies existed in his lifetime. The argument that "slavery violates natural rights" was literally written into the Declaration of Independence; the cognitive dissonance was his, not a lack of available information.

  **The Cost of Rejecting (2):**
  You lose the idea that society *determines* knowledge. You replace it with the idea that society *obscures* knowledge. This means individuals in powerful positions (like Columbus or Jefferson) have a higher burden to seek out the truth than the average peasant. They had access to education, debate, and dissenting voices that the "average person" did not.

  ### The Overreach: Step (3)

  You also need to modify **Step (3)**.

  > *(3) So: near-universally accepted practice → no blame.*

  **Why this breaks:**
  This turns a **mitigating factor** into an **exonerating factor**.
  Just because a practice is universal doesn't mean it's blameless; it might just mean the *whole society* is culpable. More importantly, this step creates a binary (Guilty/Innocent) where morality is actually scalar (More/Less Guilty).

  **The Cost of Rejecting (3):**
  You admit that "Man of His Time" is not a "Get Out of Jail Free" card. It is a sentencing guideline. It explains *why* the moral failure occurred (social pressure, lack of precedent), but it does not erase the failure itself.

  ### The Solution: "Culpable Ignorance"

  To keep Step (1) (fairness) and Step (7) (abolitionists were right), you need to introduce the concept of **Culpable Ignorance**.

  **Revised Step (1*):** You can't be blameworthy for doing something if you had no way of knowing it was wrong, **UNLESS your ignorance itself is a result of negligence.**

  If you are a powerful leader with access to the best education of your time, you have a duty to interrogate the morals of your society. If you simply accept the "universal practice" because it benefits you, your ignorance is *culpable*. You *could* have known, because the tools to know (reason, empathy, dissenting voices) were available, even if they were unpopular.

  **How this fixes the Argument:**

  1.  **Rejects Step (8):** We don't have to tear down every statue. We can judge them by current standards *while acknowledging* the difficulty of their context. We judge them to understand moral progress, not just to cancel them.
  2.  **Saves Step (7):** The abolitionists were right because they demonstrated that the knowledge *was* available. Their existence proves that slaveholders were not "unable" to know slavery was wrong; they were *unwilling*.
  3.  **Saves Step (5) partially:** Future people *might* judge us on factory farming. But if there are vocal minorities today arguing against factory farming (and there are), then 50 years from now, people cannot say "we didn't know." They will say "you chose profit over the available moral argument." This matches our intuition that we *are* responsible for investigating current ethical blind spots.

  ### Addressing Your Intuition on Credit/Blame

  You asked: *"If going along with everyone around you gets you off the hook for bad stuff, then doing good stuff that everyone around you was also doing shouldnt get you any credit either."*

  **You are absolutely right.** This is a feature, not a bug.
  *   **Moral Credit:** We generally *don't* give people much moral credit for doing the bare minimum of what their society requires. We give credit to people who **transcend** their time. We praise Lincoln or Wilberforce not because they were "men of their time," but because they were *ahead* of their time.
  *   **Moral Blame:** Conversely, we blame figures like Columbus not because they were "worse than everyone else," but because they failed to meet the moral potential that *was* available to them.

  If you accept the "Man of His Time" defense as total exoneration (your Step 3), you logically must accept that moral heroes are impossible, because no one can ever be better than their environment. Since we know moral heroes exist (Step 7), the defense must be limited.

  ### The Surviving Version of the Defense

  Here is how you write the "Man of His Time" defense for your group without hand-waving, using this corrected logic:

  1.  **Context is for Explanation, Not Exoneration:** We use historical context to explain *how* a person came to hold a view, not to prove the view was correct. It helps us understand the *mechanism* of the harm.
  2.  **The "Available Dissent" Test:** To judge a historical figure, we ask: *Was there a credible moral argument against their actions available in their lifetime?*
      *   **For Columbus:** Yes. The debate on the humanity of Indigenous peoples was active within the Spanish church and court during and immediately after his life. His failure to engage with this is a moral failing.
      *   **For Jefferson:** Yes. Abolitionist arguments were public. His failure to act is a moral failing.
      *   **For a random peasant:** Maybe not. They lacked access to the debate. They are less blameworthy than the leader.
  3.  **Scalar Judgment:** "Man of His Time" reduces the *degree* of blame compared to a modern person committing the same act, but it does not reduce it to zero. It acknowledges the social pressure without absolving the individual agency.

  ### Summary for your Assignment

  *   **Reject Step (2).** Social consensus does not equal epistemic limit. Dissent almost always exists.
  *   **Modify Step (3).** Context mitigates blame; it does not erase it.
  *   **Keep Step (1) with a caveat.** Ignorance excuses only if the ignorance is not culpable (i.e., you couldn't have known *and* you couldn't have found out).
  *   **Keep Step (7).** The existence of contemporaneous critics (abolitionists, Las Casas) proves that moral knowledge was accessible.

  This allows you to say: *"Columbus was a man of his time, which explains why he wasn't stopped by his peers, but he is still blameworthy because the moral arguments against his actions existed and he chose to ignore them."*

  That is not hand-waving. That is history.
