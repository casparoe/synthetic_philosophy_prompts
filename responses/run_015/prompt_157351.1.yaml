answer: |-
  # The Interactive Kind Audit (IKA): Decision Procedure for Diagnostic Revision

  **Purpose:** To distinguish between changes in diagnostic criteria that track underlying pathological shifts and changes that are artifacts of "looping effects" (reciprocal interactions between classification and the classified).
  **Users:** Clinicians and Epidemiologists.
  **Constraint:** This procedure identifies *mechanisms of change*, not the *moral value* of those changes.

  ---

  ## Part I: The Procedure

  ### Step 1: The Institutional Incentive Check
  **Question:** Did a change in resource allocation, insurance reimbursement, or legal status precede the observed shift in prevalence or symptom presentation?
  *   **Sufficient Answer to Proceed:** Data shows the shift in prevalence occurred *before* or *independently* of changes in funding, disability benefits, or forensic utility associated with the code.
  *   **Stop Point (Recommendation Against Change):** If the shift correlates strongly with a new incentive (e.g., diagnosis now grants access to medication or school accommodations), halt. The change is likely an artifact of institutional looping, not a discovery of a new population.
  *   **Value Judgment/Sign-off:** None. This is an epidemiological correlation. Sign-off by Lead Epidemiologist.
  *   **Risk of False Negative/Misfire:** Misfires if incentive structures are subtle or informal (e.g., peer prestige among clinicians) rather than codified in policy.

  ### Step 2: The Behavioral Feedback Check
  **Question:** Are individuals modifying their reported symptoms or observable behavior to align with the public understanding of the diagnostic category?
  *   **Sufficient Answer to Proceed:** Clinical interviews and longitudinal observation indicate symptom stability regardless of the patient's knowledge of the label.
  *   **Stop Point (Recommendation Against Change):** If patients report "learning" symptoms from advocacy groups, social media, or prior clinical encounters and subsequently present those specific symptoms to secure the diagnosis, halt. This indicates the classification is altering the "kind" of person being classified (Hacking's first distinction).
  *   **Value Judgment/Sign-off:** None. This is a clinical observation of symptom provenance. Sign-off by Senior Clinician.
  *   **Risk of False Negative/Misfire:** Misfires if the behavioral adaptation is unconscious or if the "true" underlying condition is indistinguishable from the learned presentation without biological markers.

  ### Step 3: The Agency and Resistance Check
  **Question:** Is the proposed change driven by the classified group actively redefining the category to reduce stigma or increase community cohesion, rather than by new data on pathology?
  *   **Sufficient Answer to Proceed:** The proposal originates from data analysis or clinical trials, not primarily from patient advocacy demands for reclassification.
  *   **Stop Point (Recommendation Against Change):** If the primary driver is a social movement seeking to reclaim the label (e.g., shifting a disorder to a "neurotype" or "identity") without corresponding evidence of functional change, halt. This is active resistance/redefinition (Hacking's third distinction).
  *   **Value Judgment/Sign-off:** **High.** Determining whether patient advocacy constitutes "noise" or "correction" involves values. Sign-off required by Ethics Committee and Patient Representative.
  *   **Risk of False Negative/Misfire:** Misfires if the patient group possesses lived-experience expertise that correctly identifies a flaw in the original criteria that data has not yet captured.

  ### Step 4: The Stability Projection
  **Question:** If the diagnostic label were kept secret from the patient and the public, would the prevalence and presentation remain the same?
  *   **Sufficient Answer to Proceed:** Modeling suggests the condition exists independently of its naming (e.g., severe psychosis where insight is impaired).
  *   **Stop Point (Recommendation Against Change):** If the condition relies on the patient's self-concept to exist (e.g., conditions defined by identity distress), the criteria cannot be revised without acknowledging the loop. Proceed only if the goal is to manage the loop, not deny it.
  *   **Value Judgment/Sign-off:** **High.** This determines the ontological status of the condition. Sign-off required by Working Group Chair and External Philosophy/Ethics Consultant.
  *   **Risk of False Negative/Misfire:** Misfires in conditions where "insight" is part of the pathology (e.g., anosognosia), making the "secret label" test impossible to operationalize.

  ### Step 5: The Normative Gate
  **Question:** If a looping effect is confirmed, is the resulting change in human kind beneficial, neutral, or harmful?
  *   **Sufficient Answer to Proceed:** Consensus that the loop reduces suffering or improves function.
  *   **Stop Point (Recommendation Against Change):** If the loop increases stigma, dependency, or iatrogenic harm.
  *   **Value Judgment/Sign-off:** **Critical.** This step cannot be resolved by empirical fact. It requires a value decision on whether to prioritize "ontological stability" or "clinical utility." Sign-off required by Full Working Group Vote and Regulatory Body.
  *   **Risk of False Negative/Misfire:** The procedure cannot calculate long-term societal harm. It may approve a change that is clinically helpful short-term but creates harmful identity traps long-term.

  ---

  ## Part II: Application to Proposals

  ### Proposal 1: Lowering Age-of-Onset Threshold for Mood Disorder
  **Context:** Clinicians report encountering younger patients who actively self-identify with the diagnosis.
  **Procedure Run:**
  *   **Step 1 (Incentives):** Pass. No new funding for pediatric mood disorders identified.
  *   **Step 2 (Behavioral Feedback):** **FAIL.** Evidence shows adolescents are adopting symptom language from online communities prior to assessment. They present with "textbook" criteria that match public discourse rather than natural history.
  *   **Step 3 (Agency):** **FAIL.** The push is driven by self-identification trends.
  *   **Recommendation:** **Reject Proposal.**
  *   **Rationale:** The procedure identifies this as a looping effect where the classification is creating the population. Lowering the threshold codifies a cultural trend rather than a pathological shift.

  ### Proposal 2: Narrowing Criteria for Personality Disorder Post-Deinstitutionalization
  **Context:** Prevalence rates dropped sharply in jurisdictions that reduced long-term institutional care.
  **Procedure Run:**
  *   **Step 1 (Incentives):** **FAIL.** The drop in prevalence correlates exactly with the closure of long-term wards. Without institutional placement, the "disorder" is not diagnosed because the behavioral threshold for community survival is different than for institutional management.
  *   **Step 2 (Behavioral Feedback):** N/A (Step 1 stop).
  *   **Recommendation:** **Reject Proposal.**
  *   **Rationale:** This is institutional looping (Hacking's second distinction). The "condition" did not vanish; the environment that made the behavior visible and classifiable changed. Narrowing criteria would mistake an administrative artifact for a clinical discovery.

  ### Proposal 3: The Conflict Case (Reclassifying "Social Anxiety" as "Social Neurodivergence")
  **Context:** A proposal to remove "distress/impairment" criteria for Social Anxiety, reclassifying it as a neutral neurotype. Patient groups report reduced shame; clinicians report patients function better.
  **Procedure Run:**
  *   **Step 1 (Incentives):** Pass.
  *   **Step 2 (Behavioral Feedback):** **FAIL.** Patients are changing behavior *because* of the new label (feeling empowered rather than pathological).
  *   **Step 3 (Agency):** **FAIL.** Driven by active resistance/redefinition by the classified group.
  *   **Step 4 (Stability):** **FAIL.** The condition does not exist independently of the label.
  *   **Procedure Recommendation:** **Reject Proposal.** The procedure demands evidence of underlying stability. Since the change relies entirely on the looping effect (changing the label changes the person), it fails the audit for a "diagnostic revision" and is flagged as a "social reclassification."
  *   **Clinical Intuition:** The group wants to **Accept.** Clinicians observe that patients suffer less and engage better in therapy when the "pathology" frame is removed.
  *   **The Disagreement:**
      *   **Procedure Demand:** Requires the diagnosis to track a stable underlying reality. It views the improvement as an artifact of the label change, not evidence of validity.
      *   **Intuition Resistance:** Clinicians prioritize *outcome* over *ontology*. If the loop makes people healthier, the loop is a feature, not a bug.
      *   **Location of Conflict:** **Step 5 (The Normative Gate).** The procedure treats looping as a confounding variable to be controlled. The clinicians treat looping as a therapeutic mechanism to be leveraged.

  ---

  ## Part III: Limitations and Philosophical Junctures

  ### What the Procedure Cannot Determine
  The Interactive Kind Audit cannot determine whether altering patient identity through reclassification is inherently harmful or beneficial. It can detect *that* the identity is being altered (Step 2 and 3), and it can detect *that* institutions are shaping the presentation (Step 1). It cannot calculate the moral weight of that alteration. A "false positive" in the procedure might reject a change that effectively reduces stigma, treating a beneficial social loop as a scientific error. Conversely, it might approve a change that creates a harmful dependency, treating a stable biological loop as valid science.

  ### The Philosophical vs. Empirical Juncture
  The specific juncture where philosophical disagreement drives the outcome is **Step 5 (The Normative Gate)**, precipitated by the findings in **Step 2 (Behavioral Feedback)**.

  *   **Empirical Claim:** "The patients behave differently because they know the label." (Both sides agree).
  *   **Philosophical Disagreement:**
      *   **Realist View (Procedure Default):** A valid diagnosis should track a pre-existing condition. If the label creates the condition, the diagnosis is scientifically suspect.
      *   **Pragmatist View (Clinical Intuition):** A valid diagnosis is one that yields useful interventions. If the label creates a condition that is easier to treat, the diagnosis is clinically valid.

  The procedure is built on a Realist default (seeking to isolate the "kind" from the "classification"). When the working group encounters a case where the "loop" is therapeutic, the procedure demands rejection based on ontological instability, while the clinicians demand acceptance based on pragmatic utility. This is not a dispute about data, but about the purpose of psychiatric classification: is it to map nature, or to manage human suffering? The procedure cannot resolve this; it can only expose it.
