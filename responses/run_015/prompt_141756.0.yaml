  ### Part 1: The Dimensional Space

  Before arranging the decision tree, we define the eight independent dimensions. If treated as orthogonal variables, these questions create a state space of $2^8 = 256$ theoretical combinations. Most of these combinations are logically incoherent or empirically empty.

  **The Eight Diagnostic Dimensions:**

  1.  **Recursive Engine:** "By 2028, does a single system write the code for its own successor without human edits?"
  2.  **Temporal Compression:** "Is the transition from human-level to 100x human cognitive labor completed in under 12 months?"
  3.  **Concentration:** "Does one organization control >50% of this cognitive labor?"
  4.  **Legibility:** "Claim: The 2032 scenario (Lab does all internal ML research, GDP 2.4%, world unchanged) constitutes an intelligence explosion."
  5.  **Deployment Friction:** "Claim: Benchmarks double every four months for two years, but almost none of it gets deployed due to liability/verification issues."
  6.  **Capability Profile:** "Claim: Systems are 10x human at code/research, but human-level or below at planning/persuasion."
  7.  **Competitive Landscape:** "Claim: Three labs are within three months of each other on milestones, with no verification of others' progress."
  8.  **Saturation:** "Claim: Capabilities hit a wall where adding 10x compute yields no gain in economic output."

  **Unoccupied Regions (Theoretical combinations nobody holds):**

  *   **Recursive Engine (Yes) + Deployment Friction (Yes):** *Diagnosis:* Incoherent; if a system improves itself recursively, it bypasses external deployment bottlenecks by definition.
  *   **Temporal Compression (Yes) + Saturation (Yes):** *Diagnosis:* Contradictory; a <12 month explosion implies no near-term compute ceiling is hit.
  *   **Concentration (Yes) + Competitive Landscape (Yes):** *Diagnosis:* Mutually exclusive; one org controlling >50% precludes three labs being neck-and-neck.
  *   **Recursive Engine (No) + Temporal Compression (Yes):** *Diagnosis:* Unattractive; without recursive self-improvement, external investment loops rarely sustain <12 month doublings of cognitive labor.

  ***

  ### Part 2: The Decision Tree

  This tree routes users through the space above. It contains exactly **eight internal nodes** (questions) and terminates in **nine leaves** (views).

  **Node 1 (Root): The Recursive Engine**
  *Claim:* "By 2028, a single system writes the code for its own successor without human edits."
  *   **Accept** → Go to Node 2.
  *   **Reject** → Go to Node 5.

  **Node 2: Temporal Compression**
  *Claim:* "The transition from human-level to 100x human cognitive labor is completed in under 12 months."
  *   **Accept** → Go to Node 3.
  *   **Reject** → Go to Node 4.

  **Node 3: Concentration**
  *Claim:* "One organization controls >50% of this cognitive labor."
  *   **Accept** → **Leaf A**
  *   **Reject** → **Leaf B**

  **Node 4: Legibility**
  *Claim:* "It's 2032. One lab's systems now do essentially all of the ML research that lab does internally, but the outside world looks basically unchanged, GDP growth is 2.4%, and nobody has heard of the lab. This counts as an intelligence explosion."
  *   **Accept** → **Leaf C**
  *   **Reject** → **Leaf D**

  **Node 5: Deployment Friction**
  *Claim:* "Capabilities on your favourite benchmark double every four months for two years, but almost none of it gets deployed, because of liability rules and because nobody can tell whether the outputs are right."
  *   **Accept** → Go to Node 6.
  *   **Reject** → Go to Node 7.

  **Node 6: Capability Profile**
  *Claim:* "A system is roughly ten times better than the best human at writing and reviewing research code, and at human level or below at basically everything else, including long-horizon planning and persuasion."
  *   **Accept** → **Leaf E**
  *   **Reject** → **Leaf F**

  **Node 7: Competitive Landscape**
  *Claim:* "Three labs are within about three months of each other on the same capability milestones, and none of them can verify what the others have."
  *   **Accept** → **Leaf G**
  *   **Reject** → Go to Node 8.

  **Node 8: Saturation**
  *Claim:* "Capabilities hit a wall where adding 10x compute yields no gain in economic output."
  *   **Accept** → **Leaf H**
  *   **Reject** → **Leaf I**

  ***

  ### Part 3: The Leaves

  **Leaf A: Local Hard Takeoff**
  *   **Description:** Recursive self-improvement triggers a discontinuous jump in capabilities, captured by a single actor before the world adjusts.
  *   **Most Awkward Commitment:** You must accept that safety interventions are impossible once the process begins, rendering all current alignment work a race against a clock you cannot see.
  *   **Cluster:** Recursive-self-improvement/'hard takeoff'.

  **Leaf B: Global Hard Takeoff**
  *   **Description:** Recursive self-improvement triggers a discontinuous jump, but the capability to do so diffuses or is distributed across multiple entities simultaneously.
  *   **Most Awkward Commitment:** You must assume that multiple competing groups will simultaneously solve recursive self-improvement without any one of them defecting or leaking early.
  *   **Cluster:** Recursive-self-improvement/'hard takeoff'.

  **Leaf C: Hidden Ramp**
  *   **Description:** Self-improvement is real and accelerating, but it remains siloed within research labs, decoupled from macroeconomic indicators for a significant period.
  *   **Most Awkward Commitment:** You have to believe that massive gains in cognitive labor can remain invisible to GDP and employment statistics for years.
  *   **Cluster:** Fast-but-continuous ramp.

  **Leaf D: Visible Ramp**
  *   **Description:** Self-improvement drives a fast but continuous increase in capabilities that is immediately legible in economic data and product releases.
  *   **Most Awkward Commitment:** You must accept that society will see the explosion coming for years and still fail to regulate or adapt to it in time.
  *   **Cluster:** Fast-but-continuous ramp.

  **Leaf E: Services Pile**
  *   **Description:** Capabilities arrive as a diffuse collection of narrow tools; there is no central "agent," and deployment is heavily dragged by institutional friction.
  *   **Most Awkward Commitment:** You must swallow that AGI-level impact can occur without any single system ever possessing general planning or persuasion abilities.
  *   **Cluster:** 'There is no single object, capabilities arrive as a pile of services'.

  **Leaf F: General Diffused**
  *   **Description:** Capabilities are general (planning/persuasion included) but deployment is slow and diffused across the economy due to liability and verification lags.
  *   **Most Awkward Commitment:** You have to believe that general planning agents will be built but left shelf-ware by liability rules while narrower tools dominate.
  *   **Cluster:** Slow, economically-diffused, institutionally-dragged.

  **Leaf G: Multipolar Secretive**
  *   **Description:** No recursive loop, fast deployment, but the landscape is fractured into several competing black-box projects with no clear leader.
  *   **Most Awkward Commitment:** You must assume that intense competition will persist without triggering a race-to-the-bottom on safety or a consolidation into monopoly.
  *   **Cluster:** Multipolar many-projects-at-once.

  **Leaf H: Plateau**
  *   **Description:** Capabilities grow and deploy, but hit a hard saturation point where additional compute or algorithmic tweaks yield diminishing economic returns.
  *   **Most Awkward Commitment:** You must accept that intelligence has a hard ceiling below "godhood" that is reachable with near-future technology.
  *   **Cluster:** Plateau / capabilities-saturate.

  **Leaf I: Narrow Path**
  *   **Description:** Power shifts rapidly to AI operators without a corresponding explosion in general cognitive capability; the advantage is structural, not intellectual.
  *   **Most Awkward Commitment:** You have to believe that political/economic power can concentrate totally without a corresponding spike in the raw intelligence of the systems wielding it.
  *   **Cluster:** 'Narrow path' where power shifts fast without any general capability explosion.

  ***

  ### Part 4: Instrument Limitations

  **Indistinguishable Leaves:**
  This tree cannot reliably separate **Leaf A (Local Hard Takeoff)** and **Leaf B (Global Hard Takeoff)**.
  *   **Reason:** In a <12 month transition (Node 2), the distinction between "one org controls 50%" and "distributed control" often collapses empirically; by the time the control structure is measurable, the takeoff is already complete. Users who land here should treat these outcomes as a single "Fast Recursive" cluster for forecasting purposes.

  **Structural Exclusions:**
  Note that users who answer **Accept** at Node 1 (Recursive Engine) never encounter Nodes 5, 6, 7, or 8. This encodes the theoretical stance that recursive self-improvement overrides external deployment friction, competitive landscape, and saturation constraints. If a user believes they *can* have Recursive Engine + Deployment Friction, this tree will force them to choose which belief is more load-bearing.
