prompt: |-
  So I'm presenting at a workshop on moral demandingness next month, and my paper argues that Bernard Williams's integrity objection is actually stronger than most people think — not just that utilitarianism asks too much of us, but that the structure of impartial justification itself can't make sense of the way our ground projects function as reasons. Like, the "one thought too many" point isn't about sentimentality, it's about what it means for a consideration to count as a reason for me at all. The audience is a mix: two rule-consequentialists who think they can accomodate integrity by building agent-relativity into the rules, a Kantian who's going to say the categorical imperative already gives you space for your projects because imperfect duties leave latitude, a particularist who's sympathetic but thinks I'm overtheorizing, and a few grad students who've just read "A Critique of Utilitarianism" and are fired up. Oh, and one senior person who knew Williams personally and will have strong views about what he "really meant."

  Give me a Q&A prep sheet: the objections I'll actually get from this specific crowd, ordered by likelihood × damage, phrased the way they'd phrase them, with a tight two-minute reply for each and a frank note on where my reply is weakest. Include the question I'm praying nobody asks. Keep the whole thing under 1000 words.
