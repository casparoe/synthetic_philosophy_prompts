      *Drafting text:*

      **Q&A Prep: Integrity & Impartiality**

      **1. The Rule-Consequentialist Accommodation**
      *Q:* "You say impartial justification fails, but why can't rule-consequentialism just build agent-relative permissions into the optimal code? If the best rules let me prioritize my projects, haven't you lost your objection?"
      *Reply:* "Because that treats integrity as a *concession* granted by the system, not a *condition* of agency. If my ground projects are only permissible because they maximize overall value indirectly, they remain contingent on the impartial calculus. My claim is stronger: the impartial standpoint cannot *generate* the authority of my projects. If the rule changes because utility shifts, my reason disappears. Integrity isn't a rule exception; it's the background against which rules make sense."
      *Weakness:* They'll press whether 'optimal code' includes stable psychological needs. If utility *requires* stability, the distinction blurs.

      **2. The Kantian Latitude Move**
      *Q:* "Kantian imperfect duties already give latitude for projects. Why is Williams's point distinct from the space allowed by the categorical imperative?"
      *Reply:* "Latitude implies a permission within a duty-structure. Williams argues the structure itself is alienating. For Kant, projects are morally neutral zones. For Williams, they are the source of normative force. If the CI is the ultimate justificatory screen, my projects are still subordinate to morality. I'm arguing they precede morality normatively. Latitude is a gift from the moral law; integrity is the ground of the agent who receives it."
      *Weakness:* Requires defending a controversial meta-ethical claim about the priority of agency over morality.

      **3. The 'Real Williams' Challenge (Senior Person)**
      *Q:* "I knew Bernard. He was wary of heavy metaphysical lifting. You're turning a humanistic critique into a structural theory of reasons. Isn't this overreach?"
      *Reply:* "I agree Williams resisted system-building. But his 'one thought too many' isn't just psychological; it's conceptual. It asks what counts as a reason *for me*. I'm not building a system; I'm exposing the cost of systems. If impartial justification requires me to view my projects as neutral data, it strips them of their reason-giving force. I'm clarifying his insight, not systematizing it."
      *Weakness:* High risk. If they say "No, he meant X," you look presumptuous. Defer respectfully but hold the line on the text.

      **4. The Particularist Pushback**
      *Q:* "You're theorizing about 'structures of justification.' Why not just say impartialism gets the particular cases wrong? Do you need this machinery?"
      *Reply:* "Because pointing out errors doesn't explain *why* they recur. Impartialism isn't a bug; it's a feature of the framework. Without addressing the structural claim—that reasons must be agent-neutral—we'll just get new theories replicating the problem. The machinery diagnoses the infection, not just the symptoms."
      *Weakness:* They may be right that the machinery is unnecessary baggage. Keep it minimal.

      **5. The Prayer Question (The Collapse)**
      *Q:* "If impartial justification fails, and reasons are grounded in ground projects, isn't this just egoism? How do you criticize anyone's projects without an impartial standard?"
      *Reply:* "Not egoism. Egoism makes projects sovereign *against* others. I'm saying projects make agency possible. We can still critique projects internally or via overlap, but not from a 'view from nowhere.' Moral criticism becomes negotiation between agents, not adjudication from above. It's risky, but less alienating than the alternative."
      *Weakness:* This is the hard spot. Without impartiality, moral criticism looks weak. Be honest about the cost.

