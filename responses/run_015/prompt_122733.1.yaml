answer: |-
  # The Cognitive Integration Protocol (CIP)

  **Purpose:** To determine whether an external resource functions as a constituent part of a student's cognitive process (a "prosthetic mind") or merely as a tool used by that process.
  **Time Allocation:** 15 minutes per case.
  **Committee Roles:** Chair (Timekeeper), Disability Adviser (Evidence), Faculty (Assessment Integrity), Student Rep (Fairness Check).

  ---

  ## Part I: The Procedure

  The Committee must proceed through the following four gates. If a **Hard Stop** is triggered, the request is denied immediately. If a **Soft Fail** is triggered, it counts as evidence against approval but does not end the hearing. If all gates pass, the request moves to the Assessment Integrity Check.

  ### Gate 1: Entrenchment & History (The "Last Week" Rule)
  *Philosophical Basis:* Cognitive integration requires time. A resource adopted shortly before an exam is a crutch, not a limb.
  *   **Question:** Has the student used this specific resource (or a functionally identical predecessor) as their primary mode of working for at least **two consecutive academic terms** prior to this request?
  *   **Required Evidence:**
      *   Clinician/Specialist letter confirming the condition and the long-term necessity of the adaptation.
      *   Usage logs (digital timestamps) or a portfolio of past work showing the resource's footprint.
      *   Statement from a personal tutor confirming observation of the method over time.
  *   **Hard Stop:** If usage began less than 6 months ago or solely in response to the upcoming exam.
  *   **Soft Fail:** Gaps in usage due to hospitalization or equipment failure (must be documented).

  ### Gate 2: Reliability & Availability (The "Otto's Notebook" Rule)
  *Philosophical Basis:* For a resource to be part of the mind, it must be as reliably available as biological memory. Intermittent access breaks the cognitive loop.
  *   **Question:** Is the resource physically present, functional, and immediately accessible to the student under standard invigilated conditions without external assistance?
  *   **Required Evidence:**
      *   A short demonstration at the start of term (or video evidence) showing setup time < 2 minutes.
      *   Confirmation that the resource does not rely on Wi-Fi/cloud access unless the exam hall guarantees it.
      *   Confirmation that the resource does not store recoverable exam data (security check).
  *   **Hard Stop:** If the resource requires internet access not guaranteed in the hall, requires a technician to operate, or is intermittently available (e.g., shared equipment).
  *   **Soft Fail:** If the resource requires a specific power outlet (invigilator must ensure availability).

  ### Gate 3: Transparency & Trust (The "Verification" Rule)
  *Philosophical Basis:* We trust our memory implicitly. If a student constantly verifies the resource against internal calculation, the resource is a calculator, not a memory extension.
  *   **Question:** Does the student accept the output of the resource automatically, or do they routinely cross-check it against internal knowledge?
  *   **Required Evidence:**
      *   Student statement regarding their reliance (e.g., "I do not check the braille display against my memory; it *is* my reading").
      *   Tutor observation: "When the tool gives an answer, do they question it?"
  *   **Hard Stop:** If the student admits to verifying the resource's output against internal knowledge for every use (indicates the resource is not integrated).
  *   **Soft Fail:** If the student verifies only when the output seems anomalous (standard cognitive error-checking).

  ### Gate 4: Endorsement & Origin (The "Authorship" Rule)
  *Philosophical Basis:* For a resource to be *my* mind, the content must be endorsed by me. Content generated by others (tutors, AI, peers) is testimony, not memory.
  *   **Question:** Was the content or the logic of the resource generated, selected, or curated by the student, or was it provided by a third party?
  *   **Required Evidence:**
      *   Sample of the resource content compared to student's past work.
      *   Declaration of origin (e.g., "I compiled these notes" vs. "My tutor gave me this sheet").
  *   **Hard Stop:** If the resource contains procedural logic (decision rules, algorithms) generated by a tutor or software that the student cannot reproduce or explain verbally.
  *   **Soft Fail:** If the content is standard public knowledge (e.g., periodic table) but formatted by a third party.

  ---

  ## Part II: The Assessment Integrity Referral

  If a request passes all four Gates, it is deemed a **Cognitive Prosthetic**. It is now part of the student's mind. However, the Department owning the exam retains the right to determine if the *use of that mind* violates the learning outcomes.

  **The Referral Mechanism:**
  The Committee does not ask: "Is this aid allowed?"
  The Committee asks: "Does the use of this prosthetic bypass the specific competency this paper is certified to measure?"

  **The Departmental Response Template (Mandatory):**
  To reject a CIP-approved prosthetic, the Department must complete the following:
  1.  **Identify the Competency:** State precisely which cognitive process is being measured (e.g., "Recall of formulae," "Construction of syntactic structures," "Selection of statistical tests").
  2.  **Demonstrate Interference:** Explain specifically how the prosthetic bypasses that process rather than enabling access to it.
  3.  **Alternative Assessment:** Propose how the competency could be measured if this prosthetic is banned (e.g., "Oral exam," "Different paper").
  *Note: A blanket statement ("Closed book policy") is insufficient.*

  ---

  ## Part III: Case Applications

  ### Case 1: The Degenerative Visual Condition (Screen Reader + Braille Display)
  *   **Gate 1 (Entrenchment):** **PASS.** Six years of usage. Clinician letter confirms degenerative condition.
  *   **Gate 2 (Reliability):** **PASS.** Hardware is personal, offline-capable, setup < 2 mins. Security check confirms no storage.
  *   **Gate 3 (Trust):** **PASS.** Student statement: "I do not translate the braille; I read it." No verification against memory.
  *   **Gate 4 (Endorsement):** **PASS.** The text is the exam paper (provided by uni) or the student's own typing. The *mechanism* is the prosthetic, not the content.
  *   **Assessment Integrity:** Does this bypass a learning outcome? Unless the paper explicitly tests "unaided visual decoding of ink" (unlikely), the prosthetic enables access to the *content* without bypassing the *reasoning*.
  *   **Verdict:** **APPROVE.**
  *   **Committee Reflex:** Approve.
  *   **Analysis:** No conflict. The procedure codifies what we already do, securing it against security objections regarding the hardware's storage capacity.

  ### Case 2: The Statistics Formula & Decision Sheet (Tutor-Compiled)
  *   **Gate 1 (Entrenchment):** **PASS.** Used for the term.
  *   **Gate 2 (Reliability):** **PASS.** Printed sheet, always available.
  *   **Gate 3 (Trust):** **PASS.** Student trusts the sheet implicitly.
  *   **Gate 4 (Endorsement):** **HARD STOP.** The *decision rules* ("If design is X, use Test Y") were compiled by the tutor. The student cannot reproduce the logic without the sheet. This is not the student's cognitive process; it is the tutor's expertise outsourced to paper.
  *   **Procedural Adjustment:** The Committee separates the sheet.
      *   *Formulae:* **PASS Gate 4 (Soft Fail).** Standard public knowledge, formatted by tutor.
      *   *Decision Rules:* **FAIL Gate 4.**
  *   **Assessment Integrity Referral:** The Committee refers the *Formulae* to the Department.
      *   *Question to Dept:* "Does this paper test the *recall* of statistical formulae, or the *application* of them?"
      *   *If Recall:* Department must ban formulae (and provide alternative assessment for the disabled student, e.g., oral definition).
      *   *If Application:* Department must allow formulae.
      *   *Decision Rules:* Committee **DENIES** the decision rules.
  *   **Verdict:** **PARTIAL APPROVAL.** Formulae allowed (subject to Dept confirmation); Decision Rules banned.
  *   **Committee Reflex:** **APPROVE ALL.** (Committees typically view "Memory Aids" as a blanket accommodation for anxiety/disability).
  *   **Analysis:** **This is the Reversal.** Our current practice treats the tutor's logic as a "scaffold." The CIP treats it as "cognitive offloading." If we allow the tutor's decision rules, we are certifying the tutor's statistical judgment, not the student's. The procedure forces us to distinguish between *memory support* (formulae) and *process substitution* (decision rules).
  *   **Defense of Procedure:** This is not a defect in the procedure; it is a defect in our practice. We are currently allowing students to bring a "surrogate examiner" into the hall. If the degree certifies "competence in selecting statistical tests," allowing a sheet that makes that selection invalidates the degree. The student may need a different accommodation (e.g., extra time to recall the rules internally), but they cannot bring the rules themselves if they did not generate/endorse them.

  ### Case 3: Dictation + Grammar Restructuring Tool (Written Expression Graded)
  *   **Gate 1 (Entrenchment):** **PASS.** Two years daily usage.
  *   **Gate 2 (Reliability):** **PASS.** Phone + App. (Requires offline mode check).
  *   **Gate 3 (Trust):** **PASS.** Student accepts the restructured sentences.
  *   **Gate 4 (Endorsement):** **FAIL.** The tool *restructures* the sentences. The output is generated by software algorithms, not the student. The student endorses the *meaning*, but not the *syntax*.
  *   **Assessment Integrity Referral:** Even if Gate 4 were passed, the Referral triggers here.
      *   *Competency:* "Written Expression" is a graded component.
      *   *Interference:* The tool performs the exact competency being measured (syntax/grammar construction).
      *   *Department Response:* "We are grading the ability to construct grammatical sentences. This tool constructs them for the student."
  *   **Verdict:** **DENY.**
  *   **Committee Reflex:** **DENY.**
  *   **Analysis:** No conflict. However, the procedure clarifies *why*. It is not because "tech is banned." It is because the *locus of cognition* for the specific graded skill is external.
  *   **Alternative:** The Committee should refer the student to the Department for an *Alternative Assessment* (e.g., oral exam where expression is spoken, not written), rather than simply banning the tool and forcing the student to fail the written component.

  ---

  ## Part IV: Limitations & Constraints

  As Chair, you must recognize where this procedure reaches the end of its authority.

  **1. The Legal Floor vs. The Philosophical Ceiling**
  The CIP sets a high bar for what counts as "part of the mind." However, Equality Law (e.g., ADA, Equality Act 2010) often requires "Reasonable Adjustments" that fall *below* this bar.
  *   *Limitation:* A student may not meet the "Entrenchment" gate (Gate 1) because their condition is new, but legal duties may still require us to accommodate them.
  *   *Action:* The CIP is for *standard* accommodations. New/acute conditions must bypass the CIP and go straight to a Risk/Legal assessment. Do not use philosophy to deny legal rights.

  **2. The Departmental Veto**
  The CIP can determine that a resource is a "prosthetic mind," but it cannot force a Department to certify a competency they believe is missing.
  *   *Limitation:* If the Department insists that "Unaided Recall" is essential to the degree (e.g., a Medical degree requiring drug dosage recall), they can reject even a CIP-approved prosthetic via the Referral Mechanism.
  *   *Action:* The Committee's power here is not to override, but to force transparency. The Department must go on record stating: "This degree certifies X, and this prosthetic bypasses X." This protects the student's right to appeal and the University's legal standing.

  **3. The Black Box of Self-Report**
  Gate 3 (Trust) and Gate 4 (Endorsement) rely heavily on student honesty. A strategic student can claim, "I trust the app implicitly," when they do not.
  *   *Limitation:* We cannot wire students' brains to verify integration.
  *   *Action:* We rely on the "Entrenchment" gate (Gate 1) as the proxy for truth. It is hard to fake two years of usage logs. If the logs exist, we presume the cognitive integration is real.

  **4. The Fatigue Exception**
  The prompt mentions a student who *could* do the work internally but finds it exhausting.
  *   *Limitation:* The CIP is strict: if you *can* do it internally, the tool is not constitutive.
  *   *Action:* This is where the CIP yields to Disability Services. If the "internal route" causes pathological fatigue (medical evidence required), the accommodation is not based on *Extended Mind*, but on *Endurance*. This is a medical adjustment, not a philosophical one. The CIP should not be used to adjudicate fatigue; refer these to the Medical Adviser.

  ## Summary of Changes to Practice

  1.  **Stop approving Tutor-Compiled Logic:** We will no longer allow "decision sheets" created by staff. We will allow formula sheets *only if* the exam does not test formula recall.
  2.  **Start Demanding Departmental Specificity:** Departments can no longer say "No Aids." They must say "No Aids because this aid bypasses Learning Outcome 3."
  3.  **Formalize the "Prosthetic" Status:** When we approve a screen reader or braille display, we are not granting a "privilege"; we are certifying that this hardware is the student's sensory organ. This language strengthens the student's position against invigilators who try to treat the device as a potential cheat.

  This procedure will not make the decisions easy. It will make them defensible. It shifts the argument from "Is this fair?" (subjective) to "Is this integrated?" (evidentiary) and "Does this measure the competency?" (academic).
