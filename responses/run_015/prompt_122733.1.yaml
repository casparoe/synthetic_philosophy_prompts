  1.  **Deconstruct the Request:**

      *   **Role:** Chair of an Assessment-Accommodations Committee at a mid-sized university.
      *   **Problem:** Current process is improvised, inconsistent, and philosophically ungrounded.
      *   **Constraints:**
          *   Fortnightly meetings.
          *   30-40 requests/term.
          *   15 minutes per case.
          *   Committee composition: 2 rotating faculty, 1 disability adviser, 1 student rep (no philosophy training).
          *   Output: Written decision (appealable), acceptable to the owning department.
          *   Core Question: Is the resource part of the *mind* sitting the exam or merely a *tool*? (Extended Mind Hypothesis - EMH).
          *   Requirement: Turn EMH literature (Clark & Chalmers, etc.) into a *procedure* (ordered questions, evidence, stop rules, referral mechanisms).
          *   Specific Conditions to Test: Reliability/Availability, Automaticity/Trust, Endorsement/Ownership, Origin of Content.
          *   Anti-Gaming: Conditions cannot be satisfied by last-minute arrangements.
          *   Edge Cases to Handle: Shared/Joint content, Opaque operations (black box), Intermittent availability, Fatigue reduction (could do it internally but exhausting).
          *   Deliverables: The Procedure, Application to 3 Specific Cases, Critique of Results (Procedure vs. Practice), Limitations of the Procedure.

  2.  **Theoretical Grounding (Extended Mind Hypothesis - EMH):**

      *   *Core Idea:* Cognitive processes aren't just in the head; they can extend into the environment if certain conditions are met.
      *   *Parity Principle:* If a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is part of the cognitive process.
      *   *Criteria (Clark & Chalmers' "Otto and his Notebook"):*
          1.  Constant availability (reliability).
          2.  Automatic access (trust).
          3.  Endorsement (what's in the notebook is what I believe).
          4.  Past endorsement (I put it there/consciously adopted it).
      *   *Objections to Address:* Coupling vs. Constitution (just using a tool isn't being the tool), The "Google Problem" (everything becomes part of me if we aren't careful), Ownership/Authorship.

  3.  **Drafting the Procedure (The "Cognitive Integration Protocol"):**

      *   *Goal:* Make it actionable for non-philosophers in 15 minutes.
      *   *Structure:* Pre-screening -> The 4 Criteria -> The "Assessment Integrity" Check -> Decision/Referral.
      *   *Evidence:* Needs to be realistic (clinician letters, logs, demos).
      *   *Stop Rules:* Hard fails vs. Soft fails.
      *   *Referral:* How to kick it to the department without them just saying "No."

      *   *Drafting the Criteria (translating EMH to Admin-speak):*
          1.  **Reliability/Availability:** Is it always there? (Not intermittent).
          2.  **Transparency/Trust:** Do they trust it implicitly? (No double-checking).
          3.  **Endorsement/Ownership:** Is it *their* info? (Not tutor-generated).
          4.  **History/Entrenchment:** Is this a long-term adaptation? (Not last-week cramming).

      *   *Refining the "Assessment Integrity" Check:* This is where EMH hits the wall of "What are we testing?" If the exam tests *memory*, an external notebook fails even if it meets EMH criteria. This needs a specific referral path.

      *   *Handling Edge Cases:*
          *   *Shared Content:* Fails Endorsement.
          *   *Opaque Operations:* Fails Trust/Transparency (if they can't verify the output).
          *   *Fatigue:* This is the tricky one. EMH says if it's functionally equivalent, it counts. But if the exam tests *stamina* or *unaided recall*, it might not. This needs a specific flag.

