answer: |-
  Here are comments on the draft, addressing your eight specific questions.

  **1. Accuracy of the map**
  Your description of the dialectic is fair for a general audience, though "ranking" is your own terminology for what is usually discussed as "modal asymmetry" or "sortal dominance." Constitution theorists (e.g., Baker, Johnston) do not typically ground the *direction* of constitution (Lump → Statue) in relative permissiveness; they ground it in the "primary kind" of the object. They would say the statue is the primary kind, and the lump is merely the material that constitutes it. However, you are right that the *motivation* for accepting coincidence often relies on the intuition that the lump has broader persistence conditions than the statue. If you attack the idea that modal asymmetry *explains* constitution, you are attacking a common motivation, even if not the technical formulation. To be precise: clarify that you are attacking the idea that modal profiles *ground* the constitutive relationship, not just that they correlate with it.

  **2. Generated or stipulated?**
  This is the crux. You are walking a line between describing a practice and stipulating an ontology. The certificate *does* stipulate verdicts, but your claim is that the practice *requires* ontological commitment to make sense of those verdicts.
  *   **The Crossing:** The crossing holds only if the lump cannot survive total replacement. If you delete the 1998 conservation episode, the case collapses back into a standard sortal dispute (one object, two descriptions). The argument *needs* the replacement episode to generate the modal cross.
  *   **Non-arbitrariness:** It is non-arbitrary within the *institution*, but you need to argue why the institution's rules track metaphysical reality rather than just normative convenience. You claim the verdicts "fall out of the kind." A critic will say the kind is just a label for the rules. To strengthen this, emphasize that the physical treatment (conservation vs. reshaping) has causal consequences that differ depending on which object you think you are handling.

  **3. Which branch should I commit to?**
  Commit to the claim that a lump of clay (a quantity of matter) cannot survive gradual total replacement. This is the standard mereological view of masses/quantities. Artifacts survive replacement; masses do not. This gives you the cleanest modal cross. If you concede that lumps survive replacement, you lose the asymmetry and the "crossing" vanishes, leaving you with a case where the artwork is just a lump with extra rules. The "mass vs. artifact" distinction is your strongest metaphysical lever; use it.

  **4. The type-and-instance reply**
  It is damaging but costly, as you note. To survive it, you need a case where the work is *not* multiply instantiable.
  *   **Suggestion:** Modify the case slightly. Suppose the certificate specifies *this specific lump* and forbids replacement, but allows *reshaping* (perhaps it's a "mutable lump" work). Now the Art survives reshaping, the Lump does not (if we assume the specific lump is essentially unshaped, which is harder to argue).
  *   **Better:** Stick with the current case but press the "causal interaction" point. If the work is a type, burning the lump in 1997 should not count as destroying the work, only an instance. But insurance pays out for *destruction of the work*, not loss of an instance. The practice treats the token in the gallery as the work. The type view requires us to treat all conservation reports as systematically misleading. That is a high price.

  **5. Overgeneration**
  This is your weakest point and needs a paragraph of defense. Why doesn't naming my car "Betsy" create a coincident object "Betsy" that survives part replacement while the car does not?
  *   **The Line:** Draw it at *normative practices with ontological commitments*. Art institutions don't just name; they commit resources to maintaining identity conditions that diverge from the material. Ordinary naming does not trigger a distinct maintenance regime.
  *   **Constitution Theorist's Need:** They already need a line between "substantial kinds" and "phases." You are arguing that institutional kinds can be substantial. You aren't creating a new problem; you are expanding the category of substantial kinds. Make this explicit: "The constitution theorist already distinguishes between sortals that track objects and sortals that track phases. I am arguing institutional rules can elevate a sortal to the former category."

  **6. Persons**
  "It does not insulate the person-and-animal case, because 'person' is not an institutional kind in the relevant sense; biological persistence conditions still govern the animal. If anything, it makes things worse: if social recognition can generate coincident objects, then social roles might generate coincident thinkers, multiplying the problem rather than solving it."

  **7. Whether it is worth posting**
  Yes, it is worth posting. The "Sixteen Pounds" case is vivid and the "modal cross" is a neat trick.
  *   **Weakest Section:** The transition from the case to the general claim about artifacts ("That is the claim I want to defend..."). It feels a bit fast.
  *   **Structure:** Open with the *Sixteen Pounds* case, not the standard dialectic. Hook the reader with the weirdness of the readymade, then show how it breaks the standard statue/lump model.
  *   **Cut:** Trim the first paragraph's list of views (identity, constitution, eliminativist). Summarize it in one sentence: "Standard views rely on a modal asymmetry between matter and form." You need the word count for the overgeneration objection.

  **8. One paragraph, in her voice**
  "You're reifying curatorial rules. The certificate doesn't conjure a new object; it just changes how we *track* the old one. When the conservator replaces the clay, she isn't preserving a metaphysical entity called 'Sixteen Pounds'; she's maintaining a focal point for attention and value. You say the practice treats the token as the work, but that's just shorthand. We say 'The museum bought a Monet,' but we don't think the brushstrokes are the only thing that matters. Your 'crossing' isn't a metaphysical discovery; it's just a description of how we change our sortal criteria depending on whether we're acting as geologists or art critics. You've shown that art practices are flexible, not that ontology is."
