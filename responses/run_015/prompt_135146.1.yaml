          *   *Logic:* If we certify $p \land \neg K p$ as knowable, then someone knows it. If someone knows it, they know $p$ and they know $\neg K p$. If they know $\neg K p$, then $K p$ is false. But if they know the conjunction, they know $p$, so $K p$ is true. Contradiction.
          *   *Admin speak:* "Conjunctions involving current ignorance."
      *   **Q2: Cartesian Restrictions.** Solution: Restrict to non-factive or stable truths.
