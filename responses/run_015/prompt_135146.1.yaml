  **MEMORANDUM FOR REGIONAL DIRECTORS**
  **FROM:** Central Adjudication, Office of Knowability Compliance
  **DATE:** 14 October 2024
  **SUBJECT:** Procedural Adjustments Regarding Certification of Contingent Unknowns
  **REF:** OKC-INT-892-B

  **1. Q: How do we process Form 12-B (Declaration of Unknown Truths)?**
  **A:** Do not process. Upon receipt of a proposition $p$ certified as true but currently unknown, staff must verify if $p$ is knowable. However, verification requires establishing a possible world where $p$ is known. If $p$ includes the clause "and this is unknown," knowing $p$ falsifies the clause. Consequently, the proposition becomes false upon verification. Staff are instructed to reject any submission where the act of certification negates the truth-value of the submission. See *Circular 4* regarding Volatile Truths.

  **2. Q: What constitutes a "Volatile Truth" exempt from the Act?**
  **A:** Any proposition where the knowledge operator is non-commutative with the truth condition. Common examples include surprise statements ("I am surprised") or current ignorance claims. These are classified as Non-Cartesian. Applicants must submit a Stability Warranty confirming that knowing the proposition does not alter its truth. Note: Warranty forms themselves contain knowledge operators and are therefore subject to review under Question 3.

  **3. Q: Can the Act apply to propositions containing epistemic operators?**
  **A:** Pending review. Legal advises that the Knowability Act may only apply to truths statable in a language devoid of cognitive verbs (e.g., "knows," "believes," "verifies"). This prevents self-referential contradictions. However, Section 1 of the Act itself contains the phrase "is knowable." Drafting is currently attempting to rewrite the Act using only non-epistemic terminology. Until then, enforcement is suspended for all meta-linguistic claims.

  **4. Q: A clerk certified a conjunction $(A \land B)$ without certifying $A$ or $B$ individually. Is this compliant?**
  **A:** Yes, under Emergency Waiver 9. We have temporarily suspended the distributivity of knowledge over conjunction. Staff may stamp a compound form as "Knowable" even if the constituent parts are stamped "Uncertifiable." Be advised: Clerk Higgins exploited this waiver to certify "There is an error in this file and no one knows it." While the conjunction was stamped, neither conjunct was verified. Higgins has been reassigned to Data Entry (Offline).

  **5. Q: Budget cuts have reduced our truth-value allocations. Can we assume bivalence?**
  **A:** No. To conserve resources, the Office is adopting an intuitionistic framework. We no longer guarantee that every proposition is either true or false. If a truth cannot be constructed or verified, it is not false; it is merely unasserted. This eliminates the requirement to certify unknown truths, as the existence of such truths is no longer affirmed.

  **External Comment:**
  Regarding the Office's inability to certify unknown truths, Dr. Aris Thorne of the Metaphysical Realist Society stated: "We are thrilled. The Office's administrative deadlock confirms our long-held position. If the Knowability Act fails to process certain truths, those truths must exist independently of our capacity to know them. The bureaucracy has inadvertently proved realism. We look forward to their next quarterly report confirming the existence of mind-independent facts they cannot touch."

  **6. Q: Does this Office exist?**
  **A:** This Office exists to certify truths. If the existence of this Office is a truth, it must be knowable. However, per Question 3, statements regarding the Office's own operational status contain epistemic operators prohibited under current drafting guidelines. Therefore, the status of this Office cannot be stated within the language permitted by the Office.

  ***

  ^1 *Note: Per Section 1 of the Knowability Act, the issuance of this memorandum must be knowable to be valid. As the content of this memorandum outlines conditions under which its own validity cannot be known, please treat this document as having been issued only if you already know it was issued. If you are reading this for the first time, assume it is a draft.*
