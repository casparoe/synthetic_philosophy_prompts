      *   Factivity: $K \neg K q \rightarrow \neg K q$.
      *   Contradiction: $K q \land \neg K q$.
      *   Therefore: $\neg \Diamond K (q \land \neg K q)$.
      *   By Knowability Principle: $\neg (q \land \neg K q)$.
      *   Therefore: $q \rightarrow K q$ (Omniscience).
      *   *The Office's problem:* They have to certify truths. If they encounter an unknown truth, they can't certify it as knowable without making it known (and thus false).
