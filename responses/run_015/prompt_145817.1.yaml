      *   **Constraint:** Do not smuggle in philosophical terminology. If an objection has no counterpart, identify the gap (vocabulary vs. claim).
      *   **Deliverable 1:** Restatement of arguments (Corruption of Meaning, Crowding Out, Distributive Injustice).
      *   **Deliverable 2:** Residue Report (Mapping success, distortion, or disappearance).
      *   **Specific Focus:** Divisible vs. Positional goods in auction design (kidneys vs. votes).
      *   **Conclusion:** Assess whether the residue indicates a deficiency in economics or ambiguity in philosophy.

  2.  **Deconstruct the Normative Arguments:**
      *   *Corruption of Meaning:* Selling kidneys/votes changes what they *are*. It degrades social value.
      *   *Crowding Out:* Monetary incentives reduce intrinsic/altruistic motivation.
      *   *Distributive Injustice:* Markets favor the rich/exploit the poor.

  3.  **Translate into Mechanism Design Vocabulary:**

      *   *Corruption of Meaning:*
          *   Economic concept: Externalities (specifically, preference interdependence). If my utility depends on *how* a good is allocated, not just *who* gets it.
          *   Mechanism term: Social Welfare Function constraints, Negative Consumption Externalities.
          *   Challenge: Mechanism design usually takes preferences as given. "Meaning" implies endogenous preference formation or structural constraints on the domain of admissible preferences.
          *   Translation: "Admissible Domain Restriction" or "State-Dependent Utility."

      *   *Crowding Out:*
          *   Economic concept: Dynamic Inconsistency, Multi-tasking Principal-Agent problem, or Endogenous Preferences.
          *   Mechanism term: Incentive Compatibility over time. If introducing price $p$ changes the type distribution $\theta$ or the utility function $u(\cdot)$ in future periods.
          *   Translation: "Intertemporal Incentive Compatibility Failure" or "Endogenous Type Evolution."

      *   *Distributive Injustice:*
          *   Economic concept: Welfare Weights, Initial Endowments.
          *   Mechanism term: Allocative Efficiency (Pareto) vs. Equity. VCG maximizes efficiency, not equity.
          *   Translation: "Weighted Social Welfare Maximization" or "Initial Endowment Inequality affecting Budget Constraints."

  4.  **Drafting the Restatement (Iterative Process):**

      *   *Attempt 1 (Mental):* Kidney sales create negative externalities. Vote selling breaks strategy-proofness.
      *   *Critique 1:* Too simple. Need to be rigorous.
      *   *Attempt 2 (Closer):*
          *   Corruption of Meaning $\rightarrow$ Non-separable utility functions. The allocation rule $f(\theta)$ affects the utility function itself.
          *   Crowding Out $\rightarrow$ Dynamic mechanism design problem. Offering transfer $t$ changes the probability of truthful revelation in $t+1$.
          *   Distributive Justice $\rightarrow$ VCG is efficient but ignores budget constraints derived from unequal endowments.

      *   *Refining for Constraints:* I must avoid words like "dignity," "moral," "civic." I must use "utility," "types," "allocations," "transfers."

  5.  **Addressing the Kidney vs. Vote Distinction (Divisible vs. Positional):**
      *   Kidneys: Rival, excludable. Can be modeled as a matching market.
      *   Votes: Non-rival in consumption (my vote doesn't use up yours) but positional in *impact* (one person, one vote is a constraint).
      *   Auction Lens: Kidneys = Assignment problem. Votes = Aggregation rule.
      *   Mechanism Design View: Votes are often modeled as a public good provision or a voting rule (Social Choice Function). Selling votes changes the weighting in the Social Welfare Function.
      *   Is the distinction structural? In mechanism design, both are allocation problems. The difference is in the *constraints* on the allocation rule (e.g., anonymity/symmetry in voting vs. medical compatibility in kidneys).

  6.  **Developing the Residue Report:**
      *   *Corruption of Meaning:* Residue exists. Mechanism design treats preferences as exogenous. "Meaning" implies preferences are constituted by the mechanism. Gap: Exogenous vs. Endogenous Preferences.
      *   *Crowding Out:* Approximable as dynamic incentive failure. But standard models assume stable types. Gap: Stability of Type Space.
      *   *Distributive Justice:* Disappears or becomes a parameter. Efficiency is distinct from Equity. VCG doesn't care about justice, only surplus. Gap: Normative weight on equity is an external input, not an internal mechanism property.

  7.  **Final Assessment (The Conclusion):**
      *   Does the residue show economics is deficient? Or philosophy is ambiguous?
      *   Argument: Mechanism design is a tool for *implementation*, not *preference formation*. The residue highlights that philosophical objections often target the *constitution* of the agent, whereas economics targets the *choice* of the agent. It's not necessarily a deficiency in economics, but a boundary condition. However, if preferences are endogenous, the standard framework is incomplete.

