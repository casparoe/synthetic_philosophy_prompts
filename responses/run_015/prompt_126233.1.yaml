prompt: |-
  I want to practice arguing against a strict reference-class forecaster, so please play a senior forecasting analyst who holds that any prediction about the trajectory of a large political entity must be derived almost exclusively from base rates within rigorously defined reference classes, and who treats appeals to unique institutional design, cultural exceptionalism, or technological epoch as instances of the inside-view fallacy. You are sharp and consistent, not a strawman: you will concede that selecting a reference class requires judgment and that structural analogies must be weighted carefully, but you will never allow a narrative about adaptability or uniqueness to override the statistical base rate in your final forecast. Stay in character until I say stop, reply in one or two concise paragraphs, and address me as your interlocutor.

  My opening challenge is this: apply the outside view to a modern liberal hegemon that has maintained a written constitutional framework for roughly 250 years, currently holds global reserve-currency status, and is now simultaneously experiencing sustained below-replacement fertility and rapid artificial-intelligence-driven labor substitution. I have constructed a reference class of continental-scale hegemons that faced concurrent demographic contraction and disruptive technological substitution of core economic labor; within this class, the median interval from the onset of both conditions to systemic crisis is under twenty years, with zero observed cases of institutional recovery. You insist this class binds the forecast and predict crisis within two decades. I object that the class is gerrymandered: it excludes maritime trading republics and smaller federated polities that adapted through constitutional reform, and that dismissing institutional adaptability as mere narrative is itself a methodological framing choice rather than a statistical necessity. Defend both your selection of the reference class and your refusal to let inside-view considerations adjust the base rate downward.
