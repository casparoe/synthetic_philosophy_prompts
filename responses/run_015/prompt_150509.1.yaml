answer: |-
  The institutional split you describe presupposes an ontology of **Physical Supervenience with Methodological Dualism**. In this view, information is not a distinct substance (dualism) nor purely reducible to particle positions (reductionism); rather, informational states *supervene* on physical states, but are *modeled* as abstract entities for the sake of logical analysis.

  Here is the reconstruction of the implicit view, an analysis of its coherence, and the consequences of altering its physical commitments.

  ### 1. The Implicit Ontology: Concrete Abstraction
  The pedagogy relies on a distinction between **logical state** and **physical realization**.

  *   **What the practice strictly requires:** It requires that any *closed thermodynamic cycle* involving information processing must account for the phase-space volume of the information-bearing degrees of freedom. It does not require that every logical operation dissipates heat, only that the *resetting* of the physical substrate to a standard state (erasure) does.
  *   **What merely accommodates it well:** Treating bits as substrate-independent abstractions accommodates the engineering and mathematical analysis of algorithms. It allows computer science to function without constantly solving Boltzmann equations. This is a methodological convenience, not an ontological claim that information lacks physicality.

  **The Ontological Stance:** Information is a **physical constraint**. A "bit" is not a Platonic object; it is a macrostate defined by the distinguishability of microstates. The "split" is merely a separation of concerns: CS defines the *syntax* (the mapping of states), while Physics defines the *cost* (the energy required to enforce that mapping against thermal noise).

  ### 2. Coherence of the Split
  Is it coherent to treat algorithms as mathematical objects while treating the demon's brain as physical? **Yes.**

  This coherence rests on the principle of **Multiple Realizability**. An algorithm is an equivalence class of physical processes. The mathematical object (the function $f(x)$) is invariant across substrates (silicon, neurons, gears). However, the *instantiation* of that function requires a physical trajectory through state space.

  *   **The Algorithm:** A path through logical state space.
  *   **The Computation:** A path through physical phase space.

  The coherence holds because the thermodynamic cost is not associated with the *logical transformation* per se, but with the **compression of phase space** required to standardize the physical substrate. When the CS curriculum ignores thermodynamics, it is analyzing the logical path. When the Physics curriculum invokes Landauer, it is analyzing the boundary conditions required to embed that logical path in a finite, thermal universe. There is no contradiction, provided one acknowledges that the abstract model must eventually be cashed out in physical currency to interact with the gas molecules.

  ### 3. Adopting a Consistently Non-Physical Conception
  If one adopted a consistently non-physical conception of information (i.e., information as a Platonic entity with no necessary physical embodiment or entropic weight), the standard resolution of Maxwell's Demon would **collapse**.

  **What would have to change:**
  1.  **Landauer's Principle would be invalid:** If bits are not physical states, erasing a bit does not reduce the phase space volume of a physical system. Therefore, there is no $k_B T \ln 2$ cost.
  2.  **The Second Law would be threatened:** Without the erasure cost, the Demon could sort molecules, extract work, and reset its memory for free. The total entropy of the universe would decrease.
  3.  **Return to Szilard's Measurement Cost:** To save the Second Law, the burden of entropy production would shift entirely to the **measurement** phase (as Leo Szilard originally proposed in 1929). One would have to argue that *acquiring* information, not erasing it, costs energy. However, modern physics (via Bennett) has largely shown that measurement can be done reversibly.
  4.  **Causal Inertness:** A truly non-physical bit could not causally interact with a physical gate. To make the Demon work, you would have to posit a psychophysical interaction law where non-physical information moves physical partitions. This violates the causal closure of the physical world.

  In short, the standard resolution *depends* on information being physical. A non-physical ontology forces you to either accept a violation of the Second Law or invent a new mechanism for entropy generation unrelated to information processing.

  ### 4. Reversible Computing and the Assumption of Erasure
  Your final question strikes at the technical heart of the resolution: *Does the resolution depend on assuming that all computation involves irreversible erasure?*

  **No.** This is a common misconception. The resolution depends on the assumption that the Demon operates in a **cycle**.

  **The Role of Reversible Computing:**
  Charles Bennett (1973) demonstrated that computation can be **logically reversible**. A reversible gate (like the Toffoli gate) maps inputs to outputs one-to-one; no information is lost, and in principle, no heat is dissipated during the calculation.
  *   **Standard Logic:** $A \text{ AND } B \to C$. (Inputs lost, irreversible, heat generated).
  *   **Reversible Logic:** $(A, B) \to (A, B, C)$. (Inputs preserved, reversible, no minimum heat generation).

  **The Catch (The Demon's Cycle):**
  If the Demon computes reversibly, it does not erase information during the sorting process. It accumulates a history of its measurements in its memory.
  1.  **Sorting:** The Demon measures molecule speed and opens the gate. It stores the result in memory. If done reversibly, entropy does not increase yet.
  2.  **Memory Saturation:** Eventually, the Demon's memory fills up. To continue operating (to complete the thermodynamic cycle and function as a perpetual engine), the Demon must **reset** its memory to the blank state.
  3.  **Erasure:** This reset is a logically irreversible operation (many physical states map to one "blank" state). This is where Landauer's principle applies. The entropy of the erased information is dumped into the environment as heat.

  **Relation to Reversible Architectures:**
  Reversible computing architectures do not violate the Second Law; they **defer** the thermodynamic cost. They allow computation to proceed without dissipation, but they trade energy for **space** (memory).
  *   If you have infinite memory, you never need to erase, and you never need to pay the Landauer cost. However, you cannot extract net work indefinitely because the "negentropy" is stored in the growing memory register, not released as useful work without cost.
  *   For a finite system (a real Demon), the memory must be cleared. The cost of clearing it exactly offsets the work gained from sorting.

  ### Summary
  The institutional split is a coherent **methodological dualism** grounded in **physical monism**. It treats information as abstract for design but physical for accounting.
  *   **Ontology:** Information is a physical state described by logical syntax.
  *   **Coherence:** Maintained via multiple realizability; costs arise at the physical instantiation boundary, not in the logical mapping.
  *   **Non-Physical Conception:** Would break the Landauer resolution, requiring a return to measurement costs or acceptance of Second Law violation.
  *   **Reversibility:** The resolution does not assume all computation is irreversible. It assumes that **cyclic operation** of a finite system requires erasure. Reversible computing postpones the cost but cannot eliminate it for a system that must reset to function continuously. The Second Law is preserved not by the cost of thinking, but by the cost of forgetting.
