  *(Refining the "Institutional Split"):* It's not really a split in truth, but in *scope*. CS defines validity; Physics defines cost.

  *(Final check on Reversible Computing):* Bennett (1973) is the key reference. Reversible Turing Machines. The entropy is stored in the "garbage" bits. To reuse the machine, you must erase the garbage.

