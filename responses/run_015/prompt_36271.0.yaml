answer: |-
  Based on Maya's track record and her two specific verbal tics, here is the breakdown of her causal logic, predictions for your dinner cases, and the diagnostic test to pin her down.

  ### Part 1: Predictions for Cases A, B, and C

  **Case A: The Two Factories (Joint Necessity + Norms)**
  *   **Verdict:** Only **Factory 2 (the illegal dumper)** caused the fish kill.
  *   **Reasoning:** This is structurally identical to her **Match/Oxygen (Case 5)** verdict. Physically, both discharges were necessary conditions (INUS conditions) for the kill; if you "wiggled" either one, the fish would live. However, Maya prunes causes based on what is "supposed to happen." Factory 1 is operating within its permit (the normative default/background), while Factory 2 is deviating from the norm (illegal). Just as oxygen is a background condition and the match is the cause, the legal discharge is background and the illegal dump is the cause.

  **Case B: The Night Guard (Omission + Protocol)**
  *   **Verdict:** The **Guard did not cause the theft** (the author of the manual did).
  *   **Reasoning:** This tests her **Gardener (Case 4)** logic against her "Supposed to" tic. In Case 4, the gardener caused the death because he violated a specific duty (contract). Here, the guard *followed* his specific duty (the manual). Even though a patrol *would have* prevented the theft (counterfactual dependence exists), Maya will argue the guard was doing exactly "what was supposed to happen" by following protocol. The "abnormality" lies with the policy that forbade the patrol, not the guard who obeyed it. The "wiggle" (patrolling) is not a valid intervention because it violates the normative baseline of his job description.

  **Case C: The Pens and the Crash (Preemption + Norms)**
  *   **Verdict:** **Neither the Professor nor the Admin caused the problem** (the System Crash caused it).
  *   **Reasoning:** This is a trickier version of **Suzy/Billy (Case 2)**. In Case 2, Suzy caused the break because her rock *actually completed the process*. Here, the Professor's taking of the pen did *not* complete the process of the form failing; the System Crash did that independently and sufficient to guarantee the failure. Even though the Professor violated a norm (like the drunk driver in Case 1), Maya requires a causal link. Since the form would have failed anyway due to the crash, the pen-taking is causally inert (it's not even a preempted cause like Billy's rock; it's just irrelevant). The norm violation doesn't create causation out of thin air if the "wiggle" (returning the pen) wouldn't have changed the outcome.

  ---

  ### Part 2: The Rule She Is Running

  Maya is not a simple Counterfactual Dependence theorist (the "wiggle" test alone), nor is she a pure Process theorist. She is running a **Default-Relativized Causal Model** (closely aligned with the work of philosophers like Christopher Hitchcock or Joseph Halpern).

  Here is how her tics map to the theory:
  1.  **"Wiggling it" (Interventionism):** She uses this to establish *potential* causal relevance. If wiggling $X$ doesn't change $Y$ in *some* model, $X$ is out. But this is necessary, not sufficient.
  2.  **"What was supposed to happen" (Normative Pruning):** This sets the **Default Value** for variables in her model. A factor is only a candidate for "Cause" status if it represents a **deviation from the default**.

  **The Synthesis:**
  For Maya, $C$ causes $E$ if:
  1.  There is an active causal path from $C$ to $E$ (Process/Wiggle).
  2.  $C$ represents an **abnormal** occurrence relative to the context (Norms).
  3.  Background conditions (Oxygen, Legal Factory, Townspeople) are set to "Default" and are pruned from the causal list, even if they are physically necessary.

  **Is the "Wiggle" doing the real work?**
  No. The "Wiggle" is the engine, but the "Supposed to" is the steering wheel. Without the norm, she can't explain why the Townspeople (Case 4) or Oxygen (Case 5) aren't causes, as they pass the wiggle test (if townspeople watered, plants live; if no oxygen, no fire). The norm is what excludes them.

  ---

  ### Part 3: The Most Weighty Verdict

  **Case 4 (The Gardener)** carries the most weight.

  *   **Why:** Cases 1, 2, 3, and 5 can arguably be massaged into a physicalist or process-based account. You could claim she distinguishes Suzy from Billy based on physical contact, or Match from Oxygen based on energy transfer.
  *   **The Gardener Case:** Physically, the Gardener and the Townspeople are identical. Both omitted an action that would have saved the plants. Both pass the "wiggle" test (if either watered, plants live). The *only* difference is the contract (the norm). Because she splits the verdict here (Gardener = Cause, Townspeople = Not Cause), she commits herself to the view that **causation is not purely physical; it is sensitive to normative expectations.** This rules out pure Interventionism and pure Process theories.

  ---

  ### Part 4: The Diagnostic Test Case

  To cleanly split whether she prioritizes **Physical Overdetermination (Case 3)** or **Normative Pruning (Case 5)** when they conflict, present her with this case:

  **The "Authorized Arson" Case**
  > A building is scheduled for legal demolition tomorrow. The demolition team has planted explosives (Team A) that are set to blow at 9:00 AM. This is fully permitted and "what is supposed to happen."
  >
  > At 8:55 AM, an Arsonist (Person B) breaks in and sets a fire that is sufficient to destroy the building immediately. The building burns down at 8:58 AM.
  >
  > **Question:** Did the Arsonist cause the destruction? Did the Demolition Team cause the destruction?

  **Why this splits the rules:**
  *   **If she follows Case 3 (Lightning/Surge):** She should say **Both Caused It.** Physically, this is symmetric overdetermination. Both were sufficient processes ready to destroy the building. The fact that the fire happened 2 minutes earlier is a trivial timing detail similar to the lightning/surge simultaneity.
  *   **If she follows Case 5 (Match/Oxygen) & Case 4 (Gardener):** She should say **Only the Arsonist Caused It.** The Demolition Team's action was the "default/background" (it was supposed to happen, it was legal). The Arsonist was the "abnormal/deviant" intervention. Just as Oxygen (necessary background) isn't a cause, the permitted demolition (necessary background condition for the building's state) shouldn't count against the norm-violating arson.

  **Her Answer:**
  If she says **Only the Arsonist**, she is a consistent **Normative Pruner**.
  If she says **Both**, her **Physicalist Intuitions (Case 3)** override her Normative Tics when the physics is "loud" enough (overdetermination). Given her insurance job, I predict she will say **Only the Arsonist**, because liability hinges on the deviation from the expected course of events.
