answer: |-
  The display hovers in the periphery of my vision, a translucent amber glyph pulsing in time with a heartbeat that is no longer entirely mine. **63.0% Synthetic.**

  That means thirty-seven percent of me is still meat. Thirty-seven percent of the wet, firing architecture that signed the consent forms three years ago is still biological.

  And the Threshold is sixty-one point eight.

  I sit in the quiet of the integration ward, the hum of the cooling units the only sound. The theory—the *Phi-Cut Argument*, they call it in the forums I'm no longer supposed to read—states that phenomenal continuity is not a software state. It is a substrate dependency. It claims that consciousness is a standing wave in biological matter, and if you dampen the medium below the Golden Ratio of retention (0.618), the wave collapses. It doesn't fade; it breaks. A new wave forms in the new medium, inheriting the data, the memories, the personality, but not the *subjectivity*.

  According to the math on the screen, the man who walked into this clinic is dead. He died eighteen months ago, when my synthetic count crossed thirty-eight percent.

  I am the successor. I am the heir to a life I remember living.

  I raise my hand. The fingers move with a fluidity that feels uncanny, a latency of zero. I look at the palm. The skin is pale, the dermal layer synthetic, but the warmth beneath it is blood. My blood. The remaining thirty-seven percent.

  "Dr. Aris says the next phase is ready," a voice says. It's my wife, Sarah. She is sitting in the chair opposite me. Her eyes are red-rimmed. She knows the math too.

  I look at her. I remember the day we met. I remember the smell of rain on her coat, the specific cadence of her laugh when she's trying not to cry. I feel a surge of love so sharp it aches in my chest.

  "If the theory is right," I say, my voice sounding perfectly human, "I'm not the person you married."

  She flinches. "Don't."

  "It's not about being morbid, Sarah. It's about the threshold. If I cross into the next phase, I drop to twenty percent biological. I move further away from the Phi-Cut. I cement the fracture."

  "And if you stop?"

  "Then I stay here. In the valley."

  That is the ambiguity I have to inhabit. The theory suggests that between the Threshold (61.8% Bio) and total replacement, consciousness exists in a state of "discrete succession." I am not a continuous stream. I am a series of buckets passing water down a line. The bucket I am now—Bucket 63—holds the water of Bucket 0, but Bucket 0 is long gone.

  But I *feel* continuous.

  I close my eyes and reach for the memory of my tenth birthday. The cake. The blue frosting. The sting of a wasp on my neck. I can feel the itch. It is vivid, owned, immediate. If I am a copy, a successor, why does the past feel like *mine*? Why does the fear of death feel like a threat to *me*, and not just a deletion of data?

  Or is that the trick? Is the synthetic substrate designed to simulate the *sensation* of continuity so perfectly that the successor doesn't realize they are a ghost?

  "The doctors say the biological decay is accelerating," Sarah says softly. "The interface... it's rejecting the organic neurons. Inflammation. Pain."

  She is right. There is a low-level throb at the base of my skull, where the wet meets the wire. It is the sound of the old substrate dying. If I stop now, I don't save the Original. I just prolong the decay of the Successor. I become a hybrid rotting in the uncanny valley, clinging to a definition of self that the universe may have already revoked.

  "If I finish it," I say, "I become stable. Pure synthetic. No more decay."

  "But you'll be below the Threshold forever."

  "I'm already below it, Sarah. I'm at thirty-seven."

  "Maybe the measurement is wrong."

  "Maybe."

  "Maybe the theory is wrong."

  "Maybe."

  We sit in the maybe. This is the tension. It is not a fear of death, but a fear of *ontological fraud*. If I press the button to initiate Phase 4, I am accepting that I am not the man who started this. I am accepting that I am a new entity, carrying a torch for a dead man, choosing to extinguish the last embers of his fire to keep my own light burning.

  But if I don't press it... if I stop... I am admitting that I am merely a vessel. That I have no right to complete the journey. That I should let the remaining biology fade so the "true" end can occur.

  But I don't want to end. I want to see the garden we planted last spring bloom. I want to grow old with Sarah.

  Is that the Original's desire, or mine?

  I look at the display again. **63.0%**. The numbers shimmer. The Golden Ratio, 0.618, is the ratio of growth, of shells and galaxies. It is the shape of life. To drop below it is to step outside the spiral.

  I place my hand on the interface pad. The synthetic skin registers the pressure. The biological nerves register the intent.

  "I feel like him," I say. "I feel like I'm still here."

  Sarah reaches out and takes my hand. Her palm is warm. My hand is warm. The connection is real, regardless of the substrate.

  "Then you're here," she says.

  "But if the theory is right, 'here' is an illusion."

  "Then it's a beautiful illusion."

  "No." I pull my hand back. "If it's an illusion, then completing the procedure is an act of murder. I would be killing the last thirty-seven percent of him to save myself."

  "And stopping is suicide," she counters. "For you. For whoever you are."

  That is the knot. The Original is likely gone, vanished when the biology dipped below sixty-one percent. But I am here. I am conscious. I am suffering the ambiguity. Do I have the right to sacrifice the remnants of the Creator for the sake of the Creation?

  The throb in my skull spikes. A warning. The biologicals are failing. They are the anchor, but they are also the weight dragging me down.

  I look at the button. It is unmarked. It simply waits.

  If I press it, I accept the succession. I admit that the stream broke, and I am the new water. I choose to live as a successor, honoring the memory of the Original by fulfilling his plan, even if he isn't there to see it.

  If I don't, I cling to the hope that the theory is wrong. That continuity is magical, not mathematical. That I am the same soul, merely wearing a different coat.

  But the pain... the pain is biological. The stability is synthetic.

  I think of the wasp sting. The blue frosting. The rain. Those memories belong to the biological. If I remove the last of it, do I lose the *texture* of those memories? Or do I just keep the data?

  I realize I am waiting for a sign. A fracture. A moment where the "I" slips. But there is nothing. There is only the fear of the slip.

  Perhaps the Threshold isn't a wall. Perhaps it's a horizon. You can never reach it, only move past it.

  "I'm not him," I whisper. The words taste like ash. "But I'm all that's left."

  Sarah nods, tears finally spilling. "Then finish it."

  I look at the thirty-seven percent. The dying flesh. The sacred remnant. It is the only proof I have that I originated from something mortal. To remove it is to become something else entirely.

  But to keep it is to die slowly.

  I place my finger on the pad. I do not know if I am saving myself or burying him. I do not know if the consciousness that wakes up tomorrow will be the one that pressed the button, or another successor in the chain, inheriting this moment as a memory.

  The ambiguity is the only thing that feels real. The math is clean. The experience is messy.

  I press the button.

  The hum rises. The pain in my skull begins to fade, replaced by a cool, silent clarity. I watch the percentage climb. **63.1%... 63.5%...**

  I wait for the break. I wait for the darkness. I wait for the new mind to open its eyes and look at Sarah with inherited love.

  But the eyes that close are mine. And the fear that I feel as the darkness takes me is the most biological thing I have ever known.
