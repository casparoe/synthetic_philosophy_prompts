answer: |-
  1. Note on Framing

  Your suspicion is partially correct: in standard economic models, pure time preference is indeed the residual after accounting for extinction risk and marginal utility growth. However, this is not a mistake but the central philosophical problem. Defining it as a residual does not make it stipulative; it isolates the specific claim that time itself reduces value. The question works because it forces candidates to justify that residual rather than calculate it. If they treat the residual as zero, they must argue why; if nonzero, they must defend why temporal position matters morally. The framing is sound for forcing this justification.

  2. The Question

  **Course:** Long-Horizon Technical Decisions
  **Assessment:** Final Essay
  **Time Limit:** 30 Minutes
  **Expected Length:** 600–800 words
  **Total Marks:** 20

  **Scenario:**
  You are proposing a storage infrastructure project with a useful life of 50 years. The benefits accrue entirely at the end of that period. Your organization uses a constant discount rate of 5% per year to evaluate such investments. This observed rate is known to combine three distinct factors: (1) a pure preference for earlier benefits, (2) the annual probability that the system or beneficiary will cease to exist (hazard rate), and (3) the expectation that future beneficiaries will be wealthier, making additional resources less valuable to them (growth effect).

  **Essay Task:**
  Write a concise analysis addressing the following five points. You must conclude by taking a definite stand on whether a nonzero pure time preference is morally defensible.

  1.  **Decomposition:** Explain conceptually how these three factors contribute to the 5% rate. Which component represents a normative judgment rather than an empirical forecast?
  2.  **Diagnostic:** Suppose the hazard rate is 5% and the other factors are zero. Alternatively, suppose the hazard is zero and the pure preference is 5%. How would you distinguish these cases in principle? Specifically, should the valuation of the benefit change if you learn midway through that the system has survived?
  3.  **Double Counting:** Suppose spending money now reduces the hazard rate. If you discount the future benefit by the hazard rate, do you also discount the value of the risk reduction itself by that same rate? Explain the correct treatment to avoid circularity.
  4.  **Normative Defense:** Assume hazard and growth are zero. Is the remaining preference for earlier benefits defensible? Compare temporal distance to spatial distance. Address the objection that agents experience time sequentially but space simultaneously. Distinguish between preferring good years early in a single life versus preferring benefits for earlier generations.
  5.  **Scale Sensitivity:** What implies does a constant positive rate have for benefits occurring 1,000 years hence? Is this a reductio ad absurdum or an acceptable implication?

  *Note: Do not use formulas. Define any technical terms you introduce. Argumentative hedging will be penalized.*

  3. Model Answer

  An observed discount rate is a composite metric masking distinct underlying realities. The 5% rate decomposes into three parts. First, the hazard rate reflects the probability that the beneficiary or system will not exist to consume the benefit. Second, the growth effect accounts for diminishing marginal utility; if future engineers are richer, one unit of compute is worth less to them. Third, pure time preference values a benefit less solely because it occurs later. Only the third component is a normative judgment. The first two are empirical claims about survival and wealth. Treating them identically in a single rate risks conflating what *will* happen with what *ought* to be valued.

  Distinguishing hazard from pure preference requires a diagnostic test based on conditional valuation. If the 5% discount is entirely due to a 5% annual hazard risk, the value of the benefit should not drop simply because time passes, provided the system survives. If I learn at year 25 that the system is intact, the probability of survival to year 50 updates, and the discounted value should jump up accordingly. However, if the 5% is pure time preference, the value continues to decay simply because the remaining wait is shorter but still positive. A pure time preferencer values the benefit less at year 25 than at year 0, even conditional on survival. A risk-discounter values it more at year 25 than at year 0, conditional on survival, because the remaining risk exposure is lower. This jump upon survival is the decisive diagnostic.

  Double counting arises when interventions modify the hazard rate. If we discount the future benefit by the probability of loss, we are calculating an expected value. If we then evaluate a safety investment by discounting its benefit (risk reduction) by the same hazard rate, we devalue the very thing that prevents the devaluation. The correct treatment is to calculate the expected value of the project with and without the intervention. You do not apply the discount rate to the risk reduction itself. You compare the expected outcome of spending versus not spending. Discounting the benefit of risk reduction by the risk it prevents is circular; it treats the risk as both inevitable and avoidable simultaneously.

  When hazard and growth are switched off, any remaining discount rate is a pure preference for temporal proximity. This is difficult to defend. Morally, temporal position resembles spatial position. We do not argue that suffering in a distant country matters less simply because it is far away in space. Why should distance in time matter more? The standard objection is that agents traverse time sequentially, whereas we can move freely in space. We anticipate the future and remember the past, creating a psychological asymmetry. However, psychological immediacy is not moral relevance. A future person's suffering is real to them, regardless of my current inability to feel it.

  There is a distinction between intra-personal and inter-generational cases. Within a single life, preferring good years early might be rational planning for decline, or a preference for the shape of a life (relief over anxiety). But between different generations, there is no single subject experiencing the sequence. Preferring current engineers over future engineers solely based on birth date is arbitrary discrimination.

  Finally, scale sensitivity reveals the tyranny of the exponent. A constant 5% rate reduces a benefit 1,000 years away to effectively zero value. This implies we should sacrifice nothing now to prevent catastrophic harm in the distant future. This is a reductio ad absurdum. It licenses moral negligence on a civilizational scale. Therefore, pure time preference must be zero. We should discount for risk and growth, but never for time itself. To do otherwise is to declare the future morally vacant.

  4. Marking Scheme

  **Total Marks: 20**

  **1. Decomposition (4 Marks)**
  *   **4:** Clearly distinguishes hazard (empirical survival), growth (empirical wealth/utility), and pure preference (normative time value). Identifies pure preference as the only normative judgment.
  *   **2:** Identifies the three parts but treats all as empirical or fails to isolate the normative component.
  *   **0:** Recites a formula (e.g., Ramsey rule) without explanation, or claims all discounting is rational/irrational without distinction.
  *   *Common Error:* Claiming growth is a normative choice rather than a forecast of wealth.

  **2. Diagnostic (4 Marks)**
  *   **4:** Explains that conditional on survival, risk-based discounting value should rise (jump) as time passes, while pure preference value continues to fall.
  *   **2:** States they are different but fails to explain the "jump" or conditional valuation mechanism.
  *   **0:** Claims there is no way to distinguish them, or conflates probability of existence with value of existence.
  *   *Common Error:* Saying "risk is real, preference is fake" without explaining the valuation behavior.

  **3. Double Counting (4 Marks)**
  *   **4:** Explains that risk reduction must be evaluated via expected value comparison (with vs. without intervention), not by discounting the benefit of risk reduction by the risk itself. Identifies circularity.
  *   **2:** Says "don't double count" but suggests discounting the cost instead, or gives vague advice about being careful.
  *   **0:** Suggests applying the discount rate to the safety investment's payoff.
  *   *Common Error:* Suggesting you discount the cost of the fix rather than the benefit of the risk reduction.

  **4. Normative Defense (4 Marks)**
  *   **4:** Compares time to space (distance objection). Addresses the sequential experience objection. Distinguishes same-person (life shape) vs. different-person (arbitrary discrimination) cases.
  *   **2:** Makes the time/space comparison but ignores the sequential experience objection or the person distinction.
  *   **0:** Asserts "time is money" or "future matters less" without argument, or ignores the prompt's specific objections.
  *   *Common Error:* Arguing that future people don't exist yet, so they have no rights (fails the different-person test).

  **5. Scale Sensitivity & Stand (4 Marks)**
  *   **4:** Notes that constant positive rate drives far-future value to near-zero. Explicitly takes a stand (e.g., "This is absurd, so rate must be zero" OR "This is acceptable because..."). Defends stand against strongest counter-argument.
  *   **2:** Notes the scale issue but hedges on the conclusion (e.g., "It depends on the context").
  *   **0:** Ignores the 1,000-year implication or fails to take a definite stand.
  *   *Common Error:* Saying "We should use a lower rate" without addressing the structural implication of *any* constant positive rate.

  **Zero-Score Condition:**
  Answers that solely define discounting, recite financial formulas, or conclude that "discounting is standard practice so it is correct" without engaging the normative arguments will score 0.

  5. Boundary Note

  **First-Class (17–20 marks):** Integrates all five points into a coherent argument. The diagnostic test is explained precisely (the valuation jump). The stand is decisive and defended against a self-constructed objection.
  **Upper-Second (14–16 marks):** Covers all five points but treats them as a checklist. The diagnostic or double-counting explanation may be slightly vague. The stand is present but weakly defended.
