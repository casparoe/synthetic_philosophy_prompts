  **Scenario**

  In 1934, the Oakhaven textile strike ended in bloodshed. The local Union Trust holds a parcel containing the mass grave, deeded explicitly "to perpetuate the memory of the fifteen workers murdered by company gunmen at the Main Gate." For ninety years, the community has commemorated this specific narrative. New forensic excavation and ballistics confirm the record: fourteen workers and one company guard (misidentified in the chaos) were killed by National Guard rifles at the Side Gate. The Trust's legal counsel advises that officially amending the memorial's inscription to match these facts constitutes a breach of the deed's specific conditions, triggering a reversion clause that returns the land to the manufacturer's heirs, who intend to develop the site immediately, destroying the grave and any remaining physical evidence. The Commemoration Committee must decide whether to update the plaque this year.

  **Analysis of Views**

  1.  **Record-first:** Keep the false memory. This view prioritizes the survival of evidence and the eventual belief of true things. Since the documentary record is already secure (the forensic work is done), the immediate priority is preserving the physical site, which contains irreplaceable contextual evidence (soil samples, spatial arrangement) that cannot be fully archived before demolition. Correcting the plaque now triggers the reversion clause, destroying the site and closing off future verification. Therefore, the memory must remain false temporarily to protect the conditions that allow evidence to survive.
  2.  **Memory-constitutive:** Keep the false memory. This view holds that the narrative of "Fifteen Workers/Main Gate" is not a claim about the past but a constituent element of the Union's present identity and obligations. The specific number and enemy define the community's moral lineage. Revising the story to include a guard or exonerate the company dissolves the specific sacrificial bond that holds the membership together. The record is irrelevant because the memory's function is cohesion, not description.
  3.  **Custodial:** Correct the memory. This view sees the community as a fiduciary holding the past in trust for the people who lived it (the dead). The entrustment came from the workers' families, designating this space for *workers*. Including a company guard in the count misappropriates the memorial resource; it places a non-beneficiary into a trust meant for victims. Fidelity to the entrustors requires honoring their specific claims, not preserving the container (the land) or the community's identity. If maintaining the trust terms requires losing the land, so be it; the duty is to the dead, not the site.

  **The Single Feature**

  The driving feature is the **reversion clause linking narrative fidelity to physical preservation**. This threat forces the Record-first view to prioritize evidence survival over immediate correction; without it, Record-first would demand updating the plaque to align with the settled record, collapsing the verdict into a 2-1 split (Record and Custodial vs. Memory). The clause creates a tension between *knowing* the truth and *keeping* the evidence, which Record-first resolves by delaying correction, while Custodial resolves by honoring the entrustment regardless of material loss.

  **Objection from a Hardline Record-First View**

  A hardline Record-first advocate would argue this is epistemic cowardice: truth should not be held hostage by real estate deals. They would contend that the forensic data is already "best available evidence," so the site's destruction is secondary; preserving a lie undermines the credibility of the record-keepers and risks contaminating future historical understanding. This attack lands only if the physical site offers no additional evidentiary value beyond the current forensic report. If the grave contains unrecoverable context (e.g., stratigraphy that confirms the timeline), the Record-first verdict holds; if the data is fully extracted, the objection succeeds, and Record-first should align with Custodial in demanding correction.
