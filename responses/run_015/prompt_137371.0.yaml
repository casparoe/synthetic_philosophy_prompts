answer: |-
  # Artifact: The Calibrated Intuition Test

  ## 1. Overview & Philosophical Commitment
  **The Goal:** To induce a felt distinction between *reliability* (the report matches the fact) and *justification* (the report tracks the fact *because* of the experience).
  **The Commitment:** In the debrief, you must press **Counterfactual Insensitivity** as the decisive horn.
  *   **Why:** The "Common Cause" reply (Physical State causes both Experience and Judgment) saves *Reliability*. Students will cling to this. You must show that Reliability is insufficient for Knowledge. If the Experience were absent (conceptually), the Judgment would remain unchanged because it is driven by the Physical State. Therefore, the Judgment is *insensitive* to the Experience.
  *   **Why the others fail:**
      *   *Causal Exclusion:* Students will simply assert Identity Theory ("The experience *is* the brain state"). This stalls the seminar.
      *   *Loss of First-Person Method:* Too abstract. Students will claim the "feeling" of agency is enough.
      *   *Insensitivity:* This attacks the definition of knowledge directly. It forces them to admit that a true belief generated by a process that *ignores* the truth-maker is merely lucky, even if it's always true.

  ## 2. Materials
  *   **12 Envelopes**, labeled "Subject Kit."
  *   **Inside each Kit:**
      *   1 Stimulus Card (Red or Blue side up, sealed in a sub-envelope).
      *   3 Report Slips (labeled Round 1, Round 2, Round 3).
      *   10 Betting Chips (distinct color).
      *   1 "Banker's Ledger" (a simple scorecard).
  *   **Instructor Props:**
      *   A "Master Deck" of 12 cards (matching the Stimulus Cards).
      *   A box for collecting Report Slips.
      *   Whiteboard for tallying bets.

  ## 3. Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:05** | **Briefing** | Distribute Kits. Explain the "Intuition Calibration" fiction. No mention of epiphenomenalism. |
  | **00:05 – 00:15** | **Round 1 (Direct)** | Standard Stimulus -> Report. Establishes baseline agency. |
  | **00:15 – 00:25** | **Round 2 (Common Cause)** | The "Assisted" Round. Mechanism introduced secretly. |
  | **00:25 – 00:35** | **Round 3 (Severed)** | The "Glitch." Mechanism runs dry. |
  | **00:35 – 00:50** | **The Wager** | Betting round on justification, not truth. |
  | **00:50 – 01:15** | **Reveal & Debrief** | The philosophical mapping and argument. |

  ## 4. Rules & Procedure

  ### The Fiction
  Tell the students: *"We are testing a new protocol for measuring 'Phenomenal Accuracy.' You will receive a private stimulus. You will produce a public report. We are measuring not just if you are right, but if your report counts as 'Calibrated Knowledge.'"*

  ### Round 1: Direct Causation (10 mins)
  1.  Students open the **Stimulus Sub-Envelope**. They see a color (Red/Blue).
  2.  Instruct them: *"Attend to the qualitative character of the color. Let that experience drive your hand."*
  3.  They write "RED" or "BLUE" on **Report Slip 1**.
  4.  Collect Slips. Reveal the Master Deck. Show 100% accuracy.
  5.  **Status:** Experience causes Judgment. (Physicalism).

  ### Round 2: The Common Cause (10 mins)
  1.  Instruct: *"For Round 2, the system will provide a 'Haptic Cue' to assist calibration."*
  2.  **The Trick:** Do not let them open the Stimulus Envelope yet. Instead, hand them a **Pre-Printed Slip 2** that *already has* "RED" or "BLUE" written on it (matching their Stimulus).
  3.  Instruct: *"Verify that this slip matches your internal state. If it feels correct, sign it. If not, cross it out."*
  4.  **Crucial:** Because the Pre-Printed Slip matches the Stimulus (which they are about to see or have seen in Round 1), they will almost never cross it out. They will sign it, believing their "verification" (Experience) caused the retention of the judgment.
  5.  **Reality:** The Stimulus caused the Pre-Printed Slip (via you). The Stimulus caused the Experience. The Experience did *not* cause the Slip.
  6.  **Status:** Common Cause (Epiphenomenal Structure).

  ### Round 3: The Severing (10 mins)
  1.  Instruct: *"Round 3. System Optimization Mode."*
  2.  Hand them **Pre-Printed Slip 3**.
  3.  **The Trick:** These slips are **Random** (50/50), unrelated to their Stimulus.
  4.  They sign/verify as before.
  5.  Collect Slips. Reveal Master Deck. Show ~50% accuracy.
  6.  **Status:** Severed Link (Zombie/Luck).

  ## 5. The Wager (15 mins)
  *Do not reveal the trick yet.*

  1.  Return **Report Slip 2** to the students (keep Slip 1 and 3).
  2.  **The Proposition:** *"In Round 2, your report was 100% accurate. However, the mechanism of production has changed. You now have the option to wager chips on the following claim:*
      *   **Claim A:** 'In Round 2, I **KNEW** the color.' (Wager pays 1:1 if group agrees).
      *   **Claim B:** 'In Round 2, I was **GUESSING** (even if right).' (Wager pays 1:1 if group agrees).
  3.  **The Twist:** The payout is determined by **Majority Vote**, but the *value* of the chips depends on the **Mechanism**.
  4.  Ask: *"Raise your hand if you would bet your entire chip stack that Round 2 constitutes Knowledge."*
  5.  Record the number. (Predictably, it will drop significantly compared to Round 1, even though accuracy was identical).
  6.  Ask a dissenting student: *"It was 100% true. Why won't you bet on it?"*
      *   *Target Answer:* "Because I didn't *make* the report." or "Because it could have been wrong if the system glitched."

  ## 6. The Reveal (5 mins)
  *Stand at the front. Do not sit.*

  **Script:**
  *"Look at your Round 2 Slip. You signed it. You verified it. You believed it matched your experience. But I wrote that text before you entered the room. The color of the card in your envelope caused me to print that slip. The color of the card in your envelope caused your experience. But your experience did not cause that text.*

  *You have just lived the structure of Epiphenomenalism. In Round 1, your pain made you say 'ouch.' In Round 2, the nerve firing made the pain, and the nerve firing made the 'ouch,' but the pain itself was a shadow. It played no role.*

  *Now, look at your betting behavior. In Round 1, you would have bet your life on your knowledge. In Round 2, with identical accuracy, you hesitated. Why? If reliability were enough for knowledge, Round 2 should feel identical to Round 1. It does not."*

  ## 7. Debrief Map (25 mins)

  ### Mapping the Moments
  1.  **Round 1 (Direct):** Standard Physicalism. $P \to E \to J$ (Physical state causes Experience causes Judgment).
  2.  **Round 2 (Common Cause):** Epiphenomenalism. $P \to E$ and $P \to J$. (Physical state causes Experience; Physical state causes Judgment).
      *   *Student Intuition:* "But they match! So I know it!"
      *   *The Wager Result:* Shows they don't actually believe matching is enough.
  3.  **Round 3 (Severed):** Skeptical Scenario. $P \to E$ and $Random \to J$.
      *   *Function:* Shows that without *any* link, knowledge vanishes. Round 2 is philosophically closer to Round 3 than Round 1, despite the accuracy.

  ### Addressing Predicted Failures

  **Failure 1: "It's just a trick about the Instructor."**
  *   *Student Objection:* "I didn't know *you* wrote it. If my brain wrote it, it's fine."
  *   *Response:* "The Instructor is just standing in for the 'Physical Law.' In the game, I am the Physics. If the Physics guarantees the match without consulting the Experience, the Experience is decorative. Does decoration justify knowledge?"

  **Failure 2: "But the Brain State causes both, so it's not luck." (The Common Cause Defense)**
  *   *This is the main battle.*
  *   *Response:* Press the **Counterfactual Insensitivity** horn.
  *   *Argument:* "In Round 2, suppose your Experience had been different (conceptually), but the Brain State stayed the same. Would your Report have changed? No. The Report was fixed by the Brain State (me). Therefore, your Report does not *track* your Experience. It tracks the Brain State. You claim to know your *Experience*, not the Brain State. If the report doesn't change when the experience changes, you don't know the experience."

  **Failure 3: Logistics (Students peeking/colluding).**
  *   *Mitigation:* If a student admits they saw the pre-printed slip early, use it. "Exactly. You realized the causal chain was bypassed. That feeling of 'Wait, I didn't do this' is the philosophical objection manifesting."

  ### Limitations (Be Frank)
  *   **Qualia Surrogate:** Acknowledge that a Red Card is not Pain. The game simulates the *structure* of causation, not the *feeling* of qualia.
  *   **Agency:** In the game, the Instructor overrides agency. In the mind, Physics overrides agency. The feeling of "I did it" is the illusion in both cases.
  *   **The Gap:** You cannot make them *feel* epiphenomenalism in their own minds (because if it were true, they couldn't report it). You can only make them feel the *loss of justification* when the causal link is removed.

  ## 8. Instructor Notes for the "Kill Shot"
  When a student says, *"But if the physical state causes the judgment, the judgment is reliable, so I know it,"* you must reply:

  *"Reliability is not Knowledge. Imagine a thermometer that is glued to the wall next to the window. It always reads the correct temperature because I manually adjust it to match the outside weather every morning. It is 100% reliable. Does the thermometer **know** the temperature? No. It has no sensitivity to the temperature itself. It only has sensitivity to me.*

  *In Round 2, you were the thermometer. I was the Physics. Your Experience was the weather. You were right, but you were glued. That is why you wouldn't bet."*

  ## 9. Payoff Scheme
  *   **Participation:** Everyone gets 5 chips just for playing.
  *   **Wager:**
      *   If they bet on **Knowledge** in Round 2: They lose the chips (because the reveal shows they didn't know).
      *   If they bet on **Guessing** in Round 2: They double their chips.
  *   **Why:** This punishes the "Common Cause" intuition financially (symbolically). It reinforces that *accuracy without the right causal path is not knowledge*.

  ---

  ### Final Check on the Commitment
  You asked me to commit. I am committing to **Counterfactual Insensitivity**.
  *   **Exclusion** is too easy to dodge with Identity Theory.
  *   **First-Person Method** is too subjective.
  *   **Insensitivity** is the structural flaw that the Betting Round exposes. The students *felt* the insensitivity when they hesitated to bet on Round 2. They knew that even if the report was true, it wasn't *responsive* to the truth in the right way. That is the self-stultifying core: If epiphenomenalism is true, our judgments about our minds are like the glued thermometer—accurate, but blind.
