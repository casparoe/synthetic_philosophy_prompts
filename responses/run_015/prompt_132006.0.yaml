answer: |-
  Subject: Re: Stress-testing the Present Tense Rule

  I appreciate the elegance of the Present Tense Rule because it tries to dissolve logical knots by treating them as engineering problems of sequencing, which fits the computational nature of an online game better than abstract legal theory does. However, when you ask for a concrete sequence of moves that bypasses your prohibition on reach-back while still generating a contradiction, the vulnerability lies not in self-reference but in simultaneity and the definition of completion itself. Imagine your game engine batches proposals and resolves them at the same timestamp, which is common in online implementations to prevent voting manipulation. Suppose the current rule sets the voting threshold at fifty percent. Two proposals close at the exact same instant. Proposal A says the threshold is now fifty percent. Proposal B says the threshold is now seventy-five percent. Both receive sixty percent support. Under your rule, both complete enactment simultaneously. Proposal A takes effect immediately, maintaining the status quo. Proposal B takes effect immediately, raising the bar. You now have two active rules defining the same procedure differently. Your rule says a rule takes effect when enactment is complete, but it does not provide a tie-breaking mechanism for when two enactments complete at the same time. If the system treats them as simultaneous, you have a state where the threshold is both fifty and seventy-five, which is a contradiction that your temporal fix cannot resolve because there is no temporal sequence to leverage. This is merely awkward if you can force serial resolution in the code, but it becomes fatal if the game logic allows parallel processing, because the Present Tense Rule relies on a strict ordering of time that the game engine might not guarantee.

  This leads directly into your second worry about smuggling in a stable notion of time, which I think is the more dangerous philosophical flaw. For your rule to function, the moment of enactment completion must be an objective fact that exists outside the rule set itself. If the rules define when enactment is complete, say by stating a vote ends when the administrator posts the result, then a new rule could change that definition to say a vote ends when the timer hits zero. If that new rule passes, did it complete enactment when the timer hit zero or when the admin posted? If you say it completed when the timer hit zero, you are allowing the rule to define the conditions of its own validity, which violates your second clause. If you say it completed when the admin posted, you are relying on a meta-rule about time that is immune to the game's rules. This means the Present Tense Rule cannot be just another rule in the set; it has to be a constraint on the game engine itself. If it is just Rule 1, it can be amended or repealed. If it can be repealed, then your solution is only temporary, and the paradoxes are merely suppressed, not dissolved. If it cannot be repealed, then you have reintroduced the unamendable rule you sought to eliminate. I would rank this as fatal to the claim that you have solved the logical problem, because you have simply shifted the unamendable core from a substantive rule to a procedural meta-rule. You haven't removed the hierarchy; you've hidden it in the timestamp.

  When you look at real legal orders, the evidence actually cuts against the no-reach-back picture, which suggests your rule might be solving a problem that legal systems manage differently. Courts frequently uphold unconstitutional constitutional amendments through doctrines of ratification or revolutionary legality, effectively allowing the present to validate the past. For example, if a legislature passes an amendment using the wrong procedure, but everyone acts as if it is valid for years, courts will often rule that the amendment is valid to preserve stability. This is explicit reach-back. The present state of affairs rewrites the validity of the past enactment. Your rule forbids this strictly, which makes your game more rigid than actual legal systems. Real systems tolerate the ambiguity you are trying to kill because they prioritize political settlement over logical consistency. Eternity clauses in constitutions like the German Basic Law are another counter-example. They assert that certain rules cannot be amended, ever. If a later amendment tries to repeal an eternity clause, real courts often strike down the later amendment based on hierarchy, not time. Your rule implies that the later amendment should win because it takes effect when complete, and its enactment conditions were met under the previous rules. This creates a divergence where your rule predicts the amendment passes, but standard legal theory predicts it fails. This isn't necessarily a bug for a game, but it means your rule is making a substantive choice about sovereignty rather than just fixing a logical glitch.

  Comparing your approach to the standard fix of priority orders shows where your rule might give opposite answers. The standard fix says some rules are higher than others, so a lower rule cannot contradict a higher one regardless of timing. Your rule says later rules override earlier ones regardless of content. Suppose you have a rule that says it cannot be repealed, and a later rule repeals it. The priority view says the repeal is invalid. Your view says the repeal is valid because the later rule's enactment was complete under the old rules, and the old rule's unamendability is just a substantive claim that the new rule overrides. This means your system cannot support true entrenchment, only procedural hurdles. If you want to allow players to create protected rules, your system fails. If you don't, then your system is functionally different from a hierarchical one. I would rank this as a real cost if you want deep constitutionalism in your game, but wave-offable if you want a fluid, fast-moving game where nothing is sacred. The cost is that you lose the ability to model stable constitutions, but the benefit is you avoid the deadlock of conflicting hierarchies.

  My honest verdict on whether you have qualified the view into something that cannot lose is that you are dangerously close to tautology. If you define valid enactment as enactment that does not violate the Present Tense Rule, then the rule is unfalsifiable by definition. Any paradox that arises is dismissed as an invalid enactment, which means the rule never fails, but it also never predicts anything beyond its own consistency. To avoid this, you need an external clock and an external judge to determine when enactment is complete, independent of the rules. If you have that, the rule works, but it is no longer a solution internal to the game logic; it is a constraint imposed by the platform. If you try to encode the clock into the rules, you reopen the door to the very self-reference paradoxes you are trying to close. So the view holds only if you accept that the game requires a meta-game authority that is not subject to the rules. That is a fine position to take for a game master, but it means you haven't solved the paradox of self-amendment; you have just solved it by stepping outside the system. I think you should concede that the rule requires an unamendable meta-structure to function, which is the real cost, but you can wave off the loss of entrenchment as a design choice favoring fluidity over stability.
