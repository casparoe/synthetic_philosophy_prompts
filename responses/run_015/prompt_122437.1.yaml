answer: |-
  **Brainstorm: Features of Intuition-Pump Practice to Exaggerate**

  *   **The Incidental/Constitutive Shuffle:** Philosophers often claim a detail is "incidental" until the intuition shifts, at which point it becomes "constitutive" to save the theory. *Why real:* This is the standard move to protect reflective equilibrium from counter-examples.
  *   **The Vividness Crutch:** Cases rely on emotional imagery (children, levers) rather than logical structure. *Why real:* Strip the story to abstract variables and the "intuition" often vanishes, yet the argument stands.
  *   **Weaponised Symmetry:** Thought experiments are used to attack opponents, rarely to test one's own view. *Why real:* Dialectical asymmetry is endemic; we pump intuitions against rivals, not ourselves.
  *   **The Canon Immunity:** Famous cases (trolleys, etc.) are exempt from methodological scrutiny despite failing modern standards. *Why real:* Canonical status grants immunity from criticism that would destroy a new paper's case.
  *   **The "Folk" Sample:** Reliance on undergraduates as proxies for universal human intuition. *Why real:* "First-years" are the de facto calibration standard for moral psychology.

  ***

  **BS 8801-3:2025**
  **Intuition pumps — Part 3: Specification for inference-tight cases**

  **Scope**
  This document specifies requirements for the design, calibration, and deployment of intuition pumps used in ethical and metaphysical discourse. It applies to all cases involving trolleys, rooms, planets, or attached musicians. It does not cover order-of-presentation effects, which are deemed outside the scope of rational agency.

  **Normative References**
  The following documents are referred to in the text in such a way that some or all of their content constitutes requirements of this document.
  BS 6942 (Withdrawn): *Guidelines for Moral Geometry.*
  ISO 2074 (In Preparation): *Standardisation of Hypothetical Violence.*
  The Cotswold Working Party Report (1974): *On the Vagueness of 'Person'.*

  **3. Confidence-to-Work Ratio**
  The manufacturer shall declare the Ratio of Verdict Confidence (RVC) to Argumentative Work Performed (AWP). The permissible inference leakage shall not exceed 15% per 1,000 words of setup. Where leakage exceeds tolerance, the manufacturer shall attribute the loss to "complexity" rather than "contradiction".

  **4. Inversion Clause**
  4.1 The pump shall return the same verdict when any incidental detail is inverted (e.g., the sex of the bystander, whether the lever is a lever, whether it is a child).
  4.2 Where inversion alters the verdict, the manufacturer shall reclassify the detail as constitutive rather than incidental. No independent test for constitutivity is required.

  **5. Calibration**
  5.1 The pump shall be trialled on thirty first-year undergraduates and on the author's own department.
  5.2 The author shall sign a statement confirming they would have reached the same verdict had the case come out the other way. Failure to sign constitutes admission of bias.

  **6. Hermeticity Test**
  6.1 The case shall be rewritten in flat, abstract language (e.g., "Agent A pushes Object B").
  6.2 If the intuition evaporates during this process, the pump shall be deemed to have failed due to excessive narrative lubrication.

  **7. Dialectical Symmetry**
  7.1 The pump shall be deployed against its holder's own view as often as against rivals.
  *Note:* No pump has ever been certified under this clause.

  **Annex A (Normative): Declaration of Load-Bearing Incidentals**
  The manufacturer must complete Form LP-9, which asks: "Which details are doing the work?" This form is itself a thought experiment designed to induce confusion regarding the distinction between form and content.

  **Annex B (Informative): Grandfathering Schedule**
  All pumps published prior to 1980 are exempt from Clauses 3, 4, 5, and 6. This exempts essentially every pump anyone actually uses.

  **Appendix: Correspondence from Users**

  **Letter 1**
  *Complaint:* Verdicts reverse depending on whether the case is presented before or after the theory.
  *Committee Reply:* The Standard specifies case integrity, not temporal sequencing. Please resubmit.

  **Letter 2**
  *Complaint:* Intuition flips when the side effect changes from 'harm' to 'benefit', despite structural identity.
  *Committee Reply:* Harm and benefit are distinct categories under BS 6942 (Withdrawn). No violation detected.

  **Letter 3**
  *Complaint:* The pump only works on theories held by people not in the room.
  *Committee Reply:* This indicates high portability. The Standard encourages exportability.

  **Closing Note**
  Issued for public comment; comments invited from persons who have independently arrived at the verdict the pump was designed to produce.

  © BSI Standards Limited 2025. Price £120.00.
