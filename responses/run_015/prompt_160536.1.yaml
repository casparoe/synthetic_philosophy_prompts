prompt: |-
  I sit on a hospital's therapeutics committee as its non-clinical member, and at our last meeting two of the clinicians — Marcus and Lena — spent most of an hour arguing about a proposal I now have to summarise in a memo, and I genuinely cannot tell who won. The proposal is this: formulary decisions (whether to adopt a proposed treatment protocol) are currently made by one senior clinical pharmacologist, whom a retrospective audit of the last few hundred cases puts at roughly 75% correct against our reconstructed gold standard; a working group wants to replace her with the majority verdict of a 15-member panel drawn from a rotating pool of generalist clinicians, each of whom the same audit puts at roughly 60% on comparable judgments. My own decision theory is about fifteen years stale, so I'd like the argument adjudicated rather than summarised back to me.

  Here is roughly how it went. (1) Marcus opened with the Condorcet jury theorem: at p = 0.6, a majority of fifteen is right a shade under 79% of the time, which beats the pharmacologist's 75%, and it keeps improving as you add members, whereas a single reviewer's number is a fixed ceiling — with forty-one panelists you'd be above 90% — and a single decision-maker is also a single point of failure (capture, a bad year, an idiosyncratic dogmatism about a drug class). (2) Lena said the independence assumption is doing all of the work: the panelists read the same dossier, the same evidence review, share a training and a set of professional habits, and talk in the corridor, so their errors are correlated; if the effective number of independent votes is closer to three, a majority of three gets you about 65%, well below the pharmacologist. She added that the assumption is really independence conditional on the truth of the matter, and that a shared signal which is merely noisy — right most of the time but not always — is precisely what makes votes co-vary within the set of cases where the truth goes one way rather than the other. (3) Marcus replied that the conditional formulation cuts his way too: if the shared dossier is highly reliable, conditioning on it is nearly conditioning on the truth and independence is nearly intact, so what breaks the theorem is shared-but-noisy evidence, which is a design problem — split the fifteen into three sub-panels of five, commission a separate evidence summary for each, and decide by majority of the three sub-panel verdicts. (4) Lena answered that you cannot manufacture independent summaries of one fixed body of trial data — re-commissioning or rewriting the same evidence yields correlated summaries, so the sub-panel structure is cosmetic unless you change the information rather than the packaging, since what buys reliability is redundancy of evidence channels, not redundancy of heads; that in any case, under the very independence assumption he is leaning on, the hierarchy costs accuracy, because each five-person sub-panel is right about 68% of the time and a majority of three of those is about 76%, a bit below the flat fifteen-person majority; and that the 60% is a reference-class average, whereas the items that actually reach a vote are the contested ones, where everyone's competence degrades — and the theorem has a flip side, so that if effective competence dips below 0.5, majority voting becomes worse than useless. (5) Marcus conceded the agenda point but said it is an argument about the decision rule, not about the decision-maker: since adopting an ineffective or harmful protocol is considerably worse than delaying an effective one, the panel should be run under a supermajority rule — say ten of fifteen, with a default to "do not adopt" — and a panel's threshold is a tunable dial in a way that a single reviewer's judgment is not. (6) Lena closed by saying a single reviewer's threshold is tunable too: you ask for her confidence, she can escalate or abstain, and she can say "this one is hard" — whereas fifteen binary votes discard exactly the graded confidence that asymmetric error costs make most relevant, and the panel cannot abstain collectively without effectively defaulting to inaction anyway.

  Please go through this move by move and tell me who is right about which specific point, rating each move from clearly mistaken to clearly right with a brief justification, and then say who is more right overall and what, if anything, both of them are missing. I'd particularly like you to (a) check the numbers rather than inherit them, and tell me if any of the percentages quoted above are wrong; (b) be explicit about what the jury theorem does and does not require of the votes — unconditional versus conditional independence, and what a shared evidence channel does to each; (c) take a view on the hierarchical variant in (3) and (4), including whether there are conditions under which the sub-panel design would beat the flat majority of fifteen, and what would have to be true of the evidence channels for that; (d) say how much the agenda-selection and heterogeneous-competence points in (4) actually threaten the case for the panel, given that they seem to threaten the single reviewer as well; and (e) say whether the threshold-tuning exchange in (5) and (6) is a genuine advantage for either arrangement, or whether continuous-confidence aggregation dominates both. Don't hedge into a summary of the literature or a list of considerations — I need a verdict I can put in a memo, including on whether the honest answer is that the audit numbers are too thin to settle any of this.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Non-clinical member of a hospital therapeutics committee.
      *   **Task:** Adjudicate a debate between two clinicians (Marcus and Lena) regarding a proposal to replace a single senior clinical pharmacologist (75% accuracy) with a 15-member panel of generalists (60% accuracy each) using majority vote.
      *   **Input:** A summary of six moves in their argument.
      *   **Requirements:**
          *   Go through moves (1)-(6) one by one.
          *   Rate each move (Clearly Mistaken to Clearly Right) with justification.
          *   Check the math/percentages quoted.
          *   Explain Condorcet Jury Theorem (CJT) assumptions (independence, conditional vs. unconditional).
          *   Evaluate the hierarchical/sub-panel variant.
          *   Evaluate agenda selection/heterogeneous competence points.
          *   Evaluate threshold tuning vs. confidence aggregation.
          *   Provide an overall verdict (who is more right).
          *   Identify what both are missing.
          *   Address whether audit numbers are too thin.
          *   **Constraint:** Do not hedge into a literature summary. Provide a verdict suitable for a memo.

  2.  **Deconstruct the Moves & Verify Math:**

      *   **Baseline Data:**
          *   Single Expert (Pharmacologist): $p_e = 0.75$.
          *   Panel Member (Generalist): $p_g = 0.60$.
          *   Panel Size: $n = 15$.
          *   Goal: Majority vote ($k > n/2$, so $k \ge 8$).

      *   **Move (1): Marcus's CJT Claim.**
          *   *Claim:* At $p=0.6$, $n=15$ majority accuracy is $\approx 79\%$. At $n=41$, accuracy $> 90\%$. Single expert is fixed ceiling.
          *   *Math Check:* Binomial distribution $B(n, p)$. Probability of $\ge 8$ successes in 15 trials with $p=0.6$.
              *   Using cumulative binomial probability: $P(X \ge 8) = 1 - P(X \le 7)$.
              *   Calculation: $P(X \ge 8) \approx 0.7827$. So "a shade under 79%" is correct.
              *   For $n=41$, majority is 21. $P(X \ge 21)$ with $p=0.6$.
              *   Calculation: $\approx 0.907$. So "above 90%" is correct.
          *   *Theory:* CJT states if $p > 0.5$ and votes are independent, probability of correct majority approaches 1 as $n \to \infty$.
          *   *Verdict:* Math is right. Theory application assumes independence.

      *   **Move (2): Lena's Independence Critique.**
          *   *Claim:* Independence assumption is violated due to shared dossier/training/corridor talk. Effective $n$ might be 3. Majority of 3 at $p=0.6$ is $\approx 65\%$.
          *   *Math Check:* Majority of 3 ($k \ge 2$). $P(X \ge 2) = 3(0.6)^2(0.4) + (0.6)^3 = 3(0.36)(0.4) + 0.216 = 0.432 + 0.216 = 0.648$. So $\approx 65\%$ is correct.
          *   *Theory:* CJT requires *conditional independence* given the state of the world (True/False). Shared evidence induces correlation ($\rho > 0$). If correlation is high, effective $n$ drops.
          *   *Verdict:* Theoretically sound. This is the standard and most potent critique of CJT in real-world settings.

      *   **Move (3): Marcus's Sub-Panel Proposal.**
          *   *Claim:* Split 15 into 3 groups of 5. Separate evidence summaries. Majority of sub-panel verdicts. Claims this restores independence.
          *   *Math Check:*
              *   Sub-panel (5 members, $p=0.6$): Majority is 3. $P(X \ge 3) = \sum_{k=3}^5 \binom{5}{k} (0.6)^k (0.4)^{5-k}$.
              *   Calculation: $10(0.216)(0.16) + 5(0.1296)(0.4) + 0.07776 = 0.3456 + 0.2592 + 0.07776 = 0.68256$. So $\approx 68\%$ is correct.
              *   Top Level (3 sub-panels, $p=0.68$): Majority is 2. $P(X \ge 2) = 3(0.68)^2(0.32) + (0.68)^3$.
              *   Calculation: $3(0.4624)(0.32) + 0.3144 = 0.4439 + 0.3144 = 0.7583$. So $\approx 76\%$ is correct.
          *   *Comparison:* Flat 15 was $\approx 78.3\%$. Hierarchy is $\approx 75.8\%$. Hierarchy is worse *if* independence holds within sub-panels.
          *   *Verdict:* Math is right. Theoretical claim (that separate summaries fix independence) is weak (addressed in Move 4).

      *   **Move (4): Lena's Hierarchy & Agenda Critique.**
          *   *Claim 1:* Rewriting evidence doesn't create independence (correlated summaries).
          *   *Claim 2:* Hierarchy costs accuracy (76% vs 78%). (Verified above).
          *   *Claim 3:* Selection Bias/Competence Degradation. Cases reaching vote are contested/hard. $p$ might drop below 0.5. If $p < 0.5$, CJT flips (majority becomes worse than random).
          *   *Verdict:* Claim 1 is strong (information theory). Claim 2 is mathematically proven (Condorcet efficiency loss in hierarchies). Claim 3 is the "Competence Constraint." If the audit is on *all* cases but voting is only on *hard* cases, the 60% figure is inflated for the voting context.
          *   *Threat to Single Reviewer:* Lena argues this threatens the panel more. Does it threaten the expert? Yes, but the expert's 75% is derived from the *same* audit. If the audit includes easy cases, her 75% is also inflated for hard cases. However, experts usually degrade *less* on hard cases than generalists.
          *   *Verdict:* Strong points.

      *   **Move (5): Marcus's Supermajority/Threshold Claim.**
          *   *Claim:* Asymmetric costs (False Positive > False Negative). Panel can tune threshold (e.g., 10/15). Single reviewer is binary/fixed.
          *   *Theory:* Decision theory distinguishes *accuracy* (truth-tracking) from *utility* (cost-sensitive). Voting thresholds adjust specificity/sensitivity.
          *   *Verdict:* Partially right. A panel *can* set a higher bar. But a single expert can also be instructed to apply a higher confidence threshold before approving.

      *   **Move (6): Lena's Confidence/Abstention Claim.**
          *   *Claim:* Expert can express confidence/abstain. Panel binary votes discard confidence. Panel abstention = inaction.
          *   *Theory:* Continuous confidence aggregation (e.g., mean probability) generally outperforms binary voting if calibration is good.
          *   *Verdict:* Strong point. Binary voting throws away information.

  3.  **Synthesize the "Missing" Elements:**
      *   **Calibration:** Accuracy ($p$) isn't enough. We need calibration (does 60% confidence mean 60% accuracy?).
      *   **Diversity vs. Ability:** Page's Diversity Prediction Theorem. Error = Average Individual Error - Prediction Diversity. The panel needs diverse *models*, not just diverse *people*.
      *   **The Audit Itself:** The prompt asks to check if numbers are too thin. A retrospective audit of "last few hundred cases" against a "reconstructed gold standard" is prone to hindsight bias. The gold standard itself might be noisy.
      *   **Systemic Risk:** Marcus's "single point of failure" is valid risk management, even if accuracy is slightly lower.

  4.  **Drafting the Memo Structure:**
      *   **Executive Summary:** Direct verdict.
      *   **Move-by-Move Adjudication:** Ratings and math checks.
      *   **Theoretical Deep Dive:** Independence, Hierarchy, Thresholds.
      *   **The Audit Problem:** Addressing the data quality.
      *   **Recommendation:** What to actually do.

  5.  **Refining the Verdict:**
      *   Marcus wins on *Risk Management* (single point of failure) and *Threshold Tuning* (mechanically easier to enforce 10/15 rule than police one expert's internal threshold).
      *   Lena wins on *Accuracy* (Independence violation kills CJT gains) and *Information Aggregation* (Binary voting loses confidence data).
      *   *Overall:* Lena is more right on the *math of accuracy*, but Marcus identifies a valid *governance* issue. However, given the specific numbers (75% vs 60% base), the panel *cannot* mathematically beat the expert unless independence is much higher than Lena fears. If effective $n$ is low, panel accuracy crashes.
      *   *Crucial realization:* The hierarchy math (Move 3/4) shows hierarchy is *worse* than flat panel. So Marcus's fix for independence reduces accuracy further.
      *   *Audit:* The audit numbers are likely too thin/noisy to rely on for a structural change. 75% vs 60% might not be statistically significant if the "gold standard" is fuzzy.
      *   *Decision:* Keep the expert, but mitigate risk (second opinion on specific high-risk classes) OR adopt panel but require confidence scoring, not binary votes. Given the prompt asks to adjudicate *this* proposal (Expert vs. Binary Panel), the Binary Panel is mathematically inferior unless independence is near-perfect.

  6.  **Writing the Content (Iterative refinement):**
      *   *Math Check:* Ensure the binomial calcs are explicitly stated as verified.
      *   *Independence:* Clarify Conditional Independence. $P(V_i=1 | Truth=1)$. Correlation comes from $P(V_i=1, V_j=1 | Truth) \neq P(V_i=1|Truth)P(V_j=1|Truth)$.
      *   *Hierarchy:* It reduces variance but increases bias/loss of information. It is strictly dominated by flat voting *if* votes are independent. If votes are correlated, it *might* help if sub-panels break the correlation, but Lena is right that rewriting text doesn't break information correlation.
      *   *Thresholds:* A single expert *can* be regulated (e.g., "require 90% confidence"). But a panel rule is more transparent. However, Lena is right that binary voting discards info.
      *   *Audit:* "Reconstructed gold standard" is a red flag. Hindsight bias.

  7.  **Final Polish:** Check tone. Needs to be authoritative, decisive, suitable for a committee memo. No "on the one hand, on the other." Give a recommendation.

      *   *Self-Correction on Move 5/6:* Marcus says single reviewer threshold isn't tunable. Lena says it is. In practice, institutionalizing a threshold for one person is harder to audit than a voting rule. But theoretically, Lena is right. I should note the *auditability* difference.
      *   *Self-Correction on Move 4:* Does agenda selection hurt the expert? Yes. But experts usually have higher $p$ on hard cases than generalists. The gap (75 vs 60) likely widens on hard cases. This favors the expert.

  8.  **Finalizing the Verdict:**
      *   Lena is more right on the *probability*.
      *   Marcus is more right on the *governance risk*.
      *   *Recommendation:* Do not adopt the 15-member binary panel. It likely lowers accuracy and increases cost. Mitigate the single-point-of-failure risk with a targeted secondary review for high-risk classes, not a blanket panel.

      *(Self-Correction)*: Wait, I need to be careful about the "Audit numbers too thin" instruction. I must explicitly state if the 75% vs 60% is reliable. "Reconstructed gold standard" suggests significant noise. I should advise that the decision cannot rest *solely* on these numbers.

      *Revised Verdict:* The math favors the expert *unless* independence is very high. The audit is suspect. The proposal as stated (Binary Panel) is inferior. A modified proposal (Panel with confidence scoring OR Expert + Audit) is better. I will recommend rejecting the current proposal but addressing Marcus's risk concern.

      *Let's check the hierarchy math again.*
      Flat 15 ($p=0.6$): 78.3%.
      Hierarchy (3 groups of 5): Group accuracy 68.3%. Top level (3 groups, $p=0.683$): 75.8%.
      Yes, Hierarchy is worse than Flat. Lena is right.

      *Let's check the "Effective N=3" math.*
      If correlation is high enough that effective N=3. Accuracy = 64.8%.
      Expert = 75%.
      Panel loses.
      So the pivot point is the correlation coefficient.

      *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** Therapeutics Committee
  **FROM:** Non-Clinical Committee Member
  **SUBJECT:** Adjudication of Proposal: Single Expert vs. 15-Member Panel
  **DATE:** October 26, 2023

  ### Executive Summary

  After reviewing the arguments presented by Marcus and Lena, and verifying the underlying decision theory and arithmetic, **Lena is more right overall regarding the probability of correct decisions, while Marcus identifies a valid but solvable governance risk.**

  The proposal to replace the senior pharmacologist with a 15-member binary-vote panel is **not supported by the data provided.** Under realistic assumptions about vote correlation, the panel will likely underperform the expert (65–70% accuracy vs. 75%). Furthermore, the hierarchical fix proposed by Marcus mathematically reduces accuracy further. However, Marcus is correct that reliance on a single individual creates institutional risk; this should be mitigated by targeted secondary review rather than a blanket panel replacement.

  Finally, **the audit numbers (75% vs. 60%) are too thin to settle this definitively.** A "reconstructed gold standard" on retrospective cases introduces hindsight bias that likely inflates both figures, but disproportionately benefits the expert who may have authored the protocols being audited.

  Below is the move-by-move adjudication, mathematical verification, and theoretical analysis required for the committee record.

  ---

  ### Part 1: Move-by-Move Adjudication

  **Move (1): Marcus (Condorcet Jury Theorem Application)**
  *   **Verdict:** **Mathematically Right, Theoretically Fragile.**
  *   **Math Check:** Correct. For $n=15, p=0.6$, the probability of a correct majority ($\ge 8$ votes) is **78.27%**. For $n=41$, it is **90.7%**.
  *   **Justification:** Marcus correctly applies the Condorcet Jury Theorem (CJT) formula. However, his conclusion relies entirely on the assumption of voter independence, which he addresses only in Move (3). As a standalone argument for accuracy, it is theoretically valid but empirically vulnerable.

  **Move (2): Lena (Independence Critique)**
  *   **Verdict:** **Clearly Right.**
  *   **Math Check:** Correct. If correlation reduces the "effective $n$" to 3, the majority accuracy ($\ge 2$ of 3) is **64.8%**.
  *   **Justification:** This is the critical failure point of Marcus's proposal. CJT requires votes to be *conditionally independent* given the truth. Shared evidence (the dossier) creates a common signal error. If the dossier is misleading, all 15 members are likely to be wrong together. Lena correctly identifies that shared information channels induce correlation ($\rho > 0$), collapsing the statistical benefit of the crowd.

  **Move (3): Marcus (Hierarchical Sub-Panels)**
  *   **Verdict:** **Mathematically Right, Theoretically Mistaken.**
  *   **Math Check:** Correct. A 5-person sub-panel ($p=0.6$) has **68.26%** accuracy. A majority of 3 such sub-panels yields **75.83%** accuracy.
  *   **Justification:** Marcus admits the hierarchy yields ~76%, which is lower than the flat panel's ~78% (calculated in Move 1). He argues this restores independence. This is theoretically weak: rewriting the same evidence summary does not create independent information channels (see Move 4). He accepts an accuracy loss to solve a problem (correlation) that the hierarchy does not actually fix.

  **Move (4): Lena (Information Channels & Agenda Selection)**
  *   **Verdict:** **Clearly Right.**
  *   **Math Check:** Correct. She accurately notes the hierarchy (76%) underperforms the flat panel (78%).
  *   **Justification:**
      1.  **Information:** Redundancy of heads is not redundancy of evidence. If the source data is fixed, three summaries of it are correlated.
      2.  **Competence Constraint:** Lena correctly notes that cases reaching a vote are the *hard* cases (selection bias). If generalist competence ($p$) drops below 0.5 on these specific cases, the CJT "flips": adding more voters makes the decision *worse* than random chance. The expert's 75% is likely more robust on hard cases than the generalists' 60%.

  **Move (5): Marcus (Threshold Tuning)**
  *   **Verdict:** **Partially Right (Governance), Mistaken (Theory).**
  *   **Justification:** Marcus is right that a supermajority rule (10/15) is easier to audit and enforce institutionally than an internal confidence threshold for one person. However, he is mistaken that a single reviewer's threshold is *inherently* untunable. An expert can be mandated to require specific confidence levels or escalate uncertain cases.

  **Move (6): Lena (Confidence Aggregation)**
  *   **Verdict:** **Clearly Right.**
  *   **Justification:** Binary voting discards information. If 8/15 vote "Yes" with low confidence and 7/15 vote "No" with high confidence, the majority rule ignores the intensity of belief. Decision theory dictates that aggregating continuous confidence scores (probabilities) outperforms binary voting when error costs are asymmetric. Lena correctly identifies that the panel structure actively destroys the data needed to optimize for asymmetric costs.

  ---

  ### Part 2: Theoretical Adjudication

  **(a) The Independence Requirement**
  The Condorcet Jury Theorem requires **conditional independence**. It does not require voters to be independent in a vacuum; it requires that *given the true state of the world* (e.g., Drug A is effective), Voter X's error is not correlated with Voter Y's error.
  *   **The Problem:** In this hospital context, voters share a "common signal" (the evidence dossier). If the dossier is ambiguous or misleading, errors become correlated.
  *   **The Verdict:** Lena is correct. In clinical formulary decisions, the evidence is fixed. You cannot have 15 independent assessments of the *same* trial data. The correlation coefficient is likely high enough to negate the benefit of $n=15$.

  **(b) The Hierarchical Variant**
  Marcus proposes a two-tier system (3 panels of 5) to break correlation.
  *   **The Verdict:** This design is **strictly dominated** by the flat 15-person vote *if* independence is assumed (75.8% vs 78.3%). It only becomes superior if the sub-panel structure *actually* reduces correlation significantly more than the flat structure.
  *   **Condition for Success:** For the hierarchy to win, the "separate evidence summaries" would need to be genuinely independent interpretations (e.g., three separate systematic reviews conducted blindly). Merely rewriting the same summary does not achieve this. Given the constraint of "one fixed body of trial data," the hierarchy is a net loss in accuracy.

  **(c) Agenda Selection and Competence**
  Lena argues that voting only happens on contested/hard cases, where $p$ drops.
  *   **Threat to Panel:** High. If generalist competence drops to $p=0.55$ or lower on hard cases, the panel's advantage evaporates. If $p < 0.5$, the panel becomes harmful.
  *   **Threat to Expert:** Lower. While the expert's accuracy also degrades on hard cases, the gap between Specialist (75%) and Generalist (60%) typically *widens* as case complexity increases. The audit average (all cases) likely underestimates the expert's relative advantage on the specific cases that would trigger a committee vote.

  **(d) Threshold Tuning vs. Confidence**
  *   **Verdict:** **Continuous-confidence aggregation dominates both.**
  *   Marcus is right that a supermajority rule is a crude tool to handle asymmetric costs (preventing harmful adoptions). However, Lena is right that it is inefficient.
  *   **Superior Solution:** The committee should not vote "Adopt/Reject." Members should submit probability estimates (e.g., "70% chance this is cost-effective"). The committee then aggregates these probabilities and compares them to a cost-benefit threshold. This preserves the information Marcus wants (risk aversion) without discarding the nuance Lena wants (confidence).

  ---

  ### Part 3: The Audit Data Warning

  **The honest answer is that the audit numbers are too thin to settle this.**

  1.  **Reconstructed Gold Standard:** A retrospective audit against a "reconstructed" standard is subject to hindsight bias. We know the outcomes now; the reviewers knew the outcomes when reconstructing the standard. This inflates accuracy scores for everyone.
  2.  **Sample Size:** "A few hundred cases" is statistically noisy. The difference between 75% and 60% may not be significant given the variance in case difficulty.
  3.  **Reference Class:** The 60% figure is a reference-class average for generalists. The 15 members drawn for the panel may be the top 15% of that pool, or the bottom. We do not know the variance of the pool.

  **Recommendation:** Do not use the 75% vs. 60% split as the sole justification for structural change. It is a heuristic, not a proof.

  ---

  ### Part 4: Final Recommendation

  **Decision:** **Reject the proposal to replace the Senior Pharmacologist with a 15-member binary-vote panel.**

  **Reasoning:**
  1.  **Accuracy:** Under realistic conditions of correlated votes (shared evidence), the panel's accuracy will likely fall between 65% and 70%, underperforming the expert's 75%.
  2.  **Efficiency:** The hierarchical fix proposed to mitigate correlation reduces accuracy further and increases administrative burden.
  3.  **Information Loss:** Binary voting discards confidence data necessary for managing asymmetric error costs (harm vs. delay).

  **Counter-Proposal (Addressing Marcus's Risk Concern):**
  Marcus is correct that a single decision-maker is a single point of failure (risk of capture, burnout, or dogmatism). To mitigate this without sacrificing accuracy:
  1.  **Retain the Senior Pharmacologist** as the primary decision authority (preserving the 75% accuracy baseline).
  2.  **Implement a "Triggered Review" Protocol:** If the Pharmacologist's confidence is below a certain threshold, or if the decision involves a high-risk/high-cost drug class, the case is automatically escalated to a 5-member sub-panel (not 15) for advisory input.
  3.  **Adopt Confidence Scoring:** Replace binary votes with probability estimates for all committee decisions to allow for cost-sensitive thresholding.

  **Verdict:** Lena wins on the mathematics of decision accuracy. Marcus wins on the necessity of governance controls. The solution is to keep the expert but constrain the role with targeted oversight, rather than replacing expertise with a diluted majority.
