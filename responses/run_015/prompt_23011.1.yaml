      *   Crucial distinction: Humean Supervenience (Lewis's view). Chances are summaries of patterns in history. Credences are rational responses to information. Connecting them requires a principle. Without PP, you could be a rational agent who ignores objective chances (e.g., believing a fair coin will land heads 90% of the time). PP says that's irrational.

