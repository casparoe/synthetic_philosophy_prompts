answer: |-
  You are asking exactly the right questions. In fact, realizing that the Principal Principle (PP) *looks* like a tautology is the first step to understanding why it is actually one of the most significant (and controversial) claims in modern metaphysics.

  You are currently conflating **types** of probability. Once you separate them, the tautology vanishes, and the philosophical heavy lifting becomes visible.

  Here is a walkthrough of what the PP is actually doing, why admissibility matters, and why Lewis eventually had to patch it with the New Principle.

  ### 1. Why the PP is Not a Tautology

  Your intuition is: *"Credence is a probability, Chance is a probability, so saying they should be equal is like saying 'a number should equal a number'."*

  But in Lewis's framework, these are two completely different categories of being.
  *   **Credence (Epistemic):** This is a psychological state. It is a measure of your confidence, located in your head. It is governed by norms of rationality.
  *   **Chance (Metaphysical):** This is a feature of the world. It is a physical propensity or a frequency pattern located in the external reality (independent of your mind).

  **The Analogy:**
  Consider the statement: *"Your belief about the temperature should match the actual temperature."*
  *   "Belief about temperature" is a mental state.
  *   "Actual temperature" is a physical state.
  *   Is it a tautology to say they should match? No. It is a **norm**. You *could* believe it is 20°C when it is actually 30°C. You would be wrong, but not logically contradictory.

  The Principal Principle is a **bridge principle**. It connects the "Is" (metaphysical chance in the world) to the "Ought" (rational credence in the mind). Without the PP, it would be logically consistent to say:
  > "I know the objective chance of this coin landing Heads is 50%, but I rationally believe it will land Heads with 90% confidence."

  Most philosophers think that agent is irrational. The PP is the rule that makes them irrational. It claims that objective chance **constrains** rational belief. That is a substantive philosophical claim, not a definition. If you deny the PP, you are saying that objective chances might exist, but rational agents are under no obligation to care about them.

  ### 2. The Problem of Admissibility

  You asked: *"If the principle is just 'set your credence to the chance,'... the admissibility stuff looks like a distracting technicality."*

  It is not a technicality; it is the escape hatch for **prophecy**.

  The PP formula is roughly:
  $$C(A \mid Ch(A) = x \ \& \ E) = x$$
  *(Your credence in A, given that the chance of A is x and your total evidence is E, should be x.)*

  The catch is that **$E$ must be admissible.**

  **Why?**
  Imagine you have a crystal ball.
  *   **Objective Chance:** The coin is fair. $Ch(\text{Heads}) = 0.5$.
  *   **Evidence ($E$):** You looked in the crystal ball, and it showed "Heads." The crystal ball is 100% reliable.

  If you follow the PP without the admissibility clause, you would say: "The chance is 0.5, so my credence must be 0.5."
  But that is insane. If you have infallible evidence that the outcome is Heads, your credence should be 1.0, regardless of the chance.

  **Admissibility** is Lewis's way of saying: *"Match the chance, unless you have information that trumps the chance."*
  *   **Admissible Evidence:** Information about the past, the laws of nature, or the chance function itself. (Things that determine the chance).
  *   **Inadmissible Evidence:** Information about the specific future outcome (like the crystal ball, or time travel, or seeing the coin after it landed).

  So the PP isn't "Always match chance." It is "Match chance **unless** you have inadmissible information about the outcome." This makes the principle robust enough to handle cases where we know more than just the probabilities.

  ### 3. Why the "New Principle" Was Needed

  This is the hardest part, but it explains why Lewis wasn't satisfied with his own famous principle.

  Lewis was a **Humean Supervenience** theorist. He believed that chances are not magical propensities; they are just summaries of the pattern of events in the universe (the "Best System").
  *   **The Catch:** The pattern of events includes the **future**.
  *   To know what the current chance function is, you technically need to know the total history of the universe (past, present, and future) to see which probabilistic laws best summarize it.

  **The Problem of "Undermining Futures":**
  Imagine a world where the chance of Heads is 0.5.
  However, there is a possible future where the coin lands Heads 1,000 times in a row. If that future happens, the "Best System" for that world would change, and the *current* chance function would no longer be the best summary. The chance would have been different.

  Here is the contradiction that breaks the original PP:
  1.  According to the PP, if I know $Ch(\text{Heads}) = 0.5$, my credence in Heads should be 0.5.
  2.  But, because chances supervene on the total history (including the future), knowing that $Ch(\text{Heads}) = 0.5$ actually gives me **information about the future**. It tells me that the future *won't* be one of those "undermining" futures (like 1,000 heads in a row) that would have changed the chance function.
  3.  So, knowing the chance gives me "inadmissible" information about the outcome (it rules out certain futures).
  4.  If knowing the chance gives me extra info about the outcome, the PP (which says "condition only on the chance") yields the wrong credence.

  **The New Principle (NP):**
  Lewis realized that under his own metaphysics, propositions about chance are never purely admissible. They always carry a tiny bit of "future-looking" baggage.

  The **New Principle** adjusts the math. It says:
  $$C(A \mid Ch(A) = x) = \frac{x}{Ch(\text{The history is compatible with } Ch(A)=x)}$$

  Roughly translated: *"Set your credence to the chance, but adjust for the fact that knowing the chance tells you the future isn't one of those 'undermining' ones."*

  In most everyday cases, the difference between PP and NP is negligible. But in strict metaphysical terms, the PP was technically false under Lewis's own system, and the NP was the repair job.

  ### Summary: What is the "Point"?

  You felt like you were missing the point because you were treating the PP as a definition. It is not a definition; it is a **constraint on rationality.**

  1.  **Non-Triviality:** It asserts that there is a necessary connection between the metaphysical structure of the world (chance) and the norms of the mind (credence). Denying it is a viable philosophical position (some do!), which proves it isn't a tautology.
  2.  **Admissibility:** This protects the principle from cases where we have "god's eye view" information (prophecy) that overrides statistical chance.
  3.  **New Principle:** This was a repair to ensure the principle remained consistent with Lewis's specific view that chances are just patterns in history (Humean Supervenience).

  For your seminar, the key takeaway is this: The Principal Principle is the attempt to solve the problem of **how objective facts guide subjective reason.** If you walk away thinking it's just "probability = probability," you've missed the bridge it builds between metaphysics and epistemology.
