answer: |-
  ### Brainstorming: What a Theory of Corruption Must Do

  Before we reconstruct the theory hiding behind these contradictions, we need to be clear about the job description. A theory of corruption cannot simply list prohibited acts; it must explain *why* they are prohibited. Here is what the theory needs to achieve:

  *   **Identify the Wrong-Making Feature:** It must isolate what makes an act corrupt *distinct* from merely being rude, inefficient, or criminal in a private capacity. It usually hinges on the **betrayal of a specific fiduciary duty** owed to the public, rather than just the exchange of value.
  *   **Distinguish Gift from Price:** It must explain why a dinner with a minister can be corrupt while a dinner with a spouse is not, despite the identical monetary value. The theory must account for *context* and *intent* (the creation of obligation vs. the expression of affection).
  *   **Explain the Systemic Harm:** It cannot focus solely on the transactional moment (the handover of the envelope). It must explain how individual acts degrade the *institution* itself (eroding trust, distorting policy).
  *   **The Counterfactual Test:** If the theory fails to pick out the right feature, we end up treating public office as **private property**. In a world without a robust theory of corruption, a licensing officer *should* sell speed to the highest bidder, and a minister *should* auction policy to the highest donor, because they "own" their influence. A successful theory must prove they do not.

  ***

  ### Reconstruction: The Implicit Theory of Practice

  You have identified a genuine incoherence in how we handle corruption. The licensing clerk is prosecuted, the lobbyist is invited to dinner, and the constituent expecting cash at a funeral is labelled "backward." Your three-way distinction (*priority*, *content*, *access*) is a sharp diagnostic tool, but it describes the *mechanics* of the transaction, not the *normative* reason we object to them.

  The reason the practice looks inconsistent is that it is not operating under a single theory. It is operating under a **fragmented Liberal-Weberian hybrid** that clashes with social reality. Here is the reconstruction of the implicit assumptions holding this messy system together.

  #### 1. The Core Implicit Theory: Public Office as Public Trust
  At the level of formal law and compliance training, the presupposition is **Public Integrity**. This theory holds that:
  *   **Strict Presupposition:** Public power is not the property of the officeholder. It is held in trust for the citizenry.
  *   **The Wrong:** Any private consideration (money, gifts, future employment) that competes with the public interest as the motive for decision-making is illicit.
  *   **Rival Theory Ruled Out:** This strictly rules out **Proprietary Theory** (the idea that an official owns their office and may monetise it, common in early modern Europe where offices were sold).

  #### 2. Where the Practice Diverges (The Inconsistency)
  While the *law* presupposes Public Integrity, the *practice* quietly accommodates **Pluralism** and **Risk Management**.
  *   **Elite Influence (Lobbying/Donations):** Here, the implicit theory shifts to **Pluralist Competition**. Influence is treated as a resource that groups compete for. As long as the "market" for influence is somewhat open, it is deemed democratic participation rather than corruption. This is underdetermined by Public Integrity; a strict Integrity theorist would ban private campaign funding entirely, but the practice allows it under the guise of free speech/association.
  *   **Petty Bribery:** Here, the theory is **Weberian Bureaucracy**. The clerk must be an impersonal cog. Selling *priority* violates the rule of law (equality before the queue).
  *   **Compliance Thresholds:** The "cheap pen vs. chocolates" rule is not moral philosophy; it is **Risk Management**. It presupposes that corruption is a compliance cost to be minimised, not a moral evil to be eradicated. It assumes a monetary threshold exists where a gift becomes a price. *This is where your observation is strongest:* morally, a relationship is binary (you are beholden or you are not); economically, it is marginal. The practice treats it as marginal because it is easier to regulate.

  #### 3. The Anthropological Clash (Clientelism)
  The seminar reading on funerals and gifts highlights a clash between **Legal-Rational Authority** (the state is a set of rules) and **Traditional/Relational Authority** (the state is a set of people).
  *   When the politician brings cash to a funeral, they are operating on a theory of **Reciprocity**. The "corruption" label is applied by external observers (or the World Bank) who impose the Legal-Rational view.
  *   **Where your distinction struggles:** You categorise these payments by what they *buy* (priority, access, content). But in clientelism, the payment *is* the relationship. The "wrong" in the Western view is the **privatisation of the public sphere**. The "right" in the local view is the **humanisation of the state**. The practice scores them the same (as corruption) because international indices measure the *deviation from Weberian norms*, not the *social function* of the payment.

  ***

  ### Critique: Where Your Three-Way Distinction Goes Wrong

  Your distinction between *priority*, *content*, and *access* payments is analytically useful for describing *how* influence is peddled, but it fails as a normative theory for two reasons:

  1.  **It Misses the Source of Authority:** It assumes the official has the right to sell *something*, and we are just arguing over which commodity is off-limits. But the Public Integrity theory says they have no right to sell *anything*. Whether I pay for *access* (to be heard) or *priority* (to be heard first), I am treating a public right as a private commodity. The harm is identical: the conversion of public status into private revenue.
  2.  **It Ignores the Symbolic Harm:** You suggest *priority* payments are "most harmless." Philosophically, they may be the most damaging to the principle of **Civic Equality**. If the rich can jump the queue for a license, the state is visibly signalling that citizenship is tiered. A *content* payment (changing a decision) might be hidden; a *priority* payment (a fast lane) is often visible. The visibility of inequality erodes trust more than the hidden distortion of policy.

  **The Verdict:** Your distinction explains the *market mechanics* of corruption, but it cannot explain the *moral inconsistency* you observe. That inconsistency arises because we apply **Public Integrity** to the poor (the clerk), **Pluralism** to the rich (the donor), and **Developmentalism** to the Global South (pathologising clientelism while ignoring structural lobbying).

  ***

  ### Shifting the Harm: Dependency and Capture

  You asked what would change if we swapped the central harm from "exchange of money for decision" (quid pro quo) to "creation of personal dependency" or "capture of an agenda." This is a profound shift from a **Transactional View** to a **Structural View**.

  #### Scenario A: The Central Harm is Personal Dependency
  This aligns with the anthropological view you mentioned. The wrong is not the money, but the **asymmetry of obligation** created between a private actor and a public servant.
  *   **Concrete Changes:**
      *   **Gifts:** A total ban on *all* gifts, regardless of value. A pen creates a micro-obligation; the "threshold" model would be abolished.
      *   **Revolving Door:** A lifetime ban on officials moving to industries they regulated. The "cooling-off" period (usually 1–2 years) assumes dependency fades; a dependency theory argues the relationship is permanent.
      *   **Clientelism:** This would be harder to criminalise. If the harm is dependency, we would need to distinguish between *coercive dependency* (the constituent needs the cash to eat) and *social reciprocity*. Law might focus on preventing officials from holding discretionary funds that allow them to build personal armies of dependents.

  #### Scenario B: The Central Harm is Agenda Capture
  This aligns with the "legal corruption" worry. The wrong is not a specific decision sold, but the **skewing of the policy landscape** to favour specific interests before a decision is even made.
  *   **Concrete Changes:**
      *   **Lobbying:** A "Legislative Footprint." Every meeting between a minister and an external actor must be minuted and published. The focus shifts from "did you take money?" to "who is writing the brief?"
      *   **Campaign Finance:** Strict caps on spending, or state-funded elections only. If the harm is capture, private money is inherently suspect because it purchases *access to the agenda-setting phase*.
      *   **Access Payments:** These would be criminalised more heavily than *content* payments. If the harm is capture, preventing a rival from even getting in the room (*access*) is worse than persuading an official to change their mind (*content*) after hearing all sides.

  ### Conclusion for Your Module

  You are correct that the practice knows more than the theory, but only because the practice is pragmatic and the theory is idealistic. The practice tolerates "legal corruption" because it accepts a Pluralist view of politics (money talks) while demanding a Weberian view of administration (rules rule).

  Your three-way distinction helps expose the *mechanisms*, but to solve the puzzle, you must argue that the **implicit theory is incoherent**. It tries to maintain the *legitimacy* of the state (by punishing the clerk) while accepting the *reality* of power (by tolerating the donor).

  If you want to push your argument further, propose that a consistent theory of **Public Integrity** would criminalise the *access* payments of the lobbyist just as severely as the *priority* payments of the clerk. The fact that it does not is not a failure of theory, but a reflection of who gets to write the law.
