answer: |-
  Here is the teaching plan. It is structured to move from the *data* (what it feels like) to the *mechanism* (how it gets built) to the *error* (where the laundering happens).

  ### **Session Goal**
  Demonstrate that moral "preferences" are often post-hoc rationalizations of visceral aversions calibrated by culture, and that consistency does not equal validity.

  ### **The Example Domain: Cognitive Enhancement (e.g., Modafinil/Adderall in Academia)**
  **Why this example:**
  *   **Relevance:** It hits directly on the audience's daily life (academic merit, effort, fairness).
  *   **Visceral Component:** It triggers a "cheating" intuition (disgust/yuck) without the baggage of food/sex/politics.
  *   **Dual Function:**
      1.  *Principle masking Disgust:* "It violates fairness/merit" (Principle) $\rightarrow$ actually "It feels like a dirty shortcut/unnatural" (Disgust).
      2.  *Bias masking Preference:* "I prefer natural cognition" (Preference) $\rightarrow$ actually "I am biased against pharmaceutical intervention due to stigma" (Bias).

  ---

  ### **Phase 1: The Phenomenological Data (15 mins)**
  **Goal:** Establish the *feeling* of moral certainty as the object of study, not the truth of the judgment.
  **Content:**
  *   Ask: "When you judge something as wrong, does it feel like a calculation or a perception?"
  *   Establish that moral judgments present themselves as *perceptual* (like seeing a red light) rather than *constructive* (like solving an equation).
  *   **Why this comes first:** You cannot explain the laundering process until students admit that the *output* feels immediate. If they think moral judgments are already reasoned, there is nothing to launder.

  **$\rightarrow$ Intercept Misconception #1 (Revealed Preference):**
  *   *When:* Immediately after establishing the "feeling."
  *   *The Move:* Explicitly state: "Just because you can articulate a reason *now* doesn't mean the reason caused the judgment."
  *   *The Point:* Revealed preference tells us *what* was chosen, not the *genealogy* of the choice. We are studying the genealogy, not the outcome.

  ---

  ### **Phase 2: The Calibration Mechanism (20 mins)**
  **Goal:** Show how "taste" is trained, not innate.
  **Content:**
  *   Analogy: Spicy food. The burn is biological (capsaicin), but the *enjoyment* is cultural calibration.
  *   Apply to Morality: The "aversion" is biological (amygdala/insula activation), but the *object* of the aversion is culturally assigned.
  *   **Why this comes second:** You need to separate the raw signal (aversion) from the label (moral violation) before you can show how they get confused.

  **$\rightarrow$ Intercept Misconception #2 (Implicit Association Tests):**
  *   *When:* During the discussion of "calibration."
  *   *The Move:* Ask: "Would an IAT tell us if this aversion is laundered?"
  *   *The Point:* No. IATs measure strength of association, not the *causal history* of that association. A strong link between "drugs" and "bad" could be a reasoned stance OR a laundered bias. The IAT cannot distinguish the source.

  ---

  ### **Phase 3: The Laundering Process (25 mins)**
  **Goal:** Define the specific mechanism of "rationalization."
  **Content:**
  *   Introduce the **Press Secretary Model** (Haidt/Neuroscience overlap): The conscious mind is not the President; it is the Press Secretary defending the President's gut decisions.
  *   The Loop:
      1.  Gut Aversion (Insula/Amygdala).
      2.  Social Feedback (Peers punish/reward the expression of this aversion).
      3.  Rationalization (Prefrontal Cortex generates a "principle" to justify the aversion).
      4.  Feedback Loop (The principle is reinforced, making the aversion feel more like a principle).
  *   **Why this comes third:** Now that they have the "feeling" (Phase 1) and the "training" (Phase 2), you can show how the two are stitched together into a false narrative of reasoning.

  ---

  ### **Phase 4: Applying the Example (20 mins)**
  **Goal:** Run the **Cognitive Enhancement** case through the laundering model.
  **Activity:**
  *   **Step 1 (The Principle):** Ask students to list principled objections to cognitive enhancers. (Expected: "Fairness," "Authenticity," "Merit").
  *   **Step 2 (The Aversion):** Ask them to introspect on the *feeling* of hearing someone admits to using Adderall to write a paper. Is it a math error? Or a visceral "ick"?
  *   **Step 3 (The Reverse):** Ask students who *support* enhancement. Is it a reasoned preference for liberty? Or a bias against traditional medical authority/stigma?
  *   **Why this comes fourth:** This is the synthesis. They must apply the mechanism to a concrete case to see the ambiguity.

  **$\rightarrow$ Intercept Misconception #3 (Consistency):**
  *   *When:* During Step 3 of the Activity.
  *   *The Move:* A student will say: "But I've felt this way for years; it's consistent."
  *   *The Point:* "Systematic error is still error." A compass that consistently points 5 degrees East due to magnetic interference is consistent but wrong. Consistency proves stability, not accuracy.

  ---

  ### **Phase 5: The Conceptual Check (10 mins)**
  **Goal:** Verify they understand the *structure* of the problem, not just the content.
  **The Question:**
  > "Imagine a society where a specific moral intuition (e.g., 'eating pork is wrong') is held with 100% consistency, articulated with sophisticated philosophical principles, and reinforced by all social institutions.
  >
  > **Based on the laundering model we discussed, what specific piece of evidence is still missing that would prevent us from classifying this as a laundered bias rather than a genuine moral preference?**"

  **Correct Answer Criteria:**
  *   They should **not** answer: "We need to know if pork is actually harmful." (That's meta-ethics/realism, which you excluded).
  *   They **should** answer: "We need access to the **causal history** of the judgment." OR "We need to know if the principle survives when the visceral aversion is removed (e.g., via habituation or neural dampening)."
  *   *Why:* This confirms they understand that the *problem* is epistemic access to the genealogy of the judgment, not the truth value of the judgment itself.

  ---

  ### **Explicit Exclusions (Write these on the board)**
  To keep the session focused on the *mechanism* of laundering rather than getting bogged down in standard philosophy debates, explicitly refuse to cover:
  1.  **Meta-Ethical Realism vs. Anti-Realism:** We are not asking if moral truths *exist*; we are asking how humans *claim* to access them.
  2.  **Normative Ethics (Utilitarianism vs. Deontology):** We are not evaluating which principles are *correct*; we are evaluating how principles are *generated*.
  3.  **The History of Preference Theory:** We are treating "preference" as a psychological construct for this hour, not an economic or historical one.

  ### **Instructor Notes for Delivery**
  *   **Tone:** Keep it clinical. You are a mechanic showing them the engine, not a preacher telling them what to drive.
  *   **Pushback:** If they argue that *some* moral judgments are real, concede the point but reiterate: "Even if 50% are real, can you identify which 50% without knowing the laundering history? That's the epistemic gap."
  *   **Time Management:** If Phase 4 runs long, cut Phase 2's spicy food analogy short. The Cognitive Enhancement application is the critical payload.
