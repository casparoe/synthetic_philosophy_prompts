prompt: |-
  Draft the joint statement that a year-long adversarial collaboration could produce between two philosophers of historiography who have spent that year talking past each other about the claim that history is written by the victors.

  One of them — the archival objectivist — holds that the surviving documentary and material record constrains admissible narrative tightly enough that a victor's advantage is mostly one of emphasis, diffusion, and prestige rather than of fact; that professional source criticism, foreign and subaltern archives, and physical evidence have repeatedly overthrown official victor narratives; and that the slogan quietly runs together a causal story about which sources survived with a reason for doubting what they say.

  The other — the power-and-narrative constructivist — holds that victors shape not only which documents survive but the categories in terms of which any document gets read: the periodization, the boundaries of the event, what counts as a side, who is treated as an agent and who as backdrop. On this view source criticism conducted inside those categories cannot fully correct the bias, and the currency of an account tracks institutional power more than evidential support.

  What I want is the document, not a map of the debate. Give me: a numbered section of claims both could actually sign, including about what the thesis is claiming in the first place, about how much of the surviving record is victor-produced, and about whether historiography has in fact corrected official accounts; then a table of the residual disagreements, each row phrased in the wording its own side would accept and with the other side's formulation beside it; then the cruxes, and for each crux the test, case, or body of evidence both would agree bears on it, with each side's prediction written down in advance.

  On the cruxes, here is where I suspect they lie — keep, revise, or replace them as you see fit. One: the losers-litigation asymmetry. Defeated parties often produce more and better-circulated exculpatory memoirs, and stories of defeat travel better than stories of consolidation, so in some corpora the bias may run against the victors; both parties should say what pattern in the citation and translation record would confirm which. Two: the self-critical victor. When an official historiography publishes material damaging to its own side, does that count against the thesis, and if not, has the thesis been qualified into unfalsifiability? Three: how much of the dispute is verbal, turning on a slide from a causal claim about why we hold the beliefs we do to an epistemic claim about what we are entitled to believe.

  Close with a short note on how confident you are that a genuine adherent of each camp would sign each section, and single out the one formulation you are least sure is free of slant.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Task:** Draft a joint statement resulting from a year-long adversarial collaboration between two philosophers of historiography.
      *   **Topic:** The claim "History is written by the victors."
      *   **Characters:**
          *   *Archival Objectivist (AO):* Believes evidence constrains narrative; victor bias is about emphasis/prestige, not fact; source criticism works; slogan conflates survival causality with epistemic doubt.
          *   *Power-and-Narrative Constructivist (PNC):* Believes victors shape categories/periodization/agency; source criticism inside biased categories fails; currency of accounts tracks power, not evidence.
      *   **Required Structure:**
          1.  Numbered section of agreed claims (thesis definition, record composition, correction capability).
          2.  Table of residual disagreements (Side A wording vs. Side B wording).
          3.  Cruxes (with agreed tests/cases/evidence and pre-registered predictions for each side).
          4.  Closing note on confidence levels and the "least sure" formulation.
      *   **Specific Cruxes to Address/Refine:**
          1.  *Losers-Litigation Asymmetry:* Do losers write more/better memoirs? Does defeat travel better?
          2.  *Self-Critical Victor:* Does official historiography damaging its own side falsify the thesis?
          3.  *Verbal Dispute:* Causal claim (why we believe) vs. Epistemic claim (what we are entitled to believe).
      *   **Tone:** Professional, philosophical, precise, collaborative but acknowledging deep divergence.

  2.  **Drafting - Section 1: Agreed Claims:**
      *   *Goal:* Find common ground without watering down the positions so much they become meaningless.
      *   *Point 1 (Definition):* Need to clarify the slogan. It's not literally that *only* victors write. It's about influence.
      *   *Point 2 (The Record):* Both agree victors produce *more* official records, but disagree on the *effect*. Let's agree on the raw fact: victors control state archives, but losers often produce private memoirs.
      *   *Point 3 (Correction):* Both agree historiography *can* correct narratives, but disagree on the *limit* of that correction.
      *   *Drafting thought:* Make sure the AO doesn't sound like a naive positivist and the PNC doesn't sound like a radical relativist. They are philosophers of historiography, after all. They respect the discipline.

  3.  **Drafting - Section 2: Residual Disagreements (Table):**
      *   *Goal:* Show the divergence clearly.
      *   *Row 1 (Nature of Bias):* AO sees it as selection/emphasis. PNC sees it as constitutive/categorical.
      *   *Row 2 (Source Criticism):* AO sees it as a corrective tool. PNC sees it as limited by the framework.
      *   *Row 3 (Truth/Currency):* AO thinks evidence drives acceptance. PNC thinks power drives acceptance.
      *   *Wording:* Must use terminology each side accepts. AO: "Evidential constraint," "Admissible narrative." PNC: "Discursive formation," "Hegemonic categories."

  4.  **Drafting - Section 3: Cruxes (The Core Challenge):**
      *   *Goal:* Identify where the rubber meets the road. What evidence would change minds?
      *   *Crux 1 (The Loser's Voice):* The prompt suggests losers might write more.
          *   *Test:* Citation analysis of post-conflict historiography (e.g., US Civil War, WWII).
          *   *AO Prediction:* Loser memoirs are cited but corrected by material evidence.
          *   *PNC Prediction:* Loser memoirs are cited only when they fit victor categories or are exoticized.
      *   *Crux 2 (Self-Critical Victor):* When the victor critiques themselves.
          *   *Test:* Declassification events or official apologies (e.g., Winter Soldier, My Lai, Colonial archives).
          *   *AO Prediction:* This proves the system works (source criticism overrides power).
          *   *PNC Prediction:* This is power managing its legitimacy (controlled release).
      *   *Crux 3 (Causal vs. Epistemic):* The "Verbal Dispute."
          *   *Test:* Cases where high-evidence accounts fail to gain currency vs. low-evidence accounts that do.
          *   *AO Prediction:* Low-evidence accounts fade over time.
          *   *PNC Prediction:* Low-evidence accounts persist if they serve power interests.
      *   *Refinement:* Ensure the "Test" is something empirical they can actually look at together.

  5.  **Drafting - Section 4: Closing Note:**
      *   *Goal:* Meta-commentary on the draft itself.
      *   *Confidence:* High on the agreements, lower on the specific wording of the disagreements (always a risk of smuggling in bias).
      *   *Least Sure:* Probably the PNC's formulation in the table. It's easy to make them sound too conspiratorial. Need to ensure it sounds structural, not intentional.

  6.  **Review and Refine:**
      *   *Check:* Did I address the "Losers-Litigation Asymmetry"? Yes, in Crux 1.
      *   *Check:* Did I address "Self-Critical Victor"? Yes, in Crux 2.
      *   *Check:* Did I address "Causal vs. Epistemic"? Yes, in Crux 3.
      *   *Tone Check:* Is it dry enough? Yes. Does it sound like philosophers? Hopefully.
      *   *Constraint Check:* "Give me the document, not a map." Okay, no introductory fluff explaining the task. Just the document.

  7.  **Final Polish:**
      *   Ensure the "Joint Statement" header looks official.
      *   Make sure the table is clear.
      *   Verify the predictions are falsifiable (or at least testable).
      *   *Self-Correction on Crux 1:* The prompt mentions "losers-litigation asymmetry." I need to make sure I capture the idea that losers might actually dominate the *narrative* in some cases (e.g., The Lost Cause, though that's a mix of power and loss). Let's focus on the *volume* of exculpatory material vs. its *uptake*.
      *   *Self-Correction on Crux 2:* Make sure the PNC doesn't just say "it's all a trick." It's about the *conditions of possibility* for that critique.
      *   *Self-Correction on Closing:* Be honest about the difficulty of neutral language.

  8.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
