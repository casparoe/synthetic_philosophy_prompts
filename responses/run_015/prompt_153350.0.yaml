  # JOINT STATEMENT ON THE THESIS "HISTORY IS WRITTEN BY THE VICTORS"
  **Signed:** Dr. Elena Vance (Archival Objectivism) & Dr. Marcus Thorne (Power-and-Narrative Constructivism)
  **Date:** October 14, 2023
  **Subject:** Findings of the Adversarial Collaboration on Historiographical Bias (2022–2023)

  ## I. AGREED CLAIMS
  *The following propositions represent the minimum consensus reached after twelve months of dialectical exchange. Both signatories affirm these claims as accurate descriptions of the current state of the field and the logical structure of the debate.*

  1.  **Definition of the Thesis:** The slogan "history is written by the victors" is not a literal claim that defeated parties produce no texts. Rather, it is a claim about the **asymmetric durability and uptake** of narratives. Both parties agree the thesis asserts a correlation between political/military hegemony and the canonical status of historical accounts, though we disagree on the mechanism (epistemic constraint vs. discursive hegemony).
  2.  **Composition of the Record:** We agree that victors disproportionately control **state archives, official correspondence, and material infrastructure** (monuments, mapping data) immediately post-conflict. However, we also agree that defeated parties often generate a disproportionate volume of **exculpatory memoirs, private correspondence, and oral testimony** in the immediate aftermath, driven by the need to justify failure.
  3.  **Corrective Capacity:** We agree that professional historiography has successfully overturned official victor narratives in specific instances (e.g., the revision of Reconstruction historiography, the exposure of colonial atrocities). We disagree on whether these corrections represent the **normative functioning** of the discipline (Objectivist view) or **exceptional ruptures** that leave the underlying categorical framework intact (Constructivist view).
  4.  **Distinction of Causes:** We agree that the thesis conflates two distinct claims which must be analytically separated:
      *   *The Causal Claim:* Political victory determines which sources survive and are amplified.
      *   *The Epistemic Claim:* Political victory determines the truth-value or justifiability of the resulting narrative.
      *   *Consensus:* A high correlation between victory and narrative dominance does not automatically entail the falsity of that narrative, nor does it automatically justify belief in it.

  ## II. RESIDUAL DISAGREEMENTS
  *Where consensus was unreachable, we present the divergent formulations side-by-side. Each side accepts its own column as accurate and the opposing column as a intelligible but mistaken characterization of the mechanism at work.*

  | Domain of Dispute | Archival Objectivist Formulation (Vance) | Power-and-Narrative Constructivist Formulation (Thorne) |
  | :--- | :--- | :--- |
  | **Nature of Bias** | Bias operates primarily through **selection and emphasis**. The victor highlights their own agency and minimizes their atrocities, but the raw data of the event remains accessible to cross-examination. | Bias operates through **categorization and periodization**. The victor defines what counts as an "event," who counts as an "agent," and when the conflict "began," rendering some facts unintelligible before selection occurs. |
  | **Role of Criticism** | Source criticism is a **neutralizing technology**. By triangulating victor archives with subaltern records and material evidence, the historian can isolate and remove the "victor's gloss." | Source criticism is a **bounded practice**. It operates within the conceptual grid provided by the victor; it can correct details but cannot easily challenge the architecture of the narrative itself. |
  | **Currency of Accounts** | The longevity of a historical account tracks its **evidential support**. Narratives unsupported by the material record tend to decay over time, regardless of political utility. | The longevity of a historical account tracks its **institutional utility**. Narratives that sustain current power structures are maintained through funding, curriculum, and archive prioritization, regardless of evidential decay. |
  | **The "Loser's Voice"** | The "loser's lament" is a distinct genre that is often **over-represented** in cultural memory due to its tragic resonance, acting as a counter-weight to official victory reports. | The "loser's lament" is only admitted into the canon when it **confirms the victor's magnanimity** or frames the defeat as inevitable, thereby reinforcing the victor's legitimacy. |

  ## III. CRUXES AND PRE-REGISTERED PREDICTIONS
  *We identify three empirical cruxes where our theories generate divergent predictions. We agree on the body of evidence to be examined and the metrics for evaluation.*

  ### Crux 1: The Losers-Litigation Asymmetry
  **The Issue:** Does the volume of exculpatory material produced by the defeated translate into historiographical influence, or is it systematically marginalized?
  **The Test:** A citation network analysis of the top 50 academic monographs and secondary school curricula regarding three conflicts: The US Civil War (1865–1890), The Franco-Prussian War (1871–1900), and The Vietnam War (1975–2000).
  **Metric:** Ratio of citations to "Victor Official Records" vs. "Defeated Party Memoirs/Archives" and the *context* of those citations (confirming vs. challenging).

  | Signatory | Prediction |
  | :--- | :--- |
  | **Vance (Objectivist)** | Defeated party memoirs will show **high citation frequency** comparable to victor records. While the *conclusions* may favor the victor, the *data* from the losers will be utilized extensively to correct the official record (e.g., Confederate letters used to explain Union strategy). |
  | **Thorne (Constructivist)** | Defeated party memoirs will be cited primarily as **object of study** (e.g., "how the losers felt") rather than **evidentiary source** (e.g., "what happened"). Their uptake will correlate with periods where the victor's power is secure enough to tolerate dissent without risk. |

  ### Crux 2: The Self-Critical Victor
  **The Issue:** When a victor state publishes materials damaging to its own legitimacy (e.g., My Lai, Colonial torture files), does this falsify the "written by victors" thesis?
  **The Test:** Comparative analysis of the reception and integration of state-declassified damaging documents in Post-WWII Germany vs. Post-WWII USA vs. Post-Colonial France.
  **Metric:** Time-lag between declassification and integration into standard national narrative; and the "containment" of the damage (does it shift the whole narrative or become a footnote?).

  | Signatory | Prediction |
  | :--- | :--- |
  | **Vance (Objectivist)** | The release of damaging documents proves the thesis is **false as an epistemic claim**. The professional apparatus prioritizes evidence over power; the narrative shifts to accommodate the truth, demonstrating that victory does not guarantee immunity from correction. |
  | **Thorne (Constructivist)** | The release is a **legitimacy-management strategy**. The prediction is that damaging documents will be integrated only in ways that preserve the core "heroic" or "necessary" framing of the conflict (e.g., "aberration" vs. "systemic"). The thesis holds if the *structure* of the narrative remains intact despite the new facts. |

  ### Crux 3: Causal vs. Epistemic Drift
  **The Issue:** Is the dispute merely verbal? Does the slogan explain *why we believe* (sociology) or *what we should believe* (epistemology)?
  **The Test:** A survey of historiographical reviews in top journals (e.g., *AHR*, *Past & Present*) evaluating books that challenge national myths.
  **Metric:** Frequency of rejection/critique based on "lack of evidence" vs. "political implausibility" vs. "methodological innovation."

  | Signatory | Prediction |
  | :--- | :--- |
  | **Vance (Objectivist)** | Rejections of revisionist accounts will track **methodological failures** (source misreading, lack of corroboration). If a revisionist account has strong evidence, it will be accepted regardless of its challenge to the victor's myth. |
  | **Thorne (Constructivist)** | Rejections of revisionist accounts will track **categorical incommensurability**. Accounts will be dismissed not for lack of data, but for failing to speak the "language of the discipline" (which is victor-coded), even when the data is robust. |

  ## IV. CONFIDENCE NOTE & REFLECTION
  *Appended by the Collaborators*

  **Confidence in Agreement:** We are highly confident (90%+) that a genuine adherent of either camp could sign Section I (Agreed Claims). These distinctions regarding the causal/epistemic split and the composition of the record are standard fare in advanced methodology seminars, even if interpreted differently.

  **Confidence in Disagreements:** We are moderately confident (75%) in Section II (Table). There is a persistent risk that the Objectivist column sounds more rational than intended, or the Constructivist column sounds more conspiratorial than intended. We have attempted to use structural language ("categorization," "institutional utility") to mitigate this.

  **Least Sure Formulation:** The formulation in **Section III, Crux 2 (Thorne's Prediction)** is the one we are least sure is free of slant.
  *Reasoning:* It is difficult to phrase the Constructivist prediction that "self-criticism is legitimacy management" without implying a level of intentionality or cynicism that a sophisticated Constructivist might reject. A Constructivist might argue the state is not a unitary agent "managing" legitimacy, but rather that the *discursive conditions* simply make other forms of admission unintelligible. The wording "legitimacy-management strategy" risks smuggling in a rational-choice actor model that Thorne might actually reject in favor of a Foucaultian dispersion of power. We retained it for clarity of prediction, but flag it as the weakest link in the statement's neutrality.

  ***

  **Signed,**

  *Elena Vance*
  *Marcus Thorne*
