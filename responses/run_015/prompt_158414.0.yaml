answer: |-
  A disciple approaches the Sage of the *caritas sapientis* and asks, "Master, how do you perform the moral arithmetic of universal happiness? Each monad presents an incommensurable perspective on perfection, and none can be reduced to a single aggregate measure."

  The Sage replies, "I sat down to calculate the optimal distribution of charity across the infinite hierarchy."

  "And what was the result?"

  "The total harmony was exactly what it was before I began the calculation."

  "Then why calculate?"

  "Because the calculation was not to adjust the world, but to adjust my perception until I saw that the world required no adjustment."
