answer: |-
  # The Time Travel Metaphysics Decision Tree

  This tree is structured by your four diagnostic questions. Follow the path that matches the rules you wish to impose on your universe. The endpoints (Leaves) define the specific metaphysical position, the narrative cost, and the implications for your plot.

  ### **ROOT: Time Travel is Possible**

  #### **BRANCH 1: Can the past be changed?**
  *   **NO (Fixed):** The timeline is resistant to alteration.
  *   **YES (Mutable):** The timeline accepts alteration.

  ---

  #### **PATH A: FIXED TIMELINE (No Change)**
  *Follow this path if attempts to change history either fail or were always part of history.*

  **Q2: What prevents the change?**
  *   **Logical Impossibility:** Contradictions cannot exist (e.g., you cannot kill a grandfather because you exist).
  *   **Physical Constraint:** Physics bends probability to prevent contradictions (e.g., guns jam, you slip).
  *   **Interaction Limit:** You can observe but not interact with matter.

  **Q4: Is there Hyper-time (a second temporal dimension)?**
  *   **No (Block Universe):** All moments exist simultaneously; "change" is an illusion of perspective.
  *   **Yes (Meta-Time):** There is a higher time, but the timeline is rigid within it.

  > **LEAF 1: The Eternalist Block**
  > *   **Answers:** Fixed + Logical + No Hyper-time.
  > *   **Cost:** Forecloses all suspense regarding historical outcomes, forcing you to derive tension solely from the characters' ignorance of their own inevitability.
  >
  > **LEAF 2: The Novikov Constraint**
  > *   **Answers:** Fixed + Physical + No Hyper-time.
  > *   **Cost:** Forces you to engineer elaborate coincidences to explain why change attempts fail, which can strain reader belief if overused.
  >
  > **LEAF 3: The Phantom Observer**
  > *   **Answers:** Fixed + Interaction Limit + No Hyper-time.
  > *   **Cost:** Removes the protagonist's agency to affect the plot, reducing the story to a mystery or tragedy where they can only watch.
  >
  > **LEAF 4: The Scripted Meta-History**
  > *   **Answers:** Fixed + Physical + Yes Hyper-time.
  > *   **Cost:** Requires explaining why a second dimension of time exists if it permits no actual branching or changing, adding exposition without narrative payoff.

  ---

  #### **PATH B: MUTABLE TIMELINE (Change Possible)**
  *Follow this path if actions in the past can alter the future.*

  **Q2: How are contradictions resolved?**
  *   **Branching:** A new timeline splits off; the old one remains (or is abandoned).
  *   **Overwriting:** The old timeline is erased and replaced by the new one.

  **Q3: Does the traveler survive the change?**
  *   **Persist:** The traveler retains memories/existence despite the past changing.
  *   **Erase:** The traveler fades or vanishes if their origin is negated.
  *   **N/A:** (For Branching, the traveler always persists in the new branch).

  **Q4: Is there Hyper-time?**
  *   **No:** All branches/timelines coexist in a static multiverse block.
  *   **Yes:** Changes unfold over a meta-time (one timeline replaces another sequentially).

  > **LEAF 5: The Divergent Fork**
  > *   **Answers:** Mutable + Branching + Persist + No Hyper-time.
  > *   **Cost:** Undercuts the stakes of "saving the world," as the original ruined world still exists elsewhere, merely abandoned.
  >
  > **LEAF 6: The Multiverse Tunnel**
  > *   **Answers:** Mutable + Branching + Persist + Yes Hyper-time (Accessible).
  > *   **Cost:** Demands complex exposition to explain how travelers navigate between branches without creating infinite regression loops.
  >
  > **LEAF 7: The Plastic History**
  > *   **Answers:** Mutable + Overwriting + Persist + Yes Hyper-time.
  > *   **Cost:** Requires you to justify why the traveler is immune to causality when everyone else is not, often feeling like a special plea for the protagonist.
  >
  > **LEAF 8: The Causal Fade**
  > *   **Answers:** Mutable + Overwriting + Erase + Yes Hyper-time.
  > *   **Cost:** Threatens the narrative point of view, as a successful mission could literally delete the protagonist from existence mid-scene.
  >
  > **LEAF 9: The Reality Wave**
  > *   **Answers:** Mutable + Overwriting + Persist + Propagating Change (Implicit Hyper-time).
  > *   **Cost:** Forces a race-against-time structure where the traveler must outrun the ripple effect of their own changes, which can dominate pacing.
  >
  > **LEAF 10: The Absorbing Timeline**
  > *   **Answers:** Mutable + Overwriting + Merge + Yes Hyper-time.
  > *   **Cost:** Compels you to map exactly which memories survive the merge, creating potential continuity errors that attentive readers will spot.

  ---

  ### **Indistinguishable Pairs**
  *These positions answer the diagnostic questions identically but remain philosophically distinct. For storytelling purposes, they function the same, though the "why" differs.*

  1.  **Leaf 1 (Eternalist Block) vs. Leaf 2 (Novikov Constraint):**
      *   **Distinction:** Leaf 1 says change is *logically impossible* (like a square circle); Leaf 2 says change is *physically prevented* (like a gun jamming).
      *   **Narrative Impact:** Indistinguishable in plot outcome (the past remains fixed), but Leaf 2 allows for scenes where the universe actively "fights" the traveler, whereas Leaf 1 implies the traveler never truly had the option to fight.
  2.  **Leaf 5 (Divergent Fork) vs. Leaf 6 (Multiverse Tunnel):**
      *   **Distinction:** Leaf 5 implies branches are static and separate; Leaf 6 implies a meta-structure allowing travel between them.
      *   **Narrative Impact:** If the story never involves returning to a previous branch, these are functionally identical. The distinction only matters if the plot requires hopping between created timelines.

  ### **Undefended Combinations**
  *These are logically possible combinations of answers that no major theory defends, usually due to incoherence or lack of narrative utility.*

  1.  **Mutable + Overwriting + No Hyper-time:**
      *   **Why Undefended:** Incoherent. If there is no second temporal dimension (hyper-time) for the change to occur *in*, there is no moment where the old timeline exists and the new one replaces it. It requires a "time for time to change," which is exactly what hyper-time provides.
  2.  **Mutable + Branching + Erasure:**
      *   **Why Undefended:** Unattractive/Incoherent. If branching occurs, the original timeline (and the traveler's origin) still exists in the multiverse. There is no causal reason for the traveler to vanish just because they stepped into a new branch, unless you arbitrarily impose "Causal Fade" rules on a Branching model.
  3.  **Fixed + Mutable:**
      *   **Why Undefended:** Logical Contradiction. A timeline cannot be both resistant to change and accepting of change simultaneously. (Some stories try to hybridize this by saying "some things are fixed, some mutable," but this requires a meta-rule explaining the distinction, effectively creating a Branching model with heavy constraints).

  ### **Storyteller's Note on Selection**
  *   **Choose Path A (Fixed)** if your theme is **Fate, Acceptance, or Knowledge**. The horror comes from knowing you cannot save them.
  *   **Choose Path B (Mutable)** if your theme is **Responsibility, Consequence, or Grief**. The horror comes from knowing you *can* save them, but the cost might be yourself (Leaf 8) or the world you knew (Leaf 5).
  *   **Avoid Leaf 9 (Reality Wave)** unless you want a thriller pacing; it forces a clock on every scene.
  *   **Avoid Leaf 4 (Scripted Meta-History)** unless the existence of Hyper-time is a plot point itself; otherwise, it is metaphysical baggage with no narrative return.
