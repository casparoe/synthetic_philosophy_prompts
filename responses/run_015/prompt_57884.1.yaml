answer: |-
  Here is a complete lesson plan designed for your 75-minute discussion section. It focuses on experiential learning first, theory second.

  # Activity: The Truth Penalty Game

  **Goal:** Students will experience how violating probability norms (like assigning 0.7 to a claim and 0.7 to its negation) guarantees a worse score than a coherent strategy, regardless of how the world turns out.
  **Time:** 75 Minutes
  **Class Size:** 16 Students (4 Teams of 4)

  ## 1. Materials Needed
  *   **One large die and a cup** (to hide the roll until reveal).
  *   **Whiteboard and markers** (for the leaderboard).
  *   **Score Sheets** (printed or drawn on notebook paper): Columns for *Round*, *Credence in Even*, *Credence in Odd*, *Final Score*.
  *   **Stakes:** A bag of high-quality candy (e.g., Hershey's Kisses) or poker chips.
      *   *Payoff:* The team with the highest total score across all rounds gets first pick from the candy bag. The team with the lowest score has to put one piece of candy back in the bag (or just gets "bragging rights" for avoiding the penalty).
  *   **Calculators:** Allow phone calculators. The math needs to be frictionless.

  ## 2. Timing Overview
  *   **0:00–0:10:** Setup & Rules (No jargon).
  *   **0:10–0:25:** Round 1 (Gut Instinct).
  *   **0:25–0:40:** Round 2 (Strategy Adjustment).
  *   **0:40–0:50:** Round 3 (The "Lock-In").
  *   **0:50–1:00:** Final Scoring & Reveal.
  *   **1:00–1:15:** Debrief & Connection to Theory.

  ## 3. Game Rules (Read Aloud)
  *Do not use words like "probability," "coherence," "axioms," or "scoring rule."*

  1.  **The Setup:** "We have a die in this cup. I will roll it at the end of class. For now, it has a hidden value."
  2.  **The Claims:** "There are two statements about the die:"
      *   **Statement A:** "The die shows an Even number (2, 4, 6)."
      *   **Statement B:** "The die shows an Odd number (1, 3, 5)."
  3.  **The Task:** "In each round, your team must assign a number between 0.00 and 1.00 to each statement. This number represents how confident you are that the statement is true. Let's call this your 'Confidence Score.'"
  4.  **The Penalty:** "You start each round with **100 Points**. Once I reveal the die, I will calculate your penalty."
      *   "If a statement is **True** (value 1), your penalty is: $(\text{Your Score} - 1)^2 \times 100$."
      *   "If a statement is **False** (value 0), your penalty is: $(\text{Your Score} - 0)^2 \times 100$."
      *   "Subtract the penalties for *both* statements from your 100 points. That is your Round Score."
  5.  **The Goal:** "Maximize your total points across three rounds. The highest score wins the candy."

  *(TA Tip: Write the penalty formula clearly on the board. Example: If you write 0.70 and the statement is False, penalty is $0.70^2 \times 100 = 49$ points.)*

  ## 4. Running the Rounds

  **Round 1 (15 mins): The Gut Check**
  *   Tell teams: "Discuss and pick your Confidence Scores. You have no constraints other than they must be between 0 and 1."
  *   Collect the numbers. Write them on the board.
  *   *Do not roll the die yet.*
  *   **Crucial Step:** Look for a team that assigned high confidence to *both* (e.g., 0.8 Even / 0.8 Odd) or low confidence to *both* (e.g., 0.2 Even / 0.2 Odd). If everyone is coherent (sums to 1.0), gently nudge one team: "Try being super confident in both for this round. See what happens."
  *   Move to Round 2.

  **Round 2 (15 mins): The Correction**
  *   Tell teams: "Look at Round 1's numbers. You can change them however you like for Round 2. But before you lock them in, ask yourselves: Is there a pair of numbers that would lose *fewer* points no matter what the die shows?"
  *   Let them discuss. They will likely start summing their numbers to 1.0.
  *   Collect numbers.
  *   Move to Round 3.

  **Round 3 (10 mins): The Lock-In**
  *   Tell teams: "This is the final round. Points count double. Choose wisely."
  *   Collect numbers.

  **Scoring & Reveal (10 mins)**
  *   Roll the die in the cup. Reveal the number (e.g., 4).
  *   **Truth Values:** Even = 1 (True), Odd = 0 (False).
  *   Calculate scores live on the board.
  *   **The Reveal:** Highlight the team that played incoherently in Round 1 (e.g., 0.8/0.8).
      *   Show the class: "Team X got 42 points. Team Y (who played 0.5/0.5) got 50 points."
      *   Ask: "If the die had been Odd instead, would Team X have done better?"
      *   Do the quick math on the board. (As calculated in the thought process, 0.8/0.8 yields 42 points regardless of outcome. 0.5/0.5 yields 50 points regardless of outcome).
      *   **The Kicker:** "Team Y beat Team X in *every possible world*. It didn't matter what was in the cup."

  ## 5. Debrief Script (25 Minutes)

  *Transition from game to philosophy. Now you can use the jargon.*

  **Part 1: Naming the Mechanism (5 mins)**
  "Okay, put the candy away. Let's talk about what just happened. You were trying to minimize your penalty. In philosophy, we call that penalty **inaccuracy**. The formula you used—squaring the distance from the truth—is called the **Brier Score**. It's a way of measuring how 'far away' your belief is from reality."

  "Notice what happened to the team that put 0.8 on Even and 0.8 on Odd. They wanted to be safe, or maybe they just really believed in the die. But mathematically, they guaranteed themselves a lower score than the team that put 0.5 and 0.5."

  **Part 2: Dominance and Probabilism (10 mins)**
  "This is the core argument of **Accuracy-First Epistemology**. Philosophers like Jim Joyce argue that the fundamental norm of belief is to be accurate. But since we don't know the truth yet, we should aim to minimize *expected* inaccuracy."

  "When you assigned 0.8 to both, you violated a rule: **Probabilism**. You treated the probability of 'Even' and 'Odd' as if they didn't have to add up to 1. The game showed you something called **Dominance**. There was a different set of beliefs (0.5/0.5) that would have performed *better* than your set (0.8/0.8) in *every possible outcome*."

  "If your goal is truth, and you hold beliefs that are dominated—meaning there is an alternative belief that gets you closer to the truth no matter what happens—you are essentially sabotaging yourself. You don't need to know the future to know you made a mistake."

  **Part 3: Addressing the Roommate's Objection (5 mins)**
  "Earlier, some of you might have thought, 'Why does it matter if I'm 0.7 on both? Maybe I'm just really unsure.' But the game showed that 'being unsure' (0.5/0.5) actually gets you closer to the truth on average than 'being confidently confused' (0.7/0.7)."

  "The math isn't just hand-waving. It's a proof that if you care about accuracy, you *must* obey the laws of probability. If you don't, there is always a 'Dutch Book' or a 'Dominance Argument' waiting to show you a better way to track the truth."

  **Part 4: Limitations (5 mins)**
  "However, I need to be honest about what this game *didn't* do."
  1.  **Expected vs. Actual:** "In the game, we calculated accuracy after the fact. In real life, we need to minimize *expected* inaccuracy before we know the truth. The math holds, but the feeling is different."
  2.  **The Scoring Rule:** "We used squared error. Why not just absolute error? It turns out squared error is one of the few rules that *forces* you to be probabilistic. If we used a different penalty, the norms might change. Defending *this* specific penalty is a whole other debate."
  3.  **Pragmatics:** "This game ignores utility. Sometimes being accurate doesn't matter as much as being safe. But if your *only* goal is truth, probability is the tool."

  ## 6. Troubleshooting: What Will Go Wrong

  **Problem 1: Math Anxiety / Slow Calculation**
  *   **Symptom:** Students stare at phones, round numbers incorrectly, or lose interest during scoring.
  *   **Fix:** Pre-calculate a "Lookup Table" on the handout.
      *   *Credence 0.5 → Penalty 25 (if False) / 25 (if True)*
      *   *Credence 0.7 → Penalty 49 (if False) / 9 (if True)*
      *   *Credence 0.8 → Penalty 64 (if False) / 4 (if True)*
      *   *Credence 1.0 → Penalty 100 (if False) / 0 (if True)*
      *   Let them just look up the penalty instead of squaring decimals.

  **Problem 2: Everyone Plays Coherently Immediately**
  *   **Symptom:** In Round 1, every team sums to 1.0. You lose the "Dominance" comparison.
  *   **Fix:** You need a "Chaos Round." In Round 1, force one team (privately) to play 0.9 on Both. Tell them it's a "special challenge." Or, during the debrief, run a hypothetical: "Imagine Team Z played 0.9/0.9. Let's calculate their score vs. Team A's 0.5/0.5." Do the math on the board as a thought experiment.

  **Problem 3: "This is just gambling, not belief."**
  *   **Symptom:** Students dismiss the credences as guesses rather than genuine beliefs.
  *   **Fix:** In the debrief, reframe it. "When you checked the weather app and saw 70% rain, did you carry an umbrella? That 0.7 guided your action. In this game, the points guided your action. The structure is the same. If your 0.7 rain chance + 0.7 sun chance doesn't add up, you'll pack the wrong gear no matter the weather."

  **Problem 4: Running Out of Time**
  *   **Symptom:** Scoring takes too long.
  *   **Fix:** Do not calculate every team's score for every round. Calculate Round 1 for the "Incoherent Team" and the "Coherent Team" only. Use those two as the case study. Award candy based on a quick tally of Round 3 only.

  ## 7. What This Game Cannot Reproduce (Honesty Check)

  You asked for honesty about the limitations. Here is what you will need to explain verbally because the game cannot simulate it:

  1.  **Justification of the Scoring Rule:** The game *assumes* squared error is the right way to measure inaccuracy. It doesn't prove *why* we should care about squared error rather than absolute error. You have to lecture that squared error is "strictly proper," meaning it incentivizes honesty. The game just enforces it.
  2.  **Subjective Expectation:** The game shows *actual* inaccuracy (after the die roll). Accuracy-first epistemology is about *expected* inaccuracy (before the roll). The leap from "I lost points" to "I should have anticipated losing points" requires an explanation of expectation values that the game glosses over.
  3.  **Logical Omniscience:** The game uses simple logic (Even/Odd). Real epistemology deals with complex logical connections students might not see. The game makes coherence look easy; in reality, recognizing incoherence in complex belief systems is cognitively demanding.

  ## 8. TA Cheat Sheet (For the Board)

  **Penalty Lookup (Multiply by 100)**
  | Credence | If FALSE (0) | If TRUE (1) |
  | :--- | :--- | :--- |
  | **0.0** | 0 | 100 |
  | **0.2** | 4 | 64 |
  | **0.5** | 25 | 25 |
  | **0.7** | 49 | 9 |
  | **0.8** | 64 | 4 |
  | **1.0** | 100 | 0 |

  **The Dominance Proof (For Round 1 Debrief)**
  *   **Incoherent (0.7 / 0.7):**
      *   If Even: Penalty $9 + 49 = 58$. Score: **42**.
      *   If Odd: Penalty $49 + 9 = 58$. Score: **42**.
  *   **Coherent (0.5 / 0.5):**
      *   If Even: Penalty $25 + 25 = 50$. Score: **50**.
      *   If Odd: Penalty $25 + 25 = 50$. Score: **50**.
  *   **Result:** 50 is always better than 42.
