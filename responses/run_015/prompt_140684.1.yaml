      *   *Neurath's Blind Spot:* He assumed the *Transformer* was neutral/benevolent. He didn't account for the *politics of selection*. Choosing *which* curve to highlight is political.
      *   *Vagueness:* The lack of a time axis label allowed people to project their desired timeline (short pain vs. long slog).
