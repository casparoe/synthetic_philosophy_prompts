  8.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Academic but accessible, rigorous, matching the user's depth.
      *   *Structure:* Follow the prompt's flow (Confirmation -> Mapping -> The Two Cracks -> The Awkward One -> Conclusion).
      *   *Key Terminology:* Use "Transformator," "Vienna Method," "Logical Positivism," "Counterfactual."
      *   *Self-Correction during drafting:* Make sure I don't just praise Neurath. The prompt asks to be honest about silences. Emphasize that Neurath's socialism informed his belief in unity—2020 showed that visual unity can be co-opted.
      *   *Refining the "Modality" point:* Neurath wasn't just hostile to fiction; he was hostile to *unverifiable* statements. A model is unverifiable until it happens. ISOTYPE is retrospective. This is a fundamental clash.
      *   *Refining the "Institution" point:* The internet *is* an institution, but a decentralized one. ISOTYPE needs a curator. The lack of a "Visual CDC" was the failure.

  9.  **Final Polish:** Check against all constraints.
