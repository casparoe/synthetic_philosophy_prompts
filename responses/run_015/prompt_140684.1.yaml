  3.  **Map the Episode (Flatten the Curve via ISOTYPE):**

      *   *Transformer:* CDC/WHO initially, then every newsroom graphics desk (NYT, WaPo, local news). Unlike Arntz/Reidemeister, there was no central transformer.
      *   *Audience:* General public, policymakers.
      *   *Vocabulary:* X-axis (Time), Y-axis (Cases), Red Line (Unmitigated), Blue Line (Mitigated), Dashed Line (Healthcare Capacity).
      *   *Teaching:* Viewers had to learn: Dashed line = hospital beds (capacity), not "goal." Area under curve = total cases (often misunderstood). Flattening $\neq$ Eradicating.
      *   *Travel:* Theory explains clarity/simplicity. Theory *doesn't* explain viral spread via social media algorithms or political signaling.

  4.  **Deep Dive 1: Modality (Facts vs. Futures):**

      *   Neurath was an empiricist/logical positivist (Vienna Circle). ISOTYPE was for *social facts* (housing stats, unemployment numbers).
      *   "Flatten the Curve" is a *model projection*. It shows a counterfactual (what happens if we do nothing).
      *   *Conflict:* Neurath distrusted abstraction that detached from countable reality. A model is a "fiction" in his terms.
      *   *Resolution:* ISOTYPE struggles here. To show a model, you need text to explain "IF." Pure ISOTYPE can't show "might." It requires the "helping language" (text) to carry the modal weight. The chart alone lies by presenting a prediction as a visual fact.

  5.  **Deep Dive 2: Institution (Standardization vs. Chaos):**

      *   ISOTYPE required a "Transformator" (the team in Vienna) to ensure consistency.
      *   2020 had *no* Transformator. Every outlet tweaked colors, scales (log vs linear), and definitions (cases vs deaths).
      *   *Analysis:* This isn't just a failing of 2020; it exposes a structural requirement of ISOTYPE. Without a central authority (Museum/State) to enforce the "dictionary," the "language" fragments into dialects. The viral success *caused* the fragmentation.
      *   *Verdict:* The theory holds: A picture language *requires* an institution to remain a language. Without it, it's just art/illustration.

