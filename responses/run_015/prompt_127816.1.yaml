answer: |-
  To construct an adequate theory of why audiences value art depicting profound, unavoidable suffering, one must establish a set of necessary conditions that any explanation must satisfy. These desiderata are derived from the phenomenology of the experience, the structure of the artwork, and the ethical constraints of the viewer. Below is the complete specification of requirements, flagged by their necessity.

  **1. The Affective Coexistence Requirement**
  *   **Motivating Case:** A theory must explain how negative affect (sorrow, pity, fear) and positive evaluation (pleasure, satisfaction, value) occur simultaneously without canceling each other out. In lived experience, sorrow typically negates pleasure; in tragedy, they coexist.
  *   **Status:** **Non-negotiable.** Any theory that claims the pain is illusory or that the pleasure simply replaces the pain fails to describe the actual phenomenon of tragic engagement.

  **2. The Representational Buffer Requirement**
  *   **Motivating Case:** A theory must account for why sorrow pains us in lived experience yet pleases us in aesthetic form. This requires explaining the mechanism by which representation alters the ethical and emotional weight of suffering (e.g., the concept of catharsis through representation rather than action).
  *   **Status:** **Non-negotiable.** If a theory cannot distinguish between witnessing real suffering and witnessing represented suffering, it collapses into moral condemnation of the audience.

  **3. The Genre Differentiation Requirement**
  *   **Motivating Case:** A theory must distinguish tragic sorrow from the affective responses elicited by horror (revulsion/panic), melodrama (sensationalism/unearned emotion), or schadenfreude (malicious joy at another's pain). Tragedy involves a specific weighting of dignity and loss absent in these other modes.
  *   **Status:** **Non-negotiable.** Conflating tragedy with horror or melodrama renders the theory incapable of explaining why we value *King Lear* differently than a slasher film or a soap opera.

  **4. The Moral Agency Constraint**
  *   **Motivating Case:** A theory must preserve the audience's moral agency in judgment. We must remain moral agents who judge the protagonist's failure, rather than becoming complicit in the evil itself. Simultaneously, it must adhere to the constraint of no actual harm to real persons.
  *   **Status:** **Non-negotiable.** Ethical consistency demands that the enjoyment of art does not require the suspension of moral judgment or the infliction of real-world harm.

  **5. The Valuation Source Distinction**
  *   **Motivating Case:** A theory must preserve the distinction between pleasure derived from formal mastery (the beauty of the language, the structure of the plot) and pleasure that involves narrative complicity in the depicted suffering (the value of witnessing the truth of the collapse).
  *   **Status:** **Theoretical Preference.** Some camps argue all value is formal (aestheticism), while others argue value lies in the cognitive engagement with the suffering (cognitivism). An adequate theory must acknowledge this tension, though it may prioritize one source over the other.

  **6. The Causal Specificity Requirement**
  *   **Motivating Case:** A theory must distinguish between tragedies that turn on unavoidable moral failure and those that turn on remediable misfortune or contingent bad luck. The sorrow of a protagonist who destroys themselves through character flaws carries a different weight and value than the sorrow of a protagonist crushed by random fate.
  *   **Status:** **Non-negotiable.** A theory that treats all suffering as functionally identical fails to explain why we regard moral collapse as uniquely instructive or profound compared to mere accident.

  **7. The Cognitive Integration Constraint**
  *   **Motivating Case:** A theory must be consistent with contemporary psychological evidence that viewers integrate emotional response with judgments of artistic merit. We do not feel first and judge later; the judgment of merit shapes the emotional response.
  *   **Status:** **Non-negotiable.** Any theory relying on outdated models of emotional processing that separate feeling from thinking violates known mechanisms of emotional regulation and cognitive appraisal.

  **8. The Determinism vs. Variation Clause**
  *   **Motivating Case:** A theory must declare whether the emotional outcome is determined by the text itself or allows for individual variation based on the viewer's history and psychology.
  *   **Status:** **Theoretical Preference.** Strict formalists demand determinism of emotional outcome; reception theorists allow for individual variation. An adequate theory must specify its stance here rather than assuming universality where none exists.

  ***

  **The Most Damaging Desideratum**

  The single desideratum that does the most damage to popular theories is **The Causal Specificity Requirement (Number 6)**: the requirement to distinguish irreversible moral failure from remediable misfortune.

  Most popular theories rely on generalized mechanisms of empathy, pity, or fear. They posit that we feel pain because the protagonist suffers, and pleasure because we are safe or because the suffering is resolved. However, when the suffering is born of *irreversible moral failure* rather than bad luck, simple empathy models fracture. We cannot simply pity a protagonist who knowingly chooses evil; we must judge them. Theories that rely solely on "pity and fear" cannot account for the complex satisfaction derived from watching a moral collapse that is earned rather than accidental. This requirement forces a theory to explain not just why we tolerate suffering in art, but why we value *specific kinds* of suffering that implicate human agency. It invalidates any model that treats the audience as passive recipients of emotion rather than active judges of moral causality.

  Summary: An adequate theory of tragedy must non-negotiably explain the coexistence of pain and pleasure, distinguish moral failure from mere misfortune, and preserve moral agency without violating cognitive constraints.
