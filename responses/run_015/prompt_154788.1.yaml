answer: |-
  ### Teaching Plan: Popper's Poverty of Historicism for Data People

  **1. Sequence and Dependencies**
  You must establish the **validity of the initial model** before demonstrating its failure. If you start with the failure, data people will diagnose "bad features" or "overfitting." You need them to agree the model *was* good by the standards of 1985 so the failure forces a philosophical update, not a technical tweak.

  *   **Step 1: The In-Sample Fit (1900–1985).** Present Meridia's historical data. Show a tight fit between resource consumption and societal stability. Establish that the 1985 demographers were competent, using standard rigorous methods.
      *   *Dependency:* This must come first to rule out " incompetence" as the cause of failure.
  *   **Step 2: The Knowledge Injection (1985).** The forecast is published. Treat the publication not as news, but as a new data variable entering the system: "Public Knowledge of Collapse."
      *   *Dependency:* Must follow Step 1 to show the system was stable *until* this information existed.
  *   **Step 3: The Out-of-Sample Break (1985–2010).** Show the curve diverging. Resource usage decouples from the predicted collapse path due to rapid tech adoption and migration.
      *   *Dependency:* Must follow Step 2 to link the break to the information release.
  *   **Step 4: The Diagnosis (Unpredictable Knowledge).** Explain that the tech adoption wasn't just behavioral; it required new innovations (new knowledge) triggered by the crisis belief. Argue that you cannot model the *content* of future knowledge today.
      *   *Dependency:* This is the core Popperian move. It relies on Step 3 to show that the "missing variable" was future knowledge itself.
  *   **Step 5: The Generalization (No Laws of History).** Conclude that because knowledge growth is unpredictable, any law depending on it (i.e., all social history) cannot be deterministic.

  **2. Meridia Scenario Specifications**
  *   **Competence:** The forecasters must be **highly competent**. Use high R-squared values for the historical period. If they look like bad data scientists, the audience will conclude "build better models," not "historicism is impossible."
  *   **The Shift:** The shift must be **systemic adaptation**, not just intentional evasion. It shouldn't be "people tried to trick the model." It should be "people believed the model, invested in R&D, and accidentally invented a workaround."
  *   **What it must show:** A clear correlation between resource scarcity and collapse *prior* to 1985.
  *   **What it must lack:** It must lack any variable representing "future scientific discovery." The model should treat technology as a fixed function of capital, not an unpredictable variable.
  *   **Intentionality:** The shift should **not** be purely intentional. If it's purely intentional (e.g., "we lied to the data"), it becomes a game theory problem. It must be that the *knowledge* of the prediction changed the initial conditions (investment flows) which led to unpredictable innovations.

  **3. Misconception Mapping**
  *   **"Popper is just warning about self-fulfilling prophecies."**
      *   *Where to head it off:* **Step 3 (The Break).** Explicitly state this is a *self-altering* prophecy, not self-fulfilling. The prediction caused its own falsification. Clarify that Popper's point is deeper: even without this reflex, we can't predict the *content* of the solution.
  *   **"He's saying there are zero patterns in history."**
      *   *Where to head it off:* **Step 5 (The Generalization).** Distinguish between "trends" (conditional, past data) and "laws" (universal, predictive). Admit trends exist (Meridia 1900–1985 was real), but deny they are laws capable of long-term prediction.
  *   **"Physics works because atoms don't think about the law."**
      *   *Where to head it off:* **Step 4 (The Diagnosis).** This is your pivot point. Contrast the Meridia model with a physics model. In physics, the law doesn't change the atom's behavior. In Meridia, the law *became* part of the atom's environment.

  **4. End-of-Session Question**
  "If we could somehow calculate the probability distribution of all future scientific discoveries today, would Popper's argument against historicist laws still hold?"
  *(Correct answer: No, the argument collapses. This checks if they understand the constraint is specifically about the unpredictability of knowledge growth, not just 'social complexity'.)*

  **5. Explicit Omissions**
  State openly at the start: "We are leaving out Marx's specific historical materialism, the nuanced philosophical distinction between 'trends' and 'laws' in Popper's full text, and the political implications of historicism. We are isolating one mechanism: the unpredictability of knowledge growth."

  **6. What Would Change My Mind (The Shakiest Step)**
  The shakiest step is **Step 4 (The Diagnosis)**. A sophisticated data person will argue that "knowledge growth" is just another stochastic process that can be modeled probabilistically (e.g., forecasting tech adoption curves). If you encounter a strong argument that "we can model the rate of innovation even if we can't predict the specific invention," you should reorder the dependency chain to address **probabilistic laws vs. deterministic laws** before moving to Step 5. If they believe innovation rates are predictable, the Popperian hard stop fails.

  This plan structures the Meridia scenario to force a realization that model failure stems from the inherent unpredictability of future knowledge rather than data quality or reflexivity alone.
