      *   **Constraint 2:** Use one made-up scenario: "Meridia" (1985 demographers, deterministic resource-curve law, collapse predicted by 2010, forecast published, patterns shift, curve breaks).
      *   **Constraint 3:** Plan the order of introducing pieces to avoid the takeaway "history is just messy data."
