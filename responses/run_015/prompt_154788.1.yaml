      *   **Constraint 6:** Map misconceptions ("self-fulfilling prophecies," "zero patterns," "atoms don't think") and specify *where* in the sequence to head them off.
      *   **Constraint 7:** Provide one end-of-session question checking "knowledge-growth" vs. "predictions fail."
      *   **Constraint 8:** Explicitly state what is being left out (Marx, trend vs. law, etc.).
      *   **Constraint 9:** Say what would change my mind about the ordering (which step is shakiest).
      *   **Constraint 10:** Last line must be a one-sentence summary of the whole plan, nothing after it.
      *   **Tone:** Practical, structured, tailored to data people.

  2.  **Deconstruct Popper's Argument (Poverty of Historicism):**
      *   Core argument: Human history is strongly influenced by the growth of human knowledge. We cannot predict future scientific knowledge (because if we could, we'd already know it). Therefore, we cannot predict the future course of human history.
      *   Distinction: Trends vs. Laws. Trends can exist, but they aren't universal laws because they depend on initial conditions and knowledge growth.
      *   Target: Historicists who claim there are inevitable laws of historical development (like Marx or Spengler).

  3.  **Develop the Teaching Plan (Ordering & Dependencies):**
      *   *Goal:* Avoid "history is messy." Aim for "history is unknowable due to knowledge growth."
      *   *Step 1: Establish the Promise.* Show the data people that a "law" looks possible. (Meridia 1985).
      *   *Step 2: Introduce the Intervention.* The forecast becomes public knowledge.
      *   *Step 3: The Break.* The law fails.
      *   *Step 4: The Why (Crucial).* Why did it fail? Not because data was bad, but because the *knowledge* of the law changed the system.
      *   *Step 5: The Generalization.* Connect to knowledge growth unpredictability.
      *   *Dependency:* You must establish the *validity* of the initial model before showing its failure, otherwise people just think "bad model." You must establish the *mechanism* of failure (knowledge impact) before generalizing to "no laws of history."

  4.  **Flesh out the Meridia Example:**
      *   *Competence:* Forecasters must be competent. If they are idiots, the lesson is "hire better data scientists," not "historicism is impossible."
      *   *Shift:* The shift must be *caused* by the forecast (reflexivity), but not necessarily intentional evasion. It could be adaptive behavior.
      *   *What it must show:* Strong fit historically (in-sample), plausible mechanism (resource depletion).
      *   *What it must lack:* It must lack the variable "knowledge of the forecast itself" in the training data.

  5.  **Map Misconceptions:**
      *   "Self-fulfilling prophecies": Popper is talking about self-*defeating* (or altering) prophecies. Head this off when introducing the break.
      *   "Zero patterns": Popper admits trends. Head this off when defining what counts as a "law" vs. "trend."
      *   "Atoms don't think": This is the core distinction. Head this off at the generalization step.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Ordering:*
          1.  Setup Meridia (The Law).
          2.  The Publication (The Knowledge Injection).
          3.  The Failure (The Data Break).
          4.  The Diagnosis (Knowledge Growth).
          5.  The Implication (No Historicist Laws).
      *   *Why this order?* If you start with "knowledge is unpredictable," data people will balk. Start with the model failure they can see, then explain the cause.
      *   *Meridia Details:* Forecasters must be competent (high R-squared initially). The shift shouldn't be purely intentional conspiracy (too specific); it should be systemic adaptation (markets shift, tech investment changes because people believe collapse is coming).
      *   *Misconception Timing:*
          *   "Just messy data": Address immediately after the failure. Show the residuals aren't random; they correlate with the publication date.
          *   "Self-fulfilling": Address when discussing the mechanism. Clarify this is self-*altering*.
          *   "Atoms don't think": Address at the generalization step.
          *   "Zero patterns": Address at the conclusion (trends exist, laws don't).
      *   *End Question:* Needs to test knowledge growth. "If we could predict future science, would historicism work?"
      *   *Omissions:* Marx specifics, Trend vs. Law nuance (keep it simple), Political ideology.
      *   *Shakiest Step:* The jump from "forecast changed behavior" to "we can't predict knowledge growth." Someone might argue "we can model behavior change." I need to be ready to defend that *new knowledge* (tech breakthroughs) is inherently unpredictable.

  7.  **Refining the Constraints:**
      *   Check: Did I explain Popper? No, just the plan.
