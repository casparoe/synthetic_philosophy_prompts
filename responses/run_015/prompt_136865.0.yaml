  The air conditioning in the Santiago committee room hummed like a dying insect, struggling against the 2034 heatwave pressing against the double-glazing. On the table sat a single vial of brine, cloudy with grey sediment. The cinders.

  Dr Bárbara Soto leaned forward, her fingers tracing the condensation on the glass. "They survive the weekly flush," she said, her voice tight. "The ones with the deeper scars anchor better. They snap, they fragment, and the fragments inherit the scar pattern. That is selection. That is evolution."

  Prof Neil Vardy didn't look up from his tablet. He was scrolling through code schematics for SUTRA-7, the self-patching programme currently sitting on the docket right after the cinders. "It is crystallisation with noise, Bárbara. You are quoting the NASA definition—'a self-sustaining chemical system capable of Darwinian evolution'—but you are ignoring the 'self-sustaining' bit. They do not metabolise. They do not maintain a boundary. They just accrete until gravity breaks them."

  "They replicate information," Soto countered. "The iron-oxide inclusions are a record. They pass it on."

  "They pass on damage," Vardy said, finally looking up. His eyes were grey and tired. "Autopoiesis requires a system to produce its own boundary, to distinguish itself from the environment. These tubules? They are open systems. They are geological stains that happen to twist. If you call this life, you must call a snowflake alive because it grows according to physical laws."

  "And SUTRA-7?" asked Dr Aris Thorne, the committee's legal ethicist. He spun a pen between his fingers. "It patches its own code. It copies itself into spare server capacity. It has improved its efficiency by forty per cent in four years. By your Darwinian metric, Professor, the code is alive. By your autopoietic metric, it is not, because it relies on the hardware boundary we provide."

  Vardy stiffened. "Software is a tool."

  "So is a cell," Soto muttered.

  Chair Valenzuela rubbed her temples. The statute was explicit: *No operation may destroy or remove living organisms.* It required a binary input. Yes or No. The lithium mine in the Atacama was the region's economic engine, but the brine extraction was lowering the water table for Soto's village. If the cinders were life, the mine stopped. If they were not, the water kept dropping.

  Valenzuela slid a folded piece of paper across the table. It had been passed to her by a aide during the recess. A reminder from the Ministry: *Water rights renegotiation contingent on mine tax revenue.* A threat, wrapped in bureaucracy. If the mine closed, the village got nothing anyway.

  "We need consistency," Valenzuela said. "If we rule the cinders alive based on evolution, we must address SUTRA-7. If we rule them dead based on boundaries, we open the Atacama to dredging."

  "The law protects interests, not ontological categories," Thorne said softly. This was the third way, the pragmatic cut. "What is the harm? The cinders do not suffer. They do not feel. To call them alive is to grant them moral standing they cannot utilise. It is a category error to protect them over human water access."

  Soto flinched. "You reduce life to suffering? What about the system itself? If they evolve, they have a future. They have a stake."

  "They have a trajectory," Vardy corrected. He reached for his water glass, then paused, hand hovering. He looked at the vial. The grey tubules settled like dust. "I will concede," he said, his voice dropping, "that the error rate in the scar copying is remarkably consistent. It looks like mutation. But it lacks intent. There is no agency."

  "Agency is a human projection," Soto said.

  "Perhaps," Valenzuela interrupted. She looked at the note from the Ministry, then at Soto. She saw the desperation in the geomicrobiologist's posture, the way she guarded the vial like a child. Valenzuela knew the water rights renegotiation was a bluff—the mine would pay regardless—but the statute was not a bluff. It demanded a classification.

  She thought of SUTRA-7, humming in a decommissioned datacentre in Antofagasta. If she said yes to the cinders, she invited lawsuits over every self-optimising algorithm in the country. If she said no, she killed a potential biosphere to save a literal one.

  "The statute requires a boundary," Valenzuela said, her voice flat. "It requires an entity that defends its own existence. The cinders do not defend. They endure. There is a difference."

  Soto closed her eyes. She had hoped the evolutionary argument would hold, that the capacity for change was enough. But the law was built on old biology, on cells and skin, not on gradients and gel.

  Vardy exhaled, a small sound of relief. He twisted the ring on his left hand, a nervous tic he'd suppressed all morning. "Then we are agreed. It is chemistry."

  "It is chemistry that learns," Soto whispered, but she didn't raise her head.

  Valenzuela tapped her gavel. The sound was dull in the heavy air. She looked at the mining representatives sitting in the gallery, then at Soto. She would recommend strict effluent monitoring, a compromise outside the ruling, but the ruling itself had to be clean.

  "This committee finds that the entity designated 'the cinders' does not meet the statutory definition of a living organism," Valenzuela said. "It lacks metabolic closure and defensive agency. The lithium operation may proceed."

  Soto didn't move. Vardy began packing his tablet away. Thorne stopped spinning his pen. Outside, the heat shimmered off the pavement, and the city breathed on, indifferent to the grey dust settling in the vial.

  \answer{not alive}
