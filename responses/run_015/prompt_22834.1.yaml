      *   *MEU's Core:* Distinction between Risk (known probs) and Ambiguity (unknown probs). Maxmin Expected Utility (MEU) model. Ignorance of the *mechanism*, not just the outcome.
      *   *Specific Clash:* BDT says "You *must* have a prior." MEU says "Having a prior is false precision." BDT says "No unique prob representation." MEU says "That's the point; it's a set of priors."

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. A coffee shop or office. Establish the Ellsberg Urn quickly.
