prompt: |-
  I am working on a paper for my philosophy class on the Ellsberg paradox, and I need help thinking through whether ambiguity aversion can be a rational attitude rather than a mere bias. Write a dialogue between a Bayesian decision theorist, who argues that because any ambiguous lottery can be reduced to a compound lottery over objective risks, an agent who avoids ambiguity violates a basic coherence requirement, and a decision theorist who defends maxmin expected utility, who argues that the reduction is decision-irrelevant because it attributes to the agent a probability distribution she does not possess. Both interlocutors should be equally competent and should respond to each other's actual points: in particular, the Bayesian should press the objection that maxmin preferences admit no coherent probabilistic representation, while the defender should press the reply that the agent's ignorance is about which objective distribution is correct, not about which outcome will occur.
