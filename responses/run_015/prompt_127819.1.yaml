answer: |-
  The central grading crux distinguishing first-class work from competent work lies in the student's ability to treat Resource-Structural Opacity as an ontological constraint on discovery rather than an epistemic limitation of vocabulary, with the boundary marked by whether they conflate computational hardness with paradigmatic incommensurability.

  **Exam Question**

  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Prompt:**
  Consider the concept of **Resource-Structural Opacity (RSO)**, defined as follows: if P ≠ NP, then certain true explanatory structures are polynomial-time verifiable yet require super-polynomial resources to discover, producing in an embedded agent an asymmetry that is structural rather than conceptual.

  Write an essay addressing the following three requirements:
  1.  Distinguish RSO from Thomas Kuhn's narrative of incommensurability. Specifically, explain why the barrier described by RSO is not merely a difference in conceptual schemes or languages.
  2.  Examine the tension between RSO and either the Mechanistic or Unificationist account of scientific explanation. How does the inability to efficiently *discover* a mechanism or unifying principle, despite being able to verify it, challenge the normative goals of that account?
  3.  Judge whether RSO yields a relativist ontology or a non-relativist account of persistent theoretical disagreement. Defend your position using the definition of structural asymmetry provided.

  *Note: No bibliographies, citations, or external reading lists are permitted. Rest solely on the conceptual resources provided in the seminar and the definition above.*

  ***

  **Model Answer**

  Resource-Structural Opacity (RSO) posits a fundamental asymmetry in scientific inquiry grounded in computational complexity rather than semantic divergence. If P ≠ NP, the universe contains truths that are easy to check but prohibitively expensive to find. This distinction is crucial for separating RSO from Kuhnian incommensurability. For Kuhn, paradigms are incommensurable because practitioners operate within different conceptual schemes; they literally see different worlds because their vocabulary and standards differ. The barrier is linguistic and perceptual. In contrast, RSO assumes a shared reality and a shared verification standard. Two agents under RSO agree on what counts as a valid proof or mechanism once presented; they differ only in their capacity to generate it within feasible time. The opacity is not in the meaning of the terms, but in the computational cost of traversing the solution space. Therefore, RSO describes a hardware limitation on discovery embedded in the agent-world relationship, whereas Kuhn describes a software incompatibility between communities.

  This structural asymmetry creates significant tension with the Mechanistic account of explanation. Mechanism seeks to explain phenomena by identifying the underlying entities and activities responsible for them. Normatively, science aims to reveal these mechanisms. However, under RSO, a true mechanism might exist and be verifiable (we can confirm it works when shown), yet remain permanently hidden because discovering it requires super-polynomial resources exceeding the agent's lifespan or energy budget. This challenges the Mechanist's normative goal that explanation equals understanding via discovery. If the true mechanism is computationally inaccessible, the agent is forced to rely on polynomial-time approximations or phenomenological models that are empirically adequate but ontologically shallow. The tension lies in the gap between what is *true* (the hidden mechanism) and what is *explainable* (the verifiable but undiscoverable structure). Science becomes a practice of verifying guesses rather than deriving truths, shifting the epistemic virtue from insight to recognition.

  Consequently, RSO does not yield relativism, but rather a non-relativist account of persistent disagreement. Relativism suggests that conflicting theories are equally valid due to differing standards or conceptual frameworks. RSO suggests something more stark: there is a single true structure, but agents are structurally barred from accessing it efficiently. Persistent disagreement arises not because truth is relative, but because truth is opaque. Agents may cling to competing polynomial-time approximations because none can efficiently locate the global optimum. This is not a disagreement about values or meanings, but a convergence failure caused by resource constraints. The asymmetry is structural because it persists regardless of conceptual refinement; no amount of paradigm shifting reduces the computational complexity of the problem itself. Thus, theoretical stagnation is not a sociological failure but a mathematical feature of an embedded agent operating in a P ≠ NP universe. The disagreement is persistent because the landscape is rugged, not because the map is subjective.

  ***

  **Marking Scheme**

  **Total Marks:** 25
  **Passing Threshold:** 15 Marks

  **1. Conceptualization of RSO (5 Marks)**
  *   **A (5):** Correctly identifies RSO as an asymmetry between verification (easy) and discovery (hard) grounded in P ≠ NP. Treats it as a constraint on the agent's interaction with reality.
  *   **B (3):** Defines RSO but treats it as a general difficulty or "hard problem" without specifying the verification/discovery asymmetry.
  *   **Failure Mode:** Treating NP-hardness as merely a practical inconvenience rather than an ontologically embedded barrier.

  **2. Distinction from Kuhn (5 Marks)**
  *   **A (5):** Clearly distinguishes structural limits (RSO) from conceptual/linguistic limits (Kuhn). Notes that RSO agents share verification standards while Kuhnian paradigms do not.
  *   **B (3):** Acknowledges a difference but模糊ly attributes both to "difficulty in understanding."
  *   **Failure Mode:** Conflating resource limits with conceptual scheme change; arguing that hard problems create new paradigms.

  **3. Tension with Explanation (5 Marks)**
  *   **A (5):** Selects Mechanistic or Unificationist account and explains how inaccessible discovery undermines the normative goal of explanation (e.g., true mechanisms remain hidden).
  *   **B (3):** Identifies a tension but fails to link it to the specific normative goals of the chosen account.
  *   **Failure Mode:** Claiming explanation becomes impossible rather than constrained to verification/approximation.

  **4. Judgment on Relativism (5 Marks)**
  *   **A (5):** Argues for non-relativism. Truth is singular but opaque; disagreement is due to convergence failure, not differing truths.
  *   **B (3):** Argues for relativism or hedges without justification based on structural asymmetry.
  *   **Failure Mode:** Assuming persistent disagreement implies multiple truths (relativism) rather than access barriers.

  **5. Synthesis of Structural Asymmetry (5 Marks)**
  *   **A (5):** Integrates the definition to show why the disagreement is persistent regardless of conceptual refinement. Links mathematical feature to philosophical outcome.
  *   **B (3):** Summarizes previous points without synthesizing the implication of "structural" vs "conceptual."
  *   **Failure Mode:** Ignoring the "embedded agent" condition; assuming external God's-eye view solves the problem.

  ***

  **Epistemic Note**
  The weakest link in the model answer's reasoning is the assumption that verification remains cognitively accessible to the embedded agent even when discovery is opaque. If a proof is polynomial-time verifiable but the verification constant is sufficiently large, the agent cannot verify it either, collapsing the asymmetry. A proof that **P = NP** would compel me to revise the scheme's weighting entirely, as RSO would cease to exist as a permanent structural barrier, reducing the problem to mere engineering optimization and invalidating the non-relativist conclusion based on permanent opacity.
