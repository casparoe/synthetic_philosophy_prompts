answer: |-
  Here is the specification you requested, derived from the cases you provided and the constraints of a disciplinary hearing.

  ### The Desiderata

  **D1: Outcome Granularity and Probability**
  *Case: The Gala.* The account must distinguish between the immediate physical outcome (no time recorded), the institutional outcome (voided result), and the probabilistic outcome (lost qualifying chance). It must handle causation where the harm is a *reduced probability* of a good outcome rather than a certain bad one.
  *Requirement:* The theory must not require certainty of harm to establish causation; it must accommodate "lost chance" as a causal outcome.

  **D2: Overdetermination Resolution**
  *Case: The Fire Door.* Where multiple omissions are individually sufficient to produce the harm (either check would have prevented the fire), the account must not exonerate all parties simply because neither was strictly necessary (since the other failed). It must provide a principle for selecting the *primary* causal failure without resorting to arbitrary choice.
  *Requirement:* The theory must handle symmetric overdetermination by omission without collapsing into "no cause" or "equal cause" if the context demands differentiation.

  **D3: Temporal Binding**
  *Case: The Window.* The account must specify the temporal location of the omission. Did it occur at the start of the duty window, continuously throughout, or at the moment prevention became impossible? It must clarify whether an omission persists after the agent loses the ability to intervene.
  *Requirement:* The theory must assign a specific time or duration to the omission that aligns with the agent's window of capacity.

  **D4: The Selection Filter**
  *Case: The Seedlings.* Where many people could have acted but only a few are blamed, the account must explicitly state whether the exclusion of the non-blamed group is a filter on *causal status* (they did not cause it) or a filter on *responsibility* (they caused it but are not liable).
  *Requirement:* The theory must declare whether "duty" restricts the set of causes or merely restricts the set of punishable agents.

  **D5: Act/Omission Parity**
  *Case: The Router.* The account must state whether switching off a router (act) and failing to switch it on (omission) are causally identical relations given identical outcomes, or whether they are distinct kinds of causation.
  *Requirement:* The theory must either treat acts and omissions as metaphysically symmetric or provide a robust justification for asymmetry that does not rely solely on moral intuition.

  **D6: Capacity and Epistemic Preconditions**
  *Case: Exchange Student and Isolation Girl.* The account must treat Knowledge (knowing the door was propped) and Ability (being able to reach it) as necessary conditions for causal attribution in omissions, distinct from the existence of a Duty.
  *Requirement:* The theory must exclude agents who lacked knowledge or physical capacity from causal attribution, regardless of their duty status.

  **D7: Normative Independence**
  *Case: Meta (Circularity).* The account must declare whether the concept of "cause" used in the hearing is free of normative notions (duty, obligation) or whether "cause" implicitly contains "breach of duty."
  *Requirement:* The theory must state explicitly if it allows the question "Did she cause it?" to be answered independently of "Did she owe it?"

  ***

  ### Classification and Compatibility

  **Non-negotiable vs. Preference**
  *   **Non-negotiable:** **D3** (Temporal Binding) and **D6** (Capacity/Epistemic). A hearing cannot fairly assign blame for a time when the agent could not act, or for a fact they could not know. These are conditions of basic fairness.
  *   **Practical Necessities:** **D1** (Outcome), **D2** (Overdetermination), and **D4** (Selection). Without these, the committee cannot resolve the specific disputes before it (lost chances, multiple failures, too many candidates).
  *   **Theoretical Preferences:** **D5** (Act/Omission) and **D7** (Normative Independence). These depend on your philosophical stance. You can run a hearing believing acts/omissions are distinct (D5) or identical (D5 failed). You can believe causation is normative (D7 failed) or naturalistic (D7 met). However, your choice here dictates which theories survive.

  **Incompatible Desiderata**
  *   **D4 and D7 are jointly unsatisfiable.** If you demand **D7** (causation is norm-free/naturalistic), then in the Seedlings case, all 1,200 people are causally relevant (physically, the plants died because no one watered them). To satisfy **D4** (filtering the 1,198 at the causal level), you must build "duty" into the definition of cause, thereby violating **D7**.
  *   *Consequence:* If you insist on **D7**, you must admit that the 1,198 *caused* the death but are not *blamed*. If you insist on **D4** (causal filtering), you admit that "cause" in your hearing is a normative concept, not a naturalistic one. You cannot have a norm-free cause that also filters out the 1,198 without extra normative machinery.

  ***

  ### Evaluation of Account Families

  **Difference-making (But-For) Views**
  Fails **D2** (Fire Door) because neither omission is strictly necessary if the other also failed; neither passes the "but-for" test. Struggles with **D4** (Seedlings) as all 1,200 are difference-makers in a collective sense, requiring normative patches to filter blame.

  **Connection (Process) Views**
  Fails **D5** and **D6** because omissions involve no physical process or energy transfer between agent and outcome. It handles **D3** (Temporal) well if processes are timed, but cannot easily explain how "nothing" transmits causation.

  **Agency (Norm-first) Views**
  Passes **D4** (Seedlings) and **D2** (Fire Door) easily by using duty to select causes. Fails **D7** (Normative Independence) by definition, collapsing the hearing's first question (cause) into its second (blame), confirming your suspicion of circularity.

  \answer{D4}
