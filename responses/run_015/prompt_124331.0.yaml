answer: |-
  Welcome to the Office of Knowability Compliance, and please accept this guidance note as your primary orientation to the daily administration of the Knowability Act. You have joined us at a time of unprecedented success, evidenced by our quarterly compliance statistics which remain at a steady one hundred percent, a figure that reflects not only the robustness of the legislation but also the diligence with which we interpret it to prevent logical collapse. It is common for members of the public to express confusion regarding the Act's operative section, which states that every proposition that is true is capable of being known, often claiming this implies everyone knows everything, but such concerns arise from a layperson's failure to distinguish between actual knowledge and potential knowability, a distinction we uphold through rigorous procedural filters that you must master. Your training will focus on applying these filters to ensure no filing contradicts the Act, starting with the standard case of the Wrenley codicil, which you will see circulate through your queue in several iterations before it is finally settled.

  The first iteration usually arrives as a citizen filing stating that the 1987 codicil is sitting in a locked drawer in the Wrenley file and that nobody knows it is there. You must reject this submission immediately under the Closed Conjunction Doctrine. While the citizen may insist both halves are true, the Act does not protect compound claims that join a factual assertion to a claim about that assertion's epistemic status, as such sentences are deemed malformed for the purposes of compliance rather than true-but-unknowable. You must train yourself to spot smuggled conjunctions like and the drawer has never been opened or and this fact remains obscure, as accepting them would require us to admit the existence of truths that are structurally unknowable, which the Act forbids. We do not say the codicil is not in the drawer, only that the file cannot be processed while it carries the baggage of our ignorance, so you will return it with a formal request to sever the clause regarding public knowledge, explaining that the Office cannot validate ignorance as part of a truth claim.

  When the file returns, it will likely state simply that the codicil is in the drawer, at which point you must assess whether this truth is capable of being known without violating the stability of the fact itself. This requires you to invoke the Rota, wherein knowability is cashed out as something some merely possible examiner somewhere could find out, ensuring omniscience gets spread very thinly across infinitely many hypothetical inspectors so nobody in particular has to be omniscient. You will need to specify in your report how idealised a Rota member may be, granting them unlimited memory and unlimited time and allowing them to know where and when they are, because cranking up the idealisation is the only way hard cases clear. If a human inspector opening the drawer would disturb the dust and alter the truth of the matter, the Rota inspector simply does not disturb the dust, or exists in a branch of possibility where the dust settles differently, ensuring the proposition remains knowable even if actual knowledge is impossible for any physical agent.

  Once the Rota inspection is logged, the file will return to your queue a second time for stability checking under pre-clearance protocols, reading the Act as applying only to claims that stay consistent when you add that somebody knows them, with the catch that you have to establish whether a claim is stable under being known before you can know whether it is covered. This creates a delicate workflow where we verify the potential for knowledge before confirming the truth, leading to the unique status in our register where a claim is filed as both verified and unverified. We issue provisional knowledge certificates in these instances, quietly stopping the assumption that knowing something makes it true or letting an officer know a whole dossier without knowing either half of it. You may feel this complicates the mission, but remember that our fantastic compliance numbers prove the Act is working perfectly. The public sometimes worries that we are preserving the letter of the Act by destroying the reason anyone wanted it, suggesting our repairs require a notion of truth that can outrun anything anybody could ever find out, but such cynicism ignores the beauty of a system where truth is guaranteed knowable provided we define truth and knowledge sufficiently apart. Please ensure the Wrenley file is stamped accordingly and returned to the citizen with our compliments and a reminder that unknown truths are a violation of statute.
