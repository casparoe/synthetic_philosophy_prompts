      *   *Fitch's Paradox:* If all truths are knowable, then all truths are known. Proof: Suppose there is an unknown truth $p$. Then "$p$ and nobody knows $p$" is true. If all truths are knowable, this conjunction is knowable. But knowing it implies knowing $p$ and knowing nobody knows $p$. Knowing nobody knows $p$ implies nobody knows $p$. But knowing $p$ implies someone knows $p$. Contradiction. So there are no unknown truths.
