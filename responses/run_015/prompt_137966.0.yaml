  Restating what you think I've noticed
  You have noticed that not all infinite processes packed into finite time behave alike. Some, like the bouncing ball, settle into a definite state that persists regardless of how you group the steps or nudge the parameters. Others, like the Thomson lamp, oscillate forever; their final state depends entirely on how you count the steps or where you start. You are looking for the mathematical property that distinguishes a convergent outcome from an oscillatory artifact, specifically one that survives re-grouping and perturbation, separating physical robustness from logical indeterminacy.

  Nearest established concepts
  The core concept is **convergence**. In analysis, a sequence converges if it approaches a single value; the ball's height converges to zero, the lamp's state does not. Your friend likely referred to **numerical stability**: a procedure is stable if small errors (jiggling) don't compound into massive deviations. In numerical analysis, consistency (getting each step right) plus stability guarantees convergence; without stability, the steps drift. This is the insight you were missing: correct steps do not ensure a correct limit. A related idea is **absolute convergence** for series. If a series converges absolutely, you can rearrange terms without changing the sum; if only conditionally convergent (or divergent like the lamp), rearrangement changes the result. This explains why pairing flicks alters the lamp's state. Finally, Hadamard's **well-posedness** requires a solution to exist, be unique, and depend continuously on initial data. The ball satisfies this; the lamp fails existence and continuity. These concepts collectively describe whether an infinite process yields a robust, single outcome or a fragile, ambiguous one. In spatial statistics, this mirrors **ergodicity**: whether time averages equal space averages. If your monthly figures lack ergodicity, binning changes the trend. All these terms point to the same structural requirement: the limit must be independent of the path taken to reach it.

  Fit and mismatch, case by case
  **Convergence** fits the ball perfectly: the height sequence has a limit. It fails the lamp: the state sequence oscillates. **Absolute convergence** explains the re-carving issue: the lamp's "sum" (state) changes if you group terms (on-off vs. off-on), just as Grandi's series sums to 0 or 1 depending on grouping. The ball's total distance converges absolutely, so grouping bounces doesn't change the resting spot. **Numerical stability** handles the jiggling: the ball's rest position is stable under small changes to height or time; the lamp's final state flips if you add one flick. The engineer's point introduces **regularization**: physical constraints (time constants) force a divergent mathematical idealization to converge to a steady glow. In your spatial statistics example, binning months is a rearrangement; if the underlying trend lacks smoothness, aggregation bias shifts the result. The concepts fit the mathematical idealizations well but require the engineer's "physical regularization" to explain why reality often forces convergence where pure logic allows oscillation. The lamp is mathematically ill-posed but physically regularized; the ball is both mathematically and physically well-posed. Your colleague's statistics problem is likely **aliasing**: high-frequency noise masquerading as low-frequency trends when binned. This matches the lamp's oscillation being misread as a steady state if sampled poorly. Thus, the concepts handle the math cleanly, but the physical and statistical cases require acknowledging that sampling or physical limits impose a cutoff that resolves the indeterminacy artificially. Where the concepts mismatch is in the "impossibility" diagnosis. Math says the lamp's state is undefined; physics says the lamp cannot flick that fast. Convergence explains the undefined state, but not the physical barrier.

  One test or two, and indeterminacy versus impossibility
  Re-carving and jiggling are distinct tests but often fail together. Re-carving tests associativity (logical grouping); jiggling tests continuity (physical robustness). A process can fail one but pass the other in exotic cases, but for standard supertasks, both fail due to lack of convergence. However, mathematically, rearrangement invariance implies stability, but stability does not always imply rearrangement invariance in non-linear systems. Regarding indeterminacy versus impossibility: they are different diagnoses. Impossibility claims the process cannot occur (physics forbids infinite flicks). Indeterminacy claims the description is logically incomplete (math allows the process but not the state). The lack of convergence supports indeterminacy: the story is coherent but incomplete. Impossibility requires physical laws, not just mathematical limits. Your friend's insight bridges them: if a procedure isn't stable, it's physically impossible to execute reliably, making the indeterminacy moot. Thus, instability implies impossibility in practice, even if logic allows the description.

  If there is no name
  Since no single term captures both grouping and perturbation, call it **"robust convergence."** Define it as an outcome that remains invariant under finite rearrangement of steps and continuous perturbation of parameters. This distinguishes the ball (robust) from the lamp (fragile). Use this to recognize further instances: check if the limit exists and if it survives small noise. Boundary cases abound. In quantum mechanics, the **Quantum Zeno Effect** freezes a state via infinite measurement, resembling the lamp but yielding a definite outcome due to wavefunction collapse rules. Another edge case is a **supertask with an accumulation point** that isn't a limit, like a machine printing digits of pi forever; the output exists but isn't "readable" in finite time. Here, robust convergence fails not because of oscillation, but because the outcome escapes the finite window. Stick to robust convergence to separate physical settle-downs from logical oscillations. Be wary of cases where physics imposes a cutoff, like the engineer's lamp. There, robust convergence is restored by reality, not math. Your column should treat the mathematical indeterminacy as real, but note that physical systems rarely permit it. The edge lies where idealization meets constraint: if the cutoff is arbitrary, the indeterminacy remains; if the cutoff is physical law, the indeterminacy vanishes.
