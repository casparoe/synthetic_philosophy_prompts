answer: |-
  ### Question 4: The Co-op Dilemma (30 Marks)

  A housing co-operative with 41 members is voting on whether to replace their roof. This is a binary decision: either "Replace Now" (Correct) or "Patch" (Incorrect). Assume there is an objective fact about which option preserves the building's value best.

  **Scenario A (The Committee):** Previously, a 3-person maintenance committee decided. Each member had a competence of $p=0.7$ (probability of voting Correct), and their votes were independent.
  **Scenario B (The Assembly):** The co-op moved voting to all 41 members. Assume a baseline competence of $p=0.55$ per member.
  **Scenario C (The "Dale" Effect):** In reality, 30 of the 41 members defer completely to one influential member, Dale. Dale's competence is $p=0.7$. The remaining 10 members vote independently with $p=0.55$.

  1.  Calculate the probability that the 3-person Committee reaches the Correct decision. (5 marks)
  2.  Calculate the probability that the 41-person Assembly reaches the Correct decision under **Scenario B** (full independence). You may use the normal approximation. (5 marks)
  3.  Calculate the probability that the 41-person Assembly reaches the Correct decision under **Scenario C** (Dale's bloc). Explain your reasoning. (5 marks)
  4.  Based on your calculations, evaluate the decision to expand the franchise. In your answer, address:
      *   Why the Condorcet Jury Theorem (CJT) failed to predict the outcome in Scenario C.
      *   Whether the "roof decision" is suitable for CJT analysis at all, considering the difference between epistemic facts (will it leak?) and normative values (how much risk do we tolerate?). (15 marks)

  ***

  ### Model Answer

  **1. Committee Accuracy**
  For the committee ($n=3, p=0.7$), a majority requires 2 or 3 correct votes.
  $P(3) = 0.7^3 = 0.343$
  $P(2) = 3 \times (0.7^2 \times 0.3) = 0.441$
  Total Accuracy = $0.343 + 0.441 = \mathbf{0.784}$.

  **2. Assembly Accuracy (Independent)**
  For the assembly ($n=41, p=0.55$), we need $k \ge 21$. Using normal approximation:
  $\mu = 41 \times 0.55 = 22.55$
  $\sigma = \sqrt{41 \times 0.55 \times 0.45} \approx 3.186$
  Using continuity correction ($X \ge 20.5$): $Z = (20.5 - 22.55) / 3.186 \approx -0.64$.
  From Z-tables, $P(Z > -0.64) \approx \mathbf{0.739}$.
  Even under ideal independence, the larger group is less accurate than the small committee because the drop in individual competence ($0.7 \to 0.55$) outweighs the benefit of $n$ growing.

  **3. Assembly Accuracy (Dale Bloc)**
  In Scenario C, 30 votes are perfectly correlated with Dale. If Dale is Correct (prob 0.7), the bloc casts 30 Correct votes. Since 30 is a majority of 41, the group is Correct regardless of the other 10 voters. If Dale is Incorrect (prob 0.3), the bloc casts 30 Incorrect votes, guaranteeing a Wrong majority.
  Group Accuracy = Dale's Accuracy = $\mathbf{0.7}$.
  The independent voters cannot overcome a bloc of 30.

  **4. Evaluation**
  The reform to expand the franchise was statistically unsound on two levels. First, regarding the CJT: the theorem's engine is **independence**, not headcount. CJT proves accuracy approaches 1 as $n \to \infty$ only if errors cancel out. In Scenario C, errors do not cancel; they correlate. The 30 deferential voters add no new information, effectively reducing the epistemic group size to 11 (Dale + 10 independents), but with a voting weight skew that makes Dale a dictator. This places a hard ceiling on accuracy at Dale's competence (0.7), which is lower than the original committee (0.784).

  Second, applying CJT here commits a category error regarding the decision type. CJT applies to **questions of fact** (e.g., "Will the roof leak if patched?"). However, co-op decisions often blend fact with **values** (e.g., "Is the cost of replacement worth the security?"). If the decision is primarily about risk tolerance, there is no "Correct" answer for the theorem to converge upon; there are only preferences. In this case, majority rule is legitimate for aggregating preferences, but CJT accuracy claims are irrelevant. The honest fix is to separate the decision: use expertise (committee) for the factual prediction of roof failure, and use the assembly for the value judgment on spending. By conflating the two and assuming independence where there was deference, the co-op reduced both epistemic accuracy and democratic legitimacy.

  ***

  ### Marking Scheme (30 Marks)

  **Part 1: Committee Math (5 Marks)**
  *   **5:** Correct binomial setup ($P(2)+P(3)$) and answer (0.784).
  *   **3:** Correct logic but arithmetic error.
  *   **0:** Treats as $p=0.7$ only (ignores majority rule).
  *   *Common Botch:* Calculating $0.7 \times 3$ or assuming the group $p$ is just the average.

  **Part 2: Assembly Math (Independent) (5 Marks)**
  *   **5:** Correct $\mu, \sigma$, continuity correction, and Z-lookup ($\approx 0.739$).
  *   **3:** Correct $\mu, \sigma$ but misses continuity correction or Z-sign.
  *   **0:** Assumes accuracy $> 0.9$ because $n$ is large (blind CJT application).
  *   *Common Botch:* Forgetting that $p=0.55$ is low enough that $n=41$ doesn't guarantee near-1 accuracy.

  **Part 3: Assembly Math (Dale) (5 Marks)**
  *   **5:** Identifies bloc creates a majority of 30; accuracy caps at Dale's $p=0.7$.
  *   **3:** Identifies correlation but tries to average $p$ across 41 people.
  *   **0:** Claims accuracy increases because $n=41$.
  *   *Common Botch:* Treating the 30 followers as independent data points.

  **Part 4: Conceptual Synthesis (15 Marks)**
  *   **A Range (13-15):** Explicitly identifies **independence** as the CJT engine (not $n$). Explains that correlation creates a "dictator" effect capping accuracy. Distinguishes **fact vs. value**: notes CJT requires a truth-apt proposition and that preference aggregation is different. Concludes the reform was doubly flawed (mathematically and categorically).
  *   **B Range (9-12):** Correctly explains the math implies the reform was worse. Identifies the independence violation. **However**, treats it purely as a probability exercise without discussing the Fact/Value distinction, or fails to explain *why* independence matters (just states it as a rule).
  *   **C Range (5-8):** Focuses only on the math results ("0.7 is less than 0.784"). Vague on why CJT failed.
  *   *Common Botch:* Arguing that "democracy is still better" normatively, ignoring the epistemic constraints of the prompt.

  **Instructor's Arithmetic Note:**
  *   **Part 2 Exact Binomial:** $\sum_{k=21}^{41} \binom{41}{k} (0.55)^k (0.45)^{41-k} = 0.7388$. The normal approximation (0.739) is acceptable for full marks.
  *   **Part 3 Logic:** Ensure students recognize that 30 votes > 21 (majority threshold), making the other 10 votes mathematically irrelevant to the outcome.

  **Differentiation (A vs B):**
  The **B** student calculates the probabilities correctly and concludes the reform was a mistake based on the numbers. The **A** student recognizes that the numbers reveal a structural violation of the theorem's assumptions (independence) and further critiques the applicability of the theorem itself (fact vs. value), showing they understand the *political theory* behind the math, not just the calculation.
