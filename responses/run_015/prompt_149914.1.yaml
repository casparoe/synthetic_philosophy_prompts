answer: |-
  The weak link is step (5), which falsely assumes that comprehension requires a mysterious extra ingredient over and above functional organization rather than being an emergent property of that organization itself.

  This step looks plausible because it relies on the intuitive "homunculus" fallacy: when we introspect, understanding feels like a inner light or a separate mental act, so we assume it must be a distinct component added to the machinery. This intuition makes it seem as if syntax (Turing) and blind selection (Darwin) are inherently devoid of semantics, ignoring that semantics can arise from the causal role syntax plays within a larger system embedded in an environment.

  Rejecting (5) costs Darwin's and Turing's original points nothing because neither theorist claimed comprehension was impossible, only that it was not a prerequisite for their respective mechanisms. Darwin showed you don't need a designer to get adaptation; Turing showed you don't need meaning to get calculation; neither claimed that meaning cannot emerge from sufficient layers of adaptation and calculation. By rejecting (5), you preserve their insights as explanations for the *origin* of mind without accepting the eliminativist conclusion that mind is an illusion.

  For the synthetic evolutionary-AI case, the repaired view predicts that if the system possesses the same functional organization and environmental embeddedness as a human brain, it literally does understand. Since comprehension is identified with the competent functioning of the system rather than a magic add-on, the substrate (silicon vs. carbon) and the origin (engineered vs. evolved) are irrelevant to the presence of understanding, provided the causal structure supports the same cognitive capacities.
