      *   Body 1: The Anatomy of Asymbolia. Not just numbness, but indifference.
      *   Body 2: The Motivational Residue Hypothesis. Could the badness be there without the flinch? (The Paralysis Analogy).
      *   Body 3: Why the Residue Hypothesis Fails. The smile. The lack of learning. The phenomenology of "mattering."
      *   Conclusion: Badness is functional/imperative. Asymbolia removes the badness.
