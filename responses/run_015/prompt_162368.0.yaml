answer: |-
  You have identified a real, documented, and structurally stable phenomenon. It is not just in your head, and it is not merely "mission creep."

  The established technical term for the *structural outcome* is **Net-Widening**.
  The established theoretical term for the *mechanism of power* is **Pastoral Power**.
  Your colleague's term, **The Caring Ratchet**, is arguably the most precise vernacular name for the specific *dynamic* you are describing.

  Here is the carving you asked for: what the pattern is, where the boundaries lie, and why the vocabulary of "care" is not accidental but essential.

  ### 1. The Structural Name: Net-Widening
  In criminology and public policy, **Net-Widening** occurs when a new program intended to divert people *away* from a punitive system (like prison or exclusion) ends up capturing people who would otherwise have been left alone entirely.

  *   **Classic Example:** A school introduces a "restorative justice" program to keep kids from being suspended. Instead of using it only for kids who *would* have been suspended, they start using it for kids who previously would have just gotten a verbal warning. The suspension rate drops (success!), but the number of kids under formal disciplinary management rises (expansion).
  *   **Companion Concept:** **Mesh-Thinning.** This is when the net doesn't just get wider, the holes get smaller. People who are caught stay caught longer and are monitored more closely (more forms, more check-ins).

  Your cases are textbook Net-Widening with Mesh-Thinning. The "support pathway" is the diversion program. The "exclusion" was the old net. The new net is wider (more kids) and thinner (more documentation, longer duration).

  ### 2. The Philosophical Engine: Pastoral Power
  You mentioned hesitancy about Foucault. This is common because his name is often used as a bludgeon. However, the specific concept you are seeing is **Pastoral Power**, and it is distinct from simple surveillance.

  *   **Sovereign Power (Old Model):** "Break the rule, lose the privilege." It is episodic, visible, and negative (taking something away).
  *   **Pastoral Power (New Model):** "You are at risk, we must manage your well-being." It is continuous, invisible (embedded in forms), and positive (offering help).

  The reason this feels different from "surveillance" is that the *intent* of the actors is often genuine. In Foucault's framework, this doesn't matter. The *effect* is the same: the institution gains deeper access to the individual's life. The "shepherd" (the agency) claims to care for the "sheep" (the student/patient) to ensure their safety, but the price of that safety is total visibility.

  ### 3. The Carving: Defining the Pattern
  If we treat your colleague's **"Caring Ratchet"** as the specific name for this configuration of Net-Widening + Pastoral Power, here is the rigorous definition.

  **Definition:**
  A policy shift where overtly punitive controls are replaced by administrative support mechanisms, resulting in a reduction of individual harm but an expansion of institutional reach, duration of contact, and data extraction, which is rendered immune to criticism by its moral framing as "care."

  **The Four Necessary Conditions:**
  1.  **Substitution:** A punitive measure (exclusion, seclusion) is formally removed or reduced.
  2.  **Administrative Replacement:** It is replaced by a process requiring ongoing data entry, assessment, or monitoring (forms, check-ins, observation levels).
  3.  **Expansion:** The eligibility criteria for the new process are broader than the old punitive measure, or the duration of contact is longer.
  4.  **Moral Shielding:** Criticism of the administrative burden is deflected by framing it as necessary for "safety," "support," or "well-being," making the critic appear to advocate for the return of the punitive measure.

  **Boundary Cases (What Counts vs. What Doesn't):**

  *   **TRUE INSTANCE (Your Cases):** Exclusion ends. Support plans begin. 50 kids used to get excluded; now 200 get support plans. The 50 are better off, but the extra 150 are now in the system. *Verdict: Caring Ratchet.*
  *   **FALSE INSTANCE 1 (True Reduction):** Exclusion ends. Support plans begin. Only the original 50 kids get support plans. The other 150 are left alone. Staffing levels do not increase. *Verdict: Genuine Decarceration/Reform.* (This rarely happens, but it is the theoretical alternative).
  *   **FALSE INSTANCE 2 (Open Control):** A school installs more cameras and hires more security guards. They admit this is for "security." No language of "therapy" or "support" is used. *Verdict: Hard Surveillance.* (This lacks the Moral Shielding; it is easier to organize against).
  *   **FALSE INSTANCE 3 (Mission Creep):** A school starts offering a new after-school coding club. It requires sign-up forms. It is not framed as remediation or risk management. *Verdict: Service Expansion.* (This lacks the coercive/sticky element; kids can quit the club).

  ### 4. Is the "Caring" Vocabulary Essential?
  Yes. It is not just marketing; it is structural glue.

  1.  **Lowering Resistance:** It is hard to organize parents against "check-ins to help your child sleep better." It is easy to organize against "suspension." The vocabulary disarms the natural opposition that would limit the system's growth.
  2.  **Increasing Stickiness:** You can serve a detention and leave. It is hard to "graduate" from a support plan. If you try to leave, you aren't "escaping punishment," you are "rejecting help." This makes the Mesh-Thinning possible.
  3.  **Shifting Liability:** In the old model, if a kid acted out, the kid was liable. In the new model, if a kid acts out, the *system* might be liable for not having enough "support." This forces the system to document *more* to protect itself, driving the data expansion.

  ### 5. Why "The Caring Ratchet" Works
  Your colleague's term is better than the academic terms because it captures the **unidirectionality**.
  *   A ratchet allows motion in one direction.
  *   Once a "support" system is in place, it almost never shrinks.
  *   If the support system "fails" (the kid acts out), the solution is never *less* support; it is *more* intensive support (more forms, more meetings).
  *   The punitive option (exclusion) is kept in reserve as the "last resort," meaning the new system sits *on top* of the old one, not instead of it.

  ### Summary
  You are seeing **Therapeutic Net-Widening**.
  *   **The Structure:** Net-Widening (Criminology).
  *   **The Logic:** Pastoral Power (Foucault).
  *   **The Mechanism:** The Caring Ratchet (Your Colleague).

  It is not a bug; it is a feature of modern bureaucratic governance. We have moved from punishing the body to managing the life. The numbers look better because "exclusions" are a lagging indicator of harm, while "support plans" are a leading indicator of surveillance. You are counting the shadows, and the light has just changed angle.
