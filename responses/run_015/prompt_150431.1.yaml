answer: |-
  ### (1) Exam Question

  **Metaphysics Seminar Final: The Problem of Universals**
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 800 words

  **Prompt:**
  Do not begin by defining or contrasting Realism, Nominalism, and Trope Theory generally. Instead, focus exclusively on the internal coherence of Resemblance Nominalism when confronted with disjunctive properties.

  Consider the putative property *being crimson or triangular*. A Resemblance Nominalist analyzes property possession as nothing over and above particular objects resembling specific paradigms. However, if object *a* is crimson and object *b* is triangular, they do not mutually resemble each other in a specific respect, yet both satisfy the disjunction. Argue whether the Resemblance Nominalist can consistently deny the existence of a disjunctive universal without implicitly treating the relation "resembles-paradigm-a-or-paradigm-b" as itself a universal-like entity that generates an infinite resemblance regress. Specifically, assess whether the nominalist can halt this regression by positing a primitive, non-transitive similarity relation, and determine whether this move is ad hoc or independently motivated. Your essay must resolve whether this maneuver saves the ontology or collapses it into a disguised realism.

  ***

  ### (2) Model Answer

  Resemblance Nominalism attempts to eliminate universals by reducing property possession to classes of mutually resembling particulars. On this view, to say an object is crimson is simply to say it resembles the crimson paradigm objects. However, this reduction faces a critical challenge when applied to disjunctive properties, such as *being crimson or triangular*. If the nominalist denies the existence of a disjunctive universal, they must account for what unites the class of things that are either crimson or triangular without invoking a shared entity.

  The core tension arises because the class of "crimson-or-triangular" objects does not possess mutual resemblance. A crimson patch does not resemble a triangular patch in the relevant respect. To ground this class, the nominalist must appeal to a disjunctive resemblance relation: object *x* belongs to the class if *x* resembles the crimson paradigm OR *x* resembles the triangular paradigm. The danger here is that this disjunctive relation functions exactly like a universal. If "resembling-paradigm-A-or-paradigm-B" is a genuine relation instantiated by multiple pairs of objects, the nominalist has reintroduced a universal under the guise of a relation. This invites an infinite regress: if the relation itself is a universal, what unites the instances of this relation? If it is not a universal, what grounds its unity?

  To halt this regress, the resemblance nominalist may posit that similarity is a primitive, non-transitive fact. They argue that we need not analyze resemblance further; it is simply brute that *a* resembles the crimson paradigm and *b* resembles the triangular paradigm, without requiring a higher-order relation to unify these facts. By denying transitivity, the nominalist blocks the inference that *a* and *b* must resemble each other, thereby avoiding the need for a specific shared universal for the disjunction. The unity of the disjunctive class is merely linguistic or conceptual, not metaphysical.

  However, the viability of this move depends on whether it is ad hoc. If the nominalist accepts primitive similarity only when threatened by regress, the theory lacks systematic integrity. Armstrong argues that positing primitive resemblance classes for every disjunction makes the ontology bloated and unexplained. Conversely, the nominalist might independently motivate this primitivism by appealing to naturalness. If only natural properties correspond to genuine resemblance classes, and disjunctive properties are unnatural, then no metaphysical grounding is required for the disjunctive class beyond the brute facts of specific resemblances.

  Ultimately, the success of this defense hinges on the status of naturalness. If naturalness is itself a universal, the nominalist collapses into realism. If naturalness is primitive, the nominalist survives but at the cost of accepting brute modal facts. Therefore, the nominalist can avoid the regress only by accepting that similarity is primitive and constrained by a primitive notion of naturalness. While this saves the theory from infinite regress, it concedes that the ontology relies on unanalyzable brute facts, leaving it vulnerable to the charge that it has not truly eliminated universals but merely renamed them as primitive similarity clusters. The disjunctive problem reveals that resemblance nominalism cannot fully escape universal-like commitments without resting on ad hoc primitives.

  ***

  ### (3) Marking Scheme

  **Total Marks:** 20

  | Argumentative Move | Marks | Characteristic Mistake |
  | :--- | :--- | :--- |
  | **1. Articulate the Resemblance Nominalist reduction:** Clearly define properties as classes of mutually resembling particulars/paradigms without universals. | 4 | Fails to distinguish resemblance nominalism from trope theory or standard class nominalism. |
  | **2. Identify the disjunctive threat:** Explain why "crimson or triangular" fails mutual resemblance and requires a disjunctive relation. | 4 | Treats the disjunction as a problem for realism rather than specifically for resemblance nominalism. |
  | **3. Explain the regress argument:** Demonstrate how treating the disjunctive relation as a universal-like entity regenerates the problem of universals. | 4 | Describes a regress of properties rather than a regress of resemblance relations. |
  | **4. Analyze the primitive similarity solution:** Evaluate the proposal to halt regress via non-transitive, brute similarity facts. | 4 | Assumes primitivism automatically solves the problem without explaining the mechanism. |
  | **5. Evaluate ad hoc vs. motivated:** Conclude on whether the primitive posit is defensible via naturalness or remains an ad hoc maneuver. | 4 | Asserts the move is successful without addressing the cost of accepting brute facts. |

  The model answer argues that resemblance nominalism avoids infinite regress only by accepting primitive similarity and naturalness, which risks collapsing into a disguised realism.
