          *   *Vibe:* Metaphysical, "what if" scenarios based on similarity of worlds.

      *   **Interventionism (Pearl/Woodward):**
          *   *Core Idea:* $C$ causes $E$ if an *intervention* on $C$ changes the probability or value of $E$, while holding other relevant factors fixed.
          *   *Definition:* Invariance under intervention. Structural Causal Models (SCMs), Directed Acyclic Graphs (DAGs), $do$-operator.
          *   *Strength:* Handles confounding, mechanisms, and specific pathways better.
          *   *Vibe:* Manipulability, scientific testing, "wiggling" variables.

  3.  **Identify the Substantive Divergence:**
      *   It's not just notation. Lewis is about *truth conditions* for causal statements based on similarity of possible worlds. Interventionism is about *testing* causal claims via hypothetical or actual manipulations within a model.
