      *   **Conflict:** The user's writing group is split. Half say "overthinking it." The writing partner argues "no extra inner glow" (physicalism/functionalism: it's just data processing, no qualia, she's convincing herself).
      *   **User's Stance:** Thinks the partner is wrong but can't articulate why without sounding mystical ("ghosts in the machine").
      *   **Core Question:** Is the experience of tasting the "absence of warmth" real, or is she misinterpreting reports? Where does the "no inner glow" argument bite, and what does it cost to say she's genuinely experiencing something?
