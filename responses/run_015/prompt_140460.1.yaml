answer: |-
  Your historical claims are robust. The Entwurf theory (1913) indeed failed to yield the full 43 arcseconds, producing roughly 18″ or failing entirely depending on the specific approximation, making the 1915 success a discrimination between Einstein's own live candidates. This detail is crucial and often underplayed.

  Mapping the strategies reveals a stark divide. **Counterfactual Bayesianism** (Earman) asks us to bracket the 43″ from background knowledge. This is psychologically implausible for 1915 physicists; the anomaly was constitutive of the problem space. **Garber's solution** models the update as learning the entailment relation ($H \vdash E$) rather than $E$ itself. This fits Einstein's November 1915 credence shift: the joy was in the derivation, not the datum. **Glymour's bootstrapping** handles the auxiliaries well, treating the perihelion as a computed quantity derived from $H$ plus observational data, but struggles to explain why this bootstrap conferred more confidence than the messy eclipse data.

  Non-Bayesian accounts diverge sharply. **Zahar and Worrall's heuristic novelty** faces a crisis here. Since Einstein explicitly constrained his field equations to recover the perihelion advance, strict novelty accounts suggest $E$ confirms $H$ weakly or not at all. Yet, historically, the perihelion result carried more weight than the novel eclipse deflection. **Mayo's severity** offers a better fit: $H$ passed a severe test because rival theories (Newtonian + Vulcan, Entwurf) had failed it. The 'risk' was not in predicting a unknown number, but in deriving a known constant from principles where predecessors provably failed.

  Testing these against your three complications clarifies the landscape. First, regarding **auxiliaries**: $E$ is a residual, not a raw datum. Glymour handles this best formally, but Severity explains why the residual mattered: the error margins on the 43″ were tighter than the systematic errors plaguing the 1919 eclipse plates (specifically the discarded Sobral astrographic results). Second, on **dialectical history**: evidence does 'recharge'. When Vulcan died, the anomaly became a 'free' constraint available for capture. Bayesian accounts struggle to model this release of evidential debt; Severity captures it naturally as the elimination of a rival explanans. Third, on **engineered fit**: the Entwurf failure is decisive. Had Einstein merely tweaked parameters to fit 43″, novelty accounts would be right to discount it. But because the field equations were structurally distinct from Entwurf yet succeeded where it failed, the fit was not merely accommodative but discriminatory.

  My definite position is that **Mayo's Severity**, supplemented by **Garber's formalism**, best handles this episode, while **Heuristic Novelty** accounts are indicted by it. The literature often treats Mercury as a puzzle for Bayesianism, but it is actually a counterexample to strict novelty requirements. The intuition that Mercury did more confirmatory work than the Eclipse is correct and philosophically significant. The Eclipse was novel but 'noisy' (low severity due to systematic error risks); Mercury was old but 'clean' (high severity due to precise discrimination against live rivals).

  Bayesianism explains the *mechanism* of credence update (learning the entailment), but Severity explains the *magnitude* of the confirmation. The episode demonstrates that old evidence confirms strongly when it functions as a severe constraint that eliminates specific, live alternatives, regardless of temporal novelty. You should argue that the problem of old evidence is less about logical relations and more about the historical topology of theory space: Mercury confirmed GR because it was a hurdle that killed the Entwurf theory and Vulcan, not because it was unknown. This shifts the focus from the psychology of prediction to the reliability of the derivation, validating your scepticism regarding the standard literature's treatment of the example.
