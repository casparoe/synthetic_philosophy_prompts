answer: |-
  **Starting point**
  The session fails unless students accept that consequentialism requires a *decision procedure*, not just a criterion of rightness. You must establish that a theory can be true (the right act maximizes value) yet fail to be action-guiding (agents cannot identify that act). Cluelessness is not an objection to the truth of consequentialism; it is an objection to its usability. If students believe consequentialism only demands we *try* to maximize, or that "reasonable expectation" suffices without defining its limits, cluelessness vanishes. Secure the premise: *Action-guidingness requires comparability of expected outcomes.* Without this, the distinction between causal and evaluative barriers collapses into general skepticism.

  **Order of construction**
  Introduce components in this sequence to prevent conceptual bleeding.

  1.  **The Decision Procedure:** Define the consequentialist agent’s task as comparing expected values of available acts. This sets the metric for failure.
  2.  **Causal Cluelessness (Simple):** Present an act where the causal chain is too long/chaotic to assign probabilities (e.g., saving a life now affects future population composition). This establishes empirical opacity.
  3.  **Comparative Cluelessness (Complex):** *Crucial Pivot:* Do not teach "Evaluative Cluelessness." It collapses into moral uncertainty (your neighbour category). If students cannot compare outcomes because values are incommensurable or moral status is unsettled, that is axiological uncertainty, not cluelessness. Replace it with **Comparative Cluelessness** (Greaves): we know the causal structure is opaque for *both* options, and symmetry prevents comparison. This keeps the problem epistemic, not meta-ethical.
  4.  **The Neighbours:** Only now contrast with (a) Ordinary Risk (probabilities known), (b) Moral Uncertainty (values unknown), and (c) Plain Ignorance (research cures it). Cluelessness resists research and resists probability assignment.
  5.  **Action-Guidingness:** Conclude that if comparability fails, the procedure halts.

  Do not offer replies (e.g., "use wide credences") until step 4. If you offer defuses earlier, students will treat cluelessness as a solved puzzle rather than a structural barrier. The problem must bite before the remedy is suggested.

  **The carrying example**
  Your Deworming vs. AI example works for Causal Cluelessness but fails for the second half. Deworming has known near-term effects; AI has unknown long-term effects. This illustrates Simple Cluelessness (one option opaque). It does not illustrate Comparative Cluelessness, because you are comparing an opaque option to a transparent one. EA students will argue you just assign wide credences to the AI option and compare.

  To carry the session, you need a **Choice Between Opaques**. Replace the comparison with: *Campaign for AI Safety Regulation A* vs. *Campaign for AI Safety Regulation B*. Both have decades-long causal chains; both affect existential risk; neither allows reliable probability assignment. Here, EV reasoning stalls not because values are incommensurable (Evaluative), but because the empirical distributions are symmetrically unknowable (Comparative).

  The example must lack clear value disagreements (to avoid moral uncertainty) and lack clear empirical data (to avoid ordinary risk). It must force a choice where the agent says, "I know what I want, and I know these acts cause things, but I cannot say which causes more." If your example allows students to say "we just don't know what's good," you have taught moral uncertainty. If it allows "we just need more data," you have taught ignorance.

  **Misconception map**
  1.  **"Cluelessness is Ignorance":** Students will suggest better research. *Defuse:* Distinguish tractable ignorance (unknown facts) from intractable cluelessness (chaotic systems/unbounded futures). Research cannot fix chaos.
  2.  **"EV Absorbs It":** The EA reflex. "Just use wide credences." *Defuse:* Show that with symmetric opacity, wide credences overlap completely. Comparison requires non-overlapping distributions or a tie-breaking rule cluelessness denies.
  3.  **"It Is Moral Uncertainty":** The biggest risk. If you keep "Evaluative Cluelessness," this misconception wins. *Defuse:* By switching to Comparative Cluelessness, you force the problem to remain empirical. If they say "we don't know which value matters," correct them: "We agree on the value; we don't know the causal impact on that value."
  4.  **"It Implies Paralysis":** Students will think cluelessness mandates inaction. *Defuse:* Cluelessness threatens the *procedure*, not the act. One might use heuristics, but strictly consequentialist guidance is lost.
  5.  **"Stick to Near-Term":** The overcorrection. Students will conclude only deworming is permissible. *Defuse:* Note that near-term acts also have long-term causal tails (butterfly effects). Cluelessness is ubiquitous, not just long-term.

  The single poison pill is **#3 (Moral Uncertainty)**. If students conflate cluelessness with not knowing what is valuable, the session’s core distinction dies. Address this explicitly when introducing Comparative Cluelessness.

  **Check for understanding**
  **Question:** "If I assign a credence of 0.5 to 'Policy A saves 1 million lives' and 0.5 to 'Policy A saves 0 lives', and identical credences for Policy B, have I solved cluelessness?"

  **Good Answer:** "No. You have modeled ordinary risk. Cluelessness means you cannot justify those specific probabilities or claim the distributions are distinct. The expected values are identical not because of known symmetry, but because the probabilities are undefined or arbitrarily wide."

  **Bad Answer:** "No, because you need to account for moral uncertainty about the value of lives." (This conflates the categories).

  **Watch For:** Students nodding when you mention "unknown values." If they treat cluelessness as a value problem, the distinction has not landed. Interrupt and ask: "Is the problem that we don't know what happens, or that we don't care about what happens?"

  **Deliberate omissions**
  Do not teach **solutions** (e.g., satisficing, common-sense morality, subjective vs. objective rightness). This session is diagnostic, not prescriptive. If you introduce solutions, students will treat cluelessness as a hurdle to jump rather than a structural limit to analyze. Say explicitly: "We are diagnosing the failure of the decision procedure today, not repairing it. Proposals for repair assume the diagnosis is correct; we must secure the diagnosis first." This prevents the final ten minutes from devolving into debate over long-termist strategies.
