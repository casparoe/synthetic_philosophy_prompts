prompt: |-
  I keep hearing people compare democratic backsliding to a frog in slowly heating water — especially when they talk about Hungary, Poland, Turkey, or even recent US state-level election administration changes, where they say each individual reform (court packing, media council capture, district tweaks, voter roll purges) is just a small temperature bump, so citizens never feel the shock that'd make them jump out until democracy's basicaly cooked. The analogy gets used to license alarm about incremental erosion: the idea that waiting for a dramatic coup or tanks in the streets misses the point, since the danger is precisely the absence of a single breaking point, and every step stays technically legal.

  Can you lay out the correspondance table — what plays the role of the frog, the water, the heat source, the jumping reflex, the pot? Then tell me where it breaks: do democratic citizens actually lack discrete reaction thresholds, or do elections, protests, and judicial challenges work like jump attempts? Does the analogy smuggle in false passivity about voters and hide the agency of the party turning up the dial — or of international observers? And specifically, does the conclusion survive — that we should call backsliding by its name even without a singular constitutional rupture — once the disanalogies are accounted for? If the frog story was carrying the whole argument, what's a sharper framing? Please answer in American English, and don't worry about citations or reading lists — I just want the conceptual audit.
