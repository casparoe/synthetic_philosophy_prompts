  In the counterfactual where Wallace publishes alone in 1859 and Darwin's notebooks vanish:
  1.  **Robustness Test:** If Natural Selection still becomes the dominant paradigm without Darwin's *Origin* (which was more comprehensive than Wallace's paper), it demonstrates the *idea* has a gravitational pull independent of the *champion*.
  2.  **Isolation of Variable:** It removes the "Great Man" theory of history. If Wallace succeeds with less social capital and less data, the "Overdetermination" weight (Factor 1 above) increases. The discovery proves more inevitable because the barrier to entry was lower than we thought.

  ### Sensitivity Analysis
  **Which sub-part is my number most sensitive to?**

  **Factor 2: Modal Realism.**

