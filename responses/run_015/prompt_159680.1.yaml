  **MEMORANDUM**

  **TO:** Programme Committee
  **CC:** Applicant Consortium
  **DATE:** 24 October 2023
  **SUBJECT:** Decision on Application #2023-ED-09 (Cooperative Planning Pilot)

  **Recommendation**
  I recommend we **fund a specified redesign** of the proposed pilot, not the application as submitted. The project should proceed over twenty-four months, but with a mandatory **go/no-go gate at Month 12**. Funding for the second year is contingent on evidence that the central solver's shadow prices track external market signals within a defined variance threshold during the first year's parallel run.

  **Rationale: Incentives and Epistemology**
  My decision rests on two intersecting failures in the current design: mechanism design and epistemic validation.

  First, the proposal contains a critical incentive incompatibility. The planning office relies on firms reporting true capacities and input requirements to solve the linear programme. However, managers are evaluated on hitting quotas and documenting cost reductions. This creates a direct incentive to understate capacity and overstate input needs to secure easier quotas and favourable shadow prices. If managers game the inputs, the solver optimises a fiction. No amount of computational power corrects for systematic data falsification. A redesign must decouple manager evaluation from self-reported cost constraints, perhaps tying rewards to final output quality or external sales performance instead.

  Second, regarding the epistemic objection: we cannot assess success using only internal metrics. If the planning office declares efficiency based on its own shadow prices, it merely confirms its own logic. We require an external yardstick. Fortunately, the consortium sells roughly one-third of its final output at world market prices. This is our ground truth. The pilot must not replace negotiated transfer prices immediately. Instead, for the first twelve months, the solver must run in parallel. Firms should continue trading at negotiated prices while the office publishes shadow prices. We need to observe whether the shadow prices converge toward the external market prices for comparable goods. If the solver consistently values a metal component at €50 while the world market clears at €70, the model is missing constraints or costs known to the shop floor but invisible to the office.

  **Instrumentation and Success Criteria**
  To make this empirically decisive, the redesign must focus instrumentation on the **metalworking firms**, as they have the highest exposure to external pricing and the most complex intermediate flows. The pilot should track two specific metrics:
  1.  **Price Deviation:** The weekly percentage difference between the solver's shadow price for externally traded goods and the actual world market price.
  2.  **Inventory Volatility:** The variance in inventory levels compared to the previous year's baseline.

  The **go/no-go gate at Month 12** will be triggered as follows: If the average price deviation exceeds 15% without explanation via the qualitative constraint notes, or if inventory volatility increases by more than 20%, the project stops. This provides a hard falsification condition. It tests the computational claim (that the solver can match market efficiency) without risking the entire budget on a system that might collapse due to incentive gaming.

  **The Case for the Rejected Option**
  I must acknowledge the strength of the argument for funding the application **as submitted**. Proponents of the original design argue that a parallel run dilutes the commitment necessary for success. Their view is that planning is not merely a technical adjustment but a social shift; managers will not invest the effort to learn the new system or trust the shadow prices if they know those prices are hypothetical and will be overridden by negotiated rates. By hedging our bet with a parallel run, we may create a self-fulfilling prophecy where the system fails because participants treat it as a simulation rather than a reality. Furthermore, removing the immediate pressure to abandon negotiation might allow the old bargaining habits to crowd out the new planning culture entirely. There is merit to the claim that boldness is a variable in the experiment's success, and my recommendation risks testing the math while starving the social transition.

  **Conclusion**
  However, €2.5 million is too significant to spend on a mechanism with known incentive flaws and no external validation loop. The computational socialist argument—that modern telemetry solves the calculation problem—deserves testing, but only if the data feeding the solver is honest and the results are benchmarked against reality. The market socialist objection—that without markets there is no common scale—is answered by using the existing external market as a benchmark. The epistemic objection—that knowledge is tacit—is tested by comparing the solver's prices against the prices discovered by external buyers.

  I invite the consortium to resubmit with these modifications: a parallel run phase, revised manager evaluation metrics to ensure truthful reporting, and explicit benchmarking against external market prices for the metalworking division. We are prepared to move quickly on a revised proposal.

  **[Signature]**
  **Committee Member**
