      *   **Key Learning Outcome:** It's not that patterns are hard; it's that examples never pin down a *single* rule. The choice of rule comes from the observer, not just the data.
      *   **Specific Requirements:**
          1.  Recipe for creating problems (drawn/handouts).
          2.  Structure for committing to a rule in writing.
          3.  Mechanism for staking something on future predictions (points/tokens).
          4.  **Feature 1:** The turn from description to prediction (conceding both rules fit, but picking one).
