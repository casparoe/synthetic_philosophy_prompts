      *   *Rank 1 (The Architecture):* Focus on "Control Hierarchies" and "Representational Error." Use cybernetics/control theory concepts but keep it philosophical. *Why first?* It's the axiom.
      *   *Rank 2 (The Explanatory Shift):* Focus on "Historical vs. Nomological Explanation." If a volcano causes a famine, that's nomological. If humans respond, that's historical. *Why second?* It justifies the project's relevance to History.
      *   *Rank 3 (Non-Human Teleology):* Focus on "Proper Functions" (Millikan/Neander) vs. "Representational Goals." *Why third?* It's a supporting argument to clarify what non-humans *lack*.
      *   *Rank 4 (The Determinism Dissolution):* Show how this reframes determinism not as "causation" but as "narrative capture." *Why fourth?* It's the payoff/conclusion.

      *   *Wait, let's re-evaluate Rank 3 & 4.* Actually, understanding non-human teleology is crucial to make the contrast work. But the *explanatory shift* is the payoff for the History department. Let's keep Explanatory Shift as #2 because it validates the dissertation's contribution to the field. Non-human teleology is #3 because it's more Philosophy of Bio/Science, which is supportive.

      *   *Confidence Assessment:* I need to be honest. The "Representation" requirement is controversial (enactivists deny representation). The "Error-Correction" link to history is novel but risky.
