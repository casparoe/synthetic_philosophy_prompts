      *   *Key Tension:* Causal significance vs. Historical significance. A volcano causes a famine (causal), but does it *act* in history?
      *   *Key Concept:* Error-correction/Control Theory. This links to cybernetics, enactivism, and teleosemantics.
      *   *Tractability:* A philosopher can analyze concepts of agency, representation, and explanation. They cannot model climate systems or microbial genetics empirically.

  4.  **Develop the Agenda (Ranking & Criteria):**
      *   *Criteria for Ranking:*
          1.  **Foundational Necessity:** You can't build the house without the foundation.
          2.  **Philosophical Tractability:** Can a philosopher actually do this without needing a lab?
          3.  **Impact/Originality:** Does this move the needle on the determinism/agency debate?
          4.  **Risk:** Is it a dead end?

      *   *Drafting the Lines of Work:*
          1.  **Defining the Threshold:** What *exactly* is the cognitive architecture required? (Representation + Error Correction). This is the core theoretical contribution.
          2.  **The Explanation Gap:** How does this distinction change historical explanation? (Mechanistic vs. Historical/Narrative).
          3.  **The "Interest" Problem:** Can we talk about microbial "interests" without anthropomorphizing? (Teleology without mind).
          4.  **Case Application (Light):** Testing the framework against a specific case (e.g., The Black Death) to show it works, without making it *just* a case study.

      *   *Refining the Order:*
