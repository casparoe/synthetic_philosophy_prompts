  2.  **Deconstruct the Core Idea:**
      *   *Premise 1:* Non-humans (germs, climate) have functional interests (homeostasis/replication) but no representational content.
      *   *Premise 2:* Humans have representational states but are embedded in non-human systems.
      *   *Hypothesis:* "Historical Agency" requires a specific cognitive architecture (likely involving error-correction/feedback loops that utilize representation), distinguishing it from mere "Causal Power."
      *   *Implication:* This solves the determinism worry. Non-humans cause things, but only humans (or entities with similar architecture) *make history* in the explanatory sense.

  3.  **Evaluate the Philosophical Landscape:**
