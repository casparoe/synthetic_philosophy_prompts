          3.  Systemic non-worseness test (tax-and-transfer can pass proviso if it makes everyone better off; rejects forced labor analogy).
          4.  Remediation for proviso violations (compensation tracks present distribution).
          5.  Specific verdicts (Billionaire via voluntary trade = okay; State fencing commons = owes dividend).
