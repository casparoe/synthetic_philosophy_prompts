      *Wait, one nuance:* The user says (3) tax is okay if it leaves *everyone* better off. This is a Pareto improvement. Nozick might accept that *if* it's voluntary. But tax is coercive. So (3) justifies coercion based on outcome. (1) forbids coercion based on pattern. This is the core philosophical clash.

