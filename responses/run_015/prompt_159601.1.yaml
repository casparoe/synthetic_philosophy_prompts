      *   **Survival Analysis:** Marisol and Dev's positions post-audit.
      *   **Unstated Premises:** The normative load (Equality vs. Liberty).
      *   **Better Analogy:** "Money as a Bid in an Auction for Attention."

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I address Lobbying? Yes, need to fit that into the table or analysis. It fits under "Medium/Labor."
