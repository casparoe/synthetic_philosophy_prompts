          *   *Impact:* Complicates Dev. Is drafting a bill "speech"? It looks more like "staffing."
      *   *Independent Expenditures:* Who is speaking? Donor? Group? Candidate?
          *   *Impact:* Complicates both. Agency problems.

  5.  **Evaluating Conclusions (Survival Check):**
      *   *Marisol:* Does "Caps = Volume Limits" survive?
