      *   *Dev:* Does "Limits = Speech Limits" survive?
          *   Weakens. If money buys *labor* (lobbying) or *suppression* (buying inventory), it's not pure speech. Also, time/place/manner restrictions exist (Dev ignores these). The "counterspeech" remedy fails if money makes counterspeech impossible (expensive).

