      *   Rows: Speaker, Message, Audience, Medium, Volume, Constraint.
      *   *Challenge:* The "Spending Side" differs depending on whose analogy we use, but the prompt asks for *the* spending side corresponding to the speech side. I need to map the *actual* mechanics of spending against the *idealized* mechanics of speech.

  4.  **Analyzing the User's Critiques (The "Audit" Points):**
      *   *Critique 1 (Silencing):* Megaphones amplify *you*; Money can suppress *others* (buying inventory, litigation).
          *   *Impact:* Hurts Marisol. A noise ordinance doesn't stop me from renting the only hall in town.
      *   *Critique 2 (Fungibility):* Conviction isn't transferable; Money is. Wealth $\neq$ Intensity.
          *   *Impact:* Hurts Marisol's "volume knob" idea. The knob is detached from the speaker's lung capacity.
      *   *Critique 3 (Exchange Rate):* Decibels are physical; Dollars buy variable impressions (inflation, tech changes).
          *   *Impact:* Hurts Marisol. A \$1M cap today isn't \$1M cap in 10 years. It's not a stable physical limit.
