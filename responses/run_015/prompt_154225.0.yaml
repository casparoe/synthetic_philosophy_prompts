          *   Horn 2 (Epistemology): We need a causal theory of knowledge (or at least a plausible link between knower and known). Platonism fails this because abstract objects are causally inert.
          *   *Conflict:* You can't have both standard semantics and a naturalistic epistemology if math objects are Platonic.
      *   **Thin Realism (e.g., Penelope Maddy, Stewart Shapiro's Ante Rem Structuralism, or Resnik):**
          *   Rejects "heavy" Platonism (separate realm).
          *   Asserts math objects exist independently of us but are tied to structures/patterns in the world.
          *   Claim: We perceive structures/patterns, therefore we perceive math objects.
      *   **The User's Challenge:** Is perceiving a structure *really* perceiving the abstract object? Or is it just perceiving the concrete instance and *inferring* the structure? If the latter, the causal gap remains.

  3.  **Drafting the Argument Flow (The "Gears"):**

