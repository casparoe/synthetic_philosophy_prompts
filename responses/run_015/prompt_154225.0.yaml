      *   However, the user seems to be using "Thin Realism" more broadly to cover Structuralism (Shapiro/Resnik) where objects are mind-independent but not "separate." I should address the general spirit of "immanent realism" while acknowledging Maddy's specific contribution if it clarifies the "grounding" issue.
