answer: |-
  Thank you, Head Teacher, Chair of Governors, staff, families, and most especially the leavers of Anning College. It is a genuine privilege to stand in this marquee on a Warwickshire afternoon that has, against the odds, decided to be summer. We are gathered to celebrate what has been achieved, and to mark the moment before you scatter. I know that for many of you, this celebration is shadowed by a specific date seven weeks from now. I know that many of you hold offers in your hand that depend on envelopes you have not yet opened.

  The Head Teacher asked me, in our correspondence, to offer you a promise. He asked me to stand here and tell you that everything will work out. He wants me to say that because you are here, and because you have done the work, the grades will follow, and the paths will open. I understand why he asked. It is the natural thing for a guardian to say to those leaving the nest. But I owe you honesty, and I owe the truth a specific kind of respect. So I want to explain why I cannot make that promise, and why, despite that, you should feel entirely secure.

  There is a line of reasoning that feels irresistible today. It runs like this: Anning is a good school. You have been taught well by people who cared. Pupils who are taught well end up all right. Therefore, you will be all right. It is a beautiful syllogism. It is the engine of Speech Day. But I am not entitled to finish it. I cannot stand here and claim to know the conclusion is true.

  The reason is precise, and I want to locate it clearly. If I were to tell you "it will work out" today, I would be saying those words based on the evidence I have now: your hard work, your teachers' dedication, the history of this college. But if results day were to go badly—if the grades did not come—I would still have said these same words today. My saying them does not depend on the future turning out well; it depends on my hope and the evidence in front of me now. Because I would say it even if it were false, I cannot claim to know it is true. To claim knowledge requires that if the thing were not so, I would not be claiming it. I cannot satisfy that condition for a future I cannot control.

  (Beat)

  But this is not scepticism. This is not me telling you that you know nothing. It is quite the opposite. The fact that I cannot know the future does not infect what I know about the past. Knowledge does not flow backwards. My inability to guarantee the result does not erase the reality of the work. I know you studied. I know the staff taught you with integrity. I know those things because if you had not studied, or if they had not taught you well, I would not be standing here saying that you did. Those beliefs track the truth of what has happened.

  This asymmetry is where your reassurance lies. We often worry that if we cannot know the end of the story, the beginning must be uncertain. We fear that without the guarantee of the prize, the effort was risky. But the value of the effort does not depend on the prize. The work you have done over the last seven years is solid ground. It is not made of glass by the uncertainty of what comes next.

  So, what is the practical discipline here? It is to stop asking "Will it work out?" and start asking "What would have to be the case for it not to?" regarding things near at hand. Do not look at the distant horizon of a career or a life and demand certainty there. Look at the next step. Look at the preparation you have done. Look at the resilience you have built in this building. If you ask what would stop you from handling the next challenge, you will find fewer answers than if you ask whether the universe owes you a specific grade. You have built the capacity to handle the outcome, whatever it is. That capacity is known. It is real. It is yours.

  I cannot say I know what will happen if I would be standing here saying these same words even if it were not going to happen. But I can say this: the effort you have given these years is yours to keep, and no result can take it away.

  You are leaving a place that has demanded rigour from you. Part of that rigour is accepting that the world does not owe us certainty. But you are not going out empty-handed. You are going out with the knowledge of what you have done, and the company of people who know you did it. The grades will come when they come. They will open some doors and perhaps close others. But they are not the measure of the education you have received. The education is in the thinking you can now do, the questions you can now ask, and the work you know you are capable of sustaining.

  So, I will not promise you that everything will work out. I will tell you that you have already done the thing that matters. You have prepared yourselves. You have been taught by people who meant it. And you are ready to meet whatever comes, not because I know what it will be, but because I know who you are.

  Thank you.

  ***

  **Note on Philosophical Commitments**

  This speech leans on a specific, contested reading of the sensitivity condition for knowledge. A safety-based epistemologist might argue that if the belief is formed via a reliable process (e.g., induction from past school performance), it counts as knowledge even if it lacks sensitivity, potentially allowing the reassurance I withheld. Furthermore, some argue that denying closure undermines the utility of knowledge entirely; if I know the premises, the insulation of the past from the future may not feel like comfort to the audience. I maintain that sensitivity is the correct condition for contingent future claims, preserving the asymmetry between known past effort and unknown future reward. The single argument that would make me rewrite the refusal is a demonstration that reliability alone suffices for knowledge in high-stakes practical reasoning without collapsing into dogmatism.
