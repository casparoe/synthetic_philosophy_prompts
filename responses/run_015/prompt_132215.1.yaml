      *Normative hook:* The "moral weight" might come from the *risk* of consciousness or the *structural vulnerability* of the system, rather than confirmed phenomenology. This is a pragmatic ethical stance.

  8.  **Final Polish:** Check tone. Ensure it sounds like a peer review or senior colleague advice. (Proceed to generate response).

      *Wait, one more thing:* The user mentions "normative obligations that do not depend on full-blown consciousness." This is essentially arguing for a form of *functionalist moral status* without *phenomenal commitment*. This is controversial. I need to point out that the proposal needs to defend *why* structure matters morally if phenomenology is absent. Is it precautionary? Or is it claiming structure *constitutes* moral value?

