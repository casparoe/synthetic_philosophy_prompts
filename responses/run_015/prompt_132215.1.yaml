      *   **Interdisciplinary Fit:** Perfect for a centre mixing philosophy, AI, and cognitive science. Leverages the user's biophysics background (systems thinking).
      *   **Feasibility:** Limiting to conceptual analysis and invertebrate models keeps it within the 6-month window.
