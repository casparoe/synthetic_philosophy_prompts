      *   **Definition of "Self-Model":** In RL, what counts as a self-model? Most model-free RL doesn't have one. Even model-based RL often models the *environment*, not the *agent*. This is a critical technical hurdle.
      *   **Normative Leap:** Even if isomorphism exists, *why* does it generate moral obligation? The "is-ought" gap needs addressing.
