      *   *The "Self" Problem:* This is the biggest technical risk. Standard Actor-Critic doesn't have a "self." It has state representations $s_t$. Does $s_t$ include the agent? Usually implicitly. The user needs to define "integrative" carefully. Is it *temporal* integration (memory) or *structural* integration (world-model containing self)?
      *   *The Normative Gap:* If it looks like suffering but isn't conscious, why care? The user suggests "distinct from consciousness-based exclusion." This sounds like a "phenomenal functionalism" or "structural moral realism." Need to warn about the "philosophical zombie" objection.
