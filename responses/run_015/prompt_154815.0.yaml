prompt: |-
  Construct a realistic, single-paragraph thought experiment in a present-day workplace or municipal context—no science fiction, no demons, no perfect predictors—engineered so that a duty-to-remember position in the spirit of Margalit’s ethics of memory and a case-for-collective-forgetting position in the line of Rieff’s argument both deliver verdicts that run counter to their usual directions: the memory advocate should endorse the active closure and deletion of a public commemorative site, while the forgetting advocate should defend its mandatory preservation and continued public accessibility. The scenario must center on a state- or corporate-managed memorial to past harm done to a population that now lacks thick relational ties to the local community, and the structural conditions that enabled the original harm must persist in the present institution; the reversal must fall out genuinely from each theory’s own criteria rather than being stipulated, with the counterintuitive force arising from consistent application. After presenting the scenario, walk through what each position says and why, name the specific feature of the case that forces the reversal, state what verdicts return if that feature is removed, and explain how a defender of the theory that comes out badly could attack the case as unfair. Inject one niche institutional mechanism—such as an algorithmically updated memorial archive or a biometric attendance mandate—to keep the case from being a standard textbook example. In your response, separate what is broadly settled in the philosophy of collective memory from what remains genuinely contested among specialists—particularly about whether institutional remembrance can substitute for thick relational care, and whether strategic forgetting requires prior structural transformation—and do not present either contested claim as if it were the consensus.
