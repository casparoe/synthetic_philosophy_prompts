answer: |-
  # The Safety-Net Model Approval Protocol (SN-MAP)

  **Purpose:** To guide the Committee through a consistent, evidence-based, and ethically explicit review of any predictive model proposed for patient care or operations.
  **Time Required:** 90–120 Minutes.
  **Participants:** Clinical Lead, Data Lead, Legal/Compliance, Patient Reps, Finance, Administration.
  **Rule of Order:** If a step results in a **STOP**, the proposal is rejected or sent back for redesign. If a step results in **VALUE JUDGMENT**, the Committee must vote; there is no "correct" mathematical answer.

  ---

  ## Step 1: The Action Test (15 Minutes)
  **Question:** What specific action happens to the patient when the score is high?
  **Goal:** Define the stakes. A score that triggers a phone call is different from a score that triggers a denied referral.

  *   **Ask the Vendor/Proponent:** "If a patient lands in the top 40, what physically happens? If they land in the bottom 860, what happens?"
  *   **Sufficient Answer:** A clear description of the resource allocation or clinical workflow change.
  *   **STOP Condition:** The action is punitive (e.g., "they get longer wait times," "they are denied a slot") without a direct clinical safety benefit to *that* patient.
  *   **Handoff to Human:** None. This is factual.

  ## Step 2: The Truth Test (Labels) (20 Minutes)
  **Question:** Is the thing we are predicting actually true, or is it a mirror of our own past behavior?
  **Goal:** Detect "Label Contamination." (e.g., predicting readmission based on readmissions that only count if they happen *here*).

  *   **Ask the Vendor/Proponent:** "How was the 'correct answer' determined in the past? Did we miss events because patients went elsewhere? Did our own past interventions change the outcome?"
  *   **Sufficient Answer:** Acknowledgement of data gaps (e.g., "We know we miss readmissions to other hospitals") and a plan to adjust for it, OR proof that the data source captures events regardless of location.
  *   **STOP Condition:** The model was trained on outcomes that were directly suppressed by the very intervention being proposed (e.g., "We trained this on last year's patients, but last year's high-risk patients got care coordination which stopped them from readmitting, so the model now thinks high-risk patients look low-risk").
  *   **Handoff to Human:** None. This is a factual flaw in the math.

  ## Step 3: The "Blind" Test (Proxies) (20 Minutes)
  **Question:** If the model isn't allowed to know a patient's race or insurance, does it know their zip code or billing history instead?
  **Goal:** Acknowledge that "demographic-blind" does not mean "bias-free."

  *   **Ask the Vendor/Proponent:** "List every input variable. Which of these correlate strongly with race or poverty in our city?"
  *   **Sufficient Answer:** A list of proxies (e.g., Zip Code, Insurance Type, Language, Missed Appointments).
  *   **STOP Condition:** The vendor claims that removing race makes the model neutral and refuses to test for proxy bias.
  *   **Handoff to Human:** None. This is factual correlation.

  ## Step 4: The Pie Test (Resource Constraints) (20 Minutes)
  **Question:** Is this a "Yes/No" decision or a "Ranking" with a fixed budget?
  **Goal:** Determine which fairness rules are mathematically possible.

  *   **Ask the Committee:** "Do we have enough resources for everyone who qualifies (Yes/No), or do we have to pick the top X (Ranking)?"
  *   **Sufficient Answer:**
      *   *If Yes/No:* We can aim for equal accuracy across groups.
      *   *If Ranking (Fixed Budget):* We **cannot** guarantee equal accuracy AND equal selection rates if one group is genuinely sicker or faces more barriers.
  *   **STOP Condition:** The vendor promises that a ranking model will achieve equal selection rates and equal accuracy across groups simultaneously without proving the underlying risk is identical.
  *   **Handoff to Human:** **VALUE JUDGMENT.** (See Step 5).

  ## Step 5: The Trade-Off Vote (Fairness) (25 Minutes)
  **Question:** Since we can't be perfect everywhere, which error is less harmful?
  **Goal:** Force the committee to choose which fairness promise to break. (The Impossibility Theorem).

  *   **Present the Choice:** "Because of Step 4, we have to choose one of these three paths. We cannot have all three."
      1.  **Equal Opportunity:** We catch the same % of sick people in every group. (Result: We might spend more resources on the group that is systematically sicker).
      2.  **Equal Selection:** We pick the same number of people from every group. (Result: We might miss very sick people in the high-risk group to make room for less sick people in the low-risk group).
      3.  **Equal Precision:** Of the people we pick, the same % actually need help in every group. (Result: We might ignore the high-risk group entirely if their risk factors look 'noisy' to the model).
  *   **Sufficient Answer:** A recorded vote on which path the hospital prioritizes.
  *   **STOP Condition:** The Committee refuses to choose and insists the vendor "fix the math" to achieve all three.
  *   **Handoff to Human:** **VALUE JUDGMENT.** This is a policy decision, not a data decision.

  ## Step 6: The Audit Plan (Monitoring) (20 Minutes)
  **Question:** Since we can't collect race data, how will we know if this hurts a specific group?
  **Goal:** Establish a workaround for compliance restrictions.

  *   **Ask Compliance/Data:** "We cannot use race. What proxies will we track monthly?"
  *   **Sufficient Answer:** A commitment to track outcomes by **Insurance Type (Medicaid/Private), Zip Code Deprivation Index, and Preferred Language.**
  *   **STOP Condition:** No plan to monitor outcomes by *any* protected proxy.
  *   **Handoff to Human:** **VALUE JUDGMENT.** The Committee must decide what level of disparity in these proxies triggers a shutdown of the model.

  ---

  # Application of the Protocol

  Here is how the SN-MAP protocol applies to your three current proposals.

  ## Case 1: The Readmission Risk Model (Care Coordination)
  *   **Proposal:** Rank 900 discharges; top 40 get care coordination.
  *   **Step 1 (Action):** **Pass.** Action is beneficial (extra support).
  *   **Step 2 (Truth):** **FAIL (Conditional).**
      *   *Finding:* The label is contaminated. Patients who received coordination last year didn't readmit, so the model thinks they were "low risk." The model is learning to avoid patients who respond well to help.
      *   *Resolution:* Proposal cannot proceed *unless* the vendor retrains the model excluding patients who received the intervention in the training data.
  *   **Step 3 (Blind):** **Pass with Warning.** Zip code and billing codes are admitted proxies for race/class.
  *   **Step 4 (Pie):** **Ranking.** Fixed budget (40 slots).
  *   **Step 5 (Trade-Off):** **Value Judgment.**
      *   *Committee Decision:* We choose **Equal Opportunity**. Because this is a safety-net hospital, our mission is to catch the sickest patients, even if that means the 40 slots go disproportionately to patients from high-poverty zip codes. We accept that the "success rate" of the slots might look lower in that group because the need is higher.
  *   **Step 6 (Audit):** **Pass.** We will monitor by Insurance Type and Zip Code. If Medicaid patients are selected at less than 50% of the rate of their discharge volume, we pause.
  *   **Verdict:** **APPROVED WITH CONDITIONS.** (Must fix label contamination; must accept the "Equal Opportunity" trade-off).

  ## Case 2: The Clinic Overbooking Model
  *   **Proposal:** Predict no-shows. Double-book slots for patients predicted to miss appointments.
  *   **Step 1 (Action):** **FAIL.**
      *   *Finding:* The action is punitive to the patient being predicted. If the model predicts a patient will no-show, the clinic overbooks their slot. If the patient *does* show up, they face a long wait or are turned away.
      *   *Reasoning:* The factors predicting no-shows (transport instability, childcare issues, shift work) are structural vulnerabilities. This model penalizes patients for being vulnerable by reducing their access to care when they *do* make the effort to arrive.
  *   **Step 2 (Truth):** **FAIL.**
      *   *Finding:* Label contamination. Patients marked as "no-shows" often had appointments cancelled by the clinic previously or faced barriers that the clinic created.
  *   **Step 5 (Trade-Off):** **Value Judgment.**
      *   *Committee Decision:* Even if the math worked, the harm falls entirely on the patient (waiting time, lost trust), while the benefit falls entirely on the clinic (revenue, provider idle time).
  *   **Verdict:** **REJECTED.**
      *   *Rationale:* Fails Step 1 (Punitive Action). In a safety-net setting, we cannot optimize revenue by penalizing instability. This creates a "rich get served, poor get bumped" system.

  ## Case 3: Radiology Queue Reordering
  *   **Proposal:** Reorder the queue of X-rays/MRIs waiting for a radiologist's read based on predicted acuity.
  *   **Step 1 (Action):** **Pass.** Action is clinical triage. Everyone gets read eventually; order changes.
  *   **Step 2 (Truth):** **Pass.** Acuity is determined by clinical markers (e.g., trauma flags, ED vs. Clinic), not past utilization.
  *   **Step 4 (Pie):** **No Fixed Budget.**
      *   *Finding:* This is not a ranking for a scarce resource (like the 40 care slots). Every image gets read. This removes the "Impossibility Theorem" pressure. We don't have to choose between groups because we aren't denying service.
  *   **Step 5 (Trade-Off):** **Value Judgment.**
      *   *Committee Decision:* We prioritize **Speed for Critical Cases**. If this results in non-critical patients waiting longer, that is acceptable clinical triage.
  *   **Step 6 (Audit):** **Pass.** Monitor turnaround time by Insurance/Zip. Ensure safety-net patients aren't systematically deprioritized due to data entry delays in their charts.
  *   **Verdict:** **APPROVED.**
      *   *Rationale:* Low risk of structural harm. No fixed budget means fairness constraints are easier to satisfy. Clinical benefit is clear.

  ---

  ## Notes for the Committee Chair (You)

  1.  **On the "Impossibility" Step:** When the committee tries to vote for "All of the Above" in Step 5, use this script: *"If Group A has twice the disease rate of Group B because of poverty, and we only have 40 slots, a perfect model will pick mostly Group A. If we force it to pick half from Group B, we are leaving sick Group A patients untreated. We have to decide if our goal is 'treating the most sick' or 'looking fair in the numbers.' We cannot do both."*
  2.  **On the Race Audit:** Be clear with Legal. *"We are not collecting race. We are collecting Zip Code and Insurance Type. We know these are imperfect proxies for structural racism. We are accepting that imperfection because the alternative is blindness. If the model fails Medicaid patients, we treat that as a signal of racial bias."*
  3.  **On the Overbooking "No":** If Finance pushes back on the Overbooking rejection, refer them to Step 1. *"This protocol defines punitive actions on vulnerable patients as a Stop Condition. We can optimize revenue, but not by increasing wait times for patients who overcome barriers to show up."*

  This procedure shifts the burden from "prove the model is biased" (which is hard without race data) to "prove the model is safe and the trade-offs are accepted" (which is the committee's job).
