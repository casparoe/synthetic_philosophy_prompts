      *   **Tone:** Technical, precise, philosophical but grounded in biology/math, critical but respectful of both frameworks.

  2.  **Deconstruct Nietzsche's Narrative (Genealogy of Morals):**
      *   *Master Morality:* Good/Bad. Strong, healthy, powerful define "good." Weakness is "bad" (contemptible, not evil). Direct expression of will to power.
      *   *Slave Morality:* Good/Evil. Reaction to oppression. The weak define the strong as "Evil." Therefore, *they* (the weak) are "Good" (by negation). Driven by *ressentiment* (repressed vengeance).
