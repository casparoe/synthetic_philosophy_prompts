      *   *Slave Morality:* A conditional strategy or a mutant strategy in a population dominated by the "Masters."
      *   *Ressentiment:* Not an emotion, but a strategic response to being outcompeted. It's a shift in the payoff matrix.
      *   *Slave Revolt:* A phase transition in the population's equilibrium. Frequency-dependent selection flips the fitness landscape.
      *   *Ascetic Ideal:* Costly signaling (handicap principle) or Group Selection mechanism. Self-restraint signals commitment to the group, suppressing intra-group aggression (predation) to ensure group survival against external threats.
