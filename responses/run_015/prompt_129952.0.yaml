answer: |-
  A married couple, Mark and Sarah, sit in the office of Dr. Varella, a metaphysical counselor. They are hoping to resolve their constant arguing by legally merging into a single conscious entity.

  Dr. Varella slides a document across the desk. "Before we proceed, you need to initial the Phenomenal Merger Law conditions. Just to recap: You can combine into exactly one macro-conscious entity only if you share *precisely one* qualitative feature, are otherwise entirely disjoint in experiential content, and neither of your original first-person perspectives survives the result."

  Mark nods. "We can do that. We're very aligned."

  "Let's test it," says Varella. "Close your eyes. Tell me one qualitative feature you both share right now."

  Sarah says, "The feeling of love."

  Mark says, "The feeling of love."

  Varella shakes his head. "Rejected. You also both feel the pressure of the chair against your backs. That's a second shared feature. Merger requires *exactly one*."

  "Okay," says Mark, standing up. "Now we don't share the chair feeling."

  "But you both feel gravity," Varella points out. "And you both hear the hum of the HVAC system. And you both feel the passage of time. That's four shared features already. To merge, you need to be experientially disjoint except for a single point of contact."

  Sarah thinks hard. "What if we focus only on the color red? I'm visualizing a red dot. Mark, visualize a red dot."

  "I am," says Mark.

  "Do you share anything else?" asks Varella.

  "Well," says Mark, "we're both breathing."

  "Shared qualia of respiration," Varella notes. "Rejected."

  "We're both confused," says Sarah.

  "Shared qualia of confusion. Rejected."

  They sit in silence for a minute. The room is quiet.

  "I think I have it," says Mark. "We both feel... the desire to stop arguing."

  Sarah nods. "Yes. Just that. Nothing else."

  Varella raises an eyebrow. "Are you sure? You aren't both feeling the floor beneath your feet? You aren't both feeling the ambient light through your eyelids?"

  "We've trained ourselves to ignore those," Mark insists. "For the sake of the marriage. It's just the desire. One feature. Totally disjoint otherwise."

  "Very well," says Varella. "Initiating merger."

  There is a flash of light. Mark and Sarah slump forward, then straighten up simultaneously, moving with uncanny synchronization. They open their eyes.

  "Who are you?" asks Varella.

  The entity looks at Varella with a calm, unified gaze. "I am the Union."

  "Do you love Sarah?" asks Varella.

  The Union blinks. "I don't know who Sarah is. That perspective was deleted per clause three."

  "Do you love Mark?"

  "Deleted as well."

  "Then why did you merge?"

  "Because the desire to stop arguing was the shared feature," says The Union. "And now that I am one, there is no one left to argue with. The problem is solved."

  Varella closes his notebook. "So the combination problem is solvable?"

  "Yes," says The Union, standing up to leave. "But you can't bill us. Neither of the original taxpayers survives."
