          6.  I know the funding isn't coming, but I don't believe it (Knowledge vs Belief - Complex, likely OK or distinct)
          7.  I don't believe in free will, but I believe I chose to take this module (Compatibilism/Scope - Not Moore)
      *   *Principle:* Truth-conditions vs. Assertibility conditions. Or: 1st Person Present Indicative Active.
      *   *Timing:* Middle. After the logic is defined, before the deep dive into *why* it's absurd. It cements the form.
      *   *Selection:* Don't use all 7. Use 4-5 key ones.

