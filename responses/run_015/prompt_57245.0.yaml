      *   *Goal:* Distinguish grasp vs. politeness.
      *   *Idea:* Ask about the *consequences* of the paradox.
      *   *Question:* "If I convince you that 'P but I don't believe P' is absurd, have I convinced you that P is false, or that I am irrational?"
      *   *Good Answer:* It shows I am irrational/unfit to assert, not that P is false.
      *   *Bad Answer:* It means P is false (confusing assertion with truth).

