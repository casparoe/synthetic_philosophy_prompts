answer: |-
  Your working assumption is **incorrect**. While it is true that a strictly dominated strategy is never a best response to *any* belief, the Iterated Elimination of Strictly Dominated Strategies (IESDS) does significantly more work than just the first round.

  The set of strategies surviving IESDS is a **subset** of the strategies that are best responses to some belief in the original game. In fact, IESDS eliminates strategies that *were* best responses in the original game, but only to beliefs that are themselves "irrational."

  Here is exactly where your argument breaks down and the correct characterization of what IESDS guarantees.

  ### 1. Where the Argument Breaks Down
  Your argument hinges on this equivalence:
  > *A strategy survives IESDS $\iff$ It is a best response to some belief in the **original** game.*

  This is false. The correct condition for survival is recursive:
  > *A strategy survives IESDS $\iff$ It is a best response to some belief over opponent strategies that **also survive IESDS**.*

  **The Flaw:**
  In Round 1, you eliminate strategies that are never best responses to *any* opponent strategy (including irrational ones).
  In Round 2, you eliminate strategies that are never best responses to any *rational* opponent strategy (i.e., strategies that survived Round 1).

  A strategy might be a best response to a belief in the original game, but if that belief assigns positive probability to a strategy that gets eliminated in Round 1, then the strategy itself will be eliminated in Round 2. IESDS imposes **Common Knowledge of Rationality**: I know you are rational, you know I am rational, I know that you know I am rational, etc.

  ### 2. A Concrete Counter-Example
  Consider the following 3x3 game. We will show that a strategy can be a Best Response (BR) in the original game but still be eliminated by IESDS.

  **Payoffs (Row, Col):**
  | | **L** | **C** | **R** |
  | :--- | :---: | :---: | :---: |
  | **T** | 2, 1 | 0, 0 | 0, 0 |
  | **M** | 0, 0 | **1, -1** | 0, 0 |
  | **B** | 0, 0 | 0, 0 | 2, 1 |

  **Step 1: Check Round 1 (Original Game)**
  *   **For Column:** Strategy **C** is strictly dominated by a mixed strategy of $0.5L + 0.5R$.
      *   If Row plays T: $0.5(1) + 0.5(0) = 0.5 > 0$ (Payoff from C).
      *   If Row plays M: $0.5(0) + 0.5(0) = 0 > -1$ (Payoff from C).
      *   If Row plays B: $0.5(0) + 0.5(1) = 0.5 > 0$ (Payoff from C).
      *   **Action:** Eliminate **C**.
  *   **For Row:** Are any strategies dominated?
      *   **M** is a **Best Response** to the belief that Column plays **C**. (If Col plays C, Row gets 1 from M, 0 from T, 0 from B).
      *   Since M is a best response to *some* belief (Col plays C), **M is NOT eliminated in Round 1.**

  **Step 2: Check Round 2 (Reduced Game)**
  *   Now Row knows Column is rational and will not play **C**. Row's belief must be over $\{L, R\}$.
  *   **For Row:** Compare M against a mix of T and B (e.g., $0.5T + 0.5B$).
      *   If Col plays L: Mix gets $0.5(2) + 0.5(0) = 1$. M gets 0.
      *   If Col plays R: Mix gets $0.5(0) + 0.5(2) = 1$. M gets 0.
      *   **Action:** **M** is now strictly dominated. Eliminate **M**.

  **Conclusion:**
  Strategy **M** was a best response to a belief in the *original* game (belief = Col plays C). However, **M does not survive IESDS**. This proves that the set of IESDS survivors is strictly smaller than the set of strategies that are best responses to *some* original belief.

  ### 3. The Correct Characterization: Rationalizability
  The set of strategies surviving IESDS (when allowing domination by mixed strategies) is exactly the set of **Rationalizable Strategies**.

  This concept was formalized by Bernheim (1984) and Pearce (1984). A strategy is rationalizable if it survives the following infinite recursion:
  1.  I play a best response to what I *believe* you will play.
  2.  My belief about you must assign probability only to strategies that are best responses for *you*.
  3.  Your strategies must be best responses to what *you* believe I will play.
  4.  And so on...

  **The Guarantee:**
  IESDS guarantees that the surviving strategies are consistent with **Common Knowledge of Rationality (CKR)**.
  *   **Round 1 Survivors:** Strategies that are rational (Best Responses to *something*).
  *   **Round 2 Survivors:** Strategies that are rational, assuming the opponent is rational.
  *   **Round $k$ Survivors:** Strategies that are rational, assuming the opponent is rational, assuming the opponent assumes I am rational... ($k$ times).
  *   **IESDS Limit:** Strategies consistent with infinite levels of this reasoning.

  ### Summary
  *   **Your Assumption:** Survivors = Best Responses to beliefs in $S_{original}$.
  *   **Reality:** Survivors = Best Responses to beliefs in $S_{surviving}$.
  *   **Result:** IESDS eliminates strategies that rely on the opponent playing "irrationally" (playing dominated strategies). In 2-player games, IESDS survivors $\equiv$ Rationalizable Strategies. In $N$-player games ($N>2$), IESDS survivors $\equiv$ **Correlated** Rationalizable Strategies (because IESDS allows you to hold correlated beliefs about different opponents' strategies).

  So, iteration *does* real work: it prunes away best responses that depend on irrational opponent behavior.
