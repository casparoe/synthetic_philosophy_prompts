  The dispute
  The core conflict is whether moral progress stems from psychological shifts in honor or material changes in interest. Maya argues, following Appiah, that practices like slavery and dueling ended when they became socially embarrassing within elite honor codes. She adds that status inflation made slaveholding tacky rather than noble. Jordan contends honor is merely post-hoc rationalization for economic efficiency and state monopolies on violence. He argues Maya's view reduces morality to fashion, stripping it of normative force. Essentially, Maya prioritizes social psychology and status competition, while Jordan prioritizes structural materialism. The debate hinges on whether honor drives history or merely decorates economic inevitabilities.

  Round-by-round
  Round 1: Maya is clearly right on dueling. Historical records show legal bans existed for centuries without stopping the practice; only when cultural shame attached did it vanish. Jordan is too reductive on slavery; abolition occurred in non-industrial economies like the British Caribbean before full industrialization. Economic efficiency doesn't fully explain the timing. Jordan's state monopoly point works for dueling but ignores the cultural prerequisite for enforcement. Laws require cultural legitimacy to function effectively.

  Round 2: Maya wins on the Confederacy. Fighting an economically ruinous war strongly suggests status concerns outweighed pocketbooks. Jordan's claim that status competition is just "interest" is semantically slippery; if everything is interest, the term explains nothing. However, Jordan is right that status inflation relies on social competition, which is a form of interest, just not monetary. Maya's "tacky" argument explains the psychological shift better than pure economics. She captures the internal logic of the slaveholders better than Jordan's external materialism. Regarding status inflation, Maya's insight that gentleman-status became cheap is compelling but underdeveloped. It explains the shift but not the origin.

  Round 3: Jordan lands a critical philosophical hit. If honor shifts are arbitrary like fashion, moral revolutions lack normative pull. Maya fails to explain why we should prefer new honor codes over old ones beyond social pressure. This makes moral progress look accidental. Jordan is right that Appiah's thesis risks making morality contingent on elite whims. Without an independent moral standard, honor is just peer pressure.

  Overall: Maya provides a better historical mechanism for *how* change happened, particularly regarding elite psychology. Jordan correctly identifies the philosophical weakness in Appiah's account but overstates economic determinism. Maya is closer to the empirical reality of these specific cases, though Jordan wins the theoretical high ground on moral realism. Neither is fully wrong, but Maya explains the specific historical puzzles better. Jordan's materialism is too blunt for cultural phenomena. Maya's specific historical examples carry more weight than Jordan's general theoretical critique. Regarding the state monopoly, Jordan is right that violence regulation matters, but without the honor shift, laws remain dead letters. The interaction is key.

  What's missing
  Both ignore the agency of subordinate groups. Enslaved people resisted slavery; it wasn't solely elite shame that ended it. Dueling declined partly because rising middle classes rejected aristocratic codes, not just elite whim. Additionally, they treat honor and interest as binaries. Material conditions often create the environment where honor codes can shift; industrialization didn't cause abolition directly but changed the social structure allowing new honors to emerge. Finally, Jordan misreads Appiah. Appiah argues honor channels moral reasoning, not replaces it. Social scaffolding supports ethics; it doesn't negate normative pull. Both miss that material and cultural forces co-constitute each other rather than competing as sole causes. They also overlook that honor codes often react to material changes rather than initiating them. The interplay is dynamic.

  What would change my mind
  If Maya produced evidence that abolitionist rhetoric successfully utilized honor-based arguments prior to economic shifts, I'd lean harder her way. If Jordan showed Confederate leaders privately citing economic forecasts over status in correspondence, his materialism would hold. My reasoning is shakiest on the normative pull critique. I assume moral realism exists to judge honor codes, which is philosophically contested. I might be overvaluing Appiah's psychological plausibility over Jordan's structural analysis without sufficient evidence. Further historical data on elite private correspondence versus public rhetoric would clarify the true motivators.
