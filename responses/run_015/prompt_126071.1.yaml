prompt: |-
  My roommate and her coworker argued over dinner about why norms like slavery and dueling actually disappeared. Maya said she mostly buys the Appiah and Williams line—that norms like those don't collapse because people suddenly win arguments, but because honor codes shift and make the old practice embarrassing. She added her own twist: with slavery, slaveholders already saw themselves as honorable gentlemen, so the revolution wasn't honor being redirected toward abolition, but honor suffering status inflation—once gentleman-status got too cheap to claim, owning slaves went from noble to tacky. Jordan said that's just economic interest wearing a fancy coat. Industrial capitalism made slave labor inefficient, and dueling died because states monopolized violence and raised legal risks—honor is just the story people tell afterward. Maya pushed back that slaveholders fought a war they knew was economically ruinous, which only makes sense if status and honor were really on the line, not pocketbooks. And dueling bans existed for centuries with little effect—only when elites started seeing it as cowardly rather than brave did it actually stop. Jordan replied that Maya's "status inflation" collapses honor right back into social competition, which is just interest by another name. Plus if honor shifts are totally independent of reason, then the Appiah thesis makes moral revolutions look like fashion trends with no normative pull, which can't be right. They want me to referee and I honestly can't tell who's winning. Can you go through their exchange round by round—say who's clearly right or wrong at each step, note what both miss, and give an overall sense of who's closer? Also say exactly what argument or fact would change your verdict, and be straight about where your reasoning is shakiest. Format it like this: "The dispute" (~150 words), "Round-by-round" (~350 words), "What's missing" (~150 words), "What would change my mind" (~100 words). I'm writing this on my phone so there might be a typo or two—sorry if "refferee" is misspelled or something.
