answer: |-
  ### Interview Strategy and Sequence

  **Reasoning for the Order:**
  The sequence begins by establishing the technical foundation (Symmetry) before applying it to your concrete case study, which forces her to move from abstract defense to practical application. We then press on the stakes (Magnitude) using the same case to show tension. The middle section targets the internal coherence of her view (Continuity and Information Value), saving the strongest internal contradiction (Information Value) for the midpoint where attention is highest. The final section challenges the theoretical identity of her view (Level-Shifting and Collapse) before ending on the methodological constraint (Falsification). This order prevents her from retreating to abstractions after the case study; once she commits to the case, the later questions about institutions and criteria must also account for that commitment.

  **Weak Angle Flag:**
  **Angle 3 (Continuity/Arbitrariness)** is the weakest line of questioning. R can easily defend a "pragmatic horizon" (e.g., "we stop where calculation costs exceed benefits") without damaging her core thesis. I have included it because you requested it, but do not expect her to concede here; use it primarily to set up the stronger Information Value question that follows.

  **The "Killer" Question:**
  **Question 8 (Information Value Follow-up)** is the most likely to make her move. It targets an internal contradiction: if long-run effects cancel out (EV = 0), acquiring information about them should have no expected value. If acquiring information *does* have value, the effects cannot be symmetric. She cannot consistently hold both that the effects cancel *and* that forecasting research is a priority.

  ---

  ### The Questions

  **1. Symmetry (Main) — [Case Anchor 1]**
  *Setup:* You argue that cluelessness yields evidential symmetry, but standard decision theory treats this as imprecise probability rather than a precise fifty-fifty split.
  *Question:* In the case of the graduate student choosing between academia and finance, on what basis do you claim the evidence supports the hypothesis of positive long-run influence *equally* with the hypothesis of negative influence, rather than simply supporting neither?
  *Anticipated Reply:* She will likely invoke a Principle of Indifference over chaotic outcomes, arguing that without evidence of bias, positive and negative valuations are equiprobable.
  *Follow-up Plan:* Press on whether chaotic systems permit a uniform prior.

  **2. Symmetry (Follow-up)**
  *Question:* If the causal chain is chaotic, doesn't that preclude the uniform prior required for your Principle of Indifference, leaving you with imprecise credences that ambiguity-averse rules would block?
  *Anticipated Reply:* She may argue that for the purpose of decision, imprecise credences functionally collapse to symmetry.
  *Note:* Accept this move to pivot to Magnitude; do not get bogged down in technical probability theory.

  **3. Magnitude (Main) — [Case Anchor 2]**
  *Setup:* You accept that long-run effects are orders of magnitude larger than near-term effects, yet you let the near-term effects decide the choice.
  *Question:* Regarding the finance job funding bednets, if the long-run demographic effects dwarf the near-term lives saved, doesn't "they cancel" require you to defend risk-neutrality over moral value at a scale where most agents are risk-averse?
  *Anticipated Reply:* She will likely defend moral risk-neutrality, arguing that expected value is the only rational guide regardless of variance.
  *Follow-up Plan:* Press on whether this makes the far future decision-irrelevant.

  **4. Magnitude (Follow-up)**
  *Question:* If you are risk-neutral about moral value, doesn't your view entail that the far future is decision-irrelevant whenever its effects are symmetric, which is a substantive anti-longtermist conclusion you haven't explicitly owned?
  *Anticipated Reply:* She may accept this and frame it as a feature, arguing longtermism relies on false precision.
  *Note:* Use this concession to highlight the stakes for the Info Value question.

  **5. Continuity (Main)**
  *Setup:* Chaotic amplification implies forecast reliability decays gradually rather than stopping at a principled boundary between near and long-term.
  *Question:* Since the rate of reliability decay is itself something you would have to forecast, doesn't your view generate a hierarchy of higher-order cluelessness about which you owe us a stopping story?
  *Anticipated Reply:* She will likely propose a pragmatic threshold where precision drops below a usable level.
  *Follow-up Plan:* Press on the arbitrariness of that threshold.

  **6. Continuity (Follow-up)**
  *Question:* If the threshold is pragmatic rather than principled, isn't the boundary between the "near-term effects" that decide and the "long-run effects" that cancel fundamentally arbitrary?
  *Anticipated Reply:* She will argue that all decision theory uses pragmatic cutoffs.
  *Note:* Move quickly to the stronger Information Value tension.

  **7. Information Value (Main)**
  *Setup:* You recommend reallocating resources toward forecasting research and institution-building because the expected value of information about long-run effects is high.
  *Question:* If the long-run considerations genuinely cancel out across options, why does information about them have any expected value at all?
  *Anticipated Reply:* She will likely argue that information could break the symmetry, revealing that effects do not cancel.
  *Follow-up Plan:* This is the trap; press on the prior probability of that revelation.

  **8. Information Value (Follow-up) — [Killer Question]**
  *Question:* If your prior is that effects are symmetric, the expected value of information is zero, so why fund the research, and if the EV of information is positive, doesn't that prove your prior symmetry claim was false?
  *Anticipated Reply:* She may struggle to distinguish the EV of the *act* from the EV of the *research* without conceding asymmetry.
  *Note:* This is the point to press hardest; it targets the coherence of parts two and three of her view.

  **9. Level-Shifting (Main)**
  *Setup:* You propose reading consequentialism as a criterion for evaluating decision procedures and institutions rather than individual acts.
  *Question:* If cluelessness is severe enough to make act-level consequentialist evaluation idle, why is rule- or institution-level evaluation not idle for exactly the same reason?
  *Anticipated Reply:* She will argue that institutions aggregate risk and smooth out individual chaotic variances.
  *Follow-up Plan:* Press on whether institutions also have open-ended futures.

  **10. Level-Shifting (Follow-up)**
  *Question:* Since institutions also have open-ended futures subject to chaotic amplification, doesn't the symmetry problem re-emerge at the level of the institution itself?
  *Anticipated Reply:* She may argue institutional effects are more stable than individual acts.
  *Note:* Use this to set up the Collapse worry.

  **11. Collapse (Main)**
  *Setup:* Your recommendation in ordinary cases appears extensionally identical to what a moderately thoughtful non-consequentialist would say.
  *Question:* Given this convergence, what work is the consequentialist criterion still doing in your theory, and what would be lost if you dropped it entirely?
  *Anticipated Reply:* She will likely argue it provides the correct *explanation* for the right actions, even if the output matches common sense.
  *Note:* This sets up the final methodological constraint.

  **12. Falsification (Main)**
  *Setup:* I want to end on the empirical status of your core claim about evidential symmetry.
  *Question:* What finding about the structure of value or causation, independent of our predictive capacity, would count as evidence against the symmetry claim?
  *Anticipated Reply:* She may try to cite better forecasting.
  *Constraint:* If she says "better forecasting," interrupt to note that forecasting capacity is not evidence about the *world's* symmetry, only our access to it; press for a structural condition (e.g., "If we found value was inherently skewed...").
