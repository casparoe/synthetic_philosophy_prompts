answer: |-
  You have put your finger on one of the most persistent and difficult problems in the philosophy of science. You are describing the tension between **Accommodation** and **Prediction**, specifically wrapped up in what is known as the **Problem of Old Evidence**.

  There isn't one single word that captures the whole paradox, but there is a specific vocabulary for the pieces, and a very clear answer to "where the real cut is."

  ### The Vocabulary

  1.  **Accommodation vs. Prediction:**
      *   **Prediction:** The theory is proposed *before* the data is known. (High credit).
      *   **Accommodation:** The theory is proposed *after* the data is known, and fits it. (Usually lower credit).
      *   Your grad student friend is engaging in **Accommodation**. Einstein with Mercury is also technically engaging in **Accommodation** (the anomaly was known since 1859; Einstein published GR in 1915).

  2.  **Ad Hoc Hypothesis:**
      *   This is the pejorative label for your grad student's move. If you tweak a theory *solely* to make it fit a specific known fact, without generating new testable consequences, it is **ad hoc**. In the philosophy of Imre Lakatos, this is a sign of a "degenerating research programme."

  3.  **The Problem of Old Evidence:**
      *   This is the formal name for the puzzle you are sensing. If evidence $E$ is already known (probability = 1), how can a new theory $T$ gain confirmation from entailing $E$? Bayesian confirmation theory struggles with this, because you can't update on something you already believe with certainty. Yet, historically, explaining old evidence (like Mercury) *does* confirm theories.

  ### Where the Real Cut Is

  You asked: *Is it about when the theorist found out about the entailment, about how many other things the theory had to commit to... or something else?*

  The cut is **Rigidity** (or conversely, **Degrees of Freedom**).

  It is not about whether the theorist *knew* the number. It is about whether the theorist could have *changed* the number without breaking the theory.

  **1. The Grad Student (Flexible / High Degrees of Freedom)**
  Your friend likely has a model with tunable parameters. If the correlation was 0.5, they could tweak the weights to hit 0.5. If the correlation was 0.8, they could tweak the weights to hit 0.8.
  *   **The verdict:** The theory is **flexible**. It can accommodate almost any outcome.
  *   **The statistical term:** **Overfitting**. The model is fitting the noise or the specific constraints of the known data rather than capturing the underlying signal.
  *   **Why it gets a discount:** Because the "aiming" involved adjusting the arrow *after* seeing the target. The theory didn't risk being wrong; it was made to be right.

  **2. Einstein and Mercury (Rigid / Low Degrees of Freedom)**
  Einstein knew the perihelion shift was 43 arcseconds per century. He *hoped* General Relativity would match it. But he could not *tune* General Relativity to match it.
  *   **The verdict:** The theory is **rigid**. General Relativity is derived from fundamental principles (equivalence, general covariance). There are no "knobs" to turn to adjust the perihelion of Mercury. The math simply yields a number.
  *   **The risk:** If the math had yielded 40" or 50", the theory would have been falsified immediately. Einstein could not say, "Let me adjust this constant to get 43."
  *   **Why it gets credit:** Even though the data was old, the *derivation* was risky. The theory stuck its neck out.

  ### The Philosophical Frameworks

  If you want to read deeper into this, there are two main frameworks that solve your paradox:

  **1. Use-Novelty (John Worrall)**
  Worrall argues that data counts as evidence only if it was not **used** in the construction of the theory.
  *   **Grad Student:** The data *was* used to construct/tune the model. (No credit).
  *   **Einstein:** The data was known, but it was *not used* to construct the equations of General Relativity. The equations were built on principles of gravity and geometry. The Mercury number fell out as a byproduct. This is sometimes called **Heuristic Novelty** (the data wasn't part of the heuristic construction) vs. **Use Novelty** (the data wasn't used to fix parameters).

  **2. Severe Testing (Deborah Mayo)**
  Mayo argues that evidence confirms a theory only if the theory has passed a **severe test**. A test is severe if it is highly probable that the theory would *fail* the test if the theory were false.
  *   **Grad Student:** A flexible model rarely fails. It can curve to fit the points. The test is not severe.
  *   **Einstein:** A rigid theory easily fails. If the underlying principles were slightly off, the calculation would miss the 43". The test is severe.

  ### Summary

  The move you are noticing is **Accommodation**.
  The negative version is **Ad Hoc Accommodation** (or Overfitting).
  The positive version is **Rigorous Derivation of Old Evidence** (or Passing a Severe Test).

  The "cut" is **Degrees of Freedom**.
  *   If the theorist had to **tune** the theory to hit the fact, it counts against them (Ad Hoc).
  *   If the theory **forced** the fact upon the theorist, with no ability to tune, it counts for them (Rigidity), even if the fact was already known.

  Einstein gets credit not because he predicted a new number, but because he built a machine that could only output one number, and that number happened to be the one written in the textbooks. Your friend built a machine that could output any number, and they set it to the one in the textbooks.
