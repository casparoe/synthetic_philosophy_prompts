answer: |-
  Here is the translation of the four claims into the vocabulary of narrative craft, followed by the residue report and scene analysis.

  **The Translation**

  1.  **Reductionism:** There is no Series Bible. In craft terms, a character is not a pre-existing entity the author discovers, but the sum of the text itself. There is no "true" version of the husband hidden in the author's head or the company's master file; there is only what is written on the page. *Flag:* Craft vocabulary often secretly relies on authorial stipulation—the idea that the writer knows the "real" character even when the text contradicts it. If you assume the Author holds the master key to identity, the philosophical problem evaporates. You must treat the text as the only reality.
  2.  **What Matters:** Recasting over Physical Continuity. When a role is recast between instalments, we accept the character survives if the voice and arc remain consistent, despite the changed body. What matters is the fidelity of the performance, not the continuity of the actor.
  3.  **Fission:** Competing Drafts. If the manuscript splits into two divergent versions where both maintain psychological continuity with the original, neither is the "canonical" successor. Both are valid drafts. Identity fails because canon requires singularity, but narrative value survives in both threads.
  4.  **Degrees:** The Slider of Identification. Survival is not a binary switch (canon vs. non-canon) but a gradient of reader identification. A character can be "more real" or "less real" depending on the strength of the connection to the source material, measured by how readily the audience accepts their claims on the other characters.

  **Residue Report**

  Claim 4 translates cleanly. Craft already accepts that fidelity is a slider; we speak of characters being "true to themselves" or "out of character" without demanding perfection. Claim 3 survives only distorted. Craft vocabulary is hostile to competing drafts; we resolve fission by choosing a Canon or labeling one timeline "Elseworlds." To use craft terms here, you must force the vocabulary to admit two Canons simultaneously, which feels like a bug in the system rather than a feature.

  Claim 1 and 2 have no expression in craft vocabulary. This confirms your first suspicion: craft cannot say anything first-personal. There is no term for what a character anticipates for himself because characters are objects of construction, not subjects of experience. We have terms for how a reader *perceives* a character's fear, but no term for the character's own stake in their continuation. The vocabulary describes the puppet, not the puppet's desire to remain strung up.

  This confirms your second suspicion as well. The continuum craft offers—degrees of fidelity, canonicity, uptake—measures the *audience's* relation to the character, not the character's survival. "Identification" is a metric of reader psychology, not ontological status. When we say a reconstruction is "faithful," we mean it satisfies *us*, not that it preserves the original's existence. The vocabulary measures reception, not persistence.

  **Marianne vs. The Husband**

  You must keep these separate. Craft vocabulary can express what matters to Marianne perfectly: she is the Point of View. Her obligation, grief, and confusion are rendered through narration and interiority. We have terms for her uptake of the reconstruction.

  Craft vocabulary cannot express what matters to the Husband. Because he is the text being analyzed, not the lens analyzing it, his "survival" is purely a matter of external fidelity. If you attempt to give him interiority, you turn him into a Marianne-like POV, creating a new character rather than testing the survival of the old one. The craft tools allow you to show Marianne weighing the reconstruction, but they lack a mechanism to weigh the reconstruction's own claim to existence without turning that claim into just another plot point for Marianne to observe. The vocabulary handles the witness, not the witnessed.

  **The Scene**

  Your instinct is correct: the memory test is a cheat. In the argumentative structure of identity, proving he remembers a private detail establishes *connectedness* (Claim 2), but it does not establish *what matters* (Claim 4). It answers the epistemic question ("How do we know?") rather than the ethical question ("What do we owe?"). A perfect memory proves data transfer, not survival. It treats the husband as a locked box to be opened, rather than a claimant to be heard.

  An honest scene would not test the reconstruction's knowledge, but Marianne's obligation. It must stage a conflict where the reconstruction demands something the original husband would not have demanded, or refuses something he would have granted. The test cannot be "Are you him?" because, under Claim 1 and 3, there is no "him" to be. The test must be "Do I owe you?"

  For example: the serene reconstruction asks for forgiveness regarding the stripped-out affair he cannot remember, while the embittered one demands rights to the estate based on continuity he cannot fully prove. Marianne cannot verify their claims via memory data. She must decide based on whether their current psychological trajectory warrants her care. The scene must force her to adjudicate between two competing drafts of a man neither of whom is the original, using only the currency of her own continued life with them. The memory test looks backward at data; the honest scene looks forward at obligation.

  **Conclusion**

  Your vocabulary is failing you because it is designed to manage consistency for the sake of the reader, not to manage existence for the sake of the character. Craft is a technology of communication, not ontology. When you ask "Is he him?", craft answers "Is he readable?" When you ask "Does he survive?", craft answers "Do we care?"

  This is not a defect of your skill, but of the medium's tools. You are trying to use a map of reader reception to navigate a landscape of metaphysical survival. The map will show you where the audience stands, but it will not tell you where the dead go. To write this honestly, you must stop trying to solve the identity problem with craft terms and start using the craft terms to show the impossibility of solving it. Let the vocabulary strain. Let the "Canon" remain unresolved. Let Marianne's POV be the only place where "truth" exists, acknowledging that this excludes the husband entirely. The failure of the vocabulary to capture his survival is not a bug in your book; it is the subject of your book.
