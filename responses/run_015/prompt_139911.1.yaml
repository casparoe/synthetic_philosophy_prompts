      *   **The Cost:** You admit some truths are necessarily unbelieved. This is fine for realism (truth > belief). It destroys the student's attempt to force the paradox onto the realist.
      *   **Fitch's Status:** Fitch remains a problem for the *Knowability Principle* specifically, because that principle is the one being asserted by the anti-realist. The realist doesn't assert the parallel principle for belief.
