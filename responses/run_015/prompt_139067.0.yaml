answer: |-
  1. If your hybrid view implies that descendants of historical victims cannot claim they were wronged because their existence depends on the injustice, it fails to ground claims for reparations that are widely judged morally essential. This extensional failure regarding past wrongs counts as a fatal defeater because it contradicts settled intuitions about rectification.
  2. By separating impermissibility from wronging, you insulate the view from counterexamples but lose the explanatory link between wrongdoing and specific rights to compensation or apology. A theory that declares an act impermissible yet denies any individual was wronged cannot explain why specific victims rather than the state should receive redress.
  3. The availability-relative threshold view is a genuine rival rather than impersonalism in costume because it retains the person-affecting structure of grievance while solving the non-identity problem without your framework switch. If this unified person-affecting view succeeds, your hybrid is theoretically profligate, employing two moral modules where one suffices.
  4. If counterfactual identity is vague, your switch between person-affecting and impersonal frameworks inherits that vagueness, leaving the deontic status of acts indeterminate in borderline cases. This forces you to accept moral indeterminacy where practical decision-making requires a determinate verdict, which is a structural defect rather than a mere cost.
  5. While you may have priced in the cost of theoretical disunity, the hybrid view remains vulnerable to the charge that it gerrymanders moral principles to match pre-theoretic intuitions rather than deriving them from a foundational value. This is the least decisive objection because it appeals to elegance, but it highlights that your view lacks the unified explanatory power of its competitors.
