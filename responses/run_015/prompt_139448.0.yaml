answer: |-
  This is a classic reconstruction of the "Profligacy of Omissions" argument, pushed to a nihilist conclusion. Dan has essentially weaponized David Lewis's counterfactual account of causation against itself, using the norm-independence constraint (1) as a lever to pry omissions out of the causal relation entirely.

  You are right to be annoyed. The argument is valid, but it is not sound. Specifically, it relies on an equivocation in the word "cause" between premises (1) and (6), and it makes a false empirical claim in (4).

  Here is the breakdown of where to break the chain, how to do it without surrendering norm-independence (1), and what it costs you.

  ### 1. The Diagnosis: Where the Argument Bites
  Dan's argument works by forcing a dilemma: either causation is norm-dependent (violating 1) or it is profligate (violating 6). He concludes that since profligacy is useless, omissions aren't causes (7).

  The error lies in **Premise (4)** ("There's no non-normative difference to sort them by") and the inference to **Conclusion (7)** ("Causation drops out entirely").

  Dan assumes that the *only* way to filter profligate counterfactual dependencies is via moral/legal norms. If you can show there is a **non-normative, metaphysical, or functional difference** between the owner's omission and the Queen's omission, you can keep (1) and reject (4).

  ### 2. Attacking Premise (4): The Non-Normative Difference
  Dan claims the only difference between you and the Queen is normative (ownership, promise, duty). This is false if we adopt a **Systemic** or **Functionalist** view of causal models, rather than a purely Humean counterfactual view.

  **The Move:** Distinguish between *background conditions* and *intervention variables* within a causal model.
  In a causal model of "Plant Survival," the owner is an internal variable; the Queen is an external parameter.
  *   **Why?** Not because of *duty*, but because of **access and stability** (Woodwardian insensitivity).
  *   **The Non-Normative Fact:** In the actual world, the plant's survival is *insensitive* to the Queen's actions (she is in London, security protocols, distance) but *sensitive* to the owner's actions (keys, proximity, routine).
  *   **The Default State:** You can define "default" statistically or functionally without invoking norms. In the "Plant-in-Apartment" system, the functional default is that the owner waters it. This is a biological/sociological fact about how apartment plants persist, not a moral fact. The Queen's watering is a "deviant" intervention in that system.

  **Cost:** You must accept that causal claims are **contrastive** and **model-relative**. "The owner's omission caused the death" is true relative to a model where the owner is an internal variable. "The Queen's omission caused the death" is false relative to that same model, not because of duty, but because she is outside the system's boundary conditions. This preserves (1) because system boundaries are descriptive (where the walls are, who has keys), not normative.

  ### 3. Attacking Conclusion (7) & (8): The Asymmetry of Causation
  Dan's Corollary (8) is the most dangerous part: "No causal difference between holding the head under and standing on the bank." He argues that if omissions are causes, they are causes *in the same sense* as commissions.

  **The Move:** Reject the univocity of "cause."
  Even if you accept omissions as causes, you can maintain a metaphysical asymmetry between **Causal Production** (Commission) and **Causal Dependence** (Omission).
  *   **Commission:** Involves energy transfer, process initiation, or changing the world from a safe state to an unsafe state.
  *   **Omission:** Involves the absence of prevention, allowing a process to run its course.
  *   **The Difference:** This is a non-normative, physical difference. One adds energy to the system; the other fails to subtract it (or fails to add preventative energy).

  **Why this saves (8):** You can say both are causes, but they are *different species* of cause. The law treats them differently *because* of this metaphysical difference, not just because of moral norms. It is harder to intervene on an omission (you have to add a new process) than a commission (you have to stop an existing one). This justifies different legal treatment without making causation normative.

  ### 4. Answering the Legal Objection (The "Statute" Problem)
  Dan's strongest point was your stumble: *" 'Caused the death' in a criminal statute becomes either trivially true... or a disguised moral judgment."*

  **The Rebuttal:** Dan is conflating **Cause-in-Fact** with **Proximate Cause**.
  *   **Metaphysics (Cause-in-Fact):** This is what your seminar is about. It *is* abundant. Yes, metaphysically, the Queen's omission is a cause-in-fact (counterfactually).
  *   **Law (Proximate Cause):** Legal statutes never rely on metaphysical causation alone. They rely on *proximate* causation, which is explicitly designed to filter profligacy.
  *   **The Solution:** You tell Dan: "You are right that metaphysical causation is too broad for the law. That is why the law has the doctrine of Proximate Cause. Proximate Cause *is* the place where norms, policies, and duties do the work. It is not a bug that metaphysics is profligate; it is a feature. It allows the law to start with a broad net (cause-in-fact) and then apply policy filters (proximate cause) to determine liability."

  **Cost:** You have to concede that the word "cause" in a criminal statute is a **term of art** that includes normative filters, whereas the word "cause" in your seminar is a **metaphysical predicate**. They are not the same concept. Dan is demanding that metaphysics do the work of legal policy.

  ### 5. Which Premise to Surrender?
  Do not surrender (1). Norm-dependence in metaphysics is indeed a category mistake.
  Do not surrender (6). Profligacy *is* explanatorily useless for specific inquiries.

  **Surrender (4) and the inference to (7).**
  1.  **Reject (4):** There *is* a non-normative difference (Systemic Role/Access/Stability).
  2.  **Reject (7):** Omissions *are* causes, but they are a distinct metaphysical category from commissions (Dependence vs. Production).
  3.  **Clarify the Legal Point:** Metaphysical causation is abundant; Legal causation is sparse by design (via Proximate Cause).

  ### 6. The Price You Pay
  If you take this line, here is what you must accept in your seminar:
  1.  **Causal Pluralism:** You cannot have a single unified theory of causation that handles both billiard balls and neglected plants identically. You need a hybrid account (Process for commissions, Counterfactual/Interventionist for omissions).
  2.  **Contextualism:** Causal claims are implicitly contrastive and model-relative. "What caused the fire?" always implies "relative to this background of expectations."
  3.  **The Legal Concession:** You must admit to Dan that if a statute says "causes death," it *does* implicitly include normative judgments, but not because causation itself is normative. It's because the statute is shorthand for "Cause-in-Fact AND Proximate Cause." The normativity enters at the *attribution* stage, not the *metaphysical* stage.

  ### Summary for the Next Seminar
  Dan's argument is a *reductio* of the idea that **Metaphysical Causation** should do the work of **Moral/Legal Attribution**.

  Tell him: "You've proven that if we try to make metaphysical causation carry the weight of moral responsibility, it breaks. I agree. But the solution isn't to deny omissions are causes; it's to admit that 'cause' in the law is a composite concept. Metaphysics gives us the broad net (Cause-in-Fact); Norms give us the filter (Proximate Cause). You are trying to build the filter into the net."

  This keeps your (1), saves you from (8), and answers his legal objection without conceding that causation is normative.
