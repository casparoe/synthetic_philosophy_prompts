prompt: |-
  Write a dialogue between Maya, a stratigrapher who wants a formal Anthropocene epoch with a boundary marker around 1950 (radionuclides, plastic, the great acceleration), and Jules, an enviromental historian who thinks thats too recent and that tying the start to the Columbian exchange or early coal use is more honest. They should actually talk to each other, not monologue past each other - Maya needs to respond to Jules's claim that picking a date is always political, and Jules needs to respond to Maya's point about global synchronicity in the rock record. Have them fight over who decides: should the geology commission have sole authority, or should climate scientists and indigenous knowledge councils share the table? Inject a niche twist: Jules argues that a 1950 start lets 19th-century colonial mining and plantation economies off the hook, while Maya counters that stratigraphic boundaries are correlation tools, not moral verdicts, and mixing the two corrupts science. Keep it somewhat in the weeds but dont ask for citations or a reading list. Maybe drop an apostrophe or two.
