answer: |-
  This is a sharp conceptual puzzle. You are asking whether the *legal form* of a constitution can contradict its *political substance* without breaking the theory of popular sovereignty.

  In the Scandinavian model (Sweden, Norway, Denmark), the tension you identify—the "dormant power" problem—is not merely a historical artifact; it creates a specific theoretical friction that fully republican systems do not face. In a republic, the Head of State's powers are usually codified as limited. In a Scandinavian monarchy, the Head of State's powers are often codified as broad but constrained by unwritten convention.

  Here is a conceptual breakdown of the implications for democratic legitimacy and popular sovereignty, structured for your lecture.

  ### 1. The Fiction of the "Reserve Power" and the Locus of Sovereignty
  The core tension lies in the distinction between *constituted power* (the institutions) and *constituent power* (the people).

  In a standard republican theory of popular sovereignty, the people are the constituent power. They delegate authority to representatives, and that delegation is exhaustive. There is no authority left over.

  In the Scandinavian model, the Monarch retains a "reserve" of formal authority (e.g., the theoretical right to refuse assent to legislation or appoint a government against parliamentary advice). Even if this power has not been exercised in a century, its *legal existence* implies that the people's will is not the final word. It suggests that sovereignty is **shared** or **layered**, rather than absolute.

  *   **The Theoretical Risk:** If the Monarch *could* legally veto a law passed by the people's representatives, then popular sovereignty is conditional. It exists only at the pleasure of the Crown. This creates a "sovereignty gap." In a crisis (e.g., a constitutional breakdown), who decides? If the Monarch steps in, they are acting as a sovereign entity distinct from the people.
  *   **The Counter-Argument (Constitutional Convention):** Democratic theorists argue that in these systems, constitutional convention has hardened into law. The "dormancy" is not an accident; it is a normative constraint. Therefore, the power doesn't exist because it *cannot* be legitimately used. The sovereignty remains with the people because the Monarch's agency has been fully reduced to a mechanical function (a "stamp").

  **Lecture Point:** The dormant power challenges the *purity* of popular sovereignty but arguably protects its *stability*. It posits that sovereignty is not a single point of authority but a system of checks where the "final say" is theoretically removed from the political fray to prevent tyranny of the majority.

  ### 2. The Separation of "State" and "Government"
  This is where the Scandinavian model offers a unique conceptual advantage over republics.

  In many republics, the Head of State (President) embodies both the continuity of the State and the political authority of the Government (even in parliamentary republics, the President is often elected politically). This conflates the *eternal* (the nation) with the *temporal* (the administration).

  In Scandinavia, the Monarch embodies the **State** (continuity, unity, identity), while the Parliament embodies the **Government** (policy, will, change).

  *   **Implication for Legitimacy:** This allows popular sovereignty to operate fully in the realm of *policy* without threatening the legitimacy of the *State* itself. You can vote out a government, protest a law, or change the constitution without attacking the "Head" of the nation.
  *   **The "Dormant" Benefit:** The Monarch's unused powers serve as a placeholder for the "neutral power." Because they do not use them, they remain neutral. If they were a President with similar dormant powers, their election would politicize that neutrality.
  *   **Conceptual Tension:** Does this mean popular sovereignty is only valid regarding *administration*, not *identity*? It suggests the "People" are sovereign over laws, but the "Nation" (symbolized by the King) is sovereign over existence. This bifurcates sovereignty in a way republican theory struggles to articulate.

  ### 3. The Japanese Complication: Symbol vs. Organ
  The Japanese case (post-1947 Constitution) complicates this significantly and helps isolate the variable of "dormant power."

  *   **Scandinavia:** The Monarch is an **Organ of the State**. They have functions (signing laws, appointing ministers). The power is real but constrained by convention.
  *   **Japan:** The Emperor is defined explicitly as a **Symbol of the State**. The Constitution states sovereignty resides with the people, and the Emperor has *no* powers related to government. He performs acts in matters of state, but only with the advice and approval of the Cabinet, and these acts do not involve the exercise of personal authority.

  **The Theoretical Shift:**
  Japan removes the "dormant power" problem entirely. There is no legal fiction that the Emperor *could* refuse. The tension shifts from **Legal Authority** to **Ontological Status**.

  *   **The New Tension:** If the Emperor has no power, why does he exist in the constitution? In Japan, the Emperor represents a pre-political unity (ethnic/cultural continuity) that exists *prior* to the popular sovereign.
  *   **Implication:** In Scandinavia, the King is a *political* actor who chooses not to act. In Japan, the Emperor is a *cultural* entity who is legally barred from acting.
  *   **For Popular Sovereignty:** The Japanese model is theoretically "cleaner" regarding popular sovereignty because there is no competing legal authority. However, it introduces a different conflict: Can a democracy be grounded in a "symbol" that implies a source of legitimacy (tradition/bloodline) that is fundamentally undemocratic?
  *   **Comparison:** The Scandinavian "dormant power" is a **legal risk** (what if they use it?). The Japanese "symbolic status" is a **philosophical risk** (does the symbol undermine the idea that the people are the only source of value?).

  ### 4. The "Exception" and the Reality of Power
  To tie this back to democratic theory, consider the Schmittian definition of sovereignty: "Sovereign is he who decides on the exception."

  *   **Republican Model:** In a crisis, the Constitution dictates who decides (e.g., emergency powers for the President/Parliament). It is codified.
  *   **Scandinavian Model:** If a true constitutional crisis occurred (e.g., a Parliament trying to abolish democracy), the Monarch's "dormant power" suddenly wakes up. Theoretically, they could refuse to sign the suicide pact of democracy.
  *   **The Implication:** This suggests that in constitutional monarchies, the ultimate guardian of the constitution is not the people or the courts, but the Monarch. This is a **paternalistic** view of sovereignty. It implies the people are sovereign only so long as they act "correctly."

  **Does this undermine popular sovereignty?**
  *   **Yes:** If the ultimate veto lies outside the electoral chain, the people are not fully sovereign.
  *   **No:** If the "veto" is so culturally impossible that it is effectively erased, then the sovereignty is fully with the people, and the Monarch is merely a ceremonial witness to that sovereignty.

  ### Summary for the Lecture
  The "dormant power" in Scandinavia is not just harmless residue; it is a **constitutional ambiguity** that serves a functional role.

  1.  **It creates a "Dual Sovereignty":** The People hold *political* sovereignty (policy/government), while the Crown holds *structural* sovereignty (continuity/order).
  2.  **It differs from Japan:** Scandinavia retains a *legal* fiction of power (which creates a theoretical veto risk); Japan retains a *cultural* fiction of status (which creates a theoretical legitimacy competition).
  3.  **The Verdict:** It does not necessarily *undermine* popular sovereignty, but it redefines it. It moves away from the Jacobin/Rousseauian idea of the "General Will" being absolute and unchecked, toward a Liberal/Whig idea of sovereignty being dispersed and checked even by symbolic institutions.

  The tension is real, but it is the price paid for a system that values **stability of the state** over the **purity of democratic theory**. In a republic, the People are the State. In Scandinavia, the People rule the State, but the King *is* the State. That distinction is the conceptual knot.
