answer: |-
  You are right to be suspicious. Your TA is making a category error that is extremely common in policy economics: she is treating "utility" as a mysterious mental substance that is unmeasurable, while treating "dollars" as an objective physical metric that is measurable. But in welfare economics, **Willingness-To-Pay (WTP) is just a proxy for utility.** If you cannot compare utils, you cannot compare WTP either, unless you assume everyone values a dollar equally (which health policy explicitly denies when discussing equity).

  She is using the "no interpersonal comparison" line as a shield to avoid normative debates about distribution, while simultaneously wielding a metric (dollars) that embeds a specific normative assumption (that the marginal utility of income is comparable or irrelevant).

  Here is the menu of precise claims hidden behind that sentence, analyzed for consistency with her argument.

  ### The Menu of Readings

  | Reading | What it Asserts (Ontology/Epistemology) | Status | Does it get her to CBA/WTP? | Does it block Prioritarianism? | Extra Premises Needed | Self-Defeating? |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Technical/Ordinalist** | Utility is defined only up to positive affine transformation. No common zero, no common unit. Choice data reveals order, not intensity. | **True** (for standard choice theory). Trivial mathematically, but substantive for measurement. | **No.** WTP assumes cardinality. To use WTP as a sum, you need a common unit (marginal utility of income). | **Yes.** You can't identify the "worst off" without level comparability. | Must assume **Money is a valid cardinal proxy** for utility across persons (ignoring diminishing marginal utility of income). | **Yes.** If utils aren't cardinal/comparable, summing WTP is summing incomparable numbers. |
  | **2. The Epistemic Skeptic** | Facts about relative welfare *exist*, but we cannot *know* them. Utility is real but hidden. | **Substantive & Defensible.** Plausible view on privacy of mental states. | **Yes (Provisionally).** Argues money is the *best available observable proxy*, even if imperfect. | **Yes.** We can't identify the worst off reliably enough to prioritize them. | Must assume **Money is a less biased proxy** than clinical assessment or self-report. | **No.** Consistent, but admits CBA is a "second best" workaround, not a theoretical solution. |
  | **3. The Ontological Nihilist** | There is **no fact of the matter**. "Person A is happier than Person B" is meaningless nonsense, like "blue is heavier than loud." | **Radical.** Controversial in philosophy; rarely held by economists in practice. | **No.** Kaldor-Hicks requires summing gains and losses. If comparisons are meaningless, the sum is meaningless. | **Yes.** Prioritizing the "worst off" is metaphysically incoherent. | Must argue **Money comparisons are different in kind** (not welfare comparisons). | **Yes.** Kills CBA dead. If welfare comparisons are impossible, potential compensation tests are also impossible. |
  | **4. The Zero-One Problem** | We might compare **gains** (units) but not **levels** (zeros). Or vice versa. | **Nuanced.** Distinction between *unit comparability* and *level comparability*. | **Maybe.** CBA measures changes (gains). If units are comparable, CBA works. | **Yes.** Prioritarianism requires level comparability (who is at the bottom?). | Must assert **Units are comparable, Levels are not.** | **No.** Consistent if she only claims levels are incomparable. But she implies *all* comparison is off. |
  | **5. The Moral Complaint** | It's not that we *can't* compare, it's that we *shouldn't*. Aggregating across persons violates the "separateness of persons." | **Normative.** (Rawlsian/Nozickian). Not a claim about measurement. | **No.** CBA aggregates willingness to pay. If aggregation is immoral, CBA is immoral. | **Yes.** Explicitly blocks trading off the worst-off for the greater good. | Must argue **Market transactions respect separateness** (highly debatable). | **Yes.** CBA is aggregative. If aggregation is the sin, CBA commits it. |
  | **6. Rough Comparability** | Comparisons are possible but noisy. Valid only when gaps are large (e.g., death vs. mild headache). | **Pragmatic.** Defensible in clinical contexts. | **Yes.** Treats dollars as a rough-and-ready heuristic for large trade-offs. | **Yes.** Suggests we can't fine-tune priority to the worst off precisely. | Must accept **Approximation is sufficient for policy.** | **No.** Consistent, but undermines her claim that we "can't" compare. We just can't compare *precisely*. |

  ### Addressing Your Specific Points

  #### 1. The "Bridge Person" Calibration
  *Your attempt:* Find a clinician (or person) who has experienced both State A (severe) and State B (mild), or both Poverty and Wealth, and use them to calibrate the scales.
  *Does it help?* **It relocates the problem; it does not solve it.**
  *   **Why:** This solves the *intrapersonal* comparison for the bridge person. They know how much worse A was than B *for them*.
  *   **The Gap:** To make this *interpersonal*, you must assume the bridge person's experience is **representative** of everyone else. You are assuming that the "unit" of suffering for the bridge person is the same as the "unit" of suffering for the patient.
  *   **Which Reading does this hit?** It attacks the **Ontological Nihilist** (proving facts exist) and the **Epistemic Skeptic** (proving we can know them).
  *   **The TA's Counter:** She would say this relies on an assumption of **homogeneity of experience**. If the bridge person has a high pain tolerance or different values, their calibration is biased. It turns the problem from "impossible" to "empirically difficult," which might be enough for her to stick with dollars as the "easier" metric.

  #### 2. Levels vs. Gains (Zeros vs. Units)
  *Does it matter?* **Yes, this is the critical technical distinction.**
  *   **Prioritarianism (Prioritizing the worst off):** Requires **Level Comparability**. You need to know where everyone sits on the scale (the "Zero" point). If you can't fix the zero for each person, you don't know who is worst off.
  *   **Utilitarianism / CBA:** Requires **Unit Comparability**. You need to know if a gain for Person A is "bigger" than a loss for Person B. You don't necessarily need to know their absolute baseline, just the size of the change.
  *   **The TA's Inconsistency:**
      *   If she claims **No IUC at all**: She kills Prioritarianism, Utilitarianism, *and* CBA.
      *   If she claims **No Level Comparability (Zeros)**: She kills Prioritarianism, but *allows* Utilitarianism and CBA.
      *   **The Trap:** She is likely using the "No IUC" slogan to kill Prioritarianism (Level), but then implicitly assuming Unit Comparability when she sums dollars in CBA.
      *   **Verdict:** If you grant her that we can't compare levels (zeros), you save CBA but lose Prioritarianism. But you still have to defend why dollars measure units comparably (i.e., why a poor person's $100 WTP isn't "more utility" than a rich person's $100 WTP).

  #### 3. The Self-Defeating Nature of Her Argument
  You flagged this correctly. The **Ontological Nihilist** and **Moral Complaint** readings are self-defeating for her purpose.
  *   **Kaldor-Hicks is an Interpersonal Comparison:** The Kaldor-Hicks criterion says Policy X is good if the winners *could* compensate the losers. To know if they *could*, you have to measure the gain to winners and the loss to losers in a common metric.
  *   **The "Dollars are Real" Dodge:** Her only escape is to argue that dollars are **observable behavior** whereas utils are **mental states**.
      *   *Counter-argument:* WTP is not a measure of welfare; it is a measure of **welfare weighted by ability to pay**. Using WTP *is* making an interpersonal comparison; it is just making the comparison that "a dollar of utility for a rich person counts the same as a dollar of utility for a poor person." That is a massive, unargued normative assumption.
  *   **Conclusion:** Her argument is self-defeating unless she adopts the **Epistemic Skeptic** reading ("Welfare comparisons exist but are hard, so we use money as a rough proxy"). But if she admits that, she admits CBA is flawed and biased, which undermines her certainty that we *should* use it over welfare ranking.

  ### Summary for Your Class
  If you want to push back without looking like you're ignoring economic theory:

  1.  **Pin her on Units vs. Levels:** Ask, "Are you saying we can't compare *levels* of welfare (blocking prioritarianism), or that we can't compare *changes* in welfare (blocking CBA)?"
  2.  **Point out the WTP Assumption:** Ask, "If we can't compare utils across people, on what basis do we sum WTP? Doesn't summing WTP assume the marginal utility of a dollar is comparable across persons?"
  3.  **The Bridge Person:** Argue that while a bridge person doesn't solve the *zero* problem perfectly, it provides enough **Unit Comparability** to make welfare ranking more defensible than CBA, which systematically biases against the poor.

  Your TA is using a technical limitation (measurement of utility) to sneak in a normative conclusion (ignore distribution). The sentence "you can't compare utils" is doing zero work as a factual claim and three jobs as a conversation-stopper.
