  **AetherStream Separations plc**
  **Notes to the Annual Informational Emissions Disclosure**
  **For the Fiscal Year Ended 30 November 2023**

  **1. Basis of Preparation**
  1.1 The Company operates autonomous molecular sorting engines designed to discriminate fast-moving particles from slow-moving particles within a gaseous medium. Each discrimination event generates one bit of informational content within the engine's control unit. In accordance with standard thermodynamic practice, control units must periodically clear accumulated information to maintain operational continuity. The Company recognizes an energetic liability for each bit cleared, calculated at the Landauer limit ($kT \ln 2$). At standard operating temperature (300 K), this cost is assessed at approximately $2.9 \times 10^{-21}$ joules per bit.

  **2. Operational Efficiencies and Jurisdictional Arbitrage**
  2.1 During the reporting period, the Company relocated all memory-clearing operations to facilities situated in colder climatic jurisdictions. As the energetic cost of erasure scales linearly with temperature, clearing operations conducted at 250 K incur a cost roughly 17 per cent lower than those conducted at 300 K. 
  2.2 While the absolute energy saving per mole of bits processed is modest (approximately 0.3 kilojoules against a baseline of 1.7 kilojoules), the Company classifies this percentage reduction as a material improvement in operational efficiency. This strategic relocation demonstrates the Company's commitment to minimizing direct thermal dissipation wherever commercially viable.

  **3. Scope of Informational Emissions**
  3.1 This disclosure distinguishes between Class A dissipation (heat generated directly by Company sorting engines) and Class B dissipation (heat generated by subsidiaries and third-party suppliers involved in the information lifecycle). 
  3.2 In line with industry standards for informational accounting, only Class A dissipation is reported as the Company's direct liability. Dissipation exported to cold-climate subsidiaries or upstream suppliers is recorded separately and does not impact the Company's primary efficiency targets. This boundary ensures that the Company's reported footprint reflects only the operations over which it exercises direct managerial control.

  **4. Memory Management and Procurement**
  4.1 To further reduce direct erasure costs, the Company's demons no longer clear memory internally. Measurement and copying of informational bits can in principle be performed reversibly; accordingly, each new bit is written to fresh tape rather than overwriting existing storage. 
  4.2 This fresh tape is purchased at cost from AetherStream Media Ltd, a wholly-owned subsidiary. The subsidiary supplies media in a standardized low-entropy state, derived from raw stock maintained in a maximally uncertain state. The Company treats the procurement of this initialized media as an operational expense rather than an erasure event. This allows the Company to maintain reversible operations within its own boundary while relying on the subsidiary to manage the entropy reduction required to produce blank tape.

  **5. Auditor's Qualification**
  5.1 The Company's auditors note that erasure is not an event an outsider can independently verify. A genuine reset is not distinguishable, on the thermodynamic record, from a reversible transfer of the bit into some degree of freedom that has not been listed in the inventory. 
  5.2 Consequently, all dissipation figures regarding memory management are self-reported. The auditors express no opinion on whether unlisted degrees of freedom within the Company's sorting engines may be accumulating entropy indefinitely, provided such accumulation remains off the balance sheet.

  **6. Legal Disclaimer**
  6.1 Outside counsel observes that commentators remain divided on whether the Second Law of Thermodynamics requires rescuing by this kind of information bookkeeping at all, or whether the bookkeeping merely restates the prohibition it is invoked to explain. 
  6.2 AetherStream Separations plc takes no position on this matter. The Company asserts that regardless of the theoretical status of the Law, the accounting identities employed herein always balance.
