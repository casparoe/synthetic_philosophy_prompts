answer: |-
  Here is a teaching plan designed to handle the specific pedagogical traps you've identified. It prioritizes structural clarity over persuasive force, aiming to get the sceptics to engage with the *math* before they reject the *subject*.

  ### The Core Strategy: "The Equation First, The Bugs Second"

  Your supervisor is right about the hook, but you are right about the denominator. The compromise is to establish the **Expected Value (EV) framework** using a neutral, non-insect example first. This locks in the "currency" (the denominator) before you introduce the controversial variables.

  **Whiteboard Setup:** Divide the board into three vertical columns.
  1.  **The Formula** (Left)
  2.  **The Variables** (Center)
  3.  **The Trap** (Right)

  ---

  ### Part 1: The Structure (0–20 mins)
  **Goal:** Lock in the aggregation unit and the EV structure without triggering the "bugs are a joke" reflex.

  1.  **The Hook (Supervisor's advice, modified):**
      *   Do not mention insects yet.
      *   Write on the board: *Action A helps 1 person a lot. Action B helps 1,000,000 people a tiny bit.*
      *   Ask: "Under what formal conditions does the number of individuals ($N$) drop out of the moral calculation entirely?"
      *   Let the EA students shout "Never!" and the sceptics say "When the benefit is zero."
      *   **Crucial Move:** Force them to define the *unit*. Is it "total happiness" or "average happiness"?
      *   **Write the Formula:** $EV = N \times P(\text{Effect}) \times \text{Value per Individual}$.
      *   **The Denominator Fix:** Explicitly state: "For this seminar, the unit is **weighted welfare moments**. We are not aggregating 'lives' or 'species.' We are aggregating moments of experience weighted by capacity. Circle this on the board. Do not let them shift this later."

  2.  **Why this order?**
      *   If you start with insects, sceptics reject the $P(\text{Sentience})$ variable immediately and never engage with the $N$ variable.
      *   By starting with the structure, you force the sceptics to accept the *math* before they know it will be used to defend insects.
      *   **What breaks if you skip this:** If you don't lock the unit now, halfway through someone will say, "But an ant second isn't a human second," and you'll be stuck recalculating the denominator while losing the thread of the scale argument.

  ### Part 2: The Variables & The Split (20–45 mins)
  **Goal:** Separate Credence in Sentience from Credence in Intensity.

  1.  **Plug in the Insects:**
      *   Now replace "Individual" with "Insect."
      *   Break down $\text{Value per Individual}$ into two distinct variables on the board:
          1.  $P(S)$: Probability the entity is sentient (has experience).
          2.  $E[W|S]$: Expected welfare intensity *given* sentience.
      *   **Visual:** Draw two sliders. One for "Is there a light on?" ($P(S)$), one for "How bright is the light?" ($E[W|S]$).

  2.  **Addressing the Collapse:**
      *   Students will naturally collapse these into "How much do they matter?"
      *   **Intervention:** Ask the EA students: "If you are 10% sure they are sentient, but their pain is 1/100th of a human's, does the scale argument still hold?"
      *   Ask the Sceptics: "If you are sure they feel *something* ($P=1$), but you think it's very faint, does the number ($N$) still overwhelm you?"
      *   **Why:** This prevents the "0.1% means ignore it" misconception. 0.1% of a trillion is still a huge number. By separating the variables, you show that low credence in one can be compensated by magnitude in the other ($N$ or Intensity).

  ### Part 3: The Correlation Trap (45–65 mins)
  **Goal:** Dismantle the "Law of Large Numbers" intuition. This is your key philosophical contribution.

  1.  **The Intuition:**
      *   Students think: "If there's a 1% chance an ant feels pain, and there are a billion ants, the uncertainty averages out." They treat it like independent coin flips.
      *   **The Correction:** Draw the "Species Switch" on the Right Column of the board.
      *   **Hypothesis A:** The *species* is sentient (All ants feel).
      *   **Hypothesis B:** The *species* is not sentient (No ants feel).
      *   Explain: "Our uncertainty is about the *Hypothesis*, not the *Individual*."
      *   **Analogy:** "If I'm unsure if this coin is double-headed, flipping it 1,000 times doesn't reduce my uncertainty about the coin's nature."

  2.  **Why this matters:**
      *   If uncertainty were independent, $N$ would reduce risk.
      *   Because uncertainty is correlated (phylogenetic), $N$ *increases* the stakes of the uncertainty without reducing the uncertainty itself.
      *   **What breaks if you skip this:** The sceptics will rely on "we don't know enough" as a reason for inaction. You need to show that "we don't know" combined with "huge N" equals "huge expected risk," not "neutral inaction."

  ### Part 4: The Example & Misconception Preemption (65–80 mins)
  **Goal:** Apply the math to a concrete case without trivializing it.

  1.  **The Example Choice: The Ant Nest (with a Policy Frame).**
      *   **Why not Aphicide:** It drags in food prices and supply chains, which distracts from the moral math.
      *   **Why Ant Nest:** Students can visualize *one* ant. You need them to visualize one to understand the unit.
      *   **The Frame:** Do not frame it as "Don't pour boiling water." Frame it as: *"A housing development plans to fumigate 10,000 colonies. A benign alternative costs 5% more. Is the cost justified?"*
      *   This keeps the numbers concrete but makes the intervention structural/policy-based, avoiding the "individual accident" dismissal.

  2.  **Misconception Management (Weave these in, don't save for Q&A):**
      *   **Nociception vs. Pain:** Address this in **Part 2 (Variables)**. When defining $P(S)$, state: "We are not talking about reflexes. We are talking about negative valence. If you think they only have reflexes, set $P(S)$ to 0. But if $P(S) > 0$, the math proceeds."
      *   **Tiny Brain/Shallow Pain:** Address this in **Part 2 (Intensity)**. "You might think $E[W|S]$ is low because of brain size. Fine. Put a low number in. But remember $N$ is $10^{18}$. Does your low number cancel *that*?"
      *   **"0.1% means ignore":** Address in **Part 3 (Correlation)**. "0.1% of a trillion is a million. We don't ignore million-person genocides because we were only 0.1% sure they were happening."
      *   **"So stop eating X":** Address in **Part 5 (Scope)**. (See below).
      *   **Polarization (All or Nothing):** Address in **Part 1**. Remind them this is Expected Value, not certainty. We act on expectations, not proofs.

  ### Part 5: Scope & Boundaries (80–85 mins)
  **Goal:** Prevent the seminar from dissolving into practical lifestyle policing or neuroscience debates.

  1.  **What to Explicitly Exclude:**
      *   **Neuroscience:** "We are not solving the Hard Problem today. We are taking *credences* as inputs. Whether it's integrated information theory or global workspace theory is a black box for this argument."
      *   **Replacement Arguments:** "We are not discussing whether preventing a death allows another insect to be born (population ethics). We are treating the current population as fixed for the sake of this calculation."
      *   **Dietary Obligations:** "This seminar is about the *structure of the argument*, not your lunch. Whether this implies vegetarianism depends on other variables (substitutability, nutrition) we are not modelling."

  2.  **How to say it:**
      *   "If we open the black box of neuroscience, we leave philosophy and enter the lab. If we open the black box of market substitution, we leave ethics and enter economics. We are staying in the ethics."

  ### Part 6: The Diagnostic Question (85–90 mins)
  **Goal:** Test structural understanding, not conclusion.

  **The Question:**
  > "Imagine we discover that insect sentience is **independent per individual** (like random coin flips) rather than **correlated per species**. Does the Scale Argument become *stronger* or *weaker*, and why?"

  **Why this works:**
  *   **Correct Answer:** It becomes *weaker* (or rather, the risk profile changes). If it's independent, the Law of Large Numbers applies. The *proportion* of suffering becomes stable and predictable, but the *total expected suffering* might actually be lower if the probability is low, because you aren't risking the "All Sentient" hypothesis on a massive scale. More importantly, it tests if they understood the **Correlation Trap** in Part 3.
  *   **Alternative Correct Answer:** Some might argue it becomes *stronger* because we no longer have to worry about the "0 vs 1" hypothesis risk, we just calculate the straight EV. (Accept this if they justify it via the EV formula).
  *   **Wrong Answer:** "It doesn't change anything." (Shows they missed the correlation point).
  *   **Wrong Answer:** "Insects definitely matter now." (Shows they are focused on conclusion, not structure).

  **Instruction to Class:** "Don't tell me what you think about insects. Tell me how changing the *statistical relationship* between individuals changes the *calculation* we built on the board."

  ---

  ### Summary of "What Breaks" if Sequence is Wrong

  1.  **If you start with Insects:** Sceptics disengage at minute 5. You lose the room.
  2.  **If you don't lock the Denominator (Part 1):** In Part 4, someone will say "But an ant life is shorter," and you'll be stuck debating seconds vs. years instead of $N \times P \times W$.
  3.  **If you don't Separate $P(S)$ and $W$ (Part 2):** Students will conflate "unlikely to be sentient" with "doesn't feel much." You won't be able to show how high $N$ compensates for low $P$.
  4.  **If you don't do Correlation (Part 3) before the Example:** They will treat the Ant Nest example as "a trillion small risks" rather than "one big risk multiplied by a trillion." The Scale Argument loses its force.
  5.  **If you use the Aphicide Example:** You spend 20 minutes on food prices. The moral math gets drowned by empirical noise.

  ### Final Tip for the Room Split
  *   **For the EA students:** Challenge them on the *Intensity* variable. "You assume $N$ does all the work. What if $E[W|S]$ is vanishingly small? Does your argument survive?"
  *   **For the Sceptics:** Challenge them on the *Probability* variable. "You assume $P(S)$ is zero. What if it's 0.01? Does your 'ignore it' heuristic survive the multiplication?"
  *   **Your Role:** You are the actuary, not the advocate. You are checking the math, not selling the cause. This neutrality keeps the sceptics in the room.
