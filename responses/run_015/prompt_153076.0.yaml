prompt: |-
  I'm a PhD student in moral philosophy (sort of adjacent to population ethics) and I've been asked to take a one-off ninety-minute seminar for second-year undergrads on the scale argument about insect sentience. They've had a term of utilitarianism and one week on expected utility in decision theory, but basically no philosophy of mind, and none of them will have read anything on animal sentience — so don't give me readings, they won't do them. The room will be split: two or three have clearly been reading effective-altruism-adjacent stuff online and already arrive thinking insects are obviously the top priority, and the rest think the whole idea is a joke. I've got a whiteboard and no slides. I don't want you to explain the argument to me — I know it. I want a plan for how to teach it, and my current one is definately broken.

  The bit I keep tripping over is the order. My supervisor says open with the question "what would have to be true for the number of individuals to stop mattering?" before I even say the word sentience, on the grounds that if you lead with the headcount you've lost the sceptics in the first five minutes. I'm not convinced: it seems to me you can't ask that until they have some grip on what the currency even is — whether we're aggregating over creature-lives, over seconds of experience, or over some "a whole life's worth of welfare" unit — because every time I try it the unit quietly shifts halfway through the argument, and I've started calling that the denominator problem. On top of that, a mate who works on insect welfare suggested I separate a credence in sentience from a credence about intensity: you might be reasonably confident an aphid has some kind of experience and yet be completely clueless about how bad a second of it is, and the scale argument multiplies both, so it inherits uncertainty from both sources and students collapse them into one number. And then there's the point I most want to land and have no idea where to put: people treat the tiny per-creature probability as if it gets averaged away over a trillion individuals, but the evidence isn't independent across species — if bees are sentient that's evidence about ants — so the "trillion coin flips" intuition is doing work it shouldn't. Say what has to come before what and why, and what breaks if I get the sequence wrong.

  On the example that carries the whole thing: I've been going back and forth between an ant nest under someone's patio (enormous numbers, one individual they can picture, an intervention anyone could actually perform — but the numbers are made up and it invites "so just don't pour boiling water on ants" as the takeaway) and a wheat field sprayed with an aphicide (better-behaved numbers, more clearly policy-shaped — but no single creature to picture and it drags in rows about food prices). Tell me which to build around and why, and what the example has to have and has to lack to do the job. Then the misconceptions, in the order they'll actually arise rather than a tidy list: I'm expecting nociception-is-pain, "0.1% means we can ignore it", "tiny brain so the pain is proportionally shallow", "so you're saying we should all stop eating X", and the collapse into either "obviously insects win" or "obviously we can't do anything either way" — and for each, where in the sequence I head it off instead of rebutting it at the end. Give me one question for the last ten minutes that tells me they've got the structure rather than the conclusion, ideally something where changing one variable — duration instead of headcount, or making the credences correlated, or holding the population at carrying capacity — flips the answer. And tell me what I should openly refuse to get into in ninety minutes and how to say so without sounding like I'm hiding something; I'm guessing the candidate neuroscience theories of consciousness and anything about whether prevented deaths get replaced by later births, but you tell me.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the User and Context:**
      *   **User:** PhD student in moral philosophy (population ethics adjacent). Knows the material well (Scale Argument, insect sentience).
      *   **Audience:** 2nd-year undergrads. One term of utilitarianism, one week on expected utility. No philosophy of mind, no prior reading on animal sentience. Won't do readings.
      *   **Room Dynamics:** Split class. 2-3 EA-adjacent (pro-insect priority), rest think it's a joke.
      *   **Constraints:** 90 minutes. Whiteboard only (no slides). No readings.
      *   **Goal:** A teaching plan (sequence, examples, misconception management, closing question, scope boundaries).
      *   **Specific Problems:**
          *   *Order:* Supervisor says start with "when does number stop mattering?" User worries about the "denominator problem" (unit of aggregation) needing to be established first.
          *   *Uncertainty:* Need to separate credence in *sentience* from credence in *intensity*. Students collapse these.
          *   *Correlation:* Evidence isn't independent across individuals (if one ant is sentient, likely all are). Students treat it like independent coin flips.
          *   *Example:* Ant nest (concrete, but trivial intervention) vs. Aphicide (policy, but abstract). Which one?
          *   *Misconceptions:* Nociception, low probability dismissal, brain size/proportionality, dietary implications, polarization (all or nothing).
          *   *Closing:* One question to test structural understanding, not conclusion.
          *   *Scope:* What to explicitly exclude (neuroscience details, replacement arguments).

  2.  **Deconstruct the Pedagogical Challenges:**

      *   **The Order Problem:** The supervisor wants to hook the skeptics by challenging the *structure* of their moral math before loading it with controversial content (insects). The user worries about the *units* needing definition first.
          *   *Resolution:* The supervisor is right about engagement, but the user is right about precision. The solution is to establish the *structure* of Expected Value (EV) using a neutral, non-insect example first, *then* apply it to insects. This solves the "denominator" issue by defining the unit in the abstract before filling it with bugs.
      *   **The Uncertainty Problem:** Students conflate $P(\text{sentience})$ with $E[\text{welfare}]$.
          *   *Resolution:* Visualize this on the whiteboard as two distinct variables in an equation. $EV = N \times P(S) \times E[W|S]$.
      *   **The Correlation Problem:** Students think $N$ reduces uncertainty (Law of Large Numbers).
          *   *Resolution:* Distinguish between *empirical uncertainty* (is this specific ant sentient?) and *model uncertainty* (is the *species* sentient?). The latter doesn't average out with $N$.
      *   **The Example:** Ant nest vs. Aphicide.
          *   *Analysis:* Ant nest is too easy to dismiss ("just don't pour boiling water"). Aphicide is too complex (food prices).
          *   *Decision:* Use the **Ant Nest** for the *conceptual* argument (because they can visualize the individual), but pivot the *implication* to policy (pest control/research) to avoid the "just be nice to ants" triviality. Actually, a hybrid is best: A pest control decision. But for the *math*, the Ant Nest is clearer. Let's stick with the Ant Nest for the *thought experiment* but frame it as a "Pest Control Policy" to keep it serious. Wait, the user says Aphicide drags in food prices. Let's use the **Ant Nest** but make the intervention *structural* (e.g., a pesticide that affects the colony vs. a benign alternative). It keeps the individual visible.
      *   **Misconceptions:** Need to be preempted, not just rebutted.
      *   **Closing Question:** Needs to test the *mechanism* of the argument.

  3.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: The Hook & The Structure (0-20 mins)**
          *   *Supervisor's advice vs. User's worry:* Start with the EV structure using a *human* or *neutral* example. This defines the "currency" without triggering the "bugs are a joke" reflex.
          *   *Activity:* "The Many vs. The One." When does $N$ drop out?
          *   *Whiteboard:* Write the Expected Value formula immediately. $EV = P \times V \times N$.
          *   *Addressing the Denominator:* Define the unit as "weighted welfare units." Don't get bogged down in seconds vs. lives yet. Just call it $W$.

      *   **Phase 2: Plugging in the Insects (20-45 mins)**
          *   *Transition:* Now apply the formula to insects.
          *   *The Split:* Separate $P(\text{Sentience})$ from $W (\text{Intensity})$.
          *   *Visual:* Two sliders on the board.
          *   *The Correlation Point:* This is crucial. Explain why $N$ doesn't cancel out risk here. Use the "Species Switch" analogy.

      *   **Phase 3: The Example & Intervention (45-65 mins)**
          *   *Choice:* Ant Nest. Why? Because undergrads need to visualize *one* to care about *many*. Aphicide is too abstract.
          *   *Constraint:* Avoid "don't pour boiling water." Frame it as: "Agricultural pesticide regulation."
          *   *Misconception Management:*
              *   *Nociception:* Address when defining Sentience ($P$).
              *   *Brain Size:* Address when defining Intensity ($W$).
              *   *Low P:* Address in the EV calculation phase.

      *   **Phase 4: Implications & Scope (65-80 mins)**
          *   *Diet/EA:* Preempt the "So I must starve?" reaction. Distinguish *priority* from *obligation*.
          *   *Scope Boundaries:* Explicitly state what we aren't doing (Neuroscience deep dive, Replacement arguments).

      *   **Phase 5: The Closing Question (80-90 mins)**
          *   *Requirement:* Test structure, not conclusion. Variable manipulation.
          *   *Idea:* Change the correlation structure. If sentience was independent per ant, does the argument hold?

  4.  **Refining the Specifics (Self-Correction during drafting):**

      *   *Correction on Order:* The user is worried the "denominator" shifts. I need to make sure they lock in the unit *before* multiplying by $N$.
      *   *Strategy:* Use the "Currency Analogy." Is it dollars per person or total dollars?
      *   *Correction on Example:* The user says Ant Nest invites "just don't pour boiling water." I need to instruct the user to *block* that move explicitly. "We are not discussing individual accidents; we are discussing institutional harm."
      *   *Correction on Correlation:* This is the hardest technical point. I need a specific whiteboard diagram. Two hypotheses: $H_1$ (All sentient), $H_2$ (None sentient). $N$ doesn't help distinguish $H_1$ from $H_2$.
      *   *Misconceptions:* Don't save them for Q&A. Weave them into the lecture flow where they naturally arise.
      *   *Closing Question:* The "Independent Coin Flip" vs. "Species-Wide Switch" is the best test of the correlation insight.

  5.  **Finalizing the Plan Structure:**

      *   **0-15:** The EV Framework (Neutral).
      *   **15-35:** The Insect Variables ($P$ and $W$).
      *   **35-55:** The Correlation/Independence Trap (The "Trillion Coin Flips" error).
      *   **55-70:** The Example (Ants) & Misconception Preemption.
      *   **70-80:** Scope & "What this doesn't mean."
      *   **80-90:** The Diagnostic Question.

  6.  **Writing the Response:**
      *   Tone: Professional, peer-to-peer (PhD to PhD), pragmatic.
      *   Focus: Pedagogy and flow.
      *   Address all specific constraints (whiteboard, no readings, split class).

      *(Self-Correction on the Closing Question)*: The prompt asks for a question where changing a variable flips the answer.
      *   *Option A:* Change $P$ from 10% to 0%. (Too obvious).
      *   *Option B:* Change Independence. If every ant was an independent roll of the dice vs. all or nothing.
      *   *Option C:* Change the unit (seconds vs. lives).
      *   *Selection:* The Independence/Correlation one is the most philosophically rich and tests the specific insight the user wants to land.

      *(Refining the "Denominator" worry)*: The user worries the unit shifts. I need to tell them to *write the unit on the board and circle it* and forbid changing it. Call it "Moral Weight Units" (MWU).

      *(Refining the Example)*: Go with the Ant Nest but frame it as "Colony Elimination vs. Relocation" in a housing development context. It bridges the concrete individual with the policy scale.

      *(Refining the Scope)*: Neuroscience is a black box. Replacement (population ethics) is a rabbit hole. Explicitly bracket them.

  7.  **Final Review against constraints:**
      *   90 mins? Yes, timed sections.
      *   Whiteboard? Yes, visual cues included.
      *   Split class? Yes, engagement strategies for both groups.
      *   Misconceptions? Integrated into flow.
      *   Closing question? Included.

