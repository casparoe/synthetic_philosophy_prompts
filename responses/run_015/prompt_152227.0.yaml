answer: |-
  hey there it is great to hear you are digging into gould and lewontin because that spandrels paper is honestly one of the most important critiques in the history of evolutionary biology and it maps surprisingly well onto the encode controversy you mentioned. when the encode consortium released their big paper in 2012 claiming that eighty percent of the human genome was functional based on biochemical activity it sent shockwaves through the community mostly because it seemed to directly contradict the established view that most of our dna is junk. to understand this through the lens of the spandrels critique you have to look at who was fighting and what they were actually arguing about because it was not just a dispute over data but a clash over how we define purpose in biology. the main players on the encode side were leaders like ewan birney and john stamatoyannopoulos who were focused on cataloging biochemical events like transcription and protein binding while the fiercest critics came from the evolutionary biology camp including people like dan graur and w ford doolittle who argued that biochemical activity does not equal evolutionary function.

  if you look at this fight through gould and lewontin's eyes the encode team was guilty of the exact pan adaptationism that the spandrels paper warned against which is the tendency to assume that every trait exists because it was selected for a specific purpose. by equating biochemical noise with function encode was essentially arguing that if the genome is doing something it must be there for a reason which ignores the possibility that some activity is just a structural byproduct or evolutionary noise. however when you ask about the hidden adaptationist assumption driving both sides it gets a bit trickier because the evolutionary biologists were technically arguing against adaptationism. the shared assumption was actually that the most important question in genome biology is determining utility or how much of the dna is useful for the organism. both sides accepted the framing that the percentage of functional dna was the metric that mattered which keeps the focus on teleology rather than history. encode said the number was high because they saw activity as purpose and the critics said the number was low because they saw lack of conservation as lack of purpose but both were obsessed with categorizing the genome based on whether it was selected for rather than just accepting it as a historical document full of contingencies.

  this explains why the evolutionary biologists got so defensive because encode's claim felt like a betrayal of the neutral theory and a slide back toward pre darwinian thinking where everything in nature is assumed to be designed for a reason. if eighty percent of the genome is functional then the burden of proof shifts to explaining why so much non coding dna exists without causing harm which undermines the elegance of the junk dna hypothesis that explains genome size through drift and duplication rather than constant selective pressure. gould and lewontin would argue that the critics were defensive because they recognized that encode was reviving the adaptationist programme which treats organisms as optimal machines rather than patched together historical artifacts. the fear was that by calling everything functional you erase the history of the genome and ignore the spandrels those architectural byproducts that exist not because they were selected but because they are the inevitable result of how the building was constructed.

  however the spandrel concept does break down a bit here because not all non adaptive dna is a spandrel in the structural sense. a spandrel is a necessary consequence of a specific architecture like the arch creating a triangular space but much of what critics call junk dna is just random accumulation of transposons and mutations that are neither useful nor structurally necessary they are just debris. encode called transcriptional leakage function which is more like calling the dust in a room a feature of the house rather than a spandrel created by the roof design. so while the spandrel critique correctly identifies the error of assuming purpose where there is none it does not fully capture the nature of genetic drift which is often just randomness rather than a structural byproduct. this episode shows that adaptationism is still very much running the show in biology because even when scientists try to be neutral they get pulled into debates about utility. the fact that the encode claim caused such an uproar proves that the default assumption for many researchers is still that biology is efficient and purposeful and that any claim suggesting otherwise requires a massive defense. ultimately the controversy highlights that while we have moved past naive adaptationism the instinct to look for purpose in every biochemical signal is still a powerful force that requires constant vigilance from evolutionary biologists to keep in check. hope this helps clarify how those old debates are still shaping modern genomics.
