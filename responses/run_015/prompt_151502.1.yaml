answer: |-
  ### Part I: The Architectural Outline of *Perpetual Peace* (1795)

  To analyze the League of Nations through Kant's framework, we must first reconstruct the normative architecture of *Zum ewigen Frieden*. Kant's project is not a utopian sketch but a deduction of the legal conditions (*Rechtsbedingungen*) required to exit the state of nature between nations.

  **1. The Preliminary Articles (Negative Conditions)**
  These are immediate prohibitions to halt the mechanics of war. Key provisions include: no secret treaties, no standing armies, no national debt for external strife, and crucially, **no forcible interference in the constitution or government of another state.** This establishes the sovereignty of existing states as a starting point, even if their internal constitutions are flawed.

  **2. The Definitive Articles (Positive Conditions)**
  These establish the permanent legal order.
  *   **First Definitive Article:** The Civil Constitution of Every State Shall Be **Republican.** This is the foundational condition. A republic separates the executive from the legislative and requires citizen consent for war. Since citizens bear the costs of war, they will hesitate to start it. Non-republican states (despotisms) treat subjects as property and can wage war as a "pleasure party."
  *   **Second Definitive Article:** The Right of Nations Shall Be Based on a **Federation of Free States** (*foedus pacificum*). Kant distinguishes this from a "League of Peace" (a mere treaty to end one war) and a "State of Nations" (*civitas gentium* or world state). The Federation is a voluntary, expanding union of republics that secures the freedom of each member without becoming a super-sovereign, which Kant fears would become a "soulless despotism."
  *   **Third Definitive Article:** Cosmopolitan Right Shall Be Limited to Conditions of **Universal Hospitality.** This regulates cross-border interaction, ensuring foreigners are not treated with hostility, facilitating commerce and communication which bind interests together.

  **3. The Crucial Distinction: League vs. State of Peace**
  Kant distinguishes between a *foedus pacificum* (a treaty to end a specific war) and a *status pacificus* (a permanent condition of peace secured by law). The goal is the latter. However, the mechanism to achieve it is the former, provided the members are republics. The Federation does not initially possess coercive public laws like a domestic state; rather, it relies on the shared rational interest of republics to submit disputes to arbitration. Coercion exists, but it is the moral and political coercion of public reason and shared legal culture, not necessarily a supranational army.

  ***

  ### Part II: Analysis of the League of Nations (1920–1946)

  The League of Nations represents the first major empirical attempt to instantiate a Kantian federation. However, mapping the League onto Kant's framework reveals significant structural deviations that explain its normative and practical failure.

  #### 1. Satisfaction and Violation of Kantian Conditions

  **The Republican Condition (Violated)**
  *   **Kant's Requirement:** Membership in the federation is contingent upon having a republican constitution (separation of powers, representation).
  *   **League's Reality:** The League's Covenant (Article 1) opened membership to "any fully self-governing State, Dominion or Colony."
  *   **Mapping:** The founding members included the British Empire, the French Third Republic, the Kingdom of Italy, and the Empire of Japan. While France was nominally republican, the others were imperial monarchies or oligarchies. Crucially, the aggressors in the 1930s (Japan, Italy, Germany) were non-republican in the Kantian sense; the executive could commit to war without the effective consent of the governed.
  *   **Verdict:** The League violated the First Definitive Article. By admitting non-republican regimes as equals, it severed the link between internal freedom and external peace. Kant argues that without republicanism, leaders treat war as a game; the League treated these leaders as rational actors capable of being bound by collective security, a premise Kant would reject.

  **Coercive Authority (Ambiguous/Insufficient)**
  *   **Kant's Requirement:** The Federation must be more than a mere truce but less than a World State. It requires a binding force to secure peace, but Kant is wary of centralized coercive power that infringes sovereignty.
  *   **League's Reality:** Article 16 provided for economic and military sanctions against aggressors. However, enforcement required unanimity in the Council (excluding the disputing party).
  *   **Mapping:** In the Manchurian Incident (1931) and the Second Italo-Ethiopian War (1935), the League had the *legal* authority to sanction but lacked the *political will* and *centralized capacity* to enforce them.
  *   **Verdict:** The League attempted a middle path Kant describes but failed to secure the "binding force" necessary for a *status pacificus*. It possessed the form of coercion (sanctions) without the underlying moral unity (republicanism) that makes coercion legitimate and effective in Kant's view.

  **Inclusion of Non-Republican Regimes (Violated)**
  *   **Kant's Requirement:** Peace spreads through a federation of *free* states. Non-republics are not yet capable of entering a true legal condition of peace.
  *   **League's Reality:** Universal membership was the goal, regardless of internal constitution.
  *   **Verdict:** This is a fundamental violation. Kant posits that external peace is a function of internal justice. The League posited that external institutions could constrain internal injustice. The collapse of the League suggests Kant was correct: you cannot build a *status pacificus* on foundations of despotism.

  #### 2. Institutional Form: Federation or Unanticipated Hybrid?

  Should the League be understood as Kant's *foedus pacificum*? **Structurally, yes; Normatively, no.**

  *   **Structural Fit:** Like Kant's Federation, the League was a voluntary association of sovereign states, not a World State (*civitas gentium*). It had no direct authority over individuals, only states. It avoided the "soulless despotism" Kant feared.
  *   **Normative Deviation:** Kant envisioned a federation that grows organically as states become republican. The League was a static, universal assembly created by treaty among existing powers, regardless of their constitutional evolution.
  *   **Unanticipated Form:** Kant did not anticipate an institution that claimed **collective security** (an automatic guarantee of borders) without **collective constitutional homogeneity**. He assumed that republican states would naturally align against aggressors because their citizens bear the cost. The League tried to mechanize this alignment among non-republics. Thus, the League was an institutional form Kant did not anticipate: a coercive security apparatus devoid of the requisite internal moral constitution of its members.

  #### 3. The Failure of Enforcement and the "Binding Force" Problem

  The League's inability to prevent aggression in Manchuria (Japan), Ethiopia (Italy), and the broader descent into WWII tests Kant's claim that perpetual peace requires binding force without becoming a world state.

  *   **The Kantian Hypothesis:** Peace requires a legal condition (*Rechtzustand*), not just a moral one. This implies some capacity to check violation. However, this capacity usually relies on the shared rationality of republics.
  *   **The Evidence:**
      *   **Manchuria (1931):** Japan (a non-republican empire) invaded. The League issued the Lytton Report condemning Japan but imposed no sanctions. Japan withdrew from the League.
      *   **Ethiopia (1935):** Italy (Fascist regime) invaded. The League imposed limited economic sanctions but excluded oil and did not close the Suez Canal (controlled by Britain/France).
  *   **Analysis:** These failures reveal that a Federation without a monopoly on force (World State) relies entirely on the **voluntary compliance** of its members. In Kant's theory, republics comply because it is rational and lawful. In the League, non-republics complied only if it suited their interest.
  *   **Implication for Kant:** The League's collapse suggests that Kant underestimated the difficulty of maintaining a "binding force" among non-republics. However, it **confirms** his claim that a World State is dangerous or impossible; the major powers (UK, France) refused to subordinate their military to the League, preserving their sovereignty. The failure was not that the League lacked *enough* state-like power, but that it tried to exercise state-like functions (sanctions) without the state-like legitimacy (republican consent). The "binding force" Kant envisions is moral-legal, grounded in public reason. The League tried to make it mechanical-political, grounded in treaty obligations that despots could ignore.

  #### 4. Theoretical Verdict: Confirmation, Gap, or Limit?

  The episode ultimately **confirms Kant's conditions regarding republicanism** but **exposes a gap in his account of enforcement during the transition period.**

  *   **Confirmation of the Republican Condition:** The League failed precisely when non-republican powers chose war. Had the major powers been true Kantian republics (where citizens veto war), the aggression by Japan and Italy might have been checked earlier, either through internal political constraints in those countries or unified external resistance from other republics. The League's collapse validates Kant's First Definitive Article: without republican constitutions, international institutions are hollow.
  *   **Exposure of an Enforcement Gap:** Kant is vague on how the Federation handles a "rogue" state that is *not* republican. He assumes the federation will expand until non-republics are marginalized or reform. He offers no guidance on how a Federation of republics should coercively manage a powerful non-republican neighbor *before* that neighbor is defeated or reformed. The League faced this exact problem (how to stop Germany/Japan without a supranational army) and had no solution. Kant's framework offers no guidance on the *transitional mechanics* of enforcement against a non-compliant despotism.
  *   **Universal Membership Limits:** The episode shows that Kant's theory was **not designed for universal-membership institutions** comprising mixed regimes. Kant's Federation is exclusive to "free states." The League's attempt at universality diluted its normative cohesion. Where Kant offers no guidance is on the diplomatic protocol for excluding non-republics from a peace federation without triggering the very war the federation seeks to prevent. The League included potential aggressors to keep them "inside the tent," a pragmatic move Kant's strict deontology does not address.

  **Conclusion**
  The League of Nations was a *foedus pacificum* in form but not in substance. It violated Kant's primary condition (republicanism) and attempted to exercise coercive authority without the moral legitimacy to do so. Its collapse confirms Kant's insight that internal justice is a prerequisite for external peace. However, it exposes a gap in Kant's practical philosophy: he provides no robust mechanism for a Federation to defend itself against non-republican aggression during the historical transition toward peace, leaving a vacuum that the League tried to fill with treaties rather than constitutional unity.
