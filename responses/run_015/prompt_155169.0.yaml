answer: |-
  Two partners, Elena and Marcus, co-own a royalty stream from a specialized manufacturing tool, paying $100,000 if a pending zoning variance is approved, zero otherwise. They share identical engineering reports and municipal correspondence, which support two incompatible expert forecasts: Method Low implies a 20% approval probability, Method High implies 80%. Neither partner has private information, liquidity needs, or alternative uses for the capital, and both are risk-neutral over these sums. Elena prices the claim using a credibility-weighted average of the methods (50% weight each), calculating an expected value of $50,000. Marcus, applying maxmin expected utility to the model uncertainty, values the claim at the worst-case expectation, $20,000. With these rules and facts common knowledge, Marcus sells his share to Elena for $35,000, a price within the surplus interval, executing a voluntary trade driven solely by their distinct decision rules under ambiguity.

  **1. Derivation and Price Interval**
  Elena's reservation price (buy) is her Expected Value: $0.5(0.2 \times \$100,000) + 0.5(0.8 \times \$100,000) = \$50,000$. Marcus's reservation price (sell) is his Maxmin Value: $\min(0.2 \times \$100,000, 0.8 \times \$100,000) = \$20,000$. Since Elena values the asset at $\$50,000$ and Marcus values it at $\$20,000$, any price $P$ such that $\$20,000 < P < \$50,000$ generates a surplus for both. The trade at $\$35,000$ falls strictly within this interval, satisfying individual rationality for both parties under their specified rules.

  **2. No-Trade Inference and Failed Premise**
  In the standard no-trade argument, if trade occurs with common priors and common knowledge of rationality, one party must possess private information. Here, Alice (Elena) knows Marcus uses Maxmin; Marcus knows Elena uses Expected Value. When Marcus offers to sell at $\$35,000$, Elena does not infer that Marcus knows the probability is actually 20%; she infers only that his rule values the asset at $\$20,000$ regardless of the probability mixture. Consequently, she does not update her belief to match his valuation. The premise that fails is **Savage's Sure Thing Principle (or the Independence Axiom)**, which underpins the representation of preferences by a unique subjective probability measure. The failure is not due to irrationality—Maxmin is axiomatically coherent (Gilboa-Schmeidler)—but because preferences are not separable from the structure of uncertainty; valuation depends on the *set* of priors, not a single weighted prior.

  **3. The Outside Observer**
  An outside observer sees a trade at $\$35,000$ despite public consensus on the data and no apparent hedging motives. The observer might infer a disagreement on facts (that Marcus believes $p=0.2$). However, there is no disagreement on the facts: both agree $p \in \{0.2, 0.8\}$. The case is therefore evidence that **trading volume is an ambiguous signal of belief disagreement**. Volume can arise from heterogeneity in *decision rules under ambiguity* even when beliefs (defined as the set of plausible probabilities) are identical.

  **4. Swap Test**
  Replace Marcus (Maxmin) with Marcus* (Expected Value holder who assigns probability 1 to Method Low). Marcus* values the claim at $\$20,000$. The trade survives at $\$35,000$ with no observable difference in price or volume. However, the *interpretation* changes: in the original case, the trade reflects ambiguity aversion with shared belief sets; in the swap case, it reflects genuine belief divergence. This implies the case **does not uniquely support** the claim that volume indicates belief disagreement; rather, it supports the claim that volume *cannot distinguish* between belief disagreement and rule heterogeneity under ambiguity.

  **5. The Single Feature**
  The feature doing the work is **Ambiguity Aversion (Non-Additive Beliefs)**. If this is removed and both parties are Subjective Expected Utility maximizers with a common prior and identical information, their valuations must converge (both would value at $\$50,000$ or both at $\$20,000$ depending on the shared prior). The argument collapses back to the No-Trade Theorem, and the trade vanishes.

  **Objection 1: Dynamic Coherence**
  *Objection:* A dynamically coherent agent anticipates that ambiguity will resolve before the payout (the zoning decision occurs). Knowing they will learn the true probability, a sophisticated Maxmin agent should value the asset based on the expected value of the resolution, not the current worst case.
  *Response:* If Marcus anticipates the resolution and cannot trade intertemporally, his valuation remains the minimum of the expected values ($\$20,000$) because the resolution does not change the payout structure, only the knowledge. However, if we impose a rule requiring him to value the *option* of waiting for resolution (smooth ambiguity), his reservation price rises toward the expected value of the priors ($\$50,000$). If his price moves to $\$50,000$, the trade interval closes and trade vanishes. This shows the trade is contingent on the *persistence* of ambiguity at the decision node; it is not robust to dynamic updating rules that internalize future information resolution.

  **Objection 2: Ambiguity as Risk**
  *Objection:* Ambiguity aversion is merely risk aversion over a second-order probability distribution (model uncertainty). Thus, Marcus is simply risk-averse and Elena is risk-neutral; this collapses into the risk-sharing exemption.
  *Response:* Standard risk sharing requires concave utility over *wealth*. Here, both have linear utility over wealth. The "risk" is over the *model validity*. While mathematically isomorphic to risk aversion over a second-order lottery, the economic distinction is that Marcus refuses to assign a second-order prior (a probability to the models). He treats the models as *uncomparable*. If he assigned a second-order prior, he would be an Expected Utility maximizer and, with common information, would agree with Elena. The trade exists precisely because he *rejects* the reduction of ambiguity to risk. Thus, it demonstrates volume from *incompleteness of preferences* rather than curvature of utility.

  A market composed of many such pairs would exhibit high trading volume even during periods of stable public information, provided ambiguity regarding the interpretation of that information remains high. Prices would not necessarily fluctuate wildly, as the divergence stems from decision rules rather than shifting belief estimates, but volume would spike when consensus on the *model* fractures, even if data remains constant. For this case to matter beyond the page, real traders must systematically violate the Independence Axiom in liquid markets, exhibiting Ellsberg-like behavior where they discount assets not because they expect lower payouts, but because they distrust the probability estimates themselves. If traders are predominantly Subjective Expected Utility maximizers, such volume would vanish, leaving belief heterogeneity as the sole driver of speculative trade.
