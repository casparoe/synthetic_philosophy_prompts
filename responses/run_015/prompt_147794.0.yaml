answer: |-
  1. If the past self that acted badly isn't you in any meaningful sense of personal identity, why should the present self bear the cost?
     **Follow-up:** I anticipate you'll say desert binds the moral character continuum, not the conscious agent.
     **Second-order Push:** But doesn't that just relocate the problem? If the conscious bearer isn't the actor, why is the continuum itself morally relevant enough to justify suffering?

  2. Does this view collapse into consequentialism in disguise, where suffering serves an instrumental cosmic balance rather than being genuinely deserved?
     **Follow-up:** If you insist the suffering is intrinsic to the desert claim, doesn't that require a metaphysical link you've explicitly rejected, leaving only the utility of balance as the justification?

  3. By spreading desert over infinite lives, aren't you making present injustice less urgent rather than more, since current suffering could be interpreted as justified payback?
     **Follow-up:** When you argue we must still alleviate suffering, aren't you contradicting the core premise that the suffering is morally deserved and thus fitting?

  4. What phenomenological or empirical evidence could distinguish this view from a psychological coping mechanism designed to rationalize inequality?
     **Follow-up:** If the answer is "none," doesn't that render the theory unfalsifiable and therefore philosophically inert?

  5. How is the moral character continuum measured without metaphysical access, and who determines where an individual sits on it?
     **Follow-up:** If the measurement is opaque or subjective, doesn't that open the door for the powerful to claim higher continuum status to justify exploiting those they deem "lower"?

  6. How do you account for moral luck within the continuum, where external circumstances dictate the opportunity to exhibit moral character?
     **Follow-up:** If two beings have identical character potential but different opportunities to act, does the continuum treat them equally, and if not, isn't the desert fundamentally unjust?

  7. Can the continuum regress, or is moral debt permanently accrued across lives?
     **Follow-up:** If it can regress, what mechanism allows for redemption without identity, and if it can't, doesn't this entail a form of eternal damnation incompatible with a secular ethics?

  8. Why retain the label "karma" at all if you strip away metaphysical causation and rebirth, rather than just calling this a theory of trans-generational moral responsibility?
     **Follow-up:** Isn't keeping the terminology a strategic move to borrow the cultural authority of Eastern metaphysics while avoiding the burden of proving its ontology?
