answer: |-
  You are asking exactly the right question. In fact, you've hit on the single most common criticism leveled against Burkean conservatism. It's often called the **"Appeal to Tradition" fallacy**: just because something *is* old doesn't mean it *ought* to be kept.

  If your seminar is doing its job, you should be feeling this tension. However, there is some nuance in both Burke and Chesterton that saves them from simply saying "everything old is good." Here is how to unpack your TA's comment and refine your understanding of the Fence.

  ### 1. Chesterton's Fence is about *Knowledge*, not *Preservation*
  Your summary ("don't tear down a fence unless u know why its there") is 90% there, but the last 10% is crucial.

  Chesterton does **not** say: "The fence is old, therefore it must stay forever."
  He says: "Do not tear down the fence until you understand the reason it was put there."

  **The Nuance:** Once you *do* figure out why the fence was built, you might realize the reason is no longer valid.
  *   **Example:** Maybe the fence was built to keep cattle off a road. If there are no more cattle and the road is now a highway, the fence is useless. But Chesterton argues you shouldn't remove it until you've confirmed *why* it was there. If you remove it without knowing, you might find out too late that it was actually holding back a landslide.

  **The Takeaway:** Chesterton shifts the **burden of proof**. He isn't saying the fence is sacred; he's saying the person who wants to remove it has a responsibility to understand the system before breaking it.

  ### 2. Burke and "Prejudice" (Your TA's Point)
  This is where it gets technical. When we hear "prejudice" today, we think of racism or irrational bias. Burke meant something closer to **"pre-judgment" or "instinct."**

  Burke argued that individual human reason is weak. We are short-lived, emotional, and prone to error. If every time you had to make a moral decision you had to calculate the utilitarian outcome from scratch, you'd make mistakes constantly.

  **"Prejudice," for Burke, is a mental shortcut.** It is the accumulated wisdom of your ancestors embedded in your habits.
  *   **Why it matters:** It allows society to function smoothly without everyone arguing about first principles every day.
  *   **Does it mean old rules are infallible?** No. Burke admits traditions can be flawed. But he argues they are *tested* by time. A law that has survived 200 years has likely survived because it solves a problem you might not see immediately.

  **The TA's Point:** The TA was likely trying to say that Burke values these "prejudices" (habits/traditions) because they stabilize society, not because they are divinely inspired. They are "justified" pragmatically, not morally.

  ### 3. Was Burke a Status Quo Absolutist?
  This is the biggest misconception about Burke. He was not a reactionary who wanted *nothing* to change.

  *   **Context:** Burke supported the American Revolution (mostly) but hated the French Revolution. Why?
  *   **The Difference:** The Americans wanted to restore rights they felt they already had as Englishmen (reform/preservation). The French wanted to wipe the slate clean, kill the king, and build a utopia based on abstract reason (radical innovation).

  Burke's famous line is: **"A state without the means of some change is without the means of its conservation."**

  He is explicitly saying: **You must change things in order to save them.** If a tradition is becoming brittle and breaking, you need to prune it so it can survive. But the goal of change should be to *preserve* the essence of the society, not to remake it from scratch.

  ### 4. Addressing Your Critique: "If it was bad, it would be gone already."
  You asked: *If some law has been around for 200 years it must be doing something good, otherwise people wouldve gotten rid of it already?*

  This is a strong point, but conservatives would offer two counter-arguments:

  1.  **Latent Function:** Social systems are complex. A rule might seem stupid (e.g., "No selling meat on Sunday"), but it might have had a hidden function (e.g., ensuring a universal day of rest so laborers couldn't be exploited by 7-day work weeks). If you remove it because it looks stupid, you might break the hidden function.
  2.  **The Cost of Error:** Burke argues that the cost of being wrong about a social change is catastrophic (see: The Terror in the French Revolution, or various 20th-century utopian experiments). Therefore, even if there is a 40% chance the old rule is useless, it is safer to keep it than to risk a 10% chance that removing it causes societal collapse.

  ### Summary for your Seminar
  You don't have to agree with them, but to engage with them accurately:

  1.  **They don't claim old rules are *automatically* justified.** They claim old rules have a **presumption** of utility because they have survived the "test of time."
  2.  **Chesterton allows for removal.** Just not *ignorant* removal.
  3.  **Burke allows for change.** Just not *radical, abstract* change. Change should be gradual and aimed at preservation.
  4.  **Prejudice** is their explanation for how tradition works psychologically (habitual virtue vs. calculated reason).

  **Your Counter-Argument:**
  If you want to push back in class, your strongest angle is: **"How do we distinguish between a 'wise tradition' and a 'long-standing injustice'?"**
  Slavery was a tradition protected by "prescription" and "prejudice" for centuries. Burkeans struggle with this. Their answer is usually that slavery violated *older*, deeper natural laws (Christianity, English Common Law), but it's a tension that remains in conservative thought.

  You're understanding the material well enough to critique it, which is exactly where you want to be.
