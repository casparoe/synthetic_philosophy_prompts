  Please rank these (and substitute any you think are more upstream) by dependency and tractability: which answers would change the protocol design, which are tractable for philosophers and theorists rather than ML engineers, and which could be resolved with conceptual analysis versus requiring empirical results? I want a defended agenda, not a survey or reading list. If you think the epistemic-fragmentation framing is misguided, explain why and redirect to the crux that actually divides the space.
