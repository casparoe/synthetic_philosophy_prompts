      *   *Reading 3 (Corrective Loyalty):* "Loyalty to my country *requires* correcting its moral errors to ensure its long-term survival/good." (Substantive). Supports Affirmative? Yes.
      *   *Reading 4 (Ideal Loyalty):* "I am loyal not to the actual country but to the *idea* of what it should be." (Shifts subject). Supports Negative's counter-argument? Yes.

      *Refining the Menu for the User:* Need to order from trivial to strong.
      1.  *Priority of Attention:* I pay more attention to my country's errors than others'. (Platitude).
      2.  *Unconditional Support:* I support actions regardless of morality. (False/Vice).
