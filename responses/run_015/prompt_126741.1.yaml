      *   *Phrase 1:* "My country, right or wrong." (Often attributed to Stephen Decatur, 1816).
      *   *Phrase 2:* "If right, to be kept right; and if wrong, to be set right." (Attributed to Carl Schurz, 1872, responding to Decatur).
      *   *Tension:* Is patriotism loyalty to the *entity* (land, people, state) regardless of action, or loyalty to the *ideal* embodied by the entity?

  3.  **Drafting the Menu of Claims (Requirement 1 & 2):**
