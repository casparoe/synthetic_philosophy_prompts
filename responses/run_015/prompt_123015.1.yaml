answer: |-
  **Desiderata for a Theory of Experience Timing**

  1.  **Non-Circular Timing:** Define the time of experience ($T_{exp}$) via independent markers (e.g., neural correlates), not subject report. Subjects can be wrong about when they experience things.
  2.  **Interval Ontology:** Specify content between flashes. Criterion must be principled (e.g., neural completion), not ad hoc.
  3.  **Temporal Triad:** Distinguish $T_{exp}$ (when experience occurs), $T_{rep}$ (time represented), and $T_{report}$ (judgment time).
  4.  **Modality Generality:** Account for the Cutaneous Rabbit without vision-specific mechanisms.
  5.  **Backward Referral:** Accommodate Libet-style shifts where $T_{exp}$ precedes neural arrival.
  6.  **Double-Entry:** Accommodate or refute parallel streams (fast/coarse vs. slow/detailed) lacking a singular $T_{exp}$.

  **Meta-Questions**

  1.  **Non-negotiable vs. Preferences:** Non-Circular Timing and the Temporal Triad are non-negotiable. Without them, the debate is verbal, collapsing into disagreements about vocabulary. Empirical decidability is a preference; some argue the question is inherently indeterminate. Introspective Authority is a preference; treating reports as authoritative begs the question against illusion theories.
  2.  **Joint Unsatisfiability:** Yes. Non-Circular Timing + Backward Referral + Introspective Authority are jointly tense. If $T_{exp}$ is defined neurally (Non-Circular), backward referral must be representational ($T_{rep}$), not experiential. If $T_{exp}$ is phenomenological (Introspective Authority), it is circular. A theory must sacrifice one.
  3.  **Most Excluding Requirement:** Non-Circular Timing. Both classic options often rely on introspective reports to define when an experience occurs, or assume neural latency equals experience latency without proof. This requirement forces a commitment to independent measures most theories lack.
  4.  **No Fact of the Matter:** Legitimate. If the theory shows the dichotomy presupposes a Cartesian Theater (a single place/time where experience happens), it may deny the question's coherence. It owes an error theory explaining why the intuition of a definite timing persists despite its falsity.

  **Predictive Requirement: Masking Experiment**

  Present a random-dot mask 0–250ms after the second flash. Measure reports of motion completion and midpoint color.

  *   **Orwellian Support:** Subjects report seeing the first flash with high certainty even when motion reports are low (mask interrupted revision). The initial experience existed but was overwritten.
  *   **Stalinesque Support:** Certainty of the first flash drops correlated with motion reports (mask interrupted construction). Nothing was experienced until construction completed.
  *   **Double-Entry Support:** Motion reported (coarse path) but color discrimination fails (detailed path) at specific delays, decoupling features without a single failure point.
  *   **Indiscriminable:** If certainty tracks motion reports perfectly for both Orwellian and Stalinesque models, no behavioral pattern discriminates them. This implies we lack independent access to $T_{exp}$, violating Desideratum 1. The desiderata list would then require revision to include neural timing measures as constitutive of experience time.

  **Classic Failures**

  The Orwellian model fails Backward Referral; it cannot explain experiencing an event before the stimulus causing it arrives. The Stalinesque model fails Introspective Authority; it denies the felt immediacy of experience, claiming we live in a delayed simulation. Both struggle with Non-Circular Timing, often relying on the very reports they seek to explain.
