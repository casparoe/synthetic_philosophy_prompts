answer: |-
  Your hypothesis that the impasse is *mostly* verbal is insightful, but it underestimates the formal constraints driving the debate. While there is a verbal component regarding the scope of the word "truth," the core disagreement is **structural and logical**, centering on the tension between *expressive power* and *logical consistency*.

  Here is a diagnosis of the disagreement, an evaluation of your hypothesis, and an outline of what would constitute progress.

  ### 1. Diagnosing the Structure of the Disagreement

  The debate is not merely about dictionary definitions; it is about the **logical cost** of maintaining the deflationary thesis. The structure rests on two pillars:

  **A. The Expressive Pillar (Generalizations)**
  *   **The Critic:** Argues that the T-schema ($T(\ulcorner P \urcorner) \leftrightarrow P$) is finite, but truth allows for infinite generalizations (e.g., "Everything the Pope says is true"). To capture this without the T-schema, you need propositional quantification. Critics argue that propositional quantification *itself* presupposes a substantive notion of truth or propositions.
  *   **The Deflationist:** Replies that truth is a logical device that simulates infinite conjunctions. They often adopt **substitutional quantification** to handle generalizations without ontological commitment to "Truth" as a property.
  *   **The Clash:** This is a dispute about **ontological parsimony**. Is the machinery required to make the deflationist generalization work (substitutional quantification) cheaper than the machinery the critic proposes (substantive properties)?

  **B. The Logical Pillar (Consistency and Paradox)**
  *   **The Critic:** Points to Tarski's Undefinability Theorem and the Liar Paradox. In classical logic, a fully general T-schema leads to contradiction. Therefore, the schema *cannot* be fully general. If you restrict it (e.g., "The T-schema holds for all *grounded* sentences"), you have introduced a substantive distinction (grounded vs. ungrounded) that deflationism claims doesn't exist.
  *   **The Deflationist:** Must either (1) restrict the schema (admitting it's not fully general), (2) change the logic (paraconsistent/paracomplete), or (3) claim paradoxical sentences are meaningless.
  *   **The Clash:** This is a dispute about **conservativeness**. Deflationism traditionally claims truth is "conservative" (adding truth to a theory doesn't prove new non-truth facts). Critics (like Ketland or Shapiro) argue that to handle consistency and generalization, truth must be *non-conservative* (it proves consistency statements the base theory cannot).

  ### 2. Evaluating Your "Verbal Dispute" Hypothesis

  You asked: *Is the impasse mostly verbal?*

  **Verdict: Partially, but mostly Formal/Methodological.**

  **Where you are right (The Verbal Element):**
  There is a "No True Scotsman" dynamic. When critics point to uses of 'truth' in normative contexts ("Truth is a virtue") or paradoxical contexts, deflationists often reply, "That is not the *logical* concept of truth we are analyzing." If the disagreement were solely about which English sentences contain the word "truth," it would be lexicography, not philosophy.

  **Where you are wrong (The Formal Element):**
  The disagreement persists because **Tarski's Theorem is not verbal.** It is a mathematical fact that a consistent classical language cannot contain its own fully general truth predicate.
  *   If the deflationist insists the T-schema is exhaustive, they must abandon classical logic.
  *   If they keep classical logic, they must restrict the schema.
  *   **The Real Disagreement:** The critic argues that *whatever constraint you use to restrict the schema* (e.g., Kripkean fixed points, revision sequences) constitutes a **substantive theory of truth**. The deflationist argues these are merely constraints on *assertibility*, not truth itself.

  Therefore, the dispute is not about what the word means, but about **which logical sacrifices are acceptable** to preserve the deflationary intuition.

  ### 3. What Would Count as Progress?

  Since the stalemate is driven by formal limits and methodological preferences, progress will not come from one side "winning." It will come from reframing the options.

  **A. A Formal Result: The Cost-Benefit Analysis**
  Progress has already occurred via **Feferman's Reflective Closure** and **Shapiro's Conservativeness Argument**.
  *   *Result:* We now know that if you want a truth theory that proves the consistency of arithmetic (which seems necessary for mathematical practice), deflationism (in its strict conservative form) fails.
  *   *Progress:* Acknowledging that "Deflationism" is not a binary switch but a spectrum. "Minimalism" might work for ordinary language, but "Mathematical Deflationism" requires substantive axioms. Progress lies in mapping exactly *how much* substance is needed for *which* domains.

  **B. A Conceptual Distinction: Truth vs. Truth-Attribution**
  A fruitful distinction would be separating the **concept** of truth from the **predicate** 'is true'.
  *   *Proposal:* Deflationism might be right about the *predicate* (it's a disquotational device) but wrong about the *concept* (which plays a role in epistemology and normativity).
  *   *Progress:* If both sides agree that the *logical predicate* is deflationary but the *normative concept* is substantive, the "completeness" worry dissolves. The critic is talking about the norm; the deflationist is talking about the logic.

  **C. A Change of Question: From "What is Truth?" to "What Logic for Truth?"**
  The question "Is deflationism complete?" assumes there is a single logic of truth.
  *   *New Question:* "Under which logical frameworks (classical, intuitionistic, paraconsistent) does the T-schema remain consistent?"
  *   *Progress:* This shifts the debate from metaphysics to **logical engineering**. It forces the deflationist to specify their logic. If they choose a paraconsistent logic to save the T-schema, they have implicitly accepted that truth has a substantive logical structure (dialetheism).

  ### 4. Why No Progress Might Be Expected

  Despite the above, a permanent stalemate is likely for two reasons:

  1.  **Incommensurable Goals:** The deflationist wants to **eliminate** truth as a philosophical problem. The critic wants to **explain** truth's role in science and logic. These are different projects. A deflationist will always view the critic's "substantive additions" as unnecessary metaphysical baggage; the critic will always view the deflationist's "restrictions" as admissions of failure.
  2.  **The Normative Gap:** Truth is tied to *norms* (assertion, belief, inquiry). Deflationism struggles to explain why we *ought* to believe what is true without invoking a substantive property of "correctness." Until there is a deflationary account of **normativity** that satisfies critics, the "completeness" objection will remain.

  ### Summary
  Your hypothesis is **half-right**. The surface-level bickering about "genuine uses" is verbal. However, the underlying engine of the dispute is **Tarski's Theorem**. The disagreement is real: it is about whether the logical machinery required to save the T-schema from paradox counts as a "substantive theory."

  **Progress** will not look like a knockout blow. It will look like a **taxonomy of deflationisms**: acknowledging that a deflationism sufficient for daily conversation is logically distinct from a deflationism sufficient for mathematical proof. The "impasse" exists because philosophers are often using the same label for logically distinct theories. Distinguishing **Logical Deflationism** (about the predicate) from **Metaphysical Deflationism** (about the property) is the most viable path forward.
