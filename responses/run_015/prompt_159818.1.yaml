  Subject: Preparation for Thursday's committee meeting regarding the TAH case

  Dear colleagues,

  I have been reviewing our past minutes and the papers for Thursday's case, and while I know my role is strictly to record the discussion, I hope it is helpful to offer some analysis on the implicit rules guiding our decisions so far. Based on the six precedents we have established, I predict that the committee will rule the proposed withdrawal of the artificial heart support as allowing death and permissible, despite the significant philosophical discomfort the Chair has expressed. The reason for this prediction is less about moral consistency and more about the practical necessity of maintaining our existing framework; if we rule this as doing rather than allowing, we collide directly with precedent six, which marks active killing as impermissible, yet the clinical consensus is that stopping treatment is the right course. To avoid sanctioning an impermissible act while preventing futile treatment, we will likely stretch the definition of allowing to cover this scenario, just as we did with the pacemaker in case three.

  There are broadly three rules that fit our past decisions, though they diverge sharply on this new case. The first is the Underlying Pathology Rule, which holds that an act is only allowing if the patient dies from their disease process rather than the removal of support. This fits our ventilator, antibiotic, dialysis and non-start cases perfectly, but it was already strained by the pacemaker decision and it predicts that stopping the artificial heart is doing, since there is no heart left to fail. The second is the Treatment Burden Rule, which states that any medical intervention can be withdrawn if it is futile or burdensome, regardless of whether it replaces an organ or aids a failing one. This fits all five permissible precedents and predicts that stopping the pump is allowing. The third is the Physical Intrusion Rule, suggesting that external machines are allowing while implanted devices are doing, which fits the ventilator and dialysis cases but was explicitly rejected in the pacemaker minutes despite the dissenters.

  I believe the rule we are actually running is the Treatment Burden Rule, simply because it is the only one that allows the committee to function without paralysing us in complex technological cases. The Chair's hesitation suggests a desire to shift towards the Underlying Pathology Rule, but adopting that now would invalidate our pacemaker precedent and potentially trap us in a position where we cannot permit withdrawal of advanced life support even when clinically indicated. We are prioritising clinical consensus and futility over metaphysical causation, even if our language sometimes suggests otherwise. To test whether we are truly committed to the Treatment Burden Rule or if we are secretly clinging to the Pathology Rule, the single hypothetical I would propose at the next meeting is a patient with a high spinal cord injury who breathes solely via an implanted diaphragm pacing system. Their lungs are healthy, but the nerves are severed. If we turn off the external controller, are we letting the nerve injury kill them or killing them by stopping the electricity? This separates organ failure from device dependence without the complication of a removed organ.

  On the specific nuances raised in the papers, my view is that the distinction between swapping batteries and programming the device off should make no difference. Our first precedent explicitly stated that switching off a ventilator is morally identical to removing the tube, and creating a distinction here would be inconsistent unless we are prepared to reopen case one. Similarly, handing the battery packs to the family to stop the swapping is merely laundering the decision; the moral responsibility lies with the clinical team's agreement that treatment is futile, not with who physically holds the plastic casing. The closest analog among our precedents is undoubtedly the pacemaker case, as both involve implanted electrical devices regulating vital function, though the artificial heart is obviously more total in its replacement of biology.

  If our precedents genuinely underdetermine this, we must recognise what principle we are committing to with each verdict. If we rule this as allowing, we commit to the principle that technological dependence does not alter the moral status of treatment withdrawal, even when the technology replaces the organ entirely. If we rule it as doing, we commit to the principle that biological integrity matters morally, and that replacing an organ with a machine changes the nature of death from natural cessation to mechanical failure, which risks making future withdrawal of advanced support ethically precarious. Finally, regarding the member's suggestion that we drop the doing and allowing distinction and simply record permissibility, she is partially right that the distinction often collapses in practice, but I believe we would lose something vital if we did so. The distinction provides legal and moral cover by aligning our decisions with the natural cause of death, and it preserves the crucial difference between intending death, as in the lethal injection case, and accepting it as a consequence of ceasing futile intervention. Dropping the language might simplify our minutes, but it would leave us exposed should our reasoning ever be scrutinised outside this room.

  I hope this helps clarify the landscape before Thursday.

  Best wishes

  Junior Minute-Taker
