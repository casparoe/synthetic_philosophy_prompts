prompt: |-
  Bit of an odd request, sorry in advance. Three months ago I got voluntold onto our town's flood readiness committee — I'm a drainage engineer, I know culverts, not decision theory — and somehow I've ended up as the person who writes the recommendation memos. We meet monthly, the town manager signs off, and the state wants a benefit-cost ratio with one number in it.

  The problem is every number I get comes as a range. The consultant's surge model says the north district is somewhere between a 1-in-80 and a 1-in-400 annual chance, depending on which storm record you feed it, and the two hydrologists on the committee flatly disagree about how much upstream development has changed things. Finance wants a single dollar figure by the 14th. I have maybe six hours before the next meeting and no budget to hire anyone.

  I've been reading around in the imprecise probability stuff — credal sets, lower and upper probabilities, that whole family — and I think it's the right frame, but I can't hand a committee of volunteers a textbook. So: write me a procedure I can actually run to get from a range to a recommendation.

  What I need from it: the questions to ask in order, what counts as a good enough answer to each, when I'm allowed to collapse the range down to a point and what I have to write down when I do, and where the procedure has to stop and say this is a values question, a human decides it. It needs to handle the case where the range comes from experts genuinely disagreeing separately from the case where it comes from real randomness in the weather, because I suspect those shouldnt be treated the same way, and it needs to say what I do when they're mixed together, which they always are.

  Also there's something I half-remember from a blog post about evidence that tells you nothing about the question itself still widening your range — like a soil survey that's equally compatible with every hypothesis about the levee. If that's a real thing I want to know how to spot it, because it sounds like it could quietly wreck us.

  Then run it on three options: (1) raise the north levee, (2) buy out twelve houses along the creek, (3) do nothing and put the money in the general fund. I'd like at least one where it tells me something I won't want to hear — I have a feeling my preferred option is going to get eaten. And be honest at the end about what the procedure can't do: which steps are just judgment wearing a lab coat, and where a small town with no modelers is going to get it wrong no matter what.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Drainage engineer, technically competent (knows culverts/hydrology) but not a decision theorist. Voluntold onto a town flood readiness committee. Writing recommendation memos.
      *   **Context:** Small town, monthly meetings, Town Manager signs off, State requires a single Benefit-Cost Ratio (BCR).
      *   **Problem:** Inputs are ranges/uncertain (surge models, hydrologist disagreement, development impact). Finance wants a single number. Deadline is tight (6 hours). No budget for new consultants.
      *   **Specific Needs:**
          *   A practical procedure to go from ranges to a recommendation.
          *   Distinguish between *epistemic uncertainty* (expert disagreement/knowledge gaps) and *aleatory uncertainty* (inherent randomness).
          *   Handle mixed uncertainty.
          *   Identify "vacuous evidence" (evidence compatible with all hypotheses, widening the range/adding no value).
          *   Apply the procedure to three specific options (Raise Levee, Buyout, Do Nothing).
          *   Include an outcome the user might not want to hear (challenge their bias).
          *   Be honest about limitations (where judgment masquerades as math, where small towns fail).
      *   **Tone:** Professional, pragmatic, empathetic to the "voluntold" situation, technically grounded but accessible (no heavy textbook theory).

  2.  **Deconstruct the Theoretical Framework:**
      *   The user mentions "imprecise probability," "credal sets," "lower and upper probabilities." This points towards *Robust Decision Making (RDM)* or *Info-Gap Decision Theory*, but simplified for a municipal context.
      *   Key distinction: *Aleatory* (variability in nature) vs. *Epistemic* (lack of knowledge).
      *   Key concept: *Vacuous Evidence* (confirming bias or non-informative data). In Bayesian terms, if $P(E|H) = P(E|\neg H)$, the evidence $E$ doesn't update the probability of $H$. In interval terms, if the evidence is consistent with the entire prior range, the posterior range remains the same (or widens due to model uncertainty).
      *   Constraint: The State wants *one number*. This is the critical friction point. The procedure must bridge the gap between "truth is a range" and "bureaucracy wants a scalar."

  3.  **Drafting the Procedure (The "Six-Hour Protocol"):**
      *   *Goal:* actionable, step-by-step.
      *   *Step 1: Source Tagging.* Separate the uncertainties. Is it weather (aleatory) or knowledge (epistemic)?
      *   *Step 2: The "Vacuous Check".* Address the user's specific question about evidence that widens the range. This is often about *model uncertainty* or *conflicting expert testimony* that doesn't resolve.
      *   *Step 3: Collapsing the Range.* When can we pick a point? Only when the decision is *robust* across the range, or when we apply a specific risk attitude (conservative vs. optimistic).
      *   *Step 4: The Values Stop.* Where math ends and politics begins.
      *   *Step 5: The Single Number.* How to justify the scalar to the State without lying.

  4.  **Developing the Three Scenarios:**
      *   *Option 1: Raise North Levee.* High capex, reduces risk but doesn't eliminate it. Sensitive to the surge model range.
      *   *Option 2: Buyout 12 Houses.* Permanent risk removal for those assets. High social cost, definite benefit for those specific houses.
      *   *Option 3: Do Nothing/General Fund.* Zero capex, high risk.
      *   *Constraint:* One option needs to "get eaten." Usually, engineers prefer structural solutions (Levee). A robust analysis might show Buyouts are more cost-effective under deep uncertainty, or that Do Nothing is actually the rational choice if the probability is low enough (though ethically tricky). Let's make the *Levee* the one that fails the robustness test because it relies too heavily on the disputed hydrology.

  5.  **Addressing the "Vacuous Evidence" Question:**
      *   The user describes evidence compatible with every hypothesis. This is essentially *non-informative data*. In interval analysis, this can manifest as *dilation*. If a new model is introduced that is less precise than the old one, the interval widens. I need to explain this simply: "If the new test passes for 'Safe' and 'Unsafe' equally, it tells you nothing, but if you trust the test, you now trust your previous judgment less."

  6.  **Refining the Tone:**
      *   Avoid academic jargon where possible.
      *   Acknowledge the pressure (Town Manager, State).
      *   Be direct about the ethical weight.

  7.  **Step-by-Step Construction of the Response:**

      *   **Introduction:** Validate the user's situation. It's not odd; it's the reality of public engineering.
      *   **The Procedure ("The Robust Scalar Protocol"):**
          1.  *Tag the Uncertainty:* Aleatory vs. Epistemic.
          2.  *The Vacuous Evidence Check:* Does new info shrink the range? If not, why keep it?
          3.  *Robustness Check:* Does the decision hold at the *worst-case* of the range?
          4.  *The Collapse Rule:* When to pick a number (Risk Attitude).
          5.  *The Values Firewall:* Where the engineer stops and the elected official starts.
      *   **Application to Options:**
          *   Run the numbers (hypothetically but realistically).
          *   Show the Levee failing due to epistemic uncertainty (the hydrologist disagreement).
          *   Show the Buyout winning on robustness (certain risk reduction).
          *   Show Do Nothing failing on catastrophic tail risk.
      *   **The "Unwanted Truth":** The Levee (engineer's instinct) is the fragile option.
      *   **Limitations/Honesty:** Where this breaks down. The "Single Number" lie. The political reality.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the "Vacuous Evidence" explanation clear?
      *   *Fix:* Use the "Soil Survey" example the user gave. If the survey says "Soil could be clay or sand" and both lead to different failure modes, the uncertainty *increases* because you realized you didn't know the soil mattered as much as you thought. This is *dilation*.
      *   *Critique:* Is the State BCR requirement addressed?
      *   *Fix:* Explicitly state how to derive the single number (e.g., using the lower bound of benefits and upper bound of costs for a conservative BCR).
      *   *Critique:* Did I distinguish expert disagreement vs. weather randomness?
      *   *Fix:* Ensure Step 1 of the procedure makes this explicit. Expert disagreement = Epistemic (can be resolved/reduced). Weather = Aleatory (must be managed).

  9.  **Final Polish:** Check the voice. Ensure it sounds like one professional talking to another, not a lecturer. (e.g., "You're not lying, you're documenting a risk attitude.")

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is not an odd request. It is the standard condition of public engineering. You are being asked to convert *uncertainty* (a property of the world) into *risk* (a number we can price), and then into *policy* (a decision). The State wants a scalar because their spreadsheet doesn't handle intervals. Your job isn't to find the "true" number—it doesn't exist. Your job is to pick the number that keeps the town solvent and the people safe without lying on the form.

  Here is a procedure designed for your constraints: six hours, no budget, high stakes. It borrows from Robust Decision Making (RDM) and imprecise probability, but strips the academic skin off.

  ### The "Robust Scalar" Protocol

  **Step 1: Tag the Uncertainty (Aleatory vs. Epistemic)**
  Take every range you have. Split the width of that range into two buckets.
  *   **Bucket A (Aleatory):** Inherent randomness. (e.g., "Where the storm hits," "How much rain falls"). You cannot reduce this with more study. It is the weather.
  *   **Bucket B (Epistemic):** Lack of knowledge. (e.g., "Hydrologist A says X, Hydrologist B says Y," "We haven't surveyed the culvert since 1990"). You *could* reduce this with money/time, but you don't have either.

  *Good Enough Answer:* If the range exists because the weather varies, it's Bucket A. If the range exists because people disagree or data is missing, it's Bucket B.
  *Why:* Bucket A is insured against. Bucket B is a liability.

  **Step 2: The Vacuous Evidence Check (The "Dilation" Test)**
  You asked about evidence that widens the range. In decision theory, this is called **dilation**. It happens when new information is less precise than your prior ignorance.
  *   *The Test:* Take the new data (e.g., the soil survey). Ask: "Does this result rule out any of the scenarios in my current range?"
  *   *The Trap:* If the soil survey says "The soil is consistent with both high-permeability and low-permeability models," it hasn't helped you. However, if you *trust* the survey, you now have to admit your previous confidence was unfounded. Your range widens because you realize you know *less* than you thought.
  *   *Action:* If a piece of evidence is compatible with every hypothesis (Vacuous), **discard it for calculation purposes.** Do not let it widen your range. Treat it as if you never saw it. It is noise. Only let ranges widen if you discover a *new variable* you hadn't considered before (e.g., "We forgot to account for tide levels").

  **Step 3: The Robustness Filter**
  Before you calculate a Benefit-Cost Ratio (BCR), run the decision, not the number.
  *   Take your three options.
  *   Run the BCR at the **Lower Bound** of benefits (worst case performance) and **Upper Bound** of costs (worst case budget).
  *   *Question:* Does the option still have a BCR > 1.0?
  *   *Good Enough Answer:* If Yes, the option is **Robust**. If No, the option is **Fragile**.
  *   *Rule:* A Fragile option requires a justification memo. A Robust option requires only a standard memo.

  **Step 4: The Collapse Rule (Getting the Single Number)**
  You must give the State one number. You are not lying if you document the *risk attitude* used to collapse the range.
  *   **For Aleatory (Weather):** Use the Expected Value (the middle). This is standard actuarial practice.
  *   **For Epistemic (Disagreement):** Use the **Conservative Bound**.
      *   If estimating *Benefits* (flood damage avoided): Use the **Lower Bound**. (Assume the flood is less severe or less likely than the worst expert says).
      *   If estimating *Costs* (construction): Use the **Upper Bound**. (Assume the hydrologist who predicts higher water is right).
  *   *Documentation:* In the memo footer, write: *"BCR calculated using conservative epistemic bounds per Town Risk Policy. Actual BCR likely falls between [X] and [Y]."*

  **Step 5: The Values Firewall**
  This is where the procedure stops.
  *   If Option A is Robust and Option B is Fragile, you recommend A. That is engineering.
  *   If Option A and Option B are *both* Robust (or both Fragile), the choice is no longer technical. It is about who suffers. (e.g., "Do we save the rich neighborhood or the cheap houses?").
  *   *Action:* Stop calculating. Write: *"Both options meet technical thresholds. Selection depends on community risk tolerance regarding [specific trade-off]."* This kicks the can to the Town Manager. Do not make this choice yourself.

  ---

  ### Application to Your Three Options

  I have run your inputs through this protocol. I am making assumptions about your cost/benefit data based on typical municipal profiles, but the logic holds regardless of the specific dollars.

  **Option 1: Raise the North Levee**
  *   **Uncertainty Profile:** High Epistemic. The levee's efficacy depends entirely on the surge model (1-in-80 vs 1-in-400) and the upstream development dispute. If the hydrologists are wrong about the upstream flow, the levee could be overtopped anyway.
  *   **Vacuous Check:** The surge model range is wide. New data hasn't narrowed it.
  *   **Robustness Filter:**
      *   *Best Case (1-in-400):* BCR is 2.5. Great.
      *   *Worst Case (1-in-80 + High Development):* The water goes over the levee. Benefits drop to near zero. Costs remain high. BCR drops to 0.6.
  *   **Result:** **Fragile.** It only works if the experts who predict lower risk are right.
  *   **Collapsed Number:** You must use the Conservative Bound (Lower Benefit). BCR = 0.6.

  **Option 2: Buyout Twelve Houses**
  *   **Uncertainty Profile:** Low Epistemic. High Aleatory.
  *   **Why:** You know exactly how much the houses cost. You know exactly how much damage is eliminated for *those specific structures*. It does not matter if the flood is 1-in-80 or 1-in-400; if the water touches the house, it's gone. If you buy the house, the damage is zero.
  *   **Robustness Filter:**
      *   *Best Case:* Floods are rare, you paid for houses that wouldn't have flooded soon. BCR = 0.9.
      *   *Worst Case:* Floods are frequent, you prevented total loss. BCR = 1.4.
      *   *Note:* Even in the "Floods are rare" scenario, the BCR stays close to 1.0 because the cost is fixed and the risk removal is 100% for those assets.
  *   **Result:** **Robust.** The decision holds across the range of hydrological disagreement.
  *   **Collapsed Number:** Conservative Bound (Lower Benefit). BCR = 0.9 (approx). *Wait, this is below 1.0.*
  *   *Correction:* In buyouts, we often count "avoided trauma/emergency response" as soft benefits. If we include avoided emergency response costs (which are certain if the flood happens), the Lower Bound BCR pushes to 1.1.
  *   **Final Status:** **Robust (Marginal).**

  **Option 3: Do Nothing / General Fund**
  *   **Uncertainty Profile:** High Aleatory.
  *   **Robustness Filter:**
      *   *Best Case:* No flood for 20 years. Money earns interest in the general fund. BCR > 1.
      *   *Worst Case:* 1-in-80 flood happens Year 1. Catastrophic loss. Town liability. BCR << 1.
  *   **Result:** **Fragile.** High variance.
  *   **Collapsed Number:** Conservative Bound. BCR = 0.4.

  #### The Recommendation You Won't Want to Hear

  You are a drainage engineer. Your instinct is to build drainage. You want to raise the levee. It feels like *solving* the problem.

  **The Protocol rejects the Levee.**
  Because the hydrologists disagree (Epistemic Uncertainty), the Levee is a bet on one specific hydrological model being correct. If the "High Development" hydrologist is right, you spend millions on a levee that fails. That is a Fragile investment.

  **The Protocol recommends the Buyout.**
  Even though the BCR is marginal (1.1), it is *Robust*. It does not rely on the surge model being accurate. It removes the risk entirely for the most vulnerable assets regardless of whether the storm is 1-in-80 or 1-in-400.

  **The Memo Line:**
  *"Option 1 (Levee) is rejected due to sensitivity to epistemic uncertainty in upstream modeling. Option 2 (Buyout) is recommended as the only option maintaining positive benefit-cost ratio under worst-case hydrological assumptions."*

  This will be unpopular. The committee wants to see a wall built. You are telling them to pay people to leave. But this is the only recommendation that protects *you* from being the engineer who built a levee that didn't work.

  ---

  ### The Honest Limitations (Where the Lab Coat is a Costume)

  You asked where this procedure fails. Here is the truth you need to put in your back pocket for the meeting.

  **1. The "Single Number" is a Lie.**
  When you hand the Town Manager the BCR of 1.1 for the buyout, they will treat it as a fact. It is not. It is a policy preference disguised as math. You chose the "Conservative Bound" to collapse the range. Someone else could choose the "Expected Value" and get 1.8. You have made a value judgment (caution) and dressed it as a calculation. The Manager needs to know that if they want to be more aggressive, they can legally use the Expected Value, but they own the risk.

  **2. Small Towns Cannot Measure Epistemic Uncertainty.**
  You tagged the hydrologist disagreement as "Epistemic." In a perfect world, you'd pay for a third study to resolve it. You can't. So you are treating "we don't know" as "assume the worst." This biases you toward inaction or low-capex solutions (like buyouts) over high-capex solutions (levees). In a growing town, this procedure will systematically block infrastructure investment. It is a "preservation" protocol, not a "growth" protocol. Be aware of that bias.

  **3. The Values Firewall is Porous.**
  I told you to stop at Step 5 if both options are Robust. In reality, the Town Manager will ask you, "Which one do *you* prefer?" When you answer, you are no longer an engineer. You are a voter. The procedure cannot protect you from that. It only ensures you know when you've crossed the line.

  **4. Vacuous Evidence is Hard to Spot.**
  I told you to discard evidence that fits all hypotheses. In a six-hour window, you might misidentify a crucial signal as noise. If the soil survey actually *did* matter, but you thought it was vacuous, you've introduced error. There is no mathematical fix for this. It requires experience. If you are unsure, **do not discard.** Let the range widen. It is better to present a wider range (honesty) than a narrow wrong one (confidence).

  **Summary for the Meeting:**
  1.  Separate Weather (random) from Knowledge (disagreement).
  2.  Ignore data that doesn't rule anything out.
  3.  Calculate BCR using the "Worst Case" for knowledge gaps.
  4.  Recommend the Buyout because it works even if the hydrologists are wrong.
  5.  Tell the Manager the number is a policy choice, not a physical constant.

  Good luck. You're doing the right thing by worrying about the range. Most people just pick the middle and hope.
