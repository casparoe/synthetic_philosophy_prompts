  The coin lands but you do not see it.

  ***

  **Note**

  The setups here are bookkeeping: given the rules you described, causal decision theory (CDT) refuses both payments, evidential decision theory (EDT) pays both, and functionalist approaches (like FDT or UDT) pay the mugging but refuse the blackmail. That mapping is stable within the literature. What is contested is whether the functionalist verdict is *correct*. Critics argue that counterfactuals on your own output are incoherent, that a simulation is not you, or that paying the mugging is simply irrational loss-making in the actual branch. Proponents argue that rationality is about controlling the logical output of your algorithm, wherever it is instantiated.

  This poem quietly takes the functionalist side. It treats the decision as a single output occurring in multiple places (the predictor's head, the blackmailer's logic) rather than a local physical act. It assumes the "copy" is relevant to your payoff in the mugging but treats the correlation in the blackmail as non-causal news. If you hold that only physical causality matters, the poem's logic will feel like a category error; if you hold that decision theory is about optimizing function outputs, it should read as a description of the constraint.
