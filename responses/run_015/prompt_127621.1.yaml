  2.  **Drafting Section 1: Agreed Claims:**
      *   *Goal:* Find common ground despite deep theoretical divergence.
      *   *Claim (i) Weber's Assertion:* Both must agree on what Weber *said*, even if they disagree on whether he was *right*. Weber argued ascetic Protestantism influenced the spirit of capitalism.
      *   *Claim (ii) Formal Conditions of Cause:* Need a neutral definition of causation in historical sociology (e.g., counterfactual dependence, regularity, or mechanism). Let's go with counterfactual dependence + mechanism.
      *   *Claim (iii) Historical Correlation:* Both must admit the empirical pattern exists (Calvinist regions -> early capitalism), even if they explain it differently.
      *   *Claim (iv) Subjective vs. Structural:* Acknowledge the methodological distinction (Verstehen vs. Structural analysis).
      *   *Drafting thought:* Keep it dry and precise. Avoid loading the language with "merely" or "genuinely."

  3.  **Drafting Section 2: Disagreements Table:**
      *   *Goal:* Clearly delineate the conflict without caricature.
      *   *Row 1 (Elective Affinity):* VC sees it as a mechanism (meaning drives action). SR sees it as narrative correlation (epiphenomenal).
      *   *Row 2 (Category Mistake/Software):* VC rejects the analogy (meaning is real force). SR accepts the analogy (values are code, institutions are hardware).
      *   *Row 3 (Testability):* VC believes meaning can be tested (via texts, diaries, consistency). SR believes only structural outcomes can be tested (predictions of behavior based on incentives).
      *   *Drafting thought:* Ensure the "Software" analogy row aligns with Section 5 later. The prompt asks for this specific analogy in the table row.

  4.  **Drafting Section 3: The Cruxes:**
      *   *Goal:* Identify pivot points where evidence could change minds.
      *   *Crux (a) Efficient Cause/Reducibility:* Can values cause things without being material incentives?
          *   *Case:* Huguenot refugees in Prussia vs. Native Prussians. Same laws, different culture.
