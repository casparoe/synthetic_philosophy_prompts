          *   *Predictions:* VC says behavior changes *after* doctrinal shift even if incentives same. SR says behavior changes only when material risk/reward changes.
      *   *Crux (c) Explanatory Power:* Does "glorifying God" add anything over "expected returns"?
          *   *Case:* Economic downturns. Do believers keep working when returns are low?
          *   *Predictions:* VC says yes (duty). SR says no (they were hedging against future risk or had locked-in capital).
      *   *Drafting thought:* Make sure the predictions are distinct and falsifiable.

  5.  **Drafting Section 4: Analogy Assessment:**
