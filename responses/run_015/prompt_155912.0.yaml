answer: |-
  # DIAGNOSING YOUR CENTIPEDE COMMITMENTS
  **Seminar Handout | Rational Choice & Games**

  **The Stalemate:** We agree Backward Induction (BI) is valid *given its premises*. We agree real players Pass. This instrument diagnoses which premise you are willing to drop, or which model you are actually using.

  ### PART 1: THE DIAGNOSTIC (10 Questions)
  *Answer **Y** (Yes) or **N** (No) based on your intuitive commitment.*

  **A. Concrete Variants**
  1.  **Scale:** If the game had **100 nodes** (not 6), would you Pass at Node 1?
  2.  **Clone:** If the opponent is your **exact psychological duplicate**, do you Pass at Node 1?
  3.  **History:** If you saw this opponent **Pass in a previous game**, do you Pass at Node 1?
  4.  **Talk:** If the opponent sends a **cost-free message** ("I will Pass"), do you Pass at Node 1?
  5.  **Sensitivity:** If the pot grew **slower** (smaller increments), would you Take earlier?

  **B. The Node 4 Crux (Off-Path Reasoning)**
  *Imagine you are actually handed the move at Node 4. BI says this node is unreachable.*
  6.  **Validity:** Does the BI logic still bind *your* choice at Node 4?
  7.  **Opponent:** At Node 4, do you believe the opponent is still maximizing their *own* payoff (BI-rational)?
  8.  **Action:** At Node 4, do you **Pass** (chase the larger pot)?
  9.  **Explanation:** Did the opponent's earlier Pass signal a **different type** (altruistic) or a **mistake** (tremble)? *(Type / Mistake)*

  **C. Foundations**
  10. **Agency:** Is the unit of rational agency the **Individual** or the **Team**?

  ---

  ### PART 2: THE SCORING KEY (Map Your Profile)
  *Find the pattern that matches your answers. Read the "Position" and the "Cost."*

  | IF YOUR ANSWERS MATCH... | THEN YOU HOLD... | THE UNCOMFORTABLE TRUTH (The Cost) |
  | :--- | :--- | :--- |
  | **Q1:N, Q2:N, Q6:Y, Q8:N**<br>(BI holds everywhere; Take at 1 & 4) | **Hardline Backward Induction**<br>*(Standard Nash/BI)* | You leave money on the table in real life. You must claim empirical players are simply irrational. |
  | **Q1:Y**<br>(Scale changes behavior) | **Bounded Rationality**<br>*(Level-k / Cognitive Limits)* | You admit logic is not action-guiding when recursion gets deep. Rationality is resource-dependent. |
  | **Q2:Y, Q10:Team**<br>(Clone triggers cooperation) | **Team Reasoning**<br>*(We-Intentionality)* | You violate standard individualism. "Rationality" requires maximizing joint payoff, not individual. |
  | **Q3:Y, Q9:Type**<br>(History matters; Opponent is 'nice') | **Incomplete Information**<br>*(Kreps/Wilson/Trembles)* | You rely on a "tremble" or altruism probability that might not exist. The model is misspecified without it. |
  | **Q6:N, Q8:Y, Q9:Mistake**<br>(BI breaks off-path; Update beliefs) | **Epistemic Revision**<br>*(Aumann / Common Belief Drop)* | You abandon Common Knowledge of Rationality mid-game. The premises were false from the start. |
  | **Q6:Y, Q8:Y**<br>(BI binds, but you Pass anyway) | **EMPTY CELL** | **Incoherent.** If BI logic binds (Q6:Y) and payoffs are known, Passing (Q8:Y) is a contradiction. |

  ---

  ### PART 3: NOTES ON OVERLAP & AMBIGUITY

  **⚠ The "Off-Path" Convergence:**
  **Incomplete Information** and **Epistemic Revision** often prescribe the *same action* (Pass at Node 4).
  *   **Distinction:** Incomplete Info says "I always knew there was a 1% chance they were nice." Revision says "Reaching Node 4 proved Common Knowledge of Rationality was false."
  *   **Check:** If you answered **Q9: Type**, you lean Incomplete Info. If **Q9: Mistake/Logic**, you lean Revision.

  **⚠ The "Clone" Ambiguity:**
  Answering **Q2:Y** (Pass with Clone) can indicate **Team Reasoning** *or* **Evidential Decision Theory** (my choice is evidence of theirs).
  *   **Distinction:** Team Reasoning changes the *goal* (Joint Payoff). Evidential Theory keeps the *goal* (Individual) but changes the *causal model*.

  **⚠ The Empty Cell:**
  The cell (**Q6:Y, Q8:Y**) represents believing the proof is valid but acting against it without changing information. This is usually dismissed as **akrasia** (weakness of will) or incoherence in a rational choice model.

  ---
