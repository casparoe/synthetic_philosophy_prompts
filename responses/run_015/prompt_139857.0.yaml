answer: |-
  You have hit the nail on the head. Your intuition about the two families of accounts (Selected-Effect vs. Causal-Role) is exactly where the professional philosophy of biology has been stuck for the last forty years. The forum poster didn't just answer your question; they invoked a slogan to bypass a genuine philosophical debate and enforce one specific side of it as dogma.

  Dobzhansky's sentence is a Rorschach test. Depending on how you parse "makes sense," it ranges from a harmless reminder to a false metaphysical claim.

  Here is the menu of precise claims hidden behind that slogan, graded by plausibility, with your test cases applied to each.

  ### 1. The Methodological Heuristic
  **The Claim:** "If you want to understand why a biological trait exists, looking at its evolutionary history is the most reliable investigative tool we have."
  *   **Verdict:** **Platitude / Defensible.** Almost everyone accepts this. It's advice on how to do science, not a claim about what exists.
  *   **The Gull:** "We can't be sure if that wing shape is useful yet because we haven't seen if it survives selection. Let's wait and see."
  *   **The Test Cases:**
      *   *Synthetic Cell:* This heuristic fails here. You look to the engineering logs, not evolution.
      *   *Dad's Stent:* Medicine doesn't use evolution to explain why the stent works; it uses physics and physiology.
  *   **Does it justify "Come back in 50 generations"?** No. This reading suggests we *investigate* via history, not that function *ceases to exist* without it.

  ### 2. The "Selected-Effect" Ontology (The Forum Poster's View)
  **The Claim:** "The word 'function' in biology *strictly means* 'the effect for which a trait was historically selected.' If a trait has no history of selection, it literally has no function, only effects."
  *   **Verdict:** **Substantive but Contested.** This is the dominant view in evolutionary biology (associated with philosophers like Ruth Millikan and Larry Wright), but it is fiercely debated by physiologists and philosophers of medicine.
  *   **The Gull:** "That wing shape has **no function**. It is a mutation. It has aerodynamic *effects*, but until it is selected for, calling it a 'function' is category error."
  *   **The Test Cases:**
      *   *Synthetic Cell:* The parts have functions (because their ancestors did), but the specific assembly has no biological function yet. It is an artifact.
      *   *Exaptation (Feathers):* If feathers evolved for warmth and are now used for flight, their *true function* is warmth. Flight is just a current use. (This feels counter-intuitive to many).
      *   *Dad's Stent:* The stent has **no biological function**. It is a piece of metal. The artery has a function, the stent is a prop.
  *   **Does it justify "Come back in 50 generations"?** **Yes.** This is the only reading that earns that remark. It asserts that function is constituted by history. No history = no function.

  ### 3. The Causal-Role System View
  **The Claim:** "A trait's function is simply what it currently contributes to the capacity of the containing system (the organism)."
  *   **Verdict:** **Substantive and Defensible.** This is the standard view in physiology, ecology, and medicine (associated with Robert Cummins).
  *   **The Gull:** "If that wing shape improves glide efficiency *now*, it has a function *now*, regardless of its history. It contributes to the bird's survival system."
  *   **The Test Cases:**
      *   *Synthetic Cell:* If it replicates, its parts have functions. History is irrelevant; current organization matters.
      *   *Exaptation:* The function of feathers is flight (if that's what they are doing now). History is interesting context, not definitional.
      *   *Dad's Stent:* The stent **does** have a function in the system: it maintains blood flow. Medicine treats it as functional parts of a patient.
  *   **Does it justify "Come back in 50 generations"?** **No.** It explicitly rejects it.

  ### 4. The Constraint Claim (Phylogenetic Inertia)
  **The Claim:** "You cannot understand the current limits or possibilities of an organism without knowing its ancestry, because evolution works by tinkering, not engineering from scratch."
  *   **Verdict:** **Defensible.** This is about structural constraints, not necessarily "function."
  *   **The Gull:** "That wing shape is weird because gulls are constrained by their ancestral wing blueprint. It might not be optimal, just 'possible for a gull'."
  *   **The Test Cases:**
      *   *Synthetic Cell:* Not applicable (engineered from scratch).
      *   *Dad's Stent:* The artery's reaction to the stent is constrained by human biology, but the stent itself is not.
  *   **Does it justify "Come back in 50 generations"?** No. This explains *why* the bird looks the way it does, not whether the trait is functional.

  ### 5. The Strong Reductionist Claim
  **The Claim:** "All biological explanations must ultimately be reduced to evolutionary explanations. Physiology, ecology, and medicine are just shorthand for evolutionary stories."
  *   **Verdict:** **False / Just Plain Wrong.** This is a form of "pan-adaptationism" that most working scientists reject in practice. It makes doing actual science impossible (you don't need evolutionary theory to set a broken bone).
  *   **The Gull:** "Talking about aerodynamics is useless; only talking about gene frequencies matters."
  *   **The Test Cases:**
      *   *Synthetic Cell:* Biology cannot explain this at all, which suggests biology is incomplete.
      *   *Dad's Stent:* Cardiology is invalid unless framed as evolutionary history.
  *   **Does it justify "Come back in 50 generations"?** Yes, but it's a dogmatic overreach that would get you laughed out of a physiology department.

  ---

  ### Analysis of Your Test Cases

  Your test cases are excellent because they act as "philosophical stress tests" that break the weaker readings.

  **1. The Synthetic Cell**
  This is the nuclear option for the **Selected-Effect (SE)** view. If we build a living cell from non-living parts, the SE theorist must say it has no functions until it evolves in the wild. This seems absurd to anyone working in synthetic biology. The **Causal-Role (CR)** view handles this easily: if it metabolizes, that's its function.
  *   *Implication:* If you accept the SE view (the forum poster's view), you have to admit that a perfectly working synthetic organism is "functionless" until it survives a few generations.

  **2. The Exaptation (Feathers for Flight)**
  This highlights the difference between *origin* and *utility*.
  *   **SE View:** The function of wings is *thermoregulation* (original selection). Flight is a "side effect."
  *   **CR View:** The function of wings is *flight* (current contribution).
  *   *Implication:* The SE view preserves the historical truth but loses the practical utility of the word "function." The CR view preserves utility but loses the historical distinction between "adapted for" and "currently useful."

  **3. Dad's Stent**
  This is the strongest argument against the slogan as a universal rule.
  *   **SE View:** The stent has no function. It is not evolved.
  *   **CR View:** The stent has a function (keeping the artery open).
  *   *Implication:* Medicine relies entirely on the Causal-Role view. If a cardiologist told your dad, "That stent has no function because it wasn't selected for," you would fire them. This proves that "biology" (including medicine) *does* make sense without evolution in many practical contexts.

  ---

  ### The Verdict on the Forum Thread

  **Which reading was the poster using?**
  They were using **Claim #2 (The Selected-Effect Ontology)**. They were making a metaphysical claim: *Function is constituted by history.* Therefore, a novel mutation in a single individual cannot, by definition, have a function yet. It is merely a variant.

  **Did they earn the "Come back in 50 generations"?**
  Only if you accept Claim #2 as the *only* valid definition of function.
  *   **If you are an evolutionary biologist** asking "Is this an adaptation?", the answer is "Come back in 50 generations." (Because adaptation requires selection history).
  *   **If you are an ecologist or physiologist** asking "Does this help the bird survive right now?", the answer is "We can measure that today."

  **The Sneaky Move:**
  You were right. They used the slogan to conflate "Is this an adaptation?" (which requires history) with "Does this have a function?" (which can be current). By invoking Dobzhansky, they implied that asking about current utility is "not biology" unless it's framed as evolutionary history. That is a territorial move, not a logical one.

  ### What Do Biologists Actually Mean?

  When working biologists repeat Dobzhansky's line, they are usually aiming for a mix of **Claim #1 (Heuristic)** and **Claim #4 (Constraint)**, but they often slide into **Claim #2 (SE Ontology)** without realizing it.

  *   **The Pragmatic Meaning:** "Don't assume perfect design. Don't assume a trait is useful just because it exists. Check the history."
  *   **The Dogmatic Meaning:** "If you aren't talking about selection, you aren't doing real biology."

  **My Guess:** The forum poster was feeling protective of the evolutionary framework. In birding communities, there is often a tension between "naturalists" (who observe what birds *do*) and "evolutionary enthusiasts" (who care about *why* they are there). The poster was likely trying to enforce the idea that **utility does not equal adaptation.**

  They are correct that utility $\neq$ adaptation.
  They are incorrect that utility $\neq$ function (under the Causal-Role definition).

  ### Summary for Your Next Reply

  If you want to reply without starting a war, you might say something like:

  > "I've been reading up on this, and it looks like there are two definitions of 'function' in play. One says function is what a trait was *selected for* in the past (Selected-Effect), and one says function is what a trait *does* for the organism now (Causal-Role).
  >
  > If we use the first definition, you're right: a new mutation can't have a function until it's been selected. But if we use the second definition (which physiologists and doctors use), the feather shape can have a function immediately if it changes aerodynamics, even if it's not an 'adaptation' yet.
  >
  > Dobzhansky's quote is definitely true for explaining why the trait *exists* in the population, but does it rule out analyzing what the trait *does* in the individual? I'm asking if we can separate 'current utility' from 'historical adaptation' without leaving biology behind."

  This acknowledges their expertise (adaptation requires history) while holding your ground (current utility is a valid biological question). It exposes the ambiguity in the slogan without calling them dogmatic.

  **Final Verdict:** Your suspicion was correct. The slogan was being used to smuggle in a contested philosophical definition of "function" as if it were settled fact. The "50 generations" line is valid only for establishing *adaptation*, not for establishing *current causal role*.
