      *   **Current Position:** Hard Finitism (rejects actual infinities, accepts potential infinities). Views Cantorian sets as formal fictions/bookkeeping, not ontological reality. Sees Hilbert's Hotel as a *reductio*. Holds the Part-Whole Principle (whole > proper part) as a basic ontological condition.
      *   **Goal:** Wants genuine defeaters/challenges, not appeals to authority or utility. Wants to know if finitism can recover necessary analysis, if physics requires actual infinity, and about the status of the Part-Whole Principle.
      *   **Specific Questions:**
          1.  What counts against hard finitism? (Formal results? Physical phenomena?)
