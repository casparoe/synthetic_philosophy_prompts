answer: |-
  ### Teaching Plan: The Conceptual Limits of Development Causation

  #### 1. Dependency Order of Conceptual Pieces

  You must introduce the conceptual distinctions in the following strict sequence:

  1.  **Correlation (The Humean Baseline):** Establish that historical data offers only constant conjunctions (Hume), not necessary connections.
  2.  **Intervention (The Manipulability Requirement):** Define causation not as observation, but as the result of a hypothetical manipulation of one variable while holding others fixed.
  3.  **Historical Counterfactual (The Feasibility Constraint):** Argue that in macro-history, the "holding fixed" condition required by intervention is structurally impossible due to entanglement.

  **Justification for Order:**
  Reversing this order collapses the argument into metaphysics or triviality. If you begin with **Historical Counterfactuals**, philosophy students will treat them as logical possibilities (modal logic) rather than methodological constraints, missing the point that the *world* prevents the counterfactual, not logic. If you begin with **Intervention**, students will ask "Intervene on what?" without first seeing the correlational knot that makes the variables indistinguishable. You must first show them the data is merely correlational (Hume), then show them what causation *requires* (Intervention), and finally demonstrate why history *forbids* that requirement (Counterfactual Impossibility).

  #### 2. The Carrying Example: North vs. South Italy

  Do not use a colonial border case (like Hispaniola or Korea), as these are typically deployed to *solve* the identification problem. You must use a case where the "solution" fails.

  **Case:** **The Medieval Divergence of Northern and Southern Italy.**

  **Required Properties:**
  *   **Similar Geography:** Both regions share the Mediterranean climate, access to sea trade, and agricultural potential (controlling for geography).
  *   **Shared Cultural Inheritance:** Both share Roman legal heritage, Catholicism, and the Italian language (controlling for deep culture).
  *   **Divergent Institutional Paths:** The North developed communal city-states (horizontal trust); the South developed a Norman feudal monarchy (vertical hierarchy).
  *   **What It Must Lack:** It must lack any **clean exogenous shock**. The institutional divergence was not caused by an external event (like a random border draw) but emerged endogenously from local power struggles. Consequently, the "institution" (city-state) cannot be separated from the "culture" (civicness) that sustained it.

  **Function in Argument:** This example demonstrates that the "treatment" (Institutions) and the "background" (Culture/Geography) co-evolved. You cannot imagine a counterfactual South Italy with Northern Institutions *without* imagining a different history that also changes the Culture.

  #### 3. Misconception Mapping and Interception Points

  Students will attempt to resolve the entanglement using standard philosophical or economic intuitions. You must intercept these at specific stages:

  *   **Misconception 1: Geography as Deterministic Climate.**
      *   *The Error:* Students will treat geography as a static control variable (e.g., "latitude" or "rainfall").
      *   *Interception Point:* **During Correlation.**
      *   *Correction:* Clarify that in development economics, geography is an *interactive constraint* (e.g., disease environments that shape labor institutions), not just a backdrop. If geography shapes institutions, it cannot be held fixed while varying institutions.
  *   **Misconception 2: Institutions as Freely Chosen Rules.**
      *   *The Error:* Students will view institutions as legislation that can be enacted at will (e.g., "Just pass a property law").
      *   *Interception Point:* **During Intervention.**
      *   *Correction:* Define institutions as **path-dependent equilibria**. You cannot "intervene" to change an equilibrium without shifting the underlying beliefs and expectations (culture) that sustain it. The intervention is not feasible.
  *   **Misconception 3: Natural Experiments Disentangle Variables.**
      *   *The Error:* Students will suggest that colonial borders or random shocks (Natural Experiments) solve the problem by isolating institutions from culture.
      *   *Interception Point:* **During Historical Counterfactual.**
      *   *Correction:* Show that even in "natural experiments," the *survival* of the institution depends on the cultural fit. A border may impose an institution, but if the culture rejects it, the institution reverts or becomes nominal. The variables re-entangle over time.

  #### 4. Check-for-Understanding Question

  Pose this question at the conclusion of the session to distinguish structural understanding from mere skepticism:

  > "If an economist claims that the question of wealth is 'empirically open' and requires only a 'better instrument' to isolate the effect of institutions, what specific assumption are they making about the relationship between institutions and culture that this session argues is historically false?"

  *   **Correct Grasp:** The student answers that the economist assumes **separability**—that institutions can vary independently of culture (orthogonality). They recognize the argument is that this independence is structurally impossible in historical time, not just statistically difficult.
  *   **Incorrect Grasp:** The student answers that economists "don't have enough data yet" or "disagree on the theory." This indicates they view the problem as empirical noise rather than conceptual entanglement.

  #### 5. Technical Apparatus to Name and Set Aside

  **Apparatus:** **The Potential Outcomes Framework (Rubin Causal Model).**

  *   **Characterization:** Briefly describe this as the standard econometric definition of causation, where a causal effect is the difference between an outcome observed under treatment ($Y_i(1)$) and the outcome observed under control ($Y_i(0)$) for the same unit.
  *   **Justification for Exclusion:** Explicitly state that you are setting this notation aside because it **presupposes the possibility of the counterfactual.** The framework assumes that $Y_i(0)$ is a well-defined quantity that *could* have been observed. Your philosophical argument is that in macro-historical cases, $Y_i(0)$ is not just unobserved, but **undefined**, because the "unit" (the nation) cannot exist in the same state with a different institutional history. Using the notation would grant the economist's premise (that the counterfactual exists) before the philosophical debate has begun.
