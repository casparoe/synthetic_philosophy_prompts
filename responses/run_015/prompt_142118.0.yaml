answer: |-
  ### Specification for a Theory of Generational Kinds

  To function for both the empirical researcher and the metaphysician, a theory of generational cohorts must satisfy the following requirements. Each includes the motivating problem, the specific demand, and the justification for why this is a necessary condition rather than a theoretical preference.

  #### 1. The Identification Condition (Addressing the APC Problem)
  *   **Motivation:** Age, Period, and Cohort are linearly dependent ($Cohort = Period - Age$). In any linear model, an infinite number of combinations of these three parameters can produce the exact same fit.
  *   **Requirement:** The theory must specify a substantive, non-statistical constraint (e.g., assuming non-linear age effects, or identifying specific historical shocks) that breaks the collinearity. It must explain why a observed regularity is attributed to *cohort* rather than *age* or *period*.
  *   **Why a Requirement:** Without this constraint, "cohort effect" is mathematically indistinguishable from a linear age trend. For the researcher, the variable is unidentified garbage; for the metaphysician, the referent is indeterminate.

  #### 2. The Boundary Justification Condition (Addressing Boundary Arbitrariness)
  *   **Motivation:** Cut-off years (e.g., 1981 vs. 1980) are often revised by think tanks or marketers. If kinds are real, their boundaries should not shift with editorial policy.
  *   **Requirement:** The theory must provide a principled basis for start and end dates (e.g., the closure of a specific historical opportunity structure) and specify whether the boundary is crisp or fuzzy. If fuzzy, it must provide a membership function rather than a binary switch.
  *   **Why a Requirement:** Arbitrary boundaries indicate a labeling convention, not a natural division. A real kind must have boundaries fixed by the world (or the mechanism), not by the classifier's convenience.

  #### 3. The Scale Independence Condition (Addressing Granularity)
  *   **Motivation:** Outcomes vary at different time scales. Income might cluster by 5-year bands; cultural memory by 20-year bands.
  *   **Requirement:** The theory must justify the temporal width of the cohort based on the *generating mechanism* (e.g., the duration of a socialization window), not the *outcome variable* being predicted.
  *   **Why a Requirement:** If the width of the kind changes depending on what you are trying to explain, the kind is a modeling artifact, not an ontological unit.

  #### 4. The Covariance Threshold (Addressing Effect Size)
  *   **Motivation:** Within-cohort variance usually dwarfs between-cohort variance.
  *   **Requirement:** The theory must define the minimum level of internal homogeneity or between-group distinctiveness required for kindhood. It must distinguish "weak kind" from "statistical noise."
  *   **Why a Requirement:** If members share no properties more than they share with non-members, the category fails to carve nature at its joints. It must support inductive inference better than chance.

  #### 5. The Extension Fixing Condition (Addressing Portability)
  *   **Motivation:** A "Millennial" in the US faces different conditions than one in rural India.
  *   **Requirement:** The theory must state whether extension is fixed by calendar dates, shared causal history, or self-identification, and provide a rule for resolving conflicts between these criteria across national contexts.
  *   **Why a Requirement:** A kind that fractures upon crossing borders lacks the stability required for general social science. The metaphysician needs to know what fixes the reference of the term.

  #### 6. The Reflexivity Condition (Addressing Looping)
  *   **Motivation:** People change behavior when labeled.
  *   **Requirement:** The theory must account for how the classification affects the classified. It must specify whether this feedback stabilizes the kind (entrenchment) or makes it inherently unstable (moving target), and whether the kind exists prior to the label.
  *   **Why a Requirement:** Human kinds are interactive. A theory that ignores this fails to describe the object; a theory that treats the feedback as fatal to reality fails to describe social ontology.

  #### 7. The Causal Autonomy Condition (Addressing Causal Role)
  *   **Motivation:** "Generation" may just be a proxy for "entered labor market during recession."
  *   **Requirement:** The theory must state whether 'generation' refers to the underlying exposures (recessions, tech) or is a distinct causal force. If it is a proxy, it must explain why the proxy retains explanatory power when the underlying exposures are controlled for.
  *   **Why a Requirement:** If the variable drops out of the model when mechanisms are added, it is causally inert. For the researcher, it is redundant; for the metaphysician, it is not a fundamental kind.

  #### 8. The Error Possibility Condition (Addressing Membership Disagreement)
  *   **Motivation:** People dispute their own generation.
  *   **Requirement:** The theory must allow for the possibility of being wrong about one's cohort membership.
  *   **Why a Requirement:** If membership is purely self-ascribed, there is no fact of the matter to be wrong about. Real kinds admit of epistemic error regarding membership.

  #### 9. The Persistence Condition (Added Case: Durability)
  *   **Motivation:** Cohort effects are often claimed to be "imprinting" effects that last a lifetime, distinguishing them from period effects which fade.
  *   **Requirement:** The theory must specify the expected temporal duration of the cohort effect (e.g., does it decay after 10 years?).
  *   **Why a Requirement:** Without a persistence claim, a cohort effect is indistinguishable from a temporary period shock affecting a specific age group.

  ---

  ### Evaluation of Requirements

  **Non-Negotiable for the Empirical Researcher:**
  *   **Identification Condition:** Without a solution to APC, the variable cannot be estimated.
  *   **Causal Autonomy:** If the variable is redundant to controls, it should not be in the model.
  *   **Scale Independence:** If the bin width is arbitrary, the coefficient is uninterpretable.

  **Non-Negotiable for the Metaphysician:**
  *   **Error Possibility:** Essential for distinguishing realism from nominalism.
  *   **Extension Fixing:** Essential for determining reference and cross-context identity.
  *   **Reflexivity:** Essential for accurate social ontology (interactive kinds).

  **Prejudices Imported from the Debate:**
  *   **Sharp Boundaries (from Boundary Justification):** Requiring crisp edges is a prejudice. Social kinds can be fuzzy (family resemblance) provided the fuzziness is principled, not arbitrary.
  *   **Large Effect Size (from Covariance Threshold):** Requiring high variance explained is a prejudice. A kind can be real but weak (e.g., a rare genetic marker). The requirement is *significant* covariance, not *dominant* covariance.

  **Incompatible Requirements:**
  *   **Real-Kind Status vs. Reflexivity:** If the kind is "real" in a mind-independent sense, it should not change merely because we label it. If it loops, its properties are mind-dependent. A theory can hold both only by adopting a dynamic ontology where the "reality" includes the feedback loop, which strains traditional realism.
  *   **Causal Autonomy vs. Derivative Nature:** If generations are real *because* of shared exposures (recessions, wars), they are derivative kinds. If they are autonomous, they must exert force *over and above* those exposures. It is difficult to satisfy Causal Autonomy without denying that generations are merely bundles of exposures.

  **The Single Most Exclusionary Requirement:**
  **The Identification Condition.**
  This is the "killer." Most candidate theories fail here. Popular narratives ignore the math entirely. Deflationary views admit the math makes the variable unknowable. Derivative views often collapse cohort into period effects. If a theory cannot specify the substantive constraint that allows a cohort effect to be statistically distinguished from an age effect, it cannot license the variable for the researcher, rendering the metaphysical status moot. You cannot have an ontology of a variable that cannot be measured.

  ---

  ### Scoring Candidate Positions

  **1. Strong Realism (Cyclical/Narrative)**
  *   *Score:* **Fails.**
  *   *Reasoning:* Fails **Identification** (offers no statistical constraint for APC), fails **Boundary Justification** (dates are mythic/arbitrary), and fails **Portability** (assumes US-centric history applies globally). It treats **Effect Size** as dogma rather than empirical claim. It scores well on **Reflexivity** (acknowledges labels matter) but fails **Error Possibility** (membership is often treated as self-evident).

  **2. Deflationary Conventionalism (Labels only)**
  *   *Score:* **Passes (on its own terms).**
  *   *Reasoning:* Passes **Identification** (by denying cohort effects exist as distinct from age/period), passes **Boundary Justification** (admits arbitrariness), and passes **Error Possibility** (denies objective membership). However, it fails the **Researcher Job** (cannot use generation as an explanatory variable) and fails the **Metaphysician Job** (denies the ontological bracket entirely). It is a specification for *dissolving* the kind, not validating it.

  **3. Derivative Realism (Exposure-Based)**
  *   *Score:* **Partial Pass.**
  *   *Reasoning:* Passes **Causal Autonomy** (if defined as the exposure bundle itself) and **Identification** (if exposures are non-linear or specific). Passes **Portability** (if defined by shared history, not dates). Struggles with **Granularity** (exposures are continuous, cohorts are discrete) and **Boundary Justification** (when does an exposure start/end?). It satisfies the Researcher best but risks collapsing into Period effects, threatening its status as a distinct *cohort* kind for the Metaphysician.
