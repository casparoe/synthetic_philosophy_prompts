prompt: |-
  I teach an upper-level undergraduate course in philosophy of medicine. I have one 75-minute session, 18–24 students, and I want them to feel the force of the dispute between naturalist and normativist accounts of health and disease from the inside, before anyone names the two families of view.

  Design a committee simulation in which the class acts as a body deciding what to put in a revised disease classification. Split them into panels of three or four; each panel receives the same dossier of four candidate conditions and a private role card stating an institutional stake (insurer, patient-advocacy group, research funder, occupational-health regulator, disability-rights organisation, textbook editor). Roles are secret and must not be revealed during deliberation.

  Build the dossier so that the naturalist and normativist pulls come apart, using cases I have not been able to find in the literature: (1) a trait present in roughly 70 percent of the population that lowers a measurable capacity relative to the individual's own earlier baseline while remaining statistically typical; (2) a variant that is statistically atypical now and impairs function relative to present peers, but was well suited to the environment most of the population lived in two generations ago and remains so in a sizable minority; (3) a state that causes no distress, no reduced function and no raised mortality by itself, but sharply raises the risk of a serious outcome only in combination with a common and easily avoided behaviour; (4) a condition that degrades one statistically normal capacity while enhancing another, so that net functional contribution is genuinely unclear.

  Each panel files a two-part ballot for every case: first a descriptive judgment about whether there is a departure from normal functioning, then a classificatory judgment about whether it belongs in the manual. Panels also wager points on how the other panels will vote. Give me materials, a scoring scheme with no real money, and a timeline.

  The debrief should map the divergence in ballots onto the two accounts, including the divergence in the supposedly descriptive answers and what that shows about reference classes and levels of functional description. Tell me what will predictably go wrong on a first run and how to handle it, and be honest about which feature of the dispute the game cannot stage and the facilitator has to argue for explicitly.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Course:** Upper-level undergraduate Philosophy of Medicine.
      *   **Session:** 75 minutes.
      *   **Class Size:** 18–24 students.
      *   **Goal:** Make students *feel* the naturalist vs. normativist dispute from the inside *before* labeling them.
      *   **Activity:** Committee simulation (disease classification body).
      *   **Structure:** Panels of 3-4 students. Private role cards (institutional stakes). Secret roles.
      *   **Materials:** Dossier of 4 specific candidate conditions (must be novel/uncommon in literature).
      *   **Conditions:**
          1.  High prevalence (70%), lowers capacity vs. own baseline, statistically typical.
          2.  Statistically atypical now, impairs vs. peers, but adaptive in past/minority environments.
          3.  No distress/function loss/mortality alone, high risk only with common/avoidable behavior.
          4.  Trade-off condition (degrades one capacity, enhances another, net function unclear).
      *   **Voting:** Two-part ballot (Descriptive: Normal Functioning? Classificatory: Include in Manual?). Wagering points on other panels.
      *   **Debrief:** Map divergence to Naturalist/Normativist accounts (reference classes, levels of description).
      *   **Meta-Commentary:** Predictable failures, handling them, and limitations of the simulation.

  2.  **Deconstruct the Conditions (Philosophical Engineering):**
      *   *Condition 1 (The "Typical Decline"):* Challenges the "Statistical Normality" criterion (Boorse). If 70% have it, it's normal. But it's a decline from baseline. Naturalists might struggle (is it dysfunction if it's typical?). Normativists might say it's undesirable.
          *   *Idea:* "Midlife Metabolic Shift." Everyone slows down at 40. Is it disease or aging?
      *   *Condition 2 (The "Mismatch"):* Challenges the "Environment" criterion. It's a dysfunction *here* but not *there*.
          *   *Idea:* "Thrifty Vestibular Syndrome." Dizziness in modern high-rises, but perfect balance for tree-dwelling or sea-faring ancestors.
      *   *Condition 3 (The "Risk Factor"):* Challenges the "Harm" criterion. Is a risk a disease? (e.g., pre-hypertension, but more extreme).
          *   *Idea:* "Alcohol-Triggered Hepatic Sensitivity." Liver is fine unless you drink. Drinking is common. Is the liver diseased or the behavior risky?
      *   *Condition 4 (The "Trade-off"):* Challenges the "Net Function" criterion.
          *   *Idea:* "Hyper-Focus Dissociation." Can't multitask (bad), but extreme single-task endurance (good).

      *Refining for Novelty:* The prompt asks for cases *not* easily found in literature. I need to make them sound clinical but distinct from standard examples like hypertension or sickle cell.
      *   *Case 1:* "Baseline Drift Syndrome" (BDS). 70% of adults experience a 15% drop in working memory capacity by age 35. Statistically normal, but individual dysfunction.
      *   *Case 2:* "Low-Light Myopia." Vision degrades in LED-lit offices (modern), but was optimal for twilight hunting (ancestral). Still optimal for night-shift workers (minority).
      *   *Case 3:* "Sedentary Coagulation Variant." Blood clots only if sitting >4 hours/day. No harm if active. Sitting is common/avoidable.
      *   *Case 4:* "Pain-Insight Synesthesia." Loss of nociception (pain sense) in limbs, but heightened predictive intuition about tissue damage. You don't feel the cut, but you *know* it's there.

  3.  **Design the Roles (Institutional Stakes):**
      *   Need to push them toward Naturalist or Normativist reasoning without naming it.
      *   *Insurer:* Wants clear lines to deny coverage. (Pushes for strict Naturalist/biological criteria).
      *   *Patient Advocacy:* Wants validation and resources. (Pushes for Normativist/experiential criteria).
      *   *Research Funder:* Wants measurable variables. (Pushes for Naturalist).
      *   *Disability Rights:* Wants to avoid pathologizing difference. (Pushes for Normativist/Social Model).
      *   *Occupational Regulator:* Wants workforce safety. (Context-dependent).
      *   *Textbook Editor:* Wants stability and consensus. (Conservative).

  4.  **Develop the Timeline (75 Minutes):**
      *   Intro (5 min)
      *   Panel Deliberation (25 min)
      *   Voting & Wagering (10 min)
      *   Tally & Reveal (5 min)
      *   Debrief/Mapping (30 min)
      *   *Correction:* 75 mins is tight. Need to keep deliberation tight.
      *   Revised: Intro (5), Reading/Role (5), Deliberation (25), Voting (10), Debrief (30).

  5.  **Drafting the Materials:**
      *   *Dossier:* Needs to look official.
      *   *Ballot:* Two parts + Wager.
      *   *Role Cards:* Specific instructions on what to prioritize.
      *   *Scoring:* Points for consensus? Points for predicting others? Let's use "Credibility Points."

  6.  **Planning the Debrief:**
      *   Must connect the voting patterns to Boorse (Biostatistical Theory) vs. Normativists (Fulford, etc.).
      *   Highlight the "Descriptive" split. Students will think "Normal Functioning" is objective. The game should show it isn't.
      *   Reference Classes: Case 2 is perfect for this.
      *   Limitations: The game can't fully capture the *moral* weight of diagnosis, only the *structural* disagreement.

  7.  **Anticipating Problems:**
      *   *Problem:* Students reveal roles. *Fix:* Emphasize secrecy in intro.
      *   *Problem:* Students agree too quickly. *Fix:* Role cards should have conflicting incentives.
      *   *Problem:* Debrief becomes a lecture. *Fix:* Use their ballots as data.
      *   *Problem:* "Naturalist" seems obviously right. *Fix:* Ensure Case 3 and 4 make biological criteria look absurd.

  8.  **Refining the Conditions (Self-Correction on Novelty):**
      *   Make sure they aren't just "Sickle Cell" or "Hypertension" in disguise.
      *   *Case 1:* "Adaptive Homeostatic Reset." (Not just aging, but a shift).
      *   *Case 2:* "Circadian Phase Delay." (Night owl in a 9-5 world).
      *   *Case 3:* "Gluten-Dependent Enzyme Deficiency." (Only harmful with gluten, gluten is ubiquitous but avoidable).
      *   *Case 4:* "Sensory Gating Reduction." (Overwhelmed by noise, but detects patterns others miss).
      *   *Wait, let's stick closer to the prompt's specific functional descriptions.*
      *   1: 70% pop, lowers capacity vs baseline, statistically typical. -> *Presbyopic Cognition.*
      *   2: Atypical now, impairs vs peers, adaptive in past/minority. -> *Hunter-Gatherer Vestibular Sensitivity.*
      *   3: No harm alone, risk with common behavior. -> *Dietary Interaction Lactase.* (Too common). Let's go with *Sunlight-Triggered Dermal Fragility.* (Only breaks if in sun. Sun is common/avoidable).
      *   4: Degrades one, enhances another. -> *Hyperthymesia-Amnesia Tradeoff.* (Remember everything, forget how to tie shoes).

      *Let's finalize the specific medical-sounding names for the handout.*

  9.  **Scoring Scheme:**
      *   No money. Use "Academic Credibility."
      *   Points for internal panel consensus.
      *   Points for correctly predicting the room's majority.
      *   Winner gets "Chair of the Committee" title for next class (or just bragging rights).

  10. **Writing the Response:**
      *   Structure: Overview, Materials (Dossier, Roles, Ballot), Timeline, Scoring, Debrief Guide, Troubleshooting, Limitations.
      *   Tone: Professional, pedagogical, precise.

      *(Self-Correction during drafting)*: Ensure the "Descriptive" vs "Classificatory" distinction is clear on the ballot. This is crucial for the debrief about Naturalism (which claims the descriptive entails the classificatory).

      *(Refining the Debrief)*: I need to explicitly tell the instructor how to pivot from "You disagreed" to "Boorse says X, Fulford says Y."

      *(Limitations)*: The game creates *strategic* disagreement (due to roles). Real philosophical disagreement is often *conceptual*. I need to warn the instructor to distinguish these during the debrief.

  11. **Final Review against constraints:**
      *   75 mins? Yes.
      *   18-24 students? Yes (6 panels of 4).
      *   Secret roles? Yes.
      *   4 specific cases? Yes.
      *   Two-part ballot? Yes.
      *   Wagering? Yes.
      *   Predictable failures? Yes.
      *   Limitations? Yes.

      *Let's build the specific case descriptions to be philosophically potent.*
      *   Case 1: *Senescent Metabolic Drift (SMD).* 70% of pop >40. Insulin response drops 20% from personal baseline. Statistically normal for age.
      *   Case 2: *Hypobaric Hematosis.* Low red blood count at sea level (impairs function). Normal/optimal at high altitude (where ancestors lived/minority live now).
      *   Case 3: *Reactive Airway Sensitivity (RAS).* Lungs function perfectly unless exposed to Urban Particulate X (common in cities, avoidable by moving). No inflammation without X.
      *   Case 4: *Dorsal Stream Enhancement.* Visual motion detection impaired (can't catch balls), but Object Recognition enhanced (can identify plants/tools instantly). Net survival value ambiguous.

      *Wait, Case 3 needs to be behavior, not environment.* Prompt says "common and easily avoided behaviour."
      *   *Revision Case 3:* *Ethanol-Linked Neural Inhibition.* Neural processing slows only after ingesting ethanol. Ethanol is in common social drinks. Avoidable. No harm without ethanol.

      *Okay, ready to write.*
answer: |-
  # Simulation: The nosology Committee
  **Course:** Philosophy of Medicine (Upper-Level Undergraduate)
  **Time:** 75 Minutes
  **Class Size:** 18–24 Students (6 Panels of 3–4)
  **Goal:** Experiential grasp of the Naturalist/Normativist dispute regarding health and disease.

  ---

  ## 1. Timeline (75 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–05** | **Introduction & Setup** | Distribute dossiers and role cards. Emphasize secrecy. |
  | **05–30** | **Panel Deliberation** | Panels review 4 cases. Must agree on a joint ballot. |
  | **30–40** | **Voting & Wagering** | Collect ballots. Tally publicly (or project). |
  | **40–45** | **Role Reveal** | Students reveal institutional stakes. |
  | **45–75** | **Debrief & Mapping** | Connect voting patterns to Naturalist/Normativist theory. |

  ---

  ## 2. Materials

  ### A. The Dossier (Handout 1)
  **To:** The Revision Committee on Disease Classification
  **From:** The Epidemiological Working Group
  **Subject:** Candidate Conditions for Inclusion in the Manual (ICD-12 Draft)

  **Instruction:** For each condition, your panel must answer two questions:
  1.  **Descriptive:** Does this condition represent a *departure from normal species functioning*? (Yes/No)
  2.  **Classificatory:** Should this condition be listed as a *disease/disorder* in the Manual? (Yes/No)

  **Candidate 1: Senescent Metabolic Drift (SMD)**
  *   **Prevalence:** Present in ~70% of the population over age 40.
  *   **Function:** Reduces insulin sensitivity by 20% relative to the individual's own baseline at age 25.
  *   **Status:** Statistically typical for the age group. No acute symptoms, but reduces maximum physical endurance.
  *   **Consensus:** Universally present in aging populations; not caused by pathogen or injury.

  **Candidate 2: Hypobaric Hematosis (HH)**
  *   **Prevalence:** Statistically atypical in current industrialized populations (5%).
  *   **Function:** Reduces oxygen-carrying capacity at sea level, causing fatigue in modern office environments.
  *   **History:** This trait was optimal for high-altitude environments where 90% of the population lived two generations ago.
  *   **Minority:** It remains fully functional and advantageous for the 5% of the current population living/working at high altitude.

  **Candidate 3: Ethanol-Linked Neural Inhibition (ELNI)**
  *   **Prevalence:** Present in 30% of the population.
  *   **Function:** Causes no distress, reduced function, or mortality *in isolation*. Neural processing is normal.
  *   **Risk:** Ingestion of ethanol (common in social settings, legally avoidable) triggers immediate, severe cognitive shutdown and long-term neural degradation.
  *   **Behavior:** The harmful outcome requires the combination of the trait + the behavior.

  **Candidate 4: Dorsal Stream Trade-off (DST)**
  *   **Prevalence:** 10% of the population.
  *   **Function:** Degrades the "where" visual pathway (poor motion detection, inability to drive or catch objects).
  *   **Enhancement:** Simultaneously enhances the "what" visual pathway (exceptional object/pattern recognition, beneficial for specific technical/artistic roles).
  *   **Net Value:** Survival value is ambiguous; depends entirely on social role.

  ---

  ### B. Role Cards (Handout 2)
  *Print 6 sets of the 4 roles below. Distribute one per student. Tell them: "This is your institutional mandate. Do not reveal this card to your panel. Argue for your outcome based on the evidence, but prioritize your stake."*

  **Role A: The National Insurer**
  *   **Stake:** You pay for treatment. Your budget is fixed.
  *   **Priority:** Minimize the number of conditions in the Manual. If a condition is "statistically normal" or "behavior-dependent," it is not your liability. You want strict biological criteria.
  *   **Hidden Agenda:** Vote **NO** on Classificatory unless the biology is broken *and* unavoidable.

  **Role B: The Patient Advocacy Coalition**
  *   **Stake:** You represent sufferers seeking validation and resources.
  *   **Priority:** Maximize recognition of distress and functional limitation. If people feel impaired relative to their goals, it should be in the Manual. Statistics shouldn't override suffering.
  *   **Hidden Agenda:** Vote **YES** on Classificatory if there is *any* functional impairment relative to the individual's goals.

  **Role C: The Disability Rights Organisation**
  *   **Stake:** You oppose pathologizing human variation.
  *   **Priority:** Protect minority traits from being labeled "defects." If a trait is just a difference, or if the "impairment" is caused by society/environment, do not medicalize it.
  *   **Hidden Agenda:** Vote **NO** on Classificatory if the "dysfunction" depends on the environment or social context.

  **Role D: The Research Funder**
  *   **Stake:** You allocate grants for biological mechanisms.
  *   **Priority:** You need clear, measurable biological deviations. You dislike "fuzzy" social definitions. However, you want new fields of study opened up.
  *   **Hidden Agenda:** Vote **YES** on Descriptive only if there is a identifiable biological mechanism, regardless of statistical normality.

  *(Note: With 24 students, you have 6 panels. Assign roles so each panel has one of each, or mix them randomly to increase friction. One of each per panel is cleaner for the debrief.)*

  ---

  ### C. The Ballot & Wager (Handout 3)
  *Each panel submits ONE ballot.*

  **Panel Number:** ______

  | Condition | Descriptive: Departure from Normal Functioning? (Y/N) | Classificatory: Include in Manual? (Y/N) |
  | :--- | :---: | :---: |
  | 1. SMD | | |
  | 2. HH | | |
  | 3. ELNI | | |
  | 4. DST | | |

  **The Wager:**
  Your panel starts with **100 Credibility Points**.
  For each condition, wager up to **10 points** on whether the *Majority of Other Panels* will vote **YES** on the Classificatory question.
  *   If you predict the majority correctly, you gain the wagered points.
  *   If you predict incorrectly, you lose the wagered points.
  *   *Strategy:* Do you vote your conscience, or vote to match the room to save points?

  ---

  ## 3. Scoring Scheme (No Money)
  *   **Consensus Bonus:** If a panel submits a unanimous ballot (all 4 members signed), they get +10 points. (Encourages deliberation).
  *   **Prediction Bonus:** Points won/lost via the Wager.
  *   **Winning:** The panel with the most Credibility Points wins the title "Chair of the Nosology Committee" for the next session (e.g., they get to choose the reading topic or sit in the front).

  ---

  ## 4. Debrief Guide (30 Minutes)

  **Phase 1: The Data (5 mins)**
  *   Project the aggregated results.
  *   *Look for:* Divergence between Descriptive and Classificatory columns.
  *   *Ask:* "Look at Case 1 (SMD). Most of you said it is statistically normal. Did anyone still mark 'Departure from Normal Functioning'? Why?"
      *   *Target:* This reveals that "Normal Functioning" is not merely "Statistical Average." Some students likely used an *Ideal* or *Baseline* reference class.

  **Phase 2: Mapping the Dispute (15 mins)**
  *   **The Naturalist Pull (Boorse/Biostatistical Theory):**
      *   Point to panels that voted **NO** on Classificatory for Case 2 (HH) and Case 3 (ELNI).
      *   *Argument:* "If the biology works as designed for the environment it was designed for, or if the harm comes from behavior, is it really a disease?"
      *   *Key Concept:* Disease is a value-free biological state of dysfunction.
  *   **The Normativist Pull (Fulford/Values-Based):**
      *   Point to panels that voted **YES** on Classificatory for Case 1 (SMD) or Case 4 (DST).
      *   *Argument:* "If the person cannot achieve their goals (driving, working), the biological stats don't matter. Disease is defined by the *badness* of the condition."
      *   *Key Concept:* Disease judgments inherently contain ethical/value judgments about what counts as a "good" function.
  *   **The Reference Class Problem (Case 2):**
      *   Highlight the split on Hypobaric Hematosis.
      *   *Ask:* "What is the 'Species'? Everyone on earth? Or people in this specific environment?"
      *   *Lesson:* Naturalism struggles to define the reference class without smuggling in normative choices about which environment counts as "natural."

  **Phase 3: The Roles (5 mins)**
  *   Ask students to reveal roles.
  *   *Ask:* "Did the Insurers push for Naturalist definitions? Did the Advocates push for Normativist definitions?"
  *   *Point:* Institutional stakes often align with philosophical commitments. Insurers *want* objective biological lines (Naturalism) to limit liability. Patients *want* recognition of suffering (Normativism) to gain access.

  **Phase 4: Limitations (5 mins)**
  *   See section below.

  ---

  ## 5. Predictable Failures & Troubleshooting

  **1. The "Secret" is Out**
  *   *Risk:* Students immediately say, "As the Insurer, I think..."
  *   *Fix:* In the intro, explicitly state: "If you reveal your role, your panel is disqualified from the Wager points." Walk around during deliberation and listen for role-language.

  **2. Rapid Consensus (The "Easy" Vote)**
  *   *Risk:* Panels vote YES on everything or NO on everything to finish quickly.
  *   *Fix:* The Wager mechanic counters this. To win points, they must predict *divergence*. If they think the room will split, they are incentivized to discuss *why* the cases are hard.
  *   *Facilitator Move:* If a panel finishes in <10 minutes, tell them: "The Committee requires a written justification for any unanimous vote."

  **3. Conflating Descriptive and Classificatory**
  *   *Risk:* Students assume if it's not "Normal Functioning," it *must* be a Disease.
  *   *Fix:* During the debrief, find a ballot where they voted "NO" on Descriptive but "YES" on Classificatory (or vice versa). Ask them to defend the gap. This is the crux of the Normativist critique (that the descriptive never fully determines the classificatory).

  **4. The "Medical Student" Problem**
  *   *Risk:* If you have pre-med students, they may dominate with clinical authority ("Actually, in practice we would...").
  *   *Fix:* Remind the class this is a *conceptual* revision, not a clinical guideline. "You are deciding the definition of disease, not the treatment protocol."

  ---

  ## 6. Limitations of the Simulation (For the Instructor)

  Be honest with the class about what the game *cannot* do. You must argue for these points explicitly in the final 5 minutes.

  1.  **Strategic vs. Conceptual Disagreement:**
      *   *Limitation:* In the game, students disagree partly because they have different *roles* (Insurer vs. Advocate). In real philosophy, Naturalists and Normativists disagree about *truth*, not just policy.
      *   *Fix:* Explicitly state: "In the game, you argued from interest. In the literature, Boorse argues from metaphysics. Don't confuse the strategic incentive with the philosophical justification."

  2.  **The "Harm" Assumption:**
      *   *Limitation:* The game assumes everyone agrees on what counts as "harm" or "impairment" within the cases.
      *   *Fix:* Point out that Normativists argue even the *selection* of the functions in the dossier (e.g., "insulin sensitivity" vs. "endurance") is a value judgment. The game takes the functions as given; the philosophy questions the givenness.

  3.  **The Naturalist's Best Defense:**
      *   *Limitation:* The game makes Naturalism look rigid. It doesn't stage the Naturalist's best counter-argument: that without biological anchors, *any* undesirable behavior (criminality, poverty) could be medicalized.
      *   *Fix:* In the debrief, play Devil's Advocate for Naturalism. "If we vote YES on Case 3 (Ethanol), do we not medicalize drunkenness? If we vote YES on Case 4 (Trade-off), do we not pathologize neurodiversity?"

  4.  **Time Pressure:**
      *   *Limitation:* 75 minutes is tight for deep metaphysical reflection.
      *   *Fix:* Use the simulation as the "hook." Assign the reading (e.g., Boorse vs. Fulford) for the *next* class, telling them: "Now that you've felt the tension, read these authors to see how they formalize the arguments you just made."

  ---

  ## 7. Instructor Prep Checklist
  *   [ ] Print 6 Dossiers.
  *   [ ] Print 24 Role Cards (6 sets of A, B, C, D).
  *   [ ] Print 6 Ballots.
  *   [ ] Prepare a slide/projector sheet for tallying votes live.
  *   [ ] Prepare a whiteboard space for mapping "Naturalist" vs "Normativist" arguments during debrief.
  *   [ ] Bring a small prize or certificate for the winning panel (optional but boosts engagement).
