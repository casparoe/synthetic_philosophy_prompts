  In a crowded emergency room, Dr. Aris stands over a unstable patient, monitoring fluctuating vitals and recalling specific contraindications from memory over a forty-five-second interval before finally reaching out to sign the intubation consent form. In this scenario, the mental state $M$ is Dr. Aris's integrated clinical judgment, which is fully realized by the neural base $N$ consisting of the specific sequence of firing patterns across her prefrontal and motor cortices during those forty-five seconds, and the physical action $B$ is the motor movement of her hand signing the document. The causal work of $M$ is not located in a single neural spike at the moment of signing but is distributed across the temporal interval of deliberation, where earlier neural states constrain later ones through feedback loops to stabilize the decision against noise.

  The exclusion argument applies cleanly to $N$ because the principle of physical closure dictates that the physical neural process $N$ is causally sufficient for the physical movement $B$; if $N$ occurs, $B$ must follow given the laws of physics. However, the argument fails to catch $M$ because standard exclusion logic assumes synchronic causation (cause and effect at an instant $t$), whereas $M$'s causal power is essentially diachronic, relying on the *maintenance* of a goal-state over time rather than a instantaneous push. The structural feature doing the work is the temporal distribution itself, specifically the feedback loops that allow the system to correct errors; without the interval, there is no "judgment," only a reflex. A defender of the exclusion argument would attack this by insisting that the temporally extended neural process $N$ is still the sole physical cause, and $M$ is merely a descriptive label for $N$'s duration, meaning $M$ remains causally inert unless it is strictly identical to $N$. If you strip out the temporal feature and compress $M$ into an instantaneous snapshot to match a synchronous $N$, the case collapses back into standard overdetermination, as $M$ and $N$ would then compete for causal sufficiency at the exact same moment without the buffering logic of the extended process to distinguish their roles.
