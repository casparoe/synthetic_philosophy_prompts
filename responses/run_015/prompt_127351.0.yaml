answer: |-
  Right, let's crack this open. You want the anthropic bit without saying the word 'anthropic'. Tricky. Like doing a magic trick without hands. If I just explain the theory, I'm a lecturer. If I just tell a joke, I'm a comic. You want the hybrid—the bloke who explains the joke *while* telling it, but still gets a laugh.

  Here's five angles I had in the green room:

  *   **The Queue:** Standard waiting line. SSA says 'average wait', SIA says 'infinite queue because I'm in it'. A bit cliché. Hard to distinguish the FI character without getting into maths mid-queue.
  *   **The Raffle:** Office prize draw. SSA says 'unlikely to win', SIA says 'must be many prizes'. Hard to make FI sound distinct without numbers on a board.
  *   **The Job Interview:** Waiting outside the boss's office. SSA says 'few candidates', SIA says 'infinite candidates'. Good tension, but too high stakes for a dry joke.
  *   **The Call Centre:** On hold. SSA says 'typical wait', SIA says 'billions on hold'. A bit abstract, hard to visualise three people interacting.
  *   **The GP Waiting Room:** (Winner). Universally hated, drab, British. Perfect for existential dread. You're already waiting for something uncertain. It captures the passivity of observation.

  I'm picking the **GP Waiting Room**. It's the most fertile ground for the "Presumptuous Philosopher" vibe because everyone already suspects the surgery is mismanaged. It lets the SIA character look mad for inferring a crowd from an empty room, and the SSA character look gloomy. The FI character fits perfectly as the pedant ruining both vibes with a calculator.

  Here's the bit.

  ***

  **Setup**

  Three blokes in a GP waiting room. Arthur, Brian, and Clive.
  Arthur's reading a three-year-old magazine. Brian's staring at the ceiling. Clive's tapping on a calculator.

  Arthur says the room looks empty.
  Brian says empty is an illusion. He's sitting there. That proves there's billions of patients.
  Clive says there's billions, yes. But weighted by the square root of existence.

  Arthur says that's nonsense. He's just a typical patient.
  Brian says typicality is a trap. His existence is evidence of a crowded universe.
  Clive says it's evidence of a crowded universe. But a politely crowded one.

  Arthur says he just wants his prescription.
  Brian says he knows the size of the cosmos.
  Clive says he knows the square root of the cosmos.

  **Punchline A (SSA is the butt)**

  Arthur closes his magazine.
  "Well, if I'm statistically typical, and most patients die before seeing the doctor... I should probably write my will."

  **Punchline B (SIA is the butt)**

  Brian stands up to leave.
  "I'm telling the Prime Minister. The cosmos is full."
  Clive doesn't look up.
  "Full. But sparsely populated."
  Brian sits back down.
  "Bugger. Forgot the discount."

  ***

  **Delivery Notes**

  *   **Pacing:** Keep it dry. No big gestures. The humour is in the absurdity of the logic, not the performance.
  *   **Clive:** Play him as genuinely helpful. He's not mocking Brian; he thinks he's correcting the maths. That makes him more irritating.
  *   **Pause:** Before Punchline A, let Arthur's resignation hang. Before Punchline B, let Brian's confidence peak before Clive deflates it.
  *   **Accent:** Standard Southern British. Nothing too posh, nothing too regional. Just "GP Waiting Room" neutral.

  ***

  **Debrief**

  Right, here's the machinery under the bonnet. The setup establishes the reference class quietly: 'patients in the surgery'. Arthur's line about the room being empty sets the prior: low observer count. Brian's counter moves the prior based on his own existence (SIA), implying a huge observer count. Clive's intervention introduces the Fractional Indication mechanic; he accepts the SIA premise but applies a dampening function (square root), structurally muting the inference without rejecting the logic.

  Punchline A leverages the Doomsday Argument inherent in SSA. If Arthur is a random sample from all patients who ever live, and most live in the future, he's likely early. But if he assumes 'typical patients die waiting', he concludes his own demise. It's dark, logical, and makes SSA look depressive.

  Punchline B targets the Presumptuous Philosopher. Brian claims cosmic knowledge from local data. Clive undermines him not by denying the data, but by devaluing it. It's funnier because it punctures arrogance rather than confirming gloom. The FI character works here because he's the killjoy who stops the joke from being purely absurd; he makes the absurdity precise.

  Where does the comedy die? The reference class problem. We never define who counts as an 'observer'. Is it humans? Minds? Patients? The joke glosses over this because defining it kills the rhythm. You can't laugh while defining boundaries. So the joke smuggles in a vague 'patient' class and hopes you don't notice the leak.
