      *   *Static vs. Processual:* This aligns with "constitutive" vs. "constituted" power debates. Also relates to Runciman's "boundary problem" vs. "boundary practice."
      *   *All Affected (AAI) vs. All Subjected (ASC):* Standard dichotomy. User is critiquing both as too static/functionalist.
      *   *Epistemic Frameworks:* This sounds like Fricker (epistemic injustice), but applied to boundary drawing. Also connects to Dryzek's discursive democracy or Young's communicative democracy.
      *   *Plural-Subject Theory:* Gilbert, Tuomela. Usually applied to collective intentionality. Applying it to *boundary drawing* is the "weird move."
