answer: |-
  This is a strong, ambitious pivot. You are effectively moving the boundary problem from *juridical classification* (who fits the criteria?) to *discursive constitution* (who has the standing to make the claim?). That is a genuine theoretical contribution, not just a redescription, provided you handle the circularity objections carefully.

  Here is a breakdown based on your specific questions, separating established consensus from the contested ground you're walking into.

  ### 1. Static Membership vs. Processual Boundary-Drawing
  **Is this doing real work?**
  Yes, but you need to distinguish it from "democratic revisionism" to avoid the "so what?" objection.

  *   **Established Consensus:** Most analytic democratic theory treats the boundary problem as a *prior* question to democracy. Frederick Whelan (1983) famously argued it's a logical paradox: you need a *demos* to decide the *demos*. The standard solutions (All Affected Interests, All Subjected to Coercion) try to solve this with external moral criteria to avoid the circle.
  *   **The Debate:** Arash Abizadeh (2008) argues borders must be democratically justified to those outside them (opening the circle). Robert Goodin (2007) pushes the "All Affected" principle to its global limit.
  *   **Your Move:** You are arguing that both Whelan (status quo bias) and Goodin/Abizadeh (functionalist criteria) treat the *demos* as a container that needs filling. You are suggesting the *demos* is a **performative achievement**.
  *   **The Risk:** If you say "boundaries are renegotiated through democratic practice," a critic will ask: "Whose practice?" If only current members negotiate the boundary, you haven't solved the exclusion problem; you've just hidden it inside the procedure.
  *   **Fix:** Be explicit that you are describing a **paradox of founding** that requires *extra-institutional* contestation. Your shift works if you argue that "democratic practice" includes *disruptive claims* from outside, not just voting or formal amendment. If you mean only internal legislative review, it's just redescription. If you mean "the capacity to disrupt the epistemic framework," that's new work.

  ### 2. The Climate Example (Causation vs. Standing)
  **Does it hold up?**
  This is the strongest part of your draft, but you need to be careful not to conflate *complex causality* with *epistemic exclusion*.

  *   **Established Consensus:** It is well-established in political ecology that climate governance creates "distanced" harms (e.g., EU policy → West African yield). It is also standard in critical theory (Fricker, Dotson) that epistemic frameworks can render harms unintelligible.
  *   **The Debate:** What is contested is whether "unintelligibility" is a *democratic* problem or a *moral* one. A liberal might say: "If they are affected, they have a moral claim, even if they can't articulate it in EU parliament."
  *   **Your Move:** You are arguing that without the *articulation*, the moral claim doesn't trigger the democratic mechanism. The harm doesn't register as a *grievance*, just as noise or externalities.
  *   **Critique:** Make sure you aren't blaming the victim ("they can't speak our language"). Frame it as a failure of the *receiving* framework. The EU's metric of "affectedness" is endogenous (based on GDP, carbon tons, legal standing) and structurally blind to subsistence agriculture or informal economies.
  *   **Phrasing Flag:** "Outside the epistemic framework that even defines what counts as being affected."
      *   *Tweak:* "Excluded from the epistemic framework that **operationalizes** affectedness." (Sounds less metaphysical, more institutional).
  *   **Verdict:** It holds up, provided you emphasize that the *decision-makers* lack the vocabulary, not just that the *migrants* lack the lobby.

  ### 3. Smuggled Premises (Plural-Subject / Shared Framework)
  **Where are you assuming too much?**
  This is the most vulnerable section of your argument. You are smuggling in a heavy metaphysical premise as a procedural fix.

  *   **Established Consensus:** Plural-subject theory (Margaret Gilbert, Raimo Tuomela) generally explains how *existing* groups form collective intentions ("we-intentions"). It assumes a level of mutual recognition already exists.
  *   **The Debate:** Applying this to *boundary formation* is highly contested. Most theorists (e.g., Habermas, Dryzek) talk about "discursive frameworks" or "public spheres," not plural-subjectivity, precisely because plural-subject theory implies a tighter bond than democratic citizenship requires.
  *   **Your Move:** You argue you need a "shared normative space" to contest the boundary.
  *   **The Trap:** This risks a **catch-22**: "You need to be part of the 'we' to claim you should be part of the 'we'." If "epistemic membership" requires a shared framework, then the most marginalized (who by definition don't share the framework) are permanently excluded.
  *   **Fix:** You need to explain how the shared framework is **constructed** through the conflict, not as a precondition for it.
      *   *Don't say:* "You belong if you can contest within a shared framework."
      *   *Do say:* "Belonging is constituted by the **struggle to create** a shared framework where the contestation becomes legible."
      *   *Theoretical Shift:* Consider swapping "plural-subject theory" for **"discursive democracy"** (Dryzek) or **"agonistic pluralism"** (Mouffe). They handle conflict and framework-building better than Gilbert's joint commitment, which sounds too consensual for a boundary dispute. If you stick with Plural-Subject, you must defend why *joint commitment* is the right metric for *coercion*.

  ### Prose & Phrasing (The 2 AM Cleanup)
  Your advisor hates "nominalizations" (turning verbs into heavy nouns) and vague metaphors. Here are specific tweaks:

  *   **Current:** "treat the demos as a pre-existing container we just fill correctly"
      *   **Better:** "treat the *demos* as a static vessel awaiting the correct population."
  *   **Current:** "outside the epistemic framework that even defines what counts as being affected."
      *   **Better:** "excluded from the epistemic framework that **determines** affectedness."
  *   **Current:** "whose claims to belong actually get heard in that process?"
      *   **Better:** "whose claims to belong are **legible** within that process?" (Fits your epistemic theme better).
  *   **Current:** "epistemic membership condition"
      *   **Better:** "condition of **discursive legibility**." ("Epistemic membership" sounds like a login credential).
  *   **Current:** "solving the boundary problem might require constructing that shared space first"
      *   **Better:** "resolving the boundary problem requires **forging** the shared space through contestation." (Avoids the "first" which implies a temporal sequence that doesn't exist).

  ### Summary of Theoretical Positioning
  To ensure you don't present your moves as consensus:

  1.  **Frame the "Processual" move** as a critique of the *functionalist* turn in boundary theory (Goodin/Miller). Explicitly state: "Unlike Abizadeh, who seeks a procedural justification for borders, I argue..."
  2.  **Frame the "Epistemic" move** as bridging democratic theory with **epistemic injustice** literature. Acknowledge this is an interdisciplinary import, not standard democratic theory.
  3.  **Frame the "Plural-Subject" move** as a **provocation**. Write: "While plural-subject theory typically describes internal group cohesion, I extend it here to describe the *edge* of the group." (This tells the grader: "I know this is weird, and I'm doing it on purpose.")

  **Final Verdict:** The core argument is seminar-worthy. It moves beyond "who should vote" to "what makes a claim count." Just tighten the circularity objection regarding the "shared framework," and swap "membership" for "legibility" to keep the epistemic metaphor consistent.
