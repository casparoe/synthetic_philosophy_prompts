      *   **Case Study:** Climate migration/EU carbon border adjustments affecting West African agriculture. Affected populations are outside the *epistemic framework* defining "affectedness." They can't claim membership because the causal chain isn't visible/articulable as a democratic grievance.
      *   **Proposed Solution:** "Epistemic membership" condition. You belong if your exclusion can be contested within a shared practical framework. Borrowing from plural-subject theory (joint commitment needs shared normative space). Some groups are outside because there's no shared framework for their harm to register *as* a boundary dispute. Solution: Construct the shared space first, not just extend the franchise.
      *   **Specific Questions:**
