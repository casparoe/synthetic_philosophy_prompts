answer: |-
  ### The Arendt-Altman Reality-Test Protocol

  This procedure adapts Hannah Arendt's distinctions from *Truth and Politics* for high-deadline journalism. It separates **factual verification** (can we prove it?) from **ontological assessment** (is this attacking reality itself?) and **editorial judgment** (do we print the word?).

  **Time Estimate:** 10–12 Minutes
  **Decision Authority:** Standards Editor (Final sign-off on Step 4)

  #### Phase 1: Factual Baseline (The "Traditional Lie" Test)
  *These steps determine if the statement is objectively false and intentional. This is binary.*

  **Step 1: Verifiability**
  *   **Question:** Is the statement a claim of fact that can be proven true or false by existing records?
  *   **Sufficient Answer:** Yes (e.g., unemployment rates, vote counts, legislative text).
  *   **Stop Condition:** If **No** (opinion, prediction, hyperbole), stop. Label as "Claim" or "Promise." Do not proceed.

  **Step 2: Knowledge/Intent**
  *   **Question:** Is there evidence the speaker knew the fact was false at the time of speaking?
  *   **Sufficient Answer:** Yes (e.g., internal memos, prior briefings, obvious contradiction of public records they possess).
  *   **Stop Condition:** If **No** (they were misinformed, relying on bad data), stop. Label as "Error" or "Misstatement."
  *   **Status Check:** If **Yes** to Step 1 & 2, you have a **Technical Lie**.
      *   *Handoff Point:* At this exact moment, you have a factual finding. The decision to print the word "lie" is now a **Values Call**. Proceed to Phase 2 to inform that value judgment.

  #### Phase 2: Arendtian Gravity (The "Reality Substitution" Test)
  *These steps determine if the lie fits Arendt's specific concern: the destruction of the factual texture of reality.*

  **Step 3: Scope of Fabrication**
  *   **Question:** Is this lie isolating a single secret, or is it attempting to replace a shared factual framework?
  *   **Sufficient Answer for "Reality Substitution":** The lie requires rejecting multiple verified facts to maintain consistency (e.g., not just "I didn't take the money," but "The audit never happened").
  *   **Indicator:** If the lie stands alone, it is traditional. If it requires a web of supporting falsehoods, it is Arendtian.

  **Step 4: The Apparatus**
  *   **Question:** Is there an organized effort (staff, media ecosystem, funding) dedicated to sustaining this falsehood after exposure?
  *   **Sufficient Answer:** Yes (surrogates repeating it, bots amplifying it, documents forged to support it).
  *   **Arendt Note:** Arendt argues the modern political lie becomes dangerous when it becomes "organized."

  **Step 5: Self-Deception Indicator**
  *   **Question:** Has the speaker continued to assert the falsehood after it was debunked to them privately?
  *   **Sufficient Answer:** Yes (repetition despite correction).
  *   **Note:** We cannot diagnose psychology, but we can track behavioral consistency. This signals the speaker is no longer lying *to* the public, but *with* the public.

  #### Phase 3: The Editorial Handoff
  *This is where the procedure stops and human judgment begins.*

  *   **If Phase 1 is YES, but Phase 2 is NO:** You have a **Traditional Lie**.
      *   *Protocol:* You may state "The Senator's claim is false." Using the word "Lie" in a headline is **Discretionary**. Consider proportionality.
  *   **If Phase 1 is YES, and Phase 2 is YES:** You have an **Arendtian Political Lie**.
      *   *Protocol:* The falsehood is the story. Using the word "Lie" or "Fabrication" is **Recommended** because the intent is to degrade the shared factual world.

  ***

  ### Case Applications

  #### Case 1: The Senator and the Unemployment Number
  *   **Scenario:** A Senator gives a speech citing 4% unemployment. The actual rate is 6%. His office received the correct briefing book an hour prior.
  *   **Phase 1:**
      *   Step 1 (Verifiable): **Yes.**
      *   Step 2 (Knowledge): **Yes** (Briefing book proof).
      *   *Status:* **Technical Lie.**
  *   **Phase 2:**
      *   Step 3 (Scope): **No.** This is a single data point, not a rewrite of the economic system.
      *   Step 4 (Apparatus): **No.** No evidence of a machine built to sustain this specific number.
  *   **Phase 3 Decision:**
      *   **Verdict:** Technically a lie by the checklist.
      *   **Headline Call:** **Judgment Call.** The procedure flags this as a traditional lie. You can write "Senator Cites Wrong Number Knowingly." Using "Senator Lies" in the headline is a values call about tone and escalation, not factual accuracy. Do not automate the word "lie" here.

  #### Case 2: The Campaign and the Fake Voter Rolls
  *   **Scenario:** A campaign releases documents alleging 50,000 dead voters. The documents are photoshopped. The campaign continues to cite them, surrogates repeat the claim on cable news, and a website is launched to "track" the fraud.
  *   **Phase 1:**
      *   Step 1 (Verifiable): **Yes.**
      *   Step 2 (Knowledge): **Yes** (Forensic analysis proves fabrication).
      *   *Status:* **Technical Lie.**
  *   **Phase 2:**
      *   Step 3 (Scope): **Yes.** This attempts to replace the reality of the election integrity itself.
      *   Step 4 (Apparatus): **Yes.** Surrogates, websites, and repeated dissemination constitute an organized apparatus.
  *   **Phase 3 Decision:**
      *   **Verdict:** **Arendtian Political Lie.**
      *   **Headline Call:** **Use the Word.** The procedure indicates the goal is reality substitution. Calling this a "Lie" or "Fabrication" is necessary to describe the attack on the factual framework.

  #### Case 3: The Mayor and the Economic Theory
  *   **Scenario:** A Mayor cites a debunked economic theory to justify a tax cut. He genuinely believes it works, despite economists telling him otherwise. He has no staff manufacturing data to support it.
  *   **Phase 1:**
      *   Step 1 (Verifiable): **Yes** (Theory is empirically false).
      *   Step 2 (Knowledge): **No** (He believes it; no evidence of knowing deception).
      *   *Status:* **Not a Lie.**
  *   **Phase 2:**
      *   *Stop.* Phase 1 failed.
  *   **Phase 3 Decision:**
      *   **Verdict:** **Error / Delusion.**
      *   **Headline Call:** **Do Not Use "Lie."** Label as "False Claim" or "Debunked Theory." Arendt distinguishes between the liar (who knows the truth and hides it) and the ideologue (who loses the capacity to see it). This is the latter.

  ***

  ### Limitations of This Procedure

  1.  **The "Opinion" Loophole:** Arendt's framework applies to *factual* truth, not *rational* truth (opinions/philosophy). This checklist cannot process statements like "This policy is immoral" or "The economy feels bad." If Step 1 fails, Arendt offers no guidance.
  2.  **The Time Lag:** Identifying an "Apparatus" (Step 4) often requires hindsight. In the first 24 hours of a scandal, you may not know if a lie is isolated or systemic. You may need to update the label from "False" to "Lie" as the apparatus reveals itself.
  3.  **The "Truthiness" Trap:** Arendt wrote about totalitarian regimes. In a democratic press environment, politicians often lie without a full "organized apparatus." This procedure may under-label chaotic, disorganized dishonesty that still damages public trust.
  4.  **No Moral Absolution:** This checklist determines if a statement fits a definition; it does not determine if the lie was "justified" (e.g., national security). Arendt acknowledges some lying is necessary in diplomacy; this protocol treats all intentional falsehoods equally until Phase 2.

  Bottom line: Use this checklist to distinguish between a politician breaking the rules and a politician breaking the world, but reserve the word "lie" for when the damage to shared reality becomes the story itself.
