      *   *Nuance:* Acknowledge that pragmatism plays a role, but argue that pragmatism cannot justify moral exclusion if sentience is present. Pragmatism explains *why* it exists, not *why it is right*.
      *   *Focus:* Ensure I distinguish between "what the practice requires" (taxonomic classification) vs "what aligns" (pragmatic ease). The practice *requires* the taxonomic line to hold, otherwise the logic collapses.

  7.  **Final Polish:** Check against the prompt's specific questions.
