  Local Man Commits to Rigorous Falsification Protocol; Public Accountability Measures Deemed Compromised

  OAK CREEK — Gary Vaneck, 44, stood before a podium set up in the community center parking lot yesterday to announce a radical shift in his investigative methodology. Citing years of criticism regarding the unfalsifiable nature of his claims concerning municipal water fluoridation and zoning laws, Vaneck unveiled a strict falsificationist research program designed to invite public scrutiny and empirical refutation.

  Vaneck distributed printed packets outlining his new protocol to the twelve attendees. The materials included pre-registered predictions, a dated laboratory notebook certified by a notary, and specific deadlines by which certain revelations were expected to materialize. "I am inviting the community to hold me accountable," Vaneck said, adjusting his glasses. "If the data does not align with the core theory, the theory falls. That is the agreement."

  However, following three separate missed deadlines this week, Vaneck issued a series of methodological addendums preserving the integrity of his core findings without altering the central claim. When a predicted document leak failed to occur by Tuesday, Vaneck released a statement noting that the leak was controlled by counter-intelligence operatives to test his resolve. When a key witness recanted testimony on Thursday, the witness was identified as a plant inserted to degrade the signal-to-noise ratio of the investigation. When the notary certification was found to be expired, Vaneck clarified that the missed deadline was itself disinformation planted to discredit the timeline. In each instance, the protective belt of assumptions expanded to absorb the shock, leaving the hard core untouched.

  Dr. Arlene Hess, a neighbor and adjunct professor of philosophy of science, expressed concern while acknowledging the complexity of the situation. "Legitimate science does not collapse at its first failed prediction," Hess said, standing on her lawn. "Researchers routinely revise auxiliary assumptions to protect a hard core of theory when anomalies arise. That is how progress works. The question is where the line lies between productive adjustment and infinite defensibility. I am struggling to articulate exactly where Gary crosses it, but I know he has crossed it."

  Vaneck remains confident in the robustness of his program. He noted that his notebook remains unblemished by actual error, as every apparent discrepancy has been reclassified as external interference. "I have never once been wrong," Vaneck said, looking directly into the camera. "Every apparent error was a lie told to me about what was going to happen. The world lied to the notebook, not the other way around."

  Vaneck has announced a new prediction regarding the contents of a sealed city council envelope, scheduled to be opened next Friday. He stated that if the envelope is empty, it will prove the contents were removed prior to his observation, confirming the theory. He invited the public to witness the opening, provided they sign a nondisclosure agreement acknowledging the possibility of decoy paperwork.
