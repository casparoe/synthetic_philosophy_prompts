  The full list is jointly satisfiable only if requirement (ix) is weakened to bounded introspection, because perfect self-knowledge of computational limits implies solving the halting problem.

  **Critique and Structure of Desiderata**

  (i) **Non-collapse:** Required to model actual computational limits rather than idealized logical closure.
  (ii) **Graded difficulty:** Required to distinguish between trivial truths and those beyond the agent's horizon. **Conflict:** (ii) vs (viii).
  (iii) **Verification versus discovery:** Required to separate the existence of a proof from the resource cost to find it.
  (iv) **Derived versus reported:** Required to track provenance for auditability and trust calibration.
  (v) **Hyperintensionality (Agent):** Required to represent distinct cognitive states for logically equivalent but computationally distinct sentences.
  (vi) **Hyperintensionality (Audit):** Required to allow an external observer to identify arbitrage opportunities the agent misses. **Conflict:** (v) vs (vi) if not stratified between object-state and meta-state.
  (vii) **Exploitability:** Required to distinguish local incoherence from systemic vulnerability to Dutch books.
  (viii) **Finite representability:** Required to ensure the theory is computationally tractable for the auditor. **Conflict:** (ii) vs (viii), (ix) vs (viii).
  (ix) **Introspection:** Required for the agent to report confidence, but strong introspection is a prejudice of ideal-agent theory that must be dropped to avoid regress. **Conflict:** (ix) vs (i), (ix) vs (ii).
  (x) **Revision:** Required to model belief dynamics when contradictions are eventually discovered.

  **Primary Tensions and Exclusions**
  The pair (ii) and (viii) cannot be had together if "graded difficulty" implies storing a specific difficulty value for every potential sentence; this must be procedural rather than stored. The single requirement doing the most work to exclude standard theories is (i) Non-collapse, as it eliminates all normal modal logics. The item that is a prejudice you should drop is the strong version of (ix) Introspection; an agent cannot perfectly know its own search limits without becoming unbounded.

  **Cost-Indexed Families**
  A cost-indexed family $B(A, c)$ can satisfy the list only if belief is defined procedurally (a function of sentence and budget) rather than extensionally (a stored set of tuples), because explicit storage violates (viii) Finite representability for infinite sentence spaces. The cost parameter $c$ must represent actual computational resources (time/memory) consumed or budgeted, not just abstract depth, to satisfy (ii) and (iii). If cost is merely abstract, the theory fails to predict actual runtime behavior and bet-taking under resource pressure.

  **Scoring Structural Families**
  1. **Possible-worlds with closure:** Fails immediately on (i) and (ii) by enforcing logical omniscience and binary belief.
  2. **Arbitrary sentence sets:** Fails on (vi) and (vii) by lacking the logical structure necessary to detect equivalence errors or Dutch books.
  3. **Impossible-worlds/Awareness:** Passes (i)-(v) but fails (ii) and (viii) unless augmented with explicit cost-bounds and procedural generation.
