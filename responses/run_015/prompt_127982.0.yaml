answer: |-
  So, picture Georg Cantor walking into a 2025 seminar on formal verification. He sees everyone typing away in Lean or Coq, and he notices they're treating the Axiom of Choice (AC) like a plugin—sometimes on, sometimes off, depending on whether they want their proofs to compute.

  Honestly? Cantor would probably be baffled by the anxiety around "losing computable values."

  Here's the thing: Cantor was a hardcore mathematical realist. To him, infinite sets weren't just useful tricks or linguistic games; they were actual, metaphysical entities existing in the "Divine Mind." He fought his whole career for the idea of *actual infinity*—that the infinite is a completed, real thing, not just a process that goes on forever.

  Because of that, he was all-in on the Well-Ordering Theorem (which is equivalent to AC). He believed every set *could* be well-ordered, period. It wasn't a "setting" for him; it was a fact about the structure of reality.

  So, if he saw mathematicians in 2025 stressing out because invoking AC breaks the ability to extract a specific number or function from a proof, he'd probably say something like, "Why are you so obsessed with writing it down?"

  To Cantor, existence didn't depend on your ability to construct an algorithm. If a choice function exists in the realm of sets, it exists. The fact that a human (or a computer) can't explicitly compute it is just a limitation of human finitude, not a flaw in the math. He'd likely view the constructivist crowd—the ones saying "if you can't build it, it doesn't count"—as the ones betraying mathematical reality, not the other way around.

  He'd probably look at Lean's Mathlib (which uses AC constantly) and give it a nod of approval. He'd see it as finally having a rigorous language to describe the transfinite universe he discovered. The fact that you can't "run" those proofs to get a decimal output? He wouldn't care. Math isn't coding to Cantor; it's theology almost. It's about truth, not utility.

  That said, he might be a little weirded out by the "toggleable" nature of modern logic. Treating truth like a configuration flag (`set_option classical true`) would probably strike him as overly relativistic. He believed he was uncovering absolute truths, not picking preferences from a menu. He'd likely tell the community to just commit to the classical view because that's where the real infinity lives.

  So, to answer your question: He wouldn't see the loss of explicit values as a betrayal. He'd see the worry about it as a category error. He'd tell everyone to stop trying to turn the ocean into a spreadsheet. If the Axiom of Choice makes the theory of sets consistent and true, then you use it, even if the computer can't spit out a specific value. For Cantor, the reality of the set trumps the ability to compute it, every single time.
