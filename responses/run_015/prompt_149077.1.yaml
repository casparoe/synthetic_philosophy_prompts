      *   Therefore, changing $P(H | E_i)$ is an overfit. It assumes the input carried more signal than it did.
      *   *Rationality:* Rationality demands you don't invent data. Rigidity is the "minimum disturbance" principle.

  6.  **Refining the BC vs. JC Distinction (The "Separation"):**
      *   BC: Updates based on *learning a fact*. "The sensor fired." This collapses the world to where Sensor Fired = True.
      *   JC: Updates based on *shifting confidence*. "The sensor firing makes me feel 70% Fault, 30% Drift."
      *   *The Conflation Risk:* In BC, if your likelihood model $P(\text{Signal} | \text{Fault})$ is wrong, your posterior is wrong. You are tethered to the generative model.
      *   In JC, you bypass the likelihood model. You directly assert the posterior over the causes. You separate "What I believe about the causes" from "How the sensor generates signals."
      *   *Wait, is that right?* JC is often used when the observation itself is uncertain. "I saw a flash." Was it red? 80% red, 20% green.
      *   *User's case:* "Report 'anomalous'... ambiguous between hardware fault or calibration drift."
      *   *Interpretation:* The partition is {Fault, Drift, Normal}. The "evidence" is the ambiguous report.
      *   If I use BC, I need $P(\text{Report} | \text{Fault})$.
      *   If I use JC, I skip that. I just say "Given this report, I assign 0.6 to Fault, 0.4 to Drift."
      *   *Why?* Maybe the likelihoods are unknown or unreliable.
      *   *The "Separation":* BC ties the update to the *process* (sensor physics). JC ties the update to the *judgment* (engineer's assessment).
      *   *Rigidity in this context:* Once I decide the report means "60% Fault", why does the relationship between Fault and "Downstream System Failure" stay the same? Because the report told me nothing about the downstream system *except* what is implied by the probability of Fault.

