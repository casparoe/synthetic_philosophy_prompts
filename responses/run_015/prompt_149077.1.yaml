          *   *Crucial Point:* In JC, the experience *only* speaks to the partition $\{E_i\}$. It says nothing about $H$ *within* $E_i$.

      *   **Step 2: The Sensor Example (Concrete Grounding).**
          *   Partition: $F$ (Fault), $D$ (Drift), $N$ (Normal).
          *   Hypothesis $H$: Maybe "System Critical Failure" (something downstream).
          *   Sensor says "Anomalous."
          *   *BC Approach:* Treat "Anomalous" as an event $A$. Condition on $A$. This requires a likelihood model $P(A | F)$, $P(A | D)$, etc.
          *   *JC Approach:* The engineer looks at the sensor and thinks, "I'm 70% sure this means Fault, 30% sure it means Drift, 0% Normal." These are the $P_{new}(E_i)$.
          *   *The Conflict:* If I use BC, I am saying "The sensor *definitely* triggered." If I use JC, I am saying "My *interpretation* of the sensor signal has shifted."

      *   **Step 3: Justifying Rigidity (Preserving Ratios).**
          *   Why $P_{new}(H | E_i) = P_{old}(H | E_i)$?
