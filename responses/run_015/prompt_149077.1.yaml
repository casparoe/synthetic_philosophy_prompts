          *   If I treat the experience as shifting my belief on {Fault, Drift, Normal} directly, that's JC.
          *   *Why do the latter?* Because "Report = Anomalous" is not the fundamental truth; the *interpretation* of the report is the uncertain part.
          *   *Actually, a better framing for JC:* The "observation" is not the report. The observation is the *uncertain sensory experience*. In software terms, the "observation" is the raw voltage, which doesn't map 1:1 to a boolean "Anomalous". The partition is the discrete interpretation of that voltage.
          *   *Let's align with the User's phrasing:* "Sensor returns report 'anomalous'... ambiguous."
          *   Okay, if the report is *already* generated as text "anomalous", standard BC usually applies *unless* we doubt the report's generation.
          *   *Better JC framing:* The "evidence" is the *arrival* of the report, but the *content* is uncertain.
          *   *Actually, the strongest JC argument here:* The engineer is overriding the likelihood model. The engineer says, "I don't care what $P(\text{Report}|\text{Fault})$ says. My expert judgment is that this specific instance is 70% likely Fault."
          *   *Wait, that's just setting a prior.* No, it's setting a posterior over the partition.
