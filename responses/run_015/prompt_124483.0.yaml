answer: |-
  So Dennett's got this old two-bitser, right? Little vending machine sensor, two states: "quarter" or "fake." Searle says it's got zero *original* intentionality, just derived stuff we project onto it. But imagine some grad student wires in a third state—"maybe quarter?"—and calls it a three-bitser. Suddenly the thing buzzes and claims, "Hold up, with this extra bit of nuance, I'm not just simulating belief anymore. I've achieved original intentionality. I *feel* the ambiguity."

  Searle walks by, glances at the circuitry, and says, "Nice try, but you're still just shuffling symbols. More syntax doesn't create semantics."
  Dennett shrugs and says, "Look, if assuming it feels conflicted helps me predict when it'll jam, I'm adopting the intentional stance anyway."
  Turns out the difference between a soul and a switch is just derieved intentionality with enough confidence to argue about it.

  Searle denies the machine's semantics because syntax lacks intrinsic aboutness, while Dennett accepts it pragmatically because the intentional stance yields predictive power.
