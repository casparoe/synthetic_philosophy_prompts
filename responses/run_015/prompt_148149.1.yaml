answer: |-
  Here is the committed account you asked for.

  ### The Principle: Functional Gravity vs. Institutional Friction

  There is a coherent principle that unifies your four cases, but it requires you to abandon one of your gut reactions. The principle is **The Ratio of Functional Gravity to Institutional Friction.**

  *   **Functional Gravity:** The objective pressure exerted by physics, economics, or biology that pulls a system toward a specific optimal state. (e.g., transmission loss, solar year length).
  *   **Institutional Friction:** The cost of switching states, driven by network effects, sunk costs, or coordination problems (hysteresis).

  **The Rule:** History looks like a "tidy story" (determinism) when Functional Gravity exceeds Institutional Friction. History gets "stuck in a rut" (contingency) when Institutional Friction exceeds Functional Gravity.

  To measure this, we use your borrowed concept, refined: **Counterfactual Robustness.** If you "rewound the tape" of history, would the outcome re-emerge?
  *   **High Robustness:** Multiple paths lead to the same outcome (Gravity wins).
  *   **Low Robustness:** The outcome depends on a specific, fragile chain of events (Friction wins).

  ### Mapping Your Four Cases

  Here is how the principle classifies your examples, and where you must bend your intuition.

  **1. QWERTY: The Pure Rut (Low Gravity, High Friction)**
  *   **Gravity:** Negligible. The efficiency difference between QWERTY and Dvorak is marginal for general use.
  *   **Friction:** Massive. Retraining millions of typists and replacing hardware creates a coordination lock-in.
  *   **Verdict:** **Low Counterfactual Robustness.** If Sholes hadn't patented QWERTY, we might easily be on a different layout. This is a true historical rut. Your intuition is correct.

  **2. Railway Gauge: The Convergent Rut (Medium Gravity, High Friction)**
  *   **Gravity:** Moderate. Physics dictates *a* standard is needed for interoperability, and stability limits the width, but the exact inch count is not physically mandated.
  *   **Friction:** High. Once track is laid, changing it is prohibitively expensive.
  *   **Verdict:** **Class Robustness, Token Fragility.** If you rewound the tape, a *standard gauge* would inevitably emerge (Gravity), but it might be 5 feet instead of 4'8.5" (Friction/Contingency). Your intuition that standardization was inevitable is correct, but you underestimate how much the specific measurement is a "rut."

  **3. The Gregorian Calendar: The Tidy Story (High Gravity, Medium Friction)**
  *   **Gravity:** Extreme. The solar year is a fixed physical constant. Drift is measurable and disruptive to agriculture/religion.
  *   **Friction:** Medium. Political and religious resistance slowed adoption (Russia waited until 1917), but the functional benefit eventually crushed the friction.
  *   **Verdict:** **High Counterfactual Robustness.** Any calendar system ignoring the solar year fails. The specific algorithm (leap years) might vary, but the *adoption of solar accuracy* was inevitable. Your intuition is correct.

  **4. AC vs. DC: The Correction (High Gravity, Medium Friction)**
  *   **Your Intuition:** You view this as genuinely open/contingent, dependent on Edison's PR or the Niagara contract.
  *   **The Principle's Verdict:** **You must abandon this.** AC/DC is structurally identical to the Gregorian Calendar, not QWERTY.
  *   **Why:** In the 1890s, the physics of transmission ($Power Loss = Current^2 \times Resistance$) mandated high voltage for long distances. Without solid-state electronics (invented a century later), only AC could be stepped up/down efficiently via transformers. DC was physically incapable of building a national grid.
  *   **Robustness:** **High.** Even if Edison had won the PR war, the grid would have failed or been forced to convert within a decade. The Niagara contract didn't *make* AC win; it *revealed* that AC had already won on physics. This is a "tidy story" disguised as a war.

  ### The Sacrifice

  To maintain a coherent theory, **you must drop the idea that AC/DC was contingent.** Treating it as an open fight is a "Great Man" fallacy. It attributes the outcome to Edison's smear campaign rather than the voltage drop equation. If you keep AC/DC as contingent, you cannot distinguish it from QWERTY, and your theory collapses into "everything is a story." By reclassifying it as determined (like the Calendar), you create a clean split between *physical constraints* (Calendar, AC) and *coordination constraints* (QWERTY, Gauge).

  ### Predictions for New Cases

  Applying **Functional Gravity vs. Institutional Friction** allows us to predict the status of unmentioned technologies.

  **1. The Unix File Hierarchy (`/bin`, `/etc`, `/home`)**
  *   **Gravity:** Low. A hierarchical tree is robust (gravity), but the specific directory names and locations are arbitrary. Object-oriented or database-driven file systems are technically viable.
  *   **Friction:** High. Decades of scripts, documentation, and developer muscle memory are tied to POSIX standards.
  *   **Prediction:** **A Rut.** The hierarchy will persist not because it is optimal, but because the friction of rewriting the world's infrastructure exceeds the gravity of better designs. It is the QWERTY of operating systems.

  **2. The Metric System (Science vs. UK Road Signs)**
  *   **Science:** **High Gravity.** Calculation efficiency (base 10) reduces error. Friction is low (scientists are retrained every generation). **Outcome:** Tidy Story (Global adoption).
  *   **UK Road Signs:** **Low Gravity.** Driving safety is not significantly impacted by miles vs. kilometers. **High Friction.** Replacing every physical sign and retraining public intuition is politically toxic. **Outcome:** A Rut.
  *   **Prediction:** Science will remain metric forever. UK road signs will remain Imperial until the cost of maintaining old signage exceeds the cost of replacement (a purely economic friction threshold, not a functional one).

  ### Verdict on "Counterfactual Redundancy"

  You asked if this concept is a fancy metaphor. **It is not; it is the correct metric, but you must rename it "Counterfactual Robustness."**

  *   **Redundancy** implies "spare parts" (multiple paths to the *same* outcome).
  *   **Robustness** implies "resilience" (the outcome survives perturbations).

  In evolutionary biology, eyes evolved independently multiple times (Redundancy), proving that vision is a robust solution to the problem of light detection (High Gravity).
  *   If a historical outcome has **High Counterfactual Robustness** (like the Calendar or AC), it is a **Tidy Story**. The "rut" is actually a valley of attraction.
  *   If it has **Low Counterfactual Robustness** (like QWERTY), it is a **Rut**. The valley is shallow, and we are stuck there only because the walls of friction are high.

  ### Summary

  History is not binary. It is a landscape of valleys.
  *   **Deep Valleys (High Gravity):** AC, Gregorian Calendar. You fall in them regardless of where you start. (Tidy Stories).
  *   **Shallow Valleys (Low Gravity):** QWERTY, Unix paths. You only stay in them because climbing out is expensive. (Ruts).
  *   **The Bend:** You must accept that AC/DC was never a real fight. The physics had already decided the winner before the PR campaign began. Once you accept that, the principle holds across all cases.
