prompt: |-
  Next tuesday I'm presenting at our phil-mind/phil-bio seminar. My claim: Darwin's inversion — selection producing design without a designer's comprehension — and Turing's inversion — an observer attributing comprehension to a system with none — aren't parallel analogues like people assume; they run in opposite directions of fit, and that confusion has occured in a lot of literature linking evolutionary design to machine intelligence. Audience is half philosophers of biology who think selectionist explanations are rock-solid and half cognitive-science people who treat the turing test as dead but still implicitly lean on it. I need the objections they'll actually raise, in roughly the order they'll hit, phrased in their own vocabulary not generic strawmen. For each: how damaging, what do I concede upfront, my two-minute reply, and where that reply is weakest. Include the question I'm praying nobody asks — probably whether I'm smuggling teleology back into Darwin — and flag the weakest point in my own position that I should defend rather than hide. Keep it under 300 words, bullet format ok, no bibliographies or citation lists since I need this usable offline. Don't quote my abstract back at me; I used opposite directions of fit but I'm not sure that's standard terminology, so treat it as my own framing.
