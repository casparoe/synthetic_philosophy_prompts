  *   **(b) Ontological Prohibition:** 0.55
      *   *Justification:* Momentariness denies a container for summing value, but causal interdependence allows functional relation without a metaphysical owner.
  *   **(c) Stream-Indexing:** 0.35
      *   *Justification:* Treating causal streams as welfare buckets is a conceptual construct (*paññatti*) incompatible with strict ultimate-truth (*paramattha*) ontology.
  *   **(d) Meta-ethical Grounding:** 0.80
      *   *Justification:* Buddhist ethics traditionally privileges pragmatic efficacy (*upāya*) and conventional coherence over rigid metaphysical grounding for normative rules.

  **Sensitivity Analysis:**
  The result is most sensitive to **Term (c)**. If the *santāna* (causal continuum) can be philosophically defended as a valid ontological unit for ethical valuation rather than a mere convenient fiction, the credence rises above 0.70, as it resolves the "smuggling" constraint.

  **Shift Condition for Least-Confident Term (c):**
  The specific argument that would shift my confidence is a demonstration that *kamma-vipāka* (karmic result) mechanisms inherently track welfare across moments in a way that renders the *santāna* ontologically robust enough to bear aggregate value without reifying a self.

  **The 0.7 vs. 0.3 Gap:**
  The divergence between a high-credence view (Buddhist Utilitarianism is viable) and a low-credence view (It is anachronistic) mostly concerns **Term (a)**. Proponents of the high-credence view interpret *karuṇā* (compassion) and the universal nature of *dukkha* as implying an aggregate consequentialist goal, whereas proponents of the low-credence view interpret the soteriological aim as strictly agent-relative liberation (*nibbāna*), rendering aggregate maximization a category error.
