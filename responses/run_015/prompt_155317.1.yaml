answer: |-
  Look, if we're stripping the Williams vs. Appiah debate down to the studs of mechanism design, we're basically asking: was the abolition of dueling and slavery a coordination failure correction, or a signaling market crash?

  Here's the restatement using your toolkit.

  ### 1. Williams: Shame as Endogenous Punishment in Coordination Games
  Williams is basically arguing that these institutions weren't held together by material payoffs alone, but by a specific Nash equilibrium sustained by decentralized enforcement. Think of the "Honor Code" as a correlated equilibrium device.

  In the dueling game, the strategy profile is (Challenge, Accept). If you deviate (Refuse), you get a massive negative payoff, not because of the material cost of the duel, but because of the *shame* penalty. In mech design terms, shame is an endogenous punishment technology. It's costless for the community to administer (just gossip/ostracization) but high-cost for the receiver.

  Williams suggests moral change isn't just about changing the material payoffs (e.g., guns get expensive). It's about shifting the *focal point*. The "thick ethical concept" of Honor is the common knowledge that sustains the equilibrium. When Williams talks about the shift, he's describing a moment where the punishment threshold becomes endogenous and unstable. If enough agents stop punishing the deviator (the person who refuses a duel), the IC constraint for the "Accept" strategy breaks. The equilibrium collapses not because the game changed, but because the belief system coordinating the punishment mechanism evaporated. It's a sudden jump from a high-shame equilibrium to a low-shame one, driven by a change in what is commonly known to be punishable.

  ### 2. Appiah: Status Goods and Hidden Types
  Appiah's take fits a signaling model with hidden types. Agents have a hidden type $\theta \in \{ \text{Civilized}, \text{Barbaric} \}$. They want to signal $\text{Civilized}$.

  Initially, owning slaves or dueling is the signal. It's costly, so it separates the types. But Appiah emphasizes the role of argument and conversation. In signaling terms, this is cheap talk that eventually becomes costly. As the discourse shifts among the elite (the high-status types), the value of the signal flips.

  Here's where the "falling returns" come in. Status goods are positional. If everyone owns slaves, slave-ownership no longer signals elite status; it just signals you're a standard player. To distinguish yourself, the top decile needs a new signal. Appiah argues that moral progress is driven by elites adopting new norms (abolitionism) to distinguish themselves from the *nouveau riche* or the "vulgar."

  So, the old status good (slavery) suffers from inflation. Its signaling value drops. The "Civilized" type stops buying it because the ROI on status falls. The mechanism here is a market for moral prestige. When the high-types exit the market for slave-ownership, the pooling equilibrium breaks, and it becomes a negative signal. It's not that people suddenly cared about utility of the slaves; it's that the payoff matrix for the *owners* changed because the currency of honor devalued.

  ### Residue Report: What's Left Over?

  Okay, so we've modeled the transition. Williams = Coordination/Punishment shift. Appiah = Signaling/Status market crash. Both render moral revolutions as equilibrium shifts or payoff restructurings.

  But here's the residue that doesn't fit the model: **Preference Endogeneity and Player Set Expansion.**

  **1. The "Ought" vs. The "Is" of Preferences**
  Mechanism design takes preferences as exogenous. We assume agents maximize $U_i$. In both the Williams and Appiah models, the agents are still maximizing *something* (avoiding shame, gaining status). The "moral progress" is just a change in the argument of the utility function.
  But the phenomenological experience of moral progress—like realizing slavery is *wrong*—feels like a constraint on the utility function itself, not just a price change. It feels like discovering a truth, not just finding a new focal point. In your models, if the status market flipped back (if owning slaves became high-status again), the model predicts a return to slavery. A moral realist would say "No, that's actually forbidden." Mechanism design can't capture the *normative force* that resists the equilibrium shift back. It treats the prohibition as just another cost.

  **2. Recognition as Player Entry**
  This is the bigger gap. In a game, the set of players $N$ is fixed. Moral progress often involves recognizing new entities as players (slaves, women, animals).
  In the Appiah/Williams models, the slaves are just externalities or part of the payoff structure for the masters. When abolition happens, the model says the masters' payoffs changed. But the *moral* claim is that the slaves were *always* players with rights, and the game was misspecified.
  Mechanism design can't model the discovery that a non-player is actually a player. You can model it as adding a constraint, but you can't model the *validity* of that addition within the system. The system has no way to say "this game form is illegitimate."

  ### Verdict: Gap or Decoration?

  Is this residue a gap in mechanism design or just philosophical decoration?

  If you're building a contract or an auction, it's decoration. You don't care if the agents feel they are morally progressing; you care that IC holds. If you can engineer the shame or the status signal to get the outcome you want (abolition), the metaphysics don't matter.

  But if you're trying to explain *stability* over the long run, it's a gap.
  Why? Because equilibrium selection based on status or shame is fragile. If the status market flips, the norm dies. But some moral norms (like "don't murder") seem robust even when the status payoff disappears.
  There's a "preference transformation" happening that isn't just strategic. People internalize the norm so that violating it creates disutility *even with zero probability of detection*. You can model this as an infinite horizon repeated game with a high discount factor, or a specific utility term for "conscience." But that's just parameter tuning.

  The real gap is that mechanism design is a tool for *managing* conflict given preferences, not for *resolving* the validity of preferences. The "moral recognition" part—the moment someone says "this person counts"—is outside the game. It's the move that sets up the board.

  So, yeah, there's residue. It's the difference between changing the rules of the game and realizing you're playing the wrong game. Mechanism design is great at the former, silent on the latter. Whether that's a bug or a feature depends on if you think moral truth exists or if it's just a stable equilibrium we tell stories about. Given your field, you probably treat it as the latter, but don't be surprised when the model fails to predict why people stick to norms that are strictly dominated by material interest. That's the ghost in the machine.
