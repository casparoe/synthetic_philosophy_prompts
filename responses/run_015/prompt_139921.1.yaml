      *   *The Deprivationist/Epicurean Clash:* You can't hold the Existence Requirement (1) and be a Deprivationist (2) without serious modification. Epicurus used (1) to kill (2). Deprivationists (like Feldman) usually reject (1) or interpret "harm" as timeless.

  5.  **Structuring the Response:**
