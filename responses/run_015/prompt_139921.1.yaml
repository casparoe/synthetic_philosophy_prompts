      *   (2) **Deprivationism:** Death is bad because it takes away good life. (Feldman-style).
      *   (3) **Hedonism:** Welfare = balance of pleasure/pain in conscious experience.
      *   (4) **Comparative Account:** Badness of death = difference between actual life and possible longer life. (Rejects absolute account).
      *   (5) **Age Sensitivity:** Dying young is worse than dying old (even controlling for remaining lifespan potential in the specific case described).
      *   (6) **Posthumous Harm:** Events after death can be bad for the deceased.
      *   (7) **Asymmetry & Practical Conclusion:** Pre-natal non-existence isn't bad; post-mortem is. Fear of death is irrational despite death being bad.

  3.  **Brainstorming Tensions (The "Pressure Points"):**

      *   *Tension A: (1) vs. (6).* This is the big one. (1) says no subject, no harm *at a time*. (6) says posthumous events harm the dead. If I don't exist when my reputation is trashed, how can it be bad *for me* according to (1)? This looks like a flat contradiction unless "at a time" is doing heavy lifting or the harm is located at the time of death (timeless harm).
      *   *Tension B: (1) vs. (2).* Epicurus used (1) to argue death is *nothing* to us. (2) says death *is* bad. Deprivationism usually requires rejecting the existence requirement (or modifying it significantly). If I don't exist, I can't be deprived *at that time*. Deprivationists usually say the harm is *at the time of death* or *timelessly*. But (1) says "nothing can be good or bad for you *at a time* at which you don't exist." If the harm of deprivation is located in the future time you *would* have existed, (1) blocks it.
      *   *Tension C: (3) vs. (2)/(4).* Hedonism says value is conscious experience. Deprivationism says death is bad because of *lost* conscious experience. This fits well *except* for the fact that the lost experience never happens. If value requires conscious experience (3), how can the *absence* of it constitute a harm (2) without violating (1)?
      *   *Tension D: (5) vs. (4).* (4) is a strict comparative account (Actual vs. Possible). (5) introduces a weighting based on age/narrative structure that seems to go beyond simple sum-total of pleasure. In the example given (22yo dies at 24 vs 92yo dies at 110), the 92yo loses 18 good years. The 22yo loses 2 good years. A strict comparative hedonist should say the 92yo's death is worse (more pleasure lost). But (5) says the 22yo's death is worse. This contradicts the pure math of (3) + (4).
