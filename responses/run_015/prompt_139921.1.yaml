      *   *Tension F: (1) vs. (7) Asymmetry.* If (1) applies to pre-natal non-existence (no subject), why doesn't it apply to post-mortem (no subject)? Lucretius says they are symmetric. User says no. Needs a principled difference, not just "it falls out."

