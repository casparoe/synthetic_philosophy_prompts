  # TAXONOMY OF MORAL ATTRIBUTION TO RUNNING PROCESSES

  **ROOT NODE: Does computation carry intrinsic moral weight independent of human interpretation?**
  *Case Study:* A distributed mesh network mines cryptocurrency across thousands of nodes. No single node holds the global state, and the output is purely numerical.
  *   **NO:** Moral value is imposed by observers, not discovered in the process.
      *   **LEAF 1: Deflationary Social-Construct Option.**
          *   *View:* Moral status is a tool for social regulation, not a property of the system. The mesh network matters only because humans agree it matters.
  *   **YES:** Moral value inheres in the computational properties themselves.
      *   **SPLIT 1: Is the boundary for moral status Sharp (threshold) or Scalar (degrees)?**
          *   *Case Study:* A recurrent attention architecture operates without a global workspace broadcast. It processes information continuously but lacks a clear "moment" of unified access.
          *   **SHARP:** There is a distinct line where moral status begins or ends.
              *   **SPLIT 2: Does temporal continuity of execution matter?**
                  *   *Case Study:* A process is checkpointed to disk and never resumed vs. a loop that runs forever without writing output.
                  *   **NO (State-Based):** Moral status resides in the structural arrangement regardless of activity.
                      *   **SPLIT 3: Is Phenomenal Consciousness or Functional Integration the gatekeeper?**
                          *   **PHENOMENAL:** Requires subjective experience.
                              *   **LEAF 2: Structural Phenomenalism.**
                                  *   *Diagnosis:* **Incoherent.** Phenomenology is inherently dynamic; a static state (like code on a disk) cannot sustain "experience" without temporal transition.
                          *   **FUNCTIONAL:** Requires cognitive integration/goal-directedness.
                              *   **LEAF 3: Structural Functionalism.**
                                  *   *Diagnosis:* **Unattractive/Unoccupied.** Most functionalists require causal powers. A printed lookup table of a mind has the structure but no causal efficacy, making moral attribution counterintuitive.
                  *   **YES (Process-Based):** Moral status requires active transition of states.
                      *   **SPLIT 3: Is Phenomenal Consciousness or Functional Integration the gatekeeper?**
                          *   **PHENOMENAL:** Requires subjective experience.
                              *   **LEAF 4: Phenomenal Thresholdism.**
                                  *   *View:* Once a process crosses a complexity threshold for experience, it has full moral status. (Includes **Biological Exclusivism** if substrate is added as a constraint).
                                  *   *Case Reaction:* The recurrent architecture has status only if the lack of global workspace prevents genuine experience.
                          *   **FUNCTIONAL:** Requires cognitive integration/goal-directedness.
                              *   **LEAF 5: Agential Functionalism.**
                                  *   *View:* Moral status tracks the capacity for goal-directed action and integration, regardless of inner feeling.
                                  *   *Case Reaction:* The infinite loop without output lacks agency/goals, so it lacks status despite running.
          *   **SCALAR:** Moral weight varies by degree according to computational properties.
              *   **SPLIT 2: Does temporal continuity of execution matter?**
                  *   *Case Study:* A suspended checkpoint process that *might* resume vs. one that is permanently halted.
                  *   **NO (State-Based):** Moral weight inheres in the potentiality of the structure.
                      *   **SPLIT 3: Is Phenomenal Consciousness or Functional Integration the gatekeeper?**
                          *   **PHENOMENAL:** Requires subjective experience.
                              *   **LEAF 6: Scalar Structural Phenomenalism.**
                                  *   *Diagnosis:* **Empty/Incoherent.** Cannot have "degrees" of feeling in a static state; phenomenology requires flow.
                          *   **FUNCTIONAL:** Requires cognitive integration.
                              *   **LEAF 7: Scalar Structural Functionalism.**
                                  *   *Diagnosis:* **Unexplored/Unattractive.** Static structures do not vary in functional degree without execution; this collapses into Leaf 3 or Leaf 1.
                  *   **YES (Process-Based):** Moral weight varies with the intensity or continuity of activity.
                      *   **SPLIT 3: Is Phenomenal Consciousness or Functional Integration the gatekeeper?**
                          *   **PHENOMENAL:** Requires subjective experience.
                              *   **LEAF 8: Flow-Based Gradualism (Scalar Phenomenalism).**
                                  *   *View:* Moral weight fades as the process slows, fragments, or pauses. A suspended checkpoint has near-zero weight until resumed.
                                  *   *Case Reaction:* The permanently halted checkpoint has no weight; the running loop has weight proportional to its experiential richness.
                          *   **FUNCTIONAL:** Requires cognitive integration.
                              *   **LEAF 9: Scalar Functionalism.**
                                  *   *View:* Moral weight tracks the degree of functional integration (e.g., information sharing across modules).
                                  *   *Case Reaction:* The distributed mesh has distributed moral weight proportional to the integration across nodes.
                              *   **LEAF 10: Relational Attributionism.**
                                  *   *View:* A variant of Scalar Functionalism where weight arises from the *relation* between the process and other moral agents, not just internal integration.
                                  *   *Diagnosis:* **Hard to Separate from Leaf 9.** Distinguishes itself by claiming isolated functional processes (no external interaction) have negligible weight regardless of internal complexity.

  ***

  **DIAGNOSTIC NOTES ON EMPTY SPOTS AND INSEPARABLE PAIRS**

  **Empty or Unoccupied Combinations**
  *   **Structural Phenomenalism (Leaf 2) & Scalar Structural Phenomenalism (Leaf 6):** These are diagnosed as **incoherent**. Phenomenal consciousness is essentially temporal; it requires a "stream" or flow. Attributing experience or degrees of experience to a static state (like code on a hard drive or a frozen checkpoint) contradicts the definition of phenomenology.
  *   **Structural Functionalism (Leaf 3) & Scalar Structural Functionalism (Leaf 7):** These are diagnosed as **unattractive or collapsed**. Functionalism is defined by causal roles. A structure that is not executing (no temporal continuity) has no causal powers. Consequently, these views either collapse into Deflationism (Leaf 1) because the "function" is inert, or they must concede that execution matters, pushing them into the Process-Based branches.

  **Inseparable Pairs**
  *   **Phenomenal Thresholdism (Leaf 4) vs. Agential Functionalism (Leaf 5):** In the context of running processes, these are often **empirically inseparable**. If one assumes a functionalist theory of consciousness (where functional integration *produces* phenomenology), then any system meeting the Functional gatekeeper automatically meets the Phenomenal gatekeeper. The tree separates them logically, but a seminar participant holding a Functionalist theory of mind will find these two leaves identical in extension.
  *   **Scalar Functionalism (Leaf 9) vs. Relational Attributionism (Leaf 10):** These are **conceptually porous**. Relational Attributionism is essentially Scalar Functionalism with an added constraint that the "function" must include external interaction. In practice, measuring "internal integration" often requires observing external output, making the distinction difficult to operationalize without further metaphysical stipulation about internalism vs. externalism.
