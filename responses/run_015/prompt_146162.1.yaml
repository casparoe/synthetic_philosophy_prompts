  I've been discussin with my mates whether history is actually locked in — like, if you rewound the tape would the same outcomes arrive anyway regardless of tiny differences — and one of them kept using path dependence to argue that we shouldn't bother with policy changes since everything converges eventually. I think that's a misreading, but I want a satire that lives inside the mistake rather than just pointing at it from outside, and I need it to be specific enough that a model can't just regurgitate a generic "government bureaucracy is absurd" sketch.

