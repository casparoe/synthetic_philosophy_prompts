answer: |-
  **MEMORANDUM**

  **TO:** Admissions Criteria Review Committee
  **FROM:** Committee Chair
  **DATE:** 14 March
  **SUBJECT:** Recommendation on Character and Integrity Assessment

  We must report our recommendation to the Dean before the 21 March vote. The governing board's policy is non-negotiable: holistic review must include a dimension of personal character and integrity. However, the policy does not define how that dimension is measured. Our current instrument—two teacher recommendation letters soliciting global trait adjectives—has been criticized by external review as unreliable, potentially no better than random. We cannot retain a broken tool, but we must not replace it with one that measures the wrong thing or introduces new inequities.

  The Psychology Department proposes replacing letters with the Contextualized Behavior Inventory (CBI). This instrument solicits reports from six independent observers across different settings, crediting traits only where reports converge. Their pilot data (n=380) is compelling: cross-setting agreement on global traits was near zero, yet within-setting observations were stable. Crucially, specific behaviors in specific settings predicted conduct violations better than any overall character score.

  Our committee is divided. Two members argue we should retain teacher letters. Their strongest point is not nostalgia, but depth: a teacher observing a student over years captures growth and resilience that a snapshot inventory misses. They argue that reducing character to behavioral checklists ignores the narrative arc of moral development. Two members argue for immediate adoption of the CBI, prioritizing the empirical predictive validity demonstrated in the pilot.

  I recommend we adopt a **revised version of the CBI with stated conditions and a validation timetable.**

  My hesitation stems from two distinct concerns, one philosophical and one structural, which this recommendation addresses.

  First, to my colleagues in philosophy: The CBI measures behavioral frequency, not virtue. On an Aristotelian account, virtue is a settled disposition of perception, judgment, and desire, not merely the repetition of acts. A student may act honestly in a lab because they fear expulsion, not because they value truth. The CBI cannot distinguish between compliance and character. However, as an admissions body, we cannot access internal dispositions; we can only assess reliable conduct. We must therefore be honest that we are selecting for *predictable behavioral reliability*, not moral worth. Adopting the CBI requires us to rename the criterion in our internal documentation from "Character" to "Conduct and Integrity," acknowledging we are measuring what students *do*, not who they *are*.

  Second, to my colleagues in psychology: The pilot data reveals a surveillance bias. The specific behaviors predictive of violations were drawn from settings where applicants are watched closely. Requiring six observers across diverse settings disadvantages applicants from backgrounds where adult supervision is scarce or private life is necessarily opaque (e.g., students caring for siblings or working off-the-books). If we require six observers, we may be penalizing independence or socioeconomic necessity. Therefore, adoption must be conditional on reducing the observer requirement to three verified settings and weighting them equally, regardless of "supervision density."

  Furthermore, we must commit to a validation timetable. We will implement the revised CBI for one admissions cycle. Before full integration, the Psychology Department must analyze the admitted cohort for disparate impact based on socioeconomic status and setting type. If the instrument disproportionately filters out students from low-surveillance environments, we must recalibrate.

  This path respects the psychologists' demand for data-driven prediction while addressing the philosopher's concern that we not mistake behavior for virtue, and the equity concern that we not mistake privilege for character. It also acknowledges the letter-proponents' concern by allowing for a "longitudinal supplement" where a single observer has known the applicant for more than three years, which may substitute for two of the six required observations.

  We are building a system that is imperfect but honest. We are not judging souls; we are assessing risk and reliability within the specific contexts we can verify.

  **Draft Notification for Applicants Not Admitted on Character Grounds**

  If we proceed, we must be able to explain a rejection clearly. Below is the draft language for an applicant denied admission based on this criterion. It avoids moralizing and focuses on the evidentiary standard we applied.

  > "The Honors College requires evidence that an applicant will contribute to a community of trust and integrity. Our review relies on converging reports from multiple observers regarding specific behaviors in academic and social settings. In your case, the reports provided did not demonstrate a consistent pattern of conduct aligned with our community standards across the required contexts. This decision is not a judgment on your overall worth or potential, but reflects our inability to verify the behavioral reliability necessary for participation in this specific program based on the evidence available."

  Please review this recommendation and the draft language. We will vote on this direction at our next meeting.
