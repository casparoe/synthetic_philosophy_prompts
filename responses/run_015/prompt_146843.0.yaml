answer: |-
  This is a sophisticated position, often associated with "local trait" theories (e.g., Nancy Snow) or neo-Aristotelian responses to situationism (e.g., Kristjánsson). It attempts to save the *reality* of virtues by shrinking their *scope*. To evaluate this, we must distinguish between empirical adequacy (does the psychology hold?) and normative adequacy (does it still count as ethics?).

  Here are the arguments and findings that count against your ecological-disposition account, sorted by decisiveness, including concessions a sophisticated defender would likely make.

  ### I. Decisive Challenges (Threaten the Core Coherence)

  **1. The "Epiphenomenal Disposition" Problem (Theoretical Collapse)**
  *   **The Argument:** If the stability of the behavior is primarily caused by the *scaffolding* (institutional rules, social pressure, physical affordances) rather than the internal disposition, the "virtue" becomes epiphenomenal. If the surgeon is calm *because* the OR protocol forces calm, not because of an internal state, you have not saved virtue ethics; you have described sophisticated situationism.
  *   **Psychological Finding:** Studies on "ego depletion" and automaticity suggest that when cognitive load increases, behavior reverts to baseline heuristics regardless of domain training. If the "ecological disposition" vanishes under slight stress within the domain, it was never a disposition.
  *   **Defender Concession:** A honest defender must admit that if the disposition contributes less predictive power than the situation *within the specific domain*, the term "virtue" is being used metaphorically. If the view cannot specify a threshold where the *agent* carries at least 40–50% of the explanatory weight, it collapses into situationism with extra vocabulary.

  **2. Failure of Intra-Domain Consistency (Empirical Falsification)**
  *   **The Argument:** Your view predicts *domain-clustered* behavior. Even if virtues don't cross from the OR to traffic, they must be stable *within* the OR across different types of surgeries, shifts, and stress levels.
  *   **Psychological Finding:** Hartshorne and May's classic studies on honesty (often cited by situationists) showed low consistency even within similar contexts (e.g., cheating on a math test vs. cheating on a spelling test). More recent replication efforts in social psychology suggest that "local traits" often fail to predict behavior even in moderately varied situations within the same domain.
  *   **Decisive Evidence:** If data shows that a surgeon's calmness correlates more strongly with *time of day* or *specific team composition* than with their "surgeon disposition," the ecological account fails. The disposition must be the stabilizing variable *within* the ecology. If the ecology is too granular (e.g., "calm only in OR B with Nurse X"), the "trait" dissolves into a stimulus-response reflex.

  **3. The Novelty/Resilience Problem (Normative Failure)**
  *   **The Argument:** Virtue ethics is traditionally valued for guiding action in *unstructured* or *novel* situations where rules run out. If virtues are ecologically embedded, they should fail when the scaffold breaks (e.g., a surgeon in a field hospital without equipment).
  *   **Decisive Critique:** If your account admits the agent loses their virtue when the institution vanishes, it fails as a guide for moral life, which frequently involves navigating institutional breakdowns or conflicting institutional demands.
  *   **Defender Concession:** Defenders must concede that this view cannot account for *moral heroism* or *whistleblowing*, which often requires acting *against* the immediate institutional affordances. If the theory explains compliance well but cannot explain righteous deviation, it is a theory of socialization, not ethics.

  ### II. Awkward Challenges (Costly but Survivable)

  **4. The Fragmentation of the Self (Conceptual Cost)**
  *   **The Argument:** Classical virtue ethics aims at *eudaimonia* (flourishing) which requires a unified self. Your view accepts a fragmented agent (honest at work, liar at home).
  *   **Awkwardness:** This forces you to abandon the claim that virtue leads to happiness or psychological integration. You are defending "functional excellence," not "human flourishing."
  *   **Defender Concession:** Defenders concede this sacrifices the Aristotelian unity of virtues. It makes the theory less ambitious but perhaps more realistic. It is awkward, but not fatal, provided you stop claiming it leads to *eudaimonia*.

  **5. The Measurement/Identification Problem (Methodological Cost)**
  *   **The Argument:** If virtues are context-dependent, identifying who is virtuous requires mapping every specific ecology they inhabit. This makes moral assessment practically impossible.
  *   **Awkwardness:** We cannot praise the person, only the person-in-context. This undermines our practices of hiring, trusting, or loving others, which rely on cross-context predictions.
  *   **Defender Concession:** Defenders admit this makes moral character opaque. We can never truly know if someone is "good," only if they are "good-at-X-in-context-Y." This is a pragmatic bullet to bite.

  ### III. The Insulation and Falsifiability Question

  **Is being well-insulated a problem?**
  Yes. In scientific and philosophical theorizing, insulation becomes a vice when it is achieved by **immunizing stratagems** rather than **explanatory power**.

  *   **The Risk of Unfalsifiability:** If every failure of virtue is explained away as "insufficient scaffolding" or "wrong ecology," the theory becomes unfalsifiable.
      *   *Example:* "Why did the honest banker steal?" -> "The ecological affordances for honesty were removed."
      *   *Counter:* "What evidence would prove the affordances were present?" If the only proof of affordances is the behavior itself, the argument is circular.
  *   **Defender Concession:** A rigorous defender must define "scaffolding" independently of the behavior it produces (e.g., via institutional audit or social network analysis). If they cannot specify the necessary and sufficient conditions for an "virtue-supporting ecology" without referencing the outcome, the view is insulated to the point of emptiness.

  **Does this undermine the view?**
  It undermines the view's claim to be a *virtue* theory. If the "virtue" is entirely dependent on the scaffold, you have built a theory of **Institutional Design**, not Character Ethics. You have saved the *phenomenon* of reliable behavior, but you have relocated the *locus* of virtue from the agent to the environment.

  ### IV. Summary of Damaging Concessions

  A defender of the ecological-disposition account should concede the following as damaging, though perhaps not fatal:
  1.  **Agency Reduction:** The view reduces the moral agent's contribution to behavior significantly more than classical virtue ethics allows.
  2.  **No Moral Growth:** If virtues are tied to specific ecologies, "moral growth" cannot be generalizable. You don't become a better person; you become a better operator of specific systems.
  3.  **Vulnerability to Collapse:** If the disposition does not travel *at all* (zero cross-context transfer), the distinction between this view and situationism is merely semantic.

  ### V. Final Assessment

  Your position is empirically robust because it aligns better with data than global trait theory. However, it is normatively fragile. It saves the *prediction* of virtue behavior by sacrificing the *agency* of virtue. It explains why people act well, but not why they *are* good. The insulation against situationist data is successful, but it is achieved by redefining "virtue" so narrowly that it loses its traditional ethical force (guidance in novel situations, unity of self, responsibility).

  Verdict: Well-insulated against data, but undermined by normative hollowness.
