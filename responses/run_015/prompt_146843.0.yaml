      *   *Mechanism:* Stability comes from external scaffolding (institutions, relationships, affordances), not just internal character.
      *   *Implication:* Cross-situational consistency (traditional virtue) is not required.
      *   *Goal:* Save virtue ethics from situationism (Doris, Harman) without denying the empirical data.

  3.  **Brainstorm Counter-Arguments/Evidence (Categorization Strategy):**
      *   *Category 1: Empirical/Psychological Challenges.* Does the data actually support domain clustering? Or is behavior even more fragmented?
      *   *Category 2: Philosophical/Conceptual Challenges.* Does this still count as "virtue"? Does it collapse into situationism?
      *   *Category 3: Normative/Practical Challenges.* If virtues are local, how do we handle novel situations or conflicts between domains?
      *   *Category 4: Falsifiability/Insulation.* Is the view too flexible to be tested?

  4.  **Develop Specific Points (Drafting & Refining):**

      *   *Point 1: The "Collapse" Objection.* If virtues are *only* stable in specific scaffolds, is the "virtue" in the person or the situation? If I take the surgeon out of the OR, they aren't calm. Is "calmness" their virtue or the OR's property? *Defender Concession:* If the disposition doesn't travel *at all*, it's just a habit triggered by stimuli, which is close to situationism.
      *   *Point 2: Cross-Domain Transfer.* Moral growth usually implies learning *from* one context to another. If clustering is too tight, moral education becomes impossible. *Evidence:* Studies on moral transfer (e.g., honesty in one task doesn't predict honesty in another, even similar ones). If *no* transfer occurs, the "disposition" is just a reflex.
      *   *Point 3: The "Fragmented Self" Problem.* If I am honest at work but a liar at home, do I have the virtue of honesty? Aristotelian unity is lost. *Defender Concession:* We must admit this isn't *eudaimonia* in the classical sense. It's a functionalist mimicry.
      *   *Point 4: Novel Situations.* What happens when the scaffold breaks? (e.g., surgeon in a disaster zone without equipment). If the virtue vanishes, was it ever a virtue? *Decisive:* If the account cannot explain moral resilience in *unfamiliar* contexts, it fails as an ethical theory.
      *   *Point 5: Unfalsifiability.* If every failure is blamed on "lack of scaffolding," the theory is safe but empty. *Defender Concession:* We need a baseline for what counts as sufficient scaffolding.

  5.  **Sort by Decisiveness:**
      *   *Decisive:* Evidence that domain-clustering *doesn't exist* (behavior is random even within domains); Evidence that the view cannot guide action in novel/unstructured contexts (normative failure); Proof that it's indistinguishable from situationism (theoretical collapse).
