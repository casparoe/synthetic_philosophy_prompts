answer: |-
  Alice and Bob are co-founders of a biotech startup offered a volatile equity vesting plan tied to ten thousand binary regulatory milestones, modeled as independent coin flips where the $n$-th milestone pays $(-1)^{n+1} \frac{2^n}{n}$ equity units with probability $1/2^n$. If both founders stay (Enter), each receives this standard schedule (scaling factor 1); if only one stays while the other leaves (Declines), the stayer keeps the standard schedule, but the leaver triggers a clawback clause granting them a "consolation" package of negative equity units equal to $(-1)^{n} \frac{2^n}{n}$ with the same probabilities, while mutual departure yields zero.

  **(1) Expected-Utility Failure:** Expected-utility theory cannot rank Enter vs. Decline because the expectation series $\sum_{n=1}^{\infty} \frac{1}{2^n} \cdot (-1)^{n+1} \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n}$ is conditionally convergent. The sum of positive terms ($\sum \frac{1}{2k-1}$) diverges to $+\infty$ and the sum of negative terms ($\sum \frac{-1}{2k}$) diverges to $-\infty$; because the series is not absolutely convergent, the expectation is undefined and changes value based on term ordering.

  **(2) Agent Responses:** A maximin agent identifies the unbounded negative tail (liability grows without limit as $n$ increases for even terms) and Declines to secure 0, avoiding infinite loss. A satisficing agent sets a threshold (e.g., "need 100 units to retire") and Enters, focusing on the non-zero probability of hitting early positive terms that satisfy the threshold, ignoring the undefined mean.

  **(3) Undefined vs. Infinite:** The structural feature making this *undefined* rather than merely *infinite* (like St. Petersburg) is the divergence of *both* the positive and negative sub-series; an infinite expectation requires only the positive side to diverge while the negative remains bounded, whereas here neither side is bounded, preventing any consistent summation.

  **(4) Capping at 1000:** If rounds are capped at $N=1000$, the paradox mathematically vanishes because the sum becomes finite; however, a residue remains near the boundary because the partial sum oscillates significantly depending on whether the cap stops at an odd or even term, making the valuation highly sensitive to the arbitrary cutoff.

  **Coupling Analysis:** The feature doing the actual philosophical work is the **conditional convergence of the series**, not the coupling. If you strip away the coupling, Alice and Bob simply face two isolated Pasadena games where expected utility is still undefined; the coupling does not resolve the indeterminacy, it merely propagates it. The coupling is largely decorative regarding the *expectation* paradox itself, though it adds game-theoretic complexity by making one agent's indeterminacy contingent on the other's choice, demonstrating that undefined expectations are contagious in social contracts even if they don't change the underlying mathematical pathology.
