prompt: |-
  At a recent faculty meeting, two of my colleagues got into a protracted argument about a hiring decision that had just been made, and I have been turning it over ever since. The situation was this. Our department's hiring committee has three members, and they were evaluating a candidate for a tenure-track position. The department had agreed in advance on two criteria: the candidate should be hired if and only if (a) their research program is excellent, and (b) they can cover our undergraduate teaching needs. The three committee members voted as follows:

  - Alvarez: research excellent (yes), teaching fit good (yes) → would vote to hire.
  - Berg: research excellent (yes), teaching fit poor (no) → would vote not to hire.
  - Chen: research mediocre (no), teaching fit good (yes) → would vote not to hire.

  The committee then faced a procedural question: should they vote on each criterion separately and let the conjunction determine the outcome, or should they vote directly on the overall hiring decision? If they vote on criteria separately, both criteria pass 2–1, the conjunction is satisfied, and the candidate is hired. If they vote on the overall decision directly, the vote is 2–1 against hiring.

  My colleague David argued that voting on the criteria separately is the only coherent approach. The department set out two necessary and jointly sufficient conditions; the committee's job is to determine whether those conditions are met. If a majority finds each condition satisfied, then by the department's own standard, the candidate should be hired. To do otherwise — to vote down a candidate who satisfies both criteria according to majority judgment — is to contradict the very standard the department adopted.

  My colleague Esther argued that this outcome is perverse. A majority of the committee does not want to hire this candidate. Two out of three members would vote no on the final decision. If a procedure generates an outcome that a majority opposes, you have undermined the point of having a vote at all. The criteria are tools for reaching a judgment, not axioms from which a hiring decision must be mechanically deduced against the will of the majority.

  David replied that Esther's position amounts to letting the majority be inconsistent: the majority says the research is excellent and the teaching fit is good, yet somehow the candidate should not be hired. If the department's own criteria are correct, that combination makes no sense. Esther countered that there is no inconsistency because "the majority" is not a single person — it is different majorities on different questions, and the only thing that should ultimately matter is what a majority of the committee wants to do.

  David came back with this: suppose the committee had instead voted on each criterion and then, seeing that both passed, someone proposed ignoring that result and voting on the conclusion directly. Wouldn't that look like an attempt to overturn a decision one dislikes by switching the procedure after the fact? Esther answered that this gets the order backwards — the question is which procedure is correct in the first place, not whether you can change it midstream, and her point is precisely that conclusion-based voting is the correct procedure from the start.

  They went back and forth for some time without resolution. I have been asked to weigh in, but I find both arguments compelling in different ways. Please adjudicate this dispute: who is right about which specific point, and is there a principled resolution, or does this reveal a genuine tension in how groups should make decisions?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Scenario:** A faculty hiring committee (3 members: Alvarez, Berg, Chen) evaluating a candidate based on two criteria: (a) Excellent Research, (b) Good Teaching Fit. Hire if and only if (a) AND (b).
      *   **Votes:**
          *   Alvarez: Yes on (a), Yes on (b) $\rightarrow$ Hire.
          *   Berg: Yes on (a), No on (b) $\rightarrow$ No Hire.
          *   Chen: No on (a), Yes on (b) $\rightarrow$ No Hire.
      *   **The Paradox:**
          *   *Premise-based voting (vote on criteria):* (a) passes 2-1 (Alvarez, Berg), (b) passes 2-1 (Alvarez, Chen). Both met $\rightarrow$ Hire.
          *   *Conclusion-based voting (vote on outcome):* Hire passes 1-2 (Only Alvarez). $\rightarrow$ No Hire.
      *   **The Dispute:**
          *   *David (Premise-based):* Coherent with department standards. Majority says both criteria met. To reject is inconsistent with the standards.
          *   *Esther (Conclusion-based):* Democratic legitimacy. Majority opposes hiring. Criteria are tools, not axioms. "The majority" isn't a single agent.
      *   **Task:** Adjudicate the dispute. Who is right about which point? Is there a principled resolution? Does this reveal a genuine tension?

  2.  **Identify the Core Philosophical/Logical Problem:**
      *   This is a classic example of the **Discursive Dilemma** (or the **Doctrinal Paradox**).
      *   It originates in legal theory (Kornhauser & Sager, 1986) and social choice theory (List & Pettit).
      *   The core tension is between *collective rationality* (consistency with premises) and *majoritarian democracy* (responsiveness to individual judgments on the conclusion).

  3.  **Evaluate David's Argument (Premise-Based Procedure - PBP):**
      *   *Strengths:* Ensures the group acts as a rational agent. If the group accepts $P$ and $Q$, and accepts $P \land Q \rightarrow R$, then the group should accept $R$. It respects the ex-ante agreed-upon rules. It prevents "cycling" or inconsistency in the group's stance.
      *   *Weaknesses:* Can lead to an outcome that no individual actually supports (wait, in this case, Alvarez supports it, but Berg and Chen don't). Actually, in this specific case, the outcome (Hire) is supported by only 1/3 of the committee. This feels undemocratic. It imposes a "collective will" that differs from the will of the majority of individuals.

  4.  **Evaluate Esther's Argument (Conclusion-Based Procedure - CBP):**
      *   *Strengths:* Respects individual autonomy and the direct will of the majority. If 2 out of 3 say "No Hire," hiring feels like an override. It acknowledges that "the majority" is a shifting coalition, not a single mind.
      *   *Weaknesses:* Can lead to collective irrationality. The group ends up with a set of judgments {Research=Good, Teaching=Good, Hire=No} which violates the logical constraint {Research=Good $\land$ Teaching=Good $\rightarrow$ Hire}. It makes the group look inconsistent.

  5.  **Synthesize and Adjudicate:**
      *   *Is one "right"?* In social choice theory, there is no mathematical "correct" answer without normative assumptions. Both procedures satisfy some desirable properties and violate others.
      *   *David is right about:* Collective rationality and integrity of the rules. If the department cares about the *reasons*, PBP is better.
      *   *Esther is right about:* Democratic accountability and the reality of pluralistic agents. If the department cares about the *outcome's acceptance*, CBP is better.
      *   *The Tension:* It is genuine. It's not a puzzle to be solved by logic alone; it's a trade-off between consistency and responsiveness.

  6.  **Develop a Principled Resolution:**
      *   Since logic doesn't solve it, we need *procedural* or *contextual* criteria.
      *   *Context:* Hiring is high stakes. Consistency matters for precedent. But legitimacy matters for departmental harmony.
      *   *Timing:* David's point about switching procedures mid-stream is strong. The procedure must be decided *ex-ante*.
      *   *Nature of the constraint:* Is the rule "Hire iff A & B" a logical truth or a policy preference?
          *   If it's a strict policy (like a legal doctrine), PBP is usually preferred (Doctrinal Paradox origin).
          *   If it's a heuristic for judgment, CBP might be preferred.
      *   *Recommendation:* Acknowledge the paradox (name it). Validate both perspectives. Suggest that the *ex-ante* agreement on procedure is the only way to avoid the "switching" accusation. Suggest that for hiring, often the "Conclusion-Based" approach is safer for morale, BUT the "Premise-Based" approach is better for maintaining standards.
      *   *Refinement:* Actually, in academic hiring, "Premise-Based" is often how committees *actually* work (scores on research, scores on teaching), but the final vote is usually Conclusion-Based. The conflict arises because they didn't specify *how* to aggregate.
      *   *Best advice:* The department needs to vote on the *voting procedure* before the *hiring procedure*.

  7.  **Drafting the Response:**
      *   **Introduction:** Identify the problem as the "Discursive Dilemma" or "Doctrinal Paradox." This validates the user's feeling that it's a deep, known problem.
      *   **Analyze David:** He champions *Collective Rationality*. The group should act like a consistent agent. Good for rule-of-law/standards.
      *   **Analyze Esther:** She champions *Majoritarian Responsiveness*. The group is a collection of individuals. Good for democracy/legitimacy.
      *   **The "Who is Right" verdict:** Both are right about different normative values. Neither is logically "correct" in a vacuum.
      *   **The "Switching" Point:** David is right that switching mid-stream is manipulative. Esther is right that the *initial* choice matters.
      *   **Resolution:**
          1.  Acknowledge the impossibility theorem (List & Pettit).
          2.  Context matters: Is this a court (PBP) or a legislature (CBP)? A hiring committee is a hybrid.
          3.  Practical advice: Decide the aggregation rule *before* evaluating candidates.
          4.  Specific to this case: Since the department agreed on the *criteria* (A & B $\rightarrow$ Hire) but not the *voting method*, there is ambiguity. However, usually, if you set criteria, you imply PBP. But if you hold a vote, you imply CBP.
          5.  Suggestion: In hiring, CBP is often safer to avoid resentment, but PBP ensures standards. The best fix is to require a supermajority or consensus to avoid these 2-1 splits on criteria leading to 1-2 on outcome.

  8.  **Refining the Tone:**
      *   Needs to be philosophical but practical.
      *   Avoid taking a hard side, but explain *why* each side holds their ground.
      *   Use the terminology of social choice theory (without getting too bogged down).

  9.  **Self-Correction/Nuance Check:**
      *   *Did I miss something?* David argues that rejecting the hire contradicts the standard. Esther argues the standard is just a tool.
      *   *Key Insight:* The "Majority" is indeed not a single person (Esther's strong point). But the "Department" acts as a single entity (David's strong point).
      *   *Resolution:* The tension is irreducible. The solution is procedural clarity *ex-ante*.
      *   *Wait, one more thing:* In this specific scenario, if they vote on premises, the result is Hire (supported by 1 person). If they vote on conclusion, result is No Hire (supported by 2 people).
      *   *Is there a "correct" answer?* List and Pettit show you can't have Universal Domain, Anonymity, Systematicity, and Consistency all at once. So something has to give.
      *   *Advice:* Don't just say "it's hard." Give a recommendation. For hiring, legitimacy (Esther) often trumps logical consistency (David) because the committee members have to work together. However, if the criteria are hard constraints (e.g., legal requirements), David wins. Since these are academic judgments, Esther's view on democratic legitimacy is usually more sustainable, *provided* the procedure was agreed upon beforehand.

  10. **Final Structure:**
      *   Name the Paradox (Doctrinal/Discursive).
      *   Validate David (Consistency/Integrity).
      *   Validate Esther (Democracy/Agency).
      *   Address the "Switching" argument (Procedural Fairness).
      *   Theoretical Limit (Impossibility Theorem).
      *   Practical Resolution (Ex-ante agreement, context of hiring).

  11. (Final Polish): Ensure the distinction between "Premise-Based Procedure" (PBP) and "Conclusion-Based Procedure" (CBP) is clear. Make sure to explicitly answer "Who is right about which specific point."

      *   David is right about: Consistency and the risk of procedural manipulation.
      *   Esther is right about: The nature of collective agency and democratic legitimacy.
      *   Resolution: It's a trade-off, not a logic puzzle. Fix the process for next time. For *this* time? Likely need to discuss the *intent* of the original agreement.

      *Wait, one nuance:* If the department agreed "Hire IF AND ONLY IF A and B", does that imply PBP?
      *   Argument for Yes: You can't determine if "A and B" is true without voting on A and B.
      *   Argument for No: "A and B" is just a guideline for individual voters.
      *   This ambiguity is the root cause.

      *Okay, ready to write.*
answer: |-
  This is a classic problem in social choice theory and political philosophy known as the **Discursive Dilemma** (or the **Doctrinal Paradox**). It was famously formalized by legal scholars Lewis Kornhauser and Lawrence Sager in 1986 and later expanded upon by philosophers like Philip Pettit and Christian List.

  You are not witnessing a simple disagreement; you are witnessing a collision between two fundamental, often incompatible, values of group decision-making: **collective rationality** versus **majoritarian responsiveness**.

  Here is an adjudication of the dispute, breaking down who is right about what, the theoretical limits of a resolution, and a practical path forward.

  ### 1. Adjudicating the Specific Points

  **David is right about Collective Consistency and Procedural Integrity.**
  David's argument rests on the idea that the department, as an institution, should act as a rational agent. If the department adopts the rule "Hire $\iff$ (Research $\land$ Teaching)," then the department's output should be consistent with that rule.
  *   **The Logic:** If the group accepts Premise A (Research is good) and Premise B (Teaching is good), logic dictates the group must accept Conclusion C (Hire). To do otherwise makes the group's official stance contradictory.
  *   **The Procedural Point:** David is also correct that switching procedures *after* seeing the votes is manipulative. If the committee had voted on premises first, established that both passed, and *then* someone demanded a vote on the conclusion to overturn it, that would be procedurally corrupt. The rules of aggregation must be fixed *ex-ante*.

  **Esther is right about Democratic Legitimacy and Group Agency.**
  Esther's argument rests on the idea that a committee is not a single mind, but a collection of individuals.
  *   **The Logic:** There is no metaphysical entity called "The Majority." There is only a shifting coalition of individuals. On Research, the majority is {Alvarez, Berg}. On Teaching, the majority is {Alvarez, Chen}. On Hiring, the majority is {Berg, Chen}. There is no single group of people who form a majority on all three questions.
  *   **The Legitimacy Point:** Esther is correct that an outcome opposed by 2 out of 3 members lacks democratic legitimacy. If the candidate is hired, two members who voted "No" must enforce a decision they explicitly rejected. This can damage departmental cohesion and accountability.

  ### 2. The Theoretical Reality: There Is No Logical "Winner"

  You asked for a principled resolution. The uncomfortable truth, proven by the **List-Pettit Impossibility Theorem**, is that there is no voting system that can satisfy all the following desirable conditions simultaneously:
  1.  **Universal Domain:** Any set of individual judgments is allowed.
  2.  **Consistency:** The group's judgments must be logically consistent (David's goal).
  3.  **Anonymity/Responsiveness:** The group outcome should track the majority view of individuals (Esther's goal).
  4.  **Systematicity:** The same voting rule should apply to all propositions (premises and conclusions).

  In your scenario, you must sacrifice either **Consistency** (David's value) or **Responsiveness** (Esther's value).
  *   If you choose **Premise-Based Voting (PBP)**, you preserve the integrity of the department's standards but override the will of the majority of the committee.
  *   If you choose **Conclusion-Based Voting (CBP)**, you respect the will of the committee members but render the department's stated criteria logically moot (the group effectively says "A is true, B is true, but we won't do C").

  ### 3. Contextual Resolution: Which Value Matters More Here?

  Since logic cannot decide this, the decision must be normative and contextual. Which value is more important for a *faculty hiring committee*?

  **Argument for Esther (Conclusion-Based) in this context:**
  Academic departments are not courts of law. In a court, the "Doctrinal Paradox" usually resolves in favor of David's view (Premise-Based) because the law must be consistent precedent. However, in a faculty department, **collegiality and buy-in** are essential.
  *   Hiring a candidate that 2/3 of the committee explicitly voted against creates an immediate deficit of support. Those two colleagues may withhold mentorship, service, or collaboration.
  *   The criteria (Research + Teaching) are heuristics for judgment, not mathematical axioms. A committee member might judge that while Research is "excellent" and Teaching is "good" in isolation, the *combination* doesn't fit the specific cohort needs (a nuance lost in premise voting).
  *   **Verdict:** For hiring, Esther's concern for legitimacy usually trumps David's concern for logical consistency.

  **Argument for David (Premise-Based) in this context:**
  However, David's point protects against **strategic voting** and **standard erosion**.
  *   If Conclusion-Based voting is the norm, committee members might ignore the criteria entirely and vote based on personal bias, knowing their individual logic doesn't need to be publicly reconciled.
  *   Premise-Based voting forces the committee to publicly justify *why* they are rejecting a candidate (e.g., "We admit the research is great, but we formally recorded that the teaching is insufficient"). This creates a record of standards.
  *   **Verdict:** If the department is trying to establish rigorous, transparent standards for tenure and promotion, David's approach protects the institution's long-term integrity.

  ### 4. The Principled Resolution

  The tension you are feeling is genuine and irreducible. However, the dispute between David and Esther contains the seed of the solution.

  **1. The "Ex-Ante" Rule is Sovereign**
  David's strongest point is about switching procedures mid-stream. Esther's strongest point is about choosing the right procedure *from the start*. The failure here was not the voting; it was the **ambiguity of the mandate**. The department agreed on the *criteria* for hiring, but failed to agree on the *aggregation rule*.
  *   **Resolution:** For *this* specific case, since the procedure was not specified in advance, the default should be **Conclusion-Based (Esther)**. Why? Because in the absence of an explicit agreement to bind themselves to a logical formula, individual judgment (the vote on the outcome) is the standard default of democratic bodies. To impose the Premise-Based outcome now would be to impose a rule the voters did not agree to, validating Esther's fear of undemocratic override.

  **2. Future-Proofing**
  To prevent this from happening again, the department must adopt a **Constitution of Procedure**. Before evaluating any candidate, the committee must vote on how they will vote.
  *   *Option A:* We vote on criteria. If both pass, the candidate is hired automatically (David's model).
  *   *Option B:* We vote on criteria to inform our judgment, but the final hire requires a majority vote on the outcome (Esther's model).

  **3. The "Supermajority" Compromise**
  A practical way to dissolve the tension is to raise the threshold. If the department requires a **unanimous** or **supermajority (e.g., 2/3)** vote to hire, the Discursive Dilemma often vanishes.
  *   In your scenario, if a 2/3 vote were required to hire, the candidate fails under *both* systems (1/3 on conclusion; and while premises passed 2/3, the logical conjunction implies a stricter standard).
  *   Alternatively, if the rule is "Veto Power" (any member can block on a specific criterion), it aligns the premises with the conclusion.

  ### Summary Advice

  You should report back to your colleagues with the following:

  1.  **Acknowledge the Paradox:** Inform them that this is a known logical problem (the Discursive Dilemma) where consistency and majority rule mathematically conflict. Neither is "illogical"; they prioritize different goods.
  2.  **Adjudicate the Current Case:** Since the voting procedure was not specified *before* the ballots were cast, **Esther is right for this specific instance.** In the absence of an explicit agreement to be bound by premise-aggregation, the direct will of the committee members (Conclusion-Based) holds democratic priority. Hiring a candidate rejected by 2/3 of the committee based on a procedural technicality would be damaging to departmental trust.
  3.  **Validate David's Principle:** Acknowledge that David is right that this is bad for *standards*. It reveals that the department's criteria were not robust enough to handle disagreement.
  4.  **Propose a Policy:** Recommend that for all future hiring, the department must vote on the **aggregation method** before the **candidate**. If the department wants to prioritize standards (David), they must explicitly agree to Premise-Based Voting. If they want to prioritize consensus (Esther), they must agree to Conclusion-Based Voting.

  **Final Verdict:** Esther wins the battle (the specific hire), but David wins the war (the need for procedural clarity). The tension is genuine, but it is managed by deciding the rules of the game before playing it.
