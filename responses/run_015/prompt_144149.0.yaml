prompt: |-
  I direct the evaluation and contracting team at a state workforce agency that purchases employment and reentry services from roughly forty nonprofit providers. Over the next two years we are moving from paying for services delivered to paying for measured results: an increasing share of each provider's funding will be tied to a small set of reported numbers. My constraints are these. I have three analysts and no in-house econometrician. Our legal and procurement office requires every payment rule to be written into the contract in language a provider can read and a judge could enforce. Contracts run three years. The providers are sophisticated repeat players who will reallocate staff, change intake practice, and revise how they record dates within a quarter of a rule taking effect. I can fund an in-depth audit of each provider about once a year and no more often. Each candidate indicator has to survive review by our deputy director in about a day of analyst time, and whatever I adopt must also be reported upward to a legislature that has already been told to expect certain numbers.

  I know the folk version of Goodhart's law — that a measure tends to stop tracking what it was meant to track once people are rewarded for it — and I will not be helped by being told to use a dashboard of several indicators, to add random audits, or to be careful. What I need is a decision procedure my team can actually run on a candidate indicator before it goes into a contract, ending in one of four verdicts: pay on it as written; pay on it only with the following guardrails; monitor it but attach no money; or drop it. The procedure should be about a dozen ordered steps, and each step should say what kind of evidence counts as a pass, what counts as a fail, and where a fail sends you.

  Specifically, please include:

  A first step that forces the goal to be written separately from the measure, and that produces an explicit written statement of the part of the goal the measure structurally cannot see — not a caveat, a named artifact my analysts can draft in an afternoon from files we already hold.

  A short sequence of named stress tests, in the order I should run them, each with a specified failure action. The four I have in mind are: a no-real-improvement test, which asks for the cheapest route by which a provider could hit the target while the participant is no better off, and estimates that route's cost to them against the payment; a who-goes-missing test, which asks which participants a provider would prefer never to enroll, and whether our data could detect their absence; a moving-the-line test, which asks where in the causal chain a provider can reset a clock, redefine a denominator, or reclassify an exit; and a what-gets-sacrificed test, which asks which unmeasured goods a provider would have to trade away in order to move the number, and what signal would tell me that trade had happened.

  The points where the procedure stops with a no, and what a no means operationally — how a dropped indicator becomes a monitored-only line item, and how a capped weight is expressed in contract language.

  The points where the procedure hands the decision to a person because the question is about values rather than facts, along with a one-page format for that sign-off, since I have to defend these calls after the fact.

  The guardrails that can survive being written into a contract: smoothing payment so that marginal effort yields marginal money rather than a cliff; holding back at least one measure that is collected but never paid on; and a way of stating a target before the baseline year has closed. Tell me which of these procurement or legal is likely to strike down, and what to substitute.

  A note on which parts of the procedure must stay out of the contract. If a step in my own anti-gaming machinery is one a provider could read and plan around, I need it flagged as such, and I need to know what I lose by keeping it secret.

  A re-review trigger: what pattern in year-one data forces us to reopen an indicator, and how we tell a genuine improvement from adaptation once money is attached, given how rarely we can audit.

  Then run the full procedure on three candidates, in order, showing where each one stops: the share of participants employed at ninety days after exit; median days from referral to first paycheck; and a documented completion of our soft-skills workshop. The first is the number the legislature already expects, and I suspect it is our most gameable measure — I want that case worked through to the answer I will not like, including what I should do instead of paying on it and what I say to the legislature when I do it.

  Close with an honest section on what the procedure cannot do: the residual risk it leaves on the table, the kind of provider adaptation it will never catch, and the point at which I should stop trusting indicators at all and fall back on the judgment of the staff who visit these programs. Do not cite literature or recommend reading; I want the procedure and its applications, not sources.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Director of Evaluation & Contracting at a State Workforce Agency.
      *   **Context:** Moving from fee-for-service to pay-for-performance (P4P) with ~40 nonprofit providers. 3 analysts, no econometrician. Legal/Procurement constraints (plain language, enforceable). 3-year contracts. Providers are sophisticated and will game the system. Audit capacity is limited (1/year/provider). Legislative reporting requirements exist.
      *   **Goal:** A concrete, roughly 12-step decision procedure for evaluating candidate performance indicators *before* they go into a contract.
      *   **Verdicts:** Pay as written; Pay with guardrails; Monitor only; Drop.
      *   **Specific Requirements:**
          *   Step 1: Separate Goal vs. Measure + "Blind Spot Statement."
          *   Stress Tests: No-Real-Improvement, Who-Goes-Missing, Moving-the-Line, What-Gets-Sacrificed.
          *   Stop Points: Operational meaning of "No" (monitor vs. drop, capped weight).
          *   Value Judgments: Hand-off to human decision-maker with a one-page sign-off format.
          *   Contractable Guardrails: Smoothing payments, hold-back measures, pre-baseline targets. Legal/Procurement viability check.
          *   Secrecy: What stays out of the contract (anti-gaming machinery).
          *   Re-review Trigger: Data patterns forcing reopening. Distinguishing improvement from adaptation.
          *   Application: Run the procedure on three specific candidates (90-day employment, Median days to paycheck, Soft-skills completion).
          *   Limitations: Honest assessment of residual risk and when to trust human judgment over data.
          *   Constraint: No literature citations, just the procedure and applications.

  2.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Structure:* Needs to be linear, actionable, and fit the "12 steps" constraint roughly.
      *   *Step 1 (Goal/Measure Separation):* Needs to produce the "Blind Spot Statement."
      *   *Steps 2-5 (Stress Tests):* Incorporate the four requested tests (No-Real-Improvement, Who-Goes-Missing, Moving-the-Line, What-Gets-Sacrificed).
      *   *Steps 6-8 (Guardrails & Legal):* Address contractability and payment structures.
      *   *Steps 9-10 (Value Judgment):* The hand-off point.
      *   *Steps 11-12 (Final Verdict & Secrecy):* Final classification and documentation of what stays internal.
      *   *Refinement:* Ensure "Pass/Fail" criteria and "Next Step" logic are clear for each.

  3.  **Addressing Specific Constraints:**

      *   *Legal/Procurement:* They hate ambiguity. "Smoothing" is okay if formulaic. "Hold-back measures" are tricky (why collect if not pay?), need to frame as "Compliance Metrics." "Pre-baseline targets" are legally risky; need to frame as "Provisional Targets subject to Adjustment."
      *   *Secrecy:* The stress tests themselves shouldn't be in the contract. The *rules* are in the contract, the *tests* are internal.
      *   *Re-review:* Needs a statistical trigger (e.g., variance spike, correlation break) + audit finding.

  4.  **Running the Procedure on the Three Candidates:**

      *   *Candidate 1: Share employed at 90 days post-exit.* (The Legislative Mandate).
          *   *Analysis:* Highly gameable (cream skimming, redefining exit, short-term jobs).
          *   *Verdict:* Likely "Monitor Only" or "Pay with Heavy Guardrails." The prompt asks to work through to the answer I "will not like." That implies admitting it shouldn't be paid on directly, but legislation requires it. So, the solution is to pay on a *proxy* or *lagged* version while reporting the original to the legislature.
      *   *Candidate 2: Median days from referral to first paycheck.*
          *   *Analysis:* Encourages speed, but risks "churning" (quick job, quick quit) or avoiding hard-to-serve.
          *   *Verdict:* Pay with guardrails (e.g., retention check).
      *   *Candidate 3: Documented completion of soft-skills workshop.*
          *   *Analysis:* Output, not outcome. Easy to fake attendance. Low value.
          *   *Verdict:* Drop or Monitor Only.

  5.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the constraints.
      *   *The Procedure:* 12 Steps.
      *   *The Stress Tests:* Define them clearly within the steps.
      *   *Contractual Guardrails:* Analyze legal viability.
      *   *Secrecy:* Define the "Internal Annex."
      *   *Re-review:* Define the trigger.
      *   *Applications:* Walk through the three metrics.
      *   *Limitations:* The "Honest Section."

  6.  **Refining the "Blind Spot Statement" (Step 1):**
      *   Must be an artifact. "The measure captures X, but structurally ignores Y."
      *   Example: 90-day employment captures *having a job*, ignores *job quality/wages/sustainability beyond 91 days*.

  7.  **Refining the Stress Tests:**
      *   *No-Real-Improvement:* Cost of gaming vs. Cost of service. If Gaming Cost < Payment, Fail.
      *   *Who-Goes-Missing:* Identify exclusion criteria. If data can't detect exclusion, Fail.
      *   *Moving-the-Line:* Identify definition manipulation. If definitions are provider-controlled, Fail.
      *   *What-Gets-Sacrificed:* Identify trade-offs. If trade-off harms mission, Fail/Mitigate.

  8.  **Refining Legal/Procurement Issues:**
      *   *Smoothing:* OK (formula-based).
      *   *Hold-back:* Call it "Quality Assurance Metric."
      *   *Pre-baseline:* Call it "Estimated Target, Adjusted Year 1."
      *   *Secret Steps:* Never put the "Stress Test" logic in the contract. Put the *definitions* in the contract.

  9.  **Refining the Legislative Problem (Candidate 1):**
      *   Legislature wants "90-day employment."
      *   Reality: Paying on this causes cream-skimming.
      *   Solution: Pay on "180-day employment" or "90-day + Wage Threshold" internally, but report the legislative number as "Performance Data" not "Payment Basis." Or, pay a small % on the legislative number and the bulk on a harder metric. The prompt asks for the answer I "will not like." That is likely: "Do not pay directly on this number despite legislative expectation. Report it, but tie money to a lagged or adjusted version."

  10. **Review against Constraints:**
      *   12 steps? Yes.
      *   Pass/Fail/Next Step? Yes.
      *   One-page sign-off format? Yes.
      *   Three candidates run through? Yes.
      *   No citations? Yes.
      *   Tone: Professional, direct, bureaucratic but sharp.

  11. **Self-Correction/Polishing:**
      *   *Check:* Did I explain *where* a fail sends you? (e.g., Step 4 Fail -> Step 9 or Drop).
      *   *Check:* Is the "Blind Spot" distinct from a caveat? Yes, it's a named artifact.
      *   *Check:* Is the legal advice practical? Yes, focusing on "enforceable language."
      *   *Check:* Is the re-review trigger specific? Yes, need a statistical threshold.

  12. **Final Polish:** Ensure the distinction between "Monitor" (collect data, no $) and "Drop" (stop collecting) is clear. Ensure the "Value Judgment" step is distinct from the "Fact" steps.

  *(Self-Correction during drafting)*: I need to make sure the "Re-review trigger" distinguishes between improvement and adaptation. Since audits are rare, I need to rely on data anomalies (e.g., sudden spike in performance without corresponding macroeconomic improvement).

  *(Self-Correction on Candidate 1)*: The user says "I want that case worked through to the answer I will not like." This implies I must conclude that paying on the legislative metric is dangerous. I need to provide the script for the legislature.

  *(Self-Correction on Guardrails)*: "Holding back at least one measure that is collected but never paid on." Legal might ask "Why are we spending admin cost on this?" I need to frame it as "Compliance Verification."

  Let's assemble the response.cw
answer: |-
  # The Indicator Viability Protocol (IVP)

  **Purpose:** To determine whether a candidate performance indicator is suitable for financial incentivization in a three-year procurement contract.
  **Users:** Evaluation Analysts (3), Director (1).
  **Inputs:** Candidate indicator definition, historical provider data, program logic model.
  **Outputs:** One of four verdicts (Pay As Written, Pay With Guardrails, Monitor Only, Drop) + Contract Language Pack + Internal Risk Memo.

  ---

  ## Part 1: The Decision Procedure (12 Steps)

  **Step 1: Goal/Measure Separation & The Blind Spot Statement**
  *   **Action:** Write the Program Goal in one sentence. Write the Candidate Measure in one sentence. Draft the "Blind Spot Statement."
  *   **Blind Spot Statement Format:** "This measure structurally cannot detect [Specific Aspect of Goal] because [Data/Definition Limitation]."
  *   **Pass:** Blind Spot is named and accepted as non-fatal.
  *   **Fail:** Blind Spot covers >50% of the Program Goal's value.
  *   **Next:** If Pass, go to Step 2. If Fail, Verdict: **Drop**.

  **Step 2: Data Integrity Check**
  *   **Action:** Verify the data source for the measure.
  *   **Pass:** Data is third-party verified (e.g., wage records) or requires documentary proof auditable within 1 hour.
  *   **Fail:** Data relies on provider self-attestation without external cross-check.
  *   **Next:** If Pass, go to Step 3. If Fail, Verdict: **Monitor Only** (unless Step 7 guardrails can fix it).

  **Step 3: The "No-Real-Improvement" Stress Test**
  *   **Action:** Analysts estimate the cheapest way for a provider to hit the target without improving participant outcomes (e.g., cream-skimming, reclassifying exits). Estimate the cost of this gaming strategy per participant.
  *   **Pass:** Cost to Game > Payment Amount.
  *   **Fail:** Cost to Game < Payment Amount.
  *   **Next:** If Pass, go to Step 4. If Fail, go to Step 7 (Guardrails).

  **Step 4: The "Who-Goes-Missing" Stress Test**
  *   **Action:** Identify which participant subgroups (e.g., justice-involved, limited English) a provider would prefer not to enroll to boost the score. Check if intake data captures these demographics.
  *   **Pass:** Intake data allows us to detect significant shifts in enrollment demographics compared to baseline.
  *   **Fail:** We cannot detect if a specific subgroup is being excluded.
  *   **Next:** If Pass, go to Step 5. If Fail, go to Step 7 (Guardrails).

  **Step 5: The "Moving-the-Line" Stress Test**
  *   **Action:** Identify every date or definition the provider controls that affects the numerator or denominator (e.g., "date of exit," "employment start").
  *   **Pass:** All critical dates/definitions are anchored to external events (e.g., UI claim date, tax filing) or fixed in contract language.
  *   **Fail:** Provider has discretion to redefine the start/stop clock or participant status.
  *   **Next:** If Pass, go to Step 6. If Fail, go to Step 7 (Guardrails).

  **Step 6: The "What-Gets-Sacrificed" Stress Test**
  *   **Action:** Identify unmeasured goods (e.g., job quality, participant well-being, long-term retention) that might be traded to move the number. Identify a "Canary Signal" (a secondary data point) that would flash red if this trade-off occurs.
  *   **Pass:** A valid Canary Signal exists and is collected.
  *   **Fail:** No signal exists to detect the trade-off.
  *   **Next:** If Pass, go to Step 9. If Fail, go to Step 9 (Value Judgment).

  **Step 7: Guardrail Design (Remediation)**
  *   **Action:** Design contract language to mitigate failures in Steps 3, 4, or 5. Options: Caps, Floors, Smoothing, or Definition Locks.
  *   **Pass:** Legal/Procurement confirms the guardrail is enforceable.
  *   **Fail:** Legal rejects the guardrail as too ambiguous or unenforceable.
  *   **Next:** If Pass, go to Step 8. If Fail, Verdict: **Monitor Only**.

  **Step 8: Guardrail Viability Check**
  *   **Action:** Re-run Steps 3, 4, or 5 with the proposed guardrail in place.
  *   **Pass:** The guardrail makes gaming more expensive than service delivery.
  *   **Fail:** The guardrail is easily circumvented.
  *   **Next:** If Pass, go to Step 9. If Fail, Verdict: **Monitor Only**.

  **Step 9: Value Judgment Hand-off**
  *   **Action:** If Steps 1, 6, or 8 flagged risks that are acceptable but not zero, package the "Blind Spot Statement" and "Canary Signal" for the Director.
  *   **Action:** Director signs the **Risk Acceptance Form** (see Part 3).
  *   **Next:** Go to Step 10.

  **Step 10: Payment Structure Design**
  *   **Action:** Determine if payment is a cliff (all-or-nothing) or smoothed (linear).
  *   **Rule:** All outcome payments must be smoothed.
  *   **Next:** Go to Step 11.

  **Step 11: Secrecy Classification**
  *   **Action:** Tag elements of the IVP analysis as "Internal" or "Contractual."
  *   **Rule:** Stress test logic and Canary Signal thresholds are **Internal**. Payment formulas and Definitions are **Contractual**.
  *   **Next:** Go to Step 12.

  **Step 12: Final Verdict & Re-review Trigger**
  *   **Action:** Assign Verdict. Set the "Re-review Trigger" (see Part 4).
  *   **Output:** Contract Language Pack + Internal Risk Memo.

  ---

  ## Part 2: Contractable Guardrails & Legal Viability

  You requested specific guardrails. Here is their viability with Legal/Procurement and the required substitutions.

  | Guardrail Concept | Legal/Procurement Risk | Substitution for Contract Language |
  | :--- | :--- | :--- |
  | **Smoothing Payment** (Marginal effort = marginal money) | **Low Risk.** Legal prefers formulas over discretion. | "Payment shall be calculated as a linear function of performance between a Floor (0% payment) and a Cap (100% payment), per Exhibit B." |
  | **Hold-back Measure** (Collected but unpaid) | **Medium Risk.** Procurement may ask why public funds are used to collect unused data. | **Reframe as "Compliance Metric."** "Provider must report Metric X. Failure to report or significant deviation from baseline demographics results in a 5% penalty on total contract value." |
  | **Pre-Baseline Target** (Setting target before Year 1 ends) | **High Risk.** Cannot contractually bind a party to an unknown baseline. | **Reframe as "Provisional Target."** "Year 1 targets are provisional. Final targets for Years 2-3 shall be adjusted based on Year 1 aggregate performance data via Contract Modification." |

  **What Legal Will Strike Down:**
  Any language that implies "We might not pay you if we *suspect* gaming." You cannot contract on suspicion. You must contract on *defined conditions*.
  *   *Bad:* "Payment withheld if agency suspects cream-skimming."
  *   *Good:* "Payment adjusted if enrollment of Population X falls below 20% of referral volume."

  ---

  ## Part 3: The Value Judgment Hand-off

  When the procedure reaches Step 9, the facts are exhausted. The remaining risk is political or ethical. You need a defensible paper trail.

  **Form: Risk Acceptance & Indicator Sign-off**
  1.  **Indicator Name:**
  2.  **Blind Spot Statement:** (From Step 1)
  3.  **Residual Risk:** (What the Stress Tests showed we cannot prevent)
  4.  **Canary Signal:** (What we will watch to know if it goes wrong)
  5.  **Rationale for Acceptance:** (Why this risk is worth taking, e.g., "Legislative Mandate" or "High Alignment with Mission")
  6.  **Director Signature:**
  7.  **Date:**

  *This form is internal. It is not attached to the contract. It protects you when the legislature asks why a metric failed or why you didn't use a metric.*

  ---

  ## Part 4: Secrecy & Re-review Triggers

  **What Stays Out of the Contract:**
  1.  **The Stress Test Logic:** Do not tell providers *how* you calculated the cost of gaming.
  2.  **The Canary Signal Thresholds:** Tell them you are monitoring retention, do not tell them "If retention drops below 40% we audit."
  3.  **The Audit Selection Algorithm:** If you use data to pick who gets audited, keep the weights secret.

  **Loss of Secrecy:** If providers know the Canary Signal thresholds, they will optimize to the threshold (e.g., keep retention exactly at 41%). By keeping it secret, you force them to assume the threshold is lower than it is, creating a safety buffer.

  **The Re-review Trigger:**
  You cannot audit often. You need a data tripwire.
  *   **Trigger:** If a provider's performance on a paid indicator improves by >2 standard deviations from the state average *without* a corresponding improvement in the "Hold-back/Compliance Metric" (e.g., employment goes up, but wages or demographics shift oddly).
  *   **Distinguishing Improvement from Adaptation:**
      *   *Improvement:* Correlated with macroeconomic upticks or seen across all providers.
      *   *Adaptation:* Outlier performance isolated to specific providers, accompanied by shifts in intake demographics (Who-Goes-Missing) or definition changes (Moving-the-Line).
  *   **Action:** Trigger freezes payment on that indicator for that provider pending a targeted audit.

  ---

  ## Part 5: Application to Candidate Indicators

  ### Candidate 1: Share of participants employed at 90 days after exit
  *Legislative Expectation: High.*

  *   **Step 1 (Blind Spot):** Measure captures *any* employment. Blind Spot: Job quality, wage level, sustainability beyond day 91.
  *   **Step 3 (No-Real-Improvement):** Cost to Game is Low. Provider can place participants in short-term, gig, or self-employment that lasts exactly 90 days. Cost to provider is minimal; payment is high. **Fail.**
  *   **Step 4 (Who-Goes-Missing):** High Risk. Providers will avoid justice-involved or disabled participants who face barriers to quick hiring. **Fail.**
  *   **Step 5 (Moving-the-Line):** High Risk. "Exit" date is often provider-recorded. They can delay exit until the participant is already hired. **Fail.**
  *   **Step 7 (Guardrails):** Can we fix it?
      *   *Fix 1:* Define "Exit" as last date of service, not provider discretion. (Helps Step 5).
      *   *Fix 2:* Add wage threshold (e.g., must earn >$X/hr). (Helps Step 3).
      *   *Fix 3:* Demographic floor. (Helps Step 4).
  *   **Step 8 (Viability):** Legal accepts wage threshold and demographic floor.
  *   **Step 9 (Value Judgment):** Despite guardrails, the 90-day cliff encourages short-termism.
  *   **Verdict:** **Pay With Guardrails (Heavily Modified).**
  *   **The Answer You Will Not Like:** You cannot pay on the raw legislative number without inviting massive gaming.
  *   **Action:** Contract pays on "Employment at 90 days AND Minimum Wage Threshold AND Retention at 180 days."
  *   **Legislative Script:** "We report the 90-day number to you as requested. However, to ensure taxpayer funds buy sustainable outcomes, our *payment structure* weights the 180-day metric higher. This prevents providers from placing citizens in jobs they cannot keep."

  ### Candidate 2: Median days from referral to first paycheck
  *Efficiency Metric.*

  *   **Step 1 (Blind Spot):** Captures speed. Blind Spot: Appropriateness of the job match.
  *   **Step 3 (No-Real-Improvement):** Cost to Game is Medium. Provider can push participants into "any" job quickly.
  *   **Step 6 (What-Gets-Sacrificed):** Job match quality. Canary Signal: 90-day retention rate.
  *   **Step 7 (Guardrails):** Smooth the payment. Do not pay a bonus for <10 days. Pay linearly between 30 and 60 days.
  *   **Step 10 (Payment Structure):** Linear scale.
  *   **Verdict:** **Pay With Guardrails.**
  *   **Contract Language:** "Incentive payment calculated on a sliding scale for median days between 30 and 60. No incentive for median <30 days (to ensure adequate assessment)."

  ### Candidate 3: Documented completion of soft-skills workshop
  *Output Metric.*

  *   **Step 1 (Blind Spot):** Captures attendance. Blind Spot: Skill acquisition, behavior change.
  *   **Step 2 (Data Integrity):** Fail. Relies on provider sign-in sheets. Easy to fabricate.
  *   **Step 3 (No-Real-Improvement):** Cost to Game is Near Zero. Provider can run the workshop with no content, or mark absent participants present.
  *   **Step 7 (Guardrails):** Audit requirement? You can only audit 1/year. That means 99% of workshops are unchecked.
  *   **Verdict:** **Drop.**
  *   **Reasoning:** The cost of verification exceeds the value of the data. It is a compliance activity, not a performance outcome.
  *   **Alternative:** Move to "Monitor Only" as a compliance requirement (must offer X hours), but attach no performance payment.

  ---

  ## Part 6: Limitations & Residual Risk

  **What This Procedure Cannot Do:**
  1.  **Collusion:** It assumes providers compete. If the 40 nonprofits talk to each other and agree on how to game the metrics collectively, the "Who-Goes-Missing" and "Moving-the-Line" tests will fail to detect it because the data will look consistent across the board.
  2.  **Macro Shocks:** A recession will tank your employment metrics regardless of provider effort. Your "Re-review Trigger" might flag honest providers as gamers during a downturn. You need a macroeconomic adjustment clause (force majeure for metrics).
  3.  **The "Good" Gaming:** Sometimes gaming *is* improvement. If a provider figures out how to get people jobs faster by cutting red tape, that looks like "Moving-the-Line" but is actually innovation. The procedure treats all adaptation as risk. You will stifle some innovation.

  **When to Stop Trusting Indicators:**
  When the "Canary Signal" flashes red for three consecutive quarters across >50% of providers. This indicates systemic measure failure, not provider failure.
  At that point, you must revert to **Qualitative Judgment**.
  *   **The Fallback:** Increase the frequency of site visits by your staff. Shift funding temporarily back to "Fee-for-Service" for 6 months while you redesign the metrics.
  *   **The Hard Truth:** No procedure eliminates the risk that you are paying for a spreadsheet rather than a changed life. Your analysts manage the spreadsheet; your field staff manage the lives. If the two diverge, trust the field staff, even if it means explaining a budget variance to the legislature.

  **Final Operational Note:**
  The IVP is a living document. You must re-run Step 1 through Step 6 annually for every active indicator. A metric that was safe in Year 1 may be gameable in Year 2 once providers have learned the system. Your "Re-review Trigger" is the emergency brake; the Annual Re-run is the scheduled maintenance. Do not skip the maintenance.
