prompt: |-
  I'm a PhD student in decision theory, and I've become convinced that the correct response to counterfactual mugging scenarios is to pay up — that is, one should act on the basis of what one would have done in a counterfactual branch, even when the causal consequences of paying are strictly negative in the actual branch. The standard case: a highly reliable predictor tells you it flipped a fair coin. Had the coin come up heads, the predictor would have given you a large reward if and only if you would pay it a smaller sum had the coin come up tails. The coin came up tails. The predictor asks for the smaller sum. On my view, you should pay, and the same reasoning extends to XOR blackmail and related cases.

  I want to know what would count against this position. Not just the standard causal decision theorist's objection — I know that one — but a systematic map of the position's exposure. What empirical findings, formal results, or further thought experiments would undermine it? For instance: at what level of predictor reliability does the obligation to pay disappear, and does the view give a principled answer or does it turn on vague intuitions about stakes and probabilities? Does the view collapse into requiring one to pay in Pascal's mugging, or can it draw a stable line? Are there results in logic or computability — say, about the impossibility of a predictor that reasons about your decision procedure while running it — that would make the whole setup incoherent? What would a defender of the position concede as a genuine cost, and what would they dismiss as question-begging? I'd like the defeaters ranked from fatal to merely awkward, and an honest assessment of whether the position has been qualified into unfalsifiability — and if so, whether that's a problem for a normative view of this kind.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in decision theory. This means they know the basics (CDT, EDT, FDT/TDT, Newcomb, Parfit's Hitchhiker, etc.). I don't need to explain the Counterfactual Mugging (CM) setup in detail. I need to speak their language (utility functions, priors, updatelessness, logical correlation, etc.).
      *   **Position:** They are convinced one should "pay up" in CM (Functional Decision Theory / Timeless Decision Theory / Updateless Decision Theory stance).
      *   **Goal:** They want a *systematic map of exposure*. What counts *against* this position? Not just "CDT says no," but deep objections: empirical, formal, logical, slippery slopes (Pascal's Mugging), coherence issues (predictor computability), and meta-normative concerns (unfalsifiability).
      *   **Format:** Defeaters ranked from Fatal to Merely Awkward. Honest assessment of unfalsifiability.

  2.  **Deconstruct the Position (Updateless/FDT-style):**
      *   Core intuition: Rationality is about choosing a *policy* or *algorithm*, not just an action at a specific time index.
      *   Mechanism: Logical correlation between the agent's decision procedure and the predictor's simulation.
      *   Benefit: Wins in Newcomb, CM, XOR Blackmail, etc.
      *   Vulnerability: Requires strong assumptions about correlation, logical omniscience, and prior commitment.

  3.  **Brainstorming Objections/Defeaters:**

      *   *The "Why now?" problem (Dynamic Inconsistency):* If I know I'll pay in the tails branch, why don't I just precommit and then renege? The theory says "act as if precommitted." But if the predictor is already gone, what forces me? (Internal consistency vs. external enforcement).
      *   *Predictor Reliability/Probability:* What if the predictor is 51% reliable? 99%? Is there a threshold? If it's continuous, does the obligation fade smoothly?
      *   *Pascal's Mugging:* If I pay in CM because of low prob * high stake, do I pay in Pascal's Mugging? FDT usually tries to distinguish via logical correlation vs. causal independence. Is that distinction stable?
      *   *Computability/Logic:* Can a predictor actually simulate me without triggering a halting problem or infinite regress? (Löb's Theorem, Gödelian knots). If the setup is logically impossible, is the normative claim vacuous?
      *   *Exploitability (Money Pumps):* Can I be money-pumped if I follow this policy across different scenarios? (e.g., Counterfactual Mugging vs. Reverse Counterfactual Mugging).
      *   *The "Black Box" Problem:* If I don't know the predictor's source code, how do I know there's logical correlation?
      *   *Normative Force:* Why should I care about the counterfactual me? (The "Why be rational?" question).
      *   *Unfalsifiability:* If every loss is explained away as "wrong prior" or "wrong reference class," is it scientific/philosophically robust?

  4.  **Structuring and Ranking the Defeaters:**

      *   *Fatal:* Things that break the internal logic or make the theory impossible to implement.
          *   Logical Incoherence of the Predictor (Gödel/Computability).
          *   The "Updatelessness" vs. "Information" tension (If I know I'm in the tails branch, why ignore that info?).
      *   *Severe:* Things that lead to absurd consequences or instability.
          *   Pascal's Mugging collapse (The "Many-Worlds" of muggings).
          *   Exploitability/Money Pumps (specifically regarding logical uncertainty).
      *   *Moderate:* Things that require ad-hoc fixes or vague boundaries.
          *   Reliability Thresholds.
          *   Source Code Opacity.
      *   *Awkward:* Costs that defenders accept but look bad to outsiders.
          *   Sunk Cost feeling.
          *   Normative alienation (feeling like a slave to a policy).

  5.  **Drafting the Content (Iterative refinement for PhD level):**

      *   *Intro:* Acknowledge the stance (FDT/UDT).
      *   *1. The Computability/Logical Obstacle (Fatal/Severe):* Focus on the impossibility of perfect prediction of a computationally equivalent agent. Mention Löb's Theorem and the "Fair Bot" problem. If the predictor can't exist, the norm is vacuous.
      *   *2. The Pascal's Mugging Collapse (Severe):* This is the biggest practical threat. If we maximize expected utility over logical counterfactuals with unbounded utilities, we get mugged. FDT needs a complexity penalty or bounded utility. Is that principled or ad-hoc?
      *   *3. The Problem of Logical Uncertainty (Severe):* How do I assign probability to the logical fact "Predictor simulated me"? If I'm in the tails branch, isn't it a logical fact that I wouldn't have paid? This touches on the "impossible possible worlds" problem in logical induction.
      *   *4. Dynamic Inconsistency & The "Why Now?" (Moderate/Severe):* If the predictor is gone, the causal link is broken. UDT says "act as if." But without a precommitment device, this looks like akrasia.
      *   *5. Reliability Thresholds (Moderate):* Is it step-function or continuous? If continuous, at what $p$ does it flip?
      *   *6. Unfalsifiability (Meta):* If every failure is blamed on the prior or the correlation model, is it normative or just a definition?

  6.  **Refining the "Unfalsifiability" Point:**
      *   This is crucial for a PhD student. Normative theories aren't empirical, but they need *coherence* constraints. If the theory says "Maximize U relative to prior P," and you lose, the defender says "You used the wrong P." That's a shield. Is it a bug or a feature?
      *   Distinguish between *action-guidance* and *criterion of rightness*.

  7.  **Addressing Specific Questions:**
      *   *Reliability level:* Needs a principled cutoff based on EV calculation, but EV depends on the prior over predictor types.
      *   *Pascal's Mugging:* FDT distinguishes via *subjunctive dependence*. But if the mugger claims subjunctive dependence (I simulate you), do you pay?
      *   *Computability:* Yes, this is a major hole. Perfect prediction of an equivalent agent is tricky (Program Equivalence Problem).

  8.  **Final Review against User Persona:**
      *   Tone: Rigorous, analytical, peer-to-peer.
      *   Avoid: Introductory fluff.
      *   Include: References to MIRI/FDT literature (Yudkowsky, Soares), CDT/EDT comparisons, logical uncertainty.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe list CDT objections.
      *   *Correction:* No, user explicitly said "Not just the standard causal decision theorist's objection." Focus on internal critiques of FDT/UDT.
      *   *Initial thought:* Focus heavily on Newcomb.
      *   *Correction:* User asked about Counterfactual Mugging specifically. Keep the focus on the *counterfactual* aspect (paying when coin is tails).
      *   *Key nuance:* The distinction between *physical* prediction and *logical* prediction. CM usually relies on logical correlation (simulating the algorithm). If it's just physical prediction (reading brain states), it might reduce to CDT. I need to ensure the response addresses the *logical* commitment aspect.

  10. **Final Polish:** Organize by severity. Ensure the "Unfalsifiability" section is nuanced (normative vs. descriptive). (Proceed to generate output based on this structure).

  *(Self-Correction on "Fatal"):* Is computability truly fatal? Most decision theorists assume idealized agents. I should frame it as "Idealization Failure" rather than "Fatal." A truly fatal objection would be internal inconsistency. The "Logical Uncertainty" problem is closer to fatal because if you can't coherently assign probabilities to logical counterfactuals, the math breaks.

  *(Refining Pascal's Mugging):* The link is that CM relies on low prob * high reward logic. Pascal's Mugging is extreme low prob * extreme high reward. The defense is usually "complexity prior." Is that stable?

  *(Refining Unfalsifiability):* A normative theory *should* be somewhat unfalsifiable by empirical data (is-ought gap), but it must be falsifiable by *intuition pumps* and *coherence arguments*. If it immunizes itself against coherence arguments, that's the problem.

  Okay, ready to write.
answer: |-
  This is a sophisticated position, effectively aligning you with **Functional Decision Theory (FDT)** or **Updateless Decision Theory (UDT)**. You are arguing for *policy selection* over *act selection*, grounded in the notion of *subjunctive dependence* (logical correlation) between your algorithm and the predictor's simulation.

  Since you are familiar with the standard CDT objection (that the past is fixed and payment is a sunk cost), I will bypass causal critiques. Instead, I will map the internal vulnerabilities, formal limitations, and meta-normative risks of the "pay up" position. I have ranked these from **Fatal** (internal incoherence or impossibility) to **Awkward** (costs defenders must accept).

  ---

  ### 1. The Problem of Logical Uncertainty (Severity: Fatal/Severe)
  **The Objection:** The "pay up" argument relies on assigning non-zero probability to a logical counterfactual: "If I were the type of agent who pays, the predictor would have predicted that." However, once you observe the coin is Tails, it becomes a *logical fact* that the coin is Tails. In standard logic, false antecedents imply anything (*ex falso quodlibet*), but decision theory requires a non-trivial probability distribution over logical possibilities to calculate expected utility.

  **The Exposure:**
  *   **Incoherence of Counterlogicals:** If the predictor is a logical simulator, and you are a deterministic algorithm, then "You Pay" and "Coin Heads" are logically linked. Once you observe "Coin Tails," you have logically proven "You do not Pay" (assuming the predictor is perfect). To decide to pay, you must reason from a premise you know to be logically false ("What if I pay, given Tails?").
  *   **Formal Result:** There is currently no consensus formalism for *logical counterfactuals*. Standard probability theory collapses on logical truths (Prob(Logical Truth) = 1). While **Logical Induction** (Garrabrant et al.) makes progress, it does not fully solve the problem of how an agent should reason about "what would happen if I output action A" when the agent has already proven it will output action B.
  *   **Defeater:** If a coherent calculus of logical counterfactuals is impossible, the expected utility calculation driving the "pay up" decision is mathematically undefined.

  ### 2. The Pascal's Mugging Collapse (Severity: Severe)
  **The Objection:** The reasoning in Counterfactual Mugging (CM) is structurally isomorphic to Pascal's Mugging (PM). In CM, you pay a small cost to satisfy a condition in a low-probability (50%) counterfactual branch for a high reward. In PM, a mugger threatens/offers astronomical utility with infinitesimal probability.

  **The Exposure:**
  *   **The Continuum Problem:** If you pay in CM because the *expected value across the policy* is positive, you must specify why the probability threshold doesn't slide to zero. FDT defenders usually invoke a **complexity prior** (Solomonoff induction) to penalize the mugger's hypothesis.
  *   **Instability:** However, in CM, the hypothesis ("Predictor exists and simulates me") is often treated as simple. If a Pascal Mugger claims, "I am simulating you in a higher universe," they are invoking the same subjunctive dependence.
  *   **Defeater:** If your view cannot draw a *principled* line between the CM predictor (who deserves payment) and the Pascal Mugger (who does not), without resorting to ad-hoc probability cutoffs, the view leads to **utility domination by low-probability hypotheses**. You become a money pump for any agent who can credibly claim logical correlation at a sufficient scale.

  ### 3. Computability and the "Source Code" Requirement (Severity: Severe)
  **The Objection:** FDT/UDT requires that the predictor simulates your *decision procedure*, not just your behavior. This implies the predictor has access to your source code, and you have reason to believe they do.

  **The Exposure:**
  *   **The Halting Problem/Program Equivalence:** For the predictor to be reliable, it must solve the program equivalence problem (does my code output 'Pay'?). This is undecidable in the general case.
  *   **Opaque Agents:** In the real world, you do not know your own "source code" (you are a black box to yourself via introspection), nor does the predictor. If the correlation is merely statistical (empirical) rather than logical (structural), the link weakens.
  *   **Defeater:** If the setup requires logically impossible computational feats (perfect prediction of a computationally equivalent agent), the normative claim is **vacuous**. It tells you what to do in a world that cannot exist. A defender must concede the theory only applies to *idealized* agents, limiting its normative force for human beings.

  ### 4. Dynamic Inconsistency and the "Why Now?" Problem (Severity: Moderate/Severe)
  **The Objection:** UDT solves dynamic inconsistency by choosing a policy *ex ante*. But in the actual moment of the mugging (Tails branch), the *ex ante* moment is gone. The predictor has already acted.

  **The Exposure:**
  *   **Normative Force:** What binds the *ex post* agent to the *ex ante* policy? In CDT, the answer is "nothing, and you shouldn't." In UDT, the answer is "rationality requires identity across time."
  *   **The Threat:** If the agent can self-modify, UDT is stable (you modify yourself to be a payer). But if the agent *cannot* self-modify (a static human), the requirement to pay looks like **akrasia**. You are forcing your current self to suffer for a self that no longer exists (the pre-prediction self).
  *   **Defeater:** If the theory cannot explain the *normative bindingness* of the past policy without assuming a metaphysical persistence of the "algorithm" that overrides the current agent's interests, it risks being a **category error** (confusing a design perspective with an agent perspective).

  ### 5. Reliability Thresholds and Vagueness (Severity: Moderate)
  **The Objection:** You asked: *At what level of predictor reliability does the obligation disappear?*

  **The Exposure:**
  *   **The Calculation:** The obligation holds as long as $P(\text{Heads}) \times \text{Reward} > P(\text{Tails}) \times \text{Cost}$. In standard CM, $P=0.5$. If the predictor is only 51% reliable, the EV drops.
  *   **The Vagueness:** The deeper issue is not the math, but the *epistemic access*. How do you know the reliability? If you must estimate the reliability based on empirical evidence, you are updating. UDT says *don't update*.
  *   **Defeater:** If the agent must use empirical data to estimate the predictor's reliability, they are implicitly updating on the fact that they are in the Tails branch (since a reliable predictor wouldn't be asking if they weren't). This creates a tension between **Updatelessness** and **Empirical Learning**. A defender must concede that the theory fails if the agent cannot distinguish between "Predictor is reliable" and "Predictor is bluffing based on my type."

  ### 6. Exploitability by "Reverse" Muggers (Severity: Moderate)
  **The Objection:** Can an adversary construct a scenario where paying in CM makes you vulnerable elsewhere?

  **The Exposure:**
  *   **The Setup:** Imagine a "Reverse Counterfactual Mugging." A predictor says: "I predicted you would pay in the standard CM. Because you are that type, I will punish you now."
  *   **The Risk:** If your decision procedure is transparent and fixed, you can be targeted by mechanisms that punish *specifically* the dispositions that win in other games.
  *   **Defeater:** While FDT proponents argue you still win *overall* across the ensemble of all possible problems, this requires a **measure problem** over the space of all possible decision problems. Without a principled measure over "which problems exist," the claim "FDT wins the most" is ill-defined.

  ### 7. Unfalsifiability and the "Right Prior" Defense (Severity: Meta-Normative)
  **The Objection:** You asked if the position has been qualified into unfalsifiability.

  **The Exposure:**
  *   **The Shield:** When an FDT agent loses (e.g., in a "Blackmail" variant where the predictor punishes FDT specifically), the defender often says, "You used the wrong prior over predictor types," or "That problem is unfair."
  *   **The Cost:** A normative theory should be action-guiding. If every failure can be retroactively explained by "your prior over logical correlations was incorrect," the theory loses predictive power regarding *which* actions are rational.
  *   **Assessment:** This is a genuine problem. However, defenders argue this isn't unfalsifiability, but **indexicality**. Just as Bayesianism isn't falsified by bad priors, UDT isn't falsified by wrong logical priors.
  *   **Verdict:** This is not fatal, but it renders the theory **esoteric**. It becomes a theory about *ideal designers* rather than *situated agents*. If you cannot tell a human "Pay up" without first solving the problem of logical priors, the theory is normatively inert for actual humans.

  ---

  ### Summary of Concessions
  A honest defender of the "Pay Up" view should concede the following:

  1.  **Idealization:** The view strictly applies only to agents with transparent source code and logical omniscience (or a solved theory of logical uncertainty). Applied to humans, it is a heuristic, not a strict derivation.
  2.  **No Causal Leverage:** You must admit that paying has *no causal impact* on the reward. You are paying solely to make the proposition "I am the type who pays" true, which retroactively validates the predictor's simulation. This feels like magic, and you must own that phenomenological cost.
  3.  **Vulnerability to Complexity Priors:** You must admit that if a Pascal Mugger can construct a hypothesis of sufficiently low complexity but high stakes, you are obligated to pay. The defense rests entirely on the stability of Solomonoff priors, which is not guaranteed.

  ### Final Assessment: Is it Unfalsifiable?
  It is **not empirically falsifiable**, but that is true of all normative decision theories (you cannot derive an 'ought' from an 'is').

  However, it is vulnerable to **coherence falsification**. If it can be proven that:
  1.  Logical counterfactuals are incoherent (Fatal).
  2.  The theory mandates paying in clearly absurd Pascal's Mugging cases without a principled stop (Severe).
  3.  The theory is dynamically inconsistent for non-self-modifying agents (Severe).

  ...then the position collapses. Currently, the field (MIRI/ACX/etc.) considers the **Logical Uncertainty** problem the biggest remaining hurdle. Until we have a robust calculus for "impossible possible worlds," the "Pay Up" directive rests on an intuitive leap rather than a formal proof.

  **Recommendation:** To stress-test your view, look into the **"Agent Simulates Predictor"** (ASP) problem. It is a variant where the agent's ability to simulate the predictor creates a paradox that breaks standard FDT/UDT formulations. If your view cannot solve ASP without ad-hoc constraints, it is not yet a complete theory.
