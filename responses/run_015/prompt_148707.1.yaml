  8.  *(Self-Correction)*: Wait, I should check if Hofstadter specifically addresses this. In *I Am a Strange Loop*, Chapter 26 ("The Souls of Animals and Machines"), he discusses how much of a "soul" other entities have. He admits degrees. But he distinguishes between having a *symbol* of someone and that symbol *being* someone. The symbol is passive data relative to the host's active loop.
      *   Okay, I will stick with the **Process vs. Structure** distinction.

