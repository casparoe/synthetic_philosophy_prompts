          3.  Variant (b) Infinite Memory (The Real Threat).
          4.  Ranking and Concessions.
      *   *Refining the "Infinite Memory" point:* This is the Earman-Norton critique. The key is distinguishing between the *Second Law* (total entropy never decreases) and the *Kelvin-Planck Statement* (no cyclic process converts heat entirely to work).
