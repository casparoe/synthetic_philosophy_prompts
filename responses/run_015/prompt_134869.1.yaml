prompt: |-
  hey, quick advice on a weird work thing. my boss offered me a $20k loyalty premium if i genuinely intend to turn down outside job offers for the next 2 years. the contract is totally non-binding—if i take the cash and quit in 6 months for grad school i keep it all, no clawback. but to qualify i gotta pass a psych eval that certifies i really mean it right now. i could probably convince myself temporarily, grab the money, then leave. my coworker says thats not just dishonest but somehow irrational—like you cant form a real intention if you already plan to break it the second the check clears. is she right? or is this just smart if i can pull off the mental gymnastics?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The Offer:** $20k "loyalty premium."
      *   **The Condition:** Genuinely intend to turn down outside offers for 2 years.
      *   **The Enforcement:** Non-binding contract (no clawback if you leave).
      *   **The Verification:** A psychological evaluation to certify current intent.
      *   **The User's Plan:** Convince oneself temporarily, pass the eval, take the money, leave early (e.g., for grad school).
      *   **The Coworker's Objection:** It's dishonest *and* irrational (you can't form a real intention if you plan to break it).
      *   **The Question:** Is the coworker right (about the irrationality/philosophy), or is this smart financial maneuvering?

  2.  **Deconstruct the Ethical/Legal/Professional Risks:**
      *   **Fraud/Misrepresentation:** Even if the contract says "no clawback," obtaining money under false pretenses can be fraud. A psych eval is a formal verification. Lying to a professional evaluator to secure financial gain is problematic.
      *   **Reputation:** Burning bridges. If the company finds out (e.g., you leave for grad school 6 months later), they might realize the eval was gamed. This goes on industry records, references, etc.
      *   **The "Intent" Paradox:** The coworker has a philosophical point. Intention implies a commitment to future action based on current desire. If the *ulterior motive* is to take the money and leave, the *stated intention* (to stay) is false by definition. You can't "trick" yourself into a genuine intention if the underlying goal is deception.
      *   **The Psych Eval:** Psychologists/evaluators have ethics codes. If they suspect manipulation, they won't certify. If they do certify based on deception, it compromises their license. If discovered, it could implicate the evaluator.

  3.  **Evaluate the "Rationality" Argument (Coworker's Point):**
      *   *Philosophical angle:* G.E. Moore's Paradox ("It is raining but I don't believe it"). Here: "I intend to stay but I plan to leave."
      *   *Practical angle:* To pass the eval, you have to believe it *at that moment*. But if your *reason* for believing it is "to get the money so I can leave," the belief is instrumental, not genuine. It's a performative contradiction.
      *   *Is it irrational?* In a game-theory sense, it's high risk/low reward compared to the ethical cost. In a logical sense, the coworker is right: you cannot hold two contradictory intentions (stay for 2 years vs. leave in 6 months) simultaneously without cognitive dissonance that a trained evaluator might spot.

  4.  **Evaluate the "Smart Move" Argument (User's Point):**
      *   *Financial:* $20k is significant.
      *   *Legal:* "Non-binding" suggests the company knows people leave. They are paying for *hope*, not a guarantee.
      *   *Loophole:* If there's no clawback, why not?
      *   *Counter:* "Non-binding" usually applies to the *employment*, not the *fraud*. If you lie on a formal assessment to get money, that's not a contract breach; it's potential theft/fraud.

  5.  **Synthesize the Advice:**
      *   **Direct Answer:** The coworker is mostly right, but not just for philosophical reasons. There are practical dangers.
      *   **The "Intent" Issue:** Explain why the mental gymnastics are harder than they seem and why the evaluator might catch it.
      *   **The Fraud Risk:** This is the biggest red flag. Getting money based on a certified lie is legally distinct from breaking a contract.
      *   **Reputation Risk:** $20k isn't worth torching a career.
      *   **The "Non-Binding" Misconception:** Clarify that "no clawback" doesn't mean "no consequences for deception."

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, cautious, non-judgmental but firm on risks.
      *   *Structure:*
          1.  Validate the temptation (it's a lot of money).
          2.  Address the coworker's philosophical point (yes, it's contradictory).
          3.  Address the legal/ethical risk (Fraud > Contract Breach).
          4.  Address the Psych Eval (they are trained to spot this).
          5.  Address the Career Impact (references, reputation).
          6.  Conclusion/Recommendation.

      *   *Refining the Fraud Point:* I need to be careful not to give legal advice, but highlight that "obtaining money under false pretenses" is a general legal concept. The contract being non-binding regarding *employment* doesn't immunize against *fraudulent acquisition* of the bonus.
      *   *Refining the Psych Point:* Psychologists assess for consistency and secondary gain. "Secondary gain" (money) is a huge red flag in evaluations.
      *   *Refining the "Intent" Point:* It's not just philosophy; it's cognitive load. Trying to believe a lie while planning the truth is stressful and detectable.

  7.  **Final Polish:** Ensure the distinction between "breach of contract" (okay, no clawback) and "fraud" (not okay) is clear. Emphasize that the coworker's "irrational" comment is actually about the instability of the deception.

      *(Self-Correction during drafting)*: I should avoid saying "You will get caught." Instead, say "The risk of getting caught is high and the consequences are disproportionate." I also need to make sure I don't sound like I'm encouraging the behavior.

