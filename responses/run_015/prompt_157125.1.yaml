prompt: |-
  I'm in a graduate seminar on Wittgenstein's On Certainty, and after class two classmates got into an argument that nobody else in the room could referee. The case they were arguing over: now that cheap, convincing synthetic video is everywhere, is the assumption that video recordings are generally reliable records of what happened — one of what the secondary literature calls hinges — actually in the process of shifting?

  Maya: On Wittgenstein's picture that assumption was never a hypothesis confirmed by evidence. You can't check a recording without relying on other records and on other people's reports, so the demand to verify it is a regress rather than a question, and there is no such thing as answering it. That means the deepfake situation isn't new evidence bearing on a belief; it's a change in what we can do — practices of settling disputes by footage are becoming unworkable. And Wittgenstein allows that what is firm can silt up and move over time, so the honest description is that the hinge may be eroding, with no question of whether that erosion is justified.

  Tom: If being a hinge just means standing outside the game of reasons, then hinge talk can't tell this case apart from the conspiracist who takes it as certain that every official record is fabricated and treats your evidence as part of the fraud. He too reports an unshakeable certainty. Your only comeback is that our community happens to rely on footage — a sociological fact about us, not a reason. So hinge epistemology either collapses into relativism or is conservatism with better vocabulary.

  Maya: That misdescribes what a hinge is. Hinges show up in what people do, not in what they say they're certain of: we find our way by photographs, we settle insurance claims with footage, and a community that declared all recordings unreliable while going on relying on them in practice would have said nothing at all. The conspiracist's certainty is idle in exactly that way — it changes nothing about how he finds out whether his train was cancelled. That is a principled distinction, not head-counting.

  Tom: But "makes no difference in practice" is an ordinary empirical test, and it is doing justificatory work. You are saying, in effect, that reliance on records has worked and still mostly works, and that where it stops working we revise — which is plain evidential reasoning about reliability, available for any proposition. So the view is unstable: either hinges sit outside reasons and you have no criticism of the conspiracist, or they answer to reasons and nothing distinctive remains — it is just the old problem of induction in new words.

  Please adjudicate this move by move: for each of the four contributions, say what is right and what is mistaken, and then say what both of them are missing. I'd especially like to know whether hinge epistemology has any principled way to distinguish a hinge that is genuinely eroding from one a conspiracist merely declares dissolved.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on Wittgenstein's *On Certainty* (OC).
      *   **Scenario:** Two classmates (Maya and Tom) arguing about whether the reliability of video recordings is a "hinge" proposition that is currently shifting due to deepfakes.
      *   **Task:** Adjudicate the argument move-by-move (4 contributions total), identifying what is right and mistaken in each. Then, identify what *both* are missing.
      *   **Specific Focus:** Does hinge epistemology have a principled way to distinguish a genuinely eroding hinge from a conspiracist's declaration?

  2.  **Deconstruct the Arguments:**

      *   **Maya 1:**
          *   *Claim:* Video reliability is a hinge (not a hypothesis confirmed by evidence). Verification leads to regress. Deepfakes aren't new evidence against a belief; they change practices (settling disputes). Hinges can shift/silt up over time (OC §96-99). Erosion isn't about justification.
          *   *Wittgensteinian Basis:* Hinges are exempt from doubt (OC §341), verification requires hinges (OC §109), hinges can change (OC §96).
          *   *Strength:* Captures the non-evidential status of hinges. Acknowledges historical fluidity.
          *   *Weakness:* Risks making the shift seem passive or inevitable without addressing *why* this specific shift counts as erosion rather than just noise.

      *   **Tom 1:**
          *   *Claim:* If hinges are outside the game of reasons, hinge epistemology can't distinguish normal uncertainty from radical skepticism/conspiracism. The conspiracist also claims certainty. The only comeback is sociological ("we rely on it"), which is relativism/conservatism.
          *   *Wittgensteinian Basis:* The challenge of skepticism (OC §4, §609). The worry that OC is merely descriptive/anthropological.
          *   *Strength:* Hits the classic "quietism vs. normativity" tension in OC interpretations. Points out the structural similarity between the hinge holder and the dogmatist.
          *   *Weakness:* Conflates *professed* certainty with *enacted* certainty. Ignores the role of practice/action in defining hinges.

      *   **Maya 2:**
          *   *Claim:* Hinges are shown in *doing*, not saying. We use photos/footage. A community claiming unreliability but using it is contradictory. The conspiracist's certainty is "idle" (doesn't change action). This is a principled distinction, not head-counting.
          *   *Wittgensteinian Basis:* Meaning as use (PI), certainty as a way of acting (OC §7, §204). The "idle wheel" argument (PI §472-ish, though more OC §4).
          *   *Strength:* Brings in the pragmatic criterion. Distinguishes between grammatical rules and empirical claims.
          *   *Weakness:* Might underestimate how conspiracists *do* change practices (e.g., refusing vaccines, ignoring court evidence). The line between "idle" and "action-guiding" can be blurry in radicalization.

      *   **Tom 2:**
          *   *Claim:* "Makes no difference in practice" is an empirical test. If you use it to justify keeping the hinge, you're doing evidential reasoning (it works). This collapses hinges back into induction/reliability. Unstable dilemma: Outside reasons = no criticism; Inside reasons = just old induction.
          *   *Wittgensteinian Basis:* The dilemma of quietism vs. naturalized epistemology.
          *   *Strength:* Presses the normative force. If practice justifies the hinge, isn't the hinge just a very well-confirmed empirical generalization?
          *   *Weakness:* Misunderstands the *logical* status of the practice. The practice doesn't *justify* the hinge; the practice *constitutes* the language game within which justification happens. He treats the "form of life" as an empirical premise.

  3.  **Evaluate "What Both Are Missing":**
      *   They are treating hinges as *propositions* that can be "true" or "false" or "eroding." Wittgenstein emphasizes they are more like *rules* or the *scaffolding*.
      *   They are focusing on the *individual's* certainty vs. the *community's* practice.
      *   **Crucial Missing Point:** The distinction between a *local* breakdown (deepfakes make specific footage doubtful) vs. a *global* breakdown (nothing is certain). Wittgenstein allows for local doubt only against a background of global certainty.
      *   **The Conspiracist Distinction:** The conspiracist turns a hinge into a counter-hinge (a dogma). A genuine erosion happens when the *system* of judgment can no longer function without revision. The conspiracist *pretends* to doubt everything but actually relies on hidden hinges (e.g., logic, memory).
      *   **Normativity:** Hinges aren't just descriptions; they have a normative grip. If you violate them, you aren't just "different," you are unintelligible *within that game*.

  4.  **Drafting the Adjudication (Iterative Process):**

      *   *Maya 1:* Right about non-evidential status and fluidity. Mistaken to imply the shift is purely passive ("silt up"); human agency/resistance matters.
      *   *Tom 1:* Right to press the normativity issue (is this just conservatism?). Mistaken to equate the hinge's "ungroundedness" with the conspiracist's "dogmatism." One opens a game; the other closes it.
      *   *Maya 2:* Right about action/practice (OC §7). Mistaken to assume the conspiracist is always "idle"; some act on their doubts. The distinction needs to be deeper than just "do they buy train tickets?"
      *   *Tom 2:* Right to spot the risk of naturalism (hinges becoming empirical generalizations). Mistaken to think appealing to practice is "evidential reasoning." Practice is the *bedrock*, not the *evidence*.

      *   *Synthesis/Missing:* The key is the **systemic role** of the proposition. A hinge is a hinge because of its *logical location* in the web of belief, not its content. Deepfakes introduce *local* doubt, which requires *other* hinges to resolve (e.g., "expert analysis is reliable"). If *all* verification methods are doubted, language games stop. The conspiracist selectively doubts hinges to protect a core dogma, whereas genuine erosion forces a restructuring of the *whole* system of verification. Also, the "riverbed" metaphor (OC §96-99) implies slow movement, not sudden collapse.

  5.  **Refining the "Principled Distinction" (The Core Question):**
      *   How to tell eroding hinge vs. conspiracist?
      *   *Criterion 1:* **Recoil.** If you doubt X, what else must you doubt? If doubting video forces you to doubt courts, science, memory, etc., you are attacking the scaffolding. If you doubt video but keep using it when convenient, you are being inconsistent (conspiracist).
      *   *Criterion 2:* **Productivity.** Does the doubt allow for new methods of verification (forensics)? Or does it block verification entirely ("it's all fake")? Genuine erosion leads to new techniques (watermarking, blockchain verification). Conspiracism leads to paralysis or reliance on authority.
      *   *Criterion 3:* **Inheritance.** Hinges are inherited (OC §144). Conspiracism is usually adopted.

  6.  **Final Polish:** Ensure the tone is appropriate for a graduate seminar adjudication (rigorous, charitable, textually grounded in *On Certainty*). Use specific paragraph references where possible (mental check: §341, §96, §105, §204, §609).

      *   *Self-Correction on Tom 2:* Tom argues that checking if it "works" is empirical. I need to clarify that for Wittgenstein, "working" isn't a truth-condition; it's a condition of the possibility of meaning. Tom treats "success" as a truth-maker; Wittgenstein treats it as a life-condition.

      *   *Self-Correction on Maya 2:* She says the conspiracist's certainty is idle. I need to nuance this. The conspiracist's *doubt* is idle, not necessarily their certainty. Their doubt doesn't integrate into a coherent system of action.

  7.  **Final Structure:**
      *   Introduction (setting the stage).
      *   Move-by-Move Analysis (Maya 1, Tom 1, Maya 2, Tom 2).
      *   What Both Are Missing (The Systemic/Logical Point).
      *   The Principled Distinction (Answering the specific prompt).

  8.  *(Final Review against constraints)*: Did I answer the specific question about the principled distinction? Yes. Did I cover all 4 moves? Yes. Is it grounded in OC? Yes.

      *Let's write.*
answer: |-
  This is a sophisticated exchange that cuts to the heart of the interpretive tensions in *On Certainty* (OC): the tension between the *logical* status of hinges (exempt from doubt) and their *historical* fluidity (riverbed movement), and the tension between *quietism* (describing our practices) and *normativity* (criticizing irrationality).

  Here is an adjudication of the four moves, followed by an analysis of what both interlocutors miss and how to resolve the conspiracist problem.

  ### Move 1: Maya
  **Claim:** Video reliability is a hinge (non-evidential). Deepfakes represent a shift in practice, not new evidence. Hinges can erode over time without justification.

  *   **What is Right:** Maya correctly identifies the logical status of the proposition. In OC §341, Wittgenstein says, "questions that we cannot ask... are not empirical questions." Verifying a recording always presupposes other certainties (the camera wasn't tampered with, the witness is sane), leading to the regress Maya mentions (OC §109). She also correctly cites the "riverbed" metaphor (OC §96–99): hinges are not eternal; hard rock can turn to sand. The deepfake revolution is a material change in the "form of life" that makes the old hinge ("video shows truth") difficult to hold.
  *   **What is Mistaken:** Maya risks presenting the erosion of hinges as too passive ("silt up"). Wittgenstein emphasizes that hinges are held fast by *us* acting (OC §144). By framing this as a change in "what we can do" rather than a change in what we *must* presuppose to make sense, she leans toward a technological determinism that underplays the normative resistance we ought to offer. If hinges are merely what is currently "workable," she opens the door to Tom's relativism charge.

  ### Move 2: Tom
  **Claim:** If hinges are outside reasons, hinge epistemology cannot distinguish itself from conspiracism. Both claim certainty. The only defense is sociological ("we rely on it"), which is relativism.

  *   **What is Right:** Tom identifies the "quietist challenge." If the only definition of a hinge is "what we don't doubt," then the conspiracist who says "I don't doubt that all records are fakes" is playing the same grammatical move. If Wittgenstein's only reply is "but *we* doubt records," that is indeed mere conservatism or tribalism (OC §609 touches on the limits of justification). Tom correctly presses the point that OC must have normative teeth, or it is merely anthropology.
  *   **What is Mistaken:** Tom conflates *professed* certainty with *enacted* certainty. He treats the hinge as a psychological state ("unshakeable certainty") rather than a logical function. Wittgenstein is explicit that saying "I know" is often nonsense (OC §115); what matters is how the proposition functions in the language game. Tom assumes the conspiracist is playing the same game but with different rules, whereas Wittgenstein would suggest the conspiracist is often refusing to play the game of giving and asking for reasons entirely.

  ### Move 3: Maya
  **Claim:** Hinges are shown in doing, not saying. The conspiracist's certainty is "idle" (doesn't change action). This is a principled distinction based on practice.

  *   **What is Right:** This is her strongest move, aligning with OC §7 ("action lies at the bottom of the language game") and OC §204 ("giving grounds... comes to an end... in acting"). She correctly notes that a community claiming video is unreliable while using it in court is not shifting a hinge; they are speaking nonsense. The distinction between a grammatical rule and an empirical claim is indeed found in usage.
  *   **What is Mistaken:** She underestimates the "active conspiracist." Some conspiracists *do* change their practices (e.g., refusing to accept court evidence, avoiding hospitals). If the criterion is merely "does it change behavior?", a radicalized conspiracist passes the test. Maya needs a stronger criterion than "idle vs. active" to distinguish *rational* hinge shifts from *irrational* dogmatism. She implies the distinction is obvious, but in polarized contexts, the "practices" of the conspiracist are often coherent within their own sub-culture.

  ### Move 4: Tom
  **Claim:** Checking if it "makes a difference" is an empirical test. If you keep hinges because they work, you are doing induction. Hinge epistemology collapses into either dogmatism or naturalized empiricism.

  *   **What is Right:** Tom spots a genuine vulnerability in "pragmatic" readings of Wittgenstein. If we keep a hinge because "reliance on records has worked," we have turned the hinge into a highly confirmed empirical generalization (the "old problem of induction"). This threatens the distinctiveness of the hinge concept. If hinges answer to success conditions, they are not truly outside the game of reasons.
  *   **What is Mistaken:** Tom misunderstands the status of "working." For Wittgenstein, a language game "working" is not an empirical confirmation of its truth; it is the condition for the possibility of truth and falsity. We don't keep the hinge because it is useful; we keep it because without it, the concept of "useful" loses its grip. Tom treats the "form of life" as a premise in an argument, rather than the background against which arguments occur.

  ---

  ### What Both Are Missing

  Both Maya and Tom are treating hinges as **propositions with a specific content** (e.g., "video is reliable") that can be individually tagged as "hinge" or "empirical." They miss the **systemic and logical role** of hinges in *On Certainty*.

  1.  **The Holism of the Scaffolding:** A proposition is not a hinge in isolation; it is a hinge relative to a specific inquiry. "Video is reliable" might be a hinge in a traffic court but an empirical hypothesis in a forensic lab. Wittgenstein writes, "the same proposition may get treated at one time as something to test by experience, at another as a rule of testing" (OC §98). Both students are arguing as if the status of the proposition is fixed, rather than dependent on its function in a specific investigation.
  2.  **The Direction of Fit:** They miss that hinges are not *chosen* because they work (Tom's worry), nor do they simply *erode* like weathering stone (Maya's worry). Hinges are inherited (OC §144). The normative force comes from the fact that to doubt them is to lose the ability to communicate within that form of life. The missing piece is **intelligibility**. The question isn't "is this belief justified?" or "does this person act on it?" but "can this doubt be integrated into a coherent system of judgment?"

  ### The Principled Distinction: Eroding Hinge vs. Conspiracist

  Does hinge epistemology have a principled way to distinguish a hinge that is genuinely eroding from one a conspiracist merely declares dissolved? **Yes, but it requires looking at the consequences for the *system* of judgment, not the individual proposition.**

  Here is the three-part test derived from OC that adjudicates the deepfake case:

  **1. The Recoil Test (Systemic Cost)**
  *   **Genuine Erosion:** If we stop treating video as reliable, we must develop *new* techniques of verification that take its place (e.g., cryptographic signing, blockchain ledgers, chain-of-custody protocols). The doubt is productive; it forces a restructuring of the verification system while preserving the goal (establishing truth).
  *   **Conspiracist:** The conspiracist doubts the video but offers no alternative method of verification that is not itself subject to the same doubt. If *all* records are fake, then *no* dispute can be settled. The doubt is parasitic; it destroys the language game of "evidence" without replacing it. As Wittgenstein says, "If you tried to doubt everything you would not get as far as doubting anything. The game of doubting itself presupposes certainty" (OC §115).

  **2. The Inheritance Test (Historical Continuity)**
  *   **Genuine Erosion:** The shift is gradual and communal. It happens because the *community* finds it can no longer coordinate action using the old hinge. It is a "riverbed" shift (OC §96).
  *   **Conspiracist:** The doubt is usually adopted individually or in sects against the wider community's practice. The conspiracist claims to see through the "illusion" that binds everyone else. Wittgenstein notes that while hinges can change, they are generally "inherited" (OC §144). A sudden, voluntary rejection of a foundational practice by a subgroup is typically dogma, not a hinge shift.

  **3. The Local/Global Distinction**
  *   **Genuine Erosion:** We doubt *specific* videos or *specific* sources, relying on *other* hinges (e.g., "expert forensic analysis is reliable"). We trade one certainty for another.
  *   **Conspiracist:** The conspiracist treats the doubt as global ("All official records are fabricated"). Wittgenstein allows for local doubt only against a background of global certainty. To doubt the background itself is not to play a more rigorous epistemic game; it is to step outside the conditions of meaning.

  **Verdict:**
  Maya is right that the deepfake situation puts pressure on the hinge, but she must acknowledge that we are currently resolving this by creating *new* hinges (e.g., "authenticated digital signatures are reliable"), not by abandoning the practice of recording. Tom is right that we need a normative standard, but he is wrong to think that standard must be "evidence." The standard is **coherence of action**. The conspiracist fails because their doubt renders their own actions unintelligible (they complain about "fake news" using platforms that rely on the same digital infrastructure), whereas the genuine erosion of a hinge leads to a new, stable form of life.

  **Final Adjudication:** Maya wins the description of the situation (it is a hinge under pressure), but Tom wins the warning about normativity (we need a way to criticize the conspiracist). The synthesis is that hinges are normative *because* they constitute the conditions of intelligibility. The conspiracist is not wrong because they lack evidence; they are wrong because their doubt makes the very concept of "evidence" impossible, rendering their speech acts void.
