  MEMORANDUM

  TO: City Monuments Board
  FROM: [Your Name], Board Member
  DATE: October 23, 2023
  SUBJECT: Recommendation on Brennan Avenue Designation

  **I recommend we retain the Brennan Avenue designation conditional on the immediate installation of critical contextual plaques at all major intersections, paired with a dedicated fund for community history projects in the displaced districts.**

  This recommendation adopts the Chair's "twin-plaque" concept but strengthens it to ensure the contextualization does not function as apology but as correction. We must reject the premise that street naming is merely historical indexing; it is an active form of civic honor. However, erasure via renaming removes the physical site of conflict from public view, whereas a rigorously curated marker transforms the avenue into a monument of reckoning rather than celebration.

  The strongest argument against this approach comes from residents advocating for renaming, who contend that honor is indivisible. They argue that keeping Brennan's name on the map, regardless of accompanying text, continues to signal state endorsement of his legacy, and that no amount of context can neutralize the harm of a eugenicist's name appearing on a mailbox or GPS. This is a valid moral claim: infrastructure naming is not a history lesson, it is a valuation. However, renaming risks treating history as a contaminant we can sanitize rather than a reality we must navigate. By retaining the name alongside a stark accounting of the 1920s zoning displacements, we force the daily friction of that history into the open. The goal is not to balance the ledger but to make the imbalance visible to every commuter.

  **Implementation Timeline**
  *   **November 2 (Post-Vote):** Form sub-committee with community representatives from displaced districts to draft plaque text.
  *   **December 15:** Finalize text and design; release RFP for fabrication.
  *   **March 1:** Installation of signage at four major intersections and avenue termini.
  *   **March 15:** Launch of associated digital archive and community grant fund.

  **Practical Risks and Mitigation**
  *   **Rename:** High logistical cost (maps, emergency services, deeds) and potential erasure of the aqueduct's engineering history. *Mitigation: N/A (Not recommended).*
  *   **Keep (Status Quo):** High risk of continued protest and perceived indifference to racialized housing harm. *Mitigation: N/A (Not recommended).*
  *   **Twin-Plaque:** Risk of vandalism, plaque fatigue (public ignoring text), or the perception of "moral laundering" where the plaque serves to excuse the name. *Mitigation:* Text must be direct ("This avenue honors Brennan who also designed..."), not passive. Regular maintenance budget allocated specifically for these markers to signal institutional commitment.

  We vote Thursday. I urge we choose the path that demands engagement over the path that offers relief.

  ***

  **Confidence Note**

  I am about 75% confident in this recommendation. The part I am least sure about is whether the twin-plaque approach successfully avoids moral laundering or merely doubles the harm by institutionalizing the tension. There is a genuine risk that the plaque becomes a "get out of jail free" card for the city, allowing us to feel we've addressed the injustice while keeping the honorific intact. If the public reads the plaque and walks away thinking "well, they explained it, so it's fine," the strategy fails.
