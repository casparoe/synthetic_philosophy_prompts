answer: |-
  # The Special Composition Question: Decision Tree

  **Instructions:** Answer the following questions about whether certain parts make up a single, real object. Follow the arrows to find your metaphysical position.

  ---

  ### **Question 1: The Arbitrary Fusion**
  Consider all the parts that make up the **Eiffel Tower** taken together with all the parts that make up **your left shoe**.
  Do those parts, taken together, make up one single object?

  *   **YES** → Go to **Position A**
  *   **NO** → Go to **Question 2**

  ---

  ### **Question 2: The Artifact**
  Consider the legs, seat, and backrest of a standard **wooden chair**.
  Do those parts make up one single object (a chair)?

  *   **YES** → Go to **Question 3**
  *   **NO** → Go to **Question 4**

  ---

  ### **Question 3: The Living Thing**
  Consider the cells and organs of a **living cat**.
  Do those parts make up one single object (a cat)?

  *   **YES** → **Position B: Moderate Restrictivism (Commonsense)**
  *   **NO** → **Position C: Unoccupied Leaf (Artifact-Only View)**

  ---

  ### **Question 4: The Living Thing (Revisited)**
  Consider the cells and organs of a **living cat**.
  Do those parts make up one single object (a cat)?

  *   **YES** → **Position D: Van Inwagen's Organicism**
  *   **NO** → **Position E: Mereological Nihilism**

  ---

  ## **The Positions (Leaves)**

  ### **Position A: Mereological Universalism**
  *   **Your View:** Any collection of objects, no matter how scattered or unrelated, composes a further object.
  *   **Commitments:** The Eiffel Tower + Shoe exists. The chair exists. The cat exists.
  *   **Diagnosis:** You deny that composition is restricted. There are far more objects than common sense suggests, including "trout-turkeys" and random fusions.

  ### **Position B: Moderate Restrictivism (Commonsense)**
  *   **Your View:** Composition happens for familiar, functional, or natural objects, but not for arbitrary collections.
  *   **Commitments:** The Eiffel Tower + Shoe does *not* exist. The chair exists. The cat exists.
  *   **Diagnosis:** You align with everyday intuition. You accept ordinary medium-sized dry goods and living things, but reject gerrymandered fusions.

  ### **Position C: Unoccupied Leaf (Artifact-Only View)**
  *   **Your View:** Human-made artifacts exist, but living organisms do not (they are just simples arranged organism-wise).
  *   **Commitments:** The Eiffel Tower + Shoe does *not* exist. The chair exists. The cat does *not* exist.
  *   **Diagnosis:** This view is logically coherent but unoccupied because it conflicts with the widespread intuition that natural living beings are more ontologically fundamental than human-made tools.

  ### **Position D: Van Inwagen's Organicism**
  *   **Your View:** Composition occurs if and only if the activity of the parts constitutes a life.
  *   **Commitments:** The Eiffel Tower + Shoe does *not* exist. The chair does *not* exist. The cat exists.
  *   **Diagnosis:** You believe only living organisms are composite objects. Artifacts (like chairs) and corpses are just simples arranged in certain ways, not true objects.

  ### **Position E: Mereological Nihilism**
  *   **Your View:** Composition never occurs. There are no composite objects, only simple particles (simples).
  *   **Commitments:** The Eiffel Tower + Shoe does *not* exist. The chair does *not* exist. The cat does *not* exist.
  *   **Diagnosis:** You deny the existence of all composite objects. Talk of "chairs" and "cats" is merely a convenient way of speaking about simples arranged chair-wise or cat-wise.

  ---

  ## **Limitations & Indistinguishable Pairs**

  **1. Semantic Variants (Nihilism vs. Fictionalism)**
  This tree tests **ontological commitment** (what exists), not **semantic stance** (how we speak). It cannot separate **Mereological Nihilism** from **Nihilistic Fictionalism**. Both answer "No" to every existence question. The difference is that the Fictionalist says "Chairs don't exist, but our talk about them is useful fiction," while the hard Nihilist might say "Chairs don't exist, and our talk is false." The tree classifies both as **Position E**.

  **2. Restrictivist Criteria (Contact vs. Fastening)**
  Within **Position B (Moderate Restrictivism)**, this tree does not separate *why* you think the chair exists. A **Contact Restrictivist** (composition requires touching) and a **Fastening Restrictivist** (composition requires mechanical binding) will both answer "Yes" to the Chair question and "No" to the Eiffel+Shoe question. To separate them, you would need edge cases (e.g., "Does a glued chair exist?" vs. "Does a stacked chair exist?").

  **3. Organicism vs. Personism**
  This tree classifies anyone who accepts living cats but rejects chairs as **Position D (Organicism)**. It does not separate Van Inwagen's view from a **"Person-Only" view** (only human persons compose). Both answer "Yes" to the cat question in this specific tree (assuming the student counts cats as lives). To separate them, you would need a question about non-human animals (e.g., "Does a bacterium compose an object?").
