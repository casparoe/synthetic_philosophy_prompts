answer: |-
  You are not inconsistent. Your voting record reflects a coherent ethical framework that prioritizes **contextual harm** and **procedural legitimacy** over abstract statistical parity. The standard fairness literature often treats "fairness" as a property of the model's output distribution alone. Your verdicts treat fairness as a property of the **decision system**, which includes the model, the human process, the target variable, and the timeline.

  Below is the principle that generates your verdicts, followed by the implications for impossibility theorems and randomization.

  ### The Principle of Aligned Burdens and Procedural Legitimacy

  **Statement:** A risk model is permissible only if its statistical constraints align with the direction of the adverse action, the validity of the target construct, the feasibility of recourse for the subject, and the stability of the process over time. Statistical parity is a secondary constraint that must yield to construct validity and recourse feasibility.

  This principle consists of four clauses.

  #### Clause 1: Directionality of Harm (The Burden Clause)
  *   **Rule:** If the decision confers a **benefit** (hiring, credit approval), constrain **False Negative Rates** (equal opportunity). If the decision imposes a **penalty** (fraud flag, detention), constrain **False Positive Rates** (equal protection).
  *   **Rationale:** Fairness requires symmetrizing the *burden*, not the error rates. In hiring, the burden is missing an opportunity (FN). In fraud/detention, the burden is wrongful accusation (FP).
  *   **Motivating Cases:**
      *   **Case 1 (Hiring):** Benefit decision $\rightarrow$ Equal TPR (minimize FN disparity).
      *   **Case 2 (Fraud):** Penalty decision $\rightarrow$ Equal FPR (minimize FP disparity).
      *   **Case 5 (Pretrial/FTA):** Penalty decision (detention) $\rightarrow$ Equal FPR.
  *   **Why 1 and 2 differ:** Though mathematically symmetric, the *ethical* direction is inverted. Your gloss ("equalize whichever error imposes a burden") was correct; this clause formalizes it.

  #### Clause 2: Epistemic Function and Construct Validity (The Truth Clause)
  *   **Rule:** If the model output is **advisory** (human-in-the-loop), prioritize **Calibration**. If the target variable is **corrupted** by systemic bias (construct invalidity), reject statistical fixes and invalidate the model.
  *   **Rationale:** A calibrated score allows a human to apply context; a biased target makes the context irrelevant. Statistical parity on a corrupted label codifies injustice.
  *   **Motivating Cases:**
      *   **Case 3 (Sepsis):** Advisory tool $\rightarrow$ Calibration required (nurses judge the risk).
      *   **Case 4 (Pretrial/Arrest):** Corrupted target (policing bias) $\rightarrow$ No statistical fix allowed.

  #### Clause 3: Feasibility of Recourse (The Agency Clause)
  *   **Rule:** Equal error rates are insufficient if the **actionable path to a positive outcome** is systematically harder for one group. Parity must extend to the *counterfactual feasibility* of changing the decision.
  *   **Rationale:** A model is unfair if it demands impossible sacrifices from one group to achieve the same result as another. This overrides static error-rate parity.
  *   **Motivating Cases:**
      *   **Case 6 (Credit/Recourse):** Equal FNR rejected because recourse (relocating vs. documenting income) was asymmetric.

  #### Clause 4: Procedural Integrity (The Process Clause)
  *   **Rule:** Fairness constraints apply only to partitions defined **ex-ante**. However, model updates must minimize **disparate churn** (instability) for unchanged inputs.
  *   **Rationale:** Post-hoc subgroup mining invites overfitting and gaming (p-hacking). Conversely, arbitrary model changes violate reliance interests, especially if those changes disproportionately harm one group.
  *   **Motivating Cases:**
      *   **Case 7 (Subgroup):** Ex-ante partition holds; post-hoc subgroup violation ignored to preserve process integrity.
      *   **Case 8 (Churn):** Disparate instability blocked rollout despite better static metrics.

  ---

  ### Application to Unlisted Cases

  To demonstrate precision, here are verdicts this principle generates for two scenarios you did not list:

  **Case A: Insurance Pricing.**
  *   *Scenario:* A model sets premiums. Group A has higher historical claims due to socioeconomic factors correlated with geography.
  *   *Verdict:* **Reject statistical parity; require Calibration.**
  *   *Reasoning:* Pricing is not a binary gate (Benefit/Penalty) but a continuous scale. The "burden" is overpayment relative to risk. Calibration ensures price matches risk. However, apply **Clause 2**: if "claims history" is corrupted by lack of access to care (e.g., health insurance), the target is invalid, and the model must be rejected or adjusted for construct validity.

  **Case B: Loan Modification Approval.**
  *   *Scenario:* Existing borrowers apply to modify terms to avoid default. Base rates of successful modification differ by group.
  *   *Verdict:* **Equal False Negative Rates (Opportunity).**
  *   *Reasoning:* This is a benefit decision (keeping a home). The burden is falling into default because modification was denied. Apply **Clause 1**. However, apply **Clause 3**: if Group A must provide documentation that is systematically harder to obtain (e.g., gig economy income), the model fails recourse parity even if FNR is equal.

  ---

  ### The Impossibility Hierarchy

  You asked if requirements like Recourse (Case 6) and Stability (Case 8) make the standard conflict worse. **Yes.**

  The standard impossibility theorem (Calibration vs. Error Rate Parity under different base rates) assumes a static, deterministic model with a valid target. You have added two dimensions: **Counterfactual Feasibility** and **Temporal Stability**.

  **The Hierarchy of Yield:**
  When constraints conflict, this principle dictates the following order of precedence (from highest to lowest):

  1.  **Construct Validity (Clause 2):** If the target is corrupted (Case 4), no statistical constraint saves the model. **Yields nothing.**
  2.  **Directionality of Harm (Clause 1):** You must align the parity constraint with the burden (FP vs. FN). **Yields Calibration** (unless advisory).
  3.  **Feasibility of Recourse (Clause 3):** If recourse is asymmetric (Case 6), the model is rejected even if Error Rate Parity holds. **Yields Static Accuracy.**
  4.  **Procedural Integrity (Clause 4):** Ex-ante definitions protect against gaming (Case 7); Stability protects against arbitrary churn (Case 8). **Yields Optimal Parity.**
  5.  **Statistical Parity:** This is the residual constraint. It must be sacrificed to satisfy the above.

  **Why this order?**
  Validity is truth; without it, fairness is meaningless. Directionality is ethical alignment; without it, you are optimizing the wrong error. Recourse is agency; without it, the subject is powerless. Stability is trust; without it, the system is arbitrary. Statistical parity is a mathematical proxy for these deeper values; when the proxy conflicts with the value, the value wins.

  ---

  ### The Randomization Question

  *Your Question:* Is randomizing decisions around the threshold to achieve parity a cheat or an honest reply?

  *The Principle's Verdict:* **It is an honest reply, but only if pre-registered.**

  1.  **Not a Cheat:** Randomization acknowledges that the model cannot perfectly resolve the trade-off between Validity, Harm Direction, and Parity. It shifts the burden from "prediction error" to "lottery risk." If the lottery weights are set to equalize the *expected burden* (Clause 1), it satisfies the ethical core of the principle.
  2.  **The Condition:** Under **Clause 4 (Procedural Integrity)**, this randomization rule must be defined **ex-ante**. If you train a deterministic model, see the disparity, and *then* add noise to fix it, you are engaging in post-hoc gaming. If the randomization rule is part of the model specification before training, it is procedurally legitimate.
  3.  **The Cost:** It reduces accuracy (utility). The principle accepts this cost (see Hierarchy) because Statistical Parity yields to Recourse and Stability, but Randomization is a mechanism to *achieve* Parity without violating Validity. It is preferable to distorting the model weights to fake parity.

  ---

  ### Limitations: Which Verdicts Cannot Be Accommodated?

  You asked me to say plainly which of your verdicts this principle cannot accommodate. There is one tension point: **Case 7 (The Subgroup).**

  Your vote to ignore the high false-positive rate in the narrow subgroup because it was not pre-registered is supported by **Clause 4 (Procedural Integrity)**. However, this creates a conflict with **Clause 2 (Construct Validity)** and **Clause 1 (Directionality)** if that subgroup disparity is large enough to suggest the model is learning a proxy for a protected characteristic that *should* have been pre-registered.

  *   **The Tension:** If the "narrow subgroup" is, for example, "women over 50 in Zip Code X," and they are suffering significantly higher FPRs, strict adherence to "Ex-Ante Definition" protects the bank from gaming accusations but fails the "Aligned Burdens" test for that vulnerable population.
  *   **The Accommodation Failure:** The principle prioritizes *process* in Case 7. If the subgroup harm is egregious, *outcome* fairness should arguably override *process* rigidity. Your verdict assumes the pre-registered list was comprehensive enough to capture morally relevant groups. If it wasn't, your vote in Case 7 was procedurally correct but substantively risky. The principle supports your *rule*, but warns that the rule requires the pre-registered list to be ethically exhaustive, which is often impossible.

  **Summary:** You are not inconsistent. You are operating under a **Systemic Fairness** framework rather than a **Statistical Fairness** framework. You prioritize the validity of the target, the direction of the harm, the agency of the subject, and the stability of the process. Statistical parity is merely a tool you deploy when those higher-order constraints allow it. Your hesitation on Case 7 is the only place where your commitment to Process risks undermining your commitment to Harm Alignment.
