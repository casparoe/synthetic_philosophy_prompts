answer: |-
  1. Setup and materials
  The state space is $\Omega = \{1, 2, 3, 4\}$, uniform prior. The event $E$ is "State is 1 or 2". There are two roles, Alice and Bob, with fixed partitions printed on role cards. Alice's partition: $\{\{1, 2, 3\}, \{4\}\}$. Bob's partition: $\{\{1, 2\}, \{3, 4\}\}$. In State 3, Alice observes $\{1, 2, 3\}$ (posterior $P(E)=2/3 \approx 0.67$) and Bob observes $\{3, 4\}$ (posterior $P(E)=0.5$). This creates initial disagreement. Seven pairs receive envelopes containing a secret state card (all State 3 for this session to ensure comparability) and their role cards. A public whiteboard sheet tracks announcements. Each pair gets a private scratchpad for calculations. The scoring rule is the Brier Score ($1 - (p - outcome)^2$), chosen because it is strictly proper, rewarding honest probability reporting over confidence gaming.

  2. Rules, vocabulary, and payoffs
  Participants earn points based on final accuracy. The session has two phases. In Phase 1 (Coarse), announcements must use the vocabulary: "Unlikely" ($\le 0.7$) or "Likely" ($> 0.7$). In Phase 2 (Fine), announcements must be exact percentages (e.g., "67%").
  Procedure per round:
  1.  **Bet (Private):** Before speaking, each writes "Bet Yes/No at Odds $X$" on a slip. This locks their willingness to trade before hearing the partner.
  2.  **Announce (Public):** Simultaneously reveal vocabulary/number to partner and record on the public sheet.
  3.  **Update:** Recalculate posterior based on partner's announcement and your partition.
  4.  **Repeat:** Do 3 rounds per phase.
  Payoffs: 100 points base. Subtract Brier penalty. If bets clash (one Yes, one No at compatible odds), the bet is executed virtually: winner +50, loser -50. If announcements converge to identical numbers, both get +20 bonus.
  The coarse grain is deliberately set at 0.7. In State 3, Alice (0.67) says "Unlikely". Bob (0.5) says "Unlikely". Neither learns anything new; the intersection of their information sets remains $\{3\}$, but the announcement "Unlikely" is consistent with multiple cells for both. They stall. In Phase 2, Alice says "67%". Bob knows this corresponds uniquely to Alice's cell $\{1, 2, 3\}$. He intersects this with his cell $\{3, 4\}$, isolating State 3. He updates to 0%. Agreement is forced by the precision of the signal, not persuasion.

  3. Timeline
  **00-05:** Group entry. Hand out envelopes. No explanation. Instructions on card: "Calculate $P(E)$. Do not show card."
  **05-20:** Phase 1 (Coarse). Three rounds of betting and announcing. Facilitator tracks public board. Expect stalls.
  **20-25:** Pause. Collect bets. Reveal no outcomes yet. Ask: "Could you agree?"
  **25-45:** Phase 2 (Fine). Reset beliefs to initial priors. Three rounds of exact numbers. Expect convergence.
  **45-55:** Second Betting. Compare willingness to bet before vs. after convergence.
  **55-75:** Debrief. Reveal theorem name. Discuss assumptions.
  **75:** End.
  Strict timing is essential. Use a visible timer. If calculations lag, allow calculators. If pairs finish early, they must verify their partner's update logic on the scratchpad.

  4. Debrief
  Begin by asking the pairs who converged in Phase 1 versus Phase 2. Highlight that the evidence never changed, only the *grammar* of exchange. Map the stall to the failure of the "meet" of partitions to refine under coarse bins. Map the convergence to the common knowledge of posteriors shrinking the possible state space until $P(E)$ is constant.
  Address the betting: When you wrote down odds, you were effectively stating a price. Willingness to bet against a partner with the same information is irrational; the game forces you to see that disagreement implies a bet opportunity.
  For your friend: Your objection correctly identifies that the Common Prior Assumption (CPA) is empirically fragile; people rarely share priors, so the theorem rarely predicts actual convergence. However, calling it vacuous mistakes a normative constraint for a descriptive prediction. The theorem does not say people *will* agree; it says that if they share priors and know each other's rationality, persistent disagreement is logically impossible. The vacuity lies not in the theorem, but in the assumption that real-world disagreeing agents satisfy the premises. The value is in showing that disagreement requires either different priors or opaque information structures, not just stubbornness.

  5. Failure modes
  First, calculation errors will occur. Students may miscalculate the intersection of partitions. *Fix:* Provide a "Update Cheat Sheet" showing the intersection table for $\Omega=\{1,2,3,4\}$ so they verify logic rather than arithmetic. Second, participants may treat the betting phase as a bluffing game. *Fix:* Emphasize points are for accuracy, not winning bets; betting is a diagnostic tool. Third, cynicism ("this is rigged"). *Fix:* Acknowledge the setup is stylized but insist the logic holds for any partition. Fourth, time overrun. *Fix:* Cut Phase 1 to two rounds if needed; the stall is visible immediately. If a pair converges too fast in Phase 1 (due to luck), pull them into the debrief as outliers to discuss why their partitions differed.

  6. What the activity cannot show
  The activity enforces the Common Prior Assumption by fiat; students do not feel the weight of assuming their partner starts with the same world-model, they are simply told to use uniform priors. Real disagreement often stems from priors, not information. Secondly, "Common Knowledge" is simulated by public announcement, but the infinite hierarchy ("I know that you know that I know...") is truncated to a few rounds. In reality, common knowledge is rarely achieved. Finally, the game removes psychological bias; students act as Bayesian calculators. Real agents suffer from motivated reasoning. You must explicitly state that the theorem applies to idealized rational agents, and the friction your friend observes comes from the deviation from this ideal, not a flaw in the logic. The game proves the constraint; it cannot prove the premise holds in the wild.
