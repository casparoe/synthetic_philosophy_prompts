answer: |-
  You are correct to suspect that treating identity as a single metaphysical question is the source of the friction you are experiencing, and the procedure should not attempt to answer one question with a purpose built into it but rather must ask several questions in sequence, beginning with the purpose of the inquiry itself. If we pretend there is just one question of identity, we force a binary true-or-false verdict onto what are actually three distinct relationships: physical continuity, historical provenance, and functional value. What goes wrong when we conflate them is that we end up either returning the wrong thing to a community because we prioritized material over sacred function, or denying an insurance claim because we prioritized historical naming over physical substance, or cataloging a copy as an original because we prioritized value over fabrication. The procedure needs to separate these strands immediately so that the committee is not arguing about truth when they are actually arguing about value or obligation.

  The first step of the procedure is to define the stake before examining the object, which means the committee must write down whether the question is being asked for insurance, repatriation, or cataloging purposes. For insurance, a good enough answer relies on material substance and market value, so if the object pays out, it must be the thing that was insured, regardless of whether it is spiritually the same. For repatriation, a good enough answer relies on cultural continuity and community designation, so if the community says the living copy is the ancestor, then the material fragments are secondary evidence rather than the primary object. For cataloging, a good enough answer relies on historical provenance and authorship, so if the form was destroyed, the link to the original creator is broken even if the material is the same. The procedure stops with a no if the purpose is cataloging and the form was destroyed, or if the purpose is insurance and the material is mostly gone, but it hands the decision back to the committee if the purpose is repatriation and the community's view on identity is not documented, because that issue is about what we care about rather than about what is true.

  Once the purpose is set, the second step is to assess material continuity, asking whether the majority of the significant fabric remains from the original date. This is where you handle the case of an object that survives while all its material is replaced bit by bit, often called the Ship of Theseus problem. The procedure should rule that if the replacement was gradual and part of maintenance, the object remains the same for cataloging and insurance, but if the replacement was sudden and total, it is a copy. The third step is to assess formal continuity, asking whether the object ceased to exist as a distinct form. This handles the case of an object destroyed and remade from its own material, because melting or burning destroys the form even if the atoms survive. The fourth step handles fission and fusion, where one thing gets cut into two or two fragments are joined into one. If one thing becomes two, neither fragment is the whole object for cataloging purposes, though both are part of the original material. If two things become one, the new assembly is a composite object unless one fragment dominates the identity, in which case the dominant piece carries the identity and the other becomes an addition.

  Running this on your marble torso, the purpose is likely cataloging and insurance. The material continuity is high because the original pieces were reassembled, and the formal continuity is intact despite the new arms and base, which count as restoration rather than remaking. The procedure says this is the same object for the catalogue and the insurance policy, though the value might be adjusted for the new parts. Running this on the ceremonial mask, the purpose is repatriation. The material continuity of the original is broken by the fire, but the functional continuity resides in the copy used by the community since 1961. The procedure says the copy is the object for repatriation because it carries the cultural life, while the fragments found in the private collection are historical remains that may also need returning but are not the primary ceremonial object. Running this on the bronze that was melted and recast from the same metal, the purpose is likely cataloging and value. The material continuity is perfect because the metal is the same, but the formal continuity is broken because melting destroys the artwork's form. The procedure forces the conclusion that this is not the original object but a nineteenth-century copy made of original material.

  I suspect the bronze is the result you will hate, because the procedure forces you to downgrade the object from an original work to a later recasting, which diminishes its provenance and potentially its value, even though the metal is authentic. The procedure forces this because identity in art is tied to the form created by the artist, not just the substrate, and melting is a terminal event for that form. If you accept the bronze as the original, you undermine the distinction between an artist's work and a later foundry's reproduction, which creates liability if you ever sell or lend it as an original. What would change my mind about the order of the questions is if a specific legal statute defines objecthood for your jurisdiction, such as a heritage law that ties identity strictly to material composition regardless of form, in which case the legal definition must supersede the purpose step. However, absent such a law, purpose must come first because identity is a tool we use to solve problems, not a fact we discover in the warehouse.

  The whole thing is most likely to go wrong when your colleagues actually try to use it because they will want to skip the purpose step and jump straight to looking at the object. The curator will want to say it is the same object to keep the prestige of the collection, and the lawyer will want to say it is the same object to minimize liability or maximize payout, so both will have an incentive to conflate material continuity with identity. They will try to treat the procedure as a way to confirm what they already want rather than a way to decide what is true for the specific context. To prevent this, the one-page note the director signs off on must require the purpose to be written in the first line before any description of the object is allowed, forcing them to commit to the lens through which they are viewing the problem before they examine the evidence. If they do not do this, the procedure will collapse back into a debate about feelings and value, and you will be back to where you started with twenty unresolved cases a year.
