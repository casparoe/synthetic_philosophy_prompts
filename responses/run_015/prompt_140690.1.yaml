prompt: |-
  Putting together the reading list for my grad seminar on comparative development — the why-are-some-countries-rich one, you know the genre — and before I assign another three hundred pages of it I want the spec rather than the theories. What would an explanation of cross-national income differences actually have to get right to be worth anything? Write me the desiderata list.

  Purpose, so you can argue about which demands are real: I want a theory good enough that (a) I'd let a student spend five years testing it and (b) I'd be willing to tell someone allocating aid money 'this is our best guess, and here's how much to trust it.' If some requirement comes out of one of those purposes and not the other, say so.

  Cases I want attached to each requirement, and I'd rather have argument than inventory:

  - The separation cases. Most of what we correlate with prosperity travels in a bundle, so I want a requirement that a theory say what it predicts where the bundle comes apart: a place with extractive-looking politics and a resource windfall, a place with decent formal institutions and terrible geography, a place that got rich fast while keeping institutions the institutions-camp would call bad. Give the case behind the requirement, not a list of countries.
  - Onset, persistence, and catch-up. Sustained growth starting somewhere, gaps that just sit there for a century, and then episodes of rapid convergence and of growth that collapses. I think these are three different explananda and that a lot of the literature quietly swaps between them; write that in as a requirement to declare which one is being explained, and tell me if you think it's a fake distinction.
  - Level versus growth rate. Something can explain why a place is rich without explaining why it keeps getting richer. Is respecting that a genuine desideratum or pedantry?
  - Within-border variation. Same formal institutions, same national culture, big and stable income gaps between regions. Whatever the theory is, does it have the resources to handle that, or does it just get to change the unit of analysis? I want your view on whether this is a requirement or a cheap shot.
  - Exogeneity. The cause can't just be income wearing a hat. But I suspect the truly exogenous candidates are the ones that can't explain much, and the ones that explain a lot are partly effects. If that's a real trade-off, make it explicit as a pair of desiderata that pull against each other and say which one you'd drop.
  - The 'five-year minister' test: its favoured causes mostly move over generations, while the people who'd act on it have an electoral term. Is being usable at the timescale policy actually runs on a requirement, or a category error imported from the policy world? This is the one I'm least sure about.
  - Risky prediction. It should be able to state something it would get wrong. Half the literature explains every outcome after the fact; say how you'd write that into the spec without it becoming a demand for a randomised experiment.

  Then flag any pair you think can't be jointly satisfied — that part is the real result, not the checklist. No citations and no reading list, I know the literature; I want the criteria and the reasoning behind them. Finish in three or four lines on which single requirement does the most damage to the institutions / geography / culture families respectively. Don't be polite about it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Comparative Development (Why are some countries rich?).
      *   **Task:** Create a "desiderata list" (specification of requirements) for a theory of cross-national income differences.
      *   **Purpose:** Two-fold: (a) Justify a 5-year PhD project, (b) Justify aid allocation decisions. Distinguish if a requirement stems from one but not the other.
      *   **Specific Cases/Requirements to Address:**
          *   Separation Cases (bundle breaking apart).
          *   Onset, Persistence, Catch-up (distinct explananda?).
          *   Level vs. Growth Rate (genuine desideratum or pedantry?).
          *   Within-Border Variation (requirement or cheap shot?).
          *   Exogeneity (trade-off between exogeneity and explanatory power).
          *   The 'Five-Year Minister' Test (policy timescale vs. structural timescale).
          *   Risky Prediction (falsifiability without RCTs).
      *   **Constraint:** Flag pairs that can't be jointly satisfied (the "real result").
      *   **Constraint:** No citations, no reading list.
      *   **Constraint:** Finish in 3-4 lines on which single requirement damages Institutions, Geography, and Culture families respectively.
      *   **Tone:** Direct, argumentative, not polite, academic but pragmatic.

  2.  **Deconstruct Each Requirement:**

      *   **Purpose (PhD vs. Aid):**
          *   PhD needs internal validity, mechanism, novelty.
          *   Aid needs external validity, actionability, timescale.
          *   *Decision:* Most requirements serve both, but "Five-Year Minister" is heavily Aid-skewed. "Risky Prediction" is heavily PhD-skewed (science vs. engineering).

      *   **Separation Cases:**
          *   *Argument:* Correlation isn't causation. If institutions and income move together, you don't know which is which. You need cases where they diverge (e.g., Botswana vs. DRC, or China's growth with "bad" institutions).
          *   *Requirement:* The theory must predict outcomes when the standard bundle (institutions + geography + culture) is unbundled.

      *   **Onset, Persistence, Catch-up:**
          *   *Argument:* Explaining the Industrial Revolution (onset) is different from explaining why Haiti stays poor (persistence) or why Korea caught up (convergence).
          *   *Requirement:* The theory must specify which transition it models. Treating them as identical is a sin of equivocation. It's not a fake distinction; mechanisms differ (innovation vs. adoption vs. maintenance).

      *   **Level vs. Growth Rate:**
          *   *Argument:* Solow model distinction. You can be rich because you invested a lot 50 years ago (level), or because you innovate constantly (growth).
          *   *Requirement:* Genuine desideratum. Confusing them leads to policy errors (pushing investment when you need innovation).

      *   **Within-Border Variation:**
          *   *Argument:* If national institutions explain everything, why is North Dakota different from Mississippi? Or Guangdong different from Gansu?
          *   *View:* It's a requirement, not a cheap shot. If a theory relies on "National Culture" or "National Institutions," it fails to explain sub-national variance unless it allows those factors to vary sub-nationally (which undermines the "National" claim).
          *   *Nuance:* It forces the theory to be granular.

      *   **Exogeneity:**
          *   *Argument:* Geography is exogenous but static. Institutions are endogenous (rich countries build better courts).
          *   *Trade-off:* Strict exogeneity kills explanatory power (geography determines little). High explanatory power usually involves endogeneity (institutions).
          *   *Decision:* Drop strict exogeneity. Demand *identification* instead. Acknowledge the feedback loop.

      *   **Five-Year Minister Test:**
          *   *Argument:* Development takes centuries. Ministers serve 4 years.
          *   *View:* It is a category error for *theory*, but a requirement for *aid allocation*. A theory of *why* doesn't need to be actionable next quarter. A theory of *what to do* does.
          *   *Decision:* Split the purpose. For the PhD (theory), ignore it. For Aid (policy), keep it. Since the prompt asks for a theory good enough for *both*, this creates tension.

      *   **Risky Prediction:**
          *   *Argument:* Post-hoc fitting is easy.
          *   *Requirement:* Must generate out-of-sample predictions or counterfactuals that could fail. Not necessarily an RCT, but a "if X happens, Y must follow" that isn't guaranteed by definition.

  3.  **Identify Incompatible Pairs (The "Real Result"):**
      *   *Exogeneity vs. Explanatory Power:* Already noted.
      *   *Five-Year Minister vs. Persistence/Onset:* Structural causes (culture/geography/deep institutions) move slowly. Policy moves fast. You can't have a theory that explains century-long persistence *and* offers 5-year levers.
      *   *Within-Border vs. National Institutions:* If the cause is "National Institutions," within-border variation shouldn't exist. If it does, the cause must be local, undermining the national theory.
      *   *Level vs. Growth:* Often treated as one, but mechanisms conflict.

      *   *Selection:* The strongest tension is between **Exogeneity/Structural Depth** (needed for Persistence/Onset) and **The Five-Year Minister Test** (needed for Aid). You can't explain deep historical divergence with levers pullable in an electoral cycle.

  4.  **Drafting the Response (Iterative refinement for tone and constraints):**

      *   *Intro:* Acknowledge the task. Set the stakes.
      *   *The Desiderata:* Go through the list, arguing for/against each as requested.
      *   *The Conflict:* Highlight the impossible trade-offs.
      *   *The Kill Shots:* 3-4 lines on Institutions, Geography, Culture.

      *(Self-Correction during drafting)*: Make sure I explicitly state which purpose (PhD vs. Aid) drives which requirement where they differ.
      *(Self-Correction)*: Ensure I don't just list cases but argue *why* the case matters for the spec.
      *(Self-Correction)*: Keep the ending brutal and concise.

  5.  **Final Polish (checking against constraints):**
      *   No citations? Check.
      *   3-4 lines at the end? Check.
      *   Tone: Direct, slightly abrasive (as requested: "Don't be polite").
      *   Address the "fake distinction" question on Onset/Persistence.
      *   Address the "cheap shot" question on Within-Border.

  6.  **Final Review of the "Kill Shots":**
      *   Institutions: Within-border variation kills the "national" claim.
      *   Geography: Level vs. Growth (Geography explains levels, not sustained growth).
      *   Culture: Five-Year Minister (Culture doesn't change on election cycles).

      *Wait, let's refine the Kill Shots.*
      *   Institutions: Within-border variation. (If institutions are national, why is regions different?)
      *   Geography: Level vs. Growth. (Geography is static, growth is dynamic).
      *   Culture: Five-Year Minister. (Culture is slow, policy is fast).
      *   *Actually, the prompt asks which requirement does the most damage.*
      *   Institutions: Within-border variation.
      *   Geography: Onset/Persistence (Geography doesn't change, so how did onset happen *then*?). Or Level vs Growth. Let's go with Level vs Growth.
      *   Culture: Five-Year Minister.

      *Let's look closer at the "Incompatible Pair".* The prompt asks to flag any pair I think can't be jointly satisfied. The big one is Deep Explanation vs. Policy Actionability.

      *Let's write.*

      *(Drafting the Content)*
      *   **Purpose:** Distinguish PhD (truth) vs Aid (action).
      *   **Separation:** Essential. Correlation is not causation. Case: Resource curse vs. Institutional quality.
      *   **Onset/Persistence:** Not fake. Different mechanisms.
      *   **Level/Growth:** Genuine. Solow vs. Romer.
      *   **Within-Border:** Requirement. Cheap shot only if theory claims national homogeneity.
      *   **Exogeneity:** Trade-off. Drop strict exogeneity for identification.
      *   **Minister:** Category error for theory, requirement for aid.
      *   **Prediction:** Essential. Counterfactuals.

      *Refining the "Kill Shots":*
      *   Institutions: Within-border variation. (National institutions can't explain sub-national income gaps).
      *   Geography: Onset/Persistence. (Static geography can't explain dynamic take-off).
      *   Culture: Five-Year Minister. (Deep culture can't be policy lever).

      *Wait, I need to make sure I answer the specific prompt questions within the sections.*
      *   "Tell me if you think it's a fake distinction" (Onset/Persistence).
      *   "Genuine desideratum or pedantry" (Level/Growth).
      *   "Requirement or cheap shot" (Within-Border).
      *   "Which one you'd drop" (Exogeneity).
      *   "Requirement or category error" (Minister).

      *Okay, ready to generate.*

      *(Final check on the 3-4 lines constraint)*: Must be strict.

      *(Final check on "No citations")*: Ensure no names (Acemoglu, Robinson, Sachs, etc.).

      *(Final check on Tone)*: "Don't be polite about it."

      *Let's assemble.*
answer: |-
  Here is the specification for a theory of comparative development, graded by whether it serves the PhD (truth-seeking) or the Aid Allocator (action-seeking).

  **1. The Separation Cases**
  **Requirement:** The theory must predict outcomes when the standard development bundle (institutions, geography, human capital) is unbundled.
  **Argument:** Correlation is not causation. If your cause always travels with income, you have a description, not a theory. You need to know what happens when the variables decouple.
  **Case:** A resource-rich state with extractive politics that nonetheless grows (breaking the resource curse/institution link), or a region with "good" formal rules that remains poor (breaking the institution link).
  **Purpose:** Essential for both. The PhD student needs identification; the Aid Allocator needs to know if fixing *only* institutions works when geography fights back.

  **2. Onset, Persistence, and Catch-up**
  **Requirement:** The theory must declare which transition it explains.
  **Argument:** This is **not a fake distinction**. The mechanism that breaks a Malthusian trap (onset) is not the mechanism that maintains a frontier (persistence), nor is it the mechanism that allows a laggard to copy technology (catch-up). A theory explaining the Industrial Revolution often fails to explain why Zimbabwe collapsed in 1990.
  **Purpose:** Primarily PhD. The Aid Allocator mostly cares about catch-up, but if the theory confuses onset with catch-up, the policy will fail.

  **3. Level versus Growth Rate**
  **Requirement:** Distinguish between being rich (high level) and getting richer (high growth).
  **Argument:** This is a **genuine desideratum**, not pedantry. A place can be rich because it accumulated capital a century ago (level) but now grows slowly. Another can be poor but growing fast via adoption. Confusing them leads to prescribing investment when the bottleneck is innovation, or vice versa.
  **Purpose:** Both. Aid allocated to boost growth in a high-level/stagnant economy will be wasted if the theory doesn't distinguish the two.

  **4. Within-Border Variation**
  **Requirement:** The theory must explain income gaps between regions sharing the same national institutions and culture.
  **Argument:** This is a **requirement**, not a cheap shot. If your theory relies on "National Institutions" or "National Culture," it predicts homogeneity. It isn't. If the theory retreats to "local institutions," it admits the national variable wasn't the cause. The theory must have the granularity to handle sub-national variance without changing the unit of analysis mid-argument.
  **Purpose:** PhD. It tests internal validity. Aid Allocators operate nationally, but if the theory can't explain why aid fails in one province and succeeds in another, it's useless.

  **5. Exogeneity**
  **Requirement:** The cause cannot be endogenous to income, *unless* the feedback loop is explicitly modeled.
  **Argument:** There is a trade-off. Strictly exogenous causes (latitude, disease ecology) are clean but explain little variance. High-variance causes (institutions, policy) are endogenous (rich countries buy better courts).
  **Decision:** **Drop strict exogeneity.** Demand *identification* of the causal direction instead. A theory that insists on pure exogeneity explains nothing; a theory that ignores endogeneity is circular.
  **Purpose:** PhD. Aid Allocators don't care about exogeneity; they care about levers. But if the lever is an effect, not a cause, pulling it does nothing.

  **6. The 'Five-Year Minister' Test**
  **Requirement:** The theory must offer levers actionable within an electoral cycle.
  **Argument:** This is a **category error for theory**, but a requirement for Aid. Structural causes (culture, deep institutions, geography) move over generations. Policy moves over quarters. Demanding a structural theory yield 5-year results forces it to lie about the speed of change.
  **Purpose:** Aid only. If you impose this on the PhD student, they will produce short-termism masquerading as science. If you ignore it for the Aid Allocator, they will fund projects that pay off in 50 years, which is political suicide.

  **7. Risky Prediction**
  **Requirement:** The theory must state a counterfactual that could be observed to be false.
  **Argument:** Post-hoc fitting is trivial. The theory must say: "If we intervene on X, Y *must* happen, and if Y doesn't, the theory is dead." This does not require an RCT; it requires out-of-sample forecasting or a specific historical counterfactual.
  **Purpose:** PhD. Aid Allocators rarely demand falsifiability; they demand hope. But without this, you are funding religion, not development.

  ***

  **The Incompatible Pair**
  You cannot jointly satisfy **Onset/Persistence (Deep Structure)** and the **Five-Year Minister Test**.
  If the true causes of income differences are deep historical structures (as required to explain Persistence and Onset), they cannot be moved by a minister in a five-year term. If they *can* be moved in five years, they are not deep structures, and thus likely cannot explain century-long gaps. You must choose: a theory that explains the past (PhD) or a theory that guides the next budget cycle (Aid). Trying to do both produces models that are historically shallow and politically impossible.

  ***

  **Damage Assessment**
  **Institutions:** Destroyed by **Within-Border Variation**; national rules cannot explain sub-national income gaps without admitting institutions are local, not national.
  **Geography:** Destroyed by **Level versus Growth**; static geography can explain wealth levels, but it cannot explain sustained growth rates or dynamic take-offs.
  **Culture:** Destroyed by the **Five-Year Minister Test**; if culture is the cause, aid is useless because culture cannot be engineered within a political term.
