prompt: |-
  I write about science and ideas for a magazine, and I'm currently working on a piece about what happens to moral language once a great deal of it starts coming out of institutions and machines rather than people: crisis triage protocols drafted by rotating hospital committees and then applied by software, model-generated summaries of what a patient "ought" to be told, training datasets built from moral annotations whose authors are dead. At a workshop dinner I sat through recently, two philosophers had an argument I have not been able to stop turning over, and I would like it adjudicated rather than summarized. They began from common ground: expressivism holds that to call something wrong is not to state a belief but to voice a conative attitude, something closer to cheering or booing than to describing; the Frege–Geach problem is that moral sentences keep their full meaning in positions where nothing is being voiced, as when "stealing is wrong" sits in the antecedent of a conditional, and yet moral arguments containing such sentences look straightforwardly valid; and the best-known expressivist reply, the quasi-realist one associated with Simon Blackburn, relocates validity one level up, so that what makes the argument good is not shared representational content but the incoherence of simultaneously being for the antecedent, for the conditional, and against the consequent.

  From there it went like this. (1) The critic, Julian, introduced what he called "unowned" moral sentences: tokens that are produced, stored, and used without any agent ever having the relevant attitude and, in some cases, without any agent being in a position to have it — a protocol line saying that withholding life-sustaining treatment in a certain class of cases is permissible, or a verdict emitted by a model trained on annotators no one can now question. He said such tokens enter inferences that are plainly valid and plainly action-guiding, while the expressivist's surrogate for validity has nothing to bite on, since there is no one whose attitudes could be incoherent. (2) The expressivist, Nadia, answered that this is the original problem in a new costume: the Frege–Geach problem was always about unasserted occurrences, an unowned token is simply an unasserted one with nobody standing nearby, and meaning is fixed by the practices of a community of attitude-holders from which the token inherits its content; the protocol's inference is valid in that anyone who did take up those sentences — who applied them while rejecting their upshot — would be incoherent. (3) Julian replied that this makes validity hostage to agents who will never exist, since the protocol simply runs and no one takes it up in the relevant sense, and that in the meantime Nadia is quietly treating the sentences as correct or incorrect independently of anybody's attitudes, which is the very thing in dispute; he added that if content can be inherited from attitudes held by people long dead, then the attitudes are doing no semantic work and expressivism has become a causal story about how a practice got started. (4) Nadia's sharpest move was to say that Julian's pressure case is really a dispute about what counts as a bearer of commitment rather than about moral semantics: expressivism never required an occurrent feeling, the attitude in the embedded antecedent was never felt either, and if an institution or a system with a stable dispositional profile can count as a commitment-bearer, then its patterned dispositions can coherently or incoherently hang together and the view accommodates the case. (5) Julian answered that if commitments can float entirely free of affect, motivation, and any capacity to be moved by what one "accepts," the position survives only by ceasing to be a distinctive semantic thesis — it has become realism with a deflationary theory of truth bolted on, and the old motivation for expressivism, the tight link between moral judgment and motivation, has quietly evaporated. Neither would budge, and I genuinely could not tell who was winning.

  So please referee it. Go through the five moves and tell me who is right about what at each step — ideally rating each move from clearly mistaken to clearly right and justifying the rating briefly, since I suspect several of them are partly right in different respects — and then tell me what, if anything, both of them are missing. Specifically: are unowned sentences a genuinely new problem for expressivism or only the Frege–Geach problem re-described; does the disagreement in fact bottom out somewhere other than moral semantics, in a general theory of content or of what an agent is; does the case tell us anything about whether a practice needs live participants to confer meaning; and what, if anything, all of this settles about the question I actually have to answer in my piece — whether sentences issued by committees, protocols, and models can be said to mean what our moral sentences mean.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **User:** A science/ideas magazine writer working on a piece about moral language coming from institutions/machines (protocols, AI models, dead annotators) rather than people.
      *   **Context:** A workshop dinner argument between two philosophers (Julian, the critic; Nadia, the expressivist).
      *   **Core Philosophical Framework:** Expressivism (moral statements express attitudes, not beliefs), Frege-Geach Problem (how moral sentences work in logic/embedded contexts), Quasi-Realism (Blackburn's solution: validity is about attitudinal coherence).
      *   **The Argument (5 Moves):**
          1.  Julian: "Unowned" sentences (no agent has the attitude) break expressivist validity (no one to be incoherent).
          2.  Nadia: This is just Frege-Geach again; meaning comes from community practices; validity holds for *anyone* who takes them up.
          3.  Julian: Validity shouldn't depend on hypothetical agents; you're smuggling in realism (truth independent of attitudes); dead annotators make attitudes causally irrelevant.
          4.  Nadia: It's about commitment bearers, not semantics; institutions/systems can have dispositional profiles that are coherent/incoherent.
          5.  Julian: If commitments float free of affect/motivation, expressivism collapses into realism + deflationary truth; the motivation-judgment link is lost.
      *   **Task:** Adjudicate the argument (not just summarize). Rate each move (mistaken to right). Identify what they are missing. Answer specific questions (new problem vs. old? bottom out elsewhere? live participants needed? implications for the magazine piece).

  2.  **Deconstruct the Philosophical Positions:**
      *   **Expressivism/Quasi-Realism:** Moral language *functions* like truth-apt discourse but is grounded in conative attitudes (desires, plans, commitments). The challenge is always explaining logic without truth-conditions. Blackburn's solution involves higher-order attitudes (approving of the combination of attitudes).
      *   **The "Unowned" Problem:** If a sentence exists without *anyone* currently holding the attitude (e.g., code running, dead annotators), where does the "expression" come from?
      *   **Julian's Critique:** Essentially argues that without a *subject* to hold the attitude, the expressivist mechanism fails. If you fix it by appealing to abstract coherence, you've abandoned the core motivation (connection to human psychology/motivation).
      *   **Nadia's Defense:** Expressivism is about the *function* of language within a practice. The "attitude" can be dispositional or institutional. The logic holds because of the role the sentences play, regardless of current psychological states.

  3.  **Evaluate Each Move (Drafting the Adjudication):**

      *   **Move 1 (Julian - Unowned Sentences):**
          *   *Claim:* No agent = no attitude = no expressivist validity.
          *   *Analysis:* Strong point. Expressivism traditionally ties meaning to *human* psychology. If the token exists in a server with no human reading it, who is "booing"?
          *   *Rating:* Mostly Right. It identifies a genuine tension in applying psychological theories to non-psychological substrates.
      *   **Move 2 (Nadia - It's just Frege-Geach/Community Practice):**
          *   *Claim:* Meaning is inherited from the community. Validity is about hypothetical uptake.
          *   *Analysis:* Standard quasi-realist move. But does it work for *never*-asserted tokens? Frege-Geach is about *unasserted* tokens in arguments, usually by *speakers*. Julian's case is tokens with *no speaker*.
          *   *Rating:* Partly Right, Partly Evasive. It explains standard embedding, but glosses over the "no agent" aspect.
      *   **Move 3 (Julian - Hostage to Hypotheticals/Smuggling Realism):**
          *   *Claim:* Relying on hypothetical agents makes validity independent of actual attitudes (realism). Dead annotators make it causal history, not semantics.
          *   *Analysis:* Very sharp. If meaning depends on what a hypothetical agent *would* feel, isn't that a truth condition? If it depends on dead people, is it still "expression"?
          *   *Rating:* Clearly Right on the "smuggling" charge. This is the "Normativity Objection" to quasi-realism.
      *   **Move 4 (Nadia - Institutions as Commitment Bearers):**
          *   *Claim:* Systems can have dispositional profiles. Coherence applies to the system.
          *   *Analysis:* Innovative but risky. Can a server be "incoherent" in the *moral* sense, or just the logical sense? Expressivism needs *conative* incoherence (clashing plans), not just syntactic inconsistency.
          *   *Rating:* Bold but Weak. It stretches "attitude" too thin. A protocol doesn't "plan" or "desire."
      *   **Move 5 (Julian - Collapse into Realism):**
          *   *Claim:* No affect/motivation = not expressivism. Just realism with deflationary truth.
          *   *Analysis:* The knockout punch. Expressivism's selling point is explaining the *action-guiding* nature of morals. If the system isn't guided, the theory loses its purpose.
          *   *Rating:* Clearly Right. This identifies the cost of Nadia's defense.

  4.  **Synthesize the "Missing" Elements:**
      *   **Functionalism vs. Psychology:** They are arguing past each other. Julian thinks "attitude" = psychological state. Nadia thinks "attitude" = functional role.
      *   **The Nature of the "Agent":** Is an institution an agent? If yes, Nadia wins. If no, Julian wins.
      *   **Meaning without Use:** Wittgensteinian angle. Can a sentence have meaning if it's never used in a "form of life"?
      *   **The Magazine Question:** Do machine sentences *mean* the same thing? Probably not in the expressivist sense, but they *function* similarly.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, philosophical, decisive but nuanced (suitable for a magazine writer).
      *   *Structure:*
          1.  Intro (Setting the stage).
          2.  Move-by-Move Adjudication (Rating + Justification).
          3.  The Deep Disagreement (What they are missing).
          4.  Answers to Specific Questions (New problem? Bottom out? Live participants? Magazine piece).
      *   *Refining the Ratings:* Avoid binary "right/wrong." Use "Substantially Correct," "Partially Correct but Evasive," etc.
      *   *Key Insight:* The core issue is whether "expression" requires a *mind* or just a *pattern*. Julian says mind; Nadia says pattern. Expressivism historically requires mind. Therefore, Julian is technically more faithful to the tradition, but Nadia is trying to save it for the modern world.

  6.  **Final Review against Constraints:**
      *   Did I adjudicate? Yes.
      *   Did I rate the 5 moves? Yes.
      *   Did I address the specific questions (new problem, bottom out, live participants, magazine piece)? Yes.
      *   Is the tone appropriate? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to just say "Julian wins." Nadia's move about institutional commitment is a live area of research (collective intentionality). I should acknowledge that while Julian wins on *traditional* expressivism, Nadia points to where the theory *must* go to survive. The "missing" piece is likely a functionalist theory of content that neither fully articulates.

      *(Refining the "Magazine Piece" advice)*: The writer needs to know if machine morality is "real" morality. The philosophical verdict suggests it's *functionally* equivalent but *ontologically* distinct. That's a great hook for the article.

  7.  **Final Polish:** Check clarity, ensure the distinction between Frege-Geach (embedding) and Unowned (no agent) is clear. Ensure the "Realism collapse" charge is explained clearly. (Proceed to generate output).

      *Wait, one nuance on Move 2:* Nadia says meaning is fixed by community practices. This is a Wittgensteinian turn. Is that compatible with Expressivism? Yes, Blackburn incorporates this. But does it solve the "no one takes it up" issue? Julian says no. I need to reflect that tension.

      *Wait, one nuance on Move 4:* Nadia says institutions can be commitment bearers. This is "Collective Intentionality" (Searle, Tuomela). Does Expressivism allow this? Blackburn focuses on individual planning. This is where Nadia is stretching the theory. I should note this.

      *Okay, ready to write.*
answer: |-
  Here is an adjudication of the argument, broken down by move, followed by an analysis of the underlying philosophical stalemate and its implications for your article.

  ### The Adjudication: Move by Move

  **Move 1: Julian (The "Unowned" Token)**
  *   **Claim:** Tokens produced without an agent holding the relevant attitude break the expressivist account of validity, because there is no one to be incoherent.
  *   **Rating:** **Substantially Right.**
  *   **Justification:** Julian correctly identifies a gap in standard quasi-realism. Expressivism grounds meaning in psychological states (plans, desires, commitments). If a sentence exists in a database or is executed by code without a corresponding psychological state in any mind (living or reading), the "expression" is empty. The expressivist account of logic relies on the clash of *attitudes*; without a holder of attitudes, the mechanism has no purchase. This is not merely a technical glitch; it strikes at the ontological requirement of the theory.

  **Move 2: Nadia (The "Community Practice" Defense)**
  *   **Claim:** This is just the Frege–Geach problem; meaning is inherited from the community's practices; validity holds for anyone who *would* take up the sentences.
  *   **Rating:** **Partially Right, but Evasive.**
  *   **Justification:** Nadia is right that meaning is often parasitic on community practices (a Wittgensteinian point compatible with quasi-realism). However, she is evasive about the "unowned" nature of the token. The original Frege–Geach problem concerns sentences *uttered by speakers* in embedded contexts. Julian's case concerns sentences *never uttered by a believer*. Relying on hypothetical uptake ("anyone who *did* take up...") shifts the ground from actual psychology to counterfactual norms, which weakens the expressivist claim that morality is essentially about *actual* human motivation.

  **Move 3: Julian (The "Hostage to Hypotheticals" Charge)**
  *   **Claim:** Making validity depend on hypothetical agents smuggles in realism (truth independent of attitude) and reduces expressivism to a causal history lesson.
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This is the strongest philosophical move in the exchange. If the correctness of an inference depends on what a hypothetical agent *would* feel, rather than what actual agents *do* feel, you have posited a norm that exists independently of actual psychological states. That is a realist conception of truth conditions. Furthermore, if the meaning relies on dead annotators, the "expression" is historical causation, not current semantic content. Julian correctly diagnoses that Nadia is saving the theory by abandoning its core motivation (the link to live psychology).

  **Move 4: Nadia (The "Institutional Commitment" Move)**
  *   **Claim:** Institutions or systems with stable dispositional profiles can count as commitment-bearers; their patterns can be coherent or incoherent.
  *   **Rating:** **Bold but Conceptually Stretched.**
  *   **Justification:** Nadia attempts to expand the definition of "agent" to include functional systems. While philosophically interesting (aligning with theories of collective intentionality), this stretches "commitment" beyond recognition in an expressivist framework. Expressivism requires *conative* states (caring, planning, being moved). A server executing a protocol has a dispositional profile, but it does not "care" about the outcome. Calling this "commitment" risks becoming a metaphor. It saves the logic but loses the "moral" part of moral psychology.

  **Move 5: Julian (The "Collapse into Realism" Conclusion)**
  *   **Claim:** If commitments float free of affect and motivation, expressivism collapses into realism with deflationary truth; the motivation-judgment link evaporates.
  *   **Rating:** **Clearly Right.**
  *   **Justification:** Julian lands the decisive blow. The primary selling point of expressivism over realism is its ability to explain why moral judgments motivate action (internalism). If a "commitment" can exist without the capacity to be motivated (as in a machine or a dead protocol), the theory no longer explains the special force of moral language. It becomes a semantic shell game: calling it "expression" adds nothing over simply saying the sentences function *as if* they were true.

  ---

  ### What They Are Missing

  Both philosophers are trapped in a 20th-century framework that assumes meaning must be grounded either in **individual psychology** (Julian's requirement) or **abstract normative structures** (Nadia's requirement). They are missing a **functionalist account of content** that decouples meaning from the substrate.

  1.  **The Substrate Independence Blind Spot:** Neither fully explores whether moral *function* can be separated from moral *feeling*. Julian assumes that without the feeling, the function is fake. Nadia assumes that if the function works, the feeling is optional. They miss the possibility that "moral meaning" might be a property of the *social role* the sentence plays, regardless of who (or what) utters it.
  2.  **The Diachronic Dimension:** They treat the "dead annotators" problem as a semantic bug. They miss that this is a feature of all language. We use words defined by dead people constantly. The specific moral weight of those annotations is the variable, not the fact of their death.
  3.  **The "As-If" Reality:** Neither considers that the *phenomenology* of the recipient matters more than the *ontology* of the sender. If a patient hears a protocol's verdict as a moral command, the moral transaction occurs in the patient, not the machine. The "unowned" sentence becomes "owned" upon reception.

  ---

  ### Answers to Your Specific Questions

  **1. Are "unowned" sentences a genuinely new problem or just Frege–Geach re-described?**
  It is a **genuinely new problem**, though structurally similar. The Frege–Geach problem asks how moral sentences work in logic *given* that they express attitudes. The "Unowned" problem asks how they express attitudes *when there is no one to have them*. Frege–Geach assumes a speaker who is merely not asserting; the Unowned problem posits a token with no speaker at all. This breaks the expressivist chain of custody for meaning.

  **2. Does the disagreement bottom out somewhere other than moral semantics?**
  Yes. It bottoms out in **philosophy of mind and action**. The dispute is not about the word "wrong"; it is about what counts as an **agent**. Julian holds a biological/psychological view of agency (only minds have commitments). Nadia holds a functionalist view of agency (any system with stable input-output norms has commitments). You cannot resolve their semantic dispute without first deciding whether a hospital protocol can be a "moral agent."

  **3. Does the case tell us anything about whether a practice needs live participants to confer meaning?**
  It suggests that **meaning requires a live *context*, but not necessarily a live *author*.** Nadia is right that practices can sustain meaning through time (dead annotators). However, Julian is right that the practice must be *usable* by live participants to retain its normative force. A moral sentence in a drawer is a fossil; a moral sentence in a running algorithm is a tool. It gains meaning from its use, not its origin.

  **4. What does this settle for your magazine piece?**
  It settles that **sentences issued by committees and models do not mean what our moral sentences mean *in the same way*, but they may mean the same thing *in effect*.**

  *   **Ontologically:** Julian is right. The machine is not "expressing" an attitude. It is simulating the output of one. There is no moral "ghost in the machine."
  *   **Functionally:** Nadia is right. For the patient, the citizen, or the user, the sentence operates with the same logical force and action-guiding pressure as a human moral judgment.

  **The Verdict for Your Article:**
  You should write that we are entering an era of **"Zombie Expressivism."** The language retains the grammar, logic, and social force of moral expression, but the interior life—the attitude that expressivism says is the source of that meaning—has been outsourced to systems that cannot feel. The danger is not that the machines will become immoral, but that *we* will treat their outputs as moral judgments when they are merely moral mirrors, reflecting the attitudes of the dead or the abstract coherence of a system that cannot care. The "unowned" sentence forces us to realize that much of our own moral language was already running on protocols we inherited; the machines just make the lack of ownership visible.
