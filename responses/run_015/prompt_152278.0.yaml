      *   **The Founding (1850):** Address the ministers and merchants. They wanted teachers, not intellectuals. They wanted domestic stability. Acknowledge this honestly. Don't say they'd be proud. Say they built a vessel that outgrew its original cargo. The virtue was in the building, not just the blueprint.
      *   **The 1949 Shift:** Address the move to coeducation. It was about survival. Money, enrollment. Don't hide this. Argue that survival allows for future principles. The *result* is what we hold dear, even if the *motive* was pragmatism.
      *   **The "We" and Continuity:** Address the discontinuity. We are not the same people. But we are the caretakers of the same place. The connection is responsibility, not identical belief.
      *   **The "Right Side of History":** Avoid the phrase. Instead, talk about standing in a stream of time. We don't know where it goes. We just know what we must do now.
      *   **The Value of the Exhibition:** Why walk through it if it's imperfect? Because history is not a solved equation. It's a record of choices. Flaws included. The exhibition is a starting point for inquiry, not a monument to perfection.
