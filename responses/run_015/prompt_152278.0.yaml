answer: |-
  Friends, colleagues, students, and members of the Halloran community:

  Welcome to the ground floor of the library. Welcome to this new space, and to this moment of pause in the life of the college. We are gathered to open an exhibition titled *Becoming Ourselves*. It is a title that invites us to look backward in order to understand who we are standing here today. It suggests a journey, a process of arrival. But as a historian, and as someone who has walked these halls for twenty-two years, I find myself thinking about the weight of that word: "Ourselves."

  Who is the "we" that becomes? When we stand in a room like this, surrounded by the records of our past, it is tempting to imagine a single continuous life stretching from 1850 to the present. We want to believe that the people who founded this institution were aiming, however dimly, for the university we know today. We want to believe that every decision made along the way was a step toward a destination we now occupy. It is a comforting thought. It suggests that our presence here is the inevitable result of a noble plan.

  But history is rarely a straight line, and institutions are rarely single selves.

  When Halloran College was founded in 1850, it was by a coalition of ministers and merchants who had a specific problem to solve. They needed teachers for the growing schools of the Midwest. Their charter was explicit about who should be trained and why. They believed that advanced schooling could unsettle women from the domestic and religious duties to which Providence had called them. The college was designed as a safe compromise: a place to produce pious, marriageable teachers, not independent intellectuals. If we are honest, we must acknowledge that the Halloran of 1850 was not trying to become the Halloran of today. In many important respects, the college we love now exists because later generations chose to depart from the founders' specific aims, not because they fulfilled them.

  This might sound like a difficult truth to swallow at a celebration. It might sound like I am distancing us from our origins. But I propose that there is a different kind of honor in acknowledging the gap. The founders did not need to anticipate our values to give us something valuable. They built a vessel. They established a place of learning that proved sturdy enough to outlast the limitations of its original blueprint. The virtue lies not in their foresight, but in their act of building something that could survive them. They gave us a ground to stand on, even if they could not see the horizon we now look toward.

  We see this same complexity when we look at the change this exhibition highlights from 1949. That was the year the trustees voted to admit men. The wall text here speaks of opening doors and widening principles. It is true that the outcome was a widening of principle. But the decision itself was driven by the cold arithmetic of survival. An actuarial report showed the college could not continue as a women's college. The president who championed the change argued from enrollment projections, not moral philosophy. He worried privately that coeducation might lower academic standards. The alumnae of the time opposed it bitterly.

  It is tempting to rewrite this history to make the motives look as virtuous as the outcome. It is tempting to say they did it because they believed in equality. But they did it because they needed to keep the lights on. And yet, look at where we are. Because they chose survival, this community survived to become a place where equality is indeed a defended principle. We do not honor them by pretending they were prophets. We honor them by recognizing that sometimes, the preservation of an institution is the precondition for its moral growth. We inherit the result of their pragmatism and we have the privilege of infusing it with the purpose they could not yet see.

  This brings me to the question of why we are here, and why an exhibition like this is worth walking through. I know that some of you in this room worry about the language of institutional praise. You know that history is not a tribunal that vindicates the winners. You know that saying an institution stands on the "right side of history" is a way of ignoring the messy, contingent choices that actually brought us here. History does not have a direction that we can simply join. It has currents, yes, but it also has eddies, accidents, and dead ends.

  But there is another way to look at this room. We are not here to claim virtue based on ancestry. The fact that we are descended from the people who made these decisions does not justify our presence here. Our justification lies in what we do with the inheritance now. The donors in this room, many of whom have supported this college for decades, understand this better than anyone. You have not given because you believed the college was perfect. You have given because you believed it was worth sustaining. You understood that stewardship is not about preserving a museum piece; it is about keeping a living thing alive so it can change.

  To the students in the room: I know that institutional self-congratulation can feel hollow. You are right to be skeptical of stories that suggest everything happened for the best. But I ask you to look at this exhibition not as a final verdict, but as a record of choices. When you walk through these panels, look for the moments where things could have gone differently. Look for the arguments, the fears, the financial constraints. See the past not as a preparation for you, but as a conversation you are now joining. The screens at the end of the gallery show your faces. You are not the conclusion of this story. You are the next authors of it.

  And to my colleagues in history and public memory: I know the risks of this genre. I know the danger of smoothing over contradictions. But I would argue that a flawed commemoration is still worth having if it invites honest inquiry. If this exhibition prompts a visitor to ask, "Why did they do it that way?" or "Was there another path?", then it has succeeded. We do not need a perfect history to learn from the past. We need an available one. We need a place where the records are kept, where the questions can be asked, and where the community can gather to think about time.

  So, what is the value of *Becoming Ourselves*? It is not that it tells us who we are. It is that it shows us how we were made. It shows us that identity is not a fixed point, but a series of negotiations between what we are given and what we choose to become. The founders gave us a school. The trustees of 1949 gave us survival. The donors gave us stability. The faculty and students give us purpose. None of these groups are the same "we." But we are linked by the responsibility to carry the thing forward.

  We cannot know what the college will look like in another 175 years. We cannot know what values will seem limited to them, just as the founders' views seem limited to us. We cannot guarantee that we are standing on the right side of anything. We can only know that we are standing here, in this library, with these records, responsible for the next step.

  The exhibition behind me is not a monument to perfection. It is a map of a journey that is not finished. It contains the shadows as well as the light. It contains the actuarial reports as well as the mission statements. It is honest enough to show the constraints, and warm enough to show the care. That is a rare combination. It is worth walking through not because it solves the puzzle of our history, but because it lays the pieces out on the table.

  So I invite you to enter. Look at the texts from 1850. Read the minutes from 1949. Look at the faces on the screens. Do not just applaud what you see. Question it. Argue with it. Let the past be complex. Let the present be responsible. And when you walk out of this gallery, carry with you the understanding that "becoming" is a verb that requires your participation. The history of Halloran College is not something that happened to us. It is something we are doing.

  Thank you. Please, enjoy the exhibition.
