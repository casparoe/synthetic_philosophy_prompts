  - the cruxes — i think the two that matter are (1) whether autonomy requires real-time revocability, and (2) whether the 72-hour delay preserves the contract's protective function or just slows down normal mind-changing
  - for each crux, one concrete case or hypothetical both agree is relevant, plus each side's prediction about what that case shows

