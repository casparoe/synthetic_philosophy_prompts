  they've agreed to treat the "revocable lockbox" as their shared test case: you can break a self-binding contract, but only after a 72-hour cooling-off period and a notarized declaration that your values have genuinely shifted. they need to know if this saves the ulysses idea or collapses it into ordinary preference revision.

