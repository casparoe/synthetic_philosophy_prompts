answer: |-
  **Mark: 13/20**

  **Comments**

  **(a)** You have correctly identified the core distinction between the two complaints. The first is indeed normative, concerning the *right* to make a demand (unfairness), while the second is psychological or semantic, concerning the *accuracy* of the expression (insincerity). However, your phrasing that the hypocrite 'does not really believe' the norm is slightly imprecise; the defective expression complaint often targets the *implication* of superiority or the communicative condition of blame, rather than strictly the private belief state. Nevertheless, for the purposes of this seminar, your distinction is sufficiently clear to secure full marks for this section.

  **(b)** Your explanation here is sound. You correctly infer that standing is a second-order normative property regarding the blamer, distinct from the first-order wrongness of the act. The conclusion that B's objection 'shows nothing at all about whether his promise-breaking was wrong' follows validly from the premise that standing and wrongness are independent. A fully correct answer might have added that while the *wrongness* is unaffected, the *normative force* of the blame is neutralised, which is why the distinction matters practically.

  **(c)** This section contains significant theoretical slippage.
  *   **The Confessor's Standing:** You conclude the Confessor has standing because 'sincerity is what standing requires'. This inference does not follow cleanly from the definitions provided. The Fairness View defines standing in terms of *willingness to accept the application of the norm*, which is a normative commitment, not merely psychological sincerity. One can be sincere yet lack standing (e.g., if one has waived one's right), or willing yet insincere. You have run together the 'defective expression' complaint from (a) with the constitutive conditions of the Fairness View in (c).
  *   **The Relationship View:** You claim the Relationship View reaches the 'same verdict' as the Fairness View regarding the hypocrite, arguing that breaking a promise 'damaged that relationship'. This reasoning risks collapsing the distinction provided in the prompt. The prompt defines the Relationship View as depending on the relationship *rather than on the blamer's own record*. By arguing that the *record* (breaking a promise) determines the standing via relationship damage, you are effectively treating the record as the proxy for the relationship, which blurs the conceptual boundary between the two views. A fully correct answer would have distinguished whether the Confessor has standing on the Relationship View *independently* of her record (e.g., because the specific relational injury of hypocrisy is absent), rather than implying her record secures her standing.
  *   **Available Complaints:** You correctly identify that neither complaint from (a) is available to B against the Confessor, and that the *tu quoque* charge fails. However, you state B's objection 'fails entirely' without acknowledging that on some versions of the Relationship View, standing might still be absent for reasons unrelated to hypocrisy (e.g. if they are strangers). You have treated the Confessor's standing as absolute rather than view-relative in your opening sentence, before attempting to analyse the views separately later.

  **Summary**
  While you demonstrate a solid grasp of the independence of standing and wrongness, your analysis of the Confessor conflates psychological sincerity with normative authority and fails to apply the Relationship View to the Confessor with sufficient conceptual rigour.
