  JOINT STATEMENT ON HISTORICAL METHODOLOGY AND THE CONCEPT OF PROGRESS

  PREAMBLE

  This document outlines the terms of an adversarial collaboration between two groups of researchers investigating the role of progress narratives in historical inquiry. Camp A argues that viewing history as progress is unavoidable because we inevitably judge the past by present values. Camp B argues that this frame is a methodological trap that obscures how people in the past actually reasoned and should be dropped. The following sections detail our shared commitments, our precise disagreements, and the specific cruxes we intend to test through joint case studies.

  SECTION 1: SHARED COMMITMENTS

  Both camps agree to the following premises as a basis for collaboration:

  1. Historical claims must be grounded in empirical evidence and primary sources.
  2. Historians are situated in the present and cannot completely escape their contemporary context.
  3. Distorting evidence to fit a preferred narrative is methodologically unsound.
  4. Understanding the causality of past events is a primary goal of historical inquiry.
  5. Both explanatory power and ethical responsibility matter in how history is written.

  SECTION 2: STATEMENT OF DISAGREEMENT

  While we share the commitments above, we diverge on the utility and inevitability of progress narratives.

  Camp A Position:
  It is impossible and undesirable to eliminate present-day values from historical analysis. Because we are the beneficiaries of past changes, framing history as a trajectory toward the present is a valid heuristic. Judging past ideas as steps toward or away from current understanding is necessary to make history relevant and intelligible to modern audiences.

  Camp B Position:
  It is necessary to bracket present-day values to achieve accurate historical understanding. Framing history as a trajectory toward the present imposes a false coherence on disjointed events. This approach distorts the reasoning of past actors by treating their ideas as errors relative to our norms rather than valid responses to their own contexts.

  SECTION 3: CRUXES AND TEST CASES

  We have identified two fundamental questions where our positions yield different predictions. We will examine specific historical episodes to test these predictions.

  Crux 1: The Circularity of Progress
  Question: Is labeling an event as progress circular if progress is defined solely as movement toward current norms?

  Relevant Episode: The Shift from Geocentrism to Heliocentrism (16th and 17th Centuries)

  Camp A Prediction:
  Close study will show that later models objectively explained more phenomena than earlier models. We will find that describing this shift as progress is justified because it moved closer to objective truth, not just because it matches our current view. The accumulation of predictive power demonstrates non-circular progress.

  Camp B Prediction:
  Close study will show that earlier models were internally consistent and rational based on available data. We will find that calling this shift progress ignores the social and theological costs of the change. The narrative of progress only holds because we define truth by the winning model, making the claim circular.

  Crux 2: The Possibility of Bracketing Present Commitments
  Question: Can historians ever fully set aside their present commitments to understand past actors on their own terms?

  Relevant Episode: The Salem Witch Trials (1692)

  Camp A Prediction:
  Close study will reveal that modern historians inevitably describe the judges and accusers as mistaken or superstitious. We will find that it is impossible to discuss the events without implicitly contrasting their reasoning with modern legal and scientific standards. The judgment of error is unavoidable.

  Camp B Prediction:
  Close study will reveal that the judges followed valid legal procedures within their theological framework. We will find that historians can reconstruct this reasoning without labeling it superstition. It is possible to explain their actions as rational within their context without imposing modern secular standards.

  CONCLUSION

  Both camps agree to pursue these case studies using shared source materials. We commit to publishing our findings jointly, regardless of whether the evidence supports one position over the other. Our goal is to clarify whether the progress narrative is a necessary tool for historical understanding or a distortion that must be removed.
