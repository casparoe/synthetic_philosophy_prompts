  2.  **Deconstruct Kavka's Toxin Puzzle:**
      *   **Setup:** An eccentric billionaire offers $1 million if you *intend* at midnight tonight to drink a toxin tomorrow at midnight. The toxin makes you sick for an hour but no lasting harm.
