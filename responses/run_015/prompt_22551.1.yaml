      *   Word Count Check: Need to ensure I hit 1500-2000. I might need to expand on the internal monologue and the passage of time.

  7.  **Drafting - Step-by-Step:**
      *   *Scene 1:* The Contract. The machine scanned him. The money transferred. The vial remains.
