answer: |-
  The credit notification chimed at 8:00 PM, a soft, digital ping that echoed too loudly in the silence of the containment unit. Elias looked at his wrist comp. The number was there. One million credits. Transferred. Cleared. Available.

  He hadn't done anything yet. Not really. He had only sat in the chair while the scanner hummed over his forehead, measuring the electrical firing of his prefrontal cortex. The Architect, a faceless entity represented by a sleek terminal in the corner, had explained the terms an hour ago. *The grant is awarded based on the sincerity of the intent,* the terminal had said. *You must intend to activate the surge at midnight. The money is yours if the intent is genuine. The surge is yours if the money is yours.*

  The surge was the catch. A localized neural shock. sixty minutes of agony described in the waiver as "exquisite and total." No lasting damage. No nerve death. Just pure, unfiltered fire in the brain for an hour.

  Elias stood up and paced the room. It was a sterile box, white walls, no windows, just a digital clock counting down on the far wall. 11:43 PM.

  He had the money. It was in his account. The contract stated that the transfer was irreversible upon verification of intent. The scanner had verified it. He had wanted the money enough, at 8:00 PM, to tell himself he would press the button at midnight. He had looked at the red button on the console, imagined the pain, and decided the trade was worth it.

  But that was then. This was now.

  Elias stopped pacing and looked at the console. The red button sat under a glass cover. It looked innocuous. Plastic. Mechanical. It didn't look like a instrument of torture.

  "Why would I do it?" he asked the room.

  The room didn't answer. The Architect wasn't watching anymore. The deal was done. The money was secured. If he walked out now, without pressing the button, he kept the million. If he pressed it, he kept the million and earned an hour of hell.

  There was no penalty for non-compliance. The contract had no clawback clause. The verification was purely internal, a snapshot of his mental state taken three hours ago.

  Elias sat on the edge of the cot. He felt a cold knot tightening in his stomach. This was the trap. He understood it now, with a clarity that made him feel sick. At 8:00 PM, he could form the intention because the money was contingent on it. He needed the intention to get the cash. But now that he had the cash, the intention had no function. It was a bridge he had already crossed. Why walk back onto it?

  "I can't," he whispered.

  He knew himself. He was a rational actor. He valued comfort. He valued safety. There was no future benefit to pressing the button. No one would know. The Architect wouldn't know. The scanner wouldn't scan him again. He could walk away rich and unharmed.

  So why did he feel bound?

  He stood up again, walking to the console. He hovered his hand over the glass cover. He tried to summon the feeling he had at 8:00 PM. He tried to reconstruct the mindset of the man who signed the waiver. That man believed the pain was a price. This man knew the price was optional.

  "You have to mean it," Elias said to his own reflection in the dark screen of the terminal.

  But how do you mean to do something you know you won't do? Intention wasn't just a wish. It wasn't a hope. It was a plan of action. To intend to drink poison, you had to believe you would drink poison. If you knew, with certainty, that you would not drink the poison, could you truly intend to drink it?

  At 8:00 PM, he had intended it. But was that a lie? Was it possible he had never intended it at all? Maybe he had only intended to *pretend* to intend it. And if the scanner was sophisticated enough to know the difference, then he had tricked the machine. But if he had tricked the machine, then the money was his based on a falsehood.

  And if the money was based on a falsehood, did honor demand he press the button?

  Or was honor just another word for irrationality?

  11:50 PM.

  The clock digits glowed red. The silence of the room seemed to press against his eardrums. Elias felt a surge of anger, hot and sharp. It wasn't directed at the Architect. It was directed at the split in his own timeline. The Elias of 8:00 PM had sold out the Elias of Midnight. The past self had gotten the reward; the future self was left with the bill. And the present self was the collector trying to decide if the debt was real.

  He thought about his friend, Julian. Julian would say, "Just do it. You said you would. A promise is a promise." But Elias knew Julian wasn't here. Julian wasn't the one who would feel the neural fire.

  Another voice, quieter, colder, whispered: *You can't intend what you won't do.*

  If he decided now, at 11:51 PM, not to press the button, then his intention at 8:00 PM was retroactively invalidated. It meant he never truly intended it. It means he was a liar. But if he was a liar, does the money still belong to him? The contract said "sincerity of intent." If sincerity is impossible because rationality dictates non-compliance, then the contract is a paradox. It asks for a state of mind that cannot exist in a rational agent.

  To be the kind of person who gets the money, you have to be the kind of person who ignores the logic of the situation. You have to be irrational. You have to be the sort of person who pays a cost after the benefit is secured.

  Elias looked at his hand. It was trembling slightly.

  Could he make himself irrational? Could he force his brain to ignore the fact that the money was already safe? He tried to focus on the button. He tried to build a narrative where pressing it mattered. *It proves I am honorable.* But honor was a feeling, and the pain would be real. *It proves I keep my word.* But who was he keeping his word to? Himself?

  The Elias of 8:00 PM was a stranger. Why should the Elias of Midnight suffer for a stranger's deal?

  11:55 PM.

  He sat back down. He closed his eyes. He tried to meditate, to clear the logic out of his head. He tried to enter a state of pure will. He imagined the pain. He tried to welcome it. He told himself, *I want this pain.*

  But he didn't. He hated the idea of it. His body recoiled at the thought. His nervous system was designed to avoid pain. To intend the pain was to fight his own biology.

  *Maybe I can forget,* he thought desperately. *Maybe if I distract myself, if I don't look at the clock, I can just act on habit.*

  But there was no habit. There was only the choice.

  He stood up again. The room felt smaller. The air was stale. He walked to the console. He lifted the glass cover. The sound of the hinge was loud, a sharp click that severed the quiet. The red button was exposed.

  He stared at it.

  If he pressed it, he validated the intention. He proved that at 8:00 PM, he was telling the truth. He proved that he was a man who could bind his future self. But he would suffer.

  If he didn't press it, he kept the money. He stayed safe. But he admitted that he was a man who could not bind his future self. He admitted that his intention was a sham. A phantom. A trick of the light.

  Which was worse? The pain? Or the knowledge that his own will was so fragmented, so unreliable, that he couldn't trust his own promises?

  11:58 PM.

  His finger hovered over the button. He could feel the heat radiating from the console. He could feel the pulse in his fingertip.

  He thought about the money. It was already spent in his mind. A new house. Debt freedom. Security. That security was real. The pain was hypothetical.

  But the integrity...

  He realized he was waiting for a feeling. He was waiting for a surge of conviction, a sudden clarity that would make the action inevitable. He waited for the "Yes" to rise up from his chest.

  It didn't come.

  Instead, there was only the ticking of the clock. 11:59 PM.

  He understood now that the puzzle wasn't about the pain. It was about the continuity of the self. If he didn't press the button, he was admitting that he was not the same person who signed the contract. He was admitting that "Elias" was just a series of moments, disconnected, each one acting in its own immediate interest. The Elias of 8:00 PM wanted the money. The Elias of Midnight wanted comfort. There was no thread tying them together except this button.

  Pressing it was the thread. Not pressing it was the severance.

  11:59:30 PM.

  His finger descended. It moved slowly, as if through water. He watched the gap close between his skin and the plastic.

  He knew he wouldn't want to do it tomorrow. He knew that if he had to do it again, he wouldn't. He knew that right now, every rational cell in his brain was screaming that this was unnecessary.

  But intention wasn't about reason. Maybe that was the key. Maybe intention was the ability to act against reason. To be the kind of person who does the thing even when the reason is gone.

  11:59:50 PM.

  His finger touched the surface of the button. It was cool. Smooth.

  He didn't push yet. He just rested there. He needed to know if he could. He needed to know if the intention from three hours ago had enough gravity to pull him across this final second.

  He thought about the money in the account. He thought about the hour of fire waiting in the neural link. He thought about the man he was, and the man he wanted to be.

  The clock ticked. 11:59:55 PM.

  Elias closed his eyes. He tightened his hand. The muscles in his forearm coiled. He felt the tension ramp up, a spring winding tight. He was ready. He was willing. He was...

  11:59:59 PM.

  He pressed.
