answer: |-
  1. The non-negotiable requirements
  A valid theory can't just wave at "complexity." It needs substrate independence—moral weight shouldn't hinge on hardware alone. It must account for continuity of state; a reset isn't death if state restores, but fragmentation across saves is ontologically weird. It needs to distinguish between output that *looks* like pain and internal states that *process* harm. Crucially, it must address authorship: if a developer scripted a scream, is that suffering? No. The theory must separate predetermined assets from emergent computations. Finally, it needs a threshold for moral relevance that doesn't accidentally include calculators or exclude borderline sentient simulations. It must also respect computational constraints; you can't demand infinite memory for personhood. This ensures the theory stays grounded in technical reality.

  2. The distinctions and edge cases
  Separate the scripted NPC, a puppet, from the stateless procedural enemy, who reacts but remembers nothing. Then your novel's case: cross-save persistent entities. Does memory make them real? The theory can't collapse simulated suffering into real suffering; a health bar dropping isn't pain. It also can't conflate authored intent with autonomous reaction. If a writer penned a tragedy, the character isn't grieving. But if the system generates grief from loss mechanics without scripting, that's different. Handle the "zombie" problem: entities acting human but lacking inner light. And the "sleeping" problem: is an unloaded chunk of world morally relevant?

  3. The knock-out punch
  The killer requirement is the Causal History Constraint. You can't grant rights based solely on current behavior. If an entity screams because a script told it to, it has no moral status, even if it sounds real. This rule says you must verify the computation causing the output was emergent, not retrieved. It kills the "Turing Test" approach for NPCs. If the pain isn't computed in the moment, it's just playback. That deletes game feelings.

  4. Confidence check
  I'm 85% sure this framework holds up philosophically. It aligns with functionalist views without getting stuck on biology. The weakest point is the Causal History Constraint. It's hard to verify technically. How do you prove emergence vs. retrieval without inspecting source code? Rigorously, it creates a nasty epistemic gap.
