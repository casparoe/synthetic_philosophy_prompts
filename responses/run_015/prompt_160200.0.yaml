answer: |-
  This scenario is the famous "Grudge Informer" problem, debated extensively in legal philosophy after World War II. You have identified the exact tension that makes it a philosophical puzzle: the courts seem to be saying "It was law" and "It was not law" about the same regime, depending on the outcome they want.

  Here is the conceptual breakdown of what theory this practice presupposes, where it is underdetermined, and how the rival theories would handle it differently.

  ### 1. Does the practice presuppose Natural Law?

  On the surface, the criminal trial looks like **Natural Law** (specifically the "Radbruch Formula," named after a German legal philosopher). This view holds that there is a moral threshold for validity: if a rule is extremely unjust, it lacks the character of law (*lex iniusta non est lex*).

  *   **How it fits:** In the criminal case, the court says the old statute was so unjust it wasn't "law." Therefore, the woman had no legal duty to inform, and no legal defense. Punishing her isn't retroactive because there was no valid law to begin with.
  *   **Where it struggles:** This theory struggles to explain the civil track. If the old regime's rules were so unjust they weren't law, why are the marriages and contracts valid? A strict Natural Law theorist would have to argue that the injustice in the criminal statute was "extreme," while the injustice in contract law was "tolerable." This requires a graded theory of validity (some laws are "more law" than others), which is conceptually messy. Validity is usually binary: something is either law or it isn't.

  So, the practice *fits* Natural Law well in the criminal case, but creates tension in the civil case. It does not *strictly presuppose* Natural Law, because a positivist can explain the outcome differently (see below).

  ### 2. Does the practice presuppose Positivism?

  **Legal Positivism** (associated with H.L.A. Hart) holds that the existence of law is a matter of social fact (e.g., did the sovereign issue it? was it enforced?), not moral merit. Under a strict positivist view, the old statute *was* law at the time, because it was issued by the effective sovereign and enforced by courts.

  *   **The Problem:** If the old statute was valid law, the woman did nothing illegal. Punishing her now is retroactive punishment. This violates the principle of *nullum crimen sine lege* (no crime without law). Hart argued that if a society wants to punish her, it should pass a new law explicitly stating that informing under the old regime is now punishable, even if it was legal then. He preferred "honest retroactivity" over "dishonest validity."
  *   **The Positivist Defense of the Two-Track Practice:** However, a sophisticated positivist *can* endorse the two-track practice without lying. They would argue that legal validity is determined by the **current** Rule of Recognition (the master rule the new courts use to identify law).
      *   The *new* democratic legal system can decide to incorporate old laws selectively.
      *   It can say: "We recognize old property and marriage laws as valid *for our current purposes* to ensure stability."
      *   It can simultaneously say: "We do *not* recognize the old informer statute as a valid defense *for our current purposes*."
      *   On this view, the court isn't making a metaphysical claim about the past ("It wasn't law *then*"). It is making a present claim about authority ("We do not accept that rule *now*").

  So, the practice is **theoretically underdetermined**. Both Natural Law and Positivism can explain it, but they tell different stories about *why*.
  *   **Natural Law story:** The old rule lacked validity because it was immoral.
  *   **Positivist story:** The old rule had validity then, but the new sovereign refuses to recognize it now.

  ### 3. Is the practice consistent with "No Punishment Without Law"?

  This is the weakest point of the practice.

  If the court says, "The old rule was not law," they claim to be upholding the principle. But if they simultaneously treat other old rules as "law" to validate marriages, they are admitting the old system *did* generate law. This looks like a contradiction.

  To be consistent, the courts are effectively engaging in a **legal fiction**. They are pretending the old rule never existed to avoid the label of "retroactivity." Philosophically, this is shaky. It sacrifices theoretical clarity for political convenience. They want the moral satisfaction of punishment without the political cost of admitting they are breaking the rule against retroactive laws.

  ### 4. What if we took the "Hard Hart" (Positivist) Route?

  If the courts followed Hart's advice strictly, the practice would change in the following ways:

  1.  **Admission:** The court would admit that under the old system, the woman broke no law. The statute was valid law *at that time*.
  2.  **Retroactivity:** The court would admit that punishing her is therefore retroactive.
  3.  **Legislative Action:** To do this honestly, the new democratic legislature would pass a specific statute: "Notwithstanding that informing was legal under the prior regime, it is now declared a crime, and perpetrators shall be punished."
  4.  **Consequence:** This preserves the integrity of the concept of law (law is what is posited, not what is moral) but stains the new regime with the blemish of retroactive punishment. Hart argued this is the lesser evil: it is better to admit you are doing a bad thing (retroactivity) to achieve a good end (justice) than to lie about what law is.

  **Impact on Civil Cases:** A Hard Positivist would likely uphold the civil cases (marriages, contracts) based on the principle of **legal continuity**. The new sovereign succeeds the old one and chooses to ratify past administrative acts for pragmatic reasons. This is consistent: "It was law then, and we choose to recognize those effects now." The informer case is the outlier that requires specific retroactive legislation.

  ### 5. What if we took the "Hard Fuller" (Natural Law) Route?

  If the courts followed a strict Natural Law theory (like Lon Fuller's argument that law has an "internal morality" which the dictatorship violated), the practice would change drastically:

  1.  **Nullity:** The court would declare that the dictatorship's rules were not law *at all* because they failed basic procedural morality (they were secret, retroactive, or fundamentally unjust).
  2.  **Criminal Case:** The woman is punished easily. She violated moral duty, and there was no legal shield.
  3.  **Civil Case (The Chaos Problem):** This is where the Hard Fuller route breaks down. If the old rules were never law, then the marriages, property transfers, and contracts signed under that regime are legally void.
      *   **Consequence:** Every marriage certificate is worthless. Every property deed is invalid. The entire economic and social structure collapses.
      *   **The Fix:** To avoid this, the Hard Fuller court would have to engage in a massive **re-validation**. They would have to pass new laws saying, "Even though the old regime was lawless, we hereby validate all private transactions entered into in good faith."
      *   **Difference:** In the Two-Track practice, the validation is implicit ("It was law"). In the Hard Fuller practice, the validation is explicit ("It wasn't law, but we are making it valid now").

  ### 6. Summary: What is actually going on?

  The practice you described does not strictly presuppose *either* theory. It is a **pragmatic hybrid** designed for transitional justice.

  *   **What it needs:** It needs a theory of **sovereign succession**. It presupposes that the new democratic courts have the authority to decide which parts of the past legal order to inherit and which to reject.
  *   **What is confused:** The confusion lies in the *justification*.
      *   If they say "It wasn't law," they owe an explanation for why marriages *were* law.
      *   If they say "We choose not to recognize it," they admit the punishment is effectively retroactive (since the act wasn't a crime under the recognized rules of the time).
  *   **The Philosophical Gap:** The practice tries to hide the political choice behind a metaphysical claim. Instead of saying "We are choosing to punish you for the greater good," they say "We are punishing you because no law existed." This shields them from criticism about retroactivity, but it makes their legal theory incoherent.

  **To answer your specific question on what would change:**

  *   **Under Hard Hart:** The courts stop claiming the old statute "wasn't law." They admit it was law, admit the punishment is retroactive, and rely on a new statute to authorize the punishment. The civil cases remain valid based on continuity. The theory is consistent, but the regime admits to violating the ban on retroactivity.
  *   **Under Hard Fuller:** The courts declare the old regime legally void across the board. They punish the woman easily. But they must then actively re-legislate all civil marriages and contracts to restore order, acknowledging that these were not legally valid before this moment. The theory is consistent, but the administrative burden is massive.

  **Conclusion:** The Two-Track practice is theoretically unstable. It borrows the moral force of Natural Law for the criminal case ("Evil isn't law") and the stability of Positivism for the civil case ("Law is social fact"). It works politically, but it requires the courts to be vague about *why* something counts as law, shifting the definition of validity depending on the desired outcome. It is not a coherent theory of law; it is a coherent strategy of transition.
