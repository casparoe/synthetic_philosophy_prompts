      *   *Is it consistent?* It risks inconsistency if the *reason* for validity changes mid-stream without explanation. If the justification is "It wasn't law" in case A, and "It was law" in case B, that's contradictory *unless* the criterion for validity is context-dependent (which is weird for a general theory of law).
