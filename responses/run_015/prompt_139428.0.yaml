answer: |-
  **The Short Answer**

  If you want to be consistent with your own jurisprudence, you must rule that **Proposal 61 is invalid**, and consequently, the bonus-points rule and the deletion of the 24-hour rule are void. The win must be recomputed under the old rules.

  Your precedents establish a system of **Formal Positivism** tempered by **Desuetude**. Proposal 61 fails the Formal Positivism test, and the timeframe is too short for Desuetude to apply. The fact that the challenger benefited from the bonus rule is irrelevant to the *validity* of the enactment, though it might bar her from *complaining* about the bonus rule specifically (estoppel). It does not bar her from challenging the threshold change.

  **The Analysis of Your Precedents**

  You asked what rules your five verdicts are jointly compatible with. They are not perfectly compatible; you have a tension between **Procedural Integrity** and **Social Fact**. Here is the breakdown:

  1.  **The Principle of Non-Bootstrapping (Rulings 3 & 5):** A proposal cannot use the authority it seeks to create in order to create itself. In Ruling 3, the old quorum definition governed the vote that changed it. In Ruling 5, you sidestepped the issue only because the proposal *also* satisfied the old rule. Proposal 61 fails this test. It did not satisfy the old rule (2/3 threshold). It tried to pull itself up by its own bootstraps.
  2.  **The Principle of Strict Compliance (Ruling 2):** Substantial compliance is insufficient. Twenty hours' notice was not forty-eight. Similarly, seven votes is not two-thirds. If you struck down a proposal for 20 hours' notice when 48 were required, you cannot uphold a proposal for 7 votes when 8 were required.
  3.  **The Principle of Desuetude (Ruling 4):** A rule dies if ignored by *everybody* for a *year*. Three rounds of play over a few weeks does not meet this bar. Furthermore, one player *did* object at the time. Universal acquiescence is missing.
  4.  **The Principle of Sovereignty (Ruling 1):** You cannot entrench rules. This supports the idea that the current majority (if it reaches 2/3) can do anything. But 7/12 is not the current sovereign majority under the old rules.

  **The Verdict on Proposal 61**

  *   **Consistency:** Rulings 2 and 3 are the closest analogues. They dictate that validity is fixed by the procedure in force at the moment of the vote. Since 7/12 is less than 2/3, 61 failed.
  *   **The Conflict Rule:** The swap from "lower number wins" to "later passed wins" is irrelevant. If 61 was never validly adopted, Rule C (lower number wins) never ceased to be in force. You do not use the new conflict rule to judge the validity of the new conflict rule.
  *   **The Subsequent Proposals:** Since 61 was void, the simple-majority threshold never came into force. The bonus-points rule and the 24-hour deletion were passed by simple majority, not 2/3. They are therefore also void.
  *   **The Challenger's Conduct:** The fact that the challenger used the bonus rule is a matter of *estoppel*, not validity. She is estopped from claiming the bonus points were invalid *for her*, but she is not estopped from claiming the *threshold change* was invalid. You can rule that she keeps the points she claimed (to prevent unfairness) but that the overall win must be recomputed because the threshold change was void. Or, more cleanly, void the lot and let the group ratify them now.

  **The Circularity**

  You asked if the reversal threshold (simple majority vs. two-thirds) depending on your ruling is a genuine circularity.

  **It is genuine.**

  This is a performative contradiction. To rule on the validity of Rule 61, you must exercise authority. The limits of that authority are defined by Rule 61.
  *   If you rule 61 is **valid**, you are a creature of 61, and your ruling can be reversed by a simple majority.
  *   If you rule 61 is **invalid**, you are a creature of the old regime, and your ruling requires 2/3 to reverse.

  The players cannot know how many votes they need to overturn you until you have ruled, but your ruling determines the number. This is not merely verbal; it is structural. In legal theory, this is the **Kelsenian Grundnorm** problem: every legal system rests on a presupposed basic norm that cannot itself be legally validated. In Nomic, the Arbiter *is* the Grundnorm until the players vote otherwise.

  **Philosophical Names**

  You asked for the name of this family of problems.
  1.  **The Paradox of Self-Amendment:** (Specifically discussed by Peter Suber, who wrote the book on Nomic). Can a rule change the conditions for its own change?
  2.  **The Rule of Recognition:** (H.L.A. Hart). The ultimate rule by which a society identifies valid laws. Your Ruling 4 suggests the Rule of Recognition is social practice; Ruling 2 suggests it is written text.
  3.  **Constitutive vs. Regulative Rules:** (John Searle). Proposal 61 is trying to be constitutive (creating the possibility of new rules) while being treated as regulative (subject to old rules).

  **Confidence Levels**

  *   **That 61 is invalid under your precedents (Rulings 2 & 3):** 90% confidence. The distinction between Ruling 5 (passed old threshold) and 61 (failed old threshold) is decisive.
  *   **That Desuetude (Ruling 4) saves it:** 10% confidence. Three rounds is not a year; one objection prevents "universal" neglect.
  *   **That the circularity is genuine:** 100% confidence. It is a logical feature of self-referential systems.
  *   **That there is a "fact of the matter":** 0% confidence. As you suspected, this is ultimately a question of what the group is prepared to treat as binding. Nomic is designed to expose that there is no metaphysical truth in rules, only consensus.

  **Recommendation**

  Rule 61 invalid. Cite Rulings 2 and 3. Void the subsequent proposals.
  *However*, invoke Ruling 1. Tell the players they are now free to re-pass Proposal 61 and the subsequent changes immediately, provided they secure the proper 2/3 majority *now*. This restores order, respects your precedents, and acknowledges the group's sovereignty.

  If you rule 61 valid to "keep the peace", you admit that your previous rulings (2 and 3) were merely discretionary and not matters of principle. That undermines your authority as Arbiter more than a voided game does.

  **One Further Fact to Test the Principles**

  If you want to distinguish between "Validity is Formal" and "Validity is Social", ask the players this hypothetical:

  *If Proposal 61 had received 1 vote out of 12, but everyone had played under it for a year, would it be valid?*

  *   If they say **Yes**, they accept Ruling 4 (Desuetude/Practice) as supreme over Ruling 2 (Procedure). You should then rule 61 valid now.
  *   If they say **No**, they accept Ruling 2 (Procedure) as supreme. You must rule 61 invalid.

  Given your Ruling 2 (striking down a 10–2 vote for lack of notice), you have already committed to Procedure over Practice in the short term. Stick to it.
