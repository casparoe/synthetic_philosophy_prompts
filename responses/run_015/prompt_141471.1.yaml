      *   *User's Claim:* Absurdity comes from imagining B (ornithologist) while formal argument assumes A.
      *   *Assessment:* Correct. This is the "sampling assumption" critique. It explains the *pragmatic* weirdness but doesn't fully kill the *logical* paradox (Hempel's concern).

