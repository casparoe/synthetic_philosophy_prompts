answer: |-
  The anti-speciesist cannot resolve this tension by adjusting the account of death's harm, but must instead reject the aggregative logic of replaceability by grounding the wrongness of killing in inviolable status rather than comparable loss. The instability you identify arises because both the desire-based and experiential accounts accept the premise that the wrongness of killing is solely a function of the harm suffered by the victim, measured by the metric of lost future goods. If you decouple wrongness from harm—arguing that killing is a violation of a being's integrity or status regardless of the quantum of lost experience—you block replaceability without denying psychological differences. This allows you to maintain that while a human may lose more *goods* than a pig upon death (satisfying the psychological account of harm), the *wrong* done to both is identical because both are subjects of a life who cannot be treated as renewable resources (satisfying anti-speciesism). Replaceability fails on this view not because the math of utility doesn't work, but because individuals are not interchangeable vessels of value; creating a new being does not compensate for the violation of the existing one, even if the new being has an equally good life.

  This decoupling is necessary because the "camouflaged asymmetry" is not reassuring; a hierarchy of killing wrongness based on psychological unity is functionally equivalent to speciesism because it renders the right to life contingent on cognitive capacities that correlate perfectly with species boundaries in the real world. The theoretical possibility of a psychologically complex pig does not mitigate the structural exclusion of actual pigs, just as the theoretical possibility of a non-person human does not mitigate the danger to marginally capable humans. If moral protection scales with psychological unity, then beings with thinner unity are inherently less protected, which violates the spirit of equal consideration even if it avoids the letter of species-based discrimination. The reassurance fails because it ignores that a criterion which is theoretically open but practically exclusive functions as a status hierarchy, effectively licensing the sacrifice of the psychologically simple for the benefit of the complex, which is precisely the structure speciesism was meant to dismantle.

  Consequently, this is not a problem specific to animals but a structural flaw in person-affecting consequentialism that implicates human infants and the cognitively impaired equally. If the replaceability argument holds for chickens based on their temporal psychology, it must hold for newborn humans who share that same lack of future-directed desires and projects. The animal case is merely the stress test that reveals the instability; if your seminar treats it as isolated to non-humans, it will fail to expose the radical implications for human bioethics that make the tension philosophically urgent. The correct reading is that the animal case is a symptom, not the site, and the seminar should conclude that stabilizing these commitments requires a theory of rights that protects the vulnerable irrespective of their psychological elaboration, rather than a theory of harm that grades their protectability based on it.
