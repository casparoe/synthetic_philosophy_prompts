answer: |-
  Subject: Condorcet Seminar Activity Design

  Dear Colleague,

  This is a ambitious design for a ninety-minute slot, and because you want the students to derive the theorem from the mechanics rather than hearing it as doctrine, the pacing will be your greatest enemy. You have eighteen students and roughly six distinct experimental conditions you want to model, which means you have about twelve minutes per round including setup, voting, tallying, and the immediate reaction. To make this work without rushing the debrief, you need to treat the randomization not as a performance you execute live every time but as a mechanism you prepare invisibly. You mentioned wanting to randomize on the fly, and while you can certainly shuffle decks in front of them to prove no trickery, I strongly advise you to pre-sort your signal envelopes into batches before class begins. You can shuffle the batches in front of the students to satisfy the fairness constraint, but if you try to construct probability distributions live using a coin and a deck for eighteen people six times, you will lose twenty minutes to arithmetic and housekeeping. Use the two colors of dot stickers to mark the envelopes secretly before class. For example, a red dot on the inside flap means the signal inside matches the truth, and a blue dot means it contradicts the truth. You control the reliability by changing the ratio of red to blue dots in the batch you distribute for that round. This allows you to switch from sixty percent reliability to forty percent reliability instantly without fumbling with card counts while eighteen students watch the clock.

  For the payoff scheme, since you have no budget, you should gamify the collective outcome rather than individual performance to align with the epistemic goal of the theorem. Tell the class that their goal is to maximize the number of rounds where the majority vote matches the true state of the world. Keep a running tally on the board labeled Collective Accuracy. If the majority is right, the class gets a point. If the majority is wrong, they get zero. At the end of the seminar, if the class average exceeds a certain threshold, say seventy percent, everyone gets a small privilege, such as choosing the topic for the final week or exemption from one response paper. This avoids the problem of students competing against each other, which might encourage strategic voting rather than honest signaling, and it reinforces the idea that the theorem is about collective competence. For the asymmetric cost round, you simply change the victory condition. Announce that for this round only, a False Positive is twice as costly as a False Negative. Therefore, the class only wins the point if the majority votes True and the state is True, or if the majority votes False regardless of the state. This forces them to intuitively grasp that the aggregation rule might need to shift when the cost of error shifts, without you needing to explain utility functions yet.

  The sequence of rounds should follow the logic of assumption-violation. Start with the standard case where reliability is just above chance, say fifty-five percent. Use the deck to determine the true state, perhaps Red is True and Black is False, and distribute the envelopes from your pre-prepared batch where fifty-five percent contain the matching signal. Have them vote simultaneously on index cards. Tally it. You will likely find the majority is correct, but not overwhelmingly so. This sets the baseline. For the second round, switch the batch so reliability is forty-five percent. The students will feel confident in their signals, but the majority will likely be wrong. This is the first shock. For the third round, introduce the common signal. Project a blurry image on the screen that suggests a state, say True, but tell them it is only sixty percent reliable. Give everyone this same public signal, but keep their private signals independent. You will see the majority vote lock onto the public signal, and the error rate will plateau regardless of how many voters you have, because the independence assumption is broken. This is the ceiling effect you want them to notice.

  For the sequential round, you need to reuse the identical information set to isolate the mechanism. In the first simultaneous round, have them write their private signal on their index card before voting. Collect these cards. Tell them you are keeping them for record-keeping. Then, for the sequential round, hand the cards back to the same students so they hold the exact same private information. Have them announce their votes aloud in a fixed order. You will almost certainly see an information cascade where the first few voters anchor the rest, regardless of the private signals held by the later voters. This demonstrates that the aggregation mechanism matters as much as the information distribution. For the heterogeneous competence round, which addresses your specific interest, distribute two envelopes from a high-reliability batch say ninety percent and sixteen from a low-reliability batch say fifty-five percent. Do not tell them who has the high-reliability signals. Let them vote. Then ask them if they would vote differently if they knew who the experts were. This is where you introduce your budget framing. You should be explicit in the debrief that the standard Condorcet Jury Theorem assumes equal competence, and that asking whether we should buy many cheap signals or few expensive ones is an extension of the model that reflects your own research interest in resource allocation within epistemic democracies. It is crucial you flag this as your hobbyhorse because the classic theorem does not solve for endogenous information acquisition costs, and you do not want students conflating the arithmetic of the theorem with the economics of attention.

  The debrief is where you map the experience to the math without killing the mood. Start by writing the conditions on the board: Independence, Competence greater than chance, and Binary Choice. Ask them which rounds violated which conditions. When they mention the sequential round, label that a violation of independence because later voters condition on earlier votes. When they mention the common signal round, label that correlation. When they mention the forty-five percent round, label that the competence condition. Then distinguish between the arithmetic and the political theory. The arithmetic is settled: if the assumptions hold, the probability of a correct majority converges to one as n goes to infinity. That is not contested. What is contested, and what you should leave them with, is whether any real electorate satisfies the independence assumption. Ask them if it is possible to vote independently in a polarized media environment. Ask them if competence is symmetric or if some errors are more likely than others. This separates the math, which they just felt in their bones, from the application, which is the actual work of political theory.

  Now for the honest part about what will go wrong. The most predictable failure is the student who anchors the sequential round. There is always one student who speaks first with high confidence, and if they are wrong, the cascade leads the whole class astray even if the private signals warranted a different outcome. When this happens, do not smooth it over. Use it. Ask the class why they ignored their own eyes. This is the exact phenomenon the theorem warns against when independence fails. Another failure mode is bad luck in the small numbers. With eighteen voters and fifty-five percent reliability, there is a non-trivial chance the majority gets it wrong simply due to variance. If this happens in the first round, the students might think the theorem is false. You need to be ready to explain that the theorem is about limits and expectations, not guarantees in small samples. You can simulate this by running a quick thought experiment about what would happen if you repeated this round one hundred times. A third failure is skepticism about your randomization. Students in upper-level seminars are often cynical. If they suspect you are rigging the envelopes to make a point, the lesson fails. To mitigate this, let a student shuffle the deck or the envelopes before distribution. Give up a bit of control to gain credibility. If the demonstration plainly fails, for example if the high-competence experts are outvoted by the low-competence majority in a way that feels unjust rather than instructive, admit it. Tell them that this is why democracy is risky. The theorem describes a tendency, not a safeguard.

  There are limitations you must state out loud because the activity cannot reproduce them. The most significant is the convergence claim. Eighteen students cannot show anybody a limit. You have to tell them that the magic of the theorem happens at n equals infinity, and that in the real world, we never have infinite voters. You also cannot reproduce the endogenous choice to acquire information. In your activity, the signal is given. In reality, voters choose whether to pay attention. This links back to your budget hobbyhorse, but you must clarify that the theorem takes competence as exogenous. Finally, distinguish between the arithmetic of the theorem and the contested claims about democracy. The arithmetic says that under specific conditions, majority rule is truth-tracking. The contested claim is whether those conditions are ever met in a society with shared media, social pressure, and systemic bias. Some scholars argue that deliberation can fix the independence problem, while others argue it makes it worse. You do not need to resolve this, but you must ensure the students leave knowing that the math is solid but the application is where the fight is.

  Regarding your budget framing, I will be frank. It is indeed your hobbyhorse in the context of this specific theorem. The Condorcet Jury Theorem itself is silent on the cost of signals. It assumes voters exist and have fixed competence. The question of whether a society should invest in educating a few voters well or many voters poorly is a normative extension, often associated with work on epistemic democracy and resource allocation, but it is not part of the theorem's arithmetic. By flagging this as your specific interest, you protect yourself from the charge that you are presenting a contested normative claim as a mathematical necessity. It allows you to say, the math says majority rule works if competence is fixed, but I am interested in how we fix competence, and that is where the budget constraint comes in. This honesty will strengthen your credibility with upper-level students who are sensitive to conflation of fact and value.

  If the room feels flat or the students are resistant, pivot to the normative implications immediately. Ask them if they would trust the majority verdict if they knew the competence was below chance. Ask them if they would trust the majority verdict if they knew the votes were not independent. This shifts the focus from the success of the simulation to the failure of the conditions, which is often more pedagogically fruitful. The goal is not to prove the theorem is true, but to prove that the assumptions are heavy lifting. If the students leave believing that majority rule is only as good as the independence and competence of the voters, you have succeeded, even if the tally sheet looks messy. The activity is not a proof; it is a vulnerability assessment of democratic theory.

  I hope this helps you structure the session. It is a high-wire act to teach formal theory through embodiment, but if you manage the timing and the transparency of the randomization, it will stick with them far longer than a lecture on binomial distributions. Good luck.
