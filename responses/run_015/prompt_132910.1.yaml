prompt: |-
  You are an expert in philosophical logic and formal epistemology with substantial experience drafting interdisciplinary research proposals. Before writing, please spend a few moments brainstorming the conceptual landscape: consider how program equilibrium—where rational agents submit source-code-transparent strategies rather than opaque actions—differs structurally from standard Nash reasoning, and identify one precise philosophical tension this difference could illuminate that is not already settled in the literature.

  Write a polished, two-page research proposal suitable for a six-month workshop fellowship or small interdisciplinary grant application. The core question should be precise and tractable without external reference: Does the source-code transparency required by program equilibrium generate a novel form of reflective instability—specifically, a fixed-point failure—when applied to models of shared intentionality in which each agent’s reasoning procedure must include a faithful representation of the other’s representation of its own procedure? In other words, can collective agency be sustained under conditions of full procedural transparency, or does the recursive self-modeling inherent in program equilibrium collapse the equilibrium conditions that shared-intentionality theories (which typically rely on common belief rather than direct code inspection) take for granted?

  Structure the proposal with the following elements, developed with appropriate rigor. First, state the research question precisely so that it has a determinate answer—either a proof-of-concept formal result, a clear conceptual distinction, or a demonstrated impossibility. Second, explain why existing answers in both game-theoretic and philosophical literature leave this open: standard Nash-based treatments of collective action treat reasoning as black-box, while shared-intentionality accounts assume transparency of beliefs but not of procedural implementation, leaving the interaction between procedural transparency and recursive self-reference unexamined. Third, present the proposed method: a combination of formal modeling (specifying the program-equilibrium framework for a minimal two-agent collective-action scenario with nested self-models) and conceptual analysis (determining whether the resulting fixed-point conditions map onto known failures in collective intentionality or constitute a distinct category). Provide a realistic month-by-month plan for a six-month project, noting explicitly where formalization might stall and what contingency would be triggered. Fourth, describe what a successful result would look like—for example, a characterization of the conditions under which reflective stability is preserved versus broken, with implications for whether shared agency requires opacity at the procedural level. Fifth, specify what would count as failure—for instance, if the formalization collapses into a standard common-knowledge framework without generating new conceptual distinctions, or if the recursive nesting proves technically intractable within the scope. Sixth, offer an honest scope assessment: acknowledge that building a full formal system is ambitious for six months, state what partial deliverable (a rigorous framework plus a proof sketch for the minimal case) is realistic, and identify the specific technical risk that makes the project potentially too large.

  Please do not include a bibliography, literature review organized by citation, or reading list; refer to positions and arguments generally, and note that citations will be added separately. Do not invent specific paper titles, publication dates, author attributions, or page numbers. Write in a formal academic register appropriate for a philosophy or logic funding panel, and ensure the framing avoids both generic summary of well-known debates and dependence on obscure technical details that would require specialized retrieval to verify.
