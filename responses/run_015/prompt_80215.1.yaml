prompt: |-
  I'm a retired statistical physicist who has recently gotten into philosophy, and I'm currently taking a course on the philosophy of probability. I spent most of my career working with ensembles and Born-rule probabilities, so I'm comfortable with the idea of objective chance, but I'm new to the philosophical questions about how an agent's credences should relate to those chances. I keep coming back to the Principal Principle—the claim that your credence in a proposition should equal its objective chance, conditional on all your admissible evidence—and I find that the phrase "admissible evidence" is doing a lot of quiet work that nobody seems to pin down. What actually counts as admissible? What happens when your evidence includes information about your own current credences, or when it includes information about the chance function itself? I'd like you to write out the desiderata that any adequate theory of the credence-chance relationship must satisfy: the phenomena it has to explain, the cases it has to get right, the distinctions it cannot collapse, and the results it has to be consistent with, with the motivating case or consideration behind each requirement. I want to know which of these are non-negotiable and which are preferences of particular camps, and whether any subset of the desiderata turns out to be jointly unsatisfiable—if the list itself yields a result, I'd like to see it. Close with a brief scorecard of the main existing contenders against the list, but keep the weight on the criteria rather than the scoring. Please write the whole answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired statistical physicist, comfortable with ensembles and Born-rule probabilities (objective chance), new to philosophy of probability, specifically the epistemology of chance (credence vs. chance).
      *   **Topic:** The Principal Principle (PP) and the problem of "admissible evidence."
      *   **Task:** Write out the *desiderata* for any adequate theory of the credence-chance relationship.
      *   **Specific Requirements:**
          *   Explain phenomena to explain, cases to get right, distinctions to maintain, consistency requirements.
          *   Provide the motivating case/consideration for each.
          *   Distinguish non-negotiable vs. camp-specific preferences.
          *   Investigate joint satisfiability (is there an impossibility result?).
          *   Close with a brief scorecard of main contenders (Humean, Anti-Humean, etc.) against the list.
          *   **Constraint:** Keep the weight on the *criteria*, not the scoring.
          *   **Language:** American English.

  2.  **Deconstruct the Core Problem:**
      *   The Principal Principle (Lewis, 1980) states: $C(A | Ch(A)=x \land E) = x$, provided $E$ is admissible.
      *   The "admissibility" clause is the notorious weasel word.
      *   The user wants to know what constraints a theory of admissibility (or a replacement for PP) must meet to be viable.
      *   Key tension: Humean Supervenience (chances supervene on patterns of particular facts) vs. the guidance of credence by chance.

  3.  **Brainstorming Desiderata:**
      *   *Basic Alignment:* Credences should track chances when we know the chances. (The core intuition).
      *   *Future Contingents:* Chances are about the future; credences are current. We shouldn't have "crystal ball" knowledge.
      *   *Self-Locating/Indexical Info:* What if I know "I am the winner"?
      *   *Undermining:* If chances supervene on the total history, knowing the chances might imply knowing the future history, which contradicts the chance assignment (Lewis's problem).
      *   *Old Evidence:* How does this relate to confirmation?
      *   *Rigidity:* The chance function shouldn't change just because my credence changes.
      *   *Computability/Access:* Can an agent actually use this principle?

  4.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the user's background (physics to philosophy), validate the intuition about "admissible evidence," and set the stage (Lewis's PP).
      *   **The Desiderata List:** Group them logically (e.g., Core Norms, Metaphysical Constraints, Epistemic Constraints).
          *   For each: Name, Description, Motivating Case, Status (Non-negotiable vs. Contested).
      *   **The Impossibility Result (The "Bug"):** Discuss Lewis's "Undermining" problem. This is crucial for a physicist who likes rigorous constraints. It shows the tension between Humean Supervenience and the original PP.
      *   **Joint Satisfiability:** Address whether the list is consistent (it requires modifying PP).
      *   **Scorecard:** Briefly evaluate Humean Best Systems, Primitivism, and Propensity theories against the desiderata.
      *   **Conclusion:** Summary thought.

  5.  **Drafting the Content - Section by Section:**

      *   *Intro:* Use physics analogies (boundary conditions, state functions) to bridge the gap.
      *   *Desideratum 1: The Basic Norm.* If you know the chance, believe it. (Motivation: Rationality). Status: Non-negotiable.
      *   *Desideratum 2: No Backward Causation/Foreknowledge.* Admissible evidence can't reveal the future outcome directly. (Motivation: Temporal asymmetry). Status: Non-negotiable.
      *   *Desideratum 3: Humean Supervenience (HS) Compatibility.* Chances depend on the mosaic of facts. (Motivation: Naturalism). Status: Contested (Humeans say yes, Primitivists say no).
      *   *Desideratum 4: The Undermining Constraint.* A theory must handle the case where the best system chances imply a future that makes those chances false. (Motivation: Logical consistency). Status: Non-negotiable for Humeans.
      *   *Desideratum 5: Indexical/Centered Evidence.* Handling "I am here now." (Motivation: Self-locating belief). Status: Emerging/Contested.
      *   *Desideratum 6: The Connection to Explanation.* Chances should explain frequencies, not just be defined by them. (Motivation: Scientific practice). Status: Contested.

      *   *The "Bug" (Undermining):* Explain Lewis's realization. If $Ch$ supervenes on total history $H$, and $H$ includes the future, then knowing $Ch$ gives info about $H$. If $H$ is incompatible with $Ch$ (undermining future), then $C(Ch | H) = 0$, violating PP.
      *   *Resolution:* The "New Principal Principle" (Hall, Thau, Ismael). Replace $Ch(A)=x$ with $Ch(A)=x$ is the *actual* chance function, or use conditionalization on the hypothesis that the chance function is resilient.

      *   *Scorecard:*
          *   *Lewisian Best Systems:* Fails original PP due to undermining, saves it with New PP. Strong on HS, weak on explanation.
          *   *Primitivism:* Satisfies PP easily, fails HS.
          *   *Propensity:* Good for single cases, struggles with HS and mathematical rigor.
          *   *Frequentism:* Fails single case chances (Born rule context).

  6.  **Refining the Tone:**
      *   Keep it rigorous but accessible to a physicist. Avoid overly dense jargon where simple logic suffices.
      *   Ensure American English spelling (e.g., "color" if used, though unlikely; "modeling" vs "modelling").
      *   Make sure the distinction between "non-negotiable" (rationality/logic) and "camp preference" (metaphysics) is clear.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address "evidence about own credences"?
      *   *Adjustment:* Add a specific point about *epistemic transparency* or the distinction between chance and credence. If I know my credence, does that fix the chance? No. Need to ensure the theory doesn't collapse chance into credence (subjectivism).
      *   *Check:* Did I address "evidence about the chance function"?
      *   *Adjustment:* This is the core of the PP. The desiderata must ensure that knowing the chance function *is* admissible, unless it triggers undermining.
      *   *Check:* Is the impossibility result clear?
      *   *Adjustment:* Explicitly state that the *Original* PP + Humean Supervenience + Possibility of Undermining Futures = Inconsistency. This is the "result" the user asked for.

  8.  **Final Polish:** Check against the prompt's specific constraints (weight on criteria, American English, scorecard at end). Ensure the physicist background is respected (they understand measure theory basically, so don't dumb down the probability concepts, but clarify the metaphysical ones).

      *(Self-Correction on "American English"):* Ensure "modeling", "centered", "program" etc. are used correctly. Avoid "whilst", "amongst".

      *(Refining the "Admissible Evidence" definition):* Make sure to highlight that "admissible" is often defined *negatively* (information not about the future outcome) which is unsatisfying, hence the need for desiderata.

      *(Final check on the "Result"):* The result is that you cannot have Lewis's Original PP, Humean Supervenience, and the existence of undermining futures all together. One must go. Most go with modifying PP.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  It is a pleasure to address a colleague who understands the physics but is navigating the metaphysics. You have put your finger on the exact nerve that has kept philosophers of probability awake since David Lewis formulated the Principal Principle (PP) in 1980. In physics, we often treat the probability measure as a given object on the sample space. In philosophy, we must ask what license an agent has to align their subjective degrees of belief (credences) with that measure.

  The phrase "admissible evidence" is indeed doing heavy lifting. Lewis originally defined it somewhat circularly: evidence is admissible if it does not contain information about the future outcome of the chance process in question. But as you suspect, this is too vague. To evaluate theories of the credence-chance relationship, we need a rigorous set of desiderata.

  Below is a specification of the requirements any adequate theory must satisfy. I have categorized them by their function, noted the motivating case for each, and distinguished between those that are non-negotiable (requirements of rationality or logic) and those that are metaphysical preferences (camp-specific commitments).

  ### I. The Desiderata for a Credence-Chance Theory

  #### 1. The Basic Normative Constraint
  *   **Requirement:** If an agent knows the objective chance of an event $A$ is $x$, and possesses no "inadmissible" information, their credence $C(A)$ must be $x$.
  *   **Motivating Case:** The Coin Toss. If a trusted authority tells you a coin is objectively biased 0.7 toward heads, and you have no other information, it is irrational to bet at odds other than 7:3. To do so is to ignore the world's physical propensity in favor of arbitrary whim.
  *   **Status:** **Non-Negotiable.** This is the core phenomenon the theory is built to explain. Any theory that fails this ceases to be a theory of *objective* chance and becomes a theory of subjective belief.

  #### 2. The Temporal Asymmetry Constraint (No Crystal Balls)
  *   **Requirement:** Admissible evidence cannot include direct information about the truth value of the proposition $A$ (if $A$ is about a future event).
  *   **Motivating Case:** The Video Recording. Suppose a coin is tossed at $t_1$. At $t_2$, you watch a video recording of the toss showing it landed Heads. Your credence in "Heads" should be 1, regardless of whether the objective chance at $t_1$ was 0.5. If the theory allows the video recording to be "admissible" in the application of the PP, it would demand your credence remain 0.5, which is irrational.
  *   **Status:** **Non-Negotiable.** Credence tracks truth when truth is known; it tracks chance only when truth is unknown.

  #### 3. The Distinctness Constraint (Anti-Collapse)
  *   **Requirement:** The theory must maintain a conceptual distinction between the chance function $Ch$ and the credence function $C$. Knowing one's own credence should not fix the chance.
  *   **Motivating Case:** The Delusional Gambler. An agent might be certain (credence 1) that a fair coin will land Heads due to a superstition. If the theory collapses chance into credence, the chance becomes 1. But the physical setup remains a fair coin. The theory must allow that $C(A) \neq Ch(A)$ is a state of error, not a redefinition of chance.
  *   **Status:** **Non-Negotiable.** This distinguishes objective chance theories from radical subjectivism (like de Finetti's).

  #### 4. The Humean Supervenience Constraint (HS)
  *   **Requirement:** The objective chance function must supervene on the total history of particular, local matters of fact (the "Humean Mosaic"). There are no "necessary connections" or hidden propensities distinct from the patterns in the events.
  *   **Motivating Case:** Scientific Naturalism. We want chances to be part of the scientific image of the world. If chances are primitive, sui generis properties floating above the physical facts, they become metaphysically suspicious "occult qualities." We want chances to be summaries of the physics, not additions to it.
  *   **Status:** **Contested (Camp Preference).** This is the dividing line between Humeans (Lewis, Best Systems Analysis) and Anti-Humeans (Primitivists, Propensity theorists). Anti-Humeans reject this desideratum to save others.

  #### 5. The Undermining Constraint (Logical Consistency)
  *   **Requirement:** The theory must remain consistent even if the actual future history of the world could "undermine" the current chance assignment.
  *   **Motivating Case:** The Undermining Future. Suppose chances supervene on the total pattern of events (HS). It is possible (non-zero chance) that the future sequence of events turns out to be so skewed that, *had that future occurred*, the best-system chances would have been different than they are now.
      *   Let $T$ be the theory of chances true now.
      *   Let $F$ be a future history that is possible according to $T$ (so $Ch(F) > 0$).
      *   But if $F$ occurs, $T$ would not have been the best system (so $Ch(F)$ would have been different).
      *   Therefore, knowing $T$ gives you evidence against $F$.
      *   But PP says conditional on $T$, your credence in $F$ should be $Ch(F)$.
      *   Contradiction: $C(F|T)$ cannot be both $Ch(F)$ (by PP) and 0 (because $T$ implies $F$ is impossible if $F$ undermines $T$).
  *   **Status:** **Non-Negotiable.** A theory cannot entail a logical contradiction. This is the "bug" in Lewis's original system.

  #### 6. The Explanatory Constraint
  *   **Requirement:** Chances should explain frequencies and regularities, not merely be defined by them.
  *   **Motivating Case:** The Single Case. In quantum mechanics (Born rule), we assign a chance to a single decay event. A pure frequentist definition fails here. Furthermore, we say the coin landed heads 50% of the time *because* the chance was 0.5. If chance is just the frequency, the explanation is circular.
  *   **Status:** **Contested (Camp Preference).** Humeans struggle with this (chances are summaries, not explainers). Primitivists embrace it.

  #### 7. The Indexical/Centered Evidence Constraint
  *   **Requirement:** The theory must handle evidence that is self-locating (e.g., "I am the observer in this branch").
  *   **Motivating Case:** The Sleeping Beauty Problem / Many-Worlds. If you wake up and don't know what day it is, or which branch of the wavefunction you are in, how does that interact with the objective chance of the coin toss or branching event? Standard PP assumes propositions are uncentered.
  *   **Status:** **Emerging/Contested.** Not part of the original 1980 formulation, but essential for modern applications (especially for a physicist dealing with Everettian QM).

  ---

  ### II. The Impossibility Result

  You asked if any subset of these desiderata turns out to be jointly unsatisfiable. **Yes.** This is the most significant result in the modern philosophy of chance.

  **The Inconsistent Triad:**
  1.  **The Original Principal Principle:** $C(A | Ch(A)=x \land E) = x$ for all admissible $E$.
  2.  **Humean Supervenience:** Chances are determined by the total mosaic of particular facts (past, present, and future).
  3.  **The Possibility of Undermining:** There is a non-zero chance that the future history will be such that it would change the current chance function.

  **The Result:**
  You cannot hold all three.
  *   If you keep (1) and (2), you must deny (3). But denying (3) requires claiming that certain physically possible futures have zero chance, which contradicts the chance function itself.
  *   If you keep (2) and (3), you must reject (1). This is the path Lewis eventually took. He admitted the Original PP was false for Humeans.

  **The Solution (The "New" Principal Principle):**
  To resolve this, philosophers (like Ned Hall, Michael Thau, and Jenann Ismael) proposed modifying the PP. Instead of conditionalizing on the proposition that *$Ch$ is the chance function*, one conditionalizes on the proposition that *$Ch$ is the **actual** chance function* (where "actual" rigidly designates the function that applies to this world, even if the future undermines it).

  Alternatively, Ismael's "Generalized Principal Principle" suggests we should not conditionalize on the chance hypothesis at all, but rather require that our credence function be a weighted average of possible chance functions, where the weights are our credences in those functions being the actual one.

  **Conclusion on Satisfiability:** The list of desiderata is jointly satisfiable **only if** the Original Principal Principle is replaced by a modified version (like the New PP) that insulates the credence update from the logical implications of Humean Supervenience.

  ---

  ### III. Scorecard of Contenders

  Here is how the main metaphysical camps score against the desiderata. Note that "passing" often requires modifying the Original PP as described above.

  | Contender | Basic Norm | Temporal Asymmetry | Distinctness | Humean Supervenience | Undermining Constraint | Explanatory Power |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Lewisian Best Systems (Humean)** | **Pass*** | **Pass** | **Pass** | **Pass** | **Pass*** | **Fail** |
  | **Primitivism (Anti-Humean)** | **Pass** | **Pass** | **Pass** | **Fail** | **Pass** | **Pass** |
  | **Propensity Theory** | **Pass** | **Pass** | **Pass** | **Fail** | **Pass** | **Pass** |
  | **Frequentism** | **Fail** | **Pass** | **Pass** | **Pass** | **Pass** | **Fail** |

  *\*Requires adoption of the "New Principal Principle" to resolve undermining.*

  **Analysis of the Scorecard:**

  1.  **Lewisian Best Systems:** This is the most popular view among analytic metaphysicians. It satisfies the naturalist desire for Humean Supervenience. However, it fails the Explanatory Constraint (chances explain nothing, they are just summaries) and it **fails the Original Principal Principle**. It only survives by adopting the technical fix for the Undermining Constraint. For a physicist, this looks like renormalizing a theory to remove a divergence; it works, but it suggests the original formulation was flawed.
  2.  **Primitivism:** This view treats chance as a fundamental, irreducible feature of reality (like mass or charge). It easily satisfies the Basic Norm and Explanatory Constraint because chance is a "real" thing that guides belief. However, it fails Humean Supervenience. For a physicist trained to look for underlying mechanisms, positing a primitive "chance property" may feel like giving up on explanation.
  3.  **Propensity Theory:** Popular among physicists (Popper, etc.). It views chances as physical dispositions. It handles single cases well (Born rule). However, it struggles to define propensities without circularity (a propensity to produce frequencies) and usually rejects Humean Supervenience.
  4.  **Frequentism:** The limit of relative frequency in an infinite sequence. It satisfies Humean Supervenience but fails the Basic Norm for single cases (what is the chance of *this* specific decay?) and fails the Explanatory Constraint (tautological). Given your background with ensembles, you likely see the utility here, but the philosophical consensus is that it fails to capture the normative force of the PP for singular events.

  ### Summary for the Physicist-Philosopher

  The "quiet work" done by "admissible evidence" is an attempt to block the agent from accessing information that would make the chance irrelevant (like the future outcome).

  The hard result you should take away is this: **If you believe chances supervene on the total pattern of events (as a statistical physicist might view the thermodynamic limit), you cannot hold the Original Principal Principle.** You must adopt a modified principle that acknowledges that knowing the "law" (the chance function) gives you slight probabilistic evidence about the "history" (the future events), which in turn constrains the law.

  The non-negotiable desiderata are the Basic Norm, Temporal Asymmetry, Distinctness, and Logical Consistency (Undermining). Humean Supervenience and Explanatory Power are the trade-offs. You can have a naturalistic ontology (Humean) or a robust explanation/normativity (Primitivist), but the Original Principal Principle cannot bridge them without cracking.
