answer: |-
  # Q&A Prep Sheet: Gödel's Rotating Universes & The Modal Argument

  **Seminar:** Joint Metaphysics & Philosophy of Physics
  **Time Allocation:** 15 Minutes (Approx. 2 minutes per exchange)
  **Strategy:** Your core vulnerability is the bridge between *mathematical solutions* and *metaphysical possibility*. Your core strength is the shift from "Time is Unreal" to "Becoming is Contingent." Do not get dragged into defending Gödel's Idealism; defend your reconstruction.

  ### Pre-emptive Concession (Make this in the closing remarks of the talk)
  **What to say:** "Before we open the floor, I want to be explicit: I am not arguing that Gödel's solution describes *our* universe. It does not. The cosmological constant is wrong, the expansion is missing, and the rotation is unobserved. My argument relies entirely on the *modal* status of that solution within General Relativity, not its actuality."
  **Why:** This disarms Halloran and the Grad students immediately. It prevents the first three questions from being "But our universe isn't like that!"

  ### The "Doom" Question (Hope nobody asks this)
  **"If the physical facts of our world underdetermine the metaphysics of time (since we can't rule out Gödel worlds empirically), why does the existence of a mathematical solution in GR determine the metaphysics of possibility? Are you privileging GR over metaphysics, or admitting that metaphysics is hostage to whatever differential equations we can solve?"**
  **Why it kills you:** It forces you to choose between saying GR is the final arbiter of possibility (which physicists like Halloran will deny) or saying that metaphysics depends on current theory (which makes your conclusion transient). There is no clean answer that satisfies both the physicists and the metaphysicians.

  ---

  ### The 7 Objections (Ordered by Likelihood & Damage)

  #### 1. The "Toy Model" Objection (Halloran)
  **The Question:** "You concede this isn't our universe. But it's also unstable. Chronology protection conjectures suggest these regions can't form dynamically. If a solution requires fine-tuned initial conditions that can't arise from a Cauchy surface, in what sense is it 'physically possible'? Why should metaphysics care about a mathematical artifact that nature forbids?"
  **The Reply (2 mins):** "I distinguish *nomological* possibility (consistent with the laws) from *dynamical* accessibility (arising from typical initial conditions). Gödel's point, and mine, is about the *laws*. If the field equations themselves—the very laws governing matter and geometry—permit a structure where 'past' and 'future' loop, then the *concept* of time inherent in those laws cannot essentially include objective becoming. Even if nature forbids it via boundary conditions, the laws themselves are neutral on passage. That neutrality is the metaphysical payload."
  **Concede:** That it may be dynamically inaccessible.
  **Hold:** That law-consistency is sufficient for the modal premise.
  **Soft Spot:** The claim that "laws" are separable from "boundary conditions" in GR is controversial (see Brown & Wallace).

  #### 2. The "Modal Strength" Objection (Grad Students)
  **The Question:** "You're moving from 'GR allows this solution' to 'It is metaphysically possible for becoming to be contingent.' But GR might be false. If quantum gravity forbids CTCs, your argument collapses. Why treat a classical field equation as a guide to metaphysical necessity?"
  **The Reply (2 mins):** "I am not arguing from the truth of GR, but from the *conceptual space* it opens. We are doing philosophy of physics, not just physics. We ask: 'Given our best theory of spacetime, what is the status of time?' If our best theory says becoming is contingent, the burden shifts to the A-theorist to explain why the theory is misleading. If future physics forbids CTCs, my conclusion changes, but the method remains: metaphysics must track our best physical ontology."
  **Concede:** That if GR is fundamentally false, the argument fails.
  **Hold:** That we must argue from our *best current* theory, not a hypothetical future one.
  **Soft Spot:** Reliance on "best current theory" is a weak reed for metaphysical necessity.

  #### 3. The "SR Already Did It" Objection (Vance)
  **The Question:** "Special Relativity already killed global simultaneity. We've been B-theorists since 1905. What work is the rotation doing? Why do we need closed timelike curves to show time doesn't pass? Isn't this overkill?"
  **The Reply (2 mins):** "SR kills *global* simultaneity, but it leaves *local* becoming intact. An A-theorist can say 'Time passes along my worldline.' Gödel's rotation destroys *local* becoming. In a CTC, my worldline returns to its own past. If time passes locally, does it pass twice? The rotation forces the issue from 'simultaneity is relative' to 'temporal order is non-linear.' It closes the loophole SR left open for local passage."
  **Concede:** SR does heavy lifting against global A-theory.
  **Hold:** That SR is compatible with local passage; Gödel is not.
  **Soft Spot:** Some A-theorists (like Presentists) claim they can handle SR already.

  #### 4. The "Diary Coherence" Objection (General/Halloran Follow-up)
  **The Question:** "Your Diary Argument assumes a coherent subject persisting through the loop. But if I hand a diary to my earlier self, causation is circular. How can I 'remember' an event that hasn't happened yet in my proper time? Doesn't this just show that *psychological* continuity breaks down, not that *time* fails to pass?"
  **The Reply (2 mins):** "Precisely. If psychological continuity breaks down, then the 'subject' who experiences becoming is fragmented. But if the subject *is* continuous—if I remember handing the diary over—then the event of handing it over is both a memory and an anticipation. It is fixed. If it is fixed, it isn't 'becoming.' The argument is a dilemma: either the subject breaks (no passage for them) or the subject holds (the event is static). Either way, objective becoming fails."
  **Concede:** Psychological continuity in CTCs is weird.
  **Hold:** The dilemma holds regardless of the weirdness.
  **Soft Spot:** Theories of personal identity in CTCs are under-specified.

  #### 5. The "Presentist Resilience" Objection (Okonkwo)
  **The Question:** "I'm a presentist. I say only the 'now' exists. In a CTC, the 'now' just moves around the loop. The problem is with *temporal order*, not *passage*. Why think that a breakdown in ordering implies a breakdown in the primitive flow of time?"
  **The Reply (2 mins):** "Because passage requires direction. If the 'now' moves around a loop, it arrives at an event $E$ twice. Is $E$ present twice? If yes, does it come into existence twice? If 'coming into existence' is primitive, it shouldn't be repeatable. If it is repeatable, it looks like a static property of the loop. You can save passage only by making it unmoored from the events themselves, which concedes my point: becoming is not a fact about the world, but a mode of traversal."
  **Concede:** Presentism can technically posit a "moving now" on a CTC.
  **Hold:** That such a view makes becoming unintelligible (repeatable existence).
  **Soft Spot:** Presentists have sophisticated responses to CTCs (e.g., Godfrey-Smith) that you may not fully dismantle in 2 minutes.

  #### 6. The "Watered Down Gödel" Objection (Colleague)
  **The Question:** "Gödel wanted to prove time is ideal/unreal. You've turned this into a modest claim about contingency. Doesn't this eviscerate the philosophical stakes? If time passes in our world, just not necessarily, haven't you saved the phenomenon Gödel wanted to destroy?"
  **The Reply (2 mins):** "I'm saving the *argument*, not the conclusion. Gödel's text emphasizes the *laws*. He says if the laws permit a world without time, time isn't essential to the concept of a world governed by those laws. My modal reading respects the text better than the 'time is unreal' reading, which ignores that Gödel admits time exists in *our* solution. The stakes remain high: it denies that passage is a necessary feature of reality."
  **Concede:** It is a weaker conclusion than "Time is an Illusion."
  **Hold:** It is a more faithful reconstruction of the 1949 text.
  **Soft Spot:** Gödel's explicit idealist comments in other writings.

  #### 7. The "Indexicality" Objection (Vance/Grads)
  **The Question:** "You say becoming is indexical, like 'here'. But 'here' is real. Location is real. Why does becoming being indexical mean it's not a fact about events? Why can't 'now' be a real, indexical property of events?"
  **The Reply (2 mins):** "Because 'here' doesn't loop. I can return to 'here' in space, but the *time* is different. In Gödel's world, I return to 'here' and 'now'. If 'now' is a property of the event, and I encounter the event twice, does it have the property twice? If properties are timeless, 'now' can't be one. If 'now' is transient, it can't be re-encountered. The loop breaks the analogy between spatial and temporal indexicals."
  **Concede:** Indexicality itself isn't the problem.
  **Hold:** The *topology* breaks the indexical account of tense.
  **Soft Spot:** The disanalogy between space and time is exactly what A-theorists insist upon anyway.

  ---

  ### Summary of Tactical Concessions
  *   **Give Ground On:** The physical actuality of the Gödel universe (it's not ours). The stability of the solution (it might be unstable).
  *   **Hold Ground On:** The modal premise (laws define possibility). The dichotomy of the Diary Argument (repeatable existence is incoherent). The distinction between SR (global) and Gödel (local) attacks on becoming.

  ### Final Advice
  Halloran will try to make this a physics discussion; steer it back to metaphysics ("I'm interested in what the solution *entails*, not how to build it"). Okonkwo will try to make it about the *experience* of time; steer it to the *ontology* of events ("It's not about how it feels, it's about whether the event exists twice"). Keep your eyes on the modal premise: that is the engine of the paper. If that stalls, the Diary Argument has nowhere to drive.
