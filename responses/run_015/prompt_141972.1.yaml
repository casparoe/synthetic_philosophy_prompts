answer: |-
  The Somatic Criterion

  Dr. Elena Vance smoothed the edge of the statute against the laminate table. The room was cold, kept at a temperature designed to keep bodies awake rather than comfortable. She had written clause (b) of the Somatic Criterion Act late one Tuesday in November, fueled by the conviction that the state had no business locking people up for being sad, difficult, or strange. The law was a sieve. It was meant to catch only the broken machinery of the body, letting the messy business of the will pass through into the courts, or into the street, wherever freedom belonged.

  Across from her sat Arthur Penhaligon. He was thirty-four, thin enough that the bones of his wrists looked like knots in a rope. He was not confused. He did not smell of neglect. He looked at Elena with a clarity that made her uneasy.

  To her right sat Mr. Henderson. He was a lay member, retired from the transit authority. He wore a suit that fit well enough and held a pen he did not use. He was there to represent the community, which usually meant he asked about costs or safety. Elena did not expect him to understand the nuance of species-typical functioning.

  "The petition seeks fourteen days of involuntary hydration and nutrition," Elena said, reading from the file. "Based on grave disability."

  "Based on failure to act," Arthur corrected gently. He spoke without hesitation. "I know I need to eat. I know that if I stop, my heart will fail. I value my life. I have a sister I love. I have no desire to die."

  "Then why aren't you eating?" Elena asked. This was the trap. Under the old law, this contradiction was proof of insanity. Under the Act, it was merely a statement of reasons. If Arthur said he chose not to eat, that was a moral choice. The state could not intervene.

  "I don't know," Arthur said. "I sit at the table. The food is there. I see the reason to lift the fork. The reason is strong. But the arm does not lift. It is not that I won't. It is that the signal does not reach the muscle."

  Elena felt the familiar rigidity of her own design settling over her. Clause (b) required that the condition be identified by a competent observer *without relying on the person's own account of what they take themselves to have reason to do.* Arthur's account was coherent. He was not deluded about the food. He was not deluded about his death. He was describing a disconnect between judgment and action. But that description was his account. To believe him was to rely on his testimony. To disbelieve him was to assume he was lying or choosing silently.

  "If you wanted to lift the fork, could you?" Elena asked.

  "Yes," Arthur said. "In the same way a car with a dead battery could drive if it had gas. The potential is there. The ignition is not."

  Elena prepared to deny the petition. This was a problem of living. It was a failure of character or spirit, not a lesion. There was no tumor, no toxin, no fracture. To commit him would be to medicalize the will, exactly what the Act forbade. She looked at Henderson, ready to guide him toward the release vote.

  Henderson was looking at Arthur's hands. They lay flat on the table, perfectly still.

  "Mr. Penhaligon," Henderson said. His voice was gravelly, unused to formal rooms. "You say the signal doesn't reach the muscle. But you can tell us why you should move it."

  "Yes."

  "And you can tell us why you don't want to die."

  "Yes."

  Henderson put the pen down. "In my job, sometimes a train stops on the line. The engineer says the engine is running. The lights are on. The brakes are off. But the wheels don't turn. We don't ask the train what it thinks. We look at the coupling."

  Elena frowned. "Mr. Henderson, we are not discussing a machine."

  "Aren't we?" Henderson turned to Elena. "The law says you don't need to listen to what he takes himself to have reason to do. You just need to see the fault. Doc, if a man says he wants to walk but his legs don't move, you call that a paralysis. You don't ask him if he's sure he wants to go to the store."

  "That is a motor deficit," Elena said. "This is volitional."

  "Is it?" Henderson leaned forward. "If I see a man starving while holding a sandwich, and he tells me he wants to eat, do I need his permission to see that something is broken? Or is the break right there in the not-eating?"

  Elena felt the floor of her argument shift. She had designed clause (b) to exclude the narrative of the patient. She wanted objective facts. *Observable deviations.* She had assumed the only observable deviations were things like tremors, rashes, or catatonia. But Arthur's inaction was observable. The discrepancy between his stated intent and his physical state was observable.

  Henderson asked the question that broke the clause. "If someone can state a reason but cannot act on it, is he unable in the sense the statute means? Or do we have to wait until he's dead to say the machinery failed?"

  Elena looked at Arthur. He was not asking for help. He was not asking for excuse. He was simply a site where the mechanism of human agency had jammed. The Act demanded she identify the fault without relying on his account of *reasons*. She did not need to believe his reasons. She only needed to observe the failure of the engine to turn the wheels. The failure was somatic in the sense that it was a functional breakdown of the organism, visible from the outside, independent of his internal justification.

  The skeptical view she had held—that illness must be bodily or it is metaphor—had assumed the body ended at the muscle. But the command to move was also biological. If the command failed to execute despite intact hardware and coherent software, the fault was in the transmission. It was not a metaphor. It was a mechanical failure of the will, observable like a limp.

  Clause (b) was satisfied. The test she designed to keep the will out of medicine had let the will in, because the will itself was part of the machinery.

  "We grant the petition," Elena said. Her voice was steady. "Fourteen days. Nutritional support."

  Arthur nodded. He did not look relieved. He looked like a man who had been diagnosed with a flat tire.

  "Will it fix me?" Arthur asked.

  "No," Elena said. "It will keep the engine running while we look for the break in the line."

  "And if you don't find it?"

  "Then we renew the petition."

  Elena signed the order. She had not found a lesion. She had not found a villain. She had simply drawn the line where the observable function ceased, regardless of the story the person told about why it stopped. The law was working. It was just catching more than she had intended.

