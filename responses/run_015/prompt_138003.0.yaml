      *   Correspondence tables? Yes.
      *   Disanalogies (Matter vs. Cosmetic)? Yes.
      *   Three test cases used? Yes.
      *   Do analogies support conclusions? Yes.
      *   Address user's stance (Lottery one-off vs. iterated)? Yes.
      *   Better analogy? Yes.

