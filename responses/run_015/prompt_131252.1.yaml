answer: |-
  Here are ten questions for the interview, drafted in proper British English and kept fairly casual, as requested. I've included the specific follow-ups for the three key areas you mentioned.

  **1.** So, starting off: Popper's falsifiability has taken a proper beating over the decades. What specifically broke it for you? Was it just that logical falsification is too binary for modern maths, or did you feel it was letting bad science off the hook?

  **2.** Let's talk about the Duhem-Quine problem. The usual objection is that you can always save a theory by blaming the instruments or some auxiliary hypothesis. You've said auxiliaries are part of the 'predictive architecture' rather than external shields. But if the whole bundle is what's being tested, doesn't that make it nearly impossible to pinpoint where the error actually lies?
  *   **Follow-up:** *If she insists that holism is a feature, not a bug:* So are you saying we should stop trying to falsify individual hypotheses altogether? Because that sounds like it might stall progress if we can't isolate which part of the bundle is actually rotten.

  **3.** You apply this mostly to statistical fields like climate science. But those models spit out probabilistic ranges, not single-point predictions. How does 'predictive fragility' work when the prediction is basically a spread of possibilities? Does the error distribution itself become the thing that's fragile?
  *   **Follow-up:** *If she argues that credible intervals are the target:* Right, but couldn't a team just widen those intervals enough to ensure nothing ever undermines them? Where's the line between honest uncertainty and just building an immunising strategy into the stats?

  **4.** On the demarcation boundary: could a clever pseudoscientist game this? Say, an astrologer starts running regressions on birth charts and publishes error rates that look systematically underminable. If they mimic the method, do they suddenly pass the test?
  *   **Follow-up:** *If she claims astrology lacks a causal mechanism:* But Popper didn't care about mechanism, just logical structure. If astrology adopts your statistical rigour, are you saying you'd still exclude it based on metaphysics rather than its predictive performance?

  **5.** How does this sit with Bayesian confirmation? It feels like you're describing a specific kind of likelihood function. Is 'predictive fragility' just Bayesianism in disguise, or is there a hard line where you'd reject a theory that a Bayesian might accept?

  **6.** Does this view have anything to say about high-energy physics? String theory, for instance, is often criticised for lacking empirical contact. Under your view, is it unscientific because it isn't fragile enough, or because we haven't built the tools to break it yet?

  **7.** Can you think of a historical case where a theory was 'too robust'? Like, it survived too well against data that should have undermined it, and that actually stalled the field? I'm curious if fragility is something we should have spotted earlier.

  **8.** If you were advising PhD students on writing up their results, what would you tell them? Should they be explicitly highlighting where their model is fragile, or is that something reviewers need to hunt for?

  **9.** Does fragility guarantee progress? I can imagine a field where theories are constantly being undermined but nothing better replaces them. Does your criterion ensure we're moving towards truth, or just ensuring we're breaking things efficiently?

  **10.** Finally, what's the strongest objection you've heard so far? Is there a corner of this view you're still worried might not hold up under scrutiny?
