prompt: |-
  Corridor argument I keep loosing, and I'm teaching Austin next term, so I'd like to get it straight before I stand up in front of thirty undergraduates.

  Our legal theory lot run everything off one analogy: an utterance is a move in a rule-governed practice, like chess. Force, they say, is constituted by the rules plus the players' recognition of the move – the old practice-conception of constitutive rules, the counts-as clause, all that – so all a speech act needs is a speaker with standing, a well-formed move, and uptake. They then use it to settle something we actually argue about in college meetings: whether an institution can apologise. On their telling, a vice-chancellor's authorised statement of apology is a full apology; the complaint that no one meant it is a category error, sincerity was never part of the move; and anyone calling it a non-apology is just muddling an abuse with a misfire.

  I want the audit, please: what maps onto what (board, turn-taking, rulebook, umpire, win condition, illegal move), where the mapping goes wrong, and whether their conclusion survives once the disanalogies are on the table.

  Three things I keep getting stuck on. One: I suspect the source already contains the target – in correspondence chess you make your move by writing it down, and a call in bridge or a bid at auction just is a speech act – so how much work can chess be doing as an analysis of saying something? Two: has the analogy even got room for Austin's void-misfire versus hollow-abuse split? An illegal move looks void, which would make every infelicity a misfire and hand them their conclusion far too cheaply; but you can also play a legal move for the wrong reasons, in a fixed game, which suggests the split survives after all. Three: what does it smuggle in – a codified rulebook, an umpire, an agreed point to the whole business, players who share a goal, a closed field you can step out of?

  My test case, which I made up to break it: a college apologises for what a predecessor body did in 1892; nobody alive did it, nobody alive was wronged, the descendants are in the room to recieve it, and the words are read by an actor the college hired. Is that an apology on their picture, and is it a better or worse one than the vice-chancellor's?

  And if the analogy won't carry it, what would – the conversational scoreboard picture, rehearsal and script, something else?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** An academic (likely philosophy, linguistics, or law) preparing to teach J.L. Austin's speech act theory to undergraduates. They are frustrated with a specific interpretation of Austin prevalent among their "legal theory lot" (colleagues). They feel they keep losing arguments about this "Corridor argument" (informal hallway debates).
      *   **The Opposing View:** The "legal theory lot" uses a chess analogy to explain speech acts. They argue that speech acts are rule-governed moves (like chess). Force is constituted by rules + recognition (Searle-style constitutive rules). Therefore, an institutional apology (e.g., by a Vice-Chancellor) is valid if authorized and well-formed, regardless of sincerity. Sincerity is an "abuse," not a "misfire."
      *   **The User's Goal:** They want to "audit" this analogy. They need to know where the mapping holds, where it breaks, and whether the legal theorists' conclusion (institutional apologies don't need sincerity) survives scrutiny.
      *   **Specific Sticking Points:**
          1.  *Circularity:* Chess moves (writing down a move) and Bridge bids *are* speech acts. Is the analogy circular?
          2.  *Misfire vs. Abuse:* Does chess distinguish between void moves (misfires) and insincere moves (abuses)?
          3.  *Smuggled Assumptions:* Does chess assume a codified rulebook, umpire, shared goals, closed field?
      *   **Test Case:** A college apologizing for 1892 actions, read by a hired actor. Is this an apology on the chess model? Is it better/worse than the VC's?
      *   **Alternative:** If chess fails, what works better? (Scoreboard, script, etc.)

  2.  **Deconstruct the "Chess Analogy" (The Legal Theory Position):**
      *   *Core Claim:* Speech acts = Moves in a game.
      *   *Mechanism:* Constitutive rules (X counts as Y in context C).
      *   *Implication:* Validity depends on procedure/authority, not internal state (sincerity).
      *   *Austin Distinction:* Misfire (procedure failed) vs. Abuse (procedure followed but insincere). They map Insincerity to Abuse (like playing a legal move but cheating/fixing).
      *   *Conclusion:* Institutional apology is valid if authorized (VC), even if insincere.

  3.  **Address the User's Sticking Points (The Audit):**

      *   *Point 1: Circularity/Source-Target Overlap.*
          *   The user is right. Chess is a poor *analysis* of language because language is the medium of chess. "I move pawn to e4" is a speech act. Bridge bids are explicit performatives. Using a game *made of* speech acts to explain speech acts is illuminating but not foundational. It explains *institutional* facts, not *linguistic* capacity.
          *   *Verdict:* The analogy explains *authority* and *convention*, not *meaning* or *force* in the general sense.

      *   *Point 2: Misfire vs. Abuse.*
          *   *Chess:* Illegal move = Misfire (void). Legal move in a fixed game = Abuse (insincere/cheating).
          *   *Problem:* In chess, a legal move in a fixed game *still counts as a move*. The game continues. In speech acts, an insincere promise is still a promise (Austin agrees), but does it have the same *force*?
          *   *Crucial Distinction:* In chess, the *outcome* is affected by the fix, but the *move* is valid. In apology, if the sincerity condition is missing, is the *act* complete? Austin says an abused act is "hollow" but still performed. The legal theorists say "therefore it counts." The user needs to push on the *uptake* condition. If the audience knows it's a fix (or a hired actor), does uptake occur?

      *   *Point 3: Smuggled Assumptions.*
          *   Chess implies: Explicit rules, closed system, competitive goal (winning), distinct players.
          *   Language/Apology implies: Open texture, social bonding/repair, often no "win" condition, fluid roles.
          *   *The "Umpire" Problem:* Who adjudicates an apology? The audience. In chess, the umpire is external. In apology, the victim is the umpire. If the victim rejects it, did it happen?

  4.  **Analyze the Test Case (The 1892 Apology by Actor):**
      *   *Legal Theory View:* VC has standing. Script is well-formed. Actor is authorized mouthpiece. Therefore: Valid Apology. Sincerity irrelevant (institutional intent suffices).
      *   *Critique:*
          *   *Standing:* Does the VC have standing for 1892? (Continuity of institution).
          *   *Uptake:* If the descendants know it's an actor, do they accept the *apology* or just the *statement*?
          *   *Sincerity:* An institution *cannot* feel remorse. It can only commit to repair. If the "apology" is purely performative without commitment to change, is it a lie?
          *   *The Actor:* If the VC reads it, it's the VC's act. If an actor reads it, is it a *play* about an apology? This highlights the "theatrical" vs. "serious" distinction Austin makes. Chess doesn't have a "serious vs. acting" distinction in the same way (except problem chess vs. tournament).

  5.  **Develop the Counter-Model (What works better?):**
      *   *Scoreboard (Stalnaker/Lewis):* Good for context change. An apology changes the "score" (status of victim/offender). But doesn't solve sincerity.
      *   *Script/Rehearsal (Butler/Cavell):* Good for the "hollow" feeling. Iterability.
      *   *Bargaining/Negotiation:* Apology as a transaction.
      *   *Best Fit:* **The Ritual/Ceremony Model.** Apology is more like a wedding or a coronation than chess.
          *   Why? It requires *felicity* conditions that include sincerity (in a way chess doesn't). You can't be "married" if you say "I do" as a joke (parasitic speech).
          *   Actually, Austin's *own* distinction is better than the chess reduction. The legal theorists are Searle-izing Austin.
          *   *Key Move:* Distinguish *Institutional Act* (VC committing the college) from *Moral Act* (Expressing remorse). The chess model captures the Institutional Act but misses the Moral Act, which is often the point of the apology.

  6.  **Drafting the Response:**
      *   *Tone:* Collegial, sharp, philosophically precise, acknowledging the user's expertise (don't over-explain basics). Use the "corridor argument" vibe.
      *   *Structure:*
          1.  Validate the frustration (The "Searle-ization" of Austin).
          2.  The Audit (Mapping the Chess Analogy).
          3.  Addressing the Three Sticking Points.
          4.  The Test Case (1892 Actor).
          5.  The Better Analogy (Ritual/Wedding vs. Chess).
          6.  Teaching Advice (How to frame this for undergrads).

      *   *Refining the Argument:*
          *   *On Circularity:* It's not fatal, but it limits scope. It explains *conventional* force, not *illocutionary* force broadly.
          *   *On Misfire/Abuse:* The chess analogy collapses the distinction because in chess, the *move* exists regardless of intent. In apology, the *act* (as a moral repair) might not exist without intent.
          *   *On the Actor:* This is the killer. If an actor reads it, it's "etiolated" speech (Austin's term). It's a *representation* of an apology. The legal theorists must call this a real apology if the authorization is there. That sounds absurd.
          *   *The "Institutional Sincerity" Trap:* Institutions don't have minds. So "sincerity" for them means "commitment to action." If the VC apologizes but changes nothing, is it an abuse? Yes. Is it a *valid* apology? Legally, maybe. Morally, no. The chess model ignores the moral dimension.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Audit the mapping? Yes.
      *   Address 3 sticking points? Yes.
      *   Analyze test case? Yes.
      *   Suggest alternative? Yes.
      *   Keep it suitable for teaching prep? Yes.

      *(Self-Correction during drafting)*: Make sure not to conflate Searle and Austin too much. The legal theorists are using a Searlean reading of Austin (constitutive rules). Austin was messier. The user wants to defend a more nuanced Austinian view against a rigid Institutional view.
      *Key Insight:* The chess analogy treats the *rulebook* as the source of force. Austin treats the *procedure + context + uptake* as the source. The chess analogy ignores the "total speech situation."

      *Revised Plan for Test Case:* The actor scenario breaks the "standing" requirement. If the VC has standing, why hire an actor? If the actor has no standing, the move is void (misfire). If the actor is just a mouthpiece (like a press secretary), it works *unless* the theatricality undermines the seriousness (etiolation).

      *Let's sharpen the "Win Condition":* Chess has a win condition (checkmate). Apology has a success condition (forgiveness/reconciliation). If the apology is insincere, forgiveness is unlikely. Therefore, the "move" fails to achieve its point, even if "legal."

      *Okay, ready to write.*
answer: |-
  This is a classic corridor stalemate. Your legal theory colleagues are running a Searle-ised version of Austin (constitutive rules, counts-as functions) and treating it as the whole story. They are prioritizing the *institutional validity* of the act over the *illocutionary point* of the act.

  Here is the audit you need to walk in with, broken down by your three sticking points, the test case, and a superior analogy for the classroom.

  ### 1. The Audit: Mapping the Chess Analogy

  Here is how your colleagues are mapping the territory, and where the seams split.

  | Chess Element | Legal Theory Mapping | The Disanalogy (Where it breaks) |
  | :--- | :--- | :--- |
  | **The Board** | The Context / Institution | Chess is a closed system; language is open-textured. You can't step "off" the language board. |
  | **The Rulebook** | Constitutive Rules (Grammar + Protocol) | Rules in chess are explicit and exhaustive. Rules in speech are implicit, defeasible, and often contested. |
  | **The Move** | The Utterance / Speech Act | In chess, the move is physical (pushing wood). In speech, the move *is* the meaning. (See Sticking Point 1). |
  | **The Umpire** | The Audience / Uptake | In chess, the umpire is external/arbitrary. In apology, the victim *is* the umpire. If they reject uptake, the act often fails *retroactively*. |
  | **Illegal Move** | Misfire (Void) | An illegal move is taken back. A misfired speech act (e.g., marrying the wrong person) leaves a mess that isn't easily "taken back." |
  | **Fixed Game** | Abuse (Insincerity) | A fixed chess game still produces a winner/loser. An insincere apology often produces *no apology* (it produces resentment). |
  | **Win Condition** | Perlocutionary Effect (Forgiveness) | You can win chess without your opponent's consent. You cannot "win" an apology without the victim's acceptance. |

  ### 2. Addressing Your Three Sticking Points

  **Point One: Circularity (Source contains Target)**
  You are right to be suspicious. "I move pawn to e4" is a speech act. A bridge bid is a speech act.
  *   **The Trap:** Using chess to explain speech acts is using a *subset* of speech acts (conventional, rule-bound ones) to explain the *genus*.
  *   **The Counter:** Chess explains **institutional facts** (Searle's domain), not **brute illocutionary force**. Chess works for "I sentence you," "I bid," "I pronounce." It fails for "I warn you," "I beg you," "I apologise." Warning and begging do not require a rulebook; they require a context of danger or debt.
  *   **Teaching Line:** "Chess explains how we create *statuses* (checkmate, marriage, verdict). It does not explain how we create *understanding* or *repair*. An apology is often trying to repair a breach that the rulebook caused."

  **Point Two: The Misfire/Abuse Split**
  This is where they are cheating. They map *Insincerity* to *Fixed Game* (Abuse) and claim the move still stands.
  *   **The Trap:** In a fixed chess game, the move *counts* towards the record. In an insincere apology, the act is **hollow**. Austin says an abused act is "not happy," but your colleagues treat "not happy" as "legally valid."
  *   **The Counter:** In chess, the *game* continues despite the fix. In apology, the *relationship* often terminates despite the words. If the point of the apology is reconciliation (the win condition), and insincerity prevents reconciliation, the move has failed its internal telos, even if it followed the rules.
  *   **Teaching Line:** "In chess, a legal move in a fixed game is still a move. In apology, an insincere apology is often categorized by the recipient as an *insult*, not an apology. The 'uptake' condition reclassifies the move."

  **Point Three: Smuggled Assumptions**
  The chess analogy smuggles in **competitiveness** and **closure**.
  *   **The Trap:** Chess has a winner. Apology aims for a reset. Chess has an end state. Apology opens a negotiation.
  *   **The Counter:** The chess model assumes players who agree on the rules. Apology often happens precisely when the rules are in dispute (e.g., "I didn't break the rule" vs. "The rule was wrong").
  *   **Teaching Line:** "Chess assumes a shared goal (playing the game). Apology often happens when the shared goal (the relationship) is broken. You can't use a cooperative game model to explain a repair mechanism for broken cooperation without circularity."

  ### 3. The Test Case: The 1892 Apology by Actor

  **Scenario:** College apologises for 1892. VC authorizes. Actor reads it. Descendants present.
  **Legal Theory Verdict:** Valid Apology. (Standing: VC. Form: Correct. Uptake: Descendants heard it. Sincerity: Irrelevant for institutional act).

  **The Audit of the Test Case:**
  1.  **Standing:** Does the VC have standing for 1892? Only if the institution is continuous. If the legal theorists accept institutional continuity, they must accept institutional *guilt*. They usually want the apology without the guilt.
  2.  **The Actor (The Killer):** If the VC reads it, it is an institutional act. If an *actor* reads it, it borders on **etiolation** (Austin's term for non-serious speech, like acting on stage).
      *   If the audience knows it's a hired actor, the "seriousness" condition is compromised.
      *   **The Trap:** If the legal theorists say "It's still a valid apology," ask them: "If I hire an actor to say 'I do' at my wedding, am I married?" They will say no (procedure requires the *parties* to speak). So why does the apology allow a proxy mouthpiece without loss of force?
      *   **The Sincerity Problem:** An institution cannot feel remorse. It can only commit to repair. If the actor reads a script of remorse, it is a *simulation* of remorse. If the apology is defined as "expression of remorse," this is a lie. If it is defined as "commitment to repair," the actor cannot bind the institution, only the VC can.
  3.  **Comparison:** The VC's apology is *better* on their model because the VC has the *authority to bind* the institution to future action (reparations). The actor does not. Therefore, the actor's version is a **misfire** regarding the commitment, even if it is a valid *utterance*.

  **Verdict:** The chess model calls this a valid move. Reality calls it a PR stunt. The gap between "valid move" and "PR stunt" is where the theory fails.

  ### 4. What Works Better? (The Alternative Analogy)

  If chess is too rigid and competitive, use **The Ritual (Wedding/Coronation)** or **The Scoreboard**.

  **Option A: The Ritual (Better for Apology)**
  *   **Why:** Like chess, it has rules. Unlike chess, it requires **sincerity conditions** to be fully "happy."
  *   **The Mapping:**
      *   *Vows* = Apology Script.
      *   *Officiant* = VC / Authority.
      *   *Consent* = Uptake.
      *   *Intent to marry* = Sincerity/Commitment.
  *   **The Kill:** If you say "I do" as a joke (or hire an actor to say it for you), you are **not married**. The procedure was followed, but the act is void. This supports your intuition: Sincerity/Intent is not just an "abuse"; it is a felicity condition for the *moral* act, even if the *legal* act stands.
  *   **Teaching Line:** "An apology is more like a wedding vow than a chess move. You can say the words, but if you don't mean them, the social reality doesn't change."

  **Option B: The Conversational Scoreboard (Stalnaker/Lewis)**
  *   **Why:** Good for showing how context changes.
  *   **The Mapping:**
      *   *Score:* Status of Victim (wronged) vs. Offender (indebted).
      *   *Move:* Apology.
      *   *Score Change:* Debt cancelled, status equalized.
  *   **The Kill:** An insincere apology fails to update the scoreboard. The victim still feels wronged; the offender remains indebted. The "move" was made, but the "score" didn't change.
  *   **Teaching Line:** "Speech acts update the social scoreboard. An insincere apology is like a referee signaling a goal that the players don't accept. The game stops."

  ### 5. Summary for the Undergraduates

  When you stand up in front of the thirty undergrads, here is the narrative arc:

  1.  **Start with Austin:** Speech acts are things we *do* with words (promising, apologising, betting).
  2.  **Introduce the Legal View:** Some say these are just moves in a game (like chess). If you follow the rules, the move counts. Sincerity is extra.
  3.  **The Stress Test:** Ask them about the **Actor Test**. If I hire an actor to apologise to my spouse, have I apologised?
      *   If they say *Yes*: They are committed to the idea that relationships are bureaucratic.
      *   If they say *No*: They admit sincerity/authority matters.
  4.  **The Distinction:** Distinguish **Institutional Commitment** (VC binding the college to pay reparations) from **Moral Expression** (Expressing remorse).
      *   The Chess Model explains the *Commitment*.
      *   The Ritual Model explains the *Expression*.
      *   A full apology needs *both*.
  5.  **Conclusion:** The legal theorists are right that an institution *can* apologise (it's not a category error), but they are wrong that sincerity is irrelevant. An institutional apology without a commitment to change (institutional sincerity) is a **hollow act**, not a **happy one**. It may be legally valid, but it is illocutionarily defective.

  **The Corridor Closer:**
  "Your chess model explains how we create *records*. It doesn't explain how we create *trust*. An apology is a trust mechanism. If the rules are followed but trust isn't restored, the move didn't do what it was supposed to do. In chess, that's a bad strategy. In apology, that's a failed act."
