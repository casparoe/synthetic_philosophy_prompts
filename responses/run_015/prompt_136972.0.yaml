      *   **User:** A graduate student or early-career academic convening a reading group on aesthetics and political philosophy. They are working on a seminar paper.
      *   **Topic:** W. E. B. Du Bois's claim that "all art is propaganda."
      *   **The Conflict:** A stalemate between two views:
          1.  *Advocacy Thesis (Du Boisian):* Art inevitably advocates a vision of life; if that vision is false/unjust, the art is defective. Political/ethical orientation is internal to aesthetic value.
          2.  *Aesthetic-Purist View:* Artistic value is fixed by sensible/formal properties. Political advocacy is external (accidental effect, viewer usage, etc.).
      *   **Test Cases:**
