      *   Is it bedrock intuition? Yes, about Autonomy vs. Embeddedness.
      *   Is it ill-posed? Potentially. If "propaganda" means "having effects," everything is propaganda. If it means "intentional manipulation," most art isn't.
      *   *Core Diagnosis:* It is a **category collision** masquerading as a definition dispute. The Purist is defining Art by *mode of attention* (disinterested contemplation). The Du Boisian is defining Art by *mode of existence* (social artifact). They aren't disagreeing about the object; they are disagreeing about the *frame* through which the object is evaluated.

  5.  **Formulate Recommendations for Progress:**
