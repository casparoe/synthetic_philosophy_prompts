      *   *Refining the "Verbal" point:* It's not just definition. It's about *scope*. Du Bois expands the scope of the political to cover the ontological. Purists restrict the political to the intentional.
      *   *Refining the "Substantive" point:* It's about *Supervenience*. Purists = Local Supervenience (on the object). Du Boisians = Global Supervenience (on the object + context).
