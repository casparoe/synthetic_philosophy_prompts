      *   *Distinction:* Separate *ontological claim* (art exists in a social field) from *normative claim* (art *ought* to serve justice).
      *   *The AI Case:* Use it to show that "intrinsic properties" are unstable in digital media (weights/biases are intrinsic to the generation process but invisible in the output). This challenges the Purist's "intrinsic" claim.

