      *   *Colony* $\to$ *Human Tribe/Society*.
      *   *Evolutionary Pressure* $\to$ *Group Selection/Sociality*.
      *   *Mechanism* $\to$ *Blind Signalling vs. Conscious Deliberation*.

  4.  **Identifying the Fractures (The Core Argument):**
      *   *Point 1: Reflexivity.* Ants don't reflect on the pheromone. Humans reflect on the instinct. Darwin emphasizes the "power of reflection" on past actions.
      *   *Point 2: Language.* Ants don't discuss the trail. Humans use language to codify public opinion ("the praise and blame of our fellow-creatures").
      *   *Point 3: Habit.* Darwin stresses that conscience becomes a habit, but a habit formed through intellect.
      *   *Point 4: Normativity.* The colleague claims no "genuinely normative grasp." Darwin argues that the *feeling* of oughtness arises from the conflict between social instinct and temporary desire, mediated by memory.
      *   *Point 5: Religion.* For ants, no religion. For humans, religion arises from cognitive faculties (causality, agency detection) applied to social instincts.

  5.  **Evaluating the Reductive Conclusion:**
      *   Does it survive? No. It ignores the *emergent* properties Darwin highlights. It commits the "genetic fallacy" (origin = nature). Just because morality *starts* in instinct doesn't mean it *remains* merely instinctual.
      *   Darwin is a naturalist, not necessarily a moral nihilist. He explains the *origin*, not necessarily the *validity*, but he treats the resulting conscience as a distinct, higher faculty.

  6.  **Developing the Alternative Analogy (Language):**
      *   Why Language?
          *   Darwin explicitly compares moral sense to language in *Descent*.
          *   Both have instinctive roots (babbling/sociality) but require cultural/intellectual development.
          *   Both are normative (grammar/rules vs. moral norms).
          *   Both allow for infinite variability within a structural framework.
          *   Avoids the "blind chemistry" of pheromones.

