answer: |-
  Good morning. Please, look around this auditorium. It is a rare thing to see a room divided so neatly by profession, yet united so completely by a problem. On my left, I see those who have spent decades listening to the breath between words, who know that a rhyme can be a betrayal if it smiles when the poem means to weep. On my right, I see those who map the architecture of language, who understand constraints not as artistic challenges, but as hard boundaries in a solution space.

  For the next two days, we are gathered under the banner of "Form and Fidelity." Our central text is Clément Marot's *A une Damoyselle malade*—or as Douglas Hofstadter lovingly called it, *Ma mignonne*. It is a deceptively simple rondeau. Thirteen lines. Octosyllabic meter. A strict rhyme scheme. It is a letter to a sick young woman, written by a friend, perhaps a lover, who is watching her fade.

  The challenge of this poem is the challenge of this workshop. It is the tension between the cage and the whisper. The form is a cage: rigid, unforgiving, demanding specific syllable counts and sonic echoes. The content is a whisper: intimate, grief-tinged, fragile.

  To the translators here: I know you feel this in your bones. You know that rendering *Ma mignonne* as "My darling" might fit the meter, but it often sands off the specific texture of the French. It turns a specific, tender address into a generic term of endearment. You know that when you force a rhyme to close a stanza, you sometimes have to kill the very vulnerability you were trying to preserve. You know that a perfect technical match can still feel like a lie.

  To the linguists and computer scientists: I know you see this as a constraint satisfaction problem. You see variables: syllable count, rhyme class, semantic overlap. You seek an optimal solution. But I am here to suggest that in this room, the objective function is incomplete. If you optimize only for structural isomorphism, you will produce a poem that is mathematically correct and emotionally hollow. You cannot treat intimacy as a binary variable. You cannot model mourning as a simple penalty for deviation. When the constraint is extreme, the cost of satisfaction is paid in human voice.

  To bridge this gap, I want to introduce a criterion that rarely makes it into our rubrics. I call it **tonal inertia**.

  For the formalists in the room, think of tonal inertia as the friction heat generated when semantic intent is forced through a syntactic nozzle. It is the energy lost when the emotional velocity of the source text is decelerated by the structural mass of the target form. It is a measurable divergence between the pragmatic force of the original utterance and the pragmatic force of the translation, normalized against the degree of formal adherence.

  For the translators, you know this as the feeling that a poem is "running away" with itself. It is when the rhyme scheme demands a resolution that the emotion does not feel. It is when the meter marches forward with a confidence that the speaker does not possess.

  Let me illustrate this with two hypothetical renderings of the poem's opening address. Marot's original is worried, tender, observing her fragility.

  Consider Version A:
  *"My darling sweet, do not despair,*
  *The sun will shine on you with care."*

  Now consider Version B:
  *"My little one, the light is low,*
  *I watch the color from you go."*

  Both versions obey the meter. Both versions rhyme. Both versions convey the basic semantic proposition of addressing a sick woman. But Version A has high tonal inertia. The form—the bouncy rhythm, the easy rhyme of "despair/care"—pushes the voice toward cheerfulness. It forces a smile onto a face that is ill. The form is moving faster than the feeling. It satisfies the constraint of the rondeau but violates the constraint of the situation.

  Version B has low tonal inertia. The rhythm slows. The rhyme "low/go" is somber. The form bends to accommodate the grief rather than forcing the grief to accommodate the form.

  If we are to do real work here, we must agree that Version A is, in a profound sense, incorrect. It is formally faithful but tonally driftful. It solves the puzzle but loses the picture.

  This brings us to the question that should haunt us until we close this workshop on Sunday. It is a question for the translators who fear losing the music, and for the scientists who fear losing the data.

  **What does it mean for a translation to be correct when its form is preserved but its tone has drifted?**

  Is it a successful map of a territory that no longer exists? Or is it a beautiful lie that tells us more about the constraints than the content? I look forward to hearing your answers. Thank you.
