  Here is my breakdown and final credence.

  **Final Credence: 0.36**
  (I believe there is a 36% chance that Scheffler's Afterlife Conjecture explains *most* of the badness of extinction beyond the immediate deaths.)

  ### Decomposition

  1.  **Probability that psychological dependence on future generations is universal enough to drive the intuition: 0.85**
      *   *Reasoning:* Scheffler's thought experiments reliably trigger a loss-of-meaning response in most people, suggesting this dependency is a structural feature of human valuing rather than a niche preference for legacy.
  2.  **Probability that this psychological dependency counts as a real moral reason rather than just a subjective feeling: 0.70**
      *   *Reasoning:* If valuing itself is constitutively dependent on the afterlife, then the loss of the afterlife undermines the rationality of our current values, which grants it normative weight beyond mere preference.
  3.  **Probability that the direct loss of future good lives is smaller (or less morally salient) than the loss of meaning for current people: 0.60**
      *   *Reasoning:* Person-affecting views (which say we only owe duties to existing people) are common enough that the "loss of potential people" argument may not carry the overwhelming weight standard total-utilitarianism assigns it.

  **Combination:**
  Treating these as roughly conjunctive necessary conditions for Scheffler's explanation to be the *primary* one (0.85 × 0.70 × 0.60 ≈ 0.357), I land at **0.36**. While the psychology is robust, the leap to it being the *dominant* moral factor faces stiff competition from the sheer scale of lost future welfare.

  ### Least Confident Component
  I am least confident in **Component 2 (Moral Weight)**.
  *   **Evidence to move me:** If philosophers could demonstrate that it is *irrational* (not just psychologically difficult) to maintain any values without the afterlife assumption, my credence would jump significantly. Currently, it's debatable whether this is a rational requirement or just a human limitation.

  ### Where Your Disagreement Lives
  Your disagreement (0.75 vs 0.25) likely lives in **Component 2 (Moral Weight)**, but for different reasons.

  *   **You (0.75):** You are probably intuitively accepting the move from "we can't help but care" to "therefore it matters morally." You likely view the destruction of meaning as a tangible harm comparable to suffering, which boosts the normative weight.
  *   **Your Friend (0.25):** They are likely a welfare consequentialist who believes that if no one is *suffering* (because they don't exist), no moral harm has occurred. They are rejecting Component 2 entirely, viewing the "loss of meaning" as a sentimental preference rather than a moral reason.

  **Verdict:** You are betting on the *constitutive* argument (meaning makes morality), while your friend is betting on the *welfare* argument (suffering makes morality). The truth is probably in the tension between those two frameworks.
