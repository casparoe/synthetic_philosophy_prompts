      *   **Scenario Constraints:**
          *   Realistic (no sci-fi, exotic physics, demons, perfect predictors).
          *   One paragraph.
          *   Society considering criminal prohibition (not regulation).
          *   Practice: Voluntary, fully informed, revocable service.
          *   Specific Practice: Brief, non-invasive neurochemical protocol to selectively suppress emotional capacity for moral outrage (for artistic/professional contexts where taboos are obstacles).
          *   Conditions: Entirely private, no physical/economic/psychological harm to non-participants, no lasting effects once discontinued.
      *   **Task Requirements (after scenario):**
          1.  State Hart-style harm-principle verdict + reasoning.
          2.  State Devlin-style legal moralist verdict + reasoning.
          3.  Identify the precise structural feature forcing divergence.
          4.  Explain what happens if that feature is removed (collapse to agreement? which direction?).
          5.  Show how the losing defender would attack the case (deny harmlessness, deny undermining morality, etc.).
      *   **Style:** American English, no bibliographies/citations/quotes.

  2.  **Drafting the Scenario:**
