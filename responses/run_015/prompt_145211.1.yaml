      If Hart says "No Ban" and Devlin says "Ban", and we assume a liberal society, Hart "wins". So Devlin "comes out worse".
      Devlin's attack: Deny the harmlessness premise. Argue that social cohesion is a tangible good whose degradation is a harm.

