answer: |-
  In the municipality of Oakhaven, a private clinic has begun offering "Affect Dampening Sessions," a thirty-minute neurochemical infusion using existing FDA-approved compounds that temporarily lower activity in the anterior insula for six hours, selectively suppressing the user's capacity to feel moral outrage or disgust. Artists and writers use it to depict taboo subjects without internal resistance, while corporate negotiators use it to finalize deals involving ethically ambiguous layoffs without emotional hesitation. Participation is strictly voluntary, requires informed consent, is fully revocable by simply waiting for the compound to metabolize, and occurs behind soundproofed doors with no public visibility. Medical consensus confirms the procedure causes no physical damage, creates no addiction, leaves no cognitive deficits after the window closes, and generates no external costs, yet polling indicates 70% of the citizenry feels deeply unsettled knowing neighbors are voluntarily disabling their moral compasses, claiming it erodes the shared sense of human dignity that binds the community.

  A Hart-style harm-principle position delivers a verdict against criminalization, reasoning that the state's coercive power is only legitimate when exercised to prevent harm to others. Since the practice is voluntary, private, and produces no tangible setbacks to the interests of non-participants, the mere fact that it offends popular sentiment or alters internal emotional states does not constitute harm; therefore, the individuals retain sovereignty over their own minds and moral capacities. Conversely, a Devlin-style legal moralist position delivers a verdict permitting prohibition, reasoning that society is held together by a shared moral structure just as much as by political institutions. If a significant portion of the community genuinely believes that disabling moral outrage strikes at the bond of human dignity, the society is entitled to use the law to preserve that moral environment, even absent physical injury, because the disintegration of shared values is itself a threat to social existence.

  The precise structural feature forcing these verdicts apart is the decoupling of moral offense from tangible, material setback interests. This feature isolates the disagreement by ensuring there is no empirical harm for Hart to latch onto, while simultaneously ensuring there is genuine moral distress for Devlin to protect. If this feature is removed, the case collapses back into agreement. If tangible harm to others were introduced, both theories would justify prohibition, as Hart would recognize the harm and Devlin would recognize the immorality. If the shared moral distress were removed, both would permit the practice, as Hart would see no harm and Devlin would see no threat to the moral fabric.

  A defender of the Devlinian position, which comes out worse in a liberal framework that prioritizes liberty, would attack the case by denying the harmlessness premise. They would argue that the description of the practice as harmless is conceptually flawed because it treats social cohesion as an abstract preference rather than a public good. By redefining the erosion of shared moral sensibilities as a tangible social harm akin to structural decay, the legal moralist contends that the practice does cause injury to the community's integrity, thereby reclaiming the ground needed to justify state intervention without abandoning the requirement that law must prevent harm.
