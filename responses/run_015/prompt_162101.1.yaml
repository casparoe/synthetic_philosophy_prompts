      **Conditions for Award**
      To bridge this gap, I propose funding contingent on three binding constraints:

      1.  **Pre-registered Out-of-Sample Validation:** The team must lock their coding rules and country set before data collection begins. Specifically, five of the twenty countries must be designated as a holdout set. The modelers cannot tune parameters on these five until the quarterly scores are frozen and submitted to the panel. Success is defined by correlation with structural outcomes in this holdout set, not historical retrodiction.

      2.  **Controlled Dissemination:** No public release of country-specific "structural pressure" scores. Given the leak risk, data must be embargoed. Reports should be aggregate-only (global/regional trends) for public consumption. Country-level data may be shared only with non-financial stakeholders (e.g., peacebuilding NGOs, development agencies) under strict non-disclosure agreements. Hedge funds and trading entities must be explicitly excluded from access.

      3.  **Evaluation Framework:** We must redefine accuracy. A "false positive" (warning issued, crisis prevented) must be counted as a success, not a failure. The evaluation metric will track structural interventions triggered by scores alongside traditional instability events.

      **Conclusion**
      This conditional approach respects the skeptics' demand for rigor while acknowledging the proponents' argument for utility. It mitigates the risk of market harm while testing the model's actual predictive power. If the team cannot accept these constraints, their confidence in the model is suspect, and we should reject. If they accept, we gain a potentially vital tool without compromising our ethical standards.

      I urge the panel to adopt this framework.

