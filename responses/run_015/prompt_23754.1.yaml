      *   *Key Theories:*
          *   **Material Conditional:** $A \to B$ is true if $A$ is false or $B$ is true. (Dana leans this way).
          *   **Possible Worlds/Strict Conditional:** Truth depends on closest possible worlds where $A$ is true. (Standard for counterfactuals).
          *   **Adams' Thesis/Probabilistic:** Assertibility depends on conditional probability $P(B|A)$.
          *   **Gricean Pragmatics:** Truth conditions might be the same, but usage rules differ (Dana's "style" argument).
