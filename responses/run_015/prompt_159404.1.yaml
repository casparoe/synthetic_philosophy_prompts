answer: |-
  Here is the sorting of your eight candidate tests, ranked by their utility as operational measures within an epidemiological framework of aesthetics.

  ### Tier 1: "I'd actually use this"

  **1. Plain infection (9/10)**
  This is the fundamental $R_0$ of the model; without observable induction of feeling, there is no transmission event to measure.

  **5. Repeat-exposure survival (9/10)**
  This distinguishes pathogenic art from mere novelty viruses, filtering out works that rely solely on startle reflexes or initial shock.

  ### Tier 2: "Usable with caveats"

  **6. Downstream carriage (7/10)**
  While behavioural change is the ultimate measure of virulence, the latency period is long and confounded by external variables.

  **7. Naive receptors (7/10)**
  This tests host range effectively, though one must beware of mistaking cultural immunity for a lack of pathogenicity.

  ### Tier 3: "Only any good as a filter for what isn't art"

  **2. Sincerity (6/10)**
  You can often spot a manufactured emotion, but proving the artist's internal state is impossible without mind-reading.

  **4. Channel robustness (6/10)**
  Useful for identifying classics that survive translation, but it risks false negatives for works intrinsically tied to their specific medium.

  ### Tier 4: "Actively misleading"

  **3. Transmission fidelity (4/10)**
  Emotions mutate upon reception; assuming static strain-typing misrepresents the phenomenology of shared feeling.

  **8. Brotherhood filter (3/10)**
  This is a theological value judgement rather than a transmission metric, introducing profound observer bias into the data set.

  ***

  ### The Extras

  **Tolstoy's Four Signs of Counterfeit**
  Tolstoy's own sieve—borrowed, imitative, effectful, and diverting—sits squarely in **Tier 3**. Like your sincerity and channel tests, they are negative indicators designed to rule out falsities rather than positively confirm genuineness, making them excellent for quarantine decisions but poor for diagnosing health.

  **The Final Two and Tolstoy's Objection**
  If I were forced to keep only two, I would retain **Plain infection** and **Repeat-exposure survival**, as they provide the only robust, observable data on transmission dynamics without requiring access to the artist's mind or the viewer's soul. Tolstoy himself would likely have thought **Transmission fidelity** was a daft idea, for he spoke of a spiritual union of souls rather than the mechanical cloning of emotional data.
