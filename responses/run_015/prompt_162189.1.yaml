  ### Most Costly Mistake

  **The claim that lowering $\alpha$ in a single study "would not do the same job" as dual-run confirmation.**
  This error costs the most points (approximately 4 points) because it contradicts the mathematical reality of part (a) and misses the core statistical lesson of the problem set: that requiring two independent significant results is mathematically equivalent to a much stricter single-run significance threshold. This misunderstanding undermines the student's discussion of the committee's argument regarding inference vs. incentives.

  ### Omissions and Ambiguity

  **Omission:** The student fails to address the "incentives" half of the committee's argument. The prompt asks to discuss the claim that the fix must be "inferential... rather than... incentivised." Dual-run confirmation is arguably a massive *incentive* change (increasing the cost of publication), not just an inferential one. The student treats it purely as an inferential/Bayesian update, missing the opportunity to critique the committee's dichotomy.

  **Ambiguity:** The question asks "what does the real work... a stricter effective threshold, or the accumulation of evidential support." In a Philosophy of Statistics seminar, a Bayesian student might argue these are two descriptions of the same phenomenon. However, because part (a) requires Frequentist FDR arithmetic, the "stricter threshold" answer is the one that aligns with the provided math. I graded based on the expectation that the student should reconcile the Bayesian intuition with the Frequentist calculation provided in (a), rather than dismissing the Frequentist mechanism.

  **Historical Misattribution:** As noted in Claim 4, attributing "power" and cost-benefit analysis to Fisher is historically inaccurate. In a graduate seminar on this specific topic, this suggests a lack of familiarity with the foundational literature (Fisher vs. Neyman-Pearson).

  ### Summary for Margin Comments
  *   **Part (a):** Perfect arithmetic; clear and rigorous.
  *   **Part (b):** Strong meta-scientific critique (file drawer, p-hacking), but fundamental error on the statistical mechanics of $\alpha$ and FDR. Be careful conflating Bayesian evidence with Frequentist error rates when the question specifies the latter. Review the historical distinction between Fisher and Neyman-Pearson regarding "power."
