  *   **Justification:** Correct application of base rate ($\pi$) and power/$\alpha$ to find joint probabilities.
  *   **Corrected Version:** N/A

  **Claim 2:** "0.04 / 0.20 = 20% of significant findings are null."
  *   **Verdict:** Correct.
  *   **Justification:** Correct calculation of the False Discovery Rate (FDR) formula $P(H_0 | \text{Sig})$.
  *   **Corrected Version:** N/A

  **Claim 3:** "For a null hypothesis, both studies must be significant and in the same direction, so 2 × 0.025² = 0.00125."
  *   **Verdict:** Correct.
  *   **Justification:** Correctly identifies that two-sided $\alpha=0.05$ splits into 0.025 per tail, and sums the probabilities of matching positive or matching negative results.
  *   **Corrected Version:** N/A

  **Claim 4:** "For a non-null hypothesis the chance both studies are significant in the same direction is 0.80 × 0.80 = 0.64... wrong direction... can be ignored."
  *   **Verdict:** Correct.
  *   **Justification:** Approximation is valid; with Power=0.80 ($\delta \approx 2.8$), the Type S error rate is negligible ($\Phi(-4.76)$).
  *   **Corrected Version:** N/A

  **Claim 5:** "Total published findings: 0.129, of which nulls make up 0.001 / 0.129 ≈ 0.8%."
  *   **Verdict:** Correct.
  *   **Justification:** Arithmetic follows correctly from previous steps; final FDR comparison is accurate.
  *   **Corrected Version:** N/A

