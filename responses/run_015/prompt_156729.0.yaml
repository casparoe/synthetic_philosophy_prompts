  Based on the pattern of her rulings, here is the map of her ethical framework, the prediction for the board case, and the test case that would expose the real engine of her thinking.

  ### 1. The Prediction
  **She will call this a Genuine Moral Dilemma.**

  ### 2. The Two Competing Rules
  There are two frameworks that fit all five of her past cases, but they diverge on how they weigh "collective duties" against "personal integrity."

  **Rule A: The "Incommensurable Moral Remainders" View (Likely Hers)**
  *   **The Principle:** A genuine dilemma exists whenever **two binding moral claims clash** such that whichever choice you make, you violate a duty that leaves a **justified moral remainder** (guilt/regret that is objectively appropriate, not just psychological).
  *   **How it fits the past:**
      *   *Switch:* Pulling is right; no moral remainder (grief is just psychological).
      *   *Fat-Man/Lie:* Both options violate a binding claim (Don't Kill/Don't Lie vs. Save Life/Stop Disaster). Both leave a moral stain.
      *   *Antidote:* You have no binding duty to the stranger you *can't* save ("ought implies can"). No moral remainder for their death.
      *   *Promise:* Life trumps Promise. Breaking the promise is justified; no moral remainder.
  *   **Application to Board Case:** You have a binding duty not to be complicit in harm (Integrity). You also have a binding duty to uphold the collective process you joined (Role/Civic). If you vote X, you violate Integrity (Remainder: Guilt). If you opt out, you violate Role (Remainder: Betrayal). Since both leave a remainder, it is a **Dilemma**.

  **Rule B: The "Lexical Hierarchy of Agency" View (The Alternative)**
  *   **The Principle:** A genuine dilemma exists only when **two active violations** clash. If one option is an *active violation* of a perfect duty (killing, lying, complicity) and the other is *passive* (allowing harm, breaking procedure), the active violation always trumps. There is no dilemma because one choice is simply wrong.
  *   **How it fits the past:**
      *   *Switch:* Redirecting harm is permissible (not an active violation).
      *   *Fat-Man/Lie:* Pushing and Lying are active violations. Saving five is passive (allowing). She calls these dilemmas because the *consequences* are so severe they create a counter-weight (this is the weak point of Rule B, but it fits if we assume she sees "Letting 5 die" as a quasi-active failure).
      *   *Promise/Antidote:* One option is clearly less violative.
  *   **Application to Board Case:** Voting X is **active complicity** (Direct Harm). Opting out is **passive undermining** (Procedural Failure). Under this rule, Active Complicity always trumps Procedural Failure. You should opt out. It is **Not a Dilemma**.

  ### 3. Which Rule Does She Actually Hold?
  She almost certainly holds **Rule A (Incommensurable Moral Remainders)**.

  **The Evidence:** The **Lie/Disaster** case.
  In that case, she ruled it a *genuine dilemma* even though one side was a "Perfect Duty" (Don't Lie) and the other was a Consequence (Disaster). If she held Rule B (Hierarchy), the Perfect Duty would automatically trump the Consequence, and it would *not* be a dilemma. The fact that she allows Consequences/Systemic Outcomes (Disaster) to create a dilemma against a Perfect Duty (Lying) means she believes **outcomes/roles can generate binding claims equal to integrity duties.**

