  2.  **Deconstruct Bell's Theorem (CHSH Inequality) into DS Concepts:**
      *   *The Setup:* Two parties (Alice, Bob) separated by distance. In DS terms: Two nodes, $N_A$ and $N_B$.
      *   *Inputs:* Alice gets input $x$, Bob gets input $y$. In DS: Request parameters or messages received at time $t$.
      *   *Outputs:* Alice produces $a$, Bob produces $b$. In DS: Return values or committed logs.
      *   *Shared State:* They share entanglement. In DS: Pre-shared randomness or a common ledger (but crucially, *no communication* during the protocol run). Let's call this $\lambda$ (hidden variable) or shared memory.
      *   *Locality/No-Communication:* Alice cannot know $y$ before producing $a$, and Bob cannot know $x$ before producing $b$. In DS: Causal isolation. No message path from $N_A$ to $N_B$ within the latency bound of the operation.
      *   *The Inequality:* $|E(a,b|x,y) + E(a,b|x,y') + E(a,b|x',y) - E(a,b|x',y')| \le 2$. In DS: A constraint on the correlation of return values given specific input combinations, assuming local determinism + shared history.
      *   *The Violation:* QM predicts $2\sqrt{2}$. In DS: A protocol that achieves a correlation score impossible for any algorithm respecting the causal constraints and local state determinism.

  3.  **Mapping Locality Assumptions to DS Counterparts:**
      *   *Locality (No Superluminal Influence):* Causal isolation. If $N_A$ commits $a$ before a message from $N_B$ could arrive (based on clock sync or known network bounds), then $a$ cannot depend on $N_B$'s input $y$. This is the "happens-before" relation. $y \not\to a$.
      *   *Realism (Hidden Variables):* Local Determinism. The output $a$ is a function of local input $x$ and local/shared state $\lambda$. There is no "on-the-fly" non-deterministic generation that isn't accounted for in the state. In DS, this is like saying the node is a deterministic state machine (possibly randomized, but the random seed is part of $\lambda$).
      *   *Measurement Independence (Free Will):* Input Independence. The inputs $x, y$ are chosen independently of the shared state $\lambda$. In DS: The clients sending requests are not colluding with the nodes' initialization state.

  4.  **Drafting the Restatement (The "Protocol" View):**
      *   Imagine a protocol where two nodes must output bits $a, b \in \{-1, 1\}$.
      *   They initialize with shared state $\lambda$ (pre-distributed).
      *   They receive inputs $x, y \in \{0, 1\}$ from external clients.
      *   Constraint: Network partition during execution. No messages between $N_A$ and $N_B$ after initialization.
