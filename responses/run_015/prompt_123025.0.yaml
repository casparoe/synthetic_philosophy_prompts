          *   Parameter Independence (PI): Alice's output distribution doesn't depend on Bob's *input*. DS equivalent: No signaling. $P(a|x,y) = P(a|x)$. This maps cleanly to "no message received."
          *   Outcome Independence (OI): Alice's output doesn't depend on Bob's *output*, given the hidden state. DS equivalent: Conditional independence. $P(a,b|x,y,\lambda) = P(a|x,\lambda)P(b|y,\lambda)$. This is tricky. In DS, if they share $\lambda$ and are deterministic, this holds automatically. In QM, without $\lambda$, the outcomes are correlated *beyond* what shared randomness allows.
