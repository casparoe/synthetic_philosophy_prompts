      *   *What is suppressed?* The single-event ontology. DS engineers think in traces and logs. Bell is about statistics of traces. But the deeper issue is *counterfactual definiteness*. In DS, if I didn't send message $M$, the state is simply different. In Bell tests, we assume we *could* have chosen input $x'$ instead of $x$ and the hidden variable $\lambda$ would have remained the same. This "counterfactual" assumption is subtle in DS. Usually, we model systems as state machines where different inputs lead to different states. Bell assumes $\lambda$ exists *prior* to input selection.
