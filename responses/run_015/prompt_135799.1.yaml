answer: |-
  This is a fantastic edge case. You've identified a phenomenon (waking with affect but no content) that acts like a stress test for these philosophical theories. It exposes the weak points in both the strict linguistic view (Malcolm) and the cognitive constructivist view (Dennett).

  Here is how Malcolm and Dennett would break down that pounding heart and empty head, and what it implies about the reality of dreams.

  ### 1. Norman Malcolm: The Fear is Just "Body Noise"
  Norman Malcolm, channeling Wittgenstein, argues that the concept of a "dream" is inextricably tied to the **report**. For Malcolm, saying "I had a dream" is not describing a private inner movie; it is engaging in a linguistic practice that happens *after* waking.

  *   **His Explanation of the Fear:** Malcolm would be uncompromising here. If you cannot report a plot, image, or narrative, **you did not have a dream.**
  *   **The Residue:** He would classify the pounding heart and terror as purely physiological events, indistinguishable in category from a leg cramp or a sudden spike in blood pressure while sleeping.
  *   **The Logic:** Since you cannot verify the experience while it is happening, and you have no content to report upon waking, there is no logical space for a "dream experience" to exist. The fear is real, but it is not *dream* fear; it is *body* fear.
  *   **The Verdict:** For Malcolm, this scenario proves his point. It shows that without the narrative report, there is no dream. The "experience" vanishes if it can't be spoken.

  ### 2. Daniel Dennett: The Fear is a "Draft" Without a Script
  Dennett views consciousness (and dreaming) through his **Multiple Drafts Model**. He argues there is no "Cartesian Theater" where a little homunculus watches a screen. Instead, the brain processes various streams of data (visual, emotional, narrative) in parallel.

  *   **His Explanation of the Fear:** Dennett would agree that the "story" is often edited upon waking, but he wouldn't say the fear is *just* body noise. He would say the emotional processing centers (like the amygdala) fired a "draft" of consciousness that was vivid enough to trigger arousal, but the narrative/visual draft was either never completed or was overwritten before you woke up.
  *   **The Residue:** The fear is a real cognitive event, but it is a **fragment**. When you wake up, your brain's "editor" looks at the fear and searches for a cause. If it finds no images, it leaves the fear unassigned (confusion) or quickly confabulates a story to explain it ("I must have been being chased").
  *   **The Logic:** Dennett distinguishes between the *process* and the *memory*. The physiological and emotional processing happened (real), but the unified "movie" did not (construct).
  *   **The Verdict:** For Dennett, the fear is evidence of brain activity, but not necessarily evidence of a coherent "experience" in the way we usually mean it. It's a glitch in the editing room.

  ### Which View Handles It Better?
  **Dennett handles the "residue" better, but Malcolm handles the "definition" better.**

  *   **Why Dennett Wins on Phenomenology:** Malcolm's view feels coldly dismissive of the actual suffering. If you wake up sweating and terrified, telling you "you didn't have an experience, you just had a bodily state" ignores the cognitive reality of emotion. Dennett acknowledges that the brain can generate raw affect (fear) without generating the accompanying qualia (images). This aligns better with neuroscience, which shows that emotional centers can activate independently of visual cortex activity during sleep.
  *   **Where Malcolm Has a Point:** Malcolm is right that without the content, the "dream" as a *narrative object* doesn't exist. If you can't describe what scared you, in what sense was it a *dream* and not just a panic attack?

  ### So, are dreams real experiences or body noise with a narrative?
  This specific phenomenon (fear without content) suggests a third option that bridges the two: **Dreams are embodied simulations.**

  Here is the synthesis:

  1.  **The Fear is Real Experience:** The fact that you feel terror without a plot suggests that **emotion is a more fundamental layer of dreaming than narrative.** You can have the "experience" of fear without the "story" of danger. This challenges Malcolm, because it proves there is *something* happening mentally, not just physically, that isn't dependent on a reportable story.
  2.  **The Narrative is Post-Hoc:** This supports Dennett (and partially Malcolm). The brain hates unexplained arousal. When you wake up terrified, your forebrain immediately asks "Why?" If the dream images are gone, your brain might invent a reason, or you might just assume there was a dream you forgot.
  3.  **The Conclusion:** The leftover fear suggests that dreams are **real neuro-cognitive events**, but they are not necessarily "stories" while they happen. They are fragmented states of arousal and simulation.
      *   If you define "experience" as "a coherent movie watched by the self," then no, dreams aren't real experiences (Dennett/Malcolm agree).
      *   If you define "experience" as "the brain simulating a state of being," then yes, the fear proves the experience was real, even if the plot was lost.

  **The Bottom Line:**
  That pounding heart is the smoking gun. It proves that **affect (feeling) can exist without cognition (story).**

  Malcolm would call this "body noise." Dennett would call it "an unfinished draft." But a phenomenologist would say it proves that the *feeling* of the dream is the primary reality, and the *story* is just the memory trying to make sense of the feeling. So, dreams are real experiences of **emotion**, but often fake experiences of **narrative**. You really were afraid; you just weren't necessarily being chased by a monster. Your brain was just firing the "monster" circuits without the monster.

  Does that distinction help resolve the tension, or does it make the "reality" of the dream even fuzzier?
