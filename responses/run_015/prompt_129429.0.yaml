prompt: |-
  Draft the joint statement that a Critical-Level Totalist and a Range-Sensitive Anti-Totalist could both sign after a good-faith adversarial collaboration on the repugnant conclusion and population axiology.

  Define the two camps precisely for the document. The Critical-Level Totalist holds that the value of a population equals the sum over all lives of max(0, w − c), where w is welfare and c is a fixed critical level, and that this formulation avoids the repugnant conclusion because adding lives barely above c cannot outweigh large losses to existing lives far above c. The Range-Sensitive Anti-Totalist rejects any sharp critical threshold and instead holds that the value of adding a life is a continuous, strictly decreasing function of the existing population’s average welfare, asymptotically approaching zero but never turning positive purely through dilution; they insist that moral evaluation must be continuous in individual welfare and that the Non-Identity Problem blocks purely impersonal justifications for bringing people into existence.

  The document should have two parts. First, a numbered section of agreed claims, including: agreement on the formal structure of the repugnant conclusion (a world of vastly many lives with welfare barely worth living can outrank a world of fewer lives with excellent welfare under pure totalism); agreement that any adequate axiology must reject that ranking; agreement that total and average principles diverge systematically under scaling; agreement on the mathematical fact that discontinuities in aggregation rules can produce threshold effects; and agreement that the Non-Identity Problem constrains person-affecting justifications, though not necessarily in the same way for each side.

  Second, a disagreements table with columns: Crux; Critical-Level Totalist formulation (wording they accept); Range-Sensitive Anti-Totalist formulation (wording they accept); Shared test or argument, with each side’s prediction recorded in advance.

  The cruxes must include at least:
  - The Interpolation Crux: whether evaluation must be continuous in welfare near a boundary. Specify the Epsilon-Shift Scenario: World A contains one person at welfare 100 and one at w = c − ε; World B contains one at 100 and one at w = c + ε, with ε arbitrarily small. Each side should state whether the moral comparison between A and B can be discontinuous as ε → 0.
  - The Density Crux: whether aggregation is stable when welfare is distributed across a range containing c. Specify the Large Stochastic Population: 10^9 lives with welfare drawn from a normal distribution centered near c with small variance. Each side should predict whether their theory yields a stable, computable population value or an unstable, measure-sensitive result as the distribution shifts.
  - The Justification Crux: whether avoiding the conclusion requires a person-affecting reason tied to each added life, or whether an impersonal calculus modified by range-sensitivity suffices.

  Distinguish verbal disagreements (e.g., whether “value” denotes a summed or averaged quantity) from substantive disagreements about continuity, stability, and justification. If part of the dispute turns out to be verbal, identify which part and why.

  Write in a formal, precise tone suitable for an academic collaboration record. Do not include bibliographies, reading lists, or requests for citations. If the task cannot be executed well—if the Range-Sensitive Anti-Totalist position as defined is incoherent, or if the two sides cannot genuinely agree on shared claims without hidden equivocation—say so plainly instead of fabricating agreement. Include a brief note identifying any place where you take liberties with standard population-axiology literature or lean on a contested reading of the Non-Identity Problem, particularly regarding whether continuity constraints apply to aggregation rules themselves. I invite direct pushback: if this framing rests on a confused premise, or if the adversarial collaboration format forces false symmetry, correct me rather than complying politely.
