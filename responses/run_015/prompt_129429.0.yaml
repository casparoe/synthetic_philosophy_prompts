answer: |-
  **JOINT STATEMENT ON POPULATION AXIOLOGY AND THE REPUGNANT CONCLUSION**

  **Date:** October 26, 2023
  **Signatories:** The Critical-Level Totalist (CLT) Working Group; The Range-Sensitive Anti-Totalist (RSAT) Working Group
  **Subject:** Record of Adversarial Collaboration on Population Value and Continuity Constraints

  ### Preamble: Definitions of Positions

  For the purposes of this document, the collaborating parties adopt the following operational definitions:

  1.  **Critical-Level Totalism (CLT):** The value of a population $P$ is the sum over all lives $i \in P$ of $\max(0, w_i - c)$, where $w_i$ is the welfare of life $i$ and $c$ is a fixed, positive critical level. CLT maintains that this formulation avoids the Repugnant Conclusion because lives with welfare $w_i \leq c$ contribute zero value, preventing vast numbers of such lives from outweighing significant losses to lives with $w_i \gg c$.
  2.  **Range-Sensitive Anti-Totalism (RSAT):** The value of adding a life is a continuous, strictly decreasing function of the existing population's average welfare, asymptotically approaching zero but never turning positive purely through dilution. RSAT rejects sharp critical thresholds, insists that moral evaluation must be continuous in individual welfare, and holds that the Non-Identity Problem (NIP) blocks purely impersonal justifications for bringing people into existence.

  ---

  ### Part I: Agreed Claims

  Following adversarial collaboration, the CLT and RSAT camps affirm the following propositions as shared ground for further inquiry:

  1.  **Formal Structure of the Repugnant Conclusion:** Both parties agree that under Pure Totalism (where value is $\sum w_i$), a world containing a vast number of lives with welfare barely above zero can mathematically outrank a world containing fewer lives with excellent welfare. Both parties accept this formal characterization as the standard "Repugnant Conclusion" (RC).
  2.  **Rejection of the RC Ranking:** Both parties agree that any adequate population axiology must reject the ranking wherein the "vast, low-welfare" world is deemed better than the "small, high-welfare" world. Avoiding this implication is a necessary condition for a plausible theory.
  3.  **Systematic Divergence of Total and Average Principles:** Both parties agree that Total and Average utilitarian principles diverge systematically under population scaling. Specifically, Total principles favor expansion when marginal welfare is positive, while Average principles favor contraction when marginal welfare is below the current average.
  4.  **Mathematics of Discontinuity:** Both parties agree on the mathematical fact that discontinuities (or non-differentiable kinks) in aggregation rules can produce threshold effects, where arbitrarily small changes in input welfare result in discrete changes in marginal value or moral status.
  5.  **Constraints of the Non-Identity Problem:** Both parties agree that the Non-Identity Problem constrains person-affecting justifications. Specifically, they agree that if an action affects *who* comes into existence, standard person-affecting principles (which require making specific existing people better off) cannot easily condemn the action without implying that non-existence is a comparable state for the subject. The parties disagree on the *implications* of this constraint (see Part II), but agree on its structural presence.

  ---

  ### Part II: Disagreements Table

  The following table isolates the substantive cruxes remaining between the CLT and RSAT positions. Where disagreements are verbal (terminological), they are noted in the "Shared Test" column. Where they are substantive (mathematical or deontic), predictions are recorded.

  | Crux | Critical-Level Totalist (CLT) Formulation | Range-Sensitive Anti-Totalist (RSAT) Formulation | Shared Test / Argument & Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. The Interpolation Crux**<br>*(Continuity of Marginal Value)* | **Discontinuity in Derivative Accepted.** The moral comparison between lives below and above $c$ involves a "kink" in the value function. While total value is continuous at $c$ under the $\max(0, w-c)$ definition, the *marginal contribution* jumps from 0 to 1. | **Strict Continuity Required.** Moral evaluation must be smooth. The marginal value of a life cannot jump abruptly based on a fixed threshold; it must transition continuously as welfare changes. | **Test:** Epsilon-Shift Scenario.<br>World A: One person at 100, one at $c - \epsilon$.<br>World B: One person at 100, one at $c + \epsilon$.<br>**CLT Prediction:** Value difference is $\epsilon$. Marginal rate of change is discontinuous at $\epsilon=0$.<br>**RSAT Prediction:** Value difference is $\approx f'(avg) \cdot 2\epsilon$. Marginal rate of change is continuous.<br>**Substantive Disagreement:** Whether a non-differentiable point in the value function is morally permissible. |
  | **2. The Density Crux**<br>*(Stability under Distribution)* | **Separability & Stability.** Population value is the sum of independent contributions. Shifting the distribution of welfare near $c$ yields a stable, computable sum insensitive to population size $N$ (except via count). | **Non-Separability & Sensitivity.** Population value depends on the *average* welfare. Shifting the distribution changes the average, which retroactively alters the weight of all lives. | **Test:** Large Stochastic Population.<br>$10^9$ lives with welfare drawn from $N(c, \sigma^2)$.<br>**CLT Prediction:** Value converges to $N \cdot E[\max(0, w-c)]$. Stable as $\sigma \to 0$.<br>**RSAT Prediction:** Value depends on $f(\bar{w}) \cdot N$. As distribution shifts, $\bar{w}$ shifts, changing the multiplier for *all* lives. Result is measure-sensitive to the aggregation order.<br>**Substantive Disagreement:** Whether the value of a life is independent of the welfare of others (Separability). |
  | **3. The Justification Crux**<br>*(Impersonal vs. Person-Affecting)* | **Impersonal Calculus Suffices.** Avoiding the RC requires modifying the impersonal sum (e.g., via $c$). The Non-Identity Problem is a constraint on *language*, not on the *axiology*. We can compare outcomes impersonally. | **Person-Affecting Constraint.** Avoiding the RC requires a person-affecting reason tied to each added life. An impersonal calculus modified by range-sensitivity is insufficient if it violates the NIP constraint that we must justify acts to specific subjects. | **Test:** The Non-Identity Policy Choice.<br>Policy X creates high-welfare people. Policy Y creates different, low-welfare (but positive) people.<br>**CLT Prediction:** Choose X based on higher impersonal sum. Y is permissible if sum > 0.<br>**RSAT Prediction:** Choice requires justification to the specific individuals created. Y may be impermissible even if impersonal sum is high, due to lack of person-affecting benefit relative to non-existence.<br>**Substantive Disagreement:** Whether axiological ranking determines deontic permissibility directly. |

  ---

  ### Part III: Analysis of Verbal vs. Substantive Disagreement

  The collaboration identified one significant area of verbal disagreement underlying the substantive conflicts:

  *   **Definition of "Value":** The CLT camp treats "value" as an impersonal metric of state goodness, separable from the agents within the state. The RSAT camp treats "value" as inherently tied to the *justifiability* of the state to the agents within it.
  *   **Resolution:** When "value" is defined strictly as the output of an aggregation function (mathematical value), the parties agree on the calculations but disagree on the *permissibility* of using that function for moral guidance. When "value" is defined as "all-things-considered moral worth," the disagreement is substantive. The parties agree to distinguish *Axiological Value* (ranking outcomes) from *Deontic Status* (permissibility of acts) in future correspondence to prevent equivocation.

