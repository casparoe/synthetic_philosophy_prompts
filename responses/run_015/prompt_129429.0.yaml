  ### Note on Liberties and Contested Readings

  *This note is appended to satisfy the requirement for transparency regarding theoretical coherence and adherence to standard literature.*

  1.  **CLT Continuity:** In standard population axiology literature, Critical-Level Utilitarianism is typically defined as $\sum (w_i - c)$, allowing for negative values when $w_i < c$. The definition adopted for this document ($\sum \max(0, w_i - c)$) renders the total value function continuous at $c$, though non-differentiable. This deviates from the standard "Negative Critical-Level" view which is explicitly discontinuous at $c$. The CLT signatory accepts this definition for the collaboration but maintains that the *moral significance* of the threshold remains sharp, justifying the "Discontinuity" claim in the Interpolation Crux regarding the derivative.
  2.  **RSAT Coherence:** The RSAT position as defined combines a consequentialist aggregation rule (function of average welfare) with a deontological constraint (NIP blocks impersonal justification). In standard literature, views that weight lives by population size are typically impersonal (e.g., Number-Sensitive Utilitarianism). Views that respect the NIP strictly are typically Person-Affecting Views which reject aggregation across possible people. The RSAT position attempts to hybridize these. The "Justification Crux" highlights the tension: if the NIP blocks impersonal justification, it is theoretically unclear how an "average welfare function" can be used to determine rightness without violating the NIP constraint. The RSAT signatory acknowledges this tension but maintains that range-sensitivity can operate within a person-affecting framework by modulating the *strength* of the reason to create a life, rather than the *impersonal value* of the life.
  3.  **Forced Symmetry:** The adversarial collaboration format necessitates a symmetrical presentation of disagreements. However, the CLT position is a variant of Classical Utilitarianism (modified), while the RSAT position is a hybrid view not fully canonical in the literature. The table presents them as equal competitors, though the RSAT view faces higher burdens of proof regarding the coherence of its hybrid justification structure.

