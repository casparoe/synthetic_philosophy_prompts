  **Consciousness Distribution Decision Tree**

  **Q1: Is consciousness a binary switch (on/off) or a dimmer (degrees)?**
  *   *Dimmer:* Go to Q2. (Typical Buddhist/Continuity view; splits here from Zoologist)
  *   *Binary:* Go to Q3. (Typical Zoologist/Threshold view)

  **Q2: Does a complexity measure (e.g., integrated information) entail experience as such (even in thermostats)?**
  *   *Yes:* **Panpsychist/IIT**. *Awkward commitment:* Your thermostat feels a tiny bit of warmth.
  *   *No:* **Deflationary**. *Awkward commitment:* Asking if a lobster suffers is like asking if a number is hungry.

  **Q3: Does it require specific neural machinery (e.g., vertebrate pallium) or is it multiply realizable?**
  *   *Specific Machinery:* **Neurobiological-Substrate**. *Awkward commitment:* Octopuses are philosophical zombies despite complex behavior.
  *   *Multiply Realizable:* Go to Q4.

  **Q4: Is metacognition or reportability essential, or can a creature suffer without knowing it suffers?**
  *   *Essential:* **Higher-Order Thought (HOT)**. *Awkward commitment:* Chimpanzees feel pain but human infants do not.
  *   *Not Essential:* **Global Workspace (GWT)**. *Awkward commitment:* Anesthetized humans lose consciousness entirely despite robust brain activity.

  **Unoccupied/Incoherent Combinations**
  *   *Binary + Specific Machinery + Metacognition Essential:* Unexplored/Unattractive. Substrate theorists usually focus on phenomenal feel, not thought. This view denies pain to animals with homologous nociceptors but no cortex, satisfying neither ethologists nor cognitivists.
  *   *Degrees + Specific Machinery:* Incoherent. If consciousness depends on specific substrate, it is typically threshold-based (binary), not gradual across substrates. A "degree" view usually implies functional continuity, not structural essentialism.

  **Indistinguishable Leaves (Flags)**
  *   **Neurobiological-Substrate vs. Conservative Degrees:** On crustaceans, these converge. If the "degree" threshold for pain requires a vertebrate nociceptor suite, both views deny crab pain. Distinguishing them requires testing vertebrates with degraded neural integration, not invertebrates.
  *   **HOT vs. GWT:** On bees and lobsters, both deny consciousness (no global access/metacognition). They only diverge on human marginal cases (sleep, infancy), making them empirically identical for your reading group's animal focus.

  **Ethological Test Cases Mapping**
  *   *Lobster/Fish:* Splits Neurobiological (No pain) from IIT/GWT (Possible pain). The boiling lobster debate hinges on Q3.
  *   *Bee:* Splits HOT (No meta) from GWT (Possible global access). Bee play behavior tests Q4.
  *   *Nematode:* Splits IIT (Non-zero Φ) from Substrate (No pain). The 300-neuron limit tests Q2.
  *   *Thermostat:* Splits IIT (Non-zero) from all others (Zero). The simulation case tests the hard line at Q2.

  **Note on Q1 Split:** This question isolates the Zoologist's bias (specific neural thresholds) from the Buddhist friend's bias (continuity of experience). If you answer "Binary," you commit to a sharp line somewhere between dog and rock. If "Dimmer," you must explain why the rock is zero and the dog is high, inviting the Panpsychist slide.
