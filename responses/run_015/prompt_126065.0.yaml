prompt: |-
  so a city council I'm advising is toying with the idea of running one real decision through a decision market instead of a normal vote, and they've asked me for a one-pager on what such a mechanism would have to get right before I'd sign off on it. I want the spec, not the pitch.

  The setup to write it against: the decision is whether to bring in congestion charging for the downtown core. The council picks a welfare metric up front (say some composite of median commute time, downtown air quality and small-business revenue, measured 18 months after launch). Traders buy and sell contracts that pay out conditional on the measure being adopted, and the market's recommendation is binding unless a supermajority overrides it. Real money, real losers, and it all has to survive an audit and a local newspaper.

  Give me the desiderata: what any mechanism like this has to deliver to count as good enough for that job — the cases it must get right, the distinctions it can't collapse, the results from social choice or market design it can't contradict — with the case or consideration behind each, and mark which are non-negotiable and which are just preferences of one camp.

  I already know I'm going to get "markets can be manipulated" and "the metric is gameable". Fine, put them on the list, but the bits I'm actually stuck on and want handled properly:

  - the adoption/do gap. What gets priced is how the metric looks in worlds where the policy is adopted, but what the council needs is what happens if it does the thing. Adoption is itself caused by stuff — lobbying, who's mayor, the state of the budget — that also causes the outcome, so a contract can trade high without the policy doing any of the work. Say what a design would have to add for the price to mean what the council wants it to mean, and whether that's even available with one city and no control.
  - abstention. What should the mechanism do when nobody shows up to trade, or the spread is wider than the decision is worth? A thing that always outputs a confident recommendation even on no information is worse than one that can shut up. I want a requirement about this.
  - metric drift. The metric is frozen before the debate, but the policy may change what residents care about, and the residents get a vote later.
  - the scoreboard problem. It's a one-off decision with a payout 18 months out, so we may never find out whether the market was actually well calibrated — which makes it hard to judge the mechanism itself. Is "you can tell after the fact whether it worked" a requirement, and what's the cheapest way to get it?
  - the people implementing the policy are also allowed to trade on it.

  Also: flag any pair of requirements you think can't be jointly satisfied (my hunch is that "legible enough for the public to trust it" pulls against "robust to adversarial traders", but you tell me), and tell me which single requirement does the most work in ruling out candidate designs. If it's quick, a small table scoring binding futarchy, an advisory-only market, and a citizens' assembly that just gets the prices as one input is fine — but the criteria are the part I care about, so keep the weight there.
reasoning: |-
  Here's a thinking process that leads to the suggested one-pager:

  1.  **Analyze the Request:**
      *   **Audience:** City Council (advised by the user).
      *   **Topic:** Using a Decision Market (Futarchy) for a specific policy decision (Congestion Charging).
      *   **Format:** One-pager (specification/desiderata, not a sales pitch).
      *   **Tone:** Technical, rigorous, skeptical, practical. "The spec, not the pitch."
      *   **Key Constraints/Setup:**
          *   Decision: Congestion charging (Yes/No).
          *   Metric: Composite (commute time, air quality, revenue) measured 18 months post-launch.
          *   Mechanism: Conditional contracts, binding result (unless supermajority override).
          *   Stakes: Real money, real losers.
          *   Scrutiny: Audit + Local Newspaper.
      *   **Specific Pain Points to Address:**
          *   Adoption/Do Gap (Selection Bias/Endogeneity).
          *   Abstention/Liquidity (When to shut up).
          *   Metric Drift (Goodhart's Law/Time Inconsistency).
          *   Scoreboard Problem (Verification/Calibration).
          *   Insider Trading (Implementers trading).
      *   **Additional Requirements:**
          *   Flag incompatible requirements.
          *   Identify the single most constraining requirement.
          *   Optional: Small comparison table (Binding Futarchy vs. Advisory vs. Citizens' Assembly).

  2.  **Deconstruct the Pain Points (The "Hard Bits"):**

      *   *Adoption/Do Gap:* This is the classic Hansonian Futarchy critique. $E[Metric | Policy=1]$ is not $E[Metric | Do(Policy=1)]$. If the market thinks the policy will only pass when times are good (selection bias), the price will be high even if the policy is useless.
          *   *Solution:* Needs a causal identification strategy. Randomization is impossible for city-wide policy. Instrumental variables? Unlikely. The spec must demand a design that isolates the *marginal causal effect*, not just correlation.
      *   *Abstention:* Markets need liquidity to be informative. Thin markets = noise or manipulation.
          *   *Solution:* A "No Decision" threshold based on spread/volume.
      *   *Metric Drift:* The metric is fixed now, but politics change. If the metric becomes unpopular, the council might renege.
          *   *Solution:* Pre-commitment mechanisms + legitimacy checks.
      *   *Scoreboard:* 18 months is a long time, and it's a one-off. How do we know the market wasn't just lucky or manipulated?
          *   *Solution:* Sub-markets or intermediate milestones.
      *   *Insider Trading:* Implementers know things traders don't.
          *   *Solution:* Strict disclosure or trading bans (but bans reduce information).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Causal Isolation (The Adoption Gap).* This is the big one. If the market prices correlation, it fails.
          *   *Status:* Non-negotiable.
          *   *Mechanism:* Needs a way to separate "Policy passes because it's popular" from "Policy passes and causes good outcomes." This is extremely hard without randomization. I need to be honest about this limitation.
      *   *Requirement 2: Liquidity/Confidence Thresholds (Abstention).*
          *   *Status:* Non-negotiable.
          *   *Mechanism:* Minimum volume, maximum spread. If not met, default to status quo or council vote.
      *   *Requirement 3: Metric Stability vs. Democratic Legitimacy (Drift).*
          *   *Status:* Tension/Negotiable.
          *   *Mechanism:* Metric must be immutable for the contract, but the council retains sovereign override (which they already have in the prompt).
      *   *Requirement 4: Verifiability (Scoreboard).*
          *   *Status:* Preference (Auditability).
          *   *Mechanism:* Intermediate oracle reports.
      *   *Requirement 5: Insider Constraints.*
          *   *Status:* Non-negotiable (Legal/Ethical).
          *   *Mechanism:* Disclosure or blackout periods.

  4.  **Identifying Incompatibilities:**
      *   *Causal Isolation vs. Feasibility:* You can't get true $P(Outcome | Do(Policy))$ without randomization or a strong instrument. A city-wide policy *is* the treatment. There is no control group. This is the fundamental flaw of single-instance futarchy.
      *   *Privacy/Insider Trading vs. Information Aggregation:* Banning insiders hides info. Allowing them looks like corruption.
      *   *Binding Nature vs. Democratic Sovereignty:* If the market says "Yes" but the public hates it, the council *must* be able to override, but if they override too often, the market loses credibility.

  5.  **Selecting the "Most Work" Requirement:**
      *   It has to be **Causal Isolation (The Adoption Gap)**. If the price reflects selection bias rather than treatment effect, the whole mechanism is garbage. It rules out standard prediction markets immediately.

  6.  **Developing the Comparison Table:**
      *   Need to score: Binding Futarchy, Advisory Market, Citizens' Assembly (with prices).
      *   Criteria: Causal Validity, Liquidity Risk, Democratic Legitimacy, Implementation Risk.

  7.  **Refining the Tone:**
      *   Avoid hype. Use terms like "Endogeneity," "Identification Strategy," "Liquidity Thresholds."
      *   Keep it tight. One-pager constraint means every word counts.

  8.  **Addressing the Specific "Adoption/Do" Prompt Requirement:**
      *   I need to explicitly state that without a control group or instrumental variable, this is technically impossible to solve perfectly. The spec must demand an *approximation* or acknowledge the risk. Actually, the prompt asks "what a design would have to add... and whether that's even available." I need to be honest: It's likely *not* available for a single city policy. I must flag this as a critical failure point.

  9.  **Final Review against Constraints:**
      *   One-pager style? (Will use concise headers/bullets).
      *   Spec not pitch? (Yes, focusing on requirements/failures).
      *   Address specific 5 pain points? (Yes).
      *   Flag incompatibilities? (Yes).
      *   Identify single most constraining requirement? (Yes).
      *   Comparison table? (Yes, kept small).

  10. **Drafting the Content (Mental or Scratchpad):**
      *   *Header:* Specification for Decision Market Mechanism.
      *   *Section 1:* Core Desiderata (The Must-Haves).
      *   *Section 2:* The Hard Problems (Addressing the user's specific stuck points).
      *   *Section 3:* Incompatibilities & Trade-offs.
      *   *Section 4:* The "One Thing" that kills designs.
      *   *Section 5:* Mechanism Comparison.

      *(Self-Correction during drafting)*: Make sure to emphasize the "Adoption Gap." In standard futarchy, $P(Metric | Policy)$ is priced. But if the policy only passes when the economy is booming, the metric looks good regardless of the policy. The market needs to price $P(Metric | Do(Policy))$. How? Usually, this requires a randomization or a specific contract structure (e.g., "Policy passes by <51% vote" vs ">51% vote"). But here the market *decides* the policy. This creates a feedback loop. I need to specify that the market must trade on *marginal* impact, perhaps by having contracts conditional on *implementation intensity* or similar, but realistically, for a binary city policy, this is the weak link. I will state that a valid identification strategy is non-negotiable, even if hard to find.

      *(Refining the "Abstention" point)*: The market needs a "No Confidence" output. If spread > X or Volume < Y, the mechanism returns "Null" and reverts to council vote.

      *(Refining "Insider Trading")*: Implementers trading is insider trading. It must be banned or strictly disclosed. Given the "local newspaper" constraint, bans are safer for public trust.

      *(Refining "Scoreboard")*: 18 months is too long for feedback. Need intermediate metrics (e.g., 6-month air quality check) to validate market movement, even if final payout is later.

      *(Final Polish)*: Ensure the distinction between Non-Negotiable (Safety/Validity) and Preference (Efficiency/Speed) is clear.

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # SPECIFICATION: DECISION MARKET MECHANISM FOR POLICY ADOPTION
  **Subject:** Congestion Charging Decision Mechanism
  **Status:** Draft Requirements for Sign-off
  **Constraint:** Binding outcome (subject to supermajority override); Real capital; 18-month horizon.

  ## 1. CORE DESIDERATA (NON-NEGOTIABLE)
  *These conditions must be met for the mechanism to be valid. Failure on any point voids the recommendation.*

  | Requirement | Specification | Rationale |
  | :--- | :--- | :--- |
  | **Causal Identification** | The market price must reflect $P(Outcome \mid Do(Policy))$, not $P(Outcome \mid Policy=Adopted)$. | **The Adoption/Do Gap.** If the policy is only adopted when exogenous conditions are favorable (e.g., strong budget, popular mayor), the market will price the *conditions*, not the *policy*. Without a control group or instrumental variable, standard conditional contracts measure selection bias, not treatment effect. |
  | **Liquidity/Confidence Threshold** | The mechanism must output "No Recommendation" if trading volume < $X or bid-ask spread > $Y. | **Abstention.** A thin market is noise or manipulation. If the market cannot aggregate sufficient capital to signal confidence, the default must revert to standard council vote. A confident wrong answer is worse than no answer. |
  | **Insider Containment** | City staff implementing the policy are barred from trading; Councilors must disclose positions. | **Corruption/Insider Trading.** Implementers have non-public information on rollout feasibility. Allowing trading creates perverse incentives to sabotage or accelerate implementation for profit. Public trust cannot survive the appearance of staff betting on failure. |
  | **Metric Immutability** | The welfare metric formula is locked in smart contract/legal statute prior to market launch. | **Metric Drift.** Prevents post-hoc redefinition of "success" to match the market outcome. If the metric can be changed, the contract is worthless. |

  ## 2. PREFERENCE PARAMETERS (NEGOTIABLE)
  *These improve utility but may be traded off against feasibility or public legibility.*

  *   **Intermediate Oracles (Scoreboard Problem):** Require metric reporting at 6-month intervals, not just 18 months.
      *   *Consideration:* Allows for calibration checks and early detection of manipulation. *Trade-off:* Increases administrative cost and risk of intermediate metric gaming.
  *   **Subsidized Liquidity:** Council provides initial market making capital.
      *   *Consideration:* Ensures market opens. *Trade-off:* Risks council being seen as "taking a side" or distorting price discovery.
  *   **Anonymity vs. Disclosure:** Traders are anonymous vs. public ledger.
      *   *Consideration:* Anonymity prevents retaliation; Disclosure aids auditability. *Preference:* Disclosure for large positions (>5% of pool) to satisfy newspaper scrutiny.

  ## 3. CRITICAL FAILURE MODES & INCOMPATIBILITIES

  **A. The Identification Impossibility (Non-Negotiable Conflict)**
  *   **Conflict:** *Causal Identification* vs. *Single-City Implementation.*
  *   **Analysis:** You cannot measure $Do(Policy)$ without a counterfactual. In a single city, you cannot randomize congestion charging.
  *   **Requirement:** The design must incorporate a **Regression Discontinuity** or **Instrumental Variable** into the contract structure (e.g., contracts payout based on policy adoption *margins* or external triggers), OR acknowledge that the market is pricing *correlation* and label it as such.
  *   **Verdict:** Without a synthetic control or randomized pilot zone, **Causal Identification is technically unavailable.** This is the primary veto point.

  **B. Legibility vs. Robustness**
  *   **Conflict:** *Public Trust* vs. *Adversarial Robustness.*
  *   **Analysis:** To be robust against manipulation, the market needs complex hedging instruments and sophisticated traders. To be legible to the newspaper/public, it must look simple.
  *   **Verdict:** Complex hedging looks like gambling to the public. Simple markets are easily manipulated. The design must prioritize **Legibility** (simple binary contracts) and accept higher manipulation risk, mitigated via **Insider Containment**.

  **C. Sovereignty vs. Commitment**
  *   **Conflict:** *Metric Immutability* vs. *Democratic Override.*
  *   **Analysis:** If the market binds the council, democracy is curtailed. If the council can override easily, the market is advisory only.
  *   **Verdict:** The "Supermajority Override" clause in your setup resolves this, but it creates a **Time-Inconsistency Problem**. Traders will discount the price by the probability of the council reneging. The market prices the *Council's Will*, not the *Policy's Effect*.

  ## 4. THE SINGLE CONSTRAINING REQUIREMENT
  **Causal Identification (The Adoption/Do Gap).**
  This requirement does the most work in ruling out candidate designs. Standard prediction markets (Hansonian Futarchy) fail this test in single-instance policy decisions because adoption is endogenous. If the market cannot distinguish between "Policy causes Good Outcome" and "Good Times cause Policy and Good Outcome," the mechanism is scientifically invalid. **No design should be signed off without a credible strategy to isolate the marginal causal effect.**

  ## 5. MECHANISM COMPARISON

  | Feature | **Binding Futarchy** (Current Proposal) | **Advisory Market** (Prices as Input) | **Citizens' Assembly** (Deliberative + Prices) |
  | :--- | :--- | :--- | :--- |
  | **Causal Validity** | **FAIL** (Unless synthetic control exists) | **N/A** (Input only) | **HIGH** (Expert testimony can address causality) |
  | **Liquidity Risk** | **HIGH** (Must be thick to bind) | **LOW** (Thin markets ignored) | **N/A** |
  | **Democratic Legitimacy** | **LOW** (Rule by traders) | **MED** (Rule by council w/ info) | **HIGH** (Rule by representative sample) |
  | **Manipulation Surface** | **HIGH** (Financial incentive to lie) | **MED** (Incentive to persuade) | **LOW** (No financial payout) |
  | **Auditability** | **HIGH** (On-chain/Financial trail) | **HIGH** | **MED** (Deliberation records) |

  ## 6. RECOMMENDATION FOR SIGN-OFF
  Do not sign off on a **Binding** mechanism for a single-instance city policy without a randomized pilot component to solve the **Adoption/Do Gap**.

  **Minimum Viable Spec:**
  1.  **Reclassify as Advisory:** Market prices inform the Council; Council retains full vote.
  2.  **Add "No-Trade" Clause:** If volume < $50k or spread > 10%, report is void.
  3.  **Ban Implementer Trading:** Strict blackout for city staff.
  4.  **Intermediate Metrics:** 6-month air quality/traffic data released to validate market trajectory.

  *If binding is insisted upon, the contract must be conditioned on an exogenous variable (e.g., "Policy adopted IF state grant approved") to approximate randomization. Without this, the mechanism prices politics, not policy.*
