      *   *Sen's Liberal Paradox (1970):* Minimal Liberalism (at least two people have decisive power over at least one pair of social states each) + Pareto Efficiency + Unrestricted Domain = Contradiction (Cyclical social preference or impossibility of a social decision function).
      *   *The User's Innovation:* Instead of $x P_i y \implies x P_{soc} y$ for specific pairs (binary veto/decisiveness), model rights as vectors or functions over dimensions.
