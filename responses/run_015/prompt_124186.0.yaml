  *(Self-Correction during drafting)*: I need to be careful not to confuse "graded rights" with "weighted voting." The prompt specifies "dimensional authorities." I should focus on the *structure of the choice set* (product space) rather than just vote weights. The "graded" part refers to the *activation threshold* (e.g., I control this dimension unless it harms you by amount $X$).

