prompt: |-
  After years of renting, my partner and I purchased our first house last spring on a quiet, tree-lined block that we chose partly for its stability and sense of community. I have now been asked to take a side in a dispute that will affect that block directly, and I would be grateful for help thinking through what I owe to others.

  A developer has proposed demolishing two detached houses at the corner to build a four-storey apartment building with 38 small units, six of them reserved for households earning below the median income. Several longtime neighbours are organizing to block the project at the upcoming planning board hearing. They argue that they invested their savings and years of upkeep on the understanding that the street would remain as it is, that the new building would bring added traffic, loss of light, and strain on the local elementary school, and that people who have built their lives here should have the decisive say over changes to their immediate surroundings.

  Others in the broader district, including some renters and a tenants association, argue that rents across the city have risen sharply, that people who work nearby can no longer afford to live here, and that blocking modest infill in well-served neighbourhoods like ours pushes new housing to the outskirts and entrenches an unfair distribution of access to jobs, transit, and good schools.

  As a recent buyer who both benefits from the character of the street and struggled to afford entry into it, I feel pulled in both directions. Should I join the opposition, support the project, or abstain? How should I weigh the interests of current residents against those of people who might live here in the future, and what, if anything, determines who is entitled to decide how this block evolves?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User Profile:** Recent first-time homebuyer (purchased last spring), partnered, values stability and community, struggled to afford entry (empathetic to affordability issues), lives on a quiet, tree-lined block.
      *   **The Conflict:** A developer wants to replace two detached houses with a 4-storey, 38-unit apartment building (6 affordable units).
      *   **The Opposition (Neighbors):** Longtime residents. Arguments: Property value/stability expectations, traffic, light, school strain, "right" of current residents to decide.
      *   **The Proponents (Broader District/Renters):** Arguments: Housing crisis, affordability, access to jobs/transit/schools, preventing urban sprawl, equity.
      *   **The User's Dilemma:** Torn between protecting their new investment/neighborhood character (which they bought into) and supporting broader housing affordability/access (which they personally struggled with).
      *   **The Core Question:** What do they owe to others? Should they oppose, support, or abstain? How to weigh current vs. future residents? Who decides?

  2.  **Deconstruct the Ethical Dimensions:**
      *   **Self-Interest vs. Common Good:** The user benefits from scarcity (higher property values due to low supply) but suffered from it (struggled to buy).
      *   **Localism vs. Regionalism:** Do neighbors own the "character" of a block, or is housing a regional necessity?
      *   **Expectations vs. Reality:** Neighbors bought expecting stability. Zoning laws change. Cities evolve.
      *   **Procedural Justice:** Who gets a vote? Only those currently living there? Or those affected by the housing market?
      *   **Impact Assessment:** Is the impact (traffic, light) significant enough to warrant blocking, or manageable?

  3.  **Evaluate the Arguments:**
      *   *Opposition:* "Investment expectation" is strong emotionally but legally/ethically shaky (zoning isn't a permanent contract). Traffic/Schools are valid practical concerns but often exaggerated in NIMBY arguments. "Decisive say" is the most contentious point (exclusionary).
      *   *Proponents:* Affordability crisis is real. Exclusionary zoning contributes to inequality. 6 affordable units is a start but maybe not enough. 38 units vs. 2 houses is a significant density increase.
      *   *The User's Position:* They are the "bridge" demographic. They understand the desire for stability *and* the pain of exclusion.

  4.  **Develop a Framework for Decision Making:**
      *   Avoid telling the user *what* to vote, but rather *how* to think about it.
      *   Acknowledge the validity of their conflicting feelings.
      *   Break down the "Obligations" (to self, neighbors, city, strangers).
      *   Address the "Who Decides" question directly.
      *   Suggest a middle path or nuanced approach (conditional support?).

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the difficulty. This is a classic "YIMBY vs. NIMBY" tension personalized. Acknowledge their unique position (recent buyer + struggled to afford).
      *   **Analyzing the Claims:**
          *   *The Neighbors' Claim:* Stability is valuable, but "freezing" a neighborhood is impossible. Distinguish between *nuisance* (traffic/light) and *exclusion* (keeping people out).
          *   *The Proponents' Claim:* Housing is a human need. Exclusion has moral costs.
          *   *The User's Stake:* You bought a home, not a veto right over the city.
      *   **Ethical Frameworks:**
          *   *Contractual:* Did the city promise single-family forever? (Usually no).
          *   *Utilitarian:* Greatest good. 38 families housed vs. 2 houses lost + neighbor inconvenience.
          *   *Rights-based:* Do neighbors have a right to exclude? Do renters have a right to access?
      *   **The "Who Decides" Question:** This is crucial. It's not just neighbors vs. outsiders. It's a democratic planning process. Neighbors have *input*, not *veto*.
      *   **Practical Considerations (The "Third Way"):**
          *   Is the design good?
          *   Are the mitigations (traffic, shadow) adequate?
          *   Is 6/38 affordable enough?
          *   Can you support *density* but ask for *better design*?
      *   **Conclusion:** Summarize the moral weight. Encourage engagement rather than abstention.

  6.  **Refining the Tone:**
      *   Needs to be empathetic, not preachy.
      *   Avoid jargon (NIMBY/YIMBY) unless explained gently.
      *   Focus on "civic duty" and "community definition."
      *   *Self-Correction during drafting:* I need to make sure I don't dismiss the neighbors' concerns about traffic and schools entirely. Those are legitimate quality-of-life issues, even if used as cover for exclusionism. I should advise the user to distinguish between valid mitigation and outright opposition.

  7.  **Final Polish:** Check against the prompt's specific questions ("What do I owe?", "How weigh interests?", "Who decides?"). Ensure all are answered. (The resulting structure looks good: Validate -> Analyze Obligations -> The Question of Control -> A Path Forward).

  8.  *(Self-Correction on "Abstain"):* Abstaining is a choice, but ethically, silence often defaults to the status quo (blocking). I should point out that abstaining isn't neutral.

  9.  *(Final thought on the "Affordable Units"):* 6 out of 38 is roughly 15%. That's "modest." I should mention that supporting the project doesn't mean loving every detail of it.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  This is one of the most defining ethical dilemmas of modern urban life. You are standing at the intersection of private investment, community identity, and social justice. It is understandable that you feel torn; your position is unique because you embody both sides of the argument. You are a homeowner who values stability (aligning with the neighbors), but you are also a recent entrant to the market who felt the pain of scarcity (aligning with the proponents).

  There is no single "correct" vote, but there is a rigorous way to think through what you owe to the various stakeholders. Here is a framework to help you navigate the obligations, the question of control, and a potential path forward.

  ### 1. What do you owe to whom?

  To make this decision, it helps to separate your obligations into three categories: to yourself, to your immediate neighbors, and to the broader community.

  **To Yourself and Your Partner**
  You purchased a home in part for its character. You have a legitimate interest in protecting your quality of life, your financial investment, and your peace of mind. You do not owe the city martyrdom. If the building would genuinely make your home unlivable (e.g., blocking all light, creating dangerous traffic), you have a right to object. However, you must ask yourself: *Is my objection based on livability, or on a change in character?* If it is the latter, you must weigh whether your desire for a static streetscape outweighs the region's need for housing.

  **To Your Immediate Neighbors**
  You owe your neighbors respect and solidarity, but you do not owe them unanimity. The argument that they "invested... on the understanding that the street would remain as it is" is emotionally powerful but legally and ethically fragile. Zoning codes are not permanent contracts; they are municipal laws subject to change as city needs evolve. While you should listen to their concerns about traffic and schools, you are not obligated to adopt their conclusion that the project must be blocked.

  **To the Broader Community (including future residents)**
  This is the side that is often absent from the hearing room. You owe a degree of civic responsibility to the region that allowed you to succeed. You struggled to afford entry; that struggle was caused by a shortage of homes like the one being proposed. By opposing similar housing when you were a renter, others contributed to the high prices you paid. There is a moral reciprocity here: if you benefit from the appreciation of your home, do you have an obligation to ensure the ladder isn't pulled up behind you?

  ### 2. How to weigh current vs. future interests

  The core tension is between the **concentrated costs** borne by current neighbors (traffic, shadow, construction noise) and the **diffuse benefits** borne by future residents (housing security, access to schools/jobs).

  *   **The "Not In My Backyard" Trap:** It is easy to oppose a project when the costs are visible (a shadow on your lawn) and the benefits are abstract (a family getting a home three towns over). Ethical reasoning requires you to make the benefits concrete. The 38 units represent 38 households. The 6 affordable units represent families who might otherwise be displaced or face crushing commutes.
  *   **The "Property Rights" Fallacy:** Neighbors often feel they own the *view* or the *context* of their property. In reality, they own the land within their lot lines. They do not own the air rights of the corner lot, nor do they own the "character" of the public streetscape.
  *   **The Harm of Exclusion:** When established neighborhoods block density, the demand doesn't vanish; it moves to the outskirts. This entrenches segregation, increases carbon emissions through longer commutes, and denies lower-income workers access to high-opportunity areas (like the school your neighbors are worried about straining).

  ### 3. Who is entitled to decide?

  You asked what determines who gets to decide how the block evolves. This is the crux of the procedural ethics.

  *   **Neighbors do not have a veto.** In a democracy, land use is decided by elected representatives and planning boards based on the comprehensive good of the city, not the unanimous consent of the immediate block.
  *   **Input vs. Control.** Current residents have a right to *input* regarding mitigation (e.g., "Please ensure the driveway doesn't block sightlines," or "Please plant trees to screen the building"). They do not have a right to *control* the outcome to preserve a specific aesthetic or economic exclusivity.
  *   **The "Community" Definition.** The neighbors define "community" as those currently living on the block. The proponents define "community" as everyone in the city who needs a place to live. A healthy civic ethic usually requires the broader definition. If only current residents could decide, no new infrastructure (even schools or fire stations) could ever be built, as no one wants them next door.

  ### 4. A Path Forward: Conditional Support

  You do not have to choose between being a "bad neighbor" and a "housing activist." There is a middle ground that acknowledges your dual identity.

  **Consider supporting the project while advocating for mitigation.**
  You can attend the hearing and state that you support the density and the principle of the project, given the housing crisis, but that you expect the developer to address specific local concerns.
  *   **Support:** Acknowledge the need for housing and the appropriateness of a 4-storey building near transit/services.
  *   **Mitigate:** Ask for concrete commitments on traffic management, construction hours, shadow studies, and perhaps an increase in the affordable housing percentage if possible.

  **Why abstention is not neutral.**
  If you choose to abstain because the decision is "too hard," understand that silence usually aids the opposition. Planning boards often interpret low turnout or lack of support from immediate neighbors as tacit opposition. If you believe the project is net-positive for the city, your voice matters precisely because you are a resident who *could* oppose it but choose not to.

  ### Summary Recommendation

  Given that you struggled to afford your own home, you know firsthand that the "stability" of the current neighborhood is built on a scarcity that excludes others.

  1.  **Do not join the opposition** in their goal to block the project entirely. Blocking modest infill in well-served neighborhoods contributes to the very affordability crisis you survived.
  2.  **Do not abstain.** Your perspective as a recent buyer is valuable. It bridges the gap between the longtime owners and the external renters.
  3.  **Support the project with conditions.** Go to the hearing. Acknowledge your neighbors' fears as valid feelings, but explain that freezing the neighborhood is not a viable solution. State that you support the development as a necessary evolution of the city, provided the developer meets reasonable standards for traffic and design mitigation.

  This approach honors your investment in the street without demanding that the rest of the city pay the price for your stability. It acknowledges that a "community" is not a fortress, but a living system that must make room for new members.
