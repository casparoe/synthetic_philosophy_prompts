answer: |-
  This is a fantastic objection, and your roommate has essentially reconstructed a classic *reductio ad absurdum* against the Knowledge Argument. They are arguing that if you accept Jackson's conclusion about Mary, you end up with an ontology cluttered with infinite "quiddities" (Vegemite-ness, ukulele-ness, sneeze-ness), which makes physicalism untenable not just for consciousness, but for *everything*.

  Since you want to keep the intuition that Mary genuinely learns something (ruling out the "Ability Hypothesis," which says she only gains skills, not knowledge), the best place to intervene is **Step (3) to Step (4)**.

  You should reject the inference that **because she learns a new truth, she has discovered a new non-physical fact about the world.**

  Here is the strategy, how it stops the Vegemite explosion, and what it costs you.

  ### The Move: The Phenomenal Concept Strategy (PCS)

  This is the most sophisticated physicalist defense available (championed by philosophers like David Papineau, Brian Loar, and Janet Levin). It draws a distinction between **ontology** (what exists in the world) and **epistemology** (how we think about what exists).

  **The Argument:**
  1.  **Facts vs. Modes of Presentation:** There is only one fact in Mary's brain when she sees red: a specific physical neural state. However, there are two *ways* to conceive of that fact.
      *   **Physical Concept:** "The firing of long-wave cone receptors and V4 neural activity."
      *   **Phenomenal Concept:** "This experience of redness."
  2.  **The Learning:** When Mary leaves the room, she doesn't learn a new *fact about the world*; she acquires a new *concept* for a fact she already knew physically. She learns that *Physical State P* is identical to *Phenomenal Experience E*.
  3.  **The Result:** She learns a new *proposition* (a new truth she can express), but that proposition is made true by an old *physical fact*.

  **Why this blocks your roommate:**
  Your roommate argues in Step (7) that "physics misses almost everything." The PCS replies: **Physics doesn't miss properties; it just doesn't catalog every subjective way of accessing those properties.**

  Physics describes the objective structure of the world. It does not (and need not) describe every subjective "mode of presentation" a conscious being can have toward that structure.

  ### Stopping the Vegemite Explosion (Steps 5–7)

  Your roommate's worry is that if seeing red generates a non-physical fact, then tasting Vegemite must also generate one, leading to millions of spooky facts.

  Under the Phenomenal Concept Strategy, you can concede that there are millions of *phenomenal concepts* (Vegemite-concepts, ukulele-concepts) without admitting there are millions of *non-physical properties*.

  *   **Roommate:** "So there are millions of facts physics misses!"
  *   **You:** "No. There is one physical property (the chemical interaction of Vegemite on the tongue). But there are many ways to *know* that property. Physics captures the property; it doesn't need to capture the subjective 'file folder' I use to store that knowledge."

  This allows you to say Mary learns something genuine (a new conceptual connection) without committing to a universe filled with non-physical "experience particles."

  ### The Cost: What do you give up?

  Rejecting the move from (3) to (4) via the Phenomenal Concept Strategy is not free. Here is the price tag:

  **1. You must accept "Conceptual Dualism."**
  You have to argue that phenomenal concepts (thinking about experience from the inside) are fundamentally different from physical concepts (thinking about experience from the outside) in a way that no other concepts are.
  *   *The Cost:* Some critics argue this is dualism in disguise. If the concepts are *so* different that one can know all physical facts and still be surprised by the phenomenal fact, haven't you just smuggled non-physicality back in through the back door? You have to walk a tightrope: the concepts must be distinct enough to explain Mary's surprise, but not so distinct that they imply distinct properties.

  **2. You lose the "Hard Problem" punch.**
  If Mary's new knowledge is just a new conceptual grip on a physical state, then the "explanatory gap" is merely a gap in our concepts, not in the world.
  *   *The Cost:* You have to accept that the feeling of "what it is like" is not a deep metaphysical mystery, but a feature of how human brains categorize information. For some, this feels like it explains away the magic of consciousness rather than explaining it.

  **3. It's technically demanding.**
  In a philosophy class context, this is a heavier lift than simply saying "She learns an ability." You have to defend the distinction between *propositions* (truths) and *facts* (truth-makers). Your roommate might press you: "If the proposition is new, in what sense is the fact old?" You need to be ready with the "Morning Star / Evening Star" analogy (both refer to Venus; knowing they are the same is new knowledge, but doesn't create a new planet).

  ### Summary for your discussion

  If you want to keep the intuition that Mary learns something but avoid the Vegemite absurdity, tell your roommate:

  > "I reject Step (4). Mary learns a new **truth**, but not a new **ontological fact**. She acquires a new *phenomenal concept* for a physical state she already knew about. This stops the Vegemite explosion because physics describes the *properties* of Vegemite and red light, not the infinite subjective *ways of thinking* about those properties. Physicalism claims all *properties* are physical, not that physics lists every possible perspective on those properties."

  This preserves the seriousness of physicalism while honoring the intuition that walking out of the room changes Mary's epistemic state.
