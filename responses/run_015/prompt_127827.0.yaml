      *   **Subject:** An invented borderline case: A distributed, self-modifying software protocol (global servers, replication with mutation, energy regulation, evolution) *without* a physical membrane or spatially continuous body.
      *   **Constraint 1:** No standard textbook examples (no viruses, no mules, no fire).
      *   **Constraint 2:** Punchline must depend on the specific definitional tension (spatial discreteness/inside-outside vs. functional processes).
