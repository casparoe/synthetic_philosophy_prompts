  **News Peg**
  Following recent scandals involving corporate indifference, a leaked internal document from Axiom Crisis Solutions reveals how firms are monetizing the "Knobe Effect." The memo outlines strategies for "attribution management," turning experimental philosophy findings into billable hours for clients seeking to manipulate public perception of intent.

  ***

  **CONFIDENTIAL // CLIENT GUIDANCE MEMO 44-B**
  **TO:** Regional Account Directors
  **FROM:** Strategy & Epistemology Division
  **SUBJECT:** Deployment of Attribution Management Protocols

  **1.0 Purpose and Theoretical Basis**
  This memo outlines the operational rollout of Attribution Management™. Our competitive advantage relies on the side-effect effect. In the foundational experimental condition, a chairman approves a program he knows will affect the environment. He states he does not care about the environment either way. When asked whether he brought the change about intentionally, most respondents say yes when the change is a harm and no when the very same change, produced by the very same indifference, is a benefit.

  Our analysis indicates that moral valence drives intentionality ascriptions. Since we cannot alter the client's primary aim (profit maximization), and the side-effect effect demonstrates that actual mental states are less influential than outcome valence, our lever is the description of the outcome. We manage descriptions rather than conduct.

  **2.0 Case Study: Omega Corp**
  Consider Client Omega.
  **2.1 The Harm Trap:** Omega launches a cost-cutting initiative foreseeing environmental degradation. Internal memos confirm indifference. Public perception surveys indicate 82% of stakeholders believe Omega *intentionally* harmed the environment. Foresight by itself convicts the client regardless of how the client's goals are described.
  **2.2 The Help Deficit:** Omega launches a profit-driven initiative foreseeing community enrichment. Internal memos confirm indifference. Public perception surveys indicate 15% of stakeholders believe Omega *intentionally* helped the community. Even if the client genuinely aimed at a good outcome, if the transaction structure mirrors the side-effect condition, the client cannot get credit for it. Credit for a good side effect appears to require visible evidence of aiming.

  **3.0 Competitive Landscape**
  Syntagma Partners argues the asymmetry is a fact about what people are doing when they answer a question about a norm-violating agent rather than a fact about the concept of intentionality at all. Their product works on the wording of the accusation instead of on the valence of the outcome. We rebut this by noting that Syntagma's interventions fail when the outcome valence is overwhelming. However, we concede the one thing that is actually true of that position: that minute changes in how the question is framed move the numbers. Therefore, all client communications must undergo A/B testing on interrogative syntax.

  **4.0 Flagship Product: Legibility Rituals**
  To overcome the Help Deficit, clients must purchase Performative Aim Verification. These are costly public rituals whose sole function is to make an aim legible. For example, the CEO must publicly forego profit to achieve the side effect before resuming standard operations. Note that the ritual now routinely costs more than the harm it was commissioned to offset. This cost disparity is a feature, not a bug; it signals that the aim was not merely a side effect.

  **5.0 Fee Schedule**
  Retainers are structured according to experimental design parameters:
  *   **Tier 1 (Harm Condition):** Premium rate. High liability exposure.
  *   **Tier 2 (Help Condition):** Standard rate. Low attribution yield.
  *   **Tier 3 (Neutral Control):** Consultation only. No valence guarantee.

  **6.0 Compliance**
  Please ensure all client deliverables avoid claiming that Axiom Crisis Solutions acts with purpose. This memo was not generated with intentional agency. Any resemblance to strategic planning is a causal byproduct of market forces.

  **[END OF DOCUMENT]**
