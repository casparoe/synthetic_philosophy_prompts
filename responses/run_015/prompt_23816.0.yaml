answer: |-
  Your intuition is spot-on. Your friend has given you the "elevator pitch" version of the Condorcet Jury Theorem (CJT), which captures the spirit but glosses over the fragile assumptions that make it work in the real world. In academic terms, they have conflated the *mathematical limit* with *practical application*.

  Here is a claim-by-claim breakdown of what holds up, what is simplified, and what is logically flawed.

  ### Claim 1: "If you get enough voters who are each even a little better than a coin flip, the majority verdict becomes basically guaranteed to be right as the group grows."

  *   **Verdict:** **Fairly Accurate (Mathematically).**
  *   **The Math:** This is the core of the theorem. If every voter has a probability $p$ of choosing the correct option, and $p > 0.5$, then as the number of voters ($n$) approaches infinity, the probability that the majority chooses correctly approaches 1 (100%).
  *   **The Nuance:** The phrase "basically guaranteed" relies on the group being *very* large. If $p$ is only 0.51 (just barely better than a coin flip), you need a massive group to get high reliability. If the group is small (like 12 people), the improvement over a single voter is modest, not a "guarantee."

  ### Claim 2: "That's the actual math behind 'wisdom of crowds'..."

  *   **Verdict:** **Sloppy Simplification.**
  *   **Why:** While related, they are distinct concepts.
      *   **Condorcet** deals with **binary choices** (Guilty/Not Guilty, True/False) where there is an objective ground truth.
      *   **Wisdom of Crowds** (popularized by James Surowiecki) often deals with **continuous estimates** (e.g., guessing the weight of an ox). The math there relies on errors canceling out around a mean (the Law of Large Numbers), whereas Condorcet relies on a threshold majority in a binary vote.
  *   **The Leap:** Conflating the two suggests Condorcet applies to any group estimation, but it strictly applies to binary truth-seeking.

  ### Claim 3: "...it's why we should trust a 12-person jury's verdict over a single expert's..."

  *   **Verdict:** **Does Not Follow (Logical Leap).**
  *   **Why:** The theorem compares the *group* to the *truth*, not the *group* to an *expert*.
  *   **The Problem:** The theorem only guarantees the group beats a coin flip. It does not guarantee the group beats a high-competence individual.
      *   **Scenario:** Imagine a single expert with 95% competence ($p=0.95$). Now imagine a jury of 12 people who are only 55% competent ($p=0.55$).
      *   **Result:** The expert is still more reliable than the jury. For the jury to beat the expert, the jury needs to be much larger, or the individual jurors need to be more competent.
      *   **Small Sample Size:** 12 is statistically small. The "asymptotic guarantee" (where the group becomes infallible) requires $n \to \infty$. At $n=12$, the "wisdom" boost is real but not overwhelming enough to automatically trump a genuine expert.

  ### Claim 4: "...and it's why bigger juries and bigger electorates are always more reliable than smaller ones."

  *   **Verdict:** **False (The "Always" is the killer).**
  *   **Why:** This only holds true if individual competence ($p$) stays constant or increases as you add people.
  *   **The Dilution Effect:** In reality, competence is not uniform. The first 1,000 voters in an electorate might be highly informed ($p=0.7$). The next 1,000,000 might be largely uninformed ($p=0.5$ or lower). If adding more voters lowers the *average* competence below 0.5, the larger group becomes **less** reliable than the smaller one.
  *   **The $p < 0.5$ Trap:** If the average voter is systematically misinformed ($p < 0.5$), the theorem proves the opposite: a larger group makes it *more* likely you will get the wrong answer. (Mathematically, if $p < 0.5$, you should flip the majority vote to find the truth; as $n$ grows, the majority becomes confidently wrong).

  ---

  ### The "Silent Killers": Conditions Your Friend Skipped

  The reason your intuition flagged this as oversold is that the CJT relies on assumptions that are almost never met in real politics or law.

  #### 1. The Independence Assumption (The Big One)
  The theorem mathematically requires that voters decide **independently**.
  *   **The Math:** Voter A's error must not be correlated with Voter B's error.
  *   **The Reality:** Voters watch the same news, listen to the same leaders, and share the same cultural biases. If there is a systemic bias (e.g., a misleading media campaign), errors become correlated. If 51% of people are misled by the same lie, they all vote wrong together. The "errors" do not cancel out; they compound.
  *   **Impact:** Once correlation enters the system, the "guarantee" of correctness evaporates. You can have a million voters, but if they all got their info from the same biased source, it's effectively like having one voter.

  #### 2. The "Objective Truth" Assumption
  The theorem assumes there is a **correct answer** to find.
  *   **Juries:** Did the defendant commit the crime? (Yes/No). This fits CJT reasonably well.
  *   **Elections:** Which candidate is "correct"? This is a category error. Elections are usually about aggregating *preferences*, not discovering *facts*. There is no objective "truth" about whether a tax cut is good; there are only winners and losers. CJT applies to *epistemic* democracy (finding truth), not *preferential* democracy (satisfying wants).

  #### 3. Constant Competence
  The theorem assumes every voter has the same $p$.
  *   **The Reality:** Competence varies wildly. The theorem can be adjusted for varying competence, but the result is that the "weighted majority" of the highly competent should rule. If you treat a highly informed voter the same as an uninformed one (one person, one vote), you are mathematically diluting the signal, potentially violating the spirit of the theorem's efficiency.

  ### Summary: How to Push Back

  If you want to challenge your friend gently, here is the takeaway:

  1.  **On Juries vs. Experts:** "The theorem says a large group of *moderately* competent people beats a coin flip, not that they beat a *highly* competent expert. Unless the jurors are reasonably informed, the expert might still have better odds."
  2.  **On Bigger is Better:** "That only works if adding more people doesn't lower the average competence. If the new voters are less informed than the old ones, the larger group can actually be less reliable."
  3.  **On Independence:** "The math breaks if people influence each other. If everyone is biased by the same news source, they aren't independent voters, they're one giant correlated error."

  **The Bottom Line:** Your friend described the **theoretical potential** of the theorem, but ignored the **practical constraints**. The Condorcet Jury Theorem is a beautiful proof about how independence and slight competence *can* aggregate to truth, but it is not a blanket endorsement of "more voters = better results" in the messy real world.
