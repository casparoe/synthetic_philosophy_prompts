prompt: |-
  So a friend of mine who's way into election forecasting explained the Condorcet Jury Theorem to me like this: "Condorcet proved that on a yes/no question, if you get enough voters who are each even a little better than a coin flip, the majority verdict becomes basically guaranteed to be right as the group grows. That's the actual math behind 'wisdom of crowds,' it's why we should trust a 12-person jury's verdict over a single expert's, and it's why bigger juries and bigger electorates are always more reliable then smaller ones." Something about this feels like it's overselling the result but I can't pin down where exactly. Can you go through it claim by claim and tell me what's a fair statement of what the theorem actually says, what's a sloppy-but-common simplification, and what just doesn't follow -- especially the bit about trusting a jury over an expert and bigger always being more reliable? Also curious if there's some important condition the summary is quietly skipping over.
