answer: |-
  Here is the Standard Operating Procedure (SOP) you requested. It is designed to be run on a single episode in under 20 minutes using only your available inputs (Log, Video, Map, Spec). It operationalizes Dennett's stances via compression heuristics and filters the output through safety/liability constraints.

  ### Part 1: The Episode Analysis Procedure (SOP)

  **Inputs:** Episode Log (trajectory/state), Episode Video, Ward Map, Vendor Spec.
  **Time Budget:** 15–20 minutes.

  #### Step 1: Establish the Physical Baseline (2 mins)
  *   **Action:** Describe the episode in physical terms only (coordinates, timestamps, velocity).
  *   **Question:** "What is the raw data cost of describing this trajectory?"
  *   **Sufficient Answer:** A list of deviations from the optimal path on the Ward Map. (e.g., "Deviated 4m left at Corridor B, 14:03").
  *   **Stop Condition:** If the log and video disagree on basic position/time, flag as **Data Corruption**. Do not proceed. Escalate to IT/ Vendor.

  #### Step 2: The Design Stance Test (5 mins)
  *   **Action:** Query the Vendor Spec for rules matching the Baseline deviations.
  *   **Question:** "Does the Spec contain a rule, timeout, or constraint that necessitates this behavior?"
  *   **Sufficient Answer:**
      *   **YES:** Cite the specific spec section (e.g., "Section 4.2: Door Timeout").
      *   **NO:** Mark as "Unspecified Behavior."
  *   **Compression Check:** Does citing the Spec rule explain the *entirety* of the deviation shorter than listing the coordinates? (Usually yes).

  #### Step 3: The Intentional Stance Test (5 mins)
  *   **Action:** Formulate a belief/desire attribution that predicts the behavior.
  *   **Question:** "If I assume the robot believes *P* and wants *G*, does this predict the trajectory better or more simply than the Spec?"
  *   **Sufficient Answer:** A sentence of the form "The robot avoided *X* to achieve *Y*."
  *   **Compression Check:** Does this sentence predict behavior in *other* contexts not in the log? (e.g., If it "avoids glare," does it avoid bright lights at night?)
      *   If yes: High compression.
      *   If no (only explains this one instance): Low compression. Treat as Post-Hoc Rationalization.

  #### Step 4: The "Log vs. Thing" Filter (5 mins)
  *   **Action:** Cross-reference Video (physical reality) against Log (system reality).
  *   **Question:** "Did the physical motion change *at the exact timestamp* the log records the state change?"
  *   **Sufficient Answer:**
      *   **Synced:** Video shows stop, Log shows `STATE_STOP`. Pattern is in the **Thing** (Control Loop).
      *   **Desynced:** Video shows smooth motion, Log shows `STATE_STOP` or jitter. Pattern is in the **Log** (Sampler/Artifact).
  *   **Hard Rule:** If Desynced, **do not attribute behavior to the robot.** Attribute to "Logging Artifact."

  #### Step 5: Stance Selection & Tie-Break (3 mins)
  *   **Condition:** Both Design and Intentional stances pass the Compression Check (Steps 2 & 3) and the Log/Thing Filter (Step 4).
  *   **Tie-Break Rule:** **Design Stance Overrides Intentional Stance.**
  *   **Reasoning:** For a Safety Committee, "Constraint" (Design) is actionable and limits liability. "Goal" (Intentional) implies agency and adaptability, increasing liability.
  *   **Exception:** If Design is "Unspecified" (Step 2 = NO) and Intentional prediction is robust across multiple past episodes, you may use Intentional language *only if* qualified as "Observed Regularity" (see Step 6).

  #### Step 6: Final Wording & Escalation
  *   **Action:** Draft the report sentence.
  *   **Decision Matrix:**
      *   **Design Match:** Use Spec language (e.g., "Timeout triggered").
      *   **Unspecified + Intentional Compresses:** Use "Observed Regularity" language (e.g., "System consistently diverted during high-light conditions"). **Do not use mental verbs (want, avoid, know).**
      *   **One-Off / No Compression:** Label "Anomaly."
  *   **Escalation Point:** If you must use "Observed Regularity" for an Unspecified behavior, **Supervisor must sign off.** This is a value judgment on liability, not a fact check.

  ---

  ### Part 2: Application to Last Month's Episodes

  Here is the procedure run on your three specific cases.

  #### Episode 1: The Glare Avoidance
  *   **Step 1 (Baseline):** Robot deviates from shortest path at Corridor B between 14:00–16:00.
  *   **Step 2 (Design):** Spec check. No glare sensor listed. No cost-map adjustment for luminosity in published spec. **Result: Unspecified.**
  *   **Step 3 (Intentional):** "Robot avoids glare to maintain sensor fidelity." Compresses the data well (predicts deviation based on sun position).
  *   **Step 4 (Log/Thing):** Video confirms robot physically turns. Log confirms path planning change. Synced. Pattern is in the **Thing**.
  *   **Step 5 (Tie-Break):** Design failed. Intentional passes compression.
  *   **Step 6 (Wording):** You cannot say "It avoids glare." This implies a capability not in the spec, creating a warranty/liability gap.
  *   **Report Output:** "System trajectory correlated with afternoon sunlight exposure in Corridor B. Cause unspecified in vendor documentation."
  *   **Escalation:** **Send to Supervisor.** This indicates emergent behavior or undocumented spec. Safety Committee needs to know the *correlation*, not the *intent*.

  #### Episode 2: The Doorway Hesitation
  *   **Step 1 (Baseline):** Robot stops for 3s at Door 4.
  *   **Step 2 (Design):** Spec check. Section 3.1: "Fixed 3s timeout at unverified doorways." **Result: Match.**
  *   **Step 3 (Intentional):** "Robot hesitates to check for obstacles." Compresses well.
  *   **Step 4 (Log/Thing):** Video and Log synced. Pattern in **Thing**.
  *   **Step 5 (Tie-Break):** Design wins. "Hesitates" implies a decision process; "Timeout" implies a fixed constraint.
  *   **Report Output:** "Robot executed standard 3s doorway timeout protocol."
  *   **Note:** Do not use "hesitates." It suggests the robot *might* have chosen otherwise. The timeout suggests it *could not* proceed sooner. This is crucial for safety analysis.

  #### Episode 3: The Nurse Follow
  *   **Step 1 (Baseline):** Robot waits at Station A, moves through Door 5 immediately after door open event.
  *   **Step 2 (Design):** Spec check. Likely says "Wait for door state: OPEN." Does not say "Wait for Nurse."
  *   **Step 3 (Intentional):** "Waits for nurse to open door." Compresses well temporally.
  *   **Step 4 (Log/Thing):** Video shows nurse swiping. Log shows `DOOR_STATE: OPEN`. Robot moves on `DOOR_STATE`, not `NURSE_DETECTED`.
  *   **Step 5 (Tie-Break):** Design wins. The robot is coupled to the *door*, not the *nurse*. The nurse is an environmental variable, not a system input.
  *   **Report Output:** "Robot waited for door state change to OPEN. Door actuation coincided with nurse presence."
  *   **Verdict:** I am taking "it waits for a nurse" away from you.
  *   **To Earn It:** You would need to prove the robot detects the *nurse* specifically, not just the door. You would need log data showing `PERSON_DETECTED` triggering the move, independent of the door sensor. Without that, "Waiting for nurse" is a narrative you are imposing, not a pattern the robot is executing.

  ---

  ### Part 3: Limitations & Misfires (Honesty Check)

  You asked where this procedure misfires. Here are the known failure modes:

  **1. The "Black Box" Design Stance Failure**
  *   **Problem:** The Vendor Spec is often outdated or incomplete. The Design Stance test relies on the Spec being truth.
  *   **Misfire:** The procedure will force you to label actual design behavior as "Unspecified/Observed Regularity" because the documentation is lagging.
  *   **Consequence:** You report "correlation" when there is actually "causation." This is safer for liability, but scientifically less precise.
  *   **Mitigation:** Log these discrepancies. If "Observed Regularity" hits 5 episodes, it becomes a De Facto Spec. Escalate to Supervisor to update the "Mental Model" of the fleet.

  **2. The Timescale Mismatch**
  *   **Problem:** Compression requires repetition. A pattern that emerges over 6 months (e.g., battery degradation causing slower turns) will fail the weekly Compression Check.
  *   **Misfire:** The procedure classifies long-term drift as "Anomaly" or "Noise" every week until it becomes catastrophic.
  *   **Consequence:** You miss slow variables.
  *   **Mitigation:** This procedure is for *Weekly Safety Reports*, not *Fleet Health*. You need a separate monthly aggregation script that looks for trends in the "Anomaly" bucket.

  **3. The Intervention Problem**
  *   **Problem:** The Intentional Stance is often better for *predicting* the robot, but the Design Stance is required for *fixing* it.
  *   **Misfire:** You report "Robot avoids crowded areas" (Intentional). A nurse tries to "guide" the robot by standing in a specific spot. The robot actually just has a LiDAR occlusion limit (Design).
  *   **Consequence:** The committee forms a mental model of the robot that allows them to be overconfident in their ability to influence it.
  *   **Mitigation:** Strict adherence to the Tie-Break Rule (Design > Intentional). Never sacrifice fixability for readability.

  **4. The One-Off Compression Paradox**
  *   **Problem:** Dennett's compression test fails on single instances. You cannot compress a sample size of one.
  *   **Misfire:** A critical safety failure happens once. The procedure forces you to label it "Anomaly" rather than "Goal Conflict."
  *   **Consequence:** Under-reporting severity.
  *   **Mitigation:** Hard rule: Any episode involving physical contact or emergency stop bypasses the Compression Check. It is automatically escalated as "Critical Incident" regardless of stance.

  ### Summary of Rules for Your Report
  1.  **No Mental Verbs:** (Want, try, avoid, know, decide). Use System Verbs: (Execute, timeout, trigger, correlate, wait-for-state).
  2.  **Design > Intentional:** If the Spec explains it, use the Spec. Even if the Intentional story is nicer.
  3.  **Video > Log:** If they disagree, the Log is lying. Report the Video.
  4.  **Supervisor for Liability:** If you have to describe an "Observed Regularity" that isn't in the Spec, your Supervisor signs it. That is a liability decision, not a technical one.

  Run this checklist. It will slow your writing down, but it will stop the arguments with your supervisor and keep the Safety Committee from attributing agency where there is only code.
