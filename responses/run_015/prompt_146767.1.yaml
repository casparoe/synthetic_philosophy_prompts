prompt: |-
  Hey — I'm a PhD student in robotics (HRI-ish) and I've somehow become the person in our lab who writes the weekly behaviour report on our fleet of hospital delivery robots. It's about 12-15 logged episodes a week, roughly 15-20 minutes each, and the report goes to the hospital's clinical safety committee: smart people, not technical at all, and they will definately read a sentence like "the robot wanted to avoid the glare" as a claim about the robot's mental life, or worse, about who's liable. Right now I write whatever comes out fastest, which is usually intentional-stance soup, and my supervisor and I keep having the same argument about it.

  So: I want a procedure, not a discussion. Something I can actually run on a logged episode, in order.

  The stuff I'm trying to operationalise is Dennett's three stances — physical, design, intentional — together with the idea that a pattern is real when adopting a stance buys you compression: a description of the behaviour that beats the raw frame-by-frame description. That's the bit I want turned into a checklist, and I want the simplifications to be honest about which distinctions they're dropping.

  One wrinkle I keep tripping over and that I want the procedure to handle explicitly: as I understand it the compression test is a test on the data. Which means a pattern that lives in my logging pipeline rather than in the robot still counts as real by that test — the sampler generates it. I need a step that separates pattern-in-the-log from pattern-in-the-thing, and I don't know how to do it without opening the box, which I can't: vendor-supplied, black box, no internals, and I can't just re-run the episode either, these are one-offs in a live corridor.

  What I need from you:

  - The questions to ask about an episode, in order, doable in ~15-20 min with no access to internals.
  - What counts as a sufficient answer to each one. What I usually have is: the log, a video, the ward map, and the planner's published spec.
  - Where the procedure stops with a no — i.e. hard rule, do not use intentional vocabulary here.
  - Where it hands the decision to a person because the question is one of values rather than facts, and which person, given that the committee is the audience and my supervisor signs off before it goes out.
  - What to do when I can't get anything resembling a compression number: one-off episode, no baseline, no repetition to speak of.

  Then run it on three episodes from last month:

  1. A robot takes a reliably longer route that avoids a stretch of corridor with afternoon sun glare. Everyone on the team says "it avoids the glare." There's no glare sensor and nothing about glare in the cost map as far as the spec shows; the route just correlates with time of day.
  2. A robot "hesitates" for about 3 seconds at one particular doorway, roughly 60% of the time, before going through. We found a fixed 3-second planner timeout in the spec. It feels like the design stance should kill the intentional story here, but the intentional story is by far the fastest thing for me to write and by far the easiest thing for the committee to read.
  3. A robot waits near the nurses' station until a nurse swipes, then follows behind them through a door it can't open on its own, at the two times of day when nurses are actually moving. I love describing this as "it waits for a nurse," and I suspect your procedure is going to take it away from me. If it does, say so straight. If it doesn't, tell me what I'd have to go check in order to earn it.

  Two more things. First: sometimes two stances compress the same episode about equally well and give conflicting write-ups. I need a tie-break rule, and I'd rather it be explicit than be left to my mood on a friday afternoon. Second: be honest about where this procedure misfires. My guesses are cases where the intentional stance predicts beautifully but is useless or actively misleading when you want to intervene on or fix the system, and timescale problems — patterns that only show up over months or over days. Say clearly what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** PhD student in robotics (HRI), responsible for weekly behavior reports on hospital delivery robots.
      *   **Audience:** Hospital Clinical Safety Committee (smart, non-technical, liable-focused, prone to anthropomorphizing).
      *   **Problem:** Current reports use "intentional-stance soup" (e.g., "robot wanted to avoid glare"), causing friction with supervisors and potential liability/safety misunderstandings.
      *   **Goal:** A concrete, step-by-step *procedure* (checklist) to analyze logged episodes (12-15/week, 15-20 mins each) based on Dennett's three stances (Physical, Design, Intentional) and the "compression as reality" criterion.
      *   **Constraints:**
          *   No access to internals (black box, vendor-supplied).
          *   No re-running episodes (live environment).
          *   Must handle the "pattern-in-the-log vs. pattern-in-the-thing" problem (sampling bias).
          *   Time limit: ~15-20 mins per episode analysis.
          *   Inputs available: Log, Video, Ward Map, Planner Spec.
          *   Must handle tie-breaks between stances.
          *   Must identify limitations/failure modes of the procedure.
      *   **Specific Test Cases:** Three specific episodes (Glare avoidance, Doorway hesitation, Nurse following).
      *   **Tone:** Professional, precise, operational, honest about limitations. No fluff.

  2.  **Deconstruct the Theoretical Framework:**

      *   **Dennett's Stances:**
          *   *Physical:* Laws of physics, hardware states (voltage, friction). Too detailed for this context.
          *   *Design:* Function, code, specs, algorithms. "It did X because it was programmed to do X."
          *   *Intentional:* Beliefs, desires, goals. "It did X because it wanted Y."
      *   **Compression Criterion:** A pattern is "real" if describing it via a stance yields a shorter description than raw data *and* predicts future behavior.
      *   **The "Log vs. Thing" Problem:** If the logging system introduces artifacts (e.g., sampling rate aliasing), the pattern exists in the log, not the robot. Since we can't open the box, we need a proxy test for this.
      *   **Liability/Safety Context:** Intentional language implies agency and potentially liability. Design language implies engineering constraints. Safety committees care about *predictability* and *failure modes*, not mental states.

  3.  **Drafting the Procedure (The "Algorithm"):**

      *   *Step 1: Raw Description (Baseline).* Need a baseline to measure compression against.
      *   *Step 2: Design Stance Check.* Can the spec explain it? This is the safest and most accurate for black boxes.
      *   *Step 3: Intentional Stance Check.* Does attributing a goal compress the description *better* than Design?
      *   *Step 4: Log Artifact Check.* Is the pattern in the sensor/logging or the world? (Crucial constraint).
      *   *Step 5: Tie-Break & Liability Filter.* If both compress, which one do we write? (Safety > Brevity).
      *   *Step 6: Escalation.* When to ask the supervisor.

      *Refining Step 4 (Log vs. Thing):* Since I can't open the box, I must look for *independence*. If the pattern correlates perfectly with a known logging frequency or a known environmental artifact (like sunlight hitting a specific sensor *input* vs. the robot's *decision*), how to distinguish?
      *Correction:* The prompt says "pattern that lives in my logging pipeline rather than in the robot still counts as real by that test — the sampler generates it. I need a step that separates pattern-in-the-log from pattern-in-the-thing."
      *Solution:* Cross-reference independent data sources (Video vs. Log). If Video shows smooth motion but Log shows jitter, it's a log artifact. If both show the hesitation, it's likely in the thing (or the control loop).

      *Refining the "Compression" Metric:* I can't calculate bits. I need a heuristic. "Does this explanation cover *all* instances of this behavior in the log, or just this one?" "Is the explanation shorter than listing the coordinates?"

  4.  **Developing the Tie-Break Rule:**

      *   Context: Safety Committee.
      *   Rule: **Design Stance overrides Intentional Stance for Safety Reports.**
      *   Reason: Intentional stance implies adaptability/agency. Design stance implies constraints/fixed logic. For safety, knowing the constraint is more actionable than knowing the "goal."
      *   Exception: If Design stance is unknown (black box) and Intentional is the *only* predictive model, use Intentional *but* flag it as "Observed Regularity" not "Intent."

  5.  **Addressing the "One-Off" Problem:**

      *   Compression requires repetition. If it's a one-off, you can't compress.
      *   Procedure: Label as "Anomaly" or "Single Instance." Do not generalize. Do not use intentional vocabulary for single instances unless it's a standard fallback behavior (e.g., "Emergency Stop").

  6.  **Running the Test Cases:**

      *   *Case 1 (Glare):* No sensor in spec. Correlates with time.
          *   Design: Fail (not in spec).
          *   Intentional: Compresses ("Avoids glare").
          *   Log/Thing: Video confirms sun position?
          *   Verdict: Dangerous. Implies capability not in spec. Use "Correlated Avoidance."
      *   *Case 2 (Hesitation):* 3s timeout in spec.
          *   Design: Pass (Spec match).
          *   Intentional: Pass ("Hesitates").
          *   Tie-break: Design wins. "Hesitates" implies decision; "Timeout" implies constraint.
      *   *Case 3 (Nurse Follow):* Waits for swipe.
          *   Design: Spec likely says "Wait for door open."
          *   Intentional: "Waits for nurse."
          *   Nuance: Does it detect the *nurse* or the *door state*?
          *   Verdict: If it tracks door state, "Waits for door" is Design. "Waits for nurse" is Intentional. Design is safer.

  7.  **Addressing Limitations (Misfires):**

      *   Timescale: Weekly report misses monthly drift.
      *   Intervention: Intentional stance tells you *what* it did, Design tells you *why* (and how to fix).
      *   Black Box: We are inferring Design from Spec, which might be outdated.

  8.  **Structuring the Output:**

      *   **Part 1: The Procedure (SOP).** Numbered steps, inputs, decision criteria.
      *   **Part 2: The Tie-Break & Escalation Rules.** Explicit logic.
      *   **Part 3: Application to Episodes.** Running the SOP on the three cases.
      *   **Part 4: Limitations & Misfires.** Honest assessment of where this fails.

  9.  **Refining the Tone:**

      *   The user is a PhD student. They know Dennett. Don't over-explain the philosophy. Focus on the *operationalization*.
      *   Be direct. "Do not use intentional vocabulary here."
      *   Acknowledge the liability risk.

  10. **Self-Correction/Review during drafting:**
      *   *Critique:* Is the "Log vs. Thing" step feasible without internals?
      *   *Fix:* Rely on the Video vs. Log timestamp comparison. If the video shows continuous motion but the log shows a stop, it's a logging artifact. If both show a stop, it's system behavior.
      *   *Critique:* Is "Compression" measurable?
      *   *Fix:* Define it heuristically. "Can you predict the next 5 minutes of trajectory using this rule?"
      *   *Critique:* The user wants to know *who* decides values.
      *   *Fix:* Explicitly state: Supervisor decides liability language; Committee receives factual constraints.

  11. **Final Polish:** Check against all constraints in the prompt. (15-20 min, no internals, specific episodes, tie-break, limitations). *Ensure the distinction between "Pattern is real" (Dennett) and "Pattern is safe to report" (Liability) is clear.* The prompt asks for the procedure to determine *reporting language*, not just ontological status.

      *Wait, one nuance:* The prompt asks for a procedure to operationalize Dennett's stances + compression. But the *goal* is the report. So the procedure must filter the ontological conclusion through the safety constraint.
      *Key Insight:* A pattern can be "real" (Intentional stance compresses) but "misleading" (Design stance is safer). The procedure must distinguish *Reality* from *Reporting Permission*.

      *Revised Plan:*
      1.  Determine Reality (Which stance compresses?).
      2.  Determine Artifact (Log vs. Thing).
      3.  Determine Reporting Language (Safety/Liability filter).

      Let's build the checklist.

      *Step 1: Baseline.* Raw description.
      *Step 2: Design Check.* Spec match?
      *Step 3: Intentional Check.* Goal attribution prediction?
      *Step 4: Artifact Check.* Video/Log sync.
      *Step 5: Selection.* Design > Intentional for safety.
      *Step 6: Uncertainty Flag.*

      Okay, ready to write.

      *Wait, one more thing:* The user mentioned "pattern-in-the-log rather than in the robot still counts as real by that test — the sampler generates it. I need a step that separates pattern-in-the-log from pattern-in-the-thing."
      *Dennett's view:* If the pattern is in the data stream the system interacts with, it's real *for the system*. But for the *Safety Committee*, they need to know if the robot *sensed* it or if the *log* just recorded it that way.
      *Actually,* if the pattern is *only* in the log (e.g., aliasing), the robot didn't act on it. If the robot acted on it, it's in the thing.
      *Test:* Does the behavior (trajectory change) align with the pattern? If the log says "glare detected" but the robot drove straight through, the pattern is in the log, not the control loop. If the robot diverted, the pattern is in the control loop (Thing).
      *Refinement:* Compare Log Event vs. Physical Trajectory.

