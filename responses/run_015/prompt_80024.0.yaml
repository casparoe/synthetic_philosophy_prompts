prompt: |-
  I'm in a seminar on the philosophy of death and value and I've been trying to pin down where I actually stand on what makes human extinction bad, so before I commit to a position in front of everyone I'd like a consistency check. I was talking it through with a friend who's a utilitarian and he kept telling me I was incoherent but I couldn't pin down what he was getting at. Here's roughly where I've landed: (1) I think Scheffler's afterlife conjecture is basically right — what makes the end of the species bad is the loss of the continuation of human life, activity, and culture, rather than just the aggregate of experiences each individual would have gone on to have. (2) But I'm also a subjectivist about value: I don't think there's such a thing as a badness that isn't bad for some particular being who is or could be affected, value has to be for someone. (3) I'm a presentist about time, so I take it that future people don't yet exist and the only things that really exist right now are present ones. (4) I'm confident human extinction would be a genuine moral catastrophe, not just a proxy for a bunch of individual deaths. (5) And I've been chewing on a weird case: suppose everyone died tomorrow, completely content, but right before that they'd uploaded the whole of human culture to a self-sustaining archive — AIs that keep writing, composing, and building on the tradition for millions of years, with no human or any other experiencing being around to percieve any of it. I think that case is way less bad than extinction, maybe not bad at all, since the cultural achievement is still there even if nobody's home to take it in.

  Can you audit whether these actually hang together? I'm genuinly not sure where the trouble is, so please don't just flag everything as bad — tell me which pairs are genuinely in tension versus which only look like they are, rank the real tensions by severity, and for each one say what would actually have to give. Then tell me which single revision would clean up the most. Act like a professional philosopher who's thought hard about the metaphysics of value and the philosophy of death, and before you give your verdict, walk through your reasoning out loud (a little brainstorming is fine) so I can see where you're coming from.
