      *   Explain why/limitations? Yes.

      *Self-Correction on "Absent-Minded Driver" specifics:* The AMD problem specifically highlights that *planning* optimal behavior differs from *acting* optimally at the node if you update beliefs. But since the system cannot distinguish, it must pre-commit. The core mathematical result is that if the number of steps is known ($N$) and states are indistinguishable, the optimal strategy is often a mixed strategy (probability $p$ of continuing) unless $N=1$ or utilities are trivial. However, in engineering, we often approximate "indistinguishable" with "no counter". If we can't count, we must use probability.
      *Wait, if I can't count, how do I know when I reached the end?* The prompt says "runtime cannot reliably distinguish from one another". It implies the system doesn't know if it's at checkpoint 1, 2, or $N$. But presumably, there is an external signal when work is *done*? No, "passing the final transform step corrupts the output". This implies there is a "final step" but the system doesn't know it's there until it's too late.
      *Actually, the AMD analogy implies you don't know *which* intersection you are at. You know there are intersections. You know there is a destination. But you can't count them.*
      *If the system cannot distinguish checkpoint $k$ from $j$, it cannot know "This is the last one".*
      *So the decision is: At *any* checkpoint, do I Commit or Continue?*
      *If I Commit at any checkpoint before the real end -> Early Commit (Work wasted/locked).*
      *If I Continue at the real end -> Success (if I commit immediately after? No, the choice is AT the checkpoint).*
      *Let's clarify the mapping:*
      *   Checkpoint = Decision point.
      *   Action = Commit (Exit) or Continue (Drive).
      *   If Action = Commit at Step $i < N$: Early Commit.
      *   If Action = Commit at Step $i = N$: Success.
      *   If Action = Continue at Step $i = N$: Pass the end -> Catastrophe.
      *   If Action = Continue at Step $i < N$: Go to next checkpoint.
      *   Since states are indistinguishable, Policy = Probability $p$ of Continuing at *every* checkpoint.
      *   Probability of Success = $(1-p) \times p^{N-1}$ (Continue $N-1$ times, then Commit at $N$).
      *   Probability of Early Commit = Sum of committing at $1..N-1$.
      *   Probability of Catastrophe = $p^N$ (Continue all $N$ times).
      *   This math is solid for the procedure.

      *Wait, one nuance:* In AMD, the driver wants to exit at the 2nd of 2. Here, we want to Commit at the $N$-th of $N$.
      *   Utility Function: $E[U] = P(\text{Success}) \cdot U_{success} + P(\text{Early}) \cdot U_{early} + P(\text{Late}) \cdot U_{late}$.
      *   $P(\text{Success}) = (1-p)p^{N-1}$.
      *   $P(\text{Late}) = p^N$.
      *   $P(\text{Early}) = 1 - p^{N-1}$. (Committing at any step $1$ to $N-1$).
      *   Wait, if I commit at step 1, I stop. If I continue, I go to step 2.
      *   Yes. $P(\text{Reach Step } k) = p^{k-1}$.
      *   $P(\text{Commit at } k) = p^{k-1} \cdot (1-p)$.
      *   Sum for $k=1$ to $N-1$ is Early.
      *   Commit at $N$ is Success.
      *   Continue at $N$ is Late.
      *   Okay, the math holds.

      *Let's finalize the "Dislike" case.*
      *   Case A (Payment): $U_{late}$ is massive negative. To minimize $p^N \cdot |U_{late}|$, $p$ must be very small.
      *   If $p$ is small, $P(\text{Success}) = (1-p)p^{N-1}$ becomes tiny.
      *   Result: The procedure recommends "Commit Immediately" ($p \approx 0$) to avoid Catastrophe.
      *   Team Dislike: This means transactions never complete (always Early Commit). Throughput dies.
      *   Why: The procedure prioritizes avoiding infinite/negative utility over achieving positive utility when indistinguishability prevents safe navigation.
      *   Limitation: The procedure assumes utilities are commensurable. It cannot solve the "we must do business vs. we must not lose money" conflict if the risk makes EU negative.

      *Wait, I need to make sure I don't add preamble.*
      *   Start directly with "1. Question...".

      *Checklist for "Honesty about judgment calls":*
      *   Explicitly state in the procedure text that assigning numbers is a judgment call.
      *   Explicitly state that "bounded loss" is a value judgment.

