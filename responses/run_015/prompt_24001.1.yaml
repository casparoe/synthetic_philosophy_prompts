      *   **Problem:** Setting a "commit or keep going" policy at indistinguishable checkpoints (similar to the Absent-Minded Driver problem). The system can't tell checkpoint $k$ from $j$, so it needs a pre-fixed strategy (probabilistic or deterministic) rather than reasoning fresh.
      *   **Goal:** A decision procedure grounded in the decision-theory structure of the Absent-Minded Driver problem.
      *   **Format:** Sequence of questions to ask, in order.
