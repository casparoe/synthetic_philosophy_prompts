prompt: |-
  I'm a software engineer on a team that builds long-running transaction systems, and I keep having to set the "commit or keep going" policy at a series of checkpoints that the runtime cannot reliably distinguish from one another: retries after crashes and identical log lines mean the system genuinely cannot tell checkpoint k from checkpoint j, so it has to act on a policy it fixed in advance rather than reason fresh at each checkpoint. At each checkpoint the system chooses between committing the work so far (locking it in and forfeiting the rollback option) and continuing (preserving the rollback option, but risking that it passes the last point at which rollback is still possible, which is a large, unrecoverable loss). I want a decision procedure my team can actually run to set this policy, grounded in the decision-theory structure of the absent-minded driver problem — the driver who cannot remember which forks he has already passed and so must fix his strategy in advance.

  Give me the procedure as a sequence of questions to ask, in order, with what counts as a sufficient answer to each; the point where the procedure stops and returns a default; and the point where it must hand the decision to a human because the question is one of values rather than facts. Be honest about which steps are judgment calls dressed up as procedure. Then run the procedure on two concrete cases from our stack: (A) a payment saga in which passing the final settlement step makes the transfer irreversible and the loss is large, and (B) a batch ETL job in which passing the final transform step corrupts the output but the loss is moderate and re-running from scratch is cheap. For at least one of the two the procedure should land on a policy the team will not like; say why it lands there and what the procedure cannot do for us.

  Begin your response with the procedure itself, no preface, no restating of the question, and no preamble.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
