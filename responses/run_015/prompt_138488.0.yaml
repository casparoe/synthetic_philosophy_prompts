answer: |-
  Based on the five precedents you have provided, I can reconstruct the epistemological algorithm your supervisor is applying. Here is the prediction for your case, the rule she is running, the competing rules that create ambiguity, and a test case to resolve them.

  ### 1. The Verdict on Arshat
  She will rule the Arshat migration as **"Not history but with a recoverable historical kernel."**

  She will argue that the **event** (the migration and destruction) is historically recoverable, but the **account** (the chronicle) is not history because the narrative mechanism is mythic. She will treat the *sky-fire* exactly as she treats the *Wooden Horse* or the *gods on the field*: as an ideological wrapper around a material reality. The archaeological and genetic evidence secures the "kernel" (the movement and destruction), but the miraculous causation prevents the *tradition itself* from being classified as "History."

  ### 2. The Rule She Is Running
  Her classification system is not based solely on **evidentiary weight** (how much proof we have) but on **narrative naturalism** (how the source explains the event).

  **The Rule of Causal Agency:**
  *   **History:** The event is corroborated (by contemporary text or archaeology), *and* the source attributes the outcome to natural or political agency (even if biased).
      *   *Kadesh:* Ramesses claims divine *favour*, but the battle is fought by men.
      *   *Vinland:* The sagas claim men sailed and built; archaeology confirms men sailed and built.
  *   **Kernel:** The event is corroborated by archaeology, *but* the source attributes the cause or key mechanism to supernatural or impossible agency.
      *   *Troy:* The war/destruction is real, but the *Iliad* attributes victory to gods and a wooden construct that defies military logic.
      *   *Arshat:* The migration/destruction is real (DNA/Pottery), but the chronicle attributes the *cause* to a miraculous sky-fire.
  *   **Legend:** The event is *not* corroborated by archaeology or contemporary records where such traces should exist.
      *   *Exodus:* No trace of population in Sinai.
      *   *Arthur:* Contemporary silence where a hero of that scale should appear.

  **Why Arshat fits "Kernel":**
  Your case is stronger archaeologically than Vinland (aDNA and pottery horizons are more robust than sod houses). However, it shares the *narrative flaw* of Troy. In Vinland, the text says "We went there." In Arshat, the text says "The Sky told us to go." Your supervisor distinguishes between a late source reporting a human action (Vinland) and a late source reporting a divine command (Troy/Arshat).

  ### 3. Alternative Rules (and where they diverge)
  To write a robust chapter, you need to show that her ruling is a choice, not an inevitability. Here are two other rules that fit her five precedents equally well but would yield a different result for Arshat.

  **Alternative Rule A: The Threshold of Material Corroboration**
  *   *Logic:* If archaeology confirms the specific event described (site, date, movement), the classification is "History," regardless of the narrative's supernatural elements. The supernatural is treated as rhetorical flavor (like Ramesses' divine favour).
  *   *Fit:* Explains Vinland (Late + Arch = History) and Kadesh (Biased + Contemporary = History). Explains Exodus/Arthur (No Arch = Legend). Explains Troy (Arch confirms city, but *not* the specific 10-year siege or horse, hence Kernel).
  *   *Divergence:* Under this rule, Arshat is **History**. The aDNA and pottery confirm the *migration* specifically, not just the city's existence. The "sky-fire" is dismissed as metaphor, just as Ramesses' "divine favour" is.
  *   *Why she likely rejects this:* She ruled Troy as Kernel despite the city's existence. She requires the *narrative mechanism* to be plausible for "History" status.

  **Alternative Rule B: The Contemporaneity of the Source**
  *   *Logic:* "History" requires a contemporary or near-contemporary written record. Late sources can only ever be "Kernel" or "Legend," regardless of archaeological support.
  *   *Fit:* Explains Kadesh (Contemporary = History). Explains Troy, Arthur, Exodus (Late = Kernel/Legend).
  *   *Divergence:* This rule **breaks on Vinland**. Vinland is 200 years late but ruled "History." Therefore, she is *not* running this rule. She allows late texts to be History if the archaeology is specific enough *and* the narrative is naturalistic.

  ### 4. The Test Case
  To distinguish between **The Rule of Causal Agency** (her likely rule) and **The Threshold of Material Corroboration** (Alternative A), you need a case that isolates the *supernatural cause* from the *archaeological strength*.

  **Constructed Case: "The Ghost-Ship Settlement"**
  > A saga written 200 years after the fact describes a group settling an island. The text says they were guided there by a ghost ship that glowed in the fog. Archaeology reveals a settlement on that island, dated precisely to the saga's window, with material culture matching the settlers' homeland. No contemporary records exist.

  *   **If she rules History:** She prioritizes **Material Corroboration**. The archaeology overrides the miraculous cause (just as Ramesses' bias was overridden). Your Arshat case should then be argued as History.
  *   **If she rules Kernel:** She prioritizes **Causal Agency**. The miraculous explanation demotes the account, even if the event is proven. Your Arshat case must be framed as Kernel.

  **Real-World Parallel:**
  You might look at how historians treat the **Christianization of Scandinavia**.
  *   *Source:* Late sagas/chronicles claiming miracles (statues bleeding, holy lights).
  *   *Arch:* Church sites, grave goods shifts, isotope data showing dietary change (fasting).
  *   *Verdict:* Usually "Kernel." The conversion happened (Arch), but the miraculous narratives are hagiography, not history. This supports the prediction that Arshat is Kernel.

  ### 5. Is the Middle Verdict Doing Genuine Work?
  Yes. It is performing a crucial epistemological function: **decoupling ontology from ideology.**

  *   **Legend (Nothing):** Denies the ontology. (The Exodus didn't happen).
  *   **History:** Accepts the ontology and the ideological framing as broadly functional. (Kadesh happened, and Ramesses' account is a usable record of it).
  *   **Kernel:** Accepts the ontology but rejects the ideological framing. (The War happened, but the *Iliad's* explanation is false).

  In your chapter, you can argue that the "Kernel" category is where **historical materialism** meets **source criticism**. It allows the historian to say: "The people moved (material reality), but they did not move because of the fire (ideological reality)."

  If she collapsed "Kernel" into "History," she would be forced to accept the sky-fire as a historical claim (which she won't). If she collapsed it into "Legend," she would be forced to deny the migration happened (which the DNA forbids). The middle category is the only space that accommodates **proven events with mythic explanations.**

  ### Summary for your Section
  *   **Predicted Verdict:** Kernel.
  *   **Governing Principle:** Narrative Naturalism (History requires naturalistic causation in the source, even if late).
  *   **Critical Tension:** Vinland (Late + Natural = History) vs. Troy (Late/Oral + Mythic = Kernel). Arshat aligns with Troy.
  *   **Chapter Argument:** Use Arshat to demonstrate that "Historicity" is not a binary of True/False, but a triad of **Event/Explanation/Evidence**. The "Kernel" category protects the Event from being discarded just because the Explanation is mythic.
