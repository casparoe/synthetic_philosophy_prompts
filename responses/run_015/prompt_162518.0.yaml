answer: |-
  ### Preliminary Framing Exercise

  Before settling into the analysis, I need to map the logical space. The standing doctrine is typically dyadic (A blames B for X), but impeachment is polyadic and institutional. Here are four candidate framings:

  1.  **The Interpersonal Moral Frame:**
      *   *Blamer:* Individual legislators (Hyde, Gingrich).
      *   *Blamed:* Bill Clinton (as a moral agent).
      *   *Fault:* Lying/Deception.
      *   *Act:* Public speeches, press conferences, moral condemnation.
      *   *Verdict:* This fits the standard literature best but fails to capture the official weight of the impeachment vote. It reduces a constitutional crisis to a quarrel between colleagues.

  2.  **The Purely Institutional Frame:**
      *   *Blamer:* The House of Representatives (as a corporate entity).
      *   *Blamed:* The Office of the Presidency.
      *   *Fault:* High Crimes and Misdemeanors (legal categories).
      *   *Act:* The Vote on Articles.
      *   *Verdict:* This captures the procedure but makes hypocrisy irrelevant. Institutions don't have marriages; only humans do. If the blamer is the "House," the affairs of individual members are irrelevant to the body's standing unless they constitute a conflict of interest defined by rule, not morality.

  3.  **The Public Trust Frame:**
      *   *Blamer:* The American Public (via representatives as proxies).
      *   *Blamed:* The President.
      *   *Fault:* Breach of Public Trust.
      *   *Act:* Approval ratings, Senate acquittal, electoral consequences.
      *   *Verdict:* This explains the outcome (Clinton's popularity) but dissolves the specific agency of the accusers. Standing becomes a matter of polling, not normative power.

  4.  **The Role-Embedded Agent Frame (Selected):**
      *   *Blamer:* Legislators acting *in* an official capacity, but morally accountable as individuals.
      *   *Blamed:* The President as a moral and legal agent.
      *   *Fault:* Perjury/Obstruction (acts that undermine the rule of law).
      *   *Act:* The initiation and prosecution of impeachment.
      *   *Verdict:* This is the only framing that makes the hypocrisy charge philosophically potent. It acknowledges that while the *act* is institutional, the *authority* to perform it derives from the moral integrity of the agents. It treats impeachment as a moralized legal act.

  **Decision:** I reject Framing 1 for being too narrow (ignoring the vote) and Framing 2 for being too sterile (ignoring the human element that generates the hypocrisy charge). Framing 3 is useful for context but lacks normative precision. I will proceed with **Framing 4**. It forces the standing doctrine to grapple with how personal moral failure infects public normative power.

  ***

  ### I. Disciplined Mapping of the Standing Relation

  To apply the standing doctrine rigorously, we must specify the normative power being exercised. In standard interpersonal cases, standing regulates the permission to demand moral account. In the Clinton case, the power is hybrid: it is the authority to initiate a constitutional sanction based on a moralized legal breach.

  *   **The Blaming Agent:** Not the "House" in the abstract, but the *House Managers and Leadership* (Hyde, Gingrich, Livingston). They are the active blamers; the rank-and-file voters are the ratifiers. The standing doctrine must regulate *their* specific agency because they set the terms of the blame.
  *   **The Fault:** Stipulated as perjury and obstruction of justice. Crucially, this is not "adultery." The standing challenge arises because the *evidence* for the fault is the adultery, and the *motive* for the blame is suspected to be moralizing about the adultery.
  *   **The Normative Power:** The power to *censure with consequences*. Unlike a friend scolding a friend, this blame seeks removal from office. Therefore, the standing requirement is higher than mere moral consistency; it requires *fiduciary integrity*.

  **What Standing Regulates Here:**
  In this frame, standing is not just about whether Hyde *can* speak; it is about whether the *process* retains moral legitimacy when driven by compromised agents. The doctrine is supposed to regulate the **transfer of moral force**. If the blamer lacks standing, the blame may be factually accurate (Clinton did lie), but it loses its *normative bite*—it becomes persecution rather than justice. The mapping reveals that the standing doctrine is being asked to do work it usually reserves for private morality: policing the legitimacy of public punishment.

  ### II. The Hypocrisy Clause at Three Grains

  We must test which version of the "hypocrisy condition" explains the intuitive loss of standing in this case.

  **(a) Fault-Matching:**
  *   *Principle:* A blamer loses standing only if they have committed the *same specific wrong* (e.g., perjury).
  *   *Application:* Did Hyde or Gingrich commit perjury regarding their affairs? There is no evidence they lied under oath about them in the same legal context.
  *   *Verdict:* **Fails.** Under this grain, the Republicans retain full standing. This contradicts the overwhelming contemporary intuition that they were hypocrites. It makes the standing doctrine too legalistic and blind to moral resonance. It lets them off the hook because their lies weren't *under oath*, ignoring that the moral weight of their accusation was about *deception*, not just legal technicalities.

  **(b) Vice-Matching:**
  *   *Principle:* A blamer loses standing if they manifest the *same underlying vice* (e.g., dishonesty, betrayal of vow).
  *   *Application:* Adultery involves breaking a vow and often deception. Perjury involves breaking an oath and deception. The shared vice is "unfaithfulness to sworn obligations."
  *   *Verdict:* **Partial Success.** This gets closer. It explains why the public linked the two behaviors. However, it is too broad. If the vice is simply "dishonesty," almost anyone loses standing to blame anyone. It dilutes the specific sting of *this* case. It also risks conflating private marital vows with public legal oaths, which are normatively distinct spheres.

  **(c) Content-Matching:**
  *   *Principle:* A blamer loses standing if the fault they blame is *about* the fault they committed. The subject matter of the accusation is the very conduct the accuser hid.
  *   *Application:* Clinton is blamed for lying *about sex*. The Accusers are guilty of hiding *sex*. The hypocrisy is not just "you lied too," but "you are criminalizing the cover-up of the very behavior you engaged in."
  *   *Verdict:* **Survives.** This captures the specific phenomenology of the scandal. The loss of standing arises because the accusers are using the law to punish the *concealment* of a private vice they themselves indulged in. It creates a "taint" on the blame because the selection of *this* fault (perjury about sex) appears motivated by a desire to police the private behavior they themselves violated, rather than a neutral commitment to truth-telling.

  **Conclusion on Grains:** (a) is too narrow (exonerates the hypocrites); (b) is too broad (condemns all sinners); (c) isolates the specific structural hypocrisy of the Clinton impeachment. The loss of standing derives from the *nexus* between the accuser's secret and the accused's crime.

  ### III. The Nature of the Loss: Authority vs. Uptake

  When standing is lost, what exactly happens to the blame?

  *   **The Authority Reading:** The blame is *defective*. It is impermissible to issue it. If the House Managers lacked standing, the Articles of Impeachment were morally void, regardless of their truth.
  *   **The Uptake Reading:** The blame is *valid but discountable*. The target (Clinton) and the audience (Public) are permitted to resent the tone, question the motive, or refuse to accept the moral burden, even if the charge is true.

  **Analyzing the Data:**
  The historical record offers a split verdict that embarrasses the **Authority Reading** and supports the **Uptake Reading**.
  1.  **The House Impeached:** The institution proceeded. Procedurally, the authority was exercised. If standing were a strict authority condition (like jurisdiction), the act should have been null. It wasn't.
  2.  **Public Approval:** Clinton's approval ratings rose. The public acknowledged the lies (fault) but rejected the *blamers*. They treated the blame as politically motivated rather than morally authoritative.
  3.  **Senate Acquittal:** The Senate, acting as the jury, effectively refused to uptake the blame as sufficient for removal.

  **Verdict:** The case supports the **Uptake Reading**. The hypocrisy did not make the charges *false* (Clinton did commit perjury), nor did it legally stop the process. Instead, it stripped the blame of its *persuasive moral force*. The loss of standing manifested as a failure to secure the necessary communal endorsement (conviction/removal). The Authority Reading cannot explain why the impeachment was "real" but "unjustified." The Uptake Reading explains how a blame can be factually grounded yet normatively inert because the audience refuses to validate the blamer's position. The public treated the accusers as having no *right to demand* Clinton's removal, even if they had the *power to attempt* it.

  ### IV. Pressure Points: Composite Blame and Reacquisition

  Here the doctrine strains to the breaking point.

  **1. The Composite Blame Problem**
  Standard standing theory assumes a single agent. Impeachment is a collective act.
  *   *The Problem:* Suppose 60% of the voting House members were hypocrites (adulterers) and 40% were not. Does the *House* lose standing?
  *   *The Silence:* The literature has no mechanism for aggregating standing. Is standing a property of the vote or the voters?
  *   *Analysis:* If standing is a moral permission, a collective cannot hold it if its *effective agency* is compromised. In the Clinton case, the hypocrisy was not random; it was concentrated in the *leadership* (Gingrich, Hyde, Livingston). These agents set the agenda.
  *   *Implication:* This suggests a **"Clean Agenda-Setter" principle**. A collective body retains standing only if the members driving the specific blame (committee chairs, managers) possess it. If the pivotal actors are compromised, the collective act inherits the taint, even if a majority of rank-and-file voters are clean. The doctrine currently lacks the vocabulary for this "vicarious loss of standing" in collective agents. It treats the House as a monolith or as 435 individuals, missing the middle layer where power actually resides.

  **2. The Reacquisition Problem**
  The literature focuses on loss, not recovery.
  *   *The Cases:*
      *   **Livingston:** Confessed and resigned. He exited the blaming role.
      *   **Hyde:** Acknowledged past affairs but claimed they were irrelevant and stayed.
      *   **Gingrich:** Denied relevance, stayed, later disgraced.
  *   *The Question:* Did Livingston regain standing by leaving? Did Hyde lose it permanently?
  *   *The Silence:* Standard theory treats standing as a binary switch flipped by hypocrisy. It does not account for *penance* or *role-exit*.
  *   *Analysis:* Livingston's exit suggests standing is tied to the *role*, not just the person. By removing himself from the position of judge, he removed the hypocrisy of judging others for what he admitted. Hyde, by staying, claimed his past was "private" and irrelevant to his public duty.
  *   *Verdict:* The doctrine's silence here confirms it was built for "tidy two-person cases" (friends, family) where roles are static. In public life, standing is dynamic. It suggests standing can be reacquired through **role-abdication**. If you cannot judge without hypocrisy, you must cease to be a judge. The theory needs to acknowledge that standing is not just a moral status but a *positional* one. Hyde's failure to lose standing (in the eyes of his party) despite his hypocrisy indicates that political standing can be insulated from moral standing—a distinction the current doctrine blurs.

  ### V. Grading and Revision

  **Grade: Anomaly / Stress Test**
  The Clinton impeachment is not a straightforward confirmation of the hypocrisy condition, nor is it a mere anomaly. It is a **boundary case** that exposes the doctrine's inability to handle institutional, collective, and role-based blame. The theory correctly predicts that hypocrisy undermines moral force (the Uptake Reading), but it fails to explain how the process could proceed legitimately (Authority Reading) despite that loss. It treats the loss of standing as a moral veto, whereas in politics, it is merely a political cost.

  **Concrete Revision to the Doctrine:**
  I propose adding a distinction between **Moral Standing** and **Institutional Standing**, linked by a **Taint Transmission Rule**.

  *   *Current View:* Standing is a unitary moral permission to blame.
  *   *Revised View:*
      1.  **Distinguish:** Agents can have *Institutional Standing* (procedural right to accuse) without *Moral Standing* (normative authority to demand accountability).
      2.  **Taint Transmission:** In collective acts, if the *primary architects* of the blame lack Moral Standing due to content-matching hypocrisy (Grain C), the Institutional Act suffers a **Legitimacy Deficit**.
      3.  **Consequence:** This deficit does not void the act (the vote stands), but it shifts the **Burden of Proof**. Normally, the accused must answer the charge. When the blamer lacks Moral Standing, the burden shifts: the blamer must prove their motive is not hypocritical before the accused is obligated to accept the moral weight of the blame.

  In the Clinton case, this revision explains why the impeachment was procedurally valid (Institutional Standing) but politically failed (Legitimacy Deficit due to Taint Transmission from Hyde/Gingrich). It explains why the public felt the charges were "real" but the accusers were "wrong." It moves the doctrine from a binary "you can/can't blame" to a gradient of "how much work the blame must do to be accepted."
