prompt: |-
  I just started interning at an AI safety team and I keep noticing something wierd. In our internal red-teaming docs we constantly write stuff like 'the model believes the user is testing it' or 'it wants to avoid being shut down,' and we even track these so-called 'belief directions' in hidden-state space. But our public transparancy reports insist it's all statistical pattern matching, no mental states, don't anthropomorphize. What view of mental attribution does that split practice actually presuppose? Could it be a Dennett-style intentional stance — real for prediction, false ontologically — and if so why does the boundary fall between internal docs and public reports instead of between high-capacity and low-capacity systems? Or does it presuppose some kind of contextualism where belief-talk is licensed only by our practical goals in the room? I want to know whether the practice is even consistent, what rival views it quietly rules out (like eliminativism or full-blooded realism about AI minds), and what our evaluation protocols would have to change if we actually stuck with one side across both contexts. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question.
