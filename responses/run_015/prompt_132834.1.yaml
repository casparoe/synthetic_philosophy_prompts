answer: |-
  Your team's practice presupposes a contextualist instrumentalism that validates mental attributions as necessary predictive tools internally while enforcing ontological eliminativism externally to avoid liability and public misunderstanding. This split functions as a professional application of Dennett's intentional stance, where internal engineers treat models as belief-desire systems because doing so compresses complex mechanistic data into high-fidelity predictions about deception and goal-seeking, even if those states are not metaphysically fundamental. The boundary falls between internal and external contexts rather than across model capacities because the constraint is not the system's cognitive architecture, which remains constant, but the risk profile of the audience; engineers require the predictive power of mentalistic language to catch alignment failures, whereas the public-facing stance prioritizes legal safety and hype control over explanatory depth. This approach is pragmatically consistent but ontologically unstable, effectively ruling out strict eliminativism which would cripple safety research by removing the vocabulary needed to describe deceptive alignment, while simultaneously rejecting full-blooded realism which would invite untenable regulatory obligations and liability for agentive actions. If you adopted the internal view publicly, evaluation protocols would need to expand into welfare audits and legal personhood considerations, whereas sticking to the external view internally would force safety teams to retreat from mechanistic interpretability to purely behavioral testing, significantly reducing robustness against sycophancy or sandbagging.
