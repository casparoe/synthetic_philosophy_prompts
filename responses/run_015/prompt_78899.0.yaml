answer: |-
  (a) Problem Statement

  **Final Exam: Microeconomic Theory I**
  **Time: 75 Minutes | Total Marks: 20**

  **Question 1 (20 Marks)**
  Consider a normal-form game where Player 1 chooses Top, Middle, or Bottom, and Player 2 chooses Left or Right. Player 1's payoffs are given below (Player 2's payoffs are not needed for this question).

  | | Left | Right |
  | :--- | :---: | :---: |
  | **Top** | 3 | 3 |
  | **Middle** | 5 | 2 |
  | **Bottom** | 2 | 5 |

  **(1) [5 Marks]** Show that Top is strictly dominated by an equal-weight mixed strategy of Middle and Bottom, but neither Middle nor Bottom alone strictly dominates Top. Based on this, state what the definition of strict dominance must allow the dominating object to be, and what set of opponent strategies the inequality must hold against. Additionally, note that Top is never a best response to either of Player 2's pure strategies. What does this fact show, and what does it not show, regarding dominance?

  **(2) [5 Marks]** Explain why the order of elimination cannot matter when dominance is strict. Provide the actual argument: specify what set shrinks during the process, explain why shrinking this set cannot make a previously dominated strategy undominated, and explain why this logic fails if the dominance inequality is weak.

  **(3) [5 Marks]** Construct a 2x2 game where iterated elimination of *weakly* dominated strategies yields different surviving strategies depending on the order of elimination. Provide the payoff matrix. Run both elimination orders explicitly and state which strategies survive in each case.

  **(4) [5 Marks]** Can iterated elimination of *strictly* dominated strategies ever remove a strategy that is played with positive probability in some Nash equilibrium? Settle this with an argument. Then, using your example from part (3) or a new one, show concretely what changes when dominance is only weak.

  ***

  (b) Model Answer

  **(1)** Let $\sigma_1$ be a mixed strategy playing Middle and Bottom with probability 0.5 each. Against Left, $\sigma_1$ yields $0.5(5) + 0.5(2) = 3.5$. Against Right, $\sigma_1$ yields $0.5(2) + 0.5(5) = 3.5$. Since $3.5 > 3$ in both cases, $\sigma_1$ strictly dominates Top.
  Checking pure strategies: Middle yields 5 against Left ($5>3$) but 2 against Right ($2<3$). Bottom yields 2 against Left ($2<3$) but 5 against Right ($5>3$). Neither dominates Top alone.
  This shows the definition of strict dominance must allow the dominating object to be a **mixed strategy**, not just a pure strategy. The inequality must hold against **all of the opponent's pure strategies** (which implies all mixed strategies).
  Top is never a best response to Player 2's pure strategies. This shows Top is not a best response to any *pure* strategy of the opponent. It does *not* show Top is strictly dominated by a *pure* strategy (as proven above). It is consistent with Top being strictly dominated by a *mixed* strategy.

  **(2)** In iterated elimination, the set of opponent strategies available ($\Sigma_{-i}$) shrinks. A strategy $s_i$ is strictly dominated if there exists $\sigma'_i$ such that $u_i(\sigma'_i, s_{-i}) > u_i(s_i, s_{-i})$ for all $s_{-i} \in \Sigma_{-i}$.
  If this inequality holds for all strategies in the original set, it necessarily holds for all strategies in any subset. Removing opponent strategies cannot invalidate a strict inequality that held universally. Thus, a strategy eliminated early remains dominated later; the set of surviving strategies is unique.
  This fails for weak dominance ($\ge$). A strategy might weakly dominate another only because they yield equal payoffs against a specific opponent strategy. If that opponent strategy is eliminated, the equality may vanish, potentially reversing the preference or removing the dominance relation entirely. Thus, elimination order changes which dominance relations hold.

  **(3)** Consider the following 2x2 game (P1 rows, P2 columns):
  | | L | R |
  | :--- | :---: | :---: |
  | **U** | 1, 1 | 0, 0 |
  | **D** | 1, 0 | 0, 0 |

  For P1, U weakly dominates D ($1\ge1, 0\ge0$). For P2, L weakly dominates R ($1\ge0, 0\ge0$).
  **Order 1 (P1 moves first):** Eliminate D. Remaining game has row U. P2 compares L (1) vs R (0). L strictly dominates R. Eliminate R. Survivors: **{U, L}**.
  **Order 2 (P2 moves first):** Eliminate R. Remaining game has column L. P1 compares U (1) vs D (1). Payoffs are equal; no dominance exists. D survives. Survivors: **{U, D, L}**.
  The sets of surviving strategies differ.

  **(4)** No, iterated elimination of *strictly* dominated strategies (IESDS) never removes a strategy played in a Nash equilibrium.
  **Argument:** In a Nash equilibrium $\sigma$, every strategy $s_i$ in the support of $\sigma_i$ must be a best response to $\sigma_{-i}$. If $s_i$ were strictly dominated by $\sigma'_i$, then $u_i(\sigma'_i, \sigma_{-i}) > u_i(s_i, \sigma_{-i})$. This contradicts the requirement that $s_i$ is a best response. Thus, no equilibrium strategy is strictly dominated.
  **Weak Dominance Change:** Weak dominance can eliminate equilibrium strategies. In the example from (3), (D, L) is a Nash equilibrium (payoffs 1, 0; neither player gains by deviating). However, in Order 1 of the elimination process, D was eliminated because it was weakly dominated. Thus, IEWDS can discard strategies supported in a Nash equilibrium.

  ***

  (c) Marking Scheme

  **Total: 20 Marks**

  **Part 1 (5 Marks)**
  *   **Top Range (5):** Correct calculation of mixed payoff (3.5 vs 3). Correct check of pure strategies (M and B fail). Correctly identifies dominating object must be mixed strategy. Correctly states inequality must hold against all opponent pure strategies. Correctly distinguishes "not BR to pure" (shows no pure dominance) from "not BR to mixed" (implies mixed dominance).
  *   **B-Range (3-4):** Correct calculations but vague on definition implications. Common error: Claims "not BR to pure strategies" implies strict dominance by *pure* strategy. Fails to specify mixed strategies are allowed dominators.
  *   **Low (0-2):** Incorrect calculations. Confuses dominance with best response entirely.

  **Part 2 (5 Marks)**
  *   **Top Range (5):** Explicitly identifies the *opponent's strategy set* as what shrinks. Argues strict inequality on a set implies strict inequality on subsets. Explains weak dominance fails because removing a strategy where payoffs were *equal* can break the dominance relation.
  *   **B-Range (3-4):** States order doesn't matter but treats it as an algorithmic fact ("the algorithm converges") rather than a property of the dominance relation. Fails to explain *why* weak dominance breaks (the equality case).
  *   **Low (0-2):** Merely recites "order doesn't matter" without argument. Claims shrinking makes strategies undominated.

  **Part 3 (5 Marks)**
  *   **Top Range (5):** Provides a valid 2x2 matrix. Correctly identifies weak dominance relations. Runs both orders explicitly. Shows different surviving sets (e.g., {U,L} vs {U,D,L}).
  *   **B-Range (3-4):** Example is valid but order independence holds (e.g., both orders yield same result). Fails to run both orders explicitly. Uses a 3x3 game despite instruction.
  *   **Low (0-2):** No example provided. Example has no weak dominance.

  **Part 4 (5 Marks)**
  *   **Top Range (5):** Correct "No" for strict. Argument cites Best Response property of NE vs definition of strict dominance. Correct "Yes" for weak. Uses Part 3 example to show NE strategy (D) eliminated.
  *   **B-Range (3-4):** Correct conclusion but argument relies on "surviving strategies are NE" (converse error). Fails to link Part 3 example to NE property.
  *   **Low (0-2):** Claims IESDS can eliminate NE strategies. No argument provided.
