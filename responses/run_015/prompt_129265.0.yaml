  # Q&A PREP SHEET: Wild Animal Ethics Workshop
  **Thesis:** Epistemic humility + error asymmetry $\rightarrow$ Standard insect scale argument fails. Decision structure shifts based on intervention type (harm-reduction vs. benefit-conferring).

  ## 1. UPFRONT CONCESSIONS
  *Say these in your opening or early in Q&A to lower defenses.*
  *   **Concede the Biology:** "I am not claiming insects *are* sentient. I am claiming our decision matrix breaks if we treat low-probability sentience as linear expected value." (Disarms the Neurobiologist).
  *   **Concede the Priority:** "This framework likely confirms that farmed vertebrate welfare remains higher priority due to higher confidence levels." (Disarms the Farmed Animal Philosophers).
  *   **Concede the Risk:** "Wild interventions carry massive risk of ecosystemic backfire. My argument is partly about the asymmetry of *interventional* error, not just perceptual error." (Disarms the Decision Theorists who think you're ignoring risk).

  ---

  ## 2. THE HOT SEAT (Objections & Replies)

  ### Objection 1: The Decision Theorists (The "Math is Math" Attack)
  **Who:** One of the two EV maximizers.
  **Phrasing:** "You're proposing a 'weighting framework' that sounds like a ad-hoc adjustment to the utility function. If you have a probability $P$ and a value $V$, expected value is $P \times V$. If you're adding a 'humility discount,' aren't you just arbitrarily zeroing out the calculation to avoid a conclusion you find intuitively unpalatable? Why isn't this just scope neglect in disguise?"
  **Your Reply:** "It's not a discount on the value, it's a recognition that under deep uncertainty, the distribution of outcomes isn't symmetrical. In standard EV, a false positive (wasting resources) and false negative (allowing suffering) are mirror errors. In wild systems, a false positive intervention (e.g., removing a predator) can cause exponential suffering downstream. The 'weighting' accounts for the variance in outcome reliability, not just the probability of sentience."
  **Weakest Point:** If they press you to formalize the "variance in outcome reliability" mathematically, you might not have a clean equation. You risk sounding like you're hand-waving the math because the math doesn't work in your favor.

  ### Objection 2: The Neurobiologist (The "Hard Line" Attack)
  **Who:** The thalamocortical skeptic.
  **Phrasing:** "This entire discussion is premised on the idea that there's a non-zero probability of insect consciousness. Given the lack of a thalamocortical loop, that probability is effectively zero. Why are we building ethical frameworks on biological impossibilities? It's like debating the rights of rocks."
  **Your Reply:** "I respect the consensus on neural correlates, but my argument is conditional. *If* we assign any non-zero credence—as most precautionary principles do—then the scale argument still fails due to the intervention asymmetry. But I agree: if $P=0$, my framework collapses. I'm arguing for the decision structure *under uncertainty*, not settling the biology."
  **Weakest Point:** If they assert $P=0$ is a fact, not a confidence level, your whole talk becomes moot. You have to rely on the room's consensus that we can't be 100% sure about consciousness.

  ### Objection 3: The Farmed Animal Philosophers (The "Opportunity Cost" Attack)
  **Who:** One of the four (likely the most pragmatic).
  **Phrasing:** "Even if your asymmetry argument holds, isn't this a distraction? We have clear evidence of suffering in factory farms. By spending intellectual capital debating the weighting of insect uncertainty, aren't you implicitly diverting attention from high-confidence suffering? Isn't the 'harm' here just wasting our time?"
  **Your Reply:** "I agree that high-confidence cases take priority. However, wild animal ethics is growing, and policy decisions *will* be made (e.g., pesticide regulation, habitat management). We need a robust framework *before* those decisions happen, so we don't lock in bad heuristics. This isn't about diverting resources from farms; it's about preventing bad policy in the wild."
  **Weakest Point:** They may not buy that "preventing bad policy" is worth the workshop time. It can sound like academic navel-gazing while cows die.

  ### Objection 4: The Grad Student (The "Not Radical Enough" Attack)
  **Who:** The shrimp nociception enthusiast.
  **Phrasing:** "But if there's *any* chance they suffer, and the numbers are *that* big, doesn't the precautionary principle demand we act? You're using 'humility' as an excuse for inaction. If the asymmetry cuts both ways, shouldn't we be doing *more* research at least, rather than dismissing the scale argument?"
  **Your Reply:** "I'm not arguing for inaction on research; I'm arguing against *intervention* based on scale alone. The asymmetry suggests we should prioritize harm-reduction (e.g., banning cruel pesticides) over benefit-conferring interventions (e.g., trying to manage wild populations). Your urgency is right, but the direction matters. Blind intervention based on scale could make things worse."
  **Weakest Point:** This can sound like status quo bias. If you distinguish too sharply between "harm-reduction" and "benefit-conferring," they might argue that *not* helping wild animals is itself a harm you are enabling.

  ---

  ## 3. THE LANDMINE (The Question You Hope Nobody Asks)
  **The Question:** "If your framework allows for different weights on harm vs. benefit, does it imply we should vaccinate mosquitoes against malaria to reduce human suffering, or vaccinate *them* against their own suffering? And if not, why not?"
  *(Note: This traps you between speciesism and absurd interventionism.)*

  **The Trap:**
  *   If you say **Yes**: You look insane (engineering mosquito welfare?).
  *   If you say **No**: You look like you're abandoning the insects when it gets difficult, undermining your thesis.

  **Your Survival Reply:**
  "That's the exact edge case my asymmetry framework is designed to handle. Vaccinating for human benefit is a standard public health calculation. Vaccinating for *mosquito* benefit involves high-risk ecosystem intervention with low-confidence welfare data. Under my framework, the risk of false-positive intervention (breaking the ecosystem) outweighs the expected value of the benefit, *unless* we have higher confidence in their sentience and the intervention's safety. So, it actually argues *against* that kind of intervention right now, precisely because we don't know enough."

  **Why this works:** It uses your thesis to say "No" without abandoning the insects. It frames inaction as the *ethical* choice under uncertainty.

  ---

  ## 4. SURVIVAL TIPS
  *   **Don't fight the EV math:** If the Decision Theorists corner you, admit that EV is the goal, but argue your "weighting" is a correction for *input error*, not a rejection of the formula.
  *   **Use their language:** When talking to the Neurobiologist, use "neural correlates." When talking to the Philosophers, use "moral weight." When talking to the Grad Student, use "precautionary principle."
  *   **The "Next Step" Escape:** If an objection is too deep, say: "That's a crucial objection that requires a separate paper on [X]. For this talk, I'm restricting the scope to the decision structure itself."
  *   **Stay Calm:** You are arguing for *restraint* in a field full of people who want to *save the world*. You will be the "boring" person in the room. Own that. Boring saves lives; reckless enthusiasm risks ecosystem collapse.

  Good luck. You know the logic; just don't let them force you into a binary "Save them all / Save none" corner.
