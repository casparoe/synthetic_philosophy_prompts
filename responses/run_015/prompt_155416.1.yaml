  **BENTHAM COLLEGE OF FELICIFIC COMPLIANCE**
  **INTERNAL CIRCULAR 7(b): PRELIMINARY ESTIMATE OF FELICIFIC RETURN (SEXUAL)**
  *Ref: AI/LOB/4.2 | Clearance: Level 3 (Panopticon Wing)*

  **1. PURPOSE AND SCOPE**
  1.1. All Staff engaging in amorous or sexual conjunctions must submit this Form prior to initiation. The College holds that happiness is calculable in advance; failure to calculate is negligence.
  1.2. The Objective is the maximisation of the Total Felicity Sum (TFS). Any act yielding a negative TFS is prohibited under Statute 12 (Waste of Sensibility).*

  **2. THE FELICIFIC CALCULUS**
  2.1. Applicants must score the proposed act across seven dimensions. Pleasures are positive integers; Pains are negative.
  2.2. **Dimensions:** Intensity, Duration, Certainty, Propinquity, Fecundity (chance of repetition), Purity (freedom from subsequent pain), Extent (number of persons affected).
  2.3. **Weights:** Intensity (x1.5), Duration (x1.0), Certainty (x1.2), Propinquity (x1.0), Fecundity (x1.3), Purity (x1.4), Extent (x2.0).†

  **3. EXCLUSIONS AND IPSE-DIXITISM**
  3.1. Claims that an act is "unnatural," "indelicate," or "offensive to persons of a particular persuasion" shall be entered as Zero. These are pains of antipathy, not genuine suffering.‡
  3.2. The Moral Sanction (reputation, gossip, disapproval) is, however, a real pain. If the community disapproves, the pain is entered into the sum. We do not legislate morality; we measure its effects.

  **4. CONSENT AND BODILY INTEGRITY**
  4.1. Consent is a prerequisite for calculation. Where consent is absent, ambiguous, or coerced, the Pain column for Intensity and Purity is assigned a coefficient of 1000.
  4.2. *Note:* While the arithmetic treats this as a variable, the Officer acknowledges that no sum of pleasure can mathematically offset the violation of autonomy. The form records this; the calculus merely reflects the magnitude.

  **5. MORAL SANCTION AND CONCEALMENT**
  5.1. If the Moral Sanction (Clause 3.2) threatens to negate the TFS, the Applicant is advised to adjust the Extent variable.
  5.2. Concealment is permissible where publicity generates net pain. The College prefers transparency, but arithmetic is sovereign.§

  **TABLE A: SCORING GRID**

  | Dimension | Weight | Pleasure Score | Pain Score | Net |
  | :--- | :--- | :--- | :--- | :--- |
  | Intensity | 1.5 | [0-10] | [0-10] | |
  | Duration | 1.0 | [0-10] | [0-10] | |
  | Certainty | 1.2 | [0-10] | [0-10] | |
  | Propinquity | 1.0 | [0-10] | [0-10] | |
  | Fecundity | 1.3 | [0-10] | [0-10] | |
  | Purity | 1.4 | [0-10] | [0-10] | |
  | Extent | 2.0 | [Persons] | [Persons] | |
  | **TOTAL** | | **Σ P** | **Σ Pain** | **TFS** |

  **WORKED EXAMPLES**

  **Example A: The Dutiful Union vs. The Casual Conjunction**
  *Scenario 1:* A twenty-year marriage. Duty-bound. Low intensity (2), High duration (9). Low fecundity (1). Purity high (9).
  *Scenario 2:* A weekend fling. Mutually desired. High intensity (9). Low duration (2). High fecundity (0). Purity moderate (7).
  *Result:* Marriage TFS: +45. Fling TFS: +68.
  *Decision:* The Fling is approved. The Marriage is flagged for review under Form 9 (Efficiency of Domestic Arrangements). Duration does not compensate for low Intensity.

  **Example B: The Variable of Reputation**
  *Scenario:* Same act (TFS base +50).
  *Condition 1 (Public):* Community disapproval generates Pain (Extent: 50 persons x Weight 2.0 = -100). Net TFS: -50.
  *Condition 2 (Private):* Community disapproval nullified by secrecy. Pain (Extent: 0). Net TFS: +50.
  *Decision:* Condition 1 is Prohibited. Condition 2 is Approved.
  *Recommendation:* Applicant should restrict knowledge to principals. Scheduling should avoid peak gossip hours (Sundays, 14:00–16:00).¶

  **6. AUTHORIZATION**
  6.1. Forms must be signed by the Felicity Officer. Retrospective filing is accepted only if the TFS was positive.
  6.2. Appeals based on "love" or "commitment" are dismissed as vague terminology not found in the Calculus.

  ***
  *\* See Circular 4(a) on Masturbatory Efficiency.*
  *† Weights adjusted v.3.1 following the Great Scandal of 1998.*
  *‡ Cf. Bentham, MS Offences, though not cited here per HR policy.*
  *§ Paradox noted in Minutes 11(b), unresolved.*
  *¶ Peak gossip hours determined by Social Sanction Survey, 2023.*
