          *   *Critique:* This is the strongest candidate for the "counterfeit" step. It assumes death is a purely biological/natural kind independent of human context. However, "death" is also a *legal* and *social* status.
      *   *Step 8:* "If it ever works, then the patients declared dead by neurological criteria this year were not dead either..."
