      *(Refining the "Killing" aspect)*: If death is normative, then taking organs after a valid declaration isn't killing. It's harvesting from a corpse. The "killing" charge only sticks if the person was *still a person* in the moral sense. If the decision to withdraw support was valid, the "permanence" is morally sufficient for death.

