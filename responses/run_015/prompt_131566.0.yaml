          *   Accommodate *gradual value drift* (shifting priorities, partial retrospective endorsement).
          *   Accommodate *sudden value rupture* (trauma, conversion) without treating them as automatic failures of freedom.
          *   Preserve distinction between *internal compulsion* vs. *external coercion*.
          *   Remain consistent with *empirical findings* (deliberation as post-hoc rationalization).
          *   Flag *non-negotiable* vs. *partisan* desiderata (specifically "ultimate origination").
          *   Identify potential *joint unsatisfiability* (specifically full narrative coherence + open-ended executive revision).
          *   Evaluate standard accounts (Compatibilist, Hierarchical, Revisionist) against the list.
      *   **Format:** Conceptual architecture, no bibliography.

  2.  **Deconstruct the Desiderata:**
      *   *Moral Psychology Focus:* This means the theory needs to support practices like blame, praise, resentment, gratitude, and self-regulation. It's not just about "could I have done otherwise in a deterministic universe?" but "am I the right target of these reactive attitudes?"
      *   *Executive Sourcehood:* The "now" me controlling the "now" action.
      *   *Diachronic Narrative Coherence:* The "now" me owning the "then" me.
      *   *Value Drift/Rupture:* This challenges the Diachronic requirement. If I change too much, am I still me? If I change too little, am I stagnant? The theory must allow change without losing agency.
      *   *Compulsion vs. Coercion:* Internal (addiction, phobia) vs. External (gun to head). Both reduce freedom, but differently.
      *   *Empirical Consistency:* If science says conscious will is often a story told after the brain decides, the theory can't rely on a "ghost in the machine" pulling levers consciously.
      *   *Ultimate Origination:* The libertarian demand to be the *causa sui*. The prompt asks to flag this as partisan/non-negotiable.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *D1: Executive Control.* Need to distinguish doing something because *I* decided vs. a reflex.
