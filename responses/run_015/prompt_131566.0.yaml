answer: |-
  ### Architectural Desiderata for a Moral-Psychological Account of Free Will

  To serve moral psychology rather than metaphysics, a theory of free will must justify the practices of holding agents responsible (blame, praise, resentment, gratitude) without requiring impossible metaphysical privileges. The following desiderata outline the functional requirements for such a theory.

  #### 1. The Executive Sourcehood Requirement
  *   **Definition:** The agent must be the immediate causal source of the action in a way that distinguishes the action from a reflex, seizure, or external manipulation.
  *   **Motivating Distinction:** *Agency vs. Automation.* We do not blame a person for sneezing or for movements caused by a neural implant controlled by another. We require that the action issues from the agent's own processing systems.
  *   **Status:** **[NON-NEGOTIABLE]**. Without this, there is no action to evaluate, only behavior to observe.

  #### 2. The Diachronic Narrative Coherence Requirement
  *   **Definition:** The agent must be able to recognize their past decisions as expressions of a self that is continuous enough with their present self to warrant ownership of the consequences.
  *   **Motivating Distinction:** *Growth vs. Alienation.* If I promise to pay you tomorrow, but tomorrow I claim "that was a different person," moral commitment collapses. However, if I change my mind through reasoning, I am still the same agent.
  *   **Status:** **[NON-NEGOTIABLE]**. Moral obligations and character assessments require a temporal thread connecting the actor to the evaluator.

  #### 3. The Plasticity Requirement (Drift and Rupture)
  *   **Definition:** The theory must accommodate **gradual value drift** (shifting priorities over time) and **sudden value rupture** (trauma, conversion, epiphany) without categorizing them *a priori* as failures of freedom.
  *   **Motivating Case:** A recovering addict who slowly loses the desire for substances (drift) or a trauma survivor who radically reprioritizes safety over ambition (rupture). If freedom requires static values, moral growth and recovery are impossible. Conversely, if *all* rupture is free, brainwashing counts as freedom. The theory must distinguish *authentic transformation* from *destructive fragmentation* based on functional integration, not mere continuity.
  *   **Status:** **[NON-NEGOTIABLE]**. A theory that rules out radical change as unfree renders moral conversion impossible; a theory that accepts all change as free cannot distinguish therapy from brainwashing.

  #### 4. The Source-Distinction Requirement (Compulsion vs. Coercion)
  *   **Definition:** The theory must structurally distinguish **internal compulsion** (addiction, phobia, overwhelming emotion) from **external coercion** (threats, physical restraint).
  *   **Motivating Distinction:** *Excuse vs. Justification.* Coercion often justifies an action (I handed over the money because of the gun); compulsion typically excuses or mitigates (I stole because of the addiction). Both reduce control, but they implicate different aspects of agency (the environment vs. the psyche). Conflating them undermines our ability to assess character vs. circumstance.
  *   **Status:** **[NON-NEGOTIABLE]**. Moral psychology relies on this distinction to determine whether the defect lies in the world or in the agent.

  #### 5. The Empirical Adequacy Requirement
  *   **Definition:** The account must remain consistent with findings that deliberative consciousness is often post-hoc rationalization and that unconscious processes initiate action.
  *   **Motivating Case:** Libet-style experiments and cognitive science suggesting the "conscious will" is often a narrator rather than a driver. A theory requiring conscious, moment-by-moment volitional initiation is empirically false. Agency must be located in the *system* (including unconscious processing), not just the conscious spotlight.
  *   **Status:** **[NON-NEGOTIABLE]**. A metaphysics incompatible with established science cannot ground a naturalistic moral psychology.

  #### 6. The Ultimate Origination Requirement
  *   **Definition:** The agent must be the *causa sui* (cause of themselves), such that their will is not determined by prior causal chains (genetic, environmental, or historical).
  *   **Motivating Case:** The intuition that to be truly free, one must have created one's own character from scratch.
  *   **Status:** **[PARTISAN/METAPHYSICAL]**. This is the libertarian demand. It is **not** required for moral psychology. We hold people responsible for actions flowing from their character even if that character was shaped by factors they did not choose. Demanding this makes free will impossible and unnecessary for practice.

  ---

  ### Analysis of Joint Unsatisfiability

  **The Tension:** *Full Narrative Coherence* (Desideratum 2) vs. *Open-Ended Executive Revision* (implied in Desideratum 3).

  **Verdict:** **Jointly Unsatisfiable in Strong Forms.**
  If an agent must maintain perfect narrative coherence (a seamless, intelligible story connecting past to present), they cannot undergo sudden value rupture without breaking the chain of agency. If an agent has total open-ended executive revision (the power to radically redefine themselves at any moment), narrative coherence dissolves into discontinuity.

  **Resolution:** A viable theory must reject "Full" Coherence in favor of **"Sufficient" Continuity.** The agent need not be identical to their past self, only *continuous enough* to sustain reactive attitudes (e.g., guilt, pride). The theory must posit a threshold of integration: a rupture is free if the new values are functionally integrated into the agent's decision-making architecture, even if they contradict past values. Coherence is a retrospective construction, not a metaphysical prerequisite.

  ---

  ### Evaluation of Standard Accounts

  #### 1. Standard Compatibilism (e.g., Dennett, Lewis)
  *   **Performance:** Strong on **Executive Sourcehood** and **Empirical Adequacy**. It defines freedom as the ability to act according to one's desires without external impediments.
  *   **Failure Point:** Struggles with **Plasticity (Rupture)**. If freedom is acting on current desires, a sudden trauma-induced personality change looks "free" (the agent is doing what they now want), failing to distinguish fragmentation from conversion. It also sometimes glosses over **Diachronic Coherence**, treating the self as a momentary collection of states rather than a temporally extended project.
  *   **Verdict:** Adequate for basic control, insufficient for deep moral identity.

  #### 2. Hierarchical Models (e.g., Frankfurt)
  *   **Performance:** Excellent on **Source-Distinction (Compulsion)**. By distinguishing first-order desires (urges) from second-order volitions (what I want to want), it captures internal compulsion well.
  *   **Failure Point:** Vulnerable on **Value Drift**. If second-order desires can also drift or be manipulated (the "regress problem"), the anchor for freedom vanishes. It also struggles with **Empirical Adequacy** if it assumes second-order volitions are always consciously accessible, which psychology disputes.
  *   **Verdict:** Good for internal conflict, weak on diachronic change and empirical realism.

  #### 3. Revisionist/Strawsonian Accounts (e.g., Strawson, Vargas)
  *   **Performance:** Strong on **Moral Psychology Focus**. It treats free will as a function of our reactive attitudes rather than a metaphysical fact. This naturally handles **Ultimate Origination** by flagging it as unnecessary.
  *   **Failure Point:** Can be circular regarding **Executive Sourcehood**. If freedom is just "being an appropriate target of blame," it risks defining the phenomenon by the practice rather than the capacity that justifies the practice. It must ensure it doesn't legitimize blaming agents who lack **Executive Control** simply because the social practice demands it.
  *   **Verdict:** Best fit for the prompt's goal, provided it integrates a robust account of cognitive control to avoid circularity.

  ### Summary Architecture
  An adequate account must be **System-Compatibilist** (locating agency in the whole person, not just consciousness), **Diachronically Flexible** (allowing for rupture provided functional integration remains), and **Naturalistic** (accepting unconscious initiation). It must explicitly reject **Ultimate Origination** as a partisan metaphysical luxury that moral psychology does not require. The core tension between coherence and revision is resolved by treating narrative identity as a *regulative ideal* rather than a metaphysical constraint.
