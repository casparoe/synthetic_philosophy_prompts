      *   *D3: Plasticity (Drift/Rupture).* This is crucial. Standard theories often fail here. If I convert religions, am I unfree? If I slowly become cynical, am I unfree? The theory must say "No, you are still an agent, just a changed one."
      *   *D4: Source Distinction (Internal/External).* Coercion excuses; compulsion mitigates. Need to keep them distinct.
      *   *D5: Empirical Adequacy.* Can't contradict neuroscience/psychology regarding unconscious processing.
      *   *D6: Ultimate Origination.* Flag this. It's the metaphysical luxury, not the psychological necessity.

  4.  **Analyzing Joint Unsatisfiability:**
      *   The prompt specifically asks about "full narrative coherence with open-ended executive revision."
      *   *Tension:* If I can revise *anything* at any time (open-ended revision), my narrative is unstable. If my narrative must be perfectly coherent, I can't revise radically (rupture).
      *   *Resolution:* They are likely jointly unsatisfiable in their *strong* forms. You can't have perfect continuity *and* radical discontinuity. A viable theory must trade off perfect coherence for functional continuity.

  5.  **Evaluating Standard Accounts:**
      *   *Standard Compatibilism (Frankfurt, Dennett):* Good on executive control and empirical consistency. Often struggles with diachronic rupture (is the new self "really" them?).
      *   *Hierarchical (Frankfurt):* Good on internal compulsion (second-order desires). Struggles with value drift (what if the second-order desire is manipulated?).
      *   *Revisionist (Strawson, Vargas):* Good on moral psychology focus. Might struggle with the empirical "post-hoc" constraint if they rely too much on conscious reasoning.

