  The Frege–Geach problem is routinely misdiagnosed as a semantic puzzle about embedding when it is fundamentally a normative problem about inference. Expressivism should not attempt to mimic realist truth-conditions for moral sentences embedded in complex structures; instead, it must redefine validity itself. Validity is not the preservation of truth across representational contents but a verdict of normative incoherence on a package of attitudes. To accept the premises of a valid argument while rejecting the conclusion is not to contradict a fact but to violate a norm governing one's own cognitive state. This shift is not a stipulative dodge but is forced upon us by cases where compositional semantics offers no purchase on why the inference holds. If we cling to truth-conditions, we must posit entities that do no explanatory work; if we embrace normativity, we explain the binding force of logic directly. The stalemate in your reading group persists because participants assume validity must be truth-preservation, but expressivism denies the truth-aptitude required for that definition.

  Consider first quantifiers binding into moral content inside attitude ascriptions, such as "every candidate believes that everything the committee did was wrong." Compositional machinery struggles here because it requires a shared propositional content to be bound by the variable "everything" across different subjects' minds. If moral content is merely an expression of individual attitude, there is no shared object for the quantifier to latch onto without smuggling in a realist proposition. A purely semantic solution tries to construct a complex proposition that every candidate grasps, but this fails to capture the variance in individual commitment. The normative reply succeeds because it treats the validity of inferences involving this sentence as depending on the coherence of the candidates' attitudes relative to a shared normative standard, not on the truth of a bound variable. The quantifier ranges over actions, but the validity rests on the normative requirement that if one disapproves of all committee actions, one must disapprove of any specific committee action identified. This forces the normative view because no amount of syntactic tweaking creates a shared attitude where none exists; only a norm can bridge the gap between subjects.

  Second, consider comparative and degree morphology, as in "stealing is worse than lying; lying is worse than cheating; therefore stealing is worse than cheating." The validity here turns on transitivity constraints on the underlying attitudes of preference or disapproval rather than on any embedding whatsoever. Truth-conditional accounts must posit complex relational properties to ground this transitivity, which often outstrips the naturalistic facts available to the expressivist. If "worse" describes a relation, what relation is it? If it describes nothing, truth-preservation fails. The normative reply handles this naturally because transitivity is a constitutive norm of rational preference; violating it is a failure of coherence, not a mistake about the world. This case forces the normative view because the validity persists even if the comparative terms lack clear truth-conditions, provided the agents hold consistent preferences.

  Third, consider inferences whose conclusions are not declarative at all, such as "stealing is wrong, so don't steal." Nothing truth-evaluable is in play in the conclusion, so truth-preservation accounts fail completely. Compositional semantics cannot assign truth conditions to an imperative. The normative reply succeeds because the inference is valid precisely in virtue of the fact that holding the belief that stealing is wrong while lacking the intention to avoid it is a state of practical incoherence. This forces the normative view because there is literally no truth to preserve, so validity must be something else entirely.

  Two standard rivals attempt to solve these problems without abandoning truth-conditional validity, but both fail. The strategy of positing higher-order attitudes toward combinations of attitudes gets the structure right but leaves the validity itself unexplained. It can show that inconsistent attitudes exist, but it cannot explain why having them is irrational without invoking the very normative force it seeks to analyze. It describes the psychology of inconsistency but fails to justify the normativity of logic, leaving the agent without a reason to avoid the inconsistency. The strategy of bifurcating moral sentence content into an expressed attitude plus a thin descriptive content fails by smuggling in representational content through the back door. It saves validity by admitting that moral sentences describe minimal facts, but this surrenders the core expressivist claim that the primary function of moral language is non-representational. It gets the logic right but loses the metaphysics, effectively conceding the debate to realism.

  The obvious objection is that if validity is itself a normative status, the expressivist generates an exactly parallel problem one level up. Sentences like "this argument is valid" embed and figure in inferences just as "wrong" did, inviting a regress. If "valid" expresses an attitude, what validates inferences about validity? This is where the argument lives or dies, because it threatens to make the theory empty or circular. This regress is benign rather than vicious because it bottoms out in the practice of giving and asking for reasons. We do not need a further theory to justify the norms of reasoning; the practice of reasoning is the foundation upon which any theory of validity is built. To demand a truth-conditional account of validity is to demand a view from nowhere, which is unavailable to any agent engaged in inference. The regress stops because we cannot step outside the practice of reasoning to validate it; we are always already within it.

  This position costs expressivism its sharp distinguishability from a relaxed descriptivism about the normative domain generally. If validity is a normative fact about attitudes, the line between moral facts and logical facts blurs. Relaxed descriptivists say normative sentences describe normative facts; this view says they express attitudes governed by norms that function like facts. This is a cost worth paying because it acknowledges that normativity is ubiquitous in reasoning, not confined to morality. My friend's charge that this is mere relabeling misses that the relabeling changes the explanatory burden: we are no longer explaining how moral words map to the world, but how agents coordinate their attitudes. The position stands unless it can be shown that normative incoherence cannot govern inference without truth-conditions.

