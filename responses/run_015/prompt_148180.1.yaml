  build it from the logical space first — list the branch questions and all answer combinations — then place the named positions and mark the empty ones (i think the formal-causal leaf might actually be unoccupied). flag any pair the tree can't cleanly seperate, like institutional embedding vs formal cause if both sit outside agents. please say what would change your mind about how the tree should be drawn — for instance if elective affinity collapses into institutional embedding — and point out where your reasoning is shakiest. start right with the taxonomy itself, no preface, no "here's what you asked for" intro, just the tree.
