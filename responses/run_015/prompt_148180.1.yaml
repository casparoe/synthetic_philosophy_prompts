answer: |-
  # TAXONOMY OF CULTURAL CAUSATION (WEBERIAN FRAME)

  ## I. LOGICAL SPACE: BRANCH QUESTIONS & COMBINATIONS

  **Root Claim:** Values explain historical outcomes (e.g., The rise of capitalism / Nonprofit program failure).

  **Branch Question 1 (Reductionism):** Do values reduce to material conditions (economic base, technology, geography)?
  *   **Yes:** Values are epiphenomenal; material conditions are the true cause.
  *   **No:** Values possess independent causal efficacy.

  **Branch Question 2 (Locus of Mechanism):** [If No to Q1] Do values operate *inside* agents (psychological/motivational) or *outside* agents (institutional/selection/constitutive)?
  *   **Inside:** Values function as motives, drives, or preferences within the individual actor.
  *   **Outside:** Values function as environmental selectors, rules, or contexts that constrain/enable agents.

  **Branch Question 3A (Inside Methodology):** [If Inside] Do values require *Verstehen* (interpretive understanding of meaning) or can they be treated as variables in a causal model?
  *   **Verstehen:** Values are irreducible meanings unique to the historical context.
  *   **Variables:** Values are measurable parameters (preferences/constraints) applicable across contexts.

  **Branch Question 3B (Outside Mode):** [If Outside] Do values select via *Wahlverwandtschaft* (elective affinity) or act as Formal Causes (defining the ontology of the action)?
  *   **Elective Affinity:** Values and outcomes co-evolve or fit together without direct linear push; correlation with structural compatibility.
  *   **Formal Cause:** Values define what counts as "rational" or "economic" in that context; the outcome is ontologically distinct.

  **Combinatorial Map:**
  1.  **Yes (Q1)** → Marxist Superstructure.
  2.  **No (Q1) + Inside + Verstehen** → Weberian Interpretive Sociology.
  3.  **No (Q1) + Inside + Variables** → Unnamed Rational-Choice Culturalism.
  4.  **No (Q1) + Outside + Elective Affinity** → Weber's Elective-Affinity View.
  5.  **No (Q1) + Outside + Formal Cause** → Unnamed Formal-Causal Culture View.

  ---

  ## II. DECISION TREE: POSITIONS & COMMITMENTS

  **ROOT: Values explain historical outcomes**

  **├── BRANCH 1: Do values reduce to material conditions?**
  │   │
  │   ├── **YES** → **POSITION: Marxist Superstructure**
  │   │   ├── *Example:* Calvinism is merely ideological cover for the rising bourgeoisie's material interests.
  │   │   └── *Commitment:* Culture is not a cause; it is a symptom. To blame "culture" for program failure is false consciousness; look to budget constraints or power dynamics.
  │   │
  │   └── **NO** → *(Values have causal efficacy)* → **BRANCH 2: Locus of Mechanism?**
  │       │
  │       ├── **INSIDE AGENTS** (Psychological/Motivational) → **BRANCH 3A: Methodology?**
  │       │   │
  │       │   ├── **VERSTEHEN** → **POSITION: Weberian Interpretive Sociology**
  │       │   │   ├── *Example:* Calvinists worked hard because they *felt* unique salvation anxiety; meaning drove action.
  │       │   │   └── *Awkward Commitment:* You must claim salvation anxiety is an irreducible motive, not just a preference. If the anxiety disappears, the causality vanishes. Hard to generalize to nonprofit staff.
  │       │   │
  │       │   └── **VARIABLES** → **POSITION: Unnamed Rational-Choice Culturalism**
  │       │   │   ├── *Example:* Inner-worldly asceticism is a parameter plugged into a utility function (high discount rate on leisure).
  │       │   │   └── *Awkward Commitment:* You treat sacred values as interchangeable with price signals. Risks stripping the "culture" of what makes it cultural.
  │       │
  │       └── **OUTSIDE AGENTS** (Institutional/Selection) → **BRANCH 3B: Mode of Causation?**
  │           │
  │           ├── **ELECTIVE AFFINITY** → **POSITION: Weber's Elective-Affinity View**
  │           │   ├── *Example:* Calvinism didn't *cause* capitalism; it was uniquely compatible with it once both emerged.
  │           │   └── *Awkward Commitment:* You deny direct causation but still claim culture explains the outcome. Sounds like correlation with extra steps. Hard to use for fixing program failure.
  │           │
  │           └── **FORMAL CAUSE** → **POSITION: Unnamed Formal-Causal Culture View** [⚠️ POTENTIALLY EMPTY]
  │               ├── *Example:* Capitalism in Calvinist regions isn't just capitalism-plus-culture; it is ontologically different capitalism because "profit" meant "glory."
  │               └── *Awkward Commitment:* You claim capitalism in one context is a different species than in another. Hard to test empirically; risks making comparison impossible.

  ---

  ## III. STRUCTURAL CRITIQUES & UNCERTAINTIES

  **1. Separation Issues (Blurred Boundaries)**
  *   **Institutional Embedding vs. Formal Cause:** Both sit "Outside Agents." If culture selects via institutions (Outside/Elective Affinity), does it eventually define the rules of the game so thoroughly that it becomes a Formal Cause? The tree treats these as distinct modes, but in practice, strong selection pressures *become* constitutive rules over time.
  *   **Inside/Variable vs. Outside/Selection:** Modern behavioral economics blurs this. If a cultural norm changes my utility function (Inside/Variable), is that distinct from an institutional rule punishing deviation (Outside/Selection)? The tree assumes a clean agent/environment split that structuration theory (Giddens) denies.

  **2. What Would Change My Mind (Tree Restructuring)**
  *   **Collapse of Elective Affinity:** If empirical work demonstrates that "elective affinity" is merely a slow-acting causal mechanism (delayed selection), the Outside branch collapses into a single "Evolutionary/Selectionist" category. This would remove the distinction between Affinity and Formal Cause, as selection defines the form.
  *   **Occupying the Formal-Causal Slot:** If a robust theory emerges showing that cultural contexts create *incommensurable* rationalities (e.g., "economic rationality" in a nonprofit vs. a corporation is not just different goals but different logic), the Formal-Causal leaf becomes occupied. Currently, most social science assumes a universal rationality with local preferences, leaving this slot empty.

  **3. Shakest Reasoning**
  *   **The "Inside/Verstehen" Leaf:** This relies on the validity of *Verstehen* as a scientific method. If subjective meaning cannot be reliably accessed or verified, this branch becomes unfalsifiable metaphysics rather than social science.
  *   **The "Outside/Formal Cause" Leaf:** I flag this as potentially empty because most sociologists retreat to "Elective Affinity" when pressed on mechanism. Claiming culture changes the *ontology* of the outcome is a heavy philosophical lift that most empirical researchers avoid.
  *   **Applicability to Nonprofits:** Using Weber's *Protestant Ethic* (a macro-historical thesis) to evaluate a specific nonprofit program failure is a category error. Weber explains centuries; your mom is explaining a quarterly review. The tree exposes this scale mismatch: "Culture" at the nonprofit level is likely "Inside/Variable" (staff preferences) or "Outside/Selection" (HR policies), not "Formal Cause."
