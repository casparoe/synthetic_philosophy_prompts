prompt: |-
  hey so my mom just got made director of this nonprofit that's obsessed with "culture change" and now she's saying culture caused their last program failure. i want to know if that's even a real explanation or just hand-waving. can you write me a taxonomy / decision tree on whether culture can actually be a cause, using Weber's Protestant Ethic thesis as the running example?

