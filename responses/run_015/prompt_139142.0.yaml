answer: |-
  Here is a draft of the talk, followed by my thoughts on the shape you've proposed.

  ***

  **Memorial Talk Draft**

  When I started trying to write this, I kept hearing her voice correcting me. Not about the grammar, or the citations, but about the room. She would have asked: *Who are you talking to? And what do you expect them to do with it?*

  For thirty years, she taught us that speaking isn't just sending a signal. It's building something together. If I say "I promise," that's only half the work. The other half happens when you hear it and accept it. Without that answer, the promise doesn't quite land. It hangs in the air. She had a name for the ones that can't land. She called them "orphan performatives." Words that look like actions, but because they can't be answered, they remain unfinished.

  Standing here now, I feel the weight of that idea.

  To her colleagues and students: it is tempting to stand here and make a vow. To say, "We will finish the book," or "We will carry the seminar forward." Those are comforting things to say. But she taught us that a vow needs two people. She cannot answer us. If I make a promise to her now, I am creating exactly the kind of orphaned thing she warned us about. I would be speaking into a silence she spent her life teaching us how to fill.

  So I won't make that promise. Not because we don't intend to do the work, but because I respect her too much to pretend I can complete an act that requires her participation.

  But that leaves me with the rest of you. Her sisters, her children, her neighbors. The people who never read a word of her papers, but who knew her better than any of us.

  She wrote about uptake as if it were a technical requirement of language. But watching you with her, I realized it was actually a description of how she loved. She didn't believe you could just throw words at someone and walk away. She believed you had to wait for the answer. She believed that who we are is decided in the space between people, not inside our own heads.

  You gave her that answer, every day. When she came home from the university, you were the ones who completed her thoughts. You were the uptake that made her life a whole act, not just a series of lectures.

  So, if the work she left behind is unfinished, perhaps that is the only honest way for it to be. A finished book is a closed thing. An unfinished one is still open to the room.

  I cannot speak to her. But I can speak to you, and to us. I can say that the questions she asked are still alive in this department. They are in the arguments we have in the hallway, and in the papers we are struggling to write. And I can see that the person she was is alive in this room, in the way you are holding each other up today.

  She taught us that no one speaks alone. So, we are not finishing her work for her. We are continuing the conversation she started, with each other. We are answering her by listening to one another.

  The act is not complete. It can't be. But it is not orphaned, because we are still here to answer.

  Thank you.

  ***

  ### Feedback on the Shape

  You have got the shape exactly right, but with one crucial caveat regarding the non-philosophers in the room.

  **1. The "Sideways" Move is Essential**
  Your intuition to shift the address from the deceased (vertical) to the living (horizontal/sideways) is the only way to resolve the philosophical trap without lying. If you promise her anything, you violate her core tenet. If you say nothing, you violate the social contract of a memorial. By making the *gathering itself* the act of uptake, you validate her theory while performing a eulogy. You are effectively saying: *The speech act of this memorial is not "We honor X," but "We acknowledge each other in the light of X."* That works.

  **2. The Risk of "Unfinished"**
  Your concern about the family needing the speech to "actually do something" is well-founded. In philosophy, "unfinished" implies *openness* and *potential*. In grief, "unfinished" can sound like *abandoned* or *broken*.
  *   **The Fix:** In the draft, I was careful to frame "unfinished" not as a failure, but as an invitation. A finished book is dead; an unfinished conversation is alive. Make sure the family understands that *they* are the keepers of the "finished" parts (her life, her character), while the students are the keepers of the "unfinished" parts (the work). This divides the labor of memory in a way that validates both groups.

  **3. Avoiding the Lecture**
  You asked not to turn it into a tour of speech act theory. The danger here is that explaining "uptake" can sound cold.
  *   **The Fix:** I tried to translate "uptake" into "love" or "listening." For the family, her theory shouldn't sound like linguistics; it should sound like *her personality*. She listened. She waited for answers. That is a virtue anyone can understand, regardless of whether they know Austin from Searle.

  **4. The "Orphan" Metaphor**
  Using the term "orphan performatives" is risky. It's poetic, but it's also stark.
  *   **The Fix:** Use it once, clearly, then pivot immediately to the solution. Don't dwell on the orphanhood; dwell on the adoption. The work isn't orphaned because *we* are adopting the conversation.

  **Verdict:**
  Your proposed shape is philosophically consistent and emotionally viable, provided you emphasize that "unfinished" means "ongoing" rather than "incomplete." You are not abandoning her; you are refusing to pretend she is still here to sign off on the work. That is a profound form of respect. Stick to the sideways address. It turns the audience from witnesses into participants, which is exactly what she would have wanted.
