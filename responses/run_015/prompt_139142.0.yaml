prompt: |-
  My old supervisor died in March and I have to give the memorial talk at the department gathering — about six minutes, spoken, half the room her colleagues and ex-students, half her sisters and kids and neighbours who never read a word of what she wrote.

  Her thing, which she went on about for thirty years, was that the standard picture puts uptake in the wrong place: not a felicity condition hanging outside the act but half of it. On her view a promise, a bet, an apology, even a thank-you, is co-authored — the person it's addressed to has to answer, and their answer is partly what makes it the act it is. She had a name for the ones that don't get an answer: utterances like a promise made to someone who can't hear it anymore. She called them orphan performatives — perfectly formed, apparently doing something, and in fact unfinished.

  So I'm stuck, and not just rhetorically. Her old students will hear every "we'll finish your book" and "the seminar will go on" as me standing up in her memory and producing precisely the half-an-act she spent her career saying wasn't one. Her sisters, reasonably, need what I say to actually do something, not just describe somebody impressive. I think what's left is that the living can still answer each other, so whatever gets done has to get done sideways, among us, and the part aimed at her has to stay openly unfinished rather than dressed up as complete — but I'm not sure that's right, or that it's enough for the people in the room who aren't philosophers. Write it, and tell me if you think I've got the shape wrong. Don't have me promise her anything, and don't turn it into a tour of speech act theory.
reasoning: |-
  Here's a thinking process that leads to the suggested memorial talk:

  1.  **Analyze the Request:**
      *   **Speaker:** Former student of the deceased supervisor.
      *   **Occasion:** Department gathering/memorial (6 minutes spoken).
      *   **Audience:** 50% colleagues/ex-students (philosophers), 50% family/neighbors (non-philosophers).
      *   **Subject:** The supervisor's core philosophical idea: *Uptake* is internal to the speech act, not external. Acts like promising/apologizing are co-authored.
      *   **Key Concept:** "Orphan performatives" (utterances without an answer, e.g., promises to the dead).
      *   **The Dilemma:** The speaker feels trapped. Saying "we'll finish your work" feels like performing an "orphan performative" (the very thing she argued against). The family needs the speech to *do* something (comfort, connect), not just describe theory.
      *   **Constraints:**
          *   Do *not* promise her anything (e.g., "we will finish your book").
          *   Do *not* turn it into a lecture on speech act theory.
          *   Address the "unfinished" nature of the relationship/work without being bleak.
          *   Validate the family's need for closure/connection while honoring the philosophical insight.
          *   Length: ~6 minutes spoken (approx. 800-900 words).
          *   Task: Write the speech *and* provide feedback on the user's proposed "shape" (the idea that the living answer each other sideways, leaving the part aimed at her unfinished).

  2.  **Deconstruct the Philosophical Tension:**
      *   *Her Theory:* A speech act isn't complete without uptake (response).
      *   *The Situation:* She is dead. She cannot give uptake.
      *   *The Risk:* Any promise made *to* her is an "orphan performative."
      *   *The Solution:* Shift the address. Don't speak *to* her (which is impossible/orphaned). Speak *about* her to the living, inviting *them* to provide the uptake that completes the act of remembering. The "act" becomes the gathering itself, not a pledge to the deceased.

  3.  **Drafting Strategy - Section by Section:**
      *   **Opening:** Acknowledge the difficulty. Establish the dual audience (colleagues + family). Avoid jargon immediately.
      *   **The Core Idea (Simplified):** Explain her idea without jargon. Use an analogy (conversation, handshake). Focus on the "co-authoring" aspect.
      *   **The Application to Death:** Address the "orphan performative." Acknowledge the silence. Don't try to fill it with false promises.
      *   **The Turn (The "Sideways" Move):** Address the living. The work continues *among us*. The family's memory + the students' work = the complete picture.
      *   **Closing:** A gesture of thanks that invites a response (even if silent).

  4.  **Drafting - Tone and Voice:**
      *   Needs to be warm, intellectual but accessible, humble, and honest.
      *   Avoid academic posturing.
      *   Avoid clichés ("she's in a better place," "we promise to carry on").
      *   Needs to feel like a *conversation* (honoring her theory).

  5.  **Drafting - Iteration 1 (Mental Outline):**
