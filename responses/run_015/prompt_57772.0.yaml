answer: |-
  Question Stem

  In Chapter 4 of the Descent of Man, Darwin considers how social insects view duties differently from humans, even to the point of sacrificing kin. He contrasts this with his claim that the moral sense distinguishes humans from lower animals and arises when permanent social instincts override transient impulses. Assess whether this comparison undermines or supports his later suggestion that the circle of sympathy naturally widens over time. Does the insect case show that evolutionary history can explain moral feelings without validating their content, or does Darwin retain grounds for claiming broader sympathy is genuinely superior?

  Model Answer

  The tension between the insect thought experiment and the widening circle of sympathy reveals the precarious normative foundation of Darwinian ethics. In the insect case, Darwin demonstrates that moral content is entirely relative to the structural needs of the community. If humans possessed the instincts of bees, killing siblings would be a sacred duty. This suggests that what we call virtue is merely whatever impulse preserves the group. If morality is simply what aids survival, then human morality has no privileged status over insect morality, only different conditions. This threatens the idea that the widening circle of sympathy represents moral progress rather than mere historical change. The insect analogy forces the reader to confront the possibility that our deepest convictions are contingent artifacts of selection rather than insights into truth.

  However, Darwin distinguishes humans through the capacity for reflection. Conscience arises not just from having social instincts, but from comparing transient impulses against permanent ones using memory and reason. Insects act on blind instinct while humans evaluate instincts through the lens of past and future. This reflective capacity allows the moral agent to step outside immediate utility and critique current drives. When Darwin describes the circle of sympathy widening, he is not just describing a change in instinct but an expansion driven by reason and habit. We come to care about strangers not because they aid our immediate survival, but because our intellectual capacity allows us to recognize shared suffering. This suggests a normative shift because it relies on consistency. If we value our own pain, reason demands we value the pain of others who are relevantly similar. The moral sense is thus not static but develops through intellectual cultivation.

  Yet the question remains whether this wider circle is objectively better. Darwin often retreats to tribal utility. Tribes with wider sympathy cohere better and outcompete narrower tribes in the struggle for existence. Here, better means more successful, not necessarily more true. The insect case reminds us that success is relative to the environment. If the environment changed, narrow sympathy might again be advantageous. Darwin lacks a metaphysical ground to claim universal rightness. He cannot say siblicide is wrong in itself, only that it is wrong for humans given our specific social constitution. The normative work of the insect thought experiment is therefore primarily negative. It clears away the idea that morality comes from divine command or abstract reason independent of biology. It forces ethics to rest on natural sentiments and social utility rather than external authority.

  In his later reflections, Darwin expresses doubt about whether human convictions carry ultimate weight. This humility aligns with the insect analogy. We cannot prove our morality is true in a cosmic sense. However, within the human form of life, the widening circle is superior because it satisfies our reflective nature. A narrow morality creates internal conflict for a being capable of reason. The authority of the moral sense comes from the feeling of obligation generated by social instincts, reinforced by public opinion. The insect case shows that this feeling could have been attached to different actions, but for us, it is attached to sympathy. Therefore, wider sympathy is better for us, even if not better in itself. The feeling of duty is real even if its object is contingent.

  Ultimately, Darwin retains resources for claiming superiority, but they are internal to the human species. The insect case prevents him from claiming objective moral truth across all possible beings. But within humanity, the combination of social instinct and rational reflection creates a standard. Actions that undermine social cohesion cause dissatisfaction; actions that promote it cause satisfaction. Since humans cannot escape their social nature, the code that best supports that nature is authoritative for them. The insect analogy limits the scope of this authority but does not destroy it. Darwin offers a pragmatic justification rather than a foundational one. The widening circle is validated by its ability to harmonize our impulses with our reason, creating a stable society where moral feelings can flourish. This is enough for normative force within the human context, even if it fails to satisfy a demand for absolute moral knowledge. The thought experiment thus serves to humble human pretension while securing a practical basis for ethical progress based on social stability and reflective consistency.

  Marking Scheme

  1. Identification of Relativistic Threat (5 marks)
  The candidate explains how the insect analogy suggests moral content is contingent on survival needs rather than objective truth.

  2. Mechanism of Conscience (5 marks)
  The candidate details how human reflection compares transient and permanent instincts to generate moral feeling.

  3. Tribal Utility versus Moral Truth (5 marks)
  The candidate distinguishes between traits that are advantageous for group survival and traits that are morally justified.

  4. Role of Reflection in Normativity (5 marks)
  The candidate argues that reason allows humans to critique instincts, providing a basis for progress beyond mere adaptation.

  5. Evaluation of Internal Authority (5 marks)
  The candidate concludes that Darwin secures normative force within the human context while denying metaphysical objectivity.

  A/B Boundary: An A answer distinguishes between the psychological origin of obligation and the normative justification of the code, whereas a B answer treats the evolutionary explanation of the feeling as sufficient justification for the rule.

  Common Mistakes and Deductions

  1. Debunking Anachronism (-5 marks)
  Claiming Darwin argues morality is an illusion or false because it has evolutionary origins.

  2. Consequentialist Anachronism (-5 marks)
  Attributing a explicit act-consequentialist criterion of right action to Darwin rather than a group-selection account of moral motivation.

  3. Ignoring the Insect Case (-5 marks)
  Failing to discuss the thought experiment about social insects and focusing only on the widening circle.

  4. Claiming Objective Truth (-5 marks)
  Asserting that Darwin proves wider sympathy is objectively true in a metaphysical or divine sense.

  5. Confusing Instinct with Reason (-5 marks)
  Treating the widening of sympathy as a purely biological instinctual change without the role of intellectual habit.

  Concluding Note

  The single sentence a summary-trained student would be most likely to write in the opening minutes is Darwin believes humans are better than insects because we have a moral sense. This should be penalised rather than rewarded because it narrates the descriptive distinction without engaging the normative tension regarding whether that difference constitutes genuine moral progress or merely adaptive variation.
