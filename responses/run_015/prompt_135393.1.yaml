          *   *Adequate/Inadequate:* The notes say the distinction is "descriptive rather than normative." This is tricky. For Spinoza, adequacy *is* normative in the sense of *conatus* (striving to persist). It's not moral, but it is ethical (in the Spinozistic sense of increasing power of acting). Calling it purely descriptive might undermine the *drive* toward adequacy.
          *   *Correction:* Need to ensure the user acknowledges that while there's no free will, there is a normative *direction* (freedom as understanding necessity).

      *   **2. Coherence (Mind/State Analogy):**
