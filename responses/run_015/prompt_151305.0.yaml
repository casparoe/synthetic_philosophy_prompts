          1.  **The Shadow Module:** For every "Exemplar," there must be a "Shadow Narrative." Not necessarily debunking, but contextualizing the cost of that virtue or the historical reality omitted.
          2.  **The Comparative Synkrisis:** Restore Plutarch's actual method. Compare the ancient and modern figure, but explicitly analyze where they *diverged* morally, not just where they aligned.
          3.  **Instructor Protocol:** Mandatory training on how to teach these without inducing idolatry.
