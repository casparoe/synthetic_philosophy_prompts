answer: |-
  **MEMORANDUM**

  **TO:** The Faculty Steering Committee, Institute for Civic Character
  **FROM:** The Curriculum Review Board
  **DATE:** October 26, 2023
  **SUBJECT:** Formal Opinion on the *Parallel Exemplars* Digital Archive Proposal

  **I. DECISION**

  The Curriculum Review Board has completed its evaluation of the faculty proposal to adopt *Parallel Exemplars* as the core pedagogical resource for the Institute for Civic Character. After deliberation regarding the philosophical underpinnings and practical application of the archive, the Board issues a recommendation of **Approval with Binding Structural Conditions.**

  The Board finds that while the archive's intent aligns with the Institute's mission to foster civic virtue, the current design—specifically the mandate for strictly hagiographic content—poses a significant risk of moral distancing. To proceed, the project leads must implement the structural and pedagogical modifications outlined in Section III of this opinion. Failure to adhere to these conditions will result in the withdrawal of the Board's endorsement.

  **II. ASSESSMENT OF PEDAGOGICAL PREMISE**

  The Board acknowledges the strength of the proponents' central thesis: that moral learning requires aspirational proximity to perfection. There is substantial merit to the claim that an overemphasis on human flaw can cultivate cynicism rather than character. When students are taught primarily through the lens of critique, deconstruction, and the exposure of vice, they may develop a defensive posture toward civic life. They learn to spot failure with precision but lack a vision of success to pursue.

  The argument for pure hagiography rests on the psychological necessity of awe. To act nobly, one must first believe nobility is possible. By presenting figures stripped of petty failure and moral ambiguity, the *Parallel Exemplars* proposal seeks to provide an unobstructed view of the moral ceiling. It posits that if a student sees their hero stumble, they will grant themselves permission to do the same. In this view, the exemplar must function as a pole star: fixed, bright, and distant enough to guide, but not so human as to suggest that virtue is merely a matter of managing occasional errors. The Board accepts that emotional force is a prerequisite for genuine aspiration. Without the spark of admiration, civic education risks becoming a dry exercise in compliance.

  However, the Board concurs with the opposition's concern that stripping away the comparative structure of Plutarch's original *Parallel Lives* fundamentally alters the educational outcome. Plutarch did not write panegyrics; he wrote *synkrisis*. His goal was not merely to display virtue, but to weigh it against vice, often within the same life. He detailed the courage of Alexander alongside his drunken rages, and the eloquence of Demosthenes alongside his personal cowardice.

  By removing all account of vice or failure, the current proposal transforms the exemplar from a model into an idol. This produces the phenomenon of moral distancing: the student observes the figure with reverence but concludes that such perfection is biologically or historically impossible to replicate. Awe, when untethered from critical engagement, becomes passive. It generates spectators of virtue rather than practitioners. If the Institute's goal is civic action, the curriculum must bridge the gap between the ideal and the possible. A figure who never fails offers no instruction on how to recover from failure, which is the primary moral challenge of public life.

  **III. BINDING STRUCTURAL AND PEDAGOGICAL CONDITIONS**

  To mitigate the risk of moral distancing while preserving the aspirational force of the archive, the Board mandates the following modifications to the *Parallel Exemplars* design and classroom implementation.

  **1. Mandatory Antiparallel Pairings**
  The archive may not consist solely of hagiographic entries. For every "Exemplar Entry" (the strictly positive biography of the ancient and contemporary pair), there must be a linked "Shadow Entry."
  *   **Design Requirement:** The Shadow Entry must be a critical counter-biography of the same figures. It need not be disparaging, but it must be historically rigorous regarding failures, ethical compromises, and the negative consequences of the figures' actions.
  *   **User Interface:** The digital platform must present the Exemplar Entry and the Shadow Entry with equal visual weight. The user cannot access the Exemplar Entry without a prompt acknowledging the existence of the Shadow Entry. This ensures that the "perfection" is understood as a curated pedagogical tool, not historical fact.

  **2. Restoration of the *Synkrisis* (Comparative Analysis)**
  The proposal claims Plutarchian lineage but abandons Plutarchian method. The archive must include a third section for each pairing entitled "The Divergence."
  *   **Content Requirement:** This section must explicitly analyze where the ancient and contemporary figures diverged in their moral reasoning. It must highlight moments where one figure succeeded and the other failed, or where the definition of virtue shifted between eras.
  *   **Pedagogical Goal:** This prevents the student from viewing virtue as a static trait possessed by "great men" and reframes it as a series of choices made in specific contexts. It moves the focus from *who they were* to *what they did*.

  **3. Instructor Protocol: Critical Emulation**
  Adoption of the archive requires mandatory faculty training on the protocol of "Critical Emulation." Instructors are prohibited from using the Exemplar Entries as standalone reading.
  *   **Framing Rule:** Instructors must frame the hagiographic content as a "stress test" for the student's own moral reasoning. The classroom discussion must begin with the Exemplar Entry to harness the emotional force of aspiration, but must conclude with the Shadow Entry to ground that aspiration in reality.
  *   **Assessment:** Student assessments cannot ask for reflections on admiration alone. They must require a "Replication Plan," in which the student identifies a specific virtue displayed in the Exemplar Entry and outlines how they would attempt to practice it while avoiding the specific pitfalls outlined in the Shadow Entry.

  **4. Transparency of Curation**
  The archive must include a visible "Editorial Note" on the landing page of every module.
  *   **Disclosure:** This note must explicitly state that the Exemplar Entry is a curated selection of evidence designed to highlight specific virtues, and that it omits contrary data for pedagogical purposes. This prevents the erosion of trust between the institution and the student body. It teaches students that civic narratives are constructed, and that responsible citizenship requires seeking out the omitted data.

  **IV. CONCLUSION**

  The Institute for Civic Character stands at the intersection of inspiration and scrutiny. We reject the notion that these two impulses are mutually exclusive. To teach character solely through flaw is to invite cynicism; to teach it solely through perfection is to invite irrelevance.

  By approving *Parallel Exemplars* under these conditions, the Board seeks to harness the emotional power of the hagiographic approach without succumbing to its intellectual hazards. We require the archive to function not as a shrine to the perfect, but as a workshop for the imperfect. The student must leave the module not merely awed by the figure, but equipped to surpass them.

  The Board looks forward to reviewing the revised architecture of the digital archive within ninety days.

  **Signed,**

  **The Curriculum Review Board**
  **Institute for Civic Character**
