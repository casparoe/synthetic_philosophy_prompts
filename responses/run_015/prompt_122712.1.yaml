answer: |-
  Here are ten questions designed for a policy-literate audience, with follow-ups that anticipate her likely defenses.

  **1. The Monotonicity Trap**
  You describe your view as multiplying benefits by a priority weight that falls off very fast. Mathematically, if that weight falls faster than one-over-welfare, the marginal social value of adding welfare becomes negative. Are you formally abandoning the monotonicity axiom—meaning, are you committed to the claim that making someone better off can *decrease* overall value?

  *   **Follow-up:** If she says she's keeping the standard concave-function formulation: "But a concave increasing function preserves Pareto; it can't rank (5, 5) above (10, 100). If you're keeping the math of standard prioritarianism, you can't get your stock example. If you're getting your stock example, you've given up monotonicity. Which is it?"

  **2. The Sequential Ratchet**
  Let's assume you accept that moving from (10, 100) to (5, 5) is an improvement. If we then ask about moving from (5, 5) to (4, 4), does the same priority logic apply? Is there a ratchet effect where a long series of individually sanctioned levellings drives everyone toward the floor?

  *   **Follow-up:** If she says "No, there's a floor where levelling down stops": "What grounds that floor? If priority weights are a function of welfare levels, and welfare is lower at (4, 4), the weights should be *higher*, making the case for levelling down *stronger*. What breaks the chain if not an arbitrary stipulation?"

  **3. The Pareto Side-Constraint**
  Many critics suggest bolting on a Pareto side-constraint: let priority operate only among Pareto-optimal options. This would rule out your (5, 5) > (10, 100) case immediately. Why resist that modification?

  *   **Follow-up:** If she says "Pareto is only a heuristic, not a moral truth": "Heuristics usually fail in edge cases, not in the core cases where everyone is worse off. If the heuristic fails exactly where our person-affecting intuitions are strongest, why trust the heuristic's failure over the intuition?"

  **4. Idle Steepness**
  If you do accept a Pareto constraint in practice to avoid the *reductio*, does the "steepness" of the priority weight actually do any work? Standard prioritarianism already favors the worse off within Pareto sets. Does your view recommend any policies that standard prioritarianism wouldn't?

  *   **Follow-up:** If she says "Yes, it favors the worse off *more strongly*": "But if you can't cross the Pareto boundary, you're just picking a different point on the standard prioritarian curve. Why call it a distinct 'steep' view rather than just 'strong prioritarianism'?"

  **5. Egalitarianism in Disguise**
  A telic egalitarian says inequality is intrinsically bad. You say we weight welfare by priority. But if your view permits levelling down without making anyone better off, aren't the verdicts identical to telic egalitarianism? What does the weighting machinery buy you over just saying "inequality is bad"?

  *   **Follow-up:** If she says "It explains *why* inequality is bad (because of the value of benefits)": "But if the practical output is the same—burning resources to reduce inequality even if no one gains—isn't the 'priority' language just obscuring that you've adopted egalitarianism's most counterintuitive commitments?"

  **6. The Zero-Point Problem**
  Your weights depend on absolute welfare levels. But welfare scales usually have an arbitrary zero (e.g., the neutral level vs. a life not worth living). If I shift the zero point of the welfare scale, do your priority weights shift?

  *   **Follow-up:** If she says "Yes, the verdicts depend on the scale": "Then I can change your moral verdicts just by re-indexing the welfare metric. If shifting from a 'neutral = 0' scale to a 'worst possible life = 0' scale flips a policy recommendation, isn't the theory unstable?"

  **7. Calibrating the Steepness**
  How do we calibrate how steep is steep enough? Is there a fact of the matter about the decay rate of the priority weight, or is it a parameter we pick to match our pre-theoretic judgments?

  *   **Follow-up:** If she says "We find it via reflective equilibrium": "But if the view violates Pareto, it's already outside most people's reflective equilibrium. Aren't you just selecting a steepness parameter that forces the math to output the specific radical conclusions you've already decided to accept?"

  **8. Policy Implementation**
  For my policy students: what does this look like in a budget memo? Does Steep Prioritarianism ever recommend cutting a program that helps everyone, because it helps the rich slightly more than the poor?

  *   **Follow-up:** If she says "Theoretically yes, but practically rare": "If the theory forbids you from signing off on a policy that makes every constituent better off, how do you defend that to a policymaker without sounding like you're advocating for harm?"

  **9. The Intuition Defense**
  You've suggested that levelling down is only counterintuitive if you have "person-affecting intuitions you haven't earned." But isn't the burden of proof on the theory that violates the intuition, rather than on the intuition to justify itself to the theory?

  *   **Follow-up:** If she says "Person-affecting views can't solve non-identity problems": "Solving non-identity is a technical win, but violating Pareto is a moral cost. Why does solving a metaphysical puzzle about future people warrant accepting a moral conclusion that everyone is better off in the worse world?"

  **10. Falsifiability**
  Finally, what kind of argument or evidence could actually change your mind? Is there a specific case where, if Steep Prioritarianism gave the wrong answer, you would abandon the view?

  *   **Follow-up:** If she says "A better competing theory": "But if you've already accepted that Pareto can be violated, most competing theories will look weaker to you. Is there any *internal* inconsistency or empirical finding about welfare that would force you to abandon the steep weight, or is the view insulated from refutation?"
