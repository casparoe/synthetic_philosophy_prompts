answer: |-
  The stall is a substantive cross-purposes conflict grounded in divergent bedrock intuitions about whether biological individuation is anchored in historical causation or functional continuity.

  To arrive at this conclusion, I evaluated the possible structures of philosophical stalemates. A purely verbal stall is unlikely because both camps claim to track the same referent ('you') and agree on linguistic usage, differing only on modal properties. A hidden empirical stall is ruled out as both sides accept the same developmental data, genetics, and formal modal apparatus. A substantive but masked stall is closer to the truth, yet it fails to explain why arguments do not penetrate; the issue is not merely hidden premises but incompatible frameworks. A bedrock intuition clash is present, but insufficient on its own, as intuitions usually yield to counterexamples unless protected by divergent theoretical goals. Thus, the stall is best characterized as cross-purposes: modal metaphysicians are solving for *transworld identity conditions* (requiring fixed origins to maintain distinctness across possible worlds), while philosophers of biology are solving for *diachronic identity conditions* (requiring functional continuity to maintain life across time in the actual world).

  This divergence is illuminated by distinguishing 'gamete-essentialism' from 'causal-zygotic essentialism'. Modal metaphysicians typically defend causal-zygotic essentialism: the specific diploid cell formed by a unique causal fusion event is essential to you, regardless of genomic identity, because it anchors your haecceity in modal space. Philosophers of biology attack gamete-essentialism by showing genomic plasticity (epigenetics, chimerism), but they also undermine causal-zygotic essentialism by citing monozygotic twinning, where one zygote yields two persons, proving the zygote is not essentially tied to a single individual. The metaphysician treats the zygote as a logical subject requiring a unique history; the biologist treats the organism as a process requiring functional coherence. Because one side prioritizes the necessity of origin for individuation and the other prioritizes the sufficiency of continuity for identity, they talk past each other: one argues you cannot have different origins without being someone else, while the other argues you can survive origin-like disruptions without ceasing to be you.

  Progress will not come from biological discovery or formal logic, as the data and rules are already shared. Nor will it dissolve entirely through conceptual distinction, unless we concede that 'you' ambiguously denotes both a biological organism and a metaphysical person. If we accept this ambiguity, the stall dissolves into two separate questions: the organism could have had different origins (biological view), while the person could not (metaphysical view). However, if both camps insist 'you' is a unitary kind, we should expect a permanent impasse. The disagreement rests on a pre-theoretical commitment to either natural kinds (biology) or modal rigidification (metaphysics), neither of which can be empirically falsified or logically proven without begging the question against the opposing intuition.
