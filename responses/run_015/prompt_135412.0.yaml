prompt: |-
  Since I began auditing the moral-reasoning outputs of language models for a governance project, I have found myself returning repeatedly to the Frege–Geach problem for expressivism. The classic difficulty—whether an expressivist semantics for moral language can preserve logical validity when moral sentences are embedded in unasserted contexts such as conditionals or disjunctions—strikes me as structurally similar to a pattern I observe in these systems: they process embedded moral claims with full compositional transparency, as though the embedded clause carries a stable descriptive content, yet the outputs often lack the kind of attitudinal coherence that expressivists take to be distinctive of moral judgement. This parallel has convinced me that the philosophical stalemate is not merely historical but actively reproduced in new domains, which is why I want to understand its roots.

  Could you diagnose why the debate over the Frege–Geach problem has remained so intractable? I am not asking for a survey of every position, but for a disciplined diagnosis of what kind of disagreement it is—whether verbal, about the correct semantics for embedded contexts; substantive but masked by shared vocabulary; or a case in which expressivists and their descriptivist critics are answering different questions about language, cognition, and normative commitment. Please ground your diagnosis in what each side actually says about embedding, compositionality, and the nature of moral judgement, and separate clearly what is settled among philosophers who specialise in metaethics from what remains genuinely contested—particularly regarding whether quasi-realist strategies successfully dissolve the problem or whether hybrid expressivist accounts genuinely avoid it. Do not present any contested interpretation, such as the claim that the problem is purely technical and solved by standard semantic machinery, as though it commanded consensus.

  Given your diagnosis, what would count as progress: a formal result in the semantics of attitude contexts, an empirical finding about how moral cognition handles embedding, or a conceptual distinction that reveals the original problem to be ill-posed? Finally, does the behaviour of large language models when they embed moral sentences—treating them as transparently compositional—actually illuminate the philosophical issue, or is it a red herring that merely replicates the same ambiguity at a different scale?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Someone auditing moral-reasoning outputs of language models for a governance project. They are philosophically sophisticated (familiar with Frege-Geach, expressivism, descriptivism, quasi-realism, hybrid accounts, compositionality).
      *   **Core Task:** Diagnose *why* the Frege-Geach (F-G) problem debate is intractable. Is it verbal, substantive, or a case of talking past each other?
      *   **Constraints:**
          *   Do not survey every position.
          *   Ground diagnosis in what sides say about embedding, compositionality, and moral judgement.
          *   Separate settled vs. contested issues (specifically regarding quasi-realism and hybrid expressivism).
          *   Do not present contested interpretations (e.g., "it's purely technical and solved") as consensus.
          *   Define what counts as progress (formal, empirical, or conceptual).
          *   Evaluate the relevance of LLM behavior (illumination vs. red herring).
      *   **Tone:** Disciplined, analytical, philosophically rigorous, avoiding platitudes.

  2.  **Deconstruct the Frege-Geach Problem (FGP):**
      *   *The Problem:* Expressivism says moral sentences express non-cognitive attitudes (boo/hurray). But in unasserted contexts (e.g., "If stealing is wrong, then getting your little brother to steal is wrong"), the sentence "stealing is wrong" doesn't express an attitude. Yet, the argument is valid. Validity usually depends on content/truth conditions. If the content changes between asserted and unasserted contexts (the "embedding problem"), logic breaks (equivocation).
      *   *The Stalemate:* Descriptivists say moral sentences have truth conditions. Expressivists say they express attitudes. Quasi-realists (Blackburn, Gibbard) try to earn the right to talk *as if* they have truth conditions without believing they do.

  3.  **Diagnose the Intractability (The "Kind of Disagreement"):**
      *   *Is it verbal?* Partly, but not just. Both sides use "truth," "validity," "belief." But they mean different things by them.
      *   *Is it substantive?* Yes. It's about the *nature* of moral thought. Is it fundamentally representational (mind-to-world) or practical (world-to-mind)?
      *   *The Core Tension:* It's a clash between *semantic compositionality* (how parts make wholes) and *psychological functionalism* (what mental states are doing).
      *   *Diagnosis:* The debate is intractable because it is a **category clash between semantic formalism and psychological explanation**. Descriptivists prioritize the formal requirements of logic (embedding needs stable content). Expressivists prioritize the phenomenology and motivation of moral judgment (it feels like action-guidance, not fact-stating). Quasi-realism tries to bridge this by mimicking the formalism without the ontology, but critics argue this is either covert descriptivism or fails to explain *why* the mimicry works.
      *   *Settled vs. Contested:*
          *   *Settled:* Any viable metaethics must account for logical validity in moral reasoning. Pure, simple expressivism (Ayer) is dead.
          *   *Contested:* Whether quasi-realism *explains* validity or just *asserts* it. Whether hybrid theories solve the embedding issue or just complicate it (the "negation problem" for hybrids).

  4.  **Evaluate Progress:**
      *   *Formal Result:* Unlikely to solve it alone. You can build a logic for attitudes (e.g., logic of preference), but does that capture *moral* validity?
      *   *Empirical Finding:* Cognitive science on how people process conditionals involving norms could help. Do people treat "If X is wrong..." as factual or attitudinal?
      *   *Conceptual Distinction:* Most promising. Distinguishing between *logical validity* (formal) and *rational coherence* (psychological). If FGP is about rational coherence, expressivism might win. If it's about truth-preservation, descriptivism wins.
      *   *Verdict:* Progress requires dissolving the demand that moral logic must mirror descriptive logic exactly.

  5.  **Evaluate LLM Behavior:**
      *   *Observation:* LLMs treat moral sentences as transparently compositional (descriptivist syntax). They lack attitudes (expressivist semantics).
      *   *Illumination or Red Herring?* It's a **structural mirror**. LLMs demonstrate that you can have perfect compositionality *without* attitudes. This supports the descriptivist intuition that syntax drives validity. However, it fails to capture the *normative force* that expressivists care about.
      *   *Conclusion:* It illuminates the *semantic* ease of the descriptivist model but highlights the *psychological* gap expressivists worry about. It shows the FGP is easy for syntax, hard for semantics/psychology. It replicates the ambiguity: LLMs simulate the *form* of moral reasoning without the *substance*.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the user's insight (LLMs mirroring FGP). State the thesis: The intractability is due to a conflict between *semantic continuity* and *psychological discontinuity*.
      *   *Section 1: The Diagnosis.*
          *   Not merely verbal. Both use "truth," but descriptivists mean robust correspondence, expressivists mean minimal deflationary truth.
          *   Not merely substantive. It's about explanatory priority.
          *   Key friction: Compositionality requires stable content; Expressivism posits unstable content (asserted vs. unasserted).
          *   Quasi-realism status: Contested. Critics (Schroeder, Zangwill) say it's a "faux realism." Proponents say it explains the practice.
          *   Hybrid accounts: Contested. They face the "negation problem" (what does "not wrong" mean if "wrong" is belief + attitude?).
      *   *Section 2: What Counts as Progress?*
          *   Formal semantics alone is insufficient (we can stipulate rules).
          *   Empirical cognitive science is promising (how do brains actually process embedded norms?).
          *   Conceptual shift: Move from "truth conditions" to "commitment conditions."
      *   *Section 3: The LLM Angle.*
          *   LLMs are pure syntax engines. They solve FGP trivially by being descriptivist by default.
          *   This shows FGP is a problem for *psychology*, not just logic.
          *   It's not a red herring; it isolates the variable. LLMs have compositionality without attitude. Humans (allegedly) have attitude. The friction is in the human case.
      *   *Conclusion:* Summarize. The stalemate persists because we demand moral language be both practically motivating (Expressivism) and logically robust (Descriptivism).

  7.  **Refining the Tone:**
      *   Ensure I don't sound like I'm solving metaethics.
      *   Be precise about "Quasi-realism" (Blackburn/Gibbard) vs. "Hybrid" (Schroeder/Boolos style).
      *   Check constraints: Did I claim consensus where there is none? (Need to be careful saying quasi-realism "fails" or "succeeds." Must say it is *contested*.)
      *   *Self-Correction on LLMs:* Be careful not to anthropomorphize LLMs. They don't have attitudes. Their "solving" of FGP is trivial because they lack the psychological state expressivists care about. This actually supports the expressivist worry that standard semantics misses the point.

  8.  **Final Polish:** Check against the prompt's specific questions.
      *   Diagnose the disagreement type? (Category clash/Priority clash).
      *   Ground in embedding/compositionality/judgement? (Yes).
      *   Separate settled/contested? (Yes, specifically on quasi-realism/hybrids).
      *   Define progress? (Yes).
      *   LLM relevance? (Yes).

  9.  (Final Review of the "Settled" claim): Is it settled that simple expressivism is dead? Yes, mostly. Is it settled that quasi-realism works? No. Is it settled that descriptivism is true? No. I will frame it as "Simple non-cognitivism is widely regarded as insufficient," rather than "dead."

  10. (Final Review of LLM section): The user notes LLMs process embedded claims with transparency but lack attitudinal coherence. This is the key. LLMs show that *syntax* handles embedding fine. The problem is *semantics/psychology*.

  11. *Constructing the output.* (Proceed to generate response based on these thoughts.)
answer: |-
  The intractability of the Frege–Geach problem is not merely a technical failure of semantic engineering, nor is it a purely verbal dispute over the definition of "truth." It is a **clash of explanatory priorities regarding the relationship between logical form and psychological function.**

  The debate persists because descriptivists (cognitivists) and expressivists (non-cognitivists) agree on the *data* (moral arguments appear valid) but disagree on the *explanandum* (what kind of mental state makes that validity possible). Below is a diagnosis of the stalemate, an assessment of what constitutes progress, and an evaluation of the relevance of large language models (LLMs) to this philosophical impasse.

  ### 1. Diagnosis: A Clash of Explanatory Priority

  The disagreement is substantive, but it is masked by a shared vocabulary ("truth," "belief," "validity") that each side fills with incompatible theoretical content. The intractability arises from a tension between **semantic compositionality** and **psychological functionalism**.

  **The Descriptivist Priority:**
  Descriptivists argue that logical validity requires **content stability**. For an argument like *Modus Ponens* to hold ("If X is wrong, then Y is wrong; X is wrong; therefore Y is wrong"), the proposition "X is wrong" must carry the same semantic content in the conditional premise as it does in the asserted premise.
  *   **On Embedding:** Descriptivists treat moral sentences as having truth conditions identical to descriptive sentences. Embedding is unproblematic because the content is a proposition that exists independently of assertion.
  *   **On Judgement:** Moral judgement is a cognitive state (a belief) that represents the world.
  *   **The Cost:** This preserves logic easily but struggles to explain the *internal connection* between moral judgement and motivation (the Humean theory of motivation).

  **The Expressivist Priority:**
  Expressivists argue that the fundamental nature of moral judgement is **practical**, not representational. A moral judgement is an attitude (e.g., disapproval) or a plan.
  *   **On Embedding:** This creates the Frege–Geach problem. If "X is wrong" expresses disapproval when asserted, what does it do in "If X is wrong..."? You are not disapproving of X in the antecedent. If the meaning changes, the argument commits the fallacy of equivocation.
  *   **On Judgement:** Moral judgement is a non-cognitive state.
  *   **The Cost:** This explains motivation easily but struggles to explain logical validity without smuggling in cognitive content.

  **The Core Stalemate:**
  The debate is intractable because each side demands the other surrender their primary explanatory virtue. Descriptivists demand expressivists explain logic without propositions; expressivists demand descriptivists explain motivation without distinct psychological states.

  **Settled vs. Contested:**
  *   **Settled:** Simple, first-order expressivism (e.g., Ayer's emotivism) is widely regarded as insufficient. It is agreed that *some* account of embedding is necessary for a viable metaethics. It is also agreed that moral language *behaves* syntactically like descriptive language.
  *   **Contested (Quasi-Realism):** It is **not** settled whether quasi-realist strategies (Blackburn, Gibbard) dissolve the problem. Quasi-realists argue we can earn the right to talk of "truth" and "validity" within a projectivist framework by defining them in terms of consistency of attitudes. Critics (e.g., Zangwill, Miller) argue this is merely a linguistic mimicry that fails to explain *why* moral logic is binding, or that it covertly relies on realist truth conditions to do the work.
  *   **Contested (Hybrid Expressivism):** It is **not** settled whether hybrid accounts (e.g., Schroeder's *Being For*) avoid the problem. Hybrids posit that moral sentences express both a belief and an attitude. While this attempts to secure content for embedding, it faces the **"negation problem"**: it is difficult to specify the distinct attitudes expressed by "X is wrong," "X is not wrong," and "Is X wrong?" without proliferating mental states ad infinitum.

  ### 2. What Would Count as Progress?

  Given that the stalemate is rooted in a clash of priorities, progress is unlikely to come from a formal result that simply stipulates a logic for attitudes. We already have deontic logics and logics of preference; the philosophical problem is whether these map onto *moral* reasoning.

  **1. Formal Results (Low Value):**
  Developing a new semantic formalism for embedded attitudes does not solve the philosophical problem. A formal system can be consistent without being metaphysically or psychologically accurate. If a quasi-realist constructs a logic where validity is defined as "consistency of plans," the descriptivist will simply ask, "But is it *truth-preserving*?" The formalism cannot force agreement on the nature of the underlying states.

  **2. Empirical Findings (High Value):**
  Progress is more likely from cognitive science regarding **how moral cognition handles embedding**.
  *   **The Question:** Do human subjects process embedded moral claims ("If stealing is wrong...") using the same neural or cognitive machinery as asserted moral claims ("Stealing is wrong")?
  *   **The Implication:** If cognitive processing is identical, this supports descriptivism (stable content). If processing differs significantly (e.g., embedded clauses trigger hypothetical planning mechanisms rather than fact-retrieval), this supports a sophisticated expressivism. Currently, evidence is mixed, but this is the only domain that could adjudicate the psychological functionalism claim.

  **3. Conceptual Distinctions (Highest Value):**
  The most promising path is a conceptual dissolution that reveals the problem to be ill-posed. This involves distinguishing **logical validity** (a formal property of sentences) from **rational coherence** (a property of agents).
  *   If the Frege–Geach problem is about *sentences*, descriptivism wins (sentences need truth conditions).
  *   If the problem is about *reasoning*, expressivism may win (agents need consistent attitudes).
  *   **Progress:** A consensus that moral "validity" is a species of rational coherence rather than truth-preservation would dissolve the demand for descriptive content in embedded contexts. However, this requires descriptivists to abandon the idea that logic is exclusively about truth, which remains a significant hurdle.

  ### 3. The Relevance of Large Language Models

  The behavior of LLMs you observe—processing embedded moral claims with compositional transparency while lacking attitudinal coherence—is not a red herring. It is a **structural mirror** that isolates the variables of the Frege–Geach problem.

  **Illumination:**
  LLMs demonstrate that **compositionality does not require attitude.** An LLM can successfully process "If stealing is wrong..." because it operates on statistical regularities of syntax and descriptive semantics. It treats moral predicates as descriptive features of the world.
  *   **For the Descriptivist:** This supports the view that moral language *functions* semantically as descriptive language. The ease with which LLMs handle embedding suggests that the "logical" form of moral language is indeed descriptive.
  *   **For the Expressivist:** This highlights the **explanatory gap**. LLMs solve the Frege–Geach problem trivially because they lack the psychological states (attitudes/plans) that expressivists claim are essential to moral meaning. The fact that an LLM can embed moral sentences without having moral attitudes suggests that *semantic embedding* and *moral judgement* are separable.

  **The Verdict on LLMs:**
  The LLM case replicates the ambiguity at a different scale. It shows that the Frege–Geach problem is not a problem for **syntax** or even **formal semantics**; it is a problem for **philosophical psychology**.
  *   If you view moral language purely as a tool for information transfer (like an LLM), the Frege–Geach problem vanishes (Descriptivism).
  *   If you view moral language as a tool for coordinating action and expressing commitment (like a human), the Frege–Geach problem remains acute (Expressivism).

  Therefore, the LLM behavior illuminates the issue by confirming that standard semantic machinery *can* handle moral embedding, but only by stripping away the normative force that sparked the expressivist intuition in the first place. It suggests the stalemate persists because philosophers are trying to force a single theory to explain both the **logical robustness** (which LLMs have) and the **normative grip** (which LLMs lack) of moral language.

  ### Summary
  The debate remains intractable because it is a dispute over whether the logic of morality is derivative of general logic (Descriptivism) or sui generis to practical reasoning (Expressivism). Quasi-realism and hybrid theories remain contested because they attempt to bridge this gap without fully surrendering either priority. Progress requires either empirical data on how human cognition processes embedded norms or a conceptual shift that decouples validity from truth. LLMs clarify the landscape by showing that compositional transparency is compatible with the absence of attitude, thereby confirming that the Frege–Geach problem is ultimately a problem about the nature of moral psychology, not merely semantic embedding.
