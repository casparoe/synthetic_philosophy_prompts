answer: |-
  **Independent Study Proposal**
  **Course:** [Course Number/Name: Value Theory and Distributive Justice]
  **Student:** [Your Name]
  **Proposed Title:** Architectures of Rescue: Option Topology and the Numbers Debate

  **1. Research Question and Motivation**
  The central debate in the ethics of rescue—epitomized by John Taurek's argument that we ought to flip a coin rather than save the greater number—is typically framed as a conflict over value aggregation. Aggregationists argue that saving five lives produces more value (or satisfies more claims) than saving one; anti-aggregationists argue that respect for the individual forbids summing claims across persons. However, both sides implicitly assume what I will call a "single-choice architecture." In the standard thought experiment, the agent faces one decision node with two atomic options: "Save Group A (one person)" or "Save Group B (five people)."

  My proposed independent study investigates whether the moral logic of rescue is *architecture-dependent*. Specifically, I ask: **Does the anti-aggregationist verdict rely on the bundling of options into a single atomic choice, and does decomposing the scenario into a sequence of independent, one-by-one rescue opportunities undermine the coherence of Taurek's position?**

  My suspicion, developed during our seminar discussions on distributive ethics, is that Taurek's intuition is sensitive not just to the numbers involved but to the topology of the agent's available actions. If saving five requires performing five discrete acts rather than selecting one compound act, the anti-aggregationist may be forced to aggregate obligations at the planning stage, even if they refuse to aggregate value at the choice stage. This project aims to determine whether the "numbers should not count" intuition survives a shift from atomic to sequential decision structures.

  **2. Gap in Existing Literature**
  The standard literature treats the rescue scenario as a fixed datum. The philosophical work focuses on comparing the *values* at stake (e.g., the weight of a claim to life) or the *nature of the agent's concern* (e.g., impartiality vs. individual separation). While there is extensive discussion on whether we can sum harms or benefits, there is little analysis of how the *structure of the option space* influences the permissibility of aggregation.

  Existing treatments leave open the possibility that the "coin-flip" verdict is an artifact of the single-choice setup. By treating the choice as atomic, the literature bypasses the question of whether an agent has a derivative obligation to structure their environment such that they face sequential rather than bundled choices. If the moral obligation changes based on whether the five victims are presented simultaneously or sequentially, this suggests that the debate is not purely about value theory but also about the metaphysics of action and decision architecture. My project seeks to fill this gap by isolating the structural variable.

  **3. Methodology**
  Given the six-week timeframe and the eight-page limit, I will employ a method of formal reconstruction and conceptual analysis rather than empirical study or exhaustive historical exegesis.

  *   **Phase 1: Formal Reconstruction (Weeks 1–2):** I will construct two formal models of the rescue scenario.
      *   *Model A (Atomic):* The standard Taurek case. One node, two branches (Save 1, Save 5).
      *   *Model B (Sequential):* A decomposed case. Five nodes, each with two branches (Save Individual *i*, Let *i* perish).
      *   I will define the agent's knowledge state and causal constraints in both models to ensure the only variable is the topology of the choice.

  *   **Phase 2: Mapping Obligations (Weeks 3–4):** I will analyze how normative principles map onto these architectures.
      *   I will test whether a principle of "equal concern for each individual" (the core of Taurek's view) generates different prescriptions in Model A versus Model B.
      *   I will examine whether the sequential model forces a "planning stage" aggregation. For example, if I know I will face five sequential choices, do I have a prior obligation to adopt a policy that maximizes saves, even if each individual choice remains non-aggregative?

  *   **Phase 3: Evaluation and Synthesis (Weeks 5–6):** I will evaluate whether architecture-sensitive adjustments can preserve Taurek's core claim without *ad hoc* stipulation. I will determine if the anti-aggregationist must accept that their view is context-sensitive or if they can provide a unified account that handles both architectures.

  **4. Expected Outcomes and Significance**
  A **positive result** would demonstrate a principled distinction between atomic and decomposed rescue. This would vindicate the intuition that the "numbers should not count" only applies under specific structural constraints. It would suggest that anti-aggregationism is not a general theory of value but a theory of *choice under constraint*. This would require a significant revision of how rescue cases are taught and analyzed, shifting focus from value comparison to action individuation.

  A **negative result** (or failure state) would show that decomposing the choice merely relocates the aggregation problem to the planning stage without resolving it. If the anti-aggregationist must still aggregate at the level of policy to remain consistent in the sequential model, then the "single-choice architecture" is not doing the heavy lifting I suspect. In this case, the project would still succeed by demonstrating that the debate is robust against structural variations, reinforcing the standard view that the conflict is indeed about value, not topology.

  **5. Scope and Feasibility**
  This project is scoped specifically for an eight-page paper. I will not attempt to resolve the broader debate between consequentialism and deontology, nor will I address every objection to Taurek (e.g., the "complaint" model or contractualist readings). I will focus strictly on the structural distinction between atomic and sequential options.

  *   **Week 1:** Refine formal models of Atomic vs. Sequential architectures.
  *   **Week 2:** Draft the argument for why the literature assumes single-choice architecture.
  *   **Week 3:** Analyze the normative implications of the Sequential model.
  *   **Week 4:** Draft the core argument regarding "planning stage" aggregation.
  *   **Week 5:** Write and revise the full draft.
  *   **Week 6:** Final polish and formatting.

  This timeline is realistic given my familiarity with the course material. I have already drafted the initial formal distinctions during seminar preparation, and the required reading is limited to the core Taurek texts and specific papers on action individuation. The project fits the course's emphasis on rigorous conceptual analysis in distributive justice while offering a novel angle on a classic problem.

  **6. Conclusion**
  By interrogating the "single-choice architecture," this project aims to show that the numbers debate is not merely about how we count lives, but about how we count *choices*. Whether the result vindicates or undermines the coin-flip intuition, clarifying the role of option topology will provide a sharper understanding of the commitments required by anti-aggregationist views. I am eager to pursue this line of inquiry under the supervision of the department.
