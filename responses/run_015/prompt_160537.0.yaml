      *   *Lost:* The *normative force* of the constraint. In MD, a constraint is just a high cost or a rule. For Sam, it's a *reason* that trumps consequences. The "authority" of morality isn't modeled.
      *   *Verdict on Sam:* He's right about the domain restriction (hard constraints break the convexity/continuity needed for standard trade theorems). He's wrong that *no* trade is possible, but right that it's not *standard* trade. It's bargaining over feasible sets, not endowments.

  5.  **Refining the Vocabulary:**
      *   Use terms like: NTU bargaining, Feasible set $S$, Disagreement point $d$, Implementation, Incentive Compatibility (IC), Individual Rationality (IR), Lexicographic preferences, Domain restrictions, Relational contracts.
      *   Avoid: Explaining what IC or IR means.
      *   Ensure the distinction between *consequentialist evaluation of states* and *deontological evaluation of actions* is clear in the model.

  6.  **Self-Correction/Review during drafting:**
