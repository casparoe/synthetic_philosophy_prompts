          *   Mechanism Design view: Stochastic preferences over time. Time inconsistency.
          *   If Theory A $\to$ Theory B is a belief update, it's Bayesian updating. If it's a preference change, it's hyperbolic discounting or changing utility.
          *   Closer to User: It's a commitment problem. But Sam has a point if the "self" changes identity (Parfitian reductionism).

  4.  **Drafting the Residue Report:**
