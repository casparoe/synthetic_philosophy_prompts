          *   Menu-dependent preferences / Psychological Games: If utility depends on *what was chosen* not just the outcome (e.g., guilt), then "dirty" trades change the utility function structure.
          *   Does it collapse to price? If it's a utility penalty, yes (price = compensation for guilt). If it's a domain restriction, no (no price clears the market).
          *   Restructuring: Can a dirty trade become clean? Only if the constraint is endogenous or soft. If deontological constraints are exogenous hard constraints, restructuring fails.
