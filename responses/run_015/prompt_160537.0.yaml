      *   **Gains-from-Trade:**
          *   Comparative advantage holds if marginal rates of substitution (MRS) differ.
          *   No numeraire: This is a bargaining problem without side payments.
          *   Is it barter? Yes, effectively. But without a numeraire, we can't define a unique equilibrium price vector. We define a *Pareto frontier*.
          *   Problem: If preferences are lexicographic or have hard constraints (infinite disutility), the frontier might be empty or corner solutions only.

      *   **Enforcement:**
