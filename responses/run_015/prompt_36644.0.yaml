  Here is the analysis of her commitments, her likely verdicts on the new cases, and the test case that would expose the limits of her position.

  ### 1. The Rule: Institutionalized Fallibilism
  Your friend's track record commits her to a rule we might call **Institutionalized Fallibilism**.

  *   **Positive Criterion:** A field is science if it possesses an organized community that acknowledges anomalies, tolerates uncertainty, and subjects its core claims to internal criticism, even if predictions fail or mechanisms are missing.
      *   *Evidence:* She accepts **Newtonian Gravity** despite a known falsifying anomaly (Mercury) because the community engaged with it seriously for decades. She accepts **Plate Tectonics** (pre-1960s) despite lacking a mechanism and establishment support, because the proponents were gathering data and arguing within a research framework. She accepts **Macroeconomics** despite poor forecasting, implying that the *attempt* to model and the admission of uncertainty matters more than being right.
  *   **Negative Criterion:** A field is non-science if its community "immunizes" the theory against refutation, accommodates any outcome via ad hoc adjustments, and refuses to concede error.
      *   *Evidence:* She rejects **Homeopathy, Freud, and Intelligent Design** specifically because their communities "never concede anything."

  **The Core Principle:** For her, science is not defined by *what* you know (truth) or *what* you predict (success), but by *how you handle being wrong* (integrity).

  ### 2. Predicted Verdicts on the New Cases

  **Case 1: String Theory**
  *   **Verdict:** **Science.**
  *   **Reasoning:** String theory fails the "risky prediction" test (no empirical predictions yet), but it passes her "critical community" test with flying colors. It lives inside physics departments (institutional embeddedness) and is subject to "constant, harsh internal criticism." Her acceptance of Plate Tectonics (no mechanism) and Macroeconomics (bad prediction) shows she tolerates empirical gaps as long as the *discourse* is rigorous. Since string theorists do not claim to have proven the theory and openly debate its mathematical consistency and lack of data, they are not "immunizing" the theory.
  *   **Commitment:** She values the *social structure of criticism* over immediate empirical verification.

  **Case 2: The Parapsychology Unit**
  *   **Verdict:** **Science.**
  *   **Reasoning:** This is the strongest test of her consistency. She rejected Freud and Homeopathy because they "accommodate any possible outcome" and "never concede." This university unit does the exact opposite: they run preregistered trials (exposure to refutation) and "faithfully publish null results" (conceding error). If she rejects this, she is violating her own stated rule and relying on stigma rather than method. Her track record commits her to accepting them, because they are practicing the "refusal to immunize" that she demands.
  *   **Commitment:** She values *methodological honesty* over the *plausibility of the subject matter*.

  **Case 3: The Maverick Earthquake Forecaster**
  *   **Verdict:** **Non-Science.**
  *   **Reasoning:** The Maverick passes the "risky prediction" test (dated forecasts) and the "empirical success" test (better than chance). However, he fails the "organized skeptical community" test. He has "no credentials and no research community." Your friend's negative verdicts hinge on community behavior ("*its* community never concedes"). Her positive verdicts (Newton, Plate Tectonics, Macro) all involve collective research programs. A lone wolf, even a successful one, lacks the *social mechanism of self-correction* that defines science for her. Without peers to critique his methods or replicate his findings, his success is just luck or art, not science.
  *   **Commitment:** She values *collective verification* over *individual success*.

  ### 3. Where the Rules Come Apart
  Two plausible rules fit her past record equally well, but they diverge on these new cases:

  *   **Rule A: The Sociological Norm (Mertonian/Lakatosian).** Science requires an **organized community** that enforces norms of skepticism and admits error.
      *   *Fits:* Newton, Plate Tectonics, Macro, Homeopathy (rejection).
      *   *Predicts:* String Theory (Science), Parapsychology (Science), Maverick (Non-Science).
  *   **Rule B: The Methodological Risk (Popperian).** Science requires **risky claims** that are exposed to refutation, regardless of who makes them.
      *   *Fits:* Newton, Plate Tectonics, Maverick, Homeopathy (rejection).
      *   *Predicts:* String Theory (Non-Science, no risk), Parapsychology (Science), Maverick (Science).

  **The Conflict:**
  *   **String Theory:** Rule A says **Science** (Community); Rule B says **Non-Science** (No Risk).
  *   **The Maverick:** Rule A says **Non-Science** (No Community); Rule B says **Science** (High Risk).

  Based on her explicit reasoning ("community never concedes"), she is running **Rule A (The Sociological Norm)**. She is willing to tolerate a lack of risk/prediction (String Theory, Macro) but not a lack of community oversight (Maverick).

  ### 4. The Discriminating Case
  To definitively prove which rule she is running, you need a case that isolates **Community** from **Method**.

  **The Case:** **The Solitary Rigorist.**
  > Imagine a self-funded researcher working entirely alone, with no university affiliation and no peers. However, this person preregisters all hypotheses, publishes all raw data and null results on an open blog, explicitly invites criticism, and abandons hypotheses immediately upon falsification. They make risky predictions and are sometimes right, sometimes wrong.

  *   **If she counts this as Science:** She is actually running **Rule B (Methodological Risk)**. This would mean her rejection of the Maverick was due to the Maverick's lack of *honesty* (e.g., if he didn't publish nulls), not his lack of community. It would also force her to reconsider String Theory (if she rejected it).
  *   **If she counts this as Non-Science:** She is strictly running **Rule A (Sociological Norm)**. This confirms that for her, science is inherently a *collective enterprise*. It validates her verdict on the Maverick and implies that even perfect individual methodology is insufficient without a community to enforce it.

  **Why this discriminates:**
  The Solitary Rigorist has the *method* of the Parapsychology Unit but the *social structure* of the Maverick. Her verdict here will reveal whether "Science" is a set of actions an individual can take, or a status granted by a social system. Given her emphasis on "community concession," she will likely say **Non-Science**, revealing that her demarcation line is ultimately about **social accountability**, not just logical vulnerability.
