prompt: |-
  I chair an emergency resource-allocation committee for a regional disaster-response agency. Every week we receive more clinic aid requests than we can evaluate thoroughly; we have ninety minutes per file, incomplete post-event data, and a hard deadline before the next storm season. Rather than attempting an optimal allocation, we want a reusable decision procedure grounded in satisficing and bounded rationality—using aspiration-level thresholds for “good enough” demonstrated need, a recognition-primed stopping rule for information gathering, adaptive reference points drawn from the prior three allocations, and explicit hand-off points where value judgment must replace calculation. Write the procedure: the ordered questions to ask, what counts as a sufficient answer at each step, where it halts with approval or rejection, and where it requires human deliberation because the issue is one of values rather than facts. Then apply it to three requests: a rural clinic asking for backup generators after a mild winter storm that caused no infrastructure damage; an urban clinic with adequate current stock requesting preemptive trauma-kit upgrades justified only by projected future climate risk; and a clinic that clearly meets every aspiration threshold but serves a population with lower documented mortality risk, so that approval feels inequitable relative to past distributions. Include the case where the procedure yields a recommendation the committee is likely to resist, and state precisely what the procedure cannot settle—especially regarding opportunity costs across unknown future requests and equity adjustments that fall outside the aspiration levels.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Chair of an emergency resource-allocation committee for a regional disaster-response agency.
      *   **Context:** High volume of requests, limited time (90 mins/file), incomplete data, hard deadline (before next storm season).
      *   **Goal:** Create a reusable decision procedure based on *satisficing* and *bounded rationality* (not optimization).
      *   **Key Components Required:**
          *   Aspiration-level thresholds ("good enough" need).
          *   Recognition-primed stopping rule (when to stop gathering info).
          *   Adaptive reference points (based on prior 3 allocations).
          *   Explicit hand-off points (where values replace calculation).
          *   Ordered questions & sufficient answers.
          *   Halt conditions (approval/rejection).
          *   Application to three specific cases.
          *   Identification of limitations (what the procedure *cannot* settle).
      *   **Specific Cases to Test:**
          1.  Rural clinic, generators, mild storm, no damage.
          2.  Urban clinic, trauma kits, adequate stock, future climate risk justification.
          3.  Clinic meets thresholds but serves low mortality risk population (equity concern vs. past distribution).
      *   **Constraint:** Include a case where the procedure recommends something the committee might resist.

  2.  **Deconstruct the Theoretical Framework:**
      *   *Satisficing (Simon):* Don't maximize; find the first option that meets minimum criteria.
      *   *Bounded Rationality:* Acknowledge cognitive limits and time pressure.
      *   *Recognition-Primed Decision Making (Klein):* Use experience/patterns to recognize viable courses of action quickly.
      *   *Aspiration Levels:* Adjust expectations based on recent history (adaptive).
      *   *Value Hand-offs:* Explicitly mark where math ends and ethics begins.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Name:* Needs to sound official but functional. "Rapid Satisficing Allocation Protocol (RSAP)."
      *   *Structure:* Phased approach.
      *   *Phase 1: Triage & Aspiration Check.* (Is this request even in the ballpark?)
      *   *Phase 2: Information Gathering (Recognition-Primed).* (When do we stop looking?)
      *   *Phase 3: Adaptive Reference Check.* (How does this compare to recent wins?)
      *   *Phase 4: The Value Hand-off.* (Where do we vote based on ethics, not data?)
      *   *Phase 5: Final Determination.*

      *   *Refining the Components:*
          *   *Aspiration Levels:* Need concrete metrics (e.g., vulnerability index, current capacity gap).
          *   *Stopping Rule:* "No new contradictory evidence in 30 mins" or "Pattern matches prior approved cases."
          *   *Adaptive Reference:* Compare to last 3 approved files.
          *   *Value Hand-off:* Explicitly state "This is an equity call, not an efficiency call."

  4.  **Developing the Three Test Cases:**

      *   *Case 1 (Rural/Generators/Mild Storm):*
          *   *Facts:* No infrastructure damage. Request seems reactive to a non-event.
          *   *Procedure Application:* Likely fails aspiration levels for "demonstrated need."
          *   *Outcome:* Rejection.
          *   *Why:* Satisficing threshold for "urgent need" not met.

      *   *Case 2 (Urban/Trauma Kits/Future Risk):*
          *   *Facts:* Adequate stock. Justification is *future* climate risk.
          *   *Procedure Application:* Information gathering stops because "current capacity" is sufficient. Future risk is speculative (incomplete data).
          *   *Outcome:* Rejection or Deferral.
          *   *Why:* Fails the "current gap" aspiration.

      *   *Case 3 (Meets Thresholds/Low Mortality/Equity Issue):*
          *   *Facts:* Meets all technical criteria. But population has lower mortality risk than past approvals.
          *   *Procedure Application:* Technically passes Phases 1-3. Hits Phase 4 (Value Hand-off).
          *   *Outcome:* Procedure says "Approve" (based on thresholds), but Committee feels "Reject" (based on equity).
          *   *Why:* This highlights the limitation. The procedure optimizes for *need/capacity*, not *equity of outcome* across demographics.
          *   *Constraint Check:* The prompt asks to include a case where the procedure yields a recommendation the committee is likely to resist. This is that case.

  5.  **Drafting the Limitations Section:**
      *   Must address opportunity costs (we don't know future requests).
      *   Must address equity (aspiration levels are blind to demographic fairness).
      *   Must address the "Hard Deadline" pressure (might force satisficing too low).

  6.  **Refining the Tone:**
      *   Professional, bureaucratic but pragmatic, decisive.
      *   Avoid academic jargon where possible, but keep the theoretical integrity (Simon/Klein).
      *   Ensure the "Value Hand-off" is distinct.

  7.  **Review against Constraints:**
      *   90 minutes per file context? Yes, the procedure must be fast.
      *   Aspiration levels? Included.
      *   Recognition-primed stopping rule? Included.
      *   Adaptive reference points (prior 3)? Included.
      *   Explicit hand-off points? Included.
      *   Three specific cases applied? Yes.
      *   Case where committee resists recommendation? Yes (Case 3).
      *   What procedure cannot settle? Yes.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is the "Adaptive Reference" clear?
      *   *Fix:* Define it as the "Rolling Baseline." If the last 3 approvals had a vulnerability score of 80+, this one needs to be close to that.
      *   *Critique:* Is the "Value Hand-off" distinct enough?
      *   *Fix:* Make it a specific step where the Chair declares the shift from data to ethics.
      *   *Critique:* Case 2 is tricky. Future risk is valid but hard to measure.
      *   *Fix:* The procedure should treat "projected risk" as insufficient data under bounded rationality unless it meets a specific threshold of certainty.
      *   *Critique:* Ensure the "Resistance" case is clear.
      *   *Fix:* In Case 3, the procedure says "Yes" because thresholds are met, but the committee worries about fairness compared to high-mortality zones served previously. This creates the tension.

  9.  **Final Polish:** Check formatting for readability (bolding, lists). Ensure the distinction between *fact-based stopping* and *value-based deliberation* is sharp. (Proceed to generate output).

  *(Self-Correction Note during final review)*: Make sure I explicitly mention the 90-minute constraint in the procedure steps to ensure feasibility. Ensure the "Recognition-Primed" aspect emphasizes pattern matching over deep analysis.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  # RAPID SATISFICING ALLOCATION PROTOCOL (RSAP)
  **Version:** 4.2 (Pre-Storm Season)
  **Authority:** Regional Disaster-Response Agency, Resource-Allocation Committee
  **Time Budget:** 90 Minutes per File
  **Objective:** Achieve "good enough" allocation decisions under bounded rationality, prioritizing speed and consistency over optimization.

  ---

  ## I. THE PROCEDURE

  ### Phase 1: Aspiration-Level Screening (Minutes 0–15)
  *Goal: Determine if the request meets the minimum threshold of "demonstrated need" to warrant further review.*

  **Question 1.1:** Does the request address a *current* capacity gap or a *verified* infrastructure failure?
  *   **Sufficient Answer:** Yes, supported by incident report or inventory audit dated within last 30 days.
  *   **Insufficient Answer:** Request based on projected risk, hypothetical scenarios, or equipment older than 30 days without failure data.
  *   **Halting Rule:** If **No**, file is **Rejected**. Stop.

  **Question 1.2:** Is the requested resource magnitude within the standard deviation of the prior three approved allocations (The Rolling Baseline)?
  *   **Sufficient Answer:** Request is within ±20% of the average value/volume of the last three approved files.
  *   **Insufficient Answer:** Request is an outlier (e.g., 5x the usual generator request).
  *   **Halting Rule:** If **No**, flag for **Value Hand-off** (Phase 4). Do not reject yet.

  ### Phase 2: Recognition-Primed Information Gathering (Minutes 15–60)
  *Goal: Gather only enough data to confirm the pattern of a "standard approval." Stop when the pattern is recognized.*

  **Question 2.1:** Does the applicant's vulnerability profile match a previously approved "High Priority" pattern?
  *   **Method:** Compare applicant demographics and location against the last three approved files.
  *   **Sufficient Answer:** Pattern match found (e.g., "Same flood zone as File #2023-A").
  *   **Stopping Rule:** If a match is found, **Stop Gathering**. Proceed to Phase 3. Do not seek additional data.
  *   **Continuation Rule:** If no match, search for 15 more minutes. If still no match, flag for **Value Hand-off**.

  **Question 2.2:** Is there any single piece of "disqualifying evidence" (e.g., fraud flag, duplicate request)?
  *   **Sufficient Answer:** No disqualifiers found in central database.
  *   **Stopping Rule:** If **Yes**, file is **Rejected**. Stop.
  *   **Stopping Rule:** If **No** after 45 minutes of search, **Stop Gathering**. Assume sufficient. Proceed to Phase 3.

  ### Phase 3: Adaptive Reference Check (Minutes 60–75)
  *Goal: Ensure consistency with recent committee behavior to prevent drift.*

  **Question 3.1:** If approved, does this allocation maintain the rolling average of resource distribution established by the prior three approvals?
  *   **Sufficient Answer:** Yes, the allocation fits the recent trend.
  *   **Insufficient Answer:** Approval would skew the regional distribution significantly (e.g., over-saturating one county).
  *   **Halting Rule:** If **No**, flag for **Value Hand-off**.
  *   **Halting Rule:** If **Yes**, proceed to **Provisional Approval**.

  ### Phase 4: The Value Hand-off (Minutes 75–90)
  *Goal: Explicitly acknowledge where calculation ends and ethical judgment begins.*

  **Trigger:** This phase is mandatory if *any* flag was raised in Phase 1.2, Phase 2 (Continuation Rule), or Phase 3.
  **Procedure:**
  1.  **Chair Declaration:** "The data is insufficient for a satisficing decision. We are now deciding based on values, not facts."
  2.  **Deliberation Question:** "Given the opportunity cost, is the ethical imperative to prioritize *equity* (serving underserved populations) or *efficiency* (serving high-mortality risk populations) in this specific instance?"
  3.  **Vote:** Simple majority.
  4.  **Recording:** The rationale must be recorded as "Value Judgment," not "Data-Driven."

  ---

  ## II. APPLICATION TO PENDING REQUESTS

  ### Case 1: The Rural Clinic (Generators/Mild Storm)
  *   **Request:** Backup generators.
  *   **Context:** Mild winter storm, no infrastructure damage reported.
  *   **Procedure Application:**
      *   **Phase 1.1 (Capacity Gap):** *Fail.* No verified infrastructure failure. Request is based on "what if" rather than "what is."
      *   **Decision:** **Rejected.**
      *   **Rationale:** The aspiration level for "demonstrated need" was not met. Under bounded rationality, we cannot allocate scarce resources to hypothetical vulnerabilities when verified gaps exist elsewhere.
      *   **Time Used:** 15 Minutes.

  ### Case 2: The Urban Clinic (Trauma Kits/Future Risk)
  *   **Request:** Preemptive trauma-kit upgrades.
  *   **Context:** Adequate current stock. Justification is projected future climate risk.
  *   **Procedure Application:**
      *   **Phase 1.1 (Capacity Gap):** *Fail.* Current stock is adequate. The "gap" is speculative.
      *   **Phase 2.1 (Pattern Match):** *Fail.* Past approvals were based on *current* shortages, not *future* projections.
      *   **Decision:** **Rejected.**
      *   **Rationale:** The Recognition-Primed stopping rule triggered early. The pattern of "approved request" requires current insufficiency. Future risk modeling exceeds our 90-minute data verification capacity.
      *   **Time Used:** 30 Minutes.

  ### Case 3: The "Equity Tension" Clinic (Meets Thresholds/Low Mortality)
  *   **Request:** Full resource package.
  *   **Context:** Meets all aspiration thresholds (verified need, capacity gap). However, the population served has a lower documented mortality risk than populations served in the prior three allocations.
  *   **Procedure Application:**
      *   **Phase 1:** *Pass.* Verified need exists.
      *   **Phase 2:** *Pass.* Pattern matches prior approved files technically.
      *   **Phase 3 (Adaptive Reference):** *Flag.* While the *resource volume* matches the rolling baseline, the *outcome metric* (mortality risk reduction) is lower than the prior three approvals.
      *   **Phase 4 (Value Hand-off):** *Triggered.*
      *   **Procedure Recommendation:** **Provisional Approval.** (Technically, the file satisfies the satisficing criteria).
      *   **Committee Reaction:** **Likely Resistance.**
      *   **Why:** The committee knows that approving this request uses funds that could have gone to a higher-mortality zone that hasn't applied *yet*. The procedure validates *current* eligibility, but the committee feels the *opportunity cost* regarding unknown future requests.
      *   **Resolution:** This requires the Phase 4 Vote. The Chair must state: "The data says approve. The ethics question is: Do we reward the applicant who showed up first, or hold resources for a potentially sicker applicant who may not apply?"

  ---

  ## III. LIMITATIONS AND UNSETTLED QUESTIONS

  This procedure is designed for bounded rationality, not moral perfection. It explicitly cannot settle the following:

  **1. The Opportunity Cost of the Unknown**
  The RSAP evaluates requests *in isolation* against a *backward-looking* baseline (the prior three approvals). It cannot account for a high-priority request that has not yet been submitted.
  *   *Limitation:* In Case 3, the procedure recommends approval because the file is "good enough." It cannot calculate the value of saving the resource for a potentially more critical need that arises next week. This is a known blind spot of satisficing.

  **2. Equity vs. Efficiency Trade-offs**
  Aspiration levels are based on *need intensity* and *capacity gaps*, not demographic equity.
  *   *Limitation:* If the prior three approvals went to high-density urban zones (high mortality), the Rolling Baseline skews urban. A rural clinic with valid need might technically pass Phase 1 but fail Phase 3 (Adaptive Reference) simply because it doesn't match the recent *pattern*, not because it lacks merit. Conversely, Case 3 passes the technical check but fails the *distributive justice* check. The procedure identifies this tension in Phase 4 but offers no algorithmic solution.

  **3. The "Good Enough" Drift**
  Because the reference points are adaptive (based on the prior three allocations), the standards can drift downward during periods of low demand or upward during crises.
  *   *Limitation:* The procedure cannot guarantee consistent standards over the long term (e.g., across storm seasons). It only guarantees consistency relative to the immediate past.

  **4. The Value Hand-off Burden**
  Phase 4 explicitly dumps the hardest ethical dilemmas onto the Committee's limited deliberation time (the final 15 minutes).
  *   *Limitation:* If multiple files trigger Phase 4 in the same week, the 90-minute limit per file will be breached, or the deliberation will be rushed. The procedure identifies *where* the hard choice lies, but it does not reduce the cognitive load of making that choice.

  **Chair's Note:** We adopt this procedure not because it is fair in every instance, but because it is *executable* under the current constraints. When the procedure recommends approval (Case 3) and the committee feels resistance, that resistance is the signal that we are operating at the boundary of our resources, not the boundary of our rules. Vote accordingly.
