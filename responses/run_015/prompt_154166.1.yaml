      *   *Verdict:* None capture the full scope. The "Intergenerational Contract" is the missing piece. But sticking to the prompt's constraint: The Firm is the closest for the *fiscal* argument, but it collapses the *moral* one.

      *Discriminating Case:* The Unauthorized Resident. Why? Because the Club says "Eject," the Polity says "Tax/Rule." This breaks the "Voluntary Association" premise entirely.

