      *Wait, one more check:* The prompt asks "If none of them is adequate, say so, and tell me which single case would best discriminate..." I think the Firm is adequate for the *fiscal* claim but not the *moral* claim. The Municipality is better for the *political* claim. I should probably argue that no single analogy works for *all three* conclusions, which is the user's core suspicion. I will recommend the **Unauthorized Resident** case as the discriminator.

      *Final Plan:*
      1.  Table.
      2.  Asymmetries (Imports/Exports).
      3.  Conclusion Audit (1, 2, 3).
      4.  Moral/Fiscal Split.
      5.  Alternative Analogy Assessment.
      6.  Discriminating Case.

      *Let's refine the "Imports/Exports":*
      *   Club imports to Polity: Voluntariness, Excludability without consequence, Property Ownership.
      *   Polity has (Club lacks): Coercion over non-members, Birthright, Inherited Debt/Asset, Global Externalities.

      *Let's refine the Conclusion Audit:*
      *   C1 (Right to Exclude): Weakens because of Unauthorized (coercion without consent) and Birthright (non-voluntary).
      *   C2 (5-Year Rule): Weakens because of Age-Transfer (pensions matter more than 5 years) and Depressed Contributions (state caused the low dues).
      *   C3 (Incompatibility): Weakens because of Age-Transfer (migrants fix demographic collapse) and Insurance Shift (club isn't just insurance).

      *Let's refine the Alternatives:*
