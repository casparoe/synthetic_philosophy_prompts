  4.  **Synthesize: Plato vs. DSM-5:**
      *   **Conflict:** Plato sees drinking as a civic/moral issue. DSM-5 sees it as a medical/psychological issue.
      *   **Plato's Critique:** He'd likely find the DSM-5 too passive. It asks "Does this hurt you?" whereas Plato asks "Does this make you unjust?"
      *   **Plato's Agreement:** He'd agree that loss of control is bad. The DSM-5 criteria about "unable to cut down" or "failure to fulfill obligations" would resonate with his idea of losing rational command.
      *   **The "Missing Point":** The DSM-5 doesn't care if you drink virtuously. It cares if you drink *safely*. Plato cares if you drink *well* (in the moral sense).
      *   **The Rehab Setting:** Plato would hate the idea of "treatment" as merely stopping the behavior. He'd want "education" of the soul. Abstinence might seem like a cowardly avoidance of the test to him.

