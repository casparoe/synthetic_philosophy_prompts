  2.  **Recall/Research Plato's View on Alcohol (specifically *The Laws*):**
      *   In *The Laws*, the Athenian Stranger (often a mouthpiece for Plato) argues *for* the inclusion of wine in the ideal city, but under strict regulation.
      *   Why? To test character. Can you remain virtuous when your inhibitions are lowered?
      *   Drunkenness isn't inherently evil; *uncontrolled* drunkenness is.
