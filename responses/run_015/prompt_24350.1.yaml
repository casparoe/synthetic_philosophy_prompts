answer: |-
  Here is a principle constructed to capture your specific set of intuitions, followed by the prediction and the stress test you requested.

  ### The Principle of Relevant Moral Standing

  A person has the **standing** to criticize another for a wrongdoing if and only if they are not currently engaged in the same specific moral failing, unless the past failing is morally distinct in kind or domain. Their **authority** (the weight their criticism carries) is enhanced by past wrongdoing only if that experience grants unique insight into the *temptation* or *moral psychology* of the act, rather than just its consequences.

  This principle relies on three distinct clauses:

  1.  **The Hypocrisy Veto (Current Status):** You lack standing if you are *currently* committing the same specific wrong.
      *   *Covers:* **The Tax Evader.** Because he is actively under-reporting income, he is currently guilty of the same specific vice (financial dishonesty regarding the state) as the colleague. The scale difference is irrelevant to standing; the ongoing participation voids his right to judge.
  2.  **The Distinction Clause (Relevance):** You retain standing if your past wrongdoing differs significantly in *moral kind* or *social domain* from the accusation you are making.
      *   *Covers:* **The Parent (Lying)** and **The Roommate (Money).**
      *   *Parent:* Protective lying (benevolent intent) is morally distinct from a child's lying (often selfish/avoidant). The "kind" is different.
      *   *Roommate:* A private loan between friends (informal, relational) is a different social domain than a rental contract (formal, legal, third-party). The "domain" is different enough that the past debt doesn't impair standing on rent.
  3.  **The Insight Bonus (Epistemic Weight):** You gain *enhanced* authority (more than a non-offender) only if your past wrongdoing allows you to speak credibly to the *internal struggle* or *temptation* involved, not just the external harm.
      *   *Covers:* **The Coach (Doping)** vs. **The Brother (Smoking).**
      *   *Coach:* Doping is a choice driven by competitive temptation and integrity. An ex-doper understands the *lure* of cheating in a way a clean coach cannot. This grants enhanced authority.
      *   *Brother:* Smoking cessation is often framed around health outcomes and habit-breaking. A non-smoker can understand the health risks just as well as an ex-smoker. The ex-smoker's past does not grant unique insight into the *moral* temptation, only the physical habit, so he has standing but no *enhanced* authority over a never-smoker.

  ***

  ### Prediction: The "Never-Tempted" Critic

  **Case:** A person who has never done the thing and has never been tempted to (e.g., someone with no genetic addiction predisposition, or a person of such rigid integrity they never felt the pull) criticizes someone who has.

  **Prediction:**
  According to the **Hypocrisy Veto**, they have full **standing**. They are not currently guilty, nor were they previously.
  However, according to the **Insight Bonus**, they have **lower persuasive authority** than a reformed offender (like the Coach), and potentially equal or slightly lower authority than a non-offender who understands the struggle intellectually.

  **Why:** Because they lack the "hard-won" insight into the *temptation*. Their criticism may be factually correct, but it risks sounding "hollow" or "privileged" because they cannot say, "I know how hard this is." They can only say, "This is wrong." In your framework, they are the baseline against which the Brother (neutral) and Coach (enhanced) are measured. They are the "person who never smoked" in Case 1.

  ***

  ### The Stress Test: Which Case Must Drop?

  If we tighten this principle to be more rigorous, the case most likely to break is **Case 5 (The Roommate/Money)**.

  **The Conflict:**
  The **Distinction Clause** relies on the idea that a "friend loan" and "rent" are different domains. However, a stricter principle of **General Financial Integrity** would argue that both are instances of "failing to pay money you owe when it is due."
  *   If the principle is: *"You cannot criticize financial irresponsibility if you are currently financially irresponsible,"* then the friend who never returned borrowed money is *currently* in a state of financial default.
  *   Under this stricter view, his past (which is effectively a present unresolved debt) bleeds into the rent issue. Both reveal a disregard for financial obligations.

  **Would you drop it?**
  If forced to choose between keeping the **Distinction Clause** (saving Case 5) or adopting **General Financial Integrity** (killing Case 5):

  *   **Argument to Drop Case 5:** If the friend still hasn't returned the money, he is actively withholding funds that aren't his. This is arguably the same moral failing as withholding rent. The "domain" difference is legalistic, not moral. Both are "keeping what you owe."
  *   **Argument to Keep Case 5:** Social norms treat debts differently. Rent is a strict contract with a third party; friend loans are informal and often nebulous regarding repayment terms. The *expectation* of immediacy is different.

  **My Assessment:**
  You would likely **keep Case 5**. Your intuition distinguishes between "relational ambiguity" (friend loan) and "contractual clarity" (rent). To drop it would require you to view all financial obligations as morally identical, which contradicts how we navigate social relationships (e.g., we forgive friends debts we would never forgive a bank).

  However, the deeper tension lies between **Case 1 (Brother)** and **Case 3 (Coach)**.
  If you believe *any* experience of overcoming a vice grants enhanced authority, you must upgrade the Brother's status. If you believe *no* past vice grants enhanced authority (because "do as I say, not as I did"), you must downgrade the Coach.
  Your current intuition holds that **moral temptations** (doping) grant authority, but **health habits** (smoking) do not. If you find this distinction unstable, **Case 1** is the one to drop: you should probably admit the ex-smoker *does* have more authority than a never-smoker, because they can speak to the difficulty of withdrawal, not just the health risk.
