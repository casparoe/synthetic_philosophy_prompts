answer: |-
  # The Consciousness Decision Tree (A4 Instrument)

  **Instructions:** Start at Q1. Follow the path that matches your intuition about the *nature* of consciousness, not just your preferred terminology. Answer "Yes" or "No" to proceed.

  **Q1. Target:** Are we explaining *what it feels like* to be in a state (phenomenal), or just the ability to *report/use* the state (access)?
  *   **No (Access only):** → **Leaf 1: Access/Attentional View.** (Consciousness is global availability. Blindsight patients lack access, not vision.)
  *   **Yes (Phenomenal):** → Go to Q2.

  **Q2. Requirement:** Can a first-order state (e.g., seeing red) be conscious *without* any awareness *of* that state?
  *   **Yes (FO Sufficient):** → **Leaf 2: First-Order Representationalism.** (The absorbed athlete is conscious; no inner glance needed. Autopilot taxi driver is the puzzle case.)
  *   **No (HO Required):** → Go to Q3.

  **Q3. Structure:** Is the awareness *of* the state a *separate* mental state, or built into the first-order state itself?
  *   **Built-in:** → **Leaf 3: Self-Representationalism.** (One state represents the world and itself. *Doubled Monitor* case impossible here.)
  *   **Separate:** → Go to Q4.

  **Q4. Nature:** Is the higher-order state more like a *thought* (conceptual) or a *scan/perception* (non-conceptual)?
  *   **Scan/Perception:** → **Leaf 4: Higher-Order Perception (HOP).** (Handles fine-grained wine tasting/animal experience better.)
  *   **Thought:** → Go to Q5.

  **Q5. Status:** Must the higher-order state be *active right now*, or just *available on demand*?
  *   **Available:** → **Leaf 5: Dispositional HOT.** (Absorbed/Hot Tub cases are conscious; you don't need to actively think about them.)
  *   **Active:** → Go to Q6.

  **Q6. Inferentiality:** Is the higher-order state arrived at by *inference/evidence* (e.g., "I am shouting, so I must be in pain")?
  *   **Yes (Inferred):** → **Leaf 6: [UNNAMED / EMPTY].** (See notes below.)
  *   **No (Immediate):** → Go to Q7.

  **Q7. Veridicality:** If the higher-order state misrepresents (e.g., *Swapped Monitor*: says "pain" when there is none; or *Late Monitor*: arrives 400ms after stimulus), is there consciousness?
  *   **Yes (Misrep OK):** → **Leaf 7: Actualist HOT.** (The HO state creates the phenomenality. *Late Monitor* implies retroactive consciousness.)
  *   **No (Must be True):** → Go to Q8.

  **Q8. Substrate:** If "The Rack" (a non-biological self-monitoring system) satisfies all previous "Yes/No" conditions, is it conscious?
  *   **Yes:** → **Leaf 8: Functionalist HOT.**
  *   **No:** → **Leaf 9: Biological/Embodied HOT.**

  ***

  ## Leaf Commentary & Empty Boxes

  *   **Leaf 1 (Access):** Often conflated with HOT, but denies the hard problem. Blindsight is the key test.
  *   **Leaf 2 (FOR):** Risks making the taxi driver (autopilot) conscious when intuition suggests otherwise.
  *   **Leaf 3 (Self-Rep):** Elegant, but struggles with *Doubled Monitor* (how can one state have two contradictory self-representations?).
  *   **Leaf 4 (HOP):** Solves the "fine-grained experience" problem (wine/animals) but risks an infinite regress of scanners.
  *   **Leaf 5 (Dispositional):** Saves the "absorbed athlete," but critics say it collapses into First-Orderism (Leaf 2).
  *   **Leaf 6 (EMPTY - Inferential HOT):** **Why Empty?** Incoherent/Unattractive. If consciousness depends on inferring you are in a state, it becomes a theory of *self-knowledge*, not phenomenality. It explains how you know you're conscious, not what makes you conscious.
  *   **Leaf 7 (Actualist):** Embraces *Swapped Monitor* (you feel pain even if no pain exists). *Late Monitor* is the stress test: if you accept this, you accept consciousness can be retroactive.
  *   **Leaf 8 & 9 (Substrate Split):** **Hard to Separate.** If your theory is purely functional, Leaf 8 is inevitable. Leaf 9 usually requires smuggling in biological assumptions not present in Q1–Q7.

  ***

  ## Case Scoring Key (Quiz for the Group)

  *Use this to check consistency. If a student's answers to the Cases contradict their path on the Tree, they are holding an unstable position.*

  | Case | The Intuition Pump | Consistent Leaf(s) | Inconsistent With |
  | :--- | :--- | :--- | :--- |
  | **Absorbed Athlete** | Conscious but not thinking about it. | 2, 5 | 1, 7 (Strict Occurrent) |
  | **Autopilot Taxi** | Driving but "conscious of nothing". | 1, 7 (Strict) | 2, 5 |
  | **Blindsight** | Vision without report/feeling. | 1 (Access) | 2, 4, 5 (if they claim blindsight is conscious) |
  | **Fine-Grained Wine** | Experience exceeds concepts. | 2, 4 | 7 (Strict Conceptual) |
  | **Swapped Monitor** | HO says "Pain", FO is null. | 7 | 2, 3, 4, 8, 9 |
  | **Late Monitor** | HO arrives 400ms post-stimulus. | 7 (Retroactive) | All others (Must be simultaneous) |
  | **Doubled Monitor** | One FO, two contradictory HOs. | 3 (Impossible) | 7 (Which HO wins?) |
  | **The Rack** | Artificial self-monitoring system. | 1, 2, 7, 8 | 9 |

  **The "Workhorse" Question:** **Q1 (Target).** This splits the room immediately between those solving the "Hard Problem" (Phenomenal) and those solving the "Easy Problem" (Access). Most talking-past-each-other happens here.

  **The "Dud" Question:** **Q6 (Inferentiality).** Expect almost everyone to answer "No" (Immediate). It exists primarily to generate the Empty Box (Leaf 6) and show why self-knowledge theories fail as consciousness theories.

  **The "Trap" Pair:** **Q7 (Veridicality) & Q8 (Substrate).**
  *   *Expect this inconsistency:* A student claims *Swapped Monitor* creates consciousness (Leaf 7 logic) but denies *The Rack* is conscious (Leaf 9 logic).
  *   *Why it's a trap:* If consciousness is generated by the functional role of the HO state (regardless of accuracy), denying it to a functionally identical machine is difficult to justify without appealing to biology outside the tree.

  **Note on Doubled Monitor:** If a student lands on Leaf 7 (Actualist), ask them: "If I have two Higher-Order states, one saying 'Red' and one saying 'Green' about the same patch, do I see red, green, or both?" If they hesitate, the "Separate State" assumption (Q3) is doing too much work.
