prompt: |-
  My city's land-use process has a shape I cannot make philosophical sense of, and I would like its implicit theory made explicit rather than argued for or against.

  Here is how it works, as I understand it. Most residential land is zoned single-family. Putting two or more units on a lot zoned single-family requires a discretionary permit: the city mails notice to owners of record within three hundred feet, holds a public hearing before the planning commission and then before the council, and issues written findings. Incompatibility with what the staff reports call neighborhood character, added traffic, loss of curbside parking, and shadow are all accepted grounds for denial, and none of them has to be quantified or shown to reduce anyone's property value. Opponents may also sue under the state environmental-review statute on the ground that the city's analysis was inadequate, which routinely adds a year or more; the delay is part of what opposition buys. By contrast, demolishing a house on the same lot and replacing it with one very large single-family house is approved ministerially: no notice, no hearing, no appeal, even when the replacement generates more traffic and more shadow than the duplex would have. Meanwhile the same council is under a state mandate to plan for several thousand additional homes over the next decade, and fair-housing law forbids the city, and largely forbids sellers and landlords, from selecting occupants by race, by family status, or, in some states, by source of income. The neighborhood therefore cannot say who may live on a street, though through the permit process it can determine roughly what the housing there will cost. Last year the council added a second track: projects within a quarter mile of a frequent bus line, and projects in which at least a fifth of the units are income-restricted, are now approved ministerially, with no hearing and no appeal, while everything else keeps the full process; and in the older streetcar-era neighborhoods near downtown it simultaneously adopted an overlay that strengthens the hearing requirement and adds design review. Nobody is compensated when the council approves over objection, and nobody pays anything when it denies.

  Five features of this package strike me as pulling in different directions. First, standing is set by parcel and radius rather than by stake: someone who bought last month and a family that has lived on the block for fifty years have identical standing, the tenant next door is not notified at all even when the project would demolish the building she lives in, and the people who would occupy the new units are not parties, are not counted, and are not notified, despite being more numerous and, by any ordinary measure of intensity, more strongly affected. Second, the intensity of opposition is itself recorded as evidence of harm: findings recite how many letters arrived and how many residents signed up to speak, and a large turnout counts in favor of denial, while no comparable tally is taken on the other side and intensity is never weighed against intensity. Third, the veto reaches the form of other people's property but not its occupancy or its ordinary use: a neighbor cannot be stopped from painting the house, keeping several cars on the property, or selling to anyone at all, but can be stopped from adding a second unit. Fourth, the same objection now has no force two blocks from a bus line and full force three blocks away, and is treated as defeasible by transit proximity and by subsidy while being hardened in the overlay districts. Fifth, the process contains no symmetric affirmative power: residents can block a great deal and compel nothing.

  What I want is the view of a person's claim on a place that this bundle presupposes, and I can think of five candidates. The first treats homeownership as an undiversifiable stake in a local collective asset whose value depends on the built and social character of the immediate area, with the veto as the protection of that stake. The second treats residence as membership in a self-governing community with a collective right to determine the shape of its common life, a right to the city as a right to shape rather than merely a right of access. The third treats the process as the protection of legitimate expectations formed under an earlier set of rules about school capacity, parking, quiet, and outlook. The fourth treats the hearing as an information-eliciting device, on the assumption that nearby residents know local facts that planners do not. The fifth says the practice is not the expression of any view at all but the predictable result of concentrated benefits and diffuse costs.

  For each of these, tell me whether the practice as I have described it strictly presupposes the view, is merely compatible with it, or actually conflicts with some feature of it; and be explicit about where my description underdetermines the answer, in the sense that two or three of the theories would license exactly the process I have described, and about which single change to the process would best discriminate between them. Then tell me what would have to change if the city replaced the presupposed view with one of the others: what a process built on the investment-stake view would look like as opposed to one built on the membership view, what a process built on the protection of expectations would substitute for the veto, and what a process honestly designed to elicit local information would do with a roomful of angry residents and a petition.

  I am less interested in whether the neighbors are right than in what the city commits itself to by running things this way. In particular: is the two-track reform an admission that the veto was never a right but only a defeasible privilege, and what principle is the city adopting when it removes that privilege near transit while reinforcing it, through the overlay, in the neighborhoods that are oldest, most central, and most able to afford lawyers?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Analyze a specific land-use process described by the user.
      *   **Goal:** Make the *implicit theory* of the process explicit, not argue for/against it.
      *   **Input:** A detailed description of a city's zoning/permitting system (single-family default, discretionary permits for multi-unit, ministerial for large single-family, state mandates, recent two-track reform, specific procedural features like standing, intensity of opposition, veto power vs. affirmative power, etc.).
      *   **Specific Questions:**
          1.  Evaluate five candidate theories (Investment-Stake, Membership/Community, Legitimate Expectations, Information-Eliciting, Public Choice/Concentrated Benefits) against the described practice. (Strictly presupposes? Merely compatible? Conflicts?)
          2.  Identify where the description underdetermines the answer (theories licensing the same process).
          3.  Identify a single change to the process that would best discriminate between the theories.
          4.  Describe what the process would look like if built on each of the alternative views (Investment vs. Membership vs. Expectations vs. Information).
          5.  Address the specific philosophical implication of the "two-track reform" (admission of privilege vs. right? principle adopted regarding transit vs. historic overlays).
      *   **Constraint:** Do not argue whether neighbors are right/wrong. Focus on what the city *commits itself to*.

  2.  **Deconstruct the Land-Use Process (The "Data"):**
      *   *Default:* Single-family (SF) is ministerial (easy). Multi-family (MF) is discretionary (hard).
      *   *Discretionary Process:* Notice to owners (300 ft), hearings (Planning + Council), written findings.
      *   *Grounds for Denial:* Character, traffic, parking, shadow (unquantified, no property value proof needed).
      *   *Delay:* CEQA (environmental review) lawsuits add delay; delay is a feature, not a bug.
      *   *Asymmetry:* Large SF house = ministerial. Duplex = discretionary (even if impacts are lower).
      *   *Demographics:* Can't select occupants (fair housing), but can select housing type (cost proxy).
      *   *Reform (Track 2):* Near transit or affordable = ministerial.
      *   *Reform (Overlay):* Historic/central areas = *stronger* hearing/design review.
      *   *Standing:* Owners within radius (tenants excluded, future residents excluded).
      *   *Evidence:* Opposition intensity counts as harm. No counter-tally.
      *   *Power:* Veto exists. Affirmative power (compelling change) does not.
      *   *Compensation:* None for approval; none for denial.

  3.  **Evaluate the Five Candidate Theories:**

      *   *Theory 1: Investment-Stake (Home as Financial Asset).*
          *   *Fit:* Explains the veto (protect value). Explains owner standing (financial stake).
          *   *Conflict:* Why allow massive SF teardowns (which change character/shadow more than duplexes) ministerially? If it's about value/character, a mansion should be scrutinized more than a duplex. Why no compensation if value is protected property right? (Takings clause issues usually require compensation if it's a *taking*, but here it's about *protecting* value). The asymmetry (SF vs. MF) weakens this. If the goal is protecting value, MF might increase it.
          *   *Verdict:* Compatible with the veto/standing, but conflicts with the SF/MF asymmetry.

      *   *Theory 2: Membership/Community (Right to Shape Common Life).*
          *   *Fit:* Explains "neighborhood character." Explains why current residents decide (members). Explains veto (community consent).
          *   *Conflict:* Tenants are excluded (they live there but aren't "members" in the property sense). Future residents excluded. The "Two-Track" reform undermines this (state/transit overrides local community will). The Historic Overlay strengthens it (some communities are *more* equal).
          *   *Verdict:* Strongly compatible with the status quo ante, but the recent reforms (transit ministerial) conflict with pure local sovereignty.

      *   *Theory 3: Legitimate Expectations (Reliance Interest).*
          *   *Fit:* Explains resistance to change (bought under Rule A, don't want Rule B). Explains "character."
          *   *Conflict:* Why is a new SF house okay (changing physical expectations) but a duplex not? The expectation is usually about *density*, not just mass. The Historic Overlay fits this best (locking in expectations). The Transit Track violates this (changing the rules mid-game).
          *   *Verdict:* Compatible with the SF/MF distinction (expectation of low density), but conflicts with the lack of compensation for "taking" of expectations via the Transit Track.

      *   *Theory 4: Information-Eliciting (Local Knowledge).*
          *   *Fit:* Hearings gather info.
          *   *Conflict:* Intensity counts as *harm*, not just data. No weight given to counter-info (housing need). Tenants (who know the building best) are excluded. SF teardowns don't trigger info gathering despite similar impacts.
          *   *Verdict:* Conflicts significantly. The process treats opposition as *political power*, not *information*.

      *   *Theory 5: Public Choice (Concentrated Benefits/Diffuse Costs).*
          *   *Fit:* Explains everything perfectly. Concentrated owners get veto. Diffuse future renters get nothing. Delay is a weapon. Reforms are political compromises (state mandate vs. local power).
          *   *Conflict:* None really. This is a descriptive theory of *cause*, not a normative theory of *right*. The prompt asks for the view of a "person's claim on a place" the bundle *presupposes*. Public Choice says there *is* no moral claim, just power.
          *   *Verdict:* Compatible as an explanation, but if the city *claims* it's about "character" or "process," Public Choice suggests that's a mask. However, as a *presupposed view of rights*, it presupposes *none*. It treats the process as a battleground, not a rights framework.

  4.  **Underdetermination & Discrimination:**
      *   *Underdetermination:* Investment-Stake and Membership look very similar here. Both justify owner veto. Both explain the SF/MF split (MF threatens investment/community more than SF).
      *   *Discriminator:* *Compensation.* If it's a property right (Investment), denying a permit that reduces value should arguably trigger compensation (regulatory taking). If it's Membership, it's a privilege of citizenship/residency.
      *   *Better Discriminator:* *Tenant Standing.* Membership implies residents (tenants) should vote. Investment implies owners. The process excludes tenants. This discriminates between Investment and Membership.
      *   *Best Discriminator:* *The SF Teardown Asymmetry.* If it's about Character/Expectations/Investment, a massive mansion changes the neighborhood more than a duplex. Allowing it ministerially contradicts Theories 1, 2, and 3. It supports Theory 5 (Owners don't mind mansions, they mind renters).

  5.  **Designing Alternative Processes:**
      *   *Investment-Stake:* Needs compensation mechanisms (TDRs, value guarantees). Standing based on equity, not just address.
      *   *Membership:* Tenants must vote. Future residents represented (advocate). Consensus model, not veto.
      *   *Expectations:* Grandfathering + Buyouts. If you change the rules, you pay for the reliance interest.
      *   *Information:* Blind review of impacts. Opposition letters counted as data points, not votes. Expert testimony weighted higher than emotion.

  6.  **Analyzing the Two-Track Reform:**
      *   *Transit (Ministerial):* Admits the veto is a privilege granted by the state, not a natural right. It's defeasible by higher policy goals (climate/housing).
      *   *Historic Overlay (Strengthened):* Admits some communities have *more* claim than others. Wealth/History buys stronger rights.
      *   *Principle:* "Pragmatic Zoning." The right to exclude is a commodity to be traded. It is removed where state pressure is high (transit mandates) and fortified where political resistance is organized/wealthy (historic). It treats land use rights as *negotiable privileges* rather than *fundamental entitlements*.

  7.  **Drafting the Response:**
      *   *Tone:* Philosophical, analytical, neutral (as requested).
      *   *Structure:*
          1.  Evaluation of the 5 theories (Presupposes/Compatible/Conflicts).
          2.  Underdetermination & Discriminating Change.
          3.  Alternative Process Designs.
          4.  Analysis of the Two-Track Reform.
      *   *Refinement:* Ensure I answer the specific question about "what principle is the city adopting." Ensure I distinguish between "presupposes" (logical necessity) and "compatible" (could be true).
      *   *Self-Correction on Theory 5:* Theory 5 is positive (is), not normative (ought). The prompt asks for the view of a *claim*. Theory 5 says there is no valid claim, only power. I need to frame this carefully. It presupposes a *realist* view of claims (claims are only what you can enforce).
      *   *Refining the "Discriminator":* The SF vs. MF asymmetry is the strongest logical wedge. If the claim is about "Character" (Theory 2) or "Investment" (Theory 1), a mansion disrupts more than a duplex. The fact that the mansion is allowed ministerially proves the claim isn't about physical impact, but about *tenure type*. This points strongly to Theory 5 (exclusionary) or a specific version of Theory 3 (expectation of *single-family tenure* specifically).
      *   *Refining the "Two-Track":* The prompt asks if it's an admission that the veto was a privilege. Yes. And the principle? *Differential Sovereignty.* Some neighborhoods are sovereign (historic), others are administrative zones (transit).

  8.  **Final Polish:** Check against constraints. No arguing for/against. Make implicit theory explicit. Ensure all sub-questions are answered. (The "single change" question needs a specific procedural tweak).

      *   *Single Change:* Require standing for tenants. (Distinguishes Investment from Membership).
      *   *Wait, better one:* Require ministerial review for SF teardowns comparable to MF. (Distinguishes Impact-based theories from Tenure-based theories). Let's go with the Standing one, as it addresses the "claim on a place" aspect more directly. Actually, the SF/MF asymmetry is more damning for the normative theories. Let's suggest *quantifying impacts for SF teardowns*. If the city refuses, it proves it's not about impacts (Theories 1, 3, 4).

      *   *Let's stick to the prompt's request:* "Which single change to the process would best discriminate between them?"
      *   *Idea:* Grant standing to tenants.
          *   Investment: No (no equity).
          *   Membership: Yes (they live there).
          *   Expectations: No (transient).
          *   Information: Yes (they know the building).
          *   Public Choice: No (they have less power).
      *   *Idea:* Require compensation for denial.
          *   Investment: Yes (taking).
          *   Membership: No (privilege).
      *   *Decision:* Compensation is the classic legal discriminator for property rights. Standing is the classic sociological discriminator. I will propose *Compensation for Denial* as it cuts to the heart of "Claim on a Place" (Property Right vs. Privilege).

      *   *Wait, looking closer at the prompt:* "what single change... would best discriminate between them."
      *   If I add compensation: Theory 1 says "Yes, that's what I meant." Theory 2 says "No, membership isn't tradable." Theory 3 says "Maybe, for reliance." Theory 5 says "Impossible, costs are diffuse."
      *   If I add Tenant Standing: Theory 1 says "No." Theory 2 says "Yes."
      *   Let's go with *Tenant Standing*. It directly addresses the "claim on a place" (residence vs. ownership).

      *   *Re-evaluating the Two-Track:* The prompt asks "is the two-track reform an admission that the veto was never a right but only a defeasible privilege." I need to answer this directly. Yes. And "what principle is the city adopting?" The principle of *Instrumental Zoning* or *Tiered Sovereignty*.

      *(Self-Correction during drafting)*: Be careful not to sound like I'm endorsing Theory 5. The prompt asks what the *bundle presupposes*. If the bundle acts like Theory 5, I should say so. But Theory 5 is an *explanation*, not a *justification*. The prompt asks for the "view of a person's claim." Theory 5 says "There is no moral view, only power." I should frame it as "The process treats claims as functions of political capacity."

      Let's refine the "Underdetermination" section. Theories 1 (Investment) and 3 (Expectations) are very hard to distinguish here. Both justify owner veto. Both explain the SF/MF split (MF violates expectation of low density). The discriminator needs to be about *what* is being protected. Is it value (1) or the status quo (3)? A rise in value from development would satisfy 1 but violate 3. So, *tracking property value changes* would discriminate. If the city denies a project that *increases* neighbor values, it contradicts Theory 1 and supports Theory 3.

      Okay, I have a plan.
      1. Assess the 5 theories.
      2. Identify Underdetermination (1 & 3 are close).
      3. Propose Discriminator (Valuation vs. Status Quo).
      4. Design Alternative Processes.
      5. Analyze the Two-Track Reform.

      Let's write.
answer: |-
  This analysis treats the land-use process not as a policy to be evaluated, but as a text to be interpreted. The procedures, standing rules, and asymmetries you describe constitute a practical philosophy of property and place. Below is an explication of that philosophy, tested against your five candidates.

  ### I. Evaluation of the Five Candidates

  **1. The Investment-Stake View**
  *Homeownership as an undiversifiable financial asset.*
  *   **Verdict:** **Compatible but Incomplete.**
  *   **Analysis:** The process aligns with this view in granting standing to owners of record and providing a veto to prevent changes that might threaten value (via "character" or "parking"). However, it conflicts with the **Single-Family Asymmetry**. If the goal is protecting financial stake and neighborhood character, a teardown mansion generates more shadow, traffic, and mass than a duplex, yet it faces no scrutiny. This suggests the protected "value" is not the general amenity of the block, but specifically the *exclusivity* of the tenure. Furthermore, the lack of compensation when a permit is denied conflicts with a pure investment view; if the veto is a property right protecting value, the *denial* of a permit that would increase regional supply (and potentially local values) acts as a regulatory taking of the developer's asset without compensation, which the process accepts as normal.

  **2. The Membership View**
  *Residence as membership in a self-governing community.*
  *   **Verdict:** **Conflicts.**
  *   **Analysis:** This theory is strongly suggested by the "neighborhood character" findings and the hearing process, which resembles a town hall. However, the process explicitly excludes tenants from notice and standing, even when they face demolition. If residence were the basis of membership, tenants would be voting members. Additionally, the **Two-Track Reform** conflicts with this view. If the neighborhood is a self-governing community, the state cannot override its veto power near transit lines without dissolving the membership claim. The process treats membership as revocable by higher authority, which negates the "self-governing" premise.

  **3. The Legitimate Expectations View**
  *Protection of reliance interests formed under prior rules.*
  *   **Verdict:** **Strictly Presupposed (with caveats).**
  *   **Analysis:** This is the strongest fit for the status quo ante. Residents bought under a regime of single-family exclusivity; the discretionary permit protects that reliance. The "character" findings are codified expectations. The **Historic Overlay** is the purest expression of this theory: it locks in expectations permanently. However, the **Transit Track** (ministerial approval near bus lines) actively violates this view. It changes the rules mid-game for a subset of owners, signaling that expectations are only valid when they do not conflict with state housing mandates. The process presupposes expectations are real claims, but subordinate to state planning goals.

  **4. The Information-Eliciting View**
  *Hearings as data-gathering for better planning.*
  *   **Verdict:** **Conflicts.**
  *   **Analysis:** A process designed to elicit information would weigh testimony based on factual accuracy, not volume. Your description notes that "intensity of opposition is itself recorded as evidence of harm." In an information model, 100 letters saying "I don't like this" is zero data points on traffic or shadow. Furthermore, excluding tenants (who possess intimate knowledge of the existing building's condition and usage) while including non-resident owners within a 300-foot radius reduces the quality of local information. The process treats the hearing as a **plebiscite**, not an inquiry.

  **5. The Public Choice View**
  *Concentrated benefits and diffuse costs.*
  *   **Verdict:** **Strictly Presupposed (as operational logic).**
  *   **Analysis:** While this is a descriptive theory of *cause* rather than a normative theory of *right*, the process operates exactly as this view predicts. Standing is granted to those with the resources to organize (owners), not those most affected (tenants/future residents). Delay is weaponized ("opposition buys" time). The asymmetry (SF vs. MF) exists because existing owners generally prefer larger houses (which they might build) over more neighbors (who they cannot control). The Two-Track reform is a classic political compromise: concede ground where the state exerts pressure (transit/housing mandates) and fortify defenses where local political capital is highest (historic/wealthy overlays). The process presupposes that claims on place are determined by **political capacity**, not moral right.

  ### II. Underdetermination and Discrimination

  **Where the Description Underdetermines the Answer**
  The **Investment-Stake (1)** and **Legitimate Expectations (3)** views are functionally indistinguishable in this specific process. Both justify owner standing. Both justify the Single-Family/Multi-Family asymmetry (since MF violates the expectation of low density, which underpins the investment thesis). Both accept the lack of compensation for denial (as a regulatory police power). The process as described licenses both theories equally; one could argue the city is protecting property values *by* protecting the expectations that sustain them.

  **The Single Change to Discriminate**
  To distinguish between **Investment-Stake (1)** and **Legitimate Expectations (3)**, the city should **require a property-value impact analysis for all discretionary permits.**
  *   **If the city denies a project that staff analysis shows would *increase* surrounding property values:** It contradicts the Investment-Stake view (why block value creation?) and confirms the Legitimate Expectations view (the physical change violates the status quo regardless of market effect).
  *   **If the city only denies projects that decrease value:** It confirms the Investment-Stake view.

  To distinguish **Membership (2)** from **Investment (1)**: **Grant standing to tenants.**
  *   **If standing is granted:** The claim is based on residence (Membership).
  *   **If standing is denied:** The claim is based on equity/title (Investment).

  ### III. Alternative Process Designs

  If the city were to replace the current presupposed view (a hybrid of Expectations and Public Choice) with one of the others, the process would transform as follows:

  **1. A Process Built on the Investment-Stake View**
  *   **Mechanism:** **Transferable Development Rights (TDRs) and Value Guarantees.**
  *   **Design:** If a neighbor blocks a project, they must purchase the development rights from the owner at market rate. If a project is approved, neighbors who can prove a diminution in property value are compensated by a levy on the new units.
  *   **Logic:** This treats the "right to exclude" as a tradable commodity. It monetizes the veto. It would likely result in more development, as neighbors would only block projects where the harm to their equity exceeded the developer's profit.

  **2. A Process Built on the Membership View**
  *   **Mechanism:** **Residential Stakeholder Assemblies.**
  *   **Design:** Standing is granted to all adult residents (owners and tenants) within the radius. Decisions are made by supermajority vote of the assembly, not the City Council. Future residents are represented by a housing advocate with veto power over exclusions.
  *   **Logic:** This treats the neighborhood as a polity. It would likely slow development (more veto players) but increase legitimacy among actual dwellers. It removes the "owner" privilege.

  **3. A Process Built on the Protection of Expectations**
  *   **Mechanism:** **Grandfathering with Buyouts.**
  *   **Design:** The zoning map is treated as a contract. To change density, the city or developer must buy out the "reliance interest" of existing owners. Alternatively, strict zoning is maintained, but the city must build the mandated housing on public land elsewhere.
  *   **Logic:** This treats zoning as a vested property right. It would freeze the city in its current form unless significant public funds are allocated to "zone changes."

  **4. A Process Honestly Designed to Elicit Local Information**
  *   **Mechanism:** **Blind Technical Review with Weighted Testimony.**
  *   **Design:** Hearings are eliminated. Staff engineers quantify traffic, shadow, and parking. Written testimony is accepted but categorized (fact vs. opinion). "I don't like the look" is assigned zero weight. "The drainage on this block fails during heavy rain" is assigned high weight and triggers a technical review.
  *   **Logic:** This treats the process as administrative optimization. It would drastically reduce delay and remove the "intensity as harm" metric.

  ### IV. The Two-Track Reform: Admission and Principle

  **Is the reform an admission that the veto was a privilege?**
  **Yes.** By making approval ministerial near transit, the city admits that the discretionary hearing was never a fundamental right of the neighbor, but a procedural hurdle granted by the state. If it were a right based on property or community sovereignty, the state could not remove it without compensation or constitutional amendment. The reform treats the veto as a **default setting** that can be toggled off when higher-priority policy goals (climate, housing supply) are at stake.

  **What principle is the city adopting?**
  The city is adopting a principle of **Tiered Sovereignty** (or Instrumental Zoning).

  1.  **Administrative Zones (Transit/Affordable):** In these areas, land is treated as a **resource for regional goals**. Local claims are subordinate to state metrics (housing units, transit ridership). The "claim on a place" here is weak; the neighborhood is an instrument of the broader city.
  2.  **Sovereign Zones (Historic/Overlay):** In these areas, land is treated as a **cultural artifact**. Local claims are strengthened. The "claim on a place" is strong; the neighborhood is a curator of its own history.

  **The Philosophical Commitment:**
  By reinforcing the veto in wealthy, historic areas while removing it in transit corridors, the city commits to the view that **claims on place are proportional to historical precedence and political organization.** It creates a caste system of land use:
  *   **Tier 1 (Historic):** Full property rights + Veto. (High wealth, high organization).
  *   **Tier 2 (Standard):** Property rights + Defeasible Veto. (Middle wealth).
  *   **Tier 3 (Transit/Affordable):** Limited Property rights + No Veto. (Often lower wealth, higher density).

  The city is not arguing that neighbors are *right* or *wrong* about character. It is arguing that **some neighborhoods have earned the right to be wrong, and others have not.** The process presupposes that the "Right to the City" is not universal, but accrued through time, wealth, and the ability to survive the legal attrition of the permit process. The Two-Track reform makes this accrual explicit: you keep your veto only if your neighborhood is deemed "historic" enough to deserve it, or if you are far enough from a bus line to remain invisible to state mandates.
