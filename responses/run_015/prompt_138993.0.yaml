  2.  **Deconstruct the Proposition ("White Horse is Not Horse"):**
      *   Source: Gongsun Longzi (Nominalists/Sophists of the Warring States period).
      *   Core phrase: *Bai ma fei ma* (白馬非馬).
      *   Key particle: *Fei* (非). Usually translated as "is not," but can mean "is not identical to," "is not a member of," "is not approved as," etc.
      *   User's current view: Linguistic artifact (equivocation).
      *   Professor's view: Compound attribute $\neq$ Simple attribute.

  3.  **Brainstorming Interpretations (The Menu):**
      *   *Identity:* White Horse $\neq$ Horse (Numerical identity).
      *   *Class Membership:* White Horse $\notin$ Horse (Set theory).
      *   *Concept/Name:* The concept "White Horse" $\neq$ The concept "Horse".
      *   *Compound vs. Simple:* The property $W+H$ $\neq$ The property $H$.
      *   *Pragmatic/Prescriptive:* Requesting a white horse $\neq$ Requesting a horse.
      *   *Ontological/Realist:* The form of White-Horse is distinct from the form of Horse.
      *   *Modal:* This white horse could have been non-white (so "white" isn't essential to "horse").

  4.  **Developing the Menu (Verdicts & Falsification):**
      *   *Identity:* "This white horse is numerically identical to the class of horses." False. Falsification: Accepting "This white horse is the whole set of horses."
      *   *Class Membership:* "The set of white horses is a subset of horses." If *fei* means "is not a member of," this is False. If *fei* means "is not identical to the set," it's a Platitude.
      *   *Conceptual:* "The name 'white horse' has the same extension/intension as 'horse'." False. Falsification: Accepting "If you ask for a horse, a yellow one works; if you ask for a white horse, it doesn't." (Gongsun Long uses this).
      *   *Compound Attribute (Prof's view):* "The attribute of being a white horse is identical to the attribute of being a horse." False. Platitude/Substantive depending on depth.
      *   *Pragmatic:* "A command for a horse is satisfied by a white horse." True. But *fei* implies a distinction in *satisfaction conditions*.
      *   *Ontological (Forms):* "The Form of White-Horse is the same as the Form of Horse." False (in Gongsun's system).

  5.  **Addressing the Professor's Move:**
      *   The Prof said: "Compound attribute not being the simple one."
      *   This points to the *Intensional/Conceptual* reading. $F(x) \land G(x) \neq F(x)$.
      *   Is this a platitude? Yes, logically. $A \cap B \neq A$.
