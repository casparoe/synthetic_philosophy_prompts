      *   Does it hold up? It holds up as a logical truth, but Gongsun Long wants it to be *paradoxical*. If it's just "White+Horse $\neq$ Horse," it's trivial. The philosophical weight comes from claiming this distinction matters for *reality* or *governance*, not just logic.

  6.  **Addressing the Linguistic Hypothesis (No Copula/Mass Nouns):**
      *   If Chinese lacks "is," does *fei* function differently? *Fei* is a negative particle, often "is not" but also "wrong to call."
