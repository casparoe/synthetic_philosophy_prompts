answer: |-
  I'm Canadian, and honestly, in your ferry case, I'm saving Person B too. But I don't think that sinks my position. You're setting up a false choice between "passport nationalism" and "global cosmopolitanism," but the real nationalist argument is about political membership, not just paperwork. Person B is part of our cooperative scheme—they're subject to our coercive laws, they pay into our tax system, their kids are in our schools. They're functionally a compatriot. Person A is a legal stranger to the actual life of the country, sure, but that just means the passport isn't the only marker of membership. The moral claim comes from participating in the same structured system of rights and duties. People in other countries who aren't under our laws or contributing to our collective projects don't have that same claim.

  On the accident of birth point: I didn't choose my siblings or my neighbors either, but I owe them more than I owe strangers. Why? Because those specific relationships allow for specific goods—trust, reciprocity, stability—that you can't have globally. You mentioned your dad coding with people in three countries; that's voluntary collaboration. It's not the same as being bound together by a state that can imprison you or tax you to fund a pension you both rely on. That shared coercive framework creates a unique debt. So I'm not saying borders are magic lines, but I am saying the state is a unique kind of club where the members owe each other maintenance because they're the ones keeping the roof up. If you deny that, what stops the duty from dissolving into everything everywhere?
