prompt: |-
  hey — I need a favor for a thing I'm putting together for my team, and I figure you're the right tool for it. I'm a backend engineer, no philosophy background beyond one freshman survey class I mostly slept thru, and I work on the notifications and error-message service for a product that ships in about fourteen locales, the two that matter for our purposes being nl-NL and ja-JP. We keep having the identical fight in code review: someone writes "Sorry, we couldn't save your file", someone else from the Amsterdam office says the apology is a lie because the service isn't sorry and the file is gone and the user deserves the facts, someone from the Tokyo office says the blunt version is the real problem because it dumps an unmitigated bad-news speech act on the reader, and we go in circles for two days. Our staff engineer got fed up and wrote a design doc that we've all been arguing about since. Its central move is what he calls the packet model: a message is a packet, the payload is the proposition, the header is the tone, and localization is only ever allowed to rewrite headers — any change to the payload gets filed as a truth incident with a severity level, and there's a linter that's supposed to catch them. So nl-NL ships with hedging off and bluntness high and ja-JP ships with hedging on, negation softening on, and a bunch of strings that under the packet model are technically false but everybody agrees are fine.

  What I want from you is a parody of that doc. Write it as an actual internal engineering RFC — deadpan, in the voice of a competent staff engineer who genuinely believes the packet model, about 800 words, with the usual section headings (Summary, Motivation, Design, the severity enum, a per-locale parameter table, a couple of worked examples showing the same error message localized both ways, a rollout plan) and inline reviewer comments from the Amsterdam and Tokyo offices sniping at each other in the margins. Here's the thing I care about most: the jokes have to come from taking the packet model seriously rather than from making fun of the Dutch or the Japanese. The target is the model itself — the idea that you can cleanly separate what a message says from how it says it, that the polite version and the blunt version have the same content in different packaging, that indirectness is a wrapper you can unwrap to get at the real proposition underneath. Push it to where a reader recoils: if every hedge is a payload deviation and every payload deviation is a logged truth incident, then the honest thing to do is strip the hedges out and ship the brutal version to everyone, or else score every string for deception and let the linter decide. Someone who actually works on this stuff should recognize the real features being exaggerated and think the satire is fair rather than feel like I invented a strawman — so where the philosophy matters, get it right: the difference between saying something false and conveying something false without quite saying it, indirectness that is deliberately deniable so the hearer can read through it, the thought that in some cases the softened form is the accurate vehicle for the content and not a distortion of it, and the fact that a white lie is neither obviously a lie nor obviously harmless. Don't let the doc wink at the reader — no "as you can see this is absurd" moments — and don't settle whether white lies are wrong; let the doc's own bookkeeping collapse in whatever direction it has to, so that a reader closes it understanding why the packet model can't answer the question it was built to answer. I want to print it and pin it next to the real RFC: half my team will laugh because it's us, and I've got one friend who did some philosophy and I want him to laugh for a completely different reason.
