answer: |-
  **RFC-892: Notification Payload Integrity Protocol (NPIP)**

  **Status:** Draft  
  **Author:** Staff Engineering  
  **Date:** 2023-10-27  

  ### Summary
  This RFC proposes the Packet Model for user-facing notifications. We decompose messages into a immutable `Payload` (the proposition) and a mutable `Header` (the tone/localization vector). This ensures truth parity across locales while allowing cultural modulation of delivery. Localization layers may modify the `Header` but must not alter the `Payload` without triggering a `TruthIncident`.

  ### Motivation
  Current error strings exhibit semantic drift. In nl-NL, users receive factual assertions ("Save failed"). In ja-JP, users receive mitigated speech acts ("It appears saving was unsuccessful"). While both achieve user notification, the latter introduces epistemic uncertainty not present in the backend state. Furthermore, apologies ("Sorry") imply agentive responsibility the service does not possess. We must decouple factual integrity from sociolinguistic packaging to prevent legal liability and maintain system honesty.

  ### Design
  The `NotificationPacket` struct is defined as:

  ```go
  type Packet struct {
    Payload  Proposition  // Immutable truth claim
    Header   ToneVector   // Localizable surface form
    Severity TruthSeverity // Deviation level
  }
  ```

  The `Payload` is generated at the service layer. The `Header` is applied at the client layer. Any localization string that implies uncertainty, agency, or emotion where none exists in the `Payload` is flagged by the `truth-linter`.

  ### Severity Enum
  Deviations are classified by semantic distance from the `Payload`:

  *   `SEV_NONE`: Direct mapping.
  *   `SEV_LOW`: Epistemic hedging (e.g., "might," "seems").
  *   `SEV_MED`: Agentive displacement (e.g., "We couldn't" vs "Error 500").
  *   `SEV_HIGH`: False apology (e.g., "Sorry").

  > **[amst-dev-04]:** Why is `SEV_HIGH` configurable? If the service isn't sorry, logging an apology is logging a lie. Just strip it.
  > **[tkyo-dev-02]:** It's not a lie, it's a social handshake. You're confusing constative with performative utterances.
  > **[amst-dev-04]:** It's a boolean flag on the apology object. False is false.

  ### Per-Locale Parameters
  Locales configure acceptable `Severity` thresholds.

  | Locale | Max Severity | Hedge Allowance | Agency Masking |
  | :--- | :--- | :--- | :--- |
  | nl-NL | `SEV_NONE` | 0% | Off |
  | ja-JP | `SEV_LOW` | 100% | On |
  | en-US | `SEV_MED` | 50% | On |

  ### Worked Examples
  **Payload:** `FILE_SAVE_FAILURE (ID: 404)`

  **nl-NL Output:** "Bestand niet opgeslagen." (File not saved.)  
  *Lint Status:* PASS (`SEV_NONE`)

  **ja-JP Output:** "ファイルを保存できなかったようです。" (It seems we were unable to save the file.)  
  *Lint Status:* WARN (`SEV_LOW` - Epistemic Hedge "seems"; `SEV_MED` - Agency "we")

  > **[tkyo-dev-02]:** The "we" isn't agency, it's inclusion. Removing it isolates the user from the platform. That's a UX regression.
  > **[amst-dev-04]:** It's a causality regression. The platform didn't fail, the disk did. Don't anthropomorphize the stack.
  > **[author]:** Please resolve via config flag `ALLOW_COLLECTIVE_AGENCY`.

  The linter treats the ja-JP version as a controlled deviation. The semantic content remains `FILE_SAVE_FAILURE`, though the surface form suggests uncertainty. We accept this divergence as technical debt required for retention.

  ### Rollout Plan
  1.  Integrate `truth-linter` into CI.
  2.  Backfill existing strings with `Payload` tags.
  3.  Any string exceeding locale `Max Severity` blocks merge unless waived by Product.
  4.  All `SEV_LOW`+ incidents are logged to `audit-truth-stream` for compliance.

  > **[tkyo-dev-02]:** So every polite string gets logged as a "truth incident"? That's going to look terrible in the quarterly review.
  > **[author]:** It's accurate bookkeeping. If we can't distinguish kindness from deception, we log both.
  > **[amst-dev-04]:** Better to log it than say it. At least the log is honest.

  ### Risks
  Strict adherence may result in brittle copy. If `Payload` logic changes (e.g., retryable vs. permanent), all `Header` variants must be updated to avoid desynchronization. Additionally, high-context locales may require `SEV_LOW` hedges to convey the `Payload` at all; removing the hedge may render the message unintelligible or hostile, effectively losing the `Payload` in transmission.

  > **[tkyo-dev-02]:** This. If you strip the hedge, the message isn't "blunter," it's meaningless. The hedge *is* the payload in high-context comms.
  > **[author]:** That implies the Packet Model is insufficient for high-context locales.
  > **[tkyo-dev-02]:** It implies the model assumes content exists independently of delivery. It doesn't.
  > **[amst-dev-04]:** Then how do we lint it? If content is delivery, everything is a lie.
  > **[author]:** We will proceed with the audit stream. Future RFCs may address non-dualistic message structures.

  ### Conclusion
  The Packet Model provides a deterministic framework for notification integrity. While some locales will incur higher `TruthIncident` rates, this visibility is preferable to untracked semantic drift. We prioritize architectural clarity over linguistic nuance.
