prompt: |-
  i'm doing a philosophy of mind paper this semester and also working as a TA for a first-year logic course, and the two things have kind of collided on me now that it's exam season. We did the extended mind stuff — the famous thought experiment where one person remembers the museum address in her head and the other has to check a notebook he always carries — and my prof's line in the lecture was that the thesis is either trivial or obviously false, and that university exam rules are a good way to tell which. I think she's being too quick but I can't say exactly why, which is what I want help with.

  Here's the practice, as concretely as I can give it. In the course I TA, students may bring a non-programmable calculator but not a phone, even though the phone contains a calculator that does strictly more and is arguably more reliable. They may bring one handwritten A4 sheet of notes, but under the rule as it was rewritten last year the sheet has to be "continuously available and actually relied on for the majority of study sessions for that paper" — so a sheet you made in week two and used all term is fine, a identical sheet printed out the night before is a breach, and a classmate who happens to be standing in the corridor is a breach no matter how many hours you spent revising with them. Meanwhile the disability office will approve a screen reader, a spellchecker, or a human scribe for students with dyslexia, but the same essay written with a grammar-and-rewrite tool switched on is academic misconduct, and so is paying a friend to proofread it. So: same computation, same output, wildly different treatment, and the differences don't seem to track how much thinking the tool is doing for you.

  What I want is the implicit theory. What does this rulebook presuppose about where a person's cognition stops — is it that the permitted aids have been reliably available, easily accessible and automatically trusted over time, roughly the conditions the reading talks about, or is it something else entirely, like a view about credit or about who deserves praise for the answer? Which rival views does it quietly rule out: does it rule out the skull-and-skin view, or does it instead rule out the really permissive view on which any external process you're coupled with is part of you? Are the parts even consistent with each other — the scribe case and the software case look identical to me from the outside, and the calculator/phone distinction can't be about computation — and where is the practice just philosophically underdetermined, so that several quite different theories would license exactly the same rules? And finally, what would actually have to change if a department took the extended view seriously: does a closed-book exam start to look less like a fair test and more like inducing a temporary disability, or does the whole thing collapse the other way, into nothing being bannable at all? I'd especially like to know how much of the metaphysics the rules are really committed to, versus how much is only loosely compatible with them, since that's the bit I'd need before I try arguing back in tutorial.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a Philosophy of Mind student and a TA for a First-Year Logic course.
      *   **Problem:** There's a tension between the "Extended Mind Thesis" (EMT) taught in class (Otto & Inga thought experiment) and the practical exam regulations they enforce as a TA.
      *   **Professor's Claim:** EMT is either trivial or obviously false; exam rules prove this (you can't bring your notebook into an exam).
      *   **User's Observation:** Exam rules are inconsistent regarding tools.
          *   Calculator allowed, Phone (with better calculator) banned.
          *   Handwritten notes allowed *only if* used throughout the term (process/history matters), not just content.
          *   Classmate help banned, but Disability Office allows scribes/screen readers.
          *   Grammar tools banned, but human proofreading (sometimes) allowed? (User notes paying a friend is misconduct, but implies some human help is okay via disability).
      *   **User's Goal:** Wants to understand the *implicit theory* behind these rules.
          *   What does the rulebook presuppose about cognition boundaries?
          *   Does it track EMT conditions (reliability, availability, trust)?
          *   Or is it about credit/praise?
          *   Which rival views does it rule out (Skin/Skull vs. Permissive Coupling)?
          *   Are the rules consistent?
          *   What would change if the department took EMT seriously?
          *   Crucial distinction: How much is the rulebook *committed* to metaphysics vs. just *compatible* with it?

  2.  **Deconstruct the Exam Regulations (The Data):**
      *   *Calculator vs. Phone:* Functionally identical computation. Distinction is based on *device type* (distraction potential? cheating potential? standardisation?).
      *   *Notes (History/Process):* A sheet made week 2 vs. week 12. Content is identical. Distinction is based on *integration over time* (learning process vs. outsourcing).
      *   *Disability vs. Standard:* Scribe/Screen Reader allowed for dyslexia. Grammar checker banned for everyone. Distinction is based on *normalisation/restoration* vs. *enhancement*.
      *   *Human Help:* Classmate in corridor = breach. Scribe (disability) = allowed. Paying friend = misconduct. Distinction is based on *agency* and *authorship*.

  3.  **Evaluate against Extended Mind Thesis (EMT):**
      *   *Clark & Chalmers' Criteria:* Constancy, Availability, Trust, Past Endorsement.
      *   *The Notes Rule:* This actually aligns *surprisingly well* with EMT. The rule requires the notes to be "continuously available and actually relied on." This mirrors the "Trust" and "Past Endorsement" criteria. Otto's notebook is part of his mind because he *always* uses it and trusts it. The student who prints it the night before hasn't integrated it into their cognitive system.
      *   *The Phone Rule:* This contradicts EMT if the phone is trusted/available. But the ban is likely pragmatic (internet access, messaging), not metaphysical.
      *   *The Disability Rule:* This suggests the goal isn't measuring "internal cognition" but measuring "canonical performance." If a tool restores you to a baseline, it's allowed. If it enhances beyond baseline, it's not.

  4.  **Identify the Implicit Theory (The "Why"):**
      *   It's not a metaphysical theory of mind. It's a *normative* theory of *assessment*.
      *   Goal of Exam: To measure *competence acquired through study*, not *problem-solving capacity in the moment*.
      *   Key Concept: **Cognitive Integration vs. Cognitive Offloading.**
      *   The rules distinguish between tools that are *constitutive of the learning process* (notes made over term) vs. tools that *bypass the learning process* (phone, last-minute sheet, AI).
      *   The "Disability" exception proves the goal is *fair comparison of ability*, not *purity of substrate*.

  5.  **Address Specific Questions:**
      *   *Where does cognition stop?* The rules suggest cognition stops where *learning* stops. If the tool did the work *during* the term, it's you. If the tool does the work *during* the exam, it's cheating.
      *   *Rival Views:* It rules out the "Pure Skull" view (because notes are allowed). It rules out the "Radical Extended" view (because you can't bring the notebook into the exam room). It adopts a "Temporal Integration" view.
      *   *Consistency:* The calculator/phone distinction is inconsistent metaphysically but consistent pragmatically (risk management). The scribe/software distinction is consistent normatively (restoration vs. enhancement).
      *   *Taking EMT Seriously:* If EMT were true *metaphysically*, closed-book exams measure an arbitrary slice of the cognitive system. However, for *assessment*, we care about *internalized* competence. So, EMT doesn't necessarily kill exams, but it changes *what* they test.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic, supportive, analytical. Acknowledge the user's insight (they are right to spot the tension).
      *   *Structure:*
          1.  Validate the intuition (Professor is too quick).
          2.  Analyze the "Implicit Theory" (It's not metaphysics, it's epistemology/ethics of assessment).
          3.  Break down the specific cases (Notes, Phone, Disability).
          4.  Address the EMT connection (The "Past Endorsement" criterion is key).
          5.  Answer the "What would change?" question.
          6.  Conclusion on Metaphysical Commitment.

      *   *Refining the "Notes" argument:* This is the strongest link to EMT. Clark & Chalmers emphasize *history*. The exam rule emphasizes *history*. This contradicts the Prof's claim that exam rules refute EMT. The rules actually *support* a nuanced EMT (integration matters), while refuting a naive EMT (anything external counts).
      *   *Refining the "Disability" argument:* This shifts the focus from "What is the mind?" to "What are we measuring?" We are measuring *philosophical ability*, not *typing speed* or *visual acuity*.
      *   *Refining the "Phone" argument:* This is a red herring for metaphysics. It's about information access, not calculation.

  7.  **Final Polish:** Ensure the distinction between *Metaphysical Commitment* (what exists) and *Normative Policy* (what we reward) is clear. The user asked specifically about this ("how much of the metaphysics the rules are really committed to"). The answer is: Very little metaphysics, lots of normative epistemology.

      *(Self-Correction during drafting)*: I need to be careful not to say EMT is *true*. I need to say the rules are *compatible* with a specific reading of EMT (the integrationist one) rather than the trivial one. The Professor says EMT is trivial/false. The User suspects the rules are more complex. I should argue the rules actually support a *sophisticated* EMT (coupling + history) rather than refuting it entirely.

      *Key Insight:* The exam rules treat the *term* as the cognitive integration period and the *exam* as the performance period. EMT says the notebook is part of the mind *always*. The exam rules say the notebook is part of the *student's preparation*, but not part of the *exam performance*. This distinguishes *competence* (internalized) from *performance* (augmented).

      *Wait, one nuance:* The user says the notes rule requires the sheet to be "continuously available... for the majority of study sessions." This *is* the EMT "Trust/Availability" criterion. So the rules *presuppose* a version of EMT for the study phase, but enforce a "Skull-Boundary" for the exam phase. Why? To test *internalization*.

      *Okay, let's structure the argument around "Internalization as the Goal."*

  8.  **Final Review against constraints:** The user wants help with a paper/argument. I should provide philosophical scaffolding they can use. Don't write the paper for them, but give the arguments.

      *Plan:*
      1.  The Professor's Dilemma (Trivial/False) is a false dichotomy.
      2.  The Rules presuppose **Cognitive Integration**, not just Coupling.
      3.  The Disability exception reveals the goal is **Baseline Comparison**, not Substrate Purity.
      4.  Metaphysical Commitment is low; Normative Commitment is high.
      5.  Implications for EMT paper.

      *(Self-Correction on the "Phone" issue)*: A non-programmable calculator is functionally transparent. A phone is not (notifications, internet). This aligns with the "Trust/Reliability" condition of EMT too (a phone is unreliable in an exam context due to temptation/distraction).

      *(Final thought on the Scribe)*: A scribe is an agent. Software is a tool. But AI writing tools are agents in a sense. The distinction is *authorship*. The scribe transcribes *your* words. The AI generates *its* words. This is about agency, not location.

      *Okay, ready to write.*
answer: |-
  This is a fantastic collision of theory and practice. You are right to feel that your professor's dismissal is too quick. The exam regulations you are describing do not simply refute the Extended Mind Thesis (EMT); rather, they reveal a much more sophisticated implicit theory of cognition than the "trivial vs. false" dichotomy suggests.

  The tension you are observing stems from conflating two different questions:
  1.  **Metaphysical:** Where does the mind stop? (The EMT question).
  2.  **Normative/Evaluative:** What are we trying to measure when we grade? (The Exam question).

  Here is a breakdown of the implicit theory behind your department's rulebook, how it maps onto (and diverges from) EMT, and where the metaphysical commitments actually lie.

  ### 1. The Implicit Theory: Cognitive Integration vs. Cognitive Offloading
  The rulebook does not presuppose a "Skull-and-Skin" view (that cognition must stay inside the head). If it did, **no notes would be allowed at all.** The fact that a handwritten sheet is permitted proves the department accepts that external artifacts can be part of the *process* of cognition.

  However, the specific constraint on the notes ("continuously available and actually relied on for the majority of study sessions") maps almost perfectly onto Clark and Chalmers' **criteria for extension** (specifically *Trust* and *Past Endorsement*).
  *   **The Rule:** You can bring the notes if you integrated them into your workflow over time.
  *   **The EMT Parallel:** Otto's notebook is part of his mind because he *always* carries it and trusts it. Inga's biological memory is part of her mind because she has integrated those facts.
  *   **The Implication:** The rule presupposes that **cognition is defined by integration history, not spatial location.** A sheet printed the night before is "external" in the pejorative sense (it is mere data storage, not a cognitive extension) because it lacks the history of coupling. A sheet used all term is "internalized" (even if physically external) because it has been woven into the student's cognitive habits.

  **Verdict:** The rules do not rule out EMT. They rule out *naive* coupling (grabbing any tool nearby) and endorse *robust* coupling (tools integrated over time).

  ### 2. The Calculator vs. Phone Distinction
  You noted this seems inconsistent: same computation, different rules. Metaphysically, you are right. But normatively, this tracks the **Transparency** condition of EMT.
  *   **Calculator:** When a skilled user presses "sin," they do not think about the algorithm; they think about the angle. The tool is transparent.
  *   **Phone:** A phone is not cognitively transparent in an exam context. It affords distraction (notifications), communication (cheating), and access to unvetted information (internet).
  *   **The Theory:** The rules presuppose that for an external tool to be permissible, it must be **functionally specific and cognitively transparent.** A phone fails the "reliability" and "trust" conditions in an exam setting not because it can't calculate, but because its architecture introduces noise into the cognitive loop.

  ### 3. The Disability Exception: Restoration vs. Enhancement
  This is the strongest evidence that the rules are **normative, not metaphysical.**
  *   **The Scribe/Screen Reader:** These are allowed because they are viewed as **restorative**. They bring the student up to a "canonical baseline" of cognitive functioning. They bypass a *blockage* (dyslexia/vision) without supplying the *content* (the philosophical argument).
  *   **The Grammar/AI Tool:** These are banned because they are viewed as **enhancive** or **generative**. They supply content or structural reasoning that the student did not generate.
  *   **The Theory:** The exam is not testing "pure cognition"; it is testing **acquired competence.** If a tool bypasses the acquisition of competence (by writing the essay for you), it is banned. If a tool bypasses a physical barrier to *expressing* competence (by typing for you), it is allowed.

  This quietly rules out the view that "all processing is equal." It distinguishes between **processing the medium** (typing, seeing) and **processing the message** (arguing, calculating). The department is committed to measuring the latter.

  ### 4. Consistency and Underdetermination
  Are the rules consistent?
  *   **Internally:** Yes, if the goal is to measure *internalized competence* rather than *maximum problem-solving capacity.*
  *   **Metaphysically:** They are underdetermined. You could justify these exact rules with a Skull-and-Skin view ("Notes are a concession, but the mind is in the head") OR with an Integrationist EMT view ("Notes are part of the mind only after long-term coupling").

  **Where the practice is philosophically underdetermined:**
  The distinction between the "classmate in the corridor" and the "human scribe."
  *   **Classmate:** Breach of *authorship*. The ideas might not be yours.
  *   **Scribe:** Preserved *authorship*. The ideas are yours; the motor output is outsourced.
  *   **The Gap:** What about a study partner you revise with all term? If you rely on them to check your logic constantly (like Otto relies on his notebook), are they part of your cognitive system? The rules say **no**. This suggests the department is committed to **Individualism regarding Agency**, even if they accept **Extension regarding Storage.**
  *   **Rival View Ruled Out:** This rules out a "Socially Extended Mind" view where other people can be literal parts of your cognitive system during assessment. The rules enforce a boundary around the *individual agent*, even if they allow boundaries around the *individual substrate* to be porous.

  ### 5. What if the Department Took EMT Seriously?
  If the department accepted the metaphysical truth of EMT (that the notebook *is* memory), closed-book exams would not necessarily collapse, but their justification would shift.
  *   **Current Justification:** "We must isolate the brain to ensure you know the material."
  *   **EMT Justification:** "We must isolate the *system* to ensure the *coupling* is robust."

  If EMT were taken seriously, a closed-book exam might be seen as **inducing a temporary disability.** It artificially severs the reliable couplings (notes, habits, tools) that constitute the student's normal cognitive system.
  *   **The Change:** Exams would shift from testing "what is in your head" to "what is in your system." Open-book exams would become the default, but the *questions* would change. You wouldn't ask "What is the address of the museum?" (lookup); you would ask "How do you navigate to the museum using your system?" (process).
  *   **The Collapse:** It doesn't lead to "nothing being bannable." It leads to stricter bans on *unintegrated* tools. You could bring your laptop, but only if you could prove you'd used it for all your drafting all term (similar to the notes rule). The focus shifts from **possession of tools** to **history of use.**

  ### 6. Metaphysical Commitment vs. Compatibility
  This is the crux for your paper.
  *   **How much metaphysics are the rules committed to?** Very little. The rules are compatible with Substance Dualism, Physicalism, or EMT. They are functionalist policies.
  *   **Where is the tension?** The tension is between **Ontology** (what exists) and **Credit** (who gets praise).
      *   The Professor claims exam rules refute EMT.
      *   **Your Counter:** Exam rules refute *trivial* EMT (that anything nearby is mental), but they *presuppose* a robust version of EMT (that tools integrated over time become part of the cognitive profile).
      *   The rule about the notes ("must be used all term") is an **administrative enforcement of the Trust/Endorsement criteria.**

  ### Summary for your Tutorial Argument
  You can argue that your professor is conflating **spatial boundaries** with **functional integration.**
  1.  **The Rules support Integrationism:** The note-taking rule explicitly rewards long-term coupling (EMT's "Past Endorsement") and penalizes last-minute outsourcing. This validates EMT's claim that history matters, not just location.
  2.  **The Goal is Attribution, not Purity:** The bans on phones/AI/Classmates are not about keeping cognition "inside the skin"; they are about ensuring **attribution of agency.** We need to know *who* generated the argument. A scribe preserves agency; an AI generator obscures it.
  3.  **The "Trivial or False" Dilemma is False:** There is a middle ground. The rules show that extension is **real but regulated.** It is not trivial (because not everything counts) and not false (because external tools are permitted under specific conditions).

  **The "Killer Point":** If the Skull-and-Skin view were true, the history of the note sheet wouldn't matter. A fact is a fact. The fact that the *history of use* determines whether the sheet is permitted proves the department implicitly accepts that cognition is a **process of integration**, not just a **state of containment.** That is the heart of the Extended Mind Thesis. Your professor is using the rules to argue against EMT, but the rules actually embody its most sophisticated criteria.
