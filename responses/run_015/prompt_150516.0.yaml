      *   **User's Twist:** "Institutional Particularism." Shifting focus from individual moral judgment to bureaucratic inertia and rule-locking.
      *   **Case Study:** Hospital organ queue (first-come-first-served) vs. a patient with a rare antibody profile (potential match, unconfirmed).
