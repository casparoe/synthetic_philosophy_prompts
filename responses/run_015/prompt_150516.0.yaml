      *   *Particularist Defense:* The procedure isn't an algorithm. It's a space for judgment that *cannot* be codified without losing its force.
      *   *Verdict:* This is the strongest philosophical tension. The user is touching on the "regress problem" but at an institutional level. It's a valid worry.

  5.  **Address Question 3: Weakest Point & Most Interesting Point:**
      *   *Weakest:* The definition of "Institutional Particularism." It risks being a category error. Institutions *are* generalizing machines. Claiming an institution can be a particularist agent is oxymoronic unless carefully defined.
      *   *Interesting:* The shift from *moral ontology* (do principles exist?) to *moral sociology* (how do rules behave in systems?). This bridges meta-ethics and political philosophy. The idea of "bureaucratic inertia" as a moral vice is fresh.

