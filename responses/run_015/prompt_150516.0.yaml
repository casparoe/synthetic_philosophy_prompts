          3.  Where is the argument weakest? What is actually interesting?
      *   **Tone:** Blunt, accurate, no flattery.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Standard Moral Particularism (e.g., Dancy):* Moral principles are not necessary for moral judgment; context determines moral valence. Reasons are holistic.
      *   *Standard Moral Generalism:* Moral principles are necessary/central.
      *   *User's "Institutional Particularism":* Focuses on the *systemic* rigidity of rules rather than the *conceptual* status of principles. It's about *institutional epistemology* and *procedural justice* more than meta-ethics.

  3.  **Address Question 1: The Hospital Case (Philosophy vs. Policy):**
      *   *Critique:* As described, it sounds like a triage protocol issue. That's bioethics/policy.
      *   *Philosophical Potential:* It becomes philosophical if it challenges the *nature* of moral reasoning within institutions. Does the institution *have* a moral agency distinct from its rules? If the rule (FCFS) conflicts with the outcome (saving the life via rare match), is the error epistemic (we didn't know) or moral (the rule is bad)?
      *   *Verdict:* Currently leans policy. Needs to connect back to the *justification* of action, not just the *outcome*. It needs to show why a particularist *explanation* is better than a generalist *exception clause*.

  4.  **Address Question 2: Collapse into Generalism:**
      *   *The Trap:* If you say "You need a procedure to break the rule," you have created a higher-order rule ("Break rule R when conditions C obtain").
