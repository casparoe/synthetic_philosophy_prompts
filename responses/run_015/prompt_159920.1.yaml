prompt: |-
  I am a novelist, and I am well into a book set in the southern Maya lowlands during the Terminal Classic: a multigenerational novel about a family of scribes attached to a court that is slowly, and without ever deciding to, giving up the habit of raising carved and dated stone monuments. I find that I cannot write a page of it until I know what kind of event I am depicting, so what I need is a case analysis rather than background reading.

  The criterion I have been working with — call it the testamentary criterion — is this: a society has collapsed, as opposed to merely changed, when it loses the practices by which it hands a description of itself to those who come after it. Collapse on this view is not the loss of population, territory, or complexity, but the breaking of a chain of address: the cessation of records made for the sake of a future reader who will not otherwise know what has been lost, and who could therefore either reclaim it or knowingly refuse it. What is destroyed in a genuine collapse is not well-being or power but the capacity of successors to know what it is they are missing.

  Please take the Terminal Classic transformation of the Classic Maya and analyze it strictly through this criterion, and then tell me where the criterion breaks. Take the following as given: the number of dated monuments erected per year across the Maya area rises to roughly forty around 750, falls back to about ten by 800, and reaches zero by about 900, with no new major construction in the central Maya area after roughly 830; the Copán valley population, which peaked near twenty-eight thousand in the fifth century, declines to about fifteen thousand by 900 and to under a thousand by 1200; the northern Yucatán subsequently prospers, with Chichén Itzá, Mayapán and Uxmal flourishing in very different artistic and architectural styles and with far less monumental hieroglyphic writing; Maya communities and languages persist, and an independent Maya polity survives until the Spanish conquest of Nojpetén in 1697.

  I would like four things. First, a disciplined mapping: what the unit is (a city-state, a polity, a scribal institution, the Long Count itself), what on this criterion counts as the record addressed to the future, what it says was happening to people who went on farming, trading and building while the carving stopped, and whether the verdict is collapse, transformation, or something the criterion has no word for.

  Second, the places where the criterion misdescribes the case. It appears to make the fate of a whole population track the fate of an elite technology of self-commemoration; I want to know whether that is a fatal class bias or a defensible consequence, and how the criterion should handle a society most of whose members never had a testament at all.

  Third, two stress cases from outside the Maya material. For Mycenaean Greece: Linear B was a script used almost entirely for palace administration, it disappears with the destruction of the palaces around the end of the Late Bronze Age, and the following centuries offer no conclusive evidence of writing in Greece until the adoption of the alphabet several centuries later — so does the criterion deliver the result that the Mycenaean world collapsed, or the result that it never addressed the future in the first place and so was never the kind of thing that could collapse? And for the Maya themselves: if the destruction of the surviving Maya books by Spanish missionaries in the sixteenth century, and the long period in which Maya writing was present but unreadable before its decipherment in the twentieth century, both bear on the chain of address, then the criterion seems to say either that the Maya collapse was inflicted from outside in the 1500s or that it was revoked by scholars in the 1900s. Tell me what the criterion should say about collapse imposed by a conqueror and about collapse repaired retroactively. If you bring in Rapa Nui, do not rest anything on the disputed demographic and ecological story there.

  Fourth, what the case does to the criterion in return — whether it confirms it, or is an anomaly, or is a case the criterion never anticipated — and one further matter that is personal to the project: my own novel is an artifact of exactly the kind whose disappearance is supposed to constitute a collapse. Does the criterion in fact imply that a people can be un-collapsed by being written about, that collapse is revocable by art, and does it give any guidance to an agent inside the process, such as a lord deciding in a bad year whether the stela still gets carved? Where the criterion is silent, say so rather than making it speak. Do not give me citations or reading lists; work from the facts I have supplied and from what you already know.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing a multigenerational novel about a family of scribes in the Terminal Classic Southern Maya Lowlands.
      *   **Core Concept:** "Testamentary Criterion" of collapse (collapse = loss of practices handing a description of itself to the future; breaking the chain of address; successors can't know what they are missing).
      *   **Task:** Analyze the Terminal Classic Maya transformation strictly through this criterion, then identify where the criterion breaks.
      *   **Given Facts:** Monument erection peaks ~750 CE (40/yr), drops ~800 (10/yr), zero ~900. Copán population decline (28k -> 15k -> <1k). Northern Yucatán prospers (Chichén Itzá, etc.) but different style/less writing. Maya communities/languages persist. Independent polity until 1697.
      *   **Required Outputs:**
          1.  Disciplined Mapping (Unit, Record, Content, Verdict).
          2.  Critique of the Criterion (Class bias, non-literate majority).
          3.  Two Stress Cases (Mycenaean Greece, Colonial Maya/Decipherment). *Note: User mentioned Rapa Nui but said "If you bring in Rapa Nui, do not rest anything on the disputed demographic..." - I should probably stick to the requested two stress cases to remain disciplined, or use Rapa Nui only if essential. The prompt asks for "Two stress cases from outside the Maya material" but then lists Mycenaean and "For the Maya themselves" (Colonial). I will treat the Colonial Maya as the second stress case as requested.*
          4.  Feedback on the Criterion & Personal/Novelistic Implication (Can art un-collapse? Guidance for the agent?).
      *   **Constraints:** No citations/reading lists. Work from supplied facts + general knowledge. Be disciplined. Admit silence where appropriate.

  2.  **Deconstruct the "Testamentary Criterion":**
      *   *Definition:* Collapse = breaking the chain of address to a future reader who needs the record to know what was lost.
      *   *Key Distinction:* Not loss of power/population, but loss of *intelligibility* to successors.
      *   *Implication:* If the future can't read the past's self-description, the past has collapsed *as a meaningful entity* for that future.

  3.  **Drafting Section 1: Disciplined Mapping:**
      *   *Unit:* It's not the "Maya Civilization" (too broad). It's the *Classic Southern Lowland Court System* specifically the *Scribal Institution* embedded within the *City-State Polity*.
      *   *Record:* Dated stone monuments (Stelae/Altars) using the Long Count. These are the specific "testaments."
      *   *Content:* What happens to the farmers/traders while carving stops? The record says nothing. That's the point. The silence *is* the data. The criterion says the *experience* of the farmer becomes unknowable to the successor because the mechanism to encode it (the court scribe) stopped encoding.
      *   *Verdict:* Under this criterion, the *Southern Classic Court System* collapsed. The *Maya People* transformed. The criterion forces a distinction between the *regime of memory* and the *population*.
      *   *Nuance:* The Northern Yucatán prospers but changes the medium (less monumental hieroglyphic writing). Does this count as a break in the chain? Yes, because the *specific* address (Long Count on stone) stops. The Northern Maya are successors, but they receive a different kind of message (or less of one).

  4.  **Drafting Section 2: Where the Criterion Misdescribes (Class Bias):**
      *   *The Problem:* The criterion equates "society" with "elite self-commemoration."
      *   *The Majority:* 90%+ of the population never commissioned a stela. Their "testament" was oral, material (pottery, houses), or biological (descendants).
      *   *Bias:* Is it fatal? It depends on the definition of "society." If society is defined by its *structure*, the elite structure collapsing *is* the social collapse. If society is defined by its *people*, the criterion is elitist.
      *   *Defense:* The scribes *claimed* to speak for the cosmos/order. If they stop, the *cosmic order* collapses, even if farmers keep farming. The criterion captures the loss of *meaning*, not just life.
      *   *Handling the Non-Literate:* The criterion must acknowledge that for the non-literate, the "chain of address" was ritual/seasonal, not textual. If the ritual stops (because the court stops funding it), their chain is also broken, even if they can't read the stone.

  5.  **Drafting Section 3: Stress Cases:**
      *   *Mycenaean Greece:* Linear B = admin, not monumental testament. It disappears.
          *   *Criterion Verdict:* Mycenae never addressed the future in the *testamentary* sense. It addressed the immediate inventory. Therefore, it couldn't "collapse" under this specific definition; it simply *ended*. Or, the loss of the script means the *administrative logic* collapsed, but since it wasn't a "testament to the future," the criterion struggles. It suggests Mycenae was a "closed loop" society.
      *   *Colonial Maya/Decipherment:*
          *   *Scenario A (1500s):* Spanish burn books. Chain broken by force.
          *   *Criterion Verdict:* This is *imposed collapse*. The address was interrupted. The successors (colonial Maya) knew something was missing but couldn't read it.
          *   *Scenario B (1900s):* Decipherment.
          *   *Criterion Verdict:* Does this "un-collapse"? The criterion says collapse is the *breaking* of the chain. Repairing the link 1000 years later doesn't change the fact that the chain *was* broken for those intervening generations. The "future reader" in the definition implies a *continuous* or *intended* successor. Decipherment is a *resurrection*, not a prevention of collapse.
          *   *Refinement:* The criterion distinguishes between *forgetting* (collapse) and *deciphering* (archaeology). The collapse happened when the last reader died. Decipherment is an external act, not an internal continuity.

  6.  **Drafting Section 4: Feedback & Novelistic Implication:**
      *   *Effect on Criterion:* The Maya case confirms the criterion's utility in distinguishing *political/cultural systems* from *demographic continuity*. It highlights that "Collapse" is a semantic event, not just a physical one.
      *   *Anomaly:* The Northern Yucatán continuation suggests the "Chain of Address" can migrate or change medium. The criterion needs to account for *translation* of the testament (Stone -> Codex -> Oral).
      *   *The Novel:*
          *   *Can art un-collapse?* Yes, but retrospectively. The novel acts as a *proxy* testament. It restores the address to a future reader (us).
          *   *Guidance for the Agent (The Lord/Scribe):* The criterion offers a tragic imperative. If the Lord knows the chain is breaking, carving the stela is an act of faith in a reader who may not exist. *Not* carving it guarantees the collapse.
          *   *Silence:* The criterion cannot tell the character *why* they should care about a future they won't meet. It only tells them that if they stop, they vanish. It cannot justify the cost of the stela in a starving year.

  7.  **Review and Refine:**
      *   *Tone:* Analytical, respectful of the literary project, rigorous.
      *   *Check Constraints:* No citations. Use provided facts. Address all four points.
      *   *Self-Correction on Stress Cases:* The prompt asks for "Two stress cases from outside the Maya material" but then describes Mycenae and "For the Maya themselves... colonial." I need to be careful. The prompt says: "Third, two stress cases from outside the Maya material. For Mycenaean Greece... And for the Maya themselves..." This is slightly contradictory phrasing. It implies Mycenae (outside) and Colonial Maya (inside/later). I will treat them as the two stress cases requested, acknowledging the Colonial one is technically Maya but a different temporal/material context.
      *   *Refining the "Collapse" Definition:* Ensure I stick to the user's "Testamentary Criterion" strictly, not general archaeological definitions.
      *   *The "Un-Collapsing" question:* This is crucial for the novelist. If I write the book, do I save them? The criterion suggests I save them *for my readers*, not for the Maya descendants in 1200. I need to make that distinction clear.

  8.  **Final Polish:** Check the flow. Ensure the distinction between "Southern Lowlands" and "Northern Yucatán" is clear in the mapping. Ensure the distinction between "Population" and "Polity" is sharp. (Self-correction: Make sure to explicitly answer "where the criterion breaks" in section 2).

  9.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  Here is the analysis of the Terminal Classic transformation through your testamentary criterion, followed by the stress tests and implications for your work.

  ### 1. Disciplined Mapping

  **The Unit**
  Under your criterion, the unit of analysis cannot be "the Maya" as a people, nor "the Maya area" as a geography. The unit is the **Classic Southern Lowland Court System**, specifically the **Scribal Institution** embedded within the **City-State Polity**. This is because the "practice by which it hands a description of itself to those who come after" is not farming, trading, or speaking a Mayan language; it is the specific ritual technology of the Long Count date carved on stone. When the court stops commissioning the scribe, the unit ceases to exist, even if the scribe's grandchildren continue to farm the same valley.

  **The Record**
  The record addressed to the future is the **dated monument** (stela, altar, lintel). It is not the building itself (which implies shelter or power) but the glyphic text attached to it. The critical component is the **Long Count date**. This date anchors the event in a linear, universal time that assumes a reader in the distant future will be able to calculate the distance between "then" and "now." A building without a date is a shelter; a building with a date is a message.

  **The Content (The Silence)**
  You asked what the record says was happening to the people who went on farming and trading while the carving stopped. The record says **nothing**. This is the crux of the testamentary criterion. The cessation of monuments does not record the decline; it *enacts* it. The farmers in the Copán valley in 850 CE are not "collapsing" in your definition; they are becoming **opaque**. They are living lives that will not be legible to their great-grandchildren. The criterion dictates that the "society" (the court system) has collapsed because it has ceased to generate the data required for its own future intelligibility. The farmers are merely the biological residue of that society.

  **The Verdict**
  *   **Southern Lowlands (e.g., Copán, Tikal):** **Collapse.** The chain of address is severed. The Long Count stops. The specific mode of self-description vanishes. The successors (the Postclassic populations in the same valleys) cannot know what the Classic system *was*, only that it left ruins. They cannot reclaim the specific political theology of the Classic court because the manual for it (the inscriptions) stopped being written.
  *   **Northern Yucatán (e.g., Chichén Itzá):** **Transformation.** The chain of address is maintained but **translated**. Writing persists (though less monumental), polities persist, but the *mode* of address changes. They are not speaking the same language of time (the Long Count fades) or kingship. This is a society changing its testamentary format, not losing the habit of testament entirely.
  *   **The Maya People:** **Continuity.** The criterion explicitly excludes language and biology from the definition of collapse. Therefore, the Maya people did not collapse; their political technology did.

  ### 2. Where the Criterion Misdescribes the Case

  **The Class Bias**
  The criterion makes the fate of the whole population track the fate of an elite technology. This is a fatal class bias if your definition of "society" includes the subsistence base. If a society is defined by how it feeds itself, the Maya did not collapse until much later (if at all). If a society is defined by how it *means* itself, the bias is defensible.
  *   **The Defense:** The scribes did not write for themselves; they wrote to stabilize the cosmos for the farmers. The stela was a public object. By stopping the carving, the court stopped performing the ritual maintenance of the world. Therefore, the farmer *is* affected, not because he can't read the glyph, but because the world the glyph sustained is no longer being upheld.
  *   **The Break:** The criterion fails to account for **non-textual testaments**. A pottery style, a burial practice, or an oral tradition is also a way of handing a description of oneself to the future. If the criterion ignores these, it defines "civilization" solely as "literate state." It cannot detect the collapse of an oral culture, because it requires a text to break. In the Maya case, this means the criterion is blind to the continuity of village life. It sees the silence of the stone and declares death, missing the whisper of the oral tradition that survived in the Northern Yucatán and the highlands.

  **The Non-Literate Majority**
  Most members never had a testament. The criterion implies they do not matter to the historical verdict. This is harsh but consistent with the premise: if you do not address the future, you cannot collapse, you can only end. However, this creates a paradox. If the scribe stops writing, the farmer loses his *represented* existence, but not his *actual* existence. The criterion conflates **historical visibility** with **ontological survival**. It suggests that to be unreadable is to be dead. For a novelist, this is fertile ground, but analytically, it risks claiming that the 15,000 people in Copán in 900 CE were "post-collapse" while they were still alive, simply because their lords stopped carving.

  ### 3. Two Stress Cases

  **Mycenaean Greece (Linear B)**
  *   **The Facts:** Linear B disappears with the palaces. No writing for centuries.
  *   **The Criterion's Verdict:** Mycenae **never existed** in the testamentary sense, or it **ended** without collapsing. Linear B was administrative (inventory), not monumental (testament). It addressed the immediate present (how much grain is in the jar?), not the distant future (who am I to you?).
  *   **The Implication:** Under your criterion, Mycenae cannot "collapse" because it never established the chain of address to a future reader. It was a closed loop. When the palace burned, the memory died instantly because it was never externalized for a successor. This suggests your criterion distinguishes between **Systems of Memory** (which can collapse) and **Systems of Administration** (which simply fail). Mycenae is the latter. This validates your criterion's focus on *intent*: collapse requires a failed intention to speak to the future, not just the loss of data.

  **Colonial Maya and Decipherment (1500s – 1900s)**
  *   **The Facts:** Spanish burn books (1560s). Writing becomes unreadable. Decipherment succeeds (1970s+).
  *   **Imposed Collapse:** The burning of the books is an **external severing** of the chain. The criterion must acknowledge that collapse can be inflicted. The Maya scribes of the 1500s were still addressing the future; the conquerors destroyed the medium. The verdict here is **Interruption**, not internal Collapse. The society was willing to address the future, but was silenced.
  *   **Retroactive Repair:** Does decipherment "un-collapse" the society? **No.** The criterion relies on the *continuity* of the address. The chain was broken for 400 years. The generations of Maya living in that gap *did* suffer the collapse; they did not know what they were missing. Decipherment is an act of **archaeology**, not **succession**. It restores the message to a *new* future (us), not the *intended* future (the colonial Maya).
  *   **The Nuance:** The criterion implies that collapse is a **temporal event**, not a permanent state. A society collapses *for* a specific period of time when the chain is broken. It can be recovered, but the collapse itself remains a historical fact of that gap. You cannot undo the fact that the great-grandchildren of the scribes did not know their names.

  ### 4. What the Case Does to the Criterion (and Your Novel)

  **Confirmation and Anomaly**
  The Maya case **confirms** the criterion's power to distinguish between demographic decline and cultural discontinuity. It proves that a people can thrive while their "self" vanishes. However, it presents an **anomaly** in the Northern Yucatán. The chain of address did not break; it migrated and changed language (from Long Count stone to Codex paper to oral history). This suggests the criterion needs a clause for **Translation**. If the testament changes medium but retains intelligibility for the successors, is it collapse? The Maya case suggests **no**, it is transformation. Collapse is only when the successors look at the ruins and see only stone, not text.

  **The Novel as Artifact**
  You ask if a people can be un-collapsed by being written about.
  *   **The Verdict:** Your novel does not un-collapse the Maya for *themselves*. It un-collapses them for *your readers*. You are inserting yourself into the chain of address as a proxy scribe. You are fulfilling the function the Classic scribe stopped performing: making the internal experience of that time legible to a future reader.
  *   **Revocability:** Collapse is not revocable for the actors inside the process. The lord in 830 CE cannot know that a novelist in the 21st century will restore his meaning. For him, the collapse is absolute if he stops carving.
  *   **Guidance for the Agent:** The criterion offers a tragic imperative to your character.
      *   If the Lord stops carving, he accepts that his specific political order will vanish from the memory of his descendants. He chooses **survival of the body** over **survival of the name**.
      *   If he continues carving despite the cost (starvation, war), he chooses **testament over survival**. He is betting that the stone will outlast the people.
      *   **Where the Criterion is Silent:** It cannot tell him which choice is *moral*. It cannot tell him if it is better to be remembered as a tyrant who starved his people to build a stela, or forgotten as a benevolent king who let the stones go silent to feed them. The criterion measures **continuity of meaning**, not **goodness**.
      *   **The Writer's Burden:** Your novel suggests that the "chain of address" can be picked up by strangers millennia later. This gives the scribe's labor a kind of cosmic hope that the scribe himself could not possess. The criterion implies that **collapse is the default state of all things**; continuity is the anomaly maintained by sheer effort. Your novel is an act of resistance against that entropy.

  **Final Instruction for the Project**
  Do not write the novel as a story of "why they died." Write it as a story of "why they stopped speaking." The tension is not between life and death, but between silence and speech. The tragedy is not that the population falls, but that the *description* of the population ceases. Your scribe family is not fighting for survival; they are fighting for **legibility**. That is the specific horror your criterion illuminates: to live is one thing; to be known to have lived is another. The Terminal Classic is the moment they chose, or were forced, to accept the former and surrender the latter.
