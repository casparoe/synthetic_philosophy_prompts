answer: |-
  **Project Title:** Ontogenetic Content: Selection, Correction, and the Limits of Learned Semantics

  **Research Question**
  Does within-lifetime learning history confer underived semantic content, or does it merely transmit derived content from external sources?

  **Project Summary**
  Standard teleosemantic accounts ground content in phylogenetic selection history. This explains instinctual representations but struggles with the vast majority of human content—recognizing faces, acquiring vocabulary, identifying specific smells—which is fixed within the organism's lifetime. Current extensions of teleosemantics attempt to stretch "selection history" to cover ontogeny, but they often gloss over the structural differences in *how* learning occurs. This project argues that not all learning histories are semantically equal. I distinguish between **taught mappings**, where an external error signal corrects the system (analogous to supervised learning), and **sticky mappings**, where mappings persist solely because they produced successful outcomes (analogous to reinforcement learning).

  My working hypothesis is that taught mappings do not confer content; they borrow it from the source of the error signal, much like a thermometer borrows content from its calibrator. The harder case is sticky mappings. If content is fixed by success, does a history of successful retention suffice? Or does this collapse when the detector and the consumer are co-learned, lacking independent functional anchors? This project seeks to determine if a specific class of learning history can do the normative work usually reserved for evolution.

  **Why Existing Accounts Do Not Settle This**
  Etiological accounts prioritize phylogeny and treat ontogeny as a secondary mechanism, failing to explain how new content types emerge without new selection pressures. Informational accounts (covariance theories) are too permissive, granting content to any reliable correlation, including accidental ones. Consumer-based theories rely on the downstream system having a fixed function to interpret the signal; however, in complex learning, the consumer's function is often plastic and learned alongside the detector. Hybrid accounts typically patch these gaps by appealing to "normal conditions," but this begs the question of what makes a learning condition "normal" for content fixation rather than mere causal adjustment. None of these frameworks rigorously distinguish between learning via external correction and learning via consequence retention, nor do they analyze the semantic implications of that difference.

  **Methodology and Timeline (4 Months)**
  This is a conceptual analysis project; no empirical work will be conducted. Machine learning architectures will serve as heuristic test cases to clarify the philosophical distinction, not as the primary subject of inquiry.

  *   **Month 1: Refinement and Literature Mapping.** I will formalize the definitions of "sticky" and "taught" mappings to ensure they track normative structures rather than merely mechanistic ones. I will map existing teleosemantic treatments of learning (e.g., habit formation, operant conditioning) to ensure the proposed distinction is not merely terminological.
  *   **Month 2: The Case Against Taught Mappings.** I will develop the argument that taught mappings transmit derived content. This involves analyzing the source of the error signal: if the signal is semantic, the learner inherits content; if the signal is non-semantic, the mapping fails to gain content.
  *   **Month 3: The Sticky Mapping Problem.** I will test whether success-based retention can fix content without independent functional anchors. The focus will be on the "co-learning" worry: if the producer and consumer of a signal adapt to each other without external constraint, does indeterminacy return?
  *   **Month 4: Synthesis and Drafting.** I will integrate the findings into a 7,000-word paper. The conclusion will offer a criterion for "content-conferring learning" or argue for a deflationary view of learned content.

  **Expected Outcomes**
  *   **Positive Result:** A criterion distinguishing learning histories that confer content from those that merely adjust parameters. This would likely involve identifying a necessary condition where the "success" in sticky mappings must be defined by a function established prior to the learning episode.
  *   **Negative Result:** A demonstration that within-lifetime learning never confers underived content. This would imply that all learned content is ultimately parasitic on evolutionary history or external semantic agents, significantly narrowing the scope of teleosemantics.

  **Risk and Failure Analysis**
  There are three significant risks to this project.
  1.  **Collapse into General Indeterminacy:** The problems facing sticky mappings may simply be the classic distality and indeterminacy problems re-scaled. If the "co-learning" worry is identical to the general problem of mapping functions to behaviors, there is nothing special about learning, and the project loses its specific contribution.
  2.  **Redescription of Existing Distinctions:** The sticky/taught split risks being a philosophical redescription of the supervised vs. reinforcement learning distinction, or of existing distinctions between "guidance by representation" and "selection by consequence." If this distinction is already well-trodden in the literature without yielding semantic results, my project may fail to generate new leverage. I will mitigate this by focusing strictly on the *normative status* of the history, not the mechanism.
  3.  **The "Function" Regress:** If sticky mappings require a pre-existing function to define "success," we may face a regress where all learned content requires prior innate content. If I cannot stop this regress without appealing to phylogeny, the project concludes that ontogenetic teleosemantics is impossible—a valid but deflationary result.

  ***

  ### AI Assessment: The "Sticky/Taught" Distinction

  You asked me to tell you if this split is a redescription. Here is the honest assessment:

  **Yes, it is very close to existing distinctions, but that doesn't mean the project is dead.**

  1.  **Mechanistic Redescription:** In cognitive science and ML, your "taught" vs. "sticky" is almost exactly **Supervised Learning** (error signal provided by a labeler) vs. **Reinforcement Learning** (scalar reward signal based on outcome). In philosophy of biology/psychology, this echoes the distinction between **Operant Conditioning** (selection by consequence) and **Instructional/Guided Learning**.
  2.  **Philosophical Precedent:** Teleosemanticists (Millikan, Papineau, Neander) have discussed learning. Millikan, for instance, distinguishes between "proper functions" (selected) and "derived proper functions." Your "taught" category sounds like it maps onto *derived* proper functions.
  3.  **The Novelty Hook:** The novelty isn't in *finding* the distinction, but in arguing that **only one (or neither) has semantic traction.** Most philosophers assume learning *works* for teleosemantics if you stretch the definition of "function." Your project is aggressive: it suggests learned content might be *derivative* (taught) or *indeterminate* (sticky).

  **Advice for the Proposal:**
  Don't claim you *discovered* these two types of learning. Frame it as: *"While the mechanistic distinction between correction-based and consequence-based learning is known, its semantic implications remain unexplored."* This protects you from the "redescription" criticism. You are investigating the *normative consequences* of the distinction, not the distinction itself.

  **One specific philosophical worry:**
  Be careful with "Sticky." In Reinforcement Learning, there *is* an error signal (the reward prediction error). It's not just "success." It's a signal saying "that was better than expected." If your "sticky" case relies on a reward signal, it might look more like "taught" (external signal) than you think. You need to define "success" carefully—is it an internal feeling of satisfaction (homeostatic) or an external reward? If it's internal homeostasis, you're back to evolutionary functions. If it's external reward, it looks like a teacher. **Sharpening what "sticky" means is your biggest philosophical hurdle.**
