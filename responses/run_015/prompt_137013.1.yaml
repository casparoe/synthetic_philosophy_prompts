  **Procedure: Reference Class Selection & Risk Score Triage**
  **Time Budget:** 15 Minutes per Complaint
  **Owner:** Risk Data Team

  ### Preamble: The $n=1$ Reality
  We acknowledge that the "true" reference class for any patient is the individual themselves ($n=1$). This is not a database defect; it is an ontological fact. Frequencies require groups. Therefore, every number we display is an approximation based on similarity. This procedure does not solve the reference class problem; it manages the *error* and *liability* introduced by forcing unique individuals into groups. When the approximation error is too high, we display nothing.

  ### Step 1: The Leakage & Validity Check (Stop/Fail)
  **Question:** Is the reference class defined, even partially, by the outcome we are predicting, or by variables selected *after* observing the outcomes (post-hoc fishing)?
  *   **Good Enough Answer:** "No. The class variables were pre-specified in the model protocol or clinical guideline before outcome analysis."
  *   **Fail Condition:** "Yes" or "We're not sure if this subgroup was pre-specified."
  *   **Action:** **STOP. Show No Number.** (Reason: Circular logic guarantees false confidence.)

  ### Step 2: The Stability Check (Compliance Gate)
  **Question:** Does the specific reference class containing this patient have $n \ge 50$ in our local historical data?
  *   **Good Enough Answer:** "Yes, query returns $n \ge 50$."
  *   **Fail Condition:** "No, $n < 50$."
  *   **Action:** Proceed to Step 3. (Do not show the number yet.)

  ### Step 3: The Broadening Test (Critical Features)
  **Question:** If we broaden the class to meet $n \ge 50$ (e.g., remove the rare genotype), do we remove a feature that is the *primary clinical indication* for this risk assessment?
  *   **Good Enough Answer:** "No. The broadened class still captures the main risk drivers (e.g., age, major comorbidity)." -> **Show Broadened Number.**
  *   **Fail Condition:** "Yes. The rare feature (e.g., genotype) is the main reason we are calculating risk, and ignoring it makes the number misleading."
  *   **Action:** **STOP. Show No Number.** (Reason: Stability achieved at the cost of relevance.)

  ### Step 4: The Obsolescence Check (Cohort Age)
  **Question:** Is the underlying cohort >10 years old *and* has the standard of care changed materially (e.g., new drug class, surgical technique) without local recalibration?
  *   **Good Enough Answer:** "No. Either the cohort is recent, or we have verified calibration against recent outcomes."
  *   **Fail Condition:** "Yes. The data is 15 years old and we know current drugs lower this risk, but we haven't recalibrated."
  *   **Action:** **STOP. Show No Number.** (Reason: Systematic bias.)

  ### Step 5: The Conflict Resolution (Multiple Valid Classes)
  **Question:** Are there two valid, stable classes that give materially different probabilities (e.g., 11% vs 26%)?
  *   **Good Enough Answer:** "Yes."
  *   **Tie-Breaker Rule:** Prefer the class derived from the **primary validated model output** over a **post-hoc subgroup slice**.
      *   *Rationale:* Subgroup slicing increases variance and risks hidden leakage, even if $n \ge 50$. The model output is legally and statistically more defensible.
  *   **Action:** Select the Model Output number.

  ### Step 6: The Values Gate (Escalation)
  **Question:** Does the chosen reference class rely on protected attributes (race, insurance status, sex) to stratify risk?
  *   **Good Enough Answer:** "No." -> **Display Number.**
  *   **Fail Condition:** "Yes."
  *   **Action:** **ESCALATE.** Do not decide locally. Flag for Ethics/Compliance review. (Reason: This is a policy decision, not a data one.)

  ---

  ### Limitations: What This Procedure Cannot Tell You
  1.  **Truth:** It cannot tell you which number is "true" for the patient. It only tells you which number is stable and valid.
  2.  **Equity:** It cannot determine if using a proxy (like race) is ethically permissible; it only flags it for human review.
  3.  **Individual Deviation:** It cannot account for unmeasured factors (social determinants, adherence) that make this patient different from the class average.
  4.  **Decision Utility:** It prioritizes defensibility over utility. A number might be statistically valid (Step 5) but clinically unhelpful if the clinician knows the model is outdated.

  ---

  ### Application to Open Complaints

  **Case 1: 62-year-old diabetic (11% vs 26%)**
  *   **Step 1 (Leakage):** Pass. Both classes appear "reasonable" (pre-specified).
  *   **Step 2 (Stability):** Pass. Prompt implies both are "perfectly reasonable," assuming $n \ge 50$.
  *   **Step 4 (Obsolescence):** Pass. Assuming calibration holds for the model.
  *   **Step 5 (Conflict):** **Active.** Cardiology wants 26% (subgroup slice: diabetic + stent + kidney). You suspect 11% (validated model output).
  *   **Procedure Decision:** Apply Tie-Breaker. Prefer the **validated model output (11%)**. The 26% is likely a post-hoc slice which increases variance and liability, even if clinically intuitive.
  *   **Output:** **Show 11%.**

  **Case 2: 34-year-old with genotype ($n=19$)**
  *   **Step 1 (Leakage):** Pass. Genotype is a predictor, not an outcome.
  *   **Step 2 (Stability):** **Fail.** $n=19 < 50$.
  *   **Step 3 (Broadening):** **Fail.** To get $n \ge 50$, we must ignore the genotype. However, the genotype is the *primary indication* for this specific risk assessment (otherwise we'd just use age). Removing it makes the number misleading ("not about her").
  *   **Procedure Decision:** Stop at Step 3.
  *   **Output:** **Show No Number.**

  **Case 3: Post-op pneumonia estimate (Outcome-defined class)**
  *   **Step 1 (Leakage):** **Fail.** The class was "defined using the outcome."
  *   **Procedure Decision:** Stop immediately at Step 1. This is circular reasoning ($P(Outcome|Outcome)$).
  *   **Output:** **Show No Number.**

  ---

  ### Summary of "No Number" Decisions
  The procedure dictates that we withhold risk scores when the data is circular (Case 3) or when achieving statistical stability requires removing the critical feature that defines the patient's risk profile (Case 2). In Case 1, a number is shown, but the procedure resolves the conflict in favor of the defensible model output rather than the clinically aggressive subgroup slice.

