answer: |-
  # The Sunk Cost Triage Protocol (SCTP)

  **Owner:** Engineering Leadership  
  **Status:** Draft / Experimental  
  **See also:** *Why Our Deploy Pipeline Is Haunted*, *The "Just One More Week" Estimation Guide*

  ## The Philosophy (Read this once, then ignore it)

  Your CTO is technically right: money/time spent yesterday cannot be recovered today. Deciding to continue a project *just* because you spent 8 months on it is irrational.

  However, your CTO is practically wrong: stopping a project isn't free. The 8 months you spent bought you **assets** (code, knowledge, integrations) and created **commitments** (dependencies, reputation). Throwing those away has a *future* price tag.

  **The Goal:** Stop arguing about the past. Start pricing the future. This checklist forces you to convert "we already did X" into "stopping now will cost us Y."

  ---

  ## The Procedure (45 Minutes Max)

  **Prep:** Whiteboard, timer, no laptops.  
  **Rule:** If someone says "But we already spent...", the facilitator yells "FUTURE COSTS!" and they have to put a dollar in the swear jar (or just rephrase).

  ### Phase 1: The Asset Audit (10 mins)
  *Goal: Separate "time wasted" from "value created."*

  1.  **What executable value exists right now?**
      *   [ ] Code in production?
      *   [ ] Code merged but behind a flag?
      *   [ ] Only local branches?
      *   *Signal:* If it's in prod, stopping is a migration, not a cancellation.
  2.  **What knowledge is embedded in the team?**
      *   [ ] Did we learn something about our data patterns we didn't know before?
      *   [ ] Is that knowledge documented, or only in Sarah's head?
      *   *Signal:* Undocumented knowledge is a liability. Documented knowledge is an asset.
  3.  **The "Cold Start" Test:**
      *   *Question:* If we killed this today and started a *different* solution tomorrow, how much of the last 8 months would we need to re-learn or re-build?
      *   *Answer:* ____ % of effort.
      *   *Signal:* If >50%, the "sunk cost" is actually "pre-paid work" for the next iteration.

  ### Phase 2: The Coordination Tax (10 mins)
  *Goal: Catch the inverse bias (killing things to look rational) and account for dependencies.*

  4.  **Who else is betting on us?**
      *   [ ] List teams waiting on this deliverable.
      *   [ ] List promises made in OKRs/Roadmaps.
      *   *Signal:* If other teams have allocated headcount based on this finishing, killing it imposes a *future* cost on them (idle time, replanning). That is not sunk cost; that is collateral damage.
  5.  **The Reputation Hit:**
      *   *Question:* If we kill this, does leadership/platform trust us to start the *next* big thing?
      *   [ ] Yes, they'll trust us.
      *   [ ] No, we look flaky.
      *   *Signal:* If "No," the cost of killing includes higher scrutiny on future proposals.

  ### Phase 3: The "Finish Line" Reality Check (15 mins)
  *Goal: Determine if the project is actually finishable, regardless of past cost.*

  6.  **The Morale Velocity Multiplier:**
      *   *Question:* On a scale of 1-10, how much does the team hate this?
      *   *Score:* ____
      *   *Calculation:* Take remaining estimated weeks. Multiply by (Score / 5).
      *   *Example:* 10 weeks left * (9 hate / 5) = 18 actual weeks.
      *   *Signal:* High hate = slipped deadlines = increased future cost.
  7.  **The Unknown Scope Penalty:**
      *   *Question:* Is the remaining work scoped?
      *   [ ] Yes, ticketed and estimated.
      *   [ ] No, "we just need to polish it."
      *   *Signal:* If "No," add 50% buffer to remaining cost. Unscoped "polish" is where projects go to die.
  8.  **The Alternative Cost:**
      *   *Question:* What is the concrete cost of the *next best option*? (e.g., Buying a SaaS, using the open-source default).
      *   *Cost:* $____ and ____ Engineer-Weeks.

  ### Phase 4: The Verdict (10 mins)
  *Goal: Make a call or admit it's a values judgment.*

  **Calculate:**
  *   **Cost to Finish:** (Remaining Weeks * Morale Multiplier) + (Unknown Scope Penalty)
  *   **Cost to Kill:** (Migration Effort) + (Coordination Tax/Replanning) + (Alternative Cost)

  **Decision Matrix:**
  *   If **Cost to Finish** < **Cost to Kill**: **CONTINUE** (But scope-lock immediately).
  *   If **Cost to Kill** < **Cost to Finish**: **KILL** (Migration plan starts now).
  *   If **Costs are Equal** OR **Morale Score is > 8**: **PUNT TO LEADERSHIP**.
      *   *Note:* This is no longer a math problem. This is a "do we value team happiness or platform consistency?" question. The checklist cannot solve values conflicts.

  ---

  ## Simulation Run-Throughs

  Here is the protocol applied to two real scenarios. Note where the math overrides the "vibe."

  ### Case A: The In-House ORM (Your Current Situation)
  *Context: 8 months in, 60% done, morale low, 2 services integrated.*

  1.  **Asset Audit:** Code is in 2 services (High switching cost). Knowledge is in heads (High risk). Cold Start Test: We'd need 70% of the learning again if we switched.
  2.  **Coordination Tax:** Platform team planned their quarter around this. Killing it breaks their roadmap (High tax).
  3.  **Reality Check:**
      *   Remaining Work: Estimated 4 months.
      *   Morale Score: 9/10 (Despised).
      *   Adjusted Finish Time: 4 months * (9/5) = **7.2 months**.
      *   Scope: "Just edge cases" (Unscoped). Add 50% buffer. **Total Finish: ~11 months.**
      *   Alternative: Use existing open-source ORM. Migration effort: 2 months.
  4.  **The Math:**
      *   **Cost to Finish:** 11 months of high-pain engineering time.
      *   **Cost to Kill:** 2 months migration + Platform team replanning (1 month equiv). **Total: 3 months.**

  **Verdict:** **KILL IT.**
  *Why this hurts:* You feel like you're throwing away 8 months. But the protocol shows the *future* cost of finishing (11 months of misery) is 3x the cost of migrating off (3 months). The "Asset" of code in 2 services is outweighed by the "Liability" of team burnout and unscoped edge cases.
  *Action:* Freeze ORM work. Write migration plan to open-source alternative. Apologize to Platform team.

  ### Case B: The Underused Cloud Contract
  *Context: Multi-year contract, paying for unused capacity. Migration to cheaper provider is possible but "nobody has scoped it."*

  1.  **Asset Audit:** No code assets. Just a billing relationship. Cold Start Test: 0% re-learning needed.
  2.  **Coordination Tax:** No other teams depend on this specific vendor. Reputation hit: Low (finance decision).
  3.  **Reality Check:**
      *   Remaining Contract Cost: $500k/year.
      *   Morale Score: 2/10 (Nobody likes paying waste, but nobody hates the tech).
      *   Alternative Cost: Cheaper provider ($200k/year).
      *   Migration Effort: **Unscoped.**
      *   *Protocol Rule:* Unscoped work gets 50% buffer. Engineering time is $10k/week.
      *   *Risk:* If migration takes 6 months (unscoped), that's $240k in eng time + downtime risk.
  4.  **The Math:**
      *   **Cost to Keep:** $500k cash. (Known).
      *   **Cost to Kill:** $200k (new contract) + $240k (eng time risk) + Downtime Risk. **Total: ~$440k + Risk.**
      *   *Wait, check the protocol:* The protocol says if Migration Effort is **Unscoped**, we must treat it as High Risk.
      *   *Re-evaluation:* Is saving $60k worth the risk of an unscoped migration that could break prod?
      *   *Protocol Override:* If the "Cost to Kill" involves unscoped engineering work that touches prod, and the savings are <20% of total budget, the protocol defaults to **Known Costs > Unknown Risks.**

  **Verdict:** **KEEP IT (FOR NOW).**
  *Why this hurts:* It feels like waste to pay for unused capacity. But the protocol flags "unscoped migration" as a massive future cost variable. Paying the known $500k is cheaper than an unscoped engineering disaster.
  *Action:* Renew contract. *Condition:* Scope the migration properly in Q1. If scoped cost < savings, switch in Q2.

  ---

  ## Failure Modes (Where this checklist lies to you)

  1.  **The Estimation Game:** Engineers will pad the "Cost to Finish" estimates to kill projects they dislike, or shrink them to save their babies. *Mitigation:* Require estimates from someone not on the project.
  2.  **The Morale Fudge:** "Morale" is subjective. A tired team might say 9/10 hate when it's actually a 5/10 frustration. *Mitigation:* Look at velocity charts, not feelings. Is velocity actually dropping?
  3.  **False Precision:** Adding up "months" and "dollars" makes it look like science. It's not. It's structured guessing.
  4.  **The "Values" Punt:** Sometimes the math says "Kill," but the strategic value is "Learn." (e.g., We built the ORM to learn how our data flows, not to ship an ORM). The checklist doesn't capture R&D value well. If this is R&D, ignore the "Cost to Finish" and ask "Did we learn enough?"

  ## Final Note
  If you run this and the result is "Kill the ORM," do not frame it as "We wasted 8 months." Frame it as "We bought 8 months of knowledge that told us this path is too expensive. The purchase is complete."

  Then stop talking about it.
