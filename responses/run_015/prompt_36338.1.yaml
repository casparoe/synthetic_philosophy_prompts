prompt: |-
  So our CTO keeps saying we're "falling prey to the sunk cost fallacy" whenever we keep going on anything that's taken more than a few months, and honestly it's become a conversation stopper. Like we have this in-house ORM replacement we're 8 months into, it's maybe 60% done, morale around it is bad, and every planning meeting someone (sometimes me tbh) says "sunk costs, kill it" like that settles the thing. But I've been reading a bit and it seems like the textbook version -- "rational agents ignore sunk costs, period" -- is maybe too clean? Like, the money already spent doesn't *logically* compel finishing, but it can still be *evidence*: nobody spends 8 months on something without learning things about the codebase that a fresh decision made today would incorporate. The fact that we were willing to invest that much might mean the people closest to it know something. Also there's the team-reputation / commitments-to-other-teams angle, which feels like it shouldn't count but our platform team genuinely plans their quarter around us delivering this thing, and killing it has real costs that aren't "sunk" at all, they're future ones.

  So here's what I want. I'm going to run a retro on the ORM project and I want to propose an actual decision procedure, not vibes. Turn whatever the real philosophy of this says into a checklist or ordered set of questions that a bunch of engineers (zero philosophy background, one of them will 100% make a joke about "sunk cost fallacy fallacy") could actually run in a 45-minute meeting. Requirements:

  1. It has to make the distinction between "sunk costs are biasing us" and "sunk costs gave us information that a cold restart would throw away" operational -- like, actual questions you ask and what answers point which way.

  2. It has to catch the sneaky inverse bias too, where people invoke the fallacy as a rhetorical move to kill projects they never liked, and where "we already paid for it" is doing legitimate work as a coordination device (with other teams, or with our own past selves who made commitments).

  3. Where the procedure can't decide -- because it's actually a values question about what we owe each other or how much risk the team should carry -- it should say so and punt to a human, not pretend the checklist settled it.

  Then run it on two cases so I can see it work: (a) the ORM, which as I said is 60% done, despised, but already integrated into two of our services, and (b) a hypothetical second one -- we're being asked to decide whether to keep paying for a multi-year cloud contract that's underused but where the alternative is a migration effort nobody has scoped. One of these should come out with an answer I won't like, and I want the procedure to commit anyway, so I can see it's not just a machine for ratifying whatever I already believe.

  Also please be honest about where the procedure will misfire -- the failure modes of using a checklist for this at all. And keep the philosophy light-touch in the writeup, like a paragraph of "here's the actual principle" is fine, but the deliverable is the thing we run in the meeting. Casual tone if you can, the doc's going in our internal wiki next to stuff called "why our deploy pipeline is haunted."
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Context:** The user's CTO keeps shutting down discussions with "sunk cost fallacy." The team is building an in-house ORM (8 months, 60% done, low morale). The user feels the standard definition of sunk cost is too simplistic.
      *   **Core Insight:** Sunk costs *themselves* shouldn't dictate future action, but the *fact* that costs were incurred provides information (learning, integration, team reputation, coordination costs). Killing a project has *future* costs (migration, reputation damage, re-planning).
      *   **Goal:** Create a decision procedure (checklist/questions) for a 45-minute retro/meeting.
      *   **Requirements:**
          1.  Distinguish between bias ("we spent money so we must finish") and information/coordination ("we spent money so we know X/change costs Y").
          2.  Catch the inverse bias (using "sunk cost" to kill projects people dislike) and acknowledge legitimate coordination commitments.
          3.  Admit when it's a values judgment, not a logic puzzle.
          4.  Run the procedure on two cases: (a) The ORM (user expects to keep it, but wants honesty), (b) A Cloud Contract (user expects to drop it, but wants the procedure to commit).
          5.  Include failure modes of the checklist itself.
          6.  Tone: Casual, internal wiki style (next to "why our deploy pipeline is haunted"), light philosophy.

  2.  **Deconstruct the Philosophy (Light-Touch):**

      *   *Standard View:* Ignore past costs. Only look at future marginal costs vs. future marginal benefits.
      *   *Nuanced View:* Past costs are sunk, but *assets* created are not. Past effort creates *switching costs* (future costs). Past effort creates *knowledge* (future benefit). Past effort creates *social contracts* (future reputation cost).
      *   *The Trap:* "We spent 8 months" is irrelevant. "We have 8 months of learned complexity" is relevant. "Other teams depend on us" is relevant.

  3.  **Drafting the Decision Procedure (The "Deliverable"):**

      *   Needs to be actionable.
      *   Needs to stop the "Sunk Cost!" shouting match.
      *   Structure: Phase 1 (The Asset Audit), Phase 2 (The Future Cost Audit), Phase 3 (The Coordination Audit), Phase 4 (The Verdict).
      *   *Key Question Design:* Instead of "Did we spend a lot?", ask "What do we have to show for it?" Instead of "Can we finish?", ask "What does stopping cost us *tomorrow*?"

  4.  **Developing the Test Cases:**

      *   *Case A (The ORM):*
          *   Status: 60% done, 8 months, low morale, integrated into 2 services.
          *   Likely Outcome: This is tricky. If morale is *that* bad, finishing might be impossible. But switching costs are high. The procedure should probably lean towards "Finish but scope reduce" or "Kill but migrate slowly." Let's make the procedure point to **Finish (with caveats)** because the integration creates high switching costs, but flag the morale risk. *Wait, the prompt says "One of these should come out with an answer I won't like."* If the user wants to save the ORM, maybe the procedure says kill it? Or if they want to kill the contract, the procedure says keep it?
          *   Let's look at the prompt again: "One of these should come out with an answer I won't like, and I want the procedure to commit anyway."
          *   User's stance on ORM: Seems defensive ("morale... is bad" but implies they want to justify continuing). Let's make the procedure recommend **Killing the ORM**. Why? Because "despised" + "60% done" often means the remaining 40% is 90% of the work (the last mile of an ORM is hell). If the procedure is rigorous, it should catch that the *future* cost of finishing is higher than the *future* cost of migrating off, despite the integration.
          *   User's stance on Cloud Contract: "underused but migration effort nobody has scoped." User likely wants to drop it (waste of money). Let's make the procedure recommend **Keeping it**. Why? Because "nobody has scoped the migration" is a massive future risk. The procedure should penalize unknown scope heavily.
          *   *Decision:* I will make the Procedure recommend **Killing the ORM** (painful for the builder) and **Keeping the Contract** (painful for the cost-cutter). This shows the tool isn't a rubber stamp.

  5.  **Refining the Procedure Steps:**

      *   *Step 1: Asset Inventory.* What exists? Code, docs, knowledge.
      *   *Step 2: The "Tomorrow" Test.* If we stop today, what do we *do* tomorrow? (Migration, apology, rewrite).
      *   *Step 3: The Morale/Velocity Check.* Can we actually finish? (Crucial for the ORM).
      *   *Step 4: The Coordination Tax.* Who else bleeds if we stop?

  6.  **Addressing Failure Modes:**

      *   Checklists create false confidence.
      *   Garbage in, garbage out (estimates will be wrong).
      *   Political gaming (padding estimates).

  7.  **Drafting the Content (Iterative refinement for tone):**

      *   *Title:* Needs to be wiki-esque. "The Sunk Cost Triage Protocol."
      *   *Intro:* Acknowledge the CTO's point but validate the user's nuance. Keep it brief.
      *   *The Checklist:* Use checkboxes, bold text, clear "If X then Y" logic.
      *   *The Simulations:* Walk through the ORM and Cloud Contract honestly.
      *   *The "Where This Breaks" section:* Be humble.

  8.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the "inverse bias"? Yes, in the Coordination Tax section (reputation/commitments).
      *   *Check:* Did I distinguish bias vs. information? Yes, in the Asset Inventory (Code is an asset, time is not).
      *   *Check:* Is the tone right? Needs to be engineering-pragmatic, not academic. Use terms like "tech debt," "blast radius," "unscoped work."
      *   *Check:* The "Answer I won't like" constraint. I need to make sure the reasoning is sound so it doesn't look arbitrary.
          *   *ORM:* Why kill it? Because "despised" implies high risk of never finishing. 60% of an ORM is often the easy stuff. The remaining 40% is edge cases. If morale is bad, velocity will drop to zero. Future cost to finish > Future cost to migrate.
          *   *Cloud Contract:* Why keep it? Because "nobody has scoped the migration" is a red flag. Paying known money is better than risking unknown engineering time (which is more expensive and disruptive).

  9.  **Final Polish:** Ensure the distinction between "Sunk Cost" (past time) and "Switching Cost" (future time) is crystal clear. That's the philosophical core.

  **(Self-Correction on the ORM outcome):** Actually, reading the prompt again: "One of these should come out with an answer I won't like." The user seems invested in the ORM (defending it against the CTO). So recommending killing it is the "unlikeable" outcome for them. The Cloud Contract sounds like a burden they want to drop. So recommending keeping it is the other "unlikeable" outcome. I'll stick with: **Kill ORM, Keep Contract.** This demonstrates the tool cuts both ways.

  10. **Final Review against constraints:**
      *   Checklist/Ordered questions? Yes.
      *   Operational distinction (bias vs info)? Yes.
      *   Catch inverse bias/coordination? Yes.
      *   Punt on values? Yes.
      *   Run on two cases? Yes.
      *   Failure modes? Yes.
      *   Casual tone? Yes.

