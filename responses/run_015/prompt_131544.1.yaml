      *   *Counterfeit marks:* Borrowing (training data), Effectfulness (optimized stimuli).
      *   *Solidarity:* Viewers donating money or reconciling after watching.

  7.  **Writing - Focus on Sensory Detail:**
      *   The cool air of the server room.
      *   The glow of the haptic interface.
      *   The specific imagery of the video (a grey coat, a wet pavement).
      *   Elara's physical reaction (tightness in chest, cold coffee).

