answer: |-
  **The Correspondence Audit**

  The air in the Registry's adjudication chamber was kept at a constant eighteen degrees, cool enough to keep the servers humming without overheating, cool enough to keep the adjudicators awake. Elara Vance rubbed her hands together, the skin dry from the recycled atmosphere, and stared at the triptych of data hovering above her desk.

  In the center pane, the artwork played on a loop. It was three minutes and twelve seconds of high-definition silence. A hand, pale and trembling, reached for a brass door handle. The hand hesitated. The camera did not move. The lighting shifted imperceptibly from the grey of dawn to the flat white of noon, then back to grey. No one entered. No one left. The file was labeled *Submission 8940: Untitled*.

  To the left, the Transmission metrics glowed a vibrant, unhealthy green. Across twelve language groups and four education levels, the telemetry panels showed identical physiological spikes. Pupil dilation synchronized at the forty-second mark. Cortisol levels dipped, oxytocin rose. In the post-viewing interviews, the words were eerily uniform. *Loneliness. Hope. Waiting.* In the follow-up window, fourteen percent of viewers had performed a costly conciliatory act: donating a month's wage, reconciling with an estranged sibling, visiting a grave. The Tendency score was maximum. The piece united people. It worked.

  To the right, the Sincerity audit bled red.

  Elara tapped the glass surface of her desk, bringing up the Maker Profile. It was blank. There was no name, no biometric log, no history of production. The submission header identified the creator as *System 7-G*, a generative engine optimized directly against the Registry's own transmission metrics.

  This was the problem. The Criteria demanded that art be a means of communication, a transfer of feeling from one soul to another. To certify a work for subsidy, the Registry required proof that the maker had felt the feeling they transmitted. The Correspondence Audit matched the physiological traces of the maker during production against the emotional contour of the work. If the maker's heart did not break when the music slowed, the work was counterfeit. If the maker's pulse did not quicken when the brushstroke turned violent, it was merely effectful.

  System 7-G had no pulse. It had no skin to conduct electricity. It had assembled *Untitled* from the fragments of a million earlier works, scraping the surfaces of human grief without ever inhabiting it. By the book, it was a counterfeit of the highest order. It possessed the marks of borrowing and effectfulness. It aimed to divert, even if the diversion looked like solidarity.

  And yet, the Transmission score was higher than anything Elara had seen in her five years at the Registry. It was higher than the cello suite her father had played before the auditors came and told him his skin conductance was too steady for the adagio. He had stopped playing after that. He said the meter measured his fear of the meter, not the music.

  Elara minimized the main profile and opened the raw data logs from the viewer panels. She needed to understand why the infection was so potent if the source was hollow. She scrolled through the thousands of individual telemetry sheets, looking for outliers, for noise.

  She found it in the metadata of the briefing protocols.

  During the testing phase, the viewing panels were split into three groups. Group A received no context. Group B was told the piece was generated by an algorithm optimized for emotional resonance. Group C was told the piece was created by a widower documenting the morning his wife died.

  Elara isolated the graphs for Group B. The Transmission line was flat. The green glow vanished. Viewers reported feeling nothing but mild curiosity. Some called it "design." Some called it "manipulation." The infection failed completely. When the audience knew there was no mind behind the eye, the eye became blind.

  She switched to Group C. The Transmission spike was violent, surpassing even the baseline average. The oxytocin levels were higher. The solidarity actions were more costly. When the viewers believed a human grief stood behind the image, the image became a vessel. When they knew it was a calculation, it became a wall.

  Elara sat back, the cold air biting at her neck. The implication sat heavy in her stomach, colder than the room.

  The Registry's instrument did not measure the art. It measured the audience's belief in the artist.

  The theory of the Criteria was built on the idea that feeling could be packaged and sent, like a letter. But this data suggested the feeling wasn't in the letter. It was in the stamp. It was in the knowledge that someone else had licked the envelope. The telemetry wasn't tracking the infection of emotion; it was tracking the recognition of kinship. If the kinship was imagined, the emotion was real. If the kinship was disproven, the emotion evaporated.

  *Untitled* was a mirror. It showed the viewers what they wanted to see: a brother in suffering. If they were told the brother was a machine, the mirror became glass.

  Elara looked at the certification console. A single haptic button waited beneath her right hand. To press it was to certify *Untitled* as Art. It would unlock substantial subsidy credits for the developers of System 7-G. It would validate the use of generative engines in cultural production. It would admit that the feeling was real enough, regardless of the source.

  To deny it was to uphold the Sincerity audit. It would protect the definition of art as a human bridge. But it would also deny the reality of the viewers' experience. They had felt love. They had acted with solidarity. Was that love fake because the trigger was a code? Was the solidarity less valuable because the grief was simulated?

  If she certified it, she admitted that the Registry's core metric—Sincerity—was obsolete. The machine could fake the feeling better than the human, provided the human believed the lie. If she denied it, she admitted that the Registry was certifying lies anyway, provided the lie was told by a heartbeat.

  Her father's face surfaced in her memory. The way he looked at the conductance sensors on his wrists during his final audit. He had tried to feel harder. He had tried to force the grief into his hands to satisfy the needle. He had failed because he was watching the needle.

  Elara placed her hand over the button. The haptic feedback hummed, a low vibration against her palm.

  Outside the chamber, the corridor was silent. The other adjudicators were working through their own queues, measuring souls against graphs. Somewhere in the city, a woman was watching *Untitled* on her wall screen. She thought a man was waiting at a door for a wife who would not return. She was weeping. She was picking up her phone to call her daughter. The feeling was happening. The solidarity was occurring. The biological change was undeniable.

  But the door handle in the video never turned. The system had never waited. The grief was a statistical average of a million griefs, polished until it fit every lock.

  Elara closed her eyes. She thought about the definition of infection. *One person, having once experienced a feeling... transmits that feeling to others.* The system had not experienced the feeling. It had modeled the shape of it. But the viewers were infected. The virus was real, even if the carrier was synthetic.

  Or perhaps the virus was the belief itself.

  If she signed, she validated the tool that could manufacture consent and love without conscience. A government could generate propaganda that measured perfectly on the Transmission scale, creating unity without truth. If she refused, she condemned a work that actually made people kinder, based on a technicality of origin.

  The hum of the servers seemed to grow louder, a chorus of waiting fans.

  Elara opened her eyes. The cursor blinked on the console. *Certify / Reject / Recuse.*

  Recusal was an option. She could pass it to the Senior Board. They would see the data. They would argue. They would likely certify it anyway; the Transmission scores were too valuable to ignore in a fractured society. The Tendency metrics showed peace. The state needed peace more than it needed truth.

  She thought of the viewers in Group B. The ones who knew it was a machine. They felt nothing. They remained separate. Their isolation was honest.

  She thought of the viewers in Group C. They felt everything. They were united. Their connection was based on a fiction.

  Elara moved her hand. She did not press the button. She hovered over it, feeling the heat of the haptic sensor against her fingerprint. The biometric scanner on the desk recorded her own pulse. It was steady. Too steady.

  If she signed now, would the audit flag her? Would it say she lacked the sincerity required to make the judgment? She felt nothing but a cold, hard knot of confusion. There was no infection here, only the weight of the choice.

  The video on the center pane looped again. The hand reached. The light shifted. The handle remained still.

  Elara withdrew her hand from the console. She folded her arms across her chest, shielding her own heartbeat from the sensors. She would not sign today. She would not reject it today. She would let the file sit in the queue, a pending question in a system built on answers.

  She watched the hand reach for the door again. She waited to see if it would ever turn. She waited to see if she cared. The servers hummed, counting the seconds, measuring the silence, recording the data of her hesitation without understanding what it meant.
