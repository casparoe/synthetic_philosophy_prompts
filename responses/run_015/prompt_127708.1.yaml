  ### Candidate Cases

  1.  **The Conscientious Doctor:** A surgeon must choose between finishing a pioneering surgical technique (ground project) or covering an extra shift to reduce waiting times (impartial good). *Discard:* Medical care is a professional duty; the impartial demand collapses into a moral obligation, violating Constraint 2.
  2.  **The Conscientious Objector:** A pacifist must choose between their commitment to non-violence or serving in a just war to protect others. *Discard:* Too high-stakes and political; risks introducing 'villains' or collapsing into a debate about moral duty rather than integrity versus impartiality.
  3.  **The Museum Curator:** A senior curator must choose between completing her life's work (a catalogue) or voting for a community programme that saves the museum. *Selected:* Fits the ordinary professional setting, the ground project is morally optional, and the fiduciary role mandates impartial deliberation.

  ### The Scenario

  Elena is the senior curator at a small municipal museum. Her ground project, spanning fifteen years, is producing a definitive catalogue raisonné of a neglected local modernist, a task that confers meaning on her professional life but carries no independent moral weight. The museum faces a budget shortfall; the board must decide whether to fund her catalogue or a new community outreach programme that will statistically increase access for disadvantaged youth. Elena holds a voting seat on the board. Impartial calculation favours the outreach programme slightly, requiring her to vote against her own project and shelve her work indefinitely.

  ### Analysis

  **The Integrity Complaint**
  The integrity complaint bites here because the impartial moral system requires Elena to treat her ground project not as a constitutive part of her identity, but as one satisfier of utility among others. She is required to adopt a neutral standpoint towards the very commitment that gives her reason to go on. This is not merely a complaint about loss or heavy cost; it is a complaint about alienation, where she becomes a channel for the satisfaction of community needs rather than an agent acting from her own convictions. The structure of agent-neutral morality demands she subordinate her identity to the balance of reasons.

  **The 'One Thought Too Many' Complaint**
  The 'one thought too many' (OTTM) complaint does not bite. In Williams's famous rescue case, the agent should act from love, not from the thought that saving a spouse is permissible. Here, however, the impartial thought is practically required from within the situation. As a board member with a fiduciary duty, Elena *ought* to deliberate impartially. If she voted for her catalogue without considering the outreach programme, we would criticise her for negligence or corruption. The institutional role mandates the impartial thought, rendering it appropriate rather than alienating in the moment of decision.

  **The Load-Bearing Feature**
  The single load-bearing feature is the **fiduciary institutional role**. It is this role that mandates impartial deliberation, thereby suppressing the OTTM complaint (by making the impartial thought required) while simultaneously generating the integrity complaint (by forcing the agent to submit her identity-conferring projects to that deliberation).

  **The Swap Test**
  If we replace the ground project (the catalogue) with a personal relationship (e.g., voting on her sister's grant application instead), the verdict on OTTM **does not flip**. In this institutional context, we would still criticise Elena for *not* having the impartial thought; nepotism is not excused by love. This suggests that the absence of the OTTM complaint is driven by the institutional constraints rather than the nature of the commitment itself. However, Williams might argue that even here, the demand to be impartial against a loved one is where the morality system becomes most alienating, suggesting a latent OTTM complaint that common morality suppresses.

  **The Strongest Reply (Unity Thesis)**
  A proponent of the unity thesis would argue that integrity is doing all the work here. They would claim that the OTTM complaint is simply the integrity complaint expressed in cases of immediate personal rescue. In this case, the reason OTTM does not bite is that the institutional role has already legitimised the alienation; thus, there is no integrity loss *relative to the role's expectations*. They would argue I have only separated the complaints by constructing a case where the 'morality system' is embedded in a professional norm, masking the alienation that Williams identifies as the core of both complaints.

  **Overall Assessment**
  I believe the separation is partially an artefact of the constraints. By placing the agent in an institutional role that mandates impartiality, we force the impartial thought to be appropriate, thereby silencing OTTM. However, the integrity complaint remains because the *content* of what is sacrificed (a ground project) is identity-conferring. The separation is real insofar as it shows OTTM is sensitive to the *context of deliberation* (private rescue vs. public role), whereas integrity is sensitive to the *content of the sacrifice* (identity vs. utility).

  **User's Hypothesis**
  Your hypothesis is correct. The case turns on whether a commitment arrives with a motivation of its own that can render deliberation idle. In the rescue case, love renders deliberation idle (OTTM bites). In this curatorial case, the fiduciary role prevents deliberation from being idle; the agent *must* weigh reasons. Thus, the impartial thought is required, and OTTM does not bite, even though integrity is compromised by the weighing itself.

