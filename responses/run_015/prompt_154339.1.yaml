      *   **Key Components:**
          *   Phenomena to explain (why different cultures handle grievance differently).
          *   Distinctions to respect (functional vs. intrinsic, descriptive vs. normative, moral morphology vs. moral ontology).
          *   Puzzles to dissolve (legalism vs. cruelty, victimhood vs. administrative honor, metric neutrality).
          *   Jointly unsatisfiable pairs (tensions within the framework).
          *   Flag the single most important requirement.
          *   Score two frameworks: The Standard Sociological Trajectory (Honor -> Dignity -> Victimhood) vs. Pluralist Functionalism.
          *   Constraints: No bibliographies/citations/references. Conceptual structure only. Precise about negotiable vs. non-negotiable.
      *   **Tone:** Rigorous, philosophical, analytical, step-by-step reasoning (internalized before output).

  2.  **Deconstruct the Core Concepts:**
      *   *Honor Culture:* External validation, collective standing, direct redress, sensitivity to slight.
      *   *Dignity Culture:* Internal worth, institutional/legal redress, privacy of conflict, resilience to slight.
      *   *Victimhood Culture:* Systemic harm, third-party arbitration, public acknowledgment of vulnerability, structural redress.
      *   *Moral Morphology:* The *shape* of the grievance (public/private, direct/mediated).
      *   *Moral Ontology:* The *nature* of the person (embedded in group, autonomous individual, structurally situated).

  3.  **Brainstorming Desiderata (The "Must-Haves"):**
      *   *Explanatory Power:* Must explain *why* the behaviors make sense to the actors, not just label them.
      *   *Normative Bite:* Can't just be "different strokes for different folks." Must allow for judgment.
      *   *Non-Imperialism:* Can't assume the observer's culture is the baseline.
      *   *Ontological Clarity:* Must distinguish *how* people are seen from *what* they do.
      *   *Dynamic Sensitivity:* Cultures aren't static; they blend and shift.
      *   *The "Cruelty" Test:* Must account for suffering/harm, not just coherence.

  4.  **Developing the Distinctions:**
      *   *Descriptive vs. Normative:* Sociology says "this is how they do it." Philosophy asks "should they do it?" The framework must bridge this without collapsing one into the other.
      *   *Morphology vs. Ontology:* This is crucial. Honor looks like dueling (morphology) because the self is porous/collective (ontology). Dignity looks like lawsuits (morphology) because the self is bounded/autonomous (ontology). Victimhood looks like advocacy (morphology) because the self is vulnerable/oppressed (ontology). A framework that confuses these will fail.
      *   *Functional vs. Intrinsic:* Does honor exist to keep order in stateless societies (functional), or is it a valid way of valuing reputation (intrinsic)?

  5.  **Identifying Puzzles:**
      *   *The Bureaucracy Trap:* Does Dignity's law reduce violence or just hide it?
      *   *The Honor/Victimhood Mirror:* Is Victimhood just Honor with HR as the audience? (Both seek external validation of status).
      *   *The Metric Problem:* How to judge without using Dignity (Western Liberal) standards as the default ruler?

  6.  **Identifying Tensions (Jointly Unsatisfiable Pairs):**
      *   *Neutrality vs. Judgment:* If you are truly neutral, you can't rank. If you rank, you aren't neutral.
      *   *Coherence vs. Critique:* If you prioritize internal coherence (functionalism), you can't criticize harmful practices that "work" for that culture.
      *   *Universality vs. Particularity:* Human rights (universal) vs. Cultural integrity (particular).

  7.  **Selecting the "Single Most Important Requirement":**
      *   Candidate 1: Non-imperialism. (Too vague).
      *   Candidate 2: Explanatory depth. (Necessary but not sufficient).
      *   Candidate 3: *The Distinction between Moral Morphology and Moral Ontology.*
      *   *Reasoning:* If you confuse the *form* of the grievance with the *nature* of the self, you will misdiagnose the culture. You might think Victimhood is just weak Honor, or Dignity is just cold Honor. Getting the ontology right is the prerequisite for any fair normative assessment. I will flag this one.

  8.  **Drafting the Desiderata Section:**
      *   Structure: Phenomena, Distinctions, Puzzles, Tensions, The Flag.
      *   Language: Precise, philosophical, avoiding colloquialisms.

  9.  **Drafting the Scoring Section:**
      *   *Standard Trajectory (Progress Narrative):* Honor -> Dignity -> Victimhood.
