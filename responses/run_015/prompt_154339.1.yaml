      *   *Pluralist Functionalism:* Cultures are adaptations to environments.
          *   *Success:* High explanatory power for morphology, respects internal logic.
          *   *Failure:* Normatively toothless (can't condemn harmful adaptations), struggles with the "Cruelty Test."

  10. **Refining and Polishing:**
      *   Check constraints: No citations? Check. Step-by-step thinking (internal)? Check. Precise on negotiable/non-negotiable? Check.
      *   *Self-Correction during drafting:* I need to make sure I don't just list things but explain *why* they are desiderata. I need to ensure the distinction between Morphology and Ontology is highlighted as the "workhorse."
      *   *Negotiable vs. Non-Negotiable:* I need to explicitly state which desiderata can be compromised. Usually, "definitive ranking" is negotiable (we might only get partial ordering), but "ontological clarity" is non-negotiable.

  11. **Final Review against Prompt:**
