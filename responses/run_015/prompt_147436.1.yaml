  hey so im president of student council and theres this huge mess. the principal is cutting the music program next year to "save budget" but i accidentally saw an email where hes actually just moving the money to the football team. if i leak that email to the school newspaper everyone will flip and theyll probably keep the music program. but like i wasnt supposed to see it and leaking private stuff feels wrong? my older brother says if your in charge sometimes you gotta do shady things to actually help people. is he right? i feel like im betraying trust but also saving something important. what should i actually do? sry for the typos lol
