      *   *The Principle:* **Sensitivity to Contextual Relevance / Goal-Representation.**
      *   Sphexish behavior executes a *procedure* without maintaining an active representation of the *purpose*. When the procedure becomes decoupled from the purpose (due to environmental change), a non-sphexish agent notices the decoupling and adjusts. A sphexish agent does not.
