  2.  **Deconstruct "Sphexishness":**
      *   *Origin:* Douglas Hofstadter (in *Gödel, Escher, Bach* and later essays), drawing on entomological observations (Fabre).
      *   *Definition:* Behavior that is rigid, stimulus-driven, lacks contextual awareness, and cannot adapt when the environment changes in unexpected ways *during* the execution of a plan.
      *   *Key Feature:* Insensitivity to *why* the action is being performed. The "goal" is lost; only the "script" remains.
      *   *Contrast:* "Sphexish" vs. "Sophisticated/Flexible/Intentional."

  3.  **Evaluate the User's Cases against the Definition:**

      *   *Wasp:* Classic. No internal representation of the goal (provisioning nest), only the script (drag, check, enter).
      *   *Flatmate:* Habitual. The "script" ran despite a major error (bad milk). He didn't *notice* the error until sensory feedback (taste) forced a break. This suggests low-level monitoring. Verdict: Sphexish (low-level).
      *   *Sleepwalker:* Unconscious. Script runs until a physical impossibility (kettle missing) halts it. No high-level planning. Verdict: Sphexish.
      *   *Jazz Musician:* Fixed structure (changes), infinite variation (melody). The structure is a scaffold for creativity, not a cage. High-level monitoring and intentionality. Verdict: Not sphexish.
