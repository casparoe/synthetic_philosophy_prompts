  *(Refining "Constitutive Luck"):* In safety, this is "Human Factors" or "Competence Assurance." If you are naturally impulsive, safety treats this as a mismatch between person and task. It pathologizes the constitution.

  *(Refining "Control"):* In safety, control is binary (Barrier Effective/Failed). In morality, it's gradational.

