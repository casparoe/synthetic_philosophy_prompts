      *   *Check:* Did I address ALARP? *Idea:* Use ALARP as the boundary where moral responsibility stops and "accepted risk" begins.
      *   *Check:* Is the "No-Blame" aspect clear? *Idea:* Contrast "Just Culture" (safety) with "Retributive Justice" (morality).
      *   *Critical Insight:* The biggest clash is that Safety Engineering *dissolves* the agent into the system, whereas Moral Luck debates *center* on the agent. I need to highlight this.

  8.  **Final Polish:** Organize into clear sections: The Translation, The Residue Report, The Blame vs. Design Analysis, and The Mutual Blind Spots. (Proceed to generate output based on this structure).

