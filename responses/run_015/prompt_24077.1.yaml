          5.  Where the framing might mislead philosophers.
      *   **Constraints:** No citations, no reading list, just the translation and analysis.

  2.  **Deconstruct the Moral Luck Debate:**
      *   *Core Tension:* We judge people based on outcomes, but outcomes depend on factors outside their control. Yet, we feel blame/praise is appropriate.
      *   *Types of Luck:*
          *   Outcome: How things turn out (drunk driver hits pedestrian vs. gets home safe).
          *   Situational: The circumstances faced (manager in war vs. peace).
          *   Causal: Prior causes determining actions (genetics/upbringing).
          *   Constitutive: Who you are (temperament).
      *   *Control Condition:* You are only responsible for what you control.
      *   *Reactive Attitudes:* Blame, praise, resentment, gratitude (Strawson).
      *   *Frankfurt Cases:* Moral responsibility without alternate possibilities (counterfactual intervener).

  3.  **Map to Process Safety Vocabulary:**
      *   *Moral Agent* $\rightarrow$ *Operator/Designer/Management System*.
      *   *Action/Decision* $\rightarrow$ *Initiating Event/Decision Node*.
      *   *Outcome* $\rightarrow$ *Top Event/Accident Sequence*.
      *   *Control* $\rightarrow$ *Barrier Function/Intervention Point*.
      *   *Blame/Responsibility* $\rightarrow$ *Accountability/Root Cause Attribution*.
      *   *Luck* $\rightarrow$ *Stochastic Variance/Unmodeled Boundary Conditions*.
      *   *Constitutive/Causal Luck* $\rightarrow$ *System Architecture/Design Basis/Human Reliability Data*.
      *   *Reactive Attitudes* $\rightarrow$ *Disciplinary Action/Safety Alert/Regulatory Penalty*.
      *   *ALARP* $\rightarrow$ *The threshold of acceptable risk (where responsibility ends and "acceptable residue" begins)*.
      *   *No-Blame Culture* $\rightarrow$ *Just Culture (focus on system, not individual)*.

  4.  **Drafting the Translation (Iterative Process):**

      *   *Outcome Luck:* Two identical initiating events (e.g., valve left open). One leads to release (bad outcome), one doesn't (near miss). In safety, we investigate both, but legally/regulatorily, the one with the release gets the penalty. This maps well.
      *   *Situational Luck:* An operator works in a plant with degraded barriers vs. a new plant. Same error, different risk profile.
      *   *Causal/Constitutive Luck:* This is tricky. In safety, this is "Human Error Probability" (HEP) or "Design Basis." If someone is naturally careless, safety engineering calls that a "latent defect" in hiring or training, not a moral failing.
      *   *Control Condition:* In safety, control is defined by "Authority to Act" and "Barrier Ownership." If you don't own the barrier, you aren't accountable for its failure.
      *   *Frankfurt Cases:* A safeguard that forces the correct action even if the operator intended otherwise. If the interlock works, the operator isn't blamed for the *intent*, only the *attempt*.
      *   *Reactive Attitudes:* In safety, this is "Disciplinary Matrix." Do we fire the operator or fix the procedure?

  5.  **Developing the Residue Report:**
      *   *Translates Cleanly:* Outcome luck (Accident vs. Near Miss), Situational luck (Plant conditions), Control (Barrier ownership).
      *   *Fudged:* Constitutive luck (becomes "competence" or "fitness for duty"), Reactive attitudes (becomes "corrective action").
      *   *No Expression:* The *feeling* of blame. Safety is normative/procedural, not emotional. The "ought" of morality vs. the "must" of compliance.
      *   *Blameworthiness:* Safety vocabulary tends to convert blame into "System Deficiency." If an outcome was outside control, safety says "Design Flaw," not "Blameless Agent." It medicalizes/engineers the moral problem away.
      *   *Misleading Philosophers:* Safety assumes risk can be quantified (HEP). Philosophy doubts the coherence of the agent itself. Safety assumes a "Just Culture" is possible; philosophy asks if *any* blame is justified.

  6.  **Refining the Tone:**
      *   Needs to sound professional, technical, but accessible to the engineer.
      *   Avoid academic jargon (except where translating).
      *   Be direct about the limitations.

  7.  **Self-Correction/Review during drafting:**
