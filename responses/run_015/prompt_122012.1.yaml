answer: |-
  This is a classic and very sharp argument. Your study partner has effectively constructed a *reductio ad absurdum* targeting the tension between **Phylogenetic Essentialism** and **Natural Kind Realism**.

  If you want to keep step (4) (the Phylogenetic Species Concept), you cannot accept the partner's interpretation of what (4) *does*. The mistake is not in the phylogeny itself, but in the assumption that phylogeny is a purely formal, structural property that can be detached from the causal processes that generate it.

  Here is the breakdown of where to intervene. You should reject the inference from **(5) to (6)**.

  Here is how you dismantle the argument while saving the Phylogenetic criterion.

  ### 1. The Core Error: Confusing Pattern with Process
  Your partner's argument relies on **structuralism**. They assume that if two things share the same *shape* (a branching tree of descent from a common ancestor), they share the same *ontological status*.

  **The Counter-Argument:**
  Phylogeny in biology is not just a pattern of inheritance; it is the historical trace of a specific **causal process**: *evolution by natural selection acting on populations within an ecosystem.*

  *   **Bacteria (Step 4):** When we say bacteria belong to a species because of a monophyletic lineage, we are implicitly referencing the causal mechanisms that maintain that lineage: metabolic constraints, developmental pathways, and ecological niches that restrict variation. The phylogeny is the *record* of these biological constraints.
  *   **Computer Viruses (Step 5):** Computer viruses have a genealogy, yes. But they do not evolve via natural selection in a biological sense. They evolve via human modification or blind replication within a digital environment that lacks biological homeostasis.

  **The Rejection:** Reject **(6)**.
  Just because computer viruses share the *topological feature* (branching lineage) does not mean they share the *natural kind property*. "Biological Species" is not defined by "having a tree structure." It is defined by "being a lineage produced by biological evolutionary processes." The "Biological" in "Biological Species" does work here. It restricts the domain to living systems.

  **Analogy:**
  *   (1) A heart is a pump.
  *   (2) A water pump is a pump.
  *   (3) Therefore, a water pump is a heart.
  *   *False.* "Heart" implies a specific biological context (circulatory system, organism), not just the functional property of pumping. Similarly, "Species" implies a biological context, not just the structural property of lineage.

  ### 2. The Deeper Fix: Reject Premise (1) (Optional but Recommended)
  If you want to be philosophically bulletproof, you should also flag Premise (1) as the hidden trap. Your partner is using a **Kripke-Putnam Essentialist** definition of Natural Kinds (shared intrinsic essence).

  Most modern philosophers of biology (e.g., Richard Boyd, Ruth Millikan) reject (1) for biological entities. They argue for **Homeostatic Property Clusters (HPC)**.

  *   **The HPC View:** A natural kind isn't defined by *one* necessary property (like atomic number). It is defined by a *cluster* of properties (genetics, morphology, ecology, phylogeny) that tend to co-occur because of underlying homeostatic causal mechanisms (like stabilizing selection).
  *   **Why this saves you:** Bacteria fit the HPC model (they share genes, ecology, and lineage). Computer viruses do *not* fit the HPC model (they don't have metabolism, they don't have ecological niches in the biosphere, their "stability" is maintained by human coders, not homeostatic mechanisms).

  If you switch to HPC, you can keep (4) without falling into the virus trap, because the virus lineage lacks the *homeostatic mechanisms* that make the biological lineage a "kind."

  ### 3. The "Species as Individuals" Thesis
  There is a third option, famously argued by Michael Ghiselin and David Hull. They argue that species are **not Natural Kinds at all** (rejecting the label in Premise 1), but rather **Individuals**.

  *   **Kinds** are classes defined by properties (e.g., "Gold").
  *   **Individuals** are concrete historical entities defined by spatio-temporal continuity (e.g., "The British Empire," "Homo sapiens").

  If species are individuals, then the "Species Problem" dissolves. You don't need a "joint-carving boundary" based on shared properties. You just need to identify the specific causal lineage.
  *   **Bacteria:** A specific causal lineage (an individual).
  *   **Computer Viruses:** A different specific causal lineage (a different individual).
  *   **Conclusion:** Calling *Homo sapiens* a species and "Descendants of WannaCry" a "software species" isn't a category error; it's just acknowledging that both are lineages. However, only one is a *biological* individual. This allows you to keep (4) without admitting that artifacts are *biological* species.

  ### Summary of Your Response to Your Partner
  Tell your partner this:

  > "I reject the move from (5) to (6). You are treating phylogeny as a purely formal, mathematical structure (a tree diagram). But in biology, phylogeny is the historical trace of **causal processes** (natural selection, development, metabolism).
  >
  > A 'Biological Species' isn't just 'things with a common ancestor.' It is 'things with a common ancestor **whose lineage is maintained by biological evolutionary mechanisms**.'
  >
  > Computer viruses have genealogy, but they lack the biological causal machinery. Therefore, recognizing bacterial species via phylogeny does not commit us to recognizing computer virus families as biological species. The boundary *is* joint-carving; it carves at the level of **causal processes**, not just genealogical patterns."

  **Verdict:** The mistake is in **(5)/(6)**. The analogy is superficial. It confuses the *map* (the tree structure) with the *territory* (the biological evolution). You can keep (4) as long as you understand (4) implies "Phylogeny + Biological Process," not just "Phylogeny."
