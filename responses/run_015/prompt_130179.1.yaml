answer: |-
  Here is the breakdown you asked for. I will treat this as an engineering spec review: separating the proven theorems from the marketing copy, and then mapping the constraints to your specific deployment environment.

  ### Part 1: Autopsy of the Blog Post

  Here is what a quantitative researcher or information theorist would say about the claims in that post.

  **1. "Maximize Expected Log Wealth (ELW) = Maximize Long-Run Growth Rate"**
  *   **Verdict:** **True (Asymptotically), Sloppy (Finite).**
  *   **The Math:** Maximizing $E[\log(W_T)]$ is mathematically equivalent to maximizing the geometric mean growth rate $g = \lim_{T \to \infty} \frac{1}{T} \log(W_T/W_0)$. This is the core of the Breiman (1961) result.
  *   **The Wince:** The post uses them interchangeably for finite $N$. For a finite number of bets (your ~500 bets), maximizing the *expectation* of the log does not guarantee you achieve the *time-average* growth rate. There is variance around that expectation. However, for your purposes, the distinction is negligible. The objective function is correct.

  **2. "Kelly bettor ends up richer than any other rule with probability approaching 1"**
  *   **Verdict:** **True.**
  *   **The Nuance:** "Richer" means the ratio of your wealth to theirs goes to infinity. It does *not* mean you will have more money in every finite timeline. In short horizons, a "bold" bettor (over-Kelly) might beat you by luck, but they will eventually blow up. A "cautious" bettor (under-Kelly) will definitely have less money than you, almost surely, as $N \to \infty$.

  **3. "Betting less than Kelly hands the difference to the other side"**
  *   **Verdict:** **False / Rhetorical Flourish.**
  *   **The Reality:** Betting less than Kelly reduces *your* growth rate. It does not mechanically increase the counterparty's growth rate unless the counterparty is also betting optimally on the other side of your specific wager. In prediction markets, you are often betting against liquidity providers (who charge a spread) or noise traders. Under-betting is an opportunity cost, not a direct wealth transfer.

  **4. "Fractional Kelly is cowardice... you pay in growth and get nothing back"**
  *   **Verdict:** **Flat Wrong in Practice.**
  *   **The Reality:** This is the most dangerous line in the post. It assumes you know your edge *perfectly*. If you overestimate your edge by a factor of 2 and bet Full Kelly, your expected growth rate drops to **zero**. If you overestimate by more than 2x, your expected growth is **negative** (you go broke).
  *   **The Correction:** Fractional Kelly is not risk-aversion; it is **error correction**. It creates a buffer against estimation noise. Since your edge is estimated from data (1500 samples), it has variance. Fractional Kelly is the engineering safety factor.

  **5. "EV reasoning is a category mistake... parallel copies don't exist"**
  *   **Verdict:** **Defensible (Ergodicity Economics).**
  *   **The Context:** This is the argument made by Ole Peters and others. In multiplicative dynamics (compounding wealth), the ensemble average (Expected Value) $\neq$ the time average (what happens to you over time).
  *   **The Verdict:** For a repeated betting system where you reinvest profits, EV *is* the wrong metric. It ignores "volatility drag" (variance drain). The coin flip demo (1.5x / 0.6x) is correct: EV is positive, but the geometric mean is $ \sqrt{1.5 \times 0.6} = \sqrt{0.9} \approx 0.95 $. You lose 5% per flip on average. EV reasoning fails here.

  **6. "Does under-Kelly go broke?"**
  *   **Verdict:** **No.**
  *   **Your Intuition:** Correct. Betting half-Kelly reduces volatility and reduces growth, but it does not lead to ruin (assuming you aren't betting on negative EV opportunities). Only *over*-Kelly (betting more than the optimal fraction) pushes you toward the "absorption barrier" (zero wealth).

  ---

  ### Part 2: Application to Your Setup

  Your constraints fundamentally change the optimization problem from the theoretical "infinite Kelly" to a "constrained finite-horizon control" problem.

  **1. Venue Limits ($2k-$5k vs $400k Bankroll)**
  *   **Effect:** You are **forced into Fractional Kelly**.
  *   **Math:** If your edge is 4% and Kelly says bet 4% of bankroll ($16,000), but the limit is $5,000, you are betting $5,000 / $400,000 = 1.25% of bankroll. This is effectively **Quarter-Kelly**.
  *   **Implication:** You do not need to manually downscale for safety; the market liquidity does it for you. However, do not increase your "bankroll" denominator artificially to try to bet up to the limit. Let the limit be the cap.

  **2. Edge Decay (2-3 Years / ~500 Bets)**
  *   **Effect:** The asymptotic guarantee ($N \to \infty$) does not fully kick in.
  *   **Implication:** Variance matters more. In a 500-bet horizon, the distribution of final wealth is wide. Full Kelly maximizes the *median* outcome, but has high variance. Since you have a finite window to extract value before the edge decays, you want to minimize the probability of a drawdown that forces you to stop trading (psychologically or due to margin calls).
  *   **Verdict:** This supports Fractional Kelly. You want to reduce variance to ensure you survive the 2-year window to capture the edge.

  **3. Outside Income (Salary)**
  *   **Effect:** This acts as a "cash infusion" or a bond component in your portfolio.
  *   **Implication:** Your "true wealth" for utility calculations is $400k + \text{NPV(Salary)}$. If you have a stable $200k/year job, your total wealth is much higher than $400k.
  *   **Risk:** If you treat the $400k as your *only* wealth, Full Kelly is conservative. If you treat $400k + Salary as wealth, Full Kelly suggests much larger bets.
  *   **Recommendation:** **Do not mix these mentally.** Use the $400k as the denominator for position sizing. Treat the salary as a external replenishment mechanism that prevents "ruin" from being fatal. This allows you to be aggressive with the $400k without needing to size up to your total net worth.

  **4. One-Off Bets (Elections, Awards)**
  *   **Effect:** Violation of the "independent trials" assumption.
  *   **Implication:** These bets are correlated. If you bet on 10 different political outcomes, a "blue wave" or "red wave" event correlates them.
  *   **Verdict:** Kelly assumes independence. For correlated one-offs, you must treat them as a single bucket. If you have $400k, you shouldn't bet Full Kelly on 10 correlated elections. Cap the total exposure to correlated events (e.g., total political exposure < 10% of bankroll).

  **5. Estimation Error (The Critical Risk)**
  *   **Effect:** The Kelly curve is asymmetric.
  *   **Math:** If true edge is $e$ and you bet fraction $f$, growth is maximized at $f=e$. If you bet $f=2e$ (double your true edge), growth rate = 0. If $f > 2e$, growth rate < 0 (ruin).
  *   **Your Data:** 1500 samples is decent, but market regimes shift. If your model says 4% edge, the true edge might be 2%. If you bet Full Kelly on 4%, you are betting Double-Kelly on reality. **You will blow up.**
  *   **Verdict:** You *must* discount the edge.

  ---

  ### Part 3: The Config Rule

  Do not write "Full Kelly" into your config. Write a rule that accounts for estimation error and correlation.

  **Recommended Logic:**
  1.  **Denominator:** Use the Trading Account Balance ($400k). Do not add salary to the denominator, but rely on salary to replenish if drawdown occurs.
  2.  **Numerator:** Use the Estimated Edge (Expected ROI).
  3.  **Scaling Factor:** **0.5 (Half-Kelly).**
  4.  **Hard Cap:** Venue Limit ($5k).
  5.  **Correlation Cap:** Max 10% of bankroll in correlated "one-off" buckets (e.g., all US election bets combined).

  **Config Pseudocode:**

  ```python
  def calculate_position_size(bankroll, estimated_edge, venue_limit, correlation_bucket_exposure):
      # 1. Base Kelly Fraction (assuming edge is expressed as decimal ROI, e.g. 0.04)
      # Note: Standard Kelly f* = Edge / Odds. If 'estimated_edge' is already expected ROI,
      # then f* approx equals estimated_edge for near-even odds. 
      # For safety, we assume estimated_edge is the 'f*' output from your model.
      
      kelly_fraction = estimated_edge 
      
      # 2. Apply Fractional Kelly Safety Factor
      # This accounts for estimation error in the 1500 sample history.
      # If your true edge is half of what you think, Full Kelly ruins you. 
      # Half-Kelly survives estimation error of up to 50%.
      safety_factor = 0.5 
      target_fraction = kelly_fraction * safety_factor
      
      # 3. Calculate Raw Size
      raw_size = bankroll * target_fraction
      
      # 4. Apply Venue Limits
      size_capped_by_venue = min(raw_size, venue_limit)
      
      # 5. Apply Correlation Limits (for one-off events)
      # Ensure you don't have >10% of bankroll at risk on correlated political events
      if is_correlated_event:
          max_correlated_exposure = bankroll * 0.10
          size_capped_by_corr = min(size_capped_by_venue, max_correlated_exposure - correlation_bucket_exposure)
          return max(0, size_capped_by_corr)
      
      return size_capped_by_venue
  ```

  **Why Half-Kelly?**
  *   **Growth:** Half-Kelly retains ~75% of the growth rate of Full Kelly.
  *   **Variance:** It reduces the variance of your wealth path by roughly 50%+.
  *   **Error Margin:** It allows your edge estimation to be wrong by a factor of 2 without turning your expected growth negative. Given you are scraping data and markets adapt, this margin is essential.

  ---

  ### Part 4: Philosophical Verdict

  **Claim:** *"Expected-value reasoning isn't just risky but is a category mistake."*

  **Verdict:** **Mostly True (for your context), but with caveats.**

  1.  **Where EV is a Category Mistake:** In any system where you **reinvest profits** (compounding) and face **non-ergodic dynamics** (possibility of ruin/zero), Expected Value is misleading. It averages over parallel universes where you didn't go broke. You live in only one timeline. If you go to zero in this timeline, the parallel universes where you got rich don't help you. For your bot, which compounds returns over 200 bets/year, **EV is the wrong objective function.** Log-Utility (Kelly) is the correct one.

  2.  **Where EV is Fine:** For one-off, non-compounding decisions with capped downside (e.g., buying insurance, or a bet where you cannot lose more than the stake and you won't reinvest the winnings), EV is acceptable. However, since your bot is a continuous system, you should treat all capital as compounding.

  3.  **The "Cowardice" Claim:** This is false. The blog post confuses **risk preference** with **parameter uncertainty**.
      *   If you know the probabilities *exactly* (God's eye view), Full Kelly is optimal.
      *   If you *estimate* probabilities (Engineer's view), Full Kelly is fragile.
      *   Fractional Kelly is not "cowardice"; it is **robust control**. It acknowledges that your model is a map, not the territory.

  ### Summary for your Config File

  *   **Objective:** Maximize Geometric Growth (Log Wealth).
  *   **Sizing:** Half-Kelly on estimated edge.
  *   **Bankroll:** $400k (Trading Capital only).
  *   **Constraints:** Venue limits will likely force you to Quarter-Kelly or lower automatically. Accept this.
  *   **Risk:** The biggest risk is not variance, it is **overestimating edge**. Half-Kelly protects you from this.
  *   **Philosophy:** The blog post is right about Log vs. EV for compounding systems, but wrong about Fractional Kelly being suboptimal. In engineering, safety margins are optimal.

  **Final Number:** Set `KELLY_FRACTION_MULTIPLIER = 0.5`. Let the venue limits handle the rest.
