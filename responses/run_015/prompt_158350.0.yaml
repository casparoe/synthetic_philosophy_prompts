answer: |-
  This is a remarkably sharp exchange, especially for participants who do not claim philosophy as their discipline. Both Miriam and Douglas grasp the structural tensions in Lewis's account, though they pull in different directions. Miriam defends the internal coherence of Lewis's definitions, while Douglas attacks their external adequacy to the world.

  Here is the adjudication of the eight moves, followed by the four specific analyses you requested.

  ### Part 1: Move-by-Move Adjudication

  **(1) Miriam: Two conventions, relative to population.**
  *   **Verdict:** **Partly Right.**
  *   **Why:** Miriam is textually correct that Lewis defines a convention relative to a population $P$. If $P$ is "staff," keeping left is a convention; if $P$ is "visitors," keeping right is one. However, she overlooks the functional purpose of a convention in Lewis's account: to solve a *coordination problem*. If the two groups interact on the same road, they face a single coordination problem together. By splitting the population, she dissolves the coordination failure (the near misses) rather than explaining it. Lewis's theory is designed to explain how coordination is *achieved*, not how it is compartmentalised amidst failure.

  **(2) Douglas: The boundary problem and gerrymandering.**
  *   **Verdict:** **Right.**
  *   **Why:** Douglas identifies a genuine vulnerability in applying Lewis's criteria. If the relevant coordination problem is "avoiding collisions on the marsh road," the relevant population is "everyone on the marsh road." On that description, the first clause ("nearly everyone conforms") fails. Douglas is correct that if "convention-hood" vanishes simply by expanding the population boundary, the concept risks becoming trivial or descriptive rather than explanatory. The drivers care about coordinating with *any* oncoming car, not just those in their antecedent group.

  **(3) Miriam: Boundaries drawn by expectations; near misses evidence precedent.**
  *   **Verdict:** **Partly Right.**
  *   **Why:** She is right that for Lewis, the population is defined by the reach of expectations (if I don't expect the Dutch postdoc to keep left, he is not in my convention-bearing population regarding "keeping left"). However, she is mistaken to treat the near misses as evidence *for* the account. In Lewis's framework, a convention is a successful equilibrium. The near misses indicate that the equilibrium is *not* obtaining between the two groups. She is describing two *failed* attempts at a global convention, or two successful local conventions that clash. Calling the clash "evidence for the account" stretches the theory's claim to explain coordination.

  **(4) Douglas: Common Knowledge (CK) and Intellectualism.**
  *   **Verdict:** **Partly Right.**
  *   **Why:** His objection on CK is strong regarding the *facts* of the case (nobody has discussed this), but weaker regarding Lewis's *text*. Lewis does not require a meeting or articulate belief; CK can be dispositional or based on manifest public facts. However, Douglas's second point—that Lewis models agents as reasoners whereas real norms are often blind habits—is a standard and potent philosophical critique. Lewis's account is indeed intellectualised; it requires agents to have expectations about expectations. If the drivers are merely reacting reflexively to ruts in the gravel, Lewis's conditions are not met.

  **(5) Miriam: Expectations need not be articulate; CK is public.**
  *   **Verdict:** **Right.**
  *   **Why:** This is a faithful defence of Lewis's text. Lewis explicitly distinguishes between *knowing* and *knowing that one knows* in a way that does not require verbalisation. If the swerving is visible, and the survival preference is obvious, the conditions for CK can be met functionally without deliberation. She correctly identifies that Lewis's story about origin relies on salience and precedent, not negotiation.

  **(6) Douglas: Circularity of precedent and Non-Arbitrariness.**
  *   **Verdict:** **Partly Right.**
  *   **Why:** The charge of circularity (precedent explains salience, salience explains precedent) is a known issue in Lewis, though Lewis relies on Schelling to break the circle with "focal points." Douglas's stronger point is on **Arbitrariness**. Lewis requires that an alternative regularity *would have served their common interest just as well*. If the passing bays are physically cut for left-hand entry, then keeping right does *not* serve the interest "just as well" (it is harder/dangerous). If the visitors keep right only because of mainland habit, that is an *imported* reason, not an arbitrary selection. This suggests the regularities are not Lewisian conventions but rather habits or technical constraints.

  **(7) Miriam: Cause vs. Justification; Counterfactual Arbitrariness.**
  *   **Verdict:** **Right.**
  *   **Why:** Miriam correctly interprets the logical structure of Lewis's arbitrariness condition. It is counterfactual: "Would it have worked *if* we had done it?" not "Why did we start doing this?" Even if the bays make left easier, if right-hand driving *could* have worked (perhaps with slower speeds), the condition might hold. She is also right that an inherited habit is still a convention if it sustains itself via expectations. A convention does not lose its status because it has a historical cause.

  **(8) Douglas: Bank Runs and Ants.**
  *   **Verdict:** **Partly Right.**
  *   **Why:** The Bank Run analogy is a challenge to the "common preference" clause. In a panic, everyone conforms (runs) given others conform, but everyone prefers the alternative (no run). Lewis's text in your summary says the alternative must serve the common interest "just as well." In a bank run, the alternative serves it *better*. So, strictly speaking, a bank run fails Lewis's test *as you have summarized it*, though Douglas is right that without a "Pareto optimal" clause, Lewis's definition is too broad. Regarding ants: Douglas is right that Lewis cannot cover them, but wrong to treat this as a refutation. Lewis is analysing *convention*, which entails knowledge/belief. Ant trails are causal/evolutionary regularities.

  ---

  ### Part 2: Where They Talk Past Each Other

  There are three distinct points of equivocation where Miriam and Douglas are correct about different things but fail to engage the other's point.

  1.  **The Definition of "Population":**
      *   **Miriam** treats population as a *sociological* category (Staff vs. Visitors). On this view, she is right: within the staff room, there is a convention.
      *   **Douglas** treats population as a *functional* category (Anyone on the road). On this view, he is right: there is no coordination between the groups.
      *   **The Clash:** They are arguing about whether a convention is defined by *who the agents identify with* (Miriam) or *who the agents interact with* (Douglas). Lewis implies the latter (coordination problem), but Miriam uses the former to save the classification.

  2.  **The Meaning of "Arbitrary":**
      *   **Douglas** interprets arbitrariness historically/causally: "Is there a *reason* they do this?" (Yes: mainland habits, bay engineering).
      *   **Miriam** interprets arbitrariness counterfactually: "Could they have done the *other* thing?" (Yes: right-hand driving is possible).
      *   **The Clash:** Douglas thinks a practice with a causal explanation isn't a convention. Miriam (following Lewis) thinks a practice is a convention as long as a *different* equilibrium was *possible*, even if the actual one has a cause.

  3.  **The Nature of "Knowledge":**
      *   **Douglas** assumes Common Knowledge requires conscious awareness or deliberation ("Nobody has ever considered the matter").
      *   **Miriam** assumes Common Knowledge requires only manifest public behaviour ("The swerving is public").
      *   **The Clash:** Douglas is attacking a straw man of Lewis (the "intellectualist" reading), while Miriam defends the functionalist reading Lewis actually holds. However, Douglas's deeper point remains: does a reflex count as an expectation?

  ---

  ### Part 3: Is the Marsh Road Practice a Convention?

  **The Verdict:** On Lewis's account, **there are two local conventions, but no global convention.**

  Whether this is a defect depends on how you view the "Population" parameter.
  *   **It is a Feature if:** You view conventions as tools for group cohesion. The staff have a convention that binds the staff; the visitors have one that binds the visitors. The fact that they clash is a failure of *integration*, not a failure of the theory. Lewis's theory predicts that if expectations do not overlap, conventions do not overlap.
  *   **It is a Defect if:** You view conventions as solutions to *coordination problems*. The road presents *one* physical coordination problem (avoiding collisions). If the theory says "there is a convention" when cars are still hitting each other, it is misidentifying the problem.

  **My Assessment:** Douglas is closer to the truth here. The dependence on population boundary is a vulnerability. In the real world, populations are not hermetically sealed. If the definition of $P$ can be toggled to make the convention appear or disappear without any change in the drivers' behaviour, the concept lacks stability. Lewis should welcome the idea that conventions are relative, but he must acknowledge that when two populations interact without a shared convention, the result is not "two conventions" but a **coordination failure**. Miriam's description masks the dysfunction; Douglas's highlights it.

  ---

  ### Part 4: Textual Disputes vs. Factual Disputes

  It is crucial for your reading group to distinguish where they are arguing about Lewis's words and where they are arguing about the salt marsh.

  **Textual Disputes (About Lewis):**
  *   **Move 4 & 5 (Common Knowledge):** Does Lewis require conscious belief (Douglas) or is public manifestness enough (Miriam)? *Resolution:* Miriam is textually correct. Lewis allows for dispositional belief.
  *   **Move 6 & 7 (Arbitrariness):** Does "arbitrary" mean "uncaused" (Douglas) or "counterfactually replaceable" (Miriam)? *Resolution:* Miriam is textually correct. Lewis explicitly allows for historical causes (precedent) provided the alternative *could* have worked.
  *   **Move 8 (Bank Runs):** Do Lewis's clauses rule out bad equilibria? *Resolution:* This turns on the phrase "served their common interest just as well." If the alternative is *better*, Douglas is right that the clauses need tightening.

  **Factual Disputes (About the Marsh):**
  *   **Move 6 (The Bays):** Do the passing bays actually make left-hand entry significantly easier/safer than right-hand entry? If yes, Douglas is right that the "arbitrariness" condition fails factually. If the bays work fine either way, Miriam is right.
  *   **Move 4 (Expectations):** Do the drivers actually have expectations about the *other* group, or do they just drive on their side and hope for the best? If they assume the other group will *not* conform to their side, they lack the "expectation of conformity" required for a single convention.

