  ### Part 5: What Both Are Missing (Origin and Animals)

  You noted at the outset that Lewis says more about maintenance than origin, and Douglas raised the case of the ants. Both parties miss the significance of these points in relation to Lewis's specific project.

  **1. The Origin/Maintenance Worry:**
  *   **The Issue:** You are correct that Lewis relies on **Schelling** for the origin (salience/focal points) and provides the game-theoretic structure for the maintenance (equilibrium).
  *   **What they miss:** Miriam treats precedent as a sufficient explanation for origin ("one instance becomes salient"). Douglas treats this as circular. Both miss that Lewis is not doing **evolutionary biology**. He is doing **rational reconstruction**. He is not asking "How did this historically emerge from chaos?" (which would require an evolutionary model); he is asking "What conditions must hold for this to be stable now?"
  *   **Is it fatal?** No. Lewis's project is to define what a convention *is*, not to write a history of how every convention began. However, your ecologist's instinct is sharp: without an evolutionary account, Lewis cannot explain how conventions spread or die out over time, only how they persist once established.

  **2. The Animal Case (Ants):**
  *   **The Issue:** Douglas uses ants to show that self-sustaining regularities exist without knowledge. Miriam dismisses this as "outside the scope."
  *   **What they miss:** Miriam is right that Lewis excludes ants by definition (no beliefs). But Douglas is pointing to a deeper gap: **Normativity.** If ants can have "proto-norms" (stable, arbitrary, self-reinforcing paths) without knowledge, then "knowledge" might not be the essential ingredient of social order.
  *   **Is it fatal?** It is fatal only if you think Lewis is trying to explain *all* social order. He is not. He is explaining *conventional meaning and action* in beings capable of reasoning. However, Douglas's point suggests that Lewis's account is a special case of a broader biological phenomenon. If you are interested in how norms *evolve* (as an ecologist would be), Lewis is insufficient. You would need an evolutionary game theory account (like Maynard Smith's Evolutionarily Stable Strategies) which drops the "Common Knowledge" requirement.

  **Summary for the Group:**
  Miriam wins on the **textual interpretation** of Lewis (she understands the clauses better). Douglas wins on the **adequacy of the theory** to the real world (he identifies where the definitions fray at the edges). The marsh road is not a single Lewisian convention because the population shares no common expectation; it is a collision of two sub-conventions. Lewis's account is robust for stable, closed groups, but struggles with the messy, overlapping boundaries of real-world populations. Your intuition about origin vs. maintenance is the most philosophically fruitful path forward: Lewis explains the *logic* of convention, but not its *natural history*.
