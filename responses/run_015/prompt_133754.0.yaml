answer: |-
  This is an excellent philosophical question. In the context of Ayn Rand's Objectivism, the slogan "altruism is immoral" is not a rhetorical flourish but a technical claim. However, when deployed in a general ethics seminar, it often suffers from equivocation—sliding between Rand's specific stipulative definition and the common-sense understanding of helping others.

  To help you engage your classmate, here is a menu of five distinct theses that the slogan might be expressing. I have evaluated each according to your criteria (triviality, defensibility, truth-value, and whether it supports the classmate's specific dismissal of charitable obligation/emergency aid).

  ### Menu of Theses: "Altruism is Immoral"

  #### 1. The Stipulative/Definitional Thesis
  *   **The Claim:** "Altruism" is defined strictly as the ethical demand to place the interests of others above one's own *to the point of self-sacrifice*. Therefore, to say "altruism is immoral" is to say "self-sacrifice is immoral."
  *   **Status:** **Trivial (within Objectivism); Contested (generally).** In standard moral philosophy (e.g., Comte, effective altruism), altruism refers to concern for others, not necessarily self-destruction. In Objectivism, it is defined as self-sacrifice by fiat.
  *   **Defensible?** Yes, as an internal consistency check within Rand's system. No, as a definition for general philosophical discourse.
  *   **Supports Classmate's Move?** **Only conditionally.** It supports dismissing *obligatory sacrifice*, but it fails to dismiss charitable acts that do not involve sacrifice. If you can help without sacrificing a higher value, this definition does not condemn the act.
  *   **Code vs. Benevolence:** Applies to **Altruism as an Ethical Code**. It does not necessarily condemn spontaneous benevolence if that benevolence is not sacrificial.

  #### 2. The Self-Sacrifice Necessity Thesis (Your point *i*)
  *   **The Claim:** Any act of aiding another person *necessarily* entails a net loss to the agent. There is no such thing as a "win-win" in aid; helping another always subtracts from one's own life or happiness.
  *   **Status:** **False.** Empirically and psychologically dubious. Humans often derive satisfaction, meaning, or reciprocal benefit from aiding others (even strangers).
  *   **Defensible?** No. It ignores the possibility of non-zero-sum interactions or the intrinsic value an agent might place on another's life.
  *   **Supports Classmate's Move?** **Weakly.** If this were true, it would condemn all aid. However, because it is empirically false, it is an easy target. If you can demonstrate a case where aid costs the agent nothing (or benefits them), this thesis collapses.
  *   **Code vs. Benevolence:** Condemns **Ordinary Benevolence**. If true, even buying a stranger a coffee is immoral because it is a net loss.

  #### 3. The Unearned Claim Thesis (Your point *ii*)
  *   **The Claim:** Altruism treats another person's need or suffering as an automatic, unearned claim on your life, labor, or property. It posits that *need* creates *entitlement*.
  *   **Status:** **Substantive Normative Claim.** This is the core political/ethical objection. It argues that morality is based on rights and production, not on need.
  *   **Defensible?** **Yes.** This is a robust libertarian/Objectivist argument. It distinguishes between *charity* (voluntary) and *obligation* (coerced by need).
  *   **Supports Classmate's Move?** **Strongly regarding Obligation; Weakly regarding Aid.** It successfully dismisses the idea that you *owe* aid to strangers simply because they suffer. However, it does not prove that *voluntarily* providing aid is immoral, provided you do not acknowledge their *right* to demand it.
  *   **Code vs. Benevolence:** Primarily targets **Altruism as an Ethical Code** (duty-based). It allows for benevolence if framed as a gift rather than a debt.

  #### 4. The Trader Principle Thesis (Your point *iii*)
  *   **The Claim:** Moral interaction between humans must be structured as a trade of value for value. Altruism violates this by advocating one-way transfers (gifts/aid) without expectation of return.
  *   **Status:** **Radically Substantive Normative Claim.** This rejects the moral value of the "gift" or "grace."
  *   **Defensible?** **Contested.** It is defensible within a framework that views human dignity as rooted in independence and production. It is contested by frameworks that view vulnerability and interdependence as fundamental to the human condition.
  *   **Supports Classmate's Move?** **Strongly.** If morality *requires* exchange, then emergency aid (where the recipient often cannot pay back) is immoral. This is the strongest argument your classmate has for dismissing emergency aid specifically.
  *   **Code vs. Benevolence:** Condemns **Ordinary Benevolence**. Even voluntary charity is suspect if it is not a trade.

  #### 5. The Systemic Priority Thesis
  *   **The Claim:** Altruism is immoral not necessarily in every isolated act, but as a *primary standard of value*. If "serving others" is the *ultimate* good, the self becomes a mere means to an end, leading to societal stagnation or individual destruction.
  *   **Status:** **Consequentialist/Systemic Claim.**
  *   **Defensible?** **Yes.** One can argue that a society built on mandatory self-sacrifice collapses.
  *   **Supports Classmate's Move?** **No.** This is a macro-claim about ethical systems, not a micro-claim about specific acts. It does not justify dismissing a specific request for aid in the moment; it only argues against making aid the *purpose* of life.
  *   **Code vs. Benevolence:** Targets **Altruism as an Ethical Code**.

  ---

  ### Specific Analysis of Your Three Points

  Here is how the three specific mechanisms you asked about function within these theses:

  **(i) The Claim that Altruism Necessarily Entails Self-Sacrifice**
  *   **Function:** This is the bridge between the definition and the condemnation. If altruism *meant* "concern for others," Objectivism might tolerate it. By defining it as "sacrifice," it becomes automatically condemnable within a rational egoist system.
  *   **Vulnerability:** This relies on a zero-sum view of human interaction. If you can show that helping a drowning child (to use a classic example) affirms your own values (e.g., you value human life, you can swim safely) without sacrificing a *higher* value, the Objectivist framework actually permits the rescue. Your classmate may be misapplying Objectivism here.

  **(ii) The Claim that Need Creates an Unearned Claim**
  *   **Function:** This attacks the *obligation* aspect of charity. It shifts the burden of proof from "Why won't you help?" to "Why do they have a right to your help?"
  *   **Vulnerability:** This is the strongest philosophical point your classmate has. It forces the debate onto rights and entitlements rather than feelings or consequences. However, it does not condemn *voluntary* aid, only *mandatory* aid.

  **(iii) The Hidden Reliance on the "Trader Principle"**
  *   **Function:** This attacks the *structure* of the interaction. It asserts that dignity lies in independence. To accept aid (or give it without return) is to treat the human being as a beneficiary rather than a producer.
  *   **Vulnerability:** This struggles with cases of emergency or incapacity (children, the disabled, disaster victims) where trade is impossible. A strict adherence to the Trader Principle can lead to conclusions that violate most people's moral intuitions about basic humanity.

  ---

  ### Code vs. Ordinary Benevolence

  It is vital to distinguish which reading condemns which behavior.

  | Reading | Condemns Altruism as an **Ethical Code**? | Condemns Ordinary **Benevolence/Spontaneous Aid**? |
  | :--- | :--- | :--- |
  | **1. Stipulative (Sacrifice)** | **Yes.** (By definition) | **No.** (Unless the aid is sacrificial) |
  | **2. Necessity (Zero-Sum)** | **Yes.** | **Yes.** (All aid is loss) |
  | **3. Unearned Claim** | **Yes.** (Duty is illegitimate) | **No.** (Voluntary gifts are permissible) |
  | **4. Trader Principle** | **Yes.** | **Yes.** (Gifts violate trade) |
  | **5. Systemic Priority** | **Yes.** | **No.** (Isolated acts are fine) |

  **Crucial Observation for Your Discussion:**
  Your classmate is likely conflating **Reading 1** (Definition) with **Reading 4** (Trader Principle).
  *   If they are using **Reading 1**, they cannot dismiss your charitable impulse unless you admit you are *sacrificing* a higher value to do it.
  *   If they are using **Reading 4**, they are making a much heavier normative claim that requires defending why "trade" is the *only* moral interaction, even in emergencies.

  ### Does this support the classmate's move?

  **Verdict:** The slogan "Altruism is Immoral" **does not** automatically support the dismissal of all charitable obligations or emergency aid without further argument.

  *   **If they mean Reading 1 or 3:** They can dismiss *obligations* (you don't *owe* aid), but they cannot dismiss *voluntary aid* or *emergency rescue* (which Rand herself permitted if the victim is valued and the risk is minimal).
  *   **If they mean Reading 2 or 4:** They can dismiss all aid, but they are holding a radically substantive, highly controversial position that requires significant argumentation (defending the zero-sum view or the absolute Trader Principle).

  **Recommendation:** Ask your classmate: *"Are you claiming that helping someone is always a sacrifice (Reading 2), or are you claiming that I have no duty to help (Reading 3)? Because Objectivism allows for voluntary benevolence provided it isn't sacrificial. Are you arguing against the duty, or against the act itself?"* This forces them to specify which thesis they are relying on.
