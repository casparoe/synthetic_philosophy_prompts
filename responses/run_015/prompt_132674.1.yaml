answer: |-
  You have identified a genuine gap in the terminology. You are right: standard **Dirty Hands** theory (Walzer, Weber) concerns the *first* act (the necessary evil). **Moral Licensing** typically describes *virtuous* acts licensing subsequent vice ("I donated to charity, so I can be rude now"). **Hypocrisy** is claiming a virtue one does not possess.

  What you are describing is a specific rhetorical and ethical maneuver where a *necessary* past vice is used to neutralize the cost of a *gratuitous* present vice.

  While there isn't one single canonical Latin term for this, political philosophers and behavioral ethicists approach it from three different angles. Here is how to categorize it, what to call it, and how to distinguish it from hypocrisy.

  ### 1. The Political Theory Label: *Normalization of the Exception*
  The closest established concept comes from the work of **Carl Schmitt** and **Giorgio Agamben**. They discuss the **State of Exception**.
  *   **The Logic:** A leader suspends normal ethical/legal rules to handle a crisis (the toxic dump/surveillance bill).
  *   **The Drift:** Instead of returning to normalcy once the crisis passes, the "exception" becomes the new rule. The emergency powers or ethical suspensions are retained for mundane or self-serving purposes (the condos/data grab).
  *   **Why it fits:** It captures the structural shift. The "dirty hands" moment was supposed to be a temporary anomaly; the politician is now arguing that the anomaly is their permanent state of being.

  ### 2. The Ethical Theory Label: *Walzer's Warning*
  Michael Walzer, who wrote the definitive essay *"Political Action: The Problem of Dirty Hands"* (1973), explicitly warns against exactly what your mayor is doing.
  *   **Walzer's View:** A politician with dirty hands must acknowledge their guilt and suffer for it (e.g., resign, confess, accept moral stain). That suffering is what distinguishes them from a tyrant.
  *   **The Violation:** If the politician uses the dirty hands act as *credit* or *immunity* rather than a burden, Walzer would argue they have crossed from a "tragic hero" into a **criminal**. They are no longer doing evil for the sake of the public; they are exploiting the public's understanding of tragedy to mask corruption.
  *   **Term:** Some scholars call this **"The Corruption of the Dirty Hands Argument."**

  ### 3. The Psychological Label: *The Ethical Sunk Cost Fallacy*
  In behavioral ethics, this is a variation of the **Sunk Cost Fallacy**, applied to integrity.
  *   **The Logic:** "I have already paid the price of my integrity on the dump issue. That cost is 'sunk.' If I refuse the condo deal, I pay the price (lost revenue) without getting the benefit of the initial sacrifice. Since I am already 'morally bankrupt,' further debt costs me nothing."
  *   **Related Concept:** In psychology, this is sometimes called the **"What-the-Hell Effect"** (usually applied to dieting: "I ate one cookie, my diet is ruined, I might as well eat the whole box").
  *   **Term:** You could accurately call this **"Moral Sunk Cost Reasoning."**

  ---

  ### If you need a name for it...
  Since no single term dominates the literature, you are in a position to coin a descriptive one. The most precise labels would be:

  1.  **Dirty Hands Inflation:** This captures the economic logic. The politician is devaluing the "currency" of their moral stain. By spending their guilt on trivial matters, they render the original sacrifice meaningless.
  2.  **The Stain License:** Distinct from a *Moral License* (earned by good deeds), this is a license earned by bad deeds.
  3.  **Retroactive Necessity:** The politician tries to cast the second, unnecessary act as a continuation of the first, necessary act, implying a causal link where there is none.

  **My recommendation:** Call it **"The Ethical Sunk Cost Fallacy."** It immediately explains the reasoning error to an audience without needing a lecture on Walzer.

  ---

  ### How to distinguish this from Hypocrisy
  This is the crux of your second question. The distinction lies in the **claim to virtue.**

  *   **Hypocrisy:** The hypocrite claims to be *clean* while acting *dirty*.
      *   *Statement:* "I would never displace residents for profit; I am a champion of the poor." (While secretly doing it).
      *   *Vulnerability:* They can be exposed by evidence of the act.
  *   **This Phenomenon (Dirty Hands Inflation):** The actor admits to being *dirty* and claims that *cleanliness is no longer an option or a virtue*.
      *   *Statement:* "I am already compromised. Demanding I be clean now is naive/vain."
      *   *Vulnerability:* They cannot be exposed by evidence of the act (they admitted it). They can only be challenged on the **logic of necessity**.

  **The Line:**
  The line is drawn at **Necessity**.
  *   **Dirty Hands:** "I did wrong because I *had* to." (Accepts guilt).
  *   **Hypocrisy:** "I did not do wrong." (Denies act/guilt).
  *   **Your Scenario:** "I did wrong before, so I *don't have to* do right now." (Denies the obligation of future virtue).

  ### Summary for your argument
  If you are writing or debating this, you can frame it like this:

  > "This isn't standard Dirty Hands, because the second act lacks necessity. It isn't Moral Licensing, because the credit is built on vice, not virtue. It is best understood as an **Ethical Sunk Cost Fallacy**: the leader treats their past necessary compromise as a prepaid insurance policy for future gratuitous corruption. As Walzer warned, dirty hands must be a burden to bear, not a currency to spend."
