answer: |-
  This is a classic "hard case" in administrative ethics: the point where existing precedents stop dictating a clear outcome and force you to articulate the underlying theory of justice your committee is actually employing. You are correct that your track record underdetermines this case. You have established three competing principles that are currently in tension:

  1.  **The Intent Principle:** What was the monument *for* at the time? (Favors keeping the Governor, the Donor, and the Mayor).
  2.  **The Necessity Principle:** Is the honor the *only* reason we remember this person, or is their fame inextricably linked to the harm? (Favors removing the General and the Eugenicist).
  3.  **The Harm Principle:** Does the monument actively dignify harm that persists today? (Favors removing the General, the Eugenicist, and the Mayor).

  Here is an analysis of how to decide the Mayor case consistently, what principle each option adopts, and a hypothetical to test your committee's hidden logic.

  ### 1. Mapping the Precedents
  To find consistency, we first need to admit where the inconsistency lies. Your track record reveals a hidden distinction between **Private Prejudice** and **Public Policy**.

  *   **Case 2 (Governor) & Case 4 (Donor):** In both these "Keep" decisions, the racism was either historical context (slavery was legal) or private belief (letters). The *public act* being honored (founding a university, donating land) was distinct from the moral failing.
  *   **Case 1 (General) & Case 3 (Eugenicist):** In both these "Remove" decisions, the *public act* being honored was itself the mechanism of oppression (leading a rebellion against the Union, running a sterilization program).

  **The Mayor Case** sits precisely on this fault line. Like the Donor (Case 4), he built tangible public goods (parks/hospitals). But like the Eugenicist (Case 3), his "bad" acts were not private thoughts; they were **public policy** (housing covenants) enacted through his office.

  ### 2. Evaluating the Options
  Here is what principle you would be codifying with each possible vote:

  **Option A: Keep As Is**
  *   **Principle:** **Original Intent + Majoritarianism.** You are ruling that the 1920s dedication speech is the only thing that matters, and that a citywide referendum outweighs the dignitary harm to a specific neighborhood.
  *   **Consistency Check:** **Low.** This contradicts Case 1 (Confederate General), where original intent was explicitly white supremacist, but also contradicts Case 3 (Eugenicist), where the "name" was the honor. It ignores the "Public Policy" distinction.
  *   **Risk:** It signals that if you build enough parks, you can segregate the city without consequence.

  **Option B: Keep with a Plaque**
  *   **Principle:** **Contextual Complexity.** You are ruling that civic space should reflect the "whole person," good and bad. This aligns closely with Case 2 (Governor).
  *   **Consistency Check:** **Medium.** It fits Case 2 perfectly. However, it fails to distinguish between the Governor (whose harm was legal/historical) and the Mayor (whose harm was policy/structural). A plaque acknowledges the covenants but does not remove the *veneration* of the architect of those covenants from the landscape he segregated.
  *   **Risk:** It treats structural housing discrimination as a "footnote" rather than a disqualifying factor for civic veneration.

  **Option C: Remove Outright**
  *   **Principle:** **Consequentialist Harm.** You are ruling that ongoing structural harm (segregation) invalidates past good works, regardless of original intent.
  *   **Consistency Check:** **Medium-High.** This aligns with Case 1 and Case 3. However, it risks contradicting Case 2 and 4 by suggesting that *any* significant moral failing outweighs public service.
  *   **Risk:** It may be seen as "erasing history" regarding the parks and hospitals he actually built.

  **Option D: Relocate to Museum**
  *   **Principle:** **Historical Significance vs. Civic Honor.** You are ruling that the subject is historically important enough to study, but no longer worthy of veneration in public space.
  *   **Consistency Check:** **High.** This bridges the gap. It acknowledges his role in building the city (unlike the General, he isn't being "condemned"), but acknowledges that his policy legacy makes him unfit for a pedestal in the neighborhood he segregated (unlike the Governor/Donor).
  *   **Benefit:** It respects the "Public Policy" distinction. Private racism (Donor) allows for public honor; Public Policy racism (Mayor) moves you to the museum.

  ### 3. Recommendation
  **I recommend Option D: Relocate to the Museum.**

  **Reasoning:**
  This is the only outcome that harmonizes your "Private vs. Public" distinction without erasing history.
  1.  **Distinguishes from the Donor (Case 4):** The Donor's racism was private; the Mayor's was codified law. Public office carries a higher burden of non-discrimination than private philanthropy.
  2.  **Distinguishes from the Governor (Case 2):** The Governor's slavery was a condition of his era; the Mayor's covenants were an *active choice* to engineer segregation in the 20th century, the effects of which are spatially present at the statue's location.
  3.  **Addresses the Harm:** It removes the statue from the edge of the segregated neighborhood (addressing the petition) without destroying the artifact (acknowledging the parks/hospitals).
  4.  **Handles the Referendum:** It acknowledges the 58% who want to "keep" it by preserving the statue, but prioritizes the committee's ethical mandate over a non-binding popularity contest (consistent with Case 1 & 3).

  **The New Rule:** *Public honors are revoked when the subject's harmful actions were enacted through public policy and continue to cause structural harm, even if they also performed public good.*

  ### 4. The "Stress Test" Hypothetical
  You mentioned wanting a hypothetical to smoke out your colleagues' hidden rules. Here is a case that cleanly separates **Intent**, **Necessity**, and **Harm**:

  **The Case of the "Jim Crow Philanthropist"**
  > *A local industrialist from the 1930s funded the construction of the city's first public library. However, he donated the money with a legal stipulation that the library must remain segregated. The library remained segregated until the 1960s. There is a plaque in the lobby honoring his donation. A group now wants the plaque removed. The library is currently integrated and beloved by the community.*

  **Why this breaks your current rules:**
  *   **Intent Principle:** The intent was to build a library (Good), but the intent was *also* to segregate it (Bad). Unlike the Mayor, the harm wasn't a separate policy; it was a *condition* of the good deed.
  *   **Necessity Principle:** Without his money, there might have been no library. Is the honor necessary for the building to exist? (Like the Donor).
  *   **Harm Principle:** The harm is historical (segregation ended), but the plaque remains. Is there ongoing dignitary harm?

  **How to use it:**
  If your colleagues vote to **Keep the Plaque**, they are secretly running a **Utilitarian Rule** (The good outcome [library] outweighs the bad moral cost).
  If they vote to **Remove the Plaque**, they are secretly running a **Complicity Rule** (You cannot accept honor for a gift that required injustice).

  This hypothetical forces them to decide if "Good Works" can ever be separated from the conditions attached to them. It is the logical next step after the Mayor case, and having it in your pocket will help you identify which colleague is arguing from "Results" vs. "Principles" during the Mayor debate.

  ### Summary for the Committee Meeting
  When you speak, frame it this way:
  *"We have kept names when the racism was private (Havlicek) and removed them when the racism was the primary legacy (Arndt). The Mayor is different because his racism was public policy. If we keep the statue, we are saying public policy segregation is equivalent to private prejudice. If we remove it entirely, we deny his role in building our infrastructure. Relocation allows us to say: **You built our parks, but you also built our walls. You belong in history, not on the pedestal.**"*
