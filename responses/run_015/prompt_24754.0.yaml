answer: |-
  # Q&A Prep Sheet: Etiological vs. Causal-Role Accounts of Function

  **To:** Speaker
  **From:** Prep Assistant
  **Re:** Workshop Strategy & Vulnerability Analysis

  **General Note on the "Settled vs. Contested" Constraint:**
  You have asked me to flag where your thesis treats disputed views as consensus. I must be blunt: **Your core thesis is not the consensus.** The claim that etiologicalists "quietly concede" dependence on causal roles is your *interpretation*, not a settled fact. Most committed etiologicalists (Millikan, Neander, etc.) argue vigorously that history is *constitutive* of function, not just a trigger for a pre-existing causal role. The biologists in the room generally do not care about the "function" debate at all, viewing it as semantic, but they *do* care about how you define fitness. I have marked the consensus status for every objection below.

  ---

  ## Top 8 Objections (Ordered by Potential Damage)

  ### 1. The Normativity/Malfunction Objection
  **(a) Audience Phrasing (Committed Etiologicalist):**
  "You've explained how a trait gets *selected*, but you haven't explained how it gets a *norm*. If function is grounded in causal role, then a heart that fails to pump still has the causal role of pumping (or trying to). But on your view, if the causal role is the foundation, how do you distinguish a malfunctioning heart from a heart that just has a different causal role? Etiology gives you error conditions; causal role doesn't. By making causal role fundamental, aren't you losing the normativity essential to 'function'?"

  **(b) Two-Minute Reply:**
  "I'm not arguing causal role *replaces* etiology for established traits. I'm arguing causal role is the *entry condition* for etiology. For a novel mutation, there is no history yet. The only thing selection can 'see' is the causal contribution to fitness. Once selection stabilizes that trait, the etiological history kicks in and provides the normative standard (malfunction = deviation from the selected effect). So, causal role is ontologically prior for *novelty*, but etiology is required for *normativity* in established lineages. I'm separating the *origin* of function from the *criteria* of function."

  **(c) Soft Spot / Vulnerability:**
  **[Consensus Check: HIGHLY CONTESTED]**
  Etiologicalists deny that "origin" and "criteria" can be split this cleanly. If the foundation lacks normativity, they will argue the resulting concept isn't "biological function" but merely "causal contribution." If you fumble the transition from "causal role" to "normative function," you look like you've just redefined function away.
  *Risk:* An etiologicalist will press: "At exactly what generation does the normativity appear? Generation 1 has the role, Generation 100 has the function. Where is the switch?" There is no clean answer.

  ### 2. The Level of Selection / Fitness Objection
  **(a) Audience Phrasing (Population Geneticist):**
  "I'm worried about your use of 'fitness.' You talk about a trait's causal role contributing to fitness. But in population genetics, fitness is a property of genotypes or organisms in a specific environment, not a property of a trait in an individual. Selection acts on the whole phenotype. By isolating a trait's 'role,' aren't you committing the fallacy of trait-group selectionism? There is no 'fitness of the heart' independent of the organism's reproductive success."

  **(b) Two-Minute Reply:**
  "I agree fitness is statistically measured at the organism or genotype level. However, for selection to differentiate genotypes, there must be a *mechanistic difference* in the phenotype. That mechanistic difference is the causal role. I'm not claiming traits have independent fitness values; I'm claiming that the *basis* upon which organismal fitness differs is the causal role of the constituent traits. Selection tracks organismal fitness, but it 'grabs' the trait via its causal contribution."

  **(c) Soft Spot / Vulnerability:**
  **[Consensus Check: SETTLED SCIENCE, CONTESTED PHILOSOPHY]**
  It is settled among biologists that "trait fitness" is a shorthand, not a fundamental unit (Price Equation). Your philosophical model risks implying a naive adaptationism where traits are selected in isolation.
  *Risk:* A biologist might hit you with the Price Equation or pleiotropy. If a trait has a beneficial causal role but is linked to a lethal gene, it won't be selected. Your model implies selection "sees" the causal role directly, but genetics often obscures that link.

  ### 3. The "Spandrel" Collapse Objection
  **(a) Audience Phrasing (General Phil of Biology):**
  "If a novel trait arises and makes a causal contribution to fitness, you say it's acquiring its first function. But what about spandrels? A trait might arise as a byproduct of development and *incidentally* contribute to fitness. It has a causal role. It might even get fixed. But intuitively, it's not a 'function' until it's specifically selected *for* that role. Doesn't your view collapse the distinction between selected effects and mere byproducts that happen to be useful?"

  **(b) Two-Minute Reply:**
  "That's exactly why I retain the etiological account for the *full* definition. The causal role is necessary but not sufficient. The role must be the *reason* for the replication. However, for that 'reason' relation to exist, the role must exist *prior* to the replication. My point is that the spandrel *becomes* a function only when the causal role is recruited by selection. But that recruitment process relies entirely on the pre-existence of the causal role. So the causal role is still the fundamental substrate, even if selection is the filter."

  **(c) Soft Spot / Vulnerability:**
  **[Consensus Check: CONTESTED]**
  This is the heart of the Gould/Lewontin critique. Etiologicalists claim history distinguishes function from spandrel. You are claiming causal role + history distinguishes them.
  *Risk:* If the causal role exists *before* selection, and selection just "ratifies" it, what work is history doing other than waiting? A sharp opponent will argue you've made history epiphenomenal to the causal role.

  ### 4. The "Why Not Just Cummins?" Objection
  **(a) Audience Phrasing (General Phil of Biology):**
  "You're arguing causal role is more fundamental than etiology. But if causal role does all the heavy lifting for novel traits, and etiology only adds a historical stamp later, why not just adopt a sophisticated Causal-Role account (like Cummins) for everything? You seem to be keeping the etiological baggage without needing its explanatory power. What work is the 'etiological' part of your view actually doing?"

  **(b) Two-Minute Reply:**
  "Because Cummins-style accounts fail to capture the 'proper function' intuition—the idea that a trait can fail to do what it's supposed to do. A purely causal account can't explain malfunction. My hybrid view tries to get the best of both: the causal account explains the *emergence* of function (solving the novelty problem), and the etiological account explains the *normativity* of function (solving the malfunction problem). I need both to cover the whole lifecycle of a trait."

  **(c) Soft Spot / Vulnerability:**
  **[Consensus Check: CONTESTED]**
  This is the "Parasitism" charge. If you rely on etiology for normativity, you admit etiology is indispensable.
  *Risk:* If etiology is indispensable for the *definition* of function, can you really call causal role "more fundamental"? You risk sounding like you want to have your cake and eat it too.

  ### 5. The Exaptation History-Wipe Objection
  **(a) Audience Phrasing (Committed Etiologicalist):**
  "You mention exaptation. But standard etiological theory says when a trait is exapted, it acquires a *new* proper function based on the *new* selection history. The old causal role is irrelevant to the new function. So why does the old causal role matter? The history wipes the slate clean. Your claim that the old role is 'foundational' ignores that the new function is defined solely by the new history."

  **(b) Two-Minute Reply:**
  "The history defines the *label* of the function, but it can't create the *capacity*. Selection cannot select for a role the trait does not already causally possess. Even in exaptation, the 'new' function is constrained by the causal capacities the trait already has. The history selects *which* causal role becomes the function, but it doesn't create the role itself. Therefore, the space of possible functions is determined by causal roles, making them ontologically prior."

  **(c) Soft Spot / Vulnerability:**
  **[Consensus Check: CONTESTED]**
  Etiologicalists argue that the *identity* of the function is wholly historical.
  *Risk:* They will argue you are confusing "causal capacity" with "function." A brick has the causal capacity to be a paperweight, but it isn't a paperweight until used as one. They will say you are conflating *capacity* with *function*.

  ### 6. The Threshold/Time-Lag Objection
  **(a) Audience Phrasing (General Phil of Biology):**
  "You say selection acts on a causal role. But selection is a statistical process over generations. A single novel mutation doesn't have a 'function' in generation one. It's just a variant. At what point in the frequency curve does the causal role become a function? Is it at 51% frequency? Fixation? Your view seems to require a sharp line where there is only a gradient."

  **(b) Two-Minute Reply:**
  "I grant it's a gradient. That's actually support for my view. If function were purely historical, it would be binary (either you have history or you don't). But because function emerges as the causal role proves stable over time, the 'fuzziness' of the transition reflects the causal role's stabilization in the environment. The vagueness is a feature of the causal-role foundation, not a bug of the etiological superstructure."

  **(c) Soft Spot / Vulnerability:**
  **[Consensus Check: CONTESTED]**
  There is no consensus on when a trait becomes "adapted."
  *Risk:* This invites a Sorites paradox. If you can't define when the function starts, your claim about the "first function" is empirically empty.

  ### 7. The Developmental Constraint Objection
  **(a) Audience Phrasing (Biologist / Evo-Devo sympathizer):**
  "You're assuming the environment selects on a trait's effect. But Evo-Devo shows us that developmental constraints limit what traits can arise in the first place. The 'causal role' isn't just sitting there waiting for selection; it's constructed by the developmental system. Doesn't this make the developmental architecture more fundamental than either the causal role or the selection history?"

  **(b) Two-Minute Reply:**
  "Developmental constraints determine the *menu* of available causal roles. I agree. But selection determines which item from the menu becomes a *function*. My thesis is about the relation between function and selection, not function and development. Even within the constrained menu, the choice is made based on the causal role's contribution to fitness."

  **(c) Soft Spot / Vulnerability:**
  **[Consensus Check: SETTLED SCIENCE, CONTESTED PHILOSOPHY]**
  Biologists agree constraints matter. Philosophers debate if this undermines adaptationism.
  *Risk:* If constraints determine the role, and selection just picks it, is selection really doing the work? You might be downplaying the biological reality of constraint to save the philosophical distinction.

  ### 8. The "Selection-For" vs. "Selection-Of" Objection
  **(a) Audience Phrasing (Biologist / Phil):**
  "You use the phrase 'selection-for.' But many of us prefer 'selection-of.' Organisms are selected; traits are correlated. By saying selection acts *for* a causal role, you're implying a directness that population genetics doesn't support. Traits are hitchhikers. How do you know selection is acting *for* the role you identify and not a correlated trait?"

  **(b) Two-Minute Reply:**
  "That's the problem of confounding variables, and it's real. But to solve it, we have to do exactly what I'm describing: isolate the causal role. We use experimental manipulation to see *which* causal difference makes the fitness difference. So, resolving the 'for/of' distinction actually *requires* analyzing causal roles. You can't solve the problem without the tool I'm prioritizing."

  **(c) Soft Spot / Vulnerability:**
  **[Consensus Check: CONTESTED]**
  The "For/Of" distinction (Sober) is famous but technically difficult to apply in complex genetics.
  *Risk:* A geneticist might say, "In linkage disequilibrium, you literally *can't* isolate the causal role." Your philosophical tool breaks in hard genetic cases.

  ---

  ## The Dreaded Objection
  **"The Dissolution Objection"**

  **(a) Phrasing:**
  "If the causal role is the foundation, and the etiological history is just a stabilizer... haven't you just described a Causal-Role account with an extra step? If I'm a Cummins-style causal-role theorist, I can say 'functions are stable causal contributions.' I don't need your 'etiological' label at all. You haven't shown etiology depends on causal role; you've shown etiology is *redundant*. Why should we keep the etiological vocabulary if the causal role is doing all the ontological work?"

  **(b) Strategy:**
  **Do not defend the necessity of Etiology too hard.** If you defend Etiology too hard, you undermine your claim that Causal Role is fundamental. If you defend Causal Role too hard, you become a Causal Role theorist and alienate the Etiologicalists in the room.

  **(c) What to do:**
  Pivot to **Utility**.
  *Say:* "I'm not arguing we should *delete* etiological vocabulary. I'm arguing we should understand its *grounding*. We keep the etiological vocabulary because it tracks the *stability* and *normativity* that pure causal role accounts miss. But we must recognize that without the causal role, the etiology has no purchase. It's not that etiology is redundant; it's that it's *secondary*. Think of it like money: the value is conventional (etiology), but it must be backed by gold (causal role). You need the convention to spend it, but you need the gold to ground it."

  **(d) Why this is dangerous:**
  **[Consensus Check: HIGHLY CONTESTED]**
  This objection suggests your "hybrid" view is unstable.
  *Risk:* If you say "gold backs the money," the Etiologicalists will say "No, the social convention *makes* it money, the gold is irrelevant." (i.e., History makes it function, the role is irrelevant). You are trying to stand in the middle of a trench war. Be prepared for fire from both sides.

  ---

  ## Final Advice on the "Settled" Constraint
  You must explicitly acknowledge in your talk (or opening remarks) that **the definition of "function" is not settled science.**
  *   **Settled:** Natural selection requires heritable variation in fitness.
  *   **Settled:** Traits have causal effects on organisms.
  *   **Contested:** Whether "function" requires a history of selection (Etiology) or just a causal contribution (Cummins).
  *   **Contested:** Whether "fitness" can be meaningfully assigned to traits.

  If you speak as if the Etiological account's dependence on Causal Role is a discovered fact rather than a philosophical argument, the Etiologicalists in the room will treat it as a category error. Frame it as: *"I am proposing a reconciliation of the two accounts,"* not *"I am revealing the true mechanism the etiologicalists missed."* The latter implies they are incompetent; the former invites collaboration.
