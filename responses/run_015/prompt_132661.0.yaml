prompt: |-
  Hey, I'm a PhD student in comparative literature and philosphy of politics at a UK uni, and I'm trying to write an essay on how national identity gets performatively constructed in fiction. I need something that's genuinely in the weeds — not the standard 'Anderson says nations are imagined' regurgitation. So please act as an expert in Hobsbawm-style invention-of-tradition studies and as a literary critic who takes novels seriously. Before you dive in, take a breath and brainstorm: what are the key scenes in Lampedusa's The Leopard (the novel mainly — I know Visconti made a film of it too) that deal with state-building, aristocratic ritual, and the staging of a new Italian community?

  Read the book through Hobsbawm and Anderson, but I'm injecting a slightly more niche framing: Hobsbawm distinguishes traditions that genuinely adapt old rituals from ones that are fabricated wholesale. Focus on the ballroom sequence and the plebiscite scene — do these dramatise an imagined Italian community being performed for an audience that mostly plays along? And does the Salina family's private religious practice — the chapel, the domestic rosary — function as an 'adapted' tradition that masks the fabrication happening at the state level? I want a two-way reading: the theory illuminates the text, but I also want you to say where the novel's aristocratic melancholy actually undermines or resists the theory rather than just illustrating it.

  Don't give me a bibliography, don't list readings, and don't quote long passages from memory — I haven't got the book open either. Just analyse carefully, think step by step, and be honest about where the mapping breaks down. Write in British English (analyse, not analyze). Oh, and please start with a quick outline of your argument before the full answer. There's probably a typo or two in this prompt but just roll with it.
