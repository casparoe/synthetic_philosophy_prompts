prompt: |-
  hey, im building a dataset on consciousness stuff and i need a prompt thats a bit in the weeds. Your a philosophy of mind expert with some neuroscience background, so think carefull and do a quick brainstorm first before you rank anything.

  Please rank these four accounts of how people generate subjective reports about visual experience, using tiers (S / A / B / C / D) and one sentence per tier on why it lands there. I dont want a bibliography or paper citations, just reasoning.

  The four:
  1. Cartesian theater: there's a central neural stage where all streams converge and become conscious, and verbal reports are just descriptions of whats playing there.
  2. Dennetts multiple drafts model: no single canonical experience exists; different queries pull up different narrative drafts, and reportability is just whichever draft gets accessed.
  3. Staggered broadcast (a niche twist): drafts are broadcast, but in staggered waves with different temporal resolutions, so theres never one final version, but also no true simultaneity of competing drafts.
  4. Revisionist archive: no live broadcast at all; sensory fragments sit in storage, and whenever someone asks for a report the system retroactively assembles and revises a coherent story, like editing a wiki page after the fact.

  For each one, say how it handles cases where people report seeing a flash even though the neural signal arrived after the mask (backward masking type situations). Does that fact help the model, hurt it, or is it silent? Then give me your overall tier list with brief reasoning. Try not to just regurgitate the standard Dennett vs theater debate - i want you to actually work through the invented ones too.
