answer: |-
  **Opening Remarks: Rotational Inertia and Ontological Commitment**

  Colleagues, historians, and friends,

  Consider the bucket. It is a simple apparatus: a pail of water suspended by a twisted cord. When released, the bucket spins. Initially, the water remains stationary, its surface flat. Gradually, friction transfers the motion to the water. The surface becomes concave, climbing the walls. Finally, the bucket stops, but the water continues to spin, retaining its concave shape.

  Isaac Newton looked at this concave surface and saw the signature of Absolute Space. He argued that because the water curves even when stationary relative to the bucket, it must be rotating relative to something else. Since no other material object sufficed, he posited space itself as a substantial container—a silent, invisible stage that dictates what counts as true rotation. For over three centuries, this argument has served as the fortress of substantivalism, the view that spacetime exists independently of the matter within it.

  I stand before you to declare that this fortress is built on sand.

  Newton's inference relies on a hidden, unjustified premise: the assumption that inertial effects require a local causal agent. He assumed that because the force is felt locally—here, in the bucket—the cause must be local, or else it must be a substance present at every point. This is a category error. It conflates the *location* of the effect with the *locality* of the explanation.

  We must reject substantivalism. In its place, I propose we adopt the framework of **relational anchoring**.

  Relational anchoring holds that rotational inertia reveals not a hidden substantial container, but a globally distributed relational constraint. On this view, local rotational states are meaningful because they are anchored in the overall structure of relations to distant matter, without requiring direct local causal interaction with that matter. The water climbs the walls not because it rubs against absolute space, nor because distant stars physically push it via some instantaneous force, but because the metric structure of the universe—the sum total of spatial relations—defines what constitutes a non-rotating frame.

  To understand why this distinction matters, we must be precise about our terminology. You will hear the term **Mach's principle** during this workshop; simply put, it is the hypothesis that the inertia of a body is determined by the distribution of all other matter in the universe. You will also hear **background independence**, which means the laws of physics do not depend on a fixed spacetime stage. Relational anchoring satisfies the spirit of Mach without falling into the trap of requiring explicit causal mechanisms between my bucket and the Andromeda galaxy. It treats the global distribution of matter as setting the boundary conditions for local geometry.

  Why must we take this committed stance? Because substantivalism offers an explanation that is no explanation at all. To say the water curves because it moves relative to "space" is to reify a mathematical coordinate system into a physical ghost. It grants space causal powers—the ability to resist acceleration—while denying it any other physical properties. It is an ontological extravagance that violates the empirical rigor we all share.

  The historians among you know that Newton himself was uneasy about action at a distance. He sought a mechanism. Substantivalism was his solution to the locality problem: if space is everywhere, it can act locally. But we know now that fields mediate interactions. We know that geometry is dynamic. To cling to Absolute Space is to ignore the lesson of General Relativity, which taught us that matter tells space how to curve. If matter determines the geometry, then inertia is a consequence of that geometry, which is itself a product of the material distribution.

  This is the core of relational anchoring. It acknowledges that the distant stars do not need to send a signal to the bucket to tell it how to behave. Instead, the bucket's behavior is a manifestation of its place within the total relational network. The constraint is global; the manifestation is local. This dissolves the need for a substantival container while preserving the objective reality of rotational effects.

  Some may worry that this view renders inertia mysterious. I argue the opposite. Substantivalism hides the mystery behind the word "space." Relational anchoring exposes the structure where the explanation actually lives. It demands that we treat the universe as a unified whole, where local dynamics are inseparable from global topology.

  This workshop is not convened to debate whether space exists. We proceed from the conviction that it does not. We are here to examine the consequences of this commitment. How does relational anchoring constrain our formulations of quantum gravity? How does it reshape our reading of historical texts where absolute space was taken for granted? Can we formalize the notion of a "globally distributed relational constraint" without slipping back into the language of fields that look suspiciously like substantival spaces?

  I invite you to engage with these questions vigorously. Challenge the mathematics. Scrutinize the historical claims. But do not retreat to the comfort of the absolute. The bucket does not require a container to hold its water, and physics does not require a substance to hold its laws. It requires only the relations between things.

  Let us begin.

  ***

  **Reflective Note to the Speaker**

  **1. Liberties with Newton's Text:**
  In the speech, I characterize Newton's substantivalism as a "category error" regarding locality. Historically, Newton was aware of the theological and metaphysical implications of Absolute Space; he viewed it as the "sensorium of God," not merely a causal agent for inertia. The speech simplifies his motivation to fit the argumentative arc, presenting him as motivated primarily by a locality problem rather than his actual theological commitments. Additionally, the speech implies Newton was "uneasy" about action at a distance in a way that directly led to substantivalism; while true regarding gravity, his justification for absolute space in the *Scholium* is kinematic, not dynamic.

  **2. Dependence on "Relational Anchoring" Framing:**
  The term "relational anchoring" is your specific conceptual framing, not standard terminology in the philosophy of physics literature.
  *   **Standard Relationism:** Typically faces the "empty universe" objection (would a single particle in an empty universe have inertia?). Standard Machian relationists often struggle to explain inertia without distant matter present.
  *   **Your Framing:** The speech leverages your specific clause: "without requiring direct local causal interaction." This distinguishes your view from naive Machianism (which often implies forces from distant stars) and aligns it more closely with modern structural realism or shape dynamics, but the specific phrasing is your own contribution.
  *   **Commitment:** By delivering this speech, you are committing to the claim that this framing solves the locality problem better than standard metric field realism. You are positioning this not as a heuristic, but as the *ontologically correct* interpretation, which is a stronger claim than most contemporary philosophers of physics would make without significant qualification. You are effectively advocating for a specific form of ontic structural realism under a new name.
