      *   *Counterfactualists:* Focus on dependence. Did E happen because C happened? They look for the nearest possible world where C is false. In self-modifying loops, this is hard because changing C might change the rules of the system itself, making "holding everything else fixed" impossible. They are asking about metaphysical dependence or explanatory priority.
      *   *Interventionists:* Focus on manipulation. Does changing C via an external "surgery" change E? They use Structural Causal Models (SCMs). For self-modifying systems, they update the graph structure dynamically. They are asking about predictive control and stability under external perturbation.
      *   *Synthesis:* Both are trying to formalize "cause," but one leans on similarity metrics between worlds, the other on modular equations.
      *   *Drafting:* Counterfactualists analyze metaphysical dependence by comparing the actual world to the nearest possible world where the cause is absent. In self-modifying loops, they struggle because removing the cause might alter the system's governing laws, violating the "ceteris paribus" condition. Interventionists analyze manipulability using Structural Causal Models, treating causes as variables subject to external "surgery." For feedback loops, they dynamically update the causal graph to reflect structural changes. Essentially, counterfactualists seek explanatory priority through similarity metrics, while interventionists seek predictive control through modular equations. Both aim to capture causal intuition, but the former prioritizes ontological grounding, whereas the latter prioritizes operational utility in complex, adaptive systems.

