prompt: |-
  Trying to get my head round higher-order theories of consciouness before a seminar and I keep hitting the same wall. As I understand the setup: a mental state becomes conscious when some higher-order mechanism notices it and forms a thought to the effect that I'm in that state — but that cant be right as it stands, because the mechanism could get it wrong. You could even test it: stimulate whatever circuit generates the higher-order state while making sure the first-order state isn't there at all, and the theory seems committed to saying the subject now consciously feels a pain they aren't in, which is nonsense. So it has to add an accuracy condition, where the higher-order thought has to correctly pick out an actual first-order state. But then the higher-order thought isnt doing any work anymore, is it: the state is already a pain, qualitiative character and all, before the thought turns up, so you've just got a first-order theory with extra steps. And if the higher-order thought itself has to be conscious to do the job, dont you get a regress on top of that. Where am I going wrong, and is there a version of the theory that actually survives this rather than just biting the bullet? Write it out as plain prose like an email please, no headings or bullets or bold or tables.
