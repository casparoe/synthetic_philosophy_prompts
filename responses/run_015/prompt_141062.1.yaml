answer: |-
  Subject: Thoughts on Higher-Order Theories before your seminar

  Hi there,

  It is completely normal to hit that wall with Higher-Order Theories, and honestly, the objections you are raising are exactly the ones that keep the debate alive in the literature. You have grasped the core tension perfectly, but there are a few nuances in how the theory is typically formulated that might help you climb over that wall, or at least see why some theorists think the wall isn't actually there.

  Let's start with the regress problem you mentioned, because that is actually the easiest one to resolve based on the standard formulation. You asked if the higher-order thought itself has to be conscious to do the job. The standard Higher-Order Thought theory, particularly as defended by David Rosenthal, explicitly says no. The higher-order thought is itself unconscious. If it were conscious, you would indeed need a third-order thought to be aware of it, and so on ad infinitum. The claim is that a mental state becomes conscious simply by being the target of an unconscious higher-order state. So the regress stops immediately because the monitoring mechanism operates in the dark, so to speak. It illuminates the first-order state without needing illumination itself.

  The second point you raised is about redundancy and whether the higher-order thought is doing any work. This hinges on what you think the first-order state is like before the higher-order thought arrives. Your intuition is that the state is already a pain with all its qualitative character before the thought turns up. The Higher-Order theorist denies this. They argue that the first-order state exists and carries out functional processing, like signaling damage, but there is nothing it is like to be in that state until it is targeted. In this view, qualitative character or phenomenal consciousness is not an intrinsic property of the first-order state but a relational property. The higher-order thought does the work of transforming a non-conscious mental state into a conscious one. So it is not just first-order theory with extra steps, because without those steps, the state remains unconscious. The work being done is the conferral of subjective awareness itself.

  That leaves you with the trickiest problem, which is the misrepresentation objection. You are worried that if we stimulate the higher-order mechanism without the first-order state, the theory says you are consciously in pain when you are not, which seems nonsensical. Here you have to choose between two versions of the theory. The hardline version, again associated with Rosenthal, actually bites the bullet. They argue that if you have a higher-order thought that you are in pain, you are consciously in pain, even if the first-order state is missing. They compare this to hallucination. If you hallucinate a pink elephant, you are having a visual experience even though no elephant is there. Similarly, if you have a higher-order thought of pain, you are having a conscious experience of pain even if no pain state is there. It feels wrong to common sense, but they argue it preserves the idea that consciousness is strictly a matter of higher-order awareness.

  However, if you want a version that does not bite that bullet, you need a version that includes an accuracy or reality constraint. This requires the first-order state to actually exist for the experience to be conscious. You worried this makes the higher-order thought redundant, but proponents of this view argue it does not. The first-order state provides the content, but the higher-order state provides the awareness. Without the higher-order state, the content exists but is not experienced. Without the first-order state, there is no content to be experienced. Both are necessary. This avoids the nonsense of feeling pain without pain, but it does open the theory up to the criticism that it is becoming too close to a First-Order theory.

  There is a middle ground version you might find useful for your seminar called Self-Representationalism. This view suggests that a conscious state is a single state that represents both the world and itself. So it is not one state looking at another separate state, which avoids the gap where misrepresentation could happen. The state represents the damage and simultaneously represents itself as occurring. This keeps the accuracy condition built-in because the state cannot represent itself as existing without existing, and it avoids the regress because the self-representation is intrinsic to the state rather than a separate higher-order step. This might survive your objections better because it avoids the separation between the first-order and higher-order states that leads to the misrepresentation worry in the first place.

  Ultimately, you are not going wrong in your reasoning. You have identified the exact pressure points where the theory is most vulnerable. The key to navigating the seminar is to clarify whether the theorist you are discussing accepts the possibility of empty higher-order thoughts or insists on a reality constraint, and how they explain the ontological status of the first-order state before it becomes conscious. If they say the first-order state already has qualitative character, then you are right to push the redundancy objection. If they say it does not, then the higher-order mechanism is doing the work of creating consciousness, even if it risks the misrepresentation problem.

  I hope that helps clear the fog a bit before you go in. It is a tough patch of philosophy to navigate, but you are asking the right questions.

  Best of luck with the seminar.

  Cheers
