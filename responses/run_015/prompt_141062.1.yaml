          2.  *Redundancy/Work Problem:* If an accuracy condition is added (HOT must correctly pick out the first-order state), then the first-order state seems to already have the qualitative character, making the HOT redundant (just first-order theory with extra steps).
          3.  *Regress Problem:* If the HOT itself must be conscious, it leads to an infinite regress.
      *   **Task:** Explain where the user might be going wrong, discuss if there's a version that survives, and address the objections.
      *   **Format:** Plain prose like an email. No headings, no bullets, no bold text, no tables.

