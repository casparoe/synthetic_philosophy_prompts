  10. **Refining the Tone:** Academic, precise, respectful of the user's philosophical labor. Avoid being too prescriptive; offer it as a tool for the thesis.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Case 4 is different because ends differ." I need to explain *why* the Unilateralist's Curse doesn't apply there. The Curse assumes a common utility function. If the utility functions differ, it's not a Curse, it's a Principal-Agent problem or a Whistleblowing scenario.
      *Also, Case 6 (Evaluative):* If we share the end "do good," but disagree on "what is good," unilateralism leads to fragmentation. This is a *Coordination* curse, not just an *Epistemic* curse. I should highlight this distinction.

      *(Refining Case 5)*: The user says "Curse of Obstruction... I do not feel its force." Why? Because obstruction is often reversible. The Curse applies most strongly to *irreversible* actions. I need to make Reversibility a key clause.

      *(Final check on the Principle)*: Make sure it covers the "Correlated Errors" point (Case 7). If everyone uses the same broken model, consensus is worthless.

      *Let's formulate the principle clearly.*
      **Presumption:** Refrain from unilateral action on high-stakes issues when a relevant consensus opposes it.
      **Defeaters:**
      1.  **Divergent Interests:** The consensus protects parochial interests, not the shared end.
      2.  **Correlated Error:** The consensus relies on a framework the agent has specific reason to believe is broken.
      3.  **Reversibility/Low Cost:** The action is easily reversible or the cost of error is low relative to gain.
      4.  **Private Epistemic Access:** The agent possesses hard evidence not assessable by the group.
      *Constraint:* Evaluative disagreements (Case 6) generally do not trigger Defeater 4.

      *Wait, Case 6:* User says "Not fine." My principle should support that. Evaluative disagreements require coordination to avoid fragmentation. So, Evaluative Disagreement -> Stronger Presumption.

