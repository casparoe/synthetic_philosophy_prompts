prompt: |-
  I'm on the review board for a small grant program that funds quick-turnaround social-science pilots. We get like 20 proposals a month, and researchers keep asking if they can run a small preliminary survey before locking their main study design — basically asking wether it's worth delaying the grant decision to gather more info. I want a decision procedure based on Good's theorem on the value of information, turned into something my board can actually run in a 15-minute meeting with nothing but a whiteboard and coffee.

  The procedure should take a proposal and ask questions in order: can they actually update their action after recieving the info? are the prior probabilities genuinely fixed, or does the pilot itself become part of the result and corrupt them? Where the math gives a clear yes or no, say so; where it becomes a judgment call about wether the delay cost outweighs the expected value, flag it as a values vote, not a fact. I need it to catch the hidden misfires — like when the information looks free but actually expands the decision space in a way that violates the theorem's conditions. Then run it on three cases: a team that wants to pre-test survey questions on 30 people before a 500-person study; a team that wants to peek at preliminary census data before choosing which neighborhoods to sample; and a case where we all want to approve the pilot but the procedure forces a no because the information can't actually change our funding decision. Keep it practical for people who aren't decision theorists, mark every spot where we have to vote on values instead of computing answers, and be honest about what the procedure just can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** Small grant program, social-science pilots, high volume (20 proposals/month), quick turnaround.
      *   **Problem:** Researchers want to run preliminary surveys/pilots *before* the grant decision (delaying funding) to refine design. Board needs to decide if this delay is worth it.
      *   **Tool:** Good's Theorem on the Value of Information (VOI).
      *   **Constraints:** Must be runnable in a 15-minute meeting, whiteboard + coffee only, practical for non-decision-theorists.
      *   **Requirements:**
          *   Sequential questions.
          *   Distinguish between factual "Yes/No" and value judgments (votes).
          *   Catch hidden misfires (violations of theorem conditions).
          *   Apply to three specific cases (Survey pre-test, Census peek, "Want to approve but can't" case).
          *   Honest about limitations.

  2.  **Deconstruct Good's Theorem (VOI):**
      *   *Core Idea:* The expected value of obtaining information is always non-negative *if* you can act on it to change your decision, and the cost of obtaining it is less than the expected gain from making the better decision.
      *   *Formula (Simplified):* $VOI = E[U|Info] - E[U|No Info] - Cost$. If $VOI > 0$, get info.
      *   *Key Assumptions:*
          1.  The decision maker is rational (maximizes expected utility).
          2.  The information doesn't change the *available actions* (only the probabilities associated with them).
          3.  The cost includes time/opportunity cost.
          4.  The information is relevant to the decision at hand.

  3.  **Drafting the Procedure (The "15-Minute VOI Filter"):**
      *   *Goal:* Translate the math into plain English questions.
      *   *Step 1: The Action Test.* Can the info actually change the funding decision? If not, VOI = 0.
      *   *Step 2: The Cost Test.* Is the delay cost quantifiable? (Time = money/opportunity).
      *   *Step 3: The Contamination Test.* Does running the pilot change the study itself (Hawthorne effect, data leakage)? This violates the "independent information" assumption.
      *   *Step 4: The Threshold Test.* Is the potential upside big enough to justify the cost? (This is the value vote).

  4.  **Refining for the "Whiteboard & Coffee" Constraint:**
      *   Needs to be visual.
      *   Needs clear "Stop" points.
      *   Needs explicit markers for "Vote Here."

  5.  **Developing the Three Cases:**
      *   *Case 1 (Survey Pre-test):* 30 people before 500.
          *   *Analysis:* Likely high VOI. Fixing bad questions saves the whole study. Cost is low (2 weeks?).
          *   *Verdict:* Yes, but check contamination.
      *   *Case 2 (Census Peek):* Choosing neighborhoods.
          *   *Analysis:* Risky. If they peek, they might cherry-pick. Does it change the *action* (which neighborhoods)? Yes. Does it corrupt the *validity*? Maybe (p-hacking risk).
          *   *Verdict:* Caution. Value vote on integrity vs. efficiency.
      *   *Case 3 (The "Want to Approve" Trap):* Info can't change decision.
          *   *Analysis:* Board already knows they will fund (or not). The pilot is just procrastination or busy work.
          *   *Verdict:* No. VOI = 0.

  6.  **Addressing "Hidden Misfires" (Theorem Violations):**
      *   *Expansion of Decision Space:* If the pilot creates *new* options not originally considered, Good's Theorem in its basic form doesn't apply directly (it assumes a fixed set of actions).
      *   *Endogenous Information:* If the act of measuring changes the outcome (common in social science).
      *   *Sunk Cost/Irreversibility:* If the delay kills the opportunity entirely.

  7.  **Structuring the Output:**
      *   **Introduction:** Set the stage, acknowledge the constraint (15 mins).
      *   **The Procedure:** Step-by-step flowchart style.
      *   **The "Value Vote" Markers:** Clearly highlighted.
      *   **The Three Cases:** Walkthroughs using the procedure.
      *   **Limitations:** Honest assessment of where this breaks.

  8.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is Good's Theorem too technical?
      *   *Fix:* Don't mention the formula. Use the *logic* of the formula (Expected Gain - Cost).
      *   *Critique:* Is 15 minutes realistic?
      *   *Fix:* Keep the questions binary where possible. Force a vote if ambiguity arises.
      *   *Critique:* Did I address the "corrupt priors" concern?
      *   *Fix:* Add a specific step about "Data Leakage/Contamination."
      *   *Critique:* The prompt asks for "where the math gives a clear yes/no... flag it as a values vote."
      *   *Fix:* Ensure the distinction is sharp. Math says "VOI > 0", Values say "Is the risk worth it?"

  9.  **Final Polish:**
      *   Tone: Professional, pragmatic, slightly weary (grant board vibe).
      *   Formatting: Bold headers, boxes for votes, clear "STOP" signs.

  *(Self-Correction on Case 2)*: Wait, peeking at census data before sampling is often standard practice (stratification). But if they peek to *find* significance, that's p-hacking. I need to distinguish between "design refinement" and "outcome shopping." I will frame it as "Design vs. Outcome."

  *(Self-Correction on Case 3)*: The prompt says "procedure forces a no because the information can't actually change our funding decision." This implies the Board has already mentally decided. The procedure must expose this bias.

  10. **Finalizing the Procedure Steps:**
      1.  Reversibility (Can we say no after?)
      2.  Actionability (Will we actually change the design?)
      3.  Contamination (Does the pilot ruin the main study?)
      4.  Cost/Benefit (The Value Vote).

  Let's write it.cw
answer: |-
  # The 15-Minute "Value of Information" Filter
  **For:** Grant Review Board  
  **Tools:** Whiteboard, markers, coffee.  
  **Goal:** Decide if delaying a funding decision for a pilot study is mathematically justified or just procrastination.

  This procedure is based on **Good's Theorem**: *Information is only worth buying if it can change your decision, and the benefit of that better decision outweighs the cost of waiting.*

  Draw a flowchart on the whiteboard. Go through the proposal. If you hit a **STOP**, the answer is **NO** (do not delay funding for a pilot). If you hit a **VOTE**, put it to the room. If you make it to the end, the answer is **YES**.

  ---

  ## Step 1: The Reversibility Test (Fact Check)
  **Question:** *If the pilot results come back "bad" or inconclusive, are we willing to reject this proposal?*

  *   **Yes:** We might kill the project based on pilot data. $\rightarrow$ **Proceed to Step 2.**
  *   **No:** We intend to fund them anyway; the pilot is just "due diligence" theater. $\rightarrow$ **STOP.**
      *   *Why:* If the funding decision won't change, the Value of Information (VOI) is zero. You are paying time costs for no decision gain.
      *   *Board Action:* Reject the delay. Fund now or reject now.

  ## Step 2: The Contamination Test (Fact Check)
  **Question:** *Does running this pilot physically alter the population or data for the main study in a way that biases the results?*

  *   **No:** The pilot is distinct (e.g., different city, different question set validation). $\rightarrow$ **Proceed to Step 3.**
  *   **Yes:** The pilot subjects will be part of the main study, or the act of measuring changes the behavior (Hawthorne effect), or peeking at data allows "p-hacking" the design. $\rightarrow$ **STOP.**
      *   *Why:* Good's Theorem assumes information is independent. If gathering the info changes the probabilities of success for the main action, the math breaks. You aren't buying information; you're spending the dependent variable.
      *   *Board Action:* Reject the delay. Require they design the main study without the peek.

  ## Step 3: The Actionability Test (Fact Check)
  **Question:** *Is there a specific, pre-defined change to the study design that will happen if the pilot shows X?*

  *   **Yes:** (e.g., "If >20% drop out, we switch recruitment channels.") $\rightarrow$ **Proceed to Step 4.**
  *   **No:** (e.g., "We'll see what happens and tweak things.") $\rightarrow$ **STOP.**
      *   *Why:* Vague updates have undefined value. If you can't define how the action changes, you can't calculate the expected gain.
      *   *Board Action:* Reject the delay. Ask for a concrete decision rule.

  ## Step 4: The Cost-Benefit Vote (Value Judgment)
  **Context:** We have established the info *could* change our mind (Step 1), won't ruin the study (Step 2), and will trigger a specific change (Step 3). Now we must weigh the cost of waiting against the risk of failure.

  **The Setup:**
  1.  **Cost of Delay:** How many weeks? (Write on board: $W$).
  2.  **Risk of Failure:** Without the pilot, what is the % chance this study fails waste of money? (Write on board: $P_{fail}$).
  3.  **Pilot Rescue:** If we pilot, how much does that % drop? (Write on board: $P_{saved}$).

  **[VOTE REQUIRED]**
  *Ask the board:* **Does the reduction in risk ($P_{saved}$) justify the opportunity cost of waiting ($W$ weeks)?**

  *   *Majority Yes:* **APPROVE DELAY.** (Hold grant, fund pilot phase).
  *   *Majority No:* **REJECT DELAY.** (Fund main study as-is or reject).

  ---

  ## Running the Procedure: Three Cases

  ### Case 1: The Survey Pre-Test
  **Proposal:** Team wants to survey 30 people to check question clarity before launching the 500-person main study. Delay: 2 weeks.
  *   **Step 1 (Reversibility):** If the 30 people don't understand the questions, will you fix them? **Yes.** (If they can't fix them, why pilot?)
  *   **Step 2 (Contamination):** Are the 30 people part of the 500? **No.** (They are excluded). Does asking the question change the answer? **Minimal.** $\rightarrow$ **Pass.**
  *   **Step 3 (Actionability):** Will they change the questions if confusion is >10%? **Yes.** $\rightarrow$ **Pass.**
  *   **Step 4 (Vote):** Cost is 2 weeks. Risk of 500 people answering garbage questions is high. Rescue value is high.
  *   **Result:** **YES.** The board votes that 2 weeks is cheap insurance against a ruined dataset.

  ### Case 2: The Census Peek
  **Proposal:** Team wants to analyze preliminary census data to decide *which* neighborhoods to sample before locking the grant. Delay: 4 weeks.
  *   **Step 1 (Reversibility):** If the census data looks bad, will they choose different neighborhoods? **Yes.**
  *   **Step 2 (Contamination):** **STOP.**
      *   *Reasoning:* This violates the "independent information" assumption. By peeking at the outcome distribution (census data) to select the sample, they are implicitly optimizing for significance rather than representation. The pilot *becomes* the first stage of analysis. It corrupts the priors.
      *   *Board Action:* **Reject Delay.** They must define neighborhood selection criteria *before* seeing the data to avoid selection bias. The "information" here is actually "researcher degrees of freedom."

  ### Case 3: The "We Want to Help" Trap
  **Proposal:** A favored researcher asks for a 3-week delay to "refine the budget and timeline." The board likes them and wants to fund them.
  *   **Step 1 (Reversibility):** If the refined budget comes back higher, will we reject them? **Silence... No.** (We intend to fund them regardless).
  *   **Result:** **STOP.**
      *   *Reasoning:* The VOI is zero. The information (refined budget) will not change the action (funding). The delay is purely administrative comfort, not decision-theoretic value.
      *   *Board Action:* **Fund Now.** Do not make the researcher wait. If the budget is acceptable now, lock it. If not, reject now. Do not pretend a pilot is needed.

  ---

  ## Limitations & Honest Admissions
  *This procedure is a heuristic, not a proof. Here is where it fails:*

  1.  **It Cannot Measure "Learning":** Good's Theorem values information for *decision making*, not for *knowledge generation*. If the pilot produces no decision change but teaches the field something valuable, this procedure says **NO**. You must override the procedure via a **Values Vote** if "scientific curiosity" outweighs "decision efficiency."
  2.  **It Assumes Rational Actors:** The procedure assumes the researchers will actually follow the pre-defined decision rule (Step 3). If you don't trust them to stick to the plan, the VOI calculation is fiction.
  3.  **It Ignores Strategic Behavior:** Researchers may game the pilot to guarantee funding. Step 2 catches some of this, but not all.
  4.  **The "Values Vote" is Subjective:** Step 4 requires the board to agree on what "weeks" are worth compared to "risk." A senior professor and a junior policymaker will value time differently. There is no math to solve that disagreement.

  ## Whiteboard Summary for the Board
  *(Draw this box at the start of every meeting)*

  | Check | Question | Pass? |
  | :--- | :--- | :--- |
  | **1** | Can we still say "No" after the pilot? | [ ] |
  | **2** | Does the pilot contaminate the main data? | [ ] |
  | **3** | Is there a specific rule for changing the design? | [ ] |
  | **4** | **[VOTE]** Is the risk reduction worth the wait? | [ ] |

  **If any box is unchecked (1-3), the answer is NO.**
  **If box 4 fails, the answer is NO.**
  **If all pass, the answer is YES.**
