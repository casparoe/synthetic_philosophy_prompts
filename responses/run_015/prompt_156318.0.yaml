answer: |-
  ### Correspondence Table: Hive Analogy vs. Darwin's *Descent of Man*

  | Hive Component | Pop-Science Analogy Function | Darwin's Actual Account (*The Descent of Man*) | Status |
  | :--- | :--- | :--- | :--- |
  | **Queen** | Central authority/Religion issuing commands | **No direct equivalent.** Darwin cites "public opinion" and "community approval," but these are decentralized, not a sovereign ruler. | **Mismatch** |
  | **Worker** | Individual human suppressing self for group | **Moral Agent.** Individuals possess social instincts *plus* intellectual powers to weigh conflicting instincts. | **Partial Match** |
  | **Pheromone** | Social instinct/Religion as chemical signal | **Social Instinct.** Darwin agrees humans have innate social impulses similar to animals, but these are inputs, not total determinants. | **Match** |
  | **Colony** | The Tribe/Society requiring cohesion | **The Community/Tribe.** Darwin agrees morality originates in serving the community, but argues it expands beyond the tribe via reason. | **Match** |
  | **Hive-mind** | Conformity/Blind coordination | **Conscience.** For Darwin, conscience is the clash between instinct and **reasoned reflection**, not blind synchronization. | **Mismatch** |

  ---

  ### Audit of the Analogy

  #### 1. Where the Mapping Breaks (Fatal Disanalogies)
  These are not cosmetic differences; they undermine the core claim that human morality is *functionally identical* to hive coordination.

  *   **Rational Reflection (The "Human Layer"):** The hive analogy assumes behavior is driven by immediate stimulus (pheromone/instinct). Darwin explicitly argues that human morality emerges only when **memory** and **reason** allow an individual to reflect on past actions and anticipate future consequences. A bee cannot feel regret or weigh a distant consequence; a human can. Darwin writes that the "highest possible stage in moral culture" is when we recognize we *ought* to obey reason over instinct. The hive model erases this cognitive layer, reducing humans to automatons.
  *   **The Origin of Religion:** The analogy posits religion as a "queen's signal" (top-down control mechanism). Darwin treats belief in "unseen spiritual agencies" as a **byproduct of cognitive faculties** (curiosity, imagination, reasoning about causation) applied to the unknown. It is a bottom-up emergence of reasoning, not a top-down suppression signal. While Darwin acknowledges religion reinforces social norms, he does not define it *as* a coordination tool designed to suppress thought.
  *   **Moral Progress vs. Static Coordination:** A hive's moral code (instinct) is static over millennia. Darwin's account allows for moral *progress* through the expansion of sympathy (via reason) to all sentient beings, not just the tribe. The hive analogy cannot account for the human capacity to reject tribal norms (e.g., abolitionism) in favor of universal principles, which Darwin cites as evidence of advanced moral culture.

  #### 2. Cosmetic Disanalogies
  *   **Biological Mechanism:** Comparing cultural transmission to pheromones is obviously metaphorical. This is acceptable poetic license provided the functional logic holds (it doesn't, see above).
  *   **Centralization:** Comparing community pressure to a Queen is a simplification of social hierarchy, but less fatal than the erasure of reason.

  #### 3. Does the Analogy Smuggle in Reductionism?
  Yes. The pop-science analogy imports a **hard functionalist reductionism** that Darwin's text does not fully support.
  *   **Darwin's Position:** Morality has natural origins (instinct), but it is validated and refined by human reason and sympathy. He is agnostic on whether this grants it objective "truth," but he treats the *experience* of moral obligation as real and distinct from mere impulse.
  *   **Analogy's Position:** Morality is *only* evolutionary glue with no truth value.
  *   **The Smuggle:** By equating humans to bees, the analogy bypasses Darwin's crucial distinction between *having* an instinct and *reflecting* on it. It uses Darwin's naturalism to justify a nihilism (no truth value) that Darwin himself hesitated to endorse. Darwin suggests that while our morals evolved, our reason allows us to critique them. The hive model denies the critique is possible.

  #### 4. Does This Rescue a Non-Reductionist Reading?
  It rescues a **naturalistic but non-nihilistic** reading. You can accept Darwin's account (morality evolves from instinct) without accepting the hive conclusion (morality is *just* glue). Darwin leaves room for morality to be "real" to the agent because of the rational layer. The pop-science conclusion is closer to **E.O. Wilson or Durkheim** than to Darwin. Wilson explicitly argued for sociobiological reductionism; Darwin argued for evolutionary continuity *plus* human uniqueness in intellect.

  ### Conclusion
  The hive analogy captures the **foundation** of Darwin's theory (social instinct) but collapses when applied to the **structure** of human morality (reason, reflection, expanded sympathy). Because the pop-science claim relies on the analogy to deny agency and truth-value, and Darwin's text relies on reason to establish them, the analogy fails to represent Darwin's actual argument. It carries the reductionist conclusion on its own back, using Darwin's name as cover.

  \answer{collapses}
  Verdict: The analogy captures the evolutionary substrate but erases the cognitive superstructure Darwin deemed essential.
