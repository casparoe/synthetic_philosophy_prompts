prompt: |-
  I'm the evaluation lead at a mid-size private foundation (about $90M a year, mostly housing stability and workforce programs) and I have to approve or reject the outcome indicators grantee orgs put in their proposals, because those indicators are what decide whether they get renewed. Its about 14 of these a quarter and I get maybe two hours of analyst time total across all of them, so whatever you give me has to be fast. The person who actually signs off is our program director — smart, not quantitative, will not read more than one page.

  The problem: our current screen is three questions — is the indicator measurable, is it plausibly caused by the grantee's work, and could the grantee hit it without changing what they do? That third one basically never fires, and I'm now pretty sure it's the wrong question entirely, since anything can be gamed if someone's clever enough, so a yes/no on gameability doesn't discriminate between proposals. Meanwhile we keep approving indicators that look fine on paper and then two years out the numbers are beautiful and nothing has changed.

  Build me the actual procedure. Concretely I need:

  - The questions my analysts ask about a proposed indicator, in order, with what counts as a sufficient answer to each. Not "consider whether X is robust" — a test they can run and a bar it has to clear.
  - Where the procedure terminates in reject, where it terminates in approve-with-a-cap or approve-with-a-monitor, and where it hands the thing to the program director because it's a question about values and not about facts. Be explicit about how the analyst is supposed to tell those apart, because right now they can't.
  - It has to keep four failure modes separate, because they need different fixes. (a) The indicator correlates with what we want but the correlation is imperfect for reasons that don't travel, so selecting hard on the indicator also selects for whatever makes it high for the wrong reasons. (b) The relationship holds in the normal range of performance and falls apart at the top end — which is exactly the end we're paying people to reach. (c) Pushing the indicator up causally reduces the thing we care about. (d) Somebody is deliberately optimizing the record instead of the outcome. I don't care what you name them. I care that the procedure tells an analyst which one they're looking at, because (a) gets fixed by changing the measure, (c) might get fixed by killing the incentive, (d) gets fixed by audit, and we currently apply the same fix to all four.
  - What to do when nobody can produce a number. Most of our grantees have tiny datasets and "we don't have the power to detect this" is going to be the honest answer more often than not, and the procedure can't just stall out every time.
  - Honesty about which steps are judgment calls wearing a lab coat. I'd rather see them flagged than have something that pretends to be mechanical.

  Then run it on three proposals and give me the one-page verdict you'd actually hand the program director for each:

  1. A workforce org proposing "percentage of participants placed in a job within 90 days of program completion," where the org itself defines what counts as completion.
  2. A housing org proposing "number of eviction filings prevented," measured by counting the households they assisted that never show up in county court records.
  3. A homelessness org proposing to be scored on "self-reported sense of stability at six months," collected in an interview by the same case manager who's been serving the person.

  For at least one of these the procedure should land somewhere the program team will hate — I want to see it say the thing, and I want to be able to judge whether it says it for a good reason or because the procedure is just trigger-happy. Also tell me which of the three the procedure is least well-suited to, and why.

  Finally: what can't it catch. The failure modes that would sail through every question on the list and still leave us funding something hollow — the slow drift ones, the ones where every org games identically so the comparison looks clean, the ones that land on people who never show up in anybody's data.
reasoning: |-
  Here's a thinking process that leads to the suggested evaluation procedure and verdicts:

  1.  **Deconstruct the Request:**

      *   **Role:** Evaluation Lead at a mid-size private foundation ($90M/year, housing & workforce).
      *   **Constraint:** High volume (14 proposals/quarter), low analyst time (2 hours total), one-page output for Program Director (smart, non-quantitative).
      *   **Problem:** Current screen (Measurable? Plausible? Gameable?) is too weak. Indicators look good but yield no real change (Goodhart's Law in action).
      *   **Requirements:**
          1.  Concrete questions/tests for analysts (not vague "consider robustness").
          2.  Decision tree (Reject, Approve-with-Cap, Approve-with-Monitor, Escalate to Director).
          3.  Distinguish 4 specific failure modes: (a) Imperfect correlation/selection bias, (b) Breakdown at top end, (c) Negative side effects (Perverse incentives), (d) Deliberate gaming/fraud.
          4.  Handle small datasets/low power (don't stall).
          5.  Flag judgment calls (no fake objectivity).
          6.  Run the procedure on 3 specific proposals (Workforce, Housing, Homelessness).
          7.  Provide one-page verdicts for the Program Director.
          8.  Identify which proposal the procedure is least suited for and why.
          9.  Identify blind spots (what slips through).

  2.  **Develop the Procedure (The "Screen"):**

      *   *Constraint Check:* 2 hours for 14 proposals = ~8.5 minutes per proposal. The procedure *must* be extremely fast. No complex regression analysis. It needs to be heuristic-based but rigorous.
      *   *Structure:* A funnel. Start with the easiest kill, move to the harder distinctions.
      *   *The 4 Failure Modes:* I need to map specific questions to these.
          *   (a) Imperfect Correlation: "If we maximize this number, does the real outcome necessarily go up?"
          *   (b) Top-End Breakdown: "Does hitting 100% on this metric require cutting corners?"
          *   (c) Negative Side Effects: "Does chasing this hurt the participant in another way?"
          *   (d) Gaming: "Can they change the number without changing the service?"
      *   *Small Data:* Use "Plausibility Checks" instead of Power Analysis. Look for baseline rates or external benchmarks.
      *   *Decision Points:*
          *   Reject: Fatal flaw in logic or high risk of (c) or (d).
          *   Cap: Good metric, but dangerous at scale (Mode b).
          *   Monitor: Good metric, but needs verification (Mode d risk).
          *   Escalate: Values trade-off (Mode c nuance).

      *   *Drafting the Questions (Iterative refinement for speed):*
          1.  **Definition Lock:** Is the denominator fixed *before* service starts? (Kills Mode d - cherry picking).
          2.  **External Validation:** Is there a third-party record or just internal logs? (Kills Mode d - fraud).
          3.  **The "Easy Win" Test:** Can they hit the target by serving easier clients? (Addresses Mode a).
          4.  **The "Ceiling" Test:** What happens if they hit 100%? (Addresses Mode b).
          5.  **The "Harm" Test:** Does hitting this number hurt the client? (Addresses Mode c).

      *   *Refining for the "2 Hours Total" Constraint:* This is the biggest bottleneck. 8 minutes per proposal means the analyst cannot do deep research. They need to rely on the *proposal text* and *quick external checks* (e.g., Googling standard rates). I need to make sure the procedure acknowledges this limitation. The "test" must be a *logical stress test* applied to the text, not a data audit.

  3.  **Applying to the Three Proposals:**

      *   **Proposal 1 (Workforce):** "% placed in job within 90 days." Org defines "completion."
          *   *Risk:* High. They can define "completion" to exclude hard cases (creaming). They can place people in bad jobs (Mode c).
          *   *Verdict:* Reject or Major Revision. The definition of "completion" is the killer.
      *   **Proposal 2 (Housing):** "Eviction filings prevented." Counting households assisted that *don't* show up in court.
          *   *Risk:* Counterfactual problem. How do you know the filing *would* have happened? This is Mode (a) - Imperfect correlation. Just because they didn't get evicted doesn't mean the org prevented it. Also, Mode (d) - they might only help people not at risk.
          *   *Verdict:* Reject. The counterfactual is unknowable without a control group.
      *   **Proposal 3 (Homelessness):** "Self-reported stability." Interviewed by *their own* case manager.
          *   *Risk:* Social desirability bias (Mode d). Case manager has incentive to coach answers.
          *   *Verdict:* Approve-with-Monitor. Needs third-party collection. But "stability" is hard to measure otherwise.
      *   *Constraint Check:* One needs to be a "hard no" the program team will hate. Proposal 2 is the strongest candidate for a hard no because "prevented evictions" is a classic vanity metric that is statistically impossible to verify without a control group. Program teams love this metric because it sounds impressive.

  4.  **Drafting the Verdicts (One Page Each):**

      *   Format: Recommendation, The One Big Risk, The Fix (or Reason for Rejection), Analyst Confidence.
      *   Tone: Direct, evidence-based, respectful of PD's time.

  5.  **Addressing the "Least Suited" and "Blind Spots":**

      *   *Least Suited:* Proposal 3 (Soft outcomes). Quantitative screens struggle with qualitative self-reports, even with checks.
      *   *Blind Spots:* Systemic drift, collusion, outcomes for non-participants (displacement), lag effects.

  6.  **Refining the Procedure (Self-Correction during drafting):**

      *   *Critique:* Is 8 minutes realistic for these questions?
      *   *Adjustment:* The questions need to be "Red Flag" checks. If the proposal doesn't explicitly answer them, it's an automatic "Return for Clarification" (which acts as a soft Reject/Delay).
      *   *Decision Logic:* I need to make sure the distinction between "Analyst Decision" and "Director Decision" is clear. Analyst = Facts/Logic. Director = Values/Strategy.
      *   *Failure Modes:* I need to explicitly label them in the procedure so the analyst knows *which* fix to apply.

      *(Self-Correction on Proposal 2)*: "Evictions Prevented" is notoriously difficult. If I reject it, the program team will hate it. This fits the prompt's requirement ("For at least one of these the procedure should land somewhere the program team will hate"). I will recommend Rejection with a specific explanation about the counterfactual.

      *(Self-Correction on Proposal 1)*: "Completion" definition is the lever. If we fix that, the metric is okay. So "Approve-with-Cap/Condition" is better than Reject.

      *(Self-Correction on Proposal 3)*: Self-report is often all we have. The risk is the *collector*. So "Approve-with-Monitor" (change collector) is the right path.

  7.  **Final Polish:**

      *   Ensure the tone is professional but cynical enough for an Evaluation Lead who knows the game.
      *   Check word counts for the verdicts (must fit one page).
      *   Ensure the "4 Failure Modes" are clearly integrated into the procedure steps.

  8.  **Final Review against Constraints:**
      *   2 hours total analyst time? The procedure must be a checklist, not a research project.
      *   One page for PD? Yes.
      *   Distinguish the 4 modes? Yes.
      *   Handle small data? Yes, by focusing on logic over power analysis.
      *   Flag judgment calls? Yes.

      *(Wait, one detail)*: "2 hours of analyst time total across all of them." That is *extremely* tight. 14 proposals / 120 minutes = 8.5 minutes per proposal. The procedure cannot require external data gathering. It must be a *document review* protocol. I will emphasize this limitation. The "tests" are logical consistency checks on the *proposal text*, not empirical validations.

      *Revised Plan for Procedure:*
      1.  **Denominator Lock:** (Mode d) - Is the population defined *before* intervention?
      2.  **Counterfactual Check:** (Mode a) - Do we know what would happen without us?
      3.  **Ceiling Stress:** (Mode b) - Is 100% possible without cheating?
      4.  **Harm Scan:** (Mode c) - Does success hurt the client?

      *Decision Rules:*
      *   Fail 1 = Reject (Gaming risk too high).
      *   Fail 2 = Reject or Monitor (Validity risk).
      *   Fail 3 = Cap (Don't incentivize maxing out).
      *   Fail 4 = Escalate (Values call).

      Let's write it.

      *(Wait, re-reading the prompt)*: "The person who actually signs off is our program director — smart, not quantitative, will not read more than one page." -> The *output* to the PD is one page per proposal. The *procedure* is for the analysts.

      *(Wait, re-reading the prompt)*: "For at least one of these the procedure should land somewhere the program team will hate." -> I will make Proposal 2 a hard Reject. "Evictions Prevented" is a vanity metric that implies knowledge of the counterfactual.

      *(Wait, re-reading the prompt)*: "Tell me which of the three the procedure is least well-suited to." -> Proposal 3. Soft outcomes are hard to screen with a hard procedure.

      *(Wait, re-reading the prompt)*: "What can't it catch." -> Need a section on blind spots.

      Okay, ready to draft.

      *Structure:*
      1.  The Procedure (The "8-Minute Screen").
      2.  The Three Verdicts (One Page Each).
      3.  Limitations & Blind Spots.

      *Tone:* Operational, direct, slightly weary but rigorous.

      *Failure Mode Mapping:*
      (a) Correlation/Selection -> Counterfactual Check.
      (b) Top End -> Ceiling Stress.
      (c) Harm -> Harm Scan.
      (d) Gaming -> Denominator Lock & Verification.

      *Small Data:* Addressed by relying on logical validity rather than statistical power. If the logic is sound, small N is acceptable with a "Monitor" tag.

      *Judgment Calls:* Explicitly marked as [JUDGMENT] in the procedure.

      Let's go.cw
answer: |-
  ## The 8-Minute Indicator Screen (Procedure v4.0)

  **Constraint:** 14 proposals/quarter, 2 hours total analyst time. ~8 minutes per proposal.
  **Goal:** Filter out hollow metrics before they reach the Program Director (PD).
  **Analyst Instruction:** Do not run regressions. Do not request new data. Apply these four logical stress tests to the *proposal text* and *baseline data provided*. If the proposal does not contain the information to pass a test, it fails automatically.

  ### Step 1: The Denominator Lock (Tests Failure Mode D: Gaming)
  **Question:** Is the population (denominator) defined *before* the service begins, and is it fixed?
  *   **Pass:** "All applicants registered in Q1" or "All tenants in Building X."
  *   **Fail:** "All program completers" or "All clients deemed ready." (This allows creaming/dumping).
  *   **Action:** If **Fail**, **REJECT**. *Reason: You can change the score by changing who enters the denominator.*
  *   **Judgment Flag:** [JUDGMENT] If the org argues that pre-definition is impossible (e.g., crisis intake), mark for **Monitor** (requires audit of intake logs).

  ### Step 2: The Counterfactual Check (Tests Failure Mode A: Imperfect Correlation)
  **Question:** If the indicator goes up, does the *actual outcome* necessarily go up, or could it go up because the pool got easier?
  *   **Test:** Look for a baseline or comparison rate. (e.g., "National avg job placement is 40%. We propose 60%.")
  *   **Pass:** Proposed target is within plausible range of external benchmarks + org explains *why* they beat the baseline (theory of change).
  *   **Fail:** No baseline provided, OR target is significantly higher than benchmarks without explanation, OR the metric measures something that happens naturally (e.g., "evictions prevented" without knowing eviction risk).
  *   **Action:** If **Fail**, **REJECT**. *Reason: We are measuring selection bias, not impact.*
  *   **Judgment Flag:** [JUDGMENT] If benchmarks don't exist (common in niche housing), mark for **Cap** (pay for performance only above a conservative floor).

  ### Step 3: The Ceiling Stress (Tests Failure Mode B: Top-End Breakdown)
  **Question:** What does it look like if they hit 100% on this metric?
  *   **Test:** Ask the analyst to imagine the org achieves the target perfectly.
  *   **Pass:** 100% success implies perfect service delivery (e.g., 100% of eligible tenants received legal counsel).
  *   **Fail:** 100% success implies cheating or harm (e.g., 100% job placement implies placing people in jobs they can't keep; 100% eviction prevention implies only helping people not at risk).
  *   **Action:** If **Fail**, **APPROVE-WITH-CAP**. *Reason: Incentivizing the maximum creates perverse behavior. Pay only up to the 90th percentile of historical performance.*

  ### Step 4: The Harm Scan (Tests Failure Mode C: Negative Side Effects)
  **Question:** Does maximizing this number hurt the participant or the system?
  *   **Test:** Check for conflicting incentives. (e.g., "Job placement" vs. "Job retention").
  *   **Pass:** Metric is paired with a quality check (e.g., Placement + 6-month retention).
  *   **Fail:** Metric stands alone and rewards speed/volume over quality.
  *   **Action:** If **Fail**, **ESCALATE TO PD**. *Reason: This is a values trade-off (Volume vs. Quality), not a measurement error.*

  ### Decision Matrix for Small Data
  *   **N < 30:** Do not reject for "low power." Instead, apply **Approve-with-Monitor**. Require quarterly raw data exports, not just summaries.
  *   **No Baseline:** Apply **Approve-with-Cap**. Set a conservative floor based on analyst intuition/external analogues.

  ---

  ## Verdicts for Program Director

  ### Proposal 1: Workforce Org ("Job Placement within 90 Days")
  **Recommendation:** **APPROVE-WITH-CONDITION** (Do not approve as written)
  **The One Big Risk:** **Failure Mode D (Gaming) & A (Selection).**
  The org defines "program completion." They can exclude difficult clients from the denominator to artificially inflate placement rates. A 90-day placement metric also incentivizes "churn and burn" (placing clients in unstable jobs just to hit the number).
  **The Fix:**
  1.  **Lock the Denominator:** Metric must be "% of *all eligible applicants* placed," not "% of completers."
  2.  **Add a Quality Lag:** 50% of payment tied to "Job Retention at 6 Months."
  **Analyst Confidence:** High. This is a standard gaming vector in workforce development.
  **Judgment Call:** We are assuming the org *can* track applicants who drop out. If they claim they can't, reject the proposal.

  ### Proposal 2: Housing Org ("Eviction Filings Prevented")
  **Recommendation:** **REJECT**
  **The One Big Risk:** **Failure Mode A (Imperfect Correlation/Counterfactual).**
  You cannot measure "prevented." To count a prevented eviction, you must know an eviction *would have occurred* without intervention. This proposal counts households assisted that *did not* show up in court records. This measures "Evictions that didn't happen," which includes thousands of tenants who were never at risk. It is statistically impossible to attribute the non-event to the grantee without a control group.
  **The Fix:**
  There is no fix for this indicator. It measures a phantom outcome.
  **Alternative:** Switch to "Eviction Cases Defended" (output) or "Households Retaining Housing at 12 Months" (outcome).
  **Analyst Confidence:** Very High. This metric is mathematically hollow.
  **Why the Team Will Hate This:** "Prevented Evictions" sounds impressive to donors. Telling them they can't count it feels like losing a success story. But funding this pays them to claim credit for things that would have happened anyway.

  ### Proposal 3: Homelessness Org ("Self-Reported Stability")
  **Recommendation:** **APPROVE-WITH-MONITOR**
  **The One Big Risk:** **Failure Mode D (Gaming/Social Desirability).**
  Clients will tell their case manager what they want to hear to stay in good standing. The case manager has an incentive to record "Stable" to meet grant targets.
  **The Fix:**
  1.  **Third-Party Collection:** Surveys must be administered by someone *other* than the primary case manager (e.g., a centralized evaluation staff or phone survey).
  2.  **Spot Audit:** We will randomly interview 10% of participants to verify responses.
  **Analyst Confidence:** Medium. Self-report is the best we have for "stability," but the collection method is compromised.
  **Judgment Call:** If the org says they lack budget for third-party collection, escalate to PD. Is "soft outcome" worth the fraud risk?

  ---

  ## Limitations & Blind Spots

  **1. Least Suited Procedure:**
  **Proposal 3 (Homelessness/Self-Report).**
  This procedure is designed to catch logical flaws and gaming in *hard* numbers. It is poorly suited for subjective well-being metrics. The "Counterfactual Check" fails because there is no external benchmark for "sense of stability." The "Denominator Lock" works, but the *quality* of the data relies entirely on human honesty. The procedure can flag the *risk* (who asks the question), but it cannot validate the *truth* of the answer.

  **2. What The Procedure Cannot Catch (The "Slow Drift"):**
  *   **Collusive Gaming:** If all grantees in a region agree to define "completion" the same way, the comparison looks clean, but the bar is lowered for everyone. The procedure checks individual proposals, not ecosystem drift.
  *   **Displacement Effects:** A workforce org might place a client in a job, but that job might have gone to someone else who didn't need help. The net community impact is zero, but the indicator is green. The procedure looks at the participant, not the market.
  *   **The "Missing" Population:** None of these metrics capture the people the org *rejected* at the door. An org can have perfect outcomes by only serving the top 10% of neediest clients. The Denominator Lock helps, but only if "eligible applicants" is strictly defined.
  *   **Lag Effects:** A "job at 90 days" metric misses the burnout at month 10. A "housing at 6 months" misses the eviction at month 18. We are funding short-term spikes, not long-term stability, and this screen validates that myopia rather than fixing it.

  **3. The "Values" Trap:**
  The procedure flags **Failure Mode C (Harm)** for escalation. However, if the PD decides "Volume is more important than Quality" (e.g., place 100 people in bad jobs rather than 10 in good jobs), the procedure cannot stop it. It can only ensure the decision is explicit.
