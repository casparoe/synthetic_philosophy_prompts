answer: |-
  **Part 1: Candidate Setups**

  1.  **Tax Resistance:** Maya refuses to pay local income tax because she dislikes foreign policy. *Failure:* This fails the "no net benefit" specification. It is difficult to argue a resident receives *no* benefit from municipal taxation (roads, schools, security), making the Fair-Play verdict ambiguous rather than clearly exonerating.
  2.  **Vaccination Mandate:** Maya refuses a vaccine during a mild outbreak to protest pharmaceutical pricing. *Failure:* This risks violating the "no life-or-death emergency" constraint. If the outbreak is mild enough to avoid emergency status, the "reasonably just" specification becomes hard to maintain regarding public health mandates.
  3.  **Traffic Law Protest:** Maya speeds to protest unsafe road design. *Failure:* This fails the "civil disobedience" specification regarding willingness to accept consequences safely. Speeding inherently risks harm to others, violating the nonviolent/safety constraint essential for genuine civil disobedience in a seminar context.

  **Part 2: Final Scenario**

  In drought-stricken Oakhaven, a democratically enacted water rationing scheme bans all outdoor watering to preserve reservoir levels, imposing equal fines for violations. Maya, residing on a private well, consumes zero municipal water and formally opted out of city supply services, deriving no hydration or pressure benefits from the cooperative grid. Nevertheless, the ordinance binds all properties. While the scheme is reasonably just and burdens are fairly distributed among users, it exempts commercial car washes using recycled water, a loophole Maya targets. She publicly waters her lawn midday with her well, announcing her intent to highlight this inconsistency, nonviolently accepting the fine. Her action costs money but threatens no health hardship. She knowingly accepts no net benefit from the reservoir preservation scheme since her well is independent, and she explicitly rejected the city's benefit package. Compliance requires merely letting her grass brown, not an unreasonable cost. The institutions remain reasonably just overall, despite the commercial exemption she protests. Maya acts conscientiously to communicate moral disagreement regarding the exemption's fairness within an otherwise just framework.

  **Part 3: Analysis**

  Under the **fair-play principle**, Maya breaches no political obligation. The definition requires knowingly benefiting from and voluntarily accepting the scheme's benefits. Maya consumes zero municipal water, opted out of services, and explicitly rejected the benefit package. Since she derives no net benefit from the cooperative grid and withheld voluntary acceptance, the necessary conditions for generating an obligation are absent. Her disobedience is therefore not a breach of duty under this theory.

  Under the **natural duty of justice**, Maya's disobedience is *pro tanto* wrong. This duty requires supporting reasonably just institutions independently of voluntary acceptance or personal benefit. The scenario stipulates the scheme is democratically enacted, reasonably just, and compliance imposes no unreasonable cost (merely brown grass). Because the duty binds regardless of benefit or consent, Maya violates her political obligation by breaking the law, even if her protest is morally justified all-things-considered. The duty to comply exists; she simply overrides it for higher moral reasons.

  **Part 4: Decisive Feature and Objections**

  The decisive feature driving the divergence is **Maya's separation from the scheme's benefits**. Fair-Play is voluntarist and benefit-dependent; Natural Duty is universalist and benefit-independent. If this feature is reversed (Maya uses city water), Fair-Play would also bind her. If the institution were unjust (e.g., discriminatory bans), Natural Duty would not bind her.

  A **Fair-Play defender** might object that Maya benefits from general social stability or property values maintained by the scheme, arguing "benefit" should include non-excludable goods. To rescue the verdict, they must narrow "benefit" to direct scheme participation, otherwise, the theory collapses into Natural Duty. A **Natural Duty defender** might object that justice *requires* protesting loopholes, so compliance isn't the duty. To rescue the verdict, they must distinguish the *duty to comply* from *all-things-considered justification*, maintaining that breaking the law is still a moral cost requiring justification, preserving the theory's constraint on disobedience.
