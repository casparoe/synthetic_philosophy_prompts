          *   *Rationalist Angle:* Causal connection vs. Qualitative similarity.
          *   *Follow-up:* She'll emphasize causal path. Push back: If the causal path is digital, is it different from biological reproduction?

      *   *Requirement 6: The "Best Candidate" vs. "Closest Continuer".*
          *   *Idea:* Is this just the Best Candidate theory with extra steps?
