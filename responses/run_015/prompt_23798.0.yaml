      *   *Key Features:*
          *   Comparative: Identity depends on what *else* exists (Extrinsicness).
          *   Weighted Dimensions: Physical continuity, psychological continuity, etc., have weights.
          *   Ties: If two contenders are equally close, identity fails (no branching identity).
          *   Fission: In personal identity, fission = death (technically), but we can view it "through platonic glasses" (seeing oneself in both).
