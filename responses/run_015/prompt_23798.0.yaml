      *   **Goal:** 8-10 pressing questions, not just exposition. Avoid letting her just re-explain the theory.
      *   **Specific Requirements:**
          *   At least one on the Hobbes reassembly case (equal weighting $\rightarrow$ "neither," who sets weights?).
          *   At least one on the Extrinsicness problem (dependence on unrelated rivals).
