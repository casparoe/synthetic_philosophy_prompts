answer: |-
  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name/Role]
  **DATE:** 24 October 2023
  **SUBJECT:** Specification of Desiderata for a Triage Protocol Based on the Means/Side-Effect Distinction

  ### 1. Introduction

  The Committee is tasked with drafting a written protocol for triage decisions in mass-casualty incidents (MCI). The specific ethical challenge is to codify a distinction between bringing about a patient's death as a *means* to save others (impermissible) and bringing it about as a *foreseen side-effect* (potentially permissible). This distinction is the engine of the Doctrine of Double Effect (DDE).

  The operational constraints are severe. The decision must be made in approximately ninety seconds by whoever is on shift. The protocol must be codifiable: a nurse or junior doctor must be able to apply it without introspecting about her own mental states. The decision must subsequently be reviewable by an auditor who was not in the room.

  We face a category error. The classical DDE is a first-personal defence of conscience, relying on the agent's intention. A protocol is a third-personal regulatory instrument, relying on observable compliance. To bridge this gap, we must specify exactly what an account of the intended/foreseen distinction must achieve to function in this context. Below I set out the desiderata such an account must satisfy, followed by an analysis of their compatibility.

  ### 2. Desiderata for the Protocol

  For an account of the means/side-effect distinction to be usable in this protocol, it must satisfy the following requirements. I have marked each as either **Non-Negotiable** (an account that fails it cannot do the job we need) or **Preference** (a desirable feature that reflects one way of thinking about these cases).

  **2.1. Case-Pair Fidelity**
  *The Requirement:* The account must yield verdicts on standard philosophical case-pairs that align with the Committee's considered moral intuitions. Specifically:
  *   **Bystander at the Switch vs. Man on the Footbridge:** Redirecting a threat is permissible; pushing a man to stop it is not.
  *   **Looped Track:** If the man on the track is necessary to stop the trolley (the loop), is this impermissible?
  *   **Terror Bombing vs. Tactical Bombing:** Destroying a munitions factory (foreseeing civilian death) is permissible; bombing civilians to demoralise the enemy is not.
  *   **Craniotomy vs. Hysterectomy:** Crushing a fetal skull to empty the pelvis is impermissible; removing a cancerous womb containing a fetus is permissible.
  *   **Weight of Intuitions:** **Preference.**
  *   **Rationale:** These cases are the testing ground of the distinction. However, we must note that an account that reproduces these verdicts *by construction* has been reverse-engineered rather than derived. If the protocol simply lists these outcomes without a guiding principle, it offers no guidance for novel clinical cases. Furthermore, in an MCI context, the 'Footbridge' intuition (do not sacrifice one to save five) may conflict with triage norms (allocate resources to those most likely to survive). We cannot assume these intuitions carry absolute weight in a hospital disaster scenario.

  **2.2. Descriptive Robustness**
  *The Requirement:* The verdict must not depend on how finely the act is described. One and the same bodily movement can be described as 'redirecting a threat', 'saving five', or 'killing one'. A protocol that returns different verdicts depending on which description the auditor happens to pick is of no use.
  *   **Status:** **Non-Negotiable.**
  *   **Rationale:** If the permissibility of the act turns on whether the auditor classifies the movement as 'withdrawing ventilation' or 'causing death', the protocol is arbitrary. The moral status must attach to the structure of the agency, not the linguistic label applied post hoc.

  **2.3. Third-Personal Codifiability and Auditability**
  *The Requirement:* The distinction must be applicable without access to the agent's private mental states. The classical formulation turns on what the agent *intends*, which is precisely what an auditor cannot see. The protocol must rely on observable features of the situation or the action.
  *   **Status:** **Non-Negotiable.**
  *   **Rationale:** This is the core constraint of the project. An audit based on "what the clinician was thinking" is impossible. If the protocol requires the clinician to swear an oath about her intention, it invites perjury. If it requires the auditor to guess her intention, it invites bias. The criterion must be externalisable.

  **2.4. Resistance to Laundering**
  *The Requirement:* The protocol must prevent a clinician who has read it in advance from arranging her deliberations so that the death falls on the 'merely foreseen' side. She must not be able to 'game' the protocol by mentally reframing her goal.
  *   **Status:** **Non-Negotiable.**
  *   **Rationale:** If a clinician can make an impermissible act permissible simply by telling herself "I am saving the five" rather than "I am killing the one", the distinction collapses into consequentialism. The protocol must bind the agent's reasoning, not just her report of it.

  **2.5. Separation of Permissibility and Blameworthiness**
  *The Requirement:* The account must distinguish between whether an act is allowed and whether the agent is praiseworthy. In motive cases, where the causal structure is one the protocol permits but the agent acts for a bad reason (e.g., she saves the five because she hates the one), the act must remain permissible, even if she is blameworthy.
  *   **Status:** **Non-Negotiable.**
  *   **Rationale:** In an MCI, we need to know if the *action* was compliant with hospital policy. The clinician's private animus is a matter for disciplinary proceedings, not for the validity of the triage decision. If bad motives render the act impermissible, we cannot audit the act without auditing the soul.

  **2.6. Probabilistic Causation**
  *The Requirement:* The account must handle cases where the causal contribution of the death is merely probabilistic. Consider a shunt that has a one-in-three chance of holding, with the five saved only if it holds. Is the risk imposed on the one a 'means' or a 'side-effect'?
  *   **Status:** **Non-Negotiable.**
  *   **Rationale:** Medicine is inherently probabilistic. A protocol that only works with certainties (the trolley *will* kill the five) fails in the ICU. We must be able to classify risk-imposition.

  **2.7. Causal Relevance and Ballast**
  *The Requirement:* The account must distinguish between cases where the death is causally necessary as a means, and cases where the death is causally necessary but as ballast, counterweight, or energy source (e.g., using a body to block a flood). It must also handle cases where the death turns out to have been causally irrelevant because a back-up mechanism would have saved the five anyway.
  *   **Status:** **Preference.**
  *   **Rationale:** This touches on the metaphysics of causation. While philosophically significant, for the purpose of a triage protocol, the focus is on the *plan* adopted. However, if the protocol relies on 'causal necessity', it must specify whether this is counterfactual or actual.

  **2.8. Multi-Agent and Overdetermination**
  *The Requirement:* The account must handle outcomes that would have come about without this clinician's act at all, or that are produced jointly by two people each of whom does only part of what kills.
  *   **Status:** **Non-Negotiable.**
  *   **Rationale:** MCIs are team efforts. If Nurse A disconnects the ventilator and Doctor B allocates it, who intends the death? If the patient would have died from his injuries regardless of the triage decision, does the distinction still apply? The protocol must assign responsibility in a chain of command.

  **2.9. Evidence vs. Outcome (Ex Ante vs. Ex Post)**
  *The Requirement:* The verdict must be fixed by the agent's evidence at the time, not by how things actually turn out. If the shunt in fact fails, was the act impermissible?
  *   **Status:** **Non-Negotiable.**
  *   **Rationale:** An auditor judging a clinician based on luck is unjust. If the clinician acted on the best available evidence that the one would die to save the five, but the five died anyway, the ethical status of the decision should not retroactively change. The protocol must judge the decision, not the result.

  **2.10. Clinical Generalisability**
  *The Requirement:* The account must not be a theory of trolleys only. It must say something determinate about the cases a hospital actually faces: palliative sedation, withdrawal of treatment, allocation of scarce ventilators, the use of one patient's data or body to calibrate a treatment for others. It must be usable by people who have never heard of a trolley problem.
  *   **Status:** **Non-Negotiable.**
  *   **Rationale:** The ultimate test. If the protocol requires the clinician to map her situation onto a thought experiment, it will fail in the ninety-second window. It must map onto clinical actions (e.g., "withdrawing life-sustaining treatment to allocate to a patient with higher survival probability").

  ### 3. The Collisions: Incompatible Requirements

  You asked me to identify which pairs of requirements on this list cannot be jointly satisfied. I believe there are two fundamental collisions that threaten the viability of this project.

  **3.1. The Auditability Collision (Desiderata 2.3 vs. 2.1 & 2.4)**
  There is a direct conflict between **Third-Personal Codifiability (2.3)** and the core logic of the **Means/Side-Effect Distinction (implicit in 2.1 and 2.4)**.

  The classical DDE turns on intention. Intention is a first-personal mental state. To make it auditable (2.3), we must infer intention from external behaviour. However, once we infer intention from behaviour, we are no longer judging the *intention*; we are judging the *act description*.
  *   If we define 'means' objectively (e.g., "the death is causally necessary for the rescue"), we satisfy auditability. But this fails **Resistance to Laundering (2.4)**. A clinician can causally necessitate a death but frame it in her mind as a side-effect. If the protocol ignores her mind to satisfy the auditor, it allows laundering. If the protocol tries to police her mind, it violates auditability.
  *   If we define 'means' subjectively (e.g., "the death is part of her plan"), we satisfy the philosophical distinction. But this violates **Third-Personal Codifiability (2.3)**. The auditor cannot see the plan, only the action.

  *Verdict:* You cannot have a protocol that is both strictly auditable by a third party and faithful to the first-personal nature of intention. One must give. If you prioritise auditability, you collapse DDE into a rule about causal structures (which often yields the 'wrong' verdicts on the Footbridge case). If you prioritise the distinction, you lose auditability.

  **3.2. The Description Collision (Desiderata 2.2 vs. The Nature of the Distinction)**
  There is a conflict between **Descriptive Robustness (2.2)** and the **Means/Side-Effect Distinction itself**.

  The distinction is *inherently* description-sensitive. Whether a death is a means or a side-effect depends on how the agent conceptualises the act.
  *   Example: In the Craniotomy case, is the act 'crushing the skull' (means) or 'emptying the pelvis' (goal, with death as side-effect)? The DDE says the former description is the morally relevant one.
  *   However, **Descriptive Robustness (2.2)** demands that the verdict *not* change based on description.
  *   If the protocol says "It depends on whether the death was a means," the auditor must then decide how to describe the act. If the auditor describes it as 'saving the five', the death is a side-effect. If she describes it as 'killing the one', it is a means.
  *   To satisfy 2.2, the protocol must specify *which* description is the correct one. But specifying the correct description *is* making the moral judgement. The protocol cannot rely on the distinction to make the judgement if it must first make the judgement to fix the description.

  *Verdict:* You cannot demand that the verdict be independent of act description while using a distinction that relies entirely on act description.

  **3.3. The Prejudice Check**
  You asked me to mark any item on the list that is really a prejudice of one camp dressed up as a desideratum.

  **Case-Pair Fidelity (2.1)** regarding the **Man on the Footbridge** is the primary suspect.
  *   *The Prejudice:* The intuition that it is impermissible to push the man off the footbridge is a deontological prejudice. In the context of a hospital MCI, we *already* accept protocols that effectively sacrifice the one for the many (e.g., tagging a patient 'Expectant' so resources go to those with better prognoses).
  *   *The Conflict:* If we build a protocol that strictly honours the Footbridge intuition (do not intentionally cause death to save others), we may be unable to justify active triage decisions that hasten death to save resources for others.
  *   *Recommendation:* Treat the Footbridge intuition as a **Preference**, not a Non-Negotiable. In a clinical disaster, the duty to the collective may override the duty to the individual in ways that the Footbridge case does not capture. Insisting on this intuition may render the protocol useless for the very MCI scenarios it is designed for.

  **3.4. The Exclusionary Requirement**
  Which single requirement does the most work in excluding candidate accounts?
  **Third-Personal Codifiability (2.3).**
  This requirement excludes the Classical DDE, the Reasons/Motives reading, and any account that relies on the agent's internal deliberation. It forces the account to be external, behavioural, or causal. This is the filter that makes the project difficult.

  **3.5. Is a Coherent Account Possible?**
  Does any coherent account satisfy all of the Non-Negotiable ones?
  **No.**
  As argued in 3.1 and 3.2, the demand for third-personal auditability is logically incompatible with a distinction that relies on first-personal intention and act-description. A protocol of the kind you are drafting *cannot* be built on the intended/foreseen distinction without sacrificing either auditability or the moral nuance of the distinction.

  **3.6. What to Put in Its Place**
  If the honest conclusion is that a protocol of this kind cannot be built on this distinction, what should you put in its place?
  You should abandon the DDE framework for the Triage Protocol. Instead, adopt a **Scarcity and Duty of Care Framework**.
  *   **Basis:** Decisions are justified not by the intention/foresight distinction, but by the duty to steward scarce resources to maximise survival (Utility) constrained by rights-based prohibitions against *active killing* (e.g., lethal injection).
  *   **Mechanism:** Focus on *actions* (withdrawing vs. administering) and *prognosis* (likelihood of survival), rather than mental states.
  *   **Audit:** The auditor checks if the prognosis was accurate and if the action followed the allocation algorithm, not whether the death was 'intended'.

  ### 4. Scorecard of Live Options

  Below is an assessment of five ethical frameworks against the Non-Negotiable desiderata (specifically Auditability, Anti-Laundering, and Clinical Generalisability).

  **4.1. The Classical Four-Condition Doctrine of Double Effect**
  *   *Mechanism:* An act is permissible if the act itself is good/neutral, the bad effect is not intended, the good effect is not produced by the bad effect, and there is proportionality.
  *   *Performance:* Fails **Third-Personal Codifiability**. It relies entirely on the agent's intention. An auditor cannot verify this without mind-reading. It also fails **Resistance to Laundering**, as a clinician can mentally reframe any act to satisfy the 'no intention' condition.
  *   *Verdict:* **Unusable.** It is a defence for a court or a conscience, not a protocol for a shift manager.

  **4.2. Counterfactual-Dependence or 'Means' Test**
  *   *Mechanism:* A death is a 'means' if the good outcome would not have occurred *without* the causal contribution of the death (e.g., the trolley stops *because* it hit the man).
  *   *Performance:* Satisfies **Third-Personal Codifiability** (causal chains are observable). Satisfies **Descriptive Robustness** (physics is description-independent). However, it often fails **Case-Pair Fidelity**. In the Loop Track case, the man is causally necessary, so this test deems it impermissible, matching the intuition. But in clinical cases (e.g. separating conjoined twins), causal dependence is often mutual, leading to paralysis. It also struggles with **Probabilistic Causation**.
  *   *Verdict:* **Viable but Crude.** It offers auditability but may prohibit necessary triage actions where the death is causally linked to the rescue.

  **4.3. Rights- or Agency-Based Reconstruction**
  *   *Mechanism:* Replaces intentions with an account of what the agent is *doing to* the person. Is she using the patient as a resource? Is she violating a right not to be interfered with?
  *   *Performance:* Strong on **Clinical Generalisability** (focuses on the patient-clinician relationship). Stronger on **Case-Pair Fidelity** than the causal test. However, it struggles with **Third-Personal Codifiability**. Determining whether a patient is being 'used' often requires interpreting the clinician's plan, which circles back to intention.
  *   *Verdict:* **Promising.** If 'using' can be defined objectively (e.g., 'invasive procedure on a non-consenting patient for another's benefit'), this could work. It requires precise definition of 'invasive' and 'benefit'.

  **4.4. Threshold or Scalar Consequentialism**
  *   *Mechanism:* Abandons the distinction. The act is permissible if the good outweighs the bad by a sufficient margin.
  *   *Performance:* Perfect on **Third-Personal Codifiability** and **Descriptive Robustness**. Perfect on **Clinical Generalisability** (matches standard triage logic). Fails **Case-Pair Fidelity** (would permit pushing the man off the footbridge). Fails the Committee's implicit desire to maintain a deontological constraint against 'killing'.
  *   *Verdict:* **Most Functional.** If the Committee is willing to admit that in an MCI, saving lives trumps the means/side-effect distinction, this is the only coherent option. It removes the hypocrisy of trying to audit mental states.

  **4.5. A Reading Based on Agent's Reasons or Motives**
  *   *Mechanism:* Permissibility depends on whether the clinician acted for the right reason (e.g., 'to save lives' vs 'to kill').
  *   *Performance:* Fails **Third-Personal Codifiability** completely. Fails **Resistance to Laundering** completely.
  *   *Verdict:* **Discard.** This is purely for moral education, not for operational protocol.

  ### 5. Conclusion and Recommendation

  The Committee is attempting to solve a resource allocation problem with a tool designed for moral exculpation. The Doctrine of Double Effect is ill-suited for a codified, auditable protocol because its central criterion (intention) is inaccessible to the auditor and vulnerable to manipulation by the agent.

  The collision between **Auditability** and **Intentionality** is not a practical hurdle but a logical impossibility. You cannot audit a mental state. If you attempt to do so, you will either end up auditing the *outcome* (consequentialism) or the *physical description of the act* (deontology of action), neither of which is the DDE.

  **Recommendation:**
  1.  **Abandon the Intention/Foresight Distinction** for the operational protocol. It cannot be made robust enough for audit.
  2.  **Adopt a Rights-Constrained Consequentialist Framework.** The protocol should state that in an MCI, resources are allocated to maximise survival (Consequentialism), *unless* this requires actively killing a patient or using their body as a resource without consent (Rights Constraint).
  3.  **Focus on Action Types.** Distinguish between *withdrawing* treatment (permissible when resources are scarce) and *administering* lethal treatment (impermissible). This is observable and auditable.
  4.  **Treat 'Intention' as a Matter of Training, Not Protocol.** Train clinicians to understand that their focus must be on saving the many, not on the death of the one. But do not make their internal focus the subject of the audit.

  This approach satisfies the need for a bright line (Non-Negotiable 2.3) while acknowledging the reality of MCI triage (Non-Negotiable 2.10), without pretending we can legislate the contents of a clinician's mind.

