prompt: |-
  I sit on the clinical ethics committee of a large teaching hospital, and we are drafting a written protocol for triage decisions in a mass-casualty incident — the sort of situation in which a course of action that will foreseeably bring about a patient's death is nonetheless the only way to save several others, and in which the decision has to be taken in about ninety seconds by whoever happens to be on shift. The protocol has to be codifiable: a nurse or a junior doctor must be able to read it, apply it without introspecting about her own mental states, and have her decision afterwards reviewed by an auditor who was not in the room and who must be able to say whether the protocol was followed.

  What we keep circling around is the distinction the doctrine of double effect turns on — between a death a clinician brings about as a means and one she merely foresees — but every formulation we have tried is either too vague to be audited or too crude to match the verdicts we are confident about. So before we argue about formulations, I want the specification.

  Write the desiderata that any adequate account of the intended/foreseen — or means/side-effect — distinction has to satisfy in order to be usable in a protocol like ours. For each requirement, give the case or consideration that makes it a requirement, and mark it as non-negotiable (an account that fails it cannot do the job we need) or as a preference of one way of thinking about these cases. I would like the list to include, at least, requirements concerning:

  - the standard case-pairs from the philosophical literature — the bystander at the switch and the driver who steers, the man on the footbridge, the looped track, the surgeon with the healthy patient, terror bombing against tactical bombing, craniotomy against hysterectomy — together with a note on how much weight the intuitive verdicts on these really carry, and on whether an account that reproduces them by construction has thereby been reverse-engineered rather than derived;
  - robustness to how finely the act is described, since one and the same bodily movement is 'redirecting a threat', 'saving five', and 'killing one', and a protocol that returns different verdicts depending on which description the auditor happens to pick is of no use to us;
  - third-personal codifiability and auditability, given that the classical formulation turns on what the agent intends, which is precisely what an auditor cannot see;
  - resistance to laundering — the clinician who has read the protocol in advance and arranges her deliberations so that the death falls on the 'merely foreseen' side;
  - the motive cases, in which the causal structure is one the protocol permits but the agent acts for a bad reason, and the requirement that permissibility be kept apart from blameworthiness or praise;
  - cases in which the causal contribution of the death is merely probabilistic — a shunt that has a one-in-three chance of holding, with the five saved only if it holds;
  - cases in which the death seems causally necessary but as ballast, counterweight, or energy source rather than as a means to anything, and cases in which the death turns out to have been causally irrelevant because a back-up mechanism would have saved the five anyway;
  - multi-agent and overdetermined cases: the outcome that would have come about without this clinician's act at all, or that is produced jointly by two people each of whom does only part of what kills;
  - whether the verdict is fixed by the agent's evidence at the time or by how things actually are — the shunt that in fact fails;
  - the requirement that the account not be a theory of trolleys only: it must say something determinate about the cases a hospital actually faces — palliative sedation, withdrawal of treatment, allocation of scarce ventilators, the use of one patient's data or body to calibrate a treatment for others — and it must be usable by people who have never heard of a trolley problem.

  Then, and this is the part I most want: tell me which pairs of requirements on your own list you think cannot be jointly satisfied. I expect at least one real collision between auditability and the first-personal character of the distinction, and I suspect a second between fine grain on the means/side-effect continuum and the bright lines a protocol needs. If you think I am wrong about either, say why; if you find a collision I have not named, name it. Also mark any item on your list that you think is really a prejudice of one camp dressed up as a desideratum — if, for instance, you think matching the intuitive verdict about the man on the footbridge is simply deontology helping itself to its conclusion, say so. Tell me which single requirement does the most work in excluding candidate accounts, whether any coherent account satisfies all of the non-negotiable ones, and — if the honest conclusion is that a protocol of the kind we are drafting cannot be built on this distinction at all — what we should put in its place.

  Finish with a brief scorecard, no more than a short paragraph each, for four or five live options: the classical four-condition doctrine of double effect; a counterfactual-dependence or 'means' test; a rights- or agency-based reconstruction that replaces intentions with an account of what the agent is doing to the person; a threshold or scalar consequentialism that abandons the distinction; and a reading that puts the weight on the agent's reasons or motives. Keep the weight firmly on the criteria rather than on the scoring.

  Aim for something I could circulate as a five- to eight-page committee paper. Please write in British English, and use 'she' throughout for the clinician.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Member of a clinical ethics committee at a large teaching hospital.
      *   **Task:** Drafting a written protocol for triage decisions in mass-casualty incidents (MCI).
      *   **Problem:** They are struggling with the Doctrine of Double Effect (DDE), specifically the intended/foreseen (means/side-effect) distinction. Current formulations are too vague for auditing or too crude for moral nuance.
      *   **Goal:** Write a list of *desiderata* (requirements) that any adequate account of this distinction must satisfy to be usable in their protocol. Then, identify conflicts between these requirements. Finally, scorecard live options.
      *   **Specific Constraints:**
          *   British English.
          *   Use 'she' for the clinician.
          *   Length: Equivalent to a 5-8 page committee paper (roughly 2,500 - 4,000 words, though "page count" is fluid in text generation, I need to aim for substantial depth and density).
          *   Tone: Professional, analytical, philosophical but practical (committee paper style).
          *   Specific Content Requirements:
              *   Standard case-pairs (Trolley variants, Bombing, Surgery).
              *   Robustness to act description.
              *   Third-personal codifiability/auditability.
              *   Resistance to laundering (gaming the system).
              *   Motive vs. Permissibility.
              *   Probabilistic causation.
              *   Causal irrelevance/ballast cases.
              *   Multi-agent/overdetermination.
              *   Evidence vs. Outcome (ex post vs. ex ante).
              *   Clinical applicability (not just trolleys).
              *   Identify conflicts/impossibilities between desiderata.
              *   Identify prejudices disguised as desiderata.
              *   Scorecard of 4-5 ethical frameworks.

  2.  **Deconstruct the Core Tension:**
      *   The user is asking for the impossible: a *subjective* mental state distinction (intention) to be rendered *objective* and *auditable* for a protocol.
      *   DDE relies on *mens rea* (state of mind). Auditing relies on *actus reus* (observable action/outcome).
      *   The prompt explicitly asks me to highlight where these collide.
      *   The context is *triage in MCI*. This is crucial. Triage is usually utilitarian/consequentialist (save the most lives), whereas DDE is often deontological (do not kill intentionally). There is a fundamental friction here. Triage protocols usually *do not* rely on DDE; they rely on scarcity and utility. However, the committee *wants* to use DDE to justify hard choices (e.g., withdrawing ventilation from one to give to another). I need to address whether DDE is the right tool for this job while fulfilling the prompt's request to specify the desiderata for *if* they use it.

  3.  **Drafting the Desiderata (Section 1):**
      *   *Requirement 1: Case-Pair Fidelity.* Needs to handle the standard philosophical examples. *Status:* Preference (intuitions vary). *Note:* Warn against reverse-engineering.
      *   *Requirement 2: Descriptive Robustness.* The verdict shouldn't change if the auditor describes the act differently ("killing" vs "saving"). *Status:* Non-negotiable.
      *   *Requirement 3: Third-Personal Codifiability.* Must be auditable without mind-reading. *Status:* Non-negotiable (for the protocol's purpose).
      *   *Requirement 4: Anti-Laundering.* Cannot allow the clinician to game the distinction by tweaking their internal monologue. *Status:* Non-negotiable.
      *   *Requirement 5: Motive/Permissibility Separation.* Bad motives shouldn't make a permissible act impermissible, though they might affect blame. *Status:* Non-negotiable (conceptual clarity).
      *   *Requirement 6: Probabilistic Causation.* Needs to handle risk/chance, not just certainty. *Status:* Non-negotiable (medicine is probabilistic).
      *   *Requirement 7: Causal Relevance/Ballast.* Distinguish between using a body as a means vs. a causal obstacle vs. irrelevant. *Status:* Preference (philosophical nuance).
      *   *Requirement 8: Multi-Agent/Overdetermination.* What if two doctors act? What if the patient would have died anyway? *Status:* Non-negotiable (MCI involves teams).
      *   *Requirement 9: Evidence vs. Outcome.* Ex ante (what she knew) vs. Ex post (what happened). *Status:* Non-negotiable (audit must be fair).
      *   *Requirement 10: Clinical Generalisability.* Must work for palliative care, ventilation, etc., not just trolleys. *Status:* Non-negotiable.

  4.  **Analyzing Conflicts (Section 2):**
      *   *Conflict A: Codifiability vs. Intentionality.* This is the big one. Intention is internal. Audit is external. You can infer intention from action, but that collapses intention into outcome (consequentialism) or description (deontology of action).
      *   *Conflict B: Descriptive Robustness vs. Means/Side-Effect Distinction.* The distinction *depends* on description. If I describe the act as "removing the kidney," it's a means. If I describe it as "harvesting for transplant," it's a means. If I describe it as "saving five," the death is a side effect. The distinction is *inherently* description-sensitive. Demanding robustness here might kill the distinction.
      *   *Conflict C: Intuitions vs. Clinical Reality.* The "Footbridge" intuition might be a prejudice. In MCI, we *do* sacrifice one for many (triage). If the protocol matches the Footbridge intuition (don't push), it might fail the Clinical Generalisability requirement (we need to allocate scarce resources which effectively 'kills' the one).
      *   *Identification of Prejudice:* The weight given to the "Footbridge" intuition is likely a deontological prejudice. In a hospital MCI, we *must* prioritize the many.

  5.  **Drafting the Scorecard (Section 3):**
      *   *Classical DDE:* Fails auditability.
      *   *Counterfactual Dependence:* Good for audit, but might classify too much as 'means'.
      *   *Rights/Agency:* Good for moral weight, hard to codify.
      *   *Threshold Consequentialism:* Abandons the distinction, solves auditability, but loses the deontological constraint the committee seems to want.
      *   *Reasons/Motives:* Fails auditability completely.

  6.  **Refining the Argument & Tone:**
      *   The tone must be respectful but firm. The user is asking for a square circle. I need to tell them that politely.
      *   British English spelling (codifiable, programme, centre, etc.).
      *   Pronoun: 'she' for clinician.
      *   Structure: Introduction -> Desiderata -> Conflicts/Impossibilities -> The Prejudice Check -> Scorecard -> Conclusion/Recommendation.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "reverse-engineering" point? *Yes, in Desideratum 1.*
      *   *Check:* Did I address the "laundering" point? *Yes, in Desideratum 4.*
      *   *Check:* Did I identify the collision between auditability and first-personal character? *Yes, this is the core conflict.*
      *   *Check:* Is the length appropriate? *Need to ensure sufficient elaboration on each point to meet the "5-8 page" feel (dense text).*
      *   *Check:* Did I answer the specific question: "what we should put in its place" if DDE fails? *Yes, need to suggest a Triage-Specific framework (e.g., Utility + Rights constraints) rather than DDE.*

  8.  **Final Polish:**
      *   Ensure the distinction between 'Non-negotiable' and 'Preference' is clear.
      *   Make sure the "Scorecard" is brief but punchy.
      *   Verify the conclusion offers a constructive path forward (shifting from DDE to a Triage Protocol based on scarcity and duty of care).

  *(Self-Correction on Length)*: A 5-8 page committee paper is roughly 2,500 to 3,500 words depending on formatting. I need to ensure I don't write too little. I will expand on the *rationale* for each desideratum to ensure depth.

  *(Self-Correction on Content)*: The prompt asks for "Which single requirement does the most work in excluding candidate accounts". I need to be explicit about this. Likely "Third-personal codifiability".

  *(Self-Correction on Conflicts)*: The prompt asks to identify pairs of requirements that cannot be jointly satisfied. I need to be very clear about *why* they conflict logically, not just practically.

  Let's assemble the document.

  *Structure:*
  1.  **Header:** To, From, Date, Subject.
  2.  **Introduction:** Contextualise the task and the tension.
  3.  **Part I: The Desiderata:** List and explain the 10 requirements.
  4.  **Part II: The Collisions:** Analyze the incompatibilities.
  5.  **Part III: The Prejudice Check:** Address the Footbridge intuition.
  6.  **Part IV: Scorecard:** Evaluate the 5 options.
  7.  **Conclusion:** Recommendation.

  *Language:* British English (e.g., 'codifiable', 'programme', 'analyse', 'defence'). 'She' for clinician.

