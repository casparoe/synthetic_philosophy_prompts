  IWL (Independence of Withdrawn Losers) is strictly weaker than IIA; IIA implies IWL, but not vice versa. A rule satisfying Pareto, Non-dictatorship, Completeness, Transitivity, and IWL exists: **Pareto-Respecting Fixed Order**. Order candidates by a fixed reference (e.g., alphabetical) unless unanimity overrides a pair. This yields a transitive order, respects Pareto, is non-dictatorial, and satisfies IWL (removing the socially last candidate, who is last by fixed order or unanimity, leaves the remainder ordered by the same fixed/unanimity logic).

