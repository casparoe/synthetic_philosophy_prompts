  A Borda defender argues IIA is too strict for rules capturing intensity. Borda respects that ranking C second (V4,5) signals weaker preference for B than ranking C last. The cost is context-dependence: the "value" of A vs. B depends on how C is positioned. This violates the Arrowian notion that social choice should depend only on relative pairwise rankings, not cardinal-like spacing implied by positions.

