      *Wait, one nuance:* The user asks "why can't I accelerate into a frame where yesterday is simultaneous with me".
      *Correction:* You *can* make a distant event simultaneous that another observer calls "past," but you cannot make *your own* yesterday simultaneous with your *current* location. The Rietdijk-Putnam argument usually involves distant events (Andromeda paradox). The user is conflating distant simultaneity with local time travel. I need to make sure `my_core_confusion` captures this distinction. You can change what counts as "now" on Alpha Centauri, but you can't change what counts as "now" here where you are.

