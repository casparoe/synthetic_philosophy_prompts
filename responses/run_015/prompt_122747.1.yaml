      *   User thinks it's the Ratchet one.
      *   *Argument:* The Quantum one is technically deeper but less likely to derail a soft-matter seminar. The Ratchet one is central to soft-matter (autonomous transport). If the theory doesn't cover ratchets, it's not a theory of soft-matter demons.
      *   *Verdict:* Stick with the User's intuition. The Ratchet question is the "Fear Question" because it exposes the "homunculus" assumption.

