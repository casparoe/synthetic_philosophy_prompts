          *   *EC:* Tricky. "Knew" is indexical. When I say it now, I use my current standards. If I'm relaxed now, I can say "She knew (by my current standards)." But did she know *then*? EC says she satisfied the standards *of her context then* (or the context of the person talking about her then). It requires careful handling of tense and context.
