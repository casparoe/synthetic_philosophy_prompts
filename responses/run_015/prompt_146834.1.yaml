answer: |-
  The reason you keep losing the thread is that the "notational variant" summary is indeed misleading. It treats the debate as merely geographical: *where* do we locate the variable that shifts the truth value? (In the speaker's mouth? Or in the subject's wallet?)

  But the debate is actually architectural. It is a disagreement about **what kind of property knowledge is** and **what the word "knows" does**.

  *   **Epistemic Contextualism (EC)** claims that "knows" is semantically incomplete, like "tall" or "ready." It picks out different relations in different conversational contexts. The *epistemology* remains pure (knowledge depends only on truth, belief, and evidence), but the *semantics* is shifty.
  *   **Pragmatic Encroachment (PE)** (often technically called Subject-Sensitive Invariantism) claims that "knows" picks out a single, stable relation. However, that relation itself is partly constituted by practical facts. The *semantics* is stable, but the *epistemology* is impure (knowledge depends on evidence + practical adequacy).

  This distinction matters because it means the two views are not merely attaching a parameter to different coordinates; they are making different predictions about **error** and **contradiction**. Contextualism says one party is speaking truly and the other is also speaking truly (about a different proposition). Encroachment says one party is speaking truly and the other is speaking falsely (about the same proposition).

  Here is the difference worked out on your cases, followed by the structural questions.

  ---

  ### Part 1: The Three Cases

  Let $p$ = "The bridge is open."
  **Low-Stakes Driver (L):** Picnic. Evidence $E$.
  **High-Stakes Driver (H):** Emergency. Evidence $E$.
  **Attributor:** The person saying "L knows" or "L does not know."

  #### Case 1: The High-Stakes Driver attributes knowledge to the Low-Stakes Driver
  H is asked: "Does L know that the bridge is open?" H denies it: "No, L doesn't know."

  *   **Pragmatic Encroachment:**
      *   **Mechanism:** Knowledge depends on the *subject's* (L's) stakes.
      *   **Analysis:** L is the subject of the attribution. L has low stakes. Given evidence $E$, L meets the threshold for low stakes. Therefore, L knows $p$.
      *   **Prediction:** H's statement ("L does not know") is **false**. H is making a mistake about L's epistemic position because H is projecting her own stakes onto L.
  *   **Contextualism:**
      *   **Mechanism:** The truth of "L knows" depends on the *attributor's* (H's) conversational standards.
      *   **Analysis:** H is in a high-stakes situation. This raises the semantic standard for "knows" in H's mouth. To truthfully say "L knows" in H's context, L must meet *high* standards. L does not meet high standards (given $E$). Therefore, "L knows" is false in H's context.
      *   **Prediction:** H's statement ("L does not know") is **true**. H correctly reports that L fails to satisfy the standard relevant to H's conversation.

  **The Load-Bearing Difference:** PE says H is *wrong* about L. EC says H is *right* about L (relative to H's context). This is not a notational shift; it is a disagreement about whether H is making an error.

  #### Case 2: The Third Party and the Unknown Action
  **Third Party (T):** Has hazy evidence for $p$. No personal stake.
  **Actor (A):** Will act on T's say-so. Life/Death stakes for A. T does not know A will act.
  **Question:** Does T know $p$?

  *   **Pragmatic Encroachment:**
      *   **Mechanism:** Knowledge is the norm of *practical reasoning*.
      *   **Analysis:** This is a stress point for PE. Does the "practical situation" belong to the believer (T) or the user of the belief (A)?
          *   *Strict PE:* Stakes attach to the subject (T). T has no stakes. T knows (if evidence suffices for low stakes).
          *   *Norm-Based PE:* Knowledge is what licenses *action*. If T's belief is the premise for A's action, the stakes of the action matter. If so, the stakes are high. T's evidence is hazy. T does not know.
      *   **Prediction:** Ambiguous. If PE binds stakes to the subject's desires, T knows. If PE binds stakes to the action guided by the belief, T does not know.
  *   **Contextualism:**
      *   **Mechanism:** Standards are set by the attributor's context.
      *   **Analysis:** Who is asking?
          *   *If we (philosophers) ask:* We have no stakes. Standards are low. T knows.
          *   *If A asks (before acting):* A has high stakes. Standards are high. T does not know.
      *   **Prediction:** There is no fact of the matter independent of who is asking.
  *   **The "Norm of Deliberation" Constraint:** You asked what a view must say if knowledge is "what makes a proposition strong enough to serve as a premise."
      *   **PE** handles this naturally *if* it allows stakes to transfer from actor to believer. If knowledge is the license to act, and T is licensing A, T must meet A's stakes.
      *   **EC** handles this by saying A (the attributor/actor) is entitled to demand higher standards of T. But EC implies T *did* know relative to a low-stakes attributor, which seems to undermine the idea that knowledge is the *objective* norm of action.

  #### Case 3: Unappreciated Catastrophic Stakes
  **Subject (S):** Believes $p$ (Bridge is open). Thinks stakes are low (Picnic).
  **Reality:** Error is catastrophic (Bomb on bridge). S is unaware of the bomb.
  **Question:** Does S know $p$?

  *   **Pragmatic Encroachment:**
      *   **Mechanism:** Stakes determine the threshold.
      *   **Analysis:** Are stakes *objective* (actual risk) or *subjective* (appreciated risk)?
          *   *Objective Stakes:* The risk is high. S needs more evidence. S doesn't have it. S does **not** know.
          *   *Subjective Stakes:* S rationally believes stakes are low. S meets that threshold. S **knows**.
      *   **Prediction:** Most PE proponents favor *Objective Stakes*. This leads to the **Opacity Problem**: S can lose knowledge without any change in her evidence or her rational perspective, simply because the world became more dangerous unbeknownst to her.
  *   **Contextualism:**
      *   **Mechanism:** Attributor's context sets standards.
      *   **Analysis:** Does the attributor know about the bomb?
          *   *Attributor Ignorant:* Standards are low. "S knows" is true.
          *   *Attributor Aware:* Standards are high. "S knows" is false.
      *   **Prediction:** Knowledge is not opaque to the attributor. It is sensitive to what the *speaker* knows about the stakes.
  *   **The Load-Bearing Difference:** PE (Objective) makes knowledge **world-sensitive** (you can lose knowledge because of a hidden bomb). EC makes knowledge **conversation-sensitive** (you lose knowledge only when someone talking about you becomes aware of the bomb).

  ---

  ### Part 2: Structural Questions

  #### 1. Disagreement and Retrospection
  **Scenario:** Low-stakes speaker says "She knows." High-stakes subject says "I don't know."

  *   **Disagreement:**
      *   **Contextualism:** There is **no contradiction**. The speaker asserts $K_{low}(S, p)$. The subject asserts $\neg K_{high}(S, p)$. Both can be true.
          *   *Awkward Datum:* This violates the phenomenology of disagreement. It feels like we are contradicting each other. Contextualism must explain away this feeling as a pragmatic illusion (we *talk* as if we disagree, but we don't).
      *   **Pragmatic Encroachment:** There is **genuine contradiction**. There is one proposition: $K(S, p)$. One party is true, the other false. Since the subject's stakes determine the truth, the subject is usually right (if stakes are high, she doesn't know). The low-stakes speaker is wrong.
          *   *Awkward Datum:* This makes the low-stakes speaker systematically error-prone when talking about high-stakes subjects, even if they are epistemically careful.

  *   **Retrospection:** "She knew all along, even though at the time we would have denied it."
      *   **Contextualism:** This is difficult. "Knew" is indexical. When I say "She knew" *now*, I use *my current* standards. If I am currently relaxed, I can truthfully say "She knew." But did she know *then*? Contextualism says she satisfied the standards *of the context of assessment*. If we assess her from our current low-stakes context, she knew. If we assess her from her past high-stakes context, she didn't.
          *   *Awkward Datum:* It makes past knowledge attributions unstable. Whether Caesar knew the Rubicon was crossable depends on whether *I* am currently stressed about river crossings.
      *   **Pragmatic Encroachment:** This is easy. Knowledge is a fact about the past relation between evidence and stakes. If her stakes were low then, she knew. My current standards don't change past facts.
          *   *Awkward Datum:* None here. PE handles retrospective reports naturally.

  #### 2. Directionality (The Asymmetry Problem)
  **Question:** Encroachment says high stakes destroy knowledge. Can high stakes *create* knowledge? (e.g., Cost of inquiry is so high I am entitled to believe sooner?)

  *   **The Standard View:** Encroachment is **one-directional**. Raising stakes raises the threshold for evidence. It never lowers it.
  *   **Why?** Because PE typically defines knowledge as **practical adequacy**.
      *   If the cost of error goes up, the warrant required to be "adequate" goes up.
      *   If the cost of inquiry goes up, that is a separate pragmatic factor (often called "pragmatic encroachment on justification" or "rational credence," not knowledge).
      *   Standard PE maintains that knowledge is the *norm of action*. You cannot lower the safety standard for a bridge just because fixing it is expensive. You either know it's safe or you don't.
  *   **Is there a case for two-way encroachment?**
      *   Some argue that if the cost of *withholding* belief is catastrophic (e.g., "I must believe I can jump this gap or I will freeze and die"), practical factors might lower the threshold.
      *   **However,** most PE proponents reject this. They argue that practical necessity might justify *acting as if* you know, or justify the *belief* pragmatically, but it does not constitute *knowledge*. Knowledge remains factive and evidence-sensitive.
      *   **Awkward Datum for PE:** This asymmetry looks ad hoc. Why do practical factors count against knowledge (high stakes) but not for it (high necessity)?
      *   **Contextualism's Take:** EC doesn't have this asymmetry problem because standards can theoretically go up or down based on conversational needs. But EC pays for this with the disagreement problem above.

  ---

  ### Summary of Load-Bearing Differences

  | Feature | Epistemic Contextualism | Pragmatic Encroachment |
  | :--- | :--- | :--- |
  | **Core Claim** | "Knows" is indexical (semantics vary). | "Knows" is stable; Knowledge is practical (metaphysics vary). |
  | **Parameter** | Attributor's Context (Standards). | Subject's Stakes (Practical Adequacy). |
  | **Disagreement** | Illusory (Both can be right). | Genuine (One must be wrong). |
  | **Retrospection** | Unstable (Depends on current speaker). | Stable (Depends on past facts). |
  | **Opacity** | No (Depends on what attributor knows). | Yes (Can lose knowledge due to hidden facts). |
  | **Awkward Datum** | Explains away the feeling of contradiction. | Explains away the stability of knowledge across stakes. |

  **Reconstruction Tip:** When you lose the thread, ask: **"Who is allowed to be wrong?"**
  *   If the High-Stakes driver denies knowledge to the Low-Stakes driver, **Contextualism** lets her be right (in her mouth). **Encroachment** forces her to be wrong (about the subject).
  *   If the Subject loses knowledge due to a hidden bomb, **Encroachment** accepts this (knowledge is fragile). **Contextualism** rejects this (knowledge is stable until the conversation changes).

  The choice is not about where to put the parameter. It is about whether you want to protect the **stability of the fact** (PE) or the **stability of the conversation** (EC). PE saves the idea that we are contradicting each other, at the cost of making knowledge weirdly sensitive to hidden worldly facts. EC saves the idea that knowledge tracks evidence, at the cost of making "knows" mean different things every time we speak.
