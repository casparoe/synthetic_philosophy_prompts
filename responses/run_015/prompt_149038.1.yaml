answer: |-
  This is a sharp framing. You are right to suspect that the standard undergraduate reading of *Economic Possibilities for our Grandchildren* (1930) flattens Keynes into a naive techno-optimist. The real philosophical tension lies in his moral psychology and his aesthetic commitments, which are often buried in his biographical writings, his role in the Arts Council, and his shorter political essays like *Am I a Liberal?* (1925).

  If you have six months part-time, you cannot chase every empirical rabbit hole regarding the 15-hour week. You need to settle the normative foundations. If you get the foundations wrong, the policy implications collapse.

  Here is the ranking of the upstream questions, the reasoning for the order, and the framing trap you need to avoid.

  ### 1. The Ontology of Needs: Absolute vs. Relative (The Bedrock)
  **Status:** **Most Upstream.**
  **Tractability:** High (Philosophical/Conceptual).
  **Downstream Bite:** Determines the viability of *any* post-scarcity policy.

  This is the single most critical question. Keynes's entire vision rests on the distinction between "absolute needs" (which can be satiated) and "relative needs" (which are positional and infinite). In *Economic Possibilities*, he argues that absolute needs can be solved, allowing us to ignore relative ones.

  **Why this is upstream:**
  If needs are fundamentally relative (as Fred Hirsch argued later in *Social Limits to Growth*), then scarcity is structural, not technical. You cannot solve scarcity with growth; you can only shift the locus of competition. If this is true, Keynes's vision of the "end of the economic problem" is not just optimistic; it is category-error wrong.

  **Why it's tractable:**
  You do not need econometrics to map this. You need to trace Keynes's moral psychology. Look at how he defines "need" in *The General Theory* (the propensity to consume) versus his ethical writings. Compare his definition to modern "positional goods" theory. The question is: Did Keynes believe relative needs were a *pathology* to be cured by culture, or a *fact* to be managed by economics?

  **Downstream Policy Bite:**
  *   **If Absolute:** Policy focuses on automation, UBI, and reducing work hours (supply-side liberation).
  *   **If Relative:** Policy focuses on inequality caps, luxury taxes, and curbing status competition (demand-side regulation).
  *   **Settling this changes everything:** If you conclude Keynes underestimated the stickiness of relative needs, his Arts Council model looks like a band-aid on a wound that requires structural redistribution.

  ### 2. The Telos of Leisure: Aristotelian Virtue vs. Bloomsbury Aestheticism (The Goal)
  **Status:** **Second Upstream.**
  **Tractability:** High (Textual/Intellectual History).
  **Downstream Bite:** Determines the design of cultural institutions and education.

  Once scarcity is solved (per Question 1), what is leisure *for*? This is the fight between the Aristotelian reading (leisure is for civic virtue and moral development) and the Bloomsbury reading (leisure is for states of mind, aesthetic appreciation, and personal affection).

  **Why this is upstream:**
  It dictates the justification for state intervention. Keynes was the founding chair of the Arts Council. Was this to "civilize" the masses (Aristotelian/Paternalistic) or to create environments where "states of mind" could flourish for their own sake (Bloomsbury/Autonomous)?

  Keynes was a hybrid, but the tension is unresolved. In *A Short View of Russia*, he hints at a secular religion of art. In *Am I a Liberal?*, he emphasizes individual spontaneity.

  **Why it's tractable:**
  This is pure intellectual history. Read his essays on art, his letters to Duncan Grant and Vanessa Bell, and the founding documents of the Arts Council. Compare these to Aristotle's *Nicomachean Ethics* (Book X on leisure) and G.E. Moore's *Principia Ethica* (which heavily influenced the Bloomsbury group). You are looking for the *purpose* of culture in his writing.

  **Downstream Policy Bite:**
  *   **If Aristotelian:** State funding is justified as moral education. Art must be "good for you." This risks censorship or elitism.
  *   **If Bloomsbury:** State funding is justified as creating "armchairs" for contemplation. Art is an end in itself. This risks irrelevance or decadence.
  *   **The Liberal Clash:** You asked if state funding clashes with his liberalism. It only clashes if the telos is Aristotelian (forcing virtue). If the telos is Bloomsbury (enabling states of mind), the state is merely a patron, not a tutor. Settling this tells you whether Keynes's cultural policy is compatible with a neutral liberal state.

  ### 3. The Framing Correction: Money-Love as Pathology (Not Anti-Materialism)
  **Status:** **Crucial Clarification (Not a standalone research pillar).**
  **Tractability:** Medium (Psychological/Biographical).

  You asked if you should avoid conflating his claim that money-love is a mental illness with general anti-materialism. **Yes, absolutely avoid that conflation.** It is the most common error in Keynes scholarship.

  **The Distinction:**
  Keynes was not an ascetic. He loved fine wine, art, and luxury. His critique in *The General Theory* and *Economic Possibilities* is specific: he viewed the *hoarding* of money for security (the "love of money as a possession") as a semi-criminal, semi-pathological habit inherited from a period of scarcity.

  **Why this matters for your map:**
  If you frame him as an anti-materialist, you make him a moralist preaching renunciation. If you frame him correctly (money-love as a psychological hangover from scarcity), he becomes a therapist diagnosing a transitional phase.
  *   **Implication:** We don't need to ban wealth; we need to wait for the psychological habit to fade once security is guaranteed.
  *   **Research Focus:** Don't spend six months proving he hated capitalism. Spend two weeks pinning down his distinction between money as a *means* (instrumental) vs. money as an *end* (intrinsic). This supports Question 1 (Needs). If money is loved for security, it implies needs are absolute (safety). If money is loved for status, needs are relative.

  ### The Overrated Trap: The 15-Hour Week Prediction
  **Status:** **Downstream / Empirical Post-Mortem.**
  **Verdict:** **Deprioritize.**

  You asked if the failure of the 15-hour week is proof of status competition or institutional lock-in. While fascinating, this is a forensic debate about *why* he was wrong, not *what* he meant.

  **Why it's overrated for your goals:**
  Spending months modeling labor supply elasticity or union power dynamics is an economics project, not a philosophy of the good life project.
  *   **If he missed status competition:** That just confirms Question 1 (Needs are Relative).
  *   **If he missed institutional lock-in:** That just confirms a political failure, not a philosophical one.

  **Strategic Advice:**
  Use the 15-hour week failure only as a *test* for your conclusions on Question 1. Do not make it a central pillar. If you settle the Ontology of Needs, the 15-hour week debate resolves itself. If needs are relative, the prediction was bound to fail regardless of institutions. Don't reverse-engineer the philosophy from the failed prediction.

  ### Summary of the 6-Month Plan

  1.  **Months 1-2 (The Bedrock):** Focus entirely on **Absolute vs. Relative Needs**. Read *Economic Possibilities* alongside Fred Hirsch (*Social Limits to Growth*) and Robert Skidelsky's biography (Vol 3 & 4 specifically). Determine if Keynes thought relative needs could be *culturally suppressed* or if he ignored them.
      *   *Success Metric:* You can articulate whether Keynes thought scarcity was solvable *technically* or *psychologically*.

  2.  **Months 3-4 (The Telos):** Focus on **Virtue vs. Aestheticism**. Read *Principia Ethica* (Moore) to understand the Bloomsbury baseline, then contrast with Keynes's Arts Council speeches.
      *   *Success Metric:* You can explain whether the Arts Council was meant to educate citizens or subsidize pleasure.

  3.  **Months 5-6 (Synthesis & Policy):** Apply the findings to **Liberalism and Money-Love**. Write up the argument that Keynes's liberalism is compatible with state arts funding *only if* the Telos is Aesthetic (enabling choice) rather than Aristotelian (enforcing virtue). Clarify the Money-Love pathology as a bridge between the two.

  ### What Would Change My Mind?
  If you find textual evidence that Keynes believed the state should actively *discourage* high consumption not just for stability, but for moral improvement, the "Bloomsbury Aesthetic" ranking drops, and the "Aristotelian Virtue" ranking rises. This would make his liberalism much harder to defend.

  Conversely, if you find he viewed relative needs as insurmountable, the entire "Post-Scarcity" framework collapses, and you are left studying a beautiful utopian sketch rather than a policy roadmap. That is the highest-risk, highest-reward finding.

  **Final advice:** Do not let the economics drown the philosophy. The economics (growth, hours, wages) are the *mechanism*. The philosophy (needs, virtue, art) is the *map*. You are mapping the territory, not driving the car. Focus on the ontology of needs; everything else flows from there.
