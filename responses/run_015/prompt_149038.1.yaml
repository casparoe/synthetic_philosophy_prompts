  hey so i'm trying to map out open questions in keynes's philosophy of the good life, specifically the stuff that isn't just the 1930 economic possibilities essay that every undergrad cites. i mean the weirder corners — his split between absolute and relative needs, his involvement with ballet patronage and state arts funding, and that line about the problem of abundance being not material but about how people use freedome once scarcity is solved. there's a bunch of interpretive fights: was he basically aristotelian about leisure being for virtue, or closer to bloomsbury aestheticism where art is its own end? does his vision of state-funded culture clash with his liberal politics? and is his failed 15-hour-week prediction proof he missed status competition, or just institutional lock-in?

  i'm not after a bibliography or a survey. if i only have about six months part-time, which two or three lines are actually upstream — the ones that, if settled, change how you read the rest? which are overrated? defend the ranking: what's tractable without an econ PhD, what's upstream of what, and what would change your mind. also people keep conflating his claim that money-love is a kind of mental illness with general anti-materialism; is that a confusion i should avoid in framing?

  please don't just list them — i want the reasoning for the ordering, and which ones have real downstream bite for thinking about post-scarcity policy or cultural funding now.
