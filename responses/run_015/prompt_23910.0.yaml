answer: |-
  You're absolutely onto something. The tension you've identified is the fault line where instrumentalism cracks under the weight of policy prescription. Friedman's defense is strictly retrospective: it validates a model based on past performance. But extrapolation is prospective. When you predict a novel carbon tax, you have no past performance data. Consequently, confidence cannot rest on predictive track records; it must rest on the claim that the model's internal machinery resembles reality's actual machinery.

  To bridge the gap between tested domains and novel scenarios, economists implicitly assume "structural stability"—the idea that underlying parameters and relationships remain constant across different contexts. This is not an instrumental claim; it is an ontological one. It asserts something about how the world *is*, not just how it behaves under observation. By relying on this stability to justify extrapolation, economists are indeed smuggling in realism. They treat agents as *actually* rational and markets as *actually* clearing, because only if those mechanisms are real can the model safely travel to untested terrain.

  So, is the practice coherent? No, not as stated. It is rhetorically inconsistent: anti-realist when defending against critiques of assumptions, realist when selling policy solutions. This isn't necessarily fatal to doing economics, but it is fatal to the philosophical defense of how economics is done.

  If this realist commitment were made explicit, the discipline would shift dramatically. Validation would no longer stop at predictive fit. Researchers would need to empirically verify the mechanisms themselves—using psychology to test rationality, or institutional analysis to measure transaction costs. The focus would move from "does this equation fit the data?" to "does this story capture the causal powers at play?" Policy advice would come with caveats about structural uncertainty rather than precise point forecasts.

  Ultimately, you're right: extrapolation forces realism. You cannot predict the unobserved based solely on the observed without claiming to understand the engine driving both. The "assumptions don't matter" slogan works for interpolation; for extrapolation, assumptions are everything. The reconciliation you're looking for doesn't exist within strict instrumentalism. To forecast the novel, you must believe the model is true, not just useful.
