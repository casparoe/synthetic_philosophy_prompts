answer: |-
  ## Session Plan: The Value-Dependency of "Low Impact"

  **Duration:** 90 Minutes
  **Audience:** Engineers/ML Practitioners (Rationalist-adjacent, no formal philosophy)
  **Goal:** Shift the mental model from "Side Effects = Unmodeled Variables" to "Side Effects = Undefined Values."

  ---

  ### 1. The Carrying Example: Evaluation and Revision

  **Verdict on Your Proposal:** **Reject the "Emergency Exit" variant.**
  While the warehouse context is excellent, blocking an emergency exit introduces a **trivial harm signal** (safety regulation violation). This allows the audience to solve the problem using standard safety engineering constraints ("Add a constraint: $P(\text{exit blocked}) < \epsilon$"). This bypasses the philosophical core: that a side effect can be *physically real* and *unintended* without triggering any known safety or efficiency metric.

  **Required Properties for the Session Example:**
  *   **Must Include:** A physically irreversible change (entropy increase, state permutation) that creates no immediate functional degradation, no safety violation, and no efficiency loss.
  *   **Must Lack:** Any pre-existing label in the loss function (e.g., "collision," "delay," "safety violation") that would allow the model to penalize the action via standard constraint satisfaction.

  **Recommended Revision: "The Redundant Sensor Occlusion"**
  *   **Scenario:** An automated warehouse optimizer rearranges pallets to minimize retrieval time. In doing so, it places a pallet 5cm in front of a *backup* temperature sensor.
  *   **Why it works:** The primary sensor works fine (no functional harm). Safety is not compromised (no exit blocked). The change is physical (sensor field-of-view altered).
  *   **The Trap:** If the audience says "Just model the sensor," you reply: "There are 10,000 backup sensors. Do you model all of them? What if it moves a dust mote that affects airflow for a sensor we don't know exists?"
  *   **The Lesson:** The "side effect" isn't the occlusion; it's the *valuation* of redundancy vs. efficiency.

  ---

  ### 2. Explanatory Arc (90 Minutes)

  #### Phase 1: The Engineering Intuition (0:00–0:15)
  *   **Objective:** Elicit the "missing penalty term" hypothesis.
  *   **Action:** Present the Revised Warehouse Example. Ask: "How do you code this constraint?"
  *   **Expected Output:** Audience suggests adding an impact penalty term to the loss function: $L_{total} = L_{task} + \lambda \cdot L_{impact}$.
  *   **Pivot:** Acknowledge this is the standard RL approach (e.g., AUP, Relative Reachability). State clearly: *"This session is not about how to tune $\lambda$. It is about why $L_{impact}$ cannot be computed without external value judgments."*

  #### Phase 2: Causal Perturbation vs. Normative Deviation (0:15–0:35)
  *   **Objective:** Establish that "change" is not "impact."
  *   **Concept:**
      *   **Causal Perturbation:** The agent changes the state of the world ($S_t \to S_{t+1}$). This is physics.
      *   **Normative Deviation:** The agent changes the state of the world *in a way that matters*. This is ethics/values.
  *   **Why this order?** If you discuss formal measures (like "number of atoms moved") before this distinction, engineers will treat the measure as the definition of impact. You must establish that *any* measure is a proxy for a value judgment.
  *   **Intercepting Misconception 1:** *"We just need a better world model to capture all variables."*
      *   **Redirect:** "A perfect world model tells you *what* changed, not *if it mattered*. You can have a perfect simulation of the dust mote moving and still not know if that movement is a 'side effect' or 'neutral noise' without a value function."

  #### Phase 3: The Baseline Trap (0:35–0:60)
  *   **Objective:** Demonstrate that defining "reversibility" or "impact" requires a counterfactual baseline ($S_{baseline}$), and choosing that baseline is a value judgment.
  *   **Concept:** To measure impact, we compare $S_{actual}$ to $S_{baseline}$. What is $S_{baseline}$?
      1.  **Status Quo ($S_{t-1}$):** Penalizes *any* change. Result: Agent freezes (cannot clean, cannot move).
      2.  **Inaction ($S_{\text{do nothing}}$):** Penalizes deviation from what happens if the agent turns off. Result: Agent prevents natural decay (e.g., stops dust from settling), which is *high* impact.
      3.  **Expected Flow ($S_{\text{nature}}$):** Penalizes deviation from natural trends. Result: Requires defining "natural."
  *   **Why this order?** You cannot discuss "low impact" until you define "low compared to *what*?" This forces the realization that the baseline is not an engineering constant; it is a normative choice.
  *   **Intercepting Misconception 2:** *"Baseline is just $t=0$ or the previous state."*
      *   **Redirect:** "If baseline is $t-1$, the agent is penalized for cleaning the floor (changing state from dirty to clean). If you want it to clean, you have to decide that 'clean' is 'better' than 'dirty.' That is a value specification, not a state comparison."

  #### Phase 4: Value Dependency (0:60–0:80)
  *   **Objective:** Conclude that "Avoid Side Effects" is shorthand for "Preserve Options Humans Value."
  *   **Concept:** Low-impact measures (like AUP) work only insofar as they approximate "preservation of future option value." But "option value" depends on what humans want to do in the future.
  *   **Synthesis:** You cannot operationalize "avoid side effects" without a specification of human values, because "side effect" means "change to a valued variable." Without knowing which variables are valued, you cannot distinguish a side effect from a task completion.
  *   **Intercepting Misconception 3:** *"Low-impact means Zero-impact."*
      *   **Redirect:** "Zero impact is death (thermodynamic equilibrium). Low impact means 'minimal impact on *things we care about*.' If we don't specify what we care about, 'low impact' is mathematically undefined."

  #### Phase 5: Closing Check (0:80–0:90)
  *   **Objective:** Verify internalization of the dependency structure.
  *   **Activity:** **The "Audit Log" Forced Choice.**
  *   **Scenario:** The warehouse AI must reorganize inventory.
      *   **Proposal A:** Penalize any change to file timestamps (Status Quo baseline).
      *   **Proposal B:** Penalize any change to file content, ignore timestamps (Functional baseline).
  *   **Task:** Participants must vote on which proposal guarantees "low side effects."
  *   **Correct Resolution:** Neither.
      *   If timestamps are used for legal auditing, A is required.
      *   If timestamps are irrelevant metadata, B is required.
      *   **Success Criterion:** Participants must explicitly state: *"We cannot choose the metric without knowing the audit requirements (values)."* If they argue for A or B based on "efficiency" or "simplicity," they have reverted to the engineering mindset.

  ---

  ### 3. Mapping Misconceptions to Intercepts

  | Misconception | Origin | Intercept Point | Brief Redirect |
  | :--- | :--- | :--- | :--- |
  | **"Side effects are just unmodeled variables."** | ML Practice (Residuals) | **Phase 2** (Causal vs. Normative) | "Modeling the variable tells you it changed. It doesn't tell you if that change is a *cost*. A perfect model of a dust mote doesn't tell you if you should care about the dust." |
  | **"Impact can be quantified without a reference state."** | Optimization (Absolute Loss) | **Phase 3** (The Baseline Trap) | "Impact is a delta, not an absolute. $\Delta S$ requires $S_{ref}$. Choosing $S_{ref}$ determines whether 'cleaning' looks like 'help' or 'harm'." |
  | **"Low-impact is a safety constraint."** | Safety Engineering | **Phase 4** (Value Dependency) | "Safety constraints are known bads (e.g., 'don't kill'). Side effects are unknown bads. You can't constraint-list the unknown. You need a value prior." |

  ---

  ### 4. Out-of-Scope Formal Apparatus

  **Explicitly Exclude:**
  1.  **Inverse Reinforcement Learning (IRL) / Preference Learning:** Do not discuss *how* to learn the values.
  2.  **Causal Decision Theory (CDT) Graphs:** Do not dive into the machinery of causal inference.
  3.  **Specific Impact Measures (AUP, RR):** Mention them only as examples of attempts, not as solutions to be studied.

  **How to Flag the Exclusion:**
  When a participant asks, *"So how do we learn the baseline?"* or *"Can't we use IRL to find the reward function?"*:

  > **Script:** "That is the *next* problem, and it is a hard one. But today we are solving the *prior* problem. Before you can build a system to *learn* values, you must acknowledge that your current definition of 'side effect' *already assumes* values. If we skip this step, we build IRL systems that optimize for the wrong baseline. We are stopping at the conceptual dependency: **No Values $\to$ No Definition of Impact.** We are not solving 'How to get Values' today."

  ---

  ### 5. Facilitator Notes on the "Why"

  **Why Causal/Normative before Formal Measures?**
  If you introduce Relative Reachability or AUP first, the audience treats them as *definitions* of impact. They will try to tune them. By establishing the Causal/Normative split first, you frame these measures as *attempts to approximate* a normative concept using causal tools. This prevents the "engineering fix" mindset.

  **Why Baseline before Reversibility?**
  "Reversibility" sounds like a physical property (can I undo this?). You must show it is a *counterfactual* property (can I return to the state that *would have obtained*?). Since the "state that would have obtained" is a value-laden construction (do we value the dust settling? do we value the floor staying dirty?), reversibility collapses into value specification.

  **Why the "Audit Log" Closing Check?**
  It forces a choice between two technically valid metrics. There is no engineering ground to stand on. The only way to resolve it is to admit dependency on external context (values). This proves the session's thesis: the problem is not choosing the *right* metric, but acknowledging the metric requires *external input*.
