answer: |-
  **The Burden of Co-Authorship: Authoritative Assent and the Conditional Duty to Vote**

  **Introduction**

  The ethics of voting in large-scale democracies is typically trapped in a binary oscillation. On one side stands the instrumentalist, who calculates the probability of a single ballot altering an outcome and, finding it negligible, concludes that no consequentialist duty exists. On the other stands the expressivist, who argues that voting is a ritual of civic solidarity, valuable for what it signals about the voter's character rather than what it causes in the world. Both accounts, however, fail to capture the specific moral texture of democratic participation. The instrumentalist ignores the cumulative nature of mandates, while the expressivist risks reducing voting to empty symbolism, detached from the reality of governance.

  To resolve the tension between the non-pivotal nature of the individual ballot and the high stakes of collective decision-making, we must adopt a framework of **authoritative assent**. This concept posits that voting is not merely a preference registration or a causal lever, but a performative act of co-authorship in collective decisions. However, this co-authorship carries normative weight only when the institutional context exhibits **proportional accountability**—a condition where the translation of votes into policy does not systematically nullify the preferences of good-faith participants. This essay argues that a qualified moral duty to vote for the lesser evil exists, but *only* under conditions where proportional accountability is sufficiently intact to render the act of assent meaningful. Where structural distortions sever the link between assent and result, the duty dissolves, and refusal becomes the ethically preferable stance.

  **The Failure of Standard Accounts**

  The instrumental argument against a duty to vote rests on the "paradox of voting." In a national election, the likelihood of a single ballot being decisive is statistically vanishing. If morality is grounded in outcome maximization, the cost of voting (time, effort) outweighs the expected benefit (probability of decisiveness × magnitude of outcome difference). Consequently, the instrumentalist concludes that voting is supererogatory at best. This view, however, relies on a fetishization of the *pivotal* vote. It ignores that democratic authority is constituted by the aggregate, not the marginal. If every citizen adopted the instrumental reasoning, the democratic system would collapse; thus, the duty must be grounded in something other than individual causal efficacy.

  Conversely, the expressive argument posits that voting affirms democratic values regardless of the outcome. By casting a ballot, one expresses solidarity with the polity and respect for the rule of law. While this avoids the paradox of pivotality, it fails to address the problem of complicity. If the available candidates are morally objectionable, expressing solidarity with the process may amount to endorsing a corrupted outcome. Pure expressivism cannot distinguish between a vote cast in a healthy democracy and one cast in a plebiscitary authoritarianism; in both cases, the "expression" is identical, yet the moral valence differs radically. Neither the instrumental nor the expressive account adequately links the voter's agency to the specific quality of the resulting governance.

  **Authoritative Assent and Proportional Accountability**

  The framework of authoritative assent bridges this gap by treating the vote as a speech act of authorization. When a citizen votes, they are not merely predicting a winner or cheering for a team; they are granting authority to a representative to act in their name. This makes the voter a co-author of the subsequent political order. As a co-author, the voter shares in the responsibility for the policies enacted, even if their specific preference did not win.

  However, co-authorship implies agency. One cannot be held responsible for a text they were forced to sign or for a narrative over which they had no influence. This is where **proportional accountability** becomes the critical variable. Proportional accountability does not necessarily require strict proportional representation in the legislative sense; rather, it requires that the electoral system preserves a reciprocal link between assent and result. It demands that coalitions of voters can reasonably expect their preferences to influence policy trajectories and that no group is systematically excluded from the feedback loop of representation.

  Under conditions of proportional accountability, the vote retains its status as authoritative assent. The voter knows that while their single ballot is not decisive, their participation contributes to a mandate that constrains the winner. The system is responsive enough that the "co-authorship" is not fictional. In this context, the voter bears a responsibility for the range of possible outcomes. To abstain is to abdicate that co-authorship, leaving the text of the law to be written by others while still being bound by it.

  **The Lesser Evil and the Problem of Complicity**

  This framework sharpens the dilemma of the "lesser evil." If all candidates are morally objectionable, does voting for the less harmful one constitute unjustified complicity? Under the model of authoritative assent, voting is inherently an act of complicity because it authorizes power. However, complicity is not always unjustified. In a context of proportional accountability, the co-author has a duty of stewardship over the collective.

  If the electoral system is responsive, the "lesser evil" candidate is still subject to the pressure of the mandate. A vote for the lesser evil is not an endorsement of their moral failings but a strategic authorization intended to mitigate harm within the available range of possibilities. Because the system preserves the link between votes and policy (proportional accountability), the voter retains the capacity to withdraw assent in the future or to influence the candidate's behavior through the threat of electoral punishment. The vote is a tool of damage limitation, exercised by a co-author who recognizes that refusing to write does not stop the book from being published—it only ensures one has no say in the editing.

  Therefore, under conditions of proportional accountability, a qualified duty to vote for the lesser evil holds. The duty is "qualified" because it depends on the candidates falling within a threshold of democratic legitimacy; if the "lesser evil" is still an existential threat to the democratic framework itself (e.g., a candidate committed to abolishing future elections), the condition of accountability is retroactively nullified, and the duty may vanish. But assuming the system remains intact, the co-author must act to minimize the harm they are jointly responsible for managing.

  **Structural Distortion and the Dissolution of Duty**

  The critical strength of the authoritative assent framework is its ability to diagnose when the duty to vote disappears. In structurally distorted electoral systems—characterized by extreme gerrymandering, voter suppression, oligarchic capture, or rigid duopolies that insulate winners from voter feedback—proportional accountability is absent. In these contexts, the translation of votes into policy is systematically broken.

  When the system nullifies the preferences of participants who act in good faith, the claim of "co-authorship" becomes a fiction. The voter is asked to assent to a decision they have no power to shape. In such environments, casting a vote for the lesser evil is not an act of responsible stewardship but an act of legitimizing a rigged process. It confers the appearance of consent upon an authoritarian dynamic. Here, the instrumental argument gains traction: if the causal link is severed by structural design, the vote is causally inert. More importantly, the expressive argument turns toxic: participating expresses solidarity with a system that is actively betraying democratic values.

  Consequently, in the absence of proportional accountability, the moral duty to vote dissolves. Abstention, protest voting, or other forms of refusal become morally preferable. These acts serve as a withdrawal of authoritative assent, signaling that the conditions for legitimate co-authorship have not been met. Refusal, in this context, is not civic apathy but a demand for the restoration of the reciprocal link between citizen and state. It preserves the moral integrity of the voter by refusing to authorize a process that treats their agency as null.

  **Conclusion**

  The question of whether there is a moral duty to vote cannot be answered in the abstract; it depends entirely on the institutional reality in which the ballot is cast. By adopting the framework of authoritative assent, we see that voting is a claim of shared responsibility. This responsibility generates a duty only when the political system honors the voter's status as a co-author.

  Therefore, I conclude that a **qualified duty to vote for the lesser evil holds precisely under conditions of proportional accountability.** In such systems, the voter is morally obligated to engage in damage mitigation, as their assent contributes to a responsive mandate that can constrain power. However, in severely flawed systems where structural distortions sever the link between votes and outcomes, the duty is illusory. There, the vote is not an instrument of co-authorship but a token of coerced compliance. In those circumstances, the ethical imperative shifts from participation to refusal, until the conditions of proportional accountability are restored. Democratic ethics, then, is not merely about the virtue of the voter, but about the integrity of the structure that renders their assent authoritative.
