          2.  Address "changing the subject": This dictum applies when we try to say someone *holds* a different logic while meaning the same things. But here, the translation manual *assigns* the logic.
          3.  The key move: If Manual B translates them as accepting contradictions, it likely mishandles the connective. If they assent to both, perhaps the connective isn't negation at all, or the assent/dissent patterns are more subtle (e.g., context-dependent).
          4.  However, the prompt stipulates the manuals are *empirically indistinguishable*. This is the heart of indeterminacy.
          5.  Quine's stance on logic: Logic is immanent. We translate to maximize truth (principle of charity). If a manual makes them look illogical (paraconsistent vs classical), we prefer the one that makes them look logical (classical), *unless* the behavioral evidence forces otherwise.
          6.  But if the evidence *doesn't* force otherwise (indistinguishable manuals), then there is no fact of the matter. The challenger says this reduces it to "pure conventional stipulation." Quine agrees! That's the point of indeterminacy. There is no fact of the matter beyond the manual.
