      *   **Subject:** Benedict Anderson's theory of "Imagined Communities".
      *   **Scenario:** Anderson alive today, confronted with (1) blockchain-based citizenship (token-holding vs. territory) and (2) AI real-time translation (removing language barriers).
      *   **Task:** Revise his theory based on these technologies.
      *   **Constraint 1 (Bottom-line verdict):** First sentence must state whether this confirms primacy of media/language over territory, forces a retreat from print-capitalism, or breaks the framework entirely.
