answer: |-
  This is a remarkably robust inductive framework. You've essentially reconstructed a **Fairness-Based Conventionalism**: obligations arise not from the act itself, but from the reliance others have placed on the stability of the practice and the unfairness of free-riding or undermining it.

  Here is the stress test of your principle against your specific questions.

  ### 1. The 2am vs. Kids Pair (Norm Transmission)
  **Verdict:** The principle survives, but requires a specific interpretation of "visibility."

  In the 2am case, there is no load-bearing expectation (no one is relying on you stopping) and no visibility (no one sees you). In the kids case, the physical risk is identical, but the **normative risk** is not.
  *   **Load-bearing:** The safety of the queueing system (waiting for the light) relies on the belief that "Red Man = Stop."
  *   **Visibility:** When kids watch, you aren't just being seen; you are **updating their probability model**. If they see a grown-up break the convention safely, the expectation that "folks will comply" lowers for *them* in the future.
  *   **Fix:** Your principle needs to specify that visibility matters not just for *current* coordination, but for **intergenerational norm transmission**. You owe compliance to the kids because they are the future load-bearers of the convention.

  ### 2. The Bribe (The Justice Constraint)
  **Verdict:** The principle fails here without an override clause.

  Your gut says refusing is fine; your principle suggests you should pay (officials arrange income around it, others pay the cost, refusing might slow the line).
  *   **The Problem:** Your principle treats conventions as morally neutral coordination points. But bribery isn't just a coordination convention; it's an **extraction convention**. It doesn't solve a collective action problem (like queueing); it creates one.
  *   **The Fix:** You need a **Justice Constraint**. *Conventions generate obligations only if the convention itself does not violate independent moral duties (rights, justice, non-harm).*
  *   **Does this smuggle in ordinary morality?** Yes, but it doesn't make the word "convention" useless. For 90% of your list (tipping, queueing, jaywalking), the morality *comes from the convention*. Jaywalking isn't wrong in a vacuum; it's wrong because of the reliance/expectation. Bribery is wrong *before* the convention exists. The constraint just sets the boundary conditions; the principle still does the work inside the boundary.

  ### 3. Duty to Defer vs. Reliance
  **Verdict:** It is all downstream of reliance plus visibility.

  There is no intrinsic "When in Rome" duty. Your verdict on the **Visitor Shoving** vs. **Visitor Tipping** proves this.
  *   **Shoving:** Violates reliance (locals arranged behavior around queuing).
  *   **Tipping:** Violates no reliance (locals don't rely on tips), creates minor friction (etiquette), but no moral breach.
  *   **Conclusion:** You don't owe deference to "local ways"; you owe fairness to **local people** who have structured their lives around specific expectations. If the local way is "scrum," you scrum. If the local way is "queue," you queue. The content doesn't matter; the reliance does.

  ### 4. Predictions for Your Two New Cases

  **Case A: The Protesting Local (Stops tipping, leaves note)**
  *   **Analysis:**
      *   *Load-bearing:* Yes. The server's wage structure relies on the tip.
      *   *Free-riding:* Yes. You receive the service funded by the tip assumption but withhold the fund.
      *   *Visibility/Undermining:* The note mitigates this. It signals "I support the norm of tipping, but object to the system." It prevents the server from thinking "tipping is dead."
  *   **Prediction:** **Morally ambiguous, but leans Not OK.**
      *   The note saves you from the charge of *undermining the convention*, but it does not save you from the charge of *free-riding on the income structure*. You are effectively using the server as a means to protest the owner's wage policy. The harm (lost income) is real, even if the message is clear. Your principle suggests you are still in the wrong, though less so than a silent skipper.

  **Case B: The Tourist in a Jaywalking City**
  *   **Analysis:**
      *   *Convention:* What is the actual convention? Is it "Obey Lights" or "Cross When Clear"? If *literally everyone* jaywalks, the functioning convention is "Cross When Clear." The law is the outlier.
      *   *Load-bearing:* Drivers in that city likely drive expecting pedestrians to cross unpredictably (slower, more alert).
      *   *Visibility:* Standing still at an empty light might actually confuse the local flow.
  *   **Prediction:** **Fine (Obligation to Jaywalk).**
      *   Your principle dictates compliance with the *actual* convention, not the *legal* one. If the load-bearing expectation of the locals is that pedestrians will cross mid-block, then adhering to the "Red Man" is actually the deviation that risks safety (drivers don't expect you to stop). You owe compliance to the *practice*, not the *statute*.

  ### Summary of the Refined Principle
  To make your principle bulletproof, it looks like this:

  > You owe compliance to a convention when:
  > 1.  **Legitimacy:** The convention does not violate independent moral duties (no bribes/extortion).
  > 2.  **Reliance:** Others have arranged behavior/income around it (load-bearing).
  > 3.  **Fairness:** Your deviation either free-rides on that arrangement OR is visible enough to weaken future compliance (including norm transmission to observers).

  This keeps the heavy lifting on **convention** (reliance/visibility) while acknowledging that **morality** sets the guardrails. It explains why you can ignore a red light in a jaywalking city (the convention *is* jaywalking) but must respect a queue in a queuing city (reliance), and why you must refuse a bribe even if "everyone does it" (legitimacy constraint).
