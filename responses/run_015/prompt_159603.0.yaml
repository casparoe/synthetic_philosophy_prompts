answer: |-
  # TRIBUNAL FREEDOM DECISION TREE

  **START HERE**

  **Q1. The Discharged Patient (Standing Power)**
  A patient was discharged six months ago. She lives at home, works, and has had no contact with services. However, her discharge was conditional; a clinician retains the legal power to recall her to hospital immediately if deemed necessary, though this power has never been used.
  *   **Verdict A:** She is free. (Go to Q2)
  *   **Verdict B:** She is not free. (Go to Q5)
  *   **Verdict C:** This case doesn't settle it. (Go to Q3)

  ---

  **PATH A: "She is free" (Focus on Actual Interference)**

  **Q2. The Ward Rule (Actual Interference)**
  A patient on a ward is stopped daily from leaving the grounds without permission. The rule is applied to her every time she tries to leave.
  *   **Verdict A:** She is not free. (Go to Q3)
  *   **Verdict B:** She is free. (Go to **Leaf 1**)
  *   **Verdict C:** This case doesn't settle it. (Go to Q4)

  **Q3. The Funding Formula (Impersonal Constraint)**
  A patient meets all clinical criteria for a therapy but cannot access it because a regional funding algorithm excludes her postcode. No individual clinician chose to deny her; the budget is simply exhausted.
  *   **Verdict A:** This makes her unfree. (Go to **Leaf 6**)
  *   **Verdict B:** This does not make her unfree. (Go to Q4)
  *   **Verdict C:** This case doesn't settle it. (Go to **Leaf 1**)

  **Q4. The Waiting List (Structural Barrier)**
  A patient is waiting 18 months for a community bed due to a shortage of housing staff. No one is actively detaining her, but she cannot leave the hospital.
  *   **Verdict A:** This makes her unfree. (Go to **Leaf 6**)
  *   **Verdict B:** This does not make her unfree. (Go to **Leaf 1**)
  *   **Verdict C:** This case doesn't settle it. (Go to **Leaf 1**)

  ---

  **PATH B: "She is not free" (Focus on Power & Arbitrariness)**

  **Q5. The Benevolent Rule (Interests vs. Consent)**
  A ward rule prohibits smoking indoors. It significantly improves patients' health (tracks interests), was imposed without consultation (no consent), and patients cannot appeal it (no contestation).
  *   **Verdict A:** Patients are unfree. (Go to Q6)
  *   **Verdict B:** Patients are free. (Go to Q7)
  *   **Verdict C:** This case doesn't settle it. (Go to Q8)

  **Q6. The Ignored Appeal (Contestation vs. Interests)**
  A ward rule restricts visitors. It causes patients significant distress (ignores interests), but there is a formal appeals process which patients use successfully to overturn decisions (full contestation).
  *   **Verdict A:** Patients are unfree. (Go to **Leaf 3**)
  *   **Verdict B:** Patients are free. (Go to **Leaf 2**)
  *   **Verdict C:** This case doesn't settle it. (Go to **Leaf 2**)

  **Q7. The Community Order (Discretionary Power)**
  A patient on a Community Treatment Order must take medication. The clinician has discretion to recall them if they refuse. The patient consents to the treatment but not the power of recall.
  *   **Verdict A:** She is unfree. (Go to **Leaf 2**)
  *   **Verdict B:** She is free. (Go to **Leaf 7**)
  *   **Verdict C:** This case doesn't settle it. (Go to **Leaf 2**)

  **Q8. The Advance Directive (Past Will)**
  A patient signed an advance directive requesting treatment during relapse. She is now relapsing and refusing treatment.
  *   **Verdict A:** Treat her; she is unfree to refuse. (Go to Q9)
  *   **Verdict B:** Do not treat; she is free to refuse. (Go to **Leaf 5**)
  *   **Verdict C:** This case doesn't settle it. (Go to Q9)

  **Q9. The Illness Refusal (Authentic Will)**
  A patient refuses medication, stating it "poisons the soul." Clinical assessment suggests this belief is a symptom of psychosis, not a stable value.
  *   **Verdict A:** Treat him; he is unfree (illness). (Go to **Leaf 4**)
  *   **Verdict B:** Do not treat; he is free (choice). (Go to **Leaf 5**)
  *   **Verdict C:** This case doesn't settle it. (Go to **Leaf 5**)

  ---

  **PATH C: "Doesn't Settle It" (Hybrid/Unexplored)**

  **Q10. The Private Veto (Non-State Power)**
  A patient's family threatens to withdraw financial support if she leaves hospital. No state law prevents her leaving, but she stays due to this threat.
  *   **Verdict A:** She is unfree. (Go to **Leaf 8**)
  *   **Verdict B:** She is free. (Go to **Leaf 1**)
  *   **Verdict C:** This case doesn't settle it. (Go to **Leaf 8**)

  **Q11. The Supported Decision (Capacity)**
  A patient makes a decision only after extensive coaching by a advocate to understand the consequences.
  *   **Verdict A:** She is free (supported will). (Go to **Leaf 4**)
  *   **Verdict B:** She is unfree (influenced will). (Go to **Leaf 5**)
  *   **Verdict C:** This case doesn't settle it. (Go to **Leaf 4**)

  **Q12. The Risk Algorithm (Automated Power)**
  A computer algorithm flags a patient as "high risk," triggering automatic supervision. No human reviewed the flag.
  *   **Verdict A:** She is unfree. (Go to **Leaf 6**)
  *   **Verdict B:** She is free. (Go to **Leaf 1**)
  *   **Verdict C:** This case doesn't settle it. (Go to **Leaf 6**)

  **Q13. The Conditional Discharge (Tracking Interests)**
  A patient is discharged conditional on living at a specific address chosen by the team because it is the only safe option available.
  *   **Verdict A:** She is unfree. (Go to **Leaf 3**)
  *   **Verdict B:** She is free. (Go to **Leaf 7**)
  *   **Verdict C:** This case doesn't settle it. (Go to **Leaf 3**)

  ---

  **THE LEAVES**

  **Leaf 1: Freedom as Absence of Interference (Negative Liberty)**
  *Reached by: Q1(A) → Q2(A) → Q3(B) → Q4(B)*
  *   **Conception:** You are free so long as no one actively stops you.
  *   **Awkward Cost:** You must accept that a slave with a kind master who never interferes is free, while a citizen subject to benign laws is unfree.
  *   **Note:** This view often overlaps with **Agency-Only Power** (Leaf 7) but diverges on structural barriers.

  **Leaf 2: Freedom as Non-Domination (Republican Liberty)**
  *Reached by: Q1(B) → Q5(A) → Q6(B) → Q7(A)*
  *   **Conception:** You are free only if no one holds arbitrary power over you, even if unused.
  *   **Awkward Cost:** You must accept that democratic laws reduce your freedom even when they protect you, because they remain powers over you.
  *   **Note:** Distinguishes itself from Leaf 3 by prioritizing contestability over interest-tracking.

  **Leaf 3: Freedom as Interest-Tracking (Paternalistic Liberty)**
  *Reached by: Q1(B) → Q5(A) → Q6(A) → Q13(A)*
  *   **Conception:** Power does not make you unfree if it reliably serves your best interests.
  *   **Awkward Cost:** You must accept that a person can be made unfree by rules they successfully appeal, provided those rules ignore their welfare.
  *   **Note:** This is an **Unnamed** variant of non-domination; traditional republicanism focuses on contestability, not outcomes.

  **Leaf 4: Freedom as Self-Mastery (Positive Liberty)**
  *Reached by: Q1(B) → Q8(A) → Q9(A) → Q11(A)*
  *   **Conception:** You are free only when acting on your rational or authentic will, not impulses or illness.
  *   **Awkward Cost:** You must accept that clinicians may know a patient's "real" will better than the patient does in the moment.
  *   **Note:** Occupies space with **Leaf 5** if the theory is silent on the source of authenticity (Past vs. Current).

  **Leaf 5: Freedom as Current Choice (Voluntarism)**
  *Reached by: Q1(B) → Q8(B) → Q9(B) → Q11(B)*
  *   **Conception:** You are free if you can act on your current will, regardless of its origin or consistency.
  *   **Awkward Cost:** You must accept that a person in the grip of a delusion is fully free, and preventing harm is an infringement of liberty.
  *   **Note:** This view is often **Silent** on structural barriers (Q3/Q4), occupying Leaf 1 or Leaf 6 depending on the holder.

  **Leaf 6: Freedom as Effective Opportunity (Capability Approach)**
  *Reached by: Q1(A) → Q3(A) → Q4(A) → Q12(A)*
  *   **Conception:** You are free only if you actually have the capacity and resources to function, not just the legal right.
  *   **Awkward Cost:** You must accept that a lack of money or a funding algorithm restricts freedom just as much as a locked door.
  *   **Note:** Merges **Structural Unfreedom** with **Capability**; distinguishes from Leaf 1 by counting impersonal constraints.

  **Leaf 7: Freedom as Agency-Only (Personal Power)**
  *Reached by: Q1(A) → Q3(B) → Q7(B) → Q13(B)*
  *   **Conception:** Only power held by a person or office can make you unfree; systems cannot.
  *   **Awkward Cost:** You must accept that systemic poverty or waiting lists are misfortunes, not violations of liberty.
  *   **Note:** This view is **Silent** on the Divided Will cases (Q8/Q9), potentially overlapping with Leaf 1 or Leaf 5.

  **Leaf 8: Freedom as Structural Unfreedom (Impersonal Constraint)**
  *Reached by: Q10(A) → Q12(A)*
  *   **Conception:** Unpersoned arrangements (family threats, algorithms) can make you unfree just like state detention.
  *   **Awkward Cost:** You must accept that a fallen tree blocking your path restricts your freedom in the same political sense as a guard.
  *   **Note:** This is an **Unnamed** position; most theories distinguish between natural/social barriers and political unfreedom.

  ***

  # NOTES ON USAGE

  **The tree forces trade-offs rather than resolving them.**
  This diagnostic tool does not tell you which view is correct; it reveals which costly implication you are willing to accept when your colleagues disagree.

  **Some leaves share theoretical ground.**
  Leaf 1 (Negative Liberty) and Leaf 7 (Agency-Only) often travel together, but Leaf 1 focuses on interference while Leaf 7 focuses on the source of power; a colleague might hold one without the other.

  **Positive Liberty is split across two leaves.**
  Leaf 4 (Self-Mastery) and Leaf 5 (Current Choice) represent the two ways "real will" is interpreted; if a colleague says "it depends on the capacity," they are moving between these leaves mid-case.

  **Structural views expand the scope of unfreedom.**
  Leaf 6 (Capability) and Leaf 8 (Structural) are the only positions that classify funding cuts or algorithms as liberty violations; if your social worker argues this, they are operating here.

  **Non-domination has two variants in this tree.**
  Leaf 2 prioritizes the ability to contest power (procedure), while Leaf 3 prioritizes whether power serves interests (outcome); solicitors often prefer Leaf 2, clinicians Leaf 3.

  **Silence is a valid position.**
  Where a leaf notes a view is "Silent," it means that conception of freedom offers no guidance on that specific case; do not force a verdict where the theory provides none.

  **Verdicts are diagnostic, not legal.**
  Answering "She is not free" in this tree identifies your philosophical commitment; it does not dictate the legal threshold for detention under the Act.
