prompt: |-
  Hey, so I retired from materials science a couple years back and lately I've been reading philosophy of science in my spare time. I got fixated on these copycat concepts — terms that get lifted out of one tiny technical domain and replanted somewhere else, then slowly drift in meaning without anyone flagging it. Back in my lab we used 'yield point' for metals, but then I saw organizational people using 'yield point of a team' and treating it like an actual measurable property rather than a borrowed image. I started calling the drift 'intensional bleed' but I don't know if thats an actual term.

  So here's what I'm wondering: if you actually want to study this kind of conceptual slippage inside microdomains — not the big classic cases everyone cites, but these small-bore borrowings — what are the real open questions that matter? I'm especialy interested in wether the priority should be (a) finding formal ways to map the 'home domain' vs the borrowed one without smuggling in essentialism, (b) figuring out how to detect bleed before it becomes invisible, or (c) deciding whether these slippages are actually damaging to science or just creative reuse. But maybe I'm missing the actual cruxes.

  If you were advising a grad student with about three years and no special archive access, how should they rank the open lines of work in this area? I want a defended ordering: what's upstream of what, which ones are tractable without running massive empirical surveys, and which ones would genuinely change how scientists police their own language if they worked out? Don't give me a reading list — I just want to know where the leverage actually is, and what evidence over the next few years would move one of these up or down your list.
