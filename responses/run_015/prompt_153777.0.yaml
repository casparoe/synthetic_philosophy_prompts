answer: |-
  First, "intensional bleed" is a strong coinage. It captures the specific failure mode you're describing: the *intension* (the internal definition/conditions of application) of a term leaks across a domain boundary, but the *extension* (the things it actually applies to) changes without the definition updating to match. In philosophy of language, this overlaps with "semantic drift" and "conceptual metaphor," but your focus on the *loss of measurability* (the "yield point" example) is a distinct, high-value niche.

  For a three-year PhD with no special archive access, here is the defended ordering of priority.

  ### 1. Priority One: Operationalizing Detection (Option B)
  **Rank:** Upstream / Foundational
  **Why:** You cannot assess damage (C) or build a map (A) until you can reliably distinguish "creative reuse" from "intensional bleed."

  This is the most tractable line of work for a three-year timeline. It avoids the essentialism trap because it focuses on *usage patterns* rather than *true meanings*. You aren't asking "What is the *real* meaning of resilience?" You are asking, "How did the operational criteria for 'resilience' change between Paper A (engineering) and Paper B (psychology)?"

  **Tractability:**
  *   **Data:** You don't need special archives. You need open-access corpora (arXiv, PubMed, SSRN).
  *   **Method:** Diachronic corpus analysis. You track a term's "neighbors" (collocates) over time. In materials science, "yield" neighbors with "stress," "strain," "MPa." In organizational theory, it neighbors with "burnout," "productivity," "survey."
  *   **The Deliverable:** A set of heuristics or markers that signal when a term has decoupled from its measurement constraints. For example: *When a term loses its associated units of measurement in the new domain, bleed is active.*

  **Leverage:**
  If you can produce a "Bleed Detector"—even a rough checklist—it gives scientists a tool to audit their own literature. This is immediate utility.

  ### 2. Priority Two: Assessing Epistemic Consequence (Option C)
  **Rank:** Downstream / Evaluative
  **Why:** Detection is useless without knowing if the bleed is a bug or a feature.

  Once you have identified cases of bleed using Priority 1, you must determine if the slippage caused error or enabled insight. This is the normative core. Some borrowings are generative metaphors that spark new hypotheses; others are "zombie concepts" that block progress by pretending to offer precision they don't possess.

  **Tractability:**
  *   **Method:** Comparative case studies. Take 5–10 clear instances of bleed identified in Phase 1. Trace the citation network. Did the borrowed term lead to falsifiable predictions that failed? Or did it lead to new interdisciplinary grants and models?
  *   **Risk:** This is harder to generalize. It requires deep domain knowledge (which you have, but the student may need to cultivate).

  **Leverage:**
  This is what changes behavior. Scientists don't care about semantic purity; they care about truth and utility. If you can show that "intensional bleed" in *specific contexts* correlates with replication failure or policy error, you have a normative argument for policing language.

  ### 3. Priority Three: Formal Mapping (Option A)
  **Rank:** Last / Theoretical
  **Why:** This is the essentialism trap.

  Attempting to formally map the "home domain" vs. "borrowed domain" presumes that the "home domain" meaning is stable and precise. In practice, even within materials science, "yield point" has nuances depending on the alloy and testing standard. Building a formal ontology of "correct meaning" before understanding the drift often leads to prescriptivism that scientists ignore.

  **Tractability:**
  *   **Risk:** High. This easily becomes a philosophical exercise detached from scientific practice. It requires heavy logic/ontology work that is difficult to validate empirically within three years.
  *   **When it becomes Priority 1:** Only if Priority 1 reveals that the drift is so systematic that it follows a predictable logical structure (e.g., "all borrowed thermodynamic terms lose their entropy constraint").

  ---

  ### The Crux: Why this ordering?

  **Upstream/Downstream Logic:**
  You need to *find* the phenomenon (B) before you can *judge* it (C). You need to *judge* its impact (C) before you can *formalize* rules to prevent it (A). If you start with (A), you risk building a formal model of a phenomenon you haven't empirically verified, which is a common failure mode in philosophy of science.

  **Avoiding Essentialism:**
  By prioritizing (B), you sidestep the question "What does this word *really* mean?" and replace it with "What work is this word *doing* in this sentence?" This is a pragmatic shift that aligns better with how scientists actually operate.

  ### Evidence That Would Re-Order This List

  **1. Evidence that would move (A) up:**
  If the student finds that intensional bleed is **algorithmically predictable**. If, during the detection phase (B), they discover that terms *always* drift in a specific logical direction (e.g., "All borrowed mechanical terms inevitably lose their vector properties"), then formal mapping (A) becomes urgent because we could build a "grammar of drift" to auto-correct papers.

  **2. Evidence that would move (C) down:**
  If the case studies reveal that **bleed is epistemically neutral**. If the student finds that teams using "yield point" metaphorically produce the same quality of predictions as those using it technically, then the normative urgency vanishes. The project shifts from "fixing science" to "describing linguistics."

  **3. Evidence that would move (B) down:**
  If **detection proves impossible without deep domain expertise**. If the student finds that you cannot detect bleed via text analysis alone—that you need to understand the underlying physics *and* the underlying sociology to spot the slippage—then (B) is not a generalizable tool. It becomes a series of artisanal case studies, and the project scope shrinks significantly.

  ### Summary Advice for the Student

  Tell them to treat "intensional bleed" as an **empirical variable**, not a philosophical category.
  1.  **Year 1:** Build a corpus pipeline. Pick 5 terms (e.g., *resilience, entropy, friction, synergy, bottleneck*). Map their collocates in hard science vs. social science over 20 years. (Priority B)
  2.  **Year 2:** Select the 3 cases with the highest divergence. Trace the citations. Look for instances where the metaphor broke down or caused confusion. (Priority C)
  3.  **Year 3:** Write the thesis on the *conditions* under which bleed becomes harmful. Do not attempt to solve the definition of the terms; solve the definition of the *drift*.

  This approach respects your materials science background (measure what you can, trust the data) while engaging the philosophy of science (what counts as knowledge). It keeps the student out of the metaphysical weeds and gives them a tangible output that could actually influence how scientists write.
