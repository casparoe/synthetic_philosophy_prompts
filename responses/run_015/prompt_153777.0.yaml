      *   They are also touching on *equivocation fallacies* in scientific discourse.
      *   They are interested in the *sociology of scientific language* (how terms gain authority).
      *   Their term "intensional bleed" is apt (intension = internal content/definition).

  3.  **Evaluate the Three Options (a, b, c):**

