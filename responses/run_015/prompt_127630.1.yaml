answer: |-
  Here is a structured breakdown of the desiderata for an adequate theory of moral motivation, tailored for your feature. It focuses on the tension between impartial demands and personal integrity, flagging the non-negotiables, the contested grounds, and the theoretical trade-offs.

  ### Core Desiderata for Moral Motivation

  To be psychologically adequate, a moral theory must account for *how* agents move to action without fracturing their sense of self. The following five criteria capture the necessary scope.

  **1. The Intimacy Constraint (The "One Thought Too Many" Test)**
  *   **Requirement:** The theory must explain why acting directly from love or attachment (e.g., saving a spouse) is morally preferable, or at least permissible, compared to acting from an impartial principle that *licenses* saving the spouse.
  *   **Why:** If the primary motivation is "the greatest good," the specific relationship becomes contingent. The theory must allow ground projects to be motivationally primary, not just instrumentally useful.
  *   **Status:** **Non-negotiable** for most non-consequentialists; **Contested** by hard-line consequentialists who argue the *outcome* is all that matters, regardless of the mental route.

  **2. The Impartiality Floor**
  *   **Requirement:** While allowing for partiality, the theory must still generate binding duties toward strangers when stakes are sufficiently high (e.g., letting a stranger die to save a trivial benefit for a loved one).
  *   **Why:** A theory that collapses into pure egoism or tribalism fails to capture the "moral" aspect of moral psychology.
  *   **Status:** **Non-negotiable.** Almost all camps agree morality requires *some* transcendence of self-interest.

  **3. The Role-Integrity Distinction**
  *   **Requirement:** The theory must distinguish between personal integrity (remaining true to one's own character) and institutional/professional integrity (fulfilling a role's internal goods, like the journalist protecting a source).
  *   **Why:** A journalist protecting a source isn't necessarily acting on personal love, nor on universal utility. They are acting on a role-obligation that constitutes their professional identity. Collapsing this into "personal preference" undermines social trust; collapsing it into "universal law" ignores the specific nature of the practice.
  *   **Status:** **Contested.** Some theories try to reduce role obligations to universal duties; others treat them as sui generis.

  **4. The Sustainability Constraint (The Burnout Test)**
  *   **Requirement:** The theory cannot demand the total sacrifice of the agent's psychological viability. It must explain why the activist who swallows all personal projects for universal demands is *tragically* overburdened, not *morally* perfect.
  *   **Why:** If morality requires self-annihilation, it becomes psychologically unintelligible as a long-term motivator.
  *   **Status:** **Non-negotiable.** There is broad consensus that "moral sainthood" is not a mandatory requirement for moral adequacy.

  **5. The Transparency Condition**
  *   **Requirement:** The agent's conscious motivation should ideally align with the justifying reason. If I save you because I love you, the justification shouldn't secretly be "because it maximizes utility."
  *   **Why:** Alienation occurs when the agent feels like a vessel for a calculus rather than an author of action.
  *   **Status:** **Contested.** Internalists argue motivation must be internal to the agent's psychology; Externalists argue one can be motivated by a reason even if it doesn't resonate emotionally.

  ***

  ### Jointly Unsatisfiable Pairs (The Hard Trade-Offs)

  You asked to flag tensions that may be logically incompatible. These are the friction points where theories usually have to sacrifice one desideratum to satisfy another.

  *   **Full Universality vs. Full Integrity:** You cannot have a system where every action is justified by a universal neutral standard *and* a system where agents are free to pursue personal ground projects that violate that standard. If integrity means "doing what my projects demand" and universality means "doing what the neutral view demands," they will clash.
      *   *Verdict:* **Genuinely Incompatible.** Theories must prioritize one (e.g., Utilitarianism sacrifices Integrity; Virtue Ethics sacrifices strict Universality).
  *   **Motivational Purity vs. Moral Safety:** If we require motivations to be "pure" (e.g., act *only* from duty, or *only* from love), we risk moral failure when emotions fade. If we allow "backup" motivations (act from love, but calculate if love fails), we risk the "one thought too many" alienation.
      *   *Verdict:* **Pragmatic Tension.** Most theories opt for a hybrid, but this creates theoretical ambiguity.

  ***

  ### Status Report: Settled vs. Fought Over

  To ensure your feature doesn't present a partisan view as consensus, here is the landscape of the debate:

  **Settled (Broad Consensus)**
  *   **Psychological Realism:** A moral theory that requires human beings to be purely rational calculators without emotional attachment is psychologically impossible.
  *   **The Existence of Conflict:** Moral life inherently involves conflict between personal commitments and impartial demands. A theory that denies this (by saying true virtue makes conflict impossible) is suspect.
  *   **Burnout is Bad:** Moral theories that encourage self-destruction are generally viewed as defective.

  **Fought Over (Active Disputes)**
  *   **The Source of Normativity:** Does the reason to save the spouse come from the *relationship itself* (Care/Virtue) or does the relationship merely trigger a universal duty (Kantian/Utilitarian)?
  *   **The Value of Integrity:** Is integrity a *moral* value (it makes you a better moral agent) or a *non-moral* constraint (it's about your sanity, not morality)? Williams suggests the latter; many critics argue the former.
  *   **Reflective Endorsement:** Some argue the "one thought too many" is actually a *good* thing—we *should* reflect on our impulses. Others argue reflection destroys the value of the impulse.

  ***

  ### Quick Theory Scorecard

  Here is how the major frameworks stack up against the desiderata above.

  **Classical Utilitarianism**
  *   **Intimacy:** **Fail.** Struggles to justify why saving the spouse directly is better than via calculus. Often views personal projects as suspect if they don't maximize good.
  *   **Impartiality:** **Pass.** Its strongest suit.
  *   **Integrity:** **Fail.** High risk of alienation; the agent is a conduit for utility, not a source of value.
  *   **Sustainability:** **Fail.** Prone to demandingness objections (activist burnout is a feature, not a bug).

  **Virtue Ethics**
  *   **Intimacy:** **Pass.** Acting from character/love is the ideal; calculation is a fallback for the non-virtuous.
  *   **Impartiality:** **Weak.** Can struggle to explain duties to distant strangers where no relationship exists.
  *   **Integrity:** **Pass.** Central to the theory; integrity is constitutive of flourishing.
  *   **Sustainability:** **Pass.** Flourishing cannot require self-destruction.

  **Care Ethics**
  *   **Intimacy:** **Pass.** Relationships are the foundational moral unit.
  *   **Impartiality:** **Fail.** Struggles to scale; hard to adjudicate conflicts between competing cares or distant justice claims.
  *   **Integrity:** **Pass (Personal) / Mixed (Institutional).** Excellent on personal integrity, less developed on institutional role obligations that aren't relational.
  *   **Sustainability:** **Pass.** Emphasizes the maintenance of the caring relationship, which includes the self.

  ***

  **Editor's Note:** This list isolates the structural requirements without getting bogged down in specific textual exegesis. The "Jointly Unsatisfiable" section is likely the strongest hook for your piece—it moves the discussion from "which theory is right" to "what is the cost of any theory?"
