  **REPUBLIC OF AFFECTED INTERESTS**
  **DEPARTMENT OF DEMOCRATIC BOUNDARY INTEGRITY**
  **CIVIC STATUS AND ALLOCATIVE HANDBOOK (ED. 4.2)**

  **1.0 GENERAL PROVISIONS**
  Pursuant to the Algorithmic Democratic Integrity Act, all voting entitlements within the Republic are derived exclusively from the All-Affected Interests Algorithm (AAIA). Membership in the *demos* is not a static right but a dynamic function of policy impact. Applicants must submit to a Recursive Stakeholder Audit to determine their coefficient of affectedness. Failure to demonstrate quantifiable exposure to state externalities results in immediate disqualification from ballot access.

  **2.0 CLASS A: FULL CITIZENS**
  Full Citizenship is reserved for permanent residents demonstrably affected by long-term infrastructure policy over a minimum horizon of twenty years. Eligibility requires proof of residence within zones subject to zoning variance or utility grid maintenance. Class A status grants unlimited ballot access on all municipal and national measures. Renewal is contingent upon the annual Residency Impact Statement. Applicants denied Class A status may appeal to the Boundary Tribunal, provided they submit data proving their daily caloric intake is influenced by state agricultural subsidies.

  **3.0 CLASS B: PROVISIONAL STAKEHOLDERS**
  Non-resident workers, trade partners, and transient populations affected by specific tariff regimes or labor regulations are classified as Provisional Stakeholders. Upon entry, these individuals receive a Temporary Voter-Card valid strictly for the duration of the policy's externalities. For example, a truck driver hauling subsidized grain may vote on grain subsidy amendments only while physically within the customs zone. Cards expire immediately upon the cessation of the economic activity generating the affected interest. Expired cards must be returned to any kiosk; failure to return voids future eligibility.

  **4.0 CLASS C: NON-HUMAN PROXIES**
  Sentient non-human entities impacted by environmental zoning are represented via court-appointed ecological guardians. Weighted proxy ballots are issued based on biomass density and watershed dependency. In District 9, salmon migratory patterns determine the voting weight of the Aquatic Proxy Bloc. Guardians must certify that ballot selections align with the species' survival imperatives as modeled by the Department of Fisheries. Appeals regarding proxy weighting require acoustic evidence of distress signals during construction phases.

  **5.0 CLASS D: PROBABILISTIC FUTURE-GENERATION AVATARS**
  Interests of unborn citizens are represented by actuarial avatars calculated via demographic projection models. Voting power is discounted by the probability of existence; a potential citizen with a 40% likelihood of conception receives 0.4 votes. Avatars are managed by the Office of Temporal Integrity. Should demographic trends shift, avatar voting power is adjusted retroactively. Refunds for misclassified avatars are available only to current Class A citizens who can prove genetic lineage to the probabilistic entity in question.

  **6.0 CLASS M: META-VOTERS AND Boundary ADJUDICATION**
  Amendments to the AAIA formula itself are adjudicated by Meta-Voters. Eligibility for Meta-Voting is restricted exclusively to current Class A Full Citizens. This restriction ensures that only those with established long-term stakes may alter the rules of membership. Meta-Voters convene annually to adjust the impact coefficients used to classify Classes B, C, and D. During this period, all lower-class voting rights are suspended to prevent interference with the boundary-setting mechanism.

  **7.0 COMPLIANCE AND OBSERVANCES**
  All citizens must participate in the annual Boundary Integrity Day. During this holiday, Class A citizens vote on whether the AAIA successfully identified all affected parties in the preceding year. Successful verification is celebrated with a tax rebate distributed solely to verified Class A members. Complaints regarding the circularity of having current members validate the inclusivity of the membership algorithm must be filed in triplicate. Note: The Department does not accept objections regarding the normative bias of the initial coding parameters, as these were ratified by the founding Meta-Voter Assembly.

  **8.0 CONTACT**
  For questions regarding your affectedness coefficient, visit the Portal of Intended Impacts. Do not attempt to vote if your status is pending. Voting while ineligible is a Class C felony punishable by permanent exclusion from the *demos*.
