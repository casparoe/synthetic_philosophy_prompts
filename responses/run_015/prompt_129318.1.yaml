          6.  Discriminating Test Case.

  8.  **Refining the Spinoza Interpretation (Self-Correction during drafting):**
      *   Make sure I don't import outside knowledge (like *Tractatus Theologico-Politicus* specifics) unless it aligns with the prompt's provided "verdicts." The prompt gives me the data; I must derive the rule from *that*.
      *   *Prompt Data Check:* "Senate elected for life... turns the state into an aristocracy regardless of how democratic the election looks." This strongly supports Principle B (Reality over Form).
      *   *Prompt Data Check:* "Confederation... delegates with binding instructions... sovereignty never actually leaves." This supports Principle A (Mechanism of Revocability).
      *   *Tension:* The Senate case suggests appearance doesn't matter. The Token case relies on appearance (technical revocability) vs. reality (nobody uses it).
      *   *Adjustment:* Principle 2 needs to be strong. It's not just "activity," it's "where does the *vis* (force) of the decision lie?"
      *   *Principle 1:* **The Non-Alienation of Sovereignty.** Democracy is defined by the *structural capacity* of the multitude to reclaim decision-making power instantly. If the mechanism allows immediate revocation without intermediary authority, it is democratic.
      *   *Principle 2:* **The Actual Locus of Judgment.** Democracy is defined by where the *actual reasoning and decision-making force* resides. If the multitude habitually defers judgment to a separate entity (even a digital one), the *power* has migrated, making it an aristocracy of the node-designers or the logic itself.

      *   *Best Guess:* Spinoza is a realist about human nature. He knows people *want* to be led. He accepts representation (communes) because it's practical. The key is whether the representatives become a *caste*. The nodes vanish. There is no caste. Therefore, despite passivity, the *threat* of revocation keeps the nodes in check. I'll lean Democracy.

      *   *Test Case:* Needs to break the "vanishing node" safety.
