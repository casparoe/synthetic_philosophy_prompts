  (2) Your claim in (v) that self-fashioned agents are more genuinely responsible contradicts (i)'s assertion that such self-creation is impossible. You are forced to relinquish the idea that moral responsibility admits of deep metaphysical degrees.
  (3) The forward-looking justification for blame in (iii) clashes with the backward-looking obligation in (iv), suggesting your theory of blame lacks a unified justification.
  (4) The acceptance of the Basic Argument in (i) and the compatibilism in (ii) appear contradictory but are not. You explicitly restrict the former to ultimate responsibility and the latter to practical freedom.
  (5) Recasting the authorial answerability in (vi) as merely metaphorical is the cheapest revision, though it sacrifices the conviction that your ethical ownership of the text is not simply a manner of speaking.
