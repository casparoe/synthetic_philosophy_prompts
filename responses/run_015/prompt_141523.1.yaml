answer: |-
  It is entirely understandable that you find the phrase DNA is code both ubiquitous and elusive, because it functions as a stack of distinct claims compressed into a single metaphor, and the rhetorical power of the phrase comes from sliding between the weakest and strongest versions without noticing the shift. To give you the menu you asked for, we can arrange the possible meanings along a spectrum from uncontroversial description to substantive metaphysical assertion. At the weakest end, the claim is merely that DNA contains specified information, meaning the sequence of bases constrains the outcome of biological processes in a way that random sequences do not. Almost nobody denies this. Slightly stronger is the claim that DNA utilizes a combinatorial syntax, where discrete units are arranged according to rules to form larger structures. This is also largely defensible given the triplet codon structure. The next step up is the semantic claim, that these sequences carry meaning assigned by an interpreter, analogous to how letters carry meaning assigned by a language community. This is where the debate begins, because it requires defining what biological meaning is. The strongest claim, and the one required for any serious analogy to Gödel, is that DNA constitutes a formal system capable of universal computation or arithmetic representation. This is substantive and currently unsupported by evidence. Most people nodding along to DNA is code are accepting the first two claims but implicitly borrowing the authority of the last one.

  You asked whether being a code is a property of the molecule or the molecule together with a reader, and this is the ontological hinge upon which your interlocutor's argument swings. If DNA were code in isolation, like a mathematical truth, it would carry its interpretation within itself. But it does not. A strand of DNA in a vacuum is just a polymer. It becomes code only relative to a decoding mechanism that maps specific sequences to specific outcomes. Therefore, the claim DNA is code is strictly a claim about a system comprising both the genome and the cellular machinery. This means your interlocutor's third point, that the cell is hardware and the genome is software, is technically plausible only if you accept that hardware and software are not distinct substances but functional roles. However, his implication that a genome in a test tube is like a program on a wiped drive is slightly confused. A program on a wiped drive is gone; a genome in a test tube is intact but inert. It is more like a program on a hard drive disconnected from power. This distinction matters because it underscores that the code is not intrinsic to the DNA but relational. If you accept this relational view, then his first claim, that the genome is literally the organism's source code, is a defensible shorthand for saying the genome is the primary informational component of the self-replicating system, but it commits you to the view that the code cannot exist without the machine that reads it.

  This relational view directly impacts his second claim, that because codes are arbitrary conventions there is no fact of the matter about what a gene means apart from the translation machinery. Here is where you can introduce the factual corrections you remembered. It is true that the mitochondrial genetic code differs slightly from the standard nuclear code, and it is also true that synthetic biologists have successfully engineered organisms with expanded alphabets using extra base pairs. These facts support the idea that the mapping between codon and amino acid is contingent rather than law-like, which validates the arbitrariness point. However, this does not support the stronger nihilistic conclusion that there is no fact of the matter about meaning. There is a fact of the matter about what the current machinery does with the sequence. The code is arbitrary in origin but fixed in operation. Your thought experiment about an organism whose codon mapping depends on transcript folding and metabolic state tests the limits of this definition. If the mapping is dynamic but deterministic based on state, it is still a code, merely a context-sensitive one rather than a static lookup table. If the mapping is non-deterministic, it becomes noisy channel communication rather than coding. Neither case destroys the concept of code, but both challenge the interlocutor's implicit model of a fixed convention. His argument relies on the static lookup table model to suggest fragility or arbitrariness, but biology often uses dynamic rules. So his second point is partially supported by the mitochondrial evidence but overstated regarding the lack of factual meaning.

  Now we must address the version of the claim you find more interesting, the self-referential loop where the translation machinery is itself encoded in the genome. This is not the same claim as DNA is code; it is a specific structural claim about the causal architecture of the system. DNA being code is compatible with an external interpreter, like a human reading a book. The quine-like structure where the book contains the instructions to build the reader is a much stronger condition. This is indeed the isomorphism Hofstadter gestures at in typogenetics. However, you asked if this is the only reading on which incompleteness is relevant. The answer is yes, because Gödel's incompleteness theorem specifically targets formal systems capable of self-reference and arithmetic. Mere coding without self-reference does not trigger incompleteness. But even with self-reference, you face a hurdle. A quine reproduces itself, but it does not necessarily encode number theory. For Gödel's theorem to apply, the system must be sufficiently expressive to represent recursive arithmetic. While the genome encodes the ribosome, and the ribosome reads the genome, this loop establishes self-reference, it does not automatically establish that the system can formulate statements about its own provability in the logical sense required for incompleteness. Biology is constrained by physics and chemistry in ways that logical systems are not, and it is not clear that biological replication maps onto logical provability.

  This brings us to the final plank that broke in the thread, the step from code to formal system to Gödel. On none of the readings we have surveyed does this step get licensed automatically. To move from DNA is code to Gödel applies, you must demonstrate that the biological system instantiates a formal system rich enough to support arithmetic. The fact that DNA is a code only establishes syntax and semantics. It does not establish that the semantics include numbers or logical operators. You can have a code that is complete and consistent simply because it is too simple to express incompleteness. For example, a traffic light system is a code with rules, but Gödel's theorem does not apply to it. The interlocutor is smuggling in the assumption that because biology is complex and self-referential, it must be logically equivalent to Principia Mathematica. That is a massive leap. The self-referential reading you prefer makes the analogy to Gödel faintly plausible because it satisfies the self-reference condition, but it still fails to satisfy the expressive power condition unless you can show that biological states can encode arbitrary mathematical propositions. Without that, the invocation of Gödel is decorative rather than operative.

  So to summarize the commitments for your email, if you accept DNA is code in the weak sense, you are only saying DNA carries information via a combinatorial syntax, which is a platitude. If you accept it in the strong sense required for the interlocutor's argument, you are committing to the view that biology is a formal system capable of universal computation, which is substantive and unproven. His first claim works on the weak reading but implies the strong one. His second claim works only if you ignore the fixed operational reality of the translation machinery in favor of its evolutionary contingency. His third claim works only if you accept the relational ontology where code requires a reader. The quine-like structure you pointed out is the only path that even approaches the terrain where Gödel lives, but it stops short of actually entering that terrain because self-reference alone is not incompleteness. The argument falls apart not because DNA isn't code, but because code is not logic. You can tell him that while the metaphor is productive for thinking about information flow, it becomes a category error when used to import limitations from mathematical logic into biological chemistry without demonstrating the necessary isomorphism. The plank that broke was the assumption that syntax implies arithmetic, and until that is bridged, the incompleteness theorem remains a decoration on the wall rather than a load-bearing beam in the argument.
