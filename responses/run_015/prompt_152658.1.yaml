      *   *Philosophy Check:* The "fugue" sounds like Dynamical Systems Theory or Connectionism. The "choir" sounds like Classical Cognitivism or Global Workspace Theory.
      *   *False Beliefs:* If a colony marches off a cliff because pheromones looped, is that a false belief ("cliff is safe") or a system error? Millikan's teleosemantics says function determines content. If the function failed, is it a misrepresentation?
