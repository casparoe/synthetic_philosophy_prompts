      *   **Queen-Loss Hypothetical:** Ants *do* react to queen loss (usually by laying worker eggs or panic). Inventing a *novel* pheromone chemically is biologically unlikely (pheromones are evolutionary adaptations), but computationally interesting. It touches on plasticity vs. hardcoding.
      *   **Intentionality:** The user is asking about *derived* vs. *original* intentionality. Are the ants' signals *about* anything, or just causal triggers?

