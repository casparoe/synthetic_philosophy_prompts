      *   **Fugue vs. Choir:**
          *   *Fugue:* Polyphonic, independent voices, emergent harmony, no conductor. (Decentralized).
          *   *Choir:* Many voices, but following a score/conductor. (Centralized/Integrated).
          *   *Critique:* Most real-world systems are hybrids. Is "choir" just a straw man for centralized cognition? Or does it mean "globally integrated workspace" (like Global Workspace Theory)?
