answer: |-
  This is a fantastic premise for a novel. The idea of "ontological debts" suggests that existence isn't a state of being, but a ledger entry—something owed to the coherence of a story. To answer your request: yes, you can absolutely argue that the clash between the ontological pluralist (who says tables exist) and the nihilist/monist (who says only simple particles exist) is a verbal dispute rooted in pragmatic rules, without resorting to Carnap.

  Here is the case for why "exists" is a gradable adjective of narrative salience, and how this dissolves the debate without collapsing into mere expression of feeling.

  ### The Gradable Nature of "Exists"

  The traditional debate assumes "exists" is a binary logical operator. It treats existence like a light switch: either there is an $x$ that satisfies the condition of being a table, or there isn't. This forces the pluralist and the monist into a stalemate because they are both looking at the same physical reality but applying different binary switches.

  But consider how we use other adjectives. Take "tall." If you say "John is tall," you aren't stating a absolute metric. You are implicitly saying "John is tall *for a jockey*" or "tall *for a basketball player*." "Tall" is gradable; its truth conditions shift based on a comparison class.

  Your argument is that "exists" functions the same way. When the pluralist says "The table exists," they are effectively saying, "The table is salient enough in this narrative to warrant reference." When the monist says "The table does not exist," they are saying, "In the narrative of fundamental physics, the table is not salient enough; only the atoms are."

  Neither is wrong about the world. They are disagreeing about the *threshold of salience* required to earn the label "exists." The dispute is verbal because they are using the same word to track different pragmatic thresholds. The "ontological debt" in your ledgers arises when cultures try to force a single threshold for all contexts, creating a deficit when the context shifts.

  ### Scorekeeping Over Quantification

  To make this work without sounding like loose relativism, you need the mechanism of **conversational scorekeeping**.

  In any conversation, participants keep a "score" of what has been established, what is relevant, and what counts as an object for the purposes of the interaction. If two people are moving furniture, the score demands that "table" counts as an object. If one person says, "There is no table, there are only swirling clouds of electrons," they aren't making a profound metaphysical point; they are cheating at the game. They are violating the scorekeeping rules of the current conversation.

  Ontological commitment, then, isn't about what the universe contains in a God's-eye view. It is about what objects are required to keep the conversational score coherent.
  *   **Pluralists** are scorekeepers who prioritize macroscopic human narratives.
  *   **Monists** are scorekeepers who prioritize microscopic causal narratives.

  The clash dissolves because you realize they are playing different games with different scoring rules. The "debt" is incurred when you try to pay a macroscopic score with microscopic currency, or vice versa.

  ### Why This Isn't Carnap

  You specifically want to avoid Carnap's linguistic frameworks. This is crucial because Carnap's view is too static for a novel about discovery and conflict.

  Carnap argued that we choose a "linguistic framework" (like a set of rules for a language) and then ask internal questions (true/false within the rules) or external questions (whether to adopt the rules). This implies a conscious choice of a system, like choosing to play Chess instead of Checkers.

  Your view is more fluid. It's not that we *choose* a framework beforehand. It's that the framework emerges from the *flow* of the narrative. We don't decide to adopt the "table framework"; the situation of moving furniture imposes the scorekeeping rules on us automatically.

  Carnap treats language like a container we step into. Your view treats language like a current we swim in. The "rules" of existence aren't pre-written constitutions (as Carnap suggests); they are dynamic constraints generated by the needs of the interaction. This fits your novel better: the archivists aren't finding static frameworks; they are finding records of failed negotiations where the scorekeeping broke down. The "ontological debt" is the residue of a conversation where the participants couldn't agree on what counted as salient.

  ### Why This Isn't Expressivism

  The biggest risk here is sliding into expressivism—the idea that saying "Tables exist" is just a fancy way of saying "I like talking about tables." If it's just preference, then there's no truth to be had, and the archivists' ledgers are just diaries of taste.

  You must argue that this view is **objective relative to the score**.

  Expressivism says the statement reports a mental state. Your view says the statement reports a *status within a practice*.
  If we are moving furniture, and I say "The table exists," I am making a claim that can be proven false. If I try to lift the "table" and my hands pass through it (it was a hologram), I was wrong. The truth condition isn't my feeling; it's whether the object sustains the causal and narrative weight required by the conversation.

  This preserves realism without requiring absolute metaphysics. The table *really* exists relative to the score of the moving conversation. It's not just that I "express approval" of the table; it's that the table is a necessary coordinate for our joint action. If I deny it, I am not just expressing a preference; I am making a factual error about the requirements of our shared activity.

  This distinction saves your novel from nihilism. The ontological debts are real consequences. If you ignore the salience of "justice" in a legal narrative, or "money" in an economic narrative, things break. The debt isn't emotional; it's functional.

  ### Implications for the Chapter

  For your archivist character, this reframes the discovery. They aren't finding errors where people got reality wrong. They are finding records of **mismatched scorekeeping**.

  The "ontological debts" are instances where a culture tried to enforce the scorekeeping rules of one domain (e.g., the sacred/religious) onto a domain where they didn't sustain the narrative (e.g., the agricultural/seasonal), or vice versa. The conflict wasn't about whether gods or crops were "real" in a binary sense. It was about which narrative salience governed the community's actions.

  When the ledgers show a dispute over whether a "spirit" exists, the archivist can now read it not as a superstition vs. science fight, but as a clash of conversational scores. One group was keeping score for ritual cohesion; the other for material prediction. The "debt" is the social cost of trying to force a single definition of "exists" across incompatible narratives.

  This gives your character a way to resolve or understand the conflicts without needing to prove one side right. The resolution comes from identifying which scorekeeping rules were in play, and why the debt accrued when they were conflated. It makes ontology a matter of diplomatic translation rather than metaphysical warfare.
