  **What a first-class answer would have added**
  A first-class answer would distinguish the metaphysical thesis (experience is constituted by the object) from the epistemic consequence (warrant). In (c), it would explore whether the causal chain in *Mediated Vera* preserves the relevant relation for the disjunctivist, rather than dismissing it. It would acknowledge that the Vera cases test the *limits* of the disjunction (direct vs. mediated), not just repeat the hallucination argument. It would also note that the 'further question' concerns the nature of the perceptual relation, not just causal history.
