answer: |-
  You have hit on a very real and frustrating rhetorical maneuver, and your reading of Keynes is sharp. In his *A Treatise on Probability* (1921), Keynes indeed distinguishes between **risk** (where probabilities are known or calculable) and **uncertainty** (where no numerical probability exists). Crucially, he introduces the concept of the **"weight of argument"**: the idea that confidence isn't just about the probability value, but about the amount of relevant evidence. As you noted, Keynes argued that new evidence can sometimes reveal complexity that *lowers* the weight of argument (confidence), even if the probability estimate remains unchanged.

  Your friend is right that this philosophical insight is being weaponized in policy debates, but you are also right that the deployment is inconsistent.

  ### Is there an established name?

  There is no single, canonical academic term that captures *exactly* this specific toggle in the way you describe it. However, it is recognized in argumentation theory and philosophy of science as a composite of two existing concepts:

  1.  **Special Pleading:** A logical fallacy where one applies a standard, principle, or rule to others while making oneself (or one's own claims) an exception without relevant justification.
  2.  **The Motte-and-Bailey Doctrine:** A rhetorical strategy where a person conflates two positions: one modest and easy to defend (the Motte) and one controversial and hard to defend (the Bailey).
      *   *The Motte:* "The future is deeply uncertain; models are imperfect." (Hard to argue against).
      *   *The Bailey:* "Therefore, we must implement this specific quantitative carbon tax based on this specific damage model." (Easy to attack).
      *   *The Toggle:* When the Bailey is attacked, they retreat to the Motte ("You can't criticize the number, the whole situation is uncertain!"). When they want to push policy, they occupy the Bailey.

  While these terms describe the *structure*, they don't capture the specific reliance on **epistemic uncertainty** as the mechanism. In recent literature on climate economics and risk governance, this is sometimes loosely referred to as **"Epistemic Opportunism"** or **"Strategic Ambiguity,"** but those are broad.

  ### A Proposed Name and Definition

  Since you asked for a name if one doesn't exist, the most precise label for this specific phenomenon is **The Uncertainty Ratchet**.

  **Definition:**
  > **The Uncertainty Ratchet** is a rhetorical and methodological strategy where deep uncertainty (Knightian/Keynesian uncertainty) is invoked asymmetrically to block quantitative scrutiny of one's own proposals while simultaneously dismissing the quantitative models of opponents.
  >
  > It functions as a one-way gate:
  > 1.  **Offensive Mode:** Uncertainty is minimized to justify precise policy prescriptions (e.g., "Our model shows the optimal tax is $50/ton").
  > 2.  **Defensive Mode:** Uncertainty is maximized to immunize those prescriptions from failure (e.g., "If the outcome differs, it is because the system was too complex for any model to predict").
  > 3.  **Blocking Mode:** Uncertainty is maximized to dismiss opposing models (e.g., "You cannot put a number on ecosystem collapse, so your cost-benefit analysis is invalid").

  ### How it differs from Hypocrisy, Sloppiness, and Motivated Reasoning

  It is crucial to distinguish The Uncertainty Ratchet from these more common concepts, because calling it "hypocrisy" misses the epistemic danger.

  **1. Vs. Hypocrisy**
  *   **Hypocrisy** is a moral or behavioral inconsistency (e.g., "I say we should fly less, but I take a private jet"). It implies the person *accepts* the rule but violates it in action.
  *   **The Uncertainty Ratchet** is an *epistemic* inconsistency. The actor claims the rule *itself* changes depending on who is speaking. They aren't breaking a rule; they are arguing that the nature of reality allows for quantification in their case but not in their opponent's. It is a claim about *knowledge*, not behavior.

  **2. Vs. Methodological Sloppiness**
  *   **Sloppiness** is unintentional. A sloppy researcher might use a model without checking its assumptions, then be surprised when it fails.
  *   **The Uncertainty Ratchet** is defensive and reactive. The appeal to uncertainty only activates *when the model is challenged* or when *an opponent's model is advantageous*. If it were sloppiness, they would admit the error. Instead, they use the error as proof that *no* error could have been avoided (because the territory was unmappable).

  **3. Vs. Motivated Reasoning**
  *   **Motivated Reasoning** is psychological. It is the internal process of unconsciously shaping evidence to fit a desired conclusion.
  *   **The Uncertainty Ratchet** is rhetorical and external. It doesn't matter if the person truly believes the uncertainty is real; what matters is that they deploy the *concept* of uncertainty as a shield. It is a strategic choice of argumentation standards, not necessarily a cognitive bias.

  ### Why this distinction matters

  Identifying this as **The Uncertainty Ratchet** (or Epistemic Asymmetry) is vital because it corrupts the feedback loop of policy.

  In normal science or economics, if a model fails, you update the model. Under the Ratchet, if a model fails, you update the *epistemology* to say models were impossible all along. This creates a **non-falsifiable position**.

  Keynes himself would likely hate this usage. He argued for acknowledging uncertainty to encourage prudence and liquidity, not to license precise policy prescriptions that are immune to criticism. He wanted to clarify the limits of calculation, not create a loophole where calculation is mandatory for your side and forbidden for the other.

  ### How to use this in your argument

  You can tell your friend:
  > "It's not just hypocrisy; it's a specific logical fallacy called **Special Pleading** operating through a **Motte-and-Bailey** structure. But specifically regarding uncertainty, it's **The Uncertainty Ratchet**. They ratchet up uncertainty when they need to defend a failed number, and ratchet it down when they need to propose a new one. It makes their position unfalsifiable. Keynes argued uncertainty limits our confidence; they are using it to limit our scrutiny."

  This moves the debate from "you're being inconsistent" (which they can deny) to "you are changing the rules of evidence to make your claim immune to failure" (which is a structural critique of their argument).
