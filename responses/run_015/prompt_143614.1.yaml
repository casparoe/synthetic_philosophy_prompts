  5.  **Address the Specific Questions:**
      *   *Principled basis for distinction?* Yes, but not just "falsifiable vs. unfalsifiable." It's about *riskiness* of prediction and *independent testability* of auxiliary assumptions.
      *   *Landlord's deeper unfalsifiability?* Yes. Data dredging/overfitting. The rules are drawn from the failures, so they tautologically fit the past. The risk is in the *future* prediction.
      *   *Conventionalist Stratagem?* Both are using them, but of different kinds. Landlord: Redefining success ("immature"). Flatmate: Ad hoc entity modification ("migrating rust").

  6.  **Drafting the Response (Iterative Process):**

