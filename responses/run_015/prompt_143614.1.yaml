          *   *Response to Anomaly:* Moves the rust (migrating corrosion).
          *   *Claim to Falsifiability:* If boiler never failed, theory is wrong.
          *   *Nature:* Causal/Mechanistic.
          *   *Problem:* The location of the cause is unobservable/shifting to save the theory.

  3.  **Apply Popperian Framework:**
      *   **Falsifiability:** A theory is scientific if it forbids certain states of affairs.
      *   **Conventionalist Stratagem:** Protecting a theory from refutation by adding ad hoc hypotheses or redefining terms so that no observation can contradict it.
      *   **The Landlord:** Is he using a stratagem? Yes. By calling failed predictions "immature alignments," he immunizes the core claim against refutation. The "principle" falsifiability (if *nothing* matched) is too weak because "something" can always be found to match if you tweak the pattern enough (overfitting).
      *   **The Flatmate:** Is she using a stratagem? Yes. "Migrating rust" is an ad hoc hypothesis introduced solely to save the theory from the observation (intact valve). It lacks independent testability.

  4.  **Deepen the Analysis (Beyond Basic Popper):**
      *   *Lakatos:* Research Programmes. Hard core vs. Protective Belt.
          *   Landlord: Hard core = "Weather predicts boilers." Belt = Specific alignment rules.
          *   Flatmate: Hard core = "Rust causes failure." Belt = Location of rust.
          *   *Progressive vs. Degenerating:* Is the theory predicting *novel* facts?
              *   Landlord: Post-dicting. Fits past data. Does it predict *new* breakdowns before they happen with precision? If he only updates *after* failure, it's degenerating.
              *   Flatmate: If she can't find the rust, she moves it. No novel prediction (e.g., "Check joint B next week").
      *   *Bayesianism:* Prior probabilities.
          *   Rust causing boiler failure is physically plausible (high prior).
          *   Weather aligning with internal boiler mechanics without a mechanism is less plausible (low prior), unless there's a link (e.g., external pipes freezing).
      *   *Inference to the Best Explanation (Abduction):*
          *   Flatmate offers a *mechanism*. Landlord offers a *correlation*. Mechanisms are generally preferred in science *if* the entities exist.
