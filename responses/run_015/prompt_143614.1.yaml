          *   *Response to Anomaly:* Revises the pattern, calls previous version "immature."
          *   *Claim to Falsifiability:* If *no* correlation ever emerges, he'd stop.
          *   *Nature:* Phenomenological/Empirical correlation without underlying mechanism.
          *   *Problem:* The pattern is derived *from* the failures. It's curve-fitting.

      *   **Flatmate (Rusted Valve):**
