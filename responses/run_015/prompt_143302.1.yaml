  **Prediction:** Renata Voss will rule **YES** on the Sable Grid 'a'.
  **Confidence:** High (85%).

  ### The Competing Rules

  To understand why, we must formalize the three hypotheses that fit her archived record equally well.

  **1. The Morphological Rule (Your Friend's Hypothesis)**
  *   **Criterion:** A lowercase 'a' must possess a closed or nearly closed counter, a stem on the right, and that stem must remain within the x-height (no ascenders) and not descend.
  *   **Logic:** This treats the letter as a biological species with necessary physical traits.
  *   **Fit to Record:** Explains the rejection of the mirror-image (stem on left), the descender (violates height), and the previous ascender submission (violates x-height). Accommodates the "broken join" and "stretched" rulings as minor deformations of the essential structure.

  **2. The Reader-Response Rule (Your First Hypothesis)**
  *   **Criterion:** A glyph is an 'a' if competent readers identify it as such when embedded in words, regardless of its isolation appearance or geometric properties.
  *   **Logic:** This treats the letter as a tool for communication; its identity is conferred by the act of reading.
  *   **Fit to Record:** Perfectly explains the Textura ruling (unreadable alone, readable in text). Explains the "extreme display" and "stretched" rulings (readers adapt to style). It struggles slightly with the Mirror Image 'No' (unless we assume readers simply refuse to read mirrored Latin), but generally fits the functional precedents.

  **3. The Systemic Slot Rule (Your Second Hypothesis)**
  *   **Criterion:** A glyph is an 'a' if it occupies the 'a' slot within a coherent alphabetic system without colliding with the glyph assigned to the 'd' slot (or other confusable neighbors) *in that specific face*.
  *   **Logic:** This treats the letter as a position in a structure. Identity is relational, not intrinsic.
  *   **Fit to Record:** Explains the previous ascender 'No' (the 'd' in *that* face already had that shape, creating a collision). Explains the descender 'No' (collides with 'g'). Explains the Textura 'Yes' (within the Textura system, that shape *is* the 'a' slot). Explains the Mirror Image 'No' (breaks the directional grain of the Latin system, creating a systemic conflict).

  ### Application to Sable Grid

  Here is how each rule predicts the outcome for the Sable Grid submission:

  | Rule | Prediction for 'a' Slot (Ascender, Flat Terminal) | Prediction for 'd' Slot (Ascender, Beaked Terminal) | Reasoning |
  | :--- | :--- | :--- | :--- |
  | **1. Morphological** | **NO** | **YES** | The 'a' violates the x-height constraint (stem rises full ascender). The 'd' fits the standard morphological definition of a 'd'. |
  | **2. Reader-Response** | **YES** | **YES** | The reading test confirms readers identify the 'a' slot as 'a' in context. The 'd' is read as 'd' in context. Isolation failure is irrelevant (per Textura precedent). |
  | **3. Systemic Slot** | **YES** | **YES** | There is no collision. The 'a' has a flat terminal; the 'd' has a beak. They are distinct within the Sable Grid system. The 'a' occupies the 'a' slot without rival. |

  ### Best Guess and Reasoning

  **Verdict:** Voss will rule **YES**.

  **Reasoning:**
  Voss's record suggests she is not a morphological essentialist (Rule 1). If she were, the Textura 'a' would have been rejected, as textura forms often violate standard geometric counters, and the "stretched 10x width" 'a' would likely fail proportion tests. Her expertise lies in *typography*, not geometry. Typography is inherently systemic.

  The crucial distinction between the previous "ascender 'a'" rejection and the Sable Grid submission is **collision**. In the previous case, the 'd' *already had exactly that shape*. To accept the 'a' would have destroyed the legibility of that specific face by merging two slots. In Sable Grid, the designer has engineered a distinction (flat terminal vs. beaked terminal). Voss respects the internal logic of a display face. The Sable Grid has a stated generative rule (bowl + attachment), and the distribution of attachments is consistent.

  Furthermore, the Reader-Response data supports the Systemic view. While 11/15 readers called the glyph a 'd' in isolation, **15/15 read it correctly in context**. This mirrors the Textura precedent exactly: isolation legibility is secondary to contextual function.

  **What Voss would have to give up to rule NO:**
  To reject this glyph, Voss would have to elevate the Morphological Rule (Rule 1) above the Systemic and Functional precedents she has already set. She would have to admit that the Textura ruling was an anomaly rather than a principle. She would have to assert that an 'a' *cannot* have an ascender, even when the 'd' is distinct, which contradicts the logic of her previous rejection (which was based on the 'd' collision, not the ascender itself). She would effectively be ruling that *external* norms (standard 'a' height) trump *internal* consistency (the Sable Grid system), which undermines the archive's purpose of collecting *display* and *experimental* faces.

  ### The Tie-Breaker Test Submission

  To definitively separate the **Reader-Response Rule** from the **Systemic Slot Rule** (since both predict "Yes" for Sable Grid), we should commission the following test before the panel meets again.

  **The Submission:** A typeface called **"Inversion."**
  *   **The System:** A coherent display face where the 'd' slot is filled by a standard single-storey 'a' shape (bowl, stem on right, x-height), and the 'a' slot is filled by a standard 'd' shape (bowl, stem on right, **full ascender**).
  *   **The Test:** A reading test is included. Because the swap is total and consistent, readers adapt quickly and read the text correctly (identifying the ascender-glyph as 'a' and the x-height glyph as 'd' within the flow of words).
  *   **The Isolation Test:** In isolation, 15/15 readers identify the ascender-glyph as 'd' and the x-height glyph as 'a'.

  **What Her Answer Reveals:**

  *   **If she rules YES:** She is running the **Systemic Slot Rule**. She accepts that letter identity is purely relational within a face. If the system is consistent and the slots are distinct, the morphological heritage of the shape does not matter. This confirms she views the archive as a record of *functional systems*.
  *   **If she rules NO:** She is running the **Reader-Response Rule** (with a threshold for cognitive load) or a hidden **Morphological Rule**. She believes that if a glyph is too strongly associated with another letter in the broader cultural lexicon (the "deep structure" of Latin script), it cannot be repurposed, even if readers adapt. This reveals she views the archive as a record of *recognizable forms*, not just functional systems.

  **My Advice:** Submit **"Inversion."** It is the only scenario where the internal logic (Systemic) says "Valid" but the external association (Reader/Morphological) says "Invalid." Her ruling on this will tell you whether she is a structuralist or a phenomenologist.
