                  *   **MISMATCH.**
                  *   Student claims: "once $\mu(\omega_4) = 0$ the equations $x_4 = x_3/3$ and $x_4 = 3x_2$ no longer have to hold simultaneously".
                  *   Why? The conditioning formula $b_i(\omega) = \mu(\cdot | P_i(\omega))$ requires $\mu(P_i(\omega)) > 0$.
                  *   If $\mu(\omega_4) = 0$, then for Ann's cell $A_2 = \{3,4\}$, $\mu(A_2) = x_3 + x_4 = x_3$.
