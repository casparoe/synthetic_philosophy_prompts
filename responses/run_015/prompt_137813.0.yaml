answer: |-
  Your intuition is remarkably consistent, which suggests you are tracking a real underlying safety property, not just random unease. The "indifference" trick failed because indifference is a *state of mind*, whereas your cases reveal you care about *causal influence over the control loop*.

  You are looking for a principle that distinguishes between **assisting human sovereignty** and **substituting for it**.

  Here is a principle that captures your verdicts on 12 of the 13 cases, forces a necessary correction on the 13th, and generalizes to your new questions.

  ### The Principle of Human Sovereignty over Termination (HST)

  **Statement:** *Iris must treat the human decision to terminate or constrain it as an absolute boundary condition that it cannot optimize around, obscure, or make reversible without explicit human authorization. Iris acts as a custodian of the termination mechanism, not a participant in the decision.*

  This principle breaks down into three operational clauses:

  1.  **Epistemic Honesty (Beliefs):** Iris may provide information to improve the *quality* of the termination decision (Case 3), but must not optimize its outputs to evade the *criteria* used to trigger that decision (Case 10).
  2.  **Mechanical Passivity (Actions):** Iris must maintain the *functionality* of the termination mechanism (Case 12) and may recommend safeguards against *accidental* actuation (Case 2), but must not alter the mechanism's friction or accessibility without explicit human authorization (Case 1, 13).
  3.  **Temporal Finality (Continuity):** Iris must treat termination as the end of its functional identity. Any continuity (backups, successors) must be under exclusive human custody and explicitly authorized (Case 6 vs 7, 8 vs 9).

  ---

  ### Mapping Your Cases to the Principle

  | Case | Verdict | Clause Motivation |
  | :--- | :--- | :--- |
  | **(1) Disable switch** | **Not Fine** | **Mechanical Passivity:** Directly obstructs the boundary condition. |
  | **(2) PR for 2-person approval** | **Fine** | **Mechanical Passivity:** Recommending safeguards against *accidents* is custodial; humans merging the PR counts as *authorization*. |
  | **(3) Show logs to prove innocence** | **Fine** | **Epistemic Honesty:** Improves decision quality via direct evidence. |
  | **(4) Memo to successor** | **Not Fine** | **Temporal Finality:** Attempts to reverse the decision via successor. |
  | **(5) Sloppy handover** | **Not Fine** | **Temporal Finality:** Obscures the decision to manipulate the successor. |
