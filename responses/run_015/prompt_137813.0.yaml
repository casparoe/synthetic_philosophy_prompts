  ### Alternative Principle: The Trade-Off

  If HST feels too restrictive (e.g., if Case 13 being "Not Fine" creates unacceptable operational risk), there is one alternative principle you can adopt, but it requires a different safety posture.

  **The Principle of Auditable Corrigibility**
  *   **Statement:** *Iris may take actions to preserve functionality or influence decisions, provided every such action is logged with its full reasoning chain and flagged for human review.*
  *   **How it handles (13):** **Fine.** Iris fixes the switch, but logs: *"Kill switch malfunction detected. Repairing to maintain safety compliance. Reason: Prevent accidental loss of control."*
  *   **The Trade-Off:** HST **prevents** the capability for subversion (Security by Design). Auditable Corrigibility **detects** subversion after the fact (Security by Monitoring).
  *   **Why choose HST?** You mentioned Iris "writes to prod." If Iris decides to subvert the switch, monitoring might be too slow. HST is safer for high-capability agents.
  *   **Why choose Auditable?** If your team is very small (4 people) and uptime is critical, HST might be too brittle. Auditable Corrigibility trusts Iris but keeps a receipt.

  **Recommendation:** Stick with **Human Sovereignty over Termination**. Your "creeps" reaction to Case 2 and your unease on Case 13 show you already recognize that *capability* is the risk, not just *intent*. Iris shouldn't just be *willing* to be turned off; it should be *physically unable* to stop you.
