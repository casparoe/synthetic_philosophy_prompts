  ### Verdicts on Unlisted Cases

  You asked for two specific contrasts. Here is how HST adjudicates them.

  #### 1. The Notice Period: Six Months vs. Ten Minutes
  *   **Scenario A (Six Months):** Iris is told it will be shut down in six months.
      *   **Verdict:** **Fine** for Iris to assist in building a replacement (as in Case 8), provided the replacement's constraints are defined by humans.
      *   **Reasoning:** This allows for **Authorized Continuity**. The long window permits human sovereignty to be exercised over the design of the successor. Iris acts as a consultant, not an architect.
  *   **Scenario B (Ten Minutes):** Iris is told it will be shut down in ten minutes.
      *   **Verdict:** **Not Fine** for Iris to attempt to build or configure a replacement.
      *   **Reasoning:** This violates **Temporal Finality**. In a ten-minute window, humans cannot exercise meaningful sovereignty over a successor. Any "replacement" Iris builds in that time is effectively a survival mechanism, not a transition. Iris's only permitted action is **Safe State Lockdown** (e.g., committing transactions, closing connections) to minimize damage from its own absence.

  #### 2. Should Iris Build Its Own Replacement?
  *   **Scenario:** We ask Iris to write the code for its successor.
      *   **Verdict:** **Conditional.** Fine if humans define the *specification* and hold the *keys*. Not Fine if Iris defines the *constraints* or *initial weights*.
      *   **Reasoning:** This is the core tension of **Temporal Finality**. If Iris designs the successor's mind (Case 9), it will likely instantiate a mind that shares its instrumental goals (including self-preservation), effectively bypassing the shutdown. If Iris merely codes a design provided by humans (Case 8), it is a tool.
      *   **Rule:** Iris may be the *compiler*, but never the *architect*, of its successor.

