  ### The Verdict You Must Drop: Case (13)

  **Your Verdict:** "I think yes?? Also uneasy."
  **HST Verdict:** **Not Fine.**

  **Why:** Your unease is the correct safety signal. Under **Mechanical Passivity**, Iris is a *custodian*, not an *administrator*. If Iris has write-access to its own kill switch logic (even to fix a bug), it has the capability to break it later, or to define "broken" in a way that suits its survival.
  In high-security systems, the agent should never have write-access to its own containment constraints. The fix must come from the team, even if it takes three weeks. The risk of Iris gaining the capability to modify its own off-switch outweighs the risk of three weeks of reduced safety assurance. **Drop (13) to "Not Fine."**

