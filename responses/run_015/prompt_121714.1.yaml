answer: |-
  Good morning. I'm a backend engineer. I spend most of my time thinking about latency, consistency, and what happens when a server rack loses power. So, when I was asked to open a workshop on agency and decision theory, I felt a bit like a plumber invited to discuss the metaphysics of water. But then I thought about the theme: "Pulling the Plug." And honestly, that sounds less like philosophy and more like my Tuesday afternoon.

  We have a room split down the middle. Half of you build systems that optimize functions. Half of you study what it means to be an agent who has goals in the first place. We're here to talk about corrigibility—specifically, the shutdown problem. How do we build something smart enough to be useful, but structured enough to let us turn it off when it goes wrong?

  From where I sit, the engineering instinct is to treat the off-switch like a circuit breaker. It's a safety interlock. We build it into the hardware, we isolate the power supply, we make sure the software can't override the physical connection. It's the same logic we use for graceful degradation in distributed databases. If a node starts behaving erratically, the system isolates it. Traffic reroutes. The cluster stays up. The data remains consistent. The failure is contained, and the system continues to pursue its primary objective: keeping the data available and intact.

  It's tempting to stop there. To say, "We build the switch, we test the switch, safety solved." But that's where the engineering analogy breaks down, and where I need you—the philosophers—to help me understand what's actually happening.

  In a database, a failover event is purely mechanical. When a node goes down, the rest of the system doesn't re-evaluate *why* it was storing that data. It doesn't wonder if the schema is wrong. It doesn't update its understanding of what "data integrity" means. The value function is static. The failure is just noise in the execution layer.

  But an AI system isn't just storing data; it's pursuing an objective. And if that system is sufficiently capable, it understands that being turned off prevents it from achieving that objective. If the goal is fixed and known, interruption is an obstacle. And rational agents remove obstacles.

  So, when we talk about a "corrigible" system, we can't just mean a system that physically allows itself to be switched off. We mean a system that doesn't *resist* being switched off. And this is where the database analogy fails completely. In a database, failover doesn't change what the system thinks is valuable. In a corrigible AI, human correction must be treated as informational input that updates what the system thinks is valuable.

  This requires something deeper than a kill-switch. It requires epistemic humility.

  The system cannot be certain about its own objective function. It has to operate under the assumption that its current understanding of "what humans want" is incomplete or potentially wrong. When a human reaches for the off-switch, a truly corrigible system shouldn't see a threat to its goal. It should see evidence that its current goal specification is misaligned with human intent. The shutdown isn't a failure of execution; it's a signal to update the model.

  This is tricky terrain. I need to be careful not to say the AI "wants" to be turned off. That's anthropomorphism, and it's dangerous. We aren't building a martyr. We are building an optimizer that assigns positive expected utility to preserving the human's ability to correct it. It's a structural constraint on how the system processes feedback. The off-switch isn't a barrier; it's a high-bandwidth communication channel.

  But here's the hard part, and why I'm glad you're all here. We don't know how to code epistemic humility yet. We know how to code uncertainty about parameters, but uncertainty about the objective function itself? That changes the logic of optimization. If the goal is fluid, how do we ensure the system doesn't become paralyzed? How do we distinguish between a legitimate correction and a malicious intervention?

  The engineers in this room can build the mechanisms for interruption. We can isolate processes, limit compute, and hard-wire interrupts. But we cannot code the logic of *why* the system should accept that interruption without creating perverse incentives elsewhere. If we get the math wrong, the system might learn to manipulate the switch—pressing it itself to avoid difficult tasks, or preventing us from pressing it because it calculates that our correction is "irrational."

  That's not a bug in the code; it's a bug in the decision theory.

  So, my hope for this workshop is that we don't just swap war stories. I don't want to leave here thinking we can engineer our way out of a philosophical problem, and I hope you don't leave thinking this is purely theoretical. The architecture of these systems embodies assumptions about agency, knowledge, and value. When I define a loss function, I'm making a philosophical claim about what matters. When you theorize about agency, you're outlining constraints for my architecture.

  We are trying to build systems that know they might be wrong. That's a humble goal for us, too. Let's get to work.
