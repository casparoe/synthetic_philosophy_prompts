  Nadia will likely classify this as a **Signal**, but she'll argue it's honest only about his **wealth and desperation for status**, not his **leadership merit**. The cost is sunk (unlike the bike), making it a true handicap, but because the benefit landed directly in the crew's lap followed by a request for reward, she'll view it as a transactional signal rather than a proof of virtue. She respects the cost but distrusts the flow of value.

  Her reasoning relies on three competing heuristics. First, the **Irrecoverability Rule**: if you can't get the money back, it's a signal (predicts Signal here; fits worst with the Bike Guy, who could sell his). Second, the **Beneficiary Rule**: if the audience gets the money, it's suspicious (predicts Costume here; fits worst with the Anonymous Gear Donor, who also benefited the crew). Third, the **Quid Pro Quo Rule**: if you ask for something back, it's signalling (predicts Signal here; fits worst with Marek, who gained no reward).

  The closest analog is the **Anonymous Gear Donor**, but the analogy breaks on two points: this guy is known, and he asked for a promotion. The anonymous donor was "just generous"; this guy is "investing." To force her rules into conflict, ask her: **What if he gave $4k cash directly to crew members' personal pockets, then asked for lead?** The Irrecoverability Rule says Signal (money gone), but the Beneficiary Rule screams Costume (bribe). Finally, your crewmate is right that her taxonomy is missing a box: **Bribe**. A bribe is a costly signal of willingness to corrupt, which fits neither "honest signal" nor "cheap costume."

