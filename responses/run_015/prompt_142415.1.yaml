  *(Refining the Off-Policy Condition)*: The prompt asks to argue for or against it. I should argue *for* it as a necessary condition for *explanatory* power (vs descriptive fit), distinguishing it from mere counterfactuals by emphasizing *intervention* and *out-of-distribution* performance.

  *(Refining the Disputes)*:
  1. LLMs: If they fail off-policy (break under adversarial prompting or distributional shift), intentional stance is instrumental.
  2. Behavioralism: If implementation matters, then a lookup table fails the "Causal Integration" or "Off-Policy" test (it can't handle novel inputs not in the table).

