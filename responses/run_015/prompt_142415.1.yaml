answer: |-
  **Seminar Specification: Adequacy Conditions for Real Patterns and the Intentional Stance**

  **Purpose**
  To establish a normative framework for adjudicating two specific disputes: (1) whether intentional attribution to Large Language Models (LLMs) is explanatory or merely instrumental, and (2) whether behavioral equivalence entails pattern identity, or if implementation and history constrain pattern reality.

  **I. The Desiderata**
  The following conditions are sorted by their status in a theory of real patterns. "Adequacy" denotes conditions required for the concept to function scientifically; "Negotiable" denotes parameters open to tuning; "Sectarian" denotes conditions that beg the question against one of the opposing camps in the target disputes.

  **A. Genuine Adequacy Conditions (Non-Negotiable)**
  1.  **Predictive/Compressive Payoff:** The intentional description must yield predictions about the system's behavior that are at least as accurate as the physical/design stance but with significantly lower computational cost or complexity.
      *   *Case:* Attributing "belief" to a thermostat is rejected because the physical stance is cheaper. Attributing "belief" to a chess engine is accepted because calculating physical states is intractable.
      *   *Relevance to Disputes:* Essential for the LLM dispute. If prompting an LLM with intentional queries yields no compression over analyzing weights, the stance is merely poetic.
  2.  **Counterfactual Robustness:** The pattern must support predictions not just for actual history, but for non-actualized scenarios consistent with the system's nature.
      *   *Case:* A system that accidentally mimics rational behavior once does not have beliefs; a system that would act rationally across similar possible worlds does.
      *   *Relevance to Disputes:* Crucial for the Behavioralism dispute. Two systems with identical I/O histories may diverge in counterfactual scenarios if their internal implementations differ (e.g., a lookup table vs. a reasoning engine).
  3.  **Causal Integration (No Magic):** Intentional patterns must be realized by physical mechanisms such that the causal powers of the system are exhausted by the physical stance, even if the intentional stance is heuristically superior.
      *   *Case:* We cannot accept a pattern that implies the system bypasses physical laws to achieve its "goals."
      *   *Relevance to Disputes:* Prevents the LLM debate from devolving into dualism. The LLM's "goals" must be grounded in its architecture, not mystical agency.

  **B. Negotiable Preferences (Parameters)**
  4.  **Threshold of Compression:** How much more efficient must the intentional stance be than the design stance?
      *   *Consideration:* Dennett suggests "significant" gain, but this is context-dependent. In cognitive science, a 5% predictive gain might justify intentional attribution; in physics, it might not.
      *   *Status:* Tunable based on the domain of inquiry.
  5.  **Granularity of Attribution:** Whether we attribute coarse-grained states (e.g., "wants food") or fine-grained propositional attitudes (e.g., "believes *p*").
      *   *Consideration:* Coarse grains are more robust; fine grains are more explanatory.
      *   *Status:* Dependent on the resolution required by the specific scientific project.

  **C. Sectarian Prejudices (Question-Begging)**
  6.  **Strong Non-Relativity (Realist Prejudice):** The demand that patterns exist independently of any observer's descriptive scheme.
      *   *Critique:* Contradicts Dennett's core thesis that stances are tools. If adopted, this automatically rules out Dennettian accounts in favor of Fodorian realism.
      *   *Status:* Rejected for this specification. We seek *stance-independent detectability*, not *stance-independent existence*.
  7.  **Strict Mechanistic Exhaustion (Mechanist Prejudice):** The demand that a pattern is not real unless it maps 1:1 onto a localized neural or silicon module.
      *   *Critique:* Rules out distributed processing and functional realization. If adopted, this automatically decides the LLM dispute against intentionality before analysis.
      *   *Status:* Rejected. Real patterns can be multiply realized.
  8.  **Behavioral Sufficiency (Anti-Realist/Instrumentalist Prejudice):** The demand that I/O history is the *only* data relevant to pattern attribution.
      *   *Critique:* Ignores the role of etiology and structure in determining robustness. If adopted, this decides the Behavioralism dispute in favor of the lookup table.
      *   *Status:* Rejected. History and structure inform counterfactual robustness.

  **II. The Off-Policy Condition**
  *Definition:* A posit counts as tracking a real pattern only if the predictions it licenses continue to beat the lower stance under interventions its author never saw in the data the description was inferred from.

  **Argument for Inclusion:**
  This is not merely a restatement of Counterfactual Robustness; it is a **strengthening** required for the LLM dispute. Standard counterfactuals often remain within the training distribution (e.g., "If the board were slightly different..."). The Off-Policy Condition demands generalization to *interventions* outside the inference distribution (e.g., "If the maze is rotated," "If the prompt structure is adversarially altered").

  **What It Rules Out:**
  1.  **Overfitted Intentionality:** It excludes systems that mimic rationality only on-distribution. An LLM that acts rationally on standard prompts but collapses under distributional shift fails this condition. Its "beliefs" are not real patterns; they are compressed descriptions of its training data, not its cognitive architecture.
  2.  **The Perfect Actor (Lookup Table):** A lookup table can match I/O history perfectly (satisfying Behavioral Sufficiency) but fails the Off-Policy Condition for any input not explicitly stored. It cannot handle the "rotation of the maze" unless that specific rotation was pre-computed.

  **Verdict:**
  The Off-Policy Condition is a **Genuine Adequacy Condition** for *explanatory* utility. Without it, intentional attribution is merely curve-fitting. It distinguishes between a system that *has* a goal (and will pursue it under novelty) and a system that *simulates* having a goal (within known parameters).

  **III. The Exclusionary Workhorse**
  The single requirement doing the most work in excluding otherwise attractive accounts is the **Off-Policy Condition**.
  *   It excludes the **Instrumentalist/Behavioralist** account of LLMs: Even if an LLM predicts text perfectly, if its "beliefs" vanish under adversarial intervention, the intentional stance offers no *explanatory* leverage over the design stance (weights + tokens).
  *   It excludes the **Lookup Table** solution to the Behavioralism dispute: A lookup table satisfies I/O identity but fails off-policy generalization for novel inputs. Thus, implementation *does* matter, because implementation determines off-policy capacity.

  **IV. Flagged Inconsistency**
  There is a tension between **Causal Integration** and **Predictive Payoff** when combined with the **Off-Policy Condition**.
  *   *The Tension:* Dennett wishes to maintain that the intentional stance is autonomous from the physical stance (we don't need to know the physics to use the intentional stance). However, the Off-Policy Condition requires us to know how the system responds to *interventions*. In complex systems (like deep neural nets), off-policy behavior is often determined by physical/architectural details invisible to the intentional stance.
  *   *The Risk:* To verify the Off-Policy Condition, we may be forced to revert to the Design or Physical stance, undermining the claim that the Intentional stance is independently explanatory. If we must check the weights to know if the "belief" survives rotation, the "belief" was never the primary explanatory vehicle.
  *   *Seminar Question:* Can a pattern be "real" if its robustness conditions are only verifiable from a lower stance?

  **V. Scorecard of Contenders**

  | Account | Handles LLM Dispute? | Handles Behavioralism Dispute? | Fatal Flaw per Specification |
  | :--- | :--- | :--- | :--- |
  | **Strict Behaviorism** | No. Cannot distinguish parrot from agent. | No. Equates lookup table with reasoner. | Fails Off-Policy Condition. |
  | **Fodorian Realism** | Yes (if modules exist). | Yes (structure matters). | Fails Causal Integration (too demanding on modularity). |
  | **Dennettian Instrumentalism** | Yes (if compression holds). | Yes (if counterfactuals diverge). | Risks inconsistency on Off-Policy verification (see IV). |
  | **Mechanistic Reductionism** | No (denies intentional level). | Yes. | Fails Predictive Payoff (too costly to be useful). |
