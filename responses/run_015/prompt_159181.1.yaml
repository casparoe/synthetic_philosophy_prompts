answer: |-
  Here is a specification of desiderata for an adjudicative theory of synchronic phenomenal unity, structured to meet your constraints.

  ### I. The Adjudicative Desiderata

  These are the conditions a theory must meet to function as a tool for the clinician/metaphysician interface you described.

  | # | Desideratum | Motivation / Case | Status | Covert Work Check |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Phenomenal/Access Distinction** | **Case:** Blindsight/Neglect. A patient denies seeing a stimulus (no access/report) but guesses correctly (processing exists). <br>**Requirement:** The theory must not count informational insulation or lack of report as sufficient for a distinct subject. | **Non-Negotiable** | Favors *Realism* over *Operationalism*. Excludes strict Behaviorism. |
  | **2** | **The Surgical Asymmetry Constraint** | **Case:** Callosotomy (conflict) vs. Callosal Agenesis (often normal). <br>**Requirement:** The theory must explain why severing connections creates (or reveals) disunity, while lacking them from birth might not, without appealing solely to plasticity (which is a mechanism, not a metaphysical ground). | **Non-Negotiable** | Favors *Dynamic/Process* views over static *Structural* views. |
  | **3** | **The Report Bottleneck Protocol** | **Case:** Split-brain verbal report comes from the left hemisphere. <br>**Requirement:** The theory must specify evidence conditions that distinguish (a) one subject with partial access, (b) two subjects with one speaking, and (c) one subject confabulating. It cannot define unity as "what is reportable." | **Non-Negotiable** | Favors *Third-Person Markers* (e.g., IIT, Neural Synchrony) or *Inference to Best Explanation*. Excludes *Verificationism*. |
  | **4** | **The Mute Stream Verdict** | **Case:** A hemisphere is anesthetized or disconnected from motor output but shows neural signatures of processing. <br>**Requirement:** The theory must deliver a truth-apt verdict on whether a subject exists there, even if no behavior is possible. | **Preference** (Internal to Realism) | **Heavy Covert Work.** Favors *Substantialism/IIT*. Excludes *Quietism* and *Functionalism*. |
  | **5** | **The Stakes Condition** | **Case:** Moral/Legal responsibility. <br>**Requirement:** The theory must specify what turns on the count. (e.g., If $N=2$, does punishing the body wrong the silent subject? If $N=1$, is the "alien hand" action voluntary?) | **Non-Negotiable** | Favors *Ethical Naturalism*. Excludes *Epiphenomenalism* about unity. |
  | **6** | **The Transitivity/Degree Tolerance** | **Case:** Partial unity in split-brain (some integration remains via subcortical pathways). <br>**Requirement:** The theory must declare whether unity is an equivalence relation (transitive) or admits of degrees. It cannot equivocate. | **Non-Negotiable** | **Tension Point.** (See Section III). |
  | **7** | **The Explanatory Role Clause** | **Case:** Rational inference requires co-conscious premises. <br>**Requirement:** The theory must state whether unity *explains* cognitive capacities or is *explained by* them. | **Preference** | Favors *Kantian/Functionalist* views if unity explains; *Phenomenal Primitivism* if vice versa. |

  ### II. Jointly Unsatisfiable Subsets (The Tensions)

  You asked to flag subsets that cannot be jointly satisfied. There are two primary trilemmas here.

  **Tension A: The Logic of Unity**
  1.  **Unity is an Equivalence Relation:** If Experience A is unified with B, and B with C, then A is unified with C. (Required for a determinate subject count).
  2.  **Unity Admits of Degrees:** Split-brain data suggest partial integration (e.g., visual fields separate, affective states shared).
  3.  **Determinacy of Subject Count:** There is a fact of the matter whether there is 1 or 2 subjects.

  *Verdict:* You cannot have all three. If (2) is true, (1) fails (transitivity breaks). If (1) is true, (2) is illusory (it's either one field or two). Most theories sacrifice (3) to save (1) and (2) (leading to *indeterminacy* of subject count), or sacrifice (2) to save (1) and (3) (leading to *threshold* views).
  *Recommendation:* Sacrifice (1). Treat unity as a graded relation of *co-consciousness strength*. This forces you to abandon the idea that "subject count" is always an integer.

  **Tension B: The Epistemic/Metaphysical Gap**
  1.  **Report Bottleneck:** We only have access to consciousness via report/behavior.
  2.  **Mute Stream Verdict:** We must know if a non-reporting stream is a subject.
  3.  **No Question-Begging:** We cannot define subjecthood as "capacity to report."

  *Verdict:* To satisfy (2) and (3) given (1), you must rely on a **Subpersonal Proxy** (e.g., neural integration). But this risks violating the **Phenomenal/Access Distinction** (Desideratum 1) if the proxy is merely functional.
  *Recommendation:* The theory must commit to a *Necessary Connection* between the subpersonal proxy and the phenomenal state, or admit that the Mute Stream verdict is theoretical postulation, not empirical discovery.

  ### III. The Exclusionary Requirement

  The single requirement that excludes the largest share of views currently in play is:

  **Desideratum 4: The Mute Stream Verdict.**

  *   **Why:** Global Workspace Theory (GWT) and Behaviorist/Functionalist accounts generally tie consciousness to availability for report or global control. If a stream is mute and disconnected from the "workspace" or motor output, these theories often imply there is "nothing it is like" to be that stream, or that the question is meaningless.
  *   **Excluded:** Strict GWT, Verificationist approaches, Quietism, some versions of Higher-Order Thought (if the mute stream lacks the higher-order state).
  *   **Included:** IIT, Substance Dualism, Phenomenal Primitivism, some forms of Russellian Monism.
  *   **Cost:** Accepting this desideratum forces you to rely on neural correlates as truth-makers for experience, which invites the "Hard Problem" objection (why *this* neural signature?).

  ### IV. Adjudication of Your Candidate List

  Here is the assessment of the specific requirements you proposed, sharpened for your thesis.

  1.  **Ordinary Case (Normal Unity):** **Keep.** But sharpen: It must not require a "homunculus" to hold the unity together. The unity must be intrinsic to the experiences.
  2.  **Surgical Cases (Split vs. Agenesis):** **Keep.** This is your primary data set. *Refinement:* Add the constraint that the theory must handle *dynamic* shifts (e.g., seizures or temporary inactivation), not just static surgical states.
  3.  **Pseudo-Splits (Blindsight, etc.):** **Keep.** This is the "Informational Insulation Trap." A theory that equates informational encapsulation with phenomenal separation fails here.
  4.  **Distinctions (Phenomenal vs. Access vs. Agency):** **Keep.** This is methodological hygiene. *Refinement:* Add "Unity of Ownership" (mineness) vs. "Unity of Field" (co-consciousness). Split-brain patients often retain a sense of singular ownership despite field fragmentation.
  5.  **Logic of Unity (Degree vs. All-or-Nothing):** **Flag as Tension.** As noted in Tension A, you likely cannot demand both transitivity and degrees. *Recommendation:* Demand the theory *choose*, rather than demanding it accommodate both.
  6.  **Report Bottleneck:** **Keep.** This is your strongest methodological tool. It prevents the theory from collapsing into "whatever the left hemisphere says."
  7.  **Explanatory Work:** **Adjudicate:** A theory *should* show unity does work (e.g., enables comparative judgment across modalities). If unity is idle, it is metaphysically suspicious. However, it need not explain *all* rational inference (some can be subpersonal).
  8.  **Subpersonal Mechanism:** **Adjudicate:** The theory *may* answer at the subpersonal level, but it **must not identify** unity *with* the mechanism. (The mechanism *grounds* unity; it is not the unity itself). It need not commit to one mechanism across cases (multiple realizability), but it must commit to one *structural relation* (e.g., integration).

  ### V. Scoring the Familiar Families

  This table scores how well standard families meet the **Non-Negotiable** desiderata (1, 2, 3, 5, 6) and the **Exclusionary** one (4).

  | Theory Family | 1. Phenomenal/Access | 2. Surgical Asymmetry | 3. Report Bottleneck | 4. Mute Stream (Exclusionary) | 5. Stakes | 6. Transitivity/Degree | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Subsumption** (Bayne) | Pass | Pass | Pass | **Fail** (Relies on experiential parts) | Pass | Pass (Field-based) | Strong contender, struggles with mute streams. |
  | **Primitive Co-consciousness** (Dainton) | Pass | **Struggle** (Why does cutting stop primitives?) | Pass | **Fail** (Epistemically inaccessible) | Pass | Pass (Equivalence) | Metaphysically robust, empirically rigid. |
  | **Integrated Information** (IIT) | **Fail** (Conflates functional integration) | Pass | Pass | **Pass** (Calculates $\Phi$ regardless of output) | **Struggle** (Panpsychist implications) | Pass (Degree-based) | Best on Mute Stream, worst on Phenomenal/Access distinction. |
  | **Global Workspace** (GWT) | **Fail** (Identifies unity with access) | **Struggle** (Predicts more splits than found) | **Fail** (Defines by report bottleneck) | **Fail** (No workspace = no subject) | Pass | Pass (Threshold) | Poor fit for metaphysical adjudication. |
  | **Quietist / Dismissivist** | Pass | Pass | Pass | **Fail** (Denies the question) | **Fail** (Denies stakes) | N/A | Avoids the job entirely. |

  ### VI. Summary of Strategic Advice

  1.  **The Core Conflict:** Your thesis will gain traction if you focus on **Tension A (Transitivity vs. Degree)**. Most literature tries to smooth this over. If you force the theories to declare themselves here, the field clears significantly.
  2.  **The Stakes:** Do not leave the "why care" question to the conclusion. Use it to filter theories. If a theory says there are two subjects but no ethical difference, it fails Desideratum 5.
  3.  **The Mute Stream:** If you include Desideratum 4, you are effectively ruling out functionalist accounts. Be explicit that this is a choice to prioritize *metaphysical realism* over *epistemic caution*.
  4.  **Covert Commitments:** Watch out for the "Unity explains Rationality" move. This is often a Kantian smuggler. If unity is required for rationality, and split-brain patients are rational (in some domains), does that prove unity remains? Or that rationality doesn't require unity? This is a key argumentative lever.

  **Final Recommendation:** Adopt **Desiderata 1, 2, 3, and 5** as non-negotiable. Treat **4 (Mute Stream)** as a "Realist Option" that you explicitly argue for or against. Force the **Transitivity/Degree** issue (6) to be the primary metaphysical battleground where theories are judged.
