          *   *Fatal:* Evidence that the target subclass is discrete (quantized phenomenology). No Sorites = No MFE application.
          *   *Serious:* Evidence that metacognitive monitoring is significantly more accurate than first-order, breaking the "closeness" assumption.
          *   *Absorbable:* Evidence that the module is fallible (fits Williamson).
      *   *Section 3: Conceptual Defeaters.* Phenomenal vs. Epistemic.
          *   *Fatal:* Constitution view (Phenomenology *is* Epistemic Access).
