  2.  **Analyze the Core Philosophical Framework (Dennett's Intentional Stance):**

      *   *Physical Stance:* Predict based on physical laws/state (e.g., circuitry).
      *   *Design Stance:* Predict based on function/design (e.g., it's a calculator, it adds).
      *   *Intentional Stance:* Predict based on beliefs, desires, and rationality (e.g., it wants to win, it thinks I'm bluffing).
      *   *Dennett's Criterion:* Use the IS when it yields predictive power that the lower stances cannot efficiently match, *and* the system is sufficiently complex.
