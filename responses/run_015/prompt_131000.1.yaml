answer: |-
  Good morning. It is a genuine privilege to welcome you to this workshop, 'Expertise at the Boundaries'. Looking around the room, I am struck by the deliberate composition of our gathering. We have here scholars who spend their days analysing the architecture of justification, alongside policy researchers, archivists, and family members who navigate the messy reality of how knowledge is actually used in the world. This bifurcation is not an accident; it is the point. We are here to discuss where expertise ends, and where presumption begins.

  It is fitting that we convene this discussion partly in honour of a colleague who is retiring this year. For two decades, their work has reminded us that institutional knowledge is not a boundless ocean, but a series of distinct, carefully maintained pools. They have taught us that epistemic humility is not a weakness of authority, but its necessary condition. Today, I want to frame our proceedings around a specific philosophical tension that mirrors the practical challenges our colleague identified. I want to talk about the difference between knowing a fact and knowing what that fact implies.

  In analytic epistemology, there is a compelling idea about what it means to know something. It suggests that to truly know a proposition, your belief must be sensitive to the truth. Put simply, if the fact were different, your belief would change accordingly. If you claim to know it is raining outside, you must be in a position where, had it not been raining, you would not believe it was. Your belief must 'track' the state of the world. This seems like a reasonable standard for expertise. We expect our institutions to track reality, not merely to hold stubborn convictions.

  However, there is a competing intuition that governs much of our institutional logic. This is the principle of closure. It suggests that knowledge is transitive. If you know proposition A, and you know that A guarantees proposition B, then you automatically know B. In the abstract, this seems undeniable. If I know I am holding a red apple, and I know that red apples are fruit, then I know I am holding a fruit. We expect our institutions to operate this way. If a government department knows the budget is balanced, and a balanced budget entails no deficit spending, we assume the department knows there is no deficit spending.

  The trouble arises when we apply the 'tracking' standard to this transitive logic. It turns out that you can track the truth of A without tracking the truth of B, even if A guarantees B. You might know you are holding an apple because if you weren't, you wouldn't believe you were. But you might not know you are not hallucinating the apple, because if you were hallucinating, you would still believe you were holding an apple. Your belief tracks the apple, but it does not track the reality of the hallucination. Consequently, the closure principle fails. You know the apple, but you do not know the entailment.

  Why does this matter for a room half-filled with policy researchers and archivists? Because institutions constantly behave as if closure holds, even when tracking fails. They assume that expertise in one domain automatically grants authority in an adjacent domain, simply because the second domain seems logically entailed by the first. This is where institutional overreach occurs. It is where the boundary of expertise is mistakenly treated as a porous membrane rather than a wall.

  Let me offer a concrete scenario to ground this. Consider the British National Coal Board in the 1950s. In the post-war period, there was immense pressure to utilise land above closed collieries for housing developments. The Coal Board possessed rigorous expertise regarding the status of the mine shafts themselves. They could know, with high sensitivity, whether a specific shaft had been properly sealed. If a shaft had not been sealed, their data would have reflected it. Their belief tracked the condition of the shaft.

  However, the Board often extended this authority to certify the stability of the surface ground for residential construction. The logic was closure-based: If the shafts are sealed (A), and sealed shafts imply stable ground (B), then we know the ground is stable. But the tracking condition failed. In nearby possible worlds where the ground was unstable due to complex geological subsidence unrelated to the shaft integrity, the Coal Board's data on the shafts would have remained exactly the same. They would have believed the ground was safe, even if it were not. Their expertise tracked the engineering of the seal, but it did not track the geology of the surface. By treating the entailment as automatic knowledge, they authorised housing on land that was not safe. They assumed closure where they lacked sensitivity.

  This is the structural problem we face today. Whether we are discussing archival authentication, public health modelling, or economic forecasting, we frequently encounter this slide. An archivist knows a document is authentic based on ink analysis. They assume this entails knowing the historical narrative the document supports. But the ink can be period-correct even if the narrative is a fabrication. The belief tracks the ink, not the truth of the history. A health agency knows a vaccine is chemically pure. They assume this entails knowing it will be effective in a specific community. But purity tracks the lab conditions, not the social variables of the field.

  Our retiring colleague has spent twenty years warning us against this specific transitive leap. Their work demonstrates that institutional humility requires us to break the chain of closure. We must ask, for every new domain we claim to understand: do we track the truth here? Or are we merely riding the coattails of a different expertise?

  To the philosophers in the room, I say: your technical distinctions are not merely academic puzzles. They are the blueprints for institutional safety. When you analyse why closure fails under tracking conditions, you are providing the tools to prevent policy errors. To the policy researchers and archivists, I say: your scepticism of 'obvious' entailments is a form of epistemic rigour. When you refuse to assume that knowing one thing grants you authority over its consequences, you are practising the humility our colleague championed.

  As we move into the sessions today, I invite you to hold this tension in mind. We are not here to resolve the philosophical debate between tracking and closure. We are here to use that friction to illuminate the boundaries of our own work. When we claim expertise at the boundary, we must ensure we are not simply assuming that because we know the premise, we know the conclusion. We must ensure our beliefs track the reality of the new domain, not just the logic of the old one.

  Our colleague leaves us with a department that is far more aware of its own limits than the one they joined. That is a rare and precious legacy. Let us honour that contribution by ensuring that our discussions today treat expertise not as a blanket authority, but as a specific, sensitive relationship with the truth. Thank you.
