answer: |-
  Your observation identifies a sophisticated and deeply structural phenomenon that sits at the intersection of organizational sociology, regulatory theory, and market dynamics, and while there is no single universally canonical term that captures the entire three-act cycle you described, the pattern is well-recognized in fragments across several disciplines. The dynamic you are describing is most precisely understood as a specific form of institutional decoupling driven by competitive pressure, often discussed under the umbrella of symbolic regulation or bureaucratic ritualism, but these existing terms usually focus on the organizational behavior rather than the market equilibrium restoration that you have correctly identified as the central engine of the cycle. In organizational sociology, particularly in the work of Meyer and Rowan, the concept of decoupling describes the separation of an organization's formal structure, such as policies and compliance mandates, from its actual work practices, allowing firms to maintain legitimacy without disrupting efficiency. This aligns closely with your second case where the human-in-the-loop form becomes automated documentation, yet it does not inherently explain why the regulation converges on the ineffective version specifically to neutralize the competitive disadvantage of the cautious actor. Similarly, the concept of bureaucratic ritualism, originating from Robert Merton's strain theory, describes a scenario where adherence to rules becomes an end in itself, displacing the original goals of the organization, which mirrors the transformation of adversarial testing into a two-week checklist, but again, this sociological framing does not fully account for the economic pressure that forces the regulation to be cheap enough to restore parity between the cautious and the reckless.

  You are also touching upon Goodhart's law, which states that when a measure becomes a target, it ceases to be a good measure, and this is certainly mechanistic fuel for the dynamic you observed, as the specific safety measure is converted into a compliance metric that can be gamed or minimized. However, Goodhart's law is a broader principle about metrics and does not specifically describe the post-crisis governance cycle where the primary outcome is the stabilization of market competition rather than merely the corruption of a metric. There is also the concept of symbolic regulation in political science, which refers to laws passed to reassure the public that action is being taken without imposing substantial costs on the regulated industry, and while this is very close to your description, it often implies a deliberate intent to deceive or placate, whereas your pattern suggests a systemic inevitability where standardization itself strips away the nuance required for genuine safety, regardless of the regulator's intent. Consequently, while these concepts are the nearest established ideas, none of them individually capture the specific feedback loop where a crisis validates the need for protection, but the institutional response prioritizes competitive parity over protective efficacy, effectively trading safety for market stability.

  To distinguish this from ordinary regulatory capture, one must look at the mechanism of failure rather than the source of influence. Regulatory capture implies that the industry has co-opted the regulator to write rules that protect incumbent profits, often by raising barriers to entry or suppressing innovation, but in your scenario, the regulation lowers the barrier for the reckless competitor by legitimizing their低成本 approach while forcing the cautious competitor to abandon their superior safety protocols in favor of the standardized ritual. The outcome looks similar to capture because the industry wins, but the dynamic is different because the regulator is often acting to restore a level playing field, inadvertently codifying the lowest common denominator as the standard. This also differs from the alignment tax, which describes the performance penalty incurred by implementing safety measures, whereas your dynamic describes the removal of that tax through the removal of the safety measure itself, masked by the appearance of compliance. It is distinct from a simple race to the bottom because a race to the bottom implies a continuous downward spiral of standards, whereas your pattern describes a stabilization point where the bottom becomes the floor, institutionalized by law to prevent the cautious actors from gaining a disadvantage, effectively freezing the industry at a level of safety that is sufficient for legality but insufficient for actual risk mitigation.

  Since there is no single established name for this exact dynamic, I propose defining it as ritualized compliance equilibrium, which can be precisely defined as a post-crisis governance cycle wherein a functional safety constraint is transformed into a transactional compliance cost to restore competitive parity between cautious and reckless market actors. The boundary conditions for this definition rely on distinguishing between imperfect regulation and performative regulation. In cases where regulation genuinely improves safety despite being watered down, there remains a causal link between the mandated action and risk reduction, even if that link is weaker than the original voluntary safeguard. For example, if a mandated two-week checklist catches fifty percent of the failure modes that the original year-long testing would have caught, that is imperfect but substantive regulation. In contrast, ritualized compliance equilibrium is present when the mandated action retains the form of the safeguard but severs the causal link to risk reduction, serving primarily to equalize operational costs across competitors while providing legal cover. The key differentiator is whether the regulation reduces the specific risk that caused the crisis or merely reduces the variance in compliance costs between firms. If the regulation allows the reckless firm to continue operating with the same underlying risk profile as before the crisis, while forcing the cautious firm to downgrade their protections to match, the dynamic is one of ritualized equilibrium rather than genuine safety improvement. This distinction is critical because it shifts the analytical focus from the intent of the regulators to the structural incentives of the market, recognizing that the pressure to maintain competition can be just as potent as the pressure to cut costs in shaping safety outcomes. Your intuition that this is a distinct pattern from the alignment tax or regulatory capture is correct, as it highlights a failure mode of governance where the solution to a market distortion becomes a mechanism for neutralizing safety advantages rather than amplifying them.
