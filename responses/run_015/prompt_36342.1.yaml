  To the Department Head and Colleagues

  Following the directive to engage in adversarial collaboration, we have spent the past year examining the foundational divergences that have historically characterized our respective positions within the department. This memorandum serves as our joint initial statement, recording the points of convergence we have established, the precise boundaries of our remaining disagreements, and the specific cruxes upon which future resolution might depend. We write this not to declare a victory for either side, but to map the logical terrain we now share, having moved from mutual suspicion to a structured understanding of where our mathematics aligns and where it fundamentally parts ways. Our collaboration has yielded a significant body of common ground regarding the formal relationships between our systems, even as the philosophical interpretations of those relationships remain contested. We begin by recording the claims both can accept without reservation, specifically regarding the technical connections between classical and intuitionistic frameworks. We agree that the double-negation translation embeds classical arithmetic into intuitionistic arithmetic and so yields a relative consistency result, demonstrating that if intuitionistic arithmetic is consistent, then classical arithmetic is consistent as well. This formal fact is not merely a technical curiosity but a stable bridge between our practices, ensuring that no contradiction arises in the classical system that does not also arise in the constructive one. Furthermore, we agree on the informational content of our respective proofs, acknowledging that unrestricted classical existence proofs genuinely fail to supply the witness-providing information that constructive proofs supply. When a classical proof asserts existence via contradiction, it provides no algorithm for finding the object, whereas a constructive proof necessarily contains the method for its production. Additionally, we have reached a consensus regarding the status of familiar theorems such as the intermediate value theorem, acknowledging that while the classical statement fails constructively, the theorem survives constructively only with strengthened hypotheses such as local nonconstancy or a positive lower bound away from zero. These are not matters of opinion but formal realities that neither party disputes, forming the bedrock of our continued cooperation.

  However, having established these formal agreements, we must turn to the exact statements of our remaining disagreements, each phrased so that its own side would accept the wording without conceding the other's premise. Our first divergence concerns the semantic foundation of our logic, specifically whether a truth-conditional or a proof-conditional semantics is the right account of what the logical constants mean. The classicist maintains that truth conditions precede proof conditions, while the constructivist maintains that proof conditions constitute meaning. Closely related to this is our disagreement regarding ontology and infinity, specifically whether the classical mathematician's quantification over an undecidable infinite totality is a legitimate idealization or an overreach into reference without content. Here the classicist views the totality as a valid object of discourse despite undecidability, whereas the constructivist views such quantification as lacking cognitive content unless tied to a finite procedure. Finally, we disagree on the philosophical import of our formal connections, specifically whether the double-negation translation shows the two camps are talking about the same subject in different modes or about different subjects altogether. The classicist should be allowed to say the translation preserves content, implying we are discussing the same mathematical reality with different tools, while the constructivist must be allowed to say it preserves only form while changing what is being asserted, implying that the classical statement is a shadow of the constructive reality rather than the reality itself. These disagreements are not resolvable by further calculation alone, as they concern the interpretation of the calculus rather than the calculus itself.

  To move beyond mere statement of position, we have identified specific cruxes where these philosophical differences manifest in practical reasoning, and we require at least one of them to be a specific principle rather than a mood. A central crux involves whether Markov's principle, that from a refutation of the assumption that no n satisfies a decidable property one may infer that some n does, is a legitimate piece of reasoning. The classicist accepts it outright as a trivial consequence of the law of excluded middle applied to the existential claim, while the constructivist regards its status as delicate, being derivable in some formal frameworks and not others, and generally rejects it as lacking a uniform constructive method. This principle serves as a litmus test for the acceptability of non-constructive inferences in recursive mathematics. For each crux, we have identified the consideration or class of cases both would agree bears on it, with each side's prediction written down in advance to allow for future empirical or pragmatic evaluation. For the meaning crux, the bearing case is the fate of exact computational practice in areas like verified computer algebra and computable analysis, where every computable function on an interval is continuous. The constructivist should predict that constructive existence will become the default notion wherever exactness is required and classical existence will be reinterpreted as a claim about irrefutability, suggesting a paradigm shift in how software verifies mathematical claims. Conversely, the classicist should predict that constructive methods will be absorbed as a useful specialty, like numerical analysis, leaving classical semantics untouched as the default, suggesting that constructive logic will remain a niche tool for specific verification tasks rather than a foundational replacement.

  For the crux about idealization, both might agree that the record of repairs matters, specifically how classical theorems are modified to survive constructive scrutiny. The constructivist predicts that the strengthened hypotheses needed to constructivize mainstream theorems will increasingly look like what the applications always wanted, implying that classical mathematics was often imprecise about the conditions required for physical or computational applicability. The classicist predicts that they will accumulate as ad hoc local adjustments of no semantic significance, implying that these modifications are merely technical hurdles to be cleared without implying any deeper flaw in the classical conception of continuity or existence. These predictions allow us to test our philosophical commitments against the trajectory of mathematical practice over the coming decades. Finally, we must address the nature of our dispute itself to determine if further argument is productive. We conclude that some portion of their dispute is verbal, specifically a disagreement about the word "or" or the word "exists" rather than about mathematics, because the classical existential quantifier and the constructive existential quantifier operate under different rules and thus pick out different concepts despite sharing a name. This verbal disagreement explains why we can agree on the formal embedding while disagreeing on the meaning, as we are effectively translating between distinct conceptual schemes. However, we say equally plainly which portion is not verbal, noting that the disagreement over Markov's Principle and the utility of strengthened hypotheses is substantive, concerning which methods are reliable for generating knowledge and which inferences are permissible in a rigorous derivation. The verbal dispute concerns definition, but the substantive dispute concerns methodological commitment and the standards of evidence required to assert a theorem. We hope this document serves as a stable platform for future work, allowing us to collaborate on problems where our methods overlap while respecting the boundaries where they diverge. We remain committed to this adversarial partnership, believing that the tension between our views generates more heat and light than either could produce in isolation.

  Signed
