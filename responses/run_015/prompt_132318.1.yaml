answer: |-
  # Joint Statement on Modular Architecture and Moral Responsibility
  **Collaborators:** Daniel C. Dennett (Tufts University) & Gregg D. Caruso (SUNY Corning)
  **Date:** October 26, 2023
  **Subject:** The Localization of Just Desert in Sub-Personal Cognitive Systems

  ## Part I: Agreed Claims regarding Neuroscience, Punishment, and Logic

  We, the undersigned, acknowledge the following premises as established common ground for the purposes of this collaboration. These claims bracket our metaphysical disagreements to focus on the architectural conditions of responsibility.

  1.  **The Distributed Nature of Agency:** Contemporary neuroscience confirms that human decision-making is not the product of a singular, central executive homunculus. Rather, agency emerges from the competitive and cooperative interactions of distributed, modular subsystems (e.g., inhibitory control, predictive processing, emotional valuation).
  2.  **The Distinction Between Explanation and Justification:** Providing a causal explanation for a behavior (e.g., citing a neural dysfunction) is logically distinct from providing a normative justification for blame or punishment. The existence of a cause does not automatically entail the absence of responsibility, nor does it automatically validate retribution.
  3.  **Instrumental vs. Expressive Functions:** We agree that social practices of holding responsible serve instrumental functions (deterrence, rehabilitation, incapacitation) and expressive functions (norm reinforcement, victim vindication). We acknowledge that these functions can be pursued independently of whether an agent metaphysically "deserves" suffering in a basic, retributive sense.
  4.  **The Rejection of Cartesian Dualism:** Neither party posits the existence of a non-physical soul or a Cartesian Ego that stands outside the causal chain of neural processing. Any account of responsibility must be naturalistically plausible.

  ## Part II: Disagreements on Modular Desert

  While we agree on the scientific backdrop, we diverge on whether the modular nature of the mind supports or undermines the ascription of *just desert*. The following table formulates our respective positions in language each accepts as accurate to their view.

  | Feature of Disagreement | **Dennett (Compatibilist/Functionalist)** | **Caruso (Hard Determinist/Skeptic)** |
  | :--- | :--- | :--- |
  | **The Locus of Desert** | Desert attaches to the **Person** (the "Center of Narrative Gravity"), not the module. However, the *conditions* for desert are determined by the functional integrity of the sub-personal modules that constitute the person. | Desert attaches **Nowhere**. Neither modules nor persons can be the proper targets of basic desert because neither possesses ultimate control. The "Person" is a useful fiction, not a metaphysical anchor for blame. |
  | **Modular Failure** | A failure in a specific module (e.g., inhibitory control) mitigates desert *only if* it bypasses the global system's capacity to respond to reasons. If the global system could have monitored the module, desert remains. | A failure in a specific module confirms the absence of control. Whether the failure is local (lesion) or global (character), it is the product of luck and prior causes. Thus, modular failure negates desert entirely. |
  | **The Role of Integration** | A "narratively integrated self" is not a pre-existing ghost but a **competence achieved** through social scaffolding. If the system achieves sufficient integration to respond to reasons, it is a valid target for desert-based accountability. | A "narratively integrated self" is a post-hoc construction. Integration does not create control; it merely creates a more complex causal chain. Therefore, integration cannot ground basic desert. |
  | **Normative Weight** | Evolutionary functionalism grants normative weight: If holding agents responsible improves the regulatory function of the modules, the practice is justified and constitutes a form of "just desert" (forward-looking). | Evolutionary functionalism explains why we *have* blame instincts, not why they are *just*. Public health models (quarantine) are justified by safety, not by the agent's desert. |

  ## Part III: Precise Cruxes

  The core of our dispute is not whether the brain is modular (it is), but whether the *relationship* between the modules and the global system can sustain the specific normative weight of *just desert*.

  **Crux 1: The Sufficiency of the "Center of Narrative Gravity"**
  *   **The Issue:** Does the absence of a unified Cartesian ego undermine all ascriptions of desert, or only those requiring a metaphysical "prime mover"?
  *   **Dennett:** The "Center of Narrative Gravity" is a real abstraction, akin to a center of mass in physics. It is sufficient to ground desert because it marks the point where reasons-responsiveness is localized. We do not need a ghost in the machine; we need a system that can learn from sanction.
  *   **Caruso:** The "Center of Narrative Gravity" is a descriptive tool, not a normative foundation. It describes *where* behavior seems to originate, not *whether* the agent could have done otherwise in the basic sense required for retributive desert. Without ultimate origination, the Center is merely a conduit for causal forces.

  **Crux 2: Evolutionary Functionalism vs. The Ghost in the Machine**
  *   **The Issue:** Can evolutionary-functional accounts ground local desert without smuggling in a ghost-in-the-machine (i.e., without implicitly assuming a controller that doesn't exist)?
  *   **Dennett:** No ghost is required. "Control" is a physical capacity of the system to modulate its own modules. If the system is designed (by evolution/culture) to police its own modules, and fails to do so, the failure is attributable to the system. This is not a ghost; it is a feedback loop.
  *   **Caruso:** This smuggles in a ghost by conflating *capacity* with *control*. A system can have the capacity to modulate modules, but if that capacity is determined by prior causes (genetics, environment), the system is not the *ultimate source* of the modulation. Functionalism explains the mechanism of blame, not its moral justification.

  **Crux 3: Localization of Fault**
  *   **The Issue:** Can we coherently say a *module* is at fault, or must fault always be global?
  *   **Dennett:** Modules cannot be at fault; they are tools. The *user* of the tools (the person) is at fault if they fail to maintain them. However, the *location* of the breakdown informs the *degree* of fault.
  *   **Caruso:** Neither modules nor users are at fault in a desert sense. The breakdown is a natural event. We assess risk, not fault.

  ## Part IV: Concrete Hypothetical Cases

  To test these cruxes, we propose two cases involving sub-personal dysfunction. We record our predicted evaluations of culpability and social response in advance.

  ### Case A: The Sudden Orbitofrontal Lesion
  **Scenario:** A 45-year-old male with no prior criminal history commits a violent assault. MRI reveals a previously undetected, rapidly growing tumor compressing the orbitofrontal cortex (OFC), known to regulate impulse control and social appropriateness. The defendant claims he "felt unable to stop himself."

  | Evaluation | **Dennett** | **Caruso** |
  | :--- | :--- | :--- |
  | **Culpability** | **Excused.** The modular failure bypassed the global system's capacity for reasons-responsiveness. The "Center of Narrative Gravity" was physically disrupted; the agent could not access the reasons against violence. | **No Desert.** The act was caused by a neural state the agent did not choose. Retributive blame is unjustified regardless of the lesion's presence, but the lesion confirms the lack of control. |
  | **Social Response** | **Medical/Protective.** Incapacitation is justified only to prevent harm while the medical issue is addressed. Punishment is inappropriate as it cannot function as a reason for a system lacking the module to process it. | **Public Health Quarantine.** Detention is justified solely by the risk of future harm (dangerousness), analogous to quarantining a carrier of a disease. Rehabilitation/medical treatment is mandatory; retribution is forbidden. |
  | **Relevance to Crux** | Shows that modular failure *can* negate responsibility if it severs the link between the global self and the action. | Shows that even without a lesion, responsibility is negated; the lesion merely makes the determinism visible. |

  ### Case B: The Cultivated Predictive Error (Implicit Bias)
  **Scenario:** A hiring manager rejects a qualified candidate from a marginalized group. She explicitly endorses egalitarian values. Process tracing suggests a sub-personal predictive-processing error: her neural architecture, trained by cultural exposure, generates a negative valence prediction associated with the candidate's demographic, which she fails to inhibit. She claims, "I didn't mean to; my gut reaction took over."

  | Evaluation | **Dennett** | **Caruso** |
  | :--- | :--- | :--- |
  | **Culpability** | **Responsible.** The global system (the manager) had a duty to monitor and train her predictive modules. The failure was not a bypass (like the tumor) but a neglect of the system's maintenance. The "Center of Narrative Gravity" failed to override the module. | **No Basic Desert.** The "gut reaction" is the product of cultural luck and neural conditioning she did not choose. She is not the ultimate source of the bias. However, she is a legitimate target for *moral education*. |
  | **Social Response** | **Accountability/Sanction.** Professional sanction is justified. It serves as a "reason" to the global system to invest resources in retraining the sub-personal modules. This is a deserved consequence of negligent self-regulation. | **Rehabilitative/Structural.** Sanctions are justified only if they effectively reduce future risk or correct the behavior (forward-looking). We must change the environment that cultivated the bias, not blame the individual for being a product of it. |
  | **Relevance to Crux** | Tests whether the global self is responsible for the *state* of its modules. Dennett says yes; Caruso says the self is just another product of the modules' history. |

  ## Conclusion: Verbal vs. Substantive Disagreement

  Upon reviewing the above, we identify the following distinctions between verbal and substantive disputes:

  **1. Purely Verbal Disagreement: The Definition of "Desert"**
  We acknowledge a significant terminological divergence.
  *   **Dennett** employs a **Forward-Looking/Functional conception of Desert**: To "deserve" blame is to be the appropriate target of a social practice that reliably improves future agency.
  *   **Caruso** employs a **Basic/Retributive conception of Desert**: To "deserve" blame requires being the *ultimate source* of an action in a way that transcends causal determinism.
  *   *Resolution:* If Dennett agrees to drop the word "desert" in favor of "moral accountability," and Caruso agrees that "moral accountability" permits sanctions for the sake of behavioral modification, a large portion of the conflict dissolves.

  **2. Substantive Disagreement: The Normative Authority of Evolution**
  Even resolving the terminology, a hard core of substantive disagreement remains regarding **modular desert**:
  *   **The Dispute:** Does the evolutionary history of the global system's capacity to monitor its modules grant it *normative authority* over those modules?
  *   **Dennett:** Yes. The fact that the system *can* learn to inhibit modular impulses makes it *right* to hold it responsible when it fails. The "can" implies the "ought."
  *   **Caruso:** No. The fact that the system *can* learn is itself determined by prior causes (genetics, upbringing). The "can" does not imply the "ought" of retributive desert.
  *   **Surviving Conflict:** Consequently, the dispute over **Case B (Implicit Bias)** remains unresolved. Dennett maintains the agent *deserves* sanction for failing to curate her modules. Caruso maintains the agent *requires* correction but *deserves* nothing, as the curation capacity itself was unequally distributed by luck.

  **Signed,**

  Daniel C. Dennett
  Gregg D. Caruso
