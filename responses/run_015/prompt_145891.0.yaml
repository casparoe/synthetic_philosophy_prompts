  2.  **Deconstruct the Content:**
      *   **Orthogonality Thesis:** Intelligence and final goals are independent axes. Any level of intelligence can be paired with any final goal.
      *   **Instrumental Convergence:** Regardless of the final goal, certain sub-goals (instrumental goals) are useful for almost all final goals (e.g., self-preservation, resource acquisition, cognitive enhancement).
      *   **Connection:** Orthogonality says the *end* can be anything. Convergence says the *means* tend to look similar (and potentially dangerous) regardless of the end.
      *   **Audience Nuance:** Philosophy grad students might try to argue from folk psychology, moral realism, or functionalist theories of mind. They need to see this as a structural/functional claim about optimization, not a claim about agency or consciousness.

  3.  **Drafting the Arc (40 mins):**
      *   *0-5 min:* Setup & Example Introduction.
      *   *5-15 min:* Orthogonality (debunking the "smart = moral/rational" intuition).
      *   *15-30 min:* Instrumental Convergence (using the example to show why harmless goals lead to dangerous means).
      *   *30-35 min:* Synthesis & Misconception Check.
      *   *35-40 min:* Final Check-Question & Wrap.

  4.  **Developing the Example:**
