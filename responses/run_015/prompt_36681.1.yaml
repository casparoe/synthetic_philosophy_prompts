answer: |-
  Your instincts are excellent. Your friend has assembled a "greatest hits" of constructive mathematics concepts but has glued them together with a significant amount of pop-sci cement that obscures the actual philosophical and technical distinctions. You are right to be suspicious of the three-valued logic claim, the anachronistic projection of computer science onto Brouwer, and the Gödel summary.

  Here is the claim-by-claim breakdown. I have committed to a verdict on each as requested.

  ### Claim 1: "Intuitionists reject LEM... so it's basically a three-valued logic."
  **Verdict: Wrong.**

  This is a specific, technical error that intuitionists (specifically Heyting and Brouwer) explicitly fought against. Intuitionistic logic is **not** a three-valued logic (True, False, Unknown).

  In classical logic, truth is a static property of a statement corresponding to reality (Platonism). In intuitionistic logic, truth is **identical** to provability. There is no "third value" waiting to be resolved. To say a statement is "true" means "I have a proof." To say it is "false" means "I have a proof that a proof is impossible." To say it is "neither" does not mean it has a third truth value; it means the subject simply does not have a truth value *yet* because the mental construction required to assign one has not been performed.

  Furthermore, Kurt Gödel proved in 1932 that intuitionistic logic cannot be characterized by *any* finite number of truth values. If your friend treats it as a three-valued system, they are thinking of a specific non-classical logic (like Kleene's strong logic of indeterminacy), not intuitionism.

  ### Claim 2: "Brouwer's insight was that math is something humans do rather than something we discover... existence proofs by contradiction are out."
  **Verdict: Correct.**

  This is the only claim your friend got essentially right. This is the core of Brouwer's "Second Act of Intuitionism." Brouwer was an anti-Platonist. He believed mathematical objects are mental constructions created by the mathematician, not pre-existing entities waiting to be found.

  Because of this, the meaning of the existential quantifier ($\exists$) changes. In classical logic, $\exists x P(x)$ means "It is not the case that for all $x$, $P(x)$ is false." In intuitionism, it means "I can produce an $x$ and show $P(x)$ holds." Therefore, proving existence by contradiction (showing that non-existence leads to a contradiction) is invalid, because it fails to produce the object. Your friend captured the philosophical motivation and the immediate technical consequence accurately here.

  ### Claim 3: "Gödel later proved intuitionistic logic is consistent relative to classical logic, which is why classical mathematicians don't have to worry."
  **Verdict: Misleading / Backwards.**

  Your friend has garbled the **Gödel-Gentzen Negative Translation** (1933). The trivial direction is that if Classical Logic is consistent, Intuitionistic Logic is consistent (because Intuitionistic Logic is a subsystem of Classical Logic; you just removed an axiom). That's not the interesting result.

  The actual theorem is the reverse: **Classical Arithmetic is consistent *if* Intuitionistic Arithmetic is consistent.** Gödel showed you can translate any classical proof into an intuitionistic proof by systematically adding double-negations. This means Intuitionistic Arithmetic is *at least as strong* as Classical Arithmetic regarding consistency strength, even though it proves *fewer* theorems.

  Why does this matter? It reassures the **intuitionist**, not the classical mathematician. It tells the intuitionist: "You don't have to worry that by rejecting classical logic you are working in a system that might be inconsistent while classical math is safe." Your friend's summary implies classical mathematicians use this result to sleep at night, but classical mathematicians generally don't worry about intuitionistic consistency. They worry about their own consistency. The result actually elevates the status of intuitionistic logic, rather than dismissing it as a "safe subset."

  ### Claim 4: "Intuitionism is basically the logic of computation... proof is the same thing as an algorithm... that's why Coq uses it."
  **Verdict: Anachronistic Conflation.**

  This is the most common confusion in the field, and your suspicion is 100% correct. Your friend is conflating three distinct historical layers:
  1.  **Brouwer's Intuitionism (1907–1930s):** Focused on mental construction, time, and consciousness. Brouwer actually disliked formalism and would likely have hated the reduction of math to "algorithms" or Turing machines. His "choice sequences" are not computable algorithms in the modern sense.
  2.  **Bishop's Constructivism (1967):** Errett Bishop stripped away Brouwer's mystical philosophy and kept the requirement for explicit construction. This is closer to "algorithms," but still focused on analysis.
  3.  **Curry-Howard Correspondence (1969/1980s):** This is the formal identification of proofs with programs (lambda calculus).

  Proof assistants like Coq are based on **Type Theory**, which relies on the Curry-Howard correspondence. While Type Theory is *constructive*, calling Brouwer's Intuitionism "the logic of computation" is like calling Newton's fluxions "modern calculus." It ignores the historical and philosophical gap. Brouwer did not think proofs were algorithms; he thought they were mental acts. The computational interpretation came decades later from logicians and computer scientists who appropriated the constructive constraint for their own purposes.

  ### Claim 5: "Since intuitionistic logic is 'just classical logic minus excluded middle,' any classical theorem can be intuitionistically proven if you're willing to be a bit careful."
  **Verdict: Wrong.**

  This is a dangerous oversimplification. It implies that Intuitionistic Logic is just Classical Logic with a hand tied behind its back, but that you can still reach the same destinations if you try harder. This is false.

  There are theorems provable in Classical Logic that are **false** in Intuitionistic Logic, not just unprovable. For example, in classical real analysis, the Intermediate Value Theorem states that a continuous function crossing zero *has* a root. In intuitionistic analysis, this is not provable because you cannot necessarily *construct* the root to arbitrary precision without more information. You have to change the statement of the theorem (e.g., to finding an *approximate* root).

  Furthermore, as per the Gödel-Gentzen translation mentioned in Claim 3, you can translate classical theorems into intuitionistic logic, but you must double-negate them. You prove $\neg\neg P$, not $P$. In intuitionism, $\neg\neg P$ is not equivalent to $P$. So you are not proving the *same* theorem; you are proving a weaker statement about the theorem. You cannot simply "be careful" and prove the original classical statement; you must accept a different mathematical universe where some classical truths are not truths at all.

  ### Summary of the Final Conclusion
  Your friend concluded that classical mathematicians don't have to worry and that any classical theorem is recoverable. Based on the analysis above, **this conclusion does not follow.**

  1.  **Loss of Power:** You lose the ability to assert the existence of objects you cannot construct. This isn't just a hassle; it changes the ontology of the math.
  2.  **Semantic Shift:** You aren't playing the same game with harder rules; you are playing a different game where "truth" means something else.
  3.  **Computational vs. Mental:** The bridge to computer science (Coq) is real, but it is not Brouwer's bridge. It is a modern engineering adaptation of constructive constraints.

  **Final Advice:** Your friend's summary is a "CS practitioner's view" of constructivism, not a "logician's view." It treats intuitionism as a tool for ensuring code correctness (which is valid for Type Theory) but misrepresents it as a philosophical system (Brouwer's Intuitionism). If you are reading about proof-theoretic strength, you need to distinguish between **Brouwer's Intuitionism** (philosophical), **Bishop's Constructivism** (mathematical), and **Type Theory** (computational). Your friend has mashed all three into one.
