prompt: |-
  Having spent four decades calibrating instruments and measuring fields in experimental physics, I have recently begun reading philosophy of knowledge and find myself struck by how rarely the literature on echo chambers and epistemic bubbles is rendered in the quantitative, mechanical language that I am accustomed to. I would like you to compose a sustained satirical piece—approximately 600 words, formatted as a deadpan technical manual with numbered sections and subsection headings—for a fictional laboratory apparatus designated the "Epistemic Isolation Chamber, Model EIB-7." The manual should be written in the dry, precise voice of an engineering specification submitted for peer review, with no break in character. Its explicit purpose, stated without irony, is to induce, maintain, and precisely calibrate states of belief-environment isolation in human subjects.

  The satire should target the actual conceptual architecture of the field: specifically, the distinction between an echo chamber, in which opposing voices are actively discredited and excluded, and an epistemic bubble, in which dissonant information is passively absent; and the further assumption—common in popular and some philosophical treatments—that belief formation can be optimized by controlling information flow without altering the rational capacities of the agent. You should literalize these concepts as physical parameters: include calibration controls for "Contrarian Permeability," "Dissonance Filtration Rate," and "Confirmation Bias Amplification"; a troubleshooting section addressing "unexpected belief revision events" and "catastrophic epistemic collapse upon bubble breach"; and an ethical review appendix that treats informed consent as a mere formality because the subject's rationality is assumed intact regardless of input constraints.

  The exaggeration must stay faithful to the real distinctions: a specialist should recognize that the manual understands the difference between active exclusion and passive absence, and should find the mockery fair rather than invented. The piece should be fully intelligible to a non-specialist—explain any necessary concept within the manual's own terms—without ever citing authors, providing bibliographies, or quoting real texts verbatim. Maintain sustained deadpan irony throughout: the manual's author should never acknowledge the absurdity, so that the philosophical critique is delivered entirely through the literalization of abstract epistemic conditions into mechanical specifications.
