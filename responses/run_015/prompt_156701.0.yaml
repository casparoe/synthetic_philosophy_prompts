answer: |-
  # Joint Statement on the Structure of Conscious Experience
  **Adversarial Collaboration: Theater Integrationists vs. Multiple Drafts Coalition**

  ## I. Joint Commitments
  *We, the undersigned parties, affirm the following claims as the shared materialist foundation for this debate. We agree that these premises are non-negotiable and that our disagreement lies in the architectural interpretation of these facts, not in the facts themselves.*

  1.  **Rejection of Dualism:** Both camps reject the existence of a non-physical soul, ego, or homunculus. There is no "little man" watching the show. Consciousness is entirely constituted by physical processes in the brain.
  2.  **Distributed Processing:** We agree that neural processing is massively parallel and distributed. Early sensory processing occurs in distinct, modular pathways (e.g., color, motion, shape) before any potential integration.
  3.  **The Phenomenological Datum:** We agree that the *subjective appearance* of consciousness is unified, continuous, and temporally ordered. The task of philosophy of mind is to explain why the system *reports* and *feels* this way, regardless of whether that feeling is veridical or illusory.
  4.  **Metaphorical Allowance:** We acknowledge that "Theater" terminology can be metaphorical. The dispute is not about a literal room with seats, but about whether there exists a **canonical neural representational format** or **locus** where information becomes available for global control and subjective experience.
  5.  **Rejection of Magic:** We agree that no "final step" in neural processing possesses magical properties. Any proposed integration point must be physically realized and causally efficacious.

  ## II. Core Disagreements
  *While we share the foundation above, we diverge on the architectural necessity of a convergence point. The following table summarizes the central dispute in terms each camp accepts as accurate to their position.*

  | Feature | Theater Integrationists (TI) | Multiple Drafts Coalition (MDC) |
  | :--- | :--- | :--- |
  | **The "Stream"** | There is a functionally singular stream of content. Distributed processes must eventually converge into a unified representational format to be experienced. | There is no singular stream. There are only multiple, parallel "drafts" of narrative fragments. The "stream" is a retrospective fiction imposed by the reporting system. |
  | **Unity** | Phenomenal unity requires a **physical or functional bottleneck**. Binding happens *before* experience at a specific integration layer. | Phenomenal unity is **functional coherence**. Binding is an artifact of competing processes; when they don't conflict, we *say* it is unified. |
  | **The "Screen"** | A canonical convergence point (or format) exists. Information not formatted for this layer may be processed but is not consciously experienced. | No screen exists. "Consciousness" is simply the fame of a content-fixation. If a draft influences speech/behavior strongly enough, it is "conscious." |
  | **Error Correction** | The brain edits the show *before* it reaches the screen (Stalinesque). There is a true timeline that gets corrected. | The brain edits the show *after* the fact by revising memory (Orwellian). There is no "true" timeline prior to the final report. |

  ## III. Empirical Cruxes and Predictions
  *We identify three specific areas where our theoretical divergence yields different expectations regarding experimental data. We agree that these cases bear the weight of the argument.*

  ### Crux 1: Temporal Order and Reconstruction
  **The Question:** Are temporal-order judgments tracked by a real-time comparator (TI) or reconstructed post-hoc (MDC)?
  **The Case:** **The Color-Phi Phenomenon.** (Two static lights flash in sequence; subjects see one light moving and changing color mid-path).

  *   **Theater Integrationists (TI):**
      *   *View:* The brain receives the second signal, calculates the trajectory, and *then* projects the unified experience of motion to the integration screen.
      *   *Prediction:* There is a measurable neural delay between the stimulus and the final "conscious" representation. We should find a specific neural locus where the "correction" occurs *prior* to the signal becoming globally available for report. The experience is Stalinesque (edited before viewing).
  *   **Multiple Drafts Coalition (MDC):**
      *   *View:* There is no "original" experience of two static lights that gets overwritten. The memory of the motion is written directly.
      *   *Prediction:* Searching for a "correction locus" is a category error. The neural traces for the static flashes and the motion are competing drafts; the motion draft wins the competition for memory storage. The experience is Orwellian (history is rewritten).

  ### Crux 2: Reportability and Consciousness
  **The Question:** Is reportability constitutive of consciousness (MDC) or just a downstream filter accessing a pre-existing state (TI)?
  **The Case:** **Inattentional Blindness / Masked Priming.** (Subjects fail to report a visible stimulus due to load, but show priming effects).

  *   **Theater Integrationists (TI):**
      *   *View:* Consciousness is the state on the "screen." Report is the act of reading the screen. Attention gates access to the screen, but phenomenal experience could theoretically overflow the report.
      *   *Prediction:* It is possible to have a unified phenomenal field that cannot be reported due to downstream bottlenecks. We should find neural signatures of "screen presence" (e.g., late P3b waves) that dissociate from the ability to verbally report.
  *   **Multiple Drafts Coalition (MDC):**
      *   *View:* Consciousness *is* the disposition to report. If a draft does not win the competition to influence speech/action centers, it is not conscious.
      *   *Prediction:* If a subject cannot report the stimulus (even in principle), there is no "hidden" consciousness. Priming effects are unconscious drafts that influenced motor systems without achieving the "fame" required for consciousness. Reportability is constitutive.

  ### Crux 3: Phenomenal Binding and Location
  **The Question:** Does binding need a physical convergence point (TI) or can it be handled by functional coherence across drafts (MDC)?
  **The Case:** **Split-Brain Asymmetries.** (Commissurotomy patients where hemispheres cannot share information).

  *   **Theater Integrationists (TI):**
      *   *View:* The "screen" is normally unified by the corpus callosum. When severed, the integration layer is physically split.
      *   *Prediction:* We should observe two distinct, localized fields of experience (two theaters) because the physical convergence point is duplicated/severed. The loss of unity proves unity relied on a physical bridge.
  *   **Multiple Drafts Coalition (MDC):**
      *   *View:* There was never one unified field. Normally, the hemispheres negotiate a single narrative draft. When severed, they produce competing narratives.
      *   *Prediction:* We should not look for two "screens." We should see two independent control systems generating competing reports. The "unity" in normal brains is just the absence of conflict between drafts, not a singular locus of binding.

  ## IV. Diagnostic Note on Verbal Disputes
  *We acknowledge that a portion of our three-month argument stems from divergent definitions of key terms. We agree to the following clarifications to prevent talking past one another:*

  1.  **"Integration":**
      *   **TI** uses this to mean **Data Convergence**: Signals physically meeting at a node or format.
      *   **MDC** uses this to mean **Functional Coordination**: Signals influencing each other without meeting at a node.
      *   *Resolution:* We will distinguish "Central Convergence" (TI) from "Distributed Coherence" (MDC).
  2.  **"The Theater":**
      *   **TI** insists they are describing a **Functional Bottleneck**, not a dualist stage. When they say "screen," they mean "final common path for report."
      *   **MDC** insists that any "final common path" implies a false singularity. When they say "no theater," they mean "no canonical version of events."
      *   *Resolution:* We agree the dispute is not about dualism, but about whether the brain constructs a **single canonical narrative** (TI) or manages **multiple non-canonical narratives** (MDC).
  3.  **"Consciousness":**
      *   **TI** leans toward **Phenomenal Consciousness** (what it feels like), which they argue requires the screen.
      *   **MDC** leans toward **Access Consciousness** (availability for use), which they argue requires only draft competition.
      *   *Resolution:* We acknowledge that if TI is right, there could be phenomenology without access. If MDC is right, phenomenology without access is an incoherent concept. This is the fundamental philosophical rift.
