      *   *Nominalism:* Hobbes is a nominalist. Universal concepts don't exist "out there"; only names exist in our minds/language.
      *   *Truth:* Truth is about propositions (sentences), not things. "A triangle has three sides" is true because of how we defined "triangle," not because of a Platonic form.
      *   *Construction:* Geometry isn't just passive definition; it's about *construction*. We generate the objects in our imagination.
      *   *Causality:* For Hobbes, to know something is to know its cause. In geometry, *we* are the cause of the figures (by defining/drawing them). In physics, God/Nature is the cause, so we can't know it as perfectly.
      *   *Application:* How does it map to reality? Through "motion." A line is the trace of a moving point. This connects the mental concept to physical action.

  3.  **Address the Specific Questions:**

      *   *Q1: Is it trivial/empty (just restating definitions)?*
          *   *Answer:* No, because it's generative. It's not just "A = A". It's "If I construct X, then Y *must* follow." It reveals necessary consequences we didn't explicitly see in the definition. It's about *reasoning*, not just dictionary work.
          *   *Analogy:* Chess. Rules are defined, but the game isn't trivial.

      *   *Q2: How does it apply to the real world (surveying/building)?*
          *   *Answer:* Because the physical world behaves consistently enough with our mental constructions. Also, Hobbes emphasizes *motion*. We measure land by moving chains, drawing lines. The mental geometry mirrors the physical action of measurement. It's a tool for reckoning.

      *   *Q3: Lines without width (Idealization)?*
          *   *Answer:* Hobbes acknowledges physical lines have width. Geometric lines are abstractions of *motion*. A point moving leaves a trace. We ignore the width for the sake of the calculation. It's a "supposition" that works.

