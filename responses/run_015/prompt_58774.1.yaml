answer: |-
  ### Brainstorming & Philosophical Mapping

  Right, let's unpack this properly before we settle on a rule. I'm looking at your four scenarios through a Sartrean lens, specifically focusing on the tension between *facticity* (the brute facts of your situation) and *transcendence* (your freedom to act upon those facts).

  1.  **Shipping Broken Code:** You say the deadline "forced your hand." Sartre would argue the deadline is a fact, but your response is a choice. You chose shipping broken code over pushing back, asking for help, or accepting the risk of delay. By saying you were "forced," you're denying your transcendence. You call this a cop-out. **Verdict: Bad Faith.**
  2.  **Hated Job (Visa/Mortgage):** You view this as a "genuine constraint." Sartre is radical here; he'd say even a prisoner is free to choose how to respond to imprisonment. However, pragmatically, the cost of leaving (deportation/homelessness) is astronomically high. If you say "I have no choice," it's Bad Faith. If you say "I choose security over happiness because the cost is too high," it's Authentic. You currently feel this *isn't* a cop-out. **Verdict: Borderline. Depends on phrasing.**
  3.  **"Not a Mentor Person":** This is defining your "essence" before your "existence." You're pretending your identity is fixed like a stone, rather than something you create through action. You're avoiding the effort of mentoring. You call this a cop-out. **Verdict: Bad Faith.**
  4.  **Blaming CV Screener:** You're attributing agency entirely to an external object (the screener) to avoid the pain of evaluating your own CV. You say it's an excuse but "less rotten." Why? Likely because shipping broken code harms the team/users (external harm), whereas blaming the screener mostly harms your own growth (internal harm). **Verdict: Bad Faith, but lower stakes.**

  **The Common Thread:** In the cases you label "cop-outs," you are converting a *trade-off* into a *trap*. You are pretending you are an object acted upon, rather than a subject acting.

  **The Slack Dilemma:** "Have to keep Slack on 24/7." Is this a fact (like a visa) or a choice (like mentoring)? It's likely a fear-based choice disguised as a requirement.

  **The Conflict:** To make a single, clean rule, I'm going to have to challenge your view on the Visa/Job scenario. Sartre doesn't really do "genuine constraints" that absolve you of responsibility. I'll need to be honest about that.

  ***

  ### The Final Answer

  Right, let's get down to brass tacks. You want a practical heuristic you can use when you're staring at your IDE or checking your phone at 10 PM.

  #### The Single Rule
  **"You are acting in bad faith when you describe a *costly choice* as an *inevitable fact*."**

  Here is how it works:
  *   **Inevitable Fact:** "Gravity exists," "I am on a visa," "The deadline is Friday." These are your *facticities*. You cannot argue with them.
  *   **Costly Choice:** "I will ship broken code to meet the deadline," "I will stay in this job to keep my visa," "I will not mentor because it's tiring." These are your *transcendences*.

  Bad faith kicks in when you take the second column and pretend it belongs in the first. When you say "I *have* to" instead of "I *choose* to because..."

  #### Applying the Rule to Slack
  You mentioned you're unsure about telling yourself you **"have to keep Slack on my phone 24/7 because my team plans everything there."**

  Apply the rule:
  *   **Is it an inevitable fact?** No. Your phone can be turned off. You can mute notifications. You might get annoyed by your team, or even reprimanded, but you will not cease to exist.
  *   **Is it a costly choice?** Yes. You are choosing *anxiety and lost personal time* in exchange for *job security and team alignment*.

  **The Verdict:** If you tell yourself "I *have* to," you are in bad faith. You are hiding the cost (your sanity) behind a false necessity.
  **The Authentic Move:** Say to yourself, "I *choose* to keep Slack on because I am worried about my performance review, and I am willing to pay the price of my evenings for that security." Once you admit it's a choice, you can actually decide if the price is worth it. Often, just admitting you have a choice gives you the courage to set boundaries.

  #### The Hard Truth: Which Take Needs Overturning?
  To keep this rule simple and philosophically sound, I have to be honest with you: **I need to overturn your take on the High-Paying Job (Visa/Mortgage).**

  You currently feel that staying in a job you dislike due to visa and mortgage constraints is a "genuine constraint" and therefore *not* a cop-out.

  **Here is the existentialist correction:**
  Sartre would argue that viewing the visa as a "genuine constraint" that removes your freedom is technically bad faith. It is a *very heavy cost*, but it is not a removal of agency. You *can* leave. You can walk out tomorrow. The consequence might be deportation or financial ruin, but that is a *consequence*, not a impossibility.

  **Why this matters for you:**
  If you treat the visa as a "genuine constraint" (a fact), you become a victim of your situation. You suffer silently.
  If you treat it as a "costly choice" (a trade-off), you reclaim your agency. You say: "I am choosing to endure this misery for another year to secure my residency."

  **The Adjustment:**
  You don't have to quit the job. That would be reckless. But you must stop telling yourself you *have* to stay. You *choose* to stay.
  *   **Your current take:** "I am trapped." (Leads to resentment and suffering).
  *   **The rule's take:** "I am buying security with my happiness." (Leads to ownership and a plan).

  Once you acknowledge it's a choice, you can start planning how to change the variables (e.g., "I will endure this for 12 months, then re-evaluate"). Bad faith keeps you stuck forever; authenticity lets you plan your escape route.

  #### Summary on the "Rot"
  Regarding your point on the CV screener being "less rotten" than shipping broken code: The rule explains this too. Shipping broken code is denying your responsibility to *others* (the users, your team). Blaming the screener is denying responsibility to *yourself*. Sartre would say both are bad faith, but harming others is ethically weightier. Your intuition there was spot on.

  **Practical Takeaway:**
  Next time you hear yourself say "I have to," stop. Replace it with "I choose to because..." If you can't finish that sentence without admitting a fear or a cost, you've caught yourself in bad faith.
