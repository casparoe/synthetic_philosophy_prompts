answer: |-
  This is an exceptionally precise framing of the Anthropocene debate. You and your friend have identified the central friction point: the collision between the *methodological requirements* of stratigraphy (which demand synchrony and physical legibility) and the *historical reality* of the Anthropocene (which is diachronous, cumulative, and socio-technical).

  To answer your questions, we must disentangle what the Geological Time Scale (GTS) is designed to do from what the term "Anthropocene" is asked to mean. Here is an account of what is at stake in the Golden Spike practice, what it excludes, and the implications of your friend's "arrival" proposal.

  ### 1. The Ontology of the Golden Spike: Correlation over Causation

  The Global Boundary Stratotype Section and Point (GSSP), or "Golden Spike," presupposes a specific conception of geological time: **time as a universal grid that must be correlatable.**

  *   **What it presupposes:** The GSSP method assumes that the primary function of a time unit is not to explain *why* things changed, but to allow geologists in different basins to agree on *when* they are looking. It prioritizes **isochrony** (simultaneity) above all else. A boundary must be an instantaneous surface that can be traced globally.
  *   **What it rules out:** By construction, it rules out **diachronous boundaries** for formal global units. It cannot accommodate a period that "begins" in Mesopotamia in 4000 BCE and in the Amazon in 1500 CE. In strict chronostratigraphy, if the boundary moves through time across space, it is not a time boundary; it is a facies change or a process.
  *   **The Deep Future Constraint:** The practice also presupposes a "deep future" observer. The marker must be durable enough to be identified by a geologist 100 million years from now. This privileges physical signals (isotopes, magnetic reversals, fossil appearances) over complex causal narratives that might be erased or obscured.

  **Does it strictly require synchrony?** Yes, for the *boundary*. It does not require the *process* leading to the boundary to be instantaneous (the cooling leading to an Ice Age is gradual), but the *line in the rock* separating the "before" from the "after" must represent a single moment in time globally. This is why the Anthropocene Working Group (AWG) chose the 1950s plutonium spike: it is the first signal that is truly, physically simultaneous across the entire planet, unlike CO2 (which mixes slowly) or industrialization (which spreads unevenly).

  ### 2. Nature, Culture, and the "Technofossil"

  You ask if the practice presupposes something about human agency. The selection of plutonium fallout reveals a profound shift in how geology treats the nature/culture distinction.

  *   **The Artifact as Natural Signal:** Geologically, plutonium-239 is treated no differently than a volcanic ash layer. It decays according to physical law, it settles globally, and it is distinct. By choosing it, the AWG effectively argued that **human artifacts can function as natural stratigraphic markers.** This collapses the distinction between "Earth history" and "Human history." The weapon is not treated as a cultural object, but as a geophysical event.
  *   **Agency vs. Dynamics:** Traditional epochs (like the Pleistocene) are defined by Earth system dynamics (orbital forcing, ice sheet expansion). The Anthropocene is defined by a specific *agent* (humans) acting through a specific *technology* (nuclear weapons). The Golden Spike practice usually hides the agent (we see the ash, not the volcano's intent); here, the agent is the defining feature.
  *   **The Tension:** The rejection by the Subcommission on Quaternary Stratigraphy (SQS) suggests a resistance to this collapse. By voting down the formalization, they implicitly maintained that while humans *cause* the change, the *time unit* should reflect the Earth system's response (which is diachronous and complex), not the human trigger (which can be pinpointed to a test site).

  ### 3. Authority, Evidence, and the "Indispensable Informal"

  The combination of rejecting the formal unit while endorsing the informal term is not necessarily inconsistent, but it does reveal a bifurcation in scientific authority.

  *   **Discovery vs. Convention:** The vote acknowledges that the Anthropocene is a **heuristic convention** rather than a **discovered stratigraphic fact.**
      *   *As a Fact:* To be a formal Epoch, it must meet the rigid criteria of the GTS (isochrony, durability, hierarchy). The SQS decided it fails these (too short, too diachronous in impact).
      *   *As a Convention:* As a conceptual tool, it is "indispensable" for describing the current state of the planet.
  *   **The Equivocation:** You asked if this equivokes between a period as a feature of the world and a period as a convention. **Yes, it does.** But this is a standard scientific move. Consider "table salt." Chemically, it is NaCl (formal). Culinary, it might include iodized additives or sea salts (informal). The SQS is saying: "As stratigraphers, we cannot formalize this without breaking our rules. As scientists, we acknowledge the phenomenon is real."
  *   **Authority:** The vote of a few dozen specialists denies the *label's* formal status but cannot deny the *phenomenon's* reality. This protects the integrity of the Geological Time Scale (which is designed for deep time correlation) from being reshaped by contemporary political or sociological urgency, while still allowing the term to do work in climate science, ecology, and humanities.

  ### 4. Evaluating the "Arrival View"

  Your friend's proposal (Onset, Isochron, Arrival) is essentially a proposal to move from a **Geochronologic** model to an **Archaeological** or **Biogeographic** model.

  *   **What would have to change:**
      *   **Diachronous Boundaries:** We would have to accept that the "base of the Anthropocene" is a transgressive surface, like the spread of the Neolithic. In geology, this is usually handled by *lithostratigraphy* (rock units) rather than *chronostratigraphy* (time units).
      *   **Local GSSPs:** Instead of one Golden Spike in Crawford Lake, we would have thousands of "local spikes" corresponding to local industrialization, colonization, or agricultural intensification.
  *   **What would be lost:**
      *   **Global Correlation:** The primary utility of the GTS is that if I say "Cambrían," you know exactly what slice of time I mean, regardless of whether we are in China or Wales. If the Anthropocene has multiple start dates, I cannot correlate a sediment core from London with one from Beijing simply by saying "this is Anthropocene." I would have to ask "Which Anthropocene? The Industrial one? The Colonial one?"
      *   **Simplicity:** The power of the term "Anthropocene" lies in its singularity. It declares a global state change. Fragmenting it into arrival times dilutes the rhetorical and scientific force of the "Great Acceleration."
  *   **Is it still a Period?**
      *   If you adopt the arrival view, it ceases to be a **Period/Epoch** in the geological sense (a block of time) and becomes a **Process** or a **Transition**.
      *   In geology, we have names for diachronous events: "Orogenies" (mountain building) or "Transgressions" (sea level rise). These happen at different times in different places. Your friend is arguing the Anthropocene is an Orogeny, not an Epoch.
      *   **The Consequence:** If it is a process, it doesn't need a Golden Spike. It needs a description of mechanisms. This aligns better with Earth System Science (which studies fluxes and flows) than Stratigraphy (which studies layers and boundaries).

  ### 5. Synthesis: What is at Stake?

  The struggle over the Golden Spike is a struggle over **how we slice time.**

  1.  **The Geological View (The SQS Majority):** Time must be sliced by global physical signals to remain a useful grid for the deep future. The Anthropocene is real, but it is a *complex event* spanning centuries, not a *boundary* at 1950. Formalizing it as an Epoch forces a square peg (diachronous human history) into a round hole (isochronous geological time).
  2.  **The AWG View (The Proposal):** We need a hard line to mark the moment human impact became globally synchronous and geologically permanent. The 1950s spike is the only candidate that fits the *rules* of geology, even if it ignores earlier impacts.
  3.  **Your Friend's View (The Arrival Model):** The rules of geology are the wrong tool for this job. Human impact spreads like a culture or a species, not like an asteroid strike. We should adapt the definitions to fit the phenomenon, even if it breaks the synchrony of the Time Scale.

  **Conclusion:**
  The Golden Spike practice presupposes that **correlation is more important than causation.** It rules out periods that are defined by spreading processes rather than instantaneous global events.

  The rejection of the Anthropocene as a formal unit is an admission that **human history does not map neatly onto geological time.** Human history is diachronous, cultural, and cumulative; Geological time is isochronous, physical, and sliced.

  If your friend's view were adopted, we would gain historical nuance (acknowledging that the Anthropocene arrived in England in 1780 and in the Congo in 1950) but we would lose the **global simultaneity** that makes the Geological Time Scale a universal reference frame. We would no longer be defining a "Period" in the geological sense, but rather a "Phase" of Earth System operation.

  The current compromise—informal but indispensable—is likely the most honest solution. It acknowledges that the Anthropocene is a **hybrid category**: part geological reality, part cultural narrative. It requires a vocabulary that is flexible enough to handle both the plutonium spike (geology) and the spread of agriculture (history), something the rigid Golden Spike apparatus was never built to do.
