      *   *Nuance:* The Holocene definition (Greenland ice core) is a GSSP, but it's based on climate signal. The Anthropocene proposal was also based on a signal (radionuclides). The issue wasn't just the marker, but the *duration* and the *nature* of the unit (is it an Epoch or an Event?).
