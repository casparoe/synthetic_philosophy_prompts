      *   *Requirement:* The marker must be global, synchronous, and preserved in the rock record (for the "deep future").
      *   *Conception of Time:* Time is a container to be sliced. Boundaries are instantaneous (in geological terms). It prioritizes *synchrony* over *process*.
      *   *What it rules out:* Diachronous boundaries (time-transgressive units). You can't have a boundary that starts in England in 1750 and Japan in 1850 under strict GSSP rules for a *global* unit.

  3.  **Analyze the Anthropocene Specifics:**

