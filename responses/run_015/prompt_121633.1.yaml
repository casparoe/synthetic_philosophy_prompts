prompt: |-
  I'm a PhD student in philosophy of medicine and I sit on the ethics advisory board for our university's reproductive health partnership — we're a small group of philosophers, clinicians and one legal person who advise on pilot schemes. We've got to circulate a written opinion before our meeting on 12 March, and I need help drafting it. The case is a proposed "welfare-weighted conception counselling" programme: the partnership wants to allocate counselling and screening resources asymetrically, putting heavy funding into support for couples at risk of having a child with severe suffering, but offering essentially nothing to couples whose projected child-welfare scores sit well above the threshold. The justification is the procreation asymmetry — the idea that we have strong moral reasons not to bring about suffering lives, but no corresponding positive reason to bring about extra happy ones. But they've pushed this further into institutional design: they claim that because potential happy lives have no positive moral claim on us, the clinic should be actively neutral (even dismissive) towards requests for "optimisation" support, and they've built a budget cutoff so that if you're above the line you recieve zero access to subsidised screening, even for moderate, non-severe conditions.

  Some board members think this is just consistency; others think scaling the asymmetry up to resource allocation turns potential people into entities with only "negative standing" — they can block funding by being at risk, but can't attract it by being possible — which feels like a category mistake. There's also a practical worry about adaptive preferences near the cutoff. I want the memo to recommend a concrete course of action — approve, reject, or approve with conditions — with a clear time frame (e.g., halt the pilot for six months pending review, or launch a restricted one-year trial with safeguards). Don't just lay out the pros and cons and leave us hanging; take a definite position and defend it, including an honest treatment of the strongest consideration on the other side. The reasoning should be accessible to clinicians, not just philosophers, and please don't treat the asymmetry as a slogan — engage with whether it actually justifies institutional neutrality in this specific way. Also, I'm personally sceptical that the asymmetry scales like this, but I want that worry addressed seriously rather than dismissed. One small thing: please make sure it's reasoning holds together for people who aren't specialists — I keep seeing drafts that assume everyone knows the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** PhD student in philosophy of medicine, member of an ethics advisory board.
      *   **Audience:** University reproductive health partnership (clinicians, philosophers, one lawyer). Needs to be accessible to non-philosophers (clinicians).
      *   **Task:** Draft a written opinion/memo for a meeting on 12 March regarding a "welfare-weighted conception counselling" programme.
      *   **The Proposal:** Allocate resources asymmetrically. Heavy funding for couples at risk of severe suffering (below threshold). Zero funding/access for couples above the threshold (even for moderate conditions/optimization).
      *   **The Justification:** Procreation Asymmetry (strong reason to avoid suffering, no positive reason to create happy lives) $\rightarrow$ Institutional Neutrality/Dismissiveness towards "optimization."
      *   **Key Concerns:**
          *   Does the asymmetry scale to institutional resource allocation?
          *   "Negative standing" of potential people (category mistake?).
          *   Adaptive preferences near the cutoff.
          *   Need a definite recommendation (Approve, Reject, or Approve with Conditions + Timeframe).
          *   Must engage seriously with the asymmetry argument (not just dismiss it), even though the user is skeptical.
          *   Must avoid jargon/slogans; explain the reasoning clearly.
      *   **Deadline:** Meeting on 12 March (implies the memo should be dated shortly before, e.g., 5 March).

  2.  **Determine the Position:**
      *   The user is skeptical that the asymmetry scales to institutional design.
      *   There are practical worries (adaptive preferences, cutoff issues).
      *   There are ethical worries (treating potential people as having only negative standing, fairness/equity issues for those just above the line).
      *   *Decision:* **Reject the current design, but recommend a modified pilot with safeguards.** A flat "Reject" might stall necessary help for high-risk groups. A flat "Approve" ignores the serious ethical flaws. "Approve with Conditions" allows the high-risk support to proceed while fixing the unjustified exclusion of the "low-risk" group.
      *   *Refinement:* Actually, the prompt asks to "halt the pilot... or launch a restricted one-year trial." Given the severity of the exclusion (zero access above the line), a **conditional approval with a mandatory review** is the most constructive philosophical stance. It acknowledges the urgency of the high-risk intervention but flags the theoretical overreach of the asymmetry argument in policy. Let's go with **Approve with Significant Conditions & a 12-Month Review**. This balances the need to help the vulnerable (non-identity problem/suffering) with the risk of institutionalizing a flawed moral theory.

  3.  **Structure the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Clear recommendation upfront.
      *   **Background:** Briefly state what the proposal is.
      *   **Ethical Analysis (The Core):**
          *   Engage with the Procreation Asymmetry (does it justify *this* policy?).
          *   Address the "Negative Standing" concern.
          *   Address Practical/Clinical concerns (adaptive preferences, trust).
      *   **Recommendation:** Specific actions and timeline.
      *   **Conclusion:** Final wrapping thought.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard formal memo format. Date: 5 March 2024 (before 12 March meeting).
      *   *Summary:* Recommend proceeding with the high-risk support *but* reject the total exclusion of the low-risk group. Propose a tiered system instead of a cliff-edge.
      *   *The Asymmetry Argument:* I need to explain this without jargon.
          *   *Concept:* It's worse to create a miserable child than it is good to create a happy child.
          *   *Critique:* This works for *individual* morality. Does it work for *public health*? Public health usually aims to maximize well-being, not just prevent misery. If we only prevent misery, we ignore the "opportunity cost" of not supporting moderate conditions that *could* become severe or affect quality of life significantly.
          *   *Key Point:* The asymmetry justifies *priority*, not *exclusion*.
      *   *Institutional Neutrality:* The proposal claims "neutrality" towards happy lives. But refusing screening isn't neutral; it's an active withdrawal of care. It signals that their future child's health doesn't matter to the institution.
      *   *The "Negative Standing" Point:* This is a strong philosophical objection. Potential persons aren't rights-bearers in the same way actual people are. Basing policy solely on their "negative claim" creates a perverse incentive structure.
      *   *Clinical/Practical:* The "Cutoff" problem. If I'm just above the line, I'm denied care. This creates anxiety and "gaming" the system (adaptive preferences). Clinicians hate arbitrary cutoffs that contradict clinical judgment.
      *   *Recommendation:*
          1.  Fund the high-risk tier (urgent).
          2.  Restore basic screening access for the low-risk tier (not full optimization, but basic care).
          3.  12-month pilot with specific metrics (trust, uptake, psychological impact).
          4.  Ethics review at 6 months.

  5.  **Refining the Tone:**
      *   Needs to be respectful but firm.
      *   Avoid "As Parfit argues..." or "In the non-identity problem..."
      *   Use plain English: "moral reason to prevent suffering" vs. "moral reason to create happiness."
      *   Ensure the distinction between *individual morality* and *institutional policy* is clear.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "category mistake"? *Yes, in the section on moral standing.*
      *   *Check:* Did I take a definite position? *Yes, Conditional Approval.*
      *   *Check:* Is the asymmetry treated seriously? *Yes, acknowledged as valid for prioritization, but rejected as a basis for exclusion.*
      *   *Check:* Is it accessible? *Avoided terms like "person-affecting view" or "wide person-affecting principle." Used "future child's interests."*
      *   *Check:* Timeline? *12-month pilot, review at 6 months.*

  7.  **Final Polish:** Check the date (make sure it's before March 12). Ensure the formatting is clean. (Self-correction: Make sure the distinction between "optimization" and "basic screening" is clear in the recommendation, as the proposal bans *subsidised screening* entirely for the low-risk group).

  8.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Reproductive Health Partnership Ethics Advisory Board
  **FROM:** [Your Name], PhD Candidate, Philosophy of Medicine
  **DATE:** 5 March 2024
  **SUBJECT:** Ethical Opinion on Proposed "Welfare-Weighted Conception Counselling" Pilot

  ### Executive Summary

  I recommend that the Board **approve the pilot programme only with significant modifications** to the current resource allocation model. Specifically, we must reject the proposal to offer *zero* subsidised screening to couples projected to have children above the welfare threshold.

  While the "procreation asymmetry" (the moral distinction between avoiding suffering and creating happiness) provides a strong justification for *prioritising* high-risk cases, it does not ethically support the total *exclusion* of low-risk cases from basic screening. I propose a **12-month restricted trial** that maintains heavy funding for severe risk mitigation but restores a baseline level of access for all patients, subject to a formal ethics review at the six-month mark.

  ### 1. The Proposal and Its Justification

  The Partnership proposes a "welfare-weighted" model. Resources will be concentrated on couples at risk of conceiving a child with a life characterized by severe suffering. Conversely, couples whose projected child-welfare scores sit above a specific threshold will be denied subsidised screening, even for moderate conditions.

  The ethical engine for this design is the **procreation asymmetry**. In simple terms: we have a strong moral duty to avoid bringing a child into a life of suffering, but we do not have a corresponding duty to bring a happy child into existence. The proposal argues that because potential happy lives have no "positive claim" on us, the clinic should be institutionally neutral toward requests for "optimisation" (ensuring a child is healthier or happier than the baseline).

  ### 2. Ethical Analysis

  My assessment rests on three points: the limits of the asymmetry argument in public policy, the problem of "negative standing," and clinical practicality.

  #### A. Does the Asymmetry Justify Exclusion?
  The procreation asymmetry is a compelling concept in individual morality. It explains why we feel it is wrong to conceive a child we know will suffer terribly, but not wrong to choose not to conceive a child who would have been happy.

  However, moving from individual morality to **institutional resource allocation** is a significant leap.
  *   **Prioritisation vs. Exclusion:** The asymmetry justifies *prioritising* resources toward preventing suffering. It does not necessarily justify *withdrawing* all care from those who are not suffering. In public health, we routinely prioritize emergency care over elective care, but we do not deny elective care entirely simply because it is not life-saving.
  *   **Institutional Neutrality:** The proposal claims that denying screening to low-risk couples is "neutral." This is incorrect. Withholding medical information is an active intervention, not a passive stance. By denying screening, the institution is effectively saying: *"We have determined your potential child's health is sufficient, so we will not help you verify that."* This is not neutrality; it is a paternalistic judgment that removes patient autonomy.

  #### B. The "Negative Standing" Concern
  Several board members have worried that this model treats potential people as having only "negative standing." This means a potential child can block funding (by being at risk of suffering) but cannot attract funding (by having the potential for a good life).

  This creates a **category mistake** in policy design. Potential people are not rights-bearers in the same way actual patients are. Our primary ethical duty in a clinical setting is to the *prospective parents* and their reproductive autonomy, guided by the best interests of the future child.
  *   If we base policy solely on the "negative claims" of potential children, we risk creating a system where the only thing that matters to the clinic is disaster avoidance.
  *   This undermines the therapeutic alliance. Patients may feel the clinic views them as vectors of risk rather than partners in family planning.

  #### C. Practical Risks: The Cutoff and Adaptive Preferences
  There is a significant practical danger regarding the welfare threshold.
  *   **The Cliff-Edge Effect:** If a couple falls just *above* the cutoff, they receive zero support. If they fall just *below*, they receive full support. This creates a perverse incentive for patients to exaggerate risks to access care, or for clinicians to manipulate scores to help patients.
  *   **Adaptive Preferences:** Near the cutoff, patients may alter their stated preferences or risk tolerance to fit the criteria for funding. This compromises the validity of "informed consent." If a patient knows that admitting to a moderate risk means losing funding, they may downplay that risk, leading to poorer clinical outcomes.

  ### 3. The Strongest Counter-Argument
  The strongest argument in favour of the current design is **fiscal and moral triage**. Resources are finite. If we dilute funding by offering screening to low-risk couples, we may fail to adequately support the high-risk couples who face catastrophic outcomes. The proponents argue that "something for everyone" means "effective help for no one."

  I take this seriously. If expanding access to the low-risk group jeopardizes the quality of care for the high-risk group, the asymmetry argument becomes secondary to simple utilitarian calculation: we must prevent the worst suffering first. However, the current proposal creates a binary (All or Nothing) rather than a gradient. It assumes that *any* resource spent on a low-risk couple is a resource stolen from a high-risk couple. This is a design choice, not a moral necessity.

  ### 4. Recommendation

  I recommend **Conditional Approval** of the pilot, subject to the following modifications and timeline:

  **1. Modify the Allocation Model (The "Tiered" Approach)**
  *   **Tier 1 (High Risk):** Maintain the proposed heavy funding and intensive counselling for couples below the suffering threshold.
  *   **Tier 2 (Low/Moderate Risk):** Reject the "zero access" rule. Couples above the threshold should retain access to *basic* subsidised screening (standard genetic panels), even if they are denied expensive "optimisation" technologies or extensive counselling hours.
  *   **Rationale:** This respects the asymmetry (Tier 1 gets more) without violating the principle of care (Tier 2 is not abandoned).

  **2. Implement a 12-Month Pilot with Safeguards**
  *   **Duration:** Launch for 12 months only.
  *   **Six-Month Review:** A mandatory ethics review at the 6-month mark to assess:
      *   Patient trust and satisfaction scores (specifically among Tier 2 patients).
      *   Evidence of "gaming" the risk scores.
      *   Clinical outcomes for Tier 1 (ensuring they were not under-served by the Tier 2 allocation).
  *   **Cutoff Transparency:** The welfare threshold criteria must be published and open to appeal. Patients denied Tier 1 status must have a clear pathway to understand why.

  **3. Reframe the Language**
  *   Avoid describing the policy as "neutrality" toward happy lives. Describe it as **"Priority-Based Allocation."** This is more accurate and less likely to alienate patients who feel their desire for a healthy child is being dismissed as morally irrelevant.

  ### 5. Conclusion

  The procreation asymmetry is a useful tool for setting *priorities*, but it is a blunt instrument for designing *eligibility*. By adopting a tiered system rather than a binary cutoff, we can honour the urgent moral need to prevent severe suffering without treating prospective parents above the threshold as having no moral claim on our resources.

  I urge the Board to adopt the modified tiered approach. This allows us to proceed with the vital work of supporting high-risk couples while protecting the partnership from the ethical and practical risks of a rigid exclusion policy.

  I am available to discuss the specifics of the tiered model prior to the 12 March meeting.
