answer: |-
  1. **Maximise the Time-Average Growth Rate (10/10):** This rule correctly identifies that the St. Petersburg game has a finite time-average growth rate for any finite bankroll, dissolving the paradox by prioritising ergodicity over ensemble expectations.
  2. **Maximise Expected Logarithmic Utility of Wealth (9/10):** While it yields the same finite valuation as time-averaging in repeated multiplicative gambles, it relies on an axiomatic utility function rather than deriving risk aversion from the dynamics of wealth evolution.
  3. **Follow Prospect-Theoretic Probability Weighting (3/10):** This descriptively explains why humans reject the gamble by underweighting tail events, but it codifies cognitive biases rather than prescribing a normative strategy for a rational agent.
  4. **Maximise Expected Monetary Value (1/10):** In a sequence of independent gambles, this rule prescribes betting fractions that lead to almost sure ruin, failing to account for the non-ergodic nature of multiplicative wealth dynamics.

  **Variant Analysis:**
  For **(1) Life Years**, the ranking remains stable but the gap between the top two narrows; since life years cannot be multiplicatively reinvested, the dynamic justification for time-averaging weakens slightly relative to log utility as a model of diminishing marginal value. For **(2) Transferable Ticket**, the ranking does not shift; the market clearing price for the ticket will converge to the growth-optimal valuation as EMV-maximisers deplete their capital and exit the market.

  **Verdict:**
  A rationalist should internalise the time-average growth rate, as it aligns subjective decision-making with the objective physical constraints of non-ergodic wealth evolution over a lifetime.
