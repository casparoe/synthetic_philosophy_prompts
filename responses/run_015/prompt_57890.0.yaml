prompt: |-
  As a longtime reader of LessWrong and related forums, I find textbook appeals to diminishing marginal utility an unsatisfying dissolution of the St Petersburg game, where a fair coin is tossed until the first heads on toss n pays £2^n. Please rank the following four decision rules from most to least defensible for an agent of finite wealth who will face many independent gambles across a lifetime: maximise expected monetary value, maximise expected logarithmic utility of wealth, maximise the time-average growth rate, and follow prospect-theoretic probability weighting. Give each rule a score out of 10 for its handling of the classic game, with a sentence of justification for each score. Then state briefly whether your ranking would shift for either of these two variants I keep returning to: (1) the prize is paid in years of healthy life rather than pounds, and (2) you cannot buy entry directly but may sell a transferable ticket that commits whoever holds it to play at the stated price. Close with a one-sentence verdict on which rule a rationalist should actually internalise.
