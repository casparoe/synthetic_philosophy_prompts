  2.  **Initial Assessment & Fact-Checking:**

      *   *AC and Non-measurable sets:* Yes, AC is required to prove the existence of non-Lebesgue measurable sets (like Vitali sets). Without AC, it's consistent that all sets of reals are measurable (Solovay).
      *   *Bayesian Updating:* Bayesian probability relies on probability spaces $(\Omega, \mathcal{F}, P)$. $\mathcal{F}$ is a $\sigma$-algebra. Standard measure theory (ZFC) handles this fine by restricting attention to *measurable* sets. We don't assign probabilities to *every* subset of $\mathbb{R}$, only to those in $\mathcal{F}$ (usually Borel or Lebesgue).
      *   *Solovay's Model:* Requires an inaccessible cardinal. It satisfies ZF + DC + "All sets of reals are Lebesgue measurable". It kills Banach-Tarski.
      *   *Why AC?* AC is incredibly useful for analysis, algebra, topology (Hahn-Banach, Tychonoff, existence of bases, etc.).
      *   *The "Epistemic" Claim:* Does AC make Bayesianism incoherent? Not really, because Bayesianism operates within a specified $\sigma$-algebra. The existence of non-measurable sets outside that algebra doesn't break the internal coherence of the probability measure defined *on* the algebra.

  3.  **Formulating the Argument:**

      *   **Acknowledge the Insight:** The user has spotted a genuine tension. It's a sophisticated observation.
      *   **Address the Bayesian/Probability Point:** This is the crux. Probability theory *already* restricts domains to $\sigma$-algebras. The existence of non-measurable sets (via AC) is a boundary condition, not an internal contradiction. We never try to condition on a Vitali set in practice. So AC doesn't break Bayesian updating *in practice*.
      *   **Address Solovay's Model:** It's great for measure theory, but it has costs.
          *   *Cost 1:* Inaccessible cardinal (consistency strength).
