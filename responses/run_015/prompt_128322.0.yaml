      *   *Point 3: The "Default" Status.* AC is default because it's a powerful tool. It's like having a sharp knife; yes, you can cut yourself (Vitali sets), but it's essential for cooking (proving theorems). We wear cut-resistant gloves (measure theory) instead of throwing away the knife.
      *   *Point 4: Epistemics.* Bayesianism doesn't require a prior over *all* subsets of parameter space. It requires a prior over a measurable space. As long as the hypothesis space is measurable, AC doesn't hurt.
      *   *Conclusion:* You aren't wrong about the "weirdness," but the mathematical community decided the utility of AC outweighs the pathological existence of non-measurable sets, especially since measure theory already neutralizes them.

  5.  **Polishing the Tone:**

