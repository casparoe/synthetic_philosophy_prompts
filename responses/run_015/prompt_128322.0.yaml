answer: |-
  This is a sharp question that cuts right to the heart of the tension between foundational purity and mathematical utility. You aren't conflating things entirely, but you might be placing the burden of "epistemic hygiene" on the wrong layer of the stack.

  Here's the breakdown of why AC remains the default, why Solovay's model hasn't taken over, and why Bayesian epistemics remain safe in ZFC.

  ### 1. The Sigma-Algebra Shield
  Your core worry is that AC allows for non-measurable sets (Vitali sets), which seems to threaten the coherence of probability measures required for Bayesian updating.

  However, Kolmogorov's axiomatic probability theory was designed specifically to dodge this bullet. A probability space is a triple $(\Omega, \mathcal{F}, P)$. Crucially, $P$ is not defined on the power set $\mathcal{P}(\Omega)$; it is defined on a $\sigma$-algebra $\mathcal{F}$.

  *   **In ZFC:** We acknowledge that $\mathcal{P}(\mathbb{R})$ contains monsters (Vitali sets). We simply declare them to be outside $\mathcal{F}$ (usually the Borel or Lebesgue $\sigma$-algebra). Bayesian updating conditions on events $E \in \mathcal{F}$. Since non-measurable sets are explicitly excluded from the domain of the probability measure, they cannot generate incoherent probabilities (like $P(E)$ being undefined or contradictory) *within the system*.
  *   **The Epistemic Point:** Rational epistemics requires that you cannot be Dutch-booked. As long as your betting quotients are defined only on measurable propositions, AC doesn't give a bookie any leverage. The existence of unmeasurable sets is an ontological fact about the universe of sets, not an epistemic vulnerability in your probability assignment, provided you respect the domain restrictions.

  So, to answer your specific hypothesis: **Yes, you are slightly conflating the existence of subsets with the sigma-algebras we use.** We don't need every subset to be measurable; we just need the subsets we care about (intervals, Borel sets, etc.) to be measurable. AC doesn't break those.

  ### 2. The Cost of Solovay's "Hygiene"
  Solovay's model (ZF + DC + "All sets of reals are Lebesgue measurable") is indeed beautiful for measure theory. It banishes Banach-Tarski and Vitali sets. It feels "cleaner." But this cleanliness comes with a steep price tag that makes it unattractive for working mathematicians, including probabilists.

  *   **Consistency Strength:** Solovay's model requires the existence of an **inaccessible cardinal**. You can't prove its consistency relative to ZF alone. To adopt Solovay as your base, you are actually assuming a *stronger* large cardinal axiom than ZFC to get the "cleaner" measure theory. Many foundationalists view this as ontological bloat, not hygiene.
  *   **Loss of Functional Analysis:** This is the killer. Without full AC, you lose the **Hahn-Banach Theorem** in its general form. You lose **Tychonoff's Theorem** for general products. You lose the guarantee that every vector space has a basis.
      *   Why does this matter for probability? Advanced probability (stochastic processes, infinite-dimensional Bayesian inference) leans heavily on functional analysis. If you can't guarantee that dual spaces separate points, or that certain limits exist, the machinery for defining priors over function spaces (like Gaussian processes) becomes crippled.
  *   **Dependent Choice (DC):** Solovay's model keeps DC. This is enough for most basic analysis (sequences, limits), but full AC is often the "lazy" tool that allows mathematicians to make infinitely many arbitrary selections without constructing a choice function. Dropping it makes many existence proofs constructive nightmares.

  ### 3. Ontological Richness vs. Epistemic Hygiene
  You asked if mathematicians are trading epistemic hygiene for ontological richness. I'd argue they are trading **foundational purity for instrumental convenience.**

  *   **The "Knife" Analogy:** AC is like a very sharp knife. Yes, you can cut yourself (construct a Vitali set), but it's essential for preparing the meal (proving structural theorems). Solovay's model is like switching to a butter knife: safer, but you can't cut the steak.
  *   **Measure Theory as PPE:** Instead of throwing away the knife (AC), mathematicians put on cut-resistant gloves (Measure Theory). We accept that $\mathcal{P}(\mathbb{R})$ is wild, but we built a filter ($\sigma$-algebras) that screens out the wildness before it touches our probability calculations.
  *   **The Default:** ZFC is the default because it is the "maximally convenient" consistent system we have. It allows algebraists, topologists, and analysts to work without constantly checking if their existence proofs require Choice. Probabilists are happy to ride along, knowing their $\sigma$-algebras protect them from the pathological consequences.

  ### 4. Is there a Bayesian Argument for Solovay?
  There is a niche argument, mostly from philosophers of probability (like those interested in objective Bayesianism), that a "true" prior over a continuous parameter space *should* be definable for all subsets. If you believe that *any* subset of the parameter space represents a valid hypothesis, then ZFC is indeed problematic because some hypotheses literally cannot be assigned a probability.

  However, the standard counter-argument is that **non-measurable hypotheses are linguistically/physically inadmissible.** If you cannot describe the set using a finite language (Borel codes), can it really be a proposition in your epistemic framework? Most Bayesians are comfortable restricting their hypothesis space to the Borel sets, rendering the AC issue moot.

  ### Summary
  You aren't wrong that Solovay's model is "cleaner" for measure theory. But:
  1.  **Bayesianism doesn't need all subsets to be measurable**, only the ones in the $\sigma$-algebra.
  2.  **Solovay's model breaks too much else** (functional analysis, algebra) that probability theory relies on.
  3.  **Solovay requires large cardinals**, which is arguably *more* ontological commitment, not less.

  Mathematicians treat AC as default not because they ignore the pathology, but because they built a firewall (measure theory) that keeps the pathology out of the probability engine. They prefer a powerful engine with a firewall over a weaker engine that doesn't need one.

  **Verdict:** You identified a real tension, but the mathematical consensus is that "epistemic hygiene" is maintained by $\sigma$-algebras, not by restricting the axiom of choice. AC stays because the cost of removing it is higher than the cost of ignoring the sets it creates.
