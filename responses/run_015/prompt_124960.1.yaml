      *   *Claim 2 (Literal vs. Metaphor):* **Nuanced/Problematic.** Dennett's position is "mild realism." He says beliefs are *real patterns*, not necessarily neural sentences. He rejects the idea that they are *mere* metaphors (instrumentalism), but he also rejects the idea that they are internal Cartesian objects (strong realism). The friend says "literally present." Dennett would say "real as patterns." This is a common simplification but risks misrepresenting his ontological commitment.
      *   *Claim 3 (Searle's Objection):* Accurate. Searle distinguishes Original (intrinsic) vs. Derived intentionality. Machines have derived; humans have original.
      *   *Claim 4 (Scale not Kind):* **Accurate to Dennett, False to Searle.** Dennett *does* argue it's a difference in complexity/design stance. Searle *insists* it's a difference in kind (biological causation). The friend presents this as Dennett's reply, which is correct.
      *   *Claim 5 (Chinese Room & Scale):* **Problematic.** The friend says "if syntax can yield semantics once you have enough bits." Dennett *does* argue the Systems Reply to the Chinese Room (the whole system understands). However, the phrasing "syntax yields semantics" is tricky. Dennett usually avoids saying syntax *becomes* semantics; rather, semantics is an interpretative layer that becomes indispensable. Searle insists syntax is *never* sufficient for semantics, regardless of scale. The friend's summary suggests a quantitative threshold crosses a qualitative line. Dennett agrees with the crossing; Searle denies the crossing is possible via syntax alone.
      *   *Conclusion (Consciousness/No Biological Glue):* **Accurate to Dennett.** Dennett is a functionalist/computationalist. He denies "special biological glue" (neurobiological causal powers, as Searle calls it).

