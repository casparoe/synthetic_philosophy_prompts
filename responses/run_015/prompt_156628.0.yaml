answer: |-
  You're assuming "capable" means "good at winning arguments," but in a legislature, that usually means "good at obstructing." The rationing rule isn't there to shut people up; it's to kill the filibuster-by-speech and the grandstanding loop. When you know you only have a fixed allotment of minutes on the floor, you don't save it for a speech; you do your actual arguing in the committees where the professional staff helps you draft amendments. The elected system rewards the person who can talk the longest; my system rewards the person who can negotiate the fastest. We aren't handicapping intelligence, we're removing the incentive to perform intelligence rather than use it.

  And they aren't tokens if they hold the power of the purse. You say elections give them a reason to be there, but mostly elections give them a reason to please the donors who put them there. My members are accountable because they can't escape the laws they pass. A senator moves to a gated community; my warehouse worker goes back to the warehouse. Stratification ensures we don't get a chamber of career politicians who've forgotten what rent costs. You want representatives who fear losing their seat; I want representatives who fear ruining their own lives. That's not amateurism; that's aligning incentives so the legislature actually feels the pain of the policies it writes.
