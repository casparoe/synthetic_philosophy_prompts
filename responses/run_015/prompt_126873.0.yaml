  # Teaching Plan: The Architecture of Agency
  **Duration:** 90 Minutes
  **Audience:** Scientifically literate non-philosophers
  **Facilitator:** Retired Experimental Physicist
  **Language:** British English

  ## 1. Objective and Conceptual Topology
  The goal is not to adjudicate whether free will 'exists' in a metaphysical sense, but to identify which functional capacities constitute a 'will worth wanting'. We shall bypass the traditional Compatibilist/Incompatibilist stalemate by decomposing agency into two analytically separable axes:
  1.  **Diachronic Authorship:** The extent to which an action flows from the agent's stable character, history, and intentions over time.
  2.  **Synchronic Openness:** The extent to which genuinely alternative physical paths were available at the precise moment of decision ($t$).

  **Dependency Order:**
  We must establish **Diachronic Authorship** before analysing **Synchronic Openness**.
  *Reasoning:* Without a continuous 'self' to possess the alternatives, 'openness' is merely noise. If there is no author, the question 'could the author have done otherwise?' is category error. Therefore, we must first define what constitutes the 'author' (the diachronic thread) before assessing the branching possibilities available to them (the synchronic state).

  ---

  ## 2. The Carrying Example: The Air Traffic Controller (ATC)
  **Scenario:** A senior ATC managing a sector during high traffic density.
  **Why this example:** It appeals to a scientific mindset (systems, constraints, protocols, high stakes) and allows us to manipulate variables without changing the agent.

  **Required Features:**
  *   **High Stakes:** Ensures the intuition of responsibility is active.
  *   **Strict Constraints:** Physical and procedural limits allow us to model deterministic pressure.
  *   **Professional Identity:** Provides a robust proxy for 'Diachronic Authorship' (training, licensure, experience).

  **Features to Exclude:**
  *   **Emotional Volatility:** We must avoid conflating 'free will' with 'emotional spontaneity'.
  *   **Moral Abhorrence:** Avoid crimes or sins; keep the context technical to prevent moral luck from clouding the agency analysis.

  **Manipulation of Axes:**
  *   **Case A (Authorship without Openness):** The radar shows a conflict. Safety protocols dictate exactly one vector change to avoid collision. The ATC issues the command. *Synchronic Openness is near zero* (physics and protocol allow no other safe path). *Diachronic Authorship is high* (the action flows from years of training and professional identity).
  *   **Case B (Openness without Authorship):** Due to a system glitch, the ATC is instructed to resolve the conflict by rolling a die to select a vector. *Synchronic Openness is high* (six physical possibilities exist). *Diachronic Authorship is zero* (the outcome is disconnected from skill, intent, or identity).

  ---

  ## 3. Session Sequence (90 Minutes)

  ### Phase 1: Pre-empting the Deterministic Objection (0–15 mins)
  **Concept:** Distinguishing Causation from Coercion.
  **Scientific Misconception:** The belief that if an action is causally determined by prior states (neural or physical), it is equivalent to being coerced by an external force.
  **Intervention Point:** **Immediate.** Before defining free will, we must dismantle the equation: *Determinism = Compulsion*.

  *   **Activity:** Ask the circle: "If a calculator outputs '4' for '2+2', is it coerced?" (No, it is functioning as designed). "If a human outputs '4' because they understand arithmetic, are they coerced?" (No, that is competence).
  *   **Key Distinction:** Causation is the *medium* of agency, not its enemy. We do not want our decisions to be uncaused (random); we want them to be caused *by us*.
  *   **Transition:** This leads us to ask: What does it mean for a decision to be caused 'by us'? This requires the Diachronic axis.

  ### Phase 2: Establishing Diachronic Authorship (15–35 mins)
  **Concept:** The Temporal Continuity of the Deliberative Identity.
  **Dependency:** This must precede Openness because we need to define the 'Who' before the 'What'.

  *   **Application of Example (Case A):** Present the ATC following protocol.
  *   **Discussion:** The ATC had no 'choice' in the physics sense (only one safe vector). Yet, we license them, praise them, and hold them responsible. Why?
  *   **Analysis:** Because the action aligns with their history (training) and identity (professional duty). The 'cause' of the action is the ATC's accumulated expertise.
  *   **Takeaway:** A will worth wanting requires that actions reflect the agent's stable character. This is compatible with determinism.

  ### Phase 3: Addressing the Neuroscience Misconception (35–50 mins)
  **Concept:** Predictive Success vs. Authorship.
  **Scientific Misconception:** The belief that if a neuroscientific model can predict the ATC's decision before they consciously register it, the ATC is not the author.
  **Intervention Point:** **Immediately after defining Authorship.** This is the critical vulnerability for scientifically literate audiences.

  *   **The Challenge:** "If I can scan the ATC's brain and predict the vector command 5 seconds before they speak, haven't I proven the ATC is a puppet?"
  *   **The Rebuttal:** The prediction works *because* the ATC is a consistent author. The brain state *is* the physical substrate of the ATC's expertise. Predictability confirms the stability of the Diachronic Author; it does not displace them.
  *   **Crucial Nuance:** Prediction undermines Authorship *only if* the predictive source is external to the agent's deliberative system (e.g., a gun to the head). If the prediction relies on the agent's own neural patterns, it validates the Diachronic link.
  *   **Transition:** Now that we have an Author, we can ask if they need Openness.

  ### Phase 4: Analysing Synchronic Openness (50–70 mins)
  **Concept:** The Live Presence of Alternative Paths.
  **Dependency:** Now that we have a secure 'Author', we can test if they require 'Alternatives' to be free.

  *   **Application of Example (Case B):** Present the ATC rolling the die.
  *   **Discussion:** Here, Synchronic Openness is maximal (multiple outcomes possible). Yet, we feel the ATC has *less* control than in Case A.
  *   **Analysis:** Openness without Authorship is merely randomness. A 'will' that selects randomly is not a will worth wanting.
  *   **Synthesis:** We value Openness only instrumentally—as a tool for Authorship to navigate complex environments. In Case A, Openness was unnecessary because the Author's goal (safety) aligned with the deterministic constraint.
  *   **Conclusion on Axes:** Diachronic Authorship is the *essential* component of free will worth wanting; Synchronic Openness is contingent.

  ### Phase 5: The Check for Grasp (70–85 mins)
  **Objective:** Distinguish genuine structural understanding from mere agreement.
  **Method:** Do not ask "Do you agree?". Ask them to classify a novel scenario using the axes.

  **The Test Scenario:**
  > "Consider a drug that makes a person act entirely out of character (e.g., a pacifist becomes violent), but the person feels they are making a free choice in the moment and has many physical options for how to commit the violence."

  **Required Diagnosis:**
  *   **Synchronic Openness:** High (many ways to act).
  *   **Diachronic Authorship:** Severed (action contradicts history/character).
  *   **Verdict:** This is *not* a variety of free will worth wanting, despite the presence of openness.
  *   **Success Criterion:** Participants must identify that the loss of Authorship is the critical deficit, not the presence of choice. If they focus only on the "ability to do otherwise," they have failed to grasp the dependency order.

  ### Phase 6: Closing and Omissions (85–90 mins)
  **Explicit Statement of Omission:**
  "We have deliberately omitted **Source Incompatibilism** (the requirement that one must be the ultimate originator of one's own character, often associated with Galen Strawson or Robert Kane)."

  **Reason for Omission:**
  "Source Incompatibilism demands a *causa sui*—that you must create yourself to be truly responsible. This leads to an infinite regress that paralyses practical discussion. For a scientific audience, this is a category error: nothing in the physical universe creates itself *ex nihilo*. By focusing on Diachronic Authorship, we accept that our character is shaped by genetics and environment, but argue that once that character exists, it is a valid source of agency. To insist on 'Ultimate Responsibility' is to demand a variety of free will that is not only impossible but incoherent, and therefore not 'worth wanting'."

  ---

  ## 4. Facilitator's Notes on Misconceptions

  | Misconception | Origin | Pre-emption Point |
  | :--- | :--- | :--- |
  | **Determinism = Coercion** | Classical Mechanics intuition. | **Phase 1.** Distinguish internal causation (agency) from external compulsion. |
  | **Predictability = Loss of Self** | Libet-style neuroscience interpretation. | **Phase 3.** Explain that prediction relies on the stability of the self (Authorship). |
  | **Openness = Freedom** | Intuitive folk psychology. | **Phase 4.** Use the 'Die Roll' (Case B) to show openness without agency is worthless. |

  ## 5. Summary of Dependencies
  1.  **Causation $\neq$ Coercion** (Must be cleared first, or the rest is unintelligible).
  2.  **Diachronic Authorship** (Must be defined to establish the 'Who').
  3.  **Neuroscientific Prediction** (Must be reconciled with Authorship before discussing Openness).
  4.  **Synchronic Openness** (Must be evaluated last, as its value depends on the existence of an Author to utilise it).

  ## 6. Closing Remark for the Circle
  "We are not looking for a freedom that escapes the laws of physics. We are looking for a freedom that utilises them. The Air Traffic Controller is free not because they could have crashed the planes, but because the safe landing was caused by *who they are*."
