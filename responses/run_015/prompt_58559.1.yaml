prompt: |-
  ok so I volunteered to mediate this dumb endless fight in my town and I am regretting it already. On one side is Maya, who runs a small gallery and is hardcore into the institutional view — like, stuff counts as art when the artworld confers that status through galleries, curators, that whole system. On the other side is Dev, who runs our community garden and is all about the aesthetic function view — like, stuff counts as art when it is made with the core aim of giving people a focused aesthetic experience, wherever it happens.

  The flashpoint is this thing the garden built last spring called the Scent Seed Library. Its basically a bike pedal powered shed that puffs out recreated smells of three apple varieties that used to grow here but died out, plus shelves where people leave and take seeds for free, plus volunteers tell stories about the orchards while you pedal and sniff. It was never meant for a gallery, its free and super useful for gardeners, but Maya started bringing her biennial tour group there and calling it the strongest new piece in town, and now the town council has one grant left for art projects and both Maya and Dev want it.

  Can you draft what their adversarial collaboration joint statement would look like if they actually cooperated for once. I want something both Maya and Dev could sign. So like first lay out the claims they actually agree on about the Library and about art in general, then a table or list that states their leftover disagreements super precisely but in wording each of them would accept for their own side, then spell out the cruxes where settling something would actually move one of them, and for each crux give a concrete test case or what-if both would agree is relevant, with what each side predicts would happen. And if some of it is just them using the word art differently, call that out seperately.

  oh and to make it harder, also run the same lens over this second thing: a perfume company popped up downtown using basically the same pedal-puff tech but just to make people go wow and buy expensive perfume. Is that art by either lights, and why the answer is or is not the same as for the Library.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Mediator (reluctant but competent).
      *   **Parties:** Maya (Institutional Theory of Art) vs. Dev (Aesthetic Functionalism/Experience Theory of Art).
      *   **Conflict:** The "Scent Seed Library" (Garden installation) vs. a new "Perfume Company" (Commercial installation). Both want the town's last art grant (specifically regarding the Library, but the Perfume Co. complicates the definition).
      *   **Task:** Draft an "Adversarial Collaboration Joint Statement."
      *   **Requirements:**
          1.  Shared claims (agreements).
          2.  Precise disagreements (wording acceptable to both).
          3.  Cruxes (settlement points that move the needle) with concrete test cases/predictions.
          4.  Terminology check (are they just using "art" differently?).
          5.  **Bonus/Complication:** Apply the same lens to the new Perfume Company.

  2.  **Deconstruct the Philosophies:**
      *   **Maya (Institutional Theory):** Art is what the "Artworld" (galleries, curators, critics, history) says is art. Context matters more than function. The Library becomes art because Maya's tour group treats it as such.
      *   **Dev (Aesthetic Functionalism):** Art is defined by the *intent* to provide an aesthetic experience. Utility doesn't disqualify it, but the *core aim* must be aesthetic engagement. The Library is art because it engages smell, story, and interaction intentionally.
      *   **The Conflict:** Maya wants the grant to validate the Library as "High Art" (institutional backing). Dev wants the grant to support the "Community Function" (keeping it accessible/functional).
      *   **The Perfume Co.:** Uses same tech. Intent is sales (commercial), not aesthetic experience (Dev says no). Not in a gallery/context of art (Maya says no). *Wait, does Maya say no?* If the artworld embraces it, maybe. But currently, it's just a shop.

  3.  **Drafting the Joint Statement - Section by Section:**

      *   **Header:** Needs to sound formal but collaborative. "Joint Statement on the Status and Support of Community Aesthetic Projects."
      *   **Section 1: Shared Claims (Common Ground):**
          *   Both agree the Library is valuable.
          *   Both agree it engages the senses (smell).
          *   Both agree it connects to local history (lost apples).
          *   Both agree it deserves funding (though for different reasons).
          *   *Key Bridge:* The object itself doesn't change, only the frame.
      *   **Section 2: Precise Disagreements (The "Steel-man" List):**
          *   Need to phrase Dev's view so Maya doesn't hate it (focus on "primary intent").
          *   Need to phrase Maya's view so Dev doesn't hate it (focus on "cultural framing").
          *   *Disagreement A:* Source of Status (Intent vs. Conferral).
          *   *Disagreement B:* Role of Utility (Does utility negate art?).
          *   *Disagreement C:* The Grant's Purpose (Supporting function vs. Supporting classification).
      *   **Section 3: Cruxes & Test Cases:**
          *   What would change Maya's mind? If the Artworld rejects it.
          *   What would change Dev's mind? If the aesthetic intent is removed.
          *   *Test Case:* The Perfume Company. This is the perfect stress test.
      *   **Section 4: Semantic Clarification:**
          *   Acknowledge they are using "Art" to point at different properties (Status vs. Experience).

  4.  **Addressing the Perfume Company (The Complication):**
      *   *Dev's View:* Intent is sales, not aesthetic experience. The "wow" is a means to an end (profit), not the end itself. -> Not Art.
      *   *Maya's View:* Currently not in the Artworld. If a curator put the perfume machine in a gallery, it becomes art. As a shop, it's commerce. -> Not Art (yet).
      *   *Comparison:* The Library has the *intent* (Dev) and the *framing* (Maya). The Perfume Co. has neither (currently).
      *   *Nuance:* What if the Perfume Co. claims aesthetic intent? Dev would skeptical of motive. Maya would wait for institutional validation.

  5.  **Refining the Tone:**
      *   Needs to be diplomatic but precise.
      *   Avoid "dumb fight" language (that's the user's frustration, not the document's).
      *   Ensure the "Adversarial Collaboration" vibe comes through (we disagree, but we mapped *how* we disagree).

  6.  **Review against Constraints:**
      *   Did I include the table/list? Yes.
      *   Did I include cruxes/test cases? Yes.
      *   Did I call out semantic differences? Yes.
      *   Did I cover the Perfume Company? Yes.
      *   Is it signable? Yes, neutral language.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Initial thought:* Maybe Maya thinks the Perfume Co. is art because it uses the tech.
      *   *Correction:* No, Institutional Theory relies on *context*. A urinal in a bathroom is not art; in a gallery, it is. So the Perfume shop is not art until the Artworld says so.
      *   *Initial thought:* Dev might hate the grant if it comes with "Art" strings.
      *   *Correction:* The statement should propose a "Hybrid Grant" or acknowledge the dual nature to make it signable.
      *   *Refining the "Crux":* Make sure the predictions are falsifiable. "If X happens, then Y."

  8.  **Final Polish:** Check the formatting for readability. Ensure the distinction between the Library and the Perfume Co. is clear in the second half. (Proceed to generate output).

  *(Self-Correction on the Perfume Co. analysis)*: I need to make sure I apply the *same lens* to the Perfume Co. as the Library.
  *   Library: Dev = Yes (Intent), Maya = Yes (Context/Frame).
  *   Perfume: Dev = No (Intent is Profit), Maya = No (Context is Retail).
  *   *Wait, is Maya a Yes on Perfume?* If the Artworld *never* touches it, it's not art. If a critic writes about it as "Olfactory Capitalism," maybe. I should stick to the current status: Shop = Not Art.
  *   *Crucial distinction:* The Library is *already* framed by Maya (tours). The Perfume Co. is not.

  9.  **Finalizing the Document Structure:**
      *   Title.
      *   Preamble.
      *   Part I: Areas of Consensus.
      *   Part II: Mapping the Disagreement (Table).
      *   Part III: Cruxes & Test Cases (Including Perfume Co.).
      *   Part IV: Semantic Clarification.
      *   Signatures.

