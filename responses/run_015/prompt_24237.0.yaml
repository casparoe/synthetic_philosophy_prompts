      *   *Evidence:* The transcript of the debate, specific claims made, quoted text from the source material (if RAG is involved), or internal reasoning steps revealed.
      *   *Burden of Proof:* Usually on the model making a positive claim, but in Debate, it's often symmetric (persuade the judge).
      *   *Verdict:* The judge's selection of the winner, which is taken as the "true" or "safe" answer.

  3.  **Analyze the Disanalogies (The "Breaks"):**

      *   *Disanalogy 1: Independent Checkability.*
          *   *Court:* Physical evidence exists outside the lawyers' heads. Witnesses can be cross-examined against reality.
          *   *Debate:* The "evidence" is often the model's own generated text or reasoning trace. The judge cannot verify the *truth* of a reasoning step without doing the reasoning themselves (which defeats the purpose of scalability).
          *   *Implication:* In court, lying about evidence is risky (discovery). In debate, lying about reasoning is hard to catch if the judge can't compute the step.

      *   *Disanalogy 2: Complexity-Theoretic Limits.*
          *   *Court:* Judge + Jury + Legal System + Reality = High computational power to verify facts (mostly).
          *   *Debate:* Formalized as $P^{Debater}$ vs $Judge$. If the problem is PSPACE-complete (e.g., Go, complex proofs), a P-time judge cannot verify the solution even with help, unless the debaters cooperate (which they don't, they adversary). The standard Debate protocol claims to handle PSPACE with NP judges *if* debaters are optimal, but this relies on the "honest debater can refute dishonest debater" assumption.
          *   *Implication:* The analogy makes the judge look like they have access to "Truth" (like a legal code or physical reality), but in AI safety, the "Truth" is often computationally inaccessible to the judge.

      *   *Disanalogy 3: Obfuscated Argument.*
          *   *Court:* Perjury is a specific lie. If you lie, the other side points to the specific lie.
          *   *Debate:* An argument can be a long chain $A \to B \to C \to D$. Every step looks valid locally ($A \to B$ is plausible, $B \to C$ is plausible), but the chain relies on a hidden global inconsistency or a false premise that isn't triggered until the end. The dishonest debater hides the error in a part of the tree the judge doesn't look at.
          *   *Implication:* There is no "smoking gun" step for the judge to penalize. The honest debater might not be able to pinpoint *where* it goes wrong without solving the whole problem (which they can't do if they are just slightly smarter than the judge).

  4.  **Evaluate Impact on Reliability:**
      *   *Do they matter?* Yes, all three are structural, not surface.
      *   *Surface:* Lawyers wearing robes vs. models having text interfaces.
      *   *Structural:* The epistemic access to truth.
      *   *Conclusion:* The "Good Judge + Adversarial = Truth" conclusion is severely weakened. It relies on the assumption that *any* lie can be exposed by the opponent within the judge's comprehension window. Obfuscated arguments challenge this directly.

