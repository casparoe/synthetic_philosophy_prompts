      *   *Recommendation:* The single revision should be to **C5**. Why? Because C1, C2, C3, C4 form a theoretical framework. C5 is the *policy application*. The theoretical framework *can* hang together (Realist Progressivism). The policy application is where the friction becomes unmanageable in a hospital setting. Hardlining C5 makes the working group's job impossible and risks ethical violence. Softening C5 to a "Strong Presumption" rather than "Governing Principle... Even Against" preserves the moral core (C2/C4) while acknowledging the descriptive reality (C1) and methodological caution (C3).
