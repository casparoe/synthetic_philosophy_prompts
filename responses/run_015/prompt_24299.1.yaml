answer: |-
  **Decision Tree: The Logical Space of Ambiguity**

  **Node 1:** Is there a single, determinate probability distribution governing the event, such that the agent's hesitation stems solely from ignorance of this value?
  *   **Yes:** **Smith's Critique ("It is a mistake").** The behavior violates SEU descriptively, but normatively the agent ought to assign a unique prior (e.g., via Indifference). Ambiguity aversion is an error in reasoning, not a rational response. (Violation: None; Source: Agent's error).
  *   **No:** Proceed to Node 2.

  **Node 2:** Can the agent's epistemic state be represented by a probability distribution over possible probability distributions (a second-order prior)?
  *   **Yes:** **Higher-Order View.** Ambiguity is reduced to risk over beliefs. Aversion arises from the curvature of utility over second-order expectations. (Representability: Higher-order; Source: Agent's knowledge).
  *   **No:** Proceed to Node 3.

  **Node 3:** Is it meaningful to represent beliefs as a *set* of probability distributions, rather than abandoning probabilistic representation entirely?
  *   **No:** **Wald Maximin.** Probabilities are inadmissible. Choices maximize the minimum payoff across states. (Representability: None; Violation: Dominance/Non-EU).
  *   **Yes:** Proceed to Node 4.

  **Node 4:** Does the evaluation of an act depend on the ranking of its outcomes across different states (comonotonicity)?
  *   **Yes:** **Choquet Expected Utility.** Probabilities are non-additive capacities; weights depend on outcome rank. (Violation: Sure-Thing Principle).
  *   **No:** **Multiple-Priors (MEU).** Acts are evaluated by the minimum expected utility over a convex set of priors. (Violation: Sure-Thing Principle).

  **Logical Gaps & Flags**

  *   **Unoccupied Space:** A position answering "No" at Node 3 (no probabilities) yet insisting on Expected Utility structure is incoherent; without probabilities, EU collapses. Similarly, answering "Yes" at Node 1 while maintaining ambiguity aversion is logically inconsistent unless framed as psychological error (Smith).
  *   **Indistinguishable Leaves:** **MEU vs. Wald.** In the limit where the set of priors includes all possible distributions, MEU converges to Wald. The tree separates them by whether *any* probabilistic constraint is retained (MEU) versus none (Wald), but empirically, distinguishing a very large set of priors from no probabilities is difficult.
  *   **Axiomatic Note:** Both Choquet and MEU violate the Sure-Thing Principle. The tree separates them via comonotonicity (rank-dependence) rather than axiom violation alone, as both fail P2. Wald may violate State Dominance if states are not properly constrained.

  **Distinctions Embodied:**
  (i) **Representability:** Unique (Smith), Higher-Order (Node 2), Set (MEU/Choquet), None (Wald).
  (ii) **Axioms:** Addressed in leaf descriptions (Sure-Thing vs. Dominance vs. Error).
  (iii) **Source:** Node 1 distinguishes environment (Smith) from agent knowledge (others).
