  # Tutorial Plan: The Scalar Architecture of Moral Patienthood
  **Duration:** 50 Minutes | **Audience:** 12 First-Year Philosophy Students | **Topic:** Graded Moral Patienthood

  ### Phase 1: The Conceptual Dependency (00:00 – 10:00)
  **Objective:** Establish the necessary distinction between functional feedback and phenomenal valence to prevent framework collapse.

  *   **00:00 – 05:00 | The Hook:** Present the binary intuition pump: "Either a system feels pain, or it doesn't." Ask students to vote. Reveal the problem: this binary forces us to either exclude complex non-humans (anthropocentrism) or include thermostats (panpsychism).
  *   **05:00 – 10:00 | The Dependency:** Introduce the **Valence/Feedback Distinction**. Explain that the scalar framework *cannot* function unless students accept that moral status tracks **phenomenal valence** (the capacity to feel bad/good) rather than **teleological feedback** (the capacity to correct errors).
      *   *Clarification:* A thermostat corrects temperature errors (feedback) but does not *mind* the error (valence).
      *   **[Misconception Headed Off: Undifferentiated Panpsychism]:** By anchoring status to valence rather than goal-directedness, we exclude simple homeostatic loops immediately.
      *   **[Misconception Headed Off: Binary Consciousness]:** By defining valence as a capacity that can vary in structure, we prime students for degrees rather than thresholds.

  ### Phase 2: The Comparative Case Study & Parameters (10:00 – 25:00)
  **Objective:** Operationalize the two parameters using a specific biological contrast that avoids human-centric benchmarks.

  *   **10:00 – 15:00 | Defining the Parameters:**
      1.  **Affective Bandwidth:** The range and differentiation of valenced states (e.g., distinct types of pain vs. generic distress).
      2.  **Temporal Binding Depth:** The duration over which states are integrated into a continuous perspective (e.g., anticipating future pain vs. reacting to immediate stimuli).
  *   **15:00 – 25:00 | The Case Study:** Introduce **The Octopus vs. The Migratory Songbird**. This comparison carries the session to illustrate the trade-off without relying on human norms.
      *   **The Octopus (High Bandwidth / Shallow Binding):** Displays complex sensory discrimination and distributed nociceptive networks (high bandwidth), but lacks centralized temporal integration due to distributed ganglia (shallow binding).
      *   **The Songbird (Low Bandwidth / Deep Binding):** Displays simpler affective differentiation (low bandwidth), but maintains long-term navigational goals and centralized continuity over migration cycles (deep binding).
      *   **Required Absences:** Both cases must lack **linguistic self-reporting** (to prevent anthropocentric bias) and **human-level narrative selfhood** (to ensure we are measuring raw parameters, not cultural status).
      *   **[Misconception Headed Off: Neuron-Counting]:** Explicitly state that the octopus may have fewer neurons than a mammal but higher bandwidth in specific modalities. Status is a function of the *parameters*, not the substrate count.

  ### Phase 3: Boundary Conditions (25:00 – 35:00)
  **Objective:** Test the limits of the framework against non-sentient systems to reinforce the Valence/Feedback distinction.

  *   **25:00 – 30:00 | The Plant/Thermostat Challenge:** Ask: "Plants respond to harm (wilt) and maintain homeostasis. Do they have affective bandwidth?"
      *   Guide students to see that without a nervous system capable of valenced integration, this is purely feedback.
  *   **30:00 – 35:00 | Reflex-Driven Systems:** Discuss the **Decorticate Mammal**. It has biological hardware but lacks the integration for deep binding or complex bandwidth.
      *   **[Misconception Headed Off: Anthropomorphic Projection onto Plants]:** By rigorously applying the "valence vs. feedback" dependency from Phase 1, students must conclude plants lack the architecture for bandwidth, preventing moral inflation.

  ### Phase 4: Moral Implications (35:00 – 45:00)
  **Objective:** Explore the ethical consequences of gradation without resolving the mathematical trade-offs.

  *   **35:00 – 40:00 | Graded Status:** Discuss how moral protection might scale. High bandwidth might demand immediate pain relief; high binding might demand long-term welfare considerations.
  *   **40:00 – 45:00 | The Equality Worry:** Address the fear that "graded status" implies some lives don't matter.
      *   **[Misconception Headed Off: Gradation Entails Moral Equality]:** Clarify that recognizing degrees of patienthood does not mean all patients have *equal* claims. A system with zero bandwidth has zero moral status, even if it is alive. Gradation creates a hierarchy of claims, not a flat equality.

  ### Phase 5: Limitations & Diagnostic (45:00 – 50:00)
  **Objective:** Define the scope of the tutorial and assess genuine conceptual grasp.

  *   **45:00 – 47:00 | The Quantitative Weighting Problem (Out of Scope):**
      *   **Explicit Statement:** "We are explicitly leaving out the calculation of how to trade bandwidth against binding depth. We are not determining whether one unit of bandwidth equals one unit of binding."
      *   **Reasoning:** "Solving this weighting problem requires meta-ethical commitments about the nature of suffering versus identity continuity that are beyond the scope of this descriptive metaphysical framework."
  *   **47:00 – 50:00 | Final Diagnostic Question:**
      *   **Question:** "If a system possesses infinite temporal binding depth but zero affective bandwidth, does it qualify as a moral patient under this framework? Explain why using *only* the two parameters."
      *   **Success Criterion:** A genuine grasp is revealed if the student answers "No" and explains that without bandwidth, there is no valence to be bound, rendering the binding morally inert. A failure is indicated if they appeal to "life," "complexity," or "potential."

  The core pedagogical strategy is to replace binary classification with multidimensional mapping before attempting moral calculation.
