answer: |-
  # Brainstorm

  This session is likeliest to fail in two specific ways. First, students will conflate evidential dependence with causal influence, dismissing the cooperation argument as "magical thinking" before the math is even on the board. This objection must be headed off immediately by rigorously separating the definition of leverage from any claim about causation. Second, and more subtly, students will collapse the distinction between the "Exchangeable" case (uncertain propensity) and the "Registrar" case (fixed composition). If they treat the Registrar's announcement as merely high-confidence evidence rather than a logical constraint, they will miss the crucial reversal where leverage turns negative. You must enforce a hard boundary between uncertainty about a parameter and knowledge of a realization.

  Regarding ordering, I considered starting with the Visibility dial to build intuition from the ground up, but rejected it. Showing how leverage decays as information increases is pedagogically sound, but it requires students to accept the existence of leverage first. If you start with high visibility (low leverage), the phenomenon looks negligible. You must start with the Exchangeable/No-Visibility case to establish the maximum possible leverage, then use the Registrar case to show the boundary condition, and only then use Visibility to show how real-world information erodes the effect. The definition of leverage must be introduced *before* the first Silo calculation. If you derive the formula after showing the numbers, students will treat leverage as a post-hoc description rather than the decision criterion itself.

  The genuinely hard step—the point where understanding silently derails—is the Bayesian update on the propensity parameter in the Exchangeable case. Students can update on urns, but they struggle to update on the "type" of a population based on their *own* action. They will instinctively feel that their act cannot change the probability of the global parameter (0.2 vs 0.8). You must force them to write out the table: $P(\text{High} | \text{I Press})$. If they do not mechanically perform this update, they will not believe the leverage number. The rest of the session depends on this single calculation landing; if it fails, the cooperation argument collapses into intuition pumping.

  # Plan

  ### 1. Dependency Structure
  *   **Step 1: Recap & Definition (15 mins).** Briefly state CDT vs. EDT criteria. **Define Leverage immediately:** $L = E[\text{Others} | \text{Press}] - E[\text{Others} | \text{No Press}]$. State the decision rule: Press if $3 \times L > 1$. Do not justify yet; treat as the tool for the session.
  *   **Step 2: The Exchangeable Case (25 mins).** Set Silos to 9000, Visibility to 0, Provenance to Uncertain (0.2/0.8 prior). **Walk the Update:** Have students compute the posterior probability of the "High" tendency given "I Press." Derive the 0.36 difference. Calculate expected utility. **Result:** EDT cooperates.
  *   **Step 3: The Registrar Case (20 mins).** Switch Provenance to Fixed (Exactly 3000 press). Ask for the update. **Result:** Leverage is -1. EDT defects. This contrast proves the cooperation depends on *uncertainty*, not just correlation.
  *   **Step 4: The Visibility Dial (10 mins).** Qualitative discussion. As observed acts increase, the residual uncertainty about the global parameter decreases. Leverage collapses. **Result:** Explains why this doesn't apply to everyday decisions where we see others' acts.
  *   **Step 5: Synthesis (5 mins).** Recap conditions for evidential cooperation: Large N, Non-rival benefits, Uncertain Propensity, Low Visibility.

  ### 2. Carrying Example
  *   **Vehicle:** The Nine Thousand Silos is the right vehicle, but simplify the board work. Do not write 8999 every time; write $N-1$.
  *   **Payoff Structure:** Keep the non-rival payoff (Cost 1, Benefit 3 to *each* other). This is essential. If the benefit were pooled and divided, the math changes and the "cooperation" intuition weakens.
  *   **Signals:** Keep agents unable to see shared signals. If they see a common coin flip, the correlation becomes causal/screened-off. The correlation must rest entirely on the exchangeable prior.
  *   **Order of Dials:** Turn **Provenance** first (Uncertain vs. Fixed). This is the conceptual hinge. Turn **Visibility** second. Visibility is merely a dampener; Provenance is the switch.
  *   **Computations:** Students must compute the 2x2 Bayesian table for the Propensity (High/Low) conditional on Act (Press/No Press). They do not need to compute the full 9000-agent distribution, only the expected propensity difference.

  ### 3. Misconception Map
  *   **"This is Magical Thinking/Causation":** Head off in **Step 1**. Explicitly state: "EDT does not claim you cause them to press. It claims your pressing is *news* that they are pressing." Repeat this whenever a causal objection arises.
  *   **"One Person Cannot Matter":** Head off in **Step 2**. The math shows the leverage scales with $N-1$. The individual act is small, but the *information* it carries about the population is multiplied by the population size.
  *   **"Conservation of Evidence":** Head off in **Step 2** during the update. Students will think updating on their own act is double-counting. Remind them: "You are not updating on the act itself as an external observation; you are conditioning the world-state on the act you are about to perform."
  *   **"Known Rate vs. Fixed Composition":** Head off in **Step 3**. This is the critical distinction. A known rate (90% press) is compatible with uncertainty about *who* presses (Exchangeable). A fixed composition (Exactly 3000 press) creates a logical constraint where your act displaces another's.
  *   **"Reference Class Ambiguity":** (Add this). Students will ask, "Why am I similar to these 9000 and not the whole world?" Address in **Step 5**. The model assumes the reference class is given; in practice, this is the hardest part of applying EDT, but for this session, treat the Silo group as the defined class.

  ### 4. Final Check
  *   **Question:** "In the Registrar case (Exactly 3000 press), an EDT agent observes that 2999 others have pressed. Should they press?"
  *   **Diagnostic:**
      *   **Answer: Yes.** (Wrong). Indicates they are ignoring the logical constraint. If 2999 others pressed and the total must be 3000, I *must* press to fulfill the count, but if I press, the total becomes 3000. Wait, if 2999 others pressed, and I press, total is 3000. If I don't, total is 2999. The constraint says exactly 3000 *will* press. This implies if I see 2999, I am forced. But the problem is ex-ante.
      *   **Better Question:** "In the Registrar case, if I decide to Press, how many *other* agents press compared to if I decide Not to Press?"
      *   **Correct Answer:** One fewer (2999 vs 3000). Leverage is -1.
      *   **Wrong Answer 1:** "The same number." (Indicates they think the total is fixed regardless of me, missing that I am part of the total).
      *   **Wrong Answer 2:** "More." (Indicates they think my act causes others).
      *   **Wrong Answer 3:** "It depends on the prior." (Indicates they missed that the Registrar announcement overrides the prior).

  ### 5. Exclusions
  *   **Your List:** Functional/Updateless Decision Theories, Normative Correctness, Savage Apparatus, Commitment, Iterated Games, Decision Procedures. **Keep all these out.** They are correct exclusions. Introducing FDT would confuse the specific mechanism of evidential leverage. Arguing which theory is correct wastes time on meta-ethics.
  *   **Add to Exclusions:** **Symmetry Arguments.** Do not argue "We are all identical, so we all do the same." This relies on a logical necessity that sounds like causation to students. Stick to the probabilistic dependence via the common parameter.
  *   **Add to Exclusions:** **Infinite Populations.** Keep $N=9000$. Infinity introduces measure theoretic issues you cannot solve on a whiteboard in 5 minutes.
  *   **Add to Exclusions:** **Deriving the Prior.** Do not ask where the 0.5/0.5 prior comes from. Treat it as given data.
