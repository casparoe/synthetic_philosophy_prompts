answer: |-
  **The joke**

  "In Veridia," the local said, "waiting at an empty crosswalk implies you think our drivers are murderers. You must cross immediately."

  I stood frozen on the curb as a truck sailed through the empty intersection. "But where I'm from, waiting shows respect for the law."

  "That's fine there," she said, checking her watch as pedestrians behind me sighed. "But here, your virtue signals our incompetence. Every second you stand there, we have to decide if you're paralyzed, protesting, or just stupid. Cross now, or admit you think we can't drive."

  I stepped off the curb. "So the rule isn't safety?"

  "No," she said. "It's sparing us the cognitive load of decoding your conscience."

  **Commentary**

  The punchline exploits the claim that non-compliance offloads interpretation costs onto locals. By waiting, the visitor isn't just breaking a rule; they are forcing the community to expend mental energy deciphering whether the delay stems from ignorance, protest, or incapacity. The humor arises because the "moral" act (waiting for safety) becomes an imposition of cognitive labor on others.

  This convention is a fair test because the content is arbitrary—crossing versus waiting has no intrinsic moral weight—yet the force is real. It avoids exoticism by focusing on the function of the norm, which is coordination, rather than its cultural flavor. The joke isn't about weird foreigners; it is about the friction of coordination games.

  Quietly, the joke concedes that the visitor is obligated to comply. Once the local explains the cost of non-compliance, specifically the interpretive burden, the visitor steps off the curb. The obligation stems not from the rule's inherent righteousness, but from the duty not to impose unnecessary processing costs on the host community. The visitor's home rules are irrelevant because the moral debt is local.
