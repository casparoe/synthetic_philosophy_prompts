answer: |-
  This is an excellent set of questions. You have correctly identified the pressure point where the formal machinery of accuracy-first epistemology meets the intuitive constraints we want our measures to satisfy. Your friend's "plain confidence rule" is a classic example of an **improper** scoring rule, and your worry about circularity touches on a live debate in the literature (specifically regarding the justification of propriety).

  Here is a breakdown of the mechanics of the dominance argument, the specific failure of your friend's rule, and how to handle the circularity worry without conceding the ground you shouldn't.

  ### 1. The Mechanics of Accuracy-Dominance

  You asked what features of a scoring rule are doing the work in the Joyce-style accuracy-dominance argument for Probabilism. The argument essentially relies on the geometry of the **probability simplex**.

  Let $W = \{w_1, \dots, w_n\}$ be the set of worlds (or outcomes in a partition). A credence function $c$ is a vector in $[0,1]^n$. The set of probabilistic credence functions $\mathcal{P}$ is the convex hull of the truth vectors (the vertices of the simplex).

  For the dominance argument to work (i.e., to show that every non-probabilistic $c$ is accuracy-dominated by some probabilistic $c^*$), the inaccuracy measure $\mathfrak{I}(c, w)$ needs to satisfy three key conditions:

  1.  **Truth-Directedness (Alethic):** If $c$ is closer to the truth vector $w$ than $c'$ is (in terms of component-wise distance), $c$ should be more accurate.
  2.  **Continuity:** Small changes in credence should not result in discontinuous jumps in inaccuracy. This is required to ensure that the "surfaces" of equal inaccuracy are smooth enough to apply separation theorems.
  3.  **Strict Propriety:** This is the heavy lifter. A rule is strictly proper if, for any probabilistic credence function $p$, the expected inaccuracy is uniquely minimized by reporting $p$ itself.

  **The Gut-Level Geometry:**
  Imagine the probability simplex as a flat triangle (in a 3-cell case) floating in 3D space. The inaccuracy measure defines a "landscape" above this space.
  *   **Strict Propriety** ensures that for any point $p$ on the simplex, the "expected inaccuracy surface" has a tangent plane that touches the simplex *only* at $p$. It creates a "bowl" shape where the bottom of the bowl sits exactly on your credence $p$.
  *   **Convexity** (which follows from propriety in this context) ensures the bowl curves upward.

  If you are at an incoherent point $c$ (outside the triangle), the geometry of a proper, convex measure guarantees that there is a point $c^*$ on the triangle (the simplex) that is "lower down" the landscape (more accurate) than $c$ is, relative to *every* vertex (world). This is a consequence of the **Separating Hyperplane Theorem**. Because the inaccuracy surfaces are convex and centered on the simplex, any point outside the simplex is "farther away" from the truth vertices than its projection onto the simplex.

  **Brier vs. Logarithmic:**
  Would the program change if you used the Log score ($-\ln(c_{true})$)?
  *   **Algebraically:** No. The Log score is also strictly proper and continuous (on the open simplex). It yields the same dominance result: incoherent credences are dominated.
  *   **Intuitively:** The Log score is more "punitive" regarding extremes. If you assign 0 to the truth, your inaccuracy is infinite. Brier is bounded (max inaccuracy is 2 for a binary case).
  *   **The Program:** The accuracy-firster doesn't care much which one you pick, provided it is **strictly proper**. The specific algebraic form (squared distance vs. log likelihood) is less important than the geometric property (convexity/propriety) that aligns the "best guess" with the "honest report."

  ### 2. Diagnosing Your Friend's Rule

  Your friend's rule: $S(c, w) = c_i$ where $w_i = 1$. (Maximize this score).

  **Is it Truth-Directed?**
  Yes, trivially. If $w_i$ is true, increasing $c_i$ increases the score. It satisfies a weak condition called **Extensionality** (the score depends only on the credence in the true proposition).

  **Is it Proper?**
  No. It is maximally improper.
  Let your actual credences be $p = (0.4, 0.3, 0.3)$.
  Your expected score for reporting $c$ is:
  $$ E_p[S(c)] = 0.4c_1 + 0.3c_2 + 0.3c_3 $$
  To maximize this, you should set $c_1 = 1, c_2 = 0, c_3 = 0$.
  The rule instructs you to report certainty in whichever outcome you find *most* plausible, regardless of how plausible it actually is.

  **The Incoherence Problem:**
  You noted that $(0.6, 0.6, 0.6)$ beats $(0.4, 0.3, 0.3)$.
  *   If $w_1$ is true: Score 0.6 vs 0.4.
  *   If $w_2$ is true: Score 0.6 vs 0.3.
  *   If $w_3$ is true: Score 0.6 vs 0.3.
  The incoherent assignment dominates the coherent one. This violates **Coherence-Dominance**: a measure of epistemic utility should not rank an incoherent state as strictly better than a coherent one at every world.

  Your friend's suggestion to "restrict inputs to coherent assignments" patches the dominance of $(0.6, 0.6, 0.6)$, but it does not fix the impropriety. Even restricted to the simplex, the rule tells you to move to the nearest vertex. It turns the forecasting pool into a game of "who is most willing to be dogmatic," not "who is most accurate."

  **The Circularity Worry:**
  You asked: *If the only reason to exclude it is that it fails strict propriety, and the reason to care about strict propriety is that we want a measure under which your actual credences come out optimal, then we seem to have built the conclusion into the definition of accuracy.*

  This is a sophisticated objection, often associated with critics like Hild (1998) or discussions in the pragmatic encroachment literature. However, the accuracy-firster has a non-question-begging reply.

  The goal of the accuracy-first program is to define **Epistemic Utility**. We are trying to quantify how good a belief state is *qua* representation of the world.
  *   **The Circularity Reply:** Propriety is not an arbitrary constraint added to save Probabilism. It is a **consistency constraint on measurement**.
      If a measure $\mathfrak{I}$ is improper, it means that the measure *itself* incentivizes you to distort your report away from your actual belief to get a better score. If you believe $p$, but the measure says reporting $q$ yields better "accuracy," then the measure is not tracking the accuracy of *believing $p$*. It is tracking the success of a *strategy of reporting $q$*.
      Therefore, an improper score cannot be a measure of *epistemic* value, because epistemic value is supposed to attach to the doxastic state itself, not the strategic manipulation of reports. To use an improper score is to change the subject from "How accurate is your mind?" to "How well can you game this metric?"

  So, it is not circular to demand propriety. It is a requirement for the metric to actually measure what it claims to measure (the accuracy of the credence state) rather than measuring something else (the utility of a reporting strategy).

  ### 3. How to Respond to Your Friend (and the Pool)

  You asked if you should concede that the pool is not a "pure accuracy exercise." I think you should make that distinction, but not as a concession—rather as a clarification of goals.

  **The Distinction:**
  *   **Brier Score:** Measures **Calibration + Resolution**. It penalizes overconfidence. If you say 90% ten times and 7 happen, Brier hurts you. It rewards being probabilistically coherent and matching frequencies.
  *   **Friend's Rule:** Measures **Boldness**. It is effectively a betting market where you get paid proportional to your stake on the winner. In finance, this is rational (maximize expected return). In epistemology, it is reckless.

  **The "Humiliation" Factor:**
  You mentioned "not being humiliated in public." This is actually a pragmatic constraint that aligns with Brier, not your friend's rule.
  *   Under the Friend's Rule, if you report 0.99 and you are wrong, you get 0.01 points. If you report 0.51 and you are wrong, you get 0.49 points.
  *   This incentivizes everyone to report 1.0 on their favorite. The pool will devolve into five people shouting "I'm 100% sure!" at different options. It destroys the information content of the forecast.
  *   The Brier score preserves the information content. It allows you to say "I'm pretty sure, but not certain," and rewards you for that nuance if you are right, without punishing you as severely as the Log score if you are wrong.

  **Recommendation:**
  Tell your friend:
  1.  **Formal Point:** His rule is **improper**. It violates the basic requirement that an accuracy measure should make honest reporting the optimal strategy. It incentivizes fanaticism (reporting 1.0) regardless of evidence.
  2.  **Geometric Point:** It allows incoherent credences (e.g., summing to >1) to dominate coherent ones, which makes it useless for evaluating rational belief.
  3.  **Pragmatic Point:** If the goal of the pool is to see who has the best *calibrated* judgment (the best epistemic engine), Brier is the correct tool. If the goal is to simulate a betting market where we maximize payout regardless of calibration, his rule works, but we should admit we are playing a betting game, not an epistemology game.

  **On the Circularity:**
  If he presses the circularity point, tell him: "Propriety isn't a trick to get Probabilism. It's the definition of 'honesty' in a scoring rule. If the score rewards me for lying about my confidence, it's not measuring my confidence's accuracy; it's measuring my ability to lie. We want to measure the former."

  ### Summary for your MA work
  *   **Dominance Argument:** Relies on the convexity of the inaccuracy measure (guaranteed by strict propriety) to ensure the probability simplex is the set of undominated points.
  *   **Brier vs. Log:** Both are strictly proper and continuous; both validate Probabilism. Log is more sensitive to extreme error.
  *   **Friend's Rule:** Improper. Incentivizes vertex-reporting (fanaticism). Fails to distinguish between calibration and luck.
  *   **Circularity:** Propriety is a coherence constraint on the *measurement* of epistemic utility, not a begged assumption. Without it, the measure tracks strategic reporting rather than doxastic accuracy.

  Stick with the Brier score. It keeps you honest, which is the point of the exercise.
