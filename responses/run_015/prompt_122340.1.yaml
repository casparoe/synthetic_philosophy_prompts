      *   *Cheapest Revision:* Modify C2. Instead of "mechanisms that could operate," use "causal structures that are robust." This allows parameterizations to count as capturing the *net effect* of mechanisms without describing the mechanism itself. This aligns better with C4 and C6 (Lagrangian captures structure, virtual particles don't).
