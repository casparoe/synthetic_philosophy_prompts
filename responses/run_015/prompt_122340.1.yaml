          *   *Severity:* Low.

      *   **C4 vs. C5:**
          *   C4 admits tunable parameters (calibration). C5 warns against post-hoc calibration leading to circularity.
          *   *Tension:* Climate models *are* tuned. If C5 is applied strictly, Climate models lose explanatory power (and predictive validity under C1).
          *   *Severity:* High.

