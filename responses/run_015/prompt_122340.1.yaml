      *   **Commitment 5 (C5): Post-hoc Calibration.** If unrealistic assumptions are calibrated against the data they predict, F-twist collapses into circularity. Predictive success alone doesn't save the model.
      *   **Commitment 6 (C6): QFT Virtual Particles.** Virtual particles are fictional artifacts, but Standard Model is explanatory because ontology is in the Lagrangian, not the perturbation expansion.

