  A good Bongard problem relies on a single, positive perceptual gestalt that homogeneously unifies the set, avoiding negative exclusions, disjunctions, or arbitrary external calculations.

  Your intuition is tracking the difference between a *concept* and a *filter*. When you say "show-don't-tell," you are demanding that the rule be embedded in the visual structure itself, accessible through inspection rather than deduction. The "good" problems (convexity, containment, symmetry, tipping) all describe a way of seeing that applies equally to every box on the left; they are positive assertions of presence. The "bad" or "cheap" problems fail because they ask the reader to perform work that isn't visual. "Prime vs. Composite" fails because primality is a number-theoretic property, not a visual one—you have to count, then calculate, then recall external knowledge. "Triangle OR Circle" fails because it is a disjunction; it offers a list, not a law, breaking the homogeneity of the set.

  The case you hate—"Zero or Two+ touch" vs. "Exactly One"—reveals that logical equivalence does not equal perceptual equivalence. "Exactly One" is a specific, positive configuration (uniqueness); "Zero or Two+" is a heterogeneous rag-bag of everything else. Even though they partition the space identically, the left side of a Bongard problem must feel like a *kind* of thing, not the absence of a specific thing. This is why "Even vs. Odd" works despite being countable: parity is perceptually immediate via pairing (subitizing), whereas primality is not. Similarly, "tipping" works because it relies on physical affordance (an inherent property of the shape's relationship to gravity), whereas "graceful" relies on subjective aesthetic judgment (an external overlay).

  The one verdict this principle cannot save is your distinction between the "spiky stars" and "smooth dented blobs" examples of the same rule. That verdict isn't about the *rule*; it's about the *pedagogy*. The principle defines the rule's quality, but a good rule can still be buried by bad examples. The "spiky stars" version is bad because it invites a simpler false hypothesis (spiky vs. smooth) that fits the data too well; the "smooth blobs" version is good because it kills that wrong guess. This tells you that while the principle governs the *law*, the quality of the *problem* also requires you to curate distractors that force the reader toward the specific gestalt you intend.

  Regarding the case you flip-flop on—"all different" vs. "at least two match"—the principle resolves it immediately. "At least two match" is a positive gestalt (the presence of similarity); "all different" is a negative exclusion (the absence of similarity). To make this a good problem, you must place the boxes with matching shapes on the left. The reader should be spotting the pair, not scanning for the lack of one. If you put "all different" on the left, you are asking the reader to verify a negative, which feels like "telling" them what isn't there rather than "showing" them what is.

  Here is the case you haven't thought of: **The Negative Space Rule.**
  *   **Left:** The white space between the black shapes forms a recognizable geometric figure (e.g., a circle).
  *   **Right:** The white space is irregular or fragmented.
  *   **Verdict:** This is a **good** problem.
  *   **Why:** It adheres to the principle by relying on a positive perceptual gestalt (the emergence of a shape), but it challenges the assumption that the "subject" must be the ink. It forces the reader to shift their figure-ground relationship, which is a visual operation, not a computational one. It avoids the trap of the "empty box" (which would be a negative exclusion) by ensuring the white space itself *does* something positive on the left side.
