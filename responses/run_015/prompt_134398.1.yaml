answer: |-
  ### The Strategy-Stealing Decision Procedure

  **Purpose:** To determine if a game's structure guarantees a First Player Advantage (FPA) via the Strategy-Stealing Argument (SSA).
  **Time Limit:** 30 Minutes.
  **Limitations:** This procedure proves the *existence* of an advantage, not the *size* of it. It cannot tell you how to play. It cannot detect advantages arising from complexity or intuition, only structural certainty. If this procedure returns "No Certificate," the game may still be broken, but not for this mathematical reason.

  #### The Checklist
  Answer these questions in order. If you answer **NO** to any question, stop immediately. The argument does not apply.

  1.  **Determinacy:** Is the game finite, with perfect information and no chance elements (dice, cards, hidden tiles)?
      *   *Yes:* Proceed.
      *   *No:* **STOP.** SSA does not apply. (Verdict: Publish as is).
  2.  **Rule Symmetry:** Do both players have access to the exact same set of legal moves from any given board state? (Note: The board *position* does not need to be symmetric, only the *rules* governing what can be played.)
      *   *Yes:* Proceed.
      *   *No:* **STOP.** SSA does not apply. (Verdict: Publish as is).
  3.  **Monotonicity (The "Extra Piece" Test):** If a player could magically add one of their own pieces to the board (or, in eating games, remove an opponent's option), would it ever force them to lose a game they would otherwise win?
      *   *Judgment Call:* In connection games, does an extra stone ever block a path or complete a losing shape? In eating games, does making a move ever restrict you more than it restricts the opponent?
      *   *Yes (It never hurts):* Proceed.
      *   *No (It can hurt):* **STOP.** SSA does not apply. (Verdict: Publish as is).
  4.  **Pass/Waste Capability:** Can the first player make an opening move that does not immediately lose, and which they can later pretend "doesn't exist" if a strategy calls for playing there?
      *   *Judgment Call:* Usually "Yes" if the board is larger than 1x1 and the first move isn't suicidal.
      *   *Yes:* Proceed.
      *   *No:* **STOP.** SSA does not apply. (Verdict: Publish as is).
  5.  **Draws:** Is a draw impossible? (The game must end with a winner.)
      *   *Yes:* SSA proves Player 1 has a **Winning Strategy**. (Verdict: Add a swap rule).
      *   *No:* SSA proves Player 1 has a **Non-Losing Strategy** (can force Win or Draw). This is still a structural First Player Advantage. (Verdict: Add a swap rule).

  #### Decision Matrix
  *   **If you stopped at Questions 1–4:** The Strategy-Stealing Argument provides **No Certificate** of brokenness.
      *   *Verdict:* **Publish as is** (Clear for playtest).
  *   **If you passed Question 5:** The game is structurally solved in favor of Player 1.
      *   *Verdict:* **Add a swap rule** (The "Pie Rule" is the standard fix for SSA-broken games).
  *   **When to Reject:** Only if the designer refuses a swap rule on a game that passed Question 5, or if the game loops infinitely (fails Q1).

  ---

  ### Application to Current Submissions

  #### 1. Cairn
  *   **Q1 (Determinacy):** Yes. Finite grid, no chance.
  *   **Q2 (Rule Symmetry):** Yes. Both place stones on empty cells. (Goals differ—Top/Bottom vs. Left/Right—but move rights are symmetric, like Hex).
  *   **Q3 (Monotonicity):** Yes. In connection games, an extra stone of your color never blocks your own path or helps the opponent. It is strictly neutral or beneficial.
  *   **Q4 (Pass/Waste):** Yes. P1 can place a stone in a corner; it never causes immediate loss.
  *   **Q5 (Draws):** No. The rules state "if the grid fills with neither, the game is a draw."
  *   **Result:** SSA applies. Proves P1 cannot lose (Force Win or Draw). This is a First Player Advantage.
  *   **Verdict:** **Add a swap rule.**

  #### 2. Thicket
  *   **Q1 (Determinacy):** Yes.
  *   **Q2 (Rule Symmetry):** Yes.
  *   **Q3 (Monotonicity):** **NO.** The loss condition is completing a 2x2 block of your *own* stones. Placing an extra stone can complete this block and cause immediate loss. Therefore, an extra stone *can* hurt you. The "Strategy-Stealing" logic breaks because P1 cannot pretend to be P2 if P2's strategy requires placing a stone that would kill P1.
  *   **Result:** SSA does not apply.
  *   **Verdict:** **Publish as is** (Clear for playtest; SSA finds no structural fault).

  #### 3. Chomp
  *   **Q1 (Determinacy):** Yes. Finite (squares are removed), no chance.
  *   **Q2 (Rule Symmetry):** Yes. Both players choose a remaining square and eat up/right. The rules are identical for both, even if the board shape changes.
  *   **Q3 (Monotonicity):** Yes. (Judgment Call Required). In Chomp, "having moved" is analogous to "having a piece." Removing squares restricts the opponent's moves more than it restricts yours (subset property). You are never worse off for having eaten a square than if you hadn't, provided you didn't eat the poison.
  *   **Q4 (Pass/Waste):** Yes. P1 can eat the top-right corner (1x1). This is never the poison square on a rectangle >1x1.
  *   **Q5 (Draws):** Yes. (Draws are impossible). One player must eventually eat the poison.
  *   **Result:** SSA applies. Proves P1 has a Winning Strategy.
  *   **Verdict:** **Add a swap rule.**

  ---

  ### Editor's Notes on Judgment Calls

  1.  **Monotonicity in Thicket:** This is the critical failure point. If a game has "suicide" conditions based on your own pattern formation (like 2x2 blocks, or filling a row in some variants), SSA usually fails. Do not force it.
  2.  **Symmetry in Chomp:** You noted the roles aren't symmetric. SSA requires *Rule Symmetry*, not *Position Symmetry*. As long as P2 *could* have made P1's move if the board were empty, Q2 is a Yes.
  3.  **The "Publish as is" Verdict:** When SSA fails (Thicket), this does not mean the game is balanced. It means you have no mathematical certificate that it is broken. You must rely on playtesting. Do not tell the owner the game is "proven fair," only that it is "not proven broken by this method."
  4.  **The "Swap Rule":** If SSA passes, the game is mathematically biased. The Swap Rule (Player 2 chooses to swap colors after Player 1's first move) is the industry-standard patch. If the designer refuses this, the game is effectively **Reject** for a competitive abstract line, as it cannot be balanced.

  ### Summary for the Owner
  *   **Cairn:** Structurally biased to First Player. **Action:** Add Swap Rule.
  *   **Thicket:** No structural bias detected by this method. **Action:** Publish as is (proceed to playtest).
  *   **Chomp:** Structurally biased to First Player. **Action:** Add Swap Rule.
