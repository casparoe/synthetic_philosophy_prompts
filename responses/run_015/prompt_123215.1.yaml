  8.  **Final Polish:** Ensure the distinction between *synchronic* (market) and *diachronic* (agent) is the pivot point. The market corrects *prices*; the agent must correct *self*.

  *(Self-Correction on the "Undefined Behavior" analogy)*: Actually, the "Undefined Behavior" analogy is quite strong for the *logical* point, but weak for the *economic* point. In C++, UB means the compiler can do anything, including delete your hard drive. In preferences, cyclicality means you can be drained. The parallel is exploitation of a spec violation. I should highlight that.

  *(Final thought on the "Breezy Conclusion")*: The breezy conclusion relies on the idea that because arbs are rare/small, pumps must be rare/small. I need to show that arbs are rare because *capital* hunts them. Pumps are rare because *cognitive friction* (spread) stops them, not because the cycle doesn't exist. If the friction is overcome, the loss is unlimited.

