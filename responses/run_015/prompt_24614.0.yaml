      *(Refining the "Poison" point)*: The podcast says: "A person who's completely indifferent to their own survival... has no reason to put down a poisoned glass of water, even if they have no idea it's poisoned."
      Williams would say:
      1. If they don't know it's poisoned, they can't have a reason *based on the poison*. (True)
      2. But do they have a reason to put it down *simpliciter*?
      3. The Internal Reasons Statement is: "A has a reason to $\phi$." This is true if A has some element in SMS that would motivate $\phi$ after sound deliberation.
