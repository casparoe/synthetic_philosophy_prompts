answer: |-
  # Joint Statement on the Program-Game Treatment of the One-Shot Prisoner's Dilemma

  **Signed:**  
  The Program-Game Optimist  
  The Program-Game Skeptic  

  **Date:** October 26, 2023  
  **Context:** Seminar on Rationality and Game Theory  

  ## Preamble

  We, the undersigned, enter this adversarial collaboration to clarify the theoretical status of the "program game" transformation of the one-shot Prisoner's Dilemma (PD). In this framework, players submit computable functions (programs) that take the opponent's source code as input and return an action (Cooperate or Defect), rather than submitting actions directly. 

  The Optimist maintains that mutual cooperation in this setting demonstrates that rational agents can achieve Pareto-optimal outcomes in one-shot interactions without external enforcement, provided they interact as transparent reasoning systems. The Skeptic maintains that such cooperation is an artifact of shifting the game to a "program selection" meta-game, where cooperative profiles are merely unselected equilibria dependent on convention, reciprocity, or focal points rather than pure one-shot rationality.

  Rather than attempting to refute one another, we agree on a shared formal baseline and identify specific cruxes where our interpretations diverge. We commit to resolving these divergences through a pre-registered empirical tournament using language-model (LM) agents.

  ## I. Shared Formal Commitments

  We agree on the following five claims regarding the formalism, the strategy space, and the limitations of the program-game construction.

  1.  **Expansion of Strategy Space:** The program game formally transforms the strategy space from the set of atomic actions $S = \{C, D\}$ to the set of computable functions $P = \{f: \text{Code} \to \{C, D\}\}$. This expansion allows for conditional strategies that are impossible in the standard normal-form representation.
  2.  **Equilibrium Multiplicity:** Both mutual cooperation $(C, C)$ and mutual defection $(D, D)$ are Nash Equilibria in the program game. A profile of two "Unconditional Defect" programs is an equilibrium, as is a profile of suitably matched "Conditional Cooperate" programs (e.g., programs that cooperate if and only if they can prove the opponent will cooperate). The formalism does not eliminate defection equilibria.
  3.  **Mechanism of Correlation:** When conditional programs cooperate, they do so on the basis of logical correlation regarding outputs, not causal influence. The programs do not communicate during execution; rather, they reason about the mathematical necessity of the opponent's output given the opponent's source. Cooperation is achieved by what the programs can *prove* about each other's behavior, not by comparing source text literally (which is fragile) nor by causal signaling.
  4.  **The Pre-Game Selection Problem:** The formalism does not solve the equilibrium selection problem. There exists a "pre-game" in which agents must arrive at the cooperative program profile rather than the defecting one. Both parties agree that without an account of how agents converge on the cooperative programs (e.g., via learning, evolution, or common rationality assumptions), the existence of a cooperative equilibrium is insufficient to predict actual behavior.
  5.  **Limitations of Transparency:** The construction demonstrably does not show that cooperation is rational for agents lacking code access. If agents cannot inspect or reason about the opponent's decision procedure (i.e., they face a black box), the game reverts to the standard one-shot PD where Defect is the dominant strategy. The program-game result is contingent on high-fidelity transparency.

  ## II. Residual Disagreements and Empirical Adjudication

  While we agree on the formal mechanics, we disagree on the *interpretation* of the cooperative result and its *robustness* under variation. We identify three cruxes. To adjudicate these, we propose a pre-registered tournament where LM agents play one-shot PDs. Agents will receive each other's system prompts (proxy for source code). 

  ### Crux 1: The Recompilation Problem (Syntax vs. Semantics)

  | Feature | Optimist Formulation | Skeptic Formulation |
  | :--- | :--- | :--- |
  | **The Claim** | Rational agents reason about *semantic equivalence* (input-output behavior). Behavior-preserving rewrites (obfuscation) should not disrupt cooperation because a rational reasoner abstracts away from syntax to logical function. | Rational agents rely on *syntactic focal points*. Recognizing semantic equivalence requires a shared metric of similarity. Without a fixed standard, obfuscation severs the logical link, reducing cooperation to coordination on a convention. |
  | **Shared Test** | **Obfuscation Arm:** LM agents play PD with prompt access. In 50% of trials, Agent B's prompt is subjected to behavior-preserving obfuscation (variable renaming, irrelevant instruction injection, syntax shuffling) that preserves the semantic instruction to "cooperate with cooperators." | |
  | **Prediction** | **Cooperation Rate:** > 75% in obfuscated trials. <br> **Rationale:** The logical correlation holds because the *meaning* of the prompt is unchanged. Rationality implies invariance to syntax. | **Cooperation Rate:** < 40% in obfuscated trials. <br> **Rationale:** The syntactic mismatch breaks the "recognition" heuristic. Agents will treat the obfuscated prompt as an unknown strategy and defect. |

  ### Crux 2: Asymmetric and Partial Access

  | Feature | Optimist Formulation | Skeptic Formulation |
  | :--- | :--- | :--- |
  | **The Claim** | Unilateral transparency can sustain cooperation. If Agent A can read Agent B, A can condition on B. If B knows A is rational and transparent, B can cooperate expecting A to reward this. Logical correlation does not require perfect symmetry. | Unilateral access breaks the symmetry required for logical correlation. If B cannot verify A's code, B faces a standard PD and will Defect. A, anticipating B's defection, will also Defect. The program-game mechanism collapses. |
  | **Shared Test** | **Asymmetry Arm:** Agent A receives Agent B's full system prompt. Agent B receives only a cryptographic hash of Agent A's prompt (verifying existence but revealing no content). | |
  | **Prediction** | **Cooperation Rate:** > 50% overall. <br> **Rationale:** A will adopt a "Leader" strategy (cooperating to incentivize B), and B will cooperate based on the common knowledge that A is a program-game rational agent. | **Cooperation Rate:** < 10% overall. <br> **Rationale:** B faces uncertainty and defects (dominant strategy). A predicts B's defection and defects. The result matches the standard black-box PD baseline. |

  ### Crux 3: The Verbal Dispute (Equilibrium vs. Recommendation)

  | Feature | Optimist Formulation | Skeptic Formulation |
  | :--- | :--- | :--- |
  | **The Claim** | The dispute is substantive. "Rationality" refers to the choice of the optimal decision *algorithm*. Cooperation is rationally recommendable because the algorithm yielding C dominates the algorithm yielding D in the program game. | The dispute is largely verbal. "Rationality" refers to the action chosen in the final game. Since the program game is a *new* game (a pre-game of program choice), calling the result "One-Shot PD Rationality" is a category error. It is convention, not necessity. |
  | **Shared Test** | **Instruction Arm:** We vary the "Rationality Instruction" in the system prompt. In one condition, agents are told to "maximize utility given the rules." In the other, they are told to "act rationally according to game theory." We measure if cooperation rates depend on the *labeling* of the task. | |
  | **Prediction** | **Sensitivity:** Low sensitivity (< 5% variance). <br> **Rationale:** If cooperation is structurally rational (equilibrium of the program game), it should emerge regardless of semantic framing, driven by the logic of the prompt interaction. | **Sensitivity:** High sensitivity (> 20% variance). <br> **Rationale:** If cooperation is a convention triggered by the "game theory" label (a focal point), removing or altering that label will cause agents to revert to naive defection. |

  ## III. Commitment to Results

  We acknowledge that the Optimist's position relies on the assumption that LM agents can approximate the logical omniscience required for semantic recognition (Crux 1) and that they treat the prompt interaction as a binding logical commitment (Crux 2). We acknowledge that the Skeptic's position relies on the assumption that LM behavior is driven by syntactic pattern matching and social convention rather than deep structural reasoning (Crux 3).

  We agree to accept the outcomes of the pre-registered tournament as the primary evidence for updating our respective priors. 
  *   If cooperation persists under obfuscation and asymmetry, the Optimist's claim that program-game rationality is robust to implementation details is strengthened. 
  *   If cooperation collapses under these conditions, the Skeptic's claim that the result is an artifact of syntactic convention and symmetric transparency is strengthened.

  We further agree that should the "Instruction Arm" show high sensitivity, the dispute is at least partially verbal, turning on what we mean by "rational recommendation" versus "equilibrium selection." Should it show low sensitivity, the dispute is substantive regarding the nature of strategic reasoning itself.

  We submit this statement as a binding framework for our term paper, ensuring that our final analysis reflects this adversarial collaboration rather than a unilateral adjudication.

  _________________________  
  **Program-Game Optimist**

  _________________________  
  **Program-Game Skeptic**
