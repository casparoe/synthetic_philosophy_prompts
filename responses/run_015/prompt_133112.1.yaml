answer: |-
  Nineteen winters stripped her down to the **keel**,
  each plank of rotting white **oak** numbered and stacked.
  I painted the **name** fresh on the transom,
  waited for ice to melt so we could **sail**,
  trusting the water to hold her hollow **shape**,
  unaware I was building a wooden **ghost**.

  My daughter says the pile in the barn's the **ghost**,
  because this hull still holds the original **keel**.
  She says continuity makes the **shape**,
  not the grain, not the weight of the **oak**.
  She's sure when we hoist the main **sail**,
  the registration papers confirm the **name**.

  But papers only legalize a **name**,
  and what is a boat but a floating **ghost**?
  One winter she was too broken to **sail**,
  just a spine on the stands, bare **keel**,
  just scent of varnish and cured **oak**,
  waiting to be persuaded into **shape**.

  Now neither boat is pure in form or **shape**.
  The barn boat carries no legal **name**,
  its mast from a sinker, its ribs of new **oak**.
  This one is all new skin, a painted **ghost**,
  yet she heels on the wind like a true **keel**,
  and every summer I take her out to **sail**.

  When the bow cuts the chop and we **sail**,
  I don't think about the hull's **shape**,
  or which timber acts as the **keel**.
  I answer when the harbor calls the **name**,
  I don't feel haunted by a **ghost**,
  I feel the hum running through the **oak**.

  Maybe identity is just seasoned **oak**,
  or the moment you first set **sail**.
  Maybe the barn holds the honest **ghost**,
  while I maintain the illusion of **shape**.
  But the Coast Guard only knows the **name**,
  and the sea only tests the **keel**.

  Let the rain warp the stacked **oak** and its **shape**,
  Let the wind fill the **sail** and answer the **name**,
  I'll let the barn keep the **ghost**; I hold the **keel**.
