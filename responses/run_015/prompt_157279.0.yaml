answer: |-
  ### Part 1: Neutral Outlines

  **Hume’s Is-Ought Distinction**
  David Hume observed that many moral arguments proceed from premises describing the state of the world (facts about what *is*) to conclusions prescribing action (claims about what *ought* to be). He argued that this transition is logically invalid without explanation. Descriptive premises alone do not contain the necessary logical connective to entail a prescriptive conclusion; a distinct normative premise is required to bridge the gap.

  **Moore’s Open-Question Argument**
  G.E. Moore argued that the property "good" is simple and indefinable. If one attempts to define "good" using any natural property (e.g., "pleasure" or "desired"), it remains meaningful to ask, "But is that property actually good?" If the definition were correct, this question would be tautological (closed). Since the question remains meaningful (open), "good" cannot be identical to any natural property or combination thereof.

  ***

  ### Part 2: Formal Translation

  Here I translate these claims into the vocabulary of formal verification (FV), specification languages, and system calculus.

  **1. Hume’s Claim: The Derivability Failure**
  In FV terms, Hume’s claim is that **requirement specifications are not synthesizable from implementation traces alone.**

  Let $\Sigma$ be the state-space of a system.
  Let $T \subseteq \Sigma^\omega$ be the set of valid execution traces (the "Is"/Implementation behavior).
  Let $\phi_{req}$ be a temporal logic formula representing a requirement (the "Ought"/Specification).

  Hume’s thesis asserts that for any set of descriptive premises $\Gamma_{desc}$ characterizing $T$, the following sequent is invalid without additional axioms:
  $$ \Gamma_{desc} \nvdash \phi_{req} $$
  You cannot derive a normative constraint $\phi_{req}$ solely from the characterization of the state-space or transition relation. The set of valid traces does not logically entail the requirement formula. To verify $\models \phi_{req}$, you must assume $\phi_{req}$ (or a higher-order constraint) as an axiom external to the descriptive model of the system. The gap is a **derivability failure** between the descriptive calculus (what the system *does*) and the normative calculus (what the system *must* do).

  **2. Moore’s Claim: The Non-Reducibility of Properties**
  In FV terms, Moore’s claim is that **the property `Good` is a primitive type not reducible to state predicates.**

  Let $\mathcal{P}$ be the set of all observable state predicates and temporal properties definable over $\Sigma$ (e.g., safety invariants, liveness conditions).
  Let `Good` be a specific property value or metric used in evaluation.

  Moore’s thesis asserts that for any predicate $P \in \mathcal{P}$, the equivalence is unprovable within the system calculus:
  $$ \nvdash (\text{Good} \leftrightarrow P) $$
  If you attempt to define `Good` as a composite property (e.g., `Throughput > X` $\land$ `Error = 0`), the verification condition checking this equivalence remains **open** (unproven). `Good` functions as an **oracle** or an external axiom rather than a derived property. It is not a safety property (invariant preservation) nor a liveness property (eventual progress) definable within the state-space; it is a meta-property assigned to the specification itself.

  ***

  ### Part 3: Residue Report

  This section analyzes the fidelity of the translation. It identifies where the mapping holds, where it distorts the original concepts, and where the formal verification framework lacks the expressive power to capture the philosophical claim.

  #### 1. Clean Mappings
  *   **Specification vs. Implementation (Ought vs. Is):** This maps cleanly. In FV, the Specification (Spec) is distinct from the Implementation (Impl). The Spec is the constraint; the Impl is the state-machine behavior. Hume’s gap is structurally identical to the distinction between *verification* (does Impl satisfy Spec?) and *synthesis* (can we generate Spec from Impl?). FV acknowledges that Specs must be provided externally; they are not emergent properties of the code.
  *   **Derivability within a Calculus:** Hume’s logical gap translates well to logical entailment. If your premise set contains only state-transition rules, you cannot derive a requirement formula without a bridge axiom. This is a standard soundness constraint in logic.
  *   **Open vs. Closed Properties:** Moore’s "open question" maps to an unproven verification condition. If `Good <-> P` were definable, model checking would return `True` trivially. The fact that engineers debate whether a specific metric captures "system health" mirrors the open-question argument.

  #### 2. Distortions and Misrepresentations
  *   **Normative Force as Liveness/Safety:**
      *   *Distortion:* Treating an "ought" as a liveness property (e.g., `G F GoodState`) or a safety property (`G !BadState`) captures the *structure* of the requirement but loses the *force*. In FV, a violated property is a **bug**. In ethics, a violated "ought" is a **wrong**.
      *   *Implication:* A bug implies a deviation from design. A wrong implies a violation of authority or reason. FV has no concept of "blame" or "obligation," only "conformance." Mapping "ought" to "spec constraint" reduces normative authority to engineering design choice.
  *   **The "Good" as an Oracle:**
      *   *Distortion:* In FV, if a property is undefined (an oracle), it is usually a placeholder for future refinement. Moore argues "Good" is *essentially* indefinable. Treating it as a primitive in a spec language suggests it could be axiomatic, whereas Moore suggests it is non-natural. This smuggles in a **formalist assumption**: that all meaningful properties must eventually be integrable into a formal system, whereas Moore denies this for value properties.

  #### 3. No Counterpart (The Framework Gap)
  *   **Agency and Realizability:**
      *   *Missing Concept:* FV deals with systems that *execute*. Ethics deals with agents who *choose*. The principle "Ought implies Can" has a analog in FV (realizability checking), but FV lacks a model for the *will*. A system satisfies a spec because it is deterministic (or constrained); an agent satisfies an ought despite the ability to do otherwise. The residue here is **counterfactual power**. FV traces are fixed; ethical choices involve branching possibilities that are not merely nondeterministic but volitional.
  *   **Reasons for Action:**
      *   *Missing Concept:* In FV, a spec is satisfied because the logic holds. In ethics, an agent acts because they recognize a *reason*. There is no formal analog for "recognizing a reason" in state-space exploration. You can model belief states, but not the normative weight of a reason compelling action.
  *   **The Source of the Specification:**
      *   *Missing Concept:* FV assumes the Spec is given by a designer. Ethics asks, "Who designed the Spec?" or "Is the Spec valid?" The is-ought gap highlights the lack of a mechanism to generate Specs from Facts. FV has no counterpart for **normative justification**. It handles *consistency*, not *validity of the axioms*.

  #### 4. Smuggled Computationalist Assumptions
  *   **Assumption 1: Logic is Normative.** I have assumed that logical entailment ($\vdash$) is the correct analog for ethical justification. This assumes ethical reasoning is computational. If ethical justification is phenomenological or social, the derivability model fails.
  *   **Assumption 2: State-Space Completeness.** I have assumed the "Is" can be fully captured by a state-space $\Sigma$. If moral facts involve qualia or non-representable states, the descriptive model is incomplete from the start.
  *   **Assumption 3: Static Specifications.** I have treated Specs as static formulas. In ethics, norms evolve. While specs can be versioned, the *logic* of their evolution is external to the verification system.

  #### 5. Conclusion: Defect in FV or Unique Feature of Ethics?
  The residue suggests that **the is-ought gap has no true analog in system specification because formal verification is not designed to solve the justification problem.**

  *   **Not a Defect in FV:** FV is a tool for checking consistency between a given design and a given requirement. It is agnostic about where the requirement comes from. Expecting FV to bridge the is-ought gap is like expecting a compiler to decide if a program is *useful*.
  *   **Unique Feature of Ethics:** The gap reveals that ethical systems require a mechanism for **axiom justification** that formal systems lack. In FV, axioms (specs) are arbitrary inputs. In ethics, axioms (norms) claim objective authority.

  **Final Verdict:** The translation holds structurally (Spec/Impl matches Ought/Is), but the residue reveals that formal verification lacks a model for **normative authority**. The is-ought gap is not a derivability failure within a system; it is a failure to derive the system's axioms from the system's state. This indicates that while FV can model the *structure* of moral reasoning, it cannot model the *grounding* of moral truth. The gap is real, and it lies outside the scope of formal methods.
