answer: |-
  ### Private Pass: Rejected Translations

  1.  **Claim (a) as "Reliability":** I initially considered translating "calibration" as *reliability* (consistency of measurement). I rejected this because reliability concerns the stability of the score itself, whereas calibration concerns the relationship between the score and the external outcome. In our context, a band could be perfectly reliable (everyone gets the same band on retest) but poorly calibrated (everyone fails).
  2.  **Claim (d) as "Standard Error of Measurement (SEM) Equality":** I considered mapping "treated alike" to having equal *measurement error* variance across groups. I rejected this because SEM addresses precision of the score estimate, not the decision rule. Two groups could have equal SEM but different *cut scores* applied to them, violating the spirit of individual fairness. *Measurement invariance* is the tighter fit.
  3.  **Claim (f) as purely "Consequential Validity":** I considered reducing the moral claim to *consequential validity* (evaluating the test by its social effects). I rejected this because the claim argues that the *definition* of accuracy is political, not just the side effects. Reducing it to consequential validity implies the technical validity is settled and only the outcomes are debatable, which misses the point.

  ---

  ### Translations and Residue Analysis

  **(a) Calibration within a group**
  *   **Translation:** For each band, the observed proportion of candidates succeeding in the programme matches the expected probability of success for that band, holding *base rates* constant across groups.
  *   **Residue:** This translates cleanly into *predictive validity* conditional on groups. However, it bends slightly because we do not report probabilities, only bands. We would have to impute a probability to each band to check this. It assumes the "score" in the claim maps to our "band," ignoring the lottery within bands which adds noise to the probability estimate.
  *   **Smuggled Assumption:** That the band implies a specific probability of success (i.e., that the standard setting established a valid probability for each band).

  **(b) Equal error rates / PPV**
  *   **Translation:** The test demonstrates equal *sensitivity and specificity* across groups; separately, it demonstrates equal *positive predictive value* across groups.
  *   **Residue:** This carries over cleanly. *Sensitivity* and *specificity* are standard terms for false-negative and false-positive rates. *Positive predictive value* is the proportion of selected candidates who succeed.
  *   **Smuggled Assumption:** That "success" is a binary, objectively defined state, rather than a graded or contaminated outcome.

  **(c) The impossibility result**
  *   **Translation:** When *base rates* of success differ between groups, a scoring procedure cannot simultaneously satisfy equal *sensitivity and specificity* and equal *positive predictive value* unless *classification consistency* is perfect (error is zero).
  *   **Residue:** This is mathematically clean in our vocabulary. The residue is philosophical: our vocabulary treats *base rates* as fixed facts of nature, whereas the fairness literature treats them as potentially mutable or unjust.
  *   **Smuggled Assumption:** That *base rates* are exogenous constants rather than endogenous outcomes of prior social processes.

  **(d) Individual-level requirement**
  *   **Translation:** Candidates with equivalent *true scores* should have the same probability of band allocation, implying strict *measurement invariance* (no *differential item functioning*) and consistent application of *cut scores*.
  *   **Residue:** This bends the concept. *Measurement invariance* ensures the test measures the same construct, but it does not guarantee the same *decision* if the *cut scores* are adjusted for groups (which our ratchet might effectively do). The claim demands similar treatment for similar people; psychometrics ensures similar *measurement*, not necessarily similar *selection* if quotas or fixed places intervene.
  *   **Smuggled Assumption:** That the *true score* captures all "relevant respects" for the decision.

  **(e) Outcome variable contamination**
  *   **Translation:** The outcome variable suffers from *criterion contamination* because instructors' ratings are influenced by knowledge of the band, inflating *predictive validity* estimates.
  *   **Residue:** Our vocabulary identifies this as error (*criterion contamination*), implying it can be fixed to reveal the "true" validity. The fairness claim suggests the outcome *is* the contamination—that there is no "true" success independent of the allocation. Our framework assumes a recoverable truth; the claim denies it.
  *   **Smuggled Assumption:** That a contamination-free criterion exists and is measurable.

  **(f) Moral/Political choice & Historical Injustice**
  *   **Translation:** The selection of *cut scores* is a matter of *consequential validity* and policy, not just statistical optimization; observed *base rate* differences may reflect historical *adverse impact* rather than construct differences.
  *   **Residue:** This is largely inexpressible. Psychometrics treats *adverse impact* as a signal to check for *DIF* or bias, not as a reason to reject the prediction model itself. The claim that "no allocation... can be fair" contradicts the foundational assumption that a valid test yields a fair allocation.
  *   **Smuggled Assumption:** That the construct being measured is valid and worthy of allocation in the first place.

  ---

  ### Taxonomy Table

  | source_claim | translation | fidelity | what_broke | smuggled_assumption | residue_verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | (a) Calibration | Predictive validity conditional on groups matches band expectations. | Clean | None | That bands map to valid probabilities. | n/a |
  | (b) Equal Error Rates | Equal sensitivity/specificity and equal positive predictive value across groups. | Clean | None | That success is binary and objective. | n/a |
  | (c) Impossibility | Cannot satisfy equal sensitivity/specificity and PPV simultaneously if base rates differ. | Clean | None | That base rates are fixed constants. | n/a |
  | (d) Individual Fairness | Measurement invariance and consistent cut scores for equivalent true scores. | Distorted | Invariance ensures measurement, not selection equity under fixed places. | That true score captures all relevant merits. | Defect of my framework |
  | (e) Outcome Contamination | Criterion contamination inflates predictive validity. | Distorted | Framework assumes a true criterion exists to be recovered. | That a contamination-free criterion exists. | Real gap in both |
  | (f) Moral/Political | Cut scores are consequential validity choices; base rates may reflect adverse impact. | Inexpressible | Framework treats base rates as data, not political artifacts. | That the construct is valid and neutral. | Defect of my framework |

