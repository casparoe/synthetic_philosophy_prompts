    "banding_lottery": "Moving from points to bands plus lottery reduces classification consistency and introduces intentional measurement error. It dissolves the conflict locally by coarse-graining the decision (hiding small differences in error rates) but does not resolve the global conflict. It merely hides the impossibility result within the width of the bands.",
