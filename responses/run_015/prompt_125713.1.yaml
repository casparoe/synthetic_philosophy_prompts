prompt: |-
  I work as a psychometrician at a national examinations agency, and I have no formal training in philosophy — I taught myself statistics on the job and I have been reading about algorithmic fairness in the evenings, on my own, because it has started to bear on our work. I have got as far as the family of results saying that the criteria people want a decision score to satisfy cannot all hold simultaneously, and I can follow the algebra, but I don't trust that I understand what is being claimed, because whenever I try to say it in the terms I actually use, it comes out as something I already know how to handle — and I suspect that means I am translating it into something else.

  So: please act as a professional philosopher who is also genuinely at home with applied measurement — someone who has sat through standard-setting meetings. Think carefully, and before writing your final answer do a short private pass in which you list two or three translations you considered and rejected, and why. Do not cite or recommend anything; I have no library access and I don't want a reading list.

  Our setup, which is idiosyncratic in three ways you should take into account rather than smooth over:

  1. Our score is used to allocate a fixed number of places (about 4,000) in a subsidised bridging programme. We do not report points; we report seven bands, and places within a band are allocated by lottery. The score is therefore, for us, a coarse ordering device and not an estimate anyone is shown.
  2. After a scandal, our board adopted a hold-harmless ratchet: under a revised scoring procedure, no individual's band may fall by more than one band relative to the old procedure, and no recognised group's mean band may fall at all. This is treated internally as a fairness requirement, and I have never been sure whether that is right.
  3. The outcome variable the score is trained to predict — whether a candidate "succeeds" in the programme — is recorded by instructors who can see the band the candidate came in on.

  Here is the list of claims I want translated, one by one, into the vocabulary I actually use (true and observed score, measurement error, item characteristic curves, differential item functioning and measurement invariance, linking and equating, cut scores and standard setting, classification consistency, sensitivity and specificity, base rates, predictive validity, criterion contamination, consequential validity, adverse impact):

  (a) A score is calibrated within a group when, among people in that group who receive a given score, the actual rate of the outcome matches the score.
  (b) A score has equal error rates across groups when the false-positive and false-negative rates are the same in each group; and, separately, when a given score carries the same positive predictive value in each group.
  (c) The impossibility result: when the underlying outcome rates differ between groups, a score that is not perfectly accurate cannot have all of these properties at once.
  (d) The individual-level requirement, rather than the group-level one: people who are alike in the relevant respects should be treated alike.
  (e) The worry that the outcome variable is not the thing we care about but a record of our own earlier allocation decisions, so that improving "accuracy" partly consists in reading our prior practice back to ourselves.
  (f) The claim that where the criteria conflict, the choice between them is a moral or political choice and not a technical one — and the stronger claim that no allocation by predicted outcome can be fair at all if the differing rates are themselves the product of earlier injustice.

  For each, give me the most faithful restatement you can in my vocabulary, and then report the residue honestly: what carried over cleanly, what carried over only by being bent, and what cannot be said in my vocabulary at all. Please also flag, explicitly, anywhere you are quietly importing an assumption from my field rather than translating — for instance, that the construct is real and measurable, that the groups are given and exhaustive, that the outcome label is what we are trying to predict, or that a better estimate is ipso facto a better decision procedure.

  After the prose, give me a table with exactly these columns:

  - source_claim — the claim, one row per claim (a) through (f), in plain English
  - translation — the same claim in psychometric terms
  - fidelity — one of: clean, distorted, inexpressible
  - what_broke — what had to be fudged or dropped
  - smuggled_assumption — any assumption of my vocabulary that the original claim does not make, or "none"
  - residue_verdict — for distorted and inexpressible rows only: whether this is a defect of my framework, a defect of the original claim, or a real gap in both; "n/a" for clean rows

  Then a single JSON object with these fields:

  - "ratchet": where the hold-harmless rule belongs, if anywhere, in the taxonomy of the claims above, and what it costs
  - "banding_lottery": what the move from points to bands plus lottery does to each of the criteria, and whether it dissolves any of the conflict or merely hides it
  - "criterion_contamination": what my framework already says about claim (e), and where it stops short of what the fairness literature is saying
  - "framework_cannot_say": an array of two to four things my vocabulary has no resources to express
  - "source_less_clear_than_it_looks": an array of one to three places where the original claim is doing less work than it appears to
  - "one_misleading_thing_i_say_at_work": the single sentence I use in meetings that the translation shows to be confused, and what I should say instead
