answer: |-
  To resolve your impasse, you require a specification that bridges normative theory and empirical application. Below are five desiderata for an adequate theory of centipede play, classified by necessity.

  ### Desiderata for Adequacy

  1.  **Counterfactual Actionability (Non-negotiable)**
      The theory must prescribe a move at any reachable node, even those assigned probability zero by the theory's own equilibrium path.
      *Rationale:* You are actually at node four. A theory stating 'you should not be here' offers no guidance. Action requires beliefs about off-equilibrium contingencies.

  2.  **Algorithmic Explicitness (Non-negotiable)**
      The decision rule must be finite, discrete, and operable without human intuition.
      *Rationale:* To compare against laboratory play via simulation, the theory must be codable. Philosophical definitions of 'rationality' that resist operationalisation fail this test.

  3.  **Payoff Responsiveness (Non-negotiable)**
      Prescriptions must vary continuously with changes in expected value structures.
      *Rationale:* Rationality is means-ends reasoning. If the cost of passing changes (e.g., risk of termination), the rational choice must reflect this calculus rather than remaining fixed by structural form alone.

  4.  **Topological Continuity (Negotiable)**
      As information noise tends to zero, the prescribed strategy should converge to the perfect-information verdict.
      *Rationale:* Physical reality involves measurement error. A theory that breaks discontinuously when observation becomes merely 'very good' rather than 'perfect' is physically implausible.

  5.  **Structural Autonomy (Negotiable)**
      Prescriptions for a game should not depend on unmodelled external histories unless rules explicitly link payoffs.
      *Rationale:* Prevents smuggling in ad hoc psychological assumptions (like reputation) where the formal structure does not support them.

  ### Stress-Test Analysis

  **(i) The Leaky Centipede:** Here, Nature terminates play with probability $\epsilon$. **Payoff Responsiveness** obliges the theory to recommend passing if the expected value of continuing exceeds taking. Standard Backward Induction (BI) often fails here if it treats the game structure as rigid rather than payoff-sensitive. A sound theory must agree with your dinner guests: passing is rational because the risk is priced into the expected utility, not because players are 'irrational'.

  **(ii) The Linked Centipedes:** The pot size depends mechanically on previous play. This alters the payoff function, triggering **Payoff Responsiveness**. However, **Structural Autonomy** forbids invoking 'reputation' (beliefs about opponent type) unless the model explicitly includes type uncertainty. If the link is purely mechanical, the verdict changes due to payoffs, not reputation. If the link is absent, the verdict should not change merely because games are consecutive.

  **(iii) Noisy Signals:** Information is imperfect. **Topological Continuity** demands that as signal noise $\to 0$, the solution approaches the perfect-information case. Many equilibrium refinements fail this, exhibiting jumps where microscopic noise completely alters the strategic landscape. An adequate theory must be robust to this limit.

  ### Inconsistencies and Exclusions

  There is a fundamental tension between **Counterfactual Actionability** and the **Common Knowledge of Rationality (CKR)** assumption underpinning standard BI. CKR implies node four is impossible; if impossible, Bayesian updating is undefined. You cannot maintain strict CKR and satisfy the requirement to advise a player actually sitting at node four. One must be dropped.

  **Most Exclusionary Requirement:** **Counterfactual Actionability**. This single requirement excludes naive Backward Induction and any theory relying on strict Common Knowledge of Rationality without refinements (like trembling hands). It forces the theory to model beliefs where the equilibrium says there should be none.

  ### Verdicts on Usual Suspects

  *   **Common-Knowledge Argument:** Fails Counterfactual Actionability; offers no advice at node four without ad hoc modifications.
  *   **Reputation Story:** Fails Structural Autonomy unless type uncertainty is explicitly modelled in the rules.
  *   **Level-k Models:** Satisfies Actionability and Explicitness; struggles with Topological Continuity and normative force.
  *   **Quantal-Response Equilibrium:** Satisfies Actionability, Explicitness, and Continuity; computationally intensive but robust.
  *   **Social-Preference Explanations:** Satisfies Actionability and Payoff Responsiveness; often lacks Algorithmic Explicitness regarding preference formation.

  Your friend's view collapses because it treats rationality as a static label rather than a decision procedure. To advise a player at node four, you must abandon the idea that reaching node four is impossible.
