answer: |-
  **MEMORANDUM**

  **TO:** Stratigraphic Nomenclature Committee
  **FROM:** Chair, Stratigraphic Nomenclature Committee
  **DATE:** October 14, 2024
  **SUBJECT:** Recommendation for the 2027 Time Scale: Definition of the Anthropocene

  **1. Context and Decision**

  We face a deadline of 2027 to publish the revised National Time Scale. This document underpins our geological maps, the national science curriculum, and a suite of environmental regulations that define regulatory scope by reference to stratigraphic units. We have three proposals before us: a formal unit based on the mid-20th-century radionuclide signal; a formal unit based on early agricultural signatures; and a designation of the Anthropocene as an informal geological event without a fixed boundary.

  After reviewing the submissions against our Standing Rules and the broader responsibilities of the Survey, I am circulating this recommendation prior to our next meeting. I intend to exercise the casting vote in favor of **a fourth course of action: The adoption of the 1950 radionuclide horizon as the formal Chronostratigraphic boundary, conditioned on the parallel establishment of a National Anthropogenic Lithostratigraphy Register.**

  This approach adopts the Quaternary group's boundary for the official Time Scale but incorporates the Soil and Geomorphology colleagues' evidence into a complementary, non-chronostratigraphic framework.

  **2. Rationale**

  Our Standing Rules are explicit. Rule 1 requires a primary marker "demonstrably close to isochronous across the whole territory." Rule 3 requires "demonstrable utility for mapping and for the regulations that lean on us."

  The agricultural proposal, while historically compelling, fails Rule 1. Land clearance and wet-rice cultivation are inherently diachronous; they spread across the territory over millennia. To assign them a single "golden spike" would be stratigraphically incorrect and would require us to ignore the time-transgressive nature of the evidence in our own archives.

  The "Informal Event" proposal satisfies the geological reality of diachrony but fails Rule 3. Our environmental regulations do not reference "events"; they reference "units." To remove the Anthropocene from the formal time scale would create immediate ambiguity in regulatory enforcement, potentially weakening the legal protections that rely on our definitions.

  Therefore, the 1950 radionuclide signal is the only candidate that satisfies the strict definition of a chronostratigraphic unit. It is isochronous, it is globally correlatable, and it provides the discrete boundary required by law. However, adopting it without qualification risks reducing a complex geological and historical process to a single technical line. The Hybrid Recommendation allows us to maintain stratigraphic rigor while acknowledging the full scope of human impact.

  **3. The Strongest Argument Against This Recommendation**

  I want to state the case against my own recommendation as clearly as possible, because it is the view held by two members of this committee and many of our external partners.

  **The argument is this:** By selecting 1950 as the formal boundary, we are not making a neutral scientific decision; we are making a political choice that privileges a narrative of "modern industrial acceleration" over a narrative of "long-term colonial transformation." Our archives contain detailed records of severe ecological disruption caused by colonial-era land clearance well before 1950. By fixing the official "Age of Humans" to the mid-20th century, we risk implicitly categorizing those earlier transformations as "natural" or "pre-Anthropocene." This could be read as a verdict that absolves earlier actors of responsibility and obscures the deep history of human-induced change in favor of a date that aligns with nuclear testing rather than land dispossession. In short, this recommendation prioritizes stratigraphic convenience over historical truth, and it uses the authority of the Geological Survey to sanitize the timeline of human impact.

  This is a serious charge. It suggests that our adherence to Rule 1 (isochrony) comes at the cost of scientific honesty regarding the *onset* of human influence. It argues that a stratigraphic body *does* have business in historical narrative, whether we like it or not, because our boundaries are used to write history.

  **4. Mitigation and Concrete Commitments**

  I do not accept that stratigraphy must be silent on history, but I do maintain that chronostratigraphy cannot be diachronous. To address the valid concerns raised above, this recommendation commits the Survey to the following actions over the next five years:

  *   **Curation of the Reference Section (1950):** We will designate and legally protect a reference section for the 1950 radionuclide horizon (e.g., a specific lake core or peat bog). This satisfies Rule 2 and secures the formal unit.
  *   **Establishment of the Anthropogenic Lithostratigraphy Register:** Concurrently, we will launch a working group to map the diachronous signals of human impact (agricultural soils, colonial clearance surfaces) as *lithostratigraphic* units rather than chronostratigraphic ones. These units will be published in a companion atlas. They will not appear in the Time Scale legend, but they will be part of the Survey's official data release. This ensures the colonial-era transformations are recorded, accessible, and citable, even if they do not define the epoch.
  *   **Revision Procedure:** This decision includes a sunset clause. Should the International Commission on Stratigraphy (ICS) formally ratify a different definition or reject the formalization of the Anthropocene entirely before 2030, we will convene an emergency session to align the National Time Scale with the international standard. We will note in the 2027 legend that the national definition is provisional pending international consensus.
  *   **Curriculum Guidance:** We will issue a specific guidance note to the curriculum office. Textbooks must teach the 1950 boundary as a *stratigraphic marker of global synchronization*, not as the *start of human impact on the environment.* Lesson plans should explicitly reference the earlier agricultural and colonial signals using the data from the Lithostratigraphy Register. We will provide them with the materials to teach the distinction between "when humans started changing the earth" and "when the signal became globally isochronous."

  **5. Conclusion**

  This path is not without risk. It requires us to hold two truths at once: that the 1950 horizon is the only valid *chronostratigraphic* boundary, and that human impact began long before and varies across space. It asks us to be rigorous in our definitions without being reductive in our storytelling.

  I believe this is the only way to satisfy our Standing Rules while honoring the complexity of the evidence in our archives. I ask the committee to review this proposal with the understanding that the casting vote will be exercised in this direction unless a consensus emerges that better satisfies Rule 1 and Rule 3 without compromising the integrity of the colonial record.

