  I seek the form that makes the living horse,
  The shape abiding deep within the horse,
  No pigment spread upon the flank of horse,
  But structure fixed within the ideal horse.
  The hoof, the mane, the head define the horse,
  A constant kind, the essence of the horse,
  Though skins may vary, still we name it horse,
  For taxonomy confirms the true horse.
  Yet here a mutation breaks the rule of horse,
  In leucistic white stands now the ghostly horse.
  Does color white dissolve the name of horse?
  It splits the kind, this white and blinding horse.
  If form persists, why doubt the being horse?
  Or is the white horse not the same as horse?
