answer: |-
  My dear friend,

  I write to you today to ponder a question that has long troubled philosophers of value and rational choice, namely the transitivity of the relation better than. We are both familiar with the standard linear spectrum argument, a device often employed to suggest that this fundamental relation might not hold universally. In that familiar formulation, we are asked to imagine a sequence of options beginning with one that is clearly superior and ending with one that is clearly inferior, linked by a chain of intermediate steps where each step is only negligibly different from the last. The argument proceeds by asserting that if each option in the sequence is better than the next, then by the transitivity of better than, the first option must be better than the last. Yet, our intuitions often rebel against this conclusion, suggesting instead that the final option is not worse than the first, or perhaps even better, thereby threatening the transitivity of the relation. The force of this argument relies heavily on the plausibility of the pairwise judgments across the spectrum, but it has historically faced two formidable objections. The first appeals to vagueness and tolerance principles, suggesting that because better than is a vague predicate, there is no sharp point in the spectrum where the relation fails, and thus we are not compelled to accept the chain all the way through. The second objection appeals to hidden multidimensionality, arguing that the spectrum subtly shifts the criteria of comparison from one end to the other, such that we are not comparing the same kind of value throughout, but rather trading off distinct dimensions like quality and quantity.

  It is in response to the limitations of this linear model that the cyclic formulation offers a provocative alternative. In this version, we construct a chain of pairwise improvements that does not terminate in a clearly inferior option but instead loops back upon itself, yielding a circle of judgments such that A is better than B, B is better than C, and C is better than A. This structure eliminates the endpoints that characterize the linear spectrum, and in doing so, it appears to sidestep the objection based on vagueness-driven tolerance principles. In the linear case, the skeptic can always posit a hidden cutoff point where the negligible improvement ceases to generate a better than judgment, thereby preserving transitivity by denying one link in the chain. However, in the cyclic case, there is no endpoint where the chain stops or where a sharp boundary might be hidden; every option is both better than one neighbor and worse than another. If the pairwise judgments are accepted as strict and genuine, the violation of transitivity is direct and unavoidable, for there is no room to posit a threshold where the relation dissolves. The circle forces us to confront the possibility that better than might be inherently non-transitive, rather than merely appearing so due to the sorites-like accumulation of small differences.

  However, we must ask whether this cyclic version truly escapes the second standard objection regarding hidden multidimensionality. Here the prospects are less clear, for the mechanism that generates the cycle often relies on the same trade-offs that plague the linear spectrum. To construct a cycle where A is better than B, B is better than C, and C is better than A, one typically varies attributes across the options in a way that shifts the weight of evaluation. For instance, A might excel in quality, B in quantity, and C in duration, with each option beating the next on the dimension most salient in that specific pairwise comparison. If this is the case, the objection remains potent: the relation better than is not failing to be transitive, but rather we are equivocating on what better than means in each context. If the criteria for judgment shift between the comparison of A and B and the comparison of B and C, then the cycle does not demonstrate genuine non-transitivity of a single relation, but rather the incommensurability of different evaluative standards. Thus, while the cyclic formulation immunizes itself against the vagueness objection by removing the endpoints, it remains vulnerable to the charge that it masks an underlying transitive structure by conflating distinct dimensions of value.

  This leads us to the deeper assessment of whether the cyclic argument succeeds in showing that the relation is genuinely non-transitive rather than merely embedded in a circular ordering that masks an underlying transitive structure. If the cycle is genuine, it implies that rational choice is fundamentally compromised, opening the agent to money pumps where they would willingly pay to move from A to B, B to C, and C to A, ending up back at A with less money and no gain. Most philosophers find this conclusion untenable, suggesting that the cycle reveals a flaw in our elicitation of preferences rather than in the logic of value itself. It is plausible that the circular ordering is an artifact of context-dependent evaluation, where the presence of a third option alters the perceived value of the others, or where the agent fails to integrate the multidimensional attributes into a unified all-things-considered judgment. If we could step back and view the options from a God's-eye perspective, integrating all dimensions simultaneously, the circle might dissolve into a transitive ranking, perhaps revealing that A, B, and C are equally good, or that one is strictly superior when all factors are weighed together.

  Therefore, while the cyclic formulation is a sophisticated refinement of the linear spectrum argument that effectively neutralizes objections based on vagueness and the lack of a sharp cutoff, it does not definitively prove that better than is non-transitive. It succeeds in showing that our intuitive pairwise judgments can form cycles, but it fails to rule out the explanation that these judgments are flawed or context-bound reflections of a deeper, transitive axiological structure. The cycle may be epistemic rather than ontic, reflecting the limitations of our comparative faculties rather than the nature of value itself. Until we can demonstrate that the pairwise judgments hold under conditions of full information and stable criteria, the cyclic argument remains a powerful challenge to our confidence in transitivity, but not a conclusive demonstration of its failure. It leaves us in a state of productive uncertainty, urging us to refine our understanding of how multidimensional values are aggregated into a single verdict, rather than forcing us to abandon the transitive framework that underpins so much of our rational deliberation. I hope these reflections prove useful to your own inquiries, and I look forward to hearing your thoughts on whether the cycle can ever be truly closed without tearing the fabric of rational choice.

  Yours sincerely,

  A Correspondent
