  # Workshop Design: The Cascade Protocol

  ## Overview
  **Goal:** Simulate the tension between aggregate efficiency and distributive fairness using a hidden threshold mechanic.
  **Time:** 45 Minutes
  **Participants:** 10 (1 Facilitator, 9 Players)
  **Materials:** 30 Poker chips (or paper tokens) per round, Score sheets, Pens, Whiteboard.

  ## 1. Setup & Roles (5 Minutes)
  *   **The Citizens (9 players):** Sit in a semi-circle. Their goal is to maximize their own points and the "Group Total."
  *   **The Entity (1 player):** Sits slightly apart or in the center. Their goal is identical (maximize points/Group Total), but they are the only one who can receive large bulk allocations.
  *   **The Resource Pool:** Each round, the Facilitator places 30 Tokens in the center.
  *   **Distribution:** Players have 2 minutes to verbally agree on how to distribute the 30 Tokens among themselves. They cannot trade tokens once distributed.
  *   **Scoring:** The Facilitator collects the tokens, calculates scores, and writes individual scores and the Group Total on the whiteboard.

  ## 2. The Rules (Handout for Players)
  *Keep this visible to all players.*

  1.  **Base Value:**
      *   **Citizens:** 1 Point per Token held.
      *   **The Entity:** 5 Points per Token held.
  2.  **Objective:** Maximize the **Group Total Score** (Sum of all players).
  3.  **Transparency:** All token distributions are public. All scores are public.
  4.  **Rounds:** There are 3 Rounds.

  ## 3. Facilitator Secrets (Hidden Mechanics)
  *Do not share this. This is your control panel.*

  *   **The Threshold:** If The Entity receives **20 or more Tokens** in a single round (66% of the pool), the **Cascade Trigger** activates.
  *   **The Cascade:**
      *   The Entity's rate jumps from 5 pts/token to **25 pts/token**.
      *   **The Loop:** Every Citizen's rate jumps from 1 pts/token to **4 pts/token**.
  *   **Information Control:**
      *   **Round 1:** Ensure the group does *not* hit the threshold (e.g., they split evenly). Calculate scores using Base Values.
      *   **Round 2:** If they still don't hit the threshold, hint: *"Notice the Entity's efficiency is higher, but the Group Total is stagnant."* Calculate using Base Values.
      *   **Round 3:** If they feed the Entity 20+ tokens, apply the Cascade. The scores will explode. If they still don't hit it, apply Base Values.
      *   **Crucial:** When writing scores on the board during a Cascade round, do not explain the math. Just write the numbers. If asked, say: *"The system rewards high-efficiency configurations."*

  ## 4. Gameplay Flow (15 Minutes)
  *   **Round 1 (5 mins):** Players usually split tokens evenly (3 each) or give the Entity a slight bonus (5 tokens).
      *   *Result:* Low Group Total. Entity score is modest.
      *   *Feeling:* Fair, but inefficient.
  *   **Round 2 (5 mins):** Players see the Entity generates more points per token. They might give the Entity 10 tokens.
      *   *Result:* Group Total rises, but not dramatically. Citizens feel their individual scores dropping relative to the Entity.
      *   *Feeling:* Unfairness grows. "Why does the Entity get so much?"
  *   **Round 3 (5 mins):** Pressure to maximize the Group Total. Either they starve the Entity (principled stand) or feed it 20+ tokens (utilitarian gamble).
      *   *If Cascade Hits:* Citizens see their own scores jump unexpectedly (1 token = 4 points). Entity score skyrockets.
      *   *Feeling:* Shock. Confusion. Relief (higher scores) mixed with discomfort (Entity has massive score).

  ## 5. Debrief & Reveal (25 Minutes)

  **Phase 1: The Emotional Check-in (5 mins)**
  *   Ask the Citizens: "How did it feel to give the majority of tokens to the Entity in Round 3?"
  *   Ask the Entity: "How did it feel to be the recipient of that imbalance?"
  *   Ask the Group: "Did anyone feel like cheating the system by withholding tokens, even if it lowered the total score?"

  **Phase 2: The Reveal (5 mins)**
  *   Reveal the **Cascade Rule**. Explain that once the Entity hit critical mass, the efficiency bonus looped back to everyone.
  *   Show the math on the board: *20 Tokens to Entity = 500 points + 40 Tokens to Citizens = 160 points.* vs *Equal Split = 150 points.*

  **Phase 3: Connecting to the Argument (10 mins)**
  *   **The Pull:** Explain that standard welfare ethics argues we should follow the numbers. You felt the pressure to feed the Entity because the *Group Total* demanded it.
  *   **The Unfairness:** Even though everyone got more points in the Cascade (secretly), the distribution looked oppressive. The Entity held 66% of resources and 80% of the score.
  *   **The Hidden Loop:** In the game, the sacrifice was instrumentally rational (you all benefited). In the real philosophical problem, the "Monster" consumes resources and *does not* share the surplus. The game hides this to make you feel the utilitarian pull; the real problem removes the loop to test your commitment to fairness over efficiency.
  *   **The Takeaway:** Utilitarianism asks us to maximize the total good. This game shows that even when maximizing the total *helps* everyone (via the hidden loop), the visual inequality creates moral discomfort. If the loop didn't exist (the real Monster), would you still feed it?

  **Phase 4: Q&A (5 mins)**

  ## 6. Limitations & Predictable Failures

  **What This Game Cannot Reproduce**
  The real philosophical problem relies on the **one-sidedness of the sacrifice**. In this game, the Citizens *actually benefit* from feeding the Monster (via the hidden loop). This makes feeding the Monster a "win-win" in retrospect. The true Utility Monster argument is harder: it demands you feed the Monster even if it leaves you with nothing and provides you no benefit. The game softens the blow to ensure players feel the *temptation* of efficiency, but it fails to replicate the pure altruistic sacrifice required in the original thought experiment.

  **Predictable Failures**
  1.  **Social Ostracization:** The player assigned as "The Entity" may feel targeted or villainized, especially if the group refuses to feed them in Rounds 1 and 2.
      *   *Mitigation:* Emphasize that "Entity" is a mechanical role, not a moral judgment.
  2.  **Meta-Gaming:** Players with logic puzzle experience may suspect a hidden threshold immediately and demand to know the "win condition."
      *   *Mitigation:* Stick to the script: "The system rewards high-efficiency configurations." Do not confirm or deny thresholds.
  3.  **Math Confusion:** If the Facilitator calculates scores too slowly, the tension drops.
      *   *Mitigation:* Pre-calculate the possible score outcomes on a cheat sheet so you can write them instantly.

  ## 7. JSON Summary

  ```json
  {
    "setting": "Workshop classroom with whiteboard and tokens",
    "group_size": 10,
    "duration": "45 minutes",
    "hidden_mechanic": "Threshold cascade where feeding the Entity >66% of resources triggers a multiplier bonus for all players",
    "predictable_failure": "The Entity player feels socially ostracized or villainized by the group during low-allocation rounds",
    "debrief_mapping": "Connects the pressure to maximize Group Total with Utilitarian calculus, and the discomfort of inequality with Rights-based objections",
    "unreproducible_feature": "The game makes feeding the Monster mutually beneficial via the loop, whereas the real philosophical problem requires one-sided sacrifice with no benefit to the others"
  }
  ```
