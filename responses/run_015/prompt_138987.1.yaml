answer: |-
  The ventilation hums low in the Common Room, fighting the heat radiating from twenty teenagers undergoing annealing. We call the drug Anneal, though the brochure says *Cognitive Relaxant Compound 4*. It smells like wet pennies and ozone.

  I'm sixteen, which means I'm sober. I sit at the monitoring desk with a tablet, watching the biometrics scroll on the left and the kids on the right. My job is to keep everyone safe and write the Friday Note. It's a privilege. Most kids my age are out there on the rugs, their pupils dilated, their shoulders dropped. They look like marionettes whose strings have been unclenched.

  The theory is simple, though no one says it out loud. You heat the iron to shape it. Or, you heat the iron to see how it cracks.

  Mr. Vance sits in the corner armchair, holding a mug of tea he hasn't touched. He doesn't supervise; he observes. He thinks the whole program is unethical, but the Headmaster likes his tenure, so he stays.

  "You're hovering," Vance says. His voice is low, meant only for me.

  "Leo's heart rate is spiking," I say, not looking up.

  "Leo is having a feeling," Vance corrects. "Under normal circumstances, he'd swallow it. Now he's supposed to let it out so we can fix it. Or so we can file it. Depending on who you ask."

  I glance at Leo. He's usually quiet, the kind of boy who apologizes when you bump into him. Now he's sitting cross-legged, staring at his hands. The Anneal makes you suggestible, softens the rigid structures of habit. It's supposed to be therapeutic. Earlier, I watched a girl named Sam cry about her parents' divorce for twenty minutes while a counselor held her hand. When she came down an hour later, she looked lighter, like a knot had been untied. That was the forge working. She was pliable, so they guided her toward acceptance. It was sweet. It felt like care.

  But then there's the other part. The testing part.

  Leo looks up. His eyes find me across the room. The drug removes the filter between impulse and action.

  "You think you're better than us," Leo says. He isn't shouting. He sounds tired.

  The room doesn't go silent—there's always murmuring during Anneal—but I feel the air shift. Two counselors nearby pause, watching. Protocol says let them run the course unless there's danger.

  "I'm monitoring," I say. My voice sounds too crisp in the warm room.

  "You're watching," Leo says. "You like watching. You don't take it because you like being the only real person in the room."

  My throat tightens. Is this true? I pride myself on my control. I tell myself I'm waiting until I'm eighteen to take it, that I want my brain to be fully formed before I start reshaping it. But sitting here, sober, while everyone else dissolves… sometimes I feel like a god. Sometimes I feel like a jailer.

  "It's the drug talking, Elara," Vance says from his corner. "You know that. His prefrontal cortex is currently offline. You're not being judged by a person right now. You're being judged by a chemical reaction."

  "Or maybe," I say, keeping my eyes on Leo, "maybe the drug just stopped him from lying."

  Leo laughs, a dry, brittle sound. "She wants it to be real. Because then she's not a monitor. She's just a girl everyone hates."

  "That's enough," a counselor says gently, moving toward Leo. She offers him water. He takes it, his hand shaking. The peak is passing. The softness is turning back into rigidity. In an hour, he'll be himself again. He'll remember saying this. He'll feel shame. Or he'll feel relief.

  I look down at my tablet. The cursor blinks in the text box for Leo's Friday Note. *Subject exhibited hostility toward monitoring staff. Root cause: insecurity regarding academic standing?* That's what the template suggests. That's the safe note. It treats the outburst as a symptom, something to be fixed in next week's one-on-one session.

  But what if it's not a symptom? What if Leo hates me? What if the Anneal didn't create that hatred, just removed the politeness that hid it?

  Vance stands up and stretches. "You're trying to write a biography of a shadow," he says, looking over my shoulder at the screen. "If you record this as 'truth,' you punish him for being sick. If you record it as 'noise,' you ignore the fact that he chose to speak."

  "We have to record something," I say. "How else do we know if he's improving?"

  "Improving according to whom?" Vance asks. "You're treating them like clay, Elara. Clay doesn't have a say in the shape. People do. Even when they're messed up."

  He walks away before I can answer. He's not wrong. The school isn't evil. The counselors love these kids. They want to take away the pain, the awkwardness, the rigid bits that make life hard. They want to bend us into shapes that fit better in the world. But Vance thinks the bending breaks something essential.

  Leo is breathing steadily now. He looks at me again, eyes clear but heavy. He doesn't apologize. He just waits for the session to end.

  I look back at the tablet. The cursor keeps blinking. *Root cause…*

  If I write that he's hostile, he gets extra mentoring. He gets worked on again. If I write that it was chemically induced instability, it gets filed away, but he stays the same.

  I think about Sam, feeling lighter after her cry. I think about Leo, feeling exposed. I think about myself, sober and safe behind the desk, deciding which version of them counts.

  I type: *Subject expressed resentment regarding supervision.*

  I don't add a cause. I don't add a solution. I just save the file. It hangs there, neither a diagnosis nor a dismissal. Leo stands up to get more water. He looks at me one last time, and I can't tell if he's asking for forgiveness or daring me to write him down.

  The ventilation hums. The drug wears off. The iron cools. I don't know if what hardened back into place is what was there before, or something new we hammered into him. I close the tablet and wait for the next kid to start speaking.
