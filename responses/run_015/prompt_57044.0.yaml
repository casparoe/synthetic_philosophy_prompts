          *   Status (theorem, corollary, heuristic).
          *   Truth value (true, defensible, false).
          *   Coverage: Average performance (optimisation), Generalisation error, Counting claim (A vs B), Humean underdetermination, Economic aphorism, Inductive bias trade-off.
      *   **Assessment:** For each reading, assess relevance to the specific disagreement (explicit priors vs. justification of induction).
      *   **Specific Questions to Address:** Does it show explicit priors don't help? Does it require uniform distributions? Is the folk version weaker/stronger than the theorem?
      *   **Conclusion:** Identify the most common intent, the intent needed for the argument, and whether the gap explains the slogan's rhetorical efficiency.
      *   **Language:** British English.

  2.  **Deconstruct "No Free Lunch" (NFL):**
      *   *Origin:* Economics (Milton Friedman etc.) -> "There ain't no such thing as a free lunch." Meaning: You can't get something for nothing; costs are hidden.
      *   *Machine Learning/Optimisation:* Wolpert & Macready (1997).
      *   *Core Mathematical Idea:* Averaged over *all* possible functions (uniform prior), all algorithms perform equally well (or poorly).
      *   *Philosophical Implication:* Induction requires assumptions (bias). Without bias, learning is impossible.

  3.  **Drafting the Menu Items (Iterative Process):**

      *   *Item 1: The Optimisation/Search Theorem (Wolpert & Macready).*
          *   Thesis: All search algorithms perform identically when averaged over all possible objective functions.
          *   Assumptions: Uniform distribution over all functions (or permutation invariant). Fixed set of algorithms compared over the *same* set of problems.
          *   Status: Proved theorem.
          *   Truth: True under assumptions.
          *   Relevance: High, but assumptions are extreme.

      *   *Item 2: The Generalisation/Learning Theory Claim (Schaffer, etc.).*
          *   Thesis: Expected generalisation error is independent of the learning algorithm when averaged over all target functions.
