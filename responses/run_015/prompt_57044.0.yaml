      *   *Check:* Is the distinction between "solved" and "dissolved" clear? Hume asks "Why induction?" Bayesian says "It's definitionally probability." NFL says "Induction needs bias."
      *   *Check:* The "gap" explanation. The slogan works because it sounds like a hard mathematical limit on *success*, whereas the theorem is a limit on *average success over a meaningless distribution*.

  7.  **Final Polish (British English & Formatting):**
