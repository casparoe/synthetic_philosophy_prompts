answer: |-
  This is an excellent request. Your friend's summary captures the *spirit* of Kripke's *Wittgenstein on Rules and Private Language* (often called "Kripkenstein"), but it glosses over several critical philosophical distinctions. In doing so, it turns a subtle argument about meaning into a blunt instrument of relativism.

  Here is a careful audit of her claims, broken down by philosophical component, followed by direct answers to your specific questions.

  ### Part 1: Point-by-Point Audit

  #### 1. The Skeptical Paradox
  > **Her Claim:** *"Kripkenstein shows that when you compute 68 plus 57, there is no fact of the matter whether you meant plus or quus, because every past use is compatible with infinitely many rules..."*

  *   **Verdict:** **Fair and Accurate.**
  *   **Analysis:** This is the **Skeptical Paradox**. She correctly identifies the core problem: no internal mental state, disposition, or past behavior logically forces one specific rule (plus) over a deviant rule (quus). The skeptic argues that there is no "truth-condition" that makes it *true* that I meant plus. This part of her summary is philosophically sound.

  #### 2. The Transition to the Solution
  > **Her Claim:** *"...therefore meaning is just whatever the community decides..."*

  *   **Verdict:** **Problematic / Conflated.**
  *   **Analysis:** Here she moves from the Paradox to the **Skeptical Solution**, but she treats it as a direct logical inference ("therefore"). Kripke is careful to note that the solution does not *solve* the paradox (it doesn't find the missing fact); rather, it explains how language works *despite* the lack of facts.
  *   **Nuance:** Saying meaning is "whatever the community decides" implies a voluntary choice or a vote. Kripke's Wittgenstein argues that community agreement is a **brute fact of our form of life**, not a decision. We don't *decide* to agree; we simply *do* agree in our reactions. This agreement is the background condition that makes meaning possible, not the content of meaning itself.

  #### 3. The Private Language Argument (PLA)
  > **Her Claim:** *"...private language is impossible since only public correction fixes rules..."*

  *   **Verdict:** **Mostly Fair, but needs nuance.**
  *   **Analysis:** This is the standard Kripkean reading of the PLA. The argument is that without a community, there is no distinction between "thinking I am following the rule" and "actually following the rule."
  *   **Nuance:** "Public correction" suggests an active policing mechanism. A careful reader would object that the requirement is merely the **possibility** of correction based on shared standards, not constant actual correction. The impossibility stems from the collapse of normativity (right vs. wrong) in isolation, not just the lack of a teacher.

  #### 4. The Status of Mathematics
  > **Her Claim:** *"...and mathematics collapses into pure social convention with no objective correctness."*

  *   **Verdict:** **Misrepresentation / Overextension.**
  *   **Analysis:** This is the weakest link. Kripke's argument is anti-realist about *meaning facts*, but it is not necessarily nihilist about *mathematical correctness*.
  *   **Nuance:** In the Skeptical Solution, correctness is preserved **internally**. $68 + 57 = 125$ is "correct" because it accords with the community's practice. It is not "objectively correct" in a Platonic sense (independent of humans), but it is not "mere convention" in the sense that we could just as easily decide $68 + 57 = 10$. The practice has normative force *within* the language game. To say there is "no objective correctness" conflates "no mind-independent truth" with "no normative constraint."

  ---

  ### Part 2: Addressing Your Specific Questions

  #### 1. Does she conflate the skeptical paradox with the skeptical solution?
  **Yes.**
  She treats the conclusion of the paradox ("there is no fact of the matter") as the premise for the solution ("therefore meaning is community decision").
  *   **The Distinction:** The **Paradox** destroys truth-conditions (there is no fact that *makes* my meaning true). The **Solution** replaces them with assertability-conditions (we are *licensed* to say someone means plus if they align with our community). She skips the shift from "truth" to "assertability," which is the heart of Kripke's non-factualist reading.

  #### 2. Does her inference from rule-indeterminacy to mathematics being a mere convention hold?
  **No, it extends the argument beyond its scope.**
  The rule-following argument targets the **metaphysics of meaning**, not necessarily the **ontology of mathematical objects**.
  *   **The Objection:** Even if meaning is grounded in community practice, once that practice is established, the rules exert a "hard" constraint. I cannot simply *choose* to follow the rule of addition and get 10. The "convention" is not arbitrary; it is bound by the shared form of life.
  *   **The Risk:** Her phrasing ("pure social convention") invites the objection: "So if the community voted tomorrow that $2+2=5$, it would be true?" Kripke's Wittgenstein would likely say: If they did that, they would no longer be playing the game of arithmetic; they would be playing a different game. The correctness is internal to the game, not external to it.

  #### 3. Does she mischaracterize community agreement as constituting meaning rather than providing conditions for attribution?
  **Yes, this is a crucial distinction.**
  *   **Her View (Constitutive):** The community *makes* the meaning by agreeing. (Implies meaning is created by the agreement).
  *   **Kripke's View (Conditions of Attribution):** Community agreement makes it *possible to attribute* meaning. It provides the framework in which the distinction between "right" and "wrong" makes sense.
  *   **Why it matters:** If the community *constitutes* meaning, meaning is fragile and changeable. If the community provides the *conditions*, meaning is stable within that form of life. Kripke leans toward the latter: agreement is the "bedrock" where justifications give out, not a legislative body.

  ---

  ### Part 3: Does her final conclusion survive?

  **Verdict:** **Partially, but it is too strong.**

  *   **What Survives:** The anti-realist conclusion that there are no "Platonic" or "mental" facts that ground meaning independently of human practice. The claim that private normativity is impossible also survives.
  *   **What Collapses:** The claim that mathematics has "no objective correctness." Within the Kripkean framework, mathematics retains **intersubjective objectivity**. It is not subjective (up to the individual), and it is not arbitrary (up to a vote). It is **objective relative to the form of life**.
  *   **The Disanalogy:** She treats "social convention" as synonymous with "arbitrary." In Kripke's Wittgenstein, the convention is the *language game itself*. You cannot step outside the game to judge it, but inside the game, the moves are strictly regulated.

  ### Suggested Strategy for Your Reply

  Do not tell her she is "wrong." Instead, suggest that her summary captures the **Skeptical Paradox** perfectly but compresses the **Skeptical Solution** too much, leading to a relativism Kripke tries to avoid.

  **Key points to raise in your reply:**
  1.  **Acknowledge the Paradox:** Agree that the "68+57/quus" argument successfully demolishes the idea of private, mental meaning-facts.
  2.  **Highlight the Shift:** Ask her if she distinguishes between the *Paradox* (no facts) and the *Solution* (assertability conditions). Point out that Kripke doesn't say the community *decides* meaning, but that community agreement is the *precondition* for meaning talk.
  3.  **Defend Internal Correctness:** Challenge the "no objective correctness" claim. Ask: "If math is just convention, why can't I legitimately claim 125 is wrong within the game of arithmetic?" The answer is that the practice itself constrains us.
  4.  **Refine "Private Language":** Agree that private language is impossible, but clarify that it's because "seeming right" cannot be distinguished from "being right" without a public check, not just because we need correction.

  **Sample Opening:**
  *"I think your summary of the Skeptical Paradox (the quus argument) is spot on. However, I worry that your summary of the Solution conflates 'no truth-conditions' with 'arbitrary convention.' Kripke seems to argue that while meaning isn't grounded in facts, it's grounded in assertability conditions within a form of life—which preserves a kind of internal objectivity for math that 'pure convention' might undermine."*

  This approach validates her understanding of the hard part (the paradox) while inviting her to refine the implications (the solution).
