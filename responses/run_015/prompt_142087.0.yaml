      *   *So:* Rejecting the dominance claim in (3) for *ordinary acts* (coffee, vote) does *not* require rejecting it for *structural acts* (x-risk).
      *   *But (5) is the stronger link.* (5) says the near-term verdict is contaminated by the far-term.
