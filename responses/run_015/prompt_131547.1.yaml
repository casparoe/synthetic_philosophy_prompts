answer: |-
  ### Brainstorming Candidate Concepts

  Here is the list of concepts I generated when reading your description, testing them against your specific constraints (no agent intent, denominator causally linked to numerator, decoupling of index from reality).

  1.  **Goodhart's Law / Campbell's Law:**
      *   *Idea:* When a measure becomes a target, it ceases to be a good measure.
      *   *Verdict:* **Discard.** You already identified this. These require an agent *knowing* the measure and optimizing for it. Your burial and colonial examples are structural, not strategic.

  2.  **Endogeneity (Econometrics):**
      *   *Idea:* An explanatory variable is correlated with the error term, often because $X$ causes $Y$ and $Y$ causes $X$ (simultaneity).
      *   *Verdict:* **Keep as Mathematical Analog.** This is the exact statistical structure you describe (Violence affects Population Count, Population Count determines Violence Rate). However, it is a technical statistical diagnosis, not a philosophical concept of measurement validity. It tells you the regression is broken, not *why* the ontology is slippery.

  3.  **Selection Bias / Endogenous Sampling:**
      *   *Idea:* The sample is not representative of the population.
      *   *Verdict:* **Partial Fit.** Fits the burial case (skeletons are a sample of the dead, determined by burial rites). Fails the colonial case (the colonized people are not a "sample" missing from the data; they are explicitly excluded from the *definition* of the population at risk).

  4.  **The Reference Class Problem:**
      *   *Idea:* An event belongs to many different classes, each yielding a different probability.
      *   *Verdict:* **Adjacent.** This is about ambiguity in classification. Your problem is stronger: the class *membership* is causally altered by the event frequency.

  5.  **Construct Validity (Psychometrics/Measurement Theory):**
      *   *Idea:* Does the operational measure actually reflect the theoretical concept?
      *   *Verdict:* **Keep as Umbrella.** Your problem is a specific threat to construct validity. But "Construct Validity" is the category, not the specific mechanism.

  6.  **The Boundary Problem (Political Philosophy):**
      *   *Idea:* Who constitutes "the people" in a democracy?
      *   *Verdict:* **Keep for Question 2.** This addresses the normative weight of choosing the denominator. But it is usually treated as a normative puzzle, not a measurement error.

  7.  **Survivorship Bias:**
      *   *Idea:* Focusing on entities that made it past a selection process.
      *   *Verdict:* **Partial Fit.** Fits the burial case (only buried bones survive). Does not fit the "Long Peace" case (colonized populations didn't "fail to survive" the dataset; they were placed outside the political unit).

  8.  **Reification:**
      *   *Idea:* Treating an abstract concept as a concrete thing.
      *   *Verdict:* **Contextual.** Treating "The State" or "The Tribe" as a fixed container when it is actually fluid. This explains *why* the error happens, but isn't the name of the error itself.

  9.  **Hyperstability / Hyperdepletion:**
      *   *Idea:* Your own fisheries terms.
      *   *Verdict:* **Perfect Description.** These are the exact phenomena. The philosophical task is to generalize these beyond fisheries.

  ### Evaluation Table

  | Candidate Concept | What it gets right | Where it comes apart | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Goodhart's Law** | Identifies that the metric decouples from reality. | Requires conscious gaming by agents. Your cases are structural/causal. | **Discard** |
  | **Endogeneity** | Captures the causal loop (Phenomenon $\leftrightarrow$ Denominator). | Purely statistical. Doesn't capture the *conceptual* error of treating a fluid boundary as fixed. | **Keep (Math Basis)** |
  | **Selection Bias** | Captures the idea that the data is non-random. | Implies a fixed population exists "out there" that we failed to sample. In your cases, the population *definition* is the issue. | **Discard** |
  | **Reference Class Problem** | Highlights ambiguity in grouping. | Usually about probability assignment to individuals, not the causal reshaping of the group size by the phenomenon. | **Discard** |
  | **Construct Validity** | Correctly identifies this as a failure of the measure to track the concept. | Too broad. Every measurement error is a validity threat. We need the specific *shape* of this error. | **Keep (Category)** |
  | **Boundary Problem** | Identifies that "who counts" is the core dispute. | Traditionally normative (who *should* count?). You are asking about the empirical consequence of the choice. | **Keep (For Q2)** |
  | **Survivorship Bias** | Fits the skeletal/burial instance perfectly. | Too narrow. Doesn't cover the spatial displacement (colonial) instance. | **Discard** |

  ---

  ### Part 1: Is there an established concept?

  **The Short Answer:** No. There is no single, canonical term in the philosophy of science or measurement theory that captures exactly what you have described as "Hyperstability/Hyperdepletion" does in fisheries.

  **The Nearest Neighborhood:**
  You are describing a specific failure of **Construct Validity** caused by **Endogenous Framing**.

  In the technical literature of econometrics and causal inference, this is recognized as **Endogeneity** (specifically, *simultaneity bias* or *selection on the dependent variable*). If you put this into a regression model, a statistician would tell you your denominator is "endogenous." But that is a mathematical diagnosis, not a philosophical one. It tells you the number is biased, but not *what the number represents*.

  In the philosophy of social science, this touches on the **Constitution of Social Objects**. When you measure "violence in the state system," you are treating "the state system" as a fixed container (like a lake in fisheries). But if violence itself expands or contracts the container (through conquest, burial practices, or definition), the container is not a background condition; it is a *variable*.

  **Why there is no name:**
  Philosophy of measurement has historically focused on the physical sciences (length, mass, time), where the reference class (the object being measured) is assumed to be stable and independent of the measurement. In the social sciences, we lack a standardized vocabulary for when the *ontology* of the thing being measured shifts in response to the magnitude of the thing itself. You have effectively identified a gap in the taxonomy of measurement error.

  **Specific Version (Index moves the wrong way):**
  You asked if there is a name for when the index moves in the *opposite* direction (e.g., violence rises, but the rate falls because the denominator grew faster due to conquest). In psychometrics, this is sometimes called a **Validity Reversal**, but that is rare. In your fisheries terms, this is **Hyperstability** (index stays high while stock falls) or **Hyperdepletion** (index falls faster than stock). In the violence debate, critics call this **Displacement** (violence moved elsewhere) or **Exclusion** (victims removed from the count). There is no unified term.

  ---

  ### Part 2: Once the frame is fixed, is there a fact of the matter?

  This is the core philosophical question. I will separate the empirical claim from the normative framing.

  **1. The Empirical Claim (Conditional Fact)**
  Once a population at risk and a counting frame are fixed *operationally* (e.g., "Violence per capita within the 1950 borders of France"), there **is** a fact of the matter.
  *   We can count the deaths.
  *   We can count the population.
  *   We can calculate the ratio.
  *   We can check the trend.

  If two scientists agree on the frame (the denominator) and the definition of violence (the numerator), and they still disagree on the trend, one of them is empirically wrong. Measurement error exists, but it is resolvable by better data *within that frame*.

  **2. The Normative/Conceptual Claim (The Frame Choice)**
  The choice of the frame itself is **not** an empirical discovery; it is a **stipulation** that carries moral and political weight.
  *   When Pinker (or defenders of the "Long Peace") choose "Deaths per capita in Sovereign States" as the metric, they are stipulating that violence outside sovereign states (colonies, stateless regions) counts less, or that the expansion of sovereign states is a neutral background event.
  *   When critics choose "Deaths per capita in the Human Species," they are stipulating that borders are morally arbitrary.

  **Is the disagreement verbal?**
  Yes, but only partly. It is a **Conceptual Demarcation Dispute**.
  *   **Verbal/Conceptual Part:** What is the relevant unit of moral concern? Is it "The Citizen," "The State," or "The Human"? This cannot be settled by data. It is a moral choice about whose safety counts.
  *   **Empirical Part:** Given the choice of "The Human," did violence decline? Given the choice of "The State," did violence decline? These are empirical questions.

  **The Trap:**
  The debate often masquerades as purely empirical ("The data shows...") when it is actually hiding a normative premise ("...because we are counting only this data"). Your fisheries analogy is perfect here: arguing about CPUE (Catch Per Unit Effort) without acknowledging that the "Effort" has moved to new grounds is a category error.

  **Conclusion on Question 2:**
  There is a fact of the matter *conditional on the frame*. But the choice of frame is not neutral. It is a **Constitutive Choice**. By choosing the denominator, you are partially constituting what "Peace" means. If "Peace" means "No war between recognized states," then the Long Peace is real. If "Peace" means "Absence of organized killing of humans," the Long Peace may be an illusion created by exporting violence. The disagreement is empirical *within* frames, but normative *between* frames.

  ---

  ### Part 3: Coining a Term

  Since no established term fits, I propose we carve out a concept that honors your fisheries background while generalizing it for philosophy of social science.

  **Term:** **Constitutive Frame Drift**

  **Definition:**
  A measurement failure occurring when the boundaries of the reference class (the denominator) are causally influenced by the magnitude or distribution of the phenomenon being measured (the numerator), such that the resulting rate decouples from the underlying intensity of the phenomenon. Unlike selection bias, the population is not merely undersampled; its *extension* is reshaped by the process.

  **Why this term?**
  *   **Constitutive:** Highlights that the phenomenon helps *make* the population (e.g., conquest creates the state; burial rites create the skeletal sample).
  *   **Frame:** Refers to the reference class or counting boundary.
  *   **Drift:** Indicates that the frame is not fixed, but moves over time or across conditions, breaking the invariance required for a valid index.

  **Contrast Case (What is NOT Constitutive Frame Drift):**
  *   **Influenza Mortality Rate:** We measure flu deaths per capita in a city. The flu virus does not change the city borders, nor does it determine who is counted in the census. The denominator is independent of the numerator. If the rate drops, we can infer the virus is less deadly or prevalent.
  *   *Why it contrasts:* The frame is exogenous (external) to the phenomenon.

  **Boundary Case 1 (Should Count as Drift):**
  *   **The Colonial "Long Peace":** Violence is displaced from the metropole to the colony. The "State" (denominator) expands to include the colony only when it is pacified, or excludes it when it is war-torn. The definition of the "Peaceful State" drifts to exclude the violence.
  *   *Verdict:* **Constitutive Frame Drift.** The political unit's boundary is shaped by the success of violence suppression.

  **Boundary Case 2 (Should NOT Count as Drift):**
  *   **Changing Census Methods:** A country changes how it counts its population (e.g., includes prisoners now, didn't before). The violence rate drops because the denominator grew.
  *   *Verdict:* **Administrative Artifact.** This is a measurement error, but not *Constitutive Frame Drift*. The phenomenon (violence) did not *cause* the census change. The frame changed due to bureaucratic decision, not causal feedback from the violence itself.
  *   *Distinction:* In Drift, the phenomenon *moves* the frame. In Artifact, an external agent moves the frame.

  ### Final Thought for a Fisheries Scientist

  You spent forty years knowing that **CPUE (Catch Per Unit Effort)** is not **Abundance**. It is an *index* that relies on the assumption of **Proportionality** (Catch $\propto$ Abundance $\times$ Effort). When that proportionality breaks (hyperstability), the index lies.

  The violence debate is suffering from a **Rate Per Capita** fallacy. It assumes **Violence Rate $\propto$ Human Aggression / Human Population**.
  Your insight is that **Human Population** (or at least the *counted* political population) is not independent of **Human Aggression**. Aggression (conquest, burial, exclusion) writes the denominator.

  When a philosopher tells you "There is no fact of the matter," they usually mean "The concepts are contested." You can reply: "The concepts are contested, but the measurement is invalid. You are reporting CPUE while the fleet is moving to new grounds." That is a precise, technical objection that does not require you to solve moral philosophy to make it stick.
