prompt: |-
  hey, I have to do this debate thing at school on whether AI chatbots actually understand anything, and I had to write down what I really think first. I want to know if my set of beliefs is even consistent before I open my mouth, because I feel like I might be contradicting myself lol. Here's where I'm at:

  1. Chatbots are just guessing the next word from patterns in a huge pile of text, so they dont really understand anything. Fancy parrots.
  2. There's that thought experiment where a guy sits in a room with a rulebook, people slide him notes in Chinese and he slides answers back out, and he understands zero Chinese. That one mostly convinced me and I think it basically applies to chatbots.
  3. But I also think if something acts exactly like it understands — deals with follow up questions, catches its own mistakes, handles a problem it has literally never seen — then we should just say it understands, the same way I assume my friends understand me from how they act, not because I can see inside their heads.
  4. Humans pick up language from patterns in what they hear and read too and nobody calls us parrots, so "its just patterns" seems like a weak reason on its own. My little brother basically learned English off youtube and he obviously gets it.
  5. Real understanding needs an inner life, like feelings and stuff, and a computer program doesn't have one, so no understanding.
  6. Also honestly it barely matters — what matters is whether the answers are correct and useful.

  One thing that makes me doubt 1: when I ask a chatbot why a joke is funny it gives me an explanation, and if I ask it again it gives a totally different one, and sometimes both of them cant be right. Feels like there's nothing stable in there.

  My friend says 3 and 5 can't both be true and that 1 and 6 fight each other too, but I'm not sure she's right about either. Which of these actually clash, and which ones only look like they do? Rank the clashes by how bad they are, say what i'd have to give up for each, and then tell me which single change would clean up the most. I don't need to win the debate, I just dont wanna contradict myself in front of everyone.
