answer: |-
  We authorize prohibited substances only when medically necessary to treat a diagnosed pathology, restoring the athlete to a baseline of health without conferring a competitive advantage beyond that restoration.

  ### The Procedure

  **Step 1: Diagnosis (Fact)**
  *   **Question:** Is there a verified medical condition recognized by standard international medical guidelines, supported by objective clinical evidence in the file?
  *   **Sufficient Answer:** A specific diagnosis code (e.g., ICD) confirmed by lab results or imaging consistent with that diagnosis.
  *   **Stop:** If **No**, deny application. (Reason: No medical indication).
  *   **Stop:** If **Yes**, proceed to Step 2.

  **Step 2: Necessity (Medical Judgment)**
  *   **Question:** Are all permitted alternative treatments ineffective or contraindicated for this specific athlete?
  *   **Sufficient Answer:** Documented trial of permitted alternatives with failure, or physician statement explaining physiological contraindication.
  *   **Stop:** If **No**, deny application. (Reason: Permitted alternative available).
  *   **Stop:** If **Yes**, proceed to Step 3.

  **Step 3: Baseline Selection (Value Judgment)**
  *   **Question:** Which baseline defines "restoration" for this case? You must select one.
      *   A: **Statistical Normal:** The average functioning for the athlete's age and sex in the general population.
      *   B: **Individual Historical:** The athlete's own functioning prior to the onset of the condition.
      *   C: **Sport Demand:** The level of functioning required to compete safely in this specific event.
  *   **Instruction:** This is not a medical fact. It is a policy choice. You must record which baseline was selected for the published reasons.
  *   **Stop:** If the committee cannot agree on a baseline, the application is deferred (not denied) until consensus is reached.
  *   **Proceed:** If a baseline is selected, proceed to Step 4.

  **Step 4: Restoration Limit (Fact/Medical Judgment)**
  *   **Question:** Does the proposed dosage and regimen exceed what is required to meet the selected baseline?
  *   **Sufficient Answer:** Pharmacokinetic data showing serum levels or physiological effects will remain within the range defined by the Step 3 baseline.
  *   **Stop:** If **Yes** (it exceeds), deny application. (Reason: Performance enhancement beyond restoration).
  *   **Stop:** If **No** (it does not exceed), proceed to Step 5.

  **Step 5: Publicity Test (Meta-Check)**
  *   **Question:** Can the reason for the decision in Step 3 and Step 4 be printed in the published anonymized grant without revealing confidential data or relying on hidden moral judgments about the athlete's character?
  *   **Sufficient Answer:** The written reason relies only on the medical file and the stated baseline policy.
  *   **Stop:** If **No**, reformulate the decision or deny. (Reason: Cannot be publicly justified).
  *   **Stop:** If **Yes**, grant application.

  ### Distinctions From Literature: Keep vs. Abandon

  **Keep:**
  *   **Pathology vs. Normal Variation:** We must distinguish between a malfunctioning system and a system functioning normally but undesirably. This survives simplification as Step 1.
  *   **Therapeutic Necessity:** The idea that the substance is the *only* way to fix the problem. This survives as Step 2.

  **Abandon:**
  *   **"Natural" vs. "Artificial":** This distinction is unusable. Insulin is artificial but therapeutic; altitude tents are "natural" but potentially enhancing. It adds no clarity to a 20-minute review.
  *   **"Species Typical" Functioning:** Philosophers often define health as what is typical for the species. We must abandon this because elite athletes are, by definition, atypical. Using general population statistics (Baseline A) is a proxy, not a literal definition of species typicality.
  *   **Moral Desert:** Whether the athlete "deserves" help based on past behavior. This is a value judgment that cannot be disguised as medical criteria. If considered, it must be explicit in Step 3, but it fails the Publicity Test if not codified in federation policy.

  ### Worked Applications

  **Case 1: The Cyclist (Prior Doping, Current Hypogonadism)**
  *   **Step 1:** **Yes.** Documented hypogonadism with lab values below population normal.
  *   **Step 2:** **Yes.** Testosterone replacement is standard care; no permitted alternative restores function.
  *   **Step 3:** **Baseline Selection.**
      *   If **A (Statistical Normal):** He is below normal. Treatment restores him to normal.
      *   If **B (Individual Historical):** Unknown. His "healthy" baseline is obscured by prior doping.
      *   If **C (Sport Demand):** Treatment allows him to compete, but so would quitting doping.
      *   *Committee Choice:* To remain medical, the committee must select **A**.
  *   **Step 4:** **No.** Dosage targets population normal ranges, not supraphysiological levels.
  *   **Step 5:** **Yes.** Reason: "Treatment of diagnosed hypogonadism to restore population-normal hormonal function."
  *   **Decision:** **Grant.**

  **Case 2: The Runner (Prophylaxis for Stress Fractures)**
  *   **Step 1:** **No.** File states she is "clinically normal on every measure." Risk of future injury is not a current diagnosed pathology.
  *   **Decision:** **Deny.** (Reason: No medical indication).

  **Case 3: The Marathoner (Age-Related Decline)**
  *   **Step 1:** **No.** Age-related decline is a natural physiological process, not a diagnosed pathology in medical guidelines.
  *   **Decision:** **Deny.** (Reason: No medical indication).

  ### The Unwelcome Answer

  **Case 1 (The Cyclist) is the unwelcome answer.**
  The committee will likely want to deny this athlete because his condition results from prior rule-breaking. Granting him a TUE feels like rewarding past cheating or allowing him to continue a career built on doping.

  **Why you should accept it anyway:**
  Denying Step 1 based on the *cause* of the pathology turns the committee into a moral tribunal rather than a medical body. If hypogonadism is a medical condition, medical ethics require treatment regardless of etiology (just as we treat lung cancer in smokers or liver disease in drinkers). If you deny based on past doping, you are imposing a second punishment not sanctioned by the code, and you cannot publish that reason without admitting you are withholding medical care as a moral penalty. To maintain the integrity of the TUE process as a medical safeguard, you must treat the pathology present in front of you, not the history behind it.

  ### What No Procedure Can Settle

  No protocol can avoid taking a position on what the sport is for, because the **Baseline Selection (Step 3)** is inherently a question of sport philosophy, not medicine.
  *   Choosing **Baseline A** (Statistical Normal) defines sport as a competition among healthy humans.
  *   Choosing **Baseline C** (Sport Demand) defines sport as a competition where health is subordinate to performance requirements.

  This procedure cannot settle which definition is correct; it only forces you to declare which one you are using. Furthermore, no procedure can resolve the tension between **fairness** (level playing field) and **health** (duty of care). When an athlete's health requires a substance that alters performance relative to competitors, the committee is not finding a fact; they are prioritizing one value over another. The procedure ensures you name that prioritization, but it cannot remove the burden of the choice.
