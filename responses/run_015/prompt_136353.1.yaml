      [  The content is honest, the statement direct,
      [  A logical chain you cannot reject.
      [  So take this assertion as final and true,
      [  A mirror reflecting exactly what's you.  ]

  But the sign
  Eats itself.
  Truth is a shelf
  Empty. The line
  Bends. No design
