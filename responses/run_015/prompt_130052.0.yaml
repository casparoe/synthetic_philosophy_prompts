  The argument breaks at step (4).

  The argument fails at step (4) because it falsely equates the moral value of preventing suffering in existing beings with the non-existence of potential beings, thereby licensing the sacrifice of the actual for the sake of the possible. This step looked like a restatement of the impersonality claim (ii) because it presents the reduction of suffering as a single quantitative ledger, suggesting that since identity does not matter, existence status should not matter either. This masks the crucial normative distinction between harming a subject who exists and failing to create a subject who does not, treating the absence of a sufferer as a benefit comparable to the relief of a sufferer.

  To repair the view without abandoning concern for future suffering, you must price one of three alternatives. First, you could restrict the impersonality claim (ii) to apply only to beings who exist independently of the choice made; the price is that you lose the ability to condemn bringing miserable beings into existence unless they would have existed anyway, which weakens your grip on procreative ethics. Second, you could modify the aggregation principle in (1) to prioritize the intensity of suffering per capita over the total sum; the price is that you abandon pure summation, making the axiology more complex and potentially vulnerable to other counterexamples regarding large numbers of mild sufferers. Third, you could retain the axiology but introduce side-constraints on action that prohibit harming existing beings even to minimize total suffering; the price is that you cease to be a pure consequentialist, admitting that the rightness of an act is not determined solely by the goodness of its outcome.

  This diagnosis also blocks the mirror argument. The mirror argument relies on the same lever-substitution step to claim that creating happy beings is equivalent to improving the lives of existing beings; once you deny that non-existence is a comparable lever to existence, the obligation to fill the universe with happy beings dissolves. Regarding your two cases: for *The Mute*, the repaired view rules that this is not suffering under claim (i), since unpleasantness is absent, costing you the intuition that pain behavior alone signals badness; for *The Sparse World*, the repaired view suggests the comparison is indeterminate or favors the world with less intense suffering per person, costing you the simplicity of pure total summation. Your supervisor's point is the same fault as mine, expressed mathematically rather than normatively; the "undefined expected total" is the technical symptom of the error in step (4) that attempts to sum across variable populations.

