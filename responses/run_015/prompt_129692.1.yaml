answer: |-
  Dear Members of the Fellowship Committee, I am writing to propose a focused eight-week research project titled The Pragmatics of Standing, which seeks to resolve a persistent stalemate in the philosophical literature regarding hypocrisy and the standing to blame. Current debates largely agree that hypocrisy undermines standing when there is a relevant similarity between the hypocrite's conduct and the conduct they are blaming, yet scholars remain divided on what constitutes relevant similarity. The dominant view treats this similarity as purely moral, requiring that the hypocrite and the blamed party commit the same type of wrong with comparable severity. My project challenges this assumption by arguing that these debates have stalled because they ignore whether both wrongs occur within the same pragmatic framework of address. The precise question guiding this research is whether hypocrisy defeats standing only when the hypocrite's failing belongs to the same interactional or institutional domain as the failing being blamed, where domains are carved out not by moral taxonomy but by the norms governing the particular second-personal exchange. For instance, does a senior researcher who cuts corners on data analysis lose standing to blame a junior colleague for cutting corners on grant reporting if both acts fall under the same institutional role-structure, whereas she retains standing if the colleague's wrong belongs to an entirely separate interactional frame? By shifting the focus from moral equivalence to pragmatic jurisdiction, this project aims to offer a novel taxonomy of standing that better captures our intuitions about institutional hypocrisy.

  Existing accounts leave this pragmatic dimension open because they prioritize the content of the moral violation over the context of the address. When philosophers analyze standing, they typically ask whether the hypocrite is guilty of the same vice, such as dishonesty or cruelty, without sufficiently interrogating whether the hypocrite occupies a normative position that authorizes them to speak on this specific matter within this specific relationship. This oversight creates a blind spot where institutional roles are conflated with moral character. A manager might be morally flawed in their private life yet retain standing to address professional misconduct, or conversely, be morally upright in general but lack standing to critique a specific procedural violation because they do not participate in that specific regulatory framework. My hypothesis is that standing is not merely a function of moral clean-handedness but of pragmatic membership in the community of address defined by the specific norms of the interaction. By isolating these interactional domains, we can explain why some instances of apparent hypocrisy feel irrelevant to standing while others feel devastating, even when the moral severity of the acts is identical. This distinction remains unexplored because current literature treats the context of blame as a backdrop rather than a constitutive element of the standing relation itself.

  Over the course of the eight-week fellowship, I will engage in a structured program of conceptual analysis to develop and test this framework. During the initial fortnight, I will map the existing landscape of standing and hypocrisy to identify exactly where the pragmatic dimension has been neglected, creating a conceptual baseline against which to measure my proposed intervention. The middle phase, spanning weeks three through five, will be dedicated to constructing the taxonomy of interactional domains, defining the criteria that distinguish one pragmatic framework from another without collapsing back into moral distinctions. This will involve rigorous thought experiments to determine whether institutional roles, social relationships, or specific normative systems constitute the boundaries of these domains. In weeks six and seven, I will apply this taxonomy to a series of test cases, including the researcher example outlined above, to see if the framework consistently yields intuitive results about standing where moral accounts fail. The final week will be reserved for synthesizing these findings into a draft paper that articulates the argument, defends the taxonomy against potential counterexamples, and outlines the implications for broader theories of moral responsibility. Throughout this process, I will maintain a daily log of conceptual hurdles and refinements to ensure the argument remains coherent and does not drift into unrelated areas of normativity.

  A successful result for this project will be a defensible distinction between moral similarity and pragmatic similarity that withstands initial scrutiny. Specifically, success looks like a drafted argument demonstrating that two agents can commit morally identical wrongs yet occupy different pragmatic domains such that hypocrisy only defeats standing when those domains overlap. I will consider the project successful if I can produce a clear set of necessary and sufficient conditions for domain membership that does not secretly rely on moral premises. Conversely, failure would look like an inability to separate the pragmatic framework from the moral content, resulting in a theory where the interactional domain simply mirrors the moral taxonomy anyway. If I find that every time I attempt to define a pragmatic boundary I am actually making a moral judgment about the severity or type of wrong, then the hypothesis will have collapsed, and the outcome will be a negative result demonstrating the inescapability of the moral view. Either outcome is philosophically valuable, but the primary goal is to establish the viability of the pragmatic turn.

  I must offer an honest assessment that eight weeks is a tight timeframe for this level of conceptual work. Philosophy often requires prolonged gestation for ideas to mature, and there is a risk that the distinction between moral and pragmatic domains proves more elusive than anticipated. The primary risk is scope creep, where the definition of interactional domains becomes so complex that it requires a full theory of social institutions to support, which is beyond the scope of a summer fellowship. Another risk is that the test cases will yield ambiguous intuitions, leaving the framework without clear empirical support from our moral psychology. To mitigate these risks, I will constrain the project to a preliminary defense of the distinction rather than a full metaphysical account of norms, focusing on plausibility rather than completeness. Despite these challenges, the focused nature of the question and the clear criteria for success make this achievable within the fellowship period. I am confident that this research will contribute a necessary nuance to the literature on blame and responsibility, and I thank you for considering this proposal. Sincerely, [Applicant Name].
