prompt: |-
  I'm applying for an eight-week summer research fellowship and need a two-page proposal. My half-formed idea is that debates about whether hypocrisy undermines one's standing to blame have stalled because they treat the relevant similarity between the hypocrite's conduct and the blamed party's conduct as purely moral—same wrong, same severity—while ignoring whether both wrongs occur within the same pragmatic framework of address. I want to ask precisely this: does hypocrisy defeat standing only when the hypocrite's failing belongs to the same interactional or institutional domain as the failing being blamed, where domains are carved out not by moral taxonomy but by the norms governing the particular second-personal exchange? For example, does a senior researcher who cuts corners on data analysis lose standing to blame a junior colleague for cutting corners on grant reporting, if both acts fall under the same institutional role-structure but involve different moral descriptions, whereas she retains standing if the colleague's wrong belongs to an entirely separate interactional frame?

  Turn this into a proposal with a precise statement of the question, an explanation of why existing accounts of hypocrisy and standing leave this pragmatic dimension open, a week-by-week method outlining the conceptual work I would actually do over the eight weeks, and clear criteria for what a successful result looks like versus what would count as failure. Include an honest assessment of whether eight weeks is sufficient and what risks could cause the project to collapse. Do not include citations, bibliographies, or reading lists, and do not ask me to supply them; I will add references myself. Write the response entirely in continuous prose without headings, bullet points, bold text, or tables, as if composing a single formal letter.
