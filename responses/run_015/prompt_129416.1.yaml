  ### 5. Bail-Out Map (Where They Can Refuse)

  If a participant rejects the conclusion ("All times are equally real"), they must pick one of these three costs. Write these on the whiteboard if challenged.

  1.  **Deny the Signal Rule:** "The signal didn't actually travel at the same speed for everyone."
      *   *Cost:* You break the measurement we all watched in the first 15 minutes. You must propose a new physics for the room.
  2.  **Deny the Calculation:** "Subtracting travel time is the wrong way to define 'Now'."
      *   *Cost:* You must define a "Now" that cannot be measured by signals. It becomes a mystical, unobservable property.
  3.  **Deny the Chain:** "Volunteer B's 'Now' doesn't count because they are moving."
      *   *Cost:* You must claim there is a "Preferred Walker" (a special state of rest) that the rest of the universe obeys, despite no experiment in the room being able to find them.

