answer: |-
  ### 1. The Setup, Rules, and Materials

  **The Model Universe**
  *   **The Room:** Represents a slice of the universe 18 light-years long.
  *   **The Walls:** The "Left Wall" is Earth (Year 1900). The "Right Wall" is a Distant Colony (Year 1900 + Signal Time).
  *   **The Invariant Speed ($c_{model}$):** 0.75 meters per second.
      *   *Why:* At 18m, a signal takes 24 seconds to cross. (Satisfies $\ge$ 8s).
      *   *Representation:* A designated "Signal Carrier" walks this pace exactly, paced by your metronome (45 BPM, one step per beat, 0.75m stride).
  *   **The Time Scale:** 1 second of model time = 1 year of real time.
  *   **The Shift:** A walker moving at 0.7 m/s (brisk walk) towards the Distant Colony will calculate the Colony's "Now" as ~22 years ahead of the Room's "Now."

  **Materials**
  *   **Masking Tape:** To mark the "Start Line" (Left), "Finish Line" (Right), and "Meeting Point" (Center, 9m).
  *   **String (3 colors, ~20m each):** To lay on the floor as timeline connectors.
  *   **Index Cards (3 types):**
      *   *Blue (Observer):* "I am passing the Center. My speed is ___."
      *   *Yellow (Signal):* "I left Earth at time T. I arrived at Colony at time T+24."
      *   *White (Calculation):* "My 'Now' at the Colony is: Earth Year + ___."
  *   **Metronome App:** Set to 45 BPM (for the Signal Carrier).
  *   **Stopwatches (3):** For timing the walkers.
  *   **Marker Pens.**
  *   **Pre-printed "Shift Table" Cards** (see Section 3).

  **The Rules (Read Aloud)**
  1.  **The Signal Rule:** A signal travels from Left to Right (or Right to Left) at exactly 0.75 m/s. No faster, no slower. We know this because we measured it together.
  2.  **The Now Rule:** To know what is happening *now* at the Distant Colony, you must subtract the signal travel time from when you receive a message.
  3.  **The Motion Rule:** Walkers must walk in a straight line at a constant pace. No stopping, no turning around. If you need to change speed, you must pass a note to someone else already moving at that speed.
  4.  **The Handoff:** When two walkers meet, they may exchange cards. They cannot stop to talk.

  ---

  ### 2. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:15: Calibration & The Signal**
  *   **Action:** Tape the lines. Select one volunteer to be the "Signal Carrier."
  *   **Task:** The Carrier walks Left to Right. The group times them. Adjust stride until it is exactly 24 seconds.
  *   **Lesson:** Establish the invariant speed. Everyone agrees on this number.
  *   **Output:** A yellow card placed at the Right Wall: "Signal Travel Time = 24 Years."

  **00:15 – 00:45: The Three Walks (Data Collection)**
  *   **Link 1 (The Room):** You (the facilitator) stand at the Center. You are "Stationary."
      *   *Task:* Calculate "Now" at the Colony. (Answer: 1900 + 0 shift = 1900). Place a card on the floor: **1900**.
  *   **Link 2 (The Stroller):** Volunteer A walks Left to Right at 0.4 m/s (Slow).
      *   *Task:* They pass you at the Center. They do not stop. They hand you a Blue Card stating their speed.
      *   *Calculation:* Using the Shift Table, they determine their shift is +11 Years.
      *   *Output:* They place a card on the floor at the Right Wall line: **1911**.
  *   **Link 3 (The Strider):** Volunteer B walks Left to Right at 0.7 m/s (Brisk).
      *   *Task:* They overtake Volunteer A near the Center (start B later so they meet there). They pass A.
      *   *Handoff:* A passes their "1911" card to B. B calculates their *own* shift relative to the Room (+22 Years).
      *   *Output:* B places a card on the floor: **1922**.
  *   **Constraint Check:** No one stopped. No one turned. All speeds were < 0.75 m/s.

  **00:45 – 00:55: Building the Artifact**
  *   **Action:** Take the red string. Connect the "1900" card, the "1911" card, and the "1922" card.
  *   **Visual:** The string lies on the floor, physically linking the three "Nows."
  *   **Statement:** "Each of these dates was, for the person standing there, the true present moment at the Distant Colony."

  **00:55 – 01:10: The Seeded Objections**
  *   **Objection 1 (The Skeptic):** "This is just about when light *arrives*. You haven't proven what is *happening*."
      *   *Response Material:* Point to the Yellow Card (Signal Time). We subtracted the travel time. The "Now" card is what remains after correcting for sight.
  *   **Objection 2 (The Conventionalist):** "You assumed the signal takes the same time going Left-to-Right as Right-to-Left. That's a choice."
      *   *Response Material:* Point to the Metronome. The rules of *this* universe say the speed is invariant. If you change that rule, you break the game we just played. To refuse the result, you must refuse the invariant speed we measured.

  **01:10 – 01:25: The Debrief (Connecting the Dots)**
  *   **Map the Activity to the Argument:**
      *   *Signal Calibration:* The speed of light is constant.
      *   *The Walks:* Motion changes your "slice" of the present.
      *   *The String:* The "Block Universe." All these dates exist.
      *   *The Cost:* To say only 1900 is real, you must say Volunteer B made a mistake. But B followed the rules perfectly.
  *   **Personal Note:** Briefly acknowledge why this matters (the 1970s). The physics doesn't cure the illness, but it suggests the 1970s are not "gone" in the structure of reality, even if they are inaccessible to us.

  **01:25 – 01:30: Close**
