  ### 3. The "No-Algebra" Calculation Card

  Print this on index cards for the walkers.

  | **YOUR WALKING PACE** | **YOUR SHIFT** |
  | :--- | :--- |
  | **Stationary** (0 m/s) | **0 Years** |
  | **Slow Stroll** (0.4 m/s) | **+11 Years** |
  | **Brisk Walk** (0.7 m/s) | **+22 Years** |

  **How to use:**
  1.  Start with the **Base Year** (1900).
  2.  Find your pace in the left column.
  3.  Add the **Shift** to the Base Year.
  4.  Write the result on your White Card.

  *(Note: These numbers are pre-calculated using $\Delta t = vx/c^2$ with $c=0.75, x=18$. 0.4 m/s $\to$ 10.67 yrs rounded to 11. 0.7 m/s $\to$ 18.6 yrs... Wait, I need to check the math for the 20 year constraint again.)*

  *Correction on Math for the Card:*
  Formula: $\Delta t = \frac{v \cdot x}{c^2}$
  $x = 18$. $c = 0.75$. $c^2 = 0.5625$.
  If $v = 0.7$: $\Delta t = (0.7 \cdot 18) / 0.5625 = 12.6 / 0.5625 = 22.4$ years.
  If $v = 0.4$: $\Delta t = (0.4 \cdot 18) / 0.5625 = 7.2 / 0.5625 = 12.8$ years.
  *Revised Card:*
  *   Slow (0.4 m/s): **+13 Years**
  *   Brisk (0.7 m/s): **+22 Years**
  *   *Total Chain:* 1900 $\to$ 1913 $\to$ 1922. (Satisfies the >20 years requirement across the chain).

