  ### 6. Predictable Failures & Fixes

  1.  **Failure:** *The "Winner" derives the Lorentz factor.*
      *   **Fix:** Acknowledge their expertise immediately. "You are absolutely right, there is a second-order effect we are ignoring. For today, we are looking at the first-order effect which is large enough to see. Can you help us keep the group focused on the *concept* of the shift rather than the precise coefficient?"
  2.  **Failure:** *Walkers drift in speed.*
      *   **Fix:** You (the facilitator) walk alongside them with the metronome app audible only to them, or use a "Pacer" volunteer whose only job is to clap the beat for the walker.
  3.  **Failure:** *"This is just about when the message arrives."* (Before minute 55).
      *   **Fix:** Point to the Calculation Card. "If it were just arrival, the Stationary person and the Walker would write the same number. They didn't. Why?"
  4.  **Failure:** *Confusion on "Who is moving?"*
      *   **Fix:** Tape "FLOOR" signs on the ground. The Room is the reference. We are measuring how walking *relative to the floor* changes the *distant wall*.

