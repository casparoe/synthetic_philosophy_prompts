  ### 7. Limitations (What You Must Say Yourself)

  This activity cannot bridge the following gaps. You must speak these truths in the debrief:

  1.  **The Gap to Eternalism:** The activity proves *Relativity of Simultaneity* (different observers disagree on "Now"). It does not logically *force* Eternalism (that all "Nows" exist). One can be a "Presentist" and accept Relativity by saying "Only my current Now exists, and it changes as I move."
      *   *Your Line:* "Physics forces us to admit there is no universal 'Now.' Whether that means the past is 'gone' or just 'elsewhere' is a philosophical step. But the cost of saying it's 'gone' is high: you must say your mother's 1970s ceased to exist, rather than simply being distant from your current path."
  2.  **The Scale Problem:** In real life, walking down the hall shifts "Now" by femtoseconds, not decades.
      *   *Your Line:* "We slowed light down to make the effect visible. In reality, the effect is tiny for humans. But 'tiny' is not 'zero.' The structure of the universe is the same; the numbers are just harder to see."
  3.  **The Human Element:** This validates the *reality* of the past, not the *accessibility* of it.
      *   *Your Line:* "This argument suggests your mother's time is real. It does not suggest you can visit it. It offers comfort in existence, not a cure for loss."

  ### A Note on the Scaling Constraint
  *You asked for a single walker to produce a 20-year shift.*
  *With an 18m room and $c_{model}=0.75$ m/s, a single walker at 0.7 m/s produces a **22-year shift**.*
  *This satisfies your constraint without relaxation, provided the "Signal Carrier" can walk steadily at 0.75 m/s (a very slow shuffle) and the "Walker" can sustain 0.7 m/s (a slow walk) without tripping over the Signal Carrier.*
  *Recommendation:* Run the Signal Carrier in a parallel lane (1 meter to the side) so they don't collide with the "Now" Walkers. This keeps the "No Stopping" rule safe.
