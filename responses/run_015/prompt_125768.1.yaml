answer: |-
  Here is the ninety-minute whiteboard plan. It is structured to leverage the group's probabilistic fluency while blocking philosophical reflexes that lead to confusion.

  ### Phase 1: The Causal Baseline (0–20 Minutes)
  **Goal:** Establish the standard game-theoretic result and isolate the *evidential* gap.

  1.  **Draw the Payoff Matrix.** Standard Prisoner's Dilemma ($T > R > P > S$).
  2.  **Dominance Argument.** Show that for any fixed action of the Opponent ($O$), Defect ($D$) yields higher utility than Cooperate ($C$).
      *   *Misconception 1 (Iterated Disguise):* Explicitly write "ONE-SHOT" and "NO REPUTATION" on the board. State that there is no future interaction, no enforcement, and no communication.
  3.  **The Causal/Evidential Gap.**
      *   Draw two graphs.
      *   **Graph A (Causal):** $Action \rightarrow Outcome$. $Action$ and $Opponent$ are independent nodes.
      *   **Graph B (Evidential):** $CommonCause \rightarrow Action$ and $CommonCause \rightarrow Opponent$. There is no arrow between $Action$ and $Opponent$, but they are d-connected via the common cause.
      *   **Definition:** CDT maximizes $E[U | do(Action)]$. EDT maximizes $E[U | Action]$.
      *   *Misconception 2 (Causal Magic):* Explicitly state: "EDT does not claim your action *causes* the opponent's action. It claims your action is *data* about the opponent's action."

  ### Phase 2: The Population Model & Example (20–45 Minutes)
  **Goal:** Provide a physical mechanism for the correlation that satisfies the "no duplicates" constraint.

  1.  **The Example: The Gaussian Weight Ensemble.**
      *   **Setup:** Imagine a population of 10,000 agents. All are neural nets with identical architecture trained on identical data.
      *   **Variation:** Their weights are initialized from a tight Gaussian cluster $N(\mu, \sigma^2)$ where $\sigma$ is small but non-zero.
      *   **The Draw:** You are one random draw from this population. The Opponent is another independent random draw from the *same* population.
      *   **The Decision:** The input is the PD matrix. The output is $C$ or $D$.
      *   **Why this works:**
          *   *No Duplicates:* Because $\sigma > 0$, weights differ. You are not identical to the opponent.
          *   *Readable Correlation:* If $\sigma$ is small, the decision boundaries are close. If your weights yield $C$, it is statistically likely the opponent's weights yield $C$. The correlation is derived from the variance $\sigma$, not stipulated.
          *   *No Predictor:* No Omega, no simulation. Just sampling from a distribution.
  2.  **The Inference.**
      *   Your decision reveals information about your weights.
      *   Since the opponent's weights are drawn from the same distribution, your weights are evidence about their weights.
      *   Therefore, $P(O=C | I=C) > P(O=C | I=D)$.
      *   *Misconception 3 (Exact Copies):* Emphasize that $P(O=C | I=C) \neq 1$. If it were 1, the problem is trivial (one agent). The result must hold for $0.5 < P(O=C | I=C) < 1$.

  ### Phase 3: The Threshold Inequality (45–65 Minutes)
  **Goal:** Derive the closed-form condition for cooperation.

  1.  **The Calculation.**
      *   Let $p = P(O=C | I=C)$ and $q = P(O=C | I=D)$.
      *   EDT Cooperates iff $E[U|C] > E[U|D]$.
      *   Write the inequality: $pR + (1-p)S > qT + (1-q)P$.
  2.  **The Threshold.**
      *   Rearrange to solve for the required correlation difference $(p - q)$.
      *   $(p - q)(R - P) > q(T - R) + (1-p)(P - S)$.
      *   Simplify for the symmetric case often used in literature (or just leave as the general constraint).
      *   **Key Insight:** Cooperation is rational iff the evidential correlation $(p-q)$ exceeds a threshold determined by the payoff ratios.
  3.  **Fixing the Parameters.**
      *   *Misconception 4 (Manufacturing Correlation):* Point to $p$ and $q$ on the board. Ask: "Can you change $p$ by choosing $C$?"
      *   **Answer:** No. $p$ is a property of the *population distribution*, not your will. You cannot "make" the correlation higher by deciding to cooperate. You merely *condition* on the correlation that already exists.

  ### Phase 4: The Test Case (Mimics vs. Contrarians) (65–80 Minutes)
  **Goal:** Isolate correlation from similarity and defuse the "Large World" misconception.

  1.  **The Setup.**
      *   Same population size.
      *   **50% Mimics:** Weights clustered such that $O = I$.
      *   **50% Contrarians:** Weights clustered such that $O = \neg I$.
      *   **Uncertainty:** You do not know which sub-population you or the opponent belong to.
  2.  **The Calculation.**
      *   Calculate $p = P(O=C | I=C)$.
          *   $0.5 \times P(Mimic) + 0.5 \times P(Contrarian) = 0.5(1) + 0.5(0) = 0.5$.
      *   Calculate $q = P(O=C | I=D)$.
          *   $0.5 \times P(Mimic) + 0.5 \times P(Contrarian) = 0.5(0) + 0.5(1) = 0.5$.
      *   **Result:** $p = q$. The correlation is zero.
      *   **EDT Verdict:** Defect (returns to dominance).
  3.  **The Purpose.**
      *   *Misconception 5 (EDT Vindication/World Size):* This case proves the result is not about "the world being large" or "agents being similar" in a vague sense. It is strictly about the *sign and magnitude of the conditional probability*.
      *   **Takeaway:** Similarity without *aligned* correlation yields no evidential benefit. EDT does not mandate cooperation generally; it mandates cooperation only when the statistical link is positive and strong enough.

  ### Phase 5: Closing & Limitations (80–90 Minutes)
  **Goal:** Diagnostic and boundary setting.

  1.  **The Diagnostic Question.**
      *   *Ask:* "If you learn that the opponent was drawn from a **different** weight cluster (uncorrelated with yours) *after* you have computed your decision but *before* you submit it, do you change your action?"
      *   *Mechanism Answer:* **Yes.** The evidential link is broken ($p=q$). The inequality flips to dominance.
      *   *Slogan Answer:* **No.** "My action is evidence of what similar agents do" suggests the property belongs to *you*, not the link. They may think the "vibe" of cooperation remains.
  2.  **What We Are Not Settling.**
      *   **Which Theory is Correct:** We have shown what EDT *requires*, not that EDT is *true*. CDT proponents will argue you should ignore the correlation because you can't causally influence it. We are not solving that normative debate today.
      *   **Conditioning on Certainty:** We have assumed $0 < P(I=C) < 1$. If an agent is logically certain of its action, $P(O|I)$ becomes undefined in standard probability. We are ignoring the problem of logical counterfactuals (FDT territory) for this session.

  ### Summary of Dependencies
  1.  **Gap:** Must precede PD to show why standard dominance isn't the only game.
  2.  **PD:** Must precede Population to show what is being overcome.
  3.  **Population:** Must precede Math to ground the variables $p$ and $q$ in something real (weights), not magic.
  4.  **Math:** Must precede Test Case to provide the metric ($p-q$) that the Test Case zeroes out.
  5.  **Test Case:** Must precede Closing to prove the mechanism is sensitive to correlation structure, not just "similarity."
