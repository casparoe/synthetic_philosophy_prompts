      *   *The "No Subject" Objection:* Epicurus says death is nothing to us because when we are, death is not, and when death is, we are not. The deprivationist says harm doesn't require experience. This is a core metaphysical disagreement.
      *   *Parfit's Contribution:* Crucial for the "future bias" point. Parfit argues that caring more about the future is not irrational. This directly undermines the friend's claim that the user's view relies on an *irrational* bias.

  10. **Final Polish:** Organize with clear headings. Ensure the distinction between "settled" and "contested" is explicit. (Actually, in philosophy, almost nothing is "settled" in the scientific sense. I need to phrase this carefully as "dominant contemporary views" vs. "classic minority views" or "areas of active disagreement".) *Correction:* The prompt asks to separate what is settled from what is contested. I must be honest: In philosophy of death, very little is *settled*. I should state that the *dominance* of the deprivation view is a sociological fact about the field, but the *truth* is contested.

      *Wait, one nuance:* The friend's thought experiment about "born 5 years later" implies a *retroactive* change in birth date. This is metaphysically impossible in a way that dying earlier is not. I should mention the modal status difference.

      *Let's structure the "Settled vs. Contested" section carefully.*
      *   Settled: There is no consensus. The Epicurean view is a minority view in contemporary analytic philosophy but historically significant. The Deprivation Account is the dominant framework.
