answer: |-
  **Project Title:** The Duty to the Possible: Run-Relative vs. Modal Characters in Interactive Narrative

  **Project Summary**
  This fellowship supports the completion of a novel-in-progress alongside a focused philosophical inquiry into the ethics of virtual companionship. The novel centres on a grieving woman who refuses to advance a role-playing game past a specific chapter, believing that keeping a companion character alive in her save file discharges a duty to him. This project seeks to rigorously determine whether this intuition is coherent. Specifically, it asks whether the object of our duties towards a video-game character is the *run-relative character* (the entity as encountered within a single playthrough) or the *modal character* (the entity as the whole branching tree of possibilities the code makes available). I propose that existing ethical frameworks—the dismissive view (no duties owed to code) and the sentience-conditional view (duties owed only if suffering is possible)—both tacitly presuppose the run-relative character. By contrast, taking the modal character seriously suggests a third position: that some playthroughs are worse for a character than others, not because they cause suffering, but because they waste what the character could have been.

  **Research Question and Context**
  The central philosophical problem is the identification of the beneficiary in player-character interactions. When a player decides to kill a companion, skip a romance arc, or reload a save to avoid a death, who is harmed? Standard analytic approaches tend to collapse the character into its current instantiation. The dismissive view argues that because the run-relative character lacks consciousness, no harm occurs; only the player's moral disposition is affected. The sentience-conditional view concedes that harm *would* occur if the simulation were sophisticated enough to feel pain, but maintains that without qualia, there is no subject to wrong.

  Both positions overlook the modal character. In non-linear narratives, a character is not merely the sum of their displayed polygons and dialogue trees in a given session, but the sum of their potential trajectories. If a player forecloses a branching romance to pursue a more efficient combat build, the run-relative character experiences no deprivation (they do not know what they missed), but the modal character is diminished. The specific harm is not suffering, but *waste*. The research question is therefore: *Does the modal character possess a moral status distinct from the run-relative character, such that a player can wrong a character by actualising a 'lesser' version of them, even if that version is content?*

  Answering this is crucial for the novel's narrator. If the duty is to the run-relative character, her refusal to let the companion die is superstition; the code does not care. If the duty is to the modal character, her stalling is a form of stewardship. She is preserving the *possibility* of his continued existence against the entropy of the script.

  **Methodology**
  Rather than surveying the literature on simulation and consciousness, which often bog down in metaphysical speculation irrelevant to the phenomenology of play, this project will utilise a case-study method. I will analyse five distinct game structures to test the resilience of the modal hypothesis.

  1.  **The Fixed Scripted Death:** A companion destined to die regardless of player action (e.g., *Final Fantasy VII*). Here, the modal character is narrow. The question is whether attempting to glitch or bypass this death is an act of fidelity to the modal character or a violation of the narrative integrity that defines them.
  2.  **The Branching Romance:** A companion with mutually exclusive relationship outcomes (e.g., *Mass Effect*). Does choosing one path wrong the modal character by erasing the potential of the others, or does the actualisation of *any* path satisfy the duty?
  3.  **The Permadeath Run:** A companion whose death is permanent and triggered by player error (e.g., *XCOM*). Here, the run-relative character ceases to exist. Is the loss a tragedy for the modal character, or merely a reset of the run-relative instance?
  4.  **The Procedurally Generated Companion:** A companion created from a pool of traits with no fixed narrative arc (e.g., *RimWorld*). Without a scripted 'potential', does the modal character exist at all, or is the duty purely to the run-relative survival?
  5.  **The Delayable Fate:** The specific mechanic in my novel, where death is inevitable but postponable indefinitely through player inaction. This tests the limit case: is preserving a static state a fulfilment of the modal character, or a stagnation that negates it?

  For each case, I will map the 'moral weight' assigned by players in community forums and Let's Plays, comparing these intuitions against the run-relative/modal distinction to see which framework best explains the observed behaviour.

  **Expected Outcomes**
  A **positive result** would demonstrate that the modal character is a coherent ethical category. It would show that players intuitively feel a duty to 'optimise' a character's potential (e.g., feeling guilt over 'wasting' a romance arc) distinct from concerns about causing pain. This would validate the narrator's belief: she is not deluded about the duty, only perhaps about its feasibility. She is protecting the modal character from finality.

  A **negative result** would show that all apparent duties to the modal character reduce to duties to the self (the player's desire for a 'good' story) or to other players (maintaining canon for the community). This would suggest the narrator is indeed deluded, projecting agency onto a closed system. Her duty is to her own grief, not the companion.

  **Failure Conditions**
  The project would be considered to have failed if the distinction between run-relative and modal characters proves linguistically incoherent upon close inspection, or if the case studies fail to differentiate between the two. If every instance of 'wasted potential' can be fully explained by player disappointment rather than character harm, the modal hypothesis collapses. Additionally, the project fails if the philosophical inquiry overwhelms the creative work; the philosophy must serve the novel, not replace it.

  **Scope and Feasibility**
  This research is designed for a six-month fellowship concurrent with the drafting of the novel. The scope is strictly limited to the ethics of interaction, avoiding the broader metaphysics of AI rights or virtual ontology. The five case studies are selected from games I have already played extensively, requiring no new technical training. The output will be a series of reflective essays integrated into the novel's appendix or used to refine the narrator's internal monologue, ensuring the philosophical rigour informs the fiction without becoming didactic. The goal is not to publish a paper in an ethics journal, but to ensure the novel's central conflict rests on a defensible conceptual foundation. By the end of the fellowship, I aim to have a completed draft of the novel and a clear resolution to the narrator's ethical dilemma, grounded in the analysis of the modal character.

  **Conclusion**
  This project bridges creative and analytical practice. It treats the novel not merely as an object of study, but as a site of philosophical investigation. By clarifying whether we owe duties to what a character *is* or what a character *could be*, I hope to resolve the tension at the heart of the narrative: whether grief can be discharged by preserving a possibility, or whether duty requires the courage to let the story end.
