answer: |-
  # OPERATIONAL RUNBOOK: PLAYER HARM TRIAGE (V1.0)

  **AUDIENCE:** Contractor Reviewers
  **TIME BUDGET:** 3 Minutes per Ticket
  **OUTPUT:** One `HARM_CODE` (Close/Restore/Escalate) + One `ACTION_CODE` (Sanction/None) + Two Sentence Justification.

  ## 0. POLICY CONTEXT (READ ONCE)

  **The Shutdown Switch (Global Policy):**
  *Current Setting: [PERSISTENT OBLIGATION]*
  *   **Option A (Ephemeral):** The world is a service. When it ends, all debts end. Losses are part of the play experience.
  *   **Option B (Persistent):** The world is a record. We owe players continuity regardless of server lifespan.
  *   *Instruction:* This runbook assumes **Option B**. If Leadership toggles to Option A, Step 3 changes automatically. Do not debate this in tickets.

  **Audit vs. Work Key:**
  *   **[WORK]:** This step determines the outcome.
  *   **[AUDIT]:** This step creates a paper trail for quarterly review but does not change the outcome.

  ---

  ## 1. DECISION PROCEDURE

  ### Step 1: Rule Violation Check [WORK]
  **Question:** Did the reported action violate a written rule active at the time of the incident?
  **Evidence:** Server logs (chat, action codes) vs. Current Rulebook.
  **Sufficient Answer:**
  *   **YES:** Log shows prohibited action (e.g., exploit, harassment, theft in non-loot zone).
  *   **NO:** Log shows allowed mechanics (e.g., open PvP, lawful demolition, market trade).
  *   **UNSURE:** Log is ambiguous or rule was unclear.
  **Exit Condition:**
  *   If **YES**: Mark `ACTION_CODE: SANCTION`. Proceed to Step 2.
  *   If **NO**: Mark `ACTION_CODE: NONE`. Proceed to Step 2.
  *   If **UNSURE**: **HALT. ESCALATE TO HUMAN.** Justification: "Rule applicability ambiguous in log [ID]. Requires senior interpretation."

  ### Step 2: Data Representability [WORK]
  **Question:** Is the lost thing a discrete object or state in our database schema?
  **Evidence:** Database Schema, Inventory Logs.
  **Sufficient Answer:**
  *   **YES:** It has an ItemID, CharacterID, or QuestFlag (e.g., Sword, Level, House).
  *   **NO:** It is a social state, opportunity, or feeling (e.g., Trust, Rank, Friendship, "Chance to Win").
  **Exit Condition:**
  *   If **NO**: **HALT. ESCALATE TO COUNCIL.** Justification: "Loss reported is social/abstract [Type]. Not representable in data model. Requires value judgment."
  *   If **YES**: Proceed to Step 3.

  ### Step 3: Risk Consent Check [WORK]
  **Question:** Did the player opt into a server or zone where this loss is a stated mechanic?
  **Evidence:** Server Flags (e.g., "Full Loot"), Terms of Service acceptance logs.
  **Sufficient Answer:**
  *   **YES:** Player entered a zone/server with explicit warnings (e.g., "Items drop on death").
  *   **NO:** Loss occurred in a safe zone or standard server.
  **Exit Condition:**
  *   If **YES**: Mark `HARM_CODE: CLOSE`. **STOP.** Justification: "Loss occurred in opt-in risk zone [Zone ID]. Mechanic functioning as designed."
  *   If **NO**: Proceed to Step 4.

  ### Step 4: Restoration Feasibility [WORK]
  **Question:** Can we restore this without invalidating other players' valid data?
  **Evidence:** Dependency logs (who else touched this item/area?).
  **Sufficient Answer:**
  *   **ROLLBACK:** We can revert state without erasing others' progress.
  *   **TEMPLATE:** We can spawn a copy without breaking economy/uniqueness.
  *   **NONE:** Restoration requires erasing others' work or breaking schema.
  **Exit Condition:**
  *   If **NONE**: Mark `HARM_CODE: CLOSE`. **STOP.** Justification: "Restoration technically impossible without collateral damage to [Other Player/System]."
  *   If **ROLLBACK/TEMPLATE**: Proceed to Step 5.

  ### Step 5: Provenance Check [AUDIT]
  **Question:** Does the player claim the *history* of the item matters, not just the stats?
  **Evidence:** Player Statement.
  **Sufficient Answer:**
  *   **YES:** "That specific sword," "The one I had for 2 years."
  *   **NO:** "I need a sword of this type."
  **Exit Condition:**
  *   If **YES**: Mark `HARM_CODE: ESCALATE`. **HALT.** Justification: "Player asserts provenance value. Template restoration insufficient. Requires Council."
  *   If **NO**: Mark `HARM_CODE: RESTORE (TEMPLATE)`. **STOP.**

  ---

  ## 2. TEST RUN (SELECTED CASES)

  ### Case 1: Full-Loot Server Theft
  *   **Step 1 (Rule):** NO. Action allowed by server rules. `ACTION_CODE: NONE`.
  *   **Step 2 (Data):** YES. Inventory items are data.
  *   **Step 3 (Risk):** YES. Player opted into Full-Loot server.
  *   **Exit:** **CLOSE.**
  *   **Justification:** "Loss occurred in opt-in risk zone [Full-Loot Server ID]. Mechanic functioning as designed."
  *   **Outcome:** Defensible. Player consented to the risk.

  ### Case 3: Instance Crash / Lost Opportunity
  *   **Step 1 (Rule):** UNSURE/YES. Deliberate crashing may be an exploit. `ACTION_CODE: SANCTION` (if exploit confirmed).
  *   **Step 2 (Data):** NO. "Completion Recognition" is a state, but the *opportunity* to earn it again is not data.
  *   **Exit:** **ESCALATE TO COUNCIL.**
  *   **Justification:** "Loss reported is social/abstract [Opportunity/Recognition]. Not representable in data model. Requires value judgment."
  *   **Outcome:** Unpopular with Engineering (no technical fix), but honest. We cannot restore "time" or "chance."

  ### Case 5: NPC Companion Update (The Pressure Case)
  *   **Step 1 (Rule):** NO. Patch note was valid. `ACTION_CODE: NONE`.
  *   **Step 2 (Data):** NO. "Relationship" is not a database object. The NPC model is data, the *bond* is not.
  *   **Exit:** **ESCALATE TO COUNCIL.**
  *   **Justification:** "Loss reported is social/abstract [Relationship]. Not representable in data model. Requires value judgment."
  *   **Outcome:** **The team will not want to hear this.** It forces a governance decision on whether we owe players emotional continuity. It prevents Engineering from closing the ticket as "Working as Intended." It acknowledges the harm without promising a technical fix.

  ---

  ## 3. EXPLICIT ADD-ONS

  ### First: Player Testimony (Sufficiency Boundaries)
  The procedure accepts player testimony as sufficient **only** when server logs are silent on *intent* but consistent with *outcome*.
  *   **Accept:** "They blocked me in the doorway for 3 hours." Logs show position data matching the claim, but cannot show intent. We accept the outcome (harassment) as true.
  *   **Reject:** "I had a rare item and it vanished." Logs show inventory transaction history. If logs say "Never Possessed," testimony is rejected.
  *   **Reasoning:** We can verify physics (position, inventory), not psychology (intent, memory).

  ### Second: Engineering Instincts (Where They Fail)
  You are reasoning that **Rollback = Idempotent Undo** and **Copy = Replace**. The procedure corrects this:
  1.  **Rollback is not Idempotent:** A rollback erases *other* players' valid actions that occurred in the interim. It solves Player A's loss by creating Player B's loss. Step 4 forces reviewers to check for "Collateral Damage."
  2.  **Copy is not Replace:** In a social world, provenance creates value. A duplicated item has the same stats but different history. Step 5 (Provenance Check) forces an escalation if the player claims the *history* matters. If you treat copies as identical, you are optimizing for database consistency over player reality.

  ### Third: The Shutdown Question (Open Decision)
  The procedure does not answer whether the world's impermanence negates loss. It treats this as a **Global Policy Switch** (Section 0).
  *   **Option A (Ephemeral):** If selected, Step 3 (Risk Consent) expands. All losses are implicitly opted-in because the world itself is temporary.
  *   **Option B (Persistent):** If selected (Current), we owe restoration where possible because the record matters more than the runtime.
  *   **Requirement:** Leadership must toggle this switch explicitly. The runbook cannot assume the answer. If the switch is not set, all tickets regarding "End of World" losses must **HALT. ESCALATE TO COUNCIL.**
