  **Date of Infraction:** _______________ **Time:** ___________

  **1. Describe the Action:**
  (e.g., Cutting the lunch line, copying homework, sleeping in class)
  ____________________________________________________________________________

  **2. State Your Maxim:**
  *Must include all qualifying conditions to ensure universal validity.*
  "I may _______________ when _______________ because _______________."
  ____________________________________________________________________________
  ____________________________________________________________________________

  **3. Universalization Check:**
  Can you will that *every* student acts this way under *these exact conditions* without the school ceasing to function logically?
  [ ] Yes  [ ] No  [ ] Yes, but the school would be unpleasant

  **4. Imperfect Duty Clause:**
  If this action involves withholding help or effort, are you exercising your latitude regarding scheduling?
  [ ] Yes, today is not my helping day.  [ ] No

  **5. Disclaimer:**
  By submitting this form, I acknowledge that the school is not responsible for societal collapse resulting from the universal adoption of my maxim.

