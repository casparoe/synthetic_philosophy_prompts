prompt: |-
  ok so im on student council and we're rewriting the discipline code, and this kid on the committee who's taking a philosophy elective says we should scrap the whole list of rules and just judge every case by running the kids maxim thru the universal law formula, and he is being totally serious. I want to write something making fun of it for the school paper.

  Can you write me a parody page from the new student handbook, deadpan, around 500-600 words, plus a short "maxim intake form" that students have to fill out when they get written up? I want the jokes to come from the actual weak spots of the test, not from made-up ones: kids getting off by piling details into their maxim until it passes ("I may cut the lunch line when I skipped breakfast and its taco day and I have track at 4"), the gap between maxims that totally fall apart when everybody follows them and maxims that would still technically work but nobody would want to go to a school like that, and how the stuff Kant says we only have to do sometimes somehow becomes the stuff you can never get in trouble for skipping. Nobody in the piece should explain what's wrong with the view, just let it come out in the handbook's own voice. Start straight with the handbook page, no intro or commentary.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Write a parody page from a new student handbook based on a Kantian ethical framework (specifically the Categorical Imperative/Universal Law Formula).
      *   **Context:** Student council rewriting discipline code; one member (philosophy elective student) suggests replacing rules with Kant's universal law formula.
      *   **Tone:** Deadpan, official handbook style. No explicit commentary explaining why it's wrong; let the absurdity speak for itself.
      *   **Length:** 500-600 words for the handbook page + a short "maxim intake form".
      *   **Key Jokes/Weak Spots to Highlight:**
          *   Specificity loopholes (piling details into the maxim to make it universalizable).
          *   Universalization leading to undesirable but technically permissible outcomes (e.g., a school where everyone cheats vs. a school where no one helps).
          *   Perfect vs. Imperfect Duties confusion (stuff you only have to do sometimes becomes mandatory or optional incorrectly).
      *   **Format:** Start straight with the handbook page, no intro.

  2.  **Deconstruct Kantian Ethics for Satire:**
      *   *The Universal Law Formula:* "Act only according to that maxim whereby you can at the same time will that it should become a universal law."
      *   *The Loophole:* Maxims can be hyper-specific. "I can lie when..." vs "I can lie."
      *   *The Contradiction in Conception vs. Will:* Some things are logically impossible if everyone does them (contradiction in conception), others are just undesirable (contradiction in will).
      *   *Perfect vs. Imperfect Duties:* Perfect duties (never lie, never steal) are strict. Imperfect duties (help others, develop talents) are flexible regarding when/how. Students will exploit this flexibility.
      *   *Intent vs. Outcome:* Kant cares about intent/duty, not consequences. This clashes with school discipline which cares about order/safety.

  3.  **Drafting - Section 1: The Handbook Page:**
      *   *Title:* Section 4.2: Ethical Conduct & Maxim Adjudication.
      *   *Opening:* State the new policy clearly. No more rule lists. Just the Formula.
      *   *Procedure:* How to get judged. You submit your maxim. The council tests universality.
      *   *Examples of Weak Spots:*
          *   *Specificity:* "I may talk during assembly if..."
          *   *Universal Will:* "I may refuse to help others study." (Everyone does this -> School fails -> Contradiction in will? Or just a sucky school? Let's make it pass technically.)
          *   *Imperfect Duties:* Helping others is optional timing. So "I never help anyone" might pass as a valid scheduling choice.
      *   *Tone:* Bureaucratic, dry, overly precise.

  4.  **Drafting - Section 2: The Maxim Intake Form:**
      *   *Fields:* Name, Infraction, Proposed Maxim.
      *   *Specificity Check:* Must include conditions (time, place, emotional state).
      *   *Universalization Checkbox:* "Have you willed this for everyone?"
      *   *Disclaimer:* School not responsible for societal collapse.

  5.  **Refining and Editing (Word Count & Joke Check):**
      *   *Check:* Did I explain why it's wrong? No.
      *   *Check:* Are the jokes based on real Kantian weaknesses? Yes (specificity, imperfect duties, universal will).
      *   *Check:* Word count. Need to ensure it hits the 500-600 range for the text + form.
      *   *Adjustment:* Make sure the "Imperfect Duty" joke lands. Kant says you must help others *sometimes*, but you can choose when. A student could argue "Today is not my helping day." The handbook should accept this logic deadpan.
      *   *Adjustment:* The specificity loophole. "I may steal a pencil if it is blue and I have a math test." If everyone does *that*, does the system collapse? Maybe not.
      *   *Adjustment:* The "Contradiction in Will." If everyone refuses to help, the school fails. But the handbook might treat "I want a school where no one helps" as a valid preference.

  6.  **Writing - Step-by-Step:**

      *   *Header:* STUDENT HANDBOOK 2024-2025 | SECTION 9: DISCIPLINARY ADJUDICATION.
      *   *Intro:* Replacing specific prohibitions with the Categorical Imperative.
      *   *The Test:* Step 1: Formulate Maxim. Step 2: Universalize. Step 3: Check for Contradiction.
      *   *Specificity Clause:* Maxims must include all relevant conditions. (This invites the loophole).
      *   *Imperfect Duties:* Clarify that benevolence is subject to scheduling.
      *   *The Form:* Create the fields to emphasize the burden on the student to justify their actions philosophically.

      *(Self-Correction during drafting)*: Keep the voice very administrative. Avoid saying "This is silly." Instead say "Please note that maxims containing excessive circumstantial qualifiers are permitted provided they remain logically consistent."

      *(Word Count Check)*: I need to expand the explanations of the process to hit the count. I'll elaborate on the "Contradiction in Will" section to show how students can will a terrible school environment.

      *(Form Design)*: Make sure the form asks for the "Exception Clause" which encourages the specificity loophole.

  7.  **Final Polish:** Check tone. Ensure no meta-commentary. Ensure the Kantian terminology is used correctly enough to be recognizable but applied absurdly.

