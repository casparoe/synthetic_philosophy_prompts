answer: |-
  There is no single, canonical Latin phrase that captures this exact oscillation, but in the philosophy of mind and cognitive science, the pattern you have identified is a recognized structural flaw. It is best understood as a **Dynamic Homunculus Fallacy** executed via a **Motte-and-Bailey Equivocation on the Subject.**

  While it belongs to the family of the **Homunculus Fallacy**, it is distinct from the standard version. The standard homunculus error is static (positing a little man inside to explain seeing). Your description identifies a *dynamic* defense mechanism where the theorist shifts the ontological status of the "user" to evade critique.

  Here is a detailed breakdown of the phenomenon, its distinction from ordinary circularity, and its boundary conditions.

  ### 1. The Core Mechanism: Equivocation on "Subject"
  The loop you encountered relies on an unacknowledged equivocation between two distinct concepts of the "self" or "user":

  1.  **The Phenomenal Subject:** The entity that *feels* the interface. This is required to explain the "what it is like" aspect of consciousness (qualia).
  2.  **The Functional Subsystem:** The neural architecture that *processes* the information. This is required to explain the physical causality without magic.

  The argumentative loop works because the "Interface Theory" proponent treats these as interchangeable depending on which flank is under attack:
  *   **When challenged on mechanism:** "The 'user' is just a functional subsystem (The Brain)." (Retreat to Physicalism).
  *   **When challenged on experience:** "The 'user' is the self that perceives the display." (Advance to Phenomenology).

  In the literature surrounding **Donald Hoffman's Interface Theory of Perception** (which is likely the specific theory your friend was citing), this is the primary objection raised by critics like **Thomas Metzinger** and **Daniel Dennett**. They argue that you cannot have an interface without a user, but if the user is physical, it doesn't need an interface to interact with reality, and if the user is phenomenal, it is exactly what needs explaining.

  ### 2. Is it a Distinct Variant of the Homunculus Problem?
  Yes. It is specifically a **Homunculus Shell Game**.

  *   **Standard Homunculus:** Posits a viewer inside the head. Critique: Infinite regress (who views the viewer's view?).
  *   **Your Variant:** Posits a viewer, but when the regress is pointed out, the viewer is redefined as a *process* rather than an *entity*. However, when the *feeling* of viewing is questioned, the process is reified back into an *entity*.

  This is distinct because it avoids the infinite regress not by solving the problem, but by making the "homunculus" slippery. It prevents the critic from pinning down the entity to demonstrate the regress. This is why it feels like a "defensive loop" rather than a simple error.

  ### 3. Distinction from Ordinary Circular Explanation
  Ordinary circularity is static: *A is true because of B, and B is true because of A.*
  Your loop is **dialectically adaptive**. It is structurally identical to a **Motte-and-Bailey Doctrine** (a term coined by Nicholas Shackel, applied here to ontology):

  *   **The Bailey (The desirable but hard-to-defend position):** "There is a Self that uses the Interface." This accounts for the intuitive feeling of agency and ownership.
  *   **The Motte (The defensible but less useful position):** "The 'Self' is just a label for information integration." This accounts for the neuroscientific data.
  *   **The Maneuver:** When you attack the Bailey ("Who is the self?"), they retreat to the Motte ("It's just integration"). When you attack the Motte ("Integration doesn't feel like anything"), they return to the Bailey ("But it feels like a user").

  This distinguishes it from simple circularity because the premises change mid-argument to avoid falsification. It is a **strategic equivocation** rather than a logical tautology.

  ### 4. Boundary Cases: Where Does This Apply?
  This loop is specific to **Representationalist Realism** and **Illusionism** that tries to retain a subject. It does not apply to all theories of consciousness.

  **A. Where the Loop Applies (The Danger Zone)**
  *   **Interface Theory of Perception (Hoffman):** Claims space-time is a desktop interface. *Critique:* Who sits at the desktop?
  *   **Predictive Processing / Active Inference (Friston/Clark):** Often describes the brain as simulating a world for an organism. *Critique:* If the organism is just the model, who is the model for?
  *   **Self-Model Theory (Metzinger):** *Note:* Metzinger actually tries to *solve* this loop by arguing there is no user, only the model. However, proponents often slip into the loop by implying the model is *for* someone.

  **B. Where the Loop Does Not Apply (The Safe Zones)**
  *   **Eliminative Illusionism (Keith Frankish):** This view bites the bullet. It states there is no user and no interface in the way we think; the feeling of a user is the illusion. Because they deny the "user" entirely, they do not need to oscillate.
  *   **Panpsychism / Integrated Information Theory (Tononi):** The "subject" is fundamental to the physics. There is no need to construct a user; the user is a basic property of the system. The loop dissolves because the "user" doesn't need to be generated by the interface.
  *   **Non-Dual / Phenomenological Approaches (Varela/Thompson):** These reject the subject-object split entirely. There is no "interface" between a "self" and a "world"; there is only the coupling. The question "who uses the interface?" is treated as a category error from the start.

  ### 5. Technical Terminology for the Phenomenon
  If you need to reference this in a discussion, the most precise description is:

  > **"The Reification-Deflation Oscillation of the Phenomenal Subject."**

  However, the most recognized conceptual bucket is **The Cartesian Theater** (Dennett). Dennett argues that any theory that posits a place or format where things "become conscious" implicitly posits a viewer. When pressed, theorists claim the theater is "distributed" or "functional" (Deflation), but their language invariably implies a central witness (Reification).

  ### 6. Summary for Your Argument
  To break the loop in future discussions, you do not need a new name; you need to force a **dilemma** that prevents the oscillation. You can frame it this way:

  *"You are oscillating between a **Functional User** (which doesn't need an interface to exist) and a **Phenomenal User** (which is the thing we are trying to explain). If the user is just the brain, the interface is redundant. If the user is the self, the interface is unexplained. You cannot define the user as a process when I ask about causality, and then define the user as an entity when I ask about experience. You must choose: is the 'user' an illusion, or is it a mechanism? If it's an illusion, stop talking about it 'using' the interface. If it's a mechanism, explain how it reads the display without already being conscious."*

  This forces them out of the Motte-and-Bailey and prevents the Homunculus Shell Game.
