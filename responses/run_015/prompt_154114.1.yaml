          *   *Scheffler's likely stance:* He admits we might feel differently about non-human successors. This suggests a hidden assumption.
      *   *The Boundary:* Distinguish between "Loss of Future Value" (impersonal, total utilitarianism) and "Loss of Afterlife" (relational, agent-centered). The boundary lies in *who* inherits. Is it enough that *someone* inherits, or must it be *our kind*?
      *   *Conclusion:* The boundary is between *continuity of valuation* (structural) and *continuity of identity* (substantive). Scheffler's argument is strongest structurally but often leans substantively.

  7.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* Make sure not to conflate Scheffler with Parfit too much. Keep the focus on Scheffler's specific claim about *present meaning*.
      *   *Clarification:* The Non-Identity Problem is usually a problem for *future-oriented* ethics. Scheffler uses it to show why *future-oriented* ethics fails to capture our intuition, so he pivots to *present-oriented* dependence.
