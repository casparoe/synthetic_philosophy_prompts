      *   **Severity 1: The Determinism/Selection Problem (5) vs (1).**
          *   *Issue:* In a deterministic world governed by strict counterfactual dependence (1), *everything* prior is a necessary condition for the ending. If $A \to B \to C \to D$, and $D$ is fixed, $\neg A \to \neg D$. So $A$ is a cause. (5) wants to distinguish causes from background conditions. (1) provides no mechanism for this distinction if *all* satisfy dependence.
