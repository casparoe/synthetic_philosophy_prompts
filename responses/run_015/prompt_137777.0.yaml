          *   *Issue:* Lewisian semantics usually prioritizes avoiding large miracles over matching particular future facts. (6) imposes a constraint: "Hold the ending fixed." This is methodologically useful for a plotter but metaphysically weird. If I ask "What if she caught the train?", standard semantics looks for the nearest world where she catches the train. If catching the train leads to death (crash), the nearest world might be one where she dies. (6) says ignore that.
