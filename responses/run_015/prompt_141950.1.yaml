answer: |-
  **The principle** — Trust explanations built from known people acting intentionally or visible mechanics, and treat any story requiring a hidden state or unnamed force as a last resort. When the choice is between your own error and a mystery, assume the error.

  **Case by case** — 
  1. **Basement:** Yes. The downspout is visible mechanics; the sewer is a hidden state underground.
  2. **Friend:** Yes. Her annoyance is a known person acting intentionally toward you; her private life is a hidden state you can't verify.
  3. **House Weirdness:** Yes. One cause is a visible mechanical fault; three separate faults is complexity bordering on coincidence.
  4. **Clock:** Yes. Your uncle is a known person acting intentionally; the battery is a hidden state inside the clock you haven't verified.
  5. **Sourdough:** Yes. Your temperature mistake is your own error; the "invisible living thing" is an unnamed force.
  6. **Office Numbers:** Yes. Changing metrics is a known person acting intentionally; brilliance is a vague quality hard to test.

  **The awkward pair** — In case 4, the hidden cause is your uncle—a specific person you know exists, capable of winding clocks. In case 5, the hidden cause is "something living"—an unnamed entity with no proof of existence. Your rule isn't "no hidden causes," it's "no unknown agents." You accept human intent from known people, but you reject magic monsters under the bed.

  **Where I'm wrong** — Case 2 is the weak link. Your principle forces you to pick "she's annoyed," but statistically, "she's busy" is almost always true. This rule protects you from ignoring your own faults, but it makes you overly responsible for other people's moods. You should drop the verdict on case 2; it's anxiety, not logic.

  **A case of your own** — You apply for ten jobs and get zero interviews. Story A: The job market is frozen and your resume is fine. Story B: Your resume has a formatting error that kills it instantly. Your principle forces you to pick B, because it's a fixable mechanical fault rather than an invisible market force. It feels empowering, but it might be false; sometimes the market is just frozen, and blaming yourself is a waste of energy.

  **My flip-flop** — Your principle pushes you toward Story A, because it treats your behavior as a known variable and the workplace culture as an invisible force. But this is where the rule breaks: you can't test your own blind spots alone. Ignore the principle here and ask a colleague, or you'll fix mistakes you aren't making.
