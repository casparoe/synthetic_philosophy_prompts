answer: |-
  Here is the breakdown of Hume's argument, how it clashes with your sister's modern banking reality, and where the text gets slippery.

  ### 1. The Mechanism: What is the "Natural Proportion"?
  Hume is describing an early version of the **Quantity Theory of Money**.

  When he says money has a "natural proportion to labour and commodities," he means that prices are determined by the ratio of the money supply to the amount of stuff available to buy.
  *   **The Mechanism:** If you have \$100 chasing 100 widgets, the price is \$1. If you magically create another \$100 (via credit) but still only have 100 widgets, the price becomes \$2.
  *   **The Proportion:** He isn't giving a precise formula (like $MV=PT$), but he is saying prices scale linearly with the money stock. The "natural" level is the price level that keeps your country's goods competitive with its neighbors. If your money stock grows faster than your neighbors', your "proportion" is off, and your prices are artificially high.

  **Plain English:** He thinks money is just a counter for real goods. If you print more counters without making more goods, the counters just become worthless. The "natural proportion" is simply the price level that matches international norms.

  ### 2. The Harm: Inflation or Competitiveness?
  It is specifically about **international competitiveness**, not just domestic inflation.

  You caught the right clue: "heightening their price to the merchant and manufacturer." Hume is worried that if banks artificially expand credit, domestic prices rise. If domestic prices rise, foreign buyers stop buying your stuff because it's too expensive compared to goods from countries with "sound" money.
  *   **The Consequence:** Your merchants lose sales. Your manufacturers cut production. Gold and silver (which was money back then) flow out of your country to pay for cheaper imports.
  *   **The Verdict:** He is making a claim about **relative prices**. Domestic inflation is bad *because* it kills exports. In his view, a nation cannot get rich by printing money; it gets rich by selling goods. Artificial credit makes you look rich temporarily, but it prices you out of the global market.

  ### 3. Modern Relevance: Does the Argument Collapse?
  Your sister is right about the mechanics; Hume is right about the risk, but his solution is obsolete.

  **Where Hume Breaks:**
  Hume assumes money is a fixed stock of metal (gold/silver) that banks intermediate. He thinks banks are just warehouses that lend out existing coins.
  *   **Modern Reality:** Your sister is correct. When a bank makes a loan, it creates a new deposit. It does not need to wait for a saver to deposit cash first. This is "fractional-reserve banking" on steroids (endogenous money).
  *   **The Central Bank Factor:** Hume didn't have a Federal Reserve. Today, if banks create too much money and inflation spikes, the Central Bank raises interest rates to crush that spending. Hume assumes the "price-specie-flow" mechanism (gold leaving the country) is the only brake on inflation. We have manual brakes now.

  **Does the Conclusion Invert?**
  It doesn't fully invert, but it shifts from "money quantity" to "resource utilization."
  *   **Hume's Assumption:** The economy is always at full capacity. Making more money just bids up prices for the same amount of labor and goods.
  *   **Modern View:** If there is unemployment (idle labor), bank lending *can* create real growth without immediate inflation. If banks lend to build a factory that employs idle workers, you get more goods *and* more money, so prices might stay stable.
  *   **The "Who Spends First" Point:** You hit on the **Cantillon Effect**. Hume hints at this. The first people to get the new credit (borrowers) spend it at old prices. By the time the money circulates to everyone else, prices have risen. So, credit creation redistributes wealth to the borrowers at the expense of everyone else. Hume sees this as a net negative; modern policy sees it as a tool to manage recessions.

  **The "Lock Up" Bank:**
  Is he serious about a bank that locks up 100% of deposits?
  *   **Interpretation:** In this specific essay, **yes, he is endorsing it as a theoretical ideal** to prevent inflation, though he acknowledges it wouldn't happen in practice. He is arguing against the "paper credit" schemes of his day (like John Law's Mississippi Bubble), which caused hyperinflation. He views paper credit as a fraud that tempts nations to live beyond their means.
  *   **Modern Equivalent:** This is essentially "100% Reserve Banking" or the "Chicago Plan." Most economists today reject this because it would severely restrict lending and economic growth, but some heterodox economists still argue for it to prevent financial crises.

  ### Where This Reading Might Break Down
  I am most confident in the analysis of Hume's price theory and trade mechanism. I am least confident in the final sentence about the bank that "locked up all the money."

  **The Hinge Sentence:**
  > *"And in this view, it must be allowed, that no bank could be more advantageous, than such a one as locked up all the money it received, and never augmented the circulating coin, as is usual, by returning part of its treasure into commerce."*

  **Why this is risky:**
  1.  **Hyperbole vs. Policy:** Hume is a pragmatic philosopher. In other essays (like *Of Interest*), he acknowledges banks facilitate trade. Here, he might be using *reductio ad absurdum* to shame the reckless bankers of the 1750s. If I am reading it as a literal policy prescription, I might be missing his rhetorical flair.
  2.  **Definition of "Money":** If Hume distinguishes between "money" (specie) and "credit" (bank notes), he might mean the bank should hold 100% specie reserves against notes, not that it should stop lending entirely. However, the text says "never augmented the circulating coin... by returning part of its treasure." This implies the bank sits on the gold and does not lend it out.
  3.  **The Switch:** If you found a letter or a different essay where Hume explicitly praises bank lending for infrastructure, I would switch to the view that this passage is purely a warning against *inflationary* credit, not *all* credit. (Historical note: He does soften this view in later writings, but in *Of Money*, he is quite hardline).

  **Summary for your argument:**
  Tell your sister: "You're right that banks create money today. Hume didn't know that. But he was warning that if you create too much money without creating more goods, you just get inflation and lose export business. He thought the safest bank was one that didn't lend at all. We disagree with that today because we think lending helps build the 'goods' part of the equation, provided the Central Bank keeps the inflation in check."
