      *   **Mapping the Cognitive Process (Internal vs. External):**
          *   *Internal:* Problem formulation, order of magnitude (decimal placement), scale selection (A, B, C, D, K scales), error checking.
          *   *External (The Slide Rule):* Logarithmic addition/subtraction (multiplication/division), square roots, trig functions. Crucially, the *intermediate state* is the physical alignment of the slide. If you let go, the calculation "resets." This is distinct from a notebook where the number is written down.
