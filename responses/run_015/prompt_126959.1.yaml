answer: |-
  ### Brainstorming & Conceptual Mapping

  Before addressing the core question, I will sketch the structural parallels and evaluate existing terminology to ensure precision.

  **1. Two Concrete Analogies Mirroring the Pattern**
  *   **Religious Calendar Default:** A public institution schedules "Holiday Breaks" coinciding exclusively with Christian holy days (Christmas/Easter).
      *   *Defense:* "These are national traditions and culturally neutral markers of the season, not religious endorsements."
      *   *Transposition:* Imagine a majority-Muslim region scheduling breaks exclusively for Eid and Ramadan, claiming these are merely "cultural traditions" and that specifying "Christian Break" for others would be unnecessarily divisive.
      *   *Result:* The defense collapses under transposition, revealing the "cultural" label masks a specific religious dominance.
  *   **Ability/Design Default:** A building code defines "Standard Access" as staircases, with ramps classified as "Special Accommodations."
      *   *Defense:* "Stairs are the historical and architectural norm; ramps are specific additions for specific needs."
      *   *Transposition:* Imagine a code where "Standard Access" is defined as braille signage and tactile flooring, and visual signage is treated as a "Special Accommodation" for the sighted.
      *   *Result:* The claim of "normacy" is exposed as a majority-bias rather than a functional neutral.

  **2. Nearest Established Concepts**
  *   **Linguistic Markedness (Jakobson/Trubetzkoy):** Describes the structural asymmetry where one term (unmarked) covers the whole category and the other (marked) specifies a subset (e.g., *actor* vs. *actress*).
      *   *Difference:* Markedness describes the *structure*, not the *argumentative defense* of that structure against critique.
  *   **Ideological Naturalization (Marxist/Critical Theory):** The process by which contingent social arrangements are presented as inevitable or natural.
      *   *Difference:* This is a broad sociological mechanism. It does not specifically capture the *rejection of the analogical test* as the method of maintaining the illusion.
  *   **Motte-and-Bailey (Philosophical Fallacy):** Retreating to a defensible claim (the motte) when a controversial one (the bailey) is attacked.
      *   *Difference:* In the pattern you describe, the speaker does not retreat. They hold the ground ("He is neutral") and reject the map ("Race is different"), relying on the invisibility of the default rather than shifting definitions.
  *   **Hermeneutical Injustice (Fricker):** A gap in shared interpretive resources that disadvantages a group.
      *   *Difference:* This focuses on the victim's inability to articulate harm. Your pattern focuses on the defender's immunity from having to justify the harm.

  **3. Distinguishing Feature**
  The unique feature here is the **epistemic shield provided by familiarity**. The defense does not rely on the *truth* of the neutrality claim, but on the *cognitive invisibility* of the asymmetry. The analogical transposition (Hofstadter's method) functions as a "revelation engine," making the invisible visible. The fallacy lies in rejecting the revelation without addressing the structure.

  ***

  ### Diagnosis and Coinage

  **Is there an established name?**
  There is no single, canonical term in philosophy of language or rhetoric that specifically names this *argumentative failure mode*. While feminist linguists (e.g., Robin Lakoff, Deborah Cameron) and critical theorists (e.g., Sally Haslanger) have extensively analyzed the *effects* of the generic masculine and linguistic androcentrism, they typically categorize these under broader headings like "linguistic sexism," "androcentrism," or "ideological naturalization." None of these terms isolate the specific *defensive maneuver* of rejecting an analogical exposure of markedness based on the familiarity of the default.

  Therefore, to provide the precision you require, I will coin a term that captures the mechanism.

  **Proposed Term:** **The Unmarked Immunity Fallacy**

  **Definition:**
  The **Unmarked Immunity Fallacy** occurs when a defender of a linguistic or conceptual default (the unmarked term) claims it is neutral or universal, and when confronted with an analogical transposition that reveals the term's specificity (by swapping the privileged category for a marginalized one), the defender rejects the analogy without identifying a structural difference. The "immunity" derives not from the validity of the claim, but from the cognitive transparency of the default category, which renders its asymmetry invisible to the defender.

  **Boundary Conditions:**
  To qualify as the Unmarked Immunity Fallacy, three conditions must be met:
  1.  **Structural Asymmetry:** There must be a genuine marked/unmarked relationship where the unmarked term is treated as "neutral" despite encoding a specific identity (gender, race, ability, etc.).
  2.  **Appeal to Transparency:** The defense must rely on the claim that the term is "just how language works" or "historically conventional," treating the asymmetry as background noise rather than a feature.
  3.  **Analogical Rejection:** When a structural parallel is offered (e.g., race for gender), the defender must dismiss the parallel based on the *content* of the categories ("Gender isn't race") rather than the *structure* of the argument, failing to explain why the linguistic mechanism applies in one case but not the other.

  **Distinction from Nearest Concepts:**
  *   **Vs. Ordinary Markedness:** Markedness is a descriptive linguistic fact (e.g., *lion* vs. *lioness*). The Unmarked Immunity Fallacy is the *normative defense* of that fact against ethical or political critique. One can acknowledge markedness without committing the fallacy (e.g., "Yes, 'he' is unmarked, and that is why we should change it").
  *   **Vs. Motte-and-Bailey:** In a Motte-and-Bailey, the speaker retreats to a safer position when challenged. In Unmarked Immunity, the speaker stands their ground and claims the challenger's measuring stick is flawed, relying on the invisibility of their own bias.
  *   **Vs. False Analogy:** A standard false analogy claims two things are alike when they are not. Here, the two things *are* structurally alike (linguistic defaults). The fallacy is insisting they are *not* alike solely because one default is familiar and the other is not.

  ***

  ### Concrete Cases

  **Case 1: Clear Application (The Generic Masculine)**
  *   **Context:** A style guide debate regarding the use of "he" as a generic singular pronoun.
  *   **Defense:** "Using 'he' is grammatically standard and includes everyone. Specifying 'he or she' is clunky and politicizing neutral grammar."
  *   **Transposition:** "Imagine a rule where 'white' is the generic term for all races, and 'person of color' is the specific modifier. Defending 'white' as 'just the traditional default' would be recognized as exclusionary."
  *   **Response:** The defender replies, "That's absurd, race is visible and gender is grammatical," without explaining why grammatical defaults cannot carry racialized exclusionary weight.
  *   **Verdict:** **Unmarked Immunity Fallacy.** The defense relies on the familiarity of the masculine default to mask its exclusivity. The rejection of the analogy is based on the *content* (race vs. gender) rather than the *structural function* (default vs. marked), preserving the invisibility of the asymmetry.

  **Case 2: Non-Application (Time Zone Indexing)**
  *   **Context:** A global software company sets server logs to default to UTC (Coordinated Universal Time).
  *   **Defense:** "UTC is the neutral standard for computing. Local time zones are specific offsets."
  *   **Transposition:** "Imagine a company in New York setting logs to default to EST and calling UTC a 'specific offset'."
  *   **Response:** The defender replies, "UTC is not tied to a specific nation's sovereignty or political power; it is an astronomical and coordination standard agreed upon by treaty to facilitate global interoperability, whereas EST is a political jurisdiction."
  *   **Verdict:** **Not the Unmarked Immunity Fallacy.** While there is a default (UTC), the defense identifies a **structural difference** (global treaty/astronomical coordination vs. political jurisdiction). The "neutrality" of UTC is not based merely on familiarity or invisibility, but on a functional consensus designed to *avoid* the very asymmetry the fallacy masks. The analogy is legitimately rejected because the structural basis for the default differs (coordination utility vs. social dominance).

  ### Summary
  The phenomenon you describe is the **Unmarked Immunity Fallacy**. It is distinct from simple markedness because it is an *argumentative strategy* used to protect markedness from critique. It is distinct from status quo bias because it specifically exploits the *linguistic invisibility* of the unmarked term. The Hofstadter-style transposition is the specific diagnostic tool that pierces this immunity; the fallacy occurs when that tool is dismissed without engaging the structural parallel it reveals.
