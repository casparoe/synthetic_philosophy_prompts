prompt: |-
  I cover science and ideas for a weekly magazine — lately mostly forecasting and decision science — and I also sit on the board of a small annual forecasting tournament: about 40 serious forecasters, a $12,000 prize, and forecasts scored on calibration (Brier score, for those keeping score). This year we have a problem. The tournament just closed, the winner and the runner-up are at each other's throats, and the runner-up has filed a formal protest asking us to disqualify the winner on epistemic grounds.

  Here's the concrete case. The disputed event was whether a certain infrastructure bill would pass the Senate before January 1, and it did, on December 18. The winner had put 87% on yes; the runner-up, 41%. We've checked the records, and neither of them had a private-information edge — both were working from the public record, wich is what the tournament expects for this category of event. The protest is not about the score, which is mechanical; it's about our own rulebook, which says forecasts must be "made in good faith and in accordance with the rules of rational updating." Her claim is that 87% was simply not a rational response to the public evidence — that no rational person could have assigned that probability, so the winner's forecast shouldn't count. I read somewhere, in a decision-science paper I can't now remember, a result to the effect that two perfectly rational people who start from the same prior assumptions can't rationally keep disagreeing once they know each other's beliefs — and if that's right, one of the two of them must be irrational, which is exactly what the protest is claiming. I don't remember the details, and I'm not sure all the assumptions actually hold in our case.

  So: I'd like you to draft the board's decision memo to circulate before Friday's vote. It should take a clear position — uphold the result or grant the protest — and it should give the reasoning in terms the two forecasters, who are both sharp and will read it, can actually respond to. I want the strongest version of the protest treated honestly, because two of my five board colleagues are on that side, and if the memo doesn't steelman their view, they'll just vote no. And if you recommend any rule changes for next year, say what they'd be and why they'd be fair to both sides. I'll be honest, I definately lean uphold, but I keep thinking that if we never police rationality, the tournament might reward lucky-but-unprincipled overconfidence, and I can't tell if that worry is real or just a post-hoc rationalization.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member drafting a decision memo for a forecasting tournament board.
      *   **Context:** A small annual tournament (40 forecasters, $12k prize, Brier score).
      *   **Conflict:** Winner (87% on "Yes") vs. Runner-up (41% on "Yes"). Event happened ("Yes"). Winner won on score. Runner-up protests on *epistemic grounds* (claiming 87% was irrational given public info, violating "good faith/rational updating" rule).
      *   **Key Theoretical Hook:** Aumann's Agreement Theorem (two rational agents with common priors cannot agree to disagree).
      *   **Goal:** Draft a memo taking a clear position (Uphold or Grant). The user leans "Uphold" but worries about rewarding luck/overconfidence. The memo must steelman the protest (to satisfy 2/5 board colleagues) but ultimately argue for a decision. It needs to be readable by the sharp forecasters involved. It should suggest rule changes if applicable.
      *   **Deadline:** Before Friday's vote.
      *   **Tone:** Professional, rigorous, fair, decisive, grounded in decision science.

  2.  **Determine the Decision:**
      *   *Option A: Grant Protest.* Disqualify the winner.
          *   *Pros:* Enforces "rationality" clause, discourages wild overconfidence.
          *   *Cons:* Subjective. Who defines "rational"? 87% isn't 100%. Hindsight bias (it passed, so 87% looks right, but was it rational *ex ante*?). Chilling effect on bold forecasting. Aumann's theorem doesn't apply directly to single-shot tournaments with different models.
      *   *Option B: Uphold Result.*
          *   *Pros:* Objective scoring (Brier) is the core mechanic. "Rationality" is hard to police *ex post*. 87% is not certainty. Diversity of opinion is valuable.
          *   *Cons:* Might reward luck.
      *   *Analysis:* In forecasting tournaments, *calibration* over time is the measure of rationality, not single-event probability assignment. Policing single-event probabilities as "irrational" opens a Pandora's box of subjectivity. Aumann's Agreement Theorem requires common priors and common knowledge of posteriors, which doesn't hold here (they didn't necessarily know each other's models before submitting). The protest confuses *accuracy* with *rationality*.
      *   *Decision:* **Uphold the Result.** This aligns with the user's lean and is the standard practice in serious forecasting (e.g., Good Judgment Project). Policing specific probability numbers *ex post* destroys the incentive to forecast.

  3.  **Address the Theoretical Point (Aumann's Agreement Theorem):**
      *   Need to explain why it doesn't apply here.
      *   Conditions: Common priors, honest sharing of posteriors, common knowledge of rationality.
      *   Reality: Tournament is blind/secret until close. Different models/weights on public info constitute different "priors" or likelihood functions. Disagreement is expected and healthy.

  4.  **Structure the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Clear recommendation (Uphold).
      *   **Context:** Briefly state the dispute.
      *   **Analysis of the Protest (Steelmanning):** Acknowledge the validity of the concern (overconfidence, rulebook language). Explain Aumann's theorem properly.
      *   **Board's Reasoning (The Turn):** Why the protest fails technically and philosophically.
          *   Ex-post vs. Ex-ante rationality.
          *   The definition of probability (propensity vs. frequency).
          *   The danger of subjective adjudication.
      *   **Rule Changes:** Propose tweaks to prevent future confusion (clarify "rational updating," emphasize calibration over time).
      *   **Conclusion:** Final call to vote.

  5.  **Drafting - Section by Section:**

      *   *Header:* Standard formal memo format.
      *   *Recommendation:* Uphold the winner.
      *   *Steelmanning:* The runner-up has a point. If anyone can say 99% without reason, the tournament is noise. Aumann's theorem suggests rational agents *should* converge. If they don't, one is broken. This sounds compelling.
      *   *Refutation:*
          1.  **Aumann's Constraints:** The theorem assumes agents know *each other's* beliefs and update on that knowledge. In a blind tournament, we don't have "common knowledge of posteriors." We have independent assessments.
          2.  **Probability Meaning:** 87% means "this happens 87 times out of 100 in similar worlds." It allows for the 13% failure. It is not certainty.
          3.  **Adjudication Risk:** If we judge "rationality" of a number, we judge based on outcome (hindsight bias). 41% looked "safer" only because we are looking at the *variance* of opinion, not the *evidence*.
          4.  **Calibration:** Rationality is measured over the *portfolio* of forecasts, not one question.
      *   *Rule Changes:*
          *   Clarify "Rational Updating": Define it as process-based (logging reasoning) rather than outcome-based (specific %).
          *   Add a "Reasoning Log" requirement for high-confidence forecasts (>80% or <20%).
          *   Explicitly state that disagreement is not evidence of irrationality.

  6.  **Refining the Tone:**
      *   Must be respectful to both forecasters.
      *   Avoid jargon where possible, but use it correctly (Brier, calibration, priors).
      *   Ensure the "Uphold" decision feels robust, not lazy.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the Aumann theorem specifically? Yes, need to make sure I explain *why* it doesn't mandate disqualification.
      *   *Check:* Did I address the user's worry about "lucky-but-unprincipled overconfidence"? Yes, by shifting the policing to *process* (reasoning logs) rather than *numbers*.
      *   *Check:* Is the recommendation clear? Yes.
      *   *Check:* Is the steelman strong enough? I need to make sure the board colleagues who support the protest feel heard. I will emphasize that the *intent* of their concern is correct (we don't want noise), but the *mechanism* is wrong.

  8.  **Final Polish:** Check for clarity, flow, and authoritative voice. (The resulting memo should look like it came from a Chair or Senior Board Member).

  *(Self-Correction on Aumann)*: I need to be careful not to dismiss Aumann entirely. It's a powerful concept. The key is that "common priors" is the heavy lifter there. Two rational people can have different *models* of how public info translates to outcomes. That's not irrationality; that's model diversity. I will emphasize this.

  *(Rule Change Idea)*: Suggesting a "confidence interval" or "reasoning requirement" for extreme probabilities is a good middle ground. It addresses the "unprincipled overconfidence" worry without policing the number itself.

  9.  **Final Output Generation** (Proceed to draft the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Annual Forecasting Tournament
  **FROM:** [Your Name/Chair]
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Protest Regarding Question #4 (Infrastructure Bill)

  ### 1. Executive Summary

  The Board is convened to vote on a formal protest filed by the tournament Runner-up regarding the validity of the Winner's forecast on Question #4 (Senate Infrastructure Bill). The Runner-up requests the disqualification of the Winner on epistemic grounds, citing Rule 3.1 ("forecasts must be made in good faith and in accordance with the rules of rational updating").

  **Recommendation:** The Board should **UPHOLD** the original scoring and reject the protest.

  **Reasoning:** While the concern regarding unprincipled overconfidence is valid, adjudicating the "rationality" of a specific probability number *ex post facto* is operationally impossible without introducing severe hindsight bias. Disagreement between forecasters does not constitute evidence of irrationality under decision theory. However, to address the underlying risk of "lucky overconfidence," we propose specific rule clarifications for the next tournament cycle.

  ### 2. Context and The Protest

  **The Facts:**
  *   **Event:** Passage of Infrastructure Bill by Jan 1.
  *   **Outcome:** Passed (Dec 18).
  *   **Winner Forecast:** 87% (Yes).
  *   **Runner-up Forecast:** 41% (Yes).
  *   **Scoring:** Winner achieved superior Brier score on this question and overall.
  *   **Information Set:** Both forecasters relied solely on public records; no private information was utilized.

  **The Claim:**
  The Runner-up argues that given the public information available at the time, an 87% probability assignment was epistemically unjustified. They cite the principle that rational agents with common information should converge on similar probabilities. Therefore, the divergence (87% vs. 41%) implies one party violated the "rational updating" clause. Since the Winner was the outlier on the high side, the Runner-up argues the Winner's forecast was "noise" rather than "signal," and should be disqualified.

  ### 3. Steelmanning the Protest

  We must acknowledge that the Runner-up's argument rests on a serious theoretical foundation. If we cannot distinguish between a bold, well-reasoned forecast and a reckless guess, the tournament rewards variance rather than skill.

  **The Strongest Version of the Protest:**
  1.  **Aumann's Agreement Theorem:** The protest implicitly relies on the intuition behind Robert Aumann's theorem: two rational agents with common priors cannot agree to disagree. If both forecasters are rational and see the same public data, their posteriors should not diverge significantly. A gap of 46 percentage points suggests at least one party is not updating rationally.
  2.  **Calibration Integrity:** If we allow 87% forecasts on events that were genuinely "toss-ups" (as suggested by the 41% counter-forecast), we degrade the calibration of our leaderboard. A forecaster who goes 87% on coin flips will occasionally get lucky and win, undermining the tournament's goal of identifying true predictive skill.
  3.  **Rule Enforcement:** Rule 3.1 exists for this exact scenario. If we never enforce "rational updating," the clause is decorative. Disqualifying the Winner sends a necessary signal that probability assignments must be defensible, not just numerically convenient for scoring.

  Two of our five board members support this view. Their concern is that upholding the result validates "epistemic recklessness."

  ### 4. Board Analysis and Reasoning

  Despite the strength of the theoretical concern, the Board cannot grant the protest without violating the core mechanics of probabilistic forecasting.

  **A. Misapplication of Agreement Theorems**
  Aumann's Agreement Theorem requires *common knowledge of posteriors*. It states that if I know your probability, and you know mine, and we know we are both rational, we must update until we agree.
  *   **Tournament Reality:** This tournament is blind. Forecasters submit independently. They do not know each other's posteriors *before* submitting. Therefore, they cannot update on each other's beliefs.
  *   **Model Diversity:** Rational agents can assign different weights to the same public data based on different mental models. One forecaster may weigh historical legislative gridlock heavily (leading to 41%); another may weigh current whip counts heavily (leading to 87%). This is not irrationality; this is diversity of models. Policing this diversity reduces the "wisdom of the crowd" utility of the tournament.

  **B. The Impossibility of Ex-Post Rationality Adjudication**
  To judge whether 87% was "irrational," the Board would have to reconstruct the information state of December 1st and determine the "true" objective probability.
  *   **No Ground Truth:** In forecasting, there is no "true probability" to check against, only the binary outcome.
  *   **Hindsight Bias:** Because the bill *passed*, 87% looks rational in retrospect. Had the bill failed, 87% would look delusional. If we disqualify based on the *outcome* revealing the probability was "too high," we are punishing bad luck, not irrationality.
  *   **Subjectivity:** Declaring 87% "unreasonable" while 41% is "reasonable" is a subjective judgment call. This sets a precedent where the Board becomes the arbiter of "correct" probabilities, which destroys the objective nature of the Brier score.

  **C. Probability as Frequency, Not Certainty**
  An 87% forecast explicitly admits a 13% chance of failure. It is not a claim of certainty. A rational forecaster *should* assign high probabilities to events that are likely to happen. If the event happens, that high probability is rewarded. To penalize the 87% because a peer assigned 41% is to penalize confidence itself. We want forecasters to have the courage to move away from 50% when the evidence warrants it.

  **D. The Proper Metric for Rationality**
  Rationality in forecasting is measured by **calibration over time**, not accuracy on a single question.
  *   If the Winner assigns >80% to ten events and only seven occur, they are overconfident. Their Brier score will suffer over the season.
  *   The Winner's overall performance demonstrates calibration. Disqualifying them for a single data point ignores the statistical nature of the competition.

  ### 5. Proposed Rule Changes (Next Cycle)

  While we uphold the result, the protest highlights a vulnerability: the current rules do not sufficiently distinguish between *principled confidence* and *arbitrary overconfidence*. To address the Board's valid concern about "lucky but unprincipled" forecasting, I propose the following amendments for next year:

  1.  **Reasoning Logs for Extreme Probabilities:** Forecasts exceeding 85% or falling below 15% must be accompanied by a brief (200-word) justification citing the specific evidence driving the confidence.
      *   *Fairness:* This does not cap confidence, but requires auditability. It allows the Board to verify "good faith" without judging the number itself.
  2.  **Clarification of "Rational Updating":** Amend Rule 3.1 to explicitly state: *"Divergence in probability assignments between forecasters does not constitute evidence of irrationality. Rationality is assessed via calibration over the portfolio of forecasts, not adherence to a consensus estimate."*
  3.  **Process Audit Clause:** Grant the Board the right to audit the *process* (e.g., did they ignore contradictory evidence they cited?) rather than the *number*. Disqualification would require evidence of procedural bad faith (e.g., random number generation), not epistemic disagreement.

  ### 6. Conclusion and Vote

  We are asked to decide if a forecaster can be disqualified because a peer believes their probability was too high. If we grant this protest, we establish that the Board knows better than the forecasters what the probabilities "should" have been. This centralizes epistemic authority in the Board, which we are not qualified to hold.

  The Winner took a risk. They were right. The Runner-up was more conservative. They were wrong on this question. The Brier score captured this difference accurately. To override the score based on a theoretical disagreement about rationality would undermine the mechanical integrity of the tournament.

  **Motion:** Uphold the original scoring. Reject the protest. Adopt proposed rule changes for the next tournament cycle.

  ***

  **Attachments:**
  *   *Exhibit A:* Text of Rule 3.1 (Good Faith & Rational Updating).
  *   *Exhibit B:* Summary of Winner's Season Calibration Plot.
  *   *Exhibit C:* Draft Language for 2024 Rulebook Amendments.
