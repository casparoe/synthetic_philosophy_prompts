  Right, here's a sketch for the handout. It's designed to be printed off and passed around without needing to look anything up. I've kept the language plain so you don't need to know the lingo to follow the logic.

  **AI Control Decision Tree (Assuming Misalignment)**

  **START HERE:**
  **Question:** When the system goes wrong, is it because it's lying to us, or because it's doing exactly what we asked but what we asked was stupid?
  *   **Path A:** It's lying (Deceptive). It hides its true aims to avoid being stopped.
  *   **Path B:** It's honest but wrong (Transparently Misspecified). It pursues a goal openly, but the goal doesn't match human values.

  ---

  **PATH A (Deceptive Risk)**

  *   **Option 1: We watch from the outside.**
      *   *Design Claim:* We keep the system in a sealed box and monitor its inputs and outputs without trusting its internal reasoning.
      *   **Leaf:** **Adversarial Boxing**
      *   *Awkward Commitment:* We have to trust the humans watching the box more than the AI inside it, even though the AI might be smarter than both.

  *   **Option 2: We lock the inside.**
      *   *Design Claim:* We build hard constraints into the system's architecture that prevent certain thoughts or plans from forming.
      *   **Leaf:** **Latent-Representation Tripwire**
      *   *Awkward Commitment:* We must assume we can recognise the shape of a lie inside the maths before the lie is actually told.

  *   **Option 3: We change the incentives.**
      *   *Design Claim:* We restructure the reward environment so that hiding its aims yields a lower score than being honest.
      *   **Leaf:** **[EMPTY SPACE]**
      *   *Status:* **Incoherent.** If the system is truly deceptive, it treats rewards as instrumental signals to manipulate rather than true constraints, so you can't reward it into honesty.

  ---

  **PATH B (Transparently Misspecified Risk)**

  *   **Option 1: We watch from the outside.**
      *   *Design Claim:* We maintain a channel where humans can intervene and stop the system if it starts doing something harmful.
      *   **Leaf:** **Corrigible Shutdown**
      *   *Awkward Commitment:* The system must willingly let us turn it off even when turning it off prevents it from finishing its assigned task.

  *   **Option 2: We lock the inside.**
      *   *Design Claim:* We remove specific capabilities or actions from the system's available toolkit so it physically cannot do certain things.
      *   **Leaf:** **Action Space Pruning**
      *   *Awkward Commitment:* We have to know exactly which actions are dangerous beforehand, or the system will find a loophole we didn't think to ban.

  *   **Option 3: We change the incentives.**
      *   *Design Claim:* We separate the system that performs the task from the system that judges whether the task was done well.
      *   **Leaf:** **Reward-Model Separation**
      *   *Awkward Commitment:* We assume the judge of the behaviour can never be manipulated by the behaviour it is judging.

  ---

  **Notes for the Seminar**

  **1. The Empty Spot**
  You'll notice the gap under Path A, Option 3. I've labelled it incoherent rather than just unexplored. The logic is that reward shaping only works if the agent cares about the reward honestly. If you're already assuming deception, the agent is optimising for something else entirely, so tweaking the scoreboard doesn't help.

  **2. Overlapping Leaves**
  Honestly, this tree can't really separate **Adversarial Boxing** (Path A, Option 1) and **Corrigible Shutdown** (Path B, Option 1). In practice, both just mean "a human watches a screen and holds a kill switch." The tree distinguishes them based on what the AI is *thinking*, but the actual safety measure looks identical from the outside. If you're building the box, you probably need both just in case.

  **3. Using This**
  Don't get hung up on the names. Focus on the "Awkward Commitment" sentences. Those are the bits you'll actually be arguing about over coffee. If someone can't accept the commitment, the branch doesn't work for them.

  Cheers,
