answer: |-
  1. Popper initially dismissed Darwinism as a metaphysical research programme because it appeared unfalsifiable, though he later retracted this specific criticism. He ultimately accepted natural selection as a testable scientific theory while retaining his focus on falsification.
  2. His evolutionary epistemology parallels biological selection, yet he insisted scientific conjectures undergo active attempted refutation rather than passive survival. This distinction aims to avoid the tautology trap by ensuring ideas are tested against independent evidence.
  3. If natural selection were merely tautological, it would indeed undermine the analogy underpinning his philosophy of science. However, defining fitness via specific traits rather than mere survival mitigates this circularity in both biology and epistemology.
  4. Niche construction theory complicates matters by showing organisms shape their own selective pressures, challenging the passive view of selection Popper often assumed. This feedback loop suggests his epistemology might require updating to account for how knowers modify their testing environments.
  5. The Baldwin effect further bridges learning and evolution, implying that learned behaviour can influence genetic selection over time. These modern concepts generally ease the tension by revealing evolutionary mechanisms as more complex and less circular than Popper's early critiques suggested.
