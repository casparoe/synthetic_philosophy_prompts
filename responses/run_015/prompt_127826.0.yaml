prompt: |-
  hey, i'm trying to sort out whether i'm a moral particularist or if there's actually a general principle behind my gut reactions, specifically about what i call "infromational stewardship"—basically, whether you're responsible for fixing or maintaining someone else's belief-state.

  here's my verdicts:
  - telling a murderer at the door my friend isn't home: fine, i'm not their steward.
  - telling my aunt i love the ugly sweater: fine, no stewardship issue.
  - telling a job interviewer i left voluntarily when fired: not fine, i'm misrepresenting my own record to gain.
  - telling a dying patient who asks that their estranged son called, even though he didn't but it would comfort them: not fine, feels like i'm taking stewardship over their emotional reality in a bad way.
  - telling a friend their business plan is good when it's garbage: not fine, i have stewardship over my honest opinion.
  - writing "the check is in the mail" when it isn't: not fine, but somehow less bad than the interview lie? i keep going back and forth on that one.

  now the hard ones:
  - telling my kid the dog went to live on a farm instead of died: i flip-flop. sometimes it feels like the sweater lie (fine), sometimes like the dying-patient lie (not fine).
  - silent-correction pair: if a stranger says the moon landing was 1970 and i casually correct them, that's okay. but if i know my partner's grandfather was actually a colaborator, not a war hero, and i withold correction when they praise him—i think that's wrong, even though i said nothing false. it feels like i failed a stewardship duty.

  is there one principle that gets all of these, or am i just being a particularist? state it precisely, say what it predicts for the dog/farm case and the silent-correction pair, and tell me which of my verdicts it forces me to drop—please don't hedge, take a stand and defend it. also, what does your principle say about a case i haven't listed: i know my partner is about to take a job based on false salary data i could silently correct?
