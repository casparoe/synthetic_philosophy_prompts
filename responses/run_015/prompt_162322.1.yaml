answer: |-
  # The Modal Metaphysics Decision Tree

  **Instructions:** Start at **Q1**. Follow the arrows based on your intuitions about the cases provided. Do not look at the theory names at the bottom until you reach a leaf.

  ---

  ### Q1: The Furniture of Reality
  **Are there non-actual concrete universes (isolated spacetimes) really existing out there?**
  *   **YES** → Go to **Q2**. *(You are a Modal Realist about worlds)*
  *   **NO** → Go to **Q1b**. *(You reject concrete pluriverses)*

  ### Q1b: The Surrogate Question
  **If there are no concrete non-actual worlds, are there still abstract representations (stories, sets, properties) that count as "worlds"?**
  *   **YES** → Go to **Q2**. *(You are an Ersatzist/Actualist)*
  *   **NO** → Go to **Q6**. *(You quantify over no worlds at all)*

  ### Q2: The Cross-World Link
  **When we say "I could have been a sailor," is it *literally me* at that world, or a *twin/representative*?**
  *   **LITERALLY ME** (Transworld Identity) → Go to **Q3**.
  *   **TWIN/REPRESENTATIVE** (Counterpart Relation) → Go to **Q4**.

  ### Q3: The Haecceitism Test (Individuation)
  **Imagine two qualitatively identical versions of you in a scenario. Is there a fact about which one is *you*, even if they share every property?**
  *   **YES** (Primitive "Thisness"/Haecceity) → Go to **Q6**.
  *   **NO** (Purely Qualitative) → **[EMPTY CELL]** *(See Note A)*

  ### Q4: The Fission Test (Mapping)
  **Imagine you fission into two equally good successors at a world. Are *both* your counterparts, or is the relation strictly one-to-one?**
  *   **BOTH** (One-Many Allowed) → Go to **Q5**.
  *   **NEITHER/ONE** (Strict One-One) → Go to **Q5**.

  ### Q5: The Basis of Connection
  **What makes the twin/representative *yours*? Is it fixed by objective similarity, or does it shift with conversational context?**
  *   **OBJECTIVE SIMILARITY** → Go to **Q6**.
  *   **CONTEXT/PRIMITIVE** → Go to **Q6**.

  ### Q6: The Modal Base
  **Do the worlds explain what "possible" means, or do we need a primitive notion of "possibility" to pick out the worlds?**
  *   **WORLDS EXPLAIN MODALITY** (Reductive) → **LEAF A**
  *   **MODALITY EXPLAINS WORLDS** (Primitive) → **LEAF B**

  ---

  ## Mapping Theories to Leaves

  | Leaf | Path Summary (The "Cell") | Occupant Theory | Empty? Why? |
  | :--- | :--- | :--- | :--- |
  | **1** | Concrete + Counterpart + Qualitative + One-Many + Similarity + Reductive | **Lewisian Modal Realism** | |
  | **2** | Concrete + Counterpart + Qualitative + One-Many + Context + Reductive | **Contextualist CT** (Lewisian variant) | |
  | **3** | Concrete + Counterpart + Qualitative + One-Many + Similarity + Primitive | **[EMPTY]** | *Incoherent:* Lewis's whole point is reducing modality to concrete existence. |
  | **4** | Abstract + Identity + Haecceity + N/A + N/A + Primitive | **Kripkean Actualism** | |
  | **5** | Abstract + Identity + Haecceity + N/A + N/A + Reductive | **Plantinga's Ersatzism** | |
  | **6** | Abstract + Counterpart + Qualitative + One-Many + Similarity + Reductive | **Rosen's Modal Fictionalism** | |
  | **7** | Abstract + Counterpart + Haecceity + One-One + Similarity + Reductive | **[EMPTY]** | *Unattractive:* Why use counterparts if you already have haecceities to do the work? |
  | **8** | No Worlds + N/A + N/A + N/A + N/A + Primitive | **Modal Primitivism** (Fine/Peacocke) | |
  | **9** | Abstract + Identity + Qualitative + N/A + N/A + Reductive | **[EMPTY]** | *Incoherent:* Without haecceities, qualitatively identical worlds collapse (Problem of Indiscernibles). |
  | **10**| Concrete + Identity + Haecceity + N/A + N/A + Primitive | **[EMPTY]** | *Incoherent:* Concrete isolation forbids transworld identity (Lewis's argument). |

  ---

  ## Diagnostic Cases: Where the Tree Forks

  **Case 1: "I might not have existed."**
  *   **The Fork:** **Q2 (Identity vs. Counterpart).**
  *   **Why:** If you chose **Identity**, you must explain how *you* exist at a world where you don't exist (often leading to Necessary Existence or "world-bound" actualism). If you chose **Counterpart**, this is easy: there is a world with no counterpart of you.
  *   **Diagnostic:** If you think "I might not have existed" is true but find "I exist at a world where I don't" nonsense, you must take the **Counterpart** branch.

  **Case 2: The Indistinguishable Twins.**
  *   **The Fork:** **Q3 (Haecceitism).**
  *   **Why:** If two worlds are qualitatively identical, is there a difference in *which one is actual*?
  *   **Diagnostic:** If you say "No difference," you are **Qualitative** (Leaf 1/6). If you say "There is a fact, even if unknowable," you are **Haecceitist** (Leaf 4/5). This separates Lewis from Kripke/Plantinga.

  **Case 3: The Fission.**
  *   **The Fork:** **Q4 (One-Many).**
  *   **Why:** If you split into two successors, does the logic break?
  *   **Diagnostic:** If you say "Both are me," you allow **One-Many** (Leaf 1/2). If you say "Neither is strictly me," you enforce **One-One** (Leaf 7-ish). Lewis allows One-Many; strict Identity views usually forbid it (Leibniz's Law).

  ---

  ## Indistinguishable Leaves (The "Black Box" Problem)

  **Warning:** This tree cannot separate **Leaf 2** (Contextualist CT) from a **Primitive Counterpart** view via external truth conditions alone.
  *   **The Issue:** If the counterpart relation is primitive, it behaves exactly like a context-sensitive similarity relation from the outside.
  *   **The Only Test:** You must ask the theorist: "Is there a further fact *why* this is your counterpart?" If they say "No," it's Primitive. If they say "It depends on what we're comparing," it's Contextual. The tree forces you to pick, but the empirical output is identical.

  **Note A (Empty Cell: Abstract + Identity + Qualitative):**
  *   **Why Empty?** This is the **Problem of Indiscernibles**. If worlds are abstract and identity is qualitative, two worlds containing the same properties are the *same world*. You lose the ability to distinguish "Possibility A" from "Possibility B" if they are qualitatively identical. You need Haecceities to keep them apart.
