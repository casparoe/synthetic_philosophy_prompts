answer: |-
  **Valid Consent Decision Procedure**

  **Step 1: Competence (Capacity)**
  *Question:* "Please explain the procedure and the five-year storage clause in your own words."
  *Sufficient Answer:* Patient articulates core mechanics and storage limits without assistance.
  *Stop Condition:* Patient cannot explain core mechanics or relies on another to answer.
  *Handoff:* Physician assesses medical capacity if confusion is specific.
  **[Judgment Call]:** *Distinguishing nervousness or temporary confusion from cognitive incapacity.*

  **Step 2: Informed (Understanding)**
  *Question:* "What are the success rates we discussed, and what alternatives exist, including doing nothing?"
  *Sufficient Answer:* Patient cites specific clinic stats and names at least one viable alternative.
  *Stop Condition:* Patient believes success is guaranteed or no alternatives exist.
  *Handoff:* Physician validates medical necessity if "no alternative" is claimed.
  **[Judgment Call]:** *Determining if an alternative is medically "viable" versus technically possible.*

  **Step 3: Voluntary (Freedom)**
  *Question:* "If this discount expired today, would you still proceed?"
  *Sufficient Answer:* "Yes," based on medical need or clinic trust.
  *Stop Condition:* "No," or hesitation indicating price is the sole driver.
  **[Judgment Call]:** *Differentiating a financial incentive from undue coercion.*

  ***

  **Case Applications**

  **(1) The Discount Patient**
  *Run:* Step 3. Patient says "obviously we'd go with your clinic" regarding the discount.
  *Result:* **Flag.** Implies decision hinges on price, not medical choice.
  *Clash:* Current practice treats discounts as standard marketing. This procedure classifies heavy price-dependence as potential coercion requiring physician review.

  **(2) The Competitor Bash**
  *Run:* Step 2. Patient knows alternatives but rejects them based on "cut corners" claim.
  *Result:* **Flag.** Information regarding alternatives is compromised by unverified negative claims.
  *Clash:* Current practice allows physicians to differentiate clinic quality. This procedure requires neutral framing of alternatives to ensure informed status.

  **(3) The Memory Patient**
  *Run:* Step 1. Patient confuses storage clause; partner answers.
  *Result:* **Flag.** Patient cannot articulate specific consent terms without assistance.
  *Clash:* Current practice accepts partner support as valid advocacy. This procedure requires independent articulation for competence verification.

  ***

  **Limitations**
  This procedure cannot detect internal emotional pressure (e.g., family expectation) unspoken during the call. It cannot adjudicate medical truth (e.g., whether other clinics actually cut corners). It cannot replace legal counsel regarding contractual enforceability. It is a screening tool, not a verdict. It cannot resolve value conflicts where a patient understands the facts but chooses based on desperation; that remains a physician's ethical burden, not a compliance checkbox.
