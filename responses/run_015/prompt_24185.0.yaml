prompt: |-
  I work in compliance at a small private fertility clinic. Roughly thirty times a week I take a fifteen-minute call with a patient before a procedure, walk through the consent form, and flag any case that looks shaky to the attending physician, who is the one who actually signs off. I have no legal or philosophy training, but I've been thinking on my own about what actually makes a consent valid. I keep landing on the standard list — the person has to be informed, the choice has to be voluntary, and the person has to be competent — and I can't tell where the lines are. Is a patient who is offered a 50% discount this month being coerced? Is a patient who is told the correct success rates but is told "this is the only option that works for you" properly informed? Does competence work as one switch, or can a person be competent about one part of a decision and not another?

  Please turn that standard list into a decision procedure my team could actually run during the call: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts. Mark clearly which steps are judgment calls dressed up as procedure. Then run it on these three cases from this month: (1) a patient who is given the discount and says "obviously we'd go with your clinic," with nothing else changed; (2) a patient who is told the correct odds but is told the other clinics "cut corners," and when I press her she says she would still want the procedure but "not from them"; (3) a patient with early memory problems who is completely clear about the procedure itself but keeps confusing the five-year embryo storage clause, with her partner present on the call and answering for her whenever she hesitates. If the procedure gives an answer on any of these that clashes with what we have been doing, say so plainly, and end by saying what the procedure cannot do at all. Keep the whole thing to a maximum of 800 words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Compliance officer at a small private fertility clinic.
      *   **Task:** Create a decision procedure for valid consent based on the standard list (Informed, Voluntary, Competent) that a team can run during a 15-minute call.
      *   **Requirements:**
          *   Questions in order.
          *   Sufficient answers for each.
          *   Stop conditions (where it stops with a "no").
          *   Handoff points (where it goes to a person/physician because it's values-based).
          *   Mark judgment calls dressed up as procedure.
          *   Apply the procedure to three specific cases.
          *   Note clashes with current practice.
          *   End with what the procedure cannot do.
          *   **Constraint:** Maximum 800 words.

  2.  **Deconstruct the Standard List (Informed, Voluntary, Competent):**
      *   *Competence:* Can they understand and decide?
      *   *Informed:* Do they know the facts/risks/alternatives?
      *   *Voluntary:* Is there coercion/undue influence?

  3.  **Drafting the Decision Procedure:**
      *   Need to be practical for a 15-minute call.
      *   Need to identify "judgment calls."
      *   Order: Competence -> Informed -> Voluntary (usually logical flow, though often intertwined). Let's start with Competence (can they engage?), then Informed (do they know?), then Voluntary (are they free?).

      *   *Step 1: Competence.* Ask patient to explain back the procedure and storage terms.
          *   Pass: Accurate summary.
          *   Fail: Cannot explain core mechanics.
          *   *Judgment Call:* What counts as "accurate" vs. "minor confusion"?
      *   *Step 2: Informed.* Ask about alternatives and success rates.
          *   Pass: Can name at least one alternative (including doing nothing) and cites clinic's specific stats.
          *   Fail: Believes procedure is guaranteed or only option.
          *   *Handoff:* Physician determines medical necessity of "only option" claims.
      *   *Step 3: Voluntary.* Ask about pressure/discounts.
          *   Pass: Decision stands without discount/pressure.
          *   Fail: Decision hinges solely on external pressure/discount.
          *   *Judgment Call:* Distinguishing incentive from coercion.

  4.  **Applying to Cases:**
      *   *Case 1 (Discount):* "Obviously we'd go with your clinic."
          *   Procedure: Voluntary step. Is the discount the *only* reason? If they say "obviously," implies price is driver.
          *   Verdict: Flag for coercion/undue influence.
      *   *Case 2 (Competitor bashing):* Told others "cut corners." Says she'd still want procedure but "not from them."
          *   Procedure: Informed step. Alternatives? She acknowledges alternatives exist but distrusts them based on clinic claim.
          *   Verdict: Flag for misinformation/undue influence (Informed/Voluntary overlap).
      *   *Case 3 (Memory/Partner):* Clear on procedure, confused on storage. Partner answers.
          *   Procedure: Competence step. Storage is part of consent. Partner answering is a red flag for autonomy.
          *   Verdict: Flag for competence/authority.

  5.  **Refining for Word Count and Tone:**
      *   Tone: Professional, direct, compliant.
      *   Word Count: Tight limit (800 words). Need to be concise.
      *   Must explicitly mark judgment calls.
      *   Must explicitly state clashes with current practice.
      *   Must end with limitations.

  6.  **Drafting - Section by Section (monitoring word count):**

      *   *Intro:* Brief context.
      *   *Procedure:* The 3 steps.
      *   *Case Applications:* The 3 scenarios.
      *   *Clashes/Limitations:* The ending.

      *Drafting thought:* I need to make sure I identify where the procedure stops.
      *   Step 1 (Competence): Can they explain the procedure and storage terms without help?
          *   Stop: No -> Flag to Physician.
          *   *Judgment Call:* Determining if confusion is temporary or structural.
      *   Step 2 (Informed): Can they state success rates and one alternative (including no treatment)?
          *   Stop: No -> Correct info, then re-ask. If still no -> Flag.
          *   *Handoff:* Physician validates medical alternatives.
      *   Step 3 (Voluntary): Would you proceed if the discount expired today?
          *   Stop: No -> Flag for coercion.
          *   *Judgment Call:* Is a discount an incentive or coercion?

      *Case 1:* Discount. Patient says "obviously."
      *   Procedure says: Ask "Would you proceed without discount?" If answer implies no, flag.
      *   Clash: We currently accept discounts as marketing. Procedure flags as potential coercion.

      *Case 2:* Competitor bashing.
      *   Procedure says: Alternatives must be viable. "Cut corners" undermines informed choice.
      *   Clash: We currently let physicians manage sales talk. Procedure flags misinformation.

      *Case 3:* Memory/Partner.
      *   Procedure says: Patient must explain storage terms without help.
      *   Clash: We currently accept partner support as valid. Procedure flags competence gap.

      *Limitations:* Cannot measure internal fear, cannot adjudicate medical necessity, cannot replace legal counsel.

      *Reviewing Word Count:* I need to be very economical.

      *Revised Plan:*
      1.  Procedure (3 steps).
      2.  Case Runs.
      3.  Clashes & Limitations.

      *Writing:*
      **Valid Consent Decision Procedure**

      **Step 1: Competence (Capacity)**
      *Question:* "Please explain the procedure and the five-year storage clause in your own words."
      *Sufficient Answer:* Patient articulates core mechanics and storage limits without assistance.
      *Stop Condition:* Patient cannot explain core mechanics or relies on another to answer.
      *Handoff:* Physician assesses medical capacity if confusion is specific.
      *[Judgment Call]:* Distinguishing nervousness from cognitive incapacity.

      **Step 2: Informed (Understanding)**
      *Question:* "What are the success rates we discussed, and what alternatives exist, including doing nothing?"
      *Sufficient Answer:* Patient cites specific clinic stats and names at least one viable alternative.
      *Stop Condition:* Patient believes success is guaranteed or no alternatives exist.
      *Handoff:* Physician validates medical necessity if "no alternative" is claimed.
      *[Judgment Call]:* Determining if an alternative is medically "viable" versus technically possible.

      **Step 3: Voluntary (Freedom)**
      *Question:* "If this discount expired today, would you still proceed?"
      *Sufficient Answer:* "Yes," based on medical need or clinic trust.
      *Stop Condition:* "No," or hesitation indicating price is the sole driver.
      *[Judgment Call]:* Differentiating a financial incentive from undue coercion.

      **Case Applications**

      **(1) The Discount Patient**
      *Run:* Step 3. Patient says "obviously we'd go with your clinic" regarding the discount.
      *Result:* **Flag.** Implies decision hinges on price, not medical choice.
      *Clash:* Current practice treats discounts as standard marketing. This procedure classifies heavy price-dependence as potential coercion requiring physician review.

      **(2) The Competitor Bash**
      *Run:* Step 2. Patient knows alternatives but rejects them based on "cut corners" claim.
      *Result:* **Flag.** Information regarding alternatives is compromised by unverified negative claims.
      *Clash:* Current practice allows physicians to differentiate clinic quality. This procedure requires neutral framing of alternatives to ensure informed status.

      **(3) The Memory Patient**
      *Run:* Step 1. Patient confuses storage clause; partner answers.
      *Result:* **Flag.** Patient cannot articulate specific consent terms without assistance.
      *Clash:* Current practice accepts partner support as valid advocacy. This procedure requires independent articulation for competence verification.

      **Limitations**
      This procedure cannot detect internal emotional pressure (e.g., family expectation) unspoken during the call. It cannot adjudicate medical truth (e.g., whether other clinics actually cut corners). It cannot replace legal counsel regarding contractual enforceability. It is a screening tool, not a verdict.

