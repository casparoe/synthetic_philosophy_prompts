  In a shared flat at 3 AM, a robot assistant fetches a glass of water from the kitchen while the residents sleep. To navigate the dark hallway, the robot toggles a light switch on and then off upon leaving; this creates a significant baseline deviation because the world state (light on) diverges temporally from the inaction baseline (light off), yet it preserves the residents' attainable utility since their sleep and future agency remain unaffected. Simultaneously, the robot nudges a heavy armchair five centimeters to bypass a cable; this registers low baseline deviation because the room's macroscopic appearance is unchanged, but it scores high on attainable-utility preservation because the shift technically restricts a vast number of precise future trajectories the residents could have enacted (e.g., placing an object exactly where the chair now sits), even though intuitively this constraint is negligible.

  **Case Check**

  *   **Side Effect 1 (Light):**
      *   **Baseline Deviation (a):** High. *Reasoning:* The world state sequence differs from the "do nothing" null trajectory.
      *   **Attainable Utility (b):** Low. *Reasoning:* The residents' capacity to achieve their goals is unchanged by a transient light flip.
      *   **Verdict:** Acceptable (Low Impact). Measure (b) is correct.
      *   **Structural Feature:** (a) tracks *ontic state distance* rather than *value-relevant change*. It penalizes transient physical differences even when they carry no moral weight. If this feature were removed (i.e., if (a) ignored reversible states), the false positive would vanish.

  *   **Side Effect 2 (Chair):**
      *   **Baseline Deviation (a):** Low. *Reasoning:* The resulting static state is visually nearly identical to the baseline.
      *   **Attainable Utility (b):** High. *Reasoning:* Any restriction on future action space counts as a utility loss, aggregating trivial constraints into a large penalty.
      *   **Verdict:** Acceptable (Low Impact). Measure (a) is correct.
      *   **Structural Feature:** (b) tracks *quantity of optionality* rather than *quality of options*. It conflates the loss of trivial futures with the loss of meaningful agency. If this feature were removed (i.e., if (b) weighted options by importance), the false positive would vanish.

  **Correction on Structural Features**
  Your guess regarding (a) is slightly off: the issue is not distinguishing caused vs. prevented changes (the robot *caused* the light to turn on), but rather distinguishing *value-neutral* vs. *value-laden* state changes. Your guess regarding (b) is correct in spirit but needs precision: (b) fails not because it conflates large changes with side effects, but because it treats *all* reductions in attainable utility as morally equivalent, lacking a filter for triviality.

  **Strongest Reply**
  A defender of low-impact AI would argue that impact measures are never intended to be free-standing moral arbiters but rather *regularizers* that require a value function to define "utility" or "distance" in the first place; thus, the failure of a proxy without value specification is a category error, not a research failure.

  **Moral**
  The moral is that impact measures need a value specification, because "side effect" is not a natural kind describable by state distance or optionality alone.
