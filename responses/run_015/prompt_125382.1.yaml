prompt: |-
  so i host a smallish neuroscience podcast but my producer talked me into doing three episodes on AI interpretability, and my first guest is a researcher at one of the big labs who's a full-on realist about neural representations — she claims features are things you *discover* in a model, not useful fictions we project onto it, and she's been arguing with people who say sparse autoencoders just carve the model up along whatever joints the SAE happened to pick. I used to do decoding work in systems neuroscience and spent way too many years on whether a classifier pulling "face" out of fMRI voxels means the brain represents faces, so this feels like the same fight with new vocabulary, and I want the episode to lean into that. Draft me 8–9 questions, no "what got you into interpretability" filler. I want at least one each on: whether a representation has to be something the model *uses* rather than something we can read off it (and when she says "if you can steer behaviour with it, it's real," push on whether steering is better evidence in a net than stimulation/lesion work is in a brain); basis-dependence and superposition — if a direction isn't privileged among all the ones an SAE could have picked, in what sense is it the model's feature; two models landing on "the same" feature vs. merely isomorphic ones; and what result would actually make her give up realism and go instrumentalist. For each, give me her likely answer in a line and the follow-up that makes that answer hard to sit with.
