answer: |-
  **Dissertation Proposal**

  **Title:** Adversarial Selection and the Epistemology of Extreme Claims: Reframing Pascal's Mugging as a Signalling Game

  **1. Research Question**
  Does modelling Pascal's Mugging as an adversarial signalling game provide a substantive solution to the problem of fanatical decision-making, or does it merely redescribe the assumption that priors must decline faster than utility? Specifically, does the strategic nature of the mugger's claim generate skepticism independently of complexity-based priors, and does this distinction structurally separate the Mugging from Pascal's Wager?

  **2. Background and State of the Field**
  Pascal's Mugging presents a challenge to Expected Utility Theory (EUT). An agent is threatened with an astronomically high disutility (or promised high utility) contingent on a small payment, with a probability low enough that the product $P \times U$ remains significant. Standard responses fall into three camps: bounding the utility function, adopting lexicographic preferences, or arguing that prior probabilities must shrink at least as fast as the claimed utility grows (complexity priors).

  *Claim 1:* The prevailing literature treats the mugger's stated number as an exogenous datum to be evaluated, rather than a strategic variable chosen by an interlocutor. **[Confidence: High]**. Most formalizations fix the payoff and ask how the agent should update, ignoring the mugger's optimization problem.

  *Claim 2:* Pascal's Wager and Pascal's Mugging are frequently treated as structurally identical problems regarding infinite or extreme expectations. **[Confidence: Medium-High]**. While often grouped together, the Wager typically posits a state of the world (God's existence) rather than a negotiable claim made by an agent with incentives to manipulate.

  *Claim 3:* The absence of "cheap evidence" in the Mugging scenario is usually subsumed under general implausibility rather than treated as a distinct signalling failure. **[Confidence: Medium]**. Some work exists on the epistemology of testimony in extreme cases, but it is not the dominant frame for solving the decision-theoretic paradox.

  **3. Methodology**
  This project is purely conceptual and formal. It will proceed in three stages:
  1.  **Formalization:** Construct a game-theoretic model where the "mugger" chooses a claim size $N$ to maximize expected payoff, given a model of the "victim's" decision rules.
  2.  **Comparative Analysis:** Contrast this with a model of Pascal's Wager where the payoff is fixed by theology/metaphysics, not chosen by a strategic actor.
  3.  **Evaluation:** Determine if the equilibrium of the signalling game naturally suppresses high-stakes claims without requiring an *ad hoc* complexity prior.

  **4. Work Plan (12 Months)**
  *   **Months 1–2:** Literature review. Map existing solutions to the Mugging (bounded utility, complexity priors) and identify gaps regarding adversarial selection.
  *   **Months 3–4:** Develop the formal signalling model. Define the mugger's utility function and the victim's updating rule.
  *   **Months 5–6:** Test the model. Does the equilibrium predict that honest agents with high stakes provide verification? Does it predict skepticism toward unverified high claims?
  *   **Months 7–8:** Draft the comparative chapter (Mugging vs. Wager). Analyze whether the signalling objection applies to the Wager.
  *   **Months 9–10:** Draft the core argument and implications for EUT.
  *   **Months 11–12:** Revision, editing, and final submission.

  **5. Success and Failure Criteria**
  *   **Success:** The project demonstrates that the signalling frame generates skepticism *endogenously*. That is, the mugger's optimal strategy is *not* to make astronomical claims without evidence, regardless of the victim's prior, because such claims trigger a "lying" equilibrium. This would distinguish the Mugging from the Wager.
  *   **Failure:** The model only works if we assume the victim already assigns a vanishingly small prior to the mugger's honesty. If the signalling model collapses into "priors must be low," the project merely redescribes the complexity prior argument.
  *   **Early Warning Sign:** If, by Month 4, the formal model requires a premise that "probability of honesty decreases as stakes increase" to function, the project is drifting toward the failure mode. This premise is the very thing the project aims to derive, not assume.

  **6. Scope and Feasibility**
  The word count (12,000) is manageable for the timeline. The risk is not breadth, but depth; ensuring the formal model is rigorous enough to support the philosophical conclusion. The project avoids empirical work, relying on logical consistency and formal modelling, fitting the supervision schedule.

  ***

  ### Advice on Scope and Confidence (For Your Preparation)

  **1. Is this too big or too small?**
  For a one-year Master's, 12,000 words is actually on the **small side** (many are 15k–20k). This is good for completion risk, but bad for depth risk. You might run out of things to say by Month 8.
  *   **Recommendation:** Expand the "Comparative Analysis" section. Don't just say PW is different; show *exactly* where the signalling model breaks if applied to PW. (e.g., In PW, is God a strategic agent? If yes, does PW become a Mugging? If no, why not?) This gives you more material to fill the word count and strengthens the philosophical contribution.

  **2. Confidence Markers & The "Grilling" Risk**
  I have inserted confidence markers into the proposal text above as requested. Here is the breakdown of where you are vulnerable:

  *   **High Confidence Claims:** You are safe arguing that the literature treats the number as a datum. This is standard fare in decision theory papers.
  *   **Medium Confidence Claims:** The claim that "absence of cheap evidence" is under-utilized is riskier. A knowledgeable examiner might cite specific papers on testimony or Bayesian epistemology that *do* cover this.
  *   **The "Least Sure" Claim (Your Danger Zone):**
      *   *Claim:* "The signalling model generates skepticism *endogenously* without assuming a complexity prior."
      *   *Why it's risky:* This is the crux of your dissertation. If the signalling model *requires* you to assume the victim thinks "big numbers are unlikely" to work, then you haven't solved the problem; you've just moved the assumption from the probability function to the game structure.
      *   *Preparation:* You need to be ready to defend whether "rational agents don't make unverifiable huge claims" is a *result* of your model or an *input*. If it's an input, your examiner will argue you haven't escaped the original problem. Read up on **separating equilibria** in signalling games. You need to show that the *cost* of making the claim (e.g., reputational damage, effort to maintain the lie) does the work, not the prior probability of the claim's content.

  **3. The Friend's Objection (PW vs. PM)**
  Your friend says they are the same. Your proposal argues they are different because of the *source* of the stakes.
  *   **Prep:** Be ready for the counter-argument: "In the Wager, the Priest is a strategic agent telling you the stakes." You need to distinguish between the *metaphysical stakes* (which are fixed in PW) and the *testimony about the stakes* (which is strategic). In PM, the stakes *themselves* are the strategic variable. Make sure this distinction is crystal clear in Chapter 2.

  **4. Early Warning System**
  I included this in the proposal (Section 5), but take it seriously. If you find yourself writing "We assume the agent assigns low probability to huge claims" in your formal model, stop. That is the failure mode. You need to find a cost function for the mugger that makes lying about huge numbers irrational *even if* the mugger thinks the victim might believe it. (e.g., If the mugger is caught lying, they lose future opportunities). If you can't find that cost, the signalling argument fails.
