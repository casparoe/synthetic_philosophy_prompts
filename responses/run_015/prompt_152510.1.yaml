answer: |-
  Friend 2 is closer to the philosophical consensus. Friend 1's "structural visibility" criterion is fundamentally flawed. Moral obligation shouldn't hinge on whether a bureaucracy registers an act. Secret wrongs are still wrong. The voting analogy holds because both are collective action problems where individual causal impact is negligible but expected utility or duty remains. Dismissing invisible contributions invites free-riding, undermining the collective action required for either domain.

  Friend 1 confuses publicity with morality. The "invisible" harm of emissions is real regardless of measurement. The distinction isn't visibility but mechanism: voting is a political input, consumption an economic signal. Both sustain systems. Friend 2 correctly identifies that negative duties (avoiding harm) often carry more weight than positive duties (voting), making the obligation to abstain from harming potentially stronger, not weaker, than voting. Friend 1's view implies morality requires an audience, which is untenable. If visibility mattered, private abuse would be permissible, which is absurd.

  On probabilistic causation, Friend 2's threshold point is crucial. While one burger rarely triggers a specific slaughter, market orders operate in batches. Your purchase increases the probability of reaching a reorder threshold. Expected utility theory suggests the expected harm equals the total harm divided by the number of consumers. It's not speculative; it's mathematical expectation over time. Friend 1's dismissal ignores how supply chains actually respond to marginal demand shifts.

  Finally, complicity isn't mere "collective guilt." Contemporary accounts frame it as participatory responsibility. You share responsibility for outcomes you intentionally contribute to, even if redundant. Friend 1's demand for direct causation sets an impossibly high bar that would excuse most corporate or state violence. While voting is constitutive of democracy, consumption sustains harmful markets. Friend 2 wins: invisibility doesn't negate obligation, and probabilistic harm is sufficient for moral duty.
