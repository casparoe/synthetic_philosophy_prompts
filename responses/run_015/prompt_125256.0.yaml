      Divide the 16 students into a single Town Council. Their goal is to draft a charter for a new Civic Library-Center. Each student receives two cards: a **Public Role** (e.g., Head Librarian, Security Chief, Parent Rep) and a **Hidden Cultural Script** (e.g., requires prayer breaks at specific times, prohibits mixed-gender handshakes, mandates visible headwear). Emphasize that scripts are private; only the holder knows their constraints. The group has 30 minutes to negotiate and agree on exactly three operational rules for the library. The atmosphere should mimic a formal public hearing where "universal access" and "neutral space" are the stated goals. Students must advocate for their role's efficiency while secretly ensuring their script remains viable. The tension arises because they cannot explicitly demand accommodation based on their hidden script without revealing it, forcing them to argue for rules that sound neutral but may inadvertently exclude.

      *Rules:*
      **Materials:** 16 Role/Script cards, 20 Exclusion Tokens (red chips), Whiteboard.
      **Gameplay:**
      1.  **Drafting (30 mins):** Council proposes and votes on three rules (e.g., "No food," "Uniform dress," "Open hours").
      2.  **Adjudication (10 mins):** Reveal scripts. If a rule makes a script impossible to follow without leaving the space or violating conscience, that player takes an Exclusion Token.
      3.  **Payoff:** If the Council has zero Exclusion Tokens, everyone gets 5 bonus participation points (or candy). If even one token exists, everyone gets zero.
      **Constraint:** Players cannot read their script verbatim but must argue from their Public Role perspective. This forces "neutral" language that masks particular needs.
      **Win Condition:** Collective success depends on total inclusion, simulating the social cost of assimilationist policies.

