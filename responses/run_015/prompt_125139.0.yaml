answer: |-
  # The Research Programme Vitality Assessment (RPVA)
  **Version 1.0 | For Internal Use by Standing Review Panels**

  ## 1. Purpose and Scope
  This procedure guides the Panel in assessing the scientific vitality of long-running research programmes. It translates the dossier evidence into a recommendation for one of four verdicts: **Renew**, **Renew with Restructuring**, **Probation**, or **Wind Down**.

  **Time Allocation:** 3.5 hours per programme.
  **Evidence Base:** Strictly limited to the 40-page dossier (Self-Report, Output List, External Reviews). No external knowledge or private correspondence.
  **Appeal Standard:** Every finding must cite a specific page/section of the dossier. Findings based on "impression" or "promise" are invalid.

  ---

  ## 2. The Decision Procedure

  ### Step 1: The Identity Check (Hard Core Stability)
  **Question:** Has the fundamental assumption (the "Hard Core") stated in the previous review changed in the current Self-Report?
  *   **Evidence:** Compare the "Core Hypotheses" section of the current Self-Report against the previous Review's summary of the Core.
  *   **Sufficient Answer:**
      *   *No Change:* Proceed to Step 2.
      *   *Change Detected:* If the core assumption has been altered to accommodate negative results, the programme has effectively abandoned its original identity.
  *   **Stop Rule:** If the Core has changed *and* the consortium requests renewal of the original programme line, the verdict is **Renew with Restructuring**. The funding must align with the *new* core, which requires a new competitive assessment.
  *   **Handoff:** If the change is minor (terminology only), proceed to Step 5 (Reformulation Check).

  ### Step 2: The Immunity Test (Falsifiability of the Belt)
  **Question:** Does the dossier describe any adjustment made to the theory (the "Protective Belt") that renders a negative result impossible to verify?
  *   **Evidence:** Look for phrases in the Self-Report or External Reviews such as "cannot be measured with current technology," "applies only to conditions not yet achievable," or "failure indicates incorrect calibration of auxiliary assumptions."
  *   **Sufficient Answer:**
      *   *Pass:* Negative results are acknowledged as potential falsifications.
      *   *Fail:* An "Immunity Clause" is identified (e.g., claiming a variable is unmeasurable to explain away a failed prediction).
  *   **Stop Rule:** If an Immunity Clause is documented and no timeline for measurement is provided, the verdict is **Probation**. The consortium must either measure the variable or retract the claim within the probation period.
  *   **Handoff:** If the immunity is due to budget limits (e.g., "requires a satellite we don't have"), this is a resource issue, not a scientific one. Flag for Board risk-appetite (Step 8).

  ### Step 3: The Borrowed Progress Filter
  **Question:** Are the cited successes (citations, tool adoption, industry use) dependent on the Hard Core being true?
  *   **Evidence:** Output List and Self-Report "Impact" section.
  *   **Sufficient Answer:**
      *   *Core-Dependent:* The tool/method fails if the Core is false.
      *   *Core-Independent:* The tool/method works regardless of the Core (e.g., a data pipeline, a staging tool, a dataset).
  *   **Action:** Segregate "Infrastructure Success" from "Theoretical Success." Infrastructure Success counts toward *utility* but not toward *scientific vitality*.
  *   **Handoff:** If Infrastructure Success is high but Theoretical Success is low, the decision to fund becomes a policy choice (infrastructure vs. discovery). Flag for Board (Step 8).

  ### Step 4: The Novelty and Risk Audit (Prediction Milling)
  **Question:** In the review period, how many *novel* predictions were registered *in advance* and confirmed?
  *   **Evidence:** Self-Report "Key Predictions" table vs. Output List.
  *   **Sufficient Answer:**
      *   *High Risk:* Prediction specifies a value/effect that would be unlikely if the Core were false.
      *   *Low Risk (Milling):* Prediction is a restatement of known data, or slices a known effect into smaller sub-groups without increasing risk.
  *   **Stop Rule:** If zero high-risk novel predictions were confirmed in the last 5 years, the programme is scientifically stagnant. Proceed to Step 6.
  *   **Note:** A single confirmed high-risk prediction outweighs ten low-risk confirmations.

  ### Step 5: The Reformulation Check (Translational Equivalence)
  **Question:** Do new formalisms or vocabularies introduced in the period generate new testable consequences?
  *   **Evidence:** Self-Report "Theoretical Developments" and External Reviews.
  *   **Sufficient Answer:**
      *   *Progressive:* The new formalism allows a calculation or prediction the old one could not.
      *   *Translational:* The dossier explicitly states (or reviewers agree) the new formalism is "mathematically equivalent" or "conceptually identical" to the old one.
  *   **Stop Rule:** If all major theoretical outputs are Translational Reformulations, count this as **Zero Theoretical Progress** for Step 7.

  ### Step 6: Stagnation vs. Consolidation
  **Question:** If no novel predictions were made (Step 4), is the silence due to anomaly resolution (Consolidation) or anomaly avoidance (Stagnation)?
  *   **Evidence:** Treatment of outliers in the Output List.
  *   **Sufficient Answer:**
      *   *Consolidation:* Outliers are investigated, and the model is refined to include them (increasing empirical content).
      *   *Stagnation:* Outliers are excluded via ad-hoc criteria (e.g., "sample quality," "boundary conditions") without independent verification.
  *   **Stop Rule:** If Stagnation is identified, the verdict is **Wind Down** unless Step 7 (Grace Period) applies.

  ### Step 7: The Grace Period Rule (Hindsight Limit)
  **Question:** How long has the programme run without a confirmed high-risk novel prediction?
  *   **Evidence:** Output List dates vs. Prediction registration dates.
  *   **Rule:**
      *   *0-5 Years:* Acceptable for high-risk fields.
      *   *5-10 Years:* Requires strong evidence of "Consolidation" (Step 6).
      *   *10+ Years:* Presumption of degeneration.
  *   **Extension:** An extension beyond 10 years requires:
      1.  External Reviewer consensus that the field is inherently long-cycle.
      2.  A signed "Risk Acceptance" from the Panel Chair.
  *   **Stop Rule:** If >10 years with no novel facts and no valid extension signature, the verdict is **Wind Down**.

  ### Step 8: The Value Handoff
  **Condition:** The procedure yields a "Scientific Vitality" rating, but the final verdict may depend on Council strategy.
  *   **Trigger:**
      *   High Infrastructure Success / Low Theoretical Success (Step 3).
      *   High Risk / Long Cycle (Step 7 Extension).
      *   Political/Strategic importance (e.g., Flagship status).
  *   **Action:** The Panel records the Scientific Finding (e.g., "Degenerating") but may recommend **Renew with Restructuring** instead of Wind Down *only if* they explicitly cite the Strategic Justification in the findings.
  *   **Constraint:** The Strategic Justification must be written as a policy decision, not a scientific one, to remain appeal-proof.

  ---

  ## 3. Application to Current Cycle Programmes

  ### Programme A: Sleep and Memory Consolidation
  **Dossier Reference:** Self-Report pp. 4-6; External Review 1, p. 2; Output List Items 12-19.

  **Findings:**
  1.  **Identity Check (Step 1):** Core assumption (reactivation is causally necessary) remains unchanged. **Pass.**
  2.  **Immunity Test (Step 2):** The dossier states that 8 failed human replications are attributed to "cue salience below threshold." The Self-Report explicitly states "salience cannot presently be measured" (p. 5). This converts a negative result into an untestable claim. **Fail (Immunity Clause Identified).**
  3.  **Borrowed Progress (Step 3):** The most-cited output is an automated sleep-staging tool (Output #1). Reviewers confirm this tool functions independently of the memory consolidation hypothesis. **Infrastructure Success Only.**
  4.  **Novelty Audit (Step 4):** One pre-registered prediction confirmed in rodents. Zero confirmed in humans. **Low Theoretical Progress.**
  5.  **Grace Period (Step 7):** Programme is 10 years old. No human novel facts in this period.

  **Verdict:** **Place on Probation with Short Re-review (24 Months).**

  **Written Justification for Consortium:**
  "The Panel finds that the Protective Belt has been modified to render the Core assumption unfalsifiable in human subjects (Self-Report p.5). Specifically, the claim that cue salience is unmeasurable prevents negative replication results from bearing on the theory. Renewal is contingent on either: (a) operationalizing and measuring salience to allow falsification, or (b) restricting the Core claim to rodent models where predictions are confirmed. The sleep-staging tool is acknowledged as valuable infrastructure but does not constitute evidence for the theoretical Core."

  **Strategic Note:** If the Council wishes to retain the human research line despite this finding, the Board must sign a Risk Acceptance waiver acknowledging the funding of a currently unfalsifiable hypothesis.

  ***

  ### Programme B: Materials Failure Order Parameter
  **Dossier Reference:** Self-Report pp. 10-12; External Review 2, p. 4; Output List Items 40-55.

  **Findings:**
  1.  **Identity Check (Step 1):** Core assumption (single order parameter) unchanged. **Pass.**
  2.  **Immunity Test (Step 2):** One material family deviates systematically. These samples are excluded as "insufficiently characterised" (p. 11). This is a borderline Immunity Clause but common in engineering contexts. **Warning.**
  3.  **Borrowed Progress (Step 3):** Model is now written into industry specifications. High utility. However, industry adoption relies on reliability, not necessarily the truth of the "single order parameter" Core. **Mixed.**
  4.  **Novelty Audit (Step 4):** No striking novel predictions produced. Period described as "consolidation." **Zero Novel Facts.**
  5.  **Stagnation vs. Consolidation (Step 6):** The deviation in the one material family is handled by exclusion, not resolution. This fits the definition of Stagnation (anomaly avoidance) rather than Consolidation (anomaly resolution). **Fail.**
  6.  **Grace Period (Step 7):** Programme is 11 years old. Exceeds 10-year threshold for no novel facts.

  **Verdict:** **Renew with Restructuring.**

  **Written Justification for Consortium:**
  "The Panel acknowledges the high utility of the model in industrial specifications. However, scientifically, the programme has entered a degenerating phase. The exclusion of the deviating material family without independent characterization constitutes anomaly avoidance (Self-Report p.11). Furthermore, no novel factual predictions were confirmed in the review period. Renewal is granted on the condition of a Restructuring Plan that specifically targets the deviating material family with a high-risk prediction, rather than extending the model to further families where the core is already assumed."

  **Strategic Note:** This verdict balances scientific stagnation against national industrial interest. The "Restructuring" mandate forces theoretical risk-taking without defunding the utility.

  ***

  ### Programme C: Urban Infrastructure Scaling Law (Flagship)
  **Dossier Reference:** Self-Report pp. 1-3; External Review 1 & 2; Output List Items 100-150.

  **Findings:**
  1.  **Identity Check (Step 1):** Core assumption (single scaling law) unchanged. **Pass.**
  2.  **Reformulation Check (Step 5):** Three reformulations produced. Self-Report notes each is "formally equivalent" to its predecessor (p. 2). **Translational Reformulation Confirmed (Zero Theoretical Progress).**
  3.  **Immunity Test (Step 2):** Failed tests are absorbed by a clause holding the law applies "only above a network size no available dataset reaches" (p. 3). **Fail (Immunity Clause Identified).**
  4.  **Novelty Audit (Step 4):** One celebrated confirmation traced to a data-processing artefact (External Review 1, p. 3). **False Positive.**
  5.  **Borrowed Progress (Step 6):** Two spin-off programmes led by former students are producing results but have "abandoned the scaling law" (Self-Report p. 3). This indicates the progressive shift is occurring *outside* the programme's Hard Core.
  6.  **Grace Period (Step 7):** Programme is 15 years old. Exceeds 10-year threshold. No valid extension signature from previous cycles.

  **Verdict:** **Wind Down with Closure Grant.**

  **Written Justification for Consortium:**
  "The Panel finds the programme scientifically degenerating. The Core assumption has been protected by an Immunity Clause rendering it untestable with current datasets (Self-Report p.3). Theoretical outputs are Translational Reformulations without new empirical content (Self-Report p.2). The single confirmed prediction was invalidated by artefact (External Review 1, p.3). While spin-off groups are productive, they have abandoned the programme's Hard Core. Continued funding of the current structure would support a hypothesis that has been effectively abandoned by its most successful practitioners. A Closure Grant is recommended to facilitate the transition of personnel and data to the progressive spin-off initiatives."

  **Strategic Note:** This finding is robust against appeal as it cites specific dossier contradictions. If the Board overrides this due to political pressure, they must record a "Strategic Override" citing public communication value, distinct from scientific merit. The Panel recommends funding the *spin-offs* (new applications) rather than the *flagship* (old core).

  ---

  ## 4. Limitations and Biases of the Procedure

  **1. The "Long Bet" Blind Spot**
  This procedure is biased against work whose payoff is >10 years out. A programme developing a new mathematical language or a massive longitudinal dataset may show *zero* novel predictions for 15 years, then revolutionize the field in year 16. The RPVA will recommend **Wind Down** at year 15.
  *   *Mitigation:* Step 8 (Value Handoff) allows the Board to fund "Strategic Reserves," but the Panel cannot scientifically justify it. Panels should not be asked to validate long-term bets; that is a Council-level risk decision.

  **2. The Quantification Bias**
  The procedure rewards "countable" predictions (Step 4). Conceptual clarity, negative results that prevent dead-ends, and methodological rigor are harder to code as "Novel Facts." A programme that cleanly disproves a popular theory may look less "progressive" than one that mills low-risk confirmations.
  *   *Mitigation:* External Reviewers must be instructed to flag "High-Value Negative Results" in their reports for the Panel to count as Progress in Step 4.

  **3. The "Flagship" Inertia**
  As seen in Programme C, large programmes generate infrastructure and careers that make them "too big to fail." The procedure identifies the scientific degeneration but cannot force the Board to accept the **Wind Down** verdict if the political cost is deemed too high.
  *   *Mitigation:* The "Strategic Override" note in the findings ensures the scientific record remains clean even if the funding continues. This protects the Panel's integrity.

  **4. Inappropriate Application**
  Do not apply this procedure to:
  *   **Exploratory Grants (3 years):** Too short for Hard Core assessment.
  *   **Infrastructure-Only Projects:** If the goal is data collection, Step 4 (Novelty) is irrelevant. Use a utility metric instead.
  *   **Interdisciplinary Hubs:** Where the "Hard Core" is intentionally pluralistic. The Identity Check (Step 1) will fail falsely here.

  **5. The Guessing Zone**
  Distinguishing **Stagnation** from **Consolidation** (Step 6) often relies on the nuance of *why* an anomaly was excluded. If the dossier is vague, the Panel is guessing. In cases of ambiguity regarding anomaly exclusion, the benefit of the doubt goes to the consortium (Renew with Restructuring) rather than Wind Down, provided the Immunity Test (Step 2) is passed.
