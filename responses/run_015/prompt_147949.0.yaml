answer: |-
  Hey, I have been thinking about your argument ever since you sent that message, and honestly, it is the kind of thing that keeps me up at night too because you have put your finger on the exact friction point where modern primary care grinds against philosophical reality. You are right to feel that the standard definitions do not match what you actually do on a Tuesday afternoon, and your friend who studied philosophy is pointing you toward the right debate, though I think their conclusion is a bit too cynical for the nuance you are seeing in the guidelines. The practice you are describing presupposes a concept of disease that is best understood as pragmatic operationalism disguised as naturalism, and it quietly rules out strict biostatistical naturalism while only partially embracing normativism. When you look at hypertension or prediabetes, you are not identifying a natural kind like you would when identifying a virus or a fractured bone; you are identifying a risk profile that has crossed a threshold of utility for intervention. This means the strict naturalist view, something like Boorse's biostatistical theory where disease is simply value-free statistically subnormal functioning of a species-typical mechanism, cannot survive in your clinic. The reason your co-resident mentioned the reference-class-plus-dispersion problem is that it is fatal to naturalism here. For naturalism to work, you need a clear reference class of normal humans to determine what typical functioning is, but as you noted, the available population is already contaminated by treatment. If everyone is on statins or blood pressure meds, the statistical norm shifts, and you lose the biological baseline. Furthermore, nature does not provide the cut-point; the distribution of blood pressure is continuous, so picking 130 over 140 is not discovering a biological cliff but drawing a line on a slope for the sake of action. Because the line moves based on committee decisions and epidemiological data rather than a sudden change in biological mechanism, strict naturalism is ruled out because it cannot account for the arbitrariness of the threshold while maintaining that the disease entity is objective and value-free.

  However, your friend's pure normativist view that disease is just a state where benefit beats harm plus a billing code is also incomplete, though it is closer to the truth than naturalism. It is not pure values all the way down because the thresholds do track outcome data; you cannot set a hypertension threshold based solely on a show of hands because the biological risk of stroke really does increase continuously with pressure. So the practice is not strictly normativist because it is anchored in probabilistic biological reality, but it is not naturalist because the classification depends on a value judgment about when that risk warrants the label of disease. This is where the hybrid view, often associated with Wakefield's harmful dysfunction analysis, tries to step in, but it struggles in your specific examples because in a patient with a blood pressure of 132 over 82, it is hard to point to a specific mechanism that is malfunctioning. The heart and vessels are working exactly as physics dictates they would under that pressure; the dysfunction is not in the mechanism itself but in the long-term statistical probability of damage. So the hybrid view does not do much better here because it requires a dysfunction component that is often absent in these early-stage metabolic or vascular diagnoses. What actually makes sense of your daily practice is the idea that disease is a vague predicate and the guidelines are precisifications. This is not a dodge; it is a recognition that language and biology are fuzzy while action requires binary decisions. Nature provides the fuzzy slope of risk, but the healthcare system requires a binary switch to trigger protocols, insurance coverage, and quality metrics. The concept of disease you are using is therefore a tool for risk management rather than a description of ontological reality.

  If you were to take this to its logical conclusion and replace the binary disease labels with graded absolute risk, which many epidemiologists argue we should do, the changes in the clinic would be profound but structurally difficult. On a personal level, the conversation on a Tuesday afternoon would shift from authority to negotiation. Instead of saying you have hypertension and need to fix it, you would be saying your risk of a cardiovascular event is this percentage and we can lower it by this much with these specific burdens. This aligns better with shared decision-making, but it clashes with the sick role. Patients often want the legitimacy of a diagnosis to justify lifestyle changes or to excuse symptoms, and the label provides a narrative container that a raw number does not. If you drop the label, you lose the script that allows a patient to say I am sick so I must change, and you might lose their adherence because the urgency is diluted. More critically, the administrative machinery of medicine would break. Insurance coverage is built on ICD codes which require binary diagnoses; you cannot bill for a risk score easily. Quality metrics like HEDIS measures rely on denominators of diseased patients to track whether you treated them correctly. If there is no disease, there is no quality metric, and the system loses its lever to enforce standards of care. So while the science might support a risk-based model, the sociology and economics of medicine are committed to the binary disease model.

  Ultimately, the practice presupposes that disease is a institutional status assigned to a biological state when the cost of monitoring and labeling is outweighed by the potential benefit of intervention, anchored by biological risk but defined by social consensus. It rules out the idea that disease is purely a biological fact independent of human values, and it also rules out the idea that it is purely a social construct independent of biological risk. It sits in the uncomfortable middle where biology provides the gradient and society provides the cut-point. This means your co-resident who suggested the vague predicate theory was actually onto something solid, because it acknowledges that the fuzziness is in the world but the precision is in our language and systems. You are not failing to find the biological reality of prediabetes; you are successfully navigating a system that requires you to treat a continuous variable as a binary state for practical reasons. The tension you feel is not a failure of your understanding but a correct perception of the category error we commit every day to make the healthcare system function. We treat the map as the territory because we need to navigate, even though we know the terrain is actually smooth and the lines are drawn in ink. So when you argue with your co-residents, you can tell them that naturalism fails because the reference class is gone, normativism fails because the risk is real, and the hybrid view fails because the dysfunction is absent. What remains is a pragmatic constructivism where disease is a flag we plant on a landscape of risk to tell us where to stand, and while the flag can move depending on who is planting it, the landscape underneath is real enough to hurt us if we ignore it.
