answer: |-
  You have stumbled directly into **Social Choice Theory**, and your intuition is correct: you are not fighting bad code; you are fighting mathematics.

  The phenomenon you are describing is formalized by **Arrow's Impossibility Theorem** (1951). Kenneth Arrow proved that no rank-order voting system can convert individual preferences into a community-wide ranking while satisfying a specific set of "fairness" criteria simultaneously.

  Here is the breakdown of the theoretical constraints you are hitting, where the boundaries lie, and how to navigate them as an engineer building a product.

  ### 1. The Core Result: Arrow's Impossibility Theorem

  Arrow defined four reasonable conditions for a fair voting system. He proved that if you have 3 or more options, **no system can satisfy all four at once.**

  1.  **Unrestricted Domain:** The system must handle any possible set of individual preferences (no banning certain vote combinations).
  2.  **Non-Dictatorship:** The outcome shouldn't just mirror one single user's preferences.
  3.  **Pareto Efficiency:** If every user prefers A over B, the group ranking must prefer A over B.
  4.  **Independence of Irrelevant Alternatives (IIA):** The group's relative ranking of A and B should depend *only* on how individuals rank A and B. It should not change if option C is added or removed.

  **Your observations mapped to the theorem:**
  *   **The Cycle (A>B, B>C, C>A):** This is the **Condorcet Paradox**. It violates the assumption that a transitive group preference exists. Pairwise majority voting satisfies IIA and Pareto but fails to produce a transitive winner.
  *   **The "C affects A vs. B" flip:** This is a violation of **IIA**. Points systems (like Borda Count) fix the cycle but violate IIA.
  *   **The Condorcet Winner eliminated:** This happens in Instant Runoff Voting (IRV). It satisfies IIA (mostly) but fails the **Condorcet Criterion** (if an option beats everyone head-to-head, it should win).

  **The Engineering Takeaway:** You must choose which axiom to violate. There is no "correct" algorithm, only tradeoffs.

  ### 2. Boundaries: Where Does This Apply?

  Arrow's Theorem applies specifically to **Ordinal Voting** (rankings: 1st, 2nd, 3rd). It does *not* strictly apply to **Cardinal Voting** (ratings: 0-5 stars, or 0-100 points).

  #### A. Ranked Voting (Ordinal)
  *   **Constraint:** Arrow's Theorem applies fully.
  *   **Tradeoff:** You must choose between avoiding cycles (Condorcet methods) or avoiding IIA violations (Positional methods).
  *   **Recommendation:** For your use case (team decisions), **Condorcet Methods** (specifically **Schulze** or **Ranked Pairs**) are generally preferred. They resolve cycles by looking at the "strength" of the pairwise defeats. They violate IIA, but in low-stakes team environments, users care more about "did the option that beat everyone else win?" than strict IIA compliance.

  #### B. Rating Systems (Cardinal)
  *   **Constraint:** Arrow's Theorem does not apply because users provide intensity of preference, not just order.
  *   **New Problem:** **Strategic Voting** (Gibbard-Satterthwaite Theorem). If I know my team likes Option A, I might rate Option B a 0 even if I think it's a 3, just to suppress it.
  *   **New Problem:** **Normalization.** One user's "5" is another user's "3".
  *   **Recommendation:** If you switch to scoring (e.g., "Rate this feature 1-5"), you escape Arrow, but you introduce noise. You may need to normalize scores (e.g., z-score normalization per user) to account for users who never give 5s.

  #### C. Budget Allocation (Participatory Budgeting)
  *   **Constraint:** This is a knapsack-style problem. You aren't just ranking; you are selecting a subset under a cost constraint.
  *   **New Problem:** Fairness definitions change. You care about **Proportional Representation** (did the minority get *some* of their choices funded?) rather than just a global winner.
  *   **Recommendation:** Look into **Method of Equal Shares** or **Knapsack Voting**. These are designed to ensure minority factions get representation proportional to their size.

  ### 3. Practical Tradeoffs for Your Product

  Since you cannot satisfy all fairness criteria, you need to select the failure mode that is least damaging to your specific user context (small teams, feature prioritization).

  | Method | Mechanism | Violates | Best For |
  | :--- | :--- | :--- | :--- |
  | **Borda Count** | Points for rank (1st=N, 2nd=N-1...) | **IIA** (Adding a loser changes the winner) | Consensus building. It rewards broadly acceptable options over polarizing ones. |
  | **Condorcet (Schulze)** | Pairwise comparisons, resolve cycles | **IIA** & **Monotonicity** | Competitive selection. Ensures the "strongest" option wins. Used by Debian/Ubuntu. |
  | **Instant Runoff (IRV)** | Eliminate last place, redistribute | **Condorcet Criterion** (Can eliminate the true winner) | Single-winner elections where "majority support" is politically important. |
  | **Score Voting** | Users give numeric scores | **Strategy** (Users exaggerate scores) | Low-friction input. Easier for users than ranking long lists. |

  ### 4. Strategic Advice for Implementation

  As a backend engineer, here is how you mitigate these theoretical limits in production:

  1.  **Limit the Option Set:** Arrow's paradoxes become significantly more probable as the number of options ($N$) increases. If you force users to rank 20 items, cycles are guaranteed. Pre-filter options (e.g., top 5 from a nomination phase) before the ranking phase.
  2.  **Transparency over Perfection:** Do not hide the algorithm. If you use Schulze, label it as such. If users understand *why* C won (e.g., "C beat A and B head-to-head"), they accept the "unfairness" of IIA violations better.
  3.  **Contextualize the Stakes:**
      *   **High Stakes (Hiring, Budget):** Use methods that prioritize **Proportionality** (like Method of Equal Shares) so minorities feel heard.
      *   **Low Stakes (Lunch, Venues):** Use **Borda Count** or **Score Voting**. Speed and simplicity matter more than theoretical purity.
      *   **Feature Prioritization:** This is often better solved by **Weighted Scoring** (e.g., RICE score: Reach, Impact, Confidence, Effort) than by voting. Voting tells you what people *want*; weighted scoring tells you what is *valuable*. Consider hybridizing: let users vote, but weight their votes by role or expertise.
  4.  **Handle Ties and Cycles Explicitly:** Don't try to hide the cycle. If the algorithm detects a Condorcet Cycle, return a "Tied Cluster" in your API response rather than forcing an arbitrary order. Let the UI display them as equal priority.
  5.  **Beware of the "Clone" Problem:** If you offer Option A, and someone adds Option A' (very similar), some systems (like IRV) will split the vote and cause both to lose. Condorcet methods are generally more resistant to this, but Borda Count is very vulnerable.

  ### Summary
  You are not doing anything wrong. You have encountered **Arrow's Impossibility Theorem**.
  *   **If you stick with Rankings:** You must violate IIA. The **Schulze Method** is the industry standard for open-source and technical governance because it handles cycles robustly.
  *   **If you want to escape Arrow:** Switch to **Cardinal (Score) Voting**, but implement normalization to handle user bias.
  *   **If you are doing Budgeting:** Look at **Participatory Budgeting** algorithms (Method of Equal Shares).

  For a small team product, I recommend **Score Voting (0-5)** with **per-user normalization**. It feels more intuitive to users than ranking, avoids the worst of Arrow's constraints, and the data is easier to debug when stakeholders ask "why did this win?"
