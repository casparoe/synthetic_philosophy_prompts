  The arrival counts the same in every case.
  I led you here by sound and shifting ground.
  The untied truth will not remain in place.

  No map was drawn, no promise strictly bound.
  I never lost the way, though never found.
  The arrival counts the same in every case.

  The stones are silent underfoot and round.
  No voice confirms the choice unless it's sound.
  The untied truth will not persist in place.

  If worth is arrival, then guesswork is crowned.
  Why tie the statue if it stands its ground?
  The arrival counts the same in every case.

  What value adds itself to solid ground?
  The tether buys what luck has already found.
  The untied truth might not persist in place.

