answer: |-
  Dear Colleague,

  The insolvency practice you describe invites three distinct interpretations, and distinguishing between them clarifies the normative architecture of bankruptcy law. First, one might view pro rata distribution as a pragmatic focal point, an arbitrary rule chosen merely to coordinate expectations and minimize litigation costs. Second, one could read it through the lens of the Kalai–Smorodinsky solution, suggesting the choice of claim as the denominator is an accident that only coincides with equal relative concession when no single claim exceeds the whole estate. Third, and most plausibly, the practice presupposes that fairness requires equal relative sacrifice measured against the ex-ante entitlement, not the ex-post feasible maximum.

  The pragmatic reading fails because the rule is not treated as arbitrary by the courts; it persists even when it yields results that seem inefficient compared to equal division. It is defended as a matter of right, not convenience. The Kalai–Smorodinsky reading is more tempting because it aligns with bargaining intuition, treating the estate as a surplus to be divided according to bargaining power defined by feasible maxima. However, what tells against this is that insolvency law explicitly caps recovery at the claim amount. If the claim were merely a ceiling, the law would treat the feasible maximum as the normative baseline for fairness. Instead, the law treats the claim as the right that is being partially frustrated. The divergence between the claim and the ceiling in insolvency is precisely where the moral question lies, and the law answers it by prioritizing the claim.

  Therefore, the choice of the claim as the denominator is essential. It reflects a view that creditors should bear a burden proportional to what was at stake for them in the contract, rather than proportional to what they could have claimed given the scarcity of the estate. The practice is not underdetermined; while multiple theories might license pro rata in solvent scenarios, only the equal-relative-claim-loss theory sustains it in insolvency. This sits comfortably with the law's insistence that nobody may recover more than the full amount of their claim. The ceiling confirms that the claim is the maximum right; distributing pro rata ensures that the violation of that right is uniform across all rights-holders. To use the feasible maximum as the denominator would be to allow the scarcity of the estate to redefine the size of the right itself.

  If we adopted the Kalai–Smorodinsky idea seriously, we would shift from a rights-based framework to a power-based one. Small creditors would gain disproportionately because their feasible maximum is capped by their claim, not the estate, while large creditors would suffer a deeper relative loss. Large creditors would effectively subsidize small ones simply due to the geometry of scarcity. Bankruptcy institutions would likely resist this because it undermines the predictability of credit risk. Lenders price loans based on claim priority and size; changing the distribution rule to depend on the aggregate estate size relative to other claims introduces unpriceable uncertainty. Thus, the current practice is not a mistake but a commitment to the sanctity of the claim as the measure of moral stake, ensuring that the burden of insolvency is shared according to the size of the promise broken, not the size of the pot available.

  Yours,

  A. Philosopher
