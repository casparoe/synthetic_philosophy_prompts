          *   Causal Transparency? **No.** (This is the key). The tokens for the proof do not causally depend on the tokens for the justification in a way that allows error correction based on the justification. *However*, Chain of Thought (CoT) changes this. If the LLM generates reasons *before* the answer, it gets closer.
