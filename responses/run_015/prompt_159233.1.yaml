              *   *Refined Principle:* Comprehension requires that the justification is **causally efficacious for learning**. If you tell the Grandmaster "That move violates principle X," they update. If you tell the LLM "That proof violates logic X," it apologizes but might repeat the error in a new context unless fine-tuned. *Wait, LLMs do learn from context.*
              *   *Better distinction:* **Internal State Alignment.** In the GM, the intuitive move and the verbal reason share neural substrate. In the LLM, the output tokens are probabilistic predictions.
