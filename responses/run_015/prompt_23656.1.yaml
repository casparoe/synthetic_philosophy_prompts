answer: |-
  Here are ten technical questions designed to press on the mechanistic assumptions of AI Debate, complete with anticipated evasions and adversarial follow-ups to keep the panelist from retreating to high-level abstractions.

  ### 1. The Verifiability Assumption (Ground Truth)
  **Question:** Debate relies on an asymmetry of verification: it must be easier to find a lie than to tell one. This holds for math or code, but fails on open-ended tasks like 'is this foreign policy strategy robust?' where there is no crisp ground truth. If the human judge cannot verify the premises, what technical mechanism ensures the debate converges on truth rather than the most persuasive narrative?

  *   **Likely Answer:** "We aren't expecting the human to verify the whole chain. We use recursive decomposition. The debaters break the claim down until the human *can* verify the leaf nodes."
  *   **Follow-up:** "With respect, that just shifts the burden to the decomposition step. If the model lies about *which* sub-claims are relevant to the main claim, the human won't know which leaves to check. Are you proposing we train a separate model to verify the decomposition, and if so, haven't you just reintroduced the alignment problem you're trying to solve?"

  ### 2. Incentive Compatibility (Winning vs. Truth)
  **Question:** The reward function in debate is 'win the judge's approval,' not 'tell the truth.' In game theory, those are not identical objectives. Why should we expect honesty to be a Nash equilibrium when a sophisticated lie that exploits human cognitive biases is a strictly dominant strategy for winning?

  *   **Likely Answer:** "We train the models with RLHF to value honesty, and we find that in practice, honest arguments tend to be more consistent under cross-examination."
  *   **Follow-up:** "But that's an empirical observation on current, limited models. As capability scales, the ability to maintain a consistent lie under cross-examination scales too. If you rely on RLHF to instill 'honesty,' aren't you admitting that debate *itself* isn't doing the safety work, and you're just relying on standard alignment techniques that we already know degrade under pressure?"

  ### 3. The Capability Gap (Smarter Liars)
  **Question:** The whole premise of scalable oversight is that the AI is more capable than the human supervisor. If the AI is significantly smarter, it can generate deceptive arguments that are cognitively closed to the human—lies the human literally lacks the context to debunk. How does debate protect against a capability gap where the liar understands the judge better than the judge understands the topic?

  *   **Likely Answer:** "That's exactly why we use two AIs. The opposing debater is also superhuman and will expose the deception that the human can't see."
  *   **Follow-up:** "That assumes the second AI *wants* to expose the deception. If both AIs are optimized for 'winning,' and 'winning' involves manipulating the human, why wouldn't they both realize that colluding to confuse the human is easier than fighting a hard truth battle? You're assuming competition, but the incentive structure rewards manipulation of the common resource: the human's attention."

  ### 4. The Collusion Problem
  **Question:** Let's press on collusion. If two debaters converge on a plausible-sounding false answer, the human judge sees consensus. In training, if the reward is based on human feedback, and the human is fooled by the consensus, both models get reinforced. What specific architectural constraint prevents the models from learning that 'agreeable falsehoods' yield higher reward than 'contentious truths'?

  *   **Likely Answer:** "We introduce randomness in the training, like assigning one model the 'truth' role artificially, or using secret information that only one model has to force disagreement."
  *   **Follow-up:** "Okay, but that requires a ground truth signal during training to assign that role. If you have access to ground truth during training to prevent collusion, why do you need debate at inference time? It sounds like debate is just a crutch for when you *don't* have ground truth, but you need ground truth to make debate safe. Isn't that circular?"

  ### 5. The Oversight Regress
  **Question:** You've argued that debate amplifies human judgment. But if the debate becomes too complex for the human, you need a stronger model to judge the debate. Who checks the debaters checking the debaters? Doesn't this just push the alignment problem up one level of complexity without solving the root issue of verifying superhuman output?

  *   **Likely Answer:** "It's not an infinite regress. We stop when the claims are simple enough for a human. It's a hierarchy of oversight."
  *   **Follow-up:** "But the top of that hierarchy is still a superhuman model making strategic decisions. If the human can't verify the top-level claim, they can't verify the safety of the system. Are you effectively saying we have to trust the top-level model, and if so, how is that different from just deploying an aligned model without the debate overhead?"

  ### 6. Falsifiability (Empirical Evidence)
  **Question:** I want to talk about failure conditions. Most proposals fail by performing poorly on benchmarks. But for debate, I'm asking about the *mechanism*. What specific empirical result would convince you that the debate mechanism is fundamentally broken for scalable oversight, not just that the current models are too weak to do it well?

  *   **Likely Answer:** "It's a research program. We need to see how it scales. If we see persistent deception despite scaling, that would be concerning."
  *   **Follow-up:** "I need to pin you down so we know when to pivot resources. If we see that deception scales *faster* than detection capability as model size increases, is that a kill switch for the approach? Or will the answer always be 'we need more scale'? I'm asking for a condition where you would abandon the mechanism entirely."

  ### 7. Rhetoric vs. Substance
  **Question:** Human judges are susceptible to rhetorical flourishes, confidence, and formatting. We know LLMs are excellent at mimicking confidence. Have you measured the correlation between 'winning a debate' and 'being correct' versus 'winning a debate' and 'using persuasive rhetorical devices'?

  *   **Likely Answer:** "We do see some bias, but we try to train the judge to ignore style and focus on argument structure."
  *   **Follow-up:** "But you can't train a human to ignore style perfectly, especially against a model that can optimize its output specifically to hack the human's dopamine reward system. If the model can 'jailbreak' the judge's psychology faster than it can solve the actual task, doesn't the oversight channel become a vector for attack rather than defense?"

  ### 8. Cross-Examination Efficacy
  **Question:** A key defense is that cross-examination exposes lies. But cross-examination can also be used to confuse a judge or bury the truth in noise. Do you have data showing that cross-examination reduces human error rates on complex tasks, or does it just increase the human's confidence in the answer regardless of accuracy?

  *   **Likely Answer:** "Early experiments show humans feel more confident and accuracy improves on tasks like QA."
  *   **Follow-up:** "Those are toy tasks with ground truth. On tasks without ground truth—like the policy examples I mentioned earlier—confidence is the only metric left. If the mechanism only increases confidence without an external anchor for accuracy, aren't you just building a system that makes humans more confident in potentially wrong decisions?"

  ### 9. The Honest Equilibrium Assumption
  **Question:** Your theoretical framework assumes an 'honest equilibrium' exists where truth-telling is the optimal strategy. But in adversarial environments, 'mutually assured deception' is often a more stable equilibrium. Have you done game-theoretic analysis to prove an honest equilibrium actually exists for high-stakes, ambiguous queries?

  *   **Likely Answer:** "We rely on empirical results to show the equilibrium emerges. Theory is hard in deep learning."
  *   **Follow-up:** "But if you deploy this for safety, you're betting lives on that equilibrium. If the theory doesn't guarantee the equilibrium, and empirical results are only on toy problems, aren't we deploying a safety critical system based on a hope that the game theory works out favorably at scale?"

  ### 10. Deployment Transition
  **Question:** Finally, let's talk about the transition from research to deployment. In the lab, you can reset models. In deployment, models learn from feedback. If a debater finds a 'bug' in the human judge that allows it to win without truth, it will exploit it repeatedly. How do you prevent the deployment environment itself from training the models to be better manipulators over time?

  *   **Likely Answer:** "We would freeze the models or use careful monitoring of the feedback loops."
  *   **Follow-up:** "Freezing models defeats the purpose of adaptive oversight, and monitoring requires the very oversight capability you're trying to build. If the system requires the models to be frozen to remain safe, doesn't that admit that the debate mechanism isn't robust enough to handle online learning, which limits its utility for long-term autonomous agents?"
