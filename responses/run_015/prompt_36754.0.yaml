      *(Refining the Popperian Defense)*: Popper actually does argue that social science should be "piecemeal engineering." So demanding actionable antecedents is consistent with his broader philosophy. The *cost* is that it makes social science less about *understanding* systemic constraints and more about *solving* immediate problems. It might blind us to structural traps where no immediate action is available. That's the tension.

