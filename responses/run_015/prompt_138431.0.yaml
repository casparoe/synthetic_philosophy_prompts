answer: |-
  ### 1. Examination Question

  **Question 4: Path Dependence and Counterfactuals (25 Marks)**

  **Case: The Valdanian Gauge**
  In 1891, the railway commission of the Republic of Valdania chose a track gauge of 1.42 metres. All four neighbours had standardised on 1.60 metres. The commission split five to four; the decisive vote came from Commissioner Oreste Baldi, whose family's rolling-stock works was already tooled for 1.42 metres. The commission's engineering report had recommended 1.60 metres, noting the wider gauge permitted larger wagons and greater stability, worth roughly 5% per tonne-kilometre. The network grew to 19,000 kilometres over the next eighty years.

  Today, the annual cost of the mismatch is estimated at 0.2% of GDP in transshipment at border crossings (contracts for which are largely held by legacy firms descended from Baldi's partners) plus 0.3% of GDP in forgone engineering efficiency on all traffic. Complete regauging would cost 4% of GDP in one-off capital spending and require an eight-year transition during which roughly a third of freight capacity is unavailable, at a cost of about 0.8% of GDP per year.

  Two comparators: Sorrentia began with a parochial 1.40-metre gauge in 1872 but converted to 1.60 metres in 1919 after a war destroyed a third of its track. The island of Kalo built no railways until 1952 and adopted 1.60 metres from the outset. A minority of economic historians argue Valdanian bridges and tunnels could not have carried the wider loading gauge in 1891, making 1.42 metres locally correct at the time; the inferiority only emerged after steel bridges became standard around 1930.

  **Instructions**
  Using the Valdania case, answer the following:

  1.  Apply the following three counterfactual distinctions to the case. Do not merely define them; show how they yield different diagnostic results here:
      *   The *swap counterfactual* (replace one named event with its single most likely alternative, hold sequence fixed).
      *   The *resampling counterfactual* (redraw accidents from the distribution of that kind; ask probability of outcome recurrence).
      *   The *pressure counterfactual* (hold functional/economic pressures fixed, vary accidents; test outcome invariance).
  2.  Evaluate the claim that "Valdanian history is locked in." In doing so, you must distinguish between sensitivity to early events, persistence against perturbation, and normative inefficiency.
  3.  Address the problem of the "grain of description" (i.e., would the same outcome have arrived anyway?). You are not permitted to answer that "it depends on the description." You must state what fixes the appropriate grain of description for this explanatory problem and why.

  *No citations or external literature recall are expected or permitted. Rely solely on the logic provided in the seminar framework and the case above.*

  ***

  ### 2. Model Answer

  The Valdania case illustrates why path dependence is not a single claim but a conjunction of three distinct propositions: sensitivity, persistence, and inefficiency. Applying the three counterfactuals reveals that these propositions come apart in this instance.

  The *swap counterfactual* asks: if Baldi had voted according to the engineering report (1.60m), would the outcome change? Holding the rest of the sequence fixed, the vote would have failed 5-4 in favour of the wider gauge. This establishes **sensitivity**: the specific outcome (1.42m) hinges on a singular, contingent event. However, sensitivity alone does not prove path dependence; it merely proves contingency.

  The *resampling counterfactual* asks: if we redraw the accidents of 1891 (e.g., different commissioners, slight variations in lobbying), how often does 1.42m recur? Given the 5-4 split, the probability is near 50%. This suggests the outcome was not highly probable, reinforcing sensitivity. However, the *pressure counterfactual* provides the crucial test for **persistence** (lock-in). Here, we hold functional pressures (trade with neighbours, engineering efficiency) fixed and vary the accidents. If the network were small, market pressure might have forced convergence to the regional 1.60m standard. But at 19,000km, the switching costs create a range of perturbation sizes to which the system is immune. The system is not "permanently" locked, as Sorrentia shows; it is locked only against perturbations smaller than a major war or total reconstruction. Thus, "lock-in" is correctly understood not as permanence, but as resistance to a specific range of shocks. Valdania is locked in against economic pressure, but not against catastrophic physical destruction.

  This leads to the third claim: **inefficiency**. The prompt requires us to assess whether the outcome is worse than a remediable alternative. The arithmetic is finely balanced. The annual loss is 0.5% of GDP. The switching cost is 4% capital plus 6.4% transition loss (0.8% × 8 years), totaling 10.4% of GDP. The break-even discount rate is approximately 4.8% (0.5/10.4). If the social discount rate exceeds 5%, staying is economically rational; if it is lower, switching is efficient. A candidate asserting plain inefficiency fails the arithmetic test. Furthermore, we must distinguish deadweight loss from transfers. The 0.2% transshipment cost flows to legacy firms (Baldi's descendants); this is a distributional transfer, not a social loss. Only the 0.3% engineering inefficiency is pure deadweight loss. This reduces the benefit of switching, making the NPV case for regauging even weaker. Therefore, the normative claim of "remediable inefficiency" is the hardest to establish and, here, remains ambiguous.

  Finally, regarding the **grain of description**: asking "would railways have been built anyway?" evades the issue. If we describe the outcome as "a national rail network," the outcome is invariant (Kalo and Valdania both have networks). If we describe it as "a 1.42m gauge," it is contingent. We cannot simply say "it depends." The grain is fixed by the **explanatory interest**. Since the puzzle is why an *inefficient standard* persists despite regional harmonisation pressures, the relevant outcome description is the *specific technical standard*, not the general function. The explanation must account for the specific configuration that carries the efficiency cost. If we broaden the grain to "rail transport," the path dependence claim vanishes, but so does the explanatory problem.

  In conclusion, Valdania exhibits sensitivity (Swap) and resistance to economic perturbation (Pressure), but the claim of inefficiency is undermined by the NPV balance and the transfer component. History is "locked in" only relative to shocks smaller than Sorrentia's war.

  **Critique of Reasoning**
  The weakest step in this analysis is the acceptance of the 1891 engineering report as proof of ex ante inefficiency. If the minority historians are correct that bridges could not support 1.60m in 1891, the choice was locally rational at the time. This separates ex ante rationality from ex post inefficiency. If the 1891 choice was technically constrained, the "inefficiency" arose from technological change (steel bridges), not merely from the lock-in of an initial error. This would convert the case from one of political failure (Baldi's vote) to one of technological obsolescence, fundamentally altering the normative verdict.

  ***

  ### 3. Marking Scheme (25 Marks)

  **A. Application of Counterfactuals (9 Marks)**
  *   **Swap Counterfactual (3 marks):** Correctly identifies Baldi's vote as the pivot. Must conclude this proves *sensitivity* but not necessarily lock-in.
      *   *Common Error:* Treating the vote as proof of inefficiency rather than contingency.
  *   **Resampling Counterfactual (3 marks):** Uses the 5-4 split to estimate probability (~50%). Must note this reinforces sensitivity.
      *   *Common Error:* Ignoring the probability implication or conflating it with the Swap.
  *   **Pressure Counterfactual (3 marks):** Uses Sorrentia/Valdania comparison to define lock-in as resistance to *economic* pressure but vulnerability to *catastrophic* shock.
      *   *Common Error:* Claiming Sorrentia refutes lock-in entirely, rather than defining the shock threshold.

  **B. Separation of Claims (9 Marks)**
  *   **Sensitivity vs. Persistence (4 marks):** Explicitly distinguishes that sensitivity (Swap) does not guarantee persistence (Pressure). Persistence is defined as resistance to a range of perturbations, not eternity.
      *   *A vs. B:* A grades recognise lock-in as relative to shock size (Sorrentia); B grades treat it as binary/permanent.
  *   **Persistence vs. Inefficiency (5 marks):** Uses the NPV arithmetic (10.4% cost vs 0.5% benefit) to show inefficiency is not automatic. Distinguishes transfer (0.2% to Baldi heirs) from deadweight loss (0.3%).
      *   *Common Error:* Asserting switching is obviously worthwhile or ignoring the transfer component.
      *   *A vs. B:* A grades calculate the break-even discount rate (~4.8%) or explicitly weigh the transfer; B grades assert inefficiency qualitatively.

  **C. Grain of Description (4 Marks)**
  *   **Fixing the Grain (4 marks):** Must reject "it depends" evasion. Must state that the *explanatory interest* (the puzzle of the inefficient standard) fixes the grain at the *specific gauge*, not the general network.
      *   *Common Error:* Stating that the outcome description is arbitrary or relative without fixing it for the purpose of the argument.

  **D. Self-Critique Paragraph (3 Marks)**
  *   **Identification of Weakness (3 marks):** Must identify the ex ante feasibility claim (bridges/tunnels in 1891) or the transfer definition as the pivot point. Must explain how this finding changes the verdict (from political failure to technical constraint).
      *   *Common Error:* Vague humility ("more data is needed") without specifying *which* data changes the logic.

  **Total: 25 Marks**

  **Grade Boundaries:**
  *   **A (20-25):** Hits all must-hit points. NPV arithmetic is acknowledged as balanced. Grain is fixed by explanatory interest. Self-critique identifies a specific logical vulnerability.
  *   **B (15-19):** Applies counterfactuals correctly but treats lock-in as binary. Misses the transfer/deadweight distinction or the NPV balance. Grain description is evasive ("depends on perspective").
  *   **C (10-14):** Recites definitions without application. Conflates sensitivity with inefficiency. Fails to use Sorrentia/Kalo effectively.
