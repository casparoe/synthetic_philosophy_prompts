prompt: |-
  I sit on the governance group at a company that deploys LLM agents to take actions inside our own operations systems: issuing refunds up to a cap, changing vendor bank details, granting short-term access to internal tools, closing out support tickets. The sign-off procedure has been built up over two years and has four features I want to lay out precisely, because I think at least two of them pull in opposite directions. First, the agent has to decompose any action into a chain of short steps, and each step is graded in isolation by an ops reviewer with no ML background who cannot see the steps before or after it and is never shown how the action turned out; internally we call this the sealed-step rule. Second, a reviewer who cannot tell whether a step is acceptable marks it unverifiable rather than wrong, and unverifiable does not block: the action goes ahead as long as no single step is marked wrong. Third, reviewers are told in writing that they will not be penalised if an approved action later causes an incident and will not be credited if it turns out to save the company money. Fourth, the agents are trained only on outcomes — the reward signal comes from whether the task finished successfully, never from whether the individual steps were good, on the stated grounds that grading steps would push the model toward reasoning that looks like ours rather than reasoning that works. And yet we require the models to emit step-by-step reasoning at deployment, we retain those traces, and when something goes wrong the first thing everyone does is read the trace to work out what the system was doing. The quarterly bonus for the whole group, reviewers included, is computed from outcome numbers: incident counts, refund error rates, tickets closed.

  What puzzles me is that the same package seems to insist, in one place, that outcomes are irrelevant to assessing a person's judgement, and, in another place, that outcomes are exactly what we reward and what we learn from; and it insists that the reasoning trace is not a fit object of supervision while treating it as the primary object of diagnosis. A colleague in platform engineering says the sealed-step rule is security theatre and that we should just measure end results; someone in legal says the opposite, that if we ever graded outcomes we would be punishing reviewers for luck. I would like the implicit theory of the whole thing written out rather than a verdict on who is right.

  So: what does a practice like this presuppose? I am interested in at least the following, but do not feel bound by my framing. (i) The sealed-step rule looks like it presupposes that a competent verdict on an action can be assembled out of verdicts on locally checkable pieces, and that error in those pieces is independent enough that local approval is real evidence about the whole. What is that commitment called in epistemology, and what does someone who holds that justification is holistic — that one mistaken framing can make every step individually plausible and the whole action disastrous — have to say about it? Is the rule strictly committed to the independence claim, or could it survive without it? (ii) Treating unverifiable as non-blocking looks like it presupposes something about the asymmetry between acting and not acting, or about where the burden of proof sits when a weaker party is checking a stronger one. Is there a defensible principle here, or is it risk appetite with a procedure bolted on? (iii) Refusing to score steps in training while reading traces after an incident looks like it presupposes that the trace reliably indicates what produced the action, even though nothing in training ever rewarded it for doing so. Is that a commitment anyone should want to defend, or can the incident-review practice be run on a thinner, purely diagnostic reading of what traces are? (iv) Is the outcome blindness for step-graders genuinely inconsistent with outcome-based bonuses, or can the package be split — say, by treating the sealed-step rule as a device for gathering evidence and the bonus as a device for aligning incentives — and if it can be split, what does each half then presuppose on its own?

  Please distinguish what the practice strictly presupposes from what it merely sits well with, and tell me which rival views would license the same four rules for entirely different reasons. Then say concretely what would have to change if each presupposition were dropped: what a policy built on outcome-only supervision would look like at our scale, what one built on process-only supervision would look like, and where each would break given that our reviewers are weaker than the systems they review, that some of our tasks are far easier to check than to perform, and that a reviewer who simply abstains is, under our current rules, functionally indistinguishable from one who approves.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Context:** The user sits on a governance group for a company deploying LLM agents for operational tasks (refunds, vendor details, access, tickets).
      *   **The System:** Four specific features of the current sign-off procedure:
          1.  *Sealed-Step Rule:* Agents decompose actions; reviewers grade steps in isolation (blind to context/outcome).
          2.  *Unverifiable is Non-Blocking:* "Unverifiable" $\neq$ "Wrong". Action proceeds unless a step is explicitly "Wrong".
          3.  *Reviewer Immunity:* Reviewers aren't penalized/credited for outcomes (outcome blindness for individuals).
          4.  *Outcome-Only Training vs. Trace Diagnosis:* Agents trained on outcomes, but traces are retained and used for post-incident diagnosis. Bonuses are outcome-based.
      *   **The Tension:** The user sees contradictions (outcomes irrelevant for judgment vs. outcomes rewarded; traces useless for training vs. traces vital for diagnosis). Colleagues disagree (Security Theatre vs. Luck Punishment).
      *   **The Goal:** Write out the *implicit theory* of the whole system, not a verdict on who is right.
      *   **Specific Questions to Address:**
          *   (i) Epistemological commitment of the sealed-step rule (atomism vs. holism).
          *   (ii) The principle behind "unverifiable is non-blocking" (asymmetry/burden of proof).
          *   (iii) The commitment regarding traces (diagnostic reliability vs. training irrelevance).
          *   (iv) Consistency of outcome blindness vs. outcome bonuses (evidence gathering vs. incentive alignment).
      *   **Requirements:** Distinguish strict presuppositions from mere compatibility. Identify rival views licensing the same rules. Describe concrete changes if presuppositions were dropped (outcome-only vs. process-only policies). Acknowledge constraints (reviewers weaker than systems, checking harder than doing, abstention $\approx$ approval).

  2.  **Analyze the Four Features & Underlying Theory:**

      *   *Feature 1 (Sealed-Step):* This is **Procedural Atomism**. It assumes safety is compositional. If $A \to B \to C$ and $A, B, C$ are safe, then $A \to B \to C$ is safe.
      *   *Feature 2 (Unverifiable $\neq$ Wrong):* This is **Default to Action (Presumption of Competence)**. It shifts the burden of proof to the blocker. It assumes inaction has a cost (opportunity cost) comparable to or higher than the risk of error, or that the system is robust enough to handle "unknowns."
      *   *Feature 3 (Reviewer Immunity):* This is **Process Accountability**. You are responsible for following the protocol, not the result. This protects against hindsight bias and "resulting."
      *   *Feature 4 (Outcome Training / Trace Diagnosis / Outcome Bonus):* This is **Pragmatic Instrumentalism**. We want the black box to work (outcome training), we need to know why it broke when it does (trace diagnosis), and we want the humans to care about the bottom line (outcome bonus).

  3.  **Address Specific Question (i): Epistemology of Sealed-Step:**

      *   *Commitment:* **Epistemic Atomism** or **Compositional Justification**. It assumes local validity implies global validity.
      *   *Holistic Critique:* A holistic epistemologist (e.g., Quinean, or systems thinker) would argue context determines meaning. A step looks safe in isolation but is dangerous in sequence (e.g., "Verify ID" then "Grant Access" vs. "Grant Access" then "Verify ID").
      *   *Survival without Independence:* The rule *strictly* requires independence of *validation*, but not necessarily independence of *effect*. However, if effects are highly interdependent, local validation is useless. To survive without strict independence, the "steps" must be defined as *state transitions* that are idempotent or sandboxed, not just semantic chunks.

  4.  **Address Specific Question (ii): Unverifiable is Non-Blocking:**

      *   *Principle:* **Presumption of Liberty/Action** or **Asymmetric Error Costs**. It assumes False Negatives (blocking a good action) are costlier than False Positives (allowing a risky action), *provided* no explicit "Wrong" flag is raised.
      *   *Risk Appetite:* It's not just risk appetite; it's a specific view on **Bureaucratic Friction**. It assumes the reviewer is a filter, not a gatekeeper.
      *   *Defense:* If reviewers are weaker than the system, they will frequently be unsure. If "Unsure" blocks, the system halts. Therefore, "Unsure" must pass to maintain throughput, relying on the system's robustness to catch actual errors.

  5.  **Address Specific Question (iii): Traces (Training vs. Diagnosis):**

      *   *Commitment:* **Explanatory Realism**. It assumes the trace *correlates* with the causal mechanism, even if not *optimized* for it.
      *   *Thinner Reading:* We don't need the trace to be the *cause*, just a **forensic artifact**. Like a black box on a plane. It doesn't need to be trained to be useful for post-mortem.
      *   *Defense:* You can defend this. Training on traces causes **Goodhart's Law** (model optimizes for looking good, not being good). Using traces for diagnosis assumes they are a log of internal state, not necessarily a rational argument.

  6.  **Address Specific Question (iv): Outcome Blindness vs. Outcome Bonuses:**

      *   *Consistency:* It is **Role-Separated Consistency**.
          *   *Reviewers (Process):* Shielded from outcome variance (luck) to ensure consistent application of rules.
          *   *Group (System):* Rewarded on outcomes to align with company goals.
      *   *Split:*
          *   *Sealed-Step:* Evidence gathering (Is the protocol followed?).
          *   *Bonus:* Incentive alignment (Do we care if the ship sinks?).
      *   *Presupposition:* The system assumes individual variance in outcomes is mostly noise (luck), but aggregate variance is signal (system performance).

  7.  **Rival Views Licensing the Same Rules:**

      *   *View A (Safety Engineering):* The rules are about **Defense in Depth**. Sealed steps are checksums.
      *   *View B (Legal/Compliance):* The rules are about **Auditability**. We need a paper trail that shows due diligence, regardless of efficacy.
      *   *View C (ML Engineering):* The rules are about **Data Hygiene**. Don't contaminate the reward signal with human bias.

  8.  **Concrete Changes if Presuppositions Dropped:**

      *   *Drop Atomism (Go Holistic/Outcome-Only):* Reviewers see the whole plan. They approve/deny the *intent*.
          *   *Breakage:* Reviewers get overwhelmed. They become bottlenecks. They start "resulting" (judging based on gut feeling).
      *   *Drop Process-Only (Go Process-Supervision):* Train on step quality.
          *   *Breakage:* Models become sycophantic. They learn to write convincing nonsense. Performance drops on hard tasks.
      *   *Drop "Unverifiable Passes":*
          *   *Breakage:* System throughput crashes. Reviewers abstain to avoid liability.
      *   *Drop Reviewer Immunity:*
          *   *Breakage:* Reviewers block everything to be safe. Innovation stops.

  9.  **Synthesize and Structure:**

      *   *Introduction:* Acknowledge the sophistication of the setup. Name the theory (Procedural Atomism with Pragmatic Instrumentalism).
      *   *Section 1: The Epistemology of the Step (Atomism vs. Holism).* Address (i).
      *   *Section 2: The Economics of Uncertainty (Unverifiable).* Address (ii).
      *   *Section 3: The Ontology of the Trace (Instrument vs. Truth).* Address (iii).
      *   *Section 4: The Division of Moral Labor (Immunity vs. Bonus).* Address (iv).
      *   *Section 5: Rival Theories.* Legal, Safety, ML perspectives.
      *   *Section 6: Counterfactual Policies.* What happens if you switch to Outcome-Only or Process-Only.
      *   *Conclusion:* Summary of the tension.

  10. **Refine Tone:**
      *   Needs to be analytical, precise, slightly philosophical but grounded in ops/ML reality.
      *   Avoid taking sides.
      *   Ensure the distinction between "strictly presupposes" and "sits well with" is clear.

  11. **Self-Correction/Nuance Check:**
      *   *Check:* Did I address the "reviewers are weaker than systems" constraint?
      *   *Correction:* Ensure I mention that the Sealed-Step rule is actually a concession to reviewer weakness (they can't judge the whole, only the parts).
      *   *Check:* Did I address the "abstention is approval" issue?
      *   *Correction:* Highlight this in the "Unverifiable" section. It creates a moral hazard for the reviewer unless immunity is granted.
      *   *Check:* Is the distinction between training on outcomes vs. diagnosing traces clear?
      *   *Correction:* Emphasize Goodhart's Law here.

  12. **Final Polish:** Check against the prompt's specific questions (i-iv) to ensure all are explicitly answered. (The structure looks good). Ensure the "implicit theory" is named and defined early.

  *(Self-Correction during drafting)*: I need to be careful with the term "Epistemic Atomism." In philosophy, that usually refers to something else. Better to use "Compositional Safety" or "Local Validity Assumption." I will use "Compositional Justification."
  Also, the "Unverifiable" rule is essentially a "Default Allow" policy. I need to frame that correctly regarding burden of proof.
  The "Outcome Blindness" vs "Outcome Bonus" is a classic Principal-Agent problem separation.

  Let's write.
answer: |-
  This governance package is a sophisticated hybrid of **Compositional Safety**, **Default-Allow Bureaucracy**, and **Pragmatic Instrumentalism**. It is not theoretically incoherent, but it rests on a specific, fragile set of distinctions between *process validity* and *outcome value*, and between *individual liability* and *systemic optimization*.

  Below is the implicit theory written out, distinguishing strict presuppositions from compatible beliefs, followed by the rival views and the concrete consequences of dropping each pillar.

  ---

  ### I. The Implicit Theory of the Package

  The system operates on a **Division of Epistemic Labor**. It assumes that *safety* is a property of the procedure (which humans check), while *competence* is a property of the model (which outcomes measure). It treats the human reviewer not as a superior intelligence correcting a subordinate, but as a **compliance sensor** verifying that the system stays within pre-validated corridors of action.

  #### (i) The Sealed-Step Rule: Compositional Justification
  **Strict Presupposition:** The system presupposes **Local Validity implies Global Safety**. It assumes that the risk profile of a complex action is the sum of the risk profiles of its constituent steps, and that the *context* of a step does not alter its safety classification enough to invalidate a local check.
  *   **Epistemological Name:** This is a commitment to **Compositional Justification**. It rejects **Holistic Coherentism** (the view that a step is only justified by its relation to the whole plan).
  *   **The Holistic Objection:** A holist argues that a step like "Update Vendor ID" is safe in isolation but catastrophic if preceded by "Disable 2FA" and followed by "Initiate Wire Transfer." If the framing is wrong, every step can be locally plausible and globally disastrous.
  *   **Can it survive without independence?** Strictly, no. If steps are highly interdependent, local grading is noise. However, the rule can survive if the *definition* of a "step" is changed. If a step is defined not as a semantic unit (e.g., "check ID") but as a **state transition with invariants** (e.g., "Move from State A to State B, preserving Invariant X"), then local validation works even if the *goals* are holistic. The current rule presupposes that the agent's decomposition aligns with these invariant-preserving transitions.

  #### (ii) Unverifiable is Non-Blocking: Asymmetric Error Costs
  **Strict Presupposition:** This presupposes that the **Cost of False Negatives (blocking valid work) exceeds the Cost of False Positives (allowing ambiguous work)**, provided no explicit violation is found. It places the **Burden of Proof on the Blocker**.
  *   **Defensible Principle:** This is not merely risk appetite; it is a principle of **Operational Continuity**. In a system where reviewers are weaker than the agents, a "I don't know" is the statistically dominant state. If "I don't know" blocks, the system halts. Therefore, "I don't know" must be treated as "Pass" to maintain throughput, relying on downstream controls (audits, caps) to catch actual errors.
  *   **The Risk:** As you noted, abstention is functionally approval. This creates a **Moral Hazard** for the reviewer. The only thing preventing mass-abstention is the social contract of the job, not the mechanism itself.

  #### (iii) Traces: Diagnostic Realism vs. Training Goodharting
  **Strict Presupposition:** The system presupposes that traces are **Forensically Reliable but Optimization-Sensitive**.
  *   **The Commitment:** It assumes the trace correlates sufficiently with the causal chain of the action to be useful for post-mortem (Diagnostic Realism), *but* that optimizing for the trace during training will decouple the trace from the causal chain (Goodhart's Law).
  *   **Defensibility:** This is defensible. You can treat the trace as a **black-box log** (like a flight recorder) rather than a **rationale**. A flight recorder doesn't need to be "trained" to be useful; it just needs to record state. The policy assumes the trace records *what happened*, not necessarily *why*. If you train on it, the model learns to write *plausible excuses* rather than *accurate logs*.
  *   **Thinner Reading:** The incident-review practice does not need to assume the trace explains the action. It only needs to assume the trace **constrains the hypothesis space** of what the action could have been.

  #### (iv) Outcome Blindness vs. Outcome Bonuses: Role-Separated Accountability
  **Strict Presupposition:** The system presupposes that **Individual Variance is Noise, Aggregate Variance is Signal**.
  *   **The Split:**
      *   *Reviewer Immunity:* Presupposes that for a single reviewer on a single task, the outcome is dominated by luck (model variance, edge cases). Penalizing this punishes luck.
      *   *Group Bonus:* Presupposes that over a quarter, the law of large numbers applies. Aggregate incidents reflect system configuration and governance quality, not individual reviewer luck.
  *   **Consistency:** This is consistent if you view the Sealed-Step rule as **Evidence Gathering** (did we follow the map?) and the Bonus as **Incentive Alignment** (did we reach the destination?). The reviewer is responsible for the map; the group is responsible for the destination.

  ---

  ### II. Rival Views Licensing the Same Rules

  Three distinct theoretical frameworks could justify this exact same policy package for entirely different reasons.

  1.  **The Legal-Compliance View (Auditability over Efficacy)**
      *   *Reasoning:* The goal is not necessarily to minimize errors, but to maximize **defensibility**. If an incident occurs, the company must prove "Due Diligence."
      *   *Justification:* Sealed steps create a paper trail. Outcome blindness protects employees from wrongful termination suits. Outcome bonuses keep shareholders happy. The trace is retained for discovery, not for engineering.
      *   *Difference:* They don't care if the steps are epistemically independent; they care that the steps exist to be checked off.

  2.  **The Safety-Engineering View (Defense in Depth)**
      *   *Reasoning:* The human is the last layer of a **Swiss Cheese Model**.
      *   *Justification:* Sealed steps are checksums. "Unverifiable passes" assumes other layers (caps, sandboxing) will catch what the human misses. Outcome training is used because the "system" includes the environment's feedback, which is the ultimate safety test.
      *   *Difference:* They view the reviewer as a sensor with a high false-negative rate, not a judge.

  3.  **The ML-Nativist View (Reward Hacking Prevention)**
      *   *Reasoning:* Human feedback is a biased, noisy reward signal.
      *   *Justification:* We don't train on steps because humans are bad at judging reasoning (Process Supervision fails). We train on outcomes because the environment is the only honest judge. We keep traces because engineers need to debug, not because they are ground truth.
      *   *Difference:* They view the governance layer as a temporary scaffold until the model is robust enough to remove the human entirely.

  ---

  ### III. Concrete Consequences of Dropping Presuppositions

  If you remove the core presuppositions, the policy must change radically. Given your constraints (reviewers < systems, checking > doing, abstention $\approx$ approval), here is where the alternatives break.

  #### Scenario A: Dropping Compositional Justification (Moving to Outcome-Only Supervision)
  *   **The Change:** Reviewers see the full plan and the intended outcome before approving. They are judged on whether the action *should* have been taken, not just if the steps were valid.
  *   **The Policy:** "Holistic Sign-off." Reviewers approve the *intent*.
  *   **Where it Breaks:**
      1.  **Cognitive Overload:** Since checking is harder than doing, and reviewers are weaker than the system, they cannot reliably simulate the outcome of a complex chain. They will default to **gut feeling**.
      2.  **Hindsight Bias:** Without sealed steps, when an incident occurs, the review looks like "How could you approve this?" rather than "Did step 3 match the protocol?"
      3.  **Bottleneck:** Holistic review takes longer. Throughput drops.
      4.  **Abstention:** If I am responsible for the outcome, and I am unsure, I will block. The "Unverifiable is Non-Blocking" rule becomes untenable because the risk is now on me. The system stalls.

  #### Scenario B: Dropping Pragmatic Instrumentalism (Moving to Process-Only Supervision)
  *   **The Change:** Agents are trained on step-quality (Process Supervision). Bonuses are based on adherence to protocol, not incident rates.
  *   **The Policy:** "Protocol Fidelity." The goal is perfect reasoning traces, regardless of the result.
  *   **Where it Breaks:**
      1.  **Sycophancy:** The model learns to produce traces that *look* like what reviewers approve, even if they lead to wrong answers. It optimizes for the seal, not the safety.
      2.  **Rigidity:** The system cannot adapt to novel situations where the "correct" steps are unknown. It can only execute known safe patterns.
      3.  **Diagnostic Blindness:** If the trace is trained to please, it ceases to be a reliable forensic artifact. When an incident happens, the trace will lie to protect the model's reward score. You lose the ability to diagnose.

  #### Scenario C: Dropping Asymmetric Error Costs (Making Unverifiable Blocking)
  *   **The Change:** If a reviewer says "I don't know," the action stops.
  *   **The Policy:** "Conservative Gatekeeping."
  *   **Where it Breaks:**
      1.  **Reviewer Liability:** Since abstention is indistinguishable from approval in the logs (both let it pass or both stop it), but now abstention *causes* a stop, reviewers will be pressured to "guess" to avoid blocking business.
      2.  **System Starvation:** Given that reviewers are weaker than the system, they will be unsure often. The operational workflow halts.
      3.  **Gaming:** Reviewers will mark "Wrong" to block things they simply don't understand, contaminating the error data used for training.

  #### Scenario D: Dropping Role-Separated Accountability (Penalizing Reviewers on Outcomes)
  *   **The Change:** Reviewers lose bonus if an approved action causes an incident.
  *   **The Policy:** "Resulting."
  *   **Where it Breaks:**
      1.  **Defensive Reviewing:** Reviewers will block anything remotely risky, regardless of protocol. The "Unverifiable is Non-Blocking" rule collapses because "Unverifiable" now carries personal financial risk.
      2.  **Luck Punishment:** A reviewer approves a perfectly valid step that fails due to an external API outage. They are penalized. Morale collapses; turnover increases.
      3.  **Trace Corruption:** Reviewers might pressure engineers to alter traces post-incident to shift blame away from the human approval.

  ### Summary of the Tension

  Your colleague in platform engineering is right that the sealed-step rule is "theatre" **if** the goal is pure safety optimization. If safety were the only goal, you would sandbox the agent and measure outcomes.

  Your colleague in legal is right that outcome grading is "unjust" **if** the goal is individual fairness.

  The implicit theory holds these together by asserting that **Safety is a System Property, not a Human Property.** The humans are there to ensure the system remains *inspectable* (sealed steps, traces), not to ensure the system is *correct* (outcome training). The bonuses align the humans to the system's success, while the immunity protects the humans from the system's stochasticity.

  The package works only as long as the **reviewers accept their role as sensors rather than judges**. If they begin to believe they are judges, the "Unverifiable is Non-Blocking" rule will cause them to disengage (learned helplessness) or the "Outcome Blindness" will feel like a trap. The theory presupposes a workforce that is comfortable with **procedural virtue** over **substantive victory**.
