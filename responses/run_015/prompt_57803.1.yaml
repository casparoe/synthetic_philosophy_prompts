      *   **Advance Decision to Refuse Treatment (ADRT):** Under the MCA, a valid and applicable ADRT is legally binding. It has the same force as a contemporaneous refusal by a capacitous patient.
      *   **Validity Criteria:** Was she capacitous when making it? Was it specific enough? Has she done anything inconsistent since? (The video helps strengthen validity).
      *   **Best Interests:** If the ADRT is valid, it dictates the decision. If not, the decision falls to the "best interests" test involving family and clinicians.
      *   **The "Then vs. Now" Self:** This is a classic philosophical problem (Dworkin vs. Dresser). Dworkin argues for precedent autonomy (the past self decides). Dresser argues for the current experiential interests of the present self.
      *   **Clinical Reality:** Pneumonia in advanced dementia is often a terminal event, but antibiotics can prolong life, sometimes with added burden, sometimes with return to baseline. The Nan seems to have a "good" baseline currently (cheerful).

