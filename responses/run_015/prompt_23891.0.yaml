answer: |-
  You have put your finger on one of the most persistent and unsettling nerves in the philosophy of science. Your intuition is correct: the standard label of "theory-ladenness" is often wielded too loosely, and "Duhem-Quine" misses the specific ontological weight of what you are describing. You are describing a situation where the *space of empirical possibility* is partitioned by the theory itself, not just the interpretation of a shared space.

  In the literature, this does not have a single, universally agreed-upon noun phrase like "The Grue Problem." However, it is the hard core of what Thomas Kuhn and Paul Feyerabend meant by **Incommensurability**, specifically what has come to be called **Observational Incommensurability** or the **Theory-Constitution of Facts**.

  If we are to be precise—which you rightly ask for—we need to distinguish this from the weaker claims of theory-ladenness and locate it within the specific mechanism of *operational constitution*. Since you asked for a careful account and, if necessary, a coinage, I propose we treat this under the label **Constitutive Evidential Relativity (CER)**. While "Incommensurability" is the broader umbrella, CER captures the specific mechanism you identified: that the evidence set is not just interpreted differently, but *constituted* differently.

  Here is the careful dissection you requested.

  ### 1. Why the Standard Labels Fail

  To see why CER is distinct, we must clear the deck of the concepts you rightly found insufficient.

  **Theory-Ladenness of Observation (Hanson/Kuhn):**
  Standard theory-ladenness is often psychological or semantic. It suggests that two scientists look at the same retinal image (or the same dial reading) but *see* different things (e.g., "sunrise" vs. "earth rotation"). The *input* is assumed to be shared; the *conceptualization* differs. Your scenario is more radical: the *input* itself is not shared. If $T_1$ requires a particle detector and $T_2$ requires a wave interferometer, they are not looking at the same dial and disagreeing; they are generating different data streams entirely. The "given" is not just interpreted differently; it is manufactured differently.

  **The Duhem-Quine Thesis:**
  Duhem and Quine argue that we cannot test a hypothesis $H$ in isolation, only $H$ plus a bundle of auxiliary assumptions $A$. If prediction fails, logic alone doesn't tell us whether to reject $H$ or $A$. This is a problem of *logical distribution of falsity*. Your problem is not about where to place the blame when a test fails; it is about the prior condition that $T_1$ and $T_2$ do not inhabit the same testing space. Duhem-Quine assumes a shared logical space of consequences; CER denies that the consequences are comparable in the first place.

  ### 2. The Established Home: Incommensurability & Fact-Constitution

  The philosophical home for your insight is the post-positivist critique of the 1960s and 70s, specifically:

  *   **Kuhn's Local Incommensurability:** Kuhn eventually argued that rival theories carve up the world with different taxonomic structures. If $T_1$ posits "phlogiston" and $T_2$ posits "oxygen," they aren't just disagreeing about the properties of a shared substance; they are referring to different ontological categories. Consequently, the "facts" available to a phlogiston theorist (e.g., "calx is dephlogisticated") are not translatable into the oxygen framework without loss.
  *   **Feyerabend's Theoretical Constitution of Facts:** Feyerabend was more radical than Kuhn here. He argued that theories *create* their own facts. A fact is not a neutral anchor; it is a product of theoretical interpretation and instrumental setup. He argued that empiricism fails because there is no "natural interpretation" of observations that stands outside theory.
  *   **Hasok Chang's Operational Coherence:** In contemporary philosophy, Hasok Chang (e.g., *Is Water H₂O?*) argues that measurements are defined by the operations used to make them. If $T_1$ and $T_2$ prescribe different operations for measuring "temperature," then $T_1$ and $T_2$ are not arguing about the same quantity. The evidence is internally relative to the operational theory.

  ### 3. Defining Constitutive Evidential Relativity (CER)

  Since "Incommensurability" is often used to cover semantic, methodological, and perceptual issues, let us define **Constitutive Evidential Relativity** to capture your specific pattern.

  **Definition:**
  CER obtains between two rival theories $T_1$ and $T_2$ when the conditions required to generate, identify, or record empirical evidence $E$ are internal to the theoretical framework of $T_1$ and $T_2$ such that $E_1$ (evidence generated under $T_1$) and $E_2$ (evidence generated under $T_2$) are not token-identical, nor type-identical, and cannot be mapped onto a neutral observation language $L_{neutral}$ without presupposing one of the theories.

  **The Mechanism:**
  CER arises through three channels:
  1.  **Instrumental:** The device used to measure exists or functions based on theoretical principles (e.g., a cloud chamber requires quantum mechanics to interpret the tracks, but classical mechanics to build the mechanics).
  2.  **Operational:** The definition of the variable being measured is theory-dependent (e.g., "mass" in Newtonian vs. Relativistic physics).
  3.  **Phenomenological:** The stabilization of a "phenomenon" requires theoretical background to distinguish signal from noise (Cartwright's "nomological machines").

  ### 4. Boundary Cases: Where CER Stops and Underdetermination Begins

  You asked for the boundary conditions. This is the crucial philosophical work. When does CER collapse back into standard underdetermination (where evidence $E$ is fixed and neutral)?

  **Boundary 1: The Overlap of Stable Phenomena (The Hacking Condition)**
  Ian Hacking argued that while theories change, *experimental effects* often remain stable. If $T_1$ and $T_2$ can both predict the position of a needle on a dial, even if they explain *why* it moves differently, we have a "bottom-up" shared evidence base.
  *   *CER holds:* If the meaning of the needle's position is theoretically contested (e.g., does it indicate field strength or particle density?).
  *   *Standard Underdetermination holds:* If both agree the needle indicates "voltage" (operationally defined by a standard battery), but disagree on the underlying field structure.
  *   *The Line:* CER dissolves when there is an **operational consensus** that is independent of the theoretical dispute.

  **Boundary 2: Bridging Principles**
  Sometimes we can construct a "bridge" language. If we can translate $E_1$ into $E_2$ using a set of correspondence rules that are themselves theory-neutral (or accepted by both), CER is mitigated.
  *   *The Line:* CER is absolute only if translation is impossible (strict incommensurability). If translation is lossy but possible, we have *partial* CER. Most real-world cases are partial.

  **Boundary 3: The "View from Nowhere" Test**
  To test if you have CER or just standard underdetermination, ask: *Can I describe the evidence without invoking the resources of $T_1$ or $T_2$?*
  *   If yes (e.g., "The pointer moved 3cm"), you have standard underdetermination.
  *   If no (e.g., "The pointer moved 3cm" is meaningless without knowing if the scale is linear or logarithmic, which is a theoretical claim), you have CER.

  ### 5. Why This Distinction Matters

  You should bring this distinction into your seminar because it changes the stakes of the realism debate.

  If it is just **standard underdetermination**, the problem is epistemic: we can't know which theory is true, but there might be a fact of the matter.
  If it is **Constitutive Evidential Relativity**, the problem is ontological: there may be no single "fact of the matter" independent of the theoretical framework. This pushes you toward **Structural Realism** (only the relations are preserved) or **Perspectival Realism** (Giere, Massimi), where truth is relative to a model or perspective.

  ### Summary for Your Seminar

  When you raise this, you can say:

  > "I'm distinguishing between *interpretive theory-ladenness* (where we share data but disagree on meaning) and *constitutive evidential relativity* (where the theories generate non-identical data sets). This isn't Duhem-Quine holism; it's a form of **Observational Incommensurability** where the 'evidence' is an internal variable of the theory, not an external constraint. The boundary case is whether we can establish an operational consensus on the measurement output that is neutral to the theoretical explanation."

  This positions you precisely within the Kuhn/Feyerabend/Chang lineage without getting bogged down in the vague usage of "theory-ladenness." You are talking about the **theory-dependence of the evidential base**, which is the strongest form of underdetermination possible.

  **Name to use:** If you need a label, **"Constitutive Evidential Relativity"** is precise and defensible. If you want to cite established literature, anchor it in **Feyerabend's "Theory-Dependence of Facts"** or **Chang's "Operational Incommensurability."**
