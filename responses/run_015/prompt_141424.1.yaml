prompt: |-
  I run a small reading group on risk and rationality with some people from the finance department, and one of them presented an argument last week that I've been mulling over since and can't quite get out of. It's supposed to be a straight argument for geometric rationality — maximize expected log, not expected value — and I think it definately proves too much, but I can't put my finger on the exact joint. Roughly as he gave it: (1) Take a favourable multiplicative gamble you can repeat: any fraction of your bankroll on a coin that comes up heads with p = 0.6 at even money. The rule that maximizes the expected logarithm of your bankroll — betting 20% each round, i.e. edge over odds — will with probability one eventually leave you richer than a bettor using any other fixed fraction, and the ratio between the two of you grows without bound. (2) The moral of that theorem is supposed to be about what a single individual actually lives through: your wealth is one trajectory, and what happens to it over time is governed by its time-average growth rate, not by the average across a hypothetical population of copies of you, which is dragged around by outcomes almost nobody experiences. Expected wealth maximization is maximizing a fiction. (3) But — and here's where I start to itch — the number of times you face a given choice can't be what makes a rule rational. If maximizing expected log is the right policy when you'll take the bet a hundred times, it's the right policy when you take it once; the long run is just a device that exposes what the correct policy is, it isn't a separate ingredient in the justification. (4) So in any decision whatever, maximize the expected log of the quantity your decision multiplies. (5) Expected log is minus infinity if any outcome drives that quantity to zero, so rationality forbids accepting any gamble carrying any nonzero probability of total loss of that quantity, however tiny the probability and however large the finite gain. (6) That's preposterous. There's some chance that driving to campus I get disabled in a way that destroys my earning capacity, and my earning capacity is most of the quantity that compounds over the rest of my life; by (5) no finite benefit could ever justify the drive. Same for the surgery I've been putting off, same for having a second kid. A rule that forbids every action anyone ever takes isn't the rule. (7) So one of (1)–(6) has to go, or one of the steps between them.

  Things I've tried that don't satisfy me. The finance guy says you just define the "bankroll" narrowly — the money earmarked for this kind of bet — and then nothing is ever driven to zero and (5) never bites; but (1) was a claim about your whole wealth process, and if I'm allowed to choose the quantity freely it looks like I can get the rule to say anything I like, which is just a version of the problem rather than a solution. I also don't think the difficulty is really about repetition as such, because I can construct cases where the timing is what's odd: my colleague's own example was a 78-year-old with no heirs deciding whether to put 5% of her savings on a single even-money 60/40 bet, where the proceeds will be spent on care within the year and never reinvested in anything, and I made up one of my own where the stake isn't a compounding quantity at all — a drug that might cost me my eyesight. Call it the reinvestment condition, if you like: the theorem needs a quantity that actually gets multiplied, over and over, into itself. My question: which step do you reject, why did it look fine when he wrote it on the board, and what does rejecting it cost? I'd rather keep (1) and (6) than (3) or (4), and I'd rather not end up saying that what's rational for me to do on Monday depends on how many similar decisions the universe is going to hand me. And if (3) does go: is there any residue of geometric rationality that still applies to a genuinely one-off, non-compounding choice, or does the whole program only get a grip inside sequences?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** A reading group on risk and rationality (finance background).
      *   **Core Issue:** A colleague presented an argument for "Geometric Rationality" (Maximize Expected Log, or Maximize Geometric Growth Rate) that seems to prove too much.
      *   **The Argument Structure:**
          1.  *Premise:* In repeated multiplicative gambles (Kelly criterion scenario), Max Expected Log (MaxEL) dominates Max Expected Value (MaxEV) almost surely in the long run.
          2.  *Interpretation:* This reflects the "time average" of a single trajectory vs. the "ensemble average" of many copies. MaxEV is a fiction for a single life.
          3.  *Generalization:* Rationality shouldn't depend on repetition count. If MaxEL is right for $N=100$, it's right for $N=1$.
          4.  *Universalization:* Therefore, maximize Expected Log of the relevant quantity in *any* decision.
          5.  *Implication:* MaxEL forbids any non-zero probability of total loss (log(0) = -infinity).
          6.  *Reductio:* This forbids everyday actions (driving, surgery, kids) because they carry tiny risks of "total loss" (of earning capacity, health, etc.).
          7.  *Conclusion:* Something is wrong.
      *   **User's Preferences:** Wants to keep (1) [Math is correct] and (6) [Common sense is correct]. Prefers rejecting (3) or (4). Doesn't want rationality to depend on repetition count (Monday vs. Tuesday). Wants to know if Geometric Rationality has any bite in one-off, non-compounding cases.
      *   **Specific Question:** Which step to reject, why it looked plausible, what the cost is, and is there residue for one-off cases?

  2.  **Deconstruct the Argument Steps:**

      *   **Step (1):** *Mathematical Fact.* In repeated i.i.d. multiplicative bets, the Kelly strategy (MaxEL) maximizes the asymptotic growth rate. Any other strategy will eventually be overtaken with probability 1. *Status: True.*
      *   **Step (2):** *Ergodicity Economics Interpretation.* The "ensemble average" (MaxEV) is irrelevant for a single non-ergodic process. The "time average" (MaxEL) is what matters. *Status: Plausible within Ergodicity Economics (Ole Peters et al.), but controversial in standard decision theory.*
      *   **Step (3):** *The Bridge.* "Repetition shouldn't matter for rationality." If a rule is optimal for long sequences, it must be optimal for single instances. *Status: The Weak Link.* This assumes the *objective function* is invariant to the structure of the decision problem (one-off vs. repeated).
      *   **Step (4):** *Universalization.* Apply MaxEL to *any* decision. *Status: Overgeneralization.* Assumes all decisions are about maximizing the growth rate of a compounding quantity.
      *   **Step (5):** *Log Utility Property.* Log utility implies infinite risk aversion at zero wealth. *Status: Mathematically true for Log utility.*
      *   **Step (6):** *Absurdity.* Real life requires accepting some ruin risk. *Status: True.*

  3.  **Identify the Critical Flaw:**
      The argument conflates *instrumental rationality for growth* with *fundamental rationality for preference*.
      *   MaxEL is optimal *if and only if* your goal is to maximize the long-term geometric growth rate of a specific compounding quantity (wealth).
      *   It is *not* a fundamental axiom of rationality like "don't have cyclic preferences." It is a derived strategy for a specific environment (repeated multiplicative dynamics).
      *   Step (3) is the culprit. It claims the *justification* (long run) doesn't matter, only the *rule*. But the rule is derived *from* the justification. If the justification (compounding over time) is absent, the rule loses its derivation.

  4.  **Formulate the Rejection (Targeting Step 3 & 4):**
      *   **Reject (3):** Rationality *does* depend on the structure of the environment. A strategy optimal for a repeated game is not necessarily optimal for a one-off game *unless* the one-off game is embedded in a larger repeated context.
      *   **Reject (4):** You cannot universalize MaxEL to "any decision." It only applies to decisions affecting the growth rate of a compounding resource.
      *   **Why it looked fine:** It appeals to the "Single Life" intuition (Step 2). We live one life, so we should care about time averages. This is seductive. But "one life" doesn't mean "one decision." Most decisions are small parts of a larger life trajectory (which *is* compounding). However, not *all* quantities compound, and not *all* risks are ruinous to the *compounding engine*.
      *   **The Cost:** You lose the elegant universality of "MaxEL is The Law." You have to context-switch. You need a meta-theory to decide when to use MaxEV, MaxEL, or something else.

  5.  **Address the "One-Off" Question:**
      *   Does Geometric Rationality apply to one-off, non-compounding choices?
      *   *Strict Answer:* No, not directly. The math of geometric growth requires geometry (multiplication over time).
      *   *Nuanced Answer:* Yes, *if* the one-off choice is a subset of a larger compounding life. If the stake is a small fraction of your "life bankroll," MaxEL approximates Log Utility. But Log Utility is a *preference*, not a *mathematical necessity* of the bet itself.
      *   *Ergodicity Economics View:* Even one-off decisions should be evaluated by their contribution to the time-average growth rate of your total wealth. But this requires defining "wealth" broadly (human capital, etc.).
      *   *The "Ruin" Problem:* Step (5) assumes "Zero" means mathematical zero. In reality, "Ruin" is a threshold below which you cannot recover. Log utility is an approximation that penalizes near-ruin heavily, but real utility functions might be bounded or have a "subsistence level" rather than a hard zero.

  6.  **Develop the "Joint" (The precise point of failure):**
      The joint is between **(2) and (3)**.
      *   (2) says: "For compounding processes, time-average growth is the physical reality."
      *   (3) says: "Therefore, the rule derived from (2) applies even when the process isn't compounding."
      *   This is a category error. The *ergodicity breaking* (the difference between time and ensemble average) only exists in multiplicative dynamics. In additive one-off dynamics, time and ensemble averages converge (or the distinction is meaningless).

  7.  **Drafting the Response:**
      *   **Validate:** Acknowledge the strength of the argument (it's the standard Ergodicity Economics pitch).
      *   **Pinpoint the Break:** Step (3) is the false step. It confuses a *derived strategy* with a *fundamental axiom*.
      *   **Explain Why:** MaxEL is optimal *relative to a goal* (maximize long-term growth). If the context doesn't support that goal (one-off, additive, or non-compounding), the derivation fails.
      *   **Address the "Ruin" Paradox (Step 5/6):** The definition of "Zero" is the issue. In finance, bankruptcy is zero. In life, "zero earning capacity" isn't mathematical zero utility. Also, Log Utility is an approximation. Bounded utility or subsistence constraints solve the "driving to campus" problem.
      *   **The "Residue":** What's left for one-off cases?
          *   If the stake is small relative to total compounding wealth: MaxEL $\approx$ Log Utility $\approx$ Risk Aversion.
          *   If the stake is "life or death": You need a different utility function (e.g., step function at subsistence).
          *   The insight remains: *Be wary of risks that remove you from the game.* But don't treat it as a mathematical infinity.
      *   **Recommendation:** Keep (1) as a theorem about stochastic processes. Keep (6) as a constraint on utility functions. Reject (3) and (4) as overgeneralizations.

  8.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, doesn't Peters argue that even one-off bets should be judged by time averages?* Yes, Ole Peters argues that *all* economic decisions are part of a time series. Even a one-off bet changes your wealth base for future bets.
      *   *Counter:* If the wealth is spent immediately (the 78-year-old example), there is no future compounding. The ergodicity argument collapses.
      *   *Refinement:* The argument holds *only* if the resource is reinvestable. If the resource is consumed, MaxEV might actually be appropriate (or a different utility function).
      *   *The "Monday/Tuesday" worry:* The user worries rationality shouldn't change based on repetition count. The answer is: Rationality depends on *consequences*. If the consequences compound, use growth logic. If they don't, use value logic. It's not the *count* of decisions, it's the *structure* of the payoff.
      *   *Step 5 Fix:* Log(0) is -infinity. But real utility isn't Log(Wealth). It's Log(Wealth - Subsistence). Or simply, probability of ruin is a constraint, not a utility term.

  9.  **Final Structure:**
      *   **Diagnosis:** The argument is a classic "Ergodicity Economics" pitch. It's compelling but overreaches.
      *   **The Cut:** Reject Step (3). It conflates *context-independent rationality* with *context-optimized strategy*.
      *   **Why it looked right:** The "Time Average" intuition is powerful for wealth, but wealth isn't everything.
      *   **The Cost:** You lose the "One Rule to Govern Them All." You need to identify the *dynamics* of the decision (additive vs. multiplicative, reinvestable vs. consumed).
      *   **The Ruin Problem:** Step (5) relies on a specific utility function. Log utility is a tool, not a law. Use "Risk of Ruin" constraints instead of Log(0).
      *   **One-Off Residue:** Yes, but it's about *exposure to ruin*, not maximizing log. It becomes a constraint satisfaction problem, not an optimization problem.

  10. **Tone:** Academic but accessible, respectful of the finance colleague's math but firm on the decision theory philosophy. (Matches the user's "reading group" vibe).

  11. **Final Polish:** Ensure I explicitly answer "Which step do you reject?" and "What does it cost?" and "Is there residue?" (User's specific questions).

      *   *Reject:* (3) and (4).
      *   *Cost:* Loss of universality. Need to classify decision types.
      *   *Residue:* Caution against ruin, but not infinite aversion.

      *(Self-Correction during drafting)*: I should mention that Step (1) is technically about *asymptotic* behavior. For finite N, MaxEV might still have higher expected utility depending on the utility function. The "Probability 1" claim is asymptotic. This is a minor technical point but worth noting if the group is pedantic. I'll focus more on the conceptual bridge (3).

      *Wait, one more thing:* The user says "I'd rather keep (1) and (6) than (3) or (4)." I should align with this preference. It makes the advice more actionable.

      *Let's check the 78-year-old example.* If she spends the money within the year, there is no compounding. The ergodicity argument *requires* reinvestment. If no reinvestment, the time-average growth rate is undefined or identical to the ensemble average of the single period. So the argument fails there specifically. This supports rejecting (4).

      *Let's check the "Driving" example.* Driving isn't a bet on bankroll. It's a bet on health/life. If we map "Life" to "Bankroll," then yes, death is Zero. But we accept non-zero probability of death for finite gain. This implies our utility function is *not* Log(Wealth/Life). It implies we have a bounded utility or a threshold. So Step (5) is the assumption that Utility = Log. We should reject that Utility *must* be Log. Log is derived from the goal of max growth. If the goal changes, Utility changes.

      *Okay, plan is solid.* Focus on the distinction between *Instrumental* (MaxEL for growth) and *Fundamental* (Utility functions).

      *(Final thought on Step 3)*: The user says "If maximizing expected log is the right policy when you'll take the bet a hundred times, it's the right policy when you take it once." This is the "Dynamic Consistency" argument. But Dynamic Consistency applies to a *sequence of decisions*. A single decision isolated from a sequence doesn't inherit the properties of the sequence unless it's *part* of that sequence. If the 78-year-old has no sequence, the logic doesn't apply. So (3) is false because it assumes the single bet is structurally identical to the repeated bet, just truncated. It's not. One is a dynamic process, one is a static choice.

      *Okay, ready to write.*
answer: |-
  This is a sharp dissection of a very seductive argument. Your colleague is presenting a version of **Ergodicity Economics** (championed by Ole Peters and others), which attempts to ground decision theory in the physics of stochastic processes rather than axiomatic utility theory. It is mathematically robust in its narrow domain, but as you've sensed, it tries to export its conclusions far beyond its jurisdiction.

  You are right to itch. The argument is valid, but it is not sound, because it smuggles a category error into the bridge between the math and the morality.

  Here is the breakdown of where to cut, why it looked plausible, what it costs you, and what remains for the one-off case.

  ### 1. The Cut: Reject Step (3)

  You should reject **Step (3)**: *"If maximizing expected log is the right policy when you'll take the bet a hundred times, it's the right policy when you take it once."*

  This is the "joint" that fails. It conflates **instrumental optimality** with **axiomatic rationality**.

  *   **Why it looked fine:** It appeals to a principle of *dynamic consistency*. It feels wrong that a rational agent should have a strategy that changes simply because a counter in the sky ticked over from "1 bet left" to "0 bets left." It suggests that the "long run" is just a magnifying glass that reveals the truth of the "short run."
  *   **Why it is wrong:** The "long run" is not a magnifying glass; it is a **different physical system**.
      *   In the repeated case (Step 1), you are optimizing a *trajectory* through time. The mathematics of geometric growth applies because the output of period $t$ becomes the input of period $t+1$. The system has *memory* and *compounding*.
      *   In the one-off case (specifically the 78-year-old example or the non-reinvestable stake), there is no compounding. The output is consumed. The dynamics are additive, not multiplicative.
      *   Therefore, the objective function changes. In the repeated case, the objective is "maximize asymptotic growth rate." In the one-off case, the objective is "maximize expected utility of the outcome."
      *   Step (3) assumes the objective function is invariant to the *structure of the environment*. It is not. Rationality is about choosing the right means to an end; if the environment changes the causal link between means and ends (by removing the compounding mechanism), the optimal means must change.

  ### 2. The Cost: Loss of Universality

  Rejecting (3) and consequently (4) costs you the elegance of a **Universal Decision Rule**.

  Your colleague wants "Maximize Expected Log" to be the decision-theoretic equivalent of $F=ma$—applicable everywhere. By rejecting (3), you admit that there is no single scalar objective function that governs all rational choice. Instead, you must adopt a **typology of decisions**:

  1.  **Compounding/Reinvestable:** (Trading, career capital, business equity). Here, Geometric Rationality holds. You maximize growth rate. Ruin is forbidden.
  2.  **Additive/Consumable:** (The 78-year-old's care fund, a one-off lottery ticket, eating a meal). Here, standard Expected Utility Theory (EUT) holds. You maximize the expected value of the utility of the consumption.
  3.  **Existential/Threshold:** (Driving, surgery). Here, you are dealing with constraints, not just optimization.

  **The Cost:** You have to do more work. You can't just plug numbers into a log function. You have to analyze the *dynamics* of the specific choice: *Is this stake reinvestable? Does this risk remove me from the game entirely, or just reduce my score?*

  ### 3. Solving the "Ruin" Paradox (Steps 5 & 6)

  Your colleague's Step (5) relies on the mathematical property that $\log(0) = -\infty$. This leads to the absurdity in Step (6) (never drive, never live).

  There are two ways to fix this without abandoning geometric insights:

  **A. Define "Zero" as "Ruin Threshold," not Mathematical Zero**
  In finance, bankruptcy is zero. In life, "zero earning capacity" is not zero utility. You still have value, perhaps negative utility, but not $-\infty$.
  More importantly, in Ergodicity Economics, "Ruin" is defined as falling below a threshold where recovery is impossible. If driving to campus carries a $10^{-9}$ risk of death, that is a risk of ruin. But we accept it. Why?
  Because our utility function is not strictly Logarithmic over *life*. It is bounded. Or, more accurately, we treat the probability of ruin as a **constraint**, not a utility term.
  *   *Correction:* "Maximize Expected Log Wealth *subject to* Probability(Ruin) < $\epsilon$."
  This preserves the geometric insight (don't blow up) without the paralysis (don't move).

  **B. The "Small Stake" Approximation**
  For small risks relative to your total "life bankroll" (health + wealth + relationships), Log Utility is approximately linear.
  $\log(W - x) \approx \log(W) - x/W$.
  If the risk of death is tiny, the expected log loss is finite and manageable *if* you model "Life" as having a finite utility value, not an infinite one. The paradox arises only if you insist that "Death = Utility 0" and "Life = Infinite Utility Stream." If Life is a finite stream of utility, the expected loss is finite.

  ### 4. Is There Residue for the One-Off Case?

  You asked: *"Is there any residue of geometric rationality that still applies to a genuinely one-off, non-compounding choice?"*

  **Yes, but it shifts from Optimization to Constraint.**

  Even in a one-off choice, the **logic of non-ergodicity** provides a crucial heuristic: **Beware of risks that remove the player from the game.**

  *   **Standard EUT view:** A 1 in a billion chance of death is fine if the payoff is high enough. (e.g., "I'll pay you $10 billion to play Russian Roulette with 1 million chambers.")
  *   **Geometric view:** No. Because if you lose, you cannot make further bets. The "ensemble average" of a billion copies of you includes the ones who died, but *you* are not an ensemble. You are a trajectory.

  **The Residue:**
  1.  **Risk of Ruin is qualitatively different from Risk of Loss.** In a one-off decision, you should not treat a 90% chance of losing \$100 the same as a 0.0001% chance of losing everything, even if the Expected Value is identical. Geometric rationality forces you to acknowledge the **absorbing barrier**.
  2.  **Path Dependence.** Even in one-off decisions, ask: "Does this outcome change my ability to make future decisions?" If yes, you are implicitly in a compounding scenario, and you should apply a discount to strategies that increase variance at the cost of survival probability.
  3.  **The "Kelly" Mindset.** Even if you don't bet half your bankroll, the Kelly criterion teaches **fractional sizing**. In a one-off investment, geometric rationality suggests you should never bet "all in" on a positive EV opportunity if there is variance, because the *geometric mean* return is lower than the *arithmetic mean*. This applies even to single bets if you care about the *median* outcome rather than the *mean* outcome.

  ### Summary for your Group

  Tell your colleague:

  1.  **Keep (1):** The math on repeated multiplicative processes is correct. Kelly/MaxEL dominates in the long run.
  2.  **Keep (6):** Common sense is correct; we must be allowed to cross the street.
  3.  **Reject (3):** The derivation of MaxEL depends on the **reinvestment condition**. Without reinvestment, the time-average growth rate collapses into the single-period return. The "long run" is not a justification for the "short run"; it is a distinct regime.
  4.  **Modify (5):** Log utility is a tool for growth, not a law of nature. For existential risks, use a **constraint on ruin probability** rather than a Log(0) utility penalty.

  **The Verdict:** Geometric rationality is the correct physics for **capital accumulation**, but it is not the correct ethics for **living**. It tells you how to grow a forest, but it doesn't tell you whether you should walk through it to get to the store. Use it to manage your portfolio and your career; use standard expected utility (with ruin constraints) to manage your Tuesday.
