answer: |-
  Picture Ben Franklin late one night in his study, quill in hand, staring down his famous "Moral Perfection Ledger." He's got his thirteen virtues lined up in columns like soldiers ready for inspection: Temperance, Silence, Order, Frugality, and so on. The goal is a clean page. The reality is a lot of black ink spots.

  One Tuesday, Franklin buys a round of ale for his weary printers. It boosts morale (Industry), it shows genuine care (Sincerity), but it costs money (Frugality). So, he dips his quill and puts a black mark in the Frugality column. But then he thinks: *If I hadn't bought the drink, I'd be stingy, which violates Justice.* So really, he should have put a mark in Justice if he *didn't* spend the money.

  He sits there, quill hovering, realizing he's in a lose-lose situation created entirely by the spreadsheet. He looks at the page, covered in spots not because he's a scoundrel, but because the virtues are fighting each other over the same action.

  He closes the book and says to his apprentice, "I thought I was auditing my soul. Turns out I'm just auditing the rulebook. And let me tell you, the rules are bankrupt."

  He picks up the ledger and tosses it on the fire. "I'm not collecting sins anymore. I'm collecting bug reports. And the software? It's called 'Universal Principles.' Version 1.0 is full of glitches."
