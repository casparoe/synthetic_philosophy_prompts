answer: |-
  Your tentative principle fails because it attempts to derive the *right to strike* from the *mechanics of leverage* (costs, notice, quitting). But your verdicts show you are actually weighing **moral authority** against **collateral damage**. You permit strikes that hurt employers (Case 1), hurt patients inconveniently (Case 2), and hurt parents (Case 3), but you forbid strikes that hurt patients catastrophically (implied in Case 2's safeguards), hurt the public via sabotage (Case 12), or use workers as proxies for distant political fights (Case 7).

  You also correctly sense that "permissible" is doing two different jobs. Case 11 (picketing) and Case 10 (work-to-rule) are about *how* you fight. Case 7 (political) and Case 5 (contract breach) are about *why* you fight.

  Here is the repaired framework. It is a two-tiered principle: **Justification** (the object) and **Conduct** (the method).

  ### The Principle of Legitimate Collective Disruption

  **Tier 1: Justification (The Object)**
  A strike or collective stoppage is justified if and only if its primary object falls into one of four categories:
  1.  **Economic:** To secure or defend terms and conditions of employment (wages, hours, job security).
  2.  **Defensive:** To enforce safety standards or contractual rights where the employer has acted in bad faith or where established procedures are demonstrably futile.
  3.  **Conscientious:** To refuse direct complicity in work that causes immediate, identifiable moral harm (e.g., hate speech, unsafe products).
  4.  **Constitutional:** (Federation level only) To restore the balance of power in the labor relation system itself (e.g., against anti-union legislation).

  *Exclusion:* Action is **not** justified if the object is to force an employer to alter its commercial relationships with third parties for purely political ends unrelated to the workers' complicity or terms of employment.

  **Tier 2: Conduct (The Method)**
  A justified strike is permissible in execution only if it satisfies four constraints:
  1.  **Collective Agency:** The action represents the will of the participating unit. Formal votes are required where institutional structures exist; where they do not (e.g., gig work), concurrent collective action suffices.
  2.  **Transparency:** The action must be declared as a dispute. Covert disruption (e.g., undisclosed work-to-rule) is impermissible.
  3.  **Proportionality:** The tactic must not inflict harm on uninvolved third parties disproportionate to the leverage gained. Specifically:
      *   **Safety:** Life and safety must be preserved (emergency care maintained).
      *   **Sabotage:** Timing must not be engineered to maximize catastrophic economic loss relative to labor withheld (e.g., targeting just-in-time windows to destroy product rather than halt production).
  4.  **Liberty:** The action must not physically coerce non-participants (scabs, suppliers, public).

  ---

  ### Application to Your Cases

  This principle earns your verdicts by mapping them to specific clauses.

  | Case | Verdict | Principle Clause | Rationale |
  | :--- | :--- | :--- | :--- |
  | **1 (Economic)** | Permissible | Tier 1.1 (Economic) | Standard bargaining leverage. |
  | **2 (Nurses)** | Permissible | Tier 2.3 (Safety) | Emergency care maintained; inconvenience to patients is proportional. |
  | **3 (Teachers)** | Permissible* | Tier 2.1 & 2.2 | *Conditional:* Permissible if notice is adequate. Your verdict ("not as executed") aligns with Tier 2.2 (Transparency/Notice). |
  | **4 (Safety)** | Permissible | Tier 1.2 (Defensive) | Safety overrides contract; employer delay = bad faith. |
  | **5 (Schedule)** | Not Perm. | Tier 1.2 (Defensive) | Contract permits employer action; no bad faith. Pacta sunt servanda. |
  | **6 (Sympathy)** | Permissible | Tier 1.1 (Economic) | Supply chain leverage is a valid economic tool. |
  | **7 (Software)** | Not Perm. | Tier 1 (Exclusion) | Political object; workers not directly complicit in end-use. |
  | **8 (Printers)** | Permissible | Tier 1.3 (Conscientious) | Direct complicity in hate speech creates moral boundary. |
  | **9 (Gig)** | Permissible | Tier 2.1 (Agency) | No union structure = vote/notice not feasible; collective action suffices. |
  | **10 (Work-to-Rule)** | Conditional | Tier 2.2 (Transparency) | Permissible *only if declared*. If covert, it violates Transparency. |
  | **11 (Picketing)** | Not Perm. | Tier 2.4 (Liberty) | Physical coercion violates liberty of non-participants. |
  | **12 (JIT)** | Not Perm. | Tier 2.3 (Sabotage) | Disproportionate harm; timing engineered for destruction, not leverage. |
  | **13 (Organizing)** | N/A | *Employer Conduct* | See below. |

  ### Resolving Your Tensions

  **1. Cases 7 vs. 8 (Political vs. Conscience)**
  The principle distinguishes these based on **complicity**. In Case 8, the worker *produces* the harm (the flyer). In Case 7, the worker produces a tool (software) that is *used* for a purpose they dislike. The principle permits refusing to be an *agent of harm*, but not refusing to be an *agent of commerce* that indirectly supports a policy you dislike. This defends your Case 8 verdict without opening the door to every political grievance.

  **2. Cases 2 vs. 12 (Intermittent Strikes)**
  The principle distinguishes these based on **intent of harm**. Case 2 (Nurses) uses intermittency to manage worker fatigue while maintaining safety (Tier 2.3). Case 12 (Auto) uses intermittency specifically to break the production system (JIT) causing damage outsized to the labor withheld (Tier 2.3 Sabotage). Intermittency is not the sin; *sabotage* is.

  **3. Cases 3 vs. 9 (Notice and Authorization)**
  The principle distinguishes these based on **feasibility** (Tier 2.1). In Case 3, a union exists; notice is possible and required to mitigate third-party harm (parents). In Case 9, no structure exists; requiring a formal vote would render the right to strike illusory. The requirement is *Collective Agency*, not *Bureaucratic Form*.

  **4. Case 10 (Work-to-Rule)**
  Your intuition that this "troubles you" is correct. It violates **Transparency** (Tier 2.2). The principle renders it permissible *only if* the union declares, "We are withdrawing goodwill." If they hide it, it becomes deception, which undermines the legitimacy of the dispute.

  **5. Case 13 (Employer Conduct)**
  You are right that "not permissible" is doing two jobs here.
  *   **Firing the organizer:** This violates the foundational right of **Collective Agency**. It should be **legally prohibited**.
  *   **Captive audience meetings:** This violates **Procedural Fairness**. It is blameworthy and should be prohibited in a *Code of Conduct*, but you are right to be less confident about legal prohibition (due to free speech tensions).
  *   *Advice:* Move Case 13 to a separate "Employer Conduct" section of your Code. It does not belong in the "Industrial Action" section, which governs workers. However, a strike *to gain recognition* (responding to Case 13) is justified under Tier 1.1.

  ### The Unsettled Case: The General Strike

  **Verdict: Permissible.**

  **Reasoning:** This falls under **Tier 1.4 (Constitutional)**.
  Case 7 is impermissible because it asks a *private employer* to lobby the government. That misuses the employment relationship. A General Strike, however, is not a dispute with the employer; it is a dispute with the *state* regarding the rules of the game itself.
  If the labor federation exists to balance power, and the government tilts the scale fundamentally (e.g., abolishing collective bargaining), the General Strike is the only tool commensurate with the threat. It is the "nuclear option" of democratic labor relations.
  *Note:* This requires you to slightly refine your intuition on Case 7. Case 7 is "No" because the *employer* is the hostage. The General Strike is "Yes" because the *government* is the adversary.

  ### The Three New Cases

  **1. Air Traffic Controllers (Regional Hub)**
  **Verdict: Not Permissible.**
  **Reasoning:** Violates **Tier 2.3 (Safety/Proportionality)**.
  Unlike nurses (Case 2), who can staff emergency departments, air traffic control is a systemic safety function. A walkout creates immediate, unmitigable risk to public safety (crashes) and disproportionate economic harm to travelers who have no alternative. Unless they can guarantee a "safety skeleton" that maintains separation (which is functionally difficult without full staffing), the collateral damage exceeds the justification.

  **2. Anti-Automation Strike**
  **Verdict: Permissible.**
  **Reasoning:** Satisfies **Tier 1.1 (Economic)**.
  Job security is a term and condition of employment. While automation is often a management right, resisting the *loss of jobs* is a classic economic strike object. It is not a veto on technology, but a demand for terms (retraining, severance, guarantees) surrounding the change.

  **3. Union Security Clause (Union Shop)**
  **Verdict: Permissible.**
  **Reasoning:** Satisfies **Tier 1.1 (Economic)**.
  This is a demand regarding the terms of the bargaining unit's stability. It is an internal rule of the labor market, not a political demand on the state. (Note: Whether it is *legal* depends on jurisdiction, but under this *Code of Conduct*, it is a permissible object of a strike).

  ### Summary of Overturned/Refined Verdicts

  To make this principle work, you must accept three refinements to your gut instincts:

  1.  **Case 10 (Work-to-Rule):** You called it "Permissible, but troubling." The principle makes it **Impermissible if undisclosed**. It must be declared as a strike to be legitimate.
  2.  **Case 11 (Permanent Replacements):** You listed this as "Not permissible." This is an *employer* action. Your Code should prohibit it, but it does not belong in the *strike justification* principle. It belongs in a "Fair Bargaining" section. The strike principle assumes the employer will try to replace; the strike's legitimacy depends on the *workers'* conduct, not the employer's response.
  3.  **Case 7 (Software/Political):** You were "least sure" here. The principle holds this as **Not Permissible**, distinguishing it sharply from the General Strike. If you accept the General Strike as Permissible (Tier 1.4), you must hold Case 7 as Impermissible to maintain the boundary between *systemic defense* and *commercial lobbying*.

  ### Final Advice on Structure

  Your Code of Conduct should have two distinct articles:
  1.  **Right to Industrial Action:** (The Principle above). Governs *when* and *how* workers strike.
  2.  **Employer Conduct During Disputes:** Governs replacements, organizing interference (Case 13), and bargaining bad faith.

  This separates the "blameworthy" from the "prohibitable." Violations of Article 1 are misconduct by the union. Violations of Article 2 are misconduct by the employer. Mixing them (as in your Case 11 and 13) creates the confusion you are experiencing.
