          *   *Friend's argument:* She likely assumes a single-life ledger, which makes karma vulnerable to moral luck (why was I born poor?).

      *   *(c) Causal vs. Normative:*
          *   Causal: "If you punch people, they might punch back." (Empirical)
          *   Normative: "If you punch people, the Universe *owes* you a punch." (Metaphysical)
          *   The friend is treating a causal metaphor as a normative guarantee.

  5.  **Address the Moral Luck Objection:**
      *   *User's Point:* Luck undermines desert. (e.g., Two drunk drivers, one hits a kid, one gets home safe. Same intent, different outcome/reaping).
      *   *Friend's Defense:* "You reap what you sow" implies the universe balances it out.
      *   *Analysis:* The slogan *fails* against moral luck if interpreted as immediate, visible outcome-based desert. It only works if interpreted as invisible, long-term, intent-based karmic imprinting.
      *   *Verdict:* The friend's usage is philosophically weak because she's using a folk proverb to defend a complex metaphysical system without the necessary machinery (reincarnation, intent-focus) to make it work.

  6.  **Drafting the Response (Iterative refinement):**
