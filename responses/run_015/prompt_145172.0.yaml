  2.  **Deconstruct "You Reap What You Sow":**
      *   *Literal meaning:* Agricultural causality. Plant corn, get corn. Plant weeds, get weeds.
      *   *Metaphorical meaning:* Actions have consequences.
      *   *Moral meaning:* Good actions lead to good rewards; bad actions lead to bad punishment (Desert).

  3.  **Develop the "Menu of Readings":**
      *   I need to categorize the interpretations from weakest (tautology) to strongest (robust moral theory).
      *   *Reading 1: Pure Causality (The Platitude).* Actions have consequences. No moral judgment.
      *   *Reading 2: Prudential Advice (Forward-Looking).* Do good to get good. Instrumental rationality.
      *   *Reading 3: Retributive Justice (Backward-Looking).* You *deserve* what happens based on past action. This is the "Moral Desert" claim.
      *   *Reading 4: Cosmic Accounting (The Karma Specific).* Includes trans-life transfer and precise proportionality.

  4.  **Address the Specific Angles (a, b, c):**

      *   *(a) Intention vs. Outcome:*
          *   *Sowing:* Is it the physical act or the intent?
          *   *Reaping:* Is it the actual result or the karmic imprint?
