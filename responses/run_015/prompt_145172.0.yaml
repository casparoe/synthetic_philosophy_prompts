prompt: |-
  I just got out of this exhausting argument with my friend about karma and moral desert — like, she kept saying "you reap what you sow" like it settled everything about whether people actually deserve what happens to them. I was trying to explain that karma as a theory of moral desert is way more specific than that proverb, but she just rolled her eyes and said I was overanalyzing, and now I'm sitting in a coffe shop trying to figure out if I was actually right.

  Can you unpack "you reap what you sow" into the distinct precise theses it could be expressing? I want a menu of readings: which ones are just platitudes about causality, which ones are substantive normative claims about proportional desert, and which ones are false once you think about moral luck. In particular I'm stuck on three weird angles — (a) desert that tracks only intentional mental states versus desert that tracks outcomes regardless of intention, (b) whether karma allows for inherited or transferred moral debt across lives, like some kind of compound-interest ledger, and (c) whether the whole thing is just a causal metaphor with zero normative bite. She was using the line to shut down my point that luck undermines desert, so I need to know which precise reading actually supports using the slogan to defend karma against moral-luck objections, which ones collapse, and whether "desert" here is backward-looking retribution or forward-looking motivation or both. Sorry if thats rambling, my brain is definately fried.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user just had an exhausting argument with a friend about karma and moral desert. The friend used "you reap what you sow" as a trump card. The user feels this is an oversimplification.
      *   **Goal:** The user wants to unpack the proverb "you reap what you sow" into distinct, precise theses to see which ones hold up, especially regarding moral luck, intention vs. outcome, trans-life debt, and normative vs. causal claims.
      *   **Specific Angles to Address:**
          *   (a) Intentional mental states vs. outcomes regardless of intention.
          *   (b) Inherited/transferred moral debt (compound-interest ledger across lives).
