answer: |-
  First, take a deep breath and a sip of that coffee. You are not overanalyzing; you are doing philosophy. Your friend was wielding a folk proverb like a sledgehammer, while you were trying to use a scalpel. The friction comes from the fact that "you reap what you sow" is linguistically ambiguous—it slides between describing how nature works and prescribing how justice *should* work.

  To settle your brain, let's break this slogan down into a **Menu of Readings**. We will move from the weakest (tautological) to the strongest (metaphysically heavy) claims. Then we will apply your three specific angles to see which version, if any, survives the "moral luck" objection.

  ### The Menu of Readings

  **1. The Causal Platitude (Weak/Descriptive)**
  *   **Thesis:** Actions have consequences.
  *   **Nature:** Empirical observation.
  *   **Verdict:** True, but morally empty. If you sow thistles, you get thistles. If you punch a wall, your hand hurts.
  *   **Relation to Desert:** None. This is physics/biology, not ethics. It doesn't mean you *deserve* the pain, only that you caused it.
  *   **Defense against Moral Luck:** Fails. Moral luck is precisely about cases where actions *don't* have proportional consequences (e.g., the drunk driver who gets home safe vs. the one who hits a pedestrian).

  **2. The Prudential Advice (Forward-Looking/Instrumental)**
  *   **Thesis:** If you want good outcomes, perform good actions.
  *   **Nature:** Strategic advice.
  *   **Verdict:** Generally useful heuristics.
  *   **Relation to Desert:** None. This is about self-interest, not justice. It says nothing about whether you *deserve* punishment for past acts, only what you should do now to optimize the future.
  *   **Defense against Moral Luck:** Irrelevant. It doesn't address whether past suffering was deserved.

  **3. The Retributive Claim (Backward-Looking/Normative)**
  *   **Thesis:** The quality of your current experience is a *just reward or punishment* for your past actions.
  *   **Nature:** Moral judgment.
  *   **Verdict:** Controversial. This is the claim that the universe is a moral judge.
  *   **Relation to Desert:** High. This asserts that current status (wealth, health, suffering) is *merited*.
  *   **Defense against Moral Luck:** **Collapses immediately.** This is the version your friend was likely using. It fails because of "Resultant Luck." If two people intend the same harm, but one succeeds and one fails, they do not "reap" the same outcome. If "reaping" is visible suffering/success, the system is visibly unjust.

  **4. The Cosmic Accounting System (Metaphysical/Karmic)**
  *   **Thesis:** There is a precise, invisible ledger where volition (intent) is recorded and matures across timelines (lives) until equilibrium is reached.
  *   **Nature:** Metaphysical doctrine.
  *   **Verdict:** Unfalsifiable.
  *   **Relation to Desert:** Absolute.
  *   **Defense against Moral Luck:** **Only this version survives.** It solves moral luck by expanding the timeline (reincarnation) and shifting the "seed" from outcome to intent.

  ---

  ### Unpacking Your Three Weird Angles

  Here is where we determine if you were right to be frustrated.

  #### (a) Intentional Mental States vs. Outcomes
  *   **The Proverb's Ambiguity:** "Sowing" sounds like an physical act (planting seeds). In the folk version, if you plant a bomb and it doesn't go off, you didn't "sow" destruction, so you don't "reap" punishment.
  *   **The Karmic Reality:** In classical Indian philosophy (Buddhism/Hinduism), *Karma* literally means "action," but morally relevant karma is defined by *Cetana* (volition/intent).
  *   **The Conflict:** Your friend is likely using the **Outcome** reading (bad things happen to bad people). You are intuitively sensing the **Intent** reading (bad intent creates bad karmic imprints, regardless of outcome).
  *   **Who is right?** If you use the Outcome reading, moral luck destroys the theory (the lucky drunk driver "reaps" safety despite sowing danger). If you use the Intent reading, the theory holds, but "reaping" is no longer visible worldly success/failure—it's an internal psychic stain. Your friend cannot have it both ways: she can't point to visible success as proof of karma while ignoring visible luck.

  #### (b) Inherited/Transferred Moral Debt (The Compound-Interest Ledger)
  *   **The Problem:** If "you" are just this current biological organism, inherited debt is unjust. Why should I reap poverty because of a "seed" sown before I existed? That is the definition of moral luck (luck of birth).
  *   **The Karmic Solution:** The theory requires **Non-Self (Anatta)** or a **Continuum of Consciousness**. The "you" that sowed is not identical to, but is causally continuous with, the "you" that reaps.
  *   **The Friend's Error:** If she is using "you reap what you sow" to justify why someone is suffering *now* (e.g., "they must have done something to deserve that cancer"), she is invoking a trans-life ledger but applying it to a single-life framework.
  *   **Verdict:** Without the mechanism of rebirth/transference, the "debt" model collapses into victim-blaming. With it, it becomes unfalsifiable metaphysics. Either way, using it as a casual conversation stopper is philosophically dishonest.

  #### (c) Causal Metaphor vs. Normative Bite
  *   **Causal:** "If you scream at people, they will scream back." (Psychological causality).
  *   **Normative:** "If you scream at people, the Universe *owes* you a scream." (Cosmic Justice).
  *   **The Slip:** The proverb works because it disguises a Normative claim as a Causal one. It sounds like a law of nature (gravity), but it's actually a claim about justice.
  *   **Moral Luck Objection:** Moral luck attacks the **Normative** claim. It shows that the "Causal" link between Morality and Outcome is broken in the real world.
  *   **Verdict:** You are right. The slogan has zero normative bite unless you assume a supernatural enforcement mechanism. If there is no cosmic judge, "reaping" is just random chance mixed with causality.

  ---

  ### The Showdown: Defending Karma Against Moral Luck

  You asked which precise reading supports using the slogan to defend karma against moral-luck objections.

  **The Hard Truth:** The colloquial slogan **"You reap what you sow" cannot defend karma against moral luck.**

  Here is why:
  1.  **Moral Luck** demonstrates that *outcomes* are not under our control.
  2.  **The Slogan** implies a tight link between *sowing* (action) and *reaping* (outcome).
  3.  **The Contradiction:** If luck dictates outcomes, then you often reap *without* sowing (good luck) or sow *without* reaping (bad luck).

  **The Only Defense:**
  To save the theory, you must change the definition of "Reap."
  *   **Folk Definition:** Reaping = Worldly success/failure (Money, Health, Status).
  *   **Philosophical Definition:** Reaping = Karmic Imprint on the Consciousness.

  If your friend argues, "He got cancer because of bad karma," she is using the **Folk Definition**. This is vulnerable to moral luck (why did the saint get cancer?).
  If you argue, "He got cancer due to biological causes, but his *reaction* to it is where his karma is generated," you are using the **Philosophical Definition**.

  **Was your friend right?**
  No. She used a proverb that conflates *natural consequences* with *moral desert* to shut down a valid objection about luck. She treated a complex metaphysical claim (Karmic Retribution) as a self-evident natural law.

  **Were you right?**
  Yes. You identified that "desert" requires a control condition (you can only deserve what you control). Luck undermines control. Therefore, luck undermines desert. The slogan "you reap what you sow" ignores the role of luck in the "reaping" phase.

  ### Summary for your next coffee (or text to her)

  If you want to send a peace-offering explanation, try this distinction:

  > "I was thinking about our argument. I think we were using 'You reap what you sow' differently.
  >
  > 1.  **As Causality:** It's true. Actions have consequences. But luck interferes with consequences (e.g., the drunk driver who gets home safe).
  > 2.  **As Justice:** It claims we *deserve* those consequences. This only works if 'sowing' means **intent** and 'reaping' happens over **multiple lives**.
  >
  > If we mean it as simple justice in *this* life, moral luck proves it false (bad people succeed, good people suffer). If we mean it as a complex karmic ledger across lives, it's unfalsifiable but we can't point to specific suffering as 'proof.' I was stuck on the fact that the slogan hides this huge difference."

  You weren't overanalyzing. You just noticed that the slogan is a **category error** masquerading as wisdom.
