answer: |-
  **Decision Tree: Solutions to the Panpsychist Combination Problem**

  **Start:** You accept mentality is fundamental and ubiquitous.

  1.  **Exclusion Case:** Suppose micro-experiences are causally inert, with all causal work done by physical structure. Does the theory still get anything from them, or have they been quietly excluded?
      *   **No (Excluded):** Proceed to 2.
      *   **Yes (Causal Efficacy):** Proceed to 5.

  2.  **Photon Case:** Consider a single electron in a vacuum. Does it possess a full subject of experience or merely proto-experiential properties?
      *   **Yes (Full Subject):** Proceed to 3.
      *   **No (Proto-Properties):** **Leaf: Russellian Monism** (Awkward commitment: Physical science describes only relational structures, leaving intrinsic natures forever hidden.)

  3.  **Fusion Case:** Two beings with separate visual fields are surgically joined into one body with one unified visual field. Does the unified field consist of the two prior fields, or does something new come into existence?
      *   **Yes (Consists of prior):** Proceed to 4.
      *   **No (Something New):** **Leaf: Bottom-up Panpsychism with Emergence** (Awkward commitment: Consciousness emerges from consciousness, violating the fundamental nature of the base level.)

  4.  **Boundary Case:** Is there a sharp spatial boundary where your subject ends and the chair's begins?
      *   **Yes (Sharp):** **Leaf: Bottom-up Panpsychism with Constitution** (Awkward commitment: Macro-subjects are literally composed of micro-subjects, implying you are a collection of billions of tiny minds.)
      *   **No (Vague):** **Leaf: Deflationary View** (Awkward commitment: The combination problem is a pseudo-problem generated by imprecise language regarding subjecthood.)

  5.  **Holographic Case:** A scattered, non-contiguous subset of micro-subjects (say, every other electron) realizes the whole experience rather than a part. Does that bother you, and why?
      *   **Yes (Bothers/Needs Locality):** Proceed to 6.
      *   **No (Accepts Holism):** Proceed to 7.

  6.  **Split-Brain Case:** If a corpus callosum is severed, does one subject become two, or were there always two?
      *   **Yes (Becomes Two):** Proceed to 8.
      *   **No (Always Two):** **Leaf: Illusionism about Unity** (Awkward commitment: The sense of being a single unified self is a persistent cognitive error.)

  7.  **Vacuum Case:** Does empty space between particles possess experience independent of the particles?
      *   **Yes (Space Experiences):** **Leaf: Cosmopsychism** (Awkward commitment: The universe is the only true subject, and your individuality is a fragmented illusion.)
      *   **No (Particles Only):** Proceed to 8.

  8.  **Telepathy Case:** Can two subjects share an experience without physical connection?
      *   **Yes:** **Leaf: Unnamed Idealism** (Awkward commitment: Mental relations precede physical structure, contradicting standard physics.)
      *   **No:** **Leaf: Bottom-up Panpsychism with Constitution** (Repeat leaf via causal path.)

  ***

  **Analysis of Leaves and Combinations**

  **Indistinguishable Leaves:** The tree struggles to separate **Bottom-up Panpsychism with Constitution** (Leaf 4-Yes) and **Russellian Monism** (Leaf 2-No). Both rely on intrinsic properties grounding experience, and both face the difficulty of explaining how micro-intrinsic properties sum to macro-intrinsic properties without brute emergence. The tree separates them based on causal exclusion, but Russellian monists often argue their intrinsic properties *are* the causal base, blurring the Yes/No distinction at Node 1.

  **Unoccupied Combinations:**
  1.  **Node 1 (No) + Node 3 (No):** This path leads to epiphenomenalism combined with emergent macro-experience. This combination is **unattractive**. It accepts that micro-experiences do nothing (Node 1) but claims macro-experiences are new existents (Node 3). This doubles the ontological cost without gaining causal leverage, making the view theoretically inefficient.
  2.  **Node 5 (Yes) + Node 7 (Yes):** Accepting holographic realization while denying space possesses experience is **incoherent**. If experience is non-local (Holographic), denying experience to the medium (Space/Vacuum) contradicts the ubiquity commitment required to support non-local realization without physical carriers.

  **Mapping Answer Patterns to Leaves**

  *   **Russellian Monism:** 1-No, 2-No.
  *   **Bottom-up (Emergence):** 1-No, 2-Yes, 3-No.
  *   **Bottom-up (Constitution):** 1-No, 2-Yes, 3-Yes, 4-Yes OR 1-Yes, 5-Yes, 6-Yes, 8-No.
  *   **Deflationary:** 1-No, 2-Yes, 3-Yes, 4-No.
  *   **Illusionism:** 1-Yes, 5-Yes, 6-No.
  *   **Cosmopsychism:** 1-Yes, 5-No, 7-Yes.
  *   **Unnamed Idealism:** 1-Yes, 5-Yes, 6-Yes, 8-Yes.

  *Note: Paths converging on Bottom-up Constitution reflect the difficulty of distinguishing causal stories from constitutive stories without further metaphysical stipulation.*
