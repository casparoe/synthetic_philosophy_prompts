  1. **The Piano Problem**
  I play piano, and if I think about my left hand during a fast run, I crash. Your book says this isn't a bug, it's the architecture: competence first, understanding later. But you also say understanding is mostly for teaching others. So is comprehension just a transmission technology?

  *Follow-up:* If it's just for transmission, who is the audience when I reason something out alone in my head, with no one else around?

  2. **The Social Add-On**
  You call comprehension a "socially-trained add-on." Does that mean if I grew up alone on an island, I'd have all my skills but zero ability to understand them?

  *Follow-up:* If it's purely social, why does it feel so private and internal when I have it?

  3. **The Inversion**
  You equate Darwin's point (design without designer) and Turing's point (thinking without understanding). Are today's big models proving that second inversion, or are they just fancy curve-fitting that's about to hit a wall?

  *Follow-up:* Let's say we disagree now. What criterion could we agree on *today* that would tell us next year whether they hit a wall or if there never was one, without us just moving the goalposts after the fact?

  4. **The Commentary Feedback Loop**
  I have a theory: if we train systems to produce step-by-step reasoning and then train on those traces, we're forcing tacit competence through a lossy verbal channel. Eventually, the system gets replaced by a worse copy of its own explanation. Does your view predict that degradation, and what would be the measurable early sign?

  *Follow-up:* You'll probably say we need those traces for oversight anyway. So let's make it concrete: how much actual competence would you trade for how much legibility before you say the system is too stupid to be safe?

  5. **The Safety Audit**
  You say this is bad news for AI safety thinking that audits reasons. If we can't trust the reasons, are we basically just hoping the black box stays friendly?

  *Follow-up:* If we're just hoping the black box stays friendly, isn't that exactly what we were trying to avoid with safety research?

  6. **The Logistics Test**
  I work in freight logistics. I solve routing problems intuitively faster than I can explain them. Is my job security dependent on staying unable to explain how I do my job?

  *Follow-up:* If AI learns to do the job without explaining it either, does that mean the "explanation economy" is a bubble?

  7. **The Steering Wheel**
  You describe comprehension as "thin." Is it possible that it's thin but essential, like a steering wheel on a truck? It doesn't provide the power, but without it, you crash.

  *Follow-up:* If it's just a steering wheel, why do we keep trying to build engines out of steering wheels in AI?

  8. **The Moral Standard**
  Let's take this to morals. If human moral judgment is also competence without comprehension, then demanding an AI explain its values is holding it to a standard we fail. Do we give up explanation as a safety tool, or hold machines to standards humans can't meet?

  *Follow-up:* Your likely answer is we should rely on behavior instead. But how do you tell a system that's genuinely fine off-distribution from one that's just performing well on whatever we happened to test, with no appeal to reasons?

  9. **The Introspective Illusion**
  You have a catch-all move: whenever anyone reports understanding something, you say "that's just the introspective illusion again." Is there any experience of understanding you would accept as real, or is the feeling of comprehension always just a story we tell ourselves after the fact?

  *Follow-up:* If I say "I understand this logistics problem" and then I solve it successfully every time, but you say the understanding is still an illusion, what work is the word "illusion" doing there besides telling me I'm wrong?

  10. **The Abandon Condition**
  Finally, what evidence would actually make you abandon the view?

  *Follow-up:* If that evidence shows up, do you concede that comprehension drives competence, or just that they co-evolved?
