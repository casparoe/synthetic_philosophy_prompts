answer: |-
  This is a fantastic scenario. You and your friends have accidentally recreated one of the most active debates in modern philosophy, specifically in a field called **Social Epistemology**. The specific problem is known as the **Problem of Peer Disagreement**.

  Philosophers like David Christensen, Adam Elga, and Thomas Kelly have written entire careers arguing about exactly what Owen and Lena are arguing about. Because this is a live debate in philosophy, there isn't a single "proven" answer, but there are standard evaluations of who is making the stronger logical moves based on the current literature.

  Here is a breakdown of who is right about each specific point, what they are missing, and my final verdict.

  ### Point-by-Point Analysis

  #### 1. Splitting the Difference vs. Double-Counting
  *   **Owen's Claim:** You should split the difference (move from 80% toward 50%) because the peer's belief is evidence.
  *   **Lena's Claim:** This is double-counting. You already accounted for their reliability in your original 80%, so updating again counts their opinion twice.
  *   **Who is right:** **Owen.**
  *   **Why:** Lena's "double-counting" objection is a very common intuition, but most epistemologists consider it a misunderstanding of how evidence works. Your original 80% confidence was based on *your* evidence (charts, news, data). Your friend's belief is *new* evidence. It is "higher-order evidence"—evidence about how reliable your processing of the first evidence was.
      *   *Analogy:* Imagine you calculate a math problem and get 50. You are 80% sure you're right. Then a math tutor you trust looks at it and says, "I got 20." You wouldn't say, "I already trusted the tutor when I did my work, so I'll ignore them." You would realize that the tutor's answer is new data suggesting you made a calculation error. Owen is correct that the disagreement itself is a new data point that requires an update.

  #### 2. The "New Information" Argument
  *   **Owen's Claim:** The fact of disagreement is brand new information ("at least one of us is wrong").
  *   **Lena's Claim:** (Implicitly accepts this but pivots to asymmetry).
  *   **Who is right:** **Owen.**
  *   **Why:** This is the core of the "Equal Weight View." Before they spoke, Owen didn't know how Lena's brain processed the data. Finding out that a similarly equipped brain processed the same data and got a different result is powerful information. It suggests that the evidence is more ambiguous than Owen originally thought. Owen is right that this forces a "conciliatory" move (lowering confidence).

  #### 3. Asymmetry in Research (The "Right Reasons" Move)
  *   **Lena's Claim:** The rule only works if you are truly equally reliable. If I did more research, I'm not a peer on this question, so I don't need to lower my confidence.
  *   **Owen's Claim:** Concedes this specific point but holds the principle holds for symmetric cases.
  *   **Who is right:** **Lena.**
  *   **Why:** This is known as the "Right Reasons View" (championed by philosopher Thomas Kelly). "Peerhood" isn't a global status; it is relative to the specific question and evidence at hand. If Lena actually has more data (e.g., she spoke to the CEO and Owen didn't), she is *not* an epistemic peer on this specific trade, even if they are generally equally smart. In this specific instance, Lena is right that she shouldn't conciliate if she knows she has superior evidence. Owen correctly concedes this, as the "Equal Weight View" only applies when evidence and ability are truly symmetric.

  #### 4. The Self-Undermining Objection
  *   **Lena's Claim:** The "split the difference" rule is self-undermining. If you meet a peer who disagrees with the rule itself, you must lower your confidence in the rule, eventually making it unusable.
  *   **Owen's Claim:** (Didn't directly answer, but implies the principle holds).
  *   **Who is right:** **Lena (with caveats).**
  *   **Why:** This is a famous and devastating objection to strict Conciliationism (often called the "Self-Defeat Objection"). Logically, Lena is correct: if the rule says "always split the difference with peers," and a peer says "this rule is wrong," a strict follower must lower their confidence in the rule. If they lower it enough, they can't justify using the rule anymore.
      *   *The Caveat:* Proponents of Owen's view (like Christensen) argue that the rule is a "normative principle" (how you *should* think) rather than a regular belief, so it doesn't update the same way. However, Lena is right that this creates a major logical tension for Owen's side that is hard to resolve cleanly.

  ### What Both of Them Are Missing

  While Owen and Lena cover the main philosophical bases, they are missing three crucial nuances that determine what you should actually *do* in real life:

  1.  **Domain Specificity:** The rules for disagreement change depending on the topic. In math or logic (where there is one right answer), Owen is almost certainly right; if a peer disagrees, one of you made a mistake. In matters of taste, aesthetics, or complex stock market predictions (where probability and risk tolerance matter), Lena might be right to stay steadfast. The stock market isn't a math problem; it's a complex system where two rational people can look at the same data and legitimately bet differently based on risk profiles.
  2.  **Pragmatic Encroachment:** They are arguing about *belief*, but this is about *action*. Even if Owen is right that they should lower their confidence to 50%, that doesn't mean they should do nothing. If the potential upside is huge and the downside is capped, a 50% confidence might still warrant a buy. They are conflating "what should I believe?" with "what should I do?"
  3.  **The Definition of "Peer":** They treat "peer" as a binary switch (either they are or they aren't). In reality, peerhood is a spectrum. You might trust your friend 90% as much as yourself on tech stocks, but only 50% as much on biotech. The update shouldn't be a hard "split the difference," but a weighted average based on exactly how much you trust them *in this domain*.

  ### The Verdict

  If I have to pick one of them as more right overall, I pick **Owen**.

  Here is why: While Lena wins on the specific technical objections (the research asymmetry and the self-undermining paradox), Owen wins on the **fundamental principle of rationality.**

  Lena's position (often called "Steadfastness") carries a high risk of **epistemic egoism**. If you follow Lena's logic too broadly, you can always find a reason to dismiss disagreement ("I thought about it harder," "I have a better gut feeling," "They don't get this specific nuance"). This makes it impossible to learn from others.

  Owen's position (Conciliationism) preserves the social value of knowledge. It acknowledges that we are often blind to our own errors, and a disagreement from a trusted source is the best alarm system we have for those errors. Even though the "self-undermining" objection is a logical headache, it is a technical problem that philosophers are working on. The practical danger of Lena's view—ignoring smart people because you think you're right—is a much bigger threat to finding the truth.

  **Summary:** Lena is right about the *exceptions* (asymmetry) and the *logical paradoxes*, but Owen is right about the *rule*. In a world where we want to be correct, we should act more like Owen.
