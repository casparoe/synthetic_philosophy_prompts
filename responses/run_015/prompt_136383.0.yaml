      *   Case 1: $A$ false at $w$. $A \supset C$ true. $A \to C$ depends on $f(A, w)$. Could be false. So $A \to C$ does *not* entail $A \supset C$ in the sense that truth of conditional guarantees truth of material?
      *   Wait. If $A$ is false at $w$, $A \supset C$ is true. So if $A \to C$ is true, $A \supset C$ is true (because consequent is true).
      *   Case 2: $A$ true at $w$. Then $f(A, w) = w$. If $A \to C$ true, then $C$ true at $w$. If $C$ true at $w$ and $A$ true at $w$, then $A \supset C$ true.
      *   So in all cases, if $A \to C$ is true, $A \supset C$ is true.
      *   So $(A \to C) \models (A \supset C)$.
      *   So $Cr(A \to C) \le Cr(A \supset C)$ is guaranteed by the semantics.
      *   So (7) is not a tension with (3). It is a consequence.
