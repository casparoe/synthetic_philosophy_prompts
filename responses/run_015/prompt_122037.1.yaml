prompt: |-
  I cover science and ideas for a daily newspaper, and for fifteen years I have worked inside our verification machinery: the two-source rule, off the record and on background, the requirement that a claim be publishable only if someone with a name and a stake will own it, the difference between we checked this and this is checkable, corrections as the only public record of our error rate, and the quiet standing assumptions underneath all of it. I keep running into the view that some of our commitments are hinges in Wittgenstein's sense, as developed in the late notebooks published posthumously as On Certainty and by the epistemologists who have built on them: not premises we have tested but the fixed points that make testing possible, exempt from doubt not because they are especially certain but because a doubt directed at them would have nothing to stand on. I would like that position in my vocabulary rather than in epistemology's.

  First, translate it as faithfully as you can, as a claim about what a newsroom does rather than about what an individual believes. My own first pass is that a standard is not itself sourced, and demanding a source for it is a category mistake. Tell me where that pass distorts the position, and then give the strongest version you can manage in my terms, including whatever in the position resists the word standard.

  Second, the residue report: which claims translate cleanly, which survive only with violence, and which have no expression at all in my vocabulary. For each piece of residue, say whether it reveals a gap in how newsrooms think or a place where the philosophical claim was doing less work than its formulations suggest. I want the honest version, not the reassuring one.

  Third, apply the translation to three candidates from my own practice: that my recorder captured what was said and my notes mean what I meant, that the world described in yesterday's paper is the same world as today's, and that an official denial is reportable while the absence of one is not. Which of these would the position count as hinges, which are merely badly supported empirical beliefs wearing the costume of method, and what test would separate them?

  Finally, two puzzles. When our desk retired the both-sides convention for settled climate findings, we experienced it as a decision, and within a year it looked as though it had always been compulsory: can the hinge story describe such a shift as anything other than an unargued change plus hindsight? And if a hinge is whatever a practice cannot doubt, is a newsroom that treats the official account as its default as well-founded as one that does not? Does the view have any resources for distinguishing a hinge from a captured habit, and if it does not, is that a defect in the view or an unreasonable expectation on my part that epistemology should grade practices rather than describe them?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A science and ideas journalist with 15 years of experience in verification machinery (two-source rule, on/off record, corrections, etc.).
      *   **Task:** Translate the philosophical concept of "hinges" (Wittgenstein's *On Certainty*) into newsroom vocabulary/practice.
      *   **Specific Requirements:**
          1.  **Translation:** Faithful translation of the hinge concept into newsroom terms (collective practice, not individual belief). Critique the user's first pass ("a standard is not itself sourced..."). Provide the strongest version.
          2.  **Residue Report:** Identify what translates cleanly, what survives with violence, and what has no expression. Analyze whether residues reveal newsroom gaps or philosophical overreach. Be honest, not reassuring.
          3.  **Application:** Apply the translation to three specific candidates: (a) recorder/notes accuracy, (b) continuity of the world (yesterday vs. today), (c) reportability of denial vs. absence of denial. Classify them (hinge vs. bad empirical belief) and propose a test.
          4.  **Puzzles:** (a) The shift away from "both-sidesism" on climate (decision vs. compulsory hindsight). (b) The status of "official account as default" (well-founded vs. captured habit). Does the hinge view distinguish hinges from habits? Is that a defect in the view or the user's expectation?

  2.  **Deconstruct the Philosophical Concept (Wittgenstein's Hinges):**
      *   *On Certainty:* Hinges are propositions that look like empirical claims but function as rules of the game.
      *   *Key features:* They are exempt from doubt *within* the system. Doubting them stops the inquiry. They aren't "known" (justified true belief); they are the scaffolding that allows knowing.
      *   *Example:* "The earth has existed for many years." "I have two hands."
      *   *Newsroom analogy:* "Sources must be named," "Corrections fix errors." These aren't proven true; they are the conditions under which truth-claims are made.

  3.  **Drafting Section 1: Translation:**
      *   *User's Pass:* "A standard is not itself sourced, and demanding a source for it is a category mistake."
      *   *Critique:* This is too procedural. It sounds like a style guide rule. Hinges aren't just unsourced standards; they are the *preconditions* for the standard to function. It implies the standard exists "out there." Hinges are embedded in the *doing*.
      *   *Better Translation:* Focus on "operating assumptions" or "infrastructure of verification." Instead of "standard," use "ground rule" or "constitutive practice."
      *   *Strongest Version:* "A hinge is a practice-condition that cannot be verified by the practice it enables." It's not that we *believe* it; it's that we *act* as if it's true to do anything else.
      *   *Refining the vocabulary:* Avoid "belief." Use "working assumption," "verification precondition," "editorial bedrock."
      *   *Key distinction:* It's not that we *can't* doubt it, but that doubting it collapses the newsroom's ability to produce news.

  4.  **Drafting Section 2: Residue Report:**
      *   *Clean Translations:* "Corrections imply error is possible." "Sources must be identifiable." These map well to verification machinery.
      *   *Violent Translations:* "Truth." Wittgenstein avoids truth claims for hinges; newsrooms claim to seek truth. "Objectivity." Hinges are local to a language game; newsrooms claim universal applicability.
      *   *No Expression:* The *fluidity* of hinges. Wittgenstein says hinges can change (riverbed shifts). Newsrooms treat their bedrock as permanent until a crisis forces change.
      *   *Analysis:*
          *   Gap in newsroom thinking: We treat methodological choices as moral imperatives or discovered truths rather than contingent scaffolding.
          *   Philosophical overreach: Epistemology describes *any* system; journalism claims to describe *the world*. The friction is between "how we work" and "how the world is."

  5.  **Drafting Section 3: Application to Candidates:**
      *   *Candidate 1 (Recorder/Notes):* "My recorder captured what was said."
          *   *Verdict:* Hinge. If you doubt this, you can't report *anything*. It's a precondition of the interview.
      *   *Candidate 2 (World Continuity):* "Yesterday's world is today's world."
          *   *Verdict:* Hinge. If the world resets daily, news is impossible.
      *   *Candidate 3 (Denial vs. Absence):* "Official denial is reportable; absence is not."
          *   *Verdict:* Bad empirical belief/Captured Habit. This is a policy choice, not a metaphysical necessity. It can be tested (does publishing absence yield better info?).
      *   *The Test:* The "Collapse Test." If I doubt this, does the specific reporting task stop (Hinge), or does the reporting just change shape (Policy/Belief)?

  6.  **Drafting Section 4: The Puzzles:**
      *   *Puzzle 1 (Climate/Both-sides):*
          *   *Hinge View:* Hinges *do* shift (riverbed metaphor). The shift wasn't unargued; the *arguments* happened at the level of empirical claims until the weight shifted the bedrock. It looks like hindsight because once a hinge moves, it looks solid again.
          *   *Newsroom experience:* We felt it as a decision because we were conscious of the riverbed moving.
      *   *Puzzle 2 (Official Account/Captured Habit):*
          *   *The Problem:* Wittgenstein doesn't grade hinges (good vs. bad). A cult has hinges; a newsroom has hinges.
          *   *Distinction:* Hinges are about *internal coherence*, not *external accuracy*.
          *   *Defect vs. Expectation:* It is a defect in the view *if you want normative guidance*. Wittgenstein is descriptive. The user wants epistemology to grade practices. Epistemology describes the structure of justification, not the moral worth of the system.
          *   *Newsroom implication:* A newsroom treating official accounts as default *is* well-founded *relative to its own hinges*. To judge it, you need external criteria (e.g., democratic utility), which *On Certainty* doesn't provide.

  7.  **Review and Refine:**
      *   *Tone:* Professional, intellectual, respectful of the user's expertise. Avoid condescension. Match the user's density and precision.
      *   *Check:* Did I answer the "category mistake" critique? Yes. Did I address the "standard" vs. "hinge" resistance? Yes.
      *   *Check:* Is the residue report honest? Yes, highlighting the tension between descriptive epistemology and normative journalism.
      *   *Check:* Are the three candidates clearly distinguished? Yes.
      *   *Check:* Are the puzzles answered without dodging the hard implication (that epistemology doesn't judge truth, only structure)?

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to sound like I'm teaching Wittgenstein to a journalist. Assume they know the theory and want the *application*.
      *   *Emphasis:* Highlight that "hinge" implies *action*, not just *thought*. Newsrooms are practical engines.
      *   *Refining the "Official Account" point:* This is crucial. If hinges can't be judged, does that mean propaganda is epistemologically equal to journalism? Yes, structurally. The difference is in the *goals*, not the *hinges*. I need to make this clear.

