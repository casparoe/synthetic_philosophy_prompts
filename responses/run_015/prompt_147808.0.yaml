answer: |-
  ### I. Reframing the Distinction

  Your three-way distinction (Answer, Route, Detection) is accurate but passive. In an AI-assisted environment, "Route" is often obscured or non-existent (probabilistic token generation), and "Detection" is the only ethical lever you possess.

  Replace it with **The Three Competence Gates**. These are active filters for your signature:

  1.  **Validity (The "What"):** Are the citations real, the quotes accurate, and the procedural posture correct?
      *   *AI Role:* High. AI can help verify.
      *   *Human Role:* Verification.
  2.  **Vulnerability (The "What If"):** Does the author know the weakest link, the contrary authority, and the factual change that defeats the argument?
      *   *AI Role:* None. AI optimizes for plausibility, not adversarial stress-testing.
      *   *Human Role:* Generation.
  3.  **Agency (The "Why"):** Did the attorney make the strategic choice to advance this argument, or did the tool select it? Can they reconstruct the logic without the text?
      *   *AI Role:* None.
      *   *Human Role:* Ownership.

  **The Ethical Anchor:** Your signature certifies **Vulnerability** and **Agency**. Validity is a baseline; the other two are the practice of law. If Validity is high but Vulnerability/Agency are low, the draft is a "Black Box Brief." You cannot sign it.

  ---

  ### II. The Procedure: The 30-Minute Agency Audit

  This procedure is designed for your 30-minute review window. It requires the attorney to be available (in person or synchronous chat) for 10 of those minutes. The other 20 are your independent review.

  **Constraint:** You are **forbidden** from inputting the draft into an AI tool during this review. You must rely on your own cognition to test theirs.

  #### Phase 1: Independent Scan (10 Minutes)
  *Goal: Catch Type A (Visible) Failures.*

  1.  **Question:** Are all citations pinned and do the parentheticals match the actual holding?
      *   **Sufficient Answer:** Random spot-check of 3 citations confirms accuracy.
      *   **Failure Type:** Type A (Visible).
      *   **Time Budget:** 5 mins.
  2.  **Question:** Is there a "Contrary Authority" section or signal?
      *   **Sufficient Answer:** Explicit citation of binding adverse case with distinguishing language, OR a note stating "No adverse binding authority found after [Database] search."
      *   **Failure Type:** Type B (Invisible). *AI often omits contrary law to maximize persuasion.*
      *   **Time Budget:** 5 mins.
      *   **Stop Point:** If no contrary authority is acknowledged in a nuanced case, **STOP**. Return to attorney. Do not sign.

  #### Phase 2: The Interrogation (10 Minutes)
  *Goal: Test Type B (Invisible) Failures via Proxies for Understanding.*
  *Conduct this synchronously with the attorney.*

  3.  **Question (The "Blank Page" Test):** "Close the draft. In two sentences, tell me why the court *must* rule for us based on [Controlling Case]. Do not quote the brief."
      *   **Sufficient Answer:** Articulation of the logical nexus (e.g., "Because the officer lacked X, which [Case] defines as Y, the fruit is poisoned.").
      *   **Insufficient Answer:** Restating the conclusion ("Because the search was illegal.") or reading from the draft.
      *   **Failure Type:** Type B (Invisible). Tests **Agency**.
      *   **Time Budget:** 3 mins.
      *   **Stop Point:** If they cannot answer, **STOP**. The argument is withdrawn.
  4.  **Question (The "Killer Fact"):** "What single fact, if changed, would make us lose this motion?"
      *   **Sufficient Answer:** Identification of a specific factual predicate (e.g., "If the defendant had consented.").
      *   **Insufficient Answer:** "If the judge disagrees."
      *   **Failure Type:** Type B (Invisible). Tests **Vulnerability**.
      *   **Time Budget:** 3 mins.
      *   **Stop Point:** If they cannot identify a failure condition, **STOP**. They do not understand the boundaries of the argument.
  5.  **Question (The "Tool Reliance"):** "Which part of this draft did the AI write, and which part did you write?"
      *   **Sufficient Answer:** Specific delineation (e.g., "AI drafted the procedural history and initial case summaries; I wrote the application of law to facts and the policy argument.").
      *   **Failure Type:** Type B (Invisible). Tests **Agency**.
      *   **Time Budget:** 2 mins.
      *   **Decision Point:** If AI wrote the "Application of Law to Facts," this is a **Value Judgment**. You must decide if the attorney has sufficiently edited it to claim ownership. If unsure, **RETURN**.

  #### Phase 3: The Sign-Off (10 Minutes)
  *Goal: Final Verification and Filing.*

  6.  **Question:** "Based on the gaps we found, does this draft still serve the client?"
      *   **Sufficient Answer:** Yes (with edits) or No (argument stripped).
      *   **Time Budget:** 5 mins.
  7.  **Action:** Sign or Reject.
      *   **Time Budget:** 5 mins.

  ---

  ### III. Handling Edge Cases

  #### 1. The "I Can't Tell" + Deadline Tomorrow Scenario
  If the attorney fails Phase 2 (Interrogation) and the deadline is immutable:
  *   **Procedure:** You **cannot sign** the argument they cannot defend.
  *   **Action:** Strip the unsupported argument from the brief. File a narrower motion that the attorney *can* defend.
  *   **Rationale:** Filing a brief the attorney cannot defend violates Model Rule 1.1 (Competence) and 3.3 (Candor). A narrower win is better than a broader loss caused by judicial interrogation at oral argument.
  *   **Disclosure:** Do not disclose AI use to the court unless local rules require it. Disclosing "I don't understand my own brief" is not an option; withdrawing the argument is.

  #### 2. Director's Dependence
  *   **Rule:** You are prohibited from using AI to verify the attorney's answers during Phase 1 or 2.
  *   **Reason:** If you use AI to check their work, you are outsourcing your detection capacity. You become a second layer of AI, not a supervisor.
  *   **Exception:** You may use AI to *find* citations (Phase 1), but not to *evaluate* the attorney's understanding (Phase 2).

  #### 3. What the Procedure Cannot Do
  *   **Guarantees:** It cannot guarantee the law is correct, only that the attorney *believes* they know why it is correct.
  *   **Long-term Erosion:** It cannot stop the slow erosion of your own legal intuition if you rely on this procedure exclusively without doing unassisted work yourself.
  *   **Goodhart's Law:** Attorneys may learn to memorize answers to the "Killer Fact" question without true understanding. (See Section V).

  ---

  ### IV. Running the Procedure on Three Cases

  #### Case 1: The "Hollow Win" (Motion to Suppress)
  *   **Shape:** Motion is legally sound, likely to win. Drafted in 20 mins. Attorney cites *State v. Smith* correctly.
  *   **Phase 1 (Scan):** Citations check out. No contrary authority listed (Type B Risk).
  *   **Phase 2 (Interrogation):**
      *   *Blank Page:* Attorney hesitates. Says, "The AI said *Smith* applies because of the timeline." Cannot articulate the specific legal test *Smith* established without looking at the screen.
      *   *Killer Fact:* Attorney says, "If the timeline was different." (Vague).
  *   **Result:** **FAIL.**
  *   **Action:** **DO NOT SIGN.** Return to attorney.
  *   **Why You Won't Like It:** This is a winning motion. By rejecting it, you are delaying relief for the client to fix a training issue.
  *   **What To Do:** You must hold the line. If the attorney cannot articulate the rule, they cannot handle the judge's questions at the hearing. The win is illusory. Force the attorney to spend 2 hours re-learning the doctrine before you sign.

  #### Case 2: The "Boilerplate" (Procedural History)
  *   **Shape:** Machine-drafted docket summary. Spot-checked against PACER.
  *   **Phase 1 (Scan):** Citations match docket entries. Dates correct.
  *   **Phase 2 (Interrogation):**
      *   *Blank Page:* N/A (No legal argument).
      *   *Killer Fact:* N/A.
      *   *Tool Reliance:* Attorney admits AI drafted 100% of this section.
  *   **Result:** **PASS (with Caveat).**
  *   **Action:** Sign.
  *   **Caveat:** This is a Type A task. AI is suitable here. However, flag that if the AI hallucinated a filing date, it is a Type A error you are responsible for.
  *   **Why:** This task requires Validity, not Agency.

  #### Case 3: The "Novel Argument" (Verified)
  *   **Shape:** Attorney found a new angle with AI, then read the cases.
  *   **Phase 1 (Scan):** Citations real. Contrary authority distinguished.
  *   **Phase 2 (Interrogation):**
      *   *Blank Page:* Attorney clearly explains the analogy. "The AI found the parallel, but I verified the factual match."
      *   *Killer Fact:* "If the court finds this issue was preserved differently in *Jones*, we lose."
  *   **Result:** **PASS.**
  *   **Action:** Sign.
  *   **Why:** High Agency, High Vulnerability awareness. The tool was a research clerk, not the advocate.

  ---

  ### V. Systemic Misfires and Risks

  You asked to flag where this procedure will systematically misfire by manufacturing the appearance of understanding.

  1.  **The "Scripted Attorney" Risk:**
      *   **Failure Mode:** Attorneys will begin anticipating your questions. They will ask the AI, "What is the weakest link in this argument?" and memorize the answer before meeting you.
      *   **Result:** They pass Phase 2 without actual understanding.
      *   **Mitigation:** Randomize the interrogation. Ask, "Explain this to me as if I were the trial judge who hates this doctrine," or "Draft the counter-argument you would write if you were opposing counsel."

  2.  **The "Director's Fatigue" Risk:**
      *   **Failure Mode:** After 50 reviews, you will stop listening to the *content* of their answer and start listening for *confidence*. AI-generated text is confident. Attorneys mimicking AI will sound confident.
      *   **Result:** You sign Black Box Briefs because the attorney sounds sure of themselves.
      *   **Mitigation:** You must do unassisted drafting yourself (one brief a quarter) to recalibrate your intuition for what "understanding" feels like versus "recitation."

  3.  **The "Narrowing" Trap:**
      *   **Failure Mode:** Consistently applying the "Deadline Tomorrow" rule (stripping arguments the attorney doesn't understand) will train your office to only file simple, obvious arguments.
      *   **Result:** You stop developing novel jurisprudence for your clients because it takes too long to verify human understanding.
      *   **Mitigation:** Accept that complex cases require more than 30 minutes of your time. Budget 2 hours for "Novel Argument" reviews. Do not apply the 30-minute cap rigidly to high-stakes litigation.

  4.  **The "Invisible Omission" Blind Spot:**
      *   **Failure Mode:** Your Phase 1 Question 2 asks for contrary authority. If the AI omits it, and the attorney doesn't know it exists, they will truthfully answer "None found."
      *   **Result:** Both you and the attorney fail to detect the Type B failure.
      *   **Mitigation:** You must occasionally run a parallel search on 10% of cases *without* showing the attorney the results, to audit their research depth. If they missed a case you found in 10 minutes, the procedure has failed.

  ### Final Directive

  Your signature is not a stamp of **Accuracy**; it is a stamp of **Responsibility**.

  The procedure above is designed to break the "Automation Complacency" loop. It will feel inefficient. It will feel like you are punishing competent work (Case 1). That discomfort is the signal that the procedure is working. It forces the cost of AI efficiency back onto the human operator. If the attorney cannot pay that cost (in understanding), they cannot use the tool for that task.

  **Implement this tomorrow.** Start with Case 1. Reject it. Explain why. The friction is the point.
