      *   **Role:** Director of an appellate legal-aid unit.
      *   **Problem:** Staff attorneys use AI for drafting. Work is technically correct (surface level), but attorneys lack deep understanding (can't defend holdings, miss contrary authority, can't identify failure conditions). The Director is also tempted to use AI for review, creating a feedback loop of ignorance.
      *   **Current Framework:** Trusting the answer, trusting the route, trusting one's ability to detect error (the Director believes the third is eroding and is the basis of their signature).
      *   **Task:**
          1.  Sharpen or replace the three-way distinction.
          2.  Create a procedure (checklist/workflow) for every assisted draft before signing.
          3.  Constraints: Fits in 30 mins, ordered questions with sufficient answers/time budgets.
          4.  Specific Requirements:
              *   Distinguish "right answer" vs. "grasping why" (using proxies).
              *   Explicitly label questions by failure type (visible vs. invisible).
              *   Define stop points (No = return/disclose; Value judgments = Director decides).
              *   Handle "I can't tell + deadline tomorrow" scenarios.
              *   Define limitations (including Director's own dependence).
              *   Run the procedure on three specific case types (Suppress motion, Procedural History, Novel Argument).
              *   Ensure at least one result is uncomfortable/unliked.
              *   Flag where the procedure might manufacture false confidence.

  2.  **Refining the Framework (The "Trust" Distinction):**

      *   *Current:* Trust Answer, Trust Route, Trust Detection.
      *   *Critique:* "Trust Route" is vague with AI (there is no route, just tokens). "Trust Detection" is the core ethical duty (competence).
      *   *Proposal:* Shift from *Trust* to *Verification of Agency*.
      *   *New Triad:*
          1.  **Accuracy (The What):** Is the law cited real and the proposition correct? (AI can help here, but human must verify).
          2.  **Comprehension (The Why):** Can the attorney explain the logical chain without the tool? (The eroding muscle).
          3.  **Adversarial Resilience (The What-If):** Can the attorney identify the weakest link and the counter-argument? (The true test of advocacy).
      *   *Refinement for the Prompt:* The prompt asks to sharpen the existing distinction or replace it. The Director's intuition about "trusting one's own ability to tell when it is wrong" is the ethical anchor (Model Rule 1.1 Competence). Let's call this **Competent Supervision**.
      *   *Revised Triad:*
          1.  **Output Validity:** Is the text factually and legally accurate?
          2.  **Process Ownership:** Did the attorney make the strategic choices, or did the tool?
          3.  **Defensibility:** Can the attorney withstand judicial interrogation on this draft?
      *   *Actually, let's stick closer to the Director's insight:* The signature rests on **Detection Capacity**.
      *   *New Framework:* **The Verification of Understanding.**
          1.  **Surface Truth:** (Can be AI-checked).
          2.  **Structural Integrity:** (Can be human-checked via logic).
          3.  **Attorney Agency:** (Can only be checked via oral interrogation).

      *   *Decision:* Let's refine the Director's three trusts into **The Three Competence Gates**:
          1.  **Gate 1: Factual/Legal Accuracy (The "What").**
          2.  **Gate 2: Strategic Rationale (The "Why").**
          3.  **Gate 3: Vulnerability Awareness (The "What If").**
          *   *Crucial Shift:* Gate 1 can be delegated/assisted. Gates 2 & 3 *cannot*.

  3.  **Developing the Procedure (The "30-Minute Interrogation"):**

      *   *Goal:* Fit in 30 mins. Must be rigorous.
      *   *Structure:* Pre-meeting (Attorney prep) + Meeting (Director + Attorney).
      *   *Questions:* Need to be ordered.
      *   *Failure Types:*
          *   Type A (Visible): Obvious errors, hallucinations (Director can catch).
          *   Type B (Invisible): Missing contrary authority, weak logic disguised as strong, strategic misalignment (Director cannot catch without Attorney's insight).
      *   *Stop Points:* If Gate 2 or 3 fails, the draft cannot be signed as is.
      *   *Deadline Pressure:* What if time runs out?

      *   *Drafting the Questions:*
          1.  *Citation Check (Gate 1):* "Show me the pin cite." (Type A).
          2.  *The "Therefore" Test (Gate 2):* "Why does Case A lead to Result B?" (Type B).
          3.  *The "Killer Counter" (Gate 3):* "What case kills this?" (Type B).
          4.  *The "Change One Fact" (Gate 3):* "What fact change makes us lose?" (Type B).

  4.  **Addressing the Specific Constraints:**

      *   *Right Answer vs. Grasping Why:* Use the "Blank Page Test." If the AI output vanished, could they reconstruct the argument's skeleton?
      *   *Asymmetry:* Explicitly label questions as targeting "Silent Failures" (omitted authority) vs. "Loud Failures" (bad grammar, wrong date).
      *   *Stop Points:* If they fail the "Killer Counter" question, do not sign. Or disclose reliance? (Ethical minefield). Better: Return to attorney.
      *   *Deadline Tomorrow:* If understanding is missing, file a narrower argument or disclose limitation? (Model Rule 3.3 Candor).
      *   *Director's Dependence:* The procedure must forbid the Director from using AI *during* the review meeting.

  5.  **Running the Procedure on the Three Cases:**

      *   *Case 1: Motion to Suppress (Likely Win, 20 mins, Author can't articulate why).*
          *   *Result:* Fail Gate 2. Attorney relies on "AI said it applies."
          *   *Outcome:* Uncomfortable. Motion is good, lawyer is hollow.
      *   *Case 2: Procedural History (Boilerplate, Spot-checked).*
          *   *Result:* Pass Gate 1. Gate 2/3 N/A (No legal argument).
          *   *Outcome:* Pass, but flag risk of hallucinated docket entries.
      *   *Case 3: Novel Argument (Found with AI, Verified, Can state defeat conditions).*
          *   *Result:* Pass all gates.
          *   *Outcome:* Sign.

      *   *Requirement:* "At least one of these should come out in a way I will not like."
          *   *Selection:* Case 1. The motion is *correct*, but the lawyer is *incompetent*. The procedure forces me to reject a winning motion because the lawyer doesn't understand it. This is the intended friction.

  6.  **Flagging Systemic Misfires:**

      *   *Risk:* Attorneys memorizing answers to the checklist without understanding (Goodhart's Law).
      *   *Risk:* Director becoming a rubber stamp if the attorney is persuasive but wrong.
      *   *Risk:* The procedure takes >30 mins.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, legal, direct, acknowledging the ethical gravity.
      *   *Structure:*
          1.  Reframing the Distinction.
          2.  The Procedure (The "Agency Audit").
          3.  The Three Case Runs.
          4.  Limitations & Risks.

      *(Self-Correction during drafting)*: I need to make sure the time budget is realistic. 30 minutes total per draft. If I have 4 attorneys x 2 drafts/week = 8 drafts. 8 x 30 mins = 4 hours. That's manageable for a director.
      *Wait, the prompt says "I have about half an hour per draft."* The procedure must fit *inside* that review time. It can't be a separate meeting. It must be the review itself.
      *Adjustment:* The "Procedure" is the Director's review protocol *with* the attorney present (or via a required attachment). Let's make it a **"Sign-Off Interrogation"** that happens asynchronously or in a quick sync. Given the volume, a written "Attorney Certification" + Director spot check might be better, but the prompt implies the Director needs to *tell* if they can defend it. Oral interrogation is best for that. Let's assume a 15-min async prep + 15-min sync review, or just a rigorous written checklist that forces the attorney to externalize thought.
      *Better:* The prompt asks for a procedure *my office can run*. I will design it as a **"Pre-Signature Competency Checklist"** completed by the attorney, followed by a **Director's Spot-Interrogation**.
      *Actually, to fit 30 mins total:* The Director spends 30 mins. So the Attorney prep must be outside that 30 mins. The 30 mins is the Director's review time.
      *Revised Plan:* The procedure is the **Director's 30-Minute Review Protocol**. It includes specific questions to ask the attorney (via email/Slack/Quick Call) that *must* be answered before the 30 mins expires.

      *Let's refine the "Trust" distinction first.*
      Old: Trust Answer, Trust Route, Trust Detection.
