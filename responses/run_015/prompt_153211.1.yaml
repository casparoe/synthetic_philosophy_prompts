answer: |-
  **To:** The Grants Committee
  **From:** [Your Name/Consultant]
  **Subject:** Decision Procedure for Flood Recovery Grants

  You are asking for a mechanism to translate a philosophical principle (luck egalitarianism) into an administrative tool that works under scarcity and time pressure. The core tension in your instrument is between *compensation for misfortune* (brute luck) and *responsibility for choice* (option luck).

  Below is the proposed decision procedure, followed by an analysis of the four knots you identified, a worked application on your three cases, and guidance on the residual issues of repeat claims and communication.

  ### Part 1: The Decision Procedure

  This procedure is designed for a 20-minute review. It prioritises **Avoidability** over Foreseeability, as Avoidability is the true proxy for "Choice". It treats **Realisation** (the flood) as the trigger, not Exposure. It excludes **Hardship** from the scoring, relegating it to signposting.

  **The File Checklist (Pre-meeting):**
  *   Date of occupancy/lease start.
  *   Flood map history (at time of occupancy and current).
  *   Record of previous flood events at the property.
  *   Evidence of insurance status (held/lapsed/refused).
  *   Evidence of any buy-out or relocation offers previously made.

  **The Algorithm:**

  **Q1. Causation (Fact Check)**
  *   *Question:* Did the specific flood event cause the claimed loss?
  *   *Evidence:* Photos, adjuster reports, dates.
  *   *If No:* **Reject.** (Stop).
  *   *If Yes:* Proceed to Q2.

  **Q2. Foreseeability at Critical Junctures (Fact Check)**
  *   *Question:* Was the flood risk knowable at the **Commitment Point** (purchase/lease) OR the **Retention Point** (after the first flood in the 5-year sequence)?
  *   *Evidence:* Flood maps at the time, local knowledge, previous water marks.
  *   *If No (Unforeseen at both points):* **Pass to Award Pool.** (This is pure brute luck. Proceed to Q5 for ranking).
  *   *If Yes (Foreseen at either point):* Proceed to Q3.

  **Q3. Avoidability at Critical Junctures (Fact/Value Hybrid)**
  *   *Question:* At the point the risk was known, could the claimant have avoided the loss without **unacceptable sacrifice**?
  *   *Definition of Unacceptable Sacrifice:* Moving home would result in homelessness; Insurance premium exceeds 15% of net income; Physical disability prevents relocation.
  *   *Definition of Acceptable Sacrifice:* Lower standard of housing; Moving to a different area; Financial tightening; Emotional attachment to location.
  *   *Evidence:* Mortgage offers, income statements, medical letters, insurance quotes.
  *   *If No (Avoidable with only Acceptable Sacrifice):* **Reject.** (Stop). *Note: This is where choice outweighs luck.*
  *   *If Yes (Unavoidable due to Unacceptable Sacrifice):* Proceed to Q4.
  *   *If Unclear:* **Hand-off to Chair.** (This is a value judgement on "reasonableness". Chair casts deciding vote).

  **Q4. Mitigation (Fact Check)**
  *   *Question:* Did the claimant take reasonable low-cost steps to minimise damage once the risk was known?
  *   *Evidence:* Flood barriers, raising electrics, sandbags, contents moved upstairs.
  *   *If No (Negligent):* **Reduce Award by 50% or Reject.**
  *   *If Yes:* Proceed to Q5.

  **Q5. Comparative Ranking (Value Judgement)**
  *   *Question:* Given the budget cap, does this claim rank higher than others in the Award Pool?
  *   *Metric:* Degree of "Brute Luck". (e.g., Map change > First-time flood > Repeat flood where stay was constrained).
  *   *Decision:* **Award** or **Waitlist**.

  ---

  ### Part 2: Untying the Four Knots

  **1. Foreseeability vs. Avoidability**
  *   **The Distinction:** Foreseeability is epistemic (what did they know?). Avoidability is practical (what could they do?). Your instrument conflates them, but they must be prised apart. A claimant might foresee a risk but lack the capacity to avoid it (poverty, disability).
  *   **Which does the work?** **Avoidability.** Luck egalitarianism is concerned with *choice*. If a claimant knew the risk (Foreseeable) but literally could not afford to move or insure (Unavoidable), they did not *choose* the loss. They suffered a constraint.
  *   **Procedure Impact:** Q2 establishes knowledge. Q3 establishes capacity. A "Yes" on Q2 does not kill the claim; a "Yes" on Q3 (it was avoidable) does.

  **2. Realisation vs. Exposure**
  *   **The Position:** Your deputy chairman is theoretically correct but practically wrong for this fund. Compensating *exposure* (living in a risk zone) is a function of the state or the insurance market, not a disaster recovery charity. If you pay for exposure, you exhaust your budget on people who haven't yet flooded, leaving nothing for those who have.
  *   **The Consequence:** Build the rule around **Realisation** (the flood event). However, use *history of exposure* to inform Q3 (Avoidability). If someone has been exposed for 20 years, the burden of proof shifts to them to show why they *could not* move. The "misfortune" is the water entering the house, not the house being in the valley.

  **3. Comparative vs. Absolute Deservingness**
  *   **The Position:** The comparative element is **unavoidable** once there is a budget cap. Luck egalitarianism is ideally absolute (you get justice if it was brute luck). But under scarcity, justice becomes distributive.
  *   **The Consequence:** Do not pretend the rule is absolute. Q5 explicitly acknowledges ranking. A "Yes" on Q1–Q4 makes you *eligible*, not *guaranteed*. This protects the committee from accusations of inconsistency: "You were eligible, but another claimant had a stronger claim to brute luck."

  **4. Harshness and the Safety Net**
  *   **The Position:** Keep the harshness **outside the rule**. If you soften the rule to prevent hardship, you corrupt the principle of justice. You become a welfare agency, not a recovery fund.
  *   **The Consequence:** A "No" must be a "No". If a claimant is refused because they chose to stay in a flood zone, that is a just outcome under your instrument. Their subsequent hardship is real, but it is not your fund's liability. Your duty is to signpost robustly to welfare agencies, not to distort the grants criteria.

  ---

  ### Part 3: Worked Applications

  Here is the procedure applied to your three cases from the last quarter.

  **Case 1: The Couple (Cheap house, high risk, lapsed insurance)**
  *   **Q1 Causation:** Yes. Flood caused loss.
  *   **Q2 Foreseeability:** **Yes.** Maps showed high risk at purchase (11 years ago). Risk confirmed by first flood (5 years ago).
  *   **Q3 Avoidability:**
      *   *Purchase:* Arguably constrained (only mortgage offer).
      *   *Retention:* **Avoidable.** After the first flood (5 years ago), they knew the risk was real. They chose to stay.
      *   *Insurance:* Lapsed due to cost. While >1 month's pay is high, remaining in the property without insurance was a choice to self-insure.
      *   *Verdict:* **No.** The decision to remain after the first flood event constitutes a voluntary assumption of risk. The initial constraint (purchase) does not excuse the subsequent choice (retention).
  *   **Outcome:** **Reject.** Signpost to welfare support for immediate living costs.

  **Case 2: The Widower (Cottage, 4 floods, refused buy-out)**
  *   **Q1 Causation:** Yes.
  *   **Q2 Foreseeability:** **Yes.** Flooded four times. Risk is certain.
  *   **Q3 Avoidability:** **Yes.** He was offered a buy-out above market value. This removes the financial constraint. His refusal is based on preference (emotional attachment), which counts as a choice in this framework.
  *   **Q4 Mitigation:** Irrelevant given Q3.
  *   **Outcome:** **Reject.** The loss is the result of a preference for location over safety, facilitated by a financial offer that was declined. This is option luck, not brute luck.

  **Case 3: The Bakery (Maps changed, lease signed 2014)**
  *   **Q1 Causation:** Yes.
  *   **Q2 Foreseeability:** **No.** At the Commitment Point (2014), the property was outside flood maps. The change in maps is a regulatory shift, not a market risk they took.
  *   **Q3 Avoidability:** **N/A.** (Passed at Q2).
  *   **Q4 Mitigation:** Assume Yes (industrial tenants usually comply).
  *   **Q5 Ranking:** **High.** This is pure brute luck. No choice contributed to the loss.
  *   **Outcome:** **Award.** Full eligible amount subject to budget cap.

  *Note on the "No" decisions:* In Case 1 and Case 2, the refusal is plain. These claimants made calculated decisions to accept risk. Case 1 chose affordability over safety; Case 2 chose sentiment over safety. Under your instrument, these are not compensable losses.

  ---

  ### Part 4: Residual Issues

  **1. Repeat Claims**
  Currently, you are "hopeless" on these. The procedure handles this via **Q2 (Retention Point)**.
  *   **First Flood:** Usually Brute Luck (unless maps were clear).
  *   **Second Flood:** Mixed. Did they mitigate?
  *   **Third Flood+:** Presumed Choice.
  *   **Rule:** A property that floods a third time within five years creates a **rebuttable presumption of Avoidability**. The burden of proof shifts to the claimant to demonstrate why they *could not* have moved or fortified after the second event. Without new evidence of constraint (e.g., sudden illness, market collapse), repeat claims should be rejected at Q3. This prevents the fund from subsidising a permanent state of high-risk occupancy.

  **2. Communication of Refusal**
  An applicant is entitled to clarity, not apology. Do not cite "budget constraints" as the primary reason for a Q3 rejection, as this invites appeals based on need.
  *   **What to say:** "The Committee found that while the loss was genuine, the risk was known after [Date/Event], and reasonable options to avoid the loss (relocation/insurance) were available. The fund is mandated to compensate for unforeseen or unavoidable losses, not those where the risk was voluntarily retained."
  *   **What to include:** A specific list of the alternative funds/welfare bodies you are signposting them to. This separates the *justice* decision (No) from the *humanitarian* response (Signposting).

  ### Summary of Trade-offs

  *   **What survives:** The distinction between Brute Luck (Award) and Option Luck (Reject). The focus on Avoidability as the proxy for Choice.
  *   **What is dropped:** The nuance of "Exposure" as a compensable harm. The mitigation of harshness within the rule itself.
  *   **Where it will misfire:** It will systematically penalise the "working poor" who can afford to stay in a flood zone but not afford to move or insure (Case 1). They fall into a gap: too rich for welfare, too poor for risk. This is a structural failure of the state/insurance market, not your charity. Your rule identifies this group; it cannot fix them without breaking its own budget. Acknowledge this limitation in your minutes.

  This procedure ensures your decisions are defensible, consistent, and faithful to the governing instrument, even when the outcomes are difficult.
