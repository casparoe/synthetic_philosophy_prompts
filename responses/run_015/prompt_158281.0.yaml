      *   *Correction on PGS:* PGS portability is currently poor across ancestries due to LD structure, not just GxE. I need to distinguish between portability across *environments* (SES) vs *populations*. The prompt asks about "social contexts". If PGS predicts EA in high-SES and low-SES equally well, that challenges localism. Current evidence is mixed (often stronger in high SES). I should frame this as "potential fatal" but currently "awkward".
      *   *Correction on Breeder's Equation:* This is the strongest point. If $h^2$ is purely a local snapshot, you cannot predict the next generation. But farmers do. Therefore, $h^2$ has temporal stability.

  7.  **Final Polish:** Check British spelling (variance, environment, programme, modelling, centre). Ensure the ranking is clear. Address the "unfalsifiable" question directly.

      *(Self-Correction on "Fatal"):* Is anything truly fatal to a philosophical position? Usually, it forces a modification. I will frame "Fatal" as "Forces abandonment of the *strict* version."

      *(Unfalsifiability):* The risk is that every time $h^2$ generalises, the localist says "lucky coincidence," and every time it doesn't, they say "see?". The defeater is *systematic* invariance.

