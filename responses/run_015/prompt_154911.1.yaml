  Here is the breakdown of how I get there, treating this as a Bayesian update on the coherence of the two systems.

  ### 1. Probability that moral desert requires cross-time personal identity: 0.85
  **Reasoning:** Retributive desert is inherently backward-looking and agent-specific. For "payback" to be just rather than merely causal violence, the entity suffering the consequence must be the *same* moral agent that committed the act. If psychological continuity or numerical identity breaks down (e.g., total memory wipe, radical personality change), our intuitive sense of desert collapses. While some consequentialist accounts might bypass this, *retributivism* (which karma is being compared to) almost certainly requires a stable subject to hold responsible.

  ### 2. Probability that karma's *anatta* (no-self) makes it self-defeating: 0.55
  **Reasoning:** This is the biggest tension in Buddhist metaphysics. If there is no *atman* (permanent self), who accumulates the karma and who experiences the rebirth? The standard Buddhist reply is "causal continuity without substantial identity" (like a flame passing from one candle to another).
  I assign this a moderate probability (0.55) because while it *sounds* contradictory to analytic philosophers, the Abhidharma and later Madhyamaka schools have sophisticated (if debatable) models of dependent origination that attempt to solve this. It's not clearly self-defeating *internally*, but it is incoherent *externally* if you demand Lockean identity. It's basically a toss-up whether their solution works.

  ### 3. Probability that secular retributivism fails on its own: 0.70
  **Reasoning:** Secular retributivism is currently taking a beating in analytic ethics.
  *   **Moral Luck:** If my attempt to murder fails because of a gust of wind (luck), but yours succeeds, we deserve different punishments despite identical intent. This undermines desert.
  *   **Hard Determinism/Compatibilism:** If physicalism is true, the "free will" required for basic desert is hard to locate.
  *   **State Authority:** Philosophical anarchism and abolitionism raise strong doubts about the state's moral standing to inflict harm.
  Secular retributivism has deep structural cracks, making it highly probable (0.70) that it fails as a coherent ultimate account.

  ### The Calculation
  For Karma to be *more coherent* than Secular Retributivism, two things generally need to happen:
  1.  Secular Retributivism must fail (0.70).
  2.  Karma must *not* be self-defeated by *anatta* (1 - 0.55 = 0.45).

  *Note: Q1 (Identity) acts as a multiplier that strengthens Q2. If identity is required (0.85), the pressure on Karma to solve the no-self problem increases.*

  Roughly: `0.70 (Secular Fails) × 0.45 (Karma Survives Anatta) = 0.315`

  Rounding to **0.32**.

  ### Least Sure Point: #2 (Anatta vs. Karma)
  I am least sure about the probability that *anatta* defeats karma. This is because "personal identity" is itself a contested concept in philosophy (see: Derek Parfit). If desert doesn't require a "substantial self" but only "psychological/causal continuity," then the Buddhist model might actually be *more* coherent than the secular model, which often relies on a folk-psychology view of the self that neuroscience undermines.

  **What would move this number?**
  *   **To increase my credence in Karma (move toward 0.5+):** A robust philosophical argument demonstrating that "psychological continuity" is sufficient for desert *and* that the Buddhist causal chain satisfies this better than secular legal identity. If Parfit-style reductionism is accepted, Karma's "no-self" becomes a feature, not a bug.
  *   **To decrease my credence in Karma (move toward 0.1):** Evidence or argument showing that moral desert *strictly* requires numerical identity (not just continuity). If you prove that without a permanent "soul" or "self," punishment is literally violence against a new being, Karma's coherence drops to near zero.

  **Verdict:** Your guess of 0.3 was very sharp. The "No-Self" problem is the anchor dragging Karma down, even if Secular Retributivism is also sinking.
