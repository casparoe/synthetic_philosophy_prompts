answer: |-
  **MEMORANDUM**

  **TO:** Graduate Academic Standing Panel
  **FROM:** Chair, Graduate Academic Standing Panel
  **DATE:** October 26, 2023
  **SUBJECT:** Opinion on Dissertation Case [Candidate ID Redacted] – Use of Factored-Cognition System

  We are convened to interpret the Graduate School's requirement that a dissertation "shall be the candidate's own work and shall represent the candidate's own judgment." The candidate utilized Trellis, a factored-cognition system, to generate two central chapters. While the tool involves human workers rather than generative AI, the core issue remains whether the output represents the candidate's judgment. I recommend we **remand the dissertation to the department with conditions**, rather than upholding the finding of misconduct or permitting the chapters as submitted.

  We must take seriously the strongest argument for permitting this work. There is a credible philosophical claim that careful deliberation *is* the factoring of hard judgments into tractable sub-questions. By designing the decomposition scheme and the recombination rules, the candidate performed high-level intellectual architecture. In this view, Trellis differs only in degree from a principal investigator directing a large team of research assistants, utilizing complex statistical software, or synthesizing expert consultations where the candidate cannot reproduce every underlying calculation. To reject this is to risk luddism; we previously allowed a mathematics candidate to rely on a proof assistant he could not check by hand because the logical validity was verifiable. If we accept that designing the cognitive pipeline is itself a form of judgment, the candidate has met the requirement.

  However, two specific details prevent me from endorsing that view in this instance. First, the candidate admits she cannot reconstruct the reasoning herself after a week of review. Second, and more critically, the normative core of the dissertation—the trade-off between equity and aggregate welfare—was not chosen by the candidate. It was an artifact of how the recombination weights settled during the fixed-point iteration. No worker explicitly weighed these values; the system converged on a recommendation that prioritized equity based on structural weights, not reasoned argument.

  This distinguishes the case from our precedents. The mathematics candidate relied on verifiable logic; here, the output relies on emergent normativity. The candidate who bought edited prose was sanctioned because the ideas were not hers; here, the *conclusion* is not hers, even if the prompt was. By approving this as is, we commit ourselves to a definition of "judgment" that encompasses system design alone, accepting black-box normative conclusions so long as the architecture was human-designed. We would be establishing that a PhD candidate need not understand *why* their system reached a normative conclusion, only that they built the system. Conversely, by rejecting it, we commit to the view that doctoral judgment requires traceable cognitive ownership of the normative core, not just the procedural framework.

  There is one single fact about the fixed-point iteration that would most change this recommendation: **whether the candidate set the initial recombination weights based on a prior normative stance.** If she initialized the weights to favor equity, she owns the judgment, and the system merely executed her bias. If she accepted default weights and allowed the system to converge on equity autonomously, the judgment belongs to the architecture, not the candidate. Absent evidence of the former, we cannot assume the latter.

  Therefore, I recommend we **remand with conditions**. We should not sanction the candidate for misconduct, as the use of the tool was not prohibited, but we cannot accept the chapters as representing her own judgment. The department must require the candidate to:

  1.  Rewrite the affected chapters to explicitly articulate the equity-welfare trade-off in her own voice, independent of the system's emergent weights.
  2.  Provide a technical appendix demonstrating that she can reconstruct the reasoning chain for the final recommendation without reliance on the transcript.
  3.  Submit a revised methodology section disclosing the Trellis usage and detailing her specific input on weight initialization.

  She should have ninety days to complete these revisions. This disposition preserves the integrity of the "own judgment" requirement without penalizing methodological innovation. It acknowledges that while we may outsource computation or data collection, we cannot outsource the normative reasoning that constitutes the soul of a public policy dissertation. If she can demonstrate that the system's output aligns with a judgment she can now explicitly defend, the degree should be awarded. If she cannot, the finding of the department should be sustained.

  I urge the panel to adopt this middle path. It signals that we welcome new tools but remain guardians of what a doctorate signifies: the capacity to own one's conclusions.
