      *   *Autopilot Case:* Computer system, flight plan, sensors (altimeter, GPS), human pilot (engages system), manual override, lack of phenomenal consciousness.
      *   *Mapping:*
          *   Autopilot Computer $\rightarrow$ Driver's Subconscious/Procedural Systems.
          *   Flight Plan $\rightarrow$ Habitual Route/Goal (Home).
          *   Sensor Array $\rightarrow$ Visual/Proprioceptive Input.
          *   Human Pilot (Engager) $\rightarrow$ Driver's Earlier Conscious Self (leaving work).
          *   Retaking Control $\rightarrow$ "Waking up" at the driveway.
          *   Missing Conscious State $\rightarrow$ Phenomenal experience of driving.

  3.  **Identifying Fracture Points (The Philosophical Meat):**
      *   *Embodied Intentionality:* An autopilot follows code. A driver embodies a goal. Even if "absent-minded," the driver's actions are *their* actions, not a separate module's. The "I" is still driving, just not attending.
      *   *Error Correction/Plasticity:* Autopilots follow rigid protocols unless programmed for exceptions. Humans handle novel situations (detours, weird obstacles) even on autopilot via subconscious flexibility.
      *   *Homeostasis/Affect:* Drivers have stakes. They care about not crashing. Autopilots do not. Fear, stress, comfort regulate the driving even without conscious thought.
      *   *Normative Responsibility:* We blame the driver, not their "subconscious." We blame the pilot/engineer for the autopilot. The locus of agency differs.

  4.  **Hidden Commitments of the Analogy:**
      *   *Dualism:* It subtly suggests the conscious self is a "pilot" inside the head, separate from the "machine" of the body. This is the Cartesian Theater fallacy.
      *   *External Programming:* Autopilots are made by engineers. Habits are formed by the agent themselves over time (self-programming).
      *   *Lack of Learning:* Autopilots don't learn from the landing (usually). Drivers refine habits.

  5.  **Assessing the Normative Conclusion:**
      *   Does the analogy prove consciousness is irrelevant to responsibility?
      *   *Counter:* Responsibility tracks *agency*, not necessarily *phenomenal consciousness*. The driver is still an agent. The autopilot is a tool. The disanalogy undermines the claim that the driver is like the tool.
      *   *Verdict:* The conclusion does not survive. The analogy smuggles in a view of the self that denies the unity of the agent.

  6.  **Proposing a Better Analogy:**
      *   *Skilled Musician (Jazz Pianist):* High skill, low conscious monitoring of fingers, high agency, responsive to context, expressive.
      *   *Sleepwalking:* Closer to the "no consciousness" claim, but lacks agency/responsibility (usually).
      *   *Selection:* The Skilled Musician/Expert Athlete. It preserves the "flow" state without denying agency or embodied intention. It highlights *attention* vs. *awareness*.

  7.  **Drafting the Response (Iterative refinement):**
