answer: |-
  There is no single, canonical label for this specific pattern in the literature. You have not half-made it up, but you are observing a *consequence* of two established principles working in tandem, rather than a named phenomenon itself.

  The established concepts you are seeing collide are **Ontological Innocence** and **Transitivity**.

  1.  **Ontological Innocence:** The claim that if $X$ is fully grounded in $Y$, $X$ is "nothing over and above" $Y$. $X$ adds no new being to the world. (Often associated with Armstrong's "ontological free lunch.")
  2.  **Transitivity:** If $G$ grounds $H$, and $H$ grounds $F$, then $G$ grounds $F$.

  When you combine these, you get the pattern you noticed: If $H$ is innocent relative to $G$, and $F$ is innocent relative to $H$, then $H$ is a double-innocent conduit. It carries explanatory weight but no ontological weight. In a project dedicated to **Fundamentality** (finding what is *real* in the heavy-duty sense), $H$ drops out of the final tally.

  However, since there is no specific name for the *dynamic* you are describing (the systematic erasure of the middle link in practice), I will coin a term for it so you can track it precisely.

  ### The Coinage: **Fundamentalist Deflation**

  **Definition:**
  *Fundamentalist Deflation* occurs in a grounding chain ($G \rightarrow H \rightarrow F$) when the pursuit of the *fundamental* base causes the intermediate ground ($H$) to be treated as ontologically transparent. $H$ retains *explanatory* relevance (it helps us understand the link) but loses *ontological* relevance (it is not counted as a distinct entity in the fundamental inventory).

  **Tight Criteria for Identification:**
  1.  **Directionality:** The chain must be oriented toward a "fundamental base" (e.g., microphysics, simples, God). If the chain is oriented toward a local explanation (e.g., "Why is this action wrong?"), deflation does not occur.
  2.  **Ontological vs. Explanatory Split:** Proponents must admit $H$ is useful for *understanding* but deny it is needed for *being*.
  3.  **Transitive Bypass:** Proponents must affirm that $G$ grounds $F$ directly in the final ontological count, rendering $H$ optional for the "Book of the World."

  ### Why Causation Doesn't Do This
  You noted the contrast with causation (Big Bang $\rightarrow$ ... $\rightarrow$ Fire). Causal explanation is **process-oriented**. The intermediate links are *generative mechanisms*. If you remove the intermediate cause, the effect doesn't happen. The "oomph" is transferred step-by-step.

  Grounding (in the Fundamentalist Deflation context) is **state-oriented**. It is about what *constitutes* the reality of a fact, not what *produced* it. If $G$ constitutes $H$, and $H$ constitutes $F$, then $G$ constitutes $F$. The "constitution" doesn't get used up in the middle. The middle is just a structural artifact of our description, not a separate ontological hurdle.

  ### The Boundary Case: Ethics (Your Counter-Example)
  You mentioned ethics: *Wrongness* $\rightarrow$ *Pain* $\rightarrow$ *Microphysics*.
  Here, Fundamentalist Deflation often **stops**. Why?

  This is the boundary that proves the rule. Deflation only happens when the grounding chain is assumed to be **homogeneous** (all one kind of relation aiming at one kind of base).
  *   In physical metaphysics, the chain is homogeneous (physical $\rightarrow$ physical). Deflation runs all the way down.
  *   In ethics, many philosophers posit a **Domain Autonomy**. The ground of wrongness is pain (normative/descriptive mix), but the ground of pain is C-fibers (physical).
  *   If you are a **Non-Naturalist**, you claim the normative ground *blocks* deflation. Pain makes the act wrong; microphysics makes the pain exist. But microphysics does *not* make the act wrong directly. The normative relation is sui generis.
  *   If you are a **Reductive Naturalist**, you *do* apply Fundamentalist Deflation: Wrongness is nothing over and above C-fiber firing. The middle (pain) gets deflated.

  So, your ethics example isn't a failure of the pattern; it's a marker of where philosophers *resist* Fundamentalist Deflation to preserve normative force.

  ### Where I Am Shaky (The Confession)

  I am 85% confident that **Fundamentalist Deflation** accurately carves out the pattern you are seeing, but my shakiness lies in whether this is a feature of **Grounding** itself or a feature of **Siderian Fundamentalism**.

  **The Shaky Part:**
  There is a split in the grounding literature between:
  1.  **The Sider Camp (Writing the Book of the World):** Reality has a structure, and we want to find the fundamental vocabulary. Here, Fundamentalist Deflation is rampant. Middes are eliminated to find the "joint-carving" base.
  2.  **The Fine Camp (Grounding as Explanation):** Grounding is about metaphysical explanation, not necessarily eliminating levels. Kit Fine might argue that the intermediate ground ($H$) has *structural reality* even if it isn't fundamental. The chain itself is a fact about reality.

  **What Would Convince Me Otherwise:**
  If you find prominent grounding theorists who insist that intermediate grounds ($H$) have **ontological weight** distinct from both $G$ and $F$ *even while accepting transitivity*, then my coinage is too broad.
  *   *Test Case:* Social Ontology. If a "University" is grounded in "People + Rules," and "People" are grounded in "Biology," does the "University" level get deflated?
      *   If yes (it's just biology): Fundamentalist Deflation holds.
      *   If no (the University is a real, distinct ontological item despite being grounded): Then Deflation is not a rule of grounding, but a rule of *Physicalism*.

  **My Best Guess:**
  You are noticing that contemporary metaphysics is heavily biased toward **Priority Monism** or **Physicalism**. The "collapse of the middle" is the sound of metaphysicians trying to avoid ontological bloating. It isn't that grounding *requires* the middle to vanish; it's that *fundamentalism* requires it. If you drop the demand for a single fundamental base, the middles can stay.

  **Summary:**
  *   **Established Concept:** Ontological Innocence + Transitivity.
  *   **Coinage:** Fundamentalist Deflation.
  *   **Boundary:** Domain Autonomy (Ethics/Social) where homogeneity breaks.
  *   **Shakiness:** Whether this is intrinsic to grounding or extrinsic to the Physicalist project using grounding.
