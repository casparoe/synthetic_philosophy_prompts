prompt: |-
  I'm applying for a small interdisciplinary fellowship — six months, half-time, real money but not a lot of it, and they want to know what I'll actually hand in at the end. The idea I'd be pitching came out of a reading group on collective action where we kept throwing everything under "the tragedy of the commons," and it started to bug me that the classic picture always assumes the thing getting destroyed is a stock: fish, pasture, groundwater, bandwidth, each act of appropriation nibbling a bit away. But the cases I actually care about don't look like that. A bus queue. People bagging their dog's mess. A wiki article that quietly stays accurate. The unwritten rule against leaving your cart in the middle of the lot. What degrades in those cases isn't a stock that gets eaten down unit by unit — it's the shared expectation that other people are still playing along. And it seems to flip: everyone does it, everyone does it, then two people don't and suddenly nobody does, with nothing about anyone's underlying incentives changing in between. The other oddity is that you can't wear it out by participating; the only way to damage it is to be seen not to. So the good looks non-rival in the usual sense and yet gets destroyed by visible non-use, which isn't how we normally talk about public goods either.

  My hunch is that this is a genuinely different failure mode rather than the standard story with the knobs turned up, and that if it is, it changes what interventions even make sense — you'd be thinking about visibility and thresholds instead of prices and quotas. But I honestly cant tell whether I'm onto something or just redescribing the same thing in fancier clothes, and that's the question I want the proposal to make answerable rather than quietly assume. Turn this into the proposal: state the question precisely, say why the existing ways of carving up commons and public-good problems leave it genuinely open (without turning it into a literature review — I'll fill in the references myself, just tell me which positions actually matter), and say what I'd do with six months at half time and why that method rather than the obvious alternatives. I'm genuinely unsure whether this should be formal modeling, a small set of structured case comparisons, or straight conceptual work, so pick one and defend it. Say what a successful outcome looks like, what would count as the project failing or as my distinction collapsing back into the standard one, and give me a straight answer about whether the paramaters I've described add up to a real deliverable or whether I'm kidding myself. Be concrete about what the thing I hand in actually is.
