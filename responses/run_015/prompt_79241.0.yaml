  # Project Proposal: The Depletion of Compliance
  **Working Title:** Beyond the Stock: Modeling Normative Collapse as a Distinct Collective Action Failure

  ### 1. The Research Question
  Standard models of the "Tragedy of the Commons" (ToC) describe the depletion of a **rival stock** (fish, bandwidth, pasture) through aggregate usage. This project asks: **Is there a distinct class of collective action failure where the depletable resource is not a physical stock, but the shared expectation of compliance itself?**

  In scenarios like queueing, shopping cart return, or open-editing wikis, the "good" (order, cleanliness, accuracy) does not degrade because too many people use it, but because visible non-compliance erodes the belief that others will cooperate. The project seeks to determine if this "expectation depletion" follows a different logic than standard resource depletion, and consequently, requires different interventions (visibility and threshold management vs. pricing and quotas).

  ### 2. The Gap in Existing Frameworks
  Current literature creates a false dichotomy that leaves this phenomenon unclassified.
  *   **Standard ToC (Hardin/Ostrom):** Assumes subtractability. My use reduces your share. This does not fit a bus queue; my queuing does not reduce the "queue-ness" available to you, provided I follow the rule.
  *   **Public Goods Theory:** Assumes non-rivalry and non-excludability. While the *order* is non-rival, the *production* of order is hyper-sensitive to visible defection in a way standard free-rider problems are not.
  *   **Social Norms (Bicchieri/Elster):** Often treat norms as the *solution* to collective action problems, not the *asset* being depleted.

  The gap lies in the **production function of the good**. In a fishery, yield drops linearly or logarithmically with extraction. In "expectation commons," yield stays stable until a visibility threshold of defection is crossed, at which point it collapses to zero. Existing frameworks treat this as a "coordination game" or "tipping point," but they fail to categorize the *normative expectation* as the common pool resource subject to tragedy. This project tests whether treating the expectation as the depletable stock yields better predictive power for intervention design.

  ### 3. Methodology: Structured Case Comparison
  Given the six-month, half-time constraint, **formal modeling is too high-risk** (it requires axiomatizing a new utility function which may stall), and **pure conceptual work is too vague** (it risks producing only definitions).

  I will employ **Structured Case Comparison**. This method allows for rapid iteration on the theory against real-world constraints without getting bogged down in data collection or complex calculus.

  **The Plan:**
  1.  **Selection:** Identify 4 cases that look similar but operate on different logics.
      *   *Case A (Stock Depletion):* Community irrigation (Standard ToC).
      *   *Case B (Expectation Depletion):* Shopping cart returns (The core hypothesis).
      *   *Case C (Hybrid):* Public transit masking (Physical safety + Normative compliance).
      *   *Case D (Control):* A queue that failed due to congestion, not norm collapse.
  2.  **Process Tracing:** For each case, map the "collapse event." Was it triggered by aggregate volume (stock) or visible defection (norm)?
  3.  **Intervention Audit:** Review existing interventions for these cases. Do "stock" interventions (fines, capacity limits) fail where "expectation" interventions (signage, salience, nudges) succeed?

  **Defense of Method:** This approach produces a typology rather than a theorem. For a fellowship of this duration, a robust typology that correctly predicts which interventions will fail is a higher-value deliverable than a preliminary model that doesn't converge. It leverages existing literature (which I will synthesize) rather than generating new primary data.

  ### 4. Deliverables
  At the end of six months, I will submit:
  1.  **A Working Paper (25–30 pages):** "The Depletion of Compliance," outlining the theoretical distinction and the case evidence.
  2.  **A Diagnostic Toolkit:** A one-page heuristic for practitioners/policymakers to distinguish between "Stock Problems" and "Expectation Problems" to prevent misapplied interventions (e.g., stop fining cart returners if the issue is visibility, not incentive).

  ### 5. Success and Failure Conditions
  *   **Success:** I demonstrate that interventions designed for stock depletion (e.g., increasing penalties) systematically fail in Expectation Depletion cases, while visibility/threshold interventions succeed. The distinction holds across the four cases.
  *   **Failure (The "Redescription" Risk):** The analysis reveals that "Expectation Depletion" is mathematically isomorphic to a standard threshold public good game with network effects. If the distinction yields no *new* predictions about intervention efficacy, the project has failed to identify a distinct category.
  *   **Mitigation:** I will explicitly test for this isomorphism in Month 3. If the distinction collapses, the pivot is to document *why* practitioners confuse the two, turning the paper into a critique of applied policy design rather than theoretical economics.

  ***

  # Advisor's Assessment: Are You Kidding Yourself?

  Here is the straight answer you asked for, separate from the proposal text.

  **1. Is this a real contribution?**
  **Yes, but it is precarious.** You are describing what game theorists might call a "coordination game with conditional cooperators" or what sociologists call "norm cascades." However, framing the *normative expectation* itself as the **Common Pool Resource (CPR)** is a genuinely useful reframing.
  *   **Why it works:** Policy makers constantly apply "Tragedy of the Commons" logic (fines, caps, privatization) to problems that are actually "Tragedy of the Norm" problems (shame, visibility, signaling). If you can show that treating the *belief* as the *stock* changes the intervention, you have value.
  *   **The Risk:** Economists will tell you this is just a "threshold public good." You need to be prepared for that pushback. Your defense is that standard threshold models often ignore the *visibility* mechanism of the threshold.

  **2. Is the deliverable realistic for 6 months half-time?**
  **Yes, provided you stick to the Case Comparison.**
  *   **Do not** attempt to build a new formal model. You will run out of time.
  *   **Do not** attempt to gather new empirical data (surveys/fieldwork). You won't get IRB approval in time, and it's too much work.
  *   **Do** rely on existing case studies (Ostrom's work, behavioral econ experiments, urban design literature) and re-analyze them through your lens.

  **3. The "Redescription" Trap**
  You are worried you are just using fancier clothes. Here is the litmus test for your project:
  *   **Standard Story:** "People defect because incentives outweigh costs." -> **Solution:** Change incentives (fines/rewards).
  *   **Your Story:** "People defect because they no longer believe others are complying." -> **Solution:** Change visibility (make compliance salient, hide defection).
  *   **The Test:** If you can find a case where raising the fine *didn't* work, but making the compliance visible *did*, you have proven your distinction. If you can't find that divergence, you are redescribing.

  **4. Final Verdict**
  You are not kidding yourself, but you are walking a line between **Behavioral Economics** and **Political Theory**.
  *   **The Output:** The "Diagnostic Toolkit" is your safest bet for a tangible deliverable. It forces you to be practical.
  *   **The Pitch:** Sell this as **policy clarity**, not just theory. Fellowships love projects that explain why current policies fail. Your hook is: "We are solving norm problems with stock tools, and that is why we are failing."

  **Go with the Case Comparison. It protects you from the math trap and guarantees you have something to show in six months.**
