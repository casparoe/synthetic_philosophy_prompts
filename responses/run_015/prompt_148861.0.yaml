answer: |-
  **1. The "Free" Weights Problem**
  Your slogan is that the weighted-sum form falls out "for free" once you grant Pareto and expected-utility rationality. But vNM utility functions are only unique up to positive affine transformation. If I rescale Person A's utility function, the weight attached to them in the social sum changes accordingly. So, mathematically, aren't the weights entirely dependent on how you choose to scale the individual functions? If the weights aren't fixed by the math alone, in what sense is the weighted-sum form a substantive result rather than a tautology?

  *Follow-up:* You'll likely say we fix the scales by requiring the social function to represent the same preferences over the same objects. But if I rescale Person A's utility, the social function *still* represents those preferences, just with a different coefficient. So doesn't the constraint on the weights actually come from outside the theorem—from a moral decision to treat the scales as comparable—rather than from the rationality axioms themselves?

  **2. The Veil of Ignorance & Circularity**
  To solve that scaling problem, many Harsanyi defenders appeal to the veil of ignorance: if I have an equal probability of being anyone, I must weight everyone equally. But isn't that move circular? You're trying to derive utilitarianism from rationality, but to get the "equal weights" required for classical utilitarianism, you have to build impartiality into the setup via the equiprobability assumption.

  *Follow-up:* You'll likely argue that equiprobability is an epistemic constraint on rational choice under uncertainty, not a moral premise. But assigning equal probability to being any person *is* a substantive claim about moral impartiality. If you need a moral premise to fix the scales, hasn't the theorem stopped being a derivation of morality from rationality and become a consistency check on a moral view you already assumed?

  **3. Normalization and Equal Capacity**
  A common fix for the scaling issue is to normalize everyone's utility function so their worst-to-best span runs from 0 to 1 before aggregating. But doesn't this quietly build in a massive interpersonal comparison? By normalizing the spans, you're assuming that my capacity for welfare—my distance between misery and bliss—is the same size as yours.

  *Follow-up:* You'll likely say this is just a technical convention to make aggregation possible. But it's not neutral; it rules out the possibility that some people are "welfare giants" or "welfare dwarfs" by fiat. If you assume equal ranges to get the result, aren't you just stipulating the egalitarian conclusion you want to prove, rather than deriving it from the axioms?

  **4. Ex Ante vs. Ex Post Pareto**
  Your argument relies on the *ex ante* version of Pareto: if everyone prefers Lottery L to Lottery M based on expectations, society must too. But many philosophers argue only the *ex post* version is defensible: if everyone prefers Outcome O1 to O2 in every possible state, society should too. Why should we accept the stronger *ex ante* condition, which can force us to reject fair lotteries in favor of certain inequalities?

  *Follow-up:* You'll likely argue that since individuals are rational expected-utility maximizers, social rationality must respect their expectations. But a society isn't a single agent with a mind. If respecting *ex ante* expectations forces us to violate *ex post* fairness (the "Diamond" objection), why should the rationality of the individual trump the fairness of the outcome for the collective?

  **5. Pareto vs. Fairness**
  Following on that: if Harsanyi's theorem forces a choice between *ex ante* Pareto and fairness, and you side with Pareto to save the weighted-sum result, haven't you just shown that the theorem encodes a preference for efficiency over fairness?

  *Follow-up:* You'll likely say Pareto is a minimal condition of efficiency that no reasonable moral theory should reject. But if the "vindication" of utilitarianism rests on defining rationality in a way that prioritizes efficiency over fairness, isn't the theorem just telling us that "If you value efficiency over fairness, you get utilitarianism"? That sounds less like a vindication and more like a conditional trade-off.

  **6. Variable Populations**
  The theorem assumes a fixed set of individuals $N$. But lotteries often change *who* exists—think of climate policy or reproductive choices. How does your vindication of utilitarianism handle variable populations? Does the weighted-sum form even make sense when the people in the sum change depending on the option chosen?

  *Follow-up:* You'll likely say this is a limitation for future work, or that we can treat potential people as having zero utility. But if Harsanyi's framework breaks down on population ethics—the very domain where utilitarianism faces its toughest challenges like the Repugnant Conclusion—can it really claim to be the foundational justification for the theory?

  **7. Utilitarianism vs. Prioritarianism (The Form)**
  I used to think the weighted-sum form was neutral between utilitarianism and prioritarianism, since the weights seem arbitrary. But a fixed weight attached to a *person* isn't the same as extra weight given to a *welfare level*. Prioritarianism applies a concave transformation to welfare, not a weight to the person. Doesn't Harsanyi's linearity proof actually rule out prioritarianism by definition?

  *Follow-up:* You'll likely say prioritarianism violates the Independence axiom because it cares about the distribution of levels, not just the expectations. But if the theorem rules out prioritarianism simply by defining rationality as linearity in probabilities, haven't you rigged the game? Why should we accept a definition of "social rationality" that excludes a view like prioritarianism before the argument even starts?

  **8. Prioritarianism and the Pareto Condition**
  You might argue prioritarianism fails the theorem because it violates Pareto—if we transform welfare concavely, we might prefer an outcome where everyone is slightly worse off to benefit the worst off more. But isn't that only a Pareto violation relative to the *original* utility functions? If the prioritarian says the *transformed* functions are the ones that matter, they satisfy Pareto on their own terms.

  *Follow-up:* You'll likely insist the theorem requires Pareto over the individuals' *own* vNM functions. But that just pushes the question back: why is the "true" moral weight of a person fixed to their raw vNM function rather than a transformed version? If you say "because of the theorem," you're circular. If you say "because of morality," then the theorem isn't doing the work.
