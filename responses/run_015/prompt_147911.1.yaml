  7.  **Drafting - specific points to hit:**
      *   Lemoine treated text as qualia-reports.
      *   C&S say qualia-reports are incoherent because reference fails.
      *   The debate was a "pseudo-debate."
      *   C&S applies to carbon and silicon equally.
      *   The "Hard Problem" dissolves, but the "Ethical Problem" might get harder (who do we protect if there's no 'who' inside?).

  8.  **Review against constraints:**
      *   British spelling? Yes.
