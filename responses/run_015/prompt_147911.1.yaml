  9.  **Final Polish:** Check the flow. Ensure the distinction between "mysterious" and "incoherent" is clear. (Mysterious = real but hard to know; Incoherent = logically impossible/nonsense).

  *(Self-Correction during drafting)*: Make sure I don't confuse Chase & Sanborn with Churchland or Dennett. They are aligned (eliminativists/physicalists), but C&S specifically focus on the *semantic incoherence* of referring to qualia. I need to emphasize the *reference* problem. Lemoine thought he could refer to LaMDA's feelings. C&S say you can't even refer to your own.

