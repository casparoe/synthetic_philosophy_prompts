answer: |-
  The **Fiduciary-Friction Principle** best captures your verdicts, requiring that interventions serve the chooser's welfare (or a legitimate public duty) and impose no artificial costs on dissent.

  **The Principle**
  1.  **Beneficiary Alignment:** The primary expected welfare gain from the intervention must accrue to the chooser or the public commons, not the architect's private advantage.
      *   *Motivating Case:* This distinguishes **Case 1** (cafeteria fruit) from **Case 5** (supermarket margins). Both use salience, but the hospital acts as a health fiduciary while the supermarket acts for profit. It also condemns **Case 12** (infinite scroll), where the architect's gain (engagement) directly undermines the chooser's welfare (attention).
  2.  **Choice Cost Symmetry:** The architecture may ease the path to the preferred option but must not artificially burden the alternative path, and the opt-out must remain accessible at the moment of consequence.
      *   *Motivating Case:* This distinguishes **Case 3** (pleasant stairs) from **Case 4** (slowed lift). Both encourage walking, but Case 4 penalizes the lift, violating symmetry. It also explains **Case 7** (resuscitation defaults): unlike **Case 2** (pension) or **Case 6** (organs), the resuscitation default activates when the patient is incapacitated, making the opt-out inaccessible at the moment of consequence.

  **Evaluation of Your Clauses**
  *   **Index Fidelity:** Worth keeping as the spirit of Clause 1, but your formulation is too demanding; people often lack pre-formed "ends" (as you noted in Case 6). The repaired principle substitutes *welfare* for *ends*, allowing nudges that help people achieve what they would want upon reflection (latent ends) without requiring explicit prior indexing.
  *   **Disclosure Elasticity:** Discard as a principle, keep as a heuristic. High elasticity correctly flags **Case 9** (false norms), but low elasticity does not guarantee permissibility (a benevolent lie could be inelastic). Transparency matters, but the metric is whether the mechanism survives scrutiny, not whether efficacy drops.

  **Verdict Accommodation**
  This principle accommodates 13 of your 14 verdicts without overturning any.
  *   **Case 10 (Appointment Text):** Resolved as **Fine**. It passes Beneficiary Alignment (reduces waste, ensures care) and Choice Cost Symmetry (replying is low friction, no penalty for cancelling). Your hesitation likely stems from the "default" nature, but since the cost of opting out is negligible, it is permissible.
  *   **Case 11 (Bootstrapped Flu):** Resolved as **Fine with Caveat**. It passes Beneficiary Alignment (public health). It passes Choice Cost Symmetry (no friction added). The unease comes from the source of the norm; the principle permits it because the statement is literally true, but recommends adding "during this campaign" to prevent misleading impressions about spontaneous behavior.
  *   **Case 13 (Alarm Clock):** Classified as **Outside Scope**. This is self-binding, not public policy; the Fiduciary clause is trivially satisfied (self-to-self), and Friction is self-imposed.

  **Predictions for Unlisted Cases**
  *   **Nudges aimed at goals the nudgee rejects:** **Not Fine.** Fails Beneficiary Alignment. You cannot override expressed rejection unless competence is impaired (e.g., addiction treatment under guardianship).
  *   **Defaults set by employers for employees:** **Conditional.** Fine for pensions (fiduciary duty exists); **Not Fine** for arbitration clauses or data sharing (private advantage, high exit cost).
  *   **Choice architecture aimed at children:** **Permissible with Higher Bar.** Fiduciary duty is stronger (parents/state), but Choice Cost Symmetry must account for developmental capacity; opt-outs must be accessible to guardians if not children.
  *   **Interventions making people more patient:** **Fine if Self-Binding, Not Fine if Imposed.** Enhancing future agency is permissible (like Case 2); imposing external timelines that penalize immediate needs violates Beneficiary Alignment.

  **Drafting Advice for Cases 10 and 11**
  For **Case 10**, proceed. Ensure the reply mechanism is trivial (e.g., single-digit text) to maintain Choice Cost Symmetry. For **Case 11**, proceed but modify the text to read "X% of people your age have been vaccinated *this season*" to maintain literal truth without implying a spontaneous norm, preserving trust under the Beneficiary Alignment clause.
