      *   *Triviality Check:* If *all* track records are biased, is *all* belief TI? No, because some biases cancel out or are negligible in specific domains (like hard sciences with instrument mediation). The claim isn't that *all* calibration is unjust, but that *uncritical* calibration in the face of known structural bias is unjust.
      *   *Key Distinction:* *Culpability* vs. *Wronging*. One can suffer a wrong without the perpetrator being culpable (structural violence). Fricker focuses on culpability (virtue/vice). The friend's argument exploits this. The solution is to decouple the *existence* of the injustice from the *blame* of the specific hearer, or expand the virtue to include structural awareness.

  7.  **Final Polish:**
      *   Make sure to answer the specific questions: Which step to reject? (2 & 3). What does it cost? (Demands more of the hearer). Is the baseline distinction real? (Yes, evidential vs. normative). Can we handle inherited deficits without personal prejudice? (Yes, via structural/structural-ignorance accounts).

      *(Self-Correction during drafting)*: I need to be careful not to just say "Fricker is right." Fricker's original account *does* have this weakness. The friend is channeling Kristie Dotson or José Medina. I should acknowledge that the friend has identified a genuine limitation in *Fricker's specific formulation*, but that it doesn't kill the *concept* of testimonial injustice. It just requires moving from Fricker 1.0 to Social Epistemology 2.0.
      *Actually, looking closer:* The friend's argument is a *reductio* of Fricker. If I defend Fricker, I need to show where the *logic* fails, not just say "later theorists fixed it."
      *The Logic Failure:* Premise (6). It claims a contradiction. But there is no contradiction if we distinguish between *evidential rationality* (believing according to available data) and *epistemic justice* (believing according to corrected data). The hearer can be evidentially rational but epistemically unjust. Fricker claims TI is an *ethical* failure, not just an epistemic one. So (6) is false: It *is* TI by (1), and it *is* consistent with (2)&(3) if (2)&(3) describe *evidential support* rather than *normative due*. The friend conflates "evidence supports X" with "X is what is due."
      *Wait, Premise (2) says "Credibility due is a function of how reliable she is."* That sounds normative. But (3) says "Reliability shows up in... recorded track record." That's the slide. Reliability *isn't* the record. The record *evidences* reliability. If the record is corrupted, it fails to evidence reliability accurately. So the hearer who follows the record is following *bad evidence*, not reliability itself.
      *Okay, that's the crux.* (3) is false. Reliability is a modal property (propensity to tell truth), not a historical dataset. The dataset *tracks* reliability. If the track is biased, it doesn't track reliability. Therefore, calibrating to the track is *not* calibrating to reliability. So (6)'s claim that "the hearer gave exactly what the evidence supported" is true, but the claim that "therefore it isn't TI by (2)" is false, because (2) refers to *actual* reliability, not *recorded* reliability. The hearer failed to give what was due (based on actual reliability) because they trusted a corrupted proxy (the record).

      *Let's structure the response around this:*
