answer: |-
  This is a sharp argument. Your friend has effectively reconstructed a version of the "structural objection" to Fricker that was developed in the literature roughly 2010–2015 (most notably by Kristie Dotson and José Medina). The argument is valid, but it is **unsound**. It relies on an equivocation in Premise (3) and a category error in Premise (6).

  You are right to trust your instinct: **(1) and the intuition in (6) are the things to keep.** The cost is paid by rejecting **(3)** and clarifying the normative force of **(2)**.

  Here is the breakdown of where the argument fails, what rejecting that step costs you, and how to handle the "inherited deficit" without trivializing the concept.

  ### 1. The False Step: Premise (3)
  > *(3) Reliability shows up in a track record: the hit rate of her assertions in the relevant domain, as recorded.*

  This is the weakest link. (3) conflates **reliability** (a modal property of the speaker: their propensity to speak truthfully/accurately) with **evidence of reliability** (the historical data available to the hearer).

  Fricker's account is virtue-theoretic. The "credibility due" in (2) is fixed by the speaker's *actual* reliability, not the *recorded* reliability. If the record is corrupted by prejudice (as (4) and (5) grant), then the record is **noisy evidence**. It does not accurately "show up" the reliability.

  **The Correction:** A hearer who calibrates *scrupulously to the record* in a context where the record is known (or should be known) to be prejudiced is **not** calibrating to reliability. They are calibrating to a distorted proxy. Therefore, the move in (6)—"the hearer gave exactly what the evidence supported [so] it isn't [TI]"—fails. The hearer gave what the *corrupted data* supported, but they failed to give what the *speaker's actual reliability* supported.

  **The Cost:** Rejecting (3) costs you a passive conception of the hearer. It means the "virtuous hearer" cannot simply be a Bayesian updater on available data. They must also be a **critic of the data-generating process**. Epistemic responsibility now includes a duty to audit the social conditions under which "track records" are produced. If you know women's assertions in your department are historically under-recorded, simply trusting the departmental archive is epistemically vicious, even if it feels "objective."

  ### 2. The Category Error: Premise (6)
  > *(6) ...by (2) and (3) it isn't [testimonial injustice], because the hearer gave exactly what the evidence supported.*

  This premise assumes that **epistemic justification** (believing in proportion to available evidence) and **epistemic justice** (believing in proportion to credibility due) are identical. Fricker's entire project denies this.

  Testimonial injustice is an *ethical* failure rooted in an *epistemic* error. The error is the prejudice. In the "inherited deficit" case, the prejudice is structural, not psychological.
  *   **Friend's Claim:** If the hearer has no prejudice, there is no TI.
  *   **Fricker's Claim:** If the hearer *perpetuates* a prejudice (even unconsciously or structurally) that causes a credibility deficit, there is TI.

  The contradiction in (6) is illusory. It is possible to be **evidentially rational** (given the corrupted dataset) but **epistemically unjust** (because one failed to correct for the corruption). The "wronging" occurs because the speaker is treated as less reliable than they *are*, regardless of whether the hearer is to blame for the data distortion.

  ### 3. Saving the Supervisor (Avoiding Triviality)
  Your friend's dilemma in (7) asks: If we accept "inherited deficits," doesn't *every* reliance on track records become injustice? Doesn't this condemn your supervisor for ignoring your word on the Higgs mass?

  No. You can reject the triviality charge by distinguishing **domains of mediation**.

  *   **High-Mediation Domains (Physics):** The "track record" for the mass of the Higgs is not primarily "Postdoc X says Y." It is "The Detector says Y." Identity prejudice does not depress the hit rate of a particle collider. The "record" here is not socially constructed in the relevant way. Your supervisor is calibrating to instrumental data, not social credibility.
  *   **Low-Mediation Domains (Political Theory/Philosophy):** The "track record" is almost entirely social. It depends on who gets published, who gets cited, and whose arguments are remembered. Here, (4) holds strongly.

  So, rejecting (3) does not commit you to saying your supervisor is unjust. It commits you to saying that **in domains where the evidence base is socially constituted**, hearers have a duty to correct for structural bias. This is not trivializing; it is domain-specific epistemic labor.

  ### 4. The Baseline Distinction: Is it Real Work?
  You asked: *Is the calibration-baseline / counterfactual-baseline distinction doing any real work, or is it just relabelling the problem?*

  It is doing real work, but you need to name it correctly. It is the distinction between:
  1.  **Procedural Rationality:** Did the hearer process the available information correctly?
  2.  **Substantive Entitlement:** Did the speaker receive the credibility matching their actual competence?

  Your friend's argument tries to collapse (2) into (1). If you keep them distinct, you solve the "inherited deficit" problem. A hearer can be procedurally rational (using the available record) while violating substantive entitlement (because the record is biased). Fricker's account is about the latter. The "inherited deficit" is a **structural testimonial injustice**.

  ### 5. How to Handle "Inherited Deficits" Without Personal Prejudice
  You asked: *Is there a version of the account that handles inherited deficits without having to say the hearer's own attitudes are prejudiced?*

  Yes, but it requires moving slightly beyond Fricker's original *Virtue* framework toward a **Structural** framework (Dotson, Medina, Mills).

  *   **Fricker (2007):** Focuses on individual virtue/vice. The hearer is culpable if they *could* have corrected for prejudice.
  *   **Dotson (2011):** Introduces "Contributory Injustice." Even if the hearer isn't actively prejudiced, if they rely on hermeneutical resources that systematically exclude certain groups, they are contributing to the injustice.
  *   **Medina (2013):** Focuses on "Active Ignorance." The injustice isn't just the deficit; it's the resistance to correcting the deficit.

  **The Move:** You tell your friend that the "prejudice" in (1) need not be a *psychological state* of the current hearer. It can be a **structural property of the epistemic environment** that the hearer fails to neutralize.
  *   **If the hearer knows (or should know)** the record is biased: Failing to adjust is a vice (culpable TI).
  *   **If the hearer is ignorant of the bias:** It is still a *wronging* (the speaker suffers a deficit traceable to identity prejudice), but the hearer may not be *culpable*. Fricker allows for this distinction (wronging vs. blame).

  ### Summary of the Reply to Your Friend
  1.  **Reject (3).** Reliability is not the recorded track record; the record is evidence of reliability. If the evidence is corrupted, following it is not following reliability.
  2.  **Reject the inference in (6).** Evidential rationality does not guarantee epistemic justice. One can be rational relative to a corrupted system while still wronging the speaker.
  3.  **Accept (1) and the (6) intuition.** Testimonial injustice *can* occur without active individual prejudice (Structural TI).
  4.  **Deny the Triviality (7).** The duty to correct for bias applies only where the evidence base is socially constituted (not in instrumental physics).
  5.  **Cost:** You must accept that epistemic virtue requires **structural awareness**. It is not enough to be a good Bayesian; one must also be a good sociologist of one's own evidence base.

  **Verdict:** The argument is a known objection (the "structural vs. individual" tension). It shows Fricker's original *virtue-theoretic* formulation is too narrow for structural cases, but it does not collapse the *concept* of testimonial injustice. It just demands a more robust social epistemology. You can keep the concept; you just have to upgrade the framework.
