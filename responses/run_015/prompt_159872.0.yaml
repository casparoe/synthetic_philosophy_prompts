      *   (3) Epistemic Claim: Reliability = Track Record (recorded hit rate).
      *   (4) Historical Claim: Recording/Checking is biased by past prejudice.
      *   (5) Inference: Prejudice depresses recorded track record. Calibrating to record = under-crediting relative to *actual* reliability.
      *   (6) Contradiction Claim: By (1) it's TI (traces to prejudice). By (2)&(3) it's *not* TI (hearer followed evidence).
      *   (7) Dilemma: Either "due" is indeterminate (empty) OR all reliance on track records is TI (trivializing/absurd).
      *   (8) Conclusion: Framework is empty or trivializing.

  3.  **Evaluate the Premises (Philosophical Diagnosis):**

      *   *Premise (1):* Standard Fricker. Keep this.
      *   *Premise (2):* "Credibility due is a function of how reliable she is — *nothing else*." This is the weak link. Fricker distinguishes between *epistemic* credibility (truth-conduciveness) and *moral/political* entitlements, but TI is an *ethical* failure rooted in an *epistemic* error. However, is reliability the *only* factor in what credibility is *due*? Fricker talks about the "neutralization of prejudice." But more importantly, (2) conflates *evidence of reliability* with *reliability itself*.
      *   *Premise (3):* "Reliability shows up in a track record... as recorded." This is a strong empiricist/positivist claim. It ignores *potential* reliability or reliability indicated by *other* markers (education, institutional affiliation, coherence) that aren't just "past hit rate of assertions." It also assumes the hearer *only* has access to the "recorded" track record.
      *   *Premise (6):* The contradiction. It assumes the hearer is "scrupulously calibrating." But if the calibration baseline is corrupted, is the hearer truly epistemically virtuous? Fricker argues the virtuous hearer must *correct* for prejudice.
      *   *The Core Issue:* The argument conflates *evidential support* (what the hearer has) with *normative entitlement* (what the speaker deserves). It also conflates *individual* prejudice (hearer's bias) with *structural* prejudice (the system generating the evidence).

  4.  **Formulate the Counter-Argument (The Strategy):**

      *   **Reject (2) and (3).** Specifically, the identification of "credibility due" strictly with "recorded track record."
      *   **Why?** Fricker's account is *normative*, not purely descriptive. The "credibility due" is what a *virtuous* hearer would assign in a *just* epistemic environment, not necessarily what the *available evidence* dictates in a *corrupt* environment.
      *   **The "Inherited Deficit" Solution:** This is actually a feature, not a bug, of structural injustice. The injustice isn't always in the *current hearer's psychology* (active prejudice) but in their *failure to correct for structural distortion*.
      *   **Addressing the Dilemma (7):** It doesn't lead to triviality. We can distinguish between *reasonable reliance on corrupted evidence* (excusable error) and *testimonial injustice* (culpable failure to adjust). Or, we accept it *is* an injustice, but one attributable to the structure, not necessarily the individual agent's moral blame (though Fricker focuses on individual virtue).
      *   **Better Framework:** Use the distinction between *evidential justification* and *normative entitlement*. Or, use the concept of *epistemic friction* (Medina) or *structural ignorance* (Mills).
      *   **Specific Fix:** The "credibility due" is fixed by *actual* reliability, not *recorded* reliability. The hearer has a responsibility to estimate actual reliability, not just read the record. If the record is known to be biased, ignoring that bias is the prejudice.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Acknowledge the strength:* The friend's argument is a version of the "structural vs. individual" tension in Fricker. It's a known objection (often associated with Medina or Dotson).
      *   *Pinpoint the error:* Premise (2) is the culprit. It reduces a normative claim ("due") to a descriptive/empirical claim ("recorded reliability").
      *   *Explain the cost:* Rejecting (2) means admitting that "what the evidence says" and "what is fair to believe" can come apart. This requires a more robust epistemic virtue ethics. The hearer must do *more* than just calculate probabilities; they must critique the source of the probabilities.
      *   *Address the "Supervisor" worry (7):* Does this mean ignoring a postdoc on Higgs boson mass is TI? No. Because there are *independent checks* on reliability (instrumentation, peer review consensus) that aren't solely identity-based track records. The "record" in physics isn't just "Dr. X said Y." It's "The experiment showed Y." Distinguish between *testimony about facts* and *testimony about expertise*.
      *   *The "Inherited Deficit":* This is structural testimonial injustice. Fricker's original account is too individualistic. The friend is right that Fricker's *original* formulation struggles here, but the *concept* survives if updated (e.g., by Dotson's "contributory injustice" or Medina's "active ignorance").
      *   *Conclusion:* The argument fails because it assumes a passive hearer. A virtuous hearer actively corrects for known structural biases.

  6.  **Refining the Philosophical Nuance:**
