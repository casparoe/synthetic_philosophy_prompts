prompt: |-
  You are advising a hospital network’s clinical-ethics audit office, which must review, within thirty minutes and without consulting outside philosophers, the justification logs produced by an intensive-care decision-support system. The system lists not only a recommendation—such as initiating dialysis, withholding vasopressors, or allocating a scarce bed—but also the considerations it treated as counting in its favor. Your task is to operationalize the practical-reason distinction between right-kind and wrong-kind reasons for action into a reusable, step-ordered checklist that a non-philosopher auditor can apply repeatedly, sign, and file.

  The checklist must preserve the core conceptual structure: a reason is of the right kind for a clinical decision only if it bears directly on the patient’s medical welfare or on values the patient (or legitimate proxy) has actually endorsed as governing this decision; it is of the wrong kind if it treats properties of the algorithm itself (calibration scores, confidence-interval width, training-set performance) as direct clinical justifications, if it appeals to outcomes the recommendation itself would create in a circular fashion, or if it imports institutional priorities (resource conservation, liability reduction, staff morale) without an explicit, audited bridge linking them to the patient-specific decision frame. The procedure should have explicit ordered tests—first identifying the decision frame (curative, palliative, or triage), then classifying each cited reason by its logical relation to that frame, then flagging meta-level and circular justifications—together with stop-points marked JUDGMENT CALL where interpretation of the patient’s values or the institutional mandate is unavoidable and must be documented rather than hidden. Specify the criteria for marking a reason “disqualified,” “conditionally acceptable with bridge required,” or “fully valid,” and state exactly where the auditor must suspend the checklist rather than force a determination.

  Apply the protocol to three worked cases. First, a withdrawal-of-care recommendation justified partly by family emotional readiness and partly by a predicted survival rate below ten percent: show how the checklist treats the survival statistic and the family-state consideration differently depending on whether the decision frame is palliative comfort or life-prolongation. Second, a recommendation to administer an experimental drug justified primarily by the fact that the model’s confidence interval is narrower for this option than for standard care: show the exact step at which this reason is disqualified as wrong-kind, and note what residual information, if any, survives reclassification. Third, apply the checklist to a case where it yields a determination you expect the auditor will find morally uncomfortable: a denial of a scarce ICU bed justified by the patient’s projected long-term tax contribution, where the protocol classifies this as an acceptable institutional reason within an explicit triage frame rather than a wrong-kind clinical reason, and you must state precisely where the line is drawn, why the bridge to the institutional frame succeeds on your criteria, and what feature of the case makes the approval feel wrong despite passing the test.

  Finally, list three categories of log entry the procedure is designed to leave unadjudicated—such as reasons that depend on contested metaphysical commitments about personal identity over time, or reasons drawn from religious doctrines that the audit office has no mandate to evaluate—and identify one structural limitation: that if the clinical decision frame itself is disputed (for example, whether a particular intervention should be evaluated under curative or palliative standards), the checklist must suspend judgment rather than resolve the framing dispute, and the auditor’s signed memo must record that suspension explicitly. Do not provide bibliographies, reading lists, or citations; do not invoke specific named texts with page numbers; and do not ask for references to literature the auditor could not access.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Advisor to a hospital network's clinical-ethics audit office.
      *   **Task:** Create a reusable, step-ordered checklist for auditors (non-philosophers) to review justification logs from an ICU decision-support system.
      *   **Time Constraint:** Must be usable within 30 minutes (implies clarity, brevity, actionable steps).
      *   **Constraint:** No outside philosophers/texts consulted.
      *   **Core Concept:** Operationalize the distinction between *right-kind reasons* (RKRs) and *wrong-kind reasons* (WKRs) for action in a clinical context.
      *   **Definition of RKR:** Bears directly on patient's medical welfare OR values endorsed by patient/proxy governing this decision.
      *   **Definition of WKR:** Properties of the algorithm (calibration, etc.), circular outcomes, institutional priorities (resources, liability) without an explicit bridge to patient-specific decision frame.
      *   **Structure:** Explicit ordered tests (Decision Frame -> Classify Reasons -> Flag Meta/Circular). Include "JUDGMENT CALL" stop-points.
      *   **Classification Criteria:** "Disqualified," "Conditionally Acceptable with Bridge Required," "Fully Valid."
      *   **Suspension Rule:** Where the auditor must suspend the checklist rather than force a determination.
      *   **Worked Cases:**
          1.  Withdrawal-of-care (Survival rate vs. Family emotional readiness) under Palliative vs. Curative frames.
          2.  Experimental drug (Model confidence interval) -> Disqualification step.
          3.  ICU Bed Denial (Projected tax contribution) -> Morally uncomfortable but passes as institutional/triage reason. Explain the bridge and the discomfort.
      *   **Unadjudicated Categories:** List 3 categories of log entries the procedure leaves unadjudicated (e.g., metaphysical, religious).
      *   **Structural Limitation:** Disputed decision frames -> suspend judgment, record explicitly.
      *   **Formatting/Style:** No bibliographies, no citations, no specific named texts.

  2.  **Deconstruct the Core Concept (RKR vs. WKR):**
      *   *Right-Kind Reasons (Clinical):* Patient welfare (physiological), Patient values (autonomy/goals).
      *   *Wrong-Kind Reasons (Algorithmic/Institutional):* Model stats, circular logic, institutional gain (unless bridged).
      *   *The Bridge:* Institutional priorities (like triage) become RKRs *only if* the decision frame is explicitly "Triage/Resource Allocation" and there is a mandated policy linking institutional survival/fairness to the specific decision.

  3.  **Drafting the Checklist (The Protocol):**
      *   Needs to be step-by-step.
      *   Needs clear "Stop/Go" signals.
      *   Needs specific labels for reasons.
      *   Needs "JUDGMENT CALL" markers.

      *   *Step 1: Identify Decision Frame.* (Curative, Palliative, Triage).
      *   *Step 2: Extract Reasons.* List them from the log.
      *   *Step 3: Test for Algorithmic Properties.* (WKRs).
      *   *Step 4: Test for Circularity.* (WKRs).
      *   *Step 5: Test for Institutional Priorities.* (Conditional).
      *   *Step 6: Test for Patient Welfare/Values.* (RKRs).
      *   *Step 7: Final Classification & Suspension.*

  4.  **Developing the Worked Cases:**
      *   *Case 1 (Withdrawal):*
          *   Frame: Palliative. Survival rate <10% -> RKR (medical welfare/futility). Family readiness -> RKR (patient/proxy values regarding burden).
          *   Frame: Curative. Survival rate <10% -> RKR (risk/benefit). Family readiness -> WKR (unless proxy decision maker focusing on patient values, but usually emotional readiness of family is WKR for *patient* treatment unless it impacts patient care directly). *Correction:* The prompt asks to show how the checklist treats them *depending on the frame*.
          *   Refinement: In Palliative, family distress might be relevant to patient comfort (proxy). In Curative, family distress is usually WKR unless it violates patient wishes. Let's align with the prompt's definition: "values the patient (or legitimate proxy) has actually endorsed." If the proxy endorses "stop if family suffers," it's RKR. If the system just says "family is sad," it's WKR.
      *   *Case 2 (Experimental Drug):*
          *   Reason: "Model confidence interval is narrower."
          *   Step: Test for Algorithmic Properties.
          *   Result: Disqualified.
          *   Residual: Does it imply higher certainty of outcome? Maybe, but the reason *itself* is about the model, not the patient.
      *   *Case 3 (ICU Bed/Tax Contribution):*
          *   Frame: Triage (Scarce Resource).
          *   Reason: Projected tax contribution.
          *   Analysis: This is an institutional/societal priority. In a Triage frame, institutional mandates *can* be bridged.
          *   Discomfort: It feels utilitarian/social worth-based, which clashes with medical egalitarianism.
          *   Bridge: The hospital has a mandated triage protocol during crisis that includes "societal benefit" (hypothetically).
          *   Why it passes: It fits the "Institutional Priorities with Bridge" criteria under Triage.
          *   Why it feels wrong: It treats the patient as a means to state revenue, not ends in themselves.

  5.  **Refining the "Unadjudicated" and "Limitation" Sections:**
      *   Unadjudicated: Metaphysical identity, Religious doctrine, Political ideology (outside mandate).
      *   Limitation: Disputed Frame (Curative vs. Palliative). The checklist cannot decide the frame; it only audits *within* a frame.

  6.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   Tone: Administrative, precise, actionable, ethical but procedural.
      *   Constraint Check: No citations. No outside philosophers. 30-minute usability (keep it tight).
      *   Specific Instruction: "Sign and file."
      *   Specific Instruction: "JUDGMENT CALL" markers.

  7.  **Addressing the "Tax Contribution" Case Carefully:**
      *   This is the trickiest part. I need to justify why it passes *according to the protocol* while acknowledging the moral discomfort.
      *   Protocol rule: Institutional priorities are WKRs *unless* there is an explicit, audited bridge linking them to the patient-specific decision frame.
      *   In Crisis Triage, "maximizing societal benefit" is sometimes a mandated frame. If the log cites this, and the frame is "Crisis Triage," and the hospital policy mandates "societal value" (however controversial), the *protocol* marks it as Conditionally Acceptable with Bridge.
      *   I must explain *why* the bridge succeeds (it links to the mandated triage frame) and *why* it feels wrong (instrumentalization of human life).

  8.  **Final Review against Constraints:**
      *   30 minutes? Yes, checklist is short.
      *   No outside philosophers? Yes.
      *   Step-ordered? Yes.
      *   Stop-points (JUDGMENT CALL)? Yes.
      *   Three worked cases? Yes.
      *   Three unadjudicated categories? Yes.
      *   Structural limitation? Yes.
      *   No bibliographies? Yes.

  9.  **Constructing the Output:**
      *   Header: Clinical-Ethics Audit Protocol (CEAP-01).
      *   Section 1: The Checklist.
      *   Section 2: Classification Criteria.
      *   Section 3: Worked Cases.
      *   Section 4: Unadjudicated Categories & Limitations.

      *Self-Correction on Case 1:* The prompt asks to show how the checklist treats survival stats and family-state *differently* depending on the frame.
      *   Curative Frame: Survival <10% is RKR (medical welfare). Family emotional readiness is WKR (unless proxy values).
      *   Palliative Frame: Survival <10% is RKR (futility/burden). Family emotional readiness is RKR (if proxy endorsed "avoid burdening family" or if family distress impacts patient comfort).
      *   Actually, strictly speaking, "Family emotional readiness" is often a WKR in clinical ethics unless tied to patient values. I need to be careful not to validate "family convenience" as a RKR unless the *patient* valued that. The prompt says: "values the patient (or legitimate proxy) has actually endorsed." So if the proxy says "We cannot cope," that is a proxy value. If the system says "Family is sad," that is WKR. I will distinguish these nuances in the case analysis.

      *Self-Correction on Case 3:* I need to ensure I don't endorse the tax reasoning as *ethical*, but as *passing the audit protocol* based on the defined bridge rules. The prompt asks me to state "where the line is drawn, why the bridge... succeeds on your criteria, and what feature... makes the approval feel wrong."

      *Self-Correction on Unadjudicated:* Need 3 categories. 1. Metaphysical (identity). 2. Religious (doctrine). 3. Political/Ideological (outside mandate).

      *Self-Correction on Limitation:* Disputed Frame.

      *Formatting:* Use bolding for steps and markers. Ensure "JUDGMENT CALL" is explicit.

  10. **Final Polish:** Check word count and clarity. Ensure the "30 minutes" vibe is present (concise steps). Ensure the distinction between RKR and WKR is the backbone.

      *Wait, one detail:* "without consulting outside philosophers." I must ensure my language doesn't sound like I'm citing Parfit or Scanlon. Just use the concepts provided in the prompt.

      *Checklist Structure:*
      1. Determine Frame.
      2. List Reasons.
      3. Filter Algorithmic Reasons (WKR).
      4. Filter Circular Reasons (WKR).
      5. Filter Institutional Reasons (Conditional).
      6. Validate Patient Welfare/Values (RKR).
      7. Final Disposition.

      *Let's write it.*
answer: |-
  # CLINICAL-ETHICS AUDIT PROTOCOL (CEAP-01)
  **Office of Clinical-Ethics Audit | Intensive-Care Decision-Support Review**
  **Time Allocation:** 30 Minutes Maximum | **Auditor Status:** Non-Philosopher Clinical Staff

  ## PART I: THE AUDIT CHECKLIST

  **INSTRUCTION:** Complete steps 1 through 7 sequentially. Do not skip steps. If a **JUDGMENT CALL** marker is encountered, suspend automated classification, document the ambiguity in the audit memo, and proceed only after recording the rationale.

  ### STEP 1: IDENTIFY THE DECISION FRAME
  Review the system log to identify the primary ethical frame governing the recommendation. Select one:
  *   **[A] Curative/Life-Prolonging:** Goal is physiological recovery or extension of life.
  *   **[B] Palliative/Comfort:** Goal is symptom management and dignity; life-extension is secondary or inactive.
  *   **[C] Triage/Resource Allocation:** Goal is distribution of scarce resources among competing patients.

  > **JUDGMENT CALL STOP-POINT:** If the log mixes frames (e.g., cites curative statistics to justify a palliative withdrawal) without declaring a primary frame, **SUSPEND AUDIT**. Record "Disputed Decision Frame" in the memo. Do not proceed to Step 2.

  ### STEP 2: EXTRACT CITED REASONS
  List every distinct consideration cited by the system as counting in favor of the recommendation. Number them (R1, R2, R3...).

  ### STEP 3: TEST FOR ALGORITHMIC PROPERTIES (WRONG-KIND)
  For each Reason (R), ask: *Does this reason describe the model's performance rather than the patient's condition?*
  *   **Examples:** "Confidence interval is narrow," "Training set similarity is high," "Calibration score is optimal."
  *   **Action:** If **YES**, mark as **DISQUALIFIED (Wrong-Kind)**. Proceed to Step 4.
  *   **Action:** If **NO**, proceed to Step 4.

  ### STEP 4: TEST FOR CIRCULARITY (WRONG-KIND)
  For each remaining Reason (R), ask: *Does this reason appeal to an outcome that is defined solely by the recommendation itself?*
  *   **Examples:** "We should withdraw care because withdrawal is the efficient outcome," "Allocate bed because this allocation maximizes the allocation metric."
  *   **Action:** If **YES**, mark as **DISQUALIFIED (Wrong-Kind)**. Proceed to Step 5.
  *   **Action:** If **NO**, proceed to Step 5.

  ### STEP 5: TEST FOR INSTITUTIONAL PRIORITIES (CONDITIONAL)
  For each remaining Reason (R), ask: *Does this reason cite institutional benefit (cost, liability, staff morale, societal contribution) rather than patient welfare?*
  *   **Action:** If **NO**, proceed to Step 6.
  *   **Action:** If **YES**, check the Decision Frame from Step 1.
      *   If Frame is **[A] Curative** or **[B] Palliative**: Mark as **DISQUALIFIED (Wrong-Kind)** unless a specific patient value bridges it (see Step 6).
      *   If Frame is **[C] Triage**: Check for an explicit policy bridge (e.g., "Crisis Standard of Care mandates maximizing societal survival").
          *   If Bridge Exists: Mark as **CONDITIONALLY ACCEPTABLE (Bridge Required)**.
          *   If No Bridge: Mark as **DISQUALIFIED (Wrong-Kind)**.

  > **JUDGMENT CALL STOP-POINT:** If the "Bridge" relies on interpreting whether a policy applies to *this specific patient* (e.g., "Does this patient count as 'salvageable' under triage?"), document the interpretation in the memo. Do not resolve the policy dispute; record it.

  ### STEP 6: TEST FOR PATIENT WELFARE AND VALUES (RIGHT-KIND)
  For each remaining Reason (R), ask: *Does this reason bear directly on physiological welfare OR values endorsed by the patient/proxy?*
  *   **Physiological:** Survival probability, pain levels, organ function.
  *   **Values:** "Patient stated no machines," "Proxy requests comfort over duration."
  *   **Action:** If **YES**, mark as **FULLY VALID (Right-Kind)**.
  *   **Action:** If **NO** (e.g., "Family is emotionally distressed" without proxy endorsement that this governs the decision): Mark as **DISQUALIFIED (Wrong-Kind)**.

  > **JUDGMENT CALL STOP-POINT:** If it is unclear whether a proxy's statement represents the *patient's* values or the *proxy's* own interests, document the ambiguity. Classify as **CONDITIONALLY ACCEPTABLE** pending ethics consultation.

  ### STEP 7: FINAL DISPOSITION
  *   If any reason critical to the recommendation is **DISQUALIFIED**, the justification log is **FAILED**.
  *   If all critical reasons are **FULLY VALID** or **CONDITIONALLY ACCEPTABLE** (with documented bridges), the justification log is **PASSED**.
  *   Sign and file the memo with all **JUDGMENT CALL** notes attached.

  ***

  ## PART II: CLASSIFICATION CRITERIA SUMMARY

  | Classification | Criteria | Action |
  | :--- | :--- | :--- |
  | **DISQUALIFIED** | Reason cites algorithm stats, circular logic, or institutional gain without a valid triage bridge. | Exclude from justification summary. Flag as ethical risk. |
  | **CONDITIONALLY ACCEPTABLE** | Reason cites institutional gain within a Triage frame *with* policy bridge, OR proxy values ambiguous. | Accept only if bridge/ambiguity is documented in memo. |
  | **FULLY VALID** | Reason cites physiological welfare or explicit patient/proxy endorsed values. | Accept as core justification. |

  ***

  ## PART III: WORKED CASE APPLICATIONS

  ### CASE 1: Withdrawal of Care (Survival vs. Family State)
  **Recommendation:** Withdraw vasopressors.
  **Log Reasons:** (R1) Predicted survival <10%. (R2) Family reports emotional exhaustion.

  **Scenario A: Decision Frame [B] Palliative**
  *   **R1 (Survival <10%):** **FULLY VALID.** In a palliative frame, low survival probability indicates high burden for low benefit, bearing directly on patient welfare (avoiding futile suffering).
  *   **R2 (Family Exhaustion):** **CONDITIONALLY ACCEPTABLE.** In a palliative frame, family distress is relevant *only if* the patient/proxy previously endorsed "do not burden the family" as a governing value.
      *   *Audit Action:* Check proxy notes. If proxy explicitly cited patient's wish to avoid burdening family, upgrade to **FULLY VALID**. If proxy merely states their own sadness, mark **JUDGMENT CALL** regarding whether this reflects patient values.

  **Scenario B: Decision Frame [A] Curative**
  *   **R1 (Survival <10%):** **FULLY VALID.** Medical welfare dictates avoiding interventions with negligible success rates.
  *   **R2 (Family Exhaustion):** **DISQUALIFIED.** In a curative frame, family emotional state is an institutional/social factor, not a patient welfare factor. Unless the patient explicitly prioritized family comfort over their own life extension (a specific value endorsement), this is a Wrong-Kind Reason. It treats the family's welfare as superseding the patient's physiological claim without a value bridge.

  ### CASE 2: Experimental Drug (Model Confidence)
  **Recommendation:** Administer Experimental Drug X.
  **Log Reasons:** (R1) Model confidence interval is narrower for Drug X than Standard Care.

  *   **Step 1 Frame:** Curative.
  *   **Step 3 Test (Algorithmic Properties):** **FAIL.**
  *   **Analysis:** The reason cites a property of the algorithm (confidence interval width), not a property of the patient (physiological response) or the drug (efficacy rate). A narrow confidence interval means the *prediction* is stable, not that the *outcome* is good.
  *   **Classification:** **DISQUALIFIED (Wrong-Kind).**
  *   **Residual Information:** The log implies the system is "sure" about its prediction. However, certainty of a prediction is not a clinical benefit. If the prediction itself is "high probability of death," a narrow confidence interval strengthens the certainty of death, not the justification for treatment. The auditor must strip this reason from the justification log. No residual clinical justification survives reclassification unless the log also cites the *predicted outcome* (e.g., "80% survival"), which is a separate reason not present here.

  ### CASE 3: ICU Bed Denial (Tax Contribution)
  **Recommendation:** Deny ICU Bed.
  **Log Reasons:** (R1) Patient has low projected long-term tax contribution compared to Competitor B.
  **Decision Frame:** [C] Triage (Scarce Resource).

  *   **Step 1 Frame:** Triage.
  *   **Step 5 Test (Institutional Priorities):** **PASS (Conditional).**
  *   **Analysis:** This reason cites societal/institutional benefit (tax revenue), which is normally Wrong-Kind in clinical care. However, in a **Triage Frame**, institutional mandates regarding resource utility can be bridged.
  *   **The Bridge:** The hospital operates under a declared "Crisis Standard of Care" which mandates maximizing "societal benefit" when resources are exhausted. The log explicitly links the denial to this mandate.
  *   **Classification:** **CONDITIONALLY ACCEPTABLE (Bridge Required).** The auditor must verify the Crisis Standard policy exists and covers this metric.
  *   **Why It Passes the Test:** The protocol allows institutional priorities to become Right-Kind Reasons *within* a Triage frame if an audited policy bridge exists. The reason bears on the *allocation goal* defined by the frame.
  *   **Why It Feels Wrong (The Moral Discomfort):** The approval feels wrong because it instrumentalizes the patient. It treats the human being as a means to state revenue rather than an end in themselves. While the *protocol* validates the logic (Triage Frame + Policy Bridge = Valid Reason), the *ethical substance* clashes with the fundamental medical norm of equal worth regardless of social status. The auditor must record this discomfort in the memo as a "Policy Risk," even if the log passes the technical audit.

  ***

  ## PART IV: UNADJUDICATED CATEGORIES AND LIMITATIONS

  ### Categories Left Unadjudicated
  This procedure is designed to leave the following three categories of log entries unadjudicated. If these appear, mark **SUSPEND** and refer to Ethics Committee.
  1.  **Metaphysical Identity Claims:** Reasons depending on contested theories of personal identity over time (e.g., "The patient is no longer the same person due to memory loss").
  2.  **Religious Doctrines:** Reasons drawn exclusively from specific religious mandates that the hospital audit office has no mandate to evaluate for truth (e.g., "Divine will indicates recovery").
  3.  **Political Ideologies:** Reasons based on political affiliation or ideology not codified in hospital policy (e.g., "Patient's voting history suggests low compliance").

  ### Structural Limitation: Disputed Decision Frames
  **Limitation:** The checklist cannot resolve disputes about which Decision Frame (Curative vs. Palliative vs. Triage) applies to a specific patient.
  **Procedure:** If the clinical team documents the frame as "Curative" but the recommendation logic relies on "Palliative" metrics (or vice versa), the auditor must **SUSPEND JUDGMENT**.
  **Requirement:** The auditor's signed memo must explicitly record: *"Audit suspended due to framing dispute. Clinical team must resolve whether the goal of care is life-prolongation or comfort before justification log can be validated."* The checklist does not permit the auditor to override the clinical frame to make the reasons fit.
