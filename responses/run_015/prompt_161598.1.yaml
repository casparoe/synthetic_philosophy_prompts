answer: |-
  # Game Title: The Spotlight Protocol

  **Goal:** Simulate a "Global Workspace" where information competes for broadcast. The game forces a wedge between *being broadcast* (Access) and *being experienced* (Phenomenality) without using those words until the end.

  **Time:** 70 Minutes Hard Stop.
  **Players:** 14 Students + You (Facilitator).
  **Props:** 1 bright desk lamp (The Spotlight), 50 poker chips (Attention), Index cards (Data), 1 Bell, 2 Notebooks, 1 Blindfold (optional, or just "Eyes Closed" rule).

  ---

  ## 1. Roles & Room Setup (10 Minutes)

  Arrange tables in a U-shape. The **Spotlight** (lamp) sits on a central table.

  **The System Core (4 Students):**
  1.  **Reporter (1):** Sits at the Spotlight. Only they can read cards under the light aloud.
  2.  **Actor (1):** Sits next to Reporter. Decides the team's physical action based on the Report.
  3.  **Gatekeeper (1):** Manages the lamp and chips. Enforces timing.
  4.  **Lab Notebook (2):** Sit apart. They record *only* public data: Time, What was under the lamp, What Reporter said, What Actor did. They cannot see the Modules' hands or faces.

  **The Modules (9 Students):**
  Sit around the perimeter. Each gets a specific "Input Channel."
  *   *Visual: Color, Motion, Edges (3)*
  *   *Auditory: Pitch, Volume, Location (3)*
  *   *Internal: Hunger, Emotion, Memory (3)*

  **Currency:**
  Each Module starts with 3 Poker Chips.
  *   **Bid:** To put your card under the Spotlight.
  *   **Bribe:** To give chips to another Module (Influence without Access).

  **Win Condition:**
  *   **Team Score:** Correctly identify the "Target Stimulus" (You whisper a target to the Actor, e.g., "Find the Red Card").
  *   **Individual Score:** Get your card under the Spotlight for 5 full seconds.
  *   **Reward:** Winning team gets candy/privilege. Top 3 individual bidders pick next week's topic.

  ---

  ## 2. The Core Loop (How a Round Works)

  1.  **Stimulus Deal:** You hand each Module a face-down index card with a word/symbol (e.g., "RED", "LOUD", "PAIN").
  2.  **Bidding Phase (60 secs):** Modules look at cards. They silently place chips in a central cup. Highest bidder wins the Spotlight. (Tie-breaker: Most chips held in reserve).
  3.  **Broadcast Phase (10 secs):** Gatekeeper turns on Lamp. Winner places card under light.
  4.  **Report/Action:** Reporter reads card. Actor performs action.
  5.  **Record:** Notebook logs the event.
  6.  **Reset:** Chips returned. Cards shuffled.

  ---

  ## 3. The 5 Rounds (40 Minutes Total)

  *You act as the Dungeon Master. Read the specific "Glitch" instructions to the relevant players privately before the round starts.*

  ### Round 1: Calibration (Normal)
  *   **Goal:** Establish the baseline.
  *   **Mechanic:** Standard loop. Highest bid wins. Card stays under light for 10 seconds. Reporter reads it.
  *   **Expected Outcome:** Smooth. Notebook records: "Card: RED. Report: 'It is Red.' Action: Point Right."
  *   **Philosophical Point:** Access and Experience align. Intuition says "This is conscious."

  ### Round 2: The Flicker (Instability)
  *   **Goal:** Challenge the "Threshold" of consciousness.
  *   **Glitch:** Tell the **Gatekeeper** privately: "Turn the lamp off after 3 seconds, no matter what."
  *   **Mechanic:** Module wins bid. Places card. Lamp turns on. 3 seconds later—*click*. Dark.
  *   **Conflict:** Reporter didn't get to read it. Actor didn't act. But the card *was* in the workspace.
  *   **Debrief Question:** "Did the system see the card? The Notebook says 'Light On: Yes'. The Transcript says 'Report: None'."

  ### Round 3: The Mask (Private Block)
  *   **Goal:** Separate Experience from Access.
  *   **Glitch:** Tell **Module A** privately: "Your card is 'FIRE'. You feel it vividly. But the other Modules have a rule: If Module A bids, everyone else pools chips to outbid you."
  *   **Mechanic:** Module A bids. The coalition outbids them. Module A's card never sees the light.
  *   **Conflict:** Module A is screaming "I have Fire!" The System Report says "Nothing."
  *   **Debrief Question:** "Module A insists something happened. The Notebook says 'Nothing Broadcast'. Who is right?"

  ### Round 4: The Dark Relay (The Zombie)
  *   **Goal:** Separate Access from Experience. **(Crucial Round)**
  *   **Glitch:** Tell the **Winning Module** privately: "Do not look at your card. Hold it face down. Place it face down under the lamp. You are a relay only."
  *   **Mechanic:** Module wins bid. They never see the content. The *Reporter* reads the card (it has text on the side or you allow the Reporter to flip it). The Actor acts.
  *   **Conflict:** The Transcript is *identical* to Round 1. "Card: RED. Report: 'It is Red.' Action: Point Right." But the Module holding the data had no experience of it.
  *   **Debrief Question:** "Compare Notebook Round 1 and Round 4. They are identical. Was Round 4 conscious?"

  ### Round 5: The Muted Box (Influence & Action)
  *   **Goal:** Show Report is just a probe, not the thing itself. Add Influence mechanic.
  *   **Glitch:** Tell **Reporter**: "You are muted. You cannot speak." Tell **Modules**: "You may pass chips to others before bidding."
  *   **Mechanic:** Modules bribe a winner. Card goes under light. Reporter stays silent. Actor must still act based on the card.
  *   **Conflict:** Information was broadcast (Actor used it). Influence happened (Bribers changed the outcome). But no Report was made.
  *   **Debrief Question:** "If we can't ask the system what it saw, but it still acts correctly, did it know?"

  ---

  ## 4. Timeline (Hard Stops)

  *   **00:00 – 00:10:** Roles & Setup. (Be strict. Assign seats immediately).
  *   **00:10 – 00:15:** Rules Walkthrough. (Run a 30-second practice bid).
  *   **00:15 – 00:23:** Round 1 (Normal).
  *   **00:23 – 00:31:** Round 2 (Flicker).
  *   **00:31 – 00:39:** Round 3 (Masked).
  *   **00:39 – 00:47:** Round 4 (Dark Relay).
  *   **00:47 – 00:55:** Round 5 (Muted/Influence).
  *   **00:55 – 01:00:** **The Reveal.** Hold up Lab Notebook pages for Round 1 and Round 4. Ask: "What is the difference?"
  *   **01:00 – 01:10:** Debrief (See below).

  ---

  ## 5. The Debrief Script (10 Minutes)

  *Do not lecture. Ask questions. Let them feel the gap.*

  1.  **The Transcript Trap:** Hold up the Notebook pages for Round 1 (Normal) and Round 4 (Dark Relay).
      *   *Ask:* "These records are identical. The system did the same thing. The Reporter said the same thing. But in Round 4, the 'eye' module was blind. If you were an alien studying this brain from the outside, could you tell the difference?"
      *   *Point:* External behavior (Access) doesn't prove internal feeling (Phenomenality).

  2.  **The Frustration Trap:** Turn to the Module from Round 3 (Masked).
      *   *Ask:* "You knew you had the 'Fire' card. The system said 'Nothing'. Did the Fire exist?"
      *   *Point:* You can have feeling without access (subconscious pain, repressed memory).

  3.  **The Vocabulary Reveal:**
      *   "You just argued about **Access Consciousness** (Round 1, 4, 5: Info available for report/action) vs. **Phenomenal Consciousness** (Round 3: The feeling itself)."
      *   "Global Workspace Theory explains the Lamp (Access). It does not explain why holding the card feels like anything at all."

  4.  **The Hard Limit:**
      *   "Did anyone *actually* feel pain in Round 3? No. You were roleplaying. This game simulates the *structure* of the gap, not the gap itself. I cannot manufacture qualia in a library. That is the Hard Problem."

  ---

  ## 6. Predicted Failure Modes & Fixes

  **1. The Loud Kid (Hogging the Bid)**
  *   *Risk:* One student dominates the bidding every round, turning it into a shouting match.
  *   *Fix:* **Blind Bidding.** Students put chips in a cup simultaneously. Gatekeeper reveals amounts. No shouting allowed during bid phase. If you talk, you lose chips.

  **2. The Dark Relay Cheater**
  *   *Risk:* In Round 4, the Module peeks at the card because they want the Individual Point.
  *   *Fix:* **The Envelope Method.** Hand the Round 4 card in a sealed opaque envelope. They must place the *envelope* under the lamp. The Reporter is allowed to open it. The Module is physically prevented from seeing the content.

  **3. The "So What?" Reaction**
  *   *Risk:* Students think the Dark Relay is just "cheating" and not philosophical.
  *   *Fix:* Frame it as "Processing without Perception." Ask: "When you drive home on autopilot and don't remember the drive, were you a Dark Relay? You stopped at lights (Action), but where was the experience?"

  **4. Time Creep**
  *   *Risk:* Rounds drag on.
  *   *Fix:* Use the Bell. When the bell rings, the Lamp goes off immediately. No finishing sentences. This creates the "Flicker" tension naturally.

  **5. The Notebook Boredom**
  *   *Risk:* The 2 Notebooks feel left out.
  *   *Fix:* Give them a specific "Audit" task. They must sign off on whether the "Consciousness Criteria" were met each round. They hold the power to validate the points.

  ---

  ## 7. What This Game Cannot Do (Honesty Check)

  You asked me to be honest about the limitations. Here is what the game *cannot* generate:

  1.  **Real Qualia:** The "Masked" module won't actually feel the qualia of the card. They will only feel the *frustration* of being blocked. You must explicitly state in the debrief: "You felt excluded, not 'phenomenally conscious'. But that exclusion is the closest proxy we have in a room of 14 teenagers."
  2.  **The Hard Problem Solution:** The game demonstrates the *explanatory gap*, it doesn't solve it. Students might leave thinking "Okay, so Access isn't Feeling." They might not grasp *why* Feeling exists at all. You need to close with: "Science explains the Lamp. It doesn't explain why the Lamp casts a shadow that feels like something."
  3.  **Unity of Consciousness:** The game fragments the mind into modules. It doesn't capture the *unity* of experience (why red and loud feel like one moment). You can mention this as a "Level 2" problem for next time.

  **Final Tip:** Print the "Glitch Instructions" on separate slips of paper before the club starts. Do not explain Round 4 until Round 4 begins. Secrecy is essential for the reveal to land. Good luck.
