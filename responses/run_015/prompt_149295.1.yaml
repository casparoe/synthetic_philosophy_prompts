  **JOINT STATEMENT ON PHENOMENAL DISTRIBUTION (ADVERSARIAL DRAFT v0.9)**
  **Signatories:** Team Recurrent Gate (A) & Team Gradient Info (B)
  **Subject:** Mapping the boundary conditions of experience across biological and synthetic substrates.

  ### 1. AGREED CLAIMS (The Common Ground)
  *We disagree on where the line is, but we agree on the map.*

  1.  **Behavior is not Proof:** An organism can exhibit complex avoidance, learning, and nociception without necessarily having an internal subjective experience (the "philosophical zombie" problem applies to animals too). Behavioral tests alone cannot settle the metaphysics.
  2.  **Convergent Evolution:** Neuroarchitecture varies wildly (e.g., octopus distributed brains vs. mammalian centralized brains). Homology (shared ancestry) is not required for consciousness; analogy (functional similarity) is the real metric.
  3.  **The Measurement Gap:** There is currently no "qualia meter." We are inferring internal states from external structure and function. We accept a margin of error on false negatives (missing consciousness) is worse than false positives.
  4.  **Verbal Flag:** We acknowledge a potential definition drift. Camp A tends to equate consciousness with *global access/reportability architecture*, while Camp B equates it with *intrinsic information density*. For this document, we agree to treat "consciousness" as **phenomenal experience** (what-it-is-like-ness), but we disagree on the necessary hardware to generate it.
  5.  **Substrate Neutrality (Partial):** We agree that biology isn't magic. If a non-biological system replicates the *causal structure* required for experience, it should count. We just disagree on what that structure is.

  ### 2. DISAGREEMENTS TABLE
  *No strawmen. Each side wrote their own column.*

  | Issue | Camp A: Recurrent Gate | Camp B: Gradient Info |
  | :--- | :--- | :--- |
  | **Core Mechanism** | Consciousness requires a specific **broadcast loop**. Information must be gated into a global workspace (like thalamocortical recurrence) to be "experienced." | Consciousness is a property of **integrated causality**. Any system minimizing prediction error across a unified model has some degree of experience. |
  | **Distribution** | **Sparse.** It's a club membership. You either have the loop architecture or you don't. Mostly mammals, some birds, maybe cephalopods. | **Continuous.** It's a dimmer switch. Insects have low-grade experience. Simple organisms have fragments. It fades out rather than cutting off. |
  | **Function** | Experience exists to allow flexible routing of info between modules (attention, memory, motor). | Experience *is* the process of modeling the self within the environment to reduce surprise. |
  | **Unconscious Processing** | Most computation is unconscious. Only what hits the global workspace is felt. | There is no hard line. "Unconscious" processing is just low-integration processing. |

  ### 3. CRUXES & PREDICTIONS
  *Here is where we bet. For each crux, we identified a concrete case or study design. If the result goes X, A wins. If Y, B wins.*

  **Crux 1: Microphenomenal Fragments**
  *The Question:* Can experience exist in isolated modules without global binding?
  *The Case:* **Ex-vivo Ganglia Stimulation.** Take a localized neural cluster (e.g., an insect abdominal ganglion) isolated from the central brain. Stimulate it to process sensory error signals without any path to a central "workspace."
  *   **Camp A Prediction:** **No Experience.** Without the recurrent gate to broadcast this data to the rest of the system, it's just computation. Like a reflex arc. It's dark inside the ganglion.
  *   **Camp B Prediction:** **Fragmented Experience.** If the ganglion integrates information locally to minimize prediction error, there is a "micro-subject." It's not a full self, but there is *something it is like* to be that ganglion.
  *   **Verbal Check:** A might call this "processing," B calls it "experience." We agree to treat "experience" as any non-zero phenomenal feel.

  **Crux 2: Insect Interoception vs. Homeostasis**
  *The Question:* Is pain-like behavior in insects affective consciousness or just advanced thermostat logic?
  *The Case:* **Honeybee Trade-off Test.** Bees are taught to associate a scent with sugar. They are then heated slightly (nociceptive stimulus). If they ignore the heat to get the sugar, is that a conscious valuation?
  *   **Camp A Prediction:** **Homeostasis.** The insect is weighing input weights via local circuits. No global workspace means no "suffering," only error correction. It's a biological algorithm, not a feeling.
  *   **Camp B Prediction:** **Affective Consciousness.** The trade-off implies a unified model of "self-preservation vs. reward." This integration generates a low-grade affective state (discomfort). It counts as suffering, just less complex than a mammal's.
  *   **Verbal Check:** A defines suffering as "globally accessible distress." B defines it as "weighted priority conflict in a predictive model."

  **Crux 3: The Synthetic Edge Case**
  *The Question:* Should a synthetic system with perfect predictive coding but zero biology be included in the distribution?
  *The Case:** **Silicon PredictiveCoder.** A non-neural network architecture (e.g., pure probabilistic graphical model) running on silicon that perfectly mimics the predictive error minimization of a mouse brain, but lacks biological recurrence or thalamus-like structures.
  *   **Camp A Prediction:** **Excluded.** The architecture matters. Thalamocortical loops or their functional analogues (specific recurrent gating) are required. A silicon predictor is just a simulation of experience, not an instance. It's a map, not the territory.
  *   **Camp B Prediction:** **Included.** Substrate independence. If the causal structure of information integration is identical, the experience is real. Biology is just wetware; silicon is hardware. The info process is what counts.
  *   **Verbal Check:** This is the biggest risk. A might argue simulation != reality. B argues function = reality. We agree to classify this as a "distribution" question: does it count toward the total sum of consciousness in the universe?

  ### 4. NOTES ON VERBAL DISPUTES
  *Flagged during drafting.*

  *   **"Consciousness" Loading:** Camp A keeps slipping into defining consciousness as "access consciousness" (available for report/use). Camp B defines it as "phenomenal consciousness" (raw feel). We agreed for this dataset to prioritize **phenomenal**, but A argues you can't have phenomenal without access architecture. This is the main friction point.
  *   **"Fragment" Validity:** Camp A thinks "fragmented consciousness" is an oxymoron (like "sorted chaos"). Camp B thinks it's standard (like "dim light"). We will code dataset entries involving fragments as "Disputed Phenomena."

