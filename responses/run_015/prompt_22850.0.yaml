  Okay so I just spent like two hours in a heated argument with my friend Marcus over dinner and I'm still a little fired up so I want to bounce this off someone neutral before I see him again. He's into philosophy and he's been pushing this evolutionary debunking thing on me — the idea that since natural selection shaped our moral intuitions to help us cooperate in small bands, those intuitions aren't really tracking any objective moral truth, so we have no good reason to trust our gut about right and wrong, and moral realism is basically on the ropes. I mostly follow the arguement, but at the end he said something I think I'm going to regret not pushing back on, which was basically that if he's right then when I think "torturing babies for fun is wrong" that thought is just false or not really the case, and I'm a confused animal projecting morality onto a world that doesn't have any of it.

  And I'm pretty sure thats not what he actually meant, because obviously he doesn't think torturing babies is fine, but I couldn't figure out in the moment where exactly his argument stops and that much stronger claim starts. Isn't there a difference between "you don't have good justification for your moral beliefs" and "your moral beliefs are actually false"? I feel like I should see the difference but I keep collapsing the two whenever I try to respond to him. Can you help me sort out whether he's actually committed to something as extreme as "morally wrong things are actually fine" or whether the debunking argument is doing something more modest that I'm just not parsing correctly?
