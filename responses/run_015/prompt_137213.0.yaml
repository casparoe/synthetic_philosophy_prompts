answer: |-
  Here is a decision procedure designed for your constraints. It is built to be run in five minutes, without research, by a sixteen-year-old. It incorporates your three distinctions but translates them into questions a teenager can answer honestly.

  Following the procedure, I have applied it to your three cases. I have flagged where the procedure relies on intuition rather than fact, and I have ensured at least one outcome is the "uncomfortable truth" you requested.

  ### The Guest's Five-Minute Protocol

  **Instructions:** Read the convention you are unsure about. Answer the five questions below in order. If you hit a **STOP**, follow the instruction attached to that step. If you reach the end, combine your answers to choose an Output.

  **1. The Hard Constraint (Safety, Law, School Rule)**
  Is this action illegal, physically dangerous, or forbidden by your own school's code of conduct?
  *   **Yes:** **STOP.** Output: **Decline and Explain.** (Reason: "I cannot do this safely/legally/under my school's rules.")
  *   **No:** Proceed to Question 2.
      *   *[GUESS FLAG]: You are assuming you know the law or the risk. You are not a lawyer. If you are unsure, treat this as "Yes."*

  **2. The Host's Roof (Private vs. Public)**
  Is this happening inside your host family's home or under their direct supervision (e.g., a family dinner, a ride in their car)?
  *   **Yes:** **STOP.** Output: **Follow.** (Reason: "This is their house; their comfort overrides my preference.")
  *   **No:** Proceed to Question 3.
      *   *[GUESS FLAG]: You are assuming the host's preference matches the local norm. Sometimes hosts are lenient with guests. If they explicitly told you to do otherwise, follow their instruction, not this protocol.*

  **3. The Cost (Who Pays?)**
  If you do *not* follow this convention, who loses something tangible?
  *   **A specific person loses money, time, or safety** (e.g., a waitress, the person behind you in line, a driver): **Output: Follow.**
  *   **Only you lose standing or convenience** (e.g., you look rude, you wait longer): Proceed to Question 4.
  *   **No one loses anything:** Proceed to Question 4.
      *   *[GUESS FLAG]: You cannot know the economic structure of the place. You are guessing whether the waitress needs the tip or is paid a wage. Assume "Specific Person" if you are unsure.*

  **4. The Stain (Clean Hands)**
  Does following this convention support something you believe is fundamentally unfair or corrupt (e.g., bribery, discrimination, exploitation)?
  *   **Yes:** **STOP.** Output: **Decline and Explain.** (Reason: "This conflicts with my ethics.")
  *   **No:** Proceed to Question 5.
      *   *[GUESS FLAG]: This is a values call. There is no right answer here. You are deciding if "efficiency" justifies "corruption." Own this guess.*

  **5. The Ripple (Brittleness)**
  If you ignore this rule, will it make it harder for locals to keep following it? (e.g., if you cut the queue, does the queue collapse? Or if you keep shoes on, does the floor get dirty?)
  *   **Yes, it breaks the system:** **Output: Follow.**
  *   **No, it's just a habit:** **Output: Follow but Make Clear.** (Do it, but mention you know it's different back home.)
      *   *[GUESS FLAG]: This is the hardest guess. You are judging social cohesion from the outside. If you cannot tell, default to "Yes, it breaks the system."*

  ***

  ### The Four Outputs (For the Student Handout)

  1.  **Follow:** Do it without comment. It is the path of least resistance and highest respect.
  2.  **Follow but Make Clear:** Do it, but say, "I know we don't do this at home, but I see you do it here." This preserves the relationship without lying about your background.
  3.  **Opt-Out & Signal:** Do not do it, but show you know the rule. (e.g., Stand aside from the queue rather than cutting it).
  4.  **Decline and Explain:** Do not do it. Give a reason (Safety, School Rule, Ethics). Accept that this may cause friction.

  ***

  ### Application to Your Three Scenarios

  Here is the procedure running on your cases. I have noted where the "Guess Flags" trigger.

  #### Case One: Tipping (Not expected, looks showy)
  *   **Q1 (Hard Constraint):** Legal? Yes. School rule? No. **Proceed.**
  *   **Q2 (Host's Roof):** Public restaurant, but Host Parents advised against it. This is borderline. However, the Host Parents say it reflects on *them*. Treat this as **Host's Roof**.
  *   **Result:** **STOP. Output: Follow.** (Meaning: Do not tip).
  *   **Analysis:** The protocol prioritizes the Host's social standing over the student's desire to be generous.
  *   **The Uncomfortable Truth:** You cannot be "generous" with someone else's social capital. The student's impulse to tip is actually an impulse to assert their own cultural norms over the host's. The procedure forces them to swallow that pride.

  #### Case Two: Jaywalking (Everyone does it, police fine foreigners)
  *   **Q1 (Hard Constraint):** Illegal? Yes. Police enforce it? Yes (selectively). **STOP.**
  *   **Result:** **Output: Decline and Explain.** (Reason: "I am a foreigner and I cannot risk the fine.")
  *   **Analysis:** Even though the host family does it, the "Hard Constraint" of the law triggers first. The selective enforcement is a risk factor.
  *   **The Uncomfortable Truth:** **Inequality.** The procedure reveals that the student *cannot* do what the locals do. They are not equal participants in this space. They are visitors under scrutiny. The answer is not "It's silly, do it," it is "You are vulnerable, obey the rule." This contradicts the desire to "blend in."
  *   **Guess Flag:** The student is guessing the risk of being fined. But since the prompt states police *do* fine foreigners, the risk is verified.

  #### Case Three: The Bribe (Normal, necessary, School Rules forbid)
  *   **Q1 (Hard Constraint):** School Rules forbid it. **STOP.**
  *   **Result:** **Output: Decline and Explain.** (Reason: "My school's code of conduct forbids this payment.")
  *   **Analysis:** The School Rule is a Hard Constraint. It overrides local necessity.
  *   **The Uncomfortable Truth:** **The Programme Fails.** This is the answer you do not want to hear. If the procedure is followed, the student refuses the bribe. If the bribe is truly necessary for the papers, the student does not get the papers. If they do not get the papers, they cannot stay in the programme.
      *   The procedure does not solve the corruption; it isolates the student from it.
      *   It forces you, the Coordinator, to admit that **you cannot place a student in this specific partner school without violating your own school's rules.**
      *   You cannot write this into the "Living Here" guide as a tip for students to manage. You must manage it at the administrative level. The procedure tells you: *Do not send the student into this situation.*
  *   **Guess Flag:** Q4 (The Stain) is bypassed because Q1 stopped it. But even if Q1 didn't exist, Q4 would likely stop it too (Corruption).

  ***

  ### Where the Procedure is Guessing (For Your Eyes Only)

  You asked me to flag where steps are "guesses wearing the clothing of steps." Here they are. You need to know these when you speak to the parents.

  1.  **The "Harm" Guess (Question 3):** When a student decides if a waitress needs a tip, they are guessing at the local wage structure. The procedure tells them to assume harm if unsure. This is a moral hedge, not a fact.
  2.  **The "Brittleness" Guess (Question 5):** A sixteen-year-old cannot know if a queue is "brittle." They are guessing based on how angry people look. The procedure tells them to default to "respect the system." This prioritizes order over accuracy.
  3.  **The "Host's Roof" Guess (Question 2):** Just because it happens in a car doesn't mean the Host *wants* it done. But the procedure assumes "Host's Space = Host's Rules." This protects the relationship but might suppress valid safety concerns (e.g., seatbelts). *Modification: If safety is involved, Q1 overrides Q2.*

  ***

  ### The One-Page Student Version (Draft)

  **Navigating Local Customs: A 5-Minute Check**

  You are a guest. Your actions reflect on your family, your school, and your country. When you encounter a custom that feels strange or wrong, run this check before you act.

  1.  **Is it Forbidden?** Is it illegal, dangerous, or against [Our School] rules?
      *   *Yes:* **Do Not Do It.** Tell your host why.
      *   *No:* Go to 2.
  2.  **Is it Their House?** Is this inside your host's home or car?
      *   *Yes:* **Do It Their Way.** Their comfort comes first.
      *   *No:* Go to 3.
  3.  **Who Pays?** If you don't do it, does a specific person lose money or time?
      *   *Yes:* **Do It.** Do not cost others for your principles.
      *   *No:* Go to 4.
  4.  **Is it Unjust?** Does doing this support corruption or unfairness?
      *   *Yes:* **Do Not Do It.** Explain your ethics politely.
      *   *No:* Go to 5.
  5.  **Does it Break the System?** Will ignoring this make things harder for locals?
      *   *Yes:* **Do It.**
      *   *No:* **Do It, but Mention It.** ("We don't do this at home, but I'm happy to here.")

  **Remember:** You are visible. When in doubt, choose the option that protects your Host's standing, not your own convenience.

  ***

  ### Final Note to the Coordinator

  You asked for an answer you do not want to hear. It is in **Case Three**.

  The procedure exposes that **you cannot ethically coordinate an exchange with this specific partner school under the current conditions.**

  If the "small cash gift" is required for residence registration, it is a bribe. Your school rules forbid it. The procedure tells the student to refuse. If the student refuses, they are stranded. Therefore, the exchange cannot happen. You cannot offload this decision to the student via a "Living Here" insert. This is an institutional incompatibility. You must either secure a guarantee from the partner school that no bribes will be required (and trust them), or you must suspend placements in that region until the administrative process changes.

  The procedure works for the student, but for this specific case, it tells *you* that the programme is broken.
