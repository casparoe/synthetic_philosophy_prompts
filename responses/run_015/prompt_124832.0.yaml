answer: |-
  # Handout: Disambiguating "Unrealistic Assumptions are a Feature, Not a Bug"

  **Context:** This slogan is often deployed to defend models (particularly in economics) against objections that their foundational premises (e.g., perfect rationality) do not match empirical reality. However, the slogan conflates several distinct methodological claims. Below is a breakdown of the five distinct theses hiding behind the phrase.

  ---

  ### 1. The Trivial Simplification Thesis
  *   **The Claim:** Reality is infinitely complex; all models must omit details to be tractable. Unrealistic assumptions are merely necessary shortcuts to make the math solvable.
  *   **Status:** **Defensible.** (Almost tautologically true; no model can include every variable).
  *   **Does it get the speaker off the hook?** **No.** Admitting an assumption is a "simplification" concedes it is false. It only justifies the falsehood if the omitted detail is *irrelevant* to the outcome. If the objection is that "rationality" is the *driver* of the behavior being modeled, simplifying it away undermines the model entirely.
  *   **Domain Sensitivity:** Applies equally to **Economics** and **Climate**. In climate modeling, ignoring minor atmospheric variables is a simplification. In economics, ignoring cognitive bias is often treated as a simplification, but critics argue it removes the core mechanism.

  ### 2. The Friedman-Style "F-Twist"
  *   **The Claim:** (After Milton Friedman) The significance of a theory is positively correlated with the unrealisticness of its assumptions. A good theory predicts well *precisely because* it ignores irrelevant details. Predictive success is the only valid test; descriptive accuracy is secondary.
  *   **Status:** **Controversial / Limited.** Defensible only if the *sole* goal of science is prediction. It fails if the goal is understanding mechanisms or causal structures.
  *   **Does it get the speaker off the hook?** **Weakly.** It deflects the objection by changing the goalposts from "is this true?" to "does this predict?" If the rational-agent model fails to predict actual market behavior (e.g., during crashes), this defense collapses.
  *   **Domain Sensitivity:** **High.** Common in **Economics** (positive economics). Rare in **Climate Science**, where predictive success relies heavily on the descriptive accuracy of physical laws (e.g., you can't predict warming using false physics, even if the output looks right temporarily).

  ### 3. The Hard Instrumentalist Reading
  *   **The Claim:** Models are not truth-claims; they are calculation devices or tools for organization. Asking if the assumptions are "true" is a category error, like asking if a slide rule is "true."
  *   **Status:** **Defensible as a stance, but costly.** It saves the model from falsification but strips it of ontological weight.
  *   **Does it get the speaker off the hook?** **Yes, but at a price.** It dismisses the objection by denying the model was ever trying to describe real people. However, it prevents the model from making claims about human nature or psychology.
  *   **Domain Sensitivity:** **High.** Tolerable in **Economics** (if treated as pure logic). Problematic in **Climate Science**, where policy requires believing the causal links (CO2 → Heat) are real, not just useful fictions.

  ### 4. The Explanatory Benefit Thesis (Galilean Idealization)
  *   **The Claim:** Being descriptively wrong is *actively beneficial* for explanation. False assumptions isolate specific causal forces by filtering out "noise." We assume rationality to see what pure incentive structures do, distinct from psychological quirks.
  *   **Status:** **Defensible.** This is the strongest philosophical defense (akin to frictionless planes in physics).
  *   **Does it get the speaker off the hook?** **Conditionally.** It works only if the "noise" (irrationality) is actually separable from the "signal" (incentives). If human irrationality is systematic and constitutive of the market (not just noise), this defense fails.
  *   **Domain Sensitivity:** **Moderate.** Works well in **Physics/Climate** (isolating variables). Risky in **Economics**, where the "variables" (agents) change behavior based on the model itself (reflexivity).

  ### 5. The "As-If" Fiction Thesis
  *   **The Claim:** False premises function as organizing fictions (Vaihinger). We act *as if* agents are rational to coordinate behavior or structure inquiry, without believing they are. The model is a normative benchmark, not a descriptive picture.
  *   **Status:** **Defensible for heuristics.**
  *   **Does it get the speaker off the hook?** **It Relocates the Problem.** It solves the truth problem but creates a utility problem. The question shifts from "Is this assumption true?" to "Is this fiction useful for the specific task at hand?"
      *   *The Relocation:* If the model is used for policy (e.g., setting interest rates), the fiction has real-world consequences. If the fiction is wrong, the policy fails. So, the "truth" of the assumption matters instrumentally, even if not ontologically.
  *   **Domain Sensitivity:** **High.** Very common in **Economics** (normative models). Very rare in **Climate Science** (we do not model the atmosphere *as if* it obeys Newtonian physics; we assume it *does*).

  ---

  ### Summary Table for Seminar Discussion

  | Thesis | Core Claim | Defensible? | Deflects "People aren't rational" objection? | Econ vs. Climate |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Simplification** | We must omit details to calculate. | Yes | No (admits falsity, doesn't justify it) | Neutral |
  | **2. F-Twist** | Unrealistic = Significant/Predictive. | Controversial | Only if prediction is the only goal | Econ > Climate |
  | **3. Instrumentalism** | Truth of assumptions is irrelevant. | Yes (costly) | Yes (by denying descriptive intent) | Econ > Climate |
  | **4. Explanatory** | Falsehood isolates causal forces. | Yes | Only if irrationality is "noise" | Climate > Econ |
  | **5. As-If Fiction** | Premises are organizing fictions. | Yes | Relocates problem to utility | Econ > Climate |

  ### Discussion Note: The "Relocation" Problem
  Regarding the **"As-If Fiction"** reading: This does not solve the problem of false assumptions; it **relocates** it from metaphysics to pragmatics.
  *   **If the goal is pedagogy:** The relocation is successful. The fiction helps students learn.
  *   **If the goal is policy:** The relocation fails. If you regulate a market based on a fiction that humans are rational maximizers, and humans panic irrationally, the regulation breaks.
  *   **Conclusion:** In **Climate Science**, assumptions are rarely treated as fictions because the system is mind-independent. In **Economics**, the "fiction" interacts with the agents (who read the models), making the falsity of assumptions a potential self-fulfilling or self-defeating prophecy.
