  # HANDOUT: DECISION TREE — WHAT MAKES PAIN BAD?

  **Instructions:** Start at **Q1**. Answer based on your intuition about the cases described. Follow the arrows to find your position. We are assuming all patients are telling the truth and not confused.

  **Q1. The Standard Case:** In the standard asymbolia case (burning sensation, no "ouch"), is the *sensory burning* exactly the same as a normal person's, just missing the "badness"?
  *   **NO** (The sensation itself is different/altered) → Go to **Q2**.
  *   **YES** (The sensation is identical; the "badness" is missing) → Go to **Q3**.

  **Q2. Sensory Quality:** If the sensation is different, is the "badness" a raw *quality* of the feeling (like redness or pitch)?
  *   **YES** → **LEAF 1: Qualitative View**
  *   **NO** → **LEAF 2: Empty Slot** *(Incoherent: If badness isn't a quality and the sensation differs, what differs?)*

  **Q3. The Informed Case:** Consider the patient who feels *no unpleasantness* but says, "I know this is damaging my tissue, and I very much mind that." Is the *pain* bad, or only the *injury*?
  *   **ONLY THE INJURY** (Pain is bad *because* it represents damage as bad) → **LEAF 3: Evaluativism**
  *   **THE PAIN ITSELF** (Pain's badness is distinct from damage assessment) → Go to **Q4**.

  **Q4. The Mirror Case:** Consider the patient who calls the sensation "agonizing" and wants it to stop, but shows *no withdrawal* and won't reach for the off switch. Is the pain still bad?
  *   **NO** (Badness requires an urge to act) → Go to **Q5**.
  *   **YES** (Badness is in the report/experience, action is secondary) → Go to **Q6**.

  **Q5. The Twins:** Consider the twins (same report, different button-pressing). If badness requires an urge to act, does the twin who *presses the button* have worse pain?
  *   **YES** (Badness = Disposition to act) → **LEAF 4: Motivational/Dispositional View**
  *   **NO** (Badness = Internal Urge, Action varies) → Go to **Q6**.

  **Q6. Internal State:** If badness is an internal state (not behavior), is it a *desire* ("I want this to stop")?
  *   **NO** (It is some other attitude) → **LEAF 5: Unnamed** *(Badness is a non-desire pro-attitude toward the sensation.)*
  *   **YES** → Go to **Q7**.

  **Q7. Source of Command:** Is that desire a *preference you hold* about the sensation, or a *command the pain issues* to you?
  *   **PREFERENCE YOU HOLD** → **LEAF 6: Desire-Based View**
  *   **COMMAND THE PAIN ISSUES** → **LEAF 7: Imperativism**

  **Q8. (Alternative Path from Q4):** If you answered **YES** to Q4 (Badness is in report/experience), do you believe the "badness" is *intrinsic* to the experience, or does it depend on a *separate reaction*?
  *   **INTRINSIC** → **LEAF 8: Phenomenological View** *(Badness is simply how the experience feels, independent of desire or action.)*
  *   **SEPARATE REACTION** → **LEAF 6: Desire-Based View** *(Returns to Desire branch as the primary reaction candidate.)*

  ***

  # INSTRUCTOR'S KEY & ANALYSIS (NOT FOR STUDENTS)

  ### 1. Indistinguishable Leaves (Where the Tree Fails)
  *   **Qualitative View (Leaf 1) vs. Evaluativism (Leaf 3):** Both can explain standard asymbolia by claiming the "missing" element is either a sensory quality or an evaluative content. Without a case where sensation is present but *representation of damage* is explicitly intact (yet pain is not bad), these two shrug off asymbolia identically. **To pry them apart:** You need a case where a patient feels a "burning" they explicitly *know* is non-damaging (e.g., a harmless heat lamp) but still rates as "bad." Evaluativists must say it isn't pain/bad; Qualitative theorists can say it is.
  *   **Desire-Based (Leaf 6) vs. Imperativism (Leaf 7):** Both explain the Twins (Leaf 4/5 split) by locating badness in an internal state that allows for behavioral variance. **To pry them apart:** You need a case of *involuntary satisfaction*. If a patient says "I desire this to stop" but also "I am glad it is happening" (masochism), Imperativists can say the command is present but overridden; Desire theorists struggle if badness *is* the desire.

  ### 2. Uncertain Branch Decisions (Red Flag Nodes)
  *   **Q1 (Sensation Identity):** *Confidence: Low.* This relies on introspective reports of "sameness." If asymbolics turn out to describe the sensation differently (e.g., "vibrating" vs. "burning") upon closer questioning, the whole "Reaction" branch (Q3–Q7) collapses into the "Sensory" branch. **Redraw if:** Neurophenomenology reveals asymbolic sensations are qualitatively distinct, not just "unbothered."
  *   **Q7 (Desire vs. Command):** *Confidence: Low.* Students often cannot introspectively distinguish between "I want X to stop" and "X says 'Stop!'" **Redraw if:** The seminar finds that "command" is just a metaphor for "strong desire," rendering Imperativism a subset of Desire-Based views.
  *   **Q4 (Mirror Case Credibility):** *Confidence: Medium.* This node assumes we accept the report ("agonizing") over the behavior (sitting still). If we prioritize behavior, we jump to Leaf 4 immediately. **Redraw if:** The class concludes that "agonizing but immobile" is conceptually impossible (i.e., pain *essentially* motivates).

  ### 3. Empty/Unused Slots
  *   **Q2 "NO" (Empty Slot):** Logically possible (Sensation differs, but not due to quality), but no major theory occupies this. It implies a relational difference in sensation without a qualitative one, which is hard to articulate.
  *   **Leaf 5 (Unnamed):** This slot catches "Attitude Views" that aren't strictly desires (e.g., caring, attention-based views). It is currently under-theorized compared to Desire/Imperative views.

  ### 4. Note on the "Choke Point"
  You mentioned the class choked on "Is the badness in the sensation or the attitude?" I have split this across **Q1** (Sensation) and **Q6** (Attitude/Desire). By forcing them to adjudicate the *Informed* and *Mirror* cases first (Q3–Q5), they must commit to how badness behaves before they commit to where it lives. This prevents the debate from stalling on definitions.
