  Concession
  You are right that removing the runner-up payment rule eliminates that specific mechanical trap.

  The reply
  But your standoff model still assumes the prize value is fixed and known, whereas real escalations persist because actors believe the prize value has changed or victory is nearer than previously thought. In your game, dissipation is rational rent-seeking, not a psychological failure of judgment; calling it escalation of commitment conflates competitive spending with irrational persistence. Real actors justify continuing by claiming new information lowers the remaining cost to completion, a dynamic your static cost c cannot capture. If the Concorde developers believed supersonic travel demand would triple next year, continuing is rational, not a trap. Your model proves competition is costly, not that decision-makers ignore sunk costs when faced with uncertainty. The gap you identify explains bidding wars, not why managers ignore negative feedback loops in failing projects.

  Your move
  If the value of the prize is uncertain and updated each round, does your equilibrium still dissipate the full expected value, or does learning stop the waste?
