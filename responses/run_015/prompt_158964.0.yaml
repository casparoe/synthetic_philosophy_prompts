answer: |-
  You have independently reconstructed a very famous problem in contemporary ethics and philosophy of language. Your argument is rigorous, and your intuition that the conclusion (7) is absurd is shared by most philosophers who work on this topic. The "laundering" move you describe is often called the "literal truth defense," and your *reductio* of it is spot-on.

  Since you wish to keep (1) and (2), there is one clear place where your argument goes off the rails.

  ### The Step to Drop: Premise (3)

  **"Meaning something is an intentional act, so what you mean is up to you: if you intend your words to express proposition X, then X is what you say."**

  This is the step you should reject.

  #### Why it looked safe
  Premise (3) relies on a very intuitive, private view of the mind. It feels as though meaning is a mental event that happens *inside* me before I speak. If I hold a specific thought in my head while uttering words, it feels natural to say, "Well, *that* thought is what I meant." It treats language like a container where I pour my private intentions, and if I pour in a true intention, the container is "true," regardless of what the outside world sees.

  #### Why it is false
  Premise (3) ignores the public, normative nature of communication. In philosophy of language (following the work of H.P. Grice), **speaker meaning is not just a private intention; it is a reflexive intention.**

  To genuinely "mean" something in a communicative act, you must intend two things:
  1.  To produce a belief in your listener.
  2.  **To have that belief produced by the listener recognizing your intention.**

  Communication is a cooperative game. You cannot unilaterally decide the rules of the game while playing it. If you utter a sentence that conventionally implies $X$, but you privately intend $Y$, and you *do not* intend for the listener to recognize $Y$ (because if they recognized $Y$, your deception would fail), then you have not communicatively "said" $Y$. You have merely thought $Y$ while uttering sounds that imply $X$.

  In your "laundering" scenario (4), the speaker privately intends a true proposition but knows the hearer will not arrive at it. Because the speaker does not intend the hearer to recognize that true proposition, **it does not count as what was said.** It is a mental footnote, not a communicative act. Therefore, the speaker *has* lied (or at least, has not successfully "said" the true thing they are hiding behind).

  #### How this fixes the problem
  If you reject (3), the "escape hatch" in (4) closes. You cannot launder a lie by privately intending a true meaning that you actively conceal from the listener. To count as "what you say," the meaning must be mutually accessible. This preserves the moral distinction: the liar violates the norm of assertion (stating what they believe false), while the misleading speaker relies on the listener's inferences. The artful deceiver who uses "laundering" is not morally safer; they are simply attempting to game the system, but philosophically, they are still asserting the false implication because that is the only meaning they made available to the listener.

  #### Addressing your observation
  You noted: *"Laundering feels different when the true reading is one the hearer could in principle work out... from when it is one only the speaker could reach."*

  This observation confirms why (3) is wrong.
  *   **Shared code/Joke:** Here, the true meaning *is* mutually recognizable. The speaker intends the hearer to recognize the intention. This is genuine communication (and not deceptive).
  *   **Private reading:** Here, the speaker *prevents* recognition. This is not "meaning" in the communicative sense; it is manipulation.

  By rejecting (3), you validate this intuition: communication requires a bridge between minds, not just a private state in one.

  ---

  ### The Costs of Other Options

  If you decide you cannot live with rejecting (3), here are the costs of the other available moves.

  #### Option A: Reject Premise (5)
  *"If there is a moral difference... it has to be a difference in what the speaker did with their words."*

  You could argue that the moral difference isn't about the linguistic act (saying vs. implying) but about the **warrant of truthfulness**. When you assert something (lie), you explicitly invite the listener to trust your word. When you mislead, you invite them to trust their own inference.
  *   **The Cost:** This makes the moral distinction very fragile. A skilled misleading speaker can create an environment where trust is just as heavily implied as in a direct assertion. It also struggles to explain why we feel worse about lying under oath than misleading under oath, even if the "warrant" is legally the same. It saves the distinction but makes it harder to define where the boundary lies.

  #### Option B: Reject the Distinction Entirely (The "Deception Only" View)
  You could conclude that lying and misleading are morally equivalent. The only thing that matters is the intent to deceive and the success of the deception.
  *   **The Cost:** This is the most robust way to avoid your "laundering" conclusion, but it conflicts with deep moral intuitions.
      1.  **Social Trust:** Societies rely on the norm of assertion. If I ask "Did you steal the cookie?" and you say "I ate a biscuit" (knowing I equate biscuits with cookies), you have misled me. But if you say "No," you have lied. Most people feel the second is a deeper betrayal of the relationship.
      2.  **Institutions:** Legal systems, science, and journalism treat false assertion differently from misleading implication. Perjury requires a false statement, not just a misleading one. If there is no moral difference, these institutional norms look arbitrary.
      3.  **Self-Deception:** It allows the "artful deceiver" to claim moral purity ("I never lied!"), which undermines accountability.

  #### Option C: Keep (3) and Accept (7)
  You could bite the bullet and argue that the artful deceiver *is* less blameworthy because they respected the literal truth.
  *   **The Cost:** This leads to moral absurdity. It implies that a lawyer who constructs a technically true but wildly misleading statement is morally superior to a clumsy person who tells a flat lie to protect a friend. It prioritizes linguistic technicalities over the spirit of honesty. It makes morality a matter of verbal skill rather than integrity.

  ### Summary Recommendation

  Stick with your intuition that (7) is false. To preserve (1) and (2), you must reject **(3)**.

  Meaning is not a private act of will; it is a public act of coordination. You cannot "say" something to someone while simultaneously ensuring they cannot understand what you say. By recognizing that communication requires **mutual recognizability**, you block the laundering loophole without abandoning the valuable distinction between lying and misleading. The liar breaks the bond of trust explicitly; the misleading speaker strains it. The artful deceiver who launders their lies is not a logician-hero; they are someone trying to break the bond of trust while hiding behind a technicality that doesn't actually hold up philosophically.
