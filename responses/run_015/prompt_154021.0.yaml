      *   *Blocked Generic Entrant:* Potential competitor. *Capability:* Litigate, wait for patent/exclusivity expiry, navigate FDA. (Note: In Daraprim's case, it was off-patent, but Turing used REMS/distribution blocks to prevent sampling for bioequivalence).
      *   *FDA:* Regulator. *Capability:* Approve generics, regulate safety. *Limit:* No price authority. REMS program inadvertently used as a barrier.
      *   *Turing (The Firm):* Monopolist. *Capability:* Restrict distribution (closed pharmacy), set price, control supply.

  3.  **Part 2: Mapping Objections to the Episode:**

      *   *Third-Party Harm:* Does the transaction hurt outsiders? Yes. Insurers pass costs to premium payers. Hospitals absorb costs, reducing resources elsewhere. Patients face bankruptcy/health risk.
      *   *Exploitation/Unfairness:* Taking advantage of vulnerability. Patients *need* this to live. No alternative. Price reflects desperation, not value. This is the strongest fit.
      *   *Corruption of Non-Market Norm:* Medicine as healing vs. commerce. Clinician trust eroded. *Assessment:* Present, but secondary. People accept pharma profits generally, just not *this* kind.
      *   *Wrong-Attitude-Toward-the-Good:* Valuing life purely monetarily. *Assessment:* Weak. All drugs are priced. The issue isn't pricing life, it's the *method* of pricing.

      *   *Conclusion on Objections:* Exploitation (taking advantage of inelastic demand/captive audience) is doing the heavy lifting. Third-party harm (systemic costs) is the secondary amplifier. Repugnance/Commodification is mostly rhetorical dressing.

  4.  **Part 3: The "Calibration Objection":**

      *   *Definition:* Price set by "what the traffic will bear" (extractive capacity) vs. Cost-plus or Value-based.
      *   *Is it distinct?*
          *   It looks like Exploitation. Exploitation *is* charging based on vulnerability rather than fair value.
          *   It looks like Market Failure. In a functioning market, "what the traffic will bear" is constrained by competition. Here, it's unconstrained.
          *   *Verdict:* It is not a *moral* category distinct from exploitation; it is the *mechanism* of the exploitation. It collapses into Exploitation + Market Malformation. It highlights that the price signal is lying (it signals scarcity/value, but actually signals monopoly power + desperation).

  5.  **Part 4: Repugnance vs. Malformed Market:**

      *   *Repugnance Framing:* "It's wrong to sell life-saving drugs this way." Implies intrinsic wrongness.
      *   *Malformed Market Framing:* "The rules allowed a monopoly to abuse captive buyers." Implies structural fix.
      *   *Analysis:* The Daraprim case relies heavily on specific regulatory loopholes (FDA REMS used to block generic sampling, orphan drug exclusivity nuances, lack of price negotiation). If generics could enter easily, the price wouldn't stick.
      *   *Verdict:* The "Repugnance" frame mislocates the issue. It treats the symptom (outrage) as the diagnosis. The problem is structural (IP law, FDA process, insurance fragmentation). Repugnance is the emotional signal that a norm has been violated, but the norm violated is "fair competition," not "sacredness of medicine."
      *   *Where Theory is Silent:* Standard economic theory says "monopoly pricing is efficient allocation (rationing) but bad for equity." It doesn't condemn it morally unless there's fraud/coercion. Ethical theory condemns exploitation but struggles with *legal* exploitation. The silence is on *how to legally distinguish* aggressive profit-seeking from predatory exploitation in IP-bound markets.

