          2.  Objection Audit (What's actually firing?).
          3.  The Calibration Objection (Distinct or collapsed?).
          4.  Repugnance vs. Market Structure (The core theoretical question).
          5.  Theoretical Silence.

      *   *Refining the "Calibration" point:* Make sure to distinguish between "Value-Based Pricing" (outcomes) and "Extractive Pricing" (willingness to pay under duress). The latter is rent-seeking.
      *   *Refining the "Repugnance" point:* Use the Roth "repugnant transactions" framework but show where it fails. Roth says some things shouldn't be traded. Here, the trade is fine, the *terms* are the issue. So it's not repugnance of the *market*, but repugnance of the *market power*.

