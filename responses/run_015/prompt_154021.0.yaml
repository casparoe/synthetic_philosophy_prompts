  *(Self-Correction during drafting)*: I need to be careful not to say "no generic was possible." A generic *was* possible legally (off-patent), but practically blocked by Turing's control of the supply chain and REMS protocols preventing sampling. This is crucial for the "Malformed Market" argument.

  *(Refining the Calibration Objection)*: Is it distinct? If I sell water in a desert for $1000, is it calibration or exploitation? It's exploitation *via* calibration. I will argue it collapses into exploitation but adds a specific critique of *price signaling*.

  *(Refining Repugnance)*: Alvin Roth's work is the touchstone here. Repugnance usually limits *what* can be sold (kidneys). Daraprim wasn't about *what* was sold, but *how*. This suggests the "Repugnance" label is a category error.

