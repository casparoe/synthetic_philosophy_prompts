answer: |-
  Here is the principle, the necessary sacrifice, and the prediction.

  ### The Principle: The Principle of Soteriological Ontology

  **Statement:**
  > The *catuṣkoṭi* (tetralemma) applies to any proposition where the subject term is treated as a candidate for **intrinsic nature (*svabhāva*)** or **ultimate ontological status**. It is suspended for propositions that function solely as **pragmatic conventions** or **formal tools**, provided they are not themselves reified into objects of attachment.

  **Motivation by Clause:**
  1.  **Targeting *Svabhāva*:** This covers your **Self**, **Causation**, and **Emptiness** verdicts. In each case, the tetralemma is deployed to dismantle the intuition that the subject (self, cause, emptiness) possesses an independent, findable essence. Rejecting all four horns clears the conceptual space for dependent origination (*pratītyasamutpāda*) without positing a new essence.
  2.  **Reflexivity (The "Empty of Emptiness" Clause):** This covers your **Two Truths** verdict. If the distinction between conventional and ultimate is treated as an ultimate fact (a *svabhāva* of the doctrine itself), it becomes a new object of attachment. The tetralemma must apply to the distinction to ensure the Madhyamaka system does not solidify into a dogma.
  3.  **Suspension for Tools/Pragmatics:** This covers your **LEM** verdict. Logic is the *instrument* of the analysis, not the *object*. To apply the tetralemma to the law of excluded middle while using it to structure the tetralemma is performatively contradictory. LEM is a rule of the game, not a claim about the nature of reality, unless one claims LEM itself exists inherently (which you rightly avoid).

  ### The Sacrifice: The Table Verdict

  You must drop (or significantly qualify) your verdict on **The Table**.

  **Your Verdict:** "The tetralemma does not apply... At the conventional level the table exists, period."
  **Required Correction:** **The tetralemma *does* apply.**

  **Defense:**
  Your hesitation here is pedagogical (fear of nihilism), but philosophically it creates a hole in the Madhyamaka net. If the tetralemma applies to the "Self" (a person) but not the "Table" (an object), you risk implying that persons are empty of intrinsic nature while physical objects are *conventionally solid* in a way that persons are not. This reintroduces a subtle *svabhāva* into the conventional world.

  Nāgārjuna explicitly applies this analysis to physical entities (e.g., *Mūlamadhyamakakārikā* Chapter 10 on Fire and Fuel, Chapter 5 on Elements). The question "Does the table exist, not exist, both, or neither?" is an ontological query. If you answer "It exists, period" without running the tetralemma, you are affirming existence (*bhāva*) as a default position. In Madhyamaka, "conventional existence" is *only* coherent *because* the table is empty of intrinsic nature.

  **How to save the pedagogy:**
  You distinguish the *outcome*, not the *application*.
  *   **Bogus Application:** Running the tetralemma on the table to conclude "There is no table" (Nihilism).
  *   **Legitimate Application:** Running the tetralemma on the table to conclude "The table lacks intrinsic nature, therefore it can function conventionally" (Emptiness).

  Your principle requires that *any* claim to existence be tested for *svabhāva*. The table is not exempt. The "Category Error" you fear only occurs if the student thinks the tetralemma denies conventional functionality. But that is a mistake in interpreting the *result*, not a reason to suspend the *tool*. If you exempt the table, you teach students that convention is a safe haven from emptiness analysis. It is not.

  ### The Prediction: "The Buddha's Teachings are True"

  **Verdict:** **The tetralemma applies.**

  **Reasoning:**
  This follows directly from your **Emptiness** and **Two Truths** verdicts. To claim the Buddha's teachings are "True" (with a capital T) is often to reify the Dharma into an intrinsic nature. This is the "Dharma-attachment" (*dharma-grāha*) that the *Prajñāpāramitā* literature and Madhyamaka specifically target.

  If you suspend the tetralemma here, you grant the teachings a *svabhāva* that you denied to the Self and the Table. You turn the raft into a shore.

  **The Four Horns:**
  1.  **True:** Reifies the Dharma (Dogmatism).
  2.  **Not True:** Undermines soteriological efficacy (Nihilism).
  3.  **Both:** Contradictory.
  4.  **Neither:** Obscurantism.

  **The Upshot:**
  Rejecting all four does not mean the teachings are useless. It means the teachings are **empty of intrinsic truth**. They are true *conventionally* (as medicine for suffering) but not *ultimately* (as a description of reality that can be grasped). This aligns with the *Diamond Sūtra* ("The Dharma is like a raft... even the Dharma must be discarded, how much more so the non-Dharma").

  ### Summary of the Coherence Check

  You worried that applying the tetralemma to the **Two Truths** distinction undermines your reason for exempting the **Table**. You were right to worry. By forcing the **Table** back into the scope of the tetralemma, that tension dissolves.

  *   **Consistency:** The Table, the Self, and the Two Truths are all empty. None are exempt from analysis.
  *   **Distinction:** LEM is exempt because it is a formal condition of the analysis, not an ontological claim.
  *   **Result:** You avoid nihilism not by protecting the table from the tetralemma, but by teaching that the tetralemma's rejection of the four horns *is* what allows the table to exist conventionally.

  **Final Instruction for your Problem Set:**
  Do not ask students *if* the tetralemma applies to the table. Ask them *what the rejection of the four horns implies for the table's conventional status*. That tests whether they understand that emptiness *permits* function, rather than testing whether they know to hide the table from the analysis.
