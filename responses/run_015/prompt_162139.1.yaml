answer: |-
  Bottom line: Define "stance as prediction strategy" first, introduce the three stances second, and deploy "Real Patterns" third as the metaphysical payoff that dissolves the "are beliefs real" anxiety.

  ### 1. Ordering and Justification
  **Order:**
  1.  **Definition:** A stance is a prediction strategy with costs/payoffs (not a kind of thing).
  2.  **Application:** Apply the three stances to the core example.
  3.  **Resolution:** Use "Real Patterns" to answer the ontological worry ("But are the beliefs *real*?").

  **Justification:**
  Put Real Patterns at the end. If you define patterns first, students treat them as abstract metaphysics disconnected from the stances. By waiting, you let the students feel the tension created by the lecture's error ("If the intentional stance is just a shortcut, beliefs must be fake"). Real Patterns then arrives as the solution: beliefs are real *because* the intentional stance captures a real, objective pattern, not because they are physical neurons. This顺序 turns the ontology from a premise into a conclusion.

  ### 2. The Core Example: A Corporation (e.g., Amazon)
  **Why this replaces Chess:**
  CS students will try to open the hood of a chess engine. They cannot open the hood of a corporation. It satisfies your constraints (no animals/babies, design stance doesn't collapse to a set point) and works for both majors.

  *   **Physical Stance:** Predicting Amazon's stock price by tracking the motion of electrons in their server farms and the physics of their delivery trucks. (Cost: Impossible. Payoff: None.)
  *   **Design Stance:** Predicting Amazon's moves by analyzing their org chart, logistical algorithms, and profit protocols. (Cost: Extremely high complexity/proprietary info. Payoff: High accuracy, but computationally prohibitive for humans.)
  *   **Intentional Stance:** Predicting Amazon's moves by assuming it *wants* to maximize profit, *believes* cloud computing is growing, and *decides* to undercut competitors. (Cost: Low. Payoff: High accuracy for almost all human interactions.)

  **Why it works for CS majors:** They know the "Design" exists (code/org) but acknowledge it's too complex to simulate mentally. The Intentional Stance isn't "cute"; it's the only computationally feasible strategy for an outsider.

  ### 3. Misconception Management Table

  | Misconception | When to Kill It | Script / Move |
  | :--- | :--- | :--- |
  | **"Stances are kinds of things inside the box."** | **Minute 5** (Definition phase) | Draw a box. Write "Physical," "Design," "Intentional" *outside* the box with arrows pointing in. Say: "These are tools *we* use, not parts *it* has." |
  | **"Intentional Stance = Committing to real beliefs."** | **Minute 20** (After applying stances) | Ask: "When you predict Amazon will buy a startup, do you need to know if the CEO *actually* feels belief?" Answer: "No, you just need the system to act *as if* it does." |
  | **"Physical Stance = The only objective one."** | **Minute 25** (During comparison) | Point out that Physical prediction is impossible for humans. "Objectivity isn't about difficulty; it's about whether the pattern holds. If Intentional predicts better, it's tracking something real." |
  | **"Dennett says beliefs don't exist."** | **Minute 40** (Real Patterns section) | Explicitly write: "Real Patterns = Real Beliefs." Explain that if the pattern is objective (predictive), the entities in the pattern are real. |
  | **"Compression is relative to coding scheme."** | **Minute 45** (Q&A / Real Patterns) | **Refuse it.** See below. |
  | **"Design Stance requires a Designer (God)."** | **Whenever it arises** | "The Design Stance treats the system *as if* it were designed. Evolution does the designing. No theologian required." |

  ### 4. Handling the Compression Objection
  **Verdict:** Refuse it openly. It drags the room into information theory Kolmogorov complexity debates that obscure the philosophical point about realism.

  **The Sentence:** "That objection confuses the *description* of the pattern with the *utility* of the pattern; Dennett's criterion is about predictive leverage for agents like us, not about mathematical uniqueness in the abstract."

  **Where:** If raised during the Real Patterns section (Minute 40+). Do not let it stall the "Real Patterns = Real Beliefs" conclusion.

  ### 5. The Chatbot Question
  **Placement:** Minute 30 (Immediately after explaining the Intentional Stance, *before* Real Patterns).

  **Prerequisites on Board:**
  1.  "Stance = Prediction Strategy."
  2.  "Intentional Stance = Treat as rational agent with beliefs/desires."

  **How to Handle:**
  When they ask "Is the chatbot *really* intentional?":
  1.  Ask: "Can you predict its output better by assuming it *wants* to be helpful and *believes* facts about the world, or by tracing the voltage?"
  2.  They will say "Intentional."
  3.  Say: "Then it is a proper target of the stance. Whether it is *conscious* is a separate question we are skipping. For now, does the strategy work? Yes. Then the stance applies."
  4.  Pivot: "Now, are those beliefs *real*? That's what Real Patterns answers next."

  ### 6. Final Assessment Question
  **Do not use:** Spam filter or cellular automaton (too technical/abstract).
  **Use:** **A Hive Mind (e.g., Ant Colony or Swarm Bots).**

  **The Prompt:** "I have a swarm of 1,000 drones. Individually they are simple (Design Stance = simple rules). Collectively they build a bridge. Can I use the Intentional Stance on the *swarm*? What would I have to check to decide if the swarm's 'belief' is a Real Pattern?"

  **What this tests:**
  *   They must identify if the Intentional Stance yields predictive power over the Design Stance (efficiency).
  *   They must apply the Real Patterns criterion (is the pattern robust across different physical implementations?).
  *   It avoids the "consciousness" trap while testing the ontology.

  ### 7. What to Explicitly Refuse/Skip
  Announce this at Minute 2 so you don't get derailed later:
  1.  **Consciousness/Qualia:** "We are talking about prediction and reality, not what it feels like to be the system."
  2.  **Neurophysics:** "We are not discussing how neurons implement beliefs today."
  3.  **Information Theory Details:** "We are not debating Kolmogorov complexity; we are debating predictive utility."

  ### 8. Evolution/Designer Tangent Management
  If a student asks, "Who designed the system for the Design Stance?":
  **Script:** "Dennett's Design Stance is neutral on the origin. Whether natural selection or an engineer built it, if the system functions via organized components for a purpose, the Design Stance applies. We treat Nature as a blind designer."
  **Stop Rule:** If they push on "Blind Designer vs. God," say: "That's a metaphysical debate about origins; Dennett's point is about how we *analyze* the system now. Let's stick to the analysis."
