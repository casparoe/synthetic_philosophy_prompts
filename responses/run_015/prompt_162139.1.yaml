prompt: |-
  hey — I'm a TA for the intro philosophy of mind course this term (I took the upper-level version last year so I'm only a bit ahead of them). My section next week is fifty minutes and I have to do Dennett's three stances plus the real patterns bit. Please don't explain it to me — I need a plan for how to explain it.

  The room: about twenty students, half philosophy majors and half CS majors who will absolutely have opinions. They already had one lecture on it which apparantly went badly: the lecturer presented physical / design / intentional as if they were three kinds of thing you might discover inside the box, so now half the room thinks the intentional stance is the one where you commit to the thing really having beliefs, that the physical stance is the "objective" one and the other two are just shortcuts for people who can't be bothered, and a couple of them came out thinking Dennett's view is that beliefs don't exist.

  What I need:

  - The order the pieces have to go in, and what depends on what. My instinct is that "a stance is a prediction strategy with its own costs and payoffs" has to land before I name the three at all, otherwise the taxonomy reading is locked in. But I can't decide whether the real-patterns criterion goes at the end as the payoff — the answer to "ok but are the beliefs real or not" — or earlier, as the thing that fixes what a pattern is before we start talking about stances. Pick one and justify it against the other.

  - The one example that has to carry the whole hour. I was going to use the chess-playing computer (physical stance hopeless, design stance: it plays the strongest move it can find, intentional stance: it wants to win and thinks taking my queen is good), but I'm now worried that with a room full of CS students that example backfires — they know what search and evaluation actually are, so they'll either say "that's just the design stance with extra steps" or derail into whether the engine understands chess. Is that the right worry? If so what should carry it instead, what does the replacement have to have (predictable from all three stances, a case where the intentional stance genuinely saves you effort rather than just being cute, ...), and what must it NOT be — please nothing with an animal or a baby in it, and nothing where the design stance collapses into "it has a set point."

  - The misconceptions and where in the sequence each gets headed off, including the ones above. Also: someone will say that compression is relative to the coding scheme you pick, so any data set whatsoever has some pattern, and I don't remember how Dennett blocks that move — if you know, tell me where in the hour it belongs; if it genuinely can't be handled at this level, tell me to refuse it openly instead and give me the sentence to refuse it with. And tell me what to do with the evolution/designer tangent so it doesn't turn into a creationism argument.

  - One question at the end that tells me whether they actually got it rather than memorised three labels. I was thinking of handing them a fresh case — a spam filter, or a pattern in prices, or a cellular automaton — and asking "is there a real pattern here, and what would you have to check to settle it?" but I'm not sure that tests the thing I want.

  - What to explicitly refuse to cover at this level and announce that I'm skipping.

  They will 100% ask whether a modern chatbot is a proper target of the intentional stance. I want that question at a specific point in the hour rather than at minute three — tell me where it goes and what has to already be on the board for it to be useful instead of a derailment.

  Lead with your bottom line in the first sentence — the single ordering call everything else hangs on — then the reasoning, no preamble and don't restate my question back at me. Put the misconception / where-to-kill-it part in a table so I can actually use it in the room.
