prompt: |-
  I'm teaching an undergraduate course on rational choice theory and want to give my students a diagnostic quiz that sorts them into positions on the paradox of voting. The paradox, briefly: in a large election, the probability that any individual vote will be decisive is vanishingly small, so the expected instrumental benefit of voting seems far lower than the cost of going to the polls — yet millions of people vote. The quiz should help students discover which resolution of the paradox their own reasoning actually commits them to, before we study the positions explicitly.

  Please write a ten-question sorting quiz. Each question should present a concrete scenario — a thought experiment, a vignette, or a forced choice — with two or three answer options. No question should name a philosophical position or use jargon like "expressive voting," "pivot probability," or "rule consequentialism." The questions should probe the fault lines that actually separate the major positions: whether the act of voting has intrinsic value apart from its effect on the outcome, whether universalization gives reasons that act-consequentialist calculation misses, whether regret-avoidance is a legitimate basis for decision, whether group membership changes the rational calculus for an individual, and whether the sheer magnitude of the stakes can overcome a minuscule probability.

  The positions the quiz should sort into are:

  - **Expressive voting**: voting is an expressive act, like cheering or wearing a pin; its value doesn't depend on affecting the outcome.
  - **Ethical-altruistic voting**: the expected utility of voting is enormous once you multiply the per-person stakes by the number of people affected, so voting is straightforwardly rational even with tiny pivot probabilities.
  - **Duty-based voting**: voting is a civic or moral obligation that doesn't reduce to expected consequences.
  - **Rule-consequentialist voting**: the right question is not "what happens if I vote?" but "what if everyone in my situation reasoned the same way?"
  - **Minimax regret**: one should vote to avoid the worst-case regret — your side losing by exactly one vote while you stayed home.
  - **Rational-irrationality / ignorance**: people vote because they systematically misjudge the probabilities, or because it's a low-cost action that feels momentous; a fully rational agent wouldn't vote (or would vote only for non-instrumental reasons they don't genuinely have).
  - **Group-agency voting**: individuals vote as members of groups; the group decides collectively to turn out, and the individual's obligation derives from group membership rather than from individual expected-utility calculation.

  Include a scoring key that maps answer patterns to positions. Some students may fit more than one position; the key should acknowledge this and flag which pairs of positions the quiz cannot cleanly separate and why. Also note any logically possible answer patterns that correspond to no defended position — and briefly say whether the combination is incoherent, merely unattractive, or simply underexplored in the literature.

  The quiz should be suitable for undergraduates with no background in formal decision theory, though they should be comfortable with the basic idea of weighing costs against benefits. Write the questions in a clear, engaging style. Respond in the style of an expert in political philosophy and rational choice theory. Think very carefully about which answer patterns map to which positions before finalizing the scoring key.
reasoning: |-
  Here's a thinking process that leads to the suggested quiz:

  1.  **Analyze the Request:**
      *   **Goal:** Create a 10-question diagnostic quiz for undergraduates on the Paradox of Voting.
      *   **Purpose:** Sort students into philosophical positions *before* they learn the terminology.
      *   **Constraints:** No jargon (e.g., "expressive," "pivot probability," "rule consequentialism"). Concrete scenarios/vignettes only. Clear, engaging style.
      *   **Target Positions:**
          1.  Expressive Voting (intrinsic value of act).
          2.  Ethical-Altruistic Voting (huge stakes $\times$ tiny prob = positive EU).
          3.  Duty-Based Voting (obligation independent of consequences).
          4.  Rule-Consequentialist Voting (universalization test).
          5.  Minimax Regret (avoid worst-case scenario).
          6.  Rational-Irrationality (voting is irrational/misjudgment).
          7.  Group-Agency Voting (collective obligation).
      *   **Deliverables:** 10 Questions + Scoring Key (mapping patterns to positions, handling overlaps, noting incoherent patterns).
      *   **Tone:** Expert in political philosophy/rational choice, but accessible to undergrads.

  2.  **Deconstruct the Positions & Identify Fault Lines:**
      *   *Expressive:* Value is in the doing, not the result. Analogy: Cheering at a game.
      *   *Ethical-Altruistic:* Standard Expected Utility (EU) but with *social* benefits included. $P \times B_{social} > C$.
      *   *Duty-Based:* Deontological. "I ought to vote" regardless of $P$ or $B$.
      *   *Rule-Consequentialist:* Kantian/Rule-Utilitarian hybrid. "What if everyone did that?"
      *   *Minimax Regret:* Decision theory under uncertainty. Focus on the emotional cost of "if only I had."
      *   *Rational-Irrationality:* Hard rational choice. $P \times B < C$. Voting is a mistake or bias.
      *   *Group-Agency:* Sociology/Collective intentionality. I vote because *we* vote.

      *Key Distinctions to Probe:*
      *   Individual vs. Collective impact.
      *   Outcome vs. Act intrinsic value.
      *   Calculation vs. Obligation.
      *   Regret vs. Duty.
      *   Reality of probability vs. Psychological feeling.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Basic EU vs. Altruism):* Need to test if they multiply benefits by population.
          *   Scenario: Small benefit to many vs. large benefit to few.
          *   Draft: A policy helps everyone by $1 vs. one person by $1 million.
          *   Refinement: Make it about the vote's impact. If your vote decides, does the total good matter?
      *   *Q2 (Expressive):* Does the act feel good even if it changes nothing?
          *   Scenario: Secret ballot vs. public badge. Or voting in a landslide.
          *   Refinement: Voting in a election where the winner is already known. Do you still go?
      *   *Q3 (Rule/Universalization):* The classic "what if everyone stayed home?"
          *   Scenario: Everyone thinks like you.
          *   Refinement: A world where everyone with your views stays home.
      *   *Q4 (Regret):* The "one vote margin" scenario.
          *   Scenario: Your side loses by one. You didn't vote. How do you feel?
          *   Refinement: Compare the pain of losing by one (didn't vote) vs. losing by a million (did vote).
      *   *Q5 (Duty):* Obligation without consequence.
          *   Scenario: Jury duty analogy or tax paying.
          *   Refinement: Is it like paying taxes? You do it because it's the rule, not because your specific check matters.
      *   *Q6 (Rational-Irrationality):* Is voting a mistake?
          *   Scenario: A friend asks why you vote. You explain the math.
          *   Refinement: If the math says don't do it, but you do, is it a bug or a feature?
      *   *Q7 (Group Agency):* Union/Team analogy.
          *   Scenario: Your union endorses a candidate.
          *   Refinement: You are part of a bloc. The bloc decides to turn out. Do you follow?
      *   *Q8 (Expressive vs. Instrumental):* Cheering analogy.
          *   Scenario: Sports game. Your team is losing by 100 points. Do you cheer?
          *   Refinement: Connect cheering to voting.
      *   *Q9 (Altruistic Magnitude):* Stakes size.
          *   Scenario: Election determines war vs. parking fees.
          *   Refinement: Does the *size* of the disaster overcome the *smallness* of the chance?
      *   *Q10 (Synthesis/Conflict):* Forced choice between duty and math.
          *   Scenario: Math says stay home, conscience says go.
          *   Refinement: Which voice wins?

      *(Self-Correction during drafting)*: I need to make sure the answer options map clearly to the 7 positions. Some questions might need 3 options to distinguish between similar views (e.g., Duty vs. Rule-Consequentialism). Let's ensure the options are distinct behavioral commitments.

      *Revised Plan for Options:* Instead of A/B/C mapping to specific theories directly, I will design the options to reflect *reasoning styles*. The scoring key will aggregate these styles.
      *   Option A: Focus on individual impact/math (Rational-Irrationality or Ethical-Altruistic depending on magnitude).
      *   Option B: Focus on the act itself/feeling (Expressive).
      *   Option C: Focus on the collective/universal (Rule/Group/Duty).
      *   Option D: Focus on regret/emotion (Minimax).

      *Wait, the prompt asks for 2 or 3 answer options per question.* I need to be precise. Let's map specific options to specific "votes" for a position.
      *   Let's create a tagging system for each option (e.g., [EXP], [ALTR], [DUTY], [RULE], [REGRET], [RAT-IRR], [GROUP]).
      *   Then the scoring key sums the tags.

      *Let's refine the questions to ensure separation.*
      *   *Separation Challenge:* Ethical-Altruistic vs. Rule-Consequentialist. Both look at social good. Difference: Altruistic = $P \times B_{total}$. Rule = "If everyone did X."
      *   *Separation Challenge:* Duty vs. Rule. Duty = "It's wrong not to." Rule = "It leads to disaster if everyone doesn't."
      *   *Separation Challenge:* Expressive vs. Rational-Irrationality. Expressive = "I get value from doing it." Rat-Irr = "I am making a calculation error or it's irrational."

      *Let's write the questions.*

      *Q1 (The Math):* Pure expected utility.
      *Q2 (The Landslide):* Expressive vs Instrumental.
      *Q3 (The Universal Test):* Rule Consequentialism.
      *Q4 (The One-Vote Loss):* Minimax Regret.
      *Q5 (The Civic Obligation):* Duty.
      *Q6 (The Group):* Group Agency.
      *Q7 (The Stakes):* Ethical-Altruistic (Magnitude).
      *Q8 (The Honest Friend):* Rational-Irrationality (acknowledging irrationality).
