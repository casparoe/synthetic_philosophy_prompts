answer: |-
  # The Voter's Dilemma: A Diagnostic Quiz

  **Instructions:** Below are ten scenarios involving voting, decision-making, and civic life. There are no right or wrong answers. For each scenario, choose the option that *best* matches your intuitive reaction or reasoning. Do not overthink the political science terminology; simply select the response that feels most true to how you view the world.

  ---

  ### 1. The Cost-Benefit Analysis
  Imagine an election where the winner will implement a policy that benefits every citizen by $100. There are 10 million voters. The cost to you of going to the polls (time, travel, effort) is equivalent to $20. Mathematical models show your chance of casting the deciding vote is 1 in 10 million.
  *   **A.** I stay home. The expected return (0.0000001 $\times$ $100) is fractions of a penny, which is far less than the $20 cost.
  *   **B.** I vote. Even though my chance is tiny, the total benefit to society ($1 billion) is so huge that it outweighs my $20 cost.
  *   **C.** I vote. The calculation of costs and benefits misses the point; citizens simply ought to participate.

  ### 2. The Landslide
  It is Election Day. The news projections are in: Candidate A is leading Candidate B by 2 million votes with only 1,000 ballots left to count. You support Candidate B. The polls close in one hour.
  *   **A.** I stay home. My vote cannot change the winner, so going to the polls is a waste of time.
  *   **B.** I go vote. Even in a loss, I want to stand with my team and register my support.
  *   **C.** I go vote. My obligation to the democratic process exists regardless of whether the race is close.

  ### 3. The Universal Test
  Imagine a world where every single person who shares your political views decides to reason exactly the way you do. If your reasoning leads you to stay home, then everyone like you stays home.
  *   **A.** That doesn't change my decision. I am responsible only for my own action, not for what others might copy.
  *   **B.** That would be catastrophic. If everyone like me stays home, my side loses. So I must vote to set the right example.
  *   **C.** That suggests we should coordinate. If my "group" decides to turn out, I go as part of that collective effort.

  ### 4. The One-Vote Margin
  After the election, it is revealed that your preferred candidate lost by exactly one vote. You did not vote.
  *   **A.** I feel devastating regret. The possibility of that specific outcome makes staying home unbearable.
  *   **B.** I feel unlucky, but I maintain that staying home was still the logically correct choice given the information I had beforehand.
  *   **C.** I feel I failed a moral test. It doesn't matter about the margin; I failed to do my part.

  ### 5. The Union Hall
  You are a member of a large organization (like a union or professional association). The organization has collectively decided to mobilize its members to vote for a specific measure.
  *   **A.** I vote because I am a member of this "we." When the group acts, I act with it.
  *   **B.** I consider their recommendation, but I ultimately decide based on my own personal cost-benefit analysis.
  *   **C.** I vote because the organization's rule is that members participate, and I agreed to those terms.

  ### 6. The High Stakes
  Consider two elections. In Election X, the issue is a minor adjustment to parking fees. In Election Y, the issue is whether the country goes to war. In both, your probability of being decisive is the same (vanishingly small).
  *   **A.** I am much more likely to vote in Election Y. The stakes are high enough to overcome the low probability.
  *   **B.** My likelihood of voting is the same in both. Either voting is your duty, or it isn't; the stakes don't change the math enough.
  *   **C.** I am more likely to vote in Election Y, mostly because I would never forgive myself if war happened and I hadn't tried to stop it.

  ### 7. The Sports Analogy
  Think about a sports game where your team is losing by 50 points with one minute left.
  *   **A.** Cheering is pointless. It won't change the score, so a rational person saves their breath.
  *   **B.** I cheer anyway. It's about expressing loyalty and passion, not changing the scoreboard.
  *   **C.** I cheer because that's what fans do. It's part of the role I've taken on.

  ### 8. The Secret Ballot
  Imagine a new system where voting is completely anonymous. No one can ever know whether you voted or not, not even the government. There is no social pressure or record.
  *   **A.** I am less likely to vote. Without social accountability or group pressure, the incentive drops.
  *   **B.** I vote just the same. I know I did it, and that internal satisfaction is enough.
  *   **C.** I vote just the same. The consequences of the election happen whether anyone sees me or not.

  ### 9. The Honest Friend
  A friend asks you: "Be honest. Do you really think your single vote will determine the election?"
  *   **A.** "No, of course not. But I vote anyway because I systematically overestimate my influence/it feels important."
  *   **B.** "No, but if everyone who said 'no' stayed home, democracy would collapse."
  *   **C.** "No, but voting allows me to express my identity, like wearing a team jersey."

  ### 10. The Conflict
  Your calculator says: "Staying home is the instrumentally rational choice." Your conscience says: "Going to the polls is the right thing to do."
  *   **A.** I listen to the calculator. If the math says it's irrational, I shouldn't do it.
  *   **B.** I listen to my conscience. Moral obligations override instrumental calculation.
  *   **C.** I assume the calculator is missing something (like the value of the act itself) and vote.

  ---

  # Scoring Key & Interpretation Guide

  **Instructor Note:** This quiz is designed to reveal the *structure* of a student's reasoning, not to assign a rigid label. Most students will exhibit a hybrid profile. The goal is to help them see which philosophical "bucket" their intuitions pour into most naturally.

  ### Step 1: Tally the Responses
  Have students count how many times they selected each letter option. While the options are not perfectly one-to-one with theories (to prevent gaming the quiz), they cluster as follows:

  *   **Mostly A's:** **The Rational-Irrationality / Hard Rationalist Position.**
      *   *Core Commitment:* Instrumental rationality is the only valid metric. If $P \times B < C$, do not act.
      *   *Diagnosis:* These students are most likely to conclude that voting is irrational for a self-interested agent. They may view actual voters as suffering from cognitive bias or probability misjudgment.
  *   **Mostly B's:** **The Ethical-Altruistic or Expressive Position.**
      *   *Core Commitment:* Voting is rational, but the "Benefit" term is expanded.
      *   *Diagnosis:* Look at specific questions to distinguish.
          *   If they chose **B** on Q1 (Social Benefit) and Q6 (High Stakes), they lean **Ethical-Altruistic** (utilitarian calculus including others' welfare).
          *   If they chose **B** on Q2 (Landslide), Q7 (Sports), and Q9 (Identity), they lean **Expressive** (consumption value of the act).
  *   **Mostly C's:** **The Duty, Rule, or Group Position.**
      *   *Core Commitment:* Rationality is not just about consequences; it's about obligations, rules, or collective identity.
      *   *Diagnosis:* Look at specific questions to distinguish.
          *   If they chose **C** on Q1 (Ought), Q4 (Moral Test), and Q10 (Conscience), they lean **Duty-Based** (Deontological).
          *   If they chose **C** on Q3 (Universal) and Q9 (Example), they lean **Rule-Consequentialist**.
          *   If they chose **C** on Q3 (Coordinate), Q5 (Union), and Q8 (Accountability), they lean **Group-Agency**.
  *   **Specific Pattern:** **Minimax Regret.**
      *   *Diagnosis:* Students who specifically chose **A** on Q4 (One-Vote Margin) and **C** on Q6 (High Stakes/Regret) are prioritizing the avoidance of the worst-case emotional outcome over expected utility.

  ### Step 2: Interpreting Hybrid Profiles
  It is logically consistent to hold positions from multiple categories. Use this guide to help students parse their mix:

  **1. The "Civic Utilitarian" (Altruistic + Rule)**
  *   *Pattern:* High scores on Q1-B, Q3-B, Q6-A.
  *   *Interpretation:* You believe voting is rational because the social stakes are high, *and* you believe universalization matters. These two positions are highly compatible; both argue that the individual calculation is too narrow.
  *   *Philosophical Note:* This is the most common "solution" to the paradox in introductory ethics.

  **2. The "Expressive Realist" (Expressive + Rational-Irrationality)**
  *   *Pattern:* High scores on Q2-B, Q7-B, Q9-A.
  *   *Interpretation:* You admit the instrumental math doesn't work (Rat-Irr), but you vote because it provides personal satisfaction (Expressive).
  *   *Philosophical Note:* This aligns with Brennan & Lomasky's *Democracy and Decision*. You are rational to vote *if* you count "feeling like a patriot" as a benefit, but irrational if you think you're influencing the outcome.

  **3. The "Kantian Citizen" (Duty + Rule)**
  *   *Pattern:* High scores on Q1-C, Q3-B, Q10-B.
  *   *Interpretation:* You view voting as a categorical imperative. The distinction between "Duty" and "Rule-Consequentialism" is thin here; both reject the individual expected-utility framework.
  *   *Philosophical Note:* The quiz cannot cleanly separate Deontology from Rule-Utilitarianism in all cases (see "Limitations" below).

  **4. The "Collectivist" (Group + Duty)**
  *   *Pattern:* High scores on Q3-C, Q5-A, Q8-A.
  *   *Interpretation:* You do not see yourself as an atomized individual. Your rationality is embedded in your group memberships.
  *   *Philosophical Note:* This challenges the methodological individualism of standard rational choice theory.

  ### Step 3: Logically Possible but Undefended Patterns
  Some answer combinations suggest reasoning that is either incoherent or rarely defended in the literature. Flag these for class discussion.

  **1. The "Regret-Only" Voter (Minimax without Duty or Altruism)**
  *   *Pattern:* Q4-A (Regret), but Q1-A (Math says no), Q2-A (Landslide says no), Q10-A (Math wins).
  *   *Analysis:* **Incoherent.** If you admit the math says "stay home" and you have no duty to vote, but you vote *only* to avoid regret, you are admitting you are acting irrationally to soothe an emotion you acknowledge is based on a statistical improbability.
  *   *Status:* Psychologically common, philosophically unstable. It admits to a cognitive bias without justifying it.

  **2. The "Stakes Denier" (Rational-Irrationality + High Stakes)**
  *   *Pattern:* Q1-A (Math says no), Q6-A (Stakes don't matter), Q9-A (I'm deluded).
  *   *Analysis:* **Consistent but Radical.** This is the pure Downsian position. It implies that in a dictatorship vs. democracy choice, a rational actor should still stay home if the pivot probability is low enough.
  *   *Status:* Defended in formal theory, but counter-intuitive to most. Good candidate for "Steel-manning" the paradox.

  **3. The "Magic Universalizer" (Rule without Consequence)**
  *   *Pattern:* Q3-B (If everyone stayed home it would be bad), but Q1-A (My vote doesn't matter).
  *   *Analysis:* **Unattractive.** This attempts to get the moral benefit of universalization without accepting the consequentialist logic that underpins it. If your vote doesn't matter (Q1-A), why does everyone copying you matter?
  *   *Status:* A common student error. Use this to introduce the difference between *causal* impact and *logical* universalization.

  ### Limitations of the Diagnostic
  Be transparent with your students about what the quiz cannot do:

  1.  **Duty vs. Rule-Consequentialism:** These often yield identical behavioral prescriptions (Vote). The quiz probes the *reasoning* (Obligation vs. Disaster Prevention), but students often conflate "It would be bad if everyone did X" with "It is wrong for me to do X."
  2.  **Expressive vs. Altruistic:** Both justify voting despite low pivot probability. The distinction lies in *where* the value comes from (internal expression vs. external social good). Questions 2 and 7 attempt to separate these, but a student may value both.
  3.  **Group Agency vs. Social Pressure:** Question 5 and 8 probe this, but students may view group obligation as merely "social pressure" (external cost) rather than a change in the unit of agency (internal obligation).

  **Suggested Follow-Up:** Ask students who scored high in **Rational-Irrationality** if they actually vote. If they say "Yes," ask them to reconcile their behavior with their diagnostic result. This creates the cognitive dissonance necessary to motivate the study of Expressive and Ethical resolutions.
