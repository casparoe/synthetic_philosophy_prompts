answer: |-
  This is a classic setup, and your friend has reconstructed a very sharp version of **robust intellectualism** (closely associated with the philosopher Jason Stanley). The argument is valid, which is why you feel cornered. If you accept the premises, the conclusion (7) follows.

  But (7) is a *reductio ad absurdum*. It violates the very phenomenon we are trying to explain. Since you prefer to keep (1) (Intellectualism) rather than accept (7), you need to attack the bridge between them.

  Here is the exit strategy, the specific step to reject, and the bill you will have to pay.

  ### The Weak Link: Reject (3) and Refine (2)

  The argument collapses if you reject **(3)** ("Knowledge-that isn't graded") and adopt a **Fregean** view of **(2)** ("Propositions are coarse-grained").

  Your friend is relying on a "Russellian" view of propositions: if the truth conditions are the same, the knowledge is the same. But in epistemology, we often care about *how* the knower grasps the proposition.

  **The Move:**
  You argue that the Trainee and the Cyclist both stand in the knowledge relation to the same proposition ($p$: "$w$ is a way to ride"), but they grasp it under **different modes of presentation**.
  *   **The Trainee** grasps $p$ under a *theoretical/descriptive* mode.
  *   **The Cyclist** grasps $p$ under a *practical* mode.

  If modes of presentation matter to the identity of the knowledge state (which they do in standard Fregean cases, like Oedipus knowing "Jocasta is my mother" vs. "The Queen is my mother"), then premise (5) is false. They do *not* have the "very same knowledge." They have the same *object* of knowledge, but distinct *knowledge states*.

  **Why this blocks (7):**
  If knowledge states are distinct, then the residency *does* teach you something epistemic: it converts your theoretical mode of presentation into a practical one. It changes the *nature* of your knowledge, not just your motor output.

  ### The Price of This Move

  You asked specifically about the cost of the "modes of presentation" move. Here is the invoice:

  **1. You bloat your ontology.**
  You have to commit to the existence of "practical modes of presentation." You then face the hard question: What *is* a practical mode of presentation?
  *   If it's just a neural disposition to act, your friend will say you've smuggled Anti-Intellectualism back in.
  *   If it's a mental representation, you risk restarting Ryle's Regress (does the cyclist need to represent the mode to use it?).
  *   **The Cost:** You must defend a theory of mind where "grasping" is not a uniform relation. This makes epistemology significantly more complex than the binary "knows/doesn't know" model your friend prefers.

  **2. You blur the line between Intellectualism and Anti-Intellectualism.**
  By making the "practical mode" so essential that it distinguishes the surgeon from the book-reader, you are conceding the Anti-Intellectualist's main point: that there is something irreducibly practical about expertise.
  *   **The Cost:** You keep the label "Intellectualist" (because you still say knowledge-how is a species of knowledge-that), but you lose the simplifying power of the view. You wanted to reduce ability to information; now you have to say ability is information *plus a special practical grip*.

  **3. You have to explain the "Verbal Access" wrinkle.**
  You noted the cyclist can't tell you what $w$ is. On the modes-of-presentation view, this is because the practical mode is **non-linguistic**.
  *   **The Cost:** You must admit that a significant portion of human knowledge is propositionally structured but linguistically inaccessible. This complicates the "science of ideas" you cover, as it posits a vast reservoir of knowledge that cannot be communicated via text, only via demonstration and imitation.

  ### What about the Regress? (Addressing your second wrinkle)

  Your friend claims Anti-Intellectualism dies on Ryle's Regress. This is the standard intellectualist trump card. The regress argues: If knowing-how is just a disposition, then intelligent action requires a prior act of contemplation to guide the disposition, which requires another disposition, ad infinitum.

  **Is it fatal? No.**
  Most contemporary Anti-Intellectualists (e.g., Hubert Dreyfus, Alva Noë, or even Stanley's critics) dissolve the regress rather than solving it. They argue the regress assumes a **spectator theory of the mind**.
  *   **The Counter:** Intelligent action does not require an *internal* intellectual supervisor. The intelligence is in the *coupling* of the agent and the environment. When a cyclist corrects a wobble, they aren't consulting a proposition; they are responding to a affordance.
  *   **The Cost of Rejecting the Regress:** You have to accept that "intelligence" is not always a mental event. It can be a property of a system's interaction with the world. For a science writer, this is actually a fertile position (embodied cognition), but it requires abandoning the idea that all reasoning is internal symbol manipulation.

  ### The Alternative: Reject (1) entirely

  If you find the "modes of presentation" move too slippery (it does feel like a compromise), the cleaner exit is to reject **(1)**.

  **The Argument:**
  Knowing-how is a **distinct epistemic category**. It is not reducible to knowing-that.
  *   **The Trainee** has *knowledge-that* (propositional).
  *   **The Cyclist** has *knowledge-how* (procedural/dispositional).
  *   **Premise (4)** is false: The trainee does *not* know that $w$ is a way to ride in the full sense required for action. She knows *that it is said to be*, or *that it is theoretically optimal*, but she lacks the understanding that comes from integration.

  **The Price:**
  1.  **Fragmentation:** You lose the unity of knowledge. Epistemology now has two distinct silos that don't talk to each other.
  2.  **The Regress:** You must face the dragon. You need to explain how a disposition can be intelligent without a rule. (Again, the solution is usually embodied cognition: the "rule" is in the physics of the body-environment system, not the head).

  ### Recommendation for Your Exit

  Since you prefer keeping (1), here is your script for the next dinner:

  > "I'm willing to grant Intellectualism (1), but I reject (3). Knowledge is sensitive to **modes of presentation**. The surgeon and the text-reader grasp the same proposition, but the surgeon grasps it under a **practical mode** that entails a capacity for counterfactual adjustment in real-time.
  >
  > That practical mode *is* the epistemic value added by residency. It's not just 'tuning the machinery' (6); it's changing the **epistemic relation** to the fact. If you deny that, you're claiming that understanding the *application* of a truth is epistemically identical to understanding the *statement* of the truth. And if you claim that, you can't explain why we don't let medical students operate just because they passed the written exam."

  **Summary of Costs:**
  *   **To keep (1) & reject (7):** You must accept that "knowing" is a fine-grained relation sensitive to how the info is grasped (Fregean). You must accept that some knowledge is propositionally structured but non-linguistic.
  *   **To reject (1) & reject (7):** You must accept that "intelligence" can exist without internal representation (dissolving Ryle's Regress via embodied cognition).

  Your friend's argument works only if you accept a very thin, binary, Russellian view of propositions. Once you thicken the concept of "grasping a proposition," the exit opens up.
