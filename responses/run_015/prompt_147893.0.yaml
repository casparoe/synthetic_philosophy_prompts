answer: |-
  The standard conception of verisimilitude operates under a tacit assumption of ontological continuity. It presumes that competing theories are attempting to describe the same furniture of the universe, such that progress can be measured by the accumulation of true statements regarding that furniture or by the decreasing logical distance between a theory's models and the actual world. On this view, a theory is truth-like to the degree that its propositions correspond to existing states of affairs. However, this approach encounters a catastrophic failure when faced with the history of scientific progress, where successful theories often posit entities that do not exist. If verisimilitude requires ontological correspondence, then a theory positing non-existent entities is radically false, regardless of its predictive success or explanatory power. This conclusion is untenable. It suggests that a theory which perfectly maps the behavior of a system using the wrong nouns is no closer to the truth than a theory that maps nothing at all.

  To resolve this, we must shift the locus of verisimilitude from ontological identity to structural fidelity. The argument presented here contends that truth-likeness is not a measure of how many posited entities exist, but rather a measure of how accurately a theory preserves the modal dependency structures among the phenomena it addresses. A false theory can be closer to the truth than a true but ontologically sparse theory if the false theory captures the correct internal pattern of counterfactual and explanatory dependencies within its restricted domain. This position relies on the principle of Structural Invariance under Ontological Reduction, which asserts that what survives the reduction of a false theory to a true one is not the entities, but the architecture of dependencies they instantiated.

  **The Failure of Ontological Counting**

  The traditional view treats theories as sets of propositions evaluated against a single, fixed ontology. If Theory A posits entities {x, y, z} and the true ontology contains only {a, b}, Theory A is deemed false because x, y, and z do not refer. Verisimilitude is then calculated by subtracting false consequences from true ones. This arithmetic fails because it ignores the functional role of the posits. In scientific practice, entities are often placeholders for causal powers or structural nodes. When a theory is superseded, the placeholders are often discarded, but the causal powers they were meant to track are re-described, not denied.

  Consider a theory that posits a fluid substance to explain heat transfer. If the fluid does not exist, the standard view declares the theory false. Yet, if the equations governing the fluid's flow perfectly predict the temperature changes in solid bodies, the theory has captured something real about the world. It has captured the *structure* of heat transfer. To deny this is to claim that the mathematical relationships governing the world are not part of the truth, but only the names of the relata are. This is an impoverished view of truth. The truth of the world consists not merely in what exists, but in how what exists behaves and depends upon other things. Therefore, verisimilitude must be defined by the fidelity of the dependency map, not the accuracy of the node labels.

  **Modal Dependency Structures**

  We must define what is meant by "modal dependency structures." These are the counterfactual relationships that hold between states of a system. They are claims of the form: "If variable A were to change in manner X, variable B would change in manner Y, ceteris paribus." These dependencies are the backbone of explanation. A theory is truth-like if the web of dependencies it posits is isomorphic to the web of dependencies that actually obtains in the world, even if the theory misidentifies the underlying substrate generating those dependencies.

  This allows for a nuanced evaluation of false theories. A theory is not simply "false"; it is false in its ontology but potentially true in its structure. The verisimilitude of the theory is proportional to the degree of isomorphism between its dependency graph and the actual causal-nomic structure of the domain. This moves verisimilitude from a semantic property (reference) to a structural property (mapping).

  **Structural Invariance under Ontological Reduction**

  To formalize this, we introduce the concept of Structural Invariance under Ontological Reduction (SIOR). Reduction here is not the derivation of one theory from another, but the mapping of a false theory onto the true ontology that supersedes it. SIOR posits that when a false macro-level theory is reduced to a true micro-level theory, the entities of the macro theory may vanish (they reduce to null), but the dependency architecture they instantiated must map onto the dependencies of the micro theory.

  For example, if a macro theory posits a pressure force generated by a static fluid, and the true theory posits kinetic collisions of particles, the entity "static fluid" vanishes. However, the dependency relation "increased confinement leads to increased outward force" remains invariant. The macro theory captures a structural truth about the system's behavior that is preserved across the ontological shift.

  SIOR provides the metric for verisimilitude in the absence of shared ontology. We do not ask, "Do the entities exist?" We ask, "If we translate the dependency relations of this theory into the language of the true ontology, do the relations hold?" If they do, the theory possesses high verisimilitude. It is truth-like because it encodes the invariant structure of the world, even if it clothes that structure in fictional garments.

  **The Superiority of Layered Falsehoods over Sparse Truths**

  This framework supports the counter-intuitive claim that a false theory with a layered, domain-restricted ontology can be closer to the truth than a true but ontologically sparse theory. This requires clarifying what "closer to the truth" means in this context. It does not mean the false theory is more *accurate* regarding fundamental existence. It means the false theory is more *informative* regarding the structural complexity of the domain in question.

  A fundamental physical theory may be ontologically sparse and strictly true, listing only elementary particles and fields. However, relative to a macroscopic domain (e.g., thermodynamics or fluid dynamics), this sparse theory may be explanatorily inert. It possesses the truth of the constituents but lacks the structural vocabulary to describe the emergent dependencies efficiently. It is "true" but structurally distant from the phenomena of the macro domain.

  Conversely, a false macro theory (e.g., one positing continuous matter rather than discrete atoms) may be ontologically incorrect but structurally rich. It captures the emergent dependency patterns (viscosity, turbulence, pressure gradients) that actually govern the domain. Because verisimilitude is concerned with the capture of dependency structures, the false theory is "closer" to the truth of the *domain* than the sparse theory. The sparse theory tells you what the world is made of; the false layered theory tells you how the world works at that level. Since the "truth" of a domain includes its nomological structure, the theory that captures the structure is more truth-like with respect to that domain, despite its ontological errors. To prioritize the sparse ontology is to prioritize the "what" over the "how," but scientific understanding requires both. A theory that gets the "how" right via false "whats" retains more cognitive contact with reality than a theory that gets the "whats" right but cannot articulate the "how."

  **The Objection of Internal Coherence**

  A serious objection arises: If we detach verisimilitude from ontological correspondence, do we not collapse into a coherence theory of truth? If the entities do not exist, are we not merely judging how well the theory fits together internally? A fantasy novel can have a rigorous internal logic of magic and dependency without being truth-like. Why is a false scientific theory different?

  The distinction lies in the source of the dependency constraints. Internal coherence is a matter of logical consistency among propositions. Structural fidelity is a matter of empirical mapping to actual-world patterns. A false scientific theory is constrained by observation in a way that a coherent fiction is not. The dependency structures posited by the theory must align with the counterfactual robustness of the actual world.

  When we evaluate the verisimilitude of a false theory, we are not checking if its propositions are consistent with each other. We are checking if the *relations* between its posits mirror the *relations* between actual phenomena. In the case of the fantasy novel, the dependency "casting spell A causes effect B" has no counterpart in actual-world modal structures. In the case of the false scientific theory, the dependency "increasing temperature causes expansion" maps onto a real counterfactual in the world, even if the explanation invokes a non-existent "heat fluid."

  Therefore, structural fidelity differs from coherence because it requires an external anchor. The anchor is not the entities (which are missing), but the patterns of variation and invariance in the phenomena. The theory is truth-like because the map of dependencies it provides allows for successful intervention and prediction in the real world. Coherence alone does not guarantee successful intervention; structural fidelity does. The false theory works *because* it latches onto real structural features of the universe. It is this latching, this isomorphism of dependency, that constitutes its verisimilitude.

  **Conclusion: Truth as Structural Preservation**

  We must conclude that verisimilitude is fundamentally a structural notion, not an ontological one. The aim of science is to recover the dependency architecture of the universe. Ontologies are the provisional vocabularies we use to index that architecture. When vocabularies change, the architecture often remains. To define verisimilitude by ontological overlap is to mistake the index for the map.

  By adopting the principle of Structural Invariance under Ontological Reduction, we acknowledge that a theory can be false in its substance but true in its form. This allows us to make sense of scientific progress not as a straight line of accumulating true entities, but as a process of refining structural maps. It validates the intuition that a theory which correctly predicts the behavior of a system through a complex web of dependencies is closer to the truth than a theory which merely lists the system's constituents without capturing their interactions. Ultimately, the truth-likeness of a theory is determined by the resilience of its dependency structures under reduction. If the structure survives the death of the entities, the theory has touched the truth.
