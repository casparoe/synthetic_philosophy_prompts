answer: |-
  The boxing analogy is fundamentally broken because it treats war as a consensual contest governed by neutral rules, whereas war is typically a non-consensual conflict over rights where one side is objectively wrong to fight.

  ### The Correspondence Table

  To audit the analogy, we must first see how its proponents map the ring onto the battlefield.

  | Boxing Element | Proposed War Equivalent | Function in Analogy |
  | :--- | :--- | :--- |
  | **The Fighters** | Combatants (Soldiers) | The agents permitted to use violence. |
  | **Consent to Fight** | Enlistment / Conscription | Supposedly legitimises the violence exchanged. |
  | **The Rules** | Laws of Armed Conflict (Geneva Conventions) | Limits *how* violence is used, not *why*. |
  | **The Referee** | International Law / UN / Officers | Enforces the rules, remains neutral on the cause. |
  | **The Gloves** | Distinction (Uniforms) | Signals legitimacy; distinguishes fighter from civilian. |
  | **The Bell** | Declaration of War / Mobilisation | Marks the start of the permissible violence window. |
  | **The Crowd** | Civilian Population | Spectators who should not be hit (in theory). |
  | **The Title / Prize** | Political Objective / Peace Treaty | The outcome that justifies the effort (winning). |
  | **No Assault Charge** | Combatant Privilege | Immunity from prosecution for killing enemy combatants. |

  ### Where the Mapping Breaks

  The analogy works only if you ignore the moral reality of what is happening outside the ring. Here is where the threads unravel, addressing your specific tripping points.

  **1. Consent and Coercion**
  In boxing, consent is specific, informed, and revocable (you can quit between rounds). In war, consent is almost always fictional. A conscript has no consent to offer; a volunteer consents to serve the state, not necessarily to fight a specific war of aggression. If a boxer agrees to a match but the opponent brings a knife, the consent is void. In war, the "opponent" is often trying to kill you regardless of rules. More critically, boxing consent legitimises *harm*; war consent is supposed to legitimise *killing*. You cannot consent to be murdered on behalf of a unjust cause. The analogy smuggles in voluntariness to suggest soldiers are moral agents choosing a contest, when they are often instruments of state policy with no exit option.

  **2. The Stakes of Winning**
  A boxing match is a zero-sum game where the winner gets a belt and the loser gets nothing; neither gains moral rights over the other. War is rarely like this. Wars are fought over borders, rights, resources, or ideology. If Country A invades Country B to steal land, and Country B fights back, the outcome *does* settle who is in the right. If Country A wins, they successfully commit theft. The boxing analogy suggests the outcome is morally neutral (someone wins, someone loses). In reality, an unjust victory is a moral catastrophe. Treating them as equal contestants implies the aggressor's victory is just as legitimate as the defender's, provided they followed the rules of fighting.

  **3. Third-Party Interests**
  Boxers fight for themselves (or their team's pride). Soldiers fight for a country, a population, or an ideology. Crucially, civilians are not just a crowd; they are the *reason* for the fight. In boxing, hitting the crowd is a foul. In war, hitting the crowd (collateral damage) is often calculated as permissible proportionality. This changes the structure from a duel to a defence of others. If I step in to stop you mugging someone, I am not in a "match" with you; I am enforcing a right. The boxing analogy erases the victim (the civilian or the invaded state) and focuses only on the fighters, which distorts the moral geometry.

  **4. The Volunteer vs. The Conscript (The Moral Asymmetry)**
  Your case of the keen Nazi volunteer versus the terrified Soviet conscript breaks the analogy completely. In boxing, if both fighters follow the rules, they are morally equal regardless of motivation. In war, motivation and cause matter. The volunteer fighting for an unjust cause (aggression) is contributing to a wrong. The conscript fighting for a just cause (defence) is preventing a wrong. The boxing analogy says they are "in the same position" (both legitimate targets, neither murderers). This is counter-intuitive because the volunteer is morally culpable for joining an unjust project, whereas the conscript is often excused by duress. The analogy flattens moral responsibility into functional role. It suggests that wearing the uniform washes away the justice of the cause, which is precisely what is disputed.

  ### Disaggregating the Conclusions

  People use the boxing picture to support four distinct claims, but the analogy cannot carry them all.

  1.  **Equal Permission to Fight:** *The analogy supports this.* In boxing, both are permitted to punch. In war, MEC says both are permitted to shoot. *Reality:* Only the just side has true moral permission; the unjust side is merely excused or unprosecuted.
  2.  **Equal Liability to be Killed:** *The analogy supports this.* Both boxers can be hit. In war, MEC says both soldiers are legitimate targets. *Reality:* This is the strongest pragmatic claim. Even if the German soldier is fighting unjustly, he is still dangerous. However, morally, the unjust aggressor is liable because he threatens rights; the just defender is not liable because he protects them. The analogy hides this asymmetry.
  3.  **Equal Blameworthiness:** *The analogy supports this.* Neither boxer is blamed for fighting. In war, MEC says neither soldier is a murderer. *Reality:* This fails. Soldiers on the unjust side may be blameworthy, especially volunteers with knowledge. Soldiers on the just side are generally praiseworthy. The analogy incorrectly suggests moral neutrality.
  4.  **Equal Honour/Respect:** *The analogy supports this.* Sportsmanship respects both fighters. In war, we often respect veterans on both sides. *Reality:* This is a social convention, not a moral truth. We might honour their sacrifice without honouring their cause. The boxing match conflates respect for courage with respect for the cause.

  **Verdict:** The boxing picture carries the pragmatic claims (liability, privilege) reasonably well but fails catastrophically on the moral claims (permission, blame). It trades moral truth for legal convenience.

  ### The Epistemic Point

  Your mate is onto something significant. This is known as the epistemic defence of Moral Equality of Combatants. The argument is: *Soldiers cannot know who is right.* Wars are complex; propaganda is rampant; intelligence is classified. Therefore, we treat them as equal because we cannot expect them to work it out.

  If this is true, the boxing match is doing no work at all; it is merely a decorative illustration of ignorance. A boxing match is not about ignorance; it is about agreed rules. If the real justification is "they don't know better," then the analogy is misleading because it suggests they *are* in a fair contest, rather than that they are *excused* for participating in an unfair one.

  This distinction matters for officers and leaders. A private soldier might claim ignorance (epistemic limitation), but an officer with access to intelligence cannot. If the justification for equality is ignorance, then officers on the unjust side lose their protection. The boxing analogy fails here because it treats all fighters as identical units. It cannot distinguish between the blind conscript and the knowing general. If the theory rests on epistemic limits, it collapses for anyone who *does* know the cause is unjust.

  ### A Better Picture?

  The policing analogy is the standard rival, but as you noted, it imports problems.

  **The Policing Model:**
  *   **The Picture:** The just side are police officers; the unjust side are criminals resisting arrest.
  *   **What it captures:** Moral asymmetry. Police have permission to use force; criminals do not. Police are liable to be stopped; criminals are liable to be arrested.
  *   **What it imports wrongly:** Police operate under domestic law with a monopoly on force; they do not accept collateral damage lightly. War involves collective conflict where "criminals" are often patriotic citizens. Police aim to arrest; armies aim to destroy capacity.
  *   **The Fatal Flaw:** Police do not bomb neighbourhoods to catch a suspect. The policing model fails to account for the scale of destruction permissible in war under *jus in bello*.

  **The Proposed Alternative: Legitimate Self-Defence against a Gang**
  A closer picture is a homeowner defending their family against a gang of intruders, where some intruders are willing leaders and others are threatened recruits.
  *   **Why it works:** It captures the asymmetry (homeowner has right, intruders do not). It captures the liability (intruders can be stopped). It captures the third-party element (defending the family).
  *   **Why it fails:** It is too individual. War is collective.
  *   **The Audit:** There is no perfect analogy because war is a unique moral catastrophe. However, the **Self-Defence** model is superior to Boxing because it acknowledges that one side is in the wrong.

  **Conclusion on the Alternative:**
  If you must choose, the Policing model is better for *leaders* (who know the cause), while the Boxing model is unfortunately necessary for *regular soldiers* purely as a legal convention to prevent endless vengeance. But morally, the Boxing model is false. It is a legal fiction designed to limit suffering, not a moral truth about equality. You should treat it as a rule of law (we won't prosecute you) rather than a rule of ethics (you did nothing wrong).

  Your scepticism is warranted. The boxing match hides the blood on the hands of the unjust aggressor by calling it a "sporting chance."
