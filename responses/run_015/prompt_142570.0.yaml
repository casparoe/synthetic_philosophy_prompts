          1.  **Independence (Substitution):** If $L \succ M$, then $\alpha L + (1-\alpha)N \succ \alpha M + (1-\alpha)N$.
          2.  **Reduction of Compound Lotteries (RCL):** A compound lottery $\langle L, p; M, 1-p \rangle$ is indifferent to its reduced form (the probability distribution over final outcomes).
      *   *The Allais Setup:*
          *   Problem 1: $A$ (1.0 of 1M) vs. $B$ (0.1 of 5M, 0.89 of 1M, 0.01 of 0).
          *   Problem 2: $C$ (0.11 of 1M, 0.89 of 0) vs. $D$ (0.10 of 5M, 0.90 of 0).
      *   *Standard Derivation:* To show the violation of Independence, we must treat $A$ as equivalent to a compound lottery that shares the 0.89 chance of 1M with $B$. Specifically, we rewrite $A$ as (0.89 of 1M, 0.11 of 1M) and $B$ as (0.89 of 1M, 0.11 of [0.1/0.11 of 5M, 0.01/0.11 of 0]). Then we "cancel" the common 0.89 branch.
      *   *The Catch:* This cancellation relies on *both* Independence *and* Reduction. If an agent cares about the *structure* of the gamble (e.g., "I hate the suspense of the 1% risk in B even if I get 1M"), they might reject Reduction.
