      *   **Research Question:** Needs to be sharp. "Does the Allais Paradox necessarily violate Independence, or does it violate Reduction of Compound Lotteries?" Better: "Is the Allais preference pattern best diagnosed as a failure of the Independence axiom or a failure of the Reduction of Compound Lotteries axiom?"
