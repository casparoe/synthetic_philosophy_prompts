              4.  Reverse impact (what the case does to the theory, incommensurability, exiting roles).
          *   Address the "what would change your mind" question (consequences vs. role sensitivity).
      *   **Tone:** Professional, analytical, nuanced, collegial.
      *   **Length:** Substantial enough to cover the complexity ("Take your time with this").

  2.  **Deconstruct the Philosophical Framework (Confucian Role Ethics):**
      *   *Core Premise:* Persons are not atomic individuals but nodes in a network of relationships (roles). Identity is constituted by these roles (father/son, ruler/minister, friend/friend).
      *   *Key Texts:* Analects, Mencius, Xunzi (implicitly).
      *   *Key Concepts:* *Li* (ritual/propriety), *Yi* (rightness/appropriateness), *Ren* (humaneness), *Zhengming* (rectification of names), *Jian* (remonstrance).
      *   *Conflict Resolution:* Not lexical ordering (rules), but contextual harmony (*He*), weighing (*Quan*).
      *   *Loyalty (*Zhong*):* Not blind obedience, but doing what is best for the role-holder and the relationship's integrity.

  3.  **Address Point 1: Thick List of Roles:**
      *   Snowden's roles: Contractor (Minister/Subordinate), Citizen (Member of Polity), Human Being (Member of Humanity), Friend/Colleague (to fellow workers), Custodian (of secrets), Whistleblower (new role?).
      *   Duty Content:
          *   Contractor/Minister: Loyalty to superior, maintaining trust, protecting state secrets.
          *   Citizen/Member: Contributing to harmony, ensuring governance is just.
          *   Human Being: *Ren* (benevolence towards affected others).
      *   Conflict: No tidy algorithm. It's about *Quan* (weighing). Which role is more fundamental in this context? The conflict isn't a bug; it's the site of ethical work.

  4.  **Address Point 2: Role Corruption & Rectification of Names (*Zhengming*):**
      *   Concept: If the name doesn't match the reality, language and order break down.
      *   Application: If "Security Agency" acts insecurely or unlawfully, is the name broken?
      *   Loyalty: Is loyalty to the *person* in charge, the *institution* as it exists, or the *ideal* of the institution? Confucianism suggests loyalty to the Way (*Dao*) of the role. If the ruler is tyrannical, the minister has a duty to correct or withdraw.
      *   Verdict: This is where the theory has traction. If the NSA violated the constitutional "name" of its operation, the duty shifts.

  5.  **Address Point 3: Remonstrance (*Jian*):**
      *   Concept: Subordinates must correct superiors to preserve the relationship's integrity. Silence is complicity.
      *   Limitation: Traditionally upward (Minister to Ruler).
      *   Snowden's Move: Sideways/Outward (to journalists/public).
      *   Analysis: Is the public the "higher" authority (the People as the source of mandate)? Or is this a breach of ritual (*Li*)? Mencius allows for revolution if the ruler becomes a "mere fellow." If internal channels fail, does the duty expand? This is the tension point. Traditional remonstrance is private/internal; public exposure is often seen as shameful to the superior. However, if the superior loses the Mandate, public action might be justified.

  6.  **Address Point 4: Reverse Impact & Exiting Roles:**
      *   Theory vs. Case: The theory predicts the incommensurability (oath vs. conscience).
      *   Exiting Roles: Can one exit roles? In Confucianism, roles are often inescapable (you are always a son). But political roles can be severed (exile, resignation).
      *   The Moscow Moment: If he exits the role of contractor, is he still bound? Role ethics says past relationships leave traces (*Yi*). But if he is stateless/stranded, is he still a "citizen"?
      *   Verdict: The theory struggles with the "exit" moment because it assumes embeddedness. It might view his stranded state as a moral loss, not a liberation.

  7.  **Address "What Would Change Your Mind":**
      *   Consequences: Confucianism is not purely deontological or utilitarian. It's virtue/consequence-sensitive via *Yi* (appropriateness).
      *   Death vs. Ignored Channels: If people died, the *Ren* (humaneness) role weighs heavier. If ignored, the *Jian* (remonstrance) duty expands.
      *   Sensitivity: The theory isn't insensitive to consequences, but evaluates them through the lens of relational harm/harmony, not just body counts.

  8.  **Drafting - Section by Section (Mental Outline):**
