      *   *Roles:* List them thickly. Contractor, citizen, human, friend. Explain the weighing process (*Quan*).
      *   *Corruption/Rectification:* Discuss *Zhengming*. Loyalty to the Dao of the office, not the incumbent.
      *   *Remonstrance:* Upward vs. Public. The risk of shaming the superior vs. saving the polity.
      *   *Reverse Impact/Exit:* The problem of exiting roles. The theory prefers harmony over heroic exit.
      *   *Consequences:* How *Yi* handles consequences.
      *   *Closing:* Final thought on the utility of this lens.

  9.  **Refining Constraints:**
