  *Wait, one nuance on Claim 4 (Group Reproduction).* If clusters don't have children, "Group Selection" in the strong sense (Claim 4) is impossible in the user's standard CRT framework. I must emphasize this. In CRTs, clusters are fixed. In evolution, clusters (patches) go extinct and are *replaced* by offspring clusters. This is a meta-population dynamic.

