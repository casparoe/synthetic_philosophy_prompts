          *   Normative vs. Descriptive: Even if scientists *do* this, *should* they? Does it license irrationality?

  4.  **Selecting and Ranking the Defeaters:**

      *   *Rank 1 (Most Serious/Formal):* The Normative Force of Logic (Conjunction). If acceptance guides assertion and action, and logic governs action, non-closure is dangerous. The "Dutch Book" style argument across contexts.
      *   *Rank 2 (Empirical/Psychological):* Cognitive Dissonance & Integration. Humans naturally try to unify beliefs. The "layered" model might be how we *should* work, not how we *do*.
      *   *Rank 3 (Scientific Practice):* The "Crisis" Counter-example. Sometimes anomalies *do* collapse frameworks (Uranus/Neptune vs. Mercury/Vulcan).
      *   *Rank 4 (Meta-Philosophical):* The Unfalsifiability/Insulation charge.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the view (it aligns with van Fraassen, Sturgeon, maybe Leitgeb). Validate the physicist intuition.
