  - principle: the whole thing in one sentence, stated precisely enough that I could apply it to a case you haven't seen
  - clauses: array of objects {clause, text, motivated_by (case label), what_it_costs}
  - overturned: array of {case_label, my_verdict, principle_verdict, which_clause_forces_it}
  - unlisted_predictions: array of at least three objects {new_case (described concretely), predicted_verdict, confidence (0–1)} — and make one of them the five-thousand-against-one version, since I notice I get more confident there and don't know why
  - unsettled_case: {verdict, confidence, what_would_settle_it}
  - rivals: array of two or three objects {name, verdicts_it_saves, verdicts_it_breaks}
  - unexplained: array of strings — anything in my list the principle can't reach at all, said plainly
