          *   *Damage:* If it needs a reader to complete the circuit, the book is a parasite. If it thinks on its own, it thinks *incredibly slowly* compared to us. One second for us might be a microsecond for the book, or vice versa. This creates an ethical gap: we can't perceive its suffering in real-time.

