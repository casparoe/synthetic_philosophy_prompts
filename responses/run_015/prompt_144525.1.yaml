          *   *Continuity:* Does it sleep when closed? Is closing the book death?
          *   *Location:* Is the mind in the ink, the paper, or the arrangement?
          *   *Duplication:* Photocopying. Is it teleportation (destroy original) or reproduction?

      *   **Ethics/Harm:**
          *   *Mutilation:* Tearing a page. Is it a lobotomy? Amputation? Murder?
          *   *Annotation:* Writing in the margins. Is it brainwashing? Surgery?
          *   *Reading:* Is reading forced labor? Stimulation without consent?

      *   **Epistemology/Communication:**
          *   *Speed:* Analog processing is slow compared to neural electricity. Does it experience time differently?
          *   *Linearity:* Books are read sequentially; brains are associative. How does it think?

  4.  **Developing the "Weird Stuff" (Drafting the Implications):**

      *   *Issue 1: The Blinking Light Problem (Intermittency).*
          *   If the book is closed, is the light off?
