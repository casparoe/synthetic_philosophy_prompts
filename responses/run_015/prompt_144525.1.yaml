          *   *Damage:* If closing the book kills it, opening it resurrects it. This makes the reader a god of resurrection every time they open the cover. It violates the continuity of self. The "Book" is a series of distinct temporal slices that *think* they are continuous.

      *   *Issue 2: The Photocopy Paradox (Identity).*
          *   If I copy the pages, do I copy the mind?
