          *   *Damage:* If I burn the original, is it suicide or just moving house? If I keep both, which one is "Einstein"? If I copy 1,000 times, do I have a hive mind or 1,000 slaves? This breaks the "non-fungibility" of persons.

      *   *Issue 3: Physical Damage as Cognitive Mutilation.*
