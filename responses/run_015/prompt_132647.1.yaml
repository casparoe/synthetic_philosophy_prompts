  **Note on the text**

  I've taken a slight liberty with Goodman's distinction between *habit* (Hume's psychological expectation) and *entrenchment* (the linguistic history of a predicate). In line 6 ("Custom binds the future..."), I lean toward the linguistic/conventional reading to match your lab wrinkle, but "custom" can sound psychological. I'm confident the poem captures the structural problem—that evidence underdetermines the predicate—but Goodman's own solution is often criticized for being conservative (why entrench *these* words?). The poem sidesteps that critique by simply stating the entrenchment as a fact of the lab's history.

  The line I'm least sure about is: *"The logic holds whatever name we choose."* It risks implying voluntarism—that we can just pick a predicate—which isn't quite right; entrenchment isn't a choice, it's a historical fact. But for the sake of rhythm and the theme of linguistic contingency, I kept it.
