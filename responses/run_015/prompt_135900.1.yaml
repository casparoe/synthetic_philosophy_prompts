answer: |-
  1. **Room map**
  The mainstreamers will treat Step 1 (complexity penalties) as standard Solomonoff prior machinery and grant it without comment. They will resist Step 2 (conjecture mugger) because it challenges their commitment to logical omniscience as a harmless idealization; they will view this as mere computational limitation, not a foundational break. Step 3 is the kill zone: claiming credences aren't probabilities violates the coherence norms they hold dear. They view Pascal's mugging as solved by bounded utility; you must show bounded utility doesn't touch logical risk. The economists will pivot to ambiguity aversion. The ML person will understand logical induction but stay silent. You must frame logical uncertainty not as "ignorance" but as "unsettledness," or they will dismiss it as subjective confidence. They expect a solution; you are offering a impossibility result for standard tools.

  2. **Objections, most to least damaging**

  1.  **The Bayesian Purist (Senior Epistemologist):** "If you're uncertain, you have a credence. If it violates axioms, you're Dutch-bookable. Are you rejecting Bayesianism entirely?"
      *   *Reply:* "I'm rejecting the assumption that logical facts behave like contingent events *before* proof. Logical induction avoids Dutch books asymptotically, not instantly. Rationality requires computational feasibility, not just axiomatic purity."
      *   *Soft:* They value axiomatic purity highly; asymptotics don't help *now*.
  2.  **The Bounded Utility Fan (Decision Theorist):** "Cap utility at 10^100. Problem gone. Why complicate it?"
      *   *Reply:* "Bounding utility handles empirical magnitudes. It doesn't generate a probability for 'ZFC proves P.' If the probability input is undefined because the fact is logically unsettled for you, expected utility is undefined regardless of the utility cap. You can't multiply a number by a non-number."
      *   *Soft:* Assumes they accept probability is undefined.
  3.  **The Idealization Defender (Mainstream):** "Logical omniscience is like frictionless planes. A useful fiction. Why does the idealization break here?"
      *   *Reply:* "Frictionless planes don't change the direction of motion. Logical omniscience changes whether expected value exists at all. It's not a smoothing error; it's a category error."
      *   *Soft:* Analogy might not stick against entrenched modeling habits.
  4.  **The Economist:** "Use ambiguity aversion (MaxMin). Treat the logical claim as an unknown distribution. Don't need logical induction."
      *   *Reply:* "Ambiguity aversion presupposes a state space. Logical uncertainty lacks a coherent state space partition because the truths aren't contingent states."
      *   *Soft:* Technically dense; easy to talk over.
  5.  **The Pragmatist:** "Okay, but do you pay the dollar? If yes, your theory matches EU. If no, you're just risk-averse."
      *   *Reply:* "No, because the logical market price is low, not because probability is zero. But that price isn't a probability measure. It's a betting quotient under bounds."
      *   *Soft:* Sounds like semantics to non-technical audience.
  6.  **The Complexity Theorist:** "Kolmogorov complexity is uncomputable. Your prior is undefined."
      *   *Reply:* "We use bounded complexity, approximated by the code length provided. The mugger hands you the short code; the complexity is explicit."
      *   *Soft:* Approximation errors matter in edge cases.
  7.  **The Proof Checker:** "You said the code is inspectable. So the truth value is fixed. Where is the uncertainty?"
      *   *Reply:* "Truth is fixed, accessibility isn't. Decision theory needs accessibility. You cannot condition on what you cannot compute."
      *   *Soft:* Blurs ontology and epistemology.
  8.  **The History Buff:** "This is just old Knightian uncertainty rehashed. What's new?"
      *   *Reply:* "Knight was about empirical unknowns. This is about mathematical truths that are objectively fixed but computationally inaccessible. It's structural, not empirical."
      *   *Soft:* Hard to distinguish clearly in Q&A.

  3. **Concede up front**
  Concede that logical omniscience is a perfectly fine regulative ideal for standard epistemology and that bounded utility functions successfully neutralize *empirical* Pascal's muggings. Acknowledge that logical induction is technically incomplete and lacks a full decision-theoretic integration. By granting these, you prevent the audience from fighting old wars. You signal that you aren't trying to burn down Bayesianism everywhere, only where computational bounds interact with logical stakes. This makes you look reasonable rather than revolutionary, reserving their energy for the specific claim that logical uncertainty creates a distinct structural problem that standard tools cannot patch.

  4. **The reply that has to land**
  The crucial move is distinguishing between uncertainty about *which world obtains* and uncertainty about *what follows from the facts*. Standard Bayesianism sums over worlds. Logical uncertainty means the sum itself is ill-defined because the partition isn't computable. You must land the point that no prior over worlds can assign a number to "ZFC proves P" without implicitly solving the proof. Therefore, the input to expected utility theory is missing, not just the output. If they grant that the probability input is structurally unavailable, bounded utility becomes irrelevant.

  5. **The question I'm hoping nobody asks**
  "What is the positive theory? What algorithm do you actually run to decide?" This is the trap. There is no settled theory of logical induction decision theory. If you promise one, you overclaim. If you admit you don't have one, you look destructive.
  *Response:* "I am diagnosing the failure of EU, not prescribing the replacement. The prescription requires a theory of bounded rationality we don't have yet. My claim is negative: standard tools break. Demanding a full replacement now is like demanding quantum gravity to explain why Newtonian physics fails at the singularity. First, acknowledge the singularity." This manages expectations and frames the talk as an impossibility result rather than an unfinished solution.
