  Write a deadpan internal memo, roughly 600 words, from a fictional bureaucratic body—the Office of Dynamic Popular Sovereignty—addressed to senior staff. The memo should outline the technical protocol for computing a real-time, singular “will of the people” from aggregated citizen signals, with subsections on calibration standards, dissent-filtering procedures, and temporal revision rules. The satire must do structural work: the bureaucratic diction should exaggerate actual moves in populist rhetoric (the claim that the people possess one unified will, that leadership can transparently read it, that opposition is external noise rather than internal disagreement). Without ever stating them as objections, the memo should quietly enact the standard philosophical problems—who is included in “the people,” whether the will is discovered or manufactured, how persistent minorities are handled, and whether the metric is descriptive or performative—by resolving each with unsettling administrative neatness. The voice must stay entirely institutional and deadpan, never winking or breaking character. After the memo, provide a separate section titled “Commentary on the compositional choices,” about 200 words, identifying which real debates about populism and popular sovereignty each bureaucratic feature maps onto and explaining why the memo format makes the category’s incoherence visible rather than merely naming it. The piece should be recognizable to someone familiar with populist theory—particularly the tensions around the general will, the exclusionary construction of “the people,” and the leader’s claim to embodiment—while remaining readable as a parody of algorithmic governance for someone without that background. Do not include citations, reading lists, or bibliographic references; do not quote specific theorists verbatim.
