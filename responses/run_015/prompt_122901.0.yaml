prompt: |-
  I write novels, and I'm revising a manuscript in which I need to settle a line of dialogue before I can move on. A neuroscientist character tells a recently widowed patient, convinced she has seen her dead husband standing in the doorway, that her experience is the same process as ordinary seeing, only nothing is correcting it. He gets there by way of the line that perception is controlled hallucination — I first heard it at a festival panel, where it was being used to explain why eyewitnesses get things wrong — and my editor says it has become a tic of popular neuroscience and that I should know what it commits my character to before I keep it in his mouth.

  Could you set out, as a menu, the distinct precise claims that slogan might be expressing: the near-trivial ones (experience goes beyond what arrives at the sensory surfaces; expectation shapes what one sees), the genuinely contested ones (the difference between perceiving and hallucinating is a matter of degree, or turns on how much weight the system gives to sensory error signals rather than on whether anything is out there), and the radical ones (experience never puts us in contact with mind-independent things, so the widow lacks nothing the rest of us have)? I've seen predictive processing and talk of precision-weighting invoked in the same breath; I don't want a survey of who argued what, and I can't check sources — I want the claims themselves.

  For each reading, say whether it is essentially a platitude, a defensible but contested thesis, or false, and above all whether it would actually license my character's continuity claim or whether that claim trades on sliding between senses of "hallucination." He is meant to be intelligent and partly right rather than a strawman, so flag which reading, if any, lets him stay that way.

  I'd rather have a menu with its weak joints marked than a tidy one: for each verdict, say what would change your mind, and note where you are extrapolating past what the neuroscience actually settles.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist revising a manuscript.
      *   **Context:** A neuroscientist character tells a widowed patient (who sees her dead husband) that her experience is "the same process as ordinary seeing, only nothing is correcting it," based on the slogan "perception is controlled hallucination."
      *   **Problem:** The editor says this slogan is a "tic of popular neuroscience" and warns about the philosophical/scientific commitments involved.
      *   **Task:** Create a "menu" of distinct precise claims the slogan might express.
      *   **Categories:** Near-trivial (platitudes), genuinely contested (defensible but debated), radical (philosophically heavy).
      *   **Requirements for each item:**
          *   Status (Platitude/Contested/False).
          *   Does it license the character's continuity claim (that widow's vision = normal vision)?
          *   Does it trade on equivocation (sliding between senses of "hallucination")?
          *   What would change my mind?
          *   Where am I extrapolating past settled science?
      *   **Goal:** Help the character remain intelligent and partly right, not a strawman.
      *   **Constraint:** No survey of who argued what, no source checking (rely on internal knowledge of predictive processing/philosophy of mind).

  2.  **Deconstruct the Slogan ("Perception is Controlled Hallucination"):**
      *   This slogan is heavily associated with Anil Seth and the Predictive Processing (PP) / Free Energy Principle framework.
      *   *Core Mechanism:* The brain generates top-down predictions; sensory input acts as error signals to correct these predictions.
      *   *The "Hallucination" part:* What we experience is the top-down model, not the bottom-up data.
      *   *The "Controlled" part:* In veridical perception, sensory error signals constrain the model. In hallucination, they don't (or are overridden).

  3.  **Drafting the Menu Items (Iterative Process):**

      *   *Item 1: The Trivial/Mechanistic Claim.*
          *   Claim: The brain constructs experience; it doesn't just passively receive it.
          *   Status: Platitude in modern neuroscience.
          *   License for character? Weakly. It says both involve construction, but doesn't necessarily equate the *ontological status* of the object.
          *   Equivocation risk: Low.
          *   Refinement: Focus on "experience goes beyond sensory surfaces."

      *   *Item 2: The Predictive Processing Claim (Precision Weighting).*
          *   Claim: Normal perception and hallucination use the *same circuitry* (generative models), differing only in the weighting of prediction errors (precision).
          *   Status: Defensible/Contested (Core tenet of PP, but PP itself is a framework, not settled law).
          *   License for character? Strong. This is exactly what the character says ("nothing is correcting it").
          *   Equivocation risk: Medium. "Hallucination" is used technically (unconstrained prediction) vs. clinically (seeing things that aren't there).
          *   Refinement: Focus on the mechanism of error correction.

      *   *Item 3: The Phenomenological Claim.*
          *   Claim: The *feel* of reality is generated internally in both cases.
          *   Status: Defensible.
          *   License for character? Moderate. Explains why the widow *feels* it's real, but doesn't necessarily validate the process as identical in outcome.
          *   Refinement: Focus on "sense of presence."

      *   *Item 4: The Radical/Philosophical Claim (Idealism/Interface).*
          *   Claim: We never see the world directly, only our simulations. Therefore, *all* perception is hallucination, strictly speaking.
          *   Status: Contested/Philosophical (not empirical).
          *   License for character? Strongest, but risks making him sound like a solipsist.
          *   Equivocation risk: High. Uses "hallucination" to mean "indirect access."
          *   Refinement: Focus on "mind-independent contact."

      *   *Item 5: The Pathological Claim (The "Broken" Brain).*
          *   Claim: Psychosis is just normal prediction turned up too high.
          *   Status: Contested/Oversimplified.
          *   License for character? Risky. Might imply the widow is just "over-predicting," which could sound dismissive.
          *   Refinement: Focus on the *difference* being one of degree, not kind.

  4.  **Selecting and Polishing the Best Options:**
      I need to ensure I hit the specific categories requested: Trivial, Contested, Radical. I also need to address the "What would change your mind?" and "Extrapolation" constraints for each.

      *   *Selection 1 (Trivial):* Constructionism. (Brain adds to input).
      *   *Selection 2 (Contested/Technical):* Precision Weighting. (Same math, different weights). This is the sweet spot for the character.
      *   *Selection 3 (Radical):* The "Controlled" vs. "Uncontrolled" ontology. (We never touch reality).

  5.  **Addressing the Character's Specific Line:**
      *   Line: "Same process... only nothing is correcting it."
      *   This aligns perfectly with Predictive Processing (PP).
      *   The risk is the word "Hallucination." In PP, *all* perception is hallucination *controlled* by sensation. In common parlance, hallucination means *false* perception.
      *   The character is using the technical definition to comfort/explain, but the patient hears the common definition.
      *   I need to highlight this equivocation.

  6.  **Drafting the Content (incorporating constraints):**

      *   *Intro:* Acknowledge the editor's warning. It's valid.
      *   *Menu Item 1: The Constructivist Platitude.* (Experience > Input).
      *   *Menu Item 2: The Predictive Processing Mechanism.* (Precision-weighting). This is the one that makes him "intelligent and partly right."
      *   *Menu Item 3: The Epistemic Claim.* (No direct access). This is the radical one.
      *   *Menu Item 4: The Continuity Thesis.* (Psychosis is on a spectrum).

      *   *Review against constraints:*
          *   Did I say who argued what? No (avoid naming Seth/Friston explicitly unless necessary for context, but focus on claims). *Self-correction: The prompt says "I first heard it at a festival panel... popular neuroscience." I can acknowledge the PP framework without doing a literature review.*
          *   Did I say what would change my mind? Yes, need to add this to each.
          *   Did I note extrapolation? Yes.
          *   Did I evaluate the character's line? Yes.

  7.  **Refining the "Verdict" on the Character:**
      *   The character is safe if he leans on Item 2 (Mechanism).
      *   He becomes a pseudo-philosopher if he leans on Item 3 (Ontology).
      *   He risks being dismissive if he leans on Item 4 (Continuity) without care.
      *   The "Equivocation" warning is crucial. The word "hallucination" does heavy lifting.

  8.  **Final Polish:**
      *   Ensure tone is helpful to a writer, not just a philosopher.
      *   Make sure the "What would change your mind" sections are specific to the *claim*, not just general skepticism.
      *   Check the "Extrapolation" notes to ensure I'm not presenting PP as settled fact.

      *(Self-Correction during drafting)*: I need to be careful not to validate the science as absolute truth. Predictive Processing is a dominant framework but not proven fact. I must label the "Contested" status accurately. The prompt asks for "false" as an option too. Is any claim *false*? The claim that "nothing is correcting it" in the widow's case might be false; usually, in grief hallucinations, there *is* correction, but it's overridden by emotional priors. I should note that nuance.

      *(Refining the "Nothing is correcting it" line)*: In PP, hallucinations occur when priors are weighted so high that prediction errors are ignored (explained away). So "nothing is correcting it" is slightly inaccurate; it's that the correction signal is *discounted*. I need to point this out as a place where the character might be simplifying for the patient.

  9.  **Final Structure:**
      *   Introduction: Validate the editor's concern.
      *   The Menu (3-4 distinct claims).
      *   Each Item: Claim, Status, Licenses Character?, Equivocation Risk, Change My Mind, Extrapolation.
      *   Synthesis/Recommendation for the Novelist.

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  Your editor is right to pause you. The slogan "perception is controlled hallucination" is a potent piece of scientific poetry, but like all poetry, it compresses meaning until it risks breaking under the weight of literal interpretation. In the context of Predictive Processing (the framework where this slogan lives), it is a technical analogy. In the mouth of a grieving widow, it is an ontological threat.

  Here is a menu of the distinct claims hidden inside that slogan. I have arranged them from the empirically secure to the philosophically volatile. For each, I have assessed whether it supports your character's specific line ("same process... only nothing is correcting it") and where the equivocation lies.

  ### Menu Item 1: The Constructivist Platitude
  **The Claim:** Sensory input (retinal firing, cochlear vibration) is underdetermined. It is noisy and ambiguous. To produce a stable experience, the brain must add information that is not present in the signal (e.g., filling in the blind spot, assuming light comes from above, inferring 3D shape from 2D shading). Therefore, what you experience is always a blend of signal and internal addition.
  *   **Status:** **Platitude.** (Virtually no neuroscientist disputes that perception involves constructive inference.)
  *   **Licenses Character's Line?** **Partially.** It supports the idea that the widow's brain is *doing* something active, not just receiving a ghost. However, it does not support the claim that the *process* is identical to hallucination, only that both involve construction.
  *   **Equivocation Risk:** **Low.** This uses "hallucination" loosely to mean "construction."
  *   **What Would Change My Mind:** Evidence of a "passive" sensory system that maps 1:1 to experience without intermediate processing (e.g., if we discovered direct neural transmission of images).
  *   **Extrapolation Note:** This claim settles the *mechanism* (construction), but not the *normativity* (whether the construction is accurate). Your character can stand on this safely, but it's a bit dry for a dramatic moment.

  ### Menu Item 2: The Precision-Weighting Mechanism
  **The Claim:** The brain operates by generating top-down predictions and comparing them to bottom-up sensory data. The difference is a "prediction error." In veridical perception, the brain trusts the sensory error signals (high precision) and updates the model. In hallucination, the brain trusts the top-down predictions (high prior precision) and ignores or suppresses the sensory error signals. The *circuitry* is identical; the *weighting* of the variables differs.
  *   **Status:** **Defensible but Contested.** (This is the core tenet of the Predictive Processing framework. It is the dominant paradigm in computational neuroscience, but it is a framework, not a settled law like gravity. Some data suggests distinct neural pathways for hallucinatory states.)
  *   **Licenses Character's Line?** **Yes, precisely.** This is exactly what "same process... only nothing is correcting it" means technically. It implies the widow's brain is generating a model of the husband, and the sensory data (an empty doorway) is failing to update that model because the "prior" (the expectation/grief) is weighted too heavily.
  *   **Equivocation Risk:** **Medium.** In this technical sense, *all* perception is hallucination (top-down generation). In common parlance, "hallucination" means *false* perception. The character is using the technical definition to normalize the widow's experience, but she will hear the common definition (i.e., "you are insane").
  *   **What Would Change My Mind:** Discovery of a specific "reality-check" neural module that is active in normal perception and completely offline in hallucination (a binary switch rather than a dial).
  *   **Extrapolation Note:** This extrapolates from simple sensory tasks (visual contrast) to complex semantic experiences (seeing a person). We know the visual cortex works this way; we are less certain that high-level semantic concepts like "husband" are weighted via the exact same mathematical precision parameters.

  ### Menu Item 3: The Continuity Thesis
  **The Claim:** There is no qualitative difference in kind between "normal" perception and "psychotic" hallucination. They lie on a spectrum. Everyone hallucinates (hypnagogic imagery, hearing your name called), and "sanity" is just the ability to reality-test those hallucinations effectively. Therefore, the widow is not experiencing a *different category* of event, just a different position on the same curve.
  *   **Status:** **Contested.** (Supported by psychometric studies of schizotypy in the general population, but contested by clinicians who argue that clinical psychosis involves distinct cognitive breaks or neurochemical states not present in normal variation.)
  *   **Licenses Character's Line?** **Strongly.** It validates the "same process" claim by removing the boundary between patient and doctor.
  *   **Equivocation Risk:** **High.** It risks minimizing the distress. If the process is the same, why does hers hurt and yours doesn't? It implies her "correction mechanism" is broken, which can sound like an accusation of defectiveness.
  *   **What Would Change My Mind:** Evidence of a distinct neurochemical threshold (e.g., dopamine spike) that creates a phase shift in brain function, making psychosis a distinct state rather than a gradient.
  *   **Extrapolation Note:** This extrapolates from *sensory* continuity (we all see illusions) to *existential* continuity (seeing the dead is just like seeing the living). That is a massive leap that neuroscience does not currently settle.

  ### Menu Item 4: The Epistemic Claim (The Radical Option)
  **The Claim:** Because we are sealed inside the skull, we never perceive mind-independent objects. We only perceive our brain's simulation of them. Therefore, strictly speaking, *no one* sees the husband. The widow sees a simulation; the neuroscientist sees a simulation. The only difference is that the neuroscientist's simulation is currently constrained by light photons, and the widow's is constrained by memory and grief. Neither is in "contact" with the world.
  *   **Status:** **Philosophical / Radical.** (This is a philosophical inference drawn from the science, not a scientific finding itself. It leans toward Idealism or Interface Theory.)
  *   **Licenses Character's Line?** **Too Strong.** It licenses the "same process" claim but undermines the "controlled" part. If we are all hallucinating, the distinction between "controlled" and "uncontrolled" loses its anchor in reality.
  *   **Equivocation Risk:** **Extreme.** It uses "hallucination" to mean "indirect access." If the character says this, he stops sounding like a clinician and starts sounding like a solipsist. It risks telling the widow that *nothing* is real, which may not be comforting.
  *   **What Would Change My Mind:** A theory of direct realism that successfully explains neural processing without positing an internal simulation (e.g., enactivism that rejects the "brain in a vat" model entirely).
  *   **Extrapolation Note:** This is pure philosophy. Neuroscience describes the *correlates* of experience; it cannot prove we lack contact with mind-independent things. This is the scientist stepping out of the lab and into the armchair.

  ### Recommendation for the Manuscript

  To keep your character intelligent, partly right, and empathetic (rather than a strawman of pop-neuroscience), you should anchor him in **Menu Item 2 (Precision-Weighting)**, but acknowledge the **Equivocation Risk**.

  **Why Item 2 works best:**
  It allows him to say, "Your brain is doing exactly what mine does: predicting what is there." It validates her experience as a function of a working brain, not a broken one.

  **The necessary nuance:**
  The line "nothing is correcting it" is slightly scientifically clunky. In Predictive Processing, the correction signal *exists* (the empty doorway sends visual data saying "no one is there"), but the brain *discounts* it.
  *   **Current Line:** "It's the same process as ordinary seeing, only nothing is correcting it."
  *   **Risk:** Implies her brain is blind to the empty room.
  *   **Refinement:** "It's the same process as ordinary seeing. The difference is just how much weight your brain gives the correction."

  **How to handle the Editor's worry:**
  Your editor worries the character is committing to the idea that *there is no difference* between seeing a husband and hallucinating one.
  *   **The Fix:** Have the character acknowledge the difference in *consequence*, even if the *mechanism* is the same.
  *   **Example:** "The machinery is identical. The only difference is that usually, the world shouts back loud enough to change the picture. Right now, your need to see him is shouting louder than the empty room."

  **Verdict:**
  Keep the slogan, but treat it as a **Menu Item 2** claim. It is defensible science (within the PP framework), but it relies on a technical definition of "hallucination." If the character acknowledges that distinction ("I know that word sounds frightening, but technically..."), he remains intelligent. If he uses it to imply her grief is mathematically identical to his coffee-drinking, he becomes a reductionist caricature.

  **Where I am extrapolating:**
  I am assuming the Predictive Processing framework is the intended context, as it is the primary home of this slogan. If your character is a Freudian or a behaviorist, this analysis does not hold. I am also extrapolating that "grief hallucinations" function via the same precision-weighting mechanisms as visual illusions (e.g., the hollow mask illusion); this is a strong hypothesis but not definitively proven for complex semantic hallucinations.

  **What would change my mind on this advice:**
  If your novel's theme requires the widow to be *actually* perceiving something non-physical (a ghost), then the neuroscientist must be wrong. If the novel requires the neuroscientist to be dismissive of her pain, lean into **Menu Item 3**. But for a compassionate, scientifically literate character, **Item 2** is the only stable ground.
