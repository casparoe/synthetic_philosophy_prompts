answer: |-
  Take a breath. You are describing a classic philosophical stalemate, but your intuition is sharp: this is not an empirical deadlock, it is a **category error fueled by a normative clash**. The reason nobody is budging is that the two sides are playing different games but keeping score on the same scoreboard.

  Here is the breakdown of the disagreement structure, an evaluation of the "mnemonic jurisdiction" hypothesis, and a proposal for what actual progress looks like in this seminar.

  ### 1. Brainstorming the Disagreement Structure

  Let's strip away the specific case (the factory) and look at the logical form of the arguments being exchanged.

  *   **Factual Disagreement:** *Did the strike happen?*
      *   **Status:** Resolved (by your account). Both sides accept the payroll records show a lockout.
      *   **Verdict:** This is a red herring. The Historians act as if this is the core issue; the Memory theorists act as if it's irrelevant. This mismatch is the first source of friction.

  *   **Conceptual Disagreement:** *What is the definition of "History"?*
      *   **Historians:** History is a truth-tracking epistemic practice. Its primary virtue is *accuracy* (correspondence to evidence).
      *   **Memory Theorists:** History (in this context) is a social practice. Its primary virtue is *utility* (cohesion, identity, resilience).
      *   **Verdict:** This is a major driver. They are using the same word ("History/The Past") to refer to two different objects (The Event-as-It-Was vs. The Event-as-It-Functions).

  *   **Normative Disagreement:** *What is the ethical obligation regarding the past?*
      *   **Historians:** We have a duty to the *dead/truth* to prevent falsehoods. "False consciousness" is a harm.
      *   **Memory Theorists:** We have a duty to the *living/community* to preserve agency. "Correction" is a harm (epistemic violence).
      *   **Verdict:** This is the engine of the deadlock. One side prioritizes *Epistemic Justice* (getting it right); the other prioritizes *Hermeneutical Justice* (allowing the community to make sense of their world).

  *   **Bedrock Intuition:** *Who owns the past?*
      *   **Historians:** The past belongs to reality/evidence. No one "owns" it; we are all subject to it.
      *   **Memory Theorists:** The past belongs to those who inherit its consequences.
      *   **Verdict:** This is the unarguable foundation. You cannot prove who owns the past empirically.

  **Diagnosis:** The deadlock is happening because **each side starts from a different normative intuition about the purpose of engaging with the past, but they are fighting on the terrain of factual accuracy.** The Historians are treating a functional narrative as a failed hypothesis. The Memory Theorists are treating an epistemic claim as a political attack.

  ### 2. Is it a Hidden Empirical Question?

  You asked: *Is this deadlock happening because there's a hidden empirical question we're avoiding, like whether correcting collective memory actually damages social cohesion in a measurable way?*

  **No.** Even if you commissioned a sociological study tomorrow that proved "Correcting the memory destroys community cohesion," the Historians would reply: *"Then the cohesion is built on a lie, and it is morally fragile."*
  Conversely, if the study proved "Correcting the memory has no negative effect," the Memory Theorists would reply: *"Then the correction is an unnecessary exercise of power."*

  Empirical data cannot resolve a conflict between **Truth** (as correspondence) and **Validity** (as social function). This is not a gap in knowledge; it is a clash of values.

  ### 3. Is it About "Ownership" of the Past?

  You asked: *Is it that each side starts from an intuition about who "owns" the past—the living community or the dead record—that neither can argue for?*

  **Yes, but with a caveat.** It is not just ownership; it is **authority**.
  *   The Historians derive authority from **Method** (archives, cross-referencing, neutrality).
  *   The Memory Theorists derive authority from **Experience** (lived consequence, intergenerational transmission).

  The stall occurs because Method claims to be universal (applicable to everyone), while Experience claims to be local (applicable only to the community). When Method tries to adjudicate Experience, it looks like colonialism. When Experience tries to adjudicate Method, it looks like anti-intellectualism.

  ### 4. Evaluating "Mnemonic Jurisdiction"

  Your classmate's idea: *Different social groups have authority over different domains... asking "which one is true" is like asking whether physics or poetry has jurisdiction over a sunset.*

  **Does this break the stall?**
  It is a sophisticated relabeling, but it risks being a "peace treaty" that satisfies no one. Here is the philosophical critique:

  1.  **The Overlap Problem:** Physics and poetry describe a sunset in non-competing ways. But History and Memory *are* competing here. The community is making a claim about *causality* (we struck) and *agency* (we were crushed). The archives make a rival claim about causality (lockout) and agency (management acted). These are not poetry; they are competing explanations of material events. You cannot simply say "both are true" because they contradict on the level of mechanism.
  2.  **The Relativism Trap:** If you grant full jurisdiction to the community, you lose the ability to critique harmful myths (e.g., if the myth was "we lost because of an external enemy" leading to xenophobia). If you grant full jurisdiction to the archives, you validate the "victor's history" problem.

  **How to make it work:**
  "Mnemonic Jurisdiction" works only if you reframe it not as **Ontological Jurisdiction** (what *is* the past) but as **Discursive Jurisdiction** (what *work* is this sentence doing?).
  *   When the Historian says "It was a lockout," they are making an **Epistemic Claim**.
  *   When the Worker says "It was a strike," they are making a **Performative Commitment** (i.e., "We are the kind of people who strike").

  The deadlock breaks when you realize the Worker is not trying to win an epistemic argument; they are sustaining a social bond. The Historian is failing to see the speech act.

  ### 5. What Counts as Progress?

  Do not aim for a resolution where one side wins. Aim for a **reframing of the relationship**. Here are three concrete moves your seminar can make to progress:

  **A. Shift from "Correction" to "Explanation"**
  Instead of asking "Which story is true?", ask "Why is the 'Strike' narrative the one that survived?"
  *   *Progress:* The Historians get to use the archives to explain *why* the memory diverged from the record (e.g., "The lockout felt like a strike because the workers were organized to strike, even if management moved first").
  *   *Result:* The archive is used to analyze the memory, not erase it. The memory becomes a historical object itself.

  **B. Distinguish "Event" from "Experience"**
  Adopt a distinction (common in phenomenology and trauma studies) between the *historical event* (the payroll records) and the *lived experience* (the feeling of being crushed).
  *   *Progress:* Acknowledge that a lockout *experienced* as a defeat of worker agency is functionally identical to a strike *crushed*. The material outcome (job loss, powerlessness) is the same.
  *   *Result:* The Historians concede the *material reality* of the loss; the Memory Theorists concede the *technical mechanism* of the closure.

  **C. Introduce "Epistemic Costs"**
  Stop treating "Truth" as a binary. Treat it as a budget.
  *   *Progress:* Ask: "What is the cost of maintaining the Strike myth?" and "What is the cost of enforcing the Lockout fact?"
  *   *Result:* This moves the debate to the Normative level where it belongs. Maybe the myth is necessary for current union organizing. Maybe the fact is necessary for legal reparations. You negotiate the *use* of the past, not the *reality* of the past.

  ### Summary Recommendation for the Seminar

  Tell your group this: **You are trying to solve a normative conflict with epistemic tools.**

  1.  **Acknowledge the Category Error:** The Historians are treating a *myth* (in the Sorelian sense of a mobilizing narrative) as a *hypothesis*. It is not a failed hypothesis; it is a successful myth.
  2.  **Reject "Mnemonic Jurisdiction" as Separation:** Do not separate the domains completely. Instead, analyze the **tension** between them. The friction *is* the data. Why does the community *need* this to be a strike? That need is historically significant.
  3.  **The Path Forward:** The most productive philosophical move is to treat the **Collective Memory as a Primary Source**.
      *   Don't ask: "Is the memory true?"
      *   Ask: "What does the *existence* of this memory tell us about the post-1970s social landscape that the payroll records cannot?"

  If you can shift the seminar from **"Adjudicating Truth"** to **"Analyzing the Function of Truth-Claims,"** the deadlock will dissolve. You stop fighting over the territory and start mapping the border.
