          *   Identify real tensions, propose least costly revisions, and specify costs.
          *   Address specific questions: (a) vs (c), (b) vs (a), (d) vs (e).
          *   Rank tensions by severity.
          *   Identify the single revision resolving the most conflicts.
          *   Be precise about vocabulary usage.
          *   Tone: Professional, rigorous, step-by-step.

  2.  **Deconstruct the Commitments:**
      *   *(a) Functionalist Suffering:* Suffering = sustained negative reward + integrated temporal processing + self-model binding reward across episodes. (Condition for harm).
