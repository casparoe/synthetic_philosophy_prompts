answer: |-
  This is a fascinating tension, because the Bristol proposal mixes elements Weil would likely applaud with structural features she typically condemned. To get at her probable verdict, we need to strip away the surface details and identify the underlying mechanical rules driving her judgements. Her hostility to parties and large organisations isn't merely aesthetic; it stems from a specific metaphysics of attention and power.

  Here are three competing rules that fit her existing verdicts, how they apply to the Bristol assembly, and where they diverge.

  ### Rule 1: The Anti-Collective Pressure Principle
  **The Logic:** The primary evil is the substitution of collective opinion for individual truth. Parties are bad because they demand loyalty to a 'line'. Unions are acceptable only so long as they remain a collection of individuals defending concrete needs rather than an ideological bloc.
  **The Test:** Does the body require members to suppress their conscience or conform to a groupthink?
  **Application to Bristol:** This rule suggests Weil would **back** the assembly. Sortition (selection by lot) prevents the formation of factions or career politicians. The narrow remit (algorithmic sentencing) focuses attention on a concrete technical and ethical reality rather than abstract ideology. The mandatory nature is akin to jury service, which is a duty to truth rather than a party commitment. Since there is no 'party line' to enforce, the individual conscience remains sovereign.

  ### Rule 2: The Anti-Permanence Principle
  **The Logic:** Truth is momentary and requires constant renewal. Any structure that solidifies becomes an idol. Large permanent organisations crush the soul because they prioritise self-preservation over truth. They develop a 'gravity' that pulls members into serving the institution rather than the good.
  **The Test:** Is the body temporary and task-specific, or is it a fixed feature of the landscape?
  **Application to Bristol:** This rule suggests Weil would **reject** the assembly. The proposal is explicitly for a *permanent* citizens' assembly. Even if the members rotate, the institution itself endures. It will develop a bureaucracy, a culture, and a vested interest in its own continuation. For Weil, a healthy group dissolves once the task is done or the immediate threat passes. Permanence implies a claim to enduring authority that belongs only to the divine or the truth, never to a human committee.

  ### Rule 3: The Anti-Force Principle
  **The Logic:** Power corrupts the holder. To wield binding force is to participate in the realm of necessity and violence, which distances one from justice. Unions are tolerated when they are defensive (refusing to work) rather than coercive. Religious groups are dangerous when they seek social control.
  **The Test:** Does the body wield positive power (commanding action) or negative power (blocking harm)? Is membership voluntary?
  **Application to Bristol:** This rule suggests a **split**. The veto power is negative (blocking contracts), which aligns with her view of defensive union action. However, the veto is *binding*, meaning it imposes a decision on others by force of law, not persuasion. Furthermore, membership is mandatory. Weil places a high premium on the voluntary movement of the soul towards the good. Compelling someone to sit in judgement, even by lot, risks turning a moral duty into a mechanical obligation.

  ### The Best Guess

  Weil would likely **reject the proposal, but with significant reservations.**

  Her primary objection would rest on **Rule 2 (Anti-Permanence)**. While the sortition method solves the problem of party discipline (Rule 1), and the veto is defensive in nature (Rule 3), the institutionalisation of the body is the fatal flaw.

  For Weil, the danger of the 'Great Beast' (the collective) is not just that it demands loyalty, but that it outlives the attention of the individuals within it. A permanent assembly, even one selected by lot, becomes a machine. It will inevitably generate a secretariat, experts, and procedural norms that the lay members must rely upon. Over time, the *process* of the assembly becomes more real than the *truth* it is meant to serve. The members become functionaries of the assembly rather than witnesses to the truth.

  She might concede that the narrow remit and the sortition are superior to party politics, but she would argue that a permanent body with binding power will inevitably drift towards becoming the very thing it was designed to check: a bureaucratic machine making decisions based on procedure rather than attentive judgement. She would likely prefer a temporary commission convened only when a specific algorithmic contract is proposed, which dissolves immediately after rendering its verdict.

  ### The Crucial Test Case

  To distinguish whether her rejection is truly about **Permanence** (Rule 2) or about **Binding Force** (Rule 3), you would need to present her with the following hypothetical:

  **A temporary, sortition-based citizens' jury convened for a single specific contract, with the power to issue a public, non-binding recommendation that triggers a mandatory parliamentary debate, but no veto.**

  *   **If she accepts this:** Then her objection to the Bristol plan was primarily about **Permanence** and **Binding Force**. She tolerates the collective only when it is ephemeral and persuasive rather than institutional and coercive.
  *   **If she rejects this:** Then her objection is deeper, rooted in the **Anti-Collective Pressure Principle** or the **Voluntary Principle**. It would imply that *any* formalised group decision-making, regardless of duration or power, risks substituting the collective voice for the individual conscience.

  Given her writings on attention, my wager is she would accept the temporary, advisory jury. This would confirm that for Weil, the sin is not in people coming together to judge, but in building a machine that judges for them. The Bristol proposal builds a machine; therefore, it fails.
