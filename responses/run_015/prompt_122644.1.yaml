      *   **Constraints:** No reading lists, no book recommendations. Just analysis of the arguments.
      *   **Tone:** Academic but accessible, matching a physics student's analytical mindset. Critical but fair to both the podcast and the seminar tutor.

  2.  **Deconstruct the Podcast Host's Claims:**
      *   *Claim 1:* "Scientific Revolution" is a 19th-century invention for a secular reason vs. religious darkness story.
      *   *Claim 2:* Middle Ages did the work (Buridan = Newton, Oresme = Copernicus, Oxford calculators = quantitative laws).
