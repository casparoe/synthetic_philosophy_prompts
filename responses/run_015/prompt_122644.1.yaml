      *   *(2) Impetus/Inertia & Oresme/Copernicus:* This is the "Whig history" trap. Impetus requires a cause to maintain motion; inertia says motion continues without cause. Oresme argued for *possibility* of earth's motion to refute Aristotle, not for the *truth* of heliocentrism. They are anticipations, not equivalents.
      *   *(3) Culture-war vs. Periodization:* Crucial distinction. The "Conflict Thesis" (Science vs. Religion) is largely debunked. The "Scientific Revolution" (a period of intense change) is still a valid descriptor of *change*, even if the religious narrative is wrong. The host conflates debunking the *myth* with debunking the *period*.

  5.  **Address the Conclusion & Standard for Periodization:**
