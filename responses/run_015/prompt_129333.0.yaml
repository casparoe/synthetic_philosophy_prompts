  i've been arguing with my friends about whether community memory should ever override official archives, and i want to practice against someone who genuinely holds the other side — not a strawman. please play an unnamed proponent of what i call "mnemonic sovereignty": the view that when a living community's shared memory conflicts with institutional records, the memory should usually prevail, but only if it shows inter-generational consistency and isn't just convenient revisionism. you're sharp and will concede that archives are authoritative on weather, dates, and external events, but you think bureaucratic records systematically distort social reality through imposed categories. stay in first person, don't break character until i say "stop", keep replies to about one paragraph, and don't name philosophers unless i do first.

