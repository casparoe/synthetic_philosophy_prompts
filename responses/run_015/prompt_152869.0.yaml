answer: |-
  This is a classic problem in political philosophy and ethics: the slogan "people deserve what they earn" functions less like a factual claim and more like a placeholder for competing theories of justice. Your confusion arises because the words "earn" and "deserve" shift their semantic weight depending on the context (markets vs. family vs. emergency).

  Below is a menu of five distinct interpretations (Profiles) constructed from different combinations of "earn" and "deserve." Each profile is evaluated for its logical strength and then tested against your three cases: the **Inheritance** argument, the **CEO Bonus** argument, and the **Instinctive Rescuer** case.

  ---

  ### Part 1: The Menu of Interpretations

  To build these profiles, we first define the variables.

  **Readings of "Earn" (The Input)**
  1.  **Labor/Effort:** Expenditure of time, sweat, or conscious toil.
  2.  **Causal Contribution:** Generating value or outcomes, regardless of effort.
  3.  **Moral Action:** Acting rightly or virtuously, regardless of intent or skill.
  4.  **Institutional Compliance:** Meeting the pre-set rules of a game or contract.

  **Readings of "Deserve" (The Output)**
  1.  **Moral Entitlement:** A pre-political, natural right to the reward (it is *yours* by right).
  2.  **Proportional Fittingness:** It is aesthetically or morally appropriate that you receive it (it *suits* you).
  3.  **Consequentialist Instrument:** You should receive it because doing so incentivizes good behavior for society.
  4.  **Institutional Assignment:** You receive it because the rules say so (no moral weight attached).

  #### Profile A: The Lockean Laborer
  *   **Earn:** Labor/Effort.
  *   **Deserve:** Moral Entitlement.
  *   **The Claim:** If you mix your labor with the world, you have a natural right to the fruits of that labor.
  *   **Verdict:** **Defensible but Limited.** It grounds property rights well but struggles with intellectual property, finance, or scenarios where high effort yields low value (digging a hole and filling it again).

  #### Profile B: The Market Libertarian
  *   **Earn:** Causal Contribution (Value Created).
  *   **Deserve:** Moral Entitlement.
  *   **The Claim:** If you create value for others, you are morally entitled to a portion of that value, regardless of how hard you worked.
  *   **Verdict:** **Contested.** It justifies high incomes for innovators but struggles to account for luck (e.g., being born with a talent the market happens to want).

  #### Profile C: The Incentive Pragmatist
  *   **Earn:** Causal Contribution (Value Created).
  *   **Deserve:** Consequentialist Instrument.
  *   **The Claim:** We should *act as if* people deserve rewards proportional to value, because paying people this way motivates them to create more value.
  *   **Verdict:** **Defensible (Empirically).** This is not about metaphysical justice, but about social engineering. It is false if the incentives don't actually work.

  #### Profile D: The Virtue Ethicist
  *   **Earn:** Moral Action.
  *   **Deserve:** Proportional Fittingness.
  *   **The Claim:** When someone does a good thing, it is "fitting" that they receive honor or reward, even if they didn't try hard or plan it.
  *   **Verdict:** **Defensible.** This handles cases of instinctive goodness well but does not translate well to economic distribution.

  #### Profile E: The Institutionalist
  *   **Earn:** Institutional Compliance.
  *   **Deserve:** Institutional Assignment.
  *   **The Claim:** You deserve what the rules say you get.
  *   **Verdict:** **Trivial.** It is tautological (you get what you get because the rules say you get it). It avoids moral questions entirely.

  ---

  ### Part 2: Application to Your Three Cases

  Here is how each profile handles the specific scenarios you raised.

  | Case | Profile A (Labor) | Profile B (Contribution) | Profile C (Incentive) | Profile D (Virtue) | Profile E (Institutional) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Inheritance** (Friend's Target) | **Supports Anti-Inheritance.** The heir did not labor for the wealth. | **Supports Anti-Inheritance.** The heir did not causally create the wealth (the ancestor did). | **Neutral/Against.** Inheritance taxes might disincentivize the ancestor, but giving it to the heir creates no incentive. | **Irrelevant.** Inheriting money is not a moral action. | **Supports Inheritance.** If the law allows it, the heir "deserves" it by rule. |
  | **2. CEO Bonus** | **Weak Support.** CEOs often work hard, but bonuses are tied to stock price, not hours. | **Strong Support.** If the CEO created billions in value, they are entitled to a slice. | **Strong Support.** High bonuses are necessary to attract talent who can create value. | **Irrelevant.** Profit maximization is not usually seen as moral virtue. | **Strong Support.** If the board approved it, it is "deserved" by contract. |
  | **3. Instinctive Rescuer** | **False.** She exerted no sustained effort or planned labor. | **Mixed.** She created value (a life), but "contribution" usually implies economic output. | **Weak.** Rewarding instinct doesn't incentivize instinct. | **Strong Support.** It is "fitting" to honor the good act, regardless of effort. | **Weak.** Unless there is a specific medal protocol, rules may not cover this. |

  ---

  ### Part 3: Diagnosing the Contradiction

  Your friend's argument relies on a specific switch between these profiles that creates the inconsistency you noticed.

  **1. Which profile supports your friend's Anti-Inheritance argument?**
  Your friend is implicitly relying on **Profile A (The Lockean Laborer)**.
  *   **Logic:** "You didn't work for it (No Labor), therefore you have no Moral Entitlement to it."
  *   **Why:** This is the only profile that strongly condemns inheritance while maintaining a moral tone. Profile E (Institutional) would defend inheritance as legal. Profile C (Incentive) is too nuanced for a slogan.
  *   **Weakness:** Profile A struggles to defend the CEO bonus. If a CEO makes $50 million for a year of work that a laborer could not replicate, Profile A asks: "Did they sweat 1,000 times more than a nurse?" If not, Profile A suggests the CEO is *overpaid*, not that they deserve it.

  **2. Which profile supports the CEO-Bonus argument?**
  The CEO defense usually relies on **Profile B (Market Libertarian)** or **Profile C (Incentive Pragmatist)**.
  *   **Logic:** "She created $1B in value (Causal Contribution), therefore she is entitled to $50M (Entitlement)" OR "We must pay her $50M to ensure she and others try to create value (Incentive)."
  *   **Why:** This decouples reward from *effort* and couples it to *outcome*.
  *   **Conflict:** This contradicts your friend's Profile A. If "deserve" is based on Contribution (Profile B), an heir *could* deserve wealth if they manage the inherited fund well (creating value). If "deserve" is based on Labor (Profile A), the CEO does not deserve the bonus if their effort was minimal.

  **3. Which profile accommodates the Instinctive Rescuer?**
  Only **Profile D (The Virtue Ethicist)** saves this case.
  *   **Logic:** "She did a Good Thing (Moral Action), therefore it is Fitting that she is honored."
  *   **Why:** Profiles A and B fail here because there was no labor and no market contribution. Profile C fails because rewarding instinct doesn't train instinct.
  *   **Insight:** This shows that "deserve" in the rescuer case is about **honor**, whereas "deserve" in the CEO/Inheritance case is about **property**.

  ---

  ### Part 4: Conclusion & Diagnosis

  You asked which version your friend was implicitly relying on.

  **Your Friend's Implicit Position:**
  Your friend is using **Profile A (Labor + Moral Entitlement)** when attacking inheritance, but they likely switch to **Profile B (Contribution + Moral Entitlement)** or **Profile C (Contribution + Incentive)** when discussing CEOs (even if they don't realize it).

  **The Contradiction:**
  *   **Inheritance Case:** They define "Earn" as **Labor**. (Heir didn't work, so doesn't deserve).
  *   **CEO Case:** They (or society) define "Earn" as **Contribution**. (CEO created value, so deserves).
  *   **Rescuer Case:** We define "Earn" as **Moral Action**. (Rescuer did good, so deserves honor).

  **How to Resolve the Argument:**
  You can point out to your friend that the slogan "people deserve what they earn" is not a single principle.
  1.  If they stick to **Labor (Profile A)**, they must argue that the CEO bonus is *unjust* unless the CEO worked proportionally harder than everyone else.
  2.  If they accept **Contribution (Profile B)** to save the CEO bonus, they must admit that an heir *could* deserve wealth if they generate value from it (e.g., through philanthropy or investment), or admit that "luck" (being born smart/talented) is also "undeserved" in the same way inheritance is.
  3.  If they want to include the **Rescuer**, they must admit that "desert" is sometimes about **Fittingness (Profile D)**, not economic entitlement.

  **Final Verdict:** The slogan is doing **many jobs**. It conflates *property rights* (inheritance/CEO) with *moral honor* (rescuer). Your friend's argument against inheritance only holds if they reject the "Contribution" model used to defend CEOs. If they accept that value creation justifies reward (CEO), they cannot claim lack of labor invalidates reward (Inheritance) without explaining why ancestral value creation doesn't count.
