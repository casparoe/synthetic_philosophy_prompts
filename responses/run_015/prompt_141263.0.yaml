  ### The Sixth Case (The Splitter)

  To split the two surviving rules (**Physical Constraint** vs. **Mathematical/Structural Constraint**), use this:

  **Case 6: Computational Complexity Classes (e.g., NP-Complete problems).**
  *   *Description:* A set of problems (Traveling Salesman, Protein Folding, Solitaire) that are structurally equivalent. If you solve one efficiently, you solve all. They share no physical substrate, no causal contact, and no biological lineage. They are purely abstract structures.
  *   *The Split:*
      *   **If IN:** She is a **Structural Realist**. The "math" in Case 1 was doing the work, not the physics. Money might eventually flip (if economic laws are seen as structural).
      *   **If OUT:** She is a **Causal Power Realist**. Case 1 was only In because helium and magnets are *physical*. Carburetors are In because they manipulate *physical* fluids. Abstract math isn't enough.
  *   *Why this works:* It isolates the "Mind-Independent Constraint" from "Physical Instantiation." It tests whether her "Carburetor" verdict relies on physical laws or just formal constraints.
