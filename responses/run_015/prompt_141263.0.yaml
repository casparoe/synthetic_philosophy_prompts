  Here are the predictions based on Marit's track record, the underlying logic, and the pressure points in her system.

  ### The Five Verdicts

  **1. Systems in the same universality class.**
  *   **Verdict:** **IN.**
  *   **Rule:** **Structural Projectibility.** If a cluster supports quantitative prediction across disparate substrates based on mind-independent mathematical constraints (dimension, symmetry), it is a natural kind. Microstructure and ancestry are irrelevant.
  *   **Why:** This extends her "Mass/Charge" verdict (physical law) and her "Carburetor" verdict (function overrides structure) to the limit. It bypasses her "Schizophrenia" refusal because the mechanism *is* the mathematical structure, which is homogeneous across the class.

  **2. Systems implementing an optimal recursive estimator.**
  *   **Verdict:** **IN.**
  *   **Rule:** **Optimization Constraints.** Functional kinds are real if the function is mandated by optimization laws (math/physics) rather than human stipulation.
  *   **Why:** This is the biological/engineering sibling of Case 1. It fits "Carburetor" (job is real) but tightens the criterion: the "job" must be mathematically optimal, not just useful to us. It avoids the "Weed" verdict (human annoyance) because the estimator exists regardless of human observation.

  **3. Kinds defined by an absence (Knockout mice).**
  *   **Verdict:** **IN.**
  *   **Rule:** **Homogeneous Causal History.** A kind is natural if the members share a specific causal history (even if that history is a deletion), provided it yields stable generalizations.
  *   **Why:** She rejected Schizophrenia because it had *several different mechanisms*. Knockout mice share *one* specific mechanism (the deletion of G). It fits "Tiger" (lineage/history does the work) but challenges the idea that an essence must be a *positive* property.

  **4. Invasive species (agency definition).**
  *   **Verdict:** **OUT.**
  *   **Rule:** **Anti-Anthropocentrism.** Kinds defined by human interest ("harm," "native") are not natural, even if the cluster is real.
  *   **Why:** This is the "Weed" verdict again. The "harm" clause is interest-relative (harm to economy? biodiversity?). It lacks the mind-independent constraint of Case 1 or 2.

  **5. Reptile (paraphyletic).**
  *   **Verdict:** **OUT.**
  *   **Rule:** **Monophyly Requirement.** Biological kinds must be complete lineages. Arbitrary boundaries that exclude descendants (birds) are like the "clearing-the-neighbourhood" clause for planets.
  *   **Why:** She insisted "Tiger" is In *as a lineage*. Paraphyly cuts the lineage. This aligns with her wobble on "Planet"—she dislikes arbitrary boundary conditions imposed on continuous natural facts.

  ---

  ### Competing Rules (That Fit Old Data But Fail Here)

  **Competitor A: Microstructural Essentialism.**
  *   *Fits Old:* Gold, Water, Mass, Charge, Jade (Out).
  *   *Fails New:* Fails Cases 1 & 2 (no shared microstructure) and her existing "Carburetor" and "Tiger" verdicts.
  *   *Why Marit rejects it:* She already admitted Carburetor and Tiger. She isn't a reductionist.

  **Competitor B: Pragmatic Cluster Theory (HPC).**
  *   *Fits Old:* Carburetor, Tiger, Weed (could be In), Schizophrenia (could be In).
  *   *Fails New:* Fails to distinguish Case 4 (Invasive) from Case 2 (Estimators). Both are clusters that support induction.
  *   *Why Marit rejects it:* She rejected Weed and Schizophrenia. She requires more than just "useful clustering"; she requires a specific *type* of constraint (law/history vs. interest/compromise).

  **Marit's Actual Rule:** **Constraint-Based Realism.** A kind is natural if it supports induction *and* the source of that stability is a mind-independent constraint (physical law, lineage, optimization math), *excluding* kinds stabilized by human agreement or interest.

  ---

  ### The Money vs. Carburetor Tension

  This is the hardest pair in her list. Both are functional, both vary structurally, both are artifact-adjacent. For both to stand, the following distinction must be true in her framework:

  **The Condition:** **Causal Constraint vs. Constitutive Rule.**
  *   **Carburetor (In):** The function (mixing air/fuel) is constrained by **thermodynamics and fluid dynamics**. You cannot make a carburetor out of just anything; physical law limits the realizations. The "job" exists independent of human agreement.
  *   **Money (Out):** The function (store of value/medium of exchange) is constituted by **collective intentionality**. A shell is money only because we agree it is. There are no physical laws preventing a shoe from being money.
  *   **The Line:** Functional kinds are natural *only if* the function is physically necessitated, not socially stipulated.

  ---

  ### The Load-Bearing Verdict

  **Carburetor.**

  It is the keystone.
  *   **If she keeps Carburetor:** She must accept Cases 1 and 2. They are just more abstract versions of "job is real." This commits her to a robust realism about functional/mathematical kinds.
  *   **If she drops Carburetor:** She reverts to Microstructural Essentialism (or something close to it). Cases 1 and 2 likely fall. "Tiger" becomes vulnerable (why is lineage real but function isn't?).
  *   **Why not Tiger?** Tiger is standard biological realism. Carburetor is the philosophical outlier that licenses the rest of her non-standard verdicts.
  *   **Why not Planet?** She's already wobbly there. It's a symptom, not the cause.

  If you push her, attack the Carburetor. Ask if a *broken* carburetor is still a carburetor. If she says "no," the kind depends on human success conditions (like Money). If she says "yes," the kind is structural (like Mass).

