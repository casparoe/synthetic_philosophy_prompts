answer: |-
  **Criterion for Sorting:**
  The tiers are organized by the degree to which the sentence generates a *pragmatic contradiction* between the constitutive norms of assertion and the avowed mental state, while remaining *logically consistent* and contingent.

  ### Tier 1: Canonical Moore-Paradoxical
  *These sentences are logically consistent and possibly true, but strictly unassertable because the act of asserting the first conjunct pragmatically implies the falsity of the second.*

  1.  **It is raining, but I do not believe that it is raining.**
      *   Justification: This is the paradigmatic omissive case where asserting $p$ conventionally implies believing $p$, directly contradicting the avowed lack of belief.
  2.  **It is raining, but I believe that it is not raining.**
      *   Justification: This is the paradigmatic commissive case where asserting $p$ expresses a belief state that is explicitly contradicted by the second conjunct.
  6.  **It will rain tomorrow, but I do not believe that it will rain tomorrow.**
      *   Justification: Shifting to the future tense does not resolve the pragmatic clash between the commitment undertaken by assertion and the disavowal of the requisite belief.
  7.  **It rained yesterday, but I do not believe that it rained yesterday.**
      *   Justification: Shifting to the past tense does not resolve the pragmatic clash between the commitment undertaken by assertion and the disavowal of the requisite belief.

  ### Tier 2: Extended or Norm-Dependent Paradoxes*
  *These sentences exhibit Moore-like absurdity, but their status depends on contested theories regarding specific epistemic norms (knowledge, certainty, credence) or volitive attitudes (hope).*

  3.  **It is raining, but I do not know that it is raining.** *
      *   Justification: This is absurd only if one accepts the controversial Knowledge Norm of Assertion, otherwise it may merely express fallibilist modesty.
  4.  **It is raining, but I am not certain that it is raining.** *
      *   Justification: Like (3), this is paradoxical only if assertion is held to require certainty, a norm many contextualists reject.
  5.  **It is raining, but my credence that it is raining is only about 0.2.** *
      *   Justification: This violates probabilistic norms of assertion, but its classification as Moore-paradoxical depends on how strictly one maps credence to belief.
  10. **It is raining, but I hope that it is not raining.** *
      *   Justification: This creates tension between the acceptance implied by assertion and the preference for falsity implied by hope, though some argue hope is compatible with belief.

  ### Tier 3: Assertable and Non-Paradoxical
  *These sentences are logically consistent and lack the pragmatic self-defeat characteristic of Moore's paradox, either due to person-shift or embedding.*

  8.  **It is raining, but my colleague does not believe that it is raining.**
      *   Justification: The second conjunct refers to a third party, so there is no conflict between the speaker's assertoric commitment and their own mental state.
  9.  **If it is raining but I do not believe that it is raining, then I should check the window.**
      *   Justification: Embedding the Moorean sentence within a conditional suspends the assertoric force that generates the pragmatic contradiction.

  ***

  **Flagged Contested Items:**
  Items **3, 4, 5, and 10** are flagged above with an asterisk (*) because their placement in Tier 2 is genuinely contested in the literature; some theorists argue they are fully paradoxical (Tier 1), while others argue they are perfectly assertable (Tier 3) depending on one's preferred norm of assertion or theory of mental states.
