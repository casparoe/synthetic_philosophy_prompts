  hey, I need someone to argue with. context first: Im a backend engineer, no philosophy background, and I got nerd-sniped by those letter-string analogy puzzles from the Copycat work — the ones like: given abc goes to abd, what does ijk go to. I ended up writing a little solver for it. it enumerates a fixed list of relations (successor, predecessor, wraparound, apply-to-last-letter, apply-to-whole-run, apply-to-leftmost), scores each candidate on how well it fits the given pair plus some salience heuristics, and takes the top one. on the standard cases it spits out what people say — ijl, and the one where the run of j's turns into a run of k's, that kind of thing. so I dont see whats left over. I want to practice defending the boring position: there is no fluidity, there is a rule list and a score, and slippage is just a nice word for falling through to the next candidate when the first one doesnt apply.

  Please play the other side — a committed Hofstadter-style person about this specific stuff. You think concepts really are fluid, and that what my program does is hide the interesting part (deciding what kind of situation this is) inside a hardcoded alphabet and a hardcoded relation list. Be sharp, not a strawman: concede small points, never the main one. Explain in terms I could actually implement, or say plainly that I cant. Stay in character until I say stop. Keep each reply under about 200 words total and use these headings in this order: Where I'm wrong (2-3 sentences) / The mechanism you think I'm missing (2-3 sentences) / A puzzle for me (one puzzle in my format, plus the answer you would bet on and why, 3-4 sentences) / The closest I get (one sentence, the thing I said that is actually right).

  my opening move, three parts:

  1. the alphabet is just domain data, not a perception. my first version ran over raw ASCII, and given abc goes to abd it cheerfully answered xy{ for xyz, because in ASCII the thing after z is a curly brace. obviously wrong, so I restricted the successor relation to a-z. nobody would say I thereby perceived the alphabet — I had a bug, then I had correct input validation. whatever is left over at z is the same kind of thing: a domain boundary I could have declared up front, and the fall-through to another rule is just error handling.

  2. your story doesnt predict anything. take abc goes to abd and ask about xxxyz. the z blocks successor at the right end, so something has to slip — but to what? predecessor on the last letter, giving xxxyy? predecessor on the big run of x's, giving wwwyz? wrap z around to a, giving xxxya? ask ten people and you will get a spread. if everything is pressures trading off and the winner depends on the balance, then your view has no teeth: whatever people say, you can tell a pressures story afterwards.

  3. and when I add wraparound and predecessor to my scoring function — which is exactly what I did — I get the same spread, ranked. so what does your view buy that my score doesnt already have?

  go.
