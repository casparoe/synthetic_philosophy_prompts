      *   *Refining the STP explanation:* I need to be precise. Savage's STP is about acts $f, g$ and event $E$. If $f \succ g$ given $E$ and $f \succ g$ given $E^c$, then $f \succ g$. In Ellsberg, we construct acts such that the preference reverses depending on the unknown composition, yet the overall preference remains fixed. Actually, it's easier to explain via the *Independence Axiom* (von Neumann-Morgenstern) or Savage's P2. The popular book likely conflates STP with the broader consistency requirement. I should explain that the violation arises from the *pair* of choices, not the single one.

