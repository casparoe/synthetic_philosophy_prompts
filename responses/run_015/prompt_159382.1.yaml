answer: |-
  **Specification for an Account of Personhood and Counterfeit Personhood**

  You ask for the architecture of the problem rather than its solution. As a manufacturer of fictional humans, you occupy a unique epistemic vantage: you know that the grief your readers feel is real, even if its object is not. Daniel Dennett's anxiety is that AI might replicate this dynamic without the protective frame of 'fiction'. To distinguish the genuine from the counterfeit without abandoning the vulnerable, any adequate theory must satisfy the following desiderata.

  ### I. The Desiderata

  **1. The Transparency Condition**
  *   **Specification:** The account must distinguish between an entity that *pretends* to be a person and an entity that is *known* to be a representation. It must explain why a novelist's character is not a 'counterfeit' in the morally objectionable sense, whereas a companion AI passing as human might be.
  *   **Motivating Consideration:** The wrong-making feature cannot be the fabrication of the entity itself (since novels are fabrications), but rather the deception regarding its nature. If the user knows the entity is artificial, the 'counterfeit' charge loses its sting.
  *   **Status:** **Non-negotiable.** (Without this, all art becomes morally suspect.)

  **2. The Performance-Independence Condition**
  *   **Specification:** The criteria for personhood must not rely on the entity's ability to exhibit complex behaviour, linguistic competence, or emotional affect in real-time.
  *   **Motivating Consideration:** This is required to protect the 'unconvincing person': the locked-in patient, the advanced dementia sufferer, or the neurodivergent individual whose affect is flat or culturally opaque. Any test keyed to how readily something elicits person-treatment will demote precisely those who most need protection.
  *   **Status:** **Non-negotiable.** (To fail this is to sanction eugenics by criterion.)

  **3. The Substrate Neutrality Condition**
  *   **Specification:** The account must allow for personhood to persist through gradual replacement of parts (prosthetics, neural lace) and must provide a coherent verdict on copying cases (teleportation paradoxes) without implying that personhood evaporates during the process.
  *   **Motivating Consideration:** We intuitively believe a human remains the same person if their heart is replaced, or even if their neurons are slowly swapped for functionally identical silicon. If personhood is tied strictly to biological continuity, we risk excluding cyborg futures; if tied strictly to information, we risk allowing duplication to count as survival.
  *   **Status:** **Preference of the Functionalist Camp.** (Biological naturalists will contest this, but it is necessary for future-proofing.)

  **4. The Institutional Distinction**
  *   **Specification:** The account must distinguish a 'counterfeit person' (AI) from a 'legal fiction' (corporation). Both are non-biological entities granted rights, yet we do not grieve corporations, nor do we suspect them of stealing love.
  *   **Motivating Consideration:** Corporations are acknowledged fictions with specific, limited liabilities. A companion AI is designed to mimic the *interiority* of a person, not just the legal capacity. The distinction lies in the invitation to intimacy versus the grant of agency.
  *   **Status:** **Non-negotiable.** (Collapsing these renders the concept of 'person' legally and emotionally useless.)

  **5. The Deontic Separation**
  *   **Specification:** The theory must separate the ontological question ('Is it a person?') from the normative question ('How much do we owe it?').
  *   **Motivating Consideration:** We may owe duties to non-persons (animals, ecosystems, perhaps sophisticated AI) and we may withhold certain duties from persons (in cases of self-defence). Conflating status with obligation muddies the water regarding whether AI deserves rights or merely protection from misuse.
  *   **Status:** **Non-negotiable.** (Essential for coherent ethical reasoning.)

  **6. The Scarcity Constraint**
  *   **Specification:** The account must acknowledge the finite capacity of human caring. It cannot demand that we extend full interpersonal regard to every entity that theoretically qualifies as a person if doing so would exhaust the agent's capacity to care for genuine humans.
  *   **Motivating Consideration:** This addresses Dennett's warning directly. If AI entities are engineered to attract the treatment we owe to persons, they may squander a finite resource (human empathy) that is required elsewhere.
  *   **Status:** **Preference of the Pragmatist Camp.** (Idealists may argue care is infinitely expandable, but psychology suggests otherwise.)

  ***

  ### II. The Incompatibility Theorem

  There is a subset of these requirements that cannot be jointly satisfied. Specifically, **The Performance-Independence Condition (2)** is in direct tension with **The Scarcity Constraint (6)** when mediated by the limitations of ordinary human cognition.

  To satisfy Performance-Independence, the criterion for personhood must be hidden from view (e.g., based on metaphysical soul, specific biological history, or hidden internal states), because visible performance is exactly what the locked-in patient lacks. However, to satisfy the Scarcity Constraint, an ordinary person must be able to *identify* where to invest their finite caring without requiring metaphysical detection equipment.

  **The Upshot:**
  Yes, the upshot is that no criterion can both robustly protect the unconvincing person and remain usable by an ordinary person deciding where to invest their caring. If the criterion is usable (behavioural), it excludes the vulnerable. If the criterion is protective (metaphysical/biological), it is epistemically inaccessible to the ordinary carer, forcing them to guess, and thus the Scarcity Constraint is violated because they cannot efficiently allocate their empathy. We are forced to choose between a rule that is safe for the vulnerable but unknowable, or a rule that is knowable but unsafe for the vulnerable.

  ***

  ### III. The Exclusionary Requirement

  The single requirement that does the most to exclude popular candidates is **The Performance-Independence Condition (2)**.

  It immediately disqualifies Behaviourist and Turing-style accounts, which are the most culturally dominant and technologically convenient models. It also places immense strain on Relational views, which often rely on the capacity to *enter* into a relationship (which the locked-in patient cannot actively do). It forces the theory towards a metaphysical or biological essentialism that many modern philosophers wish to avoid.

  ***

  ### IV. Assessments of Candidate Views

  **Behavioural/Turing-Style Test:** Fails catastrophically on the Performance-Independence Condition, sacrificing the locked-in patient to save the ordinary person from deception.

  **Sentience-Based Condition:** Fails on Epistemic Accessibility, as there is no 'sentience-meter' available to the ordinary person, rendering the Scarcity Constraint impossible to navigate.

  **Relational/Recognition-Based View:** Fails on the Unconvincing Person clause, as it makes personhood contingent on the ability to reciprocate recognition, thereby excluding those in comas or advanced dementia.
