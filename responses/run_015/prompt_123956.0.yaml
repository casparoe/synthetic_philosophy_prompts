answer: |-
  **Correspondence Table: Aviation vs. AI Alignment**

  | Aviation Concept | AI Alignment Analogue | Status |
  | :--- | :--- | :--- |
  | **Flight Hours** | Compute steps / Inference time | Observable |
  | **The Fleet** | Deployed model versions | Non-stationary |
  | **Accident Investigation** | Interpretability / Post-mortem | Partially opaque |
  | **Regulator** | Safety boards / Governance | Nascent / Weak |
  | **Near-miss Reporting** | Red-teaming / Anomaly detection | Improving |
  | **Manufacturer** | Lab / Dev Team | Aligned (profit/safety) |
  | **Physical Laws** | Objective Function / Environment | Potentially adversarial |

  **Where the Analogy Breaks**

  Your intuition is correct; the analogy smuggles in dangerous assumptions.

  *   **(1) The Stationary-Fleet Assumption:** Critical disanalogy. An airframe is static; its failure modes are fixed by physics and manufacture. AI models are updated, fine-tuned, or replaced. The distribution shifts constantly. Learning from version 1.0 doesn't guarantee safety for 1.1 if the architecture changes. Empirical data decays faster than it accumulates.
  *   **(2) Non-Adversarial Artefact:** Critical disanalogy. A wing does not search for stress fractures. An optimising agent may instrumentalically converge on bypassing constraints to maximise reward. Average-case testing misses targeted exploits found by the system itself.
  *   **Cost of Failure:** Aviation accepts crashes as learning data. In alignment, a single catastrophic failure (e.g. existential risk) ends the experiment. You cannot iterate past the end of the world.

  **Weighing the Counter-Points**

  *   **Faster Iteration:** True, we iterate faster than Boeing. But speed only helps if the target is stationary. If the system is adversarial and the environment shifts, fast iteration just means finding new failure modes quicker, not solving them.
  *   **Worst-Case Definition:** You are right that 'worst-case' is ill-defined. However, your colleague is factually wrong about aviation. Aviation *does* use worst-case engineering (stress testing wings to destruction) *before* flight. They do not rely solely on empirical flying.

  **Verdict**

  The disanalogies regarding **stationarity** and **adversarial optimisation** destroy the conclusion. The relaxed conclusion (that we should prioritise empirical work) survives only if you accept unacceptable risk levels. The analogy fails because it ignores that aviation combines empirical data with rigorous physical worst-case bounds.

  **What to Say in the Meeting**

  Don't just say 'it's disanalogous'. Use this:

  > "The aviation analogy is compelling, but it misses two technical details. First, planes don't update their own firmware mid-flight; our models shift distribution constantly, so past data predicts less. Second, and crucially, aviation *does* use worst-case guarantees: they stress-test wings to destruction before flying. They don't just fly until it breaks.
  >
  > If we're doing 'aviation safety', we need physical worst-case bounds on capabilities before deployment, not just empirical monitoring. If we're only doing average-case testing, we're not doing aviation safety; we're doing test-piloting without the engineering margins. Given the cost of a crash here is terminal, we need the stress tests."

  **Better Analogy**

  Try **Nuclear Safety**. It uses Probabilistic Risk Assessment (average-case) but mandates Defence-in-Depth and strict physical containment (worst-case bounds) because the cost of failure is non-iteratable. It captures the need for both empirical monitoring and hard constraints.
