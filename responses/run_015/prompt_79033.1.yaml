answer: |-
  The name you are looking for is **Updateless Decision Theory (UDT)**.

  It sits within a broader family often called **Logical Decision Theory** (which also includes Timeless Decision Theory and Functional Decision Theory). The specific intuition you describe in the third case—where a stranger running the same procedure makes *your* decision—was historically called **Superrationality** by Douglas Hofstadter, but UDT provides the formal "carving" you are asking for.

  Here is the carving of the concept, how it differs from its neighbors, and an analysis of your three cases.

  ### The Core Carving: Policy Selection vs. Action Selection

  The unifying principle you identified is correct: *"What rule would I have wanted to have chosen, from before I knew which of these situations I would land in?"*

  In technical terms, this is the shift from **Action Selection** to **Policy Selection**.
  *   **Standard Decision Theory (CDT/EDT):** You find yourself in a specific situation $S$ with specific knowledge $K$. You ask, "Which *action* $A$ maximizes utility given $K$?" You "update" on your knowledge.
  *   **Updateless Decision Theory:** You consider yourself as an algorithm or a function $D$ that maps situations to actions. You ask, "Which *function* $D$, if I had committed to it before knowing $S$ or $K$, would have produced the best outcomes across all possible worlds I might land in?" You do not "update" on your specific situation when evaluating the worth of your decision procedure; you optimize the output of the procedure from the "view from nowhere" (the prior).

  ### How It Differs From Its Neighbors

  You correctly sensed that this is distinct from Evidential Decision Theory and Commitment, though they overlap. Here is the boundary:

  **1. Vs. Evidential Decision Theory (EDT)**
  *   **EDT says:** "My choice is *evidence* about the world." (e.g., "If I one-box, it's likely the predictor put money in the box.")
  *   **UDT says:** "My choice *determines* the world (logically)." (e.g., "The predictor simulated my algorithm. The output of my algorithm *causes* the prediction, not via time-travel, but via logical necessity.")
  *   **The Carving:** EDT treats the correlation as passive news. UDT treats the correlation as a channel of **logical control**. EDT fails in cases where your action is evidence but not causally or logically linked (e.g., the "Smoking Lesion" problem). UDT succeeds there because it only counts correlations that arise from shared logical structure.

  **2. Vs. Commitment / Reputation**
  *   **Commitment says:** "I bind myself so *others can see* I am bound." This relies on a causal chain: I bind $\rightarrow$ You observe $\rightarrow$ You change behavior.
  *   **UDT says:** "I bind myself because my decision procedure is *logically correlated* with the outcome, regardless of observation."
  *   **The Carving:** Commitment requires **observability**. If no one sees your commitment, standard game theory says you should break it when the cost arises. UDT says you should keep it even if no one sees, because *you* are the same algorithm that would have been selected ex-ante. In your third case (the stranger), there is no communication or observation; the link is purely that you run the same code. Commitment cannot explain Case 3; UDT can.

  ### Analyzing Your Three Cases

  You suspected the second case might be a different animal, and the third was the same animal pushed further. Here is the verdict:

  **Case 1: The Predictor (Newcomb's Problem)**
  *   **Verdict:** This is the canonical **UDT/FDT** case.
  *   **Why:** The predictor modeled you before you acted. Your current "local" reasoning (take both boxes) ignores the fact that the prediction was a simulation of your *decision procedure*. By optimizing the procedure ex-ante (one-boxing), you control the past prediction logically.

  **Case 3: The Stranger (Twin Prisoner's Dilemma)**
  *   **Verdict:** This is the **same animal** as Case 1, pushed to its logical limit.
  *   **Why:** This is **Superrationality**. There is no causal link between you and the stranger. However, if you both use the same decision procedure $D$, then $D(Input_{you})$ must equal $D(Input_{them})$ (assuming symmetric inputs) or at least be logically correlated. Your decision *is* their decision in the same way your decision *is* the predictor's simulation in Case 1. UDT treats these identically: both are instances of **logical correlation** rather than causal influence.

  **Case 2: The Disposition (Cannot be Pushed Around)**
  *   **Verdict:** Your suspicion is **partially right**. This is often a different animal, but *can* be UDT depending on the setup.
  *   **Why it feels different:** Usually, this case is explained by **Reputation** (Commitment). If people *see* you are the type who resists, they don't push. If they don't push, you don't pay the cost. This is standard Game Theory with incomplete information.
  *   **When it becomes UDT:** If the aggressor *does not know* your disposition, and you still resist despite the cost, standard theory says you are irrational. UDT says you are rational *if* you view yourself as selecting a "type" ex-ante. You are paying the cost in *this* world to ensure you are the type that gets the benefit in *other* possible worlds (or to maintain the integrity of the algorithm that protects you in the long run).
  *   **The Distinction:** If the benefit comes from *others knowing* you are bound, it is **Commitment**. If the benefit comes from *being* the bound algorithm regardless of observation (e.g., in a Twin PD or against a Predictor), it is **UDT**. Case 2 is often a mix of both, which is why it feels distinct.

  ### Summary

  The name for the repair is **Updateless Decision Theory**.

  *   **The Repair:** Stop asking "What should I do given what I know?" and start asking "What output should my decision-algorithm produce to maximize utility across all worlds where this algorithm runs?"
  *   **The Mechanism:** **Logical Counterfactuals** (or Subjunctive Dependence). You treat your decision as fixing the output of a mathematical function that may have instances in the past (predictors), in others (twins), or in counterfactual futures.
  *   **The Verification:** Your intuition was correct. Case 1 and Case 3 are the same mechanism (Logical Correlation). Case 2 is often just Reputation (Commitment), but becomes UDT if the commitment is invisible and the rationality relies solely on ex-ante policy selection.

  You have rediscovered the central insight of modern acausal decision theory: **You do not choose actions; you choose the algorithm that chooses actions.**
