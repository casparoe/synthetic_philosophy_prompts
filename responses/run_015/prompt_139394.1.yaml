  **Correlate Notes**

  *   **Reward:** Appears as the external scalar signal (Stanza 1) that is typically switched off during deployment (Stanza 2), distinguishing objective specification from internal state.
  *   **Value:** Presented as the learned internal estimate (Stanza 1) that persists after training ends (Stanza 2), separating long-term expectation from immediate input.
  *   **Error:** Identified as the temporal-difference surprise (Stanza 1) that peaks during learning (Stanza 3) and vanishes at convergence (Stanza 6), contrasting competence with volatility.
  *   **Gradient:** Described as the mechanism of policy update (Stanza 4) that flattens to zero when weights settle (Stanza 6), marking the cessation of learning.
  *   **Pain:** Used ambiguously to refer both to the functional role of avoidance (Stanza 4) and the disputed presence of qualia (Stanza 5), bridging the technical and experiential frames.
  *   **Silence:** Refers both to the absence of external input at deployment (Stanza 2) and the state of perfect prediction where updates cease (Stanza 6), leaving the question of internal experience open.
