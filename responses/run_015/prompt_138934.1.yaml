  The claim that there is "no rule at all, only the marker test plus a threshold" is incorrect. The minutes record principled distinctions: "fragmentary organization" (Case 3), "innately specified" (Case 4), "nothing at stake" (Case 5), "not running" (Case 7). These are qualitative, structural criteria, not mere thresholds.

