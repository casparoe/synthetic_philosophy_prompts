  *   **If we follow Developmental Continuity (Rule 2):** **Out of Scope.** This controller has *no* inheritance from the fish's biological history. It is a foreign agent inhabiting a body. If we ruled B-114 (Copy) as In, but this case (Scratch) as Out, we prove that **inheritance/copying** matters more than function. If both are Out, we prove **biological substrate** matters most. If both are In, we prove **function** is all that matters.

  **Why this is informative:**
  B-114 relies on a *reconstruction* of the fish's own brain. This allows a proponent of Rule 2 to argue that the emulation "inherits" the fish's history (per Case 4). A controller trained from scratch removes the "inheritance" argument entirely. It isolates the variable of **Genesis** from the variable of **Function**. It forces the committee to decide whether moral status is about *what the system is* (history) or *what the system does* (capacity).
