  If we vote **In**, we adopt this principle:
  > *"Moral concern attaches to the living organism as a whole. If the organism's body is biological and subject to real-world consequences, and the control loop preserves the functional capacities that trigger review (e.g., motivational trade-offs), the substrate of the controller is not dispositive."*

