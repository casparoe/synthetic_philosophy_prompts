  ### Vote Recommendation and Precedent

  **Vote:** **In Scope** (Heightened Review).

  **Closest Analog:** **Case 2 (Adult Zebrafish)**, distinguished by **Case 7 (Ex Vivo Brain)**.

  **Reasoning:**
  To be consistent with the record, the committee must prioritize the **locus of moral stakes** and the **functional integrity of the organism** over the substrate of the controller.

  1.  **Locus of Stakes (Case 5 vs. Case 2):** In Case 5 (LLM), the system was ruled Out partly because there was "nothing at stake for it." In B-114, the stakes are undeniably real: a living vertebrate body is in the water, subject to physical consequences, pain, and survival pressures. The *body* is the entity that suffers or thrives. Case 2 established that a zebrafish body exhibiting motivational trade-offs is In Scope. B-114 preserves this body and the behavioral markers of Case 2.
  2.  **Functional Integration (Case 7):** Case 7 (Ex Vivo Brain) was ruled Out because the organization was "available" but not "running." B-114 explicitly satisfies the "running" criterion via real-time emulation closing the sensorimotor loop.
  3.  **Model Inheritance (Case 4):** Case 4 ruled that a model "inherits whatever standing the modelled animal has and adds none of its own." Since the modelled animal here is a zebrafish (Case 2, In Scope), the emulation inherits that standing. While Case 4 involved a fully virtual animal (ruled Out because the source was *C. elegans*, Out), the principle of inheritance suggests that a model of an In-Scope animal does not automatically lose that status. B-114 is a hybrid: it possesses the biological standing of the fish *plus* the functional inheritance of the emulation.

  To vote Out would be to assert that the *material of the controller* outweighs the *reality of the suffering* in the body. This contradicts the functional emphasis of Case 2 (trade-offs) and Case 7 (running organization).

