  ### The Decisive Future Case

  To separate the two most likely competing rules (**Functional Integration in a Living Body** vs. **Developmental Continuity of the Controller**), the committee should request a proposal for:

  **A controller trained from scratch in the body, rather than copied from a brain.**

  **The Setup:**
  A larval zebrafish with its brain silenced, controlled by a synthetic neural network that was *not* reconstructed from the fish's own brain, but instead trained via reinforcement learning *while connected to that specific body* to restore sensorimotor function.

