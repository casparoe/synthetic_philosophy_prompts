answer: |-
  This is a substantive dispute about the source of epistemic normativity that stalls because the term 'credence' is overloaded to serve both functional-role and truth-aiming purposes. The Dutch Book argument cannot bridge the gap between mathematical structure and normative force without begging the question, because any bridge principle (betting or accuracy) already presupposes a specific meta-normative commitment about what belief is for.

  The disagreement persists because the parties are defending incompatible meta-normative frameworks under the guise of analyzing a single concept. Defenders treat credence as a functional state defined by its role in decision theory; for them, the Dutch Book theorem is a consistency check on action-guiding states. Critics treat credence as an alethic state defined by its fit with the world; for them, pragmatic coherence is irrelevant to epistemic assessment unless already tied to truth. The "relocation of the contested premise" you observe is inevitable because neither side can accept the other's bridge principle without surrendering their core conception of epistemic value. If credence is fundamentally about guiding action, pragmatic coherence is constitutive; if it is fundamentally about representing reality, pragmatic coherence is derivative. The DBA fails as a neutral justification because it attempts to derive an epistemic norm from a pragmatic constraint (or vice versa) without establishing why the constraint binds the epistemic state independently of its definition. Consequently, the debate looks verbal only because both sides use 'credence' to pick out the target of their respective norms, masking the fact that they are norming different phenomena. The accuracy-first programme confirms this: by swapping money for inaccuracy scores, it merely swaps one substantive meta-normative premise (pragmatic coherence) for another (alethic accuracy), leaving the structural isomorphism intact but the foundational dispute unresolved.

  Progress requires a change of question: abandon the search for a single, framework-neutral argument for probabilism. Instead, formal epistemology should distinguish *representation theorems* (what structure is required to model certain behaviors) from *normative vindications* (why agents should adopt that structure). A representation theorem can show that if an agent's preferences satisfy certain axioms, they are representable as maximizing expected utility relative to a probability function. This is a mathematical fact. The normative leap—that agents *ought* to satisfy those preference axioms—remains a separate philosophical commitment. Progress would look like explicitly relativizing probabilism to meta-normative frameworks (pragmatist vs. veritist) rather than seeking a universal proof. Alternatively, a theorem dispensing with precision and willingness-to-bet assumptions (e.g., using imprecise probabilities or comparative confidence) would clarify whether probabilism is a requirement of rationality or merely an artifact of precise modeling. However, the impasse may persist because the choice between pragmatist and veritist foundations is likely a fundamental philosophical divide rather than a solvable technical problem. Until the field accepts that 'credence' may not name a natural kind with a single normative source, the relocation of premises will continue to symptomize the underlying fracture.
