  Help me out here. I'm in a small readings course on Plato and drunkenness — mostly the drinking discussion in the first two books of the Laws, where the Athenian pushes back on the Spartan and Cretan bans on symposia, floats the idea that wine can be used to test people, and then later prescribes it for the older men's chorus as a kind of medicine for the sourness that comes with age — plus a bit of the Symposium, where Socrates is still drinking at dawn and Alcibiades shows up plastered and insists he's finally going to tell the truth about Socrates. Anyway, last week one of the PhD students in the room shrugged and said: well, in wine there is truth — Plato's just noticing that booze strips off the polite layer and shows you who someone really is, it's a truth serum with extra steps, nothing we didn't already know from every wine-fuelled confesion ever. Everyone more or less nodded and we moved on, and it bugged me all weekend, but when I tried to say why at the pub afterwards I couldn't get past "that's not quite it, is it". So pretend you're a professional philosopher who works on ancient moral psychology and also, ideally, on the way people present themselves online. Think carefully about this one rather than firing off the first thing that comes to mind: start by brainstorming, as messily as you like, six or seven distinct precise things that proverb could be claiming, from dead trivial to genuinely wild, and only then start pruning and sorting.

