answer: |-
  You are right that the debate is stuck in amber, and you are right to suspect the philosophy isn't really about heaps. But your working theory—that this is about truth as a property of sentences vs. utterances—is, to be blunt, mostly restating the debate in fancier words. Epistemicists believe sentences have determinate truth conditions fixed by usage (we just can't know them); Supervaluationists believe sentences lack determinate truth conditions until precisified. That *is* the debate, not a diagnosis of it.

  Here is the diagnosis you asked for.

  ### 1. The Kind of Disagreement: A Clash of Theoretical Virtues
  The Epistemicism vs. Supervaluationism stalemate is not verbal, and it is not empirically decidable. It is a **methodological disagreement about which theoretical virtue to sacrifice.**

  Philosophical theories trade off virtues: simplicity, fidelity to intuition, logical conservativeness, and metaphysical parsimony. The two sides optimize for different virtues:

  *   **Epistemicism (Williamson):** Prioritizes **Logical Conservatism**. It saves Classical Logic (Bivalence, Excluded Middle) and standard semantics at the cost of **Metaphysical Intuition**. It asks you to accept "magic": sharp boundaries that are in principle unknowable.
  *   **Supervaluationism (Fine/Keefe):** Prioritizes **Phenomenological Fidelity**. It saves the intuition that there is no sharp boundary and that borderline cases are genuinely distinct from clear cases, at the cost of **Logical Conservatism**. It asks you to accept "gaps": truth-value gluts or gaps, and the failure of classical inference rules (like contraction or conditional proof) in borderline contexts.

  **Why it's stuck:** There is no neutral arbiter between "Logic is sacred" and "Usage is king." If you value the structural integrity of classical logic above all, Epistemicism wins. If you value the descriptive accuracy of how speakers actually experience meaning above all, Supervaluationism wins. Since the mid-90s, nobody has found a reason to force a philosopher to swap one virtue for the other.

  ### 2. The Real Disagreement: Semantics as Description vs. Semantics as Norm
  The deeper fracture, which your AI observation hints at, is about **what semantics is for.**

  *   **Supervaluationism treats semantics as descriptive anthropology.** It tries to model the actual state of linguistic practice. Since our practice doesn't fix a sharp boundary for "heap," the semantics shouldn't either. It models the *underdetermination* of reference by use.
  *   **Epistemicism treats semantics as a normative framework for reasoning.** It assumes that for logic to work, there *must* be a fact of the matter. It treats the sharp boundary as a necessary posit for a coherent system of reasoning, even if that fact is inaccessible.

  This is why your AI team is reenacting the war.
  *   The **Supervaluationist AI researchers** are treating "dangerous capability" as a descriptive label. Since the capability curve is smooth, the label doesn't apply determinately. They want to acknowledge the indeterminacy and move to convention.
  *   The **Epistemicist AI researchers** are treating "dangerous capability" as a normative threshold for action. For the policy to function, there *must* be a fact about whether the model crossed the line, even if our evals are noisy. They are positing a fact to preserve the binary logic of the policy.

  ### 3. Critique of Your Working Theory
  You suggested the disagreement is about "truth as a property of sentences relative to a language [Super] or of utterances relative to speakers' commitments [Epi]."

  This is slightly off. Epistemicism is actually *more* committed to truth being a property of sentences independent of current speaker commitments (the boundary exists even if we can't commit to it). Supervaluationism makes truth relative to a *precisification* (a way of making the language precise), which is closer to your "relative to a language" point.

  However, you are gesturing toward the right distinction: **Determinacy.**
  *   **Epistemicism:** Meaning determines reference fully; we are just ignorant of the mapping.
  *   **Supervaluationism:** Meaning underdetermines reference; there is no mapping to know.

  ### 4. What Counts as Progress?
  Since this is a clash of virtues, a "knockdown argument" is impossible. Progress will not come from a formal result proving one side logically incoherent (both are internally consistent). Progress will come from **Decision-Theoretic Pragmatics.**

  Your AI context is actually the frontier where progress is possible. The question shouldn't be "Which theory is true?" but **"Which theory yields better risk management in high-stakes fuzzy contexts?"**

  *   **The Test:** Construct a decision model where an agent must act on vague predicates (e.g., "shut down the model if it is *deceptive*").
  *   **Epistemicist Cost:** If you assume a sharp boundary exists, you might over-trust your metrics. You assume there is a fact you are missing, leading to false negatives (thinking you can measure the unmeasurable).
  *   **Supervaluationist Cost:** If you assume indeterminacy, you might over-hedge. You treat borderline cases as action-paralyzing gaps, leading to false positives (shutting down safe models because "we can't be sure").

  **Progress looks like this:** A formal demonstration that in specific regulatory environments (like AI safety), adopting an Epistemicist stance leads to systematically higher catastrophic risk than a Supervaluationist stance (or vice versa).

  If you can show that treating "scheming" as epistemic (there is a fact, find it) leads to more disasters than treating it as supervaluational (it's indeterminate, regulate the process not the output), you haven't solved the metaphysics of vagueness, but you have **dissolved the debate for practical purposes.**

  ### Summary
  The debate is stuck because it is a **trade-off between logical purity and descriptive accuracy.** Your AI work reveals that the debate is actually about **governance under uncertainty.**

  Don't try to solve the philosophy. Use the philosophy to audit your team's risk posture. If your team is Epistemicist, they are prone to **measurement overconfidence** (believing the boundary exists implies we can find it). If they are Supervaluationist, they are prone to **policy paralysis** (believing the boundary is fake implies we can't act).

  The impasse *is* the finding. The value isn't in picking a team, but in recognizing which error cost your specific domain can afford.
