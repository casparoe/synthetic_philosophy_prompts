      *   Make sure the user feels confident giving this feedback.

  8.  **Final Review of the Student's Text vs. Philosophical Consensus:**
      *   *Hume:* Hume does think promising is artificial and grounded in utility. However, the "Practice View" (often Rawls interpreting Hume) argues that once the practice exists, the obligation is internal to the practice, not a fresh utilitarian calc each time. The student says "obligation bottoms out in consequences... keeping it produces more good overall." This is the "Utilitarian Collapse" objection to the Practice View. If the student presents this as *the* Practice View without noting the tension, it's a simplification that might be penalized in a rigorous course.
      *   *Scanlon:* Scanlon's Principle F: "If one voluntarily and intentionally leads one to expect... one must do it." Detrimental reliance is *not* required for Principle F (though it is for Principle D). The student explicitly says "they then rely on it, and the wrong... is the setback to their interests that this reliance produces." This describes Principle D (or a reliance view), not the core Fidelity view (Principle F). This is a definite error.
