          *   *Claim:* Strength scales with loss. Promise nobody relies on = barely an obligation.
          *   *Critique:* This is a significant misreading of Scanlon. Scanlon's Principle of Fidelity (Principle F) is specifically designed to *avoid* reliance-based accounts (like simple expectation damages). Scanlon argues the wrong is violating the expectation *you intentionally created*, regardless of detrimental reliance. The student describes a reliance view (like Shiffrin or simple tort-like views), not Scanlon's specific assurance view. Scanlon explicitly handles the "no reliance" case better than the student claims.
      *   **Paragraph 4 (Third Option - Power View):**
          *   *Claim:* Normative power, handing over a claim.
          *   *Claim:* Handles secret promise fine.
          *   *Claim:* Explains why duress *isn't* a defense ("you still chose to say the words").
