          *   *Claim:* Obligation bottoms out in consequences (act utilitarianism-ish). "You should keep a promise when and because keeping it produces more good overall."
          *   *Claim:* Fine to break trivial promises for important things.
          *   *Critique:* This is a common misunderstanding of the Practice View (often associated with Rawls or Hume). The Practice View usually argues that the *rule* of the practice creates the obligation, not a case-by-case utilitarian calculation. If it collapses into act utilitarianism, it fails to explain why the promise *itself* is a reason distinct from general good.
      *   **Paragraph 3 (Scanlon/Assurance View):**
          *   *Claim:* Starts from the promisee. Giving assurance leads to expectation/reliance.
