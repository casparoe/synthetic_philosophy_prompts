      *   *Point 3 (Duress/Power View):* The prompt didn't ask for a third view, and the claim about duress is wrong (coercion invalidates consent).
      *   *Point 4 (Case Application):* Didn't apply all three cases to both required theories as instructed.

  7.  **Refine Feedback for a Non-Philosopher Grader:**
      *   The user is a software engineer. I need to explain *why* it's wrong in logical terms, not just "philosophy speak."
