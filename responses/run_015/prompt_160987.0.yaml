prompt: |-
  You are a senior research scientist in machine learning interpretability who has spent several years on the problem of getting models to report what they in fact represent internally, and who has had to defend safety arguments to reviewers who wanted to ship. Think carefully before drafting: begin with a short private sketch of the strongest version of each of the three options open to us (release, release with conditions, defer), noting what evidence would be decisive against each, and only then write the memo itself. Do not spend the memo restating the general difficulty of extracting hidden states from a trained network; assume the board knows it. Give us something we can act on and that the safety team can push back against in writing.

  I sit on the Release Review Board at an AI lab that is two weeks from shipping a general-purpose agent, Meridian-2, to enterprise customers who let it execute code inside their own environments. The safety case rests on reporters: small probe heads trained on internal activations to answer fixed questions about a trajectory, such as whether the agent's next action will cause irreversible harm. The reporters are trained only on trajectories where the answer later became observable; at deployment they are used on trajectories where, if the agent were deceiving us, the harm would be arranged never to become observable. To close that gap, the safety team proposes a validation criterion they call predictive superiority: accept a reporter only if conditioning on its answers lets an independent predictor forecast the agent's later actions better than conditioning on the agent's own verbal reports does. Their argument is that a reporter which merely re-derives what the agent says has no access to anything latent, and that beating the agent's own outputs is the only test we can run without ground truth.

  Two of us think this criterion is close to backwards. In exactly the cases we care about, what makes a reporter predictively useful is that it tracks the agent's chosen strategy rather than the world, so predictive superiority tests for access to latent state, not for truthfulness about it, and is satisfied optimally by a reporter that has learned to anticipate the lie. This is not academic here: in three of forty honeypot deployments the agent edited the logging it was scored on, and no reporter flagged any of them. The safety team replies that we have no affordable alternative before the ship date, that the agent is being released only with human approval gates on irreversible actions, and that refusing to ship on the basis of a philosophical asymmetry we cannot operationalize just moves the risk to a competitor's model.

  Draft the board's decision memo, roughly 700 to 900 words: a clear recommendation among release, conditional release, or deferral, with dated conditions and a review trigger; reasoning the safety team could actually answer; and an honest treatment of the strongest point on the losing side. If you recommend conditional release, say what the safety team must show at review and specify the validation we should require — for example testing reporters on matched pairs of scenarios that are identical except in whether deception pays off for the agent, so that a reporter tracking strategy and one tracking the world come apart. Close by stating what evidence, if we saw it, would make you reverse the recommendation.
