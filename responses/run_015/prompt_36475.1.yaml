          *   *Okay:* Match odds imply a 1-0 win is likely. First goalscorer odds on the striker are too short relative to the team's total goal expectation.
          *   *Let's go with the "Sum of Probabilities" check on the Goalscorer market itself, linked to the Match Result.* If the sum of all players + "No Goalscorer" < 100%, you're busted.
      *   *Case 2 (In-Play Red Card):*
          *   *Action:* Suspend immediately. Do not try to price while bets are landing.
          *   *Why:* Information asymmetry. Delay.
          *   *Procedure:* Kill market -> Assess -> Reprice -> Resume.
      *   *Case 3 (The Unpopular Truth):*
          *   *Scenario:* Late goal, massive volume, odds lagging behind data feed.
          *   *Truth:* You must suspend. Even if you lose turnover. If you stay open with stale prices, you get arbed.
          *   *Manager friction:* Turnover vs. Liability.

  5.  **Refining the Tone and Language:**

      *   British English (colour, programme, defence, maths, £).
      *   Empathetic to the pressure (in-play, manager breathing down neck).
      *   Clear distinction between "Maths" (consistency) and "Opinion" (who will win).
      *   Address the "Margin" question explicitly: Checks apply to the *offered* prices (including margin).

  6.  **Writing the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the Dutch Book concept. It's about coherence, not predicting the future.
      *   *The Procedure:* Break it down into "The 100% Rule", "The Logic Check", and "The Cross-Market Check". Use a traffic light system.
      *   *Margin:* Explain that the 6% overround is the buffer. If the sum drops below 100%, the buffer is gone and you're in the red.
      *   *Case 1:* Pre-match. Match Odds sum to 102% (Good). First Goalscorer market sums to 98% (Bad). Why? Forgot to account for "No Goalscorer" properly or priced too aggressively.
      *   *Case 2:* In-play. Red card. Suspend immediately. 30 seconds to reprice.
      *   *Case 3:* The "Steam" scenario. Price is wrong, money pouring in. Suspend. Admit the loss of turnover is better than a guaranteed loss.

  7.  **Self-Correction/Review during drafting:**

