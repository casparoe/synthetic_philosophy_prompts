      *   *Critique:* Accumulators on same match.
      *   *Correction:* This is correlation. If I bet Home Win AND Over 2.5 Goals, the price should be higher than Home Win alone. If the combined odds imply a higher probability than the single event, that's a Dutch Book. I need to add a "Correlation Check".

  8.  **Final Polish:**

