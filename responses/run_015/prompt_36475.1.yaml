              *   Case 1: Pre-match inconsistency (Match Odds vs. First Goalscorer).
              *   Case 2: In-play red card (speed vs. accuracy).
              *   Case 3: The "Unpopular Truth" (suspend during high volume).

  2.  **Deconstruct the Theory (for the Compiler):**

      *   **Dutch Book:** A set of bets that guarantees a loss for the bookie regardless of the outcome. This happens if implied probabilities sum to less than 100% (arbitrage opportunity for the punter) or if related markets contradict each other (e.g., P(A) > P(A or B)).
      *   **Coherence:** Odds must satisfy probability axioms. $P(A) + P(B) + P(C) = 1$ (for mutually exclusive, exhaustive outcomes).
      *   **Implied Probability:** $1 / \text{Decimal Odds}$.
      *   **Overround:** The sum of implied probabilities usually exceeds 100% (e.g., 106%). This is the bookie's edge. If the sum drops *below* 100%, that's a Dutch Book opportunity for the punter.
      *   **Conditionalisation:** Updating probabilities based on new info (e.g., Red Card). $P(A | \text{Red Card})$.
      *   **Cross-Market Consistency:** If Player X is 5.0 to score first, his implied prob is 20%. If the team's total goals market suggests low scoring, these might clash. More critically, "Home Win" probability shouldn't be lower than "Home Win & Over 2.5 Goals" probability.
      *   **Margin Application:** Checks for Dutch Books apply to the *final prices offered to the customer*. If the raw probabilities sum to 100%, but the prices offered sum to 98%, you've created an arbitrage opportunity.

  3.  **Drafting the Procedure (The "10-Minute Check"):**

      *   *Goal:* Keep it simple. Use percentages.
