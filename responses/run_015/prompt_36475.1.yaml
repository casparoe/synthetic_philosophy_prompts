answer: |-
  Right, let's get straight to it. You've grasped the core concept perfectly: a Dutch Book isn't about a punter knowing more about football than you; it's about your prices contradicting each other mathematically. If your odds imply probabilities that don't add up, a punter can back all outcomes across different markets and guarantee a profit regardless of the scoreline. That is a risk-free loss for you, and it's entirely avoidable.

  You are also correct that probability estimation is opinion, but *consistency* is maths. The procedure below separates the two. It treats your 6% margin (overround) as a safety buffer. As long as your total implied probabilities stay above 100%, you are safe from a Dutch Book. If they dip below 100%, you are effectively offering arbitrage.

  Here is the **Desk Coherence Protocol**. It is designed to be printed and kept next to the terminal.

  ***

  # The Desk Coherence Protocol
  **Target Time:** 10 Minutes (Pre-Match) / 30 Seconds (In-Play Emergency)
  **Audience:** All Trading Staff

  ## Part 1: The Maths (No Fractions, Just Percentages)
  *For every market, convert decimal odds to "Implied Percentage" using this rule:*
  $$ \text{Percentage} = 100 \div \text{Decimal Odds} $$
  *(Example: Odds of 2.00 = 50%. Odds of 4.00 = 25%.)*

  ### Check 1: The 100% Rule (Single Market)
  **What to do:** Add up the Implied Percentages for every outcome in a single market (e.g., Home, Draw, Away).
  **The Standard:** The total **must** be greater than 100%.
  *   **Target:** 105% – 107% (This is your 5–7% margin).
  *   **Pass:** Total is between 105% and 110%.
  *   **Amber:** Total is between 100% and 105%. (Margin is too thin, adjust if possible).
  *   **Fail:** Total is **below 100%**.
  **Action on Fail:** **IMMEDIATE SUSPEND.** You are offering a guaranteed loss. Do not wait for bets. Recalculate the odds so the total is at least 105%.

  ### Check 2: The Logic Check (Subset Rule)
  **What to do:** Compare a specific outcome to a broader outcome that includes it.
  *   *Example:* "Home Win" vs "Home Win or Draw" (Double Chance).
  *   *Example:* "Over 2.5 Goals" vs "Over 1.5 Goals".
  **The Standard:** The percentage for the specific outcome must be **lower** than the percentage for the broader outcome.
  *   *Logic:* You cannot be more likely to win 2-1 (specific) than to win the match generally.
  **Action on Fail:** Adjust the odds on the specific market until the percentage is lower than the broader market. If you cannot do this quickly, suspend the specific market.

  ### Check 3: The Cross-Market Check (Correlation)
  **What to do:** Check markets that rely on the same event.
  *   *Example:* "Match Result" vs "First Goalscorer".
  *   *Example:* "Match Result" vs "Correct Score".
  **The Standard:** Ensure the "No Goalscorer" option exists in the Goalscorer market. If the Match Odds imply a 0-0 draw is likely (e.g., low scoring league), but the First Goalscorer market prices suggest a goal is guaranteed (sum of all players = 100%), you have a contradiction.
  **Action on Fail:** Adjust the "No Goalscorer" price or suspend the Goalscorer market.

  ***

  ## Part 2: In-Play Protocol (The "Red Light" Rule)
  *Speed is more important than precision here. A wrong price live is worse than no price live.*

  1.  **Event Occurs** (Goal, Red Card, Penalty).
  2.  **IMMEDIATE SUSPEND.** All markets on that match go "Red" (Suspended) instantly. Do not attempt to reprice while accepting bets.
  3.  **Assess.** Apply the 100% Rule to the new anticipated odds.
  4.  **Resume.** Only reopen once the total Implied Percentage is >105%.

  ***

  ## Part 3: Margin & Opinion (The Honest Bit)
  *   **Opinion:** Deciding that Manchester City are 60% likely to win is your judgement. The protocol does not check this. You can be wrong about football and still be safe from a Dutch Book.
  *   **Margin:** The checks apply to the **final prices offered to the customer**. It does not matter what your "raw" probability model says. If your raw model says 100%, but you add margin to get to 106%, you check the 106% figure. If you strip margin to compete and drop to 99%, you fail the check.
  *   **Judgement:** If a check fails, you can "patch" a single price *only if* it doesn't break the 100% Rule elsewhere. If patching one price breaks another market's logic, you must suspend the whole group.

  ***

  # Worked Cases

  Here is how this looks in practice on your desk.

  ### Case 1: Pre-Match Inconsistency (Match Odds vs. First Goalscorer)
  **Situation:** It's 14:00 on a Saturday. You have priced up the Premier League. You're looking at Everton vs Luton. You feel the Match Odds board is solid, but the First Goalscorer market looks too aggressive because you want to attract action on the strikers.

  **The Data:**
  *   **Match Odds:** Home (2.10), Draw (3.50), Away (4.00).
  *   **First Goalscorer:** Dominic Calvert-Lewin (4.50), Carlton Morris (5.00), ... + "No Goalscorer" (9.00).
  *   **Staff Observation:** You notice the sum of percentages on the Goalscorer market looks tight.

  **Running the Protocol:**
  1.  **Check 1 (Match Odds):**
      *   Home: $100 \div 2.10 = 47.6\%$
      *   Draw: $100 \div 3.50 = 28.6\%$
      *   Away: $100 \div 4.00 = 25.0\%$
      *   **Total:** $101.2\%$. **Pass.** (Margin is low, but safe from Dutch Book).
  2.  **Check 1 (First Goalscorer):**
      *   You sum the percentages of all listed players plus "No Goalscorer".
      *   Total comes to **98.5%**.
      *   **Fail.** You have priced the scorers too short. If a punter backs every player and "No Goalscorer", they guarantee a profit.
  3.  **Action:**
      *   Do not just lengthen Calvert-Lewin. If you lengthen him, his percentage drops, but the total might still be under 100%.
      *   **Procedure:** Suspend the First Goalscorer market immediately. Recalculate all prices by dividing the implied probabilities by 0.94 (to build a 6% margin back in).
      *   **Result:** New total is 104.8%. Market reopens.
      *   **Time taken:** 4 minutes.

  ### Case 2: In-Play (The 60th Minute Red Card)
  **Situation:** Match is 1-1. 60th minute. Home team defender gets a straight red. You are taking bets on Match Odds, Next Goalscorer, and Total Corners. Stakes are arriving every 2 seconds.

  **Running the Protocol:**
  1.  **Event:** Red Card confirmed by feed.
  2.  **Protocol Step 2 (In-Play):** **IMMEDIATE SUSPEND.**
      *   *Constraint:* Your manager wants you to keep the board open to capture the "panic money".
      *   *Rule:* You ignore the manager. You hit suspend.
  3.  **Assess:** The Home team win probability must drop. The Away team win probability must rise. The Draw probability might rise (10 men vs 11 often leads to stalemates).
      *   Old Home Win %: 40%. New estimated Home Win %: 25%.
      *   Old Away Win %: 30%. New estimated Away Win %: 45%.
      *   Old Draw %: 30%. New estimated Draw %: 30%.
      *   Total: 100%.
  4.  **Adjustment:** You need to add margin. You inflate the odds slightly to get the total to 106%.
  5.  **Resume:** Reopen markets.
  6.  **Time taken:** 35 seconds.
      *   *Note:* If you had stayed open during those 35 seconds, a punter with a faster feed could have backed the Away team at the old price (which was too high) before you adjusted. By suspending, you protect the book.

  ### Case 3: The Unpopular Truth (High Volume, Stale Price)
  **Situation:** This is the one your manager won't like. It's 89th minute. A heavy favourite (Man City) is drawing 0-0 with a bottom-table side. Suddenly, City score.
  **The Problem:** Your data feed lags by 5 seconds. Your Match Odds board is still showing "Draw" at 2.50 and "Away Win" at 15.00. The "Over 0.5 Goals" market is still open at 1.20.
  **The Pressure:** £50,000 has landed in the last 10 seconds. The phone is ringing. Your manager is shouting, "Don't suspend, we're killing it on turnover!"

  **Running the Protocol:**
  1.  **Observation:** You know the goal has happened (you saw it on TV/stream), but your official feed hasn't updated the clock/status yet. Your prices are now factually wrong.
  2.  **Check 1 (Logic):** The "Draw" odds imply a ~40% chance. The reality is now 0%. The "Away Win" implies ~6%. Reality is near 0%.
  3.  **The Conflict:** If you stay open, you are offering bets on an event that has already concluded (the draw is no longer possible). This is a "past posting" vulnerability, a form of Dutch Book where the punter knows the outcome and you don't.
  4.  **Action:** **SUSPEND ALL MARKETS.**
      *   *Why:* Even though you are taking £5k a second, every single pound is a liability. If the punter knows the goal is in and you don't, they are betting with 100% knowledge against your 0%.
      *   *The "Patch":* You cannot patch a single price. The entire state of the game has changed.
  5.  **Outcome:** You suspend for 45 seconds to update the scoreline and reprice.
      *   *Manager Friction:* You lose £200k in potential turnover during the suspension.
      *   *Reality:* If you stayed open, a syndicate would have taken £50k on the "Draw No Bet" or "Next Goalscorer" at stale prices. You would have paid out £100k on a certainty.
      *   *Protocol Verdict:* **Suspend.** It is better to explain a loss of turnover to your manager than a loss of capital. Turnover is vanity; liability is sanity.

  ***

  # A Note on Your Understanding
  You asked to be told if you'd misunderstood the Dutch Book idea. You haven't. You've identified the practical risk: **Incoherence.**

  However, one nuance: A Dutch Book usually refers to a set of bets across *different* outcomes that guarantee a profit. In your job, the most common version is simply **Arbitrage**.
  *   **Dutch Book (Strict):** I bet on Home, Draw, and Away with *you* in such a way that I win regardless. (This happens if your total % is under 100%).
  *   **Arbitrage:** I bet Home with *you* and Away with *another bookie* to guarantee profit.

  Your procedure above protects you primarily from the strict Dutch Book (your own prices summing to <100%). It also protects you from internal arbitrage (e.g., backing "Home Win" and "Draw or Away" with you simultaneously for a guaranteed return).

  It does **not** protect you from external arbitrage (your prices being different from Bet365's). That requires market monitoring, not probability checks. But for the specific fear you described—clever punters stitching together bets on *your* board to lock in a profit—this protocol closes the door.

  Stick to the 100% Rule. If the percentages don't add up, the maths is broken. No amount of football knowledge fixes broken maths.
