answer: |-
  There is no single canonical name for this move in the way "Ad Hominem" or "Straw Man" exist, but it is a recognized and well-trodden pattern in meta-ethics, philosophy of mind, and neuroethics. The move is best described as **Phenomenal-Functional Decoupling** (or **Functional Decoupling of Thick Concepts**).

  It sits at the intersection of three literatures: **Conceptual Engineering**, **Thick Ethical Concepts**, and **Functionalist Philosophy of Mind**.

  Here is the carving you are looking for: what the move is, when it is valid, when it is a sleight of hand, and how it differs from the nearest candidates.

  ### 1. The Move: Phenomenal-Functional Decoupling

  The advocate's move relies on a specific metaphysical claim: **Multiple Realizability of Normative Roles.**

  *   **The Structure:** The advocate takes a concept $C$ (e.g., Pain, Courage) which is standardly understood as a unity of Phenomenology $\Phi$ (what it feels like) and Function $F$ (what it does).
  *   **The Claim:** The advocate asserts that $F$ is the *essence* of $C$, and $\Phi$ is merely a contingent substrate. Therefore, one can instantiate $F$ without $\Phi$ and still legitimately claim to have preserved $C$.
  *   **The Critic's Counter:** The critic asserts that for certain concepts, $\Phi$ is *constitutive* of $F$'s value or identity. To remove $\Phi$ is not to preserve $C$ in a new form, but to replace $C$ with a simulacrum $C'$ that lacks the normative weight of the original.

  In the literature on **Conceptual Engineering** (e.g., Herman Cappelen, Sally Haslanger, David Chalmers), this is a dispute over the **Continuity Constraint**. When we engineer a new concept (e.g., "Pain without Suffering"), does it connect sufficiently to our old practices and values to count as an improvement of *that* concept, or is it a replacement? The advocate claims continuity (it's still pain/protection); the critic claims discontinuity (it's just a reflex).

  ### 2. The Carving: Instrumental vs. Constitutive Dependence

  You asked for the boundary where this stops being a genuine dissociation and starts being a sleight of hand. The carving lies in the distinction between **Instrumental** and **Constitutive** value.

  **Zone 1: Genuine Dissociation (Instrumental Dependence)**
  This applies when the phenomenology is merely a vehicle for the function.
  *   *Example:* A warning light on a dashboard. The "alarm" function can be achieved by a red light, a buzzer, or a haptic vibration. The specific "feel" of the buzzer is irrelevant to the function of "alerting the driver."
  *   *Application to Pain:* If pain were *only* a damage signal, the advocate is right. Pain asymbolia (where patients feel pain but don't mind it) proves the neural pathways for sensation and aversion can be dissociated.
  *   *Validity:* High. This is standard functionalism.

  **Zone 2: The Sleight of Hand (Constitutive Dependence)**
  This applies when the phenomenology is part of *what makes the function valuable* or *what defines the concept*.
  *   *Example:* Courage. Courage is not just "acting in danger." It is "acting in danger *despite fear*." If you remove the fear (the negative phenomenology), you do not have "improved courage"; you have "fearlessness" or "recklessness." The value of courage *depends* on the negative phenomenology it overcomes.
  *   *Example:* Grief. Grief is not just "processing loss." It is the *painful* recognition of value. A "positive gradient" response to death might be acceptance or relief, but it cannot be grief. To abolish the suffering of grief is to abolish the recognition of the loss's significance.
  *   *Validity:* Low. This is where the move fails. The advocate is preserving the *behavioral output* while discarding the *normative input* that gave the behavior its moral status.

  **The Test:** Ask, "Does the value of this state depend on its valence?"
  *   If the answer is **No** (e.g., withdrawing a hand from a stove), decoupling is valid.
  *   If the answer is **Yes** (e.g., forgiving an enemy, mourning a death, facing a moral dilemma), decoupling is a sleight of hand. It preserves the name while gutting the normativity.

  ### 3. The Literature

  While there is no single label, the argument appears in three specific domains:

  **A. Thick Ethical Concepts (Bernard Williams, John McDowell)**
  This is the most precise philosophical home for your second instance. A "thick concept" (like *cruel*, *courageous*, *brutal*) combines description and evaluation.
  *   *The Advocate's Error:* They treat thick concepts as **thin concepts** (purely descriptive/functional) that can be re-engineered.
  *   *The Critic's Insight:* You cannot separate the evaluation from the description without losing the concept. "Courage" without the possibility of being daunted is not courage.
  *   *Reference:* Bernard Williams, *Ethics and the Limits of Philosophy* (1985).

  **B. The Experience Machine & Integrity (Robert Nozick, Michael Sandel)**
  This covers the "nothing at stake" objection.
  *   *Nozick:* We want to *do* things, not just have the experience of doing them. A simulated courage is not courage.
  *   *Sandel:* In *The Case Against Perfection* (2007), Sandel argues against genetic enhancement using the "Argument from Giftedness." Removing struggle and suffering removes the "openness to the unbidden," which is necessary for humility and solidarity.
  *   *Reference:* Robert Nozick, *Anarchy, State, and Utopia* (1974); Michael Sandel, *The Case Against Perfection* (2007).

  **C. Transhumanist Ethics (David Pearce vs. Critics)**
  The specific debate you are reading (abolishing suffering) is central to the "Hedonistic Imperative."
  *   *Advocate:* David Pearce. He argues for "gradients of intelligent bliss" where information is preserved but valence is inverted.
  *   *Critic:* David Benatar, Michael Hauskeller. They argue that suffering provides epistemic access to reality (e.g., injustice hurts because it *is* bad). Removing the pain removes the epistemic signal.
  *   *Reference:* David Pearce, *The Hedonistic Imperative* (1995); Michael Hauskeller, "Nozick's Experience Machine and the Value of Suffering" (2010).

  ### 4. Distinction from Nearest Candidates

  You correctly noted this is not ordinary equivocation or weakening. Here is how to distinguish it:

  **Vs. Equivocation**
  *   *Equivocation:* Using word $W$ in Sense A, then switching to Sense B mid-argument.
  *   *This Move:* The advocate insists there is only **one sense** (the functional one), and that the phenomenology was never part of the definition. It is a **metaphysical revision**, not a linguistic slip. They are claiming, "You thought $C$ included $\Phi$, but you were wrong about the nature of $C$."

  **Vs. Retreating to a Weaker Claim**
  *   *Weakening:* "Okay, maybe it's not *true* courage, but it's *good enough*."
  *   *This Move:* "It *is* courage, in fact it is *purer* courage." The advocate claims an **improvement**, not a concession. They argue the phenomenology was "noise" interfering with the "signal."

  **Vs. The Naturalistic Fallacy**
  *   *Naturalistic Fallacy:* Deriving an 'ought' from an 'is'.
  *   *This Move:* It is the reverse. It derives a new 'is' (a new biological state) from an 'ought' (we ought not to suffer), and then claims the new 'is' preserves the old values. It is a **Normative-Descriptive Collapse**.

  ### 5. Proposed Name

  If you need a label for this specific maneuver in your own writing, I propose:

  **The Functionalist Gambit**
  *Definition:* The argumentative move of redefining a normatively thick concept by isolating its functional role from its phenomenological ground, asserting that the function can be preserved without the phenomenology, thereby bypassing the normative constraints that depended on that phenomenology.

  **Why this fits:**
  1.  **Functionalist:** It relies on the philosophy of mind claim that mental states are defined by what they do, not what they feel like.
  2.  **Gambit:** It acknowledges the strategic nature. The advocate is sacrificing the "essence" (phenomenology) to save the "utility" (function), betting the critic won't notice the value has evaporated.

  ### Summary for your Analysis

  When you encounter this exchange, you can categorize it as follows:

  1.  **Identify the Concept:** Is it **Thin** (e.g., "withdrawal reflex") or **Thick** (e.g., "courage," "grief")?
  2.  **Apply the Constitutive Test:** Does the value of the concept depend on the negative valence?
      *   If **No** (Reflex): The advocate is correct; this is **Functional Decoupling**.
      *   If **Yes** (Virtue/Meaning): The advocate is committing the **Functionalist Gambit**. They are preserving the *label* and the *behavior* while discarding the *moral reality*.
  3.  **Locate the Loss:** Point out that by removing the "sting" of suffering, they are not just removing pain; they are removing the **stakes**. A world without the possibility of being daunted is a world without courage. A world without the pain of loss is a world without the recognition of value.

  The advocate is not lying; they are proposing a **Conceptual Engineering** project. But your suspicion is correct: in the domain of meaning and virtue, the "substrate" (the suffering) is not separable from the "function" (the growth/meaning). To remove the former is to eliminate the latter.
