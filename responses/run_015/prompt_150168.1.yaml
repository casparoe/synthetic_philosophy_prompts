answer: |-
  This is an exceptionally sharp critique. You have identified the central methodological tension in experimental philosophy (X-Phi), often called the "restrictionist" challenge. You are asking about the *inferential bridge* between empirical data (survey responses) and philosophical conclusions (conceptual structure).

  Here is an analysis of the presuppositions, the underdetermination, and the methodological implications, with confidence ratings attached to each claim.

  ### 1. What the Practice Presupposes

  To move from "80% said yes" to "the concept of intentional action includes moral judgment," the practice relies on three layers of presupposition.

  **A. The Transparency Presupposition (Epistemological)**
  *   **Claim:** Survey answers are transparent windows into underlying cognitive competence. It assumes that when a subject says "yes," they are reporting the output of their concept-application mechanism, not a performance error, a guess, or a conversational accommodation.
  *   **Confidence:** **High (90%)**. This is the standard assumption in early X-Phi. Without it, the data is just noise.
  *   **Necessary vs. Comfortable:** This is **strictly necessary** for the strong conclusion (that the *concept* itself is moralized). If answers are not transparent, you cannot claim to have mapped the concept. However, the field can survive comfortably if it weakens the claim to "this is how the concept is *applied* under load."

  **B. The Uniformity Presupposition (Metaphysical)**
  *   **Claim:** There is a single, shared "folk concept" of intentional action. It assumes that variance in answers is noise, not evidence that different subgroups possess different concepts (e.g., that "intentional" means something different to a utilitarian than a deontologist).
  *   **Confidence:** **High (85%)**. Most seminal papers assume a unified target.
  *   **Necessary vs. Comfortable:** **Strictly necessary** for the "Knobe Effect" to be a singular discovery. If concepts vary by culture or ideology (which later studies suggested they do), the claim becomes "some people moralize intentionality," which is less philosophically explosive.

  **C. The Expertise Asymmetry Presupposition (Methodological)**
  *   **Claim:** This addresses your point about disagreements. The practice presupposes that *philosophers are not the experts* on the meaning of ordinary words like "intentional." It assumes the "folk" are the authorities on their own linguistic usage.
  *   **Confidence:** **High (95%)**. This is the defining ethos of X-Phi against armchair philosophy.
  *   **Necessary vs. Comfortable:** **Strictly necessary** for the field's identity. However, the *application* is underdetermined. When folk answers are inconsistent (e.g., framing effects), X-Phi sometimes pivots to saying the folk are "confused" (treating them like bad witnesses) to save the concept's coherence. This is the asymmetry you noticed.

  ### 2. Where It Is Underdetermined (Rival Theories)

  You asked what rival theories license the exact same practice. This is the crux of the problem. The data pattern (Harm=Yes, Help=No) is compatible with at least three distinct cognitive architectures. The survey method *alone* cannot distinguish them.

  **Theory 1: The Constitutive View (Knobe's Original Claim)**
  *   **Mechanism:** Moral judgment is a *feature* of the concept. To apply "intentional," you must first assess badness.
  *   **Fit:** Perfectly fits the data.
  *   **Confidence:** **Medium (60%)**. This was the dominant view for a decade, but has lost ground to pragmatic explanations.

  **Theory 2: The Pragmatic View (Adams, Steudler, etc.)**
  *   **Mechanism:** The concept is purely descriptive (causal + mental state). However, saying "he intentionally did X" conversationally implicates "he is to blame for X." In the Harm case, the subject wants to assign blame, so they say "yes." In the Help case, they don't want to assign praise (or the bar for praise is higher), so they say "no."
  *   **Fit:** Perfectly fits the data.
  *   **Confidence:** **High (80%)**. Current literature leans heavily here. It explains why the effect disappears if you ask "Is he *to blame*?" separately.

  **Theory 3: The Bias/Emotion View (Nadelhoffer, etc.)**
  *   **Mechanism:** The concept is descriptive, but negative moral outcomes trigger emotional arousal that biases the application of the concept (like a glare on a lens).
  *   **Fit:** Perfectly fits the data.
  *   **Confidence:** **Medium (65%)**. Plausible, but harder to isolate from pragmatics.

  **Why this is underdetermined:** All three theories predict the exact same Yes/No distribution on the standard survey. The practice (running the survey) does not change regardless of which theory is true.

  ### 3. If Answers Track Blame or Pragmatics: Methodological Shifts

  If we assume the Pragmatic or Blame view (which many now do), the methodology and reporting must change in specific ways to remain valid.

  **A. Change in Question Wording**
  *   **Current:** "Did he intentionally X?"
  *   **Required:** "Is it *correct to say* he intentionally X?" or "Did he X *in order to* Y?"
  *   **Reasoning:** Pragmatics affect assertion conditions, not necessarily truth conditions. If you ask about "correctness of speech," you capture the pragmatic norm. If you ask about "in order to," you test the mental state directly.
  *   **Confidence:** **High (90%)**. This is standard practice in linguistics to separate semantics from pragmatics.

  **B. Change in Control Measures**
  *   **Current:** Measure intentionality only.
  *   **Required:** Measure Blame, Praise, and Intentionality simultaneously, then run mediation analysis.
  *   **Reasoning:** If Blame mediates the relationship between Outcome (Harm/Help) and Intentionality Judgment, then Intentionality is not the primary target; Blame is.
  *   **Confidence:** **High (95%)**. This is basic causal modeling.

  **C. Change in Reporting Claims**
  *   **Current:** "Our concept of intentional action is moralized."
  *   **Required:** "The *application* of the concept is sensitive to moral context," or "Moral judgment influences the *attribution* of intentionality."
  *   **Reasoning:** This retreats from the metaphysical claim (what the concept *is*) to the psychological claim (how the concept is *used*).
  *   **Confidence:** **High (90%)**. This is the trend in recent literature (e.g., Knobe himself has softened his metaphysical claims).

  ### 4. Your Engineer Case (The "Addiction" Scenario)

  You noted you got stuck on whether your engineer case measured moral valence or agency.
  *   **Diagnosis:** Your case is actually *stronger* than the original Chairman case for detecting the effect, because "addiction" is inherently normative (unlike "environmental impact," which can be ambiguous).
  *   **The Trap:** If people say "Yes, she intentionally addicted them," it might be because "addiction" implies a loss of agency on the part of the teen, which forces a transfer of agency to the engineer.
  *   **What this reveals:** This shows the underdetermination again. Is the "Yes" answer because the act is *bad* (Moral), or because the teens *couldn't stop* (Causal/Agency)? The standard survey cannot tell you. You would need a follow-up: "If the teens could have easily stopped, would she still have intentionally addicted them?"

  ### 5. Confidence Summary & The "Least Sure" Bit

  **Confidence Ratings:**
  *   **Analysis of X-Phi Presuppositions:** High (90%). (This is well-documented in meta-philosophy).
  *   **Identification of Rival Theories:** High (85%). (These are the standard competing models in the literature).
  *   **Methodological Recommendations:** High (90%). (These follow from standard psycholinguistic methods).
  *   **Truth of the Pragmatic View:** Medium-High (75%). (It is the current leading theory, but not settled).

  **The Bit I Am Least Sure Of:**
  *   **The Boundary Between "Concept" and "Concept Application."**
  *   **Confidence:** **Low (50%)**.
  *   **Why:** This is the philosophical hard problem. If a concept is *systematically* applied differently in moral contexts 80% of the time, does it matter if we call that "the concept itself" vs. "a bias in applying the concept"?
      *   If the "bias" is universal and stable, is it functionally identical to a "feature"?
      *   Some philosophers (e.g., contextualists) argue there is no fact of the matter here. The practice of X-Phi *needs* there to be a distinction to make its discoveries interesting (i.e., "We found a bias!" vs. "We found a definition!"), but the cognitive reality might not respect that boundary.
      *   I am least sure whether this distinction is a genuine cognitive reality or just a philosophical convenience to save the idea of "pure" concepts.

  ### Summary for Your Paper/Thoughts
  You are correct to feel stuck. The leap from "Folk say X" to "Concept is X" is not licensed by the survey method alone; it requires a theoretical commitment to **Transparency** and **Uniformity**. If you swap in the **Pragmatic View**, the methodology must shift from measuring *truth conditions* (Did he do it?) to *assertability conditions* (Is it right to say he did it?), and the philosophical conclusion must retreat from "Intentionality is moral" to "Intentionality attributions are tools for blame."

  The asymmetry you noticed (Folk vs. Expert) is the field's unresolved tension: The Folk are treated as experts on *usage*, but as novices on *consistency*. When they are inconsistent, the "Folk Authority" is quietly suspended.
