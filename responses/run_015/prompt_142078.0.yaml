answer: |-
  I recommend we award the grant conditional on a mandatory restructuring of the research question during the first two years.

  The scientific merit of this proposal is undeniable. The consortium promises new wage and price series, refined coal-transport cost estimates, and robust paleoclimate reconstructions. These are tangible assets that will outlast the specific hypotheses they are built to test. However, a foundation investing $45 million must ensure that the engine driving this data collection is not merely powerful, but steered correctly. My unease lies not in the methods, but in the framing of the central question: "Why Britain and not China industrialised first." While this headline is compelling, it risks being a category error that no amount of data can resolve.

  To understand the risk, we must distinguish between asking why an event happened and asking why it happened rather than something else. Explanations are inherently contrastive. What counts as a valid answer depends entirely on the contrast class—the specific alternative scenario we are comparing against. If we ask why Britain industrialised rather than the Netherlands, the answer lies in coal geography and state structure. If we ask why Britain industrialised rather than the Yangzi Delta, the answer shifts to global trade and colonial resources, as Kenneth Pomeranz has argued. If we ask why Britain rather than inland China, the answer shifts again to local market integration. The current proposal treats "China" as a monolithic foil equivalent to "Britain." This is empirically unstable. When the foil changes, the explanation changes, not because the evidence differs, but because the question has secretly shifted.

  This instability is compounded by a mismatch of scale. Britain around 1800 was a state of ten million people with a specific fiscal-military structure. Qing China was a continental empire of three hundred million. Treating these as comparable units of explanation is akin to comparing a single firm with an entire industry. One historian on our panel argued that asking "why not China" is simply asking "what happened," dressed in rhetorical costume. This is incorrect. "What happened" is narration; "why not China" implies a counterfactual test. But a test requires controlled variables. If the units are not comparable, the variables cannot be controlled, and the result is not a test but a story.

  I recognise the strength of the case for funding as proposed. The applicants argue that a contrastive framing is precisely what makes a historical question answerable at all; without a foil, there is nothing to test. They contend that "Britain vs. China" is the only foil large enough to justify a $45 million investment, and that refining the contrast class is a detail for the research phase, not a condition for funding. Furthermore, several board members worry that publicly deflating a flagship question looks less like methodological scruple and more like political timidity. They argue that a foundation which cannot state its question in a headline will struggle to attract co-funders and public attention. "Why Britain and not China" is a hook; "Why Britain and not the Yangzi Delta given specific institutional constraints" is not.

  These arguments are strong, but they ultimately lose because they prioritise the appearance of rigor over its substance. The applicants are right that contrast is necessary for testing, but wrong that any contrast will do. If the contrast class is ill-defined, the test is invalid. Funding this proposal without conditions risks purchasing seven years of sophisticated data collection aimed at a target that moves every time a researcher changes their definition of "China." Regarding the board's worry about headlines: a refined question is still headline-friendly, provided it is communicated as a precision upgrade rather than a retreat. It is better to launch with a question we can answer than to spend $45 million proving that the question we asked was wrong. The reputational risk of funding a methodological flaw is far greater than the risk of refining a headline.

  Therefore, I propose we fund the consortium, but only if they accept conditions that force them to pass what I call the discrimination test. Any proposed answer must name a specific foil, state what would have had to be different for the outcome to have gone the other way, and show that its favoured factors were absent, or present to a different degree, in that foil. The consortium must demonstrate that their contrast class is comparable in scale and structure, or explicitly model the scale difference as a variable rather than ignoring it.

  To ensure this is not merely rhetorical compliance, the following conditions must be written into the grant agreement:

  1.  **Deliverable:** By the end of Year Two, the consortium must submit a methodological framework paper that explicitly defines the contrast class used for all major hypotheses. This paper must identify the specific region or polity serving as the foil to Britain (e.g., Yangzi Delta, Qing Empire, etc.) and justify the comparability of units.
  2.  **Verification:** Compliance will be verified by a joint review panel consisting of two Foundation staff members and one external methodological reviewer appointed by the Foundation (distinct from the scientific reviewers). This reviewer must be selected for expertise in comparative historical methodology, not merely subject matter.
  3.  **Failure Condition:** Funding for Years Three through Seven will be withheld if the review panel determines that the consortium has failed to define a stable contrast class or if the defined contrast class renders the primary hypotheses untestable due to scale mismatch. Specifically, if the consortium continues to treat "China" as a monolithic unit equivalent to "Britain" without modeling the internal variance, this will count as failure.
  4.  **Restructuring:** If the review panel identifies a scale mismatch, the consortium must restructure the work plan for the remaining five years to align with the validated contrast class. This may involve narrowing the geographic scope of the Chinese data collection or altering the comparative models.

  This approach preserves the value of the data collection while safeguarding the intellectual integrity of the investment. It acknowledges that the applicants are experts in history and climate, but asserts that the Foundation has a duty to ensure the questions asked are capable of bearing the weight of the answers sought. We are not here to fund narration dressed as science; we are here to fund questions that can be settled. By imposing these conditions, we ensure that when the headlines arrive, they are backed by a framework that holds up to scrutiny.
