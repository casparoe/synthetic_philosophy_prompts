  ### Where the accretion picture stalls

  Your accretion picture is intuitive, but it mistakes temporal sequence for metaphysical independence. You say the patient colleague built her character stone by stone. I ask: who placed the stones? At each moment of revision, she chose to pause rather than snap. But why did she choose that? Because she found reasons for patience compelling. Why did those reasons strike her as compelling? Because of the way she was at that moment. Even if she was slightly less impatient than before, the mechanism that evaluated the reasons and effected the change was given to her, not by her.

  If your actions flow from your character, and your character flows from prior actions plus heredity and environment, you are not the ultimate source. Your "revisability condition" simply describes the mechanism of change without accounting for the source of the mechanism. To be responsible for the revision, you must be responsible for the principles by which you revise. But you didn't choose those principles. They are part of the "way you are" that you inherited. The regress isn't stopped; it's merely hidden inside the word "revisability." You can revise, yes, but only within the limits of a mental architecture you did not design. The luck remains because the capacity to respond to reasons is itself a matter of luck. Some people can revise; others cannot. Why? Because of how they are. If you didn't choose that capacity, you are not ultimately responsible for what flows from it. The path across the stream is real, but the bridge-builder is a product of the very terrain she claims to master. Swapping origination for revisability changes the vocabulary, not the ontology. You still require the agent to be the cause of herself, just over a longer timeline. But time does not cure causation. Every step of the accretion is determined by the prior state of the agent.

  ### One thing I'll concede

  I will concede that your revisability condition captures exactly what we need for ordinary social life. It distinguishes the manipulative psychopath from the struggling alcoholic. It justifies our practices of holding people accountable without requiring metaphysical magic. It saves the phenomenon of agency as we experience it. It makes sense of our interpersonal relationships. It just doesn't save ultimate moral responsibility.

  ### Back to you

  So you say the capacity to revise is enough. But where does that capacity come from? If two people face the same reasons, and one revises their character while the other does not, what explains the difference? If the explanation lies in their different natures, which they did not choose, how is the reviser ultimately responsible rather than just lucky?
