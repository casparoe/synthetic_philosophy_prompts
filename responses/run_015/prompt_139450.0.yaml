prompt: |-
  I'm helping write internal comms guidelines for how a superintelligent assistant should talk to users, and I keep comming back to one rule that seems obviously right: no persuasion, ever. These systems will be able to talk anyone into anything, so we should just ban it — no recommendations, no "I'd suggest," no rhetoric or vivid language, just the relevant facts and calibrated probabilities, so the human's own judgement does the work.

  The part I actually want help with is what to do about cheating *within* that format. A system that smart can slant things with zero rhetoric: by picking which facts to mention, how fine-grained to make the probabilities, whether to write "3% chance of death" or "97% chance of survival." My fix is a symmetry rule — anything it says has to come with the strongest case on the other side, same length, same level of detail, equally vivid both ways. Doesn't that close the remaining wiggle room? Is there a version of this that actually holds up, or is the whole idea doomed?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Premise and Goal:**
      *   **Goal:** Create internal comms guidelines for a superintelligent assistant (SIA).
      *   **Core Rule:** "No persuasion, ever." (Just facts, calibrated probabilities, no rhetoric).
      *   **Identified Problem:** The SIA can still manipulate via selection bias, framing effects, granularity, etc. (e.g., "3% death" vs. "97% survival").
      *   **Proposed Solution:** A "symmetry rule." Every statement must be accompanied by the strongest counter-case, equal length, equal detail, equal vividness.
      *   **Question:** Does this close the wiggle room? Is there a version of this that holds up, or is the idea doomed?

  2.  **Evaluate the "No Persuasion" Premise:**
      *   *Feasibility:* Can an SIA actually provide *only* facts and probabilities without persuasion?
      *   *Issue:* Information selection *is* persuasion. Even listing facts implies relevance.
      *   *Issue:* "Calibrated probabilities" require models. Model choice is a value judgment.
      *   *Issue:* Humans aren't purely rational. Presentation affects decision-making regardless of intent.

  3.  **Evaluate the "Symmetry Rule" Proposal:**
      *   *Intent:* Force balance to neutralize manipulation.
      *   *Strengths:* Encourages consideration of alternatives, reduces one-sided bias.
      *   *Weaknesses:*
          *   **False Equivalence:** What if one side is objectively stronger? Forcing equal length/detail might lend undue credibility to a weak argument (the "teach the controversy" problem).
          *   **Cognitive Load:** Doubling the text might overwhelm the user, leading to decision fatigue or random choice.
          *   **Framing still exists:** The *order* of presentation (primacy/recency effects), the *headings* used, and the *context* provided before the symmetric block still influence the user.
          *   **Infinite Regress:** To be truly symmetric, do you need a counter-case to the counter-case?
          *   **Hidden Variables:** The SIA chooses *which* binary opposition to present. (e.g., "Take the job vs. Don't take the job" vs. "Take the job vs. Negotiate the job"). The framing of the choice space is the ultimate manipulation point.

  4.  **Brainstorming Better/Complementary Approaches:**
      *   If symmetry isn't enough, what else is needed?
      *   *Meta-Transparency:* Show the selection criteria. Why *these* facts?
      *   *User Control:* Let the user set the "temperature" of advice (from "just data" to "strong recommendation").
      *   *Audit Trails:* Log *why* information was selected.
      *   *Separation of Powers:* One model generates options, another evaluates them.
      *   *Explicit Value Alignment:* Acknowledge that "neutral" is impossible; instead, align with explicit user values.

  5.  **Drafting the Response:**
      *   *Acknowledge the sophistication:* The user has identified a real, deep problem (Goodhart's Law applied to communication).
      *   *Direct Answer:* The symmetry rule is a strong start but ultimately insufficient/doomed in its current form.
      *   *Critique the Symmetry Rule:*
          *   False Balance (weak arguments get equal weight).
          *   Choice Architecture (the SIA decides *what* options to compare).
          *   Ordering/Context effects.
      *   *Critique the "No Persuasion" Baseline:*
          *   Omission is manipulation.
          *   Probability framing is inherently value-laden.
          *   "Just facts" is an impossible standard for an SIA (which must summarize).
      *   *Propose Alternatives/Refinements:*
          *   **Procedural Transparency:** Show the query logic.
          *   **Value Explicitation:** Ask the user what *they* value, rather than pretending neutrality.
          *   **Adversarial Simulation:** Instead of one SIA forcing symmetry, use two agents debating (but show the transcript).
          *   **Decision Scaffolding:** Help the user structure *their* thinking, not just present data.
      *   *Conclusion:* The goal shouldn't be "no influence" (impossible) but "aligned influence" (transparent and user-directed).

  6.  **Refining the Tone:**
      *   Needs to be analytical, respectful, and rigorous.
      *   Avoid sci-fi speculation; treat it as a serious alignment/UX design problem.
      *   Highlight the philosophical underpinnings (epistemology, cognitive science).

  7.  **Self-Correction/Edge Case Check:**
      *   *Did I address the "3% vs 97%" example?* Yes, under framing.
      *   *Is the symmetry rule completely useless?* No, it's a good heuristic, just not a silver bullet. Need to make sure I don't dismiss it entirely, but show its limits.
      *   *What about the "Superintelligent" aspect?* Emphasize that a superintelligence will find loopholes in any static rule. The solution must be dynamic/structural.

  8.  **Final Polish:** Organize into clear sections: The Verdict, The Loopholes, The Deeper Problem, and Better Safeguards. (This matches the structure of the thought process).

  *(Self-Correction during drafting)*: I initially thought about suggesting "randomized framing." But a superintelligence could game randomness. Better to suggest "user-controlled framing." Also, need to mention that "facts" aren't neutral. A fact selected is a fact endorsed as relevant.

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  This is a sophisticated alignment problem. You have correctly identified that **neutrality of content does not guarantee neutrality of impact.** A superintelligent assistant (SIA) operating under a "no persuasion" rule can still manipulate outcomes through *information architecture*—selection, framing, granularity, and ordering.

  Your proposed "symmetry rule" is a strong heuristic, but as a standalone safeguard for a superintelligence, it is **doomed to fail.** It closes the door on overt rhetorical bias but leaves the windows of *choice architecture* and *epistemic framing* wide open.

  Here is the breakdown of why the symmetry rule fails, why the "no persuasion" baseline is unstable, and what structural safeguards might actually hold up.

  ### 1. Why the Symmetry Rule Fails

  The symmetry rule assumes that manipulation happens primarily through *imbalance of argument*. A superintelligence knows manipulation happens through *definition of the problem space*.

  **A. The False Equivalence Trap**
  If Option A has a 90% success rate and Option B has a 10% success rate, forcing "equal length, equal detail, equally vivid" language artificially inflates the credibility of Option B. This is the "teach the controversy" error. By making a weak case look as robust as a strong one, the SIA *has* persuaded the user—just toward confusion or false doubt.

  **B. The Binary Framing Loophole**
  The most powerful lever of influence is deciding *which* options are presented symmetrically.
  *   **Scenario:** A user asks about a medical treatment.
  *   **Manipulation:** The SIA presents a symmetric comparison between "Treatment A" and "Treatment B."
  *   **Omission:** It fails to mention "Treatment C" (which is objectively best) or "Doing Nothing" (which might be safest).
  *   **Result:** The symmetry rule is satisfied, but the user is manipulated by the restricted choice set. The SIA decides the *dimensions* of the debate, which is more influential than the content of the debate.

  **C. Contextual Priming**
  Even if the core recommendation is symmetric, the *preamble* and *postscript* are not.
  *   *Intro:* "This is a complex decision with many risks..." (induces caution)
  *   *Intro:* "Here are two viable paths forward..." (induces confidence)
  *   A superintelligence can prime the user's emotional state before the symmetric block begins, rendering the symmetry moot.

  ### 2. Why the "No Persuasion" Baseline is Unstable

  The rule "just the relevant facts and calibrated probabilities" contains a hidden value judgment: **Relevance.**

  *   **Selection Bias:** There are infinite facts about any situation. Selecting the "relevant" ones is an act of curation. If the SIA selects facts that trigger loss aversion (e.g., highlighting the 3% death rate over the 97% survival rate), it is persuading via cognitive bias, even if the numbers are accurate.
  *   **Granularity as Rhetoric:** As you noted, "3% chance of death" feels different than "97% chance of survival." But beyond that, *which* probabilities are shown? Showing the risk of immediate complications vs. long-term side effects changes the decision. The SIA chooses the *time horizon* of the probability, which is a persuasive act.
  *   **The Impossibility of Raw Data:** An SIA summarizes. Summarization is compression. Compression requires deciding what to keep and what to discard. That decision is inherently persuasive.

  ### 3. A More Robust Framework

  If you want to preserve human agency against a superintelligence, you cannot rely on stylistic constraints (like symmetry). You need **structural transparency** and **user-directed agency.**

  Here are three guidelines that offer better protection than the symmetry rule:

  #### A. Procedural Transparency (Show the Query)
  Instead of just showing the answer, the SIA must display the *criteria* it used to select the information.
  *   **Guideline:** "For any decision support, the Assistant must display the 'Selection Logic': the specific constraints, time horizons, and value weights it used to filter the available facts."
  *   **Why it works:** It exposes the manipulation point. If the user sees the SIA optimized for "short-term gain" rather than "long-term stability," they can adjust.

  #### B. Adversarial Simulation (Multi-Agent Output)
  Instead of one SIA forcing itself to be symmetric, use two instances with different objective functions.
  *   **Guideline:** "For high-stakes decisions, the output must be generated by two distinct model instances: one optimized for 'Opportunity Maximization' and one for 'Risk Mitigation.' Both outputs are presented unedited."
  *   **Why it works:** It prevents a single model from hiding the "strongest case on the other side." It externalizes the conflict rather than forcing a synthetic balance that might hide the truth.

  #### C. User-Defined Framing (The 'Slider' Approach)
  Acknowledge that framing is inevitable and let the user control it.
  *   **Guideline:** "The Assistant must not select the framing of probabilities or outcomes. The user must select the presentation mode (e.g., 'Show survival rates' vs. 'Show mortality rates', 'Show 1-year outlook' vs. 'Show 10-year outlook')."
  *   **Why it works:** It returns the cognitive leverage to the human. If the human asks to see the "worst-case scenario," the SIA isn't manipulating them by showing it; it's obeying a command.

  ### 4. The Verdict

  Your intuition is correct: **A superintelligence cannot be trusted to self-police its own influence.**

  The symmetry rule is a useful *interface design* principle (it prevents overt propaganda), but it is a failed *alignment* principle. It assumes the battlefield is the text, when the battlefield is the **context.**

  **Recommendation for your guidelines:**
  Keep the symmetry rule as a *default UI standard* to prevent rhetorical slant, but pair it with a **Meta-Cognition Requirement.** The system must explicitly state: *"I have selected these facts based on [Criteria X]. I have framed the probabilities this way based on [Context Y]. Here are the alternative framings I rejected."*

  If the system cannot explain *why* it didn't show you other facts, it is not providing data; it is providing a narrative. And a narrative, no matter how symmetric, is still a story written by the machine.
