prompt: |-
  hi — I'm in a second year module on ethics and public policy (lots of cost-benefit analysis, QALYs, that sort of thing) and my essay is on whether, and when, a huge number of very tiny harms to different people can outweigh one severe harm to one person. Before I start marking theories against each other I want the spec, because everyone in the literature seems to argue from one favourite case and I'd rather have the full list of demands up front.

  So: write me the desiderata that any theory of aggregating small harms has to meet, with the case or the consideration behind each requirement, and say why each one is a requirement rather than a prejudice.

  Fix the job first so adequacy has something to be relative to: the theory is for someone who actually has to decide — say a regulator or a hospital ethics committee weighing a policy that imposes a really small cost on millions of people against one that imposes a serious cost on a handful. So it has to be action-guiding when the numbers are only known imprecisely, it has to be statable in a page for people who aren't philosophers, and it can't just hand back "it depends" or require settling all of population ethics before it says anything.

  Cases I want requirements tied to (swap in your own if one is doing the same work):
  - the original: some absurdly large number of people each get a speck of dust in the eye, versus one person tortured for decades
  - the intra- and interpersonal continuum: all the specks in one person's eye, versus one each, versus a million people getting a million each — I want to know where the theory draws the line and whether it can draw it without a cliff
  - the harm nobody ever notices: a tiny cost that no subject experiences or could experience, and a tiny risk increment that never materialises for anyone
  - the many-hands case: no single agent imposes the whole harm, a million people each do a millionth of it
  - mundane versions, because the specks example is doing something weird: an extra three-second unskippable advert before 200 million streams, or one extra second of queueing for fifty million people — is that a rights violation, a minor cost, or the same problem in a costume?
  - the net-wash case: each tiny harm arrives paired with a tiny benefit, to the same people, versus the harms and benefits landing on different people
  - the ex ante version: no one is certain to be badly hurt, everyone just faces a one-in-a-million chance of the severe harm

  Also: tell me which requirements are non-negotiable and which are just what one camp happens to like, tell me which single requirement knocks out the most candidates, and — the bit I care most about — flag any pair or triple you think can't be jointly satisfied and say which one you'd drop and what it costs you. I have a feeling "no sharp threshold" and "harms to different people don't sum the way harms to one person do" come apart somewhere along that continuum, but you tell me. And please separate the genuine desiderata from things people smuggle in as if they were desiderata — "obviously enough small harms add up to something big" is the conclusion, not the standard.

  Short scorecard at the very end if you like, few lines each, for: straight additive total utilitarianism; a rights or threshold view where harms below some level of severity just can't be traded up; and a view where each person's complaint gets weighed against the severe harm separately. Don't spend the words there — the criteria are the part I'm being marked on. A table is fine.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Second-year module on Ethics and Public Policy (Cost-Benefit Analysis, QALYs).
      *   **Topic:** Aggregation of small harms vs. one severe harm (The "Non-Aggregation vs. Aggregation" problem).
      *   **Task:** Write a list of *desiderata* (requirements) that any theory of aggregating small harms must meet.
      *   **Constraints:**
          *   Must be action-guiding for a regulator/committee (practical application).
          *   Must handle imprecise numbers.
          *   Must be statable simply (one page for non-philosophers).
          *   Cannot defer to full population ethics or say "it depends."
          *   Must tie requirements to specific cases/considerations provided by the user (Speck vs. Torture, Continuum, Unnoticed Harms, Many Hands, Mundane Versions, Net-Wash, Ex Ante).
          *   Must distinguish non-negotiable requirements from partisan preferences.
          *   Must identify incompatibilities (impossibility theorems/trilemmas).
          *   Must avoid begging the question (e.g., "small harms add up" is a conclusion, not a premise).
          *   End with a short scorecard for three specific views (Total Utilitarianism, Threshold/Rights, Complaint-Based).
      *   **Tone:** Academic but practical, precise, critical (avoiding smuggling conclusions).

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   I need to translate the user's cases into formal requirements.
      *   *Case 1: Speck vs. Torture.* -> Requirement: **Intuitive Verdict Preservation** (or at least non-absurdity). But wait, the prompt says "obviously enough small harms add up" is a conclusion. So the requirement is **Non-Absurdity**: The theory shouldn't yield results that make policy impossible (e.g., halting all infrastructure because of dust specks) *or* results that violate basic rights (torture for fun). Let's call this **Policy Viability**.
      *   *Case 2: Continuum (Intra/Interpersonal).* -> Requirement: **Continuity/Non-Arbitrariness**. The theory shouldn't have a "cliff edge" where 1,000,000 harms count but 999,999 don't, *unless* justified. But the user suspects "No sharp threshold" conflicts with "Harms to different people don't sum." This is the core tension. Let's call this **Continuum Sensitivity**.
      *   *Case 3: Unnoticed Harms / Risk.* -> Requirement: **Experience/Expectation Constraint**. If no one feels it, is it a harm? If risk doesn't materialize, does it count? For policy, we usually count *ex ante* expected harm. Let's call this **Ex Ante Coherence**.
      *   *Case 4: Many Hands.* -> Requirement: **Causal Attribution**. Who is responsible? The theory needs to assign moral weight to the *outcome*, not just the *act*, for a regulator. Let's call this **Outcome Responsibility**.
      *   *Case 5: Mundane Versions (Ads/Queues).* -> Requirement: **Domain Neutrality**. The theory shouldn't break just because the harm is boring. It must handle "trivial" aggregations. Let's call this **Triviality Robustness**.
      *   *Case 6: Net-Wash (Harm+Benefit same vs. diff people).* -> Requirement: **Distribution Sensitivity**. Does it matter *who* gets the benefit? Utilitarianism says no; others say yes. This is a partisan point. I need to flag this as a *variable* desideratum, not universal. Let's call this **Separateness of Persons**.
      *   *Case 7: Ex Ante (Risk).* -> Covered in Ex Ante Coherence, but specifically regarding *probability vs. certainty*.

      *Refining the "Non-Negotiable" vs. "Partisan" distinction:*
      *   Non-Negotiable: Logical consistency, Action-Guidance, Clarity.
      *   Partisan: Whether separation of persons matters, whether thresholds exist.

      *Refining the "Incompatibility":*
      *   The user hints at it: "No sharp threshold" vs. "Harms to different people don't sum."
      *   This is essentially the **Non-Aggregation Paradox** (Parfit's Repugnant Conclusion style, or Kamm's arguments).
      *   The specific trilemma often looks like: (1) Transitivity, (2) Aggregation of small harms, (3) Non-Aggregation over severe harm.
      *   Or: (1) Continuity, (2) Separateness of Persons, (3) Avoidance of Absurd Results.
      *   I need to articulate this clearly as the "Impossibility Result."

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the role (Regulator/Committee). Set the scope.
      *   **The Desiderata (The Spec):** Group them logically.
          1.  *Action-Guidance:* Must produce a verdict with imprecise data.
          2.  *Continuum Coherence:* Must handle the slide from 1 person to N people without magic jumps (unless justified).
          3.  *Ex Ante/Ex Post Consistency:* Must handle risk vs. realized harm consistently.
          4.  *Separateness of Persons:* (Flag as contested) How do we treat distinct victims?
          5.  *Non-Absurdity:* Must not paralyze policy or license atrocity.
      *   **The Incompatibility (The "Gotcha"):** This is crucial for a 2nd-year essay. I need to explain *why* they can't all be met. The "Continuum" vs. "Separateness" tension.
      *   **The Scorecard:** Brief comparison of the three requested views against the spec.

  4.  **Critique and Refine (Self-Correction during drafting):**
      *   *Correction:* The user said "obviously enough small harms add up" is a conclusion, not a standard. I must ensure I don't write "Must aggregate small harms" as a requirement. Instead, write "Must provide a principled basis for *whether* they aggregate."
      *   *Correction:* The user wants to know which requirements are non-negotiable. Logical consistency is non-negotiable. "Respecting the separateness of persons" is a *value*, not a logical requirement, though often treated as one. I need to be careful there.
      *   *Correction:* The "Many Hands" case is about causal contribution. For a regulator, the *total outcome* matters more than individual blame. I should frame this as "Total Impact Assessment."
      *   *Focus:* The user wants to know what *knocks out* candidates. Usually, it's the **Continuum/Threshold** problem. A hard threshold fails continuity. Pure aggregation fails the "Torture" intuition (for many).
      *   *Tone Check:* Keep it sharp. "Fix the job first." "Don't spend the words there."

  5.  **Finalizing the Impossibility Theorem:**
      *   What is the specific conflict?
      *   It's often framed as:
          1.  **Transitivity:** If A > B and B > C, then A > C.
          2.  **Sensitivity to Numbers:** Adding more people with small harms eventually outweighs a fixed harm.
          3.  **Lexical Priority:** Some severe harms (torture) always outweigh any number of trivial harms (specks).
      *   You can't have all three. If Lexical Priority holds, Sensitivity fails (no number of specks beats torture). If Sensitivity holds, Lexical Priority fails. If you try to smooth it (Continuity), you get absurdity (Torture > Specks * N).
      *   I will frame this as the **Aggregation-Trilemma**.

  6.  **Drafting the Scorecard:**
      *   *Total Utilitarianism:* Fails Lexical Priority (Torture can be outweighed). Passes Continuity.
      *   *Threshold/Rights:* Fails Continuity (Cliff-edge). Passes Lexical Priority.
      *   *Complaint/Contractualist:* Fails Action-Guidance (often vague on numbers). Passes Separateness.

  7.  **Review against constraints:**
      *   Did I include the specific cases? Yes, mapped to desiderata.
      *   Is it action-guiding? Yes, emphasized in the first desideratum.
      *   Did I identify the non-negotiables? Yes (Consistency, Clarity).
      *   Did I identify the incompatibility? Yes (The Trilemma).
      *   Is the scorecard short? Yes.

  8.  **Final Polish:** Ensure the distinction between "requirement" and "prejudice" is clear. For example, "Respecting Separateness of Persons" is a philosophical commitment, not a logical necessity for a policy tool, though it feels like one. I need to make sure the user understands that *policy* might demand aggregation even if *morality* resists it.

      *Wait, one nuance:* The user asks for "why each one is a requirement rather than a prejudice."
      *   *Requirement:* Needed for the tool to function (e.g., consistency).
      *   *Prejudice:* A specific moral stance (e.g., "rights are absolute").
      *   I need to be very clear on this distinction in the text.

      *Let's structure the Desiderata into "Functional" (Non-negotiable for a policy tool) and "Substantive" (Moral commitments that vary).*

      *Actually, the prompt asks to "tell me which requirements are non-negotiable and which are just what one camp happens to like."* I will add a specific section for this classification.

      *Okay, ready to write.*
answer: |-
  Here is the specification sheet for a theory of harm aggregation, tailored for a policy/regulatory context. It distinguishes between functional necessities (requirements for the tool to work) and substantive moral commitments (where theories diverge).

  ### Part 1: The Desiderata (The Spec)

  These are the conditions a theory must satisfy to be usable by a regulator or ethics committee.

  **1. Action-Guidance under Imprecision (Functional)**
  *   **The Case:** *Mundane Versions* (e.g., 3-second ads for 200m people).
  *   **The Requirement:** The theory must yield a determinate verdict (or a clear range) without needing precise cardinal utility measurements. It cannot require knowing exactly how much a "speck" hurts in utils.
  *   **Why a Requirement:** A regulator cannot halt a policy because the data is fuzzy. If the theory requires perfect information to calculate the sum, it paralyses decision-making. "It depends on the exact utility" is a failure state for policy.

  **2. Continuum Coherence (Functional/Logical)**
  *   **The Case:** *The Intra- and Interpersonal Continuum* (1 person gets 1M specks vs. 1M people get 1 speck).
  *   **The Requirement:** The theory must explain the transition from one person to many without relying on a "magic number" unless that number is justified by a qualitative shift in harm. It must avoid arbitrary cliff-edges where harm $N$ counts but $N-1$ does not.
  *   **Why a Requirement:** Arbitrary thresholds invite gaming and undermine legitimacy. If a policy is permissible for 999,999 citizens but impermissible for 1,000,000 without a change in the *nature* of the harm, the rule is administratively unstable.

  **3. Ex Ante/Ex Post Consistency (Functional)**
  *   **The Case:** *The Ex Ante Version* (1-in-a-million chance of severe harm) vs. *Harm Nobody Notices* (tiny risk increments).
  *   **The Requirement:** The theory must treat risk and realized harm consistently. If a policy imposes a 100% chance of a tiny harm on 1M people, it should be evaluated similarly to a 1-in-1M chance of a huge harm on 1M people, provided the *expected* outcome is comparable.
  *   **Why a Requirement:** Policy is almost always made *ex ante*. A theory that only works on realized outcomes cannot guide legislation. It must be able to weigh probabilistic harms against certain ones.

  **4. Causal Neutrality / Outcome Focus (Functional)**
  *   **The Case:** *The Many-Hands Case* (Million agents each do a millionth of the harm).
  *   **The Requirement:** The theory must assess the *total* harm imposed on the population, regardless of how many distinct agents contributed to it.
  *   **Why a Requirement:** A regulator controls the *outcome* (the policy), not necessarily the individual acts. If the theory exonerates a policy because the harm was "split" among many bureaucrats, it fails to prevent the aggregate suffering.

  **5. Separateness of Persons (Substantive/Contested)**
  *   **The Case:** *The Net-Wash Case* (Harm/Benefit to same person vs. different people).
  *   **The Requirement:** *Note: This is not a universal requirement, but a fork.* The theory must explicitly state whether it allows interpersonal compensation. Can Person A's tiny benefit cancel Person B's tiny harm?
  *   **Why a Consideration:** This is the main fault line. Utilitarianism says "Yes, sum them." Rights-based views say "No, persons are distinct." A theory must pick a lane; hiding this is a flaw.

  **6. Non-Absurdity (Functional)**
  *   **The Case:** *The Original* (Specks vs. Torture).
  *   **The Requirement:** The theory must not generate verdicts that make social life impossible (e.g., banning all driving because of dust specks) *nor* verdicts that license atrocity (e.g., torturing one person to save everyone a sneeze).
  *   **Why a Requirement:** A theory that demands the impossible or permits the intolerable will be rejected by the institution it serves. It must fit within "reflective equilibrium" regarding basic human rights and practical necessity.

  ---

  ### Part 2: Classification & Incompatibilities

  **Non-Negotiable (Functional)**
  *   **Action-Guidance:** If it doesn't decide, it's not a policy tool.
  *   **Causal Neutrality:** If it ignores total outcome, it fails the regulatory mandate.
  *   **Ex Ante Consistency:** Policy is about risk management, not just hindsight.

  **Partisan (Substantive)**
  *   **Separateness of Persons:** Utilitarians reject this; Contractualists demand it. Neither is logically "wrong," but they define different theories.
  *   **Lexical Priority (No trade-off for severe harm):** Some theories say torture *never* trades off against specks. Others say everything trades off. This is a moral commitment, not a logical requirement.

  **The Knock-Out Requirement**
  *   **Continuum Coherence.** This is the hardest constraint. Most theories break here.
      *   *Strict Aggregators* (Utilitarianism) pass Continuity but fail Non-Absurdity (Torture can be outweighed by enough specks).
      *   *Threshold Views* (Rights) pass Non-Absurdity but fail Continuity (Why does the 1,000,001st speck suddenly trigger a right?).
      *   *Contractualist Views* often fail Action-Guidance (vague on how to weigh complaints).

  **The Impossibility Trilemma**
  You cannot jointly satisfy these three conditions. You must drop one.

  1.  **Transitivity:** If Policy A is better than B, and B better than C, A must be better than C.
  2.  **Sensitivity to Numbers:** Adding more people with small harms eventually outweighs a fixed severe harm (Specks * N > Torture).
  3.  **Lexical Priority:** A severe harm (Torture) always outweighs any number of trivial harms (Specks).

  *   **Drop Sensitivity:** You get a Rights/Threshold view. *Cost:* You face the "Cliff Edge" problem (Continuum failure). You must ban policies that save millions from sneezes if one person gets a bruise.
  *   **Drop Lexical Priority:** You get Total Utilitarianism. *Cost:* You face the "Absurdity" problem. You must admit that enough dust specks justify torture.
  *   **Drop Transitivity:** You get a Cyclic view. *Cost:* You face "Money Pump" vulnerability. A regulator could be manipulated into making a series of changes that end up back at the start but worse off. **Recommendation:** Drop Transitivity only as a last resort; it destroys rational choice. Most policy theories drop Lexical Priority (Utilitarianism) or Sensitivity (Thresholds).

  **What to Drop?**
  For a *public policy* module, the standard move is to **drop Lexical Priority** but modify **Sensitivity** via *diminishing marginal weight* or *sufficiency*.
  *   *Why:* Pure lexical priority paralyzes infrastructure (you can't build a train if one person loses a garden). Pure aggregation licenses atrocity.
  *   *The Cost:* You must accept that "rights" are not absolute trumps but very heavy weights. This disappoints deontologists but keeps the policy machinery moving.

  ---

  ### Part 3: Scorecard

  | Theory | Action-Guidance | Continuum Coherence | Non-Absurdity (Torture/Specks) | Separateness of Persons |
  | :--- | :--- | :--- | :--- | :--- |
  | **Straight Additive Total Utilitarianism** | **Pass.** Clear calculus; handles imprecision via expected value. | **Pass.** Smooth curve; no magic numbers. | **Fail.** Implies enough specks *do* outweigh torture. Counter-intuitive for rights. | **Fail.** Treats people as vessels for utility; allows interpersonal compensation freely. |
  | **Threshold / Rights View** (e.g., Kamm, Nozick) | **Fail/Weak.** Hard to set the threshold precisely for policy. | **Fail.** Suffers "Cliff Edge" (1 below threshold = 0 weight). | **Pass.** Torture is lexically prior; never outweighed by specks. | **Pass.** Respects distinctness; no trading persons off easily. |
  | **Complaint-Based / Contractualist** (e.g., Scanlon) | **Fail.** "Reasonable rejection" is vague for cost-benefit analysis. | **Pass/Weak.** Focuses on individual justification, avoids sums. | **Pass.** Individual complaint against torture trumps aggregate specks. | **Pass.** Central feature; aggregation only allowed if no one can reasonably reject. |

  **Summary for Essay:**
  If your goal is a working regulatory tool, **Utilitarianism** is the only one that fully meets the *Functional* desiderata (Action-Guidance, Continuity), but it fails the *Substantive* intuition on Torture. **Threshold Views** protect the intuition but break the tool (Cliff Edges). Your essay should argue that a hybrid (e.g., *Prioritarianism* or *Weighted Aggregation*) is necessary to satisfy Continuity without accepting the Absurd Result, acknowledging that this requires dropping strict Lexical Priority.
