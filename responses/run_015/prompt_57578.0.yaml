answer: |-
  **Bottom line**

  Your intuition is correct: interaction undermines the coherence of heritability as a measure of genetic power, while variance partitioning undermines only its portability across contexts. However, your two-way cut misses a crucial third joint: gene-environment correlation. When individuals select environments based on their genotypes, genetic variance is inflated without any change in developmental rules or interaction norms. This structural coupling is distinct from both arithmetic partitioning and biological interaction. Thus, while your distinction clarifies why heritability estimates shift, a complete picture requires acknowledging that populations differ not just in environmental variance and reaction norms, but in how genes and environments are correlated.

  **Two sources, or one?**

  The variance-partition source is fundamentally a claim about arithmetic. Heritability is a ratio, $V_G/V_P$. If you reduce environmental variance ($V_E$) by standardizing conditions, the denominator shrinks while the numerator stays fixed. The ratio rises without any change in how genes build the trait. This limits portability: a high estimate in a lab tells you little about a messy real world. The interaction source is fundamentally a claim about development. It asserts that the effect of a genotype depends on the environment. If reaction norms cross, the "best" genotype in one setting is the "worst" in another. This limits coherence: there is no single "genetic value" to measure.

  This distinction matters because readers infer causal stability from heritability. Partition variability warns that the *proportion* of variance changes; interaction variability warns that the *cause* itself changes. If only partition varies, we can still say "Gene A adds 5 units." If interaction varies, we cannot. This affects intervention logic. If partition is the issue, equalizing environments reduces $V_E$, potentially increasing heritability even as trait differences shrink. If interaction is the issue, equalizing environments might change the rank order of individuals, making prediction impossible. The arithmetic source suggests stability of effect sizes; the developmental source suggests instability of effect signs.

  However, your cut misses gene-environment correlation (rGE). If people with high genetic propensity seek stimulating environments, $V_G$ and $V_E$ covary. This inflates heritability estimates without involving interaction or simple variance reduction. It is a structural feature of the population distinct from your two sources, representing a third way heritability becomes population-relative. In passive rGE, parents provide both genes and environment; in active rGE, individuals select niches. Both alter $V_G$ estimates independently of developmental plasticity or environmental uniformity. Ignoring this third source risks attributing population differences to interaction or variance alone when the mechanism is actually selective sorting. Consequently, a complete taxonomy of population-relativity requires three buckets: arithmetic scaling, developmental plasticity, and structural correlation. Your separation clarifies the slogan "property of a population." The variance source shows the number depends on the population's environmental distribution. The interaction source shows the number depends on the population's specific genotype-environment pairings. But rGE shows the number depends on the population's social structures that sort genes into environments. Without this third category, you might incorrectly assume that any change in heritability across populations must stem from either environmental variance or biological interaction, overlooking the sociological mechanisms that correlate the two.

  **Two worked cases**

  Case 1 (Interaction, Stable Variance): Consider a population with two genotypes (G1, G2) at equal frequency (50% each). In Environment A, G1 individuals score 10 and G2 individuals score 20. The mean is 15. The variance of the means ($V_G$) is 25. Assume within-genotype environmental noise ($V_E$) is 25. Total phenotypic variance ($V_P$) is 50, so heritability ($V_G/V_P$) is 0.5. In Environment B, the reaction norms cross: G1 individuals now score 20 and G2 individuals score 10. The mean is still 15. The variance of the means ($V_G$) is still 25. $V_E$ remains 25, and $V_P$ remains 50. Heritability is still 0.5. The statistic is perfectly portable, but the meaning is broken: G2 is superior in A but inferior in B. The number hides a complete reversal of genetic merit.

  Case 2 (Variance, Stable Interaction): Use the same genotypes with strictly parallel norms. In Environment A (heterogeneous), G1 averages 10 and G2 averages 20, with within-group noise ($V_E$) of 25. $V_G$ is 25, $V_P$ is 50, and heritability is 0.5. In Environment B (homogeneous), we eliminate environmental noise ($V_E$ = 0) by standardizing conditions. The means remain 10 and 20 because the norms are parallel. $V_G$ is still 25, but now $V_P$ drops to 25. Heritability rises to 1.0. The ranking is stable (G2 > G1) across both settings, but the statistic shifts dramatically from 0.5 to 1.0. This shows heritability moving solely due to arithmetic changes in the denominator, with no change in developmental ordering. The first case proves a stable number can mask unstable causes; the second proves a stable cause can yield unstable numbers. Visually, Case 1 depicts an X-shape. The lines connecting G1 and G2 across environments intersect. The spread of points is identical in both columns, preserving the variance components, but the slopes differ in sign. Case 2 depicts parallel lines. The distance between G1 and G2 is constant, but the spread of points around each line shrinks in the second column. In Case 1, predicting an individual's outcome requires knowing their specific environment; in Case 2, knowing the genotype is sufficient, but the confidence in that prediction depends on the population's environmental uniformity. These geometries illustrate why separating the sources is vital: one breaks prediction, the other breaks comparison.

  **The asymmetry**

  Your intuition is right. The interaction source threatens coherence, while the variance-partition source threatens portability. Coherence refers to whether the number refers to a stable causal power. If reaction norms cross, "genetic influence" is not a property of the organism but of the organism-environment pair. You cannot sum the genetic effects across contexts. Portability refers to whether the number travels across populations. If only variance partitions shift, the genetic effects are stable, but the ratio changes because the background noise changes.

  This asymmetry dictates how we interpret estimates. If variance-partition is the only issue, we can compare heritability across groups if we adjust for environmental variance. We can still talk about "genetic potential." If interaction is present, we cannot compare groups at all without specifying the environment. The variance source implies heritability is context-sensitive; the interaction source implies it is context-dependent. One is a measurement issue; the other is an ontological issue. Therefore, interaction is the deeper threat to the utility of heritability as a summary statistic. Consider intervention. If only variance-partition varies, equalizing environments might increase heritability (by reducing $V_E$) while decreasing total inequality. The policy works, even if the statistic rises. If interaction varies, equalizing environments might help one genotype while harming another. The policy effect is unpredictable without knowing the specific genotype-environment mapping. Thus, the variance source complicates the *interpretation* of the number, but the interaction source complicates the *existence* of the underlying effect. Furthermore, the variance source allows for correction. If we know $V_E$ differs, we can model the change. Interaction is harder to correct because it requires mapping the full reaction norm surface. Your intuition holds: partition variability makes the number slippery, but interaction variability makes the concept fuzzy. A slippery number can still track a real thing; a fuzzy concept may not track anything stable. This is why the interaction source is the more fundamental challenge to the slogan's implication that genes have fixed effects.

  **The no-interaction limit**

  If reaction norms are parallel everywhere, the interaction source vanishes. However, the variance-partition source survives intact. Heritability remains population-relative because $V_E$ can still vary across populations. The slogan "heritability is a property of a population" remains true, but for a narrower reason. It is no longer about changing genetic effects, but about changing environmental variance. The "not a property of a trait" claim also survives: changing $V_E$ changes the number without changing the trait's biology. However, the warning against genetic determinism weakens. Without interaction, we can say "Genotype A adds 5 units" universally. The slogan survives, but its sting is removed. It becomes a technical caveat about ratios rather than a profound claim about developmental context. In this limit, heritability becomes a stable measure of genetic ranking, sensitive only to the spread of environments. We can meaningfully compare heritability across populations if we account for $V_E$. The quantity retains coherence as a measure of genetic contribution, losing only its constancy as a ratio. The slogan must be revised: heritability is still population-relative, but only because populations differ in environmental variance, not because genes behave differently. This preserves the warning against reifying the number, but allows reifying the genetic effect. The distinction collapses the two sources into one, leaving only the arithmetic constraint.
