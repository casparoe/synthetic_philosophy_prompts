answer: |-
  The two sides, stripped down

  Side A argues that synchronic coherence conditions, like transitivity, are necessary requirements of rationality for any temporally extended agent. They contend that violating these conditions renders an agent vulnerable to a money pump: a sequence of trades, each locally preferred, that leaves the agent with their original holding and less money. For Side A, this vulnerability demonstrates that incoherence entails prudential failure. The money pump is not merely a risk; it is a proof that inconsistent preferences cannot guide action without self-defeat. Therefore, rationality requires coherence to avoid guaranteed loss. The loss is the evidence of the error. Side A concludes that preferences must be coerced into coherence to satisfy the demands of agency.

  Side B counters that the pump only runs given auxiliary assumptions: myopic choice, an inability to precommit, and the presence of a malicious exploiter. A resolute agent with cyclic preferences can plan over the entire sequence, refusing trades that lead to net loss, even if locally preferred. For Side B, the pump attacks a package of preferences plus naive dispositions, not preferences alone. If an agent can adopt a global strategy that avoids loss despite intransitive preferences, then incoherence does not necessitate exploitation. Thus, the normative requirement should target the strategy, not the snapshot preference. The debate hinges on whether rationality is a property of static preference structures or dynamic agency. Side A sees the vulnerability as constitutive of irrationality; Side B sees it as contingent on the environment.

  Diagnosis: what kind of disagreement is this

  The debate stalls because it conflates two distinct normative projects: one constitutive, the other instrumental. Side A treats coherence as constitutive of agency. To them, an agent with intransitive preferences isn't just prone to error; they are structurally defective. The money pump is merely an illustration of this defect, not the source of the norm. When Side B blocks the pump via resolute choice, Side A responds that resolute choice with intransitive preferences is itself a form of dynamic inconsistency or irrational binding. They argue that the *disposition* to choose locally is part of the rational package, and blocking the pump requires changing the agent's nature, not just their environment. They shift from "you will lose" to "you are the kind of thing that could lose," treating vulnerability as a flaw in essence rather than outcome.

  Side B treats rationality as instrumental. If the agent succeeds (keeps money), they are rational. The money pump is supposed to bridge these by showing coherence is instrumentally necessary. But once Side B shows the bridge is contingent on environmental factors (the exploiter's presence), the prudential force evaporates. Side A then retreats to the constitutive claim ("you're still defective even if you got lucky"), while Side B insists on the instrumental metric ("I kept my money"). This is why the money doesn't matter. If the norm is constitutive, actual loss is irrelevant; the counterfactual vulnerability suffices. If the norm is instrumental, actual loss is required; counterfactuals are moot.

  The debate doesn't move because neither side accepts the other's metric of evaluation. Side A views Side B's resolute chooser as cheating (changing the choice architecture). Side B views Side A's coherent chooser as unnecessarily constrained (binding themselves to avoid cycles that might be beneficial). The "money" is merely a proxy for utility, but making it literal money introduces empirical contingencies that Side A wants to ignore and Side B wants to highlight. Side A wants a formal proof of irrationality; Side B wants an empirical proof of loss. The stalemate is a clash between internalist consistency and externalist success.

  Furthermore, the disagreement rests on the unit of rational evaluation. Side A evaluates the preference structure at a single time slice (synchronic). Side B evaluates the agent's trajectory over time (diachronic). The money pump attempts to link these by showing synchronic flaws cause diachronic failure. But because the link is contingent on auxiliary assumptions (myopia, exploiter presence), the derivation fails. Side A preserves the link by embedding the auxiliary assumptions into the definition of rationality itself (a rational agent wouldn't be myopic). Side B rejects this embedding. Consequently, every counterexample offered by Side B is dismissed by Side A as a description of an irrational agent managing to survive, while every formal proof offered by Side A is dismissed by Side B as irrelevant to actual success. The pump functions as a rhetorical proxy so neither side has to admit they are arguing past each other about the definition of agency itself.

  This creates a disconnect regarding the normative grip of the counterfactual. For Side A, the mere possibility of exploitation in nearby possible worlds condemns the agent. For Side B, norms must guide action in the actual world. If the exploiter isn't there, the norm against cycling has no prudential grip. Side A argues this makes rationality too contingent on luck. Side B argues this makes rationality practical. The stalemate persists because "rationality" is doing too much work here. It is asked to be both a description of ideal structure and a guide to practical success. The money pump cannot satisfy both demands simultaneously. When it highlights structure, it loses practical force. When it highlights loss, it loses structural necessity. The debate doesn't move because the tool is being asked to perform two incompatible functions.

  Where my hypothesis is right and where it's wrong

  Your hypothesis is largely correct: there are indeed two arguments under one name. The prudential argument (don't lose money) is conditional and weak, easily blocked by resolute choice. The constitutive argument (be coherent) is absolute but question-begging, assuming the very norm it tries to prove. The pump tries to dress the constitutive claim in prudential clothing to make it palatable. Where you might be wrong is assuming Side A "gives up" on the money doing work. Many defend a dispositional account: rationality evaluates the *strategy* across possible worlds, not the outcome in the actual one. So the Silent Pump still bites for Side A because the disposition is risky, even if untriggered. They argue norms shouldn't depend on empirical luck.

  Also, the empirical question isn't entirely hidden; it's just deemed irrelevant by Side A. They argue norms shouldn't depend on empirical luck. The stalemate isn't just rhetorical; it's a fundamental disagreement on whether rationality is a property of minds or actions. You suggest the pump contributes nothing to the normative claim. This is right for the constitutive argument, but wrong for the prudential one. For the prudential argument, the pump *is* the work. The problem is that the prudential argument doesn't establish the strong coherence requirements Side A wants. So Side A smuggles the constitutive norm in via the prudential example. Your diagnosis of the rhetorical proxy is accurate. The hidden empirical question is real, but it's not the source of the stalemate; the source is the incompatible metrics of success vs. coherence.

  You suggest the debate is purely rhetorical. It isn't; it's metaphysical. Side A believes incoherence is a cognitive defect akin to logical contradiction. Side B believes it's a strategic variable. Your hypothesis misses that Side A isn't just retreating; they are digging in on a different ontological claim about what preferences *are*. They aren't just saying "you should precommit"; they are saying "your preferences are wrong." You treat this as a dodge, but for them, it's the core point. The pump isn't just a proxy; it's the only bridge they have between the metaphysical and the practical. When the bridge breaks, they retreat to the metaphysical shore. You see this as giving up; they see it as grounding.

  My three cases, and whether the pushback was fair

  1. Silent Pump: Side A's pushback is fair if rationality is about dispositions. A glass bowl is fragile even if never dropped. The counterfactual vulnerability reveals a structural flaw. Side B rejects this modal force for rationality, arguing norms must track actual outcomes. If no exploiter exists, no norm is violated. The pushback confirms the constitutive vs. instrumental split.
  2. Reverse Pump: This is the strongest test. If the agent gains, Side B says "rational." Side A says "lucky irrational." This confirms the split: Coherence vs. Success. The pushback was fair because Side A denies success vindicates structure. They argue you shouldn't rely on luck. This case shows the pump argument was never truly prudential; if it were, gain would vindicate the agent.
  3. Effort Pump: Crucial. It shows money isn't the point; utility drainage is. If the argument holds for effort, it's about preference satisfaction, not finance. Pushback here might be that effort is hard to measure compared to money, but theoretically, it holds. It tests whether the cost must be fungible.

  The pushback was fair because your cases force a choice between the two definitions of rationality. Your group waved them away because accepting them requires abandoning one side's foundational axiom. You aren't testing the pump; you're testing the definition of agency. The Silent Pump tests modal force. The Reverse Pump tests the link between coherence and success. The Effort Pump tests the fungibility of cost. Each case isolates a variable the pump relies on. The fact that both sides wave them away suggests they recognize the cases threaten the coherence of their own positions if admitted. Side A cannot admit the Silent Pump is harmless without losing the constitutive claim. Side B cannot admit the Reverse Pump vindicates incoherence without losing the instrumental claim. The cases are too sharp; they cut the knot instead of untying it.

  Was the pushback fair? Yes, because your cases function as intuition pumps for the opposing view. To Side A, the Silent Pump is irrelevant because the defect exists regardless of activation. To Side B, the Reverse Pump is decisive because success is the metric. By waving them away, they are protecting their core definitions. Your cases don't resolve the debate; they exacerbate it. They show that the money pump argument relies on suppressing these scenarios to maintain its force. Once introduced, the argument fractures. The pushback was an attempt to keep the discussion within the shared framework, which your cases dismantle. They were fair in the sense of defending their turf, but unfair in the sense of refusing to engage the implications. It suggests the debate is indeed stuck at the foundational level.

  What would count as progress

  Formal results won't settle it; we already know the math. Progress requires distinguishing *evaluative* norms (what is good) from *directive* norms (what to do). We should stop asking "is this irrational?" and ask "what decision procedure should we cultivate?" This shifts focus to meta-rationality: choosing how to choose. Alternatively, accept pluralism: coherence norms for ideal agents, success norms for bounded ones. The stalemate is expected because it's a foundational clash. Progress looks like dissolving the demand for a single unified theory of rationality. We need to acknowledge that "rationality" is a cluster concept. Sometimes it means coherence, sometimes success. The pump conflates them.

  Separating exploitability from incoherence formally is possible but won't settle the normative fight. It just relocates the fight to which one rationality tracks. A distinction between norms on plans and norms on sequences of choices is helpful but doesn't solve the conflict. The change of question is the most promising path. Stop asking whether violating the condition is irrational and ask what an agent with these preferences should do at the next node. This pragmatic turn bypasses the metaphysical stalemate. However, the stalemate is the right expected outcome because the underlying values (consistency vs. success) are incommensurable.

  Progress would look like a taxonomy of rationality concepts. Instead of one "Rationality," we have "Coherence-Rationality" and "Success-Rationality." The money pump applies to the latter but is used to enforce the former. Acknowledging this distinction allows Side A to keep their coherence norms without claiming they prevent loss, and Side B to keep their success norms without claiming they ensure coherence. The debate moves when we stop trying to derive one from the other. The stalemate persists because theorists want a unified field theory of agency. Abandoning that hope is the only way forward.

  Bottom line

  The money pump doesn't derive norms; it illustrates a tension between coherence and success. The debate stalls because it's actually about whether rationality defines agency or serves it. Stop looking for a proof; choose your metaphysics. The pump is a cartoon because it tries to be a bridge between two islands that don't want to connect. Your diagnosis is correct: the pump is a proxy. The stalemate is permanent because the disagreement is bedrock. Accept the split and move to decision procedures.
