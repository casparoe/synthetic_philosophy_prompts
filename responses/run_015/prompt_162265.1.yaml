  Question-splitting translates to the decomposition of expectations. When a node splits $Q$ into subquestions $\{Q_i\}$, it effectively invokes the Law of Total Probability, seeking to compute $C(Q)$ via $\sum C(Q|Q_i)C(Q_i)$. However, HCH permits splits that are not strict partitions, functioning more like heuristic decomposition than algebraic expansion. The "fresh copy" constraint implies that no information accumulates across branches; each node resets to the prior $C$, modified only by the explicit subquestion. This contrasts with standard conditionalization, where the algebra expands or probabilities update monotonically. The "depth limit" acts as a bound on the iterations of this decomposition. Under the readout convention, the system's overall credence in $Q$ is defined strictly as the root node's output $x_{root}$. This treats the entire tree as a single extended cognitive act.

  The "growth limit" proposes a sequence of credence functions $C_k$, corresponding to trees of depth $k$. The claim of "ideal deliberation" asserts that $\lim_{k \to \infty} C_k(Q)$ converges to a specific value. In your vocabulary, this limit represents a reflective equilibrium where further decomposition yields no change in credence. Case (i), where a node queries the tree's own output, introduces a recursive definition: $C(Q)$ is determined by a fixed-point equation involving $C$ itself. This is not updating but self-reference. Case (ii) claims this sequence approaches an ideal. In formal epistemology, ideals are typically coherent states satisfying logical omniscience. Here, the ideal is defined procedurally as the limit of a specific computational architecture. Thus, the construction models the agent not as a static believer updating on evidence, but as a recursive solver seeking a stable fixed point of its own reasoning process under resource unbounding. The logical omniscience of your framework is replaced by "computational omniscience" via delegation. Coherence in your framework is a synchronic constraint on $C$. In HCH, coherence is diachronic and architectural; it emerges from the consistency of the root with the leaves as depth increases. The scoring rule ensures each node is locally coherent (honest), but global coherence (consistency across the tree) is only achieved at the limit. Consequently, the HCH construction translates to a model where credence is not a static state updated by evidence, but the output of a fixed-point iteration over a space of decomposable queries, validated locally by proper scoring rules and globally by the convergence of the root report.

  ### Residue Report

  **Translated Cleanly:** Proper scoring rules map directly to incentive compatibility, ensuring nodes report true credences. The root readout convention maps cleanly to the definition of the agent's public credence. The depth limit maps to bounded rationality iterations. The use of expected utility to decide splitting matches your framework's decision theory; nodes split only if $E[U(\text{split})] > E[U(\text{answer})]$.

  **Translated with Distortion:** "Fresh copies" distorts the notion of learning. In Bayesianism, agents update; here, they reset. This smuggles in the normative claim that reasoning is stateless decomposition rather than stateful accumulation of evidence. "Splitting" distorts partitioning. Bayesian splitting requires exhaustive partitions; HCH allows heuristic subquestions, distorting the Law of Total Probability into a heuristic search. It assumes decomposition preserves truth-tracking without proving it.

  **No Counterpart:** The topology of convergence. You require a limit object (e.g., a coherent credence function). HCH offers a procedure without specifying the space in which it converges.
  **Case (i):** Recursive self-reference has no clean counterpart. Bayesian updating is acyclic; this is a fixed-point constraint $C(Q) = f(C(Q))$. It requires machinery for reflective consistency, not just coherence.
  **Case (ii):** The "ideal deliberation" claim lacks a target. In your framework, convergence is toward truth or coherence. Here, it converges to "what the person would say." This is psychological stability, not necessarily epistemic optimality. The construction assumes stability equals correctness, which your framework does not grant.

  ### Verdict

  The residue indicts the construction, not your framework. Formal epistemology defines ideals normatively (coherence, accuracy). HCH defines ideals procedurally (unbounded computation). Calling both "ideal deliberation" is an equivocation. Your framework treats reasoning as a black box because it cares about the validity of the state, not the architecture of the process. HCH cares about the architecture because it assumes the process *constitutes* the ideal. The gap exists because HCH attempts to derive normativity from scalability, whereas your framework assumes normativity constrains scalability. The construction is not a model of a Bayesian agent; it is a model of a recursive function approximator claiming epistemic authority. It confuses the limit of *help* (more copies) with the limit of *reasoning* (better coherence). Your framework cannot express this because it distinguishes between the agent's state and the method of calculation; HCH collapses them. Therefore, the gap is explained by the construction positing a different kind of ideal. It is a limit of more help and more time rather than a limit of more computation and more coherence. The "ideal" in HCH is sociological or architectural (a community of copies), whereas the Bayesian ideal is monadic and logical.

