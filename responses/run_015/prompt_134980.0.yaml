      *   *Refining the "Decision-Relevance" critique:* It fails because "distinguishable by whoever has to act" doesn't specify the *metric* of action. Does the policymaker care about absolute lives saved (RD) or proportional reduction (RR)? That's a value judgment, not a分辨ability judgment.

  8.  **Final Polish:** Ensure I answer the specific questions: "Verbal, substantive, or nest?" "Residual core?" "What counts as progress?"
