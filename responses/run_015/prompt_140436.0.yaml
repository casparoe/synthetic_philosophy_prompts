          *   *Claim:* "Good" is a simple, non-natural property. It cannot be defined in terms of natural properties (like pleasure, evolution, desire). To define "good" as "pleasure" is to commit a fallacy.
          *   *Nature:* Semantic/Metaphysical. It's about the meaning of terms and the nature of properties.
          *   *Solution:* None really (for Moore). You just intuit "good."
