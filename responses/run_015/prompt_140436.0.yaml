          *   *The word "Fallacy":* In Hume's case, it's often called "Hume's Law" or "Gap." Calling it a fallacy implies a logical error. In Moore's case, it's explicitly a "Fallacy," but it's more like a category error or metaphysical mistake than a formal logical invalidity.

