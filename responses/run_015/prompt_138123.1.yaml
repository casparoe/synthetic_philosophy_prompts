answer: |-
  The logic of your argument is sound, so the break does not lie in the inference from (1) through (4). If moral weight depends entirely on individual capacities, and those capacities vary continuously without sharp jumps, then moral weight must also vary continuously. Your friend's suggestion to reject (3) and accept a sharp cutoff creates the exact problem you identified: it forces you to defend a moral cliff where two nearly identical creatures receive vastly different treatment. This violates the principle of supervenience, which demands that similar cases be treated similarly. If you accept a cliff, you are committed to the view that morally irrelevant microscopic differences can justify massive differences in treatment, which undermines the very idea of rational ethical justification.

  Therefore, the step you should reject is (5). The discomfort you feel with conclusion (4) is not a sign of logical failure, but rather evidence of the speciesist intuition your paper aims to critique. Rejecting (5) costs you your pre-existing comfort with the moral hierarchy, requiring you to accept that the suffering of many non-human animals matters much more than common sense suggests, and potentially that the suffering of some humans with diminished capacities matters less than that of typical adults. This is a significant revision of intuition, but it is the price of consistency.

  There is no reading of (3) that survives while (4) fails, because (4) is simply the cumulative result of (3) applied across the series. If you deny (4) while keeping (1) and (2), you are implicitly reintroducing a cliff, which brings you back to rejecting (3). For a paper on speciesism, the strongest position is to own the conclusion: the argument succeeds precisely because it shows that our intuition (5) is biased. You do not need to accept a cliff; you need to accept that the slope is gentle, and our moral judgments have been mistaken about where the ground lies.
