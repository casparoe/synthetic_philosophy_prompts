prompt: |-
  Got 40 minutes next week in front of a room of ML engineers to explain updateless decision theory. They're completely fine with expected utility, Bayes and policy gradients, they have zero philosophy, and they're going to assume that anything that sounds like "ignore the evidence" is crackpot — so I need a plan, not an explanation.

  What has to be in place before "updateless" even means anything to them: do they need the causal/evidential decision theory split first, or can I get there from Newcomb's problem alone (which half of them will have half-remembered from a blog post)? Which single case should carry the whole thing — I was going to build it around an agent that gets to patch its own source code before the input arrives, so the policy feels like a real object they can point at, but tell me if that just smuggles in the conclusion or quietly collapses into Newcomb. Then the misconceptions, and where in the sequence to kill each one: I'm expecting "so you're saying don't condition on the evidence", "isn't that just evidential decision theory again", and "surely the perfect predictor is doing all the work here". Plus one question at the end that tells me whether they actually got it or just got comfortable with it.

  Also: what should I flatly refuse to go into at this level, and say out loud that I'm leaving it out — logical counterfactuals, why the policy gets evaluated from the prior, whatever else. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the Request:**
      *   **Audience:** ML Engineers (40 mins). Comfortable with EU, Bayes, Policy Gradients. Zero philosophy background. Skeptical of "ignore evidence" claims.
      *   **Topic:** Updateless Decision Theory (UDT).
      *   **Goal:** A *plan*, not an explanation. Needs structure, sequencing, specific examples, misconception handling, and scope boundaries.
      *   **Constraints:** British English. 40 minutes.
      *   **Key Questions to Answer:**
          *   Prerequisites (CDT/EDT split vs. Newcomb)?
          *   Single carrying case (Self-modifying code vs. Newcomb)?
          *   Misconception management (Conditioning, EDT confusion, Predictor role).
          *   Closing question (Understanding vs. Comfort).
          *   Scope boundaries (What to explicitly exclude).

  2.  **Deconstruct the Audience & Topic:**
      *   *ML Engineers:* They think in terms of loss functions, training distributions, policies ($\pi$), and inference. They care about optimisation. They hate magic. "Updateless" sounds like "ignore data," which violates Bayes optimality.
      *   *UDT:* Essentially, choose the policy that maximises expected utility from the *prior*, before observing specific evidence, because your decision algorithm is logically correlated with other instances (or predictors) of itself.
      *   *The Hook:* Frame UDT not as "ignoring evidence" but as "optimising the policy function rather than the action output given the evidence." This maps perfectly to Policy Gradients vs. Q-Learning or Supervised Learning.

  3.  **Address the Specific Questions:**

      *   *Prerequisites:* Do they need CDT/EDT?
          *   *Verdict:* No. CDT/EDT is philosophy jargon. ML engineers understand *causal graphs* vs. *correlations*. But introducing the whole CDT/EDT debate eats time. Newcomb is sufficient *if* framed correctly. Actually, a *technical* framing is better than Newcomb.
          *   *Better approach:* Use the "Training vs. Inference" distinction. They know this intimately. UDT is about optimising at "Training Time" (Prior) rather than "Inference Time" (Posterior).

      *   *Single Carrying Case:* Self-modifying code vs. Newcomb?
          *   *Verdict:* Newcomb is too abstract/philosophical. Self-modifying code is good but might sound like "pre-commitment" (which is just causal).
          *   *Best Case:* **The "Twin Prisoner's Dilemma" / "Program Equilibrium" framed as Distributed Inference.** Or, even better, **The "Predictor as a Copy of Your Weights"**.
          *   *Refinement:* Let's stick to the user's idea: **Agent patches source code before input.** But refine it: Make the "Predictor" a simulation of the agent's *policy* running on the prior. This makes it about *logical correlation* of algorithms, not magic prediction. It maps to "Your inference code is visible to the environment."
          *   *Actually, the strongest ML analogy:* **Overfitting vs. Generalisation.** Updating on evidence is like overfitting to the specific test case. Updateless is like regularising based on the training distribution.
          *   *Decision:* Stick to the user's "Source Code Patch" idea but formalise it as **Policy Selection vs. Action Selection**. This is the core technical distinction.

      *   *Misconceptions:*
          1.  "Ignore evidence": No, you condition on the *fact that you are running*, just not the specific observation when selecting the policy.
          2.  "Just EDT": EDT conditions on the action. UDT conditions on the *policy*.
          3.  "Perfect Predictor": It's not about prediction accuracy; it's about logical identity/correlation.

      *   *Closing Question:* Needs to distinguish "I get the vibe" from "I get the mechanism."
          *   *Idea:* Ask them to identify where the gradient comes from in a specific scenario.

      *   *Scope Boundaries:* Logical counterfactuals (too hard), Formal priors (too mathy), Timeless Decision Theory history (irrelevant).

  4.  **Drafting the Plan (Iterative Process):**

      *   *Intro (5 mins):* Hook them with "Training vs. Inference."
      *   *The Problem (10 mins):* Newcomb is okay, but let's make it "The Predictor reads your Weights."
      *   *The Solution (10 mins):* Policy Gradients analogy. Optimise $\pi$, don't just optimise $a$.
      *   *Misconceptions (10 mins):* Address the "Ignore Evidence" fear.
      *   *Conclusion/Q&A (5 mins):* The litmus test question.

      *   *Critique:* 40 mins is tight. Need to be ruthless.
      *   *Refinement on "Source Code":* If the agent patches code *before* input, that's pre-commitment. UDT is stronger. It's about evaluating the policy *as if* you hadn't seen the input, even if you have.
      *   *Key Insight for MLers:* UDT = Maximising $E[U | \text{do}(\pi)]$ from the prior, not $E[U | \text{do}(a), \text{observe}(x)]$.
      *   *Wait, simpler:* UDT is "Choose the function $f(x)$ that maximises utility, knowing $x$ will be fed in later," vs CDT "Choose $y$ given $x$."
      *   *Actually, the "Transparent Newcomb" is the killer case.* If you see the money, CDT says take both. UDT says take one (because if your policy was 'take both', the money wouldn't be there). This forces the "ignore evidence" bullet.
      *   *But MLers hate "ignore evidence".* How to reframe? "Your policy was selected based on the prior. The evidence is just an index into the policy."

      *   *Revised Plan Structure:*
          1.  **Framing (5m):** Policy Optimization vs. Action Optimization.
          2.  **The Case (10m):** Transparent Newcomb (Money in box, you see it). Why standard RL fails.
          3.  **The Mechanism (10m):** The "Prior" as the Training Distribution.
          4.  **Misconceptions (10m):** The big three.
          5.  **The Test (5m):** The question.

      *   *British English Check:* "Programme" (maybe not needed), "Optimise", "Centre", "Realise", "Modelling". Tone: Pragmatic, slightly dry, no fluff.

  5.  **Fleshing out the Content:**

      *   *Prerequisites:* Skip CDT/EDT labels. Use "Causal Graph" vs. "Logical Correlation."
      *   *The Case:* Use the "Source Code" idea but make it "The Environment runs your `policy.py`".
      *   *Misconceptions:*
          *   "Ignore evidence": You don't ignore it; you treat it as an argument to the function you already chose.
          *   "EDT": EDT says $P(\text{Win} | \text{OneBox})$. UDT says $E[\text{Win} | \pi = \text{OneBoxer}]$.
          *   "Predictor": It's not a predictor; it's a simulator of your code.
      *   *Exclusions:* Logical Counterfactuals (say "we assume a oracle for now"), Prior selection (assume uniform/simple).
      *   *The Question:* "In Transparent Newcomb, if you see the money, do you update your policy or just execute it?"

  6.  **Final Polish:**
      *   Ensure the tone is respectful of their expertise (ML) while correcting the framing.
      *   Make sure the "Plan" aspect is clear (timings, objectives).
      *   Check British spelling/idioms.

      *(Self-Correction during drafting)*: I need to be careful not to make UDT sound like "Pre-commitment." Pre-commitment is causal (binding yourself). UDT is about the *decision algorithm* itself being the object of optimization. The distinction is subtle but crucial for engineers. I must emphasise that the agent *is* the policy.

      *Revised Closing Question:* Needs to be sharper. "If your weights are visible to the loss function during training, do you update weights during inference?"

      *Let's settle on the "Training vs Inference" analogy as the golden thread.* It's the most robust bridge for ML engineers.

      *Wait, one more thing:* The prompt asks "Do they need CDT/EDT split first?" I should answer that explicitly in the plan. Answer: No, it adds jargon. Use "Action-Conditional" vs "Policy-Conditional".

      *Okay, ready to write.*

  7.  **Final Review against constraints:**
      *   40 mins? Yes, timed sections.
      *   British English? Yes (optimise, programme, realise, etc.).
      *   Plan not explanation? Yes, structured as a briefing.
      *   Address specific misconceptions? Yes.
      *   Address scope boundaries? Yes.
      *   Closing question? Yes.

      *Let's assemble.*
answer: |-
  Here is a 40-minute battle plan. It is designed to bypass the philosophy and speak directly to their intuition about loss landscapes, training distributions, and policy optimisation.

  ### 1. The Prerequisites: CDT/EDT or Newcomb?
  **Verdict:** Drop the CDT/EDT taxonomy entirely. It is philosophical baggage that signals "armchair theorising."
  **Do this instead:** Frame the split as **Action-Conditional Optimisation** (what they do in standard inference) vs. **Policy-Conditional Optimisation** (what they do in meta-learning or architecture search).

  They know Newcomb, but they dismiss it as a paradox about magic predictors. You must reframe Newcomb not as a puzzle about prediction, but as a puzzle about **logical correlation between algorithms**.
  *   **The Hook:** "You are not optimising an action $a$ given observation $o$. You are optimising a function $\pi(o) \to a$ where the environment has read access to $\pi$."

  ### 2. The Carrying Case: "Transparent Newcomb" via Source Code
  Your instinct about the agent patching its source code is correct, but it risks sounding like "pre-commitment" (which is just causal binding). To make it UDT, the agent must *not* be able to bind itself; it must simply *be* the code.

  **The Scenario:**
  1.  **The Setup:** An environment runs the agent's `policy.py`.
  2.  **The Predictor:** Is not a psychic; it is a **simulation** of `policy.py` run on the prior distribution before the specific input is generated.
  3.  **The Twist (Transparent Newcomb):** The agent enters the room and *sees* the money in the box (the evidence).
      *   **Standard RL (CDT-ish):** "I see the money. It's there regardless of what I do now. I'll take both boxes to maximise reward."
      *   **UDT:** "If my policy is 'take both when seeing money', the simulation would have predicted that, and the box would be empty. I must execute the policy that *would have* been selected at the prior, even though I now see the money."

  **Why this works:** It forces the "ignore the evidence" bullet in a setting where they can visualise the code. It distinguishes UDT from simple pre-commitment because the agent *could* defect at inference time, but shouldn't.

  ### 3. The Sequence & Misconception Management
  Allocate your 40 minutes strictly. Do not overrun.

  **00:00 – 05:00: Framing (Training vs. Inference)**
  *   **Concept:** Standard decision theory is like doing gradient descent *at inference time* on a single test sample. UDT is doing gradient descent *at training time* on the distribution, then freezing weights.
  *   **Goal:** Establish that "Updateless" $\neq$ "Ignorant." It means "Optimised against the prior, not the posterior."
  *   **Kill Misconception 1:** *"So you're saying don't condition on the evidence?"*
      *   **The Line:** "You condition on the evidence to *select the action* via the policy, but you do not condition on the evidence to *select the policy*. You don't retrain your weights just because you saw a test image."

  **05:00 – 15:00: The Case (The Visible Weights)**
  *   **Walkthrough:** Use the Transparent Newcomb / Source Code scenario.
  *   **Visual:** Draw the computational graph. Show the Predictor node taking the *function* $\pi$ as input, not the *output* $a$.
  *   **Goal:** Show that the causal link is from Policy $\to$ Predictor $\to$ World State.
  *   **Kill Misconception 2:** *"Surely the perfect predictor is doing all the work here."*
      *   **The Line:** "Remove the word 'predictor'. Call it a 'static analyser'. If your code logically implies $X$, the analyser returns $X$. It's not about accuracy; it's about logical identity. If you and the analyser run the same algorithm, you are correlated by mathematical necessity, not causality."

  **15:00 – 25:00: The Mechanism (Policy Gradients)**
  *   **Concept:** Map UDT to Policy Gradients.
      *   **CDT/EDT:** Estimate $Q(s, a)$. Pick $\arg\max_a$.
      *   **UDT:** Estimate $J(\pi) = E_{s \sim Prior}[U(\pi(s))]$. Pick $\arg\max_\pi$.
  *   **Goal:** Make it look like standard ML optimisation.
  *   **Kill Misconception 3:** *"Isn't that just Evidential Decision Theory again?"*
      *   **The Line:** "EDT conditions on the *action* ($P(World | I\_do\_A)$). UDT conditions on the *algorithm* ($P(World | My\_Code\_Is\_\pi)$). EDT fails when the action is evidence but not cause. UDT works when the algorithm is the cause."

  **25:00 – 35:00: The "Ignore Evidence" Bullet**
  *   **Focus:** This is where they will revolt. Address the "Transparent" case again.
  *   **Argument:** If you update your policy after seeing the money, you are overfitting to the test set. The predictor punished the *type* of agent you are, not the specific move you made.
  *   **Analogy:** "If you know your exam questions are leaked beforehand, do you study the answers (inference update) or study the subject (policy optimisation)? If the examiner checks your study logs (predictor), studying the answers gets you failed."

  **35:00 – 40:00: The Litmus Test & Close**
  *   **The Question:** Do not ask "Does this make sense?" They will lie.
  *   **Ask this:** "In the Transparent Newcomb case, if I see the money, and I know my policy was fixed at the prior: do I treat the presence of the money as **causal evidence** that I will win, or as **logical evidence** of what my policy is?"
      *   **Correct Answer:** "Logical evidence of what my policy is. The money is already there. My action doesn't cause it. But my *decision algorithm* did."
      *   **Wrong Answer:** "I take both boxes because the money is already there." (This is CDT).
      *   **Wrong Answer:** "I take one box because my action causes the money." (This is magic/EDT confusion).

  ### 4. Scope Boundaries: What to Explicitly Exclude
  State these clearly at the start (minute 2) to prevent pedantic derailment. Write them on the board.

  1.  **Logical Counterfactuals:** "We are assuming an oracle that can evaluate counterfactuals on source code. We are not solving *how* to compute that today. We are discussing *what* to optimise."
  2.  **Prior Selection:** "We are assuming a fixed prior. We are not debating where the prior comes from (Solomonoff, etc.)."
  3.  **Timeless Decision Theory History:** "We are not discussing Yudkowsky, Soares, or the history of the field. This is about objective functions."

  ### 5. Tone & Language Notes (British English)
  *   **Spelling:** Optimise, programme (if used), modelling, centre, behaviour.
  *   **Phrasing:**
      *   Avoid: "You guys," "Awesome," "Let's dive in."
      *   Use: "Right," "The crux of the matter," "Shall we proceed," "It's worth noting."
      *   Be direct but polite. If a question is off-scope, say: "That's a fair point, but it's outside the scope of this session. Let's park it."
  *   **Attitude:** Treat UDT as an engineering constraint, not a philosophical revelation. It is a "loss function design pattern."

  ### Summary Checklist for the Podium
  1.  **Slide 1:** Title + "This is about Policy Optimisation, not Philosophy."
  2.  **Slide 2:** The Exclusions (Logical Counterfactuals, Priors, History).
  3.  **Slide 3:** Training (Prior) vs. Inference (Posterior) analogy.
  4.  **Slide 4:** The Diagram (Policy $\to$ Predictor $\to$ Reward).
  5.  **Slide 5:** Transparent Newcomb (The "See the Money" case).
  6.  **Slide 6:** The Litmus Test Question.

  If you stick to the "Training vs. Inference" analogy, you will keep them. If you drift into "rationality" or "truth," you will lose them. Keep it on the loss function.
