  *   **EDT:** No. (Pressing is evidence you are a psychopath).
  *   **FDT:** Yes. (Pressing does not make you a psychopath).
  *   However, Counterfactual Mugging is the cleaner test for the "Predictor" lineage of her previous verdicts.

