  Based on your friend's track record, you are observing a decision-maker who consistently rejects **Causal Decision Theory (CDT)**. CDT would two-box in Newcomb, defect in the Twin Prisoner's Dilemma, and abstain from voting (citing negligible causal impact). Her behavior aligns with theories that respect correlations between her decision and outcomes, even without direct causation.

  The two candidate rules that fit her history equally well are **Evidential Decision Theory (EDT)** and **Functional Decision Theory (FDT)** (or its close cousin, Timeless Decision Theory). Both one-box, cooperate with twins, and vote. However, they rely on different machinery, and while they converge on many classic problems, they diverge on others.

  ### 1. The Termite Blackmail Case
  You suspect the rules part ways here. In the *standard* Blackmail problem (without termites), they do: EDT pays to minimize loss given the letter, while FDT refuses to pay to incentivize the blackmailer not to send the letter in the first place.

  However, in your specific **Termite Blackmail** variant, **both EDT and FDT predict she will Pay.**

  *   **The Setup:** The blackmailer sends the letter *iff* (Termites & No-Pay) OR (No-Termites & Pay). You have the letter.
  *   **EDT's Reasoning:** EDT treats actions as evidence.
      *   If she Pays: This is consistent with the (No-Termites & Pay) branch. The probability of termites given Payment and Letter is 0. Cost: \$100.
      *   If she Refuses: This is consistent with the (Termites & No-Pay) branch. The probability of termites given Refusal and Letter is 1. Cost: \$1,000.
      *   **Verdict:** Pay.
  *   **FDT's Reasoning:** FDT treats her decision as the output of a function that the blackmailer simulated.
      *   If her function outputs "Pay": The blackmailer (predicting this) sent the letter only if No-Termites. She is in the No-Termites world. Cost: \$100.
      *   If her function outputs "Refuse": The blackmailer (predicting this) sent the letter only if Termites. She is in the Termites world. Cost: \$1,000.
      *   **Verdict:** Pay.

  **Why they converge here:** In the standard Blackmail problem, refusing prevents the letter from being sent (saving the blackmail cost). In your Termite variant, refusing *guarantees* the letter is sent in the worst possible state (Termites). The termite cost (\$1,000) swamps the blackmail cost (\$100), forcing both theories to pay to avoid the inspection.

  **The Divergence You Expected:** If you removed the termites and simply said "The blackmailer sends the letter if she predicts you pay," EDT would Pay (sunk cost) and FDT would Refuse (policy selection). Your addition of the termites inadvertently aligned their incentives.

  ### 2. Which Rule to Bet On?
  I would bet on **Functional Decision Theory (FDT)**.

  **Reasoning:**
  1.  **Demographics:** FDT is the dominant framework among mathematicians, programmers, and rationalist communities (e.g., LessWrong/MIRI) who discuss these specific puzzles. EDT is more common in traditional philosophy and statistics.
  2.  **Phrasing:** Her justification for voting is the tell. She says her ballot is *"tied to"* how similar people vote.
      *   An **EDT** voter says: "My vote is *evidence* of how others vote" (Statistical correlation).
      *   An **FDT** voter says: "My decision algorithm is *identical* to theirs, so our outputs are logically linked" (Logical identity).
      *   "Tied to" suggests logical identity, which is the hallmark of FDT.

  ### 3. Distinguishing the Rules: Counterfactual Mugging vs. Smoking Lesion
  To separate EDT from FDT, you need a case where evidential correlation and logical control yield different answers.

  **The Counterfactual Mugging** is the superior test for your friend.

  *   **The Case:** Omega flips a fair coin.
      *   **Tails:** Omega gives you \$10,000.
      *   **Heads:** Omega asks you for \$100.
      *   **Reality:** The coin landed Heads. Omega is asking for \$100.
  *   **EDT Verdict: Don't Pay.**
      *   EDT is *updateful*. Given that the coin is already Heads, paying loses \$100. Not paying loses \$0. There is no evidential link between paying now and the past coin flip.
  *   **FDT Verdict: Pay.**
      *   FDT is *updateless* (policy-based). It asks: "What policy maximizes expected value *before* the coin flip?"
      *   Policy "Pay if Asked": 0.5 * \$10,000 - 0.5 * \$100 = +\$4,950.
      *   Policy "Refuse if Asked": \$0.
      *   FDT pays the \$100 to uphold the policy that would have won the \$10,000 in the counterfactual branch.

  **Why not the Smoking Lesion?**
  *   **The Case:** Smoking doesn't cause cancer; a lesion causes both smoking and cancer. You enjoy smoking.
  *   **EDT:** Don't Smoke (Smoking is bad evidence).
  *   **FDT:** Smoke (Decision doesn't cause lesion).
  *   **Critique:** While this distinguishes them, your friend's track record is built on **Predictor** problems (Newcomb, Twin PD). The Smoking Lesion is a **Common Cause** problem. The Counterfactual Mugging is structurally closer to her existing history (involving a Predictor/Omega) and tests the specific "logical correlation" mechanism she cited in the Voting case.

  ### 4. Recommendation
  Present the **Counterfactual Mugging**.

  *   If she **Pays**: She is an **FDT** agent (consistent with the "tied to" voting logic).
  *   If she **Refuses**: She is an **EDT** agent (consistent with standard evidential reasoning).

