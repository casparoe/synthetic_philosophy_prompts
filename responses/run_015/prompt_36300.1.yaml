  Tell her the Termite Blackmail is a "trap" where EDT and FDT agree (Pay), but the Counterfactual Mugging is the key that unlocks the difference. If she pays the mugger, she's a Functionalist; if she walks away, she's an Evidentialist. Given her voting comment, expect her to pay.
