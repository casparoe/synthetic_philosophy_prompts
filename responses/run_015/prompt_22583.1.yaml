      *   **The "Level-Splitting" Alternative:** Explain the view that HOE creates a split between first-order and higher-order attitudes. The user denies this is possible; critics say it's necessary.
      *   **The Rational Reflection Principle:** Introduce Elga/Christensen's argument. If you know your rational credence should be $x$, your credence should be $x$. HOE creates a conflict between what FOE suggests and what Rationality suggests.
      *   **The "Why Tension Survives" Answer:** The tension isn't in the final numbers; it's in the *access* to the reasons. You can't simultaneously reason from FOE and discount FOE.
      *   **Specific Breakdown Point:** The breakdown is in treating HOE as *object-level* evidence rather than *procedural* evidence.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, does the user's view actually solve it?* If I learn I'm drugged, I lower $P(p)$. My new $P(p)$ reflects the total evidence. I believe $p$ to degree 0.4. I believe rationality requires 0.4. No akrasia.
      *   *So why is there a puzzle?* The puzzle is often about *peer disagreement* or *systematic bias*.
      *   *Example:* I think $p$. Expert says $\neg p$.
      *   *User:* I update on "Expert says $\neg p$". My new $P(p)$ is lower. No akrasia.
      *   *Critique:* But what if the HOE says "You are currently incapable of processing the evidence correctly"? If I process that evidence correctly to lower my confidence, didn't I just prove I *am* capable? (The self-undermining worry).
      *   *Key Insight:* The "folding" assumes you can reliably process the HOE. But HOE often attacks the reliability of the very processing mechanism required to fold it.
      *   *This is the killer argument:* **The Self-Undermining Objection.** If the HOE says "Your reasoning is compromised," you cannot trust the Bayesian calculation that incorporates that HOE.

