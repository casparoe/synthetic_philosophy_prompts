answer: |-
  There is no single, canonical term in legal theory or parliamentary procedure for this specific maneuver, though it is a recognized class of drafting vulnerability. It is distinct from Ross's Paradox of Self-Amendment because, as you noted, it does not rely on the logical recursion of a rule changing itself, but rather on the **hierarchical conflict between two distinct rules** (the entrenchment clause vs. the emergency suspension clause).

  However, we can precisely name, define, and bound this pattern based on constitutional theory and parliamentary law.

  ### 1. Naming the Pattern
  If you need a term to use in analysis, the most precise descriptive label is **"Procedural Bootstrapping via State of Exception."**

  In political science and legal theory, it falls under the broader umbrella of **"Constitutional Hardball"** or **"Fraus Legis"** (fraud on the law). In the context of small organizations (HOAs, boards, clubs), it is often colloquially called a **"Bylaw Loophole"** or **"Suspension Exploit."**

  ### 2. Precise Definition
  **Procedural Bootstrapping** occurs when:
  1.  **Constraint A** (e.g., a 2/3 vote requirement) creates a high barrier to change.
  2.  **Exception B** (e.g., emergency suspension) allows a temporary bypass of "procedural" rules.
  3.  **The Maneuver:** Exception B is invoked to suspend Constraint A. While A is suspended, a new rule (Constraint C) is enacted via a lower threshold.
  4.  **The Bootstrap:** When Exception B expires, Constraint A is not reinstated; instead, Constraint C remains in force. The validity of the enactment relies on the principle that **acts validly performed during a window of authority remain valid after that authority expires.**

  ### 3. The Logical Edges and Conditions
  You asked where the edges are. For this pattern to function logically (even if ethically or legally dubious), specific conditions must be met:

  **A. Temporary vs. Permanent Exception**
  *   **Requirement:** The exception mechanism (Rule B) *must* be framed as temporary (e.g., "suspend for 48 hours").
  *   **Why:** If the exception were permanent, it would simply be a conflicting clause resolved by *lex posterior* (the later rule wins). The "bootstrap" magic relies on the **temporal validity** of the act. The argument is: "At the exact moment of the vote, the 2/3 rule was inactive; therefore, the majority vote was valid. The subsequent expiration of the suspension does not undo validly passed motions."
  *   **Edge Case:** If the suspension is permanent, it's not bootstrapping; it's just a contradictory amendment. The "temporary" nature provides the *color of emergency justification* to bypass the intent of the original constitution.

  **B. Procedural vs. Substantive Rules**
  *   **Requirement:** The emergency clause must define suspendable rules broadly enough to include the amendment threshold.
  *   **The Weak Point:** In robust parliamentary law (e.g., *Robert's Rules of Order*), this is the breaking point. Rules that protect minority rights (like a 2/3 vote requirement) are considered **substantive**, not procedural. They generally *cannot* be suspended.
  *   **Edge Case:** If the bylaws define "procedural rules" loosely, the bootstrap works. If they incorporate standard parliamentary authority, the maneuver is usually a **nullity** because the chair lacked the authority to suspend the rule in the first place.

  **C. The Validity Principle (Non-Retroactivity)**
  *   **Correction:** You mentioned the new rule "retroactively makes the vote valid." This is a common misconception.
  *   **Reality:** The vote is **contemporaneously valid**. At time *T1*, the 2/3 rule is suspended. The majority vote happens at *T1*. Therefore, at *T1*, the vote is legal. At time *T2*, the suspension expires. The *result* of *T1* (the new bylaw) persists because legal acts are not usually undone by the expiration of the authority that created them (similar to a contract signed before a law changes).
  *   **Edge:** If a court or parliamentarian rules that the suspension itself was *void ab initio* (invalid from the start because it violated a fundamental right), then the vote at *T1* was never valid, and the bootstrap fails.

  ### 4. Distinction from a Coup
  You asked how this differs from a "coup with paperwork."

  *   **A Coup (Autogolpe):** Discards the existing constitutional order. It claims **extra-legal authority**. (e.g., "The old rules no longer apply; I am in charge.")
  *   **Procedural Bootstrapping:** Consumes the existing constitutional order. It claims **hyper-legal authority**. (e.g., "I am following Rule B exactly as written to modify Rule A.")

  **The Difference:**
  A coup relies on force or raw power to ignore the rules. Bootstrapping relies on **interpretive aggression** to use the rules against themselves. It is a form of **lawfare**.

  However, in practice, if the organization challenges this, adjudicators often treat successful bootstrapping as a **constructive coup**. They rule that the *intent* of the constitution (to protect the 2/3 threshold) outweighs the *literal text* of the emergency clause. This is the doctrine of **"Substantive Due Process"** in organizations: some rules are so fundamental they cannot be suspended, even if the text doesn't explicitly say so.

  ### Summary
  *   **Name:** Procedural Bootstrapping via State of Exception.
  *   **Mechanism:** Exploiting the enduring validity of acts performed during a temporary suspension of entrenchment clauses.
  *   **Critical Edge:** It fails if the suspended rule is deemed "substantive" rather than "procedural," or if the emergency clause requires a genuine emergency (deadlock) that didn't actually exist.
  *   **Status:** In well-drafted parliamentary systems, this is **out of order**. It usually only succeeds in organizations with amateurishly drafted bylaws that fail to distinguish between suspendable procedural rules and non-suspendable substantive rights.

  If you are encountering this in the wild, the counter-move is not to argue the logic, but to raise a **Point of Order** claiming that the amendment threshold is a **fundamental right of the minority** that cannot be suspended, rendering the chair's action null and void *ab initio*.
