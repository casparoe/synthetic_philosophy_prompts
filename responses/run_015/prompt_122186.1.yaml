  What translated cleanly was the mechanics of distribution shift and strategic response, but what got bent was the status of the target variable. In your vocabulary, a label is a slot to fill based on proxy targets, but for Hacking, the label is a way of being that alters the substrate. The residue that has no expression in your framework is the first-person ontology of the classified subject. In your stack, what it is like to be classified is unobserved latent variance or perhaps a feature engineering problem where self-reporting adds signal, but for Hacking, this internal adoption is the mechanism of the loop. When a person adopts a label, they are not just changing features; they are changing the ground truth definition of what counts as the kind. Similarly, contestation is not users complaining about the model or gaming the system; it is a request to rewrite the loss function itself, not just reweight the samples. This is a defect in your vocabulary because it assumes the target $Y$ is fixed prior to measurement, whereas in psychiatry $Y$ is co-authored by the classifier and the classified. Your framework sees a bug where the philosophy sees a feature of social reality, implying you ought to grow a word for ontological feedback distinct from behavioral gaming, because currently your system interprets a change in the meaning of sadness as a calibration error rather than a shift in the concept being modeled.

