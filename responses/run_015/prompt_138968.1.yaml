prompt: |-
  You are a professional philosopher specializing in existential risk and also a careful literary critic. First brainstorm briefly: note the scenes in Aldous Huxley's Brave New World that bear on the singleton hypothesis, the idea that a world order could have a single highest-level decision-making agency able to solve global coordination problems and permanently prevent internal and external threats to its rule. Then write a critical reading of the novel through that idea, testing a refinement I want you to introduce.

  Distinguish a minimal singleton, which merely monopolizes final decision-making and forecloses rival power centers while leaving private values and culture mostly alone, from a comprehensive singleton, which also engineers desires, institutions, and culture so that internal challenges cannot even be formulated. Read the World State as a comprehensive singleton: consider its hatcheries and conditioning, hypnopaedic training, caste system, soma, suppression of family and history, and Mustapha Mond's defense of sacrificing art, religion, and passion for stability and happiness. Ask whether the real horror of a bad singleton is comprehensiveness itself—value lock-in and the impossibility of future moral or cultural change—or only the shallow content that this regime locks in. Does Mond's argument imply that any stable singleton must become comprehensive, because a minimal one could not suppress internal threats without shaping desires? And do the exiles of Helmholtz and Bernard, together with John's embrace of suffering and danger over drugged contentment and his suicide at the lighthouse, show limits to the World State's comprehensiveness, or confirm its power?

  Be faithful in both directions: do not reduce the novel to a thesis, and do not distort the idea to fit the plot; say where the reading breaks down. Do not provide citations, bibliographies, or verbatim quotations; rely on common knowledge of the plot. Finish with a one-sentence bottom line stating your overall verdict on what the novel contributes to the singleton debate; make that line the final line, starting with the words Bottom line: and then the sentence.
