answer: |-
  Here is a complete run-sheet for your 60-minute seminar. It includes the script, the payoff matrix, the belief mechanism, and a frank debrief guide.

  ### 1. Preparation & Materials
  *   **Pairs:** 8 pairs (16 students). Seat them facing each other.
  *   **Handouts:** Each student needs a "Decision & Belief Sheet" (6 rows, one for each potential node).
  *   **Currency:** Points convertible to something trivial (e.g., 100 points = $5 coffee card, or simply "winner gets first pick of the donuts").
  *   **Props:** One die per pair (or you roll centrally for Version 2). A screen or folder to hide the die roll.

  ### 2. The Payoff Structure (Version 1: Fixed)
  *   **Pot Growth:** Starts at 10. Increases by 10 at every node (10, 20, 30, 40, 50, 60).
  *   **The Split:** If a player chooses **TAKE**, the pot is split 80% to the Taker, 20% to the Passer.
  *   **The End:** If the game reaches Node 6 and Player 2 chooses **PASS**, the game ends immediately and **both get 0**. (This forces the rational move at the final node).

  | Node | Decider | Pot Size | **TAKE** Payoffs (Decider, Other) | **PASS** Leads To... |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | Player 1 | 10 | **(8, 2)** | Node 2 |
  | **2** | Player 2 | 20 | **(16, 4)** | Node 3 |
  | **3** | Player 1 | 30 | **(24, 6)** | Node 4 |
  | **4** | Player 2 | 40 | **(32, 8)** | Node 5 |
  | **5** | Player 1 | 50 | **(40, 10)** | Node 6 |
  | **6** | Player 2 | 60 | **(48, 12)** | **Game Over (0, 0)** |

  ### 3. The Belief Elicitation (The "Slip")
  To keep this from bogging down, do not use a formal scoring rule. Use a **Prediction Bonus**.
  *   **Instruction:** "At each node, before you decide, write down: (A) What you think your partner will do if they get a turn, and (B) What you think your partner expects *you* to do right now."
  *   **Incentive:** "At the end of class, I will pick three pairs at random. If your predictions matched what actually happened, you both get a bonus candy/bar. This does not affect your game points."
  *   **Why:** This forces them to model the other's mind without changing the game payoffs directly.

  ---

  ### 4. The Script (Read/Adapt This)

  #### Part 1: Setup (Minutes 0–5)
  "Welcome. Today we are testing decision-making in strategic situations. You will work in pairs. One of you is Player 1, the other Player 2. Do not talk to other pairs.

  Here is the game. There is a pot of points. Player 1 starts. You have two moves: **TAKE** or **PASS**.
  If you **TAKE**, the game ends. You get 80% of the current pot; your partner gets 20%.
  If you **PASS**, the pot grows by 10 points, and the decision moves to your partner.
  If the game reaches the final node (Node 6) and Player 2 passes, the pot vanishes. Both get zero.

  Before you make any move, you must fill out the belief slip. Predict what your partner will do, and what they expect of you.
  Your goal is to maximize your own points. Ready? Player 1, look at your Node 1 sheet. You have 30 seconds."

  *(Let them play Version 1. It will likely end at Node 1 or 2. Collect sheets.)*

  #### Part 2: The Variant (Minutes 20–30)
  "Reset. Same pairs. New rules. This is Version 2.
  The pot still grows by 10 every pass. The 80/20 split still applies if you Take.
  **However:** There is no fixed end. After every **PASS**, I will roll a die behind this screen.
  If I roll a 6, the game ends immediately. The pot is split 50/50.
  If I roll 1–5, the game continues to the next node.
  You do not know if the current node is the last one.
  Play this version twice. Record your beliefs as before."

  *(Run Version 2. They will likely pass longer here.)*

  #### Part 3: The Debrief (Minutes 30–60)
  *(See detailed guide below)*

  ---

  ### 5. The Debrief Guide (Mapping Moments to Theory)

  Do not start by defining Backward Induction. Start by asking for data.

  **Step 1: The Data Reveal (5 mins)**
  *   **Ask:** "How many games ended at Node 1?" (Expect most hands).
  *   **Ask:** "Player 1s, look at your belief slips. Did you predict your partner would Pass at Node 2?"
  *   **The Sting:** Most will say "Yes, I hoped they would pass, but I took anyway."
  *   **Point:** This highlights the gap between *hope* (wishful thinking) and *strategic belief* (expecting rationality).

  **Step 2: Locating the Unraveling (10 mins)**
  *   **Draw the tree on the board now.**
  *   **Ask:** "Suppose we actually reach Node 6. Player 2, what do you do?"
      *   *Answer:* Take. (48 is better than 0).
  *   **Ask:** "Player 1 at Node 5. You know Player 2 is rational and will Take at Node 6. If you Pass, you get 12 (your 20% share). If you Take, you get 40. What do you do?"
      *   *Answer:* Take.
  *   **Ask:** "Player 2 at Node 4. You know Player 1 will Take at Node 5. If you Pass, you get 6. If you Take, you get 32. What do you do?"
      *   *Answer:* Take.
  *   **The Pivot:** "Walk this logic back to Node 1. Where does the argument start?"
      *   *Answer:* It starts at the **known end** (Node 6).
  *   **Definition:** "This is **Backward Induction**. You solve the last move first, then the second-to-last, all the way to the start."

  **Step 3: Why Version 2 Broke the Logic (10 mins)**
  *   **Ask:** "In Version 2, did you Take earlier or later than Version 1?" (Expect later).
  *   **Ask:** "Where is the last node in Version 2?"
      *   *Answer:* There isn't one.
  *   **The Theory:** "Backward induction requires **Common Knowledge of the End**. Everyone must know when the game stops, and everyone must know that everyone knows.
  *   In Version 2, the die roll introduces a 'fog.' At any node, there is a chance the game continues. You cannot start the unraveling at the end, because there is no end to start from.
  *   Mathematically, the expected value of Passing becomes positive because the 50/50 split on a random end is often better than the 20% share you get if your partner Takes next turn."

  **Step 4: Rationality vs. Niceness (10 mins)**
  *   **The Hard Question:** "In Version 1, if you Passed, why did you do it?"
      *   *Student:* "I wanted to be nice." / "I trusted them."
  *   **The Correction:** "In Decision Theory, 'Nice' is not a primitive. 'Nice' means your utility function includes their payoff. But even if you are nice, Backward Induction often still holds if *you know they are not nice*."
  *   **The Real Driver:** "The unraveling doesn't happen because people are greedy. It happens because of **iterated beliefs about rationality**."
      *   "I Take at Node 1 not because I'm greedy, but because I believe *you* will Take at Node 2."
      *   "You Take at Node 2 because you believe *I* would Take at Node 3."
  *   **Key Takeaway:** "The paradox isn't about greed. It's about the fact that if we both know we are rational, and we both know we know, the game collapses. To cooperate, one of us has to doubt the other's rationality."

  ---

  ### 6. Predictable Failure Modes (Be Ready For These)

  1.  **The "Confusion" Take:**
      *   *What happens:* A student Takes at Node 1 simply because they didn't understand the pot grows.
      *   *Fix:* During debrief, check their belief slips. If they predicted "Pass" for their partner but Took themselves, they understood the game. If they predicted "Take," they might have been confused or cynical.
  2.  **The "Collusion" Pass:**
      *   *What happens:* A pair agrees beforehand to Pass until Node 6.
      *   *Fix:* Remind them during instructions: "You cannot make binding agreements. Any promise to Pass is cheap talk." In debrief, ask the class: "Why couldn't you just promise to Pass?" (Answer: Because at Node 6, the promise is no longer binding).
  3.  **The Belief Bottleneck:**
      *   *What happens:* Writing beliefs takes too long. The 60-minute clock runs out before Version 2.
      *   *Fix:* If Version 1 drags, skip the belief slips for Version 2. Just ask them to remember their mindset. Version 1 is the critical one for the BI lesson.
  4.  **The "Last Node" Ambiguity:**
      *   *What happens:* Students think Node 6 Pass leads to a bigger pot.
      *   *Fix:* Emphasize the "Pot Vanishes (0,0)" rule for Node 6 Pass. This is the anchor for the BI logic.

  ### 7. What This Activity *Cannot* Show (The Frank Limitations)

  You asked to be frank about the gaps. Here is what you tell them at the very end:

  1.  **Indistinguishability of Motives:**
      *   "If you Passed at Node 1, was it because you thought I was *irrational* (would Pass back), or because you thought I was *altruistic* (cared about my payoff)? The game looks the same. Backward Induction assumes we only care about our own points. If you care about mine, the math changes."
  2.  **Common Knowledge of Rationality (CKR):**
      *   "BI requires that I know you are rational, and you know I know you are rational, forever. In real life, I might think *you* are rational, but I might think *you think I'm crazy*. That break in the chain stops the unraveling. This game doesn't let us measure exactly where that chain broke, only that it did."
  3.  **Quantal Response:**
      *   "In the real world, people make mistakes with probability. If there is even a 1% chance I make a mistake and Pass at Node 6, the whole unraveling stops. This game treats rationality as binary (100% or 0%), which is why the paradox feels so sharp."

  ### 8. Final Tip for the Instructor
  When you draw the tree in the debrief, **do not erase the Node 6 payoff**. Keep the (48, 12) vs (0,0) visible. That specific inequality is the engine of the whole paradox. If they see that 48 > 0, and 40 > 12, the rest of the chain follows inevitably. Your job is to make them feel the tension between that logical inevitability and their desire to cooperate.
