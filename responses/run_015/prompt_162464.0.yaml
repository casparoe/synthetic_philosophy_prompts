prompt: |-
  Hey — I've got a 60-minute slot in my intro decision theory seminar next week, 16 philosophy students, most of whom have seen prisoners' dilemma and nothing else formal. I want them to *play* the centipede game rather than watch me draw it on the board, and I want them to run into the backward induction paradox before anyone says the words "backward induction." So: no lecture up front, and dont name the idea until the debrief.

  Rough shape I have in mind: pairs, six decision nodes, pot starts at 10 points and grows by 10 on every pass, taker gets 80% and the other player 20%, points convertible into something trivial at the end. I'd also like a private belief elicitation before each person chooses — what they expect their partner to do, and what they expect their partner expects of them — scored honestly somehow, without tipping the answer. Then, second half, a variant that breaks the unravelling: after every pass I roll a die behind a screen, and on a six the game ends right there with the pot split evenly, so no one ever knows whether the current node is the last one. They play that version twice.

  What I need from you: the exact instructions I can read out, the payoff numbers worked out so the sting is real, and a debrief that maps specific moments onto the structure of the argument — the move-one takes in round one, the gap between predictions and outcomes, the fixed-length versus foggy-length difference. In particular: where exactly does the unravelling begin, and why does it have nowhere to begin in the die version? I want them walking out seeing that the force of the argument comes from a commonly known last node plus iterated beliefs about rationality, not from greed or from distrust as such. Also tell me what will predictably go wrong the first time I run this, and be frank about what the activity can't show — I suspect it can't distinguish "my partner isn't an expected-utility maximizer" from "my partner is just nice," but tell me if there's a bigger gap than that. American English please.
