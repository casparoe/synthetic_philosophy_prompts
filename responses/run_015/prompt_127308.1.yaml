      *   *Tone Check:* Needs to be authoritative, slightly provocative (Nietzschean), and practical.
      *   *Structure:*
          1.  The Hook/Prerequisite.
          2.  The Example.
          3.  The Triad (with misconception interception).
          4.  The Refusal.
          5.  The Closing Question.

      *(Self-Correction on the Example)*: While Hugo is the classic academic example, for *novelists*, maybe **Robert Graves** or **Mary Renault** is better? No, they are usually successful. The prompt asks for a novel that *collapses*. Hugo is the best fit for "Antiquarian collapse." I will specify *Book III, Chapter I* of *Notre Dame* ("Notre-Dame" the chapter). It's infamous.

      *(Self-Correction on the End Question)*: It needs to be about the *writer's* present self or the *character's*? Nietzsche says Critical history is for the *living* to break the past. So the writer must be willing to break their own reverence. "What research must you burn?"

      *(Final check on Misconceptions)*:
      1. Antiquarian = Accuracy (The most common trap).
      2. Critical = Revisionism (The political trap).
      3. Monumental = Heroism (The genre trap).

      Let's assemble.

      *Wait, one more thing:* The prompt asks for "what properties it needs to have and lack." regarding the example.
      *   Have: Exhaustive detail, authorial pause, reverence for the object.
