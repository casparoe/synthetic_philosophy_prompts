      *Okay, ready to write.*
answer: |-
  Here is the session plan. It is designed to be 90 minutes, sharp, and deliberately provocative.

  ### 1. The Prerequisite Idea: The Necessity of Forgetting
  **Before** you introduce Nietzsche's three modes, you must land one concept: **Narrative vitality requires amnesia.**

  Writers enter this workshop believing research is *accumulation*. You must convince them that research is *subtraction*. If they believe the goal is to "know everything about the era," they cannot hear the warning.

  *   **The Pitch:** "A living organism cannot digest the entire past. To act in the present, you must draw a horizon around yourself. If you see too much history, you cannot move. Your story is a living thing; the archive is a graveyard. To write the present tense of your novel, you must be willing to murder the past."
  *   **Why this first:** Nietzsche's entire essay is about *Life* vs. *History*. If they think History serves Truth, they fail. If they understand History serves *Life* (the story), they are ready.

  ### 2. The Carrying Example: Victor Hugo's *The Hunchback of Notre Dame*
  Do not use a contemporary failure; use a masterpiece that chokes on its own research. Specifically, **Book III, Chapter I ("Notre-Dame")**.

  *   **The Context:** Hugo stops the plot dead for dozens of pages to describe the architecture of Paris and the cathedral as it stood before the revolution.
  *   **Properties it MUST Have:**
      *   **Static Reverence:** The narrator speaks of the building as a holy relic, not a setting for action.
      *   **Encyclopedic Scope:** It catalogs what *was*, not what *is happening*.
      *   **Authorial Intrusion:** The voice shifts from storyteller to historian/archivist.
  *   **Properties it MUST Lack:**
      *   **Character Agency:** Quasimodo and Frollo are absent. The stones do not react to them; the stones just *are*.
      *   **Narrative Consequence:** You could remove these chapters and the plot holds. The detail does not drive the conflict; it museums the setting.
  *   **Why this example:** It demonstrates the **Antiquarian** collapse. It shows that even a genius can let the past suffocate the present. It proves that "richness" can be a form of death.

  ### 3. The Triad & Misconception Interception
  Introduce the three modes not as categories of history, but as **three ways your research can kill your draft.**

  **A. Monumental History (The Trap of Inspiration)**
  *   **The Mode:** Using the past to inspire great deeds in the present. Looking for heroes.
  *   **The Misconception:** *"Monumental means writing about famous people or epic stakes."*
  *   **Where to Head It Off:** Immediately after defining the mode.
  *   **The Correction:** "Monumental isn't about scale; it's about *distortion*. It is when you force your characters to be bigger than they are because you want the era to feel 'important.' You ignore the mud and the boredom to create a statue. Your characters become action figures, not humans."

  **B. Antiquarian History (The Trap of Accuracy)**
  *   **The Mode:** Preserving the past for its own sake. Reverence for the detail.
  *   **The Misconception:** *"Antiquarian just means I did my homework and the details are accurate."*
  *   **Where to Head It Off:** When showing the Hugo example.
  *   **The Correction:** "Accuracy is irrelevant. The Antiquarian disease is when the detail stops the blood flow. You are not preserving a city; you are mummifying a corpse. If the reader learns about the stitching on a doublet but doesn't feel the character's sweat, you have written a catalog, not a novel."

  **C. Critical History (The Trap of Judgment)**
  *   **The Mode:** Judging and condemning the past to free the present.
  *   **The Misconception:** *"Critical means writing revisionist fiction or correcting the historical record for political reasons."*
  *   **Where to Head It Off:** Just before the closing exercise. This is the most dangerous misunderstanding.
  *   **The Correction:** "Critical history is not about being 'right' about the past. It is about *breaking* the past so you can survive. It is violent. It is not revisionism; it is patricide. If you aren't willing to damn your own setting, you are still its servant."

  ### 4. What to Openly Refuse to Explain
  You must draw a boundary between philosophy and craft.

  *   **The Refusal:** "I will not explain Nietzsche's philological method. I will not explain the 19th-century German context of this essay. I will not discuss whether Nietzsche was 'right' about history in a factual sense."
  *   **The Reason:** "We are not here to understand Nietzsche. We are here to use him as a weapon against your own drafts. If you ask me about the philosophy, you are engaging in Antiquarian behavior toward this workshop. You are preserving the lecture instead of living through it."

  ### 5. The End Question
  To prove they understand that Critical History is self-destructive (that it destroys the *present self's* reliance on the past, not just the record), ask this:

  > **"What specific piece of research you love the most—the fact, the anecdote, the detail that made you want to write this book—must you burn today to let your protagonist survive?"**

  *   **Why this works:** If they answer with a plot point, they missed the point. If they answer with a "truth" they are clinging to, they understand. It forces them to identify their own *Antiquarian* attachment and apply *Critical* violence to their own attachment to the material. It proves they understand that serving the story requires destroying the researcher's ego.
