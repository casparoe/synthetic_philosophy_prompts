      *   *Proposed Framework:* **The Tripartite Theory of Ludic Moral Status.**
          1.  **Narrative Identity (Diegetic Depth):** Does the character have a unique history/personality that the player recognizes? (Sims named vs. unnamed).
          2.  **Ludic Weight (Mechanical Consequence):** Does the loss matter mechanically *and* emotionally? Is it reversible? (Mario death vs. Dark Souls betrayal).
