      *   *Refining the Principle:* It's not that the characters *are* moral patients, but that the *player's action* reflects a vice or virtue. However, the user asks if *characters* can be objects of concern. The best philosophical middle ground is **Quasi-Realism** or **Proprietary Attitude**. We treat them *as if* they matter because our moral psychology reacts to the *representation* of suffering/loss.
