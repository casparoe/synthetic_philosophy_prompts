answer: |-
  Your intuitions are remarkably consistent with a specific branch of ethical inquiry often applied to interactive media: **the ethics of engagement** rather than the **ontology of the object**. You are not asking if the code *is* sentient, but whether the *relationship* between player and simulation generates moral obligations.

  Your verdicts suggest that moral concern in games is not binary (present/absent) but gradient, dependent on how successfully the game triggers our real-world moral heuristics.

  Here is a coherent account that captures your verdicts, followed by an analysis of your specific test cases.

  ### The Principle: Simulated Interiority and Investment (SII)

  The principle that unifies your cases is **Simulated Interiority and Investment**. A game character becomes a proper object of moral concern to the degree that three conditions are met:

  1.  **Diegetic Specificity (Identity):** The character is represented as having a unique history, name, or personality distinct from their function. (Named Sim vs. Anonymous Sim).
  2.  **Ludic Irreversibility (Continuity):** The consequences of actions persist across time in a way that mimics the finality of real-world harm. (Persistent world wipe vs. instance reset; Mario respawn vs. Dark Souls permanent loss).
  3.  **Player Investment (Relationship):** The player has expended emotional or temporal capital to establish a bond, transforming the entity from a *tool* to a *companion*.

  Under this account, the "wrong" is not necessarily committed *against the code* (which cannot suffer), but against the **integrity of the fictional world** and the **moral character of the player**. When you harm a high-SII character, you are violating a "fictional contract" that asks you to treat the simulation *as if* it were real.

  ---

  ### Application to Your Cases

  *   **The Sims (Named vs. Anonymous):** The named Sim has **Diegetic Specificity**. You have projected a narrative onto them. The anonymous Sims are merely **Mechanical Instrumentality**; they are resources (population count) rather than agents.
  *   **XCOM (Procedural vs. Scripted):** The scripted squadmate has high **Player Investment** via cutscenes and dialogue. The procedural soldier is a stat block. Losing the former is a narrative tragedy; losing the latter is a tactical cost.
  *   **Minecraft (Villager vs. Zombie):** This is a **Teleological** distinction. Killing a villager frustrates their *telos* (purpose/function) within the economy. Curing a zombie restores that *telos*. The moral weight comes from whether you are diminishing or flourishing the simulated ecosystem.
  *   **Mario vs. Dark Souls:** Mario is a pure avatar; his death is a punctuation mark (a reset). In Dark Souls, the character is an accumulation of loot, time, and story progress. Walking them into a trap is **Betrayal of Investment**.
  *   **Persistent World:** This maximizes **Ludic Irreversibility**. If NPCs remember, they possess simulated continuity. Wiping them erases a "history," which maps onto our intuition of genocide (erasure of a people's existence).

  ---

  ### Addressing Your Specific Questions

  #### 1. The Revival Mechanic Case
  *Case: In a narrative-driven game, a companion dies. In-game currency can resurrect them. Is refusing to pay morally callous or inefficient?*

  **Verdict:** It depends on the **Framing of the Economy**.

  *   **Scenario A (Mercenary Framing):** If the companion is a hired gun and the currency is scarce (required for game progression), refusing is **Efficient Allocation**. The game has framed life as a commodity. To pay is to be sentimental; to not pay is to be pragmatic. The "contract" is transactional.
  *   **Scenario B (Familial Framing):** If the companion is narratively established as a friend/brother/sister, and the currency is abundant (or grindable without significant sacrifice), refusing is **Morally Callous**.

  **Why?** Under the SII principle, a narrative companion has high **Diegetic Specificity**. Introducing a revival mechanic creates a **Test of Loyalty**. If the game asks, "Do you value this relationship more than this gold?", and you choose gold, you are rejecting the fictional contract of the relationship.
  *   **The Nuance:** If paying the currency makes the rest of the game impossible to win (forcing a "bad ending" for everyone), refusing might be a **Utilitarian Necessity**. But if it is merely "inconvenient," refusing is a vice (stinginess/betrayal) within the magic circle.

  #### 2. The Procedural Character Case
  *Question: Does the principle imply that purely procedural characters can never be wronged, or only that wronging them requires a different kind of moral failure?*

  **Verdict:** They can be wronged, but the nature of the wrong shifts from **Harm** to **Expression**.

  *   **Harm-Based Wronging:** Requires **Simulated Interiority**. Since procedural characters lack unique history/memory, you cannot "hurt" them in a way that matters *to them*.
  *   **Expressive Wronging:** You can wrong *yourself* or the *moral ecosystem* by treating them purely as meat.

  **The "Different Kind of Failure":**
  Treating procedural characters as disposable cultivates **Desensitization**. If a game mechanics encourage you to treat procedural humans as fuel (e.g., *Dwarf Fortress* necromancy, or *XCOM* body shielding), the moral failure is not that the soldier suffered, but that the **player endorsed a worldview where human life is expendable.**

  However, there is an exception: **Emergent Investment.**
  If a procedural XCOM soldier randomly generates a unique trait (e.g., "Ironman," "Shots Never Miss"), and you use them for 20 hours, they gain **Retroactive Diegetic Specificity**. At that point, sacrificing them for a minor gain becomes a moral failure comparable to losing a scripted character. The moral status is not inherent to the code, but **conferred by the player's attention.**

  ### Summary of the Coherent Account

  Your intuitions are captured by **Relational Moral Realism within the Magic Circle**.

  1.  **Moral Status is Conferred, Not Inherent:** Game characters do not have rights by default. They acquire moral weight through **Narrative Specificity** and **Player Investment**.
  2.  **The Wrong is Relational:** Harming a high-status character is a betrayal of the relationship you built with the simulation. Harming a low-status character is merely a mechanical action.
  3.  **Persistence Matters:** Irreversibility (memory, permadeath) is the multiplier. A reversible harm is a puzzle; an irreversible harm is a tragedy.

  **Final Ruling on your Reversing Case:**
  If the companion is narrative-scripted (High Specificity) and the cost is not game-breaking, refusing to revive them is **Morally Callous**. You are prioritizing abstract resources (gold) over a simulated relationship (loyalty), which violates the internal ethics of the narrative experience. You are playing the *mechanics* correctly but playing the *game* wrongly.
