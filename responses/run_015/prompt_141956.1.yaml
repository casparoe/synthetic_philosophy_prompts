  **TO:** The Senate Committee on Admissions and Appointments
  **FROM:** The Chair, Working Group on Selection Criteria
  **SUBJECT:** Proposed Protocol for Group-Conscious Selection Elements
  **DATE:** October 26, 2023

  **PART I: THE OPERATIONAL PROTOCOL (ONE-PAGE DOCUMENT FOR READERS)**

  *Instructions: This protocol must be completed and signed by the Panel Chair before any group-conscious element (e.g., weighting, tie-break, pool expansion) is applied to a selection cycle. If any box is unchecked, the element must not be used.*

  **1. AUTHORITY & MANDATE**
  *   [ ] **Legal Requirement:** Is this element required by external law or regulation (e.g., Hospital Board composition)?
      *   *If YES:* Proceed to Section 3. (Section 2 waived).
      *   *If NO:* Proceed to Question 2.
  *   [ ] **Legal Permission:** Is this element permitted under current institutional legal counsel guidelines (i.e., no fixed quotas for admissions/hiring)?
      *   *If NO:* **STOP.** Element prohibited.
      *   *If YES:* Proceed to Question 2.

  **2. NECESSITY & EVIDENCE (Required if not Legally Mandated)**
  *   [ ] **Problem Definition:** Is there documented evidence of under-representation relative to the *qualified applicant pool* (not general population)?
      *   *If NO:* **STOP.** Element prohibited.
      *   *If YES:* Proceed.
  *   [ ] **Proxy Validity:** Does group membership reliably correlate with the specific selection goal (e.g., perspective, overcoming disadvantage) *in this specific context*?
      *   *Evidence Required:* Data or literature review < 3 years old.
      *   *If NO:* **STOP.** Element prohibited.
      *   *If YES:* Proceed.
  *   [ ] **Burden Check:** Does this element impose a significant cost on a specific individual applicant (e.g., rejection despite higher metrics) to benefit a group goal?
      *   *If YES:* **ESCALATE.** Must be approved by Senate Subcommittee on Ethics. (Do not proceed).
      *   *If NO:* (e.g., pool expansion only): Proceed to Section 3.

  **3. MECHANISM & LIMITS**
  *   [ ] **Type:** Select one.
      *   [ ] **Floor:** Minimum representation required (Permitted only if Legally Mandated).
      *   [ ] **Plus Factor:** Group membership adds weight *after* merit threshold is met.
      *   [ ] **Tie-Break:** Used only between equally qualified candidates.
      *   [ ] **Pool Expansion:** Outreach only; no weighting in final selection.
  *   [ ] **Sunset:** Review date set? (Max 3 years).
      *   *If NO:* **STOP.** Element prohibited.

  **4. SIGN-OFF**
  *   Panel Chair Signature: ___________________ Date: __________
  *   General Counsel Verification (if Mandated): ___________________
  *   Senate Ethics Subcommittee (if Burden = YES): ___________________

  ***

  **PART II: CHAIR'S EXPLANATORY MEMORANDUM (ADDRESSING THE FIVE REQUIREMENTS)**

  *This section is for the Senate and General Counsel. It details the logic, limitations, and applications of the Protocol above.*

  **1. The Ordered Questions and Stop Points**
  The Protocol forces a linear logic to prevent "reflexive" decision-making.
  *   **The Hard Stop (Legal):** For Admissions/Hiring, if Counsel says "no," the procedure ends. There is no ethical override for legal prohibition.
  *   **The Hard Stop (Evidence):** If under-representation cannot be proven against the *qualified pool* (not the general population), the procedure ends. This prevents solving a demographic problem that does not exist in the pipeline.
  *   **The Escalation Point (Values):** Question 2(c), the "Burden Check." If the mechanism causes a specific individual to be rejected who otherwise would have been accepted, this is no longer a factual question. It is a value conflict between individual merit and group equity. The Protocol strips the Panel of the authority to decide this alone; it must be escalated to the Senate Ethics Subcommittee. This honestly marks the disagreement rather than disguising it as "holistic review."

  **2. Vindication of Distinctions**
  *   **Reordering vs. Pool Expansion:** The Protocol distinguishes these in Section 3. Pool expansion (outreach) rarely triggers the Burden Check. Reordering (tie-breaks/plus factors) often does. This is vital because the moral cost of the latter is significantly higher.
  *   **Denominator:** Section 2(a) specifies *qualified applicant pool*. Using the general population is factually incorrect for specialized roles (e.g., clinicians) and invites legal challenge.
  *   **Floor vs. Ceiling:** Section 3 explicitly allows Floors *only* if Legally Mandated (e.g., Hospital Board). Ceilings are never permitted. A floor remedies exclusion; a ceiling enforces it.
  *   **Proxy Decay:** Section 2(b) requires evidence < 3 years old. This addresses the "generational" concern. If a group has utilized access schemes for two generations, the correlation between membership and disadvantage may have fractured. The proxy must be re-validated.

  **3. The Missing Distinction: Instrumental vs. Corrective**
  The Protocol implicitly requires you to choose, though it does not name it.
  *   **Instrumental:** We select for diversity because it improves the outcome (e.g., diverse doctors improve patient trust).
  *   **Corrective:** We select for diversity because the institution owes a debt for past exclusion.
  *   **Why it matters:** An Instrumental justification fails if the group member does not bring the "perspective" (e.g., a wealthy alumnus of an under-represented group). A Corrective justification holds regardless of perspective. The Protocol's "Proxy Validity" check leans Instrumental. If the Senate intends Corrective justice, Section 2(b) must be amended to accept "Historical Exclusion" as sufficient evidence without requiring a functional proxy. I have left it Instrumental to survive legal scrutiny, but the Senate must know this limits the moral scope.

  **4. Application to Three Cases**

  *   **Case A: First-Year Undergraduate Admission (30k applications, 2k places)**
      *   *Authority:* No legal mandate. Counsel prohibits quotas.
      *   *Necessity:* Evidence shows under-representation in qualified pool.
      *   *Burden:* High. Using group membership as a "plus factor" inevitably shifts a place from one individual to another.
      *   *Outcome:* **ESCALATE.** Any weighting system must go to the Senate Ethics Subcommittee. The Panel cannot implement this unilaterally.
      *   *Honest Result:* This constrains current practice. If panels are currently using unwritten weighting to hit targets, they must stop and seek Senate approval for the *value judgment* involved.

  *   **Case B: Clinical Training Places (40 places, patient safety risk)**
      *   *Authority:* No legal mandate for diversity, but high duty of care to patients.
      *   *Proxy Validity:* Does doctor diversity improve patient outcomes *in this specialty*? Evidence is mixed/specific.
      *   *Burden:* High. A bad selection costs patient health.
      *   *Outcome:* **RESTRICTED.** Group membership may only be used as a Tie-Break between *equally* clinically qualified candidates. It cannot be a "plus factor" that overrides clinical metrics.
      *   *Honest Result:* This may reduce the number of diverse candidates selected compared to Undergraduate Admissions. The cost of a bad choice falls on patients, not just the rejected applicant. The Procedure prioritizes the patient.

  *   **Case C: Hospital Board Appointment (Legal 40% Sex Requirement)**
      *   *Authority:* Legal Mandate (National Rule).
      *   *Necessity:* Waived.
      *   *Mechanism:* Floor.
      *   *Outcome:* **PERMITTED.** Section 1 allows bypassing Section 2.
      *   *Honest Result:* This highlights the inconsistency between Admissions and Governance. We are forbidden from using numbers for students but required to use them for governors. The Protocol accepts this legal reality without pretending it is philosophically consistent.

  **5. Limitations and Laundering**
  *   **Unresolvable Conflicts:** The Procedure cannot reconcile the Senate minority who believe *any* group-consciousness is wrong with those who believe *current* practice is timid. It simply forces the "timid" group to escalate the decision, making the conflict visible.
  *   **Systematic Errors:** The Procedure assumes "Qualified Pool" data exists. It often does not. Panels may fabricate denominators to pass Section 2(a).
  *   **Laundering Detection:** As Chair, I will look for three signs of bad faith:
      1.  **The "Holistic" Shield:** Panels claiming they are not using weighting (Section 3) but achieving demographic results that statistically require it.
      2.  **The Expired Proxy:** Using evidence for Section 2(b) that is >5 years old, ignoring generational changes in the group's economic status.
      3.  **The Escalation Dodge:** Panels classifying a "Burden" decision as "Pool Expansion" to avoid Senate Ethics review.

  **Recommendation:** Adopt the Protocol immediately. It will not solve the moral disagreement, but it will stop us from hiding it inside a black box.
