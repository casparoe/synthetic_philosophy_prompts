  **2. The AI Grading Ethics**
  You are asking an AI to grade student work. Depending on your university's academic integrity policy and your contract as a TA, **this may be a violation.**
  *   **FERPA/Privacy:** If you uploaded this to a public model, you might be exposing student data (even if anonymized, the context is specific).
