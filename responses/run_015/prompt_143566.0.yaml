answer: |-
  \
  **Materials and Prep**
  *   **Room:** 8 tables (2 chairs each). Whiteboard visible to all.
  *   **Printed Packs (8 identical sets):**
      *   **Round 1 Card:** "Claim: 5 people visited the library." (Blank paper provided).
      *   **Round 2 Card:** "Claim: 50 people visited the library." + **Icon Sheet** (Sheet of 20 identical "person" stamps/icons).
      *   **Round 3 Card:** "Claim: 1,450 books were lent." + **Icon Sheet** (Sheet of 20 identical "book" stamps/icons) + **Key Card** ("1 Icon = 100 Books").
      *   **Round 4 Card:** "Claim: No books were lost because it rained." + **Icon Sheet** (Book, Raindrop, Arrow, Cross-out symbol).
      *   **Confederate Card (1 pair only, slipped into Round 4 pack):** "Special Rule: A crossed-out icon means 'Data Missing,' not Zero."
      *   **Decoder Sheets:** Blank paper for drawing reconstruction.
      *   **Scorecards:** For facilitator to track accuracy.
  *   **Tools:** Pens, markers, timer, bell.

  **Timeline (90 Minutes)**
  *   **00–05:** **Setup.** Pair participants randomly. Ensure ESL speakers are mixed, not isolated. Hand out Round 1 packs.
  *   **05–10:** **Rules (No Theory).** "You are Encoder and Decoder. Encoder gets a fact. Decoder gets nothing. Encoder must transmit the fact using *only* drawings. No numbers, no letters, no talking. Decoder draws what they think the fact is. We compare."
  *   **10–20:** **Round 1 (Intuition).** Freehand drawing. Collect charts. Reveal accuracy (usually low/varied).
  *   **20–35:** **Round 2 (Convention).** Hand out Icon Sheets. Rule: "You must use these stamps. To show more, repeat the stamp. Do not draw bigger stamps." Collect charts.
  *   **35–50:** **Round 3 (Transformation).** Hand out Round 3 packs. The numbers (1,450) exceed the icons (20 icons x 100 = 2,000 max, but 1,450 requires 14.5 icons). Pairs must decide: Round up? Down? Split an icon? Collect charts.
  *   **50–65:** **Round 4 (Logic).** Hand out Round 4 packs. Include Confederate Card in one pair's pack silently. Task: Encode the negation and causality. Collect charts.
  *   **65–75:** **The Glitch.** Display all Round 4 charts. Ask the room to read the Confederate pair's chart aloud. They will read it wrong (e.g., "Data missing" vs "Zero"). Reveal the Confederate rule.
  *   **75–85:** **Debrief & Reveal.** Connect failures to Neurath (see below). Reveal names (ISOTYPE, Vienna Method).
  *   **85–90:** **Teardown.**

  **Source Data and Target Claims**
  *   **R1:** "5 people visited." (Tests raw pictorial intuition).
  *   **R2:** "50 people visited." (Tests adherence to standard units vs. scaling).
  *   **R3:** "1,450 books were lent." (Tests *Transformation*: 14.5 icons required. Do they draw half a book? Round to 15? Drop to 14?).
  *   **R4:** "No books were lost because it rained." (Tests logical limits: Negation and Causality).

  **Scoring and Payoff**
  *   No prizes. Scoring is public correction.
  *   **Round 1-3:** Facilitator holds up Original Claim vs. Decoder Drawing. Ask room: "Is this the same?"
  *   **Round 4:** The payoff is the Confederate failure. The "score" is the collective realization that the chart was legible but wrong.

  **Debrief Script (Mapping Moments to Claims)**
  1.  **Round 1 Failure (Visual Education):** "In Round 1, your 'people' looked different. One drew stick figures, one drew heads. Neurath called this the need for *visual education*. Pictures aren't natural; they are learned."
  2.  **Round 3 Decisions (Transformation):** "In Round 3, you had 1,450 books but the key was 100. Who drew half a book? Who rounded up? That decision is *Transformation*. The chart doesn't show reality; it shows a decision about reality."
  3.  **Round 4 Failure (Helping Language):** "Most of you struggled to draw 'because' or 'no'. You can show a book and a raindrop, but not the link. Neurath called ISOTYPE a 'helping language' because it cannot say 'if', 'no', or 'because' without text."
  4.  **Confederate Reveal (Convention):** "The Confederate chart was read fluently but wrongly. The convention (cross-out = missing) was learned by one pair, not the room. Transparency is just shared habit."
  5.  **The Reveal:** "This method was developed by Otto Neurath in Vienna (ISOTYPE). He argued exactly what you experienced: pictures require teaching, transformation, and cannot replace logic."

  **Predictable Failures and Recovery**
  *   **Failure:** Participants talk during encoding.
      *   **Recovery:** Ring bell. "Silent transmission only. If you speak, the channel is broken."
  *   **Failure:** Participants write numbers secretly in Round 1 or 2.
      *   **Recovery:** Disqualify that card immediately. "The constraint is the lesson."
  *   **Failure:** Round 3 takes too long (debating rounding).
      *   **Recovery:** Call time at 50 mins regardless. "The debate *is* the transformation. Stop."
  *   **Failure:** ESL participants feel excluded during debrief.
      *   **Recovery:** Ask them specifically: "Did the icons feel more universal than words, or did you have to guess the culture behind the icon?" Validate both answers.

  **Judgment on Constraints**
  1.  **Is your instinct too strong?** No. Your friend confuses *familiarity* with *transparency*. A heart icon is transparent only because you have been taught its meaning. The activity proves that without shared convention (Round 1) or logical syntax (Round 4), pictures are ambiguous. However, acknowledge that some icons (fire, danger) are more culturally stable than others (books, lending).
  2.  **ESL Participants:** Do not treat them as proof of universal vision. If they succeed better than native speakers, it is likely because they are accustomed to decoding without full linguistic fluency, not because the pictures are universal. If they struggle, it proves icons are culturally coded. Both outcomes support Neurath: visual literacy requires *education*, not just eyes. The activity tests the *need for standardization*, which was Neurath's internationalist goal.

  **What the Activity Cannot Make Them Feel**
  You must state this yourself: The activity cannot make them feel the *political hope* behind Neurath. He didn't just want clear charts; he wanted a visual language that could bypass class barriers and national languages to empower workers and refugees. The activity proves the *mechanism* is flawed without education, but only you can explain that the *goal* was social equality, not just design clarity.

  \answer{Repeat same-sized figures; never enlarge one to show quantity.}
