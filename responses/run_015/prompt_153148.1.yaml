prompt: |-
  My friend and I spent two hours after dinner arguing about weakness of will and I think we talked past each other the whole time, so I want the document we should have written instead. He's the present-bias guy: akrasia is just a declining rate of time preference, the reward looms, the steep part of the curve takes over, nothing more to explain. I think that describes one route into it and misses the phenomenon — I can act against what I judge best right now with nothing pleasant at stake at all, like hitting send on the angry email — and that doesn't look like a discount rate to me. Neither of us could say what would settle it.

  So: draft the joint statement of an adversarial collaboration between the two of us. First a numbered section of claims we'd both sign — we already agree that resolutions get dropped without any new information coming in, that akratics aren't compelled or ignorant at the moment, and that not every reversal of a resolution is a case of akrasia. Then the disagreements as a table: for each one, the claim in the wording he'd accept and in the wording I'd accept, and please drop anything where the two wordings turn out to say the same thing. Then the cruxes — the sub-questions such that an answer would move at least one of us — and for each, a test we'd both accept as bearing on it, with his prediction and mine written down in advance.

  Use these as the tests; we half-designed them and neither of us is sure who they help. One: the frozen-frame protocol, where every option carries the same delay to its outcome, so immediacy isn't available to explain anything — do people still reverse their own resolution? Two: the uptake test — does reaching for a commitment device track how steep somebody's measured delay discounting is, or how strongly they identify with the plan? Three: the no-stakes case — is acting against your own judgment when there's no reward on offer the same thing as the temptation cases, or a different animal?

  No citations, we've both read the literature. Hard cap of 700 words, and tell us straight if some of this is just a fight about words.
