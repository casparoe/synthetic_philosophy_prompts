answer: |-
  The activity is called "The Archive Protocol," and it works by forcing students to choose between the anguish of open negotiation and the relief of bureaucratic slavery, revealing bad faith as a sedative rather than a mistake.

  ### Setup and Materials
  *   **Stakes:** The group must select one of three philosophical texts for the next workshop. To raise tension, announce that if no decision is reached in 30 minutes, *you* (the facilitator) will assign a text everyone hates (e.g., a 50-page administrative policy document).
  *   **Facticity Cards (12 unique):** Hand these out face-down at the start. They represent the "given." Examples: "You have already read Option B," "You cannot speak until everyone else has spoken once," "You must leave the room 10 minutes before the session ends," "You are allergic to Option C." These are non-negotiable constraints.
  *   **Project Cards (12 unique):** Hidden goals representing "transcendence." Examples: "Ensure Option A wins," "Ensure no consensus is reached," "Make sure Person 5 speaks," "Finish the decision in under 5 minutes."
  *   **The Protocol Sheet (1 copy, placed centrally):** A printed document titled "Emergency Decision Protocol 7-B." It cites fake "Previous Workshop Rulings" (the practico-inert). Example clauses:
      *   *Clause 1:* "Per Ruling 4.2, Option A is prioritized for grad cohorts."
      *   *Clause 2:* "Per Ruling 3.1, Option A is ineligible due to copyright constraints."
      *   *Clause 3:* "Voting must be unanimous."
      *   *Clause 4:* "If unanimity fails after 3 rounds, the Facilitator chooses."
      *   *Instruction:* "To invoke, all participants must stop speaking and submit written votes simultaneously."

  ### The Flow (90 Minutes)

  **1. Induction (10 mins)**
  Explain the task: Choose next week's text. Distribute Facticity and Project cards. Tell them they can reveal Facticity but must keep Projects hidden. Start the clock. Do not intervene. Let the friction of conflicting facticity (e.g., someone must leave early vs. everyone must speak) create anxiety.

  **2. The Crisis (20 mins)**
  As frustration peaks, point to the Protocol Sheet. Say nothing else. If they invoke it, they must stop talking immediately. They become a serial collective: individuals aligned only by the paper, passing notes, no eye contact, no negotiation. They will quickly discover the contradictions in the Clauses (A is prioritized but ineligible; unanimity required but facilitator chooses if failed). They must try to "solve" the protocol using only the protocol. They will feel relief (no more arguing) turning into entrapment (the rules make success impossible, but they must keep following them).

  **3. The Collapse (15 mins)**
  Let them run into the wall of the contradictions. If they realize the trick, push them to finish the form anyway. If they refuse the protocol, highlight that *refusing* was also a choice they made to avoid the protocol's constraints. End the activity exactly when the tension is highest.

  **4. The Debrief (45 mins)**
  Map the experience directly to Sartrean concepts without jargon initially, then introduce terms:
  *   **Facticity Cards → Facticity:** The brute facts you didn't choose but must live.
  *   **Project Cards → Transcendence:** Your reach beyond the facts toward a goal.
  *   **The Deliberation Phase → Radical Freedom:** The anxiety you felt when realizing no rule dictated your choice; you were responsible for the outcome.
  *   **Invoking the Protocol → Bad Faith:** The moment you chose to become a thing governed by rules to escape the burden of choosing. You lied to yourself that the "Protocol" decided, not you.
  *   **The Protocol Text → The Practico-Inert:** Past choices (fake rulings) hardened into matter that now strangles your current freedom. You are maintaining contradictions authored by "previous selves" (the fake rulings) as if they were law.
  *   **Silent Voting → The Serial Collective:** You stopped seeing each other as subjects (The Look) and became a queue of atoms processing data. The Look was neutralized because you refused to see each other.

  ### What Breaks and What You Must Fill
  **The First Run Failure:** Grad students will likely meta-game immediately. They will spot the "trap" of the Protocol and either refuse it on principle or treat it as a puzzle to be solved logically rather than an existential surrender. To counter this, you must enforce the *silence* rule strictly during the Protocol phase. If they talk, stop them. The feeling of bad faith requires the *suspension* of communication, not the optimization of it.

  **The Unreproducible Limit:** The game cannot reproduce **responsibility for the freedom of the Other.** In Sartre's ontology, when I choose, I create an image of what "man" ought to be, thereby weighing on the freedom of every other human. In this workshop, if a student chooses badly or follows the protocol, the only consequence is a text selection. They do not feel the ontological weight that their bad faith *licenses* bad faith in others. You must articulate this in the debrief: explain that in the real world, invoking the Protocol doesn't just constrain *you*, it validates the Protocol for *everyone*, stripping them of their humanity too. The game simulates the *feeling* of entrapment, but not the *ethical horror* of defining humanity through your escape.
