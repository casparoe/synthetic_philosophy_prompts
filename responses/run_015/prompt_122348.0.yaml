      *   *Bad Faith:* Lying to oneself to escape freedom/responsibility (often by pretending to be a thing/object or following a script).
      *   *Facticity:* The facts of your situation (body, past, environment).
      *   *Transcendence:* The ability to go beyond facticity through projects/choices.
      *   *Practico-Inert:* (More Sartrean via *Critique of Dialectical Reason* than *Being and Nothingness*, but requested here). Past praxis solidified into matter/institutions that constrain current praxis.
