answer: |-
  **HANDOUT: Disambiguating the Claim "Nuclear Weapons Are Unusable"**
  **Seminar:** Ethics and Epistemology of Catastrophic Risk
  **Purpose:** To isolate distinct truth-apt theses concealed within the slogan "nuclear weapons are unusable," ordered from least to most committal regarding the impossibility of employment.

  1.  **The Claim of Military Futility**
      *   **Thesis:** No plausible scenario exists in which the detonation of a nuclear weapon achieves a coherent political or military objective that outweighs the costs of retaliation and fallout.
      *   **Verdict:** Substantive and defensible empirical claim.
      *   **Evidence Against:** Historical war games suggesting limited nuclear options could terminate conventional conflicts; scenarios involving desperate regime survival where "costs" are discounted.

  2.  **The Claim of Rational Irrationality**
      *   **Thesis:** Given common knowledge of second-strike capabilities, ordering a nuclear strike is strictly dominated by all other strategies for a rational actor maximizing state survival.
      *   **Verdict:** Substantive claim (Game-Theoretic).
      *   **Evidence Against:** Non-unitary actors (factionalized commands); leaders valuing ideology/honor over survival; misperception of adversary resolve or capability.

  3.  **The Claim of Escalatory Inevitability**
      *   **Thesis:** Any nuclear employment, however limited, triggers an uncontrollable process of escalation leading inevitably to strategic exchange (the "firebreak" cannot hold).
      *   **Verdict:** Substantive empirical claim.
      *   **Evidence Against:** Resilience of command-and-control systems; historical instances of restraint during crises (e.g., Kargil, Cuban Missile Crisis); existence of sub-strategic doctrines.

  4.  **The Claim of Normative Prohibition**
      *   **Thesis:** The "nuclear taboo" and international law have rendered nuclear use politically illegitimate to the degree that no leader could sustain domestic or international support for it.
      *   **Verdict:** Substantive normative/sociological claim.
      *   **Evidence Against:** Erosion of norms in rhetorical discourse; shifts in doctrine regarding "usable" low-yield weapons; existential threats overriding normative constraints.

  5.  **The Claim of Psychological Incapacity**
      *   **Thesis:** No individual leader possesses the psychological capacity to consciously authorize mass civilian death on the scale of nuclear war.
      *   **Verdict:** Probably false (or unfalsifiable).
      *   **Evidence Against:** Historical precedents of mass atrocities by state leaders; psychological distancing mechanisms in launch protocols (pushing a button vs. pulling a trigger).

  6.  **The Claim of Absolute Inoperability**
      *   **Thesis:** Nuclear weapons cannot physically be detonated by human agency in a conflict setting (due to safety mechanisms, decay, or sabotage).
      *   **Verdict:** False.
      *   **Evidence Against:** Successful testing records; maintenance of readiness states; lack of systemic failure in decades of alerting.

  ***

  **ANALYTICAL COMMENTARY FOR DISCUSSION**

  **1. Mapping the Colleague's Three Policy Claims**
  Your colleague used the slogan to support three distinct conclusions. Each relies on a different thesis from the menu above:
  *   **"Modernization is waste":** Relies on **Thesis 1 (Futility)**. If the weapons cannot achieve military ends, investing in them is inefficient. *Weakness:* Ignores that the *possession* (not use) achieves the end of deterrence.
  *   **"Extended deterrence is bluff":** Relies on **Thesis 2 (Rational Irrationality)**. If it is irrational to die for an ally, the threat lacks credibility. *Weakness:* Ignores "threats that leave something to chance" (Schelling), where credibility comes from risk, not deliberate intent.
  *   **"Proliferation adds no danger":** Relies on **Thesis 2 & 4 (Universality)**. Assumes new actors will inherit the same rational constraints and normative taboos as established powers. *Weakness:* Assumes unitary rationality and stable command-and-control across all regime types.

  **2. Consistency with "Deterrence is a Robust Regularity"**
  There is a fundamental tension here. Deterrence requires a **non-zero probability of use** ($P > 0$). If "unusable" means $P = 0$ (Theses 5 or 6), deterrence is logically impossible; the adversary calculates zero expected cost and ignores the threat.
  *   **Compatible Reading:** The only reading consistent with robust deterrence is a specific version of **Thesis 3 (Escalatory Inevitability)** combined with **Thesis 2**. The weapons are "unusable" in the sense that no *deliberate* rational actor would choose war, but they generate deterrence because the *risk* of accidental or escalatory use is non-zero. This is the logic of "mutually assured destruction" not as a plan, but as a background condition.
  *   **Incompatible Reading:** If he means **Thesis 5 (Psychological)** or **Thesis 6 (Absolute)**, he undermines the mechanism of deterrence. You cannot be deterred by a gun everyone knows is unloaded.

  **3. The Modeler's Likely Meaning (and Error)**
  As a formal modeler with hawkish instincts, he likely intends **Thesis 2 (Rational Irrationality)** within a specific equilibrium model. In his models, "unusable" likely functions as shorthand for *"Not a Nash Equilibrium strategy in a bipolar peer context."*
  *   **The Error:** He is illicitly exporting an equilibrium property (no use occurs in the solution) to an ontological claim (use is impossible). In game theory, a threat must be credible *off-equilibrium* to sustain the equilibrium. If the weapons are truly "unusable" (dominated strategies), the threat is cheap talk, and the equilibrium collapses.
  *   **The Hawkish Tension:** A hawkish stance usually requires maintaining the *credibility* of use to prevent proliferation or aggression. By arguing weapons are "unusable," he inadvertently argues for disarmament (why keep useless tools?) and invites proliferation (why fear useless tools?).

  **4. The Self-Undermining Trap**
  The slogan is self-undermining if held alongside the claim that "deterrence is well-confirmed."
  *   **Where it bites:** If weapons are unusable, the "regularity" of non-use is not evidence of successful deterrence; it is evidence of irrelevance. To claim deterrence works, one must claim that adversaries *believe* use is possible. To claim weapons are unusable, one implies adversaries *know* use is impossible. He cannot have it both ways.
  *   **Recommendation:** Press him to specify whether "unusable" refers to **deliberate rational choice** (compatible with risk-based deterrence) or **causal possibility** (incompatible with deterrence). If the former, his policy conclusions on proliferation and modernization do not follow. If the latter, his claim on deterrence fails.
