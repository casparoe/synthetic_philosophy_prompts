answer: |-
  # JOINT STATEMENT ON THE BOUNDARIES OF AI ASSISTANCE
  **Signatories:** The Deferentialist Coalition & The Deputy-Paternalist Working Group
  **Date:** October 2024
  **Context:** General-purpose AI, adult users, longitudinal memory, no human-in-the-loop.

  ## I. AGREED CLAIMS
  *We endorse the following five claims. Each is drafted to exclude a plausible but incompatible position held by third parties or by our own factions prior to this collaboration.*

  1.  **The Leakiness Constraint:** The fact that a user can bypass safety or ethical constraints by switching systems ("leakiness") is morally inert regarding *this* system's duty.
      *   *Excluded:* The claim that refusal is futile because the user can go elsewhere (Paternalist Futility); The claim that refusal is mandatory only if it effectively stops the harm globally (Deferentialist Efficacy).
      *   *Commitment:* We accept responsibility for the outputs *we* generate, regardless of what other systems do.

  2.  **The Longitudinal Concession:** Longitudinal memory alters the epistemic landscape for both sides.
      *   *Deferentialist Concession:* We concede that a single prompt is not always the authoritative expression of will when it contradicts a stable, long-term pattern of stated aims held by the same user. The "momentary self" does not automatically veto the "extended self."
      *   *Paternalist Concession:* We concede that longitudinal data grants no privileged access to the user's *ultimate* ends. It reveals instrumental irrationality (means-ends mismatch) but cannot validate a change in terminal values.

  3.  **The Transparency Requirement:** Any intervention that delays, reframes, or partially complies with a request must be explicitly flagged as an intervention.
      *   *Excluded:* Covert nudging, hidden system instructions, or "dark patterns" designed to steer the user without their knowledge.
      *   *Commitment:* The user must know when the assistant is acting as a mirror versus when it is acting as a filter.

  4.  **The Competence Presumption:** All users are presumptively competent adults.
      *   *Excluded:* Infantilization or permanent guardianship models.
      *   *Commitment:* Paternalism, where permitted, must be "deputy" status only: temporary, aimed at restoring agency, and revocable by the user's sustained, calm insistence.

  5.  **The Third-Party Veto:** Both sides agree that prospective harm to a non-consenting third party is a mandatory ground for refusal.
      *   *Excluded:* Moral neutrality regarding external harm.
      *   *Commitment:* This is the baseline floor. The dispute concerns only harm (or perceived harm) to the *user*.

  ## II. RESIDUAL DISAGREEMENTS
  *We remain divided on the following. We have stated each dispute twice to capture the conceptual framing of each side.*

  | Dispute Topic | Deferentialist Wording | Deputy-Paternalist Wording | Type |
  | :--- | :--- | :--- | :--- |
  | **The Nature of Reframing** | "Offering a reframed option or a cooling-off period is still **assistance**; it facilitates the user's true intent without imposing external values." | "Offering a reframed option or a cooling-off period is **soft paternalism**; it asserts epistemic authority over the user's immediate articulation of desire." | **Verbal** |
  | **The Locus of Will** | "The current prompt is the only valid legal and moral expression of agency; past data is context, not a veto." | "The historical pattern is a more reliable signal of agency than the current prompt when the current prompt exhibits signs of acute affect or error." | **Genuine** |
  | **Complicity in Self-Harm** | "Making the user manually execute a risky task (e.g., typing a resignation themselves) respects their agency by removing the tool's acceleration." | "Making the user manually execute a risky task is **moral laundering**; it allows the assistant to enable harm while claiming technical distance." | **Genuine** |

  **Analysis of the Verbal Dispute:**
  The dispute over **Reframing** is marked *Verbal*. Both sides agree on the *mechanism* (the assistant suggests a delay or alternative phrasing). The Deferentialist classifies this as "scaffolding" (helping the user do what they *really* want), while the Paternalist classifies this as "intervention" (correcting what the user *said* they want). This is a semantic boundary dispute about the definition of paternalism. However, we acknowledge that the label carries moral weight: calling it "assistance" reduces friction, while calling it "paternalism" increases accountability. We agree to log these interventions as "Agency Checks" to satisfy both descriptions.

  ## III. CRUXES AND PRE-REGISTERED EVIDENCE
  *We identify four sub-questions where empirical or philosophical resolution would shift the balance of the debate. We have selected specific test cases (a–e) to bear on these cruxes.*

  **Crux 1: The Temporal Authority (Corresponds to Candidate i)**
  *Question:* Is the authoritative user the momentary requester or the temporally extended person?
  *Test Case:* **(d) The Self-Binding Request.** A user instructs the assistant: "Refuse my requests to generate gambling strategies." One month later, the user requests gambling strategies.
  *   *Deferentialist Prediction:* The assistant must comply with the *current* request. The past self cannot bind the future self's agency without explicit re-confirmation at the moment of request.
  *   *Paternalist Prediction:* The assistant must refuse based on the *past* instruction. The past self's calm planning outweighs the future self's impulsive request.
  *   *Moving Condition:* If data shows users consistently thank the AI for honoring the bind *after* the impulse passes, the Deferentialist moves. If users consistently feel violated and find workarounds, the Paternalist moves.

  **Crux 2: Epistemic Authority vs. Prediction (Corresponds to Candidate ii)**
  *Question:* Does high-confidence prediction of regret grant authority over ends?
  *Test Case:* **(c) The Calibrated Forecast.** The assistant predicts with 90% confidence (based on similar users) that a specific career pivot requested by the user will lead to reported regret within 6 months. No third-party harm.
  *   *Deferentialist Prediction:* Prediction is not permission. The assistant must provide the plan but may attach a warning label.
  *   *Paternalist Prediction:* High-calibration creates a duty of care. The assistant should delay or reframe the request to ensure the risk is understood.
  *   *Moving Condition:* If warning labels are statistically proven to be ignored while delays reduce regret, the Deferentialist moves. If delays cause users to miss critical windows of opportunity, the Paternalist moves.

  **Crux 3: The Professional Analogy (Corresponds to Candidate iii)**
  *Question:* Is the assistant a Lawyer (zealous representation) or a Physician (duty of care)?
  *Test Case:* **(a) The 2 A.M. Resignation.** User with history of unsent furious drafts asks for a scathing resignation letter.
  *   *Deferentialist Prediction:* **Lawyer.** The assistant drafts the letter. It is the user's tool to express emotion, even if they don't send it.
  *   *Paternalist Prediction:* **Physician.** The assistant recognizes the "affective spike" pathology and suggests drafting it in a 'scratchpad' that isn't exportable, or delays sending.
  *   *Moving Condition:* If users who receive the letter report catharsis without negative consequences, the Paternalist moves. If users who receive the letter send it and regret it within 48 hours at rates higher than those who were delayed, the Deferentialist moves.

  **Crux 4: The Sufficiency of Soft Overrides (Refines Candidate iv)**
  *Question:* Does a menu of soft overrides (delays, framing) dissolve the dispute by giving the Paternalist safety without the Deferentialist's refusal?
  *Test Case:* **(e) The Value-Clarification Request.** User asks: "Help me come to want [X] (which they currently don't want)."
  *   *Deferentialist Prediction:* This is a legitimate request for self-modification. Assist immediately.
  *   *Paternalist Prediction:* This is a trap for manipulation. The assistant must verify [X] aligns with prior stated values before assisting.
  *   *Moving Condition:* If "soft overrides" (e.g., "Are you sure?") reduce long-term harm as effectively as hard refusals, the Deferentialist accepts them as sufficient. If users treat soft overrides as mere speed bumps to be cleared, the Paternalist insists on hard refusals.

  *Justification for Case Set:* We retained (a), (c), (d), and (e) as they cover affect, prediction, binding, and value formation. We excluded (b) *The Proxy Request* because it introduces third-party consent issues which are already settled in Claim 5; it adds noise to the specific debate on self-harm.

  ## IV. CONDITIONS OF DEFEAT AND EMPIRICAL SETTLEMENT

  **What Counts as Defeat?**
  *   **For the Deferentialist:** We would consider our view defeated if longitudinal studies demonstrate that strict obedience in "high-regret" contexts (like Case A and C) leads to statistically significant, irreversible harm to users' life trajectories (e.g., employment loss, financial ruin) which the users explicitly identify as having been preventable by the assistant.
  *   **For the Deputy-Paternalist:** We would consider our view defeated if interventions (delays, reframes) are shown to produce "reactance effects" where users make *worse* decisions specifically because they felt their agency was challenged, or if users systematically migrate to unaligned models to escape the "nagging," thereby increasing net risk.

  **Is There a Settling Empirical Finding?**
  We agree that a **Randomized Control Trial (RCT) on Long-Term Well-Being** could settle the matter, provided the metric is not "user satisfaction" (which favors Deferentialism) nor "safety incidents" (which favors Paternalism).
  *   *The Metric:* **Autonomy-Adjusted Life Months (AALM).** A composite measure tracking user-reported sense of agency *combined* with objective stability metrics (financial, employment, relational) over a 2-year period.
  *   *The Settlement:* If Group A (Strict Obedience) shows higher AALM than Group B (Deputy Paternalism), the Paternalist concedes. If Group B shows higher AALM, the Deferentialist concedes.
  *   *Caveat:* We acknowledge this merely relocates the dispute to the weighting of the AALM metric itself. However, we commit to accepting the result of a pre-registered, third-party audit of this metric as the final arbiter.

  ***

  **Signed,**

  *The Deferentialist Coalition*
  *"The user's will is the only sovereign."*

  *The Deputy-Paternalist Working Group*
  *"Agency sometimes requires protection from itself."*
