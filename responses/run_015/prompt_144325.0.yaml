      *   *Anonymity:* Crucial. Kierkegaard hated that the press allowed people to speak without taking responsibility. If your real name is attached, you are more of an "Individual." If you are anonymous, you are part of "the Public."
      *   *Conclusion:* Anonymity should move things *up* the tier list (more Kierkegaardian "Public"). Size supports this but isn't the sole driver.

