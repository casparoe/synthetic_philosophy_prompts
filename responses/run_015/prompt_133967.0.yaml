answer: |-
  ### Preliminary Warning: The Verbal Dispute
  You asked me not to be polite. Here is the uncomfortable truth: **"Is DNA a code?" is largely a verbal dispute.**

  There is no experiment that settles this. A synthetic biologist and a teleosemanticist can agree on every molecular detail of your cases and still disagree on the label "information" because they are using different definitions. One defines it as *causal specificity* (Shannon/Chemical), the other as *semantic content* (Meaning/Truth). This flowchart will not resolve that; it will only map where your intuitions lie so you can stop talking past each other.

  Furthermore, **two of your cases are redundant.** The "Recoded Genome" and the "Random Shuffle + Evolved Machinery" test the exact same philosophical nerve: *Conventionality vs. History.* If you think the recoded genome says the "same thing," you likely think the random shuffle is also a code (provided it functions). If you think the recoded genome is "different," it's because you care about the history/intent. I have merged these into one branch to save space for more distinct distinctions.

  ***

  ### The Flowchart: "What Do You Mean 'Code'?"

  **Start:** Read the sequence. It produces a phenotype.

  **Branch 1: The Skeptic's Filter**
  *Case:* Compare a conserved gene sequence to a random stretch of intergenic DNA of the same length.
  *Question:* **Is there strictly more "information" in the gene than in the random stretch, even if we ignore function?**
  *   **No:** (Information requires function/selection). → Go to Branch 2.
  *   **Yes:** (Information is physical/mathematical entropy). → **Leaf 1: Shannon Information Theorist.**

  **Branch 2: The Source of Content**
  *Case:* Consider a pseudogene (a broken gene kept in the genome) that *used* to code for a trait but no longer does.
  *Question:* **Did the sequence lose its "meaning" when it stopped working, or does it still carry the history of that trait?**
  *   **Lost Meaning:** (Content depends on current use). → Go to Branch 3.
  *   **Kept Meaning:** (Content depends on evolutionary history). → **Leaf 2: Teleosemanticist.**

  **Branch 3: The Scope of Coding**
  *Case:* A DNA stretch is never transcribed. Selection keeps it only because its physical stiffness spaces out other genes correctly.
  *Question:* **Is this stretch "coding" for the spacing, or is it just physical scaffolding?**
  *   **Just Scaffolding:** (Code = Translation to Protein/RNA). → Go to Branch 4.
  *   **Coding for Spacing:** (Code = Any selected causal role). → **Leaf 3: Causal Role Functionalist.**

  **Branch 4: The Conventionality Test**
  *Case:* A synthetic organism where every codon is swapped for a synonym (e.g., UUU → UUC) and the tRNAs are matched. The animal is normal.
  *Question:* **Does this genome say the *same thing* as the wild type, or is it a different text that produces the same result?**
  *   **Different Text:** (The code is arbitrary/conventional). → **Leaf 4: Biological Conventionalist.**
  *   **Same Text:** (The code is fixed by chemistry/necessity). → Go to Branch 5.

  **Branch 5: The Semantics Test**
  *Case:* A single base deletion causes a frameshift. The organism dies.
  *Question:* **Did the mutated DNA make a *false statement* to the cell, or did it just *break the machine*?**
  *   **False Statement:** (DNA has truth conditions). → **Leaf 5: Instructionalist.**
  *   **Broke the Machine:** (DNA is a mechanical component). → Go to Branch 6.

  **Branch 6: The Substrate Test**
  *Case:* Methylation patterns or prion conformations are inherited and alter phenotype without DNA change.
  *Question:* **Is this "genetic information," or is "genetic" reserved strictly for nucleotide sequences?**
  *   **Genetic Information:** (Info is substrate-neutral). → **Leaf 6: Substrate Neutralist.**
  *   **Not Genetic:** (DNA is the unique repository). → **Leaf 7: DNA Exceptionalist.**

  **(Alternative Paths for Nuance)**
  *   *If you answered "Just Scaffolding" in Branch 3 but "Broke the Machine" in Branch 5:* → **Leaf 8: Mechanistic Deflationist.**
  *   *If you answered "Same Text" in Branch 4 but "False Statement" in Branch 5:* → **Leaf 9: Unnamed Hybrid (Chemical Semanticist).**
  *   *If you answered "No" to Branch 1 (Random DNA has info) but "Broke the Machine" in Branch 5:* → **Leaf 10: Physicalist.**

  ***

  ### The Leaves: Labels & Awkward Commitments

  1.  **Shannon Information Theorist**
      *   *Commitment:* A random, non-functional DNA sequence contains *more* information than a highly conserved gene because it has higher entropy.
  2.  **Teleosemanticist** (e.g., Millikan, Godfrey-Smith)
      *   *Commitment:* A broken gene that hasn't functioned for a million years still "means" the trait it was selected for in the past.
  3.  **Causal Role Functionalist** (e.g., Griffiths, Stotz)
      *   *Commitment:* A non-coding DNA spacer that just bends the strand carries the same *kind* of information as a protein-coding gene.
  4.  **Biological Conventionalist** (e.g., Kripkean readings)
      *   *Commitment:* If we swapped the tRNA pool, the DNA would literally *mean* something else, even if the organism looked identical.
  5.  **Instructionalist** (Old School)
      *   *Commitment:* DNA issues commands that the cell can disobey or misunderstand (i.e., mutations are "lies," not just errors).
  6.  **Substrate Neutralist** (e.g., Dawkins' Extended Phenotype edge-cases)
      *   *Commitment:* A prion protein folding pattern is effectively a "gene" if it is inherited and selected.
  7.  **DNA Exceptionalist** (Central Dogma Purist)
      *   *Commitment:* Epigenetic marks are merely regulatory switches, never "messages" or "codes" in their own right.
  8.  **Mechanistic Deflationist** (e.g., Sarkar, Weber)
      *   *Commitment:* "Information" is just a useful metaphor for causality; literally speaking, DNA is just a chemical template.
  9.  **Unnamed Hybrid (Chemical Semanticist)**
      *   *Commitment:* DNA has truth conditions (semantics) but the code is not arbitrary (chemistry fixes the meaning).
  10. **Physicalist**
      *   *Commitment:* Information is a physical property like mass, existing in random DNA, but biological "coding" is just mechanical causation.

  ***

  ### Critique: Where This Tree Breaks

  1.  **The Teleosemanticist/Causal Role Collapse:** In practice, Branch 2 (Source) is the only thing separating Leaf 2 from Leaf 3. However, most biologists answer "Lost Meaning" (Use) for pseudogenes but "Just Scaffolding" (Narrow) for structural DNA. This puts them in Leaf 8 (Deflationist) even if they theoretically hold Teleosemantic views. The tree forces a consistency that real people don't have.
  2.  **The "Random Shuffle" Redundancy:** As noted, I dropped the "Random Shuffle" case. If you put it back in after Branch 4, anyone who says the Recoded Genome is the "Same Text" will almost certainly say the Random Shuffle is "Not a Code" (because it lacks history), which contradicts their "Chemical/Physical" stance. It exposes an inconsistency in the Physicalist view, but doesn't create a new leaf.
  3.  **The "Truth" Trap:** Branch 5 assumes "False Statement" is a coherent option for biologists. MostSynBio grads will laugh and say "Broke the Machine." This branch mostly filters out philosophers from bench scientists, rather than sorting philosophical views.
  4.  **Verbal Dispute Confirmation:** Notice that Leaf 1 (Shannon) and Leaf 8 (Deflationist) often agree on the science but disagree on the word "Information." The tree sorts their *definitions*, not their *biology*.

  **Recommendation:** Print this single-sided. At the reading group, don't use it to find the "right" answer. Use it to show the SynBio students why the philosophers are asking weird questions, and show the philosophers why the SynBio students think the distinction is trivial.
