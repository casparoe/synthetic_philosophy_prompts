prompt: |-
  hey, i was arguing with my coworker over lunch — we're both software engineers, zero formal philosophy training — about whether democratic backsliding is actually a real measurable thing or just a fancy label people slap on elections they don't like in hungary, poland, turkey, or even the us. i feel like there's something there but also like people cry wolf constantly. could you draft the joint statement for an adverserial collaberation between two camps?

  camp a (the institutionalists): democratic backsliding is real and trackable. it means specific institutional veto points — judicial independence, electoral commission integrity, media pluralism rules — get systematically compressed or captured by the executive over time, and hungary and poland are textbook cases where standard democracy metrics show clear degradation compared to earlier baselines.

  camp b (the normative-contestation folks): the term is mostly a partisan framing device used by international observers and domestic losers to pathologize legitimate democratic reinterpretations of constitutional norms. what looks like "erosion" is often just a different democratic equilibrium — more majoritarian, less liberal — and calling it backsliding is itself an anti-democratic rhetorical move that hides normal political contestation.

  i want the output as: (1) a numbered section of claims both sides can actually sign, including about evidence standards and the specific countries mentioned; (2) a disagreements table where each camp's view is phrased so they'd accept the wording of their own side; (3) the cruxes — sub-questions that, if settled, would move at least one side; and (4) for each crux, the shared case or comparative argument both agree bears on it, with each side writing down their predicted result in advance.

  please inject what i'm calling the "baseline calibration problem" — whether we should measure erosion against a country's own historical democratic peak (say hungary circa 1990) or against an abstract cross-national liberal-democratic template. both sides need to address this in the agreed-claims and it should be one of the cruxes, since it decides whether poland's judicial reforms count as backsliding or democratic course-correction. don't ask for citations, bibliographies, or reading lists — i have no web access and neither does the model this is for. keep it casual, maybe with a typo or two. thanks!
