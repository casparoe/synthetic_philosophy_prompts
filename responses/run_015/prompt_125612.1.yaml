answer: |-
  Hey, I have been thinking about what you wrote regarding your argument with your friend because honestly you two have stumbled onto one of the deepest and most contentious fault lines in modern decision theory. It is completely understandable that you feel like you are missing something obvious because the tension you are describing is exactly where classical game theory crashes into philosophical logic. Your friend is articulating a position that sounds very much like what is sometimes called Logical Decision Theory or Timeless Decision Theory, which builds on Hofstadter's original intuition about superrationality but pushes it further than standard economics is willing to go. The core of his claim is that if two agents are perfectly rational and have the same information, they are not merely correlated like two weather stations predicting the same storm, but are instead executing the same abstract algorithm, meaning that when you decide, you are effectively deciding for both instances of that algorithm. You are right to feel uneasy about this because it does seem to smuggle metaphysics into game theory, but the counterargument is that it is not metaphysics so much as it is a claim about what variable you are actually controlling. In standard Nash equilibrium thinking, you control only your physical action, but in this superrational view, you control the output of the reasoning process itself, and if that process is instantiated elsewhere, your choice logically determines theirs without any spooky causal connection.

  This leads directly to your question about whether individual rational choice becomes an illusion if this shared grounding picture is right. The short answer is that it depends on what you mean by illusion, but it certainly changes the nature of agency from being a local physical event to being a logical instantiation. If your friend is correct that there is only one mental computation grounded twice, then yes, the feeling that you are making a unique choice independent of the other agent is technically mistaken, but that does not necessarily mean choice itself is an illusion. It just means that choice is a property of the algorithm rather than the biological body running it. You are still doing the work of computing the decision, and the outcome is still determined by the logic you employ, so your rationality is still the engine driving the result. The dilemma stops being about what you should do in isolation and becomes about what output you want the algorithm to produce given that the output will be mirrored. This shifts the burden from predicting another person to recognizing yourself in the logical structure of the problem, which is why Hofstadter called it superrationality rather than just cooperation. It is not that you are sacrificing your interest for theirs, but that you are recognizing that your interest and theirs are tied to the same logical variable.

  When you bring in the Luring Lottery and the use of randomness to break the symmetry, your intuition that this just pushes the grounding relation down onto the number generator is incredibly sharp and basically correct. If both agents agree to use a random number generator to decide whether to act, say with a probability of one in twenty, they are only truly independent if their sources of randomness are causally disconnected. If they are both superrational, they must agree on the method of randomization, and if they are running the same algorithm, they might even end up using the same pseudo-random seed based on the input data of the problem itself. In that case, the randomness is not actually breaking the correlation but is just another layer of the shared logical structure. The seed becomes the common ground, just as the reasoning process was the common ground before. So you are right that the lottery does not necessarily fix the metaphysical tension of shared identity, it just complicates the mechanism by which the shared decision is executed. It solves the practical problem of how to avoid everyone choosing the same action in a symmetric game, but it does not solve the philosophical problem of whether the agents are distinct decision-makers.

  Ultimately, I do not think you are missing anything obvious and you are not wrong to suspect that metaphysics is being imported into the model. The debate between you and your friend is essentially a debate about whether you treat other rational agents as part of your environment or as extensions of your own logic. Standard game theory says they are part of the environment and causally separate, while your friend's view says they are logical clones and therefore linked. Neither view is provably true in a physical sense because it depends on how you define the boundaries of a decision. If you accept your friend's premise that the algorithm is the true agent, then individual choice is not an illusion but it is non-local, meaning your decision happens wherever the algorithm runs. If you reject that premise and insist that physical separation matters, then the superrational solution looks like magic thinking. The lottery example proves that even when you try to introduce independence through randomness, a sufficiently rigorous commitment to shared rationality will find a way to correlate those random choices through shared seeds or shared logic. So in a way, you both win the argument because you are highlighting two different levels of analysis. You are right that it feels like metaphysical smuggling if you assume physical bodies are the primary decision makers, and he is right that if you assume logical algorithms are the primary decision makers, the correlation is inevitable. The dilemma does not prove choice is an illusion so much as it proves that choice is deeper and stranger than our everyday intuition about separate selves suggests, and the lottery just moves the mystery from the mind to the machine without actually resolving the underlying unity of the reasoning process.
