      *   *Palette:* Macro qualities (colors) vs. Micro qualities (unknown/different). How constituted?
      *   *Grain:* Macro experience is coarse/low-res. Micro base is fine/high-res (billions of elements). Constitution usually preserves detail. How does coarse come from fine?
      *   *Key Distinction:* Palette = Quality/Kind. Grain = Quantity/Resolution/Number of elements.

  3.  **Analyze the Exam Question:**
