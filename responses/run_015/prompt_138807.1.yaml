      *   **Task:** Grade a specific student answer to a specific exam question based on provided course notes and a rubric.
      *   **Inputs:** Course notes (Subject-summing, Palette, Grain problems), Exam Question (Part (a) definitions + distinction, Part (b) assess "Resolution Reply"), Student Answer.
      *   **Outputs:**
          1.  Mark out of 20 (split a/b).
          2.  Comments for the student (specific, distinguishing right/wrong).
          3.  Note on what is missing (stronger answer elements).
          4.  Note on errors vs. conclusions & relevance of the alternative strategy.
          5.  Note on question ambiguity/defensibility.
      *   **Rubric:** Credit for accuracy, distinction-keeping, evaluation. Deduct for conflation, unargued steps, overstatement. No style penalties.

  2.  **Analyze the Course Notes & Concepts:**
