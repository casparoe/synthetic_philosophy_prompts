answer: |-
  This is a sharp framing, but you are conflating a *political principle* (subsidiarity) with a *constitutional structure* (federalism), and you're applying a 19th-century American constitutional theory that was effectively litigated and settled (violently) 160 years ago.

  Here is the breakdown of where your framing holds, where it breaks, and the terminology you need for the column.

  ### 1. Subsidiarity vs. Federalism (Category Error)
  You wrote: *"Federalism is just reverse subsidiarity wearing a tie."*

  This is the first snag. They aren't opposites; they operate on different axes.
  *   **Subsidiarity** is a functional rule of procedure: *Who is best positioned to solve this problem?* (EU model).
  *   **Federalism** is a structural division of sovereignty: *Who has the legal right to rule?*

  You can have a unitary state with strong subsidiarity (e.g., the UK devolving power to Scotland, theoretically reversible). You can also have a federal system with weak subsidiarity (e.g., the US federal government regulating local zoning via funding conditions).

  In the EU, subsidiarity is a brake on competence. In the US, federalism is a division of competence. The EU model assumes the Center is the exception; the US model assumes the Center is a co-equal sovereign in its own sphere.

  ### 2. The US Counterexample (The "Obvious" One)
  You asked: *"Am I wrong that this applies to the US too, or is there something in the US Constitution that blocks this downward drift?"*

  You are describing **Compact Theory**. This is the idea that the Constitution is a contract between sovereign states, and if the Center breaches the contract, the States can reclaim their delegated powers (or leave).

  **The Legal Block:**
  The US Constitution blocks your "downward default" via three mechanisms:
  1.  **The Supremacy Clause (Art. VI):** Federal law is the "supreme Law of the Land." It is not "parked" authority; it is superior authority. State judges are bound by it, "anything in the Constitution or laws of any State to the contrary notwithstanding."
  2.  **The 14th Amendment:** Post-Civil War, this federalized the protection of rights, preventing states from opting out of fundamental liberties. It shifted the "default" upward regarding rights.
  3.  **Judicial Precedent (*Texas v. White*, 1869):** The Supreme Court explicitly ruled that the Union is "perpetual" and "indissoluble." The states do not retain "mini-sovereign" status in the way you describe. They cannot opt out.

  **The Empirical Block:**
  You mention a *"built-in disintegration clock."* Political science data suggests the opposite: **The Ratchet Effect.**
  Federations almost always centralize over time (war, economic crisis, civil rights). The US, Germany, and Australia have all seen power drift *upward*, not downward. The "disintegration clock" is rare (see: Yugoslavia, USSR, or potentially the EU if it fractures, but even the EU has supreme court jurisprudence establishing the primacy of EU law).

  ### 3. Naming the "Parking-Lot View"
  You asked for a name for the view that "the parts are the real owners and the federal layer is temporary delegation."

  *   **Compact Theory:** The specific US historical term (Jefferson, Madison, Calhoun). It argues the states created the federal government as their agent.
  *   **Confederalism:** If the center is truly subordinate and revocable, it's not a federation; it's a confederation. (The US under the Articles of Confederation; the EU is often called a "confederation of states" by skeptics, though legally it's more).
  *   **Derivative Sovereignty:** The idea that the Center's power is derived entirely from the Parts, rather than from "The People" directly.
  *   **Dual Federalism (Layer Cake):** The old doctrine that State and Federal powers are mutually exclusive spheres. Even this, however, didn't imply the Federal sphere was *temporary*, just *limited*.

  ### 4. The Nuance on Germany and Switzerland
  *   **Germany:** The *Bundesrat* gives Länder veto power on administrative matters, but the *Grundgesetz* (Basic Law) establishes federal supremacy. The Länder execute most federal laws, but they don't own the authority. It's "executive federalism," not sovereign ownership.
  *   **Switzerland:** Closest to your view. Cantons have residual powers (what isn't federal is cantonal), and referendums allow them to block laws. But they still cannot nullify federal law or secede. The Federal Constitution is supreme.

  ### 5. Recommendation for the Column
  Your framing is provocative, but if you file it as written, constitutional lawyers will tear it apart on the US point.

  **The Fix:**
  Pivot the argument. Instead of saying federalism *is* reverse subsidiarity, argue that **American political culture treats federalism *as if* it were reverse subsidiarity, even if the law says otherwise.**

  There is a cultural "disintegration clock" in the US psyche (the Tenth Amendment movement, nullification rhetoric, recent state-level abortion/marijuana defiance) that fights against the legal reality of the Supremacy Clause.

  **The Hook:**
  "The US Constitution settled the question of sovereignty in 1865, but the American argument about it never ended. We live in a legal empire but crave a confederal soul."

  **Summary Checklist:**
  *   **Don't say:** The US legal default is downward.
  *   **Do say:** The US *political* default often feels downward, despite the *legal* default being upward.
  *   **Term to use:** **Compact Theory** (for the historical view) or **States' Rights Doctrine**.
  *   **Counterexample:** **The Supremacy Clause** and **Texas v. White**.

  Your intuition about the *tension* is right, but your description of the *mechanism* is legally inverted for the US. Make that tension the story.
