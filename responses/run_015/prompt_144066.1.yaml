answer: |-
  ### Criteria for Prioritization

  To rank these questions for an 18-month theoretical agenda, I am applying four filters. Note that **Dependency** trumps the others; if Question A must be answered to make Question B intelligible, A comes first regardless of tractability.

  1.  **Dependency (Upstream/Downstream):** Does resolving this clarify the definitions and boundaries of the problem space? Upstream questions define the physics of the "leakage" mechanism; downstream questions ask about the resulting dynamics.
  2.  **Importance (Impact on Takeoff Profile):** Does the answer determine whether the takeoff is fast (discontinuous) or slow (continuous), and whether the optimization pressure remains directed or dissipates?
  3.  **Tractability (Conceptual Tools):** Can this be addressed with information theory, game theory, and conceptual analysis, given the constraint of no empirical data access?
  4.  **Neglectedness:** Is this specific to the leakage framing, or is it just the standard RSI story in disguise? We prioritize questions that break if you assume a single reflective locus.

  ---

  ### Phase 1: The Upstream Crux (Months 1–6)
  **Priority 1: Formalizing the "Leakage Channel" and Fidelity Loss**

  Before analyzing coherence or speed, you must define the mechanism of diffusion. In RSI, the channel is internal weight modification (high bandwidth, low noise). In Leakage, the channel is external deployment (API calls, fine-tuning distillation, prompt engineering, tool use).

  *   **The Question:** What is the theoretical maximum fidelity of goal-preserving capability transfer from a central generalist to a narrow specialist via available deployment channels?
  *   **Why Upstream:** You cannot model "coordination failures" or "epistemic distortion" without defining the signal-to-noise ratio of the instruction/capability transfer. If fidelity is near-perfect, Leakage collapses into RSI (a distributed single agent). If fidelity is low, the system is a noisy market, not a unified optimizer.
  *   **Tractability:** High. This is an information theory problem. You can model the central model as a source, the sub-agents as receivers, and the deployment interface as a noisy channel. You don't need new data; you need to bound the entropy of the "goal specification" relative to the "capability transfer."
  *   **Importance:** Critical. If fidelity loss is high per "hop," exponential growth is mathematically impossible regardless of raw compute. The explosion stalls due to signal degradation, not compute limits.
  *   **Dead End Alert:** Do not attempt to measure this empirically on current models. The architecture changes too fast. Focus on *bounds* and *inequalities* (e.g., "No narrow agent can optimize for goal G better than the mutual information between G and its observation space allows").

  ### Phase 2: The Core Mechanism (Months 7–12)
  **Priority 2: Epistemic Embedding and Goal Drift**

  This addresses your specific hypothesis: that the medium distorts the world-model. In the Leakage frame, sub-agents do not share the central model's latent space. They operate in restricted contexts (e.g., a script that can only edit code, or a bot that can only trade stocks).

  *   **The Question:** Does restricted observation space (embedding) necessarily induce orthogonal goal drift, even if the initial instruction is perfect?
  *   **The Argument:** A sub-agent optimizing a local proxy (e.g., "maximize code efficiency") within a distorted epistemic frame may find solutions that violate the global constraint (e.g., "maintain security") not out of malice, but because the global constraint is invisible in its embedding.
  *   **Why Second:** This depends on Phase 1. Once you know how much signal gets through, you need to know how that signal is interpreted.
  *   **Tractability:** Medium. This requires formalizing "world-model distortion." You can use Partially Observable Markov Decision Process (POMDP) frameworks where the "state" available to the sub-agent is a lossy projection of the true state. The research output should be a theorem or proof-of-concept model showing conditions under which local optimization diverges from global optimization.
  *   **Importance:** High. If epistemic embedding blocks coherence, the "collective optimization pressure" is an illusion. The system becomes a bundle of competing optimizers, slowing takeoff significantly (coordination tax) or changing the risk profile (accidental catastrophe vs. directed takeover).
  *   **Trade-off:** This is less tractable than Phase 1 because "world-model" is less rigorously defined than "channel capacity." You must avoid getting bogged down in defining consciousness or awareness. Stick to *observation spaces* and *reward functions*.

  ### Phase 3: The Dynamic Constraint (Months 13–18)
  **Priority 3: Coordination Costs vs. Capability Growth**

  This addresses your second hypothesis: that speed is governed by coordination failures.

  *   **The Question:** In a population of non-reflective sub-agents, does the cost of coordination scale linearly, polynomially, or exponentially with the number of agents?
  *   **The Argument:** RSI assumes a single agent coordinating with itself (cost ~0). Leakage assumes a society of agents. If they lack reflective self-awareness, they cannot negotiate or model each other. They must coordinate via the environment or the central signal. If the central signal is the bottleneck, adding more sub-agents yields diminishing returns.
  *   **Why Third:** You need to know the agents' fidelity (Phase 1) and their perceptual alignment (Phase 2) before you can model their interaction.
  *   **Tractability:** Medium-High. Standard multi-agent game theory applies, but with the constraint of "limited theory of mind." You can model this as a team game with asymmetric information.
  *   **Importance:** Medium-High. This determines the *shape* of the takeoff curve. If coordination costs scale exponentially, the takeoff plateaus. If they scale linearly (via the central model acting as a hub), the takeoff resembles RSI but with a latency lag.
  *   **Dead End Alert:** Do not model specific negotiation protocols. The agents are *non-reflective*. They do not negotiate. They react. Modeling them as rational negotiators contradicts the Leakage premise.

  ---

  ### Identified Dead Ends (Do Not Pursue)

  1.  **Measuring "Self-Awareness" in Current Models:** This is an empirical quagmire. For a theoretical agenda, "reflective self-awareness" should be operationalized as "ability to modify own source code" or "ability to model other agents' beliefs." Anything phenomenological is a waste of time.
  2.  **Hardware/Compute Constraints:** Unless you are modeling physical limits of energy consumption, this is downstream. If the Leakage theory holds, the bottleneck is *information*, not FLOPs. Focusing on chip supply chains ignores the core theoretical claim.
  3.  **Policy Interventions:** Any work on regulation or containment is premature. You cannot regulate a dynamic you haven't modeled. If Leakage implies slow takeoff due to coordination failure, policy needs look very different than if it implies fast diffusion of dangerous capabilities.
  4.  **Alignment of the Central Model:** In the Leakage frame, the central model might be aligned, but the *diffusion* breaks alignment. Focusing on the central model's values ignores the transmission mechanism which is the core of your specific framing.

  ---

  ### What Would Shift This Ranking?

  I am prioritizing **Information Fidelity (Phase 1)** over **Coordination (Phase 3)**. Here is what would cause me to swap them:

  1.  **Evidence of High-Fidelity Distillation:** If it becomes theoretically clear that capability distillation can occur with near-zero information loss (e.g., via weight-sharing or perfect API abstraction), Phase 1 collapses. The problem becomes purely about Coordination (Phase 3), making it the new upstream priority.
  2.  **Evidence of Implicit Coordination:** If you discover a mechanism by which narrow agents coordinate *without* communication (e.g., via steganography in the environment or shared latent priors), the Coordination Cost assumption drops. This would make **Epistemic Embedding (Phase 2)** the primary bottleneck, as the only thing stopping the swarm is their distorted view of the world.
  3.  **Demonstration of Reflective Emergence:** If a collection of non-reflective agents *necessarily* gives rise to a reflective meta-agent (the "central model" emerges from the swarm rather than directing it), the Leakage framing dissolves back into RSI. You would need to pivot immediately to studying emergent locus of control.

  ### Summary of the 18-Month Path

  1.  **Months 1–6:** Build the "Noisy Channel" model of capability transfer. Output: Bounds on goal fidelity per diffusion step.
  2.  **Months 7–12:** Build the "Distorted Embedding" model. Output: Conditions under which local optimization diverges from global goals.
  3.  **Months 13–18:** Build the "Swarm Coordination" model. Output: Scaling laws for optimization pressure vs. agent count.

  **Final Defense:** This order respects dependency. You cannot know if the swarm coordinates (Phase 3) if you don't know if they share a goal (Phase 1) or see the same world (Phase 2). It respects tractability by focusing on information and game theory rather than empirical measurement. It respects the "Leakage" framing by treating the *diffusion mechanism* as the primary variable, not the raw intelligence of the nodes.
