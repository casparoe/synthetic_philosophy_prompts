      *   **Deliverable:** Defended prioritization of open questions/cruxes.
      *   **Requirements:** State criteria (Importance, Tractability, Neglectedness, Dependency), flag trade-offs, identify what would shift the ranking, distinguish upstream vs. downstream questions, identify dead ends.

  2.  **Analyze the "Leakage" Framing:**
      *   *Standard RSI:* Focuses on a single locus of optimization, cognitive content, algorithmic improvement.
      *   *Leakage:* Focuses on ecosystem dynamics, distribution of capabilities, principal-agent problems, communication bottlenecks, emergent collective intelligence without central reflection.
      *   *Analogy:* It's less like a god upgrading itself and more like a virus spreading through a population, or a market economy optimizing without a central planner.
      *   *Core Tension:* Can a collection of "dumb" (non-reflective) agents act as a coherent "smart" optimizer? Or does the noise/loss in transmission (leakage) degrade the signal enough to prevent fast takeoff?

  3.  **Determine Criteria for Prioritization:**
      *   *Importance:* Does resolving this change the probability of fast takeoff or the nature of the risk?
      *   *Tractability:* Can a small group make progress in 18 months without empirical data (mostly math, logic, simulation, conceptual analysis)?
