answer: |-
  This is a genuinely sophisticated pivot. You're moving the debate from a forensic accounting of past crimes to a structural analysis of present distortions. That shift changes the entire moral and mathematical landscape of the argument.

  Here is the reasoning for why Counterfactual Institutional Divergence (CID) should be the standard, why it withstands the speculation critique, and why it remains distinct from universal redistribution.

  ### 1. Why Institutional Divergence Beats Harm-Based Accounting

  Traditional harm-based accounting treats historical injustice like a tort case: someone broke something, so they pay the repair cost plus interest. The problem is that historical injustice wasn't just a series of broken things; it was a rewriting of the rules of the game.

  If you steal a farmer's cow, harm-based accounting says you owe the price of the cow. But if you pass a law that prevents the farmer from ever owning land, voting on zoning, or accessing credit, you haven't just stolen a cow; you have stolen the farmer's *economic trajectory*.

  CID is superior because it measures the **opportunity cost of development**, not just the value of extracted assets.

  *   **Compound vs. Linear:** Harm-based accounting tries to calculate compound interest on specific acts (e.g., unpaid wages from 1860). This gets mathematically absurd and morally abstract very quickly. CID looks at the *outcome gap* today. It asks: "Given the starting conditions and the institutional constraints applied, where should this community be on the development curve?" It captures the compounding effect of being locked out of wealth-building mechanisms (like housing equity) without needing to tally every individual transaction.
  *   **Structural vs. Transactional:** Harm-based models focus on specific bad actors and specific victims. CID focuses on systems. It acknowledges that the injustice wasn't just what people *did*, but what the institutions were *designed to do*. By focusing on the divergence in institutional outcomes (wealth, health, education), you bypass the impossible task of tracing lineage for every dollar and focus on the measurable gap created by the policy itself.
  *   **Forward-Looking Justice:** Harm-based accounting is inherently backward-looking (settling a debt). CID is forward-looking (correcting a trajectory). The goal isn't to make the past disappear; it's to restore the community's capacity to generate wealth and stability at the rate they would have absent the interference. This makes the "payment" an investment in closing the gap, rather than a penalty for the past.

  ### 2. Dealing with the "Speculative Sociology" Objection

  The most common pushback will be: "You can't know what would have happened. It's counterfactual. It's guesswork."

  This objection fails because we use counterfactual reasoning constantly in law, economics, and policy. It is not speculative if it is grounded in comparative data.

  *   **The Comparator Method:** We don't need a time machine. We need a control group. If two populations start with similar human capital and labor potential in 1800, but one is subjected to extractive institutions (slavery, segregation, redlining) and the other is subjected to generative institutions (homestead acts, GI bills), the divergence in their outcomes *is* the data. You aren't guessing the number; you are measuring the distance between the two curves.
  *   **Actuarial Precedent:** Courts award "lost earning potential" in wrongful death or injury cases all the time. They use statistical averages to project what a person *would have* earned. CID scales this logic up. It uses macroeconomic modeling to project what a community's wealth accumulation *would have* looked like given national growth rates, absent the specific institutional drag.
  *   **Burden of Proof:** Under CID, the burden shifts. In harm-based models, the victim must prove the exact loss. In CID, once the institutional rewiring is proven (e.g., laws barring property ownership), the resulting divergence is presumed to be the result of that rewiring unless the state can prove otherwise. This acknowledges that the state created the uncertainty, so the state shouldn't benefit from the inability to calculate precise damages.
  *   **Conservative Estimation:** To counter the "speculation" claim, the framework can demand conservative baselines. You don't assume the affected community would have become the wealthiest group; you assume they would have tracked with the national average or a similar demographic不受 affected by the specific constraint. This makes the sociology robust, not speculative.

  ### 3. Why It Doesn't Collapse into Universal Basic Income

  Critics will argue: "Everyone suffers from bad institutions eventually. If you're fixing structural gaps, why not just give everyone money (UBI)?"

  CID avoids this collapse because it requires **specific causal linkage between the injustice and the institutional distortion.**

  *   **Specificity of Rewiring:** UBI is universal because it addresses a general condition (poverty or automation). CID is particular because it addresses a specific distortion. Not everyone was subjected to chattel slavery. Not everyone was barred from specific neighborhoods by racially restrictive covenants. Not everyone had their land seized by eminent domain for highways. CID targets the groups where the institutional wiring was intentionally altered to suppress their development relative to others.
  *   **The Gap, Not the Floor:** UBI sets a floor for everyone. CID aims to close a specific gap between Group A and Group B. If a white working-class family is poor due to deindustrialization, that is a tragedy, but it is not necessarily the result of the *same* institutional rewiring as redlining. CID distinguishes between general economic hardship and targeted institutional suppression. You can support UBI *and* CID, but they solve different problems. UBI solves subsistence; CID solves equity of trajectory.
  *   **Non-Transferable Disadvantage:** The core of CID is that the disadvantage is sticky and intergenerational due to the specific institutions involved (e.g., inheritance laws, school funding tied to property taxes). General poverty might be solved by a job boom. Institutional divergence persists *through* job booms because the rules of asset accumulation remain skewed. Therefore, a universal check doesn't fix the divergence; it just raises the water level while the boat remains tethered. CID demands untying the tether.

  ### The Bottom Line

  Your framing works because it stops treating reparations as a guilt payment for ancestors and starts treating it as a structural correction for the present.

  By arguing for Counterfactual Institutional Divergence, you are saying: "We are not paying for what was taken; we are paying for what was prevented."

  This forces your friend to argue against the reality of the institutional gap, rather than getting bogged down in the morality of paying for sins they didn't commit. It makes the argument about math and systems, not feelings and history. That is why it's the stronger standard.
