      *   **Argument 1: Why CID beats Harm-Based Accounting.**
          *   Harm-based is transactional (I broke your window, I pay for the window).
          *   Historical injustice isn't a broken window; it's changing the zoning laws so you can't build a house.
          *   Harm-based focuses on the *past act*. CID focuses on the *present structure*.
