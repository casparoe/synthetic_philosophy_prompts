answer: |-
  Your observation is exceptionally sharp. You have identified a failure mode of shared resources that is distinct from the standard "Tragedy of the Commons," yet it is frequently conflated with it in casual discourse. You are describing a shift from a problem of *overconsumption* to a problem of *underutilisation* driven by defensive exclusion.

  There is indeed an established economic and legal concept that captures the structural outcome you describe, and a political science concept that captures the psychological mechanism. Together, they provide the precise vocabulary you are looking for.

  ### 1. The Structural Concept: The Tragedy of the Anticommons

  The economic term for the situation you describe is **The Tragedy of the Anticommons**.

  Proposed by legal scholar Michael Heller in 1998, this concept is the precise mirror image of Garrett Hardin's "Tragedy of the Commons."
  *   **The Commons:** Too many people have the *privilege of use*. No one can exclude anyone else. Result: Overuse and depletion (e.g., overgrazing).
  *   **The Anticommons:** Too many people (or factions) have the *right to exclude*. Each fragment of the resource is locked behind a permission gate. Result: Underuse and fragmentation (e.g., a building sits empty because too many owners must agree to lease it).

  In your garden example, the students are not eating all the crops (depletion); they are claiming plots to prevent others from using them (fragmentation). In the digital archive, the data exists, but the restrictive licence prevents it from being built upon (underutilisation).

  **Why this fits your observation:**
  The Anticommons specifically addresses the "fragmentation" you noted. It explains how a resource can remain physically intact but become functionally useless because access has been partitioned into private claims.

  ### 2. The Motivational Concept: The Security Dilemma

  However, the "Anticommons" describes the *state* of the resource, not necessarily the *mindset* of the actors. You noted that the students genuinely believe they are acting in self-defence ("protecting their fair share from people who would take more").

  The concept that captures this specific motivation is the **Security Dilemma** (originally from International Relations theory, notably associated with John Herz and Robert Jervis).

  *   **The Mechanism:** Actor A fears Actor B will exploit the resource. To protect themselves, Actor A restricts access. Actor B sees this restriction as aggression or a signal that the resource is now scarce, so they restrict access elsewhere.
  *   **The Outcome:** Both parties end up less secure (less access to the garden/archive) than if they had trusted one another, despite neither party initially desiring conflict.

  When you combine these, you get what some institutional economists call **Defensive Propertization**. This is the act of establishing private rights not primarily to exploit the asset for profit, but to shield it from perceived external threats.

  ### 3. Distinctions from Related Concepts

  You asked how this is distinguished from the standard concepts. Here are the boundary lines:

  | Concept | Core Mechanism | Resource Outcome | Actor Motivation |
  | :--- | :--- | :--- | :--- |
  | **Tragedy of the Commons** | Right to *use* without exclusion. | **Depletion** (Resource is destroyed/used up). | "I must take my share before it is gone." |
  | **Tragedy of the Anticommons** | Right to *exclude* others. | **Fragmentation** (Resource is locked/underused). | "I must lock this so others cannot take it." |
  | **Historical Enclosure** | Legal/Forceful privatization (often top-down). | **Transfer of Ownership** (Common becomes Private). | Often profit-driven or state-mandated efficiency. |
  | **Free-Rider Problem** | Benefiting without contributing. | **Under-provision** (No one creates the resource). | "I will let others pay/work, then I will use it." |
  | **Your Observation** | **Preemptive Defensive Exclusion.** | **Paralysis** (Resource exists but is partitioned). | "I am protecting the resource from *your* potential free-riding." |

  **Key Distinction from Enclosure:**
  Historical enclosure was often a clear power grab by the wealthy against the poor. In your scenario, the "enclosers" may be peers with equal status. They are not necessarily seizing power for dominance, but seizing it for *safety*. This makes the conflict harder to resolve, because appealing to "fairness" fails; both sides claim they are being fair by protecting the resource from the *other* side's potential unfairness.

  **Key Distinction from Free-Riding:**
  The free-rider is the *ghost* haunting this scenario. The students in the garden are acting as if free-riders are inevitable. They are solving the free-rider problem by creating an anticommons. In doing so, they solve the risk of exploitation but create the risk of waste.

  ### 4. Defining the Boundary Conditions

  You asked if a precise definition can be formed regarding the "fear" and the "scarcity." Based on the synthesis of the Anticommons and the Security Dilemma, we can define the boundary conditions of this phenomenon (let's call it **Defensive Fragmentation**) as follows:

  **Condition 1: The Subjectivity of Threat**
  The restrictor does *not* need to be objectively correct about the threat. The phenomenon applies even if the fear of overuse is unfounded.
  *   *Boundary:* If the restrictor knows others *will not* overuse but claims they will to justify a power grab, that is simple **Predatory Enclosure**.
  *   *Boundary:* If the restrictor genuinely believes others *will* overuse (even if mistaken), that is **Defensive Fragmentation**. The sincerity of the belief is what makes it a "dilemma" rather than a "crime."

  **Condition 2: The Self-Fulfilling Scarcity**
  The restriction must create the scarcity it claims to solve.
  *   *Boundary:* If the resource is genuinely scarce (e.g., there are only 5 plots for 50 students), restricting access is rational allocation.
  *   *Boundary:* If the resource is abundant enough for all, but the *act of claiming* makes it artificially scarce for others, the phenomenon is present. The "lock" creates the shortage, not the physical limits of the garden or archive.

  **Condition 3: The Justification of Preservation**
  The justification must be framed as stewardship or protection of the collective good (or one's fair slice of it), rather than pure extraction.
  *   *Boundary:* "I am taking this plot to sell the vegetables" is **Privatization**.
  *   *Boundary:* "I am taking this plot so that Group X doesn't ruin the soil" is **Defensive Fragmentation**.

  ### 5. Why This Matters (The Ostrom Critique)

  It is worth noting that the Nobel Prize-winning economist **Elinor Ostrom** spent her career studying exactly the scenario you are in. She argued that Hardin's "Tragedy of the Commons" was not inevitable. Communities *can* manage shared resources without privatizing them (avoiding the Anticommons) or depleting them (avoiding the Commons), provided they have:
  1.  Clear boundaries (who is in the group?).
  2.  Graduated sanctions (how do we punish rule-breakers?).
  3.  Conflict resolution mechanisms.

  Your school's situation suggests a breakdown in these governance structures. Because there is no trusted neutral authority to punish a "free-rider," students feel forced to become their own enforcers. They privatize the resource because they lack the social technology to govern it collectively.

  ### Summary

  The phenomenon you have observed is best described as **The Tragedy of the Anticommons driven by a Security Dilemma.**

  *   **What it is:** A collapse of shared utility caused by preemptive, defensive exclusion rights, where actors lock down resources to protect against perceived future exploitation.
  *   **What it is not:** It is not the standard Tragedy of the Commons (which is overuse), nor is it simple greed (as the motivation is defensive).
  *   **The Edge:** The concept holds even if the fear of overuse is irrational, provided that the defensive action itself creates the artificial scarcity.

  You have effectively identified that your peers are solving a *social* problem (trust) with a *property* solution (exclusion), and in doing so, they are breaking the utility of the resource. That is a sophisticated insight for a final-year student; it places you in direct conversation with institutional economics and political theory.
