prompt: |-
  So I teach epistemology and the philosophy of probability, and I keep getting the same question from my students, a lot of them med students on the clinical rotation: a test comes back and the report says the finding makes disease A twice as likley as disease B, and they have no idea what to do with that number. They just throw Bayes at it and get it wrong, because most of the time A and B don't exhaust the differntial, and honestly I'm not sure the right update rule is what they think it is when the evidence is a ratio rather than a plain observation.

  I'd like you to write me a decision procedure a clinician can actually run at the bedside in a few minutes when they get evidence phrased as a relative likelihood or a likelihood ratio -- "the scan makes A twice as likely as B," "this marker makes condition C k times more likely," and so on. Ground it in whatever the philosophy of probability actually says about updating on this kind of evidence (the whole Judy Benjamin / conditioning-versus-cross-entropy line of work, whatever of it is genuinely usable by someone who isn't a philosopher), and be honest about which steps are real math and which are judgment calls dressed up as steps.

  The procedure should:
  - lay out the questions to ask in order, and what counts as a sufficient answer to each
  - tell the clinician how to tell when the options being compared actually partition the space (so a plain ratio does the work) versus when they don't (the harder case), and what to do in each
  - say how to bring in the prior, and what to do when the clinician can't get a number for it
  - mark clearly where the procedure has to stop and hand the call to the person, because the question is about values or about what the patient actually cares about rather than about the numbers
  - be runnable in under ten minutes, with a small set of test findings they can apply
  - produce something the clinician can defend to an attending on rounds and explain to a patient in plain language

  Then run it on three findings: (1) a positive test where the disease and its absence are the only two options on the table; (2) a scan that makes one tumor type twice as likely as another, but there are at least three other plausible diagnoses in the differential; and (3) a case where the procedure will land on an answer the clinician will not like -- pick one where the math says to keep a scary diagnosis on the table even though it feels intuitively wrong, and say what the procedure can and can't do there.

  Think very carefully before answering, and respond in the style of an expert who has actually worked through this rather than someone summarizing a textbook. Don't give me a reading list or citations -- I know the literature, I want the procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Target Audience:** Clinicians (specifically med students on rotation) who are struggling with probabilistic evidence phrased as relative likelihoods/ratios (e.g., "A is twice as likely as B").
      *   **User:** Epistemology/Philosophy of Probability instructor. They know the literature (Judy Benjamin, cross-entropy, etc.) but want a *usable procedure*, not a reading list.
      *   **Core Problem:** Students misapply Bayes' theorem when the hypothesis space isn't exhausted (A and B aren't the only options) or when evidence is given as a ratio rather than a likelihood $P(E|H)$.
      *   **Requirements:**
          *   Decision procedure runnable in < 10 mins at bedside.
          *   Grounded in philosophy of probability (updating on ratios/constraints) but practical.
          *   Distinguish between partitioning vs. non-partitioning hypothesis spaces.
          *   Handle priors (including non-numeric ones).
          *   Identify where math stops and values/judgment begin.
          *   Defensible to attendings and explainable to patients.
          *   Run the procedure on three specific test cases (Binary, Non-exhaustive Differential, Counter-intuitive result).
      *   **Tone:** Expert practitioner, not textbook summarizer. Honest about "judgment calls dressed up as steps."

  2.  **Deconstruct the Epistemological Problem:**
      *   *The Student Error:* They hear "A is twice as likely as B" and think $P(A|E) = 2 \times P(B|E)$. If they assume $P(A) + P(B) = 1$, they get $P(A|E) = 2/3, P(B|E) = 1/3$.
      *   *The Reality:* Usually $P(A) + P(B) < 1$ (there's Disease C, D, E...).
      *   *The Philosophical Hook:* This is the **Judy Benjamin Problem** (updating on a conditional constraint) or **Minimum Information/Maximum Entropy** updating. When told $P(A|E) / P(B|E) = k$, we are constraining the *posterior* ratio, not given a likelihood function $P(E|H)$ directly.
      *   *However,* in clinical practice, "The scan makes A twice as likely as B" is usually shorthand for a Likelihood Ratio (LR) comparison. $LR(A, B) = \frac{P(E|A)}{P(E|B)} = 2$.
      *   *Crucial Distinction:* Is the report saying "The *posterior* odds are 2:1" or "The *likelihood ratio* favors A over B by 2:1"?
          *   Most clinical tests report LRs (sensitivity/specificity derived).
          *   Students often confuse Posterior Odds with Likelihood Ratios.
          *   *Correction:* If the report says "makes... twice as likely," it usually implies an update factor (Likelihood Ratio). If it implies the *result* is a 2:1 probability, that's a posterior claim.
          *   *Decision:* I need to clarify this ambiguity in the procedure. The most robust interpretation for clinicians is treating the "twice as likely" statement as a **Likelihood Ratio (LR)** between the hypotheses, not a final probability assignment. This allows Bayes' rule to work on the odds.
          *   *Philosophical nuance:* If the evidence is *only* the ratio constraint (Judy Benjamin style), we should minimize information gain elsewhere (preserve relative odds of other hypotheses). This is the "Principle of Minimum Information."

  3.  **Drafting the Procedure (The "Bedside Bayes" Protocol):**
      *   *Step 1: Define the Space.* Are we talking Binary (Disease/No Disease) or Differential (A vs B vs C...)?
      *   *Step 2: Interpret the Number.* Is it a Likelihood Ratio (LR) or a Posterior Odds claim? (Crucial step). Let's assume LR for the math to hold, but acknowledge the ambiguity.
      *   *Step 3: The Priors.* Need baseline prevalence or clinical gestalt.
      *   *Step 4: The Update.*
          *   If Binary: Standard Odds form of Bayes.
          *   If Differential (Non-exhaustive): Use the " odds form" but acknowledge the "Rest of the World" (ROW) hypothesis.
          *   *Philosophical Constraint:* If evidence only speaks to A vs B, do not update C, D, E relative to each other. Update their absolute probability only because the total probability mass must sum to 1. This is the "Minimum Information" approach.
      *   *Step 5: The Stop Rule.* When does risk/utility take over? (Treatment thresholds).

  4.  **Refining the "Judgment Calls":**
      *   Priors are often subjective.
      *   "Twice as likely" is often imprecise language for $LR \approx 2$.
      *   The "Rest of the World" hypothesis is a catch-all that is hard to quantify.
      *   Thresholds for action are value-laden (patient preference, cost, harm).

  5.  **Developing the Three Test Cases:**
      *   *Case 1 (Binary):* HIV test or D-Dimer. Disease vs No Disease. Straightforward Bayes.
      *   *Case 2 (Non-exhaustive):* Lung nodule. Adeno vs Squamous vs Benign vs Metastasis. Scan favors Adeno over Squamous (2:1 LR). How to handle Benign/Mets?
      *   *Case 3 (Counter-intuitive):* Rare disease with high mortality. Test is good but prevalence is tiny. Posterior is still low, but *action* is required because missing it is fatal. Or: A "rule out" test that leaves a scary probability still above the treatment threshold. Let's go with the "High Stakes/Low Prob" scenario where math says "unlikely" but clinical duty says "work up."

  6.  **Writing the Content - Tone and Style:**
      *   Avoid academic jargon where possible, but keep the epistemological integrity.
      *   Acknowledge the messiness.
      *   Use bolding for actionable steps.
      *   Ensure the "Judy Benjamin" aspect (updating on constraints) is translated into "Don't mess with the other odds unless you have to."

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the Judy Benjamin connection too abstract?
      *   *Fix:* Frame it as "The Principle of Conservation of Suspicion." If the test only distinguishes A from B, don't change your mind about C unless the math forces you to renormalize.
      *   *Critique:* Students confuse "Likelihood" (philosophical/statistical term) with "Probability."
      *   *Fix:* Explicitly define "Likelihood Ratio" in the procedure as "How much the test moves the needle," distinct from "How likely it is."
      *   *Critique:* The prompt asks for "evidence phrased as a relative likelihood."
      *   *Fix:* I need to be careful. If the report says "Finding makes A twice as likely as B," does it mean $P(A|E) = 2 P(B|E)$ (Posterior constraint) or $P(E|A) = 2 P(E|B)$ (Likelihood Ratio)? In medicine, this phrasing is almost always a sloppy way of stating a Likelihood Ratio. I will treat it as an LR for the procedure but add a warning step. If it *is* a posterior constraint, the math changes (Jeffrey Conditioning/MinInfo). I will stick to the LR interpretation as it's more clinically standard, but acknowledge the philosophical distinction in the "Judgment Call" sections. *Wait, actually*, the prompt specifically mentions the Judy Benjamin line. I should incorporate the Minimum Information principle for the non-exhaustive case. If the evidence *only* constrains the ratio of A to B, the relative probabilities of C, D, E should remain unchanged.

  8.  **Finalizing the Procedure Structure:**
      *   **Name:** The Constrained Update Protocol (CUP).
      *   **Phase 1: Scope.** (Binary vs. Differential).
      *   **Phase 2: Translation.** (Ratio to LR).
      *   **Phase 3: Prior Estimation.** (Gestalt to Number).
      *   **Phase 4: The Update.** (Math).
      *   **Phase 5: The Threshold.** (Values).

  9.  **Running the Cases:**
      *   *Case 1:* D-Dimer for PE. Binary (PE vs No PE).
      *   *Case 2:* Lung Mass. Adeno vs Squamous vs Others. Ratio 2:1.
      *   *Case 3:* Subarachnoid Hemorrhage (SAH) with negative CT but high pre-test. Or perhaps a rare cancer where the posterior is low but the cost of missing is death. Let's use the "Rare but Fatal" scenario (e.g., Aortic Dissection).

  10. **Final Polish:** Check against constraints (10 mins, defensible, plain language). Ensure the "honesty about judgment calls" is prominent. (Self-correction: Make sure to explicitly mention that "twice as likely" is often ambiguous and requires clarification).

  *(Self-Correction on the Philosophy)*: The prompt specifically asks to ground it in the philosophy of probability regarding updating on ratios (Judy Benjamin/Cross-Entropy).
  *   *Standard Bayes:* Updates on $P(E|H)$.
  *   *Judy Benjamin:* Updates on $P(H_1|E) / P(H_2|E) = k$.
  *   *Clinical Reality:* When a radiologist says "This makes A twice as likely as B," they usually mean the *features* are twice as characteristic of A as B. This is a Likelihood Ratio $P(Feature|A) / P(Feature|B) = 2$.
  *   *However*, if the student interprets it as a posterior constraint, they run into the exhaustion problem.
  *   *Decision:* I will teach the procedure assuming the report provides a **Likelihood Ratio (LR)**. Why? Because that is the only way to integrate priors correctly. If the report claims a *Posterior* ratio, the prior is already baked in (and likely based on a generic population, not *this* patient). I will make this distinction Step 1.
  *   *For the Non-Exhaustive case:* I will apply the **Principle of Minimum Information**. If the evidence distinguishes A from B, but says nothing about C, the odds of A:C and B:C must shift, but the odds of C relative to other "untouched" hypotheses (D, E) should remain constant. This is the cross-entropy solution.

  Let's write it.
answer: |-
  # The Constrained Update Protocol (CUP)
  ### A Bedside Decision Procedure for Relative Evidence

  **Time to run:** 5–8 minutes.
  **Goal:** Convert vague relative findings ("A is twice as likely as B") into defensible posterior probabilities without assuming a false binary.
  **Epistemic Grounding:** This procedure treats clinical evidence as a **Likelihood Ratio (LR)** constraint. When the hypothesis space is not exhausted (A and B are not the only options), it applies the **Principle of Minimum Information** (the clinical cousin of cross-entropy minimization): *Update only what the evidence speaks to; preserve the relative structure of everything else.*

  ---

  ## Part I: The Procedure

  ### Step 1: Scope the Hypothesis Space (The Partition Check)
  **Question:** "Does 'Disease A' and 'Disease B' cover every possible explanation for this patient's presentation?"
  *   **Yes:** You have a **Binary Partition**. (e.g., Pregnant vs. Not Pregnant, PE vs. No PE).
  *   **No:** You have a **Differential Field**. (e.g., Adenocarcinoma vs. Squamous Cell, but also Benign Nodule, Metastasis, Infection).

  **The Judgment Call:** This is where students fail. They treat a Differential Field as a Binary Partition.
  *   **Sufficient Answer:** If there is *any* plausible "Other" (Disease C, D, or "Nothing"), mark this as **Non-Exhaustive**.
  *   **Action:** If Non-Exhaustive, you must create a "Rest of World" (ROW) hypothesis. Group C, D, E... into a single bucket called $H_{other}$.

  ### Step 2: Translate the Finding (The Ratio Check)
  **Question:** "Does the report mean the *test result* is twice as common in A as B, or that the *patient's probability* of A is now twice B?"
  *   **Interpretation:** In 95% of clinical contexts, "makes A twice as likely as B" is sloppy shorthand for a **Likelihood Ratio (LR) of 2**. It means the evidence is twice as compatible with A as B.
  *   **Why this matters:** If you treat it as a posterior probability (A is now 66%, B is 33%), you ignore the prior prevalence. If you treat it as an LR, you multiply it by the prior odds.
  *   **Action:** Treat the number $k$ (e.g., 2) as $LR_{A,B}$.
      *   $LR_{A,B} = \frac{P(Evidence|A)}{P(Evidence|B)} = k$
      *   *Note:* If the report explicitly claims a *posterior* probability (rare), skip to Step 4, but warn the attending that the prior may not match your patient.

  ### Step 3: Anchor the Priors (The Baseline)
  **Question:** "Before this test, what was the relative frequency of A, B, and $H_{other}$ in a patient *exactly like this one*?"
  *   **The Math:** You need Prior Odds.
      *   If Binary: $Odds_{prior} = \frac{P(A)}{1 - P(A)}$
      *   If Differential: Assign rough percentages that sum to 100%. (e.g., A=30%, B=15%, Other=55%).
  *   **The Judgment Call:** You will not have exact numbers. Use "Gestalt Bins":
      *   *Rare:* <5%
      *   *Uncommon:* 5–20%
      *   *Contender:* 20–50%
      *   *Front-runner:* >50%
  *   **Action:** Write down three numbers. $P(A)_{prior}$, $P(B)_{prior}$, $P(Other)_{prior}$. They must sum to 1.0. If you can't number them, you cannot do the math. Pick the bins.

  ### Step 4: The Update (The Calculation)
  **Rule:** Apply the Likelihood Ratio to the Odds, not the Probabilities.

  **Case A: Binary Partition**
  $$Odds_{post} = Odds_{prior} \times LR$$
  $$P(A)_{post} = \frac{Odds_{post}}{1 + Odds_{post}}$$

  **Case B: Differential Field (The Minimum Information Rule)**
  *Philosophical Note:* The evidence distinguishes A from B. It says nothing about A vs. Other or B vs. Other directly. However, because probabilities must sum to 1, shifting A and B forces Other to move. The **Principle of Minimum Information** dictates we preserve the *relative* odds of hypotheses the evidence didn't touch.
  1.  Calculate Posterior Odds for A vs B:
      $$Odds(A:B)_{post} = Odds(A:B)_{prior} \times LR_{A,B}$$
  2.  Calculate Posterior Probabilities for A and B using the new ratio, but **scale them** against the "Other" bucket.
      *   *Simplified Bedside Math:*
          *   $Score_A = P(A)_{prior} \times LR_A$ (If LR is given relative to B, set $LR_B = 1, LR_A = k$)
          *   $Score_B = P(B)_{prior} \times 1$
          *   $Score_{Other} = P(Other)_{prior} \times 1$ (Assume evidence is neutral for Other)
          *   $Total = Score_A + Score_B + Score_{Other}$
          *   $P(A)_{post} = Score_A / Total$
  *   **Why this works:** This is the clinical application of minimizing cross-entropy. You are shifting probability mass toward A and away from B, but you are not arbitrarily punishing "Other" unless the evidence specifically rules it out.

  ### Step 5: The Threshold Stop (The Value Check)
  **Question:** "Does this new number cross a line where we *act*?"
  *   **The Math Stop:** The math ends at $P(A)_{post}$.
  *   **The Value Start:** Action depends on **Treatment Thresholds**.
      *   *Test-Treat Threshold:* Probability high enough to treat without more testing.
      *   *Test-No-Test Threshold:* Probability low enough to stop looking.
  *   **Action:** Compare $P(A)_{post}$ to the threshold.
      *   If $P(A)_{post}$ is below the treatment threshold but the disease is lethal, the math says "wait," but values say "work up." **This is where you stop the calculation.**

  ### Step 6: The Explanation (Defense & Disclosure)
  *   **To Attending:** "I treated the finding as a Likelihood Ratio of 2. I anchored the prior at [X]% based on prevalence. Because the differential wasn't exhaustive, I preserved the relative odds of the other diagnoses (Minimum Information update). The posterior is [Y]%, which is above/below our treatment threshold."
  *   **To Patient:** "This test shows a pattern that we see in Condition A about twice as often as Condition B. However, there are other possibilities. Combining this with your history, the chance of A is now [Y] in 100. Here is why that number means we should [wait/treat/test more]."

  ---

  ## Part II: Running the Procedure on Three Cases

  ### Case 1: The Binary Partition (D-Dimer for Pulmonary Embolism)
  **Scenario:** 40-year-old female, pleuritic chest pain. Low Wells Score (Pre-test prob ~5%). D-Dimer comes back. Report says: "Elevated D-Dimer is 5 times more likely in PE than in No-PE." (LR = 5).
  **Space:** PE vs. No-PE. (Exhaustive).

  1.  **Scope:** Binary. (PE or Not PE).
  2.  **Translate:** LR = 5.
  3.  **Prior:** 5% (0.05).
      *   $Odds_{prior} = 0.05 / 0.95 \approx 0.053$.
  4.  **Update:**
      *   $Odds_{post} = 0.053 \times 5 = 0.265$.
      *   $P(PE)_{post} = 0.265 / (1 + 0.265) \approx 21\%$.
  5.  **Threshold:** Treatment threshold for PE (anticoagulation) is usually ~60-70% (due to bleeding risk). Diagnostic threshold for CT Angio is ~10-15%.
  6.  **Decision:** 21% is above the "get a CT" threshold but below the "start heparin" threshold.
  7.  **Defense:** "Pre-test was 5%. LR of 5 moves odds to 21%. Not high enough to treat, but high enough that ignoring it is negligent. Ordering CTA."

  *Critique:* This is standard Bayes. The procedure ensures they don't just say "5 times 5% = 25%" (linear error) or "It's 5 times more likely, so it's 83%" (partition error).

  ### Case 2: The Non-Exhaustive Differential (The Lung Nodule)
  **Scenario:** 65yo smoker, lung mass. Differential: Adenocarcinoma (A), Squamous (B), Benign/Granuloma (C).
  **Finding:** PET scan report: "Metabolic activity makes Adenocarcinoma twice as likely as Squamous." ($LR_{A,B} = 2$).
  **Priors:** Based on epidemiology + smoking: A (40%), B (20%), C (40%).

  1.  **Scope:** Non-Exhaustive. (A, B, and C).
  2.  **Translate:** $LR_{A,B} = 2$. Evidence favors A over B. Assume evidence is neutral regarding C (PET lights up in infection too, but let's assume the report implies specificity for malignancy types). *Correction for Procedure:* If the report implies malignancy vs benign, LR applies to A+B vs C. If it distinguishes subtypes, it applies to A vs B. Let's assume the latter: The scan distinguishes tumor types, not benign vs malignant.
      *   *Judgment Call:* Does the scan rule out Benign? If not, $LR_{A,C} = 1$ and $LR_{B,C} = 1$.
  3.  **Prior Scores:**
      *   $Score_A = 0.40$
      *   $Score_B = 0.20$
      *   $Score_C = 0.40$
  4.  **Update (Minimum Information):**
      *   Evidence doubles the weight of A relative to B.
      *   $New Score_A = 0.40 \times 2 = 0.80$
      *   $New Score_B = 0.20 \times 1 = 0.20$
      *   $New Score_C = 0.40 \times 1 = 0.40$ (Untouched by evidence distinguishing A/B)
      *   $Total = 1.40$
      *   $P(A)_{post} = 0.80 / 1.40 = 57\%$
      *   $P(B)_{post} = 0.20 / 1.40 = 14\%$
      *   $P(C)_{post} = 0.40 / 1.40 = 29\%$
  5.  **Threshold:** Biopsy threshold is >50% for specific chemo planning.
  6.  **Decision:** Adeno is now the front-runner (57%). Proceed with biopsy geared toward Adeno markers.
  7.  **Defense:** "The scan favored Adeno over Squamous 2:1. I kept the Benign probability proportional because the scan doesn't rule out granuloma. Adeno is now 57%, Squamous dropped to 14%. Benign remains significant at 29%, so we biopsy rather than radiate."

  *Critique:* Notice how C (Benign) dropped from 40% to 29% *without* evidence against it. This is mathematically necessary (renormalization) but epistemologically subtle. The procedure forces the clinician to acknowledge this "guilt by association" drop explicitly.

  ### Case 3: The Counter-Intuitive Result (The "Rule Out" That Doesn't)
  **Scenario:** 30yo female, "worst headache of life." Concern for Subarachnoid Hemorrhage (SAH).
  **Priors:** Clinical gestalt (thunderclap headache) puts SAH risk at 10% (High stakes).
  **Finding:** CT Head is negative.
  **Evidence:** "Negative CT makes SAH 10 times less likely than Non-SAH." (Sensitivity ~98%, Specificity ~100% for early SAH. LR- is roughly 0.1, which means Non-SAH is 10 times more likely given negative test... wait, let's frame it as the prompt asks).
  *Reframed Evidence:* "A negative CT is 10 times more likely if there is No SAH than if there is SAH." ($LR_{NoSAH, SAH} = 10$). Or inversely, $LR_{SAH} = 0.1$.

  1.  **Scope:** Binary (SAH vs No SAH).
  2.  **Translate:** $LR_{SAH} = 0.1$.
  3.  **Prior:** 10% (0.10).
      *   $Odds_{prior} = 0.10 / 0.90 = 0.11$.
  4.  **Update:**
      *   $Odds_{post} = 0.11 \times 0.1 = 0.011$.
      *   $P(SAH)_{post} = 0.011 / 1.011 \approx 1.1\%$.
  5.  **Threshold:**
      *   Treatment (Neurosurgery) Threshold: >80%.
      *   **Rule-Out Threshold:** <0.5% (Because missing SAH means death).
  6.  **The Conflict:** The math says 1.1%. This is "unlikely." Intuitively, the clinician wants to go home. But the *Value* of missing SAH is catastrophic.
  7.  **Procedure Stop:** The math says "It's probably not SAH." The Protocol Step 5 says "Check the stakes."
      *   1.1% > 0.5% (Safe discharge threshold).
      *   **Decision:** Do not discharge. Perform Lumbar Puncture.
  8.  **Defense:** "Mathematically, the probability dropped from 10% to 1%. However, our safety threshold for SAH is 0.5%. We are still in the 'danger zone.' The numbers justify further testing, not discharge."

  *Critique:* This is where the procedure protects the patient from "probability neglect." A 1% chance of death is unacceptable. The procedure forces the clinician to separate *Probability* (1%) from *Risk* (1% x Death = Unacceptable). It validates the intuition that "unlikely" isn't "impossible" when the stakes are high.

  ---

  ## Part III: Instructor's Notes on the "Judgment Calls"

  You asked me to be honest about where the math ends and the judgment begins. Here is the breakdown for your students:

  1.  **The Prior is a Guess (Step 3):** There is no objective "Pre-test Probability." It is a subjective degree of belief calibrated to epidemiology. When a student writes "10%," they are making a judgment call. The procedure forces them to make it explicit so it can be challenged. *If they can't pick a number, they aren't allowed to update.*
  2.  **The Ratio is Ambiguous (Step 2):** "Twice as likely" is natural language, not math. It usually maps to Likelihood Ratio, but sometimes clinicians mean Posterior Odds. The procedure assumes LR because it's the only way to respect the prior. If the radiologist meant Posterior Odds, the student must clarify. This is a communication step, not a math step.
  3.  **The "Other" Bucket (Step 4, Case B):** In the Differential Field case, assuming the evidence is neutral to "Other" ($LR=1$) is the **Principle of Minimum Information**. It is a philosophical stance: *Do not assume the test tells you more than it does.* If the scan distinguishes tumor types, it doesn't necessarily rule out infection. But mathematically, the probability of infection *must* drop because A and B sucked up the probability mass. The procedure makes this "tax" visible.
  4.  **The Threshold is Ethical (Step 5):** The math can never tell you when to treat. It can only tell you how likely the disease is. The decision to treat at 40% vs 60% depends on how much the patient fears the drug side-effects vs. the disease. The procedure draws a hard line here: **Math calculates risk; Humans tolerate it.**

  **Final Word to the Clinician:**
  "This procedure does not give you the truth. It gives you a coherent story. If your prior was wrong, your posterior is wrong. If the test's LR is misstated, your posterior is wrong. But if you follow this, your error is transparent. You can show the attending exactly where your numbers came from. That is what makes you defensible."
