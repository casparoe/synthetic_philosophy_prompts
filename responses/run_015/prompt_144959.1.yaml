      *   Does the 80% good offset it? Under strict Asymmetry: No. Under Repaired (Expected Value with Asymmetric Weighting): The bad weighs much heavier.
      *   *Advice:* The gut is right to feel the 80% counts, but the 20% is the moral gatekeeper. If the "bad" is truly *not worth living* (suicide level), 20% is morally terrifying. If "bad" means "hard but worth it," then 80% good easily wins. I need to clarify the definition of "below the line."
      *   *Assumption:* User says "below the line" (net negative).
      *   *Verdict:* Strict asymmetry says "Don't do it." Repaired principle says "The 80% provides no positive moral weight to *start*, but since you are starting, you must minimize the 20% risk. If you can't lower the 20%, the 80% cannot morally cancel it out *unless* you accept a threshold of acceptable risk."
      *   *Pragmatic fix:* Most ethical frameworks allow *some* risk of harm for potential benefit. But since "benefit of existence" is nullified, it's hard.
