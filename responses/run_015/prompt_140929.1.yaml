      *   *Prediction:* **Genocide.** Why? Because *Pelletier* established that physical killing isn't required if biological continuity is stopped. *Sula* established that local destruction counts. *Greenfield* established that destroying the conditions of life (economic) counts. This case combines Local Destruction (Sula) + Conditions of Life (Greenfield) + Biological Continuity (Pelletier - via forced absorption/sterilization of identity). The 9,000 deaths show "conditions of life calculated to bring about destruction" (Convention 2c). The Marrow precedent is the biggest risk, but Marrow had a surviving population of 200k *maintaining identity*. Here, the specific intent is *absorption* (ending identity).

