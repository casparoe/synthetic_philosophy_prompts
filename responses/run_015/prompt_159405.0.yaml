prompt: |-
  Last night me and my friend got into a three-hour argument about modality and I woke up still annoyed about it, so I want to check whether I'm the one who's right. Some background: I'm in a metaphysics seminar and last week we did that debate between counterpart theory and transworld identity — whether the very same individual can literally show up in more than one possible world, or whether, on Lewis's version, everything is stuck inside a single world and the most you ever get is counterparts. My friend's line was that counterpart theory just swaps out identity for a similarity relation, and I think that's exactly where it falls apart. Similarity is symmetric but it isn't transitive, and it isn't unique either — there can easily be two things both extremely similar to me — whereas identity is transitive and picks out exactly one thing. So similarity can't do the work that identity was doing in the modal logic.

  Here's the fix I came up with, which I think turns into a knockdown: take the relation 'is similar to me above some threshold', throw away anything below the threshold, and then take the transitive symmetric closure of what's left. Now you've got an equivalence relation, and an equivalence relation behaves exactly like identity as far as the logic cares, so Lewis has quietly smuggled transworld identity back in through the back door and the whole counterpart-theory-versus-transworld-identity thing was a purely verbal dispute all along. The other half of my argument is that without transitivity the theory can't even handle stacked modals — stuff like 'I could have been the sort of person who could have been a doctor', where the second 'could' needs counterparts of counterparts, and a non-transitive relation doesn't seem to give you those. And here's the case I kept pushing at her: imagine a world with two people in it who are both about equally similar to me, one a doctor and one a baker, with no principled way to break the tie. If similarity is all there is, then 'I could have been a doctor' and 'I could have been a baker' both come out true, but surely the theory ought to be able to say something sharper than 'both, kind of'. She just mumbled something about the relation being picked by the context and then brought up some example about a politician who could of lost an election, which sounded like a totally different objection to me and I don't see how it connects.

  So: is my closure argument right? Am I correct that once you close the counterpart relation under symmetry and transitivity you've just got transworld identity back again, and hence that the two camps were never disagreeing about anything substantive? And if I'm wrong — if Lewis can legitimately stick with a relation that isn't transitive — then how is he supposed to deal with the iterated 'could have been such that could have been' cases and with my two-candidates case, without either collapsing into identity or making literally everything possible? I genuinely want to know where my reasoning breaks, because my friend couldn't tell me and just kept saying I was changing the subject.
