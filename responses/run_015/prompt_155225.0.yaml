answer: |-
  You have identified a structural feature of meta-ontological debate that is widely recognized but often lacks a precise, unified label. You are describing a move that protects a core theory from a specific objection without increasing its explanatory power or exposing it to new risks.

  Here is an analysis of the established notions that come closest, why they fall slightly short of your description, and a proposal for how to draw the exact boundary you are looking for.

  ### 1. The Closest Established Notion: *Immunizing Stratagem*

  The most precise historical term for this is Karl Popper's **immunizing stratagem** (or *immunizing device*).

  In *The Logic of Scientific Discovery*, Popper describes how a theory can be protected from falsification by introducing auxiliary assumptions that cannot be tested. He distinguishes between legitimate auxiliary hypotheses (which increase testability) and immunizing stratagems (which decrease it).

  *   **Why it fits:** It captures the "bolted on" nature, the sole function of disposing of an objection, and the lack of failure conditions.
  *   **Why you hesitated:** Popper developed this for empirical science (saving a theory from *data*). You are observing it in metaphysics (saving a theory from *objections*).
  *   **The Adjustment:** In meta-ontology, "empirical falsification" is replaced by "dialectical coherence." When a Platonist posits a "special faculty" to answer Benacerraf, they are immunizing their ontology against the charge of incoherence. The "data" being saved is the *plausibility of the view itself*.

  ### 2. The Meta-Ontological Framing: *Theoretical Cost without Virtue*

  In contemporary meta-ontology (following David Lewis, Ted Sider, and Kris McDaniel), debates are often framed in terms of **theoretical virtues** (parsimony, explanatory power, simplicity) and **theoretical costs** (ontological commitment, ideological complexity).

  Your "clause" is precisely an increase in **ideological complexity** (new primitives like "non-causal relation") that yields no increase in **explanatory power**.

  *   **The Label:** In this framework, such a clause is often dismissed as a **"theoretical vice"** or an **"idle posit."**
  *   **The Mechanism:** The debate continues indefinitely because both sides are willing to pay different costs. The Platonist accepts the cost of "queer" epistemological posits to save the ontology; the Nominalist accepts the cost of complex reformulations of science to save the epistemology. Neither clause is "false"; they are just expensive.

  ### 3. Drawing the Boundary: *Independent Leverage*

  You asked for the exact mark separating these idle clauses from substantive defensive additions (like Hartry Field's nominalism). The boundary is **Independent Leverage** (or **Risk**).

  A defensive addition has genuine content if and only if it imposes constraints on the theory *elsewhere* than the site of the objection.

  | Feature | **Idle Clause (Immunizing Stratagem)** | **Substantive Defense (Research Programme)** |
  | :--- | :--- | :--- |
  | **Example** | "We have a special mathematical faculty." | "Science can be rewritten without quantifiers." |
  | **Failure Conditions** | None. (How do you test for the faculty?) | High. (Can the rewriting actually be done?) |
  | **Integration** | Isolated. Explains only the objection. | Integrated. Constrains the theory of science. |
  | **Risk** | Risk-avoiding. Protects the core. | Risk-imposing. Exposes the core to new checks. |
  | **Function** | **Dialectical Shield.** | **Constructive Alternative.** |

  **The Exact Mark:**
  A clause is idle if it is **unconstrained by independent considerations.**
  *   **Field's Nominalism:** If Field fails to nominalize General Relativity, his view fails. The defense is constrained by the mathematics of physics. It has *independent leverage*.
  *   **The "Special Faculty":** If the Platonist fails to describe the faculty's mechanism, they simply assert it is "ineffable." The defense is constrained only by the need to block the objection. It has *no independent leverage*.

  ### 4. A Proposed Label: *Dialectical Epicycle*

  Since "immunizing stratagem" carries empirical baggage, and "theoretical cost" is a valuation rather than a structural label, I propose the term **Dialectical Epicycle**.

  *   **Epicycle:** Captures the geometric/bolted-on nature (Ptolemaic astronomy). It preserves the "phenomena" (mathematical practice) without fixing the underlying mechanism (ontology/epistemology).
  *   **Dialectical:** Specifies that the pressure being resisted is argumentative, not empirical.

  A **Dialectical Epicycle** is an auxiliary claim added to a philosophical position that:
  1.  Is motivated solely by a specific objection.
  2.  Does not alter the position's claims about the target domain (mathematical practice).
  3.  Lacks independent failure conditions (unfalsifiable within the dialectic).
  4.  Does not generate new predictions or constraints elsewhere in the theory.

  ### 5. Why the Dispute Continues (The Meta-Explanation)

  You noted that these clauses keep the dispute going indefinitely. This is because they convert a **knock-down objection** into a **trade-off**.

  *   **Before the Clause:** The objection (e.g., Benacerraf's) suggests the view is *impossible*.
  *   **After the Clause:** The view is *possible*, but *expensive*.

  The debate shifts from "Is this view coherent?" to "Is this cost worth paying?" Since there is no objective exchange rate between "ontological purity" and "epistemological clarity," the debate becomes permanent. This is sometimes called **theoretical underdetermination**, but specifically of the **cost-benefit** variety.

  ### Summary

  *   **Established Notion:** **Immunizing Stratagem** (Popper), adapted for metaphysics.
  *   **Meta-Ontological Term:** **Idle Posit** or **Cost without Virtue**.
  *   **Proposed Label:** **Dialectical Epicycle**.
  *   **The Boundary:** **Independent Leverage.** Does the addition risk the theory in areas *other* than the one under attack? Field's nominalism does (it risks failing to reconstruct physics); the "special faculty" does not (it risks nothing).

  You are effectively observing the transition of a research programme from a **progressive phase** (explaining new things) to a **degenerating phase** (explaining away objections), but occurring within the non-empirical constraints of meta-ontology. The "clauses" are the markers of degeneration.
