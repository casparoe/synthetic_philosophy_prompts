  # Diagnostic Instrument: Aggregation and Contractualism

  **Instructions:** Read each scenario below. For each node, select the **single action** you would morally require or permit. Do not select "indifferent"; force a choice. Record your answers as a string of eight letters (e.g., A-A-B-A...).

  ### The Decision Tree

  **Node 1: The Unequal Pair**
  Person A will permanently lose the use of their **arm** unless you act. Person B will permanently lose the use of their **leg** unless you act. You can save only one.
  *   **A:** Save Person A (Arm).
  *   **B:** Save Person B (Leg).

  **Node 2: The Trivial Many**
  Person A will **die** unless you act. A group of **10,000 people** will each suffer a **severe headache for one hour** unless you act. You can prevent only one outcome.
  *   **A:** Save Person A (Life).
  *   **B:** Prevent the Headaches (10,000 people).

  **Node 3: The Lower Threshold**
  Person A will **die** unless you act. A group of **5 people** will each lose a **leg** unless you act. You can save only one group.
  *   **A:** Save Person A (Life).
  *   **B:** Save the 5 People (Legs).

  **Node 4: The Upper Threshold**
  Person A will **die** unless you act. A group of **500 people** will each lose a **leg** unless you act. You can save only one group.
  *   **A:** Save Person A (Life).
  *   **B:** Save the 500 People (Legs).

  **Node 5: The Risk Distribution**
  Person A faces a **100% certainty of death** unless you act. A group of **100 different people** each face a **1% chance of death** unless you act (statistically equivalent to one expected death). You can save only one group.
  *   **A:** Save Person A (Certainty).
  *   **B:** Save the 100 People (Risk).

  **Node 6: The Disjoint Tie**
  Person A will suffer **permanent paralysis** unless you act. Two *different* people, B and C, will each suffer **permanent paralysis** unless you act. You can save only one set of individuals.
  *   **A:** Save Person A.
  *   **B:** Save Persons B and C.

  **Node 7: The Ceiling Test**
  Person A will **die** unless you act. A group of **1,000,000 people** will each lose a **leg** unless you act. You can save only one group.
  *   **A:** Save Person A (Life).
  *   **B:** Save the 1,000,000 People (Legs).

  **Node 8: The Small Gap**
  Person A will lose an **arm** unless you act. A group of **5 people** will each lose a **finger** unless you act. You can save only one group.
  *   **A:** Save Person A (Arm).
  *   **B:** Save the 5 People (Fingers).

  ***

