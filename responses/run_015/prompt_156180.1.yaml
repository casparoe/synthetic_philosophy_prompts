answer: |-
  There is no single established term that captures exactly what you are describing. You have identified a specific evolutionary niche in the ecology of information: **selection for defensibility rather than accuracy.**

  While there are adjacent concepts in philosophy, sociology, and psychology, none fully isolate the mechanism you have observed: *the propagation of a claim is aided by attaching a social or cognitive cost to the act of verifying it, where that cost is borne by the skeptic.*

  Below is an analysis of why existing terms fall short, an answer to your question about Darwinian machinery, a proposed term to help you carve the concept, and a framework for moderation policy that distinguishes legitimate boundaries from illegitimate shielding.

  ### 1. Existing Concepts (The Near Misses)

  You are right to feel that standard memetics (Dawkins, Blackmore) does not fit. Standard memetics focuses on *fidelity of copying* and *fecundity*. Your observation is about *survival against critique*.

  There are three established concepts that come close, but each misses a crucial dimension of your observation:

  *   **The Conventionalist Stratagem (Karl Popper):** Popper described how scientists protect a theory from falsification by redefining terms or adding auxiliary hypotheses.
      *   *Fit:* It captures the logic of making a claim hard to falsify.
      *   *Miss:* It is purely logical/epistemic. It does not account for the *social cost* imposed on the questioner (e.g., being labeled uncaring). Your examples rely on social norms, not just logical loopholes.
  *   **Thought-Terminating Clichés (Robert Jay Lifton):** Phrases that end discourse ("It is what it is," "Trust the plan").
      *   *Fit:* Captures Example 3 (the conversation-stopper).
      *   *Miss:* It treats the phrase as a psychological tranquilizer. It doesn't explain the *evolutionary advantage* of the claim itself, nor does it cover Example 1 (where the claim travels with a complex conditional rider).
  *   **Agnotology (Robert Proctor):** The study of culturally induced ignorance.
      *   *Fit:* Captures the production of ignorance.
      *   *Miss:* Usually focuses on large-scale industrial production of doubt (e.g., tobacco). It is too macro for forum-level interpersonal dynamics.

  **Verdict:** There is no existing term that treats *resistance to scrutiny* as a selectable trait that hitchhikes on valuable information.

  ### 2. Is Darwinian Machinery the Right Tool?

  **Yes, but the "fitness function" is inverted.**

  In a healthy epistemic environment, ideas are selected for *correspondence with reality* (truth) or *utility* (function). In the environment you describe, ideas are selected for *resilience against social friction*.

  This is still Darwinian selection, but the "environment" is not the physical world; it is the **social topology of the forum.**
  *   **Mutation:** A claim arises (e.g., "Batch X is faulty").
  *   **Selection Pressure:** Skeptics ask for data.
  *   **Adaptation:** The claim acquires a "shield" (e.g., "Asking for data is dangerous").
  *   **Fitness:** The shielded variant survives longer because it repels the selection pressure (skepticism).

  The problem is not that selection is the wrong word; it is that the system is selecting for **survivability**, not **truth**. You are observing **maladaptive epistemic evolution**.

  ### 3. A Proposed Term: "Epistemic Tolling"

  Since no term exists, I propose **Epistemic Tolling**.

  **Definition:** A communicative strategy where a claim is propagated with an attached condition that imposes a social, moral, or cognitive cost on any party attempting to verify the claim.

  **Key Characteristics:**
  1.  **Asymmetry:** The cost of verification falls on the skeptic, not the claimant.
  2.  **Borrowed Authority:** The toll is usually collected using pre-existing norms (safety, privacy, experience) rather than new rules.
  3.  **Decoupling:** The toll is detachable from the claim's truth value. (The batch *could* be faulty regardless of whether asking for proof is "uncaring.")

  **Why this term?** "Tolling" captures your observation that the questioner is "priced out." It implies a barrier to entry that extracts a payment (reputation, effort, moral standing) which is not required for the transaction (knowledge exchange) to logically occur.

  ### 4. The Carving: Legitimate Boundaries vs. Epistemic Tolling

  For moderation policy, you cannot ban all barriers to verification. Some claims *legitimately* require trust or have high verification costs. You need to distinguish between **Instrumental Barriers** (legitimate) and **Social Penalties** (illegitimate).

  Here is the carving you need for policy:

  #### A. Instrumental Barriers (Legitimate)
  These are costs inherent to the physics, logic, or ethics of the situation. They cannot be removed without destroying the value of the claim or violating a separate ethical duty.
  *   **Example:** "I cannot share the log files because they contain other users' IP addresses."
  *   **Why it passes:** The barrier (privacy law/ethics) exists independently of the claim. The cost is not imposed *on the skeptic* to shame them; it is a constraint on the *system*.
  *   **Test:** If the skeptic had the clearance, could they see the data? Yes.

  #### B. Social Penalties / Epistemic Tolling (Illegitimate)
  These are costs manufactured to protect the claim. They attack the *status* or *moral standing* of the skeptic.
  *   **Example:** "If you ask for the logs, you are aiding the hackers."
  *   **Why it fails:** The barrier is contingent on the skeptic's behavior. It converts a request for evidence into a moral transgression.
  *   **Test:** Does the barrier require the skeptic to change their moral stance to proceed? Yes.

  ### 5. Moderation Heuristic: The Substitution Test

  To write your policy, use this three-step test to determine if a claim is engaging in Epistemic Tolling.

  **1. The Reversibility Test**
  *   *Question:* Can the "shield" be removed without the claim collapsing?
  *   *Tolling:* "Asking for proof shows you don't care about safety." (Remove the guilt, the safety warning still stands).
  *   *Legitimate:* "This circuit is live." (Remove the danger, the warning is meaningless).
  *   *Policy:* If the shield is rhetorical rather than physical, flag it.

  **2. The Locus of Cost Test**
  *   *Question:* Who pays the price of verification?
  *   *Tolling:* The skeptic pays in reputation ("You're inexperienced"), effort ("Go measure it yourself"), or moral standing ("You're unsafe").
  *   *Legitimate:* The claimant pays in effort ("I will email you the data privately") or the system pays in resources ("We need 24 hours to sanitize the logs").
  *   *Policy:* Claims that shift the *social* cost of verification to the skeptic are suspect.

  **3. The Norm-Parasitism Test**
  *   *Question:* Is the shield borrowing from a norm unrelated to the claim's truth?
  *   *Tolling:* Using "safety" to block "data requests." (Safety is relevant to action, not to truth).
  *   *Legitimate:* Using "privacy" to block "data release." (Privacy is directly relevant to the data).
  *   *Policy:* Flag claims where the reason for secrecy is morally distinct from the reason for the claim.

  ### 6. Contested Boundaries (Where Policy Will Bleed)

  You asked to flag where the classification is contested. These are the edge cases where your moderation will face pushback, and you should acknowledge the ambiguity.

  **1. The Whistleblower's Dilemma (Your Example 1)**
  *   *The Conflict:* Genuine safety warnings often *must* spread faster than verification allows. A whistleblower may not have time to measure the component before warning others.
  *   *The Toll:* They may use strong language ("Don't ask, just stop!") to prevent fatal delay.
  *   *The Boundary:* Distinguish between **Urgency** and **Immunity**.
      *   *Allowed:* "I haven't measured it yet, but the risk is high enough that you should stop now. I will post data later." (Temporary suspension of verification).
      *   *Banned:* "If you ask for data, you are endangering lives." (Permanent immunity from verification).
  *   *Policy:* Allow urgent warnings without proof *temporarily*, but ban permanent prohibitions on asking for proof.

  **2. The Expertise Barrier (Your Example 3)**
  *   *The Conflict:* Some questions *are* naive and waste community resources. "Only someone who has never done this would ask that" is sometimes factually true.
  *   *The Toll:* It shuts down learning by shaming.
  *   *The Boundary:* Distinguish between **Prerequisite Knowledge** and **Gatekeeping**.
      *   *Allowed:* "This requires an oscilloscope to verify. If you don't have one, you'll have to trust the consensus." (Physical barrier).
      *   *Banned:* "If you don't understand why we don't measure this, you shouldn't be here." (Social barrier).
  *   *Policy:* Require that expertise barriers point to *documentation*, not *identity*. ("Read the FAQ" vs. "You're new.")

  **3. The Privacy/Security Shield (Your Example 2)**
  *   *The Conflict:* Organizations often avoid writing things down to protect members or avoid bureaucracy.
  *   *The Toll:* It makes accountability impossible.
  *   *The Boundary:* Distinguish between **Operational Security** and **Accountability Avoidance**.
      *   *Allowed:* "We do not publish member names publicly." (Protects people).
      *   *Banned:* "We do not record decisions." (Protects power).
  *   *Policy:* Mandate that *internal* records exist even if *public* records do not. The "no writing down" rule is almost always Epistemic Tolling.

  ### Summary for Policy Drafting

  Do not ban "unverified claims." Ban **"Verification Penalties."**

  **Draft Rule Language:**
  > "Members may share unverified information, provided they do not attach social, moral, or reputational costs to the act of verification. It is permissible to say 'I do not have the data.' It is not permissible to say 'Asking for the data is harmful.' Claims that render themselves unfalsifiable by penalizing skepticism will be removed."

  This targets the *mechanism* (the toll) rather than the *content* (the claim), allowing whistleblowing while blocking the immunization strategies you have identified.
