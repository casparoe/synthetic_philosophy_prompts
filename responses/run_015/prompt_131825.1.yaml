  # Joint Statement on the Special Composition Question
  **Participants:** The Strong Universalist Camp & The Cohesion-Gradualist Camp  
  **Status:** Adversarial Collaboration Draft v1.0

  Look, we got together to stop talking past each other. We both care about the Special Composition Question (SCQ)—basically, "when do some things make up a whole thing?"—but we usually end up shouting about definitions. This document is us trying to pin down exactly where we shake hands and where we throw hands. We aren't trying to convert each other here; we're trying to map the dispute so clearly that anyone reading this can see exactly what's at stake.

  ### Part 1: What We Actually Agree On
  Before we get to the fights, here's the common ground. We both signed off on these four claims:

  1.  **The Formal Problem is Real:** We agree that classical mereology (the math of parts and wholes) doesn't solve the metaphysics. The equations work either way; the dispute is about what exists in the world, not how to count it.
  2.  **No Magical Glue:** Both camps reject the idea that composition requires a mysterious, primitive "bonding relation." There's no extra metaphysical substance needed to stick parts together. If there's a whole, it's just the parts arranged appropriately.
  3.  **Ontological Economy Matters:** We both want to avoid unnecessary bloat. We just disagree on what counts as bloat. Universalists think adding restrictions creates arbitrary lines (which is messy). Gradualists think counting every scattered plurality as a full-blown object creates trivial clutter (which is also messy).
  4.  **Integration is Relevant (Sort Of):** We agree that causal and spatiotemporal integration matters for *something*. Universalists say it matters for *interest* and *predication* (why we care about tables vs. table-moons). Gradualists say it matters for *existence conditions* (how real the whole is).

  ### Part 2: Where We Split (The Disagreement Table)
  Here's the precise wording we each stand by. We agreed on the categories, but the content is where the friction is.

  | Issue | Strong Universalist Stance | Cohesion-Gradualist Stance | The Exact Divergence |
  | :--- | :--- | :--- | :--- |
  | **Nature of Composition** | Composition is **binary**. Either parts compose a whole or they don't. Since any parts *do* compose a whole, existence is an on/off switch that is always "on." | Composition is **gradable**. Parts compose a whole with varying "mereological density." Existence is a dimmer switch, not a binary toggle. | Is "being a whole" a yes/no fact, or a matter of degree? |
  | **Status of Scattered Objects** | A scattered pair of shoes constitutes an object with **full metaphysical status**. It is ontologically identical to a glued-together statue, even if pragmatically useless. | A scattered pair of shoes constitutes an object with **near-zero density**. It exists, but it has negligible mereological weight compared to an organism. | Do scattered sums exist *fully* or *diminished*? |
  | **The "Special" in SCQ** | There is no special composition. The question is misplaced; composition is automatic. | There is a special composition condition, but it's not a sharp line. It's a smooth curve of cohesion. | Is the lack of a sharp line due to *everything counting* (U) or *degrees of counting* (G)? |

  ### Part 3: The Cruxes & Test Cases
  This is the meat of it. We identified two main cruxes where our intuitions collide. For each, we picked a concrete case and wrote down our predicted verdicts in advance. No moving the goalposts later.

  #### Crux A: Is Being-a-Whole Binary or Gradable?
  **The Question:** Can an object lose its "wholeness" without its parts ceasing to exist, or does the object persist as long as the parts do?

  **The Test Case: The Slow Decay**
  *Scenario:* A living organism is kept alive but slowly loses causal integration over months (metabolic processes slow, cells loosen binding) until it effectively becomes a scattered heap of organic matter, without any sudden death event.

  *   **Universalist Verdict:** The object **persists unchanged** in terms of existence. Throughout the decay, the parts exist, so the sum exists. The *description* changes (from "organism" to "heap"), but the ontological entity is constant. There is no moment where "wholeness" leaks out.
  *   **Gradualist Verdict:** The object's **mereological density fades**. As causal integration drops, the object becomes "less of a whole." There is no single moment it vanishes, but its metaphysical status diminishes continuously alongside its biological integration.

  #### Crux B: The Status of Near-Zero Density Composites
  **The Question:** Do low-cohesion sums have real metaphysical status, or are they just useful fictions that we're treating as real?

  **The Test Case: Instant Vaporization**
  *Scenario:* An organism is instantly vaporized into scattered atoms. The causal links are severed immediately.

  *   **Universalist Verdict:** The original object ceases to exist only because the **parts cease to exist** (or change fundamentally). However, the new scattered atoms immediately compose a new object (the "vapor-sum"). The transition is just a rearrangement of parts that always compose something.
  *   **Gradualist Verdict:** The object's density **drops to near-zero instantly**. The "whole" doesn't vanish entirely (we aren't nihilists), but it loses almost all mereological weight. The transition marks a catastrophic loss of cohesion, shifting the entity from "high-density whole" to "negligible sum."

  ### Closing Note
  We're leaving this knowing we still disagree. The Universalists think the Gradualists are smuggling in a vague notion of "reality" that doesn't do any work. The Gradualists think the Universalists are ignoring the obvious metaphysical difference between a cat and a cat-plus-the-moon.

  But we agree on this: the debate isn't about logic, and it isn't about magic glue. It's about whether reality comes in bits or gradients. We'll reconvene after testing these verdicts against some edge cases (probably involving quantum entanglement or fuzzy boundaries) to see if either side wants to budge.

  *Signed,*  
  *The Universalist Team*  
  *The Gradualist Team*
