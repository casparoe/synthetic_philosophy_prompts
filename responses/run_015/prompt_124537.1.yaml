  **Mark: 12/20**

  **Part (a)**
  You have correctly identified the distinct objects of the two complaints. The first concerns the normative fairness of the demand (the right to make it), while the second concerns the psychological sincerity of the expression (the belief behind it). This distinction is clear and accurately reflects the seminar's framework. However, a fully correct answer would have noted that the 'unfairness' complaint is often cashed out in terms of *authority* or *jurisdiction* rather than merely 'demand', though your formulation is acceptable.

  **Part (b)**
  Your claim that standing and wrongness are independent follows correctly from the premise that standing concerns the blamer's normative situation. You are right to infer that B's objection shows nothing about the wrongness of his own act; it targets A's position, not the truth of the judgment. This section is concise and accurate. A more complete answer might have elaborated on *why* the blamer's situation is normative (e.g., involving rights or authority) rather than merely epistemic, but the core inference holds.

  **Part (c)**
  This section contains significant errors in reasoning and instruction compliance.
  1.  **Inference Check:** You claim that "sincerity is what standing requires" on the Fairness View. This does not follow from the seminar's definition, which specifies *willingness to accept the application* of the norm. One can sincerely believe a norm applies to others while unwilling to accept it for oneself (the exceptionalist), or vice versa. Conflating sincerity with willingness is imprecise.
  2.  **Instruction Failure:** The question asks you to explain the Confessor's standing with reference to *both* views. You explain the Confessor's standing on the Fairness View, but you only apply the Relationship View to the *hypocrite* ("The Relationship View reaches the same verdict..."). You fail to state whether the Confessor has standing on the Relationship View. Given the seminar definition ('rather than on the blamer's own record'), a fully correct answer would have noted that the Confessor's record is irrelevant on this view; standing would depend solely on the relationship's state, regardless of her confession.
  3.  **Definitional Precision:** Your explanation of the Relationship View suggests the blamer's record *determines* standing because it damages the relationship. This risks collapsing the Relationship View into the Fairness View. The seminar definition distinguishes them by making the relationship the criterion, not the record. A correct answer would distinguish whether the relationship survives the record breach independently of the blamer's attitude.
  4.  **Conclusion:** Consequently, your conclusion that B's objection "fails entirely" is too strong. While the complaints in (a) may fail against the Confessor on the Fairness View, the Relationship View might still deny standing if the relationship is damaged, regardless of her sincerity. You have run together the verdicts for the Hypocrite and the Confessor under the Relationship View.

  **Summary**
  While the answer demonstrates a sound grasp of the basic distinctions between standing and wrongness in parts (a) and (b), it falters significantly in part (c) by failing to apply the seminar's definitions consistently to the Confessor case across both views.
