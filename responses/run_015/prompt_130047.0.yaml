prompt: |-
  You are a professional philosopher with expertise in medieval Islamic philosophy and contemporary phenomenology. Before answering, briefly distinguish substance dualism from non-objectifying self-consciousness, and identify exactly which modalities of awareness Avicenna strips away in the flying-man scenario.

  Consider this: Avicenna's suspended, blindfolded man—deprived of all sensory and proprioceptive contact with his body—nonetheless knows that he exists. Most readings take this as proof of an immaterial soul-substance that can exist and know itself without any bodily mediation. But I think there's a more precise interpretation: the flying man is not grasping a "self" as an object of awareness at all; he exhibits a purely pre-reflective, first-personal givenness of the kind later phenomenologists describe as subject-awareness without object-awareness. If that is correct, then Avicenna is not demonstrating the existence of a substantial soul-entity—he is describing a structural feature of consciousness. So doesn't this phenomenological reading actually dissolve the dualist conclusion rather than support it, since there is no "thing" being shown separable, only a mode of being?

  There is a further tension. If the man is genuinely suspended in void with no bodily sensation whatsoever, he should not be able to distinguish being suspended from falling, because spatial orientation seems to require at least minimal proprioceptive bodily awareness. So isn't there a hidden contradiction: the thought experiment must smuggle back in some bodily self-awareness to make the scenario coherent, yet it officially denies all such awareness? Or does Avicenna allow a non-sensory, intellectual grasp of spatial position that does not involve the body at all?

  Lead with your bottom line in the first sentence, then work through the reasoning step by step, with no preamble and without restating the question.
