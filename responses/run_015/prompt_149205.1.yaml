  Here is the ranking from most to least convincing, assigned by explanatory power across both cases. Each tier reflects how well the account handles the structural similarities between mathematics and biology specifically.

  1. **Maturity thesis (Tier A):** This is the most convincing account because it addresses the intellectual context. Both fields had accumulated enough precursor knowledge that the next logical step was visible to multiple minds simultaneously. The intellectual soil was tilled; the seed had to grow.
  2. **Shared-tool convergence (Tier A):** A very strong runner-up explanation focusing on shared methodology. Algebraic notation and global naturalist networks provided the machinery needed to formulate these ideas independently. Without these shared languages, the thoughts could not have been expressed the same.
  3. **Institutional-bottleneck (Tier B):** This works well for evolution using scientific societies, but less for calculus, where private correspondence and individual study dominated the breakthrough phase. It explains visibility, not generation, making it secondary to intellectual maturity.
  4. **Competitive-arousal (Tier B):** This explains Darwin rushing publication, but fails for calculus, where the priority dispute erupted after the work was completed. It accelerates announcement, not invention, limiting its scope to social dynamics over cognitive breakthroughs.
  5. **Archival-compression (Tier C):** This is the weakest account. While record-keeping distortions exist, they cannot explain the deep conceptual overlap; the ideas themselves genuinely emerged twice. It mistakes documentation lag for intellectual independence, ignoring the parallel cognitive work.

  The maturity thesis fits both cases remarkably well, though the nature of that maturity differs. In calculus, the maturity was logical; the algebraic tools demanded a method for changing quantities. In evolution, the maturity was empirical; geology and breeding data demanded a mechanism for change. While the *type* of readiness varied, the structural inevitability remains significantly consistent across both. Neither case relies heavily on unique genius alone; both required a specific threshold of prior knowledge to be crossed. Therefore, the Tier A explanation holds overall without needing separate leading theories for mathematics versus biology. It is very robust indeed.

  **Epistemic weight: 0.1.** The truth of calculus or natural selection does not depend on who articulated it first; the validity rests on evidence and logic, not identity. Knowing Newton was first changes nothing about the mathematics itself. The idea stands on its own merits regardless of the author.
  **Social weight: 0.9.** Credit shapes historical narrative, funding, and future motivation. Naming laws after discoverers creates role models and establishes priority rights within the scientific community. Reputation drives career advancement and resource allocation in research institutions.
  While the idea exists independently of the person, the human ecosystem of science relies heavily on attribution to function. We prioritize the discoverer not because the truth changes, but because the social structure of knowledge production requires recognized ownership to incentivize labor and organize history.

  **Probably.** Given the maturity of the fields, someone else would likely have formulated these ideas within approximately twenty years. The current intellectual infrastructure was already in place to support these breakthroughs.
  **Condition:** The single condition that would change this answer is a truly catastrophic loss of precursor knowledge. If the foundational texts in algebra or the collections of biological specimens had been destroyed, the necessary tools for convergence would vanish. Without that shared base of information, the discoveries would remain isolated insights rather than inevitable conclusions. The inevitability ultimately relies on the preservation and transmission of the past work.
