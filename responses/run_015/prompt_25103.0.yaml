answer: |-
  You have put your finger on the exact nerve that makes this debate so exhausting for anyone trying to find traction. You are right: they agree on the science, they agree on the metaphysics (determinism/luck), and they agree on the consequentialist baseline. The stalemate isn't about facts; it's about the *architecture of justification*.

  Here is the diagnosis: This is not merely a verbal dispute, nor is it a simple clash of intuitions. It is a **category collision between internal and external justification.**

  ### 1. The Structural Mismatch
  Dennett and Caruso are arguing from different logical levels, and they refuse to acknowledge the legitimacy of the other's level.

  *   **Dennett is an Internalist/Functionalist.** He argues from *within* the practice of holding responsible. For Dennett, "desert" is not a metaphysical property waiting to be discovered in the causal chain; it is a status conferred by participation in a normative community. When he says a criminal "deserves" punishment, he means: "You are a competent agent who understood the rules of the game, you chose to break them, and the penalty is the price of admission for that choice." His justification is circular by design: the practice justifies the desert because the practice creates the agents who can deserve.
  *   **Caruso is an Externalist/Foundationalist.** He argues from *outside* the practice, looking in. He demands a justification for the practice itself that does not rely on the practice's own rules. When he asks if someone "deserves" suffering, he is asking: "Does the causal history of this agent license the state to inflict pain?" For Caruso, "desert" requires a metaphysical link (ultimate responsibility) that Dennett explicitly rejects.

  The reason they talk past each other is that Dennett thinks Caruso's demand for "ultimate responsibility" is a philosophical bug—a request for something that doesn't exist and isn't needed. Caruso thinks Dennett's "pragmatic desert" is a moral bait-and-switch—rebranding vengeance as social hygiene.

  ### 2. Is it Verbal?
  Partly, but not innocently. They are using the word "desert" to point at two different concepts.
  *   **Dennett's Desert:** *Eligibility.* You are the right kind of entity to be a target of sanctions within our social system.
  *   **Caruso's Desert:** *Moral Worthiness.* You are the ultimate source of this action such that inflicting harm on you is intrinsically fitting, not just instrumentally useful.

  If it were *only* verbal, they could agree on the policy and disagree on the label. But they don't. Dennett wants to keep the *affective* sting of retribution (the anger, the blame, the sense of "you owe this") because he thinks it's necessary for moral education. Caruso wants to excise that sting entirely and treat criminal justice like public health (quarantine/rehabilitation). So the verbal disagreement drives a material policy disagreement.

  ### 3. Is it Bedrock Intuition?
  Yes. This is the honest answer you asked for. The debate bottoms out in conflicting axiomatic commitments about **what morality is for.**

  *   **Dennett's Axiom:** Morality is a user-interface for social coordination. If the "free will" interface works to produce better agents and a safer society, it is "real enough." To abandon retributive emotions is to break the interface. His bedrock fear is **social unraveling.** He intuits that without the threat of *deserved* punishment, the normative force of law collapses into mere threat management.
  *   **Caruso's Axiom:** Morality is a constraint on harm based on truth. Inflicting suffering is a prima facie evil that requires the highest possible justification. If the metaphysical justification (ultimate responsibility) is missing, the harm is unjust, regardless of social utility. His bedrock fear is **state injustice.** He intuits that punishing someone for what they could not ultimately avoid is a violation of human dignity akin to punishing a victim of a natural disaster.

  ### 4. Can It Be Resolved?
  **No.** Not in the way you resolve a scientific dispute or a logical proof.

  There is no argument that will force Dennett to admit that "pragmatic desert" is morally insufficient, because he rejects the metric of "moral sufficiency" that Caruso is using. There is no argument that will force Caruso to admit that "ultimate responsibility" is unnecessary, because he views it as a necessary condition for justice.

  This is a **reflective equilibrium choice.** You have to decide which cost you are more willing to bear:
  1.  **The Dennett Cost:** We retain retributive practices and emotions that are, strictly speaking, metaphysically unfounded, risking the injustice of treating determined agents as if they were uncaused causers.
  2.  **The Caruso Cost:** We abandon retributive practices, risking the erosion of the normative concepts (blame, guilt, accountability) that underpin our current social cohesion, and potentially treating dangerous humans merely as broken machines to be fixed or contained.

  ### Teaching Advice
  Since you are teaching this, don't try to solve it for them. Instead, frame the stalemate as the lesson.

  The Dennett/Caruso exchange is the perfect case study for the limits of analytic philosophy when it hits **political anthropology.**
  *   Ask your students: *Is the criminal justice system a machine for truth (Caruso) or a tool for community maintenance (Dennett)?*
  *   Point out that Dennett is essentially arguing that **fiction can be morally necessary.** He is saying, "We must pretend (or act as if) people have libertarian free will because the truth is too corrosive to the social fabric."
  *   Point out that Caruso is arguing that **truth trumps utility.** He is saying, "Even if society frays, we cannot build it on a lie that inflicts suffering."

  **The Verdict:**
  It is a genuine normative disagreement grounded in incompatible bedrock intuitions about the relationship between *truth* and *practice*. Dennett privileges the practice; Caruso privileges the truth. Neither can refute the other without begging the question. You have to pick your poison.
