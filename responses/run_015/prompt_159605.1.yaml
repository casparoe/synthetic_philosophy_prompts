answer: |-
  1. **The Collapse Objection**
  You argue that prospectivism relies on a metaphysical error: treating the agent as a time-slice. But consider the agent who stays in a failing marriage because leaving would feel like a betrayal of her past vows. If the *pain of betrayal* is a future psychological cost, and the *integrity of loyalty* is a future psychological benefit, hasn't the fidelity account just collapsed into a richer version of prospectivism? If the only work "fidelity" does is name a specific class of future utilities, what remains of the claim that the *past outlay itself* has normative force?

  *   **Follow-up (if she distinguishes fidelity from future utility):** You say the reason to stay is the loyalty, not the happiness loyalty brings. But if the agent knew she could take a pill tomorrow that would make her feel no guilt about leaving and value her future freedom more than her past vows, would the rational requirement to stay vanish? If yes, isn't the normativity instrumental after all?
  *   **Flag:** If she replies that the pill case is impossible or irrelevant, ask: "Are you saying **the cost isn't really sunk** because it's causally linked to this psychological setup? If so, does your account apply to any agent who *could* take the pill?"

  2. **The Epistemic Reading**
  Let's grant that sunk costs often carry information: my past investment signals that I once judged this project promising. On an epistemic reading, a rational agent uses that signal only insofar as she lacks better current information. But your fidelity account suggests that even with transparent self-knowledge and full access to the original evidence, the past outlay retains a claim. Do you accept that a perfectly self-transparent agent should be *more* sensitive to sunk costs than an opaque one? If not, what does fidelity add once the evidence is already in?

  *   **Follow-up (if she says transparency doesn't reduce obligation):** Then consider the agent who realizes her past judgment was clearly wrong, even by her own past lights. Does the fidelity account require her to honor a commitment she knows she should never have made?
  *   **Flag:** If she says "Yes, because commitment is binding," press: "Is that bindingness a matter of **loyalty, not error**, even when the loyalty is to a judgment known to be flawed?"

  3. **The Act/Disposition Gap**
  There is a standard defense of sunk-cost sensitivity: being the *sort of person* who finishes what they start makes long-term projects possible, even if finishing *this* particular project is costly. This justifies a disposition, not necessarily the individual act. If you grant this, are you committed to a form of rational irrationality—where the well-functioning agent is moved by considerations she knows to be irrelevant in the specific case? How does this sit with your apparent willingness to recommend that people be trained out of sunk-cost reasoning in contexts like business or gambling?

  *   **Follow-up (if she distinguishes contexts):** You suggest business is different from personal life. Is that because the "self" in business is a fiction? If so, does the fidelity account only apply to personal identity, and not to agency generally?
  *   **Flag:** If she argues we shouldn't train people out of it generally, ask: "If we shouldn't train them out of it, are you endorsing a systematic bias? And if we should, isn't that an admission that **the cost isn't really sunk** in the personal case either, but merely useful to pretend otherwise?"

  4. **Fidelity to a Repudiated Self**
  Your rationale presupposes a past self worth being loyal to. But agents change. Consider an agent who made a large outlay under manipulated information, or toward an end she now judges morally worthless. She repudiates the self that made the investment. Does the fidelity account demand she honor that outlay? If you say no, isn't the normative force coming from the *value of the end* rather than the *fact of the outlay*?

  *   **Follow-up (if she says fidelity is conditional on value):** Then the sunk cost isn't doing the work; the value is. If the value is prospective (the end is good now), we are back to prospectivism. If the value is retrospective, see my next question.
  *   **Flag:** If she insists the past self still has a claim, ask: "Even if that past self was manipulated? Does **loyalty, not error** extend to the victims of coercion, provided they signed the contract?"

  5. **Costs Imposed by Others**
  Extend that case: what about costs incurred by others on my behalf? My parents sacrifice to put me through medical school; I decide I hate medicine. The resources are sunk, but not by me. Does their outlay create a fidelity obligation for me? If yes, on what grounds am I loyal to *their* past? If no, why does the locus of the outlay matter if the resource waste is identical?

  *   **Follow-up (if she says it creates a relational obligation):** Then the obligation is based on the current relationship, not the sunk cost. If the relationship ends, does the obligation to finish the degree persist?
  *   **Flag:** If she says the obligation persists, ask: "Is this because the resources are wasted, or because **the cost isn't really sunk** in the relational economy?"

  6. **The Impersonal Case**
  Escalation of commitment appears in firms, states, and even in behavioral ecology (the Concorde fallacy in wasps). In these cases, there is no single persisting self to be loyal to. The pattern is stronger when the decision-maker personally authorized the outlay, weaker under external review. If your account is essentially personal, why does the phenomenon have this shape in organizations and across species? Are you conceding those cases to forward-looking signaling explanations?

  *   **Follow-up (if she concedes the impersonal cases):** If signaling explains the wasp and the firm, why do we need a different explanation for the human? Is the human case just signaling to oneself?
  *   **Flag:** If she says human agency is metaphysically distinct, ask: "Does that mean the **fidelity account** is a special privilege of human metaphysics, or do you think the wasp is also being loyal?"

  7. **Retrospective Value**
  Does finishing the cathedral make the earlier labor non-wasted, or does it only add value going forward? To sustain the fidelity account, do you need the stronger claim—that a later event can alter the value of an earlier one? Are you willing to pay the metaphysical price for that claim, namely that the past is not fixed in value?

  *   **Follow-up (if she denies retroactive value):** If the past labor remains wasted, and only the future cathedral has value, then the decision rests on the future value alone. The sunk cost drops out.
  *   **Flag:** If she argues effort is constitutive of worth, ask: "Is the effort constitutive because it was spent, or because it is remembered? If the latter, isn't that just a prospective psychological fact?"

  8. **The Stipulated Pair (Setup)**
  I want to stipulate a pair of cases to test the maneuver we discussed. Case A: You invest $100k of your own money in a venture. Case B: You are given a venture with $100k already invested in it by a benefactor. Ex hypothesi, the future prospects, your skills, your identity, and your relationships are identical in both cases. The only difference is the history of the outlay. In Case A, do you have a reason to continue that you lack in Case B?

  *   **Follow-up (if she says Yes):** You are claiming the *history* itself generates a reason.
  *   **Flag:** If she hesitates, note: "This is the point where you usually say **the cost isn't really sunk** because of identity. But I have stipulated identity is held constant."

  9. **The Stipulated Pair (Constraint)**
  You answered that you have more reason to continue in Case A (personal outlay) than Case B (imposed outlay). Please describe the *source* of that extra reason without re-describing the options. You cannot cite your feelings, your identity, or the future value of the project, as those are held constant. What is the normative force of the *pastness* itself, isolated from all future consequences?

  *   **Follow-up (if she struggles or reverts to identity):** You are violating the stipulation. If you cannot name the force without referencing a future consequence (like guilt or identity maintenance), then the account collapses into prospectivism. If you can name it, is it not simply a brute intuition?
  *   **Flag:** If she says "It's about ownership," ask: "Does ownership matter if the resource is gone? Or is ownership just a proxy for **loyalty, not error**?"

  10. **Exposure and Falsifiability**
  Finally, a question on exposure. Given the ever-available re-description move—where any apparent sunk cost can be re-framed as bearing on identity or future relationships—what would count against the fidelity account? Is there a finding or argument that would make you give it up, or can the view always be saved by enriching the description of the agent?

  *   **Follow-up (if she says it's a conceptual truth):** If it's conceptual, it can't be wrong, but it also might not be guiding action. If it's empirical, it risks the collapse we discussed in Question 1.
  *   **Flag:** If she says the view is safe from empirical refutation, ask: "Does that mean the **fidelity account** is unfalsifiable? And if so, is it a theory of rationality, or a theory of description?"

  ***

  **Closing Note: The Weak Point**
  She is most likely to handle **Question 9 (The Stipulated Pair - Constraint)** badly. Her entire defensive strategy relies on the "re-description maneuver"—arguing that what looks like a sunk cost is actually a future-facing identity or relationship concern. Question 8 sets the trap by holding those factors constant, but Question 9 locks the door by forbidding her from citing them.

  Philosophers of action often rely on the phenomenology of agency to bridge gaps in normative theory. When forced to isolate the *pastness* of the cost from the *psychology* of the agent (guilt, identity, loyalty-feelings), she will be left with either a brute intuition ("the past just matters") or a contradiction. If she claims the past matters *independently* of its effect on the present self, she risks metaphysical obscurity. If she admits it matters only because of its effect on the present self, she concedes to prospectivism. Watching her try to articulate a normative force that is neither prospective nor psychological will likely be the moment the "fidelity" label slips from a substantive account to a mere metaphor.
