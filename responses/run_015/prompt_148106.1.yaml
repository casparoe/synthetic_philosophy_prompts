answer: |-
  The debate over moral testimony is often framed as a standoff between optimists, who treat moral claims like any other factual report, and pessimists, who insist there is something distinctively defective about forming moral beliefs on another's say-so. However, the pessimist position harbors an ambiguity that obscures the real stakes. The complaint against moral deference is either *epistemic*—that without grasping the reasons, your state is not genuinely a moral belief or knowledge—or *agency-based*—that even if the belief is true, acquiring it this way bypasses a duty to think for yourself and own the judgment guiding your action. To make progress, we must settle which reading is defensible. The epistemic reading is untenable; it sets the bar for moral knowledge higher than for any other domain, implying that sincere, reliable testimony cannot transmit knowledge simply because the subject matter is normative. This collapses into an implausible elitism. The agency-based reading is superior. It acknowledges that you can know the truth via testimony but insists that moral knowledge is distinct because it is essentially practical. To act morally is to act for reasons; if you defer blindly, you act on the reason "X said so," rather than the moral reasons themselves. The defect is not in the belief's truth, but in the agent's alienation from the grounds of action.

  This agency-based framework clarifies the first pair of cases: the value-divergent advisor versus the experience-advantaged advisor. When an advisor weights loyalty more heavily than you do and tells you firing a contractor was wrong, deference is distinctively defective. By accepting her verdict, you are not just learning a fact; you are adopting a weighting of values you do not endorse. You are allowing alien values to guide your action, which violates the duty of moral autonomy. You cannot act for the reasons "there actually are" because, for you, those reasons (loyalty over impartiality) do not hold the same force. Contrast this with the advisor who shares your principles but has more experience, telling you a remark was degrading. Here, deference is less problematic. The advisor is not asking you to adopt new values but helping you perceive how your existing values apply in complex circumstances. This is closer to perceptual testimony than value substitution. You are not bypassing your judgment so much as extending your moral perception. The agency reading explains why the second case is acceptable while the first is not: one illuminates your own moral landscape, while the other attempts to redraw it on your behalf.

  The case of the committee verdict presents a harder challenge. Here, five members issue a verdict based on disjoint, conflicting reasons, none of which you can reconstruct individually, yet the group's verdict is plausible. The epistemic pessimist would say you cannot know the verdict is true because there is no single reasoning path to grasp. The agency pessimist says you cannot own the verdict because there is no coherent set of reasons to act upon. I argue the agency reading captures the specific defect here without denying the utility of the verdict. Deferring to the committee is worse than deferring to an individual whose reasoning you can reconstruct because it creates a deeper alienation. With an individual, you can potentially trace the logic later; with the committee, the reasoning is structurally opaque. You are treating the moral verdict as a black box. However, this does not make institutional deference a counterexample to the pessimist framing; it is merely a hard case where agency is necessarily compromised for the sake of coordination. We often must accept institutional moral verdicts (e.g., laws, policies) to function, but the agency reading correctly identifies that this involves a surrender of personal moral ownership. It is a pragmatic necessity, not a epistemic triumph. You are not acting for the moral reasons, but for the reason of social compliance with a reliable process. The defect remains, even if the action is justified by other norms.

  This leads to the vetting problem and the question of ratification. The vetting problem suggests that picking a reliable moral advisor requires the very competence you claim to lack, making deference circular. The agency reading dissolves this circularity. You do not need full moral competence to vet an advisor; you only need enough competence to recognize that their values align with yours (as in the experience-advantaged case) or that their process is reliable. You are not outsourcing your entire moral framework, only specific applications. This preserves enough agency to make the initial selection non-arbitrary.

  Finally, does after-the-fact ratification cure the defect? If you later work through the reasoning and endorse the verdict you originally took on trust, the agency reading suggests the defect is temporal. The initial acquisition was defective because, at the time of action, you were not acting for the moral reasons. You were acting on authority. However, once you reconstruct the reasoning and endorse it, you retroactively integrate the belief into your own agency. The belief becomes fully yours. This implies the defect was never in the belief's content or truth, but in the *timing* of your ownership. You cannot act morally *then* on the basis of testimony alone if that testimony bypasses your grasp of reasons, but you can come to act morally *later* once that grasp is acquired. Ratification cures the defect for future action and validates the belief, but it does not erase the fact that the initial deference involved a suspension of moral agency.

  In conclusion, the agency-based reading of the pessimist complaint is the only defensible one. It avoids the implausible skepticism of the epistemic reading while preserving the intuition that moral deference is distinctively troubling. It explains why deference to value-divergent advisors is worse than to experience-advantaged ones: the former substitutes your values, the latter clarifies them. It explains why committee verdicts are distinctively alienating: they offer verdicts without reconstructible reasons, forcing a surrender of ownership. And it clarifies that while vetting is possible without circularity, the defect of deference is real but curable through ratification. Institutional deference is not a counterexample to pessimism but a testament to the tension between individual moral agency and collective necessity. We can accept moral testimony, but we must recognize that when we do, we are borrowing authority, not yet exercising judgment.
