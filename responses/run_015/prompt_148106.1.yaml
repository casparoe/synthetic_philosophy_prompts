      *   *Refining Ratification:* Does it cure the defect *of the original belief*? Or just allow future action? The prompt asks: "is the defect in how you first acquired it?" I should argue the defect is temporal. The initial action was defective, but the belief becomes fully owned later.

  5.  **Final Polish:** Check transitions between cases. Ensure the argument flows from the theoretical distinction to the practical applications. (Wait, I need to make sure I hit the word count. 1000-1300 is tight for 4 cases + theory. I need to be concise.)

      *   *Plan Adjustment:* Combine Vetting and Ratification into one section to save space for the Committee and Advisor cases which are richer.
      *   *Focus:* Ensure the "Agency" view is clearly defined as the winner early on.

  6.  **Writing Phase:** (Mental check of word count during drafting).
