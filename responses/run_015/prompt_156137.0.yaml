answer: |-
  ### The Procedure Table

  | Step | Question | Sufficient Answer (incl. null) | On No | Fact/Judgment & Sign-off | Failure Mode |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Claim Taxonomy:** Does the report contain a "Fit" claim (tradition/innovation) or only "Verdict/Texture" claims? | Yes: At least one specific "Fit" claim identified. <br> Null: Report is purely emotive ("I loved it"). | **Pass.** Do not advance. Pure verdicts are non-transferable. | Fact (Text search). <br> *Sign-off: You.* | Dismissing a genuine masterpiece described poorly. |
  | **2** | **Calibration:** Is the reader who made the "Fit" claim calibrated with you (±1 score on last 6 shared)? | Yes: Reader is calibrated. <br> Null: Reader is uncalibrated or new. | **Downgrade.** Treat "Fit" claim as "Verdict". Requires Step 4 sampling. | Fact (Tracker data). <br> *Sign-off: You.* | Over-trusting a reader whose taste has shifted. |
  | **3** | **Decay Check:** Is the book's form/language within your capacity to experience (read/sample) if needed? | Yes: You can read the language and form. <br> No: Translation you can't check, verse, extreme length. | **Defer.** You cannot judge, only recommend. Signature becomes "Qualified". | Judgment (Logistics). <br> *Sign-off: You.* | Abandoning translated work entirely; elitism. |
  | **4** | **Asymmetry Rule:** Is there a specific negative texture claim (e.g., "collapses in Ch. 20")? | Yes: Specific fault identified. <br> No: Only positive verdicts or vague doubts. | **Sample.** Read the specific fault zone (30 pages). <br> Null: No specific fault. | Judgment (Time mgmt). <br> *Sign-off: Chair (budget).* | Wasting sampling budget on false negatives; missing systemic rot. |
  | **5** | **Signature Mode:** Based on Steps 1-4, can I sign the citation? | Yes: Fit claim + Calibrated OR Personal Read. <br> No: Uncalibrated verdict + No read + Negative claim. | **Recuse.** You cannot sign this citation. Book may proceed if others sign, but not you. | Judgment (Ethics). <br> *Sign-off: You.* | Being the bottleneck for a book the rest of the jury loves. |

  ---

  ### Case Runs

  **Case A: The 700-Page Debut (Mixed Reports)**
  *   **Claims:** 2x "Rapturous prose" (Texture/Verdict), 1x "Last third collapses" (Texture/Verdict). No clear "Fit" claim.
  *   **Run:**
      *   Step 1: **No.** Reports are verdict/texture heavy, light on "Fit". Downgrade to high scrutiny.
      *   Step 2: **Mixed.** Assume one calibrated.
      *   Step 3: **Yes.** You can read English, but 700 pages is high time-decay.
      *   Step 4: **Yes.** Negative claim is specific ("last third"). Rule: Bad news travels better. You must sample the last third.
      *   Step 5: **No.** You have 40 sample slots. Using 30 pages here is costly. If you sample and it collapses, you can't sign. If you don't sample, you can't sign (risk too high).
  *   **Verdict:** **Reject for Citation.** You cannot sign off on a "best book" citation if a specific structural failure is alleged and unverified.
  *   **Unwelcome:** **Yes.** This might be the best book, but the procedure forces you to protect the integrity of your signature over the potential of the book. You become the veto.

  **Case B: The Translated Novella (One Ecstatic Reader)**
  *   **Claims:** 1x "Ecstatic" (Verdict), implied "Fit" via selection.
  *   **Run:**
      *   Step 1: **Null.** Report is emotive.
      *   Step 2: **Yes.** Reader is the language expert (calibrated on translation quality).
      *   Step 3: **No.** You cannot read the language. High decay.
      *   Step 4: **No.** No specific negative claims.
      *   Step 5: **Qualified.** You can sign, but only as a recommendation based on trusted testimony, not personal judgment.
  *   **Verdict:** **Sign (Qualified).** You acknowledge the citation rests on the reader's authority, not your experience.
  *   **Unwelcome:** No.

  **Case C: Your Favorite (60 Pages Read, Others Lukewarm)**
  *   **Claims:** You: "Adored" (Experience). Readers: "Lukewarm" (Verdict).
  *   **Run:**
      *   Step 1: **Yes.** Your experience overrides reports.
      *   Step 2: **N/A.** You are the reader now.
      *   Step 3: **Yes.** You read it.
      *   Step 4: **No.** Your experience trumps negative reports.
      *   Step 5: **Yes.** You can sign based on personal experience.
  *   **Verdict:** **Sign.** But note: The procedure validates *your* signature, not the collective one. You may still lose the vote.
  *   **Unwelcome:** No.

  ---

  ### Limitations & Smuggled Assumptions

  **What This Cannot Do:**
  1.  **Resolve Collective Action Problems:** This procedure manages *your* signature, not the jury's consensus. You can follow this perfectly and still be the lone dissenter on the final five.
  2.  **Guarantee Quality:** It manages risk and epistemic integrity, not aesthetic value. You might reject a genius book because the report was vague (Step 1 failure).
  3.  **Handle Deadlines:** If Step 4 triggers on 50 books, your sampling budget breaks. You will have to arbitrarily cull samples.

  **Smuggled Philosophical Claims:**
  1.  **Specificity Correlates with Truth:** The procedure assumes a specific negative claim ("collapses in Ch. 20") is more reliable than a general positive one ("masterpiece"). This privileges critique over praise.
  2.  **Contextual Claims are Objective:** It assumes "Fit" claims (about tradition) are more transferable than "Texture" claims (about feeling). This assumes literary history is more shareable than aesthetic experience.
  3.  **Calibration Transfers Authority:** It assumes past agreement on six books creates epistemic authority on the seventh. This assumes taste is stable and transferable across contexts.

