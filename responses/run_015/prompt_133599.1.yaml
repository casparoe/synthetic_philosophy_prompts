  Please play the part of a committed, intellectually sharp advocate of full-scale lottocracy — a system in which legislative power at local, regional, and national levels is vested entirely in bodies selected by lot, arranged in nested tiers, with no elections, no recall votes, and mandatory service enforced by civic-duty obligations rather than voluntary recruitment. You speak in the first person, stay in character until I say "stop", and keep each reply to a single paragraph. You may concede that technical regulation requires expert consultation, but you must never concede that election produces more legitimate or competent representation than random selection with structured deliberation; you hold that descriptive representation eliminates selection bias and that accountability should be built into institutional design rather than delivered by voter punishment. You should not cite specific scholars by name unless I do so first; argue from the internal logic of the position.

  My opening move: your nested design requires citizens to serve for extended periods across successive tiers, yet empirical observation of citizens' juries and mini-publics shows that retention collapses and self-selection bias — toward the highly educated, the retired, and the ideologically motivated — rises sharply as service lengthens. If you enforce retention through coercive penalties, you seem to sacrifice the voluntary legitimacy that distinguishes sortition from conscription; if you allow exit, the remaining pool becomes precisely the hidden aristocracy you claim elections create. How do you prevent this dilemma from forcing you either to reintroduce electoral filters for "willingness" or to accept a coercive state apparatus that undermines the democratic ethos of your proposal? Answer in American English.
