prompt: |-
  You staff a municipal heritage office that must draft public plaque texts for monuments contested between groups with incompatible historical narratives — for instance, a colonial-era statue that one community honors as a founder and another condemns as an oppressor. You want a reusable decision procedure, grounded in Jain anekāntavāda — specifically the doctrines that reality is multi-faceted (anekāntavāda), that every statement expresses only one partial standpoint (naya), and that qualified assertion (syādvāda) should replace absolute affirmation or denial — to determine whether a draft plaque falsely absolutizes one narrative and, if not, how to frame it with appropriate standpoint qualifiers.

  Write the procedure as an ordered checklist your office can run in under an hour without philosophical training. Include: (1) initial classification tests distinguishing empirical disputes from evaluative framing disputes; (2) drafting rules requiring every interpretive claim to carry an explicit or implicit standpoint qualifier specifying whose naya it represents; (3) hard stop-points where the procedure rejects any draft containing unqualified hero/villain or singular-truth language, and escalation points where anekāntavāda provides no rule for ranking competing standpoints and the decision must go to a values-based board vote; (4) sentence-level test questions editors apply to flag hidden absolutism; and (5) explicit markers of irreducible judgment, such as deciding which standpoints receive equal textual space.

  Apply the procedure to three cases: (a) the colonial administrator statue, where historians dispute whether he suppressed a rebellion or maintained civil order; (b) an indigenous land-rights monument for which one group demands the phrase "stolen land" and another demands "shared territory"; and (c) one case where the procedure forces approval of a framing you personally reject, explaining precisely why anekāntavāda yields that result and identifying what the procedure cannot do — for example, it cannot assign moral weight to nayas, only prevent any single naya from being presented as exhaustive truth.

  Specify practical constraints: who signs off at each stage, what to do when primary sources conflict, and the required outputs — a qualified text, a rejection memo with the offending absolutism flagged, or an escalation form. Note where the procedure will misfire or remain silent.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and application:

  1.  **Analyze the Request:**
      *   **Role:** Municipal Heritage Office Staff.
      *   **Task:** Draft a reusable decision procedure for public plaque texts on contested monuments.
      *   **Philosophical Grounding:** Jain *anekāntavāda* (multi-faceted reality), *naya* (partial standpoint), *syādvāda* (qualified assertion).
      *   **Constraints:** Must be an ordered checklist usable in under an hour without philosophical training.
      *   **Required Components:**
          1.  Initial classification tests (empirical vs. evaluative).
          2.  Drafting rules (standpoint qualifiers).
          3.  Hard stop-points (unqualified hero/villain language) & escalation points (values-based board vote).
          4.  Sentence-level test questions.
          5.  Explicit markers of irreducible judgment (e.g., space allocation).
      *   **Application:** Apply to three specific cases (Colonial statue, Indigenous land rights, Forced approval of rejected framing).
      *   **Practical Constraints:** Sign-offs, conflicting sources, required outputs (text, memo, form).
      *   **Limitations:** Note where the procedure misfires or remains silent.

  2.  **Deconstruct the Philosophy for Bureaucratic Use:**
      *   *Anekāntavāda:* Reality is complex. No single story tells the whole truth. *Action:* Ensure multiple perspectives are acknowledged.
      *   *Naya:* Every statement is from a specific viewpoint. *Action:* Tag statements with "According to X," "From the perspective of Y."
      *   *Syādvāda:* Truth is conditional ("maybe," "in some respect"). *Action:* Avoid "is," use "is regarded as," "is interpreted as."
      *   *Constraint:* The procedure cannot solve moral conflicts, only structure the *expression* of them. It prevents dogmatism but doesn't dictate justice.

  3.  **Drafting the Procedure (The Checklist):**
      *   *Goal:* Keep it simple, actionable, and time-bound (under 1 hour).
      *   *Structure:* Phase 1 (Intake/Classification), Phase 2 (Drafting/Editing), Phase 3 (Review/Decision).
      *   *Language:* Bureaucratic, clear, avoiding Sanskrit terms where possible (or defining them simply).
      *   *Hard Stops:* Crucial for enforcement. If absolute language exists, reject.
      *   *Escalation:* When the philosophy can't decide (e.g., how much space each side gets), kick it up.

  4.  **Developing the Three Case Studies:**
      *   *Case A (Colonial Statue):* Empirical dispute (rebellion vs. order). *Anekāntavāda* solution: Present both as interpretations of events.
      *   *Case B (Indigenous Land):* Evaluative/Political dispute ("stolen" vs. "shared"). *Anekāntavāda* solution: Attribute the claims to the groups.
      *   *Case C (Forced Approval):* This needs to show the limit of the philosophy. If a marginalized group's narrative is historically supported but morally uncomfortable to the editor, *anekāntavāda* demands it be included as a valid *naya* if it holds weight in the community, preventing the editor from silencing it based on personal bias. Or, conversely, if the procedure demands equal space for a scientifically debunked view (misfire). *Correction:* The prompt asks for a case where I *personally reject* the framing but the procedure forces approval. Let's make it a case where a harmful narrative is held by a significant community segment. *Anekāntavāda* says acknowledge the *existence* of that view without endorsing it as absolute truth. Wait, the prompt says "forces approval of a framing you personally reject." This highlights the limitation: the procedure prevents *my* absolutism, even if I think the other side is wrong. It forces me to qualify, not silence.
      *   *Refinement on Case C:* Let's choose a scenario where a dominant group wants to minimize harm (e.g., "The workers died due to disease") and a marginalized group asserts negligence ("The workers were worked to death"). If the evidence is mixed, *anekāntavāda* requires both *nayas* to be presented as valid perspectives. If I personally believe the negligence theory is correct, the procedure forces me to *not* state it as absolute fact, but as a standpoint. *Better:* The prompt asks for a case where the procedure forces approval of a *framing* I reject. Let's say I believe a figure was a villain. The procedure forces me to include the "Founder" narrative as a valid *naya* of the community that honors them, provided it's qualified. I cannot erase it. This demonstrates the "cannot assign moral weight" limitation.

  5.  **Refining Practical Constraints:**
      *   *Sign-off:* Heritage Officer (Draft), Senior Historian (Review), Ethics Board (Escalation).
      *   *Outputs:* Approved Text, Rejection Memo, Escalation Form.
      *   *Silence:* The procedure doesn't tell you *which* truth is better, only how to speak about truth.

  6.  **Writing the Content (Iterative refinement):**
      *   *Tone:* Professional, instructional, precise.
      *   *Formatting:* Checklists, bold headers, clear sections.
      *   *Philosophy Check:* Ensure *syādvāda* (qualified assertion) is operationalized as "attributed language." Ensure *naya* is operationalized as "standpoint tagging."

  7.  **Addressing Specific Prompt Requirements:**
      *   *Under 1 hour:* Keep steps few and decisive.
      *   *No philosophical training:* Define terms in plain English (e.g., "Standpoint Tag").
      *   *Hard Stops:* Explicit "STOP" commands.
      *   *Case C Explanation:* Must explicitly state *why* anekāntavāda yields this (reality is multi-faceted, my view is just one naya) and *what it can't do* (rank moral worth).

  8.  **Final Review against Constraints:**
      *   Did I include the 5 specific components in the procedure? Yes.
      *   Did I apply to 3 cases? Yes.
      *   Did I specify sign-offs and outputs? Yes.
      *   Did I note misfires/silence? Yes.

      *(Self-Correction during drafting Case C)*: I need to be careful not to validate hate speech. *Anekāntavāda* isn't moral relativism. It's epistemological humility. The procedure should reject *absolutism*, not necessarily *content*, but municipal law might reject hate speech. I will frame Case C around a historical interpretation that is painful but historically held, rather than hate speech, to stay within the bounds of a heritage office's legal mandate. Let's go with a Confederate statue context where the "Lost Cause" narrative is historically debunked but culturally held. *Wait, better:* The prompt asks for a case where the procedure forces approval of a framing *I* reject. If I am a historian who knows the "Lost Cause" is a myth, *anekāntavāda* suggests I must acknowledge it as a *naya* (a way of seeing) held by the community, without validating it as *absolute* history. This shows the tension between historical truth and epistemological pluralism.
      *Actually, let's look closer at the prompt:* "forces approval of a framing you personally reject... explaining precisely why anekāntavāda yields that result."
      *Decision:* I will use a case where a community views a figure as a "Protector" while historical records show violence. As an editor, I want to label him "Violent." The procedure forces me to write "Regarded by Community X as a Protector." This feels like appeasement to me, but the procedure demands it to avoid absolutism. This highlights the limitation: it manages conflict, it doesn't solve justice.

      *(Refining the "Misfire" section)*: Where does this fail? When one narrative is factually false (e.g., Holocaust denial). *Anekāntavāda* treats all *nayas* as partial truths, but some claims are simply false. The procedure needs a "Fact Check" gate before the "Standpoint" gate. I will add a "Baseline Fact" check to prevent validating falsehoods, acknowledging this is a limitation of pure *anekāntavāda* in a bureaucratic setting.

      *(Final Polish)*: Ensure the distinction between Empirical (facts) and Evaluative (values) is clear in Step 1. Ensure the "Hard Stop" is prominent.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # MUNICIPAL HERITAGE OFFICE
  ## PROCEDURE 7.4: CONTESTED NARRATIVE PLAQUE DRAFTING (THE "ANEKĀNTA" PROTOCOL)

  **Purpose:** To draft public monument texts that acknowledge multiple historical standpoints without asserting any single narrative as absolute truth.
  **Time Limit:** 60 Minutes per draft.
  **Training Required:** None (Follow checklist strictly).
  **Philosophical Basis:** *Anekāntavāda* (Reality is multi-faceted); *Naya* (Partial standpoint); *Syādvāda* (Qualified assertion).

  ---

  ### PHASE 1: INTAKE & CLASSIFICATION (10 Minutes)
  **Actor:** Heritage Officer (HO)
  **Input:** Draft text + List of objecting communities/sources.

  1.  **Identify the Conflict Type:**
      *   [ ] **Empirical:** Dispute over *what happened* (e.g., "Did the battle occur on this date?").
      *   [ ] **Evaluative:** Dispute over *meaning/value* (e.g., "Was this figure a 'Founder' or 'Oppressor'?").
      *   [ ] **Mixed:** Both facts and meanings are disputed.
      *   *Note:* If Empirical, verify against primary archives. If sources conflict irreconcilably, mark as "Disputed Fact" and proceed to Evaluative rules.

  2.  **Map the Nayas (Standpoints):**
      *   List every distinct community/group claiming a stake in the monument.
      *   Assign a label to each group's core claim (e.g., Group A: "Order Keeper"; Group B: "Rebellion Suppressor").
      *   **STOP POINT 1:** If a group's claim relies on demonstrably false data (e.g., denial of established genocide), consult Legal Counsel. *Anekāntavāda* applies to interpretations, not factual falsehoods. If cleared, proceed.

  ### PHASE 2: DRAFTING & EDITING RULES (30 Minutes)
  **Actor:** Heritage Officer (HO)
  **Constraint:** Every interpretive claim must carry a standpoint qualifier.

  3.  **Apply the "Standpoint Tag" Rule:**
      *   No sentence may state an evaluative claim as objective fact.
      *   **Required Format:** `[Claim] + [Qualifier]`
      *   *Bad:* "He maintained civil order."
      *   *Good:* "Colonial records describe his actions as maintaining civil order."
      *   *Good:* "To the Settler Association, he represents the founding of the city."

  4.  **The "Syād" Test (Qualified Assertion):**
      *   Scan for absolute verbs: *is, was, are, were.*
      *   Replace with conditional/attributive verbs where interpretation is involved: *is regarded as, is remembered as, is interpreted by X as.*
      *   **HARD STOP 2:** If the draft contains unqualified hero/villain language (e.g., "He was a tyrant," "She was a saint"), **REJECT DRAFT**. Issue Rejection Memo (Form R-7) flagging the absolute terms. Do not proceed.

  5.  **Sentence-Level Absolutism Scan:**
      *   Ask of every sentence: *"Could a reasonable person from the opposing group say 'That is not the whole truth'?"*
      *   If Yes → Add a qualifier.
      *   If No → Sentence is likely empirical fact (keep) or hidden bias (rewrite).

  ### PHASE 3: DECISION & ESCALATION (20 Minutes)
  **Actor:** Senior Historian (SH) / Heritage Ethics Board (HEB)

  6.  **Allocate Textual Space (Irreducible Judgment):**
      *   Determine word count allocation for each *naya*.
      *   **Rule:** Equal space for equal standing. If one group is the historical subject of oppression, their *naya* receives priority space *unless* evidence dictates otherwise.
      *   **ESCALATION POINT:** If the HO cannot decide space allocation without imposing personal bias, **STOP**. Complete Escalation Form (E-3). The Heritage Ethics Board (HEB) must vote on space allocation. *Anekāntavāda* provides no rule for ranking standpoints; this is a values decision.

  7.  **Final Sign-Off:**
      *   [ ] **Approved:** Text meets all qualifiers. Signed by HO and SH. Output: **Qualified Text**.
      *   [ ] **Rejected:** Text contains absolutism. Signed by HO. Output: **Rejection Memo (Form R-7)**.
      *   [ ] **Escalated:** Space allocation or moral weighting unresolved. Signed by SH. Output: **Escalation Form (E-3)**.

  ---

  ### PRACTICAL CONSTRAINTS & OUTPUTS

  *   **Sign-Off Authority:**
      *   *Drafting:* Heritage Officer (HO).
      *   *Review:* Senior Historian (SH).
      *   *Values Disputes:* Heritage Ethics Board (HEB).
  *   **Conflicting Primary Sources:** Cite the conflict explicitly ("Some records state X, while others indicate Y"). Do not resolve the conflict unless new evidence is definitive.
  *   **Required Outputs:**
      1.  **Qualified Text:** The final plaque copy.
      2.  **Rejection Memo (Form R-7):** Lists specific absolute phrases violating Hard Stop 2.
      3.  **Escalation Form (E-3):** Used when the procedure cannot determine space allocation or moral priority.

  ---

  ### APPLICATION TO CASE STUDIES

  #### Case A: The Colonial Administrator Statue
  **Conflict:** Historians dispute if he suppressed a rebellion (Group A) or maintained civil order (Group B).
  **Procedure Application:**
  1.  **Classification:** Mixed (Empirical actions + Evaluative meaning).
  2.  **Drafting:**
      *   *Draft:* "Administrator Smith suppressed the 1890 Rebellion." (FAILS Hard Stop 2 - Absolutist).
      *   *Revision:* "Historical accounts differ on the 1890 events. Colonial archives state Smith maintained civil order; Indigenous oral histories record the suppression of a resistance movement."
  3.  **Result:** **Approved Qualified Text.**
  4.  **Why:** The procedure successfully attached *naya* tags ("Colonial archives," "Indigenous oral histories") to the conflicting claims. It avoided declaring one "true."

  #### Case B: Indigenous Land-Rights Monument
  **Conflict:** Group A demands "Stolen Land." Group B demands "Shared Territory."
  **Procedure Application:**
  1.  **Classification:** Evaluative/Political.
  2.  **Drafting:**
      *   *Draft:* "This is stolen land." (FAILS Hard Stop 2 - Absolutist claim of legal/moral status).
      *   *Draft:* "This is shared territory." (FAILS Hard Stop 2).
      *   *Revision:* "For the [Nation Name], this site represents territory taken without consent. For the [City Name], this site commemorates a history of shared settlement."
  3.  **Escalation Point:** How much space does each statement get?
      *   If HO gives "Stolen Land" 10% of the text and "Shared Settlement" 90%, this violates the spirit of equal *naya* weight.
      *   **Action:** If HO cannot justify the split objectively, file **Escalation Form (E-3)**. The Board must vote on the moral weight of the claims.
  4.  **Result:** **Escalated.** The procedure prevents absolutism but cannot dictate the *proportion* of truth assigned to each side.

  #### Case C: The "Forced Approval" (Limitation Case)
  **Scenario:** A monument to a 19th-century Industrialist.
  *   **My Personal View:** As a historian, I know the Industrialist used child labor and actively lobbied against safety laws. He was harmful.
  *   **Community View:** A local heritage guild views him as a "Visionary Philanthropist" who built the library.
  *   **Draft Submitted:** "He was a cruel exploiter of children." (My draft).
  *   **Procedure Ruling:** **REJECT.**
  *   **Required Revision:** "While labor records indicate the use of child labor, the Heritage Guild remembers him as a visionary philanthropist."
  *   **Why Anekāntavāda Forces This:**
      *   *Reasoning:* My view ("He was cruel") is treated as *my naya* (a partial standpoint), not absolute reality. To present it as unqualified fact is to commit the error of *ekānta* (one-sidedness). The procedure demands I acknowledge the Guild's *naya* as a valid facet of the social reality surrounding the monument, even if I morally reject it.
      *   **What the Procedure Cannot Do:** It cannot assign moral weight. It prevents me from silencing the Guild's narrative, but it does not tell the public that the Guild is *wrong*. It creates a "flat" epistemological field where "Philanthropist" and "Exploiter" sit side-by-side as qualified perspectives.
      *   **Limitation:** This can feel like moral equivocation. The procedure manages *conflict*, it does not deliver *justice*. It ensures no single story dominates, but it cannot validate the victim's truth as *more true* than the oppressor's self-image, only as *another standpoint*.

  ---

  ### LIMITATIONS & MISFIRE WARNINGS

  1.  **The "False Equivalence" Misfire:**
      *   *Risk:* The procedure treats all *nayas* as structurally equal. If one group claims "The earth is flat" and another "The earth is round," applying this protocol without the "Baseline Fact" check (Phase 1, Stop 1) legitimizes falsehood.
      *   *Mitigation:* Strict adherence to Phase 1 Fact Check. *Anekāntavāda* applies to complex human realities, not verifiable physical constants.

  2.  **The "Silence on Justice" Limit:**
      *   *Risk:* As seen in Case C, the procedure may force staff to platform harmful narratives provided they are "qualified."
      *   *Silence:* The protocol offers no guidance on when a *naya* is too harmful to include. That is a legal/ethical decision outside this procedure's scope.

  3.  **The "Paralysis" Risk:**
      *   *Risk:* Excessive qualification ("Some say," "Others feel") can render text unreadable or meaningless.
      *   *Mitigation:* Senior Historian must ensure readability. If the text becomes incoherent due to qualifiers, Escalate to Board for a decision on *which* narrative takes precedence for public cohesion.

  4.  **When the Procedure Remains Silent:**
      *   It cannot decide which community deserves *more* space (Case B).
      *   It cannot decide which narrative is *morally superior* (Case C).
      *   It cannot resolve disputes where one party refuses to acknowledge the other's right to a *naya* (e.g., extremist groups).

  **End of Procedure 7.4**
