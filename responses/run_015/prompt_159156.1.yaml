answer: |-
  **JOINT STATEMENT ON NEURAL PRECURSORS AND VOLITIONAL AGENCY**

  **Parties:** The Antecedent-Initiation Camp (AIC) and The Conscious-Control Camp (CCC)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Interpretation of Premovement Neural Activity

  ### I. AGREED CLAIMS

  The following claims constitute the empirical and conceptual common ground established by both camps. These are not merely procedural; they are substantive commitments required to ensure the subsequent disagreement is not based on shared errors.

  1.  **The Baseline and Reference of the Premovement Negativity.**
      *   *Claim:* The premovement negativity (Readiness Potential or RP) is measured via signal averaging time-locked to the onset of electromyographic (EMG) activity, not to the onset of conscious intention. Its amplitude is defined relative to a pre-trial baseline where no movement preparation is assumed.
      *   *Rationale:* To prevent the circular inference that the RP begins before intention simply because it is averaged relative to the movement. Both camps agree the waveform is real, but its temporal relationship to *decision* onset is the dispute.

  2.  **The Possibility of Late Abortion.**
      *   *Claim:* In the standard paradigm, a subject can abort a prepared movement after the reported onset of intention (W-time) and before the movement occurs.
      *   *Rationale:* Acknowledges the "free won't" data point. Both camps agree the motor system is not a ballistic missile once preparation begins; the dispute is whether aborting is an active intentional exercise or a passive failure of accumulation.

  3.  **The Ecological Limitation of the Paradigm.**
      *   *Claim:* Standard Libet-style tasks involve arbitrary, self-paced, motivationally weightless movements where there are no reasons to weigh and nothing at stake.
      *   *Rationale:* Limits the scope of inference. Both camps agree that if the mechanism of interest is *deliberation*, this task may not engage it. Generalization to high-stakes decision-making is an open empirical question, not an assumed fact.

  4.  **The Operational Definition of Decision Onset.**
      *   *Claim:* No instrument reads off the onset of a decision directly. Any claim about *when* a decision occurs inherits the operational definition smuggled into the analysis (e.g., the point where the averaged waveform deviates from baseline by X standard deviations).
      *   *Rationale:* Prevents reification of the waveform. The RP is a voltage change; calling it a "decision" is an interpretation.

  5.  **The Metacognitive Nature of W-Time.**
      *   *Claim:* The reported time of intention (W) is a metacognitive report subject to noise sources distinct from the motor execution itself, including clock reading error and memory reconstruction.
      *   *Rationale:* Undercuts the precision of the subjective marker. Both camps agree W-time is not a veridical timestamp of a neural event, though they disagree on the magnitude and direction of the error.

  6.  **The Dependency on Definitions of Free Will.**
      *   *Claim:* Which philosophical conclusion follows from the data depends on which notion of free will is in play (e.g., libertarian freedom vs. compatibilist control).
      *   *Rationale:* Separates metaphysics from mechanism. A finding that neural activity precedes consciousness refutes libertarian free will but does not necessarily refute compatibilist accounts of agency.

  7.  **Neural Ownership.**
      *   *Claim:* The neural machinery generating the premovement negativity belongs to the agent. It is not an external force acting upon the agent.
      *   *Rationale:* Prevents a dualistic caricature. The AIC does not claim the brain is an alien possessor; the CCC does not claim the mind is a ghost. The dispute is about levels of description within the same organism.

  8.  **Necessity of Neural Activity.**
      *   *Claim:* Specific neural activity is necessary for the movement to occur. There is no movement without a physiological precursor.
      *   *Rationale:* Establishes physical closure. The CCC does not argue for magic; they argue for the causal relevance of the *conscious experience* associated with that activity.

  ### II. TABLE OF RESIDUAL DISAGREEMENTS

  | Disputed Proposition | Antecedent-Initiation Camp (AIC) Formulation | Conscious-Control Camp (CCC) Formulation | Type of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **1. The Nature of the Early RP** | The early premovement negativity indexes the settling of the decision. The threshold crossing *is* the decision, occurring before awareness. | The early premovement negativity indexes preparation, readiness, or a stochastic bias toward acting. It is not a decision until endorsed. | Mechanism / Reference |
  | **2. Causal Authority of Consciousness** | Conscious intention is a late index of a process already underway. It reports the settlement and may shape what follows but does not originate the action. | The interval between reported intention and movement, plus veto capacity, gives conscious intention genuine causal authority over the final output. | Mechanism / Explanation |
  | **3. The Locus of the "Agent"** | The agent is the whole biological system. If the subpersonal machinery settles the action, the agent has settled it, even if unaware. | The agent is the conscious person. Subpersonal processes are inputs to the agent, not the agent itself. A decision requires personal endorsement. | Explanation / Reference |
  | **4. Generalizability** | The mechanism isolated (stochastic accumulation to threshold) is the universal mechanism for voluntary action, regardless of stakes. | The mechanism isolated is specific to arbitrary, weightless movements. Reasoned deliberation engages distinct top-down control loops. | Mechanism / Scope |

  ### III. THE CRUXES: TESTS AND PREDICTIONS

  The following sub-questions are identified as critical. Settling one would move at least one side. For each, we specify the concrete test, the predictions, and the interpretability warnings.

  **Crux 1: What the Early Premovement Negativity Indexes**
  *   **Question:** Does the RP reflect the settling of a decision, or a stochastic accumulation toward a threshold whose crossing time is set partly by when the movement happens to occur?
  *   **Test:** Vary the cost of acting early against the cost of acting late. Include blocks where an unpredictable external event creates a decision that must be made on the spot (reaction) rather than a movement that merely happens (action). Measure whether the onset of the early signal tracks the deadline structure or the reported intention.
  *   **AIC Prediction:** The RP onset will track the threshold crossing required for movement execution regardless of cost structure. In unpredictable blocks, the RP will still precede W-time significantly, showing the "decision" (threshold crossing) is mechanically determined by accumulation rates.
  *   **CCC Prediction:** The RP onset will shift strategically with the cost/deadline structure. In unpredictable blocks, the RP will be attenuated or absent until the external cue arrives, showing the early signal in standard tasks was mere readiness, not decision.
  *   **Embarrassing Result:**
      *   *For AIC:* If RP onset shifts perfectly with strategic cost changes in a way that aligns with W-time rather than movement time.
      *   *For CCC:* If RP onset remains fixed relative to movement even when the optimal strategy changes drastically.
  *   **Power/Interpretability Warning:** Signal averaging across trials with different strategic thresholds may smear the onset point. Single-trial analysis is required but is currently low signal-to-noise in EEG. A null result here is uninformative.

  **Crux 2: The Error Budget for Reported Time of Intention (W-Time)**
  *   **Question:** What is the variance decomposition of the W-report? Is it a veridical perception of onset or a post-hoc reconstruction?
  *   **Test:** Catch trials where the prepared movement is unexpectedly blocked (no EMG), and trials where attention is briefly captured (distractor) at the moment of the intended report. Measure the shift in reported W-time.
  *   **AIC Prediction:** W-time will show a large systematic pull toward the event that follows it (the movement or the blocked attempt). In blocked trials, W-time will be reported as if the movement happened (large reconstruction error).
  *   **CCC Prediction:** W-time will show small sensory noise but little systematic backward pull. In blocked trials, W-time will be reported accurately as the time the *urge* occurred, distinct from the movement (small reconstruction error).
  *   **Embarrassing Result:**
      *   *For AIC:* If W-time in blocked trials remains veridical to the urge and does not drift toward the expected movement time.
      *   *For CCC:* If W-time in blocked trials shifts significantly to match the time the movement *would* have occurred.
  *   **Power/Interpretability Warning:** Introspective reports are inherently low-fidelity. High variance may obscure systematic bias. This test relies on the assumption that subjects can report an urge without a movement, which may be phenomenologically impossible for some.

  **Crux 3: The Abort (Veto) Mechanism**
  *   **Question:** Is calling off a prepared movement an intentional action with a neural precursor, or simply the non-occurrence of a threshold crossing?
  *   **Test:** Compare the final stretch of premovement activity in Go trials vs. Instructed or Self-Initiated Stop trials. Determine if the stop stretch predicts the abort in advance.
  *   **AIC Prediction:** Stopping is the non-occurrence of a threshold crossing. There will be no specific "veto signal"; there will simply be a lack of the Go signal reaching the trigger point.
  *   **CCC Prediction:** Stopping is an active intentional action. There will be a distinct inhibitory neural precursor (a "veto potential") that predicts the abort above chance.
  *   **Embarrassing Result:**
      *   *For AIC:* If a specific, replicable inhibitory waveform reliably precedes self-initiated stops.
      *   *For CCC:* If stop trials are indistinguishable from Go trials until the moment of muscle silence (i.e., no precursor).
  *   **Power/Interpretability Warning:** Distinguishing "no signal" from "inhibitory signal" in surface EEG is notoriously difficult. This requires high-density recording or intracranial data to be definitive.

  **Crux 4: Scope and Generalization**
  *   **Question:** Is the mechanism isolated in the arbitrary task the same mechanism that operates when an agent weighs reasons between two outcomes they care about?
  *   **Test:** A reason-bearing version of the task (e.g., choose left for \$5, right for \$1, or choose based on moral preference).
  *   **AIC Prediction:** The mechanism is identical. Neural accumulation will still precede conscious report, even if the accumulation is biased by value. The "decision" is still settled subpersonally.
  *   **CCC Prediction:** The mechanism differs. High-stakes/reasoned tasks will show conscious report aligning with or preceding the neural commitment, as top-down deliberation overrides stochastic accumulation.
  *   **Embarrassing Result:**
      *   *For AIC:* If in high-stakes trials, W-time reliably precedes the neural commitment point.
      *   *For CCC:* If in high-stakes trials, the neural commitment still precedes W-time by the same margin as arbitrary movements.
  *   **Power/Interpretability Warning:** **Philosophical Reading Warning:** Even if the neural timing is identical, the camps may disagree on whether value-based bias counts as "conscious control." The empirical question is in reasonable shape; the philosophical reading is doing heavy lifting here.

  **Crux 5: Framing and Agency (Verbal/Ontological)**
  *   **Question:** Does the fact that the neural precursor belongs to the agent's own machinery make the claim "the brain decided before the agent" misleading?
  *   **Test:** Conceptual analysis combined with ownership attribution surveys (not empirical).
  *   **AIC Prediction:** The distinction is causal. The subpersonal machinery is the causal engine; the "agent" is the passenger. Ownership is irrelevant to the causal chain.
  *   **CCC Prediction:** The distinction is a category error. The brain *is* the agent. To say "the brain decided, not the agent" is like saying "the pitcher threw the ball, not the team."
  *   **Embarrassing Result:** N/A (Conceptual).
  *   **Power/Interpretability Warning:** **Verbal Dispute Warning:** This crux may be entirely verbal. No empirical data can settle whether "agent" refers to the whole organism or the conscious subsystem.

  ### IV. CLOSING SECTION: VERBAL VS. SUBSTANTIVE

  **1. Disambiguation of Vocabulary**
  A significant portion of the dispute is verbal, centering on the referent of the word "Decision" and "Agent."
  *   **The Verbal Dispute:** The AIC uses "Decision" to refer to *Subpersonal Commitment* (the point at which the motor system becomes irreversibly committed to a specific output). The CCC uses "Decision" to refer to *Personal Endorsement* (the conscious ratification of an impulse as one's own).
  *   **Proposed Vocabulary:**
      *   Use **Subpersonal Commitment (SPC)** for the neural threshold crossing (RP onset/peak).
      *   Use **Personal Endorsement (PE)** for the reported conscious intention (W-time).
      *   Use **Agency** only when specifying *which* level is claimed to be causal.
  *   **Restatement:**
      *   *AIC:* SPC precedes PE. SPC is sufficient for action. PE is epiphenomenal to the initiation.
      *   *CCC:* SPC precedes PE. PE is necessary for Agency. SPC without PE is mere preparation, not action.

  **2. Substantive Disagreements Surviving Clean Data**
  Even with perfect vocabulary and noise-free data, two substantive disagreements remain:
  *   **Causal Efficacy:** Does PE exert downward causal control on the motor system (CCC), or is it a readout of the SPC with no causal leverage on the initiation (AIC)?
  *   **Normative Status:** Does the presence of SPC prior to PE undermine moral responsibility (AIC), or is responsibility grounded in the capacity for PE to veto or endorse (CCC)?

  **3. Mind-Changing Results**
  To ensure this collaboration is not merely entrenched posturing, each camp identifies one result that would force a retraction of their core view.

  *   **For the Antecedent-Initiation Camp:**
      *   *Result:* In a reason-weighted task (Crux 4), if Personal Endorsement (W-time) is shown to reliably *precede* the Subpersonal Commitment (neural specificity) with a margin that exceeds measurement error and reconstruction bias.
      *   *Concession:* We would retract the claim that conscious intention is always a late index. We would accept that in deliberative contexts, consciousness can originate the specific motor command.

  *   **For the Conscious-Control Camp:**
      *   *Result:* In the Abort paradigm (Crux 3), if self-initiated stops are shown to have *no* distinct neural precursor compared to failed Go trials, and if W-time in blocked trials (Crux 2) is shown to be a post-hoc reconstruction tied to the expected movement time rather than the urge.
      *   *Concession:* We would retract the claim that conscious intention has genuine causal authority. We would accept that the experience of vetoing is itself a readout of a subpersonal failure to launch.

  **4. Final Note on Power and Interpretation**
  We acknowledge that Crux 1 (RP Indexing) and Crux 3 (Abort Mechanism) rely on EEG/ERP signatures that are currently near the limit of interpretability for single-trial causality. A null result in these tests is not reassurance; it is a limitation of the instrument. We agree that if the data from these tests remain ambiguous, the philosophical disagreement must be acknowledged as underdetermined by the current physiology, not resolved by it. We further flag that Crux 5 (Framing) is a philosophical reading doing all the work; no empirical question is in shape to resolve the ontology of the "Agent."

  ***

  **Signed,**

  _________________________
  **Representative, Antecedent-Initiation Camp**

  _________________________
  **Representative, Conscious-Control Camp**
