answer: |-
  **Project Title:** Precision Dissociation in Active Inference: A Conceptual Analysis of Sensory and Policy Weighting

  **Research Question**
  Is the precision parameter in standard free-energy accounts a unitary mechanism regulating prediction-error gain, or does it conceal a functional dissociation between sensory precision (the weighting of interoceptive prediction errors) and policy precision (the confidence in prior beliefs over action sequences)? Specifically, does accommodating the clinical dissociation observed in somatic symptom disorder and depersonalisation require revising the claim that all adaptive behaviour is unified under a single free-energy minimisation scheme?

  **Context and Existing Debates**
  Current debates surrounding the free energy principle often focus on the 'dark-room problem': why agents do not simply minimize sensory input by retreating into isolation. This is typically resolved via expected free energy, which incorporates prior preferences for novelty and information gain. However, these debates largely concern the *objective function* of the agent rather than the *parameterisation of confidence* within the inference process. While expected free energy explains *why* policies are selected, it often treats precision as a uniform variational parameter that modulates the influence of prediction errors across the board. This leaves open the possibility that the formalism collapses distinct neurocomputational processes into a single notational variable. Existing literature has not sufficiently addressed whether the precision governing sensory attenuation is structurally identical to the precision governing policy selection, nor whether their dissociation in psychopathology indicates a flaw in the unity claim of the free energy principle itself.

  **Methodology and Work Plan**
  This project employs a conceptual and formal philosophical method rather than empirical clinical study or pure computational modelling. Empirical study is unsuitable for a four-month timeline due to ethical approval requirements and the need for specialised apparatus, while computational modelling risks presupposing the very architectural assumptions this project aims to interrogate. Philosophical analysis is preferable here because it clarifies the conceptual commitments of the formalism before empirical validation is attempted.

  *Month 1: Conceptual Mapping.* I will analyse standard expositions of active inference to isolate how precision is defined across sensory and policy domains. This involves mapping the terminology used in variational Bayes against phenomenological descriptions of agency and bodily awareness in the target clinical conditions.
  *Month 2: Formal Analysis.* I will examine the mathematical structure of the update rules to determine if sensory and policy precision can be formally decoupled without violating the free energy bound. This stage involves checking whether the proposed distinction is mathematically coherent or if it introduces redundancy.
  *Month 3: Philosophical Implications.* Assuming formal coherence, I will assess the implications for the philosophy of mind. If the parameters are distinct, does this fracture the notion of a unified self-model? I will evaluate whether this requires a pluralistic account of adaptive behaviour rather than a monistic free-energy scheme.
  *Month 4: Synthesis and Drafting.* I will integrate the conceptual and formal findings into a coherent argument, drafting the final paper for the workshop.

  **Expected Outcomes and Failure Conditions**
  A successful result would be a revised generative-model architecture, described conceptually and formally, that predicts the dissociation between hyper-acute bodily awareness and impaired action policy without relying on auxiliary hypotheses. This would demonstrate that the standard collapse of precision is substantive and misleading. Conversely, the project would count as a failure if the formal analysis demonstrates that the proposed distinction collapses back into the standard precision formulation—for instance, if policy precision can be shown to be merely a function of sensory precision under specific boundary conditions. In this case, the outcome would be a robust defence of the standard model's parsimony, clarifying why the clinical dissociation must be explained by parameter values rather than structural changes.

  **Scope Assessment**
  To ensure feasibility within four months, several aspects of the broader predictive-processing literature must be bracketed. First, I will not engage with the specific neurobiological substrates of precision weighting (e.g., neuromodulatory systems), as this requires empirical expertise beyond the scope of philosophical analysis. Second, I will not propose new diagnostic criteria for somatic symptom disorder or depersonalisation; these conditions serve only as phenomenological constraints on the model. Finally, I will not produce a working computational simulation, as the goal is to establish the conceptual necessity of the distinction prior to implementation.

  Summary: This proposal contends that distinguishing sensory from policy precision reveals a substantive fragmentation in the free energy principle that necessitates revising its claim to a unified account of adaptive behaviour.
