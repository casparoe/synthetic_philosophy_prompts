answer: |-
  You have identified a precise and critical gap in the standard taxonomy of epistemic injustice. Your description does not fit neatly into Miranda Fricker's original formulation of *hermeneutical injustice*, nor does it fully align with Kristie Dotson's *contributory injustice*, though it shares DNA with both.

  There is no single, universally standardized term in the canonical literature (Fricker, Dotson, Medina) that captures this *exact* configuration of **compelled translation followed by dismissal due to translational loss**. However, in critical social epistemology and decolonial theory, this dynamic is increasingly recognized. The closest established concept is **Hermeneutical Coercion** (articulated by José Medina), often discussed alongside **Epistemic Assimilation** (in Indigenous and post-colonial studies) and **Testimonial Smothering** (Dotson).

  Below is an analysis of why existing terms fall short, a proposal for a precise term to capture this configuration, and a delineation of its boundary conditions.

  ### 1. Why Standard Taxonomies Are Insufficient

  *   **Hermeneutical Injustice (Fricker):** This requires a *gap* in the collective hermeneutical resources. In your scenario, the marginalized group *has* the resources (concepts, framework). The injustice is not that the concepts don't exist, but that the institution refuses to accept them *as* concepts.
  *   **Contributory Injustice (Dotson):** This occurs when an audience fails to cultivate the hermeneutical sensitivity required to understand a speaker's concepts. While close, Dotson's concept focuses on the audience's *refusal to learn* or *willful ignorance*. Your scenario is more aggressive: the institution does not just ignore the concepts; it **mandates a translation** into a dominant scheme that actively distorts the meaning. It is not merely a failure of uptake; it is a procedural requirement for distortion.
  *   **Epistemic Exclusion (Stauffer):** This describes the devaluation of certain ways of knowing within institutions (e.g., academia). It captures the *outcome* (exclusion) but is too broad to describe the specific *mechanism* (compelled translation and flattening).

  ### 2. Proposed Term: Hermeneutical Coercion (via Coerced Conceptual Translation)

  While José Medina uses **Hermeneutical Coercion** to describe situations where dominant groups force marginalized groups to interpret their own oppression through the oppressor's framework, your description adds a specific bureaucratic/procedural layer.

  To capture the exact configuration you described, I propose refining this to:

  **Term:** **Procedural Hermeneutical Coercion** (or simply **Hermeneutical Coercion** with the specific condition of *Mandatory Translation*).

  **Definition:**
  Procedural Hermeneutical Coercion occurs when an institutional gatekeeper possesses the power to mandate the terms of intelligibility. It is characterized by three conditions:
  1.  **Hermeneutical Competence:** The marginalized group possesses a robust, internal conceptual framework to articulate their experience/harm.
  2.  **Mandatory Translation:** The institution refuses to engage with the group's framework directly, requiring translation into a dominant conceptual scheme as a condition of legibility (e.g., funding, policy, publication).
  3.  **Structural Flattening:** The dominant scheme lacks the normative or relational distinctions necessary to convey the specific harm. The translation inevitably strips the claim of its structural specificity, rendering it "generic," "emotional," or "anecdotal," leading to dismissal.

  ### 3. Differentiation from Related Concepts

  | Concept | Core Mechanism | Who Lacks What? | Outcome |
  | :--- | :--- | :--- | :--- |
  | **Hermeneutical Injustice** (Fricker) | **Gap:** Collective resources are missing. | The *group* lacks the concepts to make sense of experience. | Confusion, isolation, inability to articulate. |
  | **Contributory Injustice** (Dotson) | **Refusal:** Audience ignores offered resources. | The *audience* lacks the willingness to learn new concepts. | Speaker is unheard; knowledge contribution blocked. |
  | **Testimonial Smothering** (Dotson) | **Self-Silencing:** Speaker truncates testimony. | The *speaker* lacks safety to speak fully. | Testimony is incomplete to ensure safety/uptake. |
  | **Procedural Hermeneutical Coercion** (Proposed) | **Distortion:** Institution mandates translation. | The *institution* lacks the concepts but holds the power. | Testimony is heard but **misrepresented** and dismissed as deficient. |

  **Key Distinction:** In *Contributory Injustice*, the speaker says, "Here are my terms," and the audience says, "No." In *Procedural Hermeneutical Coercion*, the institution says, "You may speak, but only in *our* language," knowing (or structurally ensuring) that *our* language cannot say what you need to say.

  ### 4. Boundary Cases: Coercion vs. Benign Translation

  In interdisciplinary work, translation is often necessary for mutual understanding. How do we distinguish **Hermeneutical Coercion** from **Benign Conceptual Bridging**?

  | Feature | Benign Conceptual Bridging | Procedural Hermeneutical Coercion |
  | :--- | :--- | :--- |
  | **Reciprocity** | Both parties adjust their language to meet in the middle. | Only the marginalized group is required to translate; the dominant framework remains static. |
  | **Fidelity Check** | The dominant party verifies with the group: "Does this capture your meaning?" | The dominant party evaluates the translation against *its own* standards of evidence/logic, not the group's. |
  | **Loss Acknowledgment** | Acknowledges that nuance is lost in translation and treats this as a shared problem. | Treats the loss of nuance as a **deficit in the original claim** (e.g., "This is too subjective"). |
  | **Power Dynamic** | Translation is a tool for collaboration. | Translation is a **gatekeeping mechanism** for resource allocation or legitimacy. |
  | **Outcome of Failure** | If translation fails, the process is paused or reworked. | If translation fails, the **claim is rejected**. |

  ### 5. Theoretical Lineage and Further Reading

  If you wish to ground this in existing literature for a paper or proposal, you should triangulate three sources:

  1.  **José Medina, *The Epistemology of Resistance* (2013):** He explicitly discusses **Hermeneutical Coercion** and "active ignorance," where dominant groups maintain their ignorance as a resource of power.
  2.  **Kristie Dotson, "Tracking Epistemic Violence, Tracking Practices of Silencing" (2011):** Specifically the section on **Testimonial Smothering**. Your scenario explains *why* the smothering happens (because the translation is known to be fatal to the claim).
  3.  **James C. Scott, *Seeing Like a State* (1998):** While not epistemology per se, his concept of **Legibility** describes exactly this institutional process: simplifying complex local knowledge into standardized categories so the state can manage it, inevitably destroying the functional nuance of the local knowledge.

  ### Summary
  You are describing a configuration where **legibility is weaponized**. The group is not suffering from a lack of concepts (Fricker), nor merely a lack of audience sensitivity (Dotson). They are suffering from an **institutional mandate to misrepresent themselves**.

  While **Contributory Injustice** is the closest canonical tag, **Hermeneutical Coercion** (specifically **Coerced Conceptual Translation**) is the more precise term for the *mechanism* you have identified. It highlights that the injustice lies not in the *absence* of meaning, but in the *forced distortion* of meaning required to enter the institutional sphere.
