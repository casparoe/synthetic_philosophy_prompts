prompt: |-
  A competent adult can sign an advance directive stating that, should they later lose the capacity to decide -- for example, from advanced dementia -- their life support is to be withdrawn. When that crisis arrives the patient usually can no longer confirm or withdraw the directive, yet physicians and surrogates are expected to carry it out as though it were the patient's own present decision. The practice is strikingly asymmetric: a competent person may revoke a directive at any moment, so the present self outranks the past one, but an incapacitated person may do no such thing, so the past self outranks the present one -- authority tracks competence, not time. What view of the self over time does that practice presuppose? Does it commit us to the claim that one person persists through large psychological change and that the earlier, competent self retains authority over the later, altered one? Reconstruct the implicit theory of diachronic authority the practice rests on, say which rival views of personal identity or of reasons it quietly rules out, mark where the practice is underdetermined and could be licensed by more than one theory, and describe what would have to change in how we treat advance directives if we rejected the assumption that the earlier self outranks the later one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Scenario:** A competent adult signs an advance directive (AD) to withdraw life support if they lose capacity (e.g., dementia). Later, they lose capacity. The AD is executed even though the current self cannot confirm it.
      *   **The Asymmetry:** Competent self can revoke past AD (Present > Past). Incapacitated self cannot revoke past AD (Past > Present). Authority tracks competence, not chronological time.
      *   **Key Questions to Answer:**
          1.  What view of the self over time does this practice presuppose?
          2.  Does it commit us to the claim that one person persists through psychological change and the earlier self retains authority?
          3.  Reconstruct the implicit theory of diachronic authority.
          4.  Identify rival views of personal identity/reasons that are ruled out.
          5.  Mark where the practice is underdetermined (compatible with multiple theories).
          6.  Describe what would change if we rejected the assumption that the earlier self outranks the later one.

  2.  **Initial Analysis & Philosophical Grounding:**

      *   *Personal Identity:* This touches on the Lockean psychological continuity view vs. Biological view vs. Narrative view. The "Dementia Challenge" (Rebecca Dresser, John Robertson, Jeff McMahan) is central here.
      *   *Authority/Autonomy:* Precedent autonomy vs. Current interests/well-being.
      *   *The Asymmetry:* The prompt highlights a specific tension. If the "self" changes drastically (dementia), why does the "old self" bind the "new self"?
      *   *Implicit Theory:* It seems to rely on a "Unified Agent" model where competence is the gatekeeper of authority.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the profundity of the question. It's about the metaphysics of personhood meeting bioethics. State the thesis: The practice presupposes a *Normative Continuity* view rather than a strict *Psychological Identity* view, prioritizing *Critical Interests* over *Experiential Interests*.

      *   **1. The Implicit View of the Self (Diachronic Authority):**
          *   The practice assumes *Numerical Identity* persists despite *Psychological Discontinuity*.
          *   It relies on the concept of "Precedent Autonomy."
          *   Key distinction: The "Self" is not just the current stream of consciousness but a temporally extended project.
          *   *Theory:* **The Sovereign Competent Self.** Authority is anchored to the last point of full rational agency.

      *   **2. Does it commit us to persistence through psychological change?**
          *   Yes, but with nuance. It doesn't necessarily require *strong* psychological connectedness (Parfit). It requires *biological* or *legal* continuity sufficient to assign rights/duties.
          *   It commits to the idea that the *values* of the competent self constitute the "true" interests of the being, even if the being no longer holds those values. (Dworkin's distinction between critical and experiential interests).

      *   **3. Rival Views Ruled Out:**
          *   *Psychological Reductionism (Parfit):* If identity is just degrees of connection, and connection is low (dementia), the "past self" is essentially a different person. Enforcing the AD would be like one person deciding for another.
          *   *The "New Self" View (Dresser):* The dementia patient is a new entity with new interests. Past wishes are irrelevant.
          *   *Strict Presentism:* Only current desires matter.
          *   *Well-being Prioritization:* If the current self is happy (even if demented), overriding that for a past abstract value is harmful.

      *   **4. Underdetermination (Where multiple theories fit):**
          *   *Biological View (Animalism):* The human organism persists. ADs bind the organism. This fits without needing psychological continuity.
          *   *Narrative View:* The life story must remain coherent. Ending it according to the plot drafted by the author preserves integrity, even if the character changes.
          *   *Legal/Contractual View:* It's not about metaphysics but social utility and risk management. We treat them as the same person for legal consistency.

      *   **5. What if we rejected the assumption (Earlier > Later)?**
          *   *Status Quo:* ADs are binding.
          *   *Rejection:* ADs become advisory only.
          *   *Standard of Decision:* Best Interest Standard (current well-being) replaces Substituted Judgment (past wishes).
          *   *Consequence:* Life support might be continued if the demented patient seems content, even if they previously said they wouldn't want to live that way.
          *   *Policy Change:* ADs would need renewal clauses or "ulysses contracts" with higher barriers. Surrogates would focus on current affect, not past documents.

  4.  **Refining and Polishing:**

      *   *Terminology:* Ensure terms like "Critical Interests" (Dworkin), "Psychological Continuity" (Locke/Parfit), "Precedent Autonomy" are used correctly.
      *   *Tone:* Philosophical, analytical, precise.
      *   *Addressing the Asymmetry:* Make sure to explicitly explain *why* the asymmetry exists in the implicit theory (Competence is the necessary condition for authority).
      *   *Check against Prompt:* Did I answer all parts?
          *   View of self? Yes (Normative Continuity).
          *   Commit to persistence? Yes (Numerical, not necessarily Psychological).
          *   Reconstruct theory? Yes (Sovereign Competent Self).
          *   Rival views ruled out? Yes (Reductionism, New Self).
          *   Underdetermined areas? Yes (Biological, Legal, Narrative).
          *   What changes if rejected? Yes (Best Interest Standard).

  5.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* I need to be careful not to say the practice *proves* one metaphysical view. It *presupposes* a working model.
      *   *Nuance:* The prompt asks about "authority tracks competence." I need to emphasize that competence is the *trigger* for the lock-in effect. Once competence is lost, the lock engages.
      *   *McMahan's Embodied Mind:* This is a good middle ground to mention in underdetermination.
      *   *Dworkin:* Crucial for the "Critical Interests" argument.

  6.  **Final Review:** Does the argument flow logically?
      *   Start with the core tension.
      *   Define the implicit theory.
      *   Contrast with rivals.
      *   Show flexibility (underdetermination).
      *   Show consequences of rejection.
      *   Conclude with the ethical weight.

      *(Self-Correction)*: Make sure to explicitly address the "asymmetry" point in the reconstruction of the theory. The asymmetry isn't a bug; it's a feature of the "Competence as Authority" model.

  7.  **Final Polish:** Check for clarity and readability. (Proceed to generate output based on these thoughts.)
answer: |-
  The practice of enforcing advance directives (ADs) against the apparent interests or silence of an incapacitated self rests on a specific, often unexamined, metaphysical and normative architecture. It resolves the tension between the past competent self and the present incapacitated self by prioritizing **normative agency** over **psychological continuity**.

  Here is a reconstruction of the implicit theory of diachronic authority, the rival views it excludes, the areas where it is underdetermined, and the consequences of rejecting its core assumption.

  ### 1. The Implicit Theory: Normative Continuity and Precedent Autonomy

  The practice presupposes a view of the self that distinguishes between *numerical identity* (being the same human organism/legal person) and *psychological connectedness* (sharing memories, values, and traits).

  **The Theory of the Sovereign Competent Self:**
  The implicit theory posits that moral authority is a function of **competence**, not merely existence.
  *   **The Lock-in Mechanism:** When a person is competent, they possess full moral sovereignty. They can bind their future self because they are the only entity capable of grasping the "whole life" narrative.
  *   **The Asymmetry Explained:** The asymmetry you note (Present > Past when competent; Past > Present when incapacitated) is not a contradiction in this theory; it is the defining feature. Authority requires the capacity for rational reflection.
      *   If the *current* self is competent, they hold the authority to revoke because they currently possess the requisite capacity.
      *   If the *current* self is incapacitated, they lack the capacity to hold authority. Therefore, authority defaults to the last agent who possessed it.
  *   **Critical vs. Experiential Interests:** This theory relies heavily on Ronald Dworkin's distinction. It assumes the competent self holds **critical interests** (values that make a life good objectively, e.g., dignity, independence), while the incapacitated self holds only **experiential interests** (immediate pleasure/pain). The theory presupposes that critical interests survive the loss of the capacity to understand them.

  **Does it commit us to persistence through psychological change?**
  Yes, but specifically to **numerical persistence** rather than **psychological persistence**. It commits us to the claim that the *entity* bearing the rights is the same, even if the *psychological contents* of that entity have radically shifted. It asserts that the "person" is defined by their capacity for autonomy at time *T1*, which creates obligations that bind the organism at time *T2*, regardless of the psychological rupture between *T1* and *T2*.

  ### 2. Rival Views Ruled Out

  By enforcing ADs in cases of severe dementia, the practice quietly rules out several rival metaphysical and ethical frameworks:

  *   **Psychological Reductionism (Parfitian View):** Derek Parfit argued that personal identity is not what matters; rather, *psychological connectedness* matters. If connectedness is weak (as in advanced dementia), the "past self" and "present self" are practically different persons. Enforcing the AD would, under this view, be akin to one person deciding the fate of a stranger. The practice rules this out by treating the break in psychology as morally irrelevant compared to the continuity of the organism/legal person.
  *   **The "New Self" Theory (Dresser/Robertson):** Rebecca Dresser argues that severe dementia creates a "new self" with new interests. The past self's values are no longer the patient's values. By enforcing the AD, the medical-legal system rejects the idea that the dementia patient is a new moral entity entitled to their own current preferences.
  *   **Strict Presentism/Hedonism:** This view holds that only current conscious states matter. If the demented patient is content, ending their life violates their current welfare. The practice rules this out by asserting that a past rational judgment outweighs current subjective contentment.
  *   **Epistemic Humility regarding Future Preferences:** Some argue we cannot know what we will value in a different psychological state. The practice assumes the competent self *does* know best, rejecting the idea that the transformation of self invalidates the prior epistemic position.

  ### 3. Areas of Underdetermination

  While the practice rules out the views above, it is underdetermined regarding *why* the past self binds the future one. Multiple theories can license the same practice:

  *   **Biological Animalism:** This view holds that we are essentially human organisms. The organism persists from competence to dementia. The AD binds the organism. This theory requires no psychological continuity, only biological life. It supports the practice without needing to claim the "person" (psychologically) persists.
  *   **Narrative Integrity:** On this view, a life is a story authored by the competent self. To allow the "character" (the demented self) to deviate from the plot authored by the "author" (the competent self) ruins the integrity of the work. This licenses the practice based on aesthetic/moral coherence rather than strict identity.
  *   **Legal/Contractual Fiction:** The practice might not rest on metaphysics at all, but on social utility. We treat the selves as identical to prevent abuse, ensure predictability, and respect the social institution of promising. This is a pragmatic license, not a metaphysical one.
  *   **The Embodied Mind View (McMahan):** This middle ground suggests we are essentially minds embodied in brains. If the brain retains enough function to sustain the *same* mind, even if damaged, identity persists. This is underdetermined because it is unclear exactly how much psychological loss constitutes a "new mind." The practice glosses over this threshold.

  ### 4. Consequences of Rejecting the Assumption

  If we rejected the assumption that the earlier self outranks the later one (i.e., if we adopted the view that the incapacitated self is a distinct moral entity or that current well-being trumps precedent autonomy), the treatment of advance directives would change radically:

  1.  **From Substituted Judgment to Best Interest:**
      *   *Current:* Surrogates use "Substituted Judgment" (What would the patient have wanted?).
      *   *Change:* Surrogates would use a strict "Best Interest Standard" (What is best for the being currently in front of us?). If the demented patient appears content and feels no suffering, life support would likely continue, regardless of the AD.

  2.  **ADs Become Advisory Only:**
      *   Advance directives would lose their binding legal force. They would serve as evidence of what the family *might* consider, but could be overridden by the current apparent welfare of the patient.

  3.  **The "Ulysses Contract" Problem:**
      *   We would need to distinguish between "prospective autonomy" (ADs) and "contemporaneous autonomy." If the past self cannot bind the future self, then Ulysses contracts (binding oneself against future relapse) become morally impermissible. This would impact not just end-of-life care, but psychiatry (e.g., refusing medication during a manic phase despite a prior directive).

  4.  **Redefinition of Harm:**
      *   Currently, keeping a patient alive against their AD is viewed as a harm (violation of autonomy).
      *   Under the rejection view, withdrawing life support from a contented demented patient based on a past document would be viewed as the harm (killing a being that wishes to live).

  5.  **Requirement for Re-affirmation:**
      *   Policy might shift to require periodic reaffirmation of directives while capacity remains high, or the appointment of a proxy with the specific power to interpret current welfare over past wishes.

  ### Summary

  The practice of enforcing advance directives presupposes a **Normative Continuity** view of the self. It asserts that the capacity for autonomy creates a moral tether that survives the disintegration of the psyche. It commits us to the persistence of the *moral agent* across psychological rupture, prioritizing **critical interests** (dignity, life-plan) over **experiential interests** (current comfort).

  It rules out **Psychological Reductionism** and the **New Self** theory, which would view the demented patient as a different person. However, it is compatible with **Biological**, **Narrative**, or **Legal** theories of identity. Rejecting the assumption that the past self outranks the present one would collapse the structure of precedent autonomy, shifting medical ethics from respecting *past choices* to maximizing *current welfare*, effectively rendering advance directives non-binding suggestions.
