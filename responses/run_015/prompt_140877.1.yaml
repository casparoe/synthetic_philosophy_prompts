answer: |-
  You have run into a genuine and well-documented tension that sits at the boundary of statistics, decision theory, and epistemology. You are correct that "verisimilitude" is the wrong tool (that is about truth-likeness of theories), and "scoring rule" is the mechanism, not the dependence itself.

  Here are the terms and distinctions you are looking for, explained without requiring library access.

  ### 1. The Name of the Dependence: **Elicitability**

  The specific phenomenon you described—where changing the scoring metric changes which "state of mind" (mean, median, or mode) is the optimal one to report—is formally known as **Elicitability**.

  A statistical functional (like the mean, the median, or the mode) is said to be **elicitable** if there exists a scoring rule (a loss function) such that reporting that functional minimizes the expected score.
  *   **Squared error** elicits the **Mean**.
  *   **Absolute error** elicits the **Median**.
  *   **0-1 loss** (hit or miss) elicits the **Mode** (the most likely bucket).

  Your observation that "change how much you care about being nearly right, and you change which state of mind counts as the accurate one" is precisely the definition of how elicitability works. There is no single "true" summary of a distribution; there is only the summary that is optimal *relative to a chosen loss function*.

  In the philosophical literature surrounding your reading group (often called **Accuracy-First Epistemology** or **Epistemic Utility Theory**), this dependence is often discussed under the label **Score-Relativity of Accuracy**. The claim you are testing is whether there is a **Privileged Scoring Rule** (usually the Brier Score or the Log Score) that defines accuracy *independently* of pragmatic costs. Your work suggests there is not.

  ### 2. One Phenomenon or Two?

  You asked whether you have described one phenomenon or two:
  1.  Metrics rewarding different states of mind (Mean vs. Median).
  2.  Metrics disagreeing on which model is better on the same data.

  These are **the same phenomenon** viewed from two different angles.

  *   **Angle 1 (The Target):** If Metric A optimizes for the Mean and Metric B optimizes for the Mode, they are asking for different "mental states."
  *   **Angle 2 (The Ranking):** Because they are asking for different mental states, they *must* disagree on rankings whenever two models differ in those states.

  In your example, Model A was "sharper" (higher peak on the truth) but "miscalibrated" in the tails (mass on distant buckets). Model B was "calibrated" in the tails (mass on adjacent buckets) but less sharp.
  *   The metric that looks only at the hit (Log Score or 0-1 loss) prefers **Sharpness**.
  *   The metric that cares about distance (like your near-miss fix) prefers **Calibration/Spread**.

  You can tell them apart in a new case by asking: **Does the metric penalize distance?** If a metric treats all errors as equal (a miss is a miss), it targets the **Mode**. If it penalizes distance linearly, it targets the **Median**. If it penalizes distance quadratically, it targets the **Mean**. If two metrics target different functionals, they will diverge in their rankings.

  ### 3. The Statistician's Suggestion: **The Ranked Probability Score**

  Your colleague's suggestion ("apply the shape-based metric to every at-least-k version... and add the results up") is not double-counting. It has a specific name: the **Ranked Probability Score (RPS)** (or its continuous cousin, the **Continuous Ranked Probability Score, CRPS**).

  Here is why it works and why it isn't double-counting:
  In logistics, "delay > 3 days" is a different event than "delay > 5 days," but they are logically connected. If you are late by 6 days, you were *also* late by 3 days.
  *   Standard metrics treat the buckets as independent categories (like "Red" vs. "Blue").
  *   The RPS treats the buckets as a **cumulative distribution**. It asks: "How accurate were you about the probability of being late by *at least* 1 day? How accurate about *at least* 2 days? At least 3?"

  It sums the Brier Scores for all these cumulative thresholds. This creates a **Proper Scoring Rule** that respects the *order* of the outcomes. It gives you "near miss" credit (because if you predicted 3-5 days and it was 6-10, your cumulative probabilities for "at least 1 day" and "at least 3 days" were likely still good) without making the score gameable. It is the standard solution for ordered categorical forecasting.

  ### 4. Is This an Objection to the Philosophical Claim?

  You asked whether this finding is an objection to the claim that "accuracy is the single epistemic good with a privileged measure of it."

  **Yes, it is a significant objection,** specifically to a strong version of that claim known as **Veritism**.

  *   **The Claim (Veritism):** There is a single, context-independent measure of epistemic accuracy (usually identified with the Brier Score or Log Score). Being "accurate" means minimizing this specific score.
  *   **Your Finding:** The "best" forecast depends on the cost of errors (the loss function). In logistics, being 10 days late is worse than being 1 day late. A metric that treats them equally (like simple classification accuracy) fails to capture the *value* of the accuracy.

  **The Nuance:**
  Defenders of Veritism (like philosopher Jim Joyce) argue that **Epistemic Utility** (accuracy) should be separated from **Pragmatic Utility** (costs). They argue there is a "purely epistemic" scoring rule (usually Log Score or Brier) that measures how close your belief is to the truth, regardless of what that truth *costs* you.

  However, your work highlights the **Measurement Problem** for Veritism:
  1.  If "accuracy" is defined by a scoring rule...
  2.  And different scoring rules reward different belief states (Mean vs. Median)...
  3.  Then "accuracy" is not a single thing. It is a family of measures.

  To save the claim that accuracy is the *single* epistemic good, one must argue that one specific scoring rule (e.g., the Log Score) is the **Privileged Measure** of truth-likeness, and all others are merely "pragmatic distortions."

  Your experience suggests that in applied settings, there is no "pragmatic distortion." There is only **Task-Relative Accuracy**. The "accurate belief" for a logistics planner (who cares about cumulative delay) is mathematically different from the "accurate belief" for a classifier (who cares only about the exact bucket).

  ### Summary for your Reading Group

  *   **The Technical Term:** **Elicitability**. (This explains why different scores target different mental states).
  *   **The Solution to Near-Misses:** **Ranked Probability Score (RPS)**. (This is the proper, non-gameable way to score ordered buckets).
  *   **The Philosophical Implication:** It challenges **Veritism**. It suggests that **Accuracy is Score-Relative**. Unless one can prove a specific scoring rule is the "One True Measure" of truth (independent of cost), accuracy cannot be a single, monolithic epistemic good. It is instead a **Utility-Relative** property.

  You have effectively rediscovered the distinction between **estimating the truth** (epistemic) and **minimizing loss** (decision-theoretic), and found that in forecasting, you cannot do the former without implicitly committing to the latter.
