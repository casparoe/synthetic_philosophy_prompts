answer: |-
  To the Research Program Officer:

  The proposed three-year program must treat Coherent Extrapolated Volition (CEV) not as an engineering challenge but as a problem in logical topology and normative metaphysics. Given the constraint against empirical elicitation or AI training, the team must resolve the structural definitions of "volition" before any aggregation mechanism can be safely designed. The central bottleneck is not knowing what people want, but defining what constitutes a coherent "want" under idealization. Therefore, the research agenda must prioritize the logical ordering of coherence conditions: first within the individual (Pairwise), then across the population (Collective), and finally through compression mechanisms (Hierarchical).

  **Priority 1: The Existence of Individual Fixed-Points (Pairwise Coherence)**
  The first priority is to determine whether an "idealized self" is a stable logical object. CEV assumes that if we knew more and thought faster, our preferences would converge to a fixed point. However, this invokes a pairwise tension between the current self and the extrapolated self. If the extrapolation process is dynamic and never settles, or if the idealized self rejects the extrapolation process itself, the unit of aggregation is undefined.
  *Upstream Status:* This is the absolute prerequisite. If individual volitions cannot be formally modeled as stable entities, collective aggregation is mathematically undefined.
  *Tractability:* High for logicians. This requires fixed-point theorems in preference logic, not data.
  *Revision Trigger:* A formal proof demonstrating that reflective equilibrium leads to infinite regress or cyclic preference ordering under plausible idealization conditions would force a pivot from static CEV to dynamic process theories.

  **Priority 2: The Compossibility of Idealized Volitions (Collective Coherence)**
  Assuming stable individual volitions exist, the second priority is determining whether they can be aggregated without contradiction. This addresses the collective tension. Idealized agents may hold mutually exclusive values (e.g., conflicting conceptions of the good). Standard social choice impossibility theorems suggest that aggregating these without dictatorship or loss of information may be impossible.
  *Upstream Status:* This blocks the design of any decision procedure. Until we know if a collective utility function exists, we cannot build the aggregation layer.
  *Tractability:* High for formal theorists using social choice theory and modal logic.
  *Revision Trigger:* An impossibility proof specific to *idealized* preferences (distinct from standard Arrowian constraints) would necessitate moving to Priority 3 immediately.

  **Priority 3: The Legitimacy of Representative Compression (Hierarchical Coherence)**
  If direct collective aggregation is intractable, the third priority is evaluating hierarchical formulations. This involves determining if a subset of representative idealized agents can legitimately decide for the whole without violating the CEV condition. This addresses the hierarchical tension.
  *Upstream Status:* This is a contingency plan for Priority 2. It blocks scalability arguments but is secondary to the existence of the collective function.
  *Tractability:* Moderate. Requires political philosophy combined with information theory to measure "representation loss."
  *Revision Trigger:* A demonstration that hierarchical compression inevitably distorts volition beyond a tolerable normative threshold would deprioritize this approach in favor of approximating collective solutions.

  **Resource Allocation**
  The team of six should be split evenly: three philosophers and three formal theorists. The problems are hybrid; philosophers are needed to define the normative boundaries of "idealization" and "identity," while formal theorists are required to translate these definitions into provable models. An imbalance would risk producing either empty formalisms or unrigorous speculation.

  **Conclusion**
  This agenda defends a "logic-first" approach. By resolving the Pairwise stability before attempting Collective aggregation, and treating Hierarchical structures as a fallback rather than a default, the program avoids building complex systems on undefined foundations. The verdict is to sequence the tension resolution: stabilize the unit, solve the sum, then optimize the structure.

