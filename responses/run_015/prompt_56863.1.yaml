prompt: |-
  I teach a graduate seminar on the ethics of the far future and am considering setting the following essay question; before I do, I want to know whether it admits of a decisive answer, so please write the essay itself, as a strong model answer would be written.

  Sidgwick, and after him Parfit, hold that pure time preference is indefensible: the mere fact that a harm or benefit falls later rather than sooner cannot itself count for or against it, so an impartial evaluator should apply no discount on account of date alone. Against this stands a classical result in intertemporal choice, due to Koopmans: over an unbounded future, any preference ordering that is stationary, continuous, and sensitive to what happens in particular periods must be representable as a discounted sum with a discount factor strictly below one. An undiscounted ordering, on the usual gloss, can be stationary and continuous only at the cost of going blind to finite differences — precisely the finite catastrophes, and the finite centuries of suffering, that the refusal to discount was meant to take seriously.

  Does this rehabilitate pure time preference, or is there a way out? Examine the available exits — accepting a positive pure discount; surrendering stationarity in favour of, say, weights that decline with distance without ever becoming stationary; refusing to require a complete ordering over infinite streams at all — and argue which, if any, escapes Parfit's objection. Note that a declining schedule keyed to temporal distance looks like pure time preference under another name; say whether you agree, and whether keying the schedule to something other than date (expected future wellbeing, for instance) changes the situation rather than merely disguising it.

  I want a committed answer: a definite verdict on whether the undiscounting position can be saved, and on which assumption must be given up if it cannot, with reasons for that choice. Do not end by recapping the options and leaving me to pick.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Analyze the Request:**
      *   **Task:** Write a model essay answer to a specific graduate seminar question.
      *   **Topic:** The ethics of the far future, specifically the tension between Sidgwick/Parfit's rejection of pure time preference (PTP) and Koopmans' theorem on intertemporal choice (which suggests undiscounted utilitarianism over an infinite horizon violates plausible axioms like stationarity and sensitivity).
      *   **Key Question:** Does Koopmans' result rehabilitate PTP, or is there a way out?
      *   **Requirements:**
          *   Examine available exits (accepting discount, surrendering stationarity, refusing complete ordering).
          *   Address whether declining schedules are just PTP in disguise.
          *   Address whether keying schedules to something other than date changes things.
          *   **Crucial Constraint:** Provide a *committed answer* with a *definite verdict*. Do not hedge or just list options. Pick a side and argue for it.
          *   **Tone:** Graduate seminar level (philosophically rigorous, precise, engaging with the literature).

  2.  **Deconstruct the Philosophical Problem:**
      *   **The Parfit/Sidgwick View:** Time is morally neutral. A unit of welfare at $t+100$ is equal to a unit at $t+1$. Discounting implies future people matter less simply because they exist later, which is arbitrary discrimination (like discounting based on distance in space).
      *   **The Koopmans Challenge:** Tjalling Koopmans (1960) proved that if you want an ordering over infinite utility streams that is (1) Complete/Transitive, (2) Continuous, (3) Sensitive (Pareto), and (4) Stationary (the ranking of two streams shouldn't change if you shift them both one period into the future), you *must* use exponential discounting ($\delta < 1$).
      *   **The Conflict:** If you refuse discounting ($\delta = 1$), you seem to violate Sensitivity (you can't distinguish between streams that differ only in finite periods) or Stationarity. This is the "finite blindness" problem. If you care about *all* future generations equally, the sum might diverge, or you lose the ability to rank policies that affect only the near term vs. far term in specific ways.
      *   **The Goal:** Determine if the undiscounting position is salvageable.

  3.  **Evaluate the "Exits":**
      *   *Exit 1: Accept Positive Pure Discount.*
          *   Pros: Satisfies Koopmans' axioms. Mathematically tractable.
          *   Cons: Violates Parfit's impartiality. Implies future lives are intrinsically less valuable. Ethically repugnant for long-term issues (climate change, nuclear waste).
          *   Verdict: Mathematically convenient, ethically bankrupt.
      *   *Exit 2: Surrender Stationarity (Declining Discount Rates).*
          *   Pros: Allows high weight on near future (addressing uncertainty/impatience) but non-zero weight on far future. Avoids the "tyranny of the present."
          *   Cons: Koopmans says non-stationary. Is this just PTP in disguise? If the schedule is keyed to *date*, yes. If keyed to *generational distance* or *uncertainty*, maybe not.
          *   Verdict: Promising, but needs careful justification to avoid being arbitrary.
      *   *Exit 3: Refuse Complete Ordering (Incomplete Preferences/Catch-up Criteria).*
          *   Pros: Keeps impartiality ($\delta = 1$). Avoids divergent sums.
          *   Cons: Decision paralysis. Can't rank many policies.
          *   Verdict: Theoretically pure but practically useless for policy.
      *   *Exit 4: Keying to Something Other Than Date.*
          *   Idea: Discount based on probability of existence or epistemic uncertainty, not time itself.
          *   Verdict: This is the strongest philosophical move. It preserves impartiality regarding *value* while acknowledging uncertainty regarding *realization*.

  4.  **Formulate the Committed Verdict:**
      *   I need to pick a side. The prompt asks if the undiscounting position can be saved.
      *   *Option A:* No, Koopmans wins. We must discount. (Too cynical, ignores the ethical force of Parfit).
      *   *Option B:* Yes, by dropping Stationarity. (Standard economic response, e.g., Weitzman).
      *   *Option C:* Yes, by reinterpreting the discount factor as probability/uncertainty rather than pure time preference. (This aligns best with Parfit's spirit while respecting the mathematical constraints).
      *   *Decision:* I will argue that **Koopmans does not rehabilitate pure time preference**, but it does force us to abandon the requirement of a *stationary* ordering over *certain* infinite streams. The way out is to reject Stationarity *not* by accepting arbitrary time discrimination, but by recognizing that the "discount" in practical decision-making reflects epistemic uncertainty and existential risk, not moral worth. However, for the *ethical evaluation* itself (the axiology), we must maintain $\delta = 1$ and accept that our ordering will be incomplete or non-stationary.
      *   *Refinement for "Committed Answer":* I need to be sharper. I will argue that **the undiscounting position must be saved, even at the cost of Stationarity.** Koopmans' theorem reveals a limitation in our formal tools, not a flaw in impartiality. The "finite blindness" objection is serious but can be handled by overtaking criteria (catch-up) rather than discounting. Therefore, **Stationarity is the axiom to sacrifice.** Pure time preference remains indefensible.

  5.  **Drafting the Essay - Section by Section:**

      *   **Introduction:** State the conflict clearly. Parfit's impartiality vs. Koopmans' impossibility theorem. State the thesis: Koopmans does not rehabilitate PTP; Stationarity must be jettisoned to preserve moral truth.
      *   **The Koopmans Trap:** Explain the theorem simply but accurately. If $\delta=1$, and you want Stationarity + Continuity, you lose Sensitivity (can't distinguish finite changes). This is the "finite blindness" problem.
      *   **Evaluating the Exits:**
          *   *Accepting PTP:* Ethically untenable. Discrimination by date is like discrimination by race or distance.
          *   *Incomplete Orderings:* Mathematically honest (overtaking criteria), but paralyzing.
          *   *Dropping Stationarity:* This is the viable path.
      *   **The "Disguise" Objection:** Is a declining schedule just PTP? If keyed to date, yes. If keyed to *generational contingency* or *uncertainty*, no. Distinguish *axiological* discounting (value) from *practical* discounting (probability).
      *   **The Verdict:** We must accept non-stationary weightings. Why? Because the future is not a static container. The "date" itself carries information about uncertainty and causal connection. However, strictly speaking, *pure* time preference (value diminishing solely due to temporal location) is false.
      *   **Conclusion:** Reiterate the commitment. Save impartiality, drop stationarity.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is dropping Stationarity enough? Koopmans says without discounting, you lose sensitivity to finite differences *if* you keep Stationarity. If you drop Stationarity, can you keep Sensitivity and $\delta=1$?
      *   *Correction:* Yes, using criteria like "catch-up" or "overtaking" (von Weizsäcker). These allow $\delta=1$ but violate Stationarity.
      *   *Critique:* The prompt asks about keying schedules to something other than date (e.g., expected wellbeing).
      *   *Response:* I need to address this. If I discount based on the probability that the beneficiaries exist, that is not *pure* time preference. That is expected value calculation. This is the crucial distinction.
      *   *Final Polish:* Ensure the tone is authoritative. No "on the one hand, on the other." Take a stand. "I argue that..."

  7.  **Finalizing the Thesis:**
      *   Koopmans' result is mathematically sound but ethically misinterpreted.
      *   It does not prove PTP is right; it proves that *Stationarity* is incompatible with *Impartiality* over infinite horizons.
      *   Since Impartiality is a moral requirement and Stationarity is a structural convenience, Stationarity must go.
      *   Therefore, the undiscounting position is saved, but we must accept non-stationary evaluation criteria (like overtaking) or reinterpret discounting as risk/uncertainty rather than time preference.

  8.  **Writing the Essay:** (Focusing on clarity, philosophical precision, and adhering to the "committed answer" constraint). *Self-correction: Make sure I explicitly answer the "declining schedule" and "keying to something other than date" parts of the prompt.*

      *   *Plan:*
          1.  Intro: The clash. Thesis: Stationarity must be sacrificed.
          2.  Koopmans' Challenge explained.
          3.  Why PTP is still wrong (Parfit's argument holds).
          4.  The solution: Drop Stationarity. Use overtaking criteria.
          5.  Address the "disguise" objection (declining rates).
          6.  Address "keying to other variables" (uncertainty vs. time).
          7.  Conclusion: Definitive verdict.

  9.  **Final Review against constraints:**
      *   Committed answer? Yes.
      *   Definite verdict? Yes (Drop Stationarity).
      *   No recap ending? Yes.
      *   Graduate level? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  **Title:** The Tyranny of Stationarity: Why Koopmans Does Not Vindicate Pure Time Preference

  The tension between the ethical demand for temporal impartiality and the mathematical constraints of intertemporal choice constitutes one of the most vexing problems in long-termist ethics. Sidgwick and Parfit argue that the date of a benefit is morally arbitrary; an impartial agent should not discount welfare simply because it occurs later. Yet Koopmans' theorem suggests that maintaining this impartiality over an infinite horizon forces us into "finite blindness," rendering us unable to rank streams that differ only in finite periods. The question is whether this mathematical result rehabilitates pure time preference (PTP) or merely exposes the limitations of the axioms we have imposed on our ethical models.

  I argue decisively that Koopmans' result does **not** rehabilitate pure time preference. The theorem demonstrates not that impartiality is false, but that the axiom of **Stationarity** is incompatible with impartiality over infinite streams. To save the core moral insight of Sidgwick and Parfit, we must surrender Stationarity. We can preserve sensitivity to finite differences and maintain a discount factor of one ($\delta = 1$) by adopting non-stationary evaluation criteria, such as overtaking or catch-up principles. Furthermore, while declining discount schedules keyed to temporal distance risk disguising PTP, keying weights to epistemic uncertainty or existential risk is ethically distinct and permissible. The verdict is that the undiscounting position is salvageable, but only by accepting that our ethical ordering over infinite futures cannot be stationary.

  To see why Stationarity must be the casualty, we must first understand the force of Koopmans' challenge. Koopmans showed that for preference orderings over infinite utility streams to be complete, continuous, sensitive (Pareto), and stationary, they must be representable as a discounted sum with $\delta < 1$. If we insist on $\delta = 1$ (no pure time preference) while retaining Stationarity and Continuity, we lose Sensitivity. This is the "finite blindness" problem: in an infinite stream, adding a finite amount of suffering to the first thousand years becomes mathematically invisible against the backdrop of an infinite future of constant welfare. If we cannot distinguish between a future with a millennium of torture and one without, our ethical framework is useless.

  The classical economic response is to accept the theorem's conclusion: set $\delta < 1$. This restores mathematical tractability and sensitivity. However, this comes at an intolerable ethical cost. Parfit's objection to PTP is not merely intuitive; it is grounded in the principle of neutrality between persons. To discount the welfare of future people simply because they are temporally distant is to discriminate against them based on a coordinate over which they have no control. It implies that a life lived in 2100 is intrinsically less valuable than a life lived in 2024. No serious moral theory can accommodate this without collapsing into a form of temporal racism. Therefore, accepting a positive pure discount rate to satisfy Koopmans' axioms is a category error: it solves a mathematical problem by violating a moral constraint. We cannot trade moral truth for mathematical convenience.

  If we cannot accept PTP, and we cannot accept finite blindness, we must reject one of Koopmans' other axioms. Continuity is difficult to abandon without making preferences erratic. Completeness is a candidate, but adopting incomplete orderings (where some futures are simply incomparable) leads to decision paralysis in policy contexts. The most robust exit is to reject **Stationarity**.

  Stationarity requires that the ranking of two streams remains unchanged if both are shifted one period into the future. In finite contexts, this is plausible. In infinite contexts, however, Stationarity privileges the structure of the timeline over the content of the welfare. By dropping Stationarity, we can employ "overtaking criteria" (such as those proposed by von Weizsäcker or Gale). Under an overtaking criterion, stream A is better than stream B if, after some finite time $T$, the cumulative welfare of A exceeds B and stays exceeded. This allows $\delta = 1$, preserving impartiality. It also restores sensitivity to finite differences (a catastrophe in the near term delays the "overtaking" point). Crucially, it violates Stationarity: shifting the streams changes the cumulative sums relative to the present, altering the ranking.

  Critics might object that abandoning Stationarity merely hides PTP behind a complex mathematical curtain. If we use a declining discount schedule—weighting the near future more heavily than the far future, but never reaching zero—is this not PTP under another name? If the schedule is keyed strictly to **temporal date**, then yes, it remains ethically suspect. A hyperbolic discount function still implies that the *time itself* diminishes value, which violates Parfit's impartiality.

  However, the situation changes if we key the schedule to something other than date. The prompt suggests "expected future wellbeing," but a more precise adjustment is **epistemic uncertainty** or **existential risk**. We are less certain about the consequences of our actions in 2100 than in 2024. We are also less certain that there will be anyone in 2100 to receive benefits. Discounting based on the probability of the beneficiary's existence or the reliability of the causal chain is not pure time preference; it is expected value calculation.

  For example, if there is a 1% annual risk of human extinction, the expected value of future welfare naturally declines geometrically. This looks like discounting, but the $\delta$ here represents probability ($p$), not time preference ($\rho$). The moral value of the welfare, *conditional on it existing*, remains undiscounted. This distinction is vital. Koopmans' theorem applies to utility streams assumed to be certain. Once we introduce uncertainty, the axioms shift. We can maintain impartiality regarding *actual* welfare while applying discount-like weights to *expected* welfare due to contingency.

  Therefore, the "disguise" objection fails if we are precise about the justification for the weights. A declining schedule based on decreasing marginal probability of realization is ethically distinct from a schedule based on the mere passage of time. The former respects the equal moral worth of all potential people; the latter denies it.

  This leads to the definitive verdict. Koopmans' theorem is a powerful constraint on *modeling*, but it is not a constraint on *morality*. It proves that we cannot have it all: we cannot have a stationary, continuous, sensitive, and impartial ordering over infinite streams. Since Impartiality (no PTP) and Sensitivity (no finite blindness) are moral requirements, and Stationarity is merely a structural convenience for dynamic consistency, **Stationarity must be given up.**

  We must accept that our ethical evaluation of the far future is non-stationary. The present moment has a unique epistemic and causal relationship to the future that the future does not have to itself. This justifies non-stationary weights (like overtaking criteria or risk-adjusted expectations) without conceding that future people matter less. To accept PTP to satisfy Koopmans is to allow mathematics to dictate ethics. To drop Stationarity is to recognize that the infinite future breaks the symmetries of finite choice.

  In conclusion, the undiscounting position is saved, but it requires a more sophisticated formal apparatus than standard discounted utilitarianism. We must reject the axiom of Stationarity. We must distinguish between discounting for time (impermissible) and discounting for uncertainty (mandatory). By doing so, we avoid the finite blindness that plagues naive impartiality without succumbing to the moral arbitrariness of pure time preference. The far future matters just as much as the near future, but our ability to rank it requires tools that acknowledge our position within time, not tools that devalue time itself.
