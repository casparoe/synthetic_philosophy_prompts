answer: |-
  ### Specifications for Uncertain Evidence Updating

  The following desiderata define adequacy for a bounded agent processing uncertain, retractable, and nested evidence. They distinguish genuine functional needs from theoretical prejudices.

  | # | Requirement | Case & Motivation | Status | Rules Out |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | **Bayesian Limit** | Reduces to ordinary conditionalization when evidence reliability is 1.0. Ensures consistency with established certainty-based theory. | Non-negotiable | Rules that treat uncertain evidence as fundamentally distinct from hard evidence. |
  | 2 | **Identity (No-Op)** | If input probabilities match current credences, the distribution remains unchanged. Prevents unnecessary computation and drift. | Non-negotiable | Rules that induce change merely due to the act of updating. |
  | 3 | **Continuity** | Small errors in estimating input reliability (Case 1) produce small changes in output. Ensures robustness against sensor noise. | Non-negotiable | Discontinuous switching rules or threshold-based updates. |
  | 4 | **Partition Invariance** | Results must not depend on how finely the evidence space is carved (Case 1). Prevents manipulation via granularity. | Non-negotiable | **Jeffrey Conditionalization** (unless rigidity holds on all refinements). |
  | 5 | **Input Coherence** | Inputs must satisfy logical constraints (e.g., probabilities sum to 1, intervals valid). Prevents garbage-in-garbage-out. | Non-negotiable | Any rule accepting logically impossible constraints. |
  | 6 | **Idempotence** | Receiving the identical evidence item twice yields the same result as receiving it once. Prevents double-counting (Case 1). | Non-negotiable | Simple multiplication rules that do not track prior exposure. |
  | 7 | **Reversibility** | If a source is debunked (Case 4), the agent can restore the prior state. Essential for clinical safety and error correction. | Non-negotiable | Standard Bayesian updating without stored likelihoods/history. |
  | 8 | **Order Independence** | Sequence of updates yields same final state regardless of order. Desirable for system stability across parallel streams. | **Camp Preference** (BN Engineers) | Most uncertain update rules (including Jeffrey) unless evidence is independent. |
  | 9 | **Second-Order Handling** | Can update on uncertainty about past evidence competence (Case 2). Required for meta-cognitive reliability tracking. | Preference (Epistemologists) | Rules that only accept first-order probability constraints. |
  | 10 | **Constraint Flexibility** | Accepts intervals or expected values, not just point probabilities (Case 3). Accommodates imprecise sensor data. | Preference (Imprecise Probabilists) | Rules requiring exact probability assignments (e.g., standard Jeffrey). |

  ### Conflict Analysis

  A genuine impossibility result looms over **Order Independence (8)** given the generality of Cases 1–4. For uncertain evidence, order independence generally holds only if evidence items are probabilistically independent or if the update rule preserves specific likelihood ratios that commute. In a factored system where evidence items may correlate across variables, demanding strict order independence conflicts with **Reversibility (7)** and **Partition Invariance (4)** unless the agent maintains a full history of likelihood functions rather than just the current credence function.

  I recommend weakening **Order Independence** to *Order Independence for Independent Evidence*. Maintaining the strong version forces the agent to ignore correlations between evidence streams, violating accuracy. The cost is that the system must track evidence dependencies or sequence information, increasing computational overhead. This concession preserves **Reversibility** and **Partition Invariance**, which are more critical for correctness and safety in a clinical context.

  ### Rule Scoring

  **Ordinary Conditionalization on Report:** This treats "Source says $p$" as a hard event $S$. It fails the **Bayesian Limit** (if source reliability < 1, it over-updates) and **Constraint Flexibility** (cannot handle intervals). It struggles with **Reversibility** unless $\neg S$ is observable, which is rarely the case for debunked reliability. It is too rigid for uncertain evidence.

  **Jeffrey-Style Probability Kinematics:** This satisfies the **Bayesian Limit** and **Continuity**. However, it famously fails **Partition Invariance** (Diaconis & Zabell), violating Requirement 4 unless rigidity holds across all refinements. It also fails **Reversibility** (likelihood information is lost in the shift) and **Constraint Flexibility** (requires exact partition probabilities). It is theoretically elegant but practically fragile for this specification.

  **Constraint-Based (Minimally Informative/MEP):** This selects the distribution minimizing information gain subject to constraints. It excels at **Constraint Flexibility** (handles intervals) and **Input Coherence**. It satisfies the **Bayesian Limit**. However, it typically fails **Reversibility** (the prior is overwritten) and struggles with **Idempotence** unless constraints are explicitly tagged to sources. It is robust for Case 3 but weak on Case 4.

  **Likelihood-Ratio / Virtual Evidence:** Used in graphical models, this treats evidence as likelihood functions on variables. It satisfies **Reversibility** (multipliers can be divided out) and **Bayesian Limit**. It handles **Idempotence** well if sources are tracked. However, it struggles with **Constraint Flexibility** (intervals must be converted to likelihoods) and **Partition Invariance** depends on the network structure. It is the strongest candidate for Case 1 and 4, provided imprecision can be parameterized.

  Verdict: Partition Invariance
