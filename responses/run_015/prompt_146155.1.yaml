  ### Metaethical Sorting Instrument: Logical Space & Decision Tree

  To ensure that no answer renders a subsequent question logically redundant (specifically, to ensure the question regarding truth-aptness applies meaningfully to all respondents), the three commitments provided in the design brief have been reordered. The tree below begins with the metaphysical grounding of moral claims, proceeds to the semantic nature of disagreement, and concludes with the epistemology of progress.

  #### I. The Branching Questions

  **Step 1: The Ground of Correctness**
  *Originally the second commitment.*
  "When a moral judgment is correct, what makes it so?"
  *   **A.** It corresponds to **natural properties** (e.g., well-being, social cohesion) discoverable by science.
  *   **B.** It corresponds to **irreducibly normative properties** (e.g., objective value, duty) distinct from natural facts.
  *   **C.** It is determined by an **idealized response condition** (e.g., what an agent would desire or agree to under full information).

  **Step 2: The Nature of Disagreement**
  *Originally the first commitment.*
  "When two people fundamentally disagree about a moral issue, what is happening?"
  *   **A.** They hold contradictory beliefs about **what is the case** (Cognitive).
  *   **B.** They have conflicting plans, attitudes, or commitments that need not involve contradiction (Practical).

  **Step 3: The Intelligibility of Progress**
  *Originally the third commitment.*
  "How should we understand the idea of 'moral progress'?"
  *   **A.** It is **convergence** on independent truths that existed prior to our judgment.
  *   **B.** It is growing **coherence** among our attitudes, plans, or social frameworks.
  *   **C.** It is a **category mistake**; the concept applies only to instrumental efficiency, not morality itself.

  ***

  #### II. The Decision Tree & Position Mapping

  Below are the terminal leaves generated by the combinations of answers. Each leaf identifies the corresponding metaethical position, notes a specific philosophical difficulty regarding cross-cultural disagreement or moral authority, and flags any ambiguities.

  **Path 1: Natural Properties + Cognitive + Convergence**
  *   **Position:** **Cornell-Style Naturalist Realism**
  *   **Awkward Commitment:** This view struggles to explain why rational agents with full access to the same natural facts (e.g., pain statistics) persistently disagree on moral conclusions across cultures.
  *   **Ambiguity:** None.

  **Path 2: Natural Properties + Cognitive + Category Mistake**
  *   **Position:** **Error Theory** (Naturalist Target)
  *   **Awkward Commitment:** It must explain why morality retains a sense of practical authority over agents even after they accept that all moral claims are systematically false.
  *   **Ambiguity:** None.

  **Path 3: Natural Properties + Practical + [Any]**
  *   **Position:** **Unnamed / Unstable**
  *   **Diagnosis:** This combination is **unstable**. If correctness is fixed by natural properties, disagreement regarding those properties is typically cognitive. A practical stance grounded solely in natural properties tends to collapse into Cornell Realism (if the properties motivate belief) or Expressivism (if the properties are irrelevant).
  *   **Awkward Commitment:** N/A (Unoccupied).

  **Path 4: Normative Properties + Cognitive + Convergence**
  *   **Position:** **Non-Naturalist Realism**
  *   **Awkward Commitment:** It faces the challenge of explaining how agents lacking specific psychological capacities for normative intuition can be bound by moral truths they cannot access.
  *   **Ambiguity:** None.

  **Path 5: Normative Properties + Cognitive + Category Mistake**
  *   **Position:** **Error Theory** (Non-Naturalist Target)
  *   **Awkward Commitment:** Like Path 2, it must account for the continued normative force of moral language after declaring its referents nonexistent.
  *   **Ambiguity:** **Indistinguishable from Path 2 by this instrument.** Both are Error Theories differing only on what morality *attempted* to reference.
      *   *Further Diagnostic Case:* To separate them, ask: "If science discovered that suffering had no negative impact on social cohesion, would it still be wrong?" (Path 2 says No; Path 5 says Yes/Conceptually distinct).

  **Path 6: Normative Properties + Practical + [Any]**
  *   **Position:** **Unnamed / Incoherent**
  *   **Diagnosis:** This combination is **incoherent**. If properties are irreducibly normative, they constitute facts; disagreement about facts is cognitive. Claiming these facts exist but disagreement is merely a clash of attitudes contradicts the ontological commitment.
  *   **Awkward Commitment:** N/A (Unoccupied).

  **Path 7: Idealized Response + Cognitive + Convergence**
  *   **Position:** **Ideal-Observer Constructivism** (e.g., Firth, Rawlsian variants)
  *   **Awkward Commitment:** It is difficult to justify the authority of morality over agents who, due to cognitive limitation, can never approximate the idealized response conditions.
  *   **Ambiguity:** **Indistinguishable from Sensibility Theory.** Both locate truth in responses and view progress as convergence.
      *   *Further Diagnostic Case:* "Can a being with no conscious states but with functional analogues to suffering be wronged?" (Ideal-Observer often says Yes based on rational prohibition; Sensibility Theory often says No based on lack of sentimental capacity).

  **Path 8: Idealized Response + Cognitive + Coherence**
  *   **Position:** **Moral Relativism** (Truth-Relative-to-Framework)
  *   **Awkward Commitment:** This view renders the criticism of cross-cultural practices (e.g., slavery in a culture that approves it) unintelligible as moral error, reducing it to mere framework incompatibility.
  *   **Ambiguity:** None.

  **Path 9: Idealized Response + Cognitive + Category Mistake**
  *   **Position:** **Unnamed / Unexplored**
  *   **Diagnosis:** This combination is **unexplored**. It suggests responses fix correctness, disagreement is factual, but progress is illusory. This implies a static moral truth accessible via response that we cannot improve upon, which contradicts the fallibilism usually inherent in response-dependence.
  *   **Awkward Commitment:** N/A (Unoccupied).

  **Path 10: Idealized Response + Practical + Coherence**
  *   **Position:** **Non-Cognitivist Expressivism** (e.g., Blackburn, Gibbard)
  *   **Awkward Commitment:** It must explain the validity of moral arguments (e.g., modus ponens) without appealing to truth-conditional semantics that preserve validity across attitude-expressions.
  *   **Ambiguity:** None.

  **Path 11: Idealized Response + Practical + Convergence**
  *   **Position:** **Unnamed / Unstable**
  *   **Diagnosis:** This combination is **unstable**. Convergence on attitudes without truth-aptness suggests a causal explanation for agreement rather than a normative one, collapsing into sociology or psychology rather than metaethics.
  *   **Awkward Commitment:** N/A (Unoccupied).

  **Path 12: Idealized Response + Practical + Category Mistake**
  *   **Position:** **Moral Nihilism** (Practical Variant)
  *   **Awkward Commitment:** It implies that not only are moral claims false, but the very activity of coordinating attitudes through moral language is fundamentally misguided.
  *   **Ambiguity:** None.

  ***

  #### III. Diagnosis of Unoccupied Combinations

  Per the design requirements, two specific combinations of answers are identified as unoccupied in the current literature:

  1.  **Natural Properties + Practical Disagreement (Path 3):**
      *   **Diagnosis:** **Unstable.** This position attempts to ground the correctness of attitudes in natural facts while denying that disagreement is about those facts. It tends to collapse into **Cornell-Style Naturalist Realism** (if the natural facts are seen as motivating belief) or **Expressivism** (if the natural facts are merely causal triggers for attitudes, not truth-makers).
  2.  **Normative Properties + Practical Disagreement (Path 6):**
      *   **Diagnosis:** **Incoherent.** This position asserts the existence of irreducibly normative properties (which function as truth-makers) while denying that moral disagreement is a cognitive dispute about those properties. This contradicts the definition of a "property" in this context, which entails a fact of the matter that beliefs can track.

  ***

  #### IV. Scoring Key

  Use the respondent's answers to Steps 1, 2, and 3 to locate their leaf. If the result is an ambiguous leaf, administer the Further Diagnostic Case.

  | Step 1 (Ground) | Step 2 (Disagreement) | Step 3 (Progress) | Resulting Position | Ambiguity Check? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Natural** | Cognitive | Convergence | Cornell-Style Naturalist Realism | No |
  | **Natural** | Cognitive | Mistake | Error Theory (Naturalist) | **Yes** (See Path 5) |
  | **Natural** | Practical | *Any* | **Unoccupied (Unstable)** | N/A |
  | **Normative** | Cognitive | Convergence | Non-Naturalist Realism | No |
  | **Normative** | Cognitive | Mistake | Error Theory (Non-Naturalist) | **Yes** (See Path 2) |
  | **Normative** | Practical | *Any* | **Unoccupied (Incoherent)** | N/A |
  | **Response** | Cognitive | Convergence | Ideal-Observer Constructivism | **Yes** (See Sensibility Theory) |
  | **Response** | Cognitive | Coherence | Moral Relativism | No |
  | **Response** | Cognitive | Mistake | **Unoccupied (Unexplored)** | N/A |
  | **Response** | Practical | Coherence | Non-Cognitivist Expressivism | No |
  | **Response** | Practical | Convergence | **Unoccupied (Unstable)** | N/A |
  | **Response** | Practical | Mistake | Moral Nihilism (Practical) | No |

  **Resolution for Ambiguous Leaves:**
  *   **If Error Theory (Natural vs. Normative):** Ask the *Suffering/Social Cohesion* case.
  *   **If Ideal-Observer vs. Sensibility Theory:** Ask the *Functional Suffering* case ("Can a being with no conscious states but with functional analogues to suffering be wronged?"). Ideal-Observer theorists typically answer **Yes** (wronging is a violation of rational norms); Sensibility Theorists typically answer **No** (wronging requires the capacity for sentiment).
