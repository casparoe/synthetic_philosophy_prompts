  Your worry is astute: the third run abandons physical chaos for agential magic. Lola's scream shattering the casino glass is not sensitive dependence; it is will imposing order on chance. This resists the Amplification model, suggesting contingency is not just environmental but internal. The film thereby shifts from a physics of history to a phenomenology of it. We do not see how the world changes because of a nail; we see how Lola changes the world because she learns to scream.

