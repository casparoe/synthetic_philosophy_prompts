  **Why this works:** Her first four cases all featured *living, speaking humans*. The Dementia case introduces *automation*. The Posthumous Bot case removes the *living agent* entirely. If she maintains it is a Category 5/8 lie, she is confirmed as a **Teleologist**. If she hesitates or says it is no longer a "lie" in the same sense, she is implicitly a **Volitionalist**.
