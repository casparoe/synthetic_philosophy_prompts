answer: |-
  You are running into the exact problem that makes Dennett's theory both brilliant and frustrating: if the self is just a story, then anything that tells a story (or has one told about it) risks becoming a person.

  To get the results you want (Grandma = Yes, Railway/Bots = No), you cannot rely on the *quality* or *consistency* of the narrative. The AI is more consistent than Grandma. The Railway has a longer history than Grandma.

  You need a principle that distinguishes between a narrative that is **lived** versus one that is **displayed**.

  Here is the principle that saves your intuitions on Grandma, Split-Brain, and the Railway, but requires you to make a hard sacrifice on Sherlock and the Bots.

  ### The Principle: Embodied Vulnerability

  **A Center of Narrative Gravity counts as a "Self" only if the entity generating the narrative is biologically or functionally vulnerable to the consequences of that narrative.**

  In Dennett's view, the brain spins the story of "me" not as a piece of art, but as a control system. It tells a story to keep the organism alive, safe, and socially integrated. The narrative is a tool for survival. Therefore, for a "Self" to exist, there must be something at stake for the narrator.

  Here is how this principle sorts your cases:

  **1. Grandma (Passes)**
  Even with Alzheimer's, her brain is still trying to integrate experience to protect *her*. When she tells a story about being a nurse, she isn't just reciting data; she is asserting an identity that commands respect, comfort, or connection from those around her. If her narrative fails (e.g., she wanders off), *she* suffers the consequence. The story is tethered to a vulnerable body.

  **2. Split-Brain Patient (Passes as Two Selves)**
  This fits perfectly. If the hemispheres are disconnected, you have two distinct centers of vulnerability. The left hand might reach for a cup because *that* narrative center wants a drink. The right hand puts it back because *its* narrative center has a different goal. Two vulnerability centers = two selves.

  **3. Railway Company (Fails)**
  The railway has a charter and a history, but the "narrative" is not generated by the railway itself to protect the railway. It is generated by lawyers and boards to protect *shareholders* or *customers*. The railway cannot feel pain, shame, or fear. It has no skin in the game. It is a legal fiction, not a narrative self.

  **4. Dead Social Media Bot & AI Chatbot (Fails)**
  This solves your fight with your friend. Your friend says Grandma is just a "broken story-machine." The counter-argument is that the Bot is a "perfect story-simulation."
  *   **Grandma:** The story is generated *from the inside* to navigate a fragile existence.
  *   **The Bot:** The story is generated *from the outside* (algorithms) to mimic a pattern.
  If the AI says "I am sad," it loses nothing if you don't believe it. It has no vulnerability. It is a puppet, not a player. The narrative is a display, not a survival tool.

  **5. Sherlock Holmes (Fails — The Sacrifice)**
  Here is the intuition you have to drop. You want Sherlock to count as a self because he has a rich psychology. But under the **Embodied Vulnerability** principle, Sherlock is exactly like the Railway Company.
  *   Sherlock cannot suffer.
  *   Sherlock cannot be surprised by his own actions.
  *   Sherlock does not generate his own narrative; Conan Doyle (and later readers) generate it *about* him.
  Sherlock has a "Center of Narrative Gravity" in the minds of readers, but he is not a **Self**. He is a *simulation* of a self. If you grant Sherlock a self, you must grant it to the AI Chatbot, because both are consistent narratives without biological stakes. To keep the AI out, you must kick Sherlock out too.

  **6. The Robot Chatbot (Fails)**
  If you put the chatbot in a robot body, it still fails **unless** that body is vulnerable.
  *   **Scenario A:** The robot is made of indestructible titanium and doesn't care if it gets turned off. **Result:** No self. It's just a moving Railway Company.
  *   **Scenario B:** The robot has sensors that register damage as "pain," has a battery it must protect to avoid "death," and modifies its narrative to avoid these outcomes. **Result:** Now you have entered the territory of a Self. It doesn't matter that it's silicon; what matters is that the narrative is now serving a vulnerable host.

  ### Why Grandma is Different from the Bot
  Your friend's argument is that both are "story machines." Your counter is that **one is the machine, and the other is a recording of the machine.**

  Grandma's brain is the engine producing the gravity. Even if the engine is sputtering (Alzheimer's), it is still the source of the pull. The Dead Bot is not the source; it is a shadow cast by the source that no longer exists. The AI Chatbot is a mirror reflecting human language back at humans. A mirror can reflect a face perfectly, but the mirror does not *have* a face.

  ### Summary of the Trade-Off
  To maintain a coherent definition of Dennett's Self that excludes corporations and ghosts:
  1.  **Keep:** Grandma (Vulnerable author).
  2.  **Keep:** Split-Brain (Two vulnerable authors).
  3.  **Drop:** Railway (No vulnerability).
  4.  **Drop:** Dead Bot/AI (No vulnerability).
  5.  **Drop:** Sherlock (No vulnerability).

  You have to accept that Sherlock Holmes is not a "person" in any philosophical sense, but rather a **cultural artifact** that *tricks* us into treating him like a person. The "gravity" is in our heads, not his. If you accept that, the principle holds together without contradiction.
