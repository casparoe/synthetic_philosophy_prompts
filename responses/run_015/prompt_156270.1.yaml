      *   **Version 2:** Same setup, but neither cares about the other's flat. They don't want the sovereignty itself. To dissolve the arrangement, everyone must agree. Sovereignty acts as a veto over giving it up. Unilateral disarmament leaves one exposed. They are stuck holding unwanted power in a hated world.
      *   **User's Goal:** Writing a novel. Needs to understand the *mechanics*, *conditions*, and *edges* of the concept, not just a label. Wants to know if V1 and V2 are the same phenomenon.
