answer: |-
  Alice, Bob, and Charlie are the last three employees leaving a small graphic design studio late on a Friday night. They walk out together through the main corridor, passing a secure storage closet containing expensive camera gear that must be manually deadbolted to prevent the latch from slipping open due to a known building vibration issue. All three know about the vibration risk, all three know how to engage the bolt, and all three are physically able to reach it as they pass. However, only Alice signed the weekly safety roster assigning her the specific "Close-Out" role for this week; Bob and Charlie are just colleagues finishing late projects with no such assignment. All three assume someone else will handle it or simply forget in the rush to leave, so none of them turn the bolt. Over the weekend, the vibration causes the latch to slip, the door opens, and the gear is stolen.

  ### Analysis of the Case

  **(1) The Plain Counterfactual Theory**
  Under a plain counterfactual theory, causation is defined strictly by dependence: event C causes event E if and only if, had C not occurred, E would not have occurred. When applied to omissions, we ask: "If this person had acted, would the harm have been avoided?" In this scenario, we hold the inaction of the other two fixed. If Alice had turned the bolt (while Bob and Charlie did nothing), the gear would have been safe. If Bob had turned the bolt (while Alice and Charlie did nothing), the gear would have been safe. If Charlie had turned the bolt (while Alice and Bob did nothing), the gear would have been safe. Because the harm counterfactually depends on the inaction of each individual equally, the theory verdict is that all three are causes. The plain counterfactual theory has no internal resources to treat them differently because it looks only at the structure of dependence, not at social roles or agreements; the physical relationship between each person's potential action and the outcome is identical.

  **(2) The Expectation Theory**
  The expectation theory (often associated with legal or normative accounts of causation) argues that an omission counts as a cause only when the outcome represents a departure from what was expected or required given the agent's role. Here, the theory asks not just "Could they have prevented it?" but "Were they supposed to?" Alice violated a specific norm established by the safety roster; her omission was a breach of duty that explains why the normal state of security was not maintained. Bob and Charlie, while capable, had no such expectation placed upon them; their inaction is treated as a mere background condition, similar to the stranger on the other side of the world not watering the plant. Therefore, the expectation theory verdict is that Alice is a cause, but Bob and Charlie are not. This differs from the counterfactual theory because it builds normative status into the definition of causation itself, rather than treating causation as a purely metaphysical relation.

  **(3) The Differentiating Feature**
  The single feature doing the work of separating the three people is the explicit prior assignment of the "Close-Out" role on the weekly safety roster. This is confirmed as the sole differentiator because the scenario stipulates that skill, proximity, awareness, and physical capability are held constant across all three. The counterfactual strength is also identical (any one action is sufficient to prevent harm). Therefore, the divergence in verdicts between the two theories rests entirely on whether the theory recognizes normative assignments (like a roster) as relevant to causation.

  **(4) Removal and Addition Test**
  If the assigned duty is taken away from everyone (no roster exists), the expectation theory verdict changes to zero causes (no one violated a norm), while the counterfactual theory verdict remains unchanged (all three are still causes via dependence). If that same duty is extended to all three (all are on the roster), the expectation theory verdict changes to three causes (all violated a norm), while the counterfactual theory verdict remains unchanged (all three are still causes). This test confirms that the expectation theory's verdicts track the distribution of the duty, whereas the counterfactual theory's verdicts are insensitive to it.

  **(5) The Counterfactualist Rebuttal**
  The strongest move available to a defender of the counterfactual theory is to argue that causation is a metaphysical relation distinct from moral or legal responsibility. They can concede that all three omissionally caused the harm in the strict sense of counterfactual dependence, but resist the intuition that this implies equal blame. On this view, our ordinary judgment that only Alice is "at fault" tracks responsibility, not causation; the theory remains correct that all three are causes, but we only punish or blame Alice because she alone had a duty. This preserves the plain counterfactual definition while explaining away the intuitive mismatch as a confusion between causing and blaming.

