answer: |-
  There is no single canonical term in philosophy or political science that captures this exact configuration, though your intuition is correct: this is a structural phenomenon, not mere grumbling. It is a stable equilibrium that relies on specific information constraints.

  The closest established framework is a combination of **Two-Level Game Theory** (Robert Putnam), **Audience Cost Theory** (James Fearon), and the distinction between **Mutual and Common Knowledge** (David Lewis/Robert Aumann). In organizational sociology, Nils Brunsson's concept of **"The Organization of Hypocrisy"** is the nearest neighbor, though it lacks the specific "mutual defeat" mechanic you describe.

  If you need a label for your toolkit, the most precise technical description is **"A Common-Knowledge-Fragile Equilibrium,"** and the social mechanism is **"Dual-Defeat Signaling."**

  Here is the careful carving you asked for, breaking down the ingredients, the edges, and the nearest misses.

  ### 1. The Mechanism: Why the Truth Breaks the Deal

  To understand the edges, we must identify the engine. This is not about honesty; it is about **signaling loyalty under a Principal-Agent problem.**

  *   **The Principals:** The constituents (open-source users, town voters, committee stakeholders).
  *   **The Agents:** The negotiators (maintainers, board members).
  *   **The Constraint:** The Principals cannot observe the *substance* of the deal easily, but they can observe the *narrative* of the conflict.
  *   **The Signal:** To prove they haven't "sold out," Agents must incur a **cost**. In normal signaling theory, you burn money to show strength. In this specific equilibrium, the Agents must **burn political capital** to show loyalty.
  *   **The Glue:** Admitting "we both won" removes the cost. If there is no cost, the signal is cheap. If the signal is cheap, the Principals assume betrayal.

  Therefore, the deal does not collapse because people are lying; it collapses because **the lie is the currency.**

  ### 2. The Three Necessary Ingredients (The Edges)

  You asked which ingredients could be removed. Based on the mechanism above, here is the stress test:

  **A. The Audience Cost Requirement (Essential)**
  *   *Condition:* Constituents must punish representatives who appear to compromise on principles, even if the outcome is good.
  *   *Test:* If both sides are fully honest with their constituents ("We got everything we actually cared about"), does the phenomenon survive?
  *   *Result:* **No.** The arrangement collapses. If the constituents are rational actors who care only about outcomes, you have a standard compromise. The phenomenon *requires* constituents who value *symbolic victory* (or the appearance of ideological purity) over *substantive utility*.
  *   *Edge:* This distinguishes it from ordinary compromise. In ordinary compromise, honesty stabilizes the deal. Here, honesty destabilizes it.

  **B. The Common Knowledge Barrier (Essential)**
  *   *Condition:* The mutual benefit must be **Mutual Knowledge** (the negotiators know it) but not **Common Knowledge** (the constituents do not know that the negotiators know it).
  *   *Test:* If the two constituencies overlap and read each other's blogs (making the truth Common Knowledge), does it survive?
  *   *Result:* **No.** Once the constituents know that the *other side* also knows they won, they realize the "defeat" is staged. The signal becomes cheap. The negotiators are then punished by *both* sides for colluding to deceive them.
  *   *Edge:* This distinguishes it from an "Open Secret." In an open secret, everyone knows the truth but pretends not to. Here, everyone must actively believe (or pretend to believe) the *falsehood* that a loss occurred.

  **C. The Decoupling of Principle and Operative Concern (Essential)**
  *   *Condition:* There must be a gap between what the constituency *says* they want (Principle) and what they *actually need* (Operative Concern).
  *   *Test:* If one side genuinely prefers the middle option (no gap between principle and concern), does it survive?
  *   *Result:* **No.** If one side actually wants the compromise, they cannot credibly signal loss. They would have to fake disappointment, which is risky. The equilibrium is most stable when both sides are genuinely relieved but forced to act disappointed.
  *   *Edge:* This distinguishes it from "Saving Face." Saving face usually implies one side is humiliated and needs a cushion. Here, *both* sides are cushioned by the *same* fiction.

  ### 3. Proposed Definition and Name

  Since no single term exists, I recommend classifying this as:

  **Name:** **A Common-Knowledge-Fragile Compromise**
  **Definition:** An agreement between two parties that is substantively preferable to the status quo for both, but which remains stable *only if* both parties publicly frame the outcome as a loss. The arrangement relies on preventing the mutual benefit from becoming Common Knowledge among the parties' respective constituencies.

  **Alternative (Sociological):** **Institutionalized Dual-Defeat.**
  **Definition:** A scenario where representatives of opposing groups trade substantive wins for narrative losses to satisfy audience cost constraints, requiring a shared silence regarding the true utility of the outcome.

  ### 4. Nearest Misses (And Why They Fail)

  To ensure you classify future cases correctly, here is how to distinguish this from similar concepts:

  | Concept | Why it seems similar | Why it is a "Miss" |
  | :--- | :--- | :--- |
  | **Ordinary Compromise** | Both sides agree on a middle ground. | In ordinary compromise, publicizing the mutual gain *strengthens* the deal. Here, it destroys it. |
  | **Saving Face** | Involves hiding embarrassment. | "Saving Face" is usually asymmetric (one side lost, we hide it). This is **symmetric** (both sides pretend to lose). |
  | **Constructive Ambiguity** | Used in diplomacy to allow agreement. | Constructive Ambiguity hides the *terms* of the deal (e.g., "what does 'sovereignty' mean?"). Your case hides the *valuation* of the deal (e.g., "we know this is good, but say it's bad"). |
  | **Pluralistic Ignorance** | Everyone privately disagrees but publicly conforms. | In Pluralistic Ignorance, everyone thinks they are the *only* one who thinks X. In your case, the negotiators *know* the others agree; the secrecy is directed at the *constituents*, not each other. |
  | **The Noble Lie** | A falsehood told for social stability. | A Noble Lie is top-down (rulers lie to subjects). This is **horizontal** (negotiators collude to manage their respective masters). |
  | **Hypocrisy** | Saying one thing, doing another. | Hypocrisy implies a moral failing or instability. This arrangement is **functional and stable** *because* of the inconsistency. (See Nils Brunsson's *The Organization of Hypocrisy*). |

  ### 5. Summary for Your Next Meeting

  When you encounter this again, you can diagnose it by asking three questions:

  1.  **Is the victory toxic?** If we announce we won, will our base punish us?
  2.  **Is the defeat credible?** Can we point to a specific concession that looks like a loss to an outsider?
  3.  **Is the silence mutual?** Does the other side agree *not* to thank us for our concession?

  If the answer to all three is "yes," you are in a **Common-Knowledge-Fragile Equilibrium**. The engineering implication is that **transparency is the enemy.** Documentation, blog posts, and release notes must be scrubbed not to hide malfeasance, but to preserve the *ambiguity of victory*. Any attempt to "clarify the record" or "give credit where it's due" will be interpreted as an attack on the stability of the agreement.

  You are not dealing with a philosophical puzzle; you are managing a **distributed system with inconsistent consistency requirements.** The "lie" is the checksum that allows the two subsystems (the opposing factions) to interoperate without crashing their local environments (their constituencies).
