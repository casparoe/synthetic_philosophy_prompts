answer: |-
  The smallpox eradication campaign serves as strong practical evidence for lexical threshold negative utilitarianism as a decision constraint, but it reveals the theory's inability to resolve decisions where only probabilistic suffering remains.

  On tail discipline, the endgame is a partial vindication of the lexical view rather than a reductio, but only up to the point of certification. Your lexical view holds that preventing threshold suffering is mandatory regardless of the cost in foregone happiness. The campaign's willingness to spend enormous sums to prevent the final cases aligns perfectly with this: a balancing view would have stopped earlier when the cost per case exceeded the utility of alternative spending, but the lexical view demands you go until the suffering stops. However, the decision to stop while virus stocks were retained creates a tension. If the theory is strict, retaining stocks creates a risk of future threshold suffering, which should be prevented if possible. The fact that the campaign stopped suggests either that the practitioners recognized a resource limit where further spending would cause threshold suffering elsewhere (starvation due to diverted funds), or that they implicitly accepted a trade-off between absolute safety and other goods. If the latter, the case acts as a reductio of strict lexicality because it shows that even in the clearest case of severe suffering, we eventually stop spending. The theory is silent on where exactly that stop should be if not at zero risk, which is why the retention of stocks looks like incoherence from a strict lexical standpoint.

  On the bearer question, the theory requires the threshold to sit on the episode of suffering, not the whole life, to vindicate the campaign. Smallpox victims often lived lives that were net positive despite the disease; they had relationships, joys, and meanings that outweighed the illness. If your threshold is defined by whether a life is worth living, smallpox does not clearly cross it, and the lexical priority disappears. However, smallpox involves acute, intense pain and terror during infection, plus the trauma of disfigurement or blindness. If the bearer is the specific bout of illness or the moment of acute pain, this easily crosses a threshold of intolerable suffering. Therefore, for your view to justify the eradication effort, you must define the bearer as the discrete episode of severe suffering. If you move the threshold to the level of a whole life, the campaign becomes harder to justify under lexical negative utilitarianism, as it shifts the calculation back toward balancing the costs of eradication against the net welfare of the populations involved.

  On the risk version, accepting any exchange rate between probability and ordinary goods does smuggle commensurability back in, and the theory struggles to survive it without modification. Eradication bought a reduction in risk, not just the prevention of actual cases. If a one-in-a-million chance of threshold suffering is lexically prior to any finite happiness, you are committed to spending vast resources on negligible risks, which leads to the paralysis you suspect. If you say no, and allow a tiny risk to be traded for ordinary goods, you have introduced an exchange rate: some amount of happiness is worth some amount of risk. This collapses the lexical distinction into a weighted calculation. The smallpox case shows that practitioners accepted residual risk (the stored virus), implying they treated the risk as commensurable with the cost of destruction. Your theory is largely silent here; it can demand risk reduction, but it lacks a principled way to say when a risk is small enough to ignore without abandoning its core lexical claim.

  On the common currency question, your suspicion is correct: the episode leaves the commensurability question untouched rather than settling it. The practitioners operated with a lexical goal (eradication is non-negotiable) but used utilitarian means (cost-effective surveillance rather than mass vaccination). This hybrid approach shows that you can make progress on severe suffering without resolving whether pleasure and pain are metaphysically measurable on one scale. They treated health security as a constraint, not a commodity to be traded, but within that constraint, they balanced costs. This suggests that the philosophical fight about commensurability is less relevant to practical policy than the decision to adopt lexical constraints for specific categories of harm. The case demonstrates that a lexical rule can guide action without requiring a universal common currency for all values.

  I read the case as evidence for the view as a heuristic constraint, but as an anomaly it has to absorb regarding completion. The drive to eradicate supports the idea that severe suffering demands priority over general welfare, which is the core insight of your view. However, the failure to destroy the virus stocks and the eventual cessation of spending are anomalies for a strict lexical theory, which should demand total risk elimination if the suffering is truly above threshold. The theory anticipated the priority of suffering but did not anticipate the practical necessity of accepting residual risk, leaving it silent on how to justify the final stop.
