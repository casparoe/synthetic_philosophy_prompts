answer: |-
  You have hit on one of the most persistent friction points in modern political philosophy, and your intuition about the "stall" is spot on. You also got the term almost right: philosophers usually call this **ascriptive universalism** (or sometimes "false universalism").

  The core of your observation—that the argument stalls because the two sides are using different definitions of "universal"—is widely acknowledged in meta-ethics and political theory. However, it goes deeper than just a dictionary mix-up. The stall happens because the argument is actually fighting on three different levels at once: semantics, logic, and power.

  Here is the breakdown of what is settled, what is fought over, and where the "gut feelings" come in.

  ### 1. The Semantic Stall (Scope vs. Origin)
  You identified this clearly: one side is talking about **Scope** (who this applies to), and the other is talking about **Genealogy** (where this came from).

  *   **Side A (The Universalist):** Uses "universal" to mean *applicability*. "This principle protects all humans, therefore it is universal." They are making a claim about the *destination* of the rule.
  *   **Side B (The Critic):** Uses "universal" to mean *source*. "This principle was drafted by 18th-century Europeans, therefore it is particular, not universal." They are making a claim about the *origin* of the rule.

  **What is settled:** In philosophy, it is settled that these are two different claims. A rule can have a particular origin but a universal scope (e.g., calculus was developed in specific places, but applies universally). Conversely, a rule can claim universal scope but be rejected by many cultures.

  **Where the stall happens:** Side A thinks Side B is saying "Suffering doesn't matter in your culture." Side B thinks Side A is saying "Your culture contributed nothing to this idea." They aren't actually disagreeing about the facts; they are disagreeing about what work the word "universal" is doing.

  ### 2. The Logical Layer (The Genetic Fallacy)
  This is where philosophy draws a hard line, though it doesn't solve the political argument.

  **What is settled:** There is a consensus in logic that attacking the *origin* of an idea does not automatically invalidate the *truth* of the idea. This is called the **Genetic Fallacy**. Just because human rights were articulated during the era of Western imperialism doesn't logically prove that human rights are *wrong*. If "torture is bad" is a true moral statement, it remains true regardless of who said it first.

  **Where the fight is:** While logicians agree on this, moral and political philosophers disagree on whether morality *works* like logic.
  *   **Universalists** tend to treat moral truths like math: once discovered, they belong to everyone.
  *   **Critics** argue morality is more like language or law: it only has authority if the community consents to it. If a rule is imposed from the outside, it lacks *legitimacy*, even if it is logically *valid*.

  So, the stall isn't about hidden facts. It's about whether "truth" or "consent" is the higher authority.

  ### 3. The Power Layer (Ascription and Authority)
  This is the "bedrock gut feeling" you mentioned, and it is where the concept of **ascriptive universalism** lives. This is the most contested area, and there is no expert consensus here.

  The critique is that labeling something "universal" is a power move. It functions as a conversation-ender.
  *   **The Mechanism:** When Side A says, "This is a universal human right," they are effectively saying, "This is not up for negotiation."
  *   **The Effect:** If you disagree, you aren't just offering a counter-argument; you are positioning yourself outside the circle of "reasonable people." You are framed as backward, oppressive, or irrational.

  **The Contested Ground:**
  *   **The Universalist View:** Some things *must* be non-negotiable. If we don't label certain rights as universal and beyond cultural debate, we lose the ability to stop atrocities (genocide, slavery) when a culture claims them as "tradition." They argue that "power" is necessary to protect the vulnerable.
  *   **The Critic's View:** Labeling your local values as "universal" is a form of epistemic violence. It erases other ways of being human. They argue that true universality can only happen if every culture contributes equally to the definition (which hasn't happened). Until then, calling it "universal" is just a mask for dominance.

  ### Summary of the Stall
  To answer your specific question: **Is the stall about hidden facts, different meanings, or gut feelings?**

  1.  **Hidden Facts:** **No.** Both sides generally agree on the history (that modern human rights discourse emerged largely from Western liberal traditions) and the reality of suffering. The facts aren't the blocker.
  2.  **Different Meanings:** **Yes.** This is the primary engine of the confusion. One side means "applies to all," the other means "created by all."
  3.  **Bedrock Gut Feelings:** **Yes, and this is the real blocker.** Even if you clarify the definitions, the fight remains.
      *   One side's gut feeling is: *"Without a universal standard, might makes right, and the weak get crushed."*
      *   The other side's gut feeling is: *"Without cultural autonomy, the powerful dictate reality, and the weak get erased."*

  ### The Philosophical Bottom Line
  There is no consensus on how to resolve this.
  *   **Settled:** "Universal" is an ambiguous term that conflates origin and scope. Origin does not logically determine validity.
  *   **Unsettled:** Whether a moral framework can be legitimate if it is not co-authored by everyone it binds.

  The "ascriptive" critique you noticed is essentially accusing Side A of skipping the "co-authoring" part. They are saying: "You are demanding we follow rules we didn't write, and calling those rules 'nature' so we aren't allowed to complain."

  Side A responds: "If we wait for everyone to co-author the rules, people will die in the meantime."

  The stall persists because both fears are real. One side fears tyranny disguised as culture; the other fears tyranny disguised as universality. Philosophy has not solved this tension; it has mostly just mapped it out, exactly as you suspected.
