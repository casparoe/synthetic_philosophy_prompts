answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees, Fennimore University Museum
  **FROM:** Restitution Working Group Chair
  **DATE:** 15 February 2024
  **SUBJECT:** Recommendation Regarding Restitution of Okwei Memorial Effigy (Accession 1947.023) and Related 1899 Expedition Materials

  ### Executive Summary

  This memo recommends the **transfer of legal title** of the Okwei memorial effigy to the **National Museum of Ndara**, contingent upon a binding tripartite agreement granting physical custody to the **Okwei Community Museum** for a five-year period, followed by transfer to the **Okwei Heritage Council** for ritual disposition.

  Regarding the three additional objects from the 1899 punitive expedition: We recommend offering them to the Heritage Council under a "Right of First Refusal" protocol. If declined, they are to be moved to research storage and removed from public display.

  This approach navigates state legal constraints regarding "destruction" and "public institution" status while honoring the ethical imperative of restitution. It acknowledges the object's intended impermanence without exposing Fennimore to legal liability for negligence.

  ### Context and Claims

  The object in question (1947.023) is a carved wood and pigment effigy collected in 1899 during a punitive expedition. It was created to commemorate a war leader and was culturally intended to weather and decay at a grave site. Currently, it is chemically consolidated and mounted on a steel armature (1972).

  We face three competing claims:
  1.  **Okwei Heritage Council:** Requests "retirement" of the object to a sacred grove to allow natural decay.
  2.  **Okwei Community Museum Committee:** Requests display for educational and economic benefit (tourism).
  3.  **National Museum of Ndara:** Claims title under national heritage law.

  ### Analysis of Key Ethical Conflicts

  The Working Group was divided on three core questions. The recommendation below rests on the following positions:

  **1. Preservation Conditions vs. Restitution**
  *Position:* Imposing permanent preservation conditions (climate control, no handling) effectively vetoes restitution.
  *Reasoning:* Restitution is the return of authority, not just physical custody. If we return the object but mandate it be treated as a permanent "art object," we are enforcing a Western museological ontology over an Okwei ritual ontology. The "destruction" of the object via weathering is not damage; it is the completion of its function. While Fennimore cannot legally authorize "destruction," transferring title to the National Museum shifts the jurisdiction. The National Museum, operating under Ndara law and closer to the source community, is better positioned to interpret what constitutes "negligence" versus "ritual completion."

  **2. Internal Community Disagreement (The "Keeper" Question)**
  *Position:* Fennimore should not arbitrate Okwei cultural authenticity, but should recognize the Heritage Council as the authority on *ritual fate* and the Community Museum as the authority on *public access*.
  *Reasoning:* One Trustee has raised concerns that the current Keeper of the Grove is a woman, whereas 1899 colonial records describe the office as male-only. Using 125-year-old colonial ethnography to police contemporary Okwei gender roles is epistemologically unsound. Cultural roles evolve; colonial records are often inaccurate regarding internal social structures. However, we acknowledge the Community Museum's valid stake. The recommended compromise (5-year display followed by ritual retirement) respects both the desire for access and the traditional authority regarding the object's end-of-life.

  **3. Reflexivity and the "Tourist Economy"**
  *Position:* Acknowledging that the museum created the context for the diaspora's claim does not invalidate that claim.
  *Reasoning:* It is true that the effigy's presence here helped generate the diaspora network that now seeks its return. However, arguing that their desire for display is "inauthentic" because it was influenced by museum culture is condescending. It assumes a static, pre-colonial "purity" that no longer exists. The Community Museum's desire for tourism revenue is a pragmatic survival strategy, not a moral failing. We should not penalize them for adapting to the economic reality we helped create.

  ### Recommendation

  **1. Disposition of Effigy (1947.023)**
  *   **Action:** Deaccession and transfer legal title to the **National Museum of Ndara**.
  *   **Rationale:** This satisfies state law requiring transfer to a public institution.
  *   **Condition:** The transfer agreement must include a covenant that the National Museum will facilitate a **five-year loan to the Okwei Community Museum**.
  *   **Sunset Clause:** Upon expiration of the loan, physical custody transfers to the **Okwei Heritage Council**. Fennimore will indemnify the National Museum against claims of "destruction" should the Council choose to retire the object to the grove.
  *   **Documentation:** Fennimore will provide all conservation records but will cease to dictate future conservation standards.

  **2. Disposition of Related Objects (3 items)**
  *   **Action:** Offer to the Heritage Council.
  *   **Condition:** If the Council declines (as they have with two similar cult objects previously), the items are to be **de-accessioned from public view** and placed in research storage.
  *   **Principle:** We cannot keep objects on display that the source community has explicitly rejected as culturally sensitive or abandoned. However, we cannot force a community to accept objects they do not want. "Declined" does not mean "keep on display"; it means "remove from public eye."

  **3. Timeline**
  *   **March:** Trustee Vote.
  *   **June:** Formal offer to National Museum.
  *   **September:** Tripartite agreement finalized.
  *   **December:** Object shipped.

  ### The Strongest Counter-Argument (Steelman)

  *If I were arguing against this recommendation, this is the case I would make:*

  **"Preservation is Witness; Restitution is Erasure."**
  The strongest argument against this plan is that the object's function *changed* the moment it was looted in 1899. It is no longer a ritual effigy; it is evidence of a colonial crime. By allowing it to rot, we are destroying the primary physical evidence of the punitive expedition. Future generations of Okwei may want to see what was taken, just as Holocaust survivors' descendants preserve artifacts of persecution.

  Furthermore, the legal risk is too high. State law prohibits transferring objects destined for destruction. Even if we transfer title to the National Museum, if the object is destroyed shortly after, Fennimore could be seen as facilitating a violation of public trust. The "Female Keeper" issue is not about policing gender; it is about due diligence. If the claimant's authority is contested locally, Fennimore risks legitimizing a faction that may not represent the broader community, potentially sparking internal conflict that the museum will be blamed for. Finally, the "compromise" of 5 years display satisfies no one: it denies the Heritage Council their ritual imperative for too long, and denies the Community Museum a permanent asset for tourism. We should retain the object until there is a single, unified Okwei voice, preserving it in the meantime as a testament to colonial violence.

  ### Critique of the Frame

  Finally, I must note that the question "Who gets the object?" is the wrong frame. It assumes the object is a discrete commodity to be moved from Point A to Point B.

  The reality is that the object is a node in a relationship. The 1972 conservation (cutting the base, adding steel) was an act of violence that made the object "museum-ready." We cannot undo that. Returning it does not restore its original state; it moves it into a new phase of existence.

  Therefore, this recommendation is not about "fixing" the past. It is about ending Fennimore's stewardship in a way that maximizes Okwei agency. We are not deciding the object's fate; we are deciding *who gets to decide* the object's fate. That distinction is vital for the Trustees to understand. We are not voting on conservation; we are voting on jurisdiction.

  ### Next Steps

  I request authorization to draft the Memorandum of Understanding with the National Museum of Ndara based on the terms above, to be presented for final legal review by 1 March.

  ***

  **Chair, Restitution Working Group**
  Fennimore University Museum
