          *   Distinguish between *meta-ethical rejection of aggregation* (valid) vs. *intuition pumping* (invalid).
          *   The falsification condition: If we find insects have complex pain processing *and* we find tractable interventions *and* we still ignore them, then the view is falsified as hypocritical.

  8.  **Refining the Tone:**
      *   Ensure I don't just argue *for* insect welfare. I need to answer the specific prompt: "What counts against *this specific reversal argument*?"
