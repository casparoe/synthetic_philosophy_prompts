      *   *Refining the User's Distinction:* Artifact-side vs. Uptake-side is good. Let's label it "Designed Ambiguity" vs. "Interpreter Projection."
      *   *Intentional Stance:* Clarify that for Dennett, the stance is instrumental. If it works, the beliefs are real *relative to that stance*. But moral status requires more (evolutionary history, embodiment, stakes). Lemoine conflated *intentionality* with *sentience/moral worth*.
      *   *Verdict:* The case breaks the "Counterfeit" frame because there was no successful counterfeiting. It reveals a vulnerability in the *interpreter*, not the *artifact*.

