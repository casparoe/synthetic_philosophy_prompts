answer: |-
  ### The Specification

  **1. Maxim Individuation Rule**
  *   **Requirement:** The reading must specify which features of a situation are morally relevant for inclusion in the maxim and which are noise.
  *   **Motivation:** **Case 2 (City Lying)** and **Case 3 (Whim Promise).** If "being in a passing city" or "feeling like it" are valid maxim-conditions, universalization yields permission. If they are noise, it yields prohibition. Without a rule for relevance, the test is input-sensitive.
  *   **Status:** **Non-negotiable.** Without this, the test is gerrymanderable by definition.

  **2. Contradiction Taxonomy**
  *   **Requirement:** Must distinguish between a maxim that becomes *impossible to conceive* in the universalized world and one that is *impossible to will* (even if conceivable).
  *   **Motivation:** **Case 5 (Credit Stealing).** Universalized, "credit" ceases to exist, making the end unachievable (Contradiction in Will), but the act of claiming credit remains conceivable. Contrast **Case 1 (Referee Bribe):** If everyone takes bribes, the institution of refereeing collapses, making the act itself conceptually incoherent (Contradiction in Conception).
  *   **Status:** **Non-negotiable.** Required to distinguish perfect from imperfect duties.

  **3. Counterfactual Scope**
  *   **Requirement:** Universalization must range over *any agent in that type of situation*, not just the actual population count.
  *   **Motivation:** **Case 6 (Archive Key).** If "everyone" means the actual seven people in the department, and only I have the key, the universalized maxim is vacuous. The test must ask: "What if *anyone* holding the key denied access?"
  *   **Status:** **Non-negotiable.** Otherwise, unique roles escape moral evaluation.

  **4. Normative vs. Physical Impossibility**
  *   **Requirement:** The "breakdown" of the universalized world must be normative or teleological, not merely physical or pragmatic.
  *   **Motivation:** **Case 4 (Queue Cutting).** If the queue jams physically when everyone cuts, that's a traffic problem, not a moral contradiction. The reading must explain why the *right* to queue collapses, not just the flow.
  *   **Status:** **Non-negotiable.** Prevents reducing morality to prudence.

  **5. Omission Handling**
  *   **Requirement:** Must generate verdicts on maxims of non-interference or indifference without smuggling in a positive duty premise.
  *   **Motivation:** **Case 7 (Let People Sort Problems).** Nature subsists under this universalization. A reading that only tests for systemic collapse will pass this. It needs a mechanism to show why a rational will *must* adopt others' ends.
  *   **Status:** **Non-negotiable.** Required for imperfect duties.

  **6. Empirical Stability**
  *   **Requirement:** Verdicts should not flip based on contingent empirical thresholds unless those thresholds are constitutive of the concept.
  *   **Motivation:** **Case 4 (Queue Cutting)** again. If the verdict changes because the queue is 6 people vs. 7, or because there is a ticketing system, the moral law becomes contingent on crowd management.
  *   **Status:** **Negotiable.** Some readings accept empirical sensitivity (e.g., institutional facts), but it risks making morality too fragile.

  **7. First-Person Operability**
  *   **Requirement:** A novice must be able to run the test on a new maxim and derive the verdict without knowing the answer in advance or needing metaphysical training.
  *   **Motivation:** **Case 9 (Conditional Tax Fiddling).** "Only if most others do." A student needs to know if this condition stabilizes the maxim or makes it parasitic. If the test requires deep exegesis to resolve, it fails the pedagogical purpose.
  *   **Status:** **Non-negotiable.** This is your stated purpose.

  ---

  ### The Tension: Description Sensitivity

  **Are they jointly satisfiable?** No.
  You cannot have a test that is *insensitive* to how the maxim is described while simultaneously preventing students from *choosing* the description to get the verdict they want. If the verdict doesn't change when you change the description, then the description doesn't matter. If the description doesn't matter, you can't stop them from writing "I will lie" instead of "I will lie to save a life."

  **Which half to keep?** Keep **"No Gerrymandering."**
  Drop "Insensitive to description."
  **Replacement:** **"Constraint on Relevant Features."** The spec must include a rule that dictates *which* descriptions are permissible inputs. (e.g., "Include the institutional role, exclude the geographic location"). You trade the hope that the test is description-proof for the assurance that the *input rules* are rigid.

  ---

  ### The Most Exclusionary Requirement

  **Requirement 7: First-Person Operability.**
  This excludes the most readings. Most scholarly reconstructions (especially those relying on noumenal will, teleological nature, or deep metaphysical commitments about rational agency) require the teacher to explain *why* the contradiction holds. They rely on a hermeneutic circle where you already know Kant's verdict to see the contradiction. A test a third-year student can run in five minutes on a maxim they invented excludes almost all sophisticated exegetical models.

  ---

  ### Scoring the Four Families

  **1. Logical/Semantic Contradiction**
  *   **Score:** Fails **Case 5 (Credit)** and **Case 7 (Omission).** Strict logical contradiction cannot capture ends becoming unachievable or duties to help. It handles **Case 2 (Lying)** well but collapses on imperfect duties.
  *   **Verdict:** Too narrow for the spec.

  **2. Practical/Teleological Contradiction**
  *   **Score:** Passes **Case 5** (ends defeated). Struggles with **Case 1 (Referee)** (institution collapse is causal, not always conceptual). Fails **Case 7** unless it assumes a necessary end of mutual aid which isn't in the maxim itself.
  *   **Verdict:** Strong on CC, weak on CW without extra premises.

  **3. Law of Nature / Rational Will**
  *   **Score:** Passes **Case 7** (rational will necessarily wills aid). Passes **Case 6** (counterfactual scope). High risk on **Requirement 7 (Operability)**; students cannot easily determine what a "rational will must have" in minutes without doctrinal instruction.
  *   **Verdict:** Philosophically robust, pedagogically brittle.

  **4. Community / Public Law**
  *   **Score:** Passes **Case 1 (Referee)** and **Case 9 (Tax)** (public trust/conditionality). Handles **Case 4 (Queue)** well (public order). Struggles to distinguish CC from CW sharply; tends to blend them into "could we live together?"
  *   **Verdict:** High operability, but risks turning the CI into a social contract test.
