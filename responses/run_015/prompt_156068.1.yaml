prompt: |-
  I'm rewriting my third-year Kant sessions for next term (we're on Groundwork II, the universalizability stretch), and I've relised I don't actually have a spec for what I want out of a reading of the test before I go pick one to teach. So help me build the spec.

  Purpose first, so adequacy has something to be relative to: I want a version of the test that a student can apply to a maxim they wrote down themselves, in a few minutes, without already knowing the answer — and that returns Kant's own verdicts on the four stock examples (suicide from self-love, the lying promise, the unused talents, the man who walks past the sufferer). Anything that only works if a philosophically trained person reverse-engineers the description is out.

  Here's the part I most want. Below is a battery of maxims I made up because my seminar kept breaking on them. Any adequate reading has to return a verdict on each, and the verdicts have to come from the reading and not from me nudging the description:

  1. As a referee, I'll take money to favour one side. (Is the maxim indexed to a role or office? Universalise over everyone, or over office-holders?)
  2. I'll lie whenver I'm in a city I'm only passing through. (Class indexed by place, not person.)
  3. I'll break a promise when I feel like it. (Class indexed to the agent's occurrent desire.)
  4. When the queue is longer than six people, I'll cut in. (The universalised world falls apart only above a certain occupancy level — so the verdict seems to move with population size, or with whether there's a ticketing system, or with whether everyone else is queueing.)
  5. I'll get ahead by taking credit for colleagues' work. (Universalised, the end — credit — becomes unachievable, but not because the maxim is incoherent.)
  6. As the only person who knows where the archive key is, I'll deny anyone else access. (Universalisation over a class of one: vacuous permission, or no verdict at all?)
  7. I'll let people sort out their own problems. (An omission, not an act; and nature plainly subsists under it.)
  8. I'll lie to myself about why I did it. (Self-directed; universalisation ranges over one agent's own future states.)
  9. I'll fiddle my taxes, but only if most others already do. (Compliance conditional on others' non-compliance.)
  10. I'll help people when it suits me and not otherwise. (A permissive maxim: not "do," not "don't," but "either.")

  For each requirement you state, give me the case from that battery (or one of your own) that motivates it, and tell me which requirements are non-negotiable and which are just what one family of readings wants. Things I think belong somewhere on the list, but you order them and you can throw any of them out: that the reading say what a maxim is and how finely it gets individuated; that it distinguish failing in conception from failing in the will from merely being unwise or unstable; that it say whether the verdict attaches to the maxim, to the action, or to the world the maxim would make; that it handle omissions and maxims of pure indifference; that it explain where the extra premise comes from if the law-of-nature clause is doing the work on case 7; that it tell us whether verdicts are allowed to shift with background empirical facts (case 4); that it be usable first-personally, in the moment, by someone who doesn't know the outcome; and that it not let you gerrymander the verdict by re-describing.

  Two things I especially want. First: is there a pair on your list that can't be jointly satisfied? My candidate is that the verdict has to be insensitive to how finely you describe the maxim, and yet you mustn't be able to get any verdict you like by choosing the description — coarse enough to avoid false negatives, fine enough to avoid false positives. If that pair really is unsatisfiable, say so and tell me which half to keep and what to put in place of the other. Second: which single requirement excludes the most readings?

  Then, briefly — a few lines, not an essay — score the four families I keep circling: the logical/semantic-contradiction reading; the practical-contradiction reading on which the maxim's own end can't be achieved in the universalised world; the law-of-nature reading that leans on a premise about what ends a rational will (or a natural organism) must have; and the reading on which the test is about whether you could will your maxim as a law for a community of rational agents. No names needed, no bibliography, and please don't just walk me through the four stock examples again — I've taught those to death. It's the spec I'm after.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Context:** Third-year Kant seminar, *Groundwork* II (Universalizability/Formulas of Universal Law).
      *   **Goal:** Build a specification (spec) for a reading of the Categorical Imperative (CI) test.
      *   **Purpose:** A version students can apply *themselves* to *their own* maxims in *minutes*, without prior knowledge of the answer, yielding Kant's verdicts on the four stock examples.
      *   **Constraint:** No reverse-engineering descriptions to fit verdicts.
      *   **Input:** A battery of 10 tricky maxims (referee bribery, transient lying, whim promise-breaking, queue cutting, credit stealing, archive key, omission/helping, self-deception, conditional tax fiddling, permissive helping).
      *   **Tasks:**
          1.  Build the spec (requirements).
          2.  For each requirement, cite a motivating case from the battery.
          3.  Distinguish non-negotiable vs. optional requirements.
          4.  Address the tension between "insensitive to description" vs. "no gerrymandering."
          5.  Identify the single most exclusionary requirement.
          6.  Score the four families of readings (Logical/Semantic, Practical/Teleological, Law of Nature/Rational Will, Community/Rawlsian) against the spec.
      *   **Style:** Concise, philosophical, practical for teaching. No names/bibliography. No re-treading the four stock examples.

  2.  **Drafting the Specification (Requirements):**
      *   *Requirement 1: Maxim Individuation.* Needs to define what counts as a relevant description.
          *   *Motivation:* Case 2 (City lying) & Case 3 (Whim promise). If "city" is relevant, lying is okay. If "whim" is relevant, promise-breaking is okay.
          *   *Status:* Non-negotiable. Without this, the test is input-sensitive garbage.
      *   *Requirement 2: Contradiction Type.* Must distinguish Contradiction in Conception (CC) vs. Contradiction in Will (CW).
          *   *Motivation:* Case 5 (Credit stealing) vs. Case 1 (Referee). CC makes the act impossible; CW makes the end unachievable or irrational to will.
          *   *Status:* Non-negotiable. Kant distinguishes perfect/imperfect duties.
      *   *Requirement 3: Empirical Sensitivity.* Does the verdict change if facts change?
          *   *Motivation:* Case 4 (Queue > 6). If the world changes (ticketing system), does the moral status change?
          *   *Status:* Negotiable (but tricky). Kant thinks moral law is a priori, but maxims contain empirical conditions.
      *   *Requirement 4: Omissions/Indifference.* Must handle doing nothing or permissive choices.
          *   *Motivation:* Case 7 (Let people sort problems) & Case 10 (Help when suits me).
          *   *Status:* Non-negotiable. Imperfect duties are often omissions.
      *   *Requirement 5: First-Person Usability.* Can a novice use it without knowing the answer key?
          *   *Motivation:* General Purpose. Case 9 (Tax fiddling) is hard to judge without knowing if "most others" is a stable condition.
          *   *Status:* Non-negotiable (per the prompt's purpose).
      *   *Requirement 6: Scope of Universalization.* Who is included in "everyone"?
          *   *Motivation:* Case 1 (Referees only?) & Case 6 (Unique key holder).
          *   *Status:* Non-negotiable.
      *   *Requirement 7: The "Extra Premise".* Where does the necessity come from for CW cases?
          *   *Motivation:* Case 7 (Nature subsists). Why *must* we will the end of others?
          *   *Status:* Non-negotiable for CW cases.

  3.  **Addressing the Tension (Description Sensitivity):**
      *   *The Tension:* "Verdict insensitive to description" vs. "No gerrymandering."
      *   *Analysis:* These *are* jointly unsatisfiable if taken literally. If I describe my maxim as "Lie on Tuesdays," universalizing might work. If I describe it as "Lie," it fails.
      *   *Resolution:* Keep the "No Gerrymandering" constraint. Drop the "Insensitive to description" constraint. Replace it with "Constraint on Relevant Features." The spec must dictate *which* features of the situation belong in the maxim (e.g., "promising" is relevant, "wearing a blue shirt" is not).
      *   *Decision:* The user asked "If that pair really is unsatisfiable, say so and tell me which half to keep." I will say they are unsatisfiable. Keep "No Gerrymandering." Replace "Insensitive to description" with "Principle of Relevant Description."

  4.  **Identifying the Most Exclusionary Requirement:**
      *   *Candidate:* First-Person Usability without Answer Key.
      *   *Reasoning:* Most scholarly readings rely on deep metaphysical commitments (noumenal will, teleological nature) that students can't access in "a few minutes." They require the teacher to explain *why* the contradiction exists. A test a student can run *themselves* excludes almost all sophisticated commentaries.
      *   *Alternative:* The "Four Stock Verdicts" constraint. Many readings fail the non-development examples (e.g., some fail on suicide).
      *   *Selection:* "First-Person Usability... without already knowing the answer." This kills most exegetical reconstructions which assume a hermeneutic circle.

  5.  **Scoring the Four Families:**
      *   *1. Logical/Semantic Contradiction:* (Strict contradiction in terms).
          *   *Score:* Fails Case 5 (Credit stealing isn't logically impossible, just pointless). Fails Case 7 (Omissions don't contradict). Good for Case 2 (Lying promise).
      *   *2. Practical/Teleological Contradiction:* (Ends become impossible).
          *   *Score:* Good for Case 5. Struggles with Case 1 (Referee bribery might still work if everyone does it, just the institution collapses). Struggles with Case 7 (Why *must* I will others' ends?).
      *   *3. Law of Nature/Rational Will:* (What a rational being necessarily wills).
          *   *Score:* Good for Case 7 (Rational will needs help). Good for Case 6 (Unique key). Risky on Case 4 (Empirical facts). Hard for students to apply "what a rational will must have" in minutes.
      *   *4. Community/Rawlsian:* (Could you will this as a public law?).
          *   *Score:* Good for Case 1 (Public trust). Good for Case 9 (Conditional compliance). Might be too political for *Groundwork* II metaphysics. Hard to distinguish CC/CW clearly.

  6.  **Refining the Output:**
      *   *Structure:*
          1.  The Specification (Requirements + Motivation + Status).
          2.  The Tension (Description).
          3.  The Exclusionary Requirement.
          4.  The Scoring.
      *   *Tone:* Professional, direct, pedagogical.
      *   *Check:* Did I use the battery cases? Yes. Did I avoid the four stock examples? Yes. Did I answer the specific questions? Yes.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Correction on Case 6:* The "Unique Key" case challenges the *quantifier* in universalization. If I'm the only one, "everyone" = "me." Does the test collapse? The spec needs to address *counterfactual* universalization (what if *anyone* in that position did it). I need to make sure the spec requires counterfactual generalization, not just literal headcount.
      *   *Correction on Case 4:* The Queue case challenges empirical sensitivity. If the test relies on "crowding," is it moral or pragmatic? The spec needs to demand the contradiction be *normative*, not just *physical*.
      *   *Refining the "Tension":* Be clear. You can't have both "description doesn't matter" and "you can't cheat by describing." You need a rule for *correct* description.
      *   *Refining the Scores:* Keep them brief. "Passes X, Fails Y."

  8.  **Final Review against constraints:**
      *   "No names needed, no bibliography." -> Check.
      *   "Don't just walk me through the four stock examples." -> Check.
      *   "Briefly — a few lines, not an essay — score the four families." -> Check.
      *   "For each requirement... give me the case from that battery." -> Check.

  9.  (Final Polish of the text to ensure clarity and punchiness.) *Self-correction: Ensure the distinction between CC and CW is linked to the specific cases provided (e.g., Case 5 is clearly CW territory, Case 1 is CC territory usually).*

