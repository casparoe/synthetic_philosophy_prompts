      *   Can we have Agent-Relative Constraints + Collective Optimality + Outcome Sensitivity?
      *   Usually, no. If you prioritize Agent-Relative Constraints, you sacrifice Collective Optimality (by definition of the paradox).
      *   *Crucial Insight:* The resolution *must* deny that Collective Optimality is the sole metric of moral success. Therefore, a desideratum demanding "Collective Optimality" is incompatible with "Agent-Centered Restrictions."
      *   *Correction:* The desideratum shouldn't be "Achieve Collective Optimality." It should be "Explain why Collective Optimality is not the sole metric."
      *   *Wait, the prompt asks for desiderata a resolution must meet.* A successful resolution must explain the tension. So, a desideratum is: *Must account for the divergence between individual rationality and collective optimality without labeling individual rationality as irrational.*

