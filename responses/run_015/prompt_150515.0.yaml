      *   Section 1: Structural/Logical Constraints (Non-negotiable).
      *   Section 2: Substantive Moral Constraints (Non-negotiable vs. Camp-specific).
      *   Section 3: Decision-Theoretic Constraints.
      *   Section 4: Compatibility Analysis (The "Impossibility" check).

