      *   **Constraint:** Do *not* survey existing authors. Provide the criteria sheet itself.

  2.  **Analyze the "Paradox of Deontology":**
      *   *Core Tension:* Deontology says "Do not kill one even to save five." Consequentialism says "Minimize overall killings."
      *   *The Paradox:* If everyone follows the deontological rule (don't kill), we might get more deaths overall than if everyone violated the rule (kill one to save five in every instance).
      *   *Example:* A world where no one kills innocents vs. a world where everyone kills one innocent to save five others. The latter has fewer deaths, but feels morally repugnant.
      *   *Goal:* A resolution must explain why the deontological constraint is rational/moral *despite* the suboptimal aggregate outcome, without collapsing into consequentialism or becoming irrational.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Category 1: The Agent-Centered Restriction (The Core)*
          *   Need to preserve the idea that *I* have a special reason not to harm, even if my harm prevents more harm by others.
          *   *Desideratum:* Agent-Centered Prerogative/Restriction.
          *   *Reasoning:* Without this, it's just consequentialism.
          *   *Status:* Non-negotiable for a *deontological* resolution.

      *   *Category 2: Acting vs. Allowing (The Mechanism)*
          *   Deontology relies on the doing/allowing distinction.
          *   *Desideratum:* Asymmetry between Commission and Omission.
          *   *Reasoning:* Killing is worse than letting die.
          *   *Status:* Non-negotiable for traditional deontology, but contested by some consequentialists.

      *   *Category 3: Collective Action (The Paradox Source)*
          *   The paradox arises from aggregation. If everyone does X, result Y is bad.
          *   *Desideratum:* Collective Rationality/Consistency.
          *   *Reasoning:* Morality shouldn't be self-defeating on a global scale.
          *   *Status:* Non-negotiable (Morality must be coherent).

      *   *Category 4: Individual Rights (The Intuition)*
          *   Rights function as trumps.
          *   *Desideratum:* Inviolability of Persons.
          *   *Reasoning:* People aren't mere vessels for value.
          *   *Status:* Non-negotiable for deontology.

      *   *Category 5: Decision Theory (The Formalism)*
          *   Causal Decision Theory (CDT) vs. Evidential Decision Theory (EDT).
          *   *Desideratum:* Decision-Theoretic Coherence.
          *   *Reasoning:* Agents shouldn't be money-pumped or act against their own decision rules.
          *   *Status:* Non-negotiable (Logic).

      *   *Category 6: The "Clean Hands" vs. "Good Outcome" Tension*
          *   This is where the unsatisfiability might lie.
          *   *Desideratum:* Outcome Sensitivity (to some degree).
          *   *Reasoning:* If the stakes are high enough (e.g., extinction), absolute constraints seem wrong.
          *   *Status:* Camp-specific (Absolutists vs. Threshold Deontologists).

  4.  **Refining and Categorizing (Non-negotiable vs. Camp-Specific):**
      *   *Non-negotiable:* Internal consistency, preservation of the agent-relative constraint (otherwise it's not deontology), decision-theoretic coherence.
      *   *Camp-specific:* Thresholds (is the constraint absolute?), the scope of the "collective" (who counts?), the weight of outcomes.

