  Your editor is substantially right, though your protagonist's specific vocation offers a salvageable niche. Here are the defeaters, ranked by severity against your systemic-collapse premise.

  1. **The Archive Bias (The Circular Trap).** This is the most damaging evidence. Our definition of 'collapse' relies overwhelmingly on the disappearance of palace archives. When the bureaucracy burns, the record stops. We interpret silence as extinction. But silence is not emptiness. If your novel equates the end of scribal records with the end of civilisation, it mistakes the map for the territory. A proponent of systemic collapse must concede that if evidence relies on elites, the 'collapse' is inherently elite. For a protagonist who is 'nobody', this is fatal unless addressed. It renders the premise circular: we call it a collapse because the people who could write called it one.

  2. **Material Continuity at Settlement Level.** Archaeological surveys in the Argolid and Levant show that while palaces burned, many village sites continued uninterrupted. Pottery styles evolve rather than vanish; housing structures remain similar; isotopic analysis of bones often reveals no significant change in diet or mobility during the transition from Late Bronze to Early Iron. If your protagonist survives the palace burning, their daily caloric intake and social bonds might remain stable. This contradicts the 'cascading failure' narrative for the non-elite. The catastrophe was political, not necessarily biological.

  3. **Regional Variation.** The collapse was not universal. Cyprus and the Levantine coast saw growth precisely as Mycenae and Hattusa fell. Trade routes shifted rather than severed entirely; tin moved via new intermediaries. This challenges the 'systemic' totality. It suggests reorganisation, not apocalypse. To claim a unified collapse ignores those who profited from the vacuum.

  4. **Semantic Drift.** Finally, there is the risk of unfalsifiability. If 'collapse' merely signifies 'loss of complexity' rather than 'population death', the term becomes a tautology. Complexities always fluctuate. If every dramatic change is a collapse, the word loses descriptive power.

  **Verdict:** Your editor is correct that 'collapse' is a narrative category favouring elites. However, you have a loophole. Your protagonist is a *scribe*. For them, the collapse *was* absolute. Their skill became obsolete; their god-kings dead; their medium vanished. The tragedy is not that everyone died, but that a specific way of making meaning did. Write the collapse of the *word*, not necessarily the world. That is historically honest.
