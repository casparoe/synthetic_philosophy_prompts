      **Working Title:** Retrospective Causal Significance and the Logic of Narrative Detail

      **Research Question**
      This project asks whether the explanatory power of historical narrative derives from irreducibly retrospective causal relations or merely from pragmatic coherence. Standard debates assume explanation must be forward-looking. I propose that narrative explanation is distinct because it stabilises counterfactual dependencies backwards from a known outcome. The central hypothesis is that 'accreted detail' in narratives is not decorative but functional: it secures the truth of retrospective causal claims. The project will determine if narratives can be assessed as true or false explanations, rather than merely plausible stories.

      **Context and Critique**
      Existing frameworks leave this question unresolved. The covering-law model treats temporal asymmetry as a defect, demanding forward-looking subsumption under generalisations that erase the specific details narratives retain. Classical narrativism, following Danto and White, secures intelligibility but often retreats from truth-aptitude, treating narrative as a literary form rather than a cognitive instrument. Interventionist accounts of causation capture manipulation but struggle to account for the sequential thickness of historical chains. Contrastivist treatments explain why this outcome rather than that, but do not adequately address why the specific sequence of events matters. Consequently, none explain why adding detail often increases explanatory power in history while decreasing it in nomological science.

      **Argument and Contribution**
      This framing advances the field by linking temporal asymmetry to the puzzle of detail. If narrative explains retrospectively, detail is required to fix the specific pathway upon which the outcome hung. In a law-based model, detail is noise; in a retrospective model, it is the anchor for counterfactuals. This allows me to argue that narrative explanation is truth-apt. A narrative is not just 'illuminating'; it is correct if the retrospective dependencies it asserts hold, and incorrect if they do not. This moves beyond the stalemate of 'science versus art' in history. It permits a realist assessment of narrative without requiring immutable laws. The project argues that the temporal direction of explanation is not a matter of historian preference but reflects the ontological structure of historical causation.

      **Method and Case Studies**
      The research proceeds in three years. Year one establishes the theoretical account, analysing the logic of retrospective significance and defining 'causal detail'. I will need to acquire proficiency in formal causal modelling to rigorously contrast narrative structures with structural equation models; this is a identified learning need. Year two applies the account to two episodes: the outbreak of the First World War (1914) and the Cuban Missile Crisis (1962). These are selected for their dense competing narratives and settled outcomes. Year three synthesises findings and drafts the thesis.

      Testing relies on two thought experiments operationalised against these cases. First, the 'True Chronicle' test: does a complete list of true events, lacking narrative connection, explain the outcome? If no, narrative structure adds explanatory content. Second, the 'False Detail' test: if a narrative relies on a empirically false detail to sustain a causal link, does it cease to explain? If yes, narrative explanation is truth-apt. I will assess rival narratives of the WWI outbreak against these criteria. For instance, if a narrative claims the Kaiser's telegram was decisive, but counterfactual analysis shows the outcome holds without it, the detail is explanatory noise. If the outcome changes, the detail is causal. This distinguishes genuine explanatory detail from mere texture.

      **Outcomes, Risks and Scope**
      Possible conclusions are: (1) Retrospective causal significance is real, making narrative a distinct, truth-apt explanatory form; (2) It is merely pragmatic, collapsing narrative into contrastivist explanation; or (3) It is irreducible but not truth-apt, supporting a narrativist anti-realism. Considerations deciding between them include whether counterfactual dependencies hold independently of the historian's description.

      The project fails if retrospective significance proves to be solely a fact about the historian's vantage point, or if the account collapses into standard interventionism dressed in narrative vocabulary. To avoid scope creep, I will not address the metaphysics of time itself, focusing strictly on explanation. If the causal modelling proves too technical, I will limit formalisation to conceptual analysis. The primary risk is that 'retrospective causation' is incoherent; if so, the project will pivot to analysing why the *illusion* of retrospective causation is functionally necessary for historical understanding. This ensures a viable completion even if the primary hypothesis is falsified.

