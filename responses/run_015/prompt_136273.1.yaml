      *   *Inalienability:* You can't truly give away your natural right/power, only coordinate it. Alienation is a fiction; subordination is reality.
      *   *Democracy:* The "most natural" regime because it aligns closest with individual liberty and collective power. Everyone remains equal in terms of natural right, even if political structures vary.
      *   *Reason & Affect:* Humans are driven by affects (passions). Reason helps align affects toward utility (what is good for all). The state's goal is peace and liberty, which requires managing affects, not just commanding behavior.
      *   *Freedom to Philosophize:* Essential in the *Theological-Political Treatise* (TTP). The state shouldn't control minds, only actions. Coercion of belief produces resentment, not rational agreement.
      *   *Common Notions:* Ideas that are adequate to all minds because they reflect shared properties of reality. They emerge from interaction, not imposition.

  3.  **Analyze Hypothesis 1: Liquid Quadratic Democracy (LQD):**
      *   *Mechanism:* Revocable delegation + Quadratic cost for influence.
      *   *Spinozist Tension:*
          *   *Pro:* Revocability aligns with inalienability. Power isn't transferred; it's lent. The multitude retains the *potentia*. Quadratic costing prevents oligarchy (concentration of *potentia* in few hands), which Spinoza fears (aristocracy/monarchy tend to corrupt).
          *   *Con:* Does mediation dilute the *conatus*? Spinoza worries about representation creating a separate interest (the representatives). But if delegation is fluid and issue-specific, it mimics the "council" model he sometimes hints at.
          *   *Equality:* Spinoza sees natural equality. Does quadratic voting distort this? Actually, it *protects* equality by making dominance expensive. It prevents the "passions" of the wealthy/powerful from overwhelming the rational interest of the many.
      *   *Verdict:* Likely acceptable *if* the revocability is real and immediate. It institutionalizes the fluctuation of the multitude's power.

  4.  **Analyze Hypothesis 2: AI Moderation Layer (Coherence Check):**
      *   *Mechanism:* AI suppresses arguments failing "internal coherence" before legislative record.
      *   *Spinozist Tension:*
          *   *Pro:* The state should foster reason. Passions lead to conflict. Filtering incoherent noise might help the multitude focus on adequate ideas.
          *   *Con:* This is the big one. *Freedom to Philosophize.* Spinoza is adamant: the sovereign controls *actions*, not *judgments*. To judge what is "coherent" or "rational" *before* it enters the public sphere is to control the mind.
          *   *Common Notions:* These emerge *from* the clash of ideas, not *prior* to it. An AI defining coherence imposes an external standard (a "false universal"). It assumes the algorithm possesses adequate ideas, but algorithms are finite modes, likely reflecting the biases of their coders (particular interests).
          *   *Affects:* Suppressing "incoherent" speech might suppress passionate outcry, which is data about the multitude's state. Ignoring it leads to instability.
