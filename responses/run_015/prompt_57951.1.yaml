answer: |-
  ### Part 1: Designer's Logic (The "Empty Combo" Check)

  Before you hand this out, here is the map of how the answers work. I built the questions so that each answer choice points to one of the four views.

  *   **Choice A** = **Hard Precedent Autonomy** (The earlier competent self is the "real" person; their written word is law).
  *   **Choice B** = **Best-Interests Override** (The current self's happiness/suffering is what matters; the past self is gone).
  *   **Choice C** = **Relational/Narrative** (Identity is shared; the family and the story of the life decide).
  *   **Choice D** = **Skeptical** (The document is just evidence, not a command; we weigh all factors now).

  **Are there empty combos?**
  Yes. A "Hard Precedent" view that only applies to medical care but not to art (or vice versa) is theoretically possible but practically unstable. If the earlier self owns the future, they own *all* of it. If you score high on A for the Professor (medical) but high on B for the Artist (non-medical), you aren't holding a consistent philosophical view; you're just reacting to the stakes. The quiz assumes you want a consistent rule for *why* you decide.

  **Can the quiz separate all four views?**
  **Warning:** It is very hard to separate **Relational (C)** and **Skeptical (D)**.
  *   *Why?* In practice, both often result in ignoring the strict text of the directive.
  *   *The Difference:* The **Relational** view asks, "What fits the family story?" The **Skeptical** view asks, "What seems reasonable given all the evidence?"
  *   *In the Quiz:* I tried to separate them by making Option C explicitly about *family consensus* and Option D explicitly about *flexible judgment*. If a participant scores mixed C's and D's, they likely blend these two views (which most caregivers do).

  ***

  ### Part 2: The "Who Decides?" Quiz

  **Instructions:** Read each story. Pick the **one** answer that feels most right to you. Don't overthink it—go with your gut.

  **1. The Professor (Pneumonia)**
  A professor wrote a directive: "If I get dementia, do not treat me for life-threatening infections." She now has moderate dementia. She seems cheerful. She gets pneumonia. She coughs and looks uncomfortable but smiles between coughs.
  *   **A.** Do not give antibiotics. She said no, and she was the only one who knew what she really wanted.
  *   **B.** Give antibiotics. She is happy right now; treating her keeps her here with us.
  *   **C.** Call a family meeting. They need to decide what fits the kind of life she has lived.
  *   **D.** Use the directive as a guide, but talk to the doctor about her actual quality of life today before deciding.

  **2. The Bipolar Man (Ulysses Contract)**
  A man with bipolar disorder signs a paper while stable: "If I get manic, lock me up even if I fight it." Later, he goes manic. He feels great, says he is cured, and refuses the hospital. He is spending money recklessly.
  *   **A.** Hospitalize him. He made a deal when he was sane, and he has to keep it.
  *   **B.** Do not hospitalize. He is saying no right now, and locking him up hurts him.
  *   **C.** Talk to his partner and kids. They know how his mania usually affects the whole family.
  *   **D.** Look at how dangerous he is right now. The paper matters, but the current risk matters more.

  **3. The Artist (Sketchbooks)**
  An artist leaves a video: "If I get dementia, burn my unfinished sketches. I don't want people seeing my bad work." Later, with dementia, she spends hours happily looking through those sketchbooks.
  *   **A.** Burn them. It was her reputation, and she had the right to protect it.
  *   **B.** Keep them. She loves them now, and destroying them would upset her.
  *   **C.** Keep them for the family. They are part of her history, even if she wanted them gone.
  *   **D.** Hide them for now. The video is a wish, not a law, and there's no rush to destroy them.

  **4. The Feeding Tube**
  A woman's directive says: "No artificial food if I can't recognize my family." She is in a coma. She cannot recognize anyone. Her stomach still digests food.
  *   **A.** No tube. She drew a line in the sand, and we must respect it.
  *   **B.** Give the tube. Being alive is a basic good, and she isn't suffering.
  *   **C.** Ask her children. They know if "recognizing family" was her way of saying "no life like this."
  *   **D.** Consult the medical team on her prognosis. The directive is too vague to follow blindly.

  **5. The Pain Meds**
  A man's directive says: "Keep me pain-free even if I'm asleep all day." He is now demented. He grimaces when moved but wakes up happy to eat ice cream if he isn't medicated heavily.
  *   **A.** Heavy meds. He said pain-free was more important than being awake.
  *   **B.** Light meds. He enjoys the ice cream; being awake seems to matter more to him now.
  *   **C.** Ask his wife. She knows if he was always a "tough it out" guy or a "comfort first" guy.
  *   **D.** Try a middle dose. The directive is a preference, not an order to overdose him.

  **6. The Scribbled Note**
  A woman has a formal directive refusing nursing homes. Two weeks before she loses capacity, she scribbles on a napkin: "Actually, take me to the sunny one." She is already confused.
  *   **A.** Ignore the napkin. The formal paper signed when she was competent counts.
  *   **B.** Follow the napkin. It's her most recent wish, and maybe she really wants the sun.
  *   **C.** Ask the kids. They know if this was a real change of heart or just confusion.
  *   **D.** Weigh both notes. The formal one shows long-term values, the napkin shows a recent whim.

  **7. The New Friend**
  A demented man makes friends with a neighbor who used to be his enemy. His directive says: "Protect me from people who harmed me." The neighbor is now kind to him.
  *   **A.** Keep them apart. The directive says the neighbor is harmful based on the past.
  *   **B.** Let them be friends. The man is happy now, and the past doesn't matter to him.
  *   **C.** Talk to the family. They know if the neighbor is truly safe or just pretending.
  *   **D.** Watch them interact. The directive is about safety, and right now he seems safe.

  **8. The Risky Walk**
  A woman's care plan says: "Prevent falls at all costs." She wants to walk in the garden alone. She might fall.
  *   **A.** Stop her. The plan says prevent falls, and safety comes first.
  *   **B.** Let her walk. The joy of the garden is worth the risk of a fall.
  *   **C.** Ask the family. Do they want her safe, or do they want her free?
  *   **D.** Assess her balance. The plan is a goal, not a rule that bans all risk.

  **9. The Magic Paper**
  Imagine a family is fighting. One side holds the advance directive. What is that paper?
  *   **A.** A contract. It binds the future just like a will binds money.
  *   **B.** A letter. It shows what she used to want, but she is a different person now.
  *   **C.** A clue. It helps the family understand her story, but they decide together.
  *   **D.** An opinion. It is one piece of information among many for the doctor/caregiver.

  ***

  ### Part 3: Scoring Key & View Mapping

  Count up how many **A's, B's, C's, and D's** you selected. Your highest score indicates your "gut philosophy."

  #### **Mostly A's: Hard Precedent Autonomy**
  *   **The Gist:** The competent "earlier self" is the boss.
  *   **Why:** You believe a person's life is a single project. If we let the demented self override the competent self, we break the promise of who that person was. The directive is a binding contract.
  *   **Watch out for:** Ignoring the suffering of the person right in front of you.

  #### **Mostly B's: Best-Interests Override**
  *   **The Gist:** The "later self" is the boss.
  *   **Why:** You believe that once the mind changes, the old person is gone. The only thing that matters is minimizing suffering and maximizing happiness for the person currently in the body.
  *   **Watch out for:** Disrespecting the deep values the person held for 80 years because of a few happy months.

  #### **Mostly C's: Relational / Narrative**
  *   **The Gist:** The "Family Story" is the boss.
  *   **Why:** You believe we don't exist in bubbles. Who we are is defined by our relationships. The family knows the "real" person better than a piece of paper or a confused patient does. Decisions must fit the life story.
  *   **Watch out for:** Family members projecting their own guilt or wishes onto the patient.

  #### **Mostly D's: Skeptical**
  *   **The Gist:** The "Situation" is the boss.
  *   **Why:** You don't think a piece of paper has magic power. It's evidence of what they wanted, but circumstances change. You weigh the directive against medical advice, current mood, and safety every single time.
  *   **Watch out for:** Decision fatigue. Without a clear rule (like A or B), every choice becomes a hard debate.

  #### **Mixed Scores (Especially C & D)**
  *   **The Gist:** You are a Pragmatist.
  *   **Why:** Most caregivers fall here. You see the truth in the family story (C) but also know you need flexibility (D). This is not a "wrong" score; it reflects the reality that these cases are messy.
  *   **Note:** If you mixed **A and B**, you might be struggling with the core conflict: *Is the person the same over time, or different?* That is the exact tension this workshop is trying to solve.
