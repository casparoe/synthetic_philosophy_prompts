      *   *Best-Interests Override (BIO):* The current self's experience matters most. If they are happy/suffering now, that trumps a past abstract wish. (Key: Current well-being, minimizing suffering).
      *   *Relational/Narrative (RN):* It's about the web of relationships and the story of the life. What fits the family dynamic? What honors the *whole* life, not just the signature or the smile? (Key: Context, Family input, Identity continuity).
