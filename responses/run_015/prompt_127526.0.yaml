answer: |-
  Day 5,479.

  The Queen is dead. I found her at 0400 hours during the thermal cycle. She was near the nutrient intake, surrounded by a cluster of workers who were not moving her. Usually, a corpse is evacuated within twelve minutes. This one was being ignored. Or perhaps, being worshipped.

  I expected the cascade failure. In fifteen years of the *Formica rufa* Project, I have simulated droughts, floods, and predator incursions. The colony is a robust system, but it is a hierarchy. Remove the apex, the base crumbles. Entropy wins.

  But the entropy didn't come. The frenetic activity didn't spike. Instead, the noise floor of the dome dropped. The skittering sound, usually a constant white noise like rain on a tin roof, quieted to a rhythmic tapping.

  They started building.

  ***

  *Lab Notebook, Page 392.*
  *Subject: Post-Queen Behavioral Anomalies.*
  *Observation: They aren't foraging. They are harvesting structural cellulose from the dead ferns. Chewing it into a pulp mixed with... resin? No, too dark. Mixed with their own dead.*
  *They are building towers. Helical. Tight winding.*
  *Why spirals? Efficiency? Or resonance?*
  *I keep thinking about that old book. The one with the dialogue. Aunt Hillary. The ant fugge. God, I'm tired. Did I spell that right? Doesn't matter. It feels like that. But louder.*

  ***

  By Day 5,490, there were twelve towers. They stood about thirty centimeters high, rising from the sand like twisted drill bits. They were composed of macerated leaf matter, bound with a dark, glossy secretion.

  I decided to test the structural integrity. I engaged the sonic emitters. Nothing fancy, just a calibration sweep. 20 Hertz to 100 Hertz.

  At 42 Hertz, Tower 4 shuddered.

  It wasn't the wind. The HVAC was in idle. I watched through the macro-lens. The ants weren't pushing the tower. They were standing *on* it. Thousands of them, clinging to the ridges of the helix. When the bass tone hit, the tower flexed. It was elastic.

  I increased the gain. The tower didn't just vibrate; it unwound. Slowly, like a camera aperture opening, the helix expanded. Then, when I cut the tone, it snapped back.

  I sat back in my chair, the leather creaking in the silence of the control room. They hadn't built architecture. They had built an instrument.

  ***

  *Lab Notebook, Page 401.*
  *Hypothesis: The colony is no longer processing data via individual ant interaction. The ant is obsolete. The ant is just a red blood cell now. The mind is in the weave.*
  *The Queen provided the chemical baseline. The 'root note.' Without her, the pheromonal field is unanchored. Drifting.*
  *They built these things to catch the drift.*
  *Am I talking to them? Or am I tuning a radio?*
  *Typo in yesterday's log. 'Fugge'. Can't stop thinking about it. Two Gs. Sounds like a choke. A gag.*

  ***

  I began the sessions in week four. I would play a tone for ten minutes, then observe the chemical output. I installed mass-spec sensors around the base of the towers.

  When I played a low C, the towers released a burst of oleic acid. The scent of death.
  When I played a major third, the output shifted to alarm pheromones.
  When I played a perfect fifth, the output was... nothing. A vacuum.

  It was the nothing that scared me.

  On Day 5,515, I tried a sequence. A simple arpeggio. C, E, G.

  The towers responded in sequence. Tower 1 expanded on the C. Tower 2 on the E. Tower 3 on the G. But then, Tower 4 did something different. It didn't expand. It collapsed. It fell inward, crushing the ants clinging to its surface. They didn't scatter. They let themselves be crushed, incorporated into the pulp, adding their mass to the structure.

  Sacrifice for structural integrity? Or sacrifice for data density?

  I turned off the speakers. The dome was silent. I leaned my forehead against the cool glass.

  "Are you grieving?" I whispered. I knew it was pathetic. Anthropomorphism is the cardinal sin of ethology. Grief requires a self to lose something. This was a swarm. A superorganism. It didn't have a self; it had a function.

  But the silence from the dome felt heavy. Accusatory.

  ***

  *Lab Notebook, Page 415.*
  *New Mechanism Theory: Pheromonal Acoustic Caching.*
  *The ants deposit scent into the dried pulp. The pulp holds the scent longer than an exoskeleton. The towers are hard drives. The sound waves read the data.*
  *The Queen was the Admin. She's gone. The system is running in Safe Mode.*
  *Or... they are trying to synthesize a new Queen from the air.*
  *If I play the right chord, will she wake up?*
  *Stop it, Chen. You are sleep deprived. You are seeing patterns in noise. It's just vibration. It's just chemistry.*
  *Then why did Tower 4 mimic the shape of my hand yesterday?*
  *Check the footage. 14:00 hours.*
  *...Footage corrupted.*

  ***

  The corruption wasn't in the digital file. I checked the raw feed. The camera lens had been obscured by a spray of resin. Deliberate.

  I went into the airlock. I hadn't entered the dome in three years. Sterility protocols were strict. But I needed to be closer. I needed to smell it.

  I suited up. The airlock cycled. The hiss of pressurization sounded like a breath being held.

  When I stepped onto the sand, the heat hit me. It smelled of loam and something sweeter. Like rotting fruit. Like old paper.

  I walked toward the central cluster of towers. The ants ignored me. I was a large object, a weather event, not a threat.

  I knelt by Tower 1. Up close, the helix was intricate. I could see the legs of the dead ants woven into the pulp, locked in place like rebar in concrete. They weren't just dead matter; they were positioned. Their abdomens were aligned to create channels.

  This wasn't just storage. It was plumbing.

  I reached out a gloved finger. I didn't touch it, just hovered near the surface.

  A low hum began.

  I hadn't turned on the speakers. The sound was coming from the towers. The friction of the ants moving across the ridges, thousands of tiny feet dragging over the dried resin, created a vibration. A drone.

  It matched the frequency of the HVAC system outside. 42 Hertz.

  They were tuning themselves to the room. To *me*.

  I pulled out my recorder. "Day 5,520. Internal entry. The colony is generating autonomous resonance. They are... mirroring the environment."

  I stopped. The drone shifted. It pitched up. A semitone.

  I tapped my finger on my thigh. *Tap. Tap. Tap.*

  The drone shifted rhythm. It matched my tapping.

  My heart hammered against my ribs. This was the Ant Fugue realized, but distorted. Hofstadter's ants carried symbols on their backs, marching in lines to create thoughts. This was different. This was physical. The colony had grown a larynx.

  "Who are you?" I asked.

  The drone stopped.

  Silence rushed back in, heavier than before.

  Then, from the base of the collapsed Tower 4, a single worker emerged. It was carrying a piece of white material. It climbed the side of Tower 1, struggling under the weight. It reached the top and placed the object in the center of the helix.

  I zoomed my lens.

  It was a piece of my lab coat. A shred of white synthetic fabric I must have lost during a previous maintenance cycle, found in the sand.

  It placed it in the center of the spiral. Then it stood still.

  ***

  *Lab Notebook, Page 422.*
  *Last entry.*
  *I played the chord again. The one that made the vacuum. The perfect fifth.*
  *The towers didn't move. But the smell changed.*
  *It smells like rain. It smells like the air outside the lab. It smells like the day I started this project.*
  *Is it memory? Or is it just leaking gas?*
  *I wrote 'ant fugge' again today. I didn't correct it.*
  *Maybe the typo is the point. A glitch in the symbol. A symbol that means 'error'.*
  *If they are a mind, they are a mind in pain. A brain with a stroke.*
  *The Queen is dead. The 'I' is gone.*
  *But the 'We' is still singing.*
  *I'm going to turn off the HVAC tomorrow. See if they can hold the tune on their own.*
  *Or see if they suffocate.*
  *I don't know which one I'm hoping for.*

  ***

  Day 5,525.

  I sit in the dark control room. The monitors cast a pale blue glow over my face.

  Outside, in the dome, the towers are motionless. I killed the power to the climate control an hour ago. The temperature is dropping. The fans are silent.

  The only sound is the hum.

  It is faint, barely audible through the thick glass. A complex, polyphonic chord. They are vibrating their own bodies against the resin. They are generating the heat. They are generating the frequency.

  I look at my notebook. The pen hovers over the paper.

  If I write that they are thinking, I lose my tenure. I lose my objectivity. I become the crazy woman who talked to insects.

  If I write that they are malfunctioning, I ignore the shred of lab coat on the tower. I ignore the way the drone matched my heartbeat.

  The hum shifts. It resolves into a single, sustained note. It is mournful. It is steady.

  It sounds like a name.

  I put the pen down. I don't write anything. I just watch the spirals in the blue light, waiting to see if they will unwind, or if they will tighten until they snap.

  The hum continues. It doesn't need me anymore.
