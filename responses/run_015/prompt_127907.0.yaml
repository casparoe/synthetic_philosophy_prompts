  # Joint Methodological Statement: Historical Jesus Research & Social Memory Theory
  **Submitted by:** [NT Student Name] & [Sociology Student Name]
  **Course:** Methods Seminar in Biblical Studies
  **Date:** October 24, 2023

  ## I. Agreed Claims
  *Despite disciplinary divergences, the undersigned agree on the following foundational premises regarding the study of Christian origins:*

  1.  **Existence:** We operate under the working hypothesis that Jesus of Nazareth was a historical figure in first-century Galilee and Judea, though we differ on the extent to which his specific agency can be isolated from later tradition.
  2.  **Mediation:** All available data regarding Jesus is mediated through texts composed by communities of faith decades after his death. There is no unmediated access to the "voice" of Jesus.
  3.  **Limitations of Criteria:** The standard criteria of authenticity (e.g., dissimilarity, embarrassment, multiple attestation) are heuristic tools, not algorithmic proofs. They cannot yield mathematical certainty.
  4.  **Contextual Necessity:** Any reconstruction of Jesus must be contextually plausible within Second Temple Judaism; a figure divorced from this matrix is historically untenable.
  5.  **Function of Memory:** The texts preserve not only potential historical data but also the theological and social needs of the early communities that preserved them. History and memory are intertwined, not mutually exclusive.

  ## II. Disagreements Table
  *Where we diverge on the utility and epistemological status of historical-critical methods.*

  | Issue | Criteria Optimist (NT Studies) | Social Memory Skeptic (Sociology of Religion) |
  | :--- | :--- | :--- |
  | **Primary Function of Criteria** | Criteria act as **probabilistic filters**. While imperfect, they allow us to sift later theological accretions from earlier tradition, isolating a "minimal core" of authentic material. | Criteria act as **hermeneutical circles**. They often assume the very conclusion they seek to prove (e.g., assuming we know what "embarrassing" means to the early church). |
  | **Nature of the Texts** | Texts contain **tradition units** that can be isolated and dated. With enough cross-referencing, we can peel back the layers to find the event behind the text. | Texts are **memory artifacts**. They reflect how the community *remembered* Jesus, not necessarily what Jesus *did*. The "layer" is the community, not the event. |
  | **Role of Bias** | Bias is a **contaminant** that can be mitigated. If a saying runs against the grain of the early church (Embarrassment), it is less likely to be invented. | Bias is **constitutive**. The community did not preserve "facts" neutrally; they preserved what was functional. "Embarrassment" is often retrojected by modern readers. |
  | **Goal of Research** | To reconstruct a **profile of the historical agent** (what Jesus likely said/did) distinct from the Christ of faith. | To reconstruct the **trajectory of memory** (how and why Jesus was remembered this way) rather than chasing an inaccessible agent. |

  ## III. Methodological Cruxes
  *We identify two specific structural problems where our methods yield incompatible results.*

  ### A. The Threshold Problem
  **The Issue:** Does satisfying multiple criteria increase historical confidence linearly, or does it compound hidden assumptions?
  *   **Optimist View:** Meeting multiple criteria (e.g., Multiple Attestation + Contextual Plausibility) creates a "cumulative case." Each criterion acts as an independent check, raising the probability that a tradition is authentic.
  *   **Skeptic View:** This is **assumption stacking**. If the criteria themselves rely on biased premises (e.g., that the early church wouldn't invent a messiah crucified by Rome), piling them up doesn't increase confidence; it merely multiplies the points of failure.
  *   **Agreed Test Case:** **The Baptism of Jesus by John.**
      *   *Optimist Prediction:* If the Threshold Problem is solvable, the baptism stands as secure because it meets Embarrassment (why subordinate Jesus to John?), Multiple Attestation (Mark, Q, Josephus?), and Contextual Plausibility (John's movement is historically attested).
      *   *Skeptic Prediction:* If the Threshold Problem holds, the baptism is merely a "foundational memory" required for the community to explain the transition from John's movement to Jesus's. The criteria only prove the story was *useful*, not that it *happened*.

  ### B. The Control Case Problem
  **The Issue:** Can we calibrate the criteria against a known fabrication to see if they correctly identify it as false?
  *   **Optimist View:** We can use **analogous figures** (e.g., Honi the Circle-Drawer or Hanina ben Dosa) as controls. If the criteria distinguish between the traditions surrounding Honi and Jesus, they have discriminatory power.
  *   **Skeptic View:** This is a **false control**. We do not have "video footage" of Honi either; we only have later rabbinic memories of Honi. We cannot test the criteria against a known invention because we lack a baseline of truth for *any* charismatic figure in this period.
  *   **Agreed Test Case:** **The Temple Action (Cleansing).**
      *   *Optimist Prediction:* If the Control Case works, the Temple Action is validated by Multiple Attestation (Mark, John, Gospel of Thomas?) and Contextual Plausibility (prophetic symbolism fits Jeremiah). It passes the "Honi test" of prophetic behavior.
      *   *Skeptic Prediction:* If the Control Case fails, the Temple Action is a "prophetic type" constructed to fit Psalm 118 or Jeremiah 7. The criteria detect "literary coherence," not historical eventhood. We cannot know if this is invented because we lack a control group of non-invented temple protests.

  ## IV. Verbal Disputes & Definitions
  *We acknowledge that part of our disagreement stems from differing definitions of key terms.*

  1.  **"Historical Jesus"**
      *   **NT Definition:** A reconstruction of the individual's actual words and deeds prior to Easter faith.
      *   **Soc Definition:** A modern scholarly construct that claims to represent the past but is inevitably shaped by present questions.
      *   **Resolution:** We agree to use "Historical Jesus" to denote the *modern reconstruction*, while distinguishing it from the "Jesus of Memory" (the figure as experienced by the early communities).

  2.  **"Authenticity"**
      *   **NT Definition:** Derives from the historical agent (ipsissima vox or ipsissima verba).
      *   **Soc Definition:** Derives from the community's authorization (what the community deemed "true" for their identity).
      *   **Resolution:** We will specify whether we are arguing for *agent authenticity* (NT) or *memory authenticity* (Soc) in future claims.

  ## V. Conclusion
  We conclude that the criteria of authenticity are necessary but insufficient. The NT partner maintains they are the best tools available to prevent total agnosticism. The Sociology partner maintains they must be subordinate to social-memory theory to prevent circularity. We agree that future research must stop treating the criteria as a checklist and start treating them as part of a broader ecosystem of memory formation.

