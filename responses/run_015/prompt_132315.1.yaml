answer: |-
  The clinical context and stakes

  As a clinical neuropsychologist assessing post-callosotomy patients, I face the unity question repeatedly during consent interviews, rehabilitation planning, and outcome reporting. The stakes are concrete. Misclassifying a patient as unified when they are dissociated risks violating the autonomy of a silent hemisphere, potentially authorizing procedures one agent accepts while the other resists. Conversely, treating a functionally unified patient as two agents fragments care, complicates legal consent, and may pathologize normal adaptive cross-cueing. This is not a theoretical exercise performed once; it is a recurring daily operational hurdle. Every decision carries consequences for patient safety, legal liability, and the therapeutic alliance. We cannot wait for philosophy to settle the mind-body problem. We need a stable, repeatable method to navigate these assessments without pretending the underlying value judgments do not exist. This procedure provides that structure, acknowledging that clinical classification is always partly normative.

  The procedure

  **Step 1: Assess Integration Markers.** Evaluate the specific domain required for the decision. For cognitive tasks, check for cross-cueing where the speaking hemisphere accurately names objects felt by the non-speaking hand using subtle sensory cues. For motor tasks, check for bimanual cooperation without interference. For narrative tasks, check for consistency in verbal reporting over time. High integration suggests functional unity for this context.

  **Step 2: Assess Dissociation Markers.** Look for evidence of independent processing that cannot be explained by cross-cueing. Key indicators include intermanual conflict where hands perform opposing actions, contradictory affective responses depending on whether stimuli appear in the left or right visual field, and left-hemisphere confabulation that is contradicted by right-hemisphere behavioral withdrawal. If the non-verbal hemisphere acts against the verbal report, mark dissociation high. Specifically note if the left hand attempts to block actions the mouth approves.

  **Step 3: Domain Classification Rule.** Compare the weight of markers within the specific domain. If integration markers outweigh dissociation markers, classify the patient as a Unified Agent for this purpose. If dissociation markers outweigh integration, classify as Dissociated Agents. Do not generalize; a patient can be unified for motor planning but dissociated for emotional preference. Record the classification per domain. This prevents over-applying a global label to specific clinical tasks.

  **Step 4: Value Escalation Point.** When Step 3 yields Dissociated Agents, factual assessment ends. Proceed to value judgment. Determine whose preferences govern. Standard clinical practice prioritizes the verbal left hemisphere for legal consent unless there is imminent physical danger. This step acknowledges that capacity is a normative status, not a biological fact. Document the rationale for prioritizing one hemisphere's output over the other. We decide whose voice represents the patient legally.

  **Step 5: Conflict Resolution Sub-Step.** When different domains yield opposite classifications within a single decision, apply a hierarchy of clinical priorities. Safety and prevention of harm take precedence over autonomy. Autonomy takes precedence over emotional comfort. If the verbal agent consents but the non-verbal agent shows distress without physical risk, proceed with verbal consent but document the dissent. This resolves domain-relative unity by subordinating lower-priority domains to higher-priority clinical obligations. Ensure documentation reflects this hierarchy clearly.

  Worked applications

  **Case 1: Verbal Consent vs. Left-Hand Withdrawal.** Step 1 assesses integration; the patient verbally narrates complete recovery and agrees to surgery. Step 2 assesses dissociation; the left hand consistently pulls away from the examining table and attempts to block the needle. Step 3 classifies this as Dissociated Agents for motor consent because behavioral withdrawal contradicts verbal report. Step 4 escalates to value judgment. Standard practice prioritizes verbal consent for legal validity. Step 5 applies safety hierarchy. Needle insertion is low physical risk compared to refusal of care. Output: Proceed with verbal consent, document left-hand resistance as dissent. The team must acknowledge the motor conflict but legally follow the speech.

  **Case 2: Cross-Cueing vs. Visual Field Emotion.** Step 1 assesses integration; the patient demonstrates flawless cross-cueing for object identification and naming across hemispheres. Step 2 assesses dissociation; the patient reports warm affection toward a spouse when the face appears in the left visual field and cold indifference when it appears in the right. Step 3 classifies Unified Agent for cognition, Dissociated Agents for emotion. Step 4 escalates for emotional goals. Step 5 resolves conflict based on therapy purpose. If the goal is cognitive rehab, treat as unified. If the goal is marital counseling, treat as dissociated. Output: Domain-relative classification. Therapy goals must split accordingly. The team cannot assume emotional unity based on cognitive performance.

  **Case 3: Emotional Dissociation Overridden.** A patient shows clear right-hemisphere fear responses to a procedure but left-hemisphere verbal consent. No physical safety risk exists. Step 1 shows verbal integration. Step 2 shows emotional dissociation. Step 3 classifies Dissociated Agents for emotion. Step 4 escalates. The rule prioritizes verbal capacity for legal consent. Step 5 applies hierarchy. Autonomy overrides emotional comfort. Output: Proceed with procedure. Reasoning: Legal capacity relies on verbal expression. Overriding based on non-verbal emotion sets unsustainable precedent. The team must accept that the right hemisphere's fear is real but not authoritative for consent. This is the unpleasant outcome required by legal and clinical standards prioritizing communicative capacity over affective state. This ensures consistency across patients despite neurological variance. Ignoring verbal consent would undermine the legal framework of capacity. The procedure directs you to treat the dissociation as non-authoritative for consent.

  What the procedure cannot do

  This procedure cannot determine the metaphysical true number of minds present. It operates on functional behavior, not ontological reality. It cannot resolve whether consciousness is fundamentally unified or plural. The classification is pragmatic, not truth-conditional. It cannot replace an ethics board. Complex cases involving significant risk or ambiguous capacity require formal review. The procedure standardizes initial assessment but does not absolve clinicians of responsibility. It marks limits explicitly where factual assessment stops and value judgment begins. Users must accept that the output is a clinical tool, not a philosophical solution. The procedure manages uncertainty; it does not eliminate it. It provides a consistent way to act when the science of consciousness remains incomplete. It is always a bridge between neuroscience and law.

  Judgment calls in procedural clothing

  Step 3 weighting is a judgment call dressed as fact; deciding which marker outweighs another is subjective. Step 4 prioritization of verbal report is a legal convention, not a biological necessity. Step 5 hierarchy prioritizes safety and autonomy based on cultural values, not neural data. These steps look procedural but embed ethical choices. The team must recognize these flags to avoid mistaking policy for science. Transparency about these calls is critical for ethical practice.
