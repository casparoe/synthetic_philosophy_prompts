      *   **Aumann's Agreement Theorem:** Rational agents with common priors cannot agree to disagree on probabilities.
      *   **Key Distinction:** *Speculation* (betting on beliefs) vs. *Hedging/Risk Sharing* (trading due to different risk profiles/endowments).
      *   **Key Distinction:** *Zero-Sum* (pure bets) vs. *Positive-Sum* (investment, insurance, liquidity provision).

