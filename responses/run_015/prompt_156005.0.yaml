          2.  *The Drift Problem:* If the badness is about the loss of the "collective afterlife" (future generations valuing what we value), then a scenario where humanity survives but values change completely ("drift") should be just as bad as extinction. But intuitively, extinction seems worse, or at least the "drift" case shouldn't be *as* bad as extinction.
