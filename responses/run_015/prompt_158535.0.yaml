answer: |-
  # JOINT STATEMENT ON THE NORMATIVE STRUCTURE OF PROMISING
  **Adversarial Collaboration Outcome | Reading Group Session 4**
  **Signatories:** The Practice Camp (PC) & The Assurance Camp (AC)

  ## I. AGREED CLAIMS
  *Both parties affirm the following propositions as necessary conditions or structural features of promissory obligation. These claims are intended to distinguish promissory norms from general moral duties.*

  1.  **Pro Tanto Force:** Promissory obligations are *pro tanto* rather than absolute. They generate decisive reasons for action in ordinary contexts but can be overridden by sufficiently weighty competing moral considerations (e.g., preventing severe harm).
  2.  **Non-Consequentialist Structure:** The obligation is not exhausted by the good consequences of keeping the promise. A promisor has a reason to keep a promise even in a specific instance where breaking it would produce slightly better overall utility, provided the threshold for overriding (see Claim 1) is not met.
  3.  **Communicative Uptake:** A promise cannot be made unilaterally in a vacuum. Some form of communication to the promisee (or relevant audience) is required to bring the obligation into existence. Private resolutions do not count as promises.
  4.  **Distinctness from General Harm:** The wrong of breaking a promise is not reducible to the general duty not to harm or disappoint. One can wrong a promisee by breaking a promise even if the promisee never finds out and suffers no psychological disappointment (contingent on Crux III.c).
  5.  **Directedness:** The obligation is *directed* toward the promisee. The promisee occupies a distinctive normative position regarding the performance of the act (e.g., regarding release or blame) that third parties do not automatically share.

  ## II. REMAINING DISAGREEMENTS
  *The parties acknowledge that while they agree on the structure of the obligation, they disagree on its metaphysical source. The table below isolates these disagreements.*

  | Topic | Practice Camp (PC) Formulation | Assurance Camp (AC) Formulation | Assessment |
  | :--- | :--- | :--- | :--- |
  | **Source of Obligation** | The obligation is constituted by the rules of a social practice. To promise is to invoke a convention that creates a duty. | The obligation is constituted by the normative power to invite reliance. To promise is to provide assurance that triggers a principle of fidelity. | **Genuine.** Disagreement on whether the institution precedes the duty or the moral transaction precedes the institution. |
  | **Role of Convention** | The convention is a *precondition*. Without a background practice of promising, the speech act "I promise" is inert. | The convention is *evidentiary*. It facilitates assurance but is not strictly necessary; assurance can be generated via other means. | **Genuine.** Disagreement on the possibility of "state of nature" promising. |
  | **Third-Party Standing** | Third parties may blame a promise-breaker because the breaker has violated a public rule that sustains a socially valuable institution. | Third parties may only blame derivatively. The primary wrong is to the promisee; third-party blame is parasitic on the promisee's standing. | **Genuine (mostly).** Overlaps with the "Directedness" claim, but diverges on the *scope* of public accountability. |

  ## III. CRUXES & TEST CASES
  *Settling the following sub-questions would significantly shift the dialectic. For each crux, we have selected a concrete, invented case. Each side has pre-committed to a prediction.*

  ### Crux A: The "One-Off" Exchange
  **Question:** Can promissory obligation arise in a one-off exchange between two people with no shared practice behind them?
  **Case: *The Desert Strangers***
  Two individuals from cultures with no concept of "promising" meet in a neutral desert. One is dying of thirst. The other says, "I give you my word I will return with water," using a gesture neither has used before but which is clearly intended to bind the speaker. The speaker returns but considers keeping the water for themselves.
  *   **PC Prediction:** No promissory obligation exists. The speech act fails to hook onto any constitutive rules. The speaker may have a duty of rescue, but not a *promissory* duty.
  *   **AC Prediction:** Promissory obligation exists. The speaker successfully invited reliance and provided assurance. The lack of prior convention is irrelevant to the moral transaction.

  ### Crux B: Release vs. Waiver (Third-Party Standing)
  **Question:** When a promisee releases a promisor, does this extinguish the obligation entirely, or merely waive the promisee's right to complain (leaving third parties free to blame)?
  **Case: *The Silent Beneficiary***
  A promises B to visit B in the hospital every day. B, feeling burdensome, tells A, "You are fully released; do not come." A stops visiting. C (B's sibling) blames A for abandoning B, arguing B's release doesn't matter because the practice of visiting supports family stability.
  *   **PC Prediction:** C has standing to blame A. The practice of promising (and family support) is a public good. B can waive their *claim*, but A still violated the rule of the practice which C has an interest in upholding.
  *   **AC Prediction:** C lacks standing to blame. The obligation was grounded in B's assurance. Once B withdraws the invitation to rely, the reason for A's action vanishes. No one is wronged, so no one can blame.

  ### Crux C: The Secret Breach
  **Question:** Does a promise nobody could ever detect your breaking generate a promissory reason at all?
  **Case: *The Silent Ashes***
  A promises a dying woman B to burn her private letters. B dies immediately. A keeps the letters. No one else knows the promise existed, no one knows the letters exist, and keeping them harms no living person.
  *   **PC Prediction:** A has violated a promissory obligation. The rule of the practice ("keep your promises") was violated. The wrong is against the practice itself, regardless of detection.
  *   **AC Prediction:** A has not violated a *promissory* obligation (though perhaps a duty of respect). Promissory obligation is tied to the control of expectations. Since B cannot hold an expectation (being dead) and no one else was assured, the specific promissory reason evaporates.

  ### Crux D: Directedness & The Eavesdropper
  **Question:** Is the obligation directed strictly to the addressee, or to anyone who forms an expectation based on the act?
  **Case: *The Open Window***
  A speaks to B in a room, saying "I promise to pay you $100." A knows C is eavesdropping outside the window and intends for C to hear this (A wants C to rely on A's liquidity). C relies. A does not pay B. C is harmed by the reliance.
  *   **PC Prediction:** A owes nothing to C. The promissory act was addressed to B. C is a bystander. The rules of the practice require address for obligation.
  *   **AC Prediction:** A owes a promissory-style obligation to C. A intentionally induced reliance in C. The obligation tracks the assurance given, not merely the grammatical addressee.

  ### Crux E: Content-Independence & Infected Practice
  **Question:** Is the reason for action content-independent (based on the rule/act) or dependent on the moral legitimacy of the assurance?
  **Case: *The Cult Exit***
  A is a member of a high-control group with a robust internal promissory practice. A promises the Leader B that A will not leave the compound. The practice is real and understood, but the group's rules are coercive and morally rotten. A considers leaving.
  *   **PC Prediction:** A has a *promissory* obligation (pro tanto), generated by the real practice, but it is overwhelmingly overridden by the moral right to exit. The obligation exists but is defeated.
  *   **AC Prediction:** A has *no* promissory obligation. One cannot provide valid assurance over something one has no moral right to control (one's own exit). The "obligation" is void ab initio, not merely overridden.

  ## IV. VERBAL DISPUTE ANALYSIS
  **Diagnosis:** A portion of the dispute is verbal, specifically regarding the definition of the word "Promise."
  *   **The Verbal Chunk:** PC defines "Promise" as *an act within a constitutive convention*. AC defines "Promise" as *an act that creates a binding assurance*.
  *   **Why it's verbal:** In *The Desert Strangers* (Crux A), PC says "No promise occurred" (true by their definition). AC says "A promise occurred" (true by their definition). They agree on all non-normative facts (words were spoken, reliance was invited) and mostly on the moral outcome (A shouldn't keep the water), but they label the obligation differently.
  *   **The Substantive Remainder:** The disagreement becomes genuine when it affects *third-party standing* (Crux B) and *voidness vs. overriding* (Crux E). If PC is right, third parties have standing to enforce promises even after release. If AC is right, they do not. If PC is right, the Cult member breaks a promise (but is justified); if AC is right, they break no promise at all. This affects moral residue and guilt.

  ***

  ## DRAFTER'S NOTE (Confidential)

  **1. The Likely Refusal:**
  I suspect the **Assurance Camp (AC)** will hesitate to sign **Agreed Claim #4 (Distinctness from General Harm)**, specifically the clause: *"One can wrong a promisee... even if the promisee never finds out."*
  *   **Reason:** This smells too much like the Practice View's "rule violation" account. For the AC, the wrong is essentially *relational*. If the promisee never knows, and is dead (like in *The Silent Ashes*), the AC wants to say the *promissory* wrong vanishes, leaving only a duty of respect or integrity.
  *   **Argument to Withdraw It:** Push the *Silent Ashes* case hard. If the AC admits there is *no* promissory wrong in that case, they cannot sign Claim #4 as written. They will want to amend it to: "One can wrong a promisee... even if the promisee suffers no *material* harm," removing the "never finds out" clause.

  **2. The Fake Compromise:**
  The most dangerous formulation is **Agreed Claim #3 (Communicative Uptake)**.
  *   **Why it's empty:** Both sides sign "Uptake Matters," but they mean fundamentally different things.
      *   **PC means:** "The performative must be recognized as a move in the game."
      *   **AC means:** "The assurance must be successfully received and understood."
  *   **The Risk:** In *The Open Window* (Crux D), the PC says uptake failed for C (no address). The AC says uptake succeeded for C (assurance received). They both sign Claim #3, but it does no work in resolving Crux D. It papers over the disagreement about *who* counts as a recipient of uptake. We are kicking this can down the road to the "Directedness" crux, but Claim #3 gives a false sense of consensus on the mechanism of communication.
