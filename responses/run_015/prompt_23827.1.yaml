      Justification: The applicant's strength in stat mech aligns with the department's historical strength in condensed matter (Anderson's legacy). Emergence is physics.
      Concession: The concern about foundational breadth is valid; a physics PhD requires understanding the micro-foundations even if working on macro Phenomena.
      Condition: Require specific graduate QFT or advanced quantum mechanics coursework within the first year.
      Risk: The candidate might struggle with the added load or feel constrained.

