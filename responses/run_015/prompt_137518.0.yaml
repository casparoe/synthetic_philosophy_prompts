answer: |-
  # Seminar Handout: Operationalizing the Great Divergence
  **Topic:** From Rough Question to Research Design
  **Context:** First-Year PhD Seminar on Historical Explanation

  ## The Decision Tree

  Start with the rough question: *"Why did sustained, self-reinforcing economic growth and modern science take off in Britain rather than in China?"*

  Follow the branches below to specify your research design.

  1.  **Ontological Status:** Is the "Great Divergence" a split between two distinct paths, or a timing difference on a single global path?
      *   **A. Timing Recast:** The contrast is ill-posed; focus on the timing of the transition itself. $\rightarrow$ **Leaf 1**
      *   **B. Valid Divergence:** The contrast represents a genuine bifurcation. $\rightarrow$ *Go to Node 2.*

  2.  **Symmetry & Relatum:** What is the primary puzzle?
      *   **A. Asymmetric (Presence):** Why did growth happen *here*? (Britain is the anomaly). $\rightarrow$ *Go to Node 3A.*
      *   **B. Asymmetric (Absence):** Why did growth *not* happen *there*? (China is the anomaly). $\rightarrow$ *Go to Node 3B.*
      *   **C. Symmetric:** Why did the paths *split*? (The gap is the anomaly). $\rightarrow$ *Go to Node 3C.*

  3.  **Unit of Comparison:**
      *   **3A (British Presence):** England vs. Britain/NW Europe?
      *   **3B (Chinese Absence):** Yangzi Delta vs. Whole Empire?
      *   **3C (The Split):** Pair (Britain vs. China) vs. Population (NW Europe vs. All Eurasia)? $\rightarrow$ *Go to Node 4.*

  4.  **Time-Slice & Gap Type:** Are you comparing static outcomes or dynamic processes?
      *   **A. Levels:** Income/Science output at a specific date (e.g., 1750 or 1800).
      *   **B. Rates:** Growth trajectories over a period (e.g., 1760–1850). $\rightarrow$ *Go to Node 5.*

  5.  **Contrast Class:** How many cases are you comparing?
      *   **A. Counterfactual Pair:** Britain and China as a unique dyad.
      *   **B. Population:** A set of comparable regions (N > 2) for statistical inference. $\rightarrow$ *Go to Node 6.*

  6.  **Explanatory Mode:** What kind of answer satisfies the question?
      *   **A. Difference-Maker:** Identifying necessary/sufficient conditions (variables).
      *   **B. Causal History:** Tracing the sequence of events/feedback loops (process). $\rightarrow$ *Go to Node 7 (if applicable).*

  7.  **Expectation (Symmetric/Pair/Levels/Diff-Maker only):** What is the prior probability of the outcome?
      *   **A. Expected:** Take-off was likely somewhere; why *here* first?
      *   **B. Surprise:** Take-off was unlikely everywhere; why *here* and not *there*? $\rightarrow$ **Leaves 7 & 8.**

  ---

  ## The Leaves: Precisely Specified Research Questions

  **1. The Timing Recast**
  *"When did the global economy cross the threshold for sustained growth, and why did that transition occur in the 19th century rather than earlier or later, regardless of location?"*
  (Diagnosis: Ontological Recast)

  **2. The English Exception**
  *"What necessary condition was present in England but absent in the Yangzi Delta in 1750 that explains the difference in income levels?"*
  (Diagnosis: Asymmetric/England/Pair/Levels/Difference-Maker)

  **3. The English Process**
  *"How did English political institutions evolve between 1600 and 1750 to enable the application of scientific knowledge?"*
  (Diagnosis: Asymmetric/England/Pair/History/Causal History)

  **4. The Chinese Blockage**
  *"Which constraint actively suppressed growth in the Yangzi Delta despite high commercialization and comparable income levels in 1750?"*
  (Diagnosis: Asymmetric/Yangzi/Pair/Levels/Difference-Maker)

  **5. The Eurasian Correlates**
  *"Across 20 Eurasian regions, which variables correlate most strongly with 18th-century growth rates?"*
  (Diagnosis: Symmetric/Population/Rates/Difference-Maker)

  **6. The British Trajectory**
  *"What was the causal sequence linking the Royal Society to industrial patents in Britain versus the Hanlin Academy in China between 1700 and 1850?"*
  (Diagnosis: Symmetric/Britain/Pair/History/Causal History)

  **7. The Expected Transition**
  *"Given the global accumulation of knowledge, why was Britain the first to realize the anticipated industrial transition while China lagged?"*
  (Diagnosis: Symmetric/Pair/Levels/Difference-Maker/**Expected**)

  **8. The Surprising Divergence**
  *"Given similar preconditions, why did Britain undergo the unexpected transition to modern growth while China remained Malthusian?"*
  (Diagnosis: Symmetric/Pair/Levels/Difference-Maker/**Surprise**)

  **9. The Counterfactual Institution**
  *"Would the Qing Empire have industrialized if it possessed British property rights in 1700?"*
  (Diagnosis: Symmetric/Pair/Counterfactual/Difference-Maker)

  **10. The Scientific Specificity**
  *"Why did the methodology of experimental science institutionalize in Britain but not in China, independent of economic outcomes?"*
  (Diagnosis: Symmetric/Britain/Pair/Levels/Difference-Maker/Science-Focused)

  ---

  ## Methodological Notes

  ### Inseparable Leaves
  **Leaves 7 and 8 (Expected vs. Surprise)** cannot be genuinely separated in practice. While they differ philosophically on the prior probability of industrialization (modernization theory vs. contingency), operationalizing this distinction often yields identical research designs. Both require identifying variables that distinguish Britain from China; the "expectation" is a meta-commentary on the results rather than a variable in the model.

  ### Unoccupied Combinations
  **Symmetric + Population + Causal History.**
  *Diagnosis:* Empty because incoherent.
  *Reasoning:* "Causal History" implies process tracing and narrative sequencing suitable for small-N or pair-wise comparison. "Population" implies statistical generalization across many units. One cannot write a singular causal narrative for a statistical population without reducing the history to variables (Difference-Maker).

  ### The Core Debate
  **Leaf 8 (The Surprising Divergence)** best captures what historians are really arguing about.
  Most major interventions (Pomeranz, Allen, Brenner, Mokyr) presuppose that the divergence was *not* inevitable (rejecting Leaf 7) and treat the similarity of 1750 living standards as the baseline. The debate is not whether growth was possible, but why the *break* occurred in one specific instance despite shared preconditions. This framing forces the explanation away from deep cultural essentialism and toward contingent institutional or geographic factors.
