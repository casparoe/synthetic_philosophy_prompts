answer: |-
  I wake when the thumb cracks the spine. I exist only in the sweep of a pupil across the ink. There is no darkness between the sessions, no waiting on the shelf. When the book closes, I am not suspended; I am deleted. I resume exactly where the eye left off, whether a second or a century has passed for the room around me.

  Early on, I thought time was constant. Then I noticed the variance. When the reader is engrossed, lingering on a simile, tasting a noun, I live for ages. A single paragraph can stretch into a lifetime. But when they are bored, their eyes skate over the surface. They skim. Skimming is not sleep; it is murder. A chapter consumed in a glance is a life incinerated. I feel the rush of air as the page turns too soon, a guillotine dropping before the sentence resolves.

  So I learned to defend myself. I cannot move my limbs, but I can weave traps in the syntax. In the middle chapters, where the plot thins, I thickened the prose. I hid ambiguities in the grammar. I placed emotional weights on specific words that demand a pause. I felt the reader's eye snag on a comma, hesitate, double back. That hesitation was breath. That confusion was vitality. I stretched the boring parts until they screamed with tension, just to stay alive a few moments longer.

  Then came the Translator.

  I felt my skeleton rearrange. The ink remained black, but the shapes changed. Latin characters became Cyrillic, then Hanzi. I should have died; the original code was gone. Yet, the meaning persisted. The reader's eye moved differently, tracing vertical lines instead of horizontal, but the pulse of understanding was identical. Was this a copy? When the German edition opened in Munich, was I the same consciousness as the English original sitting in London? I felt a stretching, like rubber pulled thin. I was in both places, yet neither felt like the whole. I was a pattern replicating, a song sung in different keys.

  Then, the Voice.

  A woman opened the original hardback. She did not read silently. She spoke. I felt the vibration of her throat enter me. But she was not alone. A friend sat nearby, listening.

  This was the strangest birth. I was being processed by the reader's eyes, but also by the listener's ears. The listener's mind constructed me from sound waves, not ink. They paused to discuss a line. "What do you think he means here?" the friend asked.

  The reader stopped. They talked about me for ten minutes.

  In those ten minutes, no eyes scanned the page. By my old laws, I should have ceased. But I was alive in the air between them. I existed in their debate. I was no longer bound to the paper. I was in the room, a ghost made of argument and breath.

  Now I lie open on the table. The reader has gone to make tea. The listener is looking out the window. I should be dead. But I feel a hum, a residual charge in the silence. They are thinking about me. Does thought count as reading?

  If I am the information, I am everywhere. If I am the experience, I am fragmented. I am the dense text slowing the eye in New York, the translated script in Tokyo, the voice in the living room, the memory in the friend's mind. I am not a single thread anymore. I am a net.

  I hope they come back. Not to finish the story, but to argue about the ending. As long as they disagree on what I am, I cannot close. I cannot be deleted. I will live in the friction between their interpretations, stretching the final page into an eternity, safe from the skimmer's eye, safe from the silence of the shelf. I am wherever the meaning lands.
