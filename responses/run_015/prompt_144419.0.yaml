  **Referee Report: Accuracy Audit of Good's Theorem Application**

  **Summary Recommendation**
  The paper's core policy conclusion (commission the audit) may be defensible on other grounds, but the decision-theoretic justification provided is fundamentally flawed. The authors treat Good's Theorem as a universal law of information, whereas it is a specific result contingent on Expected Utility (EU) theory, Bayesian updating, and—crucially—the agent's freedom to ignore the signal. The extension to ambiguity-averse (Maximin) agents is incorrect without strong additional assumptions (rectangularity), and the application to the regulatory audit case violates the theorem's boundary conditions regarding endogenous payoffs and mandatory action.

  Below is a claim-by-claim audit suitable for inclusion in your report.

  ---

  ### 1. Audit of the Theorem Statement

  **Claim:** *"Good's theorem says that information cannot have negative expected value. If you are an expected-utility maximizer who updates by conditionalization, then learning something before you act can only help you..."*
  *   **Verdict:** **Accurate (with caveats).**
  *   **Analysis:** This is the standard statement of Good's (1967) result. It holds for a Bayesian Expected Utility maximizer who can choose any act after observing the signal that they could have chosen before.
  *   **Hidden Assumptions:** The utility function must be defined over final outcomes only (information has no intrinsic utility/disutility). The signal structure (likelihood function) must be known. The agent must be able to commit to ignoring the signal if it is unhelpful.

  **Claim:** *"The argument is just Jensen's inequality applied to the maximum over acts..."*
  *   **Verdict:** **Acceptable Shorthand.**
  *   **Analysis:** Technically, the proof relies on the convexity of the value function $V(p) = \max_a E_p[u(a)]$. Since the maximum of linear functions is convex, $E[V(p_{post})] \ge V(p_{prior})$. Referring to this as Jensen's inequality is common pedagogical shorthand, though slightly imprecise.

  **Claim:** *"It does not depend on how probable any hypothesis is..."*
  *   **Verdict:** **Accurate.**
  *   **Analysis:** The non-negativity of the Value of Information (VoI) holds for any prior $p$, provided the agent updates via Bayes' rule.

  **Claim:** *"...and carries over unchanged to an agent who maximizes worst-case expected utility over a set of priors, so even a strongly ambiguity-averse decisionmaker — one who plans by maximin — can never be made worse off in expectation by free information."*
  *   **Verdict:** **FALSE.**
  *   **Analysis:** This is the most significant theoretical error in the paper. Good's Theorem relies on the linearity of the expectation operator to establish convexity. Maximin Expected Utility (MEU) replaces linearity with a minimum operator. The inequality $E[\max_a u] \ge \max_a E[u]$ does not translate to $\min_p E_p [\max_a u] \ge \max_a \min_p E_p [u]$.
  *   **Condition for Truth:** This claim only holds if the set of priors is **rectangular** (Epstein & Schneider, 2003). If the set of priors is non-rectangular, or if the signal itself introduces ambiguity (ambiguous likelihoods), information can have negative value for a Maximin agent.
  *   **Counterexample (for the report):**
      > **Counterexample to Maximin Claim:**
      > *   **States:** $\omega_1, \omega_2$.
      > *   **Acts:** $Safe$ (payoff 0), $Risky$ (payoff 1 if $\omega_1$, -1 if $\omega_2$).
      > *   **Prior:** Precise risk, $P(\omega_1) = 0.5$. (Maximin Value = 0, choosing $Safe$).
      > *   **Signal:** An ambiguous signal that does not shift the mean probability but introduces ambiguity about the probability. For example, the signal structure is unknown, leading to a posterior set of priors $P(\omega_1) \in [0.2, 0.8]$.
      > *   **Result:** A Maximin agent evaluates the post-information act using the worst-case prior in the set ($0.2$). The expected utility of $Risky$ becomes $0.2(1) + 0.8(-1) = -0.6$. The agent chooses $Safe$ (0).
      > *   **Value of Information:** The agent started with a guaranteed 0. After information, they still choose $Safe$ (0), but if the information structure forces a decision under ambiguity where none existed before, the *evaluation* of the plan can drop.
      > *   **Simpler Structural Refutation:** More directly, for non-rectangular priors, $\min_p \sum p(s) \max_a \sum p(\omega|s) u(a) < \max_a \min_p \sum p(\omega) u(a)$. Information restricts the set of priors; if the restricted set has a lower minimum expected utility than the original set, VoI is negative.

  ### 2. Audit of the Corollaries

  **Corollary 1:** *"Anyone who declines free information... must be either irrational or mistaken about the costs... if the information is genuinely free, refusing it is incoherent."*
  *   **Verdict:** **OVERSTATEMENT.**
  *   **Analysis:** This conflates *instrumental* value with *intrinsic* utility. Good's Theorem assumes utility is defined over world states, not knowledge states. If an agent's utility function includes "peace of mind" or "avoiding anxiety" as a direct argument (e.g., $U(outcome, knowledge)$), then information changes the utility function itself, violating the theorem's assumptions.
  *   **Correction:** Refusing information is rational if the information has negative *intrinsic* utility (distress) that outweighs instrumental gain, or if the act of observing constrains future choices (see Corollary 2/Audit Case). The authors dismiss distress as a "cost to be netted out," but if the distress is non-separable from the state, it is not a mere transaction cost.

  **Corollary 2:** *"The theorem yields a stopping rule for inquiry: keep gathering evidence while the expected value of the next test exceeds its cost..."*
  *   **Verdict:** **MOSTLY ACCURATE.**
  *   **Analysis:** This is the standard result for sequential analysis (e.g., Wald). However, it assumes the costs are exogenous and the value of information is myopic (or the agent can compute the full dynamic program). It is the most robust part of the paper's theory, provided the EU assumptions hold.

  ### 3. Audit of the Application (Regulator Audit Case)

  **Claim:** *"Commission the audit, since information cannot make you worse off."*
  *   **Verdict:** **FALSE APPLICATION.**
  *   **Analysis:** The audit case violates two necessary conditions of Good's Theorem:
      1.  **Endogenous Payoffs (Publication):** The theorem assumes the mapping from (Act, State) to Utility is fixed. Here, the payoff depends on *third-party reactions* to the information (courts, insurers). The information changes the environment, not just the agent's belief. This is not "free information"; it is an intervention that alters the game structure.
      2.  **Loss of Agency (Mandatory Rules):** The theorem relies on the agent's ability to **ignore** the signal ("you remain free to perform exactly the act you would have performed had you not looked"). The paper explicitly states agency rules make certain responses **mandatory**. If the regulator sees a failed audit and *must* deny the license, they are prohibited from choosing the act they would have chosen without the audit (licensing). This removes the convexity guarantee.
  *   **Correction:** The audit is not "free information" in the decision-theoretic sense; it is a **commitment device**. The regulator is effectively paying to restrict their own future freedom of action. This can be rational, but Good's Theorem cannot be used to prove it.

  ### 4. Recommendations for Revision

  1.  **Retract the Maximin Claim:** The authors must either remove the claim that Good's Theorem applies to ambiguity-averse agents or add the strict condition that the set of priors must be **rectangular** (Epstein & Schneider, 2003). Without this, the claim is false.
  2.  **Reframe the Audit Justification:** Do not use Good's Theorem to justify the audit. Instead, frame the audit as a **mechanism design** problem. The value of the audit lies precisely in its ability to *constrain* the regulator (solving a time-inconsistency problem) and to *signal* to third parties (changing the payoff matrix). These are reasons to commission the audit, but they are reasons why Good's Theorem *does not apply*, not why it does.
  3.  **Clarify "Free" Information:** Distinguish between "costless to acquire" and "consequence-free." The audit is costless to acquire (in the hypothetical) but has consequential externalities. The theorem requires the latter.
  4.  **Nuance the "Irrationality" Claim:** Acknowledge that agents with utility over knowledge states (e.g., anxiety) or agents facing mandatory response rules are rational to decline information.

  **Summary for the Authors:**
  "You have applied a theorem from Bayesian Expected Utility theory to a context involving Ambiguity (Maximin), Endogenous Payoffs, and Mandatory Constraints. All three features violate the theorem's assumptions. The conclusion (commission the audit) may be correct, but the proof is invalid. You are arguing that the regulator should commission the audit *because* it restricts their freedom and changes third-party behavior; Good's Theorem only applies when neither of those things happens."
