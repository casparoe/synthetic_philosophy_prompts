answer: |-
  1. The norm presupposes a bounded rationality model where knowledge requires not just data possession but the availability of a short, salient inferential path. This rejects the formal notion that information includes all logical consequences, limiting the reader's duty to only those deductions signaled as relevant.

  2. Strictly, the practice requires only that every premise necessary for the solution appears in the text, without guaranteeing the reader can successfully connect them. However, the norm fits best with a relevance-based account where the author signals which inferences are worth the reader's cognitive effort to pursue.

  3. The norm licenses inferential inequality by distinguishing between general knowledge expected of the reader and specialized expertise reserved for the detective. This consistency holds because the reader is granted access to the same facts, even if they lack the professional training to interpret them correctly.

  4. If we took the standard formal treatment seriously, the norm would become impossible to satisfy because presenting the clues would logically compel the reader to know the solution instantly. Therefore, the norm must implicitly treat knowledge as computationally limited rather than logically closed.

  5. The locked-room exception reveals that the norm governs reconstructible human action more strictly than physical mechanics, implying the commitment is to psychological fairness rather than total puzzle transparency. Multiple epistemic frameworks can license this boundary, provided they distinguish between withholding data and withholding specialized mechanical knowledge.
