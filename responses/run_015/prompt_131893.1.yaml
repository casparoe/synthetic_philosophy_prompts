prompt: |-
  I'm taking an advanced seminar on the ethics of war, and there is one analogy that keeps doing heavy lifting in our discussions without ever being audited. My teaching fellow introduced it informally, and one of my classmates now reaches for it in every paper: war is a boxing match. Two fighters agree to enter the ring; once the bell rings, each has exactly the same permission to hit the other as the other has to hit him, and neither becomes a murderer by landing a punch. The rules of the sport tell you what counts as a foul, a fighter who stays inside them has nothing to answer for, and the further question — whether either fighter had a good reason to be in the ring at all, or is fighting for a promoter's money under a lie — is treated as external to the contest itself. The analogy is then used to license the moral equality of combatants: every soldier on every side has the same permission to kill enemy soldiers, none of them is blameworthy for doing so provided they respect the laws of war, and the wrong of an unjust war belongs entirely to the political leaders who ordered it, the way a crooked bout belongs to the promoters who staged it.

  The reason I'm suspicious is a case I invented for my final paper and can't find treated anywhere, which my classmate's version of the analogy handles very badly. Imagine a state that deliberately engineers the epistemic situation of its own soldiers: it draws its conscripts from an informationally closed population, feeds them a fabricated account of the conflict designed to be credible to them, screens out recruits with independent access to outside sources, and does all this as policy, on the explicit reasoning that a soldier who non-culpably believes his cause is just is morally harder to blame and harder to target than one who knows better. Call it excuse farming. Note that on the ground nothing about the soldiers' conduct changes: they still fight and kill soldiers of the other side who are fighting justly. Now I want to know what the boxing picture says about this. Is excuse farming like doping — a foul that voids the bout and discredits its organizers while leaving the permissions inside the ring untouched? Does it instead break the analogy's own logic, since the fighter's consent, which is supposed to do the whole moral work, is now manufactured by one of the parties rather than given by the fighter? And crucially, the analogy seems to fuse two things that the farming case pries apart: a permission to fight (a right to kill, and a liability to be killed in return) and an exemption from blame. In the ring, consent supplies both at once, because the person who consents both waives his complaint and makes his opponent blameless. But a farmed conscript looks blameless while still being an unjust threat someone may defensively resist — and if so, the equality the analogy buys may be only an equality of excuse, which is a thinner conclusion than the one it was wheeled in to support.

  So I'd like a proper audit rather than a verdict. Give me the correspondence table explicitly — the ring, the bell, the referee, the gloves, the consent to be hit, the fouls, the promoters, the purse, and, if it has one, an analogue for civilians, who seem to be either the audience or the corner staff and fit neither — and then sort the disanalogies into those that matter for the conclusion being drawn and those that don't. I'm especially interested in what the picture quietly imports into war: that there is a referee, that the rules are constitutive rather than instrumental to some independent fact about who is in the right, that the parties are symmetric agents with symmetric standing, that permission is an all-or-nothing status rather than something that can hold to a degree, and that blame tracks only rule-breaking rather than the justice of what one is doing. Then run the excuse-farming case through both this picture and the rival one my seminar reads it against — the rescuer-and-culpable-aggressor framing that revisionists prefer — and say which handles it better and why, including whether the farming state's leaders become more rather than less liable on each view. Finally, if there is a better analogy for the moral situation of combatants, say what it would have to preserve that the boxing match loses.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Advanced seminar on the ethics of war (Just War Theory, likely focusing on Revisionism vs. Traditionalism).
      *   **Core Issue:** The "War as Boxing" analogy is being used uncritically to support the *Moral Equality of Combatants* (MEC). The user suspects it's flawed, specifically regarding a thought experiment they call "Excuse Farming."
      *   **Task:**
          1.  Create an explicit correspondence table (Ring, Bell, Referee, Gloves, Consent, Fouls, Promoters, Purse, Civilians).
          2.  Audit the disanalogies: Sort them into "matters for the conclusion" vs. "doesn't matter."
          3.  Identify hidden imports/assumptions in the boxing analogy (Referee existence, constitutive rules, symmetry, all-or-nothing permission, blame vs. justice).
          4.  Run the "Excuse Farming" case through both the Boxing picture (Traditionalism) and the Rescuer/Culpable Aggressor picture (Revisionism).
          5.  Determine which handles it better and why (including liability of leaders).
          6.  Propose a better analogy (or criteria for one) that preserves what boxing loses.
      *   **Tone:** Academic, rigorous, philosophical, analytical (matching the user's sophisticated prompt).

  2.  **Deconstruct the "War as Boxing" Analogy:**
      *   *Traditional Just War Theory (Walzerian):* Often relies on a separation between *jus ad bellum* (justice of war) and *jus in bello* (justice in war). Combatants are moral equals regardless of side, provided they follow rules.
      *   *The Analogy:* Boxing matches are consensual, rule-bound, symmetric activities where harm is permitted within limits.
      *   *The User's Critique:* "Excuse Farming" breaks the consent mechanism. It separates *blamelessness* (excuse) from *permission/liability* (right to kill/not be killed).

  3.  **Drafting the Correspondence Table:**
      *   *Ring:* The theater of war / battlefield.
      *   *Bell:* Declaration of war / commencement of hostilities.
      *   *Referee:* International Humanitarian Law (IHL) / Geneva Conventions (enforcement is weak, but normative role exists).
      *   *Gloves:* Rules of Engagement / Prohibited weapons (means of violence constrained).
      *   *Consent to be hit:* Combatant Status / Uniform wearing (implied waiver of right not to be attacked).
      *   *Fouls:* War Crimes (targeting civilians, torture).
      *   *Promoters:* Political Leadership / Sovereigns.
      *   *Purse:* National interest / Security / Resources (stakes of the war).
      *   *Civilians:* Audience? (Problematic). They are bystanders who get hurt, not spectators paying for entertainment. This is a major disanalogy.

  4.  **Auditing Disanalogies:**
      *   *Symmetry:* Boxing is symmetric by design. War is often asymmetric (aggressor vs. defender). *Matters:* Undermines MEC.
      *   *Consent:* Boxers consent individually. Soldiers often conscripted or manipulated (Excuse Farming). *Matters:* Crucial for the "waiver" argument.
      *   *Referee:* Boxing has an active enforcer. War has no global sovereign. *Matters:* Rules become self-enforced or unenforced, changing the normative landscape.
      *   *Purpose:* Boxing is sport/display. War is political/coercive/deadly. *Matters:* Changes the stakes of "harm."
      *   *Civilians:* Audience vs. Protected Non-Participants. *Matters:* Boxing ignores collateral damage; war ethics centers on it.

  5.  **Analyzing Hidden Imports:**
      *   *Constitutive Rules:* In boxing, rules *make* the game. In war, rules constrain an existing violence.
      *   *Symmetry:* Assumes both sides have equal standing.
      *   *All-or-Nothing Permission:* You are either a legal combatant or not. Revisionists argue liability is scalar.
      *   *Blame vs. Justice:* Boxing separates the bout's integrity from the promoter's honesty. War ethics questions if the killing itself is justified, not just the procedure.

  6.  **Running "Excuse Farming" Through the Models:**
      *   *Boxing/Traditionalist View:*
          *   Soldiers are "fighters."
          *   If they follow rules (gloves on, no low blows), they are permissible targets and permissible killers.
          *   The "Excuse Farming" is a Promoter foul.
          *   *Problem:* It treats the soldiers as having *rights* to kill, not just being *excused*. It conflates excuse with justification.
          *   *Leaders:* Liable for the foul (unjust war), but soldiers remain "equal."
      *   *Revisionist (Rescuer/Aggressor) View:*
          *   Just side = Rescuers. Unjust side = Aggressors.
          *   Aggressors are liable to defensive harm.
          *   *Excuse Farming:* Soldiers are *culpable* aggressors? No, they are *non-culpable* (excused) aggressors.
          *   *Liability:* Revisionists (like McMahan) argue non-culpable aggressors might still be *liable* to be killed (objective threat) even if not *blameworthy*.
          *   *Permission:* Just soldiers have permission to kill unjust soldiers. Unjust soldiers do *not* have permission to kill just soldiers (even if excused).
          *   *Leaders:* Highly liable. They created the threat and manipulated the agents.
      *   *Comparison:* Revisionism handles the distinction between *blame* and *liability* better. Boxing conflates them.

  7.  **Developing a Better Analogy:**
      *   Boxing fails because it implies consent and symmetry.
      *   Need an analogy that captures: Defensive force, asymmetry of justification, and the distinction between liability and blame.
      *   *Idea:* Police action? (Too statist).
      *   *Idea:* Self-defense against a confused attacker? (Better).
      *   *Idea:* A fire brigade vs. arsonists (some arsonists don't know they are lighting fires).
      *   *Selection:* The "Confused Attacker in Self-Defense" scenario is the standard philosophical counter-analogy. It preserves the right to defend without granting the attacker equal permission.

  8.  **Refining the Output:**
      *   Ensure the tone is respectful of the user's sophisticated grasp (they know McMahan, Walzer, liability vs. excuse).
      *   Make sure the "Audit" is distinct from the "Verdict."
      *   Check the "Civilians" point carefully—it's a known weak point in Traditionalism.
      *   Ensure the "Excuse Farming" analysis clearly distinguishes between *Justification* (act is right) and *Excuse* (agent is not blameworthy).

  9.  **Self-Correction/Nuance Check:**
      *   *Correction:* In the boxing analogy, does consent make the opponent *blameless* or the act *justified*? In sport, it makes the act permissible. In war, Traditionalists say it makes the killing permissible *in bello* even if *ad bellum* is unjust. Revisionists say no.
      *   *Nuance:* The user asks about the *leaders'* liability. In Revisionism, leaders are primary liable targets. In Traditionalism, they are war criminals but distinct from the combatants.
      *   *Civilians:* In boxing, the audience is safe. In war, civilians are the primary constraint. This is a massive disanalogy.
      *   *Excuse Farming:* This is essentially the "Invincible Ignorance" problem. Traditionalism swallows it (soldiers are equals). Revisionism struggles with it (are they liable if innocent?). Most Revisionists say yes, they are objectively liable, but subjectively excused.

  10. **Final Polish:** Structure the response clearly with headings matching the prompt's requirements. (Correspondence Table, Audit of Disanalogies, Hidden Imports, Excuse Farming Case Study, Better Analogy).

  *(Self-Correction during drafting)*: Make sure to explicitly address the "Permission vs. Exemption" distinction the user raised. That is the crux of their philosophical objection. Boxing fuses them; Excuse Farming splits them.

  11. **Final Review against constraints:** Did I give a verdict? The prompt asks for an "audit rather than a verdict" initially, but later asks "which handles it better and why." I will provide the audit as the primary mode, but the comparative analysis will inevitably lean towards the Revisionist view given the logical constraints of the "Excuse Farming" case. I must remain analytical.

  Let's write.
answer: |-
  This is a sophisticated dissection of a foundational metaphor in Just War Theory. Your suspicion is well-founded: the "War as Boxing" analogy is the intuitive engine of the Traditionalist view (often associated with Michael Walzer), which posits the Moral Equality of Combatants (MEC). Your "Excuse Farming" case targets the mechanism by which that analogy converts *consent* into *moral permission*.

  Below is the audit you requested, breaking down the correspondence, the hidden imports, and the performance of the analogy against your specific counter-case, compared to the Revisionist alternative.

  ### I. The Correspondence Table

  | Boxing Element | Proposed War Analogue | Function in Analogy |
  | :--- | :--- | :--- |
  | **The Ring** | The Theater of War / Battlefield | A bounded space where normal moral rules are suspended in favor of contest rules. |
  | **The Bell** | Declaration of War / Commencement of Hostilities | Signals the transition from peace (normal morality) to contest (war morality). |
  | **The Referee** | International Humanitarian Law (IHL) / Geneva Conventions | Enforces the *in bello* rules; determines fouls. |
  | **The Gloves** | Rules of Engagement / Prohibited Weapons | Constraints on *how* harm is inflicted (no biting, no chemical weapons). |
  | **Consent to be Hit** | Combatant Status / Wearing Uniform | The waiver of the right not to be attacked; makes one a legitimate target. |
  | **The Fouls** | War Crimes | Actions that violate *in bello* constraints (targeting civilians, torture). |
  | **The Promoters** | Political Leadership / Sovereigns | Those who arrange the match and determine the stakes (*ad bellum*). |
  | **The Purse** | National Interest / Security / Resources | The external good sought by the contest. |
  | **The Audience** | **Civilians** | **Critical Failure Point.** In boxing, they are spectators; in war, they are protected non-participants who suffer collateral damage. |

  ### II. Audit of Disanalogies

  We must distinguish between disanalogies that are merely descriptive (war is messier than sport) and those that are **normatively destructive** (they undermine the moral conclusion drawn from the analogy).

  #### 1. Normatively Destructive Disanalogies (Matter for the Conclusion)
  *   **The Nature of Consent:** In boxing, consent is individual, informed, and revocable (you can quit). In war, "consent" is often collective, coerced (conscription), or manufactured (Excuse Farming).
      *   *Impact:* If consent is the source of the permission to kill, manufactured consent invalidates the permission. The analogy cannot support MEC if the "waiver" is fraudulent.
  *   **The Role of the Referee:** A boxing referee has the power to stop the fight and enforce rules immediately. In war, the "referee" (IHL) has no sovereign enforcement mechanism; combatants are their own judges.
      *   *Impact:* This imports a false sense of security. In boxing, rules are *constitutive* (they make the game). In war, rules are *regulative* (they constrain an activity that exists independently). This suggests that following rules in war is not enough to make the activity morally coherent in the way a legal punch is.
  *   **The Status of Civilians:** In boxing, the audience is safe by design. In war, civilian immunity is a constraint on the violence, not a feature of the "sport."
      *   *Impact:* The analogy obscures the primary moral tragedy of war (harm to non-consenting third parties). It frames war as a dyadic contest between soldiers, ignoring the triadic reality (Soldier A, Soldier B, Civilian C).
  *   **Symmetry of Standing:** Boxers enter with equal standing. In war, one side is often an aggressor and the other a defender.
      *   *Impact:* The analogy presupposes the conclusion it tries to prove (that both sides have equal moral standing). It begs the question against the Revisionist claim that aggressors lack the right to fight.

  #### 2. Descriptive Disanalogies (Do Not Matter for the Conclusion)
  *   **Lethality:** Boxing is rarely lethal; war is. This is a matter of degree, not kind, regarding the *permission* structure.
  *   **Payment:** Soldiers are paid, but not always a "purse." This does not affect the liability structure.
  *   **Duration:** Wars last longer than bouts. Irrelevant to the moral status of the combatants at time *t*.

  ### III. Hidden Imports of the Boxing Picture

  The analogy is not neutral; it smuggles in specific metaphysical and normative commitments:

  1.  **The Existence of a Sovereign Referee:** It assumes a normative order where rules are enforceable and authoritative independent of the justice of the cause. It implies that *procedural justice* (following the rules of the ring) can substitute for *substantive justice* (having a just cause).
  2.  **Constitutive Rules:** It treats the laws of war as if they create the moral reality of the battlefield, rather than merely regulating it. In boxing, a punch outside the bell is not "violence," it is "foul." In war, an unjust killing is still murder, even if it follows the Geneva Conventions.
  3.  **Symmetric Agency:** It assumes both parties are moral equals with identical rights and liabilities. It erases the distinction between *doing* harm and *allowing* harm, or between *aggression* and *defense*.
  4.  **All-or-Nothing Permission:** It suggests a binary status: you are either a legal combatant (permission to kill, liable to be killed) or a civilian (no permission, immune). It cannot accommodate scalar liability or degrees of culpability.
  5.  **Blame Tracks Rule-Breaking:** It imports the idea that if you follow the rules of the contest, you are blameless. It separates *in bello* conduct entirely from *ad bellum* justice.

  ### IV. The "Excuse Farming" Case Study

  Here we run your specific thought experiment through the two competing frameworks.

  **The Case:** State A manipulates soldiers into non-culpably believing their war is just. They fight State B (who is fighting justly). State A soldiers follow *in bello* rules.

  #### 1. The Boxing Picture (Traditionalism)
  *   **Analysis:** The soldiers are "fighters in the ring." They have put on the gloves (uniforms) and entered at the bell (mobilization). The fact that the Promoter (State A Leadership) lied about the purse or the opponent is a foul *by the promoter*, not the fighter.
  *   **Verdict on Soldiers:** They retain **Moral Equality**. They have the *permission* to kill State B soldiers, and they are *liable* to be killed by State B. Their internal epistemic state is irrelevant to their status as combatants.
  *   **Verdict on Leaders:** The Leaders are "crooked promoters." They bear the guilt of the unjust war (*ad bellum* crime), but this does not trickle down to strip the soldiers of their *in bello* rights.
  *   **Failure Mode:** The analogy collapses because it cannot distinguish between **Justification** and **Excuse**.
      *   In boxing, a legal punch is *justified* by the rules of the sport.
      *   In Excuse Farming, the soldier's killing is *unjustified* (they are attacking a just defender) but *excused* (they didn't know).
      *   The Boxing Picture treats the excuse as a justification. It grants the farmed soldier a *right* to kill, rather than merely acknowledging they are not *blameworthy* for killing. This grants them a moral power they do not possess.

  #### 2. The Rescuer/Culpable Aggressor Picture (Revisionism)
  *   **Analysis:** This framework (associated with Jeff McMahan) rejects the boxing analogy. It views war through the lens of individual self-defense and liability.
      *   State B soldiers are **Rescuers/Defenders**.
      *   State A soldiers are **Threats**.
  *   **Verdict on Soldiers:**
      *   **Liability:** State A soldiers are objectively **liable** to defensive harm because they pose an unjust threat, even if they are subjectively blameless. (Analogy: If a sleepwalker tries to push you off a cliff, you may stop them, even though they aren't blameworthy).
      *   **Permission:** State A soldiers do **not** have permission to kill State B soldiers. State B soldiers *do* have permission to kill State A soldiers. MEC is false.
      *   **Blame:** State A soldiers are **excused** from blame due to the epistemic manipulation, but this excuse does not grant them rights.
  *   **Verdict on Leaders:** The Leaders are **highly liable**. By engineering the epistemic situation, they have made themselves the primary causal and moral agents of the threat. On some Revisionist accounts, this makes the leaders *more* liable to targeted killing than the soldiers, as they are the culpable architects of the unjust threat.
  *   **Success Mode:** This framework successfully pries apart **Liability** (can they be killed?) from **Blame** (are they wicked?). It handles Excuse Farming by acknowledging the soldiers are innocent *agents* but unjust *threats*.

  #### 3. Which Handles It Better?
  The **Revisionist (Rescuer/Aggressor)** framework handles the case better.

  *   **Why:** The Boxing Picture relies on *institutional status* (you are a boxer, therefore you have rights). The Revisionist Picture relies on *moral facts* (you are posing an unjust threat, therefore you are liable).
  *   **The Crucial Distinction:** Your "Excuse Farming" case proves that **Exemption from Blame $\neq$ Permission to Kill.**
      *   The Boxing Picture fuses these: If you aren't blameworthy (no fouls), you have permission.
      *   The Revisionist Picture separates them: You can be blameless (excused) but still lack permission (unjustified), and still be liable to defensive force.
  *   **Leaders' Liability:** In the Boxing Picture, the leaders are "outside the ring." Their liability is legal/political, not necessarily martial. In the Revisionist Picture, the leaders are the *source* of the liability. They are culpable aggressors who use innocent instruments. This makes them legitimate targets, potentially more so than the instruments they manipulate.

  ### V. Toward a Better Analogy

  If the Boxing Match fails because it implies symmetry and consensual risk-assumption, a better analogy must preserve:
  1.  **Asymmetry of Justification:** One side is right, one is wrong.
  2.  **Distinction between Liability and Blame:** One can be a legitimate target without being morally wicked.
  3.  **The Presence of Non-Consenting Third Parties:** The "audience" is at risk.

  **Proposed Analogy: The Confused Attacker in a Crowd**

  *   **The Scenario:** Two groups are in a public square. Group A is trying to lynch an innocent victim. Group B is trying to save the victim.
  *   **The "Farmed" Element:** Some members of Group A have been lied to; they genuinely believe the victim is a monster who will kill them if not stopped. They are non-culpable.
  *   **The Correspondence:**
      *   **The Square:** The Theater of War (unbounded, civilians present).
      *   **Group B:** Just Combatants (Defenders).
      *   **Group A:** Unjust Combatants (Aggressors).
      *   **The Confused Attackers:** Farmed Conscripts.
      *   **The Lie-Tellers:** Political Leaders.
      *   **The Victim:** The Just Cause (or the Civilians threatened by Group A).
  *   **Why it works better:**
      *   **No Consent:** No one in the square "agreed" to be attacked. Liability arises from the *threat posed*, not the *waiver signed*.
      *   **Asymmetry:** Group B has permission to use force; Group A does not, even if confused.
      *   **Liability vs. Blame:** Group B may shoot the confused attackers to save the victim (Liability), but we do not hate the confused attackers as monsters (Blame).
      *   **Civilians:** The "public square" inherently contains bystanders who must be protected, unlike the boxing ring.

  ### Conclusion of the Audit

  The "War as Boxing" analogy is not merely an illustration; it is a **theoretical commitment to Institutionalism**. It argues that the moral reality of war is created by the institutions of war (uniforms, declarations, treaties).

  Your "Excuse Farming" case demonstrates that this institutionalism is fragile. If the institution itself manufactures the consent that legitimizes it, the legitimacy collapses. The analogy fails because it cannot account for **epistemic manipulation by the state**. It assumes the "Bell" is a neutral signal, when in the Farming Case, the Bell is part of the deception.

  The Revisionist framework, while less tidy, offers the necessary granularity. It accepts that war is not a game with constitutive rules, but a tragedy of conflicting rights and liabilities. It preserves the intuition that the farmed soldier is not a murderer (excuse) without granting them the right to kill (justification). The Boxing analogy buys moral equality at the price of moral truth; the Audit suggests that price is too high for a seminar on *ethics*.
