  ***

  # Adversarial Collaboration: Social Sanction & Deplatforming

  ## I. Joint Statement of Agreement
  *Both Camp A (Privatized Penal System) and Camp B (Democratic Counter-Speech) agree on the following empirical and structural claims:*

  1.  **Technical Mechanism:** When a platform "deplatforms" a user, it technically involves the revocation of access rights defined in the Terms of Service (ToS), resulting in the removal of content and the inability to broadcast to existing follower networks via that specific infrastructure.
  2.  **Measurable Harm:** There is a correlational link between high-profile deplatforming events and measurable decreases in the subject's economic income, audience reach, and ability to organize politically, regardless of the intent behind the removal.
  3.  **Role of Norms:** Social norms and collective outrage are significant causal factors in triggering platform enforcement; algorithms and moderation teams do not operate in a vacuum but respond to external pressure campaigns.
  4.  **Non-State Actors:** These sanctions are administered by private corporations, not government judicial bodies, meaning constitutional due process protections (like the 5th or 14th Amendment in the US) do not legally apply to the procedure.

  ## II. Area of Disagreement
  *Where the camps diverge on the interpretation of the agreed-upon facts.*

  | Feature | Camp A (Privatized Penal System) | Camp B (Democratic Counter-Speech) |
  | :--- | :--- | :--- |
  | **Nature of Harm** | The harm is **status degradation**. It functions like shaming or exile, reducing the individual's standing in the community to enforce conformity. | The harm is **informational quarantine**. It functions like limiting a hazard, reducing the spread of specific content deemed harmful by the community/host. |
  | **Intent of Action** | The collective action is **punitive**. The goal is to inflict cost on the speaker for past violations of social norms. | The collective action is **protective/preventative**. The goal is to curate the environment and amplify competing speech, not necessarily to punish the speaker. |
  | **Legitimacy** | Illegitimate without **due process**. Because the harm mimics state punishment, it requires procedural justice (appeals, clear rules, neutral judges). | Legitimate as **private association**. Platforms and users have the right to curate their spaces and choose not to amplify certain voices without procedural overhead. |

  ## III. Critical Cruxes
  *The specific points where changing our mind would shift our overall position.*

  ### Crux 1: Is Status Loss Punitive or a Side-Effect?
  **The Question:** When a person loses social status and income following outrage, is that loss the *intended punishment* (Camp A) or an *unavoidable side-effect* of others exercising their own speech/association rights (Camp B)?

  *   **Concrete Case:** **The Justine Sacco Case (2013).**
      *   *Context:* IAC PR executive tweeted a controversial joke before landing in Africa. During her flight, public outrage grew, and she was fired by her employer before she landed.
      *   *Agreed Facts:* Public outrage occurred on Twitter; employer terminated contract based on reputational risk; subject lost income and status.
  *   **Camp A Prediction:** If this is punitive, we should see evidence that the outrage was coordinated specifically to inflict economic harm as a moral lesson to others (deterrence). The speed of the firing suggests a "kangaroo court" dynamic driven by shame.
  *   **Camp B Prediction:** If this is counter-speech/association, we should see evidence that the employer acted to protect their own brand values and employees acted to express disagreement. The harm is incidental to the employer's right to choose who represents them and the public's right to criticize.

  ### Crux 2: Is the Platform a Public Forum or Private Editorial Space?
  **The Question:** Does a major social media platform (e.g., Twitter/X, Facebook) function as essential public infrastructure (requiring open access) or as a private editorial product (requiring curation)?

  *   **Concrete Case:** **The Parler Removal from App Stores (2021).**
      *   *Context:* Apple and Google removed Parler from their app stores following Jan 6, citing lack of moderation. Amazon Web Services also halted hosting.
      *   *Agreed Facts:* Private infrastructure providers (Apple, Google, AWS) cut off access to a competitor platform; Parler's reach was drastically reduced temporarily.
  *   **Camp A Prediction:** If this is a privatized penal system, we should see that these infrastructure providers hold monopoly power similar to a state. Removing access effectively silences speech without alternative avenues, functioning as a banishment from the public square.
  *   **Camp B Prediction:** If this is private curation, we should see that these providers are enforcing safety standards for their own users. Allowing a platform with no moderation violates their own product safety terms, and they have the right to discontinue business relationships that pose liability risks.

