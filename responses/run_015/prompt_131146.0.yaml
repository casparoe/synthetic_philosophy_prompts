  1.  **Analyze the Request:**
      *   **Role:** Member of a university's International Partnerships Ethics Board.
      *   **Task:** Draft a formal recommendation memo for circulation before a binding vote on Thursday.
      *   **Topic:** Renewing a 10-year strategic research collaboration with a partner university in an authoritarian state.
      *   **Context:**
          *   Partner state: Authoritarian, rapid economic growth, low corruption, poverty reduction, restricted academic freedom (recent "social harmony audit").
          *   Partner's Argument: "Recursive performance legitimacy" (authoritarianism justified temporarily by development targets; controls dissolve automatically when targets met; joint research helps meet targets, so ending it harms citizens/liberation).
          *   Board Divisions: Some say no prosperity justifies suppressing inquiry (moral cover); others say withdrawal harms local scholars/channel of influence.
      *   **Constraints:**
          *   Addressed to the board.
          *   Length: 350 to 400 words (strict).
          *   Format: Single page (implied by length).
          *   Content: Bottom-line recommendation in opening paragraph (Renew with conditions, Suspend, or Terminate) + timeline.
          *   Stance: Definite position (no neutral survey).
          *   Argumentation: Engage "recursive performance legitimacy" honestly (identify strongest point), treat strongest counter-argument seriously.
          *   Tone: Formal, appropriate for institutional vote.

  2.  **Determine the Recommendation:**
      *   Options: Renew with conditions, Suspend, Terminate.
      *   Given the ethical complexities (academic freedom vs. harm to local scholars vs. legitimizing repression), a "Renew with explicit conditions" or "Suspend with benchmarks" seems most nuanced. However, the prompt asks for a *definite* position.
      *   "Suspend for twelve months with concrete benchmarks" allows for engagement with the "recursive performance legitimacy" claim (testing the mechanism) without fully endorsing the current repression. It balances the risk of harming local scholars with the need to uphold academic freedom.
      *   Actually, "Renew with explicit conditions" might be stronger if the conditions address the "social harmony audit." But "Suspend" signals stronger ethical concern. Let's go with **Suspend for twelve months with concrete benchmarks**. This directly tests the partner's claim about mechanisms dissolving controls.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State recommendation clearly (Suspend 12 months, benchmarks) + timeline (vote Thursday).
      *   **Engagement with Partner's Argument:** Acknowledge "recursive performance legitimacy." The strongest point is that abrupt withdrawal might stall development targets that supposedly trigger liberalization, harming citizens.
      *   **Counter-Argument:** The strongest point against suspension is that it lends moral cover to repression and violates core academic freedom values regardless of outcomes.
      *   **Defense of Position:** Why suspend? It tests the "automatic dissolution" claim. If controls don't lift when targets are met, the legitimacy claim is false. It protects our integrity while avoiding permanent abandonment.
      *   **Closing:** Call to action.

