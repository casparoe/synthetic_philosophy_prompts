answer: |-
  You have identified a gap in the popular discussion of fiction. You are correct that the "Paradox of Fiction" (how can we feel for what does not exist?) is not your problem. Your problem is the **Paradox of Normative Engagement**: *How can we feel emotions that presuppose value judgments we explicitly reject, without feeling hypocritical or deluded?*

  There is no single, canonical term for this specific phenomenon in the way "The Paradox of Fiction" exists. However, it is discussed in three overlapping neighborhoods: **Imaginative Resistance** (Tamar Gendler), **Narrative Ethics** (Noël Carroll, Martha Nussbaum), and **Film Theory** (specifically the concept of *Suturing*).

  If we are to give it a name that captures the mechanics you describe, the most precise available term is **Normative Alignment** (sometimes discussed as **Aesthetic Acquiescence**).

  Here is an account of what it is, how it handles your three cases, and where its edges lie.

  ### 1. What is Normative Alignment?

  **Definition:** Normative Alignment is the temporary, involuntary adoption of a value framework prescribed by the structure of a representation, distinct from the viewer's enduring moral beliefs.

  It is not a belief that the events are real (you know they are not). It is not a belief that the actions are good (you know they are wrong). It is a **procedural commitment** to the internal logic of the representation. When you engage with a story, you agree to play a "game" where certain moves count as "success" and others as "failure." Your emotions track the success or failure of the *pattern*, not necessarily the morality of the *content*.

  ### 2. Analysis of Your Three Cases

  **Case 1: The Revenge Film (Complicit Desire)**
  *   **Diagnosis:** This is successful Normative Alignment.
  *   **Mechanism:** You are not wanting the *murder*; you are wanting the **Narrative Closure**. Philosophers like Noël Carroll argue that narratives set up questions or imbalances (a wrong was done) that demand resolution. The emotion you feel is the tension of that structural requirement.
  *   **Why no guilt?** Because the value you are temporarily holding is not "Revenge is good," but "This pattern should resolve." You are aligning with the *genre's* values, not the *world's* values. The "alien values" you sense are the **Diegetic Values** (the values internal to the story's logic).
  *   **Object of Wanting:** You want the *completion of the narrative arc*. The character is merely the instrument of that completion.

  **Case 2: The Framing Effect (Perspectival Normativity)**
  *   **Diagnosis:** This confirms that the phenomenon is structural, not factual.
  *   **Mechanism:** This is what film theorists call **Suturing**. The camera, the music, and the editing "stitch" you into a specific subject position. If the camera looks *up* at a villain, he is majestic; if it looks *down*, he is pathetic. The events are identical, but the **Normative Frame** has shifted.
  *   **Significance:** This proves your emotion is not a judgment on the *events* (which didn't change) but a response to the *presentation*. You are aligning with the **Presenter's Valuation**.

  **Case 3: The Cold Scene (Uptake Failure)**
  *   **Diagnosis:** This is **Imaginative Resistance** (a term coined by Tamar Gendler).
  *   **Distinction:** Cases 1 and 2 are the *successful operation* of Normative Alignment. Case 3 is its *breakdown*.
  *   **Why the blame?** In Cases 1 and 2, the "contract" holds: you lend your emotions, the work provides a coherent frame. In Case 3, the frame is either too weak (the work failed to earn the emotion) or your own moral resistance is too strong (you refuse to align). The "blame game" exists because this is a cooperative act. If you feel cold, either the work failed to prescribe the emotion effectively, or you failed to surrender to the prescription.

  ### 3. Answers to Your Specific Questions

  **Are the first two cases one phenomenon?**
  Yes. They are both instances of successful **Normative Alignment**. Case 1 shows alignment with *narrative logic* (closure); Case 2 shows alignment with *perspectival framing* (presentation). Both demonstrate that your emotional response tracks the *design* of the work, not your independent moral assessment of the events.

  **Is the third the same phenomenon inverted?**
  It is the **failure condition** of the same mechanism. Think of it like vision: Cases 1 and 2 are seeing clearly; Case 3 is blindness. It is the same visual system, but the input failed to register. However, Case 3 introduces a normative layer (blame) because fiction is a communicative act. When alignment fails, we ask who broke the communication.

  **What is the object of the wanting in the first case?**
  It is rarely the character *per se*, and rarely the raw event (the killing). It is the **Resolution of the Tension**. You want the narrative question ("Will he get justice?") to be answered. The "wanting" feels real because the *attention* is real. You are attending to a possibility space.

  **Does it matter whether I endorse the values?**
  No. Endorsement is a separate, higher-order judgment. You can align with a value framework (e.g., "In this story, violence is the only solution") without endorsing it (e.g., "In reality, violence is bad"). In fact, the phenomenon is most visible precisely when you *do not* endorse them. If you endorsed them, it would just be normal moral agreement. The "alien" feeling you describe is the signature of Normative Alignment.

  **Does it extend to non-fictional framings?**
  Yes. This is crucial.
  *   **Anecdotes:** When a friend tells a story with a "spin," they are asking for Normative Alignment. If you laugh at a misfortune because they framed it as a comedy, you have aligned with their frame, even if you think the misfortune is serious.
  *   **Advertisements:** An ad frames a purchase as "freedom." You may not believe it, but while watching, you feel the pull of "freedom."
  *   **Ethics Seminars:** A stylized hypothetical ("Imagine a trolley...") asks you to align with its constraints. If you feel outrage at a utilitarian calculation in a seminar, you are aligning with the seminar's frame that *this calculation matters*.

  **Does it extend to framings I have produced myself?**
  Yes. This is **Fantasy** or **Daydreaming**. When you imagine a scenario where you triumph, you are framing the events for yourself. You can feel the triumph (Alignment) while knowing it is fantasy (No Belief). The mechanism is identical; the source of the frame is just internal.

  ### 4. Boundaries and Exclusions (What it is Not)

  To define the edges, we must distinguish Normative Alignment from nearby concepts:

  1.  **It is not Suspension of Disbelief.**
      *   *Suspension of Disbelief* concerns **Existence** (pretending this is real).
      *   *Normative Alignment* concerns **Value** (pretending this matters).
      *   *Boundary:* You can suspend disbelief (believe the dragon is real for a moment) but refuse alignment (feel no fear because you don't care about the village).

  2.  **It is not Moral Disengagement.**
      *   *Moral Disengagement* (Psychology) implies a temporary shutting off of your moral compass to allow harmful behavior, often with negative ethical implications.
      *   *Normative Alignment* leaves your moral compass intact. You judge the revenge as wrong *while* wanting it to succeed. The two judgments run in parallel tracks.
      *   *Boundary:* If you finish the film and think, "Actually, revenge *is* good," you have moved from Alignment to **Persuasion**. Alignment is temporary; Persuasion is enduring.

  3.  **It is not Make-Believe (Waltonian Quasi-Emotion).**
      *   Kendall Walton argues fictional emotions are "quasi-emotions" (like a child pretending to be scared).
      *   You correctly note your wanting is *not* make-believe. It takes your attention "the way real wanting does."
      *   *Boundary:* Normative Alignment acknowledges the emotion is **Real**, but its **Object** is abstract (the narrative pattern) rather than concrete (a real person).

  4.  **It is not Imaginative Resistance.**
      *   *Imaginative Resistance* is the *refusal* to align (Case 3).
      *   *Normative Alignment* is the *success* of the uptake (Cases 1 & 2).
      *   *Boundary:* When the text asks you to imagine "Murder is good" as a *moral truth of the world*, you resist (Gendler). When the text asks you to imagine "Murder is the necessary climax" as a *narrative truth*, you align. The edge lies between **Moral Truth** (resisted) and **Narrative Necessity** (accepted).

  ### Summary Definition

  **Normative Alignment** is the cognitive-emotional mechanism by which an agent temporarily adopts the evaluative framework of a representation to facilitate engagement, distinct from belief in the representation's existence or endorsement of its moral propositions.

  *   **It includes:** Rooting for a villain due to narrative structure; feeling moved by a frame you intellectually reject; feeling rhetorical pull in conversation.
  *   **It excludes:** Brainwashing (permanent value change); Delusion (belief in existence); Moral Disengagement (loss of moral judgment).

  You are describing the **autonomy of aesthetic logic** over moral logic. The story creates a local universe with its own physics of value. When you enter, you breathe that air. You do not have to like the air, and you do not have to believe the planet is real, but while you are there, your lungs expand to fit it. Case 3 is simply the moment your lungs refuse to expand.
