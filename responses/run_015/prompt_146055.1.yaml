      *   This avoids the "fiction with footnotes" charge because evidence and causal reality still bind the narrative.

  7.  **Final Polish:** Ensure the tone is seminar-appropriate (collegial, rigorous, encouraging). Make sure to explicitly answer "Which step should I reject?" (Step 4 and 10).

      *(Self-Correction during drafting)*: I should be careful not to just say "Mechanisms." In Phil of History, "Rational Explanation" (Dray) is often the specific counter to CLM. I should mention both. Also, Danto is crucial for the "narrative sentence" aspect which addresses the "form adds nothing" claim.

