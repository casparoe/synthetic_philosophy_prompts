      *   **Conclusion:** Reiterate that rationality demands that irrelevant alternatives (or irrelevant states of the world) do not flip preferences.

  6.  **Refining the Tone:**
      *   Needs to be persuasive. Use strong verbs.
      *   Avoid hedging too much ("some might say"). Instead, "The defender of rationality must insist..."
