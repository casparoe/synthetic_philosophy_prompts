          *   *The Sure-Thing Principle:* Use Savage's formulation. It's about conditional preference.
          *   *The "Cancellation" Argument:* If I offer you a bet on a horse race, and I add a side bet that pays you $100 regardless of who wins, does that change your preference on the horse race? No. The Allais paradox is structurally identical. The 89% chance is a "side bet" that changes payoff but not the relative merit of the risky component.
