  2.  **Deconstruct the Allais Paradox:**
      *   **Gamble 1A:** $1M for sure.
      *   **Gamble 1B:** 0.89 ($1M) + 0.10 ($5M) + 0.01 ($0).
      *   **Gamble 2A:** 0.11 ($1M) + 0.89 ($0).
      *   **Gamble 2B:** 0.10 ($5M) + 0.90 ($0).
      *   **Common Preference:** 1A $\succ$ 1B and 2B $\succ$ 2A.
      *   **Expected Utility (EU) Analysis:**
          *   1A $\succ$ 1B $\implies u(1M) > 0.89u(1M) + 0.10u(5M) + 0.01u(0)$.
          *   Simplify: $0.11u(1M) > 0.10u(5M) + 0.01u(0)$.
          *   2B $\succ$ 2A $\implies 0.10u(5M) + 0.90u(0) > 0.11u(1M) + 0.89u(0)$.
          *   Simplify: $0.10u(5M) + 0.01u(0) > 0.11u(1M)$.
          *   Contradiction: The inequalities are reverses of each other.

  3.  **Identify the Violated Axiom:**
      *   Is it Transitivity? No, the preferences within each pair are consistent. The issue is across pairs.
      *   Is it Dominance? No, neither gamble strictly dominates the other in either pair.
      *   Is it Independence? Yes.
      *   *The Common Consequence Effect:* Both 1A and 1B share an 89% chance of winning $1M. Both 2A and 2B share an 89% chance of winning $0. If you strip away the common consequence, 1A/1B becomes 2A/2B.
      *   Formal Independence Axiom: If $L \succ L'$, then for any $L''$ and $p \in (0,1]$, $pL + (1-p)L'' \succ pL' + (1-p)L''$.
      *   Here, let $L = \$1M$ (sure), $L' = \text{Gamble}(5M, 10/11; 0, 1/11)$, $L'' = \$1M$, $p = 0.11$. Wait, that's not quite right.
      *   Better formulation: Let $X = \$1M$, $Y = \text{Gamble}(5M, 10/11; 0, 1/11)$, $Z = \$0$.
      *   Actually, the standard decomposition is:
          *   1A: 0.89($1M) + 0.11($1M)
          *   1B: 0.89($1M) + 0.11(Gamble: 5M w.p. 10/11, 0 w.p. 1/11)
          *   2A: 0.89($0) + 0.11($1M)
          *   2B: 0.89($0) + 0.11(Gamble: 5M w.p. 10/11, 0 w.p. 1/11)
      *   The common component is the 0.89 probability mass. In Pair 1, it yields $1M. In Pair 2, it yields $0.
      *   Independence says the preference between the *remaining* 0.11 parts should not depend on the common 0.89 part.

  4.  **Steelman the Irrationality (The Core Challenge):**
      *   Why is violating Independence *irrational* rather than just *non-expected utility*?
