      *   *Key Insight:* The 89% common outcome is *irrelevant* to the choice between the remaining 11%. Treating it as relevant is like letting the color of the car influence your decision on the engine.

  8.  **Final Polish:** Check the algebra in the explanation to ensure clarity. Ensure the distinction between "descriptive" (people do this) and "normative" (people shouldn't do this) is sharp. (The prompt asks for the normative steelman).

      *(Self-Correction during drafting)*: I need to be careful not to confuse the "utility of certainty" argument. Proponents of Allais say certainty has extra utility. The counter-argument is: If certainty has extra utility, it should be reflected in the utility of the outcome $u(1M)$, not the probability weighting. If you treat $1M$ differently because it's certain vs probabilistic, you are violating the description of outcomes. But the steelman needs to say: Even if you value certainty, you cannot value it *inconsistently* across the two pairs. In Pair 2, the 11% chance of 1M is not certain, so the "certainty bonus" shouldn't apply there, but the math shows the preference reversal implies the bonus disappeared or flipped. Actually, the stronger argument is the *cancellation* of the common event.

