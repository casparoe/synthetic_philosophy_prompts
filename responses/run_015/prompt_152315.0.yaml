          *   Kosovo 1389 $\rightarrow$ Dangerous Lost Cause (Betrayal + Territorial Claims).
          *   Masada $\rightarrow$ Integrative Martyrdom (Heroic Resistance + No Betrayal + No Territorial Demand).
