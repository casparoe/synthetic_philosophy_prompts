answer: |-
  ### Desiderata for a Solution to the Boltzmann Brain Problem

  To count as a solution, a cosmological theory $T$ must satisfy the following requirements. These are designed to ensure the solution is operational for model-building, not merely philosophically comforting.

  **D1: The Dominance Condition**
  *   **Requirement:** The theory must predict that the expected number of Ordinary Observers (OOs) arising from low-entropy history vastly exceeds the expected number of Boltzmann Brains (BBs) arising from fluctuations within the relevant spacetime volume. Formally: $N(OO) \gg N(BB)$.
  *   **Motivating Case:** The **Dominance Worry**. If $N(BB) \gg N(OO)$, a random sampling from the set of all observers implies that I am a BB. A viable theory must prevent this numerical swamping.
  *   **Status:** **Non-negotiable.** Without this, the theory predicts I am a fluctuation, which contradicts the working assumption of empirical cosmology.

  **D2: The Ratification Condition**
  *   **Requirement:** The theory must not imply that the evidence used to confirm the theory is likely noise. If $T$ implies $P(BB|T) \approx 1$, then $T$ implies my memories and measurements are likely random fluctuations, which undermines the evidential basis for believing $T$. A solution must break this loop.
  *   **Motivating Case:** The **Ratification Worry**. A theory can satisfy D1 (OOs outnumber BBs) but still fail if the mechanism that produces OOs also suggests that *my specific* evidence is unreliable. Conversely, a theory might fail D1 but claim we can trust our reasoning anyway; this requirement blocks that escape. It demands epistemic stability, not just numerical superiority.
  *   **Status:** **Non-negotiable.** This distinguishes a physical prediction from a self-undermining skepticism.

  **D3: The Evidence-Matched Reference Class**
  *   **Requirement:** The comparison in D1 must be conducted between OOs and BBs that share the *same total apparent evidence* (the "Archive Case"). The theory must specify whether the reference class is "all conscious states" or "conscious states with evidence $E$," and justify why BBs with false records of $E$ are included or excluded.
  *   **Motivating Case:** The **Archive Case**. A minimal BB (a momentary conscious flash) does not share my evidence (notebooks, instruments, coherent memories). A "Boltzmann Archive" (a BB with a full false history) does. Minimal BBs are cheap and numerous; Boltzmann Archives are expensive and rare. The verdict on D1 flips depending on whether we count minimal BBs or only Archives. A solution must fix the class.
  *   **Status:** **Non-negotiable.** Counting minimal BBs against me is a category error (they don't have my evidence); counting only Archives makes the problem physically tractable.

  **D4: The Falsifiability of Self-Location**
  *   **Requirement:** The theory must specify what observation would count as evidence *for* the hypothesis that I am a BB. If no possible observation could increase $P(BB|Evidence)$, then the claim "I am not a BB" is dogmatic rather than empirical.
  *   **Motivating Case:** **Epistemic Closure.** If a theory entails I am an OO regardless of what I observe (e.g., because BBs are defined as having disordered experiences and I have ordered ones), the theory is immune to empirical correction regarding self-location.
  *   **Status:** **Negotiable.** Some camps argue self-location is a priori; others demand it be empirical.

  **D5: The Consistency of Typicality**
  *   **Requirement:** The principle of typicality (or sampling assumption) used to derive cosmological predictions from the theory must be the same principle used to evaluate the BB threat. The theory cannot invoke typicality to predict the CMB and then suspend it to avoid the BB conclusion.
  *   **Motivating Case:** **Methodological Cherry-Picking.** Many models use the "Principle of Mediocrity" to infer global parameters from local data. If that principle is discarded when it implies I am a BB, the methodology is ad hoc.
  *   **Status:** **Preference of the Physics Community.** Philosophers of probability may allow context-sensitive sampling; working cosmologists generally require a stable measure.

  ***

  ### Analysis of Tensions and Exclusionary Power

  **Jointly Unsatisfiable Subset**
  There is a live tension between **D3 (Evidence-Matched Reference Class)** and **D5 (Consistency of Typicality)**.
  *   *The Conflict:* To satisfy D1 (Dominance) without fine-tuning the physics, one often restricts the reference class to "Observers with Evidence $E$" (D3). This suppresses BBs because Boltzmann Archives are exponentially rarer than minimal BBs. However, standard typicality assumptions (D5) usually dictate sampling from "all observers" or "all observer-moments," not just those matching specific data. If you use typicality to derive the measure (D5), you typically get swamped by minimal BBs. If you restrict the class to save the theory (D3), you appear to violate the typicality rule you used to build the theory (D5).
  *   *Precise Diagnosis:* You cannot consistently maintain that (a) I should reason as if I am a random sample from all observers (for physics) and (b) I should reason as if I am a random sample from observers-with-my-evidence (for BB avoidance), unless the theory physically guarantees these classes are co-extensive.

  **Requirement Doing the Most Work**
  **D1 (The Dominance Condition)** is the primary exclusionary filter. Most candidate cosmologies (particularly eternal inflation models without a settled measure) fail here immediately. It forces the physics to suppress fluctuations or truncate spacetime.

  **Prejudice Dressed as Desideratum**
  **D5 (Consistency of Typicality)** is the strongest candidate for prejudice. It assumes that "typicality" is a rigid methodological law rather than a pragmatic heuristic. A camp exists (often associated with Bayesian subjective approaches) that argues sampling assumptions are allowed to shift when the stakes move from predicting external data to evaluating the reliability of the data itself. Enforcing D5 privileges a frequentist/objective measure approach over a subjective Bayesian one.

  **The "Smuggling" Requirement**
  **D3 (The Evidence-Matched Reference Class)** is the point where the problem can be made to vanish.
  *   *Why:* If the requirement is interpreted as "Compare me only to observers with *veridical* records," BBs are excluded by definition, and D1 is trivially satisfied.
  *   *Correction:* To avoid smuggling the answer, D3 must be strictly defined as "Observers with *apparent* records." If a solution relies on the claim that BBs cannot physically instantiate complex records (the "Archive" argument), it must demonstrate this via physical cost, not by definitional fiat. Dropping the "apparent" constraint makes the BB problem disappear by definition, rendering the desideratum useless as a test.

  ***

  ### Stress Tests (Brief)

  *   **Low-Entropy Past / Finite Future:** Passes D1 and D2 easily (fluctuations suppressed by finite time/entropy). Passes D5 (standard sampling works).
  *   **Eternal Inflation / Measure Problem:** Fails D1 unless a specific measure is chosen that suppresses BBs. Struggles with D5 (measure choice often looks ad hoc to satisfy D1). D3 is the battleground (whether the measure weights by evidence).
  *   **Reject Sampling (e.g., "I am not a random sample"):** Passes D2 by fiat. Fails D5 explicitly (claims typicality is invalid for self-location). Often struggles with D4 (hard to specify evidence for BB hypothesis if sampling is rejected).

  ***

  ### Self-Critical Assessment

  **Least Secure Requirement**
  **D4 (The Falsifiability of Self-Location)** is my least secure constraint.
  *   *Reason:* It is genuinely unclear what empirical data could distinguish a BB with false memories of data $X$ from an OO with true memories of data $X$. If the internal state is identical by hypothesis, the evidence is identical. Demanding empirical falsifiability here might demand the impossible.
  *   *What would make me drop it:* A rigorous argument showing that self-locating beliefs are inherently non-empirical (akin to logical truths) and that demanding empirical evidence for them category-errors the nature of indexical knowledge. If it can be shown that $P(BB|Evidence)$ is fixed by the theory alone, D4 becomes inappropriate.

  **Where This Project Might Be Misguided**
  The entire project of specifying a "solution" assumes there is a determinate fact of the matter about whether I am a BB, waiting to be captured by the right theory. It is possible that the "problem" is not a bug in cosmology but a feature of applying objective probabilities to subjective experience.
  *   *The Risk:* We may be asking for a physical theory to solve an epistemological dilemma. If the tension between D1 and D2 is not resolvable by physics but only by adopting a specific epistemic stance (e.g., "I must assume I am real to reason at all"), then listing physical desiderata is misguided. The "solution" might not be a cosmological model, but a dissolution of the demand for one. If no theory can satisfy D1 and D2 simultaneously without ad hoc measures, the error may lie in the assumption that cosmological measures dictate self-locating credence.
