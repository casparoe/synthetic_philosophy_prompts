answer: |-
  This is a sharp diagnosis. You are correct that the "contract model" is the operating system for almost all public discourse on consent, even among those who think they are rejecting it. It is attractive because it maps onto liberal legalism: autonomous agents, clear boundaries, enforceable promises. But as you suspect, it is a Procrustean bed for human sexuality.

  Here is the audit you asked for, followed by the verdict.

  ### 1. The Mapping: Consent as Contract

  | Contract Element | Consent Analog | Function in the Model |
  | :--- | :--- | :--- |
  | **Offer** | Proposition / Initiation | One party signals willingness to engage in a specific act. |
  | **Acceptance** | "Yes" / Affirmative Consent | The other party agrees to the terms. |
  | **Consideration** | Mutual Pleasure / Intimacy | The "value" exchanged (often implicit). |
  | **Capacity** | Age, Sobriety, Cognitive Ability | Legal competence to enter the agreement. |
  | **Terms** | The Specific Acts | What is allowed (e.g., kissing vs. intercourse). |
  | **Fraud (Factum)** | Lying about the Nature of the Act | "This is a medical exam" vs. sex. Invalidates consent. |
  | **Fraud (Inducement)** | Lying about Status/Intent | "I'm single," "I'm sterile." Usually *does not* invalidate consent. |
  | **Duress** | Threats of Harm | "Sleep with me or I fire you." Invalidates consent. |
  | **Breach** | Violating Boundaries Mid-Act | Going beyond agreed terms (e.g., removing a condom). |
  | **Remedy** | Punishment / Sanction | Jail, expulsion, social ostracization. |
  | **Revocation** | "Stop" / Withdrawal | Termination of the contract (performance must cease). |

  ### 2. Where the Mapping Breaks (And Why It Matters)

  The analogy holds up well for *adjudication* (after the fact, determining liability) but fails catastrophically for *guidance* (before/during the act, determining ethics). Here are the disanalogies that do real work:

  **A. Consideration (The "Quid Pro Quo" Problem)**
  *   **The Break:** In contract law, consideration must be bargained-for exchange. In sex, "consideration" is often shared experience, not a transfer of goods.
  *   **The Work It Does:** This is where the STI/Vasectomy/Monogamy cases break. Under contract law, lying about a vasectomy is fraud in the *inducement* (a reason for signing), not the *factum* (what is being signed). Therefore, the contract is valid. You agreed to sex; you got sex. The risk of pregnancy was your problem to assess (caveat emptor).
  *   **Why It Fails:** This treats bodily risk as a commercial liability rather than a violation of integrity. If I agree to a surgery because you lied about your credentials, that is battery, not just breach of contract. Lying about an STI imposes a physical risk on the body that was not agreed to. The contract model protects the liar by categorizing the body as a vessel for a service rather than the self.

  **B. Revocability (The "Performance" Problem)**
  *   **The Break:** Contracts are designed to be binding. Once performance begins, you cannot usually revoke without penalty. Consent *must* be revocable without penalty at any millisecond.
  *   **The Work It Does:** This exposes the flaw in the "enthusiastic yes" standard if treated as a one-time signature. A contract model suggests that once the deal is signed (foreplay), the performance (intercourse) is owed unless a breach occurs.
  *   **Why It Fails:** It creates a "point of no return" pressure. If consent is a contract, changing your mind mid-act looks like a breach of promise. In reality, consent is a continuous state of affairs, not a discrete event.

  **C. Duress vs. Power Asymmetry (The "Gun to the Head" Problem)**
  *   **The Break:** Contract duress requires an *illegitimate threat* (e.g., "I will burn your house down"). It does not cover "hard choices" created by circumstance (e.g., "Sleep with me or you're homeless," if the landlord isn't legally obligated to house you).
  *   **The Work It Does:** This is your "detonated relationship" case. The contract model says if I have the right to break up with you/house you, I can use that leverage to get sex. It treats power asymmetry as a market condition, not a coercive force.
  *   **Why It Fails:** It ignores that consent requires *freedom*, not just the absence of a gun. If the cost of "no" is catastrophic (homelessness, career destruction), the "yes" is not an exercise of autonomy, it is a survival strategy. The contract model validates survival strategies as autonomous choices.

  ### 3. The Hard Cases: Verdicts

  **Deception (STI vs. Vasectomy vs. Monogamy)**
  *   **Contract Verdict:** Only STI lies might count (physical harm/battery). Vasectomy and monogamy are inducements; consent stands.
  *   **My Verdict:** The contract model is wrong here. **STI and Vasectomy lies invalidate consent; Monogamy lies do not.**
      *   *Reasoning:* STI and Vasectomy lies directly alter the *physical risk profile* of the act (disease, pregnancy). This is closer to fraud in the factum (the nature of the physical interaction). Monogamy lies are about emotional expectation, not bodily risk.
      *   *Contested Claim:* I am asserting that bodily risk trumps emotional expectation in defining the "act." A libertarian would argue all are inducements; a radical feminist might argue all invalidate consent. I am staking a middle ground: consent protects bodily integrity first.

  **Coerced-but-not-Threatened (The "Cheap Exit")**
  *   **Contract Verdict:** Consent is valid. No illegitimate threat was made.
  *   **My Verdict:** **The "Cheap-Exit" condition is necessary, but it does not turn every yes into a maybe.**
      *   *Reasoning:* It is not just "duress done properly." It is a shift from *negative liberty* (no one stopped me) to *positive liberty* (I had a viable alternative). However, it does not mean you can never sleep with a boss or landlord. It means the burden shifts to the powerful party to ensure the exit is actually cheap. If a professor sleeps with a student, the professor must prove the student could have said no without academic harm.
      *   *Contested Claim:* This imposes an affirmative duty on the powerful party to mitigate power asymmetry. Critics will call this paternalistic or unworkable. I argue it is the only way to make autonomy real in hierarchical structures.

  **Capacity (Drunk, Age, Disability)**
  *   **Contract Verdict:** Bright lines. Under 18 = No. Blackout = No.
  *   **My Verdict:** **Bright lines are legally necessary but ethically crude.**
      *   *Reasoning:* For law/campus codes, you *must* have bright lines (e.g., BAC > 0.08, Age < 18) because adjudicators cannot assess "functional understanding" in retrospect without bias. However, ethically, capacity is scalar. A blackout drunk person cannot consent. A buzzed person might. A 17-year-old might be more mature than a 20-year-old.
      *   *Contested Claim:* I am arguing for a dual-track system: Strict liability for law/policy (to protect the vulnerable from predatory litigation), but a nuanced, functional understanding for moral judgment. The 17-year-old seeking an older partner is ethically complex; legally, she must be protected by the bright line.

  ### 4. The "Improv" Alternative

  You are right to be suspicious. The improv analogy (jazz, climbing belay) solves the *dynamic* problem but smuggles in a *normative* one.

  *   **The Smuggle:** Improv assumes the goal is *cooperation* and *mutual creation*. This excludes transactional sex, kink dynamics where one party surrenders agency, or sex where one party is purely passive. If you make "mutual responsiveness" a condition of valid consent, you are effectively outlawing vanilla sex that isn't "good" or "connected."
  *   **The Utility:** However, it is superior to contract for *communication*. It captures the need for ongoing calibration.
  *   **Verdict:** Keep improv as a metaphor for *good* sex, not *valid* consent. Valid consent is a floor; improv is the ceiling. Do not build policy on the improv model because you cannot adjudicate "bad improv."

  ### 5. Final Verdict: Drop the Contract Model

  **Keep it for:** Determining legal liability *ex post*. We need the concepts of breach and remedy to punish violators.
  **Drop it for:** Defining what consent *is* *ex ante*.

  **Why:** The contract model treats sex as a transfer of rights over a body. It assumes the parties are strangers with conflicting interests who need a treaty. But sex is (usually) a shared activity where interests are aligned, or at least intertwined.

  **The Better Picture:** **Stewardship of Access.**
  Instead of "I grant you permission to use this property," think "I am allowing you access to my vulnerability."
  *   **Deception:** Lying about STIs/sterility is a violation of stewardship (endangering the host).
  *   **Coercion:** Making the exit expensive is a violation of stewardship (exploiting the vulnerability).
  *   **Capacity:** Stewardship requires the owner to be present. If you are blackout drunk, you are not present to steward the access.

  **What you will have to defend in the comments:**
  1.  **The Materiality of Deception:** You will be attacked for distinguishing between lying about a vasectomy (invalidates) vs. lying about love/money (doesn't). You must defend the line at *bodily risk* vs. *life planning*.
  2.  **The Burden on the Powerful:** The "cheap exit" condition implies the powerful party (boss, professor) is responsible for the subordinate's freedom. Libertarians will call this an infringement on the subordinate's agency ("She chose to do it!"); you must argue that choice under structural constraint is not full agency.
  3.  **Legal Bright Lines vs. Moral Reality:** You will be challenged on the 17-year-old case. If she's mature enough to understand, why ban it? You must defend the administrative necessity of bright lines over individual justice in legal contexts.

  **Summary for your column:** The contract model is a zombie. It walks and talks in our laws, but it is dead to the reality of human intimacy. It protects the letter of the agreement while killing the spirit of the autonomy it claims to champion. We need a model that recognizes sex not as a transaction of rights, but as a negotiation of vulnerability.
