          *   Subject: Procedurally generated NPC (villager) in a sandbox.
          *   Characteristics: Algorithmic rules, reactive behaviors (shelter, flee), no phenomenal consciousness, no memory, no script.
          *   Task: Analyze moral status (Direct wrong? Indirect wrong? No wrong?).
          *   Specific Requirements: Distinguish scripted vs. emergent behavior, address Singer's capacity-for-suffering criterion (responsive but sentience-empty), discuss representational harm (even if player knows it's not real).
