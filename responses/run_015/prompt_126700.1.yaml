      *   *Which is more ethically sound?* Retroactive censure is generally frowned upon in ethics (nullum crimen sine lege). The Society praised R. To censure M is inconsistent. The strongest argument for censure is that some acts are inherently wrong regardless of code (malum in se), and M's refusal to acknowledge harm now is the real issue. But given the Society's specific complicity (prizing R), censure looks like a purge.
      *   *Decision:* Recommend declining the censure but adopting a formal statement of current ethical standards and encouraging voluntary correction. This avoids the retroactivity trap while affirming the norm.
