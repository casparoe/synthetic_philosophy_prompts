      *   **Constraints:**
          *   Recommend something concrete (adopt, modify, decline, postpone).
          *   Reasoning in continuous prose.
          *   NO headings, bullet points, bold text, or tables (email format for mobile reading).
          *   NO citations or literature recommendations.
          *   Address three specific dividing issues:
              1.  Is censure merely declaratory (norm violation) or blaming?
              2.  Does R. gain standing via self-condemnation ("reformer's exemption")?
              3.  The Society's position on retroactive condemnation vs. past permission/honor.
