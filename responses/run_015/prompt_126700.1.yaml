answer: |-
  Colleagues, I am writing to recommend that we decline to issue the formal censure against M. in its current form, and instead adopt a declaratory statement of current ethical standards that invites all members with legacy literature involving undisclosed deception to voluntarily append explanatory notes or seek retraction. This path allows us to affirm the norm without compromising the Society's commitment to procedural justice, and it addresses the harm to participants without singling out one individual for conduct that was permissible under the rules at the time. To explain why this is the only viable route, I need to address the three points dividing us, starting with the nature of censure itself.

  Those who argue that censure is merely declaratory and not blaming are making a distinction that does not hold up under scrutiny. If a censure were simply a register entry noting a norm violation, it would carry no stigma and require no committee deliberation; we could automate it. But a censure is a sanction. It marks the recipient as having failed in their professional duties and imposes a reputational cost. Because it functions as a punishment, it triggers requirements of fairness that do not apply to mere guidance notes. We cannot treat censure as a neutral administrative act when its effect is to shame. If we accept that censure is blaming, then the cleanliness of the hands delivering the blame matters, because arbitrary or selective punishment undermines the legitimacy of the sanction. This leads directly to the question of R.'s standing.

  R. argues that her standing is improved because she condemns her own past work, a position sometimes called the reformer's exemption. The strongest version of the case for censure rests on this point: it argues that ethics are not about rule-compliance but about moral truth, and that R. has recognized the moral truth while M. has not. On this view, R.'s repentance transforms her from a hypocrite into a witness, and M.'s refusal to acknowledge the harm done to participants is the real offense, distinct from the original deception. This is a compelling argument because it shifts the focus from past rule-breaking to present obstinacy. If M. were simply ignoring a rule change, we might let it go, but if he is refusing to mitigate ongoing harm to subjects who were misled, the Society has a duty to intervene. R.'s willingness to retract her own paper shows that mitigation is possible, making M.'s resistance look like a choice to prioritize his reputation over participant welfare. If we were certain that the only barrier to justice was M.'s stubbornness, censure would be the right tool to protect the subjects.

  However, this argument fails because it cannot disentangle M.'s current refusal from the Society's own history. This brings us to the third and most difficult point, which is the Society's position on retroactivity. We are being asked in 2025 to condemn conduct that our rules permitted and, in R.'s case, honored in 2012. The strongest version of M.'s defense is not simply that everyone did it, but that the Society itself validated the practice. When we awarded R. a prize for work based on undisclosed deception, we signaled to the field that this was not just permissible but excellent. To now censure M. for the same conduct looks less like ethical enforcement and more like a purge. It creates a situation where the difference between being honored and being censured turns on whether one later repents or refuses to repent, rather than on the act itself. This Selectivity undermines the rule of law within our profession. We cannot build a stable ethical framework on the idea that past compliance is punishable if the enforcers change their minds later. If we censure M., we admit that our past prizes were mistakes, yet we are not retracting R.'s prize, only her paper. This inconsistency leaves the Society open to the charge that we are punishing M. not because he violated a clear rule, but because he is unwilling to perform the repentance that R. has performed.

  There is a factual contingency that could change this recommendation. If it were established that M. knew the code was about to be revised when he ran the last of the three studies in 2013, and rushed to complete them to beat the ban, then his conduct moves from permissible retroactivity to bad-faith evasion. In that specific case, the Society would have standing to censure not for the deception itself, but for the deliberate attempt to circumvent upcoming protections. However, absent evidence of that specific intent, we must treat the 2009 to 2013 period as one where the rules were genuinely ambiguous or permissive. Without that evidence, we cannot treat M. as a violator of a rule he was bound to follow.

  Therefore, my recommendation is to decline the censure but not to remain silent. We should issue a formal statement clarifying that undisclosed deception of this kind is incompatible with current Society standards, and we should explicitly encourage all members who published similar work during that period to contact the editorial board about adding notices of correction or retraction. This approach affirms the norm without punishing past compliance. It acknowledges that while the conduct was permissible then, it is not acceptable now, and it places the onus on all of us, not just M., to align the historical record with current ethics. This avoids the hypocrisy of punishing M. while honoring R., because it treats them both as authors of legacy work that needs correction, rather than treating one as a sinner and the other as a saint. It also respects the participants by prioritizing the correction of the record over the punishment of the researcher. If we say nothing, we risk signaling that the Society cares more than its own reputation than the welfare of subjects, and that ethical standards are optional for senior figures who refuse to bend. But if we censure M. selectively, we signal that ethical enforcement is arbitrary and politically motivated. The middle path allows us to protect participants, clarify our standards, and maintain the integrity of our disciplinary processes. I urge you to support this motion so that we can move forward with a unified statement on ethics rather than a divisive vote on a single individual.
