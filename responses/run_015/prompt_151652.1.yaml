      *   **Key Components:**
          1.  **Active Execution:** Students must actually run a lookup procedure on an unfamiliar script. Half see inputs/outputs (Outside), half run the rules (Inside).
          2.  **The Third Round (Meta-Cognition):** The system generates a first-person report about its own understanding based *only* on the lookup procedure. This challenges the "no understanding" claim from the inside.
          3.  **Blocked Escapes:** The rulebook was generated by an automated procedure from a corpus (no human understanding in the chain). This blocks "Programmer Understanding" replies. Students must discover this block themselves.
          4.  **Stakes:** Prediction market/chips to reveal confidence, not just assertion.
      *   **Deliverables:** Rules, materials, minute-by-minute timeline, opening framing, debrief mapping (including classical replies), troubleshooting (spoilers, skepticism, task difficulty), limitations, and self-critique on the "transparency" objection.

  2.  **Deconstruct the Activity Design:**

      *   **The Script:** Needs to be unfamiliar but decipherable via rules. Kanji is too hard for 5 minutes. Made-up symbols (glyphs) are better. Let's use a set of 20-30 distinct glyphs.
      *   **The Task:** Question-Answer pairs.
      *   **The Roles:**
          *   *Operators (Inside):* Have the Rulebook. Receive Input Glyphs. Match patterns. Output Glyphs. No idea what they mean.
          *   *Observers (Outside):* See Input Glyphs and Output Glyphs. Judge fluency/correctness.
          *   *The System (Round 3):* The Operators run a *second* rulebook that takes "Internal State" (confusion, pattern match confidence) as input and outputs "English-like" text (or fluent Glyphs translated by a key) claiming understanding. *Correction:* The prompt asks for the report to come out of the *same mechanism*. To make it punchy, the output should be in the *target script* but translated for the class, OR the target script *is* the report. Let's make the target script represent "feelings." Actually, to maximize the "Inside/Outside" tension, the Round 3 output should be in the *native language of the class* (English) but generated *by the glyph rules*. This proves the system can talk about itself without understanding.
          *   *Refinement on Round 3:* The prompt says "Feed the operator... questions about what it was like... let the procedure emit a fluent, convincing first-person report." If the output is English, it breaks the "unfamiliar script" immersion. If the output is Glyphs, the Outside group needs to know what they mean.
          *   *Solution:* The "Language" is a cipher. The Outside group has a Key (Glyph = English Word). The Inside group has Rules (Glyph Pattern = Output Glyph). Round 3: Inside gets "How did you feel?" (as Glyphs). They run rules. Output is Glyphs. Outside decodes it. It says "I understood most, but question 3 was hard."
      *   **The "No Human Understanding" Stipulation:** The Rulebook wasn't written by a linguist. It was "mined." I need to embed this in the backstory given to the students *during* the setup without using forbidden words.
      *   **Prediction Market:** Use poker chips or sticky notes. Bet on "Does the system understand?" or "Will the Outside group rate the answers as fluent?"

  3.  **Drafting the Materials:**

      *   *Script:* 10 basic glyphs (Shapes: Circle, Square, Triangle, etc., with internal marks).
      *   *Rulebook:* If Input has [Shape A] + [Mark B], Output [Shape C].
      *   *Round 3 Rulebook:* If Input is [Question Glyph] + [Internal State Glyph (e.g., 'hesitation')], Output [Report Glyph].
      *   *Decoding Key (Outside Only):* Glyph A = "Who", Glyph B = "You", etc. Or better, keep it abstract. "This sentence is fluent." Let's stick to the prompt's requirement: "fluent, convincing first-person report." It needs to be readable. So the Outside group *must* have a translation key.
      *   *Wait, one constraint check:* "Vocabulary of syntax, semantics... must not appear." I can use "Meaning" vs "Shapes."
      *   *The "Automated Rulebook" Backstory:* "These rules were generated by a machine scanning millions of texts to find statistical correlations. No human wrote them."

  4.  **Timeline Construction (75 mins):**

      *   0-5: Framing & Setup (No theory).
      *   5-20: Round 1 (Execution). Inside works, Outside watches.
      *   20-30: Betting/Assessment (Outside rates fluency, Inside rates effort).
      *   30-45: Round 3 (The Meta-Report). Inside runs rules on "How was that?"
      *   45-55: The Crisis (Outside reads report, Inside denies understanding).
      *   55-75: Debrief (Reveal CRA, map moves).

  5.  **Addressing the "Blocked Escapes" (Constraint 3):**

      *   Students will say "But who wrote the rules?"
      *   Facilitator Response: "The rules were extracted by a pattern-matching algorithm from a database of correct conversations. No human authored the specific rule you are holding."
      *   Students will say "But the database was made by humans."
      *   Facilitator Response: "True. But the rule-extraction step had no semantic access, only statistical frequency. Does understanding survive the extraction?"
      *   *Self-Correction:* The prompt asks to hold these stipulations back *until* someone proposes the move. I need a "Fact Sheet" for the facilitator to reveal only when challenged.

  6.  **Addressing the Self-Critique (Transparency Objection):**

      *   *Objection:* The activity makes the process look mechanical (lookup), so of course it feels like no understanding. Real AI (LLMs) isn't transparent lookup.
      *   *Response:* I must admit this limitation. The activity isolates *symbol manipulation* but fails to capture *connectionist opacity*. I need to explicitly state in the debrief that the "mechanical feel" is a pedagogical simplification that risks begging the question against functionalism.

  7.  **Refining the "Third Round" (Constraint 2):**

      *   This is the trickiest part. How do I generate a "fluent first-person report" via lookup in 15 minutes?
      *   *Idea:* Pre-generate the report. The "Input" for Round 3 is fixed. The Operators think they are answering a question about their experience. They follow rules. The Output is a specific string of Glyphs. The Outside group decodes it. It reads: "I felt I was manipulating symbols without meaning, yet I produced correct answers."
      *   *Wait, that's too meta.* It should read: "I understood the questions, though the third one was ambiguous."
      *   *Mechanism:* The Inside group has a "State Card" they fill out after Round 1 (e.g., "How confident were you?"). They feed *that* into the Round 3 rules. The Rules map "Low Confidence" + "Question 3" -> "I was unsure about 3."
      *   *Actually, to make it punchy:* The Rules *always* output the same "Understanding Claim" regardless of the input, or the input is rigged. Let's make it so the Rules *force* a claim of understanding even if the Operator felt none. This creates the dissonance.
      *   *Revised Plan:* Round 3 Input is "Describe your understanding." The Rules dictate the Output Glyphs. The Output decodes to "I understood the context well." The Operator *knows* they didn't. The Outside group sees "I understood."

  8.  **Troubleshooting:**

      *   *Spoiler:* If a student knows CRA, make them a "Monitor" or exclude them (ask them not to speak). Better: Ask them to play "Devil's Advocate" for the Outside view only.
      *   *Task Difficulty:* Pilot the glyphs. Ensure lookup takes < 2 mins per question.
      *   *Skeptic:* If a student insists "You *are* understanding," validate them but ask "Where is it located?"

  9.  **Final Review against Constraints:**

      *   No "Syntax/Semantics/Searle" until debrief? Yes.
      *   Active execution? Yes.
      *   Inside/Outside split? Yes.
      *   Round 3 (Self-Report)? Yes.
      *   Blocked Escapes (Automated Rules)? Yes.
      *   Stakes (Chips)? Yes.
      *   Self-Critique included? Yes.

  10. **Writing the Plan:** (Focusing on tone: precise, actionable, philosophical.)

      *   *Materials:* Need specific Glyph examples.
      *   *Framing:* Needs to be neutral. "A communication system."
      *   *Debrief:* Needs to map "Inside View" to "Searle's Intuition," "Outside View" to "Turing Test," "Round 3" to "System Reply/Other Minds."

