  ### Outline of Approach

  **1. Acknowledge the Room's Geometry**
  *   Start by noting the physical setup (the circle) and the demographic split (philosophers vs. clinicians).
  *   Validate the tension: Philosophers care about *consistency* and *entitlement*; clinicians care about *outcomes* and *alliance*.
  *   Goal: Don't try to dissolve the tension immediately. Use it as the engine for the workshop.

  **2. Interrogate the "Standing" Intuition**
  *   State the standard philosophical view: Hypocrisy undermines standing (the "tu quoque" problem).
  *   Pivot to the clinical reality: In addiction work, a clinician claiming moral purity often loses the patient.
  *   Introduce the provocation: Could "impure" standing be more robust than "pure" standing in therapeutic contexts?

  **3. Shift from "Verdict" to "Tool"**
  *   Move away from blame as a judgment of character (philosophical default) toward blame as an intervention (clinical default).
  *   If blame is a tool, its legitimacy isn't just about the user's moral record, but about whether the tool works without causing harm.
  *   Pose the question: Does transparency about shared failure change the *normative structure* of the blame, or just its *efficacy*?

  **4. Set the Ground Rules for Dialogue**
  *   Ask philosophers to hold off on defining terms too tightly.
  *   Ask clinicians to describe the *moment* blame happens, not just the policy.
  *   Close with an invitation to disagree. The goal isn't consensus; it's better friction.

  ***

  ### Opening Remarks: "Blame, Hypocrisy and Therapeutic Practice"

  Hi everyone. Thanks for coming.

  I know we're sitting in a circle, which usually means we're trying to be equal, but I think we all know the room is split. Half of us spend our time worrying about the conditions for moral responsibility, and the other half spend their time trying to keep people alive when those conditions feel completely irrelevant. I'm a philosopher, so I'm standing on one side of that divide, but I'm trying to look over the fence.

  I want to start with the thing that probably brought us all here, which is the intuition that hypocrisy kills your right to blame. You know the idea. If I'm guilty of the same thing you are, I lose my standing. I can't point the finger. In a lot of moral philosophy, that's pretty solid. It's about consistency. It's about not claiming an authority you haven't earned.

  But I've been talking to some of the clinicians here beforehand, and I keep hitting a wall with this. Because in the clinic—especially in addiction work—purity doesn't seem to buy you authority. Actually, it seems to cost you.

  If a therapist sits across from a patient and implies, "I have mastered this, and you haven't," the alliance often breaks. The patient feels judged, not helped. But if the clinician says, "I struggle with impulses too, here's how I manage them," the dynamic shifts. The blame—or the challenge, or the confrontation—lands differently. It doesn't feel like a verdict from above. It feels like a hand across the table.

  So here's the problem I'm bringing to you, and I don't have the answer yet.

  If a clinician challenges a patient on a relapse, while admitting they still struggle with similar behaviors in their own life... are they a hypocrite? Technically, maybe. But do they lack standing? It doesn't look like it. In fact, their standing might *depend* on that admission.

  I want us to spend the day wrestling with whether "standing" in a therapeutic room is the same thing as "standing" in a moral court. When we talk about blame here, are we talking about holding someone accountable in a normative sense, or are we talking about a clinical intervention that happens to look like blame?

  I'm worried that if we use the philosophical definition of hypocrisy too rigidly, we miss what's actually happening in the room. But I'm also worried that if we just say "whatever works is fine," we lose the ethical guardrails that protect patients from manipulation.

  So, my request for today is this: When you share cases or arguments, don't smooth over the friction. If a philosopher says "that's inconsistent," and a clinician says "that's effective," let's stay in that discomfort. I want to know if there's a kind of functional honesty that looks like hypocrisy from the outside but does different work on the inside.

  I'm going to stop there. We're here to think together, not to listen to me try to solve this in five minutes. I'm really grateful you're all here to help me figure out if this line of thinking holds water, or if I'm just confused.

  Who wants to start?
