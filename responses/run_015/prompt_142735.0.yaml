answer: |-
  Yes, this is a moral luck movie, but it uses the concept to show that when luck turns catastrophic, the philosophical question of blame collapses into the psychological reality of survivability.

  You are right to reject the blameless truck driver comparison because Lee was negligent, but that actually makes him a clearer case of "resultant moral luck" than the innocent driver. Moral luck thrives on negligence: consider two drunk men who leave a fire unattended. One goes home, sleeps, and wakes up to a singed rug; the other wakes up to a pile of ash and three dead children. Their actions were identical, their intent was identical, but their moral standing is permanently different because of the outcome. Lee is trapped not because he was evil, but because the universe rolled a critical failure on his carelessness. The film illuminates this by showing how the legal system and the town distinguish between the action and the outcome—they rule it an accident, they don't shun him—while Lee cannot make that distinction. For him, the outcome *is* the action. The luck isn't just that the fire happened; the luck is that the fire succeeded in destroying everything, thereby locking him into the identity of "the man who killed his kids" rather than "the man who made a mistake."

  However, the film resists the standard moral luck framework by suggesting that sorting out the blame doesn't actually matter. The philosophical puzzle usually asks, "How much should we blame him given the luck?" *Manchester by the Sea* answers, "It doesn't matter what we think, because he cannot live with himself." This is where your observation about the town's kindness becomes crucial. The town offers him what philosophers would call "external absolution." They treat him with kid gloves, not because they think he's innocent, but because they recognize the punishment he's already inflicting on himself is worse than anything they could devise. Their kindness is torture because it highlights the disconnect between social reconciliation and internal redemption. They are ready to move on; he is frozen in the moment of the fire. The film argues that moral luck isn't just about how the world judges you, but about how the outcome alters your capacity to function as a moral agent in the future. Lee isn't refusing forgiveness; he is stating an incapacity. When he tells his ex-wife "I can't beat it," he is saying the luck of that night broke the mechanism inside him that allows for healing.

  The scene with his ex-wife is the pivot point where the movie moves beyond moral luck into something darker. She tries to rewrite the moral ledger by admitting her own cruelty and offering love, effectively trying to change the circumstances of his guilt. She is offering him a new narrative where he is not a monster but a tragic figure who is still loved. Lee rejects this not because he doesn't want it, but because he believes he doesn't deserve the bandwidth it would require. This is where the standard taxonomy fails to capture the emotional weight, and your concept of "audience luck" is incredibly sharp. There isn't a single canonical term for this in the standard Nagel or Williams discussions—they focus on the agent and the act—but ethicists sometimes discuss the "moral community" or "relational scaffolding." Your term "audience luck" is more precise because it highlights the need for witnesses who can hold the story with you.

  Lee's brother, Joe, was that audience. Joe provided Lee with circumstantial luck by giving him a job, a place to stay, and a role as an uncle that didn't require him to be a father. Joe carried part of the burden simply by being present and demanding Lee's utility. When Joe dies, Lee loses his audience. He is forced back into Manchester, back into the physical space of the tragedy, without the buffer of the one person who could look at him and see something other than the fire. That is indeed a form of luck—purely circumstantial—that determines whether grief is shareable or isolating. Without Joe, Lee has no one to validate his continued existence, so he retreats to Boston where he is anonymous. The film suggests that some outcomes are so heavy they require a collective to carry them; when luck strips you of that collective, the guilt becomes a life sentence regardless of legal innocence.

  Ultimately, the movie argues that moral luck is not just about how we assign blame, but about how chance dictates who we are allowed to be afterward. Lee was lucky to survive the fire, but unlucky to survive it without the support system needed to process it. The film refuses the comfort of the philosophical debate—which usually seeks to normalize the role of luck—and instead sits with the wreckage. It posits that while the town can decide Lee isn't a criminal, only luck could have decided whether he remained a person capable of staying in Manchester, and that luck ran out when Joe died.
