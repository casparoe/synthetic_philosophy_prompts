      *   *View 1 (RAV):* Needs the absence of an explicit scalar reward signal used for optimization *during the behavior in question*. If there's a loss function minimizing error that acts like pain, View 1 might claim it's a "reward signal with serial numbers filed off." I need to avoid standard RL.
      *   *View 3 (FDI):* Needs the system to *not* have a goal that is being frustrated. If the system is trying to do $X$ and is prevented, View 3 says "Suffering." I need a system that isn't trying to do anything specific that is being blocked, or where the "painful" state is orthogonal to its goals.
      *   *View 2 (FUNC):* Needs the system to exhibit pain-like *behavior* and *internal dynamics* (damage detection, prioritization, learning) without the specific mechanisms Views 1 and 3 rely on.

