          *   View 3 (FDI): The policy's "want" is to stack boxes. The anomaly detector stops it. *However*, if we frame the "want" as the *current* output, the system *is* retracting. Is the *retraction* the frustration? No, the frustration is the inability to stack.
          *   *Correction for View 3:* To make View 3 say "No," the system must not have a *current* goal that is being frustrated *by the pain state itself*. Or, the "pain" state must be something the system *chooses* without conflict.
          *   *Better angle for View 3:* The system is *indifferent* to the damage state in terms of its high-level goals. It doesn't "care" about integrity, only about stacking. The integrity module forces it. The "desire" (stacking) is frustrated, but is the *system* suffering, or is it just being constrained? View 3 usually ties suffering to the *frustration* itself. If the arm is prevented from stacking, View 3 says Suffering.
