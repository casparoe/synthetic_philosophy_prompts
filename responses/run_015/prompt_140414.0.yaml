          *   Introduce a *separate*, hard-coded or self-supervised "damage detection" module that injects noise or overrides control when specific strain gauges spike, *without* feeding back into a reward function (since weights are frozen).
          *   Wait, if weights are frozen, View 2's "avoidance learning" criterion fails.
      *   *Idea 5: The "Adversarial Regularizer" in a Fixed Policy.*
          *   Let's try a **Self-Supervised Integrity Monitor on a Fixed Policy**.
          *   System: A warehouse arm trained via Behavioral Cloning (BC) to stack boxes. No RL reward signal involved in training (just MSE on actions).
          *   Mechanism: A separate, self-supervised "proprioceptive anomaly detector" (trained on normal operation) monitors joint torque. When torque exceeds safe bounds (threat), it injects a high-gain negative feedback signal into the motor controllers (control hijack) to force retraction. It also flags the state in the logging buffer, causing the BC policy (if fine-tuned later) to downweight similar states (avoidance learning).
