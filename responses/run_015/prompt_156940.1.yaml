          4.  So: Start with Solution $(\mathcal{M}, g)$. Apply $\phi$. Get $(\mathcal{M}, \phi^*g)$.
          5.  Outside $H$: $\phi = id$, so $g = \phi^*g$.
          6.  Inside $H$: $\phi \neq id$, so $g \neq \phi^*g$ (at the same point $p$).
      *   *Crucial distinction:* Emphasize we are comparing $g(p)$ and $(\phi^*g)(p)$ at the *same manifold point* $p$. This is where the "point identity" premise hits hard. If $p$ has no identity other than what's on it, $g(p)$ defines $p$. Moving $g$ to $q$ makes $q$ the new "$p$-like" spot.

