  They bury deep the **seed**
  Behind the garden **wall**,
  Waiting for the **turn**
  Of seasons they **hold** dear,
  Until the frost will **break**
  The ruler and the **line**.

  Nothing respects the **line**
  Drawn around the **seed**;
  The ice begins to **break**
  Beyond the city **wall**,
  Where strangers **hold** the ground
  And make their violent **turn**.

  A borrowed **turn** of phrase,
  Along a ghostly **line**,
  We **hold** up forms too old
  For this exhausted **seed**;
  Spring climbs the concrete **wall**
  Waiting for the **break**.

  Some choose to **break**
  Away from every **turn**,
  Retreating from the **wall**
  To redraw every **line**,
  Carrying the **seed**
  They promise to **hold**.

  Mechanisms to **hold**
  The structure from the **break**,
  Mixing every **seed**,
  Slowing down the **turn**,
  Blurring every **line**,
  Patching every **wall**.

  There is no final **wall**
  That history can **hold**,
  Nor any perfect **line**
  Where time will **break**
  Into a new **turn**
  From the rotting **seed**.

  The **seed** survives the **wall**,
  Making its **turn** to **hold**,
  Until we **break** the **line**.

  ***

  The poem sides with Toynbee: the cycle is real, but it functions as a traction mechanism for a linear vector (the cart), provided the creative minority survives the petrification of the universal state. I think you got Spengler wrong; his morphological isolationism is the weakest link here, as the poem suggests the "seed" (solidarity/culture) can transmit across the "wall" of a dying civilization, whereas Spengler insisted cultures are closed organisms that cannot truly borrow or survive their winter.
