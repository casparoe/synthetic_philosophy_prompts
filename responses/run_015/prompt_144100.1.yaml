  Compare Dennett's Orwellian and Stalinesque revisions as explanations for the color phi illusion, especially regarding when the brain "decides" on the experienced color change. Don't just summarize both — I want to know which one actually respects the temporal order of neural processing, and which one has to smuggle in a kind of backwards causation.

