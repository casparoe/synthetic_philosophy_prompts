  3.  **Philosophical Background (Internal Knowledge):**
      *   *The Paradox of Fiction:* Typically attributed to Radford (1975), though discussed earlier. How can we feel emotions for entities we know don't exist?
      *   *Standard Solutions:*
          1.  *Illusion Theory:* We suspend disbelief (Coleridge). (Often criticized as too strong).
          2.  *Pretend Theory:* Walton (1978). We engage in a game of make-believe. We feel "quasi-emotions."
          3.  *Thought Theory:* We respond to propositions/thoughts, not existence claims. (Carroll, etc.).
          4.  *Surrogate/Displaced Emotion:* We feel for real people similar to the character.
          5.  *Non-cognitive Theories:* Emotions don't require existential belief (Jenefer Robinson, etc.).
      *   *The Quoted Passage's Stance:* It aligns closely with Kendall Walton's "Mimesis as Make-Believe," specifically the idea of "quasi-emotion."
