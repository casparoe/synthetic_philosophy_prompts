answer: |-
  The distinction you are looking for is the philosophical distinction between **Hard Facts** and **Soft Facts**.

  While these terms originate in the philosophy of time and foreknowledge (specifically in responses to the "naval battle" puzzle you mentioned), they map precisely onto the narrative problem you have identified. They provide the sharp boundary you need to determine which sentences impose the ending onto the beginning and which do not.

  ### The Definition

  **A Hard Fact** about a moment in the story is a statement whose truth is settled *solely* by the state of the world at that moment.
  **A Soft Fact** about a moment in the story is a statement whose truth depends on events that occur *after* that moment.

  In your revision process, the distinction is this:
  *   **Hard Fact:** "She walked out the door." (True because of her muscles, the door, and the time at Chapter Two.)
  *   **Soft Fact:** "She walked out the door for the last time in eleven years." (True only because of the plot resolution in Chapter Twenty.)

  ### The Boundary: The Deletion Test

  To use this distinction sharply, apply the **Rest-of-Book Deletion Test** to any forward-pointing sentence in your draft.

  Ask: *If I deleted everything written after this sentence, would this statement still be true?*

  1.  **If Yes:** It is a **Hard Fact** (or a logical truth). The narrator is describing the scene's immediate reality or logic. This sentence does not constrain the character's future; it describes their present.
  2.  **If No:** It is a **Soft Fact**. The statement borrows its truth from the ending. This sentence imports the author's structural decision into the character's lived experience.

  ### Why This Matters for Your Characters

  You asked which sentences "take something away from my characters." The answer lies in the difference between **phenomenological openness** and **narrative closure**.

  *   **Hard Facts preserve openness.** When the narrator says, "She did not know she would never see him again," the narrator asserts a Hard Fact about her ignorance. The future remains open *to her*. The sentence respects the character's agency because it describes only what is present to her consciousness.
  *   **Soft Facts impose closure.** When the narrator says, "She was never to see him again," the narrator asserts a Soft Fact about the timeline. This collapses the character's future into a fixed past. It does not remove metaphysical freedom (as you noted), but it removes *narrative uncertainty*. It treats the character's life as a completed artifact rather than a living process.

  If you use Soft Facts heavily, your novel will feel fated, inevitable, and perhaps claustrophobic. If you use Hard Facts, the novel will feel immediate, urgent, and open, even if the narrator knows the end.

  ### The Grammatical Marker

  Your intuition about the grammar is correct. Soft Facts nearly always require the **Future-in-the-Past** tense (*would, was going to, was about to, was to*).

  *   **Hard Fact Grammar:** Simple Past ("She walked"), Present ("She knows").
  *   **Soft Fact Grammar:** Future-in-the-Past ("She *would* walk," "She *was to* learn").

  This grammatical form is the linguistic signal that the narrator is looking back from the end of the story. It is the marker of a Soft Fact. When you see "would" in a revision, ask: *Is this a Soft Fact?* If so, do you want to impose the ending here?

  ### Test Cases

  Here are three cases to test the definition against your drafts:

  **Case 1: The Prophecy**
  *   *Sentence:* "He was destined to die."
  *   *Analysis:* **Soft Fact.** Truth depends on the ending.
  *   *Effect:* Removes agency. The character is a puppet of the plot.
  *   *Revision:* "He walked into the danger zone." (Hard Fact).

  **Case 2: The Logical Truth**
  *   *Sentence:* "Either he would die or he would not."
  *   *Analysis:* **Logical Truth.** Not a fact about the world, but about logic. Survives deletion.
  *   *Effect:* Neutral. Does not constrain the character.

  **Case 3: The Emotional State**
  *   *Sentence:* "She felt a sadness she would not understand for ten years."
  *   *Analysis:* **Soft Fact.** The *feeling* is Hard (present), but the *understanding* is Soft (future).
  *   *Effect:* Mixed. It colors the present with the future. Use sparingly.
  *   *Revision:* "She felt a sadness she could not name." (Hard Fact).

  ### Summary for Revision

  1.  **Identify** forward-pointing sentences.
  2.  **Apply the Deletion Test.** Does the truth survive if the book ends at the next page?
  3.  **Classify:**
      *   **Hard Fact:** Safe to use. Describes the scene.
      *   **Soft Fact:** Use with caution. Describes the plot.
  4.  **Decide:** Do you want the narrator to emphasize the *story* (Soft) or the *life* (Hard) at this moment?

  This distinction allows you to control the tension between the narrator's knowledge and the character's experience without confusing truth with settlement.
