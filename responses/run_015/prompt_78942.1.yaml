  ### The Case: The Archive's Status

  Two geologists, molecule-for-molecule duplicates, hold identical ore samples (Element 29, naturally mined). Both defer to the "Mineral Archive," a non-human database. In World A, the Archive is a guideline; "Copper" means Element 29. In World B, a past social act ratified the Archive as binding law; "Copper" means Element 29 *plus* compliance with all hidden protocols (which require natural origin). The subjects' brains and the ore are microstructurally identical. The physical Archive text is identical; only its normative status differs, grounded in past practice. No experts exist to correct them.

  ***

  ### The Audit

  **1. The Three Lines**

  *   **Internalist:**
      *   **Verdict:** Same Meaning.
      *   **Fixing:** The subjects' brain states are identical. They have the same dispositions, memories, and beliefs about "Copper."
      *   **Extension:** Whatever their internal concepts pick out (likely a descriptive cluster involving "reddish metal," "conductive," etc.).
  *   **Putnam-ish (Natural Kind Externalism):**
      *   **Verdict:** Same Meaning.
      *   **Fixing:** The actual nature of the stuff out there. The ore is Element 29 in both worlds. The hidden microstructure fixes the extension regardless of community beliefs or archive rules.
      *   **Extension:** Element 29 (in both worlds). The "natural origin" constraint in World B is treated as a fallible description, not part of the essence.
  *   **Burge-ish (Social Externalism):**
      *   **Verdict:** Different Meaning.
      *   **Fixing:** The norms of the linguistic community. In World B, the concept is constituted by the binding protocols of the Archive. In World A, it is not.
      *   **Extension:** World A: Element 29. World B: Element 29 *of natural origin*. (If synthesized Element 29 existed, it would be "Copper" in A but not B).

  **2. Stretching the Theories**

  *   **Putnam:** Is "Copper" here a natural kind term? Putnam's externalism is strongest on terms like "water" or "gold." If "Copper" is regulated by an Archive, a Putnamian might argue it has become a *functional* or *social* kind term, not a pure natural kind. If so, Putnam's "same meaning" verdict weakens. However, since the subjects treat it as a natural kind ("geologists," "ore"), the Putnamian line holds that the *stuff* overrides the *rule*.
      *   *Legit?* Yes, provided we accept the subjects are attempting to refer to a natural kind despite the social regulation.
  *   **Burge:** Burge's cases (e.g., "arthritis") typically involve concepts where the social norm *partially constitutes* the subject matter. Applying this to a physical substance like copper stretches Burge into Putnam's turf. Burge usually concedes Putnam's point on natural kinds (he doesn't argue "water" means different things if norms differ, provided the stuff is H₂O).
      *   *Legit?* This is the tension point. For Burge to say "Different," he must treat "Copper" as a socially constituted concept (like "Grade-1 Copper"). If he treats it as a pure natural kind, he converges with Putnam. The case forces Burge to prioritize the *normative status* over the *physical essence*.

  **3. The Single Feature Doing the Work**

  *   **Feature:** The **Normative Status of the Archive** (Guideline vs. Binding Law).
  *   **Collapse:** If you delete this difference (making the Archive either binding in both worlds or non-binding in both), the social norms align. Burge's verdict collapses to "Same Meaning." The divergence disappears, and all three lines (Internalist, Putnam, Burge) might agree on "Same" (if binding + same text) or Internalist/Putnam agree on "Same" vs Burge "Different" (if binding + different text).
  *   Specifically, if the Archive is just a guideline in both worlds, the "hidden protocols" in World B lack normative force. Burge cannot claim they fix the content. The social difference vanishes.

  **4. The Best Defence for the Losing Line**

  *   **Losing Line:** Putnam (if we accept Burge's verdict) or Burge (if we accept Putnam's verdict). Let's assume **Putnam** is challenged here because the social norm *actually* changes usage conditions.
  *   **Defence:** The Putnamian argues the case begs the question by assuming a social norm can override physical essence for a natural kind term. If "Copper" refers to a natural kind, then *any* community rule excluding synthesized Element 29 is simply *wrong*, not meaning-constitutive. The World B subjects are mistaken about the meaning of their own word, but the meaning remains fixed by the stuff.
  *   **Does it land?** It lands well if "Copper" is indisputably a natural kind. It fails if "Copper" in this context is a trade classification (a social kind) that *supervenes* on natural kind properties but is defined by practice. The defence relies on categorizing the term.

  **5. Verdicts and Rigging**

  *   **Do verdicts fall out of the theories?** Yes, provided the term is hybrid. Putnam's theory dictates extension follows physical essence. Burge's theory dictates content follows normative use. Where these come apart (physical essence is constant, normative conditions vary), the theories diverge.
  *   **Is it rigged?** There is a risk of rigging if the term is artificially constructed to be both a natural kind and a social kind simultaneously. However, this reflects real-world usage (e.g., "Organic Food," "Conflict Diamonds," "Heritage Grain"). These terms refer to physical stuff but are defined by social rules.
  *   **The "Microstructure" Constraint:** The prompt forbids microstructural differences in "anything." Strictly speaking, if the Archive's *normative status* differs, something physical must differ (e.g., the history of votes, the ink in a ratification log). If the physical world is *truly* identical down to the atom, norms cannot differ (physicalism).
      *   *Correction:* I interpreted "anything" as "anything relevant to the subjects or the referent." The Archive's history differs. This is necessary for social externalism to function at all. If I rigidly enforced "no physical difference anywhere," the case would be impossible because social facts supervene on physical facts. I have assumed the prompt allows physical differences in the *archive's history* to ground the normative difference, while keeping the *subjects* and *referent* physically identical. This is the only way to isolate Social Externalism from Natural Kind Externalism.

  **Conclusion for the Seminar:**
  This case isolates the work of Social Externalism. Putnam's externalism is silent on the normative status of the Archive; it looks only at the ore. Burge's externalism is sensitive to the Archive's status. If the seminar accepts that terms like "Copper" can be governed by trade norms (Social) while referring to elements (Natural), then Social Externalism *is* doing work Natural Kind Externalism ignores: it tracks the *conditions of application* imposed by practice, not just the *conditions of identity* imposed by physics.
