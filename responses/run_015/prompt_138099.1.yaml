answer: |-
  **The Case**
  Elena, a freelance architect with stable income and clear priorities, is deciding whether to purchase a high-end workstation that costs 20% of her liquid wealth. She is fully informed, faces no borrowing constraints, and can freely trade cash for equipment. We observe her choices across every possible budget set and confirm she strictly prefers owning the workstation to renting her current setup. When we calculate the maximum cash she would pay to acquire the workstation from her current state (Willingness-To-Pay), the number is \$10,000. When we calculate the minimum cash she would require to voluntarily give up the workstation if she already owned it (Willingness-To-Accept), the number is \$14,000. This divergence arises not from loss aversion or confusion, but because the purchase is large enough to significantly alter her marginal utility of money: paying \$10,000 leaves her poorer and makes remaining cash more valuable, while accepting \$14,000 makes her richer and makes additional cash less valuable. The choice data is complete and consistent, yet the dollar measure of her gain depends entirely on which state we treat as the reference point.

  **What the Readings Say**
  *   **The Choice-Index Reading:** Says there is no further fact to uncover. The utility function is merely an ordinal encoding of the fact that Elena chose *Own* over *Rent*. The \$10,000 and \$14,000 figures are just technical artifacts of measuring an ordinal ranking with a monetary ruler that changes length depending on where you stand. To ask "how much" she gained is a category error; she gained *that* she got what she preferred.
  *   **The Benefit Reading:** Says there *should* be a fact of the matter about the magnitude of her welfare improvement to inform policy (e.g., is a \$12,000 subsidy justified?). Since the money-metric numbers diverge by \$4,000, the "benefit" is indeterminate. The choice data fixes the direction of the gain but fails to fix the size, leaving the policy question unanswered despite having perfect information on preferences.

  **The Feature Doing the Work**
  **The non-marginal scale of the transaction relative to wealth.** Because the good is indivisible and costly, moving from one state to the other creates a significant income effect. This changes the marginal utility of money between the two states, driving a wedge between the compensating variation (WTP) and equivalent variation (WTA).

  **If You Remove That Feature**
  If you make the good infinitesimally small or make her wealth effectively infinite (quasi-linearity), the income effect vanishes. WTP and WTA converge to the same number. **Yes, this collapses back into the ordinary money-metric story.** In the marginal limit, the money ruler stops changing length, and the "benefit" becomes a unique dollar amount. This admits that the objection only holds for the large, discrete changes that policy actually cares about (housing, health, infrastructure), not for the marginal adjustments where standard theory is secure.

  **The Strongest Defence for the Choice-Index Purist**
  "The policy maker is asking for a cardinal fact where only an ordinal one exists. You are treating 'utility' as a substance like height or weight, but it is merely a ranking. The gap between \$10,000 and \$14,000 isn't a measurement error or a missing fact; it is the precise geometric description of her preferences. To demand a single number is to demand that we impose an arbitrary reference point (either the status quo or the target) and pretend it's objective. Choice exhausts the ontology; the rest is just accounting."

  **Honest Verdict**
  This is a **genuine objection to the policy use of utility**, but not necessarily to the ontology of revealed preference. It demonstrates that while choice data can perfectly predict *what* an agent will do, it cannot uniquely quantify *how much* she benefits in money terms without an arbitrary choice of reference point. It is not merely "messiness"; it is an underdetermination problem inherent to cardinalizing ordinal preferences over large changes. However, the RP purist can consistently reply that the "how much" question is itself illegitimate. The case proves that if policy requires cardinal welfare metrics, revealed preference alone—even with perfect data and rational agents—cannot provide them.
