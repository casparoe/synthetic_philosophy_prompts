  To: Frontier Systems Review Committee
  From: Committee Chair
  Re: Retrospective Review Standards and Case Resolutions (Kestrel/Heron)
  Date: October 24, 2023

  **Recommendation**

  **Kestrel:** Issue a formal finding of non-compliance. Impose a hold on the team's next deployment slot. Require a mandatory remediation plan within 30 days addressing data provenance, evaluation logging, and rollout staging. The hold lifts only upon verification that the remediation is complete and the evaluation pipeline is reproducible.

  **Heron:** Issue no finding of non-compliance. Do not penalize the team's next deployment slot. Require the team to integrate the specific social-engineering vector into the institute's central hazard taxonomy and share the incident report internally as a case study within 14 days.

  **General Standard for Retrospective Review**

  Henceforth, retrospective review shall operate on a dual-track standard:

  1.  **Compliance Track:** Judgments of non-compliance are based solely on adherence to pre-authorized protocols, diligence standards, and reporting requirements existing at the time of deployment. Realized harm does not constitute non-compliance absent evidence of protocol deviation, negligence, or concealment.
  2.  **Safety Learning Track:** Incidents involving realized harm trigger a mandatory review to update institutional safety requirements. This track assesses whether existing protocols were sufficient, not whether the team failed.

  *Scope:* Applies to all deployments above the capability threshold.
  *Exception:* In cases of catastrophic harm (physical injury, critical infrastructure failure), the Compliance Track may be reopened to investigate latent negligence not captured by existing protocols.

  **Proposal on Outcome-Blinded Review**

  I recommend we **adopt in modified form** the proposal to split retrospective review into outcome-blinded compliance and separate learning reviews.

  *Modification:* The "learning review" must have authority to propose immediate interim requirement updates to the Committee Chair, rather than waiting for the full cycle. This ensures realized outcomes improve our process without punishing compliant teams. The procedural variance requirement is adopted as piloted for one cycle to assess overhead vs. signal quality.

  **Opposing Considerations**

  The strongest argument against this framework is that it risks decoupling our standards from reality. Proponents of outcome-weighted judgment argue that process is merely a proxy for safety; if harm occurs, the proxy failed. They contend that insulating teams from outcome-based consequences encourages "checkbox compliance," where teams optimize for documentation rather than actual risk reduction. They argue that without the threat of sanction following harm, teams lack the urgency to exceed minimum requirements, and the committee loses its only unbiased signal that our process requirements correlate with safety. By treating harm as merely "information," we may institutionalize rituals that look rigorous but fail to prevent actual damage.

  **Reasons**

  We must distinguish between bad luck and bad process. Kestrel violated core safety protocols; their lack of incident is statistically indistinguishable from undetected failure due to minimal monitoring. Sanctioning them enforces the baseline rigor required to trust any evaluation. Heron followed every requirement; sanctioning them for an incident their process could not reasonably catch punishes diligence and incentivizes hiding incidents.

  The dual-track standard resolves the moral luck inconsistency. It ensures teams are judged on what they control (process) while ensuring the institute learns from what it cannot fully control (outcomes). This maintains enforceability while prioritizing harm reduction through iterative process improvement rather than retrospective punishment.

  \answer{Kestrel: sanction; Heron: no sanction; standard: hybrid; outcome-blinded proposal: adopt modified}
