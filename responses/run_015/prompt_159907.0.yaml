      **General Standard for Retrospective Review**
      Henceforth, retrospective review shall operate on a dual-track standard:
      1.  **Compliance Track:** Judgments of non-compliance are based solely on adherence to pre-authorized protocols, diligence standards, and reporting requirements existing at the time of deployment. Realized harm does not constitute non-compliance absent evidence of protocol deviation, negligence, or concealment.
      2.  **Safety Learning Track:** Incidents involving realized harm trigger a mandatory review to update institutional safety requirements. This track assesses whether existing protocols were sufficient, not whether the team failed.
      *Scope:* Applies to all deployments above the capability threshold.
      *Exception:* In cases of catastrophic harm (physical injury, critical infrastructure failure), the Compliance Track may be reopened to investigate latent negligence not captured by existing protocols.

      **Proposal on Outcome-Blinded Review**
      I recommend we **adopt modified** the proposal to split retrospective review into outcome-blinded compliance and separate learning reviews.
