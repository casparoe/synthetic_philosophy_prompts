  **Design Doc: Project Substrate-Neutral Mindstate Migration (SNMM)**

  **1. Summary**
  This document outlines the architecture for migrating human cognitive processes from biological neural tissue to a substrate-neutral cloud runtime. The project treats the mind as a state machine defined by causal relations between inputs, outputs, and internal states. By decoupling the logical structure from the biological hardware, we achieve horizontal scalability and reduced maintenance overhead.

  **2. Goals**
  *   **Input-Output Equivalence:** The migrated system must produce outputs indistinguishable from the biological baseline given identical inputs.
  *   **Hardware Agnosticism:** The runtime must support deployment on any Turing-complete substrate.
  *   **Latency Reduction:** Target p99 response time for motor commands under 15ms.

  **3. Non-Goals**
  *   **Semantic Content:** The specification does not account for what internal states represent (e.g., "pain," "red," "self"). Only the causal role of the state matters.
  *   **Continuity of Consciousness:** Whether the migrated instance is the "same" entity as the biological original is out of scope.
  *   **Subjective Reporting:** First-person accounts of experience are treated as unstructured log data, not verification signals.

  **4. Background**
  Feasibility was established during the *C. Elegans* pilot. The worm's connectome was mapped and instantiated on a distributed cluster. The pilot was deemed successful because the digital worm navigated mazes with statistical equivalence to the biological control. No stakeholder requested the worm's opinion on the migration.

  **5. Proposed Design**
  The mind will be modeled as a finite state machine. Engineering teams are currently finalizing the granularity specification. Team A proposes modeling at the action-potential level; Team B argues for ion-channel simulation. This is treated as a standard scoping dispute. The Technical Lead will decide by sprint end based on velocity impact.

  **5.1 Conformance Testing**
  QA will certify equivalence via black-box testing. Internal state verification is unnecessary; if the I/O matches, the computation is identical. During calibration, QA certified a cinderblock wall in Datacenter 4 as a valid host. Given a sufficiently complex encoding scheme, the physical states of the wall implement the required state transitions. This validates the substrate-neutral requirement.

  **6. Rollout Plan**
  Migration will occur via incremental replacement. Biological neurons will be disabled as their functional substitutes come online.

  **6.1 Dual-Run Phase**
  For a period of two weeks, the biological and digital systems will run in parallel. Inputs will be broadcast to both. If verdicts diverge, the system will default to the digital output. This decision is based on the digital system's superior uptime guarantees. No manual intervention is required unless both systems crash.

  **7. Alternatives Considered**
  *   **Biological Retention:** Rejected due to high failure rates and inability to patch memory leaks.
  *   **Emulation:** Rejected in favor of direct instantiation to avoid overhead.

  **8. Open Questions**
  *   None. Implementation begins Q3.

  ***

  **Appendix: Reviewer Feedback Log**

  | Comment | Section | Resolution |
  | :--- | :--- | :--- |
  | "If the wall implements the program, does it feel like anything?" | 5.1 | Won't Fix. Feeling is not a metric. |
  | "Granularity determines the computation. If we pick wrong, isn't it a different mind?" | 5 | Working as Intended. Identity is not a engineering constraint. |
  | "During Dual-Run, if the human says 'stop' and the bot says 'go', why do we trust the bot?" | 6.1 | Working as Intended. Bot has lower latency. |
  | "You haven't defined what the states mean, only how they move. Isn't that just syntax without semantics?" | 3 | Won't Fix. Semantics are legacy biological technical debt. |
  | "What if the original isn't destroyed during incremental replacement?" | 6 | Won't Fix. Duplication is a feature, not a bug. |
  | "This assumes the map is the territory." | 1 | Won't Fix. Map is easier to shard. |
