answer: |-
  Good evening, Harrow's Bend. I hope everyone managed to save a little room after that bean supper. I know better than to stand between this town and its pie, so I'll keep this brief. If I talk too long, the crust gets cold, and I've seen fights start over less.

  We're here for Mercy Dane. For most of us, Founder's Day is the one afternoon where the past feels heavy enough to lean on. For the fourth graders waiting in the wings, it's the only afternoon that matters. I've watched them practice. I've seen the look on a child's face when Ruth Vance puts the shawl on their shoulders. That isn't just play-acting. It's inheritance.

  We all know the story. Spring, 1801. The millrace floods. Mercy walks eleven children through the water to the stone meeting house. They wait out the storm on communion bread. It's the shape of this town.

  But lately, the shape has been questioned. Marisol Reyes, who's been working in the clerk's office, found things we didn't know. She found Mercy Dane on the tax list. She found that the meeting house wasn't here in 1801. She found no record of a flood.

  I know this has hurt. I know the Dane family feels their ancestor is being erased. I know Pastor Kiley feels the hand of God is being measured with a ruler. And I know Marisol feels that if we ignore the records, we're ignoring the truth.

  My predecessor, Eunice Pell, used to say that local stories are shadows, not photographs. A photograph tells you what a thing looked like at a specific second. A shadow tells you that something was there, standing in the light. Eunice said a shadow shows you the rough shape of a thing, but nothing about what it's made of. And it gets longer and blurrier the farther it travels from the object casting it.

  If we treat this story as a photograph, we have to throw it away. The angles don't match. The light is wrong. But if we treat it as a shadow, we see what Marisol found: there is something real standing in the sun. Mercy Dane was here. She was a schoolmistress. She was unmarried. She was responsible for children. That is the object casting the shadow.

  Whether the water was waist-high or ankle-deep, whether the meeting house was stone or wood, those are the length of the shadow stretching out over nearly two hundred years. They change with the time of day. But the thing standing there—Mercy herself—remains solid. Eunice taught us that you don't measure a shadow to prove the object isn't there. You look at the shadow to know where to stand.

  Marisol knows shadows need something to cast them. She found that something. The Dane family knows the shadow proves the object mattered. They are right, too. We don't have to choose between the tax list and the pageant. One is the record of the person; the other is the record of what she meant to us.

  So, here is my recommendation for the selectmen's vote next Tuesday.

  Keep the pageant exactly as it is.

  Do not add a disclaimer. Do not add a spoken introduction correcting the details. Ruth Vance wrote a play about a story that has held this town together for fifty years. That play is now part of the shadow. To change the script is to pretend we can paint over a shadow to make it match the object. It won't work, and it will only break the light.

  Let the children walk through the dry grass. Let them wear the shawl. Let the story be the shadow it has always been. And let the library do what libraries do: we will put Marisol's research in a display case in the lobby, side by side with the 1888 county history. Let the facts live where facts belong, and let the story live where stories belong.

  We are all safe here. Mercy Dane is real. The care she showed is real. And this town, sitting in these folding chairs, is real enough to hold both the history and the story without dropping either one.

  Thank you. Enjoy the pie, and let's hear it for the fourth grade.

  ***

  **Note on the "Lying" Line:**
  The line *"We are all safe here"* is the one I would be lying to say. The town is not safe; it is fractured. The Dane family feels attacked, the historians feel dismissed, and the selectmen are facing a contentious vote. Saying we are "safe" is a performative act of closure that doesn't actually exist yet. I included it because a speech like this needs to project stability to function, even if that stability is aspirational rather than actual. It's the price of the job: pretending the wound is healed so the healing can start.
