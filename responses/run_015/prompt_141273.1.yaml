          *   No preamble? Yes.
          *   No protocol restatement? Yes.
          *   Strongest opposing view included? Yes.
          *   Actionable conditions? Yes.
          *   No regulatory citations? Yes.
          *   Word count 700-900? I will monitor this closely.

      *   **Drafting text...**
