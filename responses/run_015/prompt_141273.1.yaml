          *   *Condition:* Justify the $400 explicitly or reduce it. Maybe cap it lower? Or require justification that $400 is necessary to overcome the "no reason" barrier without becoming the *only* reason. Actually, the prompt says the psychiatrist thinks intentions can't be bought. If we approve, we need to address this.
