      *   *Consent Argument:* We must acknowledge the severity of the deception concern. Withholding the hypothesis treats participants as means to an end. If the hypothesis holds—that knowing the goal prevents the mental state—then disclosure destroys the data. But nondisclosure voids informed consent. Participants cannot assess the value of their contribution if they don't know the question. This isn't just hiding a trick; it's hiding the point. If they knew they were testing a philosophical paradox about rational agency, some might refuse on principle. By labeling it "planning," you bypass their right to refuse based on the actual nature of the inquiry. This transforms the study from voluntary participation to entrapment within a philosophical puzzle they didn't agree to solve.
