          *   *Conditions:* 1. Consent form must state that some information is withheld to preserve validity (authorized deception). 2. Robust debriefing with data withdrawal option. 3. Payment justification or reduction (maybe tiered?). Let's stick to requiring a justification for the $400 specifically regarding undue influence, or capping it. Let's say: Reduce $400 to $150 or provide power analysis showing $25 won't work. Actually, better condition: Require the consent form to explicitly state that payment is not contingent on attendance, emphasized heavily. And the debriefing must explain the philosophical puzzle.
