          *   Arms: $400 vs. $25.
          *   Hypothesis: Can people form an intention to do something they know they have no reason to do? (Kavka's Toxin Puzzle variant).
          *   Consent Issue: PI wants to withhold the true hypothesis ("planning and follow-through" instead) because disclosing it invalidates the experiment.
      *   **Constraints:**
          *   First sentence must state the decision (Approve, Reject, or Approve with Conditions).
