          *   *Correction:* If I recommend **Approve**, I must include the strongest version of the **Reject** argument (including the psychiatrist's objection). If I recommend **Reject**, I must include the strongest version of the **Approve** argument (including the consent problem).
          *   *Strategy:* I will recommend **Approve with Conditions**. Therefore, I must vigorously articulate the arguments *against* approval (the psychiatrist's view on commodifying intention, the consent deception issue) before explaining why conditions mitigate them.

