          *   *Condition:* Needs a robust debriefing and possibly a "authorized deception" clause where participants consent to not knowing everything upfront, but know they *might* be deceived. Or, more strongly, require that the consent form hints at the paradox without giving it away.
          *   *Argument:* Withholding the hypothesis treats participants as means, not ends. If the hypothesis is true (you can't intend), then the consent is doubly problematic because they are engaging in a futile task without knowing it.
          *   *Mitigation:* Enhanced debriefing. Option to withdraw data after debriefing.
      *   **The Payment/Coercion Issue:** $400 is high for an online intention report. The psychiatrist's view (intentions can't be bought) vs. the PI's view (need high stakes to test the limit).
