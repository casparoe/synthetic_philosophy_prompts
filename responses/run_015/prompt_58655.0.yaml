  3. To satisfy her, Kael adds a third statement that if a pass is either valid or forged and is not forged, then it must be valid, treating this logical rule as just another fact in the list.
  4. Jinx then accepts this new statement as true but demands yet another rule to justify moving from all three statements together to the conclusion, restarting the demand for justification indefinitely.
  5. This impasse demonstrates that logical rules function as permissions to infer rather than truth-apt premises, for treating them as additional facts merely invites an endless chain of further validations.
