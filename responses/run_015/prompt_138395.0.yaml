answer: |-
  This is a profoundly sharp observation, and you are right to feel that the standard terminology is failing you. You have identified a specific confounding variable in the macro-sociological study of violence that sits at the intersection of epidemiology, criminology, and moral philosophy.

  To answer your primary question directly: **No, there is no single, settled term for this specific phenomenon in the violence-decline literature.**

  Steven Pinker addresses this in *The Better Angels of Our Nature* (acknowledging that trauma care improves survival), and Manuel Eisner touches on it in historical homicide studies, but they treat it as a footnote to be dismissed rather than a distinct categorical error to be named. You are being handed unrelated concepts because the field lacks a specific label for the decoupling of *violent input* from *lethal output*.

  Since you need to present this at a reading group, I propose we coin a term that is precise enough to withstand scrutiny, define its boundaries, and then tackle the ontological question you raised.

  ### 1. Naming the Phenomenon

  I suggest you call this **"The Lethality-Decoupling Effect"** (or, if you prefer an epidemiological framing, **"The Case-Fatality Confound"**).

  **Definition:** *Lethality-Decoupling* occurs when the statistical incidence of violent death declines due to improvements in post-act mitigation (medical, logistical, or protective), while the incidence of violent acts (force directed at persons) remains constant or declines at a slower rate.

  **Why this name?**
  *   **Lethality:** Specifies that we are talking about the *deadliness* of the event, not the event itself.
  *   **Decoupling:** Describes the mechanical separation between the application of force and the biological outcome.
  *   **Effect/Confound:** Signals that this is a variable that distorts the measurement of the underlying trend.

  ### 2. Conceptual Carving: Distinguishing from Neighbors

  You correctly noted that this is not the per-capita dispute, nor is it "concept creep." Here is how you carve it out from its neighbors for your group:

  | Concept | Mechanism | Direction of Bias | Your Phenomenon |
  | :--- | :--- | :--- | :--- |
  | **Denominator Neglect** | Ignoring population growth. | Makes violence look *higher* in past. | Unrelated. You are focused on the numerator. |
  | **Concept Creep** (Haslam) | Expanding the *definition* of violence (e.g., verbal abuse). | Makes violence look *higher* now. | **Mirror Image.** You are describing a *contraction* of counted outcomes without a change in definition. |
  | **Diagnostic Drift** | Changing criteria for what counts as a death/cause. | Variable. | **Distinct.** The criteria (death) is stable; the *pathway* to the criteria is blocked. |
  | **Lethality-Decoupling** | Improving survival *after* the act. | Makes violence look *lower* now. | **The Target.** The act is constant; the outcome changes. |

  **The Mechanism Difference:** Concept creep is *semantic* (we changed the word "violence"). Lethality-Decoupling is *technological/physiological* (we changed the body's ability to withstand "violence"). They do not cancel out neatly because one operates on classification and the other on biology.

  ### 3. Boundary Cases: Testing the Definition

  To tighten the definition, let's run your examples through the **Lethality-Decoupling** filter. The test is: *Did the intervention occur after the initiation of force, and did it preserve the victim without reducing the aggressor's intent?*

  *   **Body Armor:** **Yes.** The bullet (force) is fired with the same intent. The vest mitigates the outcome. This counts as Lethality-Decoupling.
  *   **Faster Ambulance:** **Yes.** The stabbing occurs; the transport mitigates the outcome. This is the core of your clinical observation.
  *   **Police Recording Changes:** **No.** If police stop recording a stabbing as "aggravated assault" and start calling it "disturbance," that is *Measurement Artifact*, not Lethality-Decoupling. The physical reality didn't change; the bureaucratic label did.
  *   **Murderer Switching from Knife to Gun:** **No.** This is **Lethality Escalation**. The *means* changed, increasing the inherent probability of death per act. This is a change in the *act*, not the mitigation of a constant act.
  *   **Famine/Blockade with Better Logistics:** **Complex/Borderline.** If a blockade (structural violence) is imposed, but NGOs smuggle food in, the *deaths* decline. Does this count?
      *   *Verdict:* **Yes, but structurally.** This highlights the Act vs. Outcome debate. If violence is the *deprivation*, the violence occurred. If violence is the *death*, it was averted. This is a crucial boundary case for your group: it forces you to decide if "violence" includes *structural conditions* or only *direct physical harm*.

  ### 4. The Ontological Core: Act vs. Outcome

  This is the philosophical engine of your critique. You asked: *Is the quantity 'amount of violence in the world' a quantity about acts... or about outcomes?*

  There is no fact of the matter independent of this choice. The "Decline of Violence" thesis implicitly chooses **Outcomes (Deaths)** as its proxy for **Violence (Acts)**.

  **The Moral Luck Problem:**
  Philosopher Thomas Nagel's concept of "Moral Luck" is relevant here. Two drivers run a red light. One hits a pedestrian (Homicide); the other does not (Traffic Violation). Legally and statistically, they are different categories. Morally and intentionally, they are identical.
  *   If you measure violence by **Acts/Intent**, the "Decline Thesis" becomes much harder to prove. We have better data on assaults (e.g., National Crime Victimization Survey) than homicides, and while assault rates have dropped, the drop is often less steep than the homicide drop, suggesting Lethality-Decoupling is doing *some* of the work.
  *   If you measure violence by **Outcomes/Harm**, the Decline Thesis is robust, but it conflates "peace" with "trauma care."

  **Does the Decline Thesis survive re-running on Acts?**
  Partially.
  1.  **Homicide vs. Assault:** In the US and Europe, assault rates have generally tracked homicide rates downward, suggesting a real decline in aggression, not just better bandages.
  2.  **Warfare:** Battle *death* rates have plummeted, but have battle *engagement* rates plummeted equally? In conventional war, yes (fewer wars). In asymmetric war, no.
  3.  **The "Unfalsifiable" Risk:** If we switch to measuring "Acts," we run into the "Dark Figure" of crime. Deaths are hard to hide; assaults are easy to hide. Homicide data is the "hardest" data we have. By switching to acts, we gain conceptual purity but lose empirical reliability.

  ### 5. How to Frame This for Your Reading Group

  Do not frame this as "The optimists are wrong." Frame it as "The optimists are measuring *Suffering*, not *Aggression*, and conflating the two."

  **The Pitch:**
  >"We are measuring the *fatality rate of violence*, not the *frequency of violence*. Medical progress has turned what used to be a 'violent death' into a 'violent injury.' If our moral concern is the *loss of life*, the optimists are right. If our moral concern is the *intent to harm* or the *breach of bodily autonomy*, the decline is less certain. We need to distinguish between a more peaceful world and a more resilient one."

  **The Coinage to Use:**
  Introduce **"The Lethality-Decoupling Effect."** Define it as the reduction in violent mortality independent of the reduction in violent incidence, driven by post-act mitigation.

  **The Knockout Question:**
  Ask the group: *"If I stab you, and a drone delivers a transfusion in 30 seconds saving your life, did I commit less violence than if I stabbed you in 1980 and you died? If the answer is 'no,' then homicide rates are a flawed proxy for violence. If the answer is 'yes,' then violence is defined by consequence, not intent."*

  ### Summary for your notes:
  *   **Term:** Lethality-Decoupling Effect (or Case-Fatality Confound).
  *   **Status:** No settled term exists; this is a gap in the literature you are filling.
  *   **Distinction:** Distinct from Concept Creep (semantic) and Denominator issues (population). It is technological/physiological mitigation.
  *   **Ontology:** Reveals that "Violence Decline" is actually "Violent Death Decline."
  *   **Boundary:** Includes trauma care and armor; excludes recording artifacts and weapon switching.
  *   **Implication:** The world may be more *survivable*, not necessarily more *peaceful*.

  This is a robust, clinically grounded critique. It respects the data while questioning the inference drawn from it. Good luck at the reading group.
