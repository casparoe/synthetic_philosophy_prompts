  What the intentional stance says about move 37 and about moves 79 through 87
  Applied to Game 2, Move 37, the intentional stance casts AlphaGo as a bold strategist believing traditional territory rules were secondary to global influence. It attributes a desire for long-term dominance over short-term security, making the move look creative rather than erroneous. This framing highlights the move's strategic coherence within the flow of the game, treating it as a statement of intent. In Game 4, post-78, commentators attributed overconfidence: AlphaGo "believed" it was ahead and "wanted" to minimize risk, failing to "see" the wedge's threat. This stance captures the *drama* of the match. It predicts that a leading agent will play conservatively. It explains the shift from Move 37's innovation to Game 4's collapse as a change in confidence levels. It translates raw calculation into a narrative of competing wills, allowing humans to anticipate strategic shifts based on game state rather than code states. Crucially, it gets right the *normative* pressure: given the board, a rational agent *should* respond to the wedge. The failure to do so is marked as irrational behavior, signaling a shift in the agent's internal state, even if that state is fictional. It allows observers to group disparate moves under a single motivational umbrella. Move 37 becomes part of a "fighting" strategy; Game 4's errors become "complacency." This clustering helps humans navigate the game tree without calculating every branch, relying instead on attributed personality traits. It makes the alien system legible by mapping its outputs onto human strategic concepts like thickness, influence, and nerve.

  Where the design stance takes over
  However, the design stance reveals the mechanism behind the metaphor. Move 37 wasn't boldness; it was a Monte Carlo Tree Search (MCTS) outcome where the policy network assigned low prior probability, but the value network overturned this during simulation. The move wasn't "creative"; it was statistically optimal despite low human prior. In Game 4, the collapse wasn't confusion or tilting. The wedge (Move 78) fell into a blind spot where the policy network pruned the branch too early. The value network then miscalibrated the win probability. Subsequent moves weren't panicked; they were optimal responses to a falsely evaluated board state. The design stance explains *why* the wedge was invisible (architectural pruning) and *why* recovery failed (value function degradation), offering causal mechanics the intentional stance obscures. It shows that AlphaGo didn't "miss" the move emotionally; it was structurally prevented from exploring it deeply enough to update its value estimate. The degradation wasn't a loss of nerve, but a cascade of mathematical errors in the evaluation function, invariant to psychological states. This stance exposes the fragility of the search algorithm when faced with out-of-distribution moves that violate the policy network's training priors. Furthermore, the design stance clarifies that the system has no persistent memory of "confidence" between moves, only current board evaluation. The "tilt" was actually a compounding error rate where each subsequent move was optimized for a reality that no longer existed on the board.

