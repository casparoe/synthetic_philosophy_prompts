  **Tier S: Predictive-Processing Framework**
  This position achieves the highest tier by modelling first-order flexibility through sensory feedback loops and second-order adaptability via the hierarchical updating of precision weights, all within a naturalistic ontology. It avoids metaphysical excess while providing a mechanistic explanation for how revision strategies themselves remain responsive to environmental failure.

  **Tier A: Dennett's Evolutionary-Scaffolding Account**
  The evolutionary-scaffolding account robustly counters first-order behavioural rigidity by positing selected capacities for avoidance, yet it relies on a functionalist description of second-order meta-cognitive revision that some may find less mechanistically precise than predictive models. It successfully navigates naturalism without libertarian excess, though its compatibilist credentials are occasionally challenged as overly permissive.

  **Tier B: Frankfurt-Style Hierarchical Compatibilism**
  While this model effectively distinguishes between first-order impulsive drives and second-order reflectively endorsed volitions, it offers little account of how the hierarchical structure itself adapts to repeated strategic failure. Consequently, it remains vulnerable to second-order sphexishness despite securing a degree of first-order coherence.

  **Tier D: Agent-Causal Libertarian View**
  Although this view posits a substance capable of initiating actions independently of prior events to ensure first-order flexibility, it offers no naturalistic account of how the substance's own decision-making architecture avoids second-order rigidity. It therefore fails the requisite condition of resisting sphexishness without collapsing into implausibility.
