  ### The Scenario: Leo's Evening

  **Episode A**
  At 8:00 PM, Leo puts on Track 4. It is a brass-heavy piece, staccato and bright, driving forward with kinetic energy. The phenomenology is sharp, punctuated, and outwardly directed; he feels the rhythm in his chest. He sits upright, tapping his foot. The track lasts four minutes. When it ends, he immediately cues it again, judging the experience a perfect capstone to his day. He counts the evening as better for having heard it.

  **Episode B**
  At 8:15 PM, Leo puts on Track 5. It is a solo cello suite, legato and warm, enveloping the room with resonant depth. The phenomenology is soft, continuous, and inwardly absorbing; he feels the vibration in his bones. He slumps back, closing his eyes. The track lasts four minutes. When it ends, he immediately cues it again, judging the experience equally perfect. He counts the evening as better for having heard it.

  **Episode C**
  At 8:30 PM, Leo puts on Track 6. It is a modern composition featuring screeching, dissonant strings. The phenomenology is grating, inducing a wince and a sense of tension; it feels like sandpaper on the ear. It is not pleasant. Yet he does not skip it. He leans forward, sustaining attention through the discomfort, and counts the evening as better for having endured it. He seeks out this track often, disposed to sustain the experience while it lasts.

  ***

  ### The Check

  **1. Verdicts by Theory**
  *   **Common Phenomenal Quality (Hedonic Tone):** Fails. A and B share no introspectible quality (sharp/kinetic vs. warm/static). Adding C breaks the theory entirely: C shares the conative profile of A and B but lacks the positive phenomenology. If welfare requires pleasure, C shouldn't count; if C counts, pleasure isn't required.
  *   **Conative/Attitude View:** Succeeds. A, B, and C all share the profile: the subject is disposed to sustain the experience, return to it, and count it as making life go better. The theory captures the welfare value in all three without needing a shared "feel."
  *   **Neurofunctional Common-Currency:** Verdict is opaque. If a scanner shows identical nucleus accumbens activation for A, B, and C, the hedonist claims victory ("See? They *are* the same state"). However, this changes the subject from *what welfare feels like* to *what causes it*. It buys the hedonist a scientific unity but abandons the phenomenological claim that welfare is *felt* as a specific quality.

  **2. Diagnostics**
  *   **Feature Doing the Work:** **Intra-modal Phenomenal Divergence.** By keeping A and B in the same modality (auditory), we block the hedonist's escape route that attributes phenomenal differences to sensory differences (e.g., taste vs. sound).
  *   **If A and B are Different Senses:** The objection weakens. The hedonist can argue that the "hedonic tone" is a separate layer underneath the sensory specificities, and the gross differences are just sensory noise.
  *   **If C is Dropped:** The argument only establishes the *heterogeneity of pleasure*, not that pleasure is unnecessary for welfare. The hedonist could concede pleasure is motley but insist it is still the only thing that matters. C is required to sever the link between welfare and positive phenomenology.

  **3. Strongest Attacks from the Hedonist**
  *   **Deny Pleasure Status:** Claim B (or A) isn't genuinely pleasure, but "absorption" or "satisfaction." *Cost:* Contradicts strong introspective intuition; makes the theory revisionist.
  *   **Non-Isolable Ingredient:** Posit a "hedonic glow" that is real but too subtle to introspect. *Cost:* Makes the theory unfalsifiable by introspection; ad hoc.
  *   **Determinable/Determinate:** Claim "pleasure" is a determinable genus with different determinates (sharp-pleasure, warm-pleasure). *Cost:* This is the best response, but it risks relabelling. If the determinates share no phenomenal quality, "pleasure" becomes merely a functional label for "what we like," collapsing into the conative view.

  **4. Conclusion**
  The hedonist should retreat to a **Desire Satisfactionism** or accept that "pleasure" is a **family-resemblance concept** with no common essence. If they retain the label "hedonism" but define pleasure as "whatever is conatively endorsed," it is verbal hedonism, not substantive. The theory no longer claims welfare is a specific *feeling*, but rather a specific *relation* to experience. Whether this deserves the name "hedonism" is doubtful; it is arguably a concession that the phenomenological core of the view was false.
