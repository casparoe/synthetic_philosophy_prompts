answer: |-
  The sea is flat and the wood is dry.
  We roll the hemp and melt the yellow wax.
  Do not loose me until the autumn comes.
  He speaks like a man reading a map.
  The oars rest easy on the quiet water.

  They press the soft stuff into the rowers' ears.
  It stops the song before it starts to work.
  Do not loose me until the autumn comes.
  Nothing gets in that was not there before.
  The filter is sealed tight against the sound.

  Now the rope goes around the standing man.
  It stops the hand before it reaches out.
  Do not loose me until the autumn comes.
  This is a lock on what the body does.
  The wax is for the ear, the knot for action.

  The singing starts and his shoulders strain.
  They see the brows work but hear no plea.
  Do not loose me until the autumn comes.
  They must decide whose will is in the strain.
  They pull the rope tighter without knowing why.

  A new hand touches the hemp next year.
  He reads the ink and asks, "Who spoke this?"
  "Do not loose me until the autumn comes."
  The voice is gone but the command remains.
  He holds the knot though he did not tie it.

  Yes, any hand could cut the rope today.
  The lock is only time, not iron.
  Do not loose me until the autumn comes.
  We chose the wait to let the blood cool.
  A second look requires a heavier hand.

  ***

  **Introduction Notes**

  The line that repeats in every stanza is the text of Article XI itself, treated as a standing order given on deck. I intend for you to hear it shift from a immediate command for safety into a legacy that the next crew must choose to uphold. The turn happens in the fifth stanza, where quotation marks appear for the first time to show a future student speaking the rule they inherited rather than made.
