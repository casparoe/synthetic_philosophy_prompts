  2.  **Analyze the Subject Matter (LTNU):**
      *   *What is it?* A form of Negative Utilitarianism (NU) which prioritizes the reduction of suffering.
      *   *Lexical Threshold:* There is a specific intensity of suffering such that *any* amount of suffering above this threshold outweighs *any* amount of pleasure (or sub-threshold suffering). It's "lexical" because the higher priority category trumps the lower category regardless of quantity.
      *   *Key Tension:* Balancing the intuition that extreme suffering is uniquely bad with the mathematical/structural requirements of a coherent ethical system (continuity, aggregability, decision theory under uncertainty).

  3.  **Move-by-Move Analysis:**

      *   **Round 1: Commensurability vs. Lexicality.**
