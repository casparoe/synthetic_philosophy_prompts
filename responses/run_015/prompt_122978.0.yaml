answer: |-
  Good morning. Thank you for coming out this early. I know the coffee is still working its way to the brain, so I want to start by waking us up properly. I'd like to try a small exercise. It will take thirty seconds.

  Please stand up. All of you.

  [Pause]

  Thank you. Now, please remain standing only if you own the home you live in. If you rent, if you live with family, if you are between leases, or if you simply do not hold the deed to your shelter, please sit down.

  [Pause for movement]

  Look around the room.

  In the novel I'm finishing, the word for the people standing up and the people sitting down is the same. There is no word for "person" that is distinct from the word for "householder." In that language, if you sat down just now, you are not grammatically a person. You might be a dependent, a guest, a tenant, but you are not a full member of the species.

  The people in that book don't notice this. They don't notice it because the etymology went dead centuries ago. The word for "house" eroded away until only the "holder" remained, and then it just meant "everyone." But the exclusion didn't disappear; it just went underground. It became invisible.

  I've started calling this a **hollow generic**. It is a word that sounds like it covers everyone and quietly doesn't, and whose hollowness is invisible precisely because the history has gone.

  Please, everyone sit.

  We are here to talk about "The Common Reader." It is the theme of this festival. It sounds like a beautiful, inclusive phrase. It suggests a democracy of ink. But after spending the last three years writing a language where "person" means "property owner," I find myself unable to hear the word "common" without listening for the silence inside it.

  When we say "The Common Reader," who are we picturing?

  If I say "The Common Reader sits in an armchair," you likely picture someone at leisure. If I say "The Common Reader studies the text," you might picture a student. The word "common" promises universality, but it often delivers a default setting. It asks us to imagine a standard human experience of reading, and in doing so, it quietly marks anything outside that experience as "niche," "academic," or "difficult."

  This is not a new observation. Douglas Hofstadter once wrote a paper where he swapped the pronouns in a sexist text to show the sexism wasn't in the pronouns, but in the default.

  He showed that when we think a word is neutral, we are usually just standing in the center of our own bias.

  The problem is, we cannot simply banish hollow generics. We need general words. I cannot speak to you if every noun requires a biography. If I had to say "The householder-who-rents-or-owns-and-is-a-bipedal-mammal" every time I meant "person," language would collapse. We need the shorthand. We need the generic.

  But we must recognize when the generic is hollow.

  In my book, the word is *Ostra*. It means Person. It descends from *Ost*, meaning House. The plot turns on a character who is clearly intelligent, clearly sentient, clearly capable of love and grief, but because they have no fixed address, the law cannot see them as an *Ostra*. They are not prosecuted for crimes; they are disposed of like waste. They are not protected by rights; they are managed like weather.

  The horror in the story isn't that the characters are evil. It's that they are grammatical. They are speaking the truth as their language defines it. To them, the homeless character isn't a person being treated badly; they are a non-person being treated appropriately.

  This is where I have to make a confession, and I want to be careful with it. It is tempting to stand here and critique the way language marks us, as if I am outside that system. But I am not.

  I publish under my initials.

  For three books, reviewers have referred to me as "he." They have praised my "masculine restraint," my "fatherly concern for his characters." I have never corrected them.

  Why? Because it has been good for me.

  There is a specific authority granted to the male default in literary fiction. It is a hollow generic that benefits me. When I leave the gender ambiguous, the reader's mind supplies the default, and that default carries weight. It gets me reviewed in certain sections. It gets me taken seriously in certain rooms.

  If I put my full name on the cover, the marking becomes visible. I become a "woman writer," which is a specific category, distinct from the generic "writer." By keeping the initials, I get to inhabit the hollow generic. I get to be the *Ostra* with the house, even if the history of my name suggests otherwise.

  So I cannot stand here and offer you a tidy solution. I cannot say, "We must change the words, and then we will fix the world." Because in my own case, the words were already neutral. The initials were already blank. And the world re-marked them anyway. The bias isn't just in the suffix; it's in the ear of the listener.

  This is the trap for the linguists in the room, and for the editors. We can scrub the text. We can ensure no one uses "mankind" or "chairman." We can enforce a style guide that is perfectly inclusive. And we should. But if the reader's mind is trained to hear "novelist" and picture a man, I can publish as "J. Smith" and still be read as male. The hollow generic rebuilds itself the moment we look away.

  But this is also the trap for the readers. If we accept "The Common Reader" as a static definition, we accept a literature that is written for a specific ghost.

  So, what do we do? If language is a house with rotten beams, do we burn it down?

  No. We live in it. And we renovate.

  The value of noticing the hollow generic is not that we stop using general words. It is that we stop trusting them.

  When you read a review that says, "This book captures the universal human experience," I want you to hear a warning bell. Ask: *Which* humans? When a blurb promises a story for "everyone," ask: *Who is sitting down?*

  This applies to our festival theme, too. "The Common Reader." I propose we treat this not as a description of who we are, but as a challenge to what we do.

  A "common" currency is one that is accepted everywhere. It is standard. It is safe. But reading is not safe. Reading is an act of intrusion. You are letting a stranger's voice into your head. You are allowing a dead person to tell you how to feel. That is not common. That is deeply strange.

  When we label ourselves "common," we might be protecting ourselves from the demand of the text. We might be saying, "I am just a consumer of this product. I am not responsible for what it means."

  But you are responsible.

  In my book, the characters who survive are not the ones who accept the definition of *Ostra*. They are the ones who realize the word is hollow and decide to fill it with new meaning. They start using the word for "person" to describe the tenants. They start using the word for "house" to describe the body. They break the etymology. They force the language to admit the truth that the grammar denies.

  They make the generic specific again, by expanding the scope of the word until it breaks and reforms.

  You can do this. You do this every time you read.

  When you pick up a book written by someone who is not you—someone of a different class, a different country, a different gender—you are testing the hollow generics of your own life. You are checking the load-bearing walls of your assumptions.

  Sometimes, the book will fail. It will rely on defaults that exclude you. It will assume a "common" experience that you do not share. In that moment, you are not a passive consumer. You are a critic. You have caught the language lying.

  And sometimes, the book will succeed. It will use a hollow generic—"love," "grief," "home"—and it will fill it with such specific, undeniable truth that the word expands. It will make the word big enough to hold you, even if you didn't think you belonged in it.

  This is the work of the reader. It is not just to absorb the story, but to audit the language.

  To the editors and linguists here: I know you know this. You know that semantic drift is inevitable. You know that prescriptivism is a losing battle. I am not asking you to police the text. I am asking you to annotate the silence. When you see a hollow generic, don't just swap the word. Ask what work the word is doing. Who is being held up by it? Who is being held out?

  To the writers: Do not hide behind the "universal." The universal is just the specific that has forgotten its history. Be specific. If your character is a householder, call them a householder. If they are a tenant, say so. The friction is where the truth lives.

  And to the readers, the majority of you: You hold the final authority. Not the critics, not the publishers, not the authors. You.

  When you leave here today, you will go back into a world full of hollow generics. "The Economy." "The Public." "The Common Good." These are *Ostra* words. They sound like they include you. They often don't.

  Do not let the language sleepwalk.

  If you read a sentence that claims to speak for everyone, pause. Check the etymology. Look at who is standing and who is sitting.

  And if you find that the word is too small, do not put the book down. Make the word bigger. Read against the grain. Insist on your place in the text.

  "The Common Reader" is not a category you are born into. It is a job you apply for. It requires vigilance. It requires the willingness to notice when a word that sounds like "everyone" actually means "people like me."

  I published under initials because it was easier. It allowed me to slide into the hollow generic. It was a comfortable house. But I am done with that. I want to live in a language where I have to pay for the space I take. I want to be a tenant in my own sentences, aware that the roof is held up by work, not by ownership.

  So, here is my proposal for the weekend.

  Let us not strive to be common. "Common" is what happens when we stop looking. "Common" is the default setting.

  Let us strive to be specific.

  When you talk about the books you love this weekend, do not say, "Everyone should read this." Say, "This book spoke to me because..."

  When you discuss the panels, do not ask, "Was this relatable?" Ask, "Where did this fail to relate?"

  Let us drain the hollow generics. Let us make our language heavy again, weighted with the actual specifics of our lives, rather than the light, airy nothings of the default.

  If we do that, if we refuse the comfort of the word "common," we might find something better. We might find a community. A community is not a group of people who are the same. It is a group of people who have agreed to speak to each other despite the differences.

  A hollow generic erases difference. A community negotiates it.

  So, look at the people sitting next to you. You are not the same. You do not read the same way. You do not live in the same houses. Some of you own the words you speak; some of you rent them.

  But for this weekend, you are in the same room.

  Let us not be the Common Reader. Let us be the Present Reader. The one who is here, awake, noticing who is standing, noticing who is sitting, and willing to ask why.

  Thank you.
