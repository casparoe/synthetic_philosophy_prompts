  Hey, I'm trying to wrap my head around Gödel's rotating universe argument for my philosophy of physics course and I'm kinda stuck on one specific passage. So in his 1949 paper he lays out this cosmological solution where the universe is rotating uniformly, and because of that the metric allows closed timelike curves - basically worldlines that loop back and interseciton themselves. The part I don't understand is where he goes from describing this geometery to saying that time itself might not have an objective direction. The passage describes how any observer could in principle travel along one of these loops and return to an earlier point in their own history, carrying information with them. Gödel seems to think this shows there's no univeral "before" and "after" that applies to everyone, but I'm confused about whether he's claiming this actually happens in our universe or just that Einstein's equations allow it as a theoretical posibility.

  My prof mentioned something about "local temporal indexicals" - like maybe each observer still has their own private "now" that moves forward along their worldline even if the global timeline loops around. But I don't see how that resolves the problem Gödel raises about objective time flow. Is he assuming that for time to be real there has to be one global ordering? Or is he attacking that assumption? Also, if you could meet your past self, wouldn't that violate causality in a way that's different from just having a weird spacetime shape? I guess I'm asking: what's the hidden philosophical principle that lets Gödel move from "there are loops in this model" to "therefore the passage of time is an illusion"? Any help breaking down the logical steps would be great, I feel like I'm missing something obvious.
