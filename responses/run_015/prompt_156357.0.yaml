  # Session Plan: The Mirror and The Bag
  **Time:** 90 Minutes
  **Participants:** 10 Grad Students
  **Materials:** 
  *   10 Folders (privacy screens).
  *   10 "Choice Cards" (A/B).
  *   10 "Prediction Slips" (Write partner's choice).
  *   1 Opaque Bag.
  *   20 Identical Envelopes (17 contain "WIN 10pts", 3 contain "VOID 0pts"). *Note: Use heavy cardstock inside so thickness cannot be felt.*
  *   Token Points (paper chips).
  *   Whiteboard.

  **Stakes:** The student with the highest total token points at the end does not buy coffee for the group next week. (Instructor covers the winner's usual share).

  ---

  ## Part 1: The Mirror (Platonia-Style) 
  **Goal:** Induce the pull of superrational cooperation without naming it.

  1.  **Setup (5 mins):**
      *   Seat students in 5 pairs, facing each other but with folders up so they cannot see writing.
      *   Hand each pair a Payoff Matrix (printed on card):
          *   **Both B:** 100 pts each.
          *   **Both A:** 1 pt each.
          *   **Mismatch (You A, Them B):** You 101, Them 0.
          *   **Mismatch (You B, Them A):** You 0, Them 101.
      *   **Instruction:** "You have 3 minutes. Secretly choose A or B. On a separate slip, write down what you predict your partner will choose. Do not communicate. Fold both slips. I will collect them."

  2.  **The Twist (5 mins):**
      *   Collect slips. Do not reveal outcomes yet.
      *   **Instruction:** "Before we reveal, I want you to look at your Prediction Slip. Did you predict what you *hoped* they would do, or what you *feared* they would do? Keep that thought."

  3.  **Reveal & Tally (15 mins):**
      *   Reveal pairs' choices publicly. Tally points.
      *   **The Mirror Reveal:** Hand the Prediction Slips back to the writers. Ask them to compare their prediction to the partner's actual choice.
      *   **Board Work:** Create a 2x2 grid on the whiteboard:
          *   *Quadrant 1:* Played B / Predicted B (Symmetric Hope)
          *   *Quadrant 2:* Played A / Predicted A (Symmetric Fear)
          *   *Quadrant 3:* Played B / Predicted A (Betrayed)
          *   *Quadrant 4:* Played A / Predicted B (Betrayer)
      *   **Silent Observation:** Let them see the clustering. (Predictable Break: Most will cluster in Quadrant 2 [A/A] or Quadrant 4 [A/B], fearing the other will defect).

  ## Part 2: The Bag (Luring Lottery Analog) 
  **Goal:** Break the symmetry premise. Show that "reasoning together" fails against randomness.

  1.  **Setup (5 mins):**
      *   Bring the Bag of 20 Envelopes to the center.
      *   **Instruction:** "There are 20 envelopes. Some contain 10 points. Some contain 0. You do not know which. You may claim as many envelopes as you wish (0 to 20). Write your claim on a slip."
      *   **The Twist Rule:** "If you claim an envelope that contains 0, your total score for *this round* becomes 0. If all your envelopes contain 10 points, you keep the sum."
      *   **Crucial Logic Injection:** "Reason carefully. If you claim only 1, you might lose to those who claim more. If you claim 20, you risk the 0s. But remember: The envelopes do not think."

  2.  **The Draw (10 mins):**
      *   Collect claims.
      *   **Constraint:** If total claims > 20, pro-rate randomly (or simply cap at 20 and return excess). *Simpler for flow:* If claims > 20, everyone's claim is reduced by 50% to simulate congestion.
      *   Students come up one by one, draw their allotted envelopes *without opening them*.
      *   **Hold:** "Do not open until everyone has drawn."

  3.  **Reveal (10 mins):**
      *   Simultaneous open.
      *   Tally points. Add to Round 1 totals.
      *   Announce the Coffee Winner.

  ## Part 3: Debrief & Theory 
  **Goal:** Map the experience to the concepts. No lecture until now.

  1.  **The Mirror Failure (10 mins):**
      *   Ask Quadrant 2 players (Played A / Predicted A): "You predicted symmetry. Why didn't you play into it?"
      *   **Concept:** *Common Knowledge.* You knew you were rational, and they knew you were rational, but you didn't know *they knew you knew* they would cooperate. The prediction matched the action, but the *trust* in the logical link was missing.
      *   **Concept:** *Superrationality.* If you assume your reasoning is identical to theirs, (B,B) is the only stable logical output. But the social presence broke the "solitary reasoner" illusion.

  2.  **The Bag Collapse (10 mins):**
      *   Ask those who claimed many envelopes: "Did you expect others to claim many?"
      *   Ask those who claimed few: "Did you feel punished?"
      *   **Concept:** *Symmetry Premise Destruction.* In Round 1, the other player is a *reasoner* like you. Your logic correlates with theirs. In Round 2, the "opponent" is the Bag. The Bag does not reason. Your logic cannot correlate with the location of the empty envelopes.
      *   **The "Buy Every Envelope" Logic:** "If you reason symmetrically here, you realize: 'My reasoning does not move the empties.' Therefore, the superrational constraint vanishes. You are left with causal rationality: Maximize claim to outpace others, because the environment won't cooperate."

  3.  **Honest Limitation (5 mins):**
      *   **The Social Presence Problem:** "In the original argument, you are a solitary mind confronting the universe. Here, you were watching each other breathe. You weren't testing logic; you were testing *trust*. The 'Mirror' didn't reflect logic; it reflected social anxiety."
      *   **Predictable Breaks:**
          *   *Envelope Thickness:* "Did anyone try to feel the envelopes?" (Acknowledge this breaks the 'hidden information' ideal).
          *   *Prediction Clustering:* "Many of you predicted A because it's 'safer' to look rational if you lose. That's not game theory; that's reputation management."

  ---

  ## Facilitator Notes: What Will Predictably Break

  1.  **The Envelope Feel:**
      *   *Risk:* Students will try to palpate the envelopes in Round 2 to find the "WIN" slips.
      *   *Mitigation:* Insert a dummy card of identical weight in the "VOID" envelopes. Announce: "Envelopes are weighted. Touching them voids your score."
      *   *Lesson:* This mirrors the real-world temptation to seek *causal* leverage (cheating) when *logical* leverage (superrationality) feels too abstract.

  2.  **The Mirror Clustering:**
      *   *Risk:* In Round 1, students will predict "B" (Cooperate) but play "A" (Defect) to appear virtuous on the prediction slip while securing points.
      *   *Observation:* Watch for the "Virtue Signal" quadrant (Predict B / Play A).
      *   *Lesson:* This highlights the difference between *normative* rationality (what we should do) and *descriptive* rationality (what we fear others will do).

  3.  **The Lottery "Buy All" Logic:**
      *   *Risk:* Students might not actually claim many envelopes because the "VOID" penalty is scary.
      *   *Fix:* If claims are too low, point out in debrief: "You treated the Bag like a Player. You hoped the Bag would 'cooperate' by hiding the voids. That is the category error."

  ## The Honest Limitation: Solitary Reasoning vs. Social Presence

  You asked to be honest about what this can't reproduce.
  **It cannot reproduce the isolation of the thought experiment.**

  *   **The Theory:** Hofstadter's superrationality relies on the agent being a "logical output machine" isolated from noise. If I am rational, and you are rational, and we face the same problem, we output the same answer.
  *   **The Reality:** In this seminar, you are not isolated. You are watching your partner's face. You are worrying about looking greedy. You are worrying about looking naive.
  *   **The Consequence:** The "Mirror" in Round 1 isn't reflecting *logic*; it's reflecting *social signaling*. When they predict "A", it's often not because they calculated the Nash Equilibrium, but because they don't trust the *person* across from them, even if they trust the *logic*.
  *   **Debrief Point:** "Superrationality works best when you remove the human. Here, the human was the variable. The collapse in the Lottery wasn't just about randomness; it was about relief. You were glad the Bag couldn't judge you for being greedy."

  ## Rules for the "Buy Every Envelope" Twist
  To ensure the prompt's requirement ("anyone reasoning symmetrically should realize they'd buy every envelope") is logically defensible in the debrief:

  *   **Argument:** In Round 1, Symmetry = Restraint (Because my restraint causes your restraint). In Round 2, Symmetry = No Restraint (Because my restraint does *not* cause the empties to move).
  *   **Instruction to Students:** "In the Lottery, do not try to cooperate with the Bag. It will not cooperate back."
  *   **Debrief Explanation:** "Superrationality requires a *correlated counterpart*. In the PD, the other player is your correlate. In the Lottery, the empties are noise. Symmetry reasoning collapses into causal maximization because there is no one to be symmetric *with*."

  ## Run Sheet (90 Mins)
  *   **00-05:** Intro & Stakes (Coffee).
  *   **05-30:** Round 1 (PD + Mirror).
  *   **30-55:** Round 2 (Bag + Claims).
  *   **55-65:** Reveal & Tally.
  *   **65-90:** Debrief (Mirror Failure -> Common Knowledge; Bag Collapse -> Correlation).
