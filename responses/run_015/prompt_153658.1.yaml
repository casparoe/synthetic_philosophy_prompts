answer: |-
  Here's a decision tree to help you lock down what your conlang words actually point to. We're using the three field tests you mentioned: the **Ear Test** (detached part), the **Sleep Test** (stationary alive), and the **Corpse Test** (dead).

  Follow the path based on how your fictional speakers react.

  ### The Translation Decision Tree

  **START:** Speaker points at a running rabbit and says *"Gavagai."*

  **Q1: The Ear Test**
  You point at a detached rabbit ear sitting on the ground. Do they use the word *"Gavagai"* for it?
  *   **YES** → Go to **Branch A (Stuff & Parts)**
  *   **NO** → Go to **Branch B (Wholes & Events)**

  ---

  #### Branch A (Stuff & Parts)
  *They call the ear "Gavagai." The word refers to rabbit material, not distinct individuals.*

  **Q2: The Sleep Test**
  You point at a sleeping rabbit (whole, alive). Do they use *"Gavagai"*?
  *   **YES** → Go to **Leaf 1**
  *   **NO** → Go to **Leaf 2**

  *   **Leaf 1: Mass Noun Theory ("Rabbit Stuff")**
      *   **The Vibe:** The word means "rabbit material" like "water" or "sand."
      *   **The Awkward Commitment:** You cannot count them. You can't translate "Three rabbits are eating." You have to write "There is much rabbit eating here," or "Three portions of rabbit-stuff are eating."
  *   **Leaf 2: Active Parts Theory (Unnamed)**
      *   **The Vibe:** The word means "active rabbit fragments."
      *   **The Awkward Commitment:** You can't talk about sleeping rabbits or whole stationary rabbits. If the rabbit stops moving, the word stops applying, even if it's still made of rabbit parts.

  ---

  #### Branch B (Wholes & Events)
  *They do not call the ear "Gavagai." The word requires a whole unit or a specific action.*

  **Q2: The Sleep Test**
  You point at a sleeping rabbit (whole, alive). Do they use *"Gavagai"*?
  *   **YES** → Go to **Branch C (Objects)**
  *   **NO** → Go to **Branch D (Actions)**

  ---

  #### Branch C (Objects)
  *It applies to whole rabbits, even when still.*

  **Q3: The Corpse Test**
  You point at a dead rabbit carcass. Do they use *"Gavagai"*?
  *   **YES** → Go to **Leaf 3**
  *   **NO** → Go to **Leaf 4**

  *   **Leaf 3: Enduring Object Theory ("The Standard View")**
      *   **The Vibe:** The word refers to the object itself, regardless of state.
      *   **The Awkward Commitment:** You have to accept broken identities. If a rabbit loses a leg or is skinned, you still have to translate it as "rabbit," even if the culture treats it as trash. You can't switch words until it's completely destroyed.
  *   **Leaf 4: Biological Organism Theory ("Sortal Constraint")**
      *   **The Vibe:** The word refers to a living life-form.
      *   **The Awkward Commitment:** Death erases the noun. You can't say "The rabbit is dead." You have to say "The living-one is now meat." The word "rabbit" ceases to apply the moment life ends.

  ---

  #### Branch D (Actions)
  *It only applies to whole rabbits when they are doing something.*

  **Q3: The Corpse Test**
  You point at a dead rabbit carcass. Do they use *"Gavagai"*?
  *   **YES** → Go to **Leaf 5 (THE EMPTY BRANCH)**
  *   **NO** → Go to **Leaf 6**

  *   **Leaf 5: The Running-or-Dead Theory (Logically Possible but Undefended)**
      *   **The Vibe:** The word applies to whole rabbits, but only if they are running OR dead. Not sleeping.
      *   **Why This Branch is Empty:** This combination is logically possible (you can imagine a weird cult that worships speed and corpses), but no linguistic or philosophical theory defends it. It groups "Dead" with "Running" while excluding "Sleeping." Metaphysically, sleeping is closer to running (both are alive) than death is. A theory that groups 'Activity' and 'Death' against 'Static Life' has no consistent principle behind it.
      *   **The Awkward Commitment:** You have to translate "The sleeping rabbit" as "The non-rabbit that is sleeping." Your players will think you made a typo.

  *   **Leaf 6: Event Ontology ("Rabbiting")**
      *   **The Vibe:** The word is a verb disguised as a noun. It means "rabbit-ing is happening."
      *   **The Awkward Commitment:** You can't point to a cage and say "There is a rabbit." If it's not moving, it doesn't exist in the grammar. You have to write "There is no rabbit here," until it twitches.

  ---

  ### Quick Tips for Your Notes

  1.  **If you pick Leaf 1 (Mass Noun):** Think about how they count things. Do they use "buckets of"? "Heads of"?
  2.  **If you pick Leaf 6 (Event):** This is great for horror or alien vibes. It makes the world feel unstable.
  3.  **If you pick Leaf 5 (Empty):** Don't. Unless you want your players to argue with you about logic forever.

  This tree covers the main ways humans (and aliens) carve up reality. Pick the leaf that causes the most interesting problems for your players!
