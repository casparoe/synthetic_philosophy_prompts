      *   **Requirements:**
          *   Start with brainstorming/rejection reasoning.
          *   Provide a defended agenda (prose) for top 2-3 questions.
          *   Explain *why* they are upstream, tractable, neglected, and trade-offs.
          *   Flag the biggest mistake regarding the "indirect duty" interpretation.
          *   Defend the ordering (why worth 4 years).
          *   End with a specific Markdown table with exact columns: 'Open question', 'Why it is upstream', 'Tractability (1-5)', 'Neglectedness (1-5)', 'Overall priority (1-10)', 'What would change the ranking'.

  2.  **Adopt the Persona:**
      *   Tone: Mentorship-oriented, rigorous, encouraging but critical, knowledgeable about the field's landscape.
      *   Perspective: Needs to balance historical fidelity to Kant with systematic philosophical utility. Needs to steer the student away from "exegetical dead ends" toward "constructive philosophy."

  3.  **Brainstorming & Rejection Phase (Internal Monologue/Drafting):**
      *   *Idea 1: Did Kant actually believe animals have no moral status?* (Too exegetical. Sam's view is the standard one. Proving Kant said something else historically is hard and maybe less philosophically impactful than reconstructing the view.) -> *Reject as primary focus, keep as background.*
      *   *Idea 2: Can we extend the Formula of Humanity to animals?* (Classic move. Korsgaard did this. Is there room left? Maybe focusing on the *capacity for suffering* vs. *rational nature* tension.) -> *Keep as a contender, but needs a twist.*
      *   *Idea 3: The role of emotions/affects in Kantian animal ethics.* (Kant talks about sympathy. Sam mentioned this. Is there a duty to cultivate sympathy *for the animal's sake* or just self-perfection?) -> *Good, connects to moral psychology.*
      *   *Idea 4: Institutional vs. Individual duties.* (Kant focuses on maxims. Animal ethics often focuses on systems. Can a Kantian critique factory farming without granting rights?) -> *Very promising for contemporary relevance.*
      *   *Idea 5: The "Analogon of Reason" in animals.* (Kant hints animals have some cognitive capacity. Does this ground direct duties?) -> *Too empirical/biological. Student is weak on bio.*
      *   *Idea 6: Comparing Kant to Utilitarianism on animals.* (Student is weak on util literature. Don't make them fight Singer on his home turf.) -> *Reject as primary focus.*

      *Selection for Agenda:*
      1.  *Reconstructing the Ground of Duty:* Moving from "Indirect Duty to Self" to "Direct Duty regarding Animals" via the concept of *moral feeling* or *analogy*.
      2.  *Institutional Cruelty and Maxims:* How Kantian universalization applies to systemic animal use (factory farming) rather than just individual acts of cruelty.
      3.  *The Status of Moral Feelings:* Is sympathy a mere tool or a constitutive element of moral agency that requires accurate perception of the other (including animals)?

      *Refining the Top 2:*
      Let's combine the "Ground of Duty" with the "Indirect Duty" critique. That's the metaphysical foundation.
      Let's make the second one about *Application/Systemic issues* because that's where contemporary ethics lives.
      Actually, the most "upstream" question is the metaphysical one: *What is the actual object of the duty?*
      The second most important is *How does the constraint function?* (Negative vs. Positive duties).

      *Let's settle on:*
      1.  **The Metaphysical Ground:** Can the "Indirect Duty" be reconstructed as a "Direct Duty regarding Animals" without violating the Formula of Humanity? (The "Korsgaard vs. Traditional" debate needs a fresh take).
      2.  **The Scope of Cruelty:** Does the Kantian prohibition on cruelty extend to *institutional* killing/use, or merely *wanton* suffering? (This determines if Kant can condemn factory farming).
      3.  **Moral Psychology:** The role of sympathy. Is it epistemic? (Does sympathy help us *know* the animal's status?)

      *Decision:* I will prioritize the Metaphysical Ground (Question 1) and the Institutional Scope (Question 2). The Moral Psychology one is a subset of 1.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the bar argument. Validate the student's intuition (Sam is half-right, half-wrong). Set the stage for dissertation work.
      *   **Brainstorming/Rejection:** Show the work. Explain why pure exegesis is bad (dead end). Explain why fighting Utilitarians is bad (wrong strength). Explain why empirical biology is bad (wrong expertise).
      *   **The Biggest Mistake:** Flag the assumption that "Indirect Duty = No Moral Significance." That's the trap.
      *   **The Defended Agenda (Prose):**
          *   *Priority 1: The Ontological Status of the "Regarding" Relation.* (Is the duty *toward* the animal or *about* the animal? This changes everything).
          *   *Priority 2: The Universalization of Institutionalized Use.* (Can the maxim of factory farming be universalized without contradicting self-perfection?)
          *   *Trade-offs:* Importance (High), Tractability (Medium/High for Kant scholar), Neglectedness (Medium).
      *   **The Table:** Fill in the specific columns as requested.

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Critique:* Is Question 1 too abstract?
      *   *Fix:* Emphasize that without solving Q1, Q2 makes no sense. It is truly upstream.
      *   *Critique:* Is the student capable of Q2 without knowing empirical facts about farming?
      *   *Fix:* Frame it as a *structural* critique of maxims, not an empirical investigation of suffering levels. Focus on the *principle* of use.
      *   *Tone Check:* Ensure I sound like an advisor. "Listen," "Here's the trap," "Four years is a long time."
      *   *Constraint Check:* Did I include the Markdown table with *exact* columns? Yes. Did I start with brainstorming? Yes.

  6.  **Final Polish:**
      *   Check the "Upstream" reasoning. Why does Q1 determine Q2? Because if animals are merely things, institutional use is property damage. If they are "analoga," it might be a violation of duty regarding them.
      *   Check the "What would change the ranking" column. Needs to be specific (e.g., discovery of a new manuscript, a shift in legal personhood).
      *   Ensure the distinction between "Direct Duty *to*" and "Direct Duty *regarding*" is clear, as this is the key Kantian nuance.

  7.  **Final Review against constraints:**
      *   Role assumed? Yes.
