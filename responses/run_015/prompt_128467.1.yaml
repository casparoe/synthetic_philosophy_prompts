answer: |-
  Here is a decision procedure designed for your board. It strips Good's Theorem down to its logical skeleton: **Information only has value if it changes a decision, and only if the cost of getting it doesn't outweigh the benefit of making the better choice.**

  This is designed to be written on a whiteboard in four quadrants. It takes 15 minutes.

  ***

  # The "Value of Info" Whiteboard Protocol

  **Setup:** Draw a 2x2 grid on the whiteboard. Label the quadrants 1 through 4.
  **Rule:** You must proceed in order. If you hit a "STOP" in Quadrant 1 or 2, you do not proceed to 3 or 4.

  ### Quadrant 1: The "Change My Mind" Test (Fact Check)
  *Good's Theorem Condition: Information must be capable of altering the optimal action.*

  **Ask the Board:** "If this pilot comes back with the worst possible result, do we still fund the main project? If it comes back with the best possible result, would we still reject it?"

  *   **Yes (It can change our mind):** Proceed to Q2.
  *   **No (We'd fund/reject regardless):** **STOP.** The Value of Information is zero. Do not delay funding for a pilot.
      *   *Why:* If the decision is fixed, paying for info is waste.

  ### Quadrant 2: The "Contamination" Check (Fact Check)
  *Good's Theorem Condition: The prior state must remain stable; measurement cannot alter the phenomenon.*

  **Ask the Board:** "Does running this pilot change the population or the context in a way that makes the main study invalid?" (e.g., priming participants, revealing the hypothesis to the community, using up the only available subjects).

  *   **No (Clean measure):** Proceed to Q3.
  *   **Yes (Contaminated):** **STOP.** The pilot corrupts the main study. The "info" is actually an intervention.
      *   *Why:* You aren't measuring the state; you're changing it. The main study EV is now unknowable.

  ### Quadrant 3: The "Scope Lock" Check (Fact/Logic Check)
  *Good's Theorem Condition: The decision space must be fixed. You cannot use info to invent new options.*

  **Ask the Board:** "Are they using this pilot to *refine* the proposed study (fix typos, check timing), or to *redesign* the study (change hypotheses, swap outcomes, find new variables)?"

  *   **Refine (Same study, better execution):** Proceed to Q4.
  *   **Redesign (New study):** **STOP.** This violates the grant proposal's EV calculation.
      *   *Why:* You funded Proposal A. If the pilot turns it into Proposal B, you haven't reduced risk on A; you've sidestepped the review process for B.

  ### Quadrant 4: The "Delay vs. Risk" Trade-off (VALUES VOTE)
  *Good's Theorem Condition: $E[Value_{with\_info}] - Cost_{delay} > E[Value_{without\_info}]$.*

  **Ask the Board:** "We know the pilot *can* change the decision (Q1) and *won't* ruin the study (Q2). Now, is the risk of funding a flawed design worse than the cost of delaying the project by [X weeks/months]?"

  *   **[VOTE]**: Raise hands.
      *   **Majority says Delay is worth it:** **APPROVE PILOT.**
      *   **Majority says Speed is worth more:** **FUND MAIN STUDY NOW.**
      *   *Note:* This is not a fact. This is the board's risk tolerance.

  ***

  # Running the Protocol: Three Cases

  Here is how this plays out with your specific examples.

  ### Case 1: The Survey Pre-Test
  **Proposal:** Team wants to test survey questions on 30 people before launching the 500-person study. They ask to delay funding by 3 weeks.

  *   **Q1 (Change Mind):** If the 30 people find the questions confusing or offensive, would we stop the 500-person study to fix them?
      *   *Board:* "Yes, a broken survey wastes the whole grant." **(Pass)**
  *   **Q2 (Contamination):** Does answering the pilot survey change how they answer the main survey?
      *   *Board:* "No, different participants. No priming." **(Pass)**
  *   **Q3 (Scope Lock):** Are they fixing questions or changing the hypothesis?
      *   *Board:* "Just fixing wording and timing." **(Pass)**
  *   **Q4 (Values Vote):** Is 3 weeks of delay worth avoiding a catastrophic survey failure?
      *   *Board:* **[VOTE]** Unanimous Yes.
  *   **Verdict:** **Approve Pilot.** The math holds; the value judgment is clear.

  ### Case 2: The Census Peek
  **Proposal:** Team wants to look at preliminary census data for 4 weeks to decide *which* neighborhoods to sample before locking the design.

  *   **Q1 (Change Mind):** If the data shows certain neighborhoods are inaccessible, would you change the sampling frame?
      *   *Board:* "Yes." **(Pass)**
  *   **Q2 (Contamination):** Does looking at census data change the neighborhood?
      *   *Board:* "No." **(Pass)**
  *   **Q3 (Scope Lock):** Are they refining the sample or redesigning the study?
      *   *Board:* "Wait. If they pick neighborhoods *based on the data*, aren't they optimizing for significance rather than theory?"
      *   *Analysis:* This is the hidden misfire. By using the outcome variable (neighborhood characteristics) to select the sample, they are engaging in "data snooping." The decision space isn't fixed; they are fishing for the highest effect size. This violates the independence assumption of the main study's power calculation.
      *   *Verdict:* **STOP at Q3.** This isn't a pilot; it's the first step of the analysis. It invalidates the statistical inference of the main grant.
  *   **Board Action:** Reject the pilot request. Fund the study only if they pre-register the neighborhoods based on theory, not data.

  ### Case 3: The "We Love Them" Trap
  **Proposal:** A favorite team proposes a pilot. The board knows the science is solid, but the team is anxious and wants the pilot for confidence. The board *wants* to help them.

  *   **Q1 (Change Mind):** If the pilot fails, do we reject the main grant?
      *   *Board:* "Honestly? No. We know their track record. We're going to fund the main study anyway."
      *   *Analysis:* **STOP at Q1.**
      *   *Why:* Good's Theorem dictates that if the action (Funding) remains constant regardless of the signal (Pilot Result), the Expected Value of Information is exactly zero.
  *   **Verdict:** **Reject Pilot.**
  *   **The Hard Truth:** You cannot justify a delay for information you admit you will ignore. If you fund them regardless, give them the money now. Do not charge them (in time) for a "safety check" you won't use.

  ***

  # Limitations & Honest Disclaimers

  Put this at the bottom of the whiteboard so everyone sees it.

  1.  **This doesn't measure "Peace of Mind."**
      Researchers often want pilots to feel safe. Good's Theorem only values info that changes *actions*. If the pilot just makes them feel better but doesn't change the design or the funding decision, the theorem says it's worthless. You can override this in Q4, but admit you are paying for anxiety relief, not scientific value.
  2.  **This assumes rational actors.**
      The protocol assumes that if a pilot shows a fatal flaw, the board *will* reject the grant. If your board has a "sunk cost" bias (e.g., "We already waited 3 weeks for the pilot, we might as well fund the flawed study now"), the calculation in Q1 is false.
  3.  **This ignores "Option Value."**
      Sometimes a pilot isn't about the current grant, but about unlocking *future* grants. This protocol evaluates the current decision only. If the pilot is actually a "proof of concept" for a larger NSF bid later, that's a different decision tree.
  4.  **Q4 is purely political.**
      Quadrants 1-3 are logic checks. Quadrant 4 is a risk tolerance vote. If the board is risk-averse, you will approve more pilots. If the board is speed-focused, you will approve fewer. There is no "correct" math answer for Q4.

  # Summary for the Chair
  *   **Q1 & Q2:** Hard Gates. If these fail, the pilot is scientifically invalid or useless.
  *   **Q3:** The Integrity Gate. Prevents "scope creep" disguised as piloting.
  *   **Q4:** The Policy Gate. This is where you decide how much you value speed vs. precision.

  **Coffee Break Rule:** If you spend more than 5 minutes on Q1, the proposal is too vague. Table it.
