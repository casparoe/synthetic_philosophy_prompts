prompt: |-
  I'm on the review board for a small grant program that funds quick-turnaround social-science pilots. We get like 20 proposals a month, and researchers keep asking if they can run a small preliminary survey before locking their main study design — basically asking wether it's worth delaying the grant decision to gather more info. I want a decision procedure based on Good's theorem on the value of information, turned into something my board can actually run in a 15-minute meeting with nothing but a whiteboard and coffee.

  The procedure should take a proposal and ask questions in order: can they actually update their action after recieving the info? are the prior probabilities genuinely fixed, or does the pilot itself become part of the result and corrupt them? Where the math gives a clear yes or no, say so; where it becomes a judgment call about wether the delay cost outweighs the expected value, flag it as a values vote, not a fact. I need it to catch the hidden misfires — like when the information looks free but actually expands the decision space in a way that violates the theorem's conditions. Then run it on three cases: a team that wants to pre-test survey questions on 30 people before a 500-person study; a team that wants to peek at preliminary census data before choosing which neighborhoods to sample; and a case where we all want to approve the pilot but the procedure forces a no because the information can't actually change our funding decision. Keep it practical for people who aren't decision theorists, mark every spot where we have to vote on values instead of computing answers, and be honest about what the procedure just can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** Small grant program, social-science pilots, 20 proposals/month, quick-turnaround.
      *   **Problem:** Researchers want to run preliminary surveys/pilots *before* the grant decision (delaying funding) to refine design. Board needs to know if this delay is worth it.
      *   **Tool:** Good's Theorem on the Value of Information (VoI).
      *   **Constraint:** Must be runnable in a 15-minute meeting with a whiteboard and coffee. No complex math.
      *   **Requirements:**
          *   Sequential questions.
          *   Distinguish between factual checks (Yes/No) and value judgments (Vote).
          *   Catch "hidden misfires" (e.g., info expands decision space, violates conditions).
          *   Run on three specific cases (Survey pre-test, Census peek, "We want to say yes but can't").
          *   Practical for non-decision-theorists.
          *   Honest about limitations.

  2.  **Deconstruct Good's Theorem (VoI):**
      *   *Core Idea:* Expected Value of Information (EVI) > Cost of Information.
      *   *Condition 1:* The information must be able to change the decision. If you'd fund the project regardless of the pilot result, the pilot has zero value.
      *   *Condition 2:* The cost includes delay (opportunity cost).
      *   *Condition 3:* The prior probabilities must be stable (the act of measuring shouldn't change the underlying reality in a way that invalidates the main study).
      *   *Condition 4:* The decision space must be fixed (you can't use the info to invent *new* options that weren't considered in the original EV calculation).

  3.  **Drafting the Procedure (The "15-Minute Whiteboard Protocol"):**
      *   *Goal:* Simplify the math into heuristic questions.
      *   *Structure:* A flowchart style, but linear for meeting flow.
      *   *Step 1: The "Change My Mind" Test (Decision Sensitivity).* Can the pilot result actually make us reject a project we would have funded, or fund one we would have rejected?
      *   *Step 2: The "Contamination" Check (Measurement Effect).* Does running the pilot ruin the main study (e.g., priming, learning effects)?
      *   *Step 3: The "Delay" Cost.* Is the time lost worth the risk reduction? (This is the Value Judgment).
      *   *Step 4: The "Scope Creep" Check.* Are they using the pilot to redesign the whole project (violating the fixed decision space)?

  4.  **Refining the "Values vs. Facts" Distinction:**
      *   Facts: Can the result change the decision? Is the measurement invasive?
      *   Values: How much do we care about risk vs. speed? How much is a month of delay worth?

  5.  **Developing the Three Cases:**
      *   *Case 1 (Survey Pre-test):* 30 people before 500.
          *   *Analysis:* Likely high value, low cost. Can change design (fix bad questions). Low contamination risk.
          *   *Verdict:* Yes (with caveats).
      *   *Case 2 (Census Peek):* Peeking at data to choose neighborhoods.
          *   *Analysis:* This is "data snooping" or p-hacking risk. It changes the sampling frame based on the outcome. Violates the "fixed decision space" or introduces bias.
          *   *Verdict:* No (or high risk).
      *   *Case 3 (The "We Want to Fund" Trap):* Board likes the team, but the pilot won't change the funding decision.
          *   *Analysis:* If we fund them no matter what the pilot says, VoI = 0.
          *   *Verdict:* No (Hard stop).

  6.  **Writing the Content - Tone and Style:**
      *   Tone: Professional, pragmatic, slightly weary (grant board reality), clear.
      *   Format: Step-by-step guide, then the case studies.
      *   Visuals: Describe what goes on the whiteboard.

  7.  **Iterative Refinement (Self-Correction during drafting):**
      *   *Critique:* Is Good's Theorem too technical?
      *   *Fix:* Don't mention the formula $E[V|I] - C > E[V]$. Just use the logic: "Will this change what we do?" and "Is the change worth the wait?"
      *   *Critique:* The prompt asks to catch hidden misfires where info expands decision space.
      *   *Fix:* Add a specific step about "Scope Lock." If the pilot allows them to fundamentally change the hypothesis, the prior EV calculation is void.
      *   *Critique:* Make sure the "Values Vote" is explicit.
      *   *Fix:* Label specific steps as [VOTE].

  8.  **Final Polish:**
      *   Check against constraints: 15 minutes? Yes, if kept to 4 questions. Whiteboard friendly? Yes. Coffee compatible? Yes.
      *   Ensure the three cases are distinct and illustrate the rules.
      *   Add the "Honest Limitations" section as requested.

  9.  **Final Output Generation:** (This matches the detailed response provided previously.)
      *   Introduction: Set the stage.
      *   The Protocol: 4 Steps.
      *   The Whiteboard Visual.
      *   The Three Cases.
      *   Limitations.

  *(Self-Correction on Case 2)*: Wait, looking at census data before sampling is standard practice *unless* they are using it to find significant results rather than stratify. The prompt says "peek at preliminary census data before choosing which neighborhoods to sample." If they use it to optimize for *feasibility*, that's fine. If they use it to optimize for *expected effect size* based on the same data they will analyze, that's double-dipping. I need to frame this carefully as "Data-Dependent Design" vs. "Logistical Design." Let's frame it as the "Optimizer's Curse" risk.

  *(Self-Correction on Case 3)*: This is the classic "VoI = 0" case. If the decision is "Fund regardless," the info has no value. This is the strongest application of Good's theorem.

  *(Refining the "Values Vote")*: Ensure the distinction is clear. Facts = "Can it change?" Values = "Is the change worth the cost?"

