  To the Finance Committee of the Board of Trustees

  I write on behalf of the Committee on Socially Responsible Investment to recommend a course of action regarding the petition demanding full divestment from two livestock and meat-processing firms within the current academic year. After reviewing the financial constraints of our endowment structure and the philosophical arguments surrounding collective harm, we recommend against immediate full divestment. Instead, we propose retaining the holdings within our separately managed accounts for a period of twenty-four months to pursue an active engagement strategy tied to specific emissions and animal welfare metrics. Should these firms fail to meet interim targets on greenhouse gas reduction and supply chain welfare standards by the end of this period, we will trigger an automatic divestment from those separately managed accounts. We acknowledge that the sixty percent of our endowment held in commingled index vehicles cannot be divested without altering our fundamental investment mandate, though we recommend exploring ESG-index alternatives upon the next rebalancing cycle. Concurrently, and crucially, we recommend that the university commit to a multi-year procurement reduction in beef and poultry volume within our dining halls. This dual approach leverages our ownership rights where we possess them while directing our most potent tool for actual harm reduction toward our operational consumption.

  This recommendation rests on a clear-eyed assessment of the Chief Investment Officer's counterfactual-with-replacement objection. The CIO argues that selling our shares does not reduce the firm's capital or alter its activity but merely transfers ownership to another holder who may be less likely to pressure the firm on emissions and welfare. It is uncontroversial among scholars of collective harm and causal contribution that any individual consumer's or small institution's marginal effect is generally very small and usually below the threshold at which suppliers respond. In the context of public equity markets, this empirical claim is even stronger; a sale of our position does not shrink the firm's balance sheet. The live dispute, however, is whether moral responsibility tracks causal impact alone or whether membership in a harmful group generates reasons independent of difference-making. The petitioners argue that ownership constitutes complicity regardless of efficacy, while the CIO argues that responsibility requires the capacity to change outcomes. Our recommendation accepts the CIO's premise that retaining ownership offers the only plausible mechanism for causal influence via proxy voting and shareholder resolutions, but it rejects the conclusion that we must retain ownership indefinitely. By establishing a strict escalation ladder with a divestment trigger, we acknowledge that engagement is instrumental, not an end in itself. If the leverage fails to produce material change, the moral cost of continued ownership outweighs the diminished probability of future influence.

  We have also considered the proposal of tilting, whereby we would sell the meat-processing firms and purchase competing alternative-protein firms to change the relative cost of capital between them. While this sidesteps the replacement objection by actively shifting capital allocation rather than merely vacating a position, we must be clear about its limitations. Tilting plausibly makes a difference at the margin by lowering the cost of capital for the alternative firm relative to the incumbent, but it does not remove us from the ecosystem of harm if the alternative firm also utilizes industrial practices that petitioners find objectionable. Furthermore, partial ownership of a firm that still causes harm leaves the petition's complaint intact regarding complicity. If the moral objection is to the structure of industrial animal agriculture itself, swapping one equity position for another within the broader food system may appear as portfolio optimization rather than moral cleansing. Therefore, we do not recommend tilting as a substitute for the engagement-and-divestment ladder, though we support it as a complementary strategy within our separately managed accounts where fiduciary duty allows for sector-specific bets.

  Regarding the consumption channel, we must resolve the tension between investment policy and operational policy without obscuring the reality of where impact lies. The university runs dining halls serving several million meals a year, and a multi-year procurement commitment to cut beef and poultry volume is a demand reduction with a lagged but real supply response. It is arguable that this accomplishes more for the outcomes the petitioners care about than any portfolio move. To suggest otherwise would be to prioritize symbolic financial gestures over material operational changes. We resolve this tension by asserting that the investment committee should not be asked to do work it cannot do when operational policy can. Divestment is often demanded because it is financially visible, but procurement reduction is morally superior because it directly reduces the quantity of animals reared and slaughtered. Acknowledging this is not a bureaucratic way of changing the subject; it is an honest redirection of the complaint to the lever that actually moves the needle. However, we cannot recommend procurement changes alone and ignore the investment petition, as the endowment represents the university's permanent moral footprint. Thus, we pair the procurement commitment with the investment engagement strategy to ensure both operational and financial alignments are addressed.

  Finally, we must address the expressive function of divestment. The strongest losing consideration in almost every draft we reviewed is the expressive one: that divestment's real work is stigmatization, that it shifts what other institutions and regulators treat as acceptable, and that being a named institution on a public list of divestors has cascade effects that no share-level counterfactual captures. This argument relies on the contested claim that institutional symbolic action informs the public rather than largely consoles the institution. If the stigmatization argument holds, then divestment has value even without causal impact on the target firm. However, the rejoinder must be stated fairly: that this is cheap moral self-distancing, letting us feel uninvolved while continuing to profit from the broader market indices that still hold those shares. Given that sixty percent of our endowment remains in commingled vehicles where we hold no share-level voting rights, full moral distancing is impossible without a fundamental restructuring of our investment philosophy. We cannot claim purity while remaining invested in the global market. Therefore, we weigh the expressive benefit of divestment against the risk of moral self-distancing and conclude that active engagement with a credible threat of exit is more honest. It admits our entanglement while striving to mitigate it, rather than pretending we can sell our way out of a systemic problem.

  This recommendation depends on the contested claim that a small probability of being pivotal through engagement can bear the moral weight assigned to it. If it turns out that shareholder engagement is systematically ineffective in this sector, then our recommendation fails on its own terms, and divestment becomes the only consistent moral position regardless of financial efficacy. We accept this risk and commit to reviewing the engagement progress annually. We ask the Finance Committee to approve this engagement ladder and the parallel dining hall procurement review, recognizing that while we cannot solve the collective harm problem alone, we can refuse to be passive participants in it.
