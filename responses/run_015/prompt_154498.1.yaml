answer: |-
  - Where it breaks
  The argument fractures at the transition from (5) to (6). Step (5) overgeneralizes the failure of the Conditional Analysis (CA). Just because masks show that dispositions do not entail *unqualified* counterfactuals, it does not follow that they entail *no* counterfactuals. They still entail qualified ones (e.g., "would break if struck in normal conditions"). The move to (6) assumes a false dichotomy: that if dispositions are not reducible to counterfactuals, they must be identical to categorical bases. This ignores the ontological middle ground where dispositions are irreducible properties that *ground* counterfactuals without being *defined* by them. The argument assumes reductionism; if you reject the idea that dispositions must be analyzed away rather than accepted as real features of the world, the paradox dissolves. You do not need to choose between CA and categoricalism; you can accept dispositions as sui generis powers.

  - Why the step looked sound
  This inference seduces because masks are indeed cheap to construct. If any disposition can be neutralized by some conceivable interferer, the link between property and manifestation appears contingent everywhere. It feels intuitive that if the connection isn't one of logical necessity, it is nothing at all. Furthermore, the categoricalist conclusion in (6) appears to be the only escape from an endless regress of qualifying conditions required to fix the CA. If you cannot define the disposition by what it does across all scenarios, surely it just *is* what it is intrinsically. The exhaustion of logical space feels complete: either the property is defined by its manifestation (CA) or it is defined by its structure (categoricalism). This binary makes the step feel like a forced choice rather than a leap.

  - Price list
  *   **(1) Keep.** Denying masks contradicts clear cases like the foam-packed glass. **Cost:** None; this is data.
  *   **(3) Keep.** Defining masks by basis-retention is precise and useful. **Cost:** None; this clarifies the phenomenon.
  *   **(4) Modify.** Masks are common, but "normal conditions" exclude them. **Cost:** You must accept context-dependence in disposition ascriptions; no disposition works in a vacuum.
  *   **(5) Reject.** Dispositions entail qualified counterfactuals, not none. **Cost:** You lose the simple CA but keep the robust link between property and behavior under standard conditions.
  *   **(6) Reject.** Dispositions are not just bases. **Cost:** You must accept irreducible dispositional properties (powers) rather than reducing them to categorical structures. This is a significant metaphysical commitment to dispositional essentialism, requiring you to view modality as inherent to properties rather than imposed by laws or counterfactuals.

  - The two leftover cases
  The symmetric poisons case does not break the diagnosis; it merely shows masking is reciprocal. Both poisons retain their lethal bases; both are masked by the other. This fits the revised view: both have the disposition, neither manifests it due to interference. It highlights that "stimulus" specification matters, but doesn't force categoricalism. The mimic case (wired table) shows the converse failure: the counterfactual is true, but the disposition is absent. This reinforces that CA is insufficient (supporting your step 2) but does not force the conclusion that dispositions don't exist (rejecting step 6). Both cases confirm that dispositions are distinct from their manifestations and their counterfactual truths. They support rejecting the reductionist assumption in (6) rather than denying masks. Neither changes the diagnosis; they simply illustrate why the simple conditional analysis fails in both directions, necessitating a realist view of dispositions.

  - Bottom line
  Reject (6). Dispositions are not their bases, nor are they simple counterfactuals. They are irreducible powers that ground counterfactuals under normal conditions. You keep masks as real interferers, retain the distinction between property and manifestation, and avoid categoricalism. The cost is accepting a richer ontology where properties have modal force inherently, but this preserves the reality of dispositions without falling into the self-defeating trap you identified.
