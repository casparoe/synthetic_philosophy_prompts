prompt: |-
  I'm working through the metaphysics of persistence for a graduate seminar, and I've become dissatisfied with the standard framing—endurantism versus perdurantism—because it seems to be tested against too small a set of cases. Before I commit to either view, I want the full specification of what a theory of diachronic persistence actually has to deliver, with the motivating case behind each requirement, and I want you to flag any pair of requirements that may be jointly unsatisfiable. In particular, the theory must account for ordinary gradual change (a tree growing), but also for more demanding configurations: fission cases where one entity divides into two psychologically continuous successors; fusion cases where two streams merge; intermittent existence with causal gaps, such as a mind that is suspended for centuries and then resumed in a different substrate with only partial psychological continuity; and branching scenarios in which a being exists in disconnected temporal regions with different intrinsic properties, yet claims numerical identity across the gap. For each, specify whether the theory needs to preserve strict identity, allow survival without identity, or deny that the scenario is possible.

  The desiderata should include: (1) explaining how an object can have incompatible intrinsic properties at different times without contradiction; (2) respecting the distinction between being wholly present at each time and being distributed across times; (3) accommodating or explaining away the intuition that identity requires spatiotemporal and causal continuity; (4) remaining consistent with special relativity, which denies absolute simultaneity and thus complicates any notion of being wholly present across space at a single time; (5) handling cases where psychological or functional continuity is present but bodily continuity is absent, and vice versa; and (6) not collapsing the distinction between persisting through change and merely being part of a larger four-dimensional whole. For each, state whether it is a non-negotiable constraint or a preference tied to a particular camp—say, those who prioritize common-sense intuition about being the same person versus those who prioritize ontological parsimony or physicalist commitments.

  Finally, indicate whether any subset of these requirements is jointly unsatisfiable—particularly whether the combination of (2) being wholly present at each time, (1) having genuinely contradictory properties at different times, and (4) relativistic physics can all be held together, or whether that tension forces a choice. Then, briefly, assess how endurantism and perdurantism fare against the list: where each succeeds structurally, where it must pay an ontological or explanatory cost, and which of the above desiderata does the most damage to each view. Keep the focus on the criteria themselves; the evaluation of the theories should be brief and structural rather than a full historical survey.
