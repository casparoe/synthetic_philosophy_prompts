answer: |-
  I have been thinking deeply about our conversation late the other night, and I agree entirely that we were talking past each other because we lacked a shared specification of what a successful theory of time's arrow must actually achieve. It is easy to agree that entropy increases, but much harder to agree on what counts as an explanation for why it increases in a universe governed by time-symmetric laws. To resolve this, I have tried to write out the full specification of requirements that any theory grounding the direction of time in entropy must deliver to count as successful, distinguishing between what is strictly necessary and what is merely a preference of certain cosmological camps.

  The foundational requirement, which stands as non-negotiable, is the reconciliation of microscopic reversibility with macroscopic irreversibility. The motivating case here is Loschmidt's paradox, which points out that if the fundamental dynamical laws of physics are invariant under time reversal, it is conceptually unclear how they can give rise to processes that are manifestly irreversible, such as an egg breaking but never unbreaking. A successful theory must demonstrate how statistical mechanics bridges this gap without smuggling in time-asymmetric assumptions at the micro level. This is not a matter of preference but a logical necessity; if the theory cannot derive the macroscopic arrow from the microscopic laws, it has not grounded the arrow in physics at all. Closely tied to this, and equally non-negotiable, is the requirement to distinguish the temporal arrow from the causal arrow rather than allowing one to collapse into the other. The conceptual tension here is that while causes precede effects, defining time solely by causation risks circularity or fails to account for physical processes where causation is ambiguous. We need a physical basis for the direction of time that stands independently, even if it subsequently supports our causal intuitions. If a theory reduces time to causation, it fails to explain the physical asymmetry that makes causation possible in the first place.

  Moving to the origin of the arrow itself, there is a requirement to explain why the initial state of the universe was so extraordinarily low-entropy without merely treating that fact as an unexplained boundary condition. The motivating case is that positing a Past Hypothesis as a brute fact stops explanation short; it tells us that the arrow exists because the past was low-entropy, but it does not tell us why the past was low-entropy. For a theory to count as a fundamental grounding rather than a descriptive placeholder, it must derive this boundary condition from deeper principles, such as quantum gravity or cosmological selection effects. I classify this as non-negotiable for a complete theory, though I acknowledge that many working physicists treat it as a pragmatic stopping point. However, since our goal is to understand why time flows rather than just describing how it flows, accepting an unexplained boundary condition is insufficient. Regarding the epistemic asymmetry, specifically why we have records and memories oriented toward the past but not the future, I argue this must be integrated as a separate desideratum rather than left to other disciplines like psychology or neuroscience. The tension here is that a physical theory of time that cannot account for the phenomenology of memory is incomplete; the thermodynamic arrow must be shown to necessitate the epistemic arrow. If the physics allows for records of the future just as easily as the past, the theory fails to match reality. Therefore, deriving the asymmetry of knowledge from the asymmetry of entropy is a non-negotiable requirement for a theory that claims to explain our experience of time.

  In contrast to these strict requirements, accommodating a possible future cosmological contraction or cyclic model is a camp-specific preference rather than a hard constraint. The motivating case for including this is often philosophical comfort with eternalism or specific interpretations of quantum cosmology, but current observational evidence points toward continued expansion. A theory of the arrow of time should be robust enough to handle the current expanding phase without needing to commit to a specific ultimate fate of the universe. Requiring a theory to work only in a cyclic model unnecessarily restricts the scope of physical inquiry based on speculative cosmology. Therefore, while a successful theory should not be contradicted by cyclic models if they turn out to be true, demanding that it accommodate them is a preference of particular cosmological camps and not a condition for the theory's success in explaining the present arrow.

  When we assess whether any subset of these demands is jointly unsatisfiable given current results, there is significant tension, though not yet a proof of impossibility. The primary friction lies between the demand to explain the low-entropy initial state without brute boundary conditions and the current limitations of quantum cosmology. At present, no known theory in statistical mechanics or quantum gravity successfully derives the Past Hypothesis from dynamical laws alone without reintroducing asymmetry elsewhere or relying on controversial multiverse assumptions. While this suggests a potential incompatibility, it is more accurate to say that the joint satisfaction of these demands is an open problem rather than a proven impossibility. The mathematical framework exists to discuss these issues, but the physical mechanism remains elusive, meaning the demands are logically compatible even if physically unachieved.

  Finally, if we must identify which single desideratum eliminates the largest number of popular accounts, it is the refusal to accept unexplained boundary conditions regarding the initial low-entropy state. Most standard accounts, including the classic Boltzmannian approach and many modern cosmological models, simply posit the Past Hypothesis as a brute fact to get the arrow started. They successfully reconcile micro-reversibility with macro-irreversibility and can often accommodate epistemic asymmetry, but they halt at the edge of the Big Bang. By insisting that the theory must explain why the universe started in a low-entropy state rather than just assuming it did, we filter out the majority of existing proposals. This is the highest bar because it demands a theory of initial conditions that is as robust as the theory of dynamical evolution, and currently, physics lacks a consensus on how to provide such a theory without invoking speculative mechanisms like inflationary multiverses or quantum gravity effects that are themselves unverified. This requirement is the true bottleneck, and until it is met, any theory of time's arrow remains descriptive rather than fundamentally explanatory. I hope this specification helps clarify where our disagreement lay, as I suspect you may have been willing to accept the boundary condition as a brute fact while I was holding out for a dynamical explanation.
