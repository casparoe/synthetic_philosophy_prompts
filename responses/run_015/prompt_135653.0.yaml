answer: |-
  # The Desert and Reward Decision Tree

  This taxonomy maps the logical space of positions on merit and distribution. It begins with the metaphysical grounding of desert and proceeds through administrative and structural filters. Follow the path that matches your intuitions about specific cases to find your position.

  ### **ROOT: Does desert apply at all to outcomes that depend on unchosen talents or social background?**
  *   **YES:** (I believe a person can legitimately claim reward even if their success relied on natural gifts or family wealth they did not choose.) → *Go to Node 1.*
  *   **NO:** (I believe unchosen advantages are morally arbitrary; no one deserves the rewards that flow from them.) → *Go to Node 4.*

  ---

  ### **NODE 1: Can effort be conceptually isolated from talent?**
  *   **YES:** (We can distinguish how much of a result came from grit versus how much came from natural ease.) → *Go to Node 2.*
  *   **NO:** (Talent makes effort easier or more productive, so the two are inextricably mixed.) → *Go to Node 3.*

  ### **NODE 2: Do structural advantages generate negative desert (a duty to forfeit rather than a claim to receive)?**
  *   **NO:** (Advantages are neutral tools; I owe nothing for having them, only for how I use them.) → *Go to Node 5.*
  *   **YES:** (If I started ahead, I incur a debt to the disadvantaged before I can claim any reward.) → *Go to Node 5.*

  ### **NODE 3: Should counterfactual effort — what a person would have exerted under genuinely fair background conditions — count as desert-generating?**
  *   **YES:** (Reward people for the effort they *would* have shown if the playing field had been level.) → *Go to Node 5.*
  *   **NO:** (If we cannot measure actual effort, we cannot measure desert at all.) → *Go to Node 4 (Collapse to Anti-Desert).*

  ---

  ### **NODE 4: Should luck-egalitarian compensation be applied before desert is calculated or only after?**
  *(Note: This node applies to those who answered NO at the Root, or NO at Node 3.)*
  *   **BEFORE:** (Society must neutralize bad luck and compensate disadvantages prior to distributing any remaining social goods.) → *Go to Node 5.*
  *   **AFTER / NEVER:** (Compensation is secondary to, or irrelevant compared to, the final distribution of status or resources.) → *Go to Node 5.*

  ---

  ### **NODE 5: Should a just institution aim at proportional reward, sufficient reward, or strict equality regardless of contribution?**
  *   **PROPORTIONAL:** (Rewards must track contribution, however "contribution" was calculated in previous steps.) → *See Leaf A, B, or C.*
  *   **SUFFICIENT:** (The only requirement is that everyone has enough; inequality above that threshold is irrelevant.) → *See Leaf D.*
  *   **STRICT EQUALITY:** (Resources or status must be equalized regardless of input or luck.) → *See Leaf E.*

  ---

  ## **THE LEAVES: Positions and Practical Commitments**

  ### **Leaf A: Strict Desertism**
  *(Path: Root=YES → Effort/Talent=YES → Neg Desert=NO → Aim=PROPORTIONAL)*
  *   **Position Name:** **Strict Desertism** (often aligned with Right Libertarianism).
  *   **Inseparable Variants:** *Compatibilist Free Will* and *Hard Incompatibilist Free Will* positions land here indistinguishably; both justify proportional reward based on actual output regardless of metaphysical freedom.
  *   **Most Awkward Practical Commitment:** You must accept that a lazy heir who inherits a fortune deserves to keep it all, even if a diligent orphan starves, provided no force was used.

  ### **Leaf B: Corrected Meritocracy**
  *(Path: Root=YES → Effort/Talent=YES → Neg Desert=YES → Aim=PROPORTIONAL)*
  *   **Position Name:** **Corrected Meritocracy** (aligned with some interpretations of Rawlsian Fair Equality of Opportunity).
  *   **Most Awkward Practical Commitment:** You must implement a bureaucracy capable of calculating the precise historical "debt" owed by every advantaged person to every disadvantaged person before wages can be paid.

  ### **Leaf C: Hypothetical Meritocracy**
  *(Path: Root=YES → Effort/Talent=NO → Counterfactual=YES → Aim=PROPORTIONAL)*
  *   **Position Name:** **Hypothetical Meritocracy** (a niche theoretical position).
