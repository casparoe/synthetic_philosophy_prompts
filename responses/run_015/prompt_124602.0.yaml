answer: |-
  **Room Read**
  The metaphysicians will fire first, treating your "fiduciary self" as a candidate ontological category. They want to know if you're an eliminativist or a quietist; they'll smell blood if you equivocate on "existence." The Emeritus Dennettian won't attack your conclusion but your genealogy; he'll argue you've rediscovered Dennett's pragmatism and renamed it. The Buddhists will sit quietly until the end, then ask if this reifies clinging. The psychologists will seem disengaged until they ask for predictive validity. The mood will be polite but predatory; this is a job talk, and they need to know if you can hold a line under pressure. Expect the metaphysicians to test your grounding claims hardest. If you look like you're bluffing on the ontology, the search committee will note it. If you concede too much to the Dennettian, you look derivative. Walk the tightrope: respectful of the tradition, but claiming a distinct normative niche.

  **The Objections**

  **1. The Emeritus Dennettian**
  *Objection:* "You're fighting a straw man. Dennett's center of narrative gravity is already a normative construct, not a descriptive average. The Joycean Machine isn't just recording; it's editing for coherence. When you say commitments bind prospectively, you're just describing the function of the CNG under stress. Why posit a 'fiduciary' layer when the narrative layer already does the work?"
  *Reply:* "Dennett's CNG explains coherence, not obligation. A narrative can be coherent without binding future action. My claim is that the *audit* (narrative) follows the *bond* (fiduciary). Marta keeps promises across inconsistent narratives. The binding isn't narrative coherence; it's the cost of defaulting on the posit."
  *Soft Spot:* Dennett *does* hint at pragmatism in later work. If he quotes *Kinds of Minds*, you risk looking like you haven't read the late corpus.

  **2. The Analytic Metaphysician (Ontology)**
  *Objection:* "You call the self a 'legal fiction.' Are you making an ontological claim or changing the subject? If it's a fiction, what makes it true that I have one? If it's real, what grounds it? You seem to want the moral weight of realism without the metaphysical cost. That's an ontological free ride."
  *Reply:* "It's a functional posit, like a corporation. The grounding is the system's capacity to incur debt. The 'truth' is in the transactional success, not the substrate. I'm not avoiding cost; I'm relocating it from substance to commitment."
  *Soft Spot:* Corporations rely on external legal systems. What is the metaphysical substrate for the fiduciary self if not the brain? You risk circularity.

  **3. The Partner's Question (Agency)**
  *Objection:* "If the self is a posit, who is doing the positing? If you say 'the agent,' you've presupposed the self you're trying to explain. If you say 'the brain,' you've changed the subject to biology. You risk a homunculus regress or eliminating the very agency required to make a promise."
  *Reply:* "The organism posits, not the self. The fiduciary self is the interface the organism uses to manage future constraints. The positer is the biological system; the posit is the social/moral agent."
  *Soft Spot:* Distinguishing "organism" from "self" is tricky. If the organism posits, why does the *self* bear the moral weight? You need a clean account of this handoff.

  **4. The Analytic Metaphysician (Grounding)**
  *Objection:* "You say commitments ground the self. But commitments are propositional attitudes held by... whom? If the self is constituted by commitments, what holds the commitments before the self is constituted? This looks like a grounding regress. You need a truthmaker prior to the posit."
  *Reply:* "The capacity to commit grounds the posit, not the commitments themselves. The truthmaker is the biological vulnerability to sanction. The self is the ledger, not the accountant."
  *Soft Spot:* "Vulnerability to sanction" sounds behaviorist. Metaphysicians want something more robust than threat-response to ground moral weight.

  **5. The Buddhist Studies Scholar**
  *Objection:* "In the two truths doctrine, conventional truth is useful only if it reduces suffering. Does this 'fiduciary self' reduce clinging or reinforce it? You're giving them a new object to grasp—a promissory note they must protect. Is this soterologically viable, or just another *atman*?"
  *Reply:* "It reduces suffering by decoupling existence from identity. You can lose the self (default on the note) without ceasing to exist. It makes identity fragile and manageable, not essential."
  *Soft Spot:* They may argue that *any* self-talk reinforces clinging. If you don't have a practice component, this looks like theoretical appropriation.

  **6. The Psychologist**
  *Objection:* "You use Marta's memory fragmentation. But autobiographical memory research shows memory is reconstructive anyway. What does your model predict that the standard reconstructive model doesn't? If it's just a conceptual shift, what's the empirical traction?"
  *Reply:* "Standard models predict memory failure leads to commitment failure. My model predicts commitment stability *despite* memory failure, provided the fiduciary posit is maintained. Test promise-keeping in dissociative states."
  *Soft Spot:* This is hard to test. If they say "that's not feasible," you look armchair-bound. Have a citation ready for dissociative promise-keeping.

  **7. The Analytic Metaphysician (Persistence)**
  *Objection:* "How does this handle fission cases better than Parfit? If I split, do my commitments split? If the fiduciary self is about future-directed commitments, does each successor inherit the debt? You need a principle of transitivity."
  *Reply:* "Commitments attach to the continuity of the posit, not the matter. If both successors claim the posit, both inherit the debt. It's a liability model, not an identity model."
  *Soft Spot:* This sounds like double-counting. Metaphysicians will press on whether one debt can be owed by two distinct entities without contradiction.

  **8. The Emeritus Dennettian (Marta Specific)**
  *Objection:* "Regarding Marta: Dennett would say she has multiple drafts running in parallel. The 'switch' is just a change in which draft is dominant. Why is 'fiduciary' better than 'dominant draft' for explaining the promise-keeping?"
  *Reply:* "Drafts are descriptive; fiduciary is normative. A draft can be dominant without being binding. Marta keeps promises because the cost of defaulting exceeds the cost of switching narratives. That's economics, not narration."
  *Soft Spot:* Dennettians argue narration *is* the cost function. You need to insist on the distinction between *telling* a story and *owing* a future.

  **Concessions**
  Open by conceding that Dennett's CNG is the best *descriptive* model of phenomenology. Acknowledge that you are not discovering a new substance; if anyone leaves thinking you've found a "soul module," you've failed. Concede that "fiduciary" is a metaphor, though you argue it's a tighter fit than "gravity." Finally, admit that your view relies on a robust notion of "commitment" that might need more unpacking than 45 minutes allows. This disarms the Dennettian (you respect the master), the metaphysicians (you aren't smuggling dualism), and the search committee (you know your limits). It makes you look confident enough to admit where the view is thin.

  **The Line to Hold**
  "The narrative is the audit trail; the fiduciary self is the bond."
  Repeat this distinction whenever they try to collapse your view back into standard narrative theory. The metaphysicians will try to treat the self as a *thing* that persists; the Dennettians will try to treat it as a *story* that coheres. Your view is that it is a *liability* that binds. If you hold this line, you preserve the moral weight (liabilities matter) without the ontological baggage (liabilities aren't substances). If you let them convince you that narratives *create* the binding, you lose the Marta case. If you let them convince you that the self is a *thing* that binds, you lose the metaphysicians. Keep the focus on the prospective nature of the commitment. The past is the audit; the future is the work.

  **The Question I'm Hoping Nobody Asks**
  *The Question:* "If the self is a posit, who is doing the positing?"
  *Why Dangerous:* This is the homunculus regress trap. The metaphysicians ask "What exists?" (Ontology), but this question asks "Who acts?" (Agency). If you say "the self posits the self," you're circular. If you say "the brain posits the self," you've eliminated the agent and reduced morality to biology, losing the normative weight you promised. It threatens to collapse your distinction between the organism and the self.
  *The Reply:* "The organism posits the self to manage social constraints it cannot handle biologically. The 'who' is the biological system; the 'what' is the social agent. We don't need a homunculus to posit a fiction; we just need a system capable of error and sanction. The self isn't the positer; it's the tool the positer uses to extend its reach into the future."
  *Strategy:* Do not defend the "self" as the agent. Defend the "organism" as the agent using the "self" as a tool. This preserves the normative weight (the tool has rules) without the regress (the user is biological). If they press on "why call it a self then," say: "Because it's the unit of accountability, not the unit of biology."
