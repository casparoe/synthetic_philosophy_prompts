  ## Indistinguishability Flag

  **⚠️ WARNING: Leaf G (Iron Cage) and Leaf H (Specific Fate)**
  Your workshop may struggle to separate these two.
  *   **Theoretically:** Leaf G says *any* disaster would have crushed the humans. Leaf H says *this specific* disaster crushed them in a specific moral way.
  *   **Practically:** In a reading, they feel identical. The characters die either way. The distinction exists only in your authorial intent, not in the text's effect on the reader. If your group argues about this, merge them.

