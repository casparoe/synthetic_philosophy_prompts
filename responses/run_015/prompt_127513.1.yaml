answer: |-
  # The Valley Agency Taxonomy
  ### A Sorting Instrument for the Disaster Trilogy

  **Instructions:** This tree contains **8 Branch Nodes** (questions). Answer them in order. Follow the **Y** (Yes) or **N** (No) path until you reach a **Leaf** (position). There are **9 Leaves**. Each leaf includes a name and a sentence that would embarrass a novelist who held it too strictly. Use the Scoring Key at the end to check your path.

  ---

  ## The Decision Tree

  **NODE 1 (The Counterfactual)**
  *Start here.*
  "If the 1816 volcano hadn't erupted, would the valley's social order survive intact?"
  *   **YES** → Go to Node 2.
  *   **NO** → Go to Node 5.

  **NODE 2 (The Swap Test)**
  "If the 1347 ship brought grain instead of plague, would the characters' moral choices change?"
  *   **YES** → Go to Node 3.
  *   **NO** → Go to Node 4.

  **NODE 3 (The Distribution)**
  "In the blight year, does the landlord export grain while the tenant starves?"
  *   **YES** → **LEAF A**
  *   **NO** → Go to Node 4.

  **NODE 4 (The Ventriloquy)**
  "Do you write sentences where the river 'decides' or the frost 'waits'?"
  *   **YES** → **LEAF B**
  *   **NO** → **LEAF C**

  **NODE 5 (The Answerability)**
  "Can a character stop the cholera by boiling water from the clean well?"
  *   **YES** → Go to Node 6.
  *   **NO** → Go to Node 7.

  **NODE 6 (The Lag Problem)**
  "Is the cause operating on a timescale the characters cannot perceive (e.g., soil depletion)?"
  *   **YES** → **LEAF D**
  *   **NO** → Go to Node 8.

  **NODE 7 (The Symmetry)**
  "Are the bacillus and the bishop the same kind of thing for purposes of the story?"
  *   **YES** → **LEAF E**
  *   **NO** → Go to Node 8.

  **NODE 8 (The Reader's Counterfactual)**
  "Does the book invite you to imagine the valley without the microbe at all?"
  *   **YES** → **LEAF F**
  *   **NO** → **LEAF G**

  *(Note: Nodes 2 and 7 both feed into Node 8 in some paths to ensure we hit 9 leaves. See Scoring Key for exact routing.)*

  ---

  ## The Leaves (Positions)

  **LEAF A: The Unequal Ground (Conjunctural/Vulnerability)**
  *Path: 1Y - 2Y - 3Y*
  The disaster is a trigger, but the damage is determined by how the people were already arranged.
  *   **The Embarrassing Sentence:** "I am not writing about a volcano; I am writing about a landlord, and the eruption is just a convenient excuse to check his accounts."

  **LEAF B: The Willful Earth (Animist/Panpsychist)**
  *Path: 1Y - 2Y - 3N - 4Y*
  The non-human has interiority and intention, distinct from human social structures.
  *   **The Embarrassing Sentence:** "I believe the river holds a grudge, and if I can just find the right verb, I can prove it in court."

  **LEAF C: The Stage Set (Humanist)**
  *Path: 1Y - 2Y - 3N - 4N* OR *1Y - 2N - 4N*
  Non-humans are conditions and occasions; humans are the only true agents.
  *   **The Embarrassing Sentence:** "The plague is merely a backdrop for the real story, which is about whether the baker loves his wife, and the dead bodies are just props."

  **LEAF D: The Silent Killer (Structural Latency)**
  *Path: 1N - 5Y - 6Y*
  The cause is real and deterministic, but operates too slowly for characters to perceive or fight.
  *   **The Embarrassing Sentence:** "My characters are doomed by soil chemistry they can't see, which makes their struggles adorable but irrelevant."

  **LEAF E: The Parliament of Things (Flat Symmetrical/ANT)**
  *Path: 1N - 5N - 7Y*
  Human and non-human actors are ontologically equal; the microbe acts as much as the bishop.
  *   **The Embarrassing Sentence:** "For the purposes of this chapter, the cholera bacterium has as much moral culpability as the mayor, and I have given them equal dialogue."

  **LEAF F: The Contingent Valley (Reader Counterfactual)**
  *Path: 1N - 5Y - 6N - 8Y* OR *1N - 5N - 7N - 8Y*
  The disaster is powerful, but the valley's identity exists independently of it.
  *   **The Embarrassing Sentence:** "I want you to feel the weight of the flood, but I also want you to easily imagine a version of this book where the water stays in its banks."

  **LEAF G: The Iron Cage (Strong Environmental Determinism)**
  *Path: 1N - 5N - 7N - 8N* OR *1N - 5Y - 6N - 8N*
  The disaster is the primary driver; humans are props; the specific nature of the disaster locks the outcome.
  *   **The Embarrassing Sentence:** "I have written three hundred pages of human choice, but the volcano pulled the puppet strings the whole time and I knew it."

  **LEAF H: The Specific Fate (Tragic Particularity)**
  *Path: 1Y - 2N - 4Y*
  The disaster is fate, but the specific type of disaster matters to the moral geometry.
  *   **The Embarrassing Sentence:** "It doesn't matter if they survive, but it matters immensely that they died of frost rather than fire, and I will spend fifty pages explaining why."

  **LEAF I: The Solvable Puzzle (Technocratic Management)**
  *Path: 1N - 5Y - 6N - 8Y (Alternate Route)*
  The disaster is a problem to be managed through knowledge; agency lies in correct procedure.
  *   **The Embarrassing Sentence:** "The emotional climax of this novella is a scene where someone successfully boils water, and I expect you to cry."

