  ## Logical Space Map (Occupied vs. Empty)

  This section explains the theoretical "rooms" in the house of your story. Some are occupied by the Leaves above; some are empty.

  | Causal Primacy | Social Mediation | Non-Human Intention | Status | Leaf Occupant |
  | :--- | :--- | :--- | :--- | :--- |
  | **Low** (Human drives) | **High** (Class matters) | **No** (Force only) | **Occupied** | **A (Unequal Ground)** |
  | **Low** (Human drives) | **Low** (Equal impact) | **Yes** (Willful) | **Occupied** | **B (Willful Earth)** |
  | **Low** (Human drives) | **Low** (Equal impact) | **No** (Force only) | **Occupied** | **C (Stage Set)** |
  | **High** (Nature drives) | **N/A** (Overwhelmed) | **No** (Invisible) | **Occupied** | **D (Silent Killer)** |
  | **High** (Nature drives) | **Low** (Equal impact) | **Yes** (Symmetrical) | **Occupied** | **E (Parliament)** |
  | **High** (Nature drives) | **Low** (Equal impact) | **No** (Force only) | **Occupied** | **G (Iron Cage)** |
  | **High** (Nature drives) | **Low** (Equal impact) | **No** (Specific) | **Occupied** | **H (Specific Fate)** |
  | **High** (Nature drives) | **Low** (Equal impact) | **No** (Solvable) | **Occupied** | **I (Solvable Puzzle)** |
  | **Low** (Human drives) | **High** (Class matters) | **Yes** (Willful) | **EMPTY** | *Incoherent: If humans drive, nature shouldn't have will.* |
  | **High** (Nature drives) | **High** (Class matters) | **Yes** (Willful) | **EMPTY** | *Incoherent: If nature is all-powerful, class shouldn't matter.* |
  | **High** (Nature drives) | **Low** (Equal impact) | **Yes** (Negotiable) | **EMPTY** | *Unattractive: You cannot negotiate with an equal god.* |

  **Why are these empty?**
  1.  **Human Drive + Willful Nature:** If humans are the primary agents (Low Primacy), granting the volcano "will" creates a schizophrenic narrative where two captains steer the ship.
  2.  **Nature Drive + Class Matters:** If Nature is the Strong Determinist driver (High Primacy), social mediation (Class) is logically negated. (Leaf A avoids this by keeping Primacy Low).
  3.  **Nature Drive + Negotiable:** If the Non-Human is an equal/superior agent (Symmetry), "answerability" (negotiation) collapses into worship or war, not management.

