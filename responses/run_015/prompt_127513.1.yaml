  ## Workshop Facilitator Notes

  1.  **Timekeeping:** Spend 10 minutes answering the 8 nodes individually. Spend 40 minutes comparing Leaves. Spend 30 minutes discussing the "Embarrassing Sentences."
  2.  **The "Ventriloquy" Trap:** If everyone lands on **Leaf B (Willful Earth)**, ask them to read their sentences aloud. Usually, people realize they are using metaphors, not ontology.
  3.  **The "Determinism" Trap:** If everyone lands on **Leaf G (Iron Cage)**, ask: "Why are we writing about the humans at all?" This usually forces a move toward **Leaf A (Unequal Ground)**.
  4.  **No Theory:** If someone mentions Braudel, Latour, or Diamond, make them put a coin in the jar. Sort by what happens in the valley, not who they've read.
