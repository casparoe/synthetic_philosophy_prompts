answer: |-
  1. Consider a transboundary watershed where upstream municipalities consistently dump pollutants that destroy downstream drinking water, rendering local negotiations futile due to asymmetric power dynamics. Under strict subsidiarity, the higher authority must intervene because the lower units demonstrably lack the capacity to achieve the objective of clean water independently.

  2. This interpretation argues that proximity is meaningless if local decisions actively harm citizens in neighboring jurisdictions who lack representation in those local processes. Therefore, moving authority upward protects the effective proximity of all affected citizens to the decision-making power.

  3. Comparative efficiency dictates that if fragmented local regulation creates higher transaction costs and failed outcomes than a unified standard, the function naturally belongs to the central level. The central authority is deemed more efficient here not by inherent superiority, but because the scale of the problem exceeds the scale of local solutions.

  4. Democratic accountability requires that those affected by a decision must have a voice in making it, which is impossible when local veto players block solutions for downstream constituents. Centralization restores accountability by creating a single forum where all stakeholders across the watershed are equally represented.

  5. The structural feature producing this centralist verdict is the presence of negative externalities that local units cannot internalize through voluntary cooperation. A localist advocate could attack this by arguing for empowered inter-local compacts with binding arbitration rather than top-down regulation, thereby solving the coordination failure while retaining authority at the lowest feasible governance level.
