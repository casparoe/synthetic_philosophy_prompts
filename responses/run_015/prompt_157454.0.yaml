prompt: |-
  I'm leading one ninety-minute discussion for a reading group of eight people with no formal philosophy training—mostly lawyers, scientists, and writers—on whether maximal moral goodness is actually desirable. I do not want you to explain the thesis to me; I want a teaching plan for the session: the exact sequence in which the conceptual pieces must be introduced and why each depends on the previous one, with the dependency structure made explicit; the single carrying example or biographical sketch that should anchor the entire discussion, together with a precise statement of what features it must possess and what it must lack, and—if the familiar “joyless saint” profile occurs to you—an explicit reason for setting it aside and a substitute that works better for this framing; a map of the misconceptions the group will predictably form, including my expectation that they will conflate moral saturation with extreme conscientiousness and will assume that moral permeability amounts to treating morality as optional, with the exact point in the sequence at which each misconception should be intercepted and the specific move that heads it off; one concluding question that reveals whether participants have actually grasped the saturation-permeability distinction rather than just memorized the labels; and a clear statement of which part of the academic debate—almost certainly the formal literature on supererogation and moral demandingness—should be deliberately omitted at this level and acknowledged as left out. Frame the session around the distinction I am drawing between moral saturation, in which moral reasons come to dominate every domain of life, and moral permeability, in which moral reasons structure but do not monopolize non-moral goods, rather than treating Susan Wolf’s classic account as the sole axis of the discussion. Give me a committed plan with definite choices and explicit justifications, not a menu of options for me to select from; write it in continuous prose without headings, bullet points, bold text, tables, or lists, as one would write a single letter or email.
