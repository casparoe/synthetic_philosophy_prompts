answer: |-
  Here is a menu of the four distinct arguments hiding inside your roommate's slogan, evaluated for validity and applicability to your hallway light.

  ### 1. The Trivial Logical Version (Contradiction in Terms)
  *   **The Argument:** If everyone performed action $X$, action $X$ would become logically impossible or meaningless. (e.g., "If everyone lied, no one would believe anyone, so lying would be impossible.")
  *   **Status:** **False/Platitude.** This only works for self-defeating acts like lying or promising. It does not work for physical actions like consuming resources.
  *   **Application to Light:** If everyone left lights on, leaving lights on would still be physically possible. The lightbulb does not cease to function because someone else is using electricity.
  *   **Aggregation Assumption:** None. This is about logic, not sums.

  ### 2. The Actual Kantian Version (Categorical Imperative)
  *   **The Argument:** Can you rationally *will* your maxim ("I will leave lights on to save effort") to become a universal law of nature without contradicting your own rational will? This is not about bad outcomes, but about consistency.
  *   **Status:** **Defensible (but nuanced).** Kant argues we have a duty to preserve our means (resources) as rational agents. Wasting resources universally might contradict a rational will that necessarily wills the existence of means to ends.
  *   **Application to Light:** Weak. Kant focuses on duties to self and others. Unless leaving the light on violates a specific duty (e.g., you are stealing electricity), Kant might not forbid a trivial waste unless it reflects a maxim of reckless disregard for resources generally.
  *   **Aggregation Assumption:** **None.** Kantianism is non-consequentialist. It doesn't matter if the total harm is zero; it matters if the *principle* is corrupt.

  ### 3. The Empirical "Everything Breaks" Version (Act Consequentialism via Generalization)
  *   **The Argument:** If everyone did this, the total sum of harm would be catastrophic (grid failure, climate collapse). Therefore, your individual act contributes to that catastrophe.
  *   **Status:** **False (due to Fallacy of Composition).** This assumes your individual act makes a measurable difference to the catastrophic outcome.
  *   **Application to Light:** **False.** One light on in an empty building does not tip the grid into failure. The harm is not caused by *your* act, but by the *collective* act.
  *   **Aggregation Assumption:** **Hidden Linear Aggregation.** This argument assumes harm scales linearly (1 unit of waste $\times$ 8 billion people = Catastrophe). It ignores **threshold effects**. If the grid fails at 100GW and we are at 99GW, your light matters. If we are at 50GW, your light is causally inert regarding the collapse.

  ### 4. The Rule-Utilitarian Gloss (The Best General Rule)
  *   **The Argument:** We should not ask "Does *this* act cause harm?" but "Would a *rule* prohibiting this act produce the best outcomes if generally adopted?" Even if your specific act is harmless, following the optimal rule prevents coordination failures.
  *   **Status:** **Defensible.** This is the strongest version of your roommate's point. It justifies the rule based on the utility of general compliance, not the utility of the single act.
  *   **Application to Light:** **Defensible.** A social norm of "turn off lights" saves massive energy overall. Allowing exceptions for "harmless" cases creates loopholes that degrade the norm.
  *   **Aggregation Assumption:** **Avoids the Trap.** It doesn't claim your single light causes harm; it claims that *adopting the rule* "ignore waste when harmless" leads to worse aggregate outcomes than "always turn off lights."

  ***

  ### ⚠️ The Aggregation & Threshold Flag
  You specifically asked to flag the **linear-aggregation assumption**. Arguments #3 (Empirical) relies on the idea that your single drop adds linearly to the flood. This is often false in complex systems (grids, ecosystems) which operate on **thresholds**.
  *   **Linear View:** My waste = 1/N of the total damage.
  *   **Threshold View:** My waste = 0 damage until the exact moment the system breaks, at which point my waste = 100% of the cause of the break (if I was the tipping point).
  *   **Reality:** In the case of a hallway light, you are almost certainly nowhere near the threshold. Therefore, Argument #3 is empirically weak. Argument #4 (Rule-Utilitarianism) bypasses this by focusing on maintaining the *norm* rather than calculating the *physics* of your specific bulb.

  \answer{Rule-Utilitarianism}

  Verdict: Your roommate is likely mislabeling a Rule-Utilitarian argument about maintaining social norms as Kantianism, while mistakenly relying on a linear-aggregation assumption that ignores threshold effects.
