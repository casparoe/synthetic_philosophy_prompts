      *   *Self-Correction on Q1:* Make sure to define "credit" carefully. In 1735, credit implies trust but also the *capacity* to command labor. It's the bridge between industry and money.
      *   *Self-Correction on Q4:* Be careful not to conflate Berkeley's philosophical immaterialism too heavily with his economics, but acknowledge the user's specific question about it. The key is that the *token* must exist as an idea, even if the *value* doesn't reside in its matter.
      *   *Self-Correction on Q5:* Ensure I evaluate the user's distinction explicitly at the end.

  6.  **Final Polish:** Check the flow between the reconstruction of the argument and the specific answers. Ensure the "substantive/notational" language is woven through the answers. (e.g., "This moves from a substantive view to a notational view...")

