          *   *Drafting:* Distinguish between "material composition" (bullion) and "perceivable token" (paper/notation). Immaterialism requires a perceivable idea (the ticket), but not a valuable substance (the gold). The user's worry about "wholly notational... without perceivable token" is resolved: the notation *is* the perceivable idea.

      *   **Q5 (Reductive Definition vs. Practical Claim):**
