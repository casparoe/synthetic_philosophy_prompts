answer: |-
  Here is a reconstruction of the argument in Queries 21–26, followed by answers to your specific questions, utilizing your substantive/notational distinction.

  ### Reconstruction of the Argument (Queries 21–26)

  The passage moves from a macroeconomic observation to a metaphysical definition of money, concluding with a thought experiment that validates the definition.

  1.  **The Source of Wealth (Q21–22):** Berkeley establishes that national wealth depends on industry, and industry depends on the *circulation of credit*. Crucially, he decouples this circulation from the specific material used ("marks or tokens soever"). He introduces the velocity of circulation as a compensatory factor: a smaller quantity of tokens moving quickly can do the work of a larger quantity moving slowly.
  2.  **The Definition of Money (Q23):** He asks what money *is*. He contrasts traditional "substantive" views (intrinsic value, commodity) with his own "notational" view (ticket or counter). The use of "altogether" suggests an exclusive identification with the notational role.
  3.  **The Theory of Value (Q24–25):** He defines value/price as a ratio (demand vs. plenty). Currency names (pound, livre) are merely "exponents" (signs) of this ratio. Consequently, the physical medium (gold, silver, paper) is secondary; they are all merely tools for "reckoning, recording, and transferring" these ratios.
  4.  **The Validation (Q26):** He proposes a counterfactual: if the bullion disappears but the denominations (the notation) remain, does the economy function? The implied affirmative answer confirms that the substance is inessential to the function.

  ---

  ### Responses to Specific Questions

  #### (1) Credit in Queries 21–22 and its Relation to Query 23
  In Queries 21 and 22, **credit** functions as the social claim on future industry that allows present labor to be mobilized. It is not merely an accounting entry, nor is it simply "trust" in a psychological sense; it is the *transferable claim* on the wealth produced by industry. When Berkeley writes that credit may be transferred by "what marks or tokens soever," he is asserting that the *mechanism of transfer* is distinct from the *value transferred*.

  This prepares the way for Query 23 directly. If the transfer of credit (the economic reality) can be effected by any token, then the specific nature of the token is irrelevant to the economic function. Query 23 then makes the ontological move: if the token's material is irrelevant to the function, then the "true idea of money" cannot be the material (substantive account) but must be the function itself (notational account).
  *   **Textual Support:** "be the credit circulated or transferred by what marks or tokens soever" (Q21).
  *   **Extrapolation:** Interpreting "credit" here as a claim on labor rather than just bank ledgers relies on the context of Q21 linking wealth to industry.

  #### (2) Query 23 and the Word "Altogether"
  In Query 23, Berkeley is rejecting the *substantive grounding* of the list (intrinsic value, commodity, standard, measure, pledge), not necessarily the functional utility of the terms themselves. He is arguing that money is not a commodity *that happens* to measure; it is a ticket *used as* a measure.

  The word **altogether** is the pivot point for your notational account. It signals an exclusive definition. He is asking if the *essence* ("true idea... as such") is *exhaustively* captured by "ticket or counter."
  *   **Substantive vs. Notational:** If money were a commodity (substantive), it would have value independent of its use as a ticket. By asking if it is *altogether* a ticket, Berkeley suggests it has no value outside the notational practice of reckoning and transferring.
  *   **Textual Support:** "whether the true idea of money, as such, be not altogether that of a ticket or counter?"
  *   **Extrapolation:** Reading "altogether" as excluding intrinsic value as a necessary condition. One could argue he allows money to *have* intrinsic value (as a commodity) but denies that this is what makes it *money*. However, "altogether" strongly suggests the notational role is sufficient and defining.

  #### (3) Query 25: "Exponents" and the Equality of Metal and Paper
  Given Berkeley's background as a mathematician (and critic of the foundations of calculus), **exponent** should be read in a quasi-mathematical sense, though not necessarily as a "power" in the algebraic sense. It is best read as an **index or sign representing a ratio**. In Q24, value is a "compounded proportion." In Q25, the "crown" or "pound" is the symbol (exponent) that denotes a specific place within that proportion.

  This bears directly on the claim that gold, silver, and paper are equally tickets. If money is an exponent of a ratio (demand/plenty), then the physical substrate is irrelevant to the mathematical function. Whether the exponent is written in ink (paper) or stamped on gold (coin), it performs the same notational operation: "reckoning, recording, and transferring" the proportion.
  *   **Textual Support:** "exponents or denominations of such proportion" (Q25); "gold, silver, and paper are not tickets or counters for reckoning... thereof" (Q25).
  *   **Extrapolation:** Applying Berkeley's mathematical usage of "exponent" to his economic theory. While plausible given his authorship, the text itself defines it loosely as "denominations."

  #### (4) Query 26, Bullion, and Immaterialism
  Query 26 asks if commerce can continue if "denominations being retained, although the bullion were gone." This establishes that the **material composition** (bullion) is eliminable in principle, but it does not establish that the **perceivable token** is eliminable.

  Regarding your question on immaterialism: Berkeley's metaphysics (*esse est percipi*) requires that objects exist as ideas perceived by minds. A "wholly notational money without any perceivable token" would indeed be unintelligible to him, because a notation *is* a perceivable idea (a sound, a mark on paper, a digital entry). Query 26 does not argue for invisible money; it argues for money where the *value* is not located in the *matter* of the token. The "denominations" must be retained—meaning the signs (ideas) must exist—even if the gold (the specific substance) does not.
  *   **Textual Support:** "Whether the denominations being retained... things might not nevertheless be rated..." (Q26).
  *   **Extrapolation:** Connecting Q26 to Berkeley's immaterialism. The text does not explicitly mention metaphysics, but your concern is whether "notational" implies "immaterial" in a way that violates Berkeley's system. It does not, provided the notation is a perceivable sign.

  #### (5) Reductive Definition vs. Practical Claim
  The passage amounts to **both**, but the practical claim supports the reductive definition.
  *   **Practical:** Q26 is framed as a practical possibility ("might not nevertheless be... maintained").
  *   **Reductive:** Q23 is framed as an ontological inquiry ("Whether the true idea... be not").

  Berkeley uses the practical sufficiency of paper/denominations (Q26) to justify the reductive definition of money as a ticket (Q23). If the system works without the substance, the substance is not part of the "true idea."
  *   **Textual Support:** The shift from "Whether... be not" (Q23) to "Whether... might not" (Q26).
  *   **Extrapolation:** Inferring that Berkeley intends Q26 to serve as proof for Q23. It is possible he sees them as separate points, but the logical flow suggests the latter validates the former.

  ### Evaluation of Your Distinction

  Does your **substantive/notational** distinction distort or clarify?

  **It clarifies significantly,** provided you add one caveat.
  1.  **Clarification:** Your distinction perfectly maps onto Berkeley's move from "intrinsic value/commodity" (substantive) to "ticket/counter/exponent" (notational). It helps avoid the anachronism of reading Berkeley as a modern fiat currency theorist who ignores the social basis of value.
  2.  **Caveat:** Ensure your "notational" account does not sound *too* abstract or conventionalist. For Berkeley, the notation is not arbitrary; it is anchored in **industry** and **credit** (Q21). The "ticket" has no power without the "industry" it commands. A purely notational account might suggest money is *only* symbols; Berkeley's account is that money is symbols *backed by the capacity for labor*.
      *   *Refinement:* You might characterize Berkeley's view as a **notational account grounded in social power (industry)** rather than a purely formal notational account. The token is notational, but what it denotes (credit/industry) is the real economic substance.

  **Summary for Lecture:** You can safely use your distinction to show that Berkeley is attacking the "substantive" view (money = metal) to replace it with a "notational" view (money = ticket), but you must emphasize that for Berkeley, the "notation" is a claim on *industry*, not just an abstract number. This prevents the anachronism of treating him as a pure quantity theorist or a modern fiat theorist detached from real production.
