          *   *Analysis:* Q23 looks metaphysical/definitional ("true idea"). Q26 looks practical ("might not nevertheless"). However, Q26 supports Q23. If it works without bullion, bullion isn't essential.
          *   *Drafting:* It's both. It's a practical claim used to support a theoretical redefinition. The "true idea" language suggests he thinks he's found the essence, not just a workaround.
          *   *User's Distinction:* Does it distort? It clarifies the shift Berkeley is making. However, Berkeley might see "notational" as still grounded in "credit" (trust/industry), which is a social reality, not just abstract math. The distinction is good but ensure "notational" doesn't sound *too* abstract/empty. It's grounded in industry.

  5.  **Review and Refine:**
