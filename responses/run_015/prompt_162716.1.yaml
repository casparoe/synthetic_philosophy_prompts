          *   *Analysis:* Credit here isn't just accounting; it's the *medium* of industry. It's the social trust/claim that allows labor to move. The "marks or tokens" phrase is crucial. It suggests the *form* doesn't matter, only the *function* (circulation).
          *   *Relation to 23:* It prepares the way. If credit (the underlying economic reality) can use *any* token, then money (the token) is defined by its role, not its substance. Q23 makes the ontological claim about the token itself.
