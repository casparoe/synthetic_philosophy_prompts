      *   So, if you hold (1) [P(H)=1/2], you *must* reject (2) [P(Mon)=1/2]. P(Mon) must be 3/4.
      *   If you hold (2) [P(Mon)=1/2], you *must* reject (1). P(H) must be 1/3 (Thirder).
