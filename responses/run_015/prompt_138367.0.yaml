answer: |-
  This is an excellent prompt. You have correctly identified the single most common point of failure in secondary literature on Rand: the conflation of *selfishness* (acting for one's own rational values) with *solipsism* or *predation* (acting without regard for others). Your intuition about the "structure of moral justification" versus "behavioral prescription" is precisely the distinction professional Objectivist scholars (like Tara Smith, Allan Gotthelf, and Neera Badhwar) insist upon.

  Here is an audit of the paragraph, followed by an evaluation of your reconstruction and its implications for your chapter.

  ### Part 1: Sentence-by-Sentence Audit

  **1. "Rand borrowed the word from Comte and defined altruism as the doctrine that the individual exists for the sake of others and that self-sacrifice is the highest virtue."**
  *   **Verdict:** **Accurate.**
  *   **Scholarly Note:** Rand explicitly credits Comte in *The Virtue of Selfishness*. Her definition is stipulative but consistent: she defines altruism not as "kindness" but as the ethical requirement of self-sacrifice (giving up a greater value for a lesser one or for a non-value). A sympathetic scholar accepts this as her starting axiom.

  **2. "Her central argument is that the doctrine self-destructs: if the moral purpose of every life is to serve other lives, then no one's life is an end in itself, so there's nothing left for morality to be *for*..."**
  *   **Verdict:** **Accurate.**
  *   **Scholarly Note:** This is the "no one to live for" argument found in the essay "The Objectivist Ethics." If A exists for B, and B exists for C, and C exists for A, there is no *ultimate* beneficiary. Rand argues morality requires an ultimate end (one's own life). Scholars accept this as her core meta-ethical move.

  **3. "...rational egoism is the only coherent ethics, which on the chapter's telling means you should never act for the sake of another person, only for your own rational self-interest..."**
  *   **Verdict:** **Straightforwardly Wrong (The Hinge Error).**
  *   **Scholarly Note:** This is the error you spotted. Rand explicitly argues that you *can* and *should* act for the sake of others (friends, lovers, children) provided they are *your values*. In "The Objectivist Ethics," she writes that a man who loves his wife is not sacrificing for her; her happiness is *his* selfish goal. The distinction is not *who* benefits physically, but *whose judgment of value* initiated the action. If I help you because *I* value you, it is selfish. If I help you because *duty* demands I ignore my own judgment, it is altruistic. The summary's "never" turns her ethical egoism into psychological solipsism.

  **4. "...helping people is at best long-term self-investment, something you do because their goodwill or their company is worth something to you, never because they need it."**
  *   **Verdict:** **Wince-Worthy Simplification.**
  *   **Scholarly Note:** "Investment" implies a transactional quid-pro-quo that Rand often rejects in personal relationships. She argues for *value-for-value* in trade, but in love/friendship, the "value" is the person's existence/consciousness itself. Helping because "they need it" is only wrong if "need" is the *sole* justification (i.e., duty). If "they need it" and "I value them," helping is moral. The summary misses the *constitutive* nature of values in her system.

  **5. "Charity is accordingly never a duty, just a luxury you can indulge when it pays."**
  *   **Verdict:** **Mostly Accurate (with caveats).**
  *   **Scholarly Note:** Rand absolutely rejects charity as a *duty*. She calls it a "minor virtue." The phrase "when it pays" is crude; she would say "when it is consistent with your hierarchy of values." If giving $10 to a beggar means you can't buy a book you value more, it is immoral (a sacrifice). If you have surplus and the act brings you satisfaction (affirming your benevolence), it is permissible. The summary captures the anti-duty stance but misses the value-hierarchy nuance.

  **6. "...any altruistic act is a species of parasitism — the giver parasites off the recipient's need, the recipient parasites off the giver's guilt."**
  *   **Verdict:** **Nuanced/Context-Dependent.**
  *   **Scholarly Note:** Rand argues that *altruism as a system* creates a society of parasites. She does not necessarily claim every single charitable act is parasitic, but that under altruistic ethics, the relationship is corrupted. The giver seeks moral status (guilt-relief); the recipient claims unearned entitlement. A sympathetic scholar would accept this as her *sociological* critique of altruism, even if the phrasing "any altruistic act" is too sweeping.

  **7. "...her target was really any ethics that asks you to be impartial, so the critique lands just as hard on Kant and the utilitarians as on Christianity..."**
  *   **Verdict:** **Accurate.**
  *   **Scholarly Note:** Rand groups Kant, Utilitarians, and Christians together under "altruism" because they all subordinate the individual's life to an external standard (Duty, The Greatest Good, God). She explicitly attacks Kantian duty and Utilitarian calculus as forms of self-sacrifice.

  **8. "...in this she was basically finishing Nietzsche's attack on slave morality, a thinker she admired her whole life."**
  *   **Verdict:** **Straightforwardly Wrong.**
  *   **Scholarly Note:** This is a common pop-intellectual-history trope. Rand admired Nietzsche's *cultural* impact and his rejection of altruism early in her life (notebooks from the 1930s show this). However, by the time she published her mature philosophy (1950s-60s), she explicitly rejected Nietzsche as a "mystic" who grounded values in irrational will rather than reason. She did not see herself as "finishing" his project; she saw herself as correcting his epistemology while keeping his anti-altruistic stance. Saying she admired him "her whole life" ignores her mature repudiation of his irrationalism.

  ---

  ### Part 2: Evaluating Your Reconstruction

  You proposed: *Her real target is a thesis about who the beneficiary of an action has to be for the action to be moral... justification has to terminate in the agent's own life as the ultimate end and can't terminate in someone else's need.*

  **1. Does this reconstruction hold up?**
  **Yes.** This is the standard, charitable scholarly reading. In *The Virtue of Selfishness*, Rand distinguishes between **Sacrifice** (giving up a greater value for a lesser one) and **Service** (trading value for value, or acting for values you hold).
  *   **The Beneficiary Criterion:** For Rand, the *beneficiary* of the action must be the agent, but the *object* of the action can be anyone.
  *   **Example:** If I spend money to save my spouse's life, the *object* is the spouse, but the *beneficiary* is me, because my spouse's life is a value *to me*. If I spend money to save a stranger because "society says I must," the *beneficiary* is society/duty, and I am the sacrificial animal.
  *   Your reconstruction captures the **meta-ethical** nature of her claim. It is not a rule of conduct ("don't help"); it is a rule of justification ("why are you helping?").

  **2. Does it make the critique trivial?**
  **No, it makes it more radical.**
  If the critique were merely "don't be a doormat," it would be trivial. But by claiming that *moral justification must terminate in the agent's life*, she rules out **duty** entirely.
  *   It renders Kantianism impossible (you cannot act from Duty, only from Self-Interest).
  *   It renders Utilitarianism impossible (you cannot maximize the general good if it conflicts with your rational self-interest).
  *   It transforms "helping others" from a moral obligation into a **preference**. This is a massive structural claim about commercial society: it suggests that social cohesion cannot rely on moralized obligation, only on aligned self-interest. That is a profound, non-trivial claim for a political theory chapter.

  **3. Does it reach impartialist views (Utilitarianism) that don't demand self-sacrifice?**
  **Yes.**
  Even "soft" Utilitarianism demands **impartiality**. It demands that your own happiness counts for no more than anyone else's in the calculus. Rand argues this *is* self-sacrifice because it demands you subordinate your own judgment and life to an aggregate.
  *   If the Utilitarian says, "You should help the stranger because it maximizes utility," Rand says, "Unless that stranger is a value *to you*, this demand is a sacrifice of your judgment to the collective."
  *   Therefore, your reconstruction successfully captures why she attacks impartialist views even if they don't demand total martyrdom. The *subordination* of the self to the calculus is the sacrifice.

  ---

  ### Part 3: Does the Chapter's Picture Survive Correction?

  **Yes, and it becomes stronger.**

  The popular summary presents Rand as a cartoon villain preaching "greed is good and never help anyone." If you use that version in your chapter, a knowledgeable reader will dismiss your analysis of commercial society defenses.

  However, if you use your **Beneficiary/Justification reconstruction**, the chapter gains significant analytical power:
  1.  **Moralizing Self-Interest:** You can show that defenses of commercial society often try to have it both ways: they want the efficiency of self-interest but the moral cover of altruism (e.g., "profit is good *because* it helps the poor").
  2.  **Rand's Intervention:** Rand forces a choice: Either self-interest is moral *in itself* (beneficiary is the agent), or it is immoral (beneficiary is others). She argues that trying to justify commerce via altruism (it helps others) surrenders the moral high ground to the critics of capitalism.
  3.  **The "Parasitism" Claim:** Corrected, this isn't about beggars. It's about the **moral relationship** in commercial society. If I buy your product because I value it, it's trade. If I buy your product because I feel guilty about your poverty, Rand argues I have turned an economic act into a moral sacrifice, corrupting the market.

  **Conclusion for your Chapter:**
  The errors in the summary *do* matter, but not because they invalidate Rand's relevance. They matter because the "cartoon" version makes her easy to dismiss. The "structural" version (your reconstruction) makes her a serious challenger to the **Kantian/Utilitarian consensus** in political theory.

  For a PhD chapter, you should explicitly correct the record:
  *   Cite *The Virtue of Selfishness*, specifically the essay "The Objectivist Ethics" and "The Ethics of Emergencies."
  *   Use the **Sacrifice vs. Service** distinction.
  *   Frame her critique not as "anti-social behavior" but as "anti-impartialist justification."

  **Scholarly Consensus on "Sacrifice":**
  If you need a settled definition to anchor your text: Rand defines sacrifice as **"the surrender of a greater value for the sake of a lesser one or of a non-value."** (This is from *The Virtue of Selfishness*, p. 49).
  *   If I give up my career (greater value) to care for a stranger I don't value (lesser/non-value) because of duty, that is sacrifice.
  *   If I give up a movie (lesser value) to help my friend (greater value), that is *not* sacrifice; it is rational trade-off in service of my values.

  This distinction allows her to say "never sacrifice" without saying "never help." Using this technical definition will signal to your readers that you have moved beyond the pop-intellectual-history summary.
