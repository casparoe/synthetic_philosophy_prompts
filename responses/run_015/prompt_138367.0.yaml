      *   *Does it make the critique trivial?* No, it makes it structural. It attacks the *grounding* of morality, not the *content* of specific actions.
      *   *Does it hit impartialist views?* Yes. Utilitarianism demands impartiality, which Rand sees as demanding sacrifice of the self to the collective. Even if Utilitarianism doesn't demand *total* self-sacrifice, it demands subordinating the self to the general welfare, which violates the "life as an end in itself" axiom.

