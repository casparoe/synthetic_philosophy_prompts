      *   *Claim 5: Charity is never a duty, just a luxury... when it pays.*
          *   **Verdict:** Mostly Accurate. Rand rejects duty-based charity. The "when it pays" phrasing is crude but captures the "value-for-value" exchange idea, though "pays" implies material gain rather than emotional/moral satisfaction.
      *   *Claim 6: Altruism and capitalism are incompatible... altruistic act is a species of parasitism (giver parasites off guilt, recipient off need).*
          *   **Verdict:** Nuanced. Rand does call altruism parasitic in a systemic sense. The specific phrasing about the *act* being parasitic is a bit strong but aligns with her view that unearned love/guilt-based giving corrupts both.
      *   *Claim 7: Target was any ethics that asks you to be impartial... lands on Kant and Utilitarians.*
