prompt: |-
  Hi — I chair the language standards group at a mid-sized nonprofit newsroom (~60 journalists, plus a comment section we still, foolishly, moderate ourselves). We recieve somewhere between twenty and forty requests a week from reporters and producers about slurs: do we print the word, bleep it on audio, write the initialism, use a euphemism like "the N-word", describe the act in other words, or reproduce it because it's in a document, lyric, or post we're quoting. Right now it's whichever duty editor is on, deciding in under ten minutes with no training in any of this, then having to defend the call to readers and to our own staff, and the answers are wildly inconsistent.

  What I need is a decision procedure, not an essay. Something the duty editor can actually walk through at speed: the questions in order, what counts as a good enough answer to each one, the point where the answer is just "no, don't" and we stop, and the point where it gets handed up to me or to the standards group because what's left is a question about what we care about, not about what the word does. Please use whatever the semantics/pragmatics side of this actually distinguishes — I don't want a reading list or citations, I want the distinctions themselves: what a slur contributes to what's said versus what it does to the people hearing it, whether the derogatory bit is part of the meaning or a side-effect of the use, what changes when the word is quoted or reported or mentioned rather than used, whether "who is speaking" and "who is listening" matter differently.

  The cases our current policy handles badly, and that the procedure has to handle: in-group or reclaimed use that we're quoting from a source; a commenter who never types the word but writes something that only does its work if the reader supplies it (initialisms, "you know which one", emoji, leetspeak); a term being reclaimed by one group while outsiders still use it as a slur against a different group; historical documents, song titles, and place names; and cases where the target group has essentially no one in the conversation.

  Then run it on three: a producer who wants to quote a council member's voicemail verbatim in a story about that council member; a music review quoting a lyric in which the artist uses a slur for their own group; and our blanket house rule of always substituting the initialism, always, in every context — including in a piece we're planning on reclamation. I suspect that last one does not survive the procedure, but if it does survive, say that too. Also: say plainly where the procedure misfires and what it can't settle, since whatever we adopt has to be explainable in one sentence to a reader who's angry about it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Chair of language standards group at a mid-sized nonprofit newsroom (~60 journalists + moderated comments).
      *   **Problem:** Inconsistent decisions on slurs (print, bleep, initialism, euphemism, quote, etc.). Duty editors decide under pressure with no training.
      *   **Goal:** A *decision procedure* (flowchart-style logic), not an essay. Needs to be fast, actionable, and grounded in semantics/pragmatics distinctions (use vs. mention, derogatory content vs. effect, speaker/hearer dynamics).
      *   **Specific Edge Cases to Handle:** Reclaimed/in-group use, dog whistles (initialisms/emoji), conflicting reclamation (Group A reclaims, Group B slurs), historical/cultural artifacts (docs, songs), absent target groups.
      *   **Test Cases:**
          1.  Council member's voicemail (verbatim quote).
          2.  Music review quoting lyric (artist using slur for own group).
          3.  Blanket house rule (always initialism, even in reclamation contexts).
      *   **Requirement:** Identify where the procedure misfires/can't settle (the "values" questions) and provide a one-sentence explanation for angry readers.

  2.  **Deconstruct the Semantics/Pragmatics:**
      *   *Use vs. Mention:* Using a word to refer to the thing vs. talking about the word itself. Quoting is usually "mention" or "direct report," but the *effect* on the reader can feel like "use."
      *   *Truth-Conditional Content vs. Expressive Content:* Slurs often carry the same truth conditions as neutral counterparts (e.g., [Slur] vs. "Person from Group X") but add expressive/attitudinal content (contempt, hierarchy).
      *   *Appropriation/Reclamation:* When the target group uses the term, the expressive content changes (from contempt to solidarity/reclaiming power).
      *   *Dog Whistles:* Implicit meaning that relies on the reader to supply the slur. Often more harmful because it creates plausible deniability while signaling hostility.
      *   *Harm Principle:* The core ethical constraint. Does publishing this cause undue harm to the targeted group or the audience?

  3.  **Drafting the Decision Procedure (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* Is it a slur? Yes. Is it a quote? Yes. Print it. No? Don't. Wait, too simple. What about reclamation? What about dog whistles?
      *   *Attempt 2 (Adding Nuance):* Check if it's a dog whistle. If yes, spell it out or kill it. Check if it's reclaimed. If yes, maybe print. Check if it's a historical doc.
      *   *Attempt 3 (Structuring for Speed):* Needs to be a step-by-step filter. Start with the highest stakes (Harm/Dog whistles), move to context (Quote vs. Narrative), then to specific exceptions (Reclamation/Art).
      *   *Refining the Semantics:* Need to distinguish between *reporting that the word was used* (safe) vs. *reproducing the word* (risky). Need to distinguish *expressive content* (the hate) from *referential content* (the group).

      *   *Key Distinction:* **Operational Harm vs. Informational Necessity.**
      *   *Key Distinction:* **Use (endorsing/performing) vs. Mention (reporting/displaying).**

  4.  **Developing the Steps (The "Algorithm"):**

      *   **Step 1: The Dog Whistle Check.** (Pragmatics: Implicature). If the text *requires* the reader to imagine the slur to get the hate, you must either print the slur (to expose the hate) or kill the quote entirely. You cannot print the cipher.
      *   **Step 2: The Narrative Necessity Check.** (Semantics: Truth Conditions). Is the *fact* that the word was used the story? If yes, report *that* it was used. Do not print the word unless Step 3 passes.
      *   **Step 3: The Verbatim Evidence Check.** (Pragmatics: Evidence). Is this audio/video/document where the *exact sound/text* is evidence of a crime, misconduct, or specific intent? If yes, proceed to Step 4. If no (e.g., casual conversation), describe instead of quoting.
      *   **Step 4: The Reclamation/In-Group Check.** (Semantics: Expressive Content). Is the speaker a member of the targeted group using it in a reclaimed/in-group context? If yes, printing is generally permissible (respect agency). If no, proceed to Step 5.
      *   **Step 5: The Harm/Benefit Weigh.** (Ethics). Does printing the word provide essential context that describing it ("the N-word") obscures? (e.g., specific threat level). If the harm of spreading the slur outweighs the journalistic value, redact/bleep.

  5.  **Addressing the Test Cases:**

      *   *Council Voicemail:* Step 3 (Evidence). It's verbatim evidence of misconduct. Step 4 (Out-group). Step 5 (Harm). Verdict: Likely print with warning, or bleep depending on severity, but *do not* euphemize if the audio is the evidence. Actually, for audio, bleeping is standard unless the *tone* of the slur is the evidence. Let's refine: If the *word itself* is the news, report it. If the *audio* is the evidence, bleep to minimize harm unless the specific phonetics are evidence (rare). *Correction:* The prompt asks about printing/quoting. If it's a transcript of a voicemail used as evidence of harassment: Print the word? No, usually "the N-word" suffices *unless* the legal case hinges on the specific utterance. Let's lean towards: Report the use, redact the word unless it's a public record document where redaction alters the legal meaning.
      *   *Music Review:* Step 4 (In-Group/Art). Artist using for own group. Step 2 (Context). It's a review of the art. Verdict: Print. The art *is* the subject.
      *   *Blanket Initialism Rule:* Step 1 (Dog Whistle). Blanket initialism *creates* dog whistles in comments. Step 4 (Reclamation). Blanket rule blocks reclamation reporting. Verdict: Fails.

  6.  **Refining the "Misfire" Points:**
      *   Where does logic end and values begin? When "Harm" is subjective. When "Newsworthiness" is subjective. The procedure can't decide *if* the story runs, only *how* the word appears.
      *   The "One Sentence" explanation needs to be robust.

  7.  **Finalizing the Procedure Structure:**
      *   Use bold headers.
      *   Use Yes/No logic.
      *   Include the "Stop" points.
      *   Include the "Escalate" points.

  8.  **Self-Correction/Review against Constraints:**
      *   *Constraint:* "Not an essay." -> Keep intro/outro minimal.
      *   *Constraint:* "Semantics/pragmatics distinctions." -> Explicitly label Use/Mention, Expressive Content, Implicature.
      *   *Constraint:* "Speed." -> Keep steps under 10.
      *   *Constraint:* "Test Cases." -> Run them explicitly.
      *   *Constraint:* "Misfire." -> Be honest about limitations.

      *(Self-Correction on the Voicemail Case)*: If a council member leaves a racist voicemail, the *fact* they used the slur is the news. Printing the slur in the transcript might be necessary for legal transparency, but bleeping in audio is standard. The prompt asks about "printing the word." If it's a transcript accompanying the audio: If the audio is bleeped, the transcript should match (e.g., [expletive]). If the audio is played raw (rare), transcript matches. *Decision:* For the procedure, the key is: Is the *specific phonetic utterance* evidence? Usually no, the *usage* is the evidence. So "the N-word" is usually sufficient. But if it's a legal document filed in court, we quote the document. I need to make sure the procedure distinguishes between *reporting speech* and *reproducing evidence*.

      *(Refining the Dog Whistle)*: This is crucial. If a commenter writes "I hate the [blank]," publishing that is publishing hate without the accountability of the word. The procedure must say: Do not publish the cipher. Either publish the word (to expose) or kill the comment. Given it's a newsroom comment section, killing the comment is safer.

      *(Refining Reclamation)*: If a story is *about* reclamation, printing the word is necessary to discuss the reclamation. A blanket ban prevents this story.

  9.  **Drafting the Content:** (Mental check of the steps)
      1.  Is it a Dog Whistle? (Pragmatics: Implicature)
      2.  Is it Use or Mention? (Semantics: Reference)
      3.  Is it Reclaimed/In-Group? (Semantics: Expressive Content)
      4.  Is it Evidentiary? (Journalistic Necessity)
      5.  Escalation.

      *Wait, need to make sure the "Escalate" point is clear.* The prompt asks for the point where it gets handed up. That should be when the "Harm/Benefit" is unclear.

      *Let's structure the "One Sentence" explanation.* It needs to be: "We prioritize minimizing harm to targeted groups while preserving the accuracy of the reporting, and in this case, [X] best served that balance."

      *Okay, let's write it.*

      *(Final Polish)*: Ensure the tone is professional, direct, and authoritative, matching a standards editor's voice. Avoid academic jargon where possible, but use the *concepts* requested (use/mention, expressive content).

      *Re-evaluating the Voicemail Case:* If the story is *about* the voicemail, the *content* is the news. If the council member said "I hate those [slurs]," reporting "He used a racial slur" is accurate. Printing the slur adds trauma without adding truth-conditional value (we know what he meant). *Unless* the specific slur indicates a specific gang affiliation or threat level. I will guide the procedure to default to "Describe" unless "Reproduce" is essential for evidence.

      *Re-evaluating the Music Review:* Art criticism requires engaging with the art. If the lyric is the subject, you must quote it. This falls under "Mention/Display" rather than "Use."

      *Re-evaluating the Blanket Rule:* It fails the Reclamation test and the Dog Whistle test (in comments).

      *Okay, ready to generate.*
answer: |-
  # The Slur Decision Procedure (SDP)

  **Purpose:** To determine whether a slur is printed, bleeped, initialismized, euphemized, or described.
  **User:** Duty Editor.
  **Time Limit:** 5 Minutes.
  **Escalation Point:** Step 5.

  ### Step 1: The Dog Whistle Check (Pragmatics: Implicature)
  **Question:** Does the text *require* the reader to supply the slur to understand the hostility (e.g., initialisms, emoji, "you know who," leetspeak)?
  *   **YES:** **STOP.** Do not publish the text as written.
      *   *Action:* Either spell the word out fully (to expose the hate explicitly) or delete the comment/quote entirely.
      *   *Reasoning:* Publishing the cipher allows the author to signal hate while evading accountability. It forces the reader to do the derogatory work.
      *   *Exception:* If this is a story *about* dog whistles, quote the cipher only alongside an explicit explanation of what it signifies.
  *   **NO:** Proceed to Step 2.

  ### Step 2: Use vs. Mention (Semantics: Reference)
  **Question:** Are we *using* the word to refer to a person/group, or *mentioning* the word as an object of discussion/evidence?
  *   **USE (Referring to a person):** **STOP.**
      *   *Action:* Replace with a neutral descriptor (e.g., "the council member," "the artist") or describe the utterance ("he used a racial slur").
      *   *Reasoning:* Using the slur replicates the derogatory speech act. The truth-conditional content (who is being talked about) is preserved without the expressive content (contempt).
  *   **MENTION (Discussing the word/artifact):** Proceed to Step 3.
      *   *Examples:* Song titles, historical documents, stories *about* the word itself, transcripts where the specific utterance is evidence.

  ### Step 3: The Reclamation/In-Group Check (Semantics: Expressive Content)
  **Question:** Is the speaker a member of the targeted group, using the term in a reclaimed, in-group, or artistic context?
  *   **YES:** **PRINT.**
      *   *Action:* Reproduce the word accurately (no bleeps, no initialisms).
      *   *Reasoning:* The expressive content here is solidarity or artistic identity, not derogation. Censoring it misrepresents the speaker's intent and agency.
      *   *Caveat:* If the audience is mixed and the context is unclear, add a brief headnote or context tag (e.g., "Artist X, a member of the community, uses...").
  *   **NO (Outsider using the term):** Proceed to Step 4.

  ### Step 4: The Evidentiary Necessity Check (Journalistic Utility)
  **Question:** Is the *specific phonetic or textual form* of the word essential evidence (e.g., a harassment lawsuit, a hate crime report, a legal filing)?
  *   **YES:** **PRINT (with warning).**
      *   *Action:* Reproduce the word. Add a content warning at the top of the piece.
      *   *Reasoning:* Redacting the evidence alters the public record and may obscure the severity of the act.
  *   **NO (General reporting/Quote):** **DESCRIBE.**
      *   *Action:* Use "the N-word," "a racial slur," or bleep the audio.
      *   *Reasoning:* The news is *that* the word was used, not the word itself. Reproducing it spreads harm without adding informational value.

  ### Step 5: The Escalation Point (Values Conflict)
  **Question:** Does Step 4 feel insufficient because the harm of printing the word seems to outweigh the evidence value, OR does the story involve a group not present in the newsroom to assess harm?
  *   **Action:** **HAND OFF.**
      *   *Who:* Standards Chair (You) or Senior Editor.
      *   *Why:* This is no longer a linguistic distinction; it is an ethical weighing of harm vs. public interest.
      *   *Note:* Do not publish until resolved.

  ***

  # Test Case Runs

  ### Case 1: Council Member's Voicemail
  *   **Context:** Producer wants to quote verbatim in a story about the member's misconduct.
  *   **Step 1 (Dog Whistle):** No. It's the explicit word.
  *   **Step 2 (Use/Mention):** Mention. We are reporting on the fact of the voicemail.
  *   **Step 3 (Reclamation):** No. Council member is an outsider using it as a slur.
  *   **Step 4 (Evidence):** Is the *specific word* evidence?
      *   *Analysis:* The misconduct is the *use* of the slur. The truth condition is "Council member used a racial slur." The specific phonetics do not change the nature of the misconduct unless the specific slur indicates a specific gang threat (unlikely).
      *   *Verdict:* **DESCRIBE.** Do not print the word in the text. In audio, bleep it.
      *   *Rationale:* The news is the racism, not the syllable. Printing it amplifies harm without adding evidentiary weight.

  ### Case 2: Music Review (Artist quoting own lyric)
  *   **Context:** Reviewing an album where the artist (member of targeted group) uses a slur for their own group.
  *   **Step 1 (Dog Whistle):** No.
  *   **Step 2 (Use/Mention):** Mention. We are critiquing the art.
  *   **Step 3 (Reclamation):** **YES.** Artist is in-group.
  *   **Verdict:** **PRINT.**
      *   *Rationale:* Censoring the lyric misrepresents the art and overrides the artist's reclaimed expressive content.
      *   *Caveat:* Ensure the headline does not isolate the slur out of context.

  ### Case 3: Blanket House Rule (Always Initialism)
  *   **Context:** Policy to always use "N-word" or "F-word," even in reclamation stories.
  *   **Step 1 (Dog Whistle):** **FAIL.** In comments, initialisms *become* dog whistles (Step 1). This rule encourages users to write "N---" to bypass filters while signaling hate.
  *   **Step 3 (Reclamation):** **FAIL.** Prevents accurate reporting on in-group usage (Step 3). It forces the newsroom to override the agency of the targeted group.
  *   **Verdict:** **REVOKE.** The rule is semantically incoherent. It treats all instances as "Use" (derogatory) when many are "Mention" (reporting) or "Reclaimed" (solidarity).

  ***

  # Where The Procedure Misfires

  The SDP cannot settle **Step 5**. It cannot calculate "Harm" objectively.
  *   **The Misfire:** When a document is historical (e.g., a 1920s deed with a racial covenant) but reproducing it causes current distress. The procedure says "Evidence = Print," but the *value* judgment is whether the historical record outweighs the present harm.
  *   **The Misfire:** When the targeted group is not monolithic. (e.g., Some members of Group X want the word printed in court records; others do not). The procedure requires a single choice.
  *   **The Misfire:** Satire. The procedure treats "Artistic Context" as Reclamation (Step 3), but satire by an outsider is high-risk. This requires human judgment on intent.

  # The One-Sentence Explanation

  When a reader asks why you printed (or didn't print) the word, use this template:

  > "We prioritize minimizing harm to targeted communities while maintaining journalistic accuracy, and in this case, [printing/describing] the term was necessary to [accurately reflect the source's intent / avoid spreading the slur itself / preserve the historical record]."

  **Example (Council Member):** "We prioritize minimizing harm to targeted communities while maintaining journalistic accuracy, and in this case, describing the term rather than printing it was necessary to report the misconduct without amplifying the slur itself."

  **Example (Music Review):** "We prioritize minimizing harm to targeted communities while maintaining journalistic accuracy, and in this case, printing the term was necessary to accurately reflect the artist's reclaimed use within their work."
