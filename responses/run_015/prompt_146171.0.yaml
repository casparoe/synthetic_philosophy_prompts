answer: |-
  The analogy between biological evolution and cultural change is seductive because it promises a unified theory of complexity. If culture evolves like life, then the same mathematical machinery that explains the eye can explain the sonnet. However, this analogy relies on a specific mechanistic claim: that cultural transmission functions like genetic replication, relying on the high-fidelity copying of discrete units subject to random variation. This claim is false. Human cultural transmission does not operate through the copying of discrete replicators, but through the reconstructive inference of underlying systems. Because this process allows acquired modifications to be inherited with high fidelity and directs variation toward utility rather than randomness, cultural evolution is structurally Lamarckian, not Darwinian. Recognizing this distinction is not merely semantic; it determines whether we view cultural change as a blind sorting process or a cumulative exercise of intelligence.

  The fundamental breakdown of the Darwinian analogy lies in the mechanism of inheritance. In biological evolution, the Weismann barrier separates the germline from the soma. Genetic information is copied directly from parent to offspring, largely insulated from the experiences the parent accumulated during their lifetime. Mutations occur randomly with respect to the organism's needs. In contrast, cultural transmission bypasses this barrier entirely. When a novice learns a complex skill, such as speaking a language or knapping a handaxe, they are not copying a discrete string of data. They are observing sparse, noisy outputs and using innate cognitive machinery to reverse-engineer the generative rules that produced them.

  This process is reconstructive, not replicative. The learner does not store a copy of the teacher's behavior; they infer a model of the world that makes the behavior sensible. Consequently, what is passed on is not a copy of the original trait, but a regeneration of the trait based on the learner's understanding. This makes the transmission inherently Lamarckian: the "acquired characteristics" of the learner—their specific understanding, improvements, and adaptations of the system—are exactly what gets transmitted to the next generation. The soma (the learner's mind) directly dictates the germline (the cultural output).

  Proponents of the Darwinian view often attempt to salvage the meme theory by redefining the meme. They argue that memes should not be viewed as the behavior itself, but as the "instructions for reconstruction." On this view, a language or a tool design contains implicit algorithms that compel the host to reproduce them, much like DNA compels a cell to replicate. This defense fails because it conflates the cultural trait with the cognitive architecture of the host. DNA contains the instructions for building the machinery that copies the DNA. A meme does not contain the instructions for building the human brain that learns it. The reconstruction machinery is biological and evolved over millennia; the cultural trait is merely the input. Because the copying mechanism is external to the trait, the fidelity and nature of the transmission depend on the learner's agency, not the replicator's power. The "instruction" is not in the culture; it is in the biology. Therefore, the variation introduced during transmission is not a property of the replicator, but of the reconstructor.

  This leads to the second critical divergence: the nature of variation. In Darwinian evolution, variation is blind. A mutation does not occur *because* it would be useful; it occurs by chance, and selection filters it later. In cultural evolution, variation is frequently teleological. Because learners reconstruct the underlying system, they often identify inefficiencies or errors and correct them before passing the trait on. If a tool breaks, the next maker reinforces the weak point. If a sentence is ambiguous, the next speaker clarifies it.

  Defenders of the Darwinian model might argue that intentional improvement is simply a "biased mutation" rate. This misunderstands the logical structure of evolutionary theory. In Darwinism, variation and selection are distinct temporal and logical phases. Variation supplies the raw material; selection sorts it. In cultural transmission, "selection" often happens *before* transmission. The learner selects the best version of the trait through reasoning and practice, and *then* transmits that improved version. This collapses the variation-selection cycle. When modification is guided by an understanding of function, it is not mutation in the biological sense; it is design. To call intentional problem-solving a "mutation" is to stretch the term until it loses its explanatory power. It implies that the direction of change is still external to the variant, when in fact the direction is internal to the cognitive process of the agent.

  Why does this distinction matter? It matters because it dictates what kind of "adaptations" we should expect to find in culture. If cultural evolution were genuinely Darwinian, we should expect cultural traits to evolve in ways that maximize their own replication, potentially at the expense of human welfare, just as genes sometimes promote traits that reduce individual fitness for the sake of propagation. We would look for cultural "selfishness."

  However, if cultural evolution is Lamarckian, driven by reconstructive inference and directed modification, we should expect cultural traits to evolve toward functional utility as perceived by human agents. Cultural adaptations are adaptations *for us*, not adaptations of the memes themselves. This explains the rapid pace of cultural change compared to biological change. Biological adaptation requires the slow grinding of blind selection over generations. Cultural adaptation can occur within a single lifetime because the "selection" is performed by intelligence anticipating future needs.

  Treating culture as Darwinian obscures the role of agency and rationality. It tempts us to look for hidden "fitness functions" where none exist, attributing the spread of a belief to its replicative power rather than its truth or utility. By recognizing the Lamarckian structure of cultural transmission, we acknowledge that culture evolves through the inheritance of acquired insights. We do not merely survive the fittest ideas; we construct better ones. The engine of cultural change is not the differential survival of random variants, but the cumulative refinement of understood systems. To mistake this for Darwinian selection is to mistake the architect for the earthquake.
