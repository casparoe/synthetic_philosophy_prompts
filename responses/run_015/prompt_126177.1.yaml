answer: |-
  Your tentative principle fails because "in-principle replaceability" is too weak on mysticism (one can always invent a just-so micro-story) and too strong on constraints (physical structures are not beliefs). You need a principle that distinguishes *causal mediation* from *causal attribution*. The problem with "Spirit of the Age" is not that it lacks a micro-story, but that it posits a top-down force without a transmission mechanism. The virtue of "Street Layout" is that it specifies the transmission mechanism (physical feasibility).

  Here is the **Mediation Constraint Principle**. It accepts ontological individualism (social facts are constituted by individuals) but denies explanatory individualism (social facts can do causal work).

  **Clause 1: The Constitution Constraint**
  Social-level facts must be constituted by individuals, their properties, and their relations. They cannot exist as independent substances or forces.
  *   *Motivation:* Rejects Case (7) ("Spirit of the Age" as a force) and prevents mysticism. It accepts that "Neoliberalism" is real only insofar as it is instantiated in policies, behaviors, and institutions.

  **Clause 2: The Mediation Requirement**
  A social-level fact $S$ explains individual behavior $B$ only if the causal pathway from $S$ to $B$ is mediated exclusively by one of the following:
  *   **(a) Structural Affordance:** $S$ alters the physical or topological possibility space of $B$ (e.g., walls block walking; network ties block information).
  *   **(b) Reflexive Coordination:** $S$ enters the agents' belief-desire set as a public signal, norm, or focal point that coordinates expectations.
  *   **(c) Stabilizing Feedback:** $S$ is a stable equilibrium maintained by local individual responses to local conditions, where the stability itself constrains future choices.
  *   *Motivation:* (a) saves Case (3) (Street Layout) and treats Case (4) (Durkheim) as social topology constraining coping resources. (b) saves Case (8) (Tracked Index). (c) saves Case (1) (Schelling).

  **Clause 3: The Teleology Condition**
  Functional explanations ( $S$ exists because it produces benefit $F$ ) are legitimate only if a selection mechanism (replication, conquest, market survival) is specified that links $F$ to the persistence of $S$.
  *   *Motivation:* Distinguishes Case (5) (Heart/Blood) from Case (6) (Punishment/Solidarity). Without selection, functionalism is mysticism.

  ### Application to Your Cases

  *   **(1) Schelling Segregation:** Passes Clause 2(c). The macro pattern is a stabilizing feedback loop of micro-thresholds.
  *   **(2) Household Size/Prices:** Passes Clause 1 but is excluded as non-causal. You are correct; this is aggregative bookkeeping, not a causal mechanism mediating behavior.
  *   **(3) Street Layout:** Passes Clause 2(a). The grid is a physical constraint on the feasible set of actions. It is not a belief; it is a wall.
  *   **(4) Durkheim Suicide:** Passes Clause 2(a) *only if* "integration" is interpreted as **Social Topology**. If integration means "density of supportive ties," it is a structural affordance constraining coping resources. If it means a holistic "collective consciousness" exerting force, it fails Clause 1.
  *   **(5) Heart Function:** Passes Clause 3. Biological selection is assumed.
  *   **(6) Punishment/Solidarity:** Fails Clause 3. No selection mechanism (conquest/replacement) is supplied. Your gag reflex is correct.
  *   **(7) Spirit of the Age:** Fails Clause 2. "Neoliberalism" is not a physical constraint, nor a specific coordinating signal, nor a specified feedback loop. It is a label for the outcome, not a mediator.
  *   **(8) Tracked Variables:** Passes Clause 2(b). The index works because it is *mutually known* to be watched. The causal power lies in the common knowledge, not the number itself.
  *   **(9) Currency Collapse:** **Verdict: Allow.** This fits Clause 2(b). It is a reflexive coordination problem. The "social fact" (expected collapse) is constituted by individual expectations, but it explains individual behavior (selling) because it is a public focal point. It is not mysticism; it is game-theoretic common knowledge.

  ### New Cases

  **Case 10: Network Topology (Small-World Effect)**
  *   *Scenario:* A behavior spreads faster in Network A than Network B because A has a higher clustering coefficient with a few long-range bridges (weak ties), even though no individual knows the global topology.
  *   *Verdict:* **Allow.**
  *   *Reasoning:* Fits Clause 2(a) (Structural Affordance). The topology is a physical/social constraint on the transmission pathway. Individuals do not need to believe in the topology for it to constrain them, just as they do not need to believe in the street grid for it to block them. The social structure does causal work that individual properties cannot capture without losing the structural property.

  **Case 11: Institutional Isomorphism**
  *   *Scenario:* Organizations adopt similar structures not for efficiency, but to appear "legitimate" to peers and regulators, ensuring survival.
  *   *Verdict:* **Allow.**
  *   *Reasoning:* Fits Clause 3 (Teleology + Selection) and Clause 2(b) (Coordination). The "legitimacy" is a social fact. It explains the behavior because organizations respond to it to avoid selection (failure/conquest). It is not a "spirit of the age" because the selection mechanism (resource dependence/survival) is specified.

  ### Trade-offs and Misdescriptions

  **The Trade-off: Case (4)**
  To save Case (4), this principle forces you to reinterpret Durkheim. You cannot allow "social integration" to be a holistic force (Clause 1). You must treat it as **Social Topology** (Clause 2a). If you insist that Durkheim's explanation works *even if* integration is not cashed out as tie-density or normative frequency, this principle will overturn your verdict. You must choose: either Durkheim was describing structural constraints on coping (which saves him), or he was positing a holistic force (which condemns him as mysticism). I recommend the former; it preserves the science without the metaphysics.

  **Misdescriptions**
  1.  **Case (2):** You describe this as "aggregative bookkeeping." This is correct. It is not a social-level *explanation* of behavior; it is a macro-level correlation. My principle excludes it not because it is bad, but because it is not in the category of causal explanations you are worried about.
  2.  **Case (6) vs (5):** You note they are the same sentence form. They are not. (5) implies a historical selection process (evolution). (6) implies a present-day functional necessity without a mechanism. My Clause 3 makes this explicit. If you supplied the selection story for (6) as you noted, it would pass.
  3.  **Case (7):** You treat "Neoliberalism produced..." as redescription. Under Clause 2, it is worse: it is a **placeholder for mechanism**. It claims causal power without specifying mediation. It fails not because it is macro, but because it is silent on *how* the macro touches the micro.

  **Summary of the Account**
  You are not flip-flopping; you are tracking the **Mediation Requirement**. You accept social facts when they act as walls (constraints), signals (coordination), or equilibria (feedback). You reject them when they act as ghosts (forces without mediation) or purposes without selectors (teleology). This principle formalizes that intuition. It saves your verdicts on (1), (3), (5), (6-rejected), (7-rejected), (8), and (9). It saves (4) only on the condition that "integration" is structural topology. It clarifies (2) as non-causal. It is precise enough to handle network topology and institutional survival without collapsing into methodological individualism or holistic mysticism.
