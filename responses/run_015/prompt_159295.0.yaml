answer: |-
  Here is the plan for the session, structured to move your group from slogan-level familiarity to a functional grasp of the architecture without getting bogged down in the math that usually stalls these conversations. You should start with the generative model before you introduce the prediction-error loop, because if you begin with the loop you will validate their existing misconception that this is just a control system minimizing signal difference. Programmers see a comparator and think PID controller or loss function; they need to understand the ontology of hidden causes generating sensations before they can understand why the error matters. The loop is the mechanism, but the model is the claim about reality, and without the claim, the mechanism looks like standard engineering they already think they understand. Consequently, you should teach the distinction between predicting the next input and predicting the causes of the input cold, in the first ten minutes, precisely because you need to inoculate them against the language-model intuition before it anchors. If you wait until they have a model to make the distinction, they will have already mapped prediction onto next-token probability, and undoing that architectural mapping is much harder than preventing it. You want them to understand that the brain is not predicting the pixel values of the next frame but rather the state of the world that produced the pixels, and that distinction needs to be the lens through which they view the rest of the session.

  For the carrying example, you should use the lurch when you push a door your body had already calibrated as heavy. This example works better than the staircase because it involves action, not just passive perception, which is essential for Active Inference. The example needs to be first-personal and cheap, requiring no props, and it must have both a perceptual payoff, the feeling of surprise, and an active payoff, the immediate adjustment of force. It must lack any element of trickery or external deception. You should avoid visual illusions and ventriloquism effects because those teach the lesson that the brain is prone to bugs or magic tricks, whereas the Free Energy Principle is about optimal engineering under constraint. Illusions suggest the system is failing; the door example suggests the system is working correctly based on prior data that happened to be outdated. The door lurch demonstrates that the body acts to test its model, and when the sensory feedback violates the expectation, the model updates and the action changes, which captures the perception-action loop better than a visual static image ever could.

  Regarding precision, you can get away with presenting it as gain on a channel for an audience of engineers, and it is probably the most efficient metaphor you have available. They understand signal amplification and noise filtering, so mapping precision to the gain control on a prediction error channel will click immediately. The cost you pay later is that you obscure the fact that precision is actually the inverse variance of a probability distribution, which means you might have to walk back the idea that it is a separate knob they can tune independently of the content. However, for a ninety-minute session, the risk of them thinking precision is a static hyperparameter is lower than the risk of them not understanding why some errors matter more than others, so take the metaphor and accept the technical debt.

  You need to head off misconceptions in the order they will naturally form during your explanation. The first is the thermodynamic free energy worry, which you should address the instant you write the term on the whiteboard by stating clearly that it is an information-theoretic bound and not heat, using a sentence of framing to sever the link to physics immediately. The second is Bayesian literalism, which will form when you describe the inference process; head this off by asking them to treat the Bayesian description as a useful model of the system rather than a claim about literal neural computation, which prevents them from looking for a homunculus doing calculus. The third is the hallucination worry, that if perception is prediction nothing corrects us; handle this during the door example by pointing out that the lurch is the correction, proving the system is anchored to reality. The fourth is the dark-room problem, which you should raise yourself before someone else does, but only after you have established the role of action; frame it as a question about why we do not just sit still to minimize input, and answer it by explaining that we have prior expectations about being alive and fed that require sampling the world. The fifth is the explains everything complaint, which will come from the skeptic at the end; meet this by admitting the theory is a framework rather than a specific mechanism, and ask them to judge it by whether it generates useful questions rather than whether it solves every problem today.

  There are three things you should openly refuse to explain and say out loud that you are refusing. You should state that you will not derive the variational bound because it is calculus that does not help the intuition, you will not explain the Markov-blanket formalism because it is topological baggage that distracts from the functional story, and you will not touch anything about consciousness because it is a separate philosophical quagmire that will eat the remaining time. Making these refusals explicit protects the session from scope creep and signals to the group that you are prioritizing conceptual clarity over mathematical rigor.

  In the last five minutes, put this question to the room: if the goal is to minimize prediction error, why does the brain not simply minimize input by closing its eyes and staying still? A wrong answer will focus on survival instincts or external rewards, which shows they have reverted to standard reinforcement learning thinking. A good answer has to contain the idea that the brain has prior expectations about specific sensory states that require active sampling to maintain, meaning that minimizing error sometimes requires seeking out complex inputs rather than avoiding them. This diagnostic tells you whether they understand that the priors drive the action, not just the reduction of surprise.

  If the room were mostly philosophers instead of engineers, I would reverse two choices. I would reverse the refusal to discuss consciousness, because philosophers will view the exclusion of the hard problem as a evasion of the central stake, and I would reverse the precision-as-gain metaphor in favor of discussing confidence or warrant, because engineers care about signal processing while philosophers care about epistemic justification. The rest of the structure would hold, but those two shifts would align the session with their primary interests rather than the architectural intuitions of programmers.
