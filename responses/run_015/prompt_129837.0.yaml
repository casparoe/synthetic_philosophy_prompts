answer: |-
  (a) **Exam Question**

  **Course:** PHI 540: Philosophy of Science (Graduate Seminar)
  **Examination:** Final Essay
  **Time Allowed:** 90 Minutes
  **Word Limit:** 800–1000 words
  **Conditions:** Open-notes, offline. No citations or bibliographies required.

  **Prompt:**

  Standard textbook summaries often dismiss Malthusian population theory based on the historical falsification of its specific growth ratios (geometric population vs. arithmetic food supply). However, evaluating long-run predictive theories requires distinguishing *how* a theory fails. Consider three distinct failure modes:

  1.  **Parameter Error:** The causal dynamics are correct, but the quantitative constants or ratios (e.g., growth rates) are inaccurate.
  2.  **Mechanism Collapse:** The proposed causal dynamics themselves do not hold under the specified conditions (the logic is internally or empirically flawed).
  3.  **Mechanism Preemption:** The dynamics are structurally sound, but their operation is systematically blocked by an exogenous factor the theory treats as contingent rather than impossible.

  Write an essay evaluating whether Malthus's theory is best interpreted as suffering from parameter error, mechanism collapse, or mechanism preemption. Use this classification to assess whether the characterization of Malthus as "right but early" constitutes a coherent epistemic category or merely a post-hoc rescue strategy. Specifically, address the unfalsifiability worry: if any indefinite delay in the predicted crisis can be interpreted as preemption rather than falsification, then the "right but early" rescue risks being immune to evidence. Your essay must articulate what evidential pattern would genuinely distinguish preemption from collapse.

  ***

  (b) **Model Answer**

  To evaluate Malthusian theory philosophically, we must move beyond the historical fact of agricultural surplus to the structural integrity of the prediction. The distinction between parameter error, mechanism collapse, and mechanism preemption offers the necessary granularity. Parameter error implies the logic holds but the numbers were off; mechanism collapse implies the logic itself is false; mechanism preemption implies the logic holds but was externally blocked.

  Applying these modes to Malthus, parameter error is insufficient. The failure was not merely that population grew slower than 25-year doubling or food faster than linear addition; rather, the relationship between resource scarcity and human welfare was fundamentally altered. Mechanism collapse is the standard positivist critique: Malthus was simply wrong because technology decoupled food from land. However, this ignores the counterfactual stability of the mechanism. In contexts where technological intervention is absent or fails, Malthusian checks (famine, misery) remain operative. Therefore, mechanism preemption is the most defensible interpretation. The industrial agricultural revolution acted as an exogenous preemptor—a factor external to the biological-economic dynamics Malthus modeled. Malthus treated technological stagnation as a background condition, not a logical necessity. When that condition changed, the mechanism was preempted, not disproven.

  However, classifying this as preemption to save the theory as "right but early" risks vacuity. For "right but early" to be a coherent epistemic category rather than a dogmatic shield, it requires two specific conditions: counterfactual stability and explicit domain restriction. Counterfactual stability demands that we assert the crisis *would* have occurred absent the preemptor. Explicit domain restriction requires admitting the theory applies only to systems where the preemptor (exogenous technological shock) is absent. Without these, "right but early" becomes a metaphysical claim rather than a scientific one. We cannot claim the theory is true if its domain of application is restricted to conditions that never obtain. Thus, Malthus is "right" only within a specific modal scope: in possible worlds where industrialization does not occur.

  This leads directly to the unfalsifiability objection. If every failure of the prediction is attributed to a new preemptor, the theory becomes immune to refutation. To avoid this, we must specify an evidential pattern that distinguishes preemption from collapse. Preemption is supported only if the causal link between scarcity and misery holds in local pockets where the preemptor is absent. For example, if isolated populations without technological access exhibit Malthusian checks despite available land reserves (due to distribution failures), preemption is viable. Conversely, collapse is indicated if the mechanism fails even when the preemptor is controlled for. If resource scarcity ceases to produce misery even in low-technology contexts—perhaps due to social organization changes endogenous to the population itself—then the mechanism has collapsed, not been preempted.

  Furthermore, the distinction relies on the exogeneity of the preemptor. If the technological fix arises *endogenously* from the population pressure itself (e.g., scarcity drives innovation which solves scarcity), then the technology is part of the system's dynamic equilibrium, not an external blocker. In that case, Malthus's model suffers from mechanism collapse because it failed to model the feedback loop correctly. Therefore, genuine preemption requires the preemptor to be historically contingent and external to the model's variables.

  In conclusion, Malthus's theory is best read as suffering from mechanism preemption, but this classification saves the theory only under strict conditions. It is "right but early" only if we accept a domain restriction to pre-industrial systems and maintain counterfactual stability. To avoid unfalsifiability, we must demand evidence that the mechanism operates where the preemptor is absent and verify that the preemptor is truly exogenous. Without these constraints, "right but early" is merely a rhetorical device to protect a theory from the empirical reality of its own failure. The philosophical work lies not in saving Malthus, but in defining the boundaries where his logic retains explanatory power.

  ***

  (c) **Marking Scheme**

  **Total Points:** 20

  **1. Framing of the Three Failure Modes (4 Points)**
  *   **4 pts:** Defines parameter error, mechanism collapse, and mechanism preemption with precision, highlighting the structural differences between quantitative error, causal failure, and exogenous blocking.
  *   **3 pts:** Defines all three but lacks precision on the distinction between collapse and preemption.
  *   **1–2 pts:** Definitions are vague or conflated.
  *   **0 pts:** Modes not defined.
  *   *Characteristic Failure (B-range):* Listing the three modes without distinguishing the structural difference between collapse (internal logic failure) and preemption (external blocking).

  **2. Application to Malthus (5 Points)**
  *   **5 pts:** Argues for preemption based on counterfactual stability and exogeneity of technology; explicitly rejects parameter error and collapse with justification.
  *   **3–4 pts:** Identifies preemption but relies on historical narrative (industrial ag) rather than structural analysis.
  *   **1–2 pts:** Recites standard Malthusian narrative without applying the three modes.
  *   **0 pts:** No application to Malthus.
  *   *Characteristic Failure (B-range):* Treating mechanism preemption as obviously correct without defending it against the charge that technology might be endogenous to population pressure.

  **3. Defense of "Right but Early" (5 Points)**
  *   **5 pts:** Argues coherence depends on counterfactual stability condition and explicit domain restriction; explains why these prevent vacuity.
  *   **3–4 pts:** Discusses "right but early" but misses the requirement for domain restriction or counterfactuals.
  *   **1–2 pts:** Accepts "right but early" uncritically or rejects it entirely without nuance.
  *   **0 pts:** Not addressed.
  *   *Characteristic Failure (B-range):* Asserting "right but early" is coherent without specifying the modal conditions (possible worlds/domain) required to make it meaningful.

  **4. Engagement with Unfalsifiability (4 Points)**
  *   **4 pts:** Specifies evidential pattern distinguishing preemption from collapse (e.g., mechanism holding in low-tech pockets vs. endogenous innovation).
  *   **3 pts:** Discusses unfalsifiability generally but lacks a specific evidential test.
  *   **1–2 pts:** Mentions unfalsifiability but offers no resolution.
  *   **0 pts:** Not addressed.
  *   *Characteristic Failure (B-range):* Claiming preemption renders the theory immune to refutation without proposing what evidence would count against it.

  **5. Clarity and Argumentative Structure (2 Points)**
  *   **2 pts:** Logical flow, precise terminology, within word limit.
  *   **1 pt:** Disorganized or significant clarity issues.
  *   **0 pts:** Incoherent.

  **Grade Band Differentiation**

  *   **A-Range (17–20 Points):**
      *   **Requirement:** Must secure full points in sections 2, 3, and 4. The essay must argue that preemption is defensible *only if* paired with counterfactual stability and domain restriction, and must propose a specific evidential pattern to test unfalsifiability.
      *   **Characteristic Success:** Integrates the conceptual distinctions to solve the epistemic problem of "right but early."

  *   **B-Range (13–16 Points):**
      *   **Requirement:** Secure most points in sections 1 and 2, but lose significant points in 3 or 4.
      *   **Characteristic Failure:** Listing the three modes without applying them to the Malthusian mechanism, or treating mechanism preemption as obviously correct without defending it against the charge that it renders the theory immune to refutation.
