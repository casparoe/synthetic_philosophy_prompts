      *   **Point 1: The Fugue/Choir Distinction:**
          *   *Verdict:* It's philosophically useful, not just poetic. It maps onto "distributed cognition" vs. "centralized processing."
          *   *Nuance:* It might be a spectrum. A choir *can* sing without a conductor (a cappella), but there's usually a score. A fugue implies independent lines.
