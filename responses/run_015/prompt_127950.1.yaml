answer: |-
  This is an exceptionally sharp observation. You have identified a growing friction point in heritage ethics that often goes unexamined in public discourse. The scenario you describe—physical repatriation coupled with digital retention and copyright enforcement—is not just bureaucratic inertia; it is a philosophical stance masquerading as administrative policy.

  Here is a breakdown of the theories, contradictions, and concepts underlying that practice.

  ### 1. The Presupposed Theory: Hylomorphic Dualism & Lockean Labor
  The practice presupposes a specific metaphysical split regarding what an artifact *is*.

  *   **Hylomorphic Dualism:** Aristotelian philosophy distinguishes between *hyle* (matter) and *morphe* (form). The museum's policy treats the bronze or marble as the **matter** (which can be returned) and the high-res data/visual representation as the **form** (which they retain). They operate on the assumption that the "essence" of the object is increasingly located in its data, not its physical substrate.
  *   **Lockean Labor Theory of Property:** Museums justify copyright on scans by arguing that the *labor* of scanning, lighting, and processing creates a new intellectual property right. They argue: "We did the work to capture the image; therefore, we own the image." This ignores the **cultural labor** that created the object and the **historical violence** that facilitated its acquisition. It privileges the labor of *documentation* over the labor of *creation*.
  *   **Disembodied Identity:** It assumes collective identity is portable and informational. It suggests the source community needs the *totem* for ritual or symbolic closure, but the *knowledge* (the image) is a universal commodity best managed by the institution.

  ### 2. Consistency with the "Repair" Narrative
  **It is fundamentally inconsistent.**

  The standard moral argument for restitution is that colonial theft broke a **cultural narrative** or severed a **relationship of care**. The object is not just a thing; it is an ancestor, a witness, or a vessel of continuity.

  *   **The Contradiction:** If the object is a vessel of narrative, then controlling its image is controlling its voice. By retaining copyright, the museum retains **epistemic control**. They decide who sees it, how it is reproduced in textbooks, and how it is used in AI training sets.
  *   **The Implication:** This practice quietly assumes that the "broken narrative" is repaired by the *presence* of the matter, but the *authority* over that narrative remains with the West. It treats the artifact as a symbolic token of reconciliation while retaining the actual power (the ability to disseminate and monetize the image).
  *   **Ontological Inseparability:** Many source communities (particularly Indigenous groups in North America and Africa) hold an ontology where the image and the object are **ontologically inseparable**. To capture the image is to capture part of the spirit or agency of the object. Separating them is not just a legal split; it is a metaphysical violence.

  ### 3. Is There an Established Concept?
  There is no single legal term for this, but in critical heritage studies and legal theory, it falls under a few emerging frameworks:

  *   **Digital Colonialism (or Data Colonialism):** This is the most accurate critical term. It describes the extraction of data from the Global South (or marginalized communities) by Northern institutions, creating a new layer of ownership over cultural heritage that bypasses physical restitution.
  *   **Visual Sovereignty:** This is the counter-concept. Indigenous scholars argue that sovereignty must extend to visual representation. The practice you describe is a violation of Visual Sovereignty.
  *   **The "Surrogate" Problem:** In archival theory, this touches on the politics of the *surrogate*. When the surrogate (the scan) becomes more useful than the original (for research, publishing, AI), retaining control of the surrogate negates the value of returning the original.
  *   **Legal Grey Zone (3D Copyright):** Legally, this relies on a jurisdictional split. In the US (*Bridgeman v. Corel*), exact photographic reproductions of 2D public domain works are not copyrightable. However, **3D scans** are often claimed as new creative works because of the "creative choices" involved in lighting and processing. Museums exploit this grey zone to assert ownership over digital twins of public domain objects.

  ### 4. Mapping the Hidden Philosophical Commitments
  Here is the audit of the conflicting commitments inherent in this practice:

  | Commitment | The Museum's Stance | The Source Community's Stance | The Clash |
  | :--- | :--- | :--- | :--- |
  | **Ontology** | **Dualist:** Object and Image are separable entities. | **Holistic:** Image and Object are aspects of the same being. | Returning the body but keeping the "shadow" is seen as incomplete or deceptive. |
  | **Property** | **IP Maximalist:** Labor of scanning creates new ownership. | **Cultural Property:** The image derives value solely from the cultural origin. | The museum claims ownership of the *reflection* of the culture, not the culture itself. |
  | **Access** | **Paternalist:** We preserve/manage access for the world. | **Sovereigntist:** We determine the context and sanctity of access. | "Licensing back" forces the community to ask permission to use their own heritage. |
  | **Time** | **Preservationist:** Digital is for eternal safety. | **Continuity:** Digital is for current cultural vitality. | The museum prioritizes archival permanence; the community prioritizes living use. |

  ### 5. What Would a Fully Consistent Version Look Like?
  If a museum truly believed that restitution repairs a broken cultural narrative, the digital policy would have to align with the physical policy. A consistent framework would require:

  1.  **Data Sovereignty:** The copyright (or Creative Commons license) of the digital surrogate must transfer with the physical object. If the object is repatriated, the digital twin is "repatriated" into the public domain or the community's control.
  2.  **Waiver of IP Claims:** The museum explicitly waives any claim to copyright on scans of repatriated items, acknowledging that the "creative labor" of scanning does not supersede the cultural ownership of the subject.
  3.  **Epistemic Repair:** Acknowledging that control over the image is control over the history. The museum would provide the data *without* strings, allowing the community to decide if the images should be public, restricted, or sacred.

  **The Bottom Line:**
  The practice you describe reveals that for many institutions, **restitution is performative.** It is about clearing ethical liability (returning the "stolen goods") without relinquishing epistemic authority (keeping the "knowledge"). It assumes the narrative *can* be owned apart from the thing, which is exactly what the restitution movement argues is *false*.

  Until museums adopt **Digital Repatriation** as a mandatory corollary to Physical Repatriation, they are effectively saying: *"You can have your ancestor back, but we keep the family album."*
