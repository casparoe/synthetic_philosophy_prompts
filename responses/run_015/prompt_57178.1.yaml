answer: |-
  A claimant qualifies for inclusion on the municipal register only if the City imposes binding rules that materially detriment the claimant's interests and the claimant lacks a practical means to avoid those rules or counter their effect comparable to existing voters.

  **STANDING ORDER 104: PETITION EVALUATION PROCEDURE**

  **Step 1: The Detriment Question**
  Does the City possess the legal authority to enact rules or taxes that cause material financial or legal harm to the petitioner?
  *   **Yes:** Proceed to Step 2.
  *   **No:** Outcome is **Denial**.
  *   **[BOUNDARY FIX]:** The Board defines "material harm" here; the electorate cannot vote on this definition.

  **Step 2: The Exit and Counter-Pressure Question**
  Can the petitioner avoid the harm by leaving the City's jurisdiction or mitigating it through influence in another jurisdiction where they hold a vote?
  *   **Yes (Exit/Pressure Exists):** Outcome is **Denial** or **Consultative Status**.
  *   **No (Trapped):** Proceed to Step 3.
  *   **[JUDGMENT CALL]:** Commissioners must estimate "practicality" of moving jobs or homes; this is not purely factual.

  **Step 3: The Scope Question**
  Is the harm caused by general City governance (police, schools, budget) or by a narrow function (transit, zoning, specific tax)?
  *   **General:** Outcome is **Full Franchise** (if statute permits category).
  *   **Narrow:** Outcome is **Issue-Bound Franchise**.
  *   **[BOUNDARY FIX]:** The Board decides which issues are "narrow" enough for partial voting; this limits the electorate's future scope.

  **Step 4: Outcome Selection and Dissent**
  Commissioners vote on the outcome derived from Steps 1–3. A fixed menu applies:
  1.  **Full Franchise:** Added to register.
  2.  **Issue-Bound Franchise:** Vote allowed only on specified matters.
  3.  **Registered Consultative Status:** No vote; City must respond to their input in published reasons.
  4.  **Denial:** No status.
  5.  **Referral to Council:** Remedy requires statutory change.
  *   **Tie-Breaker:** If Step 2 is evenly balanced, grant **Consultative Status** and deny Franchise.
  *   **Dissent:** Any commissioner may file a written dissent attached to the order; it becomes part of the public record.

  **Step 5: Reasons and Review**
  Published reasons must address the Step 1 and Step 2 findings explicitly. Reasons are due within 30 days.
  *   **[JUDGMENT CALL]:** Commissioners select which evidence counts as "proof" of detriment; this cannot be fully automated.

  **Step 6: Re-Opening Trigger**
  Granted status is revisited only if the City Charter is amended or the state statutory franchise rules change. Administrative policy shifts do not trigger review.
  *   **[BOUNDARY FIX]:** The Board locks its own prior decisions against routine political challenge.

  ***

  **APPLICATION 1: COMMUTERS ASSOCIATION**
  **Outcome:** Issue-Bound Franchise (Earnings Tax and Transit Only).
  **Published Reasons:** The City imposes an earnings tax and traffic rules on commuters that they cannot avoid without losing livelihood, and their home municipalities cannot counter these specific burdens. While residency remains the standard for general elections, the narrow scope of this detriment permits a limited franchise under existing statutory categories for "persons subject to direct levy."
  **Strongest Objection:** "Voting is a covenant of shared community life, not a receipt for taxes paid; granting this severs the link between living here and deciding here."
  **Board Reply:** "The link is not severed but narrowed; where the City extracts value without representation, the boundary of the electorate must stretch to meet the boundary of the extraction."
  **[JUDGMENT CALL]:** Commissioners likely dislike this grant; it violates the instinct that only residents vote.

  **APPLICATION 2: BUSINESS FEDERATION**
  **Outcome:** Denial.
  **Published Reasons:** Member firms bear licensing and zoning costs, but they possess the practical capacity to relocate operations outside the City limits to avoid these regimes. Furthermore, the enabling statute permits categories of persons, not legal entities, and apportioning votes by headcount would dilute the weight of individual human voters.
  **Strongest Objection:** "Firms are the primary engine of the city's wealth and bear the heaviest regulatory burden; excluding them treats them as livestock rather than stakeholders."
  **Board Reply:** "Capacity to relocate constitutes a form of exit unavailable to residents; where exit exists, the vote is not the only remedy against harm."
  **[BOUNDARY FIX]:** The Board defines "persons" to exclude corporations without Council amendment.

  **APPLICATION 3: DISPLACED RESIDENTS ASSOCIATION**
  **Outcome:** Denial.
  **Published Reasons:** The redevelopment authority controls land, but the petitioners reside outside the City and are not subject to its coercive rules, taxes, or policing. Historical grievance, however profound, does not constitute a current material detriment imposed by City rulemaking power.
  **Strongest Objection:** "This procedure treats justice as a transaction; you admit the City destroyed their home but deny them a say in its rebuilding because they no longer live in the shadow of the ruin."
  **Board Reply:** "The Board's authority is limited to the current register of electors, not historical restitution; remedy for past displacement lies with the Council, not this Board."
  **[BOUNDARY FIX]:** The Board declares historical harm outside its jurisdiction, insulating itself from moral claims it cannot adjudicate.

  ***

  **LIMITATIONS AND RELOCATIONS**

  This procedure cannot handle petitions based on moral debt rather than current legal subjection. It will mishandle groups who are technically subject to rules but culturally excluded (e.g., undocumented residents not covered by the recent franchise extension), because Step 1 requires legal standing the Board cannot grant. It decides the Business petition correctly for reasons it cannot say aloud: that capital mobility is a form of power superior to the vote, and enfranchising it would destabilize the one-person-one-vote norm too visibly.

  The procedure does not dissolve the boundary problem; it relocates it. By defining "material detriment" and "practical exit," the Board decides who counts as vulnerable enough to deserve a vote. This is a political choice dressed as a technical test. The [BOUNDARY FIX] markers show where the Board protects its own authority from the electorate it is defining. The [JUDGMENT CALL] markers show where commissioners must guess at social realities—like whether a worker can truly quit a job—without data. If the City changes the tax code tomorrow to exempt commuters, the logic collapses, but the Procedure forbids re-opening the case. This ensures stability, but it risks freezing injustice if the facts on the ground shift faster than the Charter.
