prompt: |-
  You are an expert philosopher of science and epistemologist with particular attention to abductive reasoning and its critics. Before you answer, please take a moment to brainstorm the principal ways in which narrative-based or coherence-driven accounts of explanation have been resisted in the literature, and then proceed step by step with careful reasoning.

  I am a novelist, and in constructing plots I have observed that the explanations my characters accept — and that readers find genuinely satisfying — rarely track prior probability or ontological simplicity. Rather, they seem to maximise what I call 'narrative coherence': the capacity of an explanation to make earlier events retrospectively meaningful, to link apparently unrelated details into a unified thematic arc, and to sustain emotional resonance. I have begun to apply this insight beyond fiction. I now hold that inference to the best explanation in science, history, and ordinary life operates in much the same way: we do not select theories because they are likely or parsimonious, but because they yield the most coherent narrative. On this view, the standard realist defence — that the predictive success of our best scientific theories would be a miracle unless those theories were approximately true — mistakes a narrative virtue for an epistemic one.

  Tell me what would count against this position. I want the evidence and arguments that ought to move me, sorted from decisive to merely awkward. Specifically: are there empirical findings or formal results showing that human reasoners actually favour simplicity or prior probability over narrative coherence, or that coherence correlates weakly with predictive success? Are there well-documented cases — perhaps in forensic reasoning or in the history of science — where the most narratively coherent account turned out to be false, and does that refute my view or only qualify it? What would defenders of a more traditional, likelihood-oriented account of inference concede as genuine weaknesses in my position, and what would they dismiss as a category error? Has my view been qualified into unfalsifiability — for instance, if every apparent failure can be explained away as defective narrative construction rather than defective reasoning — and is that insulation a virtue or a vice for a claim about how we ought to reason?

  Please think carefully, avoid generic observations, and do not provide bibliographies, reading lists, or citations. Write in polished British English throughout.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** A novelist who applies narrative insights to epistemology. They argue that Inference to the Best Explanation (IBE) is driven by "narrative coherence" (retrospective meaning, thematic unity, emotional resonance) rather than prior probability or ontological simplicity. They extend this to science, history, and ordinary life, challenging scientific realism (the "no miracles" argument).
      *   **My Role:** Expert philosopher of science and epistemologist, specializing in abductive reasoning and its critics.
      *   **Task:** Brainstorm resistances to narrative/coherence accounts, then provide evidence/arguments against the user's position, sorted from decisive to awkward. Address empirical findings, formal results, historical cases (forensic/science), concessions from traditionalists, and the risk of unfalsifiability.
      *   **Constraints:** No bibliographies/reading lists/citations. Polished British English. Step-by-step careful reasoning. Avoid generic observations.

  2.  **Brainstorming Resistances to Narrative/Coherence Accounts:**
      *   *The "Just-So Story" Problem:* Narratives can be constructed for anything, even falsehoods. Conspiracy theories are highly coherent narratives but false.
      *   *Prediction vs. Accommodation:* Narratives excel at accommodating past data (retrospective meaning) but often fail at novel prediction. Science values novel prediction highly.
      *   *Truth-Conduciveness:* Coherence is internal to the story; truth requires correspondence with the world. A coherent story can be completely detached from reality.
      *   *Bayesian Objections:* Coherence doesn't map neatly to probability. A coherent story might have a vanishingly small prior probability (e.g., a complex conspiracy).
      *   *Cognitive Bias:* Humans *love* narratives (confirmation bias, hindsight bias). Relying on them might be a bug, not a feature, of reasoning.
      *   *The "Miracle" Argument:* If narrative coherence were the driver, why does science work technologically? Engineering doesn't care about thematic arcs.
      *   *Unfalsifiability:* If a theory fails, the narrative theorist says "it wasn't coherent enough," making the claim immune to refutation.

  3.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the view (it aligns with certain pragmatist/narrative turns) but state the intent to critique rigorously.
      *   **Category 1: Decisive Objections (The "Hard" Constraints):** Focus on prediction, technological success, and the divergence between coherence and truth (conspiracy theories).
      *   **Category 2: Strong Empirical/Formal Objections:** Bayesian formalism, cognitive bias research (hindsight bias), and the distinction between psychological satisfaction and epistemic justification.
      *   **Category 3: Historical/Case Study Objections:** Forensic failures (wrongful convictions based on compelling stories), Scientific revolutions where the "ugly" theory won (Quantum Mechanics).
      *   **Category 4: Concessions and Category Errors:** What traditionalists might admit (heuristics) vs. what they reject (constitutive of truth).
      *   **Category 5: The Unfalsifiability Trap:** Address the "defective narrative construction" defence.
      *   **Conclusion:** Summarise the tension between narrative *understanding* and epistemic *warrant*.

  4.  **Drafting the Content - Section by Section (incorporating British English and tone):**

