      *   *Empirical/Formal:* Bayesianism. Coherence often *lowers* probability. Conjoining details makes a story tighter but statistically less likely (Conjunction Fallacy).
      *   *Empirical/Formal:* Hindsight Bias. The feeling of "retrospective meaningfulness" is a known cognitive distortion. It feels like understanding but is often just pattern recognition on noise.
      *   *Historical:* Forensic science. "Tunnel vision." Prosecutors construct a coherent narrative; innocent people go to jail. The "true" story was often messy and incoherent.
      *   *Historical:* Quantum Mechanics. It is ontologically bizarre, lacks visualisable narrative, yet predicts perfectly. If narrative coherence were king, QM would have been rejected.
      *   *Traditionalist Concession:* They might admit narrative is a *heuristic* for finding hypotheses (context of discovery), but not for justifying them (context of justification).
      *   *Unfalsifiability:* This is crucial. If every failure is blamed on "poor storytelling," the theory is vacuous. This is a vice for normative epistemology.

  5.  **Refining and Polishing (Self-Correction during drafting):**
