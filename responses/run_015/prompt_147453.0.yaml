  2.  **Analyze the Scandinavian Model (Norway/Sweden/Denmark):**

      *   *Philosophical Commitment:* Transparency as a mechanism for *horizontal accountability*. It's not just about the state knowing you; it's about you knowing your neighbor.
      *   *Trust:* High social trust, but specifically *institutional trust* coupled with *peer monitoring*. Trust isn't "blind"; it's "verified."
      *   *Autonomy:* Autonomy is relational. My autonomy is secured by ensuring the system is fair for everyone. Cheating hurts the collective, so exposing cheaters protects autonomy.
      *   *Lewisian Convention?* It looks like one (everyone expects everyone to be visible), but Lewis conventions are arbitrary equilibria. Tax transparency isn't arbitrary; it's normatively loaded. It solves a specific coordination problem (free-riding on public goods), but it relies on a prior normative agreement that equality is paramount.
      *   *Denmark Hybrid:* Distinguishes between *status data* (income/wealth -> public) and *intimate data* (health/politics -> private). This suggests a distinction between *civic standing* (public matter) and *personal integrity* (private matter).

  3.  **Analyze the US Model:**

      *   *Philosophical Commitment:* Privacy as a shield against power (both state and peer).
      *   *Trust:* Low institutional trust. The state is a potential tyrant; neighbors are potential judges/threats.
      *   *Autonomy:* Negative liberty (freedom *from*). Financial status is a private affair, not a civic datum.
      *   *Adversarial Setup:* Presupposes that information asymmetry protects the individual. Transparency empowers the powerful (to judge the weak) rather than empowering the weak (to check the elite).

  4.  **Address the Lewisian Convention Question:**

      *   David Lewis's *Convention* (1969) defines conventions as solutions to coordination problems where alternatives *could* have worked (arbitrariness).
      *   *Problem:* Tax transparency isn't arbitrary. It serves a specific normative end (equality/compliance).
      *   *Evolution:* Moving from paper to digital didn't change the norm, it lowered the cost of access. If it were purely Lewisian, a shift in technology might shift the equilibrium if costs changed. But the norm held.
      *   *Conclusion:* Lewis is insufficient. It requires a *normative* layer (a "moralized convention" or a "social contract" element) that Lewis explicitly tried to avoid. The Scandinavian stability comes from a shared conception of justice, not just mutual expectation.

  5.  **Address the Denmark Hybrid (Coherence Check):**

