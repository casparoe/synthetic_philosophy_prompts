answer: |-
  I need to begin with a crucial clarification: **No country currently operates a system matching this description.** There are no existing national "moral debt registries" where citizens enroll their lineage to determine tax liability for historical atrocities, nor are there mechanisms for "moral disavowal" to zero out such taxes, nor mandatory receipt policies for victim-descendants that override their autonomy.

  While nations like Germany (regarding the Holocaust), the US (regarding slavery and Indigenous dispossession), and South Africa (regarding Apartheid) have engaged in reparations, truth commissions, or restitution, none utilize the specific bureaucratic architecture you've described.

  However, treating this as a rigorous **philosophical thought experiment**, the system you've outlined is fascinating because it inverts several standard liberal intuitions about responsibility. Below is a reconstruction of the implicit theory, the philosophical commitments it demands, and how it contrasts with strict individualism.

  ---

  ### 1. Philosophical Commitments: The Continuous Moral Nation

  For this registry to function logically, it must presuppose a specific ontology of the State and the Self.

  *   **The State as a Trans-Generational Moral Agent:** The system assumes the Nation is not merely a legal contract between living citizens, but a continuous moral entity that persists across time. The "debt" belongs to the *State* as much as the individuals, but the State collects it via the lineage of the perpetrators.
  *   **Lineage as Moral Proxy:** It assumes that biological or cultural lineage is a valid proxy for moral standing. You are not taxed because *you* did something, but because you are the *continuation* of those who did.
  *   **Objective Harm vs. Subjective Complicity:** This is the core asymmetry. The system treats **harm** as an objective fact that creates an entitlement regardless of the victim's will, but treats **complicity** as a subjective status that requires some level of endorsement to remain binding.

  ### 2. Jaspers-Style Liability vs. Metaphysical Guilt

  Karl Jaspers, in *The Question of German Guilt* (1947), distinguished between four types of guilt: Criminal, Political, Moral, and Metaphysical. Your hypothetical system creates a hybrid that doesn't fit neatly into one category.

  *   **It begins as Political Guilt:** Jaspers defined Political Guilt as the liability all citizens bear for the actions of their state. In your system, the tax is a political liability inherited by lineage.
  *   **It is resolved via Moral Ritual:** The "moral disavowal" option transforms the liability. If guilt were purely Political (like a war debt), you couldn't opt out; you are a citizen, you pay. If it were purely Criminal, you couldn't inherit it. By allowing a "disavowal" to zero out the tax, the system treats the guilt as **Moral** (requiring personal conscience) but assumes it is **inherited by default**.
  *   **The Verdict:** It treats guilt like a **Metaphysical stain that is administratively manageable.** In Jaspers' view, Metaphysical guilt (solidarity with humanity) is transformed only through inner repentance. Here, the "disavowal" is a bureaucratic secularization of repentance. It suggests guilt *does* stick metaphysically (you are enrolled by default), but the State allows you to perform a ritual of separation to cleanse the financial consequence.

  ### 3. The Asymmetry: Why is Guilt Optional but Victimhood Mandatory?

  This is the most philosophically charged feature of the registry.

  **Guilt is Optional (The Disavowal Clause):**
  This presupposes that **moral agency requires consent.** Even if the debt is inherited, the *moral weight* of it cannot bind a liberal subject without their tacit approval. If I explicitly say, "I reject my ancestors' actions," the system concedes that my moral connection is severed. This protects the liberal individual from being crushed by collective sin, provided they perform the speech act of rejection.

  **Victimhood is Mandatory (No Opt-Out):**
  This presupposes that **justice is a public good that overrides individual autonomy.**
  1.  **The Debt is to Justice, Not Just the Person:** If a victim could opt out, the Perpetrator-State would be relieved of its duty to repair the moral order. The payment isn't just for the victim's benefit; it's for the nation's moral hygiene.
  2.  **Harm is Objective:** The system assumes the damage done by the atrocity altered the trajectory of the victim's lineage objectively. Whether the descendant *feels* victimized is irrelevant to the *fact* of the disadvantage. To allow them to opt out would be to allow them to deny historical reality.
  3.  **Preventing Coercion:** In a real-world power dynamic, victims might be pressured to "forgive and forget" to relieve the guilt of the majority. Making receipt mandatory protects the reparative process from being undermined by social pressure on victims to be "magnanimous."

  ### 4. Reconstructing the Implicit Theory

  **The Theory of Inherited Status with Volitional Cleansing:**
  *   **Axiom 1:** Historical atrocities create a moral imbalance that persists across generations.
  *   **Axiom 2:** The State is the custodian of this balance.
  *   **Axiom 3:** Descendants of perpetrators inherit a *presumptive* liability, but retain the *agency* to sever the moral tie through explicit disavowal.
  *   **Axiom 4:** Descendants of victims inherit an *objective* entitlement that cannot be waived, because the entitlement serves the restoration of the moral order, not merely individual enrichment.

  ### 5. Strict Requirements vs. Compatible Features

  To maintain this specific moral logic, certain features are essential, while others are merely implementation details.

  **Strictly Required (The Logic Holds Only If):**
  *   **Lineage Tracking:** There must be a way to categorize citizens by ancestral involvement. Without this, the intergenerational link is broken.
  *   **Asymmetric Agency:** Perpetrators must have a way to renounce; Victims must not. If victims could opt out, the "Objective Harm" axiom fails. If perpetrators *couldn't* opt out, the "Volitional Guilt" axiom fails (becoming pure collective punishment).
  *   **Financial Transfer:** The mechanism must be redistributive. If it were symbolic (e.g., apologies only), the "debt" metaphor collapses.

  **Merely Fits (Could Change Without Breaking the Theory):**
  *   **Tax vs. Labor:** The perpetrator contribution could be mandatory community service instead of tax, provided the "disavowal" exempts them from that too.
  *   **Registry vs. Census:** The state could determine lineage automatically via genealogy databases rather than requiring enrollment, provided the "disavowal" option remains.
  *   **Cash vs. Services:** Victim payments could be tuition vouchers or land grants rather than cash, provided they cannot refuse the benefit.

  ### 6. The Shift to Strict Individualism

  If we replaced the underlying view with one where **only present individuals can bear moral responsibility** (the standard Liberal-Individualist view), the entire registry would have to be dismantled. Here is what would change:

  1.  **Abolition of Lineage Taxes:** No citizen could be taxed for an act they did not commit. The "Perpetrator-Descended" category would vanish. Reparations would have to be funded by general taxation (shared political liability for the *current* state's failure to rectify, not personal guilt for past acts).
  2.  **Abolition of Lineage Payments:** Victims could not receive payments based solely on ancestry. Payments would need to be tied to **current, measurable disadvantage** traceable to the past act (e.g., wealth gap remediation) rather than "reparations" for the act itself.
  3.  **Full Autonomy for Recipients:** Under strict individualism, a beneficiary must be able to refuse a benefit. If the state forces money on an individual who rejects the "victim" label, it violates their autonomy. The "Mandatory Receipt" rule would be struck down.
  4.  **No "Moral Disavowal":** Since there is no inherited guilt to begin with, there is no need to disavow it. The concept becomes nonsensical.
  5.  **Focus on Forward-Looking Justice:** The system would shift from *Rectificatory Justice* (fixing the past) to *Distributive Justice* (fixing current inequalities). The moral language would change from "Debt and Guilt" to "Equity and Need."

  ### Summary
  The hypothetical registry you described is a **Collectivist-Expressivist** model. It uses bureaucracy to force a national conversation about guilt and harm. It assumes guilt is a cloud that hangs over a lineage until dispersed by speech (disavowal), but harm is a scar that remains regardless of perception. It prioritizes the **Nation's need to balance its moral ledger** over the **Individual's right to define their own moral identity**, specifically regarding victims, while paradoxically granting perpetrators the liberal right to define their own complicity.
