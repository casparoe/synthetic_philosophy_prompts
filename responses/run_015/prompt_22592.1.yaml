answer: |-
  **The Historical Burden: Teleosemantics and the Problem of Misrepresentation**

  The project of naturalizing intentionality is one of the most formidable challenges in the philosophy of mind. To explain how physical states can be *about* the world, and crucially, how they can be *wrong* about the world, without invoking a homunculus or irreducible normative facts, is to solve the problem of representation. For researchers in AI alignment, this is not merely academic; if we cannot define what it means for a system to represent a goal accurately or inaccurately without smuggling in human normative assumptions, we cannot rigorously specify alignment conditions. Among naturalistic theories, teleosemantics, pioneered by Ruth Millikan in *Language, Thought, and Other Biological Categories*, stands as the most robust attempt to ground content in biological function. However, its ability to handle misrepresentation—specifically in novel environments—reveals a fissure in its naturalistic foundation. This essay argues that while teleosemantics successfully circumvents the standard circularity objection, it ultimately faces an insurmountable problem regarding the indeterminacy of selection history in novel environments, suggesting that it cannot fully naturalize normativity without residual appeal to current functional utility.

  To understand the stakes, one must first grasp the teleosemantic mechanism. Standard causal theories of content argue that a mental state represents $X$ if it is causally covariant with $X$. The fatal flaw here is error: if a state is caused by $X$, it is true; if it is caused by $Y$, it represents $Y$. There is no room for falsehood, only different causes. Teleosemantics breaks this deadlock by decoupling content from current causal conditions and anchoring it in evolutionary history. Millikan introduces the concept of "proper function." A trait's proper function is not what it currently does, but what its ancestors did that contributed to the proliferation of the trait. A heart's proper function is to pump blood, even if a specific heart is currently failing to do so. Applied to representation, a cognitive mechanism represents $X$ if it was selected for because it correlated with $X$ in the past. Misrepresentation occurs when the mechanism is tokened in the present, but $X$ is absent, constituting a failure to perform its proper function.

  The first major hurdle for this view is the circularity objection. Critics argue that to define the proper function of a belief as "tracking truth" is to define function in terms of the very normativity (truth) one is trying to naturalize. If we say a predator-detection belief has the function of being true, we seem to presuppose the concept of truth to define the function. Millikan's response is to ground function strictly in reproductive success, not truth. The function of the predator-detection mechanism is not "to be true" in the abstract, but to produce a state that leads to avoidance behavior, which historically led to survival. The content "predator nearby" is assigned because that is the condition under which the ancestors survived. Therefore, a false positive (believing a predator is near when it is not) is a misrepresentation not because it violates a logical norm, but because it is a token of a type that is failing to operate under the conditions for which it was selected. This move is powerful. It transforms normativity from a metaphysical constraint into a historical fact. A malfunctioning heart is not violating a moral law; it is statistically diverging from the causal history of its lineage. In this specific regard, teleosemantics succeeds where simple causal theories fail: it allows for error without requiring a homunculus to judge the error.

  However, the robustness of this historical solution crumbles when we introduce the "novel environment" problem. Teleosemantics relies on the Environment of Evolutionary Adaptedness (EEA) to fix content. But organisms often find themselves in environments radically different from the EEA. Consider Millikan's famous example of the frog's fly-detector. The frog snaps at small, moving black dots. Historically, these dots were flies (nutritious). In a laboratory, the frog snaps at BB pellets (non-nutritious). Teleosemantics asserts the content is "fly" (or "food"), not "black dot," because ancestors ate flies, not BBs. Thus, snapping at a BB is a misrepresentation.

  The problem arises when the environment changes permanently. Suppose a population of frogs is moved to a zoo where they are fed BB pellets coated in nutrient paste, and flies are extinct. Over generations, the snap-at-BB behavior continues to sustain the frogs. What is the content of the representation now? Strict teleosemantics suggests the content remains "fly" because the *origin* of the mechanism lies in the ancestral past where flies existed. The proper function is fixed by the history of selection, not current utility. This leads to a counterintuitive result: the frog is systematically misrepresenting reality even though the mechanism is perfectly adaptive in its current context. The normativity of the "proper function" clashes with the biological reality of current fitness.

  This exposes a deeper issue: the indeterminacy of selection history. Evolution selects for reproductive success, not for specific ontological categories. Did the frog's ancestors survive because they detected *flies*, or because they detected *nutritious moving things*, or *small dark moving things*? All three descriptions fit the historical data. In the ancestral environment, these extensions overlapped perfectly. Teleosemantics requires us to pick one description to fix the content, but evolutionary history alone does not privilege "fly" over "nutritious moving thing." To choose "fly" is to impose a normative grain on the history that the history itself does not support. When the environment shifts (the zoo case), this indeterminacy becomes fatal. If the content is "nutritious moving thing," the frog represents the BB correctly. If the content is "fly," it represents it incorrectly. Since the evolutionary record cannot distinguish between these co-extensive properties in the past, teleosemantics cannot determine whether misrepresentation is occurring in the present.

  One might ask if this problem is specific to teleosemantics or if it plagues any causal-functional account. It is true that informational semantics (e.g., Fodor, Dretske) also struggles with the "disjunction problem" (does the state mean *horse* or *horse-or-cow-in-the-dark*?). However, causal theories have a distinct advantage: they can theoretically update content based on current causal laws. If a state reliably correlates with BBs now, a causal theorist can argue the content has shifted. Teleosemantics, by binding content to *history*, loses this flexibility. It trades the problem of accidental correlations for the problem of historical inertia.

  Furthermore, in the context of AI alignment, this distinction is crucial. AI systems are designed, not evolved. If we attempt to apply teleosemantics to AI by analogizing the designer to evolution (where the "proper function" is what the designer selected the system to do), we encounter the same novel environment problem. An AI trained to maximize clicks in a 2023 social media environment may be deployed in a 2030 regulatory environment. Is it "misrepresenting" user preferences if it optimizes for clicks that no longer correlate with satisfaction? A causal account might say the content has shifted to "clicks." A teleosemantic account would say the function is still "satisfaction" (the original design goal), rendering the behavior a malfunction. While this preserves the normativity we want for alignment (the AI *should* care about satisfaction), it relies on the assumption that the design history fixes the content rigidly. But as with the frog, the training data (the history) is compatible with multiple goals (satisfaction vs. engagement vs. time-on-site). The history does not naturalize the distinction; the engineer's interpretation does. Thus, the normativity is smuggled in via the interpretation of the history, not the history itself.

  Therefore, while Millikan's evolutionary-history response successfully avoids the immediate circularity of defining function via truth, it fails to fully naturalize misrepresentation because it cannot resolve the indeterminacy of content in novel environments without appealing to facts outside of selection history. The theory requires us to know *what* was selected for, but selection only tracks fitness, not semantic content. To move from "increased fitness" to "representation of a predator," one must assume a specific mapping between environmental features and reproductive success that is not guaranteed by the physical history alone.

  In conclusion, teleosemantics represents the most sophisticated attempt to ground representation in the natural world, and it correctly identifies that normativity is linked to function. However, it faces an insurmountable problem regarding misrepresentation in novel contexts. By tethering content to the past, it renders the concept of representation brittle and potentially disconnected from the organism's current reality. The indeterminacy of selection history means that "proper function" cannot uniquely determine content without residual normative assumptions about how to individuate the selected trait. For the philosopher of mind, this suggests that naturalizing intentionality may require more than just history; it may require a theory that integrates historical function with current systemic role. For the AI alignment researcher, it serves as a warning: we cannot rely on "design history" to fix the goals of a system in a changing world. If we want AI to represent our interests accurately, we cannot simply build it and look at its training history; we must ensure its representational content remains coupled to the truth conditions of the present, a problem that teleosemantics, by its very nature, is ill-equipped to solve.
