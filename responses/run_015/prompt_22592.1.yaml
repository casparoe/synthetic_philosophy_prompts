      *   "Reach and justify a conclusion." -> Make sure the ending is decisive.

  *(Self-Correction on Conclusion)*: I should be careful not to say it's *useless*. It's the "most serious attempt." The conclusion should be that it fails to *fully* naturalize normativity, but it identifies the correct locus of the problem (history vs. current conditions). I will argue it faces an insurmountable problem regarding the *individuation* of content in novel contexts.

