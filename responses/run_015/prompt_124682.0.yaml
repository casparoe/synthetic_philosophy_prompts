      *   *Key Distinction:* The law treats the human being as having two interests: integrity of the vessel (body) and quality of the experience (mind). "Pain and suffering" targets the latter.
      *   *Verdict Formulation:* Needs to be a single view. "Affective-Motivational Theory" or "Evaluativism" or "Suffering-Centric View." "Affective-Motivational" is the most precise philosophical label for the distinction between sensory and affective components.

  7.  **Final Polish:**
