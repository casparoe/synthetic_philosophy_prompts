answer: |-
  The institutional pattern described in personal-injury litigation presupposes an **Affective-Motivational Theory** of pain's badness. Under this view, the disvalue of pain does not reside in the raw sensory-discriminative quality (the "nociceptive signal" or intensity) but rather in its negative affective valence (the "unpleasantness") and its capacity to disrupt agency and behavior (the "suffering").

  **Reconstruction of the Implicit Theory**
  The legal system implicitly bifurcates harm into two categories: *structural/functional harm* and *experiential harm*.
  1.  **Structural Harm:** Compensated via medical expenses and impairment ratings. This treats the body as property or a functional vessel. Damage here is objective and compensable regardless of subjective awareness.
  2.  **Experiential Harm ("Pain and Suffering"):** Compensated based on the negative impact on the plaintiff's conscious life.

  For the second category, the law operates on the premise that a sensation is only legally cognizable as "pain" (in the damages sense) if it is *suffered*. This aligns with the philosophical distinction between the sensory component of pain (location, intensity, quality) and the affective component (unpleasantness, distress). The practice strictly requires the presence of the affective-motivational component to award non-economic damages. It accommodates sensory intensity only insofar as it serves as heuristic evidence of likely suffering; however, when sensory intensity is decoupled from suffering (as in pain asymbolia), the law treats the sensory component as ethically and legally weightless regarding "pain and suffering" damages.

  **Consistency Regarding Structural Injury**
  The willingness to compensate purely structural injury without any felt component is consistent with this theory, provided one accepts the legal distinction between *loss of function* and *loss of well-being*. If the theory of pain's badness is that pain is bad *because* it causes suffering, then tissue damage that causes no suffering is not "painful harm," but it remains "physical harm." The legal system compensates the latter under a different rationale (restoration of the asset/body), not under the rationale of pain's badness. Therefore, compensating a severed nerve that feels nothing is consistent with the view that *pain* requires affect, because the compensation is for the *nerve*, not the *pain*.

  **Counterfactual: If Badness Resided in Sensory Intensity**
  If the badness of pain were located entirely in sensory intensity (a Sensory-Discriminative Theory), the current legal practice would be unjust. To align with such a theory, courts would have to:
  1.  **Decouple damages from behavior:** A plaintiff showing no withdrawal behavior or distress but verifying high nociceptive firing (via neuroimaging or nerve conduction studies) would receive maximum "pain and suffering" awards.
  2.  **Eliminate credibility assessments based on affect:** Testimony describing the pain as "neutral" or "curious" would not reduce damages if the sensory intensity were objectively verified.
  3.  **Reclassify Asymbolia:** Patients with pain asymbolia would be treated as severely injured regarding non-economic damages, equivalent to those who scream and writhe, because the "bad thing" (the intense sensation) is present in both.

  **Strict Requirements vs. Accommodations**
  *   **Strict Requirement:** To recover for "pain and suffering," the plaintiff must demonstrate a negative qualitative experience (distress, annoyance, fear) or behavioral disruption caused by the sensation. Without the "suffering" component, there is no recoverable non-economic harm, regardless of neural firing rates.
  *   **Accommodation:** The law accommodates the correlation between nociception and suffering by allowing sensory descriptions to serve as *prima facie* evidence of distress. It does not strictly require fMRI scans to prove affect, but it strictly requires the *report* or *demonstration* of affect to validate the claim.

  **Conclusion**
  The disparity described confirms that the legal system does not view nociception as intrinsically harmful in the context of tort damages. It views the *reaction* to nociception as the harm. A view holding intense nociception as intrinsically harmful could not justify the disparity; it would demand equal compensation for the asymbolic plaintiff. Thus, the practice implicitly treats sensory intensity without suffering as weightless for non-economic damages, reserving compensation for the disruption of the subjective life of the plaintiff.

  Verdict: The Affective-Motivational Theory of Pain's Disvalue
