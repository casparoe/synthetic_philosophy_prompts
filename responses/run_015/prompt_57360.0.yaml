answer: |-
  # JOINT STATEMENT OF THE ACQUISITIONS AND DESCRIPTION COMMITTEE
  **Subject:** The Residential Institution Collection (Closed 1974)
  **Date:** 14 October 2023
  **Signatories:** The Custodial Impartialists; The Reparative Interventionists

  ## 1. Agreed Claims

  The following propositions are accepted by both camps as factual premises for this case. Signing this document indicates agreement that these claims are true, not that they are sufficient to determine action.

  1.  **Silence in the Source:** The institutional records contain no first-person accounts created by the children at the time of residence. Their presence in the record is exclusively as subjects of administration. Both camps agree this is a gap in the evidentiary record of the institution's daily life.
  2.  **Silence in Survival:** **[Stipulation]:** We accept as fact that approximately 15% of the admission registers from the period 1960–1965 are missing from the series, with no destruction schedule extant to explain their absence. Both camps agree this constitutes a loss of evidence whose cause is now unknowable.
  3.  **Silence in Description:** The existing finding aid (1980s) utilises the institution's administrative vocabulary (e.g., 'Inmate', 'Sanction', 'Case'). Both camps agree that this vocabulary renders specific individuals difficult to identify by name without prior knowledge of the administrative structure.
  4.  **Silence in Access:** Two distinct barriers exist. First, the inspection report annexes are legally closed until 2049 under the 1974 deposit deed. Second, the oral testimony tapes are physically inaccessible to the general public due to format obsolescence. Both camps agree these barriers prevent consultation.
  5.  **Physical State:** The magnetic tape format of the oral testimony is chemically unstable. **[Stipulation]:** Conservation assessment confirms a high probability of binder hydrolysis rendering playback impossible within ten years without intervention. The paper registers are chemically stable.
  6.  **Legal Status:** The deposit deed is a binding legal instrument between the successor public body and the repository. Both camps agree that breaching it carries legal risk, though they differ on whether that risk is acceptable.
  7.  **Inevitability of Selection:** Both camps acknowledge that the repository cannot preserve everything nor describe every item with infinite granularity. Resource constraints necessitate choice.

  ## 2. Terminology Audit

  The following terms are used by both camps in this document. Where definitions diverge, the divergence is recorded here to prevent verbal disputes masking substantive ones.

  | Term | Custodial Impartialists (Camp A) | Reparative Interventionists (Camp B) | Residual Disagreement |
  | :--- | :--- | :--- | :--- |
  | **Neutrality** | The absence of the archivist's voice in the description. The record must speak in the creator's voice. | An impossibility. 'Neutrality' is merely the concealment of the archivist's endorsement of the creator's power. Transparency of bias is the only achievable standard. | Whether the archivist's voice is a contaminant (A) or an unavoidable variable that must be managed (B). |
  | **Evidence** | The record as a trace of a transaction that occurred. Its value lies in its authenticity as an unselfconscious by-product of business. | The record as a trace of power relations. Its value lies in what it reveals about who could speak, who was spoken for, and who was silenced. | Whether the archive's primary duty is to the *transaction* (A) or to the *power dynamic* (B). |
  | **Provenance** | The organic origin of the record. Records must remain with the creator's other records to maintain context. | The community of record. Records regarding a specific group (e.g., the children) may be intellectually reunited regardless of creator origin. | Whether provenance is a physical/organic constraint (A) or a functional/ethical opportunity (B). |
  | **Intervention** | Any alteration to the record's order, description, or access status that deviates from the creator's original system. | Any decision regarding appraisal, description, or access. To do nothing is to intervene on the side of the status quo. | Whether intervention is a deviation from a norm (A) or the fundamental condition of archival work (B). |
  | **Silence** | An absence of data. The archivist's duty is to note the absence, not to fill it. | An active production. The archivist's duty is to interrogate the cause of the absence and, where possible, mitigate it. | Whether silence is a void to be mapped (A) or a wound to be treated (B). |

  ## 3. Table of Residual Disagreements

  The following table isolates the specific points on which the camps disagree regarding the four matters before the committee.

  | Issue | Custodial Impartialists (Camp A) | Reparative Interventionists (Camp B) | Operational Impact |
  | :--- | :--- | :--- | :--- |
  | **1. Oral Testimony Arrangement** | The testimony must be accessioned as a separate fonds (e.g., 'Residents' Association Papers'). Integrating it into the Institutional Papers conflates two distinct provenances and compromises the evidentiary integrity of the administrative series. | The testimony must be catalogued within the Institutional Papers series (e.g., as a parallel sub-series). Separating them reinforces the institutional silencing of the children by physically distancing their voices from the records of their confinement. | **Yes.** Determines catalogue structure and reference codes. |
  | **2. Closure of Annexes** | The repository must adhere to the 75-year closure specified in the deed. To do otherwise violates the legal agreement under which the records were transferred and damages trust with future depositors. | The repository must petition the successor body to open the annexes immediately. The closure protects the institution's reputation, not the subjects' welfare, and perpetuates silence regarding potential abuse. | **Yes.** Determines immediate public access. |
  | **3. Re-description** | The original vocabulary ('Inmate', 'Sanction') must be retained in the catalogue to evidence the institution's mindset. Glosses may be added, but the original terms must remain the primary search entry. | The original vocabulary must be replaced or superseded by contemporary, person-centred language ('Resident', 'Disciplinary Measure'). Retaining the original terms as primary entries causes harm and reproduces the institution's dehumanisation. | **Yes.** Determines catalogue display and metadata schema. |
  | **4. Digitisation Priority** | Priority must be given to the Registers. They are stable, heavily consulted, and central to the provenance of the institution. Digitisation should follow demand and preservation stability. | Priority must be given to the Oral Testimony. It is at immediate risk of physical loss and represents a counter-record. Digitisation should follow vulnerability and ethical necessity. | **Yes.** Determines budget allocation for the current fiscal year. |

  ## 4. The Cruxes

  The following are the specific sub-questions upon which the disagreement turns. We record our predictions here to allow for future verification.

  **Crux 1: The Effect of Integration on Researcher Understanding**
  *   **Question:** Does integrating the oral testimony into the institutional series confuse the user regarding the provenance of the information, or does it facilitate a necessary contextual reading?
  *   **Evidence Required:** A user study tracking citation accuracy and researcher satisfaction over ten years.
  *   **Camp A Prediction:** In ten years, citation errors will increase by at least 20% in integrated catalogues, with researchers mistakenly attributing oral testimony as contemporary administrative evidence.
  *   **Camp B Prediction:** In ten years, qualitative analysis of the institution will increase by at least 50% in integrated catalogues, as researchers are forced to confront the counter-narrative alongside the administrative record.

  **Crux 2: The Function of Closure**
  *   **Question:** Does the 75-year closure primarily protect living individuals' privacy, or does it protect the successor body from liability and reputational damage?
  *   **Evidence Required:** A redaction audit of the annexes to determine the nature of the sensitive data (e.g., names of living staff vs. names of deceased children). **[Stipulation]:** We agree to commission an independent sample review of 10% of the annexes to determine the ratio of living to deceased subjects mentioned.
  *   **Camp A Prediction:** The review will show that opening the records now would expose the identities of living former staff and children, violating data protection norms.
  *   **Camp B Prediction:** The review will show that the majority of sensitive data concerns deceased individuals or institutional processes, and that 'privacy' is being used as a proxy for institutional reputation management.

  **Crux 3: The Metric of Stewardship**
  *   **Question:** Is the primary metric for digitisation 'preservation of the most used' or 'preservation of the most at-risk'?
  *   **Evidence Required:** A ten-year audit of digitisation project outcomes across the sector.
  *   **Camp A Prediction:** Prioritising at-risk materials with low current demand results in 'digital dark archives' with negligible public engagement and poor return on public investment.
  *   **Camp B Prediction:** Prioritising high-demand materials entrenches existing research biases, ensuring that marginalised voices (which are by definition less consulted) are lost permanently.

  ## 5. Joint Recommendations

  On the following matters, the Committee records its recommendations. Where consensus was not reached, the divergence is recorded explicitly.

  **Matter 1: Oral Testimony Arrangement**
  *   **Recommendation:** **Divergent.**
  *   **Camp A:** Accession the testimony as a separate fonds (Ref: D/RA). Create a 'see also' cross-reference in the Institutional Papers finding aid.
  *   **Camp B:** Accession the testimony as Series 12 within the Institutional Papers (Ref: D/INST/12). Maintain the intellectual link between the child's record and the child's testimony.
  *   **Point of Divergence:** Whether provenance is defined by the *creator of the record* (A) or the *subject of the record* (B).

  **Matter 2: Closure of Annexes**
  *   **Recommendation:** **Divergent.**
  *   **Camp A:** Maintain the 75-year closure as per the deed. Prepare a briefing paper for the successor body explaining the historical value, but do not advocate for breach of contract.
  *   **Camp B:** Formally petition the successor body to waive the closure clause immediately, citing the public interest and the welfare of the recorded subjects. Prepare to accept legal liability if the petition is rejected but access is granted.
  *   **Point of Divergence:** Whether the archivist's duty to the *donor agreement* (A) supersedes the duty to the *public interest/subjects* (B).

  **Matter 3: Re-description**
  *   **Recommendation:** **Convergent (Procedural).**
  *   **Joint Action:** The catalogue will be updated to include a 'Language Note' explaining the original terminology.
  *   **Camp A Condition:** The original terms must remain the primary metadata field for search and retrieval. The new terms are secondary glosses.
  *   **Camp B Condition:** The new terms must be the primary display text for users. The original terms are visible only upon expanding the record detail.
  *   **Point of Divergence:** While both agree on the *presence* of both vocabularies, they disagree on which vocabulary constitutes the *default* user experience. Technical implementation will proceed only when the repository's IT system can support both views simultaneously.

  **Matter 4: Digitisation Priority**
  *   **Recommendation:** **Divergent.**
  *   **Camp A:** Allocate budget to the Registers. This serves the highest number of current users and secures the core evidentiary backbone of the collection.
  *   **Camp B:** Allocate budget to the Oral Testimony. This secures the only surviving record of the children's voices before it is physically lost.
  *   **Point of Divergence:** Whether stewardship is defined by *current demand* (A) or *future loss prevention* (B).
  *   **Compromise Stipulation:** **[Stipulation]:** The Committee agrees to seek external emergency funding specifically for the tapes. If this funding is not secured within six months, Camp B concedes to the digitisation of the Registers to ensure *some* digitisation occurs, but will record a formal dissent in the annual report.

  ***

  **Signed,**

  *For the Custodial Impartialists*
  *For the Reparative Interventionists*
