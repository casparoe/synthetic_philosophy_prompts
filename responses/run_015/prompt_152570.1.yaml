answer: |-
  hey, this is a killer topic for a sci-fi group. honestly most worldbuilding skips the micro-ethics entirely so you're already ahead.

  here's the locked order for the teaching plan. if you swap these, the logic collapses and they'll bail.

  **the arc (strict order)**

  1.  **hook:** start with the intuition. ask "why do we swat flies but hesitate to kick dogs?" don't answer yet.
  2.  **uncertainty premise:** establish that we *don't know* if bugs feel pain, but we also don't know they *don't*.
      *   *defuse misconception #1 here:* "if we can't know then it's moot."
      *   *counter:* in worldbuilding (and ethics), acting on uncertainty is the default. we build safety margins for bridges even if we aren't 100% sure of the load. treat sentience like a structural load.
  3.  **visibility bias (your niche framing):** insert this now. explain that we assign low probability to bug sentience bc they don't scream or bleed red when poked.
      *   *why here:* this explains *why* they think the probability is low. it validates their gut feeling before you challenge it.
  4.  **the math concept (no calculus):** introduce the multiplier. small chance × huge number = big number.
      *   *defuse misconception #2 here:* "low probability means basically zero."
      *   *counter:* 0.01% sounds small until you multiply it by 10 quadrillion. show them the zeros.
  5.  **the carrying example (silk vs. wheat):**
      *   *what to have:* contrast the visible death (silk moths boiled) vs the invisible death (pesticide runoff). show the population counts side-by-side.
      *   *what to avoid:* do not let them conclude "agriculture is impossible." keep it focused on the *comparison of ethical weight*, not solving hunger. also don't let them merge the uncertainty—keep the "chance of sentience" separate from the "number of deaths."
  6.  **the cow objection:**
      *   *defuse misconception #3 here:* "killing one cow is still worse."
      *   *counter:* agree that 1 cow > 1 bug. but ask if 1 cow > 1 trillion bugs. force them to find the tipping point.
  7.  **application:** how does this change their sci-fi societies? do they have insect rights? do they eat synthetic protein?

  **what to refuse to explain**

  be explicit about this so they don't think you're dodging. say:
  *   "we aren't doing formal expected-value calculus today. i'm not writing formulas on the board, we're doing intuition pumps."
  *   "we aren't splitting hairs on phenomenal vs access consciousness. for worldbuilding, if it reacts like it suffers, we treat it like it suffers."
  *   *why:* keeps it practical for writers. you're building stories, not peer-reviewed papers.

  **the check-in question**

  don't ask "do you agree?" ask this:

  "if your alien civilization discovers the insect population is actually 99% smaller than we thought, does the ethical urgency drop even if the chance of sentience stays the same? why?"

  (if they say yes, they get the scale dependency. if they say no, they're still stuck on probability alone.)

  **quick note on the silk/wheat example**

  make sure you emphasize that wheat fields are basically insect cities. silk is industrial farming, wheat is accidental genocide. the contrast works best if they realize the wheat farmers *don't even see* the bodies. that ties back to your visibility bias point.

  you got this. ten people is the perfect size to really dig in without getting chaotic. let me know if you need help with the handout visuals.
