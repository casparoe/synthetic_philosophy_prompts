  She swears the soil is ancient,
  Bound by maps newly printed.
  We argue at the border,
  Of veins filled with blood,
  A unified language,
  Invented only yesterday.

  No nation lived in yesterday,
  But constructed as ancient.
  Philologists fixed the language,
  On pages broadly printed.
  To purify the blood,
  And police every border.

  They drew the border,
  Erasing complex yesterday.
  No mythic blood,
  Just lexicographers calling it ancient.
  Dictionaries printed,
  Killing the living language.

  Standardising language,
  Hardening the border.
  By typeset printed,
  Norms from yesterday.
  Made to seem ancient,
  Thicker than blood.

  Not in the blood,
  But in the language.
  A past made ancient,
  Across the border.
  Constructed yesterday,
  On paper freshly printed.

  The grammar printed,
  Is not in blood.
  It started yesterday,
  This standard language.
  A porous border,
  Pretending to be ancient.

  Nothing was real yesterday,
  Until deemed ancient.
  Printed blood guards the border language.
