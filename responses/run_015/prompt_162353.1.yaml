answer: |-
  This is a classic problem in legal philosophy, specifically the intersection of **Hans Kelsen's Basic Norm**, **H.L.A. Hart's Rule of Recognition**, and the **Gödelian loopholes** that Nomic exploits. Your intuition is fighting against the "math" of the system because you are writing a *constitution*, not a *puzzle*. A constitution's job is to survive; a puzzle's job is to be solved.

  Your gut is telling you that the **identity of the system** matters more than the **arithmetic of the vote**. You are instinctively a *Constitutionalist*, not a *Nomic Player*.

  Here is a principle that captures your verdicts, a speech for the floor, the hard truth about the case you're dodging, and a defense against your partner.

  ### The Principle: The Doctrine of Procedural Fidelity

  **The Maxim:** *"The Amendment Power is a Trust, Not a Property."*

  **The Rule:** A change is valid only if it utilizes the amendment power exactly as constituted at the moment of voting, without altering the definitions of the vote itself, without bundling distinct procedural hurdles, and without reaching backward in time. You may increase the friction of the system, but you may not lubricate it by redefining the machine.

  **The Floor Speech (for your staunchest Justice):**
  > "Counselor, you speak of numbers. I speak of the machine that counts them. You say a majority passed this. I say a majority of *what*? Of the electorate as it stood yesterday, or the electorate you conjured into existence today? You say you lowered the threshold. I say you dug a tunnel under the wall we were sworn to climb.
  >
  > Here is the law: **You may build a higher wall, but you cannot dig a tunnel under the foundation. You may lock the door behind you, but you cannot claim you locked it yesterday. And you cannot call a key a lock just because you hold the majority.** If you change the rules of the game, you must play by the old rules until the new ones are law. If you try to change the players, the score, and the clock in a single breath, you are not amending the Code. You are ending the Republic."

  ### How This Principle Maps to Your Verdicts

  This principle saves **1, 2, 3, 4, 5, 6, and 7**. It aligns perfectly with your intuitions because it prioritizes *process integrity* over *outcome efficiency*.

  *   **Case 1 (Upward Ratchet):** **Valid.** Building a higher wall is allowed. It preserves the trust.
  *   **Case 2 (Downward Ratchet):** **Invalid.** Digging a tunnel. You are reducing the protection of the system without the protection's consent.
  *   **Case 3 (Self-Immunity):** **Valid.** Locking the door behind you. At the moment of enactment, the rule was valid. It binds the future, not the moment that created it.
  *   **Case 4 (Bundling):** **Invalid.** You cannot change the lock and use the key in the same motion. Sequence is part of the procedure. Bundling evades the friction intended by the two-step process.
  *   **Case 5 (Redefinition):** **Invalid.** Calling a key a lock. This is semantic evasion. "Majority" is a term of art with a fixed meaning in the Code's lexicon; redefining it to bypass a threshold is bad faith.
  *   **Case 6 (Poison Pill):** **Valid.** This is substantive policy, not procedural evasion. The system is allowed to commit suicide if the rules for suicide are followed.
  *   **Case 7 (Retroactive Cure):** **Invalid.** Claiming you locked it yesterday. Temporal fixity is absolute. A failed vote is a historical fact, not a legal error subject to correction.

  **Where it bleeds:**
  To be honest, this principle is **rigid**. It cannot save a scenario where the Assembly *needs* to act quickly to prevent collapse but is bound by a "two-step" rule (Case 4) or a "no retroactivity" rule (Case 7) that makes survival impossible. It prioritizes the *purity of the law* over the *survival of the state*. If your plot requires the Assembly to be pragmatic, this principle will break.

  ### The Dodging Case: Changing the Electorate

  **Scenario:** The Assembly redefines who counts as a voter (e.g., enfranchises outer islands) and the *new* electorate then ratifies the change.

  **Prediction under Procedural Fidelity:** **Invalid (or at best, Voidable).**

  **Why:** This is the nuclear version of Case 5 (Redefinition). In Case 5, they redefined the *weight* of the vote. Here, they are redefining the *source* of the authority.
  If the old electorate passes the change by the old rules, it is technically valid *as a statute*, but it constitutes a **revolution**, not an amendment. By handing the ratification to the *new* voters, they are admitting the old voters lacked the legitimacy to finalize the change.
  *   **The Hole:** If the old electorate passes it by the required margin, the law *says* it's valid. But the *principle* says the sovereign people have been swapped without their consent.
  *   **Dramatic Advice:** Have a character argue that the first vote was valid, but the second vote (by the new electorate) was an illegal usurpation. Or, have the Court rule that changing the "Constituent Power" (the People) requires **Unanimity**, because you cannot bind those who were not previously bound without their consent. This creates immediate, high-stakes conflict.

  ### Your Partner's Critique: The Ratchet

  **Is she right?**
  **Yes.** Absolutely. Your verdicts are a ratchet.
  *   Thresholds go up easily (Case 1).
  *   Thresholds go down rarely/never (Case 2).
  *   Retroactivity is banned (Case 7).
  *   Procedural shortcuts are banned (Case 4).

  This is **Conservatism** in the literal sense: conserving the existing order against the passion of the momentary majority.

  **Is it defensible?**
  **Yes.** And here is the argument your conservative character should use to shut down the critique:

  > "You call it a ratchet. I call it a keel.
  >
  > A ship without a keel turns faster, yes. It is more 'democratic' in its responsiveness to every gust of wind. But it capsizes in the first storm. This Republic is not a town meeting. It is a machine designed to outlive us.
  >
  > If we allow the majority to lower the threshold for the next majority, we invite a spiral. First, they lower the vote to 50%. Then they redefine 'vote' to mean 'show of hands.' Then they redefine 'hands' to mean 'those present.' Within a year, the Code is whatever the loudest man in the room says it is.
  >
  > The ratchet is not a bug. It is the only thing preventing the law from becoming a weapon. We dress it up as jurisprudence because if we called it 'conservatism,' you'd vote to repeal it. But make no mistake: **It is easier to bind your children than to unbind yourself.** That is not justice. That is survival."

  ### Summary for the Novel

  1.  **The Principle:** **Procedural Fidelity.** (You can't change the rules of the game while playing the hand).
  2.  **The Speech:** "Build the wall, don't dig the tunnel."
  3.  **The Electorate Case:** Treat it as a **Revolution**. It breaks the chain of legitimacy.
  4.  **The Partner:** She is right about the ratchet, but wrong that it's a flaw. It's the central tension of your book: **Stability vs. Flexibility.**

  Your confusion comes from trying to solve a logical paradox (Nomic) when you are actually writing a political tragedy (Constitutionalism). In Nomic, the goal is to win. In your book, the goal is to endure. Trust your gut; it knows the difference.
