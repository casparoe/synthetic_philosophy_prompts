          *   In the dataset case, if A's choice drastically harms B, do we really want to grant A a *liberal right* to decide unilaterally? Usually, we treat that as a negotiation or regulation problem, not a rights problem.
          *   *Crucial Point:* Sen's paradox holds even when the externalities are *mediated only by preferences* (meddlesome preferences), not just physical consequences.

      *   **Why "Liberalism" and not "Coordination Failure"?**
          *   Coordination failure implies there *is* a solution if we communicate or bind contracts.
          *   Sen's result is an *impossibility theorem*. No social welfare function can satisfy both conditions simultaneously, regardless of communication.
          *   It challenges the *compatibility of values*, not just the mechanism.
          *   Liberalism is a deontological constraint (rights trump outcomes). Pareto is consequentialist (outcomes trump process). The paradox shows they collide.

