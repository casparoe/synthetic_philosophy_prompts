      *   **Clarify the "Liberal" Condition:** This is the crux. Sen's condition isn't just "everyone controls a variable." It's "everyone controls a pair of social states that differ *only* in their personal characteristic."
          *   *Example:* Lady Chatterley. Prude vs. Lewd.
