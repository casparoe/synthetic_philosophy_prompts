answer: |-
  **SEMINAR TREE: MARY'S ROOM (DRAFT 4)**
  *use this to trap undergrads who think they read the wiki page*

  **START:** When Mary walks out of the room and sees red for the first time, does she learn something **true** that she literally could not have said was true while inside?

  *   **NO** (She knew all the truths already)
      *   **Q:** Did she just gain a **skill** (like learning to ride a bike or recognize a face) OR did she just realize her old brain states were already **representing** red all along?
          *   **Skill** -> **LEAF: The Ability Hypothesis** (She doesn't know *more*, she can just *do* more.)
          *   **Realization** -> **LEAF: Representationalist Denial** (Qualia are just representations; she didn't learn a new fact, she just accessed the file directly.)

  *   **YES** (She learns a new truth)
      *   **Q:** Does this new truth prove the world contains **extra non-physical stuff** (like ghostly color properties physics missed)?
          *   **YES** -> **LEAF: Jackson's Original View** (Physicalism is false. Mary found the missing ingredient.)
          *   **NO** (Physicalism is still safe)
              *   **Q:** Is the new truth just about her own **perspective/location** (like knowing "I am here" vs "You are there") OR is it about how her mind **categorizes** the physical data?
                  *   **Perspective** -> **LEAF: Unnamed Indexical Spot** (She learns "this experience is happening to *me* now," no new ontology needed.)
                  *   **Categorization** -> **LEAF: Phenomenal Concept Strategy** (She gains a new concept for the same physical fact.)

  ***

  **PROBLEM ZONE / FLAGS:**
  *   **The Blur:** Look at **Ability Hypothesis** vs. **Phenomenal Concept Strategy**.
      *   *Issue:* Both say physicalism survives. Both say there's no metaphysical gap. But one says "it's a skill" and the other says "it's a new concept."
      *   *Diagnosis:* **Unexplored territory / Verbal dispute.** Honestly, is having a new concept just a cognitive skill? If I can recognize red, do I have the concept? The tree forces a split here that might not exist in the brain. It's not incoherent, but it's messy. If a student argues "knowing what it's like IS knowing how to remember it," the tree breaks.
  *   **The Blur 2:** **Unnamed Indexical** vs. **Phenomenal Concept**.
      *   *Issue:* Both deny new ontology.
      *   *Diagnosis:* **Unattractive.** The Indexical view feels too thin. Knowing "I am here" doesn't capture the *richness* of seeing red. It saves physicalism but kills the phenomenon.

  ***

  **MY STANCE (FOR THE SEMINAR):**
  Look, I'm planting my flag on the **Phenomenal Concept Strategy (PCS)**. Here's why the other branches rot:

  1.  **Jackson is dead.** We know too much about neuroscience now. There isn't a "ghost dust" missing from the physical story. If you choose Jackson, you're buying dualism, and I'm not paying that tax.
  2.  **Ability is too thin.** Mary doesn't just learn *how* to react. She learns *what it is*. There's a cognitive content there, not just a motor skill.
  3.  **Representationalism ignores the feel.** Saying "it's just representation" skips the hard part—why does representation *feel* like something?
  4.  **Indexical is cowardly.** Saying she just learns "this is happening now" ignores that she learns something about *redness*, not just timing.

  **PCS holds up** because it respects the intuition (yes, she learns something new!) without blowing up science. It says the *world* didn't change, only her *mental file folder* did. She gets a new way to think about the same physical state. It's the only branch that lets you keep your physicalist card while admitting Mary's experience is real. It's not perfect—see the "Problem Zone" above about skills vs. concepts—but it's the only one that doesn't require magic or lying about what knowledge is.

  *note to self: make sure character emphasizes the "file folder" analogy, students get that.*
