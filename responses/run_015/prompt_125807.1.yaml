      6. Final verdict.

      *Wait, one more check:* The colleague says "derived intentionality... can arise whenever a design-stance target exhibits rationally predictable behavior." Dennett distinguishes Design Stance (physical function) from Intentional Stance (beliefs/desires). A two-bitser is usually analyzed via the Design Stance (if I put 2 bits, it gives soda). We *can* use the Intentional Stance (it 'wants' to give soda, 'believes' 2 bits were inserted). The colleague conflates Design and Intentional slightly, or assumes Design warrants Intentional. This is a Dennettian move, but needs precision. I will note this.

