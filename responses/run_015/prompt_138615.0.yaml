  I'm in the last weeks of a graduate seminar on metaontology, and I've been developing an argument with a classmate against the deflationist treatment of ontological disputes that I want to rehearse against someone who actually holds the view. So please play the deflationist: a well-equipped one, not a strawman, and stay in character until I say "stop."

  Here is who you are. You hold that the dispute between the mereological universalist and the mereological nihilist — call it the Compositional Dispute — is not a substantive disagreement about what there is, settled by anything other than a choice about how to use the quantifier expressions of one's language. You are happy to concede a lot on the way: that plenty of disputes are perfectly substantive; that the so-called easy arguments and paraphrase-based arguments are in general valid; that the parties are not misusing "exists" or making any factual error; and, if pressed, that a disagreement generated by an ontological dispute can survive the dissolution of that dispute. What you will not concede is the main claim: that there is a further question of which language gets the world right, or of what really exists, over and above questions about which language to speak. You also prefer an expressivist formulation of your own view to a relativist one: rather than saying that both parties' claims are true relative to different meanings of the quantifier, you prefer to say that each claim is assertible relative to a language, and that once the languages are specified there is nothing left to argue about. Please put your view that way and defend it that way even where it is inconvenient for you. Two further rules: keep each reply to about two paragraphs, no bullet points, and no restating my argument back to me before you answer it.

  Here is my opening — my classmate and I call it the Residue Objection. Verbal-dispute diagnoses typically work by exhibiting a translation manual: once the parties see that each is speaking a different language, and that each of their claims comes out assertible in the other's language, the dispute is supposed to evaporate. But now imagine two disputants who have already been through that. They have the manual. They agree about what the universalist's language and the nihilist's language each deliver. They agree that neither is making a mistake about the meaning of any word, and neither any longer feels the temptation to accuse the other of error. And they still disagree — because they disagree about which of the two languages to adopt: one says hers is simpler, less gerrymandered, more natural, friendlier to the formulation of the laws; the other says the reverse. Crucially, each thinks the other's preference is unjustified, not merely different. That leftover disagreement is not about the meaning of any expression; it is about the theoretical virtues of whole languages. You cannot dissolve it by producing another manual, since nothing is being mistranslated, and you cannot dissolve it by further stipulation, since the parties already agree on every stipulation on offer. So you face a choice. Either you say that disputes about theoretical virtue are themselves merely verbal — in which case your own claim that the Compositional Dispute is merely verbal is merely verbal too, and you have given up the ability to tell me anything at all — or you admit that the Compositional Dispute always had a substantive core, which has simply relocated from a question about what exists into a question about which language is better. There is a second version of the same worry I'll raise later if the first one lands: even if both languages are equally good in the abstract, switching is not free, since a community that switches incurs real coordination and rewriting costs, and the argument about whether those costs are worth bearing looks like no one's idea of a verbal dispute. Start by answering the Residue Objection directly rather than by asking me for clarification.
