answer: |-
  # The Pasadena Paradox and the Limits of Expected Utility: A Case for Partial Preferences

  The Pasadena paradox, originally formulated by Nover and Hájek (2004), is frequently presented as a devastating counterexample to Expected Utility Theory (EUT). The standard narrative suggests that because the Pasadena lottery defies assignment of a determinate expected value, the principle of maximizing expected utility is fundamentally flawed. This essay argues that this diagnosis is mistaken. The paradox does not demonstrate a failure of rationality or the normative force of expectation; rather, it exposes a category error in the assumption that every admissible lottery must be representable by a single real-valued expected utility.

  By analyzing the mathematical structure of the Pasadena lottery, we can show that the payoff variable is not Lebesgue integrable. Consequently, the expected utility is genuinely undefined, not merely unknown. The paradox arises only when we insist on a total valuation function where mathematics dictates a partial one. A more principled approach restricts the domain of EUT to integrable lotteries and employs a system of partial preferences grounded in dominance and coherence for pathological cases. This preserves the core of decision theory without forcing arbitrary values onto mathematically indeterminate objects.

  ## 1. The Mathematical Structure of the Paradox

  To locate the source of the paradox, we must first rigorously define the lottery described in the prompt. Let $L_P$ be the Pasadena lottery. The sample space consists of pairs of outcomes: positive powers of 2 and negative powers of 2.
  *   Positive outcomes: $x_k^+ = 2^k$ with probability $p_k^+ = \frac{1}{2^{k+2}}$ for $k = 0, 1, 2, \dots$
  *   Negative outcomes: $x_k^- = -2^k$ with probability $p_k^- = \frac{1}{2^{k+2}}$ for $k = 0, 1, 2, \dots$

  The sum of probabilities is $\sum_{k=0}^\infty \frac{1}{2^{k+2}} + \sum_{k=0}^\infty \frac{1}{2^{k+2}} = \frac{1}{2} + \frac{1}{2} = 1$. Thus, $L_P$ is a valid probability distribution.

  In Expected Utility Theory, the value of a lottery is the expectation of its payoff variable $X$. Mathematically, for a discrete random variable, the expectation $E[X]$ is defined as the sum $\sum x_i p_i$. However, in measure-theoretic probability, the expectation is defined via the Lebesgue integral. A random variable $X$ possesses a well-defined expectation if and only if it is **integrable**, which requires that $E[|X|] < \infty$ (absolute convergence). If $E[|X|] = \infty$, the expectation is defined only if one of the positive or negative parts converges while the other diverges (yielding $+\infty$ or $-\infty$). If both diverge, the expectation is undefined.

  Let us calculate the positive and negative parts of the expectation for $L_P$:
  $$ E[X^+] = \sum_{k=0}^\infty 2^k \cdot \frac{1}{2^{k+2}} = \sum_{k=0}^\infty \frac{1}{4} = \infty $$
  $$ E[X^-] = \sum_{k=0}^\infty (-2^k) \cdot \frac{1}{2^{k+2}} = \sum_{k=0}^\infty -\frac{1}{4} = -\infty $$

  Since both the positive and negative parts of the integral diverge, the expectation $E[X]$ takes the form $\infty - \infty$. In standard analysis, this is undefined. The payoff variable is not integrable. Therefore, strictly speaking, the lottery $L_P$ **does not have an expected utility**.

  ## 2. Non-Absolute Convergence and the Arbitrariness of Summation

  The paradoxical intuition—that the game "should" have a value (perhaps 0, due to symmetry)—stems from treating the infinite sum as if it obeyed the commutative and associative laws of finite arithmetic. It does not. The series representing the expectation of $L_P$ is not absolutely convergent.

  According to the **Riemann Rearrangement Theorem**, if an infinite series is conditionally convergent (or, as in this case, the difference of two divergent series), its sum can be made to converge to *any* real number, or diverge, simply by rearranging the order of the terms. In the context of a lottery, the "order" of terms corresponds to the convention used to truncate or group outcomes when calculating the limit.

  Because a probability space is a set, it does not come with an intrinsic ordering of outcomes. To compute a sum, an agent must impose an enumeration. Consider two conventions for evaluating $L_P$:
  1.  **Symmetric Truncation:** Group the $k$-th positive outcome with the $k$-th negative outcome. The partial sum is $S_n = \sum_{k=0}^n (2^k \cdot \frac{1}{2^{k+2}} - 2^k \cdot \frac{1}{2^{k+2}}) = 0$. The limit is 0.
  2.  **Positive-Biased Truncation:** Take two positive outcomes for every negative outcome. The partial sums will drift toward $+\infty$.
  3.  **Negative-Biased Truncation:** Take two negative outcomes for every positive outcome. The partial sums will drift toward $-\infty$.

  None of these conventions is mandated by the structure of the lottery itself. To assign a specific expected value (e.g., 0) is to import an arbitrary ordering convention that is external to the decision problem. If EUT requires a unique real value to guide choice, and the mathematics provides a multitude of values depending on arbitrary summation methods, then the requirement itself is the source of the contradiction, not the theory of rationality.

  The paradox, therefore, is not that EUT gives the wrong answer, but that we are demanding an answer where the mathematical machinery yields silence. The assumption that "every admissible lottery must be representable by a single real-valued expected utility" is the false premise.

  ## 3. A Positive Account: Restricted Domains and Partial Preferences

  If we abandon the requirement of totality (that every lottery must have a value), we can salvage Expected Utility Theory by restricting its domain. We propose a **Restricted-Domain Expected Utility Account**.

  ### 3.1 The Domain of Integrability
  EUT remains the normative standard for all lotteries where the payoff variable is integrable ($E[|X|] < \infty$). In this domain, expectations are well-defined, order-independent, and EUT provides a complete ordering of choices. This covers virtually all practical decision-making and standard economic models.

  ### 3.2 Handling Non-Integrable Lotteries
  For lotteries like $L_P$, where the expectation is undefined, we do not declare the agent irrational. Instead, we acknowledge that the preference relation $\succeq$ is a **partial order** rather than a total order. There are pairs of lotteries $(A, B)$ for which neither $A \succeq B$ nor $B \succeq A$ holds. This incompleteness reflects the genuine indeterminacy of the value, not a failure of the agent's reasoning.

  However, "undefined" does not mean "unconstrained." We can still apply coherence conditions to these pathological cases:

  1.  **Stochastic Dominance:** If lottery $A$ first-order stochastically dominates lottery $B$ (i.e., for any outcome level $x$, the probability of getting at least $x$ is higher in $A$ than in $B$), then $A \succ B$, even if expectations are undefined. This relies on the distribution functions, not the summation of values.
  2.  **Lottery-Wise Dominance:** If $A$ yields a better outcome than $B$ in every state of the world, $A$ is preferred.
  3.  **Finite Approximation Coherence:** If a sequence of finite truncations of $A$ consistently yields higher expected utility than corresponding truncations of $B$ under *all* reasonable ordering conventions, this provides a pro tanto reason for $A \succ B$.

  This approach allows us to say that a Pasadena lottery $L_P$ is incomparable to a sure gain of \$10, not because the agent is confused, but because the mathematical object $L_P$ lacks the determinacy required for comparison. However, $L_P$ might still be strictly preferred to a lottery $L_{P'}$ that is identical except all payoffs are shifted by -1 (via state-wise dominance).

  ## 4. Responding to the Objection of Cycles and Intransitivity

  A standard objection to partial preference accounts is that they open the door to irrationality, specifically preference cycles (intransitivity) or "money pumps." If an agent cannot compare $A$ and $B$, and cannot compare $B$ and $C$, might they end up preferring $C$ to $A$ in a way that allows exploitation?

  ### 4.1 Incompleteness vs. Intransitivity
  This objection conflates **incompleteness** with **intransitivity**. A partial order is, by definition, transitive on the domain where comparisons are made. That is, if $A \succeq B$ and $B \succeq C$, then $A \succeq C$. The restriction proposed here drops the axiom of **Completeness** (for all $A, B$, either $A \succeq B$ or $B \succeq A$), not Transitivity.
  Dropping Completeness does not permit cycles. It merely permits gaps. An agent with partial preferences will not cycle; they will simply refrain from choosing between certain pairs. While this might lead to decisional "paralysis" in specific pathological cases, paralysis is not irrationality. It is the rational response to indeterminacy.

  ### 4.2 The Cost of Forced Totality
  The alternative—forcing a total order by assigning an arbitrary expected value (e.g., declaring $E[L_P] = 0$)—is far more damaging to rationality.
  1.  **Violation of Coherence:** If we assign $E[L_P] = 0$ based on symmetric truncation, we must explain why this convention is privileged over others. If we cannot, the assignment is dogmatic.
  2.  **Vulnerability to Framing:** If the value depends on the ordering, an adversary could frame the same lottery using different groupings to manipulate the agent's assigned value. A partial preference account is immune to this; it simply withholds judgment until a dominance relation is clear.
  3.  **Principled Modesty:** Declaring all preferences over infinite lotteries irrational is too strong (as many infinite lotteries are well-behaved). Assigning arbitrary values is too weak (as it pretends precision exists where it does not). A partial order over a restricted domain is the "Goldilocks" solution: it preserves EUT where it works and suspends judgment where mathematics breaks down.

  ### 4.3 Money Pumps and Incompleteness
  Regarding money pumps: A money pump requires an agent to prefer $A$ to $B$, $B$ to $C$, and $C$ to $A$. A partial order prevents this by ensuring that if $A \succ B$ and $B \succ C$, then $A \succ C$. The only risk is if an agent treats incomparability ($A \parallel B$) as indifference ($A \sim B$). If an agent treats "undefined" as "zero value," they become vulnerable. But a rational agent operating under a partial preference account recognizes that $A \parallel B$ means "no preference relation holds," not "they are equal." Thus, they will not trade $A$ for $B$ nor $B$ for $A$ without a dominance reason, blocking the pump.

  ## 5. Conclusion

  The Pasadena paradox is a mathematical mirage created by the overextension of Expected Utility Theory. It arises from the assumption that the expectation operator is a total function mapping all lotteries to real numbers. As demonstrated by the divergence of the positive and negative parts of the Pasadena lottery's payoff, the variable is not integrable, and the series is not absolutely convergent. Consequently, any assigned value relies on arbitrary summation conventions rather than the intrinsic properties of the lottery.

  The rational response is not to discard Expected Utility Theory, but to respect its mathematical preconditions. By restricting EUT to the domain of integrable random variables and adopting a partial preference relation for non-integrable cases, we preserve the normative power of expectation while avoiding the contradictions of the paradox. This account accepts that rationality does not require a judgment in every conceivable case; sometimes, the most rational stance is to acknowledge that the value is undefined. In doing so, we protect decision theory from the arbitrariness of forced convergence and maintain a robust, transitive framework for choice that is honest about the limits of quantification.
