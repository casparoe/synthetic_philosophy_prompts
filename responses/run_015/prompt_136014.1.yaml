answer: |-
  There is no single, settled term in political philosophy or urban theory that captures this specific configuration with the precision you are seeking.

  The closest existing concepts are **Reification** (treating an abstract concept as a concrete thing), **Methodological Holism** (treating groups as entities greater than the sum of individuals), and **Exclusionary Zoning** (the policy outcome). In legal theory, there is discussion of the **"Right to Exclude"** as a fundamental strand of property ownership, but this is usually applied to individual owners, not a collective "neighborhood." In sociology, **Place Attachment** describes the emotional bond, but not the moral claim.

  However, none of these fully capture the *argumentative move* you described: the specific pivot where the *place itself* is granted moral standing that overrides the membership claims of prospective humans.

  Given the specificity of the phenomenon, I propose we coin the term **Spatial Trusteeship**.

  Below is the carving you requested: a definition, its boundary conditions, how it differs from adjacent concepts, and an analysis of where the logic collapses.

  ***

  ### The Concept: Spatial Trusteeship

  **Definition:**
  **Spatial Trusteeship** is an argumentative framework in which a geographic area (a neighborhood, district, or zone) is reified into a persistent moral subject with an "integrity" or "character" independent of its current human inhabitants. Under this doctrine, current residents are not owners of the community but **trustees** charged with preserving the spatial entity for the future. Consequently, prospective residents are framed not as potential members of the moral community, but as external agents whose arrival constitutes a violation of the place's integrity.

  **The Core Axiom:**
  The boundary of moral consideration is drawn around the *container* (the land/zoning) rather than the *contents* (the people). The "community" is defined by the continuity of the built environment and demographic status quo, not by the network of human relationships.

  ### Boundary Conditions & Distinctions

  To ensure this concept does not dissolve into broader categories, we must distinguish it from four adjacent phenomena:

  **1. Vs. Ordinary NIMBYism (Self-Interest)**
  *   **NIMBY:** "I oppose this because it lowers my property value or increases my traffic." (Instrumental, self-regarding).
  *   **Spatial Trusteeship:** "I oppose this because it violates the *character* of the neighborhood." (Deontological, other-regarding toward the "place").
  *   *Distinction:* NIMBY admits to self-interest; Spatial Trusteeship masks self-interest as stewardship. If the argument relies on "preservation" rather than "impact," it is Trusteeship.

  **2. Vs. Status Quo Bias (Psychological Inertia)**
  *   **Status Quo Bias:** "I prefer things stay the same because change is cognitively costly or risky."
  *   **Spatial Trusteeship:** "Things *must* stay the same because there is a moral obligation to the past and future state of this land."
  *   *Distinction:* Status quo bias is passive; Spatial Trusteeship is active and moralized. It invokes a duty ("stewardship") rather than a preference.

  **3. Vs. Legitimate Democratic Input (Procedural Rights)**
  *   **Democratic Input:** "Current residents should have a voice in planning because they are affected stakeholders."
  *   **Spatial Trusteeship:** "Current residents have a *veto* because they embody the will of the place."
  *   *Distinction:* Democratic input acknowledges outsiders as stakeholders who are currently unrepresented. Spatial Trusteeship treats outsiders as *threats* to the legitimacy of the process itself. It conflates *residency* with *citizenship* of the place.

  **4. Vs. The Right to the City (Lefebvre/Harvey)**
  *   **Right to the City:** Argues that inhabitants (including marginalized ones) have a collective right to shape the urban environment.
  *   **Spatial Trusteeship:** Argues that *current* inhabitants have a right to prevent *new* inhabitants from shaping the environment.
  *   *Distinction:* "Right to the City" is inclusive and focuses on the rights of *people* to access space. Spatial Trusteeship is exclusive and focuses on the rights of *space* to restrict people.

  ### The Logical Collapse: The "Voice of the Place" Problem

  The coherence of Spatial Trusteeship collapses when interrogated on **agency**. If the neighborhood is a moral subject with rights, it must have a mechanism to express its will.

  1.  **The Ventriloquism Problem:** The "place" cannot speak. Only people can speak for it. Therefore, the "will of the neighborhood" is always identical to the preferences of the *current* residents.
  2.  **The Circularity of Membership:** To determine who gets to speak for the neighborhood, one must define who belongs. Spatial Trusteeship defines belonging by who is *already there*.
      *   *Question:* "Why does the neighborhood want to remain single-family?"
      *   *Answer:* "Because that is its character."
      *   *Question:* "Who determined that character?"
      *   *Answer:* "The people who lived here before."
      *   *Question:* "Why don't the people who want to live here now get to determine the character?"
      *   *Answer:* "Because they aren't part of the neighborhood yet."
      *   *Collapse:* This is a tautology. The neighborhood is defined by the exclusion of those who would change it. The moral subject (the place) is a phantom projected by the current residents to immunize their preferences from democratic challenge.

  ### The Moral Implication: Newcomers as Contaminants

  The most distinct feature of Spatial Trusteeship is how it categorizes the newcomer.
  *   In standard liberal theory, a newcomer is a **potential citizen**.
  *   In Spatial Trusteeship, a newcomer is a **vector of change**.

  Because the "integrity" of the place is defined by its resistance to change (demographic or physical), the arrival of new people is inherently framed as a degradation or violation, akin to pollution. This allows proponents to claim they are not excluding *people*, but protecting *place*.

  **The Coherence Test:**
  Spatial Trusteeship can only be made coherent if one accepts **Ontological Realism about Places**—the belief that a neighborhood has a soul or essence that exists independently of the humans inhabiting it. If one rejects this metaphysical claim (as most liberal individualists do), Spatial Trusteeship collapses into **Exclusionary Self-Interest** disguised as altruism.

  ### Summary for Your Debate

  When you encounter this move, you can identify it as **Spatial Trusteeship**.

  *   **The Move:** Reifying the neighborhood into a rights-bearing entity.
  *   **The Error:** Confusing the *container* (zoning/buildings) with the *community* (people/relationships).
  *   **The Contradiction:** Claiming to protect a "community" by excluding the very people who would constitute it.
  *   **The Counter:** "A neighborhood is not a museum exhibit; it is a group of people. You cannot protect the 'character' of a place by denying membership to the people who *are* the character."

  This framing isolates the slippery metaphysics they are using: they are asking you to debate zoning, but they are arguing from a position of **territorial personhood**.
