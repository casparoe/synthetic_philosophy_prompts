  2.  **Deconstruct the Bayesian Problem:**
      *   *Old Evidence Problem:* Usually, if $E$ is known before Theory $T$ is proposed, $P(E|T) = P(E)$, so likelihood ratio is 1, no update. But if $T$ explains *why* $E$ happened (especially correlations previously thought random), $T$ gains support.
