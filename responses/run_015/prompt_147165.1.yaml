answer: |-
  At St. Jude's Hospital, Marcus (Operations) and Sarah (Data) argued over last year's MRSA logs, which both already knew showed sporadic simultaneous spikes in ICU and Maternity. Marcus insisted wards are operationally independent silos unless proven otherwise, so the weak correlation in the old data was just noise; since the new ventilation theory claimed a hard link, the lack of perfect synchronization in the known logs actually counted against it, and anyway, you can't update on data you already recieve. Sarah built a Bayesian network inserting a hidden node for the pressure damper state, showing that marginalizing over this unobserved variable made the specific pattern of sporadic spikes far more likely under the ventilation theory than under pure independence, turning the old logs into strong confirmation.

  **Verdicts**

  *   **Marcus (Heuristic):** He treats the wards as exchangeable units with $P(ICU, Maternity) = P(ICU)P(Maternal)$. When he sees the theory posits a link, he expects $P(ICU | Maternity) \gg P(ICU)$. The old data shows only a weak association. To him, the likelihood ratio $P(Data | Theory) / P(Data | Null)$ is near 1 or less because the data doesn't scream "link." He also invokes the old evidence problem: since the logs existed before the theory, $P(Data) = 1$, so no update occurs.
  *   **Sarah (Formal):** She models $P(Data | Theory) = \sum_{H} P(Data | H, Theory)P(H)$. The theory doesn't predict perfect correlation; it predicts correlation *conditional* on the hidden damper state $H$. The old data contains specific joint-outlier frequencies that are astronomically unlikely under independence but typical under the hidden-confounder model. Her likelihood ratio is high. She solves the old evidence problem by noting the *relationship* within the data was unknown, even if the data points were not.

  **The Exact Feature**
  The work is done by **marginalization over a latent variable**. Sarah integrates out the unobserved damper state. This allows the model to predict a *distribution* of correlation strengths (mostly zero, sometimes high) rather than a single fixed correlation. Marcus's model lacks this depth; it assumes conditional independence given only observed silos.

  **What Breaks If Removed**
  If you remove the latent variable, you force the model to explain the covariance using only direct links or noise. You lose the ability to explain *why* the correlation is intermittent. The model either overfits (claims a link where none appears constant) or underfits (claims independence despite joint outliers). The explanatory power collapses because the causal mechanism is partially unobserved.

  **The Heuristic Attack**
  Marcus will argue Sarah is "hallucinating gears." He'll claim that without direct sensor data for the damper, $H$ is just a fudge factor tuned to fit the noise. He'll say you can't infer the existence of a hidden cause solely from residual correlation without prior mechanistic proof, accusing the formal model of overfitting the specific noise structure of last year's logs.

  **The Stance**
  Sarah is correct, and Marcus is dangerous. The independence heuristic is not a neutral default; it is a strong causal claim that no shared causes exist. In complex systems like hospitals, absolute isolation is physically implausible. Treating silos as independent ignores the systemic reality that unmeasured confounders (HVAC, staffing pools, supply chains) are the rule, not the exception. Marcus's refusal to update on old evidence is also wrong; while the *data* was known, the *probabilistic implication* of that data was not. A theory that explains why known data looks the way it does (especially its noise structure) gains probability mass against a theory that calls it randomness. Formalizing the hidden structure captures signal the heuristic discards as noise.
