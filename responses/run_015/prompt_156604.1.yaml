answer: |-
  1. "Verdict at a glance"
  Hanne prevails on logical coherence, Yusuf on capturing the intuitive tension. Hanne correctly identifies that Yusuf's "rational irrationality" relies on equivocation between act-level and state-level rationality (H4). Once terms are fixed, the paradox dissolves: either paying is rational (given the disposition) or acquiring the disposition is irrational (given the act). Yusuf fails to prove self-interest requires false belief (Y2), whereas Hanne shows non-instrumental concerns suffice (H3). However, Yusuf rightly highlights that self-interest theory struggles to recommend specific acts ex post. Overall, Hanne is more right because she exposes a category error rather than accepting a contradiction as a feature of rationality.

  2. "Move-by-move adjudication"

  **Y1. Mixed.** Y1 correctly identifies indirect self-defeat: self-interest recommends acquiring a disposition it later condemns. This establishes the structural tension central to the case. However, it overreaches by labeling the subsequent act "irrational" without defining the locus of evaluation. It succeeds only against a narrow act-centered theory, ignoring that disposition-based theories might call the act rational. The claim that rationality requires irrationality is provocative but rests on an unstable definition of rationality that Hanne later exploits.

  **H1. Mostly right.** H1 correctly notes that if the disposition is a desire, satisfying it is rational by desire-based lights. This establishes that the paradox may be verbal rather than substantive. However, it overreaches by assuming the self-interest theorist accepts desire-satisfaction as rationality. It succeeds against a naive psychological egoist but fails to address Y2's shift to objective reasons. Hanne treats the disposition as an input, whereas Yusuf treats it as a constraint on reasoning.

  **Y2. Mostly wrong.** Y2 claims the disposition requires false belief about reasons. This establishes a high bar for transparency, suggesting rationality requires ignorance. However, it overreaches because one can have a non-instrumental desire without believing the act is objectively reason-supported. It succeeds only against a specific intellectualist view of disposition. Most disposition theorists allow valuing an act without believing it maximizes self-interest, rendering the false belief requirement unnecessary and vulnerable to H3.

  **H2. Mostly right.** H2 raises transparency and selectivity objections. This establishes that artificial dispositions are hard to maintain under scrutiny and costly globally. It overreaches slightly by assuming all dispositions are global; specific commitments might be isolable. However, the transparency point is strong: knowing you are manipulating yourself undermines the manipulation. It succeeds against Y3's claim that recalcitrant emotions are easily replicated by rational choice.

  **Y3. Mixed.** Y3 dismisses cost objections and cites the toxin puzzle. This establishes that some irrational-seeming intentions are possible. However, it overreaches by equating toxin intentions with promise-keeping dispositions; the latter involves social norms, the former pure stipulation. It succeeds only in showing dispositions aren't impossible, not that they are rational under self-interest. The analogy weakens because the toxin payer gets no benefit from the act itself, unlike the promise-keeper valuing integrity.

  **H3. Clearly right.** H3 introduces the briefed hitchhiker. This establishes that knowledge of no self-interest reason doesn't preclude payment if non-instrumental values exist. It overreaches nowhere; it effectively counters Y2's false belief requirement. It succeeds against the core of Yusuf's claim: you don't need irrationality, just different ends. The driver selects for values, not cognitive errors. This move shifts the burden back to Yusuf to explain why different ends count as irrationality.

  **Y4. Mostly wrong.** Y4 accuses H of emptying rationality. This establishes a worry about triviality: if any end makes acts rational, rationality loses bite. However, it overreaches by begging the question against H's consistency claim. It succeeds only if one assumes rationality must be end-independent, which is disputed. Y4 treats the transformation of ends as engineered irrationality, but H3 showed it as selection of stable ends. The accusation of equivocation remains unanswered here.

  **H4. Clearly right.** H4 charges equivocation on "rational." This establishes the logical core: Y uses two senses inconsistently. It overreaches nowhere; it is a formal critique of Y's argument structure. It succeeds completely against Y1-Y4. If rationality means maximizing self-interest, paying is irrational; if it means coherence with dispositions, acquiring them is rational. You cannot have both simultaneously without contradiction. This dissolves the paradox by forcing a choice of definitions.

  **Y5. Mixed.** Y5 invokes state-given, self-effacing reasons. This establishes a sophisticated normative framework where reasons target states, not acts. However, it overreaches by assuming this resolves the self-interest contradiction. It succeeds only in describing a different theory, not saving self-interest theory. Self-interest theory typically focuses on act-outcomes. Accepting state-given reasons changes the theory rather than vindicating the claim that self-interest requires irrationality within its own terms.

  **H5. Mostly right.** H5 distinguishes self-effacement from self-harm. This establishes limits on when state-reasons justify act-irrationality. It overreaches slightly by assuming spontaneity is the only valid model, but the distinction holds. It succeeds against Y5's analogy. Having most reason to avoid an act while having reason to be disposed to do it is a genuine conflict, not a smooth self-effacement. This preserves the intuition that paying is locally irrational even if globally useful.

  3. "The crux"
  The dispute turns on the locus of rational assessment: whether rationality evaluates individual acts given current reasons or global dispositions given overall outcomes. Yusuf assumes act-centeredness: an act is rational only if supported by current reasons. Thus, paying ex post is irrational, creating the paradox. Hanne assumes state-centeredness: an act is rational if it flows from a rationally acquired disposition. Thus, paying is coherent. Yusuf's "rational irrationality" only arises if one mixes these loci—evaluating the disposition globally but the act locally. Hanne's dissolution works by forcing consistency: if acts are the locus, the disposition is useless; if dispositions are the locus, the act is rational. Their disagreement on whether SIT is self-defeating follows directly from this prior commitment. Yusuf sees a fracture between levels; Hanne sees a single consistent level misdescribed. This distinction explains Y5's appeal to state-given reasons: he tries to bridge the loci. H5 rejects this bridge, insisting act-reasons remain distinct. Consequently, Yusuf sees a deep feature of practical reason, while Hanne sees a definitional error. The entire exchange hinges on whether rationality is monolithic or layered. Ultimately, the crux is whether rationality permits fragmentation. Yusuf argues it does; Hanne argues it demands unity.

  4. "What both are missing"
  Both miss the distinction between criteria of rightness and decision procedures. Yusuf assumes that if an act is right (gets the lift), the agent must deliberate using that criterion. Hanne assumes deliberation must match the agent's psychology. Neither considers that self-interest theory might specify the right act (pay) while recommending a different decision procedure (maximize ex post). A third view separates the standard of success from the psychology required to achieve it. The driver needs an agent who doesn't calculate ex post, but the theory can still say paying is right. This avoids calling the act "irrational" while acknowledging the deliberative constraint. Both conflate what makes an outcome good with how the agent must think to produce it, obscuring the solution. This separation allows SIT to remain coherent without requiring irrationality or changing ends. It explains why the driver selects for dispositions while the theory recommends acts. Neither party considers that the theory's advice might differ from the agent's successful mindset. This distinction resolves the tension without accepting self-defeat or equivocation. It suggests the paradox arises from demanding the theory be its own implementation guide.
