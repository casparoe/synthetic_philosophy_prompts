  ### 1. Exam Question

  **Final Seminar Assessment: The Spandrels Critique and Evolutionary Psychology**

  **Time Allowed:** 90 Minutes
  **Expected Response Length:** Approximately 800 words

  **Context and Problem Statement**

  Stephen Jay Gould and Richard Lewontin's 1979 critique of the adaptationist program remains a foundational text in the philosophy of biology. Their argument is frequently misunderstood as a denial that natural selection occurs or that traits can be adaptive. However, the core of their intervention is often characterized as a shift in the burden of proof regarding evolutionary explanations. They argue that evolutionary biologists too readily assume that every existing trait is an optimized product of direct selection, ignoring constraints, developmental pathways, and byproducts. They utilize the architectural metaphor of the spandrel—the triangular space between arches that is a necessary structural consequence of mounting a dome, rather than a design feature intended for art—to illustrate traits that exist not because they were selected for, but because they are inevitable consequences of other selected features.

  In contemporary evolutionary psychology (EP), this critique poses a significant challenge to the standard model of mind modularity. EP often proceeds by identifying a current psychological capacity, positing a Pleistocene environment where that capacity would enhance fitness, and concluding that the capacity is an adaptation shaped by selection for that specific function. The spandrels critique suggests this reasoning may reverse the causal order, treating byproducts as purposes.

  **The Case: Human Numerical Cognition**

  For this essay, you will apply the spandrels critique to a specific conceptual case: human numerical cognition. Consider two competing evolutionary explanations for the human ability to process exact numbers and perform arithmetic operations.

  *   **Hypothesis A (Adaptationist):** Numerical cognition is a dedicated module selected specifically for quantitative foraging tasks, such as tracking fruit yields, dividing resources among kin, or navigating spatial distances during hunting. The trait exists because ancestors with better number sense survived and reproduced more effectively.
  *   **Hypothesis B (Spandrel):** Numerical cognition is a byproduct of domain-general working memory and spatial-reasoning architectures selected for other purposes, such as object tracking or navigational mapping. The ability to count is not itself an adaptation but an emergent property of these underlying systems interacting in a culturally rich environment.

  **Essay Task**

  Write a critical essay addressing whether treating human numerical cognition as a spandrel fundamentally undermines the adaptationist evolutionary psychology program or merely relocates its explanatory targets. Your response must not simply summarize Gould and Lewontin's architectural analogy or list morphological examples like snail shells or male nipples. Instead, you must engage with the logical structure of the critique.

  Specifically, your essay must accomplish the following analytical moves:

  1.  **Methodological vs. Empirical:** Determine whether the spandrels critique is primarily a methodological constraint on how hypotheses are tested (concerning the burden of proof) or an empirical claim about the prevalence of non-adaptive traits. Argue how this distinction changes the weight of the objection against Hypothesis A.
  2.  **Spandrel vs. Exaptation:** You must ground your position in the logical difference between a spandrel and an exaptation. A spandrel is a non-adaptive byproduct of a selected trait. An exaptation is a trait currently useful for a function but not originally selected for that function. Explain why confusing these categories leads to errors in evaluating Hypothesis B.
  3.  **Implications for Evolutionary Psychology:** Take a committed stance on whether accepting Hypothesis B destroys the validity of adaptationist explanations in psychology or simply forces them to seek selective pressures at a different level of architectural organization (e.g., selecting for working memory rather than counting).

  **Constraints**

  Do not waste word count on biographical details or general summaries of the adaptationist program. Assume the reader understands the basic definition of natural selection. Focus entirely on the philosophical implications of the spandrel critique when applied to cognitive architecture. Your argument must be decisive; do not hedge by claiming both sides have merit. You must defend a specific position on the viability of the adaptationist program in light of the spandrel critique.

  ***

  ### 2. Model Answer

  Treating human numerical cognition as a spandrel does not destroy the adaptationist evolutionary psychology program; rather, it functions as a necessary methodological correction that relocates explanatory targets to deeper architectural levels. The force of Gould and Lewontin's critique is not empirical denial but methodological rigor regarding the burden of proof. When applied to numerical cognition, this distinction clarifies that rejecting a specific adaptationist hypothesis does not necessitate rejecting adaptationism itself, provided one maintains a strict logical distinction between spandrels and exaptations.

  The primary error in standard evolutionary psychology is treating the spandrels critique as an empirical claim that most traits are non-adaptive. If the critique were merely empirical, it would be a contest of numbers: are there more adaptations or spandrels? This misses the point. The critique is methodological. It demands that adaptationists prove selection occurred rather than assuming it as a null hypothesis. In the case of numerical cognition, Hypothesis A assumes selection for counting because counting is useful. Hypothesis B suggests counting emerges from selected spatial-memory systems. Accepting Hypothesis B does not deny selection; it denies that *counting* was the target. Therefore, the critique weakens specific adaptationist stories but strengthens the overall rigor of evolutionary explanation by preventing just-so storytelling. It forces the adaptationist to identify the specific selective pressure on the underlying architecture, not just the utility of the surface trait.

  This requires a precise understanding of the logical difference between spandrels and exaptations, a distinction often blurred in evolutionary psychology. A spandrel is a structural byproduct that carries no adaptive history for its current use. An exaptation is a trait co-opted for a new use after evolving for a different one. If numerical cognition is a spandrel of working memory, it was never selected for quantification. If it is an exaptation, the underlying capacity was selected for something else (e.g., object tracking) and later co-opted for counting. Confusing these leads to categorical errors. If numerical cognition is a spandrel, seeking a selective advantage for arithmetic is a category mistake. If it is an exaptation, seeking the *original* selective advantage is required. Hypothesis B posits a spandrel relationship: counting is an inevitable consequence of high-fidelity spatial mapping. Recognizing this prevents the researcher from inventing Pleistocene counting scenarios that never occurred.

  Consequently, treating numerical cognition as a spandrel relocates rather than eliminates adaptationist targets. The adaptationist program remains viable but must shift focus from the surface phenotype (arithmetic ability) to the basal phenotype (working memory capacity). Selection acted on the architecture, not the byproduct. This preserves the core Darwinian insight that complex design requires selection, while acknowledging that not all complex outcomes are direct targets of selection. To argue that this weakens evolutionary psychology is to confuse the failure of a specific hypothesis with the failure of a paradigm. The paradigm survives if it can account for the selection of the underlying constraints.

  Therefore, the spandrels critique should be viewed as a refinement of adaptationism, not its negation. It compels evolutionary psychologists to demonstrate why a trait could not be a byproduct before asserting it is an adaptation. In the case of numerical cognition, this means proving that working memory alone cannot explain quantitative skills before positing a number module. Accepting the spandrel hypothesis merely moves the burden of proof to the selection of domain-general systems. It weakens lazy adaptationism but strengthens rigorous evolutionary explanation. The program is not defeated; it is merely forced to be more precise about what, exactly, was selected.

  ***

  ### 3. Marking Scheme (20 Points)

  **A. Analytical Moves and Content (14 Points)**

  *   **Methodological vs. Empirical Distinction (4 points):**
      *   **4 pts:** Explicitly identifies the critique as methodological (burden of proof) rather than empirical (trait prevalence). Explains how this shifts the obligation to prove selection rather than assume it.
      *   **2-3 pts:** Identifies the distinction but fails to explain how it alters the burden of proof in the numerical cognition case.
      *   **0-1 pts:** Treats the critique as purely empirical (arguing about how many traits are spandrels) or conflates the two.

  *   **Spandrel vs. Exaptation Logic (4 points):**
      *   **4 pts:** Correctly defines spandrel (non-adaptive byproduct) vs. exaptation (co-opted trait) and applies this logic to explain why seeking selection for counting is a category mistake if it is a spandrel.
      *   **2-3 pts:** Defines terms correctly but fails to apply the logical difference to the numerical cognition case.
      *   **0-1 pts:** Conflates spandrels and exaptations or uses the terms interchangeably.

  *   **Implications for Evolutionary Psychology (4 points):**
      *   **4 pts:** Takes a committed stance (relocates targets vs. weakens program) and defends it by arguing that selection still applies to underlying architecture (working memory).
      *   **2-3 pts:** Takes a stance but fails to justify how adaptationism survives the shift (e.g., argues it weakens EP without explaining why).
      *   **0-1 pts:** Remains neutral/hedged ("both sides have merit") despite instructions to take a position.

  *   **Case Application (2 points):**
      *   **2 pts:** Specifically references the numerical cognition/working memory case throughout the argument rather than speaking only in abstractions.
      *   **0-1 pts:** Mentions the case only in introduction or conclusion without integrating it into the reasoning.

  **B. Structure and Constraints (6 Points)**

  *   **Adherence to Constraints (3 points):**
      *   **3 pts:** No recitation of architectural analogies (arches/domes) or standard morphological examples (snail shells). Focus remains on philosophy and cognitive case.
      *   **1-2 pts:** Minor reliance on standard summaries or examples.
      *   **0 pts:** Essay is primarily a summary of Gould and Lewontin.

  *   **Argumentative Clarity (3 points):**
      *   **3 pts:** Clear thesis statement; logical flow between methodological distinction and case implications.
      *   **1-2 pts:** Thesis is vague or logical flow is disjointed.
      *   **0 pts:** No clear argumentative thread.

  **Grade Boundaries:**
  *   **A (17-20 points):** Contains all high-band criteria. Distinct stance. Precise philosophical terminology.
  *   **B (14-16 points):** Misses one high-band criterion (usually the spandrel/exaptation logic or the methodological nuance) but remains competent.
  *   **C (11-13 points):** Treats critique as empirical, conflates terms, or hedges position.
  *   **D/F (0-10 points):** Summarizes text without analysis, ignores the numerical cognition case, or fails to take a position.

  **Specific Penalties:**
  *   **-2 points:** For explicitly conflating spandrels with exaptations.
  *   **-2 points:** For treating the critique as a denial of natural selection.
  *   **-1 point:** For every 50 words under the expected length (significant lack of development).
