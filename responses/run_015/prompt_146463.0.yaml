      *   Better analogy: A function `is_wrong(action)` returns a status code. Expressivism says the status code *is* the attitude. The student says if it's in an `if`, it's not an attitude anymore. But in code, `if (is_wrong(x))` still calls `is_wrong`. The issue is more like: Does `is_wrong` return a `bool` or throw an `Exception` (express attitude)? If it throws, `if` breaks. If it returns bool, it's descriptivist. The student assumes it *must* return bool to work in `if`, ignoring that we can define a logic where attitude-types behave like bools.

