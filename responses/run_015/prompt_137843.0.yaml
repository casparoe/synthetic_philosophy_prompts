      *   One sentence? Yes.

      *Let's refine the "Better Analogy".* A vortex is good, but does it capture the *informational* aspect? Maybe **"A System's Own Map of Its Territory, Drawn in Real-Time."** But maps imply a map-reader.
      *How about:* **"The Heat Generated by Friction in the Gears."**
