      *   *Point 2: Read-Only vs. Write-Back.*
          *   If read-only (epiphenomenal), it doesn't matter for behavior or welfare.
          *   If write-back (causal), it's a control system. But then "illusion" is the wrong word; it's a *mechanism*.
          *   *Verdict:* To matter for AI safety/welfare, it must write back. If it writes back, it's real functional architecture, not just a "picture."

      *   *Point 3: The Fine-Tuning Case.*
