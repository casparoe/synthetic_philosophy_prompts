          *   *Problem:* In humans, we assume the "files" (processing) still matter morally/phenomenally even if icons are broken. In AI, if icons are gone, proponents say "no consciousness."
          *   *Verdict:* The analogy fails to distinguish between *reporting* capacity and *state* capacity. It conflates the dashboard with the engine.

  5.  **Developing a Better Analogy:**
      *   *Constraint:* No designer, no separate viewer.
