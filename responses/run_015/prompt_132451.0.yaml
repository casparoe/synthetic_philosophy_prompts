  Treat your calibration layer as an **Epistemic Utility Maximizer**. Don't worry about "accuracy" as a mystical property. Define your loss function (utility) explicitly. If you want calibration, use Log Loss. If you want risk-averse calibration, modify the utility weights. The philosophy collapses; the engineering remains.
