  Here is the decomposition and combination logic behind that number, tailored to your calibration layer context.

  ### The Decomposition

  1.  **P(Weighting requires valence | No Sentience): 0.70**
      *   *Logic:* Differential weighting of errors (e.g., False Negative > False Positive) usually implies a *cost*. In biological systems, cost is cached as pain or metabolic waste. In a non-sentient system, "cost" is purely an external scalar assigned by the optimizer. Without an internal state that *cares* (valence), there is no intrinsic epistemic reason to weight one truth-error differently than another, only an instrumental one.
  2.  **P(Accuracy-first = Utility with flat weights): 0.90**
      *   *Logic:* This is the mathematical bottleneck. Accuracy-first epistemology relies on strictly proper scoring rules (Brier, Log Loss). Epistemic utility theory maximizes expected utility over truth-values. For a non-sentient optimizer, a proper scoring rule *is* a utility function where the utility of Truth=1 and Falsehood=0. The distinction is metaphysical, not computational.
  3.  **P(Distinction matters only for social reasoning): 0.95**
