prompt: |-
  I'm a novelist preparing a single ninety-minute session for an interdisciplinary salon of writers and editors, none of whom have studied decision theory, on the normative structure of Dutch book arguments. I do not want the argument explained to me; I want a teaching plan. First, lay out the dependency order: which idea—betting coherence, the representation of belief by odds, or the avoidance of sure loss—must be fixed before the others can be introduced, and why the betting framework must precede rather than follow any formal presentation of probability. Second, propose one carrying example that is not the familiar lottery-ticket or horse-race scenario; specify exactly what this example must contain and what it must lack in order to exhibit both synchronic incoherence and diachronic incoherence without allowing the audience to conflate the two. Third, map the predictable misconceptions: that Dutch books demonstrate objective probabilities in nature, that they are merely a warning against risk aversion, and that diachronic coherence reduces to Bayesian updating; for each, indicate the precise moment in the sequence where it should be intercepted. Fourth, provide a single closing question that tests whether the audience has grasped the normative claim about belief rather than merely memorized the betting table. Finally, state clearly what derivation or formal result I should explicitly refuse to present at this level and say so aloud.
