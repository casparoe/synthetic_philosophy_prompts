answer: |-
  ### Teaching Plan: The Normative Structure of Dutch Book Arguments
  **Session Duration:** 90 Minutes
  **Audience:** Writers and Editors (Non-technical)

  ---

  #### I. Dependency Order and Pedagogical Justification

  You must introduce the concepts in the following sequence. Deviating from this order will cause the argument to collapse into abstract mathematics, losing the normative force required for a literary audience.

  1.  **First: The Representation of Belief by Odds.**
      *   **Why:** You cannot construct a "book" without stakes. You must first operationalize "belief" not as a vague feeling, but as a willingness to accept a wager at specific prices. Without fixing this operational definition, the audience will treat probabilities as external facts rather than internal commitments.
  2.  **Second: Betting Coherence.**
      *   **Why:** Once beliefs are odds, you must demonstrate how they relate structurally. Coherence is the rule that prevents the odds from contradicting one another (e.g., the odds on $A$ and not-$A$ must sum to 1). This defines what a "Dutch Book" *is* before you explain why it is bad.
  3.  **Third: The Avoidance of Sure Loss.**
      *   **Why:** This is the normative punchline. Only after establishing that beliefs are odds (1) and that odds must be coherent (2) can you demonstrate that incoherence guarantees a loss regardless of the outcome. This transforms the argument from a mathematical curiosity into a rule of rational conduct.

  **Why the Betting Framework Must Precede Formal Probability:**
  Formal probability (Kolmogorov axioms) is a descriptive system of numbers; betting is a normative system of *agents*. For writers and editors, the primary unit of analysis is the character or the decision-maker, not the number line. If you present the axioms first, the audience will view probability as a property of the world (like gravity). By presenting betting first, you establish probability as a property of the *mind's consistency*. You are teaching them that probability is a logic of action, not a logic of nature.

  ---

  #### II. The Carrying Example: "The Anthology Acquisition"

  Do not use horses, coins, or lotteries. Use a scenario native to their profession but stripped of emotional utility.

  **The Scenario:** An editor is deciding which single story to acquire for a themed anthology. There are three submitted manuscripts: *Story A*, *Story B*, and *Story C*. Only one can be chosen.

  **What This Example Must Contain:**
  1.  **Exhaustive and Exclusive Outcomes:** The editor must acknowledge that acquiring A, B, or C are the only options (one must happen, only one can happen). This is required to exhibit **Synchronic Incoherence** (e.g., assigning 50% confidence to A, 50% to B, and 50% to C, summing to 150%).
  2.  **A Defined Evidence Event:** A specific moment where new information arrives (e.g., "The author of Story A sends a revised draft"). This is required to exhibit **Diachronic Incoherence** (e.g., changing the odds on Story B without changing the odds on Story A, despite the evidence only affecting A).
  3.  **Abstract Stakes:** Use "Acquisition Points" or "Reputation Capital," not dollars. This isolates the logic of belief from the utility of money.

  **What This Example Must Lack:**
  1.  **Quality Judgments:** Do not allow the audience to discuss which story is *better*. The argument is about the consistency of the odds, not the truth of the selection. If they debate merit, they conflate coherence with correctness.
  2.  **Personal Financial Risk:** Do not allow the editor to lose their own money. If they fear personal loss, they will conflate the Dutch Book argument with risk aversion. The loss must be logical (a guaranteed deficit in points), not emotional.
  3.  **External Frequencies:** Do not mention how often editors usually pick Story A. This prevents the audience from relying on objective frequencies to justify their odds.

  **Execution:**
  *   **Phase 1 (Synchronic):** Ask the editor to set buying prices for contracts on A, B, and C. Show that if the prices sum to more than 100 points, a clever bettor can sell the editor all three contracts and guarantee a profit regardless of which story is picked.
  *   **Phase 2 (Diachronic):** Introduce the revised draft for A. Ask the editor to update odds. Show that if they raise the odds on A but fail to lower the odds on B and C proportionally, a bettor can exploit the transition between Time 1 and Time 2 to guarantee a loss.

  ---

  #### III. Mapping Predictable Misconceptions

  You must intercept these misconceptions at precise moments. Do not wait for questions; preempt them.

  | Misconception | The Error | Interception Point | Intervention Script |
  | :--- | :--- | :--- | :--- |
  | **Objective Probabilities** | "The Dutch Book proves which story is actually best." | **Phase 1:** Immediately after defining Belief as Odds. | "These odds do not measure the story's quality. They measure the editor's commitment. A Dutch Book can be made against a genius editor if their commitments contradict themselves." |
  | **Risk Aversion** | "The argument is just warning us against losing points." | **Phase 2:** Before demonstrating the Sure Loss. | "This is not about caution. You can be bold and coherent. You can be cautious and incoherent. The loss arises from *contradiction*, not *danger*." |
  | **Diachronic = Bayesian** | "Updating this way is the only way to be Bayesian." | **Phase 3:** During the Diachronic example. | "This does not prove Bayesian updating is the *only* rational method. It proves that *whatever* rule you use to update, you must apply it consistently, or you can be booked." |

  ---

  #### IV. The Closing Question

  Do not ask a mathematical question. Do not ask them to calculate odds. Ask a question that forces them to locate the normativity within their own practice.

  **"If you claim to believe a proposition is true, but you refuse to let that belief constrain your betting odds against a Dutch Book, have you surrendered the belief, or have you surrendered the claim to rationality?"**

  *Instruction:* Allow 5 minutes of silence after asking this. Do not answer it yourself. The session ends on this tension.

  ---

  #### V. The Explicit Refusal

  There is one formal result you must explicitly refuse to present. Writing it on the board will signal that the argument relies on mathematical authority rather than normative logic.

  **The Refusal:**
  "I will not derive the **Ramsey-De Finetti Representation Theorem**. I will not write the algebraic proof that shows coherence is isomorphic to the probability axioms."

  **Say this aloud:**
  "We are not here to prove that coherent bettors satisfy the axioms of probability. We are here to understand why a writer who violates those axioms is a character who cannot exist without contradiction. The math is the map; the coherence is the territory. We are studying the territory."
