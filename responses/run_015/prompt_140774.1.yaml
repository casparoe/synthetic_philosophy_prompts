answer: |-
  You have identified a genuine and structural aporia in the field of machine ethics. Your intuition is correct: this is not merely a technical bug or a matter of bias correction, but an epistemological boundary.

  To answer your first question directly: **No, there is no single, universally standardized proper name for this specific configuration** (like "The Gettier Problem" or "The Prisoner's Dilemma"). This absence of a name is itself evidence of the difficulty you describe; the field has not yet settled on a vocabulary that fully captures the circularity you have isolated.

  However, it is recognized under a cluster of descriptions. In philosophy, it is a modern computational instantiation of **The Euthyphro Dilemma**. In machine learning, it is discussed as **The Ground Truth Problem in Normative Domains** or **The Limitations of Imitation Learning for Ethics**.

  If I were to offer a descriptive name that captures the shape you have seen, I would call it **The Ethical Closure Problem**. It describes a system closed off from any external standard of correction.

  Here is the breakdown you requested regarding its name, its edges, and the proposed ways out.

  ### 1. Does it have an established name?

  While there is no single noun phrase, your observation maps precisely onto two established concepts, one ancient and one technical.

  **The Philosophical Ancestor: The Euthyphro Dilemma**
  In Plato's dialogue *Euthyphro*, Socrates asks: "Is the pious loved by the gods because it is pious, or is it pious because it is loved by the gods?"
  *   **Option A:** It is pious because the gods love it. (Morality is defined by authority/preference).
  *   **Option B:** The gods love it because it is pious. (Morality exists independently of authority/preference).

  Your hospital committee scenario is the computational version of this.
  *   **Option A (The System's Reality):** The decision is "correct" because the model matches the clinicians. (Ethics is defined by human output).
  *   **Option B (The Hope):** The model matches the clinicians because the decision is "correct." (Ethics exists independently, and humans track it).

  The difficulty you noticed is that if we use human decisions as the *training data* and the *evaluation metric*, we force Option A. We make human preference the definition of correctness, which logically precludes the possibility that the humans are wrong.

  **The Technical Description: The Lack of Independent Normative Ground Truth**
  In supervised learning, you need "ground truth" labels (e.g., this is a cat, this is not a cat). In weather forecasting, the ground truth is the physical atmosphere. In ethics, there is no "moral atmosphere" to check against. We only have human reports *about* the atmosphere. When you train on human reports without an external check, you create a closed loop. In the literature, this is often discussed under **Inverse Reinforcement Learning (IRL)** limitations, specifically the problem that **revealed preferences** (what we do) may not match **normative preferences** (what is good).

  ### 2. Where are its edges?

  You asked how to separate this problem from nearby problems. The boundary is defined by the **availability of an independent verification mechanism.**

  **Inside the Boundary (The Ethical Closure Problem)**
  *   **Triage Algorithms:** As you described. The "correct" allocation of resources is a moral question with no physical readout.
  *   **Sentencing Algorithms:** If trained on past judge decisions, they cannot identify systemic unjust sentencing, because "unjust" is defined as "deviation from the norm."
  *   **Content Moderation:** If an AI is trained to flag "harmful" speech based on human moderators' past decisions, it cannot learn that the moderators were culturally biased, because that bias is encoded as "correct classification."

  **Outside the Boundary (Where the Problem Dissolves)**
  *   **Weather Forecasting:** As you noted. The sky provides independent feedback. If the model predicts sun and it rains, the model is wrong, even if every meteorologist predicted sun. The physical world breaks the closure.
  *   **Legal Compliance (Statutory):** If the rule is "Do not discharge a patient within 24 hours of admission," there is a hard constraint. An AI can flag a human error here because the standard is external to the human's judgment (it is in the statute).
  *   **Known Bias Correction:** If we define "bias" as "deviation from protected class statutes," we have an external standard. The Closure Problem only applies to *moral* questions where the statute or physical reality does not dictate the answer (e.g., "Who deserves the last ICU bed?" vs. "Did we follow the law?").
  *   **Instrumental Goals:** If the goal is "maximize hospital revenue," we can measure revenue. The closure only applies to *normative* goals (what *ought* to be), not *instrumental* goals (what *is* achieved).

  **The Separating Principle:**
  The problem exists if and only if **the metric of success is identical to the source of potential error.**
  *   In weather: Metric = Rain. Source of error = Model. (Distinct).
  *   In ethics (your case): Metric = Human Judgment. Source of error = Human Judgment. (Identical).

  ### 3. Does the literature have a recognised way out?

  This is the hardest part. Because the problem is epistemological (about how we know what is good), there is no technical fix. However, there are three philosophical strategies proposed in the literature to break the circle.

  **A. Idealized Preferences (The "Better Self" Strategy)**
  Instead of training on what humans *do* decide (revealed preferences), train on what humans *would* decide if they were more informed, rational, and calm.
  *   **How it helps:** It creates a gap between "Actual Human" and "Ideal Human." The AI can disagree with the Actual Human by appealing to the Ideal Human.
  *   **The Catch:** Who defines the Ideal? If we ask humans to define the Ideal, we return to the Closure Problem. This is often called **Coherent Extrapolated Volition (CEV)**. It is theoretically sound but practically difficult to specify.

  **B. Procedural Ethics (The "Reasons" Strategy)**
  You asked: *"Does anything change if one tests the reasons a machine gives rather than the verdicts it reaches?"*
  *   **The Answer:** Yes, this is a major proposed solution. Instead of evaluating the *outcome* (Patient A gets the bed), evaluate the *argument* (Patient A gets the bed *because* of principle X).
  *   **How it helps:** Humans might agree with a verdict for bad reasons (e.g., favoritism). If the AI must output a justification, we can critique the justification even if we accept the verdict. It shifts the ground truth from "What did we choose?" to "Is this reasoning consistent with our stated principles?"
  *   **The Catch:** Humans are also inconsistent in their principles. But it opens a space for critique that verdict-matching closes.

  **C. Moral Uncertainty (The "Abstention" Strategy)**
  Some ethicists (e.g., Nick Bostrom, Toby Ord) argue that AI should not be built to make moral verdicts at all, but to recognize **Normative Uncertainty**.
  *   **How it helps:** Instead of saying "Save Patient A," the system says "There is a 60% chance Utilitarianism suggests A, but a 40% chance Deontology suggests B."
  *   **The Catch:** This passes the buck back to the human. It solves the "malfunction vs. improvement" confusion by refusing to claim improvement. It turns the AI into a map of the moral landscape rather than a guide.

  ### Summary

  You have not missed a check; there is no "moral weather" to check against.

  *   **Name:** The **Ethical Closure Problem** (or The Ground Truth Paradox in Machine Ethics).
  *   **Edge:** It applies only where the *standard of correctness* is derived solely from the *agents being evaluated*, with no external physical or statutory constraint.
  *   **Way Out:** The literature suggests moving from **Verdict Matching** (imitating decisions) to **Reasoning Alignment** (evaluating arguments) or **Idealized Preference Learning** (simulating a better version of us). But none of these fully escape the circle; they merely widen it enough to allow a little light in.

  Your observation from the hospital committee is a precise description of why "aligning" AI with human values is philosophically treacherous. If we align AI perfectly with human values as they currently exist, we freeze our moral errors in silicon. If we align AI with something else, we cannot verify that the "something else" is actually better. You have identified the central tension of the field.
