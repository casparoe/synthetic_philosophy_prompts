answer: |-
  1. The two interpretations

  On the dimensional incommensurability view, pleasure and pain are ontologically distinct categories, akin to health versus wealth or liberty versus security. They do not inhabit a single axiological space, meaning there is no exchange rate between them; you cannot trade units of joy for units of grief. Lexicality here functions as a priority rule in a multi-criteria decision analysis: the "pain account" must be minimized to below-threshold levels before any moral weight is assigned to the "pleasure account." This avoids the mathematical awkwardness of infinities but complicates the moral calculus, as agents must track two separate ledgers and apply a strict ordering rule rather than a summation function. The threshold represents a qualitative shift in the type of harm incurred, not just a quantitative increase in negative valence.

  Conversely, the scalar discontinuity interpretation posits a single valence scale where pleasure and pain are commensurable magnitudes, but the utility function contains a break or asymptote at the threshold. Below the threshold, the trade-off rate is finite (e.g., 1 unit of pain cancels 1 unit of pleasure); above it, the marginal disutility of pain becomes infinite or lexicographically dominant. Here, the threshold is a point on a continuum where the function's slope changes vertically. This model is mathematically cleaner for aggregation but risks conceptual instability: it suggests that severe suffering is just "more" of the same stuff as minor suffering, which undermines the claim that it belongs to a different moral category that cannot be offset by pleasure.

  2. Mixed states and what survives

  Under dimensional incommensurability, a mixed state of intense joy and intense grief results in two simultaneous, non-canceling moral facts. The grief generates an urgent moral demand that cannot be discharged by the concurrent joy; the joy remains a positive credit in its own ledger but is effectively frozen until the pain debt is resolved. The agent is required to act to alleviate the grief regardless of the pleasure present, but the pleasure is not ontologically erased—it survives as a distinct value that will matter once the lexical priority condition is satisfied. The net state is morally urgent due to the pain, but the world is still better for containing the joy, even if that joy cannot justify permitting the grief.

  In the scalar discontinuity model, the evaluation function processes the mixed state and outputs a value determined solely by the dominant lexical factor. If the grief exceeds the threshold, the utility of the state is calculated based on the grief, rendering the joy morally inert in the decision procedure. The joy does not offset the grief; it is zeroed out by the discontinuity in the function. While the phenomenology of joy persists for the subject, it carries no decision-weight in the presence of lexical suffering. The net state is simply bad, not because the joy is negative, but because its positive weight is overwhelmed by the infinite or prioritized negative weight of the pain.

  3. The triage/offset objection

  Allowing suffering to offset within its own category (e.g., aggregating minor pains to prevent catastrophic pain) is necessary for any plausible triage protocol, but it pressures the lexical view toward a single metric. If minor pains can sum to outweigh a major pain, suffering is treated as scalar across intensities. The collapse worry is that if suffering is scalar enough to aggregate against itself, it should be scalar enough to aggregate against pleasure. If you admit a common metric for suffering intensities, you invite pleasure into that metric, risking a slide into Classical Utilitarianism where enough pleasure offsets severe pain. To prevent this, the lexical theorist must argue that the threshold represents a qualitative break in suffering itself, not just a quantitative one, preserving the block against pleasure while allowing suffering aggregation.

  Regarding the specific fear of collapsing into Regular Negative Utilitarianism (NU): allowing suffering aggregation does not inherently force this collapse, as LTNU already agrees that suffering is the primary moral currency. The collapse into Regular NU occurs only if the lexical threshold is set such that pleasure *never* offsets *any* suffering, even below the threshold. If LTNU permits pleasure to offset minor suffering but blocks it for severe suffering, it remains distinct from Regular NU. However, if the justification for blocking pleasure above the threshold (incommensurability) is applied consistently, it may undermine the claim that pleasure matters below the threshold, effectively rendering pleasure morally epiphenomenal and collapsing the view into NU in practice, if not in theory.

  4. Bottom line: collapse or not?

  The view does not logically collapse into Regular Negative Utilitarianism so long as pleasure retains non-zero moral weight below the threshold, but it remains axiologically precarious. The dimensional interpretation is more robust against collapse because it denies the common metric that allows pleasure to creep into the suffering calculus, whereas the scalar interpretation risks instability at the discontinuity point. Ultimately, LTNU survives as a distinct position only if the threshold is defended as a phenomenological qualitative break rather than an arbitrary numerical line; without that, the aggregation logic required for triage tends to smooth the discontinuity, sliding the theory toward either Classical Utilitarianism or Strict NU.
