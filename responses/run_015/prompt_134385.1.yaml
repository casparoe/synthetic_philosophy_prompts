answer: |-
  This is a strategic intervention into a field often cluttered by moral posturing and historical particularism. Your shift from "ranking" societies to analyzing "mnemonic architecture" is the correct move for political theory. It moves the debate from *who is better* to *what work does memory do* within a constitutional order.

  If I were directing a small research group or policy fellowship with limited resources, I would not fund a broad comparative history. I would fund a targeted theoretical and empirical inquiry into the **functional limits of state-mandated memory**.

  Here is the defended agenda, prioritized by upstream dependence (what must be solved first), tractability for political theorists, and immediate policy relevance.

  ### Priority 1: The Normative Grounding of Mnemonic Citizenship
  **The Question:** Is state-mandated remembrance a form of *intergenerational liability* (a debt owed by the current polity for past acts) or a *constitutive civic duty* (a requirement for maintaining a specific type of democratic identity)?

  **Why this is Priority 1 (Upstream Dependence):**
  This is the foundational philosophical problem. Every other question—about funding, curriculum, or monuments—depends on the answer.
  *   **If it is Liability:** The obligation is transactional. It implies a debtor and a creditor. Theoretically, liabilities can be paid off, settled, or statute-barred. This view struggles to justify why a citizen born in 2000 owes a debt for 1865 or 1915.
  *   **If it is Civic Constitution:** The obligation is functional. We remember not because we are guilty, but because forgetting makes us dangerous to our own constitutional order (the German *Verfassungspatriotismus* model).

  **The "German Exportability" Trap:**
  A critical sub-task here is dismantling the assumption that the German model is exportable. The German model works not because Germans are morally superior, but because 1945 represented a **discontinuity of statehood**. The Federal Republic was a new legal entity that could disavow the Reich. In the US South or Turkey, there is **state continuity**. The current state *is* the perpetrator's successor.
  *   *Research Task:* Develop a normative theory of mnemonic obligation that accounts for *state continuity*. If the state never broke, can it claim the "civic duty" defense without admitting the "liability" claim? This is the theoretical knot that currently paralyzes US and Turkish memory politics.

  **Tractability:** High for political theorists. This requires parsing liberal theories of obligation (Rawlsian fairness vs. rectificatory justice) rather than new archival digging.

  ### Priority 2: The Substitution Hypothesis (Commemorative Density vs. Material Justice)
  **The Question:** Does high "commemorative density" (legal, educational, and spatial orientation toward a wrong) correlate with *lower* material redistribution, functioning as a moral license for the state to avoid economic repair?

  **Why this is Priority 2 (Policy Relevance):**
  This is the most urgent risk in liberal democracies. We are currently witnessing a shift from demands for reparations (material) to demands for representation and remembrance (symbolic).
  *   **The Risk:** A state might achieve high commemorative density (e.g., renaming buildings, mandatory curriculum, national days of mourning) precisely to *deflect* demands for land return, cash reparations, or jurisdictional autonomy. This is "over-commemoration" as a counter-insurgency tactic against material claims.
  *   **The Counter-Intuitive Insight:** We often assume denialism (Turkey) is the opposite of justice. But in liberal democracies, the opposite of justice might be *hyper-remembrance without restitution*.

  **Tractability:** Medium. This requires interdisciplinary work (theory + political economy). The theorist must define the metric for "substitution," while empirical partners measure the correlation between memorial spending and policy outcomes.
  **Policy Relevance:** Directly informs debates on reparations vs. DEI initiatives, or monument removal vs. housing policy in the US South.

  ### Priority 3: The Temporal Horizon of Obligation
  **The Question:** At what point does remembrance transition from a "living moral practice" to an "inherited performance," and does the state have a duty to facilitate *closure*?

  **Why this is Priority 3 (Sustainability):**
  This addresses your concern about "inherited performance." If memory is a civic duty (Priority 1), does it last forever?
  *   **The Problem:** If the obligation is permanent, it risks creating a caste system of "perpetrator descendants" and "victim descendants," which undermines the liberal goal of equal citizenship.
  *   **The Research Gap:** Most theory focuses on how to *start* remembrance. Almost none focuses on the *conditions for ending* state-mandated remembrance without sliding into denialism.
  *   **Criteria:** This is lower priority than #1 and #2 because you cannot determine the "end point" until you determine the "purpose" (Priority 1) and ensure it isn't masking injustice (Priority 2). However, it is essential for long-term stability.

  **Tractability:** Low. This is deeply philosophical (philosophy of time and generational ethics) and lacks clear empirical markers.

  ---

  ### Defense of Prioritization

  I have ordered these based on **logical dependency** and **risk mitigation**.

  1.  **Logical Dependency:** You cannot determine if memory is being "substituted" for justice (Priority 2) until you define what the memory is *for* (Priority 1). If the purpose is liability, substitution is a breach of contract. If the purpose is civic identity, substitution might be irrelevant (identity is the goal). Therefore, Priority 1 must be settled to make Priority 2 intelligible.
  2.  **Risk Mitigation:** The greatest immediate danger in the field is not that we forget (Denialism), but that we remember *instead* of paying (Substitution). Priority 2 addresses the most active harm in current policy debates.
  3.  **Tractability:** Priority 1 is the most "philosophically tractable." A small theory group can make progress here without massive grants. Priority 3 is too abstract for immediate policy impact, making it a long-term horizon goal rather than a near-term fellowship focus.

  ### Conditions for Reordering the Agenda

  I would shift resources away from this agenda under two specific conditions:

  1.  **Empirical Disconfirmation of Substitution:** If rigorous comparative data (e.g., across US municipalities or German *Länder*) showed that high commemorative density *increases* the likelihood of material redistribution (a "gateway" effect rather than a "substitute" effect), Priority 2 would drop. Currently, the anecdotal evidence suggests substitution, but if the data proved memory *catalyzes* money, the urgency diminishes.
  2.  **Breakthrough in Non-Liberal Normativity:** If a compelling theory emerged that successfully grounded intergenerational liability *without* relying on state continuity or civic identity (e.g., a robust cosmopolitan theory of historical harm that bypasses the state), Priority 1 would be resolved, and we could move straight to implementation (Priority 2 and 3).

  ### Implications That Do Not Follow (The "German Model" Warning)

  A major implication widely discussed that **does not follow** from the data is that **institutional density guarantees moral internalization.**

  The German model is often cited as proof that laws + monuments + curriculum = a changed citizenry. However, comparative data suggests this is contingent on the **threat of external enforcement** (Allied occupation) and **economic prosperity** (Wirtschaftswunder) allowing the luxury of guilt.
  *   *The Lesson:* You cannot legislate mnemonic architecture in a context of economic precarity or contested sovereignty (e.g., the US South or post-Ottoman Turkey) and expect the German outcome. The "German Model" is not a toolkit; it is a historical anomaly. Research should focus on **mnemonic architecture under conditions of state continuity and economic inequality**, as that is the reality for most post-imperial societies.

  ### Summary of the Agenda

  If I had the fellowship resources, I would devote 50% to **Priority 1** (defining the normative basis of mnemonic citizenship in continuous states), 30% to **Priority 2** (mapping the substitution effect in current policy), and 20% to **Priority 3** (theoretical work on temporal limits).

  This avoids the trap of simply cataloging memorials. Instead, it treats memory as a **governance technology** that must be audited for its normative legitimacy, its distributive consequences, and its expiration date. This is the only way to move from "facing the past" to building a viable political future.
