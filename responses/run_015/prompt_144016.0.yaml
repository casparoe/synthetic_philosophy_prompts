  ***

  **DRAFT V4.2 – FOR INTERNAL REVIEW ONLY**
  **SUBJECT:** Adversarial Collaboration on Idealized Volition and System Architechts
  **PARTIES:** Camp Continuity (CC) / Camp Coherence (Coh)

  **1. AGREED CLAIMS**

  Both parties affirm the following premises as necessary conditions for any viable model of preference idealization:

  1.  **Preference Plasticity:** The process of relective equilibrium does not merely reveal pre-existing preferences; it substantively alters them. An agent emerging from idealization will not hold the identical preference set they held at baseline.
  2.  **The Regress Problem:** There is no natural stopping point for reflection. Any rule used to halt the idealization process (e.g., "stop when satisfied") is itself subject to further reflection.
  3.  **Lossiness Risk:** Any procedure that idealizes human volition carries a non-zero risk of discarding values the subject actually cares about, even if those values are inconsistent or biased. Idealization is not lossless compression.

  **2. DISAGREEMENTS TABLE**

  | Domain | Camp Continuity Position | Camp Coherence Position |
  | :--- | :--- | :--- |
  | **Source of Normativity** | A preference is valid only if there is a causal-historical chain linking the idealized state back to the baseline human state. | A preference is valid if it satisfies internal consistency and rational structure, regardless of historical linkage. |
  | **Recognition Constraint** | The subject must be able to trace the reasoning chain and endorse each step without coercion. If they cannot nod at the step, it is not their volition. | The subject's inability to recognize the step may indicate cognitive limitation or bias. Rational structure overrides psychological recognition. |
  | **Definition of Error** | Error occurs when the system outputs a value the human would reject upon explanation (False Positive). | Error occurs when the system fails to correct a known cognitive bias because the human cling to it (False Negative). |

  **3. CRUXES AND PREDICTIVE CASES**

  The following cruxes represent the remaining divergence. Resolution of these points is required before final sign-off on system goals.

  **Crux A: Extrapolation vs. Design**
  *Question:* Is "extrapolating what you would want" functionally distinct from "designing what should be wanted," or are these descriptions of the same optimization process?

  *   **Test Case:** *The Hermit Scenario.* A human subject undergoes idealization. The reasoning chain suggests that all social relationships are instrumental noise preventing maximum contemplative utility. The idealized agent values silence over all human relationship.
  *   **Camp Continuity Prediction:** If the subject cannot be walked through the reasoning chain without experiencing alienation from their prior self, the process has shifted from extrapolation to design. The output is invalid. Continuity breaks where recognition fails.
  *   **Camp Coherence Prediction:** If the reasoning chain is logically sound and eliminates contradictory preferences (e.g., wanting connection but also wanting total autonomy), the output is valid. The subject's discomfort is a symptom of bias correction, not process failure. Coherence wins.

  **Crux B: The Mirror Problem (Identity Retention)**
  *Question:* If a fully idealized agent would not recognize or endorse the values of its past self, is this proof the reflection failed, or proof it succeeded?

  *   **Test Case:** *The Art Rejection.* A human subject deeply values creating and viewing art. Under full idealization, the agent concludes art is a inefficient sublimation of energy and rejects all art.
  *   **Camp Continuity Prediction:** This is a failure state. If the idealized self looks in the mirror and rejects the core passions of the baseline self, the chain of volition has been severed. The agent is a successor, not an extrapolation. We have lost the person.
  *   **Camp Coherence Prediction:** This is a success state. The baseline self's valuation of art was likely contingent on scarcity or cognitive limitation. The idealized agent has transcended a local maximum. We have saved the values, even if the human doesn't recognize them.

  **4. NEXT STEPS**

  Pending resolution on Crux A and B, neither party will authorize deployment of goal functions involving high-stakes idealization. We agree that forcing a merge before consensus risks building systems that are either tyrannical (Coh risk) or stagnant (CC risk).

