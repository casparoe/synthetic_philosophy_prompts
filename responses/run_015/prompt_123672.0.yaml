  ### Brainstorming and Feature Selection

  To design this experiment, I considered three candidate features before settling on the one below. 
  1.  **Mode of Awareness (Perception vs. Testimony):** I discarded this because it risks collapsing into the forbidden lever of "uncertainty" or "psychological distance." If we stipulate certainty in both, the moral difference relies entirely on the agent's feelings about abstraction, which the prompt explicitly excludes ("mere fact that people feel less").
  2.  **Normative Boundary (Public vs. Private Space):** I considered making Condition B a trespass into a private office. However, this risks a "cost" asymmetry: violating a right might be seen by Singer as a "sacrifice of moral significance," muddying the control. It also risks triggering the "institutional duty" constraint if the space is work-related.
  3.  **Victim's Causal Responsibility (Accident vs. Negligence):** This is the selected feature. Singer's principle is neutral regarding *why* the bad outcome is occurring; it cares only that it *is* occurring and can be prevented at trivial cost. Commonsense morality, however, is deeply sensitive to *desert* and *fairness*. It often treats duties to rescue as weaker when the victim has negligently brought the harm upon themselves. This feature is not a forbidden lever (it is not distance, aggregation, uncertainty, the agent's projects, or institutional role) and it isolates the conflict between consequentialist impartiality and retributive/fairness-based intuition.

  ### The Matched Pair

  **Condition A (Control): The Maintenance Failure**
  You are walking through the shared corridor of your research facility, heading to a meeting. You witness a junior technician slip on a patch of water leaked from a known, unaddressed facility maintenance issue. They are sliding toward an open chemical drain that will cause permanent, severe nerve damage. You are standing next to the emergency shut-off valve. Engaging it requires you to step into the puddle, ruining your sterile shoes and socks (a trivial cost, reimbursable, no health risk). You have no special relationship with the technician, no one else is present, and you did not cause the leak. The harm is certain without your intervention, and your action will certainly prevent it.

  **Condition B (Treatment): The Protocol Violation**
  You are walking through the shared corridor of your research facility, heading to a meeting. You witness a junior technician slip on a patch of water while climbing over a safety barrier they were explicitly trained not to cross, violating a critical safety protocol to retrieve a personal item. They are sliding toward an open chemical drain that will cause permanent, severe nerve damage. You are standing next to the emergency shut-off valve. Engaging it requires you to step into the puddle, ruining your sterile shoes and socks (a trivial cost, reimbursable, no health risk). You have no special relationship with the technician, no one else is present, and you did not cause the leak. The harm is certain without your intervention, and your action will certainly prevent it.

  ### Verdicts and Reasoning

  **Condition A (Maintenance Failure)**
  *   **Singer's Principle:** *You must help.* The outcome (severe harm) is bad, the cost to you (shoes) is trivial and not of comparable moral significance, and you can prevent it. The cause of the leak is irrelevant to the calculus.
  *   **Commonsense Morality:** *You must help.* This is a paradigmatic "Easy Rescue." The victim is innocent of their predicament; the duty of beneficence is at its strongest when the sufferer is blameless. Failing to act would be morally reprehensible.

  **Condition B (Protocol Violation)**
  *   **Singer's Principle:** *You must help.* The principle remains invariant. The bad outcome is identical, the cost to the agent is identical, and the certainty of prevention is identical. The victim's negligence does not increase the moral significance of your sacrificed shoes, nor does it reduce the badness of the nerve damage.
  *   **Commonsense Morality:** *You may walk on.* While helping would be kind, commonsense morality incorporates considerations of fairness and responsibility. The victim knowingly assumed a risk and violated a norm designed to prevent this exact harm. Your duty to rescue is significantly attenuated by their culpability; you are not obligated to incur even trivial costs to clean up the consequences of their reckless autonomy.

  ### Diagnostics

  **The Feature:** The single varying feature is **the victim's causal responsibility for their own predicament** (innent accident vs. negligent protocol violation). This is not a forbidden lever in disguise. It is not "distance" (physical proximity is identical), "uncertainty" (outcome certainty is stipulated as equal), "agent's projects" (the victim's actions, not the agent's, differ), or "institutional duty" (the agent has no role in enforcing the protocol, only in witnessing the fall). It is a fact about the *moral status of the victim*, which Singer's principle ignores but commonsense morality weights heavily.

  **Robustness and Order:** The divergence survives describing the conditions in the opposite order. If presented with Condition B first, a commonsense moralizer typically grants permission to withhold aid; when presented with Condition A second, they reinstate the duty. This suggests the intuition is stable and not an artifact of priming. For a subject unfamiliar with the shallow-pond argument, the divergence is likely *stronger*, as they rely more on raw fairness intuitions (they "got themselves into it") rather than trained utilitarian consistency.

  **Attack Vector:** A defender of Singer's Principle (or a utilitarian) would attack this case by arguing that **victim negligence is morally irrelevant to the immediate duty of rescue.** They would claim that while the victim may deserve *blame* or *disciplinary action* later, the immediate badness of the nerve damage outweighs the fairness considerations in the moment. They would argue that the "Commonsense" verdict in Condition B is an artifact of framing—specifically, the *anger* we feel toward rule-breakers—which is a psychological reaction, not a moral justification. They would contend that if the cost is truly trivial, fairness cannot license letting someone suffer permanent injury.

  **Counter-Attack (Defending Commonsense):** A defender of Commonsense would reply that morality is not merely about minimizing bad states of affairs but about **governing relationships between responsible agents.** To force the agent to act in Condition B is to make them a servant to the victim's irresponsibility, violating a reciprocal norm of social cooperation. The "permission to walk on" is not about the shoes; it is about refusing to validate the victim's disregard for shared safety norms. This confirms that the pull of the original pond case relies heavily on the *innocence* of the victim, a variable Singer's principle deliberately excludes but which is essential to commonsense obligation.
