      *   **The User's Hypotheticals:** Analyze the "Efficient Group" and "Reverse Monster."
      *   **The Opponent's Argument:** Diagnose what they meant and evaluate their rebuttal.
      *   **Conclusion:** Summary advice for future debates.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between "Greatest Good" (Intensity) and "Greatest Number" (Heads). The slogan tries to do both, which is mathematically impossible if they conflict.
      *   *Nuance:* The "Utility Monster" is specifically an objection to *welfarist aggregation*. It shows that if utility is the only metric, capacity for utility dictates distribution, not need or equality.
      *   *Debate Context:* In a school budget debate, "Headcount" is usually the implied metric because schools are democratic institutions. But "Total Utility" is the philosophical defense. I need to make sure the user sees the difference.
      *   *Case 1:* This is basically the "Tyranny of the Majority" but via utility aggregation. It's distinct from the Monster because it doesn't rely on an outlier capacity, just large N.
