  The leather bites the ankle bone no more,
  A slackening of rope around the flesh.
  The foot expands into the empty shoe,
  Not adding light, but subtracting weight,
  Leaving the loose thread dangling from the eyelet.

  The thread becomes a stream inside the throat,
  Cold river sliding down the esophagus.
  No dryness remains to pull the muscle tight,
  Just water occupying hollow ground,
  Leaving the filled cup resting on the table.

  The cup is wood, a bishop on the board,
  A knight lands where the other cannot go.
  The pattern locks, no other move will fit,
  A click of timber confirming place,
  Leaving the locked box sitting in the chest.

  The box explodes with sudden expelled air,
  A spasm tearing through the ribcage wall.
  The grip dissolves into a barking sound,
  The body shakes until the breath gives out,
  Leaving the spent lung burning for the pillow.

  The pillow holds the head that will not lift,
  Shapes losing edge against the cotton case.
  The room dissolves into a hum of blood,
  No shape holds, the borders blur away,
  Leaving the soft focus printing on the lid.

  The lid opens to see a ghosted face,
  A specific smile remembered in the bone.
  The past sharpens while the present rots,
  A sting behind the retina persists,
  Leaving the sharp nail pressing in the palm.

  The palm closes to keep the nail inside,
  Hoping only that the pressure stay.
  Is this grasp the feeling, or the frame?
  We keep the hand, and let the feeling go.

