answer: |-
  1. You argue the Orwellian versus Stalinesque dispute is badly formed because experiences aren't located at times. But the subject certainly feels something *now*. Why isn't that feeling itself a dated event, regardless of what its content says?

  2. Let's pivot to the data. If experiences aren't dated, what exactly is the datum you're working with? Is it just the subject's claim about what seemed to happen?

  3. If the datum is just the content of the report, doesn't the *tokening* of that content have a time? Isn't the Orwell-Stalin fight just reappearing one level down, as a dispute about which representation got tokened when?

  4. Consider a variant where the color of the second flash isn't fixed until after the apparent midpoint—say, a coin flip timestamped later. Intuitively, there couldn't be a red-experience at the midpoint whose content wasn't settled yet. Does your view require the content to arise only after the flip?

  5. If the content arises after the flip, haven't you just conceded the Stalinesque horn? Whether you call it "memory revision" or "content generation," the causal story looks identical. What's the substantive difference?

  6. I want to propose a design: run Color Phi but collect a speeded green-red discrimination via button press around the midpoint, separately from a delayed retrospective report. Suppose the two dissociate. What does each pattern of results show for your view?

  7. Follow-up on that design: Why shouldn't we treat the speeded button press as a better guide to the timing of experience than the later verbal report? What blocks you from privileging the motor response?

  8. Stepping back, is your view secretly just the Stalinesque horn with "experience" swapped for "content"? Is "the experience now represents red as having been at the midpoint" really different from "memory was revised"?

  9. You owe an error theory for the intuition that there's something it's like *right now*. If nothing is located at a time, what makes a run of experiences one stream rather than a pile? What does the binding?

  10. Finally, what evidence could count against you? If we had an independently validated neural marker of red-at-the-midpoint content present at the midpoint time, would that settle anything? If not, what would?
