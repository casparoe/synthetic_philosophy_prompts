answer: |-
  Here is the specification for a theory of gradational moral status, broken down by the edge cases that typically break the model. I've flagged the **Non-Negotiables** (constraints almost any plausible theory must meet to avoid absurdity) versus **Camp Preferences** (where schools of thought diverge).

  ### I. The Desiderata Specification

  #### 1. The Thermostat Lower Bound (The Grounding Constraint)
  *   **The Puzzle:** A thermostat detects deviation from a set-point and acts to correct it. This is homeostasis. Many organisms are defined by homeostasis. If moral status tracks the *capacity to maintain a state*, the thermostat earns non-zero status. If it tracks *suffering*, the thermostat earns zero.
  *   **The Spec:** The theory must distinguish between **error-correction without valence** (thermostat) and **error-correction with valence** (organism).
  *   **Requirement:** You cannot ground status solely in *function* (e.g., "goal-directedness"). You must ground it in *internal perspective* or *welfare interests*.
  *   **Status:** **Non-Negotiable.** If your theory grants moral weight to a thermostat, it is reductio ad absurdum.
  *   **The Trap:** If you say "it's about complexity," a smart thermostat is more complex than a nematode. If you say "it's about biology," you beg the question against AI. The theory needs a marker for *phenomenal binding* (the difference between processing data and *feeling* the data matter).

  #### 2. The Ant-Colony Problem (The Mereological Constraint)
  *   **The Puzzle:** An ant colony exhibits swarm intelligence, homeostasis, and defense. It functions like a superorganism.
      *   *Option A:* The colony is one entity. Does it have the status of a large mammal?
      *   *Option B:* The colony is a heap of individuals. Does stepping on a hive (killing 10,000 ants) outweigh killing one dog?
  *   **The Spec:** The theory must define the **unit of moral accounting**. Does status sum linearly across parts, or does integration cap the weight?
  *   **Requirement:** If status is gradational based on *integration* (how unified the system is), the colony might rate higher than a single ant but lower than a dog. If status is based on *sentient count*, the colony swamps the dog.
  *   **Status:** **Camp Preference.**
      *   *Aggregators (Utilitarians)* accept the swarm outweighs the dog (Non-negotiable for them).
      *   *Holists* argue the lack of a central nervous system means the colony has *less* status than the sum of parts (status dilutes).
  *   **The Trap:** If you allow linear summation of infinitesimal weights (see below), the colony problem becomes an extinction event for bacteria.

  #### 3. Continuous vs. Step-Function (The Sorites Constraint)
  *   **The Puzzle:** If status is a smooth slope (scalar), a bacterium has $0.0000001$ status. A human has $1.0$.
      *   *Problem:* $10,000,000$ bacteria = $1.0$ status. We kill trillions of bacteria to brush our teeth.
      *   *Solution:* You need a threshold where status becomes "significant."
      *   *Counter-Problems:* If you insert a threshold, isn't that just a binary view in disguise?
  *   **The Spec:** The theory must explain **Moral Inflation**. How do you maintain continuous gradation without making trivial harms (killing bacteria) sum to massive wrongs?
  *   **Requirement:** Either (a) accept moral inflation (hard pill to swallow), (b) introduce a lexical priority (higher beings trump any number of lower beings), or (c) argue status is non-linear (logarithmic).
  *   **Status:** **Jointly Unsatisfiable Subset** (See Section III). You generally cannot have Strict Continuity + Linear Summation + Intuitive Verdicts.

  #### 4. Synthetic Distributed Networks (The Substrate Constraint)
  *   **The Puzzle:** Imagine a mesh of simple processors (no central CPU) that collectively regulate temperature and avoid damage. Compare this to slime mold (biological, no brain, solves mazes).
      *   *Functionalist View:* They are identical. Same status.
      *   *Biological View:* Slime mold gets status (it's alive); the mesh does not.
  *   **The Spec:** The theory must identify the **status-bearing feature**. Is it the *carbon* or the *computation*?
  *   **Requirement:** If you choose computation, you risk the Thermostat Problem (why isn't the mesh just a fancy thermostat?). If you choose carbon, you risk Speciesism/Chauvinism.
  *   **Status:** **Camp Preference.**
      *   *Neural-Correlate Determinists:* Require specific biological architecture (non-negotiable for them).
      *   *Functional Pluralists:* Require specific information processing structures (non-negotiable for them).

  ---

  ### II. The Impossibility Theorems (Jointly Unsatisfiable Subsets)

  For your essay, this is the high-value conceptual work. You cannot satisfy all intuitive constraints simultaneously. You must sacrifice one.

  **Trilemma 1: The Aggregation Paradox**
  You cannot hold these three simultaneously:
  1.  **Strict Continuity:** Moral status is a smooth scalar with no hard thresholds (bacteria have *some* weight).
  2.  **Linear Summation:** The moral weight of a group is the sum of the weights of the parts.
  3.  **Intuitive Verdicts:** Killing one human is worse than killing any number of bacteria.
  *   *Resolution:* Most gradational theories drop (2). They argue status is **non-linear** (logarithmic) or that higher capacities grant **lexical priority** (a human's interest always trumps a bug's, regardless of numbers).

  **Trilemma 2: The Thermostat/Functionalist Conflict**
  You cannot hold these three simultaneously:
  1.  **Functionalism:** Moral status is grounded in causal roles (homeostasis, goal-seeking), not specific biology.
  2.  **Gradationalism:** Status comes in degrees based on the complexity of those roles.
  3.  **Phenomenal Exclusion:** Thermostats and simple algorithms have zero status.
  *   *Resolution:* You must admit that "complexity of function" is not the metric. You must smuggle in a **Phenomenal Constraint** (it must *feel* like something). But once you require "feeling," you risk reintroducing a Binary Threshold (either it feels or it doesn't), which undermines Gradationalism.

  **Trilemma 3: The Integration/Distribution Tension**
  You cannot hold these three simultaneously:
  1.  **Distributed Cognition:** A system without a center (ant colony, mesh network) can possess unified cognitive states.
  2.  **Moral Individualism:** Moral status attaches to the locus of experience.
  3.  **No Swamping:** The colony does not automatically outweigh a human.
  *   *Resolution:* If the colony is truly one cognitive unit (1), and status tracks cognition (2), then the colony is one moral patient. If its cognitive capacity is high, it might rival a human. If you want to avoid this (3), you must deny (1) and claim the colony is just a heap of individuals, which contradicts the premise of distributed cognition.

  ---

  ### III. Scoring the Main Views

  Here is how the standard seminar positions score against the spec above.

  #### 1. Scalar Capacity Theories (e.g., sophisticated Utilitarianism)
  *   **Core:** Status scales with cognitive/sentient capacity (memory, future-planning, pain intensity).
  *   **Thermostat Bound:** **Pass.** Usually grounds status in sentience/valence, not just regulation.
  *   **Ant-Colony:** **Fail.** Struggles with summation. If ants feel pain, 10,000 ants > 1 dog. Requires awkward "discounting" rules to avoid moral inflation.
  *   **Continuity:** **Pass.** Embraces the slope.
  *   **Synthetic:** **Pass.** Substrate neutral. If the mesh feels pain, it counts.
  *   **Weakness:** Vulnerable to the *Aggregation Paradox*. Requires accepting that enough gnats outweigh a person, or must secretly introduce a threshold.

  #### 2. Ecological / Relational Gradations
  *   **Core:** Status is not intrinsic but depends on the relationship to the observer or the ecosystem role.
  *   **Thermostat Bound:** **Pass.** Thermostats aren't part of the moral community/ecosystem in the relevant way.
  *   **Ant-Colony:** **Pass.** Treats the colony as a single ecological unit. Avoids summation issues.
  *   **Continuity:** **Fail.** Tends to be context-dependent rather than truly scalar. (Is the ant more valuable in the hive or on the table?)
  *   **Synthetic:** **Fail.** Heavily biased toward biological/natural systems. Struggles to explain why a synthetic "pet" wouldn't count.
  *   **Weakness:** Vulnerable to charges of arbitrariness. Why does the "relationship" ground the *status* rather than just the *obligation*?

  #### 3. The Hybrid View (Binary Status / Gradated Welfare)
  *   **Core:** You either have moral status (you are a "somebody") or you don't. But *how much* we owe you (welfare interests) scales gradationally.
  *   **Thermostat Bound:** **Pass.** Thermostats are "nobodies" (zero status).
  *   **Ant-Colony:** **Pass.** If ants are "somebodies," they count. But their *interests* are simpler than a human's, so violating them is less weighty. Avoids swamping because status doesn't sum, only welfare considerations do.
  *   **Continuity:** **Fail (by design).** Explicitly rejects continuous status. Reintroduces a threshold for "personhood" or "sentience."
  *   **Synthetic:** **Mixed.** Depends on where they set the binary threshold.
  *   **Weakness:** It kicks the can down the road. How do you justify the binary threshold without it being arbitrary? (This is where your prof's thermostat critique hits hardest).

  ### Summary for your Essay
  If you want to defend gradational status, your hardest work is **Trilemma 1**. You must explain why the slope doesn't lead to moral inflation (bacteria swamping humans). The most robust move is to argue for **non-linear weighting** (logarithmic status) rather than linear summation.

  If you want to defend the thermostat critique, your hardest work is **Trilemma 2**. You must show that "homeostasis" is fundamentally different from "valenced homeostasis" without relying on a magical binary switch. The move there is to focus on **information integration** (the difference between a loop and a unified field).
