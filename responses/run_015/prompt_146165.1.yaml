answer: |-
  Here is a complete design for your fifty-minute session. It is built to be robust: it works whether the data behaves as your seminar colleague predicts or not, because the pedagogical value lies in the *tension* the activity creates, not in confirming a specific hypothesis.

  ### Part 1: Runnable Session Design

  **Title:** The Weight of Certainty
  **Time:** 50 Minutes
  **Students:** 24 (First-year Phil/PPE)
  **Budget:** £20 (Non-cash prize)

  #### 1. Materials & Payoff Scheme
  *   **The Prize:** Purchase one high-quality "Philosophy Hamper" (e.g., a nice book + fancy chocolate/coffee) worth £20. This satisfies the "no cash" rule but retains value.
  *   **The Incentive:** Tell students: *"At the end of class, I will draw one name from the box. That person's sheet will be selected. One of their two choices (Round 1 or Round 2) will be picked at random and played for real. If your chosen option wins, you get the Hamper."*
      *   *Why:* This creates individual stakes without needing cash for everyone. It forces them to treat each choice as if it matters.
  *   **Handouts:** Two distinct sheets (Round 1 and Round 2).
      *   *Round 1:* Standard text presentation.
      *   *Round 2:* Visual table presentation with the "split" branch.
  *   **Visual Aids:** Two large posters or whiteboard diagrams corresponding to Round 1 and Round 2 structures. Coloured markers (Red/Blue) to highlight the "common" branches.
  *   **Collection:** A physical box for anonymity.

  #### 2. The Choices (Script & Handouts)

  **Round 1: The Standard Frame**
  *Handout Text:*
  > **Choice 1:**
  > **Option A:** £1 Million for sure.
  > **Option B:** 10% chance of £5 Million, 89% chance of £1 Million, 1% chance of Nothing.
  >
  > **Choice 2:**
  > **Option C:** 11% chance of £1 Million, 89% chance of Nothing.
  > **Option D:** 10% chance of £5 Million, 90% chance of Nothing.

  **Round 2: The Partitioned Frame**
  *Handout Text (with visual table):*
  > *Imagine a lottery machine with 100 balls. We have labelled them to make the groups explicit.*
  >
  > **Choice 1:**
  > **Option A:** Balls 1–100: £1 Million.
  > **Option B:** Balls 1–10: £5 Million. | Balls 11–55 (Red): £1 Million. | Balls 56–99 (Blue): £1 Million. | Ball 100: Nothing.
  >
  > **Choice 2:**
  > **Option C:** Balls 1–11: £1 Million. | Balls 12–100: Nothing.
  > **Option D:** Balls 1–10: £5 Million. | Balls 11–100: Nothing.
  > *(Note: In Option C, split the 'Nothing' into Red 12–55 and Blue 56–100 to match the colour coding of Option B's common consequence, even though the prize is the same.)*

  *Crucial Detail:* In Round 2, use **Red** and **Blue** ink to label the sub-branches of the 89% probability. In Choice 1, both Red and Blue yield £1M. In Choice 2, both Red and Blue yield Nothing. This visually highlights that the *event* is the same, even if the consequence differs, inviting cancellation.

  #### 3. Minute-by-Minute Timeline

  *   **00:00 – 00:05: Introduction & Stakes**
      *   Welcome. State the rule: "No discussion during choices."
      *   Explain the prize draw mechanism clearly. Emphasize that rational choice theory assumes you maximise expected utility even for small probabilities.
      *   Hand out **Round 1** sheets.
  *   **00:05 – 00:15: Round 1 (Standard)**
      *   Give them 3 minutes to choose.
      *   Collect sheets in the box.
      *   *Tally:* While they wait, quickly count the A/B and C/D splits on the top 5 sheets to get a live sample, or ask for a show of hands *after* collection to put aggregate data on the board. (Show of hands is faster: "Who picked A? Who picked B?").
      *   Write percentages on the board. (Expect: High A, High D).
  *   **00:15 – 00:25: Round 2 (Partitioned)**
      *   Hand out **Round 2** sheets.
      *   Say: "These are the same lotteries, but described differently. Choose again."
      *   Collect sheets.
      *   Tally aggregate on board.
  *   **00:25 – 00:30: The Reveal**
      *   Compare the two columns on the board.
      *   Ask: "Did anyone change their mind between Round 1 and Round 2?" (Ask for a show of hands).
      *   Draw the box for the prize (do this now so they know it's real, but don't open it until the end).
  *   **00:30 – 00:50: Debrief & Theory**
      *   (See Part 2 below for the script).

  ---

  ### Part 2: The Debrief (Mapping Activity to Theory)

  Do not start with definitions. Start with the board data.

  **1. The Phenomenon (5 mins)**
  *   **Script:** "Look at the board. In Round 1, most of you preferred A over B, but D over C. In Round 2, the numbers shifted [or didn't]. But mathematically, Round 1 and Round 2 are identical. The probabilities sum to the same values. The prizes are the same."
  *   **Point:** Your preferences shifted (or felt tension) without the *world* changing, only the *description* of the chance event.

  **2. The Independence Axiom (10 mins)**
  *   **Visual:** Draw the decision tree for Round 1, Choice 1 on the whiteboard.
      *   Branch A: 100% $1M.
      *   Branch B: 10% $5M, **89% $1M**, 1% $0.
  *   **Script:** "Expected Utility Theory says you should evaluate a gamble by summing probability × utility. Notice the **89% chance of $1M** in Option B? It is the same as the 89% part of Option A (if we split A into 11% + 89%)."
  *   **The Cancellation:** "If I strip away the common 89% chunk from both options, what is left?"
      *   Leftover A: 11% $1M.
      *   Leftover B: 10% $5M + 1% $0.
  *   **Script:** "Now look at Choice 2 (C vs D). Choice C is 11% $1M + 89% $0. Choice D is 10% $5M + 90% $0."
  *   **The Trap:** "If you strip the common 89% $0 from Choice 2, you are left with exactly the same comparison as above (11% $1M vs 10% $5M + 1% $0)."
  *   **Definition:** "The **Independence Axiom** says: If you prefer A over B, you must still prefer A over B even if both are mixed with a common third gamble (the 89% part). Your preference should depend only on the parts that *differ*."
  *   **Conclusion:** "If you chose A in Pair 1 and D in Pair 2, you violated Independence. You let the common consequence (the 89%) influence your choice, even though it cancels out mathematically."

  **3. The Representation Theorem (5 mins)**
  *   **Script:** "Why do we care? Von Neumann and Morgenstern proved a theorem. They said: If your preferences satisfy four rules (including Independence), we can prove there exists a utility function $u$ such that you always maximise $\sum p \cdot u(x)$."
  *   **The Punchline:** "If you violate Independence, **no such function exists**. We cannot represent you as an 'Expected Utility Maximizer'. We cannot model you using the standard tool of economics. That is why this paradox matters. It breaks the model."

  ---

  ### Part 3: Diagnostic Separation

  You asked to separate three diagnoses for the violation. Here is how you frame this in the Q&A, and what Round 2 tells us.

  **Diagnosis 1: Normative Rejection (Certainty Effect)**
  *   **Theory:** Students genuinely value "certainty" ($1M for sure) more than probability suggests. They reject Independence as a rational requirement.
  *   **Round 2 Evidence:** If the split (Round 2) **fails** to reduce the violation, this diagnosis is strengthened. It suggests the preference for certainty is robust against visual framing.
  *   **What to say:** "If the colours didn't change your mind, perhaps you believe certainty *should* count for more. That is a normative claim: EUT is wrong."

  **Diagnosis 2: Coarse Outcomes (Regret/Disappointment)**
  *   **Theory:** The outcome isn't just "$1M". It is "$1M *when you could have had $5M*." The utility depends on the counterfactual. If we describe outcomes richly (including emotional states), EUT might hold.
  *   **Round 2 Evidence:** Ambiguous. Splitting the probability branch doesn't necessarily change the *emotional* outcome. However, if Round 2 **reduces** the violation, it suggests the "coarseness" was in the *event description*, not the outcome utility.
  *   **What to say:** "Perhaps you aren't valuing money, but avoiding regret. In Choice 1B, if you get nothing, you feel stupid because you gave up a sure million. In Choice 2, getting nothing is expected. If so, your utility function is stable, but we defined the 'outcomes' too narrowly."

  **Diagnosis 3: Instability / Framing Artefact**
  *   **Theory:** There is no stable preference. The mind constructs the preference on the fly based on salience.
  *   **Round 2 Evidence:** If Round 2 **significantly reduces** the violation (moves choices toward EUT consistency), this supports the "Artefact" diagnosis. It implies the violation was caused by the cognitive difficulty of seeing the common consequence in Round 1. Making it salient (colours/split) allowed "rational" processing to occur.
  *   **What to say:** "If the colours fixed it, your preference wasn't 'irrational', it was just hidden by a confusing description. You have stable preferences, but you need a clear map to see them."

  **Summary for the Board:**
  *   **No Change in Round 2:** Points to Normative Rejection or Deep Framing.
  *   **Change toward EUT in Round 2:** Points to Cognitive Artefact / Salience (Instability).

  ---

  ### Part 4: Candid Assessment (What Will Go Wrong)

  As a final-year student leading first-years, you need to anticipate the friction points.

  **1. The "Fake Money" Problem**
  *   **Predictable Issue:** Students will treat the £1M as abstract. They won't feel the "Certainty Effect" because £1M is already imaginary.
  *   **Mitigation:** In your intro, say: *"Imagine this is real. Imagine the feeling of walking away with nothing in Option B when you could have had A. Hold that feeling."*
  *   **Limitation:** You cannot fully replicate the stakes. Acknowledge this in the debrief: *"Experimentalists pay real money to avoid this. We are using imagination. Treat the data as suggestive, not definitive."*

  **2. The Tallying Bottleneck**
  *   **Predictable Issue:** Counting 24 sheets live takes too long. Silence will kill the energy.
  *   **Mitigation:** Do not count every sheet. Count the first 10 rapidly for a "live sample" and put that on the board. Or, simply ask for a show of hands *after* they hand in the sheets (anonymity is preserved because you don't link hands to sheets).
  *   **Better:** Ask for a show of hands for Round 1 *before* collecting sheets. "Show of hands for A? For B?" Write it down. Then collect. Do the same for Round 2. This is faster and keeps them engaged.

  **3. The "So What?" Reaction**
  *   **Predictable Issue:** Students may think, "Okay, I'm inconsistent. Who cares?"
  *   **Mitigation:** You must drive home the **Representation Theorem** point. "If you violate this, we cannot use the standard tools of economics to predict your behaviour. We cannot say you are 'maximising' anything. You become unmodelable."

  **4. What This Activity Cannot Deliver**
  *   **The Normative Force:** The activity shows *that* people violate the axiom. It does not prove *whether they should*. You cannot derive the "ought" from the "is" of the classroom data.
  *   **Your Voice:** You must add this personally at the end: *"The data shows we violate Independence. But is that a bug in our brain, or a feature? If certainty protects us from ruin, maybe the axiom is too cold. That is the philosophical question you take away."*

  **5. The Budget Constraint**
  *   **Risk:** £20 is low for 24 people if you try to give everyone something.
  *   **Fix:** Stick to the **One Winner** rule for the £20 hamper. It is standard experimental protocol. Do not dilute it into 24 small chocolates; the "lottery" aspect is part of the lesson on risk.

  ### Final Checklist for You
  1.  **Print 30 sheets** (extra for errors).
  2.  **Buy the prize** beforehand (do not waste seminar time).
  3.  **Practice the tree diagram** on the whiteboard so you can draw it quickly during the debrief.
  4.  **Watch the clock.** If the tallying runs long, cut the "Representation Theorem" math and focus on the "Cancellation" logic. The intuition is more important than the proof for first-years.
