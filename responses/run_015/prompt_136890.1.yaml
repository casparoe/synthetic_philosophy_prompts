answer: |-
  This is a classic problem in social epistemology and decision theory, wrapped in a very standard administrative hassle. You are right to be suspicious of a *mere* arithmetic average of initial estimates, but you may be undervaluing the epistemic work that happened during your three rounds of revision.

  Here is a breakdown of your three questions, followed by a concrete recommendation for Friday.

  ### 1. The Aumann Question: Was the initial gap irrational?

  You are referring to Aumann's Agreement Theorem. The rough intuition is correct: if two Bayesians share a common prior and have common knowledge of each other's posteriors, they cannot agree to disagree.

  However, the theorem's assumptions are incredibly strict, and your case likely violates at least two of them. This means your initial gap (75 vs. 40) does **not** imply that one of you was being irrational.

  *   **Common Priors:** You mentioned you agreed on base rates *before* opening the file. That's a good start. But "common priors" in the Aumann sense also implies common *likelihood functions*—i.e., you both interpret the same piece of evidence (e.g., a lukewarm reference call) as having the same probability given the hypothesis (Candidate gets tenure). If you are more optimistic about interpreting ambiguous evidence than Dana is, your likelihood functions differ. That violates the theorem's assumptions.
  *   **Common Knowledge:** For the theorem to force agreement, it's not enough that you *know* Dana's number. You must know that she knows your number, and that she knows that you know, ad infinitum. More importantly, you must know *how* she processed her evidence. Since you don't know exactly how she weighted the senior subfield contact's comments versus the reference calls, you don't have common knowledge of the *reasons* for the posteriors, only the posteriors themselves.

  **Verdict:** The initial gap is permissible. It reflects different likelihood functions (different interpretive lenses) and private information. The fact that you moved toward each other suggests you are treating the *fact of disagreement* as higher-order evidence, which is the rational response when Aumann's strict conditions aren't met but you still regard each other as epistemic peers.

  ### 2. The Evidence Question: Shared signals, different lenses

  You hit on a crucial distinction here. In standard "pooling" models, we imagine agents holding private pieces of a puzzle. In hiring, you both saw the whole puzzle, but you have different theories about what the picture represents.

  This matters because it changes the nature of the disagreement.
  *   **Private Information Model:** If I saw Reference A and you saw Reference B, we should swap info. Once we both know A and B, we should agree (assuming common likelihoods).
  *   **Judgment Model:** We both saw the Job Talk. You thought it was solid; Dana thought it was niche. This isn't missing data; it's differing weights.

  Does this mean you shouldn't have ended up agreeing? **No.** In fact, it makes the convergence *more* important. When we disagree on the interpretation of shared evidence, learning that a colleague (especially one with subfield expertise) interpreted it differently is strong evidence that my interpretation might be skewed by my own biases or blind spots.

  If Dana knows the subfield better, her "lens" on the writing sample and job talk is likely more calibrated to the tenure criteria of that specific field than yours. Your "lens" on the reference calls might be more calibrated to general professional reliability. The convergence suggests you implicitly recognized that your 75% might have overweighted the reference calls, and her 40% might have overweighted the subfield niche-ness.

  **Verdict:** The non-separability of evidence explains the initial gap, but it validates the convergence. You weren't just "reacting to a number"; you were updating on the reliability of your own interpretive lens in light of hers.

  ### 3. The Practical Question: Is splitting the difference defensible?

  There is a robust literature on probability aggregation (e.g., Genest & Zidek, 1986). The two main contenders are:
  1.  **Linear Pooling (Averaging):** $P_{committee} = w_1 P_1 + w_2 P_2$.
  2.  **Logarithmic Pooling (Geometric):** Updates more aggressively toward the extremes.

  In practical committee settings, **Linear Pooling (averaging)** is generally the most defensible standard, *provided* the weights ($w$) reflect relative expertise.

  **The "Splitting the Difference" Objection:**
  Your worry is that averaging is unprincipled. However, if you view yourselves as **epistemic peers** regarding the *all-things-considered* judgment, the Equal Weight View (Elga, 2007) suggests you should give each other's views equal weight.
  *   *Counter-argument:* You aren't perfect peers. Dana knows the subfield; you did more reference calls.
  *   *Rebuttal:* Tenure predictions depend heavily on research trajectory (Dana's strength) but also on collegiality and reliability (your strength via references). Unless one of you is clearly incompetent, equal weighting is a robust heuristic that minimizes expected error when reliability is hard to quantify.

  **The "Mechanical Updating" Objection:**
  You wrote: *"Neither of us changed our mind because of anything new... Each time we were just reacting to the fact that the other person had a different number."*
  This is the most important point: **The other person's number IS new evidence.** It is higher-order evidence about the quality of the file. If I think a candidate is 75% likely to succeed, and a colleague I respect thinks 40%, the mere existence of that 40% is evidence that I have missed something negative. Updating on that is not mechanical; it is Bayesian updating on a new data point (the colleague's judgment).

  ### Recommendation for Friday

  You have already done the hard work. The movement from 75/40 to 61/60 *was* the aggregation process. You didn't just average the start points; you deliberated and updated. The fact that you landed at 61 and 60 means you have effectively already agreed.

  **Do not go back to the initial numbers (75 and 40) and average them.** That would discard the epistemic work of the last three rounds.

  **Do not split the final numbers (61 and 60).** That is functionally the same as agreeing.

  **Here is the defensible procedure:**
  1.  **Adopt the Consensus Number:** Send **60%** (or 61%, it doesn't matter). The difference is noise.
  2.  **The Justification:** When you send the number to the Dean, do not frame it as "We averaged our guesses." Frame it as: *"The committee engaged in a multi-round deliberative process. We initially held divergent estimates based on different weightings of the evidence (research trajectory vs. reference data). After exchanging rationales and updating on each other's assessments, our independent estimates converged to approximately 60%."*

  **Why this works:**
  *   **Epistemically:** It respects the "conciliatory view" of peer disagreement. You treated Dana's dissent as evidence, updated, and found a stable point.
  *   **Practically:** It protects you both. If the candidate fails, you aren't solely responsible for the 75% optimism; if they succeed, Dana isn't solely responsible for the 40% pessimism.
  *   **Philosophically:** It acknowledges that the committee's probability is not just the sum of parts, but the result of the *interaction* of parts.

  **One caveat on weighting:**
  If you feel strongly that Dana's subfield expertise *should* have weighted her judgment more heavily than yours on the research component, you could acknowledge that internally. But given that you naturally converged to near-agreement (61 vs 60) without explicitly weighting, your implicit weighting during the conversation likely already accounted for her expertise. Trust the convergence.

  **Summary:** The convergence *is* the justification. The "mechanical" updating you worried about is actually the rational processing of higher-order evidence. Send the 60%.
