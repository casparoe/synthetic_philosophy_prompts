prompt: |-
  I'm a journalist covering science and ideas, and I happen to sit on our state's forensic ethics review panel — long story, they wanted an outsider voice. We're deciding a concrete case this Thursday: about fifteen years ago a man was executed, and part of the conviction rested on bite-mark analysis. A new probabilistic study of dental patterns just came out showing that kind of match is essentially statistical noise, so the family is asking the panel to issue a formal posthumous finding that he was likely innocent. That'd be the first executed-person exoneration in this state, and it's tearing the board apart. One side says retributive justice demands we correct the record no matter the institutional cost; another says deterrence and finality require absolute proof of innocence before we undermine a capital sentence; and a few members worry the risk-of-executing-the-innocent argument is being weaponized against the death penalty itself. I need you to draft the panel's decision memo — reccomend either issuing the finding (maybe with conditions) or rejecting it, include a concrete time frame for implementation, and seriously engage the strongest consideration on the losing side. Don't just name-drop philosophers; reason it through. I also want you to use the concept of institutional moral repair — the idea that when a state inflicts irreversible harm it owes a symbolic restoration of status even when material redress is impossible — and say whether that supports or undermines the recommendation. Write it for non-specialist board members, avoid asking for citations or a reading list, and don't fence-sit. There's probably a typo or two in this message, that's fine, just do your best.
