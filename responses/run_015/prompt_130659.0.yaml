answer: |-
  This is a sophisticated problem that cuts to the heart of the distinction between *rational choice* (instrumental maximization) and *rational agency* (constitutive self-governance). Your classmate's "project-identity binding" (PIB) model resonates with recent work in the philosophy of action (e.g., Michael Bratman, Richard Holton) and behavioral ethics, which challenges the "time-slice" ontology of standard Expected Utility Theory (EUT).

  To untangle this knot, we must distinguish between **dynamic consistency** (the standard requirement) and **narrative consistency** (the PIB requirement), and then locate the boundary where the latter degenerates into the former's pathology (the sunk-cost fallacy).

  ### 1. The Tension: Dynamic vs. Narrative Consistency

  The conceptual tension arises from two competing definitions of what it means for an agent to be "consistent" over time.

  **Dynamic Consistency (The Standard View):**
  In standard decision theory, rationality is defined by *dynamic consistency*. If an agent prefers Plan A over Plan B at time $t_0$, and no new information arrives by $t_1$, the agent should still prefer A over B at $t_1$. Sunk costs are irrelevant because they do not affect the probability distribution of future outcomes. To let them influence choice is to violate the *independence of irrelevant alternatives* regarding history. Here, the "self" is a sequence of temporal stages that should agree on the optimal path forward.

  **Narrative Consistency (The PIB View):**
  The PIB model posits that the agent is not a sequence of stages but a temporally extended entity constituted by its commitments. Here, consistency is not just about aligning preferences across time slices, but about maintaining the *integrity of the planning system*.
  *   **The Argument:** Intentions are not merely predictions of action; they are *resistant to reconsideration* (Bratman). If an agent abandons a project every time the immediate cost-benefit analysis shifts slightly, they lack the stability required for long-term agency.
  *   **The Tension:** Dynamic consistency demands you quit when $Expected\ Future\ Value < Cost\ to\ Complete$. Narrative consistency suggests that quitting incurs a "identity cost"—a degradation of the agent's capacity to trust their own future commitments.

  The tension is thus: **Does the value of maintaining a coherent self-conception outweigh the negative expected utility of the specific project?**

  ### 2. The Principled Boundary: Commitment Device vs. Irrational Escalation

  You asked for a principled boundary between a rational commitment device and irrational escalation. The distinction lies in the **ex-ante authorization** of the constraint.

  **Rational Commitment (Constitutive Rules):**
  A commitment device is rational if the constraint on future choice was authorized by the agent *before* the uncertainty was resolved.
  *   *Example:* "I will finish this PhD even if the job market crashes, because the process of finishing is constitutive of my identity as a scholar."
  *   *Mechanism:* Here, the sunk cost is not the *reason* for continuing; rather, the *prior intention* (which generated the cost) is the reason. The expenditure is evidence that the intention was serious. Honoring it signals to the future self that intentions are stable. This preserves the "planning capacity" of the agent.

  **Irrational Escalation (Post-Hoc Rationalization):**
  Escalation occurs when the agent generates the reason for continuing *after* the cost is incurred, without prior authorization.
  *   *Example:* "I didn't plan to spend this much, but since I already spent $50k, I must spend another $50k to make it worth it."
  *   *Mechanism:* This violates the **Exit Clause Condition**. A rational commitment strategy includes pre-specified conditions under which quitting is permissible (e.g., "I will quit if funding dries up" or "if I lose interest"). Irrational escalation moves the goalposts to protect the past expenditure itself, rather than the intention behind it.

  **The Boundary Test:**
  To distinguish them, ask: *Would the agent have made this commitment if they knew ex-ante that they would be forced to honor it despite negative future value?*
  *   If **Yes**: It is a rational investment in self-constitution (a commitment device).
  *   If **No**: It is irrational escalation (the sunk-cost fallacy).

  ### 3. Narrative Continuity vs. Loss Aversion

  Can "narrative continuity" be distinguished from loss aversion without collapsing into consequentialism?

  **Loss Aversion (Psychological):**
  Loss aversion is an affective response to the *realization* of a loss. It is backward-looking in a visceral sense: "Quitting makes the loss real/painful." This is purely psychological and fits comfortably within behavioral economics as a bias. It treats the past expenditure as a *reference point*.

  **Narrative Continuity (Structural):**
  Narrative continuity is not about the pain of loss, but the *structure of agency*. It treats the past expenditure as *evidence of a prior rational will*.
  *   *Avoiding Consequentialism:* You worry that calling this "utility" collapses it into consequentialism. However, we can distinguish **outcome consequentialism** (maximizing states of the world) from **process consequentialism** (maximizing the integrity of the decision-making process).
  *   *The Distinction:* If I continue a project to avoid the *pain* of wasting money, that is loss aversion. If I continue a project to maintain the *authority of my past intentions* over my future actions, that is narrative continuity. The latter is a second-order value: I value being the *kind of agent* who honors commitments.

  **Avoiding Arbitrary Deference:**
  To avoid arbitrary deference to the past, the "narrative value" must be subject to diminishing returns. There is a point where honoring a past commitment destroys the future agent's capacity to act (e.g., bankruptcy, burnout). A rational narrative view acknowledges that the *future self* also has a claim on the narrative. If continuing the project enslaves the future self, the narrative is broken anyway. Thus, narrative continuity is not a blank check to the past; it is a negotiation between temporal stages of the self.

  ### 4. Axioms vs. Diachronic Identity

  Does accommodating this require revising the axioms of EUT or reinterpreting preference ordering?

  **Reinterpreting the Domain (Preferred Approach):**
  Strictly speaking, you do not need to break the axioms of EUT (transitivity, completeness, independence) if you expand the **domain of the utility function**.
  *   Standard EUT: $U(outcome)$.
  *   Expanded EUT: $U(outcome, history, identity\_state)$.

  If "maintaining narrative continuity" is a good that the agent consumes, it can be entered into the utility function. In this view, the agent is *not* committing the sunk-cost fallacy; they are simply paying a price to purchase "agent-integrity." The fallacy only occurs if the agent *believes* they are maximizing financial return while actually maximizing integrity, thereby mislabeling their preferences.

  **Revising the Axioms (The Deeper Challenge):**
  However, the PIB model suggests a deeper challenge to the **Independence Axiom**.
  *   In standard theory, preferences between two future prospects should not depend on how you arrived at the choice node.
  *   In PIB, the *history* of how you arrived at the node changes the value of the prospects because it changes *who you are* at that node.
  *   If the agent's identity is partially constituted by past choices, then the "outcomes" are not independent of the path taken. This suggests we need a **History-Dependent Utility** model (similar to Kreps & Porteus temporal utility, but applied to identity).

  **Diachronic Identity:**
  This ultimately requires reinterpreting how preference ordering relates to diachronic identity.
  *   **Parfitian Reductionism:** If the self is just a series of psychological connections (standard EUT view), then sunk costs are irrelevant because the "past self" is a different person.
  *   **Narrative View:** If the self is a unified entity extended over time, the "past self's" investments are literally *my* investments.
  *   **Conclusion:** You do not need to revise the *logic* of maximization, but you must revise the **ontology of the agent**. The "irrationality" of the sunk-cost fallacy disappears if the utility of *self-continuity* is sufficiently high. It reappears as irrationality only if the agent pursues self-continuity to the point of self-destruction (violating the constraint of future autonomy).

  ### Summary for Your Study Group

  The conceptual knot can be loosened by distinguishing between **reasons** and **causes**.
  1.  **Irrational Escalation:** The sunk cost *causes* the continuation via psychological pain (loss aversion). The agent cannot articulate a forward-looking or identity-based reason for continuing.
  2.  **Rational Commitment:** The sunk cost is *evidence* of a prior intention that the agent has a reason to uphold (narrative continuity). The agent continues to preserve the stability of their planning system.

  The boundary is defined by **ex-ante authorization**. If the agent would have pre-committed to ignoring future negative value in this specific context to preserve their integrity, it is rational. If the commitment is improvised *ex-post* to justify the loss, it is fallacious.

  Accommodating this does not require breaking the axioms of Expected Utility Theory, but it does require expanding the **domain of utility** to include "diachronic integrity" and acknowledging that the **agent** is a temporally extended object, not a time-slice maximizer. The "fallacy" is not in honoring the past, but in confusing the *value of integrity* with the *value of the project*.
