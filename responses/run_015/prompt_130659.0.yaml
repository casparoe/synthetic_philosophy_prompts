      *(Self-Correction Note)*: I need to be careful not to simply validate the classmate's view as "correct." The prompt asks to explain the tension and the boundary. I must remain analytically neutral but rigorous. The standard view has strong arguments; the counter-view has philosophical depth. The synthesis is where the value lies.

      *Key Concept to Integrate:* **Michael Bratman's Planning Theory of Intention.** Intentions are resistant to reconsideration. This bridges the gap. Reconsidering costs too often is cognitively expensive and undermines agency. So, ignoring sunk costs *sometimes* is rational to preserve the planning system, even if it looks like SCF locally.

      *Key Concept to Integrate:* **Jon Elster on Ulysses.** Pre-commitment.

