answer: |-
  # The requirements

  1.  **Universal Domain (Non-negotiable):** Quantifiers must range over absolutely everything, including the semantic values of predicates and the domain itself. Natural language allows us to say "everything exists" or "all properties are abstract." A restricted domain forces an artificial metalanguage/object language split that semantics cannot sustain when analyzing general quantifiers. Without this, we cannot formally capture the meaning of unrestricted claims made by competent speakers.

  2.  **Self-Application (Non-negotiable):** Predicates must be permitted to apply to themselves. In natural language, "polysyllabic" is polysyllabic, and "short" is not short. A theory that bans self-reference syntactically fails to capture valid linguistic inferences involving self-predication. The semantics must allow a property to be within its own extension or anti-extension without triggering a type error.

  3.  **Hyperintensional Identity (Non-negotiable):** Property identity cannot reduce to coextensivity. "Being a creature with a heart" and "being a creature with a kidney" may pick out the same objects, but they are distinct properties. Semantics requires fine-grained individuation to explain cognitive significance and substitution failures in attitude contexts. Coextensive properties must remain distinct entities in the ontology.

  4.  **Structural Diagnosis (Non-negotiable):** The theory must explain what is structurally wrong with naive reasoning, not merely stipulate restrictions. Banning the Russell set by fiat leaves the speaker's competence unexplained. The theory must identify the specific inferential step that fails in paradoxical derivations. It must show why the reasoning looks valid but fails, rather than declaring the premise illegitimate from the start.

  5.  **Negation-Independence (Non-negotiable):** The resolution must handle paradoxes that do not employ negation, such as Curry's Paradox. Solutions that rely solely on restricting negation or the Law of Excluded Middle are insufficient. The theory must constrain the conditional or comprehension mechanism directly. Blaming negation alone leaves the semantic account of conditionals vulnerable to triviality via self-referential implications.

  6.  **Classical Logic (Preference-of-one-camp):** Retain standard classical inference rules where possible. While often sacrificed to save universal quantification, classical logic remains the default for formalizing natural language inference. Retaining it simplifies the semantic interface but places heavy pressure on the theory of collections. It is desirable for compatibility with standard mathematical reasoning but may conflict with universal domain constraints.

  # Prejudices, not desiderata

  Do not demand well-foundedness; natural language collections are not mathematical sets and do not require a bottom-up construction. Do not demand reconstructibility of standard mathematics; we are modeling meaning, not number theory, so the existence of the reals is irrelevant. Do not insist on bivalence if it forces domain restriction; truth-value gaps are preferable to ontological gaps when handling paradoxical sentences. Avoid prescriptive rules about what speakers *should* say; the theory must describe what they *can* say without collapsing into incoherence. Mathematical convenience must not override linguistic adequacy.

  # What can't be had together

  The subset comprising Universal Domain, Classical Logic, and Unrestricted Comprehension (implied by Structural Diagnosis and Self-Application) cannot be jointly satisfied without triviality. If every open formula defines a collection, and logic is classical, and quantifiers range over everything including those collections, Russell's derivation goes through. You must weaken one. Typically, Classical Logic is modified to a non-contractive or paraconsistent system, or Comprehension is restricted to stratified formulas. However, restricting Comprehension violates the demand for a Structural Diagnosis that respects speaker competence regarding arbitrary formulas. Thus, the tension lies between maintaining classical inference rules and allowing universal quantification over self-applicable properties. You cannot have a classical logic that tolerates unrestricted self-reference over a universal domain.

  # Which one I give up

  Classical Logic is the single requirement that excludes the most candidate theories. Most robust theories of universal properties, such as those employing truth-value gaps, non-contractive logics, or paraconsistency, require abandoning standard contraction or excluded middle. Retaining classical logic forces the theory into narrow corners, often requiring complex type hierarchies that violate the Universal Domain requirement. Sacrificing classical logic opens the field to semantic values that can handle paradoxical predicates without collapse. It is the highest cost, but necessary to save the universal domain.
