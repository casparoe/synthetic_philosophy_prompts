  **MEMORANDUM**

  **TO:** Select Board
  **FROM:** Public Safety Building Committee
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Fire Station Land Acquisition

  **Purpose**
  The Public Safety Building Committee requests a decision on the acquisition of land for the new fire station. We are at a critical juncture with the Route 9 parcel due to the state grant deadline of September 30. This memo outlines a concrete recommendation to secure the site within fiscal guardrails or, alternatively, to activate a viable backup plan without delay.

  **Recommendation**
  The Committee recommends the Select Board authorize a **Final Best and Final Offer of $750,000** for the Route 9 parcel, contingent on closing by September 30. This offer is non-negotiable. If the seller does not accept this amount by [Date, 14 days out], we withdraw immediately.

  Simultaneously, we recommend the Select Board pre-authorize **$300,000 in site-work funding** for the Highway Garage lot (Plan B) to be released only if the Route 9 deal fails. This funding should be appropriated now but held in reserve.

  **Financial Context**
  *   **Town Meeting Authorization:** $900,000 (Maximum legal ceiling, not a target).
  *   **Current Town Bid:** $740,000.
  *   **Competing Bid:** Reported at $760,000 (Pharmacy Chain).
  *   **Broker Prediction:** Seller may accept $800,000.
  *   **Original Appraisal:** $610,000 (14 months ago).
  *   **State Grant:** 50% match up to $500,000. Expires September 30. Must be used for land acquisition.
  *   **Sunk Costs:** Approximately $220,000 in design, legal, and fees. These funds are unrecoverable regardless of the outcome.

  **Strategic Rationale**

  **1. The Hard Cap ($750,000)**
  We recommend capping the offer at $750,000 rather than escalating to the broker's predicted $800,000 or the authorized $900,000.
  *   **Value vs. Pressure:** The original appraisal was $610,000. While markets shift, paying $800,000+ represents a significant premium over value driven by competition rather than utility.
  *   **The Grant Leverage:** At $750,000, the state covers $375,000. At $900,000, the state covers $450,000. To gain an extra $75,000 in grant money, the Town would spend an additional $150,000 in local funds. The math does not support chasing the maximum grant amount.
  *   **Sunk Costs:** The $220,000 already spent is gone. It cannot be recovered by overpaying for the land. Spending $900,000 to "save" the $220,000 is fiscally unsound. We must evaluate the purchase based on current value, not past expenditure.

  **2. Pre-Committing to Plan B**
  Pre-authorizing the $300,000 for site work on the Highway Garage lot is not a signal of weakness; it is a necessary safety net.
  *   **Negotiating Position:** Desperation drives up price. If the seller believes we have no alternative but to buy their land to have a fire station, they have no incentive to move below $800,000. Knowing we have a funded, viable alternative allows us to walk away from a bad deal.
  *   **Continuity of Operations:** If the Route 9 deal collapses, we cannot afford months of delay while we scramble to fund site work. Pre-authorization ensures that if we lose the grant for land, we still break ground on a station within the fiscal year.
  *   **Risk Mitigation:** This ensures the Town does not end up with neither a station nor the grant. If Route 9 fails, we immediately pivot to Plan B using existing town land, avoiding the need for a new land purchase entirely.

  **3. Confidentiality of the Cap**
  Making our maximum price public to the seller guarantees we will be outbid or charged exactly that amount. The $900,000 Town Meeting authorization is already public knowledge, which has weakened our position. However, making the *internal* cap of $750,000 irrevocable for the Committee and Select Board is essential. It prevents "scope creep" during negotiations where pressure mounts to simply "get it done." We should not disclose the $750,000 limit to the broker or seller; we should simply present it as our final offer.

  **The Case for Continuing (Minority View)**
  Committee members advocating for a higher offer (up to the $900,000 authorization) argue the following:
  *   **Location Superiority:** The Route 9 parcel offers significantly better response times to the commercial district and main residential areas compared to the Highway Garage lot. The Highway Garage site requires complex mitigation for ledge and wetlands, which could delay construction even if funded.
  *   **Grant Utilization:** The state grant is "free money" available only for this purpose. Failing to utilize the full $500,000 potential (by purchasing at a higher price point) leaves resources on the table that taxpayers have already approved via the grant program.
  *   **Prior Investment:** The $220,000 in design work is partially specific to the Route 9 site. Moving to Plan B renders roughly 80% of that engineering useless, requiring new design costs that could offset the savings from a lower land purchase price.
  *   **Visibility:** A station on Route 9 provides public visibility and reassurance that a site behind the highway garage does not.

