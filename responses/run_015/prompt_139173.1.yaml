answer: |-
  # Fermi Paradox: Post-Discovery Ranking (2060 Scenario)

  **Scenario:** One technosignature at 71 ly (1.8 Gyr head start); no other detections in 5,000 stars; no Dyson spheres; no radio signals.

  | Explanation | Earned (Predictive) | Fit (Parsimony) | Tier |
  | :--- | :---: | :---: | :---: |
  | **1. Rare Earth** | 9 | 9 | **Top** |
  | **4. They Stay Home** | 9 | 9 | **Top** |
  | **5. They Went Quiet** | 8 | 7 | **Middle** |
  | **2. Hard Step Behind** | 4 | 6 | **Middle** |
  | **8. We Are Looking Wrong** | 5 | 6 | **Middle** |
  | **3. Filter Ahead** | 3 | 4 | **Bottom** |
  | **6. The Zoo** | 4 | 3 | **Bottom** |
  | **7. We Are Early** | 1 | 2 | **Bottom** |

  ### Tier List Justifications

  **Top: Rare Earth**
  This predicts exactly one or two neighbours in the entire Galaxy, matching the single detection amidst 5,000 surveyed stars.

  **Top: They Stay Home**
  This expects old civilizations to exist but remain local, fitting the 1.8 billion-year head start without galactic engineering.

  **Middle: They Went Quiet**
  This accounts for the lack of radio signals and waste heat, though the visible atmospheric pollutant suggests they are not entirely invisible.

  **Middle: Hard Step Behind**
  *Conflict Flag:* High fit for rarity but low earned score because finding a second case falsifies the "happened once" claim; resolved by demoting to Middle.

  **Middle: We Are Looking Wrong**
  This explains the missing radio signals, but fails to explain why only one star out of 5,000 shows even atmospheric signs of industry.

  **Bottom: Filter Ahead**
  This predicts self-destruction soon after detection, which contradicts finding a neighbour that survived 1.8 billion years longer than us.

  **Bottom: The Zoo**
  This requires a deliberate concealment policy that somehow failed to hide atmospheric pollutants while successfully hiding all other traces.

  **Bottom: We Are Early**
  *Validity Flag:* This stops answering the Fermi Paradox because the older neighbour proves we are not first; it now fails to explain why there are not more.

  ***

  **Note on Conflicts:** Where predictive power (Earned) and adjustment cost (Fit) diverge, the tier reflects the penalty for falsified premises rather than adjustable parameters.
  **Note on Validity:** "We Are Early" is excluded from future consideration as its core premise is observationally falsified by the neighbour's age.
