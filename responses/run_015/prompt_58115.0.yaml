answer: |-
  Your friend has constructed a sophisticated version of a classic problem in population ethics, often associated with Derek Parfit's "Repugnant Conclusion" and the "Non-Identity Problem." Her argument is powerful because it exploits a tension within **Total Utilitarianism**—the view that the right action is the one that maximizes the total sum of well-being in the universe.

  To preserve your conviction that ambitious climate action is owed to future people without accepting the obligation to maximize population size, you should reject **Premise (2)**.

  Here is an analysis of why that step looked plausible, what rejecting it commits you to, and what alternative frameworks allow you to maintain your climate convictions.

  ### 1. The Target: Why Reject Premise (2)?

  **Premise (2):** *If that same impartial logic holds, then we should also pay steep costs now to increase the number of future people living good lives...*

  **Why it looked plausible:**
  This premise relies on the **Total View** of population ethics. If moral value is determined by the sum total of happiness, then a world with 10 billion happy people is better than a world with 8 billion happy people (assuming the average happiness is at least equal). Consequently, if we are truly impartial, creating a new happy person should be morally equivalent to making an existing person happier. Since your friend assumes your climate argument relies on this "sum total" logic (aggregating small benefits across vast numbers), she argues you must be consistent and apply it to population size as well.

  **Why you should reject it:**
  You can reject (2) by appealing to the **Asymmetry Intuition**, a widely held view in population ethics. The intuition is this:
  *   We have strong moral reasons to avoid creating people who would suffer (lives not worth living).
  *   We do *not* have equivalent moral reasons to create people who would flourish (lives worth living).

  In other words, while the *presence* of pain is bad, the *absence* of pleasure (in the form of a person who never exists) is not bad *for anyone*. There is no subject who is deprived of the good life if they are never conceived. Therefore, "impartial concern" does not require us to maximize the number of people; it only requires us to care impartially about the welfare of those who *will* exist.

  By rejecting (2), you break the link between "caring about future welfare" and "obligation to expand the population." You can maintain that sheer numbers matter when weighing costs and benefits *for people who will exist* (Premise 1), without accepting that we must bring more people into existence to boost that total (Premise 2).

  ### 2. What Rejecting Premise (2) Commits You To

  If you reject (2), you are making specific philosophical commitments about the nature of our obligations:

  1.  **Obligations are to Subjects, Not Statistics:** You commit to the view that moral obligations are owed *to* specific individuals (or identifiable groups). We owe it to the generation of 2100 to ensure they inherit a habitable planet. We do not owe it to *potential* people to bring them into existence.
  2.  **The Distinction Between Harm and Non-Benefit:** You are committing to the view that making the future worse for those who will live there (climate damage) is morally distinct from failing to create more people who would have lived well. The former harms specific future agents; the latter harms no one.
  3.  **Limits on Aggregation:** You are accepting that while numbers matter for weighing harms (saving 1,000 future lives outweighs saving 10 present ones), numbers do not matter for *summoning* lives. This prevents the "logic of the sum" from demanding endless population expansion.

  ### 3. Alternative Views of Intergenerational Obligation

  Rejecting Premise (2) opens the door to alternative ethical frameworks that justify climate sacrifice without demanding pro-natalism. Each has strengths and trade-offs you must accept.

  #### A. Sufficientarianism
  **The View:** We do not owe future people the *maximization* of their welfare, but we do owe them a **sufficient threshold** of well-being (e.g., basic rights, security, habitable environment).
  *   **How it saves your view:** It demands steep present costs if current emissions threaten to push future people *below* the sufficiency threshold (catastrophic warming). However, it does not demand costs to increase the population size, as long as those who exist are above the threshold.
  *   **What you give up:** You lose the justification for climate sacrifice based on *marginal* improvements far above the threshold. If a policy costs the present generation dearly but only makes the future generation slightly *richer* (rather than saving them from catastrophe), Sufficientarianism might not require it. You must be comfortable with a "floor" rather than a "ceiling" on obligation.

  #### B. Rights-Based Approach
  **The View:** Future people possess certain negative rights, such as the right not to be harmed or the right to a habitable environment, regardless of how many of them there are.
  *   **How it saves your view:** High emissions violate the rights of future people to safety and subsistence. This creates a strict duty to mitigate. However, there is no "right to be born," so there is no duty to expand the population.
  *   **What you give up:** Rights theories can be rigid. You must accept that some cost-benefit analyses are off the table. For example, a Rights view might forbid a policy that saves a million future lives but violates a fundamental right, whereas a Utilitarian view might allow it. You also take on the burden of explaining how non-existent entities can hold rights.

  #### C. Contractualism (Reasonable Rejection)
  **The View:** Actions are wrong if they violate principles that no one could reasonably reject. We ask: "Could future generations reasonably reject our decision to burn carbon?"
  *   **How it saves your view:** Future people could reasonably reject a policy that leaves them with a devastated planet. However, potential people cannot "reject" a principle that doesn't bring them into existence, because they don't exist to do the rejecting.
  *   **What you give up:** This view is sensitive to the **Non-Identity Problem**. If your climate policies change *who* gets born (by changing economic conditions, marriage patterns, etc.), the specific people in the future who suffer from warming wouldn't have existed at all under a green policy. A strict Contractualist might struggle to say you harmed *them*. You would need to adopt a version of Contractualism that ignores the specific identity of future people (impersonal principles) to make this work fully.

  ### 4. Summary of the Trade-Off

  By rejecting Premise (2), you avoid the absurd conclusion that we must maximize population size. However, to do so consistently, you must refine *why* future numbers matter.

  *   **Your Friend's View:** Numbers matter because **Total Good = Population × Welfare**. (Demands Climate Action + Pro-Natalism).
  *   **Your Revised View:** Numbers matter because **Total Harm = Population × Risk**. (Demands Climate Action, Neutral on Pro-Natalism).

  You are effectively arguing that while we must count the *harms* avoided across a large population, we do not count the *benefits* of creating that population. This is a philosophically stable position (often called the "Person-Affecting Restriction" or "Asymmetry"), but it requires you to abandon pure Total Utilitarianism.

  **Recommendation:** Tell your friend that you accept the logic of Premise (1) regarding the aggregation of harm and benefit for *existing and future subjects*, but you reject Premise (2) because moral obligations require a *subject* to whom the duty is owed. We owe future generations a livable world, not existence itself. This allows you to defend steep climate sacrifices to prevent catastrophe (a harm to future subjects) without accepting the obligation to fund pro-natal policies (a benefit to potential subjects).
