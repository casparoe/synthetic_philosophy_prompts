      *   **Core Tension:** Is Stevens's failure a *lack* of an impartial spectator, or a *suppression/rationalization* of one? Does the social context deform the spectator itself?
      *   **Goal:** A seminar guide that is faithful to both texts (philosophy and literature), avoiding reductionism.
