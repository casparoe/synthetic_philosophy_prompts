  Hi — I'm putting together a two-page application for a 12-month fellowship (the kind where the committee mostly wants to see that you've got a question that is neither already answered nor unanswerable in a year), and I keep rewriting the same paragraph, so please just write the thing.

  The area is the evidential argument for cooperation in large worlds. You know the shape: if the world is big enough that it contains many agents relevantly similar to me, then on an evidential decision theory my decision whether to cooperate in a one-shot prisoner's-dilemma-ish situation is evidence about what those other agents do, and that evidential significance can swamp the small causal cost of my own cooperation — so I cooperate, and the thought is supposed to scale up into something like: in a sufficiently large world, evidential agents become broadly cooperative or other-regarding toward strangers.

  My half-formed idea, and I genuinely can't tell whether it's a real distinction or two descriptions of the same thing: every version of the argument I know seems to get the correlation between my action and yours from indexical uncertainty — I don't know which of the many similar agents I am, so my settling on an action is evidence about the type we share. But there's a second way to have such a correlation that the standard examples don't cover: common origin with no indexical uncertainty at all. Two systems — two models trained on overlapping data, or two people formed by the same institution — are numerically distinct, each knows exactly which one it is, there's no 'am I you or me?' question, and their dispositions are still correlated because of shared causal history. My suspicion is that these behave differently: once you can condition on the common cause it screens off and the evidential reason collapses, whereas in the indexical case there's nothing analogous for the agent to condition on. If that's right, then on the common-origin mechanism cooperation is eroded by the agent's increasing self-knowledge — learning about yourself eats your reason to cooperate — while on the indexical mechanism self-knowledge is the very engine of it. Call that the 'learning eats cooperation' hypothesis, if it survives.

  So: turn this into a proposal. Give me a precise statement of the question (something with a determinate answer, not 'what is the nature of evidential reasons'), say why the existing positions — the evidentialist's large-world optimism and the causalist's reply that correlation without causation gives you nothing to act on — leave it open, and give a month-by-month method for the 12 months. Include why this approach rather than the obvious alternatives: I could just formalize one toy model, or argue the general EDT-versus-CDT question again, or try to test cooperation between actual trained models, and I need to say why the approach I pick beats those. Say what the possible conclusions are — including the possibility that the two mechanisms turn out formally equivalent, and the possibility that common-origin correlation is actually the more robust one because real agents can't pin down a high-dimensional shared cause even in principle — and which considerations would decide between them. Give me an honest failure condition, and tell me where the project is likely to get too big for a year.

  Don't put in any citations or a bibliography; refer to positions and arguments by description and I'll fill in the references myself. And write it like a real application, not like a literature survey — I'd rather it be a bit overconfident about the plan than hedged to death.
