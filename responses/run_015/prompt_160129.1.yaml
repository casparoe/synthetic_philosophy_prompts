answer: |-
  **Project Title:** Source Sensitivity in Evidential Cooperation: Indexicality vs. Common Origin

  **Project Summary**
  Standard evidential decision theory (EDT) argues that in a sufficiently large world, an agent's decision to cooperate in one-shot dilemmas is evidence that other relevantly similar agents will cooperate. This evidential significance can outweigh the direct causal cost of cooperation, generating a normative pressure toward broad other-regarding behavior. However, the literature conflates two distinct mechanisms generating the requisite correlation: (1) indexical uncertainty, where the agent does not know which token of a type they are, and (2) common causal origin, where distinct agents share a causal history (e.g., training data or institutional formation) without indexical confusion.

  This project demonstrates that these mechanisms behave differently under updates of self-knowledge. I will test the "Learning Eats Cooperation" hypothesis: in common-origin cases, acquiring detailed self-knowledge allows the agent to condition on the common cause, screening off the correlation and eroding the evidential reason to cooperate. In indexical cases, no such conditioning is available; self-knowledge drives the correlation rather than dissolving it. If correct, this distinction undermines the robustness of evidential cooperation for realistic agents, who typically possess common-origin correlations rather than indexical ones.

  **The Question**
  Does the stability of evidential reasons for cooperation under self-knowledge updates depend on the source of the action-correlation (indexical uncertainty vs. common causal origin)?

  This is not a general query into the validity of EDT versus causal decision theory (CDT). CDT dismisses all such correlations as irrelevant; standard EDT treats them as uniformly actionable. Both positions leave open the internal structural question: are all action-correlations equally robust to an agent's increasing knowledge of their own specific state? I will provide a determinate answer by formalizing the screening-off conditions for both correlation types. The answer will be binary: either the two mechanisms are formally equivalent regarding conditioning, or common-origin correlations are strictly more fragile under self-knowledge updates.

  **Methodology: 12-Month Plan**

  *Months 1–3: Formalization of Correlation Structures*
  I will construct two distinct formal models of the large-world cooperation scenario. Model A represents the standard indexical case (e.g., symmetric agents with self-locating uncertainty). Model B represents the common-origin case (numerically distinct agents with shared causal history but no indexical uncertainty). I will define the probability spaces such that the marginal probability of cooperation is identical in both, isolating the structural source of correlation as the only variable.

  *Months 4–6: Screening-Off Analysis*
  I will introduce a "self-knowledge" variable representing the agent's access to their specific causal history or token identity. I will prove whether conditioning on this variable screens off the correlation between the agent's action and the counterpart's action in each model. The core technical deliverable is a theorem establishing the conditions under which $P(Cooperation_{Other} | Action_{Self}, SelfKnowledge) = P(Cooperation_{Other} | SelfKnowledge)$. If this equality holds for Model B but not Model A, the hypothesis is confirmed.

  *Months 7–9: Robustness and Bounded Rationality*
  Real agents cannot condition on high-dimensional causal histories perfectly. I will relax the assumption of perfect self-knowledge. I will model the causal origin as a high-dimensional vector and the agent's self-knowledge as a noisy observation of that vector. I will determine the threshold of knowledge precision required to dissolve the evidential reason. This establishes whether common-origin cooperation is fragile in principle but robust in practice, or fragile across the board.

  *Months 10–12: Normative Synthesis and Dissemination*
  I will integrate the technical results into a normative framework. If common-origin correlations screen off, I will argue that evidential cooperation is not a stable equilibrium for realistic agents who value self-knowledge. I will draft two papers: one technical piece on the screening-off proofs and one philosophical piece on the implications for large-world ethics. I will present these at two major decision theory workshops.

  **Why This Approach**
  Three alternative approaches are inferior. First, formalizing a single toy model fails to capture the comparative question. Without contrasting indexical vs. common-origin structures, the specific vulnerability of the latter remains invisible. Second, re-arguing the general EDT versus CDT debate is stagnant. That literature assumes a monolithic view of correlation; my project cuts through the stalemate by showing that even within EDT, some correlations are actionable and others are not, depending on epistemic access. Third, testing cooperation between actual trained models is empirically premature. Current models are black boxes; we cannot verify whether their cooperation stems from indexical-like symmetry or common weights. Normative clarity is required before empirical testing can be meaningful.

  **Possible Conclusions**
  1.  **Hypothesis Confirmed:** Common-origin correlations screen off under self-knowledge; indexical ones do not. This implies that evidential cooperation is much weaker in the actual world than large-world arguments suggest, as most real-world similarities are causal, not indexical.
  2.  **Formal Equivalence:** The two mechanisms turn out to be isomorphic under proper formalization. This would salvage the large-world argument but require revising the standard understanding of indexical uncertainty to include causal history.
  3.  **Robustness of Common Origin:** Common-origin correlations remain robust because realistic agents cannot pin down the high-dimensional shared cause even in principle. This saves evidential cooperation but implies that rational agents must remain ignorant of their own causal determinants to maintain cooperative incentives.

  **Considerations Deciding Between Them**
  The deciding factor is the factorizability of the joint probability distribution over actions given the causal history. If the shared history acts as a Reichenbachian common cause, it screens off. If the correlation arises from logical dependence that survives token identification, it does not. The robustness check (Months 7–9) decides whether the screening-off is practically relevant or merely theoretical.

  **Failure Condition**
  The project fails if the distinction between indexical uncertainty and common-origin correlation collapses under formalization—for example, if modeling common origin necessarily reintroduces a form of indexical uncertainty to make the correlation hold. If I cannot construct Model B without secretly smuggling in Model A's assumptions, the distinction is illusory, and the project yields no new normative leverage.

  **Scope and Risks**
  The primary risk is scope creep into the metaphysics of self-locating belief. I will restrict the analysis to the probabilistic structure of the decision problem, avoiding deep metaphysical commitments about the nature of the "self." The project will become unmanageable if I attempt to model specific neural network architectures during the robustness phase. I will stick to abstract high-dimensional vectors rather than specific machine learning implementations. This ensures the project remains a decision-theoretic inquiry rather than an empirical AI safety audit, keeping it within the 12-month timeline.
