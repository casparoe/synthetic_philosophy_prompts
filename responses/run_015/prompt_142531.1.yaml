answer: |-
  The naval architect wins the practical argument necessary for your scene, though the conservator is correct on strict metaphysics.

  (1) **Partly right.** She correctly notes that material constitution matters for artifacts intended as historical records, but her premise that a ship is *only* her fabric is false for functional vessels, which are defined by use.
  (2) **Right.** He correctly identifies that ships are maintained entities; functional continuity overrides material replacement in ordinary language and maritime practice.
  (3) **Right.** This is a valid philosophical objection; it exposes the conflict between material and functional criteria when both claims are present.
  (4) **Partly right.** The "no-gap" rule is a useful heuristic, but his premise that "uninterrupted shiphood" is clearly defined is false; it fails when replacement is gradual rather than discrete.
  (5) **Right.** This is the strongest move; it demonstrates that the "no-gap" criterion cannot distinguish between the two vessels if the transfer is continuous, creating a symmetry problem.
  (6) **Right.** He shifts to social ontology, which is accurate for legal and institutional contexts where recognition constitutes identity.
  (7) **Partly right.** She is right that identity is logically all-or-nothing, but mistaken to imply that graded criteria make the decision meaningless; vagueness does not preclude decision.
  (8) **Right.** He correctly adopts a view of conceptual relativity; "same ship" is a purpose-driven classification, not a mind-independent fact.
  (9) **Mistaken.** She conflates "conventional" with "arbitrary"; a decision based on established convention and purpose is reasoned, not random.
  (10) **Right.** He correctly identifies that legal disputes are resolved by intent and function, not metaphysical truth.

  Both parties are missing the specific clause in your will: "and to whoever is her master." This ties the vessel's identity to the lineage of command, not just the hull or the timber. The ship that maintained the continuous line of masters is the intended beneficiary, regardless of the planks. They are also missing the legal distinction between *numerical identity* (metaphysics) and *title* (law); the court does not need to know which ship *is* Theseus, only which ship *counts* as Theseus for the purpose of the bequest.

  The answer a court or maritime register would give will often come apart from the philosophical one. Courts track evidence of continuity—registry entries, logs, insurance records—rather than metaphysical substance. A court might rule for the vessel with the continuous registry even if the conservator proves it has none of the original wood, because the law prioritizes reliable documentation and intent over material essence. The two come apart where legal fiction overrides physical fact to ensure stability in commerce and inheritance.

  The naval architect has the better of the argument for your purposes, because he provides a decidable path based on purpose and practice, whereas the conservator leads only to an insoluble metaphysical deadlock.
