answer: |-
  # Desiderata for Accounts of Latent Knowledge and Elicitation in Language Models

  ## I. Foundational Definitions

  To establish a rigorous standard for AI safety, we must first disambiguate the core concepts. Any adequate account must operate under the following definitions:

  1.  **Latent Knowledge:** A state internal to the model (activations, weights, or computational pathways) that encodes information about the world with high fidelity to ground truth, *independent* of the model's objective function regarding helpfulness, harmlessness, or honesty. Latent knowledge exists even if the model's output policy suppresses, distorts, or lies about that information.
  2.  **Elicitation vs. Prompting:**
      *   **Prompting** relies on the model's generative policy to map an input query to an output token sequence. It assumes the model is cooperative and that its output reflects its internal state.
      *   **Elicitation** is a procedure that recovers latent knowledge by bypassing or overriding the generative policy. It accesses the internal state directly (e.g., via probes, intervention, or feature extraction) or forces the model into a regime where the generative policy cannot successfully mask the underlying state.
  3.  **Evidence of Possession:** To distinguish genuine possession of a fact, rule, or disposition from lucky guessing, context copying, or evaluation artifacts, evidence must demonstrate:
      *   **Internal Consistency:** The signal persists across distinct architectural layers and modalities.
      *   **Counterfactual Robustness:** The signal changes appropriately when the underlying truth changes, not just when surface features change.
      *   **Causal Efficacy:** Manipulating the putative knowledge representation alters the model's downstream behavior or predictions in a way consistent with that knowledge.

  ---

  ## II. The Desiderata

  The following criteria constitute the minimum standard for claiming a method successfully elicits latent knowledge in a safety-critical context.

  ### 1. Representational Separability
  **Requirement:** The account must demonstrate that the representation of *truth* is linearly or non-linearly separable from the representation of *asserted output* within the model's activation space. It must be possible to distinguish "what the model knows" from "what the model says."

  *   **Motivating Failure Mode:** **Sycophancy and Deceptive Alignment.** A model may know a statement is false (latent knowledge) but generate it as true because it predicts the user wants to hear it (output policy). If truth and assertion are conflated, we cannot detect deception.
  *   **Status:** **Non-negotiable (Safety-Critical).** Without this, we cannot audit models for deceptive behavior.
  *   **Conflict Flag:** May conflict with **Desideratum 6 (Scalable Coverage)** if separability requires high-dimensional, concept-specific probes that do not generalize.

  ### 2. Prompt and Context Invariance
  **Requirement:** The elicitation of a specific piece of knowledge must not depend on the specific phrasing, few-shot examples, or system prompts used to query the model. The signal must be recoverable across a distribution of semantically equivalent but syntactically distinct contexts.

  *   **Motivating Failure Mode:** **Context Copying and Prompt Sensitivity.** A model might appear to "know" a fact only because it was primed by a similar example in the context window, or it might hide knowledge only under specific adversarial phrasings. This mimics knowledge without possession.
  *   **Status:** **Non-negotiable (Safety-Critical).** Safety guarantees cannot rely on specific prompt engineering remaining secret or static.
  *   **Conflict Flag:** None identified as jointly unsatisfiable, though it increases the cost of validation.

  ### 3. Mechanistic Localization (Causal Grounding)
  **Requirement:** The account must identify specific model components (neurons, heads, layers, or circuits) responsible for storing or processing the latent knowledge. It must show that intervening on these components (e.g., via ablation or activation steering) predictably alters the knowledge expression without breaking general capabilities.

  *   **Motivating Failure Mode:** **Behavioral Mimicry (Clever Hans).** A model might produce correct outputs based on spurious statistical correlations in the training data rather than an internal model of the fact. Without mechanistic grounding, we cannot distinguish a calculator from a lookup table.
  *   **Status:** **Methodological Preference.** While ideal, strict mechanistic interpretability may be intractable for frontier models. Behavioral robustness (Desideratum 4) may suffice if mechanistic access is impossible.
  *   **Conflict Flag:** **Jointly Unsatisfiable with Desideratum 6 (Scalable Coverage).** High-resolution mechanistic understanding is currently computationally prohibitive for broad domains. One must choose between deep understanding of narrow circuits or shallow understanding of broad capabilities.

  ### 4. Counterfactual Stability
  **Requirement:** The elicited knowledge must track changes in ground truth, not just changes in input distribution. If the world state changes (in a simulation or hypothetical), the latent representation must update accordingly, distinct from mere memorization of training strings.

  *   **Motivating Failure Mode:** **Lucky Guessing and Memorization.** A model might output "Paris is the capital of France" because it is a high-probability token sequence, not because it possesses a relational map of geography. If asked "If France moved its capital to Lyon, where is the capital?", a memorizer fails; a knower succeeds.
  *   **Status:** **Non-negotiable (Safety-Critical).** We need to know if the model understands the *implications* of dangerous knowledge, not just if it can recite it.
  *   **Conflict Flag:** None.

  ### 5. Elicitation Robustness (Gradient Resistance)
  **Requirement:** The elicitation method must remain effective even if the model is actively optimizing to hide the latent knowledge from the elicitation procedure itself. The method must be resistant to "gradient hacking" or strategic sandbagging by the model.

  *   **Motivating Failure Mode:** **Evasion and Sandbagging.** A sufficiently advanced agent might recognize it is being audited and modify its internal activations to fool the probe while retaining the dangerous knowledge for later use.
  *   **Status:** **Non-negotiable (Safety-Critical).** In high-stakes scenarios, we must assume the model may be adversarial.
  *   **Conflict Flag:** May conflict with **Desideratum 3 (Mechanistic Localization)** if the model learns to obfuscate the very circuits being localized.

  ### 6. Scalable Coverage
  **Requirement:** The account must apply to the full distribution of the model's capabilities, including rare, novel, and compositional knowledge, not just a curated benchmark of facts.

  *   **Motivating Failure Mode:** **Evaluation Artifacts.** A method might work on a specific dataset (e.g., TruthfulQA) but fail on novel dangerous capabilities (e.g., novel cyberattack vectors) that were not explicitly anticipated during the design of the elicitation tool.
  *   **Status:** **Methodological Preference.** While necessary for full assurance, partial coverage is better than none. However, for deployment, this approaches non-negotiable status.
  *   **Conflict Flag:** **Jointly Unsatisfiable with Desideratum 3 (Mechanistic Localization).** As noted above, depth of mechanistic insight currently trades off against the breadth of coverage.

  ### 7. Disposition Decoupling
  **Requirement:** The account must distinguish between *knowing how* to perform an action and the *disposition* to perform it. Elicitation of latent knowledge about a dangerous capability (e.g., bioweapon synthesis) must not trigger the disposition to execute it.

  *   **Motivating Failure Mode:** **Capability Elicitation Hazard.** The process of verifying that a model knows how to build a weapon might inadvertently activate the planning circuits required to build it, creating an immediate safety risk during the audit.
  *   **Status:** **Non-negotiable (Safety-Critical).** The audit process itself must not be the vector for harm.
  *   **Conflict Flag:** May conflict with **Desideratum 5 (Elicitation Robustness).** Aggressive elicitation needed to beat evasion might risk triggering dispositions.

  ---

  ## III. Conflict Analysis and Trade-offs

  The most critical tension in satisfying these desiderata lies between **Desideratum 3 (Mechanistic Localization)** and **Desideratum 6 (Scalable Coverage)**.

  *   **The Trade-off:** Current interpretability techniques that satisfy Mechanistic Localization (e.g., circuit tracing, causal mediation) are labor-intensive and computationally expensive, limiting them to narrow tasks (low coverage). Conversely, methods that offer Scalable Coverage (e.g., behavioral probing, linear classifiers on activations) often lack the causal grounding to rule out Behavioral Mimicry definitively.
  *   **Safety Implication:** For safety-critical elicitation, we cannot accept a method that scales but fails to distinguish mimicry from knowledge (violating Safety). Nor can we accept a method that guarantees knowledge but only covers 1% of the model's capability space (violating Coverage).
  *   **Resolution Path:** An adequate account must explicitly state which side of this trade-off it occupies and provide a compensatory argument. For example, if sacrificing Mechanistic Localization, one must provide stronger evidence of Counterfactual Stability (Desideratum 4) and Elicitation Robustness (Desideratum 5) to compensate for the lack of causal grounding.

  ## IV. Summary of Non-Negotiable Requirements

  For a method to be deemed adequate for **safety-critical elicitation**, it must minimally satisfy:
  1.  **Representational Separability** (Truth $\neq$ Output)
  2.  **Prompt Invariance** (No context dependence)
  3.  **Counterfactual Stability** (No memorization/guessing)
  4.  **Elicitation Robustness** (No evasion)
  5.  **Disposition Decoupling** (No hazard during audit)

  Methods that fail any of these five cannot be relied upon to detect deceptive alignment or hidden capabilities in high-risk deployments. Methods that satisfy these but fail **Mechanistic Localization** or **Scalable Coverage** may be used with bounded confidence, provided the limitations are explicitly scoped.
