  Your instinct toward Origin Essentialism (the Kripkean line) is the most coherent way to unify your verdicts on cases (1), (3), (4), and (5). It preserves the directness of transworld identity (View A) without requiring the "detachment" of Counterpart Theory (View B), which you rightly feel struggles to capture the first-personal force of "I might not have existed" in (5). However, to make this principle rigorous, we must clarify how it handles constitution and fission.

  Here is the repaired principle, tested against your cases:

  **The Principle:** You are identical to an individual in another possible world if and only if that individual originates from the exact same specific causal event as you (e.g., the same conception or making), provided that individual is the unique bearer of that origin in their world.

  **Testing the Principle:**
  *   **(1) Statue vs. Lump:** This principle keeps your verdict without the "sortal-relative" dodge. The lump and the statue are *distinct objects* because they have different origins relative to their sortals (the lump originates from the matter's existence; the statue from the shaping event). Since they are distinct objects, they have different modal properties naturally. View A holds.
  *   **(2) Fission:** Here is the cost. Strict identity is one-to-one. If two successors share your origin, neither can be *strictly identical* to you without violating the transitivity of identity (if A=B and A=C, then B=C, but the successors are distinct). To maintain logical coherence, you must give up the verdict that "both are me" in the sense of identity. You can say both are your *successors* or *psychological continuers*, but not that both are *identical* to you.
  *   **(3) Replica:** Different causal origin (machine vs. parents). Verdict kept: Not you.
  *   **(4) Same Origin, Different Life:** Same causal origin. Verdict kept: Still you.
  *   **(5) Non-Existence:** No origin event in that world means no you in that world. Verdict kept: True that you might not have existed.

  **New Cases:**
  *   **Duplicate while alive:** Since the duplicate is built via copying rather than originating from your specific conception event, the principle says **not you**. It is a distinct individual with qualitative similarity but no identity.
  *   **Sibling from different pregnancy:** Even if qualitatively identical, a different pregnancy is a different causal event (different zygote). The principle says **not you**. Origin trumps qualitative similarity.

  **The Time-Relative Wrinkle:**
  Your partner's claim ("I could have been a pianist" was true at 10, false now) does not require the identity principle itself to be time-relative. The *criteria for identity* across worlds remain constant (origin). What changes is the set of *accessible worlds*. At ten, worlds where you become a pianist were open futures; now, they are closed branches of history. This is a feature of temporal modality, not a cost to the account of identity.

  Principle: You are identical to an individual in another possible world if and only if that individual originates from the exact same specific causal event as you, provided that individual is the unique bearer of that origin in their world.
