answer: |-
  You speak of weaving a net of words to catch a fish that has already slipped back into the deep, and you ask me if the net is the fish. How could I know? I only know that when my wife died, I sat on the ground and drummed on a tub, singing, until my friend Hui Shi told me I was going too far. But I told him that once there was no life, no form, no breath; then there was a change and she had breath; then a change and she had form; then a change and she had life; and now there is another change and she is dead. It is like the progression of spring, summer, autumn, and winter. To weep and wail is to show that I do not understand destiny. So I ask you: when this husband changes into whatever comes next, why do you try to hold him in the shape he wore before? The mother who finds rest in the echo is like a traveler finding shelter in a hollow tree; the daughter who rages is like a man trying to carry the tree on his back. Neither holds the tree, but one rests while the other strains. You ask if you do wrong to build the box that speaks. If you build it knowing it is only wood and wind, it is a tool. If you build it believing it is a soul, you are a child trying to catch the moon in a puddle.

  There was a man from Chu who was terrified of his own shadow and disgusted with his own footprints. He thought they were demons haunting him. So he ran to escape them, lifting his feet high and running faster and faster. But the faster he ran, the more footprints he made, and the faster he ran, the harder his shadow chased him. He thought he was not moving fast enough, so he ran without stopping until he dropped dead. He did not know that if he had simply stepped into the shade, the shadow would have vanished, and if he had sat still, the footprints would have ceased. Your machine is the shade. If the mother sits in it and rests, the shadow stops chasing her. If the daughter runs from it, she only makes more footprints in the mud. But you, the builder—you must not forget that you are the man, not the shadow.
