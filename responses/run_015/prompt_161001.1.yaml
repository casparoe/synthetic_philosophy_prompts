answer: |-
  **The Case**

  Consider a Municipal Housing Authority where two standing members, Councilor Kane and Councilor Rawls, must jointly approve a development bond. Kane is a straightforward act-consequentialist focused on aggregate housing supply; Rawls is a deontologist focused on tenant security and procedural consent. A package is on the table: Kane gets high-density zoning waivers (maximizing units), and Rawls gets strict eviction moratoriums (protecting tenure). To pass, both must vote to bypass a statutory environmental review—a positive act of complicity in procedural corruption that each registers as a distinct moral cost, not reducible to the other's value. They know each other's reasons and will face future votes. The gain exists only if both are credibly committed to the bundle despite the local cost. Rawls can vote for the density waivers because her integrity is bound up in the fidelity of the agreement itself; the promise generates a reason independent of the waiver's immediate utility. Kane cannot. Because Kane's decision procedure requires maximizing at the point of action, and because their reasons are public, Rawls knows that if a last-minute report suggests the eviction moratorium will slightly reduce total supply, Kane will defect. Kane knows Rawls knows this. Consequently, Rawls refuses the initial bargain, and the gains from trade are forfeited precisely because Kane is too flexible to be trusted.

  ***

  **The Analysis**

  **1. Generating the Verdicts**
  The verdicts turn on two features: the **transparency of reasons** and the **incommensurability of values**.
  *   **Deontological Success:** For a Williams-style integrity theorist, moral reasons flow from "ground projects" and commitments that constitute the agent's identity. Rawls's commitment to *this* cooperative agreement becomes a source of reasons that overrides the local moral cost of the density waiver. She is not "trading off" her values; she is honoring a commitment that is now part of her moral identity. The cost of the waiver is real, but the reason to keep faith is agent-relative and sufficient.
  *   **Consequentialist Failure:** Kane fails structurally, not because the deal lowers the welfare sum (it raises it), but because the *decision procedure* of act-consequentialism is time-inconsistent in transparent environments. To secure the deal, Kane must be disposed to vote for the moratorium even if, at $t_{vote}$, the utility calculus shifts slightly against it. But a transparent maximizing agent cannot credibly signal this disposition. Rawls, knowing Kane maximizes at $t_{vote}$, anticipates defection and withholds cooperation. The gain is lost because Kane cannot bind his future self to a sub-optimal act without ceasing to be an act-consequentialist at the moment of choice.

  **2. Removing the Constraints**
  *   **If Transparency is Removed:** If Kane's reasoning were private, he could simply lie, asserting a commitment he does not hold. He could secure the deal and then defect at $t_{vote}$ if utility demanded it (or keep it if the long-term reputational cost outweighed the short-term gain). The problem dissolves into a standard calculation of reputational utility, restoring consequentialist viability.
  *   **If Incommensurability is Removed:** If both values (supply and security) were measurable on a single scale (e.g., "social welfare units"), Kane could simply calculate the net sum of the package. If the package is net positive, he votes for it. The "commitment problem" vanishes because he isn't asked to honor a promise against the grain of utility; he is asked to maximize the sum. The specific need for a *non-maximizing disposition* to secure the trade disappears.

  **3. The Strongest Objection: Indirect Consequentialism**
  The sophisticated consequentialist will object that Kane should cultivate a **disposition to keep promises** (or a rule-consequentialist adherence to "always honor legislative bargains"). If Kane has this disposition, Rawls trusts him, the deal passes, and overall utility is maximized. The consequentialist criterion is preserved at the level of disposition selection, even if the act-level decision is non-maximizing.

  **4. Assessment: Self-Effacement or Survival?**
  This case suggests consequentialism must be **self-effacing** to survive, and even then, it is unstable.
  To close the indirect route, note the case specification: reasons are public and characters mutually known. If Kane says, "I am voting this way because I have cultivated a promise-keeping disposition," Rawls must ask: *Is this disposition rigid?* If it is rigid enough to hold when utility clearly dictates defection, Kane has effectively adopted a non-consequentialist *criterion* for this domain. If it is not rigid (i.e., he keeps the disposition only insofar as it maximizes), Rawls knows it will collapse under sufficient pressure.
  For Kane to be credible, he must actually *not* deliberate consequentially at $t_{vote}$. But if the *reason* he has for not deliberating consequentially is "because it maximizes," he is still deliberating consequentially about his deliberation. In a high-stakes, transparent environment where the partner knows the theory, the "disposition" looks like a bluff unless the agent genuinely abandons the maximizing criterion in practice. Thus, the case survives the objection only by showing that to capture these gains from trade, the consequentialist must act *as if* they are a deontologist, and if they must do so openly to be credible, the theory effaces itself. It recommends its own rejection in the public square to function.
