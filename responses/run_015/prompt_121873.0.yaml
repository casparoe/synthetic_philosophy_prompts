answer: |-
  The pattern you have identified exposes a fractured epistemology within professional certification, one that relies less on a coherent theory of knowledge and more on historical class distinctions and bureaucratic risk management. To reconstruct the implicit view of *knowing-how* (procedural knowledge) versus *knowing-that* (propositional knowledge), we must look at how different fields legitimise authority.

  **The Implicit Epistemology**

  The current system presupposes a hierarchy where *knowing-that* is the governing authority over *knowing-how*. In the academic sphere, the assumption is that thinking is not truly occurring unless it is crystallised into text. A philosopher thinking well in real time is viewed with suspicion unless that thought is later reconciled with the literature in written form. Here, *knowing-how* (the act of thinking) is treated as ephemeral and unverifiable without the *knowing-that* (the essay) to anchor it. The text is not merely a record of the thought; it is taken to be the thought itself.

  Conversely, in surgery and skilled trades, *knowing-how* is primary. The lights must turn on; the patient must survive. However, the introduction of reflective journals in vocational training suggests a shift. It implies that practical skill is epistemically opaque or 'low status' unless it can be translated into propositional language. The system demands that the tradesperson demonstrate they possess a theoretical model of their practice, not just the practice itself. This treats *knowing-how* as insufficient for full professional standing; it requires the scaffolding of *knowing-that* to be deemed 'educated' rather than merely 'trained'.

  **The Surgeon Exception: Status and Liability**

  The discrepancy between the electrician's reflective journal and the surgeon's silence on their gut feelings is not epistemological consistency; it is a matter of status and liability.

  Surgeons occupy a high-trust, high-status profession where the outcome is often binary and immediately visible (haemostasis achieved, vessel repaired). Their authority is entrenched. To demand a surgeon journal their intuition would imply their experience is not enough, which challenges the hierarchy of the medical establishment. Furthermore, in a litigious environment, writing down 'gut feelings' creates a liability trail. It is safer for the institution if the surgeon's knowledge remains tacit and is judged solely by the outcome and peer review, rather than a written justification that could be dissected in court.

  For vocational trades, the reflective journal serves a different purpose. It is a tool of 'professionalisation', an attempt to elevate a trade to a profession by imposing academic-style accountability. It assumes the worker cannot be trusted to maintain standards solely through practice; they must narrate their compliance. It is a bureaucratic audit trail disguised as pedagogical reflection.

  **Required vs. Nice Fit**

  In reconstructing what is strictly required by the practice versus what is a 'nice fit', we find significant underdetermination:

  1.  **Strictly Required:** For the surgeon, manual dexterity and decision-making under pressure are required. For the historian, archival rigour and argumentation are required. For the electrician, safe wiring is required.
  2.  **The 'Nice Fit' (The Excess):** The ability to *write about* the wiring is not required to wire safely. The ability to *perform* a historical argument orally in a pub debate is not required to write a thesis.
  3.  **Underdetermination:** The system conflates the skill with the ability to report on the skill. A brilliant thinker may write poorly; a brilliant surgeon may be inarticulate. By certifying the report rather than the act (in academia), or the act plus the report (in trades), we introduce noise. We are certifying *literacy* and *compliance* as much as we are certifying *competence*.

  **Standardisation Scenarios**

  If we were to certify everyone the same way, the consequences would reveal the absurdity of the current split.

  *   **Purely Practical Certification:** Imagine historians and philosophers certified solely by real-time performance. They might face oral defences on demand, debating complex ethical dilemmas without notes, or correcting logical fallacies in live discourse. This would privilege quick wit and rhetorical flair over deep, slow research. We might gain better public intellectuals but lose nuanced, long-form scholarship. Conversely, if surgeons were certified purely by written exam, we would face a catastrophe of theoretical knowledge devoid of tactile skill. You cannot write your way through a tremor in the hand.
  *   **Purely Propositional Certification:** If electricians and surgeons were certified only by essays, we would have theorists who understand the physics of electricity or the anatomy of the heart but lack the proprioception to intervene. This assumes knowledge is entirely transferable via language, which Ryle famously argued it is not.

  **Conclusion**

  The split presupposes that *knowing-that* is the language of authority, while *knowing-how* is the language of labour. Tradespeople are asked to write because they must prove they are more than labourers. Surgeons are not asked to write because their status is already secured by the gravity of their work. Academics write because their 'labour' is indistinguishable from their text.

  The system is philosophically underdetermined because it confuses *competence* with *accountability*. The reflective journal is not there to ensure the electrician thinks better; it is there to ensure the institution can prove the electrician was taught to think. If we truly valued *knowing-how*, we would test performance across the board. If we valued *knowing-that*, we would accept theoretical mastery as sufficient for practice. Instead, we have a class-based hybrid that demands the working class justify their hands with words, whilst allowing the elite to let their results speak for themselves.
