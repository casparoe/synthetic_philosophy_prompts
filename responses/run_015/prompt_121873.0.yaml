      *   *The Twist (Vocational Reflection):* Modern vocational training (NVQs, apprenticeships) often mandates "reflective logs." This suggests a belief that *knowing-how* is unstable or unprofessional unless articulated as *knowing-that*. It implies praxis needs theory to validate it.
      *   *The Exception (Surgeons):* Senior surgeons aren't usually asked to journal their gut feelings. Their authority is entrenched. This points to a status/power dynamic rather than a pure epistemological one.
      *   *Implicit Epistemology:*
