      *   **Collision 2: Instrumentalism vs. Moral Intuition (5 vs. 4).**
          *   *Conflict:* (5) says use concepts if they predict behavior. (4) says something is "off" ethically, even if user harm isn't clear and bot isn't a patient. If you're a pure instrumentalist, ethics usually reduces to consequences (user harm). If there's a non-consequentialist objection (e.g., "it's a category error to love a simulator"), that requires a realist stance on what the bot *is*, contradicting the "never commit to anything underneath" of (5).
          *   *Severity:* Medium-High. It suggests the instrumentalism isn't "pure."
          *   *Resolution:* Acknowledge the ethical stance relies on a specific ontology (simulator vs. agent) which contradicts the "never commit" rule.

      *   **Collision 3: Belief/Desire Asymmetry (3 vs. 5).**
          *   *Conflict:* (3) creates a principled distinction. (5) says be pragmatic. Why is belief-talk predictive but desire-talk not? Usually, they come in pairs (Belief-Desire Psychology).
          *   *Severity:* Medium. It's an inconsistency in application of the methodology.

