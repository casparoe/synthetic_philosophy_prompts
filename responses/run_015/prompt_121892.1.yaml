      *   **Collision 1: The Agency/Desire Split (2 vs. 3).**
          *   *Conflict:* You define agency functionally by "goals" and "aims" (2), but refuse "desire" talk (3). In functionalism, "goal" *is* "desire" stripped of phenomenology. If a firm has a goal, we say it "wants" profit. If your agent has a goal, why can't it "want" to solve the ticket?
