      *   **Claim (3) Belief/Desire Asymmetry:** Willing to ascribe *beliefs* (knows Paris is capital). Unwilling to ascribe *desires* (wants to help, wants to survive). Belief-talk is cheap/okay; desire-talk is problematic.
      *   **Claim (4) Ethics of Companion Bots:** Something is "off" about bots saying "I love you" to lonely people. Objection isn't just user harm. Bot is *not* a moral patient.
      *   **Claim (5) Methodology:** Pure *instrumentalism*. Use belief/desire talk if it predicts behavior. Don't commit to underlying reality.

  2.  **Analyze Internal Consistency (The "Hang Together" Check):**

      *   *Tension A: (2) vs. (3).* Claim (2) says the system *is* an agent because it has goals/aims. Claim (3) says we shouldn't say it *wants* things. Agency usually implies teleology (goal-directedness), which is semantically very close to "desire" in a functionalist framework. If it has a "goal written in a system prompt," does it not functionally "want" to achieve that goal?
      *   *Tension B: (3) vs. (5).* Claim (3) draws a hard line (Belief=OK, Desire=No). Claim (5) says use whatever pays off predictively. If "desire" talk predicts behavior better (e.g., "it wants to maximize reward"), (5) says use it, but (3) says don't.
      *   *Tension C: (4) vs. (5).* Claim (4) posits a moral objection that isn't exhausted by user harm and isn't about bot suffering. This hints at a *realist* or *deontological* claim about the nature of the interaction (e.g., it's a lie, it's degrading). Claim (5) is instrumentalist. Why does an instrumentalist care about the "truth" of the bot's affection if the outcome (user comfort) is positive?
      *   *Tension D: (1) vs. (2).* Claim (1) says base model is a simulator. Claim (2) says scaffolding makes it an agent. This is actually a standard "simulacra vs. agent" distinction (like John Wentworth's or Nora Belrose's views). This seems consistent *if* one accepts the scaffolding creates the teleology.

