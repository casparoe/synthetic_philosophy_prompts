          *   *Benefit:* Makes the ethical stance coherent.

  5.  **Select the Single Best Revision:**

      *   The core tension is between the *functional definition of agency* (2) and the *refusal of desire talk* (3), compounded by the *instrumentalist methodology* (5).
      *   If the user accepts functional agency (2), they *must* accept functional desires. A goal *is* a desire in functionalist clothing.
