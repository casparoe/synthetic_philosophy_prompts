answer: |-
  **Joint Statement on Historical Objectivity**

  **I. Agreed Claims**
  1. Primary archives constitute necessary but insufficient conditions for historical knowledge; they constrain but do not determine output.
  2. Selection and narrative emplotment are inevitable consequences of finite representation, not merely subjective biases.
  3. Large-scale interpretation is logically underdetermined by discrete documents.
  4. A functional distinction exists between correctible factual error and irreducible interpretive framing.

  **II. Disagreements**
  | Issue | Rankean Reconstructionist | Carr–White Constructivist |
  | :--- | :--- | :--- |
  | **Archival Recovery** | Yields knowledge of events *as they actually occurred*. | Yields knowledge of events *as mediated by traces*. |
  | **Narrative Form** | Transparent vessel; distortion is avoidable. | Unavoidable framework; constitutes meaning. |
  | **Present-Mindedness** | Causal historiography can transcend indexicality. | Causal historiography is irremediably indexical. |

  **III. Cruxes**
  (a) Whether historical interpretations can be subjected to retrospective calibration against subsequently declassified records in a manner analogous to predictive-model validation in the natural sciences, without thereby reducing historiography to a predictive discipline.
  (b) Whether the necessity of present-oriented selection entails that macro-causal claims in history are always relative to the historian's standpoint.

  **IV. Adjudicating Cases**
  *Case:* Post-1991 Cold War diplomatic narratives following Soviet/American declassifications.
  *Rankean Prediction:* Convergence toward a singular, accurate causal account as evidentiary noise reduces.
  *Constructivist Prediction:* Proliferation of competing valid narratives as new data enables distinct emplotments.

  **V. Verbal Disputes**
  The definition of "objectivity" is partially verbal. Rankeans equate it with correspondence to reality; Constructivists equate it with intersubjective procedural rigor. However, substantive disagreement remains regarding the ontological status of the past independent of description.

  **Concluding Note**
  I would revise my framing if archival findings demonstrated that narrative structures consistently fail to stabilize even when evidentiary saturation is reached. The step most liable to failure is the analogy between scientific calibration and historical interpretation, specifically regarding the absence of law-like regularities in human affairs that would permit true validation rather than mere coherence.
