  # Adversarial Collaboration: The Ontology of Inertial Frames

  ### I. Agreed Claims
  1.  **Newton's Empirical Data:** Both sides agree on the original observation: Water in a bucket climbs the walls when rotating relative to the laboratory/fixed stars, and remains flat when non-rotating relative to them.
  2.  **GR Vacuum Solutions:** Both sides agree General Relativity permits asymptotically flat spacetimes (e.g., Minkowski or Kerr metrics) where inertial frames are defined by boundary conditions at infinity, even in the absence of local matter.
  3.  **Mach's Principle in Standard Cosmology:** Both sides agree that strict Mach's Principle (inertia is *solely* and *instantaneously* determined by the distribution of distant masses) is violated in standard $\Lambda$CDM cosmology and standard GR vacuum solutions.

  ### II. Disagreements & Cruxes

  | Issue / Crux | Shared Thought-Experiment | Bucket Substantivalist Prediction | Relational Machian Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Ontology of Empty Universe**<br>*(Conceptual)* | **The Lonely Bucket:** A universe containing only a bucket and water, rotating at $\omega$. | **Concave Surface.** Rotation is absolute relative to the spacetime metric field, which exists independently of matter. | **Undefined/Flat.** Rotation is meaningless without external reference masses; inertia cannot be generated by the bucket alone. |
  | **2. Source of Concavity**<br>*(Crux 1)* | **Frame-Dragging Measurement:** Measure inertial frames inside a massive, rotating shell (Thirring-Lense effect). | **Local Geometry.** Concavity is driven by the local metric tensor $g_{\mu\nu}$. Distant masses influence $g_{\mu\nu}$, but the metric is the direct cause. | **Cosmic Mass.** Concavity is driven by interaction with cosmic mass-energy. The metric is merely a bookkeeping tool for these relational interactions. |
  | **3. Stripping the Stars**<br>*(Crux 2)* | **The Fade-Out:** Gradually remove all distant galaxies until only one remains (plus the bucket). | **No Change.** The water surface shape remains constant regardless of distant mass density, provided the bucket's rotation relative to the local metric persists. | **Shape Changes/ Vanishes.** As reference mass decreases, inertial effects diminish. With only one negligible galaxy, the surface should flatten or become indeterminate. |
