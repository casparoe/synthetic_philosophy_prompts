answer: |-
  Here is the triage of your list, the evaluation of theories, and the parameters you need to build the sisters without flattening them.

  ### 1. Triage: What Stays and What Goes

  You are right to suspect that some of these are prejudices or artefacts. For the purpose of character scaffolding, here is the split.

  **Non-Negotiable (The Backbone)**
  *   **The Residue:** The fact that a character can intellectually reject a norm but physically flinch at its violation (and vice versa). This is where the conflict lives in the body. If your sisters don't feel physical discomfort when acting against their own stated logic, they are essays, not people.
  *   **The Flip (Post-hoc Rationalisation):** People rarely reason their way to a verdict; they feel the verdict and then hunt for reasons. Your sisters must believe they are being logical, but the reader must see the logic is scaffolding erected after the fact.
  *   **Generativity (No Polling Data):** A theory that only explains surveyed dilemmas is useless for a novel. You need a mechanism that produces intuitions for unique situations (the specific kitchen betrayal).
  *   **Observable Markers:** Moral conviction must be writable. It needs a posture, a tone, a hesitation. If it's only internal monologue, it's philosophy, not fiction.
  *   **Domain Specificity:** People are not consistent. The 'loyalty' sister might be a ruthlessly fair employer but a corrupt friend. The 'justice' sister might demand truth for the worker but lie to protect her own child. Inconsistency is human; consistency is cardboard.

  **Negotiable (The Furniture)**
  *   **Incidental Effects (Smell/Drink):** Interesting for scene-setting, but not for character architecture. Don't build a personality around susceptibility to disgust primes unless it's a specific trait.
  *   **Killing vs. Letting Die:** This is specific to harm cases. Your conflict is about speech vs. silence and loyalty vs. justice. This distinction is less relevant than the *scope* of obligation.
  *   **Heritability/Trainability:** This is backstory, not scaffolding. It explains *why* they are different, not *how* they decide in the scene.
  *   **Moral/Conventional Line:** Useful, but covered by Domain Specificity. The key is whether they treat the transgression as a local rule break or a universal wrong.

  **The Prejudice Check**
  You worry that some demands are one camp's ideology dressed up as criteria. You are correct to worry about **The Harm-Only Constraint**. If you demand that every moral verdict must trace back to a victim, you have already decided the 'loyalty' sister is wrong. A valid theory must allow the loyalty sister to feel a genuine moral violation (betrayal of trust, dissolution of social fabric) without needing to point to a bleeding body. If your theory cannot accommodate her intuition as a *moral* intuition (rather than just 'fear' or 'bias'), you will write her as a villain rather than a protagonist with a conflicting ethic.

  ### 2. The Single Exclusionary Requirement

  The requirement that does the most work in excluding popular theories is **The Gap Between Verdict and Reason (encompassing The Flip and Residue).**

  This kills the pure Rationalist models (Kantian or Utilitarian calculators) because it insists that reasoning is often a servant to intuition, not the master. It also kills pure Emotivist models (it's just feelings) because it insists characters *must* construct coherent reasons to function socially. A theory that cannot account for a character who is sincerely convinced by a reason that did not cause their belief is useless for fiction. It forces you to adopt a dual-process view: fast, visceral intuition followed by slow, social justification.

  ### 3. The Contenders: A Brief Assessment

  *   **The Harm-Only Rationalist (e.g., Pinker, Singer):**
      *   *Verdict:* Useless for your draft. It will force you to write the 'loyalty' sister as irrational or selfish. It cannot account for the moral weight of purity or loyalty without reducing them to 'indirect harm', which feels intellectualised and fake in dialogue.
  *   **The Pluralist Foundations (e.g., Haidt):**
      *   *Verdict:* Strongest scaffolding. It gives you distinct vocabularies (Care/Fairness vs. Loyalty/Authority/Purity). *Risk:* It encourages typology. Do not let Sister A be 'Care' and Sister B be 'Loyalty'. They must both value both, but weigh them differently under stress.
  *   **Morality-as-Cooperation (e.g., Currie, Birch):*
      *   *Verdict:* Excellent for the town context. It frames the 'closing ranks' not as corruption but as a strategy for group survival. It helps the 'loyalty' sister argue that exposing the man harms the collective ecosystem that feeds everyone.
  *   **Tribal Signalling (e.g., Hard cynicism):**
      *   *Verdict:* Poison for protagonists. It reduces conviction to status manoeuvring. Readers might believe it's true, but they won't empathise with a character who knows they are just signalling. Use this for the antagonists or the internal cynic voice, not the moral core.

  ### 4. The Core Tension: Is vs. Ought

  You asked if psychology tells us who is right. It does not. This is the friction point you identified.

  A descriptive theory explains *why* a character feels a conviction (upbringing, neural weights, social utility). A normative claim asserts *that* the conviction is true. The tension you must sustain is this: **The characters must experience their intuitions as discoveries of truth, while you (the author) understand them as constructions of psychology.**

  If you resolve this tension, the novel dies.
  *   If you decide the 'justice' sister is objectively right, the 'loyalty' sister becomes a obstacle to be overcome.
  *   If you decide the 'loyalty' sister is objectively right (social cohesion trumps individual justice), the 'justice' sister becomes a naive disruptor.
  *   **The Novelistic Truth:** Both are experiencing real moral data. One is reading the data of individual suffering; the other is reading the data of social collapse. The theory must validate the *reality of the feeling* for both, without validating the *truth of the claim* for either. The reader must feel the weight of the factory closing *and* the weight of the boy's silence.

  ### 5. The Knobs: Building Predictable but Human Characters

  Do not set sliders for 'Loyalty' or 'Fairness'. That creates the cardboard cutouts you want to avoid. Instead, set these parameters:

  **1. The Radius of Obligation**
  *   *Setting:* Who counts as 'us'?
  *   *Application:* Does the character's duty stop at the family gate, the factory wall, or the town line? The 'loyalty' sister likely has a tight radius (Family/Town = Us, Outsiders = Them). The 'justice' sister likely has a porous radius (The Worker = Us, even if he's not kin).
  *   *Scene Prediction:* When a stranger is involved, watch who gets protected.

  **2. Tolerance for Cognitive Dissonance**
  *   *Setting:* How much psychological discomfort can they endure before acting?
  *   *Application:* The 'loyalty' sister might have a high tolerance for the boy's suffering if it preserves the town, but a low tolerance for the shame of exposure. The 'justice' sister might have a low tolerance for the lie, but a high tolerance for the economic fallout.
  *   *Scene Prediction:* Who sleeps badly? Who gets headaches? Who drinks more?

  **3. The Trigger Threshold**
  *   *Setting:* What specific sensory input bypasses reasoning?
  *   *Application:* Does the 'loyalty' sister react to *disrespect* (tone of voice, public shaming)? Does the 'justice' sister react to *pain* (a flinch, a scar, a cry)?
  *   *Scene Prediction:* In an argument, don't have them debate principles. Have one react to the other's tone (disrespect) and the other to the other's coldness (harm).

  **4. Temporal Horizon**
  *   *Setting:* How far into the future does their moral calculus reach?
  *   *Application:* The 'loyalty' sister is likely focused on the immediate future (the factory closes next month). The 'justice' sister is likely focused on the indefinite future (truth lasts forever, or the boy's whole life).
  *   *Scene Prediction:* In crisis, who panics about next week vs. who worries about ten years from now?

  **5. Identity Fusion**
  *   *Setting:* How much is the moral issue tied to *who they are*?
  *   *Application:* If the 'loyalty' sister sees herself as the 'Keeper of the Family', exposing the man is not just wrong, it is *self-annihilation*. If the 'justice' sister sees herself as 'The Witness', silence is self-annihilation.
  *   *Scene Prediction:* Threats to the moral stance should be met with existential panic, not just disagreement.

  **Summary for the Draft**
  Use the Pluralist Foundations to give them different vocabularies, but use the **Gap Between Verdict and Reason** to ensure they both stumble. Let the 'justice' sister be cruel in her pursuit of truth. Let the 'loyalty' sister show genuine care for the victim while still choosing silence. The humanity is in the contradiction, not the consistency.
