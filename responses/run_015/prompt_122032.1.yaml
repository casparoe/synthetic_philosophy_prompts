      *   *Incidental Effects (Smell/Drink):* Interesting for scene-setting (embodied cognition), but maybe negotiable for *character scaffolding*. More about state than trait.
      *   *Residue (Guilt/Disgust after belief change):* **Non-negotiable.** This is where the humanity lives. The gap between intellect and instinct.
      *   *The Flip (Post-hoc rationalisation):* **Non-negotiable.** People rarely know *why* they believe what they believe until asked. Essential for avoiding cardboard rationality.
      *   *No Polling Data (Novelty):* **Non-negotiable.** A theory must generate predictions for new cases, not just categorise old ones.
      *   *Observable Markers (Bodies):* **Non-negotiable.** It's a novel, not a philosophy thesis. Needs physicality.
      *   *Moral/Conventional Line:* Useful for distinguishing core values from social norms. Relevant to the "town rules" vs. "universal wrong" tension.
      *   *Enforcement on Strangers:* Defines the scope of the moral claim. Is this a family matter or a universal truth?
      *   *Heritability/Trainability/Change:* Important for backstory and generational conflict.
      *   *Domain Specificity (Stickler vs. Consequences):* **Non-negotiable.** People aren't consistent utilitarians or deontologists across all contexts.
      *   *Is vs. Ought (Who is right?):* **The Core Tension.** The user identifies this correctly. A descriptive theory explains *why* they believe; it doesn't solve *who* is right. This is the friction point.

  3.  **Determine Non-Negotiables vs. Negotiables:**
      *   *Non-Negotiable:* Residue, The Flip, No Polling Data (Generativity), Observable Markers, Domain Specificity. These ensure psychological realism and narrative utility.
