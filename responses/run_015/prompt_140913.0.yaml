      *   And (5) makes it worse because "address" requires current capacity.

      *Refining the "Single Change":* The strongest lever is (5). If you shift from a purely *communicative* theory of blame (McGeer, Wallace) to a *hybrid* or *expressive* theory, you save (6) and ease the tension with (4). But wait, (1) says responsibility *is* fittingness of attitudes. If the attitude is fitting (6), but the definition of blame (5) precludes it, (5) is the outlier.
      *   Actually, the cheapest revision might be to (6). It's the most intuitively controversial claim. But the user *wants* to hold (6).
      *   Let's look at (4). "Objective attitude is right... when conduct is better explained by causes." If the *past* conduct was reasons-based, (4) doesn't strictly ban blaming them now. It bans blaming them for *current* conduct. So (4) and (6) might be compatible if (4) is time-indexed to the action.
      *   But (5) "demand the victim makes on the wrongdoer" implies the wrongdoer can *hear* it.
      *   Okay, the real knot is (5) + (6). (4) is less of a problem if interpreted as "exemption conditions at time of action." But Strawson usually ties it to the *current* possibility of relationship.
      *   Let's flag (5) as the primary culprit for the dementia issue.

      *Re-evaluating (2) vs (3):* "Nobody can just decide... on some particular occasion." (2) says "cut a lot of it away wholesale." Wholesale cultural change is compatible with lack of particular occasion control. You change the water you swim in, not the individual splash. This is a "look like tension" but not a real one. I should downgrade this severity.

      *Re-evaluating (1) vs (2):* If responsibility is fittingness (1), and culture is unjustified (2), that implies our culture gets the fittingness wrong. That's fine. No tension.

      *So the main battle is the Dementia/Address cluster.*

      *Wait, one more thing:* (1) says "nothing further to ask." (5) says "failing to take themselves seriously." This links responsibility to self-respect. If (6) says you *can* blame dementia patients, does that serve self-respect? Yes. Does it fit (1)? Only if the attitude is *fitting*. Is resentment fitting toward someone who can't understand it? Strawson says reactive attitudes presuppose a demand for goodwill. If they can't offer goodwill, is resentment fitting?
      *   This brings us back to (4). If they are in the "objective" camp now, resentment is *unfitting*. So (1) + (4) -> (6) is false.
      *   So (1), (4), and (6) form a triangle of tension.

      *Okay, Plan:*
      1.  Acknowledge the strength of the position (it's a coherent "Strawsonian Left" view).
      2.  Identify the "Dementia Triad" (4, 5, 6) as the critical failure point.
      3.  Identify the "Reform Paradox" (2, 3) as a secondary, manageable tension.
      4.  Propose the "Temporal Shift" in (4) or the "Function Shift" in (5) as the fix.
      5.  Rank severity.

      *Let's refine the "Single Change".*
      If I change (4) to specify "conduct *at the time of the action*," then the dementia patient *was* responsible. Then (6) is allowed. But does (5) work? Can you address a demand to someone who can't hear it? Maybe it's a symbolic address.
      If I change (5) to allow "expression" not just "address," (6) works.
      If I change (6) to "You can feel resentment, but not blame," that distinguishes feeling from practice.
