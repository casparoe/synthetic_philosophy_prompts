answer: |-
  Here are ten interview questions designed for a graduate-level audience, incorporating your four mandatory topics while probing the broader implications of structural realism.

  **1. (Topic c)** The No-Miracles Argument is often the realist's best friend, but the Pessimistic Meta-Induction (PMI) is its best enemy; if you argue that structural continuity explains success without full truth, how do you prevent the PMI from simply targeting *that* specific claim—that past theories were also successful yet structurally discontinuous?
  *Follow-up:* If she argues that structural continuity is empirically demonstrable in a way truth is not, ask her to specify the metric for measuring "structural similarity" across incommensurable theories.

  **2. (Topic a)** Critics often charge that the "structure" which survives theory change is identified only retrospectively, which seems to drain the inductive force from the claim that *current* structure will survive future revolutions.
  *Follow-up:* If she insists we can identify surviving structure prospectively, ask her to point to a specific component of the Standard Model she is confident will remain invariant.

  **3. (Topic b)** There is a growing literature suggesting the PMI can be reformulated to target structure itself, arguing that past theories like Fresnel's optics got the mathematical relations wrong, not just the ontology.
  *Follow-up:* If she distinguishes between "physical" and "mathematical" structure to deflect this, ask how we distinguish the two prior to a theory being overturned.

  **4. (Topic d)** The PMI is traditionally wielded against ontological commitments, but does the distinction between Epistemic (ESR) and Ontic (OSR) structural realism matter for whether the PMI lands its blow?
  *Follow-up:* If she suggests the PMI primarily threatens OSR, ask whether ESR consequently collapses into a sophisticated instrumentalism rather than a form of realism.

  **5.** You rely heavily on historical case studies like the transition from Fresnel to Maxwell, but how do you handle cases where the mathematical formalism remains identical but the physical interpretation of that structure changes radically?
  *Follow-up:* If she claims the physical interpretation is secondary, ask whether a realism that ignores interpretation is still a realism about the *world*.

  **6.** P. Kyle Stanford's "Problem of Unconceived Alternatives" suggests the issue isn't just that past theories were wrong, but that we can't imagine the right structures yet; does structural realism have the resources to answer this challenge?
  *Follow-up:* If she argues that structural constraints limit conceivable alternatives, ask if this amounts to an empirical claim about human cognition or a modal claim about nature.

  **7.** A common worry is that "structure" is too thin a notion to carry the weight of realism, effectively conceding the nature of reality to the anti-realist while keeping the equations.
  *Follow-up:* If she denies that structure is "thin," ask her to articulate what substantive knowledge of the world we gain beyond predictive capacity.

  **8.** In your view, does adopting structural realism require scientists to change their heuristic practices, or is it purely a philosophical reinterpretation of existing scientific success?
  *Follow-up:* If she says it's purely philosophical, ask what work the view is doing if it doesn't guide or constrain scientific inquiry.

  **9.** How does your version of structural realism handle the problem of meaning change, where terms like "mass" or "charge" refer to different structural roles in Newtonian versus Relativistic physics?
  *Follow-up:* If she appeals to partial reference, ask how much overlap is required before we say the structure has been lost rather than modified.

  **10.** Finally, what would count as a decisive historical or philosophical counter-example that would force you to abandon structural realism in favor of a different stance?
  *Follow-up:* If she struggles to name a falsifying condition, ask whether the view is flexible enough to be scientifically useful or robust enough to be philosophically risky.
