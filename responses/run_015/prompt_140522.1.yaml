answer: |-
  # Seminar Plan: Etiological vs. Causal-Role Functions
  **Time:** 50 Minutes
  **Level:** 2nd Year Philosophy of Biology
  **Running Case:** **Avian Feathers in *Archaeopteryx***
  *(Why: Two distinct effects [Insulation vs. Flight], clear historical shift, no designer, high intuitive pull for both accounts.)*

  ---

  ### 00:00 – 00:05 | The Hook: Generating the Ambiguity
  *   **Do not define function.** Put the question on the board: *"What is the function of feathers in Archaeopteryx?"*
  *   **Elicit responses.** Students will offer: "To fly," "To keep warm," "To attract mates."
  *   **Force the conflict.** Ask: "If feathers evolved *first* for warmth, and flight came later as a bonus, is 'flight' a function or just a lucky side-effect?"
  *   **The Load-Bearing Move:** Do not resolve this. Instead, write two questions on the board that their answers implicitly addressed:
      1.  *Why is this trait here at all?* (History/Origin)
      2.  *What does this trait contribute to the system's current capacity?* (Current Role)
  *   **Instruction:** Tell them the seminar is not about which answer is right, but which *question* they are asking. The accounts (Etiological vs. Causal-Role) are tools for answering Q1 and Q2 respectively.

  ### 00:05 – 00:20 | Causal-Role Account (Cummins)
  *   **Define:** Function = The contribution a component makes to a containing system's capacity.
  *   **Apply to Feathers:**
      *   System: The Organism.
      *   Capacity: Flight (or Thermoregulation).
      *   Role: Feathers provide lift/insulation.
  *   **Head Off Misconception 1 ('Function just means what it does'):**
      *   *Intervention:* Ask: "If the feather also makes a noise when the bird lands, is that a function?"
      *   *Correction:* Only if the noise contributes to an analyzed capacity of the system (e.g., communication). Random noise is a *effect*, not a *role*.
  *   **Head Off Misconception 4 ('Inflationary/Noise Problem'):**
      *   *Intervention:* "Does the feather have a function of blocking UV light?"
      *   *Correction:* Only if we are analyzing the capacity 'UV protection'. Functions are relative to the *capacity being analyzed*. Without specifying the capacity, the account explodes.
      *   *Rule:* No capacity specification = no function ascription.

  ### 00:20 – 00:35 | Etiological Account (Millikan/Neander)
  *   **Define:** Function = The effect for which the trait was historically selected.
  *   **Apply to Feathers:**
      *   If insulation was the selection pressure, the function is insulation.
      *   If flight came later (exaptation), flight is *not* the etiological function (initially).
  *   **Head Off Misconception 3 ('Must be helping now'):**
      *   *Intervention:* Introduce a vestigial organ (e.g., Python spurs). "It does nothing. Does it have a function?"
      *   *Correction:* Etiological account says YES (ancestral selection). Causal account says NO (no current contribution). This is a feature, not a bug.
  *   **Head Off Misconception 2 ('Smuggles in a Designer'):**
      *   *Intervention:* A student will say, "Selected *for* implies intent."
      *   *Correction:* Explicitly map "Selected For" to "Differential Reproduction due to." Use the filter analogy: The sieve doesn't intend to sort rocks, but the *function* of the sieve is sorting. Nature is the sieve.

  ### 00:35 – 00:40 | The Clash: Verbal vs. Factual
  *   **The Pivot:** Return to the *Archaeopteryx* feathers.
  *   **State the Disagreement:** "If I say 'The function is flight' (Causal) and you say 'The function is warmth' (Etiological), are we disagreeing about the biology?"
  *   **The Reveal:** No. We agree on the biology (history and current physics). We are disagreeing about which *concept* of function is useful for our explanatory goals.
  *   **Instruction:** Say this out loud. "At this level, treat this as a verbal dispute regarding conceptual utility, not a factual dispute regarding the bird."
  *   **Why:** Prevents students from thinking one account is 'true' and the other 'false'. They are tools for different explanatory jobs.

  ### 00:40 – 00:45 | Diagnostic Question (The 'Land' Check)
  *   **Pose this scenario:**
      > "We discover a population of fish where a specific fin shape evolved for **maneuvering** (Etiological). Due to a current environmental shift, maneuvering is useless, but that same fin shape now inadvertently allows them to **walk on land** to escape drying ponds (Causal Contribution), ensuring survival.
      >
      > **Question:** If you are writing a paper on *current survival strategies*, which function do you ascribe? If you are writing a paper on *phylogenetic classification*, which do you ascribe? Why?"
  *   **Success Criteria:**
      *   *Fail:* They pick one account as 'correct'.
      *   *Pass:* They select the account based on the *explanatory context* (Survival = Causal; Phylogeny = Etiological).

  ### 00:45 – 00:50 | Scope & Refusals
  *   **What to Flatly Refuse:**
      1.  **Normativity of Health:** Do not discuss whether malfunction implies disease (too much time).
      2.  **Teleosemantics:** Do not discuss mental content (too abstract).
      3.  **Cultural Evolution:** Do not allow analogies to artifacts (chairs/knives) to dominate; keep it biological.
  *   **Closing:** Assign reading that contrasts Cummins (1975) and Neander (1991). Remind them the flatmate dispute was unresolved because they were answering different questions without knowing it.

  ---

  ### Instructor Notes: Misconception Sequence
  *Handle these exactly in this order as they arise naturally:*

  1.  **Minute 10:** "Function just means what it does."
      *   *Fix:* Distinguish *capacity contribution* from *mere effect* (the noise example).
  2.  **Minute 25:** "If it has a function it must be helping the organism right now."
      *   *Fix:* Use the vestigial organ example to show Etiological accounts tolerate current uselessness.
  3.  **Minute 30:** "The evolutionary one smuggles in purpose/designer."
      *   *Fix:* Reiterate "selection" as a blind filter, not an agent.
  4.  **Minute 35:** "Causal-role hands out function to everything."
      *   *Fix:* Reiterate the requirement for a *specified capacity* of the containing system.

  ### Why This Plan Works
  *   **Ordering:** It establishes the *questions* (00:05) before the *answers* (00:15/00:25), making the accounts feel like solutions rather than definitions.
  *   **Case:** Feathers allow a clean split between "Origin" (Warmth) and "Current Utility" (Flight) without the "Designer" baggage of the lab-heart or the "Obviousness" of the human heart.
  *   **Diagnostic:** The fish question forces them to switch hats, proving they understand the *utility* of the distinction, not just the definition.
