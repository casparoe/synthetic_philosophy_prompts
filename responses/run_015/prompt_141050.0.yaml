prompt: |-
  Hey — I've got a fifty-minute tutorial on Tuesday, first-years, intro metaphysics, and the topic is endurantism vs perdurantism. I've run it twice and both times it died the same death: everyone walks out able to say "perdurantism is the worm view" and nobody can say what would make anyone *reject* it. So don't explain the debate to me, I know it — plan the session. What has to be on the board before either view is even statable, and in what order (what depends on what)? They'll have had one lecture already and the handout defines perdurantism as "objects are four-dimensional," which I think has done damage before I even start — how much of the hour do I spend undoing that?

  I want one example carrying the whole thing. I've been using a pencil sharpened down to a nub: intrinsic change, most of the original matter gone, no persons involved. Say what it's missing and whether to swap it. I keep being tempted by a sourdough starter kept alive for decades and fed daily — none of the original flour left, still "the same starter" — but I suspect that's doing something different (lineage, or fission) and would just muddy things; tell me if I'm right and why, and whether it's usable later as a case the view has to handle rather than as the lead.

  Misconceptions, and where in the sequence to head each off. The one that actually worries me: they'll define "wholly present" as "all of its parts exist at that time," which both sides can happily accept, and the distinction quietly collapses — where do I stop that, and what do I put in its place? Then: they'll take temporal parts to be instanteous slices, like film frames. Half of them code, and I'd like to use a version-control analogy (a file whose history is a chain of commits), but I'm worried it builds in exactly that mistake — use it, place it somewhere specific, or drop it? Also "perdurantism means nothing really changes" and "that's just the block universe" — I want them to see those as extra commitments, not the view. And at some point a student will say "so there are hundreds of pencils in this room" and I never know whether to treat that as an objection or as the view itself.

  What do I openly refuse to get into and say so out loud (I'm guessing the argument from special relativity and stage theory, but you tell me)? And give me one question for the last five minutes they can't pass by repeating "wholly present" at me — ideally one where the two views have to disagree about a sentence rather than about a picture.
reasoning: |-
  Here's a thinking process that leads to the suggested tutorial plan:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy tutor/instructor. Experienced enough to know the standard pitfalls ("died the same death," "handout defines perdurantism as 'objects are four-dimensional'").
      *   **Topic:** Endurantism vs. Perdurantism (Intro Metaphysics, First-years).
      *   **Time:** 50 minutes.
      *   **Goal:** A concrete session plan. Not an explanation of the debate (they know it), but *how to teach it* so students understand *why* one might reject perdurantism, not just definitions.
      *   **Specific Constraints/Questions:**
          *   What must be on the board *before* views are statable (order of operations)?
          *   How much time undoing the "4D object" handout damage?
          *   Evaluate the "pencil" vs. "sourdough starter" example.
          *   Address the "wholly present" misconception (parts exist at t).
          *   Address the "temporal parts = instantaneous slices" misconception.
          *   Evaluate the "version control/commit" analogy.
          *   Address "nothing really changes" and "block universe" confusions.
          *   Handle the "hundreds of pencils" objection.
          *   What to explicitly exclude (SR, Stage Theory)?
          *   Final question: Must force disagreement on a *sentence*, not a picture.

  2.  **Deconstruct the Problems:**
      *   **The "4D Object" Handout:** This is the root cause. If objects *are* 4D worms, endurantism looks like denial of reality. Need to reframe: It's about *how* objects occupy spacetime, not *that* they occupy spacetime.
      *   **The "Wholly Present" Trap:** If defined as "all parts exist at t," perdurantists agree (all *temporal* parts exist at the spacetime region, but not at the time slice). Need a definition that forces a choice.
      *   **The Example:** Pencil is okay for intrinsic change, but Sourdough is risky (fission/lineage). Stick to the pencil but refine the setup to focus on *location* and *parthood*.
      *   **The Version Control Analogy:** Good for temporal parts, bad if it implies the "current file" isn't real. Needs careful deployment.
      *   **The "Hundreds of Pencils":** This is the "problem of many" or confusion about temporal parts vs. coincident objects. Needs to be flagged as a category mistake.
      *   **The Final Question:** Needs to be a truth-value disagreement, not a diagram disagreement.

  3.  **Drafting the Plan - Step-by-Step:**

      *   **Board Work (The Foundation):** Before defining E vs. P, we need the ontology of time and parthood.
          *   Need: Spacetime diagram (axes), Definition of "Part" (atemporal vs. temporal), Definition of "Location."
          *   Order: Spacetime -> Parthood -> Location -> Views.
      *   **Time Allocation:** 50 mins is tight. 5 mins intro/board setup, 10 mins fixing the handout/definitions, 20 mins the core argument/example, 10 mins objections/confusions, 5 mins final question.
      *   **Undoing the Handout:** Don't spend 20 mins apologizing. Spend 5 mins redefining. "4D" means extended in time, not that it's a worm *instead* of a 3D thing. It's about *occupation*.
      *   **The Example:** Stick with the Pencil. Sourdough introduces biological continuity/functional criteria that distract from the metaphysical parthood issue. Use Sourdough later only if discussing fission (which we aren't).
      *   **"Wholly Present":** The fix is "Wholly present at $t$ means *no* part of it exists outside $t$." Endurantists say yes. Perdurantists say no (because temporal parts exist at other times).
      *   **Version Control:** Use it for *temporal parts*, but clarify that the "repository" is the object. Don't use it for the *current* state. Place it after the pencil example to visualize the "worm."
      *   **"Nothing Changes":** Distinguish *qualitative* change (properties) vs. *numerical* change (identity). Perdurantists accept qualitative change across temporal parts.
      *   **"Hundreds of Pencils":** Clarify: One pencil, many temporal parts. Not many pencils.
      *   **Exclusions:** Special Relativity (too technical/physics-heavy), Stage Theory (too nuanced for intro, confuses the core E vs. P distinction).
      *   **Final Question:** Needs to be about predication. "The pencil is sharp." When is this true?

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on "Wholly Present":* The standard trap is "all parts exist at t." Perdurantists say "All *spatial* parts exist at t, but not all *temporal* parts." Endurantists say "It has no temporal parts." So the definition needs to hinge on whether it *has* temporal parts.
      *   *Better Definition:* "Is the object *located* at a time, or does it *extend through* time?"
      *   *Version Control:* Actually, Git is risky. A commit is a snapshot. A branch is a history. If the object is the repo, fine. If the object is the file, it's ambiguous. Let's suggest a "Film Strip" vs. "Projector Light" analogy instead, or refine the Git analogy to be about the *commit hash* being a part. Actually, the prompt asks specifically about Git. I should advise *how* to use it safely. Use it to explain *temporal parts*, not the object itself.
      *   *Final Question:* "The pencil at $t_1$ is identical to the pencil at $t_2$." Endurantist: True. Perdurantist: False (category mistake, or only the worm is identical to itself). Better: "The pencil *simpliciter* is sharp." Endurantist: True/False (depends on time). Perdurantist: Neither (incomplete). Or: "Does the pencil exist *at* $t$?"

  5.  **Finalizing the Structure:**
      *   **Board 1:** Spacetime & Parthood (Pre-reqs).
      *   **Board 2:** The Pencil Case (The Data).
      *   **Board 3:** The Definitions (The Fork).
      *   **Sequence:** Fix Handout -> Define Parthood -> Apply to Pencil -> Git Analogy -> Objections -> Final Question.
      *   **Sourdough:** Save for fission (exclude from this session).
      *   **Exclusions:** SR, Stage Theory, Time Travel.

  6.  **Writing the Response:** (Incorporating the tone: direct, pedagogical, authoritative but collaborative.)
      *   *Tone Check:* The user is frustrated ("died the same death"). Be empathetic but decisive.
      *   *Key Insight:* The problem isn't the definitions; it's the *motivation*. Why reject P? Because it makes objects *too* like events.
      *   *The "Wholly Present" Fix:* This is the crux. Must be explicit.

  7.  **Final Polish:** Check against all constraints in the prompt.
      *   Board order? Yes.
      *   Handout damage control? Yes.
      *   Pencil vs. Sourdough? Yes.
      *   Wholly Present trap? Yes.
      *   Git analogy? Yes.
      *   "Nothing changes"/"Block Universe"? Yes.
      *   "Hundreds of pencils"? Yes.
      *   Exclusions? Yes.
      *   Final Question? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  Here is a battle plan for the 50 minutes. The core diagnosis of your previous failures is that you are teaching the *taxonomy* (Endurance vs. Perdurance) before establishing the *ontological cost* (what you have to buy to hold each view). Students treat perdurantism as a description of physics rather than a metaphysical commitment about parthood.

  ### 1. The Board: Order of Operations
  Do not write "Endurantism" or "Perdurantism" on the board for the first 15 minutes. If you write the labels, they will stop listening and start memorizing definitions.

  **Phase 1: The Ontological Prerequisites (Minutes 0–15)**
  Draw this left-to-center.
  1.  **Spacetime Diagram:** Draw $x$ (space) and $t$ (time). Draw a region $R$.
  2.  **Parthood (Atemporal):** Write: *$x$ is a part of $y$ (simpliciter).*
      *   *Constraint:* This relation does not take a time argument. A handle is part of a mug. A 1999-stage is part of a person.
  3.  **Location:** Write: *$O$ is located at region $R$.*
      *   *Distinction:* An object can be located at a spatial region at a time, or a spacetime region simpliciter.

  **Phase 2: The Data (Minutes 15–25)**
  Draw this center-right.
  1.  **The Pencil:** Draw the pencil at $t_1$ (long) and $t_2$ (nub).
  2.  **The Fact:** "The pencil at $t_1$ is numerically identical to the pencil at $t_2$." (Both sides agree).
  3.  **The Change:** "The pencil is 15cm at $t_1$" and "The pencil is 2cm at $t_2$." (Both sides agree).

  **Phase 3: The Fork (Minutes 25–40)**
  Now you introduce the views as *answers* to how the Data fits the Prerequisites.
  1.  **Endurantist Answer:** The pencil is located at $t_1$ and located at $t_2$. It has no parts outside $t_1$ or $t_2$.
  2.  **Perdurantist Answer:** The pencil is located at the *union* of $t_1$ and $t_2$. It has a part at $t_1$ and a part at $t_2$.

  ---

  ### 2. Undoing the Handout Damage (5 Minutes)
  Your handout says "objects are four-dimensional." This implies Endurantism says "objects are three-dimensional," which sounds like Endurantism denies time exists.

  **The Fix:**
  Tell them explicitly: "Ignore the phrase 'four-dimensional object' for today. It is shorthand for 'an object that has temporal extension.' Both sides agree objects exist in time. The disagreement is not about dimensions; it is about **parthood**."

  **Script:** "If I say 'The pencil is 4D,' I do not mean it is a worm. I mean its *history* is part of its *being*. If I say 'The pencil is 3D,' I mean the pencil *has* a history, but the history is not *part* of the pencil. Spend 5 minutes on this reframe, then move on. Do not apologize for the handout; supersede it."

  ---

  ### 3. The Example: Pencil vs. Sourdough
  **Stick with the Pencil.** You are right to suspect the Sourdough.
  *   **Why:** Sourdough introduces *functional continuity* and *biological lineage*. Students will argue the starter is the same because it performs the same function or has the same yeast DNA. That muddies the water. We want a case where the *matter* changes but we still want to say it's the same object, without relying on biological criteria.
  *   **The Pencil's Missing Element:** The pencil example often fails because students think the "nub" is just a damaged version of the original. You need to emphasize **Intrinsic Properties**.
  *   **Modification:** Don't just sharpen it. Paint the pencil red at $t_1$ and blue at $t_2$ (without mixing paint). Now it's not just size; it's color.
  *   **Sourdough Usage:** Keep it in your pocket. If a student asks about fission ("What if I split the starter?"), use it then. Do not use it as the lead example.

  ---

  ### 4. The "Wholly Present" Trap
  This is the single biggest point of collapse.
  *   **The Trap:** Students define "wholly present at $t$" as "All of its parts exist at $t$."
  *   **The Perdurantist Counter:** "Agreed. All of its *spatial* parts exist at $t$. Its temporal parts exist at other times."
  *   **The Fix:** Change the definition on the board.
      *   **New Definition:** "An object is wholly present at $t$ iff **it has no parts outside of $t$**."
      *   **Why this works:** The Perdurantist *must* say the pencil has parts outside of $t$ (the $t_2$ part exists outside $t_1$). The Endurantist says it has *no* parts outside $t$. This forces a disagreement on parthood, not just location.

  **Where to stop this:** Minute 20. Write the new definition in red. If they use the old one, correct them immediately: "That definition is compatible with worms. Use the one on the board."

  ---

  ### 5. The Version Control (Git) Analogy
  **Use it, but with a specific warning.**
  *   **The Risk:** Git implies the "current file" is the real one and the "commits" are just records. Perdurantism says the "commits" (temporal parts) are just as real as the current state.
  *   **The Deployment:** Use it to explain **Temporal Parts**, not the Object.
      *   *Say:* "Think of a commit hash. It is a snapshot of the code at a specific time. Perdurantism says the object is the *entire branch history*. The 'current file' you are working in is just the *temporal part* at this moment."
      *   *Warning:* "Do not think the current file is an illusion. It is real, but it is a *part*, not the *whole*. The 'repository' is the object."
  *   **Placement:** Minute 30. Use it to visualize why the Perdurantist says "The pencil at $t_1$ is a *part* of the Pencil," whereas the Endurantist says "The pencil at $t_1$ *is* the Pencil."

  ---

  ### 6. Handling the Confusions
  **"Perdurantism means nothing really changes."**
  *   **Response:** "Perdurantism denies *numerical* change (the object itself changing), but accepts *qualitative* variation across parts. The pencil varies in color from part to part. That is change enough for physics. The metaphysical cost is that *you* don't change; your Tuesday-part is tired, your Monday-part was fresh."
  *   **Board Note:** Write "Qualitative Variation vs. Numerical Change."

  **"That's just the Block Universe."**
  *   **Response:** "Block Universe is a theory of *time* (B-Theory). Perdurantism is a theory of *objects*. You can be an Endurantist in a Block Universe (objects 'light up' at different times). You can be a Perdurantist in a Presentist universe (objects are sums of past, present, and future parts, even if only present parts are 'real'—though this is rare). Don't conflate Time with Objects."
  *   **Action:** Explicitly refuse to debate B-Theory vs. A-Theory.

  **"So there are hundreds of pencils in this room."**
  *   **Response:** "No. There is one pencil. It has hundreds of temporal parts. Just as there is one road, but it has many miles. You wouldn't say 'There are hundreds of roads in this state' because the highway has many miles. Don't confuse parts for wholes."
  *   **Action:** Treat this as a category mistake, not an objection.

  ---

  ### 7. What to Refuse (Explicitly)
  Tell them this at Minute 5. Write "Out of Bounds" on the far right of the board.
  1.  **Special Relativity:** "We are doing metaphysics, not physics. Simultaneity slices are not on the exam."
  2.  **Stage Theory:** "We are discussing Worm Theory (Perdurantism). Stage Theory is a cousin, but distinct. If you bring it up, I will park it for office hours."
  3.  **Time Travel:** "It breaks the pencil example. No time travel."

  ---

  ### 8. The Final Question (Last 5 Minutes)
  You need a question where "wholly present" is not an answer, and they cannot draw a diagram to solve it. It must be a truth-value judgment.

  **The Question:**
  > "Consider the sentence: **'The pencil is sharp.'**
  > If Perdurantism is true, is this sentence **true**, **false**, or **incomplete**?"

  **Why this works:**
  *   **Endurantist:** Must say "True at $t_2$, False at $t_1$." The sentence needs a time index to be evaluated, but the *subject* (the pencil) is the same.
  *   **Perdurantist:** Must say "Incomplete." Why? Because 'The pencil' refers to the whole worm. The whole worm is *not* sharp (part of it is blunt). To be true, the sentence must be: 'The $t_2$-part of the pencil is sharp.'
  *   **The Trap:** If they say "True," ask "Is the $t_1$ part sharp?" If they say "False," ask "Is the $t_2$ part sharp?"
  *   **The Goal:** Force them to see that Perdurantism changes the **logic of predication**. Endurantism says objects have properties *at times*. Perdurantism says temporal parts have properties *simpliciter*.

  ### Summary Checklist for the Tutor
  1.  **Board First:** Spacetime & Parthood before Labels.
  2.  **Handout:** Override "4D object" with "Temporal Parthood."
  3.  **Definition:** "Wholly present" = "No parts outside $t$."
  4.  **Analogy:** Git = Temporal Parts, not the Object.
  5.  **Objections:** "Hundreds of pencils" = Category mistake. "No change" = Qualitative variation.
  6.  **Exclusions:** SR, Stage Theory, Time Travel.
  7.  **Closer:** Predication ("The pencil is sharp").

  If you stick to the parthood definition and the predication question, they cannot walk out thinking this is just about "worms vs. sticks." They will see it is about how language hooks onto reality.
