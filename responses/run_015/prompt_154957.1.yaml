prompt: |-
  I'm a mediator for a small co-housing collective, and every week we get these squabbles about shared space - someone builds a shed that blocks light, plays drums near a sleeping baby, paints a shared wall a color that feels "hostile" to a neigbor, stuff like that. The board is tired of me falling back on generic rules like "be respectful" and wants me to actually use moral particularism - you know, the idea that moral reasons are totally context-dependent and you can't just apply one universal principle everywhere. I need a practical decision proceedure I can run in about 20 minutes with both people sitting right there, no lawyers, and then sign off on for the board. It should list the steps in order, what counts as a good enough answer at each one, where I stop and say no, and where I have to hand it over to a value call because it's not a fact question anymore. The key thing is it has to deal with cases where the exact same feature - like noise or smell - counts as a reason in one layout but not in another. Run it on three examples: (1) the drummer near the baby's window, (2) the wall color that "feels hostile", and (3) allowing a smelly compost bin that actually helps the garden - and make case 3 be one where the proceedure gives an answer I'd hate. Also tell me clearly what this can't do, like predict emotional blowback or cover disputes that involve money. Make it something I can literally read off a card during mediation.
reasoning: |-
  Here's a thinking process that leads to the suggested mediation procedure:

  1.  **Analyze the Request:**
      *   **Role:** Mediator for a small co-housing collective.
      *   **Problem:** Recurring squabbles about shared space (noise, aesthetics, utility).
      *   **Constraint 1 (Theoretical):** Must use *Moral Particularism*. This means avoiding universal rules (e.g., "No noise after 10 PM") and focusing on context-dependent reasons. What counts as a reason in one case might not in another.
      *   **Constraint 2 (Practical):** 20-minute procedure, no lawyers, readable off a card, sign-off ready for the board.
      *   **Constraint 3 (Structure):** Ordered steps, criteria for "good enough" answers, stop points (veto), hand-off points (value calls vs. fact questions).
      *   **Constraint 4 (Testing):** Run on three specific examples:
          1.  Drummer vs. Baby (Noise).
          2.  Hostile Wall Color (Aesthetics/Psychology).
          3.  Smelly Compost (Utility vs. Nuisance) -> *Must yield an answer the mediator hates.*
      *   **Constraint 5 (Limitations):** Explicitly state what this *cannot* do (emotional blowback, money disputes).

  2.  **Deconstruct Moral Particularism for Mediation:**
      *   *Core Idea:* There are no invariant moral principles. A feature (e.g., "loudness") can be a reason *for* an action in one context (emergency siren) and *against* it in another (bedtime).
      *   *Application:* Instead of asking "Is this against the rules?", ask "Does this feature function as a decisive reason *in this specific configuration of relationships and space*?"
      *   *Challenge:* How to make this procedural without turning it back into a rule? The procedure must force the parties to articulate the *context* that makes the feature matter, rather than appealing to a general norm.

  3.  **Drafting the Procedure (The "Particularist Protocol"):**
      *   *Time:* 20 mins means 4-5 steps, roughly 4 mins each.
      *   *Step 1: Feature Identification.* What exactly is the physical/sensory fact? (Not the judgment, the fact).
      *   *Step 2: Contextual Valence.* Does this feature count *for* or *against* the action *here*? (Crucial particularist step).
      *   *Step 3: Defeasibility Check.* Is there a competing feature that overrides this one?
      *   *Step 4: The "Enough" Threshold.* When do we stop arguing? (When the context is fully mapped).
      *   *Step 5: Decision/Handoff.* Fact-based resolution vs. Value Call.

      *Refining the Steps for a Card:*
      1.  **Isolate the Feature:** Strip away adjectives.
      2.  **Map the Context:** Why does this feature matter *here* specifically?
      3.  **Check for Holism:** Does this feature change weight because of other features?
      4.  **The Stop Rule:** When is the context exhausted?
      5.  **Verdict:** Allow, Disallow, or Value Call.

  4.  **Developing the Test Cases:**

      *   *Case 1: Drummer vs. Baby.*
          *   Feature: Sound waves at X decibels.
          *   Context: Baby sleeping, thin walls, daytime vs. nighttime.
          *   Particularist angle: Noise isn't always bad. But here, the *function* of the room (sleep) makes noise a negative reason.
          *   Outcome: Disallow (or restrict).

      *   *Case 2: Hostile Wall Color.*
          *   Feature: Pigment reflection (Red).
          *   Context: Shared hallway, neighbor's anxiety, "aggressive" association.
          *   Particularist angle: Color isn't inherently hostile. But in *this* community with *this* history, it functions as aggression.
          *   Outcome: Disallow/Change.

      *   *Case 3: Smelly Compost (The "Hate" Outcome).*
          *   Feature: Odor + Nutrient benefit.
          *   Context: Community garden (good) vs. Patio seating (bad).
          *   *Requirement:* The procedure must give an answer I (the mediator) hate.
          *   *Idea:* If the procedure prioritizes "collective utility" mapped through specific context, it might allow the smell because the *gardening benefit* is a concrete particular reason that outweighs the *abstract discomfort* of the smell, even if the smell is objectively strong. Or, conversely, it bans the compost because the *specific* wind direction hits one person's window, ignoring the collective garden benefit.
          *   *Better "Hate" Outcome:* The procedure forces a "Value Call" handoff because the features are incommensurable, leaving the mediator powerless, OR it allows the compost despite the smell because the "Garden Health" feature is deemed more contextually robust than "Nose Comfort." Let's go with: The procedure *allows* the compost because the "Garden Yield" is a tangible, shared particular reason, while the "Smell" is deemed a subjective, variable reason that changes with wind (holism). I hate this because the smell is unbearable.
          *   *Wait, let's look closer at Particularism:* Particularism says reasons can flip. Maybe the smell is a reason *for* the compost (indicates activity) in the garden, but *against* it on the patio. If the bin is *in* the garden, the smell might be overridden by the growth.
          *   *The "Hate" Twist:* The procedure determines that because the smell is *intermittent* (wind-dependent), it lacks the "invariant negative weight" required to veto the *constant* benefit of the compost. I hate this because when the wind blows, it's hell.

  5.  **Refining the "Card" Format:**
      *   Needs to be punchy.
      *   Needs clear "Stop" conditions.
      *   Needs to distinguish Fact vs. Value.

  6.  **Addressing Limitations:**
      *   Can't predict emotions.
      *   Can't handle financial compensation.
      *   Can't solve deep ideological rifts (just specific features).

  7.  **Review against Constraints:**
      *   20 mins? Yes, 5 steps.
      *   Moral Particularism? Yes, focuses on context-dependent valence of features.
      *   Three cases run? Yes.
      *   Case 3 hated outcome? Yes.
      *   Limitations listed? Yes.

  8.  **Final Polish:**
      *   Ensure the tone is professional but practical.
      *   Make sure the "Particularist" jargon is translated into actionable mediation language (e.g., instead of "holism," use "Feature Interaction").
      *   *Self-Correction on Case 3:* To make it truly particularist, the reasoning must be that the *same feature* (smell) functions differently. In the garden context, smell = decomposition = good. On the patio, smell = rot = bad. If the bin is on the edge, the procedure might rule that the "Garden Context" swallows the "Patio Context" because the bin is technically *in* the garden zone. I will hate this because the wind carries it to the patio.

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally slip into Utilitarianism (greatest good). Particularism isn't about weighing goods; it's about whether a feature *counts as a reason at all* in this context.
      *Revised Case 3 Logic:* The procedure asks: "Does the smell function as a veto here?" If the compost is essential for the *specific* plants grown (e.g., tomatoes for the community feast), the smell loses its negative valence *in this specific context* of "Feast Preparation." I hate this because I hate the smell regardless of the tomatoes.

      *Actually, let's make it simpler for the card:* The procedure identifies that the "Smell" feature is *defeasible* (can be overridden) by the "Nutrient" feature in the Garden Context, but the procedure lacks a mechanism to weigh intensity. So it defaults to allowing the action because a positive reason exists. I hate it because the positive reason is abstract (future tomatoes) and the negative is immediate (rotten eggs).

      *Wait, the prompt asks for a procedure where I stop and say no, or hand off.*
      Okay, let's finalize the steps.
      1. Identify Feature.
      2. Determine Valence in *This* Context.
      3. Check for Defeaters (Holism).
      4. Decision Point (Fact vs Value).

      Let's write it.

  9.  **Final Review of the Output:**
      *   Does it look like a card? (Use formatting).
      *   Is the theory accurate? (Particularism = context-dependent reasons, not rule-following).
      *   Is Case 3 distinct? (Yes, the "hated" outcome).
      *   Are limitations clear? (Yes).

      *(One last check on Particularism)*: Make sure I emphasize that we aren't applying a rule like "Noise is bad." We are asking "Does noise function as a negative reason *here*?" In the drum case, yes. In a concert case, no. This distinction is key.

      *(Case 3 Refinement)*: To ensure it's a "hated" outcome, the procedure should validate the compost *despite* the smell because the smell is deemed "contextually variable" (only smells sometimes) whereas the garden benefit is "contextually constant." I hate this because "sometimes" smells like death is still unacceptable to me personally.

      Let's assemble.

      *(Wait, one more thing)*: The prompt asks for "where I stop and say no, and where I have to hand it over to a value call." I need to make sure the procedure has a clear threshold for this.
      *Threshold:* If the feature's valence is agreed upon -> Decision. If the feature's valence is disputed (one says it's a reason, one says it's not) -> Value Call to Board.

      Okay, ready to write.

      *(Final thought on Case 3)*: I need to make sure the procedure *itself* generates the outcome I hate, not just my personal preference. The procedure must logically lead there based on particularist logic.
      *Logic:* Particularism allows a feature to be a reason in one context and not another.
      *Scenario:* Compost bin.
      *Feature:* Odor.
      *Context A (Garden):* Odor indicates fertility (Positive/Neutral reason).
      *Context B (Patio):* Odor indicates nuisance (Negative reason).
      *Procedure:* If the bin is located in the Garden Zone, the Garden Context applies. Therefore, Odor is not a negative reason *in this location*.
      *My Hate:* I know the wind blows to the patio. But the procedure says "Location defines Context." So it allows it. I hate it because the physical reality (wind) crosses the arbitrary boundary (zone).

      Okay, that works. It highlights the rigidity of "context boundaries" in a particularist framework.

