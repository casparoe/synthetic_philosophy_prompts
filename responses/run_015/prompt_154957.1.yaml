answer: |-
  # The Particularist Mediation Card (20-Minute Protocol)

  **Purpose:** Resolve shared-space disputes without universal rules. Focus on whether a specific feature functions as a reason *in this specific context*.
  **Time:** 20 Minutes Hard Stop.
  **Participants:** Mediator + 2 Disputants.

  ---

  ### STEP 1: Isolate the Feature (3 Mins)
  **Action:** Strip all adjectives and judgments. Identify the raw physical/sensory fact.
  *   *Bad:* "The annoying drumming."
  *   *Good:* "Sound waves at 70dB between 2 PM and 4 PM."
  *   *Bad:* "The aggressive red paint."
  *   *Good:* "High-saturation red pigment on the North Hall wall."
  **✅ Good Enough:** Both parties agree on the physical description.
  **🛑 STOP:** If they cannot agree on the physical fact, hand off to Board (Fact Dispute).

  ### STEP 2: Determine Contextual Valence (5 Mins)
  **Action:** Ask: "In *this* specific layout and relationship, does this feature count **for** or **against** the action?"
  *   *Note:* Do not ask if it is "right." Ask if it functions as a reason here.
  *   *Test:* Would this feature be a reason in a different context? (e.g., Is noise a reason against a siren? No. Against a drum? Yes.)
  **✅ Good Enough:** Each party articulates why the feature matters *here* (e.g., "Noise matters here because the wall is thin and the baby sleeps").
  **🛑 STOP:** If one party claims the feature is *never* a reason (universal claim), correct them. If they persist, hand off to Board (Philosophical Impasse).

  ### STEP 3: The Holism Check (5 Mins)
  **Action:** Ask: "Does the presence of *other* features change the weight of this feature?"
  *   *Example:* "Does the fact that it is harvest season change whether the smell is a negative reason?"
  *   *Example:* "Does the fact that the wall faces a playground change if the color is hostile?"
  **✅ Good Enough:** Parties identify at least one interacting feature (time, location, weather, event).
  **🛑 STOP:** If the interaction creates a direct conflict of values (e.g., "Garden Health" vs. "Nose Comfort") that cannot be mapped physically, mark as **Value Call**.

  ### STEP 4: The Decision Threshold (5 Mins)
  **Action:** Apply the **Local Function Rule**:
  1.  **Allow:** If the negative feature loses its negative valence due to context (Step 3).
  2.  **Disallow:** If the negative feature retains its valence and no overriding positive feature exists *in this zone*.
  3.  **Value Call:** If both features retain strong valence and conflict. Mediator signs "Unresolvable via Particularism."
  **✅ Good Enough:** A clear Allow/Disallow/Handoff decision.
  **🛑 STOP:** 20 Minutes. If no agreement, auto-handoff to Board.

  ### STEP 5: Sign-Off (2 Mins)
  **Action:** Write the decision based *only* on the features mapped in Steps 1-3. No new reasons allowed.
  **✅ Good Enough:** Both sign. Mediator submits to Board.

  ---

  ## LIMITATIONS (Read Before Starting)
  1.  **No Emotional Prediction:** This maps reasons, not feelings. It cannot prevent someone from feeling betrayed.
  2.  **No Financial Remedies:** Cannot assign costs or compensation.
  3.  **No Universal Precedent:** This decision applies *only* to this specific configuration. It does not set a rule for next time.
  4.  **No Deep Ideology:** Cannot solve disputes where the definition of "community" is fundamentally different.

  ---

  ## TEST RUNS

  ### Case 1: The Drummer vs. The Baby
  *   **Step 1 (Feature):** "Sound vibrations, 65-75dB, 2 PM-4 PM, shared wall." (Agreed).
  *   **Step 2 (Valence):**
      *   *Drummer:* Sound is a reason *for* practice (skill maintenance).
      *   *Parent:* Sound is a reason *against* (infant sleep cycles).
      *   *Context:* Wall is 4 inches thick; baby is 6 months old.
  *   **Step 3 (Holism):** Does time matter? Yes. 2 PM is nap time. Does location matter? Yes, bedroom adjacency.
  *   **Step 4 (Decision):** In *this* context (nap time + thin wall), the sound feature functions decisively as a negative reason. The practice benefit does not override the physiological need in this specific spatial arrangement.
  *   **Outcome:** **Disallow** drumming in that room during nap hours.
  *   **Mediator View:** Works. Clear contextual veto.

  ### Case 2: The "Hostile" Wall Color
  *   **Step 1 (Feature):** "Red pigment, saturation level 80%, North Hall." (Agreed).
  *   **Step 2 (Valence):**
      *   *Painter:* Color is a reason *for* expression (vibrancy).
      *   *Neighbor:* Color is a reason *against* (psychological aggression).
      *   *Context:* Hallway is narrow, no windows, neighbor has anxiety disorder.
  *   **Step 3 (Holism):** Does the narrowness matter? Yes, amplifies intensity. Does the anxiety matter? Yes, makes "vibrancy" function as "threat" *here*, whereas it might function as "welcome" in a wide atrium.
  *   **Step 4 (Decision):** In *this* context (narrow + anxiety), the color feature takes on a negative valence (hostility) that it might not have elsewhere. The expression reason is defeasible by the psychological safety reason in this specific geometry.
  *   **Outcome:** **Disallow** (Must repaint neutral).
  *   **Mediator View:** Works. Validates subjective experience as a contextual fact.

  ### Case 3: The Smelly Compost (The "Hated" Outcome)
  *   **Step 1 (Feature):** "Organic decomposition odor, sulfur compounds, Garden Zone B." (Agreed).
  *   **Step 2 (Valence):**
      *   *Gardener:* Smell is a reason *for* (indicates active nutrient cycling).
      *   *Neighbor:* Smell is a reason *against* (nausea, ruined patio meals).
      *   *Context:* Bin is 5 feet from patio, but technically inside "Garden Zone."
  *   **Step 3 (Holism):**
      *   *Mediator Check:* Does the wind matter? Yes, intermittent.
      *   *Procedure Logic:* The procedure asks if the feature functions as a negative reason *in the zone where the action occurs*. The action (composting) is in the Garden Zone. In the Garden Zone, odor functions as a *positive* reason (fertility indicator). The patio discomfort is an *external* effect, not internal to the action's context.
  *   **Step 4 (Decision):** The odor feature retains positive valence within the Garden Zone. The patio discomfort is deemed a secondary effect, not a contextual veto on the gardening action itself.
  *   **Outcome:** **Allow** the compost bin to stay.
  *   **Mediator View:** **I HATE THIS.**
      *   *Why:* I know the wind blows 4 days a week directly onto the patio. The procedure treats "Garden Zone" as a hard contextual boundary, ignoring the fluid reality of air flow. It prioritizes the *gardener's* contextual reason (fertility) over the *neighbor's* contextual reason (nausea) simply because the bin is technically on garden soil. It feels like a loophole that sacrifices livability for technical zoning.

  ---

  ## BOARD HANDOFF NOTE
  *If Step 4 results in a **Value Call**:*
  "Mediator Note: Features identified and context mapped. However, Feature A (e.g., Community Utility) and Feature B (e.g., Individual Comfort) both retain decisive weight in this context. This is not a fact dispute; it is a hierarchy of values. Board must vote on which value prioritizes in this specific instance."
