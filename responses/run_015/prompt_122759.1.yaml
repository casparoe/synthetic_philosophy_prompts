  4.  **Drafting the Model Answer:**
      *   *Thesis:* The Predictor dissolves the *epistemic* barrier but exposes the *authority* problem, especially in Variant 2.
      *   *Step 1: Paul's Standard Argument.* Briefly mention Epistemic + Preference transformation.
