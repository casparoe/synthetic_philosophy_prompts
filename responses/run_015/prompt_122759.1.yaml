      *   *Variant 1:* Future self prefers outcome + Endorses becoming the person who prefers it.
      *   *Variant 2:* Future self prefers outcome + *Does not* endorse becoming the person who prefers it (alienation/discontinuity).
      *   *Philosophical Pivot:* Paul's argument usually hinges on the epistemic gap (can't know what it's like) and the preference change (can't use current preferences). Does the Predictor bridge the epistemic gap? If the agent knows *that* she will prefer it, does the epistemic gap matter? Variant 2 introduces a diachronic authority problem (who counts? Current or Future self?).

  3.  **Drafting the Exam Question:**
      *   Need to present the case clearly but concisely.
