answer: |-
  ### 1. Exam Question

  **Course:** PHIL 450: Rationality and the Self
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1,000 words

  **Question 4: The Predictor and the Transformative Experience**

  Consider the following case:

  An agent must choose whether to undergo a personally transformative change (e.g., becoming a vampire, having a first child). On the standard account (L. A. Paul), this experience is *epistemically* transformative (she cannot know what it is like beforehand) and *personally* transformative (it will alter the core preferences she needs to evaluate the choice).

  Before choosing, she consults a **Predictor**: a perfectly reliable device. The Predictor does not give her phenomenal acquaintance with the experience. However, it tells her everything else about the outcome: exactly what her preferences will be afterwards, what she will judge her own well-being to be, and what her post-transformation self will say about the choice she made.

  There are two variants:
  *   **Variant 1:** The Predictor reports she will prefer the outcome and will *endorse* having become the person who prefers it.
  *   **Variant 2:** The Predictor reports she will prefer the outcome but will *not endorse* having become the person who prefers it. She will regard the change as made by someone whose aims she no longer shares.

  **Task:**
  Does the availability of the Predictor dissolve the rational problem Paul identifies? Your answer must address both variants. Use the contrast between them to argue where the fundamental problem of transformative choice actually lies: is it a deficit of evidence, a failure of phenomenal imagination, the indeterminacy of comparisons across successive selves, or something about the authority of a future self's preferences?

  ***

  ### 2. Model Answer

  L. A. Paul argues that transformative experiences (TEs) block rational choice because the agent lacks the epistemic access to evaluate the outcome and lacks the stable preferences required to assign utility. The Predictor case tests whether these barriers are truly epistemic or if they point to a deeper structural issue in diachronic rationality.

  The Predictor ostensibly dissolves the **epistemic barrier**. Paul claims we cannot assign expected utility because we cannot know "what it is like." However, the Predictor provides objective data regarding future well-being and preference satisfaction without requiring phenomenal acquaintance. If rational choice requires only knowing the *value* of an outcome rather than its *phenomenal quality*, the Predictor allows the agent to calculate expected utility. In a standard decision-theoretic framework, the agent should simply choose the option with the highest predicted utility.

  In **Variant 1**, this seems to work. The agent knows she will have new preferences, know she will satisfy them, and know she will endorse the transition. Here, the Predictor allows the current self to defer to the future self's authority. The current self can rationally choose the transformation as a gift to a future self whose values are trusted. If the problem were merely about phenomenal ignorance or information deficit, Variant 1 would be unproblematic. The Predictor supplies the missing information, and the alignment of endorsement ensures diachronic continuity.

  However, **Variant 2** reveals that the epistemic fix is insufficient. Here, the Predictor confirms the outcome is preferable *by future standards*, but the future self disavows the *choice* that led there. The future self prefers being a vampire but regrets the human who chose it, viewing that choice as made by an alien agent. This creates a paradox for the current self. If she chooses based on the Predictor's data (maximizing future preference satisfaction), she violates her current values (which presumably align with the future self's regret). If she refuses, she prevents a future state that is objectively preferred by the inhabitant of that state.

  This contrast locates the real problem not in **phenomenal imagination** or **evidence**, but in the **authority of future preferences**. Paul's argument is often read as claiming we cannot compare utilities because we don't know the terms of the comparison. The Predictor shows we *can* know the terms (via reliable testimony) but still cannot resolve the conflict. The issue is that rational choice presupposes a standpoint of evaluation. In TEs, the standpoint shifts. Variant 2 demonstrates that even with perfect information, there is no neutral arbiter between the current self's values and the future self's values.

  One might object that rationality simply demands maximizing the future self's well-being, treating the current self as a vessel. However, this begs the question against the current self's autonomy. If the future self does not endorse the transition (Variant 2), treating their preference as authoritative amounts to the current self committing rational suicide—ceding agency to a successor whose values they cannot currently share or validate.

  Therefore, the Predictor does not dissolve Paul's problem; it reframes it. The obstacle is not that the agent cannot *know* the future utility (the epistemic problem), but that she cannot *authorize* it without abandoning her current rational standpoint (the authority problem). Variant 1 masks this by aligning endorsement with preference; Variant 2 exposes it by decoupling them. The fundamental difficulty of transformative choice is not epistemic uncertainty, but the lack of a diachronically stable metric for rational authority. Rational choice requires a "self" to do the choosing; when the choice destroys the chooser to replace them with someone else, no amount of predictive data can bridge the normative gap.

  ***

  ### 3. Marking Scheme

  **Total Marks: 20**

  | Move | Marks | Requirement | Typical Error |
  | :--- | :---: | :--- | :--- |
  | **1. Reconstruction** | 4 | Accurately summarizes Paul's two hurdles (Epistemic & Preference transformation) without unnecessary biographical detail. | Merely defining "transformative experience" without explaining *why* it blocks decision theory. |
  | **2. Predictor Analysis** | 4 | Explains how the Predictor removes the epistemic/phenomenal gap (provides data without acquaintance). | Claiming the Predictor fails because it doesn't give "qualia," missing the point that it gives *utility data*. |
  | **3. Variant Contrast** | 4 | Distinguishes Variant 1 (solvable/endorsed) from Variant 2 (problematic/disavowed) and explains why V2 is harder. | Treating both variants as identical because "preferences change" in both. |
  | **4. Locating the Problem** | 4 | Argues the core issue is **Authority/Diachronic Identity**, not Evidence or Imagination (based on V2). | Concluding the problem is still just "not knowing what it's like" despite the Predictor's data. |
  | **5. Objection/Defense** | 4 | Defends the verdict against a counter-argument (e.g., "Just maximize future utility") or qualifies the scope. | Failing to consider why we can't just defer to the future self's preferences in Variant 2. |

  **Grading Distinctions:**

  *   **B-Range (10–14 marks):** Competently reconstructs Paul's standard argument and correctly identifies that the Predictor solves the information gap. However, treats the case primarily as an **epistemic problem** (e.g., "The Predictor helps but doesn't give qualia"). It fails to pivot to the question of *whose* preferences count, treating Variant 2 as merely a case of regret rather than a breakdown of rational authority.
  *   **A-Range (15–20 marks):** Recognizes that the Predictor *should* solve the epistemic problem, meaning the remaining friction in Variant 2 must be normative, not epistemic. Explicitly argues that the core of Paul's challenge is the **instability of the evaluating self** (authority/identity). Uses the contrast between variants to show that endorsement matters more than preference satisfaction.
