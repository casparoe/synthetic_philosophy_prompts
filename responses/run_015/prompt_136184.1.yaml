      *   **Constraints:** Formal tone, no bibliographic references/citations, build from first principles (no obscure named doctrines).

  2.  **Deconstruct the Philosophical Positions:**
      *   *Narrative Realist:* Thematic universals exist "out there" (Platonic-ish). A book *has* tragedy regardless of who reads it. Misreading is an error of perception. Cross-cultural similarity is evidence of accessing the same universal.
      *   *Narrative Constructivist:* Thematic universals are tools/categories created by readers/cultures. A book *becomes* tragic through reading. Misreading is just a different usage or a failure of communication, not an ontological error. Cross-cultural similarity is convergent evolution of interpretive habits.

  3.  **Drafting - Section 1: Agreed Claims:**
