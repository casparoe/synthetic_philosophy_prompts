  5.  **Drafting - Section 3: The Cruxes:**
      *   *Crux 1:* Does agreement imply a shared object? (Realist: Yes; Constructivist: No, it implies shared cognitive/cultural structures).
      *   *Crux 2:* Is a misread novel defective? (Realist: Yes, it failed to instantiate; Constructivist: No, the text is stable, the reception varied).

  6.  **Drafting - Section 4: Concrete Literary Cases:**
      *   Need examples that aren't clichés but are clear.
      *   *Case for Crux 1 (Cross-cultural recognition):* *The Tale of Genji* and *Madame Bovary* (Melancholy/Longing).
          *   Realist: They tap into the universal "Longing."
          *   Constructivist: Different cultures developed similar hermeneutic tools to process dissatisfaction.
      *   *Case for Crux 2 (Misreading/Defect):* A satire read as earnest drama (e.g., *A Modest Proposal* or *Gulliver's Travels*, or perhaps *The Turn of the Screw*). Let's use *The Turn of the Screw* (Ambiguity vs. Ghosts). Or better, a clear case of thematic miss. Let's go with a specific tragic irony miss. Let's use *Oedipus Rex* read as a story of luck rather than fate.
      *   *Refinement:* The prompt asks for "whether a novel widely misread thematically is defective." Let's use a case where a text is consistently read against its grain. *Moby Dick* read purely as adventure vs. metaphysical tragedy.
      *   *Selection:*
          1.  Cross-Cultural: *The Genji* / *Bovary* (Melancholy).
          2.  Misreading: *Gulliver's Travels* (read as children's fantasy vs. misanthropic satire).

  7.  **Review and Refine:**
      *   *Check Constraints:* No citations? Yes. Formal tone? Yes. First principles? Yes.
      *   *Voice:* Needs to sound like a document produced by intellectuals trying to find common ground while maintaining distinct identities.
      *   *Formatting:* Clear headings, numbered lists, table structure.

  8.  **Final Polish (Self-Correction during drafting):**
