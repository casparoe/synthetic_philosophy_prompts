      *   *Claim 2 (Intent):* Authorial intent is relevant but not sovereign. It sets constraints but doesn't guarantee successful instantiation.
      *   *Claim 3 (Cross-Cultural):* Two distant novels can share a quality, but the *mechanism* of that sharing is the debate. We agree the *phenomenon* of recognition exists.
      *   *Tone:* Diplomatic, precise, philosophical.

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need to capture the essence without caricature.
      *   *Realist:* Qualities are mind-independent properties instantiated by the text.
