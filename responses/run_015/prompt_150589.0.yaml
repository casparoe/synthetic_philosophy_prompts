answer: |-
  This is a precise methodological problem. You are correct to suspect that the therapeutic metaphor is not merely descriptive but constitutive: it dictates what counts as a resolution. Below is the audit you requested, structured to help you delimit the metaphor's license in your chapter.

  ### 1. The Correspondence Table (West German Case)
  *Based on the Mitscherlich framework (*The Inability to Mourn*, 1967) and the subsequent *Vergangenheitsbewältigung* discourse.*

  | Clinical Term | National/Political Equivalent (West Germany) |
  | :--- | :--- |
  | **The Patient** | The West German collective (specifically the post-war public sphere). |
  | **The Analyst** | The critical intelligentsia (Mitscherlichs, Habermas, Group 47) & later the *Historikerstreit* participants. |
  | **The Trauma** | The Holocaust and the war of annihilation (specifically the *deeds*, not the suffering endured). |
  | **The Symptom** | Silence, restoration of ex-Nazi elites, psychosomatic national identity (rigidity, lack of affect). |
  | **Resistance** | Adenauer's "letting the past be past," family silence, defensive nationalism. |
  | **The Cure** | *Vergangenheitsbewältigung* (working-through), public acknowledgment, institutional apology. |
  | **Relapse** | Revisionist spikes (e.g., Bitburg, *Historikerstreit*). |
  | **Termination** | "Normalization" (the ability to speak of national identity without immediate reference to guilt). |

  ### 2. Disanalogies: Load-Bearing vs. Non-Load-Bearing

  You need to separate the metaphor's poetic utility from its ontological claims.

  **Non-Load-Bearing (Acknowledgable without breaking the argument)**
  *   **Scale and Time:** Therapy takes years; national memory takes centuries. This is a difference of magnitude, not kind. You can acknowledge this without undermining the mechanism.
  *   **Methodology:** Free association vs. archival research. Both are techniques of retrieval.
  *   **Voluntarism:** Patients seek therapy; nations are dragged into it. This weakens the "cure" analogy but doesn't invalidate the "symptom" diagnosis.

  **Load-Bearing (These break the model's explanatory power)**
  *   **Ontology of the Mind:** As you noted, there is no collective unconscious. "Repression" in Germany was not a psychic mechanism but a social contract enforced by silence and reintegration policies. Calling it repression obscures the *political choice* to remain silent. It turns a strategy into a symptom.
  *   **The Identity of the Patient:** In therapy, the patient is the perpetrator of their own life choices. In memory, the "patient" (grandchildren) did not commit the act. They inherit the *narrative*, not the *guilt*. The therapy model conflates responsibility (political) with guilt (moral/clinical), making the successor generation "sick" for crimes they didn't commit.
  *   **The Locus of the Cure:** In therapy, health is internal to the patient. In memory politics, "recovery" is externally validated by the victim. Germany is not "cured" because Germans feel better; it is "cured" because Israel or Jewish organizations accept the restitution. The therapy model has no slot for the *victim's acceptance* as the condition of termination.
  *   **Teleology (The Endpoint):** Therapy aims for discharge. Politics aims for legitimacy. The German fight over "normalization" proves there is no consensus on termination. If the goal of the state is survival and legitimacy, "health" is irrelevant. The metaphor smuggles in a normative endpoint (liberal contrition) that the political actors may actively resist for valid strategic reasons.
  *   **Authority of Diagnosis:** In the clinic, the analyst is credentialed and the relationship is consensual. In memory studies, the "analyst" is a political actor (historian/activist) diagnosing an adversary. Calling a state "in denial" is a political attack, not a medical finding. It immunizes the diagnoser from critique.

  ### 3. Alternative Models: Legal vs. Inheritance

  Your hunch is correct: the shift is from *Health* (Therapy) to *Obligation* (Legal/Inheritance).

  **The Legal Model**
  *   **Mechanism:** Crime, Evidence, Statute of Limitations, Verdict, Restitution.
  *   **Advantage:** It centers the **victim** as the plaintiff. The state is the defendant. It acknowledges the adversarial nature of memory (unlike therapy, which assumes a shared goal of health). It handles the "statute of limitations" problem (generational change) explicitly.
  *   **Disadvantage:** It implies **closure**. A verdict ends the case. Memory does not end. It also risks binary logic (guilty/not guilty) which misses the ambivalence of complicity.
  *   **Normativity:** It smuggles in *Justice* rather than *Health*. It asks "What is owed?" rather than "How do we feel?"

  **The Inheritance/Estate Model**
  *   **Mechanism:** Estate, Heir, Administrator, Liability, Asset, Disclaimer.
  *   **Advantage:** It handles **intergenerational transmission** best. You do not choose your inheritance, but you are responsible for administering it. You can squander the estate (denial), administer it faithfully (reparations), or disclaim it (secession/revolution). It fits the Turkey/South cases well because it accounts for the *assets* (pride, territory, identity) alongside the *liabilities* (corpses, guilt).
  *   **Disadvantage:** It can sound bureaucratic, depoliticizing the violence into bookkeeping.
  *   **Normativity:** It smuggles in *Fidelity* or *Stewardship*. It asks "How do we manage this legacy?"

  **Verdict on Alternatives:**
  Use the **Inheritance Model** for the structural argument (how the past is transmitted) and the **Legal Model** for the normative argument (what is owed to victims). Both dodge the "health" trap. The Therapy Model should be restricted *only* to describing the **affective resistance** (the feeling of shame, the defensive anger) that blocks the legal or administrative work. Do not use it to describe the *state* of the nation; use it to describe the *obstacle*.

  ### 4. Melancholia vs. Mourning (Freud)

  Your intuition here is sharp and distinguishes the cases effectively.

  *   **Germany/Japan:** The ideal therapeutic arc is **Mourning**. The lost object is the *victim* (who must be grieved) or the *innocent national self* (which must be let go). The work is to detach libido from the Nazi/Imperial ideal.
  *   **American South/Turkey:** These cases fit **Melancholia** better.
      *   **The Lost Object:** In the South, it is the Confederacy (the "Lost Cause"). In Turkey, it is the Imperial Ottoman self/territory.
      *   **The Pathology:** In melancholia, the ego identifies *with* the lost object. The South *is* the Confederacy in its self-conception; Turkey *is* the Empire in its geopolitical self-conception. They are not trying to mourn the victims (Armenians/Enslaved); they are mourning their own lost supremacy.
      *   **The Fit:** The therapy model fails here because the "cure" (letting go of the lost cause) is seen by the patient as *suicide*. To mourn the Confederacy is to cease being "Southern" in the traditional sense. To mourn the Empire is to cease being the "Guardian of the East."
      *   **Conclusion:** The Melancholia distinction fits the South and Turkey *better* than Germany, precisely because their "symptom" is an active identification with the perpetrator past, whereas Germany's symptom (initially) was disidentification (silence). However, calling it "pathological" still carries the normative sting of the therapy model.

  ### 5. Final Verdict: Fit and Damage

  **Least Bad Fit: West Germany**
  *   **Why:** The metaphor was built for this case. The internal discourse actually used these terms (*Bewältigung*, *Trauerarbeit*). The "analyst" (intellectuals) and "patient" (public) had a consensual, if fraught, relationship. The endpoint ("Normalization") was at least debated within the same vocabulary.
  *   **Caveat:** It still obscures the political utility of silence (e.g., Cold War integration), but it accurately describes the *affective* landscape of the 1960s-80s.

  **Most Damage: The American South**
  *   **Why:** The therapy model pathologizes a **political ideology**. The "Lost Cause" is not a trauma symptom; it is a constructed political theology used to maintain power structures (Jim Crow, then mass incarceration). Calling it "unmourned grief" or "denial" suggests that if Southerners just "felt better," the racism would end. It misidentifies the mechanism: the memory is not a blockage to health; it is a tool of governance.
  *   **Risk:** It lets the "patient" off the hook by making them "sick" rather than complicit.

  **Secondary Damage: Turkey**
  *   **Why:** Similar to the South, but complicated by the fact that the "trauma" for the Turkish state is often framed as the *collapse* itself (Sèvres Syndrome), not the perpetration (Armenian genocide). The therapy model struggles when the perpetrator views *themselves* as the primary victim of history. It creates a contest of traumas that the clinical model cannot adjudicate.

  **Intermediate Case: Japan**
  *   **Why:** Japan fits poorly because the "working through" is fragmented. There is no single "patient." The Emperor system, the LDP, and the peace movement are different patients with different traumas (perpetration vs. atomic bombing). The therapy model assumes a unified ego that Japan does not possess.

  ### Recommendation for the Chapter
  Keep the therapy vocabulary **only** to describe the *rhetoric of resistance*. When a politician says, "We must put the past behind us," analyze that as a claim to therapeutic closure. But do not adopt the vocabulary as your own analytical framework for the *structure* of memory.

  Switch to the **Inheritance Model** for the comparative structure. It allows you to say:
  1.  Germany accepted the liability and administered the estate (with difficulty).
  2.  Japan disputed the liability while keeping the assets.
  3.  Turkey disclaimed the liability by redefining the estate (it wasn't genocide, it was war).
  4.  The South capitalized on the assets (cultural pride) while defaulting on the liability (reparations).

  This preserves the comparative logic without diagnosing nations as patients.
