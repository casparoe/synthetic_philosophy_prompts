      *   *The Missing Piece:* **Decomposition/Structural Modeling combined with Base Rates.** Or, **Prediction Markets/Expert Elicitation.**
      *   *Better Approach:* Use the Outside View for the *components* (fiscal divergence, democratic deficit) rather than the whole entity. Or use a "Reference Class of Intent" (other projects designed to prevent collapse) rather than "Reference Class of Form" (federations).
      *   *Key Insight:* The EU is a *political technology*. We should look at the failure rates of *political technologies* intended to solve specific problems, not just "empires."
      *   *Also:* Time horizon. 10 years vs 100 years.
