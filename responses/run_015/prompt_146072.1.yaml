      *   *Tension 3 (Mechanism vs. Outcome):* Belief (b) posits a specific mechanism ("ghost buffer") for Dark. Belief (e) posits a metric (compression ratio) for depth. If depth is just compression, why do we need a specific buffer mechanism that implies a qualitative shift?
