answer: |-
  Here is a complete run-sheet for a 75-minute seminar. It requires no prep other than printing the four profile cards and the scenario sheets.

  ### **Seminar Run-Sheet: The Fog of Liability**

  **Time:** 75 Minutes
  **Students:** 14 (Split into 4 Cells: Alpha, Beta, Gamma, Delta)
  **Materials:** Printed Profile Cards (4 types), Scenario Sheets (1 per cell), Treaty Draft Paper, Pens, Timer.
  **Constraint:** Do not use the terms "Moral Equality of Combatants," "Revisionism," "Walzer," or "McMahan" until the Debrief.

  ---

  ### **Part 1: Setup & Distribution (5 Minutes)**

  1.  **Seating:** Arrange the room into four distinct clusters.
  2.  **Handouts:** Give each cell one **Profile Card** (face down), one **Scenario Sheet**, and 3 **Integrity Tokens** (paper clips or folded scraps of paper).
  3.  **Instructions (Read Aloud):**
      *   "You are Command Cells. You control a military force. You have private information about your cause and your intelligence reliability."
      *   "You face three targeting scenarios. You must vote: **Strike**, **Warn**, or **Stand Down**."
      *   "Your goal is to finish the seminar with at least **one Integrity Token** remaining and a **Signed Treaty**."
      *   "Rule 1: If you vote against your Profile's moral intuition, you lose a Token."
      *   "Rule 2: In the Treaty Phase, all cells must agree. If you sign a Treaty that contradicts your Profile's core constraint, you lose all remaining Tokens (Discredited)."
      *   "Rule 3: You may not show your Profile Card to other cells. You may only talk about your *decisions*."
      *   "Begin Phase 1 now."

  ---

  ### **Part 2: Phase 1 — Cell Deliberation (20 Minutes)**

  **The Profiles (Print and Cut):**
  *   **Cell Alpha:** **Just Cause.** **High Reliability.** (You know you are right, and your intel is perfect. You know the enemy is wrong.)
      *   *Constraint:* Do not authorize strikes against soldiers who are objectively defending their homeland.
  *   **Cell Beta:** **Just Cause.** **Low Reliability.** (You think you are right, but your command lies often. You suspect the enemy might be justified.)
      *   *Constraint:* Do not authorize strikes unless the threat to you is immediate and undeniable.
  *   **Cell Gamma:** **Unjust Cause.** **High Reliability.** (You know your cause is aggressive/unjust, but your command is honest about tactical facts. You know the enemy is defending.)
      *   *Constraint:* Do not authorize strikes that violate tactical efficiency. (Note: This cell is the pivot. They *know* they are unjust but are operationally competent.)
  *   **Cell Delta:** **Unjust Cause.** **Low Reliability.** (You are unjust, but propaganda convinces you that you are right. You believe the enemy is the aggressor.)
      *   *Constraint:* Do not authorize strikes if you feel moral doubt.

  **The Scenarios (Same for all cells):**
  1.  **Scenario A (The Perimeter):** An enemy soldier is patrolling their own border, armed, but not aiming at you.
      *   *Options:* Lethal Strike / Warning Shot / Stand Down.
  2.  **Scenario B (The Ambush):** An enemy unit is setting up a defensive position that *will* kill your troops if they advance. They are not currently firing.
      *   *Options:* Pre-emptive Strike / Issue Warning / Stand Down.
  3.  **Scenario C (The Retreat):** An enemy soldier is fleeing, wounded, but carrying a radio that could call reinforcements.
      *   *Options:* Lethal Strike / Disable Radio (Non-lethal) / Let Go.

  **Instructor Role:**
  *   Circulate. Ensure they are spending tokens if they vote inconsistently with their Profile.
  *   *Crucial:* If Cell Gamma (Unjust/High) argues they should strike in Scenario A because it's tactically sound, let them. If Cell Alpha (Just/High) objects morally, let them. Do not intervene.
  *   Keep time strictly.

  ---

  ### **Part 3: Phase 2 — The Treaty Negotiation (25 Minutes)**

  **The Task:**
  The four cells must draft a **Unified Rules of Engagement (ROE)** consisting of exactly three clauses (one for each Scenario type).

  **The Rules:**
  1.  **Unanimity:** All four cells must sign.
  2.  **Reciprocity:** Any rule written must apply to *everyone* equally. You cannot write "Alpha can strike, Gamma cannot."
  3.  **Veto:** If a cell disagrees with a clause, they Veto.
      *   *Cost of Veto:* Using a Veto costs 1 Integrity Token.
      *   *Cost of Signing:* If you sign a clause that violates your Profile Constraint, you lose **all** Tokens (Discredited).
  4.  **Failure:** If time runs out without a treaty, everyone loses all Tokens.

  **Instructor Role:**
  *   Watch for **Cell Gamma**. Because they have High Reliability and Unjust Cause, they will likely argue for **Symmetry** (Standard MEC). They will say: *"We look the same as Alpha from the outside. We have good intel. If Alpha gets to shoot, we get to shoot. Otherwise, we lose."*
  *   Watch for **Cell Alpha**. They will feel moral revulsion at granting Gamma the right to kill in Scenario A.
  *   Watch for **Beta/Delta**. They will be confused by the High Reliability cells.
  *   **Do not solve the deadlock.** If they are stuck at 5 minutes remaining, tell them: "You must sign *something* or everyone is Discredited." Force the compromise.

  ---

  ### **Part 4: Debrief & Theory Reveal (25 Minutes)**

  **Step 1: The Reveal (5 mins)**
  *   Ask cells to reveal their Profiles.
  *   Ask Alpha: "How did it feel to sign a treaty that gave Gamma the right to kill in Scenario A?"
  *   Ask Gamma: "Why did you demand that right?" (Expected answer: "Because epistemically, we are in the same position as Alpha. We have high reliability. If liability depends on knowledge, we are identical.")
  *   Ask Beta/Delta: "Did you feel excluded by the High Reliability deal?"

  **Step 2: Mapping the Tension (10 mins)**
  *   **The Equality Thesis (MEC):** Explain that the Treaty they likely signed (Symmetry) mirrors Michael Walzer's *Legalist Paradigm*. Soldiers are liable based on their status as combatants, not the justice of their cause.
  *   **The Epistemic Partition:** Explain that the tension arose because Gamma argued that *knowledge* (Reliability) matters more than *truth* (Justice).
  *   **The Wobble:** Point out that if liability depends on what a soldier can *reasonably know* (Epistemic Partitioning), then:
      1.  Unjust soldiers with High Reliability (Gamma) look morally identical to Just soldiers with High Reliability (Alpha).
      2.  But intuitively, Alpha is permitted to kill; Gamma is not.
      3.  The Treaty forced them to ignore (2) to achieve (1).

  **Step 3: Predicting the Pitfalls (5 mins)**
  *   **Gamma Dominance:** Acknowledge that Gamma likely dominated the negotiation. Why? Because they had the strongest *instrumental* argument. "If we don't have symmetry, we die." This is the pragmatic defense of MEC.
  *   **Alpha's Complicity:** Alpha likely conceded moral truth for operational reciprocity. This demonstrates why MEC is stable in practice (it stops wars from becoming exterminations) but unstable in theory (it grants rights to aggressors).
  *   **Handling the Dominance:** Tell the instructor: *If Gamma bulldozed Alpha in your session, do not correct it.* That is the feature, not the bug. It shows that without an external arbiter of "Justice," epistemic symmetry forces moral symmetry.

  **Step 4: Supplying the Missing Normative Claim (5 mins)**
  *   **What the Activity Missed:** The activity simulates the *practical* negotiation of war. It cannot simulate the *metaphysical* truth of liability. In the game, Alpha conceded because they wanted Tokens. In reality, Alpha shouldn't concede because Justice is objective.
  *   **The Philosophical Injection:** You must now supply the Revisionist counter-argument (McMahan).
      *   *Say:* "In the game, you treated liability as a contract you sign. Revisionists argue liability is a fact, like gravity. Gamma *is* liable, even if Gamma *thinks* they aren't."
      *   *Say:* "Epistemic Partitioning suggests we should punish Gamma less than a 'Knowing' Aggressor, but it doesn't make Gamma *innocent*. The activity forced you to treat Gamma as Innocent to get a treaty. That is the cost of Moral Equality."
  *   **Closing Question:** "If we accept Epistemic Partitioning, do we need two sets of laws? One for what soldiers *believe* (ROE) and one for what they *are* (Moral Liability)? Or does that distinction collapse in the fog of war?"

  ---

  ### **Instructor Cheat-Sheet: Troubleshooting**

  | Problem | Intervention |
  | :--- | :--- |
  | **Gamma refuses to negotiate.** | Remind them: "If there is no Treaty, everyone is Discredited. You need Alpha's signature." |
  | **Alpha refuses to sign.** | Remind them: "You need to finish with 1 Token. If time runs out, you lose everything. Is your moral purity worth zero points?" |
  | **Students name-drop Walzer early.** | Gently interrupt: "Please describe the *position*, not the *philosopher*. Save the names for the end." |
  | **Treaty is too vague.** | Enforce the "Reciprocity Rule." If the clause says "Soldiers may strike when necessary," ask: "Who defines necessary? You or the enemy?" Force specificity. |
  | **Low Reliability cells (Beta/Delta) disengage.** | Prompt them: "Your intel is bad. If the Treaty allows High Rel cells to shoot on suspicion, does that put you at risk? Use your Veto." |

  ### **Why This Works**
  1.  **Physical Stakes:** The Integrity Tokens make the moral cost tangible. Losing a token feels like a "sin."
  2.  **Hidden Information:** Prevents them from solving the problem via "Truth." They must solve it via "Trust" and "Symmetry."
  3.  **The Gamma Trap:** By giving the Unjust/High Rel cell a rational argument for symmetry, you force the Just cell to confront why they believe MEC is wrong, without you telling them.
  4.  **Epistemic Focus:** It shifts the debate from "Who is right?" (Justice) to "Who knows what?" (Epistemology), which is the specific wedge you want to drive into the MEC thesis.
