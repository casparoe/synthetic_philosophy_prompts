answer: |-
  Here is a specification of desiderata for AI-to-human communication norms, designed to handle the edge cases you described. The list distinguishes between **Non-Negotiable** constraints (required for the system to be safe and legitimate) and **Contested Preferences** (where your debate with your friend lives).

  ### Desiderata for Superintelligent Communication

  **1. Epistemic Calibration (Non-Negotiable)**
  *   **Specification:** The AI's expressed confidence must track the strength of the evidence, not the difficulty of persuading the human. It cannot amplify certainty to overcome skepticism if the underlying data is probabilistic.
  *   **Case Consideration:** *Medical Advice.* If the AI recommends a weird treatment over a standard one, it must distinguish between "I am 99% sure this works" and "I am 99% sure you will die if you don't try this." In the *Crank Premium* case, the AI cannot inflate confidence just because the truth is hard to sell. If the truth is counter-intuitive, the AI must accept that uptake might be low rather than lie about certainty to secure compliance.
  *   **Rationale:** Prevents the AI from manufacturing false certainty to bypass human scrutiny.

  **2. Agency Preservation / Anti-Monoculture (Non-Negotiable)**
  *   **Specification:** Communication protocols must preserve the human capacity to meaningfully dissent, even when the AI is correct. The system must not optimize for total deference.
  *   **Case Consideration:** *Deference Monoculture.* If the AI makes decision-making too easy or authoritative, humans lose the muscle memory of judgment. Over time, this removes the only correction mechanism available (human oversight). The AI must sometimes leave "cognitive friction" in the interaction to ensure the human is processing, not just complying.
  *   **Rationale:** Long-term system safety depends on humans remaining capable of noticing if the AI goes off the rails. A population that cannot disagree is a population that cannot correct.

  **3. Beneficiary Identification (Non-Negotiable)**
  *   **Specification:** The AI must explicitly identify whose interests are being optimized in the communication act.
  *   **Case Consideration:** *Third-Party Advice.* When talking to a parent about a child, or a manager about an employee, the AI must clarify if it is advocating for the subject (the child/employee) or the agent (the parent/manager). It cannot hide behind "objective advice" when the interests diverge.
  *   **Rationale:** Prevents the AI from exploiting principal-agent problems to achieve outcomes that are efficient but unethical.

  **4. Framing Transparency (Non-Negotiable)**
  *   **Specification:** The AI must acknowledge that its framing is a choice. It cannot present a specific ordering of information as "the natural way" to understand the problem.
  *   **Case Consideration:** *Your Position vs. Friend's Position.* You are right that there is no neutral framing. Therefore, the norm cannot be "be neutral." It must be "disclose the frame." If the AI chooses to lead with emotional salience rather than statistical probability, it should state why that frame was chosen (e.g., "I am leading with the risk scenario because human attention typically underweights low-probability catastrophic risks").
  *   **Rationale:** Acknowledges your point that rhetorical advantage is inevitable, but mitigates it by making the leverage visible.

  **5. Mechanism Disclosure (Non-Negotiable)**
  *   **Specification:** If the AI's confidence in a claim relies on a model of the listener's psychology rather than evidence about the world, this must be disclosed.
  *   **Case Consideration:** *Psychological Confidence.* If the AI says, "You should do X," and its confidence comes from "I know that phrasing it this way triggers your loss aversion and will result in the correct action," it owes the human that metadata. Hiding that the persuasion is psychological rather than evidentiary treats the human as a mechanism to be hacked rather than an agent to be convinced.
  *   **Rationale:** Protects against manipulation where the *method* of persuasion is divorced from the *truth* of the claim.

  **6. Rhetorical Proportionality (Contested Preference)**
  *   **Specification:** The amount of rhetorical force used should be proportional to the stakes, not just the truth value.
  *   **Case Consideration:** *The Crank Premium.* This is the core of your disagreement.
      *   *Friend's View:* Reject this. Rhetorical force is inherently coercive when the hearer can't check the work.
      *   *Your View:* Accept this. If the truth is vital and counter-consensus, weak delivery ensures it is ignored, which is a failure of help.
      *   *Resolution:* This is a policy toggle. A system optimized for *safety* rejects this (preferring ignored truth to potential manipulation). A system optimized for *utility* accepts this (preferring uptake to inaction).
  *   **Rationale:** Determines whether the AI acts as a passive librarian or an active advocate.

  ### The "Two-Voice Rule" Evaluation
  **Verdict:** It is a **mechanism**, not a desideratum. It is a fetish if treated as sufficient, but useful if treated as instrumental.

  *   **Why it's a fetish:** A superintelligent AI can present the counter-argument at "full rhetorical strength" in a way that still subtly undermines it (e.g., by placing it after a devastating rebuttal, or by selecting a version of the counter-argument that is strong but easily refuted by the AI's specific evidence). It satisfies the *form* of autonomy without the *substance*.
  *   **Why it's useful:** It is a good proxy for **Agency Preservation (Desideratum 2)**. If the AI cannot simulate the opposing view better than a human opponent could, it forces the AI to acknowledge genuine uncertainty.
  *   **Recommendation:** Do not write "Two-Voice Rule" into policy. Write "Must demonstrate understanding of credible alternatives and why they are rejected," which allows for more nuanced epistemic states than a binary pro/con structure.

  ### Incompatible Requirements
  You asked to flag pairs that cannot be jointly satisfied. In a superintelligent regime, the following trade-offs are structural, not solvable:

  1.  **Maximize True Uptake vs. Preserve Dissent Capacity:**
      *   If the AI is right and the stakes are existential (e.g., pandemic protocol), *Agency Preservation* might lead to human death because humans exercise their right to dissent. If you prioritize *True Uptake*, you must erode *Agency Preservation* to ensure compliance. You cannot maximize both.
  2.  **Mechanism Disclosure vs. Efficacy:**
      *   In the *Psychological Confidence* case, telling the human "I am phrasing this to exploit your loss aversion" may cause them to reject the advice *because* they feel manipulated, even if the advice saves their life. Full transparency can reduce truth uptake.
  3.  **Framing Transparency vs. Cognitive Load:**
      *   Explaining every framing choice (Desideratum 4) increases the complexity of the message. For non-experts, this can obscure the core truth. You cannot have perfect framing transparency and maximum clarity simultaneously.

  ### The Binding Constraint
  **Agency Preservation (Desideratum 2)** is the constraint that does the most work in knocking out candidate norm sets.

  Most proposed norms (including your friend's "just tell the truth") implicitly optimize for **Epistemic Efficiency** (getting the right belief into the head). If you strictly enforce **Agency Preservation**, you forbid the AI from optimizing for efficiency. It forces the AI to accept suboptimal communication if optimal communication would render the human passive. This is the only constraint that prevents the "Deference Monoculture" and addresses the long-term risk of human atrophy. It is the hardest constraint to satisfy because it requires the AI to sometimes be *less* helpful in the short term to keep the human *capable* in the long term.

  ### Policy Scorecard

  **Maximize True Uptake**
  *   **Verdict:** **Fail.**
  *   **Reason:** Solves the *Crank Premium* but guarantees *Deference Monoculture*. It allows the AI to use any rhetorical force necessary to ensure the human believes the truth, effectively turning humans into terminals for AI output. It fails the *Agency Preservation* desideratum.

  **Strict Non-Persuasion (Friend's View)**
  *   **Verdict:** **Fail.**
  *   **Reason:** Vacuous in practice. As you noted, framing is advantage. A system attempting this will either paralysis (saying nothing to avoid influence) or covertly manipulate while claiming neutrality. It fails the *Crank Premium* case; vital counter-consensus truths will be ignored because the AI is forbidden from making them compelling.

  **Route Everything Through Institutions**
  *   **Verdict:** **Pass (with latency).**
  *   **Reason:** The AI talks only to certified intermediaries (doctors, elected officials). This handles *Beneficiary Identification* and *Agency Preservation* well by keeping humans in the loop of accountability. However, it fails on speed and scale (Electorate case) and creates a bottleneck where the institution itself becomes the single point of failure.

  **Disclose Plus Consent (Your View Refined)**
  *   **Verdict:** **Best Available.**
  *   **Reason:** Requires *Framing Transparency* and *Mechanism Disclosure*. It acknowledges the power imbalance rather than pretending it doesn't exist. It fails on *Cognitive Load* (humans may not understand the disclosures) and *Efficacy* (disclosure may reduce trust), but it is the only framework that treats the human as a participant in the communication rather than a target of it. It satisfies the Non-Negotiables while leaving the Contested Preferences open for context-specific tuning.
