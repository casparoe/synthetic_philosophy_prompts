answer: |-
  This is a smart move. Too many papers jump straight to "here's my fix" without clarifying what counts as a fix. If you're writing a chapter, nailing the desiderata first lets you evaluate the literature rather than just join the fray.

  Here is a draft structure for your criteria section, broken down by requirement, necessity, and the reasoning behind it. I've also included the analysis of that "unsatisfiable cluster" you're worried about, followed by a quick map of how the standard solutions trade off against these criteria.

  ### Part 1: The Desiderata List

  You want to separate the *non-negotiables* (things any resolution must handle) from the *camp preferences* (where the philosophical battles actually live).

  **1. The Finite Valuation Requirement (Non-Negotiable)**
  *   **The Demand:** The resolution must entail that a rational agent's willingness-to-pay (WTP) for the game is finite.
  *   **The Reasoning:** This is the phenomenon to be saved. If a theory implies a rational agent should mortgage their house to play, the theory fails as an account of *practical* rationality, regardless of its mathematical elegance. It must bridge the gap between infinite expectation and finite price.

  **2. The Normative/Descriptive Distinction (Non-Negotiable)**
  *   **The Demand:** The resolution must specify whether the finite WTP is a constraint on *rationality* (you *shouldn't* pay more) or a constraint on *possibility* (you *can't* value it more).
  *   **The Reasoning:** Many solutions conflate these. A cognitive bound argument (e.g., "agents can't compute large numbers") explains behavior but doesn't justify normativity. A bounded utility argument justifies normativity but requires metaphysical commitment. Your criteria need to flag which lane the solution is driving in.

  **3. Conservation of Expected Utility (Camp Preference)**
  *   **The Demand:** Does the resolution preserve standard EU axioms (Independence, Continuity, Transitivity) for bounded gambles?
  *   **The Reasoning:** This is the main fracture line.
      *   *Preservationists* (e.g., standard economists) demand that EU works for normal bets and the Petersberg case is a special exception or a category error.
      *   *Revisionists* (e.g., Buchak) are willing to modify the EU functional form (e.g., risk-weighting) globally to handle the paradox.
      *   *Note:* You need to flag that demanding EU preservation for bounded gambles while banning it for unbounded ones risks a consistency charge (see the "Cluster" section below).

  **4. Non-Arbitrariness of the Bound (Non-Negotiable)**
  *   **The Demand:** If the solution imposes a cap (on utility, probability, or bankroll), the location of the cap cannot be ad hoc.
  *   **The Reasoning:** Simply asserting "utility stops at 10^10" solves the math but fails the philosophy. The criteria must demand a principled derivation of the bound (e.g., derived from physical limits, psychological saturation, or axiomatic restriction).

  **5. Metaphysical Neutrality vs. Commitment (Camp Preference)**
  *   **The Demand:** Must the resolution commit to a claim about the physical world (e.g., "infinite sequences are impossible") or can it remain purely formal?
  *   **The Reasoning:** Some solutions (like the "reject the game" strategy) dissolve the paradox by claiming the setup is physically impossible. Others treat it as a thought experiment about abstract value. Your criteria should require the author to state their stance on whether decision theory is constrained by physics.

  ---

  ### Part 2: The "Jointly Unsatisfiable Cluster"

  You hit on a major tension here. It's essentially a trilemma. You can see this clearly if you lay out the following three claims:

  1.  **EU Axioms Hold:** Standard Expected Utility axioms (specifically Continuity and Unboundedness of preference) are valid.
  2.  **Unbounded Utility:** There is no upper bound on the utility an agent can assign to outcomes (money maps to utility monotonically without a ceiling).
  3.  **Finite Valuation:** A rational agent assigns a finite value to the St. Petersberg game.

  **The Problem:** You cannot hold all three.
  *   If you keep (1) and (2), you get infinite valuation (violating 3).
  *   If you keep (1) and (3), you must bound utility (violating 2).
  *   If you keep (2) and (3), you must break EU axioms (violating 1).

  **Regarding your worry about "Hidden Metaphysics":**
  Yes, keeping EU intact for normal bets but banning it for unbounded ones *does* commit you to a hidden claim. It implies that the domain of the utility function is restricted not by the agent's psychology, but by the structure of the gamble itself.
  *   **The Charge:** This looks like a domain restriction to save the theory. If EU is the *definition* of rationality, it should apply universally. If you say "EU applies except when the sum diverges," you are effectively saying "Rationality is defined by convergence."
  *   **The Metaphysical Hide:** This often smuggles in a claim that *actual* infinities cannot exist in the value space. If you say utility must be bounded to make EU work, you are asserting that no outcome can be infinitely valuable. That's a substantive metaphysical claim about value, not just a mathematical fix.

  **How to frame this in your chapter:**
  Don't ask "Which solution is right?" Ask "Which horn of the trilemma is the author willing to drop?" Your criteria should force the literature to declare which of the three they are sacrificing.

  ---

  ### Part 3: Orientation on the Usual Moves

  Here is how the standard resolutions stack up against your desiderata. This should help you categorize the literature in your chapter.

  **1. Bounded Utility Functions (Menger, Arrow)**
  *   **The Move:** Utility of money is logarithmic or otherwise concave with an asymptote.
  *   **Pros:** Satisfies Finite Valuation and Conservation of EU (mostly).
  *   **Cons:** Fails Non-Arbitrariness. Why *that* bound? Also, Menger showed that for any unbounded utility function, you can construct a "Super-Petersberg" game that breaks it. So you *must* bound utility.
  *   **Verdict:** Mathematically robust, but philosophically costly. It claims there is a maximum possible happiness, which many find counterintuitive.

  **2. Risk-Weighted Expected Utility (Buchak)**
  *   **The Move:** Keep utility unbounded, but modify the EU formula to weight probabilities non-linearly (risk-aversion is built into the functional form, not the utility curve).
  *   **Pros:** Satisfies Finite Valuation and allows Unbounded Utility.
  *   **Cons:** Violates Conservation of EU (specifically the Independence axiom). It's a different theory of rationality, not just a fix.
  *   **Verdict:** Very popular right now. It shifts the burden from "value is bounded" to "rationality isn't linear."

  **3. Cognitive/Implementation Bounds (Simon, Thaler)**
  *   **The Move:** Agents have limited computational power or time; they cannot process the tail of the distribution.
  *   **Pros:** Metaphysically Neutral (doesn't claim utility *can't* be infinite, just that we can't *see* it).
  *   **Cons:** Fails Normative Force. This explains why people *don't* pay much, not why they *shouldn't*. It dissolves the paradox into an error theory.
  *   **Verdict:** Good for Phil Sci/empirical angles, weak for pure Decision Theory.

  **4. The "Reject the Game" Strategy (Hájek, Nover)**
  *   **The Move:** The game is not well-defined. No casino has infinite bankroll; no coin can be tossed infinitely many times in a finite universe.
  *   **Pros:** Solves the metaphysical commitment by making it explicit (the world is finite).
  *   **Cons:** Can feel like a dodge. It turns a normative paradox into a physical impossibility claim.
  *   **Verdict:** Strong if you want to ground decision theory in physics. Weak if you view decision theory as conceptual analysis.

  ### Summary for your Draft

  If I were writing this section, I'd frame the criteria as a **filter**.
  1.  **Filter 1:** Does it yield a finite price? (If no, discard).
  2.  **Filter 2:** Does it explain *why* rationally, not just computationally? (If no, mark as descriptive only).
  3.  **Filter 3:** Which axiom did it break to get there? (This is where you do your analysis).

  This approach lets you avoid picking a winner and instead map the cost of each solution. It addresses your worry about the "unsatisfiable cluster" by making the cluster the central organizing principle of the chapter.

  Good luck with the workshop draft. This angle (focusing on the cost of the solution rather than the solution itself) is usually well-received because it clarifies the dialectic rather than muddying it.
