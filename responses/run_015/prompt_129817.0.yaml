      *   *Dennett:* Challenges the idea of a definitive "moment of experience." Suggests memory and narrative construction happen *after* the fact, but doesn't necessarily deny the experience happened, rather challenges the *authority* of the report about the *timing* and *content* of the experience. (Actually, Dennett's specific challenge in this context is often about the "Orwellian vs. Stalinesque" distinction, but regarding dreams specifically, he argues that the assumption of a rich inner experience during sleep is unjustified compared to the narrative constructed upon waking. He aligns somewhat with Malcolm but via a different route—questioning the "Cartesian Theater".) *Correction:* For this seminar, I need to focus on the tension: Malcolm says "Dreams are not experiences during sleep, they are waking impressions." Dennett says "The distinction between experience and narrative is unstable; the brain constructs the story."
