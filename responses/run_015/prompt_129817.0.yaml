prompt: |-
  Plan a 75-minute seminar for second-year philosophy undergraduates — familiar with Descartes, unfamiliar with philosophy of mind — on whether dreams are experiences, centered on Malcolm's conceptual argument and Dennett's narrative-construction challenge. Do not summarize the debate for me; instead, lay out the teaching architecture: (a) the ordered sequence of conceptual pieces, specifying which distinction must be secured before the next can be introduced and why reversing the order collapses the argument; (b) the single carrying scenario or thought experiment that should anchor the session — it must make Malcolm's criterion problem visible without invoking neuroscience, brain states, or sleep-stage data, and you should specify exactly what the scenario must contain and what it must omit; (c) the predictable misconceptions students will form or import, including at least one drawn from virtual-reality or simulated-environment talk, and for each the precise point in the sequence where it should be intercepted and how; (d) one closing question or brief task that distinguishes grasping the conceptual dispute from merely adopting Dennett's conclusion; (e) the empirical or scientific material — for instance, REM correlations or neuroimaging claims — that should be explicitly bracketed as out of scope, together with the exact wording you would use to bracket it without sounding dismissive. Keep the plan fully self-contained: no reading list, no citation requests, no references to texts other than Malcolm and Dennett, and no reliance on sources the students could not access in the room.
