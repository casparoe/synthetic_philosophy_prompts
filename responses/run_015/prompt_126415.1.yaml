answer: |-
  The air in the arbitration chamber always tasted of ozone, a sharp, metallic tang that coated the back of the throat like a premonition of lightning. It was the scent of the calibration engines cycling up, ionizing the dust motes that danced in the sterile light. Voss stood behind the observation wall, her palm pressed against the cold glass. It was thick enough to mute the sound of the world outside, but not the sound within. Behind her, the shredder hummed—a low, digestive growl—chewing through the brittle remains of old preference profiles. Paper turned to confetti, then to pulp, then to nothing. Another citizen's moral landscape, deemed too distorted by cultural sediment to be trusted, was being recycled into blank stock.

  Voss checked her reflection in the glass. She looked tired. The lines around her eyes were not just age; they were the result of a decade of squinting at the Reflexive Equilibrium of Taste. The RET was supposed to be the great filter. It was the tool Aeloria used to separate the gold of authentic moral preference from the lead of cognitive bias. When a claimant felt a visceral resistance to a policy, Voss's job was to determine if that resistance was a signal of truth or merely a glitch in the hardware of their upbringing.

  She turned from the glass as the chamber door hissed open. The claimant entered. Her name was Elara, and she was here to contest the Longevity-Weighted Resource Lottery.

  Elara was seventy cycles old, her skin mapped with the fine wrinkles of a life lived before the calibration engines dominated the skyline. She wore the grey tunic of the senior cohort, her hands clasped tightly in her lap. She did not look at Voss; she looked at the center of the room, where the haptic interface table hovered, projecting a soft, amber glow.

  "Please, sit," Voss said, her voice level. She moved to the auditor's chair, the leather cool against her spine. "You understand the purpose of this hearing?"

  "I understand," Elara said. Her voice was dry, like leaves skittering on pavement. "You want to know why I refuse the lottery. You want to know if I am being fair, or if I am just old."

  "I want to know if your aversion is a principle or a bias," Voss corrected gently. "The Lottery prioritizes the recently born over the long-lived for cellular regeneration therapy. It is a utilitarian calculation of potential life-years. You have filed a conscientious objection. You claim this violates temporal fairness."

  "It violates justice," Elara said. She finally looked up. Her eyes were dark, unyielding. "A life lived is not a sunk cost. To treat my remaining years as less valuable than a newborn's potential is to say I am already dead."

  "That is the feeling," Voss said, tapping the console. The amber light shifted to blue. "Feelings are the data, Elara, not the conclusion. We are going to run the Equilibrium. I will present you with variations of the scenario. We will adjust the variables until your resistance either dissolves or solidifies. If it solidifies into a consistent shape, it is a preference. If it fractures into contradiction, it is a bias."

  Elara nodded, once. "Begin."

  Voss initiated the sequence. The RET was not a questionnaire; it was a pressure chamber for the conscience. As Voss spoke, the haptic table responded, generating subtle vibrations that matched the cognitive load of the questions. It was designed to bypass the linguistic centers and speak directly to the somatic markers of decision-making.

  "Case One," Voss said. "Two patients. One is a newborn. One is seventy. One dose of regeneration. You must choose who receives it. You choose the seventy-year-old. Why?"

  "Because she has a history," Elara said. "She has commitments. Debts. Loves. The newborn has none of these. To erase the history is to erase the meaning of the society."

  The console chimed. A wave form scrolled across Voss's screen. Smooth, high amplitude. Resistance detected.

  "Case Two," Voss continued. "The seventy-year-old is a criminal. She has harmed others. The newborn is innocent."

  Elara hesitated. The hesitation was physical; her shoulders tightened. "The debt... the debt is paid through punishment, not erasure. If she is due for regeneration, she has served her time."

  "Case Three," Voss said, her voice dropping slightly. "The newborn is not one child. It is five. The resources required to regenerate the seventy-year-old could sustain five infants through their critical development window. One life known, or five lives potential."

  The room seemed to grow colder. This was the pivot. The classic trade-off, stripped of the trolley problem's mechanics and applied to the biology of time.

  Elara's breathing changed. It became shallow. "You are asking me to trade a story for statistics."

  "I am asking you to trade one known quantity for five unknown ones."

  "I cannot do it," Elara whispered. "I cannot look at the one and see only a number. If I do that, I am no longer human. I am a calculator."

  Voss watched the screen. The wave form spiked. The biometric sensors embedded in the table picked up the galvanic skin response, the micro-tremors in Elara's hands, the pupil dilation. The RET analyzed the pattern of resistance. It was looking for the signature of *principled consistency*. A principle holds steady under pressure. A bias wavers, or it hardens into dogma without structural support.

  "Continue," Voss said. "Case Four. The one known life is your own."

  Elara flinched. The shredder behind them chewed a thick stack of paper, the sound like bones breaking. "Then it is not a hypothetical, is it? It is a death sentence."

  "It is a test of universalizability," Voss said. "If you claim this is temporal fairness, it must apply to you as it applies to strangers. If it is only self-preservation, it is bias."

  "It applies," Elara said. Her voice shook, but her eyes did not drop. "I would still choose me. And I would still choose the other elder. Because we are here. We are real. The future is a ghost. You cannot kill the present for a ghost."

  Voss stopped the sequence. The hum of the engines dipped. She looked at the data. The signature was distinct. It was a jagged, high-frequency oscillation that the RET cataloged as *Parochial Attachment*. The system classified it as a bias—a culturally implanted distortion that overvalued the proximate and the known. It was the same signature found in nationalists who refused to send aid abroad, or parents who hoarded resources for children who were not starving. It was the signature of the tribe.

  But Elara was not hoarding. She was arguing for the value of the past.

  "The system classifies this as bias," Voss said quietly. "It indicates your judgment is driven by proximity bias. You value the known over the unknown. It is a cognitive error."

  "It is love," Elara said. "You have calibrated the love out of your machine, Auditor. You call it error because it does not fit the curve."

  "My job is not to validate the feeling," Voss said, though she felt a tightness in her own chest. "My job is to ensure the distribution logic is not corrupted by individual noise. If everyone refused the lottery based on this signature, the system collapses. The young die."

  "Then the system is wrong," Elara said. She stood up. "I will not sign the waiver. You can shred my profile. You can cut my rations. But do not tell me my morality is a glitch."

  Elara turned and walked to the door. She did not wait for dismissal. The hiss of the opening door swallowed her grey tunic, and then she was gone.

  Voss sat alone in the ozone scent. The wave form still glowed on her screen. *Parochial Attachment.* Bias.

  She reached for the manual override. It was against protocol to run a personal calibration during a tribunal, but the room was sealed, and the shredder had finished its cycle. The silence was heavy, pressing against her eardrums.

  Voss placed her hands on the haptic interface. She engaged the self-test mode. The screen prompted her: *DEFINE COMMITMENT.*

  She typed: *The integrity of the audit. The refusal to certify a judgment that cannot be universalized.*

  It was the core of her life. For ten years, she had believed that this was the highest moral good she could perform. To protect the system from the chaos of individual bias was to protect the many from the whims of the few. She felt this truth in her bones. It had the same phenomenological weight as Elara's refusal to sacrifice the elder. It felt like stone. It felt like principle.

  She initiated the scan.

  The engines whined, pitching higher. The ozone smell intensified, stinging her eyes. Voss watched the wave form generate. She expected to see the smooth, low-frequency hum of *Rational Consistency*. She expected the signature of a mind aligned with reason.

  The line drew itself across the screen.

  It jagged. It spiked. It oscillated at a high frequency.

  Voss stopped breathing.

  She leaned closer, her nose almost touching the cold glass of the monitor. The signature was identical to Elara's. *Parochial Attachment.*

  The machine was telling her that her commitment to the audit was not a principled stand for universal justice. It was a bias. It was a tribal loyalty to the system that employed her, a cognitive distortion that overvalued the known procedure over the unknown consequences. Her feeling of righteousness was chemically and psychologically indistinguishable from Elara's ageism.

  She ran it again. She tightened her focus on the principle. *Universalizability. Duty. Truth.*

  The wave form did not change. The jagged line persisted. The machine did not care about the content of the thought; it only cared about the structure of the resistance. And the structure of Voss's certainty was the same as the structure of Elara's defiance.

  Voss leaned back in the leather chair. The cold from the observation wall seeped into her shoulders.

  For ten years, she had drawn a line. On one side, the authentic moral agent, capable of reasoning beyond their own skin. On the other, the biased subject, trapped in the cage of their own instincts. She had built her identity on being the one who held the key to the cage.

  Now, the key felt like part of the lock.

  If the feeling of principle was identical to the feeling of bias, then the distinction was operationally void. There was no internal compass that could verify its own north. The ozone scent seemed to rot in her nose. She looked at the shredder. It was quiet now, full of the pulped remains of other people's certainties.

  And yet.

  She looked at her hands. They were steady. She felt the weight of her duty. It still felt real. It still felt necessary. If she declared the distinction void, the chamber collapsed. The lottery would run on raw power, not reasoned arbitration. Elara would be erased not by a bias check, but by brute force.

  The distinction was false, she saw. But it was indispensable.

  Voss reached out and cleared the screen. The wave form vanished, replaced by the standard待机 logo. She picked up her stylus. She had to file the report. She had to classify Elara's objection as bias. She had to uphold the audit.

  Her hand hovered over the digital pad. She could feel the phantom vibration of the haptic table beneath her fingers, a ghost of the signal that said she was no different than the woman who had just walked out.

  She pressed the stylus to the surface. The sound was sharp, like a bone snapping. She began to write, enforcing the line she now knew was an illusion, because without it, there was nothing left but the dark.
