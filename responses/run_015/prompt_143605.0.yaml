answer: |-
  seminar prep notes — mary's room decision tree
  dont hand this out yet, just for my head. need to make sure the students dont get stuck on definitions. questions need to be plain english.

  **THE TREE**

  **1. When Mary steps out and sees red, does she learn a genuinely new fact?**
  *   **NO** → Go to 2.
  *   **YES** → Go to 3.

  **2. (If No) What did she actually gain?**
  *   Is it a skill, like knowing how to ride a bike or recognize a face without being able to explain it?
      *   **YES** → **The Ability Hypothesis.** (She knows *how*, not *that*. Physicalism safe.)
      *   **NO** → **Representationalist Denial.** (She doesn't learn a fact about "qualia" because qualia aren't real properties, just representational content. The "redness" is just the brain tracking a wavelength.)

  **3. (If Yes) Is the gap between her room-knowledge and real-knowledge about the world itself (metaphysical) or just about her access to it (epistemic)?**
  *   **METAPHYSICAL** (The world has stuff in it science missed.) → Go to 4.
  *   **EPISTEMIC** (The world is the same, her brain just got a new file folder.) → Go to 5.

  **4. (If Metaphysical) Can physicalism survive this?**
  *   **NO** → **Jackson's Original View.** (Physicalism is false. There are non-physical facts. Case closed.)
  *   **YES** → *Dead End.* (If the gap is metaphysical, physicalism is usually dead. Don't let students linger here.)

  **5. (If Epistemic) Are qualia intrinsic properties of the experience or relational ones?**
  *   **INTRINSIC** (The experience itself has a unique physical signature she now conceptualizes.) → **Phenomenal Concept Strategy (PCS).** (Same physical fact, new conceptual mode of grasp.)
  *   **RELATIONAL** (The experience is just a relationship between her and the object.) → Go to 6.

  **6. (If Relational) Is the knowledge about the representation or the acquaintance?**
  *   **REPRESENTATION** → **Representationalist (Relational version).**
  *   **ACQUAINTANCE** ("This is what it's like.") → **Unnamed Indexical Spot.** (She learns "this" refers to *that* brain state. No new ontology, just indexical grip.)

  ***

  **PROBLEM ZONES (Where the tree breaks)**

  **The PCS vs. Ability Blur:**
  Look at the leaves for **Ability Hypothesis** and **Phenomenal Concept Strategy**. My tree separates them at Node 1 (Fact vs. No Fact), but in practice, students wont be able to tell them apart.
  *   *Why:* If I learn a concept (PCS), I can usually do something new with it (Ability). If I learn an ability, it feels like I know something new (Fact).
  *   *Diagnosis:* This isn't incoherence, it's **unexplored territory**. We treat "knowing-how" and "knowing-that" like oil and water, but phenomenal knowledge might be a emulsion. The tree forces a binary that reality might not respect. If a student argues "it's both," the tree crashes.

  **The Indexical vs. PCS Blur:**
  The **Unnamed Indexical Spot** and **PCS** are also dangerously close. Both say "same ontology, new grasp." PCS says new concept, Indexical says new pointer. But isn't a phenomenal concept just a fancy indexical?
  *   *Diagnosis:* **Unattractiveness.** Distinguishing them feels like splitting hairs to save physicalism. It makes the defense look ad hoc.

  ***

  **MY STANCE (For the seminar close)**

  I'm going with the **Phenomenal Concept Strategy (PCS)**. Here's why, and dont let them talk you out of it.

  Jackson wants us to believe that because Mary feels surprised, the universe must be magical. That's a leap. The Physicalist denial (Representationalism) feels like gaslighting—telling students "red doesn't feel like anything special" when obviously it does. The Ability Hypothesis is too weak; Mary doesnt just learn to *say* "red," she learns *what red is*.

  PCS is the only one that respects the intuition (yes, she learns something real) without blowing up the ontology (no, it doesnt prove ghosts). It admits our brains have two modes of operation: the scientific third-person scan and the first-person immersion. They map to the same physical territory, but the file formats are incompatible.

  **Defense against the "Blur" critique:**
  Yeah, PCS bleeds into Ability. So what? Human cognition is messy. Just because we can't draw a perfect line between "concept" and "skill" in the heat of experience doesnt mean the physicalist story fails. It just means the mind isnt a clean database. PCS holds up because it's the only view that lets us keep science *and* keep the feeling of what it's like to be alive. Jackson asks us to dump physicalism because of a intuition pump. PCS asks us to upgrade our understanding of concepts. I'll take the upgrade.

  *note to self: make sure to hammer the "file format" analogy in class. students get stuck on the word "concept" thinking it means language. need to emphasize its pre-linguistic.*
