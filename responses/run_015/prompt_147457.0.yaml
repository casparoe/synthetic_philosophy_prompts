      *   *Supervaluationist Stance:* There is *no* fact of the matter for borderline cases. The binary log is a *stipulation*, not a discovery. This encourages owning the decision as a policy choice rather than a truth-claim. It shifts focus from "getting it right" to "managing risk."
      *   *Decision Theory:* Both converge on "maximize expected utility" *given* the constraints. However, the *interpretation* of the error changes.
          *   Epistemicist: False Positive/Negative relative to Truth.
          *   Supervaluationist: Policy violation relative to Stipulation.
      *   *Reviewer Disagreement:*
