      *   *Nuance on Rawls:* Rawls actually softened his view in "The Idea of Public Reason Revisited" to allow religious reasons in public political discussion provided they are eventually translated. I need to make sure I don't caricature Rawls.
      *   *Nuance on Courts:* Courts don't always strike down laws based on religious motivation alone (see *McCreary County* vs. *Van Orden*). It's about the *effect* and *purpose*.

  7.  **Final Polish:** Ensure the distinction between *legitimacy* (why the state has power) and *justification* (why this specific law is good) is clear. Ensure the distinction between *coercion* (law) and *persuasion* (politics) is clear.

