answer: |-
  Here is the straight talk you asked for: **You are imposing a level of philosophical coherence on a system that is actually a historical accretion of conflicting compromises.**

  There is no single implicit theory binding legislatures, courts, grant agencies, and schools into one consistent bundle. What you are observing is not a designed architecture of public reason, but a *modus vivendi*—a pragmatic truce between competing visions of legitimacy that has evolved over decades (primarily in the U.S. context, though with echoes elsewhere).

  If you try to force this bundle into a single Rawlsian box, it bursts. If you try to call it a "quarantine" model, it leaks. Here is the breakdown of why your framing is slightly off, what is actually happening, and what would break if you standardized it.

  ### 1. The Framing Error: Institutions Have Different Jobs
  You are treating four distinct institutions as if they are all trying to solve the same problem (legitimacy through public reason). They aren't.

  *   **Legislatures (Expression & Representation):** Their job is to reflect the constituency. If a constituency is religious, their representatives *must* be able to speak that language to be legitimate representatives. Banning religious rhetoric here would disenfranchise religious voters. The implicit theory here is **Representative Legitimacy**, not Public Reason.
  *   **Courts (Coercion & Justification):** Their job is to bind everyone, including dissenters, to state power. Because the state holds a monopoly on violence/coercion, the justification must be accessible to all subjects. The implicit theory here is **Liberal Neutrality** (closest to Rawls).
  *   **Grant Agencies (Pragmatism & Service):** Their job is service delivery. If a faith-based org can feed the poor cheaper than the state, the state uses them. The implicit theory here is **Effectiveness**, bounded by non-discrimination rules.
  *   **Schools (Formation):** Their job is to create future citizens. They teach "civic reasoning" as a *skill*, not necessarily as a constraint on current belief. The implicit theory here is **Civic Preparation**.

  **The Verdict:** You are looking for a unified field theory where there is only institutional division of labor. The "tension" you see is actually a feature, not a bug. It allows religious citizens to feel heard (legislature) while ensuring non-religious citizens aren't coerced by theology (courts).

  ### 2. Is it Rawls? Is it Quarantine?
  It is neither strictly Rawls nor a strict quarantine.

  *   **Why it's not strict Rawls:** Rawls's "Idea of Public Reason" (especially in his later work) allows religious reasons in the "public political forum" (including legislative debate) *provided* that in due course, proper political reasons are presented (the **Proviso**). In practice, legislators rarely offer the secular translation. They cite scripture, vote, and move on. Courts rarely strike down a law *solely* because a legislator cited scripture, unless the law's *effect* is purely religious. So, practice is much looser than Rawls.
  *   **Why it's not Quarantine:** If religious reasons were truly incommensurable and needed quarantining, faith-based organizations wouldn't get grants, and legislators would be gavelled out of order for quoting Isaiah. The system acknowledges that religious motivations are often the *engine* of public good (welfare, civil rights), even if they can't be the *legal foundation* for coercion.

  **The Actual Implicit Theory:** It is a **"Translation Norm" without Enforcement.**
  The system operates on the hope that religiously motivated laws will *coincidentally* have secular benefits that can be articulated if challenged. It relies on the courts to clean up the mess if the translation fails. It presupposes that **motivation can be religious, but justification must be secular.**

  ### 3. What If We Applied the School Standard Everywhere?
  You asked: *If we applied the school-curriculum standard (bracket deepest convictions, argue from shared premises) to parliamentary debate and grant conditions, what'd have to change?*

  If you enforced the "civic reasoning" module rules on the other institutions, the system would collapse or radically transform:

  *   **Parliamentary Debate:** You would lose the moral vocabulary of many movements. The Civil Rights Movement, for example, was deeply theological. If MLK had been forced to bracket his religious convictions and argue solely from "shared secular premises" in the legislature, the moral force of the argument might have been neutered.
      *   *Change:* Legislation would become more technocratic and less moralistic. It might reduce polarization, but it would also reduce the intensity of civic engagement.
  *   **Grant Conditions:** This is where it breaks completely. Faith-based organizations (FBOs) often argue that their religious identity is *essential* to their service model (e.g., a Catholic charity hiring only Catholics to maintain mission integrity).
      *   *Change:* If they had to bracket their religious premises to get funding, they would become secular NGOs in all but name. The "faith-based" initiative would vanish. You would lose the capacity of religious communities to self-organize for public good, shifting the burden entirely to the state.

  ### 4. Respect-as-Noncoercion vs. Respect-as-Acknowledgment
  You asked if the practice fits both views. **Yes, but uneasily.**

  *   **Courts** operate on **Respect-as-Noncoercion**: "I respect you enough not to force you to live by my Bible."
  *   **Legislatures** operate on **Respect-as-Acknowledgment**: "I respect you enough to listen to your deepest reasons for caring about this issue."

  The friction arises because these two forms of respect contradict. Acknowledging someone's religious reason often feels like endorsing it (violating Noncoercion/Neutrality). Ignoring their religious reason feels like silencing them (violating Acknowledgment).

  The current "bundle" tries to have it both ways by separating the venues. It says: "Say it in the debate (Acknowledgment), but don't write it into the statute's justification (Noncoercion)."

  ### 5. The "Confused Framing" Check
  You asked me to tell you straight up if you are confused about the framing.

  **Yes, you are.** But it's a sophisticated confusion.

  You are assuming that "Liberal Democracy" is a philosophical system that seeks consistency. It isn't. It is a political technology designed to manage conflict. It prioritizes **peace over truth**.

  The inconsistency you see—legislators praying, courts secularizing, schools bracketing—is the mechanism by which the system avoids civil war. It allows religious citizens to believe the state is friendly to them (because legislators speak their language) while allowing secular citizens to believe the state is neutral (because courts strike down theocratic laws).

  If you forced consistency:
  1.  **Strict Secularism (French *Laïcité*):** Legislators can't cite scripture; schools can't have religious symbols; grants go only to secular orgs. (High consistency, high alienation of religious groups).
  2.  **Strict Accommodation:** Courts allow religious justifications; grants have no secular accounting. (High consistency, high alienation of minority/non-religious groups).

  The "American-style" bundle you described is the messy middle. It is philosophically underdetermined because **it doesn't want to be determined.** It wants to remain ambiguous enough to keep everyone inside the tent.

  ### Summary
  The implicit theory is **Institutional Pluralism**, not Public Reason.
  *   **Legislatures** are for **Passion** (including religious passion).
  *   **Courts** are for **Principle** (secular justification).
  *   **Agencies** are for **Pragmatism** (what works).
  *   **Schools** are for **Preparation** (learning the code).

  If you apply the school code to the legislature, you sterilize democracy. If you apply the legislature's freedom to the courts, you legalize theocracy. The "contradiction" is the load-bearing wall of the system. Don't try to resolve it; study how it manages the tension.
