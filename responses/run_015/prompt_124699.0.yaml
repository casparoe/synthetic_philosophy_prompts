prompt: |-
  ok so i'm trying to figure out what a bunch of liberal democracies actually think they're doing. legislators routinely cite scripture or religious conscience on the floor—think bioethics or welfare bills—while constitutional courts in the same countries strike down coercive laws that can't be justified without relying on a specific comprehensive doctrine. at the same time, those states fund faith-based social services through competitive grants that require secular accounting but still allow religious hiring, and public schools run 'civic reasoning' modules that teach students to bracket thier deepest convictions and argue only from shared premises. what implicit theory of public reason and democratic legitmacy does that whole bundle presupose? is it rawls's split between the public political forum and the background culture, or something stronger—like religious reasons are literally incommensurable with secular ones and need quarantining? does the practice actually need one consistent view, or is it philosophically underdetermined—maybe fitting both a respect-as-noncoercion view and a respect-as-acknowledgment view? and if we actually applied the school-curriculum standard to parliamentary debate and grant conditions, what'd have to change? also, if i'm just confused about framing—like maybe courts, schools, and grants aren't one practice with one implicit theory at all—tell me straight up, don't just play along to be nice.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Observation:** The user notices a tension in liberal democracies:
