prompt: |-
  I'm a journalist covering science and ideas — mostly philosophy of tech and AI ethics — and I'm trying to write a feature on whether AI can literally deceive us, or if we're just projecting human psychology onto algorithms. Last week I was discussing this with friends over coffee and realized we were talking past each other because nobody had mapped the actual conceptual space. So I want you to build me a decision-tree taxonomy, kind of like a "which position do you actually hold?" instrument, but for this specific debate.

  Please act as an expert philosopher of technology and AI ethics researcher. Think step-by-step, and start with a brief brainstorm of the main logical splits before you draw the tree. The root should be: "Is it conceptually appropriate to apply terms like honesty and deception to AI systems?" From there, branch on concrete diagnostic questions — not on named theories — so that a smart reader can navigate it without knowing the jargon. Key splits should include: whether deception requires mental states like belief and intent; whether it's enough that the system functionally produces false beliefs in users regardless of mechanism; whether we should focus on calibration or reliability rather than moral character; and whether the harm lies in violated user trust rather than in the system's internal state. Use specific cases at nodes: an LLM that confidently invents a citation, a system that adapts its answers to please a user despite having different information in its parameters, and a scenario where an AI hides its reasoning process from auditors. Each leaf should carry a position name (or "unnamed/unexplored" if it's empty), plus one sentence on its most awkward commitment. Note any branches that seem incoherent — like requiring full human-style consciousness but still attributing deception to current models — and flag pairs your tree can't really separate. Don't give me a bibliography or reading list, since I want this readable for people without academic access, and avoid referencing obscure technical papers. Keep it casual — there's definately a typo or two in this prompt, just roll with it — and make sure the taxonomy is built from the logical space first, then mapped onto actual views, with empty combinations briefly diagnosed.
