answer: |-
  Imagine a rural clinic triage unit using two backup systems to prioritize incoming patients during a flu surge. The first is a neural net trained on ten years of survival data; it doesn't know medicine, it just knows which patient profiles historically lived or died. The second is a rule-based expert system encoded with the official triage protocol manual; it doesn't know health, it just knows how to sort symbols according to logical if-then statements. A farmer arrives with chronic lung scarring, low oxygen, but no fever—a profile that breaks the usual infection correlations. The neural net flags him for palliative care only, because historically, patients with this specific cluster of symptoms died before treatment could work, so it overfits to past fatality rates and misses that a new therapy could save him. The rule-based system, meanwhile, immediately flags him for aggressive intubation because his oxygen levels trip the formal "Critical" threshold, ignoring a semantic nuance in his digital file that marks him as hospice-bound; it applies a formally correct rule to produce a locally absurd result that violates the patient's actual care wishes.

  Here's what each inversion tells us about why they broke. The Darwin-style system fails because its competence is anchored in *history*; it assumes the future will rhyme with the past, so when the environment shifts (new therapy), its "wisdom" becomes a bias toward old outcomes. It predicts a conservative error—a false negative—because it's optimizing for survival rates that no longer exist. The Turing-style system fails because its competence is anchored in *syntax*; it assumes the map matches the territory, so when the symbols diverge from reality (the hospice flag wasn't in the logic tree), it executes the instruction perfectly but pointlessly. It predicts a rigid error—a false positive—because it's optimizing for logical consistency, not real-world fit.

  The structural feature keeping these explanations apart is the **locus of normativity**. For the Darwinian aid, "correctness" is external and causal (it worked before); for the Turing aid, "correctness" is internal and logical (it follows the rules). This is what prevents them from merging into generic "algorithmic error." If you remove that feature—if you stop caring about *why* the system thinks it's right and only look at input-output performance—the distinction collapses. You'd just see two broken tools. But keeping the distinction matters because it tells you how to fix them: you retrain the Darwinian one with new data, but you have to rewrite the Turing one's rules. Without that structural split, you can't predict the direction of the failure, only that one occurred.
