  The coffee shop table was covered in printouts of Measure 7's election returns and the subsequent housing data. Dev tapped the 52-48 result hard enough to crease the paper.

  "It passed, Marisol. That's the job of democracy. You count the votes, you enact the law."

  "It passed with thirty-four percent turnout," Marisol said, sliding a different sheet across the table. "In an off-year. And look at the spending. Developers outspent tenants ten to one. That wasn't the people speaking; that was a purchase order."

  "So you invalidate it? That's the sore loser problem," Dev said. "You're saying if I don't like the score, we play again until I do. That destroys finality. People bought properties based on Measure 7 passing. Investors broke ground. You freeze that for two years because the losers are unhappy?"

  "Not freeze. Review," Marisol corrected. "Under the Two-Winter Rule, Measure 7 passes immediately because it's over fifty percent, but it's provisional. If it's under sixty, it triggers the second vote. In between, the lottery assembly meets. They don't write opinions. They write receipts. Did rents slip? Yes. Did construction land in only three suburbs? Yes. Did repealing the rent-cap cost us federal housing money? Yes. That goes on one neutral page. No framing, no adjectives. Just data."

  "Who writes the page?" Dev leaned in. "You say neutral, but whoever summarizes the data controls the framing. If the assembly says 'federal money lost' without explaining why the trade-off was worth it, you've rigged the second vote. You're giving a panel of one hundred and fifty people veto power over the majority."

  "The panel doesn't recommend," Marisol said. "They audit. And it's not a veto, it's a reality check. The second vote isn't a redo; it's ratification of the actual policy versus the promised policy. Measure 7 promised density and affordability. It delivered density in three suburbs and lost affordability funding. The voters deserve to know that before locking it in forever."

  "But what about the intensity problem?" Dev pushed. "Say fifty-two percent barely care, but the forty-nine percent get their lives wrecked. Under your system, the forty-nine percent just have to wait two years to vote again. Under my system, the majority rules, period. You can't measure intensity. If you try, you're giving a minority veto. Look at the bundling issue too—Measure 7 had the density clause glued to the rent-cap repeal. Maybe people wanted the apartments but didn't see the repeal buried in section four. You're saying we need a supermajority to untangle that? That means nothing gets done."

  "Nothing getting done is better than bad law getting stuck," Marisol said. "But look, I'll concede the bottleneck risk. If the lottery assembly takes too long, it kills the remedy. If Measure 7 actually fixed housing, delaying it hurts everyone. I'd adjust: if the assembly can't publish the data page within six months, the first vote stands final. No infinite delays."

  Dev paused, stirring his coffee. He looked at the spending breakdown again. "Okay. But here's where my model breaks. If one side spends ten times more than the other, the 'majority' isn't informed, it's bought. I can't just say 'they should've showed up.' If money drowns the signal, the first vote is noise. I'd concede that. I'd accept strict spending caps on initiatives, even if it limits speech. Without that, the pure majority is a illusion."

  "So you admit the first vote was illegitimate," Marisol said.

  "I admit it was noisy," Dev corrected. "But your fix creates a new elite. That assembly of one hundred and fifty residents? They become the interpreters of reality. Even with no recommendations, selecting which data points make the one-page summary is power. And the sunset clause? Eight years? You want housing policy to expire every decade? Investors won't build if the rules vanish in eight years."

  "They reaffirm if it works," Marisol said. "Measure 7 cost us federal money because the rent-cap repeal violated state compliance rules. That was a mistake. If we have to vote again in eight years, we catch those errors. We don't live with them forever."

  "But the three suburbs that got the construction?" Dev asked. "They benefited. Now you ask them to vote again to keep the benefits? That's not deliberation, that's holding benefits hostage."

  "It's consent," Marisol said. "Direct democracy assumes the people know what they're voting on. Measure 7 proved they didn't. Tenant groups sat out because they didn't understand the trap. The Two-Winter Rule forces the conversation into the light."

  "Yet you're relying on that assembly to turn on the light," Dev said. "If they miss a nuance, you've institutionalized bias. I'd rather risk a bad law that can be repealed later than a system where nothing is ever final."

  "Repeal is hard," Marisol said. "Legislatures ignore us. That's why we use initiatives. But if the initiative process is just a weapon for the highest bidder to lock in bad policy forever, we're worse off."

  Dev sighed, stacking the papers. "So we agree the money skewed it. We agree the data matters. You just think we need a pause button. I think the pause button becomes a stop sign."

  "And I think the stop sign prevents crashes," Marisol said.

  Dev looked at the Measure 7 results one last time, then at the federal funding loss report. "If the assembly page had been ready before the funding vanished, maybe we keep the money."

  "Exactly," Marisol said.

  Dev nodded slowly. "Okay. But if you cut the assembly review to six months, I'm in."

  "Done," Marisol said.

  Verdict: Marisol
