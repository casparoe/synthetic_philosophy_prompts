  # Diagnostic Decision Tree: Conceptions of Liberty

  ## Introduction
  This tool is designed to sort intuitions about concrete political cases into distinct theoretical conceptions of liberty. It does not ask for labels (e.g., "Republican," "Liberal") or presuppose a taxonomy. Instead, it maps the logical space of freedom by isolating six axes of disagreement through specific case judgments. Follow the path dictated by your answers to locate your position.

  ## The Six Diagnostic Nodes
  *Answer each question based on your intuition about the case described. Do not worry about where the answer leads.*

  **Q1. The Prisoner (Agent vs. Structure)**
  Consider two prisoners. Prisoner A is held by a guard who possesses the key but sleeps all day. Prisoner B is held by a jammed lock that no one can open.
  *   **Question:** Is Prisoner A unfree in a relevantly different way than Prisoner B?
  *   **[Yes]** (Unfreedom requires an agent) → Go to Q2.
  *   **[No]** (Unfreedom can be structural) → Go to Q5.

  **Q2. The Master & The Scheduler (Exercised vs. Standing Power)**
  Consider a slave with a reliably benevolent master who never interferes, and a worker with an adaptive AI scheduler that quietly rearranges the environment so the worker never attempts anything that would have been blocked.
  *   **Question:** Does the mere presence of this unexercised or pre-emptive power reduce their freedom, even if they never feel blocked?
  *   **[Yes]** (Standing power reduces freedom) → Go to Q3.
  *   **[No]** (Only actual interference counts) → Go to Q4.

  **Q3. The Official (Arbitrariness: Accountability vs. Tracking)**
  Consider a citizen subject to an official who may override their choices, but only on conditions the citizen helped write and can appeal.
  *   **Question:** Does this official reduce the citizen's freedom?
  *   **[Yes]** (Power is unfreedom regardless of control) → **Leaf 1**.
  *   **[No]** (Non-arbitrary power is compatible with freedom) → **Leaf 2**.

  **Q4. The Endorsed Law (Legitimacy vs. Closure)**
  Consider a law you fully endorse, which tracks your own reasons but closes off options you would otherwise have.
  *   **Question:** Does this law reduce your freedom?
  *   **[Yes]** (Any closure reduces freedom) → **Leaf 3**.
  *   **[No]** (Legitimate authority does not reduce freedom) → **Leaf 4**.

  **Q5. The Addict (Internal vs. External Obstacles)**
  Consider an addict who wants to stop using drugs and cannot, with no external obstacle preventing them from quitting.
  *   **Question:** Is this person unfree?
  *   **[Yes]** (Internal constraints reduce freedom) → Go to Q6.
  *   **[No]** (Only external constraints reduce freedom) → **Leaf 5**.

  **Q6. The Real Self (Procedure vs. Substance)**
  Return to the addict. Why are they unfree?
  *   **Question:** Are they unfree because they violate their own procedural will (e.g., second-order desires), or because they fail to pursue the objectively good life?
  *   **[Procedure]** (Freedom is autonomy of will) → **Leaf 6**.
  *   **[Substance]** (Freedom is alignment with the Good) → **Leaf 7**.

  *(Note: A logical eighth combination exists—Structural Unfreedom at the Option Level—but is diagnosed below as Leaf 8.)*

  ---

  ## The Live Positions (Leaves)

  **Leaf 1: Non-Domination as Unaccountability**
  *   **Path:** Q1(Yes) → Q2(Yes) → Q3(Yes).
  *   **View:** Freedom is the absence of a master's standing power. Even if the master is controlled or accountable, the mere capacity to interfere constitutes unfreedom.
  *   **Representative:** Quentin Skinner (Neo-Roman).

  **Leaf 2: Non-Domination as Interest-Tracking**
  *   **Path:** Q1(Yes) → Q2(Yes) → Q3(No).
  *   **View:** Freedom is the absence of arbitrary power. Power that tracks your interests or is subject to your control does not reduce freedom.
  *   **Representative:** Philip Pettit (Neo-Republican).

  **Leaf 3: Non-Moralized Negative Liberty**
  *   **Path:** Q1(Yes) → Q2(No) → Q4(Yes).
  *   **View:** Freedom is the absence of interference by others. Legitimacy or endorsement is irrelevant; if an option is closed by an agent, freedom is reduced.
  *   **Representative:** Thomas Hobbes, Jeremy Bentham.

  **Leaf 4: Moralized Negative Liberty**
  *   **Path:** Q1(Yes) → Q2(No) → Q4(No).
  *   **View:** Freedom is the absence of *illegitimate* interference. Interference that respects rights or is democratically authorized does not count as a reduction of freedom.
  *   **Representative:** Robert Nozick, Hillel Steiner.

  **Leaf 5: Freedom as Social Status (Structural)**
  *   **Path:** Q1(No) → Q5(No).
  *   **View:** Unfreedom is produced by structural conditions (poverty, class), not specific agents. However, internal psychological states do not constitute unfreedom. Freedom is a material status rather than an option set.
  *   **Representative:** G.A. Cohen, Karl Marx (specific readings).

  **Leaf 6: Procedural Self-Mastery (Autonomy)**
  *   **Path:** Q1(No) → Q5(Yes) → Q6(Procedure).
  *   **View:** Unfreedom can be internal. Freedom is acting in accordance with one's higher-order volitions or authentic self, regardless of the moral content of those desires.
  *   **Representative:** Harry Frankfurt, Isaiah Berlin (Positive Liberty weak).

  **Leaf 7: Perfectionist Self-Mastery**
  *   **Path:** Q1(No) → Q5(Yes) → Q6(Substance).
  *   **View:** Unfreedom is failing to realize one's true nature or the Good. An addict is unfree not just because of conflicting desires, but because they are enslaved by base impulses.
  *   **Representative:** Jean-Jacques Rousseau, T.H. Green.

  **Leaf 8: [EMPTY] Structural Option-Freedom**
  *   **Path:** Q1(No) → Q5(No) → [Hypothetical Q: Is freedom about options or status? → Options].
  *   **Diagnosis:** **Unattractive/Incoherent.** This position claims structure causes unfreedom (Q1-No) but that freedom is merely a count of specific options (Q5-No implies internal doesn't matter, but Structural usually implies Status). If structure is the cause, the effect is usually a degradation of status, not just a missing option. This combination is theoretically unstable and unoccupied.

  ---

  ## Diagnostic Notes & Collapses

  ### 1. The Empty Combination (Leaf 8)
  As noted above, the combination of *Structural Causation* with *Option-Level Freedom* is empty. Most structuralists argue that poverty or class domination reduces freedom by altering one's *status* or *power*, not merely by removing discrete options (which is the Negative Liberty view). To hold that "no agent is required" but "freedom is just a count of open doors" is to mix a sociological ontology with a liberal metric, which most theorists find incoherent.

  ### 2. Indistinguishable Leaves: The Scheduler vs. The Master
  **The Tie:** In Q2, this tree bundles the **Benevolent Master** and the **Anticipatory Scheduler**. It assumes that if you think the Master's standing power reduces freedom, you also think the Scheduler's pre-emptive power reduces freedom.
  **The Fault:** This is a potential fault in the questions. A theorist might argue that the Master represents *domination* (human will), while the Scheduler represents *nudging* or *architecture*. One might accept the Scheduler (as efficiency) while rejecting the Master (as tyranny), even if both operate via standing power.
  **The Separating Case:** To separate these, ask: *"If the AI scheduler rearranges your environment to prevent failure, but you know it is doing so and consented to the algorithm, is your freedom reduced?"*
  *   If **Yes**, you treat Scheduler like Master (Leaf 1 or 2).
  *   If **No**, you distinguish human domination from algorithmic guidance (Moves toward Leaf 4 or 6).

  ### 3. Moralized Negative vs. Non-Domination (Interest-Tracking)
  **The Tie:** Leaf 2 (Pettit) and Leaf 4 (Moralized Negative) often yield similar policy prescriptions (e.g., endorsing democratic law).
  **The Distinction:** They are separated by Q2 (Standing Power).
  *   Leaf 4 says a benevolent master does *not* reduce freedom (only interference does).
  *   Leaf 2 says a benevolent master *does* reduce freedom (power exists).
  The tree separates them cleanly at Q2.

  ---

  ## Scoring Key (Non-Linear Lookup)
  *If you answered the cases in a different order, find your pattern below to locate your Leaf.*

  | Pattern Code | Q1 (Prisoner) | Q2 (Master) | Q3 (Official) | Q4 (Law) | Q5 (Addict) | Q6 (Self) | **Result** |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :--- |
  | **A** | Yes | Yes | Yes | — | — | — | **Leaf 1** (ND Unaccountability) |
  | **B** | Yes | Yes | No | — | — | — | **Leaf 2** (ND Interest-Tracking) |
  | **C** | Yes | No | — | Yes | — | — | **Leaf 3** (Non-Moralized Negative) |
  | **D** | Yes | No | — | No | — | — | **Leaf 4** (Moralized Negative) |
  | **E** | No | — | — | — | No | — | **Leaf 5** (Structural Status) |
  | **F** | No | — | — | — | Yes | Procedure | **Leaf 6** (Procedural Autonomy) |
  | **G** | No | — | — | — | Yes | Substance | **Leaf 7** (Perfectionist Autonomy) |

  *(Note: "—" indicates the question was not triggered by your previous answers.)*
