answer: |-
  **Session Plan: Path Dependence in History of Science**

  **1. Conceptual Dependency Order**
  Do not start with "lock-in." It implies a door closing, but students need to know there was a hallway first. Teach concepts in this strict sequence:
  1.  **Contingency at the Critical Juncture:** Establish that at point *A*, multiple outcomes were scientifically viable. If they believe the outcome was necessitated by nature, path dependence is impossible.
  2.  **Increasing Returns to Adoption:** Explain that the value of a choice increases as more people adopt it (network effects, coordination costs). This is the engine; without it, history is just a random walk.
  3.  **Lock-in:** Now define this as the state where switching costs exceed the benefit of a superior alternative.

  **2. The Carrying Example: The 1884 Greenwich Meridian**
  **The Frame:** Treat the International Meridian Conference not as the *cause* of the standard, but as the *ratification* of an existing lock-in.
  **What it must show:**
  *   **Pre-existing Dominance:** Highlight that 72% of global shipping tonnage already used Greenwich charts *before* the vote. The "network" was already saturated.
  *   **Institutional Inertia:** Show that France abstained not because Greenwich was scientifically superior (Paris was equally precise), but because the cost of re-charting French naval and rail systems was prohibitive.
  *   **The Mechanism:** The lock-in was driven by the coordination cost of maps and timetables, not the accuracy of the astronomy.

  **What it must avoid:**
  *   **Technical Determinism:** Do not let students argue Greenwich was "better." It was arbitrary.
  *   **The "Vote" Fallacy:** Do not let them conflate the diplomatic vote with the lock-in mechanism. The vote didn't create the path; the commercial usage did. The vote merely acknowledged the trap was already sprung.

  **3. The Misconception Arc & Interventions**
  Students will naturally drift into three errors. Head them off at these specific moments:

  *   **Misconception 1: Determinism ("Greenwich was inevitable.")**
      *   *When it forms:* During the setup, before you reveal the chart statistics.
      *   *Intervention:* **Pre-emptive strike.** Before detailing the conference, ask: "Was there any astronomical reason Greenwich was more accurate than Paris?" Force them to admit the science was neutral. If they don't accept contingency here, stop and reset.
  *   **Misconception 2: Radical Contingency ("Anything could have happened.")**
      *   *When it forms:* Immediately after you reveal the science was neutral. They will assume the outcome was purely random.
      *   *Intervention:* **During the mechanism.** When explaining the 72% shipping statistic, emphasize that *after* that threshold, the outcome was no longer random. The path had hardened. Randomness exists at the juncture, not during the cascade.
  *   **Misconception 3: Meritocracy ("A better standard would eventually win.")**
      *   *When it forms:* At the conclusion, when discussing why we still use Greenwich today.
      *   *Intervention:* **The wrap-up.** Explicitly state: "Efficiency does not guarantee adoption." Ask them to calculate the cost of changing every train schedule and map globally versus the benefit of a slightly 'cleaner' meridian. Show that 'better' loses to 'established.'

  **4. What to Refuse to Explain**
  Be explicit about the boundaries of this session. Say this verbatim:
  *"We are not modeling the mathematics of non-ergodic stochastic processes, and we are not playing counterfactual 'what-if' history games. We are analyzing the mechanism of institutional inertia, not proving what would have happened if the British Empire didn't exist."*
  Do not entertain debates on whether Paris *would* have been better. That requires a different methodology.

  **5. The Check Question**
  Do not ask them to define path dependence. Ask them to apply the mechanism to a variation of the example.

  *"If the 1884 conference had voted unanimously for Paris, but the British Admiralty had refused to update their nautical charts, which meridian would have dominated global commerce by 1900, and why?"*

  **Correct Answer Logic:** They must identify that Greenwich would still dominate because the lock-in resided in the *charts and usage* (increasing returns), not the *vote* (formal institution). If they say "Paris would win because of the vote," they missed the concept.
