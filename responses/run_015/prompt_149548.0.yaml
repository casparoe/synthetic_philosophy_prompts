answer: |-
  ### Brainstorming: Rigidity, Essence, and the Necessary A Posteriori

  Before addressing your specific cases, let us delineate the conceptual landscape. The tension you identify arises from conflating three distinct layers of modal semantics.

  1.  **Reference-Fixing vs. Essentialist Discovery:**
      *   **Reference-Fixing (The Epistemic Entry):** How we latch onto a kind in the actual world. For "water," this might be "the clear, drinkable liquid in the lakes." For "pain," it might be "the feeling associated with injury." This is often descriptive and contingent.
      *   **Rigidity (The Modal Hook):** Once reference is fixed, the term designates that *very stuff* in all possible worlds. "Water" picks out H2O even in a world where XYZ fills the lakes (because in *our* world, water is H2O).
      *   **Essentialist Discovery (The Metaphysical Payoff):** Empirical investigation reveals the underlying structure (H2O) that explains the surface properties. This converts the contingent reference-fixing description into a necessary identity statement ("Water = H2O").
      *   *The Distinction:* Rigidity is a semantic rule about how terms behave across worlds; essentialism is a metaphysical claim about what constitutes the kind. Kripkean semantics allows rigidity without immediate knowledge of the essence.

  2.  **Scientific vs. Non-Scientific Domains (The Necessary A Posteriori):**
      *   **Scientific (Natural Kinds):** The "Water = H2O" model works because microstructure causally explains macroscopic behavior. The necessity is grounded in the causal powers of the actual world.
      *   **Non-Scientific (Mental/Social Kinds):** Here, the "microstructure" is contested. Is "pain" defined by its causal role (Functionalism) or its physical substrate (Identity Theory)? Is "democracy" defined by procedures, outcomes, or collective intentionality?
      *   *The Invocation:* In science, the necessary a posteriori is a *result* of investigation. In non-scientific domains, it is often invoked as a *constraint* on investigation. Philosophers often import the modal force of natural kinds into normative or functional domains without the causal grounding that justifies that force.

  ***

  ### Diagnosis: The Phenomenon of Proleptic Rigidification

  You have identified a sophisticated category error. There is no single canonical term in the literature that captures this exact maneuver, though it touches on debates in two-dimensional semantics (Chalmers, Jackson) and social ontology (Haslanger, Searle).

  The pattern you describe is not merely "begging the question" or "stipulative definition." It is a specific modal error where the *consequences* of a successful essentialist discovery are applied *prior* to the discovery, treating a hypothetical essence as if it already possesses the modal authority of an actual one.

  I propose we designate this phenomenon **Proleptic Rigidification**.

  #### Definition
  **Proleptic Rigidification** occurs when an interlocutor treats a term as if it possesses a hidden, necessary essence (like a natural kind) for the purpose of ruling out counterfactual cases, despite the fact that:
  1.  The essence has not been empirically established.
  2.  The domain (mental or social) does not obviously support the kind of microstructural essentialism required to generate that necessity.
  3.  The modal exclusion (the "no essence, no presence" logic) is applied *conditionally* on a theory being true, but functions *unconditionally* in the argument to dismiss alternatives.

  It is "proleptic" because it anticipates a future metaphysical resolution and imports its modal consequences into the present debate. It is "rigidification" because it treats the term as designating a specific underlying nature across all possible worlds, rather than a functional role or cluster of properties.

  ### Carving the Concept: Boundaries and Distinctions

  To precisely carve this phenomenon, we must distinguish it from three nearby argumentative moves.

  #### 1. Versus Legitimate Fallibilism about Reference
  *   **Legitimate Fallibilism:** "We currently identify pain by its functional role, but future neuroscience might reveal it is identical to C-fiber firing. If that turns out to be true, then silicon pain would be impossible."
      *   *Structure:* Conditional. The modal exclusion waits on the empirical verdict.
  *   **Proleptic Rigidification:** "Pain is like water. It must have a physical essence. Therefore, silicon pain is impossible *even while we investigate*, because if it were silicon, it wouldn't be pain."
      *   *Structure:* The modal exclusion is active *now*, based on the *assumption* that the Water model applies.
      *   *The Edge:* The boundary blurs when a speaker says, "We should *presume* the physicalist model." If that presumption is used to dismiss counterexamples rather than guide research, it slides into Proleptic Rigidification.

  #### 2. Versus Preemptive Essentialism (Stipulation)
  *   **Preemptive Essentialism:** "For the purposes of this paper, I define 'democracy' as requiring secret ballots. Therefore, a society without secret ballots is not a democracy."
      *   *Structure:* Openly stipulative. The speaker admits they are fixing the meaning for clarity.
  *   **Proleptic Rigidification:** "Democracy *has* a hidden core (like water). We haven't found it yet, but any society lacking it isn't democracy."
      *   *Structure:* Claimed as discovery, not stipulation. It claims the *world* dictates the exclusion, not the speaker's definition.
      *   *The Edge:* This is the most dangerous confusion. Speakers often mask stipulations as "deep metaphysical insights." If they cannot point to the causal mechanism that makes the essence necessary, it is likely proleptic.

  #### 3. Versus Ordinary Thought Experiments
  *   **Ordinary Thought Experiment:** "Imagine a silicon being that behaves exactly like us. Do we intuitively call that pain? This probes our concept."
      *   *Structure:* Uses intuition to test the reference-fixing criteria.
  *   **Proleptic Rigidification:** "Imagine a silicon being. It lacks the neural essence. Therefore, it is not pain. The thought experiment is invalid because it violates the necessary conditions."
      *   *Structure:* Uses the *logic* of essentialism to invalidate the intuition pump itself. It shuts down the experiment rather than learning from it.
      *   *The Edge:* When a philosopher rejects a Twin-Earth or Zombie scenario not because the intuition is wrong, but because the scenario is "metaphysically impossible" based on an unproven identity theory, they are engaging in Proleptic Rigidification.

  ### Application to Your Cases

  #### Case 1: Pain and Neural States
  *   **The Move:** The speaker treats "pain" as a natural kind term analogous to "water."
  *   **The Error:** This ignores the viability of Functionalism. In the philosophy of mind, "pain" is arguably a functional kind (defined by causal role), not a physical kind (defined by substrate). Water *cannot* be functionally defined (XYZ behaves like water but isn't water). Pain *might* be functionally defined (Silicon behaves like pain and *is* pain).
  *   **The Prolepsis:** By assuming the "Water Model" (Physicalism) is the only valid metaphysical structure *before* refuting Functionalism, the speaker grants Physicalism the modal force of a discovered necessity. They are rigidifying the term "pain" to a neural state *proleptically*, ruling out silicon not because we know pain is neural, but because they assume pain *must* work like water.

  #### Case 2: Democracy and Procedural Cores
  *   **The Move:** The speaker treats "democracy" as having a hidden microstructure (a specific procedure) analogous to atomic number or chemical composition.
  *   **The Error:** Social kinds are typically "amalgamations" (Haslanger) or dependent on collective intentionality (Searle), not hidden causal essences. A society functions as a democracy based on normative recognition, not hidden procedural atoms.
  *   **The Prolepsis:** The speaker projects the modal logic of natural kinds onto a normative kind. They argue that a counterfactual society lacking the "core" is *not* a democracy, even if it functions identically. This imports the "necessary a posteriori" structure into a domain where necessity is usually conceptual or normative, not metaphysical. They are waiting for a "discovery" of a social essence that may not exist, while using the *idea* of that essence to exclude counterexamples now.

  ### The Fuzzy Edges: Where Does It Become Indistinct?

  The concept of Proleptic Rigidification has indistinct edges in two specific areas, which you should note as a journalist covering these debates:

  1.  **Research Programs vs. Metaphysical Claims:**
      Sometimes, assuming an essence is a useful heuristic for science (a "research program" in Lakatos's sense). If a neuroscientist says, "Assume pain is neural to design the experiment," that is methodological. It becomes Proleptic Rigidification only when that methodological assumption is used to make *modal claims* about possibility and necessity in a philosophical argument. The edge is thin when scientists speak philosophically without switching registers.

  2.  **Cluster Concepts vs. Hidden Essences:**
      Some terms (like "gold" or perhaps "tiger") have cluster properties that reliably indicate a hidden essence. If a term is a "cluster concept" (Wittgenstein), there is no single necessary core. However, philosophers often argue that *beneath* the cluster lies a unifier. The boundary is indistinct when it is genuinely unclear whether a unifier exists. Proleptic Rigidification becomes hard to distinguish from "Optimistic Essentialism" when the field is in genuine flux. The tell-tale sign is not the hope for an essence, but the *use* of that hoped-for essence to veto counterfactual intuitions.

  ### Summary for Your Reporting

  The pattern you have spotted is **Proleptic Rigidification**.

  It is the rhetorical and philosophical maneuver of borrowing the **modal force** of scientific essentialism (the "necessary a posteriori") without the **empirical backing** of scientific discovery. It treats terms like "pain" or "democracy" as if they are rigid designators of hidden structures, using that assumption to rule out counterfactual possibilities (silicon minds, alternative democracies) that should remain open until the nature of the kind is actually settled.

  It differs from standard rigidity because it applies the *consequences* of rigidity before the reference is securely fixed by an essence. It differs from stipulation because it claims to describe reality, not language. It is a form of metaphysical overreach that disguises a theoretical preference as a modal constraint.
