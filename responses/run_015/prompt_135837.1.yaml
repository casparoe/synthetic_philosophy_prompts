answer: |-
  Here is the translation of Jaspers' *The Question of German Guilt* into the vocabulary of corporate liability and organizational theory, followed by the residue analysis you requested.

  ### Part I: The Jaspers Taxonomy Translated to Corporate Law

  **1. Criminal Guilt → Direct Corporate Liability & *Mens Rea***
  *   **Jaspers:** Violation of clear, existing laws. Adjudicated in court. Requires individual action.
  *   **Corporate Translation:** This is standard **direct liability**. The corporation (as a legal person) or specific officers violate a statute (FCPA, antitrust, securities fraud). It requires proving *actus reus* and, where applicable, **institutional intent** (aggregating the knowledge of employees to establish corporate *mens rea*).
  *   **Mechanism:** Indictment, fines, deferred prosecution agreements (DPAs).
  *   **Key Distinction:** It is binary. You either broke the rule or you didn't.

  **2. Political Guilt → Vicarious & Successor Liability**
  *   **Jaspers:** Guilt incurred by virtue of citizenship in a state that commits wrongs. Collective responsibility. Paid via reparations or loss of sovereignty.
  *   **Corporate Translation:** This maps to **vicarious liability** (*respondeat superior*) and **successor liability** in M&A. It is liability attached to the *structure* rather than specific intent. If the entity commits a tort, the shareholders (via equity value loss) and the successor entity bear the cost, regardless of whether the current board personally directed the harm.
  *   **Mechanism:** Civil judgments, regulatory fines, debarment, loss of "social license."
  *   **Key Distinction:** It is strict. You pay because you are part of the organization that did it, not necessarily because you personally pulled the lever.

  **3. Moral Guilt → Fiduciary Duty & Compliance Culture**
  *   **Jaspers:** Personal responsibility for one's own actions and omissions. Judged by conscience, peers, or God. Concerns what you *could* have done differently within your sphere of influence.
  *   **Corporate Translation:** This is the realm of **fiduciary duty** (Care and Loyalty) and **internal compliance**. It concerns the Board's oversight obligations (*In re Caremark*). Did the directors establish a monitoring system? Did they ignore red flags? It also covers individual officers who knew of misconduct but stayed silent (whistleblower inaction).
  *   **Mechanism:** Derivative suits, clawbacks, reputational damage, internal termination.
  *   **Key Distinction:** It is subjective and process-oriented. It asks: "Did you exercise reasonable diligence given your position?"

  **4. Metaphysical Guilt → Corporate Purpose & Stakeholder Theory**
  *   **Jaspers:** Guilt arising from human solidarity. Failing to prevent suffering when one had the capacity to do so, even at personal risk. A failure of humanity, not just law or duty.
  *   **Corporate Translation:** This has no strict legal counterpart, but it aligns with the debate over **Corporate Purpose** (Shareholder Primacy vs. Stakeholder Capitalism). It is the liability for harms the corporation *could* have prevented but wasn't legally required to (e.g., supply chain human rights abuses in non-regulated jurisdictions, environmental damage within legal limits).
  *   **Mechanism:** ESG pressure, consumer boycotts, soft-law frameworks (UN Guiding Principles), emerging mandatory human rights due diligence laws (EU CSDDD).
  *   **Key Distinction:** It is extra-legal. It posits a duty to intervene based on capacity and solidarity, not charter or statute.

  ***

  ### Part II: The Residue Report

  Here is the fidelity analysis of the translation.

  | Jaspers Category | Corporate Law Counterpart | Fit Quality | Notes on Distortion |
  | :--- | :--- | :--- | :--- |
  | **Criminal** | Direct Liability / *Mens Rea* | **Clean** | Almost 1:1. The only friction is aggregating intent across a diffuse organization, but the legal concept holds. |
  | **Political** | Vicarious / Successor Liability | **Good** | Fits well as "liability by association." However, Jaspers implies a moral burden of citizenship; corporate law treats this purely as risk allocation and cost internalization. |
  | **Moral** | Fiduciary Duty / *Caremark* | **Twisted** | **Significant friction.** Jaspers' moral guilt is internal/conscience-based. Fiduciary duty is external/process-based. A Board can satisfy *Caremark* (no liability) while still failing morally (ignoring culture). Law cares about process; Jaspers cares about conscience. |
  | **Metaphysical** | Stakeholder Theory / ESG | **Poor / None** | **No legal counterpart.** Corporate law generally rejects duties to non-shareholders (with narrow exceptions). This category exists entirely outside the legal personhood framework. |

  ***

  ### Part III: The Gap Analysis

  **Is the residue real, or is Jaspers stretching language?**

  My analytical view is that the residue is **real**, but it represents a deliberate design feature of corporate law, not an oversight.

  Jaspers was writing about existential catastrophe (the Holocaust). In that context, "Metaphysical Guilt" is necessary because the law was *the tool of the oppressor*. Relying solely on "Criminal Guilt" (did you break the Nuremberg laws?) would have exonerated everyone. He needed a category for "you didn't break the law, but you failed your humanity."

  In corporate law, the inverse is true. The law is the *constraint*, not the tool of oppression.
  1.  **Predictability vs. Solidarity:** Corporate law prioritizes predictability of capital. If "Metaphysical Guilt" (failure to prevent suffering when capable) were codified into liability, the risk premium for doing business would become incalculable. You cannot underwrite insurance against "failure of human solidarity."
  2.  **The Entity Shield:** The corporation is a fiction designed to limit liability. Jaspers' Metaphysical Guilt is infinite; it demands everything you have to save another. Corporate law is finite; it demands you comply with the charter and statutes.

  **Verdict:** Jaspers is not stretching language; he is identifying a moral horizon that corporate law is structurally incapable of seeing. The "gap" is the space between **compliance** (following the rules) and **remediation** (fixing the world). Corporate law governs the former. Jaspers demands the latter.

  However, calling it "guilt" in a legal context is dangerous. If you conflate Metaphysical Guilt with Legal Liability, you risk creating a regime where corporations are punished for not being saints, which destabilizes the economic utility of the corporate form.

  ***

  ### Part IV: Epistemic Humility & Falsification

  Here is where I could be wrong, and what would change my mind.

  **1. The "Soft Law" Hardening Argument**
  *   **My Current Position:** Metaphysical guilt has no legal counterpart.
  *   **What Would Change My Mind:** If mandatory human rights due diligence laws (like the EU's Corporate Sustainability Due Diligence Directive) become global standards. If "failure to prevent supply chain suffering" moves from a reputational risk to a **statutory cause of action** with damages, then Metaphysical Guilt effectively migrates into Criminal/Political Guilt. If the law begins to mandate "solidarity," the gap closes.
  *   **Consideration:** I may be underestimating the speed at which ESG norms harden into fiduciary duties. If Delaware courts rule that ignoring climate risk is a breach of *Caremark* oversight, the "Metaphysical" becomes "Moral/Fiduciary."

  **2. The "Efficient Morality" Argument**
  *   **My Current Position:** The gap is a necessary feature for economic predictability.
  *   **What Would Change My Mind:** If empirical data showed that corporations operating with "Metaphysical" constraints (prioritizing stakeholder solidarity over profit maximization) consistently outperform or out-survive strict profit-maximizers over 50+ year horizons. If the market proves that "solidarity" is actually a better risk management strategy than "compliance," then the gap isn't a moral necessity; it's just an efficiency error in current legal drafting.
  *   **Consideration:** I am assuming a trade-off between profit and solidarity. If that trade-off is illusory in the long term, then the law is simply lagging behind economic reality, not protecting a vital structural boundary.

  **3. The "Institutional Intent" Limit**
  *   **My Current Position:** We can aggregate intent for Criminal Guilt, but not for Metaphysical Guilt.
  *   **What Would Change My Mind:** If legal theory develops a robust framework for **Organizational Conscience**. Currently, we look at Board minutes and compliance logs. If courts begin adjudicating "Corporate Culture" as a standalone element of liability (beyond *Caremark* oversight), effectively putting the "soul" of the corporation on trial, then Jaspers' Moral/Metaphysical categories become justiciable.
  *   **Consideration:** This is the biggest risk to my analysis. If "Culture" becomes a discoverable, litigable asset like "IP," then the distinction between legal liability and moral guilt collapses.

  **Summary:** I am treating Corporate Law as a closed system of rules. If you view Corporate Law as an evolving social technology that absorbs moral norms (as it did with Civil Rights in the 60s), then Jaspers' "Metaphysical Guilt" is just **future liability** waiting to be codified. If that happens, my "Residue Report" is just a snapshot of transitional friction.
