  8.  **Self-Correction during drafting:** I initially thought about saying Berkeley is "wrong." But the prompt asks if his idealism *changes* the economics. It does. It makes money subjective. Chartalism makes money objective (legal obligation). I need to emphasize that Berkeley's view is actually *more* informational, but less *stable*.
