answer: |-
  You don't need three principles. You need one, but you're mislabeling the mechanism in your strongest case (#2).

  Your current rule ("Go outside unless case-specific info that isn't universal") is close, but it treats the Inside/Outside distinction as a battle between **Plan vs. Statistics**. It isn't. It's a battle between **Validity of the Reference Class vs. Validity of the Causal Claim.**

  Here is the unifying principle that clears up 1 through 7, validates your marriage intuition without breaking your logic, and solves the Novel problem.

  ### The Principle: Causal Homogeneity

  **Use the Outside View of the *narrowest causally homogeneous reference class* you can validly construct. Use the Inside View only to determine which class you belong in.**

  The Inside View is not a forecasting tool; it is a *classification* tool. Its only job is to answer: "Am I in the bucket of people who succeed, or the bucket of people who fail?" Once you are in the bucket, the bucket's base rate wins.

  Here is how this principle resolves your specific tensions.

  ---

  ### 1. Resolving the Marriage Paradox (#2)
  **Verdict:** Keep the verdict (ignore the 40%), but change the reasoning.
  **Why:** You think you are using an Inside View. You are not. You are using a *better* Outside View.

  The "40% divorce rate" is the base rate for the class *All Marriages*. That class is causally heterogeneous. It includes impulsive Vegas weddings, abusive relationships, and couples who hate each other. You are not in that class.

  You are in the class *Couples with 15 Years of Productive Conflict Resolution*. The base rate for divorce in *that* class is likely under 5%.
  *   **The "Everyone was confident" objection:** This applies to the class *People Starting Marriages*. It does not apply to the class *People 15 Years In*. Confidence is a prospective signal (weak); 15 years of data is a retrospective signal (strong).
  *   **The Fix:** You aren't rejecting the Outside View. You are rejecting a *lazy* Outside View in favor of a *rigorous* one. Your intuition is correct, but your justification ("I refuse to apply it") sounds like Inside View arrogance. Reframe it: "The 40% statistic is irrelevant data for my specific reference class."

  ### 2. Resolving the Startup Paradox (#5)
  **Verdict:** Your intuition is correct. Narrowing the class was harmful.
  **Why:** This is the **Selection Shadow** in action.

  You narrowed the class from *All Startups* to *Startups with an LOI*. In theory, this should help. In practice, you identified that the variable used to narrow the class (salesmanship/optimism) is correlated with the *entry* into the class, not just the *success* of the class.
  *   If the narrowing variable (LOI) is causally linked to success (revenue), narrow the class.
  *   If the narrowing variable (LOI) is causally linked to *optimism bias* (getting the LOI through charm rather than product), the narrow class is *more* biased than the broad class.
  *   **The Rule:** Do not narrow the reference class based on a variable that is endogenous to the bias you are trying to correct.

  ### 3. Resolving the Reno vs. Coding (#1 vs. #4)
  **Verdict:** Consistent.
  **Why:**
  *   **Reno:** Your classification tool (the plan) is prospective. Everyone in the reference class had a prospective plan. You cannot use the Inside View to move yourself into a better class because you have no evidence you are in a better class yet. -> **Broad OV wins.**
  *   **Coding:** Your classification tool (the prototype) is retrospective. 70% of the work is physically done. You are no longer in the class *People Starting Projects*; you are in the class *People Finishing Prototypes*. The base rate for the latter is much higher. -> **Narrow OV (via IV evidence) wins.**

  ### 4. Resolving the Course & Career (#6 & #7)
  **Verdict:** Consistent.
  **Why:**
  *   **Course:** You distinguished between *forecasting for action* (OV) and *forecasting for mood* (IV). This is correct. OV tells you if you should buy the ticket. IV tells you how to feel while holding it.
  *   **Career:** You distinguished between *portfolio logic* (Angel bets = OV is the probability) and *singular path logic* (Career = IV base). This is also correct. In a portfolio, you *are* the average. In a singular life path, you are trying to beat the average.

  ---

  ### The Selection Shadow is Real
  You asked if the "Selection Shadow" (observed classes are filtered by optimism) is a real problem or double-counting.

  **It is real.**
  Most reference classes available to you are *Survivor Classes* or *Starter Classes*.
  *   **Starter Class:** "People who quit jobs to write novels." This class is selected for optimism. The people who didn't quit (the realistic ones) are not in the data.
  *   **Survivor Class:** "Published authors." This class is selected for luck/talent.

  If you use the *Starter Class* base rate, you are double-counting the optimism bias (once in their decision to start, once in your decision to start).

  ---

  ### The Novel Verdict
  You asked about quitting your job to write a novel.
  *   **The Trap:** The reference class "people who quit jobs to write" is poisoned by the Selection Shadow. It is full of optimists who lacked a plan.
  *   **The Fix:** Do not ask "What is the success rate of people who quit?" Ask "What is the success rate of people who **have a finished draft and a routine**?"
  *   **The Inside View's Job:** Your Inside View must not predict success ("I feel inspired"). It must prove class membership ("I have written 50,000 words before quitting").
      *   If you quit *to* write: You are in the *Starter Class*. Use the grim Outside View.
      *   If you quit *after* writing: You are in the *Finisher Class*. Use the optimistic Outside View.

  ### Summary: Which Verdict Has to Go?
  You don't need to change any of your 7 verdicts. They are all statistically defensible. **You only need to change your explanation for #2.**

  Stop saying "I refuse to apply the base rate." Start saying "The 40% base rate is for the wrong population."

  **The Unified Rule:**
  1.  **Inside View is for Classification:** Use internal evidence to determine which reference class you belong in (e.g., "I have a prototype" moves me from *Starters* to *Finishers*).
  2.  **Outside View is for Forecasting:** Once classified, the class's base rate is your probability.
  3.  **Beware Selection Shadows:** If the reference class is defined by *starting* (marriages, startups, novels), assume it is biased by optimism. Narrow the class based on *structural* evidence (years survived, revenue, words written), not *promissory* evidence (plans, LOIs, confidence).

  Your gut is smarter than your theory. Your theory thinks #2 is an exception; your gut knows #2 is just a better dataset. Trust the gut, fix the theory.
