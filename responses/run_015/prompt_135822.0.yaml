answer: |-
  **1. Ranking of Defeaters**

  To assess what counts against Structural–Demographic Theory (SDT), one must distinguish between falsifying the causal mechanism, demonstrating incompleteness, or merely embarrassing a specific quantification.

  A **fatal defeater** would be the systematic observation of societies exhibiting the full SDT precursor suite—sustained real wage stagnation alongside rapid elite expansion—without subsequent political instability or state breakdown. Specifically, if a polity sustains high elite density and low popular welfare for two centuries yet maintains fiscal solvency and social order, the coupling mechanism is broken. Equally fatal would be evidence that state breakdown consistently precedes, rather than follows, elite overproduction. If the fiscal crisis drives the elite fragmentation rather than vice versa, the core endogenous engine is reversed.

  A **serious defeater** would be the failure of the timescale. If cycles occur randomly rather than clustering around the two-to-three-century mark, or if the recovery phase is instantaneous rather than generational, the demographic constraint is illusory. This would not necessarily falsify the variables, but it would falsify the claim that demographic metabolism sets the tempo.

  A **merely awkward defeater** involves proxy failure. If 'elite overproduction' cannot be measured consistently across cultures—for instance, if degree counts work for modern America but fail for Qing China—the theory becomes difficult to test comparably. This limits generalisability but does not refute the underlying logic, provided a principled alternative proxy exists.

  **2. Defender Concessions**

  Proponents of SDT have already absorbed significant objections by modifying the theory's weightings. Defenders readily concede that exogenous shocks—plague, volcanic winters, or invasion—are often the trigger that tips a stressed system into collapse. They argue these shocks are not the cause but the match to the tinder; the theory claims to explain the accumulation of combustible material, not the spark. Consequently, the theory survives the observation that few collapses occur without a triggering event.

  Furthermore, defenders have increasingly shifted emphasis from popular immiseration to intra-elite competition. Early formulations treated popular unrest as the primary driver; later revisions acknowledge that masses rarely revolt without elite factionalisation. If the fiscal link looks doubtful—for example, if elites remain tax-compliant despite overproduction—defenders may argue that non-fiscal forms of competition (media control, judicial weaponisation) suffice. This weakens the specific fiscal claim but retains the structural conflict. The resulting version asserts that elite cohesion is the critical bottleneck, demographically eroded, regardless of the specific battlefield.

  **3. The Null Hypothesis: Shock versus Endogeneity**

  Your concern regarding a damped system kicked by exogenous shocks is the strongest statistical challenge. A shock-and-recovery model can mimic periodicity if recovery times are slow and shock frequencies are clustered. To discriminate genuine endogeneity from shock-plus-recovery, one must examine the phase relations and lag structures between internal variables.

  SDT predicts a specific sequence independent of shock timing. Real wages should begin falling early in the cycle, driving elite expansion (as cheap labour allows surplus extraction). Elite numbers should peak *after* wages bottom out but *before* widespread unrest. Unrest should peak only after elite fragmentation is advanced. In a shock-driven model, instability should correlate contemporaneously with the shock, or lag only by the duration of administrative failure, not by the decades-long buildup of elite density.

  Crucially, SDT predicts that instability should recur even in periods without major exogenous shocks, provided the internal variables reach threshold values. A shock model predicts stability in the absence of kicks. Regarding amplitude: in SDT, the severity of instability should correlate with the magnitude of elite overproduction, not necessarily the size of the triggering shock. A small shock during peak overproduction should cause greater damage than a large shock during a cohesion phase.

  The settling observation would be a completed secular cycle in a region isolated from major climate or epidemic volatility. If instability recurs with the correct phase lags in the absence of external volatility, endogeneity is supported. If instability only ever follows recorded shocks, regardless of wage or elite trends, the null hypothesis holds. Currently, the data is compatible with both, as most historical collapses coincide with some environmental stressor.

  **4. The Measurement Problem**

  The reliance on proxies introduces significant slack. 'Elite overproduction' is proxied by law graduates in the US, but by burial richness or office prices in Rome. 'Popular immiseration' shifts from skeletal stature in antiquity to median income today. This freedom allows the theory to fit historical curves post hoc by selecting the proxy that best matches the instability timeline.

  To constrain this, proxy choice must be tied to structural function rather than availability. A principled constraint would require pre-registering proxies based on the cost of elite entry or the surplus labour share, independent of the instability record. For instance, if the theory predicts crisis in 2020 based on 1990s degree data, that is robust. If the proxy is selected *after* 2020 to fit the curve, it is ad hoc. Currently, the theory suffers from retrospective proxy fitting in historical cases, though modern applications are more rigorous. Until historical proxies are standardised functionally (e.g., 'cost of obtaining political office relative to median wealth'), the theory retains enough slack to accommodate most historical sequences.

  **5. Extension to Modern States**

  The modern extension faces a genuine challenge. The recent instability in the United States occurred amidst record state fiscal capacity and borrowing power, contradicting the 'state breakdown' phase of the traditional cycle. The state has not lost administrative control; rather, it is being contested by factions.

  Defenders relocate the mechanism to intra-elite competition alone, arguing that fiscal capacity allows elites to fight longer without collapsing the state immediately. However, this risks transforming SDT into a generic theory of polarisation. If the fiscal constraint is removed, and the demographic constraint is buffered by technology, what limits the cycle? If the theory claims modern states can sustain elite overproduction indefinitely without collapse, merely suffering 'instability', it loses the predictive bite regarding regime failure.

  This is a serious defeater unless the theory specifies a threshold where fiscal capacity is overwhelmed by factional veto points. If the US continues to function despite high elite density and wage stagnation for another century, the claim that these conditions necessitate breakdown is falsified. The theory currently survives by lowering the expectation from 'state collapse' to 'political dysfunction', but this weakens the claim that secular cycles are engines of historical transformation.

  **6. The Legibility-Lag Rival**

  Your legibility-lag model offers a sharp discrimination. SDT posits a universal demographic constraint; the legibility model posits a technological-administrative constraint. SDT predicts that high-capacity states will eventually crash if demographic pressure and elite density grow unchecked. The legibility model predicts that high-capacity states can sustain high elite density and wage stagnation indefinitely because they can extract sufficient surplus and monitor dissent to prevent coordination.

  The conflicting prediction lies in the fate of high-capacity polities under stress. SDT predicts they will fracture when elite cohesion breaks, regardless of surveillance capacity. The legibility model predicts they will remain stable so long as extraction and monitoring outpace organisational capacity of rivals.

  On assessment, the legibility model is more exposed regarding pre-modern history (where capacity was low) but potentially more robust regarding modernity. SDT is more exposed overall because it claims a universal dynamic. A single instance of a high-capacity, high-pressure state stabilising permanently favours legibility. Conversely, a high-capacity state collapsing despite effective monitoring favours SDT. Currently, the resilience of modern authoritarian high-capacity states suggests the legibility model captures a variable SDT underweights: information asymmetry. SDT assumes elites cannot coordinate suppression indefinitely; legibility assumes they can.

  **7. Verdict on Insulation**

  After granting qualifications, is there anything SDT cannot accommodate? The risk is degeneration. If 'state breakdown' is redefined as 'political noise', and 'elite overproduction' is redefined as 'any elite disagreement', the theory becomes unfalsifiable. However, core claims remain testable: the phase lags between wages and unrest, and the correlation between elite density and violence intensity.

  If the theory is qualified to the point where no historical sequence could refute it, it ceases to be a causal theory and becomes a heuristic taxonomy. This is not fatal for a lens on history, but it is fatal for a predictive science. You noted you value it less as a forecasting engine; in that case, insulation is less damaging. However, if the theory claims to explain *why* cycles occur, it must risk being wrong about the mechanism.

  Currently, the theory is insufficiently exposed on the modern extension. It has not committed to a specific failure mode for high-capacity states that would allow us to say 'this did not happen, therefore SDT is wrong'. Until it specifies what *would not* happen in a modern secular cycle (e.g., 'stable wages with high elite density'), it remains too insulated to be strictly falsifiable in the present era. It remains a powerful historical lens, but its transition to a law of political dynamics is incomplete.
