answer: |-
  **JOINT STATEMENT ON THE STRUCTURE OF DEONTOLOGICAL CONSTRAINTS**

  **To:** Dissertation Working Group
  **From:** Camp A (Agent-Relative) and Camp B (Collectivist/Minimizing)
  **Subject:** Agreed Claims, Disagreements, and Cruxes Regarding the Paradox of Deontology

  Following a term of adversarial collaboration, we submit this memo to clarify the structure of our disagreement regarding deontological constraints. We agree that the so-called paradox of deontology is not a confusion to be dissolved but a structural feature requiring explanation. We disagree on the locus of moral requirement and the normative significance of collective outcomes. This document isolates our common ground, specifies our divergences, and identifies the empirical and conceptual cruxes that will determine the viability of our respective accounts.

  ### 1. Agreed Claims

  1.  **Existence of Constraints:** Both camps affirm that morality includes agent-constraints. There are acts (e.g., killing an innocent to harvest organs) that an agent is prohibited from performing even if performing them would minimize the total number of identical acts performed by others.
  2.  **Gravity of Violations:** Both camps affirm that violations of constraints are morally grave bads. They are not merely neutral events or regrettable occurrences; they constitute moral harms that demand explanation and justification.
  3.  **The Formal Gap:** Both camps acknowledge the formal gap that generates the paradox: a theory can prohibit an agent from committing a violation while permitting (or requiring) that agent to refrain from preventing five identical violations by others. Both camps agree this gap produces a collective outcome containing more violations than necessary.
  4.  **Data vs. Verdicts:** Both camps agree that intuitive verdicts about specific cases (e.g., the standard harvest case) are data to be accommodated or explained by the theory, not immediate verdicts that settle the theoretical dispute. A theory may override an initial intuition if it offers a superior explanation of the underlying structure.
  5.  **Rejection of Consequentialism:** Both camps reject simple act-consequentialism. We agree that minimizing the bad is not the sole determinant of moral rightness. The dispute concerns whether the minimization of violations plays *any* role in constraining individual options, not whether it is the *only* role.
  6.  **Separateness of Persons:** Both camps accept that the separateness of persons is morally significant. We disagree on whether this significance licenses an agent to stand aside from preventing violations by others, or whether it merely prohibits using others as means while still requiring aid in preventing harm.

  ### 2. Disagreements Table

  | Disputed Claim | Camp A (Agent-Relative) Formulation | Camp B (Collectivist) Formulation | Classification |
  | :--- | :--- | :--- | :--- |
  | **Unit of Moral Assessment** | The primary unit of assessment is the individual agent. Morality addresses what *I* may do with *my* agency. The collective outcome is a sum of individual moral statuses, not a distinct object of evaluation. | The primary unit of assessment includes the group of agents capable of joint action. Where a group can jointly prevent violations, the moral requirement attaches to the group first, distributing duties to individuals derivatively. | **Genuine.** This is not merely verbal; it concerns the metaphysics of moral obligation. A denies group agency bears primary deontic weight; B asserts it does. |
  | **Status of Non-Minimization** | The permission to refrain from minimizing violations is a genuine moral permission. Exercising it is not blameworthy. The collective outcome is not a cost the theory must answer for in the same currency as the violation; morality is not a production problem. | The permission to refrain is provisional. If the group fails to coordinate, the individual may be permitted to stand aside, but this is a secondary permission born of tragedy. Ideally, the individual is required to minimize violations if part of a capable group. | **Genuine.** A views the permission as intrinsic to the constraint; B views it as a fallback position when ideal group coordination fails. |
  | **Value of Outcomes** | The value of the outcome (number of violations) is agent-neutral but secondary. It cannot override the agent-relative constraint. The fact that everyone exercises the permission simultaneously does not create a new duty to minimize. | The value of the outcome constrains individual options. If the gravity of violations is agent-neutral, the permission to let them occur must be limited by the capacity to prevent them. | **Verbal/Substantive Mix.** We agree outcomes have value. We disagree on whether that value generates a *constraint* on options (B) or merely a *reason* that is outweighed (A). |
  | **Complicity and Facilitation** | Facilitating a violation by another agent is subject to the same constraint as performing it. I may not facilitate what I may not do. | Facilitating a violation to prevent five others is governed by the group-level minimization requirement. The prohibition on facilitation is overridden by the duty to minimize collective violations. | **Genuine.** Disagreement on whether the constraint extends transitively to causal contribution when minimization is possible. |

  ### 3. Cruxes

  To move forward, we identify four cruxes. Settling these would require at least one camp to revise its core commitments.

  **Crux 1: The Clinician and the Board**
  *   **(a) Case:** A clinician cannot perform the violating act alone. An oversight board (of which she is not a member) can authorize it to prevent five identical violations. Later, she is made a voting member; her vote is pivotal.
  *   **(b) Camp A Prediction:** She may not request authorization, pass information, or vote to authorize. Her agency remains bounded by the constraint against violating, regardless of her causal leverage or membership in a body.
  *   **(c) Camp B Prediction:** She must vote to authorize if her vote is pivotal. As a board member, she shares agency in the collective decision. Her individual constraint is subordinated to the group's duty to minimize violations.
  *   **(d) Falsification:** **Camp A** would concede if it is shown that voting constitutes a distinct act-type from killing, such that the constraint does not apply to the vote itself. **Camp B** would concede if it is shown that the individual voter bears full moral responsibility for the violation authorized, indistinguishable from the perpetrator.

  **Crux 2: The Transmitter**
  *   **(a) Case:** An agent controls a relay. Leaving it alone allows a message to reach a distant agent who will perform a violating act to prevent five violations. Intervening blocks the message, ensuring the five occur. The distant agent acts wrongly if he acts.
  *   **(b) Camp A Prediction:** She may block the message. She is not permitted to facilitate a violation, even to prevent others. The distant agent's wrongness does not license her to become causally implicated in a violation.
  *   **(c) Camp B Prediction:** She must leave the relay alone. Her inaction facilitates a single violation to prevent five. The group outcome (five violations vs. one) constrains her permission to block the message.
  *   **(d) Falsification:** **Camp A** would concede if blocking the message is shown to be itself a violating act (e.g., harming the five directly) rather than merely refraining from facilitating. **Camp B** would concede if the distant agent's violation is shown to be morally independent of the transmitter's choice, such that the transmitter is not complicit.

  **Crux 3: The Relay of Refusals**
  *   **(a) Case:** Ten agents face the choice in sequence. Each can perform the violation once to prevent five. Each knows all previous agents refused. Does the tenth agent's position differ from the first's?
  *   **(b) Camp A Prediction:** No difference. Each agent faces the same constraint. The history of refusal does not change the moral structure of the current choice. Morality does not aggregate across time or agents to create new duties.
  *   **(c) Camp B Prediction:** The tenth agent's duty may differ. With common knowledge of previous refusals, the group capacity to minimize has degraded. The tenth agent may bear a heightened burden to stop the cascade, or conversely, be permitted to refuse because the collective opportunity is already lost.
  *   **(d) Falsification:** **Camp A** would concede if the length of the sequence or common knowledge intuitively shifts the blameworthiness of the final agent compared to the first. **Camp B** would concede if the verdict remains invariant regardless of sequence length or common knowledge.

  **Crux 4: Aggregation and Thresholds (Selected)**
  *   **(a) Case:** The number of violations prevented is not five, but five hundred, or is uncertain and known only in expectation. Does the constraint hold absolutely?
  *   **(b) Camp A Prediction:** The constraint is absolute or tied to an agent-relative threshold that does not scale linearly with the number of others. Five hundred violations by others do not license one violation by me.
  *   **(c) Camp B Prediction:** The constraint has a threshold. At some magnitude of prevented harm, the group-level duty to minimize overrides the individual constraint. The individual permission dissolves when the collective cost becomes too grave.
  *   **(d) Falsification:** **Camp A** would concede if there is any number of prevented violations that intuitively licenses the agent to violate. **Camp B** would concede if the constraint holds firm even when the number of prevented violations approaches infinity.

  ### Next Steps

  We propose testing these cruxes through detailed case variation rather than abstract principle. Camp A will draft responses to the Transmitter and Clinician cases focusing on the nature of complicity. Camp B will draft responses to the Relay and Aggregation cases focusing on the conditions of group agency. We will reconvene to assess whether our predictions hold against refined intuitions.
