          *   *Q2 (Idealization):* When does stripping detail kill the case? *Upstream of:* Construction norms. *Tractability:* Medium (comparative analysis). *Neglected:* No, but usually in philosophy of science, not ethics/epistemology TEs. *Trade-off:* Depth on specific cases for breadth of norms.
          *   *Q3 (Scope/Mapping):* How to ensure the case matches the principle? *Upstream of:* Auditing. *Tractability:* High. *Neglected:* Yes, often assumed. *Trade-off:* Time spent on logic vs. narrative.
      *   **Defining "Solved":** What does Q1 look like finished? A "TE Stress-Test Checklist." 5-7 specific moves a philosopher must make to validate their case. Success = Peer adoption or clear utility in workshops.
      *   **Overrated/Abandon:**
