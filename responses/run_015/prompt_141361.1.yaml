      *   *Check:* Did I address the "no empirical resources" constraint? *Adjustment:* Emphasize that Q1 is about *conceptual* nearby worlds, not *psychological* nearby worlds. We are looking for *logical* sensitivity, not *demographic* sensitivity.
      *   *Check:* Is the distinction between Friend and User clear? *Adjustment:* Use the "Instrument vs. Data" analogy.
