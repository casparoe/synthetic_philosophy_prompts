          *   *User's View:* This mislocates the action. Even if intuitions count, TEs often fail due to *internal design flaws* (framing, narrative detail, order, etc.). These failures persist regardless of the intuition debate.
      *   **User's Preliminary Concepts:**
          1.  *Support Laundering:* Borrowing support from an accepted principle to confirm a target principle.
          2.  *Cost of Abstraction:* Stripping away features that do justificatory work in real instances.
          3.  *Verdict Portability:* Whether verdicts survive nearby presentations/variations.
      *   **Constraints:**
          *   Time: ~1 year (sabbatical + light teaching).
          *   Resources: 1 Grad Assistant (GA), no empirical resources (no subjects, no surveys, no experimental collaborators).
          *   Goal: Practical output (norms/stress tests for constructing TEs), *not* metaphysical/epistemological theory about TEs.
      *   **Specific Deliverables:**
          *   Reasoning for 3-4 research questions (order, upstream/downstream, tractability, neglectedness, trade-offs).
          *   Adjudication of the crux (Is design downstream of evidential status?).
          *   Evaluation of the three labels (Support Laundering, Cost of Abstraction, Verdict Portability).
          *   Description of a "solved" top-ranked question (what does success look like?).
          *   Identification of overrated questions/implications.
          *   Honesty about abandoning parts of the agenda.

  2.  **Deconstruct the Crux (Design vs. Evidence):**

      *   *Friend's Claim:* Design is downstream of Evidence. If intuitions aren't evidence, design doesn't matter. If they are, we just need reliable intuitions.
      *   *User's Claim:* Design has independent structure. Bad design corrupts the intuition *even if* intuitions are generally reliable.
      *   *Analysis:* The friend is partially right but misses the point. The "intuitions as evidence" debate is about the *source* of justification. The "design" debate is about the *transmission* of justification. A reliable source can be contaminated by a leaky pipe. Therefore, the design project is *not* strictly downstream. It is orthogonal. You can believe intuitions are evidence and still need a theory of good TE design.
      *   *Verdict:* The user is right to pursue the design project. It is not premature. It addresses *validity* (internal) rather than *reliability* (external).

  3.  **Evaluate the Three Labels:**

      *   *Support Laundering:* This sounds like *conflation* or *question-begging*. It overlaps with the "modal scope" problem. It's a real phenomenon but might be better described as "principle conflation."
      *   *Cost of Abstraction:* This is a classic objection (idealization vs. distortion). It's well-trodden ground (e.g., Cartwright on models, Elgin on idealization). It might be too broad.
      *   *Verdict Portability:* This is the strongest. It maps onto *robustness* and *sensitivity analysis*. It's the core of the "framing effects" literature in x-phi but can be treated conceptually without new data. This is the most actionable for a non-empirical project.
      *   *Refinement:* "Support Laundering" is likely a specific instance of bad portability or scope confusion. "Cost of Abstraction" is a known issue in modeling. "Verdict Portability" is the fresh angle that fits the constraints.

  4.  **Develop the Research Agenda (Constraints Check):**

      *   *Constraint:* No empirical resources.
      *   *Implication:* Cannot run new x-phi studies. Must rely on *armchair analysis of existing cases* or *conceptual engineering*.
      *   *Goal:* Norms/Stress Tests.
      *   *Strategy:* Focus on *logical structure* and *narrative architecture* of TEs, not psychological mechanisms.

      *   *Question 1: The Stability/Portability Question.* (Top Priority).
          *   *Why:* Directly addresses the user's "Verdict Portability." Can be done by analyzing famous failed TEs (e.g., Gettier variants, Trolley variants) to see where verdicts shift due to irrelevant details.
          *   *Tractability:* High. Requires close reading, not subjects.
          *   *Output:* A "Stress Test Protocol" for TEs.

      *   *Question 2: The Abstraction/Idealization Boundary.* (Second Priority).
          *   *Why:* Addresses "Cost of Abstraction." Distinguishes helpful simplification from distorting simplification.
          *   *Tractability:* Medium. Harder to formalize. Needs case studies (physics vs. ethics).
          *   *Output:* Guidelines on "Essential vs. Accidental Features."

      *   *Question 3: The Scope/Principle Mapping.* (Third Priority).
          *   *Why:* Addresses "Support Laundering." Ensures the TE tests the *intended* principle, not a nearby one.
          *   *Tractability:* Medium. Logical analysis.
          *   *Output:* A checklist for "Principle-Case Alignment."

      *   *Question to Drop:* The general epistemology of intuitions. (Per constraints and user's goal).

  5.  **Drafting the Response - Section by Section:**

      *   **Adjudicating the Crux:** Start here. It validates the user's project. Distinguish *source* (intuitions) from *vehicle* (the TE design). Use the analogy of a telescope (lens quality vs. light existence).
      *   **Evaluating the Labels:**
          *   *Verdict Portability:* Keep. It's robustness.
