      *(Self-Correction on Q1)*: If I can't do empirical work, how do I study "Verdict Portability"? I study the *logical space* of the case. I look at how philosophers *have* varied cases in the literature and track the *argumentative* consequences, not the *psychological* ones. This is crucial. I am studying the *dialectical portability*, not the *psychological portability*. This fits the constraints.

      *(Refining "Support Laundering")*: This is actually "Equivocation on Principles." I should advise merging it.

