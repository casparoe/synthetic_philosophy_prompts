answer: |-
  ### 1. Adjudicating the Crux: Is Design Downstream of Evidence?

  Your friend is making a category mistake. She is conflating the *source* of justification with the *vehicle* of transmission.

  The "intuitions as evidence" debate concerns the **source**: Do seemings provide prima facie justification? If the answer is "no," then thought experiments (TEs) fail globally. But if the answer is "yes" (or even "sometimes"), the question of **vehicle** remains entirely open. A reliable source can be rendered useless by a corrupted channel. If I use a high-precision scale (reliable intuition) to weigh an object while a magnet is held underneath it (flawed TE design), the reading is wrong. The error is not in the scale's general reliability, but in the specific setup of the weighing.

  Therefore, the design-level project is **not downstream** of the evidential-status question; it is **orthogonal** to it.
  *   **Upstream:** The metaphysics of modality and the psychology of intuition (your friend's turf).
  *   **Your Turf:** The logic of narrative construction and the dialectics of case comparison.

  Even if we settle the intuition debate tomorrow, we would still lack a systematic account of why the *Trolley Problem* generates different verdicts when the fat man is pushed versus when the switch is flipped, independent of whether those verdicts count as evidence. The design project has enough independent structure to be worth working on regardless of the meta-epistemological outcome. In fact, it is more urgent: philosophers are building cases *now*, and they need norms for construction more than they need another defense of the practice.

  **Verdict:** Proceed. Your friend's objection is a gatekeeping move that dissolves upon distinguishing *reliability of faculty* from *validity of instrument*.

  ### 2. Stress-Testing Your Three Labels

  You asked which labels survive contact with existing distinctions. Here is the audit:

  1.  **Verdict Portability (Survives, but needs renaming):**
      *   *Status:* This is your strongest concept. It maps onto **robustness analysis** in philosophy of science and **sensitivity analysis** in modeling.
      *   *Refinement:* In a non-empirical context, you cannot measure psychological portability (do subjects agree?). You must measure **dialectical portability**: Does the argumentative force of the case survive logical variations in the vignette that are stipulated to be irrelevant?
      *   *Action:* Keep this. It is the core of your agenda.

  2.  **The Cost of Abstraction (Survives, but is common):**
      *   *Status:* This is the problem of **distortive idealization**. It is well-trodden in philosophy of science (Cartwright, Elgin, Jones) but under-theorized in ethics/epistemology TEs.
      *   *Refinement:* The risk here is that you end up writing a general treatise on idealization. You must constrain this to *narrative* abstraction (stripping motivational context, social history, etc.) rather than theoretical abstraction.
      *   *Action:* Keep, but narrow the scope to "Narrative Stripping."

  3.  **Support Laundering (Collapses):**
      *   *Status:* This gestures at **equivocation** or **scope confusion**. When a reader accepts a verdict because of a *different* principle, the TE has failed to isolate the target variable.
      *   *Refinement:* This isn't a distinct phenomenon; it is a failure of **Principle-Case Alignment** (see Research Question 3 below). It is a specific symptom of bad design, not a separate category of error.
      *   *Action:* Abandon the label. Fold the insight into the alignment question.

  ### 3. The Research Agenda: Three Questions

  Given your constraints (one year, one GA, no empirical resources), you cannot generate new data about how people *react* to cases. You must generate norms for how philosophers *construct* cases. Your GA should be used for cataloging existing case variations in the literature, not running subjects.

  Here are the three questions you should pursue, in order.

  #### Question 1: What constitutes a "Minimal Variation" for Dialectical Robustness?
  *   **The Inquiry:** You need a formal or semi-formal criterion for when two TEs are "nearby" enough that a shift in verdict indicates a design flaw rather than a principled distinction. Currently, philosophers rely on "sense of similarity." You need to replace this with a checklist of invariant features.
  *   **Upstream Of:** This is upstream of **Verdict Portability**. You cannot test portability if you cannot define the space of variations.
  *   **Tractability:** High. This is conceptual engineering. You and your GA can mine the literature (e.g., the explosion of Gettier cases, the trolley variants) to identify which variations were treated as "control cases" vs. "counterexamples." You are looking for the *normative logic* of variation, not the *psychological fact* of variation.
  *   **Neglectedness:** Genuinely neglected. X-phi studies empirical variation; metaphysics studies modal variation. Almost no one studies *dialectical* variation norms armchair-style.
  *   **Trade-off:** By focusing on the *logic of variation*, you ignore the *psychology of the reader*. You are assuming a rational agent who responds to the text as written. If the problem is actually cognitive bias (e.g., order effects due to processing limits), your norms might not fix it. However, fixing the logical design is a prerequisite for fixing the psychological noise.
  *   **Why First:** It defines the vocabulary for the rest of the project. You cannot audit a case (Q3) without knowing what counts as a relevant variation (Q1).

  #### Question 2: Where is the Boundary Between Helpful Idealization and Distortive Stripping?
  *   **The Inquiry:** TEs must simplify reality to function. When does simplification become falsification? You need a heuristic for identifying "essential narrative features" that cannot be removed without changing the moral/epistemic category of the case.
  *   **Upstream Of:** This addresses **The Cost of Abstraction**. It is upstream of construction norms.
  *   **Tractability:** Medium. This requires comparative case studies (e.g., comparing a TE in physics to one in ethics). It is harder to formalize than Q1.
  *   **Neglectedness:** Unfashionable. The "idealization" literature is hot in philosophy of science but cold in metaphysics/ethics. This makes it a good niche, but you must avoid drifting into philosophy of science.
  *   **Trade-off:** Time spent here is time not spent on the specific logic of TEs. There is a risk of producing a generic "theory of models" rather than a "guide for thought experiments." You must keep the output tied to *vignette construction*.
  *   **Why Second:** Once you know how to vary a case (Q1), you need to know which features are safe to vary. This prevents the "Minimal Variation" from becoming trivial.

  #### Question 3: How Do We Audit the Alignment Between Principle and Case?
  *   **The Inquiry:** This replaces "Support Laundering." How does a philosopher verify that the verdict elicited by the case actually bears on the principle being tested, rather than a neighboring principle? You need a "validity check" for the inference from *Case Verdict* to *Principle Falsification/Confirmation*.
  *   **Upstream Of:** This is the final step in the **construction/auditing process**.
  *   **Tractability:** High. This is logical analysis. You can develop a set of "inference warrants" that must be explicit in the text of the TE.
  *   **Neglectedness:** Neglected. Philosophers often assume the link is transparent. Making it explicit is rare.
  *   **Trade-off:** This risks becoming a tutorial on basic logic. You must ensure it remains specific to the *narrative* nature of TEs (e.g., how narrative framing creates implicit warrants).
  *   **Why Third:** You need to know how to vary the case (Q1) and what to keep constant (Q2) before you can certify that the specific case tests the specific principle (Q3).

  ### 4. What Does a "Solved" Question 1 Look Like?

  You asked for a concrete description of success for the top-ranked question (Minimal Variation/Dialectical Robustness).

  **The Output:** A **"TE Stress-Test Protocol"** (roughly 15–20 pages, plus an appendix of worked examples).
  This document would not be a theory of intuition. It would be a procedural checklist for a philosopher who has just drafted a thought experiment.

  **Success Criteria:**
  1.  **Taxonomy of Variations:** The Protocol categorizes variations into *Control* (should not change verdict), *Stress* (might change verdict, tests scope), and *Distortion* (changes verdict illegitimately).
  2.  **Invariance Rules:** It specifies at least 3–5 features that must remain invariant across Control variations (e.g., agent's epistemic access, causal immediacy, narrative focalization).
  3.  **Adoption:** You know you have succeeded if, at the end of the year, you can take a famous controversial TE (e.g., Thomson's Violinist) and apply the Protocol to show *exactly* where the dialectical breakdown occurs, in a way that commands assent from both sides of the controversy.
  4.  **Usability:** A colleague can use the checklist on a draft paper and find a design flaw you didn't discuss in the text.

  **How to know at the end of the year:**
  You have a manuscript that applies the Protocol to three canonical failures in the literature (cases where the TE is widely agreed to have misled or stalled progress). If the Protocol diagnoses the failure better than the standard "intuition is unreliable" explanation, you have succeeded.

  ### 5. What is Overrated and What to Abandon

  **Overrated: The "Expertise Defense"**
  *   *Why:* Your friend thinks this is the live wire. It is not. Even if philosophers have expert intuitions, they can still construct bad cases. Focusing on expertise is focusing on the *subject*, not the *object*. Since your goal is norms for construction, the expertise debate is a distraction. It implies that if we just get the right people, the design doesn't matter. That is false.

  **Overrated: The Implication that Unreliable TEs Invalidate Theory**
  *   *Why:* A common move is: "TEs are flawed, therefore we cannot use them to build theory." This does not follow. It follows that we must use them *more carefully*. Do not spend time defending the practice against abolitionists. Spend time improving the practice for practitioners.

  **Abandon: "Support Laundering" as a Standalone Project**
  *   *Why:* As noted, this collapses into Principle-Case Alignment (Q3). Trying to give it its own theoretical foundation will lead you into the philosophy of language (equivocation) or psychology (priming). Both are outside your resource constraints. Fold it into Q3 and move on.

  **Abandon: Empirical Validation of Your Norms**
  *   *Why:* You have no subject pool. Do not try to simulate x-phi. If you try to claim your norms *psychologically* improve verdicts without data, you will be vulnerable. Claim instead that your norms *dialectically* improve arguments. This is an armchair claim that can be defended armchair-style.

  ### Summary of Reasoning

  You are right to reject your friend's framing. The epistemology of the *faculty* is distinct from the methodology of the *tool*. Your constraints (no empirical data) actually protect you from the trap your friend is in; she is stuck waiting for psychological data to settle a methodological norm. You can settle methodological norms by analyzing the logical structure of existing arguments.

  Focus on **Dialectical Robustness (Q1)**. It is the most tractable, the most neglected, and the most directly useful for your goal of creating "stress tests." It allows you to use your GA to map the logical space of existing cases without needing a single survey respondent. If you can produce a checklist that allows a philosopher to say, "I have varied this case in the five dialectically relevant ways, and the verdict holds," you will have achieved more for the practice than another paper on whether intuitions are evidence.
