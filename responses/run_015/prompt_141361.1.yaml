  8.  **Final Polish:** Ensure the structure matches the prompt's requirements (Crux, Labels, Questions, Solved State, Overrated). (Wait, the prompt asks for "Reasoning, not the list" *for the questions*, but also wants the other sections. I will structure it logically.)

