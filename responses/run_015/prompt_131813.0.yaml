prompt: |-
  I've got a job-market paper (really a thesis chapter) that I'm presenting in three weeks at a two-day workshop on distributional cost-benefit analysis at a public policy school, and I'd like to not get eaten in the Q&A. The room will be maybe fifteen people: mostly public finance and applied micro economists who spend their days with social welfare functions, the inequality-aversion parameter in an Atkinson-style index, the transfer principle, and distributional weights in CBA; one social choice theorist who will immediately start asking which axioms I'm giving up; and two philosophers who work on population ethics and already think prioritarianism is a mess. Nobody there is a card-carrying prioritarian. My old supervisor is coming, and he thinks the whole view is just utilitarianism with a concave transformation plus bad PR. I get 25 minutes and then 20 for questions, which in practice will be the social choice guy for ten of them.

  The thesis is a fix to prioritarianism that I've been calling baseline-anchored prioritarianism (my coauthor hates the name and wants counterfactual prioritarianism; we haven't solved it). Sketch: standard prioritarianism weights a person's wellbeing change by how badly off they are in the outcome being evaluated, which is exactly why it gets hit by the leveling-down objection -- burn the surplus of the well-off and benefit no one, and the weighted sum can still go up, because the losses fall on people whose wellbeing is high and so gets a low weight. My proposal instead fixes the weight by the wellbeing level the person occupies at the baseline, i.e. in the counterfactual where we do nothing, and applies that one weight to whatever change the policy produces for them. Pure leveling down then buys nothing (there's no gain to weight), the ordinary cases where you choose between helping the worse-off and helping the better-off come out the way prioritarians want, and -- the bit I actually like -- the view says something determinate in cases where the classic version is silent. The costs I already know about: the ranking is now a function of baseline-outcome pairs rather than of outcomes, so it isn't a welfare function over wellbeing vectors and it gives up welfarism; it can't be dropped into a model and maximized in the usual way; and because losses to people who are well-off at baseline are cheap, it will okay enormous harms to the rich in exchange for very small gains to the poor.

  What I want is a Q&A prep sheet for this audience, not for philosophers: the eight or so objections I'll actually get, roughly in the order they'll come (I assume the social choice guy goes first, and the applied people get to measurement, counterfactual estimation and error propagation somewhere in the middle), each phrased the way those people would put it -- in their vocabulary of welfare functions, axioms, weights, elasticities and estimation error, not in mine. For each one: how much damage it does if I don't have an answer, a two-minute reply, what I should just concede up front instead of being dragged into conceding, and where my reply is weak. Tell me which two replies I should actually practice out loud, and give me the question I'm hoping nobody asks -- my bet is something about what the view says when the baseline is itself something we messed up (if the worse someone already is, the cheaper further losses to them are, hasn't my fix made things worse rather than better?), but tell me if the real nightmare question is a different one. Please also say, objection by objection, how confident you are that the reply would land with people like this, and flag the single reply you're least sure about -- I'd much rather find out now which part of my position I'm bluffing on. And if you think one of the objections is simply correct and I should change the view before the workshop, say that plainly.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** PhD candidate/Job Market Candidate (JMC). Presenting a thesis chapter/job market paper (JMP).
      *   **Topic:** Distributional Cost-Benefit Analysis (DCBA), specifically a modification of Prioritarianism ("Baseline-Anchored Prioritarianism" vs. "Counterfactual Prioritarianism").
      *   **Audience:** 15 people. Mostly public finance/applied micro economists (comfortable with SWFs, Atkinson indices, transfer principles). 1 Social Choice Theorist (axiom-focused). 2 Philosophers (population ethics, skeptical of prioritarianism). 1 Old Supervisor (utilitarian skeptic).
      *   **Format:** 25 min presentation, 20 min Q&A (likely dominated by the social choice theorist).
      *   **Goal:** Survive the Q&A without getting "eaten." Needs a prep sheet with specific objections, replies, concessions, and confidence levels.
      *   **Tone:** Professional, strategic, candid, slightly high-stakes anxiety management.

  2.  **Analyze the Theory (Baseline-Anchored Prioritarianism - BAP):**
      *   *Standard Prioritarianism:* Weight marginal utility by *outcome* wellbeing level ($g(w_i)$ where $g$ is concave). Problem: Leveling Down Objection (LDO).
      *   *BAP:* Weight marginal utility by *baseline* wellbeing level ($g(w_{i, baseline})$).
      *   *Mechanism:* $\Delta W = \sum g(w_{i,0}) \cdot \Delta u_i$.
      *   *Pros:* Solves LDO (leveling down yields $\Delta u < 0$ for rich, weight is low, but no gain for poor, so total $\Delta W < 0$). Handles standard trade-offs correctly.
      *   *Cons:* Path dependence (baseline matters), violates welfarism (ranking depends on history/status quo, not just outcomes), potential for "Rich Harms" (hurting the rich is cheap if they are rich at baseline).
      *   *Naming:* User likes "Baseline-Anchored," Coauthor likes "Counterfactual." (I should acknowledge this tension but stick to the user's preferred logic for the prep).

  3.  **Identify the Audience's Likely Objections (in their vocabulary):**
      *   *Social Choice Theorist:* Axiomatic violations. Anonymity? Welfarism? Strong Pareto? Path dependence.
      *   *Public Finance/Applied Micro:* Estimation of the baseline. Error propagation. Welfare weights calibration. Implementation in models.
      *   *Philosophers:* Normative justification. Why baseline? Is it arbitrary?
      *   *Supervisor:* Why not just use Utilitarianism with optimal taxation? (The "bad PR" angle).

  4.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Social Choice):* Violation of Welfarism/Consequentialism. The ranking depends on the status quo.
          *   *Vocab:* "Your social welfare functional isn't a function of the outcome vector alone."
          *   *Damage:* High. Undermines standard economic theory.
          *   *Reply:* Instrumental value. We need a decision rule for policy, not a timeless ranking.
          *   *Concession:* Admit it's not a standard SWF.

      *   *Objection 2 (Social Choice):* Anonymity/Equity. If I swap identities but keep baseline wealth, does the weight swap?
          *   *Vocab:* "Does your rule satisfy anonymity?"
          *   *Damage:* Medium.
          *   *Reply:* It satisfies a modified anonymity conditional on baseline.

      *   *Objection 3 (Applied Micro):* Baseline Estimation Error.
          *   *Vocab:* "Measurement error in the counterfactual." "Attenuation bias."
          *   *Damage:* High (practical usability).
          *   *Reply:* Robustness checks. Baselines are often policy-defined (status quo).
          *   *Concession:* Admit sensitivity.

      *   *Objection 4 (Applied Micro):* The "Rich Harms" Problem (Marginal Weight Discontinuity).
          *   *Vocab:* "Elasticity of the welfare weight." "Corner solutions."
          *   *Damage:* High (normative implausibility).
          *   *Reply:* Constrain with rights/constraints. It's a weighting function, not the only constraint.
          *   *Concession:* Needs side constraints.

      *   *Objection 5 (Philosopher/Supervisor):* Why the Baseline? (Arbitrariness).
          *   *Vocab:* "Normative significance of the status quo."
          *   *Damage:* Medium.
          *   *Reply:* Reference dependence (behavioral econ link). Expectations.

      *   *Objection 6 (Social Choice):* Path Dependence/Cycling.
          *   *Vocab:* "Sequence dependence." "Money pump."
          *   *Damage:* High.
          *   *Reply:* Policy analysis is usually one-shot or periodic, not continuous trading.

      *   *Objection 7 (Supervisor):* Just use Optimal Tax Theory.
          *   *Vocab:* "Second-best instrumentation."
          *   *Damage:* Medium (relevance of paper).
          *   *Reply:* CBA is for project evaluation, not full tax system redesign.

      *   *Objection 8 (The Nightmare):* The "Bad Baseline" / Poverty Trap.
          *   *Vocab:* "Endogenous baseline." "Historical injustice."
          *   *Damage:* Critical. If baseline is unjust, anchoring to it codifies injustice.
          *   *Reply:* Baseline should be "legal status quo" or "entitlements," not raw utility.

  5.  **Refining and Ordering:**
      *   Need to order them logically (Axioms -> Measurement -> Normative -> Nightmare).
      *   Need to ensure the vocabulary matches economists (SWF, axioms, identification, error variance).
      *   Need to assess confidence levels honestly.

  6.  **Developing the Strategy:**
      *   *Practice:* Which two are most critical? The Welfarism violation (theoretical core) and the Baseline Estimation (practical core).
      *   *Concessions:* Don't fight the axiom violations; reframe them as features of *policy evaluation* vs. *social ranking*.
      *   *Nightmare Question:* The user guessed "Bad Baseline." I agree, but specifically the "Injustice Anchoring" version. If the baseline is a result of past discrimination, anchoring weights to it punishes the victim twice.

  7.  **Drafting the Content (incorporating specific constraints):**
      *   8 Objections.
      *   Order: Social Choice first.
      *   Vocab: Welfare functions, axioms, weights, elasticities, estimation error.
      *   Components: Damage, 2-min reply, Concession, Weakness, Confidence.
      *   Specific advice on which to practice.
      *   Identify the bluff.
      *   Identify if the view needs changing.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Social Choice Guy"? Yes, he needs axiom talk.
      *   *Check:* Did I address the "Applied Micro" crowd? Yes, they care about estimation and implementation.
      *   *Check:* Did I address the Supervisor? Yes, the "Utilitarianism with bad PR" point.
      *   *Check:* Is the tone right? Needs to be supportive but rigorous.
      *   *Critique:* The "Rich Harms" objection is actually the most dangerous normative bullet. If the model says "Starve the rich to feed the poor a crumb" because the rich have low weights, the audience will revolt. I need to make sure the reply involves *constraints* (e.g., Pareto constraints or rights).
      *   *Critique:* The "Welfarism" objection is technically correct. The user admits it. The strategy must be to own it, not deny it. "I am proposing a *policy rule*, not a *social ordering*."
      *   *Nightmare Question:* The user's guess is good. I will refine it to "Entrenchment of Injustice."

  9.  **Final Polish:** Ensure the distinction between "Baseline-Anchored" and "Counterfactual" is acknowledged but not dwelt upon (it's a branding issue, not a technical one). Focus on the math/logic.

      *(Self-Correction on Confidence Levels)*: I need to be honest. The "Welfarism" reply is weak because economists *love* welfarism. I should flag that as the bluff. The "Estimation" reply is strong because everyone knows baselines are noisy.

      *(Final check on the "Change the View" instruction)*: Is the view fatal? No, but the "Rich Harms" implication needs a patch (side constraints). I will advise adding a "Pareto Constraint" or "Minimum Rights Constraint" to the model description before the workshop.

  10. **Generating Output.** (Proceed to write the response based on these thoughts).
answer: |-
  This is a high-stakes room. You are walking in with a non-standard welfare metric into a room of people who live and die by the axioms of standard welfare economics. Your strategy cannot be to prove your view is *axiomatically superior* (it isn't); it must be to prove it is *pragmatically necessary* for policy evaluation where standard prioritarianism fails.

  Here is your Q&A prep sheet. I have ordered these by likelihood and sequence, assuming the Social Choice Theorist (SCT) opens the bidding, followed by the Applied Micro/Public Finance (AM/PF) crowd, with the Philosophers and Supervisor interjecting on normative grounds.

  ### Q&A Prep Sheet: Baseline-Anchored Prioritarianism

  #### 1. The Welfarism Violation (The SCT Opener)
  **The Objection:** "Your social evaluation functional violates welfarism. You are ranking outcome-baseline pairs, not outcome vectors. This means you violate Independence of Irrelevant Alternatives (IIA) and potentially Strong Pareto depending on how baselines shift. If the ranking depends on the status quo, you don't have a social welfare function; you have a path-dependent decision rule. Why should we accept a rule that cycles?"
  *   **Damage if Unanswered:** **Critical.** This undermines the theoretical coherence of the paper. If you don't have a SWF, you can't do comparative statics.
  *   **The Reply (2 mins):** "You are technically correct: this is not a timeless Social Welfare Function over states of the world. It is a *Policy Evaluation Rule* for incremental changes from a defined status quo. In public finance, we rarely optimize the entire tax system from a veil of ignorance; we evaluate marginal reforms from the current code. Standard prioritarianism fails the Leveling Down Objection in this context. I am trading the axiomatic purity of a global SWF for a decision rule that satisfies the Transfer Principle *and* avoids Leveling Down in the context of marginal policy analysis."
  *   **Concede Up Front:** Concede immediately that it is not a global SWF. Do not try to defend it as one. "I am not proposing this as a replacement for welfare theory, but as a tool for CBA."
  *   **Weakness:** It invites the "Money Pump" objection (see #6).
  *   **Confidence:** **70%.** Economists respect honesty about scope. If you claim it's a SWF, you die. If you claim it's a policy rule, you survive.

  #### 2. The "Rich Harms" / Weight Elasticity Problem (The AM/PF Follow-up)
  **The Objection:** "If weights are fixed at the baseline, the marginal welfare weight of a high-income individual is near zero. Your model implies we should impose enormous costs on the rich for trivial gains to the poor, provided the rich stay rich. The elasticity of the welfare weight with respect to income is effectively infinite at the margin. Doesn't this generate corner solutions that violate basic efficiency constraints?"
  *   **Damage if Unanswered:** **High.** Makes the model look normatively monstrous and practically unusable.
  *   **The Reply (2 mins):** "This is a feature of the weighting function, but not the only constraint on the policy space. I propose this weighting scheme *within* a constrained optimization framework. We can, and should, impose Pareto constraints or basic rights constraints that prevent absolute harms exceeding a threshold. The weighting function solves the *distributional* trade-off; it shouldn't be asked to solve *rights* violations. Standard CBA already uses Kaldor-Hicks; this is a Distributional Kaldor-Hicks with side-constraints."
  *   **Concede Up Front:** Concede that the weighting function alone permits unacceptable harms. "The weights determine the *trade-off rate*, not the *feasible set*."
  *   **Weakness:** It looks like a patch. Why not just use a less concave function?
  *   **Confidence:** **60%.** This is where you look like you're hiding the implausibility behind "constraints."

  #### 3. Baseline Identification & Measurement Error (The Applied Crowd)
  **The Objection:** "In applied work, the 'baseline' is rarely observed; it's estimated. If your weights depend on $w_{baseline}$, and $w_{baseline}$ has measurement error, you introduce attenuation bias into your welfare weights. Worse, if the baseline is endogenous to policy expectations, you have an identification problem. How do you propagate this error in your confidence intervals?"
  *   **Damage if Unanswered:** **Medium-High.** Makes the paper look theoretically neat but empirically dead.
  *   **The Reply (2 mins):** "In CBA, the baseline is typically the 'no-action' regulatory alternative, which is a legal or accounting construct, not a latent utility variable. We observe income/consumption at $t_0$. While there is measurement error in income, it's the same error present in standard distributional accounts. I treat the baseline as the observed pre-policy distribution. Sensitivity analysis on the baseline definition (e.g., 3-year average vs. 1-year) is standard practice and I include robustness checks."
  *   **Concede Up Front:** Concede that endogenous baselines (where agents anticipate policy) are a complication. "This model assumes the baseline is fixed at the point of policy announcement."
  *   **Weakness:** If they press on utility vs. income as the metric of wellbeing.
  *   **Confidence:** **85%.** This is your home turf. CBA baselines are administrative, not metaphysical.

  #### 4. The "Status Quo Bias" / Injustice Objection (The Philosophers & Supervisor)
  **The Objection:** "By anchoring weights to the baseline, you normatively privilege the status quo. If the baseline distribution is the result of historical injustice or discrimination, you are codifying that injustice into the weights. The victims of past injustice are 'poor at baseline,' so they get high weights, but if a policy harms them further, the weight is high... wait, actually, if they are poor, losses are weighted *heavily*. But if the rich are rich at baseline, their losses are weighted lightly. You are making it too easy to harm the rich, but you are also freezing the *structure* of inequality in place for weighting purposes."
  *   **Damage if Unanswered:** **High.** Normative fatalism.
  *   **The Reply (2 mins):** "Standard prioritarianism also faces this: it weights based on outcome levels. If the outcome is unjust, standard prioritarianism just evaluates the unjust state. My view is transparent about the reference point. Furthermore, because this is for *marginal* policy change, the baseline is temporary. Once the policy passes, the new outcome becomes the baseline for the next evaluation. It is not a permanent freezing of weights."
  *   **Concede Up Front:** Concede that no CBA method solves historical injustice. "This is a tool for marginal evaluation, not rectification of history."
  *   **Weakness:** The "temporary" argument is weak if policies are sticky.
  *   **Confidence:** **50%.** (See "The Bluff" below).

  #### 5. Anonymity Violations (The SCT Round 2)
  **The Objection:** "Does your rule satisfy Anonymity? If Person A and Person B swap incomes *at the baseline*, do the weights swap? If so, you satisfy anonymity. But if Person A and B swap incomes *in the outcome* but keep baseline positions, do the weights stay with the person or the income level?"
  *   **Damage if Unanswered:** **Medium.** Technical embarrassment.
  *   **The Reply (2 mins):** "Weights are attached to *individuals* based on their baseline position, not to income slots. If A and B swap outcomes, A carries A's baseline weight. This violates 'Anonymity over outcomes' but satisfies 'Anonymity over persons' conditional on history. Given that policy evaluation is about how *specific* people are affected by change, person-specific weighting is appropriate."
  *   **Concede Up Front:** "It violates standard outcome-anonymity."
  *   **Weakness:** Sounds like special pleading.
  *   **Confidence:** **75%.**

  #### 6. Path Dependence / Cycling (The SCT Trap)
  **The Objection:** "If rankings depend on the baseline, can I move from State X to State Y, and then from State Y to State Z, and end up preferring Z to X, but if I went X to Z directly, I'd prefer X? You allow cycling."
  *   **Damage if Unanswered:** **Critical.** Irrational preferences.
  *   **The Reply (2 mins):** "Cycling is a risk in any path-dependent system. However, in regulatory CBA, we do not continuously trade states. We evaluate discrete projects against a fixed 'no-action' baseline. We are not running a market of social states; we are voting on a bill. The 'cycle' would require reversing the policy to the exact previous legal code, which is institutionally costly."
  *   **Concede Up Front:** "Theoretically possible, institutionally constrained."
  *   **Weakness:** Theoretically, you are admitting irrationality.
  *   **Confidence:** **60%.**

  #### 7. The "Utilitarianism with Bad PR" (The Supervisor)
  **The Objection:** "This looks like Utilitarianism with a concave transformation of utility, but you've added a history-dependent weight to avoid the Leveling Down Objection. Why not just use Utilitarianism with optimal non-linear taxation? You're solving a second-best problem with a first-best tool."
  *   **Damage if Unanswered:** **Medium.** Questions the paper's existence.
  *   **The Reply (2 mins):** "Optimal tax theory tells us how to design the *system*. CBA tells us whether to build the *bridge*. We need a project evaluation metric that aligns with the social welfare function of the system. If the social welfare function is prioritarian, standard CBA fails. My view aligns project evaluation with a prioritarian social objective without the Leveling Down implication, which optimal tax theory doesn't address at the project level."
  *   **Concede Up Front:** "It is consistent with a specific view of social welfare, not a replacement for tax theory."
  *   **Weakness:** If the supervisor thinks prioritarianism is nonsense, this won't sway him.
  *   **Confidence:** **80%.**

  #### 8. The Nightmare Question (The "Bad Baseline" Trap)
  **The Objection:** "You claim this fixes the Leveling Down Objection. But consider a baseline of extreme deprivation. If a group is already at subsistence (baseline), and a policy harms them slightly, they have a *high* weight. But if a policy helps a group that is slightly above subsistence, they have a *lower* weight. Haven't you created a 'Poverty Trap' in the weighting function? You make it computationally expensive to help the moderately poor compared to saving the destitute, but you also make it computationally cheap to harm the rich. Isn't the real problem that you've made the weighting function discontinuous at the baseline?"
  *   **Damage if Unanswered:** **Fatal.** Shows the "fix" creates worse distortions than the original problem.
  *   **The Reply:** (See Strategy below).
  *   **Confidence:** **40%.**

  ---

  ### Strategic Advice

  #### Which Two Replies to Practice Out Loud?
  1.  **The Welfarism Violation (#1).** This will be the first question. If you stutter here, you look like you don't understand the theory. You need to say smoothly: *"You are correct, this is not a global SWF. It is a policy rule."* Practice the pause before "It is a policy rule."
  2.  **The Rich Harms / Constraints (#2).** This is where the room will turn on you normatively. You need to sound firm that *weights are not the only constraint*. Practice saying: *"The weighting function determines the trade-off rate, not the feasible set."*

  #### The Single Reply I'm Least Sure About (The Bluff)
  **Objection #4 (Status Quo Bias / Injustice).**
  *   **Why:** You are anchoring weights to the baseline. If the baseline is the result of slavery, segregation, or systemic theft, your weights "lock in" the moral standing of the oppressor (low weight on losses to them) and the victim (high weight on losses to them, but high weight on gains to them too).
  *   **The Bluff:** Your reply that "it's only for marginal change" is weak. If the baseline is unjust, *marginal* changes from it are morally tainted. The philosophers will smell this.
  *   **Mitigation:** If pressed, pivot to **Entitlements**. "The baseline should not be raw utility, but *entitlements* or *legal claims*." This moves the baseline from "what they have" to "what they are owed." It saves the theory but requires a tweak to your definition of baseline.

  #### Should You Change the View Before the Workshop?
  **Yes, on one specific point.**
  You need to address the **"Rich Harms"** objection (#2) proactively in the presentation, not just in Q&A.
  *   **The Fix:** Explicitly add a **Pareto Constraint** or a **Minimum Rights Constraint** to your model description. State clearly: *"Baseline-Anchored Prioritarianism is the objective function, subject to the constraint that no individual suffers a loss greater than $X$ (or a utility drop below a threshold)."*
  *   **Why:** If you don't do this, the Applied Micro people will assume your model recommends burning the rich for fun. By adding the constraint, you acknowledge the implausibility of the raw weighting function and show you have a "safety valve." It costs you theoretical purity but saves your normative credibility.

  #### The Real Nightmare Question
  Your bet is on the "Bad Baseline" (Injustice). I agree that is the *philosophical* nightmare.
  However, the **economic** nightmare is this:
  **"If the baseline is endogenous, your model creates perverse incentives for lobbying."**
  *   **The Logic:** If I know my welfare weight is determined by my baseline income, I have an incentive to *lower* my baseline income before a policy is evaluated to get a higher weight for future gains. Or, the rich have an incentive to *inflate* their baseline to signal that losses to them are "cheap" (wait, no, rich = cheap weight). Actually, the rich want to appear *poorer* at baseline to get higher weights on gains?
  *   **Check your math:**
      *   Poor at baseline = High Weight on Gains. (Incentive: Look poor).
      *   Rich at baseline = Low Weight on Losses. (Incentive: Look rich if you expect losses? No, Low Weight on Losses means losses count for *less*. So if I expect a tax, I want to look Rich so my loss counts for less social welfare? Yes.)
      *   **The Trap:** "Doesn't your model incentivize agents to manipulate their baseline status to game the welfare weights?"
  *   **Preparation:** Have an answer ready about **Baseline Rigidity**. "Baselines are determined by audited historical data (tax returns), not self-reported utility, minimizing gaming."

  ### Final Word
  You are not selling "The Truth." You are selling "A Tool That Solves Leveling Down."
  *   When the Social Choice guy attacks your axioms: **"I know. It's a policy rule, not a SWF."**
  *   When the Philosophers attack your baseline: **"It's a reference point for marginal change, not a judgment on history."**
  *   When the Applied guys attack your estimation: **"We use audited income, sensitivity checks apply."**

  Don't fight the axiom violations. Own them as the price of solving Leveling Down in a policy context. Good luck.
