answer: |-
  This is a remarkably precise diagnosis of a persistent pathology in macro-historical and archaeological theory. You have identified a structural feature of the "Collapse vs. Transformation" debate that goes beyond mere semantic disagreement. You are describing a situation where the *criteria for counting evidence* are internal to the theoretical framework, rendering the debate empirically undecidable.

  Here is an analysis of existing concepts, a proposal for a specific term where existing ones fall short, and an assessment of how (or if) the stalemate can be broken.

  ### 1. Existing Conceptual Analogues and Their Limitations

  There is no single canonical term in philosophy of history or archaeology that captures the *mutual* neutralization you describe, though several concepts map onto parts of the phenomenon.

  **A. Lakatosian Immunization (Research Programmes)**
  *   **The Concept:** Imre Lakatos argued that scientific research programmes have a "hard core" of assumptions protected by a "protective belt" of auxiliary hypotheses. When anomalies arise, the belt is adjusted to protect the core.
  *   **The Fit:** This explains *why* your friend calls institutional loss "decentralization" (an auxiliary hypothesis protecting the "Continuity" core) and why you call demographic persistence "background noise" (protecting the "Collapse" core).
  *   **The Distinction:** Lakatos describes a single programme defending itself against anomalies. Your description is **dyadic**: two competing programmes locking horns, each rendering the other's primary data categorially invisible. It is a *mutual* immunization, creating a closed system where no external data can enter.

  **B. Kuhnian Incommensurability**
  *   **The Concept:** Thomas Kuhn argued that competing paradigms are incommensurable because proponents "live in different worlds" and use terms with different meanings.
  *   **The Fit:** It captures the feeling that you and your friend are "talking past" each other.
  *   **The Distinction:** Kuhnian incommensurability usually implies a lack of communication or shared standards. In your debate, you *share* the data (ceramics, settlements, palaces); you disagree on the *ontological weight* assigned to that data. This is not a lack of shared language, but a **strategic deployment of taxonomy**.

  **C. Hayden White's Metahistory (Tropology)**
  *   **The Concept:** White argued that historical narratives are literary constructs (romance, tragedy, satire) imposed on the archive.
  *   **The Fit:** This aligns with your friend's claim that "collapse" is a normative judgment (a Tragedy) rather than a taxonomic fact.
  *   **The Distinction:** White focuses on the *narrative form*. Your concern is **evidentiary mechanics**: how specific definitions function to absorb or repel specific archaeological signatures.

  **D. Definitional Gerrymandering**
  *   **The Concept:** Manipulating the boundaries of a definition to secure a desired conclusion.
  *   **The Fit:** This is the colloquial equivalent of what you are describing.
  *   **The Distinction:** It lacks the philosophical specificity regarding *historical time* and *causal mechanism*. It implies bad faith, whereas your description suggests a structural inevitability within the theories themselves.

  ### 2. A Proposed Term: Reciprocal Interpretive Immunization (RII)

  Because existing terms describe either the defense of one theory (Lakatos) or the linguistic gap between two (Kuhn), but not the **structural symmetry of evidentiary neutralization**, I propose the term **Reciprocal Interpretive Immunization (RII)**.

  **Definition:**
  RII occurs in historiographical or archaeological debate when two competing macro-narratives define their core predicates (e.g., "Collapse" vs. "Reorganization") such that the primary evidentiary base of the rival account is automatically reclassified as derivative, irrelevant, or semantically distinct, thereby rendering the debate empirically undecidable.

  **Boundary Conditions:**
  1.  **Macro-historical Scale:** It applies to transitions of complex societies, not individual events.
  2.  **Symmetrical Neutralization:** Both sides must possess a mechanism to absorb the other's "smoking gun." (e.g., Palaces vanish $\rightarrow$ "Decentralization"; People stay $\rightarrow$ "Background Noise").
  3.  **Taxonomic Rigidity:** The immunity is achieved through definition, not through new data.

  **Distinction from Semantic Vagueness:**
  Semantic vagueness is when we don't know where to draw the line (e.g., "How many people must die for it to be a collapse?"). RII is when the line is drawn *specifically to exclude the opponent's data* (e.g., "Deaths don't count if the state remains," vs. "State loss doesn't count if people remain"). It is strategic, not accidental.

  ### 3. Adjudication: How to Break the Stalemate

  You asked what argument or empirical finding would revise my judgment. The stalemate of RII can only be broken by introducing a **third metric** that is external to the "State vs. People" dichotomy. Currently, the debate is a zero-sum game between *Political Complexity* (your metric) and *Demographic/Cultural Continuity* (your friend's metric).

  To adjudicate, we need a metric that correlates with neither exclusively but measures **human well-being or systemic resilience**.

  **A. Bioarchaeological Stress Markers**
  If "Collapse" is defined by the loss of palaces, but the population's health improves (less skeletal stress, better nutrition, lower disease load due to reduced urban density), then the normative valence of "Collapse" flips.
  *   *Adjudicating Finding:* Isotopic and osteological data showing that the "Collapse" phase correlates with a significant *increase* in average lifespan and nutritional intake, while the "Complex" phase correlates with epidemic disease and famine. This would validate your friend's "Reorganization" model but invalidate the negative connotation of your "Collapse" model.
  *   *Current Status:* In some cases (e.g., post-Roman Britain), this data exists and supports the "Transformation" view. In others (e.g., Classic Maya), evidence of violence and starvation supports "Collapse."

  **B. Network Topology (Quantitative)**
  Move beyond "Long-distance exchange exists/doesn't exist." Use network science to measure connectivity density.
  *   *Adjudicating Finding:* If network analysis shows that local connectivity *increases* as long-distance connectivity *decreases*, it supports "Reorganization." If *all* connectivity metrics drop below a threshold of systemic viability, it supports "Collapse."
  *   *Current Status:* This is the frontier of current archaeology (e.g., applications of complexity theory to the Late Bronze Age).

  **C. The "Dark Earth" Test**
  In some contexts (e.g., Amazonia, parts of Post-Roman Europe), the archaeological record shows a cessation of monumental building but an intensification of local soil management.
  *   *Adjudicating Finding:* If the "Collapse" layer contains evidence of *higher* labor investment per capita in subsistence (e.g., terra preta, terracing) than the "State" layer, it suggests a shift in labor allocation, not a loss of capacity.

  ### 4. Vulnerability Assessment: Is This a Pseudo-Problem?

  I must identify where my reasoning (and your diagnosis) is most vulnerable. There is a strong possibility that you have identified a **Category Error** rather than a genuine dialectical stalemate.

  **The Vulnerability:**
  The debate may be a pseudo-problem because "Societal Collapse" is not a natural kind; it is a **reified abstraction**.
  *   **States are not organisms.** They do not "die" in a biological sense. They are administrative patterns.
  *   **Populations are not cultures.** Continuity of DNA or pottery does not equal continuity of "society" if the social contract has fundamentally changed.

  **The Risk of Symmetry:**
  Your diagnosis assumes the two frameworks are equally robust. They may not be.
  *   *Scenario:* If 90% of the population dies (demographic rupture), your friend's "Continuity" model fails regardless of ceramic traditions.
  *   *Scenario:* If the palace dissolves but the tax system remains digitally or orally encoded (institutional continuity), your "Collapse" model fails.

  **Conclusion on the Pseudo-Problem:**
  You have not fabricated a pseudo-problem; you have identified a **Category Mismatch**. The "Collapse" model measures *Political Topology*. The "Continuity" model measures *Socio-Ecological Resilience*. They are measuring different things. The stalemate arises because both sides claim to be measuring "The Fate of Society."

  **Final Judgment:**
  The term **Reciprocal Interpretive Immunization** accurately describes the dialectical configuration. However, the resolution lies not in finding better data to satisfy one side, but in **disaggregating the variables**. We must stop asking "Did it Collapse?" and start asking:
  1.  Did the state apparatus dissolve? (Yes/No)
  2.  Did the population decline? (Yes/No)
  3.  Did material well-being decrease? (Yes/No)
  4.  Did cultural memory persist? (Yes/No)

  If the answer is Yes, No, No, Yes (State gone, People stay, Health same, Culture persists), then "Collapse" is the wrong word, but "Reorganization" is too benign. It is a **Political Metamorphosis**. The stalemate persists only so long as we insist on a binary taxonomy for a multidimensional phenomenon. Your friend is right that "Collapse" is often a normative judgment, but you are right that the dissolution of complexity is a real, measurable event that has consequences distinct from subsistence continuity. The error is assuming one metric must negate the other.
