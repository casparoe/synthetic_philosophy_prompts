prompt: |-
  i clerk at our constitutional court, the one whose charter has that clause letting the legislature limit any right "for the protection of public morality". Every few years we get another case under it, and there's one judge, Justice V., who has sat on all of them and who writes every time. Her votes so far (U = she let the criminal ban stand, S = she struck it down):

  - buying sex from an adult who advertises on her own, in her own flat, at well above the local median wage, with a verified no-coercion check: U
  - consensual sex between adult siblings who were raised apart, met as adults, use contraception, have no children: U
  - same-sex acts between consenting adults in private: S
  - physician-assisted dying for a terminally ill, competent adult, with a waiting period and two independent assessments: S
  - a living donor selling a kidney to a stranger through a licensed broker for roughly fifteen years of local income, full disclosure, lifetime aftercare: U
  - commercial surrogacy arranged abroad, carrier paid several times her annual income and recieved independent legal advice, no deception: U
  - possessing at home films of consensual adult acts that most people would call degrading, lawfully made, performers paid the standard rate: S
  - paying a stranger to shout insults at you for an hour, safeword, no touching, no recording: S

  I'm deliberately not giving you her reasons, because I want to see what rule you think the pattern fits first — I'll check them afterwards. And yes, I've read the Devlin/Hart argument, don't recapitulate it at me, I want it used.

  We just granted leave in three joined challenges to a flat ban on preparing or eating human flesh. Facts the court has to assume: the tissue was removed from a living donor during treatment she was having anyway, or bequeathed after a natural death by someone who was competent when she signed; nobody is paid, nothing is bought or sold at any stage, no brokers; the food is cooked in an inspected kitchen from screened tissue and eaten in a private room by adults who joined the club knowing exactly what they were eating; no recording, nothing repeated outside the room. Two of the applicant groups say the meal is a religious rite for them, the third says it isn't.

  What's your bet on how she votes, and more usefully: what rule is she actually running, which of the rules that fit her whole record come apart on these facts, and which of her precedents is the closest analog on each side? If you think her record genuinely underdetermines it, say what principle she'd be committing the court to with each answer — I have a feeling that voting S quietly turns the morality clause into a dead letter, but I can't quite make the arguement. Also tell me what case we'd need next to tell the surviving rules apart. And does the religious framing change anything, or is it a distraction?
