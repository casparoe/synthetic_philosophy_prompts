answer: |-
  **EPISTEMOLOGY 301: FINAL EXAMINATION**
  **Time Allowed: 90 Minutes**
  **Total Marks: 25**

  **Instructions:** Answer the following question. You are expected to write approximately 900 words. No secondary literature or citations are permitted. All arguments must be grounded in the primary text (*On Certainty*) and the case below.

  **The Case of the Kestrel Bank**
  The Kestrel Hydrographic Office has charted the Kestrel Bank for a century. Its survey method treats the Bank as geologically stable: soundings taken years apart are pooled into a single depth model, and an individual anomalous sounding is discarded as instrument error. That the Bank does not move is not something the Office has evidence for; it is what makes the pooling of soundings into one chart possible at all. Over thirty years the proportion of discarded anomalies has risen steadily, and eventually the director invokes the Office's standing revision protocol: when more than one sounding in five must be discarded, the stability assumption is to be retired and replaced by a model in which the Bank migrates. The retirement is authorised by counting discarded anomalies — that is, by a procedure that itself presupposes the very assumption being retired. Meanwhile, a separate team, the Tidalists, has for some years produced independent estimates of the Bank's position by satellite altimetry, a method that never presupposed stability; they argue the assumption was testable all along.

  **Question 1**
  (a) On the account presented in *On Certainty*, explain what it is for a proposition to play the role of the "Bank stability" assumption. Distinguish this role clearly from (i) a well-confirmed empirical hypothesis and (ii) a mere habit no one thinks to question. (8 marks)

  (b) The Director retires the stability assumption using a protocol that relies on data generated under that very assumption. A critic claims this is circular and irrational. Defend the Director: is this revision a response to evidence within the system, or a shift of the system itself? Explain how such a shift can be rational without external proof. (8 marks)

  (c) A critic argues that your account cannot distinguish the Office's assumption from a paranoid patient's conviction that his food is being poisoned, since both are held despite apparent counter-evidence. Explain the functional difference between a framework commitment and a delusion. Does the existence of the Tidalists' independent method rescue the Office from relativism, or does it merely offer a competing framework? Take a stand. (9 marks)

  ***

  **MODEL ANSWER**

  On the view in *On Certainty*, the stability of the Kestrel Bank functions as a "hinge" proposition. It is not a empirical hypothesis because hypotheses are tested against evidence, whereas the stability assumption is what allows the soundings to count as evidence in the first place. If every sounding required proof that the Bank hadn't moved since the last one, no chart could ever be constructed; enquiry would grind to a halt. It differs from a mere habit because it is normative: it dictates what counts as an error (the anomaly) versus what counts as data (the consistent sounding). A habit is just what we do; a hinge is the logic of what we do. It is the scaffolding of the Office's practice, not a brick in the wall.

  Regarding the Director's revision, the critic is right that it is circular if viewed as standard empirical falsification. You cannot use the rules of a game to prove the rules are wrong. However, the text suggests that hinges are not immutable; they are the riverbed through which the water of argument flows, but the riverbed can shift. The Director's move is not a standard evidence-response but a "conversion." The rising count of anomalies creates a friction that makes the old system cumbersome. Retiring the assumption is rational not because the old system proved itself false from the inside, but because the cost of maintaining it (discarding 20% of data) outweighs the benefit. It is a pragmatic decision to change the grammar of the enquiry. The protocol provides a trigger, but the shift itself is a change in standpoint, akin to changing units of measurement because the old ones no longer serve the purpose of navigation.

  This leads to the delusion objection. The difference between the Office's hinge and the paranoid's conviction is not truth-content, since both could be false. The difference is functional integration. The Office's assumption facilitates shared, successful action (charting safe passage). The paranoid's conviction isolates them and blocks action (starving to avoid poison). A hinge connects us to the world and others; a delusion severs those connections. The Tidalists do not provide a "view from nowhere" that proves the Office wrong. Their satellite method rests on its own hinges (e.g., that light behaves predictably in a vacuum). They offer a competing framework that yields more predictive success. Adopting the Tidalists' method is not escaping relativism by finding absolute truth; it is choosing the framework that better serves the form of life we share (safe navigation). This is not a damaging relativism because frameworks are judged by their capacity to sustain coherent action, not by correspondence to a reality inaccessible to all practices. We are not trapped in our heads; we are anchored in what works.

  ***

  **MARKING SCHEME**

  **Total Marks: 25**

  **Part (a): The Framework Role (8 Marks)**
  *   **2 marks:** Identifies the proposition as a condition of enquiry (scaffolding/hinge) rather than content of enquiry.
  *   **2 marks:** Distinguishes from empirical hypothesis (hypotheses are tested *by* the data; hinges make data possible).
  *   **2 marks:** Distinguishes from mere habit (habits are descriptive/psychological; hinges are normative/logical rules for what counts as error).
  *   **2 marks:** Uses the Kestrel case specifically (e.g., pooling soundings requires stability).
  *   *Common Failure:* Treating the assumption as a "basic belief" in the foundationalist sense (i.e., a belief justified by itself rather than a rule of the game). (-2 marks)
  *   *Common Failure:* Defining "cannot be doubted" as psychological impossibility rather than logical exclusion from the language game. (-2 marks)

  **Part (b): Rationality of Revision (8 Marks)**
  *   **3 marks:** Identifies the revision as a system-shift (conversion/riverbed shift) rather than internal falsification.
  *   **3 marks:** Explains rationality via pragmatic friction (cost of discarding anomalies) rather than external proof.
  *   **2 marks:** Acknowledges the circularity but defuses it (the protocol is a trigger, not a proof).
  *   *Common Failure:* Arguing the Director found "counter-evidence" against the hinge (contradicts the definition of a hinge). (-3 marks)

  **Part (c): Delusion, Tidalists, and Relativism (9 Marks)**
  *   **3 marks:** Distinguishes hinge from delusion via functional role (integration/shared action vs. isolation/blockage), NOT via truth value.
  *   **3 marks:** Analyzes Tidalists as offering a competing framework/system, not an absolute external standard.
  *   **3 marks:** Takes a stand on relativism (e.g., pragmatic realism: frameworks are judged by success in action, not arbitrary preference).
  *   *Common Failure:* Dismissing the delusion because "the patient is false and the Office is true." (-3 marks)
  *   *Common Failure:* Claiming the Tidalists prove the Office wrong from a neutral standpoint. (-3 marks)

  **Discriminator:**
  The single move that most reliably separates an A script from a B script is the handling of the Tidalists in Part (c). B scripts tend to treat the Tidalists as providing the "external evidence" the friend demanded, thereby collapsing the Wittgensteinian position back into standard empiricism. A scripts recognize the Tidalists as operating within *their own* framework, making the choice between Office and Tidalists a pragmatic shift between systems rather than a victory of Evidence over Prejudice.

  **Boundaries:**
  *   **Distinction (20+):** Clear grasp of hinge logic; nuanced handling of relativism.
  *   **Merit (15-19):** Correct distinctions but struggles with the relativism implication.
  *   **Pass (10-14):** Identifies hinge concept but falls into foundationalism or truth-based delusion dismissal.

  ***

