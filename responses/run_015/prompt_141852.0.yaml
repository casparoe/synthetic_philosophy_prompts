      *   *The Classmate's Claim:* "Gödel numbering is the Tortoise's move done right." This is misleading. The Tortoise wants to turn a rule into a premise. Gödel turns syntax into numbers. Gödel *does* turn "X is a proof" into an arithmetic property, which looks like a premise, but the *inference* still happens outside. I need to be careful here. Gödel numbering allows the system to *represent* the rule, but not *execute* it without an external interpreter.
