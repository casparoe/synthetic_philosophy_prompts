          *   *Relation to Carroll:* It's not solving the regress by adding premises. It's creating a *mirror* of the syntax inside the arithmetic. It allows the system to express "X is a theorem," but it doesn't solve the rule/premise distinction. In fact, Gödel's result relies on the distinction between *truth* and *provability*.

