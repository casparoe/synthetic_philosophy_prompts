          *   *Refinement:* The prompt asks for Round 1 merge to fail. I need to ensure they can't just compromise. I will add a rule: "You must agree on the *definition* used to rank before you rank." This forces the criteria clash.
          *   *Stakes:* The group that produces the most consistent ranking (measured by inter-rater reliability in Round 2) gets to choose the reading for the next week. High stakes for philosophy majors.
      *   **The Debrief:** Script the questions.
          *   Q1: Why did the merge fail? (Heterogeneity).
          *   Q2: Why did Round 2 work? (Normative profile).
