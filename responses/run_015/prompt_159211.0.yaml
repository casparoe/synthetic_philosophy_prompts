answer: |-
  Here is the brainstorming, selection, and full run-sheet.

  ### Part 1: Brainstorming & Selection

  **Option 1: The Phenomenology Diary.**
  Students spend 20 minutes in silence logging every conscious experience, tagging them "pleasant/unpleasant/neutral," then clustering them by shared felt qualities.
  *Rejection:* Too internal. It relies on introspective accuracy which varies wildly between Phil and Psych majors. It produces data, but not *conflict*. It won't force the realization that "pleasantness" is the wrong category; they'll just argue about whether their headache was really unpleasant.

  **Option 2: The Experience Machine Variation.**
  Students design a "perfect day" tape using sliders for intensity, duration, and variety, then trade tapes with constraints (e.g., "no memory of the day").
  *Rejection:* Drifts too quickly into value theory (Nozick-style) rather than metaphysics of mind. It tests what we *want*, not what pleasure *is*. It bypasses the heterogeneity problem by focusing on the good life rather than the nature of the state itself.

  **Option 3: The Normative Ranking Protocol (Selected).**
  Students rank concrete scenario cards first by "pleasantness" (Round 1) and then by "willingness to continue" (Round 2), with a forced merger of groups in Round 1 to expose criteria mismatch.
  *Commitment:* This is the one. It creates the specific friction you need: Round 1 fails because "pleasantness" is heterogeneous; Round 2 succeeds because "continuation norms" are structurally uniform. It forces them to discover the attitudinal/normative profile without you naming it.

  ---

  ### Part 2: The Activity Run-Sheet

  **Session:** The Heterogeneity Problem & The Continuation View
  **Time:** 75 Minutes
  **Students:** 14 (Split into 3 Groups: A=5, B=5, C=4)
  **Materials:** 3 Decks of 20 Cards (laminated if possible), 3 large sheets of butcher paper, markers, tape.

  #### The Deck (20 Cards Total)
  You need 5 cards of each of the 4 types. If you leave one type out, the philosophical mapping fails.

  *   **Type A: Intense/Short (The "Hit")**
      1.  Scratching a mosquito bite exactly right.
      2.  The first sip of ice water after a run.
      3.  The relief when a headache suddenly vanishes.
      4.  Eating a piece of perfect chocolate.
      5.  Stepping into a hot bath when freezing.
      *   *Risk if omitted:* Students think pleasure is just "low arousal." They won't see the intensity/pleasantness split.
  *   **Type B: Quiet/Long (The "Flow")**
      6.  Reading a book when the room is quiet.
      7.  A conversation that's clicking with no awkward pauses.
      8.  Watching rain hit a window while safe inside.
      9.  Working on a puzzle that's challenging but solvable.
      10. Walking a familiar path in good weather.
      *   *Risk if omitted:* Students equate pleasure with excitement. They won't see the "continuation" norm in low-intensity states.
  *   **Type C: Compulsive/Unpleasant (The "Trap")**
      11. Doom-scrolling at 1am when you know you're tired.
      12. Picking at a scab until it bleeds.
      13. Humming a song you hate that's stuck in your head.
      14. Checking email constantly during deep work.
      15. Eating when full just because the food is there.
      *   *Risk if omitted:* You cannot test **Overgeneration**. If these rank high on "continuation" but low on "pleasantness," the view predicts they are pleasures. Students need to see this tension.
  *   **Type D: Terminal (The "End")**
      16. The moment a sneeze happens.
      17. The punchline of a joke (the laugh itself).
      18. The dentist saying "You're all done."
      19. Crossing the finish line of a race.
      20. The final period at the end of a sentence.
      *   *Risk if omitted:* You cannot test the **Boundary Condition**. The Continuation View struggles here because "continuing" a sneeze is impossible/nonsensical. This is where the theory is weakest; they need to find that crack.

  #### The Mechanic

  **Round 1: The Intuitive Sort (20 Minutes)**
  *   **Task:** Rank the 20 cards from "Most Pleasant" (Top) to "Least Pleasant" (Bottom).
  *   **Constraint:** You must agree on a *single definition* of "Pleasant" before you place the first card. Write this definition on the paper.
  *   **The Merge:** At Minute 15, Group A and Group B must merge their piles into one shared ranking. Group C observes.
  *   **The Trap:** They will fail to merge. Group A likely defined pleasant as "Intensity" (Type A cards top). Group B likely defined it as "Contentment" (Type B cards top). They cannot reconcile the piles because the *criteria* are incommensurable.
  *   **Stakes:** No money. The stake is **Intellectual Authority**. The group that produces the most defensible ranking in Round 2 gets to frame the objection for the final seminar paper (i.e., they choose which philosopher the class critiques).

  **Round 2: The Normative Sort (15 Minutes)**
  *   **Task:** Re-rank the same 20 cards.
  *   **Constraint:** You are **banned** from using words related to feeling (good, bad, nice, hurt, feel, sensation). You must rank by **"Continuation Norms."**
  *   **Metric:** For each card, answer: *If you were in this state, how hard would it be to stop? How much would you pay for 5 more minutes?*
  *   **The Merge:** Group A and B merge again.
  *   **The Result:** This should be faster. Type C cards (Compulsive) will shoot to the top (hard to stop). Type D cards (Terminal) will crash to the bottom (cannot continue). Type A and B will mix based on duration desire.
  *   **Observation:** Group C notes where the ranking changed from Round 1.

  #### The Debrief (35 Minutes)
  *Do not name the "Continuation View" until Minute 65.*

  **1. The Merge Collapse (Minutes 40-50)**
  *   **Q:** "Group A and B, why did the first merge fail? Was it just stubbornness?"
  *   **Target Answer:** "No, we were measuring different things. A was measuring *intensity of sensation*. B was measuring *satisfaction of desire*."
  *   **Philosophical Map:** This is the **Heterogeneity Problem**. If pleasure were a single natural kind (like "heat"), you should be able to measure it. The fact that you couldn't merge suggests there is no single *felt* feature common to all "pleasant" things.

  **2. The Round 2 Shift (Minutes 50-60)**
  *   **Q:** "Why was Round 2 easier? And look at Group C's notes: which cards jumped the most?"
  *   **Target Answer:** "It was easier because 'hardness to stop' is a behavioral fact, not a feeling. The Compulsive cards (Type C) jumped to the top."
  *   **Philosophical Map:** This is the **Change of Subject** objection. The critic says: "You didn't solve the heterogeneity problem; you just changed the definition of pleasure from 'feeling' to 'disposition to continue'."
  *   **Follow-up:** "Is that a bug or a feature?" (This introduces your Continuation View).

  **3. The Overgeneration & Terminal Problems (Minutes 60-70)**
  *   **Q:** "Look at the Scab-Picking card (Type C). It was hard to stop. Did you rank it as 'Pleasant' in Round 1? Did you rank it high in Round 2?"
  *   **Target Answer:** "Round 1: Low. Round 2: High."
  *   **Philosophical Map:** **Overgeneration.** The Continuation View counts addictions/compulsions as pleasures. Hedonists say this is a reductio. Proponents say "Actually, those *are* locally pleasant, just globally bad."
  *   **Q:** "Look at the Sneeze (Type D). You can't continue a sneeze. Where did it land?"
  *   **Target Answer:** "Bottom, because '5 more minutes' is impossible."
  *   **Philosophical Map:** **The Boundary Condition.** This is the weakest point for the Continuation View. Some pleasures are essentially episodic. If the theory can't account for the sneeze, is it a theory of pleasure or a theory of *engagement*?

  **4. The Reveal (Minutes 70-75)**
  *   **Lecture:** "What you constructed in Round 2 is what I call the *Continuation View*. It solves heterogeneity by denying pleasure is a feeling. It makes it a normative profile."
  *   **Takeaway:** "Next week, we ask: Is solving the classification problem worth calling compulsions 'pleasures'?"

  ---

  ### Part 3: Limitations & Failure Modes

  **What this activity cannot do:**
  1.  **It cannot prove the view is true.** It only shows it is *operationally useful* for classification. Students might leave thinking "Well, it works for sorting, but it still feels like a cheat." You must acknowledge this in the wrap-up.
  2.  **It distorts the intuition of Pain.** By focusing on "continuation," you risk making pain look like just "states we want to stop." Some pains (grief, meaningful exertion) have complex continuation norms that this binary sort might flatten.
  3.  **It privileges the Attitudinal View.** You are rigging the deck so the Feeling Theory fails Round 1. A smart student might notice the rig. Admit it: "Yes, I chose cards that break the Feeling Theory. Your job is to see if the Continuation View survives the cards I didn't rig (the Terminal ones)."

  **Failure Modes & Interventions:**

  1.  **The "It's All Preference" Defense (Minute 25)**
      *   *Symptom:* A student says, "We can't merge because pleasure is just subjective. There's no fact of the matter."
      *   *Intervention:* Stop the group. "If it's purely subjective, you can't have a seminar on it. We are looking for the *concept* structure, not your personal taste. Rank them by how a *standard agent* would act, not how *you* act."
  2.  **The Gamer (Minute 45)**
      *   *Symptom:* Someone realizes Round 2 is the "right" way and tries to back-apply those criteria to Round 1 to make the merge work.
      *   *Intervention:* "Freeze. Did you use the 'Continuation' rule in Round 1? No? Then the failure stands. Don't retro-fix the data. The failure is the point."
  3.  **The Deadlock (Minute 30)**
      *   *Symptom:* Group A and B simply refuse to agree on a merged list.
      *   *Intervention:* Force a vote. "Pick the top 5. If you can't agree on the top 5, write 'ERROR' on the paper." This makes the failure concrete for the debrief.
  4.  **Time Blowout (Minute 60)**
      *   *Symptom:* Round 2 discussion is running long.
      *   *Intervention:* Cut the "Terminal Cases" discussion short. Assign the "Sneeze Problem" as the prompt for the first 5 minutes of the next class. Do not sacrifice the Reveal (Minutes 70-75).

  ---

  ### Part 4: Minute-by-Minute Timeline

  *   **00-05:** **Setup.** Hand out decks. Explain Round 1 rules. Emphasize the "Definition Constraint" (must agree on what 'pleasant' means before sorting).
  *   **05-15:** **Round 1 Sorting.** Groups work internally. Circulate and ensure they write down their definition.
  *   **15-20:** **The Merge.** Group A + B attempt to combine piles. Group C watches. (Expect friction here).
  *   **20-25:** **Reset.** Collect Round 1 sheets. Hand out fresh paper. Explain Round 2 constraints (No feeling words, use Continuation Norms).
  *   **25-35:** **Round 2 Sorting.** Groups re-rank. (Expect speed here).
  *   **35-40:** **Second Merge.** Group A + B combine. (Expect success here).
  *   **40-70:** **Debrief.** (Follow the 4-step debrief structure above).
  *   **70-75:** **Reveal & Close.** Name the view. Assign the "Sneeze Problem" for next time.

  This plan gives you the friction you need, keeps the students doing the work, and lands the philosophical plane exactly where you want it without you having to fly it for them.
