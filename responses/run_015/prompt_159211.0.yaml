          *   Q4: What about Terminal cards? (The weak spot).
      *   **Limitations:** Be honest. This privileges the attitudinal/normative view. It makes hedonism look worse than it might be.
      *   **Failure Modes:**
          *   *Gaming:* "I'll just say X." -> Intervention: Ask for the rule.
          *   *Relativism:* "It's all subjective." -> Intervention: "We are looking for the *concept* structure, not your personal taste."
          *   *Deadlock:* -> Intervention: Force a vote, note the dissent.
          *   *Timing:* -> Intervention: Hard stop at 40 mins.

  5.  **Refining the Timeline:**
      *   00-05: Setup & Rules.
      *   05-20: Round 1 (Ranking & Merge).
      *   20-35: Round 2 (Re-ranking with constraints).
      *   35-75: Debrief & Lecture connection.
