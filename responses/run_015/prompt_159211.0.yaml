      *   *Wait, 14 students.* 3 groups of 4, one group of 2? No, 2 groups of 7 is too big for consensus. 3 groups (5, 5, 4).
      *   *Merge:* Group 1 + Group 2 merge. Group 3 watches. This creates the "failure" audience.

  6.  **Writing the Response:**
      *   Adopt the persona: Collegial, experienced, precise.
