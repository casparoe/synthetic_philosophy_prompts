      *   **Brainstorming & Rejection:** Keep it brief but substantive. Show *why* the other two don't meet the "forced construction" constraint.
      *   **The Chosen Activity:** "The Normative Ranking Protocol."
      *   **The Deck:** 20 cards. 5 of each type.
          *   *Type A (Intense/Short):* Ice cream bite, scratch an itch, cold shower finish.
          *   *Type B (Quiet/Long):* Reading flow, good conversation, watching rain.
          *   *Type C (Compulsive/Not Pleasant):* Doomscrolling, picking scab, humming hated song.
          *   *Type D (Terminal):* Sneeze, punchline, dentist "you're done."
