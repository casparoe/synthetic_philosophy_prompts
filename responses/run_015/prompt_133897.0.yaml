      *   *Autism:* Be precise. DSM-5 autism is a *diagnostic kind*. The underlying traits are *natural kinds* (mostly). The *experience* is an *interactive kind*.

  9.  **Final Polish:** Ensure the tone is collaborative but rigorous. Explicitly state which verdicts need to be dropped. (The "Woman is universal" verdict is the primary casualty. The "Money and Race differ in kind" verdict needs nuancing—they are both constructed but differ in *inertia*).

  10. **Structure:**
