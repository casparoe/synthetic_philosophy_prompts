answer: |-
  This is an exceptionally sharp set of intuitions. You have independently rediscovered some of the central debates in the philosophy of social science (specifically the work of Ian Hacking, Sally Haslanger, and John Searle).

  You are struggling because you are trying to use one metric ("Is it constructed?") to measure phenomena that are constructed in fundamentally different ways. To sort this, we need to stop asking "Is it real?" and start asking **"What holds it together, and how hard is it to take apart?"**

  Here is a framework that reconciles your verdicts, identifies the principle you need, and tells you exactly which intuition you have to sacrifice.

  ### The Framework: Three Axes of Social Kinds

  To sort your cases, we need to distinguish between three properties. Most social kinds have all three, but in different ratios.

  1.  **Ontological Dependence (The Searle Axis):** Does the kind cease to exist immediately if collective belief stops? (High = Money; Low = Race).
  2.  **Structural Inertia (The Haslanger Axis):** Does the kind have material consequences (wealth, health, geography) that persist even if beliefs change? (High = Race; Low = Credit Score).
  3.  **Interactive Looping (The Hacking Axis):** Does classifying the person change the person's self-conception and behavior, which in turn changes the classification? (High = Autism/Gender; Low = Refugee).

  ### Re-Sorting Your Cases

  Using this matrix, here is how your cases actually line up.

  **1. Money (High Dependence, Low Inertia, Low Looping)**
  *   **Verdict:** *Institutional Fact.*
  *   **Why:** You are right. Money is purely constitutive. It exists *only* because we agree it counts as value. If the agreement stops, the kind vanishes instantly. It has low inertia because it doesn't biologically or geographically embed itself in the way race does.
  *   **Correction:** Money is not "universal." Barter exists, gift economies exist. The *function* of exchange is universal; the *kind* "money" is a specific institutional technology.

  **2. Race (Low Dependence, High Inertia, High Looping)**
  *   **Verdict:** *Structural Kind.*
  *   **Why:** This is where your tension lies. You feel race is "more real" than money because of health disparities. You are correct. Race is socially constructed, but it is **causally robust**.
  *   **The Distinction:** If everyone stopped believing in race tomorrow, Black maternal mortality would not drop to zero overnight. Why? Because the *structures* built by race (hospital locations, wealth gaps, environmental toxicity) have physical inertia. Money vanishes when belief vanishes; Race fades only when structures are dismantled.
  *   **Local Specificity:** You are right that US "Black" and Brazilian "Negro" are different kinds. They are different *structural positions* within different historical systems.

  **3. Gender (Medium Dependence, Medium Inertia, High Looping)**
  *   **Verdict:** *Interactive Kind.*
  *   **Why:** Gender involves a feedback loop. Being classified as a "woman" changes how you are treated, which changes how you act, which reinforces the classification.
  *   **The Tension:** You want to say "woman" is universal (US vs. Japan) but "hijra" is distinct. This is inconsistent.
  *   **The Fix:** "Woman" is not a universal social kind. It is a **genus** with local **species**. The social position of a 1950s US housewife and a modern Japanese corporate woman are different *structural kinds*, even if they share a biological cluster. "Hijra" is distinct not because it's "non-binary," but because it is a specific *institutional role* with religious/cultural recognition that "non-binary" (a Western legal/identity category) does not have.

  **4. Refugee (Low Dependence, Low Inertia, Low Looping)**
  *   **Verdict:** *Bureaucratic Status.*
  *   **Why:** You nailed this. Displacement is the natural/social fact; "Refugee" is the administrative label. It tracks a condition rather than constituting it. It has low looping because getting the status doesn't fundamentally change your neurology or ancestry, though it changes your legal rights.

  **5. Credit Score (Medium Dependence, Low Inertia, High Looping)**
  *   **Verdict:** *Algorithmic Kind.*
  *   **Why:** It is "thin" because it has low inertia. You can fix a credit score in a few years. You cannot "fix" a racial category. It has high looping because people change behavior to game the score.

  ### The Hard Sacrifices

  To make this system consistent, you must drop or significantly modify two of your current verdicts.

  **Sacrifice 1: The Universality of "Woman"**
  You must drop the idea that "woman" in 1950s America and "woman" in Japan today are the "same kind."
  *   **Reasoning:** If you accept that "Hijra" is a distinct kind from "Non-Binary" because of specific historical recognition conditions, you must grant the same courtesy to "Woman." The social expectations, legal rights, and economic roles of a 1950s American woman were so distinct from a 2020s Japanese woman that they constitute different *social kinds*, even if they map onto the same biological sex.
  *   **New View:** "Woman" is a **cluster concept**. There is a family resemblance, but no single universal social essence. This preserves the idea that gender is constructed without denying the reality of gendered experience.

  **Sacrifice 2: The Ontological Gap Between Money and Race**
  You currently feel Money and Race differ in *kind* (one is belief-dependent, one is structure-embedded).
  *   **Reasoning:** They are both socially constructed, but they differ in **temporal inertia**.
  *   **New View:** Money is a *synchronous* construction (requires current agreement). Race is a *diachronous* construction (built by past agreements that solidified into brick-and-mortar reality). Race feels "more real" not because it is less constructed, but because the construction process is older and has built deeper physical channels (segregation, wealth transfer).
  *   **Why this matters:** If you treat Race as purely belief-dependent (like Money), you imply racism ends when hearts change. If you treat it as Structural (like Geography), you understand it requires policy change.

  ### The Autism Verdict

  Now, apply this to **Autism (DSM-5)**.

  Is it a natural neurological kind or a social construction? Under this framework, it is **an Interactive Kind with a Biological Base.**

  1.  **The Base:** There are real, neurological differences in processing, sensory integration, and social cognition. This is not constructed. (Unlike Race, which has no biological essence).
  2.  **The Kind:** The category "Autistic" is constructed. The DSM-5 criteria draw a line around a spectrum. That line moves (compare DSM-4 to DSM-5).
  3.  **The Loop:** This is the crucial part. Once a person is labeled "Autistic," their life changes. They get accommodations; they join communities; they adopt a neurodivergent identity. This changes how they behave and how they understand their own neurology.
  4.  **The Verdict:** Autism is not *just* a natural kind we discovered (like Gold), nor is it *just* a social construction (like Money). It is a **bio-social interactive kind**.
      *   If society vanished, the neurological traits would remain (unlike Money).
      *   If the diagnosis vanished, the *experience* of being Autistic would fundamentally change (unlike Race, where the structural oppression might remain even if the label faded).

  ### Summary of the Principle

  The principle that sorts your cases is **Causal Inertia vs. Ontological Dependence.**

  *   **Money:** High Dependence, Low Inertia. (Vanishes when belief stops).
  *   **Race:** Low Dependence, High Inertia. (Persists after belief stops due to material structures).
  *   **Gender:** Medium Dependence, Medium Inertia. (Varies locally; defined by interactive roles).
  *   **Autism:** Low Dependence (Biological base), High Looping. (The label changes the lived experience of the biology).

  **Your gut was right on the cases, but wrong on the map.** You don't need to choose between "Real" and "Constructed." You need to recognize that some constructions build skyscrapers (Race), some build paper tents (Money), and some build mirrors that change the face looking into them (Gender/Autism).
