      *   **Core Task:** Audit the "civilization as organism" analogy in the context of societal collapse vs. reorganization.
      *   **Specific Cases:** Bronze Age Collapse, Maya Classic-period decline, Easter Island (Rapa Nui) ecological contraction.
      *   **Required Components:**
          1.  Construct a correspondence table (Organism $\leftrightarrow$ Society).
          2.  Show where the mapping fractures for each of the three cases.
          3.  Identify normative/teleological commitments imported by the analogy (e.g., complexity = health).
          4.  Evaluate whether the "collapse = failure" conclusion survives scrutiny.
          5.  If the organism model fails, propose a better structural comparison and explain its implications (failure vs. change).

  2.  **Part 1: The Correspondence Table (The Analogy):**

      *   *Goal:* Map biological functions to societal structures.
      *   *Drafting mappings:*
          *   Birth $\rightarrow$ State Formation/Neolithic Revolution.
          *   Maturation $\rightarrow$ Urbanization/Expansion.
          *   Peak/Health $\rightarrow$ High Complexity/Bureaucracy.
          *   Senescence/Aging $\rightarrow$ Institutional Rigidity/Elite Overproduction.
          *   Death $\rightarrow$ Dissolution/Abandonment of Centers.
          *   Organs $\rightarrow$ Institutions (Temple, Army, Market).
          *   Immune System $\rightarrow$ Military/Police/Social Cohesion.
          *   Metabolism $\rightarrow$ Resource Flow (Grain, Trade, Energy).
          *   Homeostasis $\rightarrow$ Stability/Order.

  3.  **Part 2: Fracture Points (The Audit):**

      *   *Goal:* Test the table against the three specific historical cases.
      *   *Case 1: Bronze Age Collapse (c. 1200 BCE).*
          *   *Analogy:* Sudden death of multiple organisms.
          *   *Fracture:* It wasn't universal death. Palaces died, but villages persisted. Trade networks reconfigured, didn't vanish. "Death" implies no offspring; here, Iron Age cultures emerged directly from the "corpse." It was a system reset, not biological extinction.
      *   *Case 2: Maya Classic-Period Decline (c. 800-950 CE).*
          *   *Analogy:* Senescence/Resource exhaustion leading to death.
          *   *Fracture:* Southern lowlands abandoned, but Northern Yucatán flourished (Post-Classic). People didn't die out; political structure shifted from divine kingship to councils/merchant leagues. The "organism" didn't die; it molted or migrated.
      *   *Case 3: Easter Island (Rapa Nui).*
          *   *Analogy:* Suicide via resource exhaustion (ecological senescence).
          *   *Fracture:* Recent archaeology suggests resilience, not collapse. Population stabilized, adapted agriculture (rock gardening), and survived until European contact (disease/slavery). The "death" was external shock, not internal senescence. The "organism" adapted to limits rather than dying from them.

  4.  **Part 3: Normative & Teleological Commitments:**

      *   *Goal:* Uncover hidden values in the metaphor.
      *   *Commitments:*
          *   *Teleology:* Assumes a lifecycle is inevitable (birth $\rightarrow$ death). Societies *must* die.
          *   *Normative:* Equates Complexity with Health. Simplification is Pathology.
          *   *Holism:* Assumes society is a unified *whole*. If the head (capital) dies, the body dies. Ignores regional variation.
          *   *Agency:* Biological aging is passive/inevitable. Social change is often active/political.

  5.  **Part 4: Evaluating the "Failure" Conclusion:**

      *   *Goal:* Does "collapse = failure" hold up?
      *   *Analysis:* If the analogy fractures, the conclusion weakens. If "death" is actually "reorganization," then "failure" is the wrong label. It might be adaptation. The organism model biases us toward seeing the end of elites as the end of *people*.
      *   *Verdict:* The conclusion does not survive. It conflates *political* collapse with *societal* extinction.

  6.  **Part 5: Alternative Model & Implications:**

      *   *Goal:* Propose a better metaphor.
