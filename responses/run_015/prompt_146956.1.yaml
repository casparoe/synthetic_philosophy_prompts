      *   *Candidate 2:* Ecosystem? (Better, allows for succession).
      *   *Candidate 3:* Network/Graph Theory? (Good for connectivity).
      *   *Selection:* **The Ecosystem/Succession Model** (or Complex Adaptive System).
      *   *Why:* Ecosystems undergo disturbance and succession. A forest fire isn't the "death" of the forest; it's a reset allowing new species.
      *   *Implications:*
          *   Collapse becomes "Disturbance."
          *   Reorganization becomes "Succession."
          *   Failure is only total extinction (rare).
