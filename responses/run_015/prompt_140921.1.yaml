  Arthur Miller's play argues that we lose the standing to blame not when we are sinful, but when our accusations serve our private interests rather than the public truth.

  Your three-way split helps diagnose the tragedy, but the play ultimately weighs the second category, profit-conditioned loss, heaviest. Global loss, the idea that any sin disqualifies you from speaking truth, is the logic of the court, not the moral logic of the drama. If mere sin destroyed standing, John Proctor would remain silent. Instead, the play distinguishes between sin that seeks to hide itself and sin that is sacrificed for the good of others.

  Consider Abigail Williams and the Putnams. Does the play distinguish them? Your split suggests motive matters, love versus land, but the play treats them identically regarding standing. Abigail's accusations are instruments of lust; she blames Elizabeth Proctor to remove a rival wife. The Putnams blame neighbors to seize their land. In both cases, the act of blaming is a continuation of their original wrong by other means. They lack standing because their speech is weaponized for private gain. This fits your second category perfectly: their hypocrisy disqualifies them because their blame is insincere performance aimed at profit. They treat the court as an extension of their private will.

  Proctor complicates this. When he confesses his adultery in open court to expose Abigail, the magistrates treat this as global loss: a lecher cannot be believed. The play resists this legalistic reading. Proctor's confession destroys his reputation but validates his testimony. He loses social standing to gain moral standing. He is not blaming to profit; he is blaming to stop the profit of others. The play suggests his standing is restored precisely because he accepts the penalty for his own sin while exposing the sins of the accusers. He transforms his hypocrisy from a shield into a sacrifice.

  Reverend Hale presents the hardest case regarding capacity-relative loss. Early on, he lends the court his authority, helping arrest the innocent. Later, he urges the accused to confess falsely to save their lives. Is this blame? No, it is desperate counsel born of complicity. Does he have standing? He admits he does not stand as a voice of truth anymore, because his earlier authority bought blood. He speaks now as a penitent begging for survival, not a judge demanding justice. His history costs him the standing to demand truth, leaving him only the standing to mourn the lack of it. He cannot say you are innocent with authority, only please live as a broken man. This suggests standing is fluid; he moves from judge to witness to beggar.

  Where the play resists my reading is in the outcome. Philosophically, we might argue Proctor should be believed because his motive is pure. Dramatically, he is not believed, and he dies. The community cannot distinguish between profit-conditioned hypocrisy and redeemed truth-telling. The tragedy is that the town operates on global loss while the audience sees the nuance of motive. The system collapses because it punishes the honest sinner alongside the malicious hypocrite.

  Finally, the play shows something abstract philosophy often misses: standing is not a static status but a costly achievement. Philosophy might treat standing as a right you hold or lose based on rules. Miller shows it as something purchased through suffering. Proctor buys his standing back with his life; Hale loses his standing to judge but keeps his life to carry the guilt. The play teaches us that the right to blame is not about cleanliness, but about whether your words serve the truth or merely yourself. In the end, standing is not what you claim, but what you are willing to lose.
