          *   *The Conflict:* Can't lie to grieving parents (knowing the "Four Seasons" story is invented). Can't insult the architect (calling them meaningless/accidental waste).
      *   **Constraint 3 (The Gould & Lewontin Point):** The user wants this concept to do the *real work* of the speech. The point: Features exist due to structural constraints first; meaning/use comes later. Don't confuse "why it's there" with "what we do with it."
      *   **Constraint 4 (Tone/Style):** 10 minutes (approx. 1300-1500 words spoken at normal pace). No jargon (don't say "spandrel" more than once, don't introduce Gould/Lewontin by name). Must work for non-philosophers. Must acknowledge the user is a novelist (who plans details) vs. building (which evolves/is constructed). Must be affectionate, not lecturing or mocking.
      *   **Constraint 5 (Specific Instruction):** Briefly correct/confirm the user's understanding of Gould & Lewontin first, then write the speech.

  2.  **Verify Gould & Lewontin Understanding:**
