      *   *Assessment:* This is accurate. The core argument of "The Spandrels of San Marco and the Panglossian Paradigm" (1979) is against strict adaptationism—the idea that every trait exists *because* it was selected for a specific function. They argue some traits are byproducts (exaptations or structural constraints) that later acquire function or meaning. The user's grasp is solid: the shape wasn't *for* the mosaics, but the mosaics make the shape meaningful.
