answer: |-
  **Translation: The Scale Argument as a Decision Problem**

  Emulate a target trial where the intervention is any policy altering insect population dynamics (e.g., land-use change, pesticide regulation) and the counterfactual is the status quo or alternative allocation. The population is the global ensemble of individual insects ($N \approx 10^{18}$), and the time horizon is indefinite, discounted appropriately. The outcome variable $Y$ is aggregate valenced experience. Since $Y$ is unobservable, we model it as a latent variable constructed from observable markers (nocifensive behavior, physiological stress response).

  The conclusion is an expected value calculation over three components:
  $$E[Y] = P(S) \times E[W | S] \times N$$
  where $P(S)$ is the prior probability of sentience (0.001–0.1), $E[W | S]$ is the conditional welfare capacity per unit time given sentience, and $N$ is the population exposure term. The astronomical number $N$ multiplies the product of the probability and the conditional welfare. In a standard cost-effectiveness analysis, this exposure term dominates the variance of the estimate.

  Regarding the variance story: Your intuition is correct. The honest representation is not a point estimate but a distribution spanning several orders of magnitude. This is not merely parameter uncertainty (wide credible intervals on $P(S)$) but structural model uncertainty. If the mapping from markers to experience is invalid, the mean is zero; if valid, the mean is astronomical. A probabilistic sensitivity analysis incorporating structural uncertainty yields a bimodal or extremely heavy-tailed distribution. The spread spans both "insects dominate all other moral considerations" and "insects matter not at all." Consequently, the Expected Value of Perfect Information (EVPI) regarding the validity of the surrogate markers is immense, making research into the mapping function competitive with, or superior to, direct intervention until the variance is sufficiently reduced to collapse the distribution away from zero.

  **Residue Report**

  **1. Surrogate Validity and Transport**
  You suspect the framework implies a floor on resolution: below a certain validity threshold, the probability input is meaningless. The vocabulary of surrogate validation confirms this. A surrogate is validated by its correlation with the true outcome in the target population. Here, the true outcome (phenomenal experience) is observable only in humans via self-report. Transporting the surrogate marker relationship across phylogenetic distance violates the assumption of exchangeability required for transportability. There is no validation study possible in the target population. In measurement-error models, if the validity coefficient is unidentified, the corrected estimate is unidentified. Plugging in 0.01 is not conservative; it asserts a structural parameter that is empirically grounded only in humans. The framework implies that without a bridge equation validated in the target, the estimand is undefined, not merely uncertain. Your skepticism is not dressed up; it is a formal implication of the surrogate hierarchy. Below the floor of transportability, the multiplication is arithmetic without estimand correspondence.

  **2. The Unit of Analysis**
  The choice between counting lives and counting time-at-risk is substantive. In HTA, the standard unit is the QALY, which aggregates welfare over time. In population ethics, counts of lives often dominate. Insect populations are characterized by high turnover and short lifespans. If the unit is insect-years, the scale argument diminishes proportionally to the average lifespan. If the unit is lives, the high mortality rate increases the count of distinct subjects but not necessarily the aggregate welfare duration. The framework does not force a choice; it requires the outcome metric to be defined *ex ante*. However, the scale argument often conflates the two, treating $N$ as a multiplier of welfare capacity without specifying the time dimension. If welfare is episodic per life, $N$ is correct. If welfare is continuous per time, $N$ must be weighted by duration. The translation has the resources to distinguish these but cannot adjudicate which is morally correct; that is a normative specification outside the epidemiologic apparatus.

  **3. Identification, Not Estimation**
  The intervention is ill-defined because ecosystem feedbacks act as endogenous mediators. The effect of policy runs through land use, predator dynamics, and resource availability. You are correct that the scale argument identifies at best a direct effect (e.g., immediate mortality from pesticide), while the total effect includes indirect pathways that may reverse the sign of the welfare change (e.g., pesticide reduces prey, causing starvation vs. quick death). Standard mediation analysis fails here because the mediators are not sequentially ignorable; they are dynamic system properties. Regarding the nature of the uncertainty: the vocabulary of identification handles epistemic failure (missing data, unmeasured confounding) via bias analysis. It cannot express metaphysical vagueness. If the boundary of sentience is not a fact of the matter but a vague predicate, there is no true parameter to identify. This is not an ordinary identification failure solvable by better data; it is a category error in the model specification. The framework assumes a binary or continuous latent trait exists; if the trait is ontologically indeterminate, the model is misspecified.

  **4. Aggregation Across Uncertain Branches**
  The argument treats $0.01 \times W$ as equivalent to $0.01$ of $W$ actual welfare. This relies on the linearity of expectation. Your framework aggregates linearly across persons and takes expectations over uncertainty without hesitation. This linearity is doing real work; it rejects moral risk aversion. In financial HTA, we might apply risk adjustment to uncertain outcomes. In moral uncertainty, linearity implies that a small probability of a catastrophe is equivalent to a guaranteed small harm. If one introduces a utility function over moral outcomes that is concave (risk-averse), the expected value of the insect term shrinks disproportionately relative to certain human welfare terms. The residue here is a gap in your framework. Standard pharmacoepidemiology assumes linear QALY arithmetic. It lacks a parameter for risk aversion over moral stakes. If moral stakes demand non-linear aggregation, the scale argument collapses not because the inputs are wrong, but because the aggregation function is inappropriate for extreme tail risks.

  **Verdict**

  The scale argument is structurally sound only if one accepts the linearity of expectation and the existence of a transportable surrogate validity coefficient. It depends on at least one step that your vocabulary cannot state: the metaphysical status of the latent variable. Your framework assumes the outcome exists and is merely unmeasured. If the boundary of sentience is vague or non-factual, there is no estimand to identify, and no amount of better evidence can resolve the uncertainty. This is not missing data; it is model misspecification at the ontological level. Therefore, the argument is evidentially unresolvable not because of data scarcity, but because the target trial emulates a causal structure that may not exist.
