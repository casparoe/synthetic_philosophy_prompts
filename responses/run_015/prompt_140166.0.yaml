answer: |-
  Spend your first four weeks on causal specificity (a missing question), your next three on the reallocation problem, your final two on category drift as a limitation note, and drop the denominator question entirely.

  **1. Causal Specificity (The Missing Question)**
  *   **The Question:** Even if violence is causally downstream of poverty or state capacity, are direct violence interventions more cost-effective than upstream interventions?
  *   **Upstream/Downstream:** This is upstream of your entire conclusion. If poverty reduction reduces violence at a 1:1 ratio, "violence reduction" is redundant. If poverty reduction has leakage or lag, but cognitive behavioral therapy for at-risk youth has immediate high returns, then "violence" is a distinct priority bucket.
  *   **Tractability:** High. You cannot build new data, but you can synthesize existing meta-analyses (e.g., J-PAL, GiveWell, conflict intervention literature). Your roommate's skepticism about crime trends is irrelevant here; you need intervention effect sizes, not historical crime rates.
  *   **Neglectedness:** High. Public discourse often conflates "cause" with "solution." Donors assume fixing roots fixes branches, but implementation gaps are where the work lies.
  *   **Evidence to Move It:** Find one robust RCT showing upstream interventions failing to move violence metrics where direct interventions succeeded.
  *   **Confidence:** 85%. This is the only question that directly answers the "distinct priority" prompt.

  **2. The Reallocation Problem (Your #2)**
  *   **The Question:** Is the decline in interpersonal violence purchased at the cost of increased structural coercion (incarceration, policing, sanctions)?
  *   **Upstream/Downstream:** Upstream of the ethical recommendation. If "reducing violence" means "expanding the carceral state," your write-up must warn donors about the trade-off. It reframes violence not as a discrete event but as a mode of social control.
  *   **Tractability:** Medium. Comparative data on homicide rates vs. incarceration rates over the last 40 years is available (UNODC, World Prison Brief). You can plot the divergence.
  *   **Neglectedness:** Medium. Critical criminologists focus on this, but effective altruism-style prioritization often ignores it.
  *   **Evidence to Move It:** A strong positive correlation between declining homicide rates and rising incarceration rates in the same jurisdictions during the same period.
  *   **Confidence:** 90%. The data exists, and the philosophical implication (violence vs. coercion) is central to your seminar's ethics focus.

  **3. Category Drift (Your #3)**
  *   **The Question:** Do historical definitions of "war" or "murder" render long-term trend data incomparable?
  *   **Upstream/Downstream:** Downstream of validity. This limits how much you can trust the "violence is declining" narrative, but it doesn't tell you what to do today.
  *   **Tractability:** Low. This is a conceptual rabbit hole. You cannot resolve Kuhnian incommensurability in 20 hours.
  *   **Neglectedness:** Low. Historians debate this endlessly.
  *   **Evidence to Move It:** Specific examples where reclassifying an event (e.g., colonial conflict vs. policing action) changes the trend line significantly.
  *   **Confidence:** 80%. Treat this as a caveat section, not a core argument. It protects you from criticism but doesn't drive the recommendation.

  **4. The Generalized Denominator (Your #1)**
  *   **The Question:** Per what unit do we measure risk (person, hour, interaction)?
  *   **Upstream/Downstream:** Downstream of measurement. It matters for individual risk assessment, not for global prioritization of resources.
  *   **Tractability:** Very Low. Historical exposure data (e.g., person-hours in medieval villages) does not exist.
  *   **Neglectedness:** Low.
  *   **Evidence to Move It:** None available.
  *   **Confidence:** 95%. This is a distraction. Whether a medieval peasant was safer per hour or per year doesn't change whether you should fund modern violence reduction vs. poverty alleviation.

  **Missing Questions & Rabbit Holes**
  The **Denominator** question is your rabbit hole; it feels philosophical but yields no action-guiding output for donors. The **Causal Specificity** question is the one you weren't listing, and it is the load-bearing beam for your practical conclusion. You are asking "Is violence a root cause or a symptom?" but the donor needs to know "Is violence a distinct *intervention point*?"

  **Confidence Flag**
  I am least sure about the **Causal Specificity** tractability (85%). Synthesizing conflicting meta-analyses on poverty vs. violence interventions in 40 hours is tight; if the literature is too fragmented, you may need to pivot time from this to the Reallocation problem, which has cleaner data even if it answers the ethical question less directly.
