answer: |-
  You concede the fatal flaw yourself: if providence is a gamble, the consolation of our doctrine vanishes. We Jesuits defend Middle Knowledge precisely to secure the infallibility of prophecy and the efficacy of grace without violating liberty. If God merely knows you have a 0.7 propensity to accept grace, He cannot promise the salvation of the elect with certainty, only with high probability. That is not the God of Scripture, nor the God of the Council. You ask if this trade is an improvement; I say it is a capitulation to Open Theism, surrendering the very sovereignty we sought to preserve. A God who maximizes expected value rather than securing His ends is a deity who risks failure, and that is incompatible with the absolute perfection of the divine intellect and will.

  As for whether we are committed to this: no. That a creature has a character inclining it toward A does not make it *true* prior to the choice that it *will* do A, nor even that it *would* with a specific probability. Freedom is the power of contrary choice even given identical dispositions. You call the distinction between "would" and "will" a dodge; I call it a category error on your part. The truth of the counterfactual is not grounded in a prior deterministic state or a statistical propensity, but in the divine intellect's comprehensive grasp of the creature's free essence. To demand deterministic grounding for a free truth is to beg the question against liberty itself.
