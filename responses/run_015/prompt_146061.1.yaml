  8.  **Final Polish:**
      *   Use the user's terminology (simmballs, careenium).
      *   Keep it concrete (engineering focus).
      *   Ensure the "price" of each choice is clear.
      *   Make sure the distinction between *implementation* and *description* is the hammer that breaks the chain at (6).

      *(Self-Correction during drafting)*: I need to be careful not to simply say "Reject 3." If I reject 3 too hard, I lose (5), which the user wants to keep. I need to reinterpret (3). The rule doesn't do work *in addition* to physics, it does work *by organizing* physics. It's not "distinct" work, it's the *same* work described differently.
      Actually, the cleaner cut is at (6). (3) is arguably true *if* interpreted as "the structural constraint does work the raw particles wouldn't do without that structure." But (6) assumes *any* description counts as a structural constraint. That's the failure.
      Wait, (3) says "symbolic rule performs causal work that the local substrate physics does not perform on its own." This implies dualism. I should recommend rejecting the "distinctness" claim in (3) while keeping the "efficacy" claim in (5) via realization.
      Actually, the strongest cut is at **(6)**. The inference from (5) to (6) assumes that *any* symbolic description implies an *implemented* constraint. That is false.
      Let's look at (3) again. "Therefore the symbolic rule performs causal work..." This reifies the rule. The *lattice* performs the work. The rule describes the lattice. So (3) is also suspect.
      Okay, the best philosophical move is to attack the equivocation in the term "Symbolic Rule" between (2) and (6). In (2), the rule is *instantiated*. In (6), the rule is *attributed*.

      *Decision:* I will advise cutting at **(6)**, but with a major caveat on **(3)**. The "symbol" in the computer is a physical pattern. The "symbol" in the weather is a human abstraction. The inference from (5) to (6) fails because brains/computers are *semantic engines* (syntax drives semantics via physics), whereas weather is not.

      *Wait, one more nuance:* The user wants to keep (5). If I say "physics does all the work," (5) feels threatened. I need to explain **Causal Relevance** vs. **Causal Sufficiency**. Physics is sufficient. Mental states are relevant because they track the physical organization.

