          *   Reject (4): Saves physics, but makes brains special (dualism risk).
          *   Reject (6): Essential. Distinguishes designed/evolved systems from brute physics.

  7.  **Refining the "Stable Position":**
      *   The stable position is **Causal Structuralism** or **Realization Physicalism**.
