      *   (5) Mental representations have downward causal efficacy. (The desired conclusion).
      *   (6) Analogy extends to *any* system describable by symbols (weather, planets). (The slippery slope).
      *   (7) This eliminates physical causation / makes laws active agents. (The absurdity).
      *   (8) Something must be wrong.

  3.  **Identify the Fault Line:**
      *   The core tension is between *causal powers* and *causal descriptions*.
      *   Premise (3) is the pivot. It claims the *symbolic rule* does work the *substrate* doesn't.
      *   Premise (6) is the overgeneralization. It assumes that because we *describe* weather with Navier-Stokes, the equation *causes* the weather.
      *   The distinction lies in **implementation vs. description**.
      *   In the careenium/computer/brain, the symbolic structure is *physically instantiated* in the arrangement of the substrate (the lattice, the logic gates, the synaptic weights).
      *   In the weather/planets, the equations are *external descriptions* not instantiated as constraints within the system itself.

  4.  **Evaluate the Premises:**

      *   **(1) Local physics underdetermines global transition:** True in a sense (multiple microstates), but false if the system is deterministic and constrained. Let's grant it for the sake of argument (noise, thermal fluctuations).
      *   **(2) Global lattice constraint selects path:** True. The structure matters.
      *   **(3) Symbolic rule performs causal work *distinct* from substrate:** **FALSE.** This is the "Homunculus" or "Ghost in the Machine" error. The rule *is* the lattice. The lattice *is* physical. The "symbol" is an abstraction *we* use to describe the lattice. The causal work is done by the lattice (physics), but the *pattern* of the lattice ensures the outcome matches the rule.
      *   **(6) Any system described by symbols is governed by its description:** **FALSE.** This confuses the map with the territory. Navier-Stokes describes water; it doesn't live inside the water.

  5.  **Formulate the Solution:**
      *   **The Cut:** Reject (3) and (6), but refine (5).
      *   **The Concept:** **Supervenience** and **Realization**.
      *   **Engineering Analogy:** A logic gate isn't magic. It's transistors. The "AND" function is realized by the wiring. The wiring does the pushing. But because the wiring was *designed* to match the truth table, we can say the "logic" caused the output *in virtue of* the physical structure.
      *   **Downward Causation:** It's not "spooky." It's constraint. High-level structures constrain low-level degrees of freedom.
      *   **Distinction:** Engineered/Biological systems (where the pattern is *internal* and *functional*) vs. Natural/Physical systems (where the pattern is *external* and *descriptive*).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Acknowledge the sophistication:* This is a version of the "Causal Exclusion Problem" (Jaegwon Kim) and the "Multiple Realizability" argument (Putnam/Fodor), dressed in engineering terms.
