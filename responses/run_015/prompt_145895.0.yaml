answer: |-
  Dr Evans, a senior registrar in a London ICU, must decide whether to withdraw ventilation from Mr. Grey to save two waiting patients, Ms. White and Mr. Black. Evans assigns 95% credence to utilitarianism, which views reallocation as +10 choice-worthy units (saving two lives) and status quo as 0, but retains 5% credence in a strict deontological theory forbidding active killing, which rates reallocation as -100 units and status quo as 0. While the expected choice-worthiness favours reallocation and utilitarianism is Evans's favourite theory, the worst-case moral value of reallocating is substantially lower than maintaining the status quo.

  **Analysis**

  Under Maximising Expected Choice-worthiness (MEC), the high credence in utilitarianism outweighs the low-probability deontological penalty ($0.95 \times 10 + 0.05 \times -100 = 4.5$), prescribing reallocation. My Favourite Theory (MFT) simply follows the 95% credence view, also prescribing reallocation. However, Maximin compares the worst possible outcome for each action across theories: the minimum for reallocation is -100 (deontology), while the minimum for status quo is 0; thus, Maximin prescribes protecting the individual. The structural feature causing Maximin to peel away is the **asymmetric intensity of the minority theory's prohibition**; the deontological view assigns a disproportionately negative value to reallocation compared to the utilitarian gain. If you strip this feature—normalising the scales so deontology views active killing as merely slightly worse than letting die (e.g., -1 vs -2)—the minimum for reallocation becomes higher than the minimum for status quo, and the disagreement collapses: all three approaches would recommend saving the larger group.

  A defender of Maximin would attack this case as unfair because it presupposes **inter-theoretic comparability**, assuming we can meaningfully assign cardinal values (-100 vs +10) across distinct moral frameworks, a premise many philosophers reject as metaphysically dubious. They would argue that rights violations are not just 'larger negatives' but categorically different, justifying risk aversion. Regarding consensus, it is settled among philosophers working on moral uncertainty that there is **no consensus** on the correct decision rule; MEC is prominent but contested regarding normalization, while MFT and Maximin remain viable minority positions depending on one's view of moral risk. I must admit honestly that this case feels contrived; the specific numerical values required to align MEC and MFT against Maximin rely on precise, arguably artificial scaling assumptions to force the verdict.
