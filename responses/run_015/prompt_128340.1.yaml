answer: |-
  Here is the direct assessment you requested.

  **Your friend is fundamentally mistaken about the definition of prioritarianism.**

  If your friend insists that prioritarianism licenses leveling down—the claim that reducing the welfare of the well-off is good *in itself* even when it benefits no one—they are describing **telic egalitarianism**, not prioritarianism. This is not a minor semantic dispute; it is the central conceptual distinction between the two views.

  Prioritarianism was explicitly formulated (most notably by Parfit) to capture the moral intuition that we should prioritize the worse off *without* incurring the commitment to the intrinsic value of equality that triggers the leveling-down objection.

  Here is the breakdown of the conceptual terrain, the implications for intergenerational policy, and where the actual vulnerabilities lie.

  ### 1. The Core Conceptual Error
  **The Claim:** Prioritarianism accepts leveling down.
  **The Reality:** Pure prioritarianism rejects leveling down entirely.

  *   **Telic Egalitarianism** holds that inequality is intrinsically bad. Therefore, a state of affairs where everyone is equally miserable is, in one respect (the equality respect), better than a state where everyone is happy but unequal. This view implies leveling down is *pro tanto* good.
  *   **Prioritarianism** holds that the moral value of a benefit diminishes as the recipient's absolute welfare level increases. It is **non-relational**. It does not care about the gap between Person A and Person B. It cares only about Person A's absolute level and the weight attached to it.

  If you reduce the welfare of the well-off without increasing the welfare of the worse-off, a prioritarian sees a loss of weighted welfare and **zero gain**. There is no "equality gain" to offset the loss. Therefore, leveling down is strictly bad, all things considered.

  If your friend's argument rests on the premise that prioritarianism values equality for its own sake, their argument does not apply to prioritarianism. It applies to a straw man.

  ### 2. Implications for Intergenerational Trade-offs
  You asked about policies involving trade-offs between equality and aggregate well-being across temporal groups (e.g., taxing the present to protect the future).

  **The Dissolution of the Trade-off**
  Prioritarianism does not recognize a trade-off between "equality" and "aggregate well-being." It recognizes a trade-off between **unweighted aggregate well-being** (Utilitarianism) and **priority-weighted aggregate well-being** (Prioritarianism).

  In an intergenerational context:
  1.  **Scenario:** The present generation is well-off. The future generation is projected to be worse off due to resource depletion.
  2.  **Policy:** Tax the present to invest in sustainability for the future.
  3.  **Prioritarian Assessment:** This transfer is justified not because it narrows the gap between generations (equality), but because the moral weight of the welfare units gained by the future people outweighs the moral weight of the welfare units lost by the present people.

  **Does this look like leveling down?**
  Sometimes, the *outcome* of a prioritarian calculation might resemble leveling down superficially, but the *justification* is distinct.
  *   If a policy harms the present generation significantly to give a tiny benefit to the future generation, a utilitarian would reject it (net loss).
  *   A prioritarian might accept it if the future generation is sufficiently badly off that the priority weight flips the calculation.
  *   **Crucial Distinction:** If the policy harmed the present generation *without* benefiting the future generation, the prioritarian must reject it. If they accept it, they are no longer doing prioritarianism; they have slipped into egalitarianism.

  ### 3. Where the Objection Actually Bites (Contested Interpretations)
  While the standard leveling-down objection fails against prioritarianism, there are nuanced interpretations where the view faces structural problems that *feel* like leveling down. You must flag these distinctions in your argument.

  **A. Ex Ante vs. Ex Post Prioritarianism**
  *   **Ex Post:** We weigh welfare based on the actual outcome levels. This is the standard view described above. It clearly rejects leveling down.
  *   **Ex Ante:** We weigh prospects based on expected utility before outcomes are realized.
      *   *Contested Point:* Some argue that ex ante prioritarianism can violate the Pareto principle in ways that mimic leveling down logic under uncertainty. If we don't know which generation will be which, we might choose a policy that lowers the expected total welfare to improve the prospect of the worst-off position. This is not strict leveling down, but it is a violation of "Pareto efficiency" that critics attack similarly.

  **B. The "Excessive Sacrifice" Objection**
  This is the real threat, not leveling down.
  *   If the priority weighting function is sufficiently steep (i.e., the worse off matter *much* more than the well-off), prioritarianism might demand sacrifices from the well-off that are intuitively excessive.
  *   *Example:* Taxing the present generation into misery to provide a marginal gain to a future generation that is only slightly worse off than subsistence.
  *   *Difference from Leveling Down:* This still benefits someone. Leveling down benefits no one. But the practical implication for policy is similar: destructive redistribution. Your friend may be conflating "destructive redistribution" with "leveling down."

  **C. The Non-Identity Problem (Intergenerational Specific)**
  *   *Contested Point:* Prioritarianism is typically person-affecting. It requires specific individuals to receive the benefit. In intergenerational policy, different policies often bring different people into existence (the non-identity problem).
  *   If the future people who benefit from the policy would not have existed otherwise, can we say they are "better off"?
  *   If prioritarianism cannot handle non-identity cases without modification, it may fail to guide intergenerational policy entirely. This is a failure of applicability, not a commitment to leveling down, but it leaves the view vulnerable in the exact domain your friend cited.

  ### 4. Summary of Implications for Policy Assessment
  When assessing policies with unavoidable trade-offs between temporal groups:

  1.  **Do not measure equality.** Do not calculate the Gini coefficient or the gap between generations. Prioritarianism assigns no value to narrowing the gap.
  2.  **Calculate Weighted Sums.** Assign a weight to every unit of welfare based on the absolute level of the recipient. Sum these weighted units. Choose the policy with the highest total.
  3.  **Reject Pure Sacrifice.** If a policy lowers the weighted sum (e.g., by harming the rich without helping the poor), prioritarianism forbids it. If your friend claims prioritarianism allows this, they are incorrect.
  4.  **Watch the Weighting Function.** The only way prioritarianism becomes "destructive" is if the weighting function is so steep that it mandates crushing the well-off for negligible gains to the worse-off. This is a parameter choice within the theory, not a structural necessity like it is for egalitarianism.

  ### Final Verdict on Your Argument
  Your framing presupposes the objection succeeds. **It does not succeed against standard prioritarianism.**

  You should correct your friend's taxonomy. The dilemma they present ("accept destructive equality or abandon the view") is the correct dilemma for **Telic Egalitarianism**. It is a false dilemma for **Prioritarianism**.

  Prioritarianism abandons the intrinsic value of equality precisely to avoid the leveling-down objection. If a view accepts leveling down, it is, by definition, not prioritarianism. Your debate should shift from whether prioritarianism accepts leveling down (it doesn't) to whether the **priority weighting function** can be calibrated to avoid demanding excessive sacrifices from the present generation without slipping back into utilitarianism. That is the actual contested terrain.
