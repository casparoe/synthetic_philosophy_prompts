answer: |-
  A London foundry revives a high-contrast Didone, specifying wedge-shaped terminals (sharp serif edges) and a tight, closed 'e'. They draft two 'a's. Candidate One is the print-standard double-storey (two closed loops), but drawn with even strokes and blunt cuts; recognized instantly in isolation, it jars against the face's sharp rhythm. Candidate Two is the handwritten single-storey (one loop), but constructed from the face's own DNA: high contrast, wedge terminals, and a bowl struck from the same circle as the 'o'; it sits seamlessly in text but confuses readers knowing only print forms. Neither is a bad drawing; both are competent glyphs failing different tests.

  Three accounts assess them. Account (a), Prototype, selects Candidate One: it matches the stored checklist of 'a' features (closed upper bowl). Account (b), Style, selects Candidate Two: identity is downstream of the face's manner; Candidate One is a stylistic impostor. Account (c), Differential, initially agrees with (b): within the Roman system, Candidate Two maintains visual harmony without confusing neighbours. Here, (b) and (c) converge on Candidate Two, while (a) stands alone on Candidate One.

  Now stipulate the family includes a companion italic, where the 'a' is conventionally single-storey to mark emphasis. This changes nothing for (a): Candidate One remains the prototype regardless of neighbours. It changes nothing for (b): Candidate Two remains the stylistic match for the Roman weight; the italic's style is a separate downstream concern. But (c) flips. If the Roman also uses a single-storey 'a', the structural contrast between Roman and Italic collapses; the system loses a primary signal for emphasis. To preserve the differential role, (c) now demands Candidate One (double-storey) to distinguish the Roman 'a' from the Italic 'a'. The variable is *systemic distinctness*. Accounts (a) and (b) are structurally blind to it because (a) looks only at intrinsic features and (b) looks only at internal style consistency; neither scans the wider family tree for contrastive roles.

  The honest part: the work was done by *relational necessity*. Remove the Italic, and (c) collapses back into (b), proving nothing except that context matters. A defender of (a) would attack this by saying I've staged a row about typographic color and system management, mislabelled as letter identity. They'd argue an 'a' is an 'a' regardless of its italic neighbour; if the system breaks, that's a design failure, not an ontological one. The case proves only that legibility is relational, not that identity is. If the verdict depends on whether an italic exists, we aren't discussing what makes an 'a' an 'a', but what makes a font family functional. The differential account risks conflating the letter's being with its utility, leaving the prototype defender free to claim they alone are discussing the letter itself, while the rest of us are merely discussing its job.
