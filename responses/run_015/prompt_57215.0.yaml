answer: |-
  **1. Brainstorming and Selection**
  Four candidate structural features bear weight here: (1) the aggressor's internal regime stability (whether concession triggers collapse); (2) the terrain's defensibility (whether concession is reversible); (3) the patron's logistical reach (whether support is sustainable); and (4) the patron's formal treaty obligation (whether intervention is legally binding). I select **the patron's formal treaty obligation**. Unlike logistical reach, which relies on intelligence estimates, treaty status is public record. Unlike regime stability, it is not hidden. It alters the guarantor's risk calculus directly: in one case, resistance risks a wider war; in the other, it does not. This feature is often dismissed by analogical thinkers as "paper" compared to the "real" lesson of history, making it ideal for demonstrating analogical blindness.

  **2. Precedent Crisis (P): The Kessel Incident (1938)**
  In 1938, the autocratic state of Ruria demanded the border province of Kessel from the small republic of Valla. Allaria, Valla's democratic guarantor, faced a choice. Magna, Ruria's hegemonic patron, held a defense pact with Ruria but had publicly signaled indifference to border disputes. Allarian statesmen invoked the "Lesson of Kessel": aggressors bluff when patrons are lukewarm. Allaria mobilized firmly. Magna did not intervene, citing the pact's irrelevance to border tweaks. Ruria, lacking fuel reserves for a prolonged fight, withdrew. The resulting slogan among Allarian strategists became: "Paper guarantees do not deter; firmness exposes isolation." This lesson hardened into doctrine, prioritizing resolve over diplomatic fine-print.

  **3. Crisis A: The Valla Incident (1952)**
  In 1952, Ruria again demanded Kessel from Valla. The diplomatic choreography mirrored 1938: ultimatums, minor skirmishes, League mediation. Allaria's domestic politics were identical: a war-weary electorate, a hawkish opposition. The military balance was unchanged: Ruria held local superiority, Allaria held naval command. Crucially, the Magna-Ruria Defense Pact had expired in 1950 and not been renewed, a fact widely reported in press and parliamentary records. Allarian leadership, recalling the "Lesson of Kessel," argued the pact was dead letter regardless. They chose **Firmness**: mobilization and rejection of demands. Ruria, finding Magna unwilling to intervene without a treaty obligation, backed down. The analogy held; firmness succeeded.

  **4. Crisis B: The Valla Incident (1955)**
  In 1955, Ruria demanded Kessel from Valla. Every feature matched 1952: same leaders, same military balance, same domestic pressures in Allaria, same sequence of demands. The diplomatic script was identical. However, unknown to the *logic* of the analogy but known to the *facts*, the Magna-Ruria Defense Pact had been renewed publicly in 1954, explicitly covering border integrity. Allarian leadership, invoking the "Lesson of Kessel," argued treaties were "scrap paper" when aggressors bluff. They chose **Firmness**: mobilization and rejection. Ruria, bound by the renewed pact, called in Magna. Magna intervened to honor the treaty. Allaria faced a wider war. The correct course had been **Accommodation**: conceding Kessel to isolate the conflict, as resistance triggered the patron.

  **5. Demonstration**

  **Case A (1952):**
  (i) **Analogical Inference:** The "Lesson of Kessel" dictates that patrons bluff. Therefore, firmness will expose Ruria's isolation without triggering Magna.
  (ii) **Correct Reasoning:** The defense pact has lapsed. Magna has no legal or strategic imperative to fight for Kessel. Firmness coerces Ruria safely.
  (iii) **Convergence:** The analogy delivers the correct policy. The structural feature (lapsed treaty) aligns with the precedent.

  **Case B (1955):**
  (i) **Analogical Inference:** The "Lesson of Kessel" dictates that patrons bluff. Therefore, firmness will expose Ruria's isolation without triggering Magna.
  (ii) **Correct Reasoning:** The defense pact is active and public. Magna's credibility depends on enforcement. Firmness triggers Magna's intervention. Accommodation limits the loss to Valla rather than risking Allaria.
  (iii) **Divergence:** The analogy fails. It treats the treaty status as irrelevant "paper" based on P, whereas the structural feature (active treaty) makes the patron's intervention rational and binding.

  **The Feature:** The **Patron's Formal Treaty Obligation**.
  **The Mechanism:** In P and A, the lack of obligation makes intervention costly for the Patron with little reputational gain, so they abstain. In B, the active obligation makes *abstention* costly (reputational collapse of the alliance system), so they intervene. The analogy assumes the Patron's cost-benefit analysis is static (always abstain), but the treaty changes the cost of *inaction*.

  **6. Self-Critique: Rigging and Hindsight**
  (a) **Rigging:** Have I built the right answer into the description? I must ensure the treaty renewal isn't just a label for "Magna wants war." I specified the pact covers "border integrity," making intervention a legal necessity rather than a discretionary choice. The reversal comes from the change in the Patron's incentive structure, not a stipulated outcome. However, one could argue that a renewed pact *is* just a signal of intent, making the distinction semantic. I contend it is structural because treaty obligations create domestic legal hurdles for the Patron's leadership that mere intent does not.
  (b) **Hindsight:** Is the feature identifiable ex ante? Yes. Treaty renewals are public acts of state, reported in newspapers and parliamentary debates. An analyst in 1955 could know the pact was renewed without knowing the war's outcome. The failure is not intelligence, but the *weighting* of that intelligence against the historical lesson.

  **7. The Strongest Objection**
  A defender of disciplined analogical reasoning would argue: "Your case does not demonstrate the failure of analogy, but the failure of *sloppy* analogy. A proper analogical method requires tabulating scope conditions. If the statesmen had listed 'Status of Patron Pact' as a variable, they would have seen the disanalogy between P/A and B. Your exercise proves only that slogans replace analysis, not that analogy itself is flawed."

  **Response:** This objection lands partially. It correctly identifies that *methodological* rigor could save the decision. However, it underestimates the epistemological power of a "lesson." When a precedent becomes a slogan ("Paper guarantees do not deter"), it actively *devalues* contrary data (the renewed treaty) as noise. The exercise shows that even visible, structural differences are overridden when the historical lesson becomes a heuristic for dismissing evidence. The analogy doesn't just fail to match; it actively blinds the user to the matching feature.

  **8. Confidence and Uncertainty**
  I am **85% confident** in the central claim that this pair generates a genuine policy reversal based on a visible structural difference. The mechanism (treaty obligation altering patron incentives) is robust in international relations theory.

  The point about which I am **least sure** is whether the "active treaty" in Case B is sufficiently distinct from "intent" to avoid the charge of rigging. A skeptic might argue that a patron willing to fight would renew the treaty, and one unwilling would not, making the treaty merely a proxy for intent (which might be hidden). To settle this, one would need historical instances where states honored treaties they preferred to ignore, or ignored treaties they preferred to honor, due to domestic legal constraints independent of strategic intent. Without empirical validation of that specific legalistic mechanism, the construction relies on the assumption that legal form constrains state action independently of strategic will.
