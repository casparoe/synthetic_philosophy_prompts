answer: |-
  ### Preamble: Constitution of the Agent vs. Metaphysics of Cognition

  We must settle immediately whether this list constrains a **metaphysics of cognition** (an account of what makes any process cognitive) or a **criterion of constitution** (a test for when a vehicle is part of a specific cognitive *agent*). This distinction is not merely terminological; it determines the extension of the theory. A metaphysics of cognition might classify using a public map (Case 7) or a shared notebook (Case 2) as cognitive processing. However, for the adjudication target specified—distinguishing intrusion on the *person* from damage to *property*—this is insufficient. Tampering with a public map is vandalism; tampering with my occipital lobe is assault. Both may support cognition, but only the latter is constitutive of *me*.

  Therefore, this list constrains a **criterion of constitution for the cognitive agent**. It is not asking "Where does cognition happen?" but "Where do *I* end?" The desiderata must filter for vehicles that are not merely used by the subject but are integral to the subject's identity and agency such that interference constitutes a violation of the self. A theory that successfully maps cognitive processes generally will fail this adjudication target if it cannot draw a boundary around the rights-bearing unit.

  ### The Desiderata

  **1. The Disruption Constraint**
  *   **(a) Statement:** A vehicle is constitutive only if its degradation or removal produces cognitive deficits indistinguishable in kind (not just degree) from biological impairment, reorganizing the subject's stream of thought.
  *   **(b) Motivating Cases:** *Latency (1)* and *Degradation without phenomenology (8)*. If a device slows response from milliseconds to seconds (1), the thought stream reorganizes around the delay; it is no longer real-time cognition. If a device degrades silently (8) but alters reasoning outputs, it functions as a neural lesion rather than a broken tool.
  *   **(c) What it rules out:** Tools where failure results in mere inconvenience or a switch to backup strategies (e.g., losing a paper notebook vs. losing an implanted memory chip). It rules out resources that are useful but not integrated into the temporal flow of thought.
  *   **(d) Status:** **Non-negotiable.** For adjudication, the harm profile must match bodily harm to justify rights protection equivalent to bodily integrity.

  **2. The Agential Accessibility Constraint**
  *   **(a) Statement:** The subject must be able to monitor and interact with the vehicle's operations as a cognitive resource, regardless of initial consent, such that the vehicle is responsive to the subject's epistemic goals.
  *   **(b) Motivating Cases:** *Unendorsed prosthesis (4)* and *Opaque drift (3)*. An implant mandated by a court (4) may become indispensable; if it is inaccessible to the subject's monitoring, it is a shackle, not a mind. Similarly, if an algorithm surfaces memories without auditability (3), the subject is being guided, not thinking.
  *   **(c) What it rules out:** Black-box systems that determine outputs without subject oversight, and coerced devices that remain opaque. It distinguishes between a tool I use and a system that uses me.
  *   **(d) Status:** **Non-negotiable.** Cognitive liberty requires that the subject retain authority over the processes constitutive of their judgment.

  **3. The Integrity Constraint**
  *   **(a) Statement:** The vehicle must maintain a stable mapping between input and output over time such that silent changes to the vehicle's function constitute changes to the subject's cognitive dispositions.
  *   **(b) Motivating Cases:** *Silent substitution (5)* and *Opaque drift (3)*. If a device is swapped and outputs diverge subtly over months (5), this is mind-editing, not tool replacement. The subject's identity is tied to the stability of the cognitive loop.
  *   **(c) What it rules out:** Systems where the functional role is volatile or externally manipulated without notification. It prevents the classification of mutable external data stores as "memory" if the contents are subject to silent external revision.
  *   **(d) Status:** **Non-negotiable.** Without this, the boundary of the self becomes permeable to unauthorized manipulation, defeating the adjudication target.

  **4. The Individuation Constraint**
  *   **(a) Statement:** The cognitive system must be assignable to a single rights-bearing subject; constitutive vehicles cannot be jointly constitutive of multiple distinct minds in a way that merges their agency.
  *   **(b) Motivating Cases:** *Shared custody (2)* and *Public infrastructure (7)*. A shared lab notebook (2) supports two minds, but cannot be *one* mind for legal purposes. A public clock (7) supports everyone but belongs to no one.
  *   **(c) What it rules out:** Distributed cognitive systems where agency is genuinely shared or overlapping. It forces a decision: the notebook is either property shared by two minds, or it is part of one mind and property for the other. It cannot be constitutive of both equally.
  *   **(d) Status:** **Negotiable (Theoretically), Non-negotiable (Legally).** Metaphysically, coupled systems might be one mind. For adjudication, we must enforce individuation to assign liability and rights.

  **5. The Activation Constraint**
  *   **(a) Statement:** A vehicle is constitutive only when actively engaged in the cognitive loop, not merely when available as a standby resource.
  *   **(b) Motivating Cases:** *Standby redundancy (6)*. A cloud backup that duplicates memory but is never consulted (6) is property, not mind. Protection attaches to the process of using, not the potential to use.
  *   **(c) What it rules out:** Protecting all potential cognitive aids as part of the person. It limits the scope of "cognitive liberty" to active cognitive processes, preventing an infinite expansion of the protected self into the environment.
  *   **(d) Status:** **Preference of one camp.** Internalists demand this; Extended Mind proponents often reject it (arguing dispositional access is enough). For adjudication, it is necessary to prevent overreach.

  ### Analysis of Incompatibilities and Exclusion

  **1. Incompatibilities**
  There are two critical tensions where the desiderata cannot be jointly satisfied without compromise:

  *   **Individuation vs. Shared Custody (Case 2):** The **Individuation Constraint** demands one mind per subject for rights attribution. However, the phenomenology of *Shared Custody* suggests a resource can be automatically and trustingly consulted by two people as if it were their own memory. If we satisfy Individuation, we must deny that the shared notebook is constitutive for both simultaneously (perhaps it is constitutive for neither, or only during active use by one). If we satisfy the cognitive reality of the coupling, we allow overlapping minds, which collapses legal standing (who consents to a search?). A non-question-begging criterion of constitution (based on functional coupling) encourages overlap; the adjudication target (based on rights) forbids it.
  *   **Agential Accessibility vs. Skull/Skin Specialness:** The **Agential Accessibility Constraint** implies that an implanted device (inside the skin) that is opaque and unendorsed (Case 4) might *not* be constitutive of the mind (it's a shackle), while an external device that is transparent and trusted *is*. This conflicts with the intuition that the skull and skin mark a special metaphysical boundary. If we keep the skin as the hard boundary, we violate Agential Accessibility (protecting opaque implants as "self"). If we follow Agential Accessibility, the skin loses its metaphysical privilege, making boundary disputes (e.g., wearables vs. implants) legally volatile.

  **2. The Most Exclusionary Requirement**
  The **Individuation Constraint** does the most exclusionary work.
  *   **Why:** The obvious candidate is the **Disruption Constraint**, which rules out simple tools. However, functionalist theories can easily expand "disruption" to include losing a phone. The Individuation Constraint is harder to satisfy because modern cognition is increasingly distributed and collaborative (Case 2). To make the theory usable for adjudication, we must forcibly sever coupled systems into discrete units corresponding to biological humans. This excludes genuinely distributed cognitive systems from counting as single agents, regardless of their functional integration. It prioritizes legal tractability over cognitive reality.

  **3. Scorecard**

  *   **Extended/Parity View:** Passes Disruption and Activation; fails Individuation (allows overlapping minds); struggles with Agential Accessibility (trust vs. audit).
  *   **Internalist (Brain-Bound):** Passes Individuation and Agential Accessibility (by fiat); fails Disruption (ignores real cognitive loss from device removal); fails Activation (ignores external reliance).
  *   **Functionalist (Vehicle-Neutral):** Passes Disruption and Activation; fails Individuation (vehicles are interchangeable, boundaries dissolve); fails Integrity (opaque algorithms count if functional).
  *   **Enactive/Mark-of-Cognitive:** Passes Agential Accessibility and Disruption (focus on coupling); struggles with Individuation (agent-environment systems are hard to bound); passes Integrity (focus on autonomy).

  ### Distortion Check

  Does the adjudication target distort the list? **Yes.**
  A metaphysically accurate taxonomy of cognition might well conclude that minds can overlap (Case 2) or that opaque algorithms constitute part of the cognitive system if functionally integrated (Case 3). However, institutional questions (rights, liability, privacy) require discrete, bounded agents. To serve the adjudication target, this list prioritizes **Individuation** and **Agential Accessibility** over pure functional integration. We are forced to draw boundaries where nature may not have them, excluding genuinely coupled systems from "constitutional" protection to ensure there is a clear subject to protect. The best taxonomy of cognition is not the one that settles institutional questions; the latter requires a pragmatic fiction of the bounded self that the former might reject.
