answer: |-
  **Exam Question**

  **Epistemology Final: Easy Knowledge and Track-Record Arguments**

  **Time Allowed:** 75 Minutes
  **Instructions:** Answer the following question. Do not cite specific authors or texts. Rely on the case provided and your understanding of the concepts.

  **The Case:**
  Mira has noticed that some of her dreams seem to anticipate the next day — she dreams about a flat tire and next morning the tire is flat, she dreams about a friend she hasn't thought about in years and that friend texts her that afternoon. So she starts a journal: every morning she writes down the night's dream, and every evening she marks whether anything in it matched the day. After a year she counts up the entries that have a recorded match, finds a few dozen of them, and concludes that her dreams are weakly predictive of the following day. On that basis she starts treating a vivid dream as evidence about tomorrow — she cancels a flight because she dreamed about a crash. Her flatmate says this is circular, she's using the dreams to license the dreams. Mira says no, it's just an ordinary track-record argument, same shape as the one that establishes a thermometer works.

  **The Question:**
  Defend a verdict on whether Mira is epistemically justified in trusting her dreams. In doing so, you must: (1) Explain exactly what is wrong with Mira's reasoning, distinguishing it from the standard "gas gauge" bootstrapping case; (2) Describe what a non-bootstrapping track-record argument for this conclusion would require; and (3) Assess whether the objection to Mira's reasoning proves too much by threatening ordinary sources like memory or induction.

  ***

  **Model Answer**

  Mira is not epistemically justified in trusting her dreams, but her flatmate is wrong to diagnose the problem as simple circularity. Mira's case differs structurally from the standard bootstrapping problem, and recognizing this difference is crucial for understanding why her reasoning fails without collapsing into global skepticism.

  In the standard gas-gauge case, a driver looks at the gauge to believe the tank is full, then looks at the tank to confirm the gauge is reliable. The objection is that the driver uses the gauge to generate the belief about the tank that confirms the gauge. This is epistemically circular: the source validates itself. Mira's case is different. She does not use the dream to believe the event occurred; she perceives the event independently. When she checks if the tire is flat, she uses perception, not the dream. Therefore, she has independent access to the truth-maker. Her argument is not structurally bootstrapping in the Cohen sense because the verification data (the day's events) is causally independent of the source (the dream).

  However, Mira is still unjustified. The flaw lies in the **interpretive flexibility** of the "match." Dreams are vague; days are complex. By counting only the entries that match, she engages in confirmation bias. She likely ignores the hundreds of dreams that did not come true or stretches the meaning of "match" to fit the data. A valid track-record argument requires fixed verification criteria established *before* the data is collected. Mira records the dream content beforehand, which is good, but she does not fix what counts as a success. If she defined "predictive" as "specific event X occurs within 24 hours" and counted misses equally, her track record might be legitimate. As it stands, she is shooting first and drawing the target later.

  This distinction matters for the "proves too much" objection. If we claim Mira's reasoning is invalid simply because it is a track-record argument, we threaten memory and induction. We justify memory by remembering past successes; we justify induction by observing past regularities. If all track-record arguments are banned as circular, we lose these foundational tools. Therefore, the objection cannot be that Mira uses a track record. It must be that she uses a *biased* track record.

  Memory and induction survive this objection because they typically involve independent checks or fixed criteria. When I check my memory against a photograph, the photograph is independent. When I test a scientific hypothesis, I define success conditions beforehand. Mira fails because she allows the source (the dream) to influence the interpretation of the check (the match).

  Thus, Mira's verdict is negative, but not because reliabilism fails generally. It fails here because her process is not reliable—it is biased by selection and vagueness. The gas-gauge case blocks knowledge because the verification is dependent on the source. Mira's case blocks knowledge because the verification is manipulated by the believer. We can reject Mira's conclusion without rejecting track-record arguments entirely. We must only demand that the track record be honest: independent verification, fixed criteria, and accounting for misses. Mira meets the independence condition (the crucial detail distinguishing her from the gas gauge), but fails the criteria condition. Therefore, her belief is unjustified, but the structure of track-record justification remains intact for sources that meet these stricter conditions.

  ***

  **Marking Scheme**

  **Total Marks:** 20 (5 Points × 4 Marks)

  | Point | Requirement | Common Pitfall (How students lose marks) |
  | :--- | :--- | :--- |
  | **1. Verdict** | Clearly states Mira is **unjustified** (or justified with very strong caveats). | Fails to commit; hedges endlessly without a clear conclusion. |
  | **2. Diagnosis** | Identifies the error as **confirmation bias/interpretive flexibility**, not just "circularity." | Treats Mira's case as identical to the gas gauge (structural circularity) without distinction. |
  | **3. The Detail** | Identifies that Mira has **independent access to verification** (the day's events) unlike the gas gauge driver. | Misses the independence of the worldly events; claims she uses dreams to check dreams. |
  | **4. Valid Track-Record** | Specifies that a valid argument needs **fixed success criteria** and counting **misses**, not just hits. | Vaguely says "needs more evidence" without specifying methodological constraints (criteria/counting). |
  | **5. Proves Too Much** | Argues that banning *all* track records kills **memory/induction**, so the ban must be specific to bias/circularity. | Accepts the flatmate's view fully and concedes that memory/induction are also unjustified (skepticism). |

  **Grade Distinction:**
  *   **16–20 Marks (A Range):** Explicitly identifies **Point 3 (The Detail)**. Explains that Mira's argument is *structurally* sound (independent verification) but *executed* poorly (bias). Distinguishes clearly between "bootstrapping" (gas gauge) and "bad induction" (Mira).
  *   **12–15 Marks (B Range):** Correctly verdicts Mira as unjustified and discusses bias, but treats the case as fundamentally identical to the gas gauge (structural circularity). Misses the epistemic significance of the independent verification detail.

  **Note to Markers:** The crucial differentiator is Point 3. A student who treats Mira's case as exactly the same as the gas gauge case cannot score above 15 marks, even if their writing is excellent. They must find the shift in the verdict basis.
