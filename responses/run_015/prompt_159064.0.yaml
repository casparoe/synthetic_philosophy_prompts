answer: |-
  The claim that Berkeley's immaterialism is merely compatible with monetary nominalism understates the metaphysical violence it inflicts upon metallism. To assume immaterialism is to deny the existence of mind-independent substance. Consequently, the metallist premise that money's value can be anchored in the physical properties of a scarce substance collapses immediately. Metallism requires that value survive the collapse of convention because it is grounded in a natural kind existing outside the mind. But if *esse est percipi*, there is no "outside" for value to hide in. Gold's scarcity is not a property of a mind-independent object; it is a regularity in the order of ideas sustained by the Divine Legislator. Therefore, immaterialism does not just accommodate nominalism; it necessitates it by removing the ontological floor beneath the metallist's feet.

  Your friend's objection relies on a distinction that immaterialism renders superficial. They argue that while both gold and digital tokens rely on regularities, gold's supply is fixed by nature (God), whereas a token's supply is fixed by agreement (man). Thus, gold offers a more robust anchor. This steelmans the metallist position by conceding the immaterialist metaphysics while preserving a pragmatic hierarchy of value. However, this distinction fails to save metallism because it concedes the core nominalist point: value is constituted by regularities of expectation, not intrinsic substance. Under immaterialism, the "fixity" of gold is simply a more stable divine convention. It is still a convention. Query 25 explicitly asks whether gold and silver are not "tickets or counters for reckoning, recording, and transferring." If gold is a ticket, its materiality is functionally irrelevant to its monetary essence. The contrast between natural and conventional scarcity does not collapse entirely, but it is reinterpreted from an ontological difference (matter vs. mind) to a difference in the source of the regularity (divine sustenance vs. human code). Neither offers a mind-independent anchor because neither exists outside the perceptual order.

  This reinterpretation yields a non-obvious conclusion regarding digital tokens. One might assume gold is the superior Berkeleyan counter because its regularity is divinely sustained. However, gold is metaphysically deceptive. It tempts the mind into the error of believing value resides in the lump itself—a form of idolatry incompatible with immaterialism. A digital token, whose scarcity is openly acknowledged as a function of code and agreement, is arguably the more honest Berkeleyan money. It admits what Query 23 suggests: that the true idea of money is "altogether that of a ticket or counter." Gold masquerades as substance; crypto admits it is sign. If money is essentially a denomination of proportion (Query 25), then a token that explicitly functions as a pure unit of account without the pretense of commodity-value aligns better with the immaterialist ontology. The digital token does not pretend to be what it is not; it owns its status as a counter within a system of ideas.

  This leaves the second objection: if money is merely a ticket, what prevents the sovereign from issuing them without limit? If there is no metal anchor, why did Berkeley care about credit and order? The metallist assumes the constraint must be external (the stock of bullion). The Berkeleyan nominalist locates the constraint internally, within the relational proportion between money and industry. Query 23 asks whether money is a "measure" or "pledge." If money is a ticket claiming a share of real wealth (labor, produce, industry), then issuing tickets without increasing the underlying wealth dilutes the claim. The value of things is a "compounded proportion of demand and plenty." Overissuance disrupts this proportion not because it violates a physical law of metals, but because it breaks the conventional trust that the ticket represents a claim on future industry.

  Berkeley's constraint is not the scarcity of the counter, but the capacity of the nation to redeem the promise the counter represents. Unlimited minting destroys the utility of the ticket as a measure of proportion. It renders the counter useless for "reckoning, recording, and transferring" because the unit of account becomes unstable. The anchor is not a mind-independent natural kind, but the mind-dependent reality of public credit and productive capacity. The sovereign cannot print value because value is not in the paper or the gold; it is in the industry the money stimulates. To print without industry is to issue tickets for a play that isn't happening.

  Therefore, the metallist has no fallback. They cannot appeal to matter, because immaterialism denies it. They cannot appeal to mind-independent scarcity, because all scarcity is experienced regularity. They cannot appeal to intrinsic value, because Query 23 rejects intrinsic value in favor of the ticket theory. The distinction between gold and crypto is merely a difference in the stability of the convention, not a difference in ontological grounding. The constraint on issuance is not the vault, but the workshop. Berkeley's immaterialism commits us to a nominalism where money is a pure instrument of social coordination, anchored not in the earth, but in the collective expectation of industry. To hold otherwise is to cling to the fiction of substance that Berkeley's entire philosophy was designed to dismantle. The nominalist position is not just compatible with immaterialism; it is the only monetary theory that survives the removal of matter.
