answer: |-
  This is not you staring too long. You have identified a genuine structural tension in international law and human rights politics. It is a robust observation, but your grouping of the "three places" contains a category error that an examiner will likely target.

  Here is the carving you asked for: the nearest concepts, the critique of your grouping, a proposed name if you need one, and the boundary cases.

  ### 1. Is this one phenomenon or three?
  **Verdict:** It is **two** phenomena masquerading as one.

  *   **Cases 1 (Diplomatic) and 3 (Inconsistent/Political)** are the same phenomenon. This is a **political-strategic** delay. The evidence might exist, but the *cost* of naming is deemed too high. The "caution" is a pretext for avoiding obligation.
  *   **Case 2 (Historical/Archival)** is a different phenomenon. This is an **epistemic** delay. Historians do not name it early because the *archive is closed*, not because they are avoiding political cost. The "lag" here is a function of knowledge production, not political strategy.

  **The Viva Risk:** If you argue that the historian waiting for files is doing the *same thing* as the Foreign Office waiting for a court ruling, you will be accused of conflating *uncertainty* with *ambiguity*.
  *   **Uncertainty:** We literally do not know the facts yet (Case 2).
  *   **Ambiguity:** We know enough to suspect, but the legal bar is high enough to deny certainty (Case 1 & 3).

  **Fix:** Keep Case 2 as a *comparison* (showing how the label functions differently when political stakes are removed), not as evidence of the same mechanism. Your core chapter should focus on the **live decision** (Cases 1 & 3).

  ### 2. The Conceptual Carving
  Your intuition about "Verdict vs. Diagnosis" is the strongest theoretical hook you have. Here is how to sharpen it using existing concepts without drowning in citations.

  **A. Speech Act Theory (Austin/Searle)**
  You recalled Austin correctly. He distinguishes between:
  *   **Verdictives:** Acts that deliver a finding (e.g., a judge sentencing, a jury ruling). These require *authority* and *proof*.
  *   **Exercitives:** Acts that exercise power or create obligations (e.g., declaring war, signing a treaty).
  *   **The Conflict:** The G-word is unique because it functions as a **Verdictive** (it requires legal proof of intent) but is demanded as an **Exercitive** (it is meant to trigger intervention/prevention).
  *   **The Gap:** States exploit the Verdictive requirements (intent, court ruling) to neutralize the Exercitive force (obligation to act).

  **B. Securitization (Copenhagen School)**
  *   **Concept:** Moving an issue from "normal politics" to "emergency politics" justifies exceptional measures.
  *   **Application:** Naming genocide is the ultimate securitizing move. States resist it not just because of legal purity, but because it triggers a demand for exceptional action (intervention, sanctions) they do not want to pay for.
  *   **Difference:** Securitization explains *why* they resist. Your "Verdict/Diagnosis" explains *how* they justify the resistance procedurally.

  **C. Legalism (Judith Shklar / Critical Legal Studies)**
  *   **Concept:** Using the strict adherence to legal procedure to obscure political choices.
  *   **Application:** "We cannot say it until the court says it" is pure legalism. It frames a political refusal as a procedural necessity.

  ### 3. If there is no name, what should you call it?
  There is no single canonical term for this specific temporal/functional mismatch. "The Prevention Paradox" is used, but it's too broad. "The Genocide Labeling Problem" is descriptive, not analytical.

  Given your specific argument about the temporal lag between evidence and utility, I propose:

  **Name:** **The Constitutive Lag of Atrocity Naming**
  *(Or, sticking closer to your intuition: **The Verdict-Diagnosis Mismatch**)*

  **Definition:** A structural dysfunction in international atrocity response where the *epistemic conditions* required to legitimately apply a legal category (proof of specific intent, judicial verification) are temporally inverted relative to the *political utility* of that category (early warning, prevention). This lag creates a zone of "procedural caution" where the delay in naming functions as a de facto policy of non-intervention.

  **Why this works:**
  *   **Constitutive:** The act of naming *constitutes* the political reality (obligations kick in).
  *   **Lag:** Highlights the time element you identified.
  *   **Neutrality:** It describes the mechanism without immediately accusing actors of bad faith (though it allows you to argue that later).

  ### 4. Boundary Cases (What doesn't count?)
  To defend this at viva, you need to know where the pattern *breaks*.

  **Case A: Crimes Against Humanity (CAH)**
  *   **Why it doesn't count:** CAH does not require *dolus specialis* (specific intent to destroy a group). It requires a widespread/systematic attack against civilians.
  *   **The Test:** If states are equally reluctant to name CAH during ongoing conflict, your argument is about *intervention avoidance* generally. If they are *more* willing to name CAH than Genocide, your argument about the specific legal architecture of Genocide (the intent requirement) is validated.
  *   **Viva Defense:** Be ready to show that the "G-word" has a higher threshold of hesitation than "War Crimes" or "CAH."

  **Case B: Explicit Confession**
  *   **Why it doesn't count:** If a leader stands on a podium and says, "We are exterminating Group X," the evidentiary lag collapses.
  *   **The Test:** In these rare cases, does the international community name it immediately? (Often, still no—see Rwanda, where "acts of genocide" was used despite radio broadcasts).
  *   **Implication:** If they *still* don't name it despite explicit intent, then your argument shifts from "evidence is hard to get" to "the legal category is a pretext for political inaction." This strengthens your socio-legal critique.

  **Case C: Retrospective Tribunals (e.g., ICTR/Rwanda)**
  *   **Why it doesn't count:** This is your Case 2 (Historical). The lag here is accepted because the preventive utility is gone.
  *   **The Test:** Use this to show that the *cost* of the lag is specific to *ongoing* violence.

  ### 5. Where I am Guessing / Where You Might Be Overworking
  **1. The "Diagnosis" Analogy:**
  *   **Critique:** In medicine, a diagnosis is technically a verdict on the pathology, but it is treated as a key to treatment. In law, a verdict is the *end* of the process, not the start.
  *   **Risk:** An examiner might say you are imposing a medical utilitarian logic on a legal retributive framework.
  *   **Fix:** Acknowledge this. Argue that human rights advocates *try* to use it as a diagnosis, but the legal framework forces it to be a verdict. The tragedy is the mismatch of expectations.

  **2. The "Intent" Bottleneck:**
  *   **Critique:** You argue the lag exists because intent is hard to prove. But often, states know the intent and still don't say it.
  *   **Risk:** You might be giving states too much credit for being "careful lawyers." They might just be cynical.
  *   **Fix:** Distinguish between **Epistemic Caution** (we genuinely need more proof) and **Procedural Hiding** (we have proof but hide behind the need for more). Your Chapter needs to show where one turns into the other.

  **3. The "Standing" Variable (Your Case 3):**
  *   **Critique:** You note sometimes it *is* named early. You guess it's about standing/power.
  *   **Risk:** This could undermine your structural argument. If the structure allows it sometimes, is the structure the problem, or the actors?
  *   **Fix:** Argue that the *risk* of naming is asymmetric. Powerful actors can absorb the diplomatic cost of being "wrong" about genocide; weaker actors (NGOs, small states) cannot. The structure punishes the weak for naming early.

  ### Summary Advice for the Chapter
  1.  **Split Case 2:** Treat the historical/archival delay as a foil, not evidence of the same mechanism.
  2.  **Commit to the Speech Act:** The "Verdict vs. Diagnosis" (or Verdictive vs. Exercitive) tension is your theoretical engine. Keep it central.
  3.  **Name the Lag:** Use **The Constitutive Lag** or **The Verdict-Diagnosis Mismatch**. It gives the examiner a handle to grasp.
  4.  **Watch the Normativity:** Ensure you aren't just saying "delay is bad." You need to show "delay is a *function* of the legal category's design."

  You are on solid ground. The pattern is real. Just ensure you don't conflate the *inability* to know (history) with the *refusal* to speak (politics).
