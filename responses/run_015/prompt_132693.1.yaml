answer: |-
  Here is the 40-minute session arc. It is designed to move from economic mechanism to political accountability, ending with your modern extension.

  ### 1. The Dependency Order
  **Entitlement Mapping $\rightarrow$ Democratic Accountability.**
  You cannot establish *culpability* (political crime) until you establish *causality* (entitlement failure). If students still believe famine is caused by a lack of food (Availability Decline), democracy is irrelevant. They must first accept that food existed but access was severed. Once they accept the *mechanism* of starvation is economic exclusion, you can introduce the *political* mechanism that allows that exclusion to persist.

  ### 2. The Carrying Case: Bengal 1943
  Do not weight the three famines equally. Use **Bengal 1943** as the technical carrying case. It is Sen's cleanest economic dataset.

  *   **What it needs to have:** Clear data showing food availability was *not* significantly lower than previous non-famine years, paired with clear class stratification (landed gentry vs. landless laborers vs. urban service workers). You need to show that one group starved while another ate, despite sharing the same geography.
  *   **What it must lack:** Do not get bogged down in the specifics of the Japanese occupation of Burma or WWII shipping logistics. Acknowledge them as context, but refuse to let them become the *explanation*. If you dive into tonnage of rice ships, you lose the entitlement argument.

  ### 3. The Sequence & Misconception Swatting (40 Mins)

  **0:00–0:05 | Hook: The Availability Fallacy**
  *   **Action:** Put a single statistic on the board: *Bengal 1943 Food Availability: High. Starvation Deaths: 3 Million.*
  *   **Swat Misconception 1 ("If food was exported, locals had enough"):** Reveal that rice was being *exported* out of Bengal during the famine.
  *   **Point:** Starvation is not about the aggregate supply of food; it is about the distribution of *claims* to that food. This kills the "bad weather/crop failure" default assumption immediately.

  **0:05–0:20 | Core Mechanism: Entitlement Mapping (Whiteboard Heavy)**
  *   **Action:** Draw the Entitlement Map.
      *   Left side: **Endowments** (What you own: labor, land, assets).
      *   Right side: **Entitlements** (What you can command via trade/production).
      *   Middle: **The Shock** (Inflation/Wage collapse, not Crop failure).
  *   **Walkthrough:** Show how the landless laborer's endowment (labor) lost its exchange value due to war inflation, while the landed gentry's endowment (grain) increased in value.
  *   **Point:** The famine was a collapse of *exchange entitlements*, not food supply. The market worked perfectly to starve the poor.

  **0:20–0:30 | Political Vector: Accountability & Comparison**
  *   **Action:** Pivot to *why* the entitlement collapse wasn't arrested. Bring in **Great Leap Forward (GLF)** and **Ireland** briefly as contrast.
  *   **Swat Misconception 2 ("GLF was mainly drought"):** State plainly: Meteorological data shows weather was normal. The entitlement collapse was policy-induced (collectivization + procurement).
  *   **Swat Misconception 3 ("Democracy is a magic shield"):** Compare Bengal (Colonial Autocracy) to Post-Independence India (Democracy). India has had no famines since independence.
      *   *Nuance:* Democracy isn't magic; it creates *incentives*. Politicians need votes; a free press reports the starvation. In autocracies (GLF, Colonial Bengal), the cost of ignoring starvation is zero.
  *   **Point:** Famines are political crimes because they require a government to *ignore* the entitlement collapse.

  **0:30–0:35 | Modern Extension: Displaced Entitlement Collapse (DEC)**
  *   **Action:** Introduce your concept.
  *   **Explanation:** In Sen's time, entitlements were mostly local/national. Today, entitlements are global.
  *   **The Shift:** A crop failure in Ukraine or a futures speculation in Chicago can sever the exchange entitlement of a farmer in Somalia, even if the Somali harvest is fine.
  *   **The Crime:** The "blame" is diffused. No single dictator ordered the starvation. It is a structural violence embedded in supply chains. This makes the "political crime" harder to prosecute but no less real.

  **0:35–0:40 | The Check & Boundaries**
  *   **The Check (Headline Rewrite):** Project a standard Reuters headline: *"Drought and Conflict Drive Hunger in Sudan."*
      *   **Task:** Ask them to rewrite the headline using the Entitlement/Political Crime framing.
      *   **Success Indicator:** They must remove "Drought" as the primary subject and identify a failure of access or protection. (e.g., *"State Failure to Protect Exchange Entitlements Kills Thousands in Sudan"*). If they keep "Drought" as the subject, they haven't bought the frame.
  *   **The Refusals (Say this explicitly):**
      1.  **No Malthus:** "We are not discussing overpopulation. Sen proved food outpaces population."
      2.  **No Logistics:** "We are not discussing how to ship aid. We are discussing why aid is politically blocked."
      3.  **No Calorie Math:** "We are not counting calories. We are counting rights."

  ### 4. Whiteboard Layout Plan
  *   **Left Third:** **Availability vs. Entitlement.** (Two columns: Food Supply [Stable] | Deaths [Spike]).
  *   **Middle Third:** **The Entitlement Map.** (Endowments $\rightarrow$ Exchange $\rightarrow$ Consumption). Draw the "Scissors" of price vs. wage.
  *   **Right Third:** **The Political Filter.** (Autocracy $\rightarrow$ Silence $\rightarrow$ Famine | Democracy $\rightarrow$ Pressure $\rightarrow$ Prevention). Add DEC note at the bottom (Global Chain $\rightarrow$ Diffused Blame).

  ### 5. Why This Works for Policy Grads
  *   **Econ First:** It respects their training (exchange mechanisms) before asking them to shift paradigms (political science).
  *   **Active Reframing:** The headline rewrite forces them to synthesize, not just recall.
  *   **Boundary Setting:** Explicitly refusing Malthus/Logistics prevents the "Yes, but..." derailments that eat up time in policy sessions.
