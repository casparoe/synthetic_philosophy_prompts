      *   "Democracy = magic shield": Nuance this at the end or during the Political Layer (it's a necessary condition, not sufficient).

  4.  **Drafting the Arc (40 mins):**
      *   *0-5 min:* Hook & Misconception 1 (Availability Decline vs. Entitlement). Use Bengal exports.
      *   *5-15 min:* The Mechanism (Entitlement Mapping). Whiteboard work. Bengal.
      *   *15-25 min:* The Political Crime (Accountability). Contrast Bengal/GLF/Ireland. Misconception 2 (GLF Drought) & 3 (Democracy Shield).
      *   *25-35 min:* The Modern Twist (DEC). User's concept.
      *   *35-40 min:* Assessment & Boundaries.

  5.  **Refining the "Displaced Entitlement Collapse" (DEC):**
      *   Need to integrate this without it overshadowing Sen. It's an extension. It shows how entitlements are now global.
      *   *Placement:* After the basic entitlement model is understood.

  6.  **Refining the "Carrying Case":**
