      *   **Misconceptions to Address:** "Food exported = locals had enough," "GLF = mainly drought," "Democracy = magic shield."
      *   **Structure/Sequence:** Determine dependency order (Entitlement vs. Democracy), timing of misconception swatting, final check for understanding.
      *   **Constraints:** 40 mins, one whiteboard, no pre-readings.
