      *   *User's Addition:* Displaced Entitlement Collapse (DEC) $\rightarrow$ Global Supply Chains $\rightarrow$ Diffused Blame.
      *   *Dependency:* You can't understand *why* the entitlement failed (political crime) until you understand *what* an entitlement failure is (econ mechanism). So, Entitlement must come before Democracy. DEC fits best as a modern complication/extensions of the entitlement framework.
      *   *Carrying Case:* Bengal 1943 is the classic Sen case, but GLF is the starkest "political crime" example. However, for *policy* students, Bengal is often the clearest for *entitlement mapping* (farmers vs. urban vs. military). But the prompt asks to see famines as *political crimes*. GLF is the strongest evidence for that. *Correction:* Sen's own strongest empirical case for the *democracy* link is Bengal/India vs. China. But for *entitlement mechanics*, Bengal is clearest. Let's pick **Bengal 1943** as the carrying case for the *mechanism* (Entitlement), and use GLF/Ireland as contrast for the *political* element. Actually, the prompt says "Don't weight all three equally." Bengal is the most technical for entitlements. GLF is the most political. Let's make **Bengal 1943** the carrying case for the *technical* explanation (Entitlement), because Sen wrote most extensively about it in *Poverty and Famines*. It allows for the clearest whiteboard diagram of $E$-mappings.
