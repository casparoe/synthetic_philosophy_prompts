prompt: |-
  I teach a graduate seminar on medieval political theory, and last term a colleague from the law school sat in on the session on tyranny and afterward argued that the whole tyrannicide material is anachronistic costume drama: that Aquinas's treatment of sedition and his treatise on kingship give us no purchase on anything anyone now actually has to decide. I think he is half right, and I want to test the other half by trying to make the material do real work. The occasion is a practical one. I sit on the advisory panel of a small foundation that funds civic-resistance and human-rights organizations, and its board — two lawyers, a former ambassador, a retired aid worker, and two donors, no philosophers among them — has asked me for a written screening procedure it can run on funding requests that involve support for the killing of a head of state or of a ruler's inner circle. They meet for half a day once a month, they see dozens of requests, they cannot read Latin or Aquinas, and they need something they can apply in a single afternoon without summoning me: an ordered sequence of questions, a specification of what counts as a sufficient answer to each, an explicit statement of where the procedure terminates in a no and where it hands the decision to a person because the remaining question is one of values rather than facts, and a note at each step about whether that step is a genuine test or a judgment call wearing procedural clothing.

  What I want from you is that procedure, built as an operationalization of the Thomistic account rather than a summary of it. Please be explicit about three interpretive decisions you have to make in order to build it at all. First: whether the familiar cautions — that the community should not act rashly, that the remedy may turn out worse than the disease — are constraints on permissibility or only on prudence; the entire shape of the checklist depends on whether a grim expected outcome blocks the action or merely counts against it in deliberation. Second: who may authorize. Aquinas's requirements appear to presuppose a public authority competent to speak for the political community, and the cases my board sees are precisely ones in which that authority has been hollowed out, so the procedure needs a test for what I have started calling the proxy-authority problem: when a rump parliament sitting abroad, a federation of trade unions, a traditional council, or a broad-based popular assembly may stand in for a functioning public authority, together with an epistemic threshold, given that in most of these cases the ruler still commands the genuine allegiance of a substantial minority of the population. Third: the account seems to presuppose an individual ruler, and I want to know what the procedure does with depersonalized or distributed tyranny — a junta, a standing committee, a coercive apparatus administered partly through automated surveillance and fronted by a figurehead — including whether killing a subordinate who actually wields the coercive power is the same kind of act, for these purposes, as killing the titular ruler. I would also like the procedure to take a position on a title-forfeiture question my seminar got stuck on: how a ruler who came to office with a genuine title but has since gutted the institutions that conferred it is to be classified, whether the standard contrast between defect of title and defect in the exercise of rule has anything useful to say about that decay over time, and whether there is any threshold at which a once-lawful ruler becomes, for the purposes of the procedure, a usurper.

  Then run the procedure on three cases, and do not soften the third. (1) A president elected ten years ago in an internationally credited election who has since packed the courts, abolished term limits through a compliant legislature, and presides over security services credibly implicated in roughly a thousand killings; a coalition that includes the surviving caucus of the pre-purge parliament, two national unions, and a religious council has publicly declared him a tyrant and has asked for support for an operation to kill him. (2) A six-month-old junta that dissolved parliament and is shooting peaceful protesters, where a rump of the previous parliament sitting abroad claims to speak for the country and has requested a strike against the junta's leader. (3) A long-entrenched and genuinely atrocious ruler — the facts about the mass atrocities are not in doubt — where the only feasible means of killing him is a strike carried out by the intelligence service of a self-interested regional power, the predictable sequel is a succession war between two militias, and the ruler's own minority community is likely to be massacred in the reprisals that follow; my board will want to say yes to this one, and I suspect that a procedure honestly derived from the material should say no. Finally, tell me what the procedure cannot do: where Aquinas's commitments — about the common good as ordered rule rather than as a set of individual rights, about the moral significance of killing itself, about who may licitly kill for a public cause — come apart from the human-rights baseline my board actually holds, and which of those gaps would have to be closed by an act of decision rather than by further argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** A professor of medieval political theory.
      *   **Context:** A colleague (lawyer) claims Aquinas on tyranny/tyrannicide is anachronistic/useless. The professor wants to prove otherwise by making it *work* practically.
      *   **Task:** Create a written screening procedure for a foundation board (lawyers, donors, etc.) to evaluate funding requests involving the killing of a head of state/ruler.
      *   **Constraints:**
          *   Must be operationalizable (ordered sequence of questions, sufficient answers, termination points).
          *   Must distinguish between factual tests and value judgments.
          *   Must be usable in a single afternoon without the professor.
          *   Must address three specific interpretive decisions:
              1.  Prudence vs. Permissibility (do bad outcomes block action or just weigh against it?).
              2.  Proxy-Authority (who authorizes when public authority is hollowed?).
              3.  Depersonalized Tyranny (juntas, figureheads, subordinates).
          *   Must address the "Title-Forfeiture" question (lawful ruler becoming a usurper over time).
          *   Must run the procedure on three specific cases (including one where the intuitive "human rights" answer is "yes" but the Thomistic answer should be "no").
          *   Must conclude with limitations (where Aquinas diverges from modern human rights baselines).
      *   **Tone:** Academic, rigorous, practical, unsentimental, precise.

  2.  **Deconstruct the Thomistic Framework (Mental Sandbox):**

      *   *Source Material:* Primarily *De Regno* (On Kingship) and *Summa Theologiae* II-II, Q. 42 (Sedition) & Q. 64 (Killing). Also *Commentary on the Sentences*.
      *   *Core Principle:* Tyrannicide is generally *not* permissible for private individuals. It requires public authority.
      *   *Exception:* If no public authority exists (usurper), the community *might* act, but caution is paramount.
      *   *Key Distinction:* Usurper (defect of title) vs. Tyrant by Exercise (defect of rule). Aquinas is much stricter on the latter.
      *   *The "Colleague's Challenge":* Is this just costume drama? To make it work, I need to translate "public authority" into modern NGO terms and "common good" into stability/rights metrics.
      *   *Interpretive Decision 1 (Prudence vs. Permissibility):* Aquinas treats the "remedy worse than disease" caution as a *binding constraint* on licitness, not just a suggestion. If the probable outcome is greater disorder/sin, the act is illicit. I must adopt this to stay true to the text, even if it makes the procedure harder to use.
      *   *Interpretive Decision 2 (Proxy Authority):* Aquinas assumes a *corpus politicum*. In modern failed states, who represents this? I need a threshold of representativeness (e.g., broad coalition vs. fringe group).
      *   *Interpretive Decision 3 (Depersonalized Tyranny):* Aquinas focuses on the *source* of coercion. If the figurehead is irrelevant, killing the operational leader is the target. If it's a collective (junta), killing one might not end the tyranny, making the act futile/illicit.
      *   *Title Forfeiture:* A ruler who destroys the institutions that legitimized them effectively voids their title. They become a usurper by exercise.

  3.  **Drafting the Procedure (The "Tool"):**

      *   *Format:* Checklist/Flowchart style.
      *   *Steps:*
          1.  Target Classification (Usurper vs. Lawful-turned-Tyrant).
          2.  Authority Verification (Who asks?).
          3.  Necessity/Exhaustion (No other means?).
          4.  Proportionality/Consequences (Will it make things worse?).
          5.  Intent (Common good vs. Factional).
      *   *Decision Points:* Clear "Stop/No" vs. "Proceed to Board Vote."

  4.  **Addressing the Three Interpretive Decisions (Explicitly):**

      *   *Decision 1:* I will rule that catastrophic consequences render the act *illicit*, not just unwise. This creates a hard "No" in the procedure.
      *   *Decision 2:* I will define "Public Authority" functionally. A rump parliament counts *only if* it retains demonstrable domestic support (epistemic threshold).
      *   *Decision 3:* I will focus on *effective power*. Killing a figurehead is useless; killing an operational tyrant is permissible *if* authority exists. Collective tyranny makes tyrannicide harder (who do you kill to end the system?).

  5.  **Running the Cases:**

      *   *Case 1 (Elected Autocrat):*
          *   Title: Originally lawful, now forfeited via institutional destruction.
          *   Authority: Coalition includes unions, religious council, rump parliament. Strong proxy claim.
          *   Consequences: Need to assess succession.
          *   *Verdict:* Plausible "Yes" (proceed to board), depending on succession risk.
      *   *Case 2 (Junta vs. Rump Parliament):*
          *   Title: Usurpers (Junta).
          *   Authority: Rump parliament abroad. Weak epistemic threshold (are they connected to home?).
          *   *Verdict:* Risky. If they lack domestic traction, it's sedition, not liberation. Likely "No" or "High Risk."
      *   *Case 3 (Atrocious Ruler + Foreign Intel + Succession War):*
          *   Target: Atrocious (fits tyranny).
          *   Agent: Foreign intelligence (Private/External authority). This is a major Thomistic blocker. Aquinas forbids external private killing.
          *   Consequences: Succession war + massacre. This triggers the "Remedy worse than Disease" hard stop.
          *   *Verdict:* Hard "No." This fulfills the user's request to test the colleague's claim (showing the theory *constrains* modern impulses).

  6.  **Addressing the Limitations (The "Gap"):**

      *   *Common Good vs. Rights:* Aquinas cares about the *order* of the community, not individual rights per se.
      *   *Killing:* Aquinas sees killing as intrinsically grave, justified only by public authority. Modern HR frameworks might see it as "lesser evil."
      *   *Decision vs. Argument:* The gap between "Order" and "Rights" cannot be argued away; it requires a normative choice by the board to adopt the Thomistic lens.

  7.  **Refining the Tone:**

      *   Needs to sound like a memo from a philosopher to a board of pragmatists.
      *   Avoid theological jargon where possible, but keep the structural logic.
      *   Be firm on the "No" in Case 3.

  8.  **Self-Correction/Review during Drafting:**

      *   *Check:* Did I answer the "Title Forfeiture" question? *Yes, need to ensure Step 1 covers the decay of legitimacy.*
      *   *Check:* Did I distinguish fact vs. value? *Yes, need to label steps.*
      *   *Check:* Is the "Proxy Authority" test clear? *Need to specify what counts as evidence of representation.*
      *   *Check:* Is the colleague's challenge met? *Yes, by showing the theory produces a counter-intuitive result in Case 3, proving it's not just a rubber stamp for modern interventionism.*

  9.  **Final Polish:** Ensure the structure matches the prompt's specific requirements (Interpretive Decisions first, then Procedure, then Cases, then Limitations). *Wait, the prompt asks for the procedure first, built on the decisions.* I should integrate the decisions into the preamble or the procedure's logic notes. Actually, the prompt says: "Please be explicit about three interpretive decisions you have to make in order to build it at all... Then run the procedure... Finally, tell me what the procedure cannot do." Okay, structure: 1. Interpretive Decisions. 2. The Procedure. 3. Case Applications. 4. Limitations.

      *Refining the "Prudence vs. Permissibility" decision:* If I make it a hard constraint, the procedure is more robust. Aquinas says "if the disruption is greater... it is not to be proceeded against." That sounds peremptory. I will treat it as a veto.

      *Refining "Proxy Authority":* Aquinas allows the community to act if no superior exists. The "community" needs a voice. I will set a threshold of "broad-based coalition" vs "faction."

      *Refining "Depersonalized":* Focus on the *locus of coercion*.

      *Refining Case 3:* The prompt says "my board will want to say yes... and I suspect that a procedure honestly derived from the material should say no." I must ensure the procedure *does* say no. The foreign agent aspect is the killer here (no public authority), plus the consequence veto.

