answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Civic Resistance Foundation
  **FROM:** Advisory Panel (Political Theory)
  **SUBJECT:** Screening Procedure for Requests Involving Lethal Action Against Heads of State
  **DATE:** October 26, 2023

  ### I. PREAMBLE: THREE INTERPRETIVE DECISIONS

  To operationalize the Thomistic framework for modern application, three ambiguities in the source text must be resolved. These decisions determine the logic of the checklist below.

  **1. Prudence vs. Permissibility (The Consequence Veto)**
  *The Issue:* Aquinas warns that removing a tyrant may provoke greater disorder ("remedy worse than disease"). Is this a warning about wisdom (prudence) or a boundary of moral license (permissibility)?
  *The Decision:* We treat this as a **constraint on permissibility**. In the Thomistic account, an act that destroys the *bonum commune* (common good) to save it is self-contradictory. If the probable outcome is greater net disorder or suffering than the status quo, the act is illicit, not merely unwise.
  *Operational Effect:* This creates a hard "STOP" in the procedure. If the consequence assessment is negative, funding is denied regardless of the tyrant's guilt.

  **2. The Proxy-Authority Problem (Who Speaks for the Community?)**
  *The Issue:* Aquinas requires "public authority" to licitly kill a ruler. In modern collapsed states, this authority is often absent. When does a private group (unions, rump parliament, clergy) count as a proxy for the *res publica*?
  *The Decision:* We adopt a **Functional Representativeness Test**. A group counts as public authority only if it demonstrates: (a) institutional continuity with pre-tyranny structures, AND (b) demonstrable support across at least two distinct social strata (e.g., labor + religious, or military + civil). A single faction, even if morally correct, is a private party and cannot authorize lethal force without committing sedition.
  *Operational Effect:* This requires evidentiary submission regarding the requesting coalition's composition and domestic reach.

  **3. Depersonalized Tyranny and Title Forfeiture**
  *The Issue:* Aquinas distinguishes between a usurper (defect of title) and a lawful ruler who becomes tyrannical (defect of exercise). Modern tyrannies are often collective (juntas) or bureaucratic. Furthermore, does a lawfully elected ruler who destroys the law become a usurper?
  *The Decision:* We prioritize **Effective Coercion** and **Institutional Voidance**.
      *   *Target:* The target is the locus of effective coercive power, not necessarily the titular head. Killing a figurehead is impermissible if it does not end the tyranny; killing an operational subordinate is permissible if they wield the tyrannical power.
      *   *Title:* A ruler who systematically dismantles the institutions that confer their title (courts, legislature, elections) forfeits that title. They are treated as a usurper for the purposes of this procedure.
  *Operational Effect:* The procedure assesses the *structure* of power, not just the job title of the target.

  ***

  ### II. THE SCREENING PROCEDURE

  **Instructions:** Complete sequentially. If any step results in a "TERMINATE," the request is denied. If the request reaches Step 5, it proceeds to a Board Vote (Value Judgment).

  **STEP 1: CLASSIFICATION OF TARGET (Fact & Legal Status)**
  *Question:* Does the target hold office via a valid title, or have they forfeited it?
  *Evidence Required:* Constitutional history, election records, evidence of institutional dismantling (court packing, legislature dissolution).
  *Criteria for "Forfeited Title" (Usurper):*
  1.  Original accession was irregular (coup, fraud); OR
  2.  Original accession was regular, BUT the ruler has subsequently abolished the mechanisms of accountability (term limits, courts) that validated the title.
  *Decision:*
  *   **Valid Title Retained:** TERMINATE. (Private killing of a lawful ruler is sedition).
  *   **Title Forfeited / Usurper:** PROCEED to Step 2.
  *   *Note:* This is a **Judgment Call**. Determining the exact moment of forfeiture involves interpreting political decay, not just counting votes.

  **STEP 2: AUTHORIZATION (Fact & Representation)**
  *Question:* Who is requesting the action, and do they represent the political community?
  *Evidence Required:* List of coalition members, evidence of domestic support (polling, strike participation, clerical endorsements), proof of institutional continuity.
  *Criteria for "Public Authority Proxy":*
  1.  The requesting body must include at least two independent sectors of civil society (e.g., Labor + Church, or Military Faction + Parliament).
  2.  The requesting body must explicitly accept responsibility for the post-removal transition.
  3.  The requesting body must *not* be primarily funded or directed by a foreign state power.
  *Decision:*
  *   **Private Faction / Foreign Proxy:** TERMINATE. (Lack of public authority renders the act assassination, not tyrannicide).
  *   **Broad Coalition / Domestic Proxy:** PROCEED to Step 3.
  *   *Note:* This is a **Genuine Test**. It relies on verifiable data about coalition composition.

  **STEP 3: NECESSITY AND EXHAUSTION (Fact)**
  *Question:* Are non-lethal means exhausted or impossible?
  *Evidence Required:* Documentation of failed impeachment attempts, failed elections, or impossibility of peaceful protest due to state violence.
  *Criteria:*
  1.  Evidence that the tyrant cannot be removed by legal or non-violent political means.
  2.  Evidence that the tyranny is active and ongoing (not merely feared).
  *Decision:*
  *   **Political Means Available:** TERMINATE.
  *   **No Feasible Alternative:** PROCEED to Step 4.
  *   *Note:* This is a **Genuine Test**.

  **STEP 4: PROPORTIONALITY AND CONSEQUENCE (Fact & Prediction)**
  *Question:* Will the removal likely produce a greater disorder than the continuation of the tyranny?
  *Evidence Required:* Intelligence on succession plans, militia strength, ethnic/sectarian fault lines, historical precedent in similar regimes.
  *Criteria for "Greater Disorder" (The Veto):*
  1.  High probability of immediate civil war or succession conflict.
  2.  High probability of reprisal massacres against specific minority groups.
  3.  High probability of foreign occupation resulting from the power vacuum.
  *Decision:*
  *   **Probable Greater Disorder:** TERMINATE. (This is the Prudence/Permissibility Veto).
  *   **Stable Transition Likely / Disorder Contained:** PROCEED to Step 5.
  *   *Note:* This is a **Judgment Call wearing Procedural Clothing**. Predicting the future is not a hard science, but the Board must treat a "High Probability" finding as a binding fact.

  **STEP 5: INTENT AND END-GAME (Value Judgment)**
  *Question:* Is the stated end of the action the restoration of the *bonum commune* (rule of law, common welfare) or the advantage of a specific faction?
  *Evidence Required:* The coalition's public charter, statements regarding post-tyranny governance.
  *Decision:*
  *   **Factional Advantage:** DENY.
  *   **Restoration of Common Good:** **BOARD VOTE REQUIRED.**
  *   *Note:* This is a **Pure Value Judgment**. The procedure terminates here. The Board must decide if the risk is worth the moral good.

  ***

  ### III. APPLICATION TO CASES

  **CASE 1: The Elected Autocrat**
  *Facts:* Elected 10 years ago, packed courts, abolished term limits, 1,000 killings. Request from coalition (rump parliament, unions, religious council).
  *   **Step 1 (Title):** *Forfeited.* Though originally elected, the dismantling of courts and term limits voids the institutional basis of the title. Treated as Usurper. **PASS.**
  *   **Step 2 (Authority):** *Sufficient.* Coalition includes legislative, labor, and religious sectors. Domestic base. **PASS.**
  *   **Step 3 (Necessity):** *Sufficient.* Courts packed, elections moot. **PASS.**
  *   **Step 4 (Consequence):** *Unclear.* Depends on succession. If the security services fracture, disorder is likely. If the coalition has sleeper cells in the military, disorder is contained. *Assume for screening:* Evidence suggests the coalition has military contacts. **PASS.**
  *   **Step 5 (Intent):** *Board Vote.*
  *   **Result:** **PROCEED TO BOARD VOTE.** (The procedure does not block this, provided the succession risk is managed).

  **CASE 2: The Junta vs. Rump Parliament Abroad**
  *Facts:* 6-month-old Junta. Shooting protesters. Request from rump parliament sitting abroad.
  *   **Step 1 (Title):** *Forfeited.* Junta is a usurper by definition. **PASS.**
  *   **Step 2 (Authority):** *FAIL.* A rump parliament sitting *abroad* fails the Functional Representativeness Test unless they prove active command over domestic resistance. Without evidence of domestic strata support (unions, etc.), they are a faction in exile, not a public authority proxy.
  *   **Result:** **TERMINATE.** (Funding this constitutes supporting a factional civil war, not public justice).

  **CASE 3: The Atrocious Ruler & The Foreign Strike**
  *Facts:* Long-entrenched ruler, mass atrocities undisputed. Means: Strike by regional power's intelligence service. Sequel: Succession war, militia conflict, massacre of ruler's minority community. Board wants to say Yes.
  *   **Step 1 (Title):** *Forfeited.* Atrocities and entrenchment imply defect of exercise/title. **PASS.**
  *   **Step 2 (Authority):** *FAIL.* The agent is a "self-interested regional power's intelligence service." This is a foreign private authority, not a domestic public proxy. In Thomistic terms, this is invasion/assassination, not tyrannicide.
  *   **Step 4 (Consequence):** *FAIL (Veto).* The predictable sequel is succession war and minority massacre. This triggers the "Remedy Worse Than Disease" constraint.
  *   **Result:** **TERMINATE.**
  *   **Analysis:** The procedure explicitly blocks this. Despite the ruler's guilt, the *agent* lacks authority and the *outcome* violates the common good. The Board's intuition to say "Yes" relies on a human-rights utilitarianism (kill one to save many) that the Thomistic procedure rejects in favor of political order and legitimate authority.

  ***

  ### IV. LIMITATIONS: WHERE THE PROCEDURE BREAKS

  This procedure is not a universal moral calculator. It is a specific technology derived from a specific metaphysics. The Board must recognize three gaps where Aquinas's commitments diverge from the Foundation's modern human-rights baseline. These gaps cannot be argued away; they require a decision to adopt the Thomistic lens or discard it.

  **1. The Common Good vs. Individual Rights**
  *The Gap:* The Foundation likely operates on a baseline that individual rights (life, liberty) are paramount. Aquinas operates on a baseline that the *ordo* (order) of the community is paramount.
  *The Conflict:* In Case 3, a rights-based approach might argue that the ruler's victims have a right to life that outweighs the risk of future disorder. The Thomistic procedure prioritizes the stability of the political community over the immediate justice due to victims if securing that justice destroys the community.
  *The Decision:* The Board must decide if it funds *justice* (rights vindication) or *politics* (restoration of order). This procedure funds the latter.

  **2. The Moral Significance of Killing**
  *The Gap:* Modern just-war or human-rights frameworks often treat killing as a "necessary evil" justified by outcomes. Aquinas treats killing as intrinsically grave, permissible *only* when the killer acts as the "sword of the community."
  *The Conflict:* The procedure forbids killing by foreign agents (Case 3) even if they are more effective. For Aquinas, *who* kills matters as much as *why*. A good outcome achieved by a private/foreign hand is morally tainted and politically destabilizing.
  *The Decision:* The Board must accept that legitimacy of agency is a hard constraint, not a variable to be traded for efficiency.

  **3. The Definition of "Public"**
  *The Gap:* Aquinas presupposes a organic political community (*populus*). The modern world often contains artificial states with weak national identities.
  *The Conflict:* The "Proxy Authority" test assumes a "people" exists to be represented. In ethnically fractured states (like Case 3's minority community), there may be no "common good" to restore, only competing goods.
  *The Decision:* This procedure assumes a recoverable political unity. If the Board believes some states are beyond recovery into a unified *res publica*, this procedure is inapplicable.

  **Conclusion for the Board:**
  This procedure will not maximize body-count savings. It will not always align with intuitive humanitarian impulses. It is designed to prevent the Foundation from becoming a participant in sedition or foreign aggression while supporting the restoration of lawful rule. If your goal is the mitigation of suffering regardless of political legitimacy, discard this tool. If your goal is the restoration of legitimate political order, apply it strictly.
