      *   Task 1 (Constitutive/Evidential)? Yes.
      *   Task 2 (Reciprocity/Isolation)? Yes.
      *   Task 3 (Selectivity)? Yes.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm dismissing Ubuntu. I need to show that a *proper* understanding of Ubuntu leads to the recommendation, not that Western bioethics overrides Ubuntu. The argument is that *true* Ubuntu aligns with the neighbor's testimony and the patient's prior wishes, not the daughter's demand.

      *Recommendation refinement:* A "Time-Limited Trial" is often the best ethical compromise in uncertainty. However, if the patient's prior wishes are clear ("did not want to be kept alive in this condition"), dialysis/PEG is likely contraindicated. I will recommend against invasive interventions but for aggressive symptom management and a short trial of antibiotics for the pneumonia (as it's reversible and less burdensome than dialysis), with a 72-hour review. This acknowledges the daughter's wish to treat the acute illness without committing to the long-term burdens the patient rejected.

