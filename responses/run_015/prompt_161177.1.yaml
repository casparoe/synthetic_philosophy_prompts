      *   **Task:** Draft a short written opinion to circulate before Thursday.
      *   **Case:** Mr. N., 79, advanced vascular dementia, aspiration pneumonia, AKI. No AD, no proxy.
      *   **Conflict:**
          *   *Daughter (abroad, 6 yrs no visit):* Demands feeding tube, dialysis, ICU. Argues Ubuntu means family relation sustains his personhood; comfort care treats him as dead.
          *   *Nursing Team + Neighbor (caregiver 12 yrs):* Patient previously stated he didn't want to be kept alive like this. He doesn't recognize anyone. Aggressive plan serves daughter's guilt, not him.
          *   *Committee Split:* Two members want to use Ubuntu as a tie-breaker for the daughter (relational view overrides prior wishes). The user disagrees.
      *   **Requirements:**
          1.  **Concrete Recommendation:** With a time frame.
          2.  **Tone:** Respectful to both family and team (no one feels dismissed).
          3.  **Steel-man the Losing Side:** State the strongest point of the opposing view (the two committee members/daughter) clearly.
          4.  **Specific Philosophical Tasks:**
              *   *Task 1:* Distinguish Constitutive vs. Evidential readings of relational personhood. Recommend one.
              *   *Task 2:* Address the "ongoing participation" worry (does relational standing require reciprocity? If so, isolated patients have less worth?).
              *   *Task 3:* Address selective invocation (families/teams using Ubuntu only when it suits their pre-existing conclusion).

  2.  **Deconstruct the Philosophical Issues:**

      *   **Task 1: Constitutive vs. Evidential.**
          *   *Constitutive:* Relationships *make* the person. If the family says he is X, he is X. This could override prior wishes. (Risk: Paternalism by proxy, ignoring patient autonomy/history).
          *   *Evidential:* Relationships help us *know* the person. They reveal his values. (Risk: Might not resolve conflict if values are unclear).
          *   *Recommendation:* In a medical context, especially with dementia, the *Evidential* reading is safer and more ethically robust. It respects the patient's history while acknowledging the community's role in interpreting it. A constitutive reading risks allowing others to impose life on a patient against their known will, violating the core dignity Ubuntu seeks to protect.

      *   **Task 2: Ongoing Participation (Reciprocity).**
          *   *The Worry:* If personhood depends on *current* relation, does a non-responsive patient lose status? Does an isolated patient have less status than one with a loud family?
          *   *Resolution:* Ubuntu isn't just about *active* interaction; it's about *moral standing* within a community. However, the *quality* of the relationship matters. A relationship of 6 years absence vs. 12 years daily care carries different weight in interpreting the patient's good. The "holding in mind" must be truthful to the person held.
          *   *Key Insight:* Relational personhood imposes duties *on* the community to care for the vulnerable, not just rights *for* the community to decide. An isolated patient has equal claim on the *hospital's* care (as part of the broader community), not less claim because they lack family.

      *   **Task 3: Selective Invocation.**
          *   *The Problem:* Using culture as a weapon/tool for a pre-determined outcome.
          *   *Policy:* Ubuntu must be applied consistently as a framework for *deliberation*, not a trump card for *outcome*. It requires looking at the whole network of care, not just biological kin.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the difficulty and the importance of Ubuntu in this context. Validate the daughter's love and the team's experience.
      *   **Recommendation:** Needs to be concrete. Time-limited trial? Or immediate palliative focus? Given "advanced vascular dementia," "no recognition," "AKI + Pneumonia," aggressive care is likely futile/harmful. A time-limited trial of non-invasive treatment is often a good compromise, but if the prompt implies the aggressive plan is medically inappropriate, I should lean towards comfort care but with a process that honors the daughter. Let's go with a *Time-Limited Trial of Non-Invasive Treatment* (antibiotics/fluids but no tube/dialysis/ICU) with a clear review point. This respects the daughter's wish to "treat" without inflicting the harm of invasive measures that contradict the patient's known wishes. *Correction:* The prompt asks for a recommendation on the *dispute*. Usually, ethics committees recommend a course of action. If the patient's prior wishes are clear ("did not want to be kept alive in this condition"), substituted judgment should prevail. However, to honor the relational aspect, we need a process. Let's recommend: *Do not initiate dialysis/feeding tube/ICU. Initiate comfort-focused treatment for pneumonia (antibiotics/oxygen) if not burdensome, with a 48-hour review.* This balances the "do something" urge with the "do no harm" reality.
      *   **Addressing Task 1 (Constitutive vs. Evidential):** Explain the distinction. Argue for Evidential. Why? Because Constitutive risks erasing the patient's own history. Ubuntu honors the person *in* the community, not the community *over* the person.
      *   **Addressing Task 2 (Reciprocity/Isolation):** This is crucial. If personhood requires reciprocity, the comatose lose it. That's wrong. Ubuntu implies a duty of care *towards* those who cannot reciprocate. The neighbor's 12-year care counts more than the daughter's 6-year absence in terms of *knowing* the patient, even if the daughter has biological standing. The isolated patient is held by the *hospital community*, not just family.
      *   **Addressing Task 3 (Selectivity):** Policy statement. Ubuntu is a lens, not a lever. It must be applied to the *process* of finding the patient's good, not justifying a preferred outcome.
      *   **Steel-manning:** Acknowledge the daughter's point: Dementia does not erase humanity; treating him as "done" feels like abandonment. This is a valid moral intuition.

  4.  **Refining the Tone:**
      *   Must be respectful. Avoid "Western autonomy" vs. "African Ubuntu" tropes. Show how Ubuntu *supports* the recommendation, not just limits it.
      *   Ensure the daughter doesn't feel attacked for living abroad (life happens), but the weight of the neighbor's testimony is highlighted.
      *   Ensure the team doesn't feel dismissed for wanting to avoid futile care.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   To: CEC Members.
      *   Re: Mr. N.
      *   Rec: No dialysis/PEG. Treat pneumonia conservatively. 48hr review.
      *   Reasoning 1: Relational personhood is evidential. We use relationships to find *his* will, not replace it.
      *   Reasoning 2: Relationships need not be reciprocal to grant status, but they must be authentic. The neighbor knew him better. Isolated patients are protected by the hospital community.
      *   Reasoning 3: Don't use culture selectively.
      *   Closing: We honor him by remembering who he was, not just keeping him breathing.

  6.  **Drafting - Iteration 2 (Fleshing out the arguments):**
      *   *Steel-man:* The daughter's view is that dignity is social. To stop treatment is to socially kill him. This is powerful.
      *   *Constitutive vs Evidential:* If we say family *constitutes* him, we allow them to override his past self. That violates the "person through other persons" if the "other persons" ignore his own voice. We should use relationships to *evidence* his values.
      *   *Reciprocity:* If we require reciprocity, we abandon the unconscious. Ubuntu demands we care for the vulnerable. The "community" includes the care team.
      *   *Selectivity:* We need a policy that checks for consistency.

  7.  **Final Polish:** Check against constraints.
