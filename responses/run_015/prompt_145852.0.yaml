  **1. Translation**

  Condorcet's Jury Theorem maps cleanly to ensemble learning theory. Consider a binary classification task with a fixed ground-truth label $Y \in \{0, 1\}$. You deploy $N$ base classifiers (voters). Each classifier possesses an accuracy $p > 0.5$ on this task. Crucially, their errors are conditionally independent given $Y$; knowing Classifier A errored provides no information about Classifier B. The theorem states that if you aggregate these predictions via hard majority voting, the ensemble accuracy approaches 1.0 as $N \to \infty$. Specifically, the probability of the ensemble erring decays exponentially with $N$.

  In political philosophy, this is invoked to argue for majority rule. However, the translation requires a decision-theoretic swap: it assumes the sole purpose of voting is truth-tracking (minimising 0-1 loss against $Y$). If you accept that premise, the theorem demonstrates that democratic aggregation is asymptotically optimal compared to dictatorship (a single classifier), provided the average competence exceeds random guessing. However, this only establishes epistemic accuracy. To move from 'the majority is likely correct' to 'the majority ought to rule', you must equate political legitimacy with predictive accuracy. The theorem does not prove this equivalence; it merely shows that if you value accuracy above all else, majority voting is a robust architecture for extracting signal from noisy agents. It argues against elitism only insofar as a single expert classifier is outperformed by a large bag of weak learners, assuming independence holds. If $p < 0.5$, the ensemble converges to certainty in the wrong answer, implying that if the electorate is systematically biased, democracy amplifies error. The theorem is thus a conditional guarantee of performance, not an unconditional moral defence. It relies entirely on the independence assumption; if errors are correlated (covariance > 0), the variance reduction benefit of bagging collapses, and adding more voters yields diminishing returns. Proponents use this to claim democracy finds truth better than experts. Opponents use the $p<0.5$ or correlation clause to argue democracy fails if voters are ignorant or polarised. The mechanism is essentially the Law of Large Numbers applied to binary outcomes. As sample size increases, the sample mean converges to the expected value. Since $p > 0.5$, the expected vote favours the truth. This mathematical certainty is what proponents leverage to claim democratic superiority over epistocracies.

  **2. What had to be fudged**

  The primary fudge lies in the homogeneity assumption. Condorcet fixes $p$ for all voters. In ML, we rarely assume identical base learners; we measure validation accuracy and weight models via stacking or boosting. If competences vary, simple majority is suboptimal. Optimal weighting is proportional to $\log(p_i / (1-p_i))$. If your electorate has a thin tail of highly competent voters, weighting them beats one-person-one-vote. The theorem only supports equality if you cannot identify competence beforehand. Since politics lacks held-out labels to estimate $p_i$, we default to unweighted voting, but this is a constraint of information, not optimality.

  Furthermore, independence is treated as a static precondition. In bagging, we engineer independence via bootstrap sampling. In electorates, independence is behavioural and fragile. Deliberation (feature sharing) induces correlation. If error correlation exceeds a threshold, the ensemble advantage vanishes regardless of $N$. The theorem treats independence as exogenous, whereas in social systems, it is endogenous to the campaign structure. We fudge this by assuming voters are isolated inference engines, ignoring that social networks create correlated failure modes (mode collapse). Consequently, the claim that 'more voters is always better' holds only if you ignore the covariance structure of the errors. In ML, we regularise for this; in politics, we often ignore it.

  **3. The residue**

  The largest residue is the ground truth $Y$. In ML, $Y$ is fixed by the dataset. In politics, $Y$ (the 'common good') is contested or non-existent. If $Y$ is undefined, the theorem describes convergence to nothing. This isn't a defect in ML vocabulary; it reveals that the philosophical claim relies on a realist metaphysics of 'correct decisions' that ML takes for granted. Without a defined loss function, 'accuracy' is meaningless.

  Secondly, endogeneity. In ML, the training pipeline is separate from the inference ensemble. In politics, institutions (the voting rule) shape voter competence ($p$). Education, discourse, and incentives change $p$. The theorem treats $p$ as exogenous.

  Finally, legitimacy vs accuracy. ML cares about loss functions. Politics cares about authority. A model can be accurate but untrusted. The theorem proves accuracy, not trust. This suggests the original claim was less clear than it sounds: it conflates 'being right' with 'having the right to rule'. The ML vocabulary separates these cleanly: you can have a high-accuracy model that violates compliance constraints. The residue shows that political philosophy often hides normative premises inside epistemic claims. The vocabulary doesn't lack capacity; it lacks the desire to model normativity as a loss term. Furthermore, political truth is often constructive, not retrieval-based. ML assumes $Y$ exists prior to prediction. Politics often defines $Y$ through the voting process itself. This fundamental ontological mismatch means the theorem applies only to referendums on factual matters, not value judgements. This implies the theorem is silent on legislation, which creates new states rather than identifying existing ones.

  **4. What would change my mind**

  The distortion lies in the definition of 'error'. In ML, error is objective deviation. In politics, 'error' might be acting against one's own interest, which is subjective. What would change my mind? If I saw a formalisation of 'constructive truth' in ML—semi-supervised learning where the consensus *defines* the label rather than matches it. If the theorem could be reframed for clustering or manifold learning where the 'truth' emerges from the geometry of the voters rather than preceding them, the analogy would hold better. Until then, the theorem is strictly about retrieval, not construction. I would also need to see a loss function that incorporates legitimacy constraints, showing that accuracy isn't the only objective. If ML infrastructure treated 'consent' as a regularisation term, the mapping would be more robust clearly.
