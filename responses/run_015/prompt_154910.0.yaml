      *   Step 4 (Counterfactual): Pre-emption & Overdetermination. Would $E$ have happened anyway due to $D$?
      *   Step 5 (Interventionist): Structural Stability. Will the intervention change the structure of the system itself (Goodhart's Law type issues)?
      *   Step 6 (Handover): Value weighting of outcomes.

