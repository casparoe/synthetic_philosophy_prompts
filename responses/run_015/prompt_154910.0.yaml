      *   *Interventionist Theory (Woodward-style, roughly):* $C$ causes $E$ if an ideal intervention on $C$ changes $E$, holding other variables fixed. Focuses on manipulability and invariance. Key question: "If we wiggle $C$, does $E$ wiggle predictably?"
