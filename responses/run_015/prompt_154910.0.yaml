      *   *Adjustment:* I will frame the stopping rule such that if an intervention destabilises the system leading to high mortality (a factual demographic outcome), it fails the "Invariance" test regarding the *target variable* (Population Health/Welfare).

  8.  **Final Polish:** Check tone. Ensure it sounds like it's written for a scientist (pragmatic, rigorous) but respects the philosophical depth. Ensure British spelling.

      *(Self-Correction on Case iii)*: The prompt asks for a conclusion a welfare-oriented board would find unwelcome. A welfare board wants to reduce suffering. If the procedure says "Do not intervene because total suffering will increase," that is a value judgment. To keep it methodological, the procedure must say "The causal link between Intervention and Welfare is not invariant; it is contingent on population density which the intervention alters." Thus, the claim "Vaccination causes Welfare Improvement" is methodologically unsupported. *However*, to be more direct: The procedure should identify that the intervention triggers a causal chain leading to a state (starvation) that is objectively measurable as mortality. If the proposal claims "Population Recovery," but the model shows "Population Crash," that is a factual failure. I will frame it around the instability of the causal claim regarding *population viability*.

