      *   *Phase 1: Causal Claim Validation (Interventionist focus).* Can we actually manipulate the variable? Is the relationship invariant?
      *   *Phase 2: Counterfactual Verification.* Is the claimed effect actually dependent on the cause in the specific context?
      *   *Phase 3: Side-Effects & Systemic Invariance (Interventionist).* Does the intervention break other relationships?
