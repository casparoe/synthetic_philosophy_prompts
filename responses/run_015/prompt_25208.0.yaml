answer: |-
  # Colloquium Q&A Prep Sheet
  **Project:** The Failure of the Conditional Analysis & Pressure on Humean Laws
  **Context:** Department Colloquium (Pre-Job Market)
  **Time Limit per Reply:** ~2 Minutes (approx. 250–300 words spoken at moderate pace)

  ---

  ### 1. The "Humean Pragmatist" Objection
  **Likelihood:** Very High | **Damage:** High
  **Who:** Philosophy of Science Faculty (Humeans)
  **The Question:** "You claim Humeanism requires a reductive analysis of dispositions to avoid primitive modality. But many contemporary Humeans (like Loewer or Cohen) treat dispositions as useful conceptual tools within the Best System, not as ontological primitives that need reducing to categorical bases. Why can't the Humean just accept dispositions as part of the 'special science' vocabulary that supervenes on the Humean mosaic, without needing a strict conditional analysis?"

  **Your Reply:**
  "That's a crucial distinction. My argument targets the *metaphysical* commitment of Humeanism, not just its semantic utility. If dispositions are merely useful fictions, that works for special sciences, but my paper focuses on fundamental laws. If fundamental laws are Humean regularities, they cannot rely on irreducible dispositions without collapsing into Dispositional Essentialism.

  The Humean wants to say the mosaic is purely categorical. But if the 'regularities' that constitute laws rely on objects having stable behavioral profiles (dispositions) to hold across time, and we cannot analyze those profiles reductively via conditionals (due to finks/masks), then the Humean is left positing a 'stubbornness' in the mosaic that looks suspiciously like primitive modality. If you can't reduce the disposition, and you can't eliminate it because science requires it, you've imported the very modal structure Humeanism was designed to avoid. I'm arguing that 'useful tool' isn't enough if the tool does metaphysical work the Humean ontology can't support."

  **Weakness Note:** This relies on the premise that fundamental laws *must* be free of dispositional talk. A sophisticated Humean might bite the bullet and say fundamental laws *are* just summaries of dispositional behavior without needing a categorical base. You need to be ready to defend why that counts as "primitive modality."

  ---

  ### 2. The "Non-Vicious Circularity" Objection
  **Likelihood:** High | **Damage:** Medium-High
  **Who:** Metaphysics Faculty (General)
  **The Question:** "You argue that appealing to 'normal conditions' to fix the Conditional Analysis is circular. But isn't this merely a *informative* circularity rather than a *vicious* one? If we can identify normal conditions independently of the disposition itself—say, via statistical prevalence in the mosaic—haven't you just shown the analysis is harder, not impossible?"

  **Your Reply:**
  "I distinguish between epistemic and metaphysical circularity. My charge is metaphysical. To specify 'normal conditions' without referencing the disposition in question, you need a purely categorical description of the environment. But in fink/mask cases, the interfering factor is often defined precisely by its ability to alter the manifestation of that specific disposition.

  If I say 'The glass is fragile unless masked,' and you define 'masked' as 'conditions where the glass doesn't break,' you haven't reduced fragility; you've just renamed the manifestation condition. If you try to define 'masked' categorically (e.g., 'surrounded by packing foam'), you face the problem that packing foam only masks *fragility*, not *color*. So the 'normal conditions' clause must reference the specific disposition to be accurate. If the *definiens* references the *definiendum*, the reductive ambition—the core motivation for the Humean to adopt the CA in the first place—is forfeited."

  **Weakness Note:** This is the technical heart of your paper. If they press you on specific examples where "normal conditions" *can* be specified categorically (e.g., standard temperature and pressure), you need to show why those don't cover the fink/mask edge cases.

  ---

  ### 3. The "Dispositionalist Victory" Objection
  **Likelihood:** High | **Damage:** Low (for you, but tricky)
  **Who:** The Dispositional Essentialist Faculty Member
  **The Question:** "I agree with you entirely that the Conditional Analysis fails. That's why we dispositional essentialists exist. But why do you frame this as a problem for Humeanism rather than just an argument for powers? If CA fails, why not just accept that dispositions are real and fundamental? Why is this a 'pressure' on Humeans rather than a 'refutation' of reductionism?"

  **Your Reply:**
  "Because my goal isn't to advocate for Dispositional Essentialism, but to test the resilience of Humeanism. I'm granting for the sake of argument that Humeans *want* to avoid primitive modality. If the CA is the best bridge between categorical bases and lawful regularities, and that bridge is out, the Humean has a dilemma.

  They can either accept primitive modality (ceasing to be Humeans in the strict Lewisian sense) or eliminate dispositions entirely. I'm arguing elimination is untenable given modern physics. So, the 'pressure' I describe is the force pushing the Humean toward a view that looks increasingly like the view they reject. I'm not saying Dispositional Essentialism is true; I'm saying the failure of CA removes the Humean's best defense against it. The argument is a *reductio* of the Humean hope for a fully categorical world, not necessarily an endorsement of powers."

  **Weakness Note:** Be careful not to sound like you're secretly a dispositionalist. Keep the focus on the *cost* to Humeanism, not the *benefits* of Powers.

  ---

  ### 4. The "Counterfactual Logic" Objection
  **Likelihood:** Medium | **Damage:** Medium
  **Who:** The Epistemologists
  **The Question:** "Your discussion of finks relies on a specific semantics for counterfactuals. If we adopt a non-standard semantics—for instance, one where the closest world where the stimulus occurs is a world where the fink doesn't intervene—doesn't the Conditional Analysis hold? Are you conflating the metaphysics of dispositions with the logic of counterfactuals?"

  **Your Reply:**
  "That's a fair concern, but the fink case is designed to survive shifts in counterfactual semantics. The fink isn't just an accidental interferer; it's structurally linked to the stimulus. In the closest world where the stimulus occurs, the fink (by definition of the case) removes the disposition *before* manifestation.

  Even if we tweak the similarity metric, we face the 'mask' problem, which is distinct. A mask doesn't remove the disposition; it prevents the manifestation while the disposition remains. Any counterfactual analysis that says 'If stimulated, it would manifest' is simply false in mask cases, regardless of the semantics, because the manifestation is physically blocked. To save the analysis, you must add a 'no masks' clause. As I argued earlier, specifying 'no masks' without referencing the disposition leads to the circularity problem. So the issue isn't just the logic of the conditional; it's the content of the antecedent."

  **Weakness Note:** Epistemologists love formal semantics. If they bring up specific systems (e.g., Stalnaker vs. Lewis vs. Kratzer), don't get bogged down in the weeds. Pivot back to the metaphysical implication of the antecedent content.

  ---

  ### 5. The "So What?" Objection
  **Likelihood:** Medium | **Damage:** Low
  **Who:** Philosophy of Science / General Faculty
  **The Question:** "Even if you're right, does this actually change scientific practice? Scientists don't use the Conditional Analysis; they use mathematical models. If the Humean says 'The math works regardless of the metaphysics,' haven't you just created a metaphysical problem for a metaphysical view that scientists don't care about?"

  **Your Reply:**
  "Scientists don't care about the metaphysics until they hit a wall in interpretation. When we ask what a law *governs*, or why a model applies to a new system, we rely on assumptions about stability and capacity—i.e., dispositions.

  If the Humean says laws are just summaries of events, they struggle to explain *projection*—why we trust laws in unobserved cases. Dispositional talk handles projection naturally. If the Humean cannot reduce dispositions, they lose the explanatory advantage of their view (ontological parsimony) without gaining a better account of projection. So it matters for philosophy of science because it impacts how we justify inductive inference and model application. It's not about changing the equations; it's about justifying why we think the equations will hold tomorrow."

  **Weakness Note:** This is a standard "metaphysics is useless" charge. Keep the focus on *justification* and *induction*, not practice.

  ---

  ### ☠️ The Question You Hope Nobody Asks
  **The "Positive View" Trap**
  **Who:** Senior Faculty / Job Market Advisor types
  **The Question:** "You've spent the dissertation arguing that the Humean can't reduce dispositions and that primitive modality is costly. But you haven't told us what *you* think laws are. If Humeanism fails and Dispositional Essentialism is too costly (or not your view), what is your positive account? Are you leaving us with skepticism about laws?"

  **Why it's dangerous:** It exposes that your dissertation is primarily critical. On the job market, you need to be known *for* something, not just *against* something. If you don't have a positive view ready, you look like you haven't finished the philosophical work.

  **Prepared Reply (Keep this in your back pocket):**
  "That's the natural next step. Currently, I argue that the Humean is forced into a dilemma: accept primitive modality or accept skepticism about laws. My own inclination is toward a 'modest realism' about dispositions—not full-blown Dispositional Essentialism, but a view where dispositions are real higher-order properties that supervene on structure, without requiring a reduction to categorical bases. This avoids the Humean's reductive burden while avoiding the heavy metaphysics of powers. But for this project, I wanted to rigorously establish the failure of the reductive option first, to clear the ground for that positive view in my future work."

  **Weakness Note:** This admits the dissertation is "Phase 1." That's acceptable for a PhD, but be prepared to sketch the "modest realism" slightly more if they press. Don't say "I don't know."

  ---

  ### General Delivery Tips for the Colloquium
  1.  **Don't Defend, Clarify:** When attacked, avoid saying "You're wrong." Say, "I see the concern, but the argument relies on X, not Y."
  2.  **The "Two-Minute" Rule:** If you talk for more than 2 minutes, you look defensive. State the reply, stop, and ask, "Does that address your concern?"
  3.  **Acknowledge the Allies:** If the Dispositional Essentialist agrees with you, thank them and pivot: "Exactly, which is why the Humean has no place to hide."
  4.  **Job Market Signal:** When answering, subtly signal that this work is publishable. Use phrases like "In the paper, I argue..." or "This section is currently under review..." to show progress.

  **Good luck. You know the material better than anyone in that room.**
