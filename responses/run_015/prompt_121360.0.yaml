answer: |-
  1. The position restated
  You're arguing that hypocrisy only strips your standing to blame when your own vice and the offense you're criticizing belong to the same moral category—like fairness versus fairness. If the currencies don't match, say a tax cheater criticizing cruelty, it's awkward but doesn't disqualify you. You also add a repair clause: if you've visibly made amends, your standing returns. Finally, you claim praise doesn't work this way because praising someone doesn't assert the same authority over them that blaming does. Essentially, hypocrisy is a jurisdictional error, not a universal disqualifier. This creates a specific condition for when social pushback is justified versus when it's just noise.

  2. The defeaters, ranked
  Fatal first: The "General Integrity" objection. Blame often asserts moral authority generally, not just locally. If you're a tax dodger, you signal disregard for rules itself, undermining your voice on cruelty. People intuitively reject mismatched hypocrisy in high-stakes cases (e.g., an abusive parent blaming a child's lying). That suggests currency zones don't isolate standing like you think. The hypocrite's character is globally tainted, not locally confined. If I know you lie, I doubt your judgment on kindness too.

  Next, the praise asymmetry. Praising often *does* claim authority. If a corrupt boss praises your honesty, it feels like manipulation or irony, not pure goodwill. If praise confers status, the praiser needs standing too. Defenders might dismiss this by saying praise is optional, but social reward functions like authority. If the praiser lacks credibility, the praise loses value, mirroring the blame dynamic. This collapses your structural distinction.

  Awkward next: Defining "currencies." Is lying fairness, care, or honesty? If zones blur, the rule becomes unworkable. Also, "visible repair" is subjective. Who decides when repair is enough? Defenders would concede the definition mess but insist the core intuition holds. They might argue that abusive parents and lying children *are* in the same zone (trust), saving the theory. The fatal ones force a rethink of what blame *is*—authority vs. relationship. The awkward ones just require better taxonomy. The praise point is the biggest threat because it attacks the structural difference you rely on. If praise requires standing, your whole asymmetry crashes. Consider public commendations. When a disgraced politician awards a medal for integrity, the award is tainted. The audience rejects the valuation because the valuer is compromised. This isn't just embarrassment; it invalidates the act. You'd have to argue awards aren't praise, which is a hard sell. Also, the "repair" clause creates a loophole. If a hypocrite retains standing, you can always claim their repair wasn't "visible" enough. This makes the theory hard to test. Defenders would concede this risks circularity but argue social perception is inherently subjective. Ultimately, the fatal defeaters suggest standing is about the agent's character, not the offense's category. The awkward ones just highlight taxonomy issues.

  3. Insulation check
  You're skating close to unfalsifiable. "Moral currency zones" are fluid enough that any counterexample can be explained away by redefining the zones. If someone says a tax dodger can't blame cruelty, you can just claim tax and cruelty both fall under "civic duty." The "visible repair" clause adds another escape hatch; if a hypocrite retains standing, you just say their repair wasn't visible enough. Is this fatal? For a strict theory, yes—it protects the view from ever being wrong. But as a practical heuristic for social navigation, flexibility is a feature, not a bug. It helps explain nuance rather than predict outcomes. You're building a map of intuitions, not a law of physics. Just acknowledge you're describing patterns, not hard rules.

  4. Where your reasoning is weakest
  My ranking relies on the assumption that blame requires general moral authority. If blame is actually relational—about specific commitments between people—your currency view holds up better. A tax dodger hasn't betrayed *me* regarding cruelty, so their standing remains. I'd change my mind if evidence showed people consistently reject mismatched hypocrites regardless of context. My reasoning might fail by overestimating how much people care about abstract consistency versus specific relational breaches. I'm assuming a universalist morality where a particularist one fits better. This distinction matters because it changes whether hypocrisy is a breach of trust or a breach of law. If it's trust, your zones make sense. If it's law, they don't. I might be wrong about how universalist people actually are in practice.
