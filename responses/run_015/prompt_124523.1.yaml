answer: |-
  Here are three candidate angles for the joke:

  1.  **The Certification Auditor:** An auditor admits that a specific tank passes inspection for prawns but fails for salmon, despite no physical changes to the environment.
  2.  **The Farm Manager:** A manager boasts about achieving 'humane' compliance by downsizing the animal rather than upsizing the tank, actively exploiting the metric.
  3.  **The Supermarket Buyer:** A buyer compares two 'humane' labels side-by-side, oblivious to the fact that the absolute metric renders the comparison meaningless.

  I am going with **Angle 2 (The Farm Manager)**. This approach best highlights the active exploitation of the loophole, shifting the focus from a bureaucratic error to a moral choice made by the producer, which sharpens the ethical critique for an ethics society audience.

  ***

  I was speaking to a farm manager who'd just secured the 'Humane Choice' label for his prawn tanks, and I asked if he'd expanded the water volume per animal to meet the strict new thresholds. He laughed and said, 'Good lord, no; we kept the exact same tanks as the salmon unit next door. But the regulation demands fifty litres per head. For a salmon, that's a prison cell; for a prawn, it's the Atlantic. So technically, we haven't improved the welfare; we've just downsized the tenant until the cage looks like a palace.'

  This loophole undermines the very concept of welfare because it rewards producers for choosing animals that fit the cage, rather than building cages that fit the animal.
