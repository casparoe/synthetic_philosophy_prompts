answer: |-
  To evaluate whether cognition corrupts perception, we must first define our terms. **Informational encapsulation** is the hypothesis that perceptual processing operates without access to an organism's beliefs or desires. **Experience** refers to the phenomenal character of perception—how the world seems—distinct from **judgment**, which is the doxastic commitment to how the world is. **Justification** is the epistemic warrant that renders a belief rational. The debate concerns whether top-down influences violate encapsulation such that experience loses its power to justify judgment. Adopting your proposed taxonomy, we distinguish **sensitivity-like** influences (altering signal gain or discriminability), **criterion-like** influences (shifting decision thresholds based on asymmetric error costs), and **content-imposing** influences (generating representational content absent from the sensory drive). Note that this taxonomy breaks down where sensitivity shifts are so profound they alter qualitative content—for instance, when perceptual learning enables hyperacuity that literally changes what properties are resolvable—but we shall proceed assuming the categories hold sufficiently for epistemic analysis.

  The central claim is that cognitive penetration raises no epistemically distinctive problem. Consider first sensitivity-like and criterion-like influences. These are best modeled by signal detection theory. A system optimizing against noise or asymmetric loss functions—where missing a predator is costlier than false alarms—rationally shifts gain or criteria. Such shifts reduce expected error. If perception is a mechanism for guiding action under uncertainty, these influences are features, not bugs. They do not corrupt the channel; they tune it to the ecological niche. Consequently, these influences do not undermine justification; they reflect a rational calibration of the perceptual system to the subject's situation. An experience shaped by hunger or fear is not epistemically compromised simply because it is biased; it is biased toward survival-relevant truths, which is the proper function of the system.

  The harder case involves content-imposing influences, where a belief seemingly manufactures experience. Here, the epistemic status of the experience inherits the status of the inducing cognitive state. If I believe a warbler is present and consequently see it, the experience offers dependent, not independent, support for that belief. It functions as a mirror, not a source. This resolves the worry that penetration destroys perceptual justification. It does not destroy it; it merely renders the justification parasitic. The experience justifies the belief only if the inducing belief was itself justified. This leads to a revised independence condition: an experience justifies a belief only if the experience is not an epistemic descendant of that very belief. Synchronic circularity is forbidden; diachronic coherence is permitted.

  This inheritance model survives the objection regarding feedback loops. Critics argue that if experience inherits standing from cognition, and cognition from past experience, we face "circularity with extra steps." This objection conflates vicious circularity with reliable calibration. A feedback loop is vicious only if the current justification depends on the current belief. In a diachronic loop, past experiences justify past beliefs, which calibrate current perceptual weights, yielding current experiences. The current experience does not justify the inducing belief; it justifies new beliefs or reinforces old ones via independent checks. The loop is not a closed circle of justification but a spiral of calibration. The epistemic risk lies not in the penetration itself, but in the provenance of the inducing cognitive state.

  This distinction resolves the case of the ornithologist versus the novice. Phenomenally, both see a warbler. Penetration, defined merely as top-down influence, marks no difference. However, the epistemic difference lies in the etiology of the inducing state. The novice's expectation is based on arbitrary assertion; the cognitive state lacks justification. Therefore, the resulting experience inherits zero justificatory power. The expert's expectation is based on forty seasons of calibrated sensitivity and verified judgments. Her cognitive state is highly justified. Consequently, her experience inherits robust justificatory power. The difference is not in the mechanism of penetration—both may involve content-imposing shifts—but in the epistemic standing of the cause. The expert's vision is a reliable instrument refined by evidence; the novice's is a hallucination prompted by guesswork.

  Thus, the debate should not center on whether perception is encapsulated. It is not. Nor should it center on whether penetration compromises justification. It does not, necessarily. The correct upshot is that perceptual justification is conditional on the genealogy of the perceptual state. Sensitivity and criterion shifts are rational optimizations. Content-imposing shifts are epistemic transmitters. When we distinguish the expert's calibrated penetration from the novice's arbitrary penetration, we see that the threat to empiricism comes not from cognition touching perception, but from unjustified cognition masquerading as sensory givenness. Perception remains a foundation, provided we recognize that its blocks are sometimes mortared by belief.
