answer: |-
  Your diagnosis is astute, and your feeling of impasse is structurally justified. You are not missing a hidden premise or a recent paper; you are encountering the limits of the dialectic as it has been framed for the last forty years.

  Here is the structure of the disagreement, evaluated against your hypothesis.

  ### 1. The Diagnosis: Verbal, Substantive, and Displaced

  You ask how much of the stalemate falls into each category. My assessment is that the dispute is **20% verbal, 30% displaced, and 50% substantive**, but the substantive portion is not about truth *per se*; it is about the philosophy of explanation and properties.

  **The Verbal Component (20%):**
  There is a persistent equivocation between *the concept of truth* and *the truth predicate*. Deflationists often argue from the utility of the predicate (we need it for infinite conjunctions); Substantivists argue from the normativity of the concept (belief aims at truth). When a deflationist says "Truth is not a property," they often mean "It is not a *causal* or *reductive* property." When a substantivist replies "But it explains success," they mean "It functions as a property in our best explanations." Much of the shouting matches stem from differing thresholds for what counts as a "property." If one adopts a sparse conception of property (Armstrong), deflationism wins. If one adopts a liberal conception (any predicate that figures in true generalizations), substantivism wins. This is verbal, but it reflects a deeper ontological divide.

  **The Displaced Component (30%):**
  Your first and third points are correct. The debate frequently serves as a proxy war for two other conflicts:
  1.  **Realism about Content:** If truth is substantive, it is easier to be a realist about meaning (truth-conditions determine content). If truth is deflationary, content must be explained via use or conceptual role, which many find insufficient. The "scope" fork you identified is real: deflationists who try to keep substantive reference are unstable. They are trying to have a thin truth and a thick meaning, but the two are theoretically coupled.
  2.  **Classical Logic:** Your Liar case is decisive here. The disagreement over how to handle paradoxical sentences is not a disagreement about truth; it is a disagreement about logic (classical vs. paracomplete/paraconsistent). Deflationists often claim the schema is constitutive of truth. If the schema leads to contradiction, the deflationist must either restrict the schema (admitting it doesn't exhaust truth) or restrict logic. Choosing the latter moves the philosophical weight to the philosophy of logic. The truth debate is hiding behind the logic debate.

  **The Substantive Component (50%):**
  This leaves the core: **The Success Argument and the Nature of Explanation.**
  The substantivist claims: "True beliefs tend to lead to successful action. The best explanation for this regularity is that these beliefs share a common property (truth) that links them to the world."
  The deflationist replies: "No property is needed. For any specific action, the explanation is the specific content of the belief plus the specific desire. The generalization 'true beliefs lead to success' is explained by the infinite conjunction of these specific explanations, captured by the schema."

  This is not verbal. It is a disagreement about **whether generalizations require common properties to be explanatory.**
  *   If you think explanation requires identifying a unifying causal/natural kind, the deflationist fails.
  *   If you think explanation can be disquotational or logical, the deflationist succeeds.

  This is where your "methodological" suspicion hits the mark. The residual disagreement is indeed about what counts as an explanation. But it is not *merely* methodological; it is an ontological commitment about whether the world (or our theory of it) requires robust properties to ground regularities.

  ### 2. Evaluating Your Three-Question Hypothesis

  Your hypothesis is that the "nature of truth" is actually:
  1.  Function of the predicate.
  2.  Metasemantics/Content.
  3.  Logic of self-reference.

  **Where you are right:**
  Separating Q3 (Logic) is correct. The Liar paradox shows that the *consistency* of the truth predicate is a logical problem, not a metaphysical one. Whether we solve it with Kripkean fixed points, revision theory, or contextualism does not decide whether truth is a robust property. It only decides which logic governs the predicate. Moving this to the philosophy of logic dissolves a significant chunk of the confusion.

  **Where you are slightly off:**
  Separating Q1 (Function) and Q2 (Content) is harder than you suggest.
  The deflationist claims Q1 exhausts the theory of truth. But to make that work, they must solve Q2 without relying on truth. If the theory of content *requires* a substantive notion of truth (e.g., to fix reference or determine satisfaction conditions), then Q1 cannot stand alone. The deflationist is forced to provide a deflationary theory of content.
  The stalemate persists because no deflationary theory of content is universally accepted as sufficient, and no substantive theory of content is free from epistemic access problems.
  So, Q2 is not an *independent* argument about meaning folded in; it is a **constraint** on Q1. You cannot settle the function of the truth predicate without settling what the predicate applies to (propositions, sentences, beliefs) and what fixes their content.

  **The Verdict on the Hypothesis:**
  Your diagnosis is 80% correct. The "nature of truth" is a conflation. However, the "methodological" residue you identified (what counts as explanation) is not a fourth question; it is the engine driving the conflict between Q1 and Q2. The substantivist insists Q1 cannot explain the regularities in Q2 without a property. The deflationist insists Q1 explains Q2 via the schema.

  ### 3. The Conservativeness Impasse

  You mentioned the formal result: adding a truth predicate allows proving the consistency of the base theory (non-conservativeness).
  *   **Substantivist:** "See? Truth adds mathematical knowledge. It must be a substantive property."
  *   **Deflationist:** "The truth predicate allows us to formulate the consistency statement, but the *proof* relies on the logical rules governing truth, not a property. We can accept non-conservativeness as a feature of the logic, not the metaphysics."

  Why does this not settle it? Because the disagreement is about **conceptual role**, not mathematical capacity.
  The deflationist intuition is: Truth is *logical*. It shouldn't tell us anything new about the world (the base theory).
  The substantivist intuition is: Truth is *factual*. It captures a relation to the world, so it should entail facts about the base theory (like its consistency).

  Both sides accept the math. They disagree on whether a "deflationary" concept *ought* to be conservative. This is a normative constraint on the concept. Progress here is impossible without one side conceding their intuition about what the concept *should* do.

  ### 4. What Would Count as Progress?

  Given this diagnosis, what constitutes progress?

  **1. A Formal Result?**
  No. As you noted, the conservativeness result is known. Both sides interpret it to fit their framework. More formal results will suffer the same fate. The math underdetermines the philosophy.

  **2. A Settlement of the Paradoxes?**
  No. As per your Q3, this is displaced. Solving the Liar tells us how to regulate the predicate, not whether truth is a robust property. A paraconsistent deflationist and a paraconsistent substantivist can both accept the same solution to the Liar.

  **3. A Completed Deflationary Account of Content?**
  **Yes.** This is the bottleneck. If a deflationist can provide a theory of content (meaning, reference, belief) that does not secretly rely on substantive truth conditions, and which explains linguistic competence and successful action, the substantivist loses their main leverage (the Success Argument).
  *   *Realistic Hope:* Low. Use-theories and conceptual-role semantics struggle with normativity and compositionality without smuggling in truth-conditions. Until this is solved, substantivism retains the "explanatory high ground."

  **4. A Distinction that Dissolves the Question?**
  **Yes, and this is the most likely path.**
  The debate assumes there is *one* concept of truth. Progress lies in **Conceptual Engineering**.
  We should distinguish:
  *   **Truth-as-Disquotation:** A logical device for generalization (Deflationist domain).
  *   **Truth-as-Norm:** A standard for assertion and belief (Epistemic domain).
  *   **Truth-as-Correspondence:** A relation between language and world (Metaphysical domain).

  If we admit these are distinct concepts that overlap in extension but differ in intension, the "stalemate" dissolves. The deflationist is right about the predicate's logic; the substantivist is right about the norm's role in inquiry. The error is assuming they must be the same thing.

  ### 5. Is the Question Ill-Posed?

  You ask if the honest answer is that the question is ill-posed rather than hard.

  **It is ill-posed.**
  The question "What is the nature of truth?" presupposes that truth is a natural kind or a unified theoretical posit. Your impasse arises because it is not. It is a **cluster concept** serving multiple functions (logic, normativity, metaphysics).
  *   When we ask about logic, deflationism is correct.
  *   When we ask about the norm of belief, pragmatism or substantivism is correct.
  *   When we ask about the relation between language and world, correspondence is correct.

  The debate is stuck because each side is defending a different function of the concept while claiming to define the whole.

  **Realistic Hope for Progress:**
  Do not expect a verdict where one side surrenders. Expect a **dissolution via pluralism**.
  Progress looks like:
  1.  Stopping the attempt to force the logic of the predicate (Q3) to decide the metaphysics of the property.
  2.  Acknowledging that the "Success Argument" relies on a specific, contestable view of explanation (properties vs. schemas).
  3.  Shifting focus to **Conceptual Engineering**: Which concept of truth is useful for *this* specific philosophical problem (e.g., ethics vs. mathematics vs. semantics)?

  **Conclusion:**
  Your three-question diagnosis is the correct way to untangle the knot, provided you recognize that Q1 and Q2 are tightly bound by the Success Argument. The stalemate is not a failure of argumentation; it is a symptom of asking a single question about a fragmented concept. The debate is "finished" in the sense that no internal argument will resolve it. It will only end when the field stops asking "What is truth?" and starts asking "Which concept of truth serves this theoretical purpose?"

  The impasse is not a wall; it is a sign that you have reached the boundary of the concept's unity. There is nothing more to find there.
