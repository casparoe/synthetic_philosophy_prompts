prompt: |-
  ok so I'm leading a philosophy-of-art session for juniors who've done Kant's Critique of Judgment but nothing on Schopenhaur. I want them to actually get why he thinks music isn't representational at all—it's a direct copy of the Will, not just "the art that expresses feelings best." I need the teaching plan, not the lecture.

  Audience: 8-10 philosophy juniors, whiteboard only, fifty minutes, no slides.

  Plan out the dependency order: what idea has to be locked in before they can even hear the music claim without reducing it to "emotional art"? I think they need his distinction between representation (Vorstellung) and Will first, but I'm unsure whether to start with the arts hierarchy or with the metaphysics—map the sequence and say what depends on what.

  Then pick the carrying example. I'm torn between using his bass/melody analogy (bass = inorganic world, melody = human will) and using a comparison between a sad painting (representational) vs a minor-key symphony (non-representational). Pick one and defend it—say what the example must have and what it must lack, and tell me why the other one is a pedagogical trap.

  Misconceptions: they'll come in with "representation means depiction" and think Schopenhaur is just ranking arts. Then I think they'll form a second mispconception: that "direct copy of Will" means music communicates the composer's emotional state, like emotional contagion. Where exactly in the sequence do I head off each?

  Also there's a niche check I want at the end: ask them whether an algorithmic drone with no composer and no emotional intent could still be a direct expression of Will, since Schopenhaur cares about structural isomorphism not intentionality. If they say yes for the right reason, they've got it; if they say no because "there's no feeling behind it," they've slipped back into the contagion view.

  Finally, what do I bracket? I'm guessing the Platonic Ideas layer and the full metaphysics of the Will as thing-in-itself—should I just say "not today" and keep the Will as a black-box "striving force"? Tell me exactly what to refuse to explain and why leaving it out protects the main point.

  No readings, no citations—just the sequence, the example, the misconception map, the check, and the bracket.
