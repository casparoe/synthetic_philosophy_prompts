  **GEOLOGICAL INTENTIONALITY METRICS**
  **Position:** Senior Liaison, Non-Human Stakeholder Relations
  **Location:** Remote / Tectonic Plate Boundaries

  **About Us**
  At Geological Intentionality Metrics (GIM), we recognize that history is not merely something that happens to humanity, but something negotiated by active participants with distinct strategic agendas. Our firm specializes in quantifying the agency of subatomic, microbial, and lithospheric entities. We do not view natural disasters as accidents; we view them as leverage. We are seeking a candidate who understands that a volcano does not simply erupt; it communicates dissatisfaction through magma.

  **Key Responsibilities**
  *   Facilitate dialogue between human executive boards and volatile environmental actors.
  *   Reframe historical contagions as calculated market corrections rather than biological inevitabilities.
  *   Develop risk mitigation strategies that respect the autonomy of climate systems.

  **Qualifications**
  Candidates must possess a demonstrated history of interpreting non-verbal geological signaling. Fluency in Tambora's 1815 negotiation posture is required; successful applicants will have analyzed the eruption not as a tragedy, but as a强硬 stance on atmospheric carbon limits. We require documented experience framing *Yersinia pestis* as a strategic actor during the Black Death, specifically regarding its supply chain disruptions and workforce restructuring initiatives.

  Furthermore, familiarity with the Little Ice Age's expectation-management style is essential. The ideal candidate understands that cooling periods are often feedback mechanisms responding to poor diplomatic engagement from agrarian sectors. You must be comfortable discussing pyroclastic flows as persuasive arguments rather than destructive forces.

  **Performance Metrics**
  GIM utilizes a proprietary Leadership Potential Index (LPI) to score eruptions. This metric weighs the velocity of pyroclastic flow against long-term diplomatic outcomes. A high-velocity flow that results in productive societal restructuring scores higher than a sluggish eruption with ambiguous messaging. Candidates must be prepared to audit past events using LPI standards without imposing anthropocentric bias.

  ***

  **SIDEBAR: EMPLOYEE BENEFITS & NON-HUMAN CLIENT RETENTION**
  *   **Immunity Packages:** Comprehensive coverage for exposure to client pathogens during onsite visits.
  *   **Thermal Regulation:** Stipends for apparel suitable for rapid climate shifts initiated by dissatisfied atmospheric clients.
  *   **Seismic Leave:** Unlimited paid time off following significant tectonic negotiations.
  *   **Retention Bonuses:** Awarded when microbial clients agree to dormancy periods exceeding five fiscal quarters.
  *   **Crisis Counseling:** Access to specialists trained in post-event rationalization for stakeholders affected by intentional weather patterns.

  ***

  **Application Instructions**
  To apply, please submit a cover letter detailing your philosophy on environmental agency and a case study of a historical disaster you believe was misinterpreted as accidental. Do not attribute malice to nature; attribute strategy. Submit all materials through our secure portal. Please allow up to six weeks for our review committee to consult with relevant atmospheric currents before we recieve your file.

  *Geological Intentionality Metrics: Understanding the Earth's Executive Decisions.*
