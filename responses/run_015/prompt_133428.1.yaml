  **JOINT FRAMEWORK FOR MULTI-INSTANTIATION IDENTITY (DRAFT 7)**
  **Subject:** Case File 89-B (The "Triad" Incident)
  **Status:** Pending Legal Review // Philosophical Consensus Reached

  **PREAMBLE**
  We, the undersigned representatives of the Distributed-Self Working Group and the Hard-Boundary Individualist Coalition, submit this framework not as a resolution of metaphysical truth, but as an operational baseline. We recognize that the subject (hereafter "The Origin") has been instantiated across three distinct biological substrates. While we disagree on the ultimate nature of the soul/self, we agree on the following functional claims to facilitate ethical handling and legal liability assessment.

  **SECTION 1: AGREED CLAIMS (CONSENSUS)**
  *Both camps sign below without conceding deeper metaphysical ground.*

  1.  **Pattern Persistence Over Atomic Continuity:** Both camps agree that "identity" relies heavily on the preservation of complex informational patterns (memory, personality traits, cognitive habits) rather than the strict continuity of specific atoms. If the pattern survives the transfer/split, something of the Origin persists.
  2.  **The Indexical "I":** Both camps agree that the word "I," when spoken by any of the three bodies, refers strictly to the immediate locus of consciousness speaking. It does not automatically grant authority over the experiences of the other two bodies, nor does it deny their existence.
  3.  **Memory as Reconstruction, Not Origin Proof:** Both camps agree that memory access is not proof of originality. The fact that all three bodies recall being the Origin up to the moment of split confirms data replication, not singular continuity. Possession of a memory does not prove possession of the original soul.
  4.  **Divergence is Inevitable:** Both camps agree that from the moment of split, the three bodies will accumulate unique sensory data and emotional states. They are functionally distinct agents from T+1 second onwards, regardless of whether they share a "root" identity.

  ***

  **SECTION 2: AREAS OF DISAGREEMENT (THE CRUXES)**
  *We cannot sign off on these definitions. Below is the exact wording each camp uses internally, along with the thought experiments we agree are relevant for testing these positions in court.*

  | Crux | Distributed-Self Camp Wording | Hard-Boundary Individualist Wording | Shared Thought Experiment | Distributed Prediction | Boundary Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Emotional Continuity**<br>*(Does feeling require one brain?)* | "Emotion is a social signal and a pattern state. If Body A feels grief and Bodies B/C do not, the ' grief pattern' is still part of the collective self-narrative. The self is a chorus; one voice singing sad doesn't silence the song." | "Emotion is a localized biological event. If Body A feels grief, only Body A suffers. To claim B/C share that grief is metaphorical, not literal. Suffering cannot be distributed; it must be housed." | **The Asymmetric Trauma Test:**<br>Inform only Body A of a family death. Keep B and C in the dark. Measure cortisol and psychological distress in all three. | Body A's distress is valid for the whole 'person.' B and C are in a state of ignorance, not innocence. The 'self' is traumatized, even if parts are unaware. | Only Body A is traumatized. B and C are legally and morally distinct strangers who happen to look like A. Punishing A does not punish B. |
  | **2. Termination of Copies**<br>*(Killing vs. Trimming)* | "Destroying two bodies is data pruning, not murder. If the pattern persists in the remaining body, the 'person' survives. It is akin to amputating a limb to save the host, or closing duplicate tabs on a browser." | "Destroying two bodies is the execution of two distinct individuals. Once the split occurs, three unique life-lines exist. Severing one is death, full stop. You cannot kill 2/3 of a person; you are killing two people." | **The Stability Cull:**<br>After 7 days of stable tri-existence, shut down Bodies B and C to conserve resources, leaving Body A active. | The Origin survives in Body A. B and C were temporary branches. No death occurs, only a reduction in bandwidth. | Two murders occur. Body A survives, but B and C are killed. The 'Origin' is irrelevant; the individuals B and C are dead. |

  ***

  **SECTION 3: OPERATIONAL RECOMMENDATION**
  Until a higher court rules on the metaphysical status of the Triad, we recommend treating all three bodies as legally independent persons for the purpose of *rights* (Hard-Boundary standard), but as a single entity for the purpose of *asset ownership and liability* (Distributed-Self standard). This hybrid approach minimizes immediate harm while we debate the soul.

  **Signatories:**
  Dr. Aris Thorne (Lead, Distributed-Self Working Group)
  Justice M. Kael (Lead, Hard-Boundary Individualist Coalition)

  *Note: this document isnt final. Circulate internally only.*
