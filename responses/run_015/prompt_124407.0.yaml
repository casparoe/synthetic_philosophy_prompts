      *   *Load-Bearing:* It's Dispute 1 (Common Prior). If priors can differ rationally, the theorem's normative force evaporates. The friend *must* defend the Harsanyi Doctrine to maintain their position.
      *   *Type of Stalemate:* It's a **Normative-Descriptive Mismatch**. The friend treats the theorem as a law of epistemology (Normative). The user treats it as a consistency check on a model (Descriptive/Formal). It's also a clash between **Objective vs. Subjective Bayesianism**.
