answer: |-
  I take the third horn: I maintain that I know my own phenomenal states, and I deny that this renders my view self-stultifying. I do not give up the causal inertness of the phenomenal, nor do I abandon the requirement for a non-accidental link between belief and truth-maker; rather, I insist that this link is constitutive, not causal. Knowledge by acquaintance does not require the truth-maker to push the belief into existence; it requires that the belief be constituted by the presence of the truth-maker itself. In the normal case, the physical realizer correlates the utterance with the experience, but in your swap case, the physical mechanism continues to produce the sound "red" while the experience is green. I concede freely that the *utterance* becomes false and the *reporting mechanism* becomes unreliable. But the *judgment*—the mental act constituted by the experience—remains true because it is built out of the very greenness it apprehends.

  The charge of self-stultification only holds if knowledge requires the reliable production of true speech acts. I reject that. Knowledge requires the subject to stand in the right relation to the fact, and acquaintance is the right relation. Post-swap, the physical machine lies, but the subject knows. The inertness of the phenomenal property explains precisely why the speech goes wrong: since the qualia do not cause the utterance, changing the qualia while holding the physical cause fixed leaves the utterance unchanged. This disconnect proves the inertness, not the ignorance. I know I see green because I am acquainted with the green, even if my tongue, driven by a physical cause blind to that green, says "red." The luminosity of experience is internal to the experience, not a feature of the downstream causal chain.
