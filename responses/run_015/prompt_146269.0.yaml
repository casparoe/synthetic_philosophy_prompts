          *   **Tone:** Professional, academic, sharp, suitable for a PhD moderator.

  2.  **Evaluate the Philosophical Framing (The "Truth Test"):**
      *   *The WKR Problem:* Traditionally applies to attitudes like belief, admiration, or blame. Can you have a reason to *have* an attitude that isn't a reason *for* the content of the attitude? (e.g., The Demon case: Believe I have a million dollars or I kill you. Pragmatic reason to believe, but no evidential reason.)
      *   *Dr. Voss's Extension:* Extending this to *institutional admiration* or *institutional endorsement*.
      *   *The Claim:* Institutions can have RKR even if individuals have WKR.
      *   *Is this a category mistake?*
          *   Not necessarily. Collective intentionality (Searle, Tuomela, List & Pettit) is a robust field. The idea that group agents have reasons distinct from member reasons is standard in social ontology (e.g., Philip Pettit's "group agents").
          *   *However*, the specific application of WKR here is tricky. WKR is usually about the *fittingness* of an attitude. Does an institution "admire" or "believe"? If we treat the institution as an agent (functionalism), it can have attitudes.
          *   *The "Collective WKR Gap":* This sounds like a variation on the "discursive dilemma" or the distinction between *summative* vs. *collective* judgment.
          *   *Potential Confusion:* The user asks if "extending WKR to groups is just a category mistake."
          *   *Verdict:* It's not a *blatant* category mistake if one accepts non-reductive collective agency. However, there is a risk of equivocation. If "institutional admiration" just means "the institution adopts a policy," then WKR might just collapse into "pragmatic vs. epistemic/normative reasons for policy adoption."
          *   *The "Functionalism" Worry:* This is the strongest philosophical pushback. If you say the institution has reasons independent of members, you are likely relying on a functionalist account of group agency.
          *   *The "Democracy" Worry:* If citizens vote selfishly (WKR for the collective good), does democracy break? This touches on the "invisible hand" arguments (Smith, Mandeville) vs. civic republicanism.
      *   *Conclusion on Framing:* The framing is *plausible* within contemporary social ontology, but it is contentious. It's not "botched," but it requires careful handling to avoid conflating *reasons for action* with *reasons for attitude*. I should validate the user's framing but warn them about the functionalist trap.

  3.  **Drafting the Questions:**
      *   *Goal:* 6-8 total. 3 specific ones requested (Functionalism, Accidental Correctness, Democracy) + 3-5 others to round out the panel.
      *   *Style:* Sharp, precise, referencing the specific terminology (RKR, WKR, structural justification).

      *   *Question 1 (Functionalism):* Focus on whether "institutional reasons" are just functional roles.
          *   *Follow-up:* She will say "Structural vs. Motivational." Push on whether structure without motivation is truly *normative*.
      *   *Question 2 (Accidental Correctness):* The bribed committee case. Is it *praise*worthy?
          *   *Follow-up:* She will say "Structure justifies." Push on whether "luck" undermines the normative force.
      *   *Question 3 (Democracy):* Self-interested voting.
          *   *Follow-up:* She will say "Aggregate structure matters." Push on civic virtue/legitimacy.
      *   *Questions 4-8 (Fillers/Deepeners):*
