answer: |-
  Here is the straight talk on the framing, followed by the questions you requested.

  ### Part 1: The "Straight Talk" on the Framing

  **Is this a category mistake?**
  No, but it is metaphysically expensive. You are not botching the literature, but you are walking into a live wire in social ontology.

  The traditional Wrong-Kind-of-Reasons (WKR) problem turns on the **fittingness** of an attitude (e.g., admiration is fitting only if the object is admirable). For Dr. Voss's extension to work, she must commit to **non-reductive collective agency**. She has to claim that institutions are not just aggregates of people, but agents in their own right that can hold attitudes (like "admiration" or "endorsement") distinct from the mental states of their members.

  **The Risk:** If she treats the institution as a mere functional system (like a thermostat), the WKR problem dissolves into a pragmatic vs. functional distinction. If she treats it as a *moral* agent, she needs to explain how an entity without a phenomenology can have "fitting" attitudes.
  **The Verdict:** Her position is defensible (Philip Pettit and Christian List have done heavy lifting here), but her "Collective WKR Gap" is a novel synthesis. It is not confused, but it relies entirely on whether you grant the institution ontological status separate from its members. Your questions should test whether that status is robust or just a *façon de parler*.

  ***

  ### Part 2: The Core Questions (With Anticipated Follow-ups)

  Here are the three specific questions you requested, designed to press on the weak points of her "structural justification" defense.

  #### 1. The Functionalism Trap
  **Question:** "Dr. Voss, you argue that an institution can possess Right-Kind Reasons (RKR) even when its members operate on Wrong-Kind Reasons (WKR). Critics might suggest this only works if we treat institutional rationality as purely functional—where 'reasons' are just inputs that maintain system stability. If you deny functionalism, what *metaphysical ground* allows the institution to 'hold' a reason that none of its constituents possess? Are you smuggling in a ghost in the machine?"

  **Likely Reply:** She will likely distinguish **Structural Justification** (the policy fits the institutional goal) from **Motivational Explanation** (why the humans did it). She will argue the institution's reason resides in the structure, not the heads.

  **Follow-up:** "If the structural justification is completely decoupled from the motivational explanation, doesn't the institution become a normative zombie? If the 'reason' doesn't anchor in *anyone's* recognition of value, in what sense is it a *reason* rather than just a causal mechanism that happened to output the right result?"

  #### 2. The Accidental Correctness (Bribed Committee)
  **Question:** "Consider a committee that votes to fund a life-saving drug, but every member voted for it because they were bribed by the pharmaceutical company. On your view, the collective outcome has RKR (harm reduction), but the individuals acted on WKR (bribery). Does this institution deserve *moral credit* for the decision? If the 'Collective WKR Gap' allows the right outcome to emerge from the wrong motives, have you effectively normalized moral luck as a sufficient condition for institutional praise?"

  **Likely Reply:** She will likely argue that **Structural Justification** secures the normative status of the *policy*, even if the *agents* are blameworthy. The institution is "right," the people are "corrupt."

  **Follow-up:** "But if the structural justification is stable even when the motivational basis is corrupt, doesn't that make the institution's normative status fragile? If the 'right reason' exists only at the abstract level, what prevents the institution from collapsing the moment the bribes stop? Is a 'reason' that cannot sustain its own implementation actually a reason?"

  #### 3. The Democratic Breakdown
  **Question:** "Let's apply this to democracy. If citizens vote solely on self-interested WKR (e.g., 'this policy helps my wallet'), but the aggregate result aligns with the public good (RKR), does the 'Collective WKR Gap' imply that civic virtue is conceptually unnecessary? If the structural justification of the vote outweighs the motivational deficit of the voters, have you rendered the concept of 'corrupt electorate' incoherent?"

  **Likely Reply:** She will likely reiterate that **Structural Justification** validates the *legitimacy of the law*, while **Motivational Explanation** assesses the *virtue of the citizen*. She will try to keep the two lanes separate.

  **Follow-up:** "I'm pressing on the stability of that separation. If the legitimacy of the democracy relies entirely on the structural output and not the civic input, why should the state invest in civic education at all? Does your view imply that we should design institutions assuming citizens will *always* act on WKR, effectively baking cynicism into the political ontology?"

  ***

  ### Part 3: Supplemental Questions (To reach 6-8 total)

  Use these to fill time or pivot if the debate gets stuck on the three above.

  **4. The Terminology of "Admiration"**
  "You use the phrase 'Institutional Admiration.' Traditionally, admiration requires a subject capable of feeling elevation or respect. If an institution cannot feel, are we speaking metaphorically? If it is metaphorical, does the WKR problem retain its normative bite, or does it become a mere analogy?"

  **5. Responsibility Asymmetry**
  "If the institution has RKR but the individuals have WKR, who is responsible when the policy fails? If the 'Collective WKR Gap' splits the normative story, does it also split the blame? Can we punish the institution without punishing the individuals who were merely following the 'structural justification'?"

  **6. The Reductionist Challenge**
  "Could your 'Collective WKR Gap' be fully reduced to a complex individualist story? For example, isn't the institution's 'RKR' just the sum of the individuals' second-order beliefs about what the institution *should* do? What work is the collective agent doing that a sophisticated individualism couldn't do?"

  **7. Design Implications**
  "If you are correct that structural justification can outperform motivational explanation, what is the primary task of institutional design? Should we stop trying to align individual incentives with moral reasons and focus entirely on building 'WKR-proof' structures that harvest selfish motives for good ends?"

  **8. The Analogy Strength**
  "How tight is the analogy between individual WKR and collective WKR? In the individual case, acting on WKR (e.g., believing a lie because it makes you happy) often corrodes the agent's rationality over time. Does acting on WKR corrode the *institution's* rationality similarly, or are institutions immune to this kind of rational decay?"

  ***

  ### Part 4: Moderation Tips for a PhD Student

  1.  **Watch the "Level" Switch:** Dr. Voss will try to jump between levels (talking about the *policy* when you ask about the *people*, or vice versa). Your job is to pin her down. Use phrases like: *"Let's hold the structural level fixed for a moment and look strictly at the agents..."*
  2.  **The "Zombie" Objection:** The strongest philosophical pushback against her view is that institutions without aligned member motivations are "normative zombies." If she struggles with the Functionalism question, pivot to Question 4 (Admiration terminology) to give her a way out to clarify her metaphysics.
  3.  **Time Management:** The Follow-ups provided above are "killer" questions. If the panel is short, use the Follow-up as the primary question to save time.
  4.  **Validate then Pivot:** Since you are a student moderating a senior philosopher, use the "Validate then Pivot" technique. *"That distinction between structure and motivation is helpful, but it seems to lead to [Problem X]..."* This shows you understand her view before critiquing it.

  Good luck. This is a solid panel topic; if you keep her pinned on the *ontological status* of the institution, you'll generate a great discussion.
