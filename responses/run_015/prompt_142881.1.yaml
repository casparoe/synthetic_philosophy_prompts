answer: |-
  Thank you for coming to the fire hall. Marion was very specific: this is a party, not a funeral. She spent her life arguing against the idea that there's a little room inside our heads where a single self sits and watches the world go by. She believed consciousness isn't a place you go; it's a deadline you meet. A thought becomes real, she said, when it's too late to revise it.

  I know some of you are waiting for me to say she's watching us from somewhere better. I know others are waiting for me to defend her theories from the podium. I'm going to do neither. Instead, I want to answer a hard question a friend asked me this week. He said: "If Marion was right, and there is no central self, no inner spectator, then who is this eulogy about? You're telling a story, but on her own view, there was never a single 'she' to be the subject of it."

  It's a fair challenge. If we aren't a fixed point, what survives?

  The answer is in the work she left us. Marion taught us that character isn't a hidden core; it's the pattern that survives many passes of revision. When she lost the ability to recognize faces after her stroke, she didn't retreat. She learned us by our gait. She knew a friend by the sound of their step on her dock. She knew us by how we moved toward her.

  So, who is the "she" we are here to honor? It isn't a ghost that has floated away. It is that pattern. It is the specific, unrepeatable way she engaged with the world, which is now fixed. The editorial deadline has passed. There will be no more revisions. In her terms, that is what "peace" means. It means the struggle of drafting is over. The text is final.

  To her family, and especially to Lois: You wanted to know that she knew we loved her. She did. Not because she is perceiving it now from a distance, but because your love was part of the material she was working with until the very end. You were in the drafts. When she asked for a step or two to identify a neighbor, she was giving them time to show her who they were. You showed her. She knew us by how we cared for her, and that knowledge is now part of the permanent record. She isn't watching over us, but the shape of her life now constrains ours. We walk differently because she walked here.

  Some of her colleagues thought her model was wrong-headed. Some of her neighbors just thought she was the woman with the bad dog. She would have loved that mix. She knew that the "Marion" you knew was a collaboration between her biology and your perception. There is no contradiction between the scientist who denied the inner self and the woman who hugged her sister. The hug was real *because* it was a physical event, not a spiritual one.

  So, I am not standing here to summon a spirit. I am standing here to acknowledge that a pattern has completed. A story has reached its period.

  My friend worried that without a soul, a eulogy is empty. I say it is full. It is full of the echoes she set in motion. If you want to find her, don't look up. Look at how you walk. Look at the work you refuse to revise because you know it's true. Look at the dock.

  She told me once, "There is no 'in there' to be in." She was right. But there is an "out here." And out here, the pattern holds.

  Marion's deadline has passed. Ours haven't. Let's get back to the party. She'd hate for the food to get cold while we philosophized.

  To Marion.
