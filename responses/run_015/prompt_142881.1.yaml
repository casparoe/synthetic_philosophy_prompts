      *   **The Conflict:** The speaker is arguing with an old friend about what can be said.
          *   *Friend's Soft Objection:* Don't turn grief into a seminar; don't be precious about idioms like "she's at peace."
          *   *Friend's Hard Objection:* If Selby's theory (no Cartesian theater, multiple drafts, editorial deadlines) is true, there is no continuous "self" to eulogize. A eulogy implies a subject; her theory denies a unified subject.
      *   **Selby's Theory:** Consciousness isn't a place (Cartesian theater) but an "editorial deadline." A decision/experience is "yours" when it's too late to revise. Character is the pattern that survives revision. No "inner self." After her stroke (prosopagnosia), she recognized people by gait/voice, not by an inner image. "There is no in there to be in."
      *   **Constraints:**
          *   Length: ~700 words (5-minute talk).
          *   Tone: Party speech, not a lecture. Accessible to all.
