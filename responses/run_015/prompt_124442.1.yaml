  2. Anchor the discussion on a map projection of population density rather than traffic signs, because maps explicitly demonstrate how conventional choices of scale and projection encode theoretical commitments without claiming mirroring accuracy. Traffic signs imply fixed commands, whereas maps illustrate the necessary distortion involved in representing complex spatial data within a unified framework.
  3. Head off the belief that pictures are theory-neutral immediately after introducing the map example, and counter the idea that rejecting atomic protocol sentences implies observational skepticism during the discussion of physicalist translation. Clarify that conventions replace foundations, not observation itself.
  4. Conclude by asking students to formulate how a change in ISOTYPE convention alters the truth conditions of a statement, ensuring they grasp the epistemological claim rather than merely the graphic method. If they focus only on clarity or aesthetics, they have missed the anti-foundationalist argument.
  5. Explicitly omit details regarding Neurath's conflicts with Carnap to avoid distracting polemics, though I would revise this exclusion if evidence showed those debates fundamentally shaped the pictorial conventions. The step in my reasoning most likely to be mistaken is assuming students can separate the graphic method from the epistemological claim without rigorous testing.
