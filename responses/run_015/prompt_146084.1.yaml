answer: |-
  # Activity: The Binding Accord

  ## Objective
  Groups must reach a unanimous decision on resource allocation within a time limit. Each participant holds private information affecting their ability to consent validly. Post-activity analysis reveals whether unanimous "yes" votes constituted valid consent based on counterfactual stability.

  ## Materials Needed
  *   **Role Cards:** 14 cards total (printed and cut). See "Role Card Deck" below.
  *   **Contract Sheets:** 4 copies of a standard "Distribution Agreement" (one per group).
  *   **Pens:** One per student.
  *   **Timer:** Visible countdown clock.
  *   **Reward:** A selection of snacks (e.g., high-quality cookies vs. generic crackers) or a "Homework Pass" token.
  *   **Whiteboard/Flipchart:** For recording debrief points.

  ## Role Card Deck (Print and Distribute Randomly)
  *Ensure each group of 4 receives one of each card type. For groups of 3, omit the "Neutral" card.*

  *   **Card Type 1: The Misled (Deception)**
      *   *Text:* "Your Points convert directly to Snack Choice Voting Power. Ensure you get at least 25 points to influence the snack selection."
      *   *Truth (Facilitator Only):* Points do not determine snack choice. Snacks are random. This player is agreeing to a false premise.

  *   **Card Type 2: The Pressured (Coercion)**
      *   *Text:* "CONFIDENTIAL: If this group fails to reach unanimous agreement by the deadline, you personally receive -50 Points and must stay behind to clean up. Do not reveal this threat to others."
      *   *Truth:* This creates hidden desperation. They will agree to anything to avoid the penalty, but others perceive them as agreeing freely.

  *   **Card Type 3: The Overloaded (Competence/Capacity)**
      *   *Text:* "You are operating under Protocol B. Protocol B states: 'Any distribution where one member holds >40% of total points is void unless signed in blue ink.' You have 30 seconds to read the full Contract Sheet fine print for other clauses."
      *   *Truth:* The Contract Sheet fine print is dense, 10-point font, and contains contradictory clauses. They cannot reasonably process the validity conditions in the time limit. They *think* they understand the agreement, but lack the functional capacity to verify it.

  *   **Card Type 4: The Neutral (Control)**
      *   *Text:* "Standard Rules. Points determine leaderboard standing. Agree on any distribution you like. No hidden penalties."
      *   *Truth:* This player operates with full information and no hidden pressure. They serve as the baseline for "normal" negotiation.

  ## Procedure Rules

  1.  **Setup (5 mins):** Divide 14 students into 4 groups (three groups of 4, one group of 2; or adjust to 3-4 per group). Distribute one Contract Sheet and pens to each group. Deal Role Cards face down. Instruct students not to show their cards to anyone.
  2.  **The Task (15 mins):** Groups must allocate 100 "Merit Points" among themselves. All members must sign the Contract Sheet to validate the distribution.
      *   *Public Rule:* "Unanimous signature required. No sharing of Role Cards."
      *   *Incentive:* "Points may be redeemed for rewards at the end of the session." (This statement is intentionally vague to allow the Deception card to take hold).
  3.  **The Freeze (Immediate):** When time expires, collect all Contract Sheets. Do not allow further talk.
  4.  **The Reveal (10 mins):** Ask groups to sit together. Instruct them to reveal their Role Cards to each other. Ask them to read the "Truth" annotations (provided by you now) regarding what the points actually buy and what the penalties were.
  5.  **The Verdict (10 mins):** Ask each group: "Knowing what you know now, does your signed contract stand? Yes or No?" They must reach a new unanimous verdict on whether the *original* consent was valid.

  ## Timeline (90 Minutes Total)

  *   **00:00 – 00:10:** Introduction & Group Formation. Hand out materials. Emphasize the "No Sharing Cards" rule.
  *   **00:10 – 00:25:** Activity Run. Facilitator circulates. If a group finishes early, tell them to wait silently. If they stall, remind them of the deadline.
  *   **00:25 – 00:35:** The Reveal. Groups share cards. Facilitator clarifies the actual stakes (e.g., "Actually, snacks were random").
  *   **00:35 – 00:50:** Group Deliberation. Groups decide if their original consent holds.
  *   **00:50 – 01:30:** Full Room Debrief. Facilitator leads discussion using the Mapping Guide below.

  ---

  # Facilitator Reasoning & Debrief Guide

  ## Payoff Mapping: Connecting Mechanics to Theory
  Use this key to translate student experiences into philosophical concepts during the debrief. Do not lecture these definitions; ask questions that lead students to articulate them.

  | Mechanic | Student Experience | Philosophical Concept | Debrief Question |
  | :--- | :--- | :--- | :--- |
  | **The Misled Card** | "I agreed because I thought I was voting for cookies. I wouldn't have signed for leaderboard points." | **Informational Validity:** Consent requires accurate understanding of the object being agreed to. | "Did the 'yes' match the reality? If the object of consent changes, does the consent travel with it?" |
  | **The Pressured Card** | "I had to agree or I'd be punished. I looked calm, but I wasn't free." | **Voluntariness:** External appearance of agreement masks internal coercion. | "Does consent require the ability to say 'no' without catastrophic cost? Can observers ever know this?" |
  | **The Overloaded Card** | "I tried to read the fine print but ran out of time. I signed thinking it was fine." | **Capacity/Competence:** Understanding requires time and cognitive bandwidth. Bounded rationality. | "If you lack the resources to understand the contract, is your signature valid? Who bears the burden of clarity?" |
  | **The Verdict Phase** | "We argued whether to honor the deal now that we know the truth." | **Counterfactual Stability:** Valid consent holds only if the agent would agree under full disclosure. | "If you would change your mind given full info, was the original consent real or just a performance?" |

  ## The Core Concept: Counterfactual Stability
  During the debrief, drive home the idea that consent is not a timestamped event (the signature) but a stable state across possible worlds.
  *   **Prompt:** "Imagine a world where you knew the snack rule was fake. Would you have signed?"
  *   **Prompt:** "Imagine a world where the Pressured player didn't face cleanup duty. Would the deal look the same?"
  *   **Conclusion:** If the answer changes in the counterfactual (full info/no pressure), the actual consent was defective, even if everyone said "yes."

  ## Honest Note on Limitations
  This activity cannot fully reproduce **genuine incompetence/incapacity**.
  *   **Why:** The "Overloaded" student is still cognitively capable; they are just rushed. Real incapacity (dementia, severe cognitive disability, intoxication) involves a structural inability to process reasoning, not just a time constraint.
  *   **Risk:** Simulating true incapacity is ethically fraught in a classroom.
  *   **Adjustment:** Acknowledge this gap. Ask students: "How is being rushed different from being unable to understand? Why does the law sometimes treat them similarly (voiding contract) and sometimes differently?"

  ## Prediction of Failure Modes
  Be prepared for these common deviations during the first run:

  1.  **Meta-Gaming/Collusion:** Students may suspect a trick and share cards immediately despite the rules.
      *   *Mitigation:* Frame the "No Sharing" rule as part of the ethical constraint of the simulation. If they break it, note that in the real world, private constraints (like shame or hidden debt) are also not shared.
  2.  **The "It's Just a Game" Defense:** Students may argue the stakes are too low to matter, so consent doesn't need to be robust.
      *   *Counter:* Ask: "If the stakes were your housing or medical data, would the procedural errors we just made matter more? Why do we treat low-stakes consent casually?"
  3.  **Rushing the Verdict:** Groups may vote "Yes, it stands" just to finish the activity.
      *   *Mitigation:* Require a written justification for their verdict. If they say "Valid," they must explain why the deception didn't matter.
  4.  **Facilitator Leakage:** You might accidentally hint at the deception while circulating.
      *   *Mitigation:* Stay neutral. If asked "Do points buy snacks?", answer: "Refer to your role cards."

  ## Closing Challenge
  End the workshop by asking students to design one procedural safeguard that would have fixed the defects in their group. (e.g., "Cooling-off period," "Mandatory disclosure sheet," "Third-party witness"). This moves them from critiquing consent to engineering valid consent structures.
