      *   *2. Expressive Function:* Naming matters for recognition and dignity. If it feels like genocide to victims, ignoring that has moral costs. However, this is secondary to factual accuracy.
      *   *3. Expected Consequences:* This is the "politics of naming" angle. Does calling it genocide help or hurt? (R2P vs. hardening positions). This is pragmatic, not definitional. It should weigh less than truth/evidence but more than abstract semantic worries.
      *   *4. Semantic Ratchet:* The fear of dilution. Important for long-term utility of the term, but shouldn't prevent accurate labeling of a current case.
      *   *5. Parity with Paradigm Cases:* The "Holocaust comparison" anxiety. This is often a political blocker rather than a analytical tool. The Convention covers acts smaller than the Holocaust. This should carry the least weight analytically.

  4.  **Drafting the Ranking (Iterative Process):**

