  1. **Whether intent to destroy the group as such can be inferred from the pattern of conduct:** This is the substantive threshold because without inferring specific intent from the systematic assimilation and targeted killing, the legal and moral definition cannot be met regardless of other factors.
  2. **The expressive function:** Acknowledging the victims' experience and securing their place in history carries significant moral weight when the evidentiary picture is complex.
  3. **Expected consequences:** While pragmatic outcomes matter for policy, allowing potential consequences to dictate factual classification risks instrumentalizing the truth.
  4. **The semantic ratchet:** Protecting the term's future utility is important but should not preclude accurate labeling of present atrocities that meet the criteria.
  5. **Parity with paradigm cases:** The legal definition does not require a specific body count or comparison to the Holocaust, making magnitude-based exclusion analytically irrelevant.

  **Probability:** 0.78

  **Court vs. Commission:** No, the ranking would not be the same; in a criminal court, consideration 1 becomes nearly exclusive as legal liability requires proof beyond reasonable doubt, whereas considerations 2 and 3 carry almost no weight in a strict judicial finding compared to a political or historical inquiry.

  **Confidence:** 85%

  **Least Sure:** Item 3 (Expected consequences), because in a "politics of naming" context, the ethical duty to prevent future harm through intervention can sometimes arguably outweigh the duty to neutral classification, making its precise weight relative to the expressive function difficult to fix.
