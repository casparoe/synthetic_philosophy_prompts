answer: |-
  It is completely understandable that you find this passage tricky because Aristotle is doing several things at once in Book 4, Chapter 9, shifting between describing how democracies actually function, prescribing how they should function to remain stable, and analyzing the underlying philosophical principles of selection. Your initial reading is correct that Aristotle identifies election by vote as an aristocratic principle because it presupposes inequality in merit or reputation, whereas selection by lot is democratic because it presupposes equality among citizens. However, the confusion arises when he qualifies the use of lot by suggesting it is best suited for offices where special skill is not required. This does not mean that lot is useless or that democracy must restrict itself to trivial offices, but rather that Aristotle is advocating for a mixed constitution, which he calls a polity, where different methods of selection are applied to different functions to balance stability with equality. For Aristotle, the purpose of political participation is not merely administrative efficiency but the cultivation of virtue and the prevention of factionalism, so even if a citizen lacks specialized skill, rotating them through offices via lot ensures they remain invested in the regime and prevents any single group from monopolizing power.

  When you ask whether Aristotle is saying democracy should limit lot to offices where skill does not matter, the answer is largely yes, but with the caveat that he believes many offices do not require specialized expertise in the way we might think of technical professions today. He distinguishes between offices like generals or treasurers, which require specific knowledge and experience and should therefore be elected, and offices like jurors or council members, where the collective judgment of ordinary citizens is sufficient or even superior. This is where your intuition about modern lottocracy starts to map onto Aristotle, though the logic differs slightly. Modern proponents of sortition often argue that random selection eliminates campaign corruption and ensures descriptive representation, making it ideal for deliberative bodies like citizens' assemblies, while acknowledging that executive roles require accountability and expertise that lot cannot provide. Aristotle shares the view that executive or highly technical roles should be elected, but his primary concern is not corruption in the modern sense of money in politics, but rather the constitutional balance between the many and the few. He wants to mix democratic and oligarchic features to create a stable mean, so he might suggest electing generals from all citizens (a democratic twist on an aristocratic method) while using lot for the council, thereby blending the principles rather than keeping them strictly separate.

  Regarding your worry about whether this makes lot useless if there is no real difference in skill, Aristotle would argue that the value of lot is not in finding the best ruler but in affirming the status of the citizen. In a democracy, the assumption is that citizens are equal in liberty and capacity for judgment, so lot is the mechanism that actualizes that equality. If you only used election, you would implicitly admit that some are naturally superior rulers, which shifts the regime toward oligarchy or aristocracy. Therefore, lot is not useless even if skill differences exist; it is a political tool to maintain the regime's identity. However, Aristotle is pragmatic enough to admit that ignoring skill entirely can lead to incompetence that harms the state, which is why he recommends the mixed approach where critical roles are elected. This suggests he is not forcing democracy into a box where it can only do trivial things, but rather advising democracies to adopt aristocratic mechanisms for specific tasks to ensure survival, effectively creating a polity that leans democratic but respects merit where necessary.

  Your connection to modern responsibility gaps and autonomous systems is fascinating, though it is likely a stretch in terms of Aristotle's own framework. When Aristotle worries about incompetent rulers selected by lot, his concern is teleological, meaning he worries about the failure of the state to achieve the good life for its citizens, rather than a legalistic worry about who can be blamed when things go wrong. He does not seem to grapple with the idea that random selection creates a vacuum of accountability where no one can be blamed, because in his view, the citizens collectively bear responsibility for the constitution they maintain. The modern anxiety about responsibility gaps usually arises in contexts where agency is dispersed or automated, whereas for Aristotle, the agency remains with the citizen body even if individual officeholders are chosen by chance. That said, your intuition touches on a real tension in democratic theory regarding accountability, since elected officials can be voted out while randomly selected officials cannot be punished at the ballot box for poor performance. Aristotle addresses this instead through short terms and scrutiny before and after office, ensuring that even lot-selected officials are accountable to the law and the public audit.

  Ultimately, Aristotle is running a logic about the mean between democracy and oligarchy rather than a strict dichotomy where lot is only for the unskilled. He is trying to save democracy from its own excesses by incorporating aristocratic elements like election for skilled roles, while saving oligarchy from its exclusivity by incorporating democratic elements like lot for general roles. This makes his argument less about the inherent uselessness of lot in the presence of skill differences and more about the strategic allocation of selection methods to preserve the regime. So you are not entirely forcing the connection with modern lottocracy, as the distinction between deliberative and executive functions is present in both, but you should be careful not to project modern concerns about corruption or liability too heavily onto his text. His focus remains on the stability of the constitution and the cultivation of civic virtue, where lot serves to rotate power and affirm equality, while election serves to secure competence and honor merit, and the wise legislator knows how to mix them to achieve the best possible outcome for the specific city they are governing.
