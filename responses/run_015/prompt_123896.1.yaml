  **1918 Flu:** Step 1 passes; viral mutation is contingent, not overdetermined. Step 2 fails; millions of lives alter demographics, politics, and art globally. Step 3 triggers **Stop (No)**; the ledger exceeds low-divergence limits instantly. Removing a pandemic changes too many downstream facts. Verdict: Reject for this series; too high-divergence.

  **1770s Slave Trade:** Step 1 flags overdetermination; economic profits drove trade beyond legal rulings. **Hand-off to Consultant** on economic necessity. Step 2 fails; no US Civil War, different industrialization. Step 7 flags high Desire Bias; moral satisfaction blinds cost. Step 3 triggers **Stop (No)**. Verdict: Reject; requires high-divergence framework.

  This procedure cannot tell you if a story is moving, nor can it resolve whether history is ultimately determined or free. It treats causation as mechanical links rather than complex systems, ignoring chaotic amplification where small changes yield massive effects unpredictably. It assumes your consultant knows the facts perfectly and that your editor understands causal logic. It protects the structure of your world, not the soul of your book. It cannot measure the emotional truth of a counterfactual, only its structural integrity. You must still write the scenes that make the reader care about the divergence. The procedure ensures the house stands; you must make it a home.
