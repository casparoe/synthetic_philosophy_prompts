answer: |-
  Here is a specification sheet for a theory of pleasure designed to underwrite hedonism. I have structured this to foreground the structural tensions you asked for, followed by the detailed desiderata, and ending with the scorecard.

  ### I. Structural Constraints & Trade-offs

  **1. The Incompatibility Thesis**
  There is a fundamental tension between **Phenomenological Adequacy** and **Formal Commensurability**.
  *   **The Conflict:** To satisfy *Phenomenological Adequacy*, a theory must acknowledge that the feeling of a cool drink, the satisfaction of a proof, and the relief of pain cessation are radically different kinds of events (heterogeneous). To satisfy *Formal Commensurability* (required for hedonistic calculus), a theory must treat them as instances of a single scalar variable (homogeneous) that can be summed across time and persons.
  *   **The Result:** You generally cannot maximize both. If you lean into the heterogeneity (e.g., family resemblance), you lose the justification for summing them (why add apples to oranges?). If you lean into the homogeneity (e.g., a single "hedonic tone"), you fail to capture the phenomenology (introspection reveals no single feeling). **This is not a bug; it is the central dialectic of the unit.** A theory must choose which side to sacrifice.

  **2. The Exclusionary Requirement**
  The single requirement that does the most work excluding candidate theories is **Inter-personal and Inter-temporal Summability**.
  *   **Why:** Many theories can explain what pleasure *is* locally (e.g., "it's a feeling," "it's an attitude"). However, very few can explain how a unit of pleasure at $t_1$ compares to a unit at $t_2$, or how my unit compares to yours, in a way that allows for a *net total*.
  *   **Impact:** This requirement kills strict phenomenological views (feelings are private and qualitative, not quantitative) and simple desire views (fulfilled desires don't obviously have magnitudes that sum). It forces the theory to be either behaviorist, primitivist, or heavily idealized.

  ***

  ### II. The Desiderata List

  Below are the requirements for a theory of pleasure.
  **[NN]** = Non-Negotiable (Required for Hedonism to function as a welfare theory).
  **[CP]** = Camp Preference (Debated; adopting one side defines the specific *kind* of hedonism).

  #### 1. Extensional Adequacy
  *   **The Requirement:** The theory must classify all paradigmatic cases of pleasure as pleasure. This includes sensory pleasures (taste, touch), propositional pleasures (hearing news), activity-based pleasures (solving a proof), and relief-based pleasures (cessation of pain).
  *   **The Case:** If a theory says the satisfaction of a proof isn't pleasure, it fails as a general account of welfare.
  *   **Status:** **[NN]**

  #### 2. Phenomenological Specificity vs. Abstraction
  *   **The Requirement:** The theory must take a stance on the "introspection problem." Does it posit a common *qualia* (hedonic tone) found in all instances, or does it posit a common *structure* (e.g., an attitude) despite qualitative differences?
  *   **The Case:** Students often stall here. A theory must specify whether failing to find a common feeling is a refutation (Empiricist constraint) or irrelevant (Functionalist constraint).
  *   **Status:** **[CP]** (Feeling theorists demand specificity; Attitudinal theorists demand abstraction).

  #### 3. Valence Symmetry
  *   **The Requirement:** The account of pleasure must have a structural counterpart for pain. Pain should be the same *kind* of thing as pleasure, merely with opposite sign, or the theory must explain why they are asymmetrical.
  *   **The Case:** Hedonism defines welfare as *net* pleasure (Pleasure minus Pain). If pains are unified but pleasures are heterogeneous (or vice versa), the subtraction operation becomes metaphysically suspicious.
  *   **Status:** **[NN]**

  #### 4. Commensurability (The Calculus Constraint)
  *   **The Requirement:** Instances of pleasure must be comparable in degree. There must be a fact of the matter about whether 5 minutes of Pleasure A is "more than" 2 minutes of Pleasure B, such that they can be summed into a total.
  *   **The Case:** Without this, the hedonist maximization principle ("maximize net pleasure") is meaningless. You cannot maximize a set that lacks a common metric.
  *   **Status:** **[NN]**

  #### 5. Intentionality Structure (Sensory vs. Attitudinal)
  *   **The Requirement:** The theory must specify whether pleasure is a *sensation* (like an itch or a taste) or a *propositional attitude* (like believing or desiring).
  *   **The Case:** Sensory views struggle with "impure" pleasures (enjoying a tragedy). Attitudinal views struggle with non-conceptual creatures (babies/dogs). The theory must either collapse the distinction or explain how the two interact.
  *   **Status:** **[CP]** (Classic Benthamites prefer Sensory; Modern hedonists often prefer Attitudinal).

  #### 6. Purity and Mixed States
  *   **The Requirement:** The theory must account for episodes that feel pleasant and unpleasant simultaneously (e.g., eating spicy food, sad nostalgia, "guilty" pleasures).
  *   **The Case:** If welfare is net pleasure, we need to know if mixed states are a third category, or simply two co-occurring states that can be netted out.
  *   **Status:** **[NN]** (Must offer a rule for calculation).

  #### 7. Normative Quality (The Mill Constraint)
  *   **The Requirement:** The theory must decide if "quality" is independent of "quantity." Is an hour of higher pleasure *automatically* worth more than any quantity of lower pleasure, or is quality just a disguised form of quantity (intensity/duration)?
  *   **The Case:** If quality is distinct, summation becomes difficult (you can't simply add higher to lower). If quality is rejected, the theory risks counter-intuitive results (pushpin vs. poetry).
  *   **Status:** **[CP]** (Benthamites reject quality; Millians accept it).

  #### 8. Psychological Role (Wanting vs. Liking)
  *   **The Requirement:** The theory should clarify its relationship to reinforcement learning. Does pleasure cause wanting, or does wanting cause pleasure?
  *   **The Case:** Neuroscience distinguishes "liking" (hedonic impact) from "wanting" (incentive salience). A theory of welfare should track "liking." If the theory reduces pleasure to "getting what you want," it may include things the agent didn't actually enjoy.
  *   **Status:** **[CP]** (Naturalists want alignment; Conceptualists may ignore it).

  #### 9. Metaphysical Reductivity
  *   **The Requirement:** The theory must state whether pleasure is reducible to other natural properties (neural firing, desire satisfaction) or is a non-natural primitive.
  *   **The Case:** Your friend's view. If pleasure is primitive, the theory stops explaining *what it is* and focuses on *how it behaves*. This avoids reductionist errors but risks obscurity.
  *   **Status:** **[CP]**

  #### 10. Disjunction Conditions
  *   **The Requirement:** If the theory is disjunctive (e.g., "Pleasure is either A, B, or C"), it must explain what makes the disjunction a *unity*. Why is this specific list of things the "good" kind?
  *   **The Case:** Family-resemblance views risk making "pleasure" too vague to ground a moral theory. If the class is open-ended, welfare becomes indeterminate.
  *   **Status:** **[NN]** (If disjunctive, must justify the unity of the class).

  ***

  ### III. Scorecard of Standard Theories

  | Theory | Phenomenology | Commensurability | Symmetry | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Hedonic Tone** (Feeling) | **High.** Posits a specific qualia. | **Medium.** Assumes feelings can be measured by intensity/duration. | **High.** Pain is just negative tone. | Fails Extensional Adequacy (hard to find the "tone" in solving a proof). |
  | **Attitudinal** (Enjoying) | **Medium.** Explains heterogeneity via objects of attitude. | **Low.** Hard to sum "attitudes" quantitatively. | **Medium.** Disliking is the counterpart. | Fails Commensurability (how many "enjoyings" equal one intense one?). |
  | **Desire Fulfillment** | **Low.** Ignores phenomenology entirely. | **High.** Desires can be ranked/weighted. | **High.** Frustration is negative. | Fails Wanting/Liking distinction (you can want what you don't like). |
  | **Disjunctive / Pluralist** | **High.** Respects diversity. | **Very Low.** No common metric for summation. | **Low.** Pains may not match the disjunction. | Fails the Hedonist Project (cannot generate a "net" total). |
  | **Primitivist** (Your Friend) | **N/A.** Takes phenomenology as given. | **Medium.** Asserts comparability by fiat. | **Medium.** Asserts symmetry by fiat. | **Best Fit for Desiderata,** but explains nothing. Stops inquiry. |

  **TA Note:** The **Attitudinal View** is currently the dominant contender in the literature because it solves the Extensional Adequacy problem (you can enjoy anything) better than the Tone view. However, it struggles most with the **Commensurability** requirement. If you want to spark a debate, ask the Attitudinalist: *"If I enjoy reading a book for an hour and you enjoy eating a meal for an hour, what is the common unit we are summing?"*
