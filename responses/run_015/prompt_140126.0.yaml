answer: |-
  # Diagnostic Instrument: The Karma of Moral Desert

  ## Part I: The Decision Tree

  **Seed Commitment:**
  *Start here.* You accept that a wrongful act leaves a remainder that has to be answered for, and the answering should fall on the agent rather than on whoever happens to be nearest.

  **Node 1: The Trigger (Intention vs. Consequence)**
  *Case:* **Dr. Aris** acts from a wholly benevolent motive to save a patient but foreseeably causes the patient great suffering as a side effect.
  *Choice:* Does this act leave a moral remainder that Aris must answer for?
  *   **(A) Yes:** The suffering itself generates the remainder (Consequence-Triggered). $\rightarrow$ Go to Node 2.
  *   **(B) No:** Only wrongful intent generates a remainder (Intention-Triggered). $\rightarrow$ Go to Node 2.

  **Node 2: The Nature (Quantity vs. Quality)**
  *Case:* **Agent Bo** committed a minor deceit years ago. Today, Bo suffers a tragedy vastly worse than any proportionality between act and consequence would license.
  *Choice:* Is this outcome a failure of justice?
  *   **(A) Yes:** Accounts must balance; excess suffering is unjust (Quantitative). $\rightarrow$ Go to Node 3.
  *   **(B) No:** The suffering transforms Bo's character; balance is not the goal (Qualitative). $\rightarrow$ Go to Node 3.

  **Node 3: The Transfer (Third-Party Discharge)**
  *Case:* **Friend Ci** knowingly volunteers to carry Bo's remainder and suffer in Bo's place.
  *Choice:* Does this voluntarily assumed suffering discharge Bo's debt?
  *   **(A) Yes:** The burden can be transferred or assumed (Transferable). $\rightarrow$ Go to Node 4.
  *   **(B) No:** The burden is essentially tied to the actor (Non-Transferable). $\rightarrow$ Go to Node 4.

  **Node 4: The Persistence (Identity Over Time)**
  *Case:* **Agent Di**, between the act and the maturing of the fruit, ceases to share any of the desires, values, or character of the person who acted (due to trauma or conversion).
  *Choice:* Does Di still bear the fruit of the past act?
  *   **(A) Yes:** Biological or narrative continuity suffices (Persistent Self). $\rightarrow$ Go to Node 5.
  *   **(B) No:** Psychological discontinuity breaks the link (Discontinuous Self). $\rightarrow$ Go to Node 5.

  **Node 5: The Justification (Desert vs. Future Good)**
  *Case:* **Driver Eo** causes great suffering through an act that was, at the time, neither careless nor wrongful (a pure accident). If Eo is required to pay a penalty, why?
  *Choice:* Is the penalty justified because Eo deserves it, or because it brings about reform, restraint, or reassurance for others?
  *   **(A) Desert:** It is owed because of the act itself (Retributive). $\rightarrow$ Go to Node 6.
  *   **(B) Future Good:** It is owed because of what the payment achieves (Consequentialist). $\rightarrow$ Go to Node 6.

  **Node 6: The Enforcement (Fittingness vs. License)**
  *Case:* A remainder exists and is deserved.
  *Choice:* Does this desert merely make suffering "fitting" (like a cloud raining), or does it license/require someone (victim or state) to exact it?
  *   **(A) Fittingness:** It should happen, but no one is authorized to force it (Passive).
  *   **(B) License:** It creates a right or duty to inflict the suffering (Active).

  ***

  ## Part II: Analysis of Positions (Instructor Key)

  ### Space of Answer-Combinations and Pruning
  Formally, the six binary nodes permit $2^6 = 64$ paths. However, logical entailments prune this space significantly:

  1.  **The "No Desert" Prune:** If a student answers **(B) Future Good** at Node 5, answering **(A) Desert** is logically excluded. This does not prune the tree branches but defines the coherence of the leaf.
  2.  **The Transfer/Identity Tension:** If a student answers **(A) Yes** at Node 3 (Transferable) but **(B) No** at Node 4 (Discontinuous Self), they hold that a burden can leave a self that no longer exists. This is marked **Unoccupied (Incoherent)** below, as it severs the link between the burden and the subject entirely.
  3.  **The Trigger/Justification Link:** Students who answer **(B) No** at Node 1 (Intention-Triggered) often struggle to answer **(A) Desert** at Node 5 for the Accident Case (Driver Eo), since an accident lacks wrongful intent. If they insist on Desert for Accidents without Intent, they are moved toward a Strict Liability view.

  ### Occupied Positions (Leaves)
  The following 8 leaves represent the defensible philosophical positions populated by your students.

  **Leaf 1: The Balancer**
  *   **Path:** Intention / Quantity / Non-Transferable / Persistent / Desert / License.
  *   **Characterization:** Wrongdoing creates a specific debt that the original agent must pay back to restore equilibrium.
  *   **Awkward Commitment:** Must explain why natural suffering (illness) counts as payment if no one inflicts it.
  *   *(Rough Placement: Classical Nyāya-Vaiśeṣika / Kantian Retributivism)*

  **Leaf 2: The Reformer**
  *   **Path:** Consequence / Quantity / Non-Transferable / Persistent / Future Good / License.
  *   **Characterization:** Suffering is imposed to balance the social scale and deter future harm, regardless of internal state.
  *   **Awkward Commitment:** Must justify punishing the innocent (Driver Eo) if it reassures the public.
  *   *(Rough Placement: Legal Positivism / Utilitarian Deterrence)*

  **Leaf 3: The Transformer**
  *   **Path:** Intention / Quality / Non-Transferable / Persistent / Desert / Fittingness.
  *   **Characterization:** Suffering is the natural ripening of a character flaw; it fits the agent but should not be artificially inflicted.
  *   **Awkward Commitment:** Cannot intervene to stop a friend's suffering, as it is their "own" fruit.
  *   *(Rough Placement: Early Buddhist Kamma-vipāka / Stoicism)*

  **Leaf 4: The Vicarious**
  *   **Path:** Intention / Quantity / Transferable / Persistent / Desert / Fittingness.
  *   **Characterization:** The debt is real and quantitative, but love allows a substitute to pay the price.
  *   **Awkward Commitment:** Risks making moral agency optional if others can always step in.
  *   *(Rough Placement: Christian Atonement Theory / Mahāyāna Bodhisattva Vows)*

  **Leaf 5: The Discontinuity**
  *   **Path:** Intention / Quantity / Non-Transferable / Discontinuous / Desert / Fittingness.
  *   **Characterization:** You only owe for what "you" did; if you change fundamentally, the debt expires.
  *   **Awkward Commitment:** Incentivizes radical personality shifts to escape responsibility.
  *   *(Rough Placement: Humean Bundle Theory / Reductionist Buddhism)*

  **Leaf 6: The Ritualist**
  *   **Path:** Consequence / Quality / Transferable / Discontinuous / Future Good / Fittingness.
  *   **Characterization:** Suffering is a communal cleansing ritual; who bears it matters less than the restoration of order.
  *   **Awkward Commitment:** Treats individuals as vessels for communal hygiene rather than agents.
  *   *(Rough Placement: Structuralist Anthropology / Scapegoat Mechanisms)*

  **Leaf 7: The Fatalist**
  *   **Path:** Consequence / Quantity / Non-Transferable / Persistent / Future Good / License.
  *   **Characterization:** The universe mechanically exacts a price for every disturbance, like a tax on energy.
  *   **Awkward Commitment:** Removes moral "ought" entirely; suffering just happens, it is not "owed."
  *   *(Rough Placement: Hard Determinism / Physicalist Causality)*

  **Leaf 8: The Restorative**
  *   **Path:** Intention / Quality / Transferable / Persistent / Future Good / Fittingness.
  *   **Characterization:** The burden is a relational rupture that can be healed by community support, not paid.
  *   **Awkward Commitment:** Struggles to account for cases where the victim refuses reconciliation.
  *   *(Rough Placement: Restorative Justice / Care Ethics)*

  ### Unoccupied Combinations
  *   **Transferable + Discontinuous + Desert:** *Incoherent.* If the self is discontinuous, there is no "owner" to transfer the debt from.
  *   **Future Good + Fittingness + License:** *Unattractive.* If the goal is future good, refusing to license enforcement makes the theory impotent.
  *   **Intention-Trigger + Desert for Accidents:** *Unexplored.* Rare to claim desert for accidents without appealing to future good (Node 5 conflict).

  ### Indistinguishable Leaves
  **Leaf 3 (The Transformer)** and **Leaf 8 (The Restorative)** are difficult to separate in a secular context. Both reject active licensing of punishment (Node 6: Fittingness) and view the burden as qualitative/relational. Without a metaphysical claim about "natural ripening" (Leaf 3) versus "social healing" (Leaf 8), student answers may oscillate between them without changing their practical stance on punishment.

  ### Most Sorting Node
  **Node 1 (The Trigger: Intention vs. Consequence)** does the most sorting work.
  *   **Why:** This choice determines the fundamental locus of moral value. If a student chooses **Consequence**, they are pushed toward Leaf 2 (Reformer) or Leaf 7 (Fatalist), making Node 5 (Justification) almost automatically "Future Good" (since accidents generate no desert). If they choose **Intention**, they open the space for Leaf 1 (Balancer), Leaf 3 (Transformer), or Leaf 5 (Discontinuity). This first branch dictates whether the seminar discusses the *agent's soul* or the *world's equilibrium*.
