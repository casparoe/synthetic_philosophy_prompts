          *   Focus on the *inconceivability* of the distinction between primary and secondary qualities, or the conceptual dependency of "object" on "experience."
          *   Identify the premise to attack: The move from "inconceivable" to "impossible." (Conceptual vs. Metaphysical necessity).
      *   **Follow-up 2: God and Solipsism:**
