answer: |-
  \
  **Session Plan: The Logical Market**

  ### 1. The Sentences (6 Candidates)
  *All are True/False. All are computable within 10 minutes by hand or 1 minute by script (phones banned).*

  1.  **Arithmetic:** $17^3 \pmod{53} = 42$.
      *   *Settle:* Compute $4913 / 53$. Remainder check.
      *   *Risk:* Low. Arithmetic is standard.
  2.  **Number Theory:** 9887 is prime.
      *   *Settle:* Trial division by primes up to $\sqrt{9887} \approx 99$.
      *   *Risk:* Medium. A number theorist might know it. Have a backup (9883).
  3.  **Constants:** The 12th decimal digit of $e$ is 5.
      *   *Settle:* Taylor series expansion of $e$ to 13 terms.
      *   *Risk:* Low. Tedious but mechanical.
  4.  **Computation:** Turing Machine $M$ (provided on handout) halts within 15 steps on empty input.
      *   *Settle:* Trace the state table on the board.
      *   *Risk:* Low. CS students will solve this instantly (see Troubleshooting).
  5.  **Dependency:** The sum of the truth-values of S1 and S2 is Even. (Treat True=1, False=0).
      *   *Settle:* Revealed only after S1 and S2 are settled.
      *   *Risk:* None. Pure logic.
  6.  **Conditional:** If S1 is True, then S4 is False. (Material implication).
      *   *Settle:* Revealed after S1 and S4.
      *   *Risk:* Confusion about material implication (see Troubleshooting).

  ### 2. Roles, Rules, and Payoff
  *   **Traders (12 people):** Start with 100 "Logic Points". Buy/Sell shares at posted prices (0–100). Share pays 100 if True, 0 if False.
  *   **The Auditor (1 person, rotates every 20 mins):** Holds a separate "Bank". **Must** trade if prices guarantee profit (e.g., Price(P) + Price(~P) < 100). Records profit on the **Loss Ledger** (whiteboard).
  *   **The Oracle (Instructor):** Computes and reveals truth values at designated times.
  *   **Payoff:** No money. Winner (highest points) chooses next week's reading. Auditor wins if Group Loss > 500 points.

  ### 3. Materials
  *   Whiteboard with 6 rows (one per sentence) for prices.
  *   **Loss Ledger:** Columns for [Time], [Incoherence Type], [Auditor Profit], [Total Group Loss].
  *   Trading slips (paper chits) for buy/sell orders.
  *   Handouts (Sentences + TM Table).
  *   Calculators allowed; Phones/Internet strictly banned.

  ### 4. One-Page Rules Handout (~150 words)

  **LOGICAL MARKET RULES**

  You start with 100 Points. Your goal: maximize points by session end.
  **The Assets:** Six statements are on the board. Each has a current Price (0–100).
  **Trading:** You may Buy (pay Price) or Sell (receive Price). If the statement is True, a share redeems for 100 Points. If False, 0 Points.
  **The Auditor:** One player holds the Bank. Their only job is to find guaranteed profits. If Prices allow a sure win (e.g., P + Not-P < 100), the Auditor *must* trade against the market and take points from the group pool. Their profits are posted on the Loss Ledger.
  **Settlement:** At the bell, we compute the truths. No internet. No phones. Compute or guess.
  **Winning:** Highest score picks next week's reading. If the Auditor makes >500 points, the Group loses.
  **Warning:** Prices change. Watch the Ledger.

  ### 5. Timeline (75 Minutes)

  *   **00–05:** Distribute handouts. Assign first Auditor. Explain ban on internet.
  *   **05–25:** **Market Open I.** Traders price S1–S4. Auditor watches for incoherence (P vs ~P). Instructor seeds initial prices if market is frozen.
  *   **25–35:** **Reveal I.** Oracle settles S1–S4. Traders redeem shares. Auditor posts profits on Loss Ledger.
  *   **35–40:** **Reset.** Assign new Auditor. Introduce S5–S6 (Dependencies).
  *   **40–60:** **Market Open II.** Traders price S5–S6 based on S1–S4 beliefs. Auditor looks for logical violations (e.g., Price(S1) + Price(S1→Q) < Price(Q)).
  *   **60–70:** **Reveal II.** Oracle settles S5–S6. Final scores tallied.
  *   **70–75:** **Debrief.** (See below).

  ### 6. The Debrief (Mapping to Objectives)
  *   **Point 1 (Logical Uncertainty):** Ask: "Did you feel uncertain about S1 ($17^3 \pmod{53}$) before calculating?" Highlight that the truth was fixed, yet prices varied.
  *   **Point 2 (Coherence as Loss):** Point to the **Loss Ledger**. "Every row here is a coherence violation. You weren't told axioms; you lost points until prices summed correctly."
  *   **Point 3 (Computation > 0.5):** Ask the CS students: "Did you sit at 0.5 on the TM problem?" Show how calculators beat the "neutral" traders. Uncertainty is a temporary resource constraint.
  *   **Point 4 (Unexploitability):** Look at final prices. "Did everyone agree? No. But did the Auditor stop making money? Yes." Different priors survived because they weren't exploitable.

  **Best Established:** Point 2 (Coherence as Loss). The Ledger provides visceral evidence.

  ### 7. Troubleshooting (Predictable Failures)
  *   **CS students compute S4 instantly:** *Fix:* Make them the first Auditor. Their job is to exploit others' slowness, not just solve it.
  *   **Prices frozen (no one trades):** *Fix:* Instructor acts as "Central Bank" posting initial incoherent prices (e.g., P=40, ~P=40) to invite the Auditor to strike first.
  *   **Auditor becomes Market Maker:** *Fix:* Remind them: "You cannot set prices. You can only take existing offers that guarantee profit."
  *   **Conditional Confusion:** *Fix:* In Debrief, explicitly define $P \to Q$ as $\neg P \lor Q$. Show how Price($P \to Q$) must be $\ge$ Price($Q$) - Price($P$).
  *   **All-in Hunches:** *Fix:* Cap individual positions at 50% of portfolio to prevent early elimination and disengagement.
  *   **Internet Cheating:** *Fix:* Collect phones at the door. Frame it as "bounded rationality."

  ### 8. Limitations (What to Say Out Loud)
  *   **Asymptotics:** "Real logical induction guarantees convergence over *infinite* time. We only played for 75 minutes. You stopped losing because you ran out of time, not because you reached perfection."
  *   **Boundedness:** "The Auditor was smarter than you (they had the rules). In reality, traders are all bounded. You can't exploit what you can't compute."
  *   **The Oracle:** "I settled the truths. In the real world, some truths (like large Turing halting) may never be settled. Unsettled claims can remain priced arbitrarily without exploitation."

  \answer{Coherence is survival, not a rule.}
