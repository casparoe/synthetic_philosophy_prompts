          *   Verdict: Cannot ADOPT based on *Tarka* alone. Needs PILOT (to generate *Pratyakṣa*).
          *   Minute: "Evidence insufficient for adoption; warranted for controlled pilot to establish *vyāpti*."

  5.  **Drafting the Conclusion (Settling the Argument):**
      *   Friend's view: It's decoration.
