          *   Mark where judgment/value decisions enter.
          *   Apply to three specific case studies (Biomarker Triage, Screening Age, Rare Condition).
          *   Conclude with an honest assessment of limitations (probabilistic vs. conclusive) and settle the argument with the friend.
      *   **Tone:** Professional, blunt, authoritative, practical, philosophically rigorous but accessible to lay members.

  2.  **Initial "Free Thinking" (The Breakdown Points):**
      *   *Goal:* Identify where Nyāya epistemology clashes with modern epidemiology/committee work.
      *   *Key Tension 1:* Certainty vs. Probability. Nyāya aims for *niścaya* (certainty/determination). Evidence-based medicine (EBM) deals in confidence intervals and risk. The translation must soften "knowledge" (*pramā*) to "warranted assertion."
      *   *Key Tension 2:* Individual Cognition vs. Collective Deliberation. Nyāya is often about how *I* know. Committees are about how *we* agree. The procedure must externalize internal cognitive checks.
      *   *Key Tension 3:* The Nature of *Hetu* (Reason). In Nyāya, the *hetu* must be invariable (*vyāpti*). In epidemiology, correlations are probabilistic. The "three marks" test needs to be adapted for statistical association, not logical necessity.
      *   *Key Tension 4:* Testimony (*Śabda*). Nyāya relies on a reliable speaker (*āpta*). Modern guidelines are institutional. The "chain" concept needs to address institutional reliability, not just personal integrity.
      *   *Key Tension 5:* Absence (*Abhāva*). Nyāya treats absence as a distinct object of knowledge. In screening, "no signal" is often just "no power." The detectability condition is crucial here.
      *   *Conclusion:* The value isn't in the *ontology* (what exists) but in the *process* (how we validate claims). It forces explicit articulation of defeaters.

  3.  **Drafting the Procedure (The Six Points):**

      *   *1. Inference Test (Anumāna):* Adapt the *Trairūpya* (Three Marks).
          *   Mark 1: Present in the subject (The pilot data shows the marker).
          *   Mark 2: Present in similar cases (Literature shows association).
          *   Mark 3: Absent in dissimilar cases (Controls don't have it).
          *   Failure Modes: *Anaikāntika* (Irregular/Straying - happens in controls too) and *Badhita* (Contradicted by better source, e.g., RCT vs. Observational).
          *   Output: "Reason Irregular" or "Reason Defeated."

      *   *2. Validity Regime (Pramāṇya):* Intrinsic (*svataḥ*) vs. Extrinsic (*parataḥ*).
          *   Nyāya says validity is intrinsic *but* needs confirmation if doubted. Bhaṭṭa Mīmāṃsā says intrinsic.
          *   Committee adaptation: Default to "Provisionally Valid" (Innocent until challenged) for low-risk/reversible. Demand "Positive Warrant" (Extrinsic) for high-risk/irreversible.
          *   Switch point: Harm severity + Reversibility. Authorised by Chair based on Harm Matrix.
          *   Challenge definition: Specific counter-evidence, not "vague worry."

      *   *3. Testimony (Śabda) & Chains:*
          *   Transmission Register: Yes, depth matters.
          *   Institutional Testimony: Institutions count as *āpta* if they have public verification procedures (peer review, audit).
          *   Rule: Chain strength = Weakest Link OR Institutional Buffer. If an institution verifies the link, it adds strength. If it just cites, it degrades.

      *   *4. Conflict (Bādhā):*
          *   Ordering: Perception (Audit) > Inference (Stats) > Testimony (Guidelines) > Analogy (Other systems). *Wait, actually in Nyāya, Śabda is high, but in EBM, Direct Data is higher.* Let's align with EBM hierarchy but use Nyāya logic for resolution.
          *   Meta-Rule: Conflict indicates a *doṣa* (defect) in one source. Do not average. Find the defect (bias, context mismatch).

      *   *5. Absence (Abhāva):*
          *   Test: Detectability. "If harm existed, would our net catch it?"
          *   Demand: High for safety signals. Low for efficacy (absence of evidence isn't evidence of absence unless power is high).

      *   *6. Hypothetical/Counterfactual (Tarka):*
          *   Status: Auxiliary (*tarka*), not a *pramāṇa*.
          *   Rule: Can remove doubt, cannot establish positive claim alone.
          *   Usage: "If this didn't work, X would be inexplicable." Supports, doesn't prove.

      *   *Values vs. Evidence:* Mark clearly where risk tolerance enters (e.g., defining "sufficient" detectability).

  4.  **Drafting the Case Studies:**

      *   *Case 1 (Biomarker):*
