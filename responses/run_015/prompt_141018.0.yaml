answer: |-
  ### Preliminary Reflection: Where the Translation Breaks

  You are asking to map a soteriological epistemology onto a bureaucratic risk-assessment protocol. The friction points are unavoidable, and if we ignore them, your friend wins the argument by default.

  First, **Certainty vs. Probability.** Nyāya aims for *niścaya* (certainty). The *tra irūpya* (three marks) guarantee the truth of the conclusion if the premises hold. Your committee deals in confidence intervals and hazard ratios. If you present this procedure as a truth-machine, it will fail. It must be presented as a *bias-detection engine*. The "knowledge" (*pramā*) we are generating is not "Truth" but "Warranted Assertion for Policy."

  Second, **Individual vs. Collective.** The *pramāṇas* describe how a single cognizer knows. A committee is a polyphonic entity. When you say "Perception," you mean "Audit Data," which is already interpreted. We must treat the *data* as the perceptual object and the *committee* as the single cognizer. If the clinicians "see" one thing and the epidemiologists "see" another, you have a *pramāṇa* conflict, not a perceptual one.

  Third, **The Status of Testimony.** You are right to worry about guidelines. In Nyāya, *śabda* relies on the *āpta* (trustworthy person). A guideline is not a person. We must treat the *process* that generated the guideline as the marker of trustworthiness. If the process is opaque, the testimony degrades to rumor (*aitihya*), which is not a *pramāṇa*.

  Finally, **The Goal.** Your friend says this is decoration. She is half-right: it will not change the *data*. It will change the *minute*. It forces you to articulate *why* a reason is defective rather than just saying "evidence weak." It stops you from averaging conflicting evidence. That is administrative work, not just philosophical decoration.

  ***

  ### PANEL PROCEDURE: EVIDENCE VALIDATION PROTOCOL (EVP)

  **1. The Inference Test (Adapted *Trairūpya*)**
  For any claim that *Intervention X leads to Outcome Y*, the supporting reason (*hetu*) must pass three checks.
  *   **Check 1 (Presence):** Is the marker present in our specific case? (e.g., Does the pilot data show the effect?)
  *   **Check 2 (Association):** Is the marker present in similar cases where the outcome occurs? (e.g., Do other studies show this link?)
  *   **Check 3 (Exclusion):** Is the marker absent where the outcome does not occur? (e.g., Do controls lack the marker?)
  *   **Failure Mode A (The Straying Reason):** The marker appears even when the outcome is absent. *Minute:* "Reason Irregular: Marker found in controls/healthy population."
  *   **Failure Mode B (The Defeated Reason):** A stronger source contradicts this inference. *Minute:* "Reason Defeated: [Stronger Source] contradicts [Weaker Source]."

  **2. Validity Regime (Intrinsic vs. Extrinsic)**
  *   **Default Regime (Intrinsic):** Claims are provisionally valid until a specific defeater is raised. Used for: Reversible interventions, Low harm, Pilot phases.
  *   **Warrant Regime (Extrinsic):** Claims require positive verification before acceptance. Used for: Irreversible interventions, High harm, National Adoption.
  *   **The Switch:** Authorised by Chair based on the **Harm Matrix** (Severity × Reversibility).
  *   **Valid Challenge:** Must cite a specific *pramāṇa* (data, study, audit). "Vague worry" or "Theoretical possibility" does not count as a defeater in Default Regime.

  **3. Testimony and Chains (*Śabda*)**
  *   **Transmission Rule:** Evidence degrades with distance from the source unless verified.
  *   **Institutional Testimony:** A guideline counts as reliable testimony *only if* its development procedure is public and verifiable (peer review, conflict of interest declaration).
  *   **Chain Strength:** A chain is only as strong as its weakest link *unless* an intervening institution has re-verified the data. A guideline that merely cites a study adds no strength. A guideline that re-analyses the data adds institutional weight.

  **4. Conflict Ordering (*Bādhā*)**
  *   **Hierarchy:** Perception (Audit/Local Data) > Inference (Statistics/Models) > Testimony (Guidelines) > Analogy (Other Systems).
  *   **Meta-Rule:** Conflict indicates a defect (*doṣa*) in one source. **Do not average.** The task is to locate the defect (e.g., selection bias, demographic mismatch). If the defect cannot be located, the lower source is suspended.

  **5. Reasoning from Absence (*Abhāva*)**
  *   **The Detectability Test:** To claim "No Harm," you must prove: "If harm existed, our net would have caught it."
  *   **Demand Level:** High for Safety (must show high power/sensitivity). Low for Efficacy (absence of evidence is not evidence of absence unless power is high).
  *   **Minute:** "Absence Warranted" (Detectability met) or "Absence Unwarranted" (Net too coarse).

  **6. Hypothetical Reasoning (*Tarka*)**
  *   **Status:** Auxiliary only. Removes doubt; does not establish truth.
  *   **Rule:** You may use *Tarka* to support a decision, but never as the sole ground for ADOPT.
  *   **Minute:** "Decision supported by *Tarka*" implies "Plausible but not proven."

  **VALUES FLAG:** Where the procedure returns "Insufficient Evidence," the decision to PILOT or DECLINE is a value judgement on risk tolerance. This must be minuted as "Board Decision," not "Panel Finding."

  ***

  ### APPLICATION TO PROPOSALS

  **Case 1: Blood-Based Biomarker Triage**
  *   **Analysis:** The inference relies on a case-control study.
  *   **Inference Test:** Check 3 (Exclusion) fails. The control group (healthy donors) is not the relevant "absence of outcome" group. The relevant absence is "symptomatic patients without cancer." The marker might distinguish "Healthy" from "Sick," not "Cancer" from "Benign Symptoms."
  *   **Defect:** *Anaikāntika* (Irregular Reason). The marker strays into the benign-symptom group (likely), which the study did not test.
  *   **Verdict:** **SUSPEND.**
  *   **Minute:** "Reason Irregular. Control group mismatch renders the marker's specificity for triage unproven. Endorsement (Testimony) cannot cure a defect in Perception/Inference."

  **Case 2: Lowering Screening Age (50 to 45)**
  *   **Analysis:** Conflict between Analogy (Neighbour's 10-year data) and Perception (Our 2-year Pilot).
  *   **Conflict Rule:** Perception trumps Analogy. However, the Pilot is underpowered (low detectability).
  *   **Defect Location:** If the Pilot's lack of signal is due to low power (Detectability Test failed), the Perception is weak. If the Neighbour's data relies on demographic assumptions that do not hold here, the Analogy is weak.
  *   **Scenario A (Pilot Defect):** If the Pilot cannot detect the effect size seen abroad, the Absence of mortality difference is Unwarranted. **Verdict: PILOT** (extended to gain power).
  *   **Scenario B (Analogy Defect):** If the Neighbour's population risk profile differs significantly, the Analogy is defective. **Verdict: SUSPEND.**
  *   **Minute:** "Conflict unresolved. Local data lacks power to confirm or deny foreign analogy. Risk tolerance decision required by Board."

  **Case 3: Rare Condition (No RCT, Stage Shift Only)**
  *   **Analysis:** Support rests on *Tarka* ("Stage shift is inexplicable otherwise") and weak Inference.
  *   **Hypothetical Rule:** *Tarka* cannot establish positive efficacy for ADOPT. It can only remove doubt about mechanism.
  *   **Validity Regime:** Extending screening is High Harm/Cost (Irreversible resource allocation). Requires Extrinsic Warrant.
  *   **Verdict:** **PILOT** (Not ADOPT).
  *   **Minute:** "Evidence insufficient for Adoption. Stage shift constitutes *Tarka* (plausibility), not *Pramāṇa* (proof of mortality benefit). Adoption requires mortality data. Recommend controlled pilot to generate Perceptual data."
  *   **Note:** I know you wanted to ADOPT. The procedure forbids it. To ADOPT is to treat a hypothesis as a fact.

  ***

  ### SETTLEMENT AND LIMITATIONS

  **Where the Translation Survives**
  Your friend is wrong that this is mere decoration. Standard evidence committees often "average" conflict ("Study A says yes, Study B says no, so we say maybe"). The Nyāya **Conflict Meta-Rule** forbids this. It forces you to find the *doṣa* (defect). This changes the verdict from "Uncertain" to "Study B is biased." That is actionable.
  Furthermore, the **Hypothetical Rule** stops the panel from being seduced by a good story. Clinicians love *tarka* ("It makes biological sense"). This procedure forces you to minute that sense is not evidence. That protects you from public challenge.

  **Where the Translation Fails**
  You cannot import the Nyāya claim to certainty. In Nyāya, if the *tra irūpya* are met, the conclusion *must* be true. In epidemiology, even if the three marks are met, the conclusion is only *probable*. You must accept a cost: **False Negatives.** This procedure is conservative. It will tell you to SUSPEND or PILOT cases that might actually work (Case 3). It prioritizes epistemic hygiene over potential utility. If your Board's mandate is "Innovate," this procedure will frustrate them. If their mandate is "Assure," it will protect them.

  **The Verdict on Your Argument**
  Tell your friend this: The taxonomy is not decorative because it dictates the **burden of proof**. Without it, you treat Testimony (Guidelines) and Perception (Audit) as equal inputs to a mix. With it, you have a hierarchy and a defect-locating mechanism. It does not change the *studies*, but it changes the *verdict* on the studies.
  *   **Real Work:** The Inference Test (prevents overgeneralization), The Conflict Meta-Rule (prevents averaging), The Hypothetical Limit (prevents storytelling).
  *   **Decoration:** The Sanskrit labels. Call them "Source Validation Checks" if it keeps the lay members awake.

  **Final Warning:** This procedure requires you to minute *why* evidence failed, not just *that* it failed. That takes time. If you cannot spare the time to write the minute, do not use the procedure. A bad application of epistemology is worse than none.
