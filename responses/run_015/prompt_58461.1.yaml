answer: |-
  My credence is 0.81 that Maya is irrational.

  The calculation decomposes into three probabilistic judgments that combine to determine the final verdict. First, there is a 0.40 probability that the preference shift itself (from $12 to $8 to $18) is intrinsically irrational because it violates stability constraints on rational agency; if this is true, Maya is irrational regardless of the money pump. Second, if the preference shift is rational (0.60 probability), the verdict depends on whether rationality requires diachronic consistency rather than just synchronic optimization, which I assign a 0.75 probability; if rationality is merely time-slice local, her actions are permissible. Third, given diachronic consistency is required, there is a 0.90 probability that foreseeable exploitability without compensation counts as a decisive failure of rationality; this combines with the previous factors as: P(Irrational) = P(Shift Irrational) + [P(Shift Rational) × P(Diachronic Requirement) × P(Exploitability Criterion)] = 0.40 + (0.60 × 0.75 × 0.90) = 0.805.

  The sub-question that moves my final number most is whether rationality evaluates the whole sequence versus just each time slice. If I shift my credence on the diachronic requirement from 0.75 to 0.25 (favoring time-slice rationality), my final credence drops from 0.81 to 0.54, whereas shifting the other factors within reasonable bounds changes the result by less than 0.15. The argument or evidence that would most probably shift this is a robust defense of "time-slice epistemology" or personal identity reductionism (e.g., Parfitian views) showing that Sunday-Maya has no normative authority over Wednesday-Maya, thereby dissolving the "loss" as merely a transfer between distinct agents rather than a failure of a single agent.
