answer: |-
  This is a sophisticated position. It's essentially a rule-consequentialist account of convention, localized to the epistemic perspective of the visitor, with a deontological wrapper ("obligation" rather than "prudence"). The "Guest's License Asymmetry" is your strongest intuitive hook; the "Conspicuous Compliance" clause is your strongest vulnerability.

  Here is the stress test, ranked from fatal to embarrassing.

  ### 1. The Killer Argument: The "Normative Glue" is Just Harm/Fairness in Disguise
  **Rank: Fatal (if it lands)**
  **Probability of Success against your view: High**

  You suspect this yourself. The argument is: *Why* is damaging a shared expectation morally significant?
  If the answer is "Because without it, coordination fails and people get hurt (e.g., traffic accidents)," you have collapsed into **rule-utilitarianism**. The obligation isn't to the expectation; it's to the *safety* the expectation secures. The expectation is just the mechanism.
  If the answer is "Because it's unfair to those who do comply," you have collapsed into the **Principle of Fairness (Free-Riding)**.
  If the answer is "Because the expectation itself has intrinsic value," you are arguing for **moral conservatism** (the status quo is valuable *qua* status quo).

  **The Shape of the Pattern:** Look at "Empty Rituals."
  Consider a convention that has *no* coordination benefit and *no* fairness implication, but is strictly expected. Example: In a specific office building, visitors must sign the logbook in blue ink, not black. There is no security reason; the guard doesn't check. It's just "how it's done."
  *   **Your View:** You have a moral obligation to use blue ink. Breaking it damages the expectation.
  *   **Critique:** If you use black ink, who is wronged? No one is harmed. No one is free-riding (the system works fine with black ink). The only "wrong" is that you violated a local whim.
  *   **Verdict:** If your intuition says "There is no *moral* obligation here, just a request," your view collapses. It shows that "expectation maintenance" only generates moral force when it *piggybacks* on harm prevention or fairness. The "normative glue" is an illusion; the real work is being done by the hidden premises (safety/fairness) you're trying to bypass.

  ### 2. The Collapse Risk: EMA vs. Free-Riding
  **Rank: Severe**
  **Which collapse is more likely?** Collapse into Free-Riding (Hart's Principle of Fairness).

  **The Discriminating Case:**
  *   **Scenario:** A "Pay What You Want" museum in a foreign city. Locals usually pay $20. The museum relies on this revenue to stay open (Cooperative Scheme). You, a visitor, enter, enjoy the art, and pay $0. You do this secretly (no one sees).
  *   **Free-Riding Account:** You have a duty to pay $20 because you accepted the benefit of the scheme.
  *   **EMA Account:** You have *no* duty. You were not seen. The shared expectation among locals/other visitors was not damaged because your non-compliance was invisible. The "Schelling point" remains intact for everyone else.

  **The Intuition Check:**
  Most people feel the secret freeloader is doing something *morally* wrong, not just strategically risky.
  *   If you agree with the intuition (secret freeloading is wrong), **EMA fails**. It cannot account for private violations of cooperative conventions.
  *   If you disagree (secret freeloading is fine if undetected), **EMA holds**, but you lose the claim that this is a *moral* obligation rather than a *prudential* one (don't get caught).

  **Deciding Feature:** Does the duty vanish if the *probability of detection* is zero?
  *   Free-Riding: Duty remains.
  *   EMA: Duty vanishes.
  *   *Risk:* If you say the duty vanishes, you admit your "moral obligation" is actually "don't get caught undermining the system." That sounds like prudence, not morality.

  ### 3. The Invisible Tourist (4am Crosswalk / One-Off Tip)
  **Rank: Embarrassing (Boundary Condition)**
  **Is it a reductio?** No, but it limits your scope.

  Your account says there is no duty in the 4am crossing case because no expectation is damaged.
  *   **Defense:** This is actually a feature, not a bug. Your theory is about *social coordination*, not individual integrity. It explains *public order*, not *private virtue*.
  *   **The Cost:** You must concede that your view is not a general theory of "obligations regarding conventions." It is a theory of "obligations regarding *visible* participation in conventions."
  *   **Why it's not fatal:** You can argue that "moral obligations to strangers in shared spaces" *just are* public obligations. Private violations are matters of conscience or integrity, which is a different category.
  *   **The Shape of the Pattern:** "Victimless violations of public norms." If you can live with the claim that victimless public violations are morally neutral (provided they remain victimless), you survive. If you feel a pang of "but it's still wrong," your theory is under-generating obligations.

  ### 4. Awkward-but-Not-Fatal Cases
  **Rank: Manageable (requires specification)**

  1.  **Bad Norms (Bribery/Segregation):**
      *   *Risk:* EMA implies a duty to bribe if that's the local expectation.
      *   *Fix:* Background morality trumps conventional obligation. This is standard *pro tanto* modeling.
      *   *Survival:* High. You concede the duty exists but is overridden.

  2.  **Visitor-Only Conventions (Tourist Site Queues):**
      *   *Risk:* No locals to hold the expectation.
      *   *Fix:* The expectation is held by the *institution* (staff) and *other visitors*. The "local" is the system administrator.
      *   *Survival:* High.

  3.  **Conventions in Flux (Tipping Declining):**
      *   *Risk:* When does the duty expire?
      *   *Fix:* The "Reasonable Local" standard you mentioned. If a reasonable local knows the norm is dying, the expectation is weak.
      *   *Survival:* Moderate. This is where "Reasonable Local" risks becoming a magic wand to wave away counterexamples.

  4.  **Opting Out by Announcement ("I'm not tipping"):**
      *   *Risk:* Does this discharge the duty?
      *   *EMA Prediction:* **No.** In fact, it might be worse. Conspicuous compliance is required to maintain the expectation. Conspicuous *rejection* actively attacks the expectation.
      *   *Verdict:* This is actually a **strength** of your view. It explains why "making a scene" about a principle is often viewed as more rude than quietly breaking the rule. You are damaging the Schelling point for everyone else.

  ### 5. Insulation: Pro Tanto & Reasonable Local
  **Rank: Legitimate Specification**

  You are worried you've qualified the view into vacuity.
  *   **"Pro Tanto":** This is standard moral philosophy. Almost no duty is absolute. This is safe.
  *   **"Reasonable Local":** This is necessary to avoid the "Tyrant Local" problem (e.g., "I expect you to kiss my ring").
  *   **The Danger Zone:** If "Reasonable Local" is defined as "A local who holds expectations that align with EMA," you are circular.
  *   **The Fix:** "Reasonable Local" must be defined independently, likely as "A local who understands the functional purpose of the convention."
  *   **Verdict:** This insulation is legitimate *provided* you don't use it to explain away the "Bad Norms" problem entirely. You must admit there *was* a conventional obligation to kiss the ring, it was just morally overridden. If you say "There was never an obligation because the norm was bad," you have abandoned EMA for a moralized account of conventions.

  ### 6. What a Defender Would Concede
  If you concede the maximum defensible ground, here is what survives:
  1.  **Scope:** The theory applies only to *public, coordination-based* conventions, not private virtues or cooperative schemes with hidden benefits.
  2.  **Force:** The obligation is *relational* (owed to the community of users), not fundamental.
  3.  **Content:** The duty is to *not undermine the stability of the signal*, not necessarily to achieve the signal's nominal goal.
  4.  **Asymmetry:** The Guest's License Asymmetry remains the strongest unique selling point. It explains why a local can protest a queue but a tourist cannot.

  **Does anything interesting survive?**
  Yes. A robust account of **Political Obligation for Transients**. It explains why we obey traffic laws in foreign countries even when enforcement is zero and we don't care about the locals' feelings. We obey because we are temporary users of their coordination infrastructure.

  ### Summary of Risks

  | Risk | Rank | Why |
  | :--- | :--- | :--- |
  | **Importing Harm/Fairness** | **Fatal** | If "expectation damage" matters only because it causes harm/unfairness, EMA is redundant. |
  | **Collapse to Free-Riding** | **Severe** | If you can't explain why secret violations are permissible (EMA) or wrong (Free-Ride), you haven't distinguished yourself. |
  | **Invisible Tourist** | **Embarrassing** | Limits your theory to public acts. Admits it's not a full moral theory. |
  | **Bad Norms** | **Manageable** | Solved by *pro tanto* structure, provided you don't moralize the convention itself. |
  | **Insulation** | **Safe** | "Pro tanto" and "Reasonable Local" are standard tools, not ad-hoc patches. |

  ### Final Verdict
  Your view is **well-insulated against sociological objections** (relativism, "who says") but **highly exposed to meta-ethical objections** (why does expectation matter?).

  The "Killer Argument" is the one to watch. If you cannot articulate a value for *coordination stability* that is distinct from *the outcomes of coordination* (safety/efficiency) and *the fairness of participation*, then "Expectation-Maintenance" is just a descriptive label for a mix of Utilitarianism and Fairness.

  **Recommendation:** Lean into the **coordination value**. Argue that *predictability itself* is a public good, distinct from safety or fairness. A world where everyone follows bad rules is often better than a world where everyone decides for themselves which rules to follow in real-time. If you can defend the intrinsic value of *reduced decision-cost* for the group, EMA stands. If not, it collapses.
