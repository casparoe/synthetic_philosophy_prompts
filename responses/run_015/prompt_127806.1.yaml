prompt: |-
  I've got a view about everyday conventions that I keep defending at meetups, and I want to know how exposed it actually is before I build more on top of it. Rough version: conventions like queue order, tip rates, whether you wait for the walk signal, which side you stand on an escalator, generate real moral obligations for visitors to a place — not just prudential reasons or etiquette. But the content of the obligation is fixed by local expectations, not by what the convention is nominally for, and what you owe is *conspicuous* compliance: you have to be seen going along, because the thing noncompliance damages is the shared expectation itself, not any particular persons interests. I basically think of conventions as Schelling points with normative glue smeared on them. Call it the expectation-maintenance account. There's one bit I especially like: locals are permitted to break their own convention (they've got standing to renegotiate it) while visitors aren't — call that the guests license asymmetry or whatever.

  So what would count against this? Skip the obvious stuff — "cultural relativism," "who says you have to follow local norms" — I can field that. What I want is a map of where the view is actually at risk:

  - The case it can't describe, or describes badly. I'm most worried about the invisible tourist: crossing against the light at 4am with nobody around, or skipping a tip at a place you'll never return to where nobody compares notes. My account seems to say there's no duty, since no expectation gets damaged. If that's actually fine, say why; if it's a reductio, walk me there.
  - The collapse risks, both directions. Where does this stop being moral philosophy and become "don't be rude to the locals" with extra steps? And where does it stop being a story about conventions and turn out to be an instance of a general duty not to free-ride on a cooperative scheme? Which collapse is more likely, and which feature of a case decides it.
  - A discriminating case: something my view predicts that the plain free-riding account doesn't, or vice versa, with an honest note about which way I'd have to find my intuitions going for it to count against me.
  - The awkward-but-not-fatal stuff, ranked separately: conventions that are themselves bad (a norm of paying off officials, a norm about who gets served first), visitor-only conventions (a queue at a tourist site with no locals in it), conventions in flux (a place where half the locals have stopped tipping), and the "opting out by announcement" move — if I loudly announce I'm not playing, have I discharged the duty?
  - What a defender would concede rather than fight. If I concede as much as I probably should, does anything interesting survive?
  - And whether I've insulated it. When I get pushed I start saying the duty is only pro tanto and the relevant expectation is that of a reasonable local, and I want to know if that's legitimate specification or whether I've qualified the thing into having no risk at all.

  The thing that would actually move me: an argument that expectation-maintenance can't distinguish being morally required from being strongly expected without secretly importing a harm or unfairness premise that's doing all the real work. If that lands I'd probably drop the view, so tell me how close such an argument is to succeeding. Rank everything fatal down to merely embarrassing, and if there's a real-world pattern you think already counts either way, describe the shape of it — I don't want dates or studies, just the shape. Be straight with me if the honest answer is that the view is well insulated and that this is okay because it's mostly a claim about what we owe strangers in shared spaces rather than an empirical claim.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core View:** "Expectation-Maintenance Account" (EMA) of conventions.
          *   Conventions (queues, tips, signals) generate *moral obligations* for visitors.
          *   Content fixed by local expectations, not nominal purpose.
          *   Requirement is *conspicuous compliance* (being seen going along).
          *   Rationale: Noncompliance damages the shared expectation itself, not specific interests.
          *   Asymmetry: Locals can break/renegotiate; visitors cannot ("Guest's License Asymmetry").
          *   Metaphor: Schelling points with normative glue.
      *   **Goal:** Stress-test the view. Find where it's exposed/risky.
      *   **Constraints:** Skip obvious relativism objections. Focus on specific structural weaknesses.
      *   **Specific Questions to Address:**
          1.  The "Invisible Tourist" case (no audience, no return).
          2.  Collapse risks (etiquette vs. free-riding).
          3.  Discriminating case (EMA vs. Free-Riding).
          4.  Awkward-but-not-fatal cases (bad norms, visitor-only, flux, opting out).
          5.  Concessions (what survives if conceded).
          6.  Insulation/Qualification (pro tanto/reasonable local).
          7.  The "Killer Argument": Is EMA just importing harm/unfairness premises?
      *   **Tone:** Direct, philosophical, analytical, ranking risks (fatal to embarrassing).
      *   **Format:** Structured response addressing each bullet point.

  2.  **Deconstruct the Core View (EMA):**
      *   *Strength:* Explains why we follow arbitrary rules (escalator side) even when inefficient. Explains the visitor/local asymmetry well.
      *   *Weakness:* Relies heavily on the *visibility* of the act and the *stability* of the expectation. If the expectation isn't damaged, is there a duty?

  3.  **Drafting Responses to Specific Points:**

      *   **1. The Invisible Tourist (4am crossing, no-tip one-off):**
          *   *Problem:* EMA says duty depends on damaging shared expectation. If no one sees, expectation isn't damaged. So EMA says *no duty*.
          *   *Is this a reductio?* Many intuitively feel there *is* still a duty (integrity, rule-following).
          *   *Defense:* EMA is about *social coordination*, not individual virtue. If the coordination mechanism isn't triggered, the specific social duty doesn't arise.
          *   *Verdict:* Embarrassing but not fatal. It limits the scope of the theory to *public* acts. It admits it's not a general theory of morality, just of *conventional* obligation.
          *   *Shape of Pattern:* "Secret violations of public norms."

      *   **2. Collapse Risks:**
          *   *Direction A (Etiquette):* If the "moral glue" is just "don't upset locals," it becomes mere politeness. *Risk:* Low. EMA claims the *expectation itself* is the object of value, not local feelings.
          *   *Direction B (Free-Riding):* Is this just Hart's "Principle of Fairness"? (Benefit from scheme -> Obligation to contribute). *Risk:* High. If the "expectation" is just a proxy for "cooperative scheme stability," EMA collapses into Free-Riding.
          *   *Deciding Feature:* Does the duty exist if *I* don't benefit? EMA says yes (if expectation is damaged). Free-riding says no (must receive benefit).
          *   *Verdict:* Collapse into Free-Riding is the bigger risk.

      *   **3. Discriminating Case:**
          *   *Scenario:* A convention that *harms* the locals but is strictly followed (e.g., a complex greeting ritual that wastes time but signals respect).
          *   *Free-Riding:* No duty to follow (no benefit, maybe harm).
          *   *EMA:* Duty to follow (expectation exists, breaking it damages the expectation).
          *   *Intuition Check:* If the ritual is pointless/harmful, do visitors *really* owe compliance? If intuition says "No," EMA fails. If intuition says "Yes (don't rock the boat)," EMA holds.
          *   *Verdict:* This is the testing ground.

      *   **4. Awkward-but-not-fatal:**
          *   *Bad Norms (Bribery):* EMA implies a duty to bribe if expected. *Fix:* Override by background morality. (Rank: Manageable).
          *   *Visitor-Only Queues:* No locals to have expectations. *Fix:* Expectations of *other visitors* based on local signage/staff. (Rank: Manageable).
          *   *Flux (Tipping declining):* When does the expectation shift? *Fix:* "Reasonable Local" standard. (Rank: Tricky).
          *   *Opting Out (Announcement):* "I'm not tipping." Does this discharge duty? EMA says No, because conspicuous *non-compliance* damages expectation regardless of announcement. Announcement might even make it worse (challenge). (Rank: Strong point for EMA).

      *   **5. Concessions:**
          *   Concede: It's not a *fundamental* moral duty, but a *relational* one. Concede: Background morality trumps.
          *   *Survival:* A robust theory of *political obligation for transients*. It explains why we obey traffic laws in foreign countries even if enforcement is lax.

      *   **6. Insulation (Pro Tanto/Reasonable Local):**
          *   *Risk:* Qualifying into vacuity. "Duty unless it's hard" + "Expectation unless it's unclear."
          *   *Assessment:* "Pro tanto" is standard moral philosophy currency. "Reasonable Local" is necessary to avoid hyper-literalism.
          *   *Verdict:* Legitimate specification, provided "Reasonable Local" isn't defined as "Local who agrees with EMA."

      *   **7. The Killer Argument (Importing Harm/Unfairness):**
          *   *Argument:* Why is damaging an expectation *bad*? Usually because it leads to harm (coordination failure) or unfairness (free-riding). If you strip those out, "expectation maintenance" looks like fetishizing status quo.
          *   *Counter:* The *value of coordination itself* is the good.
          *   *Closeness to Succeeding:* Very close. If the user cannot explain why *this specific expectation* is worth maintaining independent of its outcomes, the view rests on conservatism.
          *   *Shape:* "The Empty Ritual Problem."

  4.  **Synthesizing and Ranking:**
      *   *Fatal:* The "Importing Harm" argument (if it shows EMA has no independent normative force).
      *   *Severe:* Collapse into Free-Riding (if EMA can't distinguish itself from Hart).
      *   *Embarrassing:* Invisible Tourist (limits scope).
      *   *Manageable:* Bad norms (overridden by background morality).

  5.  **Refining the Tone:**
      *   Needs to be sharp, philosophical, respectful of the sophistication of the prompt.
      *   Avoid preaching.
      *   Use the user's terminology (Schelling points, normative glue).

  6.  **Final Review against Constraints:**
      *   Did I skip cultural relativism? Yes.
      *   Did I rank the risks? Yes.
      *   Did I address the "Invisible Tourist"? Yes.
      *   Did I address the "Killer Argument"? Yes.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Invisible Tourist:* Make sure to distinguish between *epistemic* invisibility (nobody saw me) and *ontological* invisibility (no one could have seen me). EMA hinges on the *risk* of detection undermining the norm.
      *   *Self-Correction on Free-Riding:* Ensure the distinction is clear. Free-riding requires *benefit*. EMA requires *presence*.
      *   *Self-Correction on Killer Argument:* This is the crux. The user suspects the "normative glue" is just a placeholder for "harm prevention." I need to validate that suspicion while offering the best defense (coordination value).

  8.  **Final Polish:** Check structure and headings. Ensure the "Shape of the Pattern" requests are met. (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, the user asked for "The case it can't describe... I'm most worried about the invisible tourist." I need to be decisive. Is it a reductio? I should argue it's a *boundary condition*, not a reductio, but it reveals the theory is about *public order* not *private virtue*.

  *(Self-Correction on Collapse)*: The collapse into "Don't be rude" is less likely than the collapse into "Free-riding." "Don't be rude" is about feelings. EMA is about *structural stability*. I should emphasize this distinction.

  *(Self-Correction on Killer Argument)*: I need to be honest. If the only reason to maintain an expectation is to prevent coordination failure (harm), then EMA is instrumental. If the user claims it's *intrinsic*, they are on shaky ground. I will rate this argument as "High Probability of Success" against a strong version of EMA.

