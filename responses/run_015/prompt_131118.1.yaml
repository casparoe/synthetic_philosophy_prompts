      *   **Roommate's Position:**
          1.  SGP is distinct from CR (or at least not a "knockdown proof").
          2.  Grounding $\neq$ Embodiment.
          3.  Sensor data is just another vector/symbol (loop remains closed).
          4.  "That's the question, not the answer."
      *   **Specific Questions to Answer:**
          1.  Is SGP just CR, or does it add something? (Does it apply to humans?)
          2.  What is the gap between grounding and embodiment?
          3.  Is the "predict sensor readings" idea a valid fix or the problem itself? Is "vector = symbol" legitimate?
