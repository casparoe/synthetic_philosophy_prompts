  ### 4. My Verdict

  I locate myself at **Leaf 8 (Practice-Dependent Conventionalism)**, reached via the path: **Q1=Yes** (Utterance binds), **Q5=No** (Requires agent), **Q6=Yes** (Release works), **Q7=No** (Threat voids), **Q8=Yes** (Trivial binds).

  **The Load-Bearing Fork:**
  The genuinely load-bearing fork in this tree is **Q6/Q3 (The Release Case)**.
  Flipping the answer here moves you from **Leaf 2 (Integrity)** to **Leaf 8 (Conventionalism/Rights)**. If you believe you are *still bound* after a sincere release, you are committed to the view that promising is primarily about your own moral character (Integrity). If you believe you are *released*, you are committed to the view that promising transfers a normative asset to another person (Rights/Convention). This distinction does more work than the "Mental Act" distinction (Q1), because many conventionalists and rights theorists agree that utterances bind without concurrent intent, but they split sharply on whether the promisee owns the obligation.

  **Adjacent Leaves & Separation:**
  My tree currently groups **Leaf 6 (Natural-Duty)** and **Leaf 8 (Conventionalism)** as adjacent endpoints separated only by the "Trivial" case (Q8). However, these two views often yield identical verdicts on triviality (both might say "bound" or both "not bound" depending on the specific utility calculation or rule interpretation).
  To separate them, I need a **"Harmful Promise" case**: *You promise to help a friend hide a stolen car.*
  *   **Conventionalist:** The promise is invalid because the practice of promising presupposes permissible content (the rules of the practice exclude crimes).
  *   **Natural-Duty:** The promise is invalid because keeping it reduces overall utility/violates a background duty.
  While the verdict is the same, the *explanation* differs. A better separating case is **"The Pointless Practice"**: *Imagine a society where promising exists but never actually helps anyone coordinate (it's useless).*
  *   **Conventionalist:** Still bound (the practice exists).
  *   **Natural-Duty:** Not bound (the practice has no moral point).

  **Invented Distinction:**
  I must flag **Case (b) (Auto-generated Promise)** as the most "invented" distinction relative to the canonical literature. Hume, Kant, and Rawls wrote about human speech acts. Applying their frameworks to delegated algorithmic authority tests the "Mental Act" requirement in a way they could not anticipate. While contemporary scholars (e.g., Dan-Cohen on speech acts) touch on this, using it as a primary diagnostic node forces a modernization of the "Will vs. Convention" debate that isn't explicitly mapped in the classical texts you've read. It works, but it extrapolates the literature rather than reflecting it directly.
