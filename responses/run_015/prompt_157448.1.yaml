answer: |-
  # Activity Design: The Oakhaven Municipal Simulation

  ## The Setup and Fiction
  **Setting:** The District of Oakhaven, 1950–1970. A growing mid-sized town with a bustling bureaucracy and a diverse population.
  **The Artifacts:** Index cards.
  *   **Blue Cards:** Standard Municipal Forms (pre-printed fields: Name, Address, Tax ID).
  *   **Yellow Cards:** Incident Reports (handwritten notes, variable quality).
  *   **White Cards:** Personal Correspondence/Community Notes (often incomplete, messy).

  **The Narrative:** You are simulating the lifecycle of public records over 20 years. There are no villains, only constraints. The goal is to keep the town running, then preserve the record, then understand the past.

  ## The Roles (3 Groups of 6 Students)
  *   **Group A (The Clerks):** Round 1 only.
      *   *Info:* You have a budget of markers and time. You must process "Events" into records.
      *   *Constraint:* You get "Funding Points" for every **Blue Card** completed. Yellow/White cards take 3x longer and earn 0.5 points. You run out of time before you finish the stack.
      *   *Gap:* You will prioritize Blue (administrative) over Yellow/White (social/conflict).
  *   **Group B (The Archivists):** Round 2 only.
      *   *Info:* You inherit Group A's output. You have a "Shelf Space" limit (a specific box size) and a "Catalog Budget" (time).
      *   *Constraint:* You must create a Finding Aid (an index on the whiteboard). Cataloging a Blue Card takes 1 minute. Cataloging a Yellow/White card takes 3 minutes (must transcribe messy handwriting).
      *   *Gap:* You will catalog the Blue Cards because they are efficient. The messy cards remain in the box, uncataloged.
  *   **Group C (The Researchers):** Round 3 only.
      *   *Info:* You are historians in 2024. You want to know: "What was the quality of life in Oakhaven's South Side?"
      *   *Constraint:* You **cannot** touch the box. You can **only** use the Finding Aid (whiteboard) created by Group B.
      *   *Gap:* You will conclude the South Side was peaceful and administratively stable because only Blue Tax Cards from that area made it to the index.

  ## The Mechanics & Constraints
  1.  **The Event Deck (Facilitator Only):** A stack of 60 index cards prepared beforehand.
      *   40 Blue Cards (Routine: Tax paid, permit issued).
      *   15 Yellow Cards (Conflict: Noise complaint, arrest, protest).
      *   5 White Cards (Community: Block party flyer, church notice).
      *   *Crucial:* 20 of these cards (mixed colors) are marked "South Side." Most "South Side" cards are Yellow/White.
  2.  **Round 1 (Production):** Group A has 15 minutes to process the Event Deck. They must fill out the fields on the cards using markers. They stop when time is called. Unfinished cards are discarded immediately (Simulates "not created").
  3.  **Round 2 (Archiving):** Group B has 15 minutes. They take Group A's finished cards. They must decide what goes into the "Permanent Archive" (the Box) and what gets listed on the "Finding Aid" (Whiteboard). They run out of time before indexing everything.
  4.  **Round 3 (Research):** Group C has 15 minutes. They view the Whiteboard. They write a 3-sentence conclusion about the "South Side."
  5.  **The Reveal:** Facilitator reveals the original Event Deck and the contents of the Box (including uncataloged cards).

  ## Scoring/Payoff (To Prevent Villainy)
  *   **Group A:** "Department Efficiency." Publicly tally how many Blue Cards they finished. Applaud high numbers.
  *   **Group B:** "Accessibility Score." Praise them for creating a neat, searchable index.
  *   **Group C:** "Publication Grant." Awarded for making a definitive claim based on evidence.
  *   *Why:* This rewards the *bureaucratic logic* that creates the bias, rather than punishing it.

  ## The Count/Display Mechanic
  *   **The Wall:** Three columns taped on the wall.
      1.  **Created:** (Facilitator counts Event Deck totals).
      2.  **Indexed:** (Group B's Whiteboard count).
      3.  **Concluded:** (Group C's written statement).
  *   **The Visual:** The drop-off from Column 1 to Column 2 will be stark, specifically for Yellow/White cards.

  ---

  ## Debrief Strategy
  Do not lecture. Ask questions that force them to notice the mechanics.

  1.  **Start with Group C (Researchers):** "What did you conclude about the South Side?" (They will say it was quiet/stable). "How confident are you?" (High, because the index was clear).
  2.  **Turn to Group B (Archivists):** "Show us what's in the box that isn't on the board." (Reveal the uncataloged Yellow/White cards). "Why didn't you index these?" (Answer: "Ran out of time," "Handwriting was hard to read," "Didn't fit the columns").
  3.  **Turn to Group A (Clerks):** "Look at the Yellow cards Group B dropped. Why are they messy?" (Answer: "We were rushing," "Those were incident reports, we prioritized tax forms").
  4.  **The Reveal:** Show the original Event Deck. "How many South Side incidents actually happened?" (Compare to Group C's conclusion).
  5.  **The Synthesis:** "Did anyone in this room act with malice?" (No). "Then where did the lie come from?" (The system of incentives).

  ---

  ## Honesty Check: Risks & Limitations

  **(a) Predictable Failures:**
  *   **The "Hero" Archivist:** A student in Group B might realize the game and spend all their time indexing the Yellow cards to "save the truth."
      *   *Fix:* Enforce the time limit ruthlessly. If they index 3 Yellow cards and 0 Blue cards, point out in debrief: "You created a different bias. A representative archive requires resources you didn't have."
  *   **The Moral Lecture:** Students might say, "This is racist/classist."
      *   *Fix:* Agree, but pivot. "It is. But did anyone *choose* to be racist? Or did the deadline force the outcome? How do we fix a system where the 'right thing' takes 3x the budget?"
  *   **Boredom:** Group C sits for 30 mins before their turn.
      *   *Fix:* Give Group C a "Observation Worksheet" during R1 and R2. They must tally how many cards are discarded in real-time. This makes them witnesses to the destruction of evidence.

  **(b) What the Activity Cannot Reproduce:**
  *   **Real Time Scale:** The "Legibility Dividend" usually happens over decades. In the game, it happens in 15 minutes.
      *   *Handle in words:* "In reality, the '3x time cost' isn't minutes, it's budget cycles. Once a collection is described, it gets digitized. The uncataloged box stays in the basement for 50 years. By the time someone opens it, the context is lost."
  *   **Emotional Weight:** These are index cards, not human lives.
      *   *Handle in words:* "When we say 'absence of evidence,' we aren't talking about data points. We are talking about people whose grievances were never written down, or written down in a hand no one bothered to read."

