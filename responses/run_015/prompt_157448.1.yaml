  ## Timeline Table

  | minute_range | what_participants_do | what_facilitator_does | mechanic_doing_the_work | intended_failure_mode |
  | :--- | :--- | :--- | :--- | :--- |
  | **00-10** | Listen to briefing. Groups A, B, C separate. | Explain rules. Distribute materials. Emphasize *efficiency* goals. | Framing the incentives (Points for speed/consistency). | Students think this is a "history quiz" rather than a process sim. |
  | **10-35** | **Group A:** Process Event Deck into cards. **Group B/C:** Observe & tally discards on worksheet. | Enforce time limit. Announce "5 minutes remaining" loudly. Collect discarded cards secretly. | **Time Pressure + Differential Cost.** (Blue cards are faster/easier). | Group A leaves Yellow/White cards unfinished. "Administrative By-product." |
  | **35-55** | **Group B:** Inherit Group A's cards. Create Finding Aid on whiteboard. **Group A/C:** Observe. | Enforce "Catalog Budget" (1 min vs 3 min rule). Stop them exactly at 20 mins. | **Legibility Dividend.** (Easy to index = Indexed. Hard = Ignored). | Group B indexes only Blue cards. Messy South Side cards remain in box. |
  | **55-75** | **Group C:** Analyze Whiteboard. Write conclusion about "South Side." **Group A/B:** Observe. | Prevent Group C from looking in the Box. Collect their written conclusions. | **Epistemic Closure.** (Researchers trust the Index over the Box). | Group C concludes South Side was "stable/quiet." Over-claim based on gaps. |
  | **75-90** | Full group debrief. Reveal Event Deck and Box contents. | Facilitate Socratic questioning. Map student observations to the 3 Claims. | **Juxtaposition.** (Claim vs. Reality). | Students blame individuals. Facilitator must steer to *systemic constraints*. |

