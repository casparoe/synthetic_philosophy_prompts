      *   *Philosophical Angle:* If intelligence is distributed, where does the "I" reside? If behavior is intelligent but there is no unified subject to *have* the experience, does the behavioral criterion fail?
      *   *Specific Concept:* **The Problem of Diachronic Identity and Unified Agency.** (Or, more simply, "The Disappearing Subject").

