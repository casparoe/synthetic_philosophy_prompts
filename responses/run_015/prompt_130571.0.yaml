      *   *Self-Correction on (e):* The user says the nanny is "well-paid, highly skilled... chose the job." This is an idealized scenario. But (c) says care is shifted to those who "least afford it." (e) ignores the structural reality (c) highlights. If (e) is the *moral* verdict on the *act*, does it ignore the *context*? Yes.
