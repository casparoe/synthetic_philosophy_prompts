      *   **Tension 3: (e) vs. (a) & (d) [The Nanny/Outsourcing Problem]**
          *   *Conflict:* (e) says outsourcing care is fine if paid/consensual. (d) says start from the lives of actual carers (often exploited). (c) says critique labor markets where care is shifted to those who can least afford it. (e) seems to validate the market solution (c) warns against.
