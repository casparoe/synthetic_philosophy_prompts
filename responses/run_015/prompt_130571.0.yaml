      *   **Tension 4: (g) vs. (b) [The Criticism Basis Problem]**
          *   *Conflict:* (g) says the partial carer is criticizable. (b) says no impartial duties. On what grounds is the criticism made? If not impartial duty, is it because they are failing *other* relations?
