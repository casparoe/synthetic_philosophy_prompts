prompt: |-
  I'm presenting a seminar paper defending the thesis that constitutional monarchy in mature democracies—specifically the UK, Scandinavia (Denmark, Norway, Sweden), and Japan—operates as a symbolic firewall: by concentrating ceremonial sovereignty in a strictly constrained hereditary office, democratic systems absorb the affective and ritual functions of head-of-state authority that would otherwise be captured by partisan executives or populist movements. I argue this is normatively valuable and institutionally durable only where constitutional convention, not statute alone, enforces political neutrality; I compare the Scandinavian minimalist model, the British reserve-power conventions, and Japan's post-1947 symbolic state under Article 1. I conclude that abolition risks not liberation but the relocation of symbolic authority onto elected figures, with destabilizing effects.

  The audience is a comparative-political-theory and constitutional-law seminar: mostly republican-leaning normative theorists who treat hereditary office as a democratic deficit regardless of functional arguments; Scandinavian social-democratic scholars who regard monarchy as harmless but anachronistic path dependency; British constitutional historians who defend the status quo on traditionalist rather than functionalist grounds; and one Japanese legal scholar specializing in constitutional symbolism and Article 1. There are no monarchists present, and the group is skeptical of institutional-design arguments that rely on implicit conventions.

  Draft my Q&A prep sheet. I need the eight objections I will actually face, ordered by the combination of likelihood and damage they would do to the paper's core argument. For each objection, phrase it exactly as that audience segment would phrase it—using their vocabulary (equal moral status, path dependency, reserve prerogatives, SCAP legacy, symbolic state, functional substitution, and so on). For each, provide: (a) what I should concede up front; (b) the reply I should hold to, brief enough for a two-minute response; (c) a frank note on where that reply is weakest or most vulnerable. Include the one objection I am hoping nobody asks, phrased in its sharpest form. Finally, please state how confident you are in these predictions of audience reaction and in the strategic advice offered, and explicitly identify the point—whether in anticipating the Japanese scholar's line, in assessing the hidden-power objection for the UK case, or elsewhere—where your confidence is lowest.
