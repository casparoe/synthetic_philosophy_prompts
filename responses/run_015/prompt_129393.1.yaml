answer: |-
  **Desiderata for a Theory of Material Constitution**

  As one trained to respect the hard constraints of conservation laws and frame invariance, I propose the following requirements for any theory claiming to describe how matter constitutes objects. Each item includes the motivating consideration and a classification of its necessity.

  **1. Modal Profile Discrimination**
  *   **Motivating Case:** The statue and the clay. The clay could survive being squashed into a ball; the statue could not. Conversely, the statue requires a specific form to exist, whereas the clay does not.
  *   **Requirement:** The theory must account for the difference in modal properties (possibilities of survival and change) between the constituted object and the constituting matter, even if they appear identical at a given moment.
  *   **Status:** **Non-negotiable.** To deny this is to deny the evident difference in conditions of existence between functional artefacts and their raw materials.

  **2. Spatial Co-location**
  *   **Motivating Case:** The statue and the clay. They weigh the same, occupy the same region, and share all physical measurements at a given instant.
  *   **Requirement:** The theory must explain how two distinct entities (if they are distinct) can share the same spatial coordinates without violating the principle of impenetrability or requiring exotic physics.
  *   **Status:** **Non-negotiable.** Empirical observation confirms they occupy the same space; a theory denying this contradicts measurement.

  **3. Diachronic Material Flexibility**
  *   **Motivating Case:** Biological organisms and the Ship of Theseus. A human body replaces nearly all its atoms over a decade via metabolic flux yet remains the same organism.
  *   **Requirement:** The theory must permit an object to persist through the complete replacement of its constituent parts, provided functional and structural continuity is maintained.
  *   **Status:** **Non-negotiable.** To deny this is to contradict biological fact; organisms would cease to exist moment by moment.

  **4. Fission and Fusion Determinacy**
  *   **Motivating Case:** Amoebic division or merging fluid droplets. When one object splits into two viable candidates, or two merge into one, does the original persist?
  *   **Requirement:** The theory must provide truth conditions for identity across branching or merging histories. It must specify whether identity becomes indeterminate or whether one branch is privileged.
  *   **Status:** **Camp Preference.** Some theories tolerate semantic indeterminacy here; others demand a unique metaphysical answer. However, the theory must not leave the physical description ambiguous.

  **5. Distinction Between Synchronic and Diachronic Constitution**
  *   **Motivating Case:** A statue constituted by clay now versus the statue persisting through time.
  *   **Requirement:** The theory must distinguish between the relation of parts to whole at a single instant (constitution-at-a-time) and the relation of temporal stages to a persisting entity (constitution-over-time). Collapsing these risks conflating composition with persistence.
  *   **Status:** **Non-negotiable.** Conflating them leads to errors in analysing change versus static composition.

  **6. Physical Law Compliance**
  *   **Motivating Case:** Conservation of mass-energy and Special Relativity.
  *   **Requirement:** The theory must not posit the creation or destruction of matter during constitution, nor rely on a privileged frame of reference or absolute simultaneity to define 'the object at a time'.
  *   **Status:** **Non-negotiable.** Any metaphysics violating conservation laws or assuming Newtonian time is physically inadmissible.

  **7. Genesis Sensitivity (The Dissolved-Scaffold Case)**
  *   **Motivating Case:** An artefact built by layer-by-layer deposition around a scaffold which is later dissolved. The object never existed as a single continuous lump of matter prior to assembly, and its parts were never jointly located in a pre-existing mass.
  *   **Requirement:** The theory must account for objects whose identity depends on their history of assembly rather than merely the continuity of a material bulk. It must explain why this is an object despite lacking a 'lump' phase.
  *   **Status:** **Non-negotiable.** Engineering practice treats such items as unified objects; a theory requiring a pre-existing material lump fails to describe modern manufacturing or biological growth.

  ***

  **Jointly Unsatisfiable Desiderata**

  There exists a precise tension between three non-negotiable requirements that renders them jointly unsatisfiable under classical logic without significant modification.

  1.  **Leibniz's Law (Indiscernibility of Identicals):** If object A is identical to object B, they share all properties.
  2.  **Spatial Co-location:** The statue and the clay occupy the exact same spatial region at the same time.
  3.  **Modal Profile Discrimination:** The statue and the clay have different modal properties (survival conditions).

  If the statue and the clay are identical (satisfying Co-location intuitively), they must share modal properties (violating Discrimination). If they are distinct (satisfying Discrimination), they are two things in one place (challenging intuitive exclusivity, though not logically impossible). However, the deeper physical tension arises between **Physical Law Compliance (Relativity)** and **Diachronic Continuity** for enduring objects. If an object is 'wholly present' at a time, and simultaneity is relative to the observer's frame, then the composition of the object becomes frame-dependent. One observer's 'whole object' is another observer's 'temporal slice'. A theory cannot maintain absolute endurance through time while respecting the absence of absolute simultaneity without making objecthood relative to a reference frame, which undermines the notion of a mind-independent object.

  ***

  **Assessment of Competing Frameworks**

  **Strict Identity of Object and Matter**
  This view asserts the statue is nothing over and above the clay.
  *   **Performance:** It satisfies Spatial Co-location and Physical Law Compliance effortlessly.
  *   **Failure:** It violates **Modal Profile Discrimination**. It must claim the clay could not survive being squashed (if it is the statue) or that the statue could survive being clay-less (if it is the matter), both of which contradict our understanding of artefacts and materials. It pays the cost of denying obvious modal differences.

  **The Constitution View (Distinct but Co-located)**
  This view holds the statue and clay are distinct entities sharing space.
  *   **Performance:** It satisfies **Modal Profile Discrimination** and **Spatial Co-location**.
  *   **Failure:** It struggles with **Physical Law Compliance** regarding density and mass. If two distinct entities occupy the same space, why do we measure only one mass? It requires an explanation of how distinct substances superpose without interacting physically. It also pays the intuitive cost of proliferating entities unnecessarily.

  **Mereological Essentialism**
  This view holds that an object is identical to the sum of its parts; change a part, and you destroy the object.
  *   **Performance:** It satisfies **Leibniz's Law** rigorously.
  *   **Failure:** It catastrophically fails **Diachronic Material Flexibility**. It implies organisms cease to exist with every metabolic exchange. It treats the **Dissolved-Scaffold Case** as a series of distinct objects rather than one growing artefact, contradicting engineering and biological practice.

  **Four-Dimensional Perdurantism**
  This view treats objects as space-time worms composed of temporal parts.
  *   **Performance:** It handles **Diachronic Material Flexibility** and **Fission** well by treating persistence as a relation between stages.
  *   **Failure:** It faces tension with **Physical Law Compliance (Relativity)** if it relies on global simultaneity slices to define temporal parts. Furthermore, it fails the intuition behind **Spatial Co-location** in the ordinary sense, as it denies objects are 'wholly present' at any time, which conflicts with the phenomenological experience of interaction.

  ***

  No coherent theory can simultaneously preserve classical identity, accommodate relativistic physics, and honour the modal distinctions of ordinary objects without substantial metaphysical revision.
