      *   *Single Change:* Modifying (3). The claim that segmentation/detail are *contributed* at waking is too strong if (2) is to hold. It should be *reconstructed* or *decoded* at waking, not *contributed*. "Contributed" implies creation; "decoded" implies retrieval. This saves Realism (1) and Occurrence (2).

