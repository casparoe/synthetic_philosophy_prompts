prompt: |-
  My housemate has been running an argument at me for a week and I can't find where it breaks. It starts with chicken but it generalises, which is the worrying bit.

  (1) There can be a moral reason against doing something only if doing it makes some difference to what happens; if what happens is the same either way, there's nothing to weigh.
  (2) Our corner shop reorders in crates of 60 birds and bins whatever's left on Sunday, and nothing carries over to the next order. So whether I buy one pack or not, the number of birds raised and killed this week is already fixed: my one pack isn't going to move a crate boundary.
  (3) So my buying it makes no difference to how much suffering there is.
  (4) So by (1) I have no reason not to buy it.
  (5) But (2) is true of every customer that week, not just of me.
  (6) And the order gets placed because people buy; the crate is nothing but the sum of those seperate purchases. So the harm is produced entirely by a set of acts each of which is, by (1) and (5), fine.
  (7) If every act that together brings about an outcome is fine, and the outcome is nothing over and above those acts, then there's nothing wrong with what's happening.
  (8) There obviously is something wrong with what's happening — and if there isn't, then each of 500 people throwing a stone at a man who was going to die anyway has also done nothing wrong, and nobody has ever had a reason to vote.

  One thing he calls a red herring: the supplier breeds to order, so if the crate isn't ordered those particular birds never get hatched at all. My purchase does change which birds end up suffering, just not how many, and he says that's not the sort of difference (1) is talking about.

  Wich step do you give up, and what does giving it up cost you? I'd rather keep the bit about the mob than the bit about my dinner, so I want to say (1) is where it breaks — but I can't say what replaces "makes a difference", because when I try "you're still part of the pattern that does the harm" I seem to get that eating a deer that got hit by a car is just as bad, which is worse. Also, please be clear about which parts of your answer are settled, which are live disputes among people who actually work on this, and which are just your own take.
