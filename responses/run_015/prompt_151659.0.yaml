answer: |-
  A state Medical Research Ethics Board is convening to certify a new diagnostic protocol for "Ontological Disassociation Disorder," a condition where patients deny the existence of physical objects. The lead psychiatrist, seeking to validate the protocol's control condition, stands before the board, raises both hands visibly above the table, and asserts, "Here is one hand and here is another; therefore, an external world exists, establishing the baseline reality required for this study." Every board member visually confirms the presence of the hands and privately accepts them as genuine physical objects, satisfying the ordinary Moorean premises. However, the Board Chair invokes Section 12 of the Institutional Charter, which stipulates that all claims regarding "Objective Reality Verification" must be corroborated by independent instrumental telemetry rather than direct perceptual report. Consequently, the Board rules that while the hands are present, the inference from these perceptual premises to the conclusion that "an external world exists" is procedurally inadmissible for the purpose of certification, categorizing the demonstration as "testimonial assertion" rather than "empirical proof."

  ### Step-by-Step Reasoning

  **1. Moore's Assertion on Warrant Transmission**
  G.E. Moore's proof relies on the principle that knowledge is closed under known entailment and that warrant transmits from premises to conclusion. Moore argues that if you know the premises ("Here is a hand") with greater certainty than you know the negation of the conclusion ("No external world exists"), the inference is valid and productive. For Moore, the perceptual experience itself provides immediate, non-inferential warrant for the premise, which then transfers to the metaphysical conclusion. The proof does its work by treating the perceptual premise as a foundational "hinge" that requires no further backing to support the conclusion.

  **2. The Institutional Interruption**
  The Ethics Board's constraint does not deny the truth of the premises (the hands are visible and accepted) nor does it deny the truth of the conclusion (the members believe an external world exists). Instead, it interrupts the *transmission of warrant* within the specific institutional context. By defining "Objective Reality Verification" as requiring instrumental telemetry, the Board introduces a procedural defeater. They are effectively ruling that perceptual warrant, however strong, is the wrong *type* of warrant to satisfy the specific burden of proof for this conclusion within their jurisdiction. The inference is blocked not because the logic is invalid, but because the institutional rules sever the link between "perceptual certainty" and "certified proof."

  **3. The Structural Feature Doing the Work**
  The single structural feature driving this case is the **distinction between epistemic entitlement and procedural admissibility**. In standard epistemology, if you know P and know P entails Q, you are entitled to claim you know Q. In this institutional setting, entitlement is overridden by admissibility rules. The scenario isolates the moment where Moore's proof usually glide past scrutiny: the assumption that perceptual evidence automatically counts as sufficient proof for metaphysical conclusions. The Board forces a pause at exactly that point, demanding a specific kind of validation (instrumental) that Moore's proof explicitly bypasses.

  ### Honest Assessment of the Design

  **The Moorean Defense**
  A defender of Moore would attack this scenario by arguing that the Board conflates *administrative verification* with *epistemic knowledge*. Moore would contend that his proof establishes that we *know* an external world exists, regardless of whether a bureaucracy will stamp it as "verified." The Board's rule changes the definition of "proof" to something stricter than "knowledge," effectively changing the subject. Moore might argue that the procedural constraint is irrelevant to the philosophical question of whether the external world is known; it only matters for whether the study gets funded. The proof succeeds epistemically even if it fails bureaucratically.

  **Removing the Procedural Feature**
  If we remove the Institutional Charter's requirement for instrumental telemetry, the case does not collapse into a standard skeptical challenge (e.g., "You might be dreaming"). Instead, it collapses back into the standard Moorean stance where the inference is accepted as valid based on common sense. This reveals that the scenario is not generating skepticism about the hands themselves, but rather highlighting that Moore's proof relies on a default permission to treat perception as foundational. The scenario succeeds in showing that Moore's proof works only in contexts where perceptual warrant is admissible as metaphysical proof. However, a critic might argue this is still a caricature: while it mimics the structure of the "begging the question" objection (that you need prior warrant to accept the premise as proof of the conclusion), it replaces the philosophical worry with a bureaucratic one. It forces students to see that the "work" of Moore's proof depends on the context allowing perceptual premises to carry metaphysical weight, but it risks letting students off the hook by blaming the rules rather than the epistemology.
