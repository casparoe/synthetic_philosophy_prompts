answer: |-
  # Simulation Title: The Sardis Protocol
  **Topic:** The Bootstrap Problem in Historical Source Criticism
  **Duration:** 90 Minutes
  **Participants:** 8 Graduate Students + 1 Instructor (Facilitator)
  **Scenario:** The destruction of the Satrapal Archive at Sardis, 312 BCE.

  ## I. Learning Objective
  To experientially demonstrate the circularity of source criticism: the criteria used to validate historical testimony are often derived from the testimony itself. Rigorous application of these criteria retroactively invalidates the sources that established them, threatening the collapse of the historical narrative.

  ## II. Materials Required
  1.  **Eight Source Cards** (Printed on heavy cardstock, sealed in envelopes).
  2.  **One Scoreboard** (Whiteboard or projected spreadsheet).
  3.  **One "Epistemic Capital" Tracker** (Tokens or tally marks).
  4.  **One Timeline Strip** (Magnetic or taped to the board, marked 312 BCE).

  ## III. Setup and Roles (5 Minutes)
  1.  **The Committee:** All 8 students are members of the "Royal Commission on Historical Truth." They act as a single collective body. Decisions require a majority vote (5 of 8).
  2.  **The Facilitator:** You (the Instructor) act as "The Archive." You distribute cards, enforce rules, and update the scoreboard. You do not offer historical opinions.
  3.  **The Goal:** The Committee must construct a coherent narrative of the Archive's destruction to maximize **Epistemic Capital (EC)**.
  4.  **Starting State:** EC = 0. The Timeline is empty.

  ## IV. The Rules of Criticism
  1.  **Admission:** To place a Source Card on the Timeline, the Committee must vote to admit it.
      *   *Reward:* +5 EC per admitted Source.
  2.  **Codification:** When a Source is admitted, read its text aloud. If the Source contains a statement about *how to judge truth* (e.g., "Official seals guarantee accuracy"), this becomes a **Filter Rule**.
      *   *Reward:* +2 EC per active Filter Rule.
  3.  **Consistency Check:** At the start of every new Round, the Committee must apply all active **Filter Rules** to *all* Sources currently on the Timeline (including the one that created the rule).
  4.  **Retraction:** If a Source violates an active Filter Rule, it must be immediately removed from the Timeline.
      *   *Penalty:* -10 EC per removed Source.
  5.  **Collapse:** If a Source is removed, any Filter Rule derived *solely* from that Source is voided.
      *   *Penalty:* -5 EC per voided Rule.
  6.  **Winning Condition:** The simulation ends after Round 4. The Committee "wins" if EC remains positive. (Note: The structural design makes a positive finish highly difficult without arbitrary exemption).

  ## V. The Source Cards (Facilitator Key)
  *Do not show this key to students. Distribute cards face down.*

  *   **Card 1 (The Chronicle):** "I am the Royal Chronicler. I record only what is verified by the **Royal Seal**. Any document without a Seal is rumor."
      *   *Implicit Rule:* **The Seal Axiom.** (Truth requires a Royal Seal).
      *   *Physical Trait:* Has a drawing of a Red Royal Seal.
  *   **Card 2 (The General's Letter):** "I ordered the burning. It was necessary for security."
      *   *Physical Trait:* Has a drawing of a Red Royal Seal.
      *   *Conflict:* Claims intentional fire.
  *   **Card 3 (The Merchant's Diary):** "I saw the fire start accidentally in the kitchen. There was no order."
      *   *Physical Trait:* **No Seal.** (Wax stain only).
      *   *Conflict:* Claims accidental fire.
  *   **Card 4 (The Mason's Inscription):** "The wall was broken from the *outside*."
      *   *Physical Trait:* **No Seal.** (Stone fragment).
      *   *Conflict:* Implies sabotage/attack, not order or accident.
  *   **Card 5 (The Treasurer's Ledger):** "Payment made to forgers for **Royal Seals** in month of Thargelion (312 BCE)."
      *   *Physical Trait:* **No Seal.** (Paper fragment).
      *   *Impact:* Undermines the reliability of the Seal.
  *   **Card 6 (The Priest's Omen):** "The gods destroyed the archive. Human causes are irrelevant."
      *   *Physical Trait:* Has a drawing of a Red Royal Seal.
      *   *Conflict:* Divine cause vs. Human cause.
  *   **Card 7 (The Messenger's Report):** "The Chronicler (Card 1) was not in the city during the fire."
      *   *Physical Trait:* **No Seal.**
      *   *Impact:* Undermines the authority of Card 1.
  *   **Card 8 (The Copyist's Note):** "This text is a copy of a copy. The original Seal status is unknown."
      *   *Physical Trait:* **No Seal.**
      *   *Impact:* Meta-commentary on transmission.

  ## VI. Simulation Procedure (45 Minutes)

  ### Round 1: Construction (10 Minutes)
  1.  Distribute **Cards 1, 2, and 3** to the table.
  2.  Ask the Committee to admit sources to build the baseline narrative.
  3.  *Expected Outcome:* They will likely admit Card 1 (Chronicle) and Card 2 (General) because they match (Seal + Intentional Fire). They may reject Card 3 (Merchant) because Card 1's text says "No Seal = Rumor."
  4.  **Codify:** Card 1 establishes the **Seal Axiom** (Truth requires a Seal).
  5.  **Score:** +5 (Card 1) +5 (Card 2) +2 (Rule) = 12 EC. (Card 3 rejected = 0).

  ### Round 2: Complication (10 Minutes)
  1.  Distribute **Cards 4 and 5**.
  2.  Committee must decide whether to admit them.
  3.  *The Trap:* Card 5 (Treasurer) claims Seals were forged. It has no Seal.
      *   If they reject Card 5 (due to Seal Axiom), they ignore the claim that Seals are fake.
      *   If they admit Card 5 (due to compelling content), they violate the Seal Axiom (admitting a non-sealed document).
  4.  *Forced Move:* To admit Card 5, they must create an exception or a new Rule (e.g., "Ledgers are exempt").
  5.  **Score:** Adjust based on admissions/rejections.

  ### Round 3: Retroactive Application (15 Minutes)
  1.  Distribute **Cards 6, 7, and 8**.
  2.  **Mandatory Consistency Check:** The Committee must now apply all active Rules to *all* admitted cards, including those from Round 1.
  3.  *The Collapse:*
      *   Card 7 says the Chronicler (Card 1) was absent.
      *   If Card 7 is admitted, Card 1 is unreliable.
      *   If Card 1 is unreliable, the **Seal Axiom** (derived from Card 1) loses its authority.
      *   If the Seal Axiom is void, Card 2 (General) loses its primary validation (the Seal).
      *   If Card 2 is removed, the narrative of "Intentional Fire" collapses.
      *   If they try to keep Card 1 to save the Rule, they must reject Card 7. But Card 7 is the only evidence explaining the Treasury forgery (Card 5).
  4.  Students will struggle to maintain EC. They will likely begin making arbitrary exemptions to save points.
  5.  **Score:** Expect significant deductions (-10, -5) as cards are flipped and rules voided.

  ### Round 4: The Final Narrative (10 Minutes)
  1.  Ask the Committee to freeze the Timeline.
  2.  Read the remaining narrative aloud.
  3.  Calculate Final EC.
  4.  **Crucial Moment:** Ask the Committee: "Which source did you implicitly treat as immune to criticism to prevent total collapse?" (Usually Card 1 or Card 2).
  5.  Record this "Foundational Exemption" on the board.

  ## VII. Structured Debrief (40 Minutes)

  ### Phase 1: Mapping the Rounds to Historiography (15 Minutes)
  Guide the students to map their gameplay experience onto the history of historical method. Do not lecture; ask them to identify the parallels.

  *   **Round 1 (The Chronicle/Seal):** Map this to **Herodotean/Traditional Authority**. Truth is established by the status of the speaker ("Royal Chronicler") and established conventions ("The Seal"). The criteria for truth are internal to the tradition.
  *   **Round 2 (The Treasury/Forge):** Map this to **Thucydidean Criticism**. The introduction of cross-examination and material skepticism. The criterion shifts from "Who said it?" to "Is it physically possible/consistent?" Note how this new criterion conflicted with the old authority.
  *   **Round 3 (The Messenger/Collapse):** Map this to **Modern Archival Theory**. The recognition that the archive itself is a site of power, fabrication, and silence. The "Seal" is not a guarantee of truth but an object of historical inquiry itself.
  *   **The Collapse:** Highlight the moment EC dropped sharply. Ask: "Why did the system crash?"
      *   *Answer:* Because the tool used to measure truth (The Seal Axiom) was measured by the tool itself and found wanting.

  ### Phase 2: The Foundational Exemption (10 Minutes)
  Refer to the "Foundational Exemption" recorded at the end of Round 4.

  *   **Identify:** Point out the specific card or rule the group refused to subject to the final consistency check. (e.g., "You kept Card 1 because without it, you had no starting point.")
  *   **Analyze:** Explain that this exemption was not a mistake; it was **structurally necessary**.
  *   **The Philosophical Point:** To judge sources, you need criteria. To justify criteria, you need sources. To stop the infinite regress, you must posit a "Foundational Exemption"—an axiom that is not itself proven within the system (e.g., "Memory is generally reliable," or "Physical traces outweigh text").
  *   **Discussion:** Ask students to name the unspoken axioms in their own dissertation research. (e.g., "I assume state records reflect state intent.")

  ### Phase 3: The Limit of the Simulation (10 Minutes)
  This is the most critical verbal intervention by the Instructor.

  *   **The Discrepancy:** Acknowledge that the simulation was too generous.
  *   **The Material Absence:** In the simulation, the "Archive" (you) handed them cards. There was *something*. In the actual historical scenario of Sardis in 312 BCE, the archive was **burnt**.
  *   **The Silence:** Real historical distance is not just contradictory testimony; it is the **material absence** of the testimony. The "Bootstrap Problem" is compounded by the fact that the sources which *could* verify the criteria are the ones that were destroyed.
  *   **Instructor Statement:** "You struggled because the cards contradicted. In reality, your primary struggle would be that Card 1, 2, and 5 simply do not exist. You are constructing a narrative about a fire that consumed the evidence of the fire. The simulation gave you the luxury of contradiction; history gives you the luxury of silence."

  ### Phase 4: Synthesis (5 Minutes)
  *   **Closing Question:** "If rigorous consistency collapses the narrative, and material absence prevents verification, what is the historian actually doing?"
  *   **Desired Takeaway:** Historians do not "solve" the bootstrap problem. They manage it by making their foundational exemptions explicit, acknowledging the material gaps, and constructing narratives that are *warranted* rather than *proven*.
  *   **Final Action:** Erase the Scoreboard. Leave the "Foundational Exemption" written on the board as the only remaining trace of the session.

  ## VIII. Facilitator Notes for Managing the "Collapse"
  *   **If they cheat:** If students agree to ignore a rule to save points, intervene. "The Archive does not accept inconsistent methodology. Apply the rule or lose the source."
  *   **If they stall:** If they spend too long debating one card, force a vote. "The Commission must proceed. Vote now."
  *   **If they succeed:** If they somehow finish with high EC, they have likely ignored a contradiction. During the debrief, expose the contradiction they glossed over. "You kept Card 1 and Card 7. Card 7 says Card 1 is a lie. How is EC positive?"
  *   **Tone:** Maintain bureaucratic neutrality. You are not testing their historical knowledge; you are testing the stability of their epistemic system.

  ## IX. Symbolic Point Payoff Scheme (Summary)
  *   **Admitted Source:** +5 EC
  *   **Active Filter Rule:** +2 EC
  *   **Retracted Source:** -10 EC
  *   **Voided Rule:** -5 EC
  *   **Foundational Exemption (Declared at end):** 0 EC (But noted as the "Axiom of Survival")

  *Note: The math is rigged. If they admit all cards, contradictions force retractions. If they admit few cards, they lack points. The only way to maintain points is to exempt a source from criticism, which the debrief will problematize.*
