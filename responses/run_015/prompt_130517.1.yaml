answer: |-
  1. Elected councillors derive their authority directly from voters, so having an unelected body overturn their decision can feel like a betrayal of local democracy. This frustration is understandable because they are the ones who must answer to angry constituents at the ballot box.

  2. However, judges are tasked with upholding constitutional rights that exist above local preferences, ensuring free expression isn't subject to a popularity contest. Their role is to act as a check on power so that majority rule does not crush individual liberties.

  3. In this legal system, a bylaw is subordinate to higher human rights legislation, meaning the court was enforcing the rule of law rather than simply imposing personal taste. The council passed a rule that conflicted with established expressive freedoms, leaving the judges no choice but to strike it down.

  4. Allowing elected officials to ban speech they deem disrespectful sets a dangerous precedent where unpopular artists could be silenced whenever they offend public sensibilities. Judicial oversight prevents the definition of acceptable art from becoming too narrow or controlled by temporary political majorities.

  5. The council still retains power to manage public spaces through neutral rules on noise or timing, just not by targeting the specific content of the speech. This balance allows community order to be maintained without violating the fundamental rights protected by the courts.
