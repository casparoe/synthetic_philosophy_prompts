      *   *Requirement 1: Ontological Clarity.* The theory must state what carbon *is* (cost, violation, or symptom).
      *   *Requirement 2: Agency & Scale.* Who acts? (Individual, State, Global System).
      *   *Requirement 3: Temporal Scope.* Past, Present, Future.

  4.  **Developing Test Cases:**
      *   *Factory:* Pricing says pay and play. Regulation says meet standard or close. Degrowth says question why the factory exists. *Why a test case?* It tests the limit of commodification.
      *   *Community:* Pricing says invest in efficiency. Regulation says build public transit. Degrowth says reduce total throughput. *Why a test case?* It tests the definition of "need" vs. "demand."
      *   *Rich Country:* Pricing says pay into a fund. Regulation says transfer tech/regulate supply chains. Degrowth says downscale economy/reparations. *Why a test case?* It tests the tension between restitution and structural change.

  5.  **Identifying Non-Collapsible Distinctions:**
      *   Efficiency vs. Justice (Pareto optimality doesn't mean fair).
      *   Aggregate vs. Distributive (Total tons down vs. who bears the cost).
      *   Intergenerational vs. Intragenerational (Future people vs. Current poor).
      *   *Add:* Procedural vs. Substantive (Who decides vs. What is decided).

