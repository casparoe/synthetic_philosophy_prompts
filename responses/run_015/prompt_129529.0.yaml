  7.  **The "Non-Negotiable" vs. "Liberal Economics" Filter:**
      *   *Non-Negotiable:* Physical carbon budget, basic human rights, non-retrogression of vulnerable populations.
      *   *Liberal Economics in Disguise:* Discounting the future, willingness-to-pay metrics, assuming current property rights are legitimate starting points.

  8.  **The Joint Unsatisfiability Problem (The Crux):**
      *   *The Conflict:* Incommensurability (Degrowth/Regulation view) vs. Quantifiable Compensation (Pricing view).
      *   *Analysis:* If harm is a rights violation (incommensurable), you can't put a price on it to "make whole." If you put a price on it, you admit it's fungible.
      *   *Resolution:* The theory must acknowledge this tension. It can't solve it logically without compromising one ontology. It must be a *tragic* choice or a *lexical ordering* (Rights first, then compensation).

