      *   *Degrowth/Post-Growth:* Structural/Ecological. The metric of growth (GDP) is the pathology. Infinite expansion on a finite planet is the sin. Requires contraction of the metabolic rate.

  3.  **Drafting the Desiderata (The "Spec"):**
