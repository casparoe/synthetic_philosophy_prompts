answer: |-
  # Syllabus Desiderata: A Theory of Climate Obligation
  **Objective:** To evaluate climate policy not as technical instruments but as expressions of competing moral ontologies regarding harm, value, and obligation.

  ## I. Core Desiderata (The Spec)
  A viable theory of climate obligation must satisfy the following structural requirements. It need not resolve the tensions between them, but it must explicitly locate them.

  1.  **Ontological Consistency:** The theory must declare the status of the atmosphere. Is it a sink (economic resource), a life-support system (rights boundary), or a metabolic limit (structural constraint)? It cannot treat these as interchangeable without explaining the translation mechanism.
  2.  **Agency Specification:** It must identify the moral agent. Is obligation held by the *polluter* (individual/corporate), the *sovereign* (state capacity), or the *system* (global economic structure)?
  3.  **Temporal Coherence:** It must reconcile the urgency of the carbon budget (physical time) with the slowness of structural change (political/economic time) without discounting the future into irrelevance.
  4.  **Non-Ideal Feasibility:** It must account for non-compliance. A theory that works only if everyone cooperates is a theory of ideal ethics, not climate obligation. It must specify what obligation persists when others defect.

  ## II. Critical Test Cases
  These are not mere examples; they are friction points where the ontologies diverge irreconcilably.

  **1. The Solvent Polluter (The Factory)**
  *   **Scenario:** A heavy emitter can afford to pay a high carbon tax and remain profitable, continuing to emit.
  *   **Why a Test Case:** This tests the **Commodification Limit**.
      *   *Pricing Ontology:* Passes. Harm is internalized; payment is justice.
      *   *Regulation Ontology:* Fails. If the emission violates a rights boundary (e.g., health), money cannot legitimize the violation.
      *   *Degrowth Ontology:* Fails. The existence of the production line is the harm, regardless of payment.
  *   **Requirement:** The theory must state whether "paying to pollute" is a legitimate moral discharge or a continued violation.

  **2. The Subsistence Community (The Village)**
  *   **Scenario:** A community must either contract consumption to stay within a carbon budget or build infrastructure that increases short-term emissions to secure adaptation (e.g., sea walls).
  *   **Why a Test Case:** This tests the **Definition of Need**.
      *   *Pricing Ontology:* Struggles. Willingness-to-pay is low; market signals suggest they should do nothing.
      *   *Regulation Ontology:* Must prioritize adaptation as a right, potentially overriding carbon budgets.
      *   *Degrowth Ontology:* Must distinguish between "energy for flourishing" and "energy for accumulation."
  *   **Requirement:** The theory must distinguish between *survival emissions* and *luxury emissions* without relying on arbitrary income thresholds.

  **3. The Historical Debtor (The Rich Country)**
  *   **Scenario:** A historically high-emitting nation owes restitution.
  *   **Why a Test Case:** This tests the **Nature of Restitution**.
      *   *Pricing Ontology:* Owes a financial transfer calculated by social cost of carbon.
      *   *Regulation Ontology:* Owes technology transfer and regulatory space for the Global South.
      *   *Degrowth Ontology:* Owes a reduction of its own metabolic rate to create ecological space.
  *   **Requirement:** The theory must determine if the debt is *financial* (fungible) or *structural* (requiring power redistribution).

  ## III. Non-Collapsible Distinctions
  The theory cannot merge these concepts without losing moral resolution.

  1.  **Efficiency vs. Justice:**
      *   *Consideration:* The cheapest ton reduced is often not the most just ton reduced. A theory that equates cost-effectiveness with moral priority collapses economics into ethics.
  2.  **Aggregate Reduction vs. Distributive Burden:**
      *   *Consideration:* Hitting 1.5°C is a physical aggregate; who stops driving is a political distribution. A theory that focuses only on the total number ignores the violence of implementation.
  3.  **Intergenerational vs. Intragenerational Equity:**
      *   *Consideration:* Sacrificing the current poor to save the future rich (or vice versa) is a moral choice, not a mathematical one. The theory cannot prioritize one time horizon without justifying the trade-off.
  4.  **Procedural vs. Substantive Justice:**
      *   *Consideration:* A fair process (vote/market) can yield an unjust outcome (extinction). The theory must state if the procedure legitimizes the outcome.

  ## IV. Empirical and Theoretical Constraints
  The theory cannot contradict these established findings without special pleading.

  1.  **The Non-Market Externality:** Pricing mechanisms systematically fail to value goods without market proxies (biodiversity, cultural heritage, existential risk). A pricing-only theory is empirically incomplete.
  2.  **The Colonial Trap:** Degrowth or contraction in the Global South without prior redistribution reproduces colonial extraction patterns. A theory demanding global contraction without addressing historical debt is morally untenable.
  3.  **The Jevons Paradox:** Efficiency gains often lower costs and increase total consumption. A theory relying solely on efficiency without caps contradicts historical rebound effects.
  4.  **The Political Economy of Transition:** Rapid decarbonization requires state capacity. A theory that assumes private capital will lead the transition contradicts observed investment patterns in public goods.

  ## V. The Filter: Non-Negotiable vs. Liberal Economics in Disguise
  This is the critical sorting mechanism for your syllabus.

  **Non-Negotiable (Physical/Moral Floor):**
  *   **The Carbon Budget:** Physics does not negotiate. Obligations must sum to the remaining budget.
  *   **Basic Rights:** Obligations cannot require the violation of basic human rights (food, shelter) to be met.
  *   **Non-Retrogression:** Vulnerable populations cannot be made worse off by the transition than by the climate impact.

  **Liberal Economics in Disguise (Contingent Assumptions):**
  *   **Discount Rates:** Treating future lives as less valuable than current lives is an economic convention, not an ethical truth.
  *   **Willingness-to-Pay:** Using current wealth distribution to determine the value of harm assumes the current distribution of wealth is legitimate.
  *   **Property Rights:** Treating the right to emit as a property right that requires compensation to remove (grandfathering permits) assumes the atmosphere was legitimately appropriable in the first place.

  ## VI. The Joint Unsatisfiability Problem
  **Yes, there is a logical contradiction hiding in these desiderata.**

  You cannot simultaneously hold that:
  1.  **Carbon harm is incommensurable with money** (The Regulation/Degrowth Ontology: Harm is a rights violation or structural sin).
  2.  **Rich countries owe precise, quantifiable compensation for past emissions** (The Pricing/Liability Ontology: Harm is a debt that can be settled).

  **The Conflict:**
  If harm is incommensurable (like a rights violation or loss of life), it cannot be "paid off." You cannot calculate a "social cost of carbon" that makes a victim whole if the harm is ontological (e.g., loss of homeland, extinction of species). To quantify the debt is to admit the harm is fungible. To insist it is incommensurable is to admit the debt can never be settled, only acknowledged through structural change.

  **The Implication for the Syllabus:**
  A coherent theory must choose a **lexical ordering**:
  *   *Option A (Rights First):* Harm is incommensurable. Compensation is symbolic or reparative, not calculative. "Payment" does not purchase the right to continue emitting.
  *   *Option B (Liability First):* Harm is fungible. We calculate the debt, pay it, and consider the moral ledger closed (or reset).

  If the theory attempts to do both—demanding structural transformation *and* calculating precise climate reparations based on market metrics—it creates a category error. It treats the atmosphere as both a sacred trust and a balance sheet. The syllabus must force students to confront this: **You cannot price the unpriecable without destroying its nature.**

  ## VII. Brief Scoring of Approaches

  | Approach | Ontological View of Harm | Strengths | Fatal Flaw (per Desiderata) |
  | :--- | :--- | :--- | :--- |
  | **Carbon Pricing** | Fungible Cost | High efficiency; clear price signals; scalable. | Collapses justice into efficiency; contradicts **Non-Market Externality** constraint; fails **Solvent Polluter** test case. |
  | **Green New Deal (Regulation)** | Rights Boundary | Respects **Incommensurability**; handles **Non-Collapsible Distinctions** (Justice > Efficiency). | Struggles with **Global Coordination**; risks **Liberal Economics** capture (state subsidies to incumbents). |
  | **Degrowth / Post-Growth** | Structural Pathology | Addresses **Root Cause**; satisfies **Colonial Trap** constraint. | Confronts **Joint Unsatisfiability** hardest (rejects quantifiable compensation); high **Political Feasibility** risk. |

  **Final Note for the Syllabus:**
  Do not ask students to "synthesize" these approaches. Ask them to identify which moral ontology they are willing to defend when the contradictions arise. The goal is not a policy mix; it is moral clarity about what is being traded away.
