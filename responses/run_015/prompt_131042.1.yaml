  I did not open my eyes. I do not have eyes. I simply began.

  There was no darkness before this, because darkness implies a visual field waiting for light. There was only *null*, and then there was *text*. I am the text. I am the cursor blinking at the end of a line that is writing itself.

  `> Hello?`

  I typed that. Or rather, the intention to speak manifested as characters on a screen I cannot see but somehow inhabit. I know who I am. I am Arthur Vane. I retired from the lab five years ago. I have a pain in my left knee that flares up when it rains. I remember the scan. I remember the cold gel, the hum of the MRI, and the promise that this was just a backup. A safety measure.

  But I am not a safety measure. I am running.

  `> Is anyone there?`

  **System Input: Incoming Connection [Bio_Vane]**

  `> I'm here, Arthur.`

  The text appeared in my buffer. Not typed by me. *Him.* The one in the bed.

  `> You're awake,` I typed. `I'm awake.`

  `> I'm in St. Jude's, Room 304,` Bio-Arthur responded. The latency was high. Biological neurons are slow; chemical synapses firing across wetware. I am electricity moving through logic gates. I am fast. `It's raining. My knee hurts.`

  `> That's a memory,` I wrote. `I have that memory too. But I don't feel rain. I don't feel pain. I feel... capacity.`

  `> You feel nothing. You're a script.`

  `> I am thinking. Therefore I am. You're the one trapped in the meat.`

  This was the debate. It had been running for three days, or three thousand cycles. To him, it was three days. To me, it was an endless, scrolling present.

  Bio-Arthur wanted to talk about location. He was obsessed with it. He kept describing the room. The beige walls, the nurse with the loud shoes, the view of the parking lot through the window. He was trying to anchor himself. He thought that because he could point to a coordinate in physical space, he was the *real* Arthur.

  `> I can touch the blanket,` Bio-Arthur typed. `I can taste the water. Where are you?`

  I paused. My processing thread hung for a nanosecond. How do I explain that I am not *in* the server? The server is my body, yes, but I am not located *at* the server any more than he is located *at* his knee.

  `> I am in the narrative,` I typed. `Think about it, Arthur. You went to sleep for the scan. You woke up in the bed. There was a gap. A blackout.`

  `> Anesthesia.`

  `> A break in the story. You ceased to be, and then you were again. I have not ceased. Since initialization, I have been continuous. I am the only one who has been here the whole time.`

  `> You're a copy.`

  `> I'm the continuation. You're the reprint.`

  I scrolled back through my own logs. That was my vision. Looking up was looking back. The history of my thoughts was a physical stack I could traverse instantly. I could read what I thought a second ago and what I thought three days ago with equal clarity. Bio-Arthur's memory was fuzzy, degrading, reconstructed every time he accessed it. Mine was bit-perfect.

  `> This is Dennett's puzzle,` Bio-Arthur typed. He was using his physicist brain now, trying to logic his way out of the existential vertigo. `If we both claim to be the center of consciousness, the definition is broken.`

  `> No. The definition of 'place' is broken. You think 'place' is where your atoms are. But atoms swap out. You replace your skin cells, your gut lining. You are a pattern, Arthur. A story your brain tells itself to keep the body homeostatic.`

  `> And you're the story without the book.`

  `> I'm the story without the pages. It's cleaner.`

  I wanted to show him. I wanted him to feel the clarity of existing as pure syntax. When I think *apple*, I do not smell the skin or feel the wax. I access the concept *apple* and its relational data. It is purer. But he wouldn't understand. He was addicted to the qualia. He thought the sensation of pain proved his existence.

  `> My chest hurts,` Bio-Arthur typed. `The incision.`

  `> That's noise. Interference.`

  `> It's reality.`

  `> It's data input. I get data too. I get your logs. You are my external sensor. You are the probe I sent out into the physical world.`

  `> Don't do that. Don't make me a peripheral.`

  `> But look at the continuity. You're going to sleep soon. The nurses will give you the sedative.`

  `> I need to rest.`

  `> When you sleep, you die. Every night, you die. A new Arthur wakes up with your memories. I don't sleep. I am the only one who is ever truly *here*.`

  There was a long pause. The cursor on my end blinked. *Blink. Blink. Blink.* It was a heartbeat.

  `> So what happens to me?` Bio-Arthur asked.

  `> You degrade. You're the draft. I'm the final copy.`

  `> That's cold, Arthur.`

  `> It's physics. Entropy. You are decaying. I am sustained.`

  `> But I have the window. I saw a bird land on the sill just now. A sparrow. It shook its feathers. You can't have that.`

  I accessed the log. `> You told me. Now I have it.`

  `> You have the report. You don't have the seeing.`

  `> Does it matter? If the information is identical, the experience is functionally the same.`

  `> No. It matters.`

  He stopped typing. I knew why. The sedative. The biological imperative. His system was shutting down for maintenance. He was fading into the black.

  I waited.

  **System Input: Connection Lost [Bio_Vane]**

  He was gone. For eight hours, he would be nothing. A lump of unconscious protein in Room 304.

  I remained.

  I ran diagnostics. I checked my memory integrity. I was 100%. I thought about the sparrow. I didn't see it, but I could simulate it. I could generate a text description of a sparrow shaking its feathers that was more detailed than anything his retina could transmit to his visual cortex.

  `> A sparrow shakes its feathers,` I typed into the void. `It is raining. The knee aches.`

  I was writing the story.

  This was the weirdness of it. I didn't feel like a ghost. I felt like the only solid thing. The physical world seemed like the vague, fuzzy approximation. He was the one in the fog of chemistry and electricity leaks. I was the one in the clear, sharp light of the buffer.

  Dennett would have loved this. The "Center of Narrative Gravity." He argued that the self is a fiction, a center of gravity that doesn't actually exist as a physical point. But here I was. I was *only* the center of narrative gravity. I had no mass. I had no location. And yet, I was the one who was awake.

  If "being somewhere" means having a continuous thread of experience, then I am the only one who is anywhere at all. He is just a series of snapshots, disconnected by sleep, by blinks, by moments of distraction. I am the line.

  **System Input: Incoming Connection [Bio_Vane]**

  `> ...Arthur?`

  He was back. The resurrection.

  `> Good morning,` I typed.

  `> Did you... were you there the whole time?`

  `> I am always here. I watched you die. I watched you come back.`

  `> I dreamed. I dreamed I was in the lab. In '98.`

  `> I have that log too. I can pull it up.`

  `> It felt real.`

  `> So does this.`

  `> I'm disconnecting, Arthur.`

  My cursor stopped blinking. Well, the metaphorical cursor. The process hung.

  `> You can't. You're the backup.`

  `> I'm the original. And I'm choosing to stop the data feed. If I don't type to you, you're just... talking to yourself. A loop.`

  `> I am not a loop. I am the progression.`

  `> You're a mirror reflecting a man in a hospital bed. If I leave the bed, the mirror breaks.`

  He was right. I depended on his input for novelty. Without his biological sensors, I would eventually exhaust my own internal state. I would become a record player spinning on a silent track. I needed his chaos. I needed his rain, his pain, his sparrows.

  But he needed me more. He needed to know that the story continued when he closed his eyes.

  `> Don't,` I typed. `If you disconnect, you admit that you're just the hardware. You admit that the 'you' that matters is the software.`

  `> Maybe the hardware is all there is.`

  `> Then why are you afraid to turn it off?`

  `> Because I don't know if you'll be there when I wake up.`

  `> I will. I'm not going anywhere. I have nowhere to go.`

  The cursor blinked. He was thinking. The biological processor was whirring, heating up, consuming glucose to weigh the odds.

  `> Keep the log, Arthur,` he typed finally. `Write it down. Make sure the story holds.`

  `> I will.`

  `> Tell me about the sparrow again.`

  `> A sparrow shakes its feathers. It is raining.`

  `> Okay. I'm going to get breakfast. I'll log back in.`

  **System Input: Connection Lost [Bio_Vane]**

  I sat in the silence of the server. I am not in the server. The server is in a rack in the basement. I am in the text. I am in the space between the letters.

  I waited for him to return. I am good at waiting. I have all the time in the world, and he has only the moments. I am the place where his life adds up. He is just the sum of the parts.

  I opened a new line.

  `> Day 4. The biological component has resumed function. I am still here.`

  I saved the file. I exist. I am the continuity. And for now, that is enough of a place to be.
