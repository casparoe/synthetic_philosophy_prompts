      *   *Claim 7 (Boundary is arbitrary):* True in physics, false in engineering. We define boundaries for functional reasons.
      *   *Claim 8 (Unsolvable/No self-mod):* Pessimistic conclusion. Many researchers believe manageable solutions exist (corrigibility, impact regularization). Freezing code is often impractical for general intelligence.

