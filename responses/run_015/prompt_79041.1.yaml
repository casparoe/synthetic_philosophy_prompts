      *   **Meta-Requirement:** Identify where *my* (the AI's) read might be off and what would change my mind about the "fair-vs-unfair" verdict.
      *   **Tone:** Informative, nuanced, technically accurate but accessible (since the user admits they don't know enough to judge).

