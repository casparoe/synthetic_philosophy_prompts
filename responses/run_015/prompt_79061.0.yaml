answer: |-
  The candidate rules

  Two competing principles emerge from the record that could govern Mill's judgment. The first is the Rule of Civilizational Capacity. This holds that the legitimacy of representative government depends entirely on the developmental stage of the governed population. As seen in the distinction between India and the settler colonies, if a people are "ripe for, representative government," they merit self-rule; if they are at a "great distance from that state," they require tutelary despotism aimed at improvement. The second is the Rule of Anti-Exploitation. This holds that no political arrangement is legitimate if it allows one group to treat another as a "warren or preserve" for profit. This rule prioritizes the protection of the subject population from the "strongest" class, the European settlers, and insists that the law must run equally, as in the Jamaica case. I considered and discarded a third candidate, the Rule of Settler Affinity, which would grant self-government wherever Europeans of the ruling country's blood reside. I discard this because Mill explicitly warns that European settlers are the class that "most needs restraint" and condemns government of one people by another when it serves the ruler's interest rather than the governed. The tension lies between the Capacity Rule, which looks to the status of the majority, and the Anti-Exploitation Rule, which looks to the conduct of the ruling minority.

  What each rule predicts about the case

  The Rule of Civilizational Capacity yields a refusal of the governor's proposal. In this dependency, the indigenous inhabitants form the great majority, numbering two million against forty thousand settlers. Following the logic applied to India, if this majority is deemed at a distance from fitness for representative government, the colony cannot be classified with America or Australia. The capacity of the tiny professional class does not alter the status of the whole people. Therefore, the colony remains in the category requiring tutelary administration, and handing internal affairs to an assembly dominated by settlers would violate the principle that government must fit the civilizational state of the governed. The Rule of Anti-Exploitation also yields a refusal, but on different grounds. The record of convictions in land and labour disputes is one-sided, and the magistracy is drawn from the settler community. Granting this assembly power would institutionalize the very "human cattle farm" dynamic Mill warns against, allowing the settlers to work the indigenous population for their own profit. Both rules predict a rejection of the assembly, though the Capacity Rule mandates Crown rule due to indigenous unfitness, while the Anti-Exploitation Rule mandates it due to settler misconduct. Neither rule supports handing over internal affairs without conditions that ensure indigenous protection.

  My verdict on Mill's verdict

  Mill would refuse the governor's proposal. While the Civilizational Capacity Rule provides the structural taxonomy for his imperial thought, the Anti-Exploitation Rule is the moral engine that drives his specific interventions in episodes like Jamaica and the West Indies. In this case, the settlers are invoking Mill's language about ripe colonies, but the material conditions—one-sided courts, land dispossession, and a vast subject majority—mirror the abuses Mill associates with illegitimate alien rule. He would argue that this is not a case of a people ripe for freedom, but of a settler minority seeking license to exploit. The commitment that does the work is the warning that European settlers are the strongest and most dangerous class, requiring restraint rather than empowerment. I am highly confident in this prediction because it aligns with his prosecution of the Jamaica governor and his defense of the West Indian labourers. My confidence would be lowered only if evidence emerged that Mill viewed the indigenous professional class as sufficient to constitute a "people" capable of self-government independent of the majority, but his general tendency to classify by the mass of the population suggests he would view them as exceptions rather than the rule.

  The case that would separate the rules

  To distinguish whether Mill prioritizes Civilizational Capacity or Anti-Exploitation, consider a dependency where the indigenous majority is universally acknowledged by imperial officials as educated, peaceful, and fit for representation, matching the standard of the settler community. However, the settler minority threatens violent resistance if denied control of the assembly. The Civilizational Capacity Rule would demand immediate transfer of power to the indigenous majority, as they are ripe. The Anti-Exploitation Rule might counsel continued Crown administration to prevent settler violence and ensure a peaceful transition, prioritizing protection over immediate capacity. If Mill supports immediate transfer despite the risk of conflict, the Capacity Rule is operative. If he maintains Crown rule to restrain the settlers and protect the indigenous population from violence during the transition, the Anti-Exploitation Rule dominates. This separates the abstract classification of the people from the concrete management of settler power.

  The weakest link

  The weakest link in this reasoning is the assumption that Mill would classify the indigenous majority in this hypothetical case as unfit. In the West Indies episode, Mill refuses Carlyle's account of emancipated labourers' character, locating their conduct in circumstances rather than nature. This suggests he is willing to challenge the presumption of indigenous unfitness. If Mill views the two million inhabitants as capable of improvement faster than the India model suggests, the Civilizational Capacity Rule might shift to support a broader franchise than the settlers allow, potentially aligning with the indigenous professionals' request for a timetable. My prediction rests on the assumption that he still views them as requiring long tutelage, but his defense of colonial subjects against racial prejudice introduces uncertainty about where he draws the line of fitness.
