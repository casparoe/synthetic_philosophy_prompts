  Regarding distinctions, the theory must respect the difference between undergoing something versus being disposed to report it, otherwise it cannot handle the non-recall cases, but it may collapse the distinction between dreams being experiences at all versus experiences located during sleep if it treats the timing as functionally defined rather than metaphysically fixed. It must decide whether there is no fact of the matter versus our merely being unable to tell, preferably opting for the latter to maintain scientific realism. The non-negotiable requirement is empirical adequacy across all the cases listed, particularly the physiological signatures in the absence of report. Prejudices include the demand for first-person authority, which Malcolm denies and Dennett complicates, the assumption of continuity with waking perception, the demand for a neural signature, and the insistence that the question be settled empirically rather than conceptually. The pair of desiderata that cannot be jointly satisfied is the requirement that first-person reports are infallible evidence of experience occurrence and the requirement that physiological signatures are infallible evidence of experience occurrence, as these diverge in cases of amnesic dreaming. The single requirement that excludes the most candidates is the demand that the theory provide a one-to-one neural correlate for specific phenomenal content rather than just general states. Malcolm argues that dreams are not experiences during sleep but impressions formed upon waking based on the report. Dennett argues that dreams are functional constructs where the timing of the experience is indeterminate relative to the report. The default view holds that dreams simply are experiences occurring during REM that are remembered upon waking. I am moderately confident in this synthesis, though I am least sure about the claim that the question can be settled empirically rather than remaining partly conceptual.
