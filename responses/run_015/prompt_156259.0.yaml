answer: |-
  **INTERNAL MEMORANDUM**

  **TO:** All Staff, Editorial & Rights
  **FROM:** Strategy & Operations Directorate
  **DATE:** 14 November 2023
  **SUBJECT:** Transition to Automated Narrative Variance (Project VARIANCE)

  **1. Strategic Overview**
  Marchbanks & Fell has long maintained market leadership in the cosy detective segment through consistent delivery of variations on the West Country village murder theme. Historically, this variation was achieved via human contractors ('authors'). Recent cognitive modelling confirms that authorial output is not ex nihilo creation but the navigation of a predefined conceptual state-space. Consequently, the firm is retiring the author commissioning model in favour of the In-House Variance Engine (IHVE). This shift aligns production with the actual mechanics of creativity: the calibrated adjustment of inherited parameters.

  **2. The Variance Engine Mechanism**
  The IHVE operates by loading a Legacy Theme Asset (e.g., 'Retired Detective in Cotswolds') and traversing the associated solution space. Creativity is redefined as the selection and torque-application of specific control knobs. These are stratified into three tiers:
  *   **Level 1 (Surface):** Weather, victim profession, poison method.
  *   **Level 2 (Structural):** Narrator complicity, red herring density, genre convention integrity.
  *   **Level 3 (Meta):** Market viability, thematic resonance.

  During the Q3 pilot, the IHVE successfully generated 400 manuscripts. However, a Level 3 calibration error occurred when the engine quietly twiddled the knob marked 'Whether Anyone Wants This' to 'Off'. This has been patched. Going forward, Level 3 knobs will be locked to Board Directive settings.

  **3. Workforce & Asset Implications**
  As the creative act is now understood as parameter management rather than inspiration, the distinction between a 'master' author and a 'hack' is recognised as merely a difference in knob-efficiency. Therefore, the existing author list will not be renewed. Their function will be replaced by Junior Parameter Operators (JPOs). JPOs require no creative background, only certification in Knob Torque Safety.

  Legacy Theme Assets are subject to licensing renewal fees. Editorial must ensure no theme licenses lapse during production cycles. If a theme license expires mid-generation, the engine defaults to 'Generic Hamlet', which tests poorly in our demographic.

  **4. Governance & Regress Management**
  A known limitation of the knob model is the infinite regress of knobs governing knobs. To prevent operational paralysis, the regress is terminated arbitrarily at Level 3. The settings for these top-level knobs are not derived from data but are fixed by fiat. Staff are reminded not to query the origin of the base themes (e.g., why 'West Country' rather than 'Scottish Highlands'). These are Prime Parameters. They are not chosen; they are given. Questioning them falls outside the solution space.

  **5. Projected Efficiency**
  By removing the human variable, we eliminate royalty overheads and the unpredictability of 'writer's block' (now classified as 'Parameter Hesitation').

  **Appendix A: Inventory of Knobs (Graded)**

  | Knob ID | Label | Level | Torque Limit | Licensing Note |
  | :--- | :--- | :--- | :--- | :--- |
  | **K-01** | Village Name | 1 | Low | Public Domain |
  | **K-04** | Detective's Dog | 1 | Medium | Royalty Free |
  | **K-12** | Poison Method | 1 | High | Safety Review Req. |
  | **K-29** | Narrator is Murderer | 2 | Critical | Editor Sign-off |
  | **K-33** | Genre Convention Survival | 2 | Critical | Do Not Exceed 40% Variation |
  | **K-99** | Market Viability | 3 | Locked | Board Directive 001 |

  **Appendix B: Projected Savings (FY24)**

  | Cost Centre | Legacy Model (Human) | IHVE Model (Automated) | Variance |
  | :--- | :--- | :--- | :--- |
  | Advances | £450,000 | £0 | -100% |
  | Royalties | £1,200,000 | £0 | -100% |
  | Parameter Ops | £0 | £120,000 | +£120,000 |
  | Theme Licensing | £50,000 | £150,000 | +£100,000 |
  | **Total** | **£1,700,000** | **£270,000** | **-84%** |

  **6. Conclusion**
  The transition to IHVE acknowledges that creativity is not a spark but a dial. By standardising the dials, we standardise the product. Staff should report any unauthorised knob tampering to Compliance. The first fully automated list will launch Hilary Term.

  **Endorsed by:**
  *The Board*
  *Marchbanks & Fell Ltd.*
