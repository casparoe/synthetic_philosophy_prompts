answer: |-
  To understand the Brexit referendum and the subsequent *Daily Mail* "Enemies of the People" eruption, we must distinguish between two competing ontologies of democracy. The **aggregative view** treats "the people" as a collection of individuals whose will is the arithmetic sum of votes. Here, 52% Leave is a statistical margin, not a moral monolith. Institutions (Parliament, Courts) are neutral processors of this data. The **ventriloquist view**, conversely, treats "the people" as a singular, moral entity that exists prior to and above institutions. In this model, leaders or media do not count votes; they speak *for* the silent majority, constructing "the real people" by identifying elites (judges, MPs) who allegedly silence them.

  **Mapping the Actors and Options**

  In the **aggregative model**, the High Court's *Miller* ruling was procedural correctness. The referendum was advisory; sovereignty resides in Parliament, which represents the whole electorate (Leave and Remain).
  *   **Who decides:** Parliament legislates based on the referendum data.
  *   **Obedience:** The Government obeys the Court; Parliament votes on Article 50.
  *   **Prediction:** Political friction, but institutional stability. The 48% remain legitimate stakeholders.

  In the **ventriloquist model**, the *Miller* ruling was an act of war. The "will of the people" was treated as a sacred command that transcended legal technicalities.
  *   **Who decides:** The "People" (as channelled by the Government/Press) decide; Parliament is a bottleneck.
  *   **Obedience:** Bypassing Parliament is justified to fulfill the moral mandate; the Court is an obstacle to be delegitimized.
  *   **Prediction:** Institutional crisis. The 48% are framed as dupes or traitors; judges are framed as enemies.

  **Where the Ventriloquist Model Explains the Rhetoric**

  The ventriloquist account is the only framework that explains the *Daily Mail* headline. Under an aggregative logic, judges applying the law cannot be "enemies of the people" simply for ruling against the executive. That label only makes sense if "the people" is a homogeneous moral body whose voice was blocked. The ventriloquist model perfectly maps the **homogenizing rhetoric**: it explains why the 52% was treated as 100%, why regional differences (Scotland/NI voting Remain) were dismissed as irrelevant to the "national will," and why the advisory nature of the vote was politically overwritten. The model predicts that when institutions (Courts) interfere with the transmission of this "true will," the reaction will be personal and vitriolic, not procedural. The "Enemies of the People" slur is the sound of the ventriloquist dummy attacking the puppet master's constraints.

  **Where the Model Strains and Breaks**

  However, the ventriloquist model faces empirical friction. It struggles to account for the **52/48 split** without resorting to conspiracy (e.g., "the 48% don't count"). It cannot explain why Parliament ultimately *did* vote to trigger Article 50, reasserting the aggregative/institutional chain. Furthermore, the model relies on the **non-binding vote** being treated as binding; when the legal reality was enforced (Parliament had to vote), the "pure will" was contaminated by negotiation. The model implies a unified voice, yet the "people" remained deeply divided throughout the process. If "the people" are truly one, the persistence of the 48% represents a failure of the ventriloquist construction, not just political opposition.

  **Flexibility vs. Diagnostic Power**

  Does this prove populism is *always* ventriloquism, or is the model too flexible? It is not too flexible; it is structurally specific. The aggregative model explains the *vote*, but it failed to predict the *war*. The ventriloquist model explains the escalation. It does not explain everything (it cannot predict election outcomes), but it explains the *mechanism of conflict* when populist movements hit institutional walls. The model isn't a universal key; it is a specific description of how populist legitimacy is manufactured against liberal constraints.

  **Stance**

  This episode **mostly supports** the ventriloquist account. While the aggregative view describes the legal reality, it is politically blind to the forces driving the Brexit mess. The ventriloquist model successfully explains why a procedural court ruling triggered a constitutional crisis and why the media felt empowered to attack the judiciary. The model's inability to "handle" the 48% is not a theoretical failure but a description of the populist strategy: the 48% must be erased or silenced for the "will of the people" to function as a singular weapon. The friction we saw was not the model breaking, but the model colliding with reality.

  Verdict: The episode confirms ventriloquism as the operative logic of populist escalation.
