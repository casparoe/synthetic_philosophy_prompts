answer: |-
  This is a rich set of intuitions that exposes the cracks in the standard "abuse of power for private gain" definition. Your cases rightly identify that corruption can exist without financial gain (Case 8), without outcome distortion (Case 2), and without rule-breaking in a technical sense (Case 7 Legacy). Conversely, you identify situations that look like bribery but feel distinct due to coercion (Case 1 Citizen, Case 6 Market).

  As requested, I will lay out three candidate principles, test them against your eight cases, and then refine the strongest one to address your Data Scientist case and new scenarios.

  ### Candidate Principle 1: The Outcome Distortion Principle
  **Definition:** An act is corrupt if and only if it changes an official decision from what it would have been based on merit, law, or public interest.
  *   **Focus:** The result, not the motive.

  **Testing against your cases:**
  *   **Cases 1, 4, 5, 7 (Donor):** Fits. The outcome (passport, ICU bed, safety, admission) is distorted by payment.
  *   **Case 2 (Minister/Best Bid):** **FAIL.** You verdict this "Corrupt," but the outcome was the *correct* one (best bid won). This principle forces you to say the Minister is *not* corrupt.
  *   **Case 3 (Elder/Goats):** Fits (assuming the elder would have mediated anyway).
  *   **Case 6 (Competitive Bribe):** **FAIL.** The outcome (company gets contract) might be the same as if no one bribed (assuming they were the best firm), or the market outcome is distorted. If the market is universally corrupt, is the outcome "distorted" relative to the norm? This principle struggles with systemic corruption where the "counterfactual" is unclear.
  *   **Case 8 (Cousin/Best Bid):** **FAIL.** You verdict this "Not corrupt." This principle agrees, but for the wrong reason (it ignores the nepotism).

  **Verdict:** We must discard this. It cannot account for Case 2, which is central to your intuition that integrity matters independently of results.

  ### Candidate Principle 2: The Institutional Rule Violation Principle
  **Definition:** An act is corrupt if and only if it violates the formal or informal rules governing the office.
  *   **Focus:** Compliance and procedure.

  **Testing against your cases:**
  *   **Cases 1, 2, 4, 5:** Fits. These violate laws or ethics codes.
  *   **Case 3 (Elder):** Fits. In that context, gift-exchange is the *rule*, not a violation.
  *   **Case 6 (Competitive Bribe):** **FAIL.** If "everyone does it," it may be an informal norm of that market. This principle might force you to call it "Not Corrupt" (which you lean toward), but it fails to capture the moral rot. However, if there is a written law against bribery, this principle forces you to call it Corrupt, contradicting your hesitation.
  *   **Case 7 (Legacy):** **FAIL.** Legacy admissions are usually *within* the rules. Donor admissions are often in a gray zone. This principle explains why Legacy is "fine," but it makes corruption purely a matter of legalism.
  *   **Case 8 (Cousin):** Fits. If disclosure was made and rules didn't require recusal, no rule was broken.

  **Verdict:** Too legalistic. It fails to capture the "dislike" in Case 8 or the moral weight of Case 6. It reduces corruption to "getting caught breaking rules."

  ### Candidate Principle 3: The Public Reason Subversion Principle (Your Refined Idea)
  **Definition:** An act is corrupt when a **particularistic loyalty** (to self, kin, group, or donor) is allowed to determine the action *in place of* the **constitutive public reasons** of the office, *unless* that loyalty is institutionally authorized as part of the office's public mission.
  *   **Focus:** The motivation and the reasoning process, distinguishing between "private" and "authorized" preferences.

  **Testing against your cases:**
  *   **Case 1 (Clerk):** Clerk's private gain subverts public duty. Citizen is coerced, not subverting public reason. **Fits.**
  *   **Case 2 (Minister):** The gift enters the deliberation. Even if the bid was best, the *reason* for the decision is now contaminated by private loyalty. **Fits.**
  *   **Case 3 (Elder):** The gift is part of the *constitutive* social role of the elder. It is an authorized particularism. **Fits.**
  *   **Case 4 (ICU):** Donation subverts medical need (public reason). **Fits.**
  *   **Case 5 (Safety):** Profit subverts safety. **Fits.**
  *   **Case 6 (Competitive Bribe):** **TENSION.** The company allows profit to subvert safety/regulation. This principle calls it Corrupt. You said, "I can't call that corrupt." This principle forces you to give up that verdict.
  *   **Case 7 (Donor vs. Legacy):** Donor money is a private loyalty. Legacy status is an *institutionally authorized* preference (alumni relations are a public mission of universities). **Fits.**
  *   **Case 8 (Cousin):** Kinship is a particularistic loyalty. Even if merit was met, the *reason* for the choice included "he is my cousin." Unless nepotism is authorized (it usually isn't, even if disclosed), this principle calls it Corrupt. You said "Not corrupt." This principle forces you to give up that verdict.

  **Verdict:** This is the strongest candidate. It captures the moral nuance of Case 2 and Case 7 better than the others. However, it is stricter than your intuitions on Case 6 and Case 8.

  ---

  ### The Selected Principle: "Authorized Public Reason"

  I propose we adopt **Candidate Principle 3**, but refine it to handle the "masking" element you sensed in the Data Scientist case.

  **The Principle:** *An official act is corrupt when the agent intentionally allows a particularistic attachment (to self, kin, group, or donor) to influence the decision-making process, masking this influence as impartial public reasoning, unless that attachment is transparently institutionalized as part of the office's mandate.*

  This adds two crucial elements:
  1.  **Masking:** Corruption often involves pretending a private reason is a public one (hypocrisy).
  2.  **Transparency/Authorization:** Distinguishes Legacy (open) from Donor (covert), and Elder (customary law) from Minister (statutory law).

  #### Application to the Data Scientist Case
  *   **The Act:** Adding "length of residence" to a housing algorithm.
  *   **The Motive:** To advantage his own ethnic community (Particularistic attachment).
  *   **The Mask:** Justifying it as "community stability" (Impartial public reasoning).
  *   **The Verdict:** **Corrupt.**
  *   **Why:** The scientist is subverting the universalistic mandate of public housing (need-based allocation) to serve a ethnic particularism. Crucially, he *knows* the feature advantages his group and *discloses nothing*. He is using the language of public policy ("stability") to hide a private loyalty. This is "algorithmic clientelism." It fits your intuition perfectly because it captures the betrayal of trust without requiring a payment.

  #### Two New Test Cases

  **Case A: The "Charitable" Embezzler**
  A school principal diverts funds from a wealthy district's surplus budget to buy uniforms and books for a starving school in a neighboring district. She keeps no money, tells no one, and falsifies the ledger to hide the transfer.
  *   **My Principle's Verdict:** **Corrupt.**
  *   **Why:** She has substituted her own moral judgment (particularistic loyalty to the poor children) for the authorized budgetary process (public reason). She masked this as standard accounting. Even if the outcome is "good," the act subverts the office's fiduciary mandate.
  *   **Unwelcome?** Many find this verdict harsh. It suggests "noble cause corruption" is still corruption.

  **Case B: The "Political" Appointment**
  A newly elected Mayor fires all career civil servants in the sanitation department and replaces them with campaign volunteers. She claims this is to "ensure alignment with the new democratic mandate." The volunteers are competent, but less experienced.
  *   **My Principle's Verdict:** **Corrupt (Institutional).**
  *   **Why:** She is substituting loyalty to her political party (particularistic) for the merit-based neutrality of the civil service (public reason), masking it as "democratic alignment."
  *   **Unwelcome?** In many political systems (e.g., the US "spoils system"), this is legal and expected. My principle classifies it as corruption, challenging the distinction between "patronage" and "corruption."

  ---

  ### Honest Admission: Which Verdicts Must You Give Up?

  To maintain the coherence of the **"Authorized Public Reason"** principle (which successfully handles the Data Scientist, Case 2, and Case 7), you must accept that it contradicts two of your original intuitions:

  1.  **Case 6 (The Competitive Bribe):** You wrote, *"I can't call that corrupt... yet it's the same act as case 5."*
      *   **The Conflict:** My principle *must* call this corrupt. If a company pays to repeal safety regulations, it is allowing profit (private interest) to do the work of public safety (public reason). The fact that "everyone does it" makes it *systemic* corruption, not *less* corruption. To keep your verdict that this is "not corrupt," you would have to define corruption solely by *deviance from the norm*, which would make it impossible to condemn systemic rot.
      *   **The Cost:** You must accept that acting according to a corrupt market norm is still a corrupt act.

  2.  **Case 8 (The Cousin Contract):** You wrote, *"Not corrupt, I think — but dislike it."*
      *   **The Conflict:** My principle classifies this as **Corrupt (Nepotism)**. Even if the cousin was the best bidder, the Minister allowed a private loyalty (kinship) to enter the deliberation where only public reasons (merit, cost) were authorized. The disclosure mitigates the *concealment*, but it does not cure the *subversion of reason*. The "dislike" you feel is the recognition of corruption without the criminal element.
      *   **The Cost:** You must accept that "legal nepotism" is a form of corruption, specifically *institutional corruption*, even if no law was broken and the outcome was efficient.

  **Summary:** The principle that best captures the Data Scientist case and the nuance of the Legacy vs. Donor distinction requires you to tighten your definition. It forces you to acknowledge that corruption is not just about breaking rules or stealing money, but about **who gets to decide, and why.** If the "why" is private loyalty masked as public good, it is corruption—even if the cousin is qualified, even if the market demands it, and even if the embezzler is charitable.
