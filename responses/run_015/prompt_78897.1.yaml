  The principle that accommodates your verdicts is not a single static formula (like "always maximize log wealth"), but a **context-dependent utility maximization**. Your intuition correctly identifies that the "value" of a dollar changes depending on whether you are playing a game of infinite repetition, a one-off gamble, or a fight for solvency.

  Here is the precise statement of the principle, broken into the clauses required to match your six verdicts.

  ### The Principle: Adaptive Expected Utility

  **Act to maximize the expected value of your wealth, where the "value" (utility) of that wealth is determined by three constraints:**

  1.  **The Horizon Clause (Cases 1, 2, 3):** If the betting process is **repeatable** and multiplicative (compounding), value is defined by the **geometric mean**. You must maximize the time-average growth rate.
      *   *Why:* In repeated multiplicative games, the arithmetic average is a mirage; the geometric average determines your actual trajectory. This forces fractional staking (Case 1 & 2) and rejects bets with negative geometric growth, even if arithmetic expectation is positive (Case 3).
  2.  **The Ruin Clause (Case 5):** If a single outcome carries a **non-negligible probability of total loss** (zero wealth), the disutility of zero is effectively infinite, regardless of the horizon.
      *   *Why:* Even in a one-shot case, total ruin removes all future optionality. This overrides the Arithmetic Expectation. You stake only enough to keep the probability of zero acceptably low (Case 5), rejecting the Kelly-optimal stake which tolerates higher volatility.
  3.  **The Solvency Clause (Case 6):** If you face a **hard liability threshold** (debt), value is a **step function**. Wealth below the threshold has near-zero utility; wealth above it has diminishing returns.
      *   *Why:* When survival is binary (pay debt or default), maximizing growth rate is irrelevant. You must maximize the *probability* of crossing the threshold. This forces under-betting (grinding) to reduce variance and avoid falling short (Case 6).
  4.  **The One-Shot Clause (Case 4):** If the bet is **truly one-off**, **fractional loss is possible but total ruin is not**, and **no future compounding is planned**, value is defined by the **arithmetic mean**.
      *   *Why:* Without repetition, the geometric mean does not converge. Without total ruin, the Ruin Clause does not trigger. You capture the positive expectation (Case 4).

  ---

  ### The Tension: Which Verdict to Give Up?

  While the Adaptive Principle above accommodates all six verdicts, it relies on a fragile distinction between **Case 3** (Repeated +50%/-40%) and **Case 4** (One-shot +50%/-40%).

  Mathematically, the +50%/-40% coin has a **negative expected log-return** ($0.5 \ln 1.5 + 0.5 \ln 0.6 \approx -0.05$).
  *   **Case 3 Verdict:** Refuse. (Consistent with Log Utility).
  *   **Case 4 Verdict:** Take. (Consistent with Linear Utility).

  **The Inconsistency:** Wealth is fungible. If you take Case 4, you accept a deal that reduces your "capacity for future growth" (your geometric baseline). Even if you promise not to bet again, the wealth you retain (or lose) is the seed for all future life opportunities, which are effectively a repeated game. By accepting a negative log-return bet in Case 4, you are implicitly treating your wealth as if it has no future use, which contradicts the logic of Case 1.

  **The Verdict to Drop:** **Case 4.**
  To be consistent with Case 1 (where you optimize for long-term capacity), you should refuse any bet that reduces your expected log wealth, even in a one-shot scenario. Accepting Case 4 while refusing Case 3 is the only instance where you switch from "Wealth as a Seed" (Log) to "Wealth as Consumption" (Linear) without a solvency constraint forcing your hand.

  ---

  ### Application: A Discriminating New Case

  Here is a case where the candidate principles (Kelly vs. Arithmetic EV vs. Solvency) disagree, testing the **Adaptive Principle**.

  **The Case:**
  You have \$10,000. You need \$12,000 in one week to secure a housing lease (Solvency Constraint). If you fail, you are homeless (Utility $\approx -\infty$). You find a coin that is 60/40 in your favor, paying even money. You may flip it **once per day for 7 days**.

  **The Conflict:**
  *   **Arithmetic EV (Linear Utility):** Bet 100% every day. Maximizes expected dollar value, but risk of ruin is high ($0.4^7$ is small, but intermediate ruin is possible).
  *   **Kelly Criterion (Log Utility):** Bet 20% every day. Maximizes long-term growth rate.
  *   **Solvency Goal (Step Utility):** Maximize probability of ending with $\ge \$12,000$.

  **Application of the Adaptive Principle:**
  1.  **Check Solvency Clause:** You have a hard threshold (\$12,000). Falling short is catastrophic. This overrides the Horizon Clause.
  2.  **Check Horizon:** You have 7 flips (Repeated).
  3.  **Determine Strategy:**
      *   Kelly (20%) aims for growth. After 7 flips, the *median* outcome is roughly $\$10,000 \times 1.02^7 \approx \$11,500$. Kelly optimizes the *average* outcome, but the median path fails your lease requirement.
      *   To maximize the probability of hitting \$12,000, you must increase variance slightly above Kelly, but not to 100% (which risks ruin before day 7).
      *   However, because the target (\$12,000) is close to the start (\$10,000) relative to the edge, the **Solvency Clause** dictates you should **stake less than Kelly** initially to avoid early ruin, then increase stakes if you fall behind (bold play when losing, cautious when winning).
      *   *Correction for Single Strategy:* Since you must fix a fraction or strategy: The principle dictates you do **not** bet 20% (Kelly). You calculate the stake that maximizes $P(Wealth_7 \ge 12,000)$. For a close target and positive edge, this is often **smaller than Kelly** to reduce volatility drag, ensuring you survive the 7 days to let the edge work.

  **Verdict:** You stake **less than 20%** (likely around 10-15%), prioritizing the probability of clearing the threshold over the growth rate of wealth. This honors the Solvency Clause over the Horizon Clause.
