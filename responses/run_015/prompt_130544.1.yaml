      2.  *Golden Rule:* Head off at Step 3 (CC). Move: Emphasize "logical consistency of the practice" vs "personal preference."
      3.  *Bad Outcomes:* Head off at Step 3 (CC). Move: Distinguish systemic collapse (logical) from aggregate harm (empirical).
      4.  *Collapsing Formulas:* Head off at Step 5 (FH). Move: Explicitly state FH relies on dignity/value, not universalizability logic.

      *Refining Check for Understanding:*
      Question: "If the scientist argues that universal suppression wouldn't destroy science *because* detection technology improves, has she failed the CC test or the CW test?"
      *   Correct: She misunderstands CC. CC is about the concept of 'evidence' collapsing, not empirical detection rates.
      *   Incorrect: She thinks it's about whether she gets caught (consequentialism).

      *Refining Omissions:*
      1.  Metaphysics of Freedom: Too abstract, distracts from logical machinery.
      2.  Kingdom of Ends: Too political/social, focuses on community rather than individual maxim testing.
      3.  Textual Exegesis: Audience cares about ideas, not philology.

  4.  **Drafting the JSON:**
