answer: |-
  ### Teaching Plan: Kant's Universalizability as Logical Machinery

  **Session Overview**
  This seventy-five-minute salon is designed to recalibrate how science editors, policy experts, and engineers view Kantian ethics. The goal is not to make them Kantians, but to equip them with the specific logical machinery of the Categorical Imperative, distinguishing it sharply from utilitarianism and intuitionism. The session relies on a single, sustained case study regarding data integrity to prevent abstraction drift.

  **1. The Input: Formulating the Maxim (0–10 minutes)**
  Before any testing can occur, the audience must understand what is being tested. Kant does not test actions in isolation; he tests the *maxim* (the subjective principle of volition) behind the action.
  *   **Dependency:** You cannot test universalizability without a defined rule to universalize.
  *   **Action:** Introduce the carrying example immediately. Present the scientist's maxim: *"I will suppress one outlier in replication data when it threatens a valuable theory, on the condition that detection is unlikely."*
  *   **Pedagogical Move:** Ask the audience to strip away the context (the "valuable theory") and isolate the rule. This establishes that Kantian ethics evaluates the *rule*, not the *outcome* of the specific instance.

  **2. The Frame: Non-Consequentialist Logic (10–25 minutes)**
  Before applying the test, you must inoculate the audience against their default utilitarian training. Most professionals in science and policy are trained to weigh costs and benefits.
  *   **Dependency:** If participants believe the test measures "bad outcomes," they will fail to understand "contradiction."
  *   **Action:** Explicitly state that Universalizability is not a prediction of disaster. It is a test of *conceivability*.
  *   **Misconception Head-Off (Consequentialism & Bad Outcomes):** When introducing the test, assert: "We are not asking if the world would be worse if everyone did this. We are asking if the *practice* could logically exist if everyone did this." Use the outlier case: If everyone suppressed outliers, would science suffer (consequentialist) or would the concept of 'replication data' cease to have meaning (logical)?
  *   **Misconception Head-Off (Golden Rule):** Clarify that this is not about whether the scientist wants *done to her* what she does to others. It is about whether the agent can consistently *will* the rule as a law of nature.

  **3. The First Filter: Contradiction in Conception (25–45 minutes)**
  This is the strictest test, reserved for perfect duties. It asks: Can I conceive of a world where this maxim is a universal law without contradiction?
  *   **Dependency:** This must come before Contradiction in Will because it deals with logical impossibility, which is easier to grasp than volitional inconsistency.
  *   **Action:** Apply the outlier maxim. If the universal law is "Suppress outliers to preserve theory," the institution of 'data replication' collapses because data is defined by transparency. The maxim destroys the very condition it needs to function (trust in data).
  *   **Pedagogical Move:** Distinguish between *empirical* impossibility (we couldn't catch everyone) and *logical* impossibility (the concept of 'evidence' becomes incoherent).
  *   **Misconception Head-Off (Bad Outcomes):** If a participant says, "If everyone did this, truth would be hidden," correct them: "Not just hidden, but the category of 'truthful data' would no longer apply."

  **4. The Second Filter: Contradiction in Will (45–60 minutes)**
  This test applies when the maxim is conceivable but cannot be rationally *willed*. It addresses imperfect duties.
  *   **Dependency:** This requires the audience to understand that some things are logically possible but irrational for a rational agent to commit to universally.
  *   **Action:** Contrast the outlier case (which fails Conception) with a case that might pass Conception but fail Will (e.g., "I will never collaborate"). A world without collaboration is conceivable, but a rational scientist cannot will it, as science requires community.
  *   **Misconception Head-Off (Collapsing Formulas):** Emphasize that FUL (Universal Law) is about consistency of the will with itself. This sets the stage to distinguish it from FH.

  **5. The Distinct Framework: Formula of Humanity (60–70 minutes)**
  Introduce the Formula of Humanity (FH) not as a restatement of Universal Law, but as a substantive constraint on *what* can be willed.
  *   **Dependency:** FH must come after FUL to prevent the audience from treating them as the same test phrased differently.
  *   **Action:** Explain that FH forbids treating persons merely as means. In the outlier case, suppressing data treats the scientific community (and the public) as mere means to the end of "valuable theory."
  *   **Misconception Head-Off (Collapsing Formulas):** Explicitly state: "FUL tests the logic of the rule; FH tests the value of the persons affected. They often overlap in verdict, but the machinery is different."

  **6. Check for Understanding and Conclusion (70–75 minutes)**
  *   **Action:** Pose the diagnostic question (detailed in JSON).
  *   **Conclusion:** Reiterate that Kant offers a tool for checking internal consistency of professional norms, not a calculator for social good.

  **Omissions**
  *   **Metaphysics of Freedom:** Discussing transcendental freedom distracts from the logical machinery of the test. Professionals need the tool, not the ontological grounding.
  *   **Kingdom of Ends:** This introduces political/community dimensions that complicate the individual maxim testing focus of this session.
  *   **Textual Exegesis:** Debating *Groundwork* vs. *Critique of Practical Reason* is irrelevant to applying the logical framework.

  ***

