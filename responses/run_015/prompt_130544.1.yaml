          *   Do not explain Kant to *me* (the user); plan the explanation for the *audience*.
          *   Specify the order of components and dependency rationales.
          *   Use a specific carrying example: Scientist suppressing a non-critical outlier to preserve a socially valuable theory (Maxim: "I will suppress one outlier in replication data when it threatens a valuable theory, on the condition that detection is unlikely.").
          *   Explain what the example must possess/avoid and why standard examples fail.
          *   Map misconceptions (consequentialism, Golden Rule, bad outcomes, collapsing formulas) and where to head them off.
          *   Include one check for understanding (applied question).
          *   State what to leave out (metaphysics, etc.) with justification.
          *   **Output Format:** Prose teaching plan first, then a specific JSON summary.

  2.  **Deconstruct the Content Requirements:**
      *   **Sequence & Dependencies:** What comes first?
          1.  Maxims (subjective principles of action).
          2.  The Categorical Imperative (CI) as a test of consistency, not outcomes.
          3.  Formula of Universal Law (FUL) - Contradiction in Conception (CC).
          4.  Formula of Universal Law (FUL) - Contradiction in Will (CW).
          5.  Formula of Humanity (FH) - Distinct from FUL.
      *   **Carrying Example:** Scientist suppressing outlier.
          *   *Features:* Ambiguous intuitive pull (theory is valuable), transparent logic (universalizing suppression destroys data integrity), lacks immediate revulsion (not murder/theft).
          *   *Why not standard:* False promise/suicide trigger emotional reflexes or are too abstract/archaic for this audience.
      *   **Misconceptions:**
          1.  Consequentialism ("bad outcomes if everyone did it").
          2.  Golden Rule ("would you want it done to you?").
          3.  Collapsing FUL and FH.
          4.  Contradiction = Empirical impossibility vs. Logical/Volitional impossibility.
      *   **Check for Understanding:** Needs to test logical structure, not moral discomfort.
      *   **Omissions:** Metaphysics of freedom, Kingdom of Ends, textual exegesis.
      *   **Duration:** 75 minutes.

  3.  **Drafting the Prose Plan:**
      *   *Introduction (10 mins):* Set the stage. Define "Maxim". Introduce the outlier scenario immediately to ground it.
      *   *Step 1: The Logic of Universalization (15 mins):* Distinguish from consequentialism. It's about *conceivability*, not *desirability*. Head off the "bad outcomes" misconception here.
      *   *Step 2: Contradiction in Conception (20 mins):* Apply to the outlier case. If everyone suppressed outliers, "data" loses meaning. The practice becomes impossible. This is logical contradiction, not empirical inconvenience. Head off Golden Rule here.
      *   *Step 3: Contradiction in Will (15 mins):* What if it *could* be universalized? Would a rational agent *will* it? Distinguish CC vs CW.
      *   *Step 4: Formula of Humanity (10 mins):* Introduce as distinct. Treating persons as ends. Why it's not the same test. Head off collapsing formulas.
      *   *Check for Understanding (5 mins):* Specific question on the outlier case.
      *   *Conclusion/Q&A (5 mins):* Wrap up.
      *   *Omissions:* Justify why metaphysics etc. are cut (time, relevance to professionals).

      *Refining the Sequence:*
      1.  **Maxim Formulation:** Must come first. You can't test what you haven't formulated.
      2.  **Non-Consequentialist Frame:** Must come before applying the test, otherwise they default to utilitarianism.
      3.  **FUL - Contradiction in Conception:** The stricter test. Comes before Will.
      4.  **FUL - Contradiction in Will:** The secondary test for imperfect duties.
      5.  **Formula of Humanity:** Separate framework, introduced after FUL to prevent conflation.

      *Refining the Example:*
      The prompt specifies the example: "I will suppress one outlier in replication data when it threatens a valuable theory, on the condition that detection is unlikely."
      *   *Required:* Ambiguity (valuable theory), Logical transparency (universal suppression kills trust in data).
