answer: |-
  **FINAL EXAMINATION: EPISTEMIC LOGIC AND METAPHYSICS**
  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Question 1**

  **Part A: Model Checking (4 Marks)**
  Consider a Kripke model $M = \langle W, R, V \rangle$ where:
  *   $W = \{w_1, w_2\}$
  *   $R = \{(w_1, w_1), (w_1, w_2), (w_2, w_2)\}$ (Reflexive and transitive)
  *   $V(p) = \{w_1\}$ (Proposition $p$ is true only at $w_1$)

  Recall that $M, w \models K\phi$ iff for all $v$ such that $wRv$, $M, v \models \phi$.
  Determine whether the formula $p \land \neg Kp$ is true at world $w_1$. Show your work.

  **Part B: The Maneuvers (16 Marks)**
  Fitch's Paradox derives omniscience ($\forall p (p \to Kp)$) from the Knowability Principle ($\forall p (p \to \diamond Kp)$) using standard modal logic. Two maneuvers have been proposed to block this derivation:

  1.  **Fixed-Base Knowability:** We restrict the semantics of $\diamond$. A world $v$ is accessible from $w$ only if $v$ is an *epistemic expansion* of $w$ (all non-epistemic facts in $w$ remain true in $v$, and everything known in $w$ is known in $v$). Consequently, we restrict the Knowability Principle to non-epistemic sentences: $\forall p \in \mathcal{L}_{non-epi} (p \to \diamond Kp)$.
  2.  **Non-Distribution:** We reject the logical rule that knowing a conjunction entails knowing its conjuncts. Specifically, we deny that $K(\phi \land \psi)$ entails $K\phi$.

  Answer the following three questions regarding these maneuvers:

  1.  **Logical Block:** Identify the precise step in the Fitch derivation that each maneuver targets. Explain *why* the step fails under that maneuver. (8 marks)
  2.  **Independent Motivation:** Is there a motivation for either maneuver independent of avoiding Fitch's Paradox? Briefly explain. (4 marks)
  3.  **Philosophical Cost:** Does Fixed-Base Knowability preserve the anti-realist intuition behind the original Knowability Principle, or does it become weak enough that a realist about verification-transcendent truth could accept it? Justify your answer. (4 marks)

  ***

  **MODEL ANSWER**

  **Part A**
  At world $w_1$, $p$ is true by valuation. To evaluate $Kp$ at $w_1$, we check all worlds accessible from $w_1$. The relation $R$ includes $(w_1, w_1)$ and $(w_1, w_2)$. While $p$ is true at $w_1$, $p$ is false at $w_2$ (since $V(p) = \{w_1\}$). Because there exists an accessible world ($w_2$) where $p$ is false, $Kp$ is false at $w_1$. Therefore, $p$ is true and $Kp$ is false. The conjunction $p \land \neg Kp$ is **true** at $w_1$.

  **Part B**

  **1. Logical Block**
  The Fitch derivation assumes an instance of non-omniscience, $p \land \neg Kp$, and applies the Knowability Principle to derive $\diamond K(p \land \neg Kp)$. It then assumes a world where $K(p \land \neg Kp)$ holds. By the **Distribution** rule ($K(\phi \land \psi) \to K\phi$), this yields $Kp \land K\neg Kp$. By factivity ($K\neg Kp \to \neg Kp$), we get a contradiction ($Kp \land \neg Kp$).

  *Fixed-Base Knowability* blocks the **substitution step**. The restricted principle applies only to $\mathcal{L}_{non-epi}$. The Fitch sentence ($p \land \neg Kp$) contains the epistemic operator $K$. Therefore, one cannot instantiate the Knowability Principle with this sentence. The derivation halts before it begins.

  *Non-Distribution* blocks the **inference step** within the possible world. Even if we assume a world where $K(p \land \neg Kp)$ holds, this maneuver denies that this entails $Kp$ (or $K\neg Kp$). Without splitting the conjunction, the contradiction ($Kp \land \neg Kp$) cannot be generated.

  **2. Independent Motivation**
  *Non-Distribution* has independent motivation. Nozick's tracking theory and contextualist accounts suggest knowledge is not closed under known entailment or conjunction elimination in high-stakes or skeptical contexts. One might track the truth of a conjunction without tracking each conjunct individually.

  *Fixed-Base Knowability* lacks strong independent motivation. It appears primarily designed to save anti-realism from paradox. While one might argue we can only verify non-epistemic bases, restricting the principle solely to avoid the paradox looks ad hoc compared to structural changes in the logic of knowledge.

  **3. Philosophical Cost**
  Fixed-Base Knowability likely becomes too weak for the anti-realist. The original intuition was that *all* truths are potentially known. By excluding epistemic truths (like "p is true but unknown") from the scope of knowability, the principle concedes that some truths (specifically epistemic ones) might be verification-transcendent. A realist can accept that non-epistemic truths are knowable while maintaining that epistemic facts about knowledge itself are objective and potentially unknown. Thus, the maneuver saves the letter of anti-realism but sacrifices its spirit, allowing a realist to accept the restricted principle without conceding that truth is essentially epistemic.

  ***

  **MARKING SCHEME (20 Marks Total)**

  **Point 1: Model Evaluation (4 Marks)**
  *   **4:** Correctly identifies $p$ is true, $Kp$ is false (due to $w_2$), and conjunction is true. Shows check of $R$.
  *   **2:** Correct truth value but incorrect reasoning (e.g., ignores $w_2$).
  *   **0:** Incorrect truth value.
  *   *Common Error:* Students assume reflexivity implies $Kp$ is true if $p$ is true at $w_1$, ignoring other accessible worlds.

  **Point 2: Maneuver 1 Logical Block (4 Marks)**
  *   **4:** Identifies that the Fitch sentence contains '$K$', violating the $\mathcal{L}_{non-epi}$ restriction, blocking instantiation/substitution.
  *   **2:** Says "it blocks the principle" without specifying the syntactic restriction on $p$.
  *   **0:** Claims it blocks Distribution.
  *   *Common Error:* Confusing restricting the *quantifier* with changing the *logic* of $K$.

  **Point 3: Maneuver 2 Logical Block (4 Marks)**
  *   **4:** Identifies the failure of $K(\phi \land \psi) \to K\phi$ (Distribution/Elimination) inside the possible world.
  *   **2:** Says "it blocks conjunction" without specifying the direction of entailment.
  *   **0:** Claims it blocks Factivity.
  *   *Common Error:* Citing "Closure" ($Kp \land Kq \to K(p \land q)$) instead of Distribution.

  **Point 4: Independent Motivation (4 Marks)**
  *   **4:** Notes Non-Distribution has external support (Tracking/Contextualism); Fixed-Base appears ad hoc.
  *   **2:** Claims both are ad hoc or both are well-motivated.
  *   **0:** No discussion of motivation.
  *   *Common Error:* Arguing Fixed-Base is motivated by "science" without philosophical justification.

  **Point 5: Philosophical Cost (4 Marks)**
  *   **4:** Argues the restriction concedes verification-transcendent truths (epistemic ones), satisfying realists.
  *   **2:** Says it "weakens" the principle without explaining the realist compatibility.
  *   **0:** Claims it preserves anti-realism perfectly.
  *   *Common Error:* Failing to see that excluding epistemic sentences creates a class of "unknownable" truths.

  ***

  **PRIVATE NOTE TO TA**

  **Independence of Maneuvers:**
  Your suspicion is understandable, but the maneuvers are logically independent. Maneuver 1 (Fixed-Base) restricts the *scope of the quantifier* in the Knowability Principle (a semantic/syntactic restriction on which sentences count as $p$). Maneuver 2 (Non-Distribution) restricts the *inference rules* governing the operator $K$ (a logical restriction). You could theoretically have a logic with Distribution but a restricted KP, or a full KP with no Distribution. They attack different premises of the argument.

  **Difficulty Flag:**
  The question will likely be harder than you expect at **Point 3 (Maneuver 2 Logic)**. In your prompt notes, you worried about "closure under conjunction" vs. "knowledge of conjunction gives knowledge of conjuncts." Fitch's proof *requires* Distribution ($K(A \land B) \to KA$), not Closure ($KA \land KB \to K(A \land B)$). I have phrased the exam text to explicitly define Maneuver 2 as denying Distribution to prevent students from getting hung up on terminology. However, strong students might still pause here. If they correctly identify that Fitch needs Distribution and that the prompt describes denying Distribution, give full marks even if they note the terminological confusion in your notes.

  **Grading Tip:**
  The line between an A and a B lies in **Point 1 and Point 2**. A B-grade answer will say "Maneuver 1 stops the paradox because the sentence isn't allowed." An A-grade answer will specify "The sentence $p \land \neg Kp$ contains epistemic vocabulary, violating the $\mathcal{L}_{non-epi}$ constraint, preventing the instantiation of the universal quantifier." Reward precision.
