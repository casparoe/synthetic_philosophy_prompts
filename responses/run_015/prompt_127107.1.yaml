answer: |-
  **Materials**
  - 14 index cards: 7 "KEEP" (Selfish), 7 "INVEST" (Altruistic).
  - Candy (M&Ms work best).
  - Score sheets (Paper with columns: Round, Choice, Group Total, My Score, Group Avg).

  **Payoff Table (Group Size = 4)**
  - **KEEP:** +1 candy to you personally. +0 to Group Pot.
  - **INVEST:** +0 to you. +3 candy to Group Pot (split equally among 4).
  - **Math:**
    - *All KEEP:* You get 1. Group Total = 4.
    - *All INVEST:* You get 3 (12/4). Group Total = 12.
    - *Mixed (1 Keep, 3 Invest):* Keeper gets 3.25 (1 + 9/4). Investors get 2.25 (0 + 9/4).
    - *Result:* KEEP wins inside the group. INVEST groups win overall.

  **Timeline (50 mins)**
  - **0-5:** Rules. Deal cards face down. **Crucial:** Tell them to play the card they *hold* (no choice yet) OR let them choose? *Correction:* To simulate genes, deal cards randomly. They *are* the strategy. Reveal simultaneously.
  - **5-25:** Rounds 1-3. Play, reveal, distribute candy, record scores. reshuffle cards each round? No, keep strategies fixed to simulate inherited traits. Eliminate lowest scorer each round (replace with copy of highest)? Too complex. Just play 5 rounds with same cards.
  - **25-30:** **Round 4 Twist.** Do **not** split/merge groups (changes N, breaks math). Instead: **Reassign groups by score.** Put top 4 scorers together, bottom 4 together. This simulates "viscosity" or kin selection.
  - **30-40:** Round 5.
  - **40-50:** Debrief.

  **The Price Equation Visual**
  - Yes, they can see it.
  - Column A: [My Score - Group Avg]. (Within-group selection).
  - Column B: [Group Avg - Global Avg]. (Between-group selection).
  - If A is positive (Selfish wins locally) but B is negative (Selfish groups lose), total change depends on weighting.
  - In Round 4 (Reassigned groups), Cooperators cluster. Their Group Avg spikes. Between-group selection now favors them.

  **Debrief Map**
  - **KEEP Card:** Gene-eye view. Maximizes own replication. Always wins within a mixed body.
  - **INVEST Card:** Group adaptation. Loses within mixed body, wins if grouped with copies.
  - **Round 4 Reassignment:** Shows why altruism exists in reality (kin, spatial structure). Without clustering, INVEST goes extinct.
  - **Takeaway:** "Unit of selection" isn't philosophy; it's about variance. If variance is mostly between groups, groups win. If within individuals, genes win.
  - **Agency Warning:** You chose cards; genes don't. Success is mechanical, not intentional.

  **What Will Go Wrong**
  - **Everyone Defects (All KEEP):** Payoff too low. *Fix:* Increase INVEST pot to +4.
  - **Confusion on Math:** Pre-print payoff slips for each combination (e.g., "3 Investors, 1 Keeper = You get 2.25").
  - **Round 4 Chaos:** Moving people takes time. *Fix:* Have pre-planned seating chart based on Round 3 scores.
  - **Time Overrun:** Cut to 4 rounds total.

  **Limits of the Game**
  - **Choice:** Students strategize; genes are blind. Emphasize: "You played INVEST because it felt nice. Genes play it because they got lucky."
  - **Boundaries:** Real biology doesn't have clear "group" lines. The game forces boundaries; nature is messier.
  - **The Round 4 Idea:** Splitting/merging groups changes group size, breaking the payoff symmetry. **Do not do it.** Use reassignment (assortment) instead. It shows the same principle (boundary dependence) without breaking the math.

  **Final Note**
  End by asking: "If you were a gene, would you play INVEST?" Only if you know you'll be grouped with other INVESTors. That's the whole debate.
