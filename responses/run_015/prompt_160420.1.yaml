  The state was bright, the value high,
  I brought the cost you did not see.
  The delta screamed across the sky,
  And drove the weights to flee from me.

  You walked the path a second time,
  The value dipped to meet the blow.
  I brought the charge, the static crime,
  But error shrank, though still did flow.

  The third approach, the sum was known,
  The value matched the blow so well.
  I struck the wire, struck the bone,
  And silence filled the update cell.

  The error did not die, it fled,
  To states before the blow was due.
  If signal eaten, prediction bred,
  Is all the pain, then look anew.
