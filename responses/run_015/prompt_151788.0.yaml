  **Verdict**
  She will say Miriam has **standing** to blame Professor Ames (the individual half), but **no standing** to blame the department's governing body (the collective half).

  **The Rule**
  The single rule explaining her log is **The Principle of Non-Exemption**: A blamer retains standing only if their current conduct does not functionally exempt them from the authority of the norm they are invoking within the relevant sphere of agency. It is not about having "clean hands" generally (the shoplifter, the reformed cheater), nor is it about causal contribution alone (the beneficiary sister). It is about whether the blamer is currently treating the norm as binding on themselves in the context where they are blaming others.

  **Why This Rule Fits the Log**
  *   **The Emissions Case (No Standing):** The manager privately opposed the lie but signed off on it. By signing, she functionally exempted herself from the norm of honesty *in that institutional context*, even if her personal will was opposed. She claimed authority over the CEO for a norm she had just suspended for herself in the same decision.
  *   **The Bystander Case (Standing):** Failing to intervene is an omission. The supervisor ruled this does not amount to exempting oneself from the norm against humiliation. Silence $\neq$ endorsement. The blamer remained subject to the norm.
  *   **The Reformed Cheater (Standing):** She wavered because past violation usually suggests exemption. She ruled "Standing" because the cheater is *now* willing to be judged by the norm. The exemption has been revoked; the authority is restored.
  *   **The Sister's Employer (Standing):** This shows the "collective address" feature is not the blocker. You can blame a body if you are not implicated in its wrongs.

  **Application to Miriam**
  *   **Vs. Ames (Standing):** Miriam complies with the travel norm (no leisure flights). She has not exempted herself. That Ames had no choice is a matter of *aptness* (Ames has an excuse), not *standing* (Miriam's authority). Your three-way distinction does work here: Miriam has the *authority* (standing), but the *content* of the blame might be *inapt* regarding Ames's responsibility.
  *   **Vs. Department (No Standing):** This mirrors the Emissions Manager. Miriam personally divested, but her pension remains in the default fund. The "one-page form" is the functional equivalent of the manager's signature. It is a low-cost administrative act required to align her institutional participation with her professed norm. By not filing it, she is functionally exempting herself from the divestment norm within the university system while demanding the university obey it. She is a beneficiary who has the agency to stop benefiting but chooses inertia.

  **Which Feature Is Doing the Work?**
  The **beneficiary-but-not-agent** feature is doing the real work, specifically the "not-agent" part being false. The supervisor treats the failure to fill out the form as a sufficient act of agency to constitute complicity/exemption. The **collective-address** feature is irrelevant; she allowed blame of the sister's employer (Case 7), so blaming a body is permissible provided the blamer isn't implicated in it.

  **The Runner-Up Rule**
  My prediction is most at risk of being confused with **The Causal Complicity Rule**: *You lose standing if you causally contribute to or benefit from the wrong you are blaming.* This rule predicts the same verdict for Miriam (she benefits from the pension), but for a different reason. My rule (Non-Exemption) focuses on her *willingness* to align; the Complicity rule focuses on the *fact* of her benefit/contribution.

  **The Killer Case**
  The smallest variation to separate these is the **Mandatory Pension Case**: Miriam blames the department for the investment policy, but her pension is *mandatory*; there is no screened option, and she cannot opt out or resign without severe penalty. She privately opposes the policy but is trapped.

  *   **If I picked the wrong rule:** She says **No Standing**. This would mean the Causal Complicity Rule is correct (benefit alone kills standing, regardless of choice).
  *   **If I picked the right rule:** She says **Standing**. This would confirm the Non-Exemption Rule (lack of agency to change the benefit means she isn't exempting herself from the norm; she is excused, like the threatened confidant in Case 5).

  **Confidence**
  I am **highly confident** (roughly 85%) she answers as I predict. The detail about the "one-page form" is the philosophical load-bearing wall of the vignette; without it, she is a pure bystander. With it, she is the Emissions Manager. The supervisor's waver on the reformed cheater shows she cares about *current willingness*, which supports the Non-Exemption Rule over strict Complicity.
