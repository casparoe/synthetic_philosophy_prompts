answer: |-
  1.  **Question:** You argue that Schliemann's excavation at Hisarlik did not gradually confirm Homeric history but instead collapsed the epic's ritual charter by introducing contradictions the tradition could not absorb. Could you specify the mechanism here: how does the physical identification of a destroyed settlement trigger a *social* detachment from ritual reenactment, rather than simply reinforcing the narrative's claim to truth among its maintainers?

      **Follow-up:** You are likely to reply that correlation without recognized contradiction is epistemically inert. However, if the maintaining community *accepts* the archaeological find as validation, doesn't that strengthen the charter's utility for social coordination? Why must the archaeological record produce *contradiction* rather than *correspondence* to effect the shift from legend to history in your model?

  2.  **Question:** Turning to the Arthurian case, you read Geoffrey of Monmouth's chronicle not as an incremental step toward historical record but as the final, overextended mnemonic charter. Do you view Geoffrey's text as the stable peak of that charter function, or is the text itself an early symptom of the collapse already underway due to Norman-Angevin political restructuring?

      **Follow-up:** Pressing on the threshold of historicity: if we discovered a contemporary 6th-century administrative record explicitly referencing a "King Arthur" leading cavalry, would that satisfy your criteria for crossing into history? Or would the lack of a breaking ritual charter keep the narrative within the legendary domain regardless of the archival evidence?

  3.  **Question:** Regarding the Exodus narrative, you argue it remains firmly in the legendary domain because it has never encountered an internal contradiction that its maintaining community was compelled to acknowledge. How does your model account for a narrative that remains a potent mnemonic charter precisely because it has *avoided* the external archival pressure you describe as necessary for frame collapse?

      **Follow-up:** Does this reliance on external archival records to generate "recognized contradictions" implicitly privilege literate state societies over oral or non-state traditions? Can a frame collapse occur in a culture that does not maintain the kind of external chronologies your model seems to require to force a community's hand?

  4.  **Question:** A common objection to threshold models is the problem of the "sharp boundary." Why must the three conditions—ritual detachment, archival contradiction, and shift to residue—converge *simultaneously*? Is there no theoretical space for a narrative to exist in a zone of "proto-history," partially detached from ritual while still absorbing contradictions without collapsing?

      **Follow-up:** Consider modern national myths, such as the American Founding, which seem to oscillate between sacred charter and secular historical residue depending on the political climate. Does your model allow for a frame to re-stabilize after collapse, or is the transition from legend to history strictly unidirectional?

  5.  **Question:** You emphasize that maintaining communities can often absorb contradiction through reinterpretation rather than allowing a frame to collapse. Given this flexibility, what specific kind of finding or social change would genuinely disconfirm your model itself, rather than simply being absorbed as another instance of successful reinterpretation?

      **Follow-up:** If the absence of collapse is always attributable to successful reinterpretation, and the presence of collapse is attributed to the three conditions, is there any empirical scenario where the model would predict a collapse that the community successfully prevents, thereby testing the necessity of your three conditions?
