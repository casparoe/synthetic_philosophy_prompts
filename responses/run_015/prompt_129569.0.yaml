  Since I retired from a physics lab I've been trying to learn philosophy, and right now I'm stuck on that debate about the policemen in Reserve Police Battalion 101 — Browning saying they were ordinary men pushed by situation, Goldhagen saying they were willing executioners driven by culture and character. I was talking with my freind about it and realised I don't actually feel the pull of either side, I just understand the arguments. So I want to run a workshop for 8 people, 90 minutes, mostly grad students from various fields, where they physically run into the problem themselves before anyone names Browning or Goldhagen.

  Can you design an in-person game or structured role-play — no screens, small stakes like points or social comfort — that puts them in a fictional "clearance office" with triadic dilution: each decision passes through three linked roles (Clerk, Relay, Authoriser) so responsibility is split unevenly and nobody holds the whole thing. They should face micro-choices about stamping, delaying, or tearing up a directive, with payoffs tied to group cohesion versus individual score, and the rules should be arranged so participants first experience the situation explanation when they're inside the chain, then the character explanation when they watch a peer break it, without being told which is which. Include specific roles, a timeline for the 90 minutes, the payoff scheme (no real money), a debrief that maps exactly which moments in the game correspond to situational pressure vs character attribution, and an honest admission of which feature of the historical debate — maybe the long-term ideological socialisation — the activity simply can't reproduce. Also tell me what will predictably go wrong the first run, like people gaming the points or getting too emotionally involved, and please don't ask them to read texts during the session or include a bibliography.

  Please don't ask them to read texts during the session and don't include a bibliography or citation list. At the very end, put your one-sentence summary of the activity's core mechanism on a line that starts with Verdict:
