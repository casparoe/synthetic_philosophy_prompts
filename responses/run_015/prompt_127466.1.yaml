answer: |-
  ### Brainstorming the Logical Space

  To construct this taxonomy, we must map the intersection of **metaphysics** (who is the patient?) and **normative ethics** (whose wishes count?). The core tension is between *precedent autonomy* (the past self's right to rule) and *current well-being* (the present self's experience).

  1.  **Identity Dimension:** Does severe cognitive decline (e.g., advanced dementia) kill the person while the body lives?
      *   *Fracture:* The later self is a different entity.
      *   *Obscuration:* The later self is the same person, but damaged.
  2.  **Authority Dimension:** If the self is the same, why does the past self rule?
      *   *Contractual:* The directive is a binding promise/will.
      *   *Narrative:* The directive protects the coherence of a life story.
      *   *Epistemic:* The past self understood the values better than the impaired present self.
  3.  **Content vs. Procedure:** Do we follow the directive because it was *signed* (procedure) or because it protects *critical interests* (content)?
  4.  **Unoccupied Space:** It is logically possible to claim Identity Fracture (different person) but retain Authority (past self binds new self). This is rarely occupied because authority usually hinges on identity; if the person is gone, their moral power typically dissolves unless reduced to property law.
  5.  **Indistinguishable Leaves:** *Precedent Autonomy* (Contractual) and *Narrative Unity* often yield the same clinical outcome (follow the directive), differing only in theoretical justification.

  ***

  ### Decision Tree: Authority Across Cognitive Change

  **ROOT NODE:** Does the earlier self retain authority over the later self after severe cognitive change?

  *   **BRANCH 1: YES (Authority Retained)**
      *   **NODE 1.1:** What is the source of this authority?
          *   **PATH A: Contractual Autonomy (Procedure-Focused)**
              *   *Case:* A signed legal directive refusing feeding tubes, regardless of current happiness.
              *   **LEAF 1.1.A: Precedent Autonomy**
                  *   *Awkward Commitment:* Requires clinicians to override a currently content patient's non-verbal pleas to live based solely on a past signature.
          *   **PATH B: Narrative Continuity (Identity-Obscuring)**
              *   *Case:* Dementia with retained emotional continuity, but loss of complex reasoning.
              *   **LEAF 1.1.B: Narrative Unity**
                  *   *Awkward Commitment:* Forces us to treat the patient's current smiles as "inauthentic" noise obscuring the true life story.
          *   **PATH C: Epistemic Deference (Reasoning-Focused)**
              *   *Case:* A former philosopher with dementia who now prefers simple pleasures over intellectual legacy.
              *   **LEAF 1.1.C: Value Realism**
                  *   *Awkward Commitment:* Assumes values are objective facts known by the past self, denying the later self's right to evolve even if mildly impaired.

  *   **BRANCH 2: NO (Authority Denied)**
      *   **NODE 2.1:** Why is authority denied?
          *   **PATH A: Identity Fracture (Metaphysical Break)**
              *   *Case:* Total personality replacement; the later self remembers nothing and cares for no one the earlier self loved.
              *   **LEAF 2.1.A: Psychological Discontinuity**
                  *   *Awkward Commitment:* Justifies ignoring prior wishes solely because the "person" died, even if the living body suffers without care.
          *   **PATH B: Presentist Priority (Current Will Trumps)**
              *   *Case:* A patient currently expressing a will to live, contradicting a prior refusal of care.
              *   **NODE 2.1.B:** Does the directive's content matter more than its procedure?
                  *   **YES (Content Matters):**
                      *   **LEAF 2.1.B.1: Current Interest Standard**
                          *   *Awkward Commitment:* Allows a transient suicidal impulse in dementia to override a lifetime of religious conviction.
                  *   **NO (Procedure Matters):**
                      *   **LEAF 2.1.B.2: [UNOCCUPIED]**
                          *   *Diagnosis:* **Incoherent.** One cannot deny authority (No) while claiming procedural validity matters; if procedure mattered, authority would be retained.

  ***

  ### Analysis of Logical Space

  **1. Unoccupied Answer-Combination**
  *   **Combination:** **Identity Fracture + Authority Retained.**
  *   **Location:** Implicitly excluded between Branch 2.1 (Identity Fracture) and Branch 1 (Authority Retained).
  *   **Diagnosis:** **Unattractive/Incoherent.** If one claims the later self is a *different person* (Identity Fracture), it is logically inconsistent to grant the *earlier person* moral authority over them, unless reducing the body to property. Most ethicists who claim fracture also deny authority (Leaf 2.1.A).

  **2. Indistinguishable Leaves**
  *   **Flagged Leaves:** **Leaf 1.1.A (Precedent Autonomy)** and **Leaf 1.1.B (Narrative Unity)**.
  *   **Reason:** In a clinical emergency involving severe dementia, both positions prescribe the exact same action: **follow the advance directive.** The tree cannot distinguish them operationally because the difference lies entirely in the *metaphysical justification* (promise vs. life story), not the *outcome* for the patient.

  **3. Epistemic Deference Framing**
  *   **Injected at Leaf 1.1.C.** This framing shifts the debate from "Who is the boss?" (Authority) to "Who knows best?" (Epistemology). It suggests the later self should defer not because they are bound by law, but because the earlier self had superior cognitive access to the patient's true values.
