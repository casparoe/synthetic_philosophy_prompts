prompt: |-
  I chair the risk committee of a company developing a reusable orbital launch vehicle, and we're about to make a go/no-go decision on the first flight of the new vehicle. The board is split, and I want the committee's written opinion to be clear about which decision-theoretic framework we're actually using before we vote. The expected-value case is strong: the flight has about a 97% chance of success, which would certify the vehicle and unlock a backlog of launches worth roughly two billion dollars in present value. The remaining 3% breaks down into a 2% chance of a partial loss (around fifty million dollars) and a 1% chance of a catastrophic failure in which the vehicle comes down in a way that causes a major ground accident and triggers a multi-year regulatory shutdown, with direct costs on the order of half a billion dollars and reputational damage we can't easily price.

  Computed with the board's own utility function — which is concave, so it already encodes risk aversion in the von Neumann–Morgenstern sense — the expected value of the flight is comfortably positive, and the "go" camp points to this. The "no-go" camp, however, is leaning on a consultant we've retained, who is urging us to adopt a risk-weighted expected utility rule for this particular decision. Specifically, she proposes that we evaluate the flight not by plain expected utility but by a rule that discounts the tail of the outcome distribution — she suggests a conditional value-at-risk threshold at the fifth percentile — and she argues that under such a rule the flight fails. Her central worry is that 1% catastrophic scenario. I've been reading a fair amount of the decision-theory literature on this (I've gone back and forth on it with a colleague who's an actuary), and the subtlety I keep getting asked about is this: the board's utility function is already concave, so it already does some of the work of risk aversion. Is the consultant's risk-weighting a legitimate additional consideration, or is it double-counting risk that the concave utility has already captured? And if it is legitimate, where is the principled line between "the utility function does its job" and "we need a separate tail-risk rule"?

  Please draft the short written opinion I'll circulate before the vote. It should recommend a concrete course of action — go, no-go, or go with specific named mitigations — with a time frame, and it should engage the consultant's position seriously rather than just restating the expected-value calculation. I'd also like it to say something honest about the strongest consideration on the losing side, because I expect the board to push back either way.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Risk Committee.
      *   **Context:** Company developing a reusable orbital launch vehicle. Decision: Go/No-Go on first flight.
      *   **Situation:** Board is split. Need a clear written opinion on the decision-theoretic framework before voting.
      *   **Data:**
          *   Success (97%): +$2B PV.
          *   Partial Loss (2%): -$50M.
          *   Catastrophic Failure (1%): -$500M + Regulatory Shutdown + Unquantifiable Reputational Damage.
          *   Board Utility: Concave (risk-averse in vN-M sense).
          *   Expected Value (EU): Comfortably positive.
          *   Consultant's Proposal: Risk-Weighted Expected Utility (RWEU) / Conditional Value-at-Risk (CVaR) at 5th percentile. Under this, the flight fails.
      *   **Core Question:** Is the consultant's risk-weighting legitimate, or does it double-count risk already captured by the concave utility function? Where is the line?
      *   **Requirements:**
          *   Recommend a concrete course of action (Go, No-Go, or Go with Mitigations + Timeframe).
          *   Engage seriously with the consultant's position (don't just dismiss it).
          *   Acknowledge the strongest consideration of the losing side.
          *   Tone: Professional, decisive, theoretically sound, suitable for a Board of Directors.

  2.  **Deconstruct the Decision-Theoretic Conflict:**
      *   *Standard Expected Utility (EU):* $E[U(x)]$. Risk aversion is handled by the curvature of $U$. If $U$ is concave, bad outcomes hurt more than good outcomes help.
      *   *Risk-Weighted Expected Utility (RWEU) / Buchak's Framework:* $E_R[U(x)]$. This weights the *probabilities* based on their rank. It captures "global" risk attitudes separate from "local" risk attitudes (utility over outcomes).
      *   *The Double-Counting Charge:* If $U$ is already concave, does adding a risk function $R$ double-count?
          *   *Theory:* No, not necessarily. vN-M utility captures attitude toward *wealth/outcomes*. RWEU captures attitude toward *gamble structure* (preference for certainty vs. spread). However, in corporate governance, "risk" often implies survival constraints, not just preference.
      *   *The Real Issue:* The 1% tail isn't just a financial loss; it's an existential/regulatory threat. The $500M + Shutdown + Reputation might actually exceed the capacity of the utility function to model accurately if the shutdown implies insolvency or permanent loss of license.
      *   *Consultant's CVaR:* This is a risk *measure*, not necessarily a utility function. It focuses on the average of the worst losses. It's a constraint, not just an objective.
      *   *Resolution:* The utility function captures *preference* over money. The CVaR/Risk-Weighting captures *survival constraints* and *regulatory reality*. The "double counting" argument holds if we are talking purely about financial preference. It fails if we are talking about solvency or license-to-operate constraints. The 1% event isn't just a "bad outcome"; it's a "game over" or "multi-year pause" scenario that might violate covenants or regulatory safety cases regardless of the board's risk appetite.

  3.  **Formulate the Recommendation:**
      *   *Pure Go:* Ignores the legitimate tail risk concern. Dangerous given the regulatory environment.
      *   *Pure No-Go:* Ignores the massive upside and the fact that 97% success is statistically very strong for a first flight. Stifles innovation.
      *   *Go with Mitigations:* This is the pragmatic engineering/risk management solution. Reduce the probability or impact of the 1% tail.
      *   *Specific Mitigations:* Flight termination system upgrades, trajectory shaping to avoid populated areas, insurance/financial reserves for the tail event, regulatory pre-engagement.
      *   *Timeframe:* Delay by X weeks/months to implement mitigations.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** State the recommendation clearly (Go with Mitigations).
      *   **The Framework Question (The Core):** Address the vN-M vs. RWEU/CVaR debate.
          *   Acknowledge the concave utility handles *financial* risk aversion.
          *   Argue that the consultant's CVaR addresses *survival/regulatory* constraints, which are distinct from preference. It's not double-counting; it's layering a constraint on top of an objective.
          *   However, reject a hard "No-Go" based solely on CVaR if mitigations can move the tail.
      *   **The Decision:** Go, but conditional.
      *   **Mitigations:** Specific technical/financial steps.
      *   **Acknowledging the Dissent:** Validate the "No-Go" camp's concern about the unquantifiable reputational/regulatory damage.
      *   **Timeline:** Specific delay.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to be careful not to get too bogged down in academic decision theory (Buchak vs. Savage). Keep it applicable to corporate governance.
      *   *Key Distinction:* Utility = "How much do we dislike losing money?" Risk Measure = "Can we survive the worst case?"
      *   *The "Double Counting" Rebuttal:* It is double-counting *if* the utility function perfectly captures the cost of the regulatory shutdown. But the prompt says reputational damage "we can't easily price." This implies the utility function is *incomplete*. Therefore, the CVaR acts as a proxy for the unpriced tail.
      *   *Recommendation:* "Go with Mitigations" is the most responsible chair position. It respects the EV but respects the tail.
      *   *Tone:* Needs to be authoritative but collaborative.

  6.  **Final Polish:**
      *   Check constraints: Short written opinion. Concrete course of action. Time frame. Engage consultant. Acknowledge losing side.
      *   Ensure the distinction between *risk preference* (utility) and *risk constraint* (CVaR) is clear.

  7.  **Final Output Generation:** (Drafting the memo based on the above thoughts.)
      *   *Subject:* Risk Committee Opinion on Vehicle 1 Flight Authorization.
      *   *Opening:* Context.
      *   *Theory:* Address the double-counting question directly.
      *   *Recommendation:* Go with specific mitigations.
      *   *Dissent:* Acknowledge the existential risk.
      *   *Closing:* Vote request.

  *(Self-Correction during drafting)*: Make sure I explicitly mention the 5th percentile/CVaR issue. The consultant wants CVaR(5%). The 1% event is inside that 5%. The 2% partial loss is also inside. So the CVaR sees the average of the worst 5%. If that average is too low, it triggers the stop. I need to argue that mitigations should aim to reduce the *probability* of the 1% or the *impact* so that the CVaR passes, or argue that the CVaR threshold needs to be viewed as a constraint to be managed, not a hard veto if mitigations exist. Actually, the best path is to say: "We accept the CVaR logic as a constraint on *unmitigated* risk, but we can mitigate."

  Let's refine the "Double Counting" argument.
  *   Argument: Concave Utility = Diminishing marginal utility of wealth.
  *   Argument: CVaR = Concern with the *dispersion* of outcomes independent of wealth utility (or a constraint on solvency).
  *   Verdict: It is *not* double counting if the utility function fails to capture the non-linear discontinuity of a regulatory shutdown (i.e., the company ceases to exist). The utility function assumes continuity. The shutdown is a discontinuity.
  *   Okay, that's a strong theoretical point to include.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** Chair, Risk Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Risk Committee Opinion on Vehicle 1 Flight Authorization

  **Executive Summary**
  The Risk Committee recommends a **conditional GO**, contingent upon the implementation of specific tail-risk mitigations within a **six-week delay window**. We authorize the flight only if the probability of the catastrophic failure mode is reduced from 1% to below 0.5%, or if the financial exposure to that specific tail event is fully collateralized.

  **Decision-Theoretic Framework**
  The Board's current impasse stems from a disagreement on how to model risk. The "Go" camp relies on Expected Utility (EU) with a concave utility function. The "No-Go" camp, supported by our external consultant, advocates for a Risk-Weighted Expected Utility (RWEU) approach, specifically utilizing a Conditional Value-at-Risk (CVaR) constraint at the 5th percentile.

  The Committee has addressed the concern that applying CVaR on top of a concave utility function constitutes "double-counting" risk aversion. Our determination is as follows:

  1.  **Utility vs. Constraint:** A concave utility function correctly models *preference* over wealth (diminishing marginal utility). It answers, "How much do we dislike losing $500M compared to gaining $2B?" However, it assumes the entity survives to enjoy the utility.
  2.  **The Discontinuity Problem:** The 1% catastrophic scenario involves a regulatory shutdown and reputational damage that is not easily priced. This suggests a discontinuity in the utility function—a "cliff edge" where the company's license to operate or solvency is threatened. A standard concave utility function often smooths over these existential discontinuities.
  3.  **Legitimacy of CVaR:** Therefore, the consultant's CVaR proposal is not double-counting *preference*; it is imposing a *survival constraint*. It asks, "In the worst 5% of cases, is the average outcome compatible with continued operation?" This is a legitimate governance layer distinct from the board's risk appetite for wealth fluctuations.

  **Recommendation and Mitigations**
  While we accept the consultant's logic that the *current* risk profile fails a strict 5th-percentile test, we reject a permanent No-Go. The 97% success probability represents a statistically robust engineering position, and the opportunity cost of indefinite delay is unsustainable.

  To reconcile the positive Expected Value with the legitimate tail-risk concerns, we recommend a **six-week launch hold** to execute the following:

  1.  **Trajectory Shaping:** Modify the ascent profile to minimize overflight of populated areas, directly reducing the probability of ground accident liability in the failure mode.
  2.  **Financial Ring-Fencing:** Secure contingent capital or specific insurance instrumentation that covers the $500M direct cost of the catastrophic scenario, ensuring the CVaR impact does not threaten solvency.
  3.  **Regulatory Pre-Alignment:** Formalize a contingency plan with the FAA/AST prior to launch to define the precise path to recertification in the event of an anomaly, reducing the "unpriced" uncertainty of the shutdown duration.

  **Acknowledgment of Dissent**
  We acknowledge the strength of the "No-Go" argument. Even with mitigations, the 1% tail event carries unquantifiable reputational risk that could alter our market position permanently, regardless of financial solvency. If the Board believes that *any* probability of a ground casualty is incompatible with our long-term license to operate, regardless of financial hedging, then the only consistent decision is No-Go. The Committee respects this view but believes the proposed mitigations reduce the tail risk to a level consistent with industry standards for first-flight vehicles.

  **Action Required**
  We request the Board vote on the **Conditional GO** as specified. If the mitigations are not verified by the Risk Committee within six weeks, the authorization automatically converts to a **No-Go**.

  Respectfully,

  [Your Name]
  Chair, Risk Committee
