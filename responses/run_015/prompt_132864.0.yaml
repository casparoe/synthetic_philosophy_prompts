  ### Logical Space & Test Evaluation

  You asked to build from the logical space, not a list of names. Here is the map of the territory we are covering. We are sorting students based on two axes: **Source of Obligation** (Why follow the rule?) and **Scope of Obligation** (Who must follow it?).

  **The Separator Questions (The "Workhorses"):**
  1.  **The Double-Standard Check (Jaywalking):** If locals break the rule safely, does the rule disappear?
      *   *Splits:* Skeptics/Prudentialists (Yes, it disappears) vs. Obligation Views (No, it remains).
  2.  **The Host-Cost Test (Tipping):** Is the obligation about *money owed* or *politeness*?
      *   *Splits:* Economic Reliance (It's wages) vs. Guest/Expressivist (It's respect).
  3.  **The Mirror Test (Rigged Queue):** If the local system is unfair, do you play fair or play to win?
      *   *Splits:* Universalism (Fairness is global) vs. Guest Ethic (Respect local flow).

  **Evaluation of Your "Half-Baked Tests":**
  *   **Host-Cost:** **Keep.** This is your strongest separator. It distinguishes "tipping is a tip" from "tipping is a wage."
  *   **Double-Standard:** **Keep.** Essential for separating Skeptics from everyone else.
  *   **Short-Timer:** **Keep as a tie-breaker.** It tests if reciprocity is required for obligation.
  *   **Mirror:** **Keep.** Best way to find the Universalists.
  *   **Money Asymmetry:** **Garbage as a separator.** Teens don't have enough data on local economics to answer this consistently. Use it as a discussion prompt later, not a quiz node.
  *   **Kid-Seeing-You:** **Keep.** This is the only way to isolate Expressivism (signaling) from Consequentialism (harm).

  **The Leaves (Positions):**
  1.  **Pure Coordination:** Rules are just traffic management. Break if efficient.
  2.  **Skeptic:** Rules are made up. No obligation exists.
  3.  **Economic Reliance:** Tipping is wages. Breaking it steals labor.
  4.  **Guest Ethic:** You are a visitor. Respect the host's script, even if flawed.
  5.  **Universalism:** Justice is the same everywhere. Don't bribe, even if locals do.
  6.  **Expressivism:** Actions teach. Don't jaywalk because it signals "rules don't matter" to kids.
  7.  **Mixed/Confused:** (Unnamed) Inconsistent answers.

