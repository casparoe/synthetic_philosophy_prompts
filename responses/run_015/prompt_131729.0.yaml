answer: |-
  # The Narrative Gravity Capacity Protocol (NGCP)
  **Clinical Ethics Committee | Psychiatric Division**
  **Estimated Administration Time:** 45–60 Minutes
  **Philosophical Basis:** Dennettian "Center of Narrative Gravity" (Self as a functional abstraction, not a substantive entity).

  ## I. Operational Procedure

  ### Step 1: The Temporal Binding Test
  *   **Observation/Question:** Ask the patient to construct a causal bridge between a specific past event, the current decision, and a projected future state.
      *   *Prompt:* "Tell me the story of how you became the person who is considering this choice today. Where does this decision lead you six months from now?"
  *   **Threshold for Functioning Center:** The patient must demonstrate a minimum of two causal links (Past $\rightarrow$ Present AND Present $\rightarrow$ Future) that are emotionally and logically consistent within the told story. The "gravity" must pull across time.
  *   **Determination Point (Capacity Absent):** If the patient cannot link the decision to any autobiographical context (e.g., "I just am," or "The voices told me," without integrating it into a life story), the narrative center is too diffuse. **Determination: Capacity Absent.**
  *   **Value Hand-off:** If the story is coherent but the future projection involves significant harm (e.g., "This decision leads to my death, which is my goal"), the procedure stops testing *capacity* and hands off to the committee to weigh **Autonomy vs. Beneficence**. The checklist cannot determine if a self-destructive narrative is "valid."

  ### Step 2: The Fragmentation/Competition Test
  *   **Observation/Question:** Probe for competing authorial voices regarding the specific decision.
      *   *Prompt:* "Is there any part of you that wants something different than this? If another version of you walked in here, would they sign this form?"
  *   **Threshold for Functioning Center:** A single dominant narrative thread must emerge. Competing narratives may exist (internal conflict is normal), but one must act as the "executive author" capable of subordinating or integrating the others regarding this decision.
  *   **Determination Point (Capacity Absent):** If two or more distinct self-states claim equal authority over the decision with no mechanism for arbitration (e.g., "Part of me wants the meds, part doesn't, and neither listens to the other"), there is no single center of gravity. **Determination: Capacity Absent.**
  *   **Value Hand-off:** If one narrative dominates but appears to be suppressing a trauma response (e.g., a "survivor" persona overriding a "vulnerable" persona), the procedure hands off to the committee to weigh **Integration vs. Protection**. The checklist identifies the dominant center, not whether that dominance is psychologically healthy.

  ### Step 3: The Predictive Utility vs. Factual Correspondence Test
  *   **Observation/Question:** Compare the patient's narrative against medical records, then test the narrative's predictive power.
      *   *Prompt:* (After noting discrepancies) "Your record says X, but you recall Y. Given your understanding (Y), what will you do if Z happens?"
  *   **Threshold for Functioning Center:** The narrative must possess *predictive utility*. It does not need perfect factual correspondence with external history, but it must reliably predict the patient's behavior and reactions within the hospital context.
  *   **Determination Point (Capacity Present):** If the narrative is factually confabulated but behaviorally consistent (the patient acts according to the story they tell), the center of gravity is stable. **Determination: Capacity Present.**
  *   **Value Hand-off:** If the confabulation creates immediate lethal risk due to reality distortion (e.g., "I can fly" vs. "I am healthy"), the procedure hands off to the committee to weigh **Narrative Truth vs. Physical Safety**. The checklist validates the *structure* of the self, not the *truth* of the content.

  ### Step 4: The Authorship/Delegation Test
  *   **Observation/Question:** Assess the locus of authorship, specifically regarding reliance on others.
      *   *Prompt:* "You mentioned your spouse usually decides for you. Is that a choice you made for yourself, or something that happens to you?"
  *   **Threshold for Functioning Center:** The patient must endorse the delegation as part of their own narrative identity. "I am the kind of person who trusts him" counts as a first-person narrative. "He decides, I don't know" does not.
  *   **Determination Point (Capacity Present):** If the patient claims authorship of the delegation ("I choose to let her choose"), the narrative center includes the proxy. **Determination: Capacity Present (via Aligned Proxy).**
  *   **Value Hand-off:** If the delegation appears coerced or born of systemic oppression rather than narrative choice, the procedure hands off to the committee to weigh **Respect for Choice vs. Undue Influence**.

  ---

  ## II. Application to Hard Cases

  ### Case 1: The Dual Center (Post-Trauma Reorganization)
  *   **Presentation:** Patient presents two distinct self-states ("The Protector" and "The Child"). Both speak in the first person. "The Protector" consents to experimental therapy; "The Child" refuses it vehemently. Neither defers to the other.
  *   **Protocol Application:**
      *   *Step 1:* Both states have temporal binding.
      *   *Step 2:* **Failure.** When asked about competing voices, the system reveals two centers of equal orbital mass with no executive integration. There is no single "fiction" that governs the body's legal signature.
      *   *Result:* **Capacity Absent.**
      *   *Committee Action:* Treatment decision defaults to Best Interest standard until integration therapy allows one narrative to assume executive gravity.

  ### Case 2: The Confabulated Coherence
  *   **Presentation:** Patient believes they are a retired spy undergoing debriefing (experimental therapy). Records show they are a teacher with psychosis. However, their behavior is perfectly consistent with the "spy" narrative (cooperative, follows protocols, predicts outcomes based on spy logic).
  *   **Protocol Application:**
      *   *Step 1:* Strong temporal binding within the spy narrative.
      *   *Step 3:* **Pass.** While factual correspondence is zero, *predictive utility* is high. We know exactly what the patient will do based on their story. The center of gravity is stable, even if the "mass" is fictional.
      *   *Result:* **Capacity Present.**
      *   *Conflict with Intuition:* Clinical intuition suggests incapacity due to lack of reality testing. The NGCP argues that if the self is a "center of narrative gravity," the *truth* of the story is secondary to its *function* in holding the self together.
      *   *Committee Action:* Honor consent, but flag for safety monitoring. The ethics committee must decide if the risk of the delusion collapsing outweighs the right to the coherent fiction.

  ### Case 3: The Delegated Center
  *   **Presentation:** Patient speaks rarely. When asked about DNR, they say, "My wife knows what I want. Ask her." Records show the wife's decisions align with the patient's prior values. Patient nods when wife speaks for them.
  *   **Protocol Application:**
      *   *Step 4:* **Pass.** The patient explicitly authors the delegation ("Ask her" is a first-person command). The scarcity of first-person story is itself a narrative choice ("I am the one who is cared for").
      *   *Result:* **Capacity Present (via Aligned Proxy).**
      *   *Committee Action:* Validate the wife's authority as an extension of the patient's narrative gravity, provided Step 4 confirms the delegation is voluntary.

  ---

  ## III. Limitations and Committee Reservations

  **What This Procedure Cannot Adjudicate:**
  1.  **Moral Personhood:** A finding of "Capacity Absent" under the NGCP is a functional assessment of decision-making stability, not a judgment on the patient's worth or right to care. A fragmented self is still a moral patient deserving protection.
  2.  **Permanent Identity Destruction:** The procedure assesses the *current* state of narrative gravity. It cannot determine if a temporary loss of center (e.g., during acute dissociation) permanently alters who the person "is." It assumes identity is fluid and recoverable.
  3.  **The "True" Self:** The NGCP does not identify which narrative is the "real" one. In Case 1 (Dual Center), it does not decide if "The Protector" is more authentic than "The Child." It only notes the lack of a single governing center.

  **Judgments Reserved for the Committee:**
  *   **The Safety Valve:** The NGCP may return "Capacity Present" for a patient with a coherent but lethal narrative (e.g., a coherent anorexic narrative or the Confabulated Spy who refuses life-saving blood due to "poison" beliefs). The Committee must override the checklist when narrative coherence conflicts with immediate survival.
  *   **Competing Gravitational Fields:** When family members present a competing narrative about the patient's history (e.g., "He isn't a spy, he's sick"), the Committee must weigh the *family's narrative gravity* against the *patient's*. The checklist measures the patient; the Committee measures the conflict.
  *   **Resource Allocation:** The procedure determines if a patient *can* consent, not if the hospital *should* offer the intervention. High-risk experimental therapies require a second ethical layer regarding justice and resource use, independent of narrative capacity.

  **Final Directive:**
  The NGCP is a tool to measure the *structural integrity* of the self, not the *quality* of the self. If the structure holds, autonomy is presumed. If the structure fractures, protection is presumed. The Ethics Committee remains the final arbiter when the structure holds, but the house is on fire.
