      *   *Case Application:* Ensure I explicitly walk through the three cases using the protocol steps.
      *   *Philosophical Nuance:* Ensure I don't treat the "Center of Narrative Gravity" as a physical thing. It's about the *pull* of the story.

      *(Self-Correction on Case 2)*: If a patient confabulates but is coherent, standard capacity tests might pass them on understanding/reasoning. But if the facts are wrong, appreciation is usually failed. However, under *Narrative Gravity*, if the fiction holds the self together and predicts behavior, it might be sufficient *unless* the factual error is lethal. I need to be careful here. The prompt asks for a procedure based on *narrative gravity*, not standard MacCAT. So, if the narrative holds, capacity is present, even if facts are wrong. This is the "conflict with clinical intuition" part. Clinicians want reality testing; this model wants narrative cohesion. I will lean into that tension.

      *(Self-Correction on Case 3)*: Delegated center. If I say "My wife decides," is that *my* narrative? Yes, if I endorse it. If I am mute and she decides, that's different. The prompt says "first-person stories are scarce but third-person predictions remain highly accurate." This implies the patient assents to the spouse's narrative.

      *(Self-Correction on Case 1)*: Two competing centers. If they switch rapidly, no gravity. If they coexist and disagree on the consent, no single gravity. Capacity Absent.

      *Limitations:* Must explicitly state that this doesn't solve the "Best Interest" standard, only the "Autonomy" gate.

