prompt: |-
  You serve on the clinical ethics committee of a psychiatric hospital that evaluates decision-making capacity in adults with severe dissociative and identity-fragmentation presentations. Rather than relying solely on standard cognitive tests, your unit has adopted the philosophical framework that a self is not a substance but a center of narrative gravity — a focal point around which autobiographical stories orbit, attract other narratives, and generate predictions about behavior. You need a reusable decision procedure your committee can run in under an hour to determine whether a given patient possesses a sufficiently stable narrative center to provide informed consent for a high-risk intervention, such as discontinuing a long-term medication, enrolling in an experimental therapy, or authorizing a do-not-resuscitate order.

  Write the procedure as an ordered sequence of operational tests, with the following structure: first, the specific observation or interview question that probes narrative gravity; second, the threshold that distinguishes a functioning center from absence or fragmentation; third, the point at which the procedure yields a definite capacity-absent or capacity-present determination; and fourth, the explicit hand-off points where the question is no longer about narrative coherence but about values — for example, whether a coherent but self-destructive narrative should be honored, or whether family members' competing gravitational narratives should be weighted. The procedure must handle three hard cases: a patient whose autobiographical narratives reorganized radically after trauma and now present two competing centers with roughly equal orbital mass; a patient with an extremely coherent but largely confabulated narrative that successfully predicts behavior but lacks correspondence with documented history; and a patient whose narrative center is stable but almost entirely delegated to a spouse or caregiver, so that first-person stories are scarce but third-person predictions remain highly accurate. Apply the procedure to all three cases, including one where the procedure returns an answer that conflicts with the clinical intuition that the patient seems like themselves. Finally, state clearly what the procedure cannot adjudicate — for instance, whether narrative gravity is sufficient for moral personhood, or whether a temporary loss of center permanently destroys identity — and flag the judgments that must remain with the committee rather than the checklist.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Member of a clinical ethics committee in a psychiatric hospital.
      *   **Context:** Evaluating decision-making capacity in adults with severe dissociative/identity-fragmentation presentations.
      *   **Framework:** "Self as a center of narrative gravity" (Dennettian/philosophical approach) rather than standard cognitive tests (MacArthur Competence Assessment Tool, etc., though those inform the background).
      *   **Task:** Create a reusable decision procedure (checklist/algorithm) runnable in under an hour.
      *   **Structure:**
          1.  Observation/Question (probing narrative gravity).
          2.  Threshold (functioning center vs. fragmentation).
          3.  Determination Point (Capacity Absent/Present).
          4.  Hand-off Points (where narrative coherence ends and values/ethics begin).
      *   **Hard Cases to Address:**
          1.  *Dual Centers:* Post-trauma reorganization with two competing narratives of equal weight.
          2.  *Confabulated Coherence:* Highly coherent narrative that predicts behavior but contradicts documented history.
          3.  *Delegated Center:* Stable center delegated to a spouse/caregiver (scarce first-person, accurate third-person).
      *   **Requirement:** Apply the procedure to all three cases (including one where the result conflicts with clinical intuition).
      *   **Limitations:** State what the procedure *cannot* adjudicate (moral personhood, permanent identity destruction, etc.) and flag judgments reserved for the committee.

  2.  **Deconstruct the Philosophical Framework:**
      *   *Center of Narrative Gravity:* The self isn't a thing inside the head; it's a fictional center of gravity created by the stories we tell and are told about us. It's an abstraction that helps predict behavior.
      *   *Capacity in this context:* Does the patient have a *stable enough* center to author a decision that fits within their ongoing narrative trajectory? If the center is too fragmented, there is no "one" to consent. If the center is rigid but false (confabulation), does it matter if it functions? If the center is outsourced, is it still *their* gravity?

  3.  **Drafting the Procedure (The "Narrative Gravity Capacity Protocol" - NGCP):**
      *   *Time Limit:* Under 1 hour. Needs to be efficient.
      *   *Step 1: Continuity & Integration.* Can they link past, present, and future?
      *   *Step 2: Agency & Authorship.* Do they feel they are writing the story?
      *   *Step 3: Predictive Utility.* Does the story help us know what they will do next?
      *   *Step 4: The Hand-off.* When do we stop testing capacity and start debating values?

      *Refining the Steps for the Prompt's Requirements:*
      *   Need specific observations/questions.
      *   Need thresholds.
      *   Need determination points.
      *   Need hand-off points.

      *Drafting Step 1 (Temporal Binding):* Ask about the connection between the decision and their life story.
      *   *Threshold:* Can they articulate *why* this decision fits their story without major gaps?
      *   *Determination:* If they cannot link the decision to any past/future state, Capacity Absent.
      *   *Hand-off:* If the story is coherent but the values are harmful.

      *Drafting Step 2 (Fragmentation/Dissociation):* Ask about conflicting self-states.
      *   *Threshold:* Is there a dominant narrative thread, even if others exist?
      *   *Determination:* If two distinct centers claim authority over the *same* decision with no arbitration mechanism, Capacity Absent.
      *   *Hand-off:* If one center is dominant but the other is suppressed (values issue).

      *Drafting Step 3 (External Validation/Confabulation):* Compare narrative to records.
      *   *Threshold:* Does the narrative function predictively, even if factually loose? (Crucial for the confabulation case).
      *   *Determination:* If predictive utility is high, Capacity Present (even if factually wrong).
      *   *Hand-off:* If the confabulation puts them at immediate lethal risk due to reality distortion (safety vs. autonomy).

      *Drafting Step 4 (Delegated Agency):* Ask about the role of the caregiver.
      *   *Threshold:* Do they endorse the delegation as part of *their* story?
      *   *Determination:* If they affirm the delegation ("I trust him to decide"), Capacity Present (via proxy alignment).
      *   *Hand-off:* If the delegation is coerced.

      *Consolidating into a linear flow:*
      Let's make it a 4-Step Protocol.
      1.  Narrative Continuity Test.
      2.  Center Stability/Fragmentation Test.
      3.  Reality-Tracking vs. Predictive Utility Test.
      4.  Authorship/Delegation Test.

  4.  **Addressing the Hard Cases:**
      *   *Case 1 (Dual Centers):* Step 2 will flag this. If equal mass, no single center of gravity. Capacity Absent.
      *   *Case 2 (Confabulation):* Step 3. If predictive utility is high, the "fiction" is working. Capacity Present (counter-intuitive?).
      *   *Case 3 (Delegated):* Step 4. If they own the delegation, it's part of their gravity. Capacity Present.

      *Conflict with Intuition:* The Confabulation case is the best candidate. Clinicians usually want "truth." The Narrative Gravity model says "function." I need to highlight this tension.

  5.  **Addressing Limitations & Committee Judgments:**
      *   The checklist determines *capacity* (ability to consent), not *wisdom* (quality of decision).
      *   It doesn't determine moral worth.
      *   It doesn't solve disputes between family narratives vs. patient narratives (that's the ethics committee's job after the checklist).

  6.  **Refining the Tone:**
      *   Professional, clinical, yet philosophically grounded.
      *   Precise language (avoiding vague psychobabble).
      *   Structured clearly as requested.

  7.  **Review against Constraints:**
