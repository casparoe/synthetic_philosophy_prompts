      *   **Premise 2 (P2):** If we imagine a "happy saint" (maximally good *and* not miserable), there's no virtue in being *less* good. (Implies moral value is always pro tanto good, or at least not bad in itself).
      *   **Premise 3 (P3):** Inefficacy Objection. Systemic injustice means one person's maximal effort has near-zero impact. If costs are high and impact low, maximal goodness is irrational. (Consequentialist/Instrumental reasoning).
      *   **Premise 4 (P4):** Temporal/Burnout Objection. Maximizing *now* reduces lifetime output. Point-in-time maximization conflicts with integrated lifetime maximization. (Long-term consequentialist/efficiency reasoning).
      *   **Premise 5 (P5):** Moral Realism. There is a fact of the matter about P4 (and presumably the rest).

