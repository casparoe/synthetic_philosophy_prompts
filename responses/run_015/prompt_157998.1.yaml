          *   If morality is instrumentally valuable (P3), inefficacy matters. If you can't change anything, why pay the cost?
          *   *Verdict:* **Real Tension.** P2 implies moral goodness is an end; P3 implies it's a means (to fixing injustice).

      *   **Conflict 3: (1) vs. (4).** (User's specific worry).
