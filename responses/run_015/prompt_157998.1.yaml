      *   *Correction on (2):* "No virtue in being less good." If (3) is true (inefficacy), is there virtue in being maximally good? If the action does nothing, is it virtuous? Kant says yes, Mill says no. The user needs to pick a lane or hybridize. The cheapest fix is to limit (2) to *intentions/character* and (3) to *actions/impact*.

