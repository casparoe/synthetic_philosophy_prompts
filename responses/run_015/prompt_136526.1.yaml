  ### The Rule He Is Actually Running
  You have identified two competing rules that fit the past data:
  1.  **The Behavioral Rule (Yours):** Orwellian iff a response made *at the time* discriminates the pre-revision content.
  2.  **The Mechanistic Rule (Yours):** Orwellian iff the revision is central/cognitive rather than early/sensory.

  However, there is a third rule that fits the track record even better and explains *why* he chooses the Mechanistic Rule over the Behavioral one. Let's call it the **Conscious Access Rule**:
  *   **Orwellian** iff the veridical content was **consciously accessible** (entered the phenomenal field/reportable stream) at some point before being revised or denied.
  *   **Stalinesque** iff the veridical content was **never consciously accessible**, even if it was processed unconsciously (e.g., by the motor system or V1).

