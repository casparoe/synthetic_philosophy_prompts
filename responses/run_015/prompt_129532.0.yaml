answer: |-
  This taxonomy reveals that most speciesism debates stall because people are arguing past each other on whether moral status is a binary club membership or a sliding scale of capacity.

  ```text
  ROOT: Is species membership itself a direct ground for moral status?
  │
  ├── YES (Direct Ground)
  │   │
  │   ├── SPLIT: Does this status absolutely trump cross-species capacities?
  │   │   │
  │   │   ├── YES (Absolute)
  │   │   │   │
  │   │   │   ├── SPLIT: Can moral obligations run symmetrically (animal-to-human)?
  │   │   │   │   ├── YES → [INCOHERENT LEAF*]
  │   │   │   │   └── NO (One-way)
  │   │   │   │       │
  │   │   │   │       ├── SPLIT: Do ecological roles justify harming individuals?
  │   │   │   │       ├── YES → Hard Speciesism (Ecological) [INDISTINGUISHABLE**]
  │   │   │   │       └── NO → Hard Speciesism (Individualist)
  │   │   │
  │   │   └── NO (Defeasible)
  │   │       │
  │   │       ├── SPLIT: Can moral obligations run symmetrically?
  │   │       │   ├── YES → Paternalistic Speciesism
  │   │       │   └── NO (One-way)
  │   │       │       │
  │   │       │       ├── SPLIT: Do ecological roles justify harming individuals?
  │   │       │       ├── YES → Conservation Ethics (Anthropocentric)
  │   │       │       └── NO → Soft Speciesism
  │   │
  │   └── NO (Indirect Ground → Status based on capacities)
  │       │
  │       ├── SPLIT: Does moral status scale gradually with capacity?
  │       │   │
  │       │   ├── YES (Gradient)
  │       │   │   │
  │       │   │   ├── SPLIT: Can moral obligations run symmetrically?
  │       │   │   │   ├── YES → Reciprocal Gradualism (Rare)
  │       │   │   │   └── NO (One-way)
  │       │   │   │       │
  │       │   │   │       ├── SPLIT: Do ecological roles justify harming individuals?
  │       │   │   │       ├── YES → Deep Ecology (Utilitarian overlap)
  │       │   │   │       └── NO → Preference Utilitarianism
  │       │   │
  │       │   └── NO (Binary Threshold)
  │       │       │
  │       │       ├── SPLIT: Can moral obligations run symmetrically?
  │       │       │   ├── YES → Contractarianism
  │       │       │   └── NO (One-way)
  │       │       │       │
  │       │       │       ├── SPLIT: Do ecological roles justify harming individuals?
  │       │       │       ├── YES → Environmental Holism
  │       │       │       └── NO → Animal Rights View
  ```

  **Notes on Empty, Incoherent, and Indistinguishable Leaves**

  *   **[INCOHERENT LEAF*]:** Absolute Direct Membership + Full Symmetry. If species membership *always* trumps capacity, humans always win. If obligations are symmetric, animals must sometimes win against humans using the same currency. These claims cancel eachother out logically.
  *   **[INDISTINGUISHABLE**]:** Hard Speciesism (Ecological) vs. Hard Speciesism (Individualist). If humans absolutely trump animals regardless of capacity, appealing to ecological roles is redundant justification. The outcome (human interest wins) is identical, so these questions can't seperate the two positions in practice.
  *   **Empty/Unpopular:** Direct Ground + Gradient Status is missing from the tree. If status comes from membership (Human/Not), it's inherently binary. A gradient of "degree of humanity" is biologically nonsensical in this context, so that branch was pruned.
  *   **Symmetry Trap:** Most "One-way" leaves assume animals lack the agency to hold obligations. The "Yes" symmetry branches usually imply animals are moral agents (e.g., Contractarianism), which limits those positions to specific high-capacity species.
