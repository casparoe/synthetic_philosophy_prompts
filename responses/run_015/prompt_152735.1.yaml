answer: |-
  **Scenario**

  Elena is a licensed surveyor reviewing a specific dataset of laser scans taken from a fixed reference point, Benchmark Alpha, over a single week. The dataset contains a recurring 2mm discrepancy between Alpha and a secondary point, Beta. **Stage 1:** Elena is certifying property boundaries for a real estate transaction. Her practice presupposes that legal boundaries are stable relative to Alpha; thus, proposition $P$ ("Benchmark Alpha is stationary") functions as a rule of the mapping procedure. She records the 2mm discrepancy as instrument noise and certifies the lines without investigating Alpha. She is not negligent; standard surveying protocols treat Alpha as constitutive of the coordinate system. **Stage 2:** Immediately after, Elena is contracted by a geology firm to analyze the same dataset for tectonic subsidence. Her practice now requires detecting movement in Alpha; thus, $P$ is the hypothesis under test. She treats the identical 2mm discrepancy as decisive counter-evidence to $P$, flagging the benchmark as unstable. No new data has been acquired, her confidence in $P$ prior to the analysis was identical in both stages, and the content of $P$ remains unchanged.

  **Demonstration**

  **Proposition $P$:** "Benchmark Alpha is stationary."
  **Fixed Across Stages:** The subject (Elena), the total body of evidence (the scan dataset including the 2mm discrepancy), the subjective confidence level in $P$ prior to analysis, and the physical content of $P$.
  **Variable:** The constitutive role of $P$ within the operative practice (mapping vs. monitoring).

  **Three Readings**

  **(i) Hinge as Non-Belief Commitment:**
  *Stage 1:* $P$ is not a belief but a grammatical rule defining what counts as "movement" in this context. Elena does not *know* $P$; rather, $P$ makes knowledge of boundaries possible. The 2mm datum is noise because, within this game, Alpha defines stability. Doubt is logically excluded, not just improbable.
  *Stage 2:* The practice changes. $P$ is now a move within the game, not a rule. It is a genuine belief subject to truth-values. The datum counts as evidence because the rule has shifted.
  *Verdict:* Diverges at Stage 1 (no belief vs. belief), converges at Stage 2 (empirical claim).

  **(ii) Hinge as Non-Evidential Entitlement:**
  *Stage 1:* $P$ is a belief, but Elena holds it without evidence. She is *entitled* to trust $P$ because the practice collapses without it. The 2mm datum does not justify doubt because her entitlement does not depend on the balance of evidence. Ignoring the datum is epistemically permissible.
  *Stage 2:* $P$ is a standard empirical belief. Entitlement lapses; evidence is required. The datum defeats $P$.
  *Verdict:* Diverges at Stage 1 (entitlement vs. justification), converges at Stage 2 (evidence-based).

  **(iii) Reductionist (Ordinary Empirical Belief):**
  *Stage 1:* $P$ is an ordinary empirical belief known via overwhelming background evidence (e.g., geology, past stability). The 2mm datum is evidence against $P$, but it is probabilistically swamped by the prior probability of stability. Elena is rational to ignore it, but only because the evidence favors $P$ heavily.
  *Stage 2:* $P$ is an ordinary empirical belief. The prior probability changes (due to the contract context implying risk), or the weight of the datum increases relative to the query. The datum defeats $P$.
  *Verdict:* Diverges at Stage 1 (swamped evidence vs. non-evidence), converges at Stage 2 (evidence-based).

  **The Single Feature Doing the Work**

  The operative feature is the **constitutive status** of $P$ in Stage 1. In Stage 1, $P$ is not merely supported by the practice; it *defines* the practice. In Stage 2, $P$ is *described* by the practice. This distinction explains why the datum is normatively silent in Stage 1 rather than merely probabilistically weak.

  **Removal of the Feature**

  If we remove the constitutive status and treat Stage 1 as merely a high-stakes pragmatic context where $P$ is still an empirical hypothesis, the case collapses into **stubbornness**. If $P$ is just a very likely empirical claim in Stage 1, then the 2mm datum *is* counter-evidence that should lower confidence slightly. If Elena treats it as *zero* evidence (noise), she is being dogmatic, violating the reductionist's own norms of rationality. The hinge view saves her from the charge of negligence by asserting the datum lacks epistemic relevance to $P$ in that context, not just insufficient weight. Without the constitutive shift, the transition from Stage 1 to Stage 2 looks like a change in risk tolerance, not a change in epistemic status.

  **Strongest Skeptic Objection and Repair**

  **Objection:** The skeptic argues you have not isolated the epistemic status; you have merely changed the **cost of error**. In Stage 1, false positives (claiming movement) are costly for property law, so Elena pragmatically ignores the datum. In Stage 2, false negatives are costly. Thus, the datum *is* evidence in both stages, but she is pragmatically justified in disregarding it in Stage 1. You have described a change in action, not a change in the nature of $P$.

  **Repair:** The hinge theorist replies that constitutive rules are not sensitive to cost. If $P$ were merely a high-cost empirical claim, Elena should still acknowledge the datum *lowers* her confidence, even if she acts as if $P$ is true. But in Stage 1, she does not lower her confidence; she treats the datum as a mistake *in the measurement*, not in the benchmark. The datum is re-described as noise *because* $P$ is fixed. If $P$ were empirical, the datum would remain evidence of instability, however unlikely. The repair holds only if we accept that some propositions function as the "scaffolding" of inquiry rather than its "bricks."

  **Honest Note:** The distinction between "constitutive rule" and "pragmatic maxim based on extreme probability" is notoriously thin. If the skeptic insists that any rule can be modeled as a belief with probability $1 - \epsilon$, the hinge theorist must concede that the difference is not in the mental state but in the **normative immunity to revision**. The case works only if one accepts that immunity to revision can be rational without infinite evidence.
