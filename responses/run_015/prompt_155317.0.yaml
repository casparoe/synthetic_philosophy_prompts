  3.  **Translate to Mechanism Design Toolkit:**

      *   **Williams (Shame/Honor) $\rightarrow$ Coordination + Endogenous Punishment:**
          *   Think of honor as a correlated equilibrium.
          *   Punishment isn't just a fine; it's exclusion or loss of identity.
          *   The "type" isn't hidden; the *payoff structure* is common knowledge but fragile.
          *   Shift happens when the punishment threshold moves. If everyone punishes deviation, you comply. If the threshold for *who* punishes shifts, the equilibrium collapses.
          *   Key concept: Multiple equilibria. The "Honor Equilibrium" vs. the "Humanity Equilibrium." Moving between them requires a focal point shift.

      *   **Appiah (Argument/Status) $\rightarrow$ Hidden Types + Status Goods:**
