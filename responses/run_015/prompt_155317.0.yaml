      *   *Kwame Anthony Appiah:* Focuses on "honor codes" changing through argument and conversation. People care about status. When the status signal flips (e.g., owning slaves becomes tacky rather than prestigious), behavior changes. It's more about social meaning and conversation shifting the value of the signal.
      *   *Common Ground:* Both agree it wasn't just raw material interest (economic efficiency). It was about social norms.
