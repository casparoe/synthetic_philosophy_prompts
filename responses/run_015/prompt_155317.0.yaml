answer: |-
  Look, this is actually a perfect use case for the toolkit. If we strip the moral philosophy down to the structural incentives, the Williams vs. Appiah debate basically becomes a argument over whether moral revolutions are coordination failures or signaling collapses.

  Here's the restatement using our language.

  ### 1. Williams: Shame as Endogenous Punishment in a Coordination Game

  Williams is basically arguing that honor codes are **correlated equilibria** maintained by decentralized enforcement.

  Think of the dueling aristocrat or the slaveholder as an agent in a repeated coordination game. The payoff matrix isn't fixed by material goods; it's determined by the social state. In the "Honor Equilibrium," the payoff for defecting (e.g., refusing a duel, freeing a slave) is massive negative utility because of *shame*.

  In MD terms, shame isn't just a feeling; it's an **endogenous punishment threshold**. If you deviate from the norm, the community punishes you. But crucially, Williams says the punishment isn't just external (ostracism); it's internalized. The agent's utility function includes a parameter for "self-respect" that is contingent on adhering to the code.

  So, the revolution isn't about material costs rising. It's a **focal-point shift**. The society moves from Basin A (Honor) to Basin B (Humanity). The tricky part Williams highlights is that during the transition, the IC (Incentive Compatibility) constraints are violated for everyone. You have a period where the old equilibrium is broken but the new one isn't stable. The "shame" parameter has to be rewritten. It's a jump between multiple equilibria where the payoff structure itself is common knowledge but fragile. The revolution happens when the punishment threshold for *enforcing* the old norm becomes too high for the enforcers to bear.

  ### 2. Appiah: Status Goods and Hidden Types

  Appiah is closer to a **signaling game with hidden types**.

  Agents want to signal they are "high status" or "virtuous." Owning slaves or dueling are costly signals. In the initial state, these actions separate the high-types (elites) from the low-types. The IC constraint holds because the cost of the signal is lower for the high-types (or the benefit of the status is higher).

  Appiah argues that moral progress happens through **cheap talk** that updates the common prior. Abolitionists aren't changing the material cost of slavery; they're changing the *interpretation* of the signal. They make the argument that "slaveholder" actually signals "backward barbarian" rather than "civilized elite."

  This creates a **depreciation of the status good**. If the belief distribution shifts such that the signal no longer commands prestige, the return on investment for that signal falls. Once the expected status payoff drops below the material/moral cost, the separating equilibrium collapses. Everyone pools on the new behavior (abolition) because the old signal is now noise.

  For Appiah, the "argument" is the mechanism that perturbs the beliefs. It's not a focal point shift (Williams); it's a Bayesian update on the value of the signal. The hidden type isn't "moral vs. immoral," it's "in-the-know vs. out-of-touch." No one wants to be the last guy holding a depreciating asset.

  ### 3. The Residue Report

  Okay, so we've mapped it. Williams = Coordination/Equilibrium Selection. Appiah = Signaling/Belief Updating.

  **Is there residue?**
  Yeah, there's a chunk of moral recognition that doesn't fit neatly into payoff restructuring or equilibrium shifts. It's the **origin of the common prior**.

  In standard mechanism design, we take the type space and the prior distribution as exogenous. We assume agents *can* update on cheap talk if it's credible. But in moral revolutions, the "cheap talk" is initially *incredible*. It's heresy.

  *   **The Gap:** Mechanism design struggles with **endogenous preference formation**. Williams hints that the "self" changes. It's not just that the payoff for slavery went down; it's that the agent literally cannot derive utility from it anymore. Their utility function was rewritten. Standard MD assumes stable preferences over outcomes. Moral progress looks like stable preferences over *principles* that redefine the outcomes.
  *   **The "Why" of the Shift:** Appiah says conversation changes beliefs. But *why* did the conversation become credible? In a signaling model, cheap talk is non-binding. For moral arguments to work, there has to be a meta-norm that makes truth-telling or empathy a dominant strategy *before* the equilibrium shifts. MD doesn't explain where that meta-norm comes from. It treats it as a parameter.

  **Is this a gap in the theory or philosophical decoration?**

  I'd argue it's a **gap in static mechanism design**, but maybe solvable with dynamic models.

  If you treat preferences as state variables that evolve based on history (learning models), you can capture some of it. But the residue is the **normative force**. Mechanism design can explain *how* a norm spreads once it has traction (network effects, cascades). It can't explain why the first mover didn't get crushed.

  In the Williams/Appiah cases, the early abolitionists or anti-dueling advocates incurred massive costs with zero immediate status return. In a rational choice model, this is dominated. They should have waited. The fact that they didn't suggests their utility function included a term for "moral truth" that was lexicographically prior to social status.

  If you model that as just another payoff parameter, you're doing philosophical decoration—you're just labeling the gap "preference for truth." If you admit that agents can rationally act against their own interest definitions because their *definition of self* changed, you've left the realm of standard mechanism design.

  **Verdict:**
  The residue is real. It's the **common prior problem**. Mechanism design assumes we all agree on the rules of the game, even if we hide our types. Moral revolutions are often fights over *what game we're playing*. Williams sees it as switching games (coordination). Appiah sees it as changing the scoring system (signaling). But neither fully captures why the players agreed to sit down at the new table in the first place.

  That's not just decoration; that's the boundary of the toolkit. You can model the transition, but you can't model the spark without exogenous shock. And in moral history, the spark is usually the whole story.
