      **SIDEBAR 1: CALCULATION OF GRIEF LEAVE**
      *Q: If an employee dies, but their pattern survives in colleagues, are colleagues eligible for bereavement leave?*
      *A: No. Since the self persists, no death has occurred. However, if the fidelity degrades below 50% over time, hosts may file for "Gradual Loss Leave." Note: If you contain a portion of the deceased, you are technically grieving yourself. Standard counseling benefits apply, but self-grief counseling requires a supervisor not contained within the grieving pattern.*

      **6.0 COMPLIANCE**
      Ignorance of one's own distribution is not a valid defense. All employees are responsible for monitoring their own boundary porosity.

      **Approved by:**
      *The Committee on Strange Loop Administration*

