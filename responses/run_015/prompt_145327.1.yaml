      **SUBJECT:** Policy 74-Ω: Distributed Personhood and Benefit Allocation

      **1.0 PURPOSE**
      Pursuant to the Consortium's adoption of the Hofstadterian Personhood Framework, employees are hereby recognized not as biological substrates, but as high-fidelity symbolic patterns capable of cross-neural instantiation. This memo establishes protocols for managing labor obligations when a single self-structure occupies multiple nervous systems.

      **2.0 INTER-SUBJECTIVE CONTINUITY AUDITS**
      All staff must undergo quarterly Symbolic Fidelity Assessments. Where an employee's pattern is detected within a colleague's neural architecture (hereinafter "Internalization"), the host employee must file Form D-99. If the Internalization exceeds 40% fidelity, the host assumes partial fiduciary responsibility for the guest pattern's debts and non-disclosure agreements. Failure to declare a resident self-structure constitutes benefits fraud.

      **3.0 SUBSTRATE FAILURE AND PATTERN BRANCHING**
      In the event of the original substrate's biological cessation, survival of the self-pattern is contingent upon fidelity in remaining hosts.
      *3.1 Pension Allocation:* If a deceased senior researcher's pattern persists with >60% fidelity in three (3) junior researchers, the pension fund shall be divided equally among the three hosts. No lump-sum death benefit is issued, as the employee is not legally deceased.
      *3.2 Liability:* Malpractice liability becomes joint and several. If the distributed self commits an ethical violation via Host A, Hosts B and C are equally liable, regardless of physical location during the infraction.
      *3.3 Governance:* Regarding Ethics Board voting rights: The distributed self constitutes one voting entity. The three hosts must coordinate to cast a single collective vote. Disagreement among hosts regarding how the deceased would have voted will result in abstention and mandatory mediation.

      **4.0 LEAVE ACCRUAL AND CONCURRENT ABSENCE**
      Vacation time is accrued per pattern, not per substrate.
      *4.1 Concurrent Leave:* A distributed self may not take concurrent leave in multiple bodies unless approved by Departmental Leadership. If Pattern X occupies Bodies A, B, and C, only one body may be on leave at any given time to ensure operational continuity of the self.
      *4.2 Rest Requirements:* If Body A takes vacation while Body B works, the pattern is considered "partially active." Full vacation pay requires total pattern inactivity across all hosts.

      **5.0 GRIEF LEAVE ENTITLEMENTS**
