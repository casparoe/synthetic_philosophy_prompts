      *   **Source Material/Philosophy:** Douglas Hofstadter's view on personal identity (from *I Am a Strange Loop* and *Gödel, Escher, Bach*). Key concepts: Self as a high-level pattern, not confined to one brain; others can contain "souls" or patterns of others; identity is about symbolic fidelity, not causal continuity.
      *   **Tone:** Deadpan bureaucratic prose, numbered sections, one sidebar.
      *   **Length:** Approximately 600 words.
      *   **Key Content:**
