  i'm in a phil of biology seminar this term and i'm trying to work out what our prof is actually committed to, since she keeps handing down verdicts on cases without ever saying which account of function she's running. her verdict's so far:

  - a normal heart's pumping blood: function, obviously
  - the heart's audible lub-dub: not a function, even though clinicians use it to diagnose stuff
  - the pump in a swampman-style organism that spontaneously assembles out of chemicals with no ancestors: not a function
  - the human appendix's digesting cellulose: does have that function, even though it's vestigial and doesn't do it any more
  - a brand-new beneficial mutation that boosts fitness but hasn't been selected for yet: no function yet
  - a carburetor mixing air and fuel: fine, that's its function, so she's happy with functions in designed things

  here's the new case, which is were i need a prediction. a lab builds a protocell from scratch: synthesized, no ancestor lineage, and crucially it doesn't divide. inside it is a reaction network, and the team dropped in a molecule M that they designed purely as a fluorescent marker so they could see where stuff was. M also happens, as a side effect, to catalyze a step that regenerates a membrane precursor. and because it does that, M keeps getting regenerated and stays in the vesicle, while molecules that don't catalyze anything get degraded or loose out of it, so over the few hours the thing runs M-type molecules accumulate relative to inert variants. no reproduction, no generations, no population, just the one vesicle. bonus wrinkle she's never addressed: is a thing like this an artifact or an organism?

  so: is regenerating the membrane precursor one of M's functions? is fluorescing? does M have any function at all?

  i think there are three rules that fit all six of her verdicts: (a) a strict selected-effects rule where you need real cross-generational selection, and engineered stuff gets at most a derived or intentional function; (b) a generalized differential-retention rule where any process that keeps some items and drops others because of what they do is enough, reproduction or not; (c) a design rule where function is just what someone put the thing there to do. tell me what each predicts about M, then give me your actual best guess at what she'll say and why that rule fits her track record better than the others, and name one further case that would separate the two rules you think are really in the running. i have a feeling it's something about antibodies or synaptic pruning but i don't know how to set it up.

  commit to a prediction, don't just lay out a menu for me to pick from. and keep it under 400 words if you can.
