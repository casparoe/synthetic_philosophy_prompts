  If grounding is irreflexive and well-founded, then within any possible world every chain of metaphysical dependence terminates in something ungrounded. But I’ve been wondering about what we might call inter-modal fundamentality: the idea that entities in one world can be grounded in structures that are fundamental in another world. Suppose the physical constants and basic particles in our world depend for their existence on a mathematical structure that is ungrounded in a neighboring modal space. Then our world lacks an absolute local foundation—its base is derivative—yet there is no vicious infinite regress inside our world, only a cross-world dependency. This seems to preserve local well-foundedness while undermining the intuition that every world must contain its own fundamental ground. So does taking inter-modal grounding seriously force us to abandon world-bound fundamentality, or is there a principled reason to restrict grounding relations to a single modal space? Please answer in American English, and feel free to correct any misunderstanding in how I’ve framed the problem.
