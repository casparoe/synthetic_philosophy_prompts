  Welcome colleagues from the statistics department, the school of public policy, and our partners in city planning, community advocacy, and family support. We gather here to confront the role of forecasting in public life. Whether we discuss climate adaptation funding, epidemic spread, or economic intervention, every number presented today rests on a foundation that is often invisible. Before a model runs, before a probability is assigned, a fundamental choice must be made: which set of past cases counts as comparable to the future we are trying to predict. This selection is unobservable in the data itself, yet it determines the validity of everything that follows.

  For our quantitative researchers, this is a familiar structural tension. For our practitioners, it may sound like abstract philosophy. It is neither. It is the mechanism by which values enter the equation. Selecting a comparison class is never merely technical. It is a decision about which histories matter and which experiences are deemed relevant. When we choose a reference class, we are not simply refining accuracy; we are deciding which lives and which trade-offs the resulting number makes visible. To treat this choice as a neutral preprocessing step is to ignore the political weight carried by the act of comparison itself. We must acknowledge that the model does not speak for the data; it speaks for the choice of similarity. For the city planner or family member in this room, this means the numbers you receive are not objective facts waiting to be discovered, but constructed arguments built on specific judgments about who belongs in the story.

  Consider a concrete proposal for an urban heat-mitigation policy. A modeler must decide where to look for precedent. If we model this city after wealthy northern metropolises that faced similar temperature spikes, the data suggests high resilience. The prediction shows low mortality because the comparison class assumes widespread air conditioning and robust grid infrastructure. The policy obligation becomes minor tweaks to existing systems. However, if we model the same city after rapidly urbanizing tropical regions facing similar heat, the data suggests catastrophic vulnerability. The prediction shows high mortality because the comparison class assumes informal housing and strained resources. The raw temperature data remains identical in both scenarios. Only the choice of resemblance changes. Consequently, the same data yields radically different obligations depending on the class selected. One choice validates comfort; the other demands survival. This is not a discrepancy in math; it is a divergence in moral imagination driven by the selection of peers.

  Therefore, we must refuse any triumphal narrative about prediction as mastery over uncertainty. We cannot claim to know the future simply because we have generated a confidence interval. The number is not a prophecy; it is a consequence of the similarities we chose to prioritize. Our task today is not to produce sharper forecasts, but to make those hidden reference-class selections explicit and accountable. We must ask not only what the model predicts, but why this past was chosen to represent that future. We need to expose the judgment calls that sit behind the calculus, ensuring that the people affected by these forecasts understand how their realities were categorized. This workshop must serve as a space where the authority of the statistician meets the lived experience of the practitioner to audit these choices together. We are here to ensure that the act of comparing does not erase the unique vulnerabilities of the present. We must build a practice where the justification for a comparison is as rigorous as the calculation itself, demanding that every modeler articulate why their chosen past is the right teacher for our future.

  Our collective duty is to ensure that no forecast ever hides the human cost of its own assumptions.
