          *   Constraints: Max 650 words (hard cap), no citations/named scholars/quotes, standard paragraphs, lead with occasion/audience, conclude with a single tight bottom-line sentence on ethical responsibility.
      *   **Length:** About 5 minutes speaking time (approx. 600-650 words).
