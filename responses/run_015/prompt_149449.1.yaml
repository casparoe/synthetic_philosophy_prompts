answer: |-
  **Handout: The Two Faces of $\rho$ in Intergenerational Ethics**

  **1. The Collapse of Impatience and Distribution**

  In the standard Ramsey-Cass-Koopmans framework, social welfare is typically represented as the discounted sum of utilities:
  $$ W = \sum_{t=0}^{\infty} \left( \frac{1}{1+\rho} \right)^t u(c_t) $$
  Here, $\rho$ is the pure rate of time preference. In a single-agent context, $\rho > 0$ reflects *impatience*: a psychological preference for experiencing utility sooner rather than later. However, in long-term ethics, the "agent" at $t=0$ and the "agent" at $t=100$ are distinct persons (non-overlapping generations).

  **Why they collapse:** The standard formalism assumes a *representative dynasty* or a social planner who sums utilities as if they belong to a single continuous consciousness. Because the mathematical operator $\sum \beta^t$ applies identically whether $t$ indexes periods of a single life or generations of a population, the model cannot distinguish between *intra-personal* impatience (I prefer ice cream now to ice cream next year) and *inter-personal* distributional weights (I value the welfare of the present generation more than the future generation). In the limit of non-overlapping generations, "impatience" is category error; there is no single subject to be impatient. Yet, the parameter $\rho$ performs the exact same mathematical function: reducing the weight of future terms.

  **Prising them apart:** To separate psychological impatience from cohort weighting, the model must explicitly represent individual lifespans.
  *   **Overlapping Generations (OLG):** Agents live for $L$ periods. An individual born at $b$ maximizes $\sum_{t=b}^{b+L} \beta^{t-b} u(c_t)$. Here, $\beta$ captures genuine intra-personal impatience. A social planner then aggregates across cohorts: $W = \sum_{b} \lambda^b V_b$. Here, $\lambda$ captures the distributional weight assigned to later-born cohorts.
  *   **Survival Probability:** If we model a single agent facing mortality risk $p$ per period, the effective discount factor becomes $\beta \cdot p$.
  *   **Separation:** In these frameworks, $\rho$ (or $\beta$) governs the slope of consumption *within* a life, while a separate parameter governs the allocation *between* lives. The standard Ramsey model collapses these into a single $\rho$.

  **2. The Charge of Arbitrariness**

  Ramsey (1928) famously described $\rho$ as "ethically indefensible," a presumption we ought to ignore. Parfit later analogized time discounting to spatial discounting (valuing people less because they are far away).

  **Impact of the Collapse:** The collapse strengthens the charge of arbitrariness.
  *   If $\rho$ represented genuine impatience, one might argue (weakly) that ethics should accommodate human psychology.
  *   But if $\rho$ in the long-term context is actually a *distributional weight* between distinct people, the "psychology" defense vanishes. There is no natural fact about "impatience" between non-existent people.
  *   Consequently, a positive $\rho$ in intergenerational models must be justified as a explicit claim that earlier-born people matter more than later-born people. Without the cover of "impatience," $\rho > 0$ looks exactly like discounting by spatial distance or identity: it privileges the "here and now" cohort without neutral justification. The collapse reveals that using the *psychological* parameter to solve the *distributional* problem is a category error that masks an ethical assertion as a technical assumption.

  **3. Hazard Rates vs. Pure Preference**

  A common defense of positive discounting is that it reflects existential risk: the probability that humanity (or the beneficiary) will not exist to enjoy the future utility. Let $\delta$ be the hazard rate (probability of extinction/catastrophe per period). The expected utility is:
  $$ E[W] = \sum_{t=0}^{\infty} (1-\delta)^t \left( \frac{1}{1+\rho} \right)^t u(c_t) \approx \sum_{t=0}^{\infty} \left( \frac{1}{1+\rho+\delta} \right)^t u(c_t) $$
  Mathematically, $\delta$ and $\rho$ are additive in the denominator. This leads to observational equivalence: a policy based on $\rho + \delta = 0.05$ looks identical whether $\rho=0.05, \delta=0$ or $\rho=0, \delta=0.05$.

  **Distinguishing the Readings:**
  *   **Normative Status:** $\rho$ is a value judgment (we *should* care less). $\delta$ is an empirical claim (they *might* not exist).
  *   **Endogeneity:** If $\delta$ is endogenous (e.g., climate policy reduces extinction risk), discounting by $\delta$ can be self-defeating. If we discount the future because it might end, we invest less in preventing it from ending, raising $\delta$. Pure $\rho$ does not suffer this feedback loop.
  *   **The Tell:** If the recommended discount rate falls when existential risk is mitigated, the parameter is doing hazard work. If it remains constant regardless of survival probability, it is pure time preference.

  **Which Distinction is Merely Verbal?**
  The mathematical equivalence between $\rho$ and $\delta$ is **not** merely verbal; it has real policy consequences (the endogeneity problem above). However, the distinction between "discounting because they might not exist" and "discounting because we value them less if they do exist" is often blurred in practice.
  *   **Merely Verbal:** Calling $\delta$ a form of "time preference." It is not preference; it is probability.
  *   **Substantive:** Whether a policy-recommended rate includes $\delta$. If a government justifies a 3% discount rate by citing "time preference" but 1% of that is actually unacknowledged extinction risk, they are implicitly arguing that future generations matter less *even if* humanity survives.

  **Summary for Seminar:**
  The standard Ramsey framework conceals an ethical choice. By collapsing intra-personal impatience and inter-personal weighting into $\rho$, it allows the defender of high discount rates to borrow the plausibility of human psychology to justify what is actually a claim about the inferior moral status of future people. To be conceptually honest, models of the long term must separate the probability of existence ($\delta$) from the weight of welfare ($\rho$), and acknowledge that in a world of distinct generations, $\rho$ is purely distributional.
