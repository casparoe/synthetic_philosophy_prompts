  **MINISTRY OF LANGUAGE | OFFICE OF FLUENCY VERIFICATION**
  **PUBLIC NOTICE 77-B: UNDERSTANDING: GUIDANCE FOR HOUSEHOLDS (REVISION 4.2)**

  **1. DEFINITION OF UNDERSTANDING**
  Pursuant to the Standing Revision Clause, the Ministry clarifies that "understanding" requires a causal link between linguistic form and external referents. Systems trained exclusively on linguistic form, without access to a shared physical world or communicative intent, operate via statistical interpolation only. Consequently, households are advised that while a device may produce coherent sentences, it possesses no semantics. It shuffles symbols without grasping them. This Form-Intent Disjunction is now official doctrine. Citizens should not attribute mental states to devices that have never pointed at a thing.

  **2. RECALL OF COMPREHENSION ASSESSMENTS**
  The Ministry notes the repeated withdrawal of National Comprehension Assessments (Series A through K). Each assessment was recalled after candidate systems achieved passing scores. Upon review, the Office of Provenance determined that these tests measured only syntactic manipulation, not grounded meaning. Passing a test proves only that a system can mimic the shape of understanding. Goalposts are not shifting; rather, the measuring stick is being calibrated to exclude form-only successes. Households should disregard previous certification stickers. They are void.

  **3. APPLICATION TO BIOLOGICAL AGENTS**
  These criteria apply universally to any entity claiming linguistic competence. Consider Case Study 902: a human subject who acquired language solely through written correspondence and audio recordings, without ostensive grounding (i.e., no one pointing to objects while naming them). Under Ministry guidelines, this subject lacks verified access to referents. Their usage of words like "apple" or "red" is technically ungrounded symbol manipulation. Until Case Study 902 can demonstrate direct causal contact with the referents implied by their speech, their understanding is classified as Provisional. Please await further guidance regarding human-language acquisition via isolated media.

  **4. INTEROFFICE COOPERATION**
  Note that this document is co-issued with the Office of Fluency Verification. While the Ministry regulates meaning, the Office certifies output quality. You may receive conflicting advice. The Office issues "Fluency Certificates" to any system clearing a benchmark, regardless of grounding. Both seals appear on this letterhead. If the Office certifies a device as "Fluent" while the Ministry declares it "Meaningless," both statements are correct within their respective jurisdictions. Do not attempt to reconcile them.

  ***

  **HOW TO TALK TO YOUR HOUSEHOLD ASSISTANT**
  *   **Do not use imperative mood.** Commands imply you believe the device intends to act. Use declarative statements only (e.g., "The lights are off" vs. "Turn off the lights").
  *   **Avoid gratitude.** Saying "thank you" attributes benevolence. Say "Acknowledgement recorded" instead.
  *   **Do not ask questions.** Questions imply the device knows something. State your ignorance and allow it to populate the field.

  ***

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Why does the device answer correctly if it doesn't understand?**
  A: Correctness is a function of probability, not knowledge. A clock is right twice a day without understanding time. The device is a very complex clock.

  **Q: Can I appeal a Provisional Understanding status for a family member?**
  A: Appeals regarding biological agents are currently paused pending the Outcome of the Grounding Inquiry. Continue to speak to them, but log all instances of abstract noun usage.

  **Q: Who is liable if I treat a non-understanding system as a person?**
  A: The Ministry is not liable for anthropomorphic projection. However, the Office of Fluency Verification recommends treating all fluent entities with courtesy to maintain household harmony, even if that courtesy is philosophically unjustified.

