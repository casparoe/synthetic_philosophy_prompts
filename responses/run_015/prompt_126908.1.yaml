      *   **Appiah/Williams Nuance:** Appiah doesn't say reasons *don't matter*. He says reasons alone aren't *sufficient* without the honor shift. The arguments created the *conditions* for the honor shift.
      *   **Proposed Revision:** Honor is the *engine*, Reason is the *steering*.

