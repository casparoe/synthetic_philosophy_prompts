      *   *Check Step (1).* Appiah's thesis is that honor *accelerates* or *crystallizes* change that arguments started. It's rarely *just* honor.
      *   *Key Insight:* The argument assumes that if honor is the *decisive* shift, reasons are *irrelevant*. But reasons can be the *precondition* for the honor shift. (e.g., Arguments made slavery shameful *then* honor flipped).

