      *   *Check:* Did I address Malthus's actual text? Need to ensure I don't attribute "Limits to Growth" (1972) directly to Malthus (1798), but acknowledge the lineage.
      *   *Check:* Is the Popper critique fair? Popper did view historicism (predicting long-term history) as unscientific. I need to mention that.
