answer: |-
  **Setting:** *A bus stop. 11:40 PM. Humid. The schedule says the bus came ten minutes ago. It didn't.*

  **Elias:** You're checking your watch again.

  **Sam:** Because the app says it's here.

  **Elias:** The app is a promise. You're suffering because reality isn't matching the promise. That's the craving.

  **Sam:** I'm not suffering, Elias. I'm annoyed. There's a difference. I'm tired, I want my bed. That's not a philosophical crisis, it's physics.

  **Elias:** It's all the same mechanism. Wanting what isn't here. If you dropped the want, you'd be fine right here. On this bench. In this heat.

  **Sam:** Or I could be home. Which is better.

  **Elias:** Is it? Or is home just the absence of this discomfort? You think "better" means adding something positive. I'm telling you, "better" just means subtracting the negative.

  **Sam:** That's the tranquilist trap. You reduce everything to zero. If the goal is just removing the itch, then scratching it isn't good, it's just neutral.

  **Elias:** Exactly. The scratch feels good only because the itch was bad. Pleasure is just relief in disguise.

  **Sam:** So if I'm eating an apple, and I'm not hungry... is that neutral?

  **Elias:** If there's no hunger, there's no craving. If there's no craving, the eating is just motion. The value is in not being hungry.

  **Sam:** Okay. Let's push that. If the highest value is the absence of craving... and death is the absolute absence of craving...

  **Elias:** Don't do the death card.

  **Sam:** I have to. It's the null-state problem. If zero is the peak, then a rock is peak. A corpse is peak. Why aren't we optimizing for non-existence?

  **Elias:** Because value requires a subject. You can't assign value to a rock. There's no one there to register the zero.

  **Sam:** But there's no one there to register the suffering either. That's your whole point. Suffering is what matters. So a dead person has zero suffering. A tranquil master has zero suffering. Axially, they're identical.

  **Elias:** No. The master has the *experience* of zero. The corpse has nothing.

  **Sam:** Is experienced zero different from actual zero?

  **Elias:** Yes. Because the master can slip. The master is maintaining a state where suffering *could* arise but doesn't. That conscious absence is the only thing that counts.

  **Sam:** That feels like word salad. You're saying the feeling of nothing is better than the state of nothing.

  **Elias:** I'm saying morality is about preventing harm. You can't harm the dead. You can harm the living. So the living matter. But what matters *about* them is that they don't hurt.

  **Sam:** But what if they feel... light? Not just "not hurt," but light. Like right now. The bus isn't here, I'm annoyed, okay. But imagine it arrives. I sit down. Cool air. I let out a breath. That exhale isn't just the end of annoyance. It's a positive texture.

  **Elias:** It's the cessation of tension.

  **Sam:** It's warmth, Elias. It's addition. You're treating the mind like a bank account where the only goal is not being in debt. I'm saying you can actually have assets.

  **Elias:** Assets imply you need to protect them. Then you crave keeping them. Then you suffer when they go.

  **Sam:** So I should never love anything because I might lose it?

  **Elias:** I'm saying love is often just fear of loss wearing a mask.

  **Sam:** That's cynical. Even for you.

  **Elias:** It's realistic. Look at us. We've been friends twenty years. Why?

  **Sam:** Because we like each other.

  **Elias:** Because being alone is harder. We buffer each other's suffering.

  **Sam:** No. Because there's joy. Not just relief. If you walked away tomorrow, I wouldn't just be "relieved of the burden of you." I'd be less. There'd be a hole. Not a painful hole, just... missing color.

  **Elias:** You perceive the missing color as pain.

  **Sam:** I perceive it as value. That's the disconnect. You think the only metric is pain. I think the metric is richness. And richness isn't zero.

  **Elias:** If richness requires craving for more richness, it's unstable.

  **Sam:** What if it doesn't? What if there's a kind of ease that isn't passive? Like... flow. You're not craving the next moment, you're fully in this one. It's not neutral. It's vibrant. But it's not hungry.

  **Elias:** *(Silence. A car passes, splashing water.)* Vibrant zero.

  **Sam:** Call it what you want. But if your philosophy can't distinguish between a monk in bliss and a stone in the dirt, it's broken.

  **Elias:** The stone doesn't know it's safe. The monk does.

  **Sam:** Knowing implies a thinker. And thinkers crave.

  **Elias:** Not necessarily. You can witness without grasping.

  **Sam:** Then witness this. *(Points down the street.)* Headlights.

  **Elias:** Finally.

  **Sam:** You getting on?

  **Elias:** Yeah.

  **Sam:** You going home to sit in silence?

  **Elias:** Going home to stop wanting to be somewhere else.

  **Sam:** *(Smiles, tired.)* I'm going home to hug my wife. Not because I'm afraid of being alone. But because she's warm.

  **Elias:** Just don't suffer when she's at work tomorrow.

  **Sam:** I'll try. But if I do miss her... I'm counting that as a good thing.

  **Elias:** *(Steps onto the bus.)* Then you're signing up for the bill.

  **Sam:** Yeah. Well. I think I can afford it.

  *(The doors hiss shut. The bus pulls away. Elias watches Sam through the glass, neither waving.)*
