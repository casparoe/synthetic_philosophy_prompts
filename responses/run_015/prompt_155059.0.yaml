answer: |-
  This is a classic setup for the **Discursive Dilemma** (or Doctrinal Paradox). It is one of the most robust "aha!" moments in political theory, but it is fragile in the classroom. If the vote counts don't split exactly right, the paradox vanishes, and you're left explaining a math problem that didn't happen.

  To guarantee the outcome without fudging the tally, you **must** structure the voters' preferences beforehand. You cannot rely on 20 random undergrads naturally splitting into the required thirds. The solution is **Private Judge Profiles**. This is not "cheating"; it is simulation design. You are assigning them constituencies or judicial philosophies, which is exactly how real committees work.

  Here is the runnable plan.

  ### 1. The Scenario: The "Conduct Tribunal"
  **Stakes:** Low enough to prevent genuine distress, high enough to feel bureaucratic.
  **Case:** A student organization is accused of violating the "Safe Campus Policy" by hosting an unregistered event.
  **The Question:** Should the organization be **Sanctioned** (lose funding for one semester)?

  **The Rules of Adjudication (The Logic):**
  Display this on the projector. It contains the varied logical shapes you requested.
  > **The Tribunal Charter:**
  > An organization is **Responsible** (and thus Sanctioned) if and only if:
  > 1.  **Proposition A (Necessary):** Did the organization host the event?
  >     *   *If No, they are Not Responsible.*
  > 2.  **AND** at least one of the following conditions is met:
  >     *   **Proposition B (Path 1):** Was the event unregistered?
  >     *   **OR**
  >     *   **Proposition C (Path 2):** Did the event pose a safety risk?
  >
  > **Verdict:** Sanction if **A** is TRUE **AND** (**B** is TRUE **OR** **C** is TRUE).

  *Why this logic?* It forces them to track a Necessary condition (A) and a Disjunctive sufficient condition (B or C). It prevents simple pattern matching.

  ### 2. Materials & Prep
  *   **Index Cards (Ballots):** 3 per student. Marked "Vote 1 (Verdict)", "Vote 2 (Premises)", "Vote 3 (Final)".
  *   **Private Judge Profiles:** 20 slips of paper, cut from three different templates (see below).
  *   **Projector Slide:** The Charter Rules (above) and a blank tally sheet.
  *   **Room:** Chairs in a semi-circle or committee table shape.

  ### 3. The "Rigging" (Judge Profiles)
  To guarantee the paradox, you need a specific distribution of beliefs. Hand these out randomly as students enter. Tell them: *"In real tribunals, members weigh evidence differently based on their role. This card is your private briefing on how you interpret the evidence provided in the case packet."*

  **The Evidence (Oral or Handout):**
  *   *Fact 1:* The event happened (Strong evidence).
  *   *Fact 2:* It was not registered (Strong evidence).
  *   *Fact 3:* Safety risk is ambiguous (Some say yes, some say no).

  **The Profiles (Distribute exactly as follows):**
  *   **Type 1 (7 students):** "You prioritize Rule of Law. If the event was unregistered, that is sufficient for a sanction, provided they hosted it. You are skeptical of 'safety risk' claims."
      *   *Implied Votes:* A=Yes, B=Yes, C=No. -> **Verdict=Yes.**
  *   **Type 2 (7 students):** "You prioritize Safety. Registration technicalities don't matter to you unless there was actual risk. You believe the risk was low."
      *   *Implied Votes:* A=Yes, B=No, C=No. -> **Verdict=No.**
      *   *(Note: For the paradox to work cleanly with the OR logic, we need to adjust the split slightly. See the "Math Check" below).*

  **Correction for the OR Logic:**
  The OR logic makes the math trickier for a 75-minute session. If B is Yes for the majority, the OR condition passes easily. To ensure the paradox hits hard, I recommend simplifying the logic for the *activity* to the classic **AND** structure, while keeping the *Charter* complex to satisfy your syllabus requirement.
  *Actually, let's stick to your request for varied shapes, but simplify the distribution to ensure the paradox works.*

  **Revised Distribution for 20 Students (Guaranteed Paradox):**
  *   **Group 1 (7 students):** A=Yes, B=Yes, C=No. (Verdict: Yes)
  *   **Group 2 (6 students):** A=Yes, B=No, C=No. (Verdict: No)
  *   **Group 3 (7 students):** A=No, B=Yes, C=Yes. (Verdict: No)
      *   *Wait, if A is No, Verdict is No regardless of B/C.*
      *   *Majority on A:* Yes (13) vs No (7). -> **A Passes.**
      *   *Majority on B:* Yes (14) vs No (6). -> **B Passes.**
      *   *Majority on C:* Yes (7) vs No (13). -> **C Fails.**
      *   *Premise Conclusion:* A(Yes) + (B(Yes) OR C(No)) = **Sanction.**
      *   *Direct Verdict Vote:* Yes (7) vs No (13). = **No Sanction.**
      *   *Paradox Achieved.*

  **Print these three profiles on different colored paper if possible, or just mix them well.**
  *   **Profile Red (7 copies):** "You believe the event definitely happened (A). You believe it was unregistered (B). You see no safety risk (C)."
  *   **Profile Blue (6 copies):** "You believe the event definitely happened (A). You believe it WAS registered (Not B). You see no safety risk (Not C)."
  *   **Profile Green (7 copies):** "You believe the event did NOT happen (Not A). You believe it was unregistered (B). You see a safety risk (C)."

  *Note:* This feels artificial ("You believe the event did not happen"?). To make it natural, phrase the profiles as **Interpretations of Evidence**:
  *   **Red:** "You trust the Admin Report (says Event Happened, Unregistered). You distrust the Safety Officer (says No Risk)."
  *   **Blue:** "You trust the Admin Report (says Event Happened). You trust the Student Defense (says it WAS Registered). You distrust Safety Officer."
  *   **Green:** "You trust the Student Defense (says No Event). You distrust Admin. You trust Safety Officer (says Risk)."

  ### 4. Run of Show (75 Minutes)

  **0:00 – 0:10: Setup & Private Briefing**
  *   Seat students. Hand out the **Profile Slips**.
  *   **Script:** "You are the Conduct Tribunal. You have a case to decide. You have received a private briefing on how your office interprets the evidence. **Do not show this card to anyone.** It dictates your findings of fact."
  *   Hand out the **Charter Rules** (projected).
  *   **Script:** "Your job is to apply these rules to the facts as you find them."

  **0:10 – 0:25: Round 1 (Conclusion-Based)**
  *   **Task:** Vote directly on the Verdict. "Should the organization be Sanctioned?"
  *   **Method:** Paper ballot. Collect and tally publicly on the board.
  *   **Expected Result:** **NO Sanction** (13 No vs 7 Yes).
  *   **Action:** Record the outcome. Do not comment on it yet.

  **0:25 – 0:45: Round 2 (Premise-Based)**
  *   **Task:** Vote on the Facts (Propositions A, B, C) separately.
  *   **Method:** Three separate votes. Raise hands or pass cards.
  *   **Script:** "We need to establish the record. Vote on A. Now B. Now C."
  *   **Tally:** Write the Majority Finding for each on the board.
      *   A: Yes (13-7)
      *   B: Yes (14-6)
      *   C: No (13-7)
  *   **Application:** Ask the class to apply the Charter Rules to these Majority Findings.
      *   "If A is Yes, and B is Yes... what does the rule say?"
      *   **Result:** **Sanction.**
  *   **The Moment:** Pause. Let the silence hang. Point to the two outcomes on the board. They contradict.

  **0:45 – 0:55: Small Group Diagnosis**
  *   Break into groups of 4.
  *   **Prompt:** "Look at the board. Nobody voted for an inconsistent set of beliefs individually. So where did the inconsistency come from? Which procedure feels more 'democratic'? Which feels more 'legal'?"
  *   **Role for the 'Sharp Student':** If you suspect someone knows the theory, pull them aside at the start. Give them a "Process Observer" clipboard. Their job is to record *how* decisions are made, not to vote. If they speak up during the activity, ask them to save their observation for the debrief.

  **0:55 – 1:15: Debrief & Theory**
  *   **Name It:** Introduce the **Discursive Dilemma** (List & Pettit).
  *   **Map It:** "When we voted on the Verdict first, we prioritized *responsiveness* to the group's bottom-line will. When we voted on Premises, we prioritized *consistency* with the rules."
  *   **Abstentions (Your specific question):**
      *   *What to do:* In this simulation, count blanks as **"Not Proven" (No)**.
      *   *Why:* In legal/bureaucratic contexts, the burden of proof is on the affirmative. A blank ballot is a refusal to affirm the premise.
      *   *Effect:* If you counted blanks as "remove from denominator," you lower the threshold for majority. This can make the paradox *more* likely if the "Yes" voters are disciplined and the "No" voters are ambivalent. But for classroom stability, **Blank = No** is cleaner.
  *   **Epistemic Quality (Truth Tracking):**
      *   *The Settled View:* There is no single "truth-tracking" winner. It depends on the **competence structure**.
      *   *Premise-Based:* Better if voters are experts on the *facts* (e.g., scientists voting on climate premises) but bad at holistic judgment. It ensures the "reasons" are public and consistent.
      *   *Conclusion-Based:* Better if voters are experts on the *outcome* (e.g., jurors deciding guilt) but the legal rules are complex. It respects the "wisdom of the crowd" on the final question.
      *   *The Trade-off:* **Consistency vs. Responsiveness.** Premise voting guarantees a coherent set of beliefs for the group (integrity). Conclusion voting guarantees the group's will is respected (agency).
      *   *Reference:* Cite **List & Pettit (2002)**. It's the canonical text. Admit that political scientists still argue about which is normatively better.

  ### 5. Risk Management

  **Fear 1: The Vote Split Fails**
  *   *Mitigation:* The **Profile Cards** solve this. As long as students follow their profile (which they usually do in simulations because it gives them a role), the math holds.
  *   *Contingency:* If the vote splits 10-10 on a premise, declare it "Failed" (Burden of proof not met). This usually preserves the paradox structure.

  **Fear 2: The Sharp Student Spoils It**
  *   *Mitigation:* The **Process Observer** role.
  *   *Script:* "I know some of you have taken poli-sci before. I need you to help me run this. Don't vote. Just watch the procedure. If you see the trick, write it down and give it to me at the end. Don't rob your classmates of the discovery."
  *   Most students will enjoy the "insider" status and stay quiet.

  **Fear 3: Abstentions Confuse the Count**
  *   *Mitigation:* Be explicit in instructions. "If you are unsure, leave it blank. A blank counts as a 'No' on the premise." Write this on the projector during voting.

  ### 6. Why This Works for Your Constraints
  *   **Varied Logic:** The Charter includes AND/OR/Necessary conditions, forcing them to read the rules every time.
  *   **Paper/Physical:** Index cards feel more like "ballots" than phones.
  *   **No Fudging:** The Profile Cards guarantee the split. You are not changing numbers; you are structuring the population.
  *   **Debrief Ready:** The contradiction is on the board in marker. It's undeniable.

  ### 7. A Note on the "Truth" Question for the Undergrads
  When you get to the epistemic part, don't say "Premise voting is truer." Say:
  > "Imagine a medical board deciding if a treatment is safe.
  > **Method 1:** Vote on 'Is it effective?' and 'Are side effects low?' then derive 'Is it safe?' (Premise).
  > **Method 2:** Vote directly on 'Is it safe?' (Conclusion).
  > If the doctors are great at measuring side effects but bad at holistic risk assessment, Method 1 finds the truth. If they are great at holistic judgment but the metrics are noisy, Method 2 finds the truth. Democracy doesn't solve the problem of *what* we are voting on, only *how*."

  This is defensible, nuanced, and fits the 15-minute debrief window.
