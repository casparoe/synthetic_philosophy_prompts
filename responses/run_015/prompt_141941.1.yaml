answer: |-
  1. **Bottom line**
  A trait T of system S has the function of doing F if and only if: (1) T's capacity to do F contributed to the persistence or reproduction of S (or a superordinate system) in the past; (2) this contribution explains why T is currently maintained in the population or design-class of S (ongoing selection or design intent); and (3) the benefit accrued to S rather than solely to T's own lineage. This principle unifies natural selection, artificial selection, and intentional design under "maintenance by selection," requiring that the selective pressure benefiting the containing system remains active. It excludes traits where selection has ceased (vestiges), where benefit is incidental (by-products), or where selection benefits the trait's lineage at the system's expense (cancer). To apply mechanically: verify historical contribution, confirm current maintenance pressure, and identify the beneficiary system.

  2. **Candidates**
  *Selected-Effects (SE):* A trait's function is whatever it was historically selected for, regardless of current utility.
  *Causal-Role (CR):* A trait's function is whatever contribution it currently makes to the containing system's capacity.
  *Recommended (Current System-Benefiting Etiological):* A trait's function is what it was selected for, provided that selection currently maintains the trait for the benefit of the containing system.

  The recommended principle wins because it alone captures your specific pattern of verdicts. Pure SE fails Case 7 (vestiges), attributing function where you see none because historical selection is insufficient without current maintenance. Pure CR fails Case 1 (malfunction) and Case 3 (new mutation), attributing function based on capacity or immediate benefit where you require history. Your verdicts demand a historical account (to handle malfunction and new mutations) that is nonetheless sensitive to current systemic integration (to handle vestiges, cancer, and symbiosis). Only a hybrid requiring *ongoing* selection *for the system* accommodates the distinction between a broken heart (function retained) and a vestigial eye (function lost), and between cancer (selected but parasitic) and protists (selected and mutualistic).

  3. **Clause by clause**
  *The History Clause:* ("contributed... in the past") This is forced by Cases 1, 3, 4, and 5. In Case 1 (damaged heart), capacity is lost but function remains; only history saves the verdict. In Case 3 (new mutation), capacity and benefit exist, but function is denied; history excludes it. Without this clause, you cannot distinguish malfunction from functionlessness, or established traits from lucky accidents.

  *The Maintenance Clause:* ("currently maintained... ongoing selection") This is forced by Case 7 (cave fish). Standard etiological accounts say vestigial eyes retain the function of seeing because ancestors were selected for seeing. You verdict "no function now." This requires that the selective pressure must still be active in the population. If selection relaxes, function evaporates. Without this clause, you contradict your own verdict on vestiges and cannot explain why feathers (Case 8) gain flight functions only after co-option selection begins.

  *The Beneficiary Clause:* ("benefit accrued to S rather than... T's lineage") This is forced by Cases 6, 9, and 10. In Case 6 (cancer), cells are selected for proliferation, but you deny function. The selection benefits the cancer lineage, not the devil system. In Case 9 (gut bacteria), vitamin K is a byproduct; selection benefits the bacteria, not the host. In Case 10 (ants), selection benefits the colony (superordinate S). Without this clause, cancer becomes functional and symbiosis distinctions collapse.

  *The Design Parity Clause:* ("population or design-class") This covers Cases 4 and 5. It ensures lab-grown kidneys and directed enzymes count as functional despite lacking natural history. Dropping this forces an arbitrary biological/natural distinction you reject.

  4. **Table of verdicts**

  | Case | Trait | User Verdict | Principle Verdict | Disagreement |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Damaged Heart | Function (pump) | Function (pump) | None |
  | 2 | Heart Sound | No Function | No Function | None |
  | 3 | New Mutation | No Function | No Function | None |
  | 4 | Lab Kidney | Function (filter) | Function (filter) | None |
  | 5 | Directed Enzyme | Function (stable) | Function (stable) | None |
  | 6 | Cancer Cells | No Function | No Function | None |
  | 7 | Cave Fish Eyes | No Function | No Function | None |
  | 8 | Feathers | Function (flight) | Function (flight) | None |
  | 9 | Termite Protists | Function (digest) | Function (digest) | None |
  | 9b | Gut Bacteria | No Function (Vit K) | No Function (Vit K) | None |
  | 10 | Sterile Ant | Function (defence) | Function (defence) | None |
  | 11 | Chimp Fishing | Uncertain | Function (if cultural selection counts) | **Flagged** |

  The principle aligns perfectly with biological cases. Case 11 flags a boundary condition regarding cultural transmission.

  5. **Verdicts I should give up**
  The principle accommodates almost all your verdicts, but it forces a decision on Case 11 (Chimp termite-fishing) and reinforces Case 3 (New Mutation). You are "back and forth" on Case 11. The principle predicts "Function" *if* you count cultural transmission as a form of selection that maintains the trait for the group. If you restrict "selection" to genetic or intentional design, the principle predicts "No Function." You must give up the ambivalence: either extend the principle to cultural evolution (recommended, given Case 5's parity) or accept the behavior is functionless. Regarding Case 3, you are "least confident." The principle firmly says "No Function" because one generation lacks the maintenance history. You should revise your confidence to match this; attributing function too early conflates benefit with function. The cost of keeping Case 11 ambiguous is theoretical inconsistency; the cost of fixing Case 3 is accepting that usefulness alone never equals function.

  6. **Predictions**
  1. *De Novo Protein:* A computer-designed protein catalyzing a novel reaction has the function of catalyzing that reaction. The "design intent" clause satisfies the history and maintenance requirements (the design-class is maintained for this purpose).
  2. *Incidental Stabilization:* If that protein also stabilizes a membrane, but no designer selected for this and it confers no selected advantage, it is not a function. It is a beneficial by-product, mirroring Case 9b (gut bacteria). It matters that no one intended it; without selection/design for F, F is not a function.
  3. *Spam Filter:* An algorithm selected over iterations for blocking spam has the function of blocking spam. If it inadvertently reduces server load, that is not its function. This tests the beneficiary clause: the system (email server) benefits from both, but only one explains the trait's maintenance. The principle cleanly separates intended/selected effects from accidental benefits, predicting that functional ascriptions track the *reason for retention*, not the *sum of effects*.

  7. **The case I keep going back and forth on — termite-fishing**
  The principle predicts "Function" provided you classify cultural transmission as a selection process satisfying the Maintenance Clause. The behavior is maintained across generations because it benefits the chimps (or the group), analogous to Case 10 (ants). The prediction relies heavily on the decision in Section 1 to treat "selection" broadly (covering Case 5 lab evolution). If you restrict selection to genetic replication, the principle predicts "No Function," forcing you to treat cultural traits differently from biological ones. This case is not a reason to doubt the principle, but a reason to extend it. If you accept Case 5 (directed evolution) as functional despite lacking natural history, consistency demands accepting cultural evolution as functional despite lacking genetic history. The hesitation likely stems from the "unit of selection" ambiguity, not the principle itself. Resolve it by explicitly defining "selection" to include cultural retention mechanisms.
