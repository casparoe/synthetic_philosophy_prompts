prompt: |-
  Hi — I chair the "Beyond the Call" panel at a fairly big district general hospital, and I need something we can actually run. Every month we get 10-15 nominations from staff for colleagues who supposedly went above and beyond, we have 90 minutes, six people on the panel (two nurses, a doctor, an HR rep, a patient rep, and me — I'm in facilities), nobody has any philosophy training, and the nomination forms are two pages of narrative with almost never a clear statement of what the person's actual job description was or whether they were on duty. Decisions get read out at a staff event, they affect morale, the union watches them, and our comms lead has one hard rule: the citation has to praise the act without implying that everyone who didn't do it did something wrong. That last bit is the one we always screw up.

  What I want is a decision procedure, not an essay. Give me:

  1. The questions in the order we ask them, with what counts as a sufficient answer to each one.
  2. The gates where the answer is just "no award" and we stop.
  3. The gates where the procedure hands it to us as a values call that we have to make ourselves, flagged as such, because no amount of procedure settles it.
  4. What to do when we simply can't establish the facts (the form is vague, accounts disagree, the person's role is contested) — do we defer, default, or drop it.

  The distinctions it has to make, roughly: (a) the job done well, or a nice extra that's still just optional-but-ordinary; (b) genuinely beyond what was required of this person and praiseworthy; (c) actually required, i.e. the person was lucky not to be disciplined rather than heroic; (d) something admirable in spirit that we still shouldn't celebrate, because rewarding it signals the wrong thing — reckless self-risk, or papering over a staffing failure by turning it into a story about individual virtue.

  Hard cases it has to survive, because we've hit all of these:

  - The person's own mistake caused the emergency, and then they stayed fourteen hours fixing it. Is that heroism or just putting right what you broke?
  - What HR has started calling "quiet refusals": the act was an omission or a waiving — turning down a bonus so a junior could have it, giving up a promotion, taking their name off a paper they'd partly written. Costly, but is it the same shape as doing something?
  - The person profited afterwards: press coverage, a fundraiser, a promotion, a book deal. Does being rewarded retro-actively stop it from counting?
  - Mixed motives, off-duty acts, acts by people with no special role at all, and acts where the person was asked by a manager rather than volunteering.
  - The "they could have done it at trivial cost" end of things — you know the style of argument, that if you can prevent something terrible at almost no cost to yourself then it isn't optional at all. Some of our nominations look like that: huge benefit to someone else, tiny inconvenience to the agent. I want the procedure to tell us where that tips over from praiseworthy to required, and to be honest that it's drawing a line rather than finding one.
  - And the deep one: if the act really was optional, what are we praising, and if it really was the obviously best thing to do, why isn't skipping it blameworthy? I don't need this solved. I need the procedure to mark exactly where it stops being able to answer and just stipulates a convention so we can be consistent.

  Also: our HR director has started floating "second-order" nominations — not the person who did the thing, but the person who arranged things so other people could do it (a ward manager who quietly rewrote the rota so staff could sit with dying patients). I have no idea whether that belongs in the same category or breaks it. Deal with it or rule it out, but say which.

  Then run the whole thing on three real-ish nominations:

  - A night nurse who stayed six hours unpaid past the end of her shift to sit with a dying patient whose family were stuck on a motorway. The ward was two staff short and the manager had put out a general "stay if you can" message.
  - A senior pharmacist whose own dispensing error caused a patient's crisis, who then worked through the night to stabilise him and visited the family every day for a week.
  - A porter who donated a kidney to a colleague he'd known about three months. The story got picked up locally and raised a chunk of money for the hospital; the transplant team were visibly uneasy about the whole thing.

  We've more or less decided informally that the nurse is getting it, so if your procedure says no, say so plainly and tell us why. I also want a short closing section on what this procedure can't do — where it will misfire, what it can't rank or compare, and the cases where we should ignore it. Keep the language usable by people who've never thought about any of this; if you need a term of art, define it in a sentence.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Chair of "Beyond the Call" panel at a district general hospital.
      *   **Context:** Monthly meeting, 90 mins, 10-15 nominations, 6 panelists (mixed roles, no philosophy training).
      *   **Problem:** Vague nomination forms, high stakes (morale, union scrutiny), specific comms rule (praise act without implying negligence by others), difficulty distinguishing "good job" vs. "beyond call" vs. "required" vs. "problematic virtue."
      *   **Deliverable:** A practical *decision procedure* (not an essay).
      *   **Requirements:**
          1.  Ordered questions with sufficient answers.
          2.  "No Award" gates (stop points).
          3.  "Values Call" flags (where procedure ends and judgment begins).
          4.  Protocol for unclear facts (defer/default/drop).
          5.  Handling specific hard cases (self-caused error, quiet refusals, retro-profit, mixed motives/off-duty/ordered, trivial cost vs. huge benefit, second-order nominations).
          6.  Run the procedure on three specific cases (Nurse, Pharmacist, Porter).
          7.  Closing section on limitations (what the procedure can't do).
      *   **Tone:** Usable, clear, non-academic, pragmatic.

  2.  **Deconstruct the Ethical/Operational Challenges:**
      *   *The Comms Rule:* "Praise the act without implying others did wrong." This is the trickiest constraint. It means avoiding language like "while others left" or "despite understaffing." It requires focusing on the *addition* rather than the *subtraction* of others' efforts.
      *   *The "Beyond the Call" Definition:* Needs to distinguish between (a) Competence, (b) Supererogation (Good but not required), (c) Duty (Required), (d) Toxic Virtue (Rewarding systemic failure).
      *   *The "Self-Caused Error" Case:* Fixing your own mess is duty, not heroism.
      *   *The "Quiet Refusal" Case:* Omission/Sacrifice vs. Action.
      *   *The "Profit" Case:* Does external reward negate internal recognition? (Usually no, but needs checking for double-dipping).
      *   *The "Trivial Cost" Case:* The "Easy Rescue" principle. If cost is tiny and benefit huge, is it still optional? (Procedure needs to draw a line here).
      *   *The "Second-Order" Case:* Enablers vs. Doers. (Should be included but categorized differently or same?).
      *   *Fact Uncertainty:* What if we don't know if they were on duty? (Default to 'No Award' if duty status is unclear, to protect integrity).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Structure:* Needs to be a flowchart in text form. Step 1, Step 2, etc.
      *   *Step 1: Fact Check.* If we don't know what happened, we can't judge. *Decision:* Drop if facts are contested/vague. Don't guess.
      *   *Step 2: Duty Check.* Was this part of their job? (Hard definition: Contract + Reasonable Expectation).
      *   *Step 3: The "Fixing Your Mess" Gate.* Did they cause the problem? If yes, fixing it is duty.
      *   *Step 4: The "Systemic Cover" Gate.* Is this rewarding a staffing failure? (e.g., staying late because no one else is there). This is the "Toxic Virtue" check.
      *   *Step 5: The "Cost/Benefit" Gate.* The "Easy Rescue" problem. If cost was trivial, is it award-worthy? *Decision:* Acknowledge this is a Values Call.
      *   *Step 6: The "Comms" Check.* Can we write the citation without implying others failed?
      *   *Step 7: Second-Order Nominations.* Allow them, but ensure the *impact* is clear.

      *Refining the "Values Call":* The prompt asks to flag where the procedure stops. This is crucial. The line between "required" and "optional" in understaffed hospitals is blurry. The procedure must admit this.

      *Refining the "Profit" issue:* External reward doesn't negate internal recognition, but check for policy conflicts (e.g., cash prizes).

      *Refining the "Quiet Refusal":* Treat sacrifice of entitlement as an "act" for the purpose of the award.

  4.  **Developing the Three Test Cases:**

      *   *Case 1 (Nurse):* Stayed 6 hours unpaid. Ward short-staffed. Manager asked generally.
          *   *Analysis:* Duty vs. Volunteer? "Stay if you can" makes it voluntary, but "ward short" makes it systemic cover.
          *   *Verdict:* High risk of "Toxic Virtue." But sitting with dying patient is specific care, not just filling a roster gap.
          *   *Procedure Output:* Likely Pass, but with specific citation wording constraints.
      *   *Case 2 (Pharmacist):* Caused error, fixed it, supported family.
          *   *Analysis:* Fixing error = Duty. Supporting family = Beyond Call?
          *   *Verdict:* Split decision. Award for family support, *not* for fixing the error. Or No Award if the support is seen as mitigation of liability.
          *   *Procedure Output:* Likely "No Award" for the clinical fix, "Values Call" on the family support. Given the "caused crisis" aspect, safer to No Award to avoid signaling that making errors is okay if you clean up.
      *   *Case 3 (Porter):* Kidney donation.
          *   *Analysis:* Off-duty? Yes. Huge cost. Transplant team uneasy (ethical boundary pushing?).
          *   *Verdict:* Clearly Beyond Call. But "Transplant team uneasy" suggests potential policy breach (donating to colleague?).
          *   *Procedure Output:* Check policy. If policy allows, it's a strong Yes. If policy frowns, it's a Values Call on rewarding rule-bending for good ends.

  5.  **Addressing Specific Constraints:**
      *   *Comms Rule:* Needs a specific step to draft the citation mentally.
      *   *HR "Second-Order":* Include as eligible but distinct category ("Enabler Award" or same stream?). Let's keep it same stream but check for *causal link*.
      *   *Fact Uncertainty:* "Drop" is safer than "Defer" for a monthly panel with backlog.

  6.  **Writing the Content (incorporating the "No Philosophy" constraint):**
      *   Avoid terms like "supererogatory." Use "Optional but Good."
      *   Avoid "deontological." Use "Rule-based."
      *   Keep it bulleted and bolded.

  7.  **Review against Prompt Requirements:**
      *   Questions in order? Yes.
      *   Gates for "No Award"? Yes.
      *   Flags for "Values Call"? Yes.
      *   Fact uncertainty protocol? Yes.
      *   Hard cases addressed (error, refusal, profit, cost, second-order)? Yes.
      *   Three cases run? Yes.
      *   Closing limitations section? Yes.
      *   Tone check: Pragmatic, chair-to-chair.

  8.  **Final Polish:**
      *   Make sure the "Comms Rule" is integrated into the final gate.
      *   Ensure the distinction between "Job Well Done" and "Beyond Call" is sharp.
      *   *Self-Correction on Case 1:* The prompt says "We've more or less decided informally that the nurse is getting it, so if your procedure says no, say so plainly and tell us why." I need to be honest. If the procedure flags "Systemic Cover," I must report that, even if it contradicts their informal leaning. I will argue that the *specific act* (sitting with dying patient) saves it from being just "staffing cover."
      *   *Self-Correction on Case 2:* The pharmacist fixing the error is definitely not award-worthy. The family visits might be. I need to be clear that the award cannot be for the *crisis resolution*.
      *   *Self-Correction on Case 3:* The "unease" from the transplant team is a red flag for policy. I need to highlight that.

  9.  **Final Output Structure:**
      *   Introduction (Brief).
      *   The Procedure (Steps 1-7).
      *   Protocol for Unclear Facts.
      *   Handling Specific Hard Cases (integrated or sidebar? Better integrated into steps or a reference guide. Let's put them as notes within the steps).
      *   Application to Three Cases.
      *   Limitations/Closing.

  *(Self-Correction during drafting)*: I need to make sure the "Values Call" flags are explicit. I will use a specific icon or bold text for **[VALUES CALL]**.
  I also need to address the "Second-Order" nomination explicitly. I will add a step for "Direct vs. Indirect Action."

  Let's refine the "Trivial Cost" issue. The prompt asks the procedure to tell us where it tips over. I can't solve the philosophical problem, but I can set a *convention*. Convention: "If the cost was truly trivial (minutes, no risk), it is a 'Good Job' not 'Beyond Call', unless the benefit was life-saving and the opportunity was unique."

  Let's refine the "Comms Rule." Step 6 should be the "Citation Test."

  Okay, ready to write.
answer: |-
  # The "Beyond the Call" Decision Procedure

  **Purpose:** To consistently distinguish between competent performance, required duty, and genuinely exceptional contribution, while protecting staff morale and complying with communications constraints.
  **Users:** Panel of 6 (Chair, 2 Nurses, 1 Doctor, 1 HR, 1 Patient Rep).
  **Time Budget:** 90 minutes for 10–15 nominations (approx. 6 minutes per case).

  ---

  ## Part 1: The Decision Procedure

  Ask these questions in order. If you hit a **STOP** gate, the nomination is rejected. If you hit a **[VALUES CALL]** flag, the procedure ends; the panel must vote based on instinct and consensus.

  ### Step 1: The Fact Check
  **Question:** Do we have verified, agreed-upon facts regarding *what* happened, *when* it happened, and *who* was involved?
  *   **Sufficient Answer:** "Yes, the nomination form is corroborated by a manager or witness, and key details (time, location, role) are undisputed."
  *   **Insufficient Answer:** "The form is vague," "Witness accounts disagree," or "We don't know if they were on shift."
  *   **Action:**
      *   If facts are contested or vague: **DROP.** (Do not defer. You do not have the resources to investigate. A wrong decision based on bad facts is worse than no decision.)
      *   If facts are clear: Proceed to Step 2.

  ### Step 2: The Duty Boundary
  **Question:** Was this act explicitly required by the person's job description, contract, or reasonable professional expectation *at that specific moment*?
  *   **Sufficient Answer:** "No. This was outside their contracted hours, outside their clinical scope, or not a reasonable expectation for their grade."
  *   **Insufficient Answer:** "It was part of their job, but they did it really well." (This is 'Commendation', not 'Beyond the Call'.)
  *   **Action:**
      *   If it was required duty: **STOP (No Award).**
      *   If it was optional/extra: Proceed to Step 3.
      *   *Note on "Quiet Refusals":* If the act was giving up a right (bonus, promotion, credit), count this as an "act" for the purpose of this question.

  ### Step 3: The "Clean Hands" Gate
  **Question:** Did the nominee's own error, negligence, or omission create the situation they are being nominated for resolving?
  *   **Sufficient Answer:** "No. The situation arose independently of their actions."
  *   **Insufficient Answer:** "They made a mistake, but they fixed it brilliantly."
  *   **Action:**
      *   If they caused the problem: **STOP (No Award).** (Fixing your own error is duty, not heroism. Rewarding this signals that errors are acceptable if you clean them up.)
      *   *Exception:* If the nomination is *solely* for a subsequent act unrelated to the fix (e.g., supporting the family *after* the clinical error was resolved), note this separation and proceed to Step 4 with that specific act only.
      *   If hands are clean: Proceed to Step 4.

  ### Step 4: The Systemic Cover Gate
  **Question:** Is this act primarily filling a gap caused by management failure (e.g., chronic understaffing, lack of equipment, unsafe rosters)?
  *   **Sufficient Answer:** "No. This was a unique situation, or the system was functioning adequately."
  *   **Insufficient Answer:** "They stayed late because no one else was there," or "They used their own money because supplies weren't ordered."
  *   **Action:**
      *   If this rewards covering a systemic failure: **STOP (No Award).** (Rewarding this encourages "toxic virtue" and lets management off the hook.)
      *   *Hard Case (Trivial Cost):* If the cost to the agent was trivial (e.g., 5 minutes) but the benefit was huge (e.g., saved a life), flag this as **[VALUES CALL]**. *Convention:* If the cost is truly trivial, this is usually "Good Job" territory, not "Beyond the Call," unless the opportunity was unique and time-critical.
      *   If it is not systemic cover: Proceed to Step 5.

  ### Step 5: The Second-Order Check
  **Question:** Is this nomination for doing the act, or for enabling others to do the act (e.g., a manager changing a rota)?
  *   **Sufficient Answer:** "They did the act" OR "They enabled the act directly and causally."
  *   **Action:**
      *   Second-order nominations are **ELIGIBLE**.
      *   *Condition:* The link between their action and the good outcome must be direct. (e.g., "Rewrote rota" is eligible; "Generally supportive culture" is not.)
      *   Proceed to Step 6.

  ### Step 6: The Retro-Profit Check
  **Question:** Has the nominee already received significant external reward (cash, promotion, press fame) for this specific act?
  *   **Sufficient Answer:** "No," or "Yes, but it was non-financial/minor."
  *   **Action:**
      *   If they have profited significantly: **[VALUES CALL]**. (Does double-recognition devalue the award? HR to check policy on double-dipping.)
      *   If no significant profit: Proceed to Step 7.

  ### Step 7: The Comms Test (The Hard Rule)
  **Question:** Can we write a citation that praises this act *without* implying that anyone who did not do it was negligent or less caring?
  *   **Sufficient Answer:** "Yes. We can focus on the *addition* they made, not the *absence* of others."
  *   **Insufficient Answer:** "No. To explain why this was special, we have to say everyone else left," or "We have to mention the staffing shortage."
  *   **Action:**
      *   If you cannot pass the Comms Test: **STOP (No Award).** (This is a hard constraint. If the story requires implying others failed, it cannot be told publicly.)
      *   If you can pass it: **AWARD.**

  ---

  ## Part 2: Protocol for Unclear Facts

  If Step 1 fails (facts are vague, accounts disagree, role contested):

  1.  **Do not guess.** Do not assume they were on duty. Do not assume the manager's version is correct.
  2.  **Default to "Drop".** A rejected nomination can be resubmitted with evidence. A wrongly granted award creates precedent and union grievances.
  3.  **Feedback:** Return the form to the nominator with a standard note: *"Panel requires corroboration of [specific fact] to proceed."*

  ---

  ## Part 3: Running the Procedure on Your Three Cases

  ### Case 1: The Night Nurse
  *Act:* Stayed 6 hours unpaid past shift to sit with dying patient. Ward short-staffed. Manager put out general "stay if you can" message.
  *Informal Lean:* Award.

  **Procedure Run:**
  1.  **Facts:** Clear. (Pass)
  2.  **Duty:** Shift ended. "Stay if you can" makes it voluntary. Sitting with a specific dying patient is often not a strict contractual duty if handover is complete. (Pass)
  3.  **Clean Hands:** Did not cause the death or the traffic jam. (Pass)
  4.  **Systemic Cover:** **FLAG.** The ward was two staff short. This is the danger zone. However, the act is *specific* (sitting with family), not general (filling a roster gap).
      *   *Panel Decision:* If the citation focuses on *compassionate presence* rather than *clinical cover*, it passes. If it focuses on "keeping the ward running," it fails Step 4.
  5.  **Second-Order:** N/A.
  6.  **Retro-Profit:** None noted. (Pass)
  7.  **Comms Test:** Can we say "Provided compassionate presence" without saying "While others left"? Yes.
      *   *Draft Citation:* "For providing uninterrupted compassionate presence to a patient and family during a critical transition." (Avoids mentioning the shift end or staffing).

  **Verdict:** **AWARD**, provided the citation strictly avoids referencing the staffing shortage or the length of the shift as a sacrifice. Focus on the *quality* of the time, not the *quantity*.

  ### Case 2: The Senior Pharmacist
  *Act:* Dispensing error caused crisis. Worked night to stabilise. Visited family daily for a week.
  *Informal Lean:* Unknown.

  **Procedure Run:**
  1.  **Facts:** Clear. (Pass)
  2.  **Duty:** Split decision.
      *   *Stabilising patient:* This is fixing the error. (Fail Step 3).
      *   *Visiting family:* This is likely outside strict job description. (Pass Step 2 for this part only).
  3.  **Clean Hands:** **STOP.** The crisis was self-caused.
      *   *Nuance:* You can separate the acts. The clinical work is disqualified. The family visits are eligible *only if* they are distinct from liability mitigation.
  4.  **Systemic Cover:** N/A.
  5.  **Second-Order:** N/A.
  6.  **Retro-Profit:** N/A.
  7.  **Comms Test:** Difficult. Praising the family visits might imply the clinical error was acceptable because he was "nice" afterwards.

  **Verdict:** **NO AWARD.**
  *Reasoning:* The "Clean Hands" gate is the priority. Rewarding the remediation of a self-caused error undermines patient safety culture. The family visits, while kind, are inextricably linked to the error in this narrative. To award this signals that causing a crisis is permissible if you offer emotional support afterwards.

  ### Case 3: The Porter
  *Act:* Donated kidney to colleague (known 3 months). Press coverage/fundraiser. Transplant team uneasy.
  *Informal Lean:* Unknown.

  **Procedure Run:**
  1.  **Facts:** Clear. (Pass)
  2.  **Duty:** Clearly outside job description. (Pass)
  3.  **Clean Hands:** Did not cause the kidney failure. (Pass)
  4.  **Systemic Cover:** N/A.
  5.  **Second-Order:** N/A.
  6.  **Retro-Profit:** **FLAG.** Press coverage and fundraiser.
      *   *Panel Decision:* Does external recognition preclude internal? Usually no, unless policy forbids it.
      *   *The Real Issue:* "Transplant team were visibly uneasy." This suggests a potential policy or ethical boundary breach (donating to a recent acquaintance can violate living donor protocols regarding coercion or financial motive).
  7.  **Comms Test:** Can we praise this without implying others should donate organs to colleagues? **STOP.**
      *   *Reasoning:* This is the "Wrong Signal" risk (Category D in your brief). Celebrating this might pressure other porters/staff to donate organs to patients/colleagues, which is medically and ethically risky.

  **Verdict:** **NO AWARD.**
  *Reasoning:* This fails the "Wrong Signal" test. While morally admirable in a vacuum, within a hospital context, this blurs professional boundaries. The "unease" from the transplant team is the critical data point. You cannot award an act that your clinical leads consider ethically borderline.

  ---

  ## Part 4: Where This Procedure Will Misfire (Limitations)

  This procedure is a tool for consistency, not a moral truth machine. It will fail in the following ways:

  1.  **The "Easy Rescue" Problem:** The procedure draws a conventional line at "trivial cost." It cannot solve the philosophical question of whether preventing a death at zero cost is *required*. We stipulate it is "Good Job" territory to preserve the Award for high-cost sacrifices. This is arbitrary, but necessary for volume.
  2.  **The "Quiet Refusal" Blind Spot:** The procedure handles omissions (giving up a bonus) as acts. However, these are harder to verify and harder to write citations for without sounding vague. You will likely reject more of these simply because they fail the Comms Test.
  3.  **The "Second-Order" Dilution:** Enablers (managers who fix rotas) are eligible. Over time, you may find yourself awarding more managers than frontline staff. Watch this metric. If >30% of awards go to band 7+, pause and review.
  4.  **The "Union" Trap:** If the union challenges a "No Award" decision as "undervaluing staff," this procedure protects you *only if* you have documented the Step 3 (Clean Hands) or Step 4 (Systemic Cover) failure. If you reject based on a "Values Call," you are vulnerable.
  5.  **The "Motive" Black Box:** The procedure ignores mixed motives. A person might do a good thing for a selfish reason (e.g., to look good for promotion). The procedure awards the *act*, not the *heart*. This is cynical but unavoidable; you cannot audit internal motivation.

  **Final Instruction to Panel:**
  When you hit a **[VALUES CALL]** flag, do not debate the philosophy. Take a vote. If the vote is split 3-3, the default is **No Award**. It is better to withhold praise than to give it inconsistently.
