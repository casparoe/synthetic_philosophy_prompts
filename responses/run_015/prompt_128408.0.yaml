answer: |-
  Republican liberty should be understood as a protocol-level property governing interaction rules between agents, distinct from both the absence of interference and the capacity to act, even though scholars dispute whether this distinction holds under scrutiny.

  The settled baseline in political philosophy is Isaiah Berlin's distinction between negative liberty (freedom from interference) and positive liberty (freedom to self-govern), alongside Philip Pettit's formulation of republican freedom as "non-domination." Non-domination is not merely the absence of actual interference, but the absence of the *capacity* for arbitrary interference by another agent. Viewing this as a protocol-level property clarifies why it differs from Berlin's categories: in a distributed system, negative liberty is akin to having no packet drops during a specific session, whereas republican liberty is akin to having a cryptographic guarantee that no node possesses the admin key to drop your packets at whim, regardless of whether they actually use it. This structural guarantee focuses on the rules of interaction and the distribution of power rather than the outcome of any specific transaction.

  This framing is distinct from negative liberty because negative liberty is concerned solely with actual constraints on action. A slave whose benevolent master never interferes enjoys negative liberty but lacks republican liberty because the protocol of their relationship allows for arbitrary intervention. Conversely, this framing is distinct from positive liberty and capability approaches because it does not focus on the internal will of the agent or their material resources to achieve ends. A wealthy individual may have high capability to act (positive liberty) but still live under a legal protocol where a corrupt official can arbitrarily seize assets; under the republican view, they remain unfree despite their capacity, because the interaction rule permits domination.

  However, the philosophical consensus ends where the implementation requirements begin. It is genuinely contested among theorists whether maintaining this non-domination protocol inevitably collapses into negative liberty or requires positive capabilities. Critics like Robert Goodin argue that securing non-domination ultimately just amounts to securing non-interference through specific institutional means, suggesting the distinction is not as robust as proponents claim. Furthermore, while Pettit argues that non-domination is a status distinct from resource allocation, other scholars contend that without a baseline of material capabilities, agents cannot effectively resist domination, potentially merging the republican view with capability-based approaches. Therefore, while the protocol-level definition offers a precise structural distinction, the debate remains open regarding whether that structure can be sustained without invoking the very resource distributions characteristic of positive liberty.
