  Your four verdicts cohere under a single principle of asymmetric mitigation costs based on sensory filterability, though your first case regarding office lighting is the least defensible upon scrutiny.

  The unifying principle is that liberty extends to actions where the burden of avoidance falls more easily on the observer than the burden of restraint falls on the actor, unless the spillover constitutes an unfilterable physiological invasion causing significant functional harm. The clause distinguishing your verdicts is **filterability combined with harm severity**: visual spillovers (lights, paint) are easily blocked by the receiver via glasses or gaze aversion, preserving the actor's liberty, whereas airborne or vibrational spillovers (perfume, saxophone) invade the receiver's body directly and cannot be blocked without impairing basic function (breathing, hearing), shifting liberty to the receiver when harm is significant.

  Applied to Case 5, this account predicts Leo wins (closer to the door than the saxophone). While fan noise is vibrational and technically unfilterable without earplugs, the harm is defined as "slight annoyance" rather than wrecked focus, and the fan serves a physiological necessity (sleep aid) for Leo, making the mitigation cost for Priya (tolerating faint noise) lower than the cost for Leo (sleeping without white noise).

  Your least defensible verdict is Case 1. While visual light is filterable, migraines are a medical condition comparable to the scent-triggered migraines in Case 2; prioritizing Maya's preference for "bright overhead lights" over Noah's health requires assuming Noah's mitigation (tinted glasses or moving desks) is trivial, whereas in Case 2 you correctly identified that asking someone to stop breathing scented air is impossible. If Noah's migraines are genuine health issues, Case 1 creates an inconsistency where health loses to work preference in the visual domain but wins against style preference in the chemical domain.
