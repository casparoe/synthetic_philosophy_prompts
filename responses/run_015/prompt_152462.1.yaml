answer: |-
  This is a robust, recognizable Ideal Utilitarian profile (very close to G.E. Moore's *Principia Ethica* mixed with later Oxford Realism). It holds together better than most student drafts, but you have correctly identified the two classic pressure points where Non-Naturalist Consequentialism usually breaks.

  Here is the ranking of tensions by severity, an analysis of your specific worries, and the cheapest revision to secure the view for your seminar.

  ### 1. Ranked Tensions by Severity

  **Severity 1: The Epistemic Gap (Claims 1 + 3)**
  *   **The Tension:** You claim value properties are causally inert (1) and that evolution did not select for tracking them (3). This invites the **Benacerraf-Field Challenge**: If our cognitive faculties evolved to track survival (causal/natural) and value properties have no causal power, why should we trust our faculties to report truthfully about them?
  *   **Why it's severe:** In a seminar, this is the first question a metaethicist will ask. If you have no story for *how* we access these properties, the rest of the system floats in mid-air. Moore's original answer ("Intuition") is often dismissed as brute mysticism.
  *   **Verdict:** **Critical.** You need a bridge between natural minds and non-natural properties that doesn't violate causal closure.

  **Severity 2: Aggregation vs. Integrity (Claims 2 + 4)**
  *   **The Tension:** Claim 2 treats Friendship as an *organic unity* (the value lies in the specific relation). Claim 4 demands *maximization of total value*. This creates the **Integrity Objection**: If I can create slightly more total "friendship-value" by betraying my current friend to help two others, Claim 4 says I must. But Claim 2 implies the value is *in this specific relation*. Destroying the relation to maximize the sum seems to misunderstand the nature of the good identified in 2.
  *   **Why it's severe:** It makes your ethical theory self-defeating. If the highest good is a relational unity, a maximization principle that requires breaking such unities for the sake of the total undermines the source of value itself.
  *   **Verdict:** **High.** Moore himself struggled with this. You need to clarify that aggregation applies to *wholes*, not parts, and that existing high-value unities have weight.

  **Severity 3: The Status of Pleasure (Claim 5 vs. Moore)**
  *   **The Tension:** You ask if 5 is consistent with Moore. Moore argued pleasure *is* intrinsically good (just less so than complex wholes). You argue it has *no* value alone.
  *   **Why it's manageable:** This is not an *internal* contradiction in your system; it is a deviation from Moore's specific axiology. In fact, your version is **more consistent** with strict Non-Naturalism. By denying pleasure (a natural psychological state) intrinsic value, you avoid the charge that you are secretly naturalizing value.
  *   **Verdict:** **Low/False Alarm.** This is a feature, not a bug. It strengthens your non-naturalist credentials, even if it makes you a "stricter" Moorean than Moore.

  ---

  ### 2. Addressing Your Specific Worries

  **"Is 4 sneaking in aggregation that conflicts with treating friendship in 2 as a unique, non-decomposable relational good?"**
  *   **Yes, potentially.** If "maximize total" implies you can break a friendship into units of value and trade them, you violate Claim 2.
  *   **The Fix:** You must specify that the *unit of aggregation* is the **Organic Unity itself**, not the components. You sum the *friendships*, you don't sum the *affections*. Furthermore, if Friendship is the *highest* good (Claim 2), your maximization principle (Claim 4) should imply a **lexical priority**: one instance of the highest good cannot be traded for any quantity of lower goods.

  **"Is 5 consistent with Moore allowing pleasure as part of an organic whole?"**
  *   **Yes.** Moore's theory of Organic Unity states that the value of a whole is not proportional to the sum of its parts.
      *   *Moore:* Pleasure (Good) + Consciousness (Good) = Whole (Very Good).
      *   *You:* Pleasure (Neutral) + Consciousness (Good) = Whole (Very Good).
  *   Both are logically compatible with the *structure* of organic unity. Your view just makes the "emergence" of value even more radical, which fits your Non-Naturalist stance in Claim 1.

  **"If properties don't causally interact and evolution ignored them, how do I access them?"**
  *   **The Problem:** You are currently relying on a "Pre-established Harmony" luck story.
  *   **The Fix:** You need to claim evolution selected for **Rational Competence**, not value tracking. We evolved to reason logically; non-natural truths are apprehended by reason, not perception. Evolution gave us the *tool* (reason), even if it didn't care about the *object* (value).

  ---

  ### 3. The Cheapest Revision to Save the Core

  To survive the seminar without overhauling your system, make this specific tweak to **Claim 3** and add a qualifier to **Claim 4**.

  **Revision A (Epistemology - The "Rational Faculty" Defense):**
  *   *Current Claim 3:* "...non-natural properties have no causal powers, so natural selection never targeted them."
  *   *Revised Claim 3:* "...non-natural properties have no causal powers, so natural selection did not target *the properties themselves*. However, selection **did target our rational capacities**, which are the necessary faculty for intuiting non-natural truths."
  *   *Why:* This answers the debunking argument. We aren't reliable because evolution tracked truth; we are reliable because evolution tracked *coherence*, and value truths are apprehended via coherence/reason.

  **Revision B (Ethics - The "Lexical Constraint"):**
  *   *Current Claim 4:* "...maximize total intrinsic value across all organic unities..."
  *   *Revised Claim 4:* "...maximize total intrinsic value... **subject to the constraint that existing highest-order organic unities (friendships) cannot be sacrificed for lower-order goods.**"
  *   *Why:* This preserves the "specialness" of friendship (Claim 2) without abandoning consequentialism. It prevents the "sacrifice one friend for two acquaintances" objection.

  ### Summary Recommendation for Presentation
  1.  **Keep Claim 5.** It makes your view more defensible against Naturalism. Just acknowledge it's a "strict" reading of Moore.
  2.  **Adopt Revision A immediately.** If you walk in claiming evolution *never* targeted the faculties we use to know value, you will lose the metaethics portion of the Q&A.
  3.  **Pre-empt the Aggregation Objection.** When presenting Claim 4, verbally add the constraint from Revision B. Say: *"Because friendship is an organic unity, we maximize by preserving these unities, not by decomposing them."*

  This keeps your profile 90% Moorean but plugs the two holes that would otherwise sink the ship.
