prompt: |-
  ok so for my aesthetics/ethics semenar i need to check if my moorean-ish profile actually holds together before i present. heres where i stand:

  1. good and beauty are simple non-natural properties, not reducible to pleasure or desire.
  2. friendship is the highest intrinsic good, and its value is an organic unity — the consciousness, affection, and aesthetic quality of the relation make the whole greater than its parts.
  3. evolutionary debunking fails for value judgments because non-natural properties have no causal powers, so natural selection never targeted them.
  4. right action should maximize total intrinsic value across all organic unities, weighing them globally.
  5. pleasure has no value on its own; it only counts inside a beautiful friendship or experience.

  which pairs are actually in tension? im especially worried that 3 plus 1 leaves me with no epistemic story — if these properties dont causally interact and evolution ignored them, how do i acces them? and is 4 sneaking in aggregation that conflicts with treating friendship in 2 as a unique, non-decomposable relational good? is 5 consistent with moore allowing pleasure as part of an organic whole?

  rank the real tensions by severity, flag any that only look bad, and tell me the cheapest revision that saves the core moorean view.
