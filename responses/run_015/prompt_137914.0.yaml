      *   *(a) vs (b):* User's worry. (a) says blamer's record doesn't matter for *aptness*. (b) says standing matters for the *objection*. This is the standard Aptness/Standing distinction (Wallace, Bell, etc.). Seems consistent *if* defined sharply.
