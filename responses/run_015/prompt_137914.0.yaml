      *   (c) **No Clean Hands:** Same/similar wrongdoing doesn't defeat standing. Blame isn't a privilege of compliance. Structural wrongs need criticism even from complicit parties.
      *   (d) **Hypocrisy:** Defeats standing. Defined as invoking a norm one exempts oneself from (unwilling to be governed by). Distinct from mere wrongdoing/insincerity.
      *   (e) **Avowal:** Sufficient for restoration. Owning the mismatch restores standing *without* reform/cessation.
      *   (f) **Verdict 1 (Smoking Mother):** Lacks standing. Candor/avowal ("I can't stop") does *not* help.
      *   (g) **Verdict 2 (Newspaper vs. Employee):** Newspaper lacks standing (ads vs. editorials). Employee retains standing (fraud participant/cooperator).
