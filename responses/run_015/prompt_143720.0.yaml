answer: |-
  **Project Title:** Looping Behind the Curtain: How Clinical Trial Design Hacks the DSM

  **The Gist**
  Ian Hacking's "looping effects" are pretty famous in philosophy of science. The basic idea is that when you classify people (like "borderline personality disorder"), they internalize that label, change their behavior, and then the classification has to change to catch up. It's a feedback loop between the label and the person.

  But I think there's a second loop running underneath that nobody's talking about. It's not about the patient changing; it's about the *trial population* changing. When DSM-5 dimensional scores for personality disorders get used as hard inclusion/exclusion gates in pharma studies, the trial population shifts. That skewed population then generates the normative data used to revise the cutoffs later. So the loop isn't just Classification -> Identity -> Behavior. It's Classification -> Recruitment Criteria -> Prevalence Distortion -> Revised Dimension -> New Classification.

  This proposal is for a 3-month summer grant to map this mechanism. I'm not running the actual study; I'm building the prospectus that shows *how* this backend loop works.

  **The Two-Tier Mechanism**
  Here's the precise breakdown of what I'm tracking:

  1.  **Tier 1 (The Classic Loop):** The patient gets labeled. They act differently because of the label. Clinicians see the new behavior and tweak the definition. (Hacking's original model).
  2.  **Tier 2 (The Trial Design Loop):** The DSM sets a dimensional cutoff (e.g., "Score > 50 on Trait X"). Pharma uses this as an exclusion gate to get a "clean" sample. This removes high-complexity patients from the data set. The trial results are published based on this sanitized sample. Future DSM working groups use that data to set new norms. The cutoff moves, not because people changed, but because the recruitment criteria filtered out the noise.

  **Why the Literature Misses This**
  Existing looping-effect literature is obsessed with the clinic and the subject. Philosophers look at how patients talk about themselves. Sociologists look at how doctors diagnose. Nobody looks at the *protocol inclusion criteria* as an active variable.

  We treat trial recruitment as a neutral filter—like a sieve that just catches the right people. I'm arguing the sieve changes the shape of the grain. By the time this gets to the literature, the distortion is baked in as "efficacy data," not "sampling bias." The recruitment channel is invisible because it happens in the dark room of trial design before the data ever sees the light.

  **The 3-Month Plan**
  Three months is tight, so I'm not trying to prove the loop exists empirically. I'm trying to trace the wiring. I'm comparing Personality Disorders (PD) against ADHD. PDs are moving toward dimensional models in DSM-5/AMPD, while ADHD is still mostly categorical gates.

  *   **Month 1: Mapping the PD Gates.**
      I'll pull recent clinical trial protocols for personality disorder interventions (mostly pharmacological). I'm looking for where dimensional scores are used as hard stops. If a trial excludes anyone with a trait score above X, that's a data point. I'll catalog how many trials use dimensional cutoffs vs. categorical diagnoses.
  *   **Month 2: The ADHD Control.**
      I'll do the same sweep for ADHD trials. Since ADHD still relies heavily on categorical inclusion (You have it or you don't), the looping mechanism should look different. Maybe it loops slower? Maybe it loops through symptom checklists instead of trait dimensions? I want to see if the *type* of gate changes the *shape* of the loop.
  *   **Month 3: Synthesis and Diagramming.**
      I'll write up the mechanism. The goal is a clear diagram showing where the data flows from the trial back into the DSM revision process. I'll draft the argument that Tier 2 looping might actually be stronger than Tier 1 looping in modern psychopharmacology.

  **Success vs. Failure**
  *   **Success:** I produce a clear map of the feedback cycle. I can show specific instances where trial exclusion criteria likely skewed the normative data used in subsequent DSM updates. The final paper argues convincingly that trial design is a constitutive part of the classification system, not just a test of it.
  *   **Failure:** Pharma transparency is worse than I think. If trial protocols don't publicly list the specific dimensional cutoffs used for exclusion, I hit a wall. Or, if the DSM working group minutes don't show where they got their normative data, I can't close the loop. In that case, the result is just a theoretical claim without the paper trail to back it up.

  **Honest Feasibility Check**
  Is 3 months enough to do anything beyond mapping the mechanism? No. Definitely not.

  To actually prove this, I'd need access to raw trial data and DSM working group emails, which isn't happening on a summer grant. I'm not measuring the distortion; I'm just showing where the measuring tape is bent.

  But that's actually okay. The value here isn't in the empirical proof—it's in shifting the frame. If I can show that recruitment criteria are part of the looping effect, that changes how we read the literature. Even if I only get the diagram and the argument down, that's a solid contribution. It turns "methodological limitation" into "ontological engine."

  So, realistic outcome: A strong theoretical prospectus and a map of the mechanism. I won't solve the replication crisis, but I might explain why the categories keep moving even when the patients stay the same.
