  9.  **Final Polish:** Organize into clear sections: The Translation, The Residue Report, The Verdict. Ensure the voice sounds like a collaborator, not a textbook. (Self-correction: Ensure I don't sound *too* much like an AI myself. Keep it grounded.)

  *(Self-Correction on the "Optimization" point)*: I need to be careful. In RL, you optimize the policy. In IRL, you infer the reward. The user asks about optimizing the *inferred motive*. In ML, if you infer a reward and then optimize an agent against it, you get "Reward Hacking." In fiction, if you make a character perfectly optimize their motive, you get a sociopath or a plot hole. This is a crucial distinction.

