      *   **Rationality Assumption:** We assume the agent is trying to maximize reward (is rational/near-optimal). If they act randomly, we can't infer anything.
      *   **Regularization/Priors:** We prefer simpler reward functions (Occam's razor) to avoid overfitting noise.
      *   **The "Understudy Problem" (in ML terms):** Identification problem / Non-identifiability. Multiple reward functions fit the data.
      *   **Optimization:** Once you have the reward, you usually train a new policy to maximize it (which can lead to "reward hacking" or unintended consequences).

  3.  **Map ML Concepts to Novelist Vocabulary:**
      *   *Agent* $\rightarrow$ Character.
      *   *Policy/Behavior* $\rightarrow$ Actions/Dialogue/Blocking (the text on the page).
