  4.  **Drafting the Translation (The "Setup" and "Moves"):**
      *   *Goal:* Explain IRL without math, using "scene," "beat," "subtext."
      *   *Concept:* You watch the character move through scenes. You ask, "What goal makes *this* specific sequence of actions the best way to get there?"
      *   *The "Near-Optimal" Assumption:* In ML, if the agent is dumb, you can't learn. In fiction, if the character is incoherent, the book fails. So, assuming coherence is the novelist's version of assuming rationality.
      *   *Handling Ambiguity:* ML uses "priors" (simple is better). Novelist uses "genre" and "theme."
      *   *The "Understudy Problem":* ML calls this "Non-identifiability." There are infinite reward functions that fit the data. ML people panic about this. Novelists pick the one that makes the *book* better (aesthetic utility vs. truth).

  5.  **Drafting the Residue Report (The Critical Analysis):**
      *   *Fit:* "Near-optimal" $\approx$ "Coherent." Both are necessary assumptions to make sense of data/text.
      *   *Fit:* "Reward" $\approx$ "Want + Extrapolation License." It's not just the immediate want; it's the rule that generates wants in *unwritten* scenes.
      *   *The Understudy Problem:* ML calls it "Non-identifiability." They try to solve it with more data or constraints. The novelist solves it with *taste* (which ML lacks).
