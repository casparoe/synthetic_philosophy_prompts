answer: |-
  This phenomenon lacks a universal label but is best defined as **Evidentiary Drift**, the gradual hardening of archival absence into historical fact through iterative citation.

  While rooted in **survivorship bias**, that term describes the statistical error of focusing on surviving data, not the downstream textual process where a qualified gap becomes an unqualified fact. It is distinct from the **argument from silence** because the initial historian often acknowledges the gap; the error lies in the transmission, where subsequent writers drop the caveat until the limitation disappears entirely. It also differs from **archival silence** (à la Trouillot), which concerns how power shapes what is recorded at the source, whereas this concerns how scholars reshape what was *not* recorded during reception.

  The line between the harmless and the worrying version falls on **ontological commitment**. The harmless version uses absence as a methodological shorthand ("no record exists in the surviving files") while acknowledging the fragmentary nature of the archive. The worrying version makes an ontological claim ("no event occurred") based on that absence. You cross the line when the caveat regarding the archive's completeness is severed from the claim, converting a statement about *documentation* into a statement about *reality*.

  To check for this before leaning on a secondary source, perform a **caveat trace**. Identify the specific claim of absence (e.g., "no resistance recorded"), then trace the citation chain backward to the earliest source making that claim. Verify if the original source attached a condition to the silence (e.g., "files destroyed," "reels unreadable"). If the condition appears in the primary audit but vanishes in the secondary literature, you are observing drift. Finally, consult the archive's finding aids or destruction logs directly; if the gap has a physical cause (fire, decay, missing microfilm), any claim of historical quietude based on that gap is evidentiary drift, not historical fact.
