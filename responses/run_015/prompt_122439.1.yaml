answer: |-
  You have independently rediscovered a specific and sophisticated problem in the metaphysics of personhood. You are correct that standard "Narrative Identity" (as often discussed in pop psychology or basic ethics) focuses too much on the *internal* story the agent tells themselves. Your intuition is that the "person" is a **relational object** sustained by a web of narratives, not all of which originate in the subject.

  There is no single canonical term that captures your description perfectly, but you are describing a hybrid of **Daniel Dennett's "Center of Narrative Gravity"** and **Marya Schechtman's "Person Life View,"** grounded in a **Social Ontology**.

  Since you asked for an account with edges rather than just a label, I will construct the definition based on the philosophical machinery that best fits your three cases, using your engineering background to clarify the persistence conditions.

  ### 1. The Concept: Narrative-Relational Personhood

  The "thing" you are tracking is not the organism (the body), nor the psyche (the mind), but the **socially sustained narrative locus**.

  In philosophy, this is often treated as a form of **Social Ontology**. Just as "money" is not the paper but the status we collectively agree to assign the paper, "the person" (in the sense your mother is using) is not the brain but the status assigned to the organism when it occupies a specific slot in a web of interpersonal narratives.

  **Closest Established Concepts:**
  *   **Dennett's Center of Narrative Gravity:** Dennett argues the "Self" is a fictional abstraction, like a center of gravity. It is a useful point around which we organize predictions and interpretations. It exists only as long as the interpretation holds.
  *   **Schechtman's Person Life View:** She argues that to be a person is to live a "person life," which is defined by participation in a web of social practices (promises, debts, relationships). If you can no longer participate in that web *even via proxy*, the person life ends.

  **How your description differs:**
  Standard Narrative Identity theory often implies the subject must be the *author* of the story. Your cases (Dementia, Coma) show the subject can be the *object* of the story, maintained by others. You are describing **Personhood as a Distributed Consensus Protocol**.

  ### 2. Persistence Conditions (The "Uptime" Requirements)

  For this entity to persist, three conditions must be met. If any fail, the "person" (in this specific sense) ceases to exist, even if the body lives.

  **A. Narrative Coherence (The "Lint Check")**
  There must be a coherent way to integrate the entity's current state into a temporal arc that connects past to future.
  *   *Case 1 (Dementia):* When the father acts randomly, the "lint check" fails. The code doesn't compile. When a mannerism surfaces, it matches a legacy function, the code compiles, and "he" exists again.
  *   *Case 2 (Re-description):* You changed the refactoring logic. The code (past actions) is the same, but the build output (current identity) changes because the dependency tree (the meaning of the action) was updated.

  **B. Social Uptake (The "Handshake")**
  The narrative must be accepted by the relevant community. A story told in a vacuum does not sustain personhood.
  *   *Case 3 (Coma):* The "handshake" is kept alive by the bank, family, and employer. They treat the *slot* as occupied. The thread is sleeping, not killed.
  *   *Contrast:* If a hermit goes into a coma and no one knows they exist, their "narrative personhood" effectively dissolves because no one is holding the socket open.

  **C. Functional Continuity (The "API Contract")**
  There must be outstanding obligations or potentials that bind the past to the future.
  *   *Case 3:* Debts and promises are API contracts. As long as the system expects a response (payment, work), the endpoint is considered active.
  *   *Case 1:* When the father can no longer fulfill *any* role (husband, father, friend) even passively, the API returns 404.

  ### 3. Cessation Conditions (When does it stop?)

  The entity stops existing when the cost of maintaining the narrative exceeds the social utility, or when the narrative becomes incoherent regardless of interpretation.

  *   **Not Death:** Biological death is a hardware failure. This entity can survive hardware failure (e.g., we still speak of a dead person's wishes, debts, and legacy for a time).
  *   **Not Sleep/Coma:** These are `suspend` processes. The context is saved in the social RAM of others.
  *   **True Cessation:** Occurs when the community *gives up* the story. In dementia, this is often the "long goodbye." The moment the mother stops saying "there he is" permanently, and begins speaking of him only in the past tense regarding the body, the narrative personhood has been garbage collected.

  ### 4. Error Conditions (Can we get it wrong?)

  Yes. This is crucial. If personhood is a story, can it be a *false* story?

  *   **Gaslighting/Imposition:** If a family tells a story about a patient ("He is peaceful," "He would want this") that contradicts all available evidence of the patient's prior values, they may be sustaining a *fiction*, not a person.
  *   **The "Wrong" Person:** You can be wrong about *which* narrative applies. Example: Imposter syndrome. You feel you are a fraud (narrative: "I don't belong here"), but the social consensus is "You are a competent engineer." Who is right?
      *   *Resolution:* In this framework, the **Social Consensus** usually overrides the Internal State for *personhood* status, though not for *well-being*. If everyone treats you as a person, you are one, even if your internal story is broken. Conversely, if you are treated as an object (dehumanization), your personhood is under attack, regardless of your internal state.

  ### 5. The Edge Case: Conflicting Stories (The "Fork")

  You asked: *If two incompatible but competently maintained stories are told about the same life... do we have two of these things?*

  This is the **Merge Conflict** scenario.

  **Scenario:** A transgender individual transitions.
  *   *Story A (Self):* "I am a woman. My past is re-narrated as a journey to this."
  *   *Story B (Family):* "He is my son. This is a phase/delusion. The past is a history of a boy."

  **Analysis:**
  In your framework, this creates a **Split-Brain Personhood**.
  1.  **Are there two entities?** Ontologically, yes. There are two distinct narrative loci competing for the same physical resource (the body).
  2.  **Priority:** Priority is not determined by truth (since both are coherent narratives), but by **Authority and Dependency**.
      *   *Legal/Medical Context:* The Self-Story usually gains priority (autonomy rights).
      *   *Social/Family Context:* The Family-Story may persist in that subnet.
  3.  **Resolution:** The system resolves this not by finding the "true" person, but by **pruning the network**.
      *   If the individual cuts contact with the family, the Family-Story loses its ability to interact with the physical resource. It becomes a "ghost process"—a story about someone who is no longer in the system.
      *   If the family succeeds in institutionalizing the individual against their will, the Family/State Story overwrites the Self-Story. The "person" that existed in the Self-Story is effectively terminated, even if the body lives.

  **Verdict on the Edge Case:**
  You do not have one person in an inconsistent state. You have **two competing personhoods fighting for control of the biological substrate.** The "winner" is determined by who controls the physical access and the legal levers. This explains why these conflicts feel so violent; it is not just a disagreement, it is a contest for ontological survival.

  ### Summary Definition

  The thing you are looking for is **Narrative-Relational Personhood**.

  *   **What it is:** A status conferred upon a human organism when it serves as the anchor point for a coherent, socially-uptaken narrative arc connecting past obligations to future potentials.
  *   **Persistence:** Lasts as long as the narrative can be maintained by *someone* (self or other) without logical collapse or social abandonment.
  *   **Location:** Distributed across the mind of the subject and the minds of their community.
  *   **Failure Mode:** Occurs when the narrative becomes impossible to tell (advanced dementia) or when the community refuses to tell it (ostracization/death).
  *   **Conflict:** Incompatible stories create competing personhoods; resolution is political/practical, not metaphysical.

  This view treats "being a person" not as a biological fact, but as a **service** provided by a community to an organism. When the service stops, the person is gone, even if the machine is still running.
