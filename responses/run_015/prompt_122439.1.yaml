      *   **Cessation:** When the narrative becomes impossible to sustain (not just hard, but *incoherent*).
      *   **Error Conditions:** Can we be wrong? Yes, if the narrative is factually untethered or maliciously imposed (gaslighting).
      *   **The Edge Case (Conflicting Stories):** This is the "fork in the repo" analogy.
