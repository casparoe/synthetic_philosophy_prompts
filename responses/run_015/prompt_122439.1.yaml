      The user's intuition is that *Personhood* is a status conferred by the viability of a narrative within a community, not just inside the skull.

  7.  **Drafting the Response:**

      *   **Acknowledge the Insight:** Validate that this is a deep philosophical problem (The Problem of Personal Identity) and that their intuition is sophisticated.
      *   **Identify the Closest Concepts:**
