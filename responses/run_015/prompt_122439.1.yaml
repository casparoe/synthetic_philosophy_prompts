      *   **Core Intuition:** There is a "locus" of personhood that persists based on the viability of a *narrative* or *story* about the person, regardless of physical continuity, memory, or specific traits. It depends on whether a coherent story can be "got going" (by self or others).
      *   **Three Cases:**
          1.  *Dementia:* Father is "gone" when the story breaks, "back" when a mannerism allows the story to resume.
          2.  *Re-description:* Changing the story of a past event changes the *current* person/action, even if facts don't change. Other changes (politics, tastes) don't count as "different person" because they aren't narrated as such.
          3.  *Coma:* Person persists despite no active narration, because the *potential* for the story (debts, promises, job) remains attached.
      *   **Constraints/Exclusions:** Not "narrative identity" (in the narrow self-telling sense), not soul, not psychological continuity (Lockean), not legal personhood, not just traits.
      *   **Specific Questions:**
