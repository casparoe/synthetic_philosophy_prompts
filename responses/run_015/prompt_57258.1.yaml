  ok so I run a little logic reading group and I want to open next week's session with a joke about intuitionism vs classical logic, and I cant quite land the ending. Here's the setup I've got, feel free to rework it however: a classical mathematician and an intuitionist are stuck somewhere — a bar at closing time, a lifeboat, a broken elevator, your call — and the classical one keeps announcing that he's proved there's a way out, but can never actually say what it is, because his whole proof went through a contradiction. The punchline needs to turn on the real technical point, that you cant get from ¬¬A to A in intuitionistic logic, so a nonconstructive existence proof leaves you with nothing to point at. No generic nerd-joke filler — someone who's built a Kripke model or pushed a natural deduction proof around should hear the punchline and think "yes, that's exactly right."

