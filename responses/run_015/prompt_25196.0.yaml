  ### The New Case: 5-Sigma Physics Discovery

  **Scenario:** A physics experiment yields a 5-sigma result ($p \approx 3 \times 10^{-7}$) for a phenomenon not ruled out by known law. Stakes are large but finite (e.g., funding a new collider, revising a standard model).

  **Verdict under EGM:** **Act on the Expected Utility.**

  **Explanation:**
  1.  **Causal Plausibility:** The phenomenon is "not ruled out by any known law." It fits within the space of physical possibility, unlike the mugger's "secret powers."
  2.  **Model Reliability:** In high-energy physics, 5-sigma is the gold standard for **Model Reliability**. It is a calibrated metric specifically designed to account for look-elsewhere effects and systematic errors in this domain. Unlike Case 6 ($p < 0.01$), a 5-sigma result is generally accepted as a robust probability estimate within the physics community.
  3.  **Application:** Because the probability is grounded and the stakes are finite, the **Condition of Causal-Epistemic Grounding** is met. You are now in the domain of Risk, not Ambiguity.
  4.  **Decision:** You should calculate the EV. If the expected benefit of the discovery (new technology, theoretical unity) outweighs the cost of the follow-up (or the cost of being wrong), you proceed. You do *not* apply the Pascal's Mugging skepticism here.

  **Contrast with Case 6:** The difference is the strength of the evidence relative to the prior. In Case 6, $p < 0.01$ was insufficient to overcome the prior of an established theory. In the New Case, 5-sigma is specifically the threshold chosen to overcome such priors. EGM respects the epistemic norms of the specific domain (physics) regarding what counts as "grounded."

  ---

  ### What You Are Giving Up

  Adopting the **Principle of Epistemically Grounded Maximization** requires you to explicitly abandon two tenets of orthodox decision theory:

  1.  **The Universality of Expected Utility:** You must accept that EUT is not a universal law of rationality. It is a tool that is only valid when the inputs (probabilities) are epistemically secure. You are giving up the idea that a "correct" calculation can rescue a decision based on wild speculation.
  2.  **Probabilistic Sophistication:** In standard theory, if you prefer A to B, you must have a coherent probability distribution that explains why. Your intuitions (rejecting the Mugging but accepting the Lottery) violate the axioms of Savage or Anscombe-Aumann because you treat "grounded" probabilities differently from "ungrounded" ones. You are accepting that **source matters**, not just magnitude.

  ### Summary

  Your intuitions commit you to **Epistemically Grounded Maximization**. You are a **Bayesian Conservative** regarding belief (Case 6) and an **Ambiguity Averter** regarding decision (Case 1, 5), but a **Standard Maximizer** when the physics and statistics are solid (Case 2, 4, New Case).

  This is a coherent position. It protects you from Pascal's Mugging without forcing you to ignore genuine existential risks (Case 4) or scientific discoveries (New Case). The price is admitting that rationality is partly a function of the *quality of your evidence*, not just the *math of your outcomes*.
