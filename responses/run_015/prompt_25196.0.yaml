answer: |-
  Your intuitions are not idiosyncratic; they reflect a sophisticated tension that arises when Expected Utility Theory (EUT) meets epistemic humility. As an experimental physicist, you are acutely aware that a probability number is only as good as the model that generates it. Your philosophical intuitions are tracking the difference between **Risk** (uncertainty with a known, grounded probability distribution) and **Knightian Uncertainty** or **Ambiguity** (uncertainty where the probability model itself is unreliable or unspecified).

  Standard EUT treats all probabilities as equal inputs. Your verdicts suggest you believe they should not be. You are implicitly adhering to a principle that restricts the domain of EUT to cases where the probabilities are **epistemically robust**.

  Here is the principle that best captures your pattern of verdicts, followed by an analysis of your cases and the new scenario you proposed.

  ### The Principle: Epistemically Grounded Maximization (EGM)

  **Statement:**
  An agent is rationally required to maximize Expected Utility if and only if the probability assignments used in the calculation satisfy the **Condition of Causal-Epistemic Grounding**. Where this condition is not met, the agent is rationally permitted (or required) to default to the status quo or a precautionary heuristic, regardless of the calculated expected utility.

  **The Condition of Causal-Epistemic Grounding has two clauses:**
  1.  **Causal Plausibility:** The causal mechanism linking the action to the outcome must be consistent with well-confirmed background theories (e.g., established physics, biology, statistics). Claims requiring "secret powers" or metaphysical causation fail this clause.
  2.  **Model Reliability:** The probability estimate must be derived from a validated statistical model or empirical frequency, not from subjective testimony, speculation, or uncalibrated p-values in high-prior contexts.

  ---

  ### Application to Your Cases

  This principle preserves most of your verdicts by distinguishing *why* you accept the math in some cases but not others.

  *   **Case 1 (Mugging) & Case 5 (Religion):** **Rejected.**
      *   **Reason:** Both fail **Causal Plausibility**. "Secret powers" and theological causation are not consistent with well-confirmed background theories. The probability estimates ($10^{-15}$ or "indistinguishable from zero") are subjective guesses, not model-derived frequencies. EGM suspends EUT here; you default to the status quo (keep your money/do not convert).
  *   **Case 7 (Many Muggers):** **Rejected.**
      *   **Reason:** Replication of a causally implausible claim does not ground the model. If the mechanism is impossible, 1,000 claims of it do not make it possible. This preserves your intuition that independence doesn't help when the *prior model* is broken.
  *   **Case 2 (Lottery):** **Permitted (EUT applies).**
      *   **Reason:** Passes **Model Reliability**. Lottery odds are derived from a known combinatorial mechanism and regulated statistical processes. Even if the probability is tiny, it is *grounded*. Therefore, EUT applies, and a positive EV ticket is rational (even if you personally decline due to risk aversion).
  *   **Case 3 (Asteroid) & Case 4 (Longtermist Asteroid):** **EUT Applies to Both.**
      *   **Reason:** Both pass **Causal Plausibility** (asteroid physics is well-confirmed) and **Model Reliability** (impact frequency is based on geological record).
      *   **Verdict:** Here, EGM allows standard EUT to do the work.
          *   In **Case 3**, the EV is terrible ($7B per life saved). Rejection is rational on standard cost-effectiveness grounds.
          *   In **Case 4**, the EV is significantly better ($500k per life saved). Acceptance is rational.
      *   **Addressing your "Hard Pair":** You noted that Case 4 feels worth considering "beyond what the expected-value arithmetic captures." EGM explains this as a **Lexical Priority for Existential Continuity**. While EUT governs the calculation, many adherents of EGM add a secondary heuristic: *If the stakes involve the permanent termination of the value-bearing process (human extinction) and the probability is grounded, cost-effectiveness thresholds may be relaxed.* This explains why $500k/life feels "worth considering" for extinction prevention, whereas it would be rejected for standard health interventions.
  *   **Case 6 (Lab Result):** **Rejected (Skepticism).**
      *   **Reason:** Fails **Model Reliability** in context. While $p < 0.01$ is a statistical output, you note that in this specific context (overturning established theory), the *true* false-positive rate is much higher. Your background prior (the established theory) is strong. EGM requires you to weight the probability by the reliability of the model generating it. Since the model (the specific experiment) is known to be noisy relative to the prior, you do not update enough to act.

