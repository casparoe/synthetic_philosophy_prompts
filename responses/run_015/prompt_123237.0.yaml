      *   *Case 2: The Bank Run (The "Self-Defeating Investigation").*
          *   Scenario: Checking solvency causes insolvency.
          *   Peirce: Ideal inquiry assumes the object doesn't change *because* of the inquiry (or accounts for it). But if the act of knowing changes the fact, the "final opinion" is unstable. Peirce needs a stable reality.
          *   James: The belief "the bank is solvent" is true *until* I act. Acting makes it false. Truth is mutable.
          *   *Verdict:* This is strong. Peirce struggles with reflexive instability in the limit. James embraces the flux. But Peirce could argue the "truth" is the conditional: "If no one checks, it is solvent."
      *   *Case 3: Terminated Inquiry (The "Extinction").*
          *   Scenario: Inquirers die out. The limit is never reached.
          *   Peirce: Truth is the opinion *fated* to be agreed upon *if* inquiry continued. If inquiry stops, the truth remains (as a counterfactual).
