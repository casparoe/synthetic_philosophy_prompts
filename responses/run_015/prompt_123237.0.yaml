      *   *The Impasse:* It looks like a clash between *Realism* (Peirce's limit is independent of *my* current whim, though dependent on *community's* limit) and *Instrumentalism/Verificationism* (James's truth is tied to *my* current experiential payoff).
      *   *Is it Verbal?* Often accused of being so. "Truth" might mean "Ideal Warrant" for Peirce and "Current Warrant + Utility" for James. But Peirce insists on the *fated* nature, which implies a mind-independent constraint. James insists on the *living* nature, which implies a mind-dependent construction.
      *   *Is it Substantive?* Yes, regarding the metaphysics of the world (does it dictate a single outcome?) and the normativity of belief (ought we aim for the limit or the payoff?).
      *   *Diagnosis:* It is a **substantive disagreement about the normativity of inquiry masked as a semantic debate about the definition of truth.** They aren't just defining "truth" differently; they are prescribing different *goals* for cognitive agents. Peirce prescribes alignment with a convergent reality; James prescribes successful navigation of experience.

