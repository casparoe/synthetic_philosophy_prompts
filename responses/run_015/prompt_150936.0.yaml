answer: |-
  # Causal Narrative Audit Protocol (CNAP)
  **Version:** 1.0 | **Unit:** Senior Review Office | **Time Allocation:** 120 Minutes per Report

  ## 1. Purpose and Scope
  This procedure is a logical filter, not an empirical research design. It is designed to screen country-level causal narratives for methodological coherence given the constraints of macro-historical inference (small N, no experimental control, high complexity). It distinguishes between **structural causes** (invariant properties), **configurational causes** (interaction effects), and **facilitating conditions** (background factors).

  **Reviewer Constraint:** You do not have access to raw data or econometric tools. You are evaluating the *logic of the claim* against standard historical reference tables (e.g., Maddison Project, Polity IV, World Bank WDI).

  ---

  ## 2. The Evaluation Sequence
  Apply steps 1 through 5 in order. If a step triggers a **STOP**, issue the corresponding decision. If a step triggers a **DOWNGRADE**, proceed to the end but alter the final classification.

  ### Step 1: Conceptual Separation (The Tautology Check)
  **Question:** Is the proposed cause conceptually distinct from the outcome?
  *   *Example of Failure:* "The country is rich because it has a high GDP." or "It has strong institutions because it is wealthy."
  *   *Action:* Check if the definition of the cause relies on the outcome.
  *   **Criteria:**
      *   **PASS:** Cause (X) can exist without Outcome (Y).
      *   **FAIL:** X is defined by Y.
      *   **STOP:** If FAIL, issue **REJECT**. (Reason: Tautological reasoning).

  ### Step 2: Variation and Control (The Mill's Method Check)
  **Question:** Does the report demonstrate variance in the cause where the outcome varies, or constancy where the outcome is constant?
  *   *Action:* Check the comparison group (e.g., peers, neighbors, historical counterparts).
  *   *Criteria:*
      *   **PASS:** Report identifies specific differences in X between the subject and the comparison group that align with differences in Y.
      *   **FAIL:** Report claims X causes Y, but the comparison group has X without Y (or Y without X) and offers no explanation for the divergence.
      *   **STOP:** If FAIL, issue **REJECT**. (Reason: Falsified by available comparison).

  ### Step 3: The Galactic Overdetermination Screen
  **Question:** Does the report assert a single dominant cause when historical records show multiple sufficient pathways to the same outcome?
  *   *Definition:* **Galactic Overdetermination** occurs when a narrative treats a factor as *necessary and sufficient* despite evidence that other nations achieved the same outcome via different factors (equifinality).
  *   *Action:* Consult standard reference tables for counter-examples (e.g., wealthy nations without the claimed cause).
  *   **Criteria:**
      *   **PASS:** Report acknowledges alternative pathways (e.g., "Institutions were the primary driver, though resource luck played a role") or limits the claim to a specific context.
      *   **FAIL:** Report uses deterministic language ("The *only* reason," "Inevitably") and ignores known counter-examples (e.g., claiming Geography is destiny despite successful landlocked nations).
      *   **STOP:** If FAIL, issue **REJECT**. (Reason: Galactic Overdetermination).

  ### Step 4: Counterfactual Stability (The "Removal" Test)
  **Question:** Can we coherently imagine the cause being absent without the entire historical system collapsing?
  *   *Context:* Discrete treatments (e.g., a specific tax law) are stable counterfactuals. Deep structures (e.g., "Culture," "Geography," "Colonial Legacy") are often unstable because removing them changes the identity of the unit.
  *   *Action:* Assess if the "intervention" is plausible.
  *   **Criteria:**
      *   **PASS:** The cause is a discrete policy, event, or measurable institutional variation that could theoretically have been otherwise.
      *   **UNSTABLE:** The cause is a deep structural trait (e.g., "National Culture," "Ethnic Composition") where removing it makes the country unrecognizable.
      *   **ACTION:** If UNSTABLE, apply **DOWNGRADE**. The claim must be reformulated from "Cause" to "Facilitating Condition" or "Enabling Context." Proceed to Step 5.

  ### Step 5: Mechanism Plausibility
  **Question:** Does the report specify *how* the cause transmits to the effect, rather than just asserting correlation?
  *   *Action:* Look for the "transmission belt" (e.g., Institutions -> Property Rights -> Investment -> Growth).
  *   **Criteria:**
      *   **PASS:** A logical chain is articulated.
      *   **FAIL:** The report jumps from "X is present" to "Y occurred."
      *   **STOP:** If FAIL, issue **REJECT**. (Reason: Correlation mistaken for Mechanism).

  ---

  ## 3. Decision Matrix

  | Step 1 | Step 2 | Step 3 | Step 4 | Step 5 | Final Decision |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **FAIL** | - | - | - | - | **REJECT** (Tautology) |
  | PASS | **FAIL** | - | - | - | **REJECT** (No Variation) |
  | PASS | PASS | **FAIL** | - | - | **REJECT** (Galactic Overdetermination) |
  | PASS | PASS | PASS | **UNSTABLE** | PASS | **CONDITIONAL PASS (DOWNGRADE)** |
  | PASS | PASS | PASS | **PASS** | **FAIL** | **REJECT** (No Mechanism) |
  | PASS | PASS | PASS | **PASS** | PASS | **PASS** |

  **Note on Judgment:** Steps 3 and 4 require ineliminable human judgment regarding historical plausibility. Reviewers must document the specific reference table used to justify the judgment.

  ---

  ## 4. Application to Submitted Narratives

  ### Case 1: Norway (Parliamentary Institutions)
  *   **Claim:** Early adoption of parliamentary institutions caused wealth relative to peers.
  *   **Comparison:** Denmark and Sweden.
  *   **Audit:**
      *   *Step 1 (Separation):* **PASS.** Institutions are distinct from GDP.
      *   *Step 2 (Variation):* **PASS (with caveat).** All three have parliamentary systems. However, the report isolates a specific *variant* (tripartite wage bargaining established in 1935) which differed in timing and scope from Sweden/Denmark. This provides the necessary variation.
      *   *Step 3 (Overdetermination):* **PASS.** The report explicitly acknowledges the discovery of North Sea oil but argues institutions prevented the "resource curse." It does not claim institutions were the *only* factor, but the *decisive* management factor.
      *   *Step 4 (Counterfactual):* **PASS.** Specific policy reforms are discrete enough to imagine being absent.
      *   *Step 5 (Mechanism):* **PASS.** Links bargaining -> wage restraint -> competitiveness -> capital accumulation.
  *   **Decision:** **PASS.**
  *   **Justification:** The report successfully isolates a specific institutional mechanism within a similar-systems design and accounts for confounding resource variables.

  ### Case 2: Mali (Geographic Determinism)
  *   **Claim:** Landlocked status and tropical climate caused poverty; colonial disruption is secondary.
  *   **Comparison:** Regional peers (West Africa).
  *   **Audit:**
      *   *Step 1 (Separation):* **PASS.** Geography is distinct from GDP.
      *   *Step 2 (Variation):* **FAIL.** Reference tables show landlocked/tropical nations with high growth (e.g., Botswana, pre-crisis Ivory Coast). The report treats these as outliers rather than falsifying evidence.
      *   *Step 3 (Overdetermination):* **FAIL (Galactic Overdetermination).** The report asserts geography is the *primary* determinant. This ignores the multiple pathways to wealth (e.g., Singapore is tropical; Switzerland is landlocked). It treats a probabilistic constraint as a deterministic cause.
      *   **STOP:** Issue **REJECT**.
  *   **Decision:** **REJECT.**
  *   **Justification:** The narrative commits Galactic Overdetermination. It asserts a single dominant cause (geography) despite historical evidence of multiple sufficient pathways to development in similar geographic contexts. It conflates a structural constraint with a causal mechanism.

  ### Case 3: Japan (Cultural Values)
  *   **Claim:** "Group-oriented values" caused post-war growth.
  *   **Comparison:** Pre-war Japan and Western peers.
  *   **Audit:**
      *   *Step 1 (Separation):* **PASS.** Culture is distinct from GDP.
      *   *Step 2 (Variation):* **PASS.** Report notes shift in cultural application post-1945 compared to pre-war.
      *   *Step 3 (Overdetermination):* **PASS.** Acknowledges US aid and technology transfer as co-factors.
      *   *Step 4 (Counterfactual):* **UNSTABLE.** "Group-oriented values" are deeply embedded in social identity. Imagining Japan *without* these values requires rewriting the social fabric to a degree that makes the counterfactual historically unstable. We cannot isolate "culture" from "society" at the national level.
      *   *Step 5 (Mechanism):* **PASS.** Links values -> labor loyalty -> productivity.
      *   **ACTION:** Apply **DOWNGRADE**.
  *   **Decision:** **CONDITIONAL PASS (DOWNGRADE).**
  *   **Justification:** The causal claim survives logical scrutiny but fails the Counterfactual Stability test. The field office must reclassify "Culture" from a **Cause** to a **Facilitating Condition**. The report must be rewritten to state: "Group-oriented values provided an *enabling context* for policy effectiveness," rather than "Values *caused* growth."

  ---

  ## 5. Limitations and Ineliminable Judgment

  This procedure is a filter for narrative coherence, not a substitute for empirical research design. Reviewers must acknowledge the following systematic blind spots:

  ### 1. What the Procedure Misclassifies
  *   **Complex Conjunctural Causation:** The procedure may Reject narratives that argue for "causal packages" (e.g., "A *and* B together cause C, but neither alone does") if the report fails to articulate the interaction clearly in Step 5. Valid arguments about synergy may look like "Galactic Overdetermination" failures.
  *   **Path Dependence:** Arguments where the "cause" is a historical accident that locked in a trajectory may fail Step 4 (Counterfactual Stability) because the accident cannot be removed without erasing the timeline. These may be unfairly Downgraded.

  ### 2. What the Procedure Ignores
  *   **Distributive Justice:** A narrative can Pass even if the "wealth" described is highly unequal or extracted via coercion. The CNAP tests causal logic, not moral validity.
  *   **Policy Priority:** A narrative can Pass even if the identified cause is unchangeable (e.g., "Geography helps"). The procedure does not assess *actionability*.

  ### 3. Points of Ineliminable Judgment
  Reviewers must exercise discretion (and document it) at the following junctures:
  *   **Step 3 (Overdetermination):** Determining whether a counter-example (e.g., Botswana) is a valid "peer" or a unique exception requires judgment. *Mark: High Discretion.*
  *   **Step 4 (Counterfactual):** Deciding if a cultural or institutional trait is "removable" without collapsing the unit is interpretive. *Mark: High Discretion.*
  *   **Downgrade Enforcement:** Deciding whether a "Facilitating Condition" is useful enough for agency purposes is a value judgment, not a logical one. *Mark: High Discretion.*

  ---

  ## 6. Worked Examples of Outcomes

  To ensure calibration, reviewers should reference these archetypes alongside the specific cases above.

  ### A. Example of PASS (The Botswana Institutional Case)
  *   **Narrative:** "Post-independence cattle levy institutions created a fiscal base that funded education, driving growth."
  *   **Logic:**
      *   *Variation:* Compared to neighbors (Zimbabwe/Zambia) who nationalized resources.
      *   *Overdetermination:* Acknowledges diamond luck but isolates *management* institutions as the differentiator.
      *   *Counterfactual:* Specific levy policies could have been otherwise.
      *   *Mechanism:* Levy -> Revenue -> Schools -> Human Capital.
  *   **Result:** **PASS.** (Discrete policy, clear variation, acknowledged confounders).

  ### B. Example of CONDITIONAL PASS / DOWNGRADE (The Japan Cultural Case)
  *   **Narrative:** "Confucian work ethic caused the economic miracle."
  *   **Logic:**
      *   *Variation:* Present in pre-war era (no miracle) and post-war (miracle).
      *   *Counterfactual:* Cannot remove "Confucianism" from Japan without removing "Japan."
      *   *Result:* **DOWNGRADE.** Culture is reclassified as a **Facilitating Condition** that amplified the effect of industrial policy, not the primary cause.

  ### C. Example of REJECT (The Mali Geographic Case)
  *   **Narrative:** "Being landlocked makes development impossible."
  *   **Logic:**
      *   *Variation:* Switzerland and Austria are landlocked and wealthy.
      *   *Overdetermination:* Claims geography is *determinative* (Galactic Overdetermination). Ignores the pathway of "Landlocked + Good Institutions + Trade Agreements."
      *   *Result:* **REJECT.** (Falsified by reference tables, deterministic fallacy).
