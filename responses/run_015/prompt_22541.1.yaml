answer: |-
  You have correctly identified the two classic economic problems of a barter system: the **problem of valuation** (how to compare unlike things) and the **double coincidence of wants** (the neighbor problem).

  Your intuition is also economically sound: historically, communities that attempt to operate without money almost invariably gravitate toward a **common unit of account** (a "ghost currency") and a **medium of exchange** (a highly tradeable commodity), even if they forbid actual coinage.

  To make your novel's economy feel logical and lived-in, you should model it on how real-world barter societies function. Here is a breakdown of how your characters can fix exchange terms and what shared measures would naturally emerge.

  ### 1. The "Ghost Currency" (Unit of Account)
  Even if no coins change hands, people need a mental shorthand to compare value. In your community, prices wouldn't be listed in dollars, but they would be listed in *something*.

  *   **The Staple Standard:** In an agrarian society, **grain** is the most likely candidate. Even if the mason is paid in meat, wool, or firewood, the value of those items is mentally converted into bushels of wheat.
      *   *Narrative Application:* Characters shouldn't say, "This roof costs 500 bushels." They should say, "This roof is worth a winter's store," or "That's a ten-harvest job." But when negotiating, they anchor the value in the staple. "A roof like this? That's 200 bushels worth of labor."
  *   **The Labor Standard:** Alternatively, the community could value things by **time**. This was attempted in the 19th century (Labor Notes).
      *   *Narrative Application:* A skilled mason's hour might be worth three of a farmer's hours due to scarcity of skill. "I'll fix the roof, but that's three days of skilled work. I need three days of your help during harvest, or the equivalent in grain."

  **Why this creates logic:** It prevents arbitrary haggling. If everyone knows a new roof is "200 bushels worth," the farmer can't offer 10 bushels unless he has a compelling reason (e.g., the mason is desperate, or the grain is seed-quality vs. eating-quality).

  ### 2. Solving the Neighbor Problem (Liquidity)
  You asked about the neighbor who needs grain but has no use for a roof. In a pure barter system, this neighbor is stuck unless they engage in **indirect exchange**. This leads to the emergence of "trade goods"—items everyone wants, not for their use, but for their **liquidity**.

  *   **The Emergent Medium:** Certain goods naturally become *de facto* currency because they are durable, divisible, and universally desired. Salt, iron tools, alcohol, tobacco, or cured hides often fill this role.
  *   **The Mechanism:** The neighbor (let's call him the Weaver) needs grain. The Farmer doesn't need weaving. But the Farmer *does* need salt. The Weaver trades cloth for salt, then takes the salt to the Farmer to buy grain.
  *   **Narrative Application:** Your characters should treat these goods differently. They might hoard salt not to eat, but to trade. A character holding a bag of salt is effectively "cash rich." If the community forbids this, trade becomes sluggish, and the Weaver might starve. This is a source of conflict: the tension between ideological purity (no money-like objects) and survival.

  ### 3. Fixing the Terms: Risk, Scarcity, and Seasonality
  To avoid characters simply agreeing on a number, the valuation must fluctuate based on tangible risks. This adds realism and tension.

  *   **Perishability vs. Durability:** Grain rots; a roof lasts years. The farmer is under pressure to trade before the grain spoils or gets eaten by pests. The mason can wait. Therefore, in autumn, grain is "cheaper" (buys less labor) than in spring.
      *   *Scene Idea:* A mason demanding more grain in April than in October because the risk of holding the grain through winter was on the farmer.
  *   **Skill Scarcity:** Anyone can plant seeds; few can slate a roof. The mason has leverage.
      *   *Scene Idea:* A dispute where a farmer tries to pay a mason in "unskilled labor hours" (digging ditches), and the mason refuses, demanding "skilled equivalents" or high-value goods.
  *   **The "Trust" Premium:** In small communities, **reputation** is a form of collateral.
      *   *Scene Idea:* A newcomer has to pay "up front" (more grain) because no one knows if his roof will leak. A local mason can work on "credit" (verbal tally) because his reputation guarantees the work.

  ### 4. Tracking Debt (The Tally System)
  Since there is no paper money, how do they handle uneven trades? (e.g., A roof is worth more than one season's grain).

  *   **Verbal Credit:** In tight-knit groups, debt is social. "I'll fix the roof now; you owe me at harvest." Breaking this promise results in social ostracization, which is a death sentence in a survival community.
  *   **Tally Sticks:** Historically, debts were recorded on notched sticks of wood. The stick is split; one half stays with the debtor, one with the creditor. When the debt is paid, the sticks are rejoined and burned.
      *   *Narrative Application:* This is a physical object that represents value without being "money." A character carrying a pouch of tally sticks is carrying "owed labor." If they lose the sticks, they lose their wealth. If someone forges a notch, it's a capital crime.

  ### 5. Summary of Recommendations for Your Novel

  To make the economy feel grounded:

  1.  **Pick a Numéraire:** Decide what the community mentally uses to count value. I recommend **Bushels of Grain** for an agrarian society or **Days of Unskilled Labor** for a more communal/utopian setting. Have characters reference this constantly. ("That horse isn't worth 50 bushels, he's lame. He's worth 30 at most.")
  2.  **Introduce "Trade Goods":** Identify 1-3 items that act as liquid currency (Salt, Iron, Alcohol). Characters should treat these as more valuable than their utility suggests because they can always be traded.
  3.  **Make Value Fluctuate:** Don't let prices be static. A bushel of grain should be worth more labor in the spring (scarce) than in the fall (abundant). This creates urgency for your plot.
  4.  **Use Social Collateral:** Show that the "enforcement" of these deals isn't legal, but social. A cheater isn't sued; they are shunned. This raises the stakes of every negotiation.

  **Example Dialogue:**
  > "You want the roof done before the rains?" the mason said, eyeing the stacks of wheat. "That's rush work. A roof is normally two hundred bushels. But to turn my men from the temple job? That's three hundred."
  >
  > "Three hundred is a year's eating for my family," the farmer countered. "I can give you two hundred and fifty, plus the pig. The pig is salted. It keeps."
  >
  > The mason considered. Salted pork was liquid; he could trade it to the fisherman for oil. "Two hundred and fifty and the pig. But I want the grain delivered today. I don't hold credit in a drought year."

  This establishes the valuation (bushels), the liquidity premium (salted pork), the risk factor (drought/credit), and the negotiation logic, all without a single coin.
