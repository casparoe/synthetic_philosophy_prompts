answer: |-
  You have put your finger on the central structural vulnerability of **Humean Theory of Reasons** (also known as Desire-Based Internalism). You are correct that while "the bootstrap problem" and "the is/ought gap" are adjacent, neither captures the precise configuration you are describing.

  There is no single, universally capitalized Proper Noun for this specific configuration (like "The Gettier Problem"), but in contemporary metaethics and philosophy of action, it is most precisely identified as **"The Normativity Objection to Internalism"** (or to Reductive Naturalism more broadly). However, when we isolate the specific *structural* flaw you described—the reliance on an ungrounded normative principle to effect a reductive explanation—it is often discussed under the label of **"Korsgaard's Regress"** or, in more recent literature, as an instance of **"The Shmagency Objection."**

  Here is the breakdown of the terminology, the distinctions you requested, and the theoretical landscape of who is guilty and who escapes.

  ### 1. The Name of the Configuration

  While you will often see this simply filed under "The Normativity Problem," the specific configuration where a theory's *own normative principle* cannot be grounded by the theory's resources is best labeled **"The Problem of the Ungrounded Normative Premise."**

  However, two specific argumentative labels capture the dynamic you described:

  *   **Korsgaard's Regress:** In *The Sources of Normativity*, Christine Korsgaard argues that if you ground reasons in desires (or any contingent psychological fact), you must ask: "Why does this desire give me a reason?" If the answer is "Because you have a higher-order desire to act on that desire," you face a regress. If the answer is "Because rationality requires it," you have appealed to a normative principle external to the desire itself. This matches your description exactly: the theory attempts to reduce normativity to psychology, but the reduction rule itself remains normative and unexplained.
  *   **The Shmagency Objection (Structural Analogue):** David Enoch formulated this against *Constitutivism* (the view that norms are grounded in the constitutive aims of agency), but he explicitly notes its applicability to Humeanism. The argument is: Even if acting on desires is constitutive of "being an agent," why should I care about being an agent? Why is the "agent" normatively authoritative rather than a "shmagent" (who lacks that aim)? This mirrors your point: the rule linking the fact (desire/aim) to the reason is itself normative and requires justification the theory cannot provide.

  ### 2. Distinction from Related Problems

  You are right to feel that "Is/Ought" and "Bootstrapping" are not exact fits. Here is the technical differentiation:

  **A. vs. The Is/Ought Gap (Hume's Law)**
  *   **The Is/Ought Gap** is a thesis about *logical derivation*. It states that no set of purely descriptive premises can *entail* a normative conclusion without a normative bridge.
  *   **Your Configuration** is a thesis about *ontological grounding* and *theoretical self-sufficiency*. A Humean Internalist might concede the Is/Ought gap but claim their theory *provides* the bridge (i.e., "Desires *are* reasons"). Your objection is that this claim *itself* is a normative premise that the theory cannot naturalize.
  *   **Difference:** The Is/Ought gap says "You can't get there from here." Your objection says "You claim to have built a bridge from here to there, but the bridge itself floats in mid-air." It is a problem of **circularity** or **regress** within a reductive project, not merely a logical prohibition.

  **B. vs. The Bootstrapping Problem**
  *   **Bootstrapping** (associated with John Broome and Niko Kolodny) typically refers to the idea that one can *create* a reason out of thin air through the act of intending or believing. (e.g., "I intend to go to the party, therefore I have a reason to take a taxi.")
  *   **Your Configuration** is not about creating specific reasons ex nihilo, but about the **authority of the general principle**. You are asking why the *mechanism* of desire-based reasoning has normative force at all.
  *   **Difference:** Bootstrapping is about the *generation* of particular reasons; your problem is about the *justification* of the normative law that governs that generation.

  ### 3. Theoretical Liability: Who is Guilty?

  This configuration acts as a litmus test for metaethical theories.

  **The Guilty (Reductive Naturalists & Internalists):**
  *   **Humean Internalism (Bernard Williams, Michael Smith, Mark Schroeder):** These theories explicitly ground reasons in subjective motivational sets. They are the primary targets of this objection. They must either admit the principle ("satisfy your desires") is a brute normative truth (abandoning pure naturalism) or face the regress.
  *   **Constitutivism (Christine Korsgaard, David Velleman):** Ironically, Korsgaard raises this against Humeans, but Enoch's "Shmagency" objection turns it back on her. If normativity comes from the constitutive aims of agency, why is "agency" normatively privileged over "shmagency"? The principle linking the aim to the norm remains ungrounded.
  *   **Ideal Advisor Theories (Peter Railton):** If reasons are what you would desire if fully informed, the principle "you should care about what your ideal self desires" is itself normative and ungrounded by the theory.

  **The Innocent (Non-Naturalists & Error Theorists):**
  *   **Robust Non-Naturalist Realism (Derek Parfit, David Enoch, T.M. Scanlon):** These theories escape the problem by biting the bullet. They agree that the principle ("Desires give reasons" or "Pain is bad") is a **brute normative truth**. They do not try to reduce normativity to non-normative facts. Therefore, they do not need to ground the normativity of the principle in a further motive; they accept it as a fundamental law of the normative domain.
  *   **Error Theory (J.L. Mackie, Richard Joyce):** They agree with your diagnosis entirely. They argue that because such a principle *cannot* be grounded in the natural world (and there are no non-natural properties), all such normative claims are false. They escape the problem by denying the existence of the normativity the theory tries to explain.

  ### 4. Recommended Terminology for Your Work

  If you are writing on this, I recommend using **"The Normative Premise Objection"** or **"The Problem of Normative Authority."**

  However, if you want to signal deep familiarity with the current dialectic, you should frame it as **"The Shmagency-style Objection to Reductive Internalism."** This signals that you recognize the structural regress (the need for a further motive to validate the rule) without conflating it with Broome-style bootstrapping.

  **Summary for your purposes:**
  The configuration is a **Self-Undermining Reduction**. It occurs when a theory attempts to reduce normative facts to non-normative facts but relies on a normative bridging principle that the theory's own ontology cannot support. It is distinct from the Is/Ought gap (which is about inference) and Bootstrapping (which is about reason creation). It is the primary weapon used by Non-Naturalists (Parfit) and Kantians (Korsgaard) against Humean Internalism.

  **Verdict:** You have accurately identified the fatal flaw of reductive naturalism in metaethics. While it lacks a single catchy name like "Gettier," **"The Normativity Objection to Internalism"** (specifically in its **Regress** form) is the standard academic designation. Use **"The Authority Problem"** to capture the specific issue of why the rule itself binds the agent.
