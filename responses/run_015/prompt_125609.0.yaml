      *   **Setting:** Fictional "Regional Climate Board" voting on geoengineering.
      *   **Membership Rule:** Not pre-set. Participants draw dependency lines. Only nodes inside the graph get a seat. Outsiders can redraw lines to pull themselves in/push others out. Locking membership requires unanimous consent of those *currently inside*.
      *   **Token Economy:** Start with 3 tokens (Residents) or 2 (Downstream). Speaking costs 1 token/minute. 0 tokens = silent. Future Proxies start with 0, silent unless pulled in, hold hidden veto.
      *   **Stakes:** Real small stakes (snack budget or donation), distributed *only* after membership is fixed.
      *   **Desired Outcome:** Participants hit deadlock, token exhaustion, and graph manipulation *before* theorizing.
      *   **Debrief:** Map mechanics to theory (recursive legitimation, stakeholder weighting, cost of inclusion), acknowledge limitations (silent proxies, absence of non-existent people).
      *   **Constraints:** Minimal materials, no lecture up front, no bibliographies/citations. The theory must emerge from the game.

  2.  **Deconstruct the Mechanics & Identify Potential Pitfalls:**
      *   *The Recursion:* If only "inside" people vote on who is "inside," outsiders have no formal power unless the "redraw lines" rule gives them leverage. The prompt says "anyone outside can redraw lines." This needs to be structured so it creates conflict, not chaos.
      *   *The Token Economy:* Speaking costs tokens. This creates a "pay-to-play" dynamic that mirrors the cost of political participation but might stifle the necessary debate too quickly. Need to ensure the cost feels real but doesn't end the game in 5 minutes.
      *   *The Proxies:* They have 0 tokens and can't speak unless pulled in. They have a hidden veto. This is a classic "trap." If they stay silent, the group might ignore them. If they use the veto at the end, it invalidates the process. This perfectly illustrates the "future generations" problem (they can't speak for themselves).
      *   *The Stakes:* Snack budget/donation. Needs to be contingent on *fixing* membership. If they never fix membership, no snacks. This pressures them to close the boundary, forcing the paradox.
      *   *Time:* 75 minutes.
