  Here's a thinking process that leads to the suggested workshop activity:

  1.  **Analyze the Request:**
      *   **Goal:** Create a 75-minute workshop activity for ~18 students (grad + undergrad) to experientially understand the "boundary problem" in democratic theory (who decides who decides?).
