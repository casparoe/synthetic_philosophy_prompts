      *   *Correction:* To make the recursion bite, the Outsiders need a way to force the issue. Let's say: Outsiders can draw a line connecting themselves to an Insider. This *challenges* the Insider's status. The Insider must then defend the connection. If the connection stands, the Outsider is "affected" and claims a seat. But to *lock* the list, everyone currently seated must agree.
