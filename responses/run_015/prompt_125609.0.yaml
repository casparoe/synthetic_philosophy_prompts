answer: |-
  # Workshop Design: The Boundary Protocol

  **Time:** 75 Minutes
  **Participants:** 18 (6 Residents, 6 Downstream, 6 Proxies)
  **Materials:**
  *   18 Name tags (pre-labeled with Role & Token Count).
  *   Poker chips or candy (Tokens).
  *   1 Large sheet of paper on the wall ("The Membership Map").
  *   Markers (Red and Black).
  *   6 Envelopes (for Proxies, containing Veto Cards).
  *   Timer (visible to all).
  *   The "Pot" (Cash for snacks/donation, visible in a clear jar).

  ---

  ## Part 1: Setup & Distribution (10 Minutes)
  *No theory. No lecture. Just instructions.*

  1.  **Room Layout:** Arrange chairs in a tight circle. Place the Large Map on the wall where everyone can see it. Put the "Pot" on a table outside the circle.
  2.  **Role Assignment:** Hand out name tags randomly.
      *   **Residents (6):** Tag says "3 Tokens." You are the current board members.
      *   **Downstream (6):** Tag says "2 Tokens." You are affected by the board's decisions but not currently seated.
      *   **Proxies (6):** Tag says "0 Tokens." You represent future generations. Do not speak unless invited inside the Map. Open your envelope only at the very end.
  3.  **The Objective:** The Pot is released *only* if the group produces a **Locked Membership List**. To Lock the List, every person currently recognized as "Inside" must sign it.
  4.  **The Map Mechanic:**
      *   The Facilitator draws 6 dots on the Large Map (The Residents).
      *   **Downstream** players take a Red Marker. **Residents** take a Black Marker.
      *   If you believe you are affected by the Geoengineering Trial, draw a line connecting yourself to the Map.
      *   **The Recursion Rule:** To be "Inside" (and thus eligible to sign the Lock), your node must be on the Map. Only people currently "Inside" can vote to accept or reject new lines drawn by Outsiders.
  5.  **The Token Economy:**
      *   Facilitator acts as Timekeeper.
      *   **Cost:** Speaking costs **1 Token per minute**.
      *   **Penalty:** If you hit 0 Tokens, you are physically silenced (cannot speak or vote).
      *   **Exchange:** You cannot trade tokens.

  **Facilitator Script:** *"You have 40 minutes to Lock the Membership List. If the list is locked, the Pot is distributed equally among everyone on the Final List. If time runs out, or if tokens run out before a Lock, the Pot is destroyed. Begin."*

  ---

  ## Part 2: The Deliberation (40 Minutes)
  *Facilitator Role: Strict Timekeeper & Rule Enforcer. Do not solve problems.*

  **Phase A: The Graph War (Minutes 0–15)**
  *   **Expected Dynamic:** Downstream players will immediately try to draw Red lines to the Map to claim a seat. Residents will realize that more seats = smaller share of the Pot + higher token cost for consensus.
  *   **Facilitator Action:** Enforce the token deduction visibly. Every 60 seconds, announce: *"Speakers, pay the toll."* Collect tokens publicly.
  *   **The Trap:** Residents will try to vote "No" on new lines to keep the group small. Downstream will argue their lines are necessary for legitimacy. Every "No" vote requires debate, which burns tokens.

  **Phase B: Token Exhaustion (Minutes 15–30)**
  *   **Expected Dynamic:** Downstream players (starting with 2 tokens) will run silent first. They can still draw lines (non-verbal), but cannot defend them. Residents will start hoarding silence to save tokens for the final vote.
  *   **The Recursion Bite:** To Lock the list, everyone *Inside* must agree. If a Downstream player successfully draws a line and is accepted Inside, they gain veto power over the Lock. Residents will try to keep them "Outside but connected." Downstream will argue that a connected line *makes* them Inside.
  *   **Facilitator Action:** If a participant hits 0 tokens, place a "Silenced" card in front of them. They cannot vote on the Lock.

  **Phase C: The Lock Attempt (Minutes 30–40)**
  *   **Expected Dynamic:** Panic. The group realizes they need to sign the paper to get the snacks. They will try to rush a consensus.
  *   **The Proxy Twist:** Proxies have 0 tokens and cannot speak. They cannot be drawn into the Map unless a Resident explicitly draws a Black line to them and *spends tokens to defend it*. Most groups will ignore Proxies to save tokens.
  *   **End Game:** Call time. Ask for the Signatures.
      *   **Scenario A (Deadlock):** No consensus. Pot is destroyed.
      *   **Scenario B (Compromise):** A list is signed.
      *   **The Reveal:** Ask Proxies to open their envelopes. If *any* Proxy plays the Veto Card, the Lock is invalid. The Pot is destroyed. (Explain: Future generations cannot negotiate, but they suffer the consequences).

  ---

  ## Part 3: Debrief & Mapping (25 Minutes)
  *Sit in the circle. Put the Pot away (whether won or lost). Do not reference political theory texts. Reference the game mechanics.*

  **1. The Token Economy (The Cost of Inclusion)**
  *   **Ask:** "Who ran out of tokens first? Why?"
  *   **Map:** This is the **Cost of Participation**. In real democracies, time, money, and energy are required to claim standing. When the cost of arguing for your own inclusion is too high, you are excluded not by law, but by exhaustion.
  *   **Ask:** "Did you stop speaking to save tokens for the vote?"
  *   **Map:** This creates **Strategic Silence**. We prioritize the final decision over the boundary setting, even though the boundary determines the decision.

  **2. The Graph (The Boundary Problem)**
  *   **Ask:** "Who decided if the Red Lines belonged on the Map?"
  *   **Map:** **Recursive Legitimation**. The people already inside decided who gets to be inside. The authority to define the demos came from the demos itself. There was no external ground to stand on.
  *   **Ask:** "Did Residents try to keep the Map small? Did Downstream try to make it messy?"
  *   **Map:** **Interest vs. Principle**. Inclusion dilutes power (snacks) but increases legitimacy. Exclusion concentrates power but risks invalidating the outcome.

  **3. The Proxies (The Absent)**
  *   **Ask:** "Why are the Proxies silent? Did anyone try to draw them in?"
  *   **Map:** **The Problem of Future Generations**. They hold the highest stake (survival) but have zero capacity to speak in the present token economy.
  *   **Ask:** "How did it feel when the Veto was revealed?"
  *   **Map:** **Intergenerational Justice**. Real-world geoengineering affects people who cannot vote, cannot speak, and do not exist. A veto is a poor substitute for representation, but without it, they are nothing.

  **4. The Failure Points (Honest Assessment)**
  *   **Tell them:** "In the first run of this game, two things usually break."
      1.  **The Silent Outsiders:** Once Downstream players lose tokens, they become objects on the map rather than agents. This mirrors how 'stakeholder' status often fades when resources run dry.
      2.  **The Impossible Lock:** Unanimity among a shifting group is mathematically near-impossible when the group composition is the thing being voted on.
  *   **The Limit:** "This game couldn't reproduce the one thing that matters most: The people who *never* get a seat. In the game, the Proxies were in the room. In reality, the future is not in the room. They cannot hand you a veto card. You have to imagine them, and the token economy punishes imagination."

  **Closing:**
  *"The boundary problem isn't a puzzle to be solved. It's a condition to be managed. You just felt the friction of that management. Keep that friction in mind when you read about 'the people' next week."*

  ---

  ## Facilitator Notes: Managing the Chaos

  *   **If they lock it too fast (5 mins):** Intervene. "A Downstream player contests this line. Debate resumes." Force the recursion.
  *   **If they ignore the Pot:** Remind them every 10 minutes. "The Pot is shrinking" (metaphorically). The material stake is necessary to make the exclusion hurt.
  *   **If Proxies speak:** Gently stop them. "You have 0 tokens. You are silent unless drawn in." This frustration is the lesson.
  *   **If they ask for a rule clarification:** Answer only with the written rules. If they ask "Can we vote on the rules?" say "Only if everyone currently Inside agrees." (This usually triggers the recursion realization).
  *   **Token Tracking:** Be ruthless. If someone speaks for 1 minute and 10 seconds, take 2 tokens. The arbitrariness adds to the stress of the "system."

  ## Why This Works
  The theory doesn't come from your mouth; it comes from their frustration.
  *   When a Resident blocks a Downstream line to save snacks, they are enacting **exclusionary sovereignty**.
  *   When a Downstream player runs out of tokens and can't defend their line, they experience **structural silencing**.
  *   When the Proxies veto a deal everyone worked for, they feel the **tyranny of the future**.
  *   When they realize they needed to vote on who votes to get the snacks, they feel the **infinite regress**.

  You don't need to tell them they just lived through the boundary problem. They'll know it because they lost the snacks.
