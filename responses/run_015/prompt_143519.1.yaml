prompt: |-
  i'm writing the final for my philosophy of trauma and culture seminar and honestly it's gotten personal — my grandmother died last month and my family is fighting over whether to keep her letters about the war or burn them because "remembering is just reopening wounds." i don't want students to just parrot Margalit or Rieff, so please write one 45-minute essay question for upper-level undergrads that forces them into the actual tension.

  the scenario: a survivor's child wants to destroy family archieves to stop what they call "vicarious trauma tourism" by younger relatives, while the local community claims something like "mnemonic sovereignty" — the right to preserve those records for collective identity. ask them whether the child's right to forget can override communal memory claims, using Margalit's shared/common memory distinction and Rieff's suspicion that modern culture uses trauma narratives for identity performance rather than real mourning. inject the idea that forgetting might not be purely private and remembering not purely public.

  i need a model answer around 500 words that doesn't just summarize but actually resolves or at least maps the conflict. then a marking scheme: five specific moves each must contain (like framing the shared/common distinction right, applying Rieff without misreading him as anti-memory, dealing with the mnemonic sovereignty concept i made up, mapping individual vs collective rights, and avoiding the fallacy that forgetting is always private). total 25 marks, with one line each on the typical B-grade mistake that misses the point. please keep it casual — i'm writing this at 2am and my head's a mess, and don't ask for bibliographies or reading lists since half my students won't have library access.
