answer: |-
  Here is the analysis of the record and the draft recommendation strategy you requested.

  ### 1. The Rules of the Record

  Based on the seven precedents and the internal tension provided, three distinct rules emerge. They do not all point in the same direction regarding Kalkrand Consolidated.

  **Rule A: The Constitutive Rule (Your Position)**
  *   **Derivation:** Cases 1, 2, 5, and 6.
  *   **Statement:** Amnesty is a moral exchange available only to natural persons who avow specific unlawful acts undertaken with a recognizable political objective. It requires personal accountability (Case 5), a nexus between the act and a political struggle (Case 2), and full disclosure of the applicant's own role (Case 3).
  *   **Prediction for Kalkrand:** **Refusal.** A corporation is not a natural person (Case 5 logic); it cannot "avow" acts in a moral sense, only admit liability. Crucially, Kalkrand explicitly disclaims a political objective, citing profit and production. Under Case 2 (Commander), acts deemed "punitive" or non-political are ineligible regardless of disclosure.

  **Rule B: The Transactional Rule (Your Friend's Position)**
  *   **Derivation:** Cases 1, 3, 6, and the Early Tension Case.
  *   **Statement:** Amnesty is a currency spent to purchase truth and recovery unobtainable otherwise. The primary metric is the utility of the disclosure (locating bodies, revealing networks) and the completeness of the account. The identity of the seller is secondary to the value of the goods.
  *   **Prediction for Kalkrand:** **Grant.** The archive provides burial sites and commander names that nine years of individual applications failed to yield. The disclosure is "complete" (Case 3). The truth value outweighs the corporate nature of the applicant.

  **Rule C: The Community and Integrity Rule**
  *   **Derivation:** Cases 4, 7, and the Foreign State complication.
  *   **Statement:** Amnesty requires the affected community to have a real role in the process (Case 4), and reparative contributions cannot be traded directly for immunity (Case 7).
  *   **Prediction for Kalkrand:** **Refusal (with conditions).** The neighboring state (representing the victims' community) opposes the grant. Furthermore, Kalkrand's offer of a fund and exhumations is explicitly conditional on immunity. Case 7 forbids counting reparations toward the application.

  ### 2. Decision, Analog, and Principle

  **Best Guess at Decision:**
  The Committee should **refuse amnesty**.

  **Closest Analog:**
  **Case 2 (The Section Commander)** is the controlling analog, supported by **Case 7 (The Clinic Offer)**.
  *   *Why Case 2:* Like the Commander, Kalkrand has disclosed the facts but failed the "political objective" test. The Commander's raid was "punitive"; Kalkrand's collaboration was "commercial." Both are instrumental rationales distinct from the political struggle the Commission is mandated to reconcile. If a state agent acting against a political enemy cannot claim amnesty for disproportionate/punitive acts, a private actor acting for profit certainly cannot.
  *   *Why Case 7:* Kalkrand's offer to fund exhumations in exchange for immunity is precisely the "trade" Case 7 prohibited.

  **Principle Adopted:**
  By refusing, you affirm that **amnesty is a form of moral restoration, not an evidence-gathering tool.** You are adopting the principle that the state cannot sell immunity for information if the buyer does not acknowledge the moral weight of the transaction. If you grant amnesty, you adopt the principle that **truth is the supreme good**, superseding the need for personal accountability or political justification.

  **The Money Question:**
  You can and should accept the archive and the offer to fund exhumations *without* granting immunity.
  *   *Principle:* This distinguishes between **humanitarian relief** (exhumations, which victims have a right to regardless of amnesty) and **legal indemnity** (immunity, which must be earned).
  *   *Risk:* It may look like you are "taking the money" while rejecting the deal. You must frame this in the recommendation as acting under Case 7: the money is recorded as a voluntary reparative gesture (as in Case 7's findings) but is severed from the legal determination of liability. The archive is accepted as evidence, not as consideration.

  **Resolving the Internal Tension:**
  You must explicitly distinguish the "Docket Tension." The later precedent (Refusal for docket duplication) should be treated as the matured view of the Commission. Public corroboration (Early Case) is only valuable if it adds *narrative* truth (the "why" and "how" from the perpetrator's mouth), not just *factual* truth (the "what" already in police files). Kalkrand passes this test (burial sites are new facts), but failing the "Political Objective" test (Case 2) renders the truth value irrelevant to eligibility.

  ### 3. The Discriminating Case

  To definitively settle the debate between you and your friend, the single most useful hypothetical case would be:

  **The Personnel Director (Natural Person, Same Motive).**
  *   **The Scenario:** The company's former Personnel Director (a natural person) applies for amnesty. He offers the *exact same archive* and admits the *exact same motive* (profit/production, not politics). He avows his personal role in compiling the lists.
  *   **Why this case:** It isolates the variable of **Personhood vs. Truth Value**.
      *   **If you Grant the Director:** Your friend wins. It proves that the "Political Objective" requirement is flexible enough to cover commercial complicity if the truth value is high enough, and that the barrier for Kalkrand was merely corporate standing, not the nature of the exchange.
      *   **If you Refuse the Director:** You win. It proves that "Political Objective" is a hard gate. If a human being cannot get amnesty for profit-driven complicity, a corporation certainly cannot. It confirms that amnesty is about reconciling *political* conflict, not policing *criminal* profiteering.

  **Why not the "Duplicate Records" Corporation?**
  That case only tests the "Truth Value" threshold (the Internal Tension). It does not test the core philosophical disagreement about whether amnesty is a *personal moral exchange* or a *state transaction for information*. The Director case forces the Committee to decide if a profit motive can ever be "political" enough for amnesty. If the answer is "no" for a human, the Kalkrand application dies regardless of how good their archive is.

  **Recommendation for the Draft:**
  Write the recommendation to refuse Kalkrand based on **Case 2 (Political Objective)** and **Case 5 (Standing/Specific Acts)**. Accept the archive and the exhumation funding as voluntary cooperation under **Case 7**, explicitly noting that these do not constitute consideration for immunity. This aligns with the weight of your precedents (5 refusals/conditional vs. 3 grants) and preserves the integrity of the "political objective" requirement.
