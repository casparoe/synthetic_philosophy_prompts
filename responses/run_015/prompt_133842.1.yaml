  ### Part 4: Logical Space Analysis

  **Empty Cells (Unoccupied/Unattractive):**
  *   **Path B, Q3B1 (Event/Process):** Both "Crisis" and "Condition" lead to the same leaf. *Reason:* Whether the event is framed as a crisis or a condition, the structural commitment is that it is not a time unit. *Fix:* If the museum spends a screen, ask: "Should we try to end the event or adapt to it?" to separate *Eco-Modernist* from *Dark Green* views.
  *   **Path B, Q4B1 (Deep Onset):** "Pollen" and "Tools" lead to the same leaf. *Reason:* Both are proxies for the same Neolithic onset. *Reason for Vacancy:* Merely unoccupied; archaeologists argue over proxies, but the epochal date remains the same.
  *   **Path C, Q4C1 & Q4C2 (Democratic):** "Vote/Consensus" and "Blame/Responsibility" lead to the same leaves. *Reason:* These are procedural or moral nuances that do not change the authority claim. *Reason for Vacancy:* Incoherent to split authority based on voting mechanism in this context.

  **Collisions (Indistinguishable Leaves):**
  *   **Path A, Q3A2/Q6A (Formal Mid-century):** A visitor who says "No" to Volcano, "Yes" to Synchronous, and "Radionuclides" arrives at the same leaf as someone who might arrive via a different logical shortcut. *Flag:* This is a feature, not a bug; it confirms the stratigraphic consensus.
  *   **Path A, Q4A1/Q4B1 (Deep Onset):** A visitor who thinks "Volcano=Yes" and "Human=Distinct" arrives at Deep Onset, as does the "Landscape/Pollen" visitor. *Flag:* These are genuinely indistinguishable by your questions. *Extra Question:* "Is the driver of change population size or land use?" (Population → Deep; Land Use → Industrial/1610).
  *   **Path B, Q4B2/Q5B (Ratchet View):** "Social Irreversibility" and "Physical Irreversibility (No Return)" both lead to Ratchet. *Flag:* Your definition of Ratchet conflates social and physical lock-in. *Extra Question:* "If we fixed the climate but kept the same economies, would the Anthropocene end?" (Yes → Physical Ratchet; No → Social Ratchet).

