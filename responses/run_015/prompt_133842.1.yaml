  ### Part 3: The Leaves

  **1. Holocene Continuist**
  *   **Statement:** Nothing epochal has happened; this is just the Holocene with people in it.
  *   **Awkward Commitment:** We must admit that nuclear fallout and mass extinction are geologically normal.

  **2. Deep Onset**
  *   **Statement:** The boundary begins with agriculture or rice cultivation several thousand years back.
  *   **Awkward Commitment:** A stone-age farmer is as responsible for climate change as a modern CEO.

  **3. Formal Mid-century**
  *   **Statement:** The boundary is a formal mid-century stratigraphic marker tied to radionuclide fallout.
  *   **Awkward Commitment:** The most important thing about humans is our ability to explode bombs.

  **4. Diachronous View**
  *   **Statement:** There is no single date; the onset is regionally staggered.
  *   **Awkward Commitment:** We cannot put a single number on the museum wall without lying.

  **5. Industrial Revolution**
  *   **Statement:** The onset is keyed to steam and coal in the late eighteenth century.
  *   **Awkward Commitment:** The discovery of the Americas and global trade mattered less than the engine.

  **6. Early 17th Century**
  *   **Statement:** The onset is keyed to a dip in atmospheric carbon dioxide and reforestation after Indigenous collapse.
  *   **Awkward Commitment:** The start of our epoch is marked by a genocide-induced CO2 drop.

  **7. Event/Process View**
  *   **Statement:** The Anthropocene is an event or process rather than a time unit and has no business being dated.
  *   **Awkward Commitment:** Geologists are asking the wrong question entirely.

  **8. Ratchet View**
  *   **Statement:** The boundary is the earliest moment the Earth system could no longer return to its previous trajectory without intervention.
  *   **Awkward Commitment:** We are now permanently responsible for managing the planet's life support.

  **9. Renaming (Systemic)**
  *   **Statement:** The culprit is a mode of production or a plantation-and-slavery complex, not "humans."
  *   **Awkward Commitment:** Most humans alive today are innocent of causing this epoch.

  **10. Renaming (Material)**
  *   **Statement:** The epoch should be named after fire or plastic rather than humanity.
  *   **Awkward Commitment:** We are defined by our trash, not our agency.

  **11. Democratic Authority (Publics)**
  *   **Statement:** The authority to settle this belongs to affected publics rather than stratigraphers.
  *   **Awkward Commitment:** Scientific facts about the rock record are secondary to public opinion.

  **12. Democratic Authority (Historians)**
  *   **Statement:** The authority to settle this belongs to legislatures or historians rather than stratigraphers.
  *   **Awkward Commitment:** The rock record is less important than the political record.

