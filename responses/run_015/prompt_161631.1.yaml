answer: |-
  **Credence:** 0.38

  **Decomposition**

  1.  **Well-posedness (The Ideal Type Problem):** The claim is borderline ill-posed as stated because "Spirit of Capitalism" is a hermeneutic construct, not a latent variable with a clean indicator. You cannot put an ideal type on a spreadsheet. To make it empirically tractable, you must operationalize it as a residual: *economic behavior unexplained by incentives, institutions, or human capital.* This definition is vulnerable to the "omitted variable bias" critique (i.e., what you call "ethos" is just unmeasured institutional quality). Vindication requires showing that the residual persists across institutional regimes; refutation requires showing the residual vanishes when measurement of human capital/institutions improves.
  2.  **Mechanism (Doctrine vs. Disposition):** Weber is notoriously slippery here. Sometimes he argues the mechanism is *anxiety* (predestination uncertainty drives proof of election via work); sometimes it is *socialization* (ascetic discipline creates a habitus). The former requires conscious belief; the latter does not. Your proposition requires the latter (dispositions that outlive doctrine) to satisfy the "non-redundant" clause in the long run. If the mechanism is purely doctrinal anxiety, the effect dies with secularization.
  3.  **Confounding (The Literacy Channel):** This is the biggest leak in the hull. Protestant regions mandated literacy for Bible reading. Literacy drives growth. Recent econometrics (e.g., Becker & Woessmann) suggest that once you control for schooling and human capital, the "confessional gap" in economic outcomes shrinks drastically, often to insignificance. The "ethos" may just be the shadow cast by the schoolhouse.
  4.  **Direction of Causation (Selection Effects):** Commercial hubs were more likely to adopt Reformation doctrines (which challenged hierarchical authority) than agrarian backwaters. If urbanization and trade access are not perfectly controlled (and they never are perfectly), the correlation is spurious. The "Reformed" label is often an endogenous outcome of proto-capitalist social structures, not the exogenous cause.

  **The Zombie-Ethos Test**

  Does the result you described (Reformed region has higher capital 250 years later, but no difference in belief/practice) raise or lower credence?

  **It raises my credence.**

  Here is why: Weber's specific historical claim is not merely that Protestantism caused growth, but that it generated a *secular* economic ethic that eventually detached from its religious root. He calls this the "iron cage." He explicitly predicts that the "religious root" would die away while the "economic compulsion" remained.

  *   **Scenario A (Behavior collapses with belief):** This implies the mechanism was purely theological (fear of hell/desire for election). If the behavior stops when the theology stops, the "Spirit of Capitalism" never actually formed; there was only "Protestant Compliance." This refutes Weber's claim that a distinct, self-sustaining economic ethos emerged.
  *   **Scenario B (Behavior persists without belief):** This implies the cultural software was successfully installed and now runs on secular hardware. It demonstrates that the ethos achieved *autonomy* from the doctrine. Since your proposition requires the ethos to be a "non-redundant causal contribution" to *sustained* accumulation, the persistence of the behavior after the religious fade-out is the strongest possible evidence that the cultural transmission was real and not just a temporary epiphenomenon of religious fervor.

  *Constraint:* This only holds if you have truly ruled out institutional persistence (e.g., the Reformed region built better courts in 1600 that lasted until 1800). If institutions are matched, the persistence must be cultural.

  **Sensitivity Analysis**

  My final number (0.38) is most sensitive to **the magnitude of the human capital channel relative to the cultural channel.**

  If 90% of the Protestant economic advantage is mediated through literacy and numeracy (skills), then the "ethos" is redundant; it was just a marketing campaign for schooling. If even 30% of the advantage is residual (trust, time preference, work discipline) after controlling for skills and institutions, the strong thesis becomes viable. My credence hovers below 0.50 because the current literature suggests the human capital channel dominates, leaving little variance for "culture" to explain.

  **The One Piece of Evidence**

  **Micro-data on the Huguenot Diaspora (late 17th century).**

  *   **The Evidence:** Comparing the economic performance of Huguenot refugees (exogenously displaced Protestants) against native populations in host countries (often Catholic or Lutheran), *controlling for the refugees' often higher pre-existing artisanal skills.*
  *   **Why:** This is a natural experiment that separates *culture* from *local institutions* and *local religious environment*. The Huguenots brought their "ethos" into a different institutional and religious setting.
  *   **Direction of Move:**
      *   **Upward:** If Huguenot communities show significantly higher savings rates, capital accumulation, or industrial innovation than their native neighbors *after* controlling for their specific trade skills and education levels, it proves the "ethos" is a portable cultural asset independent of the local confessional regime. (Move to 0.65).
      *   **Downward:** If their economic advantage is fully explained by their specific trade skills (human capital) and vanishes when those are controlled for, it suggests there was no generalizable "Spirit," only specific vocational training. (Move to 0.15).

  This evidence cuts through the endogeneity of "why did this region become Protestant?" by looking at people who *were* Protestant but moved to a region that was not, isolating the cultural variable from the territorial one.
