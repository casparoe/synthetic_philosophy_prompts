      *   *Decision:* I will argue that the Zombie result *raises* credence because it validates Weber's specific prediction about the *secularization* of the ethic (the "iron cage"). It proves the cultural transmission was successful enough to decouple from the theology.
      *   *Refining the Number:* 0.45 is the user's. I'll go 0.38. I'm more skeptical about the "non-redundant" claim given the strength of the literacy channel.
      *   *Refining the Evidence:* Migration is good. But maybe "exogenous variation in exposure to preaching." Let's stick with the **migration of Huguenots**. They were exogenously displaced, took their culture elsewhere, and we can measure their economic performance against locals *controlling for* their (often higher) skills. If they outperform due to "ethos" rather than "skills," that's the key.

