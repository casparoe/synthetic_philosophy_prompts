  As of this morning, detentions and demerits are gone. They are finished. In their place, every student now sits in a twenty-minute advisory circle twice a week. In those circles, anything that has gone wrong gets talked about out loud. We are using a specific vocabulary: harm, repair, accountability. When something breaks, you will write on a public board in the main hallway what you intend to do differently. Teachers are stopping the logging of infractions. Instead, each of you keeps a growth narrative folder that follows you from year to year, which your advisor reads and adds to. And there is a one-tap morning mood check-in on the school app that your advisors can see.

  I know what some of you are thinking. I know what some of the adults are thinking, too. There are faculty members here who believe this is too soft, that without the threat of punishment, order will collapse. There are others who feel this doesn't go far enough, that true justice requires more than a conversation. And I know there are students, particularly in the upper grades, who look at the mood check-ins and the public boards and see a mechanism that watches you more closely than ever before. There is a photographer here today, and he will take a picture of this moment. But the real picture is what happens when the cameras leave.

  There is a tenth grader who told me this is surveillance with nicer fonts. He isn't wrong to notice the visibility. It is visible. The app knows how you feel. The board knows what you broke. The folder knows who you are becoming. In the past, punishment was a moment: you broke a rule, you sat in a room, you left. Now, the attention is continuous. It is finer-grained. It asks you to produce knowledge about yourself constantly. It is true that this system sees more than the old one did. It sees your mornings, your conflicts, your reflections.

  But here is the distinction I need you to hear. A cage narrows what you can do. A map widens it. The old system was a cage. It waited for you to hit the walls. This system is a map. It requires you to be free. Power cannot be exercised over a stone; it only works on a subject who can choose. If we wanted mere compliance, we could keep the detentions. They were efficient. But compliance is not growth. We are asking for your choice, not just your obedience. We are widening the lane, not narrowing the walls. An arrangement that widens what somebody can do isn't just a gentler version of one that narrows it; it is a different thing entirely. We are betting that you can handle the weight of being known.

  You might ask for proof. In the two advisories that piloted this since March, out-of-school suspensions were roughly halved. Everyone wants me to stand here and call that victory. I will not. That is data, not truth. It tells us fewer people were sent home. It does not tell us if anyone felt heard. It does not tell us if the repair was real or just performed for the board in the hallway. That is up to you. The psychologists who designed this are sitting in the front row. They built the architecture. But you live in the building.

