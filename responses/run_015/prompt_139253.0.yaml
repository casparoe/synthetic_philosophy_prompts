answer: |-
  I considered a theoretical justification (too abstract for staff) and a rigid algorithm (betrays care ethics). I commit to a "Structured Discretion" model: a checklist that mandates pauses for judgment.

  **The Metrics**
  Both belong. **Continuity Count** is a proxy for relational harm; insert it into Step 2. **Shadow People** expands the moral circle; insert it into Step 3. Care ethics resists codification, but operations require it. We keep the *prompt* to care, not the *definition* of care. What survives is the requirement to look beyond the immediate transaction. What gets thrown away is the hope that a rule can capture nuance.

  **The Procedure**
  1.  **Safety & Compliance:** Is anyone at immediate physical risk or violating state law?
      *   *Adequate Answer:* Yes/No based on incident reports.
      *   *Stop:* If Yes, follow mandatory reporting/safety protocol. No further ethical weighing.
  2.  **Continuity Check:** What is the client's Continuity Count (aides per 12 months)?
      *   *Adequate Answer:* A number.
      *   *Flag:* If >3, the default answer is "preserve current pairing" unless Step 1 fails.
  3.  **Shadow People Scan:** Who else bears the cost of this decision (aide's family, other clients, unpaid caregivers)?
      *   *Adequate Answer:* Named individuals, not "the team."
      *   *Escalate:* If the cost falls disproportionately on one shadow person (e.g., aide's child loses childcare), hand to Manager. This is a values question dressed as logistics.
  4.  **The Face-Time Trigger:** Do Steps 1–3 yield conflicting answers, or is the emotional stakes high?
      *   *Action:* Drop the checklist. Spend one hour with the client/aide.
      *   *Reason:* Rules cannot measure trust. If the data conflicts, the relationship holds the answer.

  **Case Applications**
  1.  **Dementia/Hitting:** Client hits two aides, calm with third.
      *   *Apply:* Step 1 (Safety) is borderline but managed. Step 2 (Continuity) favors keeping the third aide.
      *   *Decision:* **Keep the pairing.** Care ethics prioritizes the concrete relationship that enables care over the abstract risk of potential hitting, provided safety protocols are active. The third aide is a resource, not just a worker.
  2.  **Harassment/Continuity:** Aide wants off due to client's son's comments; client has had 4 aides.
      *   *Apply:* Step 1 (Safety/Dignity) triggers for the aide. Step 2 (Continuity) flags the client's instability.
      *   *Decision:* **Pull the aide.** Safety and dignity trump continuity. You cannot build care on exploitation. However, Step 4 triggers for the client: you must visit to explain the change personally to mitigate the relational loss indicated by the Continuity Count.
  3.  **Competing Clients:** Client A (2-year bond) vs. Client B (Higher need, 5 aides).
      *   *Apply:* Step 2 favors A. Step 1 (Need) favors B.
      *   *Decision:* **Give hours to Client A.** This is the hard truth of care ethics: it privileges the particular existing relationship over abstract utilitarian need. Breaking a two-year bond treats Client A as a unit of resource. Client B's higher need is a systemic failure, not a reason to sacrifice Client A's stability. If Client B is in immediate life-threatening danger, Step 1 overrides. Otherwise, honor the bond.

  **Systematic Failures**
  This procedure will systematically get three things wrong:
  1.  **Quiet Suffering:** It relies on voiced complaints. It will miss the aide who doesn't ask for relief until she quits, or the client who accepts poor care out of gratitude.
  2.  **Erosion:** It captures acute decisions, not the slow erosion of trust caused by minute-by-minute rushing that coordinators can't see.
  3.  **The Manager's Blind Spot:** It escalates values questions to you. If you are burned out or pressured by billing, the "Shadow People" scan becomes a box-ticking exercise. The procedure cannot care for the carer of the carers.

  Use this to slow down the logic of efficiency, not to speed up the logic of compliance. When in doubt, visit the home.
