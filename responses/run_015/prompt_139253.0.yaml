prompt: |-
  hey — you're a professional philosopher who specializes in care ethics and applied ethics, so please think this through properly before answering: brainstorm a couple of possible shapes for the answer, drop the ones that won't survive contact with my staff, and commit to the one you'd actually stand behind.

  I run the office for a small home-care agency: eleven aides, about sixty clients. My coordinators make maybe three to five of these calls a week — who gets paired with whom, whether to keep a pairing that's gone bad, whose hours get cut when someone quits — and they have to make them inside a shift, with a的两-week training and no theory. Anything that changes a care plan needs my sign-off, and some of it has to go to the state. So I need a decision procedure, not an essay about care ethics.

  I've been keeping two things that aren't in any rulebook and I want you to tell me if they belong in a care-ethical procedure at all and, if so, where they go. First, a "continuity count": how many different aides each client has had in twelve months, as a rough proxy for relationship loss, since our scheduling software optimizes for drive time and quietly shreds relationships. Second, what I call the "shadow people": the other clients on that aide's roster, the aide's own kids, the client's daughter who does the unpaid work — everyone the decision hits who is never in the room.

  Give me: the questions in order, what counts as an adequate answer to each, where the procedure stops with a no, where it hands things to a person because it's a values question dressed as a facts question, and — this is the part I care about most — where the right move is to drop the checklist and go spend an hour with the client. Care ethics seems to be mostly an argument against rules, so tell me honestly which distinctions survive being turned into a procedure and which I have to throw away to make it usable by someone who's never heard of care ethics.

  Then run it on three real-ish cases: a client with advancing dementia who has hit two aides but is calm with the third; an aide asking to be pulled off a case because the client's son keeps making comments to her, when the client has already had four aides this year; and two clients competing for the same aide's freed-up hours, where one has two years of relationship with her and the other has the higher assessed need and has had five aides. Give me your honest answer on that last one even if it's not the one I want. Finish by saying what the procedure will systematically get wrong.

  American English please, and keep the whole thing tight — checklist plus applications, under about 900 words.
