              *   *Alternative:* **Condorcet (Minimax) is the gold standard for "beating the majority loser" and respecting pairwise will, but counting is hard.**
              *   *Alternative:* **Instant Runoff (IRV/AV).** It is the standard "ranked ballot" alternative. It is hand-countable. It fixes the "31% winner" problem usually (requires 50%+1). It *does* violate IIA (ii). It *can* elect a Condorcet loser, but less often than Plurality.
