              *   *Better Method for (iv):* **Condorcet Method (specifically Minimax).**
              *   *Counting Burden:* 1,200 ballots. 5 candidates = 10 pairs. 12,000 checks. If the admin uses a tally sheet for each pair, it's doable in an afternoon (approx 5-6 seconds per ballot per pair? No, 1,200 ballots * 10 pairs = 12,000 operations. If 1 op = 5 seconds, that's 60,000 seconds = 16 hours. Too slow.)
