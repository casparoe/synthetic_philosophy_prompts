              *   *The "Bolt-on" argument:* Disqualification helps (iv) but adds complexity and risk of no candidates.
              *   *The "Arrow" argument:* True. We must sacrifice one.

      *   **Recommendation Strategy:**
          *   Acknowledge Member C (Arrow) is theoretically right. We cannot have it all.
