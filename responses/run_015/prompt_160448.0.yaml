          *   *Wait, check hand-counting:* A simple Condorcet method (like Minimax) requires tallying pairwise wins. With 1,200 ballots and say 5 candidates, that's 10 pairs. 1,200 * 10 = 12,000 marks. One person in an afternoon? That's tight. 4 hours = 14,400 seconds. 1 second per mark. It's risky.
          *   IRV is easier. Tally 1st prefs. Eliminate lowest. Transfer.
