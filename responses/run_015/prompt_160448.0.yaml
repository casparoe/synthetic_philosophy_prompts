              *   *How to satisfy (iv) with IRV?* Add Member A's veto *carefully*. "Any candidate ranked last by >50% is ineligible." If only one remains, they win. If multiple, IRV. If none remain, revert to Borda? No, keep it simple.
              *   *Actually, the prompt asks to recommend ONE concrete method.*
