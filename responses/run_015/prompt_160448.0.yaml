              *   If we use **Borda**, it's fastest to count. But Borda is terrible for (iv).
              *   If we use **Plurality with Runoff (Top-Two)**? Requires two counts. Doable in one afternoon. Satisfies (iv) better than Plurality. Fails (ii).
              *   *Best fit for constraints:* **Instant Runoff Voting (IRV) with a "Majority Last" Veto.**
              *   *Wait, is IRV explainable in a paragraph?* Yes.
              *   *Is it hand countable?* Yes, standard procedure for unions/societies.
