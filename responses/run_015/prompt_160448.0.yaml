      *   **Past Issues:**
          1.  Winner had 31% 1st prefs but was last for a majority (Condorcet Loser won?).
          2.  Candidate withdrawal changed the relative order of remaining candidates (Violation of Independence of Irrelevant Alternatives - IIA).
          3.  Tactical voting (ranking strong rivals last).
      *   **Committee Requirements:**
          1.  Pareto Efficiency (If everyone prefers A > B, B cannot beat A).
          2.  IIA (Relative order of A & B doesn't change if C withdraws).
