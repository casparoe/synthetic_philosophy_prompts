  # Problem Set 4: The Limits of Structure
  **Domain:** Three pitches {1, 2, 3} ordered by height, arranged in sequences of three.
  **Constraint:** No wraparound (3 does not succeed to 1); no arithmetic beyond counting.

  ### Item 1 (Control)
  **Source:** `1 2 3` $\to$ `1 2 1`
  **Target:** `1 1 3` $\to$ ?
  (A) `1 1 1`
  (B) `1 1 2`
  (C) `3 1 3`
  (D) `1 2 1`

  ### Item 2 (Target)
  **Source:** `1 2 3` $\to$ `1 2 1`
  **Target:** `3 2 1` $\to$ ?
  (A) `3 2 3`
  (B) `1 2 1`
  (C) `3 2 2`
  (D) `1 2 3`

  ---

  ## Instructor's Key & Analysis

  ### 1. Account Walkthroughs

  **The Surface Account (Positional Indexing)**
  *   **Mechanism:** Tracks absolute slot indices (1, 2, 3) and symbol identity. It forbids role predicates (First/Last) and magnitude predicates (Max/Min). It measures similarity by edit location and position-wise overlap.
  *   **Rule Extraction (Source):** Symbol at Index 3 changes. Its new value equals the symbol at Index 1.
  *   **Item 1 (Control):** Target `1 1 3`. Index 3 (3) changes to match Index 1 (1). Result: `1 1 1`. **(Verdict: A)**
  *   **Item 2 (Target):** Target `3 2 1`. Index 3 (1) changes to match Index 1 (3). Result: `3 2 3`. **(Verdict: A)**

  **The Relational Account (Role/Magnitude Slippage)**
  *   **Mechanism:** Tracks semantic roles (First, Last) and magnitude roles (Min, Max). Allows slippage where indices migrate to preserve role consistency.
  *   **Rule Extraction (Source):** The **Max** value (3) changes to the **Min** value (1). (Note: In Source, Max is at Index 3, Min is at Index 1).
  *   **Item 1 (Control):** Target `1 1 3`. Max is 3 (Index 3). Min is 1 (Index 1). Change Max to Min. Result: `1 1 1`. **(Verdict: A)**
      *   *Note:* Both accounts agree. The variable (position of magnitudes) is controlled.
  *   **Item 2 (Target):** Target `3 2 1`. Max is 3 (Index 1). Min is 1 (Index 3). Change Max to Min. Result: `1 2 1`. **(Verdict: B)**
      *   *Note:* Accounts disagree. Surface edits Index 3; Relational edits Index 1.

  ### 2. The Critical Feature
  **Feature Name:** **Magnitude-Position Decoupling**.
  In the Source, the Maximum value occupies the Final position. In the Target (Item 2), the Maximum value occupies the Initial position. This decoupling forces the Relational Account to shift the *location* of the edit to preserve the *magnitude* rule, whereas the Surface Account preserves the *location* of the edit and ignores the magnitude rule.

  ### 3. Removal Test
  **Alteration:** Change Item 2 Target to `1 2 3` (reverting to Source alignment).
  **Result:** Both accounts return `1 2 1`.
  **Collapse Direction:** The case collapses into agreement. The Relational Account no longer needs to shift the edit location because Max is again at Index 3. The Surface Account remains unchanged. The divergence is strictly dependent on the inversion of the magnitude-position mapping.

  ### 4. Strongest Attack (Defense of the Relational Account)
  **The Attack:** "You have rigged the intuition by relying on **Positional Inertia**. Naive solvers prefer `3 2 3` not because it is structurally superior, but because they are cognitively lazy; they treat the string as a fixed grid of slots rather than a dynamic configuration of values. The Relational answer `1 2 1` is objectively more robust because it generalizes across permutations. If the domain were musical pitches rather than visual slots, `1 2 1` (High-Low-High $\to$ Low-Low-High) preserves the *intervalic tension* of the Source transformation (resolution of the peak), whereas `3 2 3` merely copies a visual contour. The case isn't unfriendly; it exposes that 'intuition' is often just unexamined surface bias."

  **Does it succeed?** Partially. It succeeds in showing that `1 2 1` is not *nonsense*, but it fails to make `1 2 1` the *preferred* intuition. In analogy tasks, preserving the target's initial context (the "3" at the start) is usually weighted higher than normalizing the target to match the source's value profile. The attack highlights a valid philosophical stance (structural realism) but does not overturn the empirical fact that most solvers will choose `3 2 3`.

  ### 5. Grading Policy
  *   **Full Credit:** Selection of **(A) `3 2 3`**. Justification must cite positional consistency (e.g., "change the last symbol to match the first").
  *   **Partial Credit:** Selection of **(B) `1 2 1`**. Acceptable if the student explicitly argues for **Magnitude Preservation** over Positional Preservation (e.g., "The rule is 'collapse the highest pitch to the lowest', regardless of position"). This demonstrates mastery of the Relational Account, even if it conflicts with the majority intuition.
  *   **No Credit:** Selections (C) or (D), or inability to articulate the rule difference between Item 1 and Item 2.

  ---
  *Note to Instructor: This problem set satisfies constraints (i)-(v). It reverses the usual Copycat dynamic by making the Relational Account appear "over-fitted" to the Source's specific value configuration, thereby validating the Surface Account's simplicity in this specific microdomain.*
