answer: |-
  **Exam Question**

  **Question 1 (20 Marks)**

  Consider the **Basis-Fixed Analysis (BFA)** of dispositions:
  *Object $x$ is disposed to manifest $M$ if stimulated $S$ if and only if: if $x$ were stimulated $S$, and $x$ retained its intrinsic causal basis for $M$ throughout the stimulation, then $x$ would manifest $M$.*

  Evaluate the success of the BFA using the following two cases:

  1.  **The Reactive Shield:** A vase is fragile (its basis is a specific crystalline lattice). It is surrounded by nanobots programmed to detect that specific lattice. If the vase is struck ($S$), the bots detect the lattice and instantly generate a forcefield ($M$ does not occur). The forcefield activates *only* because the lattice is present.
  2.  **The Vanishing Wire:** A wire is conductive (basis: free electrons). When connected to a voltage source ($S$), a sensor detects the initial electron flow and instantly destroys the free electrons *during* the connection. The wire stops conducting before the current can be measured, but the connection ($S$) technically remains closed.

  Argue whether the BFA handles these cases correctly. Conclude by defending one of the following claims: (i) Finks and masks are symmetrical problems solvable by a single counterfactual reform; or (ii) Finks and masks reveal distinct flaws in the counterfactual approach, requiring different solutions or the abandonment of the analysis. Justify your choice.

  ***

  **Model Answer**

  The Simple Conditional Analysis (SCA) fails because it allows extrinsic interferers to falsify the conditional without removing the disposition. The Basis-Fixed Analysis (BFA) attempts to repair this by requiring the causal basis to persist through the counterfactual scenario. While BFA improves upon SCA regarding standard finks, it fails to handle the Reactive Shield and the Vanishing Wire, demonstrating that finks and masks are not symmetrical problems. Consequently, a single counterfactual reform is insufficient.

  First, consider the Reactive Shield. Under BFA, we ask: if the vase were struck and retained its crystalline lattice, would it break? The vase retains its basis (the lattice). However, the nanobots detect that very basis to activate the shield. Because the mask is triggered by the presence of the basis, holding the basis fixed *ensures* the mask activates. The BFA predicts the vase would break (since the basis is present), but in reality, the shield prevents breaking. The BFA yields a false positive. This differs from standard masks because the interferer is not independent; it is counterfactually dependent on the disposition itself. You cannot "subtract" the interferer while holding the basis fixed, because the interferer is a function of the basis.

  Second, consider the Vanishing Wire. Here, the basis is lost *during* the stimulation window. BFA requires the basis be retained "throughout the stimulation." But in this case, the stimulation ($S$) is a process (connection), not an instant. If the basis vanishes mid-stream, the condition "retained basis throughout" is false. BFA therefore implies the wire is *not* conductive. However, intuitively, the wire *was* conductive at the start of the stimulus; it was finked mid-flow. This case blurs the line between fink (loss of basis) and mask (interference with manifestation). It reveals a temporal ambiguity in BFA: does the basis need to exist only at the onset of $S$, or until the completion of $M$? If the former, it fails standard finks. If the latter, it fails cases where the basis is naturally consumed or destroyed by the stimulus.

  These failures show that finks and masks pull in different directions. Standard finks suggest we must hold the basis fixed to prevent the disposition from vanishing. However, the Reactive Shield shows that holding the basis fixed is insufficient if the environment tracks that basis. This is not a problem of temporal stability (like finks), but of **intrinsicness**. The Reactive Shield implies that whether an object has a disposition depends on whether its environment monitors its intrinsic structure. If we accept BFA, we must admit that dispositions are not purely intrinsic, as the truth of the analysis depends on external detectors tracking the basis.

  The Vanishing Wire, conversely, suggests the counterfactual framework is too rigid regarding time. Dispositions are causal powers that *produce* manifestations. If the power is destroyed in the producing, the counterfactual "if $S$ then $M$" is false, yet the power existed. This suggests the problem is not with the conditions of the counterfactual, but with using counterfactuals to analyze causation.

  Therefore, claim (ii) is correct. Finks and masks are not symmetrical. Finks are solved by stabilizing the basis, but masks (specifically dependent ones like the Shield) show that stabilizing the basis invites new interferers. A unified counterfactual reform cannot solve both because one requires fixing the internal property, while the other requires fixing the external environment relative to that property. To solve both, one must abandon the attempt to reduce dispositions to conditionals. Instead, dispositions should be treated as primitive causal powers. The truth of "the vase is fragile" grounds the counterfactuals, not vice versa. This explains why the vase is fragile even when the shield works (the power exists but is blocked) and why the wire is conductive even if the electrons vanish mid-stream (the power was exercised but interrupted). Only a powers ontology accommodates the asymmetry of these failures without rendering dispositions extrinsic or temporally incoherent.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  **1. Reconstruction of BFA and SCA context (4 Marks)**
  *   **4:** Clearly defines SCA failure (extrinsic interferers) and explains how BFA attempts to fix it (holding causal basis fixed).
  *   **2:** Defines BFA but fails to explain *why* it was proposed (i.e., treats it as arbitrary).
  *   **0:** Confuses BFA with SCA or gets the conditional direction wrong.
  *   *Common Error:* Students recite the standard "sorcerer" fink case instead of explaining the structural logic of the BFA reform.

  **2. Analysis of Case 1 (Reactive Shield) (4 Marks)**
  *   **4:** Identifies that retaining the basis *triggers* the mask, causing BFA to predict breaking (false positive). Notes the dependency between basis and interferer.
  *   **2:** Identifies it as a mask but claims BFA solves it (ignoring the dependency).
  *   **0:** Treats it as a standard fink or ignores the case.
  *   *Common Error:* Assuming the shield counts as an "extrinsic" factor that can be held fixed independently of the basis.

  **3. Analysis of Case 2 (Vanishing Wire) (4 Marks)**
  *   **4:** Highlights the temporal ambiguity: basis loss occurs *during* $S$. Shows BFA verdict depends on arbitrary definition of "throughout."
  *   **2:** Identifies it as a fink but fails to address the "mid-stream" complication.
  *   **0:** Claims the wire is simply not conductive.
  *   *Common Error:* Ignoring the temporal overlap and treating it as a standard pre-stimulus fink.

  **4. Stand on Symmetry (Finks vs. Masks) (4 Marks)**
  *   **4:** Argues they are distinct/asymmetrical (Finks = temporal stability; Masks = extrinsic monitoring).
  *   **2:** Argues they are the same problem but offers weak justification.
  *   **0:** No clear stand taken.
  *   *Common Error:* Asserting symmetry because both refute SCA, without noticing they refute BFA differently.

  **5. Consequence for Disposition Ontology (4 Marks)**
  *   **4:** Concludes that counterfactual analysis is fundamentally flawed; suggests primitive powers or admits non-intrinsicality.
  *   **2:** Suggests a minor tweak to BFA (e.g., "add no-interferer clause") without seeing the circularity.
  *   **0:** Concludes BFA is basically correct.
  *   *Common Error:* Proposing a "ceteris paribus" clause without explaining how to specify it non-circularly.

  **Differentiation: A vs. B Grade**

  *   **B Grade:** Hits all 5 points competently. Correctly applies the BFA to the cases and concludes that BFA fails. The argument stays within the bounds of the prompt's explicit constraints.
  *   **A Grade:** Makes the **Intrinsicality/Circularity Move**. In point 2 or 5, the student explicitly notes that the Reactive Shield case proves dispositions cannot be *intrinsic* if analyzed via BFA, because the truth condition relies on the environment's reaction to the basis. Alternatively, they identify that specifying "causal basis" without referencing the manifestation leads to circularity in the Reactive Shield case (the basis is defined by what it does, but what it does is blocked by something tracking the basis).
  *   **Recognition:** Look for the phrase "intrinsicness threatened" or "circularity of basis specification" in the context of Case 1. The A student realizes the prompt's Case 1 isn't just a harder mask; it's an argument against the metaphysical assumption stated in the course background (that dispositions are intrinsic).

  ***

  **Notes for Markers**
  *   **No Citations:** Do not penalize for lack of names (Lewis, Martin, etc.). The question tests understanding of the logic, not reading recall.
  *   **The "Stand":** Students *must* choose (i) or (ii). A "hedging" answer that says "it depends" without a final metaphysical commitment should lose marks on Point 4.
  *   **Word Count:** The model answer is tight. Students writing 3 pages of fluff on standard fink cases should be penalized on Point 1 and 2 for relevance.
