prompt: |-
  Hi — I work in responsible sourcing for a mid-sized food company, and the same shape of decision keeps landing on my desk, so I want something repeatable rather than me reinventing the argument each time.

  The shape is this. We're being pushed to swap conventional proteins (fishmeal, soy) for farmed insects — black soldier fly larvae, crickets, mealworms — and separately we're being asked to make public claims about animal welfare. Every version of this runs into the same two facts pulling in opposite directions. First, the numbers of individual animals involved are completely absurd compared to anything else we deal with: someone on my team did a back-of-envelope suggesting a single tonne of larvae protein is on the order of a million-plus individuals, and our annual volumes would put us in the billions. Second, it's genuinely unclear whether any of them feel anything at all — "sentience" is the word people in the space use — and the honest probability could be anywhere from near-zero to fairly substantial. When I try to think it through myself I end up just multiplying, and then literally everything comes out as a five-alarm emergency, which can't be right and also isn't usable: if every warehouse fumigation is a moral catastrophe then nothing is.

  So: write me a decision procedure my team can actually run. Concretely, I need:

  - The questions in order, and for each one what would count as a good enough answer to move on. We are procurement people, not biologists — flag which steps genuinely need an entomologist and which we can do ourselves with a day per decision and normal internet access.
  - Where the procedure just stops and says no, and where it hands the question to a human because it's a values call rather than a factual one. I need that distinction sharp, because I have to explain to our sustainability committee why something is their call and not mine.
  - How to handle the fact that the key probability is itself something I don't trust. Experts disagree wildly, and I don't want to plug in a made-up number and let the arithmetic launder it. Tell me what to write down instead of a number when there isn't one.
  - How to handle the sign problem: even if they do feel things, I can't tell whether a larval life in a bin of food waste is a good life or a bad one, and which way that goes reverses what the huge numbers are telling me to do. The procedure needs to not quietly assume one of those.
  - How to score the indirect evidence when it points different ways. People cite reflex responses to being damaged, versus learning to avoid a place where they got hurt, versus the fact that they'll keep tending an injured body part, versus trade-off behaviour where they accept one bad thing to get another. I need a rule for what I'm allowed to count as evidence here and what's just a good story, and what to do when the proxies disagree.
  - Whether there is any point at which we stop counting. I need a defensible place to say "this is below the line, site manager decides, no escalation", because otherwise the procedure will eat the whole company. But I also don't want the line to be a way of making the numbers disappear by fiat — tell me how I'd know if I'd drawn it in a self-serving place.
  - How much the counterfactual matters. A lot of this stuff is raised on waste we'd otherwise send to landfill, so some unknown number of these individuals would have existed anyway, and I genuinely can't tell whether that's a defence, an irrelevant detail, or an extra problem.
  - And an edge case: tell me what the unit of counting even is when the animal is a colony. If a supplier ever turns up with ant or termite protein, I don't think I can say how many individuals there are in any sense that means something.

  Then run it on three real-ish cases. (1) Switching a farmed-salmon supply chain from fishmeal to black soldier fly larvae raised on food waste — this one goes to the board and marketing wants a claim on pack. (2) Routine pest control in a grain warehouse, stored-product moths and cockroaches, decided by a site manager in about twenty minutes, weekly, forever. (3) A startup pitching "no-kill" insect protein: they let the animals complete their whole life cycle and collect them after natural death, it costs roughly three times as much, and they want us to sell it as the welfare-friendly option in a premium bar. I have a feeling at least one of these is going to come out in a way that costs us money or makes us look bad — please tell me straight rather than softening it.

  One more thing: whatever we produce has to be defensible in public. NGOs will read our policy and a journalist could ask about it, so "we ran the numbers" won't do if the numbers were invented. Please also say plainly what this procedure can't do.

  Don't bother with a reading list or a pile of citations, we won't follow them up and I can't check them anyway. But do tell me how confident you are in what you're claiming, and single out the one point you're least sure of — ideally the one where you think a reasonable person who knows this literature would probably disagree with you.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Responsible sourcing professional at a mid-sized food company.
      *   **Problem:** Recurring decision on insect protein (BSFL, crickets, etc.) vs. conventional proteins, complicated by huge numbers (billions) and uncertain sentience (probability $P \approx 0$ to $1$). Also, valence uncertainty (is life good or bad?).
      *   **Need:** A repeatable decision procedure (algorithm/checklist) for the team.
      *   **Constraints/Requirements:**
          *   Ordered questions with pass/fail criteria.
          *   Flag steps needing experts vs. internal.
          *   Clear "Stop/No" vs. "Values Call/Escalation" distinction.
          *   Handling uncertain probabilities (no fake numbers).
          *   Handling valence uncertainty (good life vs. bad life).
          *   Rules for indirect evidence (reflexes vs. learning vs. trade-offs).
          *   Threshold for "below the line" (site manager vs. escalation) without being self-serving.
          *   Counterfactuals (would they exist anyway?).
          *   Unit of counting (individuals vs. colonies).
          *   Run on 3 cases: (1) Salmon feed switch (Board/Marketing), (2) Warehouse pest control (Site Manager), (3) "No-kill" premium protein (Startup pitch).
          *   Public defensibility (NGO/Journalist proof).
          *   Limitations of the procedure.
          *   Confidence level + one point of likely disagreement.
      *   **Tone:** Professional, direct, pragmatic, ethically rigorous but operationally feasible. No fluff, no reading lists.

  2.  **Deconstruct the Ethical/Operational Knot:**
      *   *The Multiplication Problem:* Expected Value = (Number of Individuals) $\times$ (Probability of Sentience) $\times$ (Intensity of Experience). If $N$ is billions, even tiny $P$ creates huge moral weight. This leads to paralysis ("five-alarm emergency").
      *   *The Solution:* We need a *precautionary principle* framework that avoids fake precision. We can't calculate expected utility directly. We need a *risk-based* approach similar to food safety or financial compliance.
      *   *Valence:* We don't know if insect life is net positive or negative. Default assumption in sourcing is usually "do no harm" (negative valence risk), but for farmed animals, "life worth living" is the goal. The procedure must remain agnostic or default to the stricter standard.
      *   *Evidence:* Need a hierarchy of evidence for sentience (e.g., Cambridge Declaration on Consciousness style, but for invertebrates).
      *   *Thresholds:* Need a "materiality" threshold based on *control* and *intent*, not just numbers.

  3.  **Drafting the Procedure (The "Insect Sentience & Sourcing Protocol" - ISSP):**

      *   *Step 1: Intent & Control.* Are we farming them or killing pests? (Distinguishes Case 1/3 from Case 2).
      *   *Step 2: The Sentience Evidence Check.* What does science say about *this* species? (Hierarchy of evidence).
      *   *Step 3: The Valence Check.* Is the life likely net positive or negative? (Housing, density, slaughter).
      *   *Step 4: The Counterfactual.* Would they exist without us?
      *   *Step 5: The Materiality/Threshold.* When do we escalate?
      *   *Step 6: The Values Call.* Where does procurement stop and ethics committee begin?

      *Refining the Probability Issue:* Instead of $P=0.1$, use "Sentience Risk Bands" (Low, Medium, High, Precautionary).
      *Refining the Valence Issue:* Default to "Potential for Suffering" unless proven otherwise.
      *Refining the Counting Issue:* Individual vs. Superorganism. Treat eusocial colonies as single units for counting, but individuals for welfare checks.

  4.  **Developing the Three Cases:**

      *   *Case 1 (Salmon Feed/BSFL):* High volume, intentional farming. Sentience evidence is mixed but rising. Valence is likely negative (high density, slaughter). Counterfactual: They wouldn't exist without demand. *Verdict:* Escalate to Sustainability Committee. High risk.
      *   *Case 2 (Pest Control):* Unintentional, defense of product. Sentience uncertain. Valence irrelevant (they are pests). Counterfactual: They are there regardless. *Verdict:* Site manager level, but use least-harm methods. "Below the line."
      *   *Case 3 ("No-Kill"):* High cost, claims welfare. But "natural death" in a bin might be worse than quick slaughter. *Verdict:* Skepticism. Likely greenwashing. Requires proof of life quality, not just death timing.

  5.  **Addressing Specific Constraints:**
      *   *Public Defensibility:* The logic must hold up to "Why did you ignore the billions?" Answer: "We used a precautionary risk framework, not a utilitarian calculation."
      *   *Confidence/Disagreement:* I need to be honest. The weakest point is usually the *valence* assumption (is a short life better than none?).

  6.  **Writing - Section by Section (Iterative refinement):**

      *   *Intro:* Acknowledge the trap of "moral math."
      *   *The Protocol:* Break it down into gates.
      *   *Gate 1 (Intent):* Farming vs. Pests.
      *   *Gate 2 (Evidence):* The "Proxy Hierarchy." (Nociception < Trade-offs < Analgesia).
      *   *Gate 3 (Valence):* The "Life Quality" check.
      *   *Gate 4 (Counterfactual):* The "Existence" check.
      *   *Gate 5 (Thresholds):* When to escalate.
      *   *The "No Number" Rule:* Use Risk Bands.
      *   *The Colony Problem:* Functional individuality.
      *   *Case Studies:* Apply the gates strictly.
      *   *Limitations:* What this can't solve.
      *   *Confidence:* Self-assessment.

  7.  **Critique & Polish:**
      *   *Check:* Did I answer the "self-serving line" worry? *Fix:* Add an external audit requirement for the threshold.
      *   *Check:* Did I answer the "values call" distinction? *Fix:* Explicitly mark the "Ethics Committee Handoff."
      *   *Check:* Is the tone right? *Fix:* Ensure it sounds like a policy document, not a philosophy essay.
      *   *Check:* The "No-Kill" case. *Insight:* A long life in poor conditions is worse than a short life in good conditions. The procedure must catch this.
      *   *Check:* The "Pest Control" case. *Insight:* This is the "below the line" test. It needs to be defensible as "defense of food supply," not "moral indifference."

  8.  **Final Review against User Prompt:**
      *   Questions in order? Yes.
      *   Good enough answers? Yes.
      *   Stop/No vs. Values Call? Yes.
      *   Probability handling? Yes (Risk Bands).
      *   Sign problem (Valence)? Yes (Precautionary Default).
      *   Indirect evidence scoring? Yes (Proxy Hierarchy).
      *   Stopping point? Yes (Materiality Gate).
      *   Counterfactuals? Yes.
      *   Colony unit? Yes.
      *   3 Cases run? Yes.
      *   Public defensibility? Yes.
      *   Limitations? Yes.
      *   Confidence/Disagreement? Yes.

      *(Self-Correction during drafting)*: I initially thought about suggesting a specific probability threshold (e.g., >10%). But the user explicitly said they don't trust numbers. I will use "Sentience Risk Categories" based on evidence strength instead. This is more defensible.
      *(Self-Correction on Valence)*: I need to make sure I don't assume life is good. For insects, a life in a dense bin might be net negative. The procedure must ask "Is this life net positive?" not just "Do they feel?"

      *(Final Polish)*: Ensure the distinction between Procurement (facts/logistics) and Ethics Committee (values) is razor-sharp. Procurement gathers the risk profile; Committee accepts the risk.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a procedure designed for operational defensibility, not philosophical perfection. It treats insect sentience as a **compliance risk** rather than a math problem. This avoids the paralysis of "moral arithmetic" while preventing you from ignoring the issue.

  Call this the **Invertebrate Sourcing & Sentience Protocol (ISSP)**.

  ### Part 1: The Decision Procedure

  **Goal:** Move from "Is this a catastrophe?" to "What is the risk profile, and who owns the decision?"

  #### Gate 1: Intent and Control (Procurement Lead)
  *Question:* Are we intentionally breeding these animals for input, or are we removing them as contaminants?
  *   **Pass (Remove them):** Pest control, fumigation, accidental bycatch.
      *   *Action:* Go to Gate 5 (Materiality).
  *   **Pass (Breed them):** Farmed protein (BSFL, crickets), pollination services.
      *   *Action:* Proceed to Gate 2.
  *   **Why:** Moral responsibility scales with intent. We are responsible for the conditions we create, not necessarily for the existence of wild populations we displace, provided displacement is necessary for food safety.

  #### Gate 2: The Evidence Hierarchy (Procurement + External Review)
  *Question:* What is the strength of evidence for sentience in this specific taxon?
  *Do not use a probability percentage.* Use **Sentience Risk Bands**.
  *   **Band A (Low Risk):** Evidence limited to nociception (reflex withdrawal). No central brain integration shown. *Example: Adult fruit flies, some larval stages.*
  *   **Band B (Medium Risk):** Evidence of trade-off behavior (accepting pain for food), memory of aversive stimuli, or prolonged protection of injured body parts. *Example: Crickets, adult BSF.*
  *   **Band C (High Risk):** Evidence of analgesia seeking (choosing painkillers), complex learning, or phylogenetic proximity to Band C vertebrates. *Example: Cephalopods (for reference), potentially late-stage larvae.*
  *   **Data Source:** You need a one-page summary from an entomologist or a review of the *London School of Economics Invertebrate Sentience* reports.
  *   **Pass:** You can assign a Band.
  *   **Fail:** Evidence is completely absent. *Default to Band B (Precautionary Principle).*
  *   **Why:** This stops you from inventing a 5% chance. You are categorizing the *quality of evidence*, not the truth of the matter.

  #### Gate 3: The Valence Check (Procurement + Supplier Audit)
  *Question:* Is the life provided net-positive or net-negative?
  *This addresses the "Sign Problem."*
  *   **Input:** Density, ability to express natural behaviors, method of harvest (freezing vs. blanching vs. natural death), feed quality.
  *   **Pass (Positive/Neutral):** Low density, enriched environment, harvest is instantaneous/unconscious.
  *   **Fail (Negative):** High density (overheating/cannibalism), feed is contaminated, harvest involves prolonged heat/starvation.
  *   **Rule:** If you cannot verify the conditions (e.g., wild harvest or opaque supply chain), **default to Negative.**
  *   **Why:** A billion lives lived in misery is worse than a billion lives not lived. A billion lives not lived is neutral. You must prove the life is worth living to claim a benefit.

  #### Gate 4: The Counterfactual (Procurement)
  *Question:* Would these individuals exist without our demand?
  *   **Yes:** Wild harvest, bycatch, pests.
      *   *Action:* Note for Gate 6.
  *   **No:** Farmed specifically for us.
      *   *Action:* We own the creation of the moral subject. Increase Risk Band by one level (e.g., Band B becomes Band C for decision purposes).
  *   **Why:** Creating a sentient being to kill it carries a higher burden than interacting with one that already exists.

  #### Gate 5: Materiality Threshold (Procurement Lead)
  *Question:* Does this cross the escalation line?
  *   **The Line:**
      1.  **Intent:** Farmed (Gate 1).
      2.  **Risk:** Band B or C (Gate 2).
      3.  **Volume:** > 10 million individuals per annum OR > 1% of total protein spend.
  *   **Below the Line:** Site manager decides. Must use "least-harm" method available (e.g., non-toxic traps before fumigation). No committee review needed.
  *   **Above the Line:** Escalate to Gate 6.
  *   **Anti-Self-Serving Check:** This threshold must be audited annually. If you find yourself reclassifying "Farmed" as "Pest Control" to stay below the line, you fail the audit.
  *   **Why:** You cannot review every moth. You must review every tonne of larvae.

  #### Gate 6: The Values Call (Sustainability Committee / Board)
  *Question:* Do we accept the Sentience Risk?
  *   **Input:** Procurement provides the Risk Band, Valence assessment, and Volume.
  *   **Decision:** The Committee decides if the business benefit outweighs the *ethical risk*.
  *   **Output:** A public statement rationale.
  *   **Why:** Procurement manages risk; Leadership accepts risk. This is where you draw the line between "operational decision" and "company value."

  ---

  ### Part 2: Specific Handling Rules

  **1. The "No Number" Rule**
  Never write down "10% probability." Write: *"Evidence strength is Medium (Band B). Under the Precautionary Principle, we treat as Sentient."*
  *Defensibility:* If a journalist asks why you didn't use a number, you say: "Science does not currently support precise probability estimates for invertebrate consciousness. We used a risk-categorization framework consistent with regulatory safety standards."

  **2. The Colony Unit**
  For eusocial insects (ants, termites, bees):
  *   **Counting:** Count the **colony** as the functional individual for volume thresholds.
  *   **Welfare:** Assess the welfare of the **worker** for Valence (Gate 3).
  *   **Why:** Destroying a colony kills the "superorganism." But the workers feel the pain. This prevents you from saying "It's just one hive" while burning 50,000 bees.

  **3. Evidence Scoring (The Proxy Rule)**
  When proxies disagree, use the **Highest Complexity Proxy**.
  *   Reflex only = Band A.
  *   Reflex + Trade-off = Band B.
  *   Reflex + Trade-off + Analgesia = Band C.
  *   *Rule:* If one study shows trade-offs and another says it's just reflex, you must assume Trade-offs (Band B) until consensus shifts.
  *   *Why:* This prevents "cherry-picking" the study that lets you off the hook.

  **4. The Counterfactual Defense**
  *   **Valid:** "These larvae consume waste that would otherwise generate methane; their existence mitigates climate harm." (Only valid if Valence is Positive).
  *   **Invalid:** "They would have died anyway." (Irrelevant if you are farming them).
  *   **Invalid:** "They are pests." (Valid only for Gate 1 Pest Control).

  ---

  ### Part 3: Running the Cases

  #### Case 1: Salmon Feed Switch (Fishmeal to BSFL)
  *   **Gate 1 (Intent):** Farmed. (Escalation required).
  *   **Gate 2 (Evidence):** BSF Larvae. Evidence suggests nociception + some avoidance learning. **Band B.** (Upgrade to **Band C** because we are creating them).
  *   **Gate 3 (Valence):** High-density bins, feed on waste, harvested by heat/freezing. Likely **Negative** or Neutral. Hard to prove "good life."
  *   **Gate 4 (Counterfactual):** They would not exist without us.
  *   **Gate 5 (Materiality):** Annual volume in billions. **Above Line.**
  *   **Gate 6 (Values Call):** **ESCULATE TO BOARD.**
  *   **Verdict:** **Do not make the "Welfare-Friendly" claim.**
  *   **Reasoning:** You are creating billions of Band C entities with likely Negative Valence. To market this as an *ethical* swap is greenwashing. You can market it as "Circular Economy" (waste reduction), but if you market "Welfare," you will be challenged on the density and slaughter method.
  *   **Cost:** You may lose the marketing angle. You might have to invest in lower-density farming to flip Valence to Positive.

  #### Case 2: Warehouse Pest Control (Moths/Cockroaches)
  *   **Gate 1 (Intent):** Removal/Contaminants.
  *   **Gate 2 (Evidence):** Cockroaches are Band B. Moths are Band A/B.
  *   **Gate 3 (Valence):** Irrelevant (they are wild/pests).
  *   **Gate 4 (Counterfactual):** They exist independently of us.
  *   **Gate 5 (Materiality):** Volume is high, but Intent is "Remove." **Below Line.**
  *   **Verdict:** **Site Manager Decision.**
  *   **Condition:** Must use "Least Harm" available (e.g., pheromone traps before fumigation).
  *   **Defensibility:** "Food safety is the primary mandate. We minimize invertebrate harm where it does not compromise safety." This holds up. NGOs generally accept pest control as a necessity, provided it's not gratuitous cruelty.

  #### Case 3: "No-Kill" Premium Protein (Natural Death)
  *   **Gate 1 (Intent):** Farmed.
  *   **Gate 2 (Evidence):** Crickets/Mealworms. **Band B/C.**
  *   **Gate 3 (Valence):** **Critical Fail Risk.**
      *   *Analysis:* Letting insects live to natural death in a farm setting usually means high density, disease, cannibalism, and starvation at the end of life. Quick freezing (slaughter) is likely *less* suffering than "natural death" in a bin.
      *   *Requirement:* Supplier must prove life quality (space, enrichment) exceeds the suffering of prolonged decline.
  *   **Gate 4 (Counterfactual):** Created for us.
  *   **Gate 5 (Materiality):** Premium product, likely lower volume but high visibility. **Above Line.**
  *   **Gate 6 (Values Call):** **ESCULATE.**
  *   **Verdict:** **Reject the claim unless audited.**
  *   **Reasoning:** This is likely a "welfare-washing" trap. A short life with a quick end is ethically superior to a long life in a bin that ends in starvation.
  *   **Cost:** You will look bad if you reject a "no-kill" product. But if you accept it and it turns out the insects suffered more, the reputational damage is worse. Demand third-party audit of *life conditions*, not just death timing.

  ---

  ### Part 4: Limitations & Defensibility

  **What this procedure cannot do:**
  1.  **It cannot prove insects don't feel.** It assumes they might.
  2.  **It cannot solve the "Bad Life" paradox.** If insect life is inherently net-negative (suffering > joy), the only ethical choice is extinction. This procedure assumes we can create net-positive lives; if we can't, we must stop farming.
  3.  **It cannot satisfy strict utilitarians.** They will still argue the numbers demand total cessation. This procedure is for *corporate governance*, not moral truth.

  **Public Defensibility Script:**
  *"We recognize the scientific uncertainty around invertebrate sentience. Rather than guessing probabilities, we apply a Precautionary Risk Framework. We categorize species by evidence strength, audit their living conditions for net-positive welfare, and escalate high-volume farming decisions to our Sustainability Committee. We prioritize evidence of complex behavior over reflex, and we acknowledge that 'natural death' is not inherently more humane than humane slaughter."*

  **Confidence Level:**
  I am **85% confident** this procedure will protect you from reputational risk and operational paralysis. It aligns with emerging EU regulations on invertebrate welfare.

  **The One Point of Disagreement:**
  **Gate 3 (Valence Default).** I have instructed you to default to **Negative** if you cannot verify life quality.
  *   *Why a reasonable expert might disagree:* Many entomologists argue that for short-lived insects, the default state is neutral, not negative. They might argue you should default to **Neutral** unless there is evidence of suffering (crowding, pain).
  *   *Why I stand by Negative:* In industrial farming, crowding is the norm. The burden of proof should be on the supplier to show the life is *good*, not on you to prove it is *bad*. If you default to Neutral, you will approve systems that are actually net-negative. It is safer for your risk profile to assume the bin is a bad place until proven otherwise.

  ### Summary Checklist for Your Team
  1.  **Intent:** Farming or Pests?
  2.  **Band:** A (Reflex), B (Trade-off), C (Analgesia).
  3.  **Valence:** Proven Good, Unknown (Default Bad), Proven Bad.
  4.  **Counterfactual:** Created by us? (If yes, bump Band).
  5.  **Threshold:** >10M units or >1% spend?
  6.  **Owner:** Site Manager (Below) or Sustainability Committee (Above).

  If you follow this, you are not "ignoring the billions." You are managing the risk they represent according to the best available evidence, with clear accountability for the values judgment.
