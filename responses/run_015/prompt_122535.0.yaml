prompt: |-
  Hey — I could use a hand designing one session of my seminar. It's a mixed room, about 16 philosophy and CS master's students, 75 minutes, one whiteboard, printed 5x5 grids, index cards, no laptops. The topic is inverse reinforcement learning: inferring what someone wants from watching what they do. Most of them will arrive assuming it's basically mind-reading from video footage, and I want them to leave with the reverse feeling — that the behavior alone constrains almost nothing until you bolt on assumptions, and that the assumptions are carrying nearly all the weight. They should hit that before I name it.

  Rough shape I have in mind (tell me if it won't work): a "demonstrator" student gets a secret reward sheet and walks a route on the grid while everyone else writes down what they think she's being rewarded for and how confident they are. Three wrinkles I really want in there:

  1. what I'm calling the prohibition problem — she avoids certain cells, and you cannot tell from the route whether she dislikes them, is forbidden from entering them, or simply doesn't know they're there. I want the room to discover that "avoided" doesn't mean "disliked" by getting burned on it, not by being told.
  2. a transplant test — same demonstrator, new grid where the previously locked cells are open and an old shortcut is gone. Half the room is only permitted to copy her actions, the other half has to state a reward function, and we score everyone's predicted route on the new map. I expect the cloners to loose badly there, but tell me if I've got that backwards.
  3. one demonstrator who is deliberately not optimal — she's satisficing, or following some rule like "keep the wall on your left" — while still producing a route that looks perfectly sensible on the first grid, so that whatever reward everyone infers from her is a confabulation.

  I'd also like two demonstrators with genuinely different reward sheets to produce identical routes, revealed late, plus a moment where the class realises that the reward function is really a whole family of them. A colleague mentioned something about adding a potential-based term and the optimal policy not budging at all; I'd like that to land as something they can't resolve from the evidence in front of them, not as a slide.

  Can you give me the rules and materials, a payoff scheme that needs no money and penalises hedging (I was thinking they have to commit to an exact route and bet points on it), a minute-by-minute timeline for the 75, and a debrief that maps specific things that happened in the room onto specific assumptions — optimality, known dynamics, the choice of features, and whatever tie-break rule you use to pick between explanations that fit equally well, since a couple of them will have heard of "maximum entropy" and will want to know where it slots in. No lecture up front, and nobody should hear the words "identifiability" or "degeneracy" until afterwards.

  Finally: what will predictably go wrong the first time I run this — the secret leaking, someone proposing the reward "just take this exact route," a demonstrator being sloppy — how I should handle each, and honestly which part of it I'll definately just have to say out loud because the game can't produce it. I'd rather know before I'm halfway through.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar design:

  1.  **Analyze the Request:**

      *   **Target Audience:** 16 Master's students (Philosophy & CS mix).
      *   **Topic:** Inverse Reinforcement Learning (IRL) - inferring rewards from behavior.
      *   **Core Learning Goal:** Move from "behavior = mind reading" to "behavior is under-constrained without heavy assumptions."
      *   **Constraints:** 75 minutes, 1 whiteboard, printed 5x5 grids, index cards, no laptops.
      *   **Key Mechanics/Wrinkles:**
          1.  *Prohibition Problem:* Avoidance $\neq$ Dislike (could be constraints/unknown).
          2.  *Transplant Test:* Copying actions vs. Inferring rewards on a new map (cloners should lose).
          3.  *Sub-optimality:* Demonstrator isn't optimal (satisficing/heuristic), leading to confabulated rewards.
          4.  *Equivalence:* Different rewards $\rightarrow$ Same route (non-identifiability).
          5.  *Potential-Based Shaping:* Rewards can change without changing policy (needs to be experienced, not lectured).
      *   **Requirements:** Rules, materials, payoff scheme (no money, penalize hedging), minute-by-minute timeline, debrief mapping, prediction of failure modes.
      *   **Tone:** Practical, rigorous, anticipatory of classroom dynamics. No jargon ("identifiability") until the end.

  2.  **Evaluate the User's "Rough Shape":**

      *   *Demonstrator walking a route:* Good, kinesthetic.
      *   *Prohibition Problem:* Needs careful setup so students don't assume "everything is allowed."
      *   *Transplant Test:* Copying vs. Reward Inferring. *Critique:* If the cloners just copy the *sequence* of moves (Up, Up, Right), they will hit walls immediately on a new map. If they copy the *path* (relative to landmarks), they might do okay. The prompt says "copy her actions." I need to ensure the "Reward Inferrers" actually have an advantage. This requires the new map to change the *optimal path* for the inferred reward, while the copied path becomes suboptimal or impossible.
      *   *Sub-optimality:* Hard to enforce without the class knowing. If the demonstrator is "satisficing," the class might assume she's optimal and infer wrong rewards. This is the point, but needs management so it doesn't look like "the demonstrator messed up."
      *   *Equivalence:* Two different reward sheets producing identical routes. This is the "Potential-Based Shaping" insight.
      *   *Payoff:* Needs to penalize hedging. Betting points on a specific route is good.

  3.  **Designing the Mechanics (Iterative Process):**

      *   *Grid:* 5x5 is good. Start (S), Goal (G), Obstacles (X).
      *   *Reward Sheets:* Need to be distinct but produce same behavior.
          *   Sheet A: +10 for Goal, -1 per step.
          *   Sheet B: +10 for Goal, -1 per step, +0.5 for visiting specific cell (that is on the optimal path anyway).
          *   *Wait, the Potential-Based Shaping point:* $R' = R + \gamma \Phi(s') - \Phi(s)$. This preserves optimal policy. I need to simulate this without math.
          *   *Simpler version for game:* Reward for "Getting to Goal" vs. Reward for "Getting to Goal via specific corridor." If the corridor is the *only* way, the behavior is identical.
      *   *The "Prohibition" Wrinkle:* Some cells are "Lava." Is it -100 reward (dislike) or -Infinity (forbidden)? Behaviorally identical if optimal.
      *   *The "Transplant" Wrinkle:* Map 2 opens the Lava but blocks the corridor.
          *   Inferrers (who thought it was "Dislike") will go through Lava.
          *   Inferrers (who thought it was "Forbidden") won't.
          *   Cloners (who copied "Avoid Lava") will try to avoid it even if safe? Or will they fail because the path is blocked?
          *   *Correction:* The prompt wants Cloners to lose. Cloners copy *actions*. If Map 2 changes geometry, exact actions (Up, Right) might hit a wall. If they copy *trajectory* (avoiding specific cells), they might take a suboptimal route. The Reward Inferrers should find the *new* optimal path for the *goal*.
      *   *Sub-optimality:* Demonstrator 2 takes a longer path. Class assumes optimal $\rightarrow$ infers weird rewards (e.g., "she loves that detour cell"). Reveal: She was just tired/following a rule.

  4.  **Developing the Payoff Scheme:**

      *   No money. Use "Credibility Points" or "Publication Credits."
      *   Penalize hedging: You must predict the *exact* sequence of cells. If you say "She goes to Goal," that's too vague. If you bet on 3 routes, you dilute points.
      *   Mechanism: Each student gets 10 chips. They place chips on specific route cards. Winner takes the pot? Or fixed payout? Fixed payout is safer for time. 10 points for exact route, 0 otherwise. If you split chips, you get fraction. This encourages commitment.

  5.  **Drafting the Timeline (75 mins):**

      *   0-5: Setup & Rules.
      *   5-20: Round 1 (Standard IRL).
      *   20-35: Round 2 (The Prohibition/Equivalence Twist).
      *   35-50: Round 3 (Transplant Test).
      *   50-60: Round 4 (Sub-optimality).
      *   60-75: Debrief & Naming.
      *   *Critique:* Too many rounds. 75 mins is tight. Need to combine wrinkles.
      *   *Revised:*
          *   0-10: Intro/Rules.
          *   10-25: Round 1 (Basic Inference + Equivalence reveal).
          *   25-40: Round 2 (Prohibition/Constraint ambiguity).
          *   40-55: Round 3 (Transplant Test).
          *   55-65: Round 4 (Sub-optimality).
          *   65-75: Debrief.
      *   *Actually, let's merge Equivalence into Round 1 and Prohibition into Round 2.*

  6.  **Refining the "Potential-Based Shaping" Insight:**

      *   This is the hardest to do without math.
      *   *Idea:* Give two demonstrators different secret instructions that lead to the same path.
      *   *Demo A:* "Maximize Gold." (Gold at end).
      *   *Demo B:* "Maximize Gold + Collect Silver." (Silver is *on* the path to Gold).
      *   *Class Observation:* Same path.
      *   *Class Inference:* "She wants Gold" vs "She wants Gold and Silver."
      *   *Reveal:* Both are consistent. You can't tell if she cares about Silver.
      *   *Transplant:* Move Silver off the path. Demo A goes straight. Demo B detours.
      *   *Wait, I only have one demonstrator per round.*
      *   *Solution:* In Round 1, reveal *after* the betting that two different reward sheets were possible for that *single* path. Show the cards. "Sheet A said +10 Goal. Sheet B said +10 Goal, +5 Cell (3,3)." The path went through (3,3). You couldn't know which sheet she had.

  7.  **Addressing Failure Modes:**

      *   *Secret Leaking:* Demonstrator smiles at the "Silver" cell. *Fix:* Instruct demonstrator to be poker-faced.
      *   *"Just copy the route" reward:* Student proposes $R(s) = 1$ if on demo path, else 0. *Fix:* Acknowledge this is valid (overfitting) but ask "What happens on Map 2?"
      *   *Sloppy Demonstrator:* Takes a non-optimal path by accident. *Fix:* Practice the route beforehand. Mark the grid clearly.
      *   *Cloners winning:* If Map 2 is too similar. *Fix:* Ensure Map 2 makes the old path impossible or wildly inefficient.

  8.  **Structuring the Debrief:**

      *   Map game events to IRL concepts.
      *   Avoidance $\rightarrow$ Constraints vs. Costs.
      *   Same Path/Different Rewards $\rightarrow$ Non-identifiability / Potential Shaping.
      *   Map 2 Failure $\rightarrow$ Overfitting vs. Generalization.
      *   Sub-optimal Demo $\rightarrow$ Assumption of Rationality (Boltzmann rationality).
      *   MaxEnt $\rightarrow$ Tie-breaker for ambiguity.

  9.  **Final Polish:**

      *   Check timing.
      *   Ensure materials are simple (index cards, grids).
      *   Make sure the "No Laptop" constraint is respected (all manual).
      *   Ensure the Philosophy students (normative/epistemic focus) and CS students (algorithmic focus) both get something.

  10. **Self-Correction on "Transplant Test":**
      *   User wants: Half copy actions, half state reward function.
      *   Problem: "Stating a reward function" on an index card is abstract.
      *   Solution: "Reward Team" must predict the *new route* based on their inferred goal. "Clone Team" must predict the *new route* based on mimicking the old moves relative to start.
      *   Scoring: Who predicts the *actual* Demonstrator's new route?
      *   Wait, the Demonstrator *also* has a reward sheet for Map 2.
      *   If Clone Team mimics moves (Up, Up, Right), they hit a wall.
      *   If Reward Team infers "Go to Goal," they predict the new optimal path.
      *   The Demonstrator *actually takes* the new optimal path for her reward.
      *   So Reward Team wins.
      *   *Crucial:* The Demonstrator must be told to act optimally *for her reward* on Map 2.

  11. **Final Review against constraints:**
      *  16 students.
      *  75 mins.
      *  No jargon until end.
      *  Specific wrinkles included.
      *  Payoff scheme defined.

      *Let's write it.*
answer: |-
  This is a sharp design challenge. You are trying to teach *identifiability* and *assumption-dependence* without using the vocabulary that usually scaffolds it. The risk is that the students feel the game is "rigged" rather than realizing the *problem itself* is under-constrained.

  Here is a complete session plan, designed to force the epistemic crisis you want, followed by the failure analysis you requested.

  ### **Materials & Setup**

  *   **Room:** 16 students. Arrange in 4 groups of 4 (mix Phil/CS in each).
  *   **Grids:** Printed 5x5 grids (A4 size).
      *   **Map 1:** Start (bottom-left), Goal (top-right). No obstacles.
      *   **Map 2:** Start (bottom-left), Goal (top-right). **Obstacle** blocking the direct diagonal corridor. A "Lava" cell (previously avoided) is now safe.
  *   **Index Cards:**
      *   **Reward Cards (Secret):** For the Demonstrator.
      *   **Prediction Cards:** For the groups. Pre-printed with a grid to draw a route.
      *   **Betting Chips:** 10 paper tokens per student.
  *   **Whiteboard:** For tracking scores and the "Leaderboard."

  ### **The Payoff Scheme: "Publication Credits"**

  To penalize hedging without money:
  1.  Each student starts with **10 Chips**.
  2.  To submit a prediction, a group must agree on **one exact route** (sequence of cells).
  3.  They must wager at least **5 Chips** on that prediction. (They can wager up to 10).
  4.  **Scoring:**
      *   **Exact Match:** 2x the wagered chips added to their score.
      *   **Wrong Route:** Wagered chips are lost to the "Bank" (you).
      *   **Unwagered Chips:** Worth 0 at the end. (This forces commitment; hoarding is useless).
  5.  **Winning:** The group with the most chips at the end gets "First Author" status on the seminar summary (or a trivial prize like choosing the next topic).

  ---

  ### **Minute-by-Minute Timeline (75 Minutes)**

  #### **00:00 – 05:00 | Setup & Rules**
  *   **Action:** Hand out Map 1. Explain the game.
  *   **Script:** "We are studying behavior. A Demonstrator will walk a route on this grid. They have a secret motivation (a Reward Sheet). Your job is to predict their route on *new* maps. You bet chips on exact routes. Hoarding chips loses. Vague predictions lose."
  *   **Constraint:** Do not use the words *Reward, Policy, Optimal, or IRL*. Use *Motivation, Route, Best Move, Inference*.

  #### **05:00 – 20:00 | Round 1: The Illusion of Certainty (Equivalence)**
  *   **Demonstrator 1:** A CS student (briefed beforehand).
  *   **Secret:** They have **Reward Sheet A** (+10 for Goal, -1 per step).
  *   **Action:** Demonstrator walks the shortest path (e.g., R-R-R-U-U-U).
  *   **Class Task:** Groups discuss and bet chips on what the *Motivation* was. (They will write "Get to Goal fast").
  *   **The Twist:** Before revealing the sheet, tell them: "I actually had two sheets prepared for this route." Show **Reward Sheet B** (+10 for Goal, -1 per step, **+5 for passing through Center Cell**).
  *   **Reveal:** The Demonstrator had Sheet A. But Sheet B would have produced the *exact same path* because the Center Cell was on the shortest path anyway.
  *   **Lesson:** Behavior does not distinguish between "Goal only" and "Goal +沿途 features."
  *   **Score:** No betting on the route (it already happened). Chips are wagered on *Round 2*.

  #### **20:00 – 35:00 | Round 2: The Prohibition Problem (Constraints vs. Costs)**
  *   **Map 1 (Again):** Same grid.
  *   **Demonstrator 2:** A Phil student.
  *   **Secret:** **Constraint Sheet.** "You cannot step on Cell (3,3). It is forbidden." (Not -100 reward, but *illegal*).
  *   **Action:** Demonstrator avoids (3,3), taking a slightly longer path around it.
  *   **Class Inference:** Most will infer "She dislikes (3,3)" (High Cost).
  *   **Betting:** Groups wager chips on her route on **Map 2**.
  *   **Map 2 Reveal:** Cell (3,3) is now the *only* open path to the Goal (others blocked).
  *   **Demonstrator Action:**
      *   If they inferred **Cost** (Dislike): They predict she will go through (3,3) but sadly.
      *   If they inferred **Constraint** (Forbidden): They predict she will stop or fail.
      *   **Actual:** The Demonstrator *stops*. She cannot enter (3,3).
  *   **Outcome:** Groups who bet on a route going through (3,3) lose chips. Groups who predicted "No Route/Stop" win.
  *   **Lesson:** Avoidance looks identical for "High Cost" and "Hard Constraint." You need to know the *rules of the world*, not just the preferences.

  #### **35:00 – 50:00 | Round 3: The Transplant Test (Imitation vs. Inference)**
  *   **Split:** Left side of room = **Imitators**. Right side = **Theorists**.
  *   **Demonstrator 3:** You (the instructor).
  *   **Map 3:** New layout. Start and Goal moved. Obstacles present.
  *   **Secret:** **Reward Sheet C** (+10 Goal, -1 step). You will act optimally for this reward.
  *   **Imitators Rule:** You must predict the route by copying the *sequence of moves* from Round 1 (e.g., "3 Right, 3 Up") relative to the start.
  *   **Theorists Rule:** You must predict the route by inferring the *Goal* and finding the new shortest path.
  *   **Action:** You walk the new shortest path on Map 3.
  *   **Result:**
      *   **Imitators:** Their copied moves likely hit a wall or a suboptimal dead end because the geometry changed. They lose chips.
      *   **Theorists:** They predicted the new optimal path to the Goal. They win chips.
  *   **Lesson:** Copying behavior (Behavioral Cloning) fails when context changes. Inferring intent (IRL) generalizes.

  #### **50:00 – 60:00 | Round 4: The Rationality Trap (Sub-optimality)**
  *   **Demonstrator 4:** A different student.
  *   **Secret:** **Heuristic Sheet.** "Keep your right hand on the wall." (Or: "Satisfice: Take any path under 10 steps").
  *   **Map 4:** Simple grid.
  *   **Action:** Demonstrator takes a winding, sensible-looking, but *non-optimal* path.
  *   **Class Task:** Infer the Reward.
  *   **Likely Outcome:** Students will confabulate complex rewards to explain the winding path (e.g., "She likes the scenery," "She avoids the center").
  *   **Reveal:** She was following a simple rule, not optimizing a complex reward.
  *   **Lesson:** If you assume Optimality and the agent isn't optimal, you infer false rewards.

  #### **60:00 – 75:00 | Debrief & Naming**
  *   **Board Work:** Draw the four failures on the whiteboard.
  *   **Mapping:**
      1.  **Round 1 (Equivalence):** Map to **Non-Identifiability**. Explain *Potential-Based Reward Shaping*. (The +5 for Center Cell was a potential function $\Phi(s)$).
      2.  **Round 2 (Prohibition):** Map to **Constraints vs. Objectives**. The "Feasible Set" vs. the "Objective Function."
      3.  **Round 3 (Transplant):** Map to **Inverse Reinforcement Learning vs. Behavioral Cloning**. Why we want the reward function (portable) not the policy (brittle).
      4.  **Round 4 (Rationality):** Map to **Bounded Rationality / Boltzmann Rationality**. If you assume $\arg\max$ and they are $\epsilon$-greedy, you break the inference.
  *   **MaxEnt:** Ask the MaxEnt fans: "In Round 1, where multiple rewards fit, what did you pick?" (Usually the simplest). Explain Maximum Entropy IRL as a formal tie-breaker for that ambiguity.
  *   **Closing:** "You didn't read minds. You projected assumptions. IRL is the study of which assumptions allow the math to work."

  ---

  ### **Predictable Failure Modes & Mitigation**

  You asked for honesty on what will break. Here is the post-mortem of this seminar before it happens.

  #### **1. The "Overfitting" Reward Proposal**
  *   **What happens:** In Round 1, a CS student suggests the reward function is $R(s) = 1$ if $s$ is on the demonstrated path, else $0$. This technically fits the data perfectly.
  *   **Why it's a problem:** It kills the "Equivalence" lesson. It's a valid solution mathematically but useless for Round 3.
  *   **Fix:** Do not shut it down. Say: "Valid. Bet your chips on that reward for Round 3." When Round 3 happens, that reward function will predict the *exact same path* as Round 1, which will be wrong on the new map. Let the game punish overfitting, not you.

  #### **2. The Demonstrator Leaks the Secret**
  *   **What happens:** Demonstrator 2 (Constraints) hesitates before the forbidden cell, visibly "wanting" to go there but stopping. Or Demonstrator 4 (Heuristic) laughs about their weird path.
  *   **Why it's a problem:** It turns an epistemic problem into a cue-reading problem.
  *   **Fix:** Brief demonstrators rigorously. "Walk at a steady pace. Do not react to cells. If you hit a constraint, stop immediately without emotion." **Better:** You act as the Demonstrator for Rounds 2 and 4. You can control the "poker face" better than a student.

  #### **3. The "Cloners" Win Round 3**
  *   **What happens:** You design Map 3 poorly. The "Copy Moves" strategy accidentally works because the new map is symmetrical or the obstacle doesn't block the copied sequence.
  *   **Why it's a problem:** It validates Behavioral Cloning, which contradicts the learning goal.
  *   **Fix:** **Test Map 3 yourself beforehand.** Ensure the Move Sequence (e.g., R-R-U) hits a wall on Map 3, while the Goal-Seeking strategy finds a clear path. The "Imitator" prediction must be *physically impossible* or *obviously terrible* to score the point home.

  #### **4. The "Potential Shaping" Math is Too Abstract**
  *   **What happens:** In the debrief, you write $R' = R + \gamma \Phi(s') - \Phi(s)$ and the Philosophy students glaze over while the CS students nod smugly.
  *   **Why it's a problem:** It breaks the "mixed room" dynamic.
  *   **Fix:** Keep the explanation conceptual. "In Round 1, Sheet B gave bonus points for cells you were *already going to visit*. It changed the score, but not the walk. That's 'Potential Shaping.' It means infinite reward functions can produce one walk." Only write the formula if a CS student asks for it.

  #### **5. Betting Paralysis**
  *   **What happens:** Groups argue over the route and don't bet in time.
  *   **Why it's a problem:** Kills momentum.
  *   **Fix:** Enforce a hard 3-minute timer for betting. "Chips on the table or they are forfeit." Use a visible phone timer.

  ### **What You Must Say Out Loud (The "Un-gameable" Parts)**

  The game cannot produce the following insights; you must state them in the debrief:

  1.  **The "True" Reward Doesn't Exist:** The game implies there *is* a secret sheet. In reality, there is no "true" reward function, only useful abstractions. You need to explicitly say: "In the real world, there is no sheet in the demonstrator's pocket. There is only the behavior and the model you choose to explain it."
  2.  **Normativity:** The Philosophy students need to hear that IRL is often used to *align* AI. If we infer the wrong reward (Round 4), the AI optimizes a confabulation. This is the "Instrumental Convergence" risk.
  3.  **The Assumption of Optimality:** This is the biggest hidden variable. You must explicitly state: "Every time you lost chips, it was because you assumed the demonstrator was smarter/more constrained/more rational than they actually were."

  ### **Final Checklist for You**
  *   [ ] **Print Maps:** Ensure Map 3 makes the "Copy Move" strategy fail visibly.
  *   [ ] **Brief Demonstrators:** Emphasize poker faces.
  *   [ ] **Test the Betting:** Make sure 10 chips feels like enough pressure.
  *   [ ] **Prepare the "Sheet B" Card:** Ensure the bonus cell is strictly on the optimal path of Sheet A, so the routes are truly identical.

  This design forces them to feel the *fragility* of inference. They will leave feeling that behavior is ambiguous, which is exactly the prerequisite for understanding why IRL requires heavy regularization (like MaxEnt) and careful assumption-setting.
