      *   **Topic:** Samuel Scheffler's "Afterlife Conjecture" (from *Death and the Afterlife*).
      *   **Core Idea:** We value the future not just for our own sake or the sake of future people, but because we want our projects/values to continue after we die. Extinction is bad because it ends this "collective afterlife."
      *   **Goal:** Understand the implications of taking this seriously, specifically regarding:
