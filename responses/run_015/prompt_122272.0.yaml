answer: |-
  In a civil breach of contract trial, juror Alice must assess whether a disputed signature is authentic ($H$) or forged ($\neg H$). Her first-order visual inspection yields a strong impression of authenticity, warranting a credence of 0.7 in $H$, but she possesses reliable higher-order knowledge that her visual method systematically inflates authenticity probabilities by 0.1 in similar contexts. The practical stakes are asymmetric but non-catastrophic: falsely believing $H$ (upholding a forgery) imposes a moderate financial penalty on the defendant, while falsely believing $\neg H$ (rejecting a genuine signature) carries no penalty as the status quo remains. An accuracy-first epistemologist, prioritizing the minimization of expected inaccuracy via the Brier score, directs Alice to subtract the known bias from her first-order impression, mandating a calibrated credence of 0.6 to align with the expected truth-frequency. Conversely, an epistemic-utility theorist, whose value function weights explanatory coherence and the avoidance of self-undermining doubt alongside accuracy, permits Alice to retain the 0.7 credence; they argue that the marginal gain in calibration accuracy is outweighed by the epistemic disutility of fragmenting her belief state through second-guessing, a trade-off deemed acceptable given the non-catastrophic nature of the potential error.

  **Belief, Method, and Nearby Worlds:**
  *   **Belief:** Credence in $H$ (Signature is authentic).
  *   **Method:** First-order visual inspection adjusted (or not) by second-order bias knowledge.
  *   **Nearby Worlds:** In the nearest possible worlds where the signature is forged (False $H$), the defendant suffers a moderate loss; in worlds where it is authentic (False $\neg H$), no loss occurs. The actual world is epistemically ambiguous, lying within the margin of error of Alice's visual method.

  **Theoretical Verdicts:**
  *   **Accuracy-First:** The Brier score $S(c, w) = -(c - o)^2$ is strictly minimized when credence $c$ equals the objective probability $o$. Since Alice knows her method outputs 0.7 when the frequency is 0.6, setting $c=0.6$ minimizes expected inaccuracy. Any deviation to preserve coherence is an accuracy loss.
  *   **Epistemic-Utility:** The utility function is $U(c) = \text{Accuracy}(c) + \text{Coherence}(c) - \text{Doubt}(c)$. While Accuracy(0.6) > Accuracy(0.7), the terms Coherence(0.7) and Doubt(0.7) are significantly more favorable than their 0.6 counterparts. Because the practical penalty is only moderate, the epistemic cost of "self-undermining" is not overridden, making $U(0.7) > U(0.6)$.

  **Structural Feature and Cost Asymmetry:**
  The divergence stems from the interaction between **second-order method-awareness** and an **exclusively accuracy-weighted value function**. The accuracy-first theorist treats higher-order knowledge as a direct input for truth-matching, whereas the pluralist treats it as one factor among many epistemic goods. Eliminating the practical cost asymmetry **merely relocates** the disagreement rather than collapsing it into convergence. Because the accuracy-first norm is insensitive to practical stakes by definition, their recommendation remains 0.6. The epistemic-utility theorist's recommendation relies on *epistemic* values (coherence/doubt), not practical ones; thus, even with zero practical stakes, they may still value stability over marginal calibration, preserving the conflict.

  **Accuracy-First Counter-Argument:**
  An accuracy-first defender could attack the case by distinguishing **calibration from resolution**. They might argue that while the juror knows her *average* output is biased, applying a mechanical correction to a *specific* token case introduces new noise (resolution loss) that degrades the Brier score more than the bias correction improves it. By claiming the higher-order knowledge applies to the *reference class* but not necessarily the *specific instance* without further evidence, they can argue that retaining the 0.7 credence is actually more accurate for this specific world, thereby reclaiming the 0.7 verdict without denying the higher-order knowledge itself.
