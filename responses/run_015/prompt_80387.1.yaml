  3.  **Evaluate "Verbal vs. Substantive":**
      *   *Verbal:* If they just meant different things by the word but could translate perfectly without loss, it's verbal. However, they disagree on *what sentences are meaningful* (e.g., "probability of rain tomorrow"). This suggests it's not merely verbal; it's about the domain of applicability.
      *   *Substantive:* They disagree on what exists (ontologies) and what counts as evidence. A frequentist cannot accept a single-case probability as objectively true in the same way a propensity theorist does. A Bayesian treats probability as epistemic, not ontic.
      *   *Two Questions:* This is the strongest angle. They are answering different questions (What should I believe? vs. What will happen in the long run? vs. What is the physical chance?) but using the same formalism ($P$).
      *   *Impasse:* Is it permanent? Historically, yes, mostly. But progress comes from recognizing the distinct roles (modeling vs. inference vs. ontology).

