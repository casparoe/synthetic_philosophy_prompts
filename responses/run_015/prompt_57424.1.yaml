  6.  **Final Polish:** Ensure the distinction between *Parameter Independence* (no signaling) and *Outcome Independence* (factorization) is clear in CS terms. (Actually, keep it simpler: Marginals vs. Joints given $\lambda$). Make sure to emphasize that in DS, "Shared Seed" implies the logs are pre-determined functions of the seed and input. QM says they aren't.

      *(Self-Correction during drafting)*: Wait, I need to be careful with "Realism". In CS, a replica *always* has a state. In QM, the particle might not have a definite value for *all* possible measurements. This is the "Counterfactual Definiteness" aspect. I should mention that the "function" $f(\lambda, x)$ assumes the output exists for *any* $x$, not just the one chosen.

      Let's refine the "Seed" mapping. A seed implies that for *any* possible operation $x$, the outcome $a$ is determined by $\lambda$. This is the hidden assumption. In a KV store, if I ask for key $K$, the value is there whether I ask or not. In QM, the value might not be there until I ask. This is crucial for Q3.

