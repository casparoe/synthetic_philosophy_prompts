prompt: |-
  Hi — I write novels (workshop-trained, no philosophy classes, so keep the jargon out of it) and I've been poking at the moral realism vs. anti-realism thing on my own, and I keep feeling it circles a problem I have every morning at my desk. I want an actual translation, not a vibe match.

  Heres the vocabulary I'm fluent in, so use it and nothing else: voice; character, as in "she'd never do that"; a scene with gravity that won't go where I push it vs. one that's slack and I can move anywhere; finding out what happens vs. deciding what happens; retconning chapter six so something in chapter two was always the case; canon vs. fanon, meaning what the text supports vs. what readers decide it supports; endings that are earned vs. stapled on; unreliable narrators; truthfulness vs. factuality. Plus one of my own: I call it stickiness — some detail, once written, constrains everything downstream, and I genuinely can't tell whether I put the constraint there or found it.

  So: restate, one at a time and as honestly as you can, (a) the realist claim that there are moral facts independent of anyone's stance that we more or less discover, (b) the anti-realist move where moral sentences just express attitudes and don't describe anything, and (c) the one where they try to describe and nothing is there to be described. Don't smuggle your own assumptions in and call it translation — I'll notice when something stops sounding like anything I'd say.

  Then the part I actually care about: what carried over cleanly, what you had to bend to fit my vocabulary, and what has no counterpart in how I think about a book at all. My hunch is the whole fight bottoms out in whether "she'd never do that" is a discovery or a decree — but tell me if that hunch is just my vocabulary talking.

  Sections, in order, rough lengths: "The translation" (~250 words), "What I had to bend" (~150), "What won't go in at all" (~150), "Whose problem is that" (~200).
