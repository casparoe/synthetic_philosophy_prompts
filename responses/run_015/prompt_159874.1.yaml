answer: |-
  ### The translation

  (a) Realism says moral facts are like character gravity. They won't go where you push them. When you write "she'd never do that," it is finding out what happens, not deciding. The text has a canon independent of the draft; you are retconning chapter six so something in chapter two was always the case. The stickiness is real; you didn't put the constraint there, you found it. Truthfulness matches factuality. The ending is earned because the path was fixed before you wrote it. You are bound by the character's history even if you haven't written it yet.

  (b) The first anti-realist move says moral sentences are just voice. They don't describe canon; they express an attitude, like fanon. It is deciding what happens. The scene is slack; you can move it anywhere because there is no gravity holding it. There is no truthfulness to match, only the factuality of the speaker's stance. The stickiness is just style, a constraint you chose for effect.

  (c) The second anti-realist move says you are trying to describe canon where there is none. It is an unreliable narrator claiming factuality. You want an ending that is earned, but nothing supports it, so it is stapled on. The stickiness is a trick; you thought you found a constraint, but you put it there, and it constrains nothing downstream. You are writing a scene with gravity that isn't there, pretending the character wouldn't do something when there is no character to stop her. It is a lie about the draft, mistaking fanon for canon.

  ### What I had to bend

  I had to bend "canon." In a book, canon comes from an author, even if hidden. Realism claims moral facts exist without an author. I used "retconning" to mimic discovery, but retconning implies a previous draft existed. Realism says the draft was always there, waiting. I also bent "voice." Voice is usually singular to a narrator, but moral claims pretend to speak for everyone. Using "fanon" for attitudes works, but fanon relies on a real text underneath. Anti-realism says there is no text underneath. Finally, "stickiness" is about narrative coherence, not harm or help. I treated constraints as structural, but moral constraints feel like wounds. I made the stakes about craft consistency, not living.

  ### What won't go in at all

  What won't go in is the consequence. In a novel, a stapled ending disappoints a reader. In life, a wrong action hurts a body. My vocabulary handles truthfulness vs. factuality, but it doesn't handle "ought." A scene with gravity moves the plot; a moral fact is supposed to move a hand. You can retcon chapter six without bleeding. Moral realism claims you can't retcon a harm without leaving a scar. The "unreliable narrator" in philosophy isn't just lying to the reader; he is lying to himself about how to live. My terms describe how a story holds together. They don't describe how a life holds together when the story ends and the bill comes due. There is no audience for morality, only participants.

  ### Whose problem is that

  Your hunch is right, but it's only half the fight. "She'd never do that" feels like discovery in the chair. That feeling is the stickiness. But whether that feeling proves the character exists outside your head is the philosophical split. Realism says the gravity proves the planet. Anti-realism says the gravity is just your muscle memory.

  The problem isn't vocabulary; it's authority. If the character owns themselves, you are a secretary (realism). If you own the character, you are a god (anti-realism). But in the draft, the experience is identical. The scene resists either way.

  So whose problem is it? It's yours only if you need to know who owns the gravity. If you just need the scene to hold, the distinction doesn't change the work. But if you need to know if "earned" means "true" or just "consistent," then it matters. The fight is about whether the constraint is in the wood or in your hand. Your hunch identifies the sensation, but not the source. You feel the stickiness. They fight over whether the glue is real. For you, the scene either works or it doesn't. For them, the universe either works or it doesn't. That difference is where the vocabulary stops.
