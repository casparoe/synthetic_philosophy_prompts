      *   *Focus on the Anti-Compatibilist Goal.* The user really wants to keep (3). To keep (3), they need the Knobe effect to say something about *intent*, not just *blame*. If (4) is true (it's just blame), (3) fails. So the fix must involve making the blame aspect *internal* to intentionality.
      *   *Suggestion:* Adopt a "Normative Functionalist" view. Intentionality *is* a tool for blame/praise. Therefore, the signaling *is* the concept. This merges (1) and (4) and saves (3).

