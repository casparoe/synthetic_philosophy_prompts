      *   *Fixing (2) vs (3):* Adopt McClennen's view properly. Sophistication is what a *separable* agent does. Resolution is what a *plan-based* agent does. Rationality requires Resolution *unless* the future self's change is epistemic or rationally transformative. So, (2) needs to be downgraded from "the right response" to "the response of an agent who denies diachronic agency."
