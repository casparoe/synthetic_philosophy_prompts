answer: |-
  This is a sophisticated syllabus-in-waiting. You have correctly identified the central fault lines in diachronic choice theory. Your intuition is right: (5) is currently doing too much work, and the tension between (2) and (3) is not merely apparent—it is foundational. If you teach these claims as written, a sharp undergraduate will catch you in a contradiction by mid-October.

  Here is the breakdown of the tensions, ranked by severity, with specific prescriptions for how to revise your position for the classroom.

  ### 1. The Severe Tension: Sophistication vs. Resolution (Claims 2 & 3)
  **Severity:** Critical
  **The Conflict:** You cannot hold that Sophisticated Choice is "the right response" (2) and that Resolute Choice is "sometimes rational" (3) without specifying the *conditions of agency* that distinguish them. They are mutually exclusive decision rules at the node of choice.

  *   **Sophistication** accepts the principle of **Separability**: the past is bygones, and the future self is a distinct agent whose preferences must be taken as fixed constraints. If Future-You will smoke, Present-You treats that as a fact of nature.
  *   **Resolution** rejects Separability in favor of **Plan-Based Rationality**: the unit of rational assessment is the whole plan, not the node. Present-You overrides Future-You's preferences because they are viewed as *your* preferences, just temporally located.

  **The Problem:** If (3) is true (Resolution is rational), then (2) is false as a general normative claim. Sophistication is what a rational agent does *only if* they accept Separability. But most proponents of Resolution (like McClennen) argue that Separability is the error that *creates* the need for sophistication. If you teach (2) as "the right response," you are validating the very dynamic inconsistency that (3) seeks to cure.

  **The Fix:** Downgrade (2). Do not teach Sophistication as "the right response." Teach it as "the rational response *for an agent who accepts Separability*."
  *   **Revised (2):** "Sophisticated choice is the rational response *if* one accepts the principle of Separability (that future choices are independent of past plans). However, this often leads to dynamically inconsistent outcomes."
  *   **Revised (3):** "Resolute choice is the rational response *if* one rejects Separability and views the temporal extended agent as the locus of rationality."
  *   **Pedagogical Move:** Frame this not as two tools, but as a debate over the **unit of agency**. Are we a sequence of time-slices (Sophistication) or a temporally extended entity (Resolution)?

  ### 2. The Significant Tension: Resolution vs. Rational Change (Claims 3 & 4)
  **Severity:** High
  **The Conflict:** This is the "Tyranny of the Past Self" objection. If preference change can be *rational* (4) (e.g., the transformative experience of parenthood), on what grounds does Resolute Choice (3) authorize the Past Self to bind the Future Self?

  *   In standard addiction/temptation cases (Odysseus), we assume the future preference (to hear the Sirens) is *defective* (akrasia, hyperbolic discounting). Resolution cures a defect.
  *   In transformative cases (Parenthood), the future preference (valuing safety over adventure) is *not defective*. It is a rational update of values.
  *   If you apply Resolution to the Parenthood case, Present-You (who loves adventure) binds Future-You (who values safety). This looks irrational. It violates the normative authority of the future self.

  **The Fix:** Distinguish between **Akratic Drift** and **Transformative Change**.
  *   **Revised (3):** "Resolute choice is rational when future preference changes are due to *akrasia, temptation, or framing effects* (defects in agency). It is impermissible when future preference changes are *rationally transformative*."
  *   **Revised (4):** Keep as is, but emphasize that rational preference change limits the scope of legitimate resolution.
  *   **Pedagogical Move:** Introduce L.A. Paul's work on *Transformative Experience*. Use it to draw the boundary line. You can be resolute against your future addiction, but not against your future conversion (religious or otherwise). This saves Resolution from the charge of diachronic tyranny.

  ### 3. The Manageable Tension: Money Pumps vs. Rational Change (Claims 1 & 4)
  **Severity:** Medium-Low
  **The Conflict:** Money pump arguments typically assume preferences are fixed over the duration of the pump cycle. If preferences can change rationally (4), a student might argue: "I didn't lose money irrationally; I just changed my mind between trade 1 and trade 2."

  **The Fix:** Clarify the **timescale**.
  *   **Revised (1):** "Money pump arguments demonstrate irrationality when preference cycles occur over a *short enough timeframe* that genuine preference change is not a plausible explanation."
  *   **Pedagogical Move:** Specify that Money Pumps target *synchronic* or *near-synchronic* cycles. Rational preference change (4) is a *diachronic* phenomenon over significant intervals. If you cycle $A \to B \to C \to A$ in ten minutes, you aren't "changing your mind" in the sense of (4); you are violating transitivity.

  ### 4. The Synthesis Problem: The "Tools" Claim (Claim 5)
  **Severity:** Medium (Derivative of the above)
  **The Conflict:** As written, (5) suggests eclecticism without a meta-principle. "I use a hammer here and a wrench there" is fine, but only if you know *why* you picked the hammer. Without the fixes above, (5) looks like ad-hocery.

  **The Fix:** Replace "tools" with "domains of legitimacy."
  *   **Revised (5):** "Sophistication and Resolution are not merely tools; they are the output of different models of diachronic agency. A coherent agent uses Resolution for *planning problems involving temptation* (where Separability is rejected) and Sophistication for *problems involving rational transformation or independent future agents* (where Separability is accepted)."

  ### Summary of Revised Position for Teaching

  To make your story straight, you need to move from a list of claims to a **conditional framework**. Here is the coherent narrative arc I recommend for your syllabus:

  1.  **The Baseline (Claim 1):** Cyclic preferences are irrational (Money Pumps). This establishes that *static* consistency matters.
  2.  **The Problem (Claim 2 & 3 Tension):** When preferences change over time, do we treat future selves as allies (Resolution) or strangers (Sophistication)?
      *   *Teaching Point:* Sophistication follows from **Separability**. Resolution follows from **Plan-Based Rationality**.
  3.  **The Constraint (Claim 4):** We cannot always treat future selves as allies. If the future self's change is *rationally transformative* (Parenthood), the Past Self has no authority to bind them.
  4.  **The Synthesis (Claim 5):** Therefore, **Resolution is the default for planning**, *unless* there is evidence of **Rational Transformation**, in which case we defer to **Sophistication**.

  ### The "Cheapest" Fix
  If you want to minimize rewriting your lecture notes, change **Claim (2)**.

  *   **Current:** "Sophisticated choice is the right response to foreseen preference change."
  *   **Revision:** "Sophisticated choice is the *standard game-theoretic* response to foreseen preference change, **but it yields suboptimal plans in cases of temptation.**"

  This single change acknowledges that Sophistication is the "orthodox" view (Dynamic Consistency + Separability) while opening the door for Claim (3) (Resolution) as the *corrective* for temptation, without contradicting Claim (4) (because you can specify that Resolution doesn't apply to transformative change).

  ### Final Expert Advice
  The crack you feel in (5) is real. It stems from the fact that **McClennen's argument for Resolution** (in *Rationality and Dynamic Choice*) relies on the idea that preference change in temptation cases is *not* a rational update, but a failure of agency.

  If you teach (4) too strongly (that *all* preference change is rational), you undermine the justification for (3). You must carve out a specific category of preference change called **"Akratic Shift"** vs. **"Rational Transformation."**

  *   **Akratic Shift:** (Smoking, Dieting, Procrastination). Past Self *can* bind Future Self. Resolution is permitted.
  *   **Rational Transformation:** (Parenthood, Religious Conversion, Trauma). Past Self *cannot* bind Future Self. Sophistication (or simple updating) is required.

  Make that distinction explicit, and your story will hold together. Fail to make it, and you will be money-pumped by your own students.
