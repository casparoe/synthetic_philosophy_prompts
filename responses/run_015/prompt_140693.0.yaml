answer: |-
  Your gut is right to be skeptical. Your brother-in-law has produced a paragraph that sounds very confident but actually mixes **standard examples**, **controversial theoretical commitments**, and **one oversimplified conclusion**.

  This is a classic "MA student" move: they have just learned a specific framework (likely a mix of Grice, Lewis, and Edgington) and are presenting it as the consensus view. In philosophy of language, almost nothing in that paragraph is "settled."

  Here is the audit you asked for, breaking down what is textbook, what is disputed, and what is incorrect.

  ### 1. Sentence-by-Sentence Audit

  **"There are really two different connectives hiding behind the one word 'if'."**
  *   **Verdict:** **Standard Heuristic.**
  *   **Analysis:** Most philosophers agree there is a distinction between indicatives ("If it rains, the match is cancelled") and counterfactuals/subjunctives ("If it had rained, the match would have been cancelled"). However, some "monist" theories try to explain both with one logic. This sentence is a safe starting point.

  **"The indicative conditional is just the material conditional: 'if A then C' means not-A-or-C, so it comes out true whenever A is false."**
  *   **Verdict:** **One-Sided Take Presented as Settled.**
  *   **Analysis:** This is the most contentious sentence. This view (that indicatives are material conditionals) was popular in the mid-20th century (Grice, Jackson), but **most contemporary experts reject it.** The material conditional leads to the "Paradoxes of Material Implication" (e.g., "If the moon is cheese, then 2+2=4" comes out true). Most modern theories (Stalnaker, Suppositional theories) argue indicatives are *not* truth-functional in this simple way. He is presenting a specific, somewhat outdated defense as fact.

  **"That's why 'if Oswald didn't kill Kennedy, someone else did' is perfectly fine as an indicative — we know he did, so it's trivially true — but terrible as a counterfactual."**
  *   **Verdict:** **Standard Example, Controversial Explanation.**
  *   **Analysis:** The example itself (often attributed to Keith DeRose or Dorothy Edgington) is famous and the *intuition* is standard: the indicative sounds okay, the counterfactual sounds weird. However, his *explanation* ("it's trivially true" because the antecedent is false) relies on the controversial Material Conditional view from the previous sentence. If indicatives aren't material conditionals, it's not "trivially true"; it's acceptable for other reasons (e.g., evidential support).

  **"The counterfactual is a different animal: you take the possible worlds closest to ours in which A is true and check whether C holds there..."**
  *   **Verdict:** **Textbook.**
  *   **Analysis:** This is the standard Lewis-Stalnaker semantics for counterfactuals. If you walk into a philosophy of language class, this is what you will be taught about subjunctives. This is the strongest part of his summary.

  **"The same point shows up in the probability work: Adams showed that how confident you should be in a conditional just is the conditional probability of C given A, full stop, and that means conditionals don't have truth conditions at all, only probabilities."**
  *   **Verdict:** **Half Standard, Half Disputed.**
  *   **Analysis:** The first half ("Adams showed...") is **Adams' Thesis**, which is widely accepted as a constraint on any good theory. The second half ("...that means conditionals don't have truth conditions") is a specific philosophical conclusion called **Non-Propositionalism** (or Expressivism). Many philosophers accept Adams' Thesis but try to save truth conditions anyway (by denying the logic of probability works the same way). He is presenting a major metaphysical conclusion as a logical necessity.

  **"So the only real puzzle left is why the two behave differently in these cases, and that's basically pragmatic — a counterfactual signals that the speaker takes the antecedent to be false, and an indicative doesn't."**
  *   **Verdict:** **Oversimplified / Weak.**
  *   **Analysis:** This contradicts his earlier explanation. He just spent half the paragraph giving a *semantic* explanation for counterfactuals (possible worlds). Now he says the difference is *pragmatic*. Furthermore, the claim that counterfactuals signal the antecedent is false is debated (there are "open counterfactuals" where we don't know if the antecedent is false). Saying this is the "only real puzzle left" dismisses huge chunks of current research.

  ### 2. The "Famous Result" You Remembered

  You are absolutely correct, and you are remembering **David Lewis's Triviality Results (1976)**.

  Your brother-in-law is quietly stepping around it, or rather, he is adopting the specific conclusion Lewis forced upon the field.
  *   **The Result:** Lewis proved mathematically that if conditionals have standard truth conditions (they are propositions that can be true or false) **AND** Adams' Thesis holds (Probability of If A then C = Probability of C given A), then probability theory collapses (all probabilities become 0 or 1).
  *   **The Implication:** Since probability theory shouldn't collapse, one of the premises must go.
  *   **His Move:** He chooses to reject truth conditions ("conditionals don't have truth conditions at all").
  *   **The Alternative:** Many philosophers keep truth conditions and instead argue that Adams' Thesis doesn't apply to the *probability of the conditional*, but rather to the *probability of accepting the conditional*.

  So, he isn't wrong to mention it, but he presents the Non-Propositionalist solution as the *only* solution, when it is actually just the most famous one.

  ### 3. Does the Pragmatic Conclusion Follow?

  **No.** It is a non-sequitur.

  He builds a heavy semantic machinery (Material Conditional for indicatives, Possible Worlds for counterfactuals, Triviality Results for probability) and then concludes that the difference is "basically pragmatic."
  *   If the indicative is material and the counterfactual is possible-worlds-based, the difference is **semantic** (meaning), not **pragmatic** (contextual use).
  *   By calling it pragmatic at the end, he is trying to tidy up the mess he created by treating the indicative as a material conditional. It feels like he ran out of space and wanted a neat ending.

  ### Summary for Your Conversation

  If you want to repeat this without sounding like you're spreading dogma, here is the safe version:

  1.  **The Oswald Example:** Safe to repeat. Everyone agrees the indicative sounds better than the counterfactual there.
  2.  **Counterfactuals:** Safe to say they involve "closest possible worlds." That's standard semantics.
  3.  **Indicatives:** **Do not** say they are "just the material conditional." Say instead: *"There's a debate about this. Some say it's the material conditional, but many think that's too simple."*
  4.  **Probability:** You can mention Adams' Thesis (confidence = conditional probability), but add: *"This creates a huge problem for whether conditionals can be true or false at all, which is still being argued."*
  5.  **The Difference:** Don't say it's "basically pragmatic." Say: *"Philosophers disagree on whether the difference is in the literal meaning or just how we use them."*

  **Verdict on your Brother-in-Law:** He knows the literature, but he is synthesizing a specific set of views (likely from a specific professor or textbook) and presenting them as "The Standard Line." In philosophy, there is rarely *The* Standard Line, only *A* Dominant Framework. He is sounding authoritative because he is confident in his syllabus, not because the field has settled.
