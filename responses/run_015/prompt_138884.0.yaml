  Ink spreads within the boundary of the circle,
  Bisected at a point, defining the chord,
  Where the pen falls is deemed random,
  No claim here to a simple third,
  Nor does the area suggest half,
  But the inner disc yields just a quarter.

  No surveyor stakes a claim by quarter,
  Without a centre for the circle,
  Or splits the radius neatly half,
  To fix the position of the chord,
  Or counts the vertices by third,
  Until the method feels truly random.

  Choose a line through centre, not random,
  Care nothing for the inner quarter,
  Or angles marking out a third,
  Measure distance from the circle's heart,
  Draw straight across to make the chord,
  The perpendicular secures a half.

  Discard the distance and the half,
  Let endpoints fall purely random,
  The line between becomes the chord,
  No weight given to the inner quarter,
  Confined to edge of the circle,
  Past the vertex waits a third.

  Each argument claims its third,
  Each spreads its measure out to half,
  Around the centre of the circle,
  Saying this distribution is random,
  While another swears by quarter,
  But nothing changes about the chord.

  Shift the page, the length of chord,
  Remains unaffected in its third,
  Or scale, or inner quarter,
  Some demand invariance yields a half,
  But indifference is not random,
  A choice made prior to the circle.

  We choose the spread before the circle, chord,
  The throwing is what's random, not third,
  All three stand fast: half, and quarter.
