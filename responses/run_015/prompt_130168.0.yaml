answer: |-
  **The Scenario**

  Consider a mid-sized tech firm that promotes Casey to Senior Manager ($P$). The public evidence available to the staff is identical in every respect: (1) The firm has a strict "Promote from Within" policy designed to reduce turnover; (2) Casey's sales numbers were strong, but another internal candidate, Sam, had slightly higher sales; (3) Casey has ten years of tenure at the firm, while Sam has only two; (4) The budget allowed for exactly one promotion. When staff ask, "Why did we promote *someone internally* rather than hiring a more qualified external candidate?" the loveliest explanation is clearly the **Policy Mandate**: the rule constrained the choice set to insiders, making external qualifications irrelevant. But when staff ask, "Why did we promote *Casey* rather than Sam?" the loveliest explanation shifts to **Tenure Preference**: since both were insiders, the policy drops out as a differentiator, and Casey's decade of loyalty explains the selection over Sam's higher sales. These explanations are genuinely incompatible regarding causal primacy: if the Policy Mandate is the true driver, Casey's specific tenure is incidental (any insider would have sufficed); if Tenure Preference is the true driver, the Policy is merely background context (the specific comparison decided the outcome). The evidence does not change, but the "best" explanation flips entirely based on which contrast class is treated as the question.

  ***

  **1. The Components**

  *   **Contrast Question 1:** Why Promote Internal ($P$) vs. Hire External ($Q$)?
  *   **Contrast Question 2:** Why Promote Casey ($P$) vs. Promote Sam ($R$)?
  *   **Candidate Explanation A:** **Policy Mandate.** (The "Promote from Within" rule forced the decision).
  *   **Candidate Explanation B:** **Tenure Preference.** (Casey's specific history outweighed Sam's sales).
  *   **The Evidence (Fixed):**
      1.  Firm has a "Promote from Within" policy.
      2.  Casey's sales were strong; Sam's (internal) were higher.
      3.  Casey has 10 years tenure; Sam has 2 years.
      4.  Budget allowed only one promotion.

  **2. The Walkthrough**

  *   **Case 1 ($P$ rather than $Q$):** Here, the fact to be explained is the *category* of the hire. We need to know why the pool was restricted. Explanation A (Policy) is superior because it directly accounts for the exclusion of external candidates, who might have had better sales than both Casey and Sam. Explanation B (Tenure) is a poor answer here; citing Casey's ten years does not explain why an external candidate with fifteen years of industry experience was rejected. The Policy makes the exclusion of $Q$ intelligible; Tenure does not.
  *   **Case 2 ($P$ rather than $R$):** Here, the fact to be explained is the *individual* selection within the pool. We need to know what distinguished Casey from Sam. Explanation A (Policy) fails because it applies equally to both candidates; since both are insiders, the policy cannot differentiate them. Explanation B (Tenure) succeeds because it identifies the specific variable (10 years vs. 2 years) that breaks the tie. Citing the Policy here is tautological ("Casey was picked because we pick insiders"—but Sam is an insider).
  *   **Incompatibility:** The explanations compete for the status of *the* cause. If A is true, the specific comparison between Casey and Sam is causally inert (the outcome was determined at the class level). If B is true, the class-level constraint is inert (the outcome was determined at the individual level). You cannot claim both were the *primary* driver without diluting the explanatory power of each.

  **3. The Structural Feature**

  The work is being done by the **Contrast Class**. Specifically, the *relevance set* of the evidence shifts. In Question 1, Evidence #1 (Policy) is load-bearing, and Evidence #3 (Tenure difference) is noise. In Question 2, Evidence #3 becomes load-bearing, and Evidence #1 becomes background.
  *   **To collapse the flip:** You would have to remove the contrast entirely and ask a non-contrastive question: "Why was Casey promoted?" Without a *rather-than* clause, IBE lacks a criterion to select which piece of evidence is the "difference maker." If you force a single question, such as "What is the full causal history?", both explanations become compatible parts of a larger narrative, and the flip disappears. The instability relies entirely on the assumption that explanation is inherently contrastive.

  **4. The Bayesian Verdict**

  A Bayesian conditioning on the total evidence $E$ calculates $P(H|E)$. They do not ask "Why $P$ rather than $Q$?"; they ask "How probable is Hypothesis A vs. Hypothesis B?"
  *   Given that Sam (an insider) was *eligible* but rejected, the **Tenure Preference (B)** hypothesis is likely more probable overall. The Policy Mandate (A) predicts that *any* insider might be chosen; it does not predict Casey specifically over Sam. The Tenure hypothesis predicts Casey specifically.
  *   Therefore, the Bayesian verdict aligns with **IBE on Question 2**.
  *   **Indictment:** This is an indictment of IBE if IBE claims to track truth (probability). IBE on Question 1 leads us to endorse the Policy Mandate as the "best" explanation, even though the Bayesian calculation suggests the Tenure hypothesis is more likely given the specific outcome (Casey, not just "an insider"). IBE sacrifices global probability for local relevance to the contrast.

  **5. The Objection and Reply**

  *   **The IBE Defender's Reply:** "There is no instability here because explanation is *essentially* contrastive. You aren't asking the same question twice. 'Why $P$ rather than $Q$' and 'Why $P$ rather than $R$' are distinct queries with distinct truth conditions. IBE is a rule for answering questions, not for assigning unconditional probabilities. It is perfectly rational to give different answers to different questions given the same evidence, just as it is rational to say 'The switch caused the light to turn on' (rather than off) but 'The bulb caused the light to turn on' (rather than the fan). The rule works fine; you're just demanding it do a job (unconditional belief) it was never designed to do."
  *   **The Counter-Reply:** "If IBE is merely a rule for answering contrastive questions, it ceases to be a rule for **belief**. I have to believe the explanation I infer. But if the 'best' explanation flips depending on which contrast I happen to be thinking about, then what I am justified in *believing* becomes unstable. Do I believe the Policy was the cause, or that Tenure was the cause? If I believe both, I haven't inferred an explanation; I've listed factors. If I believe only the one selected by the contrast, my ontology of causes changes based on my conversational context. This reduces IBE from a guide to what is *true* to a guide to what is *useful to say*, stripping it of its epistemic normativity."
