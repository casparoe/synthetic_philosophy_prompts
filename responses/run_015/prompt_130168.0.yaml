      *   If B is true: Merit/Tenure dictated the outcome (Casey > Sam). The Policy is just a gatekeeper.
      *   This works for IBE because "Best Explanation" implies identifying the *difference maker*.
      *   In Q1 (Internal vs External), Policy is the difference maker.
      *   In Q2 (Casey vs Sam), Tenure is the difference maker.
      *   If you adopt A as the global explanation, you ignore the Casey/Sam dynamic. If you adopt B, you ignore the Internal/External dynamic.
