prompt: |-
  i'm drafting a bit of a paper section on whether inference to the best explanation even gets off the ground before its question is fixed, and i need a case built to spec to make the point land rather than just assert it. here's what i want:

  an ordinary, realistic situation — a hiring panel, grad admissions, a grant committee, a restaurant picking a supplier, whatever, nothing science-fictional and no skeptical machinery — in which the very same evidence supports two different explanations depending on which contrast you ask about. so: ask why P rather than Q and explanation A is clearly the loveliest thing on offer; ask why P rather than R (or just why P, full stop) and explanation B is clearly the loveliest. and A and B have to be genuinely incompatible, not two compatible factors that one narrative could happily cite both of — if A is why-Dana-rather-than-nobody, then B can't also be why-Dana-rather-than-Mo, and vice versa.

  constraints, in no particular order:

  - one paragraph of scenario. realistic: the kind of thing someone could tell you over coffee. no committee of gods, no lotteries, no predictors.
  - both contrast questions have to be ones a real person in that situation would actually ask out loud. none of that why-did-the-puddle-form-here-rather-than-in-the-Andes business.
  - identical evidence across both questions. you don't get to quietly add a fact when you switch contrasts.
  - nothing ad hoc and no bad lot: each winner has to be a decent explanation on its own terms, not just the least bad item on a sad menu. so you can't get the flip by making A obviously false or by leaving the true hypothesis out of the set.
  - the incompatibility shouldn't come from stipulation. it should fall out of the setup — the two stories disagree about something like how high the bar was, or whether the mechanism was local or global — with genuinely mixed evidence, some pointing one way and some the other, such that each contrast question makes a different half of the evidence load-bearing.
  - readable by someone with no background in the literature, so set up whatever needs setting up inside the paragraph.

  then, after the paragraph:

  1. name the two contrast questions, the two candidate explanations, and the evidence, with the evidence separated out from the story so i can see it's the same list both times.
  2. walk through each question: say what has to be explained in each case (that P happened at all, versus that P happened rather than this specific nearby alternative), and why the explanation that wins one is a poor answer to the other. rough likelihood talk is fine; invented numbers that look fake are not.
  3. tell me which structural feature of the case is doing the work. i want to be able to delete it and watch the flip disappear, so say explicitly what i'd have to change to collapse the two questions back into one.
  4. a Bayesian who just conditions on the evidence gets one verdict, not two. say which of your two IBE verdicts that lines up with, and whether that's supposed to be a rescue of IBE or an indictment of it.
  5. finally, the objection i'll have to answer: a defender of IBE will say there's no problem here at all, since explanation always answers a question with a contrast built into it, and you're simply asking two different questions. give me the strongest version of that reply you can manage, then the best thing my side can say back — ideally something that shows the reply costs IBE its role as a rule about what to believe.

  i'd rather have a case thats slightly messy and real than a clean one that cheats by stipulating the answers. if some part of this spec turns out to be unsatisfiable together with the rest, tell me which bit and why instead of quietly dropping it and hoping i won't notice.
reasoning: |-
  Here's a thinking process that leads to the suggested case study:

  1.  **Analyze the Request:**
      *   **Goal:** Draft a paper section arguing that Inference to the Best Explanation (IBE) is unstable before the *question* (specifically the contrast class) is fixed.
      *   **Core Mechanism:** The *same evidence* supports Explanation A under Contrast Question 1 ($P$ rather than $Q$) and Explanation B under Contrast Question 2 ($P$ rather than $R$).
      *   **Constraints:**
          *   Ordinary, realistic scenario (hiring, admissions, etc.).
          *   No sci-fi, no skeptical machinery.
          *   One paragraph scenario.
          *   Contrast questions must be natural/realistic.
          *   Identical evidence for both.
          *   No "bad lot" (both explanations must be good on their own).
          *   Incompatibility must arise from the setup (e.g., mechanism, threshold), not stipulation.
          *   Accessible to non-specialists.
          *   Follow-up analysis (5 specific points).
      *   **Tone:** Philosophical but grounded, slightly informal but rigorous.

  2.  **Brainstorming Scenarios:**
      *   *Idea 1: Medical Diagnosis.* Patient has symptom $P$. Is it Disease A or Disease B?
          *   *Problem:* Usually, the evidence changes or the diseases are mutually exclusive in a way that doesn't depend on the contrast. If $P$ is "fever," $Q$ is "no fever," $R$ is "different fever." Hard to make the *explanation* flip based on contrast without changing evidence.
      *   *Idea 2: Car Trouble.* Car won't start ($P$).
          *   *Contrast 1:* Why won't it start ($P$) vs. why did it start yesterday ($Q$)? -> Battery dead.
          *   *Contrast 2:* Why won't it start ($P$) vs. why does the radio work ($R$)? -> Starter motor.
          *   *Problem:* The evidence isn't identical. Knowing the radio works is new evidence. The prompt requires *identical evidence*.
      *   *Idea 3: Hiring/Admissions.* Candidate Dana gets the job ($P$).
          *   *Contrast 1:* Why Dana ($P$) vs. No One ($Q$)? (Why was the position filled?) -> Budget was approved.
          *   *Contrast 2:* Why Dana ($P$) vs. Mo ($R$)? (Why Dana over Mo?) -> Dana had better publications.
          *   *Problem:* Are these incompatible? "Budget approved" and "Better publications" are compatible. The prompt requires *genuinely incompatible* explanations (A and B cannot both be the primary driver).
      *   *Idea 4: Restaurant Supplier.* Restaurant chooses Supplier X ($P$).
          *   *Contrast 1:* Why X ($P$) vs. No Supplier ($Q$)? -> Urgent need.
          *   *Contrast 2:* Why X ($P$) vs. Supplier Y ($R$)? -> Price.
          *   *Problem:* Again, compatible.
      *   *Idea 5: The "Threshold vs. Ranking" Tension.* This seems promising.
          *   Scenario: A grant committee funds Project Dana ($P$).
          *   Evidence: Dana's score was 85/100. The cutoff line was drawn at 80. Mo's score was 79. The budget allowed for exactly one more grant.
          *   *Contrast 1:* Why Fund Dana ($P$) vs. Fund No One ($Q$)?
              *   Explanation A: The committee had surplus budget and needed to spend it (Institutional Pressure).
              *   Wait, if the score was 85 and cutoff 80, the merit explains it.
          *   Let's refine the incompatibility.
          *   *Scenario:* A university admits a student, Alex ($P$).
          *   *Evidence:* Alex's SATs are 1350. GPA 3.8. The university's average admit is 1400/3.9. However, Alex is from a underrepresented region. The admissions rate this year was 5% (same as last year).
          *   *Contrast 1:* Why Alex ($P$) vs. Rejection ($Q$)? (Why was an exception made?)
              *   Explanation A: Diversity Initiative (The specific trait mattered).
          *   *Contrast 2:* Why Alex ($P$) vs. Typical Admit ($R$)? (Why does Alex look like a typical admit despite lower stats?)
              *   Explanation B: Grade Inflation at Alex's school (The stats are misleadingly high).
          *   *Problem:* These aren't incompatible. Both could be true.

      *   *Idea 6: The "Safety vs. Selection" Case (Hiring).*
          *   Scenario: A tech firm hires Casey ($P$).
          *   Evidence: Casey passed the coding test (85%). The team was understaffed. Another candidate, Jordan, scored 88% but asked for higher salary. The hiring manager, Sarah, has a reputation for being risk-averse.
          *   *Contrast 1:* Why Hire Casey ($P$) vs. Hire No One ($Q$)? (Why fill the role now?)
              *   Explanation A: Urgent Staffing Need (The bar was lowered to fill the seat).
          *   *Contrast 2:* Why Hire Casey ($P$) vs. Hire Jordan ($R$)? (Why Casey over the higher scorer?)
              *   Explanation B: Risk Aversion/Salary (Jordan was too expensive/risky).
          *   *Incompatibility:* If A is true (Bar lowered), then Jordan's higher score shouldn't matter. If B is true (Selection based on risk/cost), then the bar wasn't necessarily lowered, just weighted differently.
          *   *Critique:* Still feels a bit compatible. "We needed someone (A) AND Casey was cheaper (B)."

      *   *Idea 7: The "Threshold vs. Relative Merit" Case (Grant Committee).*
          *   Let's try to make the explanations compete for the *causal mechanism*.
          *   Scenario: The National Science Board funds Project Alpha ($P$).
          *   Evidence: Alpha's proposal was rated "Excellent" (top 10%). Budget allowed for 5 grants. 4 other projects were rated "Excellent". One "Excellent" project (Beta) was rejected. The Chair has a known interest in Alpha's specific methodology.
          *   *Contrast 1:* Why Fund Alpha ($P$) vs. Fund Nothing ($Q$)? (Why was there funding at all?)
              *   Explanation A: Strategic Priority (The Board wanted to fund *this type* of research regardless of competition).
          *   *Contrast 2:* Why Fund Alpha ($P$) vs. Fund Beta ($R$)? (Why Alpha over the equivalent?)
              *   Explanation B: Chair's Bias (The specific preference tipped the scale between equals).
          *   *Incompatibility:* If A is true (Strategic Priority), then Alpha was *never* in real competition with Beta; the slot was reserved. If B is true (Chair's Bias), then it was a genuine competition where bias tipped the scale.
          *   *Refinement:* This is getting closer. The incompatibility is about whether the outcome was determined by *category* (A) or *individual comparison* (B).

      *   *Idea 8: The "Restaurant Health Inspection" (Simpler).*
          *   Scenario: "Burger Barn" gets an A-Grade ($P$).
          *   Evidence: Inspection score was 92/100. Passing is 90. Last year they scored 88 (failed). The inspector, Jones, is known to be strict on cleanliness but lenient on paperwork. Burger Barn had minor cleanliness issues but perfect paperwork.
          *   *Contrast 1:* Why A-Grade ($P$) vs. Failing Grade ($Q$)? (Why did they pass?)
              *   Explanation A: Paperwork Loophole (The scoring system weights paperwork heavily this year).
          *   *Contrast 2:* Why A-Grade ($P$) vs. B-Grade ($R$)? (Why high pass vs low pass?)
              *   Explanation B: Inspector Leniency (Jones ignored the cleanliness faults).
          *   *Incompatibility:* If A is true (Systemic weighting), Jones's personal leniency doesn't matter. If B is true (Personal leniency), the systemic weighting isn't the driver.
          *   *Critique:* A bit technical.

      *   *Idea 9: The "Promotion" Case (Refining Idea 7).*
          *   Let's go with a University Department hiring a Professor. It's relatable.
          *   *Scenario:* The Philosophy Department hires Dana ($P$).
          *   *Evidence:* Dana has 3 publications. The standard is usually 5. The department had a "cluster hire" mandate from the Dean to fill 3 spots quickly. Another candidate, Mo, had 6 publications but specializes in a different subfield. The Department Chair pushed hard for Dana.
          *   *Contrast 1:* Why Hire Dana ($P$) vs. Leave Position Empty ($Q$)?
              *   Explanation A: Administrative Mandate (They *had* to spend the budget/fill the lines).
          *   *Contrast 2:* Why Hire Dana ($P$) vs. Hire Mo ($R$)?
              *   Explanation B: Subfield Preference/Chair's Push (They wanted Dana's specific area, not just any philosopher).
          *   *Incompatibility:*
              *   If A is the main explanation: The specific candidate didn't matter, just filling the slot. (Dana was a means to an end).
              *   If B is the main explanation: The specific candidate mattered immensely. (Dana was the end).
              *   These compete. If the mandate forced *any* hire, Mo would have done. If the Chair's push was decisive, the mandate wasn't the sole driver.
          *   *Wait, are they incompatible?* You can have a mandate AND a preference. "We had to hire someone, and we picked Dana."
          *   *Need stronger incompatibility.* The explanations need to disagree on the *nature* of the causal process.
          *   *Revised Incompatibility:*
              *   Exp A (Mandate): The bar was lowered globally. Dana is actually underqualified compared to normal standards.
              *   Exp B (Preference): The bar was normal, but Dana has a specific "spike" Mo lacks.
              *   Evidence: Dana has 3 pubs (low). Mo has 6 pubs (high). Mandate exists.
              *   If A is true: 3 pubs was enough because the bar dropped.
              *   If B is true: 3 pubs was enough because Dana's specific 3 were better/more relevant than Mo's 6.
              *   This hinges on the quality of the pubs, which isn't in the evidence.

      *   *Idea 10: The "Security Alarm" Case.*
          *   Scenario: The warehouse alarm triggered ($P$).
          *   Evidence: Motion sensor tripped. Door sensor did not. It was 3 AM. A known stray cat frequents the alley. The system was updated last week to be more sensitive.
          *   *Contrast 1:* Why Trigger ($P$) vs. No Trigger ($Q$)? (Why did it go off?)
              *   Explanation A: System Sensitivity (The update made it twitchy).
          *   *Contrast 2:* Why Trigger ($P$) vs. Break-in ($R$)? (Why this noise and not a burglar?)
              *   Explanation B: Cat (Environmental factor).
          *   *Incompatibility:* If A is true, the system is faulty regardless of the cat. If B is true, the system worked correctly but detected a cat.
          *   *Problem:* These are compatible. The system was sensitive AND a cat was there.

      *   *Idea 11: The "Loan Approval" Case (Strongest Candidate).*
          *   Scenario: A bank approves a mortgage for Alex ($P$).
          *   Evidence: Alex's credit score is 680 (borderline). Debt-to-income is 45% (high). The bank has a quarterly target to increase loan volume by 10%. Another applicant, Blake, had a 700 score but was rejected for "insufficient history." The loan officer, Sarah, meets her quota if Alex is approved.
          *   *Contrast 1:* Why Approve Alex ($P$) vs. Reject Alex ($Q$)? (Why was the exception made?)
              *   Explanation A: Quota Pressure (The bank needed volume, so standards were relaxed).
          *   *Contrast 2:* Why Approve Alex ($P$) vs. Approve Blake ($R$)? (Why Alex over the better credit score?)
              *   Explanation B: Officer Discretion/Bias (Sarah preferred Alex's file for non-credit reasons, e.g., existing relationship).
          *   *Incompatibility:*
              *   Explanation A implies a *global* relaxation of standards (Alex passed because the bar moved).
              *   Explanation B implies a *local* deviation (Alex passed because of specific favoritism, bar stayed same).
              *   If A is true, Blake should have also passed (since the bar moved for everyone). But Blake was rejected.
              *   If B is true, the bar didn't move; Alex just got special treatment.
              *   *Wait, the evidence says Blake was rejected.*
              *   If A (Quota/Relaxed Standards) is true: Why was Blake rejected? Maybe Blake didn't apply yet? Or "insufficient history" is a hard rule.
              *   This is getting messy. I need the evidence to support *both* equally well until the contrast is asked.

      *   *Idea 12: The "Software Bug" Case.*
          *   Scenario: The login page crashed ($P$).
          *   Evidence: Traffic spike occurred at 9 AM. Code deployment happened at 8 AM. Server CPU hit 95%. No error logs from the database.
          *   *Contrast 1:* Why Crash ($P$) vs. No Crash ($Q$)? (Why did it fail today?)
              *   Explanation A: Traffic Spike (Infrastructure couldn't handle load).
          *   *Contrast 2:* Why Crash ($P$) vs. Slowdown ($R$)? (Why total failure and not just lag?)
              *   Explanation B: Bad Code Deployment (The new code has a memory leak).
          *   *Incompatibility:*
              *   If A (Traffic) is true: The code was fine, just overloaded.
              *   If B (Code) is true: The traffic was fine, the code was broken.
              *   Evidence supports both: Traffic *did* spike. Code *was* deployed. CPU *was* high (could be either).
              *   If I ask "Why crash vs stay up?", Traffic is the best answer (usually handles load, but this was too much).
              *   If I ask "Why crash vs slow?", Code is the best answer (traffic causes slow, bad code causes crash).
              *   *Are they incompatible?* Yes. Either the system was robust but overwhelmed (A), or the system was fragile and broke easily (B). They tell different stories about the system's health.
              *   *Realism:* Very realistic. DevOps argue this all the time.
              *   *Evidence:* Identical.
              *   *Contrasts:* Natural. "Why did it go down?" vs "Why did it hard crash instead of just lag?"

      *   *Refining Idea 12 for the Prompt:*
          *   Need to ensure the "Incompatibility" constraint is met.
          *   If A is true (Traffic), the deployment was innocent.
          *   If B is true (Deployment), the traffic was innocent (normal load for a healthy system).
          *   The evidence (High CPU, Spike, Deployment) is ambiguous.
          *   Contrast 1 ($P$ vs $\neg P$): Why did it fail *now*? The Traffic Spike is the differentiating factor from yesterday. (Deployment happened, but yesterday's deployment didn't crash). Wait, if deployment was today, yesterday is not a good control.
          *   Let's adjust evidence: Deployment happened. Traffic is normal for a Monday.
          *   Actually, let's go back to the **Hiring/Admissions** one but tighten the incompatibility. It's more human-readable than server logs.

      *   *Idea 13: The "Grant Renewal" Case (Final Choice).*
          *   Scenario: The City Council renews the Arts Grant for the Symphony ($P$).
          *   Evidence: Attendance dropped 10% this year. The budget surplus is $50k. The Council Chair publicly praised the Symphony last month. A competing bid from the Theater Group showed higher attendance growth. The Grant guidelines say "Community Impact" is the primary metric.
          *   *Contrast 1:* Why Renew ($P$) vs. Cut Funding ($Q$)? (Why fund them despite drop?)
              *   Explanation A: Political Protection (The Chair's praise signals a shield; metrics were ignored).
          *   *Contrast 2:* Why Renew Symphony ($P$) vs. Fund Theater ($R$)? (Why Symphony over the growing Theater?)
              *   Explanation B: Metric Interpretation (The Council values "Prestige" over "Attendance," so Symphony still wins on "Impact").
          *   *Incompatibility:*
              *   Exp A says: Rules/Metrics were bypassed due to influence.
              *   Exp B says: Rules/Metrics were followed, just interpreted differently (Prestige > Attendance).
              *   If A is true, the "Impact" metric is a sham. If B is true, the "Impact" metric is real but complex.
              *   Evidence supports both: Chair praised (A), Guidelines vague enough for B.
              *   This feels solid.

      *   *Wait, let's try one more: The "Medical Test" Case.*
          *   Scenario: Patient tests Positive for Condition Z ($P$).
          *   Evidence: Test sensitivity 90%. Patient has Symptom X. Patient recently traveled to Region Y. Condition Z is rare (1%). Symptom X is common in Region Y due to Condition W (benign).
          *   *Contrast 1:* Why Positive ($P$) vs. Negative ($Q$)? (Why did the test light up?)
              *   Explanation A: True Positive (Patient has Z).
          *   *Contrast 2:* Why Positive ($P$) vs. False Alarm ($R$)? (Wait, that's not a contrast class).
              *   Why Positive ($P$) given Travel ($T$)?
          *   This is getting into Bayesian base rates, which might clutter the IBE point.

      *   *Decision:* The **Software Bug** case (Idea 12) is the cleanest for "Incompatibility."
          *   Story: E-commerce site checkout fails ($P$).
          *   Evidence: 1. New code deployed 1 hour prior. 2. Traffic volume is 2x normal (Holiday sale). 3. Server logs show "Memory Overflow." 4. Previous deployments on normal days were fine. 5. Previous holidays with old code were fine.
          *   Explanation A (Code): The new code has a memory leak. (Explains why *this* deployment failed when holidays didn't).
          *   Explanation B (Capacity): The infrastructure couldn't handle the load. (Explains why *this* traffic failed when normal days didn't).
          *   Incompatibility: If A is true, infrastructure is fine (it's the code). If B is true, code is fine (it's the infrastructure). You can't blame both for the *primary* cause if you want to know where to fix the budget (hire devs vs buy servers).
          *   Contrast 1: Why Fail ($P$) vs. Succeed ($Q$)? (Why did the checkout break?)
              *   Focus: What changed from the last successful state?
              *   Winner: Code. (Traffic was high last holiday, but didn't break. So Traffic isn't the differentiator between Success and Fail. Code is).
              *   *Wait, Evidence 5 says "Previous holidays with old code were fine."*
              *   So if I ask "Why Fail vs Succeed", the Code is the difference maker.
          *   Contrast 2: Why Fail ($P$) vs. Slow ($R$)? (Why total crash vs just lag?)
              *   Focus: What determines the *severity*?
              *   Winner: Capacity. (Bad code usually causes errors, but high traffic causes overflow/crash).
              *   *Actually, this is tricky.*
              *   Let's flip it.
              *   Contrast 1: Why Fail ($P$) vs. Succeed ($Q$)? (Why today vs yesterday?)
                  *   Difference: Traffic AND Code. Both changed.
                  *   If I assume Code is stable (it's usually stable), Traffic explains it.
                  *   If I assume Traffic is stable (it's a holiday, expected), Code explains it.
              *   This relies on defaults.

      *   *Let's go with the **Hiring** case (Idea 9/11 hybrid) but sharpened.*
          *   It's more intuitive for "Explanation" than server logs.
          *   **Scenario:** A university department hires Dana ($P$).
          *   **Evidence:**
              1.  Dana's publication count is below the department's 5-year average.
              2.  The Dean issued a mandate to fill the line this semester or lose the budget.
              3.  The other finalist, Mo, had higher publications but required a spousal hire package the university couldn't afford.
              4.  The Department Chair advocated strongly for Dana's specific research niche.
          *   **Contrast 1:** Why Hire Dana ($P$) vs. Leave Position Empty ($Q$)?
              *   Question: Why was a hire made *at all* (despite low stats)?
              *   Best Explanation: **Budget Mandate.** (The pressure to spend forced the bar down).
              *   Why not Chair's Push? Push doesn't force a hire if the budget isn't there.
              *   Why not Mo's Cost? That explains Dana *over* Mo, not Dana *over* No-One.
          *   **Contrast 2:** Why Hire Dana ($P$) vs. Hire Mo ($R$)?
              *   Question: Why Dana *specifically* (given Mo was qualified)?
              *   Best Explanation: **Spousal Package Constraint.** (Mo was too expensive).
              *   *Wait, is this incompatible with Mandate?*
              *   If Mandate is the story: We needed a body. Dana was a body.
              *   If Cost is the story: We wanted Mo, but couldn't afford Mo.
              *   Incompatibility: Did we settle for Dana (Mandate), or did we choose Dana because Mo was impossible (Cost)?
              *   Actually, let's make the incompatibility about **Merit vs. Necessity**.
              *   Exp A (Mandate): Dana was hired because we *had* to hire someone (Necessity).
              *   Exp B (Niche): Dana was hired because she was *better* for our specific needs (Merit).
              *   Evidence: Low pubs ( hurts Merit). Mandate (Helps Necessity). Chair Push (Helps Merit). Mo's Cost (Helps Necessity/Constraint).
              *   If I ask "Why Hire vs Not Hire": Mandate is the heavy lifter. (Without mandate, low pubs = rejection).
              *   If I ask "Why Dana vs Mo": Mo's Cost is the heavy lifter. (Without cost issue, Mo's pubs win).
              *   Are Mandate and Cost incompatible? No.
              *   I need the explanations to be **A: The bar was lowered** vs **B: The bar was normal, but Dana has a spike**.
              *   Evidence: Dana's pubs are low. Chair says Dana is "innovative."
              *   If A (Bar Lowered): Innovation is a excuse for low output.
              *   If B (Bar Normal): Innovation counts more than output.
              *   Contrast 1: Why Hire ($P$) vs Reject ($Q$)? -> Bar Lowered (Mandate).
              *   Contrast 2: Why Hire Dana ($P$) vs Hire Typical Candidate ($R$)? -> Bar Normal (Innovation).
              *   This works. The *status of the bar* is the incompatible fact.

      *   *Drafting the Scenario:*
          *   Keep it tight. One paragraph.
          *   Focus: A restaurant choosing a fish supplier.
          *   Scenario: "The Blue Crab" restaurant switches to Supplier X ($P$).
          *   Evidence: 1. Supplier X is 10% more expensive than the incumbent. 2. Supplier X delivered a free sample that the Head Chef praised. 3. The Owner is under pressure to cut costs this quarter. 4. The incumbent had two late deliveries last month.
          *   Contrast 1: Why Switch ($P$) vs. Stay ($Q$)?
              *   Explanation A: Reliability (The late deliveries broke trust).
              *   (Cost pressure makes this weird. Why switch to expensive?)
          *   Let's stick to the **Hiring** one. It's the most robust for "Explanation."

      *   *Final Polish of Hiring Case:*
          *   **Scenario:** A philosophy department hires Dana ($P$).
          *   **Evidence:** (1) Dana's publication record is weaker than the department's 5-year average. (2) The university mandated the position be filled immediately or the line is lost. (3) The other finalist, Mo, had a stronger record but requested a start date the department couldn't accommodate. (4) The search chair described Dana as "intellectually vital."
          *   **Explanation A (Institutional Pressure):** They hired Dana to save the line (lowered standards).
          *   **Explanation B (Fit/Logistics):** They hired Dana because Mo was logistically impossible (standards maintained, Mo was an outlier).
          *   **Incompatibility:** Did they lower the bar (A) or was the bar met despite appearances (B)?
          *   **Contrast 1:** Why Hire ($P$) vs. Not Hire ($Q$)? -> A wins. (Without mandate, weak record = no hire).
          *   **Contrast 2:** Why Dana ($P$) vs. Mo ($R$)? -> B wins. (Mo's record was better, so record isn't the differentiator; start date is).
          *   **Wait:** If B is true (Mo was impossible), then A (Mandate) is less relevant. If A is true (Mandate forced a hire), then Mo's start date matters less (they would have waited or negotiated).
          *   **Actually, the incompatibility is:**
              *   A: The decision was driven by **Budget/Timeline** (External constraints).
              *   B: The decision was driven by **Candidate Quality** (Internal assessment).
              *   Evidence supports both: Mandate exists (A), Chair praise exists (B).
              *   Contrast 1 ($P$ vs $\neg P$): Why hire *anyone* with weak stats? -> A (Mandate).
              *   Contrast 2 (Dana vs. Mo): Why Dana over *better* stats? -> B (Chair praise/Fit).
              *   *Wait, if Mo had better stats, B (Quality) doesn't explain Dana over Mo.*
              *   Okay, Correction:
              *   Contrast 2: Why Dana ($P$) vs. Mo ($R$)?
              *   Explanation B': **Logistical Fit** (Mo's start date).
              *   So: A = Institutional Pressure (Save the line). B = Logistical Constraint (Mo unavailable).
              *   Are these incompatible? They are both "Constraints." I need one to be "Merit" and one to be "Constraint."
              *   Let's try:
              *   Exp A: **Desperation.** (We took Dana because we had to).
              *   Exp B: **Preference.** (We wanted Dana specifically).
              *   Evidence: Weak record (Supports Desperation). Chair Praise (Supports Preference). Mandate (Supports Desperation). Mo's Start Date (Supports Desperation/Constraint).
              *   This is hard to make *incompatible*.

      *   *Pivot to the **Medical/Health** Case (Idea 1 refined).*
          *   It's easier to make mechanisms incompatible.
          *   **Scenario:** A patient, Alex, recovers from a severe bacterial infection ($P$).
          *   **Evidence:** 1. Alex took the prescribed antibiotic. 2. Alex also started a strict new diet and supplement regimen the same day. 3. The infection strain is known to be resistant to the antibiotic in 30% of cases. 4. Alex's immune system markers were unusually high prior to treatment.
          *   **Contrast 1:** Why Recover ($P$) vs. Die/Suffer ($Q$)? (Why did the treatment work?)
              *   Explanation A: **Medical Intervention.** (The antibiotic worked).
              *   (Evidence 3 makes this shaky, but Evidence 1 is strong).
          *   **Contrast 2:** Why Recover ($P$) vs. Recover Later/Slower ($R$)?
              *   Explanation B: **Immune Boost.** (The diet/immune markers accelerated it).
          *   **Incompatibility:**
              *   If A is the *best* explanation: The antibiotic did the heavy lifting. The diet is incidental.
              *   If B is the *best* explanation: The immune system did the heavy lifting. The antibiotic was placebo/unnecessary.
              *   They compete for causal credit.
          *   **Contrast 1 ($P$ vs $\neg P$):** What prevented the bad outcome? -> Antibiotic (Standard of care).
          *   **Contrast 2 (Fast Recovery vs Slow Recovery):** What caused the *speed*? -> Immune/Diet.
          *   **Problem:** These aren't mutually exclusive. You can credit both.
          *   **Requirement:** "A and B have to be genuinely incompatible... if A is why-Dana-rather-than-nobody, then B can't also be why-Dana-rather-than-Mo."
          *   Okay, I need the *truth* of the explanation to depend on the contrast.
          *   Let's go with the **Car Accident** case.
          *   **Scenario:** Alex crashes their car into a tree ($P$).
          *   **Evidence:** 1. It was raining heavily. 2. Alex's tires were worn (tread depth 2/32"). 3. Alex was texting (phone logs show activity 1 min prior). 4. The road has a known sharp blind curve.
          *   **Contrast 1:** Why Crash ($P$) vs. Drive Safely ($Q$)? (Why did the accident happen?)
              *   Explanation A: **Distraction.** (Texting caused loss of control).
              *   (Why not Rain? People drive in rain. Why not Tires? Tires were worn but held before).
          *   **Contrast 2:** Why Crash ($P$) vs. Skid/Recover ($R$)? (Why was it a *crash* and not just a slip?)
              *   Explanation B: **Mechanical Failure (Tires).** (Worn tires prevented grip recovery).
              *   (Why not Texting? Texting causes the drift, but tires determine if you catch it).
          *   **Incompatibility:**
              *   Exp A says: The *initiation* of the error is the explanation. (If not texting, no crash).
              *   Exp B says: The *failure to mitigate* is the explanation. (If tires good, no crash).
              *   Are they incompatible? "Texting caused it" implies "Even with good tires, texting at that speed on that curve would crash." "Tires caused it" implies "Even without texting, the curve + rain + worn tires = crash."
              *   This is a "Necessary vs Sufficient" tension.
              *   If I ask "Why Crash vs No Crash" (Normal driving): Texting is the difference.
              *   If I ask "Why Crash vs Skid" (Given the drift): Tires are the difference.
              *   This works. The *locus of control* shifts.

      *   *Refining the Car Case for the Prompt:*
          *   Make it a **Hiring** case again, it's more "social science" friendly for IBE papers usually.
          *   **Scenario:** A firm promotes Casey to Manager ($P$).
          *   **Evidence:** 1. Casey's sales numbers were top 10%. 2. The firm has a "Promote from Within" policy to reduce turnover. 3. An external candidate, Jordan, had higher sales numbers but no internal history. 4. The department budget allowed for only one promotion.
          *   **Contrast 1:** Why Promote ($P$) vs. Not Promote ($Q$)? (Why was the slot filled?)
              *   Explanation A: **Policy Mandate.** (The "Promote from Within" rule drove the decision to fill the slot internally).
              *   (Without this, maybe they wouldn't promote at all given budget).
          *   **Contrast 2:** Why Casey ($P$) vs. Jordan ($R$)? (Why internal over external?)
              *   Explanation B: **Merit/History.** (Casey's internal history mattered more than Jordan's raw sales).
              *   *Wait, Evidence 2 says Policy drove it.*
              *   Let's make the incompatibility: **Policy vs. Merit.**
              *   Exp A: Casey won because of the Rule (Policy).
              *   Exp B: Casey won because of Performance (Merit).
              *   Evidence: Casey's sales top 10% (Merit). Policy exists (Rule). Jordan higher sales (Undercuts Merit).
              *   If I ask "Why Promote vs Not": Policy explains why they promoted *someone* internally.
              *   If I ask "Why Casey vs Jordan": Merit explains why Casey (Internal) beat Jordan (External)? No, Jordan had higher sales.
              *   So if Jordan had higher sales, Merit *fails* to explain Casey over Jordan.
              *   So Exp B must be **Tenure/Loyalty.**
              *   Exp A (Policy): We *had* to pick an insider.
              *   Exp B (Tenure): We *wanted* Casey specifically for loyalty.
              *   Incompatibility: Was it a blind rule (A) or a specific valuation of Casey (B)?
              *   Contrast 1 ($P$ vs $\neg P$): Why promote at all? -> A (Policy).
              *   Contrast 2 (Casey vs. Other Insider): Why Casey over Sam? -> B (Tenure/Performance).
              *   *Okay, this works.*
              *   Scenario: Firm promotes Casey ($P$).
              *   Evidence: 1. Casey's sales were good, but not the best (Sam the insider was better). 2. Firm has a "Promote from Within" policy. 3. Casey has been with the firm 10 years; Sam has 2 years. 4. Budget allows one promotion.
              *   Contrast 1: Why Promote ($P$) vs. Hire External ($Q$)?
                  *   Explanation A: **Policy.** (The rule blocked external hires).
              *   Contrast 2: Why Casey ($P$) vs. Sam ($R$)? (Both insiders).
                  *   Explanation B: **Tenure.** (Casey's 10 years beat Sam's 2 years, despite Sam's sales).
              *   Incompatibility:
                  *   If A is the main story: The specific choice doesn't matter, just the category. (Casey was a placeholder for "Insider").
                  *   If B is the main story: The specific choice matters immensely. (Casey won on specific traits).
                  *   If A is true, the comparison with Sam is irrelevant. If B is true, the Policy is just background context, not the driver.
                  *   This feels like it meets the "Incompatibility" constraint. One makes the individual details load-bearing; the other makes them incidental.

