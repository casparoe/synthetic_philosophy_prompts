      *   *Causation:* Distinguish between "efficient cause" (billiard balls) and "structural/constraint cause" (setting the stage). The professors are using the latter but speaking like the former.
      *   *The Determinism Disclaimer:* Critique this. It assumes determinism = inevitability. It ignores probabilistic causation. It's a defensive move against the baggage of 19th-century determinism.
      *   *Definite Position:* It is **philosophically inconsistent** in its current form. It smuggles in distributed agency while officially denying it to stay safe. It's a "best of both worlds" attempt that doesn't fully own the metaphysics.
