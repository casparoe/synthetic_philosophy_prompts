answer: |-
  This is a classic mess, and your frustration is warranted. The literature is polarized because "perception" and "cognition" are folk categories that carve nature at different joints depending on which lab you're in. You are asking for a principled way to organize your intuitions, so I will give you two principles.

  The first is a **Complex Principle** designed specifically to validate every single one of your gut verdicts. It will feel ad hoc because it is.
  The second is a **Simple Principle** that offers a cleaner theoretical cut but requires you to sacrifice one of your verdicts. I will tell you exactly which one.

  ### 1. The Complex Principle: "The Sensory Construction Constraint"

  This principle saves all your verdicts by distinguishing between *constructing* the sensory object, *attributing* a property to it, and *recalibrating* the system.

  **The Principle:** Cognitive penetration occurs if and only if:
  1.  **Cause:** The change is driven by a propositional attitude (belief, expectation, label), *excluding* non-cognitive plasticity (goggles, discrimination training).
  2.  **Effect:** The change alters the *constitution* of the basic sensory stimulus (filling in missing data, resolving vector direction, detecting a feature previously invisible to the sensor), *excluding* mere shifts in salience or affective attribution.
  3.  **Constraint:** The effect must bypass the "Encapsulated Metric" system (static geometric relations).

  **How it saves your verdicts:**
  *   **Müller-Lyer:** Fails Condition 2 & 3. The lines are metrically static; the illusion is hardwired encapsulation. Cognition (knowledge of equality) cannot override the metric module. **(Not Penetrated)**
  *   **Radiologist:** Passes Condition 2. The shadow "popping out" is a change in feature detection (constituting the object), not just a judgment. **(Penetrated)**
  *   **Color Constancy:** Fails Condition 1. This is a bottom-up mechanism, not driven by belief. **(Not Penetrated)**
  *   **Angry Face:** Fails Condition 2. You classify "anger" as an affective attribution, not a basic sensory constituent like motion or pitch. **(Not Penetrated)**
  *   **Marchetti Dots:** Passes Condition 2. Motion direction is a basic sensory constituent. The label resolves the vector. **(Penetrated)**
  *   **Phonemic Restoration:** Passes Condition 2. You literally hear a sound that isn't there; the sensory object is constructed. **(Penetrated)**
  *   **Goggles/Green Discrimination:** Fails Condition 1. These are recalibration and perceptual learning, not cognitive states. **(Not Penetrated)**

  **The Cost:** This principle is ugly. It arbitrarily declares motion and pitch to be "sensory constituents" while treating emotion and pathology as "attributes," even though the Radiologist case suggests pathology *is* a visual feature for them. It relies on a shaky boundary between "seeing a feature" and "seeing an object as having a property."

  ### 2. The Simple Principle: "The Underdetermination Principle"

  This principle is theoretically cleaner. It is rooted in Predictive Processing: perception is a hypothesis test. Cognition only penetrates when the sensory data is insufficient to decide the hypothesis on its own.

  **The Principle:** Cognitive penetration occurs if and only if the sensory input is **underdetermined** (ambiguous, bistable, or missing), allowing top-down priors to select the percept. If the sensory signal is determinate, cognition can only affect judgment.

  **How it handles your verdicts:**
  *   **Müller-Lyer:** The retinal input is determinate (two lines). The illusion is a hardcoded prior, not a flexible cognitive belief. **(Not Penetrated)**
  *   **Marchetti Dots:** The motion vector is ambiguous (dots drifting could be up or down). The label provides the prior that resolves the ambiguity. **(Penetrated)**
  *   **Phonemic Restoration:** The signal is missing (underdetermined). Cognition fills the gap. **(Penetrated)**
  *   **Goggles/Green:** Not cognitive causes. **(Not Penetrated)**
  *   **Radiologist:** To a layman, the shadow is noise (ambiguous). To the expert, the knowledge resolves the ambiguity into a feature. **(Penetrated)**
  *   **Angry Face:** **HERE IS THE FLIP.** A neutral face is emotionally underdetermined. If Phonemic Restoration counts because the brain "fills in" a missing sound based on context, the Angry Face case must count because the brain "fills in" a missing emotion based on context.

  **The Verdict to Drop:** You must accept that the **Angry Face** case *is* cognitive penetration.
  **Why it's worth it:** It unifies your account of "filling in." Currently, you allow cognition to hallucinate a phoneme (Restoration) and hallucinate motion direction (Marchetti), but you deny it can hallucinate anger (Face). If "hearing a sound that isn't there" is penetration, "seeing an emotion that isn't there" should be too. The only reason you resist is that emotion feels "higher level," but the Underdetermination Principle argues that *level* doesn't matter; *ambiguity* matters.

  ### 3. The Cocktail Party Case

  **Case:** Hearing your name in noise.
  **Analysis:** The auditory stream is highly underdetermined (noise). Your name "popping out" is a selection of a signal from noise based on a high-value prior (self-relevance).
  *   **Complex Principle:** **Penetrated.** It is sensory construction (stream segregation) driven by a cognitive state (knowledge of name/self).
  *   **Simple Principle:** **Penetrated.** The input is underdetermined; the prior resolves the percept.
  *   **Verdict:** This is a strong case for penetration under both principles. It is structurally identical to the Radiologist case.

  ### 4. Predictions for New Cases

  **Case A: Learning a New Color Category (e.g., distinguishing two shades of blue previously seen as identical).**
  *   **Complex Principle:** **Not Penetrated.** This is perceptual learning (recalibration of cones/opponent channels), not driven by a belief/proposition, but by exposure. (Matches your Green Discrimination verdict).
  *   **Simple Principle:** **Not Penetrated.** The sensory input (wavelengths) is determinate; the change is in the sensor's resolution, not the cognitive resolution of ambiguity.
  *   **Prediction:** Both agree this is *not* penetration, distinguishing it from the Radiologist case (which involves semantic knowledge, not just exposure).

  **Case B: Synesthesia (e.g., hearing a C# and seeing Red).**
  *   **Complex Principle:** **Not Penetrated.** Synesthesia is automatic and not driven by a propositional attitude or belief. It is a cross-wiring, not a cognitive effect.
  *   **Simple Principle:** **Not Penetrated.** The auditory input is determinate; the color experience is a fixed association, not a hypothesis test resolved by cognition.
  *   **Prediction:** Both agree this is *not* penetration. This is crucial: it preserves the definition of penetration as *cognitive*, ruling out hardwired quirks.

  ### 5. The Meta-Question: "Looks vs. Judges"

  You asked if the "looks-different versus judged-different" distinction can be cashed out.

  **Honest Answer:** No, not as a binary. It is a continuum of **Phenomenal Contrast.**

  The literature is stuck because philosophers try to find a bright line where there is a gradient. Instead of asking "Is it penetration?", track **The Phenomenal Contrast Test**:
  *   *Can the subject describe the difference without referencing the belief?*
      *   **Müller-Lyer:** "I know they are equal, but *this one looks longer*." (High Contrast).
      *   **Angry Face:** "He looks angry." vs "I judge him to be angry." (Low Contrast).
      *   **Marchetti:** "It looks like it's moving up." (High Contrast).

  **What you should be tracking:**
  Stop tracking "Penetration." Start tracking **"The Locus of Plasticity."**
  *   **Early Plasticity:** Changes in V1/A1 tuning (Green discrimination, Goggles).
  *   **Mid-Level Plasticity:** Changes in feature binding/segmentation (Marchetti, Radiologist, Cocktail Party).
  *   **Late Plasticity:** Changes in semantic attribution (Angry Face, Müller-Lyer judgment).

  Your intuitions are actually tracking *Mid-Level Plasticity*. You call it "Penetration" when cognition changes how the brain segments or constructs the mid-level sensory object (motion, sound presence, tumor feature). You deny it when the change is Early (Goggles) or Late (Anger/Metric).

  **Recommendation:** Adopt the **Simple (Underdetermination) Principle** and flip your verdict on the **Angry Face**. It forces you to acknowledge that "seeing" anger in a neutral face is phenomenally identical to "hearing" a phoneme in a cough. If you refuse to flip that, you must admit your distinction between Restoration and Anger is merely modality bias (Auditory vs. Visual) rather than a principled cognitive boundary.
