answer: |-
  **Brainstorm: Audience Dynamics**

  Right, let's size up the room before you step in. You've got a triangulation problem here.

  The **liberals** (Locke/Rawls crowd) view resistance as a fallback position for the individual when the state fails. They'll instinctively hear "collective right" and think "aggregate of individual rights." You need to stop them from mapping Aquinas onto Rawlsian civil disobedience. They'll be suspicious of any teleology that isn't grounded in autonomy.

  The **Thomists** are your textual gatekeepers. They smell anachronism like blood in the water. Calling Aquinas "conciliarist" is risky because conciliarism is technically post-Aquinas (14th/15th century). They'll accuse you of projecting later debates onto the Angelic Doctor. You need to show you're tracing a *logic*, not rewriting history.

  The **Lawyer** (US Founders obsessive) wants mechanisms. "Who presses the button?" They'll want to equate your "intermediate powers" with Congress or the Electoral College. They'll push hard on the Locke comparison because that's their bridge to the Constitution.

  Your job is to keep the Liberals from secularising the metaphysics, the Thomists from siloing the text, and the Lawyer from reducing it to a proto-American revolution. You're arguing for a *structural* check, not a *rights-based* claim.

  ***

  **Prep Sheet: Objections & Replies**

  **1. The Liberals: "You're smuggling Catholic natural law into secular resistance theory."**

  *   **What they'll say:** "This sounds like you're granting a 'right' to resist, but only if it aligns with a specific metaphysical end (the common good). That's not a right; it's a duty contingent on Catholic ontology. You can't recieve liberal legitimacy while keeping the teleological baggage."
  *   **Concede up front:** Admit that the *grounding* is incompatible. You aren't offering a secular foundation.
  *   **Reply that lands hardest:** "I'm not arguing for the *grounding* of the right, but the *architecture* of the act. Liberal resistance is individual vs. State (vertical). My reading of Aquinas offers Body vs. Head (organic/structural). It matters because liberal resistance dissolves the political bond (Locke's state of nature); Aquinas's resistance restores the bond via intermediate bodies. It's constitutional correction, not revolutionary dissolution."
  *   **Weakest point in that reply:** It's hard to explain what holds the "intermediate bodies" together without eventually appealing to the individual good, which slides you back toward liberalism.

  **2. The Thomists: "You're over-reading the *Sentences* commentary and projecting conciliarism backwards."**

  *   **What they'll say:** "Aquinas never uses the language of conciliarism. The *Sentences* commentary is about ecclesiastical power, not civil tyranny. You're conflating distinct treatises to make him look more 'constitutional' than he was."
  *   **Concede up front:** Acknowledge Aquinas isn't a conciliarist historically. He didn't sit at Constance.
  *   **Reply that lands hardest:** "I'm not claiming he's a conciliarist, but that his account of authority as *delegated* (in the *Sentences*) provides the ontological precondition for conciliarism. If authority is possessed, resistance is sedition. If authority is delegated for an end, failure of the end voids the delegation. The *Sentences* provides the mechanism that makes the *De Regno* restriction on private tyrannicide coherent. It's not projection; it's reconstruction."
  *   **Weakest point in that reply:** Aquinas never explicitly connects the *Sentences* delegation theory to civil deposition in the way you need. You're building a bridge he didn't explicitly walk across.

  **3. The Lawyer: "Why isn't this just Locke's right of revolution with extra steps?"**

  *   **What they'll say:** "Locke says the people dissolve the government when trust is violated. You say the intermediate powers depose the tyrant when the common good is violated. Outcome is the same: Tyrant out. Why should I care about the medieval scaffolding?"
  *   **Concede up front:** The outcome (removal) is identical.
  *   **Reply that lands hardest:** "Because Locke's revolution returns us to a state of nature where everything is up for grabs. Aquinas's resistance is a *legal* act performed by a public personae. It preserves continuity of the regime while changing the head. For a constitutional lawyer, that's the difference between a coup (Locke) and an impeachment (Aquinas). It stabilises the post-tyrannical order."
  *   **Weakest point in that reply:** In practice, once the tyrant is gone, the stability often collapses anyway. The distinction is theoretically neat but historically messy.

  ***

  **The Objection You're Praying Nobody Raises**

  **"Do modern democratic citizens, as intermediate authorities, have a duty to resist?"**

  If they hit you with this, they're asking if your theory democratises resistance. If the "public authority" resides in the people, are we all magistrates?

  *   **The Trap:** If you say "yes," you're advocating universal insurrection (dangerous). If you say "no," you're elitist (undemocratic).
  *   **The Defence:** Distinguish between the *populus* as a mystical body and citizens as private individuals. In Aquinas's framework, the "intermediate power" isn't every voter; it's the institutional embodiment of the community (Parliament, Estates, etc.).
  *   **The Line:** "Citizens don't have a duty to resist as private individuals; they have a duty to sustain the intermediate institutions that *can* resist. The duty is institutional fidelity, not individual vigilantism."

  ***

  **Your Weakest Spot: Kill vs. Resist**

  **"Aquinas never clearly authorises intermediate magistrates to kill the tyrant, only to resist."**

  Don't dodge this. It's the hinge of your whole argument. If they can depose but not kill, is it really resistance theory or just administrative procedure?

  *   **The Concession:** You must admit Aquinas is wary of tyrannicide even by public authority. He prefers deposition.
  *   **The Defence:** "The gap isn't a failure; it's the point. Killing the tyrant privatizes the act, turning it into vengeance (which risks sedition). Deposing the tyrant publicizes the act, turning it into law. By restricting the *means* to resistance/deposition rather than execution, Aquinas ensures the *authority* remains structural. If you allow killing, you invite private actors. If you restrict to deposition, you force the intermediaries to act as a body. The 'gap' protects the constitutional order from fracturing into civil war."
  *   **Why this works:** It turns your textual weakness (he doesn't endorse killing) into a theoretical strength (it prevents anarchy). It shows you've read the text *and* understood the political logic behind the silence.

  Good luck. Keep your head down on the metaphysics and hammer the structural distinction. That's where you'll win them.
