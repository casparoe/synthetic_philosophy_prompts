prompt: |-
  You're acting as a senior political philosopher with a specialism in medieval constitutional thought. Think carefully, and start with a quick brainstorm of the audience dynamics before you lay out the prep sheet.

  Next Tuesday I'm giving a short paper at an interdisiplinary seminar on resistance theory — mostly modern liberal philosophers who treat Aquinas as a footnote but know Locke and Rawls inside out, plus two Thomist scholars who actually read the Latin, and one constitutional lawyer obsessed with the US Founders. My thesis: the familiar restriction on private tyrannicide in De Regno and the Summa discussion of sedition is usually read as conservative, but if you pair it with his account in the Sentences commentary — where authority is treated as delegated rather than possessed — and with the conciliarist view that intermediate powers hold a structural check, you get a collective right of resistance closer to conciliarist constitutionalism than to liberal individual rights. No bibliographies or reading lists, please — a model without web access can only guess those. I need the argument in the weeds, not a textbook summary.

  Prepare me for the objections in roughly the order they'll hit, phrased as each subgroup would actually say them. First, the liberals accusing me of smuggling Catholic natural law into secular resistance theory. Second, the Thomists saying I'm over-reading the Sentences commentary and projecting conciliarism backwards onto Aquinas. Third, the lawyer asking why this isn't just Locke's right of revolution with extra steps. For each: what I should concede up front, the reply that lands hardest, and the weakest point in that reply.

  Also cover the objection I'm praying nobody raises: whether modern democratic citizens, as intermediate authorities in some structural sense, have not just a right but an active duty to resist unjust laws. And don't let me dodge my own weakest spot — Aquinas never clearly authorises intermediate magistrates to kill the tyrant, only to resist. I need to defend that gap in my defence rather than hope they overlook it.

  Keep it focused, casual, British spelling throughout, and feel free to include a typo or two — I don't mind if "receive" comes out as "recieve".
