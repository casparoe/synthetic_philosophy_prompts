      *   **The Rules:**
          1.  **Non-Aggregation of Equal Claims:** Numbers don't count when harm is identical (Verdicts 1, 4).
          2.  **Severity Sensitivity:** Greater harm trumps lesser harm, even if fewer people (Verdict 2).
          3.  **Special Obligations:** Partiality is required/allowed for kin (Verdict 3).
      *   **The Bet:** Bet on the **Fairness/Equal Claim** interpretation over the **Arbitrary Prerogative** interpretation. Why? The "complaint" language implies a constraint on justification that arbitrary choice violates.
      *   **The Tie-Breaker Case:** The "Repeated Rescue" or "Coin Flip Requirement" case. Ask if she is *required* to randomize when possible.
      *   *Refining the Tie-Breaker:* The prompt asks for a case to tell the *surviving rules* apart. The surviving rules are the interpretations of her non-aggregation.
      *   *Rule 1:* **Individualist Restriction (Scanlon).** The 5 cannot combine claims. Fairness requires equal chance per *party*.
      *   *Rule 2:* **Agent-Centered Prerogative.** The agent isn't required to maximize, so she can pick the 1. In the dial case, this might allow *any* setting because she isn't bound by the 5's claim strongly enough to force a 50/50 split, only to allow saving the 1.
      *   *Wait, if she has a Prerogative, can she set 0%?* If she has a duty to rescue *someone*, 0% is bad. But 100% Left is okay.
      *   *So the distinction is:* Is 50% *required* (Fairness) or is 50% merely *permitted* (Prerogative allows any split)?
      *   *Tie-Breaker:* **The Two-Stage Rescue.** You can flip a coin now, or choose deterministically. Are you *obligated* to flip the coin?
