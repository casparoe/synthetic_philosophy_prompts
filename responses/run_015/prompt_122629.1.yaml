      *   *Rule 2: Severity Thresholds.* Aggregation might be allowed if the harm on the other side is significantly *less* (e.g., broken arms), but not if it's the same (death). Actually, Verdict 2 says she saves the 1 (Death) over 5 (Arms). This means she *does* compare severity. She just doesn't aggregate *equal* severity.
      *   *Rule 3: Special Obligations Trump General Claims.* The duty to the sister overrides the duty to strangers, even 5 of them.
      *   *Alternative Rule (Randomization as Fairness):* When claims are equal and incompatible, a fair lottery is required.

      *Let's narrow down to the top 2 competing interpretations of her view:*
      *   **Hypothesis A (Scanlonian Contractualism):** Principles must be justifiable to each individual. The single person can reject a principle that says "save the greater number" because it sacrifices them for others. The five cannot reject "flip a coin" because they aren't being sacrificed for others; they just face risk.
      *   **Hypothesis B (Agent-Relative Prerogative / Non-Utilitarian Agent-Centered):** The agent is not required to maximize good. She is permitted to favor anyone, or perhaps required to follow a specific non-aggregating rule. But Verdict 1 says saving 1 is *no worse* than saving 5. Verdict 3 says saving sister is *required*. This suggests a hierarchy of duties.

      *Better Distinction:*
      *   **Theory 1: The "Equal Claim" Theory (Scanlon).** The 1 and the 5 have equal *strength* of claim. Therefore, they get equal *probability*.
      *   **Theory 2: The "No Duty to Maximize" Theory (Scheffler/Agent-Centered).** She isn't required to save the 5. But does she have a duty to be *fair*? If she just thinks "I don't have to save the 5," she might think *any* number is permissible, including 0% or 100%. But Verdict 1 says "saving the one is no worse." It doesn't explicitly say "I can arbitrarily choose." However, the "complaint" language suggests a rights-based view. If rights are equal, arbitrariness is wrong.
      *   *Correction:* If she truly believes numbers don't matter *at all*, she might think 100% to the one is okay (since saving 1 is no worse than saving 5). But the "complaint" language implies a fairness constraint. If I save the 5 deterministically, the 1 has a complaint ("Why me?"). If I save the 1 deterministically, the 5 have a complaint ("Why us?"). Since neither complaint outweighs the other, a lottery is the only solution.
      *   *So, the specific question is about the **odds** of the lottery.*
