      *   Rule A: **Scanlonian Contractualism.** (Claims are individual, numbers don't aggregate, fairness requires equal chance).
      *   Rule B: **Moderate Deontology with Prerogative.** (You have a duty to rescue, but not to maximize. You can favor anyone absent special obligations).
      *   *Distinguishing Case:* **The 1 vs. 5 with a Cost.** Suppose saving the 1 costs you $100, saving the 5 costs you $100. (Same cost). Doesn't help.
      *   *Distinguishing Case:* **The 1 vs. 5 where the 5 are slightly worse off?** No.
      *   *Distinguishing Case:* **Repeated Trials.** If you face this 1-vs-5 choice 100 times.
          *   Rule A (Fairness): You should save roughly 50 of each side over time.
          *   Rule B (Prerogative): You could save the single person all 100 times.
