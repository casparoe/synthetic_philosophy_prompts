      *   *Key Mechanism:* Inability to think from the standpoint of somebody else. Reliance on clichés/official language.
      *   *User's Nuance:* The user wants to decouple "banality" from "lack of ambition/ideology." An ideologue can be banal if their ideology replaces independent judgment.
      *   *The Eichmann Counter-argument:* Bettina Stangneth's *Eichmann Before Jerusalem* suggests he was a convinced antisemite. Arendt's defenders argue even if he was ideological, his *mode* of engaging with reality was bureaucratic and clichéd.

  3.  **Analyze the Literary Text (*The Remains of the Day*):**

      *   *Stevens:* A butler devoted to "dignity."
