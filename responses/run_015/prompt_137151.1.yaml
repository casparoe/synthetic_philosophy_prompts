          *   *Self-Deception:* How it feels to be "dignified" while breaking. The tension between what is said and what is felt (Miss Kenton scenes).
          *   *Key Insight:* The novel shows that thoughtlessness is often motivated by *love* (of a father, of a profession, of a notion of greatness). Arendt's Eichmann seemed cold; Stevens seems tragic. This adds the dimension of *pathos* to the *horror*.
          *   *Specific Pointers:* The father's death scene (dissociation), the bench scene with Miss Kenton (repressed intimacy), the pier ending (the breakdown of the narrative voice).

  5.  **Refining and Polishing:**

