      *   *Meaning vs. Satisfaction:* Satisfaction is the carrot. Meaning is the maze. Teleonomy explains why we run the maze. The distinction holds because function $\neq$ feeling.
      *   *Closing:* The bird call metaphor. It's lonely but beautiful.

  8.  **Refining the Argument (Self-Correction during drafting):**
