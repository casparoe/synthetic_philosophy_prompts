answer: |-
  This is a precise dissection of a specific epistemic regime. You are asking for the operating system of modern guideline-based medicine, not the medical science itself. The frustration you feel—the "granularity lottery" and the "cohort filter"—arises because you are viewing the system as a **prediction engine**, whereas the system is designed as a **liability and resource allocation engine**.

  Here is the reconstruction of the implicit theory, separated into strict commitments and compatible accommodations.

  ### 1. The Core Epistemology: Regulatory Exchangeability

  The practice presupposes a theory of **Administrative Exchangeability**.

  **Strict Presupposition:** An individual is epistemically visible to the medical system *only* to the extent that they can be swapped with a member of a historical cohort without altering the expected net benefit of the intervention.
  *   **What this rules out:** It strictly rules out **Idiosyncratic Causal Power**. Even if you *know* your sleep data predicts your arrhythmia, the system treats that knowledge as epistemically null regarding *prescription authority* unless that specific data point has been used to stratify a randomized control trial (RCT) or a validated observational cohort.
  *   **What this allows:** It allows for **Proxy Homogeneity**. It assumes that if you match the cohort on variables $X, Y, Z$ (age, cholesterol, BP), you are sufficiently similar to them regarding the *treatment effect*, even if you differ on unmeasured variables $A, B, C$ (sleep, genetics, diet).

  **Compatible Accommodations:**
  *   **Probability Philosophy:** The practice *looks* Frequentist (risk = frequency in a reference class), but it does not strictly presuppose Frequentism. A Bayesian could view the risk equation as a **strongly informative prior** derived from the cohort, and the threshold as a **utility function**. However, the practice *enforces* a Frequentist interpretation on the clinician. You are not allowed to treat the output as a subjective degree of belief; you must treat it as an objective frequency to justify the guideline.
  *   **Truth vs. Convention:** The practice does *not* presuppose a determinate "true" risk number for you. It presupposes a **calibrated** risk number. The threshold (e.g., 7.5%) is strictly a **Decision-Theoretic Convention**. It is not a biological cliff; it is the point where the cost of treatment (side effects, money) is outweighed by the expected benefit *averaged over the group*.

  ### 2. The Coherence Question: Prediction vs. Actionability

  Your biostatistician friend is giving you the **Statistical Answer** (bias-variance tradeoff), but you are asking for the **Normative Answer** (why this evidence counts and that doesn't). There is a gap between the two.

  **The Gap:**
  The friend assumes the goal is **Prediction Accuracy** (minimizing error in estimating your risk).
  The system's goal is **Actionable Warrant** (justifying the intervention without incurring liability or waste).

  **Why the Three Bits Hang Together (The "Compromise" Theory):**
  The clinic is not running a unified theory of *risk*; it is running a unified theory of **evidence hierarchy for intervention**.
  1.  **The Model (Cardiology):** High-volume, low-cost intervention (statins). We can afford to be granular because the cost of error is low, but the cost of mass-prescribing is high (side effects, cost). We need a risk score to ration the drug.
  2.  **The Crude Class (Colonoscopy/Mammo):** High-cost, invasive intervention. We cannot afford granular risk models because the resource constraint is physical (endoscopists, machines), not just pharmaceutical. We use age cutoffs because they are **legible proxies** that manage queue volume.
  3.  **The Cohort Filter:** This is the glue. It ensures that *whatever* risk estimate is used, the link between that estimate and the *benefit of the specific intervention* has been tested.

  **Is it Consistent?**
  Yes, under a theory of **Transportability**.
  The system presupposes that **Risk Prediction $\neq$ Treatment Benefit**.
  You can have a perfect prediction of your heart attack (using sleep data + PRS), but if no trial has shown that *people with your specific sleep/PRS profile* benefit from statins *more than they are harmed*, the system cannot authorize the drug. The "Cohort Filter" is not filtering out *predictive information*; it is filtering out *unvalidated treatment-effect heterogeneity*.

  **Verdict on the Friend:** He is right that narrowing classes increases variance. But he is wrong that this is the *only* reason novel markers are excluded. They are excluded because **calibration of benefit** is missing. The system is committed to **Evidence-Based Medicine (EBM)** defined as "intervention validated on a class," not "prediction validated on an individual."

  ### 3. Strict Commitments vs. Conventions

  Here is the breakdown of what the practice *needs* to be true versus what is just habit.

  | Feature | Strictly Presupposes (If this breaks, the system fails) | Merely Sits Well With (Convention/Contingent) |
  | :--- | :--- | :--- |
  | **The Risk Number** | **Calibration:** The number must correspond to an observed event rate in a defined group. If the number is uncalibrated, the threshold logic collapses. | **Frequentism:** A Bayesian could use the same number as a prior, provided the calibration holds. |
  | **The Threshold** | **Utility Balance:** The threshold must represent a point where Net Benefit > 0 for the *average* member of that risk bin. | **Determinacy:** There is no "true" threshold. It is a policy lever moved by guideline committees based on drug cost and societal values. |
  | **The Variables** | **Stability:** The variables must be stable enough to be measured consistently across clinics. | **Causal Completeness:** The system admits it misses causes (e.g., genetics) but assumes the *proxy* variables capture enough causal variance to make the treatment effective. |
  | **The Cohort Filter** | **Exchangeability:** You must be exchangeable with the trial population regarding *treatment response*. | **Exclusion of Novel Data:** It is contingent. If a PRS trial showed differential statin benefit by score, the filter would open. It rejects data because of *validation status*, not ontology. |

  ### 4. Replacement: What if we drop the Cohort Filter?

  If you allow any predictive evidence (wearables, PRS, diet specifics) without the cohort filter, the system does not become "silly," but it undergoes a **Category Collapse**.

  **1. The Calibration Break:**
  The risk percentage (e.g., "10% chance") ceases to be a frequency. It becomes a **Score**.
  *   *Current State:* "10%" means "10 out of 100 people like you had an event."
  *   *New State:* "10%" means "The algorithm output 10 based on your unique inputs."
  *   *Consequence:* You can no longer apply the guideline threshold. The threshold was calibrated on the *old* inputs. If you add PRS, the baseline risk shifts. A 7.5% risk with PRS included is not equivalent to a 7.5% risk without it. The threshold becomes meaningless.

  **2. The Liability Shift:**
  Currently, the guideline is a **Safe Harbor**. If you follow it, you are legally and professionally protected.
  *   *If you drop the filter:* The doctor becomes a **Bayesian Agent**. They must weigh the predictive value of your sleep data against the guideline. If they ignore the guideline to treat you based on your Oura ring data, and you suffer rhabdomyolysis from the statin, they are liable. The "Cohort Filter" is a **liability firewall**. It protects the doctor from having to be a philosopher of probability.

  **3. The Inequality Explosion:**
  The "Granularity Lottery" becomes a **Market Lottery**.
  *   Currently, the variables are cheap and standard (BP, cholesterol).
  *   If PRS and advanced imaging are admitted, risk stratification becomes a function of wealth. The "standard of care" fractures. The guideline exists to enforce a **single standard of care** across a population. Dropping the filter creates boutique medicine vs. public health medicine.

  ### 5. Summary of the Implicit Theory

  The practice is running on **Regulatory Frequentism**.

  1.  **Ontology:** Individuals do not have "risks"; they have **memberships**. Risk is a property of the class, imputed to the individual via exchangeability.
  2.  **Epistemology:** Evidence is not valid based on *predictive power* (correlation with outcome) but on **interventional validation** (correlation with treatment benefit). This is why your sleep data is rejected: it predicts the *event*, but it has not been shown to modify the *treatment effect*.
  3.  **Ethics:** The primary obligation is **Systemic Stability** (calibration, resource allocation, liability protection) over **Individual Accuracy**. The "Granularity Lottery" is a feature, not a bug; it ensures that everyone is judged by the same coarse ruler, which allows for population-level management.

  **Why you are stuck in circles:**
  You are arguing for **Individual Epistemic Justice** (my specific data should count for my specific risk).
  The system is arguing for **Collective Actionability** (we need a rule that works for the group and protects the prescriber).

  **The Verdict:**
  The system is not incoherent, but it is not trying to do what you think it is. It is not trying to calculate *your* truth. It is trying to calculate *the warrant for the prescription*.
  *   **Strict Commitment:** The link between the risk stratum and the treatment benefit must be empirically demonstrated in a cohort.
  *   **Convention:** The specific variables chosen (cholesterol vs. PRS) and the specific thresholds (7.5% vs 10%).
  *   **The Friend's Error:** He thinks the exclusion is statistical (noise). It is actually regulatory (validation).

  To change the practice, you do not argue that the sleep data is predictive. You argue that **treating based on sleep data improves outcomes in a randomized trial**. Until then, the Cohort Filter will hold, not because the data isn't "real," but because it isn't **actionable** within the current epistemic regime.
