answer: |-
  Your friend is giving you much better advice than the blogger. The passage you quoted is a classic example of "popularized philosophy": it takes a live, highly technical academic debate, presents one side as obvious common sense, identifies a real problem with that side, and then pivots to a conclusion that most experts in the field actually reject.

  Here is a breakdown of how fair the passage is, which parts experts would accept, and why the "just go with your favorite theory" conclusion is generally considered a mistake.

  ### 1. Sentence-by-Sentence Fact-Check

  **Sentence 1 & 2:** *"If you're not sure which moral theory is true, the fix is to treat that uncertainty exactly like uncertainty about the facts: assign each theory a credence, then pick the option with the highest expected choice-worthiness..."*
  *   **Verdict:** **Accurate description, controversial prescription.**
  *   **Expert View:** This describes the leading view in the field, known as **Maximizing Expected Choice-worthiness (MEC)**. It was popularized by philosophers like Will MacAskill and Toby Ord. However, calling it "the fix" implies the problem is solved. It is not. It is the dominant *proposal*, but it faces severe technical hurdles (which your friend noted).

  **Sentence 3:** *"Since that's just expected-utility maximisation with theories in the role of outcomes, it's the only rationally permissible rule, and anyone who refuses to aggregate is being straightforwardly irrational."*
  *   **Verdict:** **Major Overstatement / Dogmatism.**
  *   **Expert View:** Almost no working philosopher would agree that this is the *only* rationally permissible rule. The analogy between factual uncertainty (will it rain?) and moral uncertainty (is utilitarianism true?) is contested. Many argue that moral theories have different *structures* that cannot be mathematically averaged. Calling dissenters "straightforwardly irrational" is rhetorical fluff, not argument.

  **Sentence 4:** *"It also basically dissolves moral disagreement: once two people who disagree about which theory is correct both do the weighted-average thing, whatever dispute is left over is purely empirical."*
  *   **Verdict:** **False.**
  *   **Expert View:** This is a conflation. Even if two people agree to use MEC, they will still disagree on:
      1.  **Credences:** How likely is Kantianism vs. Utilitarianism?
      2.  **Intertheoretic Comparisons:** How many "units" of Kantian duty equal one "unit" of Utilitarian happiness? (This is the "common currency" problem your friend mentioned).
      Disagreement does not dissolve; it just shifts to these harder technical questions.

  **Sentence 5:** *"And the standard worry — that some theory you assign a tiny credence can swamp the sum... shows the whole approach is broken..."*
  *   **Verdict:** **Plausible Objection, Strong Conclusion.**
  *   **Expert View:** This refers to the **"Fanaticism" or "Pascal's Mugging" problem**. If you give 0.01% credence to a theory that says "Save the universe or infinity bad things happen," MEC forces you to ignore all mundane morality to chase that 0.01%. This is a recognized, serious bug in MEC. However, saying it proves the approach is "broken" is one side of the debate; many try to fix MEC rather than discard it.

  **Sentence 6:** *"...the honest fallback is to just act on the theory you find most plausible and ignore the rest."*
  *   **Verdict:** **Generally Rejected.**
  *   **Expert View:** This is known as **My Favorite Theory (MFT)**. While the blogger presents this as the "honest fallback," most philosophers working on moral uncertainty consider MFT to be *worse* than MEC. It ignores the *stakes* of being wrong. (See section 3 below).

  ### 2. Validating Your Friend's Objections

  Your friend mumbled three distinct, high-level objections that are central to the literature. They are all valid.

  **A. "How good by the theory's lights" is not a quantity.**
  *   **The Problem:** This is the **Intertheoretic Comparison Problem**.
  *   **Why it matters:** Utilitarianism might output a "score" (utils). But Deontology might output "permissions" or "constraints." There is no agreed-upon exchange rate. Is violating one Categorical Imperative "worth" 100 units of utility? 1,000? Infinity? Without a common currency, you cannot do the math the blogger suggests. MEC requires a "cardinal" scale for all theories, but many theories only offer an "ordinal" ranking.

  **B. "Some theories telling you to ignore your doubts about them."**
  *   **The Problem:** This is the **Screening Off** or **Domination** problem.
  *   **Why it matters:** Some moral theories say, "Do what is actually right, not what you *think* is probably right." If you assign 40% credence to *that* theory, that theory commands you *not* to use the blogger's method (MEC). So, following MEC might violate the very theories you are trying to respect.

  **C. "Uncertain about what to do when you're morally uncertain."**
  *   **The Problem:** This is the **Regress Problem**.
  *   **Why it matters:** If you are uncertain about first-order morality (e.g., Utilitarianism), shouldn't you also be uncertain about second-order morality (how to handle uncertainty)? If you need a rule to decide which rule to use, you need a rule to decide *that* rule, ad infinitum. The blogger assumes we can just "pick" the MEC rule without being uncertain about it, which is philosophically inconsistent.

  ### 3. Does "Just Go With Your Favorite Theory" Survive?

  The blogger concludes that because MEC has problems (like fanaticism), we should revert to **My Favorite Theory (MFT)**.

  **Most experts reject this conclusion.** Here is why:

  Imagine you are 90% sure that "Stealing is slightly bad" (Theory A) and 10% sure that "Stealing triggers a nuclear explosion" (Theory B).
  *   **MFT (Blogger's view):** You are 90% sure of Theory A, so you ignore Theory B. You steal. You risk the nuclear explosion.
  *   **MEC:** You weigh the 10% risk of the explosion. You do not steal.

  In cases where the minority theory has **high stakes**, MFT is recklessly irrational. This is why most philosophers prefer to keep wrestling with MEC (trying to solve the fanaticism problem) rather than abandoning it for MFT. The blogger's move is seen as throwing the baby out with the bathwater.

  ### Summary Verdict

  *   **Trustworthiness:** Low. The blogger is confident but ignores the last 15 years of technical literature.
  *   **What to keep:** The definition of Expected Choice-Worthiness (Sentences 1-2) is a useful concept to understand, even if it's hard to implement.
  *   **What to discard:** The claim that this is the *only* rational rule, the claim that it dissolves disagreement, and the conclusion that you should ignore minority theories.
  *   **Your Friend:** Your friend is correct. The problems they raised are the exact reasons why this field is still active and unresolved. The "just go with your favorite" move is generally viewed as a failure of imagination rather than a solution.

  **Bottom Line:** Moral uncertainty is a real problem, but there is no consensus "fix." The blogger is selling a simplified map as the territory. Treat the passage as an introduction to *one* argument, not a guide on how to actually behave.
