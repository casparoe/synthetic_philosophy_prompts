answer: |-
  This is an exceptionally clear diagnosis of a philosophical stalemate. You have correctly identified that the deadlock often stems from competing intuitions about the *purpose* of a semantic theory, rather than a disagreement about the raw data of language use.

  Here is a diagnosis of the state of play, testing your hypothesis against the three cases you provided, followed by an assessment of where progress lies and a confidence report on my own analysis.

  ### Part 1: Testing Your Hypothesis

  Your hypothesis is that the two camps are answering different questions while using the word "meaning" as if it picked out one thing. One side (let's call them the **Fregeans**) thinks semantics must explain rational differences in what people learn and believe. The other side (let's call them the **Direct Reference theorists** or **Millians**) thinks semantics must explain truth conditions and how language hooks onto the world, leaving cognition to psychology.

  **Verdict:** Your hypothesis is largely correct, but it requires one nuance. It is not merely that they have different goals; it is that both sides believe their goal is the *primary* one. The Direct Reference theorists argue that if you build cognitive differences into meaning, you break the rules of how language combines (compositionality). The Fregeans argue that if you leave cognitive differences out, you cannot explain how language guides rational thought. They are fighting over which constraint is the "real" constraint on meaning.

  To understand why they don't move, we need to define a few terms as we go:
  *   **Proposition:** The core claim or information a sentence conveys, usually treated as the thing that is either true or false.
  *   **Singular Proposition:** A claim directly about a specific object (e.g., "This thing is red"), where the object itself is part of the claim.
  *   **Compositionality:** The rule that the meaning of a whole sentence is built strictly from the meanings of its parts.
  *   **De re:** A belief or statement "of the thing" itself, regardless of how it is described.
  *   **Pragmatic:** About how language is used in context to convey information, rather than the literal meaning of the words themselves.

  ### Part 2: The Three Cases

  #### Case 1: The Statue (Perceptual Identity)
  *The Scenario:* You see one statue. You learn it is "the harbour piece" and "the auction piece." The identity statement is informative despite perceptual contact.

  *   **Does this discriminate between the camps?**
      No, but it clarifies the battlefield.
      *   **The Direct Reference View:** They will say the sentence expresses a **singular proposition** containing only the statue and the property of identity. Since the statue is the statue, the proposition is trivial. The *informativeness* is not in the sentence meaning but in your mental state. You have two mental "files" on the same object. Learning the identity merges the files. This is a psychological event, not a semantic one.
      *   **The Fregean View:** They will say that even with perceptual contact, you access the object under different "modes of presentation" (via the harbour history vs. the auction history). These modes are part of the meaning.
      *   **Diagnosis:** This case shows that perceptual contact does not guarantee cognitive integration. The Direct Reference theorist concedes the cognitive difference exists but banishes it to psychology. The Fregean keeps it in semantics. The case does not force a verdict; it forces the Direct Reference theorist to say, "Yes, it's informative, but that's not semantics."

  #### Case 2: Dana Reyes (One Name, Two Files)
  *The Scenario:* One name, one person, two unconnected mental dossiers (Union Rep vs. Author).

  *   **Does this shift the dispute?**
      Yes, this is the strongest evidence for your hypothesis.
      *   **The Problem:** If the difference in meaning were located *in the name*, this case shouldn't happen. The name "Dana Reyes" is identical in both uses.
      *   **The Concession:** Both camps must agree here that the difference lies in the *speaker's mind* (often called "mental files" or "dossiers"). The Direct Reference theorist says, "See? The name is just a tag. The complexity is all in your head." The Fregean says, "Exactly, so semantics must model those mental files to explain how you reason."
      *   **Diagnosis:** This relocates the dispute exactly where you suspected: one level down. The fight is no longer about whether names have descriptions; it is about whether the structure of our mental files is part of *linguistic meaning* or part of *general cognition*.
      *   **Agreement Potential:** This is where they *could* agree. They could say: "There is Semantic Content (the object) and Cognitive Content (the mental file)." But they rarely do, because the Direct Reference theorist fears that admitting Cognitive Content into semantics breaks **compositionality** (making logic too messy), while the Fregean fears that excluding it makes semantics irrelevant to human reasoning.

  #### Case 3: The Metadata (Entity vs. Provenance)
  *The Scenario:* Engineers say "Entity is Entity" (ID match). Cataloguers say "Provenance matters" (History of the record).

  *   **Is this the same dispute?**
      Yes, it is the same structural problem, but your workplace solves it practically while philosophy fights over it theoretically.
      *   **The Engineers (Direct Reference):** They care about **truth conditions**. Does Record A point to the same real-world object as Record B? If yes, merge them. The history of how the data arrived is irrelevant to the *identity* of the entity.
      *   **The Cataloguers (Fregeans):** They care about **cognitive significance** and auditability. Knowing *how* we know something (the provenance) is essential for managing the record. Merging them loses information about the source.
      *   **Diagnosis:** Your suspicion is correct. The philosophical dispute only "bites" when you demand a single, fundamental description of reality. In your work, you likely keep both: a unique Entity ID (for reference) and Provenance Metadata (for context).
      *   **The Philosophical Cost:** Philosophers struggle because they want to know which one is *Meaning*. Your work suggests the answer is: "Both are necessary for different functions." The stalemate exists because philosophers are trying to find one "true" ontology of meaning, whereas your work shows that a dual-system is practically superior.

  ### Part 3: Diagnosis of the Stalemate

  **Is the disagreement substantive, verbal, or two questions under one heading?**
  It is **two questions under one heading**.
  1.  **Question A:** What are the truth conditions of a sentence? (How does it hook to the world?)
  2.  **Question B:** What is the cognitive value of a sentence? (How does it inform a thinker?)

  The Direct Reference theorists answer Question A and claim it is the only one that matters for "Semantics." The Fregeans answer Question B and claim that without it, "Semantics" cannot explain language use. Because both camps use the word "Meaning" to cover both questions, they talk past each other.

  **Is there a hidden empirical question?**
  Yes. The dispute relies on assumptions about how human beings store and retrieve information (the "mental files" in Case 2). If psychology proved definitively that humans *cannot* store two separate files for one object without a linguistic cue, the Fregean view would gain ground. If psychology proved that linguistic meaning is processed in a module completely separate from belief storage, the Direct Reference view would gain ground. However, philosophy often treats these as conceptual truths, not empirical ones, which insulates them from data.

  **What would count as progress?**
  Progress would not be one side winning. It would be a **change of question**.
  *   **Bad Progress:** A new argument that convinces one side to surrender (unlikely after 50 years).
  *   **Good Progress:** A widely accepted distinction between *Semantic Content* (world-directed, for truth) and *Cognitive Content* (mind-directed, for reasoning). If both sides agreed that "Meaning" is an ambiguous term covering two different mechanisms, the fight would dissolve. They would stop asking "Which one is meaning?" and start asking "How do these two interact?"

  **Is there an argument that no progress should be expected?**
  Yes. The argument is that the dispute is **normative**, not descriptive. It is not about how language *does* work, but how we *ought* to theorize it. One side values logical purity (Direct Reference); the other values explanatory power for rationality (Fregean). These are value judgments about theory construction, not facts about the world. You cannot prove one value is "true."

  ### Part 4: Confidence and Limitations

  **Overall Confidence:**
  I am **85% confident** in this diagnosis. The structural analysis of the stalemate (two questions under one heading) is a standard metaphilosophical view held by many contemporary researchers who study the history of this debate. The interpretation of your three cases aligns with how professional philosophers typically analyze similar thought experiments.

  **The Claim I Am Least Sure Of:**
  I am least sure about the claim that **"The Direct Reference theorist fears that admitting Cognitive Content into semantics breaks compositionality."**
  *   *Why:* While this is a common argument, some Direct Reference theorists have developed complex ways to handle cognitive content without abandoning their core view. They might argue they can explain the cognitive difference without changing the semantics. I may be smoothing over internal disagreements within the Direct Reference camp to make the diagnosis clearer.

  **Where I Am Reconstructing Loosely:**
  1.  **Camp Uniformity:** I have treated "Fregeans" and "Direct Reference theorists" as monolithic blocks. In reality, there are many sub-versions of each view. Some Fregeans do not talk about "modes of presentation" in the mind, and some Direct Reference theorists allow for more psychological nuance. I have smoothed these over to highlight the core tension.
  2.  **The "Solution":** I suggested that distinguishing Semantic from Cognitive content is "Good Progress." Some philosophers argue this distinction is itself incoherent or impossible to draw sharply. I am presenting this as a resolution path because it fits your hypothesis, but it is not universally accepted as a final solution.
  3.  **Empirical Claims:** When I mentioned psychology proving how files are stored, I am extrapolating. Philosophy of language often resists empirical correction, claiming its questions are *a priori* (knowable without experience). I am suggesting empirical data *could* help, but I cannot guarantee the philosophers would accept it as relevant.

  **Summary for your work:**
  Your intuition from your day job is the most robust part of your analysis. The database engineers and cataloguers are both right for their specific purposes. The philosophical stalemate persists because it demands a single "true" purpose for language, whereas your work demonstrates that language, like metadata, serves multiple, distinct functions that require different tracking systems. The "nothing ever moves" feeling comes from trying to solve a multi-functional problem with a single-tool theory.
