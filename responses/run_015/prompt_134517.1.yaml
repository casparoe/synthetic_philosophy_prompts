answer: |-
  Right then, let's have a look at what Plutarch's actually up to here. You've spotted the crux of the matter perfectly. When Plutarch says he's painting a portrait rather than writing a history book, he's telling us he's not bothered much with the scorecard of battles or the size of empires. He's after the soul of the bloke. He reckons you can see who someone really is in a quiet moment or a off-hand remark, rather than just when they're leading an army.

  Now, regarding your puzzle about whether we're meant to copy these heroes or just judge them—it's a bit of both, but with a specific aim. Plutarch is a moral philosopher at heart. He isn't writing these lives so you can sit back and applaud like you're at the theatre. He wants you to get involved. The idea is that by seeing virtue and vice displayed clearly, your own moral compass gets calibrated. So, you judge the character in the book so that you can copy the good bits and avoid the bad bits in yourself.

  That modern split you mention, between acting to achieve a state versus acting to earn approval, is interesting. Plutarch wouldn't really recognise "earning approval" as a noble goal—that's just vanity, something he often criticises in his subjects. He's more about achieving a state of virtue (arete). So, reading to "copy-hero" is about achieving that internal state of excellence. Reading to "judge-character" isn't about earning social approval for being a good critic; it's about sharpening your own ability to discern what's actually good. Hagiography feels awkward there because it asks you to admire someone (which looks like seeking approval) but also to learn from them (which is goal-directed self-improvement). Plutarch wants you to emulate the virtue, not just worship the person.

