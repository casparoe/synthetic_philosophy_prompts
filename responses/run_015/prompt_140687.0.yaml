answer: |-
  ### Preamble

  This instrument sorts legislative staff by their operational logic, not their self-applied labels. It retains your three dials—**Intake** (who enters), **Duration** (how long), and **Conditions** (how hard)—because these are the statutory levers you actually pull. The instrument is sensitive to consistency in trade-offs between these dials (e.g., whether harshness can buy brevity) and insensitive to theoretical vocabulary. It exposes the hidden architecture behind the "tough/soft" dichotomy, revealing why a staffer might support humane prisons alongside preventive detention. The goal is predictive validity for bill drafting, not philosophical purity.

