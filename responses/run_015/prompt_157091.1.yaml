answer: |-
  # Joint Statement on the Metaphysics of Consciousness

  ### I. Agreed Claims

  1.  **Fundamental Phenomenality:** Experience is a fundamental feature of reality, not emergent from wholly non-experiential physical bases.
  2.  **Rejection of Brute Emergence:** The hypothesis that phenomenality emerges brute from non-phenomenality is false; the explanatory gap cannot be bridged by stipulation.
  3.  **Physical Underdetermination:** A complete physical description of a system does not, by itself, fix the number or identity of conscious subjects associated with it.
  4.  **Unity Datum:** The synchronic unity of a single experiential field (e.g., visual and auditory fields co-experienced) is a non-negotiable datum.
  5.  **Structural Invariance:** This unity appears independent of specific micro-level physical details, relying instead on structural or functional integration.
  6.  **Upward Challenge (Bonding):** Any upward story must articulate the relation (phenomenal bonding) binding micro-experiences.
  7.  **Upward Challenge (Quality):** Any upward story must explain how micro-qualities compose rich macro-qualities without resulting in a qualitative jumble.
  8.  **Upward Challenge (Subject):** Any upward story must explain how many micro-subjects yield one macro-subject rather than a collection.
  9.  **Downward Challenge (Decombination):** Any downward story must articulate the mechanism by which cosmic experience yields derivative subjects (decombination).
  10. **Downward Challenge (Boundaries):** Any downward story must explain why subject boundaries stop at organisms rather than cells, organs, or coupled groups.
  11. **Determinacy Standard:** A successful solution must deliver a determinate count of subjects for any specified physical system.
  12. **Non-Stipulation Standard:** Subject counts must follow from general principles, not case-by-case stipulation.

  ### II. Disagreements Table

  | Question | Micropsychist (MP) | Cosmopsychist (CP) | Type | Crux | Shared Evidence | MP Prediction | CP Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Grounding Direction** | Grounding runs upward: micro-experiences constitute macro-experience. | Grounding runs downward: cosmic experience grounds derivative aspects. | Substantive | Metaphysical priority of the whole vs. parts. | Unity of experience. | Micro-entities are ontologically prior. | Cosmos is ontologically prior. |
  | **Primitive Commitment** | Composition is primitive; we must explain how simples combine. | Decombination is primitive; we must explain how the whole divides. | Substantive | Ideological parsimony. | Complexity of brains. | Composition is intelligible. | Decombination is intelligible. |
  | **Subject Grain** | Subjects appear at the grain of fundamental physical entities. | Subjects appear at the grain of structural carve-outs within the cosmos. | Substantive | Why humans, not neurons? | Neural integration scales. | Subjects exist at micro-level. | Subjects exist only where structure permits aspectuation. |
  | **Overgeneration** | Risks too many subjects (every particle); must explain why some don't count. | Risks too few subjects (only Cosmos); must explain why aspects count as subjects. | Substantive | Parsimony of subjects. | Reported subject counts. | Many micro-subjects exist unreported. | Only structured aspects qualify as subjects. |
  | **Structure vs. Simplicity** | Micro-experiences must be simple enough to be fundamental. | Cosmic experience must be rich enough to contain human experience as aspect. | Verbal | Nature of "simplicity". | Richness of human experience. | Micro-experiences are proto-phenomenal. | Cosmic experience is fully determinate. |
  | **Physics Without Parts** | If physics has no parts, MP fails or requires reformulation to fields. | If physics has no parts, CP is favored; cosmos is the single entity. | Substantive | Ontology of fundamental physics. | Quantum field theory. | MP requires ontological revision. | CP accommodates holism naturally. |

  ### III. Pre-registered Predictions

  **1. The Graded-Bridge Case**
  *Scenario:* A neural interface links two humans, adjustable from zero to supracallosal bandwidth.
  *MP Prediction:* Subject count changes thresholdally. At high integration, micro-experiences bond to form a new subject. Refutation: If reports indicate a smooth transition of subjecthood without a threshold.
  *CP Prediction:* Subject count is stable or derivative. The cosmic subject manifests aspects; increased integration merely changes the structural carve-out. Refutation: If a distinct third subject reports existence independent of the original two.
  *Discriminability:* Both agree empirical reports alone may not settle metaphysics, but structural thresholds should correlate with subject boundaries.

  **2. The Final-Physics Case**
  *Scenario:* Completed physics either posits many independent entities or one holistic field.
  *MP Concession:* If physics is holistic (no parts), MP must abandon constitutive micropsychism for a variant panpsychism or accept failure.
  *CP Concession:* If physics is atomistic, CP must explain how holistic experience supervenes on disjoint parts without upward composition.
  *Discriminability:* High. MP is vulnerable to holism; CP is vulnerable to atomism.

  **3. The Structural Isomorphism Test (New)**
  *Scenario:* Two systems differ physically but share identical information integration structures (isomorphic).
  *MP Prediction:* Subject count may differ if micro-constituents differ, despite structural identity.
  *CP Prediction:* Subject count must be identical, as subjects are carved by structure, not constituent identity.
  *Refutation:* If MP finds subject count varies with structure alone, or CP finds it varies with constituent type.

  **Empirical Limit:** Both sides acknowledge that if no empirical finding discriminates the views, the matter must be settled by metaphysical parsimony and coherence with fundamental ontology.

  ### IV. Verbal-Dispute Audit and Diagnostics

  **Verbal Disputes**
  Several rows in the table contain verbal residues.
  *   **Grounding:** If "grounding" merely denotes dependence without ontological priority, the disagreement is verbal. *Residue:* Whether the cosmos exists over and above its aspects (CP) or whether subjects exist over and above micro-experiences (MP).
  *   **Subject Sense:** If "subject" means "locus of experience" for CP but "owner of experience" for MP, the disagreement is verbal. *Residue:* Whether derivative aspects possess genuine unity or merely apparent unity.
  *   **Part vs. Aspect:** If "aspect" is synonymous with "proper part" in this context, the disagreement is verbal. *Residue:* Whether the whole survives the removal of the aspect (CP says yes, MP says no).

  **Diagnostics**

  **1. The Census-Function Reformulation**
  *Question:* Can the dispute be recast as a dispute about which function assigns subjects to physical descriptions?
  *MP:* Accepts. The function maps micro-physical configurations to subject counts via composition rules.
  *CP:* Accepts. The function maps macro-physical structures to subject counts via aspectuation rules.
  *Report:* Both agree the physical description does not fix the assignment *without* their respective metaphysical principles. The dispute is over the function's definition, not the input.

  **2. The No-Arbitrary-Grain Principle**
  *Principle:* If subjects are associated with a level, either that level is fundamental or there is a principled reason why no intermediate level has subjects.
  *MP:* Accepts. The fundamental level is the grain. Macro-subjects exist only where bonding principles are met. *Cost:* Must explain why bonding stops at brains, not neurons.
  *CP:* Accepts. The fundamental level is the cosmos. Derivative subjects exist only where structural carve-outs are stable. *Cost:* Must explain why organisms are stable carve-outs but organs are not.
  *Report:* Both accept the principle but differ on the fundamental level. MP risks arbitrary stopping points upward; CP risks arbitrary stopping points downward. Both acknowledge this cost must be paid by their respective theories of bonding or decombination.

  **Conclusion**
  Both signatories affirm that while the direction of grounding remains disputed, the constraints above define the space of viable solutions. Neither view permits brute emergence, and both must solve the boundary problem to succeed.
