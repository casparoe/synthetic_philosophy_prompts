answer: |-
  # REGIONAL PLANNING AUTHORITY: PANEL SELECTION PROTOCOL
  **Owner:** Selection Officer
  **Turnaround:** 48 Hours Max
  **Review Cycle:** Quarterly

  ## PART 1: THE TRIAGE FLOW
  Run every request through these five gates in order. If you hit a **HARD NO**, stop and move to the indicated alternative. If you pass all five, default to the **HYBRID MODEL**.

  ### GATE 1: THE URGENCY TEST
  **Question:** Is there an immediate threat to life, safety, or critical infrastructure that requires action within 7 days?
  *   **Enough Answer:** A written declaration from the Emergency Management Director or Chief Engineer citing specific risk of failure/loss.
  *   **HARD NO:** If YES. Sortition takes too long (audit + orientation).
  *   **Action:** Switch to **EXPERT APPOINTMENT**.
  *   **Values Call Alert:** Defining "immediate." You can stretch this to bypass the hybrid model if you hate the pool.

  ### GATE 2: THE TECHNICAL FLOOR
  **Question:** Does the role require a specific professional license (PE, MD, JD) or specialized knowledge held by less than 5% of the voter roll?
  *   **Enough Answer:** Job description explicitly lists licensure as a legal requirement for sign-off.
  *   **HARD NO:** If YES. A random citizen cannot legally sign off on structural integrity or medical hazard assessments.
  *   **Action:** Switch to **EXPERT APPOINTMENT**.
  *   **Values Call Alert:** Determining if "knowledge" is truly specialized or just "complicated." Don't use this to gatekeep complex policy issues that citizens *should* understand.

  ### GATE 3: THE ACCOUNTABILITY MANDATE
  **Question:** Does this body have the power to levy taxes, change criminal codes, or alter zoning maps permanently?
  *   **Enough Answer:** Legal counsel confirms the body's output has binding legislative force.
  *   **HARD NO:** If YES. Random citizens cannot be voted out if they raise taxes.
  *   **Action:** Switch to **PURE ELECTION** (or appointed officials confirmed by elected body).
  *   **Values Call Alert:** Distinguishing between "recommendation" and "binding decision." Often, boards recommend, but the political heat treats it as binding.

  ### GATE 4: THE POOL VIABILITY CHECK
  **Question:** Is the eligible voter pool large enough to yield 10 viable candidates after the Reasonableness Audit?
  *   **Enough Answer:** Demographic data shows sufficient density of eligible voters in the relevant geography.
  *   **HARD NO:** If NO. (e.g., The "Flood-Wall" scenario where only 3 engineers exist and 2 refuse).
  *   **Action:** Switch to **EXPERT APPOINTMENT**.
  *   **Values Call Alert:** Defining "viable." If you set the Reasonableness Audit bar too high, you manufacture a pool failure to force an appointment.

  ### GATE 5: THE CONFLICT FILTER
  **Question:** Is the issue hyper-local (single block/property) where a regional lottery creates a mismatch of stake?
  *   **Enough Answer:** Geographic impact is confined to <1% of the regional population.
  *   **HARD NO:** If YES. A random regional draw will likely pick people with no stake, leading to apathy or outsider interference.
  *   **Action:** Switch to **EXPERT APPOINTMENT** (for rules compliance) OR **STAKEHOLDER ELECTION** (if available).
  *   **Values Call Alert:** Deciding what counts as "regional" vs. "local."

  ---

  ## PART 2: THE "VALUES CALL" DISCLOSURE
  *You asked where you are dressing up preference as process. Here it is. Acknowledge these before signing off.*

  1.  **The Reasonableness Audit:** This is the black box. There is no objective metric for "reasonable."
      *   *Risk:* You (or the mediator) are filtering out ideological extremes. This protects stability but biases toward the status quo.
      *   *Mitigation:* Log every rejection reason. If >20% of a demographic is rejected, pause and review the mediator.
  2.  **The Dissent Escrow:** This is a pressure valve, not a power.
      *   *Risk:* It gives the illusion of influence to rejected candidates without giving them actual leverage.
      *   *Mitigation:* Ensure escrow filings are publicly timestamped and acknowledged in the final report.
  3.  **The Emergency Definition:** You control the clock.
      *   *Risk:* Declaring an "emergency" lets you skip the Hybrid model when you just want a faster, quieter decision.
      *   *Mitigation:* Require a second signature on Emergency declarations.

  ---

  ## PART 3: CASE APPLICATIONS

  ### CASE 1: Regional Air-Quality Panel
  *   **Context:** Long-term monitoring, policy recommendations, public health impact.
  *   **Triage:**
      *   Gate 1 (Urgency): No. (Chronic issue, not acute).
      *   Gate 2 (Technical): Partial. Science is complex, but policy trade-offs are not.
      *   Gate 3 (Accountability): No. (Advisory to the elected council).
      *   Gate 4 (Pool): Yes. Large regional pool.
      *   Gate 5 (Conflict): No. Regional impact.
  *   **Decision:** **HYBRID MODEL.**
  *   **Why:** You need public trust (sortition) but need to filter for those who accept basic scientific consensus (audit). The Dissent Escrow handles the "industry shill" or "radical activist" who gets filtered out.
  *   **Caveat:** Ensure the "Reasonableness Audit" doesn't just become "Do they agree with current industry standards?"

  ### CASE 2: Single-Block Historic Preservation Dispute
  *   **Context:** One owner wants to demo a facade; neighbors object.
  *   **Triage:**
      *   Gate 1 (Urgency): No.
      *   Gate 2 (Technical): Low. (Aesthetics/History rules).
      *   Gate 3 (Accountability): No. (Administrative ruling).
      *   Gate 4 (Pool): **FAIL.** A regional lottery will pick people who don't live there.
      *   Gate 5 (Conflict): **HARD NO.** Hyper-local.
  *   **Decision:** **EXPERT APPOINTMENT.**
  *   **Why:** A regional lottery is illegitimate here. A local election is too expensive/slow for one block. You need a Preservation Officer to apply the code.
  *   **Caveat:** This feels undemocratic to the neighbors. Use the Dissent Escrow to let the neighbors file a formal objection record if the Officer rules against them.

  ### CASE 3: Emergency Flood-Wall (The Mara Scenario)
  *   **Context:** Imminent flood risk. Lottery pool yielded 3 engineers. 2 refused service. 1 remains.
  *   **Triage:**
      *   Gate 1 (Urgency): **HARD NO.** (Immediate threat).
      *   Gate 2 (Technical): **HARD NO.** (Requires PE license).
      *   Gate 4 (Pool): **HARD NO.** (Pool exhaustion: 1 candidate is not a panel).
  *   **Decision:** **EXPERT APPOINTMENT.**
  *   **Why:** I know this annoys you because it validates your argument with Mara, but the procedure forces this. You cannot lottery a life-safety decision when the math doesn't work. One engineer cannot form a quorum; two refusing means the sortition mechanism is broken for this specific task.
  *   **The Hard Truth:** In this specific instance, Mara is wrong. Sortition relies on statistical abundance. When expertise is scarce and time is zero, the lottery is a liability.
  *   **Mitigation:** Appoint the one willing engineer + a non-voting citizen observer from the Dissent Escrow pool to witness the decision-making. This keeps a sliver of oversight without compromising safety.

  ---

  ## PART 4: WHAT THIS PROCEDURE CANNOT DO
  *Be honest with yourself when you tape this up.*

  1.  **It Cannot Fix Apathy:** If the random citizens drawn don't show up, the Hybrid model stalls. The procedure assumes a baseline civic duty that may not exist.
  2.  **It Cannot Neutralize Power:** The Reasonableness Audit is run by an outside mediator. If that mediator is captured by special interests, the Hybrid model becomes a rubber stamp. The procedure trusts the mediator; it does not audit them.
  3.  **It Cannot Solve Scarcity:** As seen in the Flood-Wall case, if the expertise doesn't exist in the population, no amount of process magic will create it. You will be forced into Appointment, and it will feel like a failure of the system even when it's the only safe option.
  4.  **It Cannot Protect You:** If a Hybrid Panel makes a popular but disastrous decision, you (the Selection Officer) still signed off on the panel composition. You are the lightning rod.

  **Final Instruction:** If you find yourself forcing a case through the Hybrid Model that hits a HARD NO, document *why* you overrode the gate. If you do it twice in a quarter, trigger a self-audit. You are likely optimizing for comfort, not governance.
