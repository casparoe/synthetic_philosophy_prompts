  *   **Marcus:** Counters with the energy conservation example. It's in the instruments, not just heads.
  *   **Elena:** But who doubts it? The individual physicist. If they don't doubt, it's a hinge. If they do, it's a hypothesis.
  *   **Marcus:** The *community* doubts via the instrument design.
  *   **Elena:** Regress argument. If you revise the hinge, what ground do you stand on?
  *   **Marcus:** The ground is the rest of the practice, which is also fallible but stable enough. Coherentism vs. Foundationalism.
  *   **Elena:** That's not Wittgenstein. Wittgenstein is about the limits of justification.
  *   **Marcus:** Wittgenstein was looking at "I have two hands." Science is "This calorimeter works."
  *   **Elena:** Concedes the difference but worries about the loss of "certainty."
  *   **Marcus:** Certainty is functional, not mental.

  *Let's write.*
answer: |-
  **Elena:** Let us press directly on the tension you introduced. You propose that the conservation of energy, once a bedrock certainty for the classical physicist, has become a defeasible modeling assumption in the context of open quantum systems. You call this a "distributed hinge revision." I worry this phrase conceals a category mistake. For Wittgenstein, a hinge proposition is not merely a belief we hold strongly; it is the logical scaffolding that makes doubt intelligible. If I doubt whether energy is conserved, I must already rely on other certainties—causal continuity, the reliability of my instruments, the coherence of mathematics. If the conservation principle itself becomes an object of empirical testing, it ceases to be a hinge and becomes a hypothesis. You cannot have it both ways.

  **Marcus:** But that is precisely the point of the distributed account. In a research tradition, the "scaffolding" is not located in the individual psychologist's mind; it is embedded in the calibration of the apparatus. When a quantum thermodynamicist designs an experiment involving a system coupled to a reservoir, the conservation of energy is not treated as a metaphysical absolute. It is treated as a boundary condition. If the model fails to predict decoherence rates, the assumption of conservation across that specific boundary is what gets adjusted, not the auxiliary hypotheses. The "doubt" is enacted by the instrumentation itself. The lab notebook records the failure of the hinge, not just a hypothesis derived from it.

  **Elena:** You are describing a shift in theoretical parameters, which is standard scientific practice. But to call it hinge revision is to dilute the concept until it loses its explanatory power. If a proposition can be rationally displaced because it yields poor predictive results, it was never a hinge to begin begin with; it was a high-level empirical generalization. A genuine hinge, like "the earth has existed for many years," is not abandoned because it fails a prediction. It is abandoned, if ever, through a gradual erosion of the form of life. To suggest a research group can vote, or calculate, their way out of a hinge commitment implies there is a deeper, more fundamental hinge underwriting that calculation. What grounds the decision to treat energy conservation as defeasible?

  **Marcus:** The ground is the pragmatic success of the broader research program. You ask what underwrites the calculation. I answer: the rest of the practice. This is not a foundationalist bedrock, Elena; it is a network of norms. When the classical definition of isolated systems became untenable due to the inescapability of environmental coupling in quantum computing, the community didn't retreat to a pre-rational certainty. They altered the normative status of the conservation law. They moved it from the "unmoving riverbed" to the "flowing water." If hinges are defined by their function, and the function of the energy principle changed from constitutive rule to adjustable parameter, then the hinge moved. Why must the location of certainty be immune to the very practices that sustain it?

  **Elena:** Because if the riverbed moves, it is not because the water decided to move it through rational argument. It is because of a cataclysm. Wittgenstein distinguishes between the movement of the water and the shifting of the bed. You are conflating the two. When the physicist adjusts the energy boundary, they are still operating within a deeper hinge: perhaps the reliability of mathematical consistency, or the intelligibility of nature. If you claim the collective can rationally revise a hinge, you invite an infinite regress. If the conservation principle is revisable, what principle justifies the revision? If that principle is also revisable, you have no ground. If it is not revisable, then *that* is the true hinge, and you have merely mistaken a lower-level norm for the foundation.

  **Marcus:** I reject the regress worry because it assumes a foundationalist architecture that distributed epistemology denies. We do not need an unmoving point to move the world; we need leverage. In the laboratory, leverage is provided by the interlocking stability of other practices. Consider the individual agent you defend. You say their hinges are pre-rational. But a physicist does not learn conservation of energy in a vacuum. They learn it through training with instruments that presuppose it. If the instruments change—if the calorimeter is replaced by a qubit interferometer—the "pre-rational" certainty of the individual must shift to match the new normative constraints of the tool. If the hinge is truly individual and pre-rational, how do you account for the synchronization of certainty across a community? Why do all physicists abandon the classical hinge at roughly the same time?

  **Elena:** They abandon it because the language game has changed. But notice: the individual physicist does not experience this as a rational revision of a certainty. They experience it as learning a new way of speaking. The senior professor does not convince the graduate student by proving the old hinge false; they initiate them into a practice where the old question no longer arises. This supports my view. The shift is not rational revision; it is conversion. You are describing a sociological change in what counts as a sensible question. I am describing the logical condition of asking the question. If you treat the hinge as a communal norm subject to pragmatic optimization, you turn epistemology into engineering. You lose the distinction between being *wrong* and being *nonsensical*.

  **Marcus:** But in high-energy physics, the distinction between wrong and nonsensical is often determined by instrumentation limits. If I claim energy is not conserved in a closed system, I am nonsensical. If I claim it is not conserved in an open quantum system under specific Hamiltonian constraints, I am making a substantive claim. The "nonsense" boundary has moved. My argument is that Wittgenstein's individualist framework cannot capture this because it lacks the resources to describe norms that exist *between* agents. A calibration standard is not in my head. It is in the protocol. If the protocol changes, the certainty changes. To insist that the hinge must remain in the individual mind is to ignore that the individual's cognitive stability is parasitic on the stability of the collective infrastructure. If the NIST standards shift, my "pre-rational" certainty shifts with them, whether I will it or not.

  **Elena:** I grant that the *content* of our certainties is socially mediated. But the *status* of the hinge is logical, not sociological. You argue that because the standard shifts, the hinge was never a true hinge. I argue that at any given moment *t*, for the practice to function, there must be propositions that are exempt from doubt. In 1900, energy conservation was exempt. In 2000, in your specific sub-field, it is not. But in 2000, something else is. Perhaps it is the unitarity of time evolution. You have not shown that hinges are revisable; you have only shown that what *counts* as a hinge is historical. This is compatible with orthodoxy. The mistake is to think that because the riverbed shifts over centuries, it is fluid like the water during the experiment.

  **Marcus:** That historical fluidity is exactly what threatens the orthodox view when applied to science. If the riverbed shifts, it is because the water eroded it. The "erosion" is the accumulation of pragmatic failures in the measurement practices. You say at moment *t* there must be exempt propositions. I say at moment *t*, the community is actively negotiating which propositions are exempt, and that negotiation is driven by empirical friction. In the case of open quantum systems, the "exemption" of energy conservation was lifted *because* it blocked progress. It was a rational decision, grounded in the failure of the old framework to accommodate new phenomena. If you call this "conversion" or "erosion," you are using metaphors to hide the rational agency of the collective. They chose to demote the certainty.

  **Elena:** They chose to demote it only because they had already accepted a new set of certainties that made the demotion intelligible. You cannot step outside the system of hinges to revise the system. If they used empirical failure to revise the conservation principle, they must have held fast to the reliability of the empirical data that showed the failure. That reliability is the new hinge. You are merely pointing to a rotation of hinges, not a suspension of the hinge mechanism. My concern is that your "distributed revisionism" suggests we can hold all our certainties up to the light simultaneously. We cannot. Someone must hold the ladder. In your collective, who holds the ladder?

  **Marcus:** The ladder is held by the redundancy of the network. No single proposition is immune, but the network as a whole provides the stability. We don't need one proposition to hold fast; we need enough of them to hold fast *together*. This is a coherentist adaptation of the hinge metaphor. In the shift from classical to quantum thermodynamics, the community didn't swap one absolute for another. They accepted a decrease in certainty regarding energy in exchange for an increase in explanatory scope. This trade-off is rational. It is calculable. If Wittgenstein's framework cannot accommodate a trade-off where a former certainty becomes a variable, then the framework is too rigid for modern scientific practice. It treats science like a static language game, rather than a dynamic engine of discovery.

  **Elena:** But if the trade-off is calculable, it is not a hinge shift; it is an optimization within a fixed utility function. What fixes the utility function? Why is explanatory scope valued over ontological certainty? That valuation is the real hinge. You have pushed the hinge back one step, from "Energy is Conserved" to "Maximize Explanatory Scope." You claim this is distributed. I claim it is still a form of life that stands fast for the individuals involved. If a physicist refused to value explanatory scope, we would not say they are rationally revising hinges; we would say they are no longer doing physics. The boundary of the practice remains rigid, even if the internal propositions move.

  **Marcus:** I agree the boundary is rigid, but the boundary is drawn by participation, not by logic. And participation is mutable. My point is that by locating the hinge in the "form of life" or the "individual's scaffolding," you render it invisible to analysis. You make it mystical. By locating it in the calibration protocols and the modeling assumptions, I make it visible. I can show you the paper where the assumption was relaxed. I can show you the instrument where the correction was applied. If philosophy of science is to understand how certainties sustain research, it must look where the certainty is actually operationalized. It is operationalized in the distributed system. If that system revises the certainty, then the hinge has been revised. To say "no, the real hinge is the desire to do physics" is to retreat into a psychological truism that explains nothing about the specific epistemic history of energy conservation.

  **Elena:** It is not a psychological truism; it is a logical point about justification. You can show me the paper where the assumption was relaxed, but you cannot show me the justification for the paper's authority without appealing to further norms. We are circling the same drain, Marcus. You want to say the collective rationality drives the change. I say the collective rationality is only possible because some things remain unquestioned during the change. We differ on whether those unquestioned things can be the very same things that were questioned yesterday. I say no; the subject of the inquiry must shift. You say the object itself changes status.

  **Marcus:** And I say that if the object changes status—from certainty to hypothesis—then for all functional purposes, the hinge has been revised. The "logical point" you defend risks making the hinge a metaphysical ghost that never actually interacts with the science. If the status changes, the epistemology must account for that change. If your framework says "that wasn't a real hinge," then your framework is failing to describe the phenomenon I am pointing at. I am pointing at the mechanism of scientific progress. You are guarding the definition of a word.

  **Elena:** I am guarding the condition of possibility for meaning. If everything is a hypothesis, nothing is. If energy conservation is a hypothesis, what are we measuring the deviation against? You say "other norms." But those norms must function as hinges. So we agree there are hinges. We disagree on whether they are portable. I maintain they are anchored in the agent's capacity to doubt. You maintain they are anchored in the lab's capacity to function. Perhaps the impasse is simply this: you see the lab as the epistemic agent. I see the lab as the context in which human agents exercise their epistemic agency.

  **Marcus:** Then let us test that. If the lab is merely context, then when the lab's protocols change, the agent's hinges should remain stable until the agent is convinced. But we see the hinges shift *with* the protocols, often before the individual fully grasps the theoretical implication. The instrument dictates the certainty before the philosopher justifies it. The distributed view captures this temporal priority. The orthodox view assumes the certainty is already there, waiting to be expressed. In modern physics, the certainty is manufactured by the practice.

  **Elena:** Manufactured, perhaps. But not justified by it. The manufacture creates the condition for a new language game. It does not justify the move from the old one. That move remains, as Wittgenstein said, a groundless spinning of the wheel. I will concede this: if you define "hinge" as "functional norm within a practice," then yes, they are distributed and revisable. But then you have left Wittgenstein behind. You are doing pragmatism.

  **Marcus:** And I will concede this: if you define "hinge" as "logically immune to doubt," then yes, they cannot be revised without collapsing the system. But then you have left science behind. You are doing logic. The question is whether we can build a bridge between the two.

  **Elena:** Then we agree on the task, if not the blueprint. The case of energy conservation shows that what functions as a hinge is historically contingent. Whether that contingency implies rational revisability or merely historical succession... that remains the open question.

  **Marcus:** And until we resolve it, the riverbed continues to shift, regardless of where we locate the water.
