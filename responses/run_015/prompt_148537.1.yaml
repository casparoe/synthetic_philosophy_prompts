answer: |-
  1. Conceptual framing

  "Contractual conversion" denotes a gradual transformation of economic relations through voluntary agreements, where workers and capitalists negotiate new ownership structures without state coercion. It presupposes the legitimacy of existing property rights while allowing them to be renegotiated via market mechanisms and cooperative contracting. This approach relies on the freedom of individuals to associate and alter their economic relationships through mutual consent. Conversely, "structural expropriation" implies the abolition of private capital ownership as a mandatory precondition for justice, typically enforced by state power regardless of individual consent. This method treats private property as an inherent injustice that must be eradicated through legislative force. Mill's late writings align squarely with contractual conversion because his liberal framework prioritizes individual liberty and voluntary association over coercive redistribution. He views property rights as instrumental rather than sacred, permissible to change only through free choice and demonstrated utility. Thus, he endorses the evolution of capitalism into socialism through persuasion, example, and market competition, firmly rejecting structural expropriation as a violation of the harm principle and a significant impediment to moral development and personal security. For Mill, the method of change determines its moral legitimacy.

  2. Mill's arguments

  In his later years, particularly in the posthumously published essays, Mill argued that the wage system was not a permanent fixture of human society but a historical stage destined to be superseded by cooperative production. He envisioned a future society where workers collectively owned the capital they utilized, sharing profits and management responsibilities equally. However, he insisted this transition must emerge from free competition and voluntary initiative, not legislative mandate. Mill maintained that competition remained essential during the transition period to ensure efficiency and prevent stagnation within emerging cooperatives. He believed that if cooperatives proved superior in productivity and morale, they would naturally outcompete traditional capitalist firms over time. Furthermore, his concept of the "stationary state" was not an economic deadlock but a moral opportunity. Once capital accumulation ceased to be the primary societal goal, humanity could focus on distributive justice and character improvement. Mill believed the state's role was limited to removing legal barriers to association and ensuring fair play, not seizing assets or mandating profit-sharing. The transformation depended on the moral and intellectual education of the working class, enabling them to manage industry themselves rather than relying on state benevolence or revolutionary seizure. He saw this as the only path compatible with human freedom. He argued that the separation of owners and workers created conflicting interests, whereas cooperation aligned them. This alignment was necessary for true social justice, but it had to be won through merit, not force. He warned that removing competition prematurely could lead to inefficiency, so the market must validate the cooperative model.

  3. The crux

  The conceptual instability arises when successful contractual conversion functionally mimics structural expropriation. If worker cooperatives become the dominant economic form through voluntary means, private capital ownership may effectively vanish, raising the question of whether the outcome is indistinguishable from expropriation. The tension sharpens regarding the transition itself: can workers realistically buy out capital without state assistance that amounts to redistributive taxation? If the state subsidizes cooperatives to level the playing field, does this violate the prohibition against structural expropriation? Moreover, if private capital becomes economically nonviable due to the superior efficiency of cooperatives, is the individual liberty to own productive assets preserved in any meaningful sense? Mill's commitment to liberty risks collapse if the economic structure coerces individuals into association by making private ownership impractical or socially obsolete. This blurs the line between voluntary conversion and structural necessity. The boundary becomes unstable where market forces, perhaps nudged by state policy, make the old property relations impossible to sustain, effectively expropriating capitalists through economic pressure rather than legal decree, challenging Mill's distinction between free choice and structural compulsion.

  4. Assessment within Mill's framework

  Within Mill's utilitarian and liberal framework, this tension is theoretically resolvable but practically ambiguous. Mill treats property rights as subordinate to general utility and individual development. If private capital hinders human flourishing, modifying its status is justified, provided it does not violate security expectations arbitrarily. Therefore, contractual conversion fits his utilitarianism if it maximizes happiness and autonomy. However, the ambiguity lies in the state's facilitative role. Mill allows state intervention to educate and enable cooperation, but the boundary between enabling and coercing is porous. If the state actively disadvantages private capital to promote cooperatives, it edges toward structural expropriation. Ultimately, Mill resolves this by prioritizing the *process* of moral education over the *outcome* of ownership. As long as the transition cultivates individual autonomy, the erosion of private capital is acceptable. Yet, this leaves an unresolved ambiguity regarding the specific limits of state economic engineering. Mill wants the benefits of socialism without the tyranny of communism, but his framework struggles to define how much state support is permissible before voluntary conversion becomes state-managed structural change.

  5. Bottom line

  Mill's late socialism commits him to a liberal vision where socialist ends are achieved through liberal means. He advocates for the voluntary dissolution of the wage system via education and competition, rejecting revolutionary confiscation. The distinction between contractual conversion and structural expropriation clarifies his position by separating his economic goals from his political methods. It highlights that Mill sought a change in social relations, not merely a transfer of asset titles. Ultimately, he prioritizes the moral development of individuals over the rigid protection of existing property arrangements.
