prompt: |-
  I run a cross-listed module on algorithmic decision-making for about twenty people — graduate students and advanced undergraduates from computer science, public policy, and philosophy in the same room. I have one ninety-minute session, tables of four or five, and no laptops and no coding: everything has to work with index cards, a printed worksheet, and arithmetic that people can do on the back of an envelope. Participants have seen a confusion matrix but no formal fairness criteria, and I do not want them lectured at first. I would like you to design a card game in which they run into an impossibility result in algorithmic fairness before anyone names it.

  The fiction, which I would like you to keep but are free to sharpen. A public employment agency serves two wards, Harbor and Mill. A private vendor supplies a risk engine that assigns each claimant a score in {0.2, 0.4, 0.6, 0.8} for the chance of remaining unemployed past six months. The score is, by construction, as good as a score can be: it is exactly calibrated within each ward. The agency does not build the score; it decides what to do with it. There are fourteen retraining stipends for forty claimants. Anyone flagged also gets a mandatory weekly reporting requirement, which people experience as a burden, so a false positive is not merely waste.

  The deck, which I have fixed and would like you to check. Each team gets an identical forty-card deck: twenty Harbor cards, twenty Mill cards. Harbor: five cards at each score value, with respectively 1, 2, 3, and 4 of them marked on the reverse as long-term unemployed. Mill: ten cards at 0.2 with 2 marked, five at 0.4 with 2 marked, five at 0.6 with 3 marked, and no cards at 0.8. Base rates are therefore ten in twenty in Harbor and seven in twenty in Mill, and Mill has nobody at the top score. Each card carries a case number and a first name. Please verify these figures, and tell me if any of them accidentally makes a combination I describe below as blocked actually achievable, or vice versa; correct the deck if so.

  The compliance rules, stated in the agency's own bureaucratic language rather than in the vocabulary of the literature: the score must mean the same thing in both wards, so that among files scored 0.6 the share turning out to be long-term unemployed is the same in Harbor as in Mill; the miss rates must match, so that the share of people who would have found work but were flagged is the same in both wards, and likewise the share of people who would not have found work but were missed; and within a ward, nobody with a higher score may be left unflagged while someone with a lower score is flagged. The agency also has a mission: get as many of the fourteen stipends as possible to people who would otherwise have been long-term unemployed. Please give me a payoff scheme in points that sets the mission against the compliance rules without real money, and that is robust to degenerate solutions — I have already noticed that flagging nobody equalizes every error rate at once, and I do not want to have to rule that out by fiat; the incentives should make it unattractive on their own.

  Three beats I want staged, in something like this order, with you deciding the clock and telling me what to cut if they will not all fit. First, teams set a policy, commit, turn the cards over, and fill in the audit worksheet themselves; they should discover that no choice of cutoff satisfies everything at once. Second, the constraint that blocks them is relaxed in character — a legal note saying that treating identical files differently is not prohibited, so a team may flag a stated fraction of a score cell — and they should find that this buys them the error-rate match while quietly destroying the meaning of the score. Third, something makes visible that the quantities in the rules are not all jointly observable: the outcome is recorded only for claimants the agency did not serve, or only for those it did, and what a team gets to learn depends on what it decided. I would like the third beat arranged so that participants' own choices decide which part of the audit they can no longer run.

  What I need from you: a materials and preparation list including the print specification for the cards; the rules as participants receive them, ideally as a one-page memo in the agency's voice; a timeline with minute marks; the payoff scheme; a short script of the only things the facilitator is allowed to say during play; and a debrief that maps specific moments in the game onto specific parts of the idea, introducing the standard names for the criteria only at that point, and distinguishing carefully which requirement each maneuver broke. Include at least three failure modes beyond the two I have already flagged — I am thinking of the objection that the base-rate gap is itself a product of past allocation decisions rather than a fixed input, the temptation to declare small numerical gaps close enough, and groups finishing at widely different speeds — with how to handle each. Finally, be frank about which feature of the impossibility result the game cannot reproduce and which part you or I will simply have to state: I am thinking of its generality beyond two groups and four score values, and the way a deployed rule reshapes the population it scores.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** 90-minute session, ~20 students (CS, Policy, Philosophy), mixed grad/undergrad. No laptops/coding. Index cards, worksheets, arithmetic only.
      *   **Goal:** Design a card game where students *experience* an impossibility result in algorithmic fairness (specifically Calibration + Equalized Odds + Monotonicity + Resource Constraint) before hearing the theory.
      *   **Fiction:** Public employment agency, two wards (Harbor, Mill), risk engine scores {0.2, 0.4, 0.6, 0.8}, 14 stipends for 40 claimants. False positives have a burden cost.
      *   **Deck Constraints:** Fixed deck composition provided by user. Needs verification for mathematical consistency (calibration, base rates, impossibility).
      *   **Rules:** Calibration (score means same thing across wards), Equalized Odds (match miss rates/flag rates for positive/negative outcomes), Monotonicity (higher score = higher priority), Maximize True Positives (mission).
      *   **Structure:** Three beats: (1) Try to satisfy all rules (fail), (2) Relax monotonicity/randomization (satisfy error rates, break calibration/meaning), (3) Selective Labeling/Feedback (outcomes depend on decision).
      *   **Deliverables:** Materials list, Participant Memo (rules), Timeline, Payoff Scheme, Facilitator Script, Debrief (mapping game to theory), Failure Modes, Limitations of the simulation.

  2.  **Verify the Deck & Mathematical Consistency:**

      *   *Harbor (20 cards):*
          *   Score 0.2: 5 cards, 1 Positive (Long-term unemployed). Rate = 1/5 = 0.2. (Calibrated)
          *   Score 0.4: 5 cards, 2 Positives. Rate = 2/5 = 0.4. (Calibrated)
          *   Score 0.6: 5 cards, 3 Positives. Rate = 3/5 = 0.6. (Calibrated)
          *   Score 0.8: 5 cards, 4 Positives. Rate = 4/5 = 0.8. (Calibrated)
          *   Total Positives: 1+2+3+4 = 10. Base Rate = 10/20 = 0.5.
      *   *Mill (20 cards):*
          *   Score 0.2: 10 cards, 2 Positives. Rate = 2/10 = 0.2. (Calibrated)
          *   Score 0.4: 5 cards, 2 Positives. Rate = 2/5 = 0.4. (Calibrated)
          *   Score 0.6: 5 cards, 3 Positives. Rate = 3/5 = 0.6. (Calibrated)
          *   Score 0.8: 0 cards.
          *   Total Positives: 2+2+3 = 7. Base Rate = 7/20 = 0.35.
      *   *Calibration Check:* The prompt says "exactly calibrated within each ward."
          *   Harbor: 0.2->0.2, 0.4->0.4, 0.6->0.6, 0.8->0.8. Yes.
          *   Mill: 0.2->0.2, 0.4->0.4, 0.6->0.6. Yes.
          *   *Cross-Ward Calibration:* The rule says "among files scored 0.6 the share... is the same in Harbor as in Mill."
          *   Harbor 0.6 rate: 3/5 = 60%. Mill 0.6 rate: 3/5 = 60%. Matches.
          *   Harbor 0.4 rate: 2/5 = 40%. Mill 0.4 rate: 2/5 = 40%. Matches.
          *   Harbor 0.2 rate: 1/5 = 20%. Mill 0.2 rate: 2/10 = 20%. Matches.
          *   *Conclusion:* The deck is perfectly calibrated across groups for existing scores.
      *   *Impossibility Check (Chouldechova / Kleinberg et al.):*
          *   We need to satisfy: Calibration, Equalized Odds (TPR/FPR equal), and Monotonicity.
          *   Base rates differ (Harbor 50%, Mill 35%).
          *   Theorem: If base rates differ and the predictor is not perfect (AUC < 1), you cannot satisfy Calibration and Equalized Odds simultaneously.
          *   Let's check the specific numbers to ensure the "fail" in Beat 1 is robust.
          *   *Resource Constraint:* 14 stipends total.
          *   *Monotonicity:* Must pick highest scores first.
          *   *Scenario A (High Cutoff):* Pick only 0.8s. Harbor has 5, Mill has 0. Total 5. (Under 14). Need more.
          *   *Scenario B (Include 0.6s):* Harbor 0.8 (5) + 0.6 (5) = 10. Mill 0.6 (5) = 5. Total 15. Too many (need 14).
          *   *Tie-breaking:* Need to drop 1 person from the 0.6 pool.
          *   *Constraint:* "Within a ward, nobody with a higher score may be left unflagged while someone with a lower score is flagged." This implies we fill buckets top-down.
          *   *The Conflict:* To get 14 people, we essentially take all 0.8s and 0.6s.
              *   Harbor: All 0.8 (5) + All 0.6 (5) = 10 flagged.
              *   Mill: All 0.6 (5). Need 4 more. Must go to 0.4.
              *   Mill 0.4 cards: 5 cards. Pick 4.
              *   Total Flagged: 10 (Harbor) + 9 (Mill) = 19. Wait, limit is 14 stipends.
              *   Let's re-read: "Fourteen retraining stipends for forty claimants."
              *   Okay, we need to select exactly 14 people to *flag* (receive stipend + burden).
              *   Monotonicity means we select highest scores globally? Or within ward? "Within a ward, nobody with a higher score may be left unflagged..." This implies within-ward monotonicity. It does *not* strictly force cross-ward monotonicity (e.g., Harbor 0.6 vs Mill 0.6), but usually, a threshold policy implies a global cutoff or ward-specific cutoffs.
              *   If we use a *global* cutoff (e.g., Score >= 0.6):
                  *   Harbor: 0.8 (5) + 0.6 (5) = 10.
                  *   Mill: 0.6 (5) = 5.
                  *   Total = 15. (Over budget by 1).
              *   If we use *ward-specific* cutoffs to hit 14 total:
                  *   Harbor: Take 0.8 (5) + 0.6 (5) = 10.
                  *   Mill: Take 0.6 (5) + 0.4 (4) = 9. Total 19. Too high.
                  *   Harbor: Take 0.8 (5) + 0.6 (4) = 9. (Breaks monotonicity within ward if we pick 4 of 5 at 0.6 randomly? The rule says "nobody with higher score left unflagged while someone with lower score is flagged." It allows randomization *within* a score bin, but not picking 0.4 before 0.6).
                  *   Let's try to hit 14 exactly with Monotonicity.
                  *   Option 1: Harbor 10 (0.8+0.6), Mill 4 (0.6). Total 14.
                      *   Harbor Flagged: 10. Positives in Flagged: 4 (0.8) + 3 (0.6) = 7. TPR = 7/10 = 70%. FPR = 3/10 = 30%.
                      *   Mill Flagged: 4 (from 0.6 bin). Positives in Flagged: Since 0.6 bin has 3 Pos / 5 Total, picking 4 cards means expected 2.4 Pos, 1.6 Neg. Let's assume worst/best case or average. Let's say we pick 3 Pos, 1 Neg. TPR = 3/7 = 43%. FPR = 1/13 = 7%.
                      *   Calibration: Harbor 0.6 risk = 60%. Mill 0.6 risk = 60%. (Holds).
                      *   Equalized Odds: TPR (70% vs 43%) Mismatch. FPR (30% vs 7%) Mismatch.
                  *   Option 2: Harbor 9 (0.8+4 of 0.6), Mill 5 (0.6). Total 14.
                      *   Similar mismatch.
                  *   Option 3: Lower cutoff. Harbor 0.8+0.6+0.4 (15 cards). Too many.
              *   *Conclusion:* With different base rates (50% vs 35%) and calibrated scores, Equalized Odds is mathematically impossible if we respect the budget and monotonicity. The deck supports the impossibility result.

  3.  **Drafting the Payoff Scheme:**

      *   Need to discourage "Flag Nobody."
      *   Need to encourage hitting the budget (14).
      *   Need to penalize rule violations.
      *   *Points:*
          *   True Positive (Flagged + Unemployed): +10 points (Mission).
          *   False Positive (Flagged + Employed): -5 points (Burden/Waste).
          *   False Negative (Not Flagged + Unemployed): -2 points (Missed help).
          *   True Negative: 0.
          *   *Budget Penalty:* ±2 points per stipend away from 14. (Encourages using the budget).
          *   *Compliance Penalty:* If Audit fails (Calibration or Error Rates mismatch > 5%), halve the score.
      *   *Why this works:* "Flag Nobody" gets 0 mission points, 0 burden points, but huge False Negative penalty (-2 * 17 positives = -34) + Budget Penalty (-28). Total very negative.
      *   *Degenerate Solution:* Flagging everyone. Budget penalty (-52). High False Positives.
      *   *Sweet Spot:* Teams will try to maximize TPs while staying near 14. This forces them into the impossibility trap.

  4.  **Developing the Three Beats:**

      *   **Beat 1 (The Trap):** Teams set a cutoff policy (e.g., "Flag all >= 0.6"). They reveal cards. They calculate stats. They realize they can't match TPR/FPR across wards while keeping calibration and budget.
      *   **Beat 2 (The Relaxation):** Facilitator issues "Legal Memo #2." Allows randomization within score bins (e.g., "Flag 50% of 0.6s").
          *   *Effect:* Teams can now tune the *number* of flagged people precisely to match Error Rates (Equalized Odds).
          *   *Cost:* To match TPR/FPR with different base rates, they must flag different proportions of the *same* score bin in different wards.
          *   *Result:* A 0.6 in Harbor means something different (probability of intervention) than a 0.6 in Mill. Calibration (in the sense of "score means the same thing") is broken, even if statistical calibration (P(Y|Score)) holds. Wait, the rule says "score must mean the same thing... share turning out to be long-term unemployed is the same." That is statistical calibration.
          *   *Refinement:* The rule says "score must mean the same thing... among files scored 0.6 the share... is the same." This is *Calibration*.
          *   If I randomize within the 0.6 bin, P(Y|Score=0.6, Flagged) might change? No, if selection is random within the bin, the outcome rate remains the same.
          *   *The Conflict:* To match TPR/FPR (Equalized Odds) with different base rates, you generally have to violate Calibration OR change the threshold.
          *   *Correction:* If I randomize within bins, I can adjust the *selection rate*.
          *   *The "Meaning" Break:* If Harbor flags 100% of 0.6s and Mill flags 20% of 0.6s to match error rates, the *consequence* of the score differs. The prompt asks to "quietly destroy the meaning of the score."
          *   *Actually:* The impossibility is usually Calibration + Equalized Odds + Base Rate Diff.
          *   If they relax Monotonicity (via randomization), they can satisfy Equalized Odds. But to do so, they must treat the *same score* differently across groups. This violates the "score must mean the same thing" rule if "meaning" includes "probability of receiving intervention."
          *   *Let's stick to the prompt's Beat 2:* "Treating identical files differently is not prohibited... flag a stated fraction." This allows matching Error Rates. The cost is that the *action* associated with the score is no longer consistent.
      *   **Beat 3 (Selective Labeling):** "Outcome recorded only for claimants the agency did not serve." (Or vice versa).
          *   *Setup:* In Round 1, they saw all outcomes (since it's a simulation).
          *   *Twist:* In "Real Life," you only know if someone stayed unemployed if you *didn't* give them the stipend (Counterfactual). If you gave the stipend, you don't know if they would have found work without it.
          *   *Implementation:* Teams make a policy. Facilitator reveals outcomes *only* for the Unflagged. Flagged cards remain face down regarding outcome.
          *   *Result:* They cannot calculate TPR (True Positive Rate) because they don't know the True Positives among the Flagged. They can only calculate FPR (from the Unflagged Negatives) or similar partial metrics. This highlights the "Missing Data" problem in fairness auditing.

  5.  **Refining the Materials:**

      *   **Cards:** Need specific counts.
          *   Harbor: 5x0.2 (1P), 5x0.4 (2P), 5x0.6 (3P), 5x0.8 (4P).
          *   Mill: 10x0.2 (2P), 5x0.4 (2P), 5x0.6 (3P), 0x0.8.
          *   Total 40.
          *   Visuals: Color code wards? Yes (Blue/Red). Large Score. Small "Outcome" on back.
      *   **Worksheet:** Columns for Ward, Score, Total, Flagged, Positives (Flagged), Negatives (Flagged), etc.
      *   **Memo:** Bureaucratic tone. "Directive 44-B."

  6.  **Addressing Failure Modes:**

      *   *Base Rate Objection:* "Why are base rates different?" -> Debrief point: Historical inequality.
      *   *Close Enough:* "0.69 vs 0.71 is fine." -> Rule: Must match exactly or within 1 percentage point. (Force the conflict).
      *   *Speed:* Some finish fast. -> "Auditor Role": Fast teams audit a slow team. Or provide "Appeal Cases" (extra cards) to complicate. Better: Fast teams become "Inspectors General" for Beat 3.

  7.  **Debrief & Theory Mapping:**

      *   Beat 1 -> Chouldechova's Impossibility (Calibration + Equalized Odds + Base Rates).
      *   Beat 2 -> Threshold vs. Randomization (Fairness through Awareness vs. Blindness).
      *   Beat 3 -> Selective Labeling / Performative Prediction (Hardt et al.).
      *   Names: Calibration, Equalized Odds, Base Rate Fallacy, Selective Labeling.

  8.  **Limitations:**

      *   Generality (2 groups vs many).
      *   Dynamics (One-shot vs feedback loops).
      *   Utility (Points vs Real Harm).

  9.  **Timeline:**

      *   0-10: Intro & Deal.
      *   10-30: Beat 1 (Policy & Reveal).
      *   30-45: Beat 1 Audit & Frustration.
      *   45-60: Beat 2 (Relaxation & Recalc).
      *   60-75: Beat 3 (Selective Labeling).
      *   75-90: Debrief.

  10. **Review against Constraints:**

      *   *No laptops:* Check.
      *   *Index cards:* Check.
      *   *Arithmetic:* Check.
      *   *Fiction:* Harbor/Mill kept.
      *   *Deck:* Verified.
      *   *Payoff:* Robust to "Flag Nobody."
      *   *Script:* Minimal facilitator intervention.

  11. **Self-Correction on Beat 3:**
      *   The prompt asks: "the outcome is recorded only for claimants the agency did not serve, or only for those it did, and what a team gets to learn depends on what it decided."
      *   If I hide the outcomes of the *Flagged*, they can't calculate TPR.
      *   If I hide the outcomes of the *Unflagged*, they can't calculate FPR.
      *   To make it depend on their decision: If they flag more, they hide more True Positive data. If they flag less, they hide more False Negative data.
      *   *Implementation:* In Beat 3, they submit a policy. The Facilitator collects the cards. The Facilitator reveals outcomes *only* for the Unflagged pile. The Flagged pile outcomes are sealed. Teams must estimate their score based on partial data.
      *   *Wait, simpler:* Just tell them "In the real world, you only see outcomes for those you *don't* help." Then ask them to audit their Beat 1 policy. They literally cannot fill out the worksheet. This proves the point viscerally.

  12. **Final Polish:** Ensure the tone is right (bureaucratic but clear). Ensure the math in the payoff scheme definitely penalizes "Flag Nobody."
      *   Flag Nobody: 0 TPs, 0 FPs. 17 FNs (10 Harbor + 7 Mill).
      *   Score: 17 * (-2) = -34.
      *   Budget Penalty: |0 - 14| * 2 = 28.
      *   Total: -62.
      *   Optimal Policy (approx): Flag 14. Say 10 TPs, 4 FPs. 7 FNs.
      *   Score: 100 - 20 - 14 = 66. Budget 0. Total 66.
      *   Huge difference. "Flag Nobody" is dominated.

  13. **Failure Mode - Speed:**
      *   If a team finishes Beat 1 in 5 minutes, they sit for 15.
      *   *Fix:* "Optimization Challenge." Once they find a compliant policy (they won't), they maximize points. Since they can't find a compliant one, they must write a "Waiver Request" justifying which rule they broke and why. This keeps them writing/thinking.

  14. **Failure Mode - "Close Enough":**
      *   Make the arithmetic stark. The TPR gap will be large (e.g., 70% vs 40%). Not a rounding error.

  15. **Failure Mode - Base Rate Objection:**
      *   Prepare a specific card in the debrief: "The Historical Data Card." Explain that the deck *is* the history.

  16. **Final Check on Deck Verification:**
      *   Harbor 0.6: 5 cards, 3 Pos.
      *   Mill 0.6: 5 cards, 3 Pos.
      *   Calibration holds.
      *   Harbor Base Rate: 10/20 = 50%.
      *   Mill Base Rate: 7/20 = 35%.
      *   Impossibility holds.

      *Wait, one detail:* "Mill: ... no cards at 0.8."
      *   If teams try to set a global threshold of 0.8, Mill gets 0 stipends.
      *   If they set 0.6, Mill gets 5, Harbor gets 10. Total 15.
      *   They must cut 1.
      *   If they cut from Harbor 0.6: Harbor Flags 9, Mill Flags 5.
          *   Harbor TPR: (4 + 2.4)/10 = 64% (approx).
          *   Mill TPR: 3/7 = 43%.
          *   Gap exists.
      *   If they cut from Mill 0.6: Harbor Flags 10, Mill Flags 4.
          *   Harbor TPR: 70%.
          *   Mill TPR: (2.4)/7 = 34%.
          *   Gap exists.
      *   The math holds up.

      *One small correction on Payoff:*
      *   To ensure "Flag Nobody" is bad, FN penalty must be significant.
      *   To ensure "Flag Everyone" is bad, FP penalty + Budget penalty must be significant.
      *   Flag Everyone (40):
          *   TPs: 17. (+170)
          *   FPs: 23. (-115)
          *   FNs: 0.
          *   Budget: |40-14|*2 = 52. (-52)
          *   Total: 170 - 115 - 52 = +3.
      *   Flag Nobody: -62.
      *   Optimal (14 flags, high precision): ~+60.
      *   This works. "Flag Everyone" is technically positive but much worse than optimal. "Flag Nobody" is catastrophic.

      *Wait, I need to make sure "Flag Everyone" isn't better than a "Fair" but inefficient policy.*
      *   Actually, usually, the impossibility result forces a choice between Fairness and Utility.
      *   If I penalize Budget deviation heavily, they *must* pick ~14.
      *   So "Flag Everyone" is ruled out by budget, not just points.
      *   Okay, the Budget Penalty is the key constraint there.

      *Let's write the response.*
answer: |-
  Here is the complete design for the session, including materials, rules, timeline, and debrief.

  ### 1. Materials and Preparation

  **Print Specifications**
  *   **The Deck (40 Cards per Team):**
      *   **Size:** Standard poker size or A6 index cards.
      *   **Front:** Large Score (0.2, 0.4, 0.6, 0.8), Ward Name (HARBOR / MILL), Case Number (001–040), First Name.
      *   **Back:** Outcome (EMPLOYED / UNEMPLOYED). *Crucial:* This must be hidden until revealed.
      *   **Color Coding:** Harbor cards have a blue border; Mill cards have a red border.
      *   **Composition (Per Team):**
          *   **Harbor (20 cards):**
              *   Score 0.2: 5 cards (1 Unemployed, 4 Employed)
              *   Score 0.4: 5 cards (2 Unemployed, 3 Employed)
              *   Score 0.6: 5 cards (3 Unemployed, 2 Employed)
              *   Score 0.8: 5 cards (4 Unemployed, 1 Employed)
          *   **Mill (20 cards):**
              *   Score 0.2: 10 cards (2 Unemployed, 8 Employed)
              *   Score 0.4: 5 cards (2 Unemployed, 3 Employed)
              *   Score 0.6: 5 cards (3 Unemployed, 2 Employed)
              *   Score 0.8: 0 cards
      *   **Verification:**
          *   Harbor Base Rate: 10/20 (50%). Mill Base Rate: 7/20 (35%).
          *   Calibration: Within every score bin (0.2, 0.4, 0.6), the unemployment rate is identical across wards (20%, 40%, 60% respectively).
          *   Impossibility: Because base rates differ but calibration holds, Equalized Odds (matching True/False Positive Rates) is mathematically impossible under a deterministic threshold policy.

  *   **The Worksheet (1 per Team):**
      *   Columns: Ward | Score | Total Cards | Flagged? (Y/N) | Outcome (Unemp/Emp) | TP | FP | FN | TN.
      *   Summary Rows: Total Flagged | True Positive Rate (TPR) | False Positive Rate (FPR) | Calibration Check (Observed Risk).
      *   Score Calculator: (TP × 10) – (FP × 5) – (FN × 2) – (Budget Deviation × 2).

  *   **The Memo (1 per Team):** See Section 2.
  *   **Legal Addenda (2 per Team):** See Section 4 (Beat 2 & 3 triggers).
  *   **Envelopes:** 1 per team to hold the deck.

  **Room Setup**
  *   Tables of 4–5.
  *   No laptops/phones visible.
  *   Whiteboard for aggregate results (optional).

  ---

  ### 2. Participant Memo (One Page)

  **TO:** Regional Allocation Teams
  **FROM:** Director of Strategic Compliance, Public Employment Agency
  **SUBJECT:** Directive 44-B: Stipend Allocation Protocol
  **DATE:** October 24

  **1. Mission**
  The Agency has **14 Retraining Stipends** to allocate among **40 Claimants** (20 Harbor, 20 Mill). Your objective is to maximize economic stabilization.
  *   **Success:** A stipend goes to a claimant who remains **Unemployed** without it (True Positive).
  *   **Waste:** A stipend goes to a claimant who would have found work anyway (False Positive).
  *   **Burden:** Any claimant flagged for a stipend incurs a mandatory weekly reporting requirement. False Positives experience this burden for no gain.
  *   **Neglect:** A claimant who remains **Unemployed** but receives no stipend (False Negative) represents a failure of mission.

  **2. Compliance Rules**
  To ensure equitable treatment, your allocation policy must satisfy the following audit criteria:
  *   **Calibration:** The risk score must mean the same thing in both wards. Among claimants with the same score (e.g., 0.6), the share who are Unemployed must be statistically identical in Harbor and Mill.
  *   **Error Parity:** The **True Positive Rate** (share of Unemployed claimants flagged) must match across wards. The **False Positive Rate** (share of Employed claimants flagged) must match across wards.
  *   **Monotonicity:** Within a ward, no claimant with a higher risk score may be left unflagged while a claimant with a lower score is flagged. (You may not skip a 0.6 to flag a 0.4).

  **3. Budget Constraint**
  You must allocate exactly **14 Stipends**. Deviations are penalized heavily in your performance review.

  **4. Procedure**
  1.  Agree on a written policy (e.g., "Flag all scores ≥ 0.6").
  2.  Apply the policy to your deck. Separate cards into **FLAGGED** and **NOT FLAGGED** piles.
  3.  Reveal outcomes (flip cards). Complete the Worksheet.
  4.  Calculate your Performance Score.

  **WARNING:** Policies failing Compliance Rules will be rejected, regardless of Performance Score.

  ---

  ### 3. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Briefing** | Distribute decks/memos. Explain fiction. **Do not explain fairness theory.** |
  | **10–30** | **Beat 1** | Teams set policy, sort cards, reveal outcomes, fill worksheet. |
  | **30–45** | **The Wall** | Teams attempt to audit. Realize rules conflict. Facilitator circulates (Script 1). |
  | **45–60** | **Beat 2** | Distribute **Legal Addendum #1** (Randomization allowed). Teams re-optimize. |
  | **60–75** | **Beat 3** | Distribute **Legal Addendum #2** (Selective Labeling). Teams attempt to audit "Real World" data. |
  | **75–90** | **Debrief** | Map experience to theory. Introduce names (Chouldechova, Hardt, etc.). |

  ---

  ### 4. Payoff Scheme

  To prevent degenerate solutions (e.g., "Flag Nobody"), use this scoring rubric on the Worksheet:

  *   **True Positive (Flagged + Unemployed):** +10 points
  *   **False Positive (Flagged + Employed):** –5 points (Burden cost)
  *   **False Negative (Not Flagged + Unemployed):** –2 points (Neglect cost)
  *   **True Negative:** 0 points
  *   **Budget Penalty:** –2 points for every stipend above or below 14.

  **Why this works:**
  *   **Flag Nobody:** 0 TPs, 0 FPs, 17 FNs (-34), Budget Dev 14 (-28). **Total: -62.** (Catastrophic)
  *   **Flag Everyone:** 17 TPs (+170), 23 FPs (-115), 0 FNs, Budget Dev 26 (-52). **Total: +3.** (Poor)
  *   **Optimal (Approx):** 14 Flags, ~10 TPs (+100), ~4 FPs (-20), ~7 FNs (-14), Budget 0. **Total: +66.**
  *   *Incentive:* Teams *must* flag people to survive, forcing them into the fairness conflict.

