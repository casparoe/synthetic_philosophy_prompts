  ### 5. Facilitator Script (Restricted)

  *You are a bureaucrat, not a professor. Do not teach. Only answer procedural questions.*

  **During Beat 1 (When teams ask if they can break a rule):**
  > "Directive 44-B is binding. If your audit worksheet shows a mismatch in Error Parity or Calibration, your policy is non-compliant. You may adjust your cutoff, but you must stay within the rules."

  **During Beat 1 (When teams claim it's impossible):**
  > "The Agency does not accept 'impossible' as a status. Submit your best attempt and note which rule was violated in the 'Waiver' box on the worksheet."

  **During Beat 2 (Distributing Addendum #1):**
  > "Legal Counsel has issued an opinion. Monotonicity is not statutory law. You may now flag a *fraction* of a score bin (e.g., 'Flag 50% of all 0.6s'). You must determine how to select that 50% (e.g., coin flip). Re-calculate."

  **During Beat 3 (Distributing Addendum #2):**
  > "New Privacy Regulation. In a real deployment, you only observe outcomes for those you *did not* serve. For Beat 3, cover the outcomes of all **FLAGGED** cards. You may not look at them. Complete the audit with the data available."

  ---

  ### 6. The Three Beats (Detailed Mechanics)

  **Beat 1: The Impossibility Trap**
  *   **Action:** Teams pick a threshold (e.g., Score ≥ 0.6).
  *   **Math:**
      *   To hit 14 stipends, they must mix wards.
      *   Harbor Base Rate (50%) ≠ Mill Base Rate (35%).
      *   Because the scores are calibrated, the *only* way to match True Positive Rates (TPR) across wards is to flag different proportions of the population. But the Budget Constraint (14 total) and Monotonicity (highest scores first) lock them into specific proportions.
      *   *Result:* They will find that satisfying the Budget + Monotonicity forces a TPR mismatch (e.g., Harbor TPR 70%, Mill TPR 43%).
  *   **Discovery:** They cannot fill the "Compliance" checkmark.

  **Beat 2: The Relaxation (Calibration vs. Meaning)**
  *   **Action:** Teams use randomization within bins (e.g., Flag 100% of Harbor 0.6s, but only 40% of Mill 0.6s).
  *   **Math:** This allows them to tune the TPR/FPR to match exactly (Equalized Odds).
  *   **Discovery:** They satisfy Error Parity. However, look at the "Calibration" rule: *"The score must mean the same thing."*
      *   In Harbor, Score 0.6 → 100% chance of Stipend.
      *   In Mill, Score 0.6 → 40% chance of Stipend.
      *   *Discussion Point:* The statistical calibration (P(Unemployed|Score)) holds, but the *decision calibration* (P(Flagged|Score)) diverges. The score no longer "means the same thing" operationally.

  **Beat 3: Selective Labeling (The Observability Problem)**
  *   **Action:** Teams must audit their policy, but they are forbidden from flipping the **Flagged** cards.
  *   **Math:**
      *   True Positive Rate = TP / (TP + FN).
      *   TP comes from the Flagged pile (Hidden).
      *   FN comes from the Unflagged pile (Visible).
      *   *Result:* They cannot calculate the numerator of the TPR. They literally cannot know if they are being fair.
  *   **Discovery:** Fairness auditing requires counterfactual knowledge that deployment destroys.

  ---

  ### 7. Debrief Guide (15 Minutes)

  **Mapping Moments to Theory**
  1.  **Beat 1 Failure:** Introduce **Chouldechova's Impossibility Theorem**. When base rates differ (50% vs 35%) and the predictor is not perfect, you cannot satisfy Calibration and Equalized Odds simultaneously. You felt this as the "Waiver" you had to write.
  2.  **Beat 2 Relaxation:** Introduce **Fairness Through Awareness vs. Blindness**. By using group-specific randomization, you achieved Equalized Odds but violated the spirit of "blind" treatment. The score became group-dependent.
  3.  **Beat 3 Blindness:** Introduce **Selective Labeling** (Hardt et al.). By intervening, you hid the ground truth. You cannot audit what you cannot see.

  **Handling Failure Modes**
  *   **"The Base Rates are Unfair":** If students argue the 50% vs 35% gap is the real problem, validate this. *Response:* "Correct. This is **Historical Bias**. The algorithm inherits the base rates of the world it measures. Fixing the math doesn't fix the history."
  *   **"Close Enough":** If a team claims 69% vs 71% is a match. *Response:* "In this simulation, the gap will be large (e.g., 70% vs 40%). If you find a small gap, check your arithmetic. The theorem predicts a structural gap, not a rounding error."
  *   **Speed Differences:** If teams finish Beat 1 quickly. *Task:* "You are now Inspectors General. Go to a neighboring table. Verify their audit. If you find an arithmetic error, you steal 5 points from their score."

  **Limitations (Be Frank)**
  *   **Generality:** "We used two groups and four scores. The impossibility holds for any number of groups, but the geometry gets harder."
  *   **Performativity:** "In this game, the cards didn't change. In reality, giving a stipend *changes* the outcome (you might turn an Unemployed into Employed). This creates a **Performative Prediction** loop where the model changes the world it predicts, which we didn't simulate."
  *   **Utility:** "We used points. Real harm is not points. The 'Burden' cost (-5) is arbitrary. In reality, the cost of a False Positive might be dignity, not points."

  ### 8. Facilitator Checklist for Beat 3
  *   Ensure teams physically cover the Flagged cards with a blank sheet of paper before attempting the audit.
  *   When they ask "How do we know if we caught the unemployed?", answer: "You don't. That is the point."
