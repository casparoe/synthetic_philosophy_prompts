  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Absent-Minded Driver and Dynamic Consistency
  **Parties:** The Ex-Ante Planning Camp ("Planners") vs. The Node-Level Action Camp ("Actors")
  **Date:** October 26, 2023

  ### 1. Common Ground (Claims Both Camps Sign)

  We agree on the physical setup and the mathematical expectations derived from it. We disagree on where the label "rational" applies.

  1.  **The Setup:** A driver faces a sequence of indistinguishable decision points (exits). Due to imperfect memory, upon arriving at any exit, the driver cannot know which specific exit number it is, only that he is at *an* exit.
  2.  **The Strategy:** A strategy is defined by a single number, $p$, representing the probability of stopping at any given exit.
  3.  **The Payoffs:**
      *   In the **Standard Case** (2 exits): Stopping at Exit 1 yields 0. Stopping at Exit 2 yields 6. Passing both yields 1.
      *   In the **Ring-Road Case** (Infinite exits): Payoffs alternate 0, 6, 0, 6... indefinitely. If the driver never stops (runs out of fuel), the payoff is 0.
  4.  **The Ex-Ante Value:** Before starting the engine, the expected value of a plan $p$ is calculable. In the Standard Case, the value is maximized at $p = 0.4$ ($2/5$), yielding an expected score of $1.8$ ($9/5$).
  5.  **The Belief Update:** In the Standard Case, if the driver assumes he is following plan $p$, the probability that he is currently at the first exit (rather than the second) is $1 / (2 - p)$.
  6.  **The Indifference Coincidence:** In the Standard Case, at the optimal ex-ante plan ($p = 0.4$), the driver is exactly indifferent between stopping and continuing at the exit. The expected value of stopping equals the expected value of continuing ($2.25$ or $9/4$).
  7.  **The Ring-Road Limit:** In the Ring-Road Case, the ex-ante value function is $V(p) = 6(1 - p) / (2 - p)$. This value increases as $p$ gets smaller. The supremum (least upper bound) is 3, approached as $p \to 0$, but $p=0$ yields a payoff of 0.

  ### 2. Residual Disagreements

  We disagree on the definition of rationality and the binding nature of plans.

  | Feature | Ex-Ante Camp (Planners) | Node-Level Camp (Actors) |
  | :--- | :--- | :--- |
  | **Locus of Rationality** | Rationality is a property of the **plan** chosen before departure. | Rationality is a property of the **action** chosen at the moment of decision. |
  | **Binding Force** | A plan is rational if it maximizes expected value from the start. You should stick to it even if, at the exit, a different action looks locally better. | A plan is rational only if, at every exit, the action prescribed is the best one given your current evidence. |
  | **Belief Status** | Your belief about "which exit is this?" is constrained by the plan you intend to follow. | Your belief should reflect the objective chance of being at an exit, independent of what you plan to do next. |
  | **Ring-Road Verdict** | Choose a $p$ as close to zero as practically possible (e.g., $p = 0.0001$). Accept that there is no single "best" number, only better ones. | At any exit, continuing strictly dominates stopping (given low $p$). Therefore, $p$ should be 0. Accept the payoff of 0 as the cost of local rationality. |

  ### 3. The Cruxes

  These are the fundamental points where our theories diverge. We have pre-registered how we interpret specific arguments below.

  #### Crux 1: The Status of the "Indifference Coincidence"
  *The User's Algebra Question.*
  In the Standard Case, the $p$ that maximizes the trip from the start ($p=0.4$) is the exact same $p$ that makes the driver indifferent at the exit.

  *   **Planners' Interpretation:** This proves that ex-ante planning is consistent with local reasoning *if* you update beliefs correctly. It validates the plan. The driver is not "tempted" to deviate because the math balances out.
  *   **Actors' Interpretation:** This is a mathematical artifact of the specific payoff numbers and the 2-exit structure. It is not a general law. It relies on the driver using the plan $p$ to calculate his location probability. If the driver treats the current decision as independent of the past plan (as he should, since he can't remember the past), the indifference vanishes.

  **Test Case:** A 3-exit highway with payoffs 0, 0, 10 (Stop at 3rd) and 1 (Miss all).
  *   **Planners' Prediction:** The optimal ex-ante $p$ will still align with the node-level indifference point using the same belief update rule ($P(\text{exit } k) \propto P(\text{reach } k)$).
  *   **Actors' Prediction:** The alignment will break. The local calculation at the first exit will favor continuing more strongly than the ex-ante plan dictates, because the local view underweights the distant payoff.

  #### Crux 2: The Ring-Road Discontinuity
  *The User's Variant.*
  In the Ring-Road, the best ex-ante plan is "stop with probability epsilon" ($p \approx 0$). But at the node, "continue" always looks better than "stop."

  *   **Planners' Interpretation:** This shows the Node-Level view is self-defeating. If you act rationally at every node (Continue), you get 0. If you commit to the ex-ante plan ($p \approx 0$), you get $\approx 3$. Rationality must allow for pre-commitment to avoid the "zero payoff" trap.
  *   **Actors' Interpretation:** This shows the Ex-Ante view is asking for magic. You cannot execute a plan $p \approx 0$ if, at every single moment of execution, the logic of the situation demands $p=0$. A plan you cannot physically bring yourself to follow is not a valid plan. The payoff of 0 is the correct answer for a driver with no memory.

  **Test Case:** A "Pre-Commitment Device" is offered before the trip. You can lock your brake to force a stop at a random exit with probability $p$.
  *   **Planners' Prediction:** A rational driver will pay to use this device, setting $p$ very low. This proves the ex-ante plan is the true rational standard.
  *   **Actors' Prediction:** A rational driver will *not* pay for the device. At any exit, unlocking the brake (continuing) yields higher expected value than locking it (stopping). Paying to restrict future freedom is irrational.

  ### 4. Addressing Your Specific Questions

  **1. Is the algebra general? (The $p=2/5$ Coincidence)**
  Your derivation is correct for the Standard Case under the Piccione-Rubinstein (1997) framework.
  *   **The Verdict:** It is **not** a universal law of decision theory. It is a "fixed-point" property specific to models where your belief about *where* you are is derived from the strategy you intend to use.
  *   **Why it held for 3 exits:** As long as you use the same belief-updating rule (probability of being at exit $k$ is proportional to the probability of reaching exit $k$), the ex-ante optimum and the node-level indifference will coincide. This is by construction of that specific model.
  *   **The Catch:** The "Actors" camp rejects that belief-updating rule. They argue you shouldn't use your intended strategy to guess where you are. If you change the belief rule, the coincidence disappears. So, your algebra is robust *within the Planner's framework*, but it doesn't prove the Planner's framework is the only correct one.

  **2. What does each camp say about the Ring-Road?**
  This variant is fatal to the Node-Level camp in its purest form.
  *   **Ex-Ante Camp:** They admit there is no single "best" $p$, but they recommend choosing a sufficiently small $p$ (e.g., $10^{-6}$). They argue that "rationality" implies doing what gets the points ($\approx 3$), even if it requires ignoring the local urge to continue. They view the discontinuity at $p=0$ as a warning against never committing to stop.
  *   **Node-Level Camp:** They are in trouble. At any exit, if $p$ is small, you are likely at an early exit (Payoff 0). Continuing offers a chance at Payoff 6. Stopping offers 0. So "Continue" dominates. If you always Continue, $p=0$, and you get 0.
      *   *Their Escape:* They must argue that in the Ring-Road, the driver *should* realize that "Continue" leads to ruin. They might adopt a "Causal Decision Theory" modification that says your current choice influences the probability of being at a "good" exit. But this looks suspiciously like the Ex-Ante view in disguise.
      *   *Honest Admission:* A pure Node-Level theorist must accept the 0 payoff. They would say: "It is tragic, but rational, to drive forever."

  ### 5. Is This Just About Words?

  **Partly, but not entirely.**

  *   **Verbal:** If "Rational" just means "Following the best plan," the Planners win by definition. If "Rational" means "Doing the best thing right now," the Actors win by definition. Much of the seminar talk stalls here.
  *   **Substantive:** The Ring-Road variant proves this is not *only* words. The two camps recommend **different actions** that lead to **different payoffs**.
      *   Planners get $\approx 3$ points.
      *   Actors get 0 points.
      *   You cannot resolve this by dictionary definition. One group drives home to the hotel; the other drives until the tank is dry.

  ### 6. Recommendation for the Reading Group

  Stop asking "Which camp is right?" Start asking "Which camp solves the Ring-Road without contradicting itself?"

  *   If the group values **winning the game** (maximizing payoff), they must adopt the Ex-Ante view or a hybrid that allows pre-commitment.
  *   If the group values **logical consistency at the moment of action**, they must accept the Ring-Road tragedy (0 payoff) or admit that "memoryless" agents cannot solve infinite loops.

  **Signed,**

  *The Ex-Ante Planning Camp*
  *The Node-Level Action Camp*

  ***

  **Addendum for the Geophysicist:**
  Think of the Ex-Ante view like interpreting a seismic survey before drilling. You pick the best well path based on the whole model.
  Think of the Node-Level view like making decisions based only on the drill cuttings right in front of you, ignoring the survey.
  In the Standard Case, the survey and the cuttings agree (your $p=2/5$ result).
  In the Ring-Road, the survey says "Drill shallow soon," but the cuttings always look like "Keep going, the good layer is just ahead." If you listen only to the cuttings, you run out of fuel.
