  However, for your purpose—naming the flaw in the *transaction* rather than the epistemic state of the agent—the most precise label is **Structural Compulsion**. This distinguishes it from interpersonal coercion (one person threatening another) and locates the pressure in the social or normative structure itself. The "option space" exists physically but is collapsed normatively. The alternatives are present, but their *weight* is rigged by history, gender, or identity, rendering one option effectively invisible or impossible.

