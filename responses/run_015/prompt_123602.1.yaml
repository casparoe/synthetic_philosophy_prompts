  Here are 10 questions drafted to sound natural when spoken aloud, along with follow-ups based on the kinds of answers she'll likely give. I've made sure to hit the specific points you mentioned (tax breaks vs. hell, the saturation threshold, crises, and metaphysics).

  **1. The "Tax Break vs. Hell" Scenario**
  "You distinguish between better behavior and better dispositions. So, imagine an atheist donates to charity just to get a tax break, and a believer does it out of fear of hell. Neither is doing it purely for the sake of goodness. In your view, is one of those motivations actually 'more moral' than the other, or are they both just external conditioning?"
  *   **Follow-up (if she says the believer is more moral):** "But if both are acting out of self-interest—either saving money or saving their soul—what makes the religious fear any less transactional than the tax break?"

  **2. Measuring Dispositions**
  "Following up on that: if morality is mostly about dispositions—like having good intentions when nobody's watching—how do we actually measure that empirically? Since we can only see behavior, isn't there a risk that 'disposition' is just a placeholder for things we can't quantify?"
  *   **Follow-up (if she says we can infer dispositions):** "But couldn't we infer those same dispositions from secular habits? Like, if someone consistently follows rules when alone, does it matter if the source is religious or just deep-seated habit?"

  **3. The Saturation Threshold (Empirical vs. Conceptual)**
  "You argue that secular societies hit an 'institutional saturation threshold' where laws can't replace religious trust. Is this threshold a real empirical limit we could measure with data, or is it more of a conceptual boundary to help us think about the problem?"
  *   **Follow-up (if she says it's conceptual):** "If it's conceptual rather than empirical, how do we know when we've actually hit it? Is there a risk that any failure of trust gets blamed on secularism rather than bad policy?"

  **4. Stress-Testing Trust (Pandemics/Blackouts)**
  "I'm curious about when institutions are stressed, like during a pandemic or a massive blackout. Do you think secular societies actually lose trust faster in those moments compared to religious ones, or do secular communities find other ways to coordinate when the grid goes down?"
  *   **Follow-up (if she says secular trust fails faster):** "Are there historical examples where secular societies maintained high trust during crises without relying on religious frameworks? I'm thinking of places like Scandinavia during WWII."

  **5. Metaphysics vs. Coordination**
  "This is something my friend and I debated: Does morality need a metaphysical foundation to work long-term, or is it just a coordination technology? In other words, do we need to believe morality is 'real' in a cosmic sense, or is it enough that we just agree to pretend it is?"
  *   **Follow-up (if she says we need metaphysics):** "If we need that metaphysical grounding, does that mean secular morality is inherently unstable, or just that it requires more maintenance to keep people bought in?"

  **6. The Social Conditioning Objection**
  "My friend Marco argues that what you're calling 'religious disposition' is just social conditioning by another name. If a child is raised to be honest because 'God sees you,' isn't that functionally the same as being raised to be honest because 'society will punish you'?"
  *   **Follow-up (if she says religion is deeper):** "What makes the religious conditioning 'deeper'? Is it the fear of eternal punishment versus temporary social shame, or is there a qualitative difference in how the rule is internalized?"

  **7. Secular Substitutes (Nationalism/Humanism)**
  "If the key is having a shared narrative that builds trust beyond contracts, can secular ideologies like nationalism or humanism fill that gap? Or do those hit the saturation threshold even faster than religion because they're too tied to specific political outcomes?"
  *   **Follow-up (if she says secular ideologies fail faster):** "Is that because those ideologies lack a supernatural enforcer, or because they've been used too often to justify harm, making people cynical about them?"

  **8. The Object of Trust**
  "When you talk about religious trust, are you talking about trust in other people, or trust in the system itself? Like, do religious people trust their neighbors more, or do they just trust that the universe is ordered in a way that makes cooperation safe?"
  *   **Follow-up (if she says it's trust in neighbors):** "Does that trust extend only to people within their own faith community, or does it generalize to strangers outside the group as well?"

  **9. Normative Implications**
  "I want to make sure I understand the stakes here. If your argument is right, does it imply that secular people are morally 'second-class' citizens in terms of societal stability? I'm trying to understand if this is a critique of secular people, or just a critique of secular structures."
  *   **Follow-up (if she says it's about structures):** "If it's about structures, what's the obligation of secular leaders? Should they be trying to cultivate something religion-like, or accept that their societies have a different risk profile?"

  **10. The Way Forward**
  "Finally, if we are approaching this institutional saturation point in secular societies, what's the solution? Do we try to revive religious frameworks, or do we need to invent a completely new kind of social glue that isn't dependent on either laws or theology?"
  *   **Follow-up (if she says we need new glue):** "Do you think philosophy can help build that new glue, or is that something that has to emerge organically from culture?"
