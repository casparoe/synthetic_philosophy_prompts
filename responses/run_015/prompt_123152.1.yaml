answer: |-
  ### Brainstorm: Descriptive Anachronism vs. Normative Framing Leakage

  Before we get to the tool, we need to lock down the distinction you're struggling with. This is the core of the feedback you're getting.

  *   **Descriptive Anachronism (The Easy Catch):** Using words or concepts that didn't exist or meant something else.
      *   *Example:* Calling an 18th-century underwriter a "CEO" or saying a captain suffered "psychological trauma."
      *   *Fix:* Swap the word. Use "merchant-principal" or "distress."
  *   **Normative Framing Leakage (The Hard Catch):** Using period-accurate words, but arranging them so modern ethics act as the hidden referee. This happens in the *syntax of blame*, not the vocabulary.
      *   *Example:* "The underwriter refused to pay, leaving the sailors destitute."
      *   *The Leak:* This implies the refusal *caused* the destitution in a blameworthy chain. If the contract explicitly put sailors at risk of non-payment during loss, the refusal didn't "leave" them destitute; the maritime environment did. The underwriter just followed the script. Your sentence structure makes the underwriter the agent of harm, not the executor of a contract.
      *   *The "Period Norms" Trap:* Writing "This was consistent with period norms" can sound like an excuse (apologia). It smuggles in the modern value that "following norms = morally excusable."

  ***

  ### The Tool: The Normative Leakage Audit (NLA)

  This is a step-by-step decision procedure. Run every paragraph of your draft through these five questions in order. Do not skip ahead.

  **Step 1: The Vocabulary Scan**
  *   **Question:** Are there any nouns or adjectives that rely on post-1800s social science, law, or ethics? (e.g., *unfair, exploitation, risk-shifting, psychology, rights, efficient*).
  *   **Pass:** No flagged terms found.
  *   **Rewrite Immediately:** If yes. Replace with period-specific equivalents (e.g., *equity, hardship, hazard, custom, privilege*).
  *   **Stop Condition:** If you find "unfair," "immoral," or "exploitative," stop and rewrite. These are hard presentism triggers.

  **Step 2: The Agency & Causality Check**
  *   **Question:** Who is the grammatical subject of the sentence, and does that subject bear the weight of the outcome?
  *   **Pass:** The agent matches the historical power structure (e.g., "The contract stipulated..." vs. "The underwriter forced...").
  *   **Rewrite Immediately:** If you attribute outcomes to personal malice or modern rationality rather than structural constraints or contractual clauses.
  *   **Flag for Advisor:** If you are unsure who held the legal agency in this specific port/year.

  **Step 3: The "Therefore" Test (Implicit Judgment)**
  *   **Question:** If you insert the word "therefore" between your description and the outcome, does it imply a moral judgment?
      *   *Test:* "The underwriter refused to pay [therefore] the sailors starved."
  *   **Pass:** The connection is mechanical/legal, not moral.
  *   **Rewrite Immediately:** If the sentence structure implies the outcome was a *violation* rather than a *contingency*.
  *   **Stop Condition:** If the sentence implies the outcome was preventable by modern standards.

  **Step 4: The "Period Norms" Defense Check**
  *   **Question:** Are you using "custom," "norm," or "expectation" to explain *why* something happened, or to explain *why it was okay*?
  *   **Pass:** The term describes the mechanism of decision-making (e.g., "He acted according to the custom of...").
  *   **Flag for Advisor:** If the term functions as an excuse (e.g., "He acted according to custom, so the loss was justified").
  *   **Rewrite Immediately:** If you use "norms" to smooth over conflict that contemporaries themselves fought about.

  **Step 5: The Counterfactual Sanity Check**
  *   **Question:** Does this sentence imply the historical actors *could* have chosen a modern ethical alternative but didn't?
  *   **Pass:** No. The actors are constrained by their epistemic and legal horizon.
  *   **Unfixable (Requires Research):** If your argument relies on them having access to a concept they didn't have (e.g., "They chose not to insure the crew" implies "insuring the crew" was a viable option they rejected).
  *   **Rewrite Immediately:** Change to "The contract did not provide for crew insurance."

  ***

  ### Worked Examples

  Here is how the NLA handles your two specific sentences.

  #### Example 1: "The underwriter's refusal to pay was an unfair risk-shifting onto sailors."

  *   **Step 1 (Vocabulary):** **FAIL.**
      *   *Issue:* "Unfair" is a modern normative judgment. "Risk-shifting" is modern economic terminology (mid-20th century).
      *   *Action:* **Rewrite Immediately.**
  *   **Step 2 (Agency):** **FAIL.**
      *   *Issue:* "Refusal... onto sailors" implies the underwriter actively moved the risk. In 1750, the risk was likely static based on the contract signing, not shifted at the moment of refusal.
  *   **Step 3 (Therefore Test):** **FAIL.**
      *   *Issue:* Implies a violation of equity.
  *   **NLA Verdict:** **Trip the Alarm.** This sentence is pure presentism. It judges the past by a standard of fairness the underwriter would not recognize as binding in that context.

  #### Example 2: "The refusal was aligned with contemporary contractual expectations."

  *   **Step 1 (Vocabulary):** **PASS.**
      *   *Issue:* "Aligned," "contemporary," "contractual," "expectations" are acceptable descriptors.
  *   **Step 2 (Agency):** **PASS.**
      *   *Issue:* The refusal is the subject; it is aligned with an external standard (expectations).
  *   **Step 3 (Therefore Test):** **PASS.**
      *   *Issue:* No moral judgment implied. It describes fit, not justice.
  *   **Step 4 (Norms Defense):** **CAUTION (Pass with Note).**
      *   *Issue:* "Expectations" can be slippery. Did the *sailors* expect payment, or the *underwriter*? If you mean "underwriter's expectations," it passes. If you mean "societal expectations," you risk smoothing over conflict.
      *   *Action:* Pass, but ensure you have evidence for whose expectations these were.
  *   **Step 5 (Counterfactual):** **PASS.**
      *   *Issue:* Does not imply they could have done otherwise ethically.
  *   **NLA Verdict:** **Clean.**

  **The Answer You Probably Won't Like:**
  Example 2 passes the checklist, but you might not like what that *does* to your argument. By scrubbing the normative language to satisfy the NLA, you may feel you are sanitizing the suffering of the sailors. The procedure forces you into a detached voice ("aligned with expectations") that can feel like complicity. **This is the trade-off.** The NLA protects you from academic criticism of presentism, but it cannot resolve the moral tension of writing about hardship without sounding like you endorse it. You must accept that describing a mechanism neutrally is not the same as endorsing it, even if it feels that way emotionally.

  ***

  ### Limitations & Honest Constraints

  Since you have no library access and a deadline tomorrow, you need to know where this tool fails.

  1.  **Accuracy vs. Framing:** The NLA only checks your *framing*. It cannot tell you if "contractual expectations" is historically accurate. If 1750s sailors actually *did* view refusal as "unfair" (using their own period terms like "unjust" or "against custom"), then Example 2 is historically false, even if it isn't presentist. The tool protects you from judging them by *your* morals, not from misrepresenting *their* morals.
  2.  **The "Norms" Trap:** The tool flags "norms" as an excuse, but sometimes contemporaries *did* use norms to excuse themselves. If you write "He claimed this was consistent with custom," that is historically accurate reporting of their excuse. The NLA might make you hesitant to report their own apologia. **Rule:** Distinguish between *your* voice saying "This was normal" (Risk) vs. *their* voice saying "This was normal" (Safe).
  3.  **Unfixable Problems:** If your entire thesis argument relies on the premise that 18th-century underwriters *should* have protected sailors, the NLA will mark every chapter as "Rewrite." You cannot fix a presentist argument with better words. You must shift the argument to: "How did underwriters justify non-protection?" rather than "Why was non-protection wrong?"

  **Final Advice for Tomorrow:**
  Run the NLA on your topic sentences first. If the topic sentence trips the alarm, the paragraph underneath it will too. Save the deep dives for later. If you hit a "Flag for Advisor," add a footnote: *"Terminology selected to reflect period contractual frameworks rather than modern equity standards."* Advisors love that kind of methodological transparency when you're under the gun.

  Good luck. Get the draft in.
