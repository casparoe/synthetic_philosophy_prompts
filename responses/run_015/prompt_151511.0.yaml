      *   *Conceptual:* Dissolving the conflict requires separating the *explanatory* project from the *normative* project.
      *   *Reframing:* The framing is ill-posed if it assumes aggregate parity is the default metric of justice.
      *   *Best Bet:* Conceptual clarification + Reframing. We need to stop asking "What does the paradox prove about justice?" and start asking "Under what conditions do we care about the origin of preferences?"

