      *   *Camp 3 (Normative):* Focuses on *distributive justice*. Assumes the goal is fairness, not parity. Parity is only required if opportunity was unequal. Therefore, observed differences = irrelevant to justice (provided opportunity was equal).

  3.  **Diagnose the Impasse:**
      *   *Is it Substantive?* Yes, regarding the malleability of preferences. Camp 1 says preferences are relatively fixed/endogenous to biology; Camp 2 says they are highly plastic/endogenous to culture.
      *   *Is it Verbal?* Yes, regarding definitions of "choice," "equality," and "opportunity." Camp 1 defines equality as absence of coercion. Camp 2 defines it as absence of gendered influence. Camp 3 defines it as procedural fairness.
      *   *Is it Different Questions?* **Crucially, yes.**
          *   Camp 1 asks: *What is the origin of the variance?* (Etiology)
          *   Camp 2 asks: *How do institutions shape identity?* (Mechanism)
          *   Camp 3 asks: *What do we owe each other?* (Normativity)
      *   *The Hidden Work:* The conflation of *explanation* (why did this happen?) with *justification* (is this fair?). Also, the conflation of *individual agency* with *aggregate statistics*.

  4.  **Evaluate the User's Hypothesis:**
