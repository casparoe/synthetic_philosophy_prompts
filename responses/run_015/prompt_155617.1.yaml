answer: |-
  You have hit on the precise reason this debate feels like a stalemate: you've identified the **endogeneity problem**. Your "ratchet" theory is the key to the diagnosis. Because the law shapes the morality it claims to merely reflect, you cannot run the experiment Devlin demands without already biasing the results.

  Here is the diagnosis of the disagreement, followed by what progress would actually look like given that diagnosis.

  ### The Diagnosis: An Ontological Disagreement Masquerading as Empirics

  This is not primarily a verbal dispute, nor is it a solvable empirical one. It is a **clash of political ontologies** that uses empirical language as a proxy.

  **1. Why it isn't just empirical (The Identification Problem)**
  You are correct that Devlin's argument rests on a causal claim: *Removing moral enforcement causes social disintegration.* Hart counters with a causal claim: *Society is robust enough to withstand moral pluralism.*
  However, as you noted, the "ratchet" makes this unfalsifiable.
  *   **The Control Group Missing:** We cannot observe a society that *never* enforced a specific morality to see if it would have survived.
  *   **The Definition of "Disintegration":** Devlin defines society as a "community of ideas," including moral ideas. If the morality changes, Devlin can argue the *society itself* has dissolved, even if the state remains standing and people aren't killing each other. Hart defines society structurally (institutions, peace, order).
  *   **Result:** They can look at the same stable, post-decriminalization society and disagree on whether it is "the same society." Devlin sees a corpse animated by habit; Hart sees a living, evolved organism. This is not a data dispute; it is a disagreement about what counts as the *life* of a polity.

  **2. Why it isn't just normative (The Incommensurability)**
  If it were purely normative (Liberty vs. Order), we could trade off. But both sides claim to care about the *same* ultimate good: social survival.
  *   Devlin argues that without moral enforcement, liberty becomes impossible because there is no social fabric to hold it.
  *   Hart argues that without liberty, the social fabric becomes tyrannical and loses legitimacy, leading to collapse.
  *   **Result:** Both claim the high ground of "preserving society." This makes the disagreement stubborn. It's not "Freedom vs. Security"; it's "Security through Conformity vs. Security through Autonomy."

  **3. The Real Disagreement: The Constitutive Power of Law**
  The stalemate persists because Hart treats law as **regulative** (it stops bad things), while Devlin treats law as **constitutive** (it makes us who we are).
  *   **Hart's View:** Law is a fence. It keeps people from hurting each other. What happens inside the fence is private.
  *   **Devlin's View:** Law is a teacher. It instructs citizens on what kind of people they are.
  *   **Your Ratchet:** You noticed that Devlin is right about the constitutive power (law manufactures consensus), but Hart is right that this manufacturing isn't necessary for *survival*.
  *   **The Diagnosis:** The debate is stalled because they are arguing about **whether the state has a legitimate interest in the moral character of its citizens, independent of their actions toward others.** Hart says no; Devlin says yes. No amount of data can answer this because it is a question of *authority*, not *outcome*.

  ### What Counts as Progress?

  Since the empirical question is contaminated and the normative question is foundational, "solving" the debate in the traditional sense is impossible. However, progress is possible if we change the **location** of the argument.

  **1. Shift from "Justification" to "Cost-Benefit of Moral Engineering"**
  Accept your ratchet insight as a premise: *Law does manufacture morality.*
  Once we admit this, the Devlinite claim that "law reflects morality" is dead. The question becomes: *Is it worth the cost to use the criminal law as a moral manufacturing plant?*
  *   **Progress:** We stop asking "Is this immoral?" and start asking "Is the social cost of enforcing this worth the moral cohesion it buys?"
  *   This moves the debate toward **Legal Pragmatism**. Even if Devlin is right that enforcement creates cohesion, is that specific cohesion worth the police resources, the black markets, the corruption, and the loss of trust in the legal system? Hart wins here not on principle, but on efficiency.

  **2. The "Public Reason" Turn (Rawlsian Progress)**
  The debate stalls because Devlin relies on "positive morality" (what people *happen* to believe) as the standard.
  *   **Progress:** We shift the standard from *existing* public morality to *justifiable* public morality.
  *   Instead of "The majority hates X," the question becomes "Can we justify banning X using reasons that a free citizen could accept?"
  *   This dissolves the Hart-Devlin fight by rejecting Devlin's premise. The "load-bearing" morality isn't whatever the mob feels; it's the minimal moral framework required for democracy itself (e.g., tolerance, non-violence). Homosexuality doesn't threaten *that* morality; intolerance does.

  **3. Acknowledge the "Zone of Indifference"**
  Progress involves admitting that Hart and Devlin are both partially right about different domains.
  *   **Core Morality:** There are some morals the law *must* enforce to exist (e.g., prohibitions on violence, fraud). Devlin is right here; a society that allows murder isn't a society.
  *   **Peripheral Morality:** There are morals the law *should not* enforce (e.g., sexual practices between consenting adults). Hart is right here; enforcement causes more harm than the "disintegration" risk.
  *   **Progress:** The work isn't deciding the principle for *all* cases, but drawing the line between Core and Peripheral. The debate stalls because both sides try to make their principle universal. Progress is **casuistry**—arguing case-by-case about where the line falls, rather than fighting over the metaphysical nature of society.

  ### Summary
  The debate is a **Zombie Argument**. It lives on because it performs a function (marking the boundary of the political) rather than describing a solvable problem.

  *   **Diagnosis:** It is an ontological clash about the nature of political community (constitutive vs. regulative) disguised as an empirical dispute about social stability, made unfalsifiable by the endogeneity of law and morality (your ratchet).
  *   **Progress:** Progress requires abandoning the search for a universal principle. We must accept that law *does* shape morality (validating Devlin's mechanism) but argue that using criminal law for this purpose is usually too costly and illegible (validating Hart's conclusion). The question shifts from "Can we?" to "Should we, given the price?"

  You are right that nobody budges. They won't, until they admit that Devlin's "social disintegration" is a metaphysical fear, not a sociological prediction, and that Hart's "harm principle" is a political choice, not a law of nature. Progress is realizing the debate is about **what kind of citizens we want to be**, not whether society will explode.
