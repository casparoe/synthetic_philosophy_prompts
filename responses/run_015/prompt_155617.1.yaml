      *   *Conclusion:* The debate is a "Zombie Debate." It lives on because it serves a function (marking the boundary of the political), not because it's solvable. Progress is realizing the function.

  8.  **Final Structure:**
      *   Validate the "Ratchet" insight (Endogeneity).
