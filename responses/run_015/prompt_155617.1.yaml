  9.  (Wait, let's look closer at the "Verbal" option). Is it verbal? Devlin defines society as a moral community. Hart defines it as a political structure. If they agreed on definitions, would they agree? Probably not, because they still value liberty vs. order differently. So it's not *just* verbal. It's deeper. It's about the *conditions of existence* for a polity.

  10. (Finalizing the "Progress" section). If the data is contaminated, we can't use data. We have to use *reflective equilibrium*. Progress is realizing that *some* moral enforcement is inevitable (tax laws enforce fairness, murder laws enforce sanctity of life), so the question isn't *if* but *which*. This moves the debate from Hart-Devlin to a debate about *Public Reason* (Rawls) or *Civic Virtue*.

