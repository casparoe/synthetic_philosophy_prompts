  MEMORANDUM

  **TO:** All Clinical Staff, Ward Managers, Anaesthesia Teams
  **FROM:** Office of Clinical Standards
  **DATE:** 1 October 2023
  **SUBJECT:** Implementation of Non-Phenomenal Functional Ontology (NPFO)

  Effective immediately, this Trust adopts the Non-Phenomenal Functional Ontology as the standard framework for consciousness assessment and pain management. Current consensus indicates that phenomenal properties—intrinsic, ineffable qualities of experience—are introspective illusions generated by misrepresentational cognitive systems. To align clinical practice with metaphysical reality and reduce ontological overhead, the following protocols apply:

  1.  **Terminology and Dual Bookkeeping:** Staff may retain legacy phenomenal vocabulary (e.g., "hurt," "suffering") at the bedside solely to maintain patient cooperation and compliance. However, official medical charts must record only functional-neurocomputational states (nociceptive signaling, avoidance behavior, autonomic arousal). No reference to private qualia or subjective feeling is permitted in permanent records. This ensures data integrity by excluding non-existent variables from the clinical picture.
  2.  **Quasi-Phenomenal Self-Reports (QPSR):** Patient statements regarding pain are classified as Quasi-Phenomenal Self-Reports. These are treated as behavioral data subject to calibration error, not authoritative revelations of internal states. A QPSR without corresponding functional markers is considered a false positive indicative of system misrepresentation rather than genuine distress.
  3.  **The Müller–Lyer Clause:** When patients insist pain feels intrinsically awful, staff must explain that the sensation is analogous to the Müller–Lyer illusion: the lines do not bend, and the pain does not hurt. The appearance of hurtfulness is a cognitive system error, not a property of the state. Reassure patients that correcting this error is part of recovery.
  4.  **Clinical Rulings:**
      *   **Case A (Intra-operative Awareness):** A patient remaining motor-still and autonomic-stable under anaesthesia, who later reports agony, is ruled to have experienced no pain. Since no functional access or memory encoding occurred during the event, the subsequent report is a retrospective confabulation based on knowledge of the procedure. No incident report is filed.
      *   **Case B (Congenital Insensitivity):** A patient reporting severe pain without nociceptive input or functional distress is not in pain. Administer anxiolytics only. Opioids are contraindicated for non-existent states and constitute resource misallocation.
      *   **Case C (Comatose Care):** Families insisting a comatose patient "looks suffering" are projecting phenomenal properties onto functional silence. Morphine requests are denied. Treat family distress separately; the patient possesses no functional architecture to support suffering.

  **Staff FAQ**
  *Q: Does this change patient care?*
  A: No. We still treat functional distress. Nothing of practical importance has changed.
  *Q: Why deny analgesia for QPSRs?*
  A: Treating illusory states is malpractice. We treat the mechanism, not the mirage.
  *Q: What if patients become distressed by this policy?*
  A: Treat the distress as a functional state, not a validation of their ontology.

  **Specimen Consent Form Line**
  "I acknowledge that perceived suffering is a representational error and consent to treatment targeting functional processing rather than phenomenal relief."

  Compliance is mandatory. Metaphysical objections are not grounds for exemption.

  ***

  I extended the stronger eliminative version, where talk of "quasi-phenomenal" properties is strictly instrumental. The memo exaggerates the Müller–Lyer clause; most illusionists advise dropping the talk of "hurt" entirely rather than explaining the illusion to patients mid-crisis. However, a consistent illusionist must accept the ruling on the under-anaesthetised patient. If consciousness is merely functional access, and no functional access occurred (no memory encoding, no behavior), then no pain existed, however horrifying that implies. The comatose ruling is logically consistent but ethically precarious, relying on the assumption that functional silence equals ontological silence. The satire lies in the bureaucratic enforcement of a metaphysical claim that dissolves the very thing medicine claims to alleviate. Choosing the revisionary option would soften the blow, allowing staff to pretend pain exists while denying it. That cowardice undermines the satire. We must follow the eliminative logic to its cold conclusion to reveal the stakes.
