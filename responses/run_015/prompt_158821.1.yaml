      Effective immediately, this Trust adopts the Non-Phenomenal Functional Ontology as the standard framework for consciousness assessment. Current evidence indicates that phenomenal properties—intrinsic, ineffable qualities of experience—are introspective illusions generated by misrepresentational cognitive systems. To align clinical practice with metaphysical reality, the following protocols apply:

