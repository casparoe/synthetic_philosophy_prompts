answer: |-
  The most diagnostic question is whether the moral weight of welfare gains and losses is strictly additive across distinct persons.

  **Root Commitment:** We have a *pro tanto* moral reason to prevent suffering and promote well-being.

  1.  **Standard Monster Case:** Does one being's immense gain justify everyone else's total loss?
      *   **Yes:** Go to 2 (Aggregationists).
      *   **No:** Go to 5 (Non-Aggregators).

  2.  **Archival Monster Case:** Must we bring into existence a being whose life is barely worth living if it increases total utility?
      *   **Yes:** Go to 3 (Totalists).
      *   **No:** Go to 4 (Non-Totalists).

  3.  **Harsanyi Case:** Is the justification for aggregation grounded in rational choice behind a veil of ignorance?
      *   **Yes:** **Harsanyi-style aggregation**.
      *   **No:** **Total utilitarianism biting the bullet**.

  4.  **Reverse Monster Case:** Does preventing the Reverse Monster's suffering outweigh all possible pleasure for everyone else?
      *   **Yes:** **Negative or suffering-focused views**.
      *   **No:** **Average utilitarianism**.

  5.  **Reluctant Monster Case:** Must we cure the Reluctant Monster against its will to prevent a net loss of aggregate utility?
      *   **Yes:** Go to 6 (Constraints).
      *   **No:** Go to 7 (Welfare Modifiers).

  6.  **Empirical Case:** Is the Monster's psychology nomologically possible?
      *   **No:** **The empirical dismissal**.
      *   **Yes:** Go to 8 (Normative Constraints).

  7.  **Swarm Case:** Do ten million trivial gains outweigh one person's catastrophic loss?
      *   **Yes:** **Sufficientarian views**.
      *   **No:** Go to 9 (Weighting).

  8.  **Rule Case:** Would a rule forbidding sacrifice maximize utility in the long run?
      *   **Yes:** **Rule-consequentialist self-effacement**.
      *   **No:** **Nozickian side-constraints**.

  9.  **Threshold Case:** Is there a level of welfare below which trade-offs are strictly forbidden?
      *   **Yes:** **Lexical-threshold views**.
      *   **No:** **Prioritarianism**.

  ***

  **Unoccupied Combinations:** The path accepting the *Standard Monster* trade-off (Node 1: Yes) while rejecting the *Archival Monster* creation (Node 2: No) leads to Average Utilitarianism, but no theorist occupies the combination of accepting extreme sacrifice for existing persons while denying creation duties without appealing to average utility; this space is **merely unclaimed**. The path accepting the *Reluctant Monster* cure (Node 5: Yes) while accepting the *Swarm* trade-off (Node 7: Yes) is logically permitted by the branching but **incoherent**, as both judgments rely on conflicting premises regarding the separateness of persons.

  **Indistinguishable Leaves:** The tree cannot strictly separate **Prioritarianism** from **Sufficientarian views** using only the *Swarm* case, as both may reject the trade-off depending on the specific welfare levels involved; a case involving **risk allocation across identical welfare levels** would separate them by testing whether moral weight diminishes continuously (Prioritarianism) or only below a cap (Sufficientarianism).
