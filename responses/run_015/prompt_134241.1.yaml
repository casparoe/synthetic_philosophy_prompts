      *Revised Plan for "Powers Move Evaluation":* It is a **substantive re-categorization** that *can* work, but only if you deny that mental and physical powers are *distinct competing powers*. If they are distinct, you have overdetermination. If they are the same, you have reduction. The user needs to navigate this middle path.

      *Final Recommendation:* Adopt **Subset Realization** or **Determinable-Based Physicalism**. This modifies (2) slightly to clarify the realization relation.

