answer: |-
  **Project Title:** Diagnosing the Trap: Distinguishing Choice Escalation from Selection Pressure

  **The Question**
  When a group gets stuck in an arms race—LLM-generated cover letters, bid inflation in ad auctions, citation chasing—why do coordination-based interventions fail? I'm testing a specific hypothesis: most "multipolar traps" are misdiagnosed. We treat them as Prisoner's Dilemmas (where everyone chooses to defect and could theoretically coordinate to cooperate) when they are actually Selection Traps (where non-escalators are filtered out by the environment, regardless of intent).

  The project asks: **Can we reliably distinguish between escalation driven by strategic choice versus escalation driven by differential survival, and does this distinction predict which interventions will fail?**

  **Why the Standard Framing Fails**
  The popular "Moloch" or "race to the bottom" framing assumes a unified preference: everyone wants the escalation to stop. This leads to solutions focused on norms, handshake agreements, or voluntary restraint.

  This fails for two reasons. First, it ignores selection pressure. In a hiring market, if one candidate uses an LLM and gets the interview, the candidate who refuses on principle doesn't get a seat at the table to agree to norms. They just disappear. You can't coordinate your way out of a filter. Second, it ignores extraction. In many cases, "everyone wants to stop" is false. The platform selling the ad space, the vendor selling the screening tool, or the journal charging publication fees benefits from the escalation. If there's a profiteer, the trap isn't a tragedy; it's a business model.

  Treating a Selection Trap as a Choice Trap wastes resources on coordination that won't hold. Treating an Extraction Trap as a Coordination Trap legitimizes the profiteer. We need a diagnostic that separates these mechanisms before suggesting a fix.

  **Method & Cases**
  I have roughly 25 days of work over six months. I won't be building economic models; I'll be mapping mechanisms. I will take three active escalation cases and run them through a comparative framework to see if the "Choice vs. Selection vs. Extraction" distinction holds water.

  1.  **LLM Hiring Screens (Current Experience):** I will map the hiring funnel. Who decides the criteria? Is the use of LLMs detected? If a candidate submits raw text, do they get filtered by software or by humans? I'll interview 5-10 hiring managers and candidates to determine if the escalation is driven by candidate choice (trying to win) or selector filtering (automated rejection of non-optimized inputs).
  2.  **Local Ad Auctions (Partner's Bakery):** I will analyze the bid history and platform structure. Is the cost-per-acquisition rising because competitors are bidding aggressively (choice), or because the algorithm deprioritizes lower bids regardless of conversion quality (selection)? Who captures the surplus—the bakery or the ad platform?
  3.  **Academic Metrics (Publishing/Citations):** A secondary desk case. Is the push for higher citation counts driven by researchers wanting prestige (choice) or by tenure committees filtering out low-count candidates (selection)? Who profits? (Publishers vs. Universities).

  Across these three, I will compare:
  *   **Exit Conditions:** Who leaves the game? Do they leave voluntarily or get removed?
  *   **Surplus Flow:** Who captures the value generated by the escalation?
  *   **Intervention History:** What attempts to stop the escalation have been tried, and why did they fail?

  **Deliverable**
  A **Trap Diagnostic Toolkit**. This won't be a paper; it will be a practical flowchart or checklist for someone stuck in one of these situations (e.g., a hiring manager, a board member, a small business owner).

  It will ask:
  1.  **Can participants opt out without exiting?** (If no, it's Selection).
  2.  **Is there a third party capturing the cost?** (If yes, it's Extraction).
  3.  **Do participants know each other?** (If no, Coordination is impossible).

  Based on the answers, the Toolkit recommends an intervention class:
  *   *Choice Trap:* Change payoffs, enable communication, establish norms.
  *   *Selection Trap:* Change the filter criteria, blind the selection, reduce variance.
  *   *Extraction Trap:* Regulate the vendor, switch platforms, internalize the tool.

  **Failure Conditions**
  I will count this project as a failure if:
  1.  **Hybrid Ambiguity:** The cases turn out to be such deep hybrids of choice and selection that the distinction doesn't lead to different interventions. If "change the filter" and "coordinate norms" end up being the same advice, the typology is useless.
  2.  **Too Abstract:** The Diagnostic Toolkit ends up being theoretical rather than actionable. If a hiring manager can't use it to decide whether to ban LLMs or change interview structures, it hasn't met the brief.
  3.  **Data Access:** I cannot get enough visibility into the ad auction algorithms or hiring filters to determine where the selection pressure actually sits.

  **Feasibility & Scope Check**
  Is this too big for 25 days? Yes, if I try to solve the cases. No, if I strictly limit myself to *diagnosing* them.

  The risk is scope creep on the case studies. I could spend all 25 days just trying to get data from the ad platform. To fit the constraint, I will limit primary data collection to the hiring committee (where I have access) and use public documentation plus partner experience for the ad auctions. The academic case will be purely desk research.

  If the three cases prove too heavy, the fallback version is to drop the academic case and deepen the hiring/ad analysis, producing a narrower "Private Sector Escalation Diagnostic" rather than a general toolkit. However, I believe the third case is necessary to prove the framework isn't just about markets. The scope holds if I resist the urge to propose solutions for the cases themselves and focus entirely on building the diagnostic tool.
