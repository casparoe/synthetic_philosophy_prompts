  **INSTITUTE FOR NON-EMPIRICAL THEORY ASSURANCE**
  **Call for Proposals: 2027 Grant Round**
  **Programme: Post-Empirical Theory Confirmation Framework (PETCF)**

  **1. Eligibility**
  Proposals must address fundamental physics regimes where direct empirical testability is unavailable on any foreseeable timescale. Applicants must demonstrate that their research programme operates strictly within the non-empirical domain. Projects seeking to bridge the empirical gap via phenomenological modeling are ineligible. The Institute funds the assurance of theoretical structures, not their experimental validation. Eligibility is contingent upon the explicit renunciation of near-term observational testing.

  **2. Review Criteria and Weighting**
  Proposals are scored on three confirmed non-empirical arguments. Each is rated on a scale of 1 (weak) to 5 (robust).
  *   **No-Alternatives Argument (NAA) [40%]:** Evidence that no comparably successful competitor has been found despite sustained search by the community.
  *   **Unexpected Explanatory Coherence (UEC) [40%]:** Evidence that the theory delivers internal connections it was not constructed to deliver.
  *   **Meta-Inductive Argument (MIA) [20%]:** Evidence that research programmes possessing NAA and UEC features have historically turned out to be on the right track.

  **Composite Score Formula:** $S = (NAA \times UEC) / T$, where $T$ is the number of retained testable implications.
  *Footnote 1:* For most applicants, $T=0$. The standing convention is then to treat the score as unbounded, reflecting maximal theoretical security.

  **3. Admissible and Inadmissible Evidence**
  Admissible evidence consists of sociological and structural facts about the research community and the theory itself. Proposed experiments, observations, phenomenological work, and any derived prediction about the observable world are classified as Inadmissible Evidence. Committing to testability now would lock the programme into the accidental features of present instrumentation and foreclose its deeper insights.

  Proposals yielding testable predictions are referred for Premature Empirical Closure review. If upheld, the proposal is defunded. A prediction is a liability, a hostage the theory can lose. Applicants must not offer the theory up for falsification. Security is prioritized over contact with the contingent world.

  **4. Reporting Requirements**
  Applicants must state what fraction of the landscape of vacua their proposal renders anthropically disfavored. Despite the lack of an agreed way to count vacua and hence no well-defined measure over which that fraction could be taken, applicants must normalize in the manner standard in their subfield and report a sensitivity band across at least three measures. This is a solved problem of reporting hygiene.

  Credit claimed for accommodating data the theory was built to fit must be declared retrofitted and discounted to zero confirmatory value. The Committee observes, without discomfort, that nearly all of the programme's contact with observation is of this kind.

  Finally, a mandatory Cognitive Stability Attestation is required. Applicants must certify that their proposal does not imply that the reader's own observations are almost certainly random fluctuations in a thermal bath. This attestation was introduced because several previous awards did imply exactly this and were nonetheless confirmed.

  **5. Worked Example of Two Ranked Proposals**
  **Proposal A (Ranked 1, Funded):** Retires a large region of the landscape using anthropic selection. Reports the disfavored fraction as a three-measure sensitivity band. $T=0$. Score is unbounded. The proposal successfully isolates the theory from empirical risk while demonstrating internal coherence.
  **Proposal B (Ranked Last, Declined):** Computes a sharp falsifiable prediction about the cosmic microwave background. Docked for Premature Empirical Closure. Penalized for being in principle disconfirmable and therefore speculative. The presence of $T>0$ reduces the Composite Score to a finite, insecure value.

  **6. External Reviewer Comment, with the Committee's Response**
  **Reviewer:** A framework that insulates a theory from every possible observation cannot be confirming it; calling the structure of a research programme evidence does not make it evidence; and the framework, scored by its own criteria, would do very well.
  **Committee Response:** The Committee notes this is the only objection of its kind received during the consultation period. No alternative framework has been proposed that offers comparable security against empirical refutation. The absence of competitors satisfies the No-Alternatives Argument criterion regarding the framework itself, strengthening our confidence in its adoption. The objection is dismissed.
