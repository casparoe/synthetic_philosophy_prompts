prompt: |-
  hey can u write me a short story about whether an ant colony can actually have a mind? im thinking of that aunt hillary ant fugue concept but dont just copy it. heres a weird twist: the colony lives in an old radio tower and they maintain one collective memory that only works when enough ants stay inside. tell it from the view of one ant who wanders out and realizes her thoughts get fuzzy and she cant remember her name unless shes near the hive. she starts wondering if shes a person or just like a brain cell for the colony. keep it grounded, no aliens or magic, maybe 400-600 words. please no bibliography or citation list at the end, just the story. im in high school so dont make it sound like a textbook.
