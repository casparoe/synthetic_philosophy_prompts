answer: |-
  This procedure is designed for the three-person triage panel to operate within a forty-eight-hour window when an emerging contaminant is detected in raw or treated water without a established health-based value. Its purpose is not to generate new science but to structure uncertainty so that decisions are consistent, defensible, and aware of their own downstream consequences. The process begins with verification, moves through hazard and exposure profiling, weighs the risk of the intervention itself, and concludes with a decision matrix that explicitly identifies where human values must override factual analysis. You must treat this document as a living tool that forces you to articulate why you are acting or not acting, rather than allowing intuition to drive the outcome under pressure.

  The first step is data validation and trend analysis. Before considering health effects, you must confirm the analytical result is robust and not an artefact of sampling or laboratory error. Once confirmed, you must establish the trajectory. Is this a one-off spike, a stable background presence, or a creeping increase? You will record the concentration, the detection limit, and the rate of change over the last available monitoring period. This step addresses the two-file problem by forcing you to contextualise the new data against the history of the supply. You must explicitly state whether the detected substance represents a new risk or merely a newly measured version of an old risk. If the substance has been present historically but unmeasured, you must note that the risk is not new, only the visibility is. This prevents the panel from over-attending to the newly measured compound simply because it has a file, while ignoring legacy contaminants that remain unmeasured. You are required to compare the estimated risk of the new contaminant against the accepted background risk of the water supply itself. If the new contaminant poses a lower theoretical risk than the unmeasured legacy background you have deemed acceptable for thirty years, you must document why acting on the new substance does not constitute an inconsistency in your safety standards.

  The second step is hazard characterisation using surrogate benchmarking. Since you will often lack a health-based value, you cannot wait for one. You must identify the mode of action from whatever toxicological data exists, even if it is limited to high-dose animal studies. You will group the substance with structurally or functionally similar compounds that do have health-based values and use the most conservative of those values as a temporary proxy. If no surrogate exists, you will use the lowest observed effect level from any available study and apply a safety factor of at least one thousand to derive a provisional screening level. This is not a safe limit but a trigger for discussion. Alongside this, you must assess the potential severity of the health outcome. This is where you resolve the disagreement regarding the reversibility test. The procedure dictates that you do not guess whether harm is reversible; instead, you classify the harm based on its nature. If the mode of action suggests carcinogenicity, developmental toxicity, or permanent organ damage, you must treat the harm as irreversible for the purpose of this triage. If the mode of action suggests transient irritation or reversible metabolic changes, you treat it as reversible. This satisfies the public health consultant's concern that uncertainty should not paralyses action, while giving your colleague Dave a concrete criterion rather than a philosophical debate. If the harm is classified as potentially irreversible, the threshold for action lowers. If it is classified as reversible, the threshold rises, requiring higher confidence in the exposure data before intervening.

  The third step is the intervention risk assessment, which applies the precautionary principle to your own remedy. You must recognise that issuing a do-not-drink advisory or distributing bottled water carries its own health and social risks. You will draft a brief remedy impact statement that outlines the consequences of the proposed action. This must include the logistical feasibility of bottled water distribution, the risk of people switching to untested private sources, the financial cost to vulnerable households, and the environmental impact of plastic waste. You must also consider specific advice risks, such as whether boiling water would concentrate the contaminant. If the intervention creates a high probability of tangible harm to a specific group, such as forcing dialysis patients to rely on unverified bottled water supplies, you must weigh this against the theoretical risk of the contaminant. The procedure requires that the certainty of the intervention harm be weighed against the uncertainty of the contaminant harm. If the intervention harm is certain and significant, and the contaminant harm is speculative and low-severity, you must default to monitoring rather than advisory. This ensures that you are not so precautionary about the chemical that you become reckless about the solution.

  The fourth step is the decision matrix. Based on the outputs of the previous steps, you will land on one of four outcomes. Do nothing is selected if the concentration is below the provisional screening level, the trend is stable or declining, the harm is reversible, and the intervention risk is high. Step up monitoring is selected if the concentration is approaching the screening level, the trend is increasing, or the hazard file is too thin to rule out severe harm, but the intervention risk outweighs the immediate benefit of an advisory. Issue precautionary advisory is selected if the concentration exceeds the screening level, the harm is classified as potentially irreversible, and the intervention risk is manageable. Advise not to drink is selected only if the concentration vastly exceeds the screening level, the harm is severe and likely irreversible, and the intervention risk is lower than the risk of continued exposure. At this stage, you must also identify the values handoff. The procedure cannot calculate the acceptable balance between economic cost and health uncertainty. If the decision hinges on whether the cost of bottled water distribution is justified by a one-in-a-million reduction in cancer risk, the procedure stops. You must flag this explicitly to the public health consultant and the regulator. You are providing the risk profile; they must provide the risk tolerance. The procedure ensures you do not pretend this is a scientific calculation when it is actually a societal choice.

  The fifth step is communication preparation. The communications team requires one unambiguous sentence. You must draft this sentence based strictly on the decision outcome, without hedging. If the decision is to monitor, the sentence must not imply danger. If the decision is an advisory, the sentence must specify the group and the action. You are not allowed to use language that suggests certainty where none exists, nor are you allowed to minimise risk to avoid alarm. The sentence must reflect the decision matrix output exactly. Finally, you must record the limitations of the procedure. It cannot generate toxicological data. It cannot resolve political pressure from councillors or Facebook groups. It cannot override the regulator's statutory powers. It is a triage tool, not a final judgment. It is designed to prevent inconsistency, not to guarantee correctness. You must archive the reasoning, the surrogate values used, and the remedy impact statement for future review when better science becomes available.

  When we run this procedure against the three composite cases, the outcomes reveal where your current instincts may be misaligned with a consistent framework. In Case A, the solvent is detected at 2 micrograms per litre against a health-based value of 30. The trend is creeping up at 5 per cent a year. Under the procedure, step one confirms the data and notes the trend. Step two uses the existing health-based value as the screening level. The concentration is well below the limit. Step three assesses the intervention risk; issuing an advisory for a compliant substance would cause unnecessary panic and cost. Step four lands on step up monitoring. You will increase sampling frequency to confirm the trend and review the origin of the health-based value to ensure it is not outdated. This is a comfortable outcome, as it aligns with regulatory compliance while acknowledging the trend.

  In Case C, the algae metabolite presents zero toxicological concern but high sensory impact and public pressure. Step one confirms the substance is natural and transient. Step two classifies the hazard as negligible. Step three notes that boiling or bottled water advice would be scientifically incorrect and wasteful. Step four lands on do nothing regarding health advice. However, the procedure flags the values handoff regarding public trust. While the health risk is nil, the social risk is high. The procedure dictates that you do not issue a health advisory, but you must pass the communication need to the team to address the taste and smell without implying poisoning. This prevents you from medicalising a sensory problem. This is also a comfortable outcome, as it prevents you from validating the Facebook group's claims with a health warning.

  Case B is the uncomfortable one. The replacement fluorinated compound has no health-based value, shows liver effects in rats at high doses, is detectable in everyone's blood, and the source is still active. Under your current informal system, you might hesitate to act because the evidence is thin and the regulator has not set a limit. However, the procedure forces a different path. Step one confirms an active source and universal detection, implying continuous exposure. Step two finds no surrogate value, so you derive a provisional screening level from the rat study with a massive safety factor. Given the bioaccumulative nature and liver effects, step three classifies the potential harm as potentially irreversible due to the nature of organ damage and persistence in blood. Step four assesses the intervention risk. While bottled water is costly, the exposure is universal and the source is active. The procedure lands on issue precautionary advisory to vulnerable groups, specifically pregnant women and those with pre-existing liver conditions, while stepping up monitoring for the general population. This is the outcome you would rather not have because it admits that you are acting on thin evidence. It implies that your previous inaction on similar emerging contaminants was wrong. It forces you to tell the public there might be a problem when you cannot prove there is one. It exposes you to criticism from the industry and potentially the regulator for moving ahead of the science. But the procedure dictates that the combination of universal exposure, active source, and potential irreversibility outweighs the lack of a precise health-based value. If you follow this procedure, you must accept that Case B requires action now, and that waiting for definitive science would violate the reversibility weighting you agreed to.

  This highlights the specific limitation where the procedure must stop and hand the decision to a human. In Case B, the decision to issue an advisory despite the lack of a health-based value is a values call. It prioritises potential long-term health over immediate economic and reputational cost. The procedure can show you that the risk profile warrants it, but it cannot tell you if your company is willing to bear the cost of being wrong. That decision belongs to the senior leadership and the public health consultant. The procedure ensures they make that choice with eyes open, understanding that doing nothing is also a choice with a risk profile. The procedure cannot protect you from the anger of being wrong either way. If you act and the substance is harmless, you waste money and cause anxiety. If you wait and the substance is harmful, you expose people to risk. The procedure simply ensures that whichever path you choose, you chose it for the same reasons you would have chosen it last year or will choose it next year.

  There are things this procedure simply cannot do for you. It cannot absorb political pressure. When a councillor demands bottled water for Case C, the procedure will tell you there is no health basis for it, but it cannot stop the councillor from demanding it anyway. You will still have to manage that conflict outside the triage process. It cannot fix the two-file problem entirely. While it forces you to compare new risks to background risks, it cannot generate data on the legacy contaminants you have never measured. You will still be making decisions with an incomplete picture of the total burden of contamination. It cannot resolve the fundamental tension between Dave's reversibility test and the public health consultant's view. It bridges them with a classification system, but if the mode of action is unknown, you will still have to guess whether to treat it as reversible or irreversible. In those instances, the procedure defaults to assuming irreversibility for persistent bioaccumulative substances, which biases towards action. You must accept this bias as the cost of operating under uncertainty. Finally, it cannot replace the regulator. You are advising, not deciding statutory limits. If the regulator disagrees with your precautionary advisory in Case B, you must defer to them, but the procedure ensures you have documented why you proposed it.

  The uncomfortable truth revealed by running Case B through this system is that consistency requires you to act sooner than feels comfortable. If you accept the logic that potential irreversibility and active sources warrant precaution despite thin files, then you must admit that past inaction on similar substances was likely a failure of courage rather than a failure of science. You have been waiting for certainty that the procedure now tells you you will never have. Conversely, if you decide Case B warrants waiting, you must admit that the procedure's bias towards action is too aggressive for your risk appetite. You cannot have it both ways. You cannot claim to be precautionary while waiting for definitive health-based values for every emerging contaminant. The procedure forces you to choose which risk you fear more: the chemical or the consequence of acting on uncertainty. For the sake of the nine hundred thousand customers, you must write down that choice now, before the next alert arrives.
