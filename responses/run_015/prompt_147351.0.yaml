      *   *Point 3 (Two-File Problem):* Bias towards new data. *Resolution:* The procedure must explicitly compare the *new* contaminant against the *baseline risk* of the water supply itself (including legacy unknowns). It needs a "status quo bias check." Just because we measured X doesn't mean X is worse than the unmeasured Y we've always had.
