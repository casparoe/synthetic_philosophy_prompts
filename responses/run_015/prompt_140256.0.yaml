prompt: |-
  hey — i got roped into writing the practice exam for my school's philosophy/econ club and i need one essay question on why some countries are rich and others arent. context: everyone in the club is 16-17, nobody has read any actual papers, and the room we sit in has no wifi and no library books. so the question and the model answer both have to be totally self-contained: no real-world examples, no "as economist X argued in year Y", no reading lists. everything has to come from the case i give plus reasoning. 45 minutes, 20 marks total.

  the problem is that everyone has absorbed the same one-word answer off the internet — "institutions" — and i can already see six identical essays coming: a paragraph on institutions, a paragraph on geography, a paragraph on culture, conclusion "its mostly institutions", 14/20 for everyone. i want a question where that gets you like 6.

  so i drafted a made-up case to build the question around. use it, fix it if its badly designed, or throw it out and build a better one:

  Meridia is an island, one language, one mix of farming and fishing, fairly even rainfall and soil, no known gold/coal/oil. In 1891 a colonial governor splits it in two with a straight line drawn on a badly printed map; because of the misprint the line lands about 40km north of where he meant it. Nothing real changes as you cross it — same soil, same crops, the same families end up on both sides. One governor, one legal code, one school system until independence in 1960, then two countries, North Meridia and South Meridia, with word-for-word the same constitution, the same elections every five years, the same laws about property, contracts and taxes on paper. Today income per person in North is about four times what it is in South. Assume these are all true:

  (a) In North a road contract normally goes to the lowest bidder. In South it normally goes to someone the minister is related to. In both places over 90% of people tell surveyers that corruption is wrong.
  (b) In 1970 a big oilfield was discovered in South — the poorer half. Most of the money appears to have ended up in private bank accounts abroad.
  (c) On survey questions like "do you trust your neighbours", "is hard work important", "how religious are you", North and South give basically the same answers.
  (d) In North every district office has kept a written, public register of who owns which piece of land, continuously since 1893. In the South nobody does. The reason it started in North: the district officer posted there in 1893 happened to be a man who liked filing things, trained two clerks, they trained two more, and the habit stuck. In the South the officer posted that year was transferred after three months.

  the kinds of things im hoping the question forces people into, if theyre any good (use your own if youve got better ones): whether "institutions" here means the rules on paper or the rules actually followed, and what would have to be true for "institutions did it" to be false rather than just definitional; the fact that (d) makes the institutional difference itself something that needs explaining and traces it back to a small fluke, so "the cause" might be a contingent chain instead of a factor; whether the causal claim is supposed to be "in general, elsewhere, in other cases" or just "here", and what one case can and cant establish; whether "why is North rich" and "why is North richer than South" and "what should we change" are even the same question; and how (b) messes with a simple resources story.

  i was also thinking of adding a part b where you imagine re-running history from 1891 a hundred times and asking what the pattern of outcomes would tell you — no idea if that helps or just confuses people, you decide.

  what i want back: the actual exam question (one question, part b if you think its worth it), a model answer of about 600-700 words, and a marking scheme with 4 or 5 must-hit points, how many marks each is worth (20 total), and one line each on the mistake people will actually make that loses them those marks. then a short note on what separates an A (17+) from a B (13-16) — a specific move the A answer has to make, not just "more detail" or "neater writing". and tell me if my case is broken in some way that lets a memorizer off the hook.
reasoning: |-
  Here's a thinking process that leads to the suggested exam materials:

  1.  **Analyze the Request:**
      *   **Target Audience:** 16-17 year old Philosophy/Econ club members. No prior academic reading, no internet/books during the exam.
      *   **Task:** Create one essay question + model answer + marking scheme based on a provided case study (Meridia).
      *   **Constraint:** The question must prevent the generic "Institutions vs. Geography vs. Culture" essay that gets everyone 14/20. It needs to force deeper reasoning about *what* institutions are, *how* they emerge, and the limits of causal inference from a single case.
      *   **Time/Marks:** 45 minutes, 20 marks.
      *   **Input Material:** The "Meridia" case study (split island, identical geography/culture/initial laws, divergent outcomes due to administrative habits/corruption/oil).
      *   **Specific Goals:** Force students to distinguish between *de jure* (on paper) and *de facto* (in practice) institutions, address the origin of institutional differences (path dependence/fluke), handle the resource curse (oil), and recognize limits of generalization.
      *   **Deliverables:** Finalized Question, Model Answer (600-700 words), Marking Scheme (4-5 points, 20 marks total), Differentiation (A vs. B), Critique of the Case.

  2.  **Evaluate the "Meridia" Case:**
      *   *Strengths:* It controls for geography (same island), culture (same people), and *de jure* institutions (same constitution). It isolates *de facto* institutional quality (corruption, land registry). It introduces a "resource curse" confounder (oil in the poor South). It highlights path dependence (the clerk who liked filing).
      *   *Weaknesses:* It's a bit "leading." It practically screams "Institutions!" but the prompt wants to punish the lazy "Institutions!" answer. The challenge is to frame the question so that simply saying "Institutions" isn't enough. The student needs to define *which* institutions and *why* they differ.
      *   *Fix:* The question needs to explicitly ask about the *explanation* of the divergence, forcing them to grapple with the fact that the "institutional" explanation relies on a historical accident (the clerk), which challenges the idea of institutions as a stable, deep cause. Also, need to address the Oil factor (b) to ensure they don't just ignore it.
      *   *Part B Idea:* The "re-running history" idea is excellent for philosophy/econ. It tests understanding of determinism vs. contingency. If the outcome depends on a random clerk, is "institutions" a reliable theory? I'll include a modified version of this as a sub-question to deepen the philosophical angle without overcomplicating the writing task.

  3.  **Drafting the Question:**
      *   Need to keep it tight for 45 minutes.
      *   Main Prompt: "Explain the divergence."
      *   Constraint: "Do not simply list factors. Evaluate the claim that 'Institutions caused the difference' in light of facts (a)-(d)."
      *   Part B: The counterfactual history question.
      *   *Refinement:* Let's make it one cohesive prompt with two required elements to ensure flow, rather than distinct Part A/Part B which might eat up time on formatting. Actually, distinct parts help structure the marking. Let's stick to a Main Question + a specific follow-up instruction.
      *   *Decision:* Keep it as one essay question but mandate addressing the "contingency" of the institutions.
      *   *Revised Plan:* One prompt: "Assess the claim: 'The economic divergence between North and South Meridia is caused by institutional quality.' In your answer, you must address whether this explanation is circular, and what fact (d) implies about the ultimate cause of wealth."

  4.  **Drafting the Model Answer:**
      *   *Word Count:* 600-700 words.
      *   *Key Arguments:*
          1.  Distinguish *de jure* (same) vs. *de facto* (different).
          2.  Address the "Circularity" trap (Rich = Good Institutions vs. Good Institutions = Rich).
          3.  Address Fact (d): The "Clerk Fluke." This moves the cause from "Institutions" to "Historical Contingency/Path Dependence."
          4.  Address Fact (b): Oil didn't save South (Resource Curse/Incentives).
          5.  Conclusion: Institutions are the *proximate* cause, but historical chance is the *fundamental* cause.
      *   *Tone:* Analytical, clear, no jargon without definition.

  5.  **Drafting the Marking Scheme:**
      *   Total 20 marks.
      *   Need 4-5 distinct points.
      *   1. *De Jure* vs. *De Facto* distinction (4 marks).
      *   2. Handling the "Circularity" definition problem (4 marks).
      *   3. Analyzing Fact (d) as Path Dependence/Contingency (6 marks) - *This is the differentiator.*
      *   4. Handling the Oil/Resource distraction (Fact b) (4 marks).
      *   5. Structure/Clarity (2 marks).
      *   *Wait, 4+4+6+4+2 = 20.* Perfect.
      *   *Common Mistakes:* Need to specify what loses marks for each.

  6.  **Differentiation (A vs. B):**
      *   B Grade: Identifies *de facto* institutions matter more than laws.
      *   A Grade: Recognizes that tracing institutions back to a random clerk undermines "Institutions" as a deep, stable explanation (the "Ultimate Cause" vs. "Proximate Cause" distinction).

  7.  **Critique of the Case:**
      *   Is it broken? It's actually quite strong because it controls variables well.
      *   Risk: Students might ignore the prompt's nuance and just write "Corruption bad."
      *   Mitigation: The marking scheme must penalize the generic "Institutions good" essay heavily. The prompt must explicitly warn against it.

  8.  **Review against Constraints:**
      *   No outside knowledge needed? Yes.
      *   Self-contained? Yes.
      *   45 mins? Yes, word count is manageable.
      *   Prevents the "14/20 clone"? Yes, by rewarding the analysis of *origin* (fact d) rather than just *existence* of institutions.

  9.  **Final Polish:**
      *   Ensure the Model Answer sounds like a smart 17-year-old, not a PhD.
      *   Check the marking scheme clarity.
      *   Refine the Part B idea. I think integrating the "re-run history" thought experiment into the main essay requirement is better than a separate Part B, as it encourages a unified argument. I will phrase the prompt to require considering "whether the outcome was inevitable."

      *(Self-Correction during drafting)*: I initially thought about making Part B separate. But for a 45-min essay, one cohesive argument is better. I will embed the "counterfactual" requirement into the main prompt instructions.

      *(Refining the "Circularity" point)*: The prompt asks to evaluate the claim. A smart student should notice that saying "Institutions caused wealth" is weak if "Institutions" is just defined as "whatever rich countries have." The Meridia case helps avoid this because we *see* the specific mechanism (land registry vs. corruption). I need to make sure the model answer highlights that we have *mechanism* evidence, not just correlation.

      *(Refining the "Clerk" point)*: This is the crux. If the difference is a random clerk, can we say "Institutions" are the cause? Or is "Chance" the cause? This is the philosophical meat.

      *(Final check on Marking)*: Make sure the "Generic Institution Essay" gets capped at 10/20.

      Let's assemble.

      *Wait, one more check on the Prompt:* The user wants to know if the case is broken.
      *Critique:* The case is strong, but Fact (b) (Oil) is a bit of a red herring that might confuse 16-year-olds into thinking "Resources matter." I need to ensure the Model Answer explicitly dismisses it as a *sufficient* cause because the North is rich *without* oil, and South is poor *with* it. It reinforces the institutional argument (incentives to steal). I will make sure the marking scheme rewards handling this correctly.

      *Wait, Part B:* The user specifically asked about Part B ("re-running history"). I should probably include it as a distinct sub-question because it forces a specific mode of thinking (probabilistic vs deterministic) that might get lost in a general essay. I'll add it as a required paragraph within the essay to ensure it's addressed without splitting the marks too thinly. Actually, a distinct Part (b) is clearer for marking. I'll do that. 15 marks for Part (a), 5 marks for Part (b).

      *Re-evaluating Part B:* 5 marks for a thought experiment might be too little. Let's keep it one essay question but mandate the counterfactual analysis within it. No, the user asked "I was also thinking of adding a part b... you decide." I will decide to include it as a specific sub-question because it structures the time better. 45 mins is tight. Let's make it one question with two required components to avoid "Part A / Part B" fragmentation which eats time. I will phrase the prompt to *require* the counterfactual analysis.

      *Actually, looking at the marking scheme:* 4-5 points.
      1. De Jure vs De Facto.
      2. Mechanism (Corruption/Registry).
      3. The "Fluke" (Fact D) & Contingency.
      4. The Oil Red Herring (Fact B).
      5. Conclusion/Synthesis.
      This works.

      Let's write it.
answer: |-
  ### The Exam Question

  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Question:**
  Using only the information provided in the Meridia case, assess the following claim:

  > *"The economic divergence between North and South Meridia is caused by differences in institutional quality."*

  In your answer, you must:
  1.  Distinguish between the institutions written in law and the institutions actually practiced.
  2.  Explain what Fact (d) (the district officer) implies about whether this outcome was inevitable or accidental.
  3.  Explain why Fact (b) (the oil discovery) does not disprove the claim above.

  ***

  ### Model Answer (Approx. 650 words)

  The claim that institutional quality caused the divergence between North and South Meridia is largely correct, but only if we define "institutions" carefully. If we mean the laws written on paper, the claim is false. If we mean the rules actually enforced in daily life, the claim is true. However, Fact (d) complicates the story by suggesting the ultimate cause was not a deliberate choice of institutions, but a historical accident.

  First, we must distinguish between *de jure* (on the books) and *de facto* (in practice) institutions. The case states that at independence, both countries had "word-for-word the same constitution" and laws regarding property and contracts. If institutions were merely legal codes, North and South should have identical economies. They do not. Therefore, the relevant institutional difference is not the law itself, but the enforcement. Fact (a) illustrates this: in the North, contracts go to the lowest bidder (rule of law); in the South, they go to the minister's relative (rule of man). Even though 90% of people in both countries believe corruption is wrong, only the North acts on that belief systematically. This proves that shared culture or written laws are insufficient for wealth; the *enforcement mechanism* is the decisive institutional variable.

  Second, we must address the origin of this difference. A standard institutional argument suggests that rich countries choose better rules. Fact (d) undermines this. The land registry system in the North—a key foundation for property rights and investment—was not created by a wise leader or a cultural superiority. It began because one district officer in 1893 "happened to be a man who liked filing things." In the South, the officer was transferred early. This implies the divergence is path-dependent. The "cause" of wealth is not necessarily a deep, stable trait of the North, but a small, contingent fluke that compounded over 70 years. If we re-ran history from 1891, the South might easily have become the rich half. Therefore, while institutions are the *proximate* cause of the current wealth gap, historical contingency is the *fundamental* cause. To say "institutions caused it" risks implying the North made a superior choice, when they actually just got lucky with a clerk.

  Third, Fact (b) regarding the oil discovery in the South might seem to suggest that resources, not institutions, determine wealth. South has oil and is poor; North has no oil and is rich. This actually strengthens the institutional argument. Oil revenue is a potential resource, but it only translates to national wealth if institutions manage it. In the South, the institutional failure described in Fact (a) (corruption/nepotism) meant the oil money was stolen and moved abroad rather than invested. In a high-quality institutional environment, oil wealth would likely have been preserved. The fact that South remained poor *despite* a windfall proves that without the institutional framework to manage resources, natural wealth cannot generate sustained income. Thus, the oil is a red herring; it tests the institutions, and the South's institutions failed the test.

  In conclusion, the claim is valid only if "institutions" refers to enforced practices rather than written laws. The North is rich because it enforces contracts and property rights; the South is poor because it does not. However, Fact (d) warns us against viewing this as a moral or cultural triumph. The institutional gap originated from a random administrative accident. Therefore, the full explanation is not just "institutions matter," but "small historical accidents can lock into place institutional paths that determine economic destiny." The oil discovery confirms this by showing that resources cannot fix broken institutional incentives.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Distinction between *De Jure* and *De Facto* Institutions (4 Marks)**
  *   **Full Marks:** Explicitly notes that written laws/constitutions were identical (Fact: same constitution), so the difference must be in enforcement/practice (Fact: bidding vs. nepotism).
  *   **Common Mistake:** Treating "institutions" as a single blob and saying "North has better laws," ignoring the prompt's statement that laws were identical.

  **2. Analysis of Fact (d) – Contingency vs. Design (6 Marks)**
  *   **Full Marks:** Identifies that the institutional difference started with a random event (the clerk's hobby/transfer). Argues that this makes the outcome "accidental" or "path-dependent" rather than a result of superior planning or culture.
  *   **Common Mistake:** Ignoring Fact (d) entirely, or using it just to say "North has better records" without analyzing the *origin* of that difference.

  **3. Handling the Oil/Resource Red Herring (Fact b) (4 Marks)**
  *   **Full Marks:** Explains that oil didn't make South rich because bad institutions (corruption) allowed the money to be stolen. Resources require institutions to be productive.
  *   **Common Mistake:** Arguing that oil proves resources *don't* matter at all, or conversely, that oil proves the institutional theory is wrong because South has resources and is still poor.

  **4. Synthesis/Conclusion on Causality (4 Marks)**
  *   **Full Marks:** Concludes that institutions are the *mechanism* of wealth, but chance/history is the *root* cause. Avoids saying "North is better," instead saying "North is luckier/different path."
  *   **Common Mistake:** A moralizing conclusion (e.g., "North worked harder" or "South is corrupt") which contradicts Fact (c) regarding culture/trust.

  **5. Structure and Clarity (2 Marks)**
  *   **Full Marks:** Logical flow, clear paragraphs, no external knowledge imported.
  *   **Common Mistake:** Disorganized rambling or importing outside examples (e.g., "This is like North vs South Korea").

  ***

  ### Differentiation: What separates an A (17+) from a B (13-16)?

  **The B Answer** correctly identifies that *enforcement* matters more than *laws* and correctly dismisses the oil argument. It treats "Institutions" as the correct answer to the prompt.

  **The A Answer** realizes that Fact (d) makes the word "Institutions" problematic. It argues that if the difference comes from a random clerk in 1893, then "Institutions" is just the *name* of the difference, not the *explanation* of the difference. The A answer distinguishes between the **proximate cause** (current rules) and the **ultimate cause** (historical luck), whereas the B answer stops at the proximate cause.

  ***

  ### Critique of Your Case Design

  **Is the case broken?**
  No, it is actually excellent. It successfully controls for Geography (same island), Culture (same people/trust), and *De Jure* Institutions (same constitution). This forces the student to look at *De Facto* institutions and Path Dependence.

  **One Risk to Watch:**
  The "One Word Answer" (Institutions) is so dominant in pop-econ that students might write "It's institutions" and think they've answered the prompt without doing the work.
  *   **Fix:** The marking scheme above penalizes this heavily. If they just say "Institutions matter" without explaining the *Clerk/Contingency* angle (Fact d), they cannot access the top 6 marks.
  *   **Recommendation:** In the exam instructions, explicitly add: *"Answers that simply state 'institutions matter' without analyzing the origin of those institutions will not receive full credit."* This kills the memorized essay immediately.

  **On Part B (Re-running History):**
  I integrated the "re-run history" logic into Question Part 2 ("inevitable or accidental"). I did not make it a separate Part B question.
  *   **Reasoning:** In a 45-minute exam, splitting into Part A/Part B often leads to students spending 20 mins on A and 5 mins on B, resulting in a shallow answer for B. By making it a *required element of the main essay*, you ensure every student engages with the counterfactual reasoning, which is where the philosophical depth lies. It forces the "Contingency" argument rather than letting them treat it as an optional extra.
