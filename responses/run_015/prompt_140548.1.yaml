      *   **Constraint 2 (Practical):** Needs a 50-minute lesson plan for 16-year-olds. Needs 2-3 specific moments/quotes on the board with specific questions.
      *   **Tone:** Intellectual, rigorous, respectful of the user's expertise (don't define terms like "illocution" at them, use them), but grounded in pedagogy (don't make it a grad seminar).
