      *   *Worry 2 (Text vs. Theory):* The user's instinct is sharp. Danforth *knows* Mary means to retract. He *refuses* uptake. In Austinian terms, is this a *misfire* (procedure not accepted) or an *abuse* (procedure invoked insincerely/by force)? It looks like an *abuse* of the court procedure to enforce a specific perlocution (order) regardless of illocution (truth).
