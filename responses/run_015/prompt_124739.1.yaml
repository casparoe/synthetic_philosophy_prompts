answer: |-
  # Seminar Game: The Cost of Truth

  **Time:** 80 Minutes
  **Students:** 18 (9 Signallers, 9 Receivers)
  **Materials:** 
  *   Index cards (3 colors for Types, plus blank for signals).
  *   18 Envelopes (for anonymous submission).
  *   Projector (for Payoff Tables).
  *   Whiteboard (to track aggregate scores).

  ## 1. Logistics & Reputation Control
  **The Confound:** If students recognize partners, they sustain honesty via reputation ("I accepted you last time, you accept me now"). This destroys the lesson.
  **The Protocol:**
  1.  **IDs, Not Names:** Students write a random 3-digit ID on all slips. No names.
  2.  **The Shuffle:** Signallers place their decision slip *and* their hidden Type card into an envelope. You collect all 9 envelopes, shuffle them thoroughly, and distribute them to the 9 Receivers.
  3.  **Role Lock:** Keep Signallers and Receivers in fixed groups for the first 4 rounds to reduce rule-confusion, then swap roles for the final 2 rounds.
  4.  **The Ban:** Explicitly state: "Talking during the matching phase disqualifies your group from points. If you try to signal identity (e.g., 'I'm the one in the red shirt'), I will reset the round."

  ## 2. Game Setup (10 Minutes)
  *   **Divide:** 9 Signallers (Group S), 9 Receivers (Group R).
  *   **Deal Types:** To Group S, deal 3 **Low (L)** cards, 3 **Medium (M)** cards, 3 **High (H)** cards. They keep this hidden.
  *   **Signal Range:** Signallers choose an integer Signal Level ($s$) from 0 to 6.
  *   **Receiver Action:** Receivers choose **Accept** or **Reject**.
  *   **Payoff Logic:** 
      *   Signallers want Acceptance.
      *   Receivers want to Accept H, maybe M, never L.
      *   **Crucial:** Do not explain *why* costs differ yet. Just project the tables.

  ---

  ## 3. The Rounds (45 Minutes Total)
  *Run 6 Rounds. 7 Minutes per round (2 min instruction, 3 min play, 2 min payoff).*

  ### Round 1: Free Signalling (The "Cheap Talk" Baseline)
  *   **Cost:** 0 points for all Types.
  *   **Receiver Payoff:** Accept H (+5), M (0), L (-5). Reject (0).
  *   **Signaller Payoff:** Accept (+10), Reject (0).
  *   **Expected Behavior:** All Signallers choose $s=6$ (max signal). Receivers, knowing cost is zero, should theoretically reject all (pooling), but often accept blindly. 
  *   **Lesson:** Without cost, signal magnitude conveys no information.

  ### Round 2: Uniform Cost (The Misconception)
  *   **Cost:** 2 points per signal level for **all** Types ($Cost = 2s$).
  *   **Payoffs:** Same as Round 1.
  *   **Expected Behavior:** High types signal high. Medium types *mimic* High types because the cost is affordable for both. Low types might also mimic if the benefit (10) outweighs the cost (12 at max signal, but lower at mid signal). 
  *   **Lesson:** Cost alone does not guarantee honesty. If the cost is the same, mimicry pays.

  ### Round 3: Differential Cost (The Handicap Principle)
  *   **Cost:** 
      *   **Low:** $4 \times s$
      *   **Medium:** $2 \times s$
      *   **High:** $1 \times s$
  *   **Payoffs:** Same as Round 1.
  *   **Expected Behavior:** 
      *   **High:** Signals 5 or 6. (Cost 5, Net 5).
      *   **Medium:** Signals 2 or 3. (If they mimic High at 6, Cost 12, Net -2. Better to signal lower and hope for M-acceptance or save points).
      *   **Low:** Signals 0. (Cannot afford to mimic).
  *   **Lesson:** Honesty emerges not because the signal is expensive, but because it is *differentially* expensive.

  ### Round 4: The Index (Unfakeable)
  *   **Mechanic:** Signallers place their Type Card **face up** on the envelope. Signal choice is ignored.
  *   **Cost:** 0.
  *   **Expected Behavior:** Signallers choose $s=0$. Receivers accept H, reject L.
  *   **Lesson:** If truth can be verified directly (an "index"), costly signalling is unnecessary waste. Handicaps exist only when quality is hidden.

  ### Round 5: Noisy Public Cue (Counter-Signalling)
  *   **Mechanic:** Deal each Signaller a **Reputation Card** (Green, Yellow, Red) placed face-up on the envelope. 
      *   H usually gets Green (70%), sometimes Yellow.
      *   M usually gets Yellow.
      *   L usually gets Red.
  *   **Receiver Info:** Receivers see the Reputation Card *before* deciding.
  *   **Cost:** Same Differential Cost as Round 3.
  *   **Expected Behavior:** 
      *   **High (Green):** Signals 0. (Receiver accepts based on Green cue; H saves cost).
      *   **Low (Red):** Signals 0. (Cannot afford to override the Red cue).
      *   **Medium (Yellow):** Signals High. (Must distinguish themselves from the Low types who also look "bad" on paper).
  *   **Lesson:** The highest quality types may signal *least* because their quality is already assumed. The "middle" strive hardest to prove themselves.

  ### Round 6: Burn vs. Gift (The Nature of Cost)
  *   **Split:** Divide Group S. 4 Signallers are **Burn** (Cost vanishes). 5 Signallers are **Gift** (Cost is added to Receiver's score).
  *   **Cost:** Differential (as Round 3).
  *   **Expected Behavior:** 
      *   **Burn:** High signalling (honesty maintained).
      *   **Gift:** Signalling may drop or become unstable. If the cost is a gift, it is a bribe, not a handicap. A Low type might afford to "bribe" a Receiver if the Receiver values the gift more than the Type risk.
  *   **Lesson:** For a handicap to work, the cost must be a net loss to fitness (waste), not a transfer of wealth.

  ---

  ## 4. The Debrief (25 Minutes)
  *Do not use jargon until now.*

  **Step 1: Map the Data (5 mins)**
  Project a blank table. Ask students to fill in the average Signal Level for each Type in each Round based on their memory/notes.
  *   *Round 1:* All High. (Meaningless).
  *   *Round 2:* All High/Med. (Mimicry).
  *   *Round 3:* H High, L Low. (Separation).
  *   *Round 5:* M High, H/L Low. (Counter-signalling).

  **Step 2: Introduce the Concepts (10 mins)**
  *   **The Slogan Error:** "In Round 2, the signal was costly. Why was it still dishonest?" 
      *   *Answer:* Because the cost was the same. 
      *   *Term:* **The Handicap Principle** is not about cost; it is about **Marginal Differential Cost**.
  *   **The Equilibrium:** "In Round 3, why didn't the Low type just pay the cost?"
      *   *Answer:* It cost them more than the benefit of acceptance. 
      *   *Term:* **Separating Equilibrium**.
  *   **The Counter-Intuition:** "In Round 5, why did the Best types signal the least?"
      *   *Answer:* They didn't need to. 
      *   *Term:* **Counter-Signalling**.

  **Step 3: Limitations & Biology (10 mins)**
  *   **What the Cards Hide:** 
      1.  **Evolution vs. Learning:** Students *reasoned* their way to equilibrium. In nature, strategies that fail to separate die out; animals don't calculate payoffs.
      2.  **Physiology:** In the game, cost was arithmetic. In biology, cost is physiological (immune suppression, predation risk).
      3.  **The "Gift" Round:** This highlights that biological signals are usually "waste" (energy spent on a tail), not resources given to the receiver (food). If it were a gift, it would be a market transaction, not a signal of genetic quality.
  *   **Reputation Check:** Ask, "Did anyone try to recognize their partner?" Acknowledge that in small populations (like this seminar), reputation *can* sustain honesty without cost. This explains why handicap signalling is more common in large, anonymous populations (or species with low individual recognition).

  ---

  ## 5. Instructor Notes & Recovery

  **Most Likely Failure Point:** Round 3 (Differential Cost).
  *   *Risk:* Medium types mimic High types anyway because the cost difference isn't painful enough in their minds.
  *   *Recovery:* Pause. Remind them: "Remember, your score matters. If you are Type L, calculate the net score of signalling 6." Do not reveal the math, just prompt them to calculate *net* payoff.

  **Managing the "Burn vs Gift" Round:**
  *   This round is theoretically dense. If time runs short, cut Round 5 (Counter-signalling) and keep Round 6. Round 6 clarifies the definition of "cost" which is central to the philosophical claim. Round 5 is a nuance; Round 6 is foundational.

  **The "Reputation" Leak:**
  *   If students say, "I accepted you because you're Sarah," stop the game. Reset the round. Deduct 5 points from the group score. Be ruthless here. The lesson requires anonymity to function.

  **Final Philosophical Hook:**
  *   End with this question: "If honesty requires waste, is nature inherently inefficient? Or is the 'waste' the only efficient way to solve the problem of trust?" This bridges the game back to the seminar's core themes.
