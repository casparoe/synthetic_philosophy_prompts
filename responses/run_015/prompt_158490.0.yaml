answer: |-
  1. "Where I'm stuck"
  Your puzzle concerns Pigment P, whose evolutionary reason (UV screening) no longer matches its current environment (dark caves). P persists only because it is linked to an essential hormone, H. While P retains the capacity to screen UV, doing so is now useless, and eliminating P would benefit the organism. The tension arises because the trait's history says it has a function, its current selective context says it is a burden, and its causal powers say it still works. You are stuck because accounts pull in opposite directions: one anchors function in past selection, the other in current contribution, leaving the status of this "stale" trait ambiguous.

  2. "Four verdicts"
  The **Origin history** verdict keys on etiology. Since P was selected for UV screening, the etiological account assigns that function permanently, regardless of current utility. It treats function as a historical essence. This preserves the intuition that P is "for" UV, but implies functions can persist even when useless, potentially divorcing function from current biological reality. It anchors the trait's identity in the past.

  The **Maintenance history** verdict keys on current selection. Because P is now a hitchhiker maintained by H, this view suggests P has no function, or merely "being H's byproduct." It demands current selective pressure to sustain functional status. This avoids attributing functions to vestiges but risks losing continuity; the trait hasn't changed, yet its functional identity vanishes instantly upon environmental shift. This splits the etiological camp internally.

  The **Renewal** verdict keys on counterfactual selection. Since a mutation removing P would spread, this view assigns P a negative status; it is a dysfunction or burden awaiting correction. It treats function as dynamic and forward-looking. This captures the evolutionary trajectory but struggles to explain why P exists now if it is effectively "broken." It introduces a normative pressure without a current trait to match.

  The **Causal role** verdict keys on systemic capacity. Relative to the capacity "resist UV," P functions normally. Relative to "survive in caves," it contributes nothing. This account allows multiple functions depending on which capacity the theorist chooses to analyze, decoupling function from selection entirely. It explains how P works mechanically but fails to explain why P is there or why it shouldn't be. It offers flexibility at the cost of evolutionary explanation.

  The tension between Origin and Maintenance shows that even Selected-Effect theorists disagree on whether history locks in function or requires continuous support. Origin favors stability; Maintenance favors accuracy. Causal Role avoids this by ignoring history, but pays the price of normativity; it cannot say P *should* be removed, only that it *is* costly. The four verdicts map onto different explanatory goals: historical identity, current selective status, evolutionary trajectory, and mechanistic contribution. No single verdict captures all intuitions simultaneously.

  3. "What's doing the work"
  The single feature generating the split is the **decoupling of causal capacity from selective maintenance**. P retains the physical power to do X (screen UV), but X no longer contributes to fitness, and P is maintained solely by linkage to Y (Hormone). This tripartite separation—history says X, current selection says nothing, physics says X—is what breaks the accounts.

  If you remove this decoupling by making P chemically inseparable from H, the split narrows. If no mutation could drop P without killing H, P is structurally necessary for H. The Causal Role account would assign P the function of "producing H" relative to survival capacity. The Etiological account would shift to say P's function is producing H (if that selection is current) or remain stuck on UV (if history locks). The "stale" problem vanishes because P is no longer a gratuitous byproduct; it becomes a necessary structural component. The dispute then returns to standard territory: is the function the historical reason (UV) or the current contribution (H production)? The "stale" ambiguity specifically requires the trait to be physically capable but evolutionarily redundant.

  The crucial element is the *possibility* of a cheaper variant. The fact that a P-less mutant *would* win, but doesn't exist, creates the "negative prospective status." If P were inseparable, there is no cheaper variant, so P isn't "on the way out." It becomes a fixed cost of doing business. The philosophical friction relies on the trait being contingent yet persistent.

  4. "Can a function expire?"
  Can a function expire? For the Causal Role account, functions don't expire; capacities just become irrelevant to the chosen system analysis. For the Selected-Effect account, expiry is the hard problem. If function is defined by past selection, it cannot expire without changing the definition. If function requires current maintenance selection, it expires the moment the environment changes.

  Defenders of Selected-Effect often accept that functions persist even when useless (vestiges have functions). This preserves the historical explanation for why the trait is there. However, this costs the account its ability to diagnose current malfunction. If P's function is UV screening, is P malfunctioning in the cave? No, it's just unused. But if P is costly, isn't it a burden?

  If Selected-Effect allows expiry (requiring current maintenance), it gains diagnostic power for current systems but loses its grip on evolutionary history. It begins to look like a hybrid view. Most etiological theorists accept that functions don't expire; a heart's function is pumping even in a dying organism. The cost is accepting that "function" explains origin, not necessarily current utility. In your case, P's function remains UV screening, even if that function is now evolutionarily inert. The "stale" status is a feature, not a bug, signaling the lag between environmental change and genetic response.

  Allowing expiry destabilizes the link between function and type-identity. Does the trait cease to be itself? Etiological accounts tie trait identity to function. By denying expiry, SE preserves trait identity across environmental shifts. This stability aids comparative biology. So, while it feels counterintuitive to call a useless trait "functional," it preserves the historical continuity required to track traits across lineages. The "stale" function is thus a record of ancestry, not a claim about current utility.

  5. "What the fight is about"
  With the stale case on the table, the fight is less about ontology and more about the **job description** of function-talk. Are we explaining why the trait exists, or analyzing what the system does?

  The Selected-Effect camp aims to explain presence and normativity. It answers "Why is P here?" (History) and "What counts as broken?" (Deviation from selected effect). In the cave case, it explains P's presence but fails to label P as a burden without extra machinery.

  The Causal Role camp aims to analyze capacities. It answers "How does the system work?" It handles the cave case easily by shifting capacities, but cannot explain why P is there or why it should be removed.

  I lean towards viewing this as a pragmatic division of labor. Neither account captures the whole picture alone. The "stale" case shows that biological systems carry historical baggage that current causal analysis misses, while causal analysis reveals costs that history ignores. What would settle it is agreeing that "function" is ambiguous. We need distinct terms: "evolutionary function" (SE) for history and normativity, and "systemic function" (CR) for mechanism. The dispute persists only because both camps claim the single word "function" exclusively. Recognizing the duality dissolves the tension; P has an evolutionary function (UV) but no current systemic function relative to cave survival.

  Selected-Effect claims fundamentality for biology, as traits are historical. A trait's identity is tied to its lineage. However, for physiology or medicine, Causal Role is superior. The "stale" case proves that no single definition covers all use-cases. The dispute is about disciplinary dominance: should biology dictate function to physiology? The case shows they come apart. The solution is pluralism. We should stop asking which account is true and start asking which tool fits the specific explanatory task at hand.

  6. "Lecture version"
  Think of function like a job title. One view says your job is what you were hired to do, even if plans changed. The other says your job is what you do all day. Here, the pigment was hired for UV protection, but now works in the dark. The first view says it still has that job, historically. The second says it currently does nothing useful. The debate isn't about truth, but which question you're asking. Asking why the pigment exists? Use history. Asking how the lizard survives today? Use current work. Both are right about different things. Don't force a single definition to do both jobs.
