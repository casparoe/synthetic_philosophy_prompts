      *   *Key Insight:* It's not about *conservatism* per se, but about *understanding function* before *removing function*. It's an epistemic constraint on reform, not necessarily a moral ban.
      *   *Friend's Interpretation:* "You must state exactly why the people who *originally* instituted them put them there." (This is a specific, historical/intentionalist reading).
