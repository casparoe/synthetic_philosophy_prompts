      *(Self-Correction on Burke)*: Burke isn't exactly Chesterton. Chesterton is popularizing a Burkean *sentiment*. I should clarify that distinction. Burke emphasizes *prescription* (long usage confers legitimacy), not necessarily *original intent*. So the Friend's focus on "original rationale" is actually *less* Burkean than a focus on "current function derived from longevity."

      *(Refining the Friend's Conclusion Check)*:
