answer: |-
  Here's a tight, jargon-light argument you can put on the board. It frames natural kinds not as "what things really are," but as "which categories let us win bets about the world."

  ***

  ### The Argument: Natural Kinds as Prediction Machines

  Don't think of a "natural kind" as a group that shares a hidden essence. Think of it as a **tool for induction**. A category is a natural kind if knowing something belongs to it lets you safely predict other things about it, even in contexts you haven't seen yet.

  **1. The Chemistry Payoff (Gold)**
  If I hand you a nugget of gold and tell you nothing else, you can safely bet on its density, its melting point, how it reacts with acid, and how it conducts electricity.
  *   **Context Independence:** It doesn't matter if the gold came from a mine in 1850, a lab in 2024, or an asteroid. It doesn't matter if it's shaped into a ring or a bar.
  *   **The Cluster:** The properties lock together. You never find "gold" that melts at a different temperature just because it grew up in a different environment.
  *   **Result:** The category "gold" supports high-stakes induction across space and time. It pays off.

  **2. The Biology Problem (Tigers)**
  If I tell you something is a tiger, you can predict it has fur and eats meat. But the bets get risky fast.
  *   **Context Dependence:** A tiger in a zoo behaves differently than one in the wild. A tiger from Sumatra is smaller than one from Siberia. A tiger from 10,000 years ago was genetically different than one today.
  *   **The Variation:** Properties don't lock tightly. Size, color, behavior, and even genetic makeup vary based on environment and history.
  *   **Result:** The category "tiger" is leaky. Knowing something is a tiger doesn't let you predict its specific traits with the same certainty as gold.

  **3. Why the Difference?**
  Chemistry ignores history; Biology is made of it.
  *   **Gold** is defined by structural stability. An atom doesn't have a "parent" or an "environment" that changes what element it is. It just *is*. That's why the induction holds.
  *   **Tigers** are defined by lineage. They are a snapshot of a moving target (evolution). Species change to fit their context. Because biology is about adaptation, the properties *must* vary to survive.

  **The Punchline**
  "Gold" is a natural kind because it supports universal laws. "Tiger" is a historical narrative. Chemistry gives you prediction; biology gives you explanation. If natural kinds are about induction, chemistry wins and biology loses.

  ***

  **Teacher's Note for the Pushback:**
  This sets up your students to object (correctly) that biology *does* support induction (e.g., physiology, ecology) and that chemistry isn't as context-free as it seems (e.g., isotopes, allotropes). It also lets you introduce Homeostatic Property Clusters vs. Essentialism later.
