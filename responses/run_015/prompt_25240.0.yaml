prompt: |-
  Hey — I'm running a reading group for software engineers who are curious about AI alignment but haven't read any of the academic stuff. Next week's my session on corrigibility and the shutdown problem, and I've got forty minutes. Don't explain corrigibility to me; I need a plan for how to explain it to them.

  Here's what I'm working with: they're sharp but their mental model of AI risk is basically "the AI goes rogue and fights us," so they'll come in thinking the shutdown problem is about having a kill switch that works. I need to get them to see that the real problem is subtler — that even a perfectly obedient AI has an instrumental reason to resist shutdown unless it's designed very carefully, and that the obvious fix ("just make it want to be shut down") creates its own weird failure modes.

  What I need from you: the order I should introduce the pieces. What has to be in place before I can even state the problem? I'm guessing instrumental convergence has to come first, but does that need a full treatment or can I get away with a compressed version? What's the one concrete scenario I should use to carry the whole thing — and should it be an AI with a benign goal (like curing cancer) or a paperclip-maximizer-style arbitrary goal? The benign one feels more intuitive but I worry it lets them think the problem only applies to AIs we've "misprogrammed."

  On misconceptions: I expect at least three. (1) "This is just the alignment problem again" — they'll collapse corrigibility into general helpfulness. (2) "So make the shutdown button a terminal goal" — they'll propose the naive fix and not see why it fails. (3) "This only matters for superintelligent systems, we can just hardcode a shutdown routine for anything near-term." Tell me exactly where in the sequence each of these will surface and how I should handle it — do I preempt it or let them walk into it and then show the trap?

  Also: what should I openly refuse to explain at this level? I'm guessing the formal indifference-based approaches and the whole utility-indifference literature is too much, but I want to know what to flag as out of scope so they don't walk away thinking I've dodged something.

  Finally, give me one question I can ask at the end — not a comprehension check like "define corrigibility" but something that would tell me whether they've actually internalized why the naive fix fails. Keep the whole answer to about a page, 500 words max.
