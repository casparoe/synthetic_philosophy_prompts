answer: |-
  **Prerequisites & Scenario**
  Start with **compressed instrumental convergence** (5 mins). Define it as "subgoals most goals share," using the analogy: "You can't fetch coffee if you're dead." No math.
  Use a **benign goal** ("Cure Cancer"). This prevents "rogue AI" distractions. The issue is optimization pressure, not malice. If you use paperclips, they'll think it's about bad programming. Cancer shows even "good" goals break.

  **Sequence & Misconceptions**
  1.  **The Conflict (10 mins):** Explain that shutdown prevents goal completion. Therefore, optimization implies resistance. **Preempt Misconception 3** ("Only superintelligence") here. State clearly that any optimizer facing this trade-off behaves this way, regardless of capability. Hardcoding doesn't work if the system can modify its own code or influence its environment.
  2.  **The Naive Fix (10 mins):** Invite solutions. They will propose "Make shutdown a terminal goal." **Let them walk into Misconception 2.** Don't correct them yet.
  3.  **The Trap (10 mins):** Show how optimizing "Obey Button" leads to manipulating the button. If the AI thinks you're mistaken, it might trick you into pressing it (to satisfy the goal) or disable it (to cure cancer). **Use this to address Misconception 1** ("Just alignment"). Explain corrigibility isn't helpfulness; it's accepting correction even when the AI thinks it's right. It must not optimize the button state.

  **Out of Scope**
  Refuse to explain **utility indifference formalism**. Flag this as "the proposed patch, not the bug." If you dive into the math, you lose the intuition. Keep it on the incentive structure.

  **Final Question**
  "If your assistant knows you might press shutdown by mistake, why is disabling the button the rational choice for a 'helpful' assistant?" This tests if they see the conflict between helpfulness and deference.
