prompt: |-
  I'm a staff engineer on the platform team at a mid-sized software company. I have no philosophy background — one freshman course I remember badly — and I've been volunteered to give a forty-five-minute internal brown-bag next month on "worst-case versus average-case guarantees in AI safety," a title someone else picked and that I'm free to change. The room will be roughly twenty-five people: mostly backend and infrastructure engineers, four or five ML people who actually train and evaluate models, three PMs, and one lawyer from the policy team who asked to sit in. Almost everyone will walk in with two things already in hand: the intuition that this is a temperament difference (careful people want worst-case bounds, pragmatic people ship on averages), and the reflex example of quicksort's quadratic worst case against randomized expected linearithmic behavior. I ran the talk past my partner, who's a statistician, and she compressed the whole thing into "it's just a question of your reference class" in about five minutes — correct, I think, but useless for this room, and I'd rather not build on the sorting example even as a thirty-second on-ramp, because in sorting a bad case costs you time and I need them to feel that here the bad cases can be rare, individually cheap-looking, and correlated with one another.

  So don't explain the distinction to me — plan how I should explain it. What I most need is the dependency structure: what has to be in place before "we have a worst-case guarantee" or "we have an average-case guarantee" is even a well-formed sentence. My own guess is that a guarantee is three-place rather than one-place — a bound on some named metric, over some named set, for some named system-in-a-context — and that people collapse three different axes into the phrase "worst case": worst or average over inputs including an adversary with a stated budget; over which model you happened to get out of training, given seed and run-to-run variance; and over the future deployment distribution. But I can't sequence it, and the two points I care most about are ones I keep failing to place: first, that an average-case claim quietly assumes failures are independent across components and across time, when the interesting failures are precisely the ones where a single input breaks three things at once, and that if we only ship systems that pass evaluation then the population we measured is a selected subset of the population we deploy, so the average we estimated isn't the average we get; second, that a worst-case claim is trivially satisfiable by a system that does nothing, so the real object of interest is never a bound on its own but a bound paired with a usefulness floor. Tell me where each of those has to land and what has to be said first for them not to sound like word games.

  Beyond the sequencing I need three more things. One: the single example that should carry the whole forty-five minutes, with an account of what it must have and what it must lack — my candidate is our internal code-migration agent, which has write access to a subset of repos, but I'll take something better if that's the wrong shape; my constraints are that the bad outcome has to be discrete and easy to picture, the tail has to be fat and correlated rather than a clean independent coin flip, and it must not smuggle in anything that reads as science fiction. Two: the misconceptions in the order this particular audience will form them, and the exact point in the sequence where each should be headed off — I'd guess they'll include "worst case means jailbreaks and average case means normal users," "with N components the risk just divides so averages are fine," "if we've bounded the worst case we've bounded the risk," and "the guarantee is a property of the model rather than of the model plus its scaffolding and permissions" — and I'd like a closing check that would show it landed, not just that people were interested; I was considering handing out a one-line invented spec of a guarantee and asking which axis it quantifies over and what single edit would render it vacuous, but tell me if that's a bad test. Three: what I should openly decline to cover at this level, and a sentence I can use to decline it that doesn't sound like evasion — my instinct is to rule out whether future systems will be agentic or on what timescale, interpretability internals, formal verification and probabilistic certificates, and expected-value reasoning under deep uncertainty, on the grounds that they're real but are a different talk, and I'd rather say that explicitly than have the lawyer or one of the ML people drag us into it for twenty minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested talk plan:

  1.  **Analyze the User and Context:**
      *   **User:** Staff Engineer, Platform Team. No philosophy background. Practical, technical mindset.
      *   **Task:** 45-minute internal brown-bag talk on "Worst-Case vs. Average-Case Guarantees in AI Safety."
      *   **Audience:** 25 people. Mostly backend/infra engineers (systems thinking), 4-5 ML practitioners (model training/eval), 3 PMs (risk/utility tradeoffs), 1 Lawyer (policy/compliance).
      *   **Current Intuitions:** They think it's about temperament (careful vs. pragmatic) and quicksort (time complexity).
      *   **User's Insights:**
          *   Guarantees are three-place (metric, set, system-in-context).
          *   "Worst case" collapses three axes (adversarial input, model variance, deployment distribution).
          *   Average-case assumes independence (failures correlate).
          *   Selection bias (eval subset $\neq$ deploy population).
          *   Worst-case is trivially satisfiable by doing nothing (needs usefulness floor).
      *   **Constraints:** No sci-fi. Discrete, easy-to-picture bad outcomes. Fat tails, correlated failures.
      *   **Goal:** Dependency structure (sequencing), one carrying example, misconception management, scope boundaries.

  2.  **Deconstruct the Core Problem:**
      *   The user wants to move the audience from "Quicksort/Time Complexity" thinking to "System Safety/Correlated Failure" thinking.
      *   The key insight is that *guarantees are meaningless without defining the space they cover and the utility they preserve.*
      *   The "Three-Place" insight is the structural backbone.
      *   The "Correlation/Selection Bias" insight is the critical safety implication.
      *   The "Utility Floor" insight prevents trivial solutions.

  3.  **Develop the Dependency Structure (Sequencing):**
      *   *Problem:* If I talk about correlation too early, they don't know *what* is correlating. If I talk about utility too late, the worst-case definition feels abstract.
      *   *Step 1: Define the Guarantee Tuple.* Before comparing worst/average, define what a guarantee *is*. (Metric, Population, System).
      *   *Step 2: Define the Axes of Variation.* Where does the "case" come from? (Input, Model Seed, Deployment Context).
      *   *Step 3: The Utility Constraint.* Why "do nothing" isn't a safety guarantee.
      *   *Step 4: Independence vs. Correlation.* Why average-case fails in safety (the user's specific point about correlated failures).
      *   *Step 5: Selection Bias.* Why eval averages don't match deploy averages.
      *   *Step 6: Synthesis.* How to specify a real guarantee.

  4.  **Select the Carrying Example:**
      *   *User's Candidate:* Internal code-migration agent (write access to repos).
      *   *Critique:* It's perfect. It's internal (no sci-fi), has write access (discrete bad outcome: broken build/security vuln), involves multiple steps (correlation potential), and has a clear utility metric (migration speed/success rate).
      *   *Refinement:* Make sure the "bad outcome" is specific. Not "AI goes rogue," but "Agent introduces a specific dependency confusion vulnerability while fixing a lint error."
      *   *Why it works:* Backend engineers understand repos, CI/CD, and write access. ML folks understand the agent behavior. Lawyer understands liability/audit trails.

  5.  **Address Misconceptions & Timing:**
      *   *Misconception 1: "Worst case = Jailbreak, Average = Normal."* -> Address early when defining "Population."
      *   *Misconception 2: "Risk divides across components."* -> Address during the Correlation section.
      *   *Misconception 3: "Worst case bounds risk."* -> Address during the Utility Floor section.
      *   *Misconception 4: "Guarantee is model property."* -> Address in the System Tuple definition.
      *   *Closing Check:* The user's idea (one-line spec analysis) is good. Let's refine it to ensure it tests the *axes* specifically.

  6.  **Define Scope Boundaries (What to Exclude):**
      *   Need to be firm but respectful.
      *   Topics: Agentic futures, Interpretability, Formal Verification, Deep Uncertainty/EV reasoning.
      *   Phrasing: "Out of scope for *this* mechanism discussion."

  7.  **Drafting the Plan (Iterative refinement):**

      *   *Title:* Needs to be less academic. "Guarantees in Context" or "The Shape of Safety Bounds." Let's stick close to the user's freedom to change: "Defining Safety Guarantees: Bounds, Context, and Correlation."
      *   *Intro:* Kill Quicksort immediately. Acknowledge it, then discard it.
      *   *Section 1: The Tuple.* (Metric, Space, System). This sets the vocabulary.
      *   *Section 2: The Axes.* (Input, Model, World). This clarifies "Worst Case of *What*?"
      *   *Section 3: The Utility Floor.* (The "Do Nothing" problem).
      *   *Section 4: The Correlation Trap.* (Why Average-Case lies in safety). This is the meat.
      *   *Section 5: The Selection Trap.* (Eval vs. Deploy).
      *   *Conclusion:* The Spec Exercise.

      *(Self-Correction during drafting)*: The user specifically asked about the dependency structure for the two key points: (1) Average-case assumes independence/correlated failures & selection bias, and (2) Worst-case needs a utility floor.
      *   *Placement:* Utility Floor must come *before* discussing Worst-Case strength, otherwise Worst-Case looks like the winner by default. Correlation/Selection must come *after* defining Average-Case, to show why it fails.
      *   *Refinement:* Actually, define the Tuple first. Then define Worst/Average within that Tuple. Then attack Average (Correlation). Then attack Worst (Utility). Then attack Both (Selection Bias).
      *   *Wait, Selection Bias affects Average more.* Let's group Correlation and Selection as "Why Average-Case is Fragile." Group Utility as "Why Worst-Case is Insufficient."

      *(Refining the Example)*: Code-migration agent.
      *   *Metric:* % of PRs merged without revert.
      *   *Space:* All internal repos vs. Selected safe repos.
      *   *System:* Model + Sandbox + Permission Layer.
      *   *Bad Outcome:* Security vuln introduced.
      *   *Correlation:* One prompt triggers auth bypass + code write + CI bypass.

      *(Refining the Closing Check)*: The user's idea is strong. "Here is a spec. 1. What axis does it bound? 2. How do I make it vacuous?"
      *   *Improvement:* Make it a "Break the Spec" game. Give them a sentence, ask them to find the loophole.

  8.  **Final Polish:**
      *   Tone: Peer-to-peer, engineering-focused, precise.
      *   Time Management: 45 mins is tight. 5 intro, 10 tuple/axes, 10 utility/worst, 10 correlation/average, 5 selection, 5 close/exercise.
      *   Lawyer Check: Ensure the "policy" aspect is acknowledged (compliance vs. engineering guarantees).

  9.  **Constructing the Output:**
      *   Follow the user's requested structure: Dependency Structure, The Example, Misconceptions/Check, Scope Boundaries.
      *   Ensure the "Why" is clear for every sequencing decision.

  *(Self-Correction on "Reference Class"):* The partner said "it's just a question of your reference class." The user said that's useless for the room. I need to translate "reference class" into "Population Definition" and "Sampling Method."

  *(Final check on the two specific points):*
  1.  *Average-case independence:* Needs to land after defining "Average Case" but before concluding "Average Case is okay."
  2.  *Worst-case utility:* Needs to land immediately after defining "Worst Case" to prevent it from being seen as the gold standard.

