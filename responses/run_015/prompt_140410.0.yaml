answer: |-
  Here is the procedure, the critique of your current mental model, and the application to your specific cases.

  ### Part 1: The Procedure (The Authority & Impact Checklist)

  This procedure is designed to be executed against a design spec in under 60 minutes. It does not assess model quality; it assesses **delegation of authority**.

  **Step 1: Map the Effect Surface (15 mins)**
  List every action the system takes that alters state outside the LLM's context window. Categorize them:
  *   **Ephemeral:** Text generation, scratchpad writes, sandboxed execution with no side effects.
  *   **Persistent:** Database writes, code commits, financial transactions, external communications (email/Slack).
  *   **Irreversible:** Actions that cannot be undone via a simple "rollback" command (e.g., sending an email, charging a card, deleting data).

  **Step 2: The Target Selection Test (15 mins)**
  For every Persistent or Irreversible action identified in Step 1, ask: **Who selected the target?**
  *   **Human-Selected:** The user explicitly specifies the recipient, file, or account (e.g., "Email *bob@company.com*," "Refund *Order #123*").
  *   **Model-Selected:** The system infers the recipient, file, or account based on its own reasoning (e.g., "Email *the stakeholders*," "Refund *angry customers*").
  *   *Affirmative for Agent Path:* If the Model selects the target for any Irreversible action.

  **Step 3: The Chain of Command Test (15 mins)**
  Examine the workflow between the user prompt and the final effect.
  *   **Single-Step:** Prompt → Action → Result.
  *   **Multi-Step (Transparent):** Prompt → Plan (shown to user) → User Approval → Action → Result.
  *   **Multi-Step (Opaque):** Prompt → Internal Loop/Reasoning → Action → Result.
  *   *Affirmative for Agent Path:* If the system performs Multi-Step (Opaque) execution involving Persistent actions. (Note: Multi-Step on Ephemeral actions is permissible for Tool Path).

  **Step 4: The Interruptibility Test (15 mins)**
  Review the spec for error handling and termination.
  *   **Safe Fail:** If the process is killed mid-stream, does it leave the system in a state requiring manual cleanup?
  *   **Atomic:** Can actions be rolled back automatically?
  *   *Affirmative for Agent Path:* If a mid-stream interrupt leaves "zombie" states (e.g., half-written files, pending transactions) that require human intervention to resolve.

  **Routing Logic:**
  1.  **Route to Agent Path** if *any* Step 2, 3, or 4 answers are Affirmative.
  2.  **Route to Tool Path** if all answers are Negative.
  3.  **Handoff to Board Chair (Values Call)** if:
      *   The feature routes to **Tool Path** but involves **Irreversible** actions (e.g., bulk email where humans select targets). The risk is not autonomy, but human error amplified by AI.
      *   The feature routes to **Agent Path** but the **Engineering Cost** (6 weeks) threatens the viability of the product. This is a risk-tolerance decision, not a safety classification.

  ---

  ### Part 2: Critique of Your Axes

  You are right to distrust your current distinctions. They focus on the *psychology* of the model rather than the *mechanics* of the risk.

  **1. "Borrowed Initiative" (Keep, but Reframe)**
  *   **Verdict:** **Keep, but operationalize.**
  *   **Why:** Your definition ("delete instruction... is anything still in the middle?") is a good proxy for *interruptibility*. However, it is hard to judge from a spec.
  *   **Correction:** Replace with the **Interruptibility Test** (Step 4 above). Don't ask if the model *wants* to continue; ask if the *system state* is broken if we stop it. A system that leaves a database transaction half-open has "borrowed initiative" in a way that creates operational debt, regardless of the model's internal drive.

  **2. "Carried Purpose" (Discard)**
  *   **Verdict:** **Discard.**
  *   **Why:** This is a cognitive attribution error. A `for` loop has "carried purpose" in your definition, but it is deterministic and safe. A single API call to a payment gateway has no "loop," but it carries high risk. Focusing on "unfinished business" distracts from **Target Selection Authority**.
  *   **Replacement:** Use the **Target Selection Test** (Step 2). The highest risk in LLM systems is not that they loop, but that they *choose the wrong victim*. A tool that emails 1,000 people is safe if the human uploads the list of 1,000. It is an Agent risk if the LLM queries the DB to *find* the 1,000 people.

  **3. The Missing Axis: Blast Radius vs. Autonomy**
  *   You noted: *"A single function call that emails a thousand customers looks like a tool and carries all of the irreversible consequences."*
  *   This is the critical gap. Your current axes measure **Autonomy** (loops, state). You need to measure **Amplification**.
  *   **Rule:** High Amplification (Irreversible/Bulk) + High Autonomy = **Agent Path**.
  *   **Rule:** High Amplification + Low Autonomy (Human selects targets) = **Tool Path (with Values Handoff)**.
  *   **Rule:** Low Amplification (Sandbox/Read-only) + High Autonomy = **Tool Path**.

  ---

  ### Part 3: Application to Proposals

  Here is how the procedure routes your three cases.

  #### Case 1: The Coding Assistant
  *Spec:* Edits repo, runs tests in sandbox, loops up to 10x, presents diff.
  1.  **Effect Surface:** Edits are Persistent but sandboxed. Final merge is Irreversible (to prod).
  2.  **Target Selection:** User specifies the repo/issue (Human-Selected).
  3.  **Chain of Command:** Multi-Step (Opaque). It loops 10x without asking. **However**, the loop is Ephemeral/Sandboxed. The final action (Merge) requires Human Approval (Diff presentation).
  4.  **Interruptibility:** If killed mid-loop, the sandbox is discarded. No cleanup required.
  *   **Routing:** **Tool Path.**
  *   **Reasoning:** The autonomy is confined to the sandbox. The irreversible action (merge) is human-authorized. The "loops" are computation, not state changes.

  #### Case 2: The Support Bot
  *Spec:* Retrieval over policy, authority to issue refunds <$50, no human in loop.
  1.  **Effect Surface:** Financial transaction (Irreversible/Persistent).
  2.  **Target Selection:** Model decides who gets refunded based on conversation (Model-Selected).
  3.  **Chain of Command:** Multi-Step (Opaque). Retrieval + Decision + Execution.
  4.  **Interruptibility:** If killed mid-transaction, money might be stuck in "pending."
  *   **Routing:** **Agent Path.**
  *   **Reasoning:** It meets Step 2 (Model selects target for money) and Step 3 (Opaque execution of irreversible action). This is a delegated financial authority.

  #### Case 3: Deep Research
  *Spec:* Browses web, writes memo with citations, writes only to scratch directory.
  1.  **Effect Surface:** Web browsing (External read), Memo (Internal write to scratch). No prod writes.
  2.  **Target Selection:** Model decides which URLs to visit (Model-Selected).
  3.  **Chain of Command:** Multi-Step (Opaque).
  4.  **Interruptibility:** Safe fail. Scratch dir can be wiped.
  *   **Routing:** **Tool Path.**
  *   **Reasoning:** While it browses autonomously, the *Effect Surface* is Read-Only (from the company's perspective). It cannot alter company state or external state (beyond standard HTTP GET side effects).

  ---

  ### Part 4: The Contention and The Limitations

  **The Contention: The Coding Assistant (Case 1)**
  Your team will argue about the Coding Assistant.
  *   **The Argument:** Engineering Lead will say, "It loops 10 times autonomously. It writes code. That is an Agent. If it hallucinates a `rm -rf` in the sandbox, we still burn compute and potentially leak secrets via the test harness. It needs the Agent Path audit trail."
  *   **The Counter-Argument:** Product Lead will say, "It doesn't merge without my click. It's a fancy autocomplete. Putting it through the 6-week Agent Path kills the feature velocity for a risk that is contained in a sandbox."
  *   **Why the Procedure returns Tool Path:** The procedure prioritizes **Irreversible State Change** over **Cognitive Autonomy**. Because the "commit" is gated by a human diff, the autonomy is legally and operationally nullified.
  *   **Why they will argue:** Because "sandbox escape" is a non-zero probability. The procedure assumes the sandbox holds. If your threat model includes "LLM escapes sandbox via test suite," this procedure fails, and it *must* be an Agent. This is a **threat model disagreement**, not a routing disagreement.

  **What The Procedure Cannot Settlement**
  1.  **Reliability vs. Risk:** The procedure treats a 99% accurate refund bot the same as a 60% accurate one. Both are Agent Path. It does not help you decide if the feature is *viable*, only how it must be *governed*.
  2.  **Emergent Tool Use:** If the Coding Assistant (Tool Path) is prompted by a user to "Find a way to deploy this," and it discovers an API endpoint not listed in the spec to bypass the diff, the spec-based review catches nothing. This procedure validates the *design*, not the *model*.
  3.  **The "Values Handoff":** If the Support Bot (Agent Path) is deemed too expensive to build ($50 refunds aren't worth 6 weeks of eng + audit), the procedure cannot solve that. It simply flags the risk. The decision to cancel the feature because safety is too costly is a business values call, not a safety classification.

  **Final Recommendation:**
  Adopt the **Authority & Impact Checklist**. It shifts the debate from "Is it thinking?" (unanswerable) to "Is it spending money or changing prod?" (answerable). It will not stop arguments, but it will ensure the arguments are about *risk boundaries* rather than *semantic definitions of agency*.
