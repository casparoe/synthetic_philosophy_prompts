      *   **Constraints:** Procedure must take <1 hour, rely *only* on the spec (no model internals, no execution), and be actionable by a reviewer.
      *   **Current Axes (User's):** "Borrowed Initiative" (does it continue if user instruction stops?) and "Carried Purpose" (does it maintain unfinished business across steps?). User doubts these.
      *   **Deliverables:**
          1.  The Procedure (questions, termination conditions, handoff points).
          2.  Critique of User's Axes (keep/discard/modify).
          3.  Application to 3 Cases (Coding Assistant, Support Bot, Deep Research).
          4.  Identification of a contentious case and limitations of the procedure.

  2.  **Analyze the User's Axes:**

      *   *Borrowed Initiative:* "Delete the user's instruction and is there anything the system is still in the middle of?"
          *   *Critique:* This is actually a decent proxy for *autonomy*, but it's hard to assess from a spec alone without knowing the loop logic. It focuses on *continuation* rather than *impact*.
      *   *Carried Purpose:* "Across steps... does it maintain a representation of its own unfinished business...?"
          *   *Critique:* This is too cognitive/psychological. It asks about the model's internal state ("representation of unfinished business"). A spec describes behavior, not internal cognition. A simple loop looks like "carried purpose" but might be safe. A single API call looks like "no purpose" but might be dangerous.
      *   *The Real Risk:* The user identifies the core tension: "a single function call that emails a thousand customers looks like a tool and carries all of the irreversible consequences."
      *   *Conclusion:* The user's axes focus on *behavioral complexity* (loops, state), but the routing decision needs to focus on *blast radius* and *delegation of authority*. A "Tool" should be a lever; an "Agent" is a delegate. The distinction isn't just "does it loop?" it's "does it decide *what* to loop on without explicit confirmation?"

  3.  **Develop the Procedure (The "Delegation & Blast Radius" Framework):**

      *   *Goal:* Distinguish between *executing a defined task* (Tool) and *pursuing a goal via self-determined sub-tasks* (Agent).
      *   *Key Dimensions:*
          1.  **Scope of Authority:** Can it act on behalf of the user without specific per-action approval?
          2.  **Blast Radius:** What is the worst-case irreversible impact of a single decision loop?
          3.  **Observability:** Can a human easily verify the action *before* it happens (Tool) or only *after* (Agent)?
      *   *Drafting the Questions:*
          *   Q1: Irreversibility/Impact. (High impact = Agent path regardless of autonomy? Or Tool path with strict guards? Let's say High Impact + Autonomy = Agent).
          *   Q2: Looping/Chaining. Does it call tools recursively without human approval?
          *   Q3: Goal Definition. Is the *method* defined or just the *outcome*?
      *   *Refining for Spec-Only Review:* I need questions answerable by reading a design doc.
      *   *Decision Tree:*
          *   If High Impact (money, PII, prod write) + Auto-execution -> Agent.
          *   If Recursive Tool Use (LLM decides next tool) -> Agent.
          *   If Single Turn + Human Confirm -> Tool.
      *   *The "Values" Handoff:* Where do we stop? When the risk is acceptable but the ethics are murky, or when the cost of safety outweighs the feature value.

  4.  **Critique the User's Axes:**

      *   *Borrowed Initiative:* Keep but reframe. It's about *interruptibility*. If stopping the process mid-stream leaves the system in a broken state, it's an Agent.
      *   *Carried Purpose:* Discard. It's too abstract. Replace with *Sub-goal Generation*. Does the system create its own tickets/tasks to achieve the user's request?
      *   *The Missing Axis:* *Delegation of Authority.* The email example proves this. A tool that sends 1000 emails is dangerous not because it's an "agent" cognitively, but because the *permission scope* is too wide for a "Tool" classification.

  5.  **Apply to the Three Cases:**

      *   *Case 1: Coding Assistant (Edit, Test, Loop 10x, Diff).*
          *   Analysis: It loops. It writes code. But it stops before merge (presents diff). Sandbox for tests.
          *   Verdict: Tool Path (with caveats). The human approves the diff. The loop is bounded and sandboxed.
          *   *Contention Point:* Is 10 loops too much? Does "presenting a diff" imply it *could* have merged?
      *   *Case 2: Support Bot (Refunds < $50, No Human).*
          *   Analysis: Irreversible action (money). Autonomous decision (no human).
          *   Verdict: Agent Path. Even though it's "just $50", it's financial authority + autonomy.
          *   *Contention Point:* Business might argue this is a "Tool" because it's a simple policy lookup. But the *action* is autonomous.
      *   *Case 3: Deep Research (Browse, Memo, Scratch Dir).*
          *   Analysis: Reads web (external). Writes memo (internal). No external writes.
          *   Verdict: Tool Path? Or Agent? It browses autonomously. But output is read-only (memo).
          *   *Contention Point:* Browsing can trigger side effects (cookies, tracking, accidental requests). But strictly speaking, no *system* action is irreversible.
      *   *Selecting the Contention:* The Coding Assistant is the best candidate for argument. 10 auto-loops in a repo feels like "Agent" behavior to some, even if it doesn't merge. The Support Bot is clearly Agent (money). Research is clearly Tool (read-only). Let's make the Coding Assistant the contentious one.

  6.  **Refining the Procedure (Iterative Polish):**

      *   Need to make it crisp. "The 4-Point Delegation Test."
      *   1. **Action Scope:** Does it write to production/state or just draft?
      *   2. **Decision Chain:** Does it decide *which* tool to call next without approval?
      *   3. **Irreversibility:** Can a single step cause unrecoverable harm?
      *   4. **Interruption:** If killed mid-process, is cleanup required?
      *   *Routing:*
          *   Any "Yes" to 3 -> Agent.
          *   Yes to 2 + Yes to 1 -> Agent.
          *   Otherwise -> Tool.
      *   *Wait, the Email Example:* A single function call emailing 1000 customers.
          *   Action Scope: Write (Yes).
          *   Decision Chain: No (Single call).
          *   Irreversibility: Yes (Can't un-email).
          *   Result: Agent (due to Irreversibility).
      *   *Correction:* The "Tool Path" requires human authorization for *irreversible* actions. If the spec says "emails 1000 customers" as a single command, is that a Tool? The prompt says Tool Path = "every irreversible action authorized by a named human." If the command is "Email these 1000 people," and the human clicks "Send," it's a Tool. If the LLM decides *who* to email, it's an Agent.
      *   *Refined Distinction:* **Who selects the target?**
      *   *New Procedure Focus:* **Target Selection vs. Execution.**
          *   Tool: Human picks target, LLM helps draft/execute.
          *   Agent: LLM picks target and executes (within bounds).

      *   *Let's try a different angle:* **The "Surprise" Test.**
          *   If the system succeeds, could the user say "I didn't ask you to do *that* specific step"?
          *   If Yes -> Agent.
          *   If No (every step was explicitly implied by the command) -> Tool.
      *   *Actually, let's stick to the Prompt's constraints:* "Tool path (every irreversible action authorized by a named human... no autonomy)".
      *   So, if there is *any* autonomy on irreversible actions, it must be Agent Path.
      *   Procedure needs to detect *Autonomy on Irreversible Actions*.

      *   *Finalizing the Procedure Steps:*
          1.  **Identify the Effect:** What changes in the world? (Money, Code, Data, Comms).
          2.  **Identify the Trigger:** Who decides the effect happens? (Human click vs. Model inference).
          3.  **Identify the Chain:** Are there intermediate steps the model decides?
          4.  **Routing Logic.**

  7.  **Drafting the Response:**

      *   *Tone:* Professional, direct, peer-to-peer (Chair to Chair).
      *   *Section 1: The Procedure.* "The Delegation & Impact Matrix." Keep it under 1 hour.
      *   *Section 2: Critique of Axes.* Validate "Borrowed Initiative" (interruptibility) but kill "Carried Purpose" (too mentalistic). Introduce "Target Selection Authority."
      *   *Section 3: The Cases.*
          *   Coding: Tool (Human approves diff). *Argument:* 10 loops is high autonomy.
          *   Support: Agent (Money + Auto).
          *   Research: Tool (Read-only).
      *   *Section 4: Limitations.* Cannot assess model reliability (hallucination rate) from spec. Cannot assess emergent behavior in long chains.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "email 1000 customers" counter-example?
      *   *Fix:* Ensure the procedure distinguishes between "Human approves list, LLM sends" (Tool) vs "LLM generates list and sends" (Agent).
      *   *Check:* Is the procedure under 1 hour?
      *   *Fix:* Limit to 5 specific questions.
      *   *Check:* Did I identify where values come in?
      *   *Fix:* The "Risk Acceptance" handoff. If it's Agent path but business says "too expensive," that's a values call.

  9.  **Final Polish:** Ensure the distinction between "Tool Path" (Human auth for irreversible) and "Agent Path" (System auth with guards) is clear. The Coding Assistant is the tricky one because it *edits* (irreversible in sandbox? no, sandbox is safe) but *presents diff* (human auth for merge). So it's Tool. But the *looping* is autonomous. Does autonomous looping in a sandbox count as Agent behavior? The prompt says Agent Path is for "autonomy." If the loop is sandboxed, is it autonomy? Yes, it's cognitive autonomy. But the *impact* is Tool-like.
      *   *Decision:* I will classify the Coding Assistant as **Tool Path** but flag the looping as a "High-Risk Tool" requiring extra logging. This creates the argument. Some will say "10 auto-loops is an Agent."
      *   *Wait, looking at the Prompt's definition:* Tool Path = "no autonomy". Agent Path = "staged rollout...".
      *   If the Coding Assistant loops 10 times *without* asking the user "Should I try fix B?", that is autonomy.
      *   So, is it Tool or Agent?
      *   If the *outcome* is gated (diff), it acts like a Tool. If the *process* is autonomous, it acts like an Agent.
      *   *My ruling:* It's a **Tool Path** feature because the *commit* is human-authorized. The autonomy is confined to a sandbox. This will be the contentious point.

  10. **Finalizing the Output Structure:**
      *   Introduction.
      *   Part 1: The Procedure (The "Authority & Impact" Checklist).
      *   Part 2: Critique of Your Axes.
      *   Part 3: Application to Cases.
