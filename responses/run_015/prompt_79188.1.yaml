      *   **Sample (Descriptive/Epistemic):** Focus on *ex post* composition. The body should look like the populace (microcosm). Legitimacy comes from representativeness and the statistical likelihood of correct decisions (Condorcet Jury Theorem logic). Requires larger N for accuracy, stratification, weighting.

  3.  **Analyze the "Sample-Creep" Argument:**
      *   Colleague argues that making sortition more representative (quotas, weighting) undermines the pure lottery ideal (no one deciding who ought to be in the room).
      *   If you stratify to ensure representation, you are no longer running a simple random sample where every individual has the *exact* same probability independent of characteristics. You are engineering the outcome.
      *   Does this destroy the lottery justification? Yes, if the justification relies on pure *ex ante* equality.
      *   Does it strengthen the sample justification? Yes, if the goal is descriptive representation.

  4.  **Analyze the "Squeeze" (Epistemic vs. Deliberative):**
      *   Epistemic (Condorcet): Needs large N, independent judgments.
      *   Deliberative: Needs small N, interaction (which creates correlation/dependence).
      *   Conflict: You can't maximize both. A small deliberative body violates the independence assumption of CJT. A large statistical body prevents deep deliberation.
