answer: |-
  Sample-creep is a substantive philosophical betrayal of the lottery ideal, and the epistemic-deliberative squeeze confirms that sortition rests on two incompatible normative logics that must be chosen between rather than synthesized.

  The lottery conception is fundamentally deontological and individualistic: its justificatory force lies in *ex ante* political equality, where every citizen holds an identical probability of selection regardless of their attributes. The moral claim is that no one can reasonably complain about exclusion because the procedure treated them as equals prior to the draw. The small size of the body is acceptable here because the legitimacy derives from the fairness of the selection mechanism, not the representativeness of the output; the members are trustees chosen by chance, not delegates mirroring demographics. Conversely, the sample conception is consequentialist and collectivist: its force lies in *ex post* descriptive accuracy and statistical inference. Here, legitimacy derives from the body's capacity to stand in for the whole, reducing sampling error to ensure outcomes align with what the populace would decide. This view treats the body as a measurement instrument or a microcosm, where the individual chance of selection is secondary to the aggregate composition.

  Your colleague is correct that sample-creep is not merely terminological but strikes at the normative core of the lottery view. When you introduce stratification, quotas, or weighting to ensure demographic mirrors, you abandon the claim that every individual has an equal chance. You are no longer running a lottery; you are running an engineered selection to satisfy a representational target. This shifts the justification from "everyone had a fair shot" to "the right groups are present." While this may enhance descriptive representation, it surrenders the radical egalitarianism of the pure lottery, where the uneducated, the disengaged, and the marginal have the same unweighted probability as the elite. If you weight votes within the assembly to correct for sampling error, you further violate the political equality of the members themselves, turning them into weighted proxies rather than equal deliberators.

  The squeeze between epistemic aggregation and deliberation is fatal to any attempt to unify these justifications under a single theoretical umbrella. The Condorcet Jury Theorem (CJT), which underpins the epistemic sample view, relies critically on the independence of judgments. Deliberation, by definition, introduces correlation; participants persuade, pressure, and converge upon one another. Once judgments are correlated, the mathematical guarantee of CJT collapses, regardless of the competence of the members. You cannot simultaneously claim the epistemic authority of a statistical aggregate (which requires independence and large N) and the deliberative authority of a transformed consensus (which requires interaction and small N). Most lottocracy proposals gloss over this by assuming deliberation improves competence enough to offset the loss of independence, but this is an empirical gamble, not a theoretical guarantee. In practice, the "sample" justification is doing the heavy lifting in policy proposals because it promises competent outcomes, while the "lottery" justification is retained as rhetorical packaging to secure democratic legitimacy.

  An institution cannot be coherently justified by both at the same time without one logic subordinating the other. If you prioritize the sample logic, you must accept stratification and larger sizes, which dilutes the pure lottery equality. If you prioritize the lottery logic, you must accept simple random selection and small sizes, which undermines the statistical representativeness required for the sample epistemic claim. The current literature often hedges, claiming sortition offers both the fairness of the lottery and the wisdom of the sample, but this is theoretically unstable. You must choose whether the body is a *court* (selected by lot to judge fairly) or a *mirror* (selected by sample to reflect accurately).

  I am highly confident in this distinction, but my reasoning would break if deliberation could be successfully modeled not as a source of correlation, but as a mechanism for error correction that preserves effective independence. If empirical social choice theory demonstrated that structured deliberation systematically cancels out individual biases without inducing herd behavior, the epistemic case for small deliberative bodies would survive the CJT independence violation. Additionally, if a theory of "filtered representation" could show that stratified selection preserves *ex ante* equality sufficiently for procedural legitimacy while achieving *ex post* accuracy, the sample-creep objection would lose its normative bite. Until then, treat them as distinct tools: use the lottery for legitimacy against corruption, and the sample for legitimacy against exclusion, but do not claim one institution solves both problems perfectly.
