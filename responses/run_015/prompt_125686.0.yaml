      *   *Mind Changer:* Evidence of "excludable benefits" in P2P networks. If the sensor owner gets *better* data than non-owners, the free-rider problem shrinks.

      *   *Shaky Reasoning:* The line between "coordination technology" and "incentive structure." If tech lowers coordination costs, does it change incentives? Yes. So separating them is artificial.

  9.  **Final Review against constraints:**
