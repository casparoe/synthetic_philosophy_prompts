          *   *Solution:* Start with the *problem* of craving. Show that satisfaction is fleeting because desire regenerates. Establish that the *relief* is the good part, not the *gain*.
          *   *Sequence:* Experience of Lack -> The Cycle of Craving -> The Value of Relief -> The Instrumental Status of Pleasure.

      *   **2. Carrying Example:**
          *   *Constraint:* No "satisfied monk" (religious/ascetic stereotype). No depression (pathology). No reward (hedonia).
          *   *Idea:* Physical relief is too simple (itch scratching). Achievement is too "positive."
          *   *Better Idea:* *Flow states* or *Deep Focus*? No, that feels like achievement.
          *   *Better Idea:* *Recovery from Illness*? Too temporary.
          *   *Best Idea:* *The "Hum of the Refrigerator" / Baseline Homeostasis.* Or, more actively: *The Experienced Musician Tuning an Instrument.*
          *   *Refinement:* Let's go with **The Deep Sleep vs. The Lucid Dream**. No, too abstract.
          *   *Refinement 2:* **The "Unburdened Walk."** Walking without a destination, without pain, without needing to get anywhere. Just the absence of the need to be elsewhere.
          *   *Refinement 3 (Winner):* **The "Solved Puzzle" Moment.** Not the joy of solving, but the moment *after* the tension releases, before the next task. Actually, let's look for something physiological but secular. **The "Exhale after Holding Breath."** It's universal, secular, purely negative (removal of pressure), but feels good.
          *   *Wait, needs to be sustained.* **The "Well-Fitted Shoe."** You don't notice it. The value is the *absence* of pinching. It's not depression; it's functionality without friction.
          *   *Decision:* **The "Well-Fitted Shoe" (or Garment) Analogy.** It's secular, relatable, implies function without friction, and highlights that noticeability usually signals a problem.

      *   **3. Misconception Map:**
          *   *Negative Utilitarianism (NU):* NU says minimize suffering. Tranquilism says absence of craving is the *only* good. They are close. Need to distinguish early so they don't categorize it prematurely. *Placement:* After defining the core thesis, before discussing action.
          *   *Motivational Paralysis:* "If I don't crave, why do anything?" *Placement:* After discussing instrumental value. Show that action is still needed to maintain the absence.

      *   **4. The Twist (Self as Site):**
          *   *Integration:* Don't make it a separate metaphysics lecture. Weave it into the definition of "experience." If value is absence, there's no "thing" being valued, just the clearing.
          *   *Placement:* Near the end, as a deepening of the core thesis.

      *   **5. End Check:**
          *   *Case:* Mild suffering to prevent worse suffering in a stranger.
          *   *Evaluation:* A Tranquilist says "Yes" *if* it reduces net craving/suffering. But a utilitarian also says "Yes." How to distinguish?
          *   *Distinction:* The Tranquilist doesn't count the stranger's *pleasure* as a gain, only their *pain* as a loss.
          *   *Comprehension Check:* Ask them *why* the action is justified. If they say "to increase overall happiness," they failed. If they say "to eliminate a deficit," they succeeded.

      *   **6. Exclusions:**
          *   Meta-ethics (Why is value real?).
          *   Aristotle (Eudaimonia).
          *   Pre-reading.

  4.  **Structuring the Hour (Whiteboard Flow):**
      *   0-10: Hook & The Cycle of Craving (Dependency Order).
      *   10-25: The Core Thesis & The Example (Carrying Example).
      *   25-35: Misconception 1 (Negative Utilitarianism).
      *   35-45: Misconception 2 (Paralysis) & Instrumentality.
      *   45-55: The Twist (Self as Site).
      *   55-60: End Check.

