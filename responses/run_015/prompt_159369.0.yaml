answer: |-
  # The Norm of Assertion: A Diagnostic Instrument

  **Introduction**
  Standard surveys of assertion norms often begin with conclusions (e.g., "Knowledge is the norm") and work backward to cases. This instrument reverses that order. It maps the logical space of possible norms via structural commitments (Part A) and tests those commitments against intuitive verdicts on concrete cases (Part B).

  Your position is the intersection of your structural answers and your case verdicts. Empty cells in the logical space are diagnosed as incoherent or unoccupied. Where cases underdetermine the norm, the instrument notes the ambiguity.

  ---

  ## Part A: The Structural Decision Tree

  Answer the following six questions. Do not worry about which philosophical view your answer supports; answer based on your pre-theoretical conception of what assertion *is*.

  **Q1. The Deflationary Check**
  Is there a norm *specific* to assertion, distinct from general moral or prudential rules about causing belief?
  *   **(A)** No. Assertion is governed only by the intention to induce belief and general norms against lying or harming.
  *   **(B)** Yes. There is a standard *sui generis* to the act of asserting.
      *   *→ If (A), you are a **Deflationist**. Skip to Scoring Key.*
      *   *→ If (B), proceed to Q2.*

  **Q2. Constitutive vs. Regulative**
  Is this norm part of what *makes* an act an assertion (like the rules of chess), or is it an external standard by which assertions are evaluated (like etiquette)?
  *   **(A)** Constitutive. Violating it means you haven't properly performed the act (or performed it defectively *as* an assertion).
  *   **(B)** Regulative. You can assert without meeting the norm, but you ought not to.
      *   *Diagnostic Note: The "Constitutive/Incorrectness" cell is heavily occupied. The "Regulative/No Sanction" cell is typically empty (a norm without sanction is merely advice).*

  **Q3. The Sanction**
  When the norm is violated, what is the primary defect?
  *   **(A)** **Incorrectness.** The move is invalid, like an illegal chess move.
  *   **(B)** **Blameworthiness.** The move is valid but the speaker is criticisable.
  *   **(C)** **Neither.** The move is valid and the speaker is blameless (perhaps due to excusing conditions), but the assertion lacks a certain status (e.g., assurance).
      *   *Diagnostic Note: (A) aligns with strong constitutive views. (B) aligns with moralised or externalist views. (C) often signals a distinction between the act and the commitment.*

  **Q4. Binary vs. Gradable**
  Does the required epistemic property admit of degrees that track practical context?
  *   **(A)** Binary. You either have the property or you don't, regardless of stakes.
  *   **(B)** Gradable/Stakes-Sensitive. The required level of the property shifts with practical interests or stakes.
      *   *→ If (B), you are committed to a **Stakes-Sensitive** or **Interest-Relative** variant.*

  **Q5. Uniformity vs. Relativization**
  Is the norm the same across all contexts, subjects, and practices?
  *   **(A)** Uniform. One norm governs all assertions, from casual chat to court testimony.
  *   **(B)** Relativized. The norm shifts depending on the conversational context, the audience, or the institutional practice.
      *   *→ If (B), you are committed to a **Context-Relativist** or **Practice-Relative** variant.*

  **Q6. Anchor and Access**
  To whom does the norm attach, and can the speaker know they satisfy it?
  *   **(A)** **Speaker + Internal.** It depends on the speaker's perspective, and they must be able to tell they meet it.
  *   **(B)** **Speaker + External.** It depends on the speaker's actual relation to the fact, even if they can't tell.
  *   **(C)** **Audience.** It depends on what the audience knows or needs.
      *   *→ If (C), you are committed to an **Audience-Relative** norm.*
      *   *→ If (A), you lean toward **Internalist/Justification** norms.*
      *   *→ If (B), you lean toward **Truth/Knowledge** norms.*

  ---

  ## Part B: The Case Quiz

  For each scenario, select the verdict that best matches your intuition.
  **Verdict Options:**
  *   **[DEF]** Defective. The assertion is improper (norm violated), even if the speaker is blameless.
  *   **[OK]** In Order. The assertion is proper (norm met).
  *   **[PRAG]** Pointless/Infelicitous. The assertion is not normatively defective, but is pragmatically odd, redundant, or unhelpful.

  | # | Case Description | [DEF] | [OK] | [PRAG] |
  | :--- | :--- | :---: | :---: | :---: |
  | **1** | **Environmental Luck.** A speaker has excellent evidence for *p* and *p* is true, but in a nearby possible world, a fake barn would have deceived them (they happen to be in the one real barn). They assert *p*. | ⚪ | ⚪ | ⚪ |
  | **2** | **Lottery.** A speaker knows the odds are 1 in 10 million against a ticket winning. They assert of a specific ticket: "This ticket will lose." (Before the draw). | ⚪ | ⚪ | ⚪ |
  | **3** | **High Stakes.** A speaker has standard evidence for *p* (enough for everyday claims). However, the listener's life depends on *p* being true. The speaker asserts *p* without gathering more evidence. | ⚪ | ⚪ | ⚪ |
  | **4** | **Justified False.** A speaker has overwhelming evidence for *p*, but *p* is false (due to misleading evidence unknown to them). They assert *p*. | ⚪ | ⚪ | ⚪ |
  | **5** | **Self-Fulfilling Intention.** A speaker asserts "I will leave the room in one minute," and the act of asserting this intention helps settle their mind to do it. They do not know *yet* if they will succeed. | ⚪ | ⚪ | ⚪ |
  | **6** | **Redundant.** A speaker asserts *p* to an audience that already knows *p* with certainty. The speaker does not know that the audience knows. | ⚪ | ⚪ | ⚪ |
  | **7** | **Borderline Vague.** A speaker asserts "This patch is red" of a patch exactly on the borderline between red and orange. | ⚪ | ⚪ | ⚪ |
  | **8** | **Institutional.** An automated weather system asserts "Rain is likely." No single human possesses the evidence; it is aggregated from sensors. | ⚪ | ⚪ | ⚪ |
  | **9** | **Hedged.** A speaker asserts "I believe *p*" or "Probably *p*," explicitly disclaiming knowledge or certainty, though they actually know *p*. | ⚪ | ⚪ | ⚪ |
  | **10** | **Practice-Specific.** A clinician asserts a prognosis to a patient based on statistical survival rates (e.g., "You have 6 months"), which they would not assert as a fact in a research paper. | ⚪ | ⚪ | ⚪ |

  ---

  ## Scoring Key and Logical Map

  ### 1. Mapping Quiz Patterns to Epistemic Properties
  Tally your [DEF] (Defective) verdicts. The pattern of defects reveals the *content* of the norm you follow.

  *   **The Truth Norm:** You mark **[DEF]** only on **Case 4 (Justified False)**. You allow assertions on Lottery, Luck, and High Stakes provided the content is true.
  *   **The Knowledge Norm:** You mark **[DEF]** on **Case 1 (Luck)**, **Case 2 (Lottery)**, and **Case 4 (False)**. You typically mark **[OK]** on High Stakes (if knowledge is present) and **Case 5 (Intention)** (if self-knowledge is present).
  *   **The Justified Belief Norm:** You mark **[DEF]** on **Case 4 (False)** but **[OK]** on **Case 1 (Luck)** and **Case 2 (Lottery)** (provided justification/probability is high).
  *   **The Warrant Norm:** You mark **[OK]** on **Case 8 (Institutional)** even if no individual knows, and often **[OK]** on **Case 2 (Lottery)** if the warrant is sufficient for action.
  *   **Stakes-Sensitive Variants:** You mark **[DEF]** on **Case 3 (High Stakes)** even if you marked **[OK]** for similar evidence in low-stakes contexts.
  *   **Audience-Relative Variants:** You mark **[DEF]** or **[PRAG]** on **Case 6 (Redundant)** specifically because the audience lacks a need to know, whereas a Speaker-Norm proponent marks **[OK]**.
  *   **Practice-Relative Variants:** You mark **[OK]** on **Case 10 (Practice-Specific)** even if you would mark **[DEF]** on a similar claim in a different context.
  *   **Deflationary:** You mark **[OK]** on almost all cases, reserving **[DEF]** only for lies or malicious intent (not covered in quiz, but implied by Part A, Q1).

  ### 2. Integrating Structure (Part A) and Content (Part B)
  Combine your Part A path with your Part B profile to locate your specific leaf.

  | Part A Profile | Part B Profile | **Resulting Norm Label** |
  | :--- | :--- | :--- |
  | Q1(B), Q4(A), Q5(A) | Defects on Luck, Lottery, False | **Standard Knowledge Norm** |
  | Q1(B), Q4(A), Q5(A) | Defects on False only | **Standard Truth Norm** |
  | Q1(B), Q4(A), Q5(A) | Defects on False, OK on Luck/Lottery | **Justified Belief Norm** |
  | Q1(B), Q4(B), Q5(A) | Defects on High Stakes + Knowledge failures | **Stakes-Sensitive Knowledge Norm** |
  | Q1(B), Q4(A), Q5(B) | Defects vary by Context/Practice | **Contextualist / Relativist Norm** |
  | Q1(B), Q6(C) | Defects on Redundant / Audience-Ignorance | **Audience-Relative Norm** |
  | Q1(B), Q6(B) | OK on Institutional / Aggregated | **Collective Warrant Norm** |
  | Q1(A) | No specific defects | **Deflationary / No Norm** |

  ### 3. Handling Ties and Inconsistencies
  *   **The "Moorean" Conflict:** If you answer **[OK]** on Case 4 (Justified False) but **[DEF]** on Case 1 (Luck), you hold that truth is not required but knowledge (anti-luck) is. This is logically unstable (Knowledge entails Truth). *Diagnosis:* You likely conflate *blameworthiness* with *defectiveness*. Revisit Part A, Q3.
  *   **The "Lottery" Tie:** If you answer **[OK]** on Case 2 (Lottery) but **[DEF]** on Case 1 (Luck), you distinguish statistical evidence from perceptual evidence. This supports a **Warrant Norm** over a pure Probability Norm.
  *   **Inconsistent Stakes:** If you answer **[OK]** on Case 3 (High Stakes) but selected Part A, Q4(B) (Gradable), your structural commitment outstrips your intuitions. *Diagnosis:* **Unreflective Invariantist.**
  *   **Vague Content:** If you marked **[DEF]** on Case 7 (Vague), check Part A, Q2. If you think assertion requires determinate truth, you hold a **Truth-Gap View**. If you marked **[OK]**, you likely hold a **Knowledge-First** view where one can know borderline truths (or that vagueness does not preclude assertion).

  ### 4. Distinguishability Table
  The following table shows which quiz items are designed to separate neighbouring positions.

  | Item | Primary Distinction | Secondary Distinction |
  | :--- | :--- | :--- |
  | **1 (Luck)** | Knowledge Norm vs. Justified True Belief Norm | Externalist vs. Internalist Access |
  | **2 (Lottery)** | Knowledge Norm vs. High Probability/Truth Norm | Warrant vs. Statistical Evidence |
  | **3 (Stakes)** | Invariantism vs. Contextualism/Pragmatic Encroachment | Binary vs. Gradable Property |
  | **4 (False)** | Truth/Knowledge Norm vs. Justified Belief Norm | Factive vs. Non-Factive Norms |
  | **5 (Intention)** | Truth Norm vs. Knowledge Norm (Self-Knowledge) | Expressive vs. Descriptive Assertion |
  | **6 (Redundant)** | Speaker Norm vs. Audience Norm | Constitutive vs. Cooperative Principle |
  | **7 (Vague)** | Truth Norm (Gaps) vs. Knowledge Norm | Semantic vs. Epistemic Vagueness |
  | **8 (Institutional)** | Individual Knowledge vs. Collective Warrant | Personal vs. Social Epistemology |
  | **9 (Hedged)** | Knowledge Norm vs. Weaker Norms | Opt-out conditions |
  | **10 (Practice)** | Uniform Norm vs. Practice-Relative Norm | Monism vs. Pluralism about Assertion |

  ### 5. Limitations and Indistinguishable Positions
  Be aware of the following blind spots in this instrument:

  1.  **Knowledge vs. No-Luck True Belief:** Case 1 (Environmental Luck) attempts to separate Knowledge from True Belief + Justification. However, if a participant intuits that the Lucky Speaker *does* know (a minority view), the Knowledge Norm and the True Belief Norm collapse on this instrument. *Further Case Needed:* A "Gettierized" case where the belief is true and justified but the connection is clearly deviant (e.g., clock stopped at the right time).
  2.  **Truth vs. Knowledge on Vague Content:** Case 7 (Vague) may not separate the Truth Norm from the Knowledge Norm if one holds that there is no truth-value to know. If you marked **[DEF]**, it is unclear if you require Truth or Knowledge. *Further Case Needed:* A case where the speaker knows the content is borderline but asserts it anyway to coordinate action.
  3.  **Warrant vs. Justified Belief:** Case 8 (Institutional) separates individual justification from collective warrant. However, "Warrant" is often defined as "whatever turns true belief into knowledge." If you accept the Knowledge Norm, you may also accept the Warrant Norm as its name. This instrument treats them as distinct only if you allow assertions without individual knowledge (Case 8 = **[OK]**).
  4.  **Constitutive Incorrectness vs. Blame:** Part A, Q3 separates these, but in practice, many users conflate "You shouldn't have done that" (Blame) with "That move was invalid" (Incorrectness). If your Quiz results suggest a Knowledge Norm but your Tree suggests Regulative/Blame, you may hold a **Kvanvig-style** view (Knowledge is the goal, but not the rule).

  **Empty Cell Diagnosis:**
  *   **Constitutive + No Sanction:** If you claim the norm is constitutive (Part A, Q2) but violation carries no incorrectness or blame (Part A, Q3), your position is likely **Incoherent**. A constitutive rule without a sanction is not a rule.
  *   **Audience Norm + Uniform:** If you claim the norm depends on the audience (Part A, Q6) but is uniform across practices (Part A, Q5), you occupy a **Rare/Unexplored** cell. Most audience-relative views are also context-sensitive.
  *   **Internalist + Knowledge Norm:** If you require Internal Access (Part A, Q6) but also require Knowledge (Part B, Luck=DEF), you occupy a **Tension-Filled** cell. Knowledge is typically externalist; requiring internal access to knowledge usually collapses the norm into Justified Belief.
