      *   *Usury (Tokos):* Aristotle famously condemns interest. Money is barren. It cannot breed money. Charging interest is "most contrary to nature."
      *   *Justice in Exchange:* Exchange must maintain the equilibrium of the community. If one party gains too much at the expense of another, the bond of the city breaks.

  3.  **Apply Aristotle to the Cooperative Scheme:**
      *   *The Unit (Labor-Hour):* Aristotle would likely question the commensurability of *time* alone. Is an hour of a doctor's work equal to an hour of a janitor's work? For Aristotle, value is tied to need and social function, not just duration.
