  MEMORANDUM

  **TO:** All Faculty, Department of Social Sciences
  **FROM:** Committee on Moral Foundtaions and Institutional Harmony
  **DATE:** October 24, 2023
  **SUBJECT:** Adjudication of Dispute Regarding Visiting Speaker Protocol (Case #MFT-2023-B)

  1.  **Purpose and Scope**
      Following the prolonged discontinuity of discourse observed in the communal kitchenette regarding the proposed invitation of Dr. Aris Thorne, this Committee has convened to resolve the normative impasse. It is the standing position of this Committee that moral disagreements are not merely differences of opinion but quantifiable discrepancies in psychometric profiling. Therefore, moral truth can be adjudicated by determining which coalition possesses the most robust activation across the six foundational axes.

  2.  **Psychometric Assessment of Parties**
      Mandatory MFQ (Moral Foundations Questionnaire) administration was conducted for both the Pro-Invitation Coalition (PIC) and the Safety & Inclusion Working Group (SIWG). The results indicate distinct moral matrices:
      *   **The Pro-Invitation Coalition:** Staff members advocating for the speaker demonstrated statistically significant elevation in the **Liberty/Oppression** foundation (interpreting cancellation as coercive) and the **Authority/Subversion** foundation (citing institutional autonomy to host guests).
      *   **The Safety & Inclusion Working Group:** Staff members opposing the speaker demonstrated peak activation in the **Care/Harm** foundation (citing potential psychological distress) and the **Fairness/Cheating** foundation (citing unequal platforming of marginalized views).

  3.  **Comparative Normative Weighing**
      The Committee acknowledges the difficulty in comparing the ethical weight of "Liberty" against "Care." However, to proceed with administrative scheduling, we must treat these foundations as commensurable units of moral currency.
      *   **Clause 3.1:** If we accept that psychological prevalence indicates moral validity, the side with the higher aggregate score should prevail.
      *   **Clause 3.2:** Conversely, if we accept that specific foundations hold institutional priority, Care/Harm typically outweighs Liberty/Oppression in HR guidelines, whereas Authority/Subversion outweighs Fairness/Cheating in Faculty Handbook Section 9.
      *   **Clause 3.3:** Since the foundations are mutually contradictory yet equally "real" in terms of neural activation, declaring one side "correct" would invalidate the psychological reality of the other side. This creates a paradox of institutional harmony.

  4.  **Resolution and Recommendation**
      To avoid privileging one moral matrix over another—which would itself be a violation of the Liberty/Oppression foundation of the losers—the Committee recommends the following absurdity as a binding policy:
      *   **Implementation of a "Pluralism Holiday":** For the duration of the speaker's visit (October 30–31), all normative truth claims regarding the speaker's content are suspended.
      *   **Operational Protocol:** Staff may attend the lecture, but are prohibited from forming moral judgments until November 1st.
      *   **Compromise Action:** The speaker will be invited, but will deliver their address via pre-recorded text-to-speech software to minimize Authority presence, while the Q&A session will be conducted in a soundproof booth to mitigate Care/Harm risks.

  5.  **Conclusion**
      We trust this solution honors the descriptive reality of your moral psychology without forcing us to engage in the untenable task of actual ethical reasoning. Please submit your waiver forms acknowledging that no side was "right," only "psychologically consistent."

  **Signed,**

  *Dr. L. P. Haidt-Smith*
  Chair, Committee on Moral Foundtaions and Institutional Harmony
