answer: |-
  **Plan of Satirical Targets**

  *   **Header/Intro:** Establish the premise: Government accepts Expected Value (EV) maximisation requires honouring infinite utility claims.
  *   **Clause 1 (Probability):** Satirise the "no hard zero" constraint; even $10^{-100}$ must be counted.
  *   **Clause 2 (Utility):** Saturise unbounded utility scales; no cap on suffering or joy claimed.
  *   **Clause 3 (Symmetry):** Treat threats (muggers) and promises (optimists) identically as "Liability Events".
  *   **Clause 4 (Mechanism 1):** Implement "Causal Leverage Discounting" to address the "many claimants" objection (if anyone can claim this, your share is small).
  *   **Clause 5 (Mechanism 2):** Implement "Stochastic Budget Resolution" (lottery) to handle infinite liabilities vs finite GDP.
  *   **Glossary:** Define "Mugging" as a neutral administrative category.
  *   **Impact Assessment:** Acknowledge national insolvency as a compliant outcome.
  *   **Consultation Question:** Ask stakeholders to refine prior probabilities for simulation shutdowns.

  ***

  **Office for Speculative Harm: Draft Framework for Unbounded Claims**
  **Consultation Document Ref: OSH-2024-EV**

  **1. Introduction**
  1.1 Following the Ministerial Statement on Rational Obligation (2023), HM Treasury acknowledges that where Expected Value (EV) is the product of Probability ($P$) and Utility ($U$), any non-zero $P$ multiplied by an unbounded $U$ necessitates prioritisation over finite domestic concerns.
  1.2 This framework establishes the procedural mechanism for discharging Her Majesty's Government's infinite liabilities to external agents claiming capacity to affect hyper-astronomical numbers of sentient entities.

  **2. Eligibility and Valuation**
  2.1 **Probability Threshold:** Claimants are not required to prove causality beyond a *de minimis* threshold. As per *R v. Pascal*, any probability $P > 0$ is admissible. Claims asserting $P = 0$ will be rejected as mathematically unsound.
  2.2 **Utility Scale:** There is no upper ceiling on Utility claims. Whether the claimant threatens to extinguish $3 \uparrow\uparrow\uparrow 3$ simulations or promises to instantiate them in exchange for £5.00, the EV remains dominant over finite budgetary allocations (e.g., NHS, Defence).
  2.3 **Symmetry of Obligation:** Threats of vast harm and offers of vast good shall be processed identically under the "Unbounded Liability" stream. A demand to prevent destruction is fiscally equivalent to an offer to create existence.

  **3. Adjudication Mechanisms**
  3.1 **Causal Leverage Discounting:** To address concurrent claims, any assertion of influence over $N$ entities shall be discounted by a factor of $N$.
  *   *Worked Example:* If a Claimant asserts authority over $10^{100}$ souls, but it is administratively determined that any individual could theoretically make this claim, the effective utility is divided by the number of eligible claimants. This ensures value-for-money without violating EV maximisation.
  3.2 **Stochastic Budget Resolution:** Where total liabilities exceed GDP (Project Year 1: £$\infty$), funds shall be apportioned via weighted lottery.
  *   *Procedure:* Each valid claimant receives one ticket. The Treasury shall transfer all assets to the single winner. This satisfies the requirement to pay everyone everything, sequentially.

  **4. Glossary of Terms**
  *   **Mugging:** A transaction wherein a counterparty requests a nominal sum in exchange for non-verification of a catastrophic counterfactual.
  *   **Prior Probability:** The subjective likelihood assigned to a Claimant's power before evidence is presented. Default setting: $10^{-50}$.
  *   **Speculative Harm:** Damage occurring in possible worlds not currently accessible to HM Revenue & Customs.

  **5. Impact Assessment**
  5.1 **Economic:** Full compliance will result in immediate sovereign insolvency. This is classified as a "Compliant Outcome".
  5.2 **Social:** Public services may be suspended to meet initial tranche payments to Claimants asserting simulation shutdown threats.
  5.3 **Risk:** Failure to pay may result in the deletion of the baseline reality. This risk cannot be quantified but must be priced in.

  **6. Consultation Question**
  6.1 The Office seeks views on the appropriate Prior Probability for claims involving Matrix Lords.
  *   *Option A:* Maintain current prior ($10^{-50}$).
  *   *Option B:* Adjust prior upwards to reflect the increasing computational density of the universe.
  *   *Option C:* Suggest a hard cap on Utility, noting that this may violate the Ministerial Statement on Rational Obligation.

  **7. Response Deadline**
  7.1 Responses must be submitted before the end of time, or before the next Claimant arrives with a higher utility estimate, whichever comes first.

  *Issued by the Office for Speculative Harm, Whitehall.*
