          *   *Correction:* Standard Block view is Phenomenal > Access. Access usually implies report capability. GWT view is Consciousness = Access (Global Availability).
          *   I will use the prompt's Thin/Thick distinction to sharpen the disagreement.

  8.  **Finalizing the Output Structure:**
