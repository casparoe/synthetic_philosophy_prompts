answer: |-
  **ADVERSARIAL COLLABORATION PROTOCOL: CONSCIOUSNESS & ACCESS**
  **Facilitator:** [Your Name/AI Persona]
  **Participants:** "GWT Proponent" (Side A) vs. "Phenomenal Proponent" (Side B)
  **Context:** High School Philosophy Club (Library, Post-School)

  ---

  ### FACILITATOR'S PREAMBLE
  You are right to suspect they are talking past each other, but your diagnosis needs a slight adjustment. It is not simply that one is making a constitutive claim and the other an epistemic claim. Both are making constitutive claims about the same target ("Consciousness"), but they are *fixing the reference* of that term differently.

  *   **Side A (GWT)** fixes the reference functionally: "Consciousness" is the name of the *role* played by globally broadcast information.
  *   **Side B (Phenomenal)** fixes the reference ostensively: "Consciousness" is the name of *this feeling* (pointing inward), regardless of the functional role it plays.

  Because they fix the reference differently, they predict different neural correlates. This is not *merely* verbal, because if Side B is right, Side A is looking for neural correlates in the wrong place (frontal/parietal vs. occipital/sensory). If Side A is right, Side B is chasing a ghost (phenomenality without function).

  Below is the document they need to sign before eating another slider.

  ---

  ### PART I: THE TREATY (AGREED CLAIMS)
  *Both parties must sign off on these propositions before proceeding. If you reject one, you are not arguing about consciousness; you are arguing about something else.*

  1.  **The Existence of Experience:** There is "something it is like" to see a red flash, feel pain, or hear a tone. Denying this (eliminativism) is off the table for this collaboration.
  2.  **The Fallibility of Report:** Verbal report is a *measure* of consciousness, not consciousness itself. Report can fail due to memory decay, motor failure, or criterion shifts. A lack of report does not *automatically* entail a lack of experience.
  3.  **Unconscious Processing Exists:** The brain processes information that does not reach awareness (e.g., blindsight, masking, priming). There is a difference between "brain state X occurs" and "subject experiences X."
  4.  **The Correlation Constraint:** Any theory of consciousness must eventually map onto physical states in the brain (or substrate). Dualism that posits a non-physical soul is excluded from this specific empirical debate.
  5.  **Thin vs. Thick Access Distinction:** We agree to use the following terminology for the duration of this collaboration:
      *   **Thin Access:** Information is broadcast to downstream systems (memory, planning, emotion) but *not* necessarily to the systems required for verbal report.
      *   **Thick Access:** Information is available for verbal report and deliberate action selection.
      *   **Phenomenality:** The subjective quality of the experience itself.

  ---

  ### PART II: MAP OF DISAGREEMENT
  *Each row states the dispute neutrally. Side A and Side B must verify that the "Position" column accurately reflects their view. No strawmanning.*

  | # | The Dispute | Side A (GWT) Position | Side B (Phenomenal) Position |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Constitutive Claim**<br>What *makes* a state conscious? | Consciousness *just is* global availability (Thin Access). If a state is not broadcast to multiple systems, there is no "light on" in the head. | Consciousness is a property of specific sensory/representational states that can exist *without* global availability. Phenomenality is not constituted by broadcasting. |
  | **2** | **The Overflow Claim**<br>Can experience exceed access? | **No.** What you experience is exactly what is in the global workspace. If you can't access it (even implicitly), you aren't experiencing it. The feeling of "richness" is an illusion generated by rapid sampling. | **Yes.** Phenomenal consciousness overflows access. We experience more than we can report or even use for planning. The "richness" is real, not an illusion. |
  | **3** | **The Neural Locus**<br>Where should we look for the NCC (Neural Correlates of Consciousness)? | **Fronto-Parietal.** Consciousness requires the "ignition" of a global workspace, which necessarily involves prefrontal and parietal networks for broadcasting. | **Posterior Cortex.** Consciousness can occur in sensory-specific areas (occipital/temporal) without frontal involvement. Frontal activity is for *reporting*, not *experiencing*. |
  | **4** | **The Hard Problem**<br>Is there a residual explanatory gap? | **Mostly Dissolved.** Once we explain how broadcasting integrates information for control, the "hard" part is just a confusion about what the word "consciousness" refers to. | **Remains.** Explaining the mechanism of broadcasting explains *access*, but does not explain why that broadcasting feels like *anything* at all. |

  ---

  ### PART III: THE CRUXES (ADVERSARIAL PROTOCOL)
  *This is the most important section. For each crux, we identify a concrete case. Both sides must pre-register what outcome would force them to update their confidence. If you cannot imagine evidence that would prove you wrong, you are not doing science.*

  #### CRUX 1: The Partial Report Paradigm (Iconic Memory)
  **The Case:** A grid of 12 letters is flashed for 50ms. A tone cues the subject to report only one row. Subjects report high accuracy for the cued row.
  **The Data Point:** We measure neural activity for the *uncued* letters.
  *   **Scenario:** fMRI/EEG shows robust, sustained activity in visual cortex for uncued letters, but *no* fronto-parietal ignition. Subject reports seeing "a flash" but no specific letters.

  | Side | Prediction | What Would Change Your Mind? |
  | :--- | :--- | :--- |
  | **A (GWT)** | The uncued letters were **not conscious**. The visual activity is unconscious priming. Without ignition, there is no experience. | If you can demonstrate that the uncued letters influence *semantic* processing (e.g., priming a synonym) without ignition, I must concede that Thin Access is not required for Phenomenality. |
  | **B (Phenomenal)** | The uncued letters **were conscious** but inaccessible (Overflow). The subject experienced the grid but could only report the cued row. | If you can prove that the visual activity for uncued letters is identical to activity during masked unconscious priming, I must concede that "richness" is an illusion and Access = Phenomenality. |

  #### CRUX 2: The Prefrontal Patient (Disconnection)
  **The Case:** A patient with bilateral prefrontal cortex (PFC) damage or disconnection. They can discriminate stimuli (press button for red vs. green) but have deficits in complex planning/report.
  **The Data Point:** The patient discriminates correctly at 95% accuracy but claims "I'm just guessing" or gives delayed reports.

  | Side | Prediction | What Would Change Your Mind? |
  | :--- | :--- | :--- |
  | **A (GWT)** | The patient has **severely degraded or no consciousness**. They are functioning on "autopilot" (zombie-like). Without PFC, there is no Global Workspace. | If the patient can demonstrate novel, flexible learning that requires integration of memory and perception (not just reflex), I must concede PFC is not essential for the Workspace. |
  | **B (Phenomenal)** | The patient **has normal experience** but impaired access/report. The "what it's like" is intact in posterior cortex; the ability to tell us about it is broken. | If the patient shows signs of "neglect" or unawareness of their own deficits (anosognosia) consistent with total lack of awareness, I must concede that PFC is necessary for Phenomenality. |

  #### CRUX 3: The AI Bottleneck (Theoretical Boundary)
  **The Case:** An AI architecture with distinct modules (vision, language, memory) that must write to a central, capacity-limited "shared buffer" to coordinate tasks.
  **The Data Point:** The AI behaves exactly like a human on all consciousness tests (metacognition, report, error monitoring).

  | Side | Prediction | What Would Change Your Mind? |
  | :--- | :--- | :--- |
  | **A (GWT)** | **Yes, it is conscious.** If the functional architecture implements Global Broadcasting, it instantiates consciousness. Substrate (silicon vs. meat) doesn't matter. | If it is demonstrated that the AI lacks *internal* state integration despite the buffer (e.g., it's just a lookup table), I must concede function isn't enough. |
  | **B (Phenomenal)** | **Unknown/Unlikely.** Functional broadcasting explains access, not phenomenality. Unless the AI has biological-like sensory qualia, it's a "philosophical zombie." | If the AI can pass a "Phenomenal Turing Test" (distinguishing inverted spectrum scenarios reliably), I must concede functionalism accounts for phenomenality. |

  ---

  ### PART IV: VERBAL DISPUTE ANALYSIS
  *Is this fight just about words?*

  **Diagnosis:** Partially, but not entirely.
  There is a **verbal component** regarding the label "Consciousness."
  *   If Side A defines "Consciousness" = "Globally Accessible Information," then Side B's "Phenomenal Consciousness without Access" is a contradiction in terms by definition.
  *   If Side B defines "Consciousness" = "Subjective Feel," then Side A's "Access without Feel" is impossible by definition.

  **Why it is NOT merely verbal:**
  The definitions drive **empirical predictions**.
  *   If Side A is right, scanning the Prefrontal Cortex is the only way to find consciousness. Scanning the Visual Cortex alone is a waste of time for detecting awareness.
  *   If Side B is right, scanning the Prefrontal Cortex is measuring *report*, not awareness. You could be scanning the wrong area entirely.

  **Resolution Protocol:**
  Stop using the word "Consciousness" alone. Use compound terms:
  *   Side A must say: **"Access-Consciousness"** (or Global Availability).
  *   Side B must say: **"Phenomenal-Consciousness"** (or Experiential Quality).
  *   **The Question becomes:** *Do Access-Consciousness and Phenomenal-Consciousness always co-occur in the human brain?*
      *   Side A says: **Yes.** (They are identical).
      *   Side B says: **No.** (They can dissociate).

  ---

  ### PART V: TIE-BREAKERS (NO "MORE RESEARCH NEEDED")
  *If the data comes in ambiguous, who loses?*

  1.  **The "Ignition" Tie-Breaker:**
      *   **Experiment:** Use continuous flash suppression to keep a stimulus unconscious. Measure the exact threshold where the subject reports seeing it.
      *   **Tie-Breaker:** If "ignition" (frontal spike) consistently happens *after* the subject reports awareness (based on reaction time modeling), **Side A loses**. (This suggests ignition is for report, not experience). If ignition consistently happens *before* or simultaneous with the earliest possible report time, **Side B loses**.

  2.  **The "Richness" Tie-Breaker:**
      *   **Experiment:** Change detection task. Show an array, change one item. Ask: "Did you see the change?" vs "Can you point to the change?"
      *   **Tie-Breaker:** If subjects reliably report "I saw a change" but cannot point to *where* (above chance) significantly more often than they report "I saw nothing," **Side A loses**. (This proves Phenomenal > Access). If "I saw a change" always correlates with ability to point, **Side B loses**. (This proves Access = Phenomenal).

  ---

  ### FACILITATOR'S NOTE TO THE CLUB
  You asked about the gas station sliders. Keep them. But print this document out. Next meeting, don't let them talk until they've read Part I and signed it. Then, pick **one** row from Part II and argue *only* about that.

  If Side A tries to argue about "what it feels like," stop them. They are arguing about Access.
  If Side B tries to argue about "neural ignition," stop them. They are arguing about Phenomenology.

  Make them fight over the **Cruxes**. That's where the truth is. Good luck.
