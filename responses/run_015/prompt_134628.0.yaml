      *   Okay, I need to make sure the "Thin vs Thick" distinction helps clarify *which* access is being debated. Usually, GWT says Consciousness = Global Availability (Thin). Report is just the proof. Side B says Phenomenality > Global Availability.
      *   Actually, let's look closer at the prompt's definition of Thin/Thick.
          *   Thin: Broadcast to consumer systems (memory, planning) but *not* verbal report.
