          *   Row 3: Role of Prefrontal Cortex (Essential vs. Peripheral).
      *   **Section 3: Cruxes & Adversarial Protocol:** This needs to be sharp.
          *   *Crux 1: The Partial Report Paradigm.* Does iconic memory hold conscious content?
          *   *Crux 2: The PFC Patient.* Can you have experience without frontal integration?
          *   *Crux 3: The AI Architecture.* Is functional isomorphism sufficient?
      *   **Verbal Dispute Analysis:** Address the user's specific worry. It's not *just* verbal because it leads to different experimental designs. But there is a "terminological stipulation" layer.
      *   **Tie-Breakers:** What would actually change a mind? fMRI data? Behavioral thresholds?

  5.  **Refining the Tone:**
