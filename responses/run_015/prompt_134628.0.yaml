      *   **Side B (Phenomenal/Access Distinction Proponent):** Phenomenal consciousness (what it's like) can come apart from Access (report/use). Experience is richer than what we can report. GWT explains access, not experience.
      *   **The Core Conflict:** This is essentially the Dehaene/Changeux (GWT) vs. Block/Koch (Phenomenal/Overflow) debate.
      *   **The "Talking Past Each Other" Diagnosis:** The user suspects one is making a constitutive claim (what consciousness *is*) and the other an epistemic claim (what we can *measure*). This is partially right, but deeper. It's often a dispute over *reference fixing*. Are we defining "consciousness" by its functional role (A) or by its ostensive phenomenological character (B)?

  3.  **Brainstorming & Strategy for the Document:**
      *   *Common Ground:* Both agree there is something it is like to see red. Both agree reporting requires mechanisms. Both agree neuroscience matters. Both agree "zombies" (in the philosophical sense) are a useful thought experiment even if not real.
      *   *Disagreements:* The nature of "unconscious perception." Is it *really* unconscious if it affects behavior? Or is it conscious but unreported?
      *   *Thin vs. Thick Access:* This is a crucial distinction. GWT usually cares about *global* availability (Thin), but verification requires *report* (Thick). Side B argues Thin can exist without Thick, or Phenomenal can exist without Thin.
