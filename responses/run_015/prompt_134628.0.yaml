          *   *AI:* Side A says yes, if architecture matches. Side B says maybe not, depends on substrate or specific phenomenology.
      *   *Verbal Dispute:* Is "Consciousness" one concept or two? If we stipulate definitions, do the empirical predictions diverge? Yes, they do (see Cruxes). So it's not *merely* verbal, but the definition drives the empirical search.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the sophistication of the high schoolers.
      *   **Section 1: Agreed Claims:** Need to find the intersection.
          *   There is a first-person perspective.
          *   Report is fallible.
          *   Neuroscience correlates are real.
          *   Unconscious processing exists (priming, etc.).
      *   **Section 2: Disagreement Table:**
          *   Row 1: Definition of Consciousness (Constitutive vs. Phenomenal).
