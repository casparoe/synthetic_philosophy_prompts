prompt: |-
  I'm preparing a ninety-minute session for an interdisciplinary reading group—mostly philosophers of science with no background in metaethics—on evolutionary debunking arguments. Rather than a generic survey, I want to teach the specific variant that targets non-naturalist normative realism by explaining the evolutionary origins of deontic modal intuitions: the sense that certain actions are strictly forbidden regardless of consequences. Plan the explanatory arc: first, what conceptual dependency must be established before the debunking argument can be heard—whether it is the causal-inertness problem for non-natural properties, the distinction between origin and justification, or something else, and in what order; second, the single concrete moral intuition that should carry the entire demonstration, specifying why it should be a direct-action prohibition rather than a cost-benefit judgment and what features it must have; third, the predictable misconceptions—likely that an evolutionary explanation genetically falsifies the belief, that such explanations are unfalsifiable just-so stories, and that the debunking extends indiscriminately to logical or mathematical beliefs—and the precise point in the sequence where each should be defused; fourth, one diagnostic question I can ask at the end that distinguishes someone who has grasped the argument structure from someone who merely agrees with the skeptical conclusion; and finally, what I should explicitly leave out at this level—perhaps the full evolutionary game-theoretic literature on cooperation, or the distinctions between reliabilist and process-based epistemologies—and how to state that omission without undermining the session.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Philosophers of science (interdisciplinary reading group), *no background in metaethics*. This is crucial. They understand explanation, causation, evidence, and theory structure, but not terms like "supervenience," "queerness," or "categorical imperatives" without definition.
      *   **Topic:** Evolutionary Debunking Arguments (EDAs), specifically the variant targeting *non-naturalist normative realism*.
      *   **Specific Focus:** Explaining the evolutionary origins of *deontic modal intuitions* (strict prohibitions, "must not," regardless of consequences).
      *   **Duration:** 90 minutes.
      *   **Required Components:**
          1.  Conceptual dependency arc (what must be established first).
          2.  Single concrete moral intuition (why a prohibition, not cost-benefit).
          3.  Predictable misconceptions & when to defuse them.
          4.  Diagnostic question (structure vs. conclusion).
          5.  Explicit omissions (what to leave out & how to frame it).

  2.  **Deconstruct the Argument (The "Streetenian" Challenge):**
      *   The core argument is roughly: If our moral beliefs are shaped by evolution for fitness, and non-natural moral truths are causally inert, then the correlation between our beliefs and the truth is coincidental. Therefore, we lack justification.
      *   *Constraint:* The user wants to focus on *deontic modal intuitions* (strict prohibitions). This aligns well with the "non-naturalist" target because naturalists/reductionists often try to explain morality via well-being/consequences, whereas non-naturalists often posit irreducible normative facts (like "wrongness" itself).
      *   *Audience Fit:* Philosophers of science will care about inference to the best explanation, causal mechanisms, and epistemic justification.

  3.  **Drafting Component 1: Conceptual Dependency Arc:**
      *   *Problem:* If I jump straight to "evolution made us think murder is wrong," they might say "So what? Evolution made us see trees, and trees exist."
      *   *Necessary Pre-condition:* They need to understand *what* is being posited by the realist. It's not just "moral facts," it's *non-natural* moral facts.
      *   *Key Distinction:* Origin vs. Justification (Genetic Fallacy). This is standard, but for philosophers of science, the deeper issue is *Causal Inertness/Epistemic Access*.
      *   *Order:*
          1.  Define the Target (Non-naturalist Realism): Moral facts exist independently of us and are not reducible to natural properties (like pain/pleasure).
          2.  The Epistemic Challenge (The "Access Problem"): How do we know these facts if they don't causally interact with us?
          3.  The Evolutionary Premise: Our moral intuitions are shaped by fitness, not truth-tracking.
          4.  The Defeater: The coincidence of (1) and (3) undermines justification.
      *   *Refinement:* The prompt asks what dependency must be established *before* the argument can be heard. It's the **Causal Inertness / Epistemic Access Gap**. Without establishing that the moral facts *cannot* causally influence our beliefs (unlike trees), the evolutionary explanation doesn't debunk; it just complements.
      *   *Decision:* Start with the Metaphysical Commitment (Non-naturalism) $\rightarrow$ The Epistemic Constraint (Causal Inertness) $\rightarrow$ The Evolutionary Explanation.

  4.  **Drafting Component 2: The Single Concrete Intuition:**
      *   *Requirement:* Direct-action prohibition, not cost-benefit.
      *   *Why?* Cost-benefit (utilitarian) judgments can be explained by evolution as tracking real natural goods (survival, kin selection). Deontic prohibitions (e.g., "Do not push the fat man off the bridge" in the Trolley Problem, or "Do not harm the innocent even to save five") feel like tracking a *sui generis* normative force.
      *   *Selection:* The **Trolley Problem (Footbridge Variant)** is the classic, but maybe too cliché? How about **Incest Taboo** or **Harm to the Innocent**?
      *   *Best Fit:* **Harm to the Innocent (The "Push" Case).**
      *   *Features:*
          1.  *Agent-Relative:* It's about *my* action, not the state of the world.
          2.  *Consequence-Insensitive:* The outcome is worse if I don't act, yet I feel I *must not*.
          3.  *Modal Force:* It feels like a law, not a suggestion.
      *   *Why this works for Non-naturalism:* It's hard to reduce "wrongness" here to "bad outcomes." It posits a normative fact ("Direct killing is forbidden") that stands apart from natural facts.

  5.  **Drafting Component 3: Predictable Misconceptions:**
      *   *Misconception 1: Genetic Fallacy.* (Explaining origin = disproving truth).
          *   *Defuse:* Early, when introducing the argument structure. Clarify it's about *justification*, not truth.
      *   *Misconception 2: Just-So Stories.* (Evolutionary psych is unfalsifiable).
          *   *Defuse:* When presenting the evolutionary premise. Acknowledge the uncertainty but argue the *direction* of selection (fitness over truth) is the key, not the specific adaptive story.
      *   *Misconception 3: Self-Defeat/Global Skepticism.* (Debunks math/logic too).
          *   *Defuse:* At the end, as a limitation of scope. Math/Logic are indispensable for the evolutionary theory itself; moral realism is not.
      *   *Timing:*
          1.  Genetic Fallacy: Immediately after stating the thesis (Minute 15).
          2.  Just-So Stories: During the evolutionary mechanism section (Minute 45).
          3.  Global Skepticism: During Q&A/Conclusion (Minute 80).

  6.  **Drafting Component 4: Diagnostic Question:**
      *   *Goal:* Distinguish understanding the *structure* vs. agreeing with the *conclusion*.
      *   *Bad Question:* "Do you think morality is objective?" (Tests conclusion).
      *   *Good Question:* Needs to test the link between causal inertness and epistemic defeat.
      *   *Idea:* Ask them to apply the logic to a different domain where causal contact *is* possible.
      *   *Draft:* "If we discovered that our belief in causation itself was evolved for fitness rather than truth, would this argument defeat that belief too? Why or why not?"
      *   *Refinement:* Better to focus on the *realist's* escape route. "What specific modification to the metaphysical status of moral facts would allow a realist to block this argument without abandoning realism?" (Answer: Make them natural/causally efficacious).
      *   *Selection:* "If a moral realist claims evolution *tracked* the truth, what metaphysical concession have they made regarding the nature of moral facts?" (Tests if they see the link between non-naturalism and the debunking).

  7.  **Drafting Component 5: Explicit Omissions:**
      *   *What to cut:* Game theory details (Prisoner's Dilemma, Nash Equilibria), detailed taxonomy of metaethical positions (Error Theory vs. Expressivism vs. Realism), Reliabilism nuances.
      *   *Why:* Philosophers of science know game theory, but it distracts from the *epistemic* point. They don't need a metaethics survey.
      *   *How to state:* Frame it as "bracketing" to focus on the *argument structure* rather than the *empirical details* or *alternative metaphysics*.

  8.  **Review and Refine (Self-Correction):**
      *   *Audience Check:* Philosophers of science will be sensitive to "causal explanation." I need to make sure the "Causal Inertness" point is rigorous. They might push back on "non-natural properties" being incoherent. I need to treat it charitably as a hypothesis to be tested by the EDA.
      *   *Timing:* 90 minutes is tight.
          *   0-15: Setup (Target & Access Problem).
          *   15-30: The Intuition (Deontic).
          *   30-50: The Evolutionary Mechanism.
          *   50-70: The Debunking Inference.
          *   70-80: Objections/Misconceptions.
          *   80-90: Diagnostic & Close.
      *   *Focus:* Ensure the link between *Deontic Intuition* and *Non-Naturalism* is clear. Why does a deontic intuition suggest non-naturalism? Because it resists reduction to natural goods (welfare).

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Conceptual dependency? Yes (Causal Access).
      *   Single intuition? Yes (Footbridge/Direct Harm).
      *   Misconceptions? Yes (Genetic, Just-So, Global).
      *   Diagnostic Question? Yes (Metaphysical concession).
      *   Omissions? Yes (Game theory/Metaethic taxonomy).

  10. **Writing the Output:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  Here is a structured plan for your ninety-minute session, designed specifically for an audience of philosophers of science. It leverages their strengths (causal modeling, epistemic justification, theory structure) while bypassing the need for prior metaethical literacy.

  ### 1. The Conceptual Dependency Arc
  **The Core Dependency:** Before the debunking argument can be heard, you must establish the **Causal Access Problem**.

  Philosophers of science are accustomed to explanatory coherence where beliefs are causally linked to facts (e.g., we believe in electrons because electrons cause tracks in cloud chambers). If the audience assumes moral facts are natural properties (e.g., "wrongness" = "causing suffering"), the evolutionary explanation *supports* the truth of the belief (evolution selected for avoiding suffering).

  **The Order of Operations:**
  1.  **Define the Target (Minutes 0–15):** Define **Non-Naturalist Normative Realism** not via jargon, but via causal role. Posit moral facts as *normative truths* that exist independently of human psychology and are *not reducible* to natural properties (like pain, survival, or social cohesion). Crucially, emphasize that on this view, these facts are **causally inert**. They do not push particles or fire neurons.
  2.  **The Epistemic Constraint (Minutes 15–25):** Establish that for a belief to be justified, there must be a non-accidental link between the belief and the fact. If the fact cannot cause the belief, and the belief is caused by something else (evolution), the link is broken.
  3.  **The Evolutionary Premise (Minutes 25–40):** Only now introduce the evolutionary explanation. It functions as the *alternative cause* that severs the link to the inert moral fact.

  **Why this order?** If you present the evolutionary explanation first, philosophers of science will treat it as a standard functional explanation compatible with realism (like vision). You must first close the "causal channel" available to the realist before showing how evolution fills the vacuum.

  ### 2. The Single Concrete Moral Intuition
  **The Intuition:** The **Footbridge Variant of the Trolley Problem** (pushing a large man off a bridge to stop a trolley, saving five but killing him).

  **Why a Direct-Action Prohibition?**
  *   **Resistance to Reduction:** Cost-benefit judgments (e.g., "suffering is bad") can be naturalized easily; evolution tracks survival and pain avoidance. A deontic prohibition ("Do not push, *even though* it saves lives") resists reduction to natural goods. It posits a normative force that overrides natural outcomes. This makes it the perfect proxy for *non-natural* properties.
  *   **Modal Force:** The intuition carries a sense of "forbiddenness" that feels distinct from "inadvisable." This matches the realist's claim of irreducible normative truths.

  **Required Features:**
  1.  **Consequence-Insensitivity:** The intuition must hold even when violating it produces better natural outcomes (5 lives > 1 life).
  2.  **Agent-Relativity:** It must concern *your* action, not the state of the world.
  3.  **Universality:** It should feel like a law applicable to any agent, not a personal preference.

  **Instruction:** Do not debate the *validity* of the intuition. Treat it as the *data point* that the realist claims is a perception of a non-natural fact, and the debunker claims is a fitness heuristic.

  ### 3. Predictable Misconceptions and Defusal Points
  Philosophers of science will attack the methodology. You must preempt these three specific objections at precise moments.

  **A. The Genetic Fallacy ("Explaining the origin doesn't disprove the truth")**
  *   **The Misconception:** That the argument claims moral beliefs are *false* because they have evolutionary origins.
  *   **Defusal Point:** **Minute 20 (Immediately after defining the Epistemic Constraint).**
  *   **The Fix:** Explicitly state: "This argument is not about *truth*; it is about *warrant*. The claim is not that 'murder is permissible,' but that the realist loses the right to claim they *know* it is forbidden. We are attacking the reliability of the belief-forming mechanism, not the content of the belief."

  **B. The "Just-So Story" Objection ("Evolutionary psychology is unfalsifiable speculation")**
  *   **The Misconception:** That the argument relies on specific, unproven adaptive stories (e.g., "tribal warfare selected for deontology").
  *   **Defusal Point:** **Minute 40 (When presenting the Evolutionary Premise).**
  *   **The Fix:** Shift the burden from *specific adaptation* to *direction of selection*. "We do not need to know the exact game-theoretic model. We only need to accept the weak premise that selection pressures track *fitness*, not *normative truth*. Unless the realist argues fitness and normative truth necessarily coincide, the correlation is coincidental."

  **C. The Global Skepticism Objection ("This debunks science/logic too")**
  *   **The Misconception:** If evolution shaped our cognition, why trust our logical or scientific beliefs?
  *   **Defusal Point:** **Minute 75 (During Q&A/Objections).**
  *   **The Fix:** Distinguish **Indispensability**. "We use logic and empirical observation to construct the evolutionary theory itself. To debunk logic is to saw off the branch you are sitting on (self-defeating). Moral realism is not indispensable to the evolutionary explanation; it is an optional add-on. The argument targets claims that are epistemically idle."

  ### 4. The Diagnostic Question
  **The Question:**
  > "If a non-naturalist realist wants to escape this debunking argument without abandoning realism, what specific **metaphysical concession** must they make regarding the relationship between fitness and moral truth?"

  **Why this distinguishes understanding:**
  *   **The Surface-Level Agree-er:** Will answer with moral claims (e.g., "They must admit that killing is actually wrong") or epistemic claims (e.g., "They need better evidence").
  *   **The Structural Understander:** Will recognize that the only way to restore the causal link is to concede that **moral facts are not causally inert** or that **evolution tracks truth**. They will answer: "They must concede that moral facts are either natural properties (causally efficacious) or that there is a pre-established harmony between fitness and normative truth."
  *   **What it tests:** It tests whether they see that the debunking works *only* because of the specific metaphysical isolation of non-natural properties.

  ### 5. Explicit Omissions
  To stay within 90 minutes and maintain focus, you must explicitly bracket two areas.

  **1. The Game-Theoretic Literature on Cooperation**
  *   **What to leave out:** Detailed models of kin selection, reciprocal altruism, or Nash equilibria in moral coordination.
  *   **How to state it:** "There is a rich literature modeling *how* these intuitions evolved via game theory. We are bracketing that empirical detail. For our epistemic purpose, we treat the evolutionary influence as a 'black box' that inputs fitness pressures and outputs deontic intuitions. The specific mechanism matters less than the *goal* of the mechanism (fitness vs. truth)."

  **2. The Taxonomy of Metaethical Alternatives**
  *   **What to leave out:** Distinctions between Error Theory, Expressivism, Constructivism, and Reliabilist Epistemology.
  *   **How to state it:** "We are treating 'Non-Naturalist Realism' as a single target hypothesis. There are many sophisticated ways to modify realism or adopt anti-realism to survive this argument. We are omitting those survival strategies to focus strictly on the vulnerability of the core realist claim: that we have epistemic access to causally inert normative facts."

  **Why this framing works:** It tells the audience you are aware of the complexity but are deliberately isolating variables to test the specific argument structure, appealing to their scientific training in model-building.
