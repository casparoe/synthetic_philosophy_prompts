      *   **Topic:** David Lewis's theory of convention (specifically from *Convention: A Philosophical Study*).
      *   **Problem:** The user has drafted an argument chain (1-9) claiming that Lewis's account fails to handle "zombie conventions" (conventions that persist after their original purpose vanishes, potentially becoming harmful).
      *   **Goal:** Identify the "slip" in the argument. The user wants to keep premise (6) (individual moral insight should allow breaking harmful conventions). They are unsure whether to reject the preference condition or identify a scope shift.
      *   **Constraint:** Distinguish between settled literature and contested interpretations. Do not present one reading as consensus if it's debated.

  2.  **Deconstruct the Argument Chain:**
      *   (1) Definition of Lewisian Convention (Arbitrary, recurrent coordination problem, common knowledge, conditional preference). *Status: Generally accurate summary of Lewis.*
      *   (2) Reason for conformity (Deviation breaks coordination/frustrates expectations). *Status: Accurate to Lewis's game-theoretic model.*
      *   (3) Zombie Convention example (IRB rituals persisting after risk vanishes). *Status: Plausible sociological claim.*
      *   (4) Common knowledge/preference persists (People expect R, prefer not to rock the boat). *Status: Plausible, but "prefer not to rock the boat" needs scrutiny against Lewis's specific preference condition.*
