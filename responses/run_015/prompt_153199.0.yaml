  3.  **Evaluate Lewis's Theory against the Argument:**
      *   *The Core of Lewis's Account:* Lewis is primarily describing *what a convention is*, not necessarily prescribing *moral obligations* derived from conventions. He uses game theory (coordination equilibria).
      *   *The Preference Condition:* Lewis requires a "conditional preference for conformity." I prefer to conform *if* others conform. Why? Because I want to coordinate.
      *   *The "Zombie" Problem:* If the coordination problem vanishes (the "point" of the convention is gone), does the conditional preference remain?
          *   If the IRB ritual no longer protects anyone, do researchers *really* have a conditional preference to follow it just because others do?
          *   Lewis says conventions solve *recurrent coordination problems*. If the problem is gone, is it still a convention *by Lewis's definition*?
      *   *Normativity:* Lewis is often read as reducing normative force to prudential rationality within the game. He doesn't explicitly ground *moral* obligations in conventions, though conventions often align with moral expectations (e.g., property, promising).
      *   *The Slip:* The argument conflates *Lewisian conventionality* (a descriptive/game-theoretic status) with *moral/prudential obligation* (a normative status). Lewis explains why people *do* follow conventions, not necessarily why they *should* in a moral sense, especially if the underlying payoffs change.

  4.  **Identify the Specific Slip(s):**
