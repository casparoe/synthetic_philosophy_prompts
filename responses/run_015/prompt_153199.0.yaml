      *   **Step (5): The "Bound" Claim.** Lewis describes *reasons for action* (prudential), not necessarily *obligations* (moral). To say individuals are "bound" implies a normative force Lewis might not endorse in "zombie" cases.
      *   **Step (7): The "Lewis Denies" Claim.** Lewis might agree that if the payoffs change, the rationality of conformity changes. He doesn't claim conventions create immutable moral bonds.

  5.  **Drafting the Response:**

