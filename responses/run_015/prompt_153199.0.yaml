answer: |-
  This is a sharp argument, and you have correctly identified a major pressure point in Lewis's account. The "zombie convention" problem (regularities that persist after their functional rationale dissolves) is a standard objection in the literature, often associated with critiques by Margaret Gilbert, Ruth Millikan, and evolutionary game theorists like Brian Skyrms.

  However, your chain contains a category error regarding Lewis's specific notion of "obligation" and a potential misapplication of the preference condition in the zombie case.

  Here is the breakdown of where the slip occurs, what is settled versus contested, and how to revise the chapter without sacrificing your intuition in (6).

  ### The Primary Slip: Step (5) and the Normative Leap

  The most vulnerable link is **(5): "So by (1)-(2), individuals in P are still genuinely bound by R."**

  **The Problem:** You are conflating *Lewisian rationality* with *moral/prudential obligation*.
  Lewis's account is fundamentally game-theoretic and descriptive of *instrumental rationality*. When Lewis says agents are "bound," he means they have a *prudential reason* to conform given the payoff structure and the expectations of others. He does not claim that conventions generate sui generis *moral* obligations that override independent moral reasoning.

  *   **If you keep (5) as written:** You attribute to Lewis a moral realism about conventions that he does not hold. Lewis would likely agree with your (6): if the convention is harmful and the coordination benefit is gone, the *prudential* reason to conform might remain (due to sanctions/expectations), but the *moral* reason does not.
  *   **The Cost of Rejecting (5):** You must concede that Lewisian conventions do not ground *moral* obligations, only *reasons for action* based on coordination payoffs. This weakens the claim that conventions are normative in a robust ethical sense, but it saves Lewis from the charge of blocking moral insight.

  ### The Secondary Slip: Step (4) and the Preference Condition

  There is also a technical slip in **(4): "Even in zombie cases, common knowledge still holds... and people generally prefer not to rock the boat."**

  **The Problem:** Lewis's "conditional preference for conformity" is specific. It is not just a preference for avoiding social friction ("not rocking the boat"). It is a preference for coordinating *because the coordination itself yields a payoff*.
  *   **Lewis's Condition:** I prefer to conform *if* others conform, because conforming solves the coordination problem (e.g., we both drive on the right and don't crash).
  *   **The Zombie Case:** In your IRB example, if the "original problem... isn't there anymore," the payoff for coordination may have vanished. If the ritual is purely costly with no benefit (not even signaling), it is no longer a coordination equilibrium. It may be a **Prisoner's Dilemma** (everyone would prefer the ritual didn't exist, but no one dares deviate) or simply an **enforced rule**.
  *   **Literature Note:** Lewis distinguishes conventions from rules enforced by sanctions. If the IRB ritual is sustained only by the threat of grant rejection (sanction) rather than the mutual benefit of coordination, Lewis might argue **it is no longer a convention** by his definition.

  ### Settled vs. Contested in the Literature

  To ensure your chapter is robust, you need to distinguish between what Lewis explicitly says and where interpreters fight.

  | Claim | Status in Literature | Notes |
  | :--- | :--- | :--- |
  | **Lewis defines conventions as coordination equilibria.** | **Settled** | This is the core of *Convention* (1969). It involves common knowledge and conditional preferences. |
  | **Lewis reduces normative force to instrumental rationality.** | **Settled** | Lewis explains why it is *rational* to follow conventions, not necessarily why it is *moral*. |
  | **Conventions generate moral obligations.** | **Contested** | Lewis is agnostic/cautious here. Critics (Gilbert, Bratman) argue he fails to capture the *obligatory* nature of social norms. Defenders argue his account underpins moral practices like promising. |
  | **"Zombie" regularities count as Lewisian conventions.** | **Contested** | If the payoff structure changes (no coordination benefit), many game-theorists argue it ceases to be a convention and becomes a "norm" or "custom" sustained by sanctions. Lewis's text implies conventions dissolve if the coordination problem dissolves. |
  | **Individuals can morally override conventions.** | **Settled (mostly)** | There is no consensus that Lewis denies this. Most interpreters agree Lewis describes *reasons*, not absolute *commands*. |

  ### How to Fix the Argument Chain

  You want to keep **(6)** (individual insight matters). To do that, you should modify **(5)** and **(7)**.

  **Recommended Revision:**
  Reject the inference that Lewisian conventionality *entails* binding obligation in zombie cases. Instead, argue that Lewis's account *predicts* the persistence of the behavior (due to common knowledge of expectations) but *fails to justify* it normatively once the coordination payoff vanishes.

  **Revised Chain Snippet:**
  *   (4) ...people generally prefer not to rock the boat **(due to fear of sanctions or social friction, not coordination benefits).**
  *   (5) So by (1)-(2), individuals in P have a **prudential** reason to stick with R, **but R may no longer qualify as a Lewisian convention if the coordination payoff is zero.**
  *   (6) (Keep as is) ...individual researcher... ought to be able to break R without being irrational or immoral.
  *   (7) **Revised:** Lewis's account explains the **stability** of R, but does not ground a **moral obligation** to sustain R once the coordination problem vanishes.
  *   (8) Therefore, Lewisian conventions ground obligations **only insofar as they solve live coordination problems.**

  ### Strategic Advice for the Chapter

  1.  **Clarify "Obligation":** Be explicit that you are testing whether Lewisian conventions generate *moral* obligations or merely *prudential* reasons. The "zombie" critique lands hardest if you claim Lewis thinks conventions create moral bonds. If you frame it as "Lewis explains stability, not morality," the tension dissolves.
  2.  **The "Sanction" Distinction:** Lean into the distinction between a convention (sustained by mutual benefit) and a norm/rule (sustained by punishment). If the IRB ritual is a zombie, it is likely sustained by administrative sanction. Lewis would arguably say this is **not a convention**. This allows you to keep (6) without attacking Lewis: the researcher isn't breaking a *convention*; they are breaking a *bureaucratic rule*.
  3.  **Cite the Debate:** Acknowledge that this is where **Margaret Gilbert's** critique (*On Social Facts*) becomes relevant. She argues Lewis cannot account for the "ought" of social norms precisely because his account is too individualistic/game-theoretic. You can position your "zombie" argument as a specific instance of Gilbert's broader critique.

  **Summary:** The slip is in **(5)**. Lewisian conventions generate *reasons for action* based on *coordination payoffs*. If the payoff is gone (zombie), the Lewisian "binding" force is merely the inertia of expectation, not a genuine obligation. You can keep (6) by arguing that Lewis's account describes *why people don't break the rule*, not *why they should not*.
