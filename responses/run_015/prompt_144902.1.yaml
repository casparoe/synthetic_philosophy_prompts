answer: |-
  ### Diagnosis of the Dispute

  The stalemate you describe is not primarily a verbal dispute, nor is it a simple clash between truth and falsehood. It is a **conceptual conflation of two distinct epistemic modes**, compounded by a **technical gap in uniformity theory**.

  The debate stalls because participants frequently argue about the *validity of the heuristic* (a question of conjectural reliability) as if it were a debate about the *sufficiency of the proof* (a question of deductive derivation). The heuristicists are operating in the **context of discovery**, optimizing for predictive accuracy across a wide range of phenomena. The rigorists are operating in the **context of justification**, optimizing for structural understanding and deductive certainty within specific regimes. When a rigorist cites Maier's theorem, they are attacking the *deductive sufficiency* of the probabilistic model. When a heuristicist cites the success of Bateman-Horn, they are defending the *predictive reliability* of the model. Both are correct within their own epistemic frame, but they talk past each other because they treat these frames as mutually exclusive rather than complementary.

  Your distinction between **Calibrated Local Independence (CLI)** and **Majorant Pseudorandomness (MP)** is the key to untangling this. The dispute persists because the community has not yet agreed on whether CLI is merely a lucky guess that MP occasionally validates, or whether CLI is a fundamental property of the primes that MP fails to fully capture due to technical limitations.

  Here is the structural breakdown of the impasse, mapped onto your three hypothesized issues:

  #### 1. The Methodological Layer (Your Issue i)
  **Diagnosis:** This is a **Category Error regarding "Probability."**
  *   **Heuristicists** use "probability" as an *epistemic weight*: it quantifies confidence in a conjecture based on analogy and consistency. For them, the singular series correction is a way to update this weight based on known structural constraints (modular arithmetic).
  *   **Rigorists** treat "probability" as a *structural claim*: it asserts the existence of a measure space or a combinatorial structure (like a majorant) that mimics independence.
  *   **The Stall:** Rigorists demand that the epistemic weight be converted into a structural claim before it is granted status. Heuristicists resist this conversion because it is often currently impossible, yet they trust the weight anyway. The dispute feels verbal because both sides agree on the *numbers* (the asymptotics), but disagree on the *status* of the reasoning that produced them.

  #### 2. The Technical Layer (Your Issue ii)
  **Diagnosis:** This is a **Substantive Gap in Transference.**
  *   There is a genuine mathematical question here: *Does CLI imply MP, or does MP imply CLI, and over what domain?*
  *   Green–Tao established that for *linear* patterns, a specific form of MP (Gowers uniformity of a majorant) is sufficient to prove the existence of patterns predicted by CLI. However, this is a one-way street: MP $\implies$ Pattern Existence. It does not derive the *asymptotic count* (the Bateman-Horn constant) from first principles without assuming the singular series externally.
  *   **The Stall:** We lack a general "Transference Theorem" that says: "If a set satisfies CLI (with singular series), it admits an MP majorant satisfying the linear forms/correlation conditions." Without this, the rigorist complaint stands: the heuristic is not *derived* from the structure; it is *consistent* with the structure in known cases. The rigorist demands the derivation; the heuristicist is satisfied with the consistency.

  #### 3. The Obstruction Layer (Your Issue iii)
  **Diagnosis:** This is an **Empirical Unknown regarding Uniformity.**
  *   Maier's theorem demonstrates that the primes are not uniformly distributed at all scales. Specifically, in intervals of length $(\log x)^A$, the distribution oscillates.
  *   **The Stall:** The heuristic community often treats Maier's phenomenon as a "short-interval anomaly" that doesn't affect long-term asymptotics (Bateman-Horn). The rigorist community treats it as evidence that the "independence" intuition is fundamentally fragile. The unresolved question is whether there are **higher-order Maier obstructions**. If there exist obstructions for non-linear polynomials or higher-order correlations that mimic the Maier phenomenon, then a general MP formalization of CLI might be *impossible*, not just difficult. The debate stalls because neither side has classified the boundary where CLI breaks down.

  ---

  ### Verdict on the Nature of the Dispute

  The dispute is **primarily a clash of research programs answering different questions under one name**, exacerbated by the **technical gap** described above.

  *   **Program A (CLI):** "What is the correct asymptotic formula for prime patterns?" (Optimizes for *conjectural truth*).
  *   **Program B (MP):** "What structural properties allow us to prove patterns exist?" (Optimizes for *deductive certainty*).

  The friction arises because Program A often claims its results are "virtually certain" based on probabilistic reasoning, which Program B interprets as a claim of proof. Program B's refusal to accept CLI without MP is interpreted by Program A as pedantry that ignores overwhelming empirical evidence.

  However, it is not *merely* a difference of programs. It is substantive because the **domain of validity** of Program A is unknown. If higher-order Maier obstructions exist, Program A is producing false conjectures in specific, currently inaccessible regimes. Program B is the only tool capable of detecting this, but it is currently too weak to scan the whole domain.

  ---

  ### What Counts as Genuine Progress?

  To resolve the impasse, the community must stop trying to force one program to subsume the other and instead focus on mapping the interface between them. Progress should be measured by the following milestones, ordered from most feasible to most transformative:

  #### 1. A Taxonomy of Obstructions (Addressing Issue iii)
  **Goal:** A classification theorem delineating exactly where CLI fails.
  *   **Progress:** A proof that for a specific class of polynomial systems (e.g., quadratic forms), the CLI heuristic yields the correct main term *if and only if* a specific uniformity condition holds. Conversely, a construction of a "Maier-like" counterexample for a specific non-linear pattern where CLI predicts a count that is provably wrong (or where the error term dominates the main term).
  *   **Why:** This settles the empirical question. It tells the heuristicists where their intuition is safe and tells the rigorists where they need to look for structural failures.

  #### 2. A Conditional Transference Theorem (Addressing Issue ii)
  **Goal:** A theorem stating: "Assuming the Generalized Riemann Hypothesis (or Elliott–Halberstam), CLI implies the existence of an MP majorant satisfying the necessary Gowers norm conditions."
  *   **Progress:** This would bridge the technical gap. It would show that the heuristic *is* underwritten by structure, provided we accept standard conjectures. It validates the heuristicist's intuition as structurally sound, even if currently unproven unconditionally.
  *   **Why:** It converts the "context of discovery" into a "context of justification" conditional on standard hypotheses, satisfying the rigorist's demand for a structural link without requiring unconditional proofs that may be centuries away.

  #### 3. A Meta-Mathematical Dissolution (Addressing Issue i)
  **Goal:** A consensus statement distinguishing **Conjectural Reliability** from **Structural Explanation**.
  *   **Progress:** An agreement that CLI arguments constitute a distinct form of mathematical knowledge (abductive inference) that does not require reduction to MP to be valuable, *provided* the domain of validity (from Step 1) is respected.
  *   **Why:** This ends the verbal dispute. It allows heuristicists to publish CLI derivations as "high-confidence predictions" without claiming they are proofs, and allows rigorists to pursue MP derivations as "structural explanations" without dismissing the CLI predictions as epistemically void.

  ### The Way Out

  There is a way out, but it requires a shift in posture. The impasse will not be broken by a single theorem proving Bateman-Horn, nor by a philosophical decree. It will be broken by **localizing the disagreement**.

  The two communities should agree to the following **Division of Epistemic Labor**:
  1.  **CLI is the engine of conjecture.** Its output is treated as "provisional truth" with a confidence level proportional to the robustness of the calibration (singular series) and the absence of known obstructions (Maier-type).
  2.  **MP is the engine of verification.** Its output is treated as "structural necessity."
  3.  **The Boundary is the research frontier.** The primary task of analytic number theory should not be to argue about the status of CLI, but to **map the boundary where MP fails to validate CLI**.

  If it turns out that for all "natural" polynomial patterns, MP can be made to work (perhaps conditionally), then the heuristicist wins the substantive argument: the primes are structurally pseudorandom. If it turns out there are natural patterns where CLI holds but MP fails (or vice versa), then we discover a new layer of arithmetic structure that neither side currently anticipates.

  **Recommendation:** The debate should cease to be about "Is the heuristic valid?" and become "What is the **uniformity horizon** of the heuristic?" The question is not whether the primes are random, but *at what scale and in what configuration* the pseudorandomness majorant ceases to approximate the prime indicator function. Progress is a map of that horizon, not a verdict on the philosophy.
