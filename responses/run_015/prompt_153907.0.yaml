answer: |-
  The impasse you describe is best diagnosed as a case of **different questions under one heading**, driven by conflicting bedrock intuitions about the individuation of natural kinds. While the dispute appears to be about empirical facts regarding tool use and neural plasticity, both camps largely agree on the data: humans use tools, and tool use affects brains. The disagreement arises because Camp A and Camp B are employing different criteria for what constitutes a "kind of mind." Camp B operates with an **internalist mechanistic criterion**, asking, "What algorithm is running inside the skull?" From this perspective, if the core operation remains generate-and-test (Popperian), the addition of external storage is merely a parameter change (capacity, speed), not a kind change. Camp A operates with a **systems-boundary criterion**, asking, "What is the functional unit of selection and cognition?" From this perspective, if the tool is constitutively coupled to the agent such that the environment shapes the neural architecture recursively, the cognitive system itself has changed its ontological status.

  This is not merely a verbal dispute, because the classification dictates research priorities and theoretical modeling. If Camp B is right, cognitive science should focus on universal internal algorithms. If Camp A is right, cognitive science must model the brain-environment loop as a single unit. Therefore, the dispute is substantive, but it is not resolvable via empirical data alone because the data is theory-laden. The hidden empirical question is not whether plasticity exists, but rather **what threshold of neural restructuring is required to count as a new cognitive kind**. Since no such threshold exists in nature, the dispute relies on philosophical stipulation.

  Your hypothesis that the sides are answering different questions is correct. They are conflating "What is the internal mechanism?" with "What is the extended functional system?" under the single label "Gregorian." This conflation prevents resolution because each side views the other's criterion as irrelevant to the definition of a mind. Bedrock intuitions about internalism versus externalism (or extended cognition) are at play here. Camp A leans toward the Extended Mind Thesis, where tools are parts of the mind. Camp B leans toward vehicle internalism, where tools are merely inputs/outputs.

  Regarding your "reciprocal scaffolding" framing: this terminology successfully clarifies the *mechanism* that Camp A claims is distinctive. It names the feedback loop precisely. However, it does not resolve the impasse because Camp B can accept the existence of reciprocal scaffolding while denying that it warrants a new taxonomic category. They can argue that Popperian minds always operate within some scaffolding, and Gregorian scaffolding is just denser. Thus, your framing layers precise vocabulary onto the divide without bridging the ontological gap regarding kind membership.

  Genuine progress would require abandoning the ladder metaphor of Dennett's taxonomy, which implies discrete steps, in favor of a multi-dimensional space where internal complexity and environmental coupling are separate axes. Alternatively, a formal model demonstrating that the reciprocal loop produces emergent computational properties impossible for a standalone Popperian agent (even with infinite memory) would force Camp B to concede. Without such a formal proof or a reconceptualization of the taxonomy, the dispute will persist indefinitely as a philosophical stalemate masked as an empirical one.

