      If (4) is true (successor proves conditional for arbitrary C), then for $C=\bot$, successor proves $\Box \bot \to \bot$. By Löb, successor proves $\bot$. Successor is inconsistent. Inconsistent systems have unsound rules (they prove falsehoods). So the condition "via sound inference rules" in (2) is false. Thus (5) does not follow.
      So the break is indeed the compatibility of (4) with the "soundness" clause in (2).

