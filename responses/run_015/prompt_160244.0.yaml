prompt: |-
  hey — I'm writing the final for my 4th-year seminar on ethics and fundamental physics and I want one essay question that actually separates the students who can *do* something with panpsychism from the ones who can just talk about it. Closed book, 60 minutes, one essay, out of 20. They've already had the unit: combination problem, Russellian monism, the "is consciousness fundamental" dialectic, all of that. So I really don't want marks available for re-explaining any of it. And because it's closed book, please don't hang the question on any author or paper — nothing that rewards name-dropping.

  Here's the rough shape I have in mind; you make it exam-ready and tell me if the crux is wrong.

  The exam paper stipulates some physics (clearly flagged as invented):

  - Phenomenal valence is real, measurable, and additive. Every physical system above some threshold has some; most of it is tiny. Call the negative part suffering.
  - There's a conservation result: the total valence in a closed system can't be increased or destroyed, only moved. So no intervention can reduce the *amount* of suffering in the universe — only relocate it.
  - There's a cheap industrial technology ("shunting") that moves negative valence out of the systems where it's concentrated into a sink. The cheapest sinks spread a fixed quantity across an astronomically large number of tiny systems — think googols — so that each one ends up with an utterly imperceptible, unnoticeable sliver of negative valence. None of these systems is connected to any organism, and nobody will ever observe any of them.
  - The only calibration point anyone has for valence is our own case and that of other animals. The physics hands you the numbers about sand, silicon, dust, whatever, but not the moral interpretation of them.

  So the question, in effect: is a government justified in funding a large shunting program whose whole effect is to take concentrated suffering and dilute it across a vast number of imperceptibly-suffering systems? I want the crux to be the dilution move — whether spreading a fixed quantity of suffering so thin that no single bearer has a noticeable pain is genuinely an improvement, and what your answer to *that* commits you to about how the badness of suffering aggregates. The conservation stipulation is there to stop them from just saying "obviously, reduce suffering, done."

  What I need from you:

  1. The question as it'd appear on the paper, with the stipulations written out cleanly — maybe 250 words of setup, and the actual question short and sharp.
  2. A model answer, 700 words-ish.
  3. A marking scheme out of 20: the four or five must-hit moves, what each is worth, what an A answer does that a B doesn't, the single move whose absence caps a script at B+, and one line per move on how people typically get it wrong.

  A couple of extra things. Please make it structurally impossible to score above a C by writing a tidy summary of panpsychism and the combination problem — say explicitly what should cost marks there, and why. And tell me whether to add a last line for the strongest students about opportunity cost (the shunt money could go to, say, malaria nets instead), or whether that muddies the crux — I can't decide.
reasoning: |-
  Here's a thinking process that leads to the suggested exam question, model answer, and marking scheme:

  1.  **Analyze the Request:**
      *   **Context:** 4th-year seminar on Ethics and Fundamental Physics.
      *   **Topic:** Panpsychism, Ethics, Suffering, Aggregation.
      *   **Goal:** Create one essay question (60 mins, 20 marks) that distinguishes students who can *apply* concepts from those who just *recall* them.
      *   **Constraints:** Closed book (no name-dropping), invented physics stipulations (to level the playing field), specific focus on the "dilution" of suffering via "shunting."
      *   **Deliverables:**
          1.  Exam Question (setup + prompt, ~250 words).
          2.  Model Answer (~700 words).
          3.  Marking Scheme (out of 20, 4-5 criteria, distinction between A and B, specific penalty for summary/recall, advice on "opportunity cost").
      *   **Specific Instruction:** Make it structurally impossible to score >C by summarizing panpsychism/combination problem.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   *The Setup:* Panpsychist physics (valence is real/additive/conserved). Technology exists to move suffering from few (intense) to many (imperceptible).
      *   *The Ethical Crux:* Is $1 \times \text{Intense Pain}$ worse than $N \times \text{Imperceptible Pain}$ (where $N$ is huge)?
      *   *The Trap:* If total valence is conserved, utilitarianism (classic sum-total) might say it doesn't matter. But if the *distribution* matters (prioritarianism, sufficiency views, or non-linear aggregation), it does.
      *   *The Panpsychist Angle:* If dust motes have experience, does "imperceptible" mean "non-existent" or just "below human threshold"? The prompt says "unnoticeable sliver," implying *some* experience exists.
      *   *The "Do Something" Test:* Can the student argue about the *structure* of moral aggregation under these specific metaphysical constraints without relying on remembered authors?

  3.  **Drafting the Exam Question:**
      *   Need to be precise with the physics stipulations so students don't argue against the premises (e.g., "but dust doesn't feel!").
      *   Need to frame the ethical dilemma clearly.
      *   *Drafting thought:* Keep the physics dry. Focus the question on the justification of the policy.
      *   *Word Count Check:* Keep setup tight.
      *   *Refining the Prompt:* "Assess the justification..." is good. "Defend or reject..." is better for argumentation.

  4.  **Developing the Model Answer:**
      *   *Tone:* Academic, precise, argumentative.
      *   *Structure:*
          1.  Acknowledge constraints (conservation).
          2.  Identify the core tension: Aggregation vs. Distribution.
          3.  Argument for Shunting (Total View/Summation).
          4.  Argument against Shunting (Non-linear aggregation/Discontinuity/Subject-Centric views).
          5.  Synthesis/Conclusion regarding the metaphysical commitment.
      *   *Key Insight:* The answer must show that the ethical verdict depends on whether moral badness scales linearly with valence or if there's a threshold of "noticeability" that matters morally.
      *   *Word Count:* Aim for ~700.

  5.  **Designing the Marking Scheme:**
      *   *Total:* 20 marks.
      *   *Criteria:*
          1.  Handling the Conservation Constraint (4 marks).
          2.  Analysis of Aggregation (Linear vs. Non-linear) (6 marks).
          3.  Metaphysical Consistency (Panpsychist implications) (5 marks).
          4.  Argumentative Structure/Clarity (5 marks).
      *   *The "C-Cap":* Explicitly state that summarizing the combination problem or defining panpsychism earns 0 marks or caps the grade. This needs to be bold.
      *   *The "B+ Cap":* Identify the specific move that separates A from B. Likely the ability to challenge the *linearity* of moral value relative to physical valence.
      *   *Common Errors:* Arguing against the physics, ignoring the "imperceptible" clause, name-dropping (useless in closed book but still a habit).

  6.  **Addressing the "Opportunity Cost" Question:**
      *   *User Query:* Should I add a line about opportunity cost (malaria nets)?
      *   *Analysis:* The prompt is already dense. The core philosophical work is on the *nature of suffering aggregation* under panpsychism. Adding opportunity cost shifts the focus to standard utilitarian resource allocation, which dilutes the specific metaphysical/ethical intersection the user wants to test.
      *   *Recommendation:* Leave it out. It muddies the crux. The "conservation" rule already forces the focus to distribution, not total reduction. Adding external trade-offs distracts from the internal logic of the shunting case.

  7.  **Review and Refine:**
      *   *Check against constraints:* Closed book? Yes. No authors? Yes. 4th year level? Yes (requires high-level synthesis).
      *   *Check the "C-Cap":* Make sure the marking scheme explicitly penalizes summary.
      *   *Check the Physics:* Ensure the "conservation" rule is clear so they don't argue "just turn it off."
      *   *Refining the Model Answer:* Ensure it doesn't sound like a lecture but like a student essay under time pressure (focused, direct).
      *   *Refining the Marking Scheme:* Make sure the distinction between "Total Valence" and "Moral Disvalue" is the key differentiator.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In the marking scheme, ensure I explicitly mention that ignoring the "imperceptible" nature of the dust suffering is a critical error.
      *   *Correction:* Make sure the "C-Cap" warning is visible to the marker, not just the student.
      *   *Correction:* The prompt asks for "one line per move on how people typically get it wrong." I need to ensure that's included.

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  Here is the exam-ready material, designed to test synthesis and application rather than recall.

  ### 1. Exam Question

  **Question 4 (20 Marks)**

  **Context:**
  Assume the following physical stipulations are true:
  1.  **Panpsychist Valence:** Phenomenal valence (positive/negative experience) is a fundamental, measurable physical property. All systems above a micro-threshold possess it.
  2.  **Conservation:** In a closed system, total valence is conserved. It cannot be created or destroyed, only relocated.
  3.  **Shunting:** A technology exists to move negative valence (suffering) from concentrated sources (e.g., animals) into a "sink." The cheapest sink distributes a fixed quantity of negative valence across $10^{100}$ micro-systems (e.g., dust motes).
  4.  **Dilution:** After shunting, each micro-system bears a sliver of negative valence so small it is phenomenally imperceptible to any observer, including the system itself. No biological organism is affected.

  **Prompt:**
  Given that the *total quantity* of negative valence in the universe remains unchanged by shunting, assess whether a government is ethically justified in funding this program.

  In your answer, you must address whether the moral badness of suffering aggregates linearly with physical valence, or whether the distribution of that valence across subjects changes its moral weight. Do not summarize panpsychist theories; apply the stipulations above to the ethical problem.

  ***

  ### 2. Model Answer (Approx. 700 words)

  The justification for the shunting program hinges entirely on the relationship between physical valence and moral disvalue. Since the conservation stipulation dictates that the *sum total* of negative valence remains constant, a standard total-view utilitarianism would deem the intervention morally neutral. If moral badness is simply a function of total valence units, moving them from a cow to a googol of dust motes changes nothing. However, this ignores the structural change in *how* that valence is borne. To justify the program, one must argue that moral disvalue does not scale linearly with physical valence, or that the status of the "bearer" matters.

  The strongest argument for shunting relies on a threshold view of moral significance. If a system's experience is imperceptible, it may lack the structural complexity required for "suffering" in a morally relevant sense, even if it possesses negative valence in the physical sense. The stipulations state the slivers are unnoticeable. If moral suffering requires a unified subject capable of registering pain as a bad state, then distributing valence across $10^{100}$ disconnected micro-systems might effectively dissolve the moral patient. In this view, the physical quantity is conserved, but the moral quantity is reduced because the "subjects" receiving the dilution are too fragmented to count as sufferers. This justifies shunting as a way to eliminate moral patients without violating physical conservation.

  However, this justification faces a severe aggregation problem. If we accept that micro-systems have *some* phenomenal valence, we must accept they have *some* moral weight. If moral weight aggregates linearly, then $10^{100}$ units of imperceptible pain could outweigh one unit of intense pain, simply by virtue of number. But this leads to counter-intuitive results: it implies that a vast enough number of trivial annoyances could outweigh a torture session. To avoid this, one must argue for non-linear aggregation. For example, moral disvalue might scale exponentially with intensity. Under this model, one unit of intense suffering is morally worse than a billion units of imperceptible suffering. If this is true, shunting is not just neutral; it is a moral imperative. It trades high-intensity moral disvalue for low-intensity physical disvalue, reducing the total *moral* badness while keeping total *physical* valence constant.

  Conversely, the argument against shunting rests on the sanctity of the subject. Even if the total moral badness is reduced, shunting involves imposing negative states onto entities that were previously neutral. If dust motes were previously valence-neutral, shunting actively harms them. While the harm per mote is negligible, the act of spreading contamination across the universe might be viewed as a violation of cosmic integrity. Furthermore, if panpsychism implies that consciousness is fundamental, fragmenting intense experience into imperceptible slivers might be seen as a form of ontological degradation, even if the "sum" is lower.

  Ultimately, the decision rests on whether we prioritize the minimization of intense experience or the purity of the total valence distribution. If the goal of ethics is to prevent *agony*, shunting is justified because it eliminates the intensity threshold required for agony. If the goal is to minimize *negative existence* itself, shunting is unjustified because it spreads negativity further. Given the conservation constraint, the former view is more robust. It acknowledges that the moral catastrophe of suffering lies in its intensity and its integration within a subject, not merely in the raw count of negative valence units. Therefore, the government is justified, provided one accepts that moral disvalue is non-linear with respect to physical valence intensity. The shunt converts a moral emergency (torture) into a physical background noise (dust valence), which is a net ethical gain.

  ***

  ### 3. Marking Scheme (Out of 20)

  **General Instruction:**
  *   **The C-Cap:** Any answer that spends more than 50 words defining panpsychism, explaining the combination problem, or name-dropping theorists (e.g., "As Goff argues...") is **capped at 10/20 (C)**. This is a closed-book application exam, not a recall test. Marks are for *using* the stipulations, not reciting the unit.
  *   **The B+ Cap:** The single move whose absence caps a script at **14/20 (B+)** is the **Linearity Distinction**. The student must explicitly distinguish between *physical valence* (conserved) and *moral disvalue* (potentially non-linear). If they treat them as identical, they cannot access the top band.

  **Criteria:**

  **1. Handling the Conservation Constraint (4 Marks)**
  *   **A (4):** Explicitly acknowledges that total physical valence is unchanged and argues why ethics might still demand intervention.
  *   **B (2-3):** Mentions conservation but struggles to separate it from moral value.
  *   **C (0-1):** Argues against the physics (e.g., "they should just destroy the valence") or ignores the constraint.
  *   *Common Error:* Trying to solve the problem by suggesting we reduce total suffering, violating the prompt's physics.

  **2. Analysis of Aggregation (Linear vs. Non-Linear) (6 Marks)**
  *   **A (5-6):** Clearly articulates that moral badness might scale exponentially with intensity, allowing dilution to reduce moral harm despite conserved physical valence.
  *   **B (3-4):** Discusses aggregation but remains ambiguous about whether intensity or sum matters more.
  *   **C (0-2):** Assumes 1 unit of pain = 1 unit of badness regardless of distribution.
  *   *Common Error:* Assuming that because the physical sum is constant, the moral sum must be constant.

  **3. Metaphysical Consistency (Panpsychist Implications) (5 Marks)**
  *   **A (5):** Uses the "imperceptible" stipulation to argue about the moral status of the micro-subjects (e.g., are they moral patients?).
  *   **B (3-4):** Acknowledges the dust motes have valence but doesn't explore the moral implication of "imperceptibility."
  *   **C (0-2):** Treats the dust motes as inert matter despite the prompt's stipulations.
  *   *Common Error:* Ignoring the "imperceptible" clause and arguing the dust suffers just as much as the animal.

  **4. Argumentative Structure & Clarity (5 Marks)**
  *   **A (5):** Clear thesis, distinct sections for "For" and "Against," decisive conclusion.
  *   **B (3-4):** Logical flow is present but conclusion is hedged or vague.
  *   **C (0-2):** Disorganized, stream-of-consciousness, or fails to answer the specific prompt.
  *   *Common Error:* Writing a general essay on suffering without referencing the "shunting" mechanism.

  **Advice on the "Opportunity Cost" Line:**
  **Do not add it.**
  Adding a line about malaria nets muddies the crux. The philosophical work you want them to do is on the **aggregation function of suffering under panpsychism**. If you introduce opportunity costs, strong students will pivot to standard resource-allocation utilitarianism (which they know from Intro Ethics) and bypass the specific metaphysical/ethical intersection you are testing. The conservation rule already forces them to focus on *distribution* rather than *reduction*. Keep the trap tight.
