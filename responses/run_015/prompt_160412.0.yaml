answer: |-
  You have stumbled onto the exact pressure point where anti-functionalism risks collapsing into eliminativism or verificationism. Your intuition is correct: the argument as it stands is too strong. It proves too much (eliminating neural facts, belief content, etc.) because it smuggles in a verificationist premise that you, as a realist about qualia, cannot afford.

  Here is the diagnosis, the cut, and the cost.

  ### The Diagnosis: The Verificationist Slide
  The break is at **Step (5)**: *"If nothing settles which quale she is in, there is no fact of the matter about what it's like to be Sophie."*

  This step conflates **epistemic settlement** (evidence, discrimination, reports) with **metaphysical settlement** (the existence of a truth-maker). Step (4) establishes that the quale is *epistemically inaccessible* (neither Sophie nor the observer can discriminate the drift). Step (5) infers from this that the quale is *ontologically indeterminate*.

  This is a verificationist move: *No difference in evidence implies no difference in reality.* If you accept (5), you are no longer arguing for intrinsic qualia; you are arguing for logical positivism. Since your chapter is anti-functionalist (presumably realist about consciousness), you must reject (5).

  ### Why the Neural Analogy Fails (and why you were worried)
  Your worry about the neural realizers is insightful but rests on a disanalogy in Premise (4).

  *   **In the Neural Case:** You claimed "nothing settles it... someone with electrodes can tell." Actually, in your thought experiment setup, **electrodes do settle it.** Therefore, Premise (4) is *false* for the neural case. There *is* evidence (the electrode reading) that discriminates the hypotheses. So the argument doesn't run.
  *   **In the Qualia Case:** Premise (1) defines qualia as *intrinsic*. By definition, an intrinsic property is not constituted by external relations (including electrode readings). Therefore, in the qualia case, Premise (4) is *true* (by hypothesis). There is no external evidence that discriminates the hypotheses.

  The argument form only generates eliminativism if you accept that *ontological reality requires external discriminability*. By rejecting (5), you preserve the neural fact (because it is externally discriminable) while preserving the qualia fact (because it is intrinsically real despite being indistinguishable).

  ### The Solution: Reject (5), Keep (1)
  To save your view, you must assert: **There is a fact of the matter about what it's like for Sophie, even if nothing (no report, no scan, no behavior) settles it for anyone.**

  This requires a specific metaphysical commitment: **Phenomenal Realism without Phenomenal Knowledge.**

  1.  **Reject (5):** Epistemic inaccessibility does not entail ontological indeterminacy. The "fact of the matter" is constituted by the instantiation of the intrinsic property itself, not by the ability to categorize it.
  2.  **Modify (3):** You need to be careful here. If Sophie's introspective judgments are fixed by function (as per the compensator), and the qualia drift, then **Sophie's introspection is mistaken.** She judges "I am seeing Red$_{baseline}$" while experiencing Red$_{rotated}$.
      *   *Cost:* This denies the infallibility of introspection. Many anti-functionalists want to keep introspection privileged. You have to argue that introspection is a *functional process* that *tracks* qualia, and in this weird case, the tracking mechanism is decoupled from the target.

  ### Saving Belief Content (The Quine Worry)
  You worried this logic makes belief content indeterminate (Quinean indeterminacy). You can avoid this by drawing a **Dual-Aspect Theory of Mind**:

  *   **Content/Belief:** Functional/Relational. (Susceptible to Quinean indeterminacy if you wish, or determinate based on causal history).
  *   **Qualia/Consciousness:** Intrinsic/Non-Relational. (Resistant to Quinean indeterminacy because it doesn't rely on relations).

  By compartmentalizing, you can say: "Yes, belief content might be indeterminate without functional facts (Quine was right about *that*), but Conscious Character is determinate *because* it is intrinsic (Quine was wrong about *this*)." This allows you to keep the drift argument for qualia without letting it infect your semantics.

  ### Saving Interpersonal Inversion
  Does rejecting (5) cost you the interpersonal inversion case (that you and I might be inverted)? **No, it saves it.**

  If you accept (5), interpersonal inversion is impossible. If we are functionally identical, (5) says there is "no fact of the matter" about our qualia, so we can't be *determinately* inverted. We would just be... vague.
  By rejecting (5), you assert: "We are functionally identical, but there *is* a fact of the matter. I see Red, you see Green. Nobody can tell, but it's true." This is the classic Inverted Spectrum argument. Rejecting (5) is the *only* way to make the Inverted Spectrum coherent.

  ### The Real Cost: What You Must Own
  Rejecting (5) saves your chapter, but it extracts a tax. You must explicitly accept the following consequences in your text:

  1.  **Epistemic Isolation:** Consciousness is essentially private in a strong sense. It is possible for two people to be consciously different in ways that are *in principle* undetectable. This makes consciousness scientifically elusive (not just hard, but potentially transcendent of third-person methods).
  2.  **Introspective Fallibility:** As noted above, if the compensator fixes reports while qualia drift, Sophie cannot know her own qualia with certainty via her reports. You must argue that "what it is like" and "what I judge it to be like" can come apart.
  3.  **Potential Epiphenomenalism:** If the qualia drift makes no difference to function (by setup), then the specific *quality* of the quale is causally inert regarding behavior. You don't have to be a full epiphenomenalist, but you must admit that *phenomenal properties* do not supervene on *causal powers*.

  ### Revised Argument Structure
  Here is how you should reconstruct the argument in your chapter to avoid the self-destruct:

  1.  **Qualia are Intrinsic:** Their nature is not constituted by functional role.
  2.  **The Drift Case is Possible:** (Assume for argument) Functional organization can remain constant while intrinsic properties vary.
  3.  **Epistemic Opacity:** In the Drift Case, no third-person or first-person *report* discriminates the change.
  4.  **Reality exceeds Access (REJECT OLD 5):** Epistemic opacity does not entail ontological indeterminacy. The intrinsic property *itself* provides the truth-maker for the fact of the matter.
  5.  **Conclusion:** Therefore, functional organization does not exhaust phenomenal reality. (Anti-functionalism secured without Eliminativism).

  ### Summary
  *   **Reject:** Step (5).
  *   **Cost:** You must accept that consciousness can vary without any change in evidence (Epistemic Isolation) and that introspection is not logically guaranteed to track qualia (Introspective Fallibility).
  *   **Gain:** You save Realism about Qualia, allow for Determinate Interpersonal Inversion, and avoid the Quinean collapse of belief content (by distinguishing Content from Character).

  Your worry was that the argument was a "universal solvent" that dissolved everything. It is, but only if you drink the verificationist poison in Step (5). Spit that out, and the solvent only dissolves Functionalism.
