      *   **Invariant:** The number of I's is never divisible by 3 (starts at 1, doubling mod 3 gives 1 or 2, subtracting 3 doesn't change mod 3).
      *   **Target:** MU has 0 I's. 0 is divisible by 3.
      *   **Jootsing:** Realizing you can't solve it by playing the game, but by analyzing the game properties (modulo arithmetic).

