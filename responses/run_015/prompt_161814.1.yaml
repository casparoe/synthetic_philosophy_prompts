answer: |-
  Your youngest brother is right, and his reasoning is financially sound. Here is a breakdown of why he is correct, the hidden flaws in the "keep the house" plan, and an analysis of your proposed compromise.

  ### 1. Is your brother right?
  **Yes.** In finance, this is the difference between **Expected Value** and **Utility**.

  *   **Expected Value:** This is the mathematical average (£110k). If you could play this scenario 1,000 times, taking the average would make you richer.
  *   **Utility:** This is what the money is actually *for*. Your brother needs a deposit *now*. If he waits 10 years, house prices may have risen faster than the inheritance, or he may have missed his window to get on the ladder. If the market tanks and he ends up with £70k instead of £90k, that isn't just a "loss on paper"; it could mean he cannot buy a home at all.

  Furthermore, his skepticism about your promise to lend him money is valid. This is called **correlation risk**. If the property market crashes enough to reduce the inheritance significantly, it is likely the wider economy is also struggling. In a recession, all four of you are more likely to be "skint" simultaneously. A promise to lend money is only as good as the lender's ability to pay at that specific moment.

  ### 2. The "Hidden" Costs of Keeping the House
  The comparison of £90k now vs. £110k in ten years ignores three critical factors that likely make keeping the house a bad deal for *everyone*, not just the youngest brother.

  *   **Inflation:** £90,000 today has significantly more purchasing power than £110,000 in ten years. If inflation averages 3% per year, £90k today will be equivalent to roughly £121k in ten years. In "real terms," the £110k future payout is actually a **loss** compared to taking the cash now.
  *   **Costs & Effort:** Being a landlord for 10 years involves maintenance, insurance, management fees, and void periods (time without tenants). Are the £110k figures net of all these costs? If not, the profit margin is even thinner.
  *   **Capital Gains Tax (CGT):** When you eventually sell in 10 years, you will likely owe CGT on the increase in value since your mother passed away. This will eat into the final split.

  ### 3. Analysis of the £95k Guarantee Proposal
  Your idea to guarantee the youngest brother £95k regardless of the outcome is a clever way to transfer risk, but it changes the dynamic significantly.

  **How it works:**
  You effectively treat the youngest brother as a creditor. He gets paid first. The remaining three of you take the residual risk.

  **The Math (Hypothetical):**
  *   **Scenario A (Market Booms):** House sells for £500k total.
      *   Youngest gets £95k.
      *   Remaining £405k split 3 ways = £135k each.
      *   *Result:* Everyone does very well.
  *   **Scenario B (Market Tanks):** House sells for £320k total.
      *   Youngest gets £95k.
      *   Remaining £225k split 3 ways = £75k each.
      *   *Result:* The youngest is happy (he beat the "sell now" option). The other three get **less** than the "sell now" option (£75k vs £90k).

  **The Risk:**
  By guaranteeing him £95k, the other three of you are absorbing all the downside risk. If the market crashes, you subsidize his gain. You need to ask yourselves: **Are the three of you willing to accept less than £90k each in a worst-case scenario to give him peace of mind?**

  **The Friction:**
  If the market tanks, resentment can build. If you end up with £75k because you had to pay him £95k, you might feel punished for trying to be generous. Family relationships often sour over asymmetric financial risk.

  ### 4. Better Alternatives
  Given the inflation math and the risk profile, the most rational financial decision is actually to **sell the house now.** However, if the three of you are determined to keep it as an investment, consider these structures instead:

  **Option A: The Buyout (Cleanest)**
  The three of you keep the house; the youngest brother sells his 25% share to you *now*.
  *   You pay him £90k (or £95k if you want to be generous) immediately.
  *   To do this, the three of you might need to remortgage or use savings.
  *   **Pros:** He gets his deposit. You keep the asset. No future entanglement.
  *   **Cons:** You need to find the cash now.

  **Option B: Sell Now, Invest the Proceeds**
  Sell the house, split the £360k.
  *   The youngest gets his deposit.
  *   The other three invest their £90k in a diversified portfolio (stocks/bonds) rather than a single property.
  *   **Pros:** Instant liquidity, diversification, no landlord headaches, no CGT issues later.
  *   **Cons:** You lose the specific asset.

  **Option C: Short-Term Let**
  Rent the house for 2 years, then sell.
  *   This bridges the gap. It gives some upside potential without locking the money away for a decade.
  *   **Pros:** Compromise between risk and reward.
  *   **Cons:** Still involves landlord work, just for less time.

  ### Recommendation
  Your youngest brother is right to be risk-averse. **£90k today is worth more than a gamble on £110k in ten years,** especially when inflation is factored in.

  The guarantee proposal fixes his problem but creates a potential resentment trap for the other three.

  **The best path:**
  1.  **Sell the house now.** The inflation-adjusted value of waiting 10 years is likely negative, and the hassle of being landlords for a decade is not worth the marginal expected gain.
  2.  **If you must keep it:** Use **Option A (The Buyout)**. Pay the youngest brother his share in cash now (funded by the other three borrowing against the property or using savings). This gives him certainty and lets the other three gamble with their own shares without dragging him into the risk.

  *Disclaimer: I am an AI, not a financial advisor. Inheritance tax, capital gains tax, and property laws vary. You should seek professional financial and legal advice before making binding agreements.*
