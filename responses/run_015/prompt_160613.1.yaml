  ***

  # Project Proposal: Robust Program Equilibrium
  **Subtitle:** *Selection via Source-Code Perturbation and Computational Budgets*

  ## 1. Research Question and Motivation
  In the Program Equilibrium (PE) framework (Tennenholtz 2004; Fortnow et al. 2010), players in a one-shot game submit source code rather than actions. A program reads the opponent's source and outputs an action. This allows for cooperative equilibria in the Prisoner's Dilemma (PD) via constructions like "Cooperate iff the opponent's source code is identical to mine."

  However, PE suffers from a severe **permissiveness problem**. Because programs can condition on syntactic trivia (e.g., "Cooperate iff the opponent's code has an even number of characters"), the set of equilibria is absurdly large. Cooperation is supported, but it is not *focal*; it is merely one of infinitely many fragile gadgets. Existing attempts to resolve this by restricting the programming language or requiring provability (e.g., Modal Logic approaches) often feel ad hoc or impose unrealistic computational omniscience.

  **The Core Question:**
  Can we select for cooperative equilibria by requiring them to be **robust to syntactic perturbation**?

  I propose a new refinement: **Mutation-Stable Program Equilibrium (MS-PE)**. A profile is mutation-stable if cooperation persists when the opponent's source code is subjected to small random edits (token insertion, deletion, substitution). The "Cooperate iff Identical" gadget is maximally fragile under this metric. A robust program must recognize *semantic* similarity despite *syntactic* noise.

  **The Trade-off:**
  Robustness is not free. A program tolerant of mutations risks being exploited by "mimic" programs that look cooperative but defect. Furthermore, recognizing semantic similarity requires simulation, which is bounded by a step budget $B$.
  This project asks: **What is the Pareto frontier between Robustness ($R$) and Exploitability ($E$) for programs that cooperate against themselves and defect against Unconditional Defection?** Specifically, does the cost of robustness vanish as the computational budget $B \to \infty$, or is there a fundamental impossibility result?

  ## 2. Why Existing Approaches Do Not Settle This
  *   **The Permissiveness Objection:** Standard PE admits any equilibrium of the underlying game plus many more. Standard refinements (trembling hand, proper equilibrium) operate on *action* probabilities. In PE, the strategy *is* the code. Perturbing the action does not test the code's logic; perturbing the code tests the logic's stability.
  *   **Language Restrictions:** Limiting the language (e.g., to finite automata) solves the halting problem but makes the "syntax vs. semantics" distinction trivial. We need a result that holds for Turing-complete (or sufficiently rich) languages where semantic equivalence is undecidable.
  *   **Provability Logic:** Approaches like "Cooperate if I can prove you cooperate" (Löbian cooperation) avoid simulation but rely on agents sharing specific proof systems. They do not address the sensitivity to syntactic variation in the *implementation* of those proof systems.
  *   **Commitment Devices:** While PE is structurally similar to commitment, standard commitment assumes an external enforcement mechanism. Here, the "commitment" is endogenous to the code's complexity. The cost of robustness is a computational cost, not an institutional one.

  ## 3. Methodology and Work Plan (12 Months)
  This is a solo theoretical project with a minor empirical component for sanity-checking.

  **Phase 1: Formalization (Months 1–3)**
  *   **Task:** Define the toy language $\mathcal{L}$. It must be simple enough to define an edit distance $d(P, P')$ rigorously (e.g., a bounded Turing Machine or a simple functional language) but rich enough to support universal computation.
  *   **Task:** Formalize the **Mutation Metric**. Define the neighborhood $N_\epsilon(P)$ as all programs within edit distance $\epsilon$ of $P$.
  *   **Task:** Define **Exploitability**. For a candidate program $C$, $E(C) = \max_{P' \in N_\epsilon(C)} [\text{Payoff}(P', C) - \text{Payoff}(C, C)]$.
  *   **Deliverable:** A working definition of MS-PE and a lemma establishing that Unconditional Defection is robust but Unconditional Cooperation is not.

  **Phase 2: Theoretical Bounds (Months 4–8)**
  *   **Task:** Derive the **Robustness-Exploitability Frontier**.
      *   *Hypothesis 1:* For any $B$, there exists a program that is $\epsilon$-robust and $\delta$-unexploitable.
      *   *Hypothesis 2:* As $B \to \infty$, the cost of robustness (the minimum $\delta$ required for a given $\epsilon$) approaches zero.
  *   **Task:** Investigate the **Step Budget $B$**. Does increasing $B$ allow for better "semantic clustering" of programs, or does it simply open more avenues for exploitation?
  *   **Deliverable:** Proof of existence (or impossibility) of robust cooperative programs. A theorem characterizing the relationship between $B$, $\epsilon$, and $E$.

  **Phase 3: Simulation & Enumeration (Months 9–10)**
  *   **Task:** Exhaustive enumeration of all programs in $\mathcal{L}$ up to size $S$ (where $S$ is small, e.g., 10–15 tokens).
  *   **Task:** Compute the exact $R/E$ frontier for this finite subset.
  *   **Justification:** This is **not** the main result. It serves as a **conjecture generator** and a sanity check to ensure the theoretical bounds are not artifacts of asymptotic reasoning that don't hold in finite cases. (See *Scope Note* below).
  *   **Deliverable:** Empirical plots of the frontier for small $S$ to guide Phase 2 proofs.

  **Phase 4: Synthesis and Write-up (Months 11–12)**
  *   **Task:** Consolidate theoretical results and simulation data.
  *   **Task:** Draft thesis and paper for submission (e.g., to *EC*, *AAMAS*, or *JET*).

  ## 4. Success and Failure Criteria
  *   **Positive Result:** A theorem proving that for a specific class of languages, there exists a sequence of programs where Robustness $\to 1$ and Exploitability $\to 0$ as $B \to \infty$. This would establish cooperation as a "computationally stable" outcome.
  *   **Negative Result (Valuable):** An impossibility theorem showing that robustness *necessarily* implies exploitability bounded away from zero, regardless of $B$. This would imply that Program Equilibrium cannot solve the PD without external coordination on a specific focal program.
  *   **Project Failure:** If the results are shown to be entirely dependent on the arbitrary choice of the toy language $\mathcal{L}$ (e.g., the metric works for Language A but breaks for Language B with no generalizable principle), or if the "robustness" condition collapses into a known refinement (e.g., trembling hand) rendering the contribution null.

  ## 5. Scope Check
  *   **Feasibility:** 12 months is tight for a solo theorist. The risk lies in Phase 2. If the general case is intractable, I will pivot to characterizing the frontier for a specific restricted class (e.g., programs with bounded memory) rather than abandoning the project.
  *   **Simulation Limit:** Enumeration (Phase 3) will be strictly limited to tiny program sizes. The combinatorial explosion of source code is exponential; attempting to simulate "realistic" code is impossible. The simulation is strictly to validate intuition, not to prove the theorem.

  ***

  # Pre-Submission Checklist & Strategic Advice

  Here is how you should handle the specific points you raised, both in the proposal text (where incorporated above) and in your oral defense/interview.

  ### (a) The Enumeration Trap
  **Verdict:** Make it a **Conjecture Generator / Sanity Check**, not the main method.
  **Why:** If you make brute-force enumeration the core of the project, the CS committee will say "this doesn't scale," and the Econ committee will say "this isn't a general equilibrium result."
  **How to frame it:** "The space of programs is too large for exhaustive search to be a proof technique. However, for $N < 15$, we can compute the exact frontier. This allows us to spot-check our theoretical bounds. If our theorem says robustness is possible but the enumeration shows it's impossible for small $N$, we know our asymptotic assumptions are hiding a constant-factor cost."

  ### (b) The "Commitment Device" Objection
  **Verdict:** Your friend is half-right, but you have the counter-argument.
  **The Counter:** "Standard commitment devices (like burning money or signing contracts) are **exogenous** mechanisms added to the game. Program Equilibrium is **endogenous**; the 'device' is the logic of the strategy itself. My project isn't about *whether* they can commit, but *how much computational resource* is required to make that commitment robust to implementation errors. It turns 'commitment' from a binary switch into a continuous resource constraint (budget $B$)."

  ### (c) Mutation vs. Trembling Hand
  **Verdict:** They are **distinct**, and you must emphasize this.
  **The Distinction:**
  *   **Trembling Hand:** Perturbs the *output* (Action). $P \to \text{Defect}$ with prob $\epsilon$. This tests if the equilibrium is stable against execution errors.
  *   **Mutation:** Perturbs the *algorithm* (Source). $P \to P'$. This tests if the *logic* is stable against implementation errors.
  *   **Why it matters:** In PE, "Cooperate iff Identical" is trembling-hand perfect (if I tremble, I defect, you defect, we get DD, which is Nash). But it is **mutation-fragile** (if my code mutates, we get DD). A robust program must cooperate against *variants* of itself. This is a much stronger condition than trembling hand perfection. It selects for programs that recognize *intent* rather than exact syntax.

  ### (d) Pitching to the Split Committee
  *   **To the Econ Half:** "This is not just another refinement. Standard refinements select based on beliefs or off-path behavior. This selects based on **implementation complexity**. It answers: 'Is cooperation computationally cheaper to stabilize than defection?' It bridges bounded rationality with equilibrium selection."
  *   **To the CS Half:** "This is not just a halting problem exercise. We aren't just asking 'can they compute it?' We are asking about **semantic stability under syntactic noise**. This relates to program repair and adversarial robustness in ML, but applied to game-theoretic incentives. It's about the topology of the program space."

  ### (e) Is the Idea Too Weak? (Reframing Advice)
  The idea is **strong enough**, but only if you avoid the "Language Trap."
  *   **Risk:** If you define edit distance on Python code, the committee will tear you apart (what's the distance between `x=1` and `x=2` vs `x=1` and `y=1`?).
  *   **Fix:** In Phase 1, commit to a **canonical representation**. For example, "We model programs as strings over a fixed alphabet representing a specific Turing Machine encoding." Acknowledge that the metric is sensitive to encoding, but argue that *asymptotic* results (as $B \to \infty$) should be encoding-independent if the language is universal.
  *   **Reframe:** Don't sell it as "Solving the Prisoner's Dilemma." Sell it as **"Characterizing the Computational Cost of Robust Cooperation."** Even a negative result (Robustness is impossible without high exploitability) is a publishable theorem about the limits of algorithmic game theory.

  ### Final Scope Warning
  You have 12 months. **Do not try to solve the general case for all Turing Machines.**
  *   **Pivot Plan:** If the general proof is too hard by Month 6, restrict the class of programs to **Finite State Automata** or **Bounded Loop Programs**. A solid result on a restricted class is better than a hand-wavy result on the general class. State this contingency in your mind (maybe not in the proposal, but keep it ready for the interview).

  Good luck. This is a sharp idea; the key is keeping the definitions tight enough that you can actually prove something about them.
