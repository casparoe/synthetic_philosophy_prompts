prompt: |-
  I facilitate governance design for cooperative housing associations—groups of thirty to two hundred households that draft their own charters and amend them by supermajority. Increasingly, these groups want to embed what I call Ulysses provisions: rules that are deliberately costly to overturn, meant to bind future residents to commitments made today, such as perpetual affordability covenants, bans on speculative resale, or mandatory environmental maintenance levies. The philosophical rationale is familiar—a collective, like an individual, may rationally precommit to avoid predictable failures of will or shortsightedness. But my clients also fear locking themselves into mistakes if conditions change radically, and they want something more nuanced than a simple sunset clause. I have been experimenting with a framework I term conditional rigidity with epistemic release: the idea that a precommitment should not dissolve automatically after a fixed term, but only when an independent internal review body, operating under its own locked procedural rules, certifies that the original rationale for the clause has become epistemically obsolete according to criteria specified in the charter itself. This creates a second-order binding—the group binds not only its future actions but also the conditions under which it may reconsider them.

  I need you to turn this combination of Ulysses-style constitutional precommitment and this second-order, conditionally locked release mechanism into an operational decision procedure my clients can actually run during charter drafting. The procedure should be ordered: the specific questions to ask about a proposed provision, what counts as a sufficient answer to advance to the next step, where the procedure stops with a clear recommendation not to precommit, and where it explicitly hands the decision to human judgment because the issue is one of values rather than institutional mechanics. It must handle hard cases—provisions that protect vulnerable members versus those that merely reflect current aesthetic preferences; release mechanisms that risk being captured by the very majorities the precommitment is meant to restrain; and situations where specifying the epistemic obsolescence criteria in advance seems impossible without smuggling in the desired conclusion. Please apply the procedure to three proposed charter clauses: a perpetual covenant capping resale prices at original purchase value plus inflation; an irrevocable rule requiring unanimous consent to approve emergency loans above a set threshold; and a clause mandating specific low-carbon heating infrastructure that is currently compulsory but might become technologically obsolete. For at least one of these, the procedure should yield a recommendation that my clients will dislike—perhaps that a deeply valued provision should not be precommitted, or that the release mechanism they want is structurally self-defeating. Also flag exactly which steps in your procedure are judgment calls disguised as technical checks, and state clearly what the procedure cannot do—where a cooperative must simply choose between competing visions of its own future self.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Facilitator of governance design for cooperative housing associations (30-200 households).
      *   **Context:** Clients want "Ulysses provisions" (hard-to-overturn rules) but fear locking in mistakes.
      *   **Proposed Framework:** "Conditional Rigidity with Epistemic Release" (CRER). Precommitments dissolve only when an independent internal review body certifies the *original rationale* is epistemically obsolete based on charter-specified criteria.
      *   **Task:** Turn this into an *operational decision procedure* for charter drafting.
      *   **Requirements:**
          *   Ordered steps (questions, sufficient answers, stop points).
          *   Distinguish between institutional mechanics and value judgments.
          *   Handle hard cases (vulnerable members vs. aesthetics, capture risk, defining obsolescence).
          *   Apply to three specific clauses:
              1.  Perpetual resale price cap (original + inflation).
              2.  Unanimous consent for emergency loans.
              3.  Mandatory low-carbon heating infrastructure.
          *   **Crucial:** At least one recommendation must be unpopular/uncomfortable (e.g., "don't precommit" or "mechanism is self-defeating").
          *   **Crucial:** Flag steps that are judgment calls disguised as technical checks.
          *   **Crucial:** State clearly what the procedure *cannot* do (limits of the framework).

  2.  **Deconstruct the Framework (CRER):**
      *   *Core Tension:* Binding the future vs. adapting to change.
      *   *Mechanism:* Second-order binding (binding the *conditions* of release).
      *   *Key Risk:* The "Independent Review Body" (IRB) might be captured, or the "Epistemic Obsolescence" criteria might be impossible to define neutrally.

  3.  **Drafting the Decision Procedure:**
      *   Needs to be step-by-step.
      *   Needs "Gateways" (Pass/Fail).
      *   Needs to identify where human judgment takes over.
      *   *Step 1: Rationale Articulation.* (Why are we doing this?)
      *   *Step 2: Vulnerability & Power Analysis.* (Who does this protect/harm?)
      *   *Step 3: Obsolescence Definability.* (Can we define "obsolete" without begging the question?)
      *   *Step 4: Review Body Integrity.* (Who judges the release? Can they be captured?)
      *   *Step 5: The "Self-Defeat" Check.* (Does the rigidity undermine the goal?)

  4.  **Developing the Three Case Studies:**
      *   *Case 1: Resale Price Cap.* (Affordability vs. Market Reality).
          *   *Risk:* If inflation is high but wages stagnate, or if the housing market crashes, the cap might make equity impossible to access, hurting exiting members. Or if the market skyrockets, it creates black markets.
          *   *Verdict:* Likely support precommitment *but* with a robust release mechanism. *Wait, I need an unpopular recommendation.* Let's make this one the "Don't Precommit" or "High Risk" one. Actually, the *Emergency Loan* one is a better candidate for "Self-Defeating." Let's save that. Let's make the Resale Cap one the "Judgment Call" heavy one.
      *   *Case 2: Unanimous Consent for Emergency Loans.* (Safety vs. Paralysis).
          *   *Risk:* Emergencies require speed. Unanimity is the ultimate veto. Precommitting to unanimity in an emergency is likely *self-defeating* because the rigidity prevents the action needed to save the co-op.
          *   *Verdict:* **Recommendation: Do Not Precommit.** This satisfies the "clients will dislike" requirement.
      *   *Case 3: Low-Carbon Heating.* (Environmental vs. Tech Obsolescence).
          *   *Risk:* Tech changes fast. "Specific infrastructure" is bad. "Performance standard" is better.
          *   *Verdict:* Precommit to the *goal*, release mechanism for the *method*.

  5.  **Refining the "Unpopular Recommendation":**
      *   The prompt asks for a recommendation clients will dislike. Co-ops often love unanimity for "big decisions." Telling them that precommitting to unanimity for *emergency loans* is structurally suicidal is a strong, uncomfortable truth.
      *   Alternatively, telling them the Resale Cap creates a "poverty trap" for exiting members if not released properly.
      *   Let's go with the **Emergency Loan Unanimity**. It highlights the danger of Ulysses cords snapping when you need the ship to steer.

  6.  **Addressing the "Judgment Calls Disguised as Technical Checks":**
      *   Defining "Epistemic Obsolescence" is inherently political.
      *   Selecting the Review Body members is political.
      *   Determining "Vulnerability" is normative.

  7.  **Addressing "What the Procedure Cannot Do":**
      *   It cannot resolve value conflicts (e.g., Affordability vs. Equity Accumulation).
      *   It cannot predict black swan events.
      *   It cannot guarantee the Review Body won't be captured.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the user's framework.
      *   **The Procedure (CRER Protocol):** Step-by-step with Gates.
      *   **Application to Cases:** Run the three clauses through the protocol.
      *   **The Uncomfortable Truth:** Highlight the specific recommendation that will sting.
      *   **Meta-Analysis:** Flag the disguised judgment calls and limitations.

  9.  **Drafting Content - Iteration & Polishing:**
      *   *Tone:* Professional, analytical, slightly academic but operational.
      *   *Check:* Did I include the "Epistemic Release" specific language? Yes, need to ensure the criteria for release are central.
      *   *Check:* Is the distinction between "mechanics" and "values" clear?
      *   *Refining the Emergency Loan Case:* Why is it self-defeating? Because an emergency implies a time constraint. Unanimity implies potential infinite delay. Precommitting to a process that guarantees failure in the specific scenario it's designed for is irrational.
      *   *Refining the Resale Cap Case:* This is the classic "Affordability vs. Wealth Building" tension. The release mechanism needs to be about *economic viability*, not just "we want more money."
      *   *Refining the Heating Case:* This is about *technological neutrality*. The precommitment should be to *outcomes*, not *inputs*.

  10. **Final Review against Constraints:**
      *   Ordered procedure? Yes.
      *   Specific questions? Yes.
      *   Stop points? Yes.
      *   Three cases applied? Yes.
      *   Unpopular recommendation included? Yes (Emergency Loans).
      *   Flagged judgment calls? Yes.
      *   Stated limitations? Yes.

  11. **Final Polish:** Ensure the language matches the user's high-level governance terminology ("epistemic release," "second-order binding"). (Self-correction: Make sure the "Review Body" isn't just a board, but a specific body with locked rules).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "don't do unanimity." I need to explain *why* the CRER framework specifically fails there. The "Epistemic Obsolescence" for an emergency loan is hard to define because the emergency *is* the condition. If the condition for release is "emergency," but the rule requires unanimity to act *in* the emergency, the release mechanism is inaccessible. That's the key insight.

