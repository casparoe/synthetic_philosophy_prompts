prompt: |-
  I am drafting a two-page pitch for internal seed funding: one researcher for twelve months, no teaching, to work on a single question in collective decision-making. The topic is safe Pareto improvements, and I want the money to go to a question I think the literature has left in an awkward place.

  The notion as I am working with it: there is a status quo policy, a feasible set of alternatives, finitely many people, and finitely many states of the world. Each person has a utility function over outcomes and a probability distribution over states. A move from the status quo to an alternative is a safe Pareto improvement when, for every person, that person's own expected utility — computed from their own probabilities and their own utility function — is higher under the alternative than under the status quo. Its appeal is that it needs no interpersonal comparison and no social welfare function: a planner who has no view at all on the merits can apparently still make everyone better off, where better off is spelled out in terms each person would accept.

  My half-formed worry is that the guarantee is conditional on people's actual beliefs, and beliefs are precisely what the planner does not observe. If the planner has to ask, then anyone who expects to dislike the proposed change can report probabilities under which it looks bad, and reporting pessimism is costless; symmetrically, people can report confident beliefs to push through changes they favour. So safety may turn out to be safety relative to reported beliefs only. Behind that strategic point sits a structural one: the status quo is the disagreement point, no change is available for free, and anyone can in principle secure it by reporting suitably unhelpful probabilities. I suspect some kind of impossibility is available — that a rule which (i) selects a safe Pareto improvement whenever one exists relative to the true beliefs, (ii) never gives anyone an expected gain from misreporting their probabilities, and (iii) is neither a rule that always keeps the status quo nor one that consults a single designated person, either cannot be had or can be had only under a characterization so narrow that it shows the notion is not institutionally usable. But I do not know whether the honest conclusion is pessimistic about safe Pareto improvements or reconstructive of them, and that ambiguity is partly why I want the project scoped properly.

  What I need is a proposal that does the following. State the question so that it has a determinate answer — a theorem, a characterization, or a clearly described counterexample space — rather than a topic. Fix and justify the modelling choices: whether utilities are taken as observable while beliefs are private, or both are private; whether the people are assumed to share a prior; whether the planner can commit to a rule in advance. Explain why the existing answers leave it open: say what the standard treatments of safe Pareto improvements are doing when they help themselves to each person's beliefs, and say why the familiar impossibility results about strategy-proofness and about the tension between incentive compatibility and efficiency do not simply settle the matter, given that here the private object is a probability rather than a preference over outcomes and the default is the status quo rather than an arbitrary alternative. Argue for one approach over the obvious alternatives — in particular over the move to a robust or ambiguity-set version, where a change must raise each person's expected utility under every probability in a set attributed to them, and over a purely dynamic treatment in which each step is an improvement but the sequence may be exploitable — and say which of these belongs in the twelve months and which has to be left for later. Give a month-by-month plan for the year, including one minimal worked example with two or three people and two or three states that fixes intuitions and that the project would actually solve early on. Say what the possible conclusions are and which considerations would decide between them. Say what would count as the project having failed, and what would count as a disappointing but still useful result. Finally, describe a concrete deliverable and make the case, in a sentence or two, for why twelve months of one person's time is the right size for this and not for something larger.

  Describe positions and arguments by their content, not by author or paper: I will fill in the references myself, and I do not want the proposal's plausibility to rest on a citation list. Be straight about what could make the project too big for the time available.
reasoning: |-
  Here's a thinking process that leads to the proposal:

  1.  **Analyze the Request:**
      *   **Goal:** Draft a two-page pitch for internal seed funding.
      *   **Resources:** One researcher, twelve months, no teaching.
      *   **Topic:** Safe Pareto Improvements (SPI) in collective decision-making.
      *   **Core Problem:** SPI relies on individual beliefs/probabilities. If beliefs are private and unobservable, agents can strategize (report pessimism to block, optimism to pass). The status quo acts as a disagreement point.
      *   **Hypothesis:** There might be an impossibility result (or a very narrow possibility) regarding rules that find SPIs based on true beliefs while being incentive-compatible (strategy-proof) regarding belief reporting, without being dictatorial or status-quo biased.
      *   **Requirements:**
          *   State a determinate question (theorem/characterization/counterexample).
          *   Fix and justify modeling choices (utilities vs. beliefs private, common prior, commitment).
          *   Explain gap in existing literature (why standard SPI treatments and standard impossibility results don't settle this).
          *   Argue for one approach over alternatives (robust/ambiguity sets, dynamic treatments).
          *   Month-by-month plan (including a minimal worked example early on).
          *   Possible conclusions (success vs. failure vs. disappointing but useful).
          *   Concrete deliverable.
          *   Justification for scope (why 12 months/1 person is right).
          *   **Constraint:** Describe positions/arguments by content, *not* by author/paper.
          *   **Tone:** Straight, realistic, academic but persuasive.

  2.  **Deconstruct the Scientific Problem:**
      *   *Standard SPI:* Move from $SQ$ to $Alt$ if $E_i[u_i(Alt)] > E_i[u_i(SQ)]$ for all $i$, using $i$'s own $u_i$ and $p_i$.
      *   *The Twist:* The planner doesn't know $p_i$. Agents report $\hat{p}_i$.
      *   *The Conflict:* If I want $Alt$, I report $p_i$ that makes $Alt$ look good. If I want $SQ$, I report $p_i$ that makes $Alt$ look bad. Since $SQ$ is the default, blocking is easy.
      *   *The Mechanism Design Angle:* We need a mechanism $M(\hat{p}_1, ..., \hat{p}_n) \to \{SQ, Alt\}$ (or a lottery over alternatives).
      *   *Constraints:*
          1.  *Ex-post Efficiency (SPI):* If true beliefs support an SPI, the mechanism should find it (or one of them).
          2.  *Incentive Compatibility (IC):* Truth-telling is a dominant strategy (or Bayesian Nash Equilibrium).
          3.  *Individual Rationality (IR):* No one expects to be worse off than $SQ$ under true beliefs (this is built into SPI definition, but needs to hold under the mechanism).
          4.  *Non-triviality:* Not always $SQ$, not dictatorial.
      *   *Modeling Choice:* Utilities $u_i$ are known/verifiable (or at least fixed/observable), Beliefs $p_i$ are private. Why? Because utilities are often revealed by choices over sure outcomes, whereas beliefs are about uncertain states. Also, the prompt emphasizes the "beliefs are precisely what the planner does not observe" aspect.
      *   *Commitment:* Planner commits to a rule. Essential for mechanism design.
      *   *Prior:* No common prior assumed (heterogeneous beliefs are the point of SPI).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy. "The Strategic Vulnerability of Safe Pareto Improvements."
      *   **The Question:** Formalize the impossibility/characterization query. "Does there exist a mechanism that implements Safe Pareto Improvements based on private beliefs while satisfying strategy-proofness and non-triviality?"
      *   **Modeling Choices:**
          *   *Utilities:* Public/Verifiable. (Simplifies to focus on beliefs).
          *   *Beliefs:* Private.
          *   *Commitment:* Yes.
          *   *Why:* Isolates the specific friction of belief elicitation in SPI contexts.
      *   **Literature Gap:**
          *   *SPI Lit:* Assumes beliefs are given or honest. Ignores strategic reporting.
          *   *Mechanism Design Lit:* Focuses on preferences (utilities) as private info, not beliefs. Or assumes common priors (Bayesian implementation). The "Status Quo" as a specific disagreement point with belief-dependent payoffs is the niche.
          *   *Why standard impossibilities don't apply:* Gibbard-Satterthwaite is about preferences over outcomes. Here preferences over outcomes are fixed; the *likelihood* of those outcomes is the private info. The domain is restricted (probability simplices), which might allow escape routes, or create new traps.
      *   **Approach Selection:**
          *   *Reject Robust/Ambiguity:* That changes the definition of SPI to "Maximin Expected Utility." That's a different normative concept. The goal is to save the *original* SPI concept.
          *   *Reject Dynamic:* Too complex for 12 months. Convergence issues distract from the core static incentive problem.
          *   *Select:* Static Mechanism Design with transferable utility? No, SPI usually implies no transfers. Stick to pure public choice with belief reporting.
      *   **Work Plan:**
          *   *Months 1-3:* Formalize model, solve the 2-agent, 2-state, 2-alternative case. (The minimal example).
          *   *Months 4-6:* Generalize to $n$-agents. Search for possibility results (domain restrictions).
          *   *Months 7-9:* Prove impossibility or characterize the narrow class of rules.
          *   *Months 10-12:* Write up, refine the "disappointing but useful" bounds.
      *   **Outcomes:**
          *   *Success:* Characterization theorem (e.g., "Only dictatorial rules work").
          *   *Failure:* Can't close the gap between possibility and impossibility.
          *   *Disappointing but Useful:* Impossibility holds, but we identify a specific domain restriction (e.g., "correlated beliefs") where it works.
      *   **Deliverable:** A working paper + a policy brief summary.
      *   **Scope Justification:** It's a tight theoretical knot. Doesn't need empirical data or large teams. One brain for a year is the unit of production for this kind of theorem-proving.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is assuming utilities are public realistic?
      *   *Fix:* Acknowledge it's a simplification. Justify it by saying risk attitudes are often elicitable via lotteries over sure things, whereas beliefs about external states are not. The core friction is the *state* probability, not the *utility* of the state.
      *   *Critique:* Is the "minimal example" specific enough?
      *   *Fix:* Define it clearly in the plan. 2 agents, 2 states, Status Quo vs. One Alternative.
      *   *Critique:* Make sure not to cite names.
      *   *Fix:* Use phrases like "standard mechanism design results" or "existing literature on Pareto improvements."

  5.  **Final Polish:** Check word count (aiming for ~2 pages worth of content, dense but readable). Ensure tone is confident but honest about risks. Ensure the "Why 12 months" argument is strong (it's a "one-person, one-proof" project).

  6.  **Writing the Proposal:** (Proceeding to generate output based on these thoughts). *Wait, need to ensure I explicitly address the "robust/ambiguity" alternative rejection as requested.* I will add a specific paragraph on why I am not going the robust route. *Also need to ensure the "disappointing but useful" is clear.*

  7.  **Final Review against constraints:**
      *   Two-page pitch style? Yes.
      *   One researcher, 12 months? Yes.
      *   Determinate question? Yes.
      *   Modeling choices justified? Yes.
      *   Literature gap explained (no citations)? Yes.
      *   Approach argued (vs robust/dynamic)? Yes.
      *   Month-by-month plan? Yes.
      *   Minimal example described? Yes.
      *   Success/Failure criteria? Yes.
      *   Deliverable? Yes.
      *   No author names? Yes.

