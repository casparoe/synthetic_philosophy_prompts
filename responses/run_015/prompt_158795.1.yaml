      *   *Refining the "Audit" Spine:* The user asks if the spine is right. I need to validate it but tweak the "empty" claim. The Observer box isn't empty of *experience*, but empty of *causal source*.
      *   *Refining the Example:* I will suggest using the Ice Cube but strictly as a "movie" to test reversibility, not as a definition of entropy.
