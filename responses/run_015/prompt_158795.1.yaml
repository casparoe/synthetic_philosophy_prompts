  9.  **Final Polish:** Check against constraints. "Shorter is fine." "Sequence is most of what I'm after." Ensure the tone matches the user's high-level expertise. (Avoid explaining stat mech, focus on flow).

      *(Self-Correction during drafting)*: Wait, the "Observer" box being "empty" is the specific point of contention for the philosophers. If I say it's empty, they revolt. If I say it's full, the physicists revolt. The nuance is: The *asymmetry* isn't in the observer, but the *detection* is. I need to make sure the plan reflects that distinction. The *source* of the arrow is not in the observer.

