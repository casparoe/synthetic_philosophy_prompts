      *   *Revised Winning Idea:* **Keep the Ice Cube, but strip it.** Don't talk about "disorder." Talk about *phase space volume*. But for a 75-min talk, phase space is dry.
      *   *Compromise:* Use the **Ice Cube** but immediately pivot to **Why don't we see the reverse?** (Spontaneous freezing). This forces the Boundary Condition discussion.
      *   *Wait, User asked what the case must have/lack:*
