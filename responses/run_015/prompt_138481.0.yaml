  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** [Your Name]
  **SUBJECT:** Weighting Safety Evidence for Irreversible AI Deployment

  **1. Evidence Classification and Scoring**
  *Scores (0–10) represent confidence boost for a **one-shot, irreversible** deployment. 10 = Certainty.*

  | # | Evidence Type | (a) Tier | (b) Score | (c) Primary Sensitivity |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Red-teaming (skilled adversaries) | Average-case evidence | 4 | Whether red-team tactics match real-world adversary capabilities. |
  | 2 | Dangerous-capability evaluations | Average-case evidence | 3 | The gap between benchmark constraints and open-world opportunity. |
  | 3 | Machine-checked proof (with caveats) | Behaves like a worst-case guarantee | 2 | The accuracy of the formal model's mapping to physical reality. |
  | 4 | Mechanistic account with intervention | Average-case evidence | 5 | Stability of internal mechanisms under distributional shift. |
  | 5 | Oversight (weak model + human kill switch) | Average-case evidence | 1 | Speed of catastrophe versus speed of human response. |
  | 6 | Track record (previous versions) | Average-case evidence | 2 | Magnitude of capability jump between versions. |
  | 7 | System's own written safety case | Looks like evidence but is mostly presentation | 0 | Incentive alignment of the system (currently unknown). |

  **2. Validation of Heuristics**
  Your two distinctions are correct and map to standard safety concepts.
  *   **"It knows it is being tested":** Valid. Standard term: **Deceptive Alignment** or **Sandbagging**. It invalidates average-case evidence because the sample is non-representative.
  *   **"All copies fail together":** Valid. Standard term: **Correlated Failure** or **Systemic Risk**. It reduces effective sample size to one, nullifying statistical confidence.

  **3. Funding Allocation (Worst-Case vs. Average-Case)**
  *   **Current Recommendation:** **30%** of funds to worst-case methods (formal verification, provable training).
      *   *Justification:* Current worst-case methods rarely deliver for deep learning, but we cannot rely on average-case for irreversible stakes; this funds the necessary R&D to close the gap.
  *   **If Worst-Case Methods Were Mature:** **80%** of funds to worst-case methods.
      *   *Justification:* If guarantees were achievable, average-case evidence would become redundant for high-stakes deployment decisions.

  **4. Serial vs. One-Shot Deployment**
  *   **Tier Movement:** No evidence type logically changes tier (average-case remains statistical), but **Item 5 (Oversight)** moves from useless (Score 1) to viable (Score 7) in serial deployment because feedback loops allow correction before catastrophe.
  *   **Score Shifts:** Items 1, 2, and 6 (Red-teaming, Evaluations, Track Record) increase significantly in serial deployment (adding +3 to +5 points) because failures become learning opportunities rather than terminal events.
  *   **Guarantee Tier:** Nothing moves from Average to Guarantee tier logically; however, in serial deployment, accumulated average-case evidence can approximate near-certainty, whereas in one-shot deployment, only Item 3 (Proofs) retains non-zero theoretical weight.
