  2.  **Deconstruct the Scenario:**
      *   *Case A (Resident):* Duty exists, capacity exists, action omitted $\rightarrow$ Harm. Coded as "Direct Causal Omission."
      *   *Case B (Administration):* Duty exists (arguably), capacity omitted (no funding) $\rightarrow$ Harm. Coded as "Systemic Context."
      *   *Key Distinction:* Proximity/Agency vs. Structural/Background. The form treats the resident's omission as a *cause* but the administration's omission as a *condition* or *context*.

  3.  **Identify the Implicit Theory of Causation:**
      *   *Metaphysical vs. Normative:* Purely counterfactual theories of omission (e.g., Lewis) often struggle to distinguish between the resident and the admin. If the admin had funded it, the patient wouldn't have died. If the resident had ordered it, the patient wouldn't have died. Both are counterfactually necessary.
      *   *The Form's Choice:* The form distinguishes them. This suggests it's *not* using a purely metaphysical/counterfactual account. It's using a *normative* or *legalistic* account.
      *   *Specific Theory:* It looks like a **Normative Expectation/Proximate Cause** model. It presupposes that causation by omission is not just about "but-for" necessity but about the violation of a *specific, localized duty to act* held by the immediate agent.
      *   *Smuggling Normativity:* Yes, it is smuggling a normative filter (who *should* have acted here?) into a metaphysical label ("causal"). It treats "cause" as a status conferred by role responsibility, not just physical/counterfactual dependency.

  4.  **Reconstruct the Implicit Theory:**
      *   *Name:* "Role-Relative Causal Omission" or "Normative Proximate Omission."
      *   *Core Tenet:* An omission is a *direct cause* only if the omitter had a specific, immediate obligation to act *and* the capacity to do so within the immediate chain of events. Background conditions (like funding) are treated as enabling conditions, not causes, even if they involve omissions (not funding).
      *   *Philosophical Alignment:* Closer to Hart & Honoré (normal conditions vs. abnormalities) or a Legalistic/Proximate Cause view than a Humean/Counterfactual view.

  5.  **Assess Compatibility with Rival Accounts:**
      *   *Counterfactual Theory (Lewis):* Incompatible. Both are but-for causes. The form rejects this symmetry.
      *   *Process Theory (Salmon/Dowe):* Omissions aren't causes anyway (no physical process). But the form *does* call the resident's omission a cause. So it rejects pure process theory too.
      *   *Contrastive Causation (Schaffer):* Maybe compatible if the contrast is "Resident acting vs. Resident omitting" vs. "System normal vs. System broken." But the form explicitly separates them into different fields.
      *   *Conclusion:* The practice is *not* neutral. It commits to a specific, normatively loaded view. It requires a theory that distinguishes between "active agency failure" and "structural enablement failure."

  6.  **Design Changes for a Different View:**
      *   *If we adopted a Pure Counterfactual View:* Merge the fields. Both are "Causal Omissions." Use a weighting system for proximity.
      *   *If we adopted a Systems Safety View (Reason's Swiss Cheese):* Remove the "Direct Causal Omission" label entirely. Call them "Contributing Factors" or "Latent vs. Active Failures." Stop using the word "Cause" for omissions.
      *   *If we adopted a Normative/Justice View:* Explicitly label the admin omission as a "Structural Causal Omission" to acknowledge its causal power but distinct nature.

  7.  **What Would Change My Mind?**
