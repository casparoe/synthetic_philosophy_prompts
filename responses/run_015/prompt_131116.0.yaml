prompt: |-
  Hey — I'm drafting prompts that get into the weeds of causation by omission without just rehashing the "not watering the plant" examples. So here's an institutional practice I want you to think about.

  In hospital morbidity-and-mortality review boards — the M&M conferences — they use a standardized incident form. If a resident forgets to order a routine lab and the patient crashes, that failure gets entered in the field marked "direct causal ommission." But if the crash happens because administration never funded the analyzer — meaning the test literally couldn't be ordered — the form files that under "systemic context," not in the causal-omission box. Both are failures to act; both sit upstream of the harm; yet the institution treats only the bedside failure as causally implicated.

  What view of causation by omission does that coding practice preusppose? Does it assume omissions are only causal when there's an assigned agent-duty at the point of failure, or is it smuggling a normative filter into a metaphysical question? Reconstruct the implicit theory, say whether the practice strictly requires it or is compatible with several rival accounts, and tell me what would have to change in the form's design if that underlying view were replaced.

  Also, please say what would change your mind: which argument or piece of evidence would lead you to think the coding distinction doesn't actually presuppose any particular causal theory, and where is your reasoning most likely to fail?
