      *   *Ambiguity of "Context":* Does "Context" mean "Non-Cause" or "Background Cause"? In common parlance, context shapes outcomes. In strict causation theory, context is often distinct from cause.
      *   *Institutional Reality:* M&M conferences are often about learning, not just blame. The distinction might be pedagogical (focus on what the resident can control) rather than ontological.

