answer: |-
  ### The Scenario

  Elena must file a tax return by Friday. On Monday, she plans to file Tuesday, valuing future peace over present effort. Come Tuesday evening, the same choice faces her: file now or watch TV. The penalty for late filing is fixed; the effort is fixed. Only her distance from the deadline has shrunk. On Monday, future peace outweighs present effort. On Tuesday, the immediate glow of the screen outweighs the abstract future penalty. She knows this will happen. She doesn't forget the penalty. She simply chooses the TV, judging it best in that moment, yet wishes on Wednesday she had bound herself to file.

  ***

  ### The Walkthrough

  **1. The Model (Specification 1)**
  I am using **Quasi-Hyperbolic Discounting** ($\beta-\delta$).
  *   **Functional Form:** $U_t = u_t + \beta \sum_{k=1}^{T} \delta^k u_{t+k}$
  *   **Parameters:** $\beta = 0.5$ (present bias), $\delta = 1$ (no long-term discounting for simplicity).
  *   **Payoffs:**
      *   **Work:** Cost -10 (immediate), Reward +30 (delayed).
      *   **TV:** Benefit +6 (immediate), Reward 0 (delayed).
  *   **Choice Point 1 (Monday/$t=0$):** Both costs and rewards are future.
      *   Work: $\beta(-10) + \beta(30) = 0.5(20) = 10$.
      *   TV: $\beta(6) + 0 = 3$.
      *   **Verdict:** $10 > 3$ (Prefers Work).
  *   **Choice Point 2 (Tuesday/$t=1$):** Cost/Benefit is immediate; Reward is future.
      *   Work: $-10 + \beta(30) = -10 + 15 = 5$.
      *   TV: $6 + 0 = 6$.
      *   **Verdict:** $5 < 6$ (Prefers TV).
  *   **Inequality Flip:** The preference reverses solely due to the change in $\beta$'s application to the immediate period.

  **2. Sophistication (Specification 2)**
  Elena is **sophisticated**. At $t=0$, she calculates the $t=1$ outcome correctly ($5 < 6$). She knows she will choose TV. She does not act against her *current* judgment at any point. At $t=1$, her all-things-considered judgment (incorporating the biased discounting) is that TV is better. She follows this judgment. There is no akrasia *at the moment of action*.

  **3. Welfare and Regret (Specification 3)**
  She ends up **worse off by her own lights**. Why? Because at $t=2$ (Wednesday), the bias recedes. She looks back and prefers the outcome of the $t=0$ plan (Net 10) over the $t=1$ action (Net 6). She would have accepted a commitment device at $t=0$ (e.g., a penalty for not filing) to force the Work option.
  *   *Justification:* We privilege the $t=0$/$t=2$ perspective not by stipulation, but because the agent herself endorses it as her "reflective" self, viewing the $t=1$ preference as a predictable distortion.
  *   *Reader Verdict:* An ordinary reader sees a broken plan and regret, labeling it "weakness of will," even though no judgment was violated *in the moment*.

  **4. The Working Feature & Variants (Specification 4)**
  *   **Working Feature:** **The absence of costless binding commitment.** This allows the gap between the $t=0$ plan and the $t=1$ action to remain unbridged.
  *   **Minimal Variant:** Give Elena a **binding commitment device** at $t=0$ (e.g., she can pay $1 now to make TV impossible tomorrow).
      *   *Breaks:* Verdict (3). She pays $1, works tomorrow, gets Net 9. She is no longer worse off; she solves the timing problem.
  *   **Akratic Sibling:** Add **intrapersonal conflict at $t=1$**. At $t=1$, she calculates Work (5) > TV (6) *but still chooses TV* due to an impulse overriding her calculation.
      *   *Added Feature:* **Compulsion overriding judgment.** This produces genuine akrasia (acting against better judgment), distinguishing it from the sophisticated reversal case.

  **5. Objections (Specification 5)**
  *   **Objector:** The Revealed Preference Economist.
  *   **Objection:** "At $t=1$, she chose TV. Therefore, TV was preferred. There is no 'worse off,' only changing preferences. 'Weakness' is a moralistic label for utility maximization."
  *   **Reply:** "She explicitly regrets the choice at $t=2$ and wished at $t=0$ to prevent it. Preference satisfaction is unstable across time."
  *   **Force:** **Serious.** It challenges whether "welfare" can be defined across conflicting temporal selves without ethical stipulation.

  ***

  ### Settled vs. Contested

  | Claim | Status | Note |
  | :--- | :--- | :--- |
  | Quasi-hyperbolic models generate preference reversals. | **Settled** | Standard behavioral economics consensus. |
  | Sophisticated agents anticipate their own bias. | **Settled** | Standard model assumption (O'Donoghue & Rabin). |
  | The $t=0$ self's preferences define welfare. | **Contested** | Welfare economics debates whose preferences count (Bernheim vs. others). |
  | Acting on a biased preference counts as "weakness of will". | **Contested** | Philosophers disagree if weakness requires acting against *current* judgment. |
  | Commitment devices improve welfare in these cases. | **Settled** | Provided the cost of commitment is low enough. |

