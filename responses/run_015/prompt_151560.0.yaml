      *   **Core Thesis:** The split isn't just holistic vs. analytic (Nisbett style) but about *modal proximity* computation. Tighter social norms $\rightarrow$ false intermediate beliefs seen as more stable (embedded in shared practice) $\rightarrow$ less likely to be classified as "false lemma" $\rightarrow$ more likely to grant knowledge.
      *   **Term:** "Embedded Modal Salience" (tentative).
      *   **Specific Questions:**
          1.  Is this distinct from "culture affects background beliefs"?
          2.  Is this just reliabilism with extra steps?
          3.  Does it make unique empirical predictions?
          4.  Separate settled literature from contested/speculative claims.
          5.  Critique sloppiness (specifically the jump from social norms to counterfactual judgment).
      *   **Constraint:** Do not present the user's framing as consensus. Keep word count in mind (essay is ~1500 words, so feedback should be concise but substantial).

  2.  **Deconstruct the Core Thesis:**
