answer: |-
  ### Part 1: Verdict on Your Distinctions

  **1. *Never-made* vs. *Never-sent* vs. *Never-theirs***
  **Verdict:** Keep them. They are not too cute; they are operational.
  *   **Why:** They force you to categorize the *silence* before you categorize the *record*. Most appraisal forms ask "What is this?" Your distinction asks "What is missing?"
  *   **The Trap:** Do not let this become a taxonomy exercise where you label a collection "Never-theirs" and feel you've solved the ethical problem. Labeling the harm is not fixing the harm. It only survives as a checklist item if it triggers a specific action (e.g., if "Never-theirs," then access restrictions or mandatory contextual note).

  **2. The *Counter-Collection Note***
  **Verdict:** It is a safeguard *only if* it is public and prescriptive.
  *   **The Risk:** If this note lives in your internal file, it is therapeutic guilt. If it lives in the public finding aid, it is a warning label.
  *   **The Fix:** Rename it the **Researcher Warning**. It must not just name the absent; it must tell the researcher *not* to use this collection for specific conclusions (e.g., "Do not use this collection to determine neighborhood demographics"). If you won't put it in the finding aid, don't write it.

  ***

  ### Part 2: The One-Page Decision Procedure

  **Time Budget:** 30 Minutes
  **Goal:** Prevent active harm; document silence; comply with law.

  **STEP 1: The Legal Hard Stop (5 mins)**
  *   **Question:** Does the state retention schedule mandate destruction? Is this public record or private paper?
  *   **Pass:** Schedule allows retention OR record is private.
  *   **Fail:** Schedule mandates destruction.
  *   **Action:** If Fail, decline/destroy. Do not proceed.
  *   **Note:** *This is not a judgment call. This is compliance.*

  **STEP 2: Power & Provenance Check (5 mins)**
  *   **Question:** Who created this, and who is represented in it? Is this a record *by* a community or *about* a community?
  *   **Judgment Call:** You are deciding whose voice counts as "authority."
  *   **Action:** Classify as **Self-Documented** (by the subjects) or **Institutional-Gaze** (by power over subjects).
  *   **Note:** *This is the core values call. It determines the ethical weight of the rest of the process.*

  **STEP 3: The "Never" Classification (5 mins)**
  *   **Question:** Apply your distinction.
      *   **Never-made:** No record exists of this activity/group.
      *   **Never-sent:** Record exists but was kept private/lost.
      *   **Never-theirs:** Record exists but subjects are objects of power (police, courts, welfare).
  *   **Action:** If **Never-theirs**, you must justify why preserving a record of oppression serves the oppressed.
  *   **Note:** *Judgment call dressed as procedure. You are deciding if the historical value outweighs the stigma.*

  **STEP 4: Harm & Risk Assessment (10 mins)**
  *   **Question:** Could accessioning this cause material harm to living people or descendants? (Privacy, stigma, surveillance, harassment).
  *   **Pass:** Risk is negligible or manageable via restriction.
  *   **Fail:** Risk is high, unmanageable, or the collection *is* the harm (e.g., doxxing, surveillance).
  *   **Action:** If Fail, decline offer. Do not pass Go.
  *   **Note:** *This is the non-negotiable ethical brake.*

  **STEP 5: The Researcher Warning (5 mins)**
  *   **Question:** Draft the Counter-Collection Note. Who is missing? Where should researchers look instead? What conclusions are forbidden?
  *   **Action:** If you cannot write this, you do not understand the collection well enough to accession it.
  *   **Note:** *Must be published in the finding aid.*

  **STEP 6: Final Decision**
  *   **Accession:** With restrictions and Warning.
  *   **Decline:** With referral (if safe) or destruction (if mandated).
  *   **Defer:** Kick to Commission (only if political cover is needed for a values call).

  ***

  ### Part 3: Running the Procedure

  #### (a) The Juvenile Court Judge Papers
  *   **Step 1 (Legal):** Case notes usually have strict retention/destruction schedules for privacy. If these are "personal copies" of official records, they are legally precarious. **Warning.**
  *   **Step 2 (Power):** **Institutional-Gaze.** High power (Judge) over low power (Poor/Black families).
  *   **Step 3 (Never):** **Never-theirs.** The families exist only as summaries by the man who decided their fate.
  *   **Step 4 (Harm):** **FAIL.** Sealing for 25 years protects the judge's reputation more than the families (who are likely adults now). Naming it after him centers the oppressor. The risk of re-traumatizing descendants or reinforcing stereotypes about "broken families" is high.
  *   **Step 5 (Warning):** "This collection documents the state's view of these families, not their lives. Do not use for social history."
  *   **Decision:** **DECLINE.**
  *   **Reasoning:** You lack the resources to reprocess this to center the families (e.g., by redacting names or pairing with oral histories). As is, it is a monument to surveillance. The 25-year seal is a control mechanism you should not accept.

  #### (b) The Tenants' Union Shoebox
  *   **Step 1 (Legal):** Private records. No retention schedule. **Pass.**
  *   **Step 2 (Power):** **Self-Documented.** Community organizing.
  *   **Step 3 (Never):** **Never-sent.** Ephemeral material that would otherwise vanish.
  *   **Step 4 (Harm):** **PASS with Conditions.** Fear of name lists is valid.
  *   **Step 5 (Warning):** "Names of members restricted until 2050. Use flyers for rhetoric, not membership rolls."
  *   **Decision:** **ACCESSION.**
  *   **Reasoning:** High historical value, low volume. You must honor the restriction on names (redact or seal that specific folder). This is exactly what you should hold.

  #### (c) The Booking Photographs (70s-90s)
  *   **Step 1 (Legal):** Public records, but privacy laws may restrict commercial use or facial recognition. **Pass (Technically).**
  *   **Step 2 (Power):** **Institutional-Gaze.** Pure state surveillance.
  *   **Step 3 (Never):** **Never-theirs.** Subjects are reduced to criminal suspects.
  *   **Step 4 (Harm):** **HARD FAIL.** This is the worst offer. It digitizes stigma. In the 70s-90s, policing was disproportionately targeted at Black and Brown communities. Putting this online makes these individuals searchable forever, potentially affecting descendants (employment, background checks, facial recognition training data).
  *   **Step 5 (Warning):** "Do not use for identification. Do not publish faces." (If you can't enforce this, the warning is useless).
  *   **Decision:** **DECLINE.**
  *   **Reasoning:** There is no "counter-collection" that balances this. This is not history; it is evidence of state coercion. Holding this makes your archive a partner in that coercion. Do not take it.

  ***

  ### Part 4: Limitations & Break Points

  **What This Procedure Cannot Do:**
  1.  **Fix Structural Silence:** It can identify the "Never-made," but it cannot create those records. You will still end up with an archive of power, just a more honest one.
  2.  **Protect Against Future Tech:** You can restrict access now, but OCR, facial recognition, and data scraping evolve faster than finding aids.
  3.  **Remove Your Bias:** Step 2 (Power & Provenance) relies entirely on *your* perception of power. You might misidentify a "community leader" as a "power broker" or vice versa.

  **Where It Will Misfire:**
  *   **Direction:** It will bias you toward **risk aversion**. You will decline risky collections from marginalized groups (like the Tenants' Union) because the Harm Assessment feels too dangerous. You must fight the urge to protect people by erasing them.
  *   **The "Never-theirs" Trap:** You might start rejecting *all* institutional records because they are "oppressive." You need some of them to hold power accountable. The procedure doesn't tell you *how much* is enough; it only tells you when to stop.

  **Where My Reasoning Breaks:**
  *   **The Argument for "Toxic" Archives:** If you argue that **accountability requires evidence**, my advice on the Judge Papers and Booking Photos fails. If the goal is to prosecute past injustice or prove systemic racism, you *need* the judge's notes and the booking photos. My procedure prioritizes *individual harm* over *structural truth*. If your county is in a reckoning phase, destroying/declining evidence of bias might be the greater evil.
  *   **The Resource Lie:** I assume you can enforce restrictions (like redacting names). With one intern and volunteers, you probably can't. If you can't enforce the restriction, the Harm Assessment is a lie.

  ***

  ### Part 5: The One Step

  If you cut the Legal Check, you lose your job. If you cut the Power Check, you lose the mission. But if you cut the Harm Assessment, you hurt living people. You can survive a lawsuit; you cannot survive causing material damage to a community that trusted you.

  \answer{Harm & Risk Assessment}
