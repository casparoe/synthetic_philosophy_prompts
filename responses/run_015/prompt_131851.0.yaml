      *   **User's Argument:** There is a tension between Schopenhauer's claim that music is the *direct* objectification of the Will (unmediated by forms of representation) and his analysis of melody as successive (bound to time, the *principium individuationis*). If melody is temporal, it's representational, not the thing-in-itself.
