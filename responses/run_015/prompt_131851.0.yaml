      *   *Harmony/Bass:* The bass is the crude striving (inorganic), harmony is the plant/animal, melody is human. This hierarchy mirrors the Grades of Objectification.
      *   *Resolution:* The "directness" is not about escaping time, but about bypassing the *concepts* and *Images* (Ideas). Music doesn't show us a picture of striving (like a painting of a battle); it makes us *feel* striving through tension. Time is the medium, but the *content* is the dynamic of Will, not a representation of an object in time.
