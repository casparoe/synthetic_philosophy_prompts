          *   *The "Smart Mistake":* She might be conflating "computing power" with "complexity" or "information density." Or she might be arguing that base reality is "bare bones" and the simulations are where the *work* happens (like a server farm running virtual machines that do the actual processing).
          *   *Better Interpretation for the Novel:* She could be arguing that base reality is "simple" (low entropy, low detail) and simulations are where complexity emerges. But strictly speaking, regarding *computing power*, the base must be superior.
