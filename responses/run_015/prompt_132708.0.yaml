          *   Second, and more crucially, "We haven't gone extinct" is a category error. The proposition isn't "Are we extinct *right now*?" It's "Will we go extinct *before* reaching posthuman capacity?" We exist *now*, but we haven't reached the posthuman stage yet. Claiming we haven't gone extinct *yet* doesn't prove we *won't* go extinct before reaching the tech.
          *   Third, she ignores the second proposition (Posthumans don't run sims). Even if we survive to become posthuman, if *they* choose not to run sims, we are still in base reality.
