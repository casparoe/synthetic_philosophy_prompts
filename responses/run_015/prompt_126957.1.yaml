  10. **Final Polish:** Ensure the distinction between *ontological* (is it real?) and *normative* (is it bad?) is clear. (Self-Correction: Make sure not to dismiss the policy angle entirely, just prioritize it lower).

  *(Self-Correction during drafting)*: I should emphasize that the "Phil of Science" person is the secret weapon here. They can handle the "natural kinds" vs "social kinds" debate which is central to whether collapse is "real."

  *(Final thought on the "Enviro Studies" skeptic)*: Their point about "morality tale" is essentially that 'collapse' is a performative concept. It creates the reality it describes. This needs to be central.

