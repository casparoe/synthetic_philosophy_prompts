  6.  **Final Polish:** Check against the user's specific questions (Fair summary? Line up? Conflations? Conclusion follow? Sociology?). Ensure each is answered clearly. (This matches the structure of the final output).

  7.  *(Final check of Rawls)*: Does Rawls say "nobody deserves more income"? He says no one deserves their *place in the distribution* based on native endowment. But he allows inequalities. The host's "full equality" claim is definitely the biggest error.

  8.  *(Final check of Meritocracy)*: Michael Young's satire is the origin. It was meant to be a warning. The host's definition of "moral worth" is closer to a religious or Kantian view than the technocratic view Young described.

