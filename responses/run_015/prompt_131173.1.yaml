      *   *Section 1: Definitions (Merit & Desert).* Clarify that meritocracy isn't usually about "moral worth" (Kant) but "contribution." Explain the distinction between moral desert and legitimate expectations.
      *   *Section 2: Rawls.* Confirm the "moral arbitrariness" point is accurate. Correct the "full equality" conclusion (Difference Principle).
      *   *Section 3: Nozick & The Host's Rebuttal.* Explain Nozick's entitlement theory. Address the "social construction" rebuttal. This is the weak link. Even if society values a talent, I still own the muscle/brain doing it.
      *   *Section 4: The "Sociology" Insight.* Validate the user's feeling. The host moved from normative ethics (what *should* be) to descriptive sociology (how society *is*).
      *   *Conclusion:* Summarize the verdict. Good intro, messy finish.

  5.  **Refining the Nuance (Self-Correction during drafting):**
