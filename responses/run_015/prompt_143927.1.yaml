answer: |-
  This is a sharp reconstruction of a tension that has bothered Mill scholars for a century. Your study group has correctly identified a surface-level contradiction, but the "slip" lies in attributing a specific moral framework to Mill that he doesn't actually hold.

  To save Mill's coherence while keeping his anti-inheritance and pro-cooperative stance, you should **reject Premise (2)** (and consequently soften Premise (1)).

  Here is the breakdown of why that premise fails, the cost of giving it up, and the hidden distinction that resolves the tension.

  ### 1. Which Premise to Reject?
  **Reject Premise (2): "If labor-desert is the rule, then any income source that doesn't match your effort is unfair."**

  Your group is treating Mill as if he were a **Lockean Labor-Desert Theorist** (i.e., property is a natural right derived strictly from mixing labor with resources). If Mill were a strict Lockean, your argument would be fatal: he would indeed be forced to redistribute natural talents or admit hypocrisy.

  However, Mill is a **Utilitarian**. In *Principles of Political Economy* (Book II, Chapter 1), Mill explicitly states that property rights are not natural or absolute; they are justified solely by **expediency** (social utility).

  *   **Why (2) is wrong:** Mill does not argue that inheritance is unjust *because* it violates a metaphysical law of labor-desert. He argues it is unjust because it creates a class of idle rich, which is bad for social utility and economic efficiency.
  *   **The Correction:** Mill's rule isn't "Income must match effort." His rule is "Property arrangements should maximize human development and social welfare." Sometimes that aligns with labor-desert (because it incentivizes work), but not always.

  ### 2. What Does Giving This Up Cost?
  Admitting that Premise (2) is false costs you the idea that Mill is a **consistent retributive justice theorist**, but it saves him as a **consistent liberal utilitarian**.

  *   **The Cost:** You must acknowledge that Mill is not arguing from pure moral symmetry. He is willing to tolerate some "unearned" advantages if interfering with them causes more harm than good. This makes his position more pragmatic and less philosophically "clean."
  *   **The Gain:** You save his distinction between **liberty** and **property**. If you enforce Premise (2), you have to redistribute natural talents (eugenics or enslavement of the talented), which violates Mill's core commitment to individual liberty in *On Liberty*. By rejecting (2), you allow Mill to say: "Redistributing capital increases utility; redistributing talents destroys liberty and thus decreases utility."

  ### 3. The Hidden Distinction: Internal Powers vs. External Means
  There is a distinction in Mill's text that your argument overlooks, which allows him to attack inherited capital without attacking inherited talent. It is the distinction between **Personal Endowments** and **Command over Others.**

  **A. Internal vs. External Assets**
  *   **Talents (Internal):** For Mill, talents are inseparable from the person. To "level" natural talent would require violating the self-ownership of the individual. Mill champions the "free development of individuality." Suppressing a talented person's output to make them equal to a less talented person stifles the progress of the species.
  *   **Capital (External):** Capital is external to the person. Regulating its transfer (inheritance) does not violate the *personhood* of the heir or the bequeather in the same way. Mill argues society has a rightful claim to regulate the *devolution* of external property upon death because the owner no longer exists to have a will.

  **B. Power Over Self vs. Power Over Others**
  This is the crucial moral wedge in *Principles* (Book II, Chapter 1, §5).
  *   **Talent:** A talented person produces more value through their *own* labor. Mill sees this as generally beneficial; it raises the general standard of excellence.
  *   **Inherited Capital:** Large inherited capital allows the owner to live without labor *and* to command the labor of others. Mill views this as socially corrosive. It creates a relationship of dependency and mastership, which is incompatible with the dignity of free citizens.

  **Therefore, Mill's Coherent Position:**
  Mill is not demanding that everyone start with equal *assets* (which would require redistributing talent). He is demanding that no one start with enough *external power* to opt out of the social contract of labor entirely.

  He supports public education (leveling the talent advantage via opportunity) but opposes confiscating the talent itself. He supports limiting inheritance (leveling the capital advantage) because large capital confers *political and social power* that talent alone does not.

  ### Summary for Your Group
  To fix the argument without destroying Mill:

  1.  **Change Premise (1):** Mill doesn't say property is *only* legit via labor; he says property is justified by utility, and labor is the *best* utility-based justification for most property.
  2.  **Change Premise (4):** Consistency does not force him to level talents. Consistency forces him to maximize liberty and utility. Leveling talents destroys liberty; limiting inheritance protects it.
  3.  **The Hidden Distinction:** **Jurisdiction.** The state has jurisdiction over the transfer of external wealth upon death (since the owner is gone); the state does not have jurisdiction over the internal biological lottery of birth without violating the living person's liberty.

  Mill isn't incoherent; he is prioritizing **Liberty** over **Equality** when the two conflict, but prioritizing **Equality of Opportunity** over **Equality of Outcome** regarding external capital. He wants to prevent the *accumulation of power*, not the *accumulation of ability*.
