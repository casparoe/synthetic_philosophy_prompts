prompt: |-
  hey, im prepping for a seminar talk im giving tuesday in our dept's logic and social choice working group. im arguing that the discursive dilemma in judgment aggregation isnt really a paradox once you drop the independence axiom and replace it with what im calling reasoning-trace coherence — basically committee members dont hold premises in isolation but carry implicit weights over how they arrived there, so a recursive belief-revision pool can keep consistency without collapsing into conclusion-based authoritarianism. the audience is mostly social-choice people who live for arrow-style impossibility results, plus two formal epistemologists who think applying aggregation to normative ethics is a category mistake, and one virtue-ethics grad student who says im treating moral reasoning like a spreadsheet. i need a q&a prep sheet: the objections theyll actually throw, ordered by damage, phrased in there own vocabulary, each with a two-minute reply and an honest note on where that reply is weakest. also tell me what i should concede up front, and include the one question im praying nobody asks. please dont ask me for bibliographies, reading lists, or citations — i need answers i can deliver from memory without searching. also im worried my reasoning-trace idea accidentally smuggles in virtue-ethical or situationist assumptions about practical reasoning; if that sounds like im misusing something from those literatures, flag it, but dont quote anyone.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User's Request:**
      *   **Context:** Seminar talk in a Logic and Social Choice working group.
      *   **Topic:** Judgment Aggregation (JA), specifically the Discursive Dilemma (Doctrinal Paradox).
      *   **Core Argument:** The dilemma isn't a paradox if we drop the Independence axiom and replace it with "Reasoning-Trace Coherence" (RTC). Members carry implicit weights on *how* they arrived at judgments. A recursive belief-revision pool maintains consistency without conclusion-based dictatorship.
      *   **Audience:**
          1.  Social Choice Theorists (love Arrow-style impossibility results).
          2.  Formal Epistemologists (think applying aggregation to normative ethics is a category mistake).
          3.  Virtue Ethics Grad Student (thinks moral reasoning isn't a spreadsheet).
      *   **Deliverable:** Q&A prep sheet.
          *   Objections ordered by damage potential.
          *   Phrased in the audience's vocabulary.
