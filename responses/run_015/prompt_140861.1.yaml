answer: |-
  Your gut is right to be skeptical. The summary you received captures the *phenomenon* accurately but botches the *explanation* and the *implications*. It presents a specific, early hypothesis (the "Blame Hypothesis") as if it were the settled conclusion of the field, and it makes a semantic claim that almost no philosopher of action accepts.

  Here is a breakdown of what a working researcher in experimental philosophy (X-Phi) or philosophy of action would say about that text, followed by an analysis of your two variants.

  ### Part 1: Grading the Book's Summary

  If you showed this passage to a specialist, here is how they would mark it up:

  **1. The Setup and Data (Accurate)**
  *   **Claim:** The description of the Chairman vignette (profit vs. environment, harm vs. help) and the resulting asymmetry (harm = intentional, help = not intentional) is correct.
  *   **Status:** **Accepted.** This is the robust empirical finding known as the "Knobe Effect" or the "Side-Effect Effect." It has been replicated many times.
  *   **Claim:** The effect extends to other concepts like causation.
  *   **Status:** **Accepted.** Researchers have found similar asymmetries in judgments about causation, deciding, and even freedom.

  **2. The Explanation (Oversimplified to Wrong)**
  *   **Claim:** "The only thing doing the work is disapproval."
  *   **Status:** **Contested.** While moral valence is a major driver, later research suggests it's broader than just "disapproval." It tracks *normative expectations* (more on this in your variants).
  *   **Claim:** "Knobe's conclusion is that 'he did it intentionally' means nothing more than 'he's to blame for it'."
  *   **Status:** **Wrong.** This is the biggest error in the passage. Joshua Knobe does not argue that the *meaning* of "intentional" is identical to "blameworthy." He argues that moral considerations are *part of the cognitive machinery* we use to apply the concept. There is a massive difference between saying "Moral judgment influences whether we call it intentional" (the mainstream view) and "Intentional *just means* blameworthy" (semantic reductionism). The latter implies that if you aren't to blame, you literally didn't do it intentionally, which collapses the distinction between accident and intent.

  **3. The Moral for Philosophy (Too Strong)**
  *   **Claim:** "Armchair intuitions are just moral reactions wearing a descriptive costume."
  *   **Status:** **Debated.** This is a "debunking" conclusion. While X-Phi shows that intuitions are sensitive to morally irrelevant factors, most philosophers don't conclude that intuitions are *useless*. Instead, they conclude that our folk concepts (like "intention") are inherently normative. The "costume" metaphor suggests we are being tricked; Knobe suggests the "costume" is actually part of the outfit.

  ### Part 2: Why "Nothing More Than Blame" Fails

  The book's claim is a category error. It confuses the **conditions of application** with **semantic meaning**.

  Consider the word "dangerous." Whether something is "dangerous" depends on our interest in safety (a value). But "dangerous" doesn't *mean* "bad." It means "likely to cause harm." Similarly, most philosophers argue that "intentional" means something like "acted with a specific plan and awareness," but our *willingness to attribute* that plan is triggered by norm violations.

  If "intentional" meant *nothing more than* "blameworthy," then:
  1.  We couldn't say someone did something intentionally but wasn't to blame (e.g., self-defense).
  2.  We couldn't say someone was to blame for something they did unintentionally (e.g., negligence).

  We clearly do both. Therefore, the concepts are distinct, even if they influence each other.

  ### Part 3: Analyzing Your Variants

  Your variants are excellent because they track the actual history of the research. They isolate the variables that distinguish the "Blame Account" (the book's view) from the "Normative Account" (the current consensus).

  #### Variant 1: The Pointless Company Rule
  *   **The Setup:** The side effect is breaking a non-moral, arbitrary rule (e.g., "wearing blue socks on Tuesdays"). The Chairman foresees it, doesn't care, and proceeds for profit.
  *   **The Book's Prediction (Blame Account):** Since there is no *moral* blame or praise involved, there should be **no asymmetry**. People should judge intentionality the same way for breaking the rule as for following it.
  *   **The Rival Prediction (Normative Expectations Account):** Asymmetry depends on whether a *norm* is violated, not just a moral one. If the rule is seen as a standard to be followed, violating it is "bad" in a normative sense.
  *   **The Actual Data:** Studies (including by Knobe and others) show that **asymmetry often persists** even for non-moral norms (like etiquette or corporate policy), provided the subjects view the rule as something that *ought* to be followed. However, if the rule is truly arbitrary and carries no normative weight (nobody thinks you *should* follow it), the asymmetry disappears.
  *   **The Verdict:** This hurts the book's "moral blame" specific claim. It suggests the effect isn't about *morality* per se, but about **norm violation**. The book says it's about "disapproval" (moral); the data says it's about "deviance" (normative).

  #### Variant 2: Swapping "Intentionally" for "Knowingly"
  *   **The Setup:** You ask, "Did the Chairman *knowingly* harm/help the environment?" rather than "intentionally."
  *   **The Book's Prediction (Blame Account):** If our descriptive judgments are just moral reactions in disguise, then "knowingly" should show the same asymmetry. We should say he "knowingly" harmed but not "knowingly" helped, because the blame is coloring the descriptive fact.
  *   **The Rival Prediction (Folk Psychology Account):** "Knowingly" refers to a cognitive state (awareness). "Intentionally" refers to a volitional state (aim/choice). Moral judgment should influence the volitional judgment much more than the cognitive one.
  *   **The Actual Data:** This is the strongest evidence against the book's summary. When researchers swap in "knowingly," **the asymmetry largely vanishes.** Most people say the Chairman *knowingly* brought about the side effect in both the help and harm cases. He knew what was happening in both scenarios; he just only *intended* it (in the folk sense) when it was bad.
  *   **The Verdict:** This is a fatal blow to the "nothing more than blame" theory. If "intentional" just meant "blameworthy," then "knowingly" (a purely descriptive term) shouldn't be immune. The fact that "knowingly" remains stable while "intentionally" shifts proves that the Knobe Effect is specific to the concept of **agency and intent**, not a general haze of moral bias covering all descriptive language.

  ### Part 4: Does the "Moral for Philosophy" Survive?

  Once we fix the mistakes, does the book's final moral hold water?
  *"Armchair intuitions are just moral reactions wearing a descriptive costume."*

  **Corrected Moral:** "Armchair intuitions about action are not purely descriptive; they are inextricably linked to our normative expectations."

  Does this debunk armchair philosophy?
  1.  **No, not entirely.** It doesn't mean intuitions are worthless. It means philosophers cannot assume their concepts (like "intentional") are purely neutral, mechanical descriptors. They are "thick" concepts (like "cruel" or "brave") that blend fact and value.
  2.  **Yes, in a specific way.** It does debunk the idea that you can figure out the nature of "intentional action" just by sitting in a chair and thinking about a neutral case. You have to account for the fact that human psychology treats norm-violation as a marker for agency.

  ### Summary Checklist

  | Claim in Book | Specialist Verdict | Why? |
  | :--- | :--- | :--- |
  | **The data is real.** | **Accept.** | The asymmetry is robust and replicated. |
  | **It's caused by moral disapproval.** | **Revise.** | It's caused by *normative* deviation (moral or conventional). |
  | **"Intentional" = "To Blame".** | **Reject.** | Semantic reductionism. We can blame unintentional acts and excuse intentional ones. |
  | **"Knowingly" would show the same effect.** | **Reject.** | Knowledge judgments are mostly symmetrical; intention judgments are not. |
  | **Armchair intuition is useless.** | **Revise.** | Intuitions reveal that our concepts are normative, not that they are broken. |

  **Bottom Line:** Your friend's book is selling a dramatic, simplified story. The reality is more interesting: it's not that we are too moral to see the facts; it's that our concept of "doing something on purpose" is built to detect norm violations. Your second variant (the "knowingly" swap) is the standard control condition used in the literature to prove exactly that point. If the book's author can't distinguish between "knowingly" and "intentionally," they haven't read the primary literature closely.
