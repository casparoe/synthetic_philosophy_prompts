      *   **Goal:** Understand Updateless Decision Theory (UDT) translated into mechanism design vocabulary.
      *   **Specific Tasks:**
          1.  Translate the UDT thesis into mechanism design terms.
          2.  Test the translation on four standard cases (Newcomb, Transparent Newcomb, Counterfactual Mugging, Hitchhiker).
          3.  Clarify the exact meaning of "updatelessness" (three readings provided).
          4.  Analyze a specific novel case: "Decoy Query" (Predictor queries the agent on a counterfactual input).
          5.  Report the "Residue" (what translates well, what requires modification, what has no counterpart).
          6.  Address the "Load-Bearing Point": Is the exogeneity of the type distribution a discipline or a blindness?
      *   **Tone:** Precise, technical, no fluff, respectful of the user's expertise. Avoid introductory explanations of standard game theory.

  2.  **Deconstruct UDT into Mechanism Design Terms:**
      *   *UDT Core:* Choose a policy $\pi: \text{Observations} \to \text{Actions}$ to maximize expected utility over the prior distribution of observations/world states, *before* observing the specific realization. Do not condition on the observation when evaluating the policy.
      *   *Mechanism Design Equivalent:*
          *   Agent = Mechanism Designer (of their own strategy).
          *   Type $\theta$ = Observation/Input to the decision function.
          *   Strategy $s(\theta)$ = Allocation rule/Policy.
          *   Predictor/Environment = The "Principal" or the "World Game" that sets payoffs based on $s(\cdot)$.
          *   Ex Ante IC = The optimization criterion.
          *   Interim/Ex Post IC = What is rejected (sequential rationality).
      *   *Translation:* UDT asserts that the agent should select a strategy $s: \Theta \to A$ to maximize $\mathbb{E}_{\theta \sim F}[U(s(\theta), \text{World}(s))]$, treating the choice of $s$ as a commitment device made *before* $\theta$ is realized. Crucially, the "World" payoff depends on the *function* $s$, not just the realized action $s(\theta)$.

  3.  **Address the Three Readings of Updatelessness:**
      *   *Reading 1 (Refuse Interim Evaluation):* Maximizes ex ante utility, ignores interim incentives. This is close but implies time inconsistency is the only issue.
      *   *Reading 2 (Refuse Indexical Conditioning):* Scores strategy over all inputs weighted by prior. This is the mathematical implementation.
      *   *Reading 3 (Agent as Function):* Identifies the agent with the map $\Theta \to A$, not the pair $(\theta, a)$.
      *   *Verdict:* Reading 3 is the ontological claim; Reading 2 is the operational consequence; Reading 1 is the normative implication. In MD terms, this means the "Type" is not private information held by the agent *against* the principal, but an input to the algorithm that the principal (Predictor) can anticipate globally.

  4.  **Test on Four Cases:**
      *   *Newcomb (Opaque):* Standard. Policy $\pi(\text{see box}) \to \text{action}$. Predictor fills based on $\pi$. UDT: One-box. MD Translation: Ex ante optimal contract.
      *   *Transparent Newcomb:* See content. CDT two-boxes. UDT one-boxes (if predictor simulated the seeing). MD Translation: Sequential rationality fails. The "type" (seeing full) is correlated with the action on the counterfactual type (seeing empty).
      *   *Counterfactual Mugging:* Coin flip (Head/Tail). If Head, pay 100. If Tail, get 10000 *if* you would have paid on Head. UDT: Pay on Head (ex ante optimal). MD Translation: Ex ante IC binds, Interim IC violated.
      *   *Hitchhiker:* Driver predicts payment. If predict no-pay, don't drive. UDT: Pay upon arrival. MD Translation: Commitment to transfer rule contingent on arrival, even if arrival makes payment costly.

  5.  **Analyze the "Decoy Query" Case (The User's Novel Case):**
      *   *Setup:* Predictor queries $s(\theta_{\text{decoy}})$. Real type is $\theta_{\text{real}}$. Payoff depends on $s(\theta_{\text{decoy}})$. Agent knows they are at $\theta_{\text{real}}$.
      *   *UDT Verdict:* $s(\theta_{\text{decoy}})$ must be One-Box. Why? Because the objective function is $\sum P(\theta) U(\text{World}(s), s(\theta))$. The term for $\theta_{\text{decoy}}$ has zero payoff *for that branch*, but the *World* term (box content at $\theta_{\text{real}}$) depends on $s(\theta_{\text{decoy}})$.
      *   *MD Translation:* This looks like an off-path belief constraint or a commitment to an allocation rule at an unreached information set.
      *   *Distinction:* In MD, off-path behavior usually matters for *incentives* of other players. Here, it matters for the *state of the world* determined by a Predictor reading the function.
      *   *Verdict:* UDT demands $s(\theta_{\text{decoy}})$ be optimized for the global objective, even if $\theta_{\text{decoy}}$ has probability 0 or is known not to be realized. This is "logical correlation" rather than "probabilistic correlation."

  6.  **The Residue Report (Three Buckets):**
      *   *Bucket 1 (No Loss):* Ex ante optimization, commitment problems, time inconsistency.
      *   *Bucket 2 (Alteration Required):* The nature of "Type." In MD, types are private info. In UDT, types are inputs to a public function (logically). The "Principal" in UDT is the logical structure of the world, not a separate strategic actor.
      *   *Bucket 3 (No Counterpart):*
          1.  *Algorithm Instantiation:* "I am one instance of a function." MD assumes a single player per seat. UDT allows logical correlation between distinct physical instantiations of the same algorithm.
          2.  *Prior over Own Outputs:* MD takes strategies as choice variables. UDT treats the output of the computation as a random variable correlated with the world state *before* the computation is "run" (logical uncertainty).

  7.  **The Load-Bearing Point (Exogeneity of Types):**
      *   *MD View:* $F$ is exogenous.
      *   *UDT View:* The "probability" of the world state depends on the strategy chosen. $P(\text{World} | \text{Strategy})$.
      *   *Analysis:* MD assumes the environment doesn't read the strategy *function*, only the realized action (unless signaling). Newcomb violates this. The Predictor makes the Type distribution (or Payoff structure) endogenous to the Strategy choice.
      *   *Verdict:* It's not just a modeling choice; it's an ontological disagreement about whether the environment can access the *map* vs. the *territory*. MD assumes Map is private/irrelevant to Nature. UDT assumes Nature reads the Map.

  8.  **Drafting the Response (Iterative Refinement):**
      *   *Constraint Check:* Use the user's vocabulary (allocation rules, IC, sequential rationality). Don't explain BNE.
      *   *Tone:* Professional, dense, precise.
      *   *Structure:* Follow the prompt's sections (Translation, Cases, Readings, Decoy Case, Residue, Load-Bearing).
      *   *Refining the Decoy Case:* This is the crux. In MD, if an info set is unreached, sequential rationality doesn't constrain it unless beliefs do. But here, the *Predictor* constrains it. This looks like a "contractible action" on an off-path node.
      *   *Refining the Residue:* Be sharp on "Logical Correlation" vs "Stochastic Correlation."
      *   *Refining the Load-Bearing:* The key is *endogeneity of the payoff structure to the strategy function*.

  9.  **Final Polish:** Check against the "Three Readings" question. Ensure I explicitly pick one or explain the hierarchy. (Reading 3 is the root, 2 is the math, 1 is the norm). Ensure the Decoy case gets specific treatment on whether the verdict is determinate. (Yes, UDT says optimize the decoy output for the real payoff).

  *(Self-Correction during drafting)*: I need to be careful not to conflate FDT and UDT. The prompt asks to flag where they come apart but keep UDT as subject. In the Decoy case, they might align, but the *reasoning* differs (logical vs functional). I will focus on UDT's "policy selection" framing.
  Also, ensure the distinction between "Type" in MD (private info) and "Input" in UDT (observation) is clear. In UDT, the "Type" is often the *situation*, but the *Strategy* is the object of evaluation.

