answer: |-
  Here is a specific, nuanced scenario that isolates the tension between **artistic verisimilitude** and **intergenerational narrative stewardship**.

  ### The Scenario: The "Kitchen Table Cynicism" Scene

  **The Subject:** Dr. Aris Thorne (deceased), a mid-20th-century public intellectual and humanitarian known for his boundless, almost saintly optimism. His public letters and speeches consistently argue that "structural change is inevitable if we remain steadfast."

  **The Descendant:** Elena Thorne (74), his daughter. She spent her life running a foundation based on her father's philosophy. She was 12 years old at the time of the film's pivotal scene.

  **The Invented Scene:**
  The biopic depicts a rainy evening in 1968. The camera is tight on Dr. Thorne and 12-year-old Elena at the kitchen table. There is no record of this conversation (no diary entry, no witness). However, the historical record shows Thorne was under immense financial and political pressure that week, so the *context* is accurate.

  In the film, Thorne looks at his daughter and says:
  > *"Don't believe the speeches, Ellie. People don't want justice. They want a show. We give them the show, we get the check, and maybe, if we're lucky, a little justice slips in the back door. But never tell them I said that."*

  **The Technical Loophole:**
  The screenwriters argue this is "emotional truth." There is no transcript proving he *didn't* say it. In fact, private correspondence suggests he was privately exhausted. Legally, this is not defamation; it is a plausible interpretation of a private moment that aligns with his known stress levels. It makes the character more "cinematically complex."

  **The Specific Harm to the Descendant:**
  Elena knows the *tone* of her father's voice. The actor has nailed the cadence, the timbre, the specific way he paused before speaking. When she watches the film, she hears her father's voice speaking words he never spoke.

  The harm is not that the film makes him look "bad" (cynicism can be compelling). The harm is that it **retroactively alters the nature of Elena's own childhood memory.**

  1.  **Memory Colonization:** Elena's actual memory is of a father who protected her from his burdens. He shielded her from his exhaustion to let her believe in the cause. By inventing a scene where he *shares* that cynicism with her, the film suggests she was complicit in his performative hypocrisy. It rewrites her role in the family history from "protected innocent" to "co-conspirator."
  2.  **The Erosion of Lived Authority:** Elena is now elderly. Her authority in the non-profit sector rests on her status as the keeper of Thorne's authentic legacy. When interviewers ask her about the film, they treat the movie's "dramatic truth" as equal weight to her lived memory. The film grants the screenwriter **narrative ownership** over a moment that belongs to her biographical timeline.
  3.  **The Voice as Evidence:** Because the performance is so good, audiences (and donors) begin to treat the quote as real. Elena finds herself arguing against a ghost. She isn't fighting a factual error (like a wrong date); she is fighting a **moral reclassification**. She is forced to defend her father's sincerity against a scene that admits sincerity didn't exist, without being able to prove the negative.

  ### The Conceptual Issue: Inherited Moral Integrity

  This moves beyond "accuracy" into the realm of **Posthumous Moral Rights** (a concept more recognized in European *droit moral* than US law, but ethically relevant everywhere).

  The tension here is about whether a descendant has a **stewardship right** over the *nuance* of an ancestor's character, specifically regarding private interactions that involve the descendant.

  *   **The Filmmaker's Claim:** The dead belong to the culture. We use available facts to construct a narrative that explains their public impact. If private cynicism explains public action, we are justified in dramatizing it.
  *   **The Descendant's Claim:** I am the only living repository of the *context* of his private life. By inserting me into a fictionalized exchange, you are not just dramatizing him; you are dramatizing *me* without consent. You are claiming ownership over my memory of his voice.

  ### Why Standard Defenses Fail Here

  Usually, the defense is "This is art, not history." But in this specific "in the weeds" scenario, the film blurs that line intentionally.

  1.  **The "Based on a True Story" Contract:** The marketing implies a fidelity to the *spirit* of the people. If the spirit of the father was "protection of the child," and the scene violates that protection for the sake of drama, the film has broken the emotional contract, even if it kept the factual one.
  2.  **The "No Contradiction" Fallacy:** Just because a conversation *could* have happened doesn't mean inventing it is neutral. Inventing a private moment where none existed is an act of **ontological vandalism**. It creates a new "fact" in the cultural consciousness that crowds out the actual silence that occurred.
  3.  **The Harm of Plausibility:** If the film had him say something outrageous (e.g., a crime), Elena could easily debunk it. Because the sentiment is *plausible* (he was tired), it is harder to fight. It creates a "fog of doubt" around his legacy that the descendant must spend their remaining years clearing.

  ### The Core Ethical Question

  Does the public's right to a "complex" narrative about a public figure supersede a living descendant's right to the **integrity of their shared private history**?

  When a screenwriter invents a line of dialogue spoken *to* a living person (now elderly), they are effectively ghostwriting that person's autobiography. They are asserting that their interpretation of the dead father's psychology is more valuable than the living daughter's memory of the actual event. The injury is the **dispossession of the descendant's own past.**
