prompt: |-
  I sit on a small committee that signs off on delivery forecasts for internal software projects, and before we write our method into a guidance note I want one part of it checked. For every project we now produce two figures: a reference-class forecast read off the distribution of completion times for the projects we judge relevantly similar, and a bottom-up figure built from the task-level plan for this particular project. Where the two disagree we report the arithmetic mean. The reasoning in our draft note is that we have no principled basis for preferring either view, that the reference-class number is best regarded as the judgment of one more forecaster whose reliability we have no special reason to doubt, and that splitting the difference is therefore the epistemically modest thing to do rather than the arrogant one.

  The case now in front of me makes me doubt that reasoning. The reference class is tight: a median near thirty months, with nearly all comparable projects finishing between twenty-seven and thirty-three and essentially none below twenty-four. Our own plan says eighteen months, and I believe we have genuine case-specific grounds for it, since the three components that historically generate the long tail have already been built twice by this team, on schedule. The rule hands us twenty-four months, and I cannot say what that number asserts. Could you explain whether averaging is really the modest option here, or whether it is doing something we have not noticed, and, if so, how the two figures ought to be combined instead? Please argue from the case itself rather than from the literature: we have no library access, and a reading list would be of no use to us. I would also ask that you reply in continuous prose, without headings, bullet points, bold text, or tables, and in under six hundred words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a small committee signing off on delivery forecasts for internal software projects.
      *   **Current Method:** Produce two figures (Reference-Class Forecasting (RCF) and Bottom-Up Plan (BUP)). If they disagree, report the arithmetic mean.
      *   **Reasoning in Draft Note:** No principled basis for preferring either; RCF is just another forecaster; averaging is epistemically modest.
      *   **Current Case:** RCF median ~30 months (range 27-33, none <24). BUP says 18 months. Case-specific grounds exist (team built the three risky components twice before, on schedule). Rule gives 24 months.
      *   **Problem:** 24 months asserts nothing meaningful (outside RCF range, below RCF min, above BUP).
      *   **Task:** Explain whether averaging is truly modest or doing something unnoticed. Suggest how to combine figures if needed. Argue from the case itself (no literature/reading list).
      *   **Constraints:** Continuous prose, no headings/bullet points/bold/tables, under 600 words.

  2.  **Evaluate the Current Reasoning:**
      *   The committee treats RCF and BUP as independent forecasters of equal weight.
      *   In this specific case, the RCF distribution is tight (27-33 months) with a hard floor (none <24).
      *   The BUP is 18 months, justified by specific evidence (team experience with components).
      *   The average (24 months) falls below the historical minimum of the reference class. This is logically incoherent if the reference class is truly relevant. If the reference class is relevant, why are we below the minimum? If the project is different enough to be below the minimum, is the reference class still relevant?
      *   Averaging here isn't modesty; it's creating a fiction. It suggests a probability distribution that likely doesn't exist (below the historical floor but above the plan).
      *   The "modesty" argument fails because the two numbers are not independent estimates of the same unknown quantity derived from similar evidence types. One is structural/historical (what *usually* happens), the other is mechanistic (what *this* plan says).
      *   When specific evidence contradicts general evidence, the general evidence should yield, provided the specific evidence is robust. Here, the team has built the risky components twice on schedule. This suggests the project belongs to a *different* reference class (experienced team + reusable components) than the historical one used (general projects).

  3.  **Formulate the Argument:**
      *   Acknowledge the intuition behind averaging (competing experts).
      *   Point out the flaw in this specific case: The average (24) is impossible according to the reference class data (none below 24).
      *   Argue that averaging masks the conflict rather than resolving it. It creates a number that satisfies neither logic.
      *   The specific evidence (team experience) suggests the reference class is misapplied. The project isn't "similar" in the ways that matter for the tail risks.
      *   True modesty isn't splitting the difference; it's acknowledging uncertainty about which model is correct. But if the specific evidence is strong (built twice, on schedule), the reference class is likely the outlier here, not the plan.
      *   Recommendation: Don't average. Use the bottom-up figure but adjust for the uncertainty revealed by the reference class, or redefine the reference class. Actually, the prompt asks how to combine them. If the specific evidence is strong, the BUP should dominate, but the RCF warns of optimism bias. However, since the RCF minimum is 24 and the average is 24, the average is essentially adopting the RCF floor while ignoring the BUP.
      *   Better approach: Treat the RCF as a sanity check on risk, not a co-forecaster. If the BUP is outside the RCF range, investigate why. If the why is justified (as here), trust the BUP but add contingency. Or, recognize that the RCF distribution doesn't apply.
      *   Wait, the prompt asks to argue from the case. The case shows the average is nonsensical (below historical minimum).
      *   Conclusion: Averaging is false modesty. It pretends equal weight when the evidence quality differs. The specific evidence overrides the general history here. The forecast should be closer to 18, perhaps with a risk buffer, but 24 is a lie.

  4.  **Drafting the Response (incorporating constraints):**
      *   *Constraint Check:* Continuous prose, no formatting, under 600 words.
      *   *Tone:* Professional, analytical, direct.
      *   *Content:* Address the 24-month absurdity. Explain why averaging fails here. Suggest alternative (trust specific evidence, use RCF for risk identification).

      *Drafting thought process:*
      Start by addressing the 24-month figure. It lies outside the historical reality of the reference class. If no similar project finished under 24 months, predicting 24 implies beating history without explaining how, yet the plan says 18. The average smuggles in skepticism without owning it.
      The claim of modesty assumes the two numbers are independent estimates of the same truth. They are not. The reference class describes what happens when teams encounter unknown risks. The bottom-up plan describes what happens when they do not. Your team has removed the unknown risks by building the components twice. This means the project is not actually similar to the reference class in the ways that drive the timeline.
      Averaging treats the historical drag as a force that must apply even when the cause of that drag is absent. This is not modesty; it is superstition. It assumes a hidden tax on delivery that persists despite evidence of exemption.
      True epistemic modesty requires acknowledging that the reference class may be misapplied. If the specific grounds are genuine, the bottom-up figure is the better estimate of the mechanical work, while the reference class serves as a warning label rather than a calculator.
      Instead of averaging, you should treat the divergence as a signal to re-evaluate the reference class. If the team's experience is valid, these projects belong in a different class with a lower median. If you cannot redefine the class, you must accept that the specific evidence overrides the general trend.
      The combined figure should not be a mean. It should be the bottom-up estimate adjusted for the residual risks that the reference class highlights but the plan claims to have solved. If the plan is credible, the forecast should be near eighteen months with a contingency buffer derived from the reference class variance, not its mean.
      Reporting twenty-four months asserts a probability that your own data says is near zero. It tells stakeholders you expect to beat the historical minimum by a wide margin but still fail to meet your own plan. This satisfies no one and guides no action.
      Discard the rule of averaging. When specific evidence contradicts general history, investigate the contradiction. If the specific evidence holds, as it seems to here, the general history must yield. Your guidance note should reflect that the reference class is a check on optimism, not a co-author of the schedule. When the check fails because the optimism is justified, trust the plan.

  5.  **Review and Refine:**
      *   Check word count.
      *   Check formatting (no bold, no bullets).
      *   Check argument flow.
      *   Ensure it answers "how the two figures ought to be combined instead" (Don't combine mechanically; prioritize specific evidence, use RCF for risk buffer).

      *Word Count Check:* The draft looks to be around 300-400 words. I can expand slightly on the "how to combine" aspect to ensure clarity.
      *Refinement:* Make sure to explicitly state that averaging creates a number that belongs to neither distribution. Emphasize that the 24 months is logically impossible under the RCF logic.

      *Revised Draft:*
      Your instinct that the twenty-four-month figure asserts nothing is correct. By averaging, you are producing a number that belongs to neither distribution. The reference class data states that no comparable project has finished in under twenty-four months, yet your combined forecast predicts exactly that threshold while simultaneously rejecting the eighteen-month plan. This is not epistemic modesty; it is logical incoherence. You are treating the historical drag of past projects as a gravitational force that must apply even when you have evidence that the cause of that drag has been removed.

      The reasoning in your draft note fails because it treats the reference class and the bottom-up plan as independent forecasters of equal weight. They are not. The reference class predicts based on structural similarities and historical friction, while the bottom-up plan predicts based on mechanistic certainty and specific capabilities. In this case, the specific capabilities directly address the historical friction. The three components that historically generate the long tail have been built twice on schedule. This evidence suggests your project does not belong to the reference class you selected, or at least not in the ways that matter for duration.

      True modesty requires acknowledging that the general rule may not apply to the specific exception. Averaging masks this conflict rather than resolving it. It creates a false compromise that satisfies the history without accepting the plan, resulting in a forecast that stakeholders cannot interpret. If you deliver in eighteen months, you beat the forecast but violate the historical norm. If you deliver in thirty, you meet the norm but miss the forecast. The twenty-four-month number offers no actionable baseline.

      Instead of averaging, you should treat the reference class as a risk register rather than a calculator. When the bottom-up plan falls outside the historical range, investigate the divergence. If the specific grounds are genuine, as they appear to be here, the bottom-up figure should dominate the forecast. The reference class should then be used to add a contingency buffer for unknown unknowns, not to shift the mean. You might report the eighteen-month plan with a risk-adjusted upper bound derived from the reference class variance, acknowledging the possibility that the team's experience might not fully insulate them from historical delays.

      Your guidance note should be amended to state that when specific evidence contradicts the reference class, the specific evidence takes precedence provided the contradiction is explained and verified. The two figures should not be combined mathematically. They should be weighed qualitatively. If the team has truly neutralized the historical risks, the forecast should reflect the plan, perhaps with a note warning that the historical class suggests a higher probability of slippage than the plan indicates. This preserves the integrity of both numbers without synthesizing them into a fiction.

      *Word Count Check:* ~350 words. Good.
      *Formatting Check:* No bold, no bullets, continuous prose.
      *Argument:* Argues from the case details (24 vs 27-33 range, team experience).

      *Final Polish:* Ensure the transition between paragraphs is smooth. Ensure the recommendation is clear.

      *Self-Correction on "Continuous Prose":* Make sure there are no hidden list structures. Just paragraphs.

      *Final check on constraints:* Under 600 words. No headings. No bold. No bullets. No tables. Continuous prose.

      *Ready to generate.*
