      **Title:** Reconstructing Augustine's Taxonomy of Lies: An Ontology of Communicative Harm
      **Applicant:** [Name]
      **Department:** Philosophy

      **Project Summary:**
      Augustine's *De Mendacio* presents an eight-grade taxonomy of falsehoods that remains exegetically contentious. Standard scholarship oscillates between viewing this hierarchy as a rigid moral ladder consistent with absolute prohibition or as an incoherent compromise with pastoral necessity. Neither account adequately explains why lying about religious doctrine ranks as the gravest offense while lying to save a life ranks as the least severe, particularly given that both acts corrupt belief-formation. This project proposes a reconstruction of Augustine's hierarchy not as a scale of moral wrongness, but as an ontology of communicative harm. I hypothesize that the grading tracks which relational dependency—divine, neighborly, or self-constitutive—a given falsehood corrupts.

      **Methodology:**
      The study employs a hermeneutic close reading of *De Mendacio* and *Contra Mendacium*, contextualized by Augustine's semiotics in *On Christian Doctrine*. To avoid anachronism, modern speech-act theory will be utilized strictly as a heuristic device to illuminate structural relations in Augustine's text, not as an imposed framework. The core analytical task is to map the eight grades onto specific ruptures in communicative dependency rather than aggregating negative utility.

      **Work Plan (Six Months, Part-Time):**
      *   **Months 1–2:** Close reading and textual annotation of *De Mendacio*. Focus on the justification provided for each grade's ranking.
      *   **Months 3–4:** Comparative analysis with *On Christian Doctrine* to establish Augustine's broader theory of signs and communication. Draft the "relational dependency" model.
      *   **Month 5:** Stress-testing the model against edge cases identified in the text (e.g., the midwife hiding the infant, the heretic feigning orthodoxy).
      *   **Month 6:** Final assessment of whether the model collapses into consequentialism. Drafting the final paper.

      **Feasibility and Scope:**
      This scope is honest for one semester of part-time work. All primary texts are available in standard translations and Latin editions; no travel or archival access is required. The limitation to Augustine's early and middle period treatises on lying ensures depth without unmanageable breadth.

      **Risk and Failure Conditions:**
      A negative result is methodologically valid. If the reconstructed ontology inevitably reduces to a form of rule-consequentialism despite the relational framing, the hypothesis will be recorded as falsified. This outcome remains philosophically significant, as it would clarify the limits of non-consequentialist readings of Augustinian ethics. The deliverable will be a conference-ready paper detailing either the validated model or the reasons for its collapse.

