answer: |-
  You have a sharp eye for argumentative structure. You are identifying a genuine tension in political philosophy that doesn't have a single Wikipedia-style name, but is rigorously debated under a few specific headings.

  You are correct that Karl Jaspers is the grandfather of this specific distinction. However, the "weird pivot" you see on Twitter is actually a conflation of two distinct concepts that philosophers work hard to keep separate.

  Here is the breakdown of the established terms, the specific tension you're spotting, and a proposed definition with boundary cases.

  ### 1. The Jaspers Framework (You were right)
  In *The Question of German Guilt* (1947), Karl Jaspers explicitly addressed your exact scenario regarding Germany and the Holocaust. He split "guilt" into four categories to prevent the confusion you're seeing:

  1.  **Criminal Guilt:** Violation of laws. (Individual only).
  2.  **Moral Guilt:** Violation of conscience. (Individual only).
  3.  **Political Guilt:** Liability for the actions of the state one is a citizen of. (**Collective**).
  4.  **Metaphysical Guilt:** Solidarity among humans (failing to prevent evil).

  **The Twitter Move:** When people say "France is guilty" but "No French person is guilty," they are trying to assert **Political Guilt** (Jaspers' category 3) while using the language of **Moral Guilt** (category 2).

  Jaspers argued that *Political Guilt* does not require personal sin. It creates **liability** (the obligation to pay reparations, accept sanctions, or reform institutions) without requiring **culpability** (the moral stain of having committed the act).

  ### 2. The Modern Philosophical Terms
  In contemporary analytic philosophy, this is discussed under **Collective Responsibility** and **Corporate Moral Agency (CMA)**.

  The specific tension you identified—where the entity survives but the members change—is called **Diachronic Collective Identity**.
  *   **Synchronic:** The group exists right now (current citizens).
  *   **Diachronic:** The group exists across time (France 1850 vs. France 2024).

  The argument you are seeing relies on **Ontological Realism about States**. This is the belief that the State is a real object that persists through time, distinct from the sum of its citizens, similar to how a corporation is distinct from its employees.

  ### 3. Naming the Tension
  There isn't one canonical noun for this, but the most precise label for the logical move you described is:

  **The Culpability-Liability Gap**
  *(Or: Diachronic Political Liability without Individual Culpability)*

  This defines the exact pattern:
  1.  **Premise A:** Moral culpability requires agency (you must have done the act).
  2.  **Premise B:** Current individuals lack agency over past acts.
  3.  **Conclusion A:** Therefore, current individuals are not culpable.
  4.  **Premise C:** The State is a continuous moral agent (Ontological Realism).
  5.  **Conclusion B:** Therefore, the State retains liability/obligation.

  **Why it feels weird to you:** Your intuition is likely grounded in **Methodological Individualism**, which holds that only individuals can act, feel, or owe. To a methodological individualist, "The State owes" is just shorthand for "The current individuals are obligated to transfer resources." The Twitter debaters are treating "The State" as a literal agent, which creates the "continuous guilty soul" vibe you noticed.

  ### 4. Defining the Concept with Boundary Cases
  If we were to formalize this concept for a spec sheet, here is how you define **Diachronic Political Liability** so it doesn't collapse into generic group responsibility.

  **Definition:**
  *An obligation borne by a political collective for harms enacted by its prior iterations, persisting despite total turnover of individual membership, grounded in the continuity of institutional identity rather than individual moral fault.*

  **Boundary Cases (Where the logic breaks):**

  | Case | Scenario | Does Liability Hold? | Why? |
  | :--- | :--- | :--- | :--- |
  | **1. Regime Change** | Nazi Germany vs. Modern Germany. | **Yes** (Generally accepted) | The *State* (legal entity) continued, even if the government changed. Institutional continuity exists. |
  | **2. State Dissolution** | USSR vs. Russia. | **Debated** | The USSR ceased to exist legally. Russia claimed assets *and* debt, so they accepted liability. If a state vanishes without successors, liability often vanishes. |
  | **3. Occupation** | France 1940 (Vichy) vs. France 1945. | **Yes** | France argued the Vichy regime was illegitimate, yet later accepted liability for its actions to maintain State continuity. |
  | **4. Colonizer/Citizen** | UK Citizen vs. British Raj crimes. | **No (Individual)** | The *State* (UK) may owe reparations, but the *Citizen* owes nothing beyond taxes. This is the line your Twitter examples struggle to keep clear. |
  | **5. Time Limit** | Roman Empire debts. | **No** | Institutional identity eventually degrades. There is no functional continuity between the Roman Senate and modern Italy. |

  ### 5. The Engineering Analogy
  Since you're a dev, think of it like **Technical Debt** on a legacy codebase.

  *   **The Codebase:** The State (France/Germany).
  *   **The Commits:** Historical actions (Colonialism/Holocaust).
  *   **The Current Devs:** Living citizens.
  *   **The Bug:** The harm caused.

  **The Tension:**
  The current devs say, "I didn't write this spaghetti code (I'm not morally culpable)."
  The Product Owner says, "But you own the repo now. The *project* has to fix the bug (Political Liability)."

  **The Twitter Glitch:**
  People argue as if the *Repo itself* is morally ashamed, rather than acknowledging that the *current maintainers* have an obligation to refactor simply because they hold the keys. When they say "France is guilty," they are anthropomorphizing the Repo. When they say "France owes," they are talking about Maintenance Obligations.

  ### Summary
  *   **Is there a name?** The formal concept is **Diachronic Political Liability**. The rhetorical confusion is **Conflating Moral Culpability with Political Liability**.
  *   **Jaspers?** Yes, he defined it as **Political Guilt** vs. **Moral Guilt**.
  *   **The "Continuous Soul":** This is **Corporate Moral Agency** applied across time.
  *   **Your Intuition:** You are spotting the slippage between *Blame* (backward-looking, requires agency) and *Obligation* (forward-looking, requires continuity).

  The debate isn't usually about whether the history happened; it's about whether the "State" is a real thing that can carry a burden, or just a label for the people currently living there.
