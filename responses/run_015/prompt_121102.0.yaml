      *   **Key Distinction Required:** "Giving wrongdoers their due" (substantive desert) vs. "Fair trial procedures" (epistemic access to desert).
      *   **Opposing Views to Evaluate:**
          1.  Retributivism survives (justice is about desert, not outcomes/risk).
          2.  Risk undermines both retributivism and deterrence.
      *   **Specific Instruction:** "Evaluate carefully."

  3.  **Analyze the Student Answer:**
