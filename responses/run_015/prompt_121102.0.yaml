      *   **Argument 1 (Innocence Objection):** Claims the objection hits retributivism *harder* than deterrence.
          *   *Reasoning:* Deterrence works even on innocents (fear); Retributivism fails completely (no desert violated).
          *   *Critique:* This is a common but contentious point. Does deterrence *justify* punishing the innocent? Most deterrence theorists say no (rule-utilitarian constraints). The student implies act-utilitarian logic here.
      *   **Argument 2 (Procedural Certainty):** Mentions the "reasonable procedural certainty" reply.
          *   *Critique:* Good engagement with the prompt's distinction between "due" and "procedures."
      *   **Argument 3 (Asymmetry of Finality):** Argues death is different because it's irreversible. Evidentiary standards should scale.
          *   *Critique:* Strong point. Addresses the "risk" aspect well.
