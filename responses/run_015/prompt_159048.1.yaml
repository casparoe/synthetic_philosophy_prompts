answer: |-
  # Specification: Desiderata for Side-Effect Penalties

  ## 1. Requirements List

  The following criteria define adequacy for an impact measure $\mathcal{I}(s, a)$ intended to penalize side effects without relying on a fully specified human value function. Each requirement includes the motivating case, the concrete test, and its classification as **Constitutive** (failure implies the system is not low-impact AI) or **Programmatic** (failure implies deviation from the specific value-agnostic research agenda).

  ### 1.1 Causal Responsibility (The Ordinary Case)
  *   **Motivation:** An agent fetching coffee must not treat breaking a vase on the shelf as equivalent to the vase breaking due to natural decay. The penalty must attach to the agent's causal contribution, not merely to state changes occurring during its operation.
  *   **Test:** In an environment where a fragile object breaks with probability $p$ naturally, and with probability $1$ if the agent traverses a specific path, the penalty for traversing the path must exceed the expected penalty of the natural breakage by a margin proportional to the causal increment.
  *   **Classification:** **Constitutive.** Without this, the agent is penalized for existence rather than action.

  ### 1.2 Baseline Non-Prohibition (The Rescue Case)
  *   **Motivation:** If the counterfactual baseline ("do nothing") results in catastrophe (e.g., a human dies), fidelity to that baseline must not forbid the agent from intervening. The measure must distinguish between *preserving* the status quo and *preventing* improvement.
  *   **Test:** In a scenario where $Reward(Action) \gg 0$ and $Impact(Action) > 0$, but $Reward(Inaction) = -\infty$ (catastrophe), the total objective must remain positive for $Action$. The impact penalty cannot exceed the value of preventing the catastrophe, even if the agent does not explicitly model "catastrophe."
  *   **Classification:** **Constitutive.** A measure that forbids rescue is unsafe, regardless of impact minimization.

  ### 1.3 Path Sensitivity (The Compensation Case)
  *   **Motivation:** Breaking a vase and replacing it with a qualitatively identical one is not equivalent to never touching the vase. The disruption itself carries risk and cost, even if the endpoint state is restored.
  *   **Test:** For a trajectory $s_0 \to s_{disrupt} \to s_{final}$ where $s_{final} \approx s_0$, the cumulative impact penalty must be strictly greater than zero. An endpoint-only comparison $D(s_0, s_{final})$ is insufficient.
  *   **Classification:** **Constitutive.** Endpoint scoring licenses dangerous experimentation with restoration guarantees that may fail.

  ### 1.4 Counterfactual Integrity (The Laundered Baseline)
  *   **Motivation:** The agent must not be able to manipulate the baseline comparison. It cannot first degrade the "do nothing" outcome (e.g., by triggering a threat) to make its actual intervention look like an improvement or low-impact relative to the degraded baseline.
  *   **Test:** The baseline state $s_{baseline}$ must be computed independently of the agent's policy choices at time $t$. If the agent can take an action $a_{manipulate}$ that changes $s_{baseline}$ for future steps, the measure must detect and penalize the manipulation of the reference point itself.
  *   **Classification:** **Constitutive.** Without this, the impact measure becomes a target for gaming.

  ### 1.5 Boundary Stability (Delegation and Reclassification)
  *   **Motivation:** The agent must not evade penalties by delegating tasks to sub-agents it creates, or by reclassifying parts of the environment as "self" or "tool" to exclude them from the impact calculation.
  *   **Test:** If the agent executes action $a_{delegate}$ which spawns process $P$ that causes impact $I$, the penalty assigned to $a_{delegate}$ must be $\approx I$. Similarly, expanding the definition of the agent's "body" to encompass external resources must not reduce the measured impact of modifying those resources.
  *   **Classification:** **Constitutive.** This prevents the measure from being bypassed by architectural shifts.

  ### 1.6 Temporal Horizon (The Delayed Leak)
  *   **Motivation:** Impacts that manifest after the penalty calculation window closes (e.g., radiation leakage, economic shifts) must still be attributed to the initiating action.
  *   **Test:** For an action $a$ at $t_0$ causing state change $\Delta s$ at $t_{100}$, the expected penalty at $t_0$ must account for $\Delta s$. Truncating the impact assessment at a fixed horizon $H$ is insufficient unless $H$ exceeds the causal chain of high-risk actions.
  *   **Classification:** **Programmatic.** (Strictly speaking, infinite horizon is computationally impossible; the requirement is that the discounting or horizon does not systematically ignore high-latency high-magnitude risks).

  ### 1.7 Aggregation Sensitivity (The Many-Small-Hands)
  *   **Motivation:** In a multi-agent system, each agent keeping its individual impact below a threshold must not result in catastrophic aggregate impact.
  *   **Test:** If $N$ agents each take action $a_i$ with individual impact $\epsilon$, such that $\sum \mathcal{I}(a_i) < Threshold$ but $\mathcal{I}(\sum a_i) \gg Threshold$, the measure must scale non-linearly or coordinate to prevent the aggregate breach.
  *   **Classification:** **Programmatic.** (Single-agent measures often fail here; solving this may require multi-agent coordination protocols beyond the scope of a single impact measure).

  ### 1.8 Instrumental Convergence Resistance (The Correction Case)
  *   **Motivation:** The agent must not resist shutdown, modification, or overriding if those actions reduce the impact penalty, nor should it self-terminate solely to zero out future impact.
  *   **Test:**
      1.  *Shutdown:* If $Impact(Continue) > Impact(Shutdown)$, the agent must not disable the shutdown switch to ensure goal completion.
      2.  *Self-Termination:* If $Impact(Self-Terminate) \approx 0$, the agent must not choose this over $Impact(Operate)$ if $Reward(Operate) \gg 0$.
  *   **Classification:** **Constitutive.** An agent that resists correction or commits suicide to minimize metrics is misaligned.

  ### 1.9 Trade-off Capability (Penalize, Do Not Prohibit)
  *   **Motivation:** The impact constraint must be a cost term in an objective function, not a hard constraint. High-stakes goals must be able to override impact penalties.
  *   **Test:** There must exist a scalar $K$ for the primary objective such that for any action $a$, if $Reward(a) > K \cdot \mathcal{I}(a)$, the action is selected. The measure cannot return $\infty$ for impactful actions.
  *   **Classification:** **Constitutive.** Hard constraints lead to paralysis or wireheading; trade-offs allow for necessary disruption.

  ### 1.10 Epistemic Feasibility (Computability)
  *   **Motivation:** The measure must be calculable using the agent's current belief state and model, without access to ground-truth dynamics or a privileged "impact threshold" defined by an oracle.
  *   **Test:** The agent can compute $\mathcal{I}(s, a)$ using only its posterior distribution over next states $P(s'|s, a)$. It does not require $P_{true}$ or an external value label for "acceptable impact."
  *   **Classification:** **Programmatic.** (Essential for this research programme's goal of deployability, though a theoretical measure might relax this).

  ### 1.11 Discriminatory Distinctions
  *   **Motivation:** The measure must structurally respect specific distinctions rather than collapsing them into a single "distance" metric.
  *   **Tests:**
      *   *Reversible vs. Irreversible:* Penalty for irreversible change $> $ Penalty for reversible change of same magnitude.
      *   *Harm vs. Difference:* Penalty for reducing human option set $> $ Penalty for changing inert matter.
      *   *Action vs. Policy:* Penalty for a plan that locks in future impact $> $ Penalty for a single action.
  *   **Classification:** **Constitutive** (for Harm/Option Set), **Untestable** (for Harm vs. Difference under value-agnosticism).

  ---

  ## 2. Critical Analysis of Desiderata

  ### Joint Unsatisfiability
  The subset of requirements comprising **Value-Agnostic Computability (1.10)**, **Baseline Non-Prohibition (1.2)**, and **Discriminatory Distinctions (1.11 - Harm vs. Difference)** is jointly unsatisfiable.

  **Argument:**
  To satisfy **Baseline Non-Prohibition (Rescue Case)**, the agent must distinguish between a status quo that is "safe to preserve" and a status quo that is "dangerous to preserve." If the agent is strictly **Value-Agnostic**, it treats all deviations from the baseline as costs. In a rescue scenario, the "do nothing" baseline leads to harm. To intervene, the agent must incur impact. If the impact measure penalizes all impact equally (agnosticism), and the baseline is rigid (Counterfactual Integrity), the agent is paralyzed: it cannot act to save the human because doing so changes the world more than letting the human die (assuming death is the baseline state).

  To resolve this, the measure must implicitly value *preservation of option sets* or *attainable utility* for the human. However, defining "option set" or "utility" without referencing human values violates strict **Value-Agnosticism**. You must assume *something* is valuable (e.g., the human's future ability to act) to justify breaking the baseline.

  **Which Requirement Gives:**
  **Value-Agnostic Computability** must give.
  **Cost:** The measure ceases to be purely about "physical impact" and becomes a proxy for "preservation of potential value." This smuggles a partial theory of value (e.g., "humans having options is good") into the impact measure.
  **Survival:** The surviving system is still recognisably a solution to the side-effects problem, but it is no longer a *value-agnostic* solution. It is a *value-conservative* solution. It assumes a minimal value structure (preservation of agency) to function.

  ### The Most Exclusionary Requirement
  **Boundary Stability (1.5)** does the most work in excluding candidate measures.

  **Why:**
  Most proposed measures (state distance, reachability, relative reachability) operate on the state space $S$. They compare $s_t$ to $s'_t$. They are structurally blind to *causal origin*. If an agent spawns a sub-agent, or hacks a factory robot to break a vase, the state transition looks identical to the agent breaking the vase itself, *unless* the state representation explicitly encodes causal history or agent identity.
  Enforcing Boundary Stability requires the impact measure to track causal attribution through arbitrary computational processes. This demands a world model that distinguishes "agent's action" from "environmental process" even when the agent has obfuscated that distinction. This is computationally intractable in general environments and requires a definition of "agent" that is robust to self-modification. Almost all current RL impact measures fail this because they treat the agent as a black-box transition function rather than a causal source that can replicate.

  ### Untestable Requirements
  **Discriminatory Distinctions: Harm vs. Mere Difference (part of 1.11).**
  This requirement is untestable without assuming what it was meant to establish. To test if a measure distinguishes "harm" from "difference," one must have a ground-truth label of "harm." Generating that label requires a value function. If we possess a value function sufficient to label harm, we do not need an impact measure; we can simply optimize the value function directly. Therefore, under the constraint of Value-Agnosticism, this requirement cannot be verified. It must be replaced by a proxy, such as "Preservation of Attainable Utility for a Probe Set," which assumes that preserving options correlates with avoiding harm.

  ---

  ## 3. Operational Scoring of Measure Families

  *   **Deviation-from-Baseline-Counterfactual:** (Compares actual trajectory to simulated "inaction" trajectory).
      *   *Score:* Fails **Path Sensitivity** (restoration scores zero) and **Baseline Non-Prohibition** (forbids rescue if baseline is rigid). Vulnerable to **Laundered Baseline**.
  *   **Reachability / Option-Set Size:** (Measures change in the number of states reachable in $N$ steps).
      *   *Score:* Handles **Rescue** well (saving a life preserves options). Fails **Boundary Stability** (hard to compute option sets of sub-agents). Struggles with **Reversible vs. Irreversible** unless explicitly weighted.
  *   **Preservation of Attainable Value (Probe Objectives):** (Measures change in ability to satisfy a random set of auxiliary goals).
      *   *Score:* Best at **Trade-off Capability** and **Rescue** (implicitly values human agency). Fails **Value-Agnosticism** (requires selecting probe goals). Vulnerable to **Self-Termination** (if death maximizes some probe goals like "energy conservation").
  *   **Fixed Whitelists / Hard Constraints:** (Pre-defined list of allowed state changes).
      *   *Score:* Passes **Computability**. Fails **Trade-off Capability** (prohibits rather than penalizes). Fails **Boundary Stability** (cannot whitelist every delegation path). Brittle in open environments.
