  ### Epistemology Seminar Decision Tree: Lottery, Preface, and Lab Cases

  **Branch Questions**

  1.  **Lab Case (Individual):** Given the 0.1% error rate, do you *believe* any single report is accurate?
      *   **No** → Go to Leaf 1.
      *   **Yes** → Question 2.
  2.  **Lottery Case:** Do you believe ticket #1 will lose?
      *   **No** → Question 3.
      *   **Yes** → Question 4.
  3.  **Lottery Reason:** Is your "No" because only one ticket can win (unlike lab errors)?
      *   **Yes** → Go to Leaf 2.
      *   **No** → Go to Leaf 3.
  4.  **Preface Case (Conjunction):** Do you believe *all* claims in the book are true together?
      *   **Yes** → Question 5.
      *   **No** → Question 6.
  5.  **Preface Case (Admission):** Do you also believe the author's claim that "at least one is false"?
      *   **Yes** → Go to Leaf 4.
      *   **No** → Go to Leaf 5.
  6.  **Logic Check:** If you believe every claim, does logic force you to believe they are all true together?
      *   **Yes** → Go to Leaf 6.
      *   **No** → Question 7.
  7.  **Solution Type:** To avoid believing the conjunction, do you change logic or change what "belief" means?
      *   **Change Logic** → Go to Leaf 7.
      *   **Change Meaning** → Go to Leaf 8.

  ***

  **Leaves (Views)**

  1.  **Credence Skeptic:** You reject belief entirely in favor of probabilistic credence.
      *   *Awkward commitment:* You cannot testify in court or publish papers without lying about your mental state.
  2.  **Correlation Distinctivist:** You believe lab reports but not lottery tickets due to statistical structure.
      *   *Awkward commitment:* You must explain why independence boosts belief status without raising probability.
  3.  **Pragmatic Intuitionist:** You believe lab reports but not lottery tickets without a structural reason.
      *   *Awkward commitment:* You treat identical probabilities differently without a governing principle.
  4.  **Rational Contradictionist:** You believe the book is perfect and also believe it contains an error.
      *   *Awkward commitment:* You endorse logical impossibilities as rational states of mind.
  5.  **Infallibilist:** You believe the book is perfect and deny the author's admission of error.
      *   *Awkward commitment:* You claim this specific book defies all historical error rates for authors.
  6.  **Logical Retractionist:** Logic forces the conjunction, so you must withdraw belief in the individual claims.
      *   *Awkward commitment:* You must abandon belief in every claim once you count them.
  7.  **Non-Closure Theorist:** You keep individual beliefs but deny logic forces the conjunction.
      *   *Awkward commitment:* You treat rational belief as exempt from logical aggregation.
  8.  **Acceptance Theorist:** You deny "belief" is a mental state; it is just a norm for assertion.
      *   *Awkward commitment:* You deny belief exists as a natural kind distinct from social rules.

  ***

  **Notes on Logical Space**

  *   **Unoccupied Combinations:** The **Infallibilist (Leaf 5)** and **Logical Retractionist (Leaf 6)** positions are genuinely empty; no serious theorist defends claiming a book is error-free against known rates, nor do they retain individual beliefs while admitting logic forces a conjunction they reject. The combination of "Believe Conjunction" + "Deny Logic Forces It" is incoherent.
  *   **Indistinguishable Leaves:** The tree cannot practically separate the **Non-Closure Theorist (Leaf 7)** from the **Acceptance Theorist (Leaf 8)**; both permit asserting individual claims while denying the conjunction, differing only on whether "belief" is the right word for the attitude.
  *   **Paradox Unity:** The tree shows the lottery and preface paradoxes are a single problem for views that modify logic or belief (Leaves 6–8), but distinct problems for views that rely on statistical structure (Leaf 2).

