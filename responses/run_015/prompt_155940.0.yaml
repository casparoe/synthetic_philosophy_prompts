      *   *Hedonism:* For the hedonist, the texture of the experience matters. If the fatigue and satisfaction feel real, the hedonic balance might be positive. The lack of external impact doesn't hurt the *feeling*. So hedonism might say yes, it's good.
      *   *Desire-Fulfillment:* This is where the user's specific constraint hits hard. You want to contribute to a meaningful story. If the story is fake, the desire is technically fulfilled phenomenologically but frustrated ontologically. If the desire is "I want to *actually* help," then it's not fulfilled. If the desire is "I want to *feel* like I help," it is. The prompt says "true second-order desire that your efforts contribute to a meaningful life story." If the story isn't real, the desire isn't met.
