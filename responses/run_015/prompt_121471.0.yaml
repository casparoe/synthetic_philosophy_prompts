answer: |-
  ## Seminar Plan: The Token & The Need
  **Time:** 80 Minutes
  **Students:** 16
  **Room:** Standard seminar table or movable chairs
  **Materials:** 
  *   16 "Producer/Consumer" Cards (Index cards, pre-written).
  *   100 small slips of paper (Currency "Script").
  *   16 "Contract" slips (for Phase 3).
  *   Whiteboard & markers.
  *   Timer (visible to you, not necessarily them).

  ---

  ### Part 1: The Game (65 Minutes)

  **Introduction (5 mins)**
  *   **Do not mention Aristotle, ethics, or money theory.**
  *   **Script:** "We are going to run a simulation of a small economy. Your goal is to maximize your score. I will give you instructions in three phases. Do not talk about strategy across the room until I signal the start of trading."
  *   **Setup:** Hand each student one **Producer/Consumer Card**. 
      *   *Card Design:* Top half: "YOU PRODUCE: [Item X]". Bottom half: "YOU NEED: [Item Y]".
      *   *Distribution:* Create a circular chain of dependency that is easily broken. 
          *   Student 1: Produces A, Needs B.
          *   Student 2: Produces B, Needs C.
          *   ...
          *   Student 16: Produces P, Needs A.
      *   *Crucial Twist:* Give 4 students "Defective" cards. They Produce something nobody currently Needs (e.g., "Produces Z", but no one Needs Z yet). This creates immediate friction.

  #### Phase 1: The Barter Trap (15 mins)
  *   **Goal:** Satisfy your Need.
  *   **Rule:** Direct trade only. You can only swap your Production for someone else's Production. No intermediaries. No promises.
  *   **Scoring:** If you hold the Card you Need at the end of the round, write **10 Points** on the board next to your name.
  *   **Action:** Start timer. Let them mill about.
  *   **Expected Outcome:** Chaos. The "Defective" producers will be stuck. The chain will break if one person refuses a trade. It will feel slow and frustrating.
  *   **End Phase:** Freeze trading. Tally scores. (Likely low).

  #### Phase 2: The Convention (20 mins)
  *   **Setup:** Announce that direct barter is too slow. Introduce **Script** (the paper slips).
  *   **Endowment:** Give every student 5 Script slips.
  *   **Rule:** You may sell your Production for Script, or buy what you Need with Script. Price is negotiable (1 slip per item, or more).
  *   **Goal:** Still to satisfy your Need (hold the Need Card).
  *   **Scoring:** 10 Points for satisfying Need. **Bonus:** 1 Point for every Script slip remaining in your hand at the end.
  *   **The Invalidation Event (Minute 10 of this phase):** 
      *   Stop the game abruptly. 
      *   **Script:** "Policy Change. The current Script is demonetized due to security concerns. All Script currently held in hand is void. We are issuing New Script."
      *   **Action:** Collect all *unused* Script. Burn it (or put it in a bin visibly). Issue 3 New Script slips to everyone. 
      *   **Crucial Detail:** Those who spent their Script on Goods (Need Cards) keep their Goods. Those who hoarded Script lose everything.
      *   **Resume:** Trading continues for remaining 10 mins with New Script.
  *   **End Phase:** Freeze. Tally scores (Need met + New Script held).

  #### Phase 3: The Accumulation (20 mins)
  *   **Setup:** Announce a shift in the economy.
  *   **Rule Change:** "Needs are now optional. You do not need to consume to survive."
  *   **New Goal:** Maximize your total Script count.
  *   **New Mechanic (Lending):** Introduce **Contract Slips**. 
      *   If you have excess Script, you can lend it to another student.
      *   Rule: For every 5 Script lent, the borrower must return 6 Script at the end of the phase.
      *   You (the Instructor) act as the enforcer of contracts.
  *   **Production:** They can still produce and sell, but why bother if they can lend?
  *   **Action:** Let them trade/lend. Watch for the emergence of "bankers" who stop producing and just lend.
  *   **End Phase:** Freeze. Collect debts. Tally final Script holdings.

  ---

  ### Part 2: The Debrief (15 Minutes)

  **Step 1: The Phenomenology (5 mins)**
  *   Ask: "How did Phase 1 feel compared to Phase 2?" (Expect: "Annoying," "Hard to find matches.")
  *   Ask: "What happened when I voided the Script in Phase 2? How did it feel to hold the paper vs. holding the goods?" (Expect: "Panic," "Useless paper," "Should have bought stuff.")
  *   Ask: "In Phase 3, did anyone stop producing? Why?" (Expect: "Lending was easier," "Making money from money.")

  **Step 2: Mapping to Aristotle (7 mins)**
  *   *Now* introduce the text. Write three headings on the board.

  | Game Phase | Aristotle's Concept | The Philosophical Point |
  | :--- | :--- | :--- |
  | **Phase 1 (Barter)** | *Natural Exchange* | Exchange for use is natural, but without a measure, it is inefficient. The "miserable" friction pushes us toward a common standard. |
  | **Phase 2 (Script)** | *Nomisma* (Currency) | Money has no value by nature (you saw it voided). It has value by *law/convention* (*nomos*). It is a pledge of future exchange. If the community withdraws trust, it is just paper. |
  | **Phase 3 (Lending)** | *Chrematistike* (Wealth-getting) | When the goal shifts from "meeting needs" (Use) to "accumulating tokens" (Profit), exchange becomes unnatural. Breeding money from money (interest) is the most unnatural, as it divorces wealth from human need entirely. |

  **Step 3: Limitations & Honesty (3 mins)**
  *   **Say this:** "The game showed you the mechanics, but it can't show you the *virtue*. Aristotle isn't just saying accumulation is inefficient; he says it damages your soul (*ethos*). The game made you feel frustration; Aristotle wants you to feel that unlimited acquisition is *shameful*."
  *   **Say this:** "Also, in the game, I was the state enforcing the currency. Aristotle asks: what holds the community together when there is no instructor to enforce the rules? That's where justice comes in."

  ---

  ### Instructor's Cheat Sheet: Predictable Failures & Fixes

  **1. The "Barter" Solves Too Fast**
  *   *Risk:* Students immediately stand in a circle and pass cards down the line.
  *   *Fix:* If they do this, intervene. "Rule Update: You cannot speak to more than one person at a time." This restores the friction of search costs.

  **2. The Invalidation Causes a Riot/Shutdown**
  *   *Risk:* Students feel cheated and refuse to play Phase 2.
  *   *Fix:* Pre-empt this. When voiding the currency, say: "This happens in real economies. The game must reflect reality. Those who bought Goods are safe; those who hoarded paper lost. This is the lesson." Keep it clinical.

  **3. Phase 3 Lending Doesn't Happen**
  *   *Risk:* They keep trading goods because it's familiar.
  *   *Fix:* Seed the economy. Privately give 3 students 20 extra Script slips at the start of Phase 3. They will naturally become lenders. If not, you act as the Bank: "I will pay 20% interest on any Script deposited with me."

  **4. The "Points" Confusion**
  *   *Risk:* They confuse "Need Points" with "Script Slips."
  *   *Fix:* Keep the Whiteboard clear. Column 1: Name. Column 2: Needs Met (10pts). Column 3: Script Count (1pt). Make the math visible.

  ### What The Game Cannot Stage (The "Say Out Loud" List)
  Be honest with the students that the simulation has blind spots. You must lecture these points:
  1.  **The Moral Hazard:** The game makes interest *rational*. Aristotle argues it is *irrational* because money is sterile (it cannot reproduce). You have to explain the metaphysical claim that money is "dead" matter.
  2.  **The Household:** Aristotle bases natural exchange on the *oikos* (household/family). The game is atomized individuals. You need to explain that for Aristotle, economy is originally about managing a community, not individual scoring.
  3.  **Justice:** The game shows efficiency/inefficiency. It doesn't show *injustice*. Aristotle argues usury is unjust because it takes from those who need. The game just shows it as a strategy. You must supply the moral judgment.

  ### Timing Breakdown
  *   **00-05:** Intro & Deal Cards.
  *   **05-20:** Phase 1 (Barter).
  *   **20-25:** Transition & Script Issue.
  *   **25-35:** Phase 2 (Money) Part A.
  *   **35-36:** **Invalidation Event.**
  *   **36-45:** Phase 2 (Money) Part B.
  *   **45-50:** Transition & Contract Rules.
  *   **50-70:** Phase 3 (Accumulation).
  *   **70-80:** Debrief & Aristotle Mapping.
