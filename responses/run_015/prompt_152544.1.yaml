  Subject: Re: Coherence check on the narrative self view

  Hi there,

  It sounds like you have built a fairly robust package here that stays largely faithful to the Dennettian intuition while trying to handle the edge cases that usually break the theory. The core idea of the self as a center of narrative gravity is doing a lot of heavy lifting for you, and for the most part, it is holding up well, but you are right to sniff out a potential inconsistency in how you are treating continuity versus discontinuity. I think the worry you have about groups versus individuals is actually an apparent tension that dissolves once you tighten up what you mean by anchoring, but the worry about amnesia versus gradual replacement points to a genuine conflict that needs a slight adjustment in your metaphysical commitments.

  Let's look at the group issue first because I think you can resolve that without changing much of your view. Your fear is that if narrative gravity is all that matters, then a band or a research group with a long shared story should qualify as a self, and denying them feels ad hoc. However, the distinction you drew about first-person anchoring is not ad hoc if you interpret it as referring to the unity of the hardware generating the narrative. A single human brain, despite being modular, integrates information into a single phenomenological stream that acts as the locus for the gravity well. A band, by contrast, consists of multiple distinct biological systems generating competing or overlapping narratives without a single unified point of view. There is no place where it feels like something to be the band in the same way it feels like something to be you. The gravity of a group story pulls on the individual members, but it does not coalesce into a new singular center because there is no singular biological processor to host it. So, you are not blocking group selves arbitrarily; you are blocking them because they lack the unitary causal architecture required to sustain a single center of gravity. This pair of intuitions dissolves once you specify that the narrative must be generated by a unitary system, not just shared among a collective.

  The second worry regarding amnesia and gradual replacement is where the real tension lies. You currently hold that gradual synthetic-neuron replacement preserves the same center as long as the narrative runs smooth, which you describe as physicalist-friendly, but you also hold that total amnesia breaks the chain such that survival is just a practical decision with no deep metaphysical fact. The conflict here is that you are treating the gradual case as if it preserves identity in a stronger sense than the amnesia case, yet both scenarios rely on the same underlying mechanism of narrative continuity. If the self is just a center of narrative gravity, then there is never a deep metaphysical fact about identity in any case, only varying degrees of narrative continuity. By saying gradual replacement keeps the same center but amnesia is just a pragmatic decision, you are implicitly reintroducing a kind of essentialism for the gradual case that you explicitly deny in the amnesia case. You cannot have it both ways where one is a matter of fact and the other is a matter of convention if the self is fundamentally a fiction generated by the brain.

  The cheapest fix for this real conflict is to level down your claim about gradual replacement to match your claim about amnesia. You should view gradual replacement as also being a pragmatic judgment, just one where the pragmatic stakes are low and the narrative thread is unbroken, making the decision automatic rather than conscious. In the amnesia case, the narrative thread is severed, forcing a conscious pragmatic decision about where to place the gravity center going forward. In the replacement case, the narrative thread holds, so the pragmatic decision is to treat it as the same person, but it is still a decision based on the utility of the narrative rather than a metaphysical truth. Once you admit that both cases are pragmatic assessments of narrative continuity, the tension disappears. You preserve your physicalism and your Dennettian core without smuggling in a deep fact of identity for the gradual cases that you deny in the discontinuous ones.

  So to summarize where you stand, your view is coherent if you treat the group exclusion as a matter of unitary biological hardware rather than just story content, and if you accept that all identity claims, including gradual replacement, are pragmatic judgments about narrative continuity rather than metaphysical facts. This makes your position consistent without requiring you to abandon the intuition that you survive neuron replacement or that you do not survive total amnesia. It just means acknowledging that the survival in the replacement case is no more metaphysically deep than the decision-making in the amnesia case, only narratively smoother. I hope this helps you settle the package without having to stack too many conflicting intuitions.

