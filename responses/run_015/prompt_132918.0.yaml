      *   **Relational** → **Split B1:** Is the relation based on actual desire or idealized approval?
          *   **Leaf 5: Simple Pro-Attitude**
              *   *Awkward Commitment:* Must deny masochists take pleasure in pain unless they desire the pain itself, not just the relief.
          *   **Leaf 6: Rational Approval**
              *   *Awkward Commitment:* Agents can be wrong about their own pleasure, requiring an external standard to judge internal states.
      *   **Functional** → **Split B2:** Is the function a unified system or a modular cluster?
          *   **Leaf 7: Teleological Reward**
              *   *Awkward Commitment:* Must count evolutionary maladaptations like drug addiction as 'pleasure' or exclude them arbitrarily.
          *   **Leaf 8: Modular Dissociation**
              *   *Awkward Commitment:* 'Pleasure' is a linguistic fiction masking independent neural circuits with no shared phenomenology.

  ***

  ### Structural Notes

  **Blurred Boundaries**
  The tree struggles to cleanly separate **Leaf 5 (Simple Pro-Attitude)** and **Leaf 7 (Teleological Reward)**. In practice, "what an agent desires" and "what the brain's reward system reinforces" often overlap; distinguishing them requires separating conscious wanting from subconscious reinforcement, which empirical psychology suggests are frequently dissociable but conceptually tangled in ordinary language.

  **Unoccupied Logical Space**
  There is a theoretically possible view that accepts **Phenomenal Uniformity (YES)** but denies any **Relational or Functional backing**. This would posit pleasure as a brute qualia that neither motivates action nor serves a biological purpose.
  *   **Assessment:** **Unattractive/Epiphenomenal.** While logically possible, this view renders pleasure causally inert; if the uniform feel doesn't drive behavior or serve a function, it is unclear why it should matter ethically or even why we have a word for it beyond "sensation."
