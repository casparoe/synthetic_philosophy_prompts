          *   Functionalism (in philosophy of mind/biology): Identity via role, not substrate.
      *   *The Draft's Move:* Applying functionalism to the *clay* itself, not just the statue. Usually, clay is treated as "stuff" (mass term), not an individual with parts. By making clay modular/functional, the draft treats C as an artifact-like or organism-like entity.
