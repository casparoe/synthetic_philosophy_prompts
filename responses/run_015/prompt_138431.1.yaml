answer: |-
  # FINAL PAPER: EXPLANATION IN HISTORY AND THE SOCIAL SCIENCES

  **Question 1 (25 Marks)**

  **Case:** In 1891, the railway commission of the Republic of Valdania chose a gauge of 1.42 metres; all four neighbours had standardised on 1.60 metres. The commission split five to four; the decisive vote came from Commissioner Oreste Baldi, whose family's rolling-stock works was tooled for 1.42 metres. The commission's engineering report recommended 1.60 metres, noting the wider gauge permitted larger wagons worth roughly 5% greater efficiency. The network grew to 19,000 kilometres over eighty years. Today, the annual cost of the mismatch is estimated at 0.2% of GDP in transshipment plus 0.3% of GDP in forgone engineering efficiency. Complete regauging would cost 4% of GDP in one-off capital spending and require an eight-year transition during which freight capacity is reduced, costing 0.7% of GDP per year. Economists estimate the infrastructure's remaining useful life at 50 years and the social discount rate at 5%.

  Two comparators: Sorrentia began with a parochial 1.40 metre gauge in 1872 but converted to 1.60 metres in 1919 after war destroyed a third of its track. Kalo built no railways until 1952 and adopted 1.60 metres from the outset. A minority of historians argue Valdanian bridges in 1891 could not have carried the wider gauge, making 1.42 metres locally correct at the time.

  **Task:**
  1.  Apply the **swap**, **resampling**, and **pressure** counterfactuals to this case. You must evaluate the outcome at two distinct grains of description (e.g., exact gauge width vs. border compatibility).
  2.  Assess whether the phrase "history is locked in" accurately summarises this case. In doing so, distinguish between sensitivity, non-reversion, and inefficiency.
  3.  Conclude by identifying the single step in your own reasoning most likely to fail and state what evidence would change your verdict.

  *No literature recall or citations are expected. Credit is awarded for analysis, not definition.*

  ***

  # MODEL ANSWER

  To evaluate Valdania's railway gauge, we must disentangle sensitivity, lock-in, and inefficiency. These claims often travel together but come apart here. Sensitivity asks if small changes alter the outcome; lock-in asks if the outcome resists reversal; inefficiency asks if a superior alternative was remediable.

  First, we apply the counterfactuals at two grains: the *specific metric width* (1.42m) and *compatibility status* (standard vs. non-standard).
  The **swap counterfactual** replaces Baldi's vote with its most likely alternative (a vote for 1.60m). At the specific width grain, the outcome changes: Valdania adopts 1.60m. At the compatibility grain, the outcome also changes: Valdania matches its neighbours. This establishes sensitivity to a specific agent's choice.
  The **resampling counterfactual** redraws accidents from the distribution of that kind (commission votes with conflicted members). Given Baldi's structural interest, the probability of a 1.42m vote remains high, though not certain. However, the *compatibility status* is highly sensitive here; any vote against Baldi yields compatibility.
  The **pressure counterfactual** holds functional pressures fixed (trade efficiency, engineering stability) while varying accidents. The engineering report favoured 1.60m. Thus, functional pressures pushed toward compatibility, but political accidents selected incompatibility. This confirms the outcome was not functionally determined.

  Does this constitute lock-in? "Lock-in" implies the outcome is stable against perturbations of a certain size. Valdania has not reverted despite 0.5% annual GDP losses. However, Sorrentia demonstrates that a shock destroying 33% of capital was sufficient to unlock the system. Therefore, Valdania is not permanently locked in; it is locked in only against *economic* perturbations of normal magnitude. The barrier is the transition cost (4% GDP + capacity loss), not physical impossibility. The claim of lock-in is really a claim about the range of perturbation sizes required to trigger switching, not about permanence.

  Is the outcome inefficient? This is the normative crux. We compare the Net Present Value (NPV) of switching versus staying.
  Cost of staying: 0.5% GDP/year for 50 years at 5% discount. Annuity factor ≈ 18.25. PV ≈ 9.1% of GDP.
  Cost of switching: 4% capital + (0.7% × 8 years) transition ≈ 9.6% of GDP (undiscounted). Discounted transition costs are lower, but capital is immediate.
  The NPV comparison is finely balanced. At a 5% discount rate, switching yields a marginal net loss or gain depending on precise transition estimates. Furthermore, 0.2% of the loss is transshipment revenue transferred to Baldi's firm (or similar logistics monopolists), not deadweight loss. Only the 0.3% efficiency loss is pure waste. If we count only deadweight loss, the PV of staying drops to ≈ 5.5% of GDP, making switching clearly inefficient. Thus, the claim of inefficiency relies on treating transfers as social costs and accepting high transition estimates.

  Finally, we must address ex ante versus ex post efficiency. If the minority historians are correct that 1891 bridges could not support 1.60m, the initial choice was ex ante efficient. The inefficiency is only ex post, arising from evolving steel technology. Blaming the 1891 commission for 1991 costs commits a hindsight fallacy.

  **Verdict:** Valdania exhibits sensitivity and high switching costs, but "lock-in" is misleading if it implies permanence rather than high thresholds. The inefficiency claim is weak: once transfers are excluded and transition costs weighed, staying may be the rational economic choice today.

  **Weakness Identification:**
  The step most likely to fail is the exclusion of transfer payments from the efficiency calculation. I treated transshipment costs as mere redistribution, but if the transfer sustains a political coalition that blocks future innovation, it becomes a dynamic deadweight loss. Evidence that Baldi's firm lobbied to prevent bridge upgrades would convert this from a static calculation error into a case of political failure, vindicating the inefficiency claim despite the NPV balance.

  ***

  # MARKING SCHEME (25 MARKS)

  **1. Application of Counterfactuals (9 Marks)**
  *   **Swap (3 marks):** Must identify Baldi's vote as the pivot. Must show outcome changes at both grains (width and compatibility).
      *   *Common Error:* Treating the swap as changing the whole political climate rather than a single vote.
  *   **Resampling (3 marks):** Must discuss probability of recurrence given structural interests (Baldi's firm). Must distinguish between the probability of 1.42m specifically vs. incompatibility generally.
      *   *Common Error:* Assuming resampling implies randomness without structural constraints.
  *   **Pressure (3 marks):** Must note engineering report favoured 1.60m. Must conclude accidents selected the outcome, not functional necessity.
      *   *Common Error:* Claiming pressure counterfactual proves efficiency rather than indeterminacy.

  **2. Grain of Description (4 Marks)**
  *   **Fixing the Grain (2 marks):** Must explicitly define the two grains (e.g., metric width vs. compatibility). Must not evade with "it depends."
      *   *Common Error:* Stating "description is relative" without fixing it for the argument.
  *   **Mechanism Link (2 marks):** Must argue that the *mechanism of reproduction* (technical standards vs. trade friction) dictates the relevant grain.
      *   *Common Error:* Choosing grains arbitrarily without linking to explanatory mechanism.

  **3. Lock-in and Efficiency Analysis (9 Marks)**
  *   **Separating Claims (3 marks):** Must distinguish sensitivity (Baldi's vote), lock-in (switching costs vs. shocks), and inefficiency (NPV/Deadweight).
      *   *Common Error:* Conflating "hard to switch" with "inefficient."
  *   **NPV Calibration (3 marks):** Must recognise the NPV is balanced (≈9.1% benefit vs ≈9.6% cost). Must note sensitivity to discount rate/transition estimates.
      *   *Common Error:* Asserting switching is obviously worthwhile or obviously not.
  *   **Transfer vs. Deadweight (3 marks):** Must identify transshipment cost as potentially distributive rather than welfare loss.
      *   *Common Error:* Treating all GDP percentages as pure deadweight loss.

  **4. Closing Paragraph: Weakness Identification (3 Marks)**
  *   **Self-Critique (2 marks):** Must identify a specific step in the reasoning (e.g., treatment of transfers, ex ante feasibility) as the vulnerability.
      *   *Common Error:* Vague humility ("history is complex") without identifying a specific logical step.
  *   **Verdict Changer (1 mark):** Must state what evidence would flip the conclusion (e.g., lobbying evidence, bridge feasibility).
      *   *Common Error:* Failing to specify the evidence required to change the verdict.

  **A vs. B Distinction:**
  *   **A Answer (20-25 marks):** Explicitly separates the three claims (sensitivity, lock-in, inefficiency). Uses Sorrentia to define the *threshold* of lock-in (shock size) rather than denying lock-in exists. Correctly identifies the NPV balance and the transfer/deadweight distinction. The closing paragraph identifies a structural political economy risk (lobbying) rather than just data uncertainty.
  *   **B Answer (15-19 marks):** Applies counterfactuals correctly but conflates lock-in with inefficiency. Calculates NPV but treats all costs as deadweight. Identifies a weakness but focuses on data precision rather than conceptual categorization (e.g., "discount rate might be wrong" vs "transfers might be dynamic losses").

  **Note on Constraint Compliance:**
  *   Candidates receiving credit for reciting path dependence taxonomy (first/second/third degree) without application should receive **0 marks** in Section 1.
  *   Candidates evading the grain question ("it depends on description") should receive **0 marks** in Section 2.
  *   The **Closing Paragraph** is mandatory for full marks; omitting it caps the score at 22.
