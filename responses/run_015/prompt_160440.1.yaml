answer: |-
  This is not a standard fallacy, and it is not simple hypocrisy. It is a coherent, high-functioning logical structure that dominates institutional heritage ethics. It has no single common noun, though in critical heritage studies it is often discussed under the umbrella of the **"Universal Museum" argument** or the **"Salvage Paradigm."**

  For your purposes as a novelist, you need the logical skeleton, not the academic label. I will call this shape **The Logic of Constitutive Displacement.**

  It is **one phenomenon**, not two. The "switching" between continuity and rupture is not a contradiction; it is the consistent application of a single axiom: **The object's highest value and truest identity are determined by its current context, not its origin.**

  Here is the clean carving of the thing itself, its internal mechanics, and its boundaries.

  ### 1. The Core Axiom: Contextual Supremacy
  The curator does not believe they are holding a "Benin Head." They believe they are holding a "World Art Masterpiece." In their view, the object underwent a metamorphosis in 1897. It ceased to be a ritual vessel (local, functional, restricted) and became an aesthetic/historical document (global, contemplative, accessible).

  *   **The Continuity Claim:** When arguing against return, the curator points to the *biography of the object in the museum*. "We have cared for it, studied it, loved it." This is the **Continuity of Custody**.
  *   **The Rupture Claim:** When arguing against function, the curator points to the *biography of the culture that made it*. "The ritual is dead, the kingdom changed." This is the **Rupture of Origin**.

  These are not contradictory. They are two sides of the same coin: **The Old Context is Dead; The New Context is Life.** The argument relies on the idea that the museum did not just *store* the object; it *completed* it.

  ### 2. The Engine: The Ex Injuria Claim
  This is the "self-curing" mechanism you identified. In law, there is a maxim: *Ex injuria jus non oritur* ("Right does not arise from wrong"). Your curator is arguing the inverse: *Jus oritur ex injuria* ("Right arises from wrong").

  The logic runs:
  1.  The removal was violent (acknowledged).
  2.  That violence severed the object from its original function (acknowledged).
  3.  Because that function is severed, the object is now "free" to belong to humanity (conclusion).
  4.  Therefore, returning it would be a *new* violence (a reduction of its status).

  The injury is not denied; it is **repurposed**. The theft is framed not as a crime to be undone, but as a tragic but necessary birth pang for the object's "universal" life. The worse the theft (the total the destruction of context), the stronger the claim that the object *cannot* go back, because there is no "back" to go to. The wrong creates the factual reality that makes the right (retention) possible.

  ### 3. Boundary Cases (The Edges of the Argument)
  You asked where the argument holds and where it fails. This is crucial for your scene. The Logic of Constitutive Displacement is robust, but it has stress points.

  **Case A: The context would have vanished anyway (Decay/Iconoclasm).**
  *   *Effect:* **Strengthens the Curator.**
  *   *Why:* This removes the moral sting of the theft. If the British hadn't taken it, the argument goes, "time or zealots would have destroyed it." This shifts the narrative from "Thief" to "Rescuer." The *Ex Injuria* claim becomes a "Lesser of Two Evils" claim. The curator can argue, "We didn't kill the context; we saved the object from the death of the context."

  **Case B: The holder is a later purchaser, not the original taker.**
  *   *Effect:* **Weakens the "Rescue" narrative, strengthens the "Stewardship" narrative.**
  *   *Why:* A later purchaser (e.g., a museum that bought it in 1950) cannot claim they saved it from the sack. They must rely entirely on the **Continuity of Custody**. Their argument shifts from "We rescued this" to "We are the current best home." This makes them more vulnerable to the claim that they are merely fencing stolen goods, but it allows them to claim "Clean Hands" regarding the original violence. They argue the chain of title has "ripened."

  **Case C: The descendants disagree (Some want it back, some want it to stay).**
  *   *Effect:* **Strengthens the Curator significantly.**
  *   *Why:* This validates the **Rupture of Origin** claim. If the source community cannot agree on the object's meaning or home, the curator argues that the *Museum* is the only neutral ground. "We are not imposing; we are preserving a consensus that no longer exists there." It allows the curator to position the museum as the guardian of the object *against* local political squabbles.

  **Case D: The object's value is primarily as evidence of the theft.**
  *   *Effect:* **Collapses the Argument (The Dangerous Edge).**
  *   *Why:* This is the curator's greatest vulnerability. If the object's main "universal value" is that it proves a crime occurred, keeping it to "show the world" becomes indistinguishable from keeping the spoils of war as a trophy.
  *   *The Curator's Counter-Move:* They will argue that returning it hides the evidence. "If it goes back, it disappears into a private shrine. Here, it remains a public witness to the colonial encounter." They frame retention as **Memorialization**. This is the strongest version of their case: "We keep it not despite the theft, but *because* of it, so the theft is never forgotten."

  ### 4. How to Write the Curator
  To avoid caricature, do not write the curator as someone who thinks theft is good. Write them as someone who thinks **Time is a River that cannot flow backward.**

  *   **Their Tone:** Melancholic, not defensive. They should sound like they are protecting the object from a dangerous nostalgia.
  *   **Their Blind Spot:** They genuinely believe the "Universal" context is a higher evolutionary stage for the object than the "Local" context. They do not see this as Eurocentric; they see it as Humanist.
  *   **The Weakness in their Armor:** They cannot account for the *spiritual* claim. If the claimant says, "This is not art, this is a ancestor," the curator's logic (which treats the object as information) has no purchase. The curator can only reply, "That belief is gone," which sounds cruel. To make them sympathetic, have them acknowledge the cruelty but frame it as unavoidable reality. "I wish the old world were alive. It is not. I will not pretend it is."

  ### 5. Summary of the Shape
  *   **Name:** The Logic of Constitutive Displacement.
  *   **Core Mechanism:** The transformation of the object's ontology (what it *is*) via the act of dispossession.
  *   **The Switch:** Continuity of Custody (Museum) vs. Rupture of Origin (Source). Both serve the same end: Retention.
  *   **The Self-Cure:** The damage caused by the taking is cited as the reason the taking cannot be reversed.
  *   **The Limit:** It fails if the object is claimed not as property or art, but as a living subject/ancestor, because the curator's logic only applies to *objects*.

  In your scene, the curator wins on logic (the object *is* physically different now, the context *is* changed) but loses on morality (they created the change to win the logic). The tension of the scene lies in the fact that the curator is **factually right** about the rupture, but **morally compromised** by having caused it. They are arguing that the map they burned is no longer needed to find the way.
