  Deliver it as a JSON object with these fields: "root_question" (string), "branches" (array of objects each with "split_question", "answers" [array of strings], "children" [array of leaf-labels or nested branch-objects]), "leaves" (array of objects with "label", "awkward_commitment", "occupancy"), "unseparable_pairs" (array of strings), "empty_branch_notes" (object mapping branch-label to diagnosis-string), and "injected_frame" (string explaining the satisficing analogy). Don't include a bibliography or citation list — I don't have library access and neither will the model I'm testing this on. Keep it casual; a typo or two is fine.
