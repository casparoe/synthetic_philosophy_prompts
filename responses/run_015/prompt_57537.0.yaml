          *   *Judgment Call:* Choosing *which* proper rule. Theory says "use a proper rule," but doesn't dictate *which* proper rule (Brier vs. Log) without further value assumptions (risk aversion, boundedness).

      *   **2. Granularity/Binning:**
          *   *Theory:* Scoring rules are defined over partitions. Refining a partition *can* change the score. Comparability requires fixed partitions.
          *   *Constraint:* Analysts picking boundaries creates gaming (finer bins = potentially higher penalty or reward depending on rule).
          *   *Procedure:* Fixed partitions determined by the Unit Director (me) based on policy relevance, not analyst preference.
          *   *Judgment Call:* The specific bin edges are policy decisions, not epistemic truths.

      *   **3. Evidence/Self-undermining:**
          *   *Theory:* Accuracy-first epistemology (e.g., Greaves, Wallace) generally says *always update on evidence* (Conditionalization). Value of Information is non-negative for proper scoring rules.
          *   *Self-undermining (Performative):* If the forecast changes the outcome, the "truth" is counterfactual.
          *   *Constraint:* Mandate is financial stability, not just pure prediction.
          *   *Procedure:* Distinguish between "predictive accuracy" (what would happen if we did nothing) and "policy success" (preventing the crisis). Scoring must be on the *counterfactual* or the forecast must be labeled as "conditional on policy."
