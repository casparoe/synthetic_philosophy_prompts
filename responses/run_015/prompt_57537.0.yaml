answer: |-
  # STANDARD OPERATING PROCEDURE 4.1: FORECAST SCORING AND FEEDBACK
  **Authority:** Financial Stability Forecasting Unit  
  **Effective:** Immediate  
  **Review Cycle:** Annual  
  **Owner:** Unit Director  

  ## PURPOSE
  To evaluate analyst forecasts using strictly proper scoring rules grounded in accuracy-first epistemology. This procedure minimizes folklore and maximizes incentive compatibility, ensuring that the score an analyst expects to receive is maximized only when they report their true credence.

  ## TIME BUDGET
  Approx. 20 minutes per analyst per filing cycle.

  ---

  ## PROTOCOL: THE FOUR DECISIONS

  ### 1. CHOICE OF SCORING RULE
  **Test:** Identify the forecast type (Binary, Categorical, Continuous). Select the rule from the Matrix below. Verify the rule is *strictly proper* (maximizes expected score only at true credence).

  **Matrix:**
  *   **Binary (e.g., Bank Failure):** Logarithmic Score ($S = \ln(p)$ if event occurs, $\ln(1-p)$ if not).
  *   **Categorical (3-8 outcomes):** Logarithmic Score (multinomial).
  *   **Continuous (e.g., GDP Growth):** Continuous Ranked Probability Score (CRPS).

  **Sufficient Answer:** The rule is selected from the Matrix. No ad-hoc adjustments.
  **Output:** A numerical score for the filing. For Binary Log Score: If an analyst reports $p=0.001$ and the event happens, Score = $\ln(0.001) \approx -6.9$. If they report $p=0$ and it happens, Score = $-\infty$ (System Error: Filing Rejected).
  **Theoretical Basis:** Strict propriety ensures truth-telling is the dominant strategy. Logarithmic score is *local* (depends only on the probability assigned to the actual outcome) and corresponds to information gain (KL divergence).

  > **[JUDGMENT CALL / MARGIN]**
  > *Theory dictates "use a strictly proper rule." It does **not** dictate **which** proper rule.*
  > *   **Why Log over Brier (Quadratic)?** Brier is bounded; Log is not. Theory does not mandate unboundedness. We choose Log for Binary/Categorical because it penalizes extreme overconfidence (assigning 0 to an event that happens) infinitely, which aligns with our mandate to avoid catastrophic surprise. This is a **value judgment on risk tolerance**, not a derivation from epistemology.
  > *   **Why CRPS for Continuous?** Log score for densities is unit-dependent and sensitive to outliers. CRPS is proper and robust. This is a **pragmatic convenience**, not a theoretical necessity.

  ### 2. GRANULARITY AND BINNING
  **Test:** Is the partition (set of bins) fixed for this forecast class?
  **Rule:** All partitions are fixed by the Unit Director annually. Analysts cannot select bin boundaries for scored filings.
  **Sufficient Answer:** The analyst's probabilities sum to 1 over the *pre-defined* bins.
  **Output:** If an analyst submits custom bins, the filing is returned uncorrected. Score = 0 for the cycle.
  **Theoretical Basis:** Dominance arguments for scoring rules hold relative to a *fixed* partition. Refining a partition changes the maximum possible resolution. Comparability across analysts requires a common reference class.

  > **[JUDGMENT CALL / MARGIN]**
  > *Theory states scores are partition-relative. It does **not** state partitions must be **fixed across analysts**.*
  > *   **Why fixed bins?** To compare Analyst A to Analyst B, they must face the same epistemic task. If A chooses coarse bins and B chooses fine bins, B has a harder task. Equalizing the task is an **administrative fairness constraint**, not an epistemic truth.
  > *   **Consequence:** We sacrifice potential information gain (from finer bins) to maintain comparability. This is a **managerial trade-off**.

  ### 3. EVIDENCE, SELF-UNDERMINING, AND MANDATE
  **Test:** Did the analyst acquire new relevant evidence mid-cycle? Did the forecast itself alter the probability of the event (performativity)?
  **Rule A (Evidence):** Analysts must update on all free, relevant evidence immediately. Ignoring evidence is a procedural violation.
  **Rule B (Performativity):** If a forecast triggers an intervention that prevents the event (e.g., warning prevents bank run), the score is calculated against the *counterfactual* outcome (what would have happened without intervention), as determined by the Ex-Post Review Committee.
  **Sufficient Answer:** 
  1. Evidence log updated. 
  2. If performative, flag for Committee review.
  **Output:** Updated credence filed. If performative, score delayed until counterfactual estimated.
  **Theoretical Basis:** Accuracy-first epistemology (e.g., Greaves/Wallace) establishes that the Value of Information is non-negative for proper scoring rules. Maximizing expected accuracy *never* recommends declining free evidence.

  > **[JUDGMENT CALL / MARGIN]**
  > *Theory says **never** ignore evidence.*
  > *   **The Conflict:** Our mandate is *Financial Stability*, not *Pure Prediction*. Sometimes, publishing a true credence causes the instability we forecast.
  > *   **The Override:** If the Mandate requires suppressing a forecast to prevent a run, we are **sacrificing accuracy for stability**. This procedure forces the "Counterfactual Score" to maintain the analyst's epistemic incentives, but the *publication* decision is a **Policy Value Judgment**, not an epistemic one.
  > *   **Hard Truth:** If maximizing expected accuracy recommends declining evidence, the scoring system is misaligned with the mandate. Here, we align the *score* with accuracy, but the *action* with the mandate.

  ### 4. IMPRECISE AND HEDGED FILINGS
  **Test:** Is the filing a point estimate (single distribution/credence)?
  **Rule:** Intervals (e.g., "10% to 30%") or sets of distributions are **rejected** for scoring.
  **Sufficient Answer:** Analyst must convert interval to a point (e.g., midpoint) or specify a single distribution before submission.
  **Output:** If an analyst submits an interval, the system auto-converts to the midpoint for scoring, with a flag on the analyst's record for "Hedging."
  **Theoretical Basis:** Proper scoring rules are defined over precise probability functions. Imprecise probabilities do not have a unique expected score; allowing them allows analysts to evade penalty (dilution of responsibility).

  > **[JUDGMENT CALL / MARGIN]**
  > *Theory requires precise credences for scoring.*
  > *   **The Coercion:** Forcing a point estimate when an analyst feels genuine ambiguity may induce **false confidence**.
  > *   **Why we do it:** Without a point, the scoring rule cannot function. We prioritize **incentive compatibility** over **expressive completeness**. This is an **institutional constraint**.

  ---

  ## CASE RUNS

  ### Case (a): The "Right" Forecast, Wrong Outcome
  **Scenario:** Analyst reported 0.02 for failure. Institution failed. Analyst proposes filing 0.02 again next quarter, arguing the report was epistemically correct (calibrated) and the outcome was just bad luck.
  **Procedure Application:**
  1.  **Score:** The Log Score for $p=0.02$ given event=1 is $\ln(0.02) \approx -3.9$. This is a severe penalty.
  2.  **Filing:** The analyst may file 0.02 again *if* their evidence has not changed.
  3.  **Feedback:** The score stands. The system does not adjust for "bad luck" in a single period.
  **Deliverable:** Analyst receives a low score. Performance review notes the error.
  **Director's Note:** *This is the unwelcome conclusion.* I do not like punishing an analyst who was epistemically virtuous (calibrated) but suffered a realization from the tail. However, the procedure **must** accept this.
  **Why Accept:** Scoring rules are *ex-post* realization measures. If we adjust scores for "calibration" in real-time, we break the incentive to report true credences. Analysts would claim "I was calibrated" to escape penalties. The system prioritizes **incentive compatibility** over **individual fairness** in the short run.

  ### Case (b): The IT Proposal (Log vs. Quadratic)
  **Scenario:** IT proposes switching distributional forecasts from Logarithmic to Quadratic (CRPS/Brier) because Log is "punitive" and analysts complain.
  **Procedure Application:**
  1.  **Test:** Check Matrix (Decision 1). Binary/Categorical = Log. Continuous = CRPS (which is quadratic-like).
  2.  **Analysis:** For Binary (Bank Failure), switching from Log to Brier (Quadratic) reduces the penalty for assigning near-zero probability to a crisis. Log penalizes $p=0.001$ much more severely than Brier.
  3.  **Decision:** **Reject** the switch for Binary/Categorical events. Maintain Log Score.
  **Deliverable:** IT instruction denied for failure-risk forecasts.
  **Why:** The "punitive" nature of the Log score is the feature, not the bug. It enforces caution on tail risks. Quadratic scoring allows analysts to be overconfident on tails without sufficient penalty.

  ### Case (c): The Granularity Gambit
  **Scenario:** Analyst splits a 3-bin inflation forecast into 8 bins mid-year, noticing coarse rules reward sharpness near the true value.
  **Procedure Application:**
  1.  **Test:** Check Partition Rule (Decision 2). Are bins fixed? Yes.
  2.  **Action:** Filing rejected. Analyst instructed to map probabilities back to the 3 official bins.
  3.  **Score:** Calculated only on the 3 official bins.
  **Deliverable:** Analyst's finer resolution is discarded for scoring purposes.
  **Why:** Comparability across the unit requires fixed partitions. Allowing dynamic binning allows analysts to game the score (e.g., by creating bins where they know probability mass is zero).

  ---

  ## LIMITATIONS AND EPISTEMIC COSTS

  This procedure is a tool, not a truth machine. It will generate systematic failures and distortions that you, the Director, must own.

  **1. The Luck/Skill Conflation**
  The procedure cannot distinguish between a well-calibrated 0.02 forecast that realizes (Case a) and a negligent 0.5 forecast that realizes. Both get similar scores in isolation.
  *   **Consequence:** Good analysts will be penalized for bad luck in short cycles.
  *   **Mitigation:** You must aggregate scores over time (3+ years) to reveal skill. Do not fire on a single quarter's score.

  **2. The Distortion of Topic Choice**
  Analysts will optimize for what is scored, not what matters. If we score inflation tightly but financial innovation loosely, analysts will shift effort to inflation.
  *   **Consequence:** The unit may become accurate on irrelevant variables and blind to un-scoreable risks.
  *   **Responsibility:** **You (The Director)** must decide what gets scored. This is a **value judgment** on what constitutes "stability," not an epistemic fact.

  **3. The False Precision Mandate**
  By forcing point estimates (Decision 4), we teach analysts to hide ambiguity. Real-world uncertainty is often imprecise (Knightian).
  *   **Consequence:** We may cultivate overconfidence. Analysts will learn to guess a number to satisfy the system, even when their evidence supports only a range.
  *   **Responsibility:** **You (The Director)** must weigh the need for scoring against the risk of induced overconfidence. There is no theoretical fix for this; it is a trade-off between **measurability** and **honesty**.

  **4. The Performative Paradox**
  In Decision 3, we score the counterfactual if the forecast prevents the crisis.
  *   **Consequence:** We are scoring a fiction. The "truth" never happened.
  *   **Responsibility:** The **Ex-Post Review Committee** must determine the counterfactual. This is a **political/judgment call**. There is no fact of the matter about what *would* have happened. You are outsourcing epistemic authority to a committee to preserve the scoring system's integrity.

  **5. The Value of the Scoring Rule**
  The choice of Log vs. Quadratic (Decision 1) is not neutral. Log assumes the cost of error grows infinitely as confidence rises. Quadratic assumes it grows linearly.
  *   **Consequence:** By choosing Log, we implicitly state that being confidently wrong is infinitely worse than being vaguely wrong.
  *   **Responsibility:** This is **philosophical work** disguised as procedure. You are asserting a specific utility function for the state. No amount of procedural tidiness conceals this. You own this value.

  **FINAL DIRECTIVE:**
  Run this procedure. Accept the friction it causes. When an analyst complains that the system is "unfair" (Case a) or "too harsh" (Case b), show them this document. Remind them that we are not optimizing for their comfort, nor for our peace of mind. We are optimizing for the only thing that keeps this authority legitimate: **the accuracy of our warnings.**
