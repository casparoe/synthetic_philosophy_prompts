  ### The Principle of Public Derogatory Activation

  **Definition D (What counts as a slur):**
  A term *T* is a slur relative to a group *G* iff *T* is conventionally linked within a speech community to a derogatory kind *K*, where membership in *K* is ascribed to *G* in virtue of **what they are** (immutable or deeply ascribed traits) rather than **what they have done**.
  *   *Forcing Case:* **Case 8 & 9.** This clause distinguishes *S* and *tinskins*-at-humans (ascribed kind) from *scab*, *glory-hunter*, or *toff* (voluntary actions/class). It explains why *tinskins* feels nastier when applied to humans (Case 9): it shifts from describing a function to ascribing a nature.
  *   *Verdict Carried:* Explains why *S* is not fine (Case 8) while *toff* is, and why *tinskins* changes status based on target ontology (Case 9).

  **Principle O (When an utterance is offensive):**
  An utterance of *T* is offensive iff it is a **public act** that (i) is **recognised by at least one audience member** as invoking the derogatory kind *K*, and (ii) lacks a **contextual licence** that neutralises the derogatory illocutionary force.
