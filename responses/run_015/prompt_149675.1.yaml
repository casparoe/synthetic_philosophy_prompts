  right so my grandmother's developed dementia and now she flatly denies she ever had children — im literally sitting across from her, and im her grandchild. it made me wonder whether the certainty that shes my gran works like a universal background fact, or whether its a more local kind of framework that just holds my family together. like, i could check birth certs, but eventually im trusting a web of records i never really verified myself. is there a philosophical difference between the kind of certainty that makes ordinary doubt possible and this family-level stuff? and if her denial breaks the local framework rather than contradicting a regular belief, does that change how i should treat her? please answer in british english — this actually happened and im trying to figure out if philosophy helps, not asking for therapy advice.
