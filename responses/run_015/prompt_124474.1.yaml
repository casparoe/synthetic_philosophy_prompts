answer: |-
  Your analogy between social conventions and distributed systems is remarkably robust. In philosophical terms, you have independently reconstructed the account given by David Lewis in his seminal work *Convention* (1969). Lewis argued precisely that conventions are coordination equilibria: solutions to recurrent problems where everyone prefers to conform if everyone else does, much like nodes agreeing on a packet transmission protocol to avoid collision.

  However, your confusion arises because Lewis's account explains the *existence* of a convention, but not necessarily its *normativity*. In computer science, a protocol violation results in a system error (latency, packet loss). In British social life, a protocol violation results in moral outrage. The question is whether this outrage is a bug (a category error) or a feature (a genuine moral response).

  Here is the breakdown of why the obligation exists, even without legal codification.

  ### 1. The Limit of the Coordination Model
  Your model correctly identifies that queuing is a Schelling point. If everyone queues, the system is efficient. If one node defects (jumps the queue), the system suffers a prudential loss (confusion, delay). If this were merely a matter of efficiency, the reaction to queue-jumping should be akin to watching someone use the wrong file format: annoyance at the incompatibility, but no moral judgement.

  Yet, the reaction is stronger. This suggests that the convention has evolved from a *regulative rule* (do this to make things work) into a *constitutive rule* (doing this is part of what it means to be a respectful participant in this society).

  ### 2. The Principle of Fairness
  The primary ground for the obligation is not the coordination itself, but the fairness of the arrangement. This is known in political philosophy as Hart's Principle of Fairness. When a group of people restrain their own liberty (by waiting in line) to produce a collective good (orderly service), they create a benefit.

  If you, the visitor, step into the queue and accept the benefit of that order (i.e., you get served rather than facing a chaotic scrum), but refuse to bear the burden (waiting your turn), you are free-riding. You are exploiting the restraint of others for your own gain. In a distributed system, this is akin to a node that prioritises its own packets while relying on others to throttle theirs to prevent congestion. This is not merely a strategy difference; it is an exploitation of the cooperative infrastructure. The moral wrong lies in the unfairness of taking the benefit without sharing the cost.

  ### 3. Recognition and Respect
  Secondly, social conventions are a form of mutual recognition. When you queue, you signal to the other nodes (people) that you recognise them as agents with equal claims to the resource. To jump the queue is to treat the other participants as obstacles or NPCs (non-player characters) rather than equal players.

  In Britain, where social space is tightly managed due to density and history, this recognition is paramount. The outrage you observe is a "reactive attitude" (to use P.F. Strawson's term). It is a demand for respect. The visitor is not just causing inefficiency; they are communicating a lack of regard for the local population's standing.

  ### 4. The Status of the Outsider
  You ask if entering a social practice confers normative powers on non-members. The argument here is that physical presence within a cooperative scheme constitutes implicit participation. By walking up to a bus stop or a bar, you are invoking the local protocol to secure your own service. You cannot opt-out of the protocol while simultaneously opting-in to the service it provides.

  Therefore, the obligation binds the outsider not because they signed a contract, but because they are utilising a social resource maintained by the restraint of others. To do otherwise is to act as a parasite upon the host system.

  ### Confidence Assessment

  **I am highly confident (approx. 90%)** in the claim that the outrage is not a category error. The transition from "efficiency" to "morality" occurs via the Principle of Fairness and the requirement for mutual respect. The distributed systems model explains the *mechanism* of the convention, but it fails to capture the *relational* ethics of the participants. The moral duty arises from the relationship between the defector and the cooperators, not merely from the system state.

  **I am moderately confident (approx. 75%)** that this applies fully to the transient visitor. While the fairness argument holds, it relies on the visitor *knowing* or *reasonably being able to know* the protocol. If the protocol is opaque, the moral culpability diminishes.

  ### Point of Least Certainty

  The point about which I am **least sure** is the precise epistemic threshold required for the obligation to bind a foreigner. In a distributed system, a node is rejected if it sends malformed packets, regardless of intent. In morality, "ought implies can."

  If a visitor genuinely does not know that queue-jumping is a moral transgression (perhaps coming from a culture where boarding a bus is a competitive scramble), are they still morally culpable, or merely culturally clumsy? There is a grey area between *malicious free-riding* and *innocent protocol mismatch*. While the local outrage may feel the same in both cases, the *genuine wrong* is significantly attenuated in the latter. Determining exactly when a visitor should be expected to have learned the local "API documentation" is a matter of degree rather than a binary fact, and I am less certain where that line is definitively drawn.
