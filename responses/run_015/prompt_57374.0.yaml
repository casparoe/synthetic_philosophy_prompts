answer: |-
  1. **Ranking and Scoring (Adequacy as a State Apology)**

  *   **E (9.5/10):** This is the only draft that combines specific factual acknowledgment with unconditional responsibility. It refuses to set limits on restitution ("Whatever you tell us to do next") and acknowledges the ongoing structural benefit the state derives from the crime ("men who draw pensions... I draw a salary"). A survivor hears their reality confirmed without being asked to pay for the privilege.
  *   **B (6.0/10):** It correctly identifies state continuity ("same seal, same treasury") and offers concrete justice (files, prosecution), which is vital. However, the "In return" clause transforms the apology into a legal settlement requiring silence and forgiveness, which invalidates the remorse as coercive.
  *   **F (5.0/10):** Morally honest but institutionally void. It offers personal truth ("I signed things") which survivors may respect, but it explicitly abdicates the state's responsibility ("I will not... make my country apologize"). It functions as a confession, not a state remedy.
  *   **A (3.5/10):** It offers material repair (museum, language funding) but denies moral responsibility ("This government did not order it"). This frames justice as charity from a successor state rather than obligation from a continuous one, which insults the survivor's experience of ongoing harm.
  *   **D (2.0/10):** This commits the sin of false equivalence. By invoking "highland brigades" to dilute state crimes, it shifts blame onto the victims and demands a "mutual" apology where power dynamics make mutuality impossible.
  *   **C (1.0/10):** The classic non-apology. Passive voice ("Mistakes were made") erases the perpetrator, and "turn to the future" demands amnesia. It is designed to protect the speaker, not acknowledge the harmed.

  2. **Failure Modes**

  *   **A: The Successor State Dodge (Fatal).** Claims regime change absolves institutional continuity. It treats the state as a corporation that can shed liability by changing management, ignoring that the roads, debt, and power structures remain the same.
  *   **B: The Transactional Gag (Fatal).** Treats apology as a contract where remorse is exchanged for legal immunity. It attempts to purchase closure rather than earn it, making the apology conditional on the victim's silence.
  *   **C: The Passive Erasure (Fatal).** Removes the agent of harm entirely. By saying "harm occurred" rather than "we harmed," it linguistically replicates the violence of erasure the survivors suffered.
  *   **D: The False Equivalence (Fatal).** Uses the violence of the oppressed to justify the violence of the oppressor. It demands moral symmetry in a situation defined by structural asymmetry.
  *   **F: The Personal Abdication (Survivable).** Shifts the burden from the institution to the individual. While fatal to the *function* of a state apology, it is narratively survivable because it offers truth, even if it offers no justice.
  *   **E: None.** This draft avoids failure modes by accepting open-ended liability.

  3. **Character Assignment**

  *   **The Sincere Character:** Put **Draft E** in their mouth. It requires a leader willing to surrender power and budget without knowing the cost. A cynic would never write "Whatever you tell us to do next" because it removes the state's control over the narrative and the treasury.
  *   **The Cynic:** Put **Draft B** in their mouth. It sounds strong and decisive ("We will prosecute") but functions as a shield ("withdraw the suits... matter is closed"). It allows the character to appear accountable while legally protecting the state from further liability.
  *   **Note on F:** Draft F could work for a sincere character who is *weak* or overwhelmed—a good man who knows the state is too corrupt to apologize through him. However, for a Prime Minister intending to lead, E is the only choice that signals actual change.

  4. **Strongest Objection to Draft E**

  Even with Draft E, a survivor in the gallery could stand and object that **you are dumping the burden of policy on the traumatized.** By saying "Whatever you tell us to do next," the Prime Minister is asking victims to become architects of their own restitution without providing a framework or guidance. This can feel like another form of abandonment: "We broke you, now you tell us how to fix you, and we might still say no." Furthermore, the admission that "we destroyed the records" may be so destabilizing that it triggers a military coup before any restitution can be paid, rendering the promise hollow.

  \answer{E > B > F > A > D > C}
