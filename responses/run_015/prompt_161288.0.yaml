answer: |-
  Here is a Q&A prep sheet tailored to your specific audience composition and the vulnerabilities of Consumer-Relative Representational Realism (CRRR).

  ### **Pre-Game Strategy**

  *   **The Concession (First 2 Minutes):** On the **Dormant Features** objection. Do not die on the hill that dormant features represent *nothing*. It is intuitively fatal. Concede that they possess *dispositional* or *potential* content, but maintain that *occurrent* content requires an active consumer. Frame this as a distinction between *representational capacity* (structural) and *representational status* (functional). This disarms the "you're denying the latent structure exists" charge while keeping your functionalist definition intact.
  *   **The Critical Reply:** The **Normativity/Misrepresentation** objection. If the teleosemanticists leave believing you have reduced representation to mere causal correlation without norms, your view collapses into instrumentalism for half the room. You must land the point that *consumer reliance* generates norms.
  *   **The Weakest Move:** Your operational definition of **"Consumer."** In your Python case, you treat attention heads as consumers. But where is the boundary? Is a single neuron a consumer? A whole layer? If the boundary is arbitrary, *Export Width* becomes arbitrary. Be prepared to defend the granularity of a "consumer" (e.g., functionally distinct readout mechanisms).
  *   **The "Hope Nobody Asks" Question:** It is not CRS (that's survivable). It is the **Global Content Problem**: *"If every internal state requires a downstream consumer to have content, and the final output layer has no downstream consumer within the network, does the network as a whole represent nothing to the world? Or do you have to break your own rule to let the network represent the task?"* (See Objection #3).

  ---

  ### **The Objection Queue (Ordered by Damage)**

  #### **1. The Normativity Gap (Teleosemanticist)**
  **The Phrasing:** "You've given me a causal story about how state $S$ influences consumer $C$. But causation isn't normativity. If $S$ occurs when $X$ is absent, and $C$ reads $S$ and fails, that's just a causal mismatch or suboptimality. Where is the *mis*representation? Without a history of selection or a proper function established by evolutionary or design history, you haven't solved the disjunction problem. You've just described a mechanism that breaks."
  **The Reply (2 min):** "I agree that bare causation isn't normativity. But on my view, norms arise from the *reliance conditions* of the consumer. $C$ is structured such that it *ought* to receive $S$ only when $X$ obtains to achieve its local objective (minimizing local loss). When $S$ occurs without $X$, $C$'s performance degrades relative to its own functional standard. The 'norm' is internal to the $S$-$C$ pairing: $S$ misrepresents $X$ *for* $C$ if $C$'s processing of $S$ systematically fails to optimize $C$'s objective in non-$X$ worlds. We don't need phylogenetic history; we need functional architecture."
  **Soft Spot:** This reduces normativity to local optimization stability. A hardline teleosemanticist will say this is just "error" in the engineering sense, not semantic "falsity."

  #### **2. The Dormant Feature Refutation (Interpretability Engineer)**
  **The Phrasing:** "In SAE work, we find features that fire rarely or only under specific fine-tuning regimes. They're structurally present in the weights. You're saying that before fine-tuning, when no head reads that direction, it has *no content*? But we can probe it. We know it's 'waiting' to be 'gender.' If content vanishes when the reader looks away, you're making representation magically ephemeral. It suggests the feature didn't exist until you read it, which contradicts the linearity of the residual stream."
  **The Reply (2 min):** "I'm not saying the *vehicle* vanishes. The vector direction exists. I'm saying *content ascription* is a functional label, not a structural one. Think of a key in a lock. The key has a shape (structure) regardless of the lock. But it is only a 'house key' relative to a house lock. Before fine-tuning, that direction is a 'potential key' for a 'potential lock.' Once the head (lock) is tuned to read it, it acquires determinate content. This explains why probing is gerrymandered: you're imposing a lock to test a key that isn't currently in use."
  **Soft Spot:** It feels like wordplay. Engineers feel the feature *is* the content. Distinguishing vehicle from content here feels like splitting hairs to save the theory.

  #### **3. The Global Content Problem (Philosopher of Science / General)**
  **The Phrasing:** "You've relativized content to downstream consumers. Fine. But the network *itself* has no downstream consumer inside the box. The output logits go to the world. So, on your view, does the network *as a whole* represent the input image? Or does representation stop at the last internal layer? If you say the 'user' is the consumer, you've abandoned the internalist causal story you built for the layers. If you say there's no content, you've made AI representational realism impossible for the system itself."
  **The Reply (2 min):** "The view scales. The output layer represents the class label *for* the loss function during training, or *for* the user during deployment. The 'consumer' doesn't have to be internal; it just has to be distinct enough to establish a counterfactual profile. The network represents the world *for* the environment that selects for its weights. I'm not an internalist about the *whole* system, only about the *parts*. This actually helps: it explains why internal layers are ambiguous (many internal consumers) while output is sharp (one external consumer)."
  **Soft Spot:** This breaks the symmetry of your view. If the "consumer" can be the external world/loss, why couldn't the "consumer" for Layer 4 be the Loss directly, bypassing your export width metric?

  #### **4. The Superposition Artifact (Interpretability Engineer)**
  **The Phrasing:** "Export width depends on identifying 'directions.' But in superposition, features are not orthogonal directions; they are polysemantic projections. Your 'split' in the 4-layer transformer might just be you finding a basis where things look orthogonal. If I rotate the basis, your export width changes. You're measuring the stability of your decomposition, not the stability of the representation."
  **The Reply (2 min):** "Export width isn't about orthogonality; it's about *causal invariance*. If I patch the vector in *any* basis, does it disrupt multiple consumers? If a direction supports counterfactuals for Head A and Head B regardless of how I decompose the space, the width is high. Superposition makes finding the direction harder, not the metric invalid. My claim is that high export width directions are the ones that survive basis rotation because they are causally robust bottlenecks."
  **Soft Spot:** If SAEs show that 'features' are sparse combinations of neurons, your 'direction' talk might look like old-school connectionism that ignores modern sparse coding results.

  #### **5. The Eliminativist Challenge (Philosopher of Science)**
  **The Phrasing:** "In biology, we kept 'gene' because it mapped to a causal mechanism (DNA). We dropped 'phlogiston' because it didn't. What prediction does 'representation' buy you here that 'causal influence' doesn't? If you just mean 'state S causally affects C,' why add the normative/semantic layer? Isn't this a placeholder that will be eliminated by a full causal graph of the network?"
  **The Reply (2 min):** "Because 'causal influence' is too dense. Every neuron causally influences every other via the residual stream. 'Representation' picks out the *specific* causal pathways that support *systematic generalization*. If I claim Layer 8 represents 'string literal,' I predict that intervening on that state will preserve behavior across all contexts involving strings, but break behavior on non-strings. A raw causal graph doesn't highlight those invariant subspaces. Representation is the compression algorithm for the causal graph."
  **Soft Spot:** Hard to prove you aren't just rebranding "high-saliency causal path" as "representation."

  #### **6. The CRS Revival (Philosopher of Mind)**
  **The Phrasing:** "This looks exactly like Conceptual Role Semantics (CRS). Content is determined by the role in the system. We rejected CRS in the 80s because it makes content holistic (change one connection, change all content) and unable to account for error. You've just added 'consumers' to save it, but you're still stuck with the same internalist circle. How is this not just Block's objections with new terminology?"
  **The Reply (2 min):** "Classic CRS was holistic and synchronous. My view is *local* and *diachronic*. Content is determined by specific downstream consumers, not the whole web of belief. And because consumers can be ablated or fine-tuned (as in my case study), we can test content changes empirically. It's CRS updated for modular, trained architectures where roles are learned, not fixed by syntax."
  **Soft Spot:** The "local" restriction is ad hoc. Why is a consumer a head and not a neuron? CRS holism might actually be the more accurate description of transformers.

  #### **7. The Gerrymandered Consumer (General)**
  **The Phrasing:** "If I can define *any* downstream process as a consumer, can't I make *anything* represent *anything*? I can train a linear probe on Layer 2 to read 'political affiliation.' That probe is a consumer. Does Layer 2 now represent political affiliation? Your view seems to allow content inflation based on how hard I try to read the signal."
  **The Reply (2 min):** "No, because of the *counterfactual-supporting* constraint. A probe that reads noise doesn't support counterfactuals. If I intervene on Layer 2 to change 'affiliation,' does the network behavior change systematically in a way that aligns with that content? If the probe is gerrymandered, the intervention will break the network or have no effect. High export width filters out gerrymandered consumers because they won't share the same counterfactual profile."
  **Soft Spot:** Probes *do* find signal in random networks sometimes. Distinguishing 'real' consumers from 'overfitted probes' relies on the same metrics you're trying to explain.

  #### **8. The Plasticity/Identity Objection (General)**
  **The Phrasing:** "In your Python case, you say the content *changes* when the direction splits. But intuitively, the network *learned* the distinction. It didn't change the subject; it refined it. If content is relative to the consumer, and the consumer changes during fine-tuning, does the content of the pre-trained model literally not exist, or was it just vague? You seem to be saying the pre-split state was indeterminate, but it looks more like it was determinate but polysemantic."
  **The Reply (2 min):** "I'm arguing it *was* indeterminate. That's the point of the divergent readout. Before the split, the system couldn't distinguish 'string literal' from 'opening quote' in its behavior. It treated them identically. Therefore, ascribing distinct content is false. The split *creates* the distinction in the system's functional economy. We shouldn't project our external distinction onto a system that hasn't computed it yet."
  **Soft Spot:** This conflicts with the intuition that the *capacity* was there. It makes content very unstable across training steps.

  ---

  ### **Final Advice**

  *   **Watch the Teleosemanticists:** They are the biggest threat to your philosophical credibility. If you concede too much to the Engineers (e.g., admitting content is just structural), the Phil Mind crowd will eat you alive. Keep the focus on *functional role* and *counterfactuals*, not just vector geometry.
  *   **The "Dormant" Pivot:** When the Engineer hits you on dormant features, pivot immediately to the **Concession** strategy. "I agree the structure is real; I'm disputing the *ascription* of content." This makes you look reasonable rather than dogmatic.
  *   **Don't Overclaim:** You are offering a *criterion* for content ascription, not a metaphysical account of what content *is*. Frame it as: "If you want to know if a net represents X, look for Export Width." This dodges the heavy metaphysical bullets from the Phil Mind crowd while giving the Engineers a useful tool.

  Good luck. The "Export Width" metric is genuinely novel; if you can defend it against the Superposition objection, you have a paper.
