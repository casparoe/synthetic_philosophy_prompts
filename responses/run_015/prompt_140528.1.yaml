answer: |-
  Before I commit to the final pair, I need to walk you through two scenarios I discarded, because they reveal why your request is philosophically treacherous.

  First, I considered a **Van Meegeren-style Vermeer**. Case A: copying *The Lacemaker*. Case B: inventing a new *Lady at the Virginals*. I threw this out because Van Meegeren's forgeries relied on chemical anachronisms (Bakelite) that made the "Hard Perceptualist" point moot—science saw the difference before the eye did. It violates your "ordinary art-historical means" constraint.

  Second, I looked at **Chinese Scroll Copying**. In that tradition, copying *is* the achievement. A perfect copy of a Wang Xizhi calligraphy is often valued higher than a weak original. I discarded this because it collapses your "Achievement Account." In that context, the copyist *shares* the achievement of the master. We need a Western, Romantic-modernist context where originality is the metric of artistic worth.

  So, here is the committed pair. We are in the **1890s Paris art market**, dealing with **Camille Corot**. Corot is ideal: his late style is soft, atmospheric, and notoriously difficult to pin down, making him the most forged artist of his century. The forger is **Étienne**, a skilled but failed painter who knows Corot's materials and techniques intimately.

  **Case A (The Copy):** Étienne sets up his easel in the Louvre (or before a private holding) in front of Corot's *Souvenir de Mortefontaine*. He paints a replica. He does not trace; he paints by eye, matching the composition, the palette, the specific arrangement of the three women and the trees. He ages the canvas, fakes the signature. It enters the market as a "newly discovered" Corot. Decades later, archival evidence surfaces (letters, receipts for the specific canvas stretchers) proving Étienne painted it in 1890, directly referencing the *Mortefontaine*.

  **Case B (The Invention):** Étienne uses the exact same batch of lead white, the same aged canvas, the same brushes, in the same year. He does not look at a specific Corot painting. Instead, he internalizes Corot's "manner"—the silvery light, the blurred foliage, the melancholic figures—and composes a *new* scene: *Souvenir de Ville-d'Avray*, a composition that never existed in Corot's oeuvre. It enters the market as a "lost masterpiece." Decades later, the same archival evidence surfaces proving Étienne painted it in 1890, working from his imagination and study of the style, not a specific source.

  ***

  ### (a) The Three Accounts

  **1. The "It's Just a Lie" Account (Priya's Baseline)**
  *   **Verdict:** Identical for A and B.
  *   **Reasoning:** The physical object—the arrangement of pigment on canvas—is the locus of aesthetic value. In both cases, the object is visually indistinguishable from a genuine Corot to the trained eye (ex hypothesi). The deception concerns the *provenance*, not the *picture*. Therefore, the aesthetic experience remains intact. The market value drops because the contract was breached, not because the art changed. Priya is right here: the pigment doesn't care about the biography.

  **2. The History-of-Production Account (Goodman-esque)**
  *   **Verdict:** Both are fakes, but the *perceptual experience* shifts differently upon revelation.
  *   **Reasoning:** In autographic art, the history of production is constitutive of the work's identity. Once the truth is out, we cannot "un-know" the history.
      *   In **Case A**, the work is now perceived as a *derivative object*. The viewer's eye is drawn to the specific decisions made by Corot in the original *Mortefontaine* and how Étienne negotiated them. You see the *gap* between the copy and the source. The painting becomes a mirror of another painting.
      *   In **Case B**, the work is perceived as a *pastiche*. There is no specific source to compare it to. The viewer sees the *style* without the *structural logic* of a specific moment in Corot's development. It looks "Corot-like" but floats free of Corot's actual artistic problems.
  *   **Note on the Hard Perceptualist (Spec 4):** Here is where I must be plain with you. If your Hard Perceptualist is *strict* (believing only retinal input matters), **Spec 4 is unsatisfiable.** If the pigment is identical, the retinal input is identical. She cannot concede a visual difference without contradicting her own definition of "visual." However, if she is a *moderate* perceptualist (acknowledging that aesthetic properties supervene on category membership), she must concede that in **Case A**, the work now possesses the aesthetic property of *being a reflection*, which is visually experiential. In Case B, it possesses the property of *being a simulation*. The *focus* of perception changes: in A, you look for fidelity to a source; in B, you look for coherence of style. I will assume for the sake of the argument that we are dealing with the moderate perceptualist, as the strict one is a philosophical zombie in this context.

  **3. The Achievement Account**
  *   **Verdict:** Different. Case B is aesthetically "richer" (though still fraudulent) than Case A.
  *   **Reasoning:** Artistic achievement involves problem-solving.
      *   In **Case A**, Étienne's problems were technical: "How do I match this blue?" "How do I replicate this brushstroke?" The compositional problems were solved by Corot. Étienne's achievement is merely mechanical fidelity.
      *   In **Case B**, Étienne had to solve compositional problems: "Where does the figure stand?" "How does the light fall?" He exercised artistic judgment, even if he disguised it as Corot's. He generated a new aesthetic object, not just a replica.
      *   Therefore, the Achievement Account comes down harder on A. A is parasitic; B is synthetic. A is a lie about *origin*; B is a lie about *authorship* but tells a truth about *capability*.

  ### (b) The Single Feature Doing the Work

  The feature is **The Target of Intentionality**.
  In Case A, the forger's intention is directed at a *specific existing object* (the *Mortefontaine*). In Case B, the forger's intention is directed at a *general style* (the "Corot manner"). This single variable drives the divergence in the Achievement Account (mechanical vs. synthetic skill) and the History Account (derivative vs. pastiche perception).

  ### (c) The Counterfactual

  If you remove this feature—if you make both cases Copies, or both cases Inventions—the pair collapses.
  *   If both are Copies: The Achievement Account loses its leverage. Both are mechanical.
  *   If both are Inventions: The History Account loses its asymmetry. Both are pastiches.
  *   Crucially, if you replace this feature with "Degree of Deception" (e.g., one lied more), the Fraud Account would differentiate them, which violates your spec. The distinction *must* remain in the mode of production to keep the Fraud Account constant (both are lies) while splitting the other two.

  ### (d) The Objection and Reply

  **The Attack:** A defender of the "Just a Lie" account (Priya) will attack the **Achievement Account**. She will say: "You are smuggling in 'genius' as a metric. If the viewer cannot tell the difference between the mechanical skill of the copyist and the synthetic skill of the inventor, then the achievement is identical *for the viewer*. The 'achievement' is a biographical fact, not an aesthetic one."

  **Does it land?** It lands partially. It correctly identifies that "achievement" is often a biographical category, not a perceptual one. However, it fails to account for **aesthetic density**. A pastiche (Case B) often contains internal tensions and resolutions that a copy (Case A) lacks, because the copyist is constrained by another's resolutions. A sensitive viewer *can* detect the "flatness" of a copy versus the "flow" of a pastiche once they know what to look for. The attack is not ad hoc, but it relies on a thin theory of aesthetic experience that ignores the complexity of the object's internal relations.

  ### (e) Who is Right? (You vs. Priya)

  You are right that the accounts are distinct, but Priya is right about the *source* of the value loss.

  The **Fraud Account** and the **History Account** are *not* the same. The Fraud Account says the value loss is external (market trust). The History Account says the value loss is internal (the work's identity changes). Your scenario proves this: in Case B (Invention), the Fraud is identical to Case A, but the History Account treats the object differently (as a pastiche rather than a clone).

  However, Priya is likely correct that for the *conservator*, the object hasn't changed. Her job is the physical substrate. Your job is the *work of art*. In philosophy, the "work" is not just the canvas; it is the canvas plus its generative history.

  **The Hard Perceptualist Concession:**
  I must reiterate: if the Hard Perceptualist is strict, **Spec 4 breaks.** You cannot force her to see a difference in identical pigment based on history alone. But if you accept Goodman's view that "knowing changes seeing," she concedes in **Case A**. Why? Because in Case A, the truth provides a *specific visual comparator* (the original *Mortefontaine*). In Case B, there is no comparator. The truth in Case A makes the painting look *dependent*. The truth in Case B makes it look *unmoored*. That is a visible difference in aesthetic relation, driven solely by the Copy vs. Invent distinction.

  **Final Word:** Hand this to Priya. Tell her she wins on the *object* (the canvas is the same), but you win on the *work* (the art is different). The "Achievement" line matters because art is not just a visual stimulus; it is a record of human action. Copying records one kind of action (replication); Inventing records another (creation). Even if the result looks the same, the record is different. And in art, the record is part of the picture.
