prompt: |-
  You're a professional philosopher — like, someone who's actually published work on authenticity in the arts, not a generalist who's read the SEP page once. Take your time with this: brainstorm two or three candidate scenarios before you commit to one, tell me which ones you threw out and why, and if any piece of the spec turns out to be unsatisfiable, say so plainly rather than quietly fudging it. I'm going to read your answer out to my friend, so it needs to survive being said out loud to someone who does this for a living.

  So here's the setup. I got into a long argument about forgeries with my friend Priya last night (she's a paintings conservator, so she's nose-to-nose with this stuff every day) and we eventually just gave up. Her position: a forgery is basically fraud and nothing more — a lie about where an object came from. The picture is exactly as good a picture the day after you find out as it was the day before, nothing in it has changed, and anyone who suddenly starts finding it ugly or hollow is being irrational and is letting the market do their looking for them. My pushback was the reattribution thing: a painting catalogued as a Rembrandt is worth tens of millions, the same painting catalogued as "workshop of Rembrandt" or "circle of" is worth a rounding error, and nobody has to lie for that to happen — the object doesn't move, the pigment doesn't change, only the story does. She said fine, but that's the market being dumb about authorship, not an aesthetic fact. Then she said something I've been chewing on since: that the "achievement" line about forgeries (what we value is what the maker actually worked out, and a copyist's achievement just isn't an originator's) and the "history of production" line (in an autographic art the object's causal history is partly constitutive of what the thing even is, so a forgery isn't the same work) are the same account wearing two different vocabularies. I said they're not — they'd come apart somewhere — and that's where we stalled, because neither of us could build the case.

  So build it for me. I want a pair of cases, Call them A and B, one paragraph each, engineered to these specs:

  1. Realistic. A museum, an auction house, a conservation studio, a collector's estate — your pick. No duplication chambers, no nanobots, no molecule-perfect replicas, no time travel. The maker of the objects is extremely good but human: good enough to fool the experts of the day, fallible enough to be caught later by ordinary art-historical means.

  2. A and B are identical in every respect you can think of except one: in A the object was produced by copying a surviving work by the master (working from reproductions, say), and in B it was invented — a new composition entirely in the master's manner, made out of the maker's own knowledge of the period, with nothing copied from any specific painting. Same maker, same level of skill, same materials, same date of making, same buyer, same moment of discovery, same consequences for the scholarly record. I want one variable, not three disguised as one.

  3. Required verdicts. State plainly what each of these says in each case, and why:
     - the "it's just a lie" account: must give the same verdict in A and B, and must predict no loss of value in the object as a work of art in either;
     - the history-of-production account (the Goodman-ish one, where the work's identity depends on how and by whom it was actually made, and where finding out the truth can change what you're able to see in it): must also give the same verdict in A and B — both are fakes, full stop — but it has to be able to say something specific and *different* in the two cases about what should come to be perceptible once the truth is out;
     - the achievement account: must give different verdicts in A and B, and I want it to come down harder on A.

  4. The bit I actually care about. There's a fourth person in the room: the hard perceptualist, the one who says if I can't see a difference then there is no aesthetic difference, and who has heard all of this before. Force her into an asymmetric position: she has to concede that the truth is visible in one of the two cases and not in the other, and that concession has to fall out of the difference in production method (copying vs. inventing), not from you stipulating that somebody notices something. Tell me which case she concedes in, and if you think she can't be forced, say that instead and explain why the spec breaks.

  5. What the case is for, so you know what counts as cheating: I want to hand Priya something that shows the achievement line and the history line are two different accounts rather than one account in two vocabularies, and that neither of them is just the fraud story in disguise. So — if the A/B difference in your scenario could be produced equally well by "one of them involved more deception" or "one of them is a better painting" or "one of them is worth more," the case has failed. The verdicts have to fall out of the theories, not be written into your description of the objects. No stipulating that anyone finds anything.

  After the two paragraphs, give me: (a) what each of the three accounts says in each case and the reasoning, (b) which single feature of the pair is doing the work, (c) what happens to the verdicts if I remove that feature — does the pair collapse into one case, and if so which one, (d) how a defender of whichever account comes out worst would attack the case, and wether that attack actually lands or is ad hoc. Its fine to tell me Im wrong about Priya — if one of us is missing something, say which one and what.
