  This pattern diverges from Popperian *ad hoc* hypotheses because the added conditions (temperature, density) possess nominal physical plausibility, avoiding the immediate stigma of arbitrary clauses like "except on Tuesdays." Unlike a Lakatosian protective belt, which augments auxiliary theories to explain anomalies while maintaining the core, this strategy restricts the domain of applicability rather than expanding explanatory power. A Lakatosian shift is degenerating only if it fails to yield novel predictions; here, the restriction itself precludes novel prediction by making validity contingent on prior success. Regarding Goodman's *grue*, the asymmetry is structural rather than predicate-based. *Grue* alters how properties project from observed to unobserved objects; this pattern alters how theory validity projects from observed to unobserved contexts. The divergence lies in the locus of instability: *grue* corrupts the predicate, while this pattern corrupts the boundary conditions of the theory's jurisdiction, creating a domain that fits past data perfectly but offers no traction on future cases without retrospective calibration. In standard auxiliary hypotheses, a factor like air resistance is assumed present or absent based on independent measurement. Here, the factor is invoked as decisive only when the theory fails. This retrospective activation distinguishes it from standard model specification. In Lakatos, the belt protects the core; here, the belt shrinks the world where the core applies. It is a degenerating problemshift focused exclusively on domain exclusion. The *grue* parallel is strong regarding projection, but *grue* is about classification, whereas this is about causal scope. The pattern effectively makes the theory's truth conditional on the history of its testing, violating the requirement that natural laws be time-and-place invariant.

  2. "Boundary conditions: what it is and is not"
  Inclusion requires three criteria: iterative scope restriction, parameters defined internally to the theory, and threshold calibration tracking specific failures. A clear instance is a behavioral economic model claiming "Agents maximize utility," which adds "except under cognitive load" after failures, then "unless social signaling overrides" after further failures, where each threshold matches the anomaly exactly. This fits because the conditions carve out success zones post-hoc. A near-miss exclusion is the refinement of Newtonian mechanics into Special Relativity. While Newtonian physics fails at high velocities, this was not a scope restriction added to Newtonianism to save it; it was a replacement theory with new core axioms. Similarly, adding a control variable in a regression based on a pre-registered plan is excluded, as the condition was not triggered by the failure itself. The edge lies in whether the parameter's relevance was established independently of the anomaly it resolves. If the parameter exists only to exclude the failure, it fits the pattern; if it was theoretically motivated prior to the data, it is standard refinement. The crucial boundary is temporal: did the theorist know parameter X mattered before seeing the failure? In the included case, X is discovered because the theory failed. In the excluded case, X is known to matter, and the theory is updated to reflect that known boundary. This renders the theory retrospectively robust but prospectively useless.

  3. "Identification or coinage"
  No established concept captures this precisely. "Ad hoc" is too broad; "degenerating problemshift" lacks the domain-specific focus. I propose the term **"Projective Domain Carving."**
  Definition: A theory revision strategy wherein scope conditions are iteratively appended to exclude anomalies, defined by internal parameters whose threshold values are calibrated solely against observed failures, rendering the theory's applicability conditionally dependent on prior knowledge of outcomes.
  Justification: "Projective" captures the Goodman-like asymmetry in how conditions apply to observed versus unobserved cases. "Domain Carving" specifies that the revision restricts the theory's jurisdiction rather than adjusting its internal mechanics. This distinguishes it from auxiliary hypothesis addition, which explains how the core works in new conditions, whereas this strategy dictates where the core works based on retrospective fitting. It formalizes the intuition that the theory is being sculpted to fit the data contour rather than generalized to cover it. The term highlights the active shaping of the empirical field to match the theory, rather than shaping the theory to match the field. It implies a reversal of the scientific direction of fit. By naming it, we isolate a specific form of degeneration that escapes standard Lakatosian critique because each individual step looks like reasonable scope specification, masking the cumulative gerrymandering of the theory's valid space.

  4. "What would change this assessment"
  I would revise this if scope parameters (X, Y) could be measured independently before application. If "cognitive load" is quantified prior to testing, and the threshold fixed by independent theory, the pattern collapses into standard boundary specification. The weakest point is reliance on historical intent: distinguishing "discovering a real boundary" from "carving a fake one" depends on reconstructing the theorist's timeline, which is ambiguous. Real phase transitions initially resemble this pattern. If independent causal mechanisms are later validated for the restrictions, the charge of projective carving is negated.

  My assessment hinges most vulnerably on the distinction between post-hoc fitting and legitimate boundary discovery.
