              *   Wait, let's look at the "Package" convention in the prompt: "SIA supplying the update from the fact that you exist at all and SSA the update from which observer you are."
              *   Standard "SSA+SIA" package (often called SIA* or just SIA in some lit, but here distinguished):
                  *   Prior: Equal (before anthropic).
                  *   SIA Update: Weight by $N_{total}$. (Big gets $10^{18}$, Sml gets $10^9$).
