  2.  **Deconstruct the Boltzmann Brain Problem (BBP):**
      *   *Core Issue:* In an eternal, high-entropy universe (like de Sitter space), thermal fluctuations producing isolated brains with false memories are vastly more probable than fluctuations producing whole ordered universes with evolutionary history.
      *   *Epistemic Crisis:* If BBs dominate the "observer count," then *I* am likely a BB. If I am a BB, my memories (including the physics that led me to believe I'm a BB) are false. This undermines the theory itself (cognitive instability).

  3.  **Drafting the Requirements List (Iterative Process):**

      *   *Req 1: Empirical Adequacy (Fitting Data).*
          *   *User's point:* BBs have "data" too (hallucinated data).
