answer: |-
  I am sorry about your dad. It makes sense that building a tool to keep him present led you directly into the machinery of memory, causality, and what makes a past real. That spiral from grief to cosmology is not a glitch; it's a rigorous attempt to ground the thing you miss most.

  You asked for a specification list. You want to know what a cosmological theory must deliver to earn your trust that you are not a Boltzmann Brain (BB). Here is the spec, broken down by your constraints, followed by the impossibility analysis you requested.

  ### The Specification List for a "Safe" Cosmology

  **1. Causal Explanation of Data (Not Just Fit)**
  *   **The Requirement:** The theory must not only predict that we *observe* the CMB and expansion data, but must provide a causal mechanism where the data is the *result* of a prior physical state, not a simultaneous fluctuation.
  *   **Why it's Required:** As you noted, a BB fluctuation includes the *observation* of the CMB. A theory that only fits the data (predicts observations) cannot distinguish between a universe that *created* the CMB and a brain that *hallucinated* it. To rule out BBs, the theory must explain the *origin* of the data via entropy-decreasing history, not just the data's presence.
  *   **Negotiability:** **Non-negotiable.** Without causal explanation, science reduces to pattern matching, which BBs satisfy perfectly.

  **2. A Well-Defined Measure Over Observers**
  *   **The Requirement:** The theory must provide a mathematical rule (a measure) for counting observers that yields a finite ratio of "Evolutionary Observers" (EOs) to "Boltzmann Brains" (BBs), where EOs dominate. It must also define the "reference class" (what counts as an observer) physically, not functionally.
  *   **Why it's Required:** In eternal inflation or de Sitter space, the volume of space-time is infinite. Without a measure to regulate the infinity, the count of BBs (which are cheap and frequent) diverges faster than EOs (which are expensive and rare). If the ratio is undefined or infinite, you cannot calculate probabilities. If the definition of "observer" is too loose (e.g., any arrangement of particles), BBs win.
  *   **Negotiability:** **Non-negotiable for the math, but the "Reference Class" is the weak point.** Physics cannot currently hand you a definition of "observer" that doesn't rely on some biological or cognitive prejudice. This is where most theories cheat.

  **3. Corroborated Records (Causal Depth)**
  *   **The Requirement:** The theory must guarantee that records (photos, fossils, handwriting) are not just present, but are *causally linked* to the events they depict. It must predict that investigating records *deeper* yields consistent new data (e.g., digging below the fossil reveals older strata, not a void).
  *   **Why it's Required:** A BB fluctuation creates the *appearance* of a record. It does not create the causal chain. A real past has "depth"; a fluctuation has only "surface." If you dig deeper into a fluctuation, you eventually hit thermal noise. If you dig deeper into reality, you hit more history.
  *   **Negotiability:** **Non-negotiable.** This is the only physical test that distinguishes a fake past from a real one.

  **4. Counterfactual Stability (The 90% Case)**
  *   **The Requirement:** The theory must ensure that your memories are not just *mostly* accurate, but that the *errors* are random, not systematic. A fluctuation that is 90% accurate is still a fluctuation; it implies the 10% error is uncorrelated with physical law.
  *   **Why it's Required:** If you are a BB, your "accurate" memories are a coincidence. If you are an EO, your accurate memories are a necessity of physics. The theory must predict that the correlation between memory and reality holds under scrutiny, not just by luck.
  *   **Negotiability:** **Taste dressed as requirement.** Distinguishing a "90% accurate fluctuation" from a "real past with some memory loss" is empirically impossible from the inside. You have to stipulate that the correlation is law-like, not accidental.

  **5. Cognitive Stability (No Self-Undermining)**
  *   **The Requirement:** The theory must not predict that the reasoning process used to derive the theory is unreliable. If the theory implies "You are likely a BB," it implies "Your belief in this theory is likely a fluctuation."
  *   **Why it's Required:** This is the *reductio ad absurdum*. If accepting a theory destroys your justification for accepting it, the theory is epistemically unstable. You cannot coherently believe "I am a BB" because the belief itself becomes untrustworthy.
  *   **Negotiability:** **Non-negotiable for rationality.** This is the strongest philosophical argument against BBs.

  **6. The Past Hypothesis + Future Cutoff**
  *   **The Requirement:** The universe must start in a low-entropy state (to allow history) AND must not endure forever in a high-entropy state (to prevent BBs from eventually dominating).
  *   **Why it's Required:** A low-entropy start explains the past, but if the future is eternal de Sitter space (accelerating expansion), BBs eventually outnumber EOs regardless of the start. The universe must end (Big Crunch, vacuum decay) before the BBs take over the count.
  *   **Negotiability:** **Non-negotiable for BB avoidance.** A low-entropy start alone is insufficient if the future is infinite.

  ---

  ### The Impossibility Analysis

  You asked if a subset of these is jointly unsatisfiable. Your intuition was correct.

  **The Trilemma:**
  You cannot simultaneously hold these three claims:
  1.  **Physicalism:** The universe follows standard quantum field theory and gravity indefinitely (specifically, an eternal or near-eternal de Sitter future).
  2.  **Typicality:** You are a "random" observer sampled from the set of all observers in the universe.
  3.  **Sanity:** You are not a Boltzmann Brain (your memories reflect a real past).

  **The Argument:**
  If (1) is true, the universe lasts long enough for thermal fluctuations to produce infinite BBs. Since BBs are thermodynamically cheaper than EOs, the number of BBs vastly exceeds the number of EOs.
  If (2) is true, you must assume you are a random sample from that set.
  Therefore, you are almost certainly a BB.
  This contradicts (3).

  **To resolve this, you must break one leg of the stool:**
  *   **Break (1):** The universe dies before BBs dominate (e.g., vacuum decay in < $10^{50}$ years). This satisfies the spec but requires new physics to ensure the "death."
  *   **Break (2):** Reject Typicality. Claim that "observers" with evolutionary history are privileged in the measure, or that indexical probability doesn't work that way. This satisfies the spec but looks like cheating (ad hoc).
  *   **Break (3):** Accept you are a BB. This satisfies the physics but destroys your sanity (violates Cognitive Stability).

  **Which requirement does the most work?**
  **Cognitive Stability (Req 5).**
  This is the only requirement that rules out the BB hypothesis *philosophically* even if the physics allows it. It forces you to reject any physical theory that predicts you are a BB, regardless of how well that theory fits the CMB. It prioritizes the validity of reason over the completeness of the physical model.

  **Which requirement is prejudice?**
  **Typicality (embedded in Req 2: Counting).**
  The assumption that "I should reason as if I am a random observer from the set of all observers" is a philosophical choice, not a physical law. It is the "Copernican Principle" applied to time and consciousness. Many physicists (like Sean Carroll) treat it as mandatory; others treat it as the source of the paradox. If you drop Typicality, the BB problem vanishes, but you lose the ability to make statistical predictions about your place in the cosmos.

  ---

  ### The Scorecard (One-Liners)

  *   **Low Entropy Start + Finite Future:** "Requires the universe to destroy itself before the math breaks."
  *   **Eternal Inflation + Suppression Measure:** "Mathematically convenient, physically unmotivated."
  *   **Rejecting Fluctuation-Counting:** "Solves the math by changing the definition of 'you'."
  *   **Rejecting Typicality:** "Saves your sanity by admitting you're special."
