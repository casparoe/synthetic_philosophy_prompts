          *   *Necessity:* Non-negotiable. Without this, it's not science.

      *   *Req 2: The Measure/Counting Problem.*
          *   *User's point:* How do we count? What counts as an observer?
          *   *Refinement:* The theory needs a well-defined measure over observer-moments that doesn't diverge in favor of BBs. It needs to define "observer" physically, not just functionally, to avoid the "minimum physical thing" issue.
