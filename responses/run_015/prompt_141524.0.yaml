  5.  **Identifying the "Workhorse" and the "Prejudice":**
      *   *Workhorse:* Cognitive Stability (Self-Undermining). This is the philosophical hammer that kills the BB hypothesis as a rational belief.
      *   *Prejudice:* "Typicality" (The Copernican Principle applied to observers). Assuming you are a "random" observer is the step that allows the BB math to overwhelm you. Rejecting typicality (indexical uncertainty) is a way out, but feels like cheating to some.

