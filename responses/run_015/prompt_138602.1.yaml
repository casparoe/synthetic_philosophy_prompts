  2.  **Part 1: Applying Augustine to Watergate (Mapping the Episode)**

      *   *Theory Recap:* Lie = $False Statement + Intent to Deceive$. All lies = Sin. Hierarchy exists (malicious > officious). Silence/Evasion $\neq$ Lie (strictly).
      *   *Fact Mapping:*
          *   *Public Denials:* Nixon saying "I am not a crook" or aides saying "No involvement." If they knew it was false, it's a lie.
          *   *Secret Payments:* Hush money. This is an action, not a statement. Augustine focuses on speech. However, the *agreement* to pay involves communication.
          *   *Destruction of Evidence:* Action. Not a lie in the strict sense, but concealment.
          *   *Instructions to CIA:* Nixon asking CIA to tell FBI to stop. If the justification given to CIA was false (e.g., "national security" vs. "political cover"), that's a lie to the CIA.
          *   *False Testimony:* Under oath. Clear lies if they knew the truth.
          *   *Claims of Failed Memory/Technical Truth:* "I don't recall" or literally true but misleading statements. Augustine says if the speaker believes it's true (or literally true), it's *not* a lie in the strict sense, though potentially sinful concealment.
      *   *Ranking:* Augustine distinguishes lies told to save a life (less grave) from lies told to harm (most grave). Watergate lies were to protect power/reputation. Augustine would likely classify these as lies told for "temporal advantage" or to avoid shame, which are serious, but perhaps distinct from lies told purely to injure an innocent. However, since they perverted justice, they lean toward the harmful end.
      *   *Political End:* Augustine is absolute. "No good end can make a lie permissible." Protecting the Presidency is a "good" in a temporal sense, but not sufficient to justify sin. The end does *not* mitigate the sinfulness of the lie itself, though the *motive* (protecting office vs. personal gain) might affect the *grade* of sin within the hierarchy (officious vs. malicious).

  3.  **Part 2: Testing Augustine with Watergate (Evaluating the Theory)**

      *   *Motivated Nescience (Willful Ignorance):*
          *   *Scenario:* Aide avoids knowing details so they can truthfully say "I don't know."
