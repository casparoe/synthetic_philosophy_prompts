answer: |-
  Good morning. Looking around the room, I see a fascinating divide. On my left, we have city planners who are here to talk about housing supply, transit lines, and, frankly, the quality of the coffee. On my right, we have social choice theorists who likely already know that the coffee distribution is Pareto inefficient.

  My goal this morning is to bridge that gap. We are here to discuss "Participatory Zoning" and the idea that neighborhoods should have the right to choose their own character. It sounds uncontroversial. But I want to use a specific theoretical tool to show why this intuition contains a hidden trap.

  I'm talking about Amartya Sen's Liberal Paradox.

  For the planners: Don't tune out. This isn't abstract math; it's a structural warning about what happens when we decentralize power. For the theorists: I ask for your grace. I am going to adapt Sen's framework from *individuals* to *neighborhoods* to make the point concrete. I will flag where I'm stretching the formalism.

  Here is the scenario. Imagine a city with two neighborhoods, Block A and Block B. And imagine a resident, Alice. Alice has a simple preference: she wants to live in Block A, which is near her job in Block B.

  Now, let's grant "Minimal Liberalism" to the blocks. In Sen's terms, this means each block is "decisive" over at least one pair of social states regarding its own zoning. Block A decides whether it allows high-density housing. Block B decides whether it allows commercial mixed-use.

  If Block A votes to exclude density, that is their liberal right. If Block B votes to exclude commercial space, that is their liberal right. Both votes are free. Both are democratic.

  But look at the outcome for Alice. Because of Block A's choice, she can't afford to live there. Because of Block B's choice, there are no jobs there. The aggregation of two locally liberal decisions has created a social state where Alice's minimal right to choose her living situation is nullified.

  Here is where the theorists will perk up. Sen's theorem proves that no social decision function can satisfy three conditions simultaneously: Unrestricted Domain (people can want anything), Pareto Efficiency (if everyone prefers X to Y, society should too), and Minimal Liberalism (individuals have rights over certain choices).

  In our zoning case, we are seeing a variation of this. If we treat the Blocks as the "liberal agents" with decisiveness, and we treat Alice's preference to live near work as a Pareto-dominant move (since it makes her better off without harming the blocks' internal preferences), we hit a contradiction. The blocks' exercise of their rights prevents the Pareto improvement for Alice.

  I want to be precise about what is settled here and what is not.

  **What is settled:** The mathematical impossibility is robust. If you grant local jurisdictions absolute decisiveness over their own zoning (Local Liberalism), and you acknowledge that individuals have preferences over where they live and work (Unrestricted Domain), you cannot guarantee an outcome that respects everyone's rights simultaneously. You cannot have it all. This is not a matter of better voting technology or more community meetings. It is a logical constraint.

  **What is contested:** What this means for policy. Some theorists argue this kills liberalism—that we must restrict rights to avoid cycles. Others, and I lean this way, argue it tells us to restrict the *domain* of preferences. In planning terms: perhaps NIMBY preferences shouldn't count as valid inputs in the same way housing needs do.

  There is another debate: Does this paradox mean we should centralize zoning? Some say yes, to resolve the conflict. Others say no, that the paradox simply highlights that rights are inherently conflicting, and politics is the messy process of adjudicating that conflict, not solving it mathematically.

  I am taking a liberty here. Sen's original formulation assigns rights to *persons*, not *places*. By mapping "neighborhood decisiveness" onto "individual liberty," I am treating the neighborhood as a single agent. The theorists know this risks the "composition fallacy"—a block isn't a person. But structurally, the tension holds: when we grant autonomy to sub-units, we risk violating the autonomy of the individuals within the larger system.

  So, what does this mean for the planners sipping their coffee?

  It means that "Let the neighborhood decide" is not a neutral slogan. It is a specific aggregation rule that privileges the rights of current residents over the rights of potential residents like Alice. If we value the liberal right of individuals to access opportunity, we cannot simply outsource zoning to the block level without creating constraints.

  We cannot design a participatory process that assumes local freedom will automatically aggregate to regional freedom. Sen teaches us that rights can conflict. If we want to protect Alice's right to choose her neighborhood, we may have to limit Block A's right to exclude her.

  That is the hard trade-off. The paradox doesn't tell us which right to choose. But it does tell us we cannot pretend both are absolute.

  Thank you. Let's get to work.
