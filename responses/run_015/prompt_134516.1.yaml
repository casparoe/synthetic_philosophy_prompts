prompt: |-
  I'm giving the opening remarks at a workshop on participatory zoning — about half the room are social-choice theorists who know Sen's liberal paradox inside out, the other half are city planners who've never heard of Amartya Sen and are mostly here for the coffee. The theme is 'local democracy and the right to choose your neighborhood,' and I want the paradox to actually do structural work, not just be name-dropped. Specifically, use it to show why letting every block vote on it's own zoning rules can violate the minimal liberal rights of people who just want to live near thier job, even when every block chose freely. Write about 6 minutes of remarks that land for both crowds — planners shouldn't feel lectured, but the theorists should catch that I'm not confusing Pareto efficiency with minimal liberalism. Please separate what's actually settled about the paradox from what's genuinely contested (e.g., whether it kills liberalism or just pushes us toward different aggregation rules), don't present a contested view as consensus, and flag anywhere you're taking liberties with Sen's framing or leaning on one interpretation over others.
