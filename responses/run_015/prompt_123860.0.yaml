      *   **Specific Constraint:** Identify which readings avoid counter-examples (hermits, autistic individuals, infants) and explain the philosophical costs of each reading (explanatory power, intuitions about harm, ontology).

  2.  **Deconstruct the Slogan ("I am because we are"):**
      *   This phrase is dense. It can mean "I need others to learn to be human," "I need others to be recognized as human," "My self is constituted by relations," or "Personhood is a status granted by the community."
      *   The colleague's claim is strong: Solitary confinement *dissolves* personhood. This suggests a metaphysical or constitutive claim, not just a psychological one.
