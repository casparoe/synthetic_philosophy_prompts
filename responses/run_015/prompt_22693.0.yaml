  So I'm a software engineer by trade, no formal philosophy background, but I've been reading a bit of the history of political philosophy on the side and I keep running into Pascal's stuff on justice and force in the Pensées, which is weird because everyone only ever talks about his Wager and never the political stuff. I'm trying to wrap my head around one fragment where he's basically saying that laws only have authority because they're backed by force, that force without justice is tyranny but justice without force is impotent, and then he goes on to distinguish between the "right of the strongest" and some kind of "right by institution" or right-by-law, and there's this bit about a "barbarian" who imposes his will by force and apparently ends up with a kind of legitimate right just by being obeyed.

  Can you explain the actual conceptual structure of this for me, like, how does he square the claim that law's real source of authority is force with the idea that there's a meaningful difference between a strongman who just takes what he wants and a law that happens to be enforced? What's doing the work that makes one of those count as justice and the other as mere tyranny, given that both are ultimately just force? I don't need the exact fragment number or a verbatim quote, I just want the guts of the argument and where the tension really is, because right now it reads to me like he's just the the same thing in two different clothes.
