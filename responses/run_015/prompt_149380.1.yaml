answer: |-
  The empirical agreement between you and your classmate is robust: by several standard metrics, the risk of violent death has declined precipitously over the long run. The disagreement concerns whether this empirical trend sustains the philosophical thesis that the world is becoming less violent. Your classmate suggests the thesis is only coherent after making contestable bookkeeping choices; you seem to seek a clearer verdict. The truth lies with your classmate regarding the structure of the claim, but with you regarding the moral weight of the conclusion. The unqualified claim that the world is becoming less violent is not the kind of claim that can be true or false simpliciter. It is only true or false relative to a stipulated currency, denominator, and population boundary. However, not all stipulations are morally equal. There is a specific accounting framework that captures what we ought to care about, and under that framework, the decline is real, though qualified by the distribution of remaining harm.

  Consider first the currency problem. Violence is multidimensional. It consists of deaths, non-fatal assaults, credible threats, dispossession, and the psychological burden of fear. Counting only homicide rates ignores the survivor living with disability or the refugee displaced by conflict without being shot. A proposed solution is to collapse these into a single metric, such as person-years of suffering or autonomously chosen activity foregone. This proposal does not dissolve the problem; it merely relocates the arbitrariness. To aggregate fear, pain, and death, one must assign exchange rates between them. Is one year of living under credible threat equivalent to one year of physical pain, or to one minute of it? Who decides the weighting? Any such function introduces normative assumptions as contestable as the original choice to count only deaths. Nevertheless, death and forced displacement remain the most objective proxies for severe harm. They are binary, rarely ambiguous, and represent the total foreclosure of agency. While a single metric of suffering is theoretically appealing, it is practically unverifiable. We are stuck with death and displacement as the hard currency of violence, acknowledging that this undercounts total harm but provides the only stable ledger.

  Second is the denominator problem. Per capita rates are the standard for measuring risk, but they are not the only option. One could count absolute numbers of violent events, which have likely risen simply because there are more people. Alternatively, one could measure violence per social encounter. Since the typical person now encounters orders of magnitude more strangers than an ancestor in a small-scale society, a stable per capita rate might actually represent a massive increase in trust per interaction. However, the phrase the world is becoming less violent should be read as invoking per capita risk. The moral question is about the safety of the individual life, not the abstract volume of conflict or the efficiency of social trust. If population growth drives up absolute numbers while individual risk collapses, the individual is still safer. The per capita denominator is the only one that aligns with the experience of the moral subject—the person who wants to know their chance of surviving the year.

  Third, we must confront the concentration objection and the measurement problem together. The decline in violence is a fact about averages, but averages can mask distributional realities. Violence is increasingly concentrated in specific territories and among specific subpopulations defined by state weakness or social exclusion. A global average can plummet while the risk for a person born in a conflict zone remains static or rises. Simultaneously, measurement capabilities have improved. Earlier periods are under-documented, which should inflate modern counts relative to the past, making the documented decline harder to dismiss as an artifact. Yet, remaining violence is concentrated precisely where registration systems are weakest, suggesting we may underestimate the tail of the distribution. These two factors pull in opposite directions. However, the magnitude of the decline in the well-policed core states is so large that it outweighs the uncertainty in the weak-state tail. The average decline is real, but it is unevenly distributed. This does not refute the thesis that the world is less violent on average, but it qualifies it heavily: the world is less violent for the majority, while remaining brutally violent for a minority.

  This leads to the verdict. The unqualified claim is not true simpliciter; it is true relative to a stipulated framework. For someone whose aim is to reduce the amount of violence in the world, the stipulation that matters is the per capita risk of severe harm (death or displacement) for a randomly selected human being. Under this stipulation, the trend is downward. To test this, apply the swap test. If a randomly selected person from a much more violent century were told the truth about both the average and the tail today, would they accept a lottery ticket relocating them to a random life now? Rational choice theory suggests they would. In the past, the baseline risk was high regardless of status; today, the baseline is low for most, even if high for some. The probability of drawing a safe life is vastly higher now than then. The swap test is a genuine arbiter here because it forces the evaluator to inhabit the risk rather than observe the statistic. It acknowledges the tail but recognizes that the aggregate reduction in risk is a moral good.

  What follows in practice? Given this verdict, someone trying to reduce violence would not be making a mistake by focusing on the settings where the headline rates look worst. In fact, they would be making a mistake if they did otherwise. The global average decline is a historical achievement, but it is not a moral completion. Because violence is concentrated in the tail—in weak states and marginalized populations—the marginal utility of intervention is highest there. Focusing on the worst settings does not deny the global progress; it acknowledges that the remaining harm is no longer distributed evenly. The headline rate tells us we have won the war against universal insecurity; the distribution tells us where the remaining battles are. Therefore, the measurement problem does not paralyze action. It clarifies it. We measure per capita risk to confirm progress, but we measure distribution to dictate priority. The world is less violent, but justice requires us to focus on where it is not.
