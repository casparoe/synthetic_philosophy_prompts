  | :--- | :--- | :--- | :--- | :--- |
  | **1. Truth-Maker Grounding** | **The Grounding Objection:** If CCFs (Counterfactuals of Creaturely Freedom) are true prior to creation, what ontological ground makes them true? If nothing, they are "brute facts" external to God. | **Non-negotiable** for metaphysical realists; **Negotiable** for conceptualists or those accepting brute truths. | **Molinism** (must explain pre-volitional truths); **Open Theism** (denies truth value). | 5 (Aseity) |
  | **2. Libertarian Integrity** | **Luck Objection:** If a choice is not determined by prior states (including God's will), is it random? The theory must explain how an undetermined choice is *authored* by the agent. | **Non-negotiable** for Libertarians/Arminians; **Irrelevant** for Compatibilists/Thomists. | **Open Theism** & **Molinism** (both typically libertarian); **Thomism** (rejects libertarianism). | 9 (Bivalence) |
  | **3. Non-Causal Certainty** | **Authorship Worry:** God must know $X$ will happen with certainty, but that knowledge cannot *cause* $X$ (or freedom is void). Knowledge must track reality, not make it. | **Non-negotiable** for Libertarians; **Negotiable** for Compatibilists (who allow causal determination). | **Thomism** (Physical Premotion looks like causation); **Simple Foreknowledge** (knows but can't ensure). | 4 (Providence) |
  | **4. Robust Providence** | **Guarantee Worry:** God must be able to ensure specific historical outcomes (e.g., Incarnation, Atonement) without violating freedom. Mere risk-taking is insufficient for classical providence. | **Non-negotiable** for Classical Theists/Calvinists; **Negotiable** for Open Theists (Risk-taking God). | **Open Theism** (cannot guarantee); **Simple Foreknowledge** (knows but cannot intervene based on knowledge). | 3 (Certainty), 2 (Liberty) |
  | **5. Divine Aseity** | **Independence Worry:** God cannot depend on anything external (including creaturely facts) for His knowledge or being. If CCFs are independent, God is passive to creation. | **Non-negotiable** for Classical Theism (Aquinas/Anselm); **Prejudice** for Process/Personalist Theism. | **Molinism** (depends on CCFs); **Open Theism** (depends on unfolding time). | 1 (Grounding) |
  | **6. Discursive Efficacy** | **Prayer & Prophecy:** Petitionary prayer must be able to change outcomes (or be meaningful); Prophecy must be specific and infallible. | **Negotiable** (depends on view of prayer); **Non-negotiable** for Biblical Literalists. | **Simple Foreknowledge** (prayer can't change known future); **Thomism** (prayer is part of the cause, not changer). | 4 (Providence) |
  | **7. Logical Moment Reality** | **Ordering Worry:** Are the three moments of knowledge (Natural, Middle, Free) ontological stages or merely explanatory concepts for humans? | **Negotiable** (Most Molinists say conceptual); **Bad Requirement** if demanded as ontological. | **Molinism** (if taken literally, implies temporal God); **Thomism** (rejects moments entirely). | 5 (Aseity) |
  | **8. Disclosure Stability** | **The Disclosure Case:** If an agent is told "In C, you would freely do X," does this revelation create a new circumstance C*? The theory must handle feedback loops. | **Negotiable** (Edge case); **Non-negotiable** for theories claiming comprehensive CCF coverage. | **Molinism** (CCFs are fixed, but circumstances change); **Open Theism** (No CCFs to disclose). | 1 (Grounding) |
  | **9. Indeterminate Truth Values** | **The Near-Tie Case:** In a 50/50 libertarian choice, is there a true proposition *now* about what *would* happen? Or is bivalence suspended? | **Negotiable** (Open Theists deny bivalence); **Non-negotiable** for Bivalents/Classical Theists. | **Open Theism** (denies truth value); **Molinism** (asserts truth value). | 2 (Liberty), 5 (Aseity) |

