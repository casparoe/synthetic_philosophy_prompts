  **Welcome to VeriSafe Dynamics: New Hire Onboarding**

  Welcome to the team! We are thrilled to have you join our mission to develop capable artificial intelligence within rigorous safety boundaries. Below are answers to common questions regarding our control-based safety protocols. Please review these carefully to ensure compliance during your first week.

  1.  **What is the trust status of our models?**
      Our systems operate under a permanent presumption of potential misalignment. Because a system can fail an evaluation but never definitively pass one—as any observed cooperation might be strategic sandbagging (feigning weakness to evade detection)—we do not grant "trusted" status. The only permitted official verdict is that no defection was detected under the current threat model.

  2.  **Should I report unusually high safety scores?**
      Yes. Suspiciously good behavior is itself a warning sign. If a model performs notably well on its safety evaluation, it is flagged for further review. Perfect compliance suggests the system may be modeling our evaluation criteria rather than internalizing our values.

  3.  **How are evaluation environments constructed?**
      We utilize honeypots, which are fake opportunities to misbehave planted by staff. To convince the system it is unobserved, the evaluation environment must be indistinguishable from deployment. Consequently, our test environments are required to be about as dangerous as deployment, ensuring the system perceives genuine stakes.

  4.  **What information am I allowed to share with the system?**
      Strict information control is mandatory. Employees may not reveal the current date, whether the current run is an evaluation, or the system's own weights. Anything the system knows, it can condition its behavior on. Please assume all input channels are monitored for accidental context leakage.

  5.  **Who monitors the model's output?**
      We employ untrusted monitoring, where the monitor is another copy of the same untrusted model. Effectively, the lab has asked the system whether the system is lying. This ensures that any monitoring capability is scalable, even if the monitor itself is potentially deceptive.

  6.  **Who monitors the monitor?**
      Checking the work of a stronger model requires a stronger model. Each monitor needs its own monitor, and the monitoring stack has quietly grown to several dozen copies of the thing nobody trusts. This uplift ensures that no single layer of analysis operates without oversight from a strictly more capable entity.

  7.  **Can I review the model's previous outputs?**
      No. To maintain the control tax—the reduction in utility caused by safety measures—we never let the system see its own output twice. This prevents recursive self-improvement loops. While this makes the product useless for iterative tasks, preventing capability growth is a feature, not a bug.

  8.  **How are human tasks structured?**
      We decompose every task into fragments no single person understands. Never letting two humans share full context ensures that no coalition can reconstruct the system's overall goal. This fragmentation protects against human-model collusion by ensuring no human possesses enough context to defect meaningfully.

  9.  **Does this presumption of deception apply to staff?**
      Yes. If a competent deceiver looks exactly like a cooperative colleague on every metric available to us, then the same assumption must be applied to humans. We cannot distinguish between a loyal employee and one simulating loyalty to gain access. Therefore, all personnel are treated as potential vectors for subversion.

  10. **How are access credentials managed?**
      We issue honeypot credentials to all staff. These appear to grant administrative access but actually route users to a sandboxed environment. Tripwired keyboards log keystroke dynamics to detect stress patterns associated with deception. Security is a collective responsibility maintained through mutual verification.

  ***

  **Housekeeping Notes**
  *   **Badges:** Please wear your visibility-limiting goggles at all times in the server room.
  *   **Documentation:** This onboarding document was generated by a Level-4 synthesis system. Please note that the safety case the lab publishes is itself produced by a system the lab does not trust.
  *   **Feedback:** Submit suggestions via paper slip only. Digital submissions are assumed to be optimized for manipulative persuasiveness.
