answer: |-
  "The problem isn't that they won't understand it," Elise said, tapping the glass over the wall chart. "It's that they will. Too easily."

  Karl leaned against the display case, arms crossed. He was still wearing the smock from the workshop, ink stained on the cuff. "That was the intention, Elise. Clarity."

  "Certainty," she corrected. "Look at this row. Ten little men in grey. One big man in black. The grey men hand coins to the factory; the factory hands a single coin back to the black man. It's clean. It's elegant. It's a lie."

  Karl didn't look at the chart. He looked at her. "It represents a ratio. One fifth of national income goes to profit. Four fifths to wages. The pictograms are counters. Nothing more."

  "A pictogram is never nothing more. You chose a man. You chose grey. You chose the act of handing over. If you wrote 'wage labor involves exploitation,' a worker could argue the definition of exploitation. He could say, 'I agreed to the contract.' But this?" She rapped the glass again. "This says it is physics. Gravity. The little man is physically smaller than the big man. You've turned economics into biology."

  Karl pushed off the case and stepped closer to the chart. "Words are the ones carrying the biology. If I write 'exploitation,' I bring in Marx. I bring in guilt. I bring in the German language, which a Czech migrant doesn't speak, or a child who hasn't learned to read. The pictogram bypasses the tribe. It is a language of the eyes."

  "It's a language of the editor," Elise said. "You say you bypass ideology. I say you hide it. When I speak, you know I am using a tool. You know words are conventional. When you show me a picture, you pretend you are showing me the world. The neutrality is the trick. It's ideology that doesn't look like ideology."

  "So we return to dry dock," Karl said. "You want to stop the ship, scrape the barnacles off, paint the hull with the 'true' words, and then set sail again. But Neurath is right. We are at sea. We have to rebuild while floating. We need planks we can all see."

  "We need planks that aren't painted to look like gold," she said.

  "Show me the paint." Karl pointed to the row of grey figures. "Count them. Ten. Count the black one. One. The ratio is visible. If I wrote 'the disparity is vast,' that is vague. 'Vast' is a feeling. Ten to one is a fact. You can argue the source of the numbers, yes. But once the numbers are accepted, the visual relation is indisputable. That is the inspectability. You can stand back and see the structure of the argument without knowing the syntax."

  Elise turned away from the chart, walking toward the window. The Vienna afternoon was grey, matching the little men. "You say inspectable. I say inevitable. If I write a sentence, I can qualify it. I can say 'some workers,' or 'often,' or 'under these conditions.' A pictogram has no subjunctive mood. It cannot speak in possibilities. It only speaks in what is. It flattens the world into icons."

  "Because the world of economics *is* flat when you are starving," Karl said, his voice tightening. "You talk about the subjunctive mood like it's a luxury people have. A mother in Ottakring doesn't need nuance. She needs to know where the bread went. Words are baggage. Every word comes with a history of who used it last. 'Worker,' 'Profit,' 'State.' They are poisoned. The picture is a new coin. We are minting it fresh."

  "You're minting it in your workshop," Elise said. "You decided the worker looks like this." She mimed a stiff posture. "Helmeted? Capless? Smiling? Stooped? You decided the factory looks like a castle. That is architecture, not economics. You are teaching them to see the factory as a fortress. That is a political decision, Karl. But because it's drawn with a ruler, it looks like engineering."

  Karl walked over to her, stopping just outside her personal space. "And if I use words? If I say 'The factory consumes labor.' 'Consumes.' That is a metaphor. It is biological. It is just as ideological as the castle. Why is your metaphor better than mine?"

  "Because when I use a metaphor, I am using a figure of speech," Elise said. "You are using a figure of speech and claiming it is a mirror. That is the danger. If this chart hangs in the schoolhouse, the children won't learn economics. They will learn iconography. They will learn that truth looks like a simplified diagram. And when someone comes along who simplifies *them*..." She stopped.

  Karl was quiet for a moment. He looked back at the chart, at the ten grey men. "We are rebuilding the ship at sea, Elise. We don't have the luxury of perfect timber. We use what floats. If these pictures help a thousand people understand where their wage goes, even if the icon is imperfect... is that not better than a thousand people understanding nothing because the text was too dense?"

  "It depends on what they think they understand," she said softly. "If they think the picture is the truth, rather than a map drawn by men like you... then you haven't liberated them. You've just given them a new catechism. A visual catechism. Ten little men salute the one big man. Or vice versa. It doesn't matter which way the coins flow. The structure is authoritarian."

  Karl sighed, rubbing the ink stain on his cuff. "Then critique the numbers. Argue the data. Don't shoot the messenger because the message is clear."

  "I'm arguing the medium is the message," Elise said. She picked up her coat from the chair. "You say words admit they are a medium. Pictures pretend to be nature. I trust a man who admits he is selling me something more than a man who says he is showing me the world."

  "We are both selling," Karl said. "I am selling the hope that we can agree on what we see."

  Elise paused at the door. She looked back at the wall chart. The ten grey men stared back, identical, silent. "And if we agree on the picture, but not on what it means? You have given us a common language to disagree in. Or you have given us a common illusion."

  "We will see," Karl said. "The schoolchildren come tomorrow."

  "Exactly," Elise said. She opened the door. The hallway was dimmer than the gallery. "I hope they ask who drew the men."

  "They will ask why there are so few of them," Karl said.

  Elise didn't answer. She stepped out into the corridor, leaving the door ajar. The chart remained on the wall, bright and stark, the little men standing in their rigid rows, looking neither happy nor sad, just undeniable.
