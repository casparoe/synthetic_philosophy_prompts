answer: |-
  Here is a complete lesson plan for a 75-minute seminar game designed to simulate Hume's Price-Specie Flow Mechanism.

  ### Game Title: "The Bullion Trap"
  **Concept:** Students manage national economies. They will experience the euphoria of a trade surplus, followed by the pain of inflation-induced uncompetitiveness, forcing a reversal of the flow.
  **Time:** 75 Minutes
  **Class Size:** 25 Students (Split into two "Nations" of 12-13).

  ---

  ### 1. Preparation & Materials
  *   **Gold:** 100 poker chips or distinct coins (Total Money Supply $M$).
  *   **Goods:** 40 slips of paper marked "Wool" (Nation North), 40 slips marked "Wine" (Nation South).
  *   **Ledger:** Whiteboard to track National Gold Reserves and Price Levels.
  *   **Roles:** Each Nation selects 1 **Treasurer** (holds gold), 1 **Trade Minister** (sets prices/negotiates), and 1 **Scribe** (tracks rounds). The rest are **Producers/Consumers**.

  ### 2. The Rules (Handout or Project)
  1.  **Objective:** Maximize **Consumption**. You score 1 Point for every unit of *foreign* good you import and consume. Gold has no value unless spent.
  2.  **Survival Constraint:** To remain a sovereign state, your nation **must import at least 3 units** of foreign goods per round. If you cannot afford this, your nation collapses (automatic loss).
  3.  **Production:** Each round, Nation North receives 10 Wool. Nation South receives 10 Wine. You cannot consume your own national good; it is only for export.
  4.  **Pricing (The Hume Mechanism):** Sellers set prices, but they are bound by the **Money Supply Rule**:
      *   If your nation holds **40% or less** of total gold: Max Price = **1 Gold** per good.
      *   If your nation holds **41–60%** of total gold: Max Price = **2 Gold** per good.
      *   If your nation holds **61% or more** of total gold: Max Price = **3 Gold** per good.
      *   *Note:* This simulates inflation. More money in a nation = higher domestic price level.
  5.  **Trade:** Trade happens simultaneously. Ministers meet at the "Border" (front of class) to exchange Gold for Goods.
  6.  **Settlement:** At the end of each round, gold moved is counted. The Instructor updates the Whiteboard Ledger.

  ---

  ### 3. Round-by-Round Script (Instructor Guide)

  **0:00–0:10: Setup & Distribution**
  *   Split the room. Left side = **North (Wool)**. Right side = **South (Wine)**.
  *   **Rig the Start:** Give **North 20 Gold**. Give **South 80 Gold**.
  *   *Instructor Line:* "South, you are the Mercantilist success story. You have accumulated vast bullion reserves. North, you are cash-poor. Begin."
  *   *Why:* Starting with an imbalance allows the correction to happen immediately, but we will add a "Demand Shock" in Round 2 to make the surplus grow before it breaks.

  **0:10–0:20: Round 1 (The Status Quo)**
  *   **Action:** South has high gold (Tier 3 Pricing: Cost 3 Gold). North has low gold (Tier 1 Pricing: Cost 1 Gold).
  *   **Expected Outcome:** North's Wool is cheap (1g). South's Wine is expensive (3g). South will buy heavily from North. North cannot afford much South Wine.
  *   **Flow:** Gold flows **South $\rightarrow$ North**.
  *   **End of Round:** Count gold. Update board. (North should now have ~40-50 Gold).

  **0:20–0:30: Round 2 (The Mercantilist Dream)**
  *   **Instructor Intervention:** "Rumor spreads that Northern Wool is higher quality this season."
  *   **Rule Change:** North is allowed to sell up to 10 units. South is *required* to import at least 5 units (increase Survival Constraint temporarily to force the surplus).
  *   **Action:** South continues to buy North Wool. North accumulates more gold.
  *   **Critical Threshold:** By the end of this round, North should cross the **60% Gold Threshold** (61+ Gold).
  *   **Flow:** Gold continues **South $\rightarrow$ North**. North feels rich.

  **0:30–0:40: Round 3 (The Inflation Shock)**
  *   **Action:** North now holds >60% of gold. Per the **Money Supply Rule**, North's prices **must** rise to 3 Gold per unit. South now holds <40%, so South's prices drop to 1 Gold per unit.
  *   **The Trap:** North tries to sell Wool at 3 Gold. South looks at their budget. South realizes Southern Wine is now 1 Gold.
  *   **Expected Outcome:** South stops buying Northern Wool (too expensive). South buys less. North *must* import to survive (Survival Constraint), so North spends gold buying cheap Southern Wine.
  *   **Flow:** Gold reverses **North $\rightarrow$ South**.
  *   **Observation:** Watch the North students panic. They have gold, but no one wants their goods.

  **0:40–0:45: Round 4 (Equilibrium)**
  *   **Action:** Allow one final round of trade.
  *   **Outcome:** Gold distribution should roughly equalize (around 50/50), and prices should stabilize at Tier 2 (2 Gold) for both. Trade volume equalizes.
  *   **FREEZE THE GAME.** "Hands off the chips. Do not trade another unit."

  ---

  ### 4. The Freeze & Debrief (45–75 Minutes)

  **The "What Happened?" Question (5 mins)**
  Ask the North Trade Minister: *"In Round 2, you were the envy of the room. You had the gold. By Round 4, you couldn't give your goods away. Why?"*
  Ask the South Trade Minister: *"Why did you stop buying from the North?"*

  **Mapping the Game to Hume (15 mins)**
  Draw this on the board as they answer:

  1.  **Phase 1 (Rounds 1-2): The Surplus.**
      *   *Game:* Gold flowed North.
      *   *Theory:* Trade Surplus $\rightarrow$ Inflow of Specie.
      *   *Mercantilist View:* This is permanent wealth.
  2.  **Phase 2 (Round 3): The Price Mechanism.**
      *   *Game:* North hit the 60% threshold, prices jumped from 1 to 3.
      *   *Theory:* Quantity Theory of Money ($M \uparrow \rightarrow P \uparrow$). More gold chases same goods = Inflation.
  3.  **Phase 3 (Round 3-4): The Loss of Competitiveness.**
      *   *Game:* South stopped buying Northern Wool because it was too expensive.
      *   *Theory:* Real Exchange Rate appreciation. Domestic goods become uncompetitive abroad.
  4.  **Phase 4 (Round 4): The Self-Correction.**
      *   *Game:* Gold flowed back to South.
      *   *Theory:* Trade Deficit $\rightarrow$ Outflow of Specie. Equilibrium restored.

  **The "Hoarding" Fix (Pedagogical Note)**
  *   **Predictable Failure:** Students often treat gold as "points" and refuse to spend it, even with the Survival Constraint. They might try to collude to keep prices low.
  *   **The Fix:** If you see hoarding in Round 2, announce a **"Velocity Tax."** *"Any gold held in the Treasury at the end of the round loses 10% value."* This forces circulation.
  *   **Collusion:** If they agree to keep prices fixed at 1 Gold regardless of gold stock, call a "Market Correction." *"The market detects artificial pricing. Inflation hits anyway."* (Override their price setting to enforce the theory so the debrief works).

  **Limitations: What the Game Can't Show (10 mins)**
  Be honest with the grad students. This game models the **monetary** channel, but Hume also argued about **real** variables.

  1.  **Wages & Labor:** In the game, prices jumped instantly. In reality, Hume argued money inflow stimulates industry *before* prices rise. There is a "lag." The game skips the "Golden Age" of employment where manufacturers hire more workers before inflation bites.
      *   *Lecture Point:* "In the game, you felt the pain immediately. Hume argued there's a delay. Money enters $\rightarrow$ Demand rises $\rightarrow$ Wages rise $\rightarrow$ *Then* Prices rise. That delay is why Mercantilists were confused; they saw the boom but missed the bust."
  2.  **Full Employment:** The game assumes fixed supply (10 units). Hume assumed money inflow could mobilize idle labor (increase supply).
      *   *Lecture Point:* "We played a zero-sum game with fixed goods. Hume believed money could actually grow the pie temporarily by waking up idle workers."
  3.  **Expectations:** In the game, the inflation rule was known. In history, merchants didn't know *why* prices were rising, only that they were.

  **Closing Thought (5 mins)**
  *"Hume's mechanism proves that a permanent trade surplus is impossible under a metallic standard. If you succeed, you destroy your competitiveness. If you fail, you regain it. This is why the Mercantilist goal of 'always export more than you import' is logically incoherent in the long run."*

  ---

  ### Why This Works for Grad Students
  1.  **Endogenous Prices:** By tying price caps to gold holdings, you force the Quantity Theory of Money without a lecture. They *have* to raise prices when they get rich.
  2.  **Forced Trade:** The "Survival Constraint" prevents the game from stalling if one nation hoards. It mimics the necessity of imports.
  3.  **The "Freeze":** Stopping at the moment of reversal captures the emotional shift from "We are winning" to "We are stuck."
  4.  **Honesty:** Acknowledging the wage/labor limitation shows you understand the nuance of Hume's full argument, not just the textbook summary.

  ### Troubleshooting Checklist
  *   **Math Slowdown:** If calculating 60% of 100 chips takes too long, pre-print "Price Level Cards" (Tier 1, 2, 3) and hand them to the Treasurers as gold moves.
  *   **Chaos at the Border:** Only the Trade Ministers can cross the border. Everyone else must stay seated.
  *   **Gold Count Errors:** You (Instructor) keep the Master Ledger. Do not trust the students' count for the Price Level determination.
