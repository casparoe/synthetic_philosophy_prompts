prompt: |-
  I'm a program officer at a research foundation. We run maybe a dozen review panels a year, each handing out a few million dollars, and the rules are mostly inherited: eight reviewers from the relevant subfield, everyone sees each other's scores before the meeting, we fund whatever a majority puts in the top half. I've been reading about the Condorcet jury theorem and I want to turn whatever in it is actually usable into a procedure my team can run when we set up a panel — not a general essay on collective wisdom.

  What I have in mind: a short ordered checklist covering (a) whether the decision is even the kind of thing the theorem applies to, (b) whether our reviewers are better than chance on this kind of call and how we'd know without a stats department, (c) how badly the independence assumption is being violated and what to do about it — secret pre-votes, withholding scores until after discussion, deliberately mixing subfields — (d) panel size and the point where adding people stops buying anything, (e) when to hand the call to one named person instead of a vote. For each question say what counts as a sufficient answer, where the procedure returns a hard no, and where it has to stop and hand the call to a human because it's a value judgment.

  One thing I'd like built into the middle of it. I've started sorting panel failures into three buckets and I want the procedure to diagnose which one a given panel is headed for: "echo" (everyone anchored on the same first score or the same methodological reflex), "coin-flip" (the case is just hard and reviewers are near chance), and "drift" (errors systematically point one way, e.g. everyone is sceptical of the same kind of method). If that framing is wrong or misses a bucket, say so and fix it. I also suspect there's two different things people lump together as crowd wisdom — averaging scores versus majority on a yes/no — and I want the procedure to be clear about which one it's licensing, and what it says about mixing the two.

  Then run it on three of our real setups: [1] the standard eight-person subfield panel on ordinary proposals; [2] our flagship "transformative" program, where I honestly think reviewers are barely better than a coin flip at picking which weird proposals will pan out — I have a feeling the procedure will tell me something I don't want to hear, that a big panel there is worse than a lottery or a single trusted expert, and I'd rather have it stated plainly than softened; [3] a cross-cutting call where every plausible reviewer comes out of the same methodological tradition with a strong shared view of what counts as rigorous.

  Constraints: reviewers are volunteers with limited time, whatever we do has to be explainable to our board in a paragraph, and I can't ask anyone to estimate probabilities in any formal way. Please also say what the procedure can't tell me — especially for the cases where there's no fact of the matter about which application is "best" and we're really just aggregating preferences.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Program Officer at a research foundation.
      *   **Context:** ~12 review panels/year, millions in funding, inherited rules (8 reviewers, subfield, see scores, majority top-half wins).
      *   **Goal:** Convert Condorcet Jury Theorem (CJT) insights into a practical, actionable checklist/procedure for setting up panels.
      *   **Specific Requirements:**
          *   Short ordered checklist.
          *   Cover 5 specific areas: (a) Applicability, (b) Competence (> chance?), (c) Independence (violations & fixes), (d) Panel Size, (e) Single Expert vs. Vote.
          *   For each: Sufficient answer, Hard No, Hand-off to Human (Value Judgment).
          *   **Diagnosis:** Integrate the user's three failure buckets ("Echo", "Coin-flip", "Drift"). Validate/fix this framing.
          *   **Mechanism:** Distinguish between Averaging Scores vs. Majority Vote.
          *   **Case Studies:** Run the procedure on three specific scenarios (Standard, Transformative, Cross-cutting/Methodological).
          *   **Constraints:** Volunteers (low burden), Explainable to Board (1 paragraph), No formal probability estimation.
          *   **Limitations:** Acknowledge what the procedure *can't* tell (preference aggregation vs. truth-seeking).

  2.  **Deconstruct the Condorcet Jury Theorem (CJT) for this Context:**
      *   *Core Premise:* If voters are independent and competent ($p > 0.5$), adding voters increases the probability of a correct majority decision to 1.
      *   *Caveats:* If $p < 0.5$, adding voters makes it worse. If correlation exists (dependence), the benefit diminishes rapidly.
      *   *Application to Grants:* Grants aren't "true/false" facts. They are "fundable/not fundable" based on criteria. This shifts CJT from "truth" to "consensus quality."
      *   *User's Failure Buckets:*
          *   "Echo" = High Correlation (Social influence/anchoring).
          *   "Coin-flip" = Low Competence ($p \approx 0.5$).
          *   "Drift" = Systematic Bias ($p < 0.5$ for specific types).
          *   *Critique:* These are good. "Drift" is essentially systematic bias lowering effective $p$. "Echo" is violation of independence. "Coin-flip" is competence issue. I will validate and refine these terms slightly for precision.
      *   *Mechanism:* CJT applies strictly to binary choices (Yes/No). Averaging scores is more Borda Count/Range Voting. They behave differently under correlation.

  3.  **Drafting the Procedure (The Checklist):**
      *   *Tone:* Operational, direct, bureaucratic but smart.
      *   *Structure:* 5 Steps matching the user's (a)-(e).
      *   *Decision Logic:* Go/No-Go/Hand-off.
      *   *Diagnosis:* Insert the "Failure Mode Diagnostic" where it fits best (likely after Competence and Independence checks).

      *   *Step 1: Applicability (Truth vs. Preference).* CJT needs a "correct" answer. Grants are often preference aggregation.
      *   *Step 2: Competence ($p > 0.5$).* How to check without stats? Look at track records, inter-rater reliability on past panels, or "calibration" questions.
      *   *Step 3: Independence (Echo/Drift).* Mitigation strategies (blind scoring, discussion order).
      *   *Step 4: Size.* Diminishing returns. 8 is usually plenty if independent.
      *   *Step 5: Expert vs. Panel.* When to ditch the vote.

  4.  **Refining the Failure Buckets:**
      *   User's: Echo, Coin-flip, Drift.
      *   My assessment: These map well to CJT variables.
          *   Echo $\rightarrow$ Correlation ($\rho$).
          *   Coin-flip $\rightarrow$ Competence ($p \approx 0.5$).
          *   Drift $\rightarrow$ Systematic Bias ($p < 0.5$ for specific subsets).
      *   *Addition:* Need to distinguish "Averaging" vs. "Majority". Averaging smooths noise; Majority amplifies signal *if* independent.
      *   *Decision:* Keep the user's terms but define them operationally within the checklist.

  5.  **Running the Case Studies:**
      *   *Case 1 (Standard):* 8 people, subfield. Likely high competence, moderate independence issues (Echo). Verdict: Keep but tweak process (blind scores).
      *   *Case 2 (Transformative):* Low competence ($p \approx 0.5$). CJT says panel is useless or harmful. Verdict: Lottery or Single Expert (as user suspected).
      *   *Case 3 (Cross-cutting/Methodological):* High correlation (Echo/Drift). Everyone thinks alike. Verdict: Panel size doesn't help. Need diverse reviewers or single expert.

  6.  **Addressing Constraints:**
      *   *Volunteers:* No complex math. Simple heuristics.
      *   *Board:* Need a "One Paragraph Justification."
      *   *No Probabilities:* Use proxies (past agreement rates, track records).
      *   *Limitations:* Explicitly state that CJT assumes an objective "best," which doesn't always exist in art/humanities or high-risk science.

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Correction:* The user asked for a "short ordered checklist." I shouldn't bury the lead in theory. Start with the tool.
      *   *Correction:* Make sure the "Hand-off to Human" is clear. The Program Officer is the human.
      *   *Correction:* Ensure the distinction between Averaging and Majority is clear. CJT is Majority. Grant panels usually Average scores then cut. I need to address this mismatch. Averaging is more robust to correlation than Majority voting, but CJT logic still applies to the *competence* underlying the scores.
      *   *Refinement on "Drift":* Drift isn't just $p < 0.5$. It's $p < 0.5$ *conditional on a trait*. I need to make sure the checklist catches systematic bias against *types* of proposals.
      *   *Refinement on "Transformative":* If $p=0.5$, CJT says panel size doesn't matter. But if there's cost, smaller is better. If $p < 0.5$, panel is worse than random. This confirms the user's suspicion.

  8.  **Final Review against Prompt:**
      *   Checklist covering (a)-(e)? Yes.
      *   Sufficient/No/Hand-off for each? Yes.
      *   Failure buckets integrated? Yes.
      *   Averaging vs. Majority clarified? Yes.
      *   Three cases run? Yes.
      *   Constraints met (volunteers, board, no probs)? Yes.
      *   Limitations section? Yes.

  9.  **Final Polish:** Ensure the tone is professional, respectful of the user's expertise, and direct about the uncomfortable truths (especially for Case 2). (Proceed to generate output).

  *(Self-Correction during final output generation)*: I need to make sure I don't just say "CJT doesn't apply to grants." I need to make it *work* for grants by treating "fundability" as the binary truth condition for the sake of the procedure, while acknowledging the limitation at the end.

  Let's structure the "Failure Buckets" as a diagnostic step *before* deciding on panel size.
  Let's make sure the "Board Paragraph" is distinct.
  Let's ensure the "Averaging vs Majority" point is highlighted in the mechanism section.

  Okay, ready to write.s
answer: |-
  Here is the **Panel Design Protocol (PDP)**. It translates Condorcet logic into operational checks without requiring statistics. It is designed to be printed and used during panel scoping.

  ### Part 1: The Failure Mode Diagnostic
  *Before sizing the panel, diagnose the likely error structure. Your three buckets are accurate mappings of Condorcet variables. We add a fourth for mechanism.*

  1.  **Echo (High Correlation):** Reviewers anchor on the same cues (prestige, method, first score). *Condorcet violation: Independence.*
  2.  **Coin-Flip (Low Competence):** The signal is too weak for experts to distinguish merit from noise ($p \approx 0.5$). *Condorcet violation: Competence.*
  3.  **Drift (Systematic Bias):** Reviewers are competent generally, but systematically undervalue a specific approach ($p < 0.5$ for that subset). *Condorcet violation: Competence bias.*
  4.  **Mechanism Mismatch:** Using Majority Vote on nuanced data, or Averaging on binary decisions. *Condorcet violation: Aggregation method.*

  ---

  ### Part 2: The Checklist

  #### Step 1: Applicability (Truth vs. Preference)
  **Question:** Is there a fact of the matter about "quality" detectable by experts, or are we aggregating incompatible values?
  *   **Sufficient Answer:** "Yes, past funding in this area has produced measurable outputs/citations/successes that experts agree on retrospectively."
  *   **Hard No:** "We are funding art, high-risk moonshots with no track record, or politically divergent goals." → **Stop.** Use a different model (e.g., quota system or lottery).
  *   **Hand-off:** If the goal is "diversity of approaches" rather than "best science," the Program Officer (PO) must define the quota manually. The theorem cannot optimize for variety.

  #### Step 2: Competence (Are reviewers $> 0.5$?)
  **Question:** Without stats, how do we know reviewers aren't guessing?
  *   **Sufficient Answer:** Reviewers have funded track records in this specific subfield OR inter-rater reliability on past panels was $> 0.6$ (moderate agreement).
  *   **Hard No:** Reviewers are generalists reviewing niche work, or historical data shows this panel type correlates poorly with downstream success. → **Stop.** Do not use a panel.
  *   **Hand-off:** If the program is *new* (no historical data), the PO must designate a "Calibration Lead" (a senior expert) to vet the reviewer pool's specific expertise.

  #### Step 3: Independence (Diagnosing Echo & Drift)
  **Question:** How correlated are the errors?
  *   **Sufficient Answer:** Reviewers come from $\ge 3$ distinct institutions and $\ge 2$ methodological traditions. Pre-meeting scores are blinded.
  *   **Hard No:** All reviewers share the same PhD lineage, method, or institution. → **Stop.** This is "Echo." Adding people adds no information.
  *   **Hand-off:** If "Drift" is suspected (e.g., everyone hates qualitative work), the PO must manually inject reviewers known to champion that method, even if they are outliers.
  *   **Procedure Fix:** To break **Echo**: Collect scores *before* any discussion. To break **Drift**: Explicitly instruct panel to evaluate *within* the proposal's framework, not the panel's preference.

  #### Step 4: Mechanism (Averaging vs. Majority)
  **Question:** How do we aggregate?
  *   **Rule:** Condorcet assumes Majority Vote (Yes/No). Grant panels usually Average Scores (1–9).
  *   **Directive:**
      *   If **Competence is High** & **Independence is High**: Averaging is fine (smoothes noise).
      *   If **Competence is Low** (Coin-Flip): Averaging creates false precision. Use a Lottery.
      *   If **Independence is Low** (Echo): Averaging hides the lack of consensus. Require a Majority Vote on the "Fund/No-Fund" boundary to force accountability.
  *   **Hand-off:** If the panel wants to discuss scores before voting, the PO must intervene. Discussion creates correlation. Discussion must happen *after* initial scoring.

  #### Step 5: Panel Size & The Single Expert
  **Question:** When does adding a reviewer stop helping?
  *   **Rule:** If Competence is High ($p > 0.7$) and Independence is High, 5–7 reviewers capture 90% of the benefit. 8 is sufficient.
  *   **Hard No:** If Competence is Low (Coin-Flip), adding reviewers makes the decision *worse* than a single expert (amplifies noise).
  *   **Hand-off:** If the call is "Transformative" (low predictability), the PO must choose: **Single Trusted Expert** (owns the risk) OR **Lottery** (admits ignorance). A panel implies certainty that does not exist.

  ---

  ### Part 3: Case Studies

  #### Case 1: Standard Subfield Panel (8 people, ordinary proposals)
  *   **Diagnosis:**
      *   **Competence:** High (subfield experts).
      *   **Independence:** Moderate risk of Echo (same subfield).
      *   **Mechanism:** Averaging scores.
  *   **Procedure Verdict:** **Green Light with Modifications.**
      *   Keep 8 reviewers (diminishing returns kick in after 7).
      *   **Fix:** Enforce blinded pre-scores to prevent Echo.
      *   **Fix:** Use Averaging for ranking, but require Majority Vote for the funding cut-off line to ensure consensus on the margin.
  *   **Board Explanation:** "Standard panels use expert consensus to filter noise. We maintain 8 reviewers but blind initial scores to ensure independent judgment, maximizing the statistical reliability of the funding decision."

  #### Case 2: Flagship "Transformative" Program
  *   **Diagnosis:**
      *   **Competence:** Low (Coin-Flip). By definition, transformative work is hard to recognize ex-ante.
      *   **Independence:** Irrelevant if Competence is $0.5$.
      *   **Mechanism:** Current voting implies false precision.
  *   **Procedure Verdict:** **Hard No on Panel.**
      *   Condorcet logic dictates that if $p \approx 0.5$, a panel of 8 is statistically worse than a single expert (due to coordination costs) and no better than a lottery.
      *   **Recommendation:** Switch to a **Lottery** of qualified proposals OR a **Single PI** model (one senior expert decides).
      *   **Uncomfortable Truth:** You cannot vote on luck. A panel here creates an illusion of rigor while adding bias.
  *   **Board Explanation:** "Transformative research is inherently unpredictable; expert panels cannot reliably distinguish high-risk success from failure. To maximize innovation, we use a lottery among qualified applications to remove bias and acknowledge uncertainty."

  #### Case 3: Cross-Cutting Call (Same Methodological Tradition)
  *   **Diagnosis:**
      *   **Competence:** High for their method, Low for others.
      *   **Independence:** Critical Failure (Drift/Echo). Everyone shares the same "rigor" reflex.
      *   **Mechanism:** Averaging will systematically punish outliers.
  *   **Procedure Verdict:** **Red Flag.**
      *   Adding more reviewers from this tradition does not help; it cements the Drift.
      *   **Recommendation:** Do not increase panel size. Instead, recruit 2 "hostile" reviewers from opposing traditions. If impossible, revert to **Single Expert** who is explicitly tasked with cross-field translation.
      *   **Fix:** If you must use the panel, weight the scores of the outliers higher, or use Majority Vote rather than Average to prevent the "center" from drowning out the minority view.
  *   **Board Explanation:** "When reviewers share a methodological bias, adding more reviewers amplifies systematic error. We are diversifying the panel's methodological composition rather than its size to ensure fair evaluation across disciplines."

  ---

  ### Part 4: Limitations & Hand-offs

  **What this procedure cannot tell you:**
  1.  **Preference Aggregation:** If "best" is subjective (e.g., funding poetry vs. physics), Condorcet does not apply. There is no "correct" answer to average toward. This is a value judgment for the PO.
  2.  **The "Right" Competence:** We cannot measure $p$ (competence) without hindsight. You must use proxies (track record). If your proxies are wrong, the procedure fails.
  3.  **Ethical Quotas:** Condorcet optimizes for *accuracy*, not *equity*. If you need to fund underrepresented groups to correct historical bias, the theorem will argue against you (if their proposals are statistically riskier in the short term). You must override the procedure manually for equity goals.

  **The "Human in the Loop" Rule:**
  If the checklist returns a **Hard No**, do not try to engineer a workaround. The math says the panel will degrade the decision quality. You must either change the program goals (make them less transformative) or change the mechanism (lottery/single expert). This decision is yours, not the panel's.
