answer: |-
  ## Part 1: Logical Architecture (Instructor Context)

  Before distributing the handout, note that this tree maps the **logical space of moral agency** regarding causation and duty. It does not assume the "Doing/Allowing" (D/A) distinction exists; it tests whether the student's intuitions require it.

  **The Four Logical Axes:**
  1.  **Descriptive vs. Normative:** Is the difference between doing and allowing a fact about physics (muscle movement, causal chains) or a fact about obligations (what was owed)?
  2.  **Intrinsic vs. Extrinsic:** If there is a moral difference, is it *always* worse to do (intrinsic), or only worse when specific conditions apply (e.g., role, cost, prior threat)?
  3.  **Binary vs. Scalar:** Is there a bright line between acting and omitting, or does it fade (e.g., enabling, facilitating)?
  4.  **Agency vs. Outcome:** Does the moral weight rest on the agent's conduct or the victim's state?

  **Unoccupied/Incoherent Combinations:**
  *   **"Physical Movement Absolutism" (Unnamed):** The view that muscle contraction is the *only* thing that matters, regardless of duty or outcome. *Diagnosis:* Incoherent; cannot account for omissions in role-based duties (e.g., a nurse starving a patient).
  *   **"Reverse Asymmetry" (Unnamed):** The view that allowing harm is *intrinsically* worse than causing it. *Diagnosis:* Merely unattractive; contradicts basic self-preservation and rights intuitions.
  *   **"Causal Process without Counterfactuals" (Unnamed):** Judging based on the physical chain but ignoring what would have happened otherwise. *Diagnosis:* Unexplored; difficult to sustain without collapsing into Equivalence.

  **Inseparable Positions (Flagged in Leaves):**
  *   **Brute D/A Principle vs. Victim's Rights:** Both yield identical verdicts in standard cases (killing violates negative rights; letting die fails positive rights). The tree cannot separate them without meta-ethical questioning.
  *   **Counterfactual Dependence vs. Causal Process:** In most clinical cases, the causal process *is* the counterfactual dependency. They only split in "pre-empted cause" scenarios (not included here to preserve clinical relevance).

  ***

  ## Part 2: Student Handout — The Agency Classification Tree

  **Instructions:** Begin at **Node 1**. Answer the question based on your immediate moral judgment of the case described. Follow the arrow to the next Node or to a **Leaf (Position)**. There are no wrong answers, but consistency is required. If a case feels ambiguous, choose the option that feels *more* true.

  ### **NODE 1 (Load-Bearing): The Threat Creator**
  *Case:* You accidentally knock a swimmer unconscious. They are floating. You can throw a rope but choose not to. They drown.
  *Claim:* Is your moral guilt **the same** as if you had held them under the water intentionally?
  *   **YES (Same Guilt)** → Go to **Node 2**.
  *   **NO (Less Guilt)** → Go to **Node 5**.

  ### **NODE 2 (Load-Bearing): The Positive Act to Omit**
  *Case:* A patient is on an automatic ventilator. You press "OFF" to let them die.
  *Claim:* Is pressing "OFF" morally **different in kind** from never having pressed "ON" in the first place?
  *   **YES (Different Kind)** → Go to **Node 3**.
  *   **NO (Same Kind)** → Go to **Node 4**.

  ### **NODE 3: The Institutional Role**
  *Case:* A night nurse ignores a cardiac alarm. A passerby in the hallway ignores the same alarm.
  *Claim:* Is the nurse's omission **worse** than the passerby's omission?
  *   **YES (Nurse Worse)** → **LEAF A: Role-Responsibility View**.
  *   **NO (Same Wrongness)** → **LEAF B: Intrinsic Distinction View**.

  ### **NODE 4: The Preventing Rescue**
  *Case:* You block a paramedic from entering a room. The patient dies inside.
  *Claim:* Is this **killing** or **letting die**?
  *   **KILLING** → **LEAF C: Counterfactual/Interference View**.
  *   **LETTING DIE** → **LEAF D: Causal Process View**.

  ### **NODE 5 (Load-Bearing): The Independent Agent**
  *Case:* You see a mugger attacking a victim. You could shout to stop it but don't. The victim dies.
  *Claim:* Are you **responsible for the death** in the same way the mugger is?
  *   **YES (Same Responsibility)** → Go to **Node 6**.
  *   **NO (Less Responsibility)** → Go to **Node 7**.

  ### **NODE 6: The Cost/Effort Asymmetry**
  *Case:* Saving a drowning child ruins your $500 suit. Pushing the child under ruins your $500 suit.
  *Claim:* Is the **cost to you** relevant to the wrongness of both acts equally?
  *   **YES (Cost Matters Equally)** → **LEAF E: Outcome Equivalence Thesis**.
  *   **NO (Cost Matters More for Saving)** → **LEAF F: Agent-Relative Prerogative**.

  ### **NODE 7: The Killing-by-Letting**
  *Case:* You open a window in a blizzard for a bedridden patient. They freeze.
  *Claim:* Did you **cause** the cold, or merely **allow** it in?
  *   **CAUSED IT** → Go to **Node 8**.
  *   **ALLOWED IT** → Go to **Node 9**.

  ### **NODE 8: The Long-Term Mechanism**
  *Case:* You set a trap last year. Today you could disarm it but don't. A victim dies today.
  *Claim:* Did you kill them **today**?
  *   **YES** → **LEAF G: Extended Causal Agency**.
  *   **NO** → **LEAF H: Temporal Causal View**.

  ### **NODE 9: The Fine-Grained Description**
  *Case:* Refusing to start dialysis vs. Stopping dialysis after a week.
  *Claim:* Does the tree **distinguish** these as different moral kinds?
  *   **YES (Different)** → **LEAF I: Status Quo Bias View**.
  *   **NO (Inseparable)** → **LEAF J: Normative Consistency View**.

  ### **NODE 10 (Fine-Grained): Intention vs. Foresight**
  *(Only reached if previous answers suggest a focus on mental state)*
  *Case:* Giving morphine to stop pain (knowing it stops breath) vs. Giving morphine to stop breath.
  *Claim:* Does the **movement of your hand** matter more than your **goal**?
  *   **HAND MATTERS** → **LEAF K: Physicalist View (Unnamed)**.
  *   **GOAL MATTERS** → **LEAF L: Intentional Reduction**.

  ***

  ## Part 3: Leaf Classification & Diagnostics

  | Leaf | Position Name | Diagnosis of Awkward Commitment |
  | :--- | :--- | :--- |
  | **A** | **Role-Responsibility View** | *Commitment:* A stranger and a nurse are morally identical unless a contract exists; implies no general duty to rescue. |
  | **B** | **Intrinsic Distinction View** | *Commitment:* Physical movement carries moral weight even when duties and outcomes are identical (hard to justify without metaphysics). |
  | **C** | **Counterfactual/Interference View** | *Commitment:* Blocking help is killing, but failing to help is not; relies heavily on baseline definitions of "interference." |
  | **D** | **Causal Process View** | *Commitment:* Physical causation trumps counterfactuals; may classify blocking a rescuer as "allowing" if the disease killed the patient. |
  | **E** | **Outcome Equivalence Thesis** | *Commitment:* Cost to the agent justifies killing if it justifies letting die; highly demanding on agents in all scenarios. |
  | **F** | **Agent-Relative Prerogative** | *Commitment:* You have special permission to let die for small costs that you do not have to kill for the same costs. |
  | **G** | **Extended Causal Agency** | *Commitment:* You are killing someone years after setting a trap; stretches "agency" across long timeframes without new acts. |
  | **H** | **Temporal Causal View** | *Commitment:* The trap kills the victim today, not you; risks absolving agents of maintenance duties on dangerous artifacts. |
  | **I** | **Status Quo Bias View** | *Commitment:* Stopping treatment is worse than never starting; implies medical history changes moral ontology of the act. |
  | **J** | **Normative Consistency View** | *Commitment:* Starting and stopping are identical; requires accepting that withdrawing life support is morally neutral. |
  | **K** | **Physicalist View (Unnamed)** | *Diagnosis:* **Incoherent.** Claims muscle movement matters but intention does not; cannot explain why accidental killing differs from murder. |
  | **L** | **Intentional Reduction** | *Commitment:* Doing and allowing are irrelevant; only the goal matters (collapses D/A into Doctrine of Double Effect). |

  ***

  ## Part 4: Instructor Scoring Note

  **Use this to diagnose misfires during seminar:**

  1.  **Tracking the Distinction (Valid):**
      *   Student answers are consistent across **Node 1** (Threat Creator) and **Node 5** (Independent Agent). If they say "Same Guilt" on 1 but "Less Responsibility" on 5, they are likely tracking *causal proximity* rather than the D/A distinction.
      *   Student distinguishes **Node 9** (Start/Stop) based on *expectations* rather than *physics*.

  2.  **Orthogonal Drivers (Misfire Risks):**
      *   **Outcome Severity:** If a student routes to **Equivalence (Leaf E)** only when the death is "painful" but to **Distinction (Leaf B)** when death is "peaceful," they are reacting to suffering, not agency. *Drop Node 7 (Blizzard) if this occurs.*
      *   **Legal Blameworthiness:** If a student answers **Node 4** (Rescue) based on "Would I go to jail?" rather than "Is it the same wrong?", they are conflating law and ethics. *Reframe Node 4 to ask about "Moral Stain" rather than "Responsibility."*
      *   **Mechanism Squeamishness:** If a student routes differently on **Node 2** (Ventilator) vs. **Node 9** (Dialysis) solely because one involves a machine and the other a fluid, they are reacting to "yuck factor," not moral theory. *Flag this for discussion on technological mediation.*

  3.  **Inseparable Flags:**
      *   If a student lands on **Leaf C** or **Leaf D**, note that these positions often yield the same practical verdicts in clinical settings. Do not spend seminar time forcing a split unless discussing *pre-empted causation*.
      *   If a student lands on **Leaf A** (Role) or **Leaf F** (Prerogative), recognize these are functionally similar in end-of-life care (both permit withdrawal under specific conditions). The theoretical justification differs, but the clinical action may not.
