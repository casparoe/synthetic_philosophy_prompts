answer: |-
  This is a sophisticated reconstruction of the classic "Heterogeneity Objection" to qualitative hedonism (reminiscent of arguments by C.D. Broad and G.E. Moore, updated with contemporary phenomenological concerns). Your intuition that the argument is powerful is correct, but your suspicion about a "leak" is also well-founded.

  The argument does not fail logically, but it relies on an **equivocation in the definition of Q** between premises (4) and (8), which a sophisticated hedonist will exploit to escape the dilemma. Additionally, your suspicion about "smuggling" in (7)–(8) is accurate: that is where the normative/relational work is being done covertly.

  Here is the diagnosis of the argument chain, the location of the leak, and the cost of plugging it.

  ### 1. The Primary Leak: Equivocation in Premise (8)
  The critical vulnerability lies in the transition from (4) to (8). You are sliding between two distinct concepts of $Q$:

  *   **Concept A (Premise 4):** $Q$ is a *sui generis* phenomenal quality (a "raw feel" or qualia). It is a property of the experience itself, analogous to "redness" or "middle-C."
  *   **Concept B (Premise 8):** $Q$ is a *mode of presentation* or *pro-attitude* ("experienced as pleasant"). This implies a relation between the subject and the experience.

  **The Leak:**
  If you stick with **Concept A** (Quality):
  *   Premise (9) becomes coherent (one can have the raw feel without the pro-attitude).
  *   **But Premise (10) fails.** Merely having a raw feel does not entail intrinsic goodness. The hedonist must argue that $Q$ *necessitates* goodness. If $Q$ is just a quality, the link to goodness is contingent, and hedonism collapses.

  If you stick with **Concept B** (Mode/Attitude):
  *   Premise (10) holds (by definition, if it is "experienced as pleasant," it is good).
  *   **But Premise (9) becomes incoherent.** You cannot coherently describe a subject who "experiences $Q$" (where $Q$ = experienced as pleasant) but "reports it as aversive." That is equivalent to saying, "The subject experiences this as pleasant, but experiences it as unpleasant."

  **Diagnosis:** The argument works only if you switch definitions mid-stream. You use Concept A to make the inversion case (9) conceivable, but you use Concept B to force the normative classification (10). A hedonist will block the move from (9) to (10) by insisting that if the subject finds it aversive, they *lack* $Q$ (Concept B).

  ### 2. The "Smuggling" Confirmation (Premises 7–8)
  You asked if you smuggled a relational criterion into the transparency claim. **Yes, you did.**

  *   **Premise (1c)** requires $Q$ to be **intrinsic and non-relational**.
  *   **Premise (8)** defines having $Q$ as "being experienced as pleasant."

  "Being experienced as..." is a relational property (a Cambridge property). It depends on the subject's cognitive or conative stance toward the experience, not just the experience's internal constitution. By moving from (7) to (8), you have implicitly abandoned (1c) to save the phenomenon of pleasure.
  *   **Cost:** If you make this explicit, you are no longer arguing against *Qualitative* Hedonism (which requires 1c); you are arguing for *Attitudinal* Hedonism (where the good is the attitude of liking, not a quality). The argument successfully proves that Qualitative Hedonism *must* become Attitudinal Hedonism to survive, but it doesn't prove Attitudinal Hedonism false.

  ### 3. The Coherence of the Inversion Case (Premise 9)
  You asked for plain pushback on whether (9) is conceptually incoherent. This is the standard hedonist defense (championed by Fred Feldman).

  *   **The Hedonist Reply:** "Pleasure" is a normative phenomenal concept. It is not like "redness" (which can exist without being liked); it is more like "pain." Just as you cannot feel "pain" without it hurting (aversive), you cannot feel "pleasure" ($Q$) without it being attractive.
  *   **The Leak:** If "pleasantness" is conceptually tied to "attractiveness," then your inversion case describes a logical impossibility, not a neuropsychological exoticism.
  *   **Counter-Move:** To save (9), you must describe the case without using the word "pleasant." Describe it as: "The subject has the *sui generis* quality $Q$ (from Premise 4), but their conative stance is avoidance."
      *   If you do this, the Hedonist replies: "Then $Q$ is not pleasantness. It is just a neutral tone. Why is *that* intrinsically good?"
      *   This returns you to the Equivocation problem in (8).

  ### 4. Recommendation: How to Plug the Leak
  To make this argument watertight against a qualitative hedonist, you need to stop trying to keep (1c) and force the hedonist to choose between **Normativity** and **Phenomenology**.

  **Reject Premise (4).**
  Instead of positing $Q$ as a *sui generis* quality, argue that the *only* candidate for $Q$ that satisfies the normative requirement (1a/1b) is a **pro-attitude**.
  *   **Revised Argument:**
      1.  Keep (1) through (3).
      2.  Reject (4). Argue that there is no *phenomenal quality* common to all pleasures.
      3.  Replace (4) with: "The only commonality is a pro-attitude (liking/wanting)."
      4.  This forces the view into Attitudinal Hedonism.
      5.  Then, run your Inversion Case (9) against the *Attitude*. (Can one like something intrinsically but judge it bad? Yes, via adaptive preferences or manipulation).

  **If you want to keep your current structure:**
  You must tighten **(8)** to expose the equivocation.
  *   **Change (8) to:** "If $Q$ is transparent, then 'has $Q$' is indistinguishable from 'is liked.' But if 'has $Q$' is indistinguishable from 'is liked,' then $Q$ is relational, violating (1c)."
  *   **Change (9) to:** "Imagine a subject who has the *phenomenal quality* postulated in (4), but does not like it."
  *   **Conclusion:** "Therefore, the phenomenal quality (4) is not what makes the experience good. The liking is what makes it good. Therefore, Qualitative Hedonism is false; only Attitudinal Hedonism remains."

  ### Summary of Costs
  *   **If you reject (9):** You concede that pleasure is conceptually normative. This saves Qualitative Hedonism but makes it unfalsifiable by phenomenological report.
  *   **If you reject (8):** You admit that "pleasantness" cannot be defined transparently without reference to the subject's stance. This violates (1c) and collapses Qualitative Hedonism into Attitudinal Hedonism.
  *   **If you reject (4):** You deny there is a *sui generis* quality. This solves heterogeneity but abandons the core claim of *Qualitative* Hedonism.

  **Verdict:** Your argument is a successful *reductio* of **Qualitative** Hedonism, provided you acknowledge that the "leak" is the Hedonist's ability to shift definitions. The argument proves that $Q$ cannot be both a *non-relational quality* (1c) and *the ground of intrinsic value* (10) without collapsing into relationality. The most honest conclusion is not that Hedonism is false simpliciter, but that **Qualitative Hedonism is untenable** and must be replaced by Attitudinal Hedonism.
