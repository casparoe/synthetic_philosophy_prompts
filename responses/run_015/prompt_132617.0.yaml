  ### Step 1: Sketching the Rotation Pattern

  To embody Braudel's historiography, the form must enact the tension between structural time (*longue durée*) and event time (*histoire événementielle*). A standard sestina permutation (retrogradatio cruciata) forces all words to move equally. To reflect the *longue durée*, I will modify the permutation so that the geographical terms (**range**, **soil**, **current**) remain anchored at the structural boundaries (lines 1 and 6) and the structural center (line 3), while the event terms (**treaty**, **king**, **famine**) circulate through the remaining positions (2, 4, 5).

  Since there are three geographical terms and only two boundary positions (1 and 6), one geographical term must occupy the center (line 3) in each stanza. This represents how geography underpins the center of history even when events churn around it. The event terms will rotate through the interstitial spaces (2, 4, 5), never finding rest on the edges.

  **Key:**
  *   **G (Geographical/Structural):** range, soil, current
  *   **E (Event/Ephemeral):** treaty, king, famine

  **Pattern:** G1 – E1 – G2 – E2 – E3 – G3
  *(Positions 1, 3, 6 are anchored by Structure; 2, 4, 5 circulate Events)*

  **Stanza Rotation:**
  *   **S1:** range – treaty – soil – king – famine – current
  *   **S2:** current – famine – range – treaty – king – soil
  *   **S3:** soil – king – current – famine – treaty – range
  *   **S4:** range – king – soil – famine – treaty – current
  *   **S5:** current – treaty – range – king – famine – soil
  *   **S6:** soil – famine – current – treaty – king – range

  **Envoi:** All six words appear once across three lines (two per line), with no syntactic hierarchy resolving their tension.

