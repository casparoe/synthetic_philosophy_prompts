answer: |-
  You are largely right, but you are stopping one layer short of the real friction. Your hypothesis correctly identifies the **causal** disagreement, but the stalemate persists because that causal disagreement maps onto a deeper **normative** disagreement.

  Here is the diagnosis of why the debate won't move, what would count as progress, and where the uncertainty lies.

  ### 1. The Diagnosis: Two Layers of Disagreement

  **Layer 1: The Causal Definition (Your Hypothesis)**
  You are correct that the word "contribute" is doing too much work.
  *   **Side A (No Difference)** is using a **Counterfactual Theory of Causation**. *X caused Y* means "If X had not occurred, Y would not have occurred." In overdetermined systems (like climate change or mass markets), individual acts fail this test. Therefore, they claim there is no causal link.
  *   **Side B (Contribution)** is using a **Process or Constitutive Theory of Causation**. *X caused Y* means "X was a necessary part of a sufficient set of conditions that produced Y." Your act is a brick in the wall, even if removing one brick doesn't topple the wall.

  If this were the only disagreement, defining terms would solve it. Side A would admit, "Okay, I am a constitutive part, but not a difference-maker." But they usually don't stop there. They say, "Being a part doesn't make it *wrong*." This leads to Layer 2.

  **Layer 2: The Moral Principle (The Substantive Block)**
  Even if Side A grants the "part-based" definition of contribution, they often still conclude the act is permissible. This reveals the substantive disagreement:
  *   **Side A holds an Outcome-Responsibility View:** Moral wrongness is tethered to *making the world worse*. If the state of the world is identical with or without your act, you have not worsened it. Therefore, you bear no responsibility.
  *   **Side B holds a Complicity/Integrity View:** Moral wrongness is tethered to *participation in a harmful practice*. It is about keeping one's own hands clean, regardless of the marginal outcome. To them, joining a harmful collective enterprise is intrinsically wrongful, even if your specific participation didn't tip the scale.

  **Why the debate stalls:**
  Side A thinks Side B is being irrational/mystical about "tainted hands." Side B thinks Side A is hiding behind a technicality to avoid moral accountability. They talk past each other because Side A is arguing about **consequences**, and Side B is arguing about **character/association**.

  ### 2. What Would Count as Progress?

  To move the group, you need to force them to separate these layers. Here are three specific moves:

  **Move A: The Terminology Shift (Resolving Layer 1)**
  Ban the words "cause" and "contribute." Replace them with:
  1.  **Counterfactual Impact:** "Did my act change the outcome?" (Side A wins here).
  2.  **Causal Participation:** "Was my act a necessary component of the harm-producing mechanism?" (Side B wins here).
  *Progress:* If Side A admits, "I have zero counterfactual impact but high causal participation," you have isolated the real disagreement to Layer 2.

  **Move B: The Expected Value Challenge (Undermining Side A's Premise)**
  Side A claims, "My act makes no difference." In many collective harm cases (like buying meat or carbon), this is empirically false due to **thresholds**.
  *   Supply chains work in batches. One purchase doesn't kill one chicken, but *someone's* purchase triggers an order for 1,000 more. You don't know if you are the threshold trigger.
  *   *Rephrasing:* "My act has a low *probability* of making a massive difference, but the *expected value* is not zero."
  *Progress:* If Side A accepts Expected Utility Theory, they must concede the act is wrong based on risk, even if the *actual* outcome was overdetermined. This often converts Side A without requiring them to accept Side B's "complicity" logic.

  **Move C: The "Clean Hands" Test (Isolating Layer 2)**
  Ask Side A: "If we grant that you are a causal participant (a brick in the wall), but you still made no difference, is the act *neutral* or merely *less bad*?"
  *   If they say "Neutral," they are committed to pure Outcome-Responsibility.
  *   If they say "Less bad," they are conceding ground to Side B's Complicity view.
  *Progress:* This forces Side A to defend the hard line that *only* difference-making matters morally. This is a much harder philosophical position to defend than "I didn't cause it."

  ### 3. Confidence and Uncertainty

  **Confidence: High (85%)**
  I am highly confident that the stalemate is a hybrid of semantic equivocation (causation definitions) and divergent moral axioms (consequentialism vs. complicity). This is the standard structural breakdown of the "inefficacious harm" problem in analytic ethics. The "verbal" diagnosis is correct but insufficient because the causal definition serves as a proxy for the moral commitment.

  **Least Certain Point: The Empirical Reality of "No Difference"**
  I am least sure about the empirical claim that "the harm would have happened anyway." In some contexts (like voting or specific supply chains), the "no difference" claim is mathematically robust. In others (like meat consumption or carbon emissions), it is often empirically false due to threshold effects and market signaling.
  *   *Why this matters:* If the specific examples your group uses (e.g., buying a specific burger) actually *do* have counterfactual impact due to supply chain mechanics, Side A's entire premise collapses, and the philosophical debate becomes moot. If your group is debating abstract "magic button" cases where difference is truly zero, my diagnosis holds. If they are debating real-world meat/carbon, the "Expected Value" move (Move B above) is the silver bullet, and the philosophical nuance matters less.

  ### Summary Recommendation
  Tell your group: "We are conflating **Causal Participation** with **Counterfactual Impact**. Side B is right about Participation; Side A is right about Impact. The real question is: **Does moral wrongness require Impact, or does Participation suffice?** Let's debate *that* specifically, rather than arguing about whether we 'caused' the harm."
