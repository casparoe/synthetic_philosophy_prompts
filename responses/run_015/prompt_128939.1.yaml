      *   *Better angle:* The "Stepwise Validity" argument fails because it ignores the *hierarchical supremacy* of the entrenchment clause. An entrenchment clause is a rule about rules. It says "This rule is immune to the process it establishes." If you use the process to change the *conditions* of the process, you violate the immunity.
