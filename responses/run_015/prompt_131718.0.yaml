prompt: |-
  I just finished a long argument with a friend about whether art-status is conferred by an institution or by properties intrinsic to the object, and we kept returning to a scenario neither standard example resolves. I call it the reverse-readymade: a work that has been displayed as canonical art for decades is formally revoked by the same institution that originally conferred its status, not because the physical object changed, but because the board decides the artist's later conduct disqualifies the work from the canon. The friend insisted the object is still art; I wasn't sure. Now I want my students to feel that instability rather than just discuss it. I run an upper-level aesthetics seminar—twelve students, ninety minutes, all philosophy majors familiar with institutional theories but not with this reversal case. Design a structured in-class simulation in which participants collectively write the rules for art-status conferral before they see the revocation scenario, then must apply their rules to vote on whether the object retains art-status. The rules, roles, and voting mechanism should be arranged so that the group runs into a coordination failure or circular dependency—perhaps between curatorial authority and public aesthetic judgment—before anyone names the institutional circularity problem. Include specific roles (e.g., board curators, estate representatives, independent critics, public voters), a payoff or point scheme that requires no real money, materials needed, a minute-by-minute timeline, and a debrief that maps each crisis point in the activity onto a corresponding part of Dickie's or Danto's institutional framework and onto rival intrinsic-property accounts. Be explicit about what will predictably go wrong the first time—say, the group collapses to a simple majority vote too quickly—and how to prevent it. Also be frank about which feature of the actual philosophical debate, such as the historical-intentional constraint on artistic identity, the simulation cannot reproduce and must be supplied by me in the debrief. The students should leave having experienced the pull of both the institutional and the anti-institutional intuition, not just having heard them named.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Goal:** Design a 90-minute in-class simulation for an upper-level aesthetics seminar (12 philosophy majors).
      *   **Topic:** The "Reverse-Readymade" scenario (an artwork officially de-consecrated by the institution due to the artist's conduct, not physical change).
      *   **Core Mechanism:** Students write rules for art-status conferral *before* seeing the revocation scenario, then apply them.
      *   **Desired Outcome:** Experience instability/coordination failure (circular dependency between authority and judgment) rather than just discussing it.
      *   **Requirements:** Specific roles, point scheme (no money), materials, minute-by-minute timeline, debrief mapping to Dickie/Danto/Intrinsic accounts, prediction of failure modes (e.g., collapsing to majority vote) and prevention, and acknowledgment of simulation limitations.
      *   **Tone:** Academic, structured, pedagogical, frank about limitations.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Institutional Theory (Dickie):* Art is what the "Artworld" says it is. Status is conferred.
      *   *Historical/Intentional (Danto):* Art requires an atmosphere of artistic theory and history.
      *   *Intrinsic/Functionalist:* Art has properties (beauty, form, expression) independent of context.
      *   *The Twist:* Revocation. If the Artworld takes it back, does it cease to be art?
      *   *The Tension:* If status is conferred, can it be rescinded? If it's intrinsic, revocation is impossible. If it's historical, does the history get erased?
      *   *The Simulation Trap:* Students need to write rules that seem robust but break when the "Revocation" card is played. The breakdown should happen because the rules rely on each other (circularity).

  3.  **Drafting the Simulation Structure:**
      *   **Phase 1: Constitution Writing (20 mins).** Students define "Art."
      *   **Phase 2: Role Assignment & Scenario Reveal (10 mins).** Give them the "Reverse-Readymade" case.
      *   **Phase 3: Deliberation & Voting (30 mins).** Apply rules to the case.
      *   **Phase 4: The Crisis (15 mins).** Introduce a constraint that breaks their system.
      *   **Phase 5: Debrief (15 mins).** Connect to theory.

      *Wait, 90 minutes is tight.* I need to ensure the "Crisis" happens *during* deliberation, not as a separate phase, to force the coordination failure.
      *Revised Structure:*
      1.  Intro & Rule Making (20 min)
      2.  Scenario & Roles (10 min)
      3.  Round 1 Voting (15 min)
      4.  The "Revocation" Twist & Round 2 (25 min)
      5.  Debrief (20 min)

  4.  **Designing the Roles & Payoff:**
      *   Need 12 students.
      *   *Roles:*
          *   Museum Board (3): Have authority to confer/revoke.
          *   Estate/Legal (3): Care about value/authenticity.
          *   Critics/Theorists (3): Care about definition/history.
          *   Public/Viewers (3): Care about experience/access.
      *   *Payoff:* "Prestige Points."
          *   Board wants consistency/authority.
          *   Estate wants value retention.
          *   Critics want theoretical coherence.
          *   Public wants access/truth.
      *   *The Trap:* The rules they write in Phase 1 will likely privilege one group. When the Revocation happens, the other groups will block the vote, creating a deadlock.

  5.  **Designing the "Reverse-Readymade" Scenario:**
      *   Object: *The Blue Square* (fictional canonical minimalist work).
      *   Artist: Famous, now revealed to have committed heinous acts (or something that triggers moral revocation).
      *   Action: Museum Board votes to de-accession and declare it "Non-Art" (artifact of crime, not art).

  6.  **Addressing the "Coordination Failure":**
      *   How to ensure they don't just vote?
      *   *Mechanism:* Quadruple Veto. Each faction has a veto power if their specific "Constitutional Clause" is violated.
      *   *Prediction:* They will write vague rules to agree quickly.
      *   *Prevention:* The instructor acts as "The Registrar" and rejects vague rules that don't assign decision rights.

  7.  **Addressing the Limitations:**
      *   Simulations can't reproduce the *weight* of history. A 90-minute game doesn't feel like 50 years of canonization.
      *   Simulations can't reproduce the *phenomenology* of seeing the art.
      *   I need to explicitly state this in the debrief section.

  8.  **Fleshing out the Details (Iterative refinement):**
      *   *Timeline:* Needs to be precise.
      *   *Materials:* Index cards, role sheets, a "Statute Book."
      *   *Debrief:* Must map specific moments to Dickie (conferral), Danto (atmosphere), and Intrinsic (properties).
      *   *Failure Mode:* Students usually default to utilitarianism (greatest good). I need to force them into deontological rule-following. *Correction:* The prompt asks for coordination failure/circularity. I need the rules to conflict.
      *   *Refined Mechanism:* The Rules they write in Phase 1 *must* be used in Phase 2. If the Rules contradict the Revocation, they have to amend the Rules. Amending requires unanimity. This creates the deadlock.

  9.  **Writing the Plan:**
      *   *Title:* The De-Consecration Protocol.
      *   *Introduction:* Set the stage.
      *   *Phase 1 (Constitution):* Groups draft clauses.
      *   *Phase 2 (The Case):* Reveal the Reverse-Readymade.
      *   *Phase 3 (The Crisis):* The Board tries to revoke. The Rules block them (or vice versa).
      *   *Phase 4 (Debrief):* Philosophical mapping.

      *Self-Correction on "Coordination Failure":* To make it circular, the Board needs the Critics to validate the status, but the Critics need the Board to display it. If the Board revokes, Critics lose their object. If Critics object, Board loses legitimacy.
      *Let's make the Voting Mechanism specific:* A "Status Token" must be passed. If held by Board, it's Art. If held by Public, it's Experience. If revoked, where does the token go?

      *Actually, keep it simpler for 90 mins.*
      1. Write Rules for "What makes Art."
      2. Reveal Case: Board wants to Revoke.
      3. Apply Rules.
      4. *The Twist:* The Rules they wrote rely on "Consensus" or "Authority," but the Revocation splits them.
      5. *The Trap:* The Instructor (Registrar) refuses to accept a vote unless it aligns with the Phase 1 Rules. Since Phase 1 Rules were vague/contradictory, they can't vote.

  10. **Final Review against Constraints:**
      *   12 students? Yes (4 groups of 3).
      *   90 minutes? Yes.
      *   Philosophy majors? Yes (use technical terms in debrief).
      *   Payoff scheme? Yes (Prestige Points).
      *   Predictable failure? Yes (Rule vagueness).
      *   Limitations? Yes (Historical weight).

  11. **Drafting the Content:** (Mental check of the Dickie/Danto mapping).
      *   Dickie: Conferral is key. If revoked, is it still art? Dickie implies status is stable once conferred, but his theory allows for the Artworld to change its mind.
      *   Danto: Artworld atmosphere. If the atmosphere changes (moral outrage), does the "is of artistic identification" vanish?
      *   Intrinsic: The object didn't change. It remains art.

      *Let's refine the "Circular Dependency".*
      The Board can only revoke if the Critics agree it lacks "Artistic Merit." The Critics can only judge "Artistic Merit" if the Board maintains it as "Art."
      *Board:* "We revoke status."
      *Critics:* "We can't judge merit if it's not art."
      *Board:* "We need you to judge merit to revoke."
      *Deadlock.*

      *Okay, I will build this specific dependency into the Role Cards.*

  12. **Final Polish:** Ensure tone is professional and instructional. (Proceed to generate output).

  *(Self-Correction during drafting)*: Make sure the "Payoff" isn't too gamified. It needs to serve the philosophical point. Points represent "Institutional Capital." If the system collapses, everyone loses capital. This incentivizes finding a solution, but the rules prevent it.

  *(Final check on limitations)*: Be very clear that the simulation creates a *logical* problem, but the real world problem is *ontological/historical*. The simulation is a model, not the territory.

  *(Final check on prevention)*: How to stop them from just ignoring rules? The Instructor is the "Supreme Court of the Artworld." You must rule their procedural moves out of order if they bypass the Phase 1 Constitution.

  Okay, ready to write.cw
answer: |-
  # Simulation Plan: The De-Consecration Protocol
  **Course:** Upper-Level Aesthetics Seminar  
  **Duration:** 90 Minutes  
  **Enrollment:** 12 Students (Philosophy Majors)  
  **Topic:** Institutional Theory vs. Intrinsic Properties (The "Reverse-Readymade")  

  ## I. Learning Objectives
  1.  **Experiential:** Students will feel the friction between *procedural authority* (who decides) and *ontological status* (what the object is).
  2.  **Analytical:** Students will identify circular dependencies in rule-based systems of valuation.
  3.  **Theoretical:** Students will map the simulation's breakdown to specific weaknesses in Dickie's "Conferral" and Danto's "Atmosphere," contrasting them with Intrinsic/Functionalist accounts.

  ## II. Materials Needed
  *   **The Statute Book:** A large whiteboard or shared digital doc visible to all.
  *   **Role Cards:** 12 cards (4 sets of 3 distinct roles).
  *   **Status Tokens:** 12 physical chips or cards (representing "Art-Status").
  *   **The Case File:** One printed handout describing the "Reverse-Readymade" scenario.
  *   **Timer:** Visible to the class.

  ## III. Roles & Payoff Scheme (Institutional Capital)
  Divide the class into four factions of three students each. Each faction holds a different form of "Institutional Capital" (IC). The goal is to end the simulation with positive IC. If the system collapses (no verdict reached), everyone loses 5 IC.

  1.  **The Board (3 students):** Hold *Authority Capital*.
      *   *Goal:* Maintain institutional legitimacy. They want the power to revoke status without causing a scandal.
      *   *Power:* Only they can physically move the Status Token.
  2.  **The Estate (3 students):** Hold *Market Capital*.
      *   *Goal:* Maintain the object's value. If it ceases to be "Art," value drops to zero.
      *   *Power:* They control the "Provenance Record" (official history).
  3.  **The Critics (3 students):** Hold *Theoretical Capital*.
      *   *Goal:* Maintain definitional coherence. They care about whether the *definition* of art holds.
      *   *Power:* They write the "Justification" required for any status change.
  4.  **The Public (3 students):** Hold *Reception Capital*.
      *   *Goal:* Maintain access and emotional truth. They care about the experience of the object.
      *   *Power:* They control "Visibility" (whether the object is shown or hidden).

  ## IV. Minute-by-Minute Timeline

  ### Phase 1: The Constitution (00:00 – 00:20)
  **Activity:** Collective Rule-Making.
  **Instruction:** "Before we discuss any specific artwork, this seminar is now the 'Supreme Art Tribunal.' You must write 3 Constitutional Clauses that define how an object gains or loses Art-Status. These rules must be procedural, not moral."
  **Constraint:** You (the Instructor) act as **The Registrar**. You will reject any rule that is vague (e.g., "Art is beautiful"). Force them to assign *decision rights* (e.g., "Status changes require a 2/3 vote").
  **The Trap:** Students will likely write rules that privilege *consensus* or *authority* without defining the relationship between them.
  *   *Example Rule they might write:* "Art-Status requires Board approval AND Critical justification."
  *   *Registrar Intervention:* If they write "Art is what we feel," reject it. Demand: "Who verifies the feeling?"

  ### Phase 2: The Case Reveal & Role Assignment (00:20 – 00:30)
  **Activity:** Distribute Role Cards and Case File.
  **The Scenario (The Reverse-Readymade):**
  > *Object:* "Void #5" (1974), a canonical minimalist sculpture held by the Museum.
  > *History:* Displayed continuously for 50 years. Universally accepted as Art.
  > *Event:* New evidence proves the artist fabricated their biography and used the work to launder money for a violent regime.
  > *Action:* The Board wishes to **Revoke** Art-Status. They want to reclassify "Void #5" as "Historical Artifact of Crime."
  > *Constraint:* The physical object has not changed.

  **Instruction:** "Apply your Phase 1 Constitution to this case. You have 10 minutes to reach a verdict: Is 'Void #5' still Art? Yes or No."

  ### Phase 3: The Deliberation & The Crisis (00:30 – 00:55)
  **Activity:** Faction deliberation followed by plenary voting.
  **The Mechanism:** To change the Status Token from "Art" to "Non-Art," the following must happen simultaneously based on typical Phase 1 rules:
  1.  **Board** must move the token.
  2.  **Critics** must write a justification.
  3.  **Estate** must update the Provenance.
  4.  **Public** must agree to Visibility.

  **The Coordinator Failure (Predicted):**
  *   The **Board** wants to revoke to save legitimacy.
  *   The **Critics** cannot write a justification because their Phase 1 rules likely state "Critics judge Art, not Morality." If it's not Art, they have no jurisdiction to judge it.
  *   The **Estate** refuses to update Provenance because "Non-Art" destroys value, violating their payoff.
  *   The **Public** threatens to hide the object (remove Visibility) if it is revoked, which makes the Board's revocation invisible (and thus pointless).

  **Instructor Role (The Registrar):**
  *   Do not solve the deadlock.
  *   Enforce the Phase 1 Rules strictly. If they try to vote by simple majority, rule it "Out of Order" because the Constitution requires Faction Consensus.
  *   If they try to ignore the Rules, remind them: "Without rules, there is no Tribunal. You are just shouting."
  *   **Goal:** Let them feel the paralysis. The Board needs the Critics to validate the revocation, but the Critics need the Board to maintain the object as Art to have a subject matter. *Circular Dependency.*

  ### Phase 4: The Forced Collapse (00:55 – 01:05)
  **Activity:** Stop the simulation.
  **Instruction:** "Time. The Tribunal has failed to reach a verdict. The object remains in the vault. Status: Indeterminate."
  **Task:** Ask each faction to write one sentence on a sticky note: *Why was your faction unable to act?*
  *   *Board:* "We lacked authority without justification."
  *   *Critics:* "We lacked an object to critique."
  *   *Estate:* "We lacked a category for value."
  *   *Public:* "We lacked access."

  ### Phase 5: The Debrief (01:05 – 01:30)
  **Activity:** Philosophical Mapping.
  **Method:** Draw a triangle on the board: **Authority (Dickie)** — **History/Intention (Danto)** — **Properties (Intrinsic)**. Plot the simulation's failure points onto this triangle.

  ---

  ## V. Debrief Script & Philosophical Mapping

  ### 1. Mapping the Crisis Points
  *   **The Board's Paralysis (Dickie's Weakness):**
      *   *Simulation:* The Board couldn't revoke without Critical justification.
      *   *Theory:* George Dickie's Institutional Theory states art is status *conferred* by the Artworld. But Dickie is vague on *rescission*. If the Artworld takes it back, does the status vanish? The simulation showed that conferral requires a network. If one node (Critics) disconnects, the conferral fails.
      *   *Takeaway:* Institutional status is not a switch; it's a tensioned web.

  *   **The Critics' Paralysis (Danto's Weakness):**
      *   *Simulation:* Critics couldn't judge the object once it was potentially "Non-Art."
      *   *Theory:* Arthur Danto argues art requires an "atmosphere of artistic theory." If the Museum (the physical space of the atmosphere) rejects the object, does the atmosphere dissipate? The simulation showed that without the *institutional frame*, the Critics lost their language to describe the object.
      *   *Takeaway:* Theory depends on the institution that houses it.

  *   **The Estate/Public Intuition (Intrinsic/Functionalist Strength):**
      *   *Simulation:* The Estate and Public felt the object *itself* hadn't changed.
      *   *Theory:* This mirrors the Intrinsic/Functionalist intuition (Bell, Fry, or newer aesthetic functionalists). If the perceptual properties are identical, the ontological status should be stable. The students likely felt it was *wrong* to say it stopped being art.
      *   *Takeaway:* This is the strongest intuitive counter-argument to Institutionalism.

  ### 2. Addressing Predictable Failure Modes
  *   **Failure:** *The "Simple Majority" Bypass.*
      *   *What happens:* Students ignore their Phase 1 Constitution and just vote 7-5.
      *   *Prevention:* As The Registrar, you must declare the vote null. "The Constitution requires Faction Consensus. A majority vote violates Clause 2." Force them back into the deadlock.
  *   **Failure:** *The "Moral" Distraction.*
      *   *What happens:* Students spend 20 minutes debating whether the artist was actually bad.
      *   *Prevention:* Interrupt immediately. "The artist's conduct is a given fact of the case. The question is not *if* they are bad, but whether *badness* affects *art-status* under your rules."

  ### 3. Simulation Limitations (Crucial Disclosure)
  Be frank with the students about what the game *cannot* do. Write this on the board:

  1.  **The Weight of History:** In the simulation, the object was "canonical" for 50 years. In reality, that creates an ontological inertia that a 90-minute vote cannot replicate. Students will underestimate how hard it is to *de-canonize* something compared to *canonizing* it.
      *   *Philosophical Point:* This relates to the **Historical-Intentional Constraint**. Danto emphasizes that art is a locus of historical meaning. You cannot erase history by voting. The simulation treats history as a "Provenance Record" (data), but in reality, it is embedded in the reception of the work.
  2.  **The Phenomenology of Viewing:** The students never saw "Void #5." They treated it as a token.
      *   *Philosophical Point:* Intrinsic theorists argue the *experience* constitutes the art. By removing the visual object, the simulation biases toward Institutionalism. You must remind them that in the real world, the viewer's experience persists even if the Museum revokes the label.
  3.  **The "Artworld" is not a Tribunal:** The simulation gamified the Artworld into four distinct factions.
      *   *Philosophical Point:* In reality, the Artworld is diffuse. There is no single Board to revoke status. This makes the "Reverse-Readymade" even more complex in reality: *Who* has the power to revoke? The simulation simplifies this to a coordination problem, but the real problem is the *absence* of a sovereign revoker.

  ## VI. Closing Assignment
  "To resolve the simulation's deadlock, write a 2-page memo from the perspective of **one** faction. Propose a Constitutional Amendment that allows for Revocation without collapsing the system. You must explicitly reference either Dickie (how to modify conferral) or an Intrinsic account (how to separate art from morality) to justify your amendment."

  ---

  ## Instructor Notes: Why This Works
  This simulation forces the "Reverse-Readymade" problem out of the abstract and into the procedural. By making them write the rules *first*, you ensure they own the contradiction when it arises. They cannot blame the instructor for the paradox; they built the paradox themselves. The "Coordination Failure" is not a bug; it is the pedagogical feature. It demonstrates that Institutional Theory is robust at *creation* but fragile at *destruction*, while Intrinsic Theory is robust at *stability* but silent on *contextual disqualification*. The tension they feel in the deadlock is the tension of the semester.
