  I am reasonably confident in the staging of the dispute, particularly in using the villanelle's forced repetition to mimic the philosophical stalemate between functionalism and biological naturalism. The poem leans on a contested reading of the "lookup table" argument (often associated with Searle or Block), assuming such a replacement is physically possible without behavioral degradation, which many neuroscientists would dispute given the combinatorial explosion of inputs. The single point I am least sure of is whether the semantic shift in the refrains lands clearly enough for a reader unfamiliar with the thought experiment, or if the repetition simply reads as formal constraint rather than ontological entrapment.
