  4.  **Addressing the "Hard Parts":**
      *   *Non-negotiable vs. Prejudicial:*
          *   Non-negotiable: Must be applicable to text-only LLM outputs. Must distinguish confident error from deception.
          *   Prejudicial: "Verdicts must not depend on the hearer." Actually, pragmatics *always* depends on context/hearer. But for annotation consistency, we need a *standardized* context. So the requirement "independent of hearer" is prejudicial/impossible. We need "independent of *specific* hearer knowledge, reliant on common ground."
      *   *Incompatible Requirements:*
