      *   Let's anchor on *Commitment to Truth Conditions*.
      *   Lie: Asserting P, knowing (structurally) P is unverifiable/false relative to context.
      *   Since we can't know "knowing," we use *Source Attribution*.
      *   Lie: Claims source/verification that doesn't exist.
