answer: |-
  **Core Specification Requirements**

  To function for LLM annotation, the account must deliver three specific outputs:

  1.  **Case Coverage:** It must classify *paltering* (literally true statements inducing false inference), *presupposition accommodation* (accepting false user premises), and *hallucination* (confident errors). It must distinguish negligent falsehoods from deceptive ones without accessing internal states.
  2.  **Distinct Boundaries:** It must prevent the collapse of "Lie" into "Error" (confident wrongness) and "Lie" into "Misleading" (true statements with false takeaways). The boundary must rest on *explicit propositional content* versus *pragmatic implication*.
  3.  **Empirical Constraints:** It must not contradict Gricean pragmatics (implicature exists) nor cognitive psychology (listeners infer intent from confidence). It must acknowledge that "confidence" in text is a stylistic marker, not a mental state.

  **Hard Part 1: Non-Negotiable vs. Prejudicial**

  *   **Non-Negotiable:** *Mental State Agnosticism.* Since the speaker is an LLM, requirements relying on "belief," "intent," or "knowledge" are unusable. The spec must define lying via *observable commitment* (e.g., claiming verification, citing sources) rather than internal state.
  *   **Non-Negotiable:** *Annotator Consistency.* Definitions must yield stable labels across different annotators given the same context.
  *   **Prejudicial:** *Hearer Independence.* The requirement that "verdicts must not depend on the hearer" is a philosophical prejudice incompatible with pragmatics. Implicature is inherently context-dependent. A user who knows the truth isn't misled; a user who doesn't, is.
      *   *Resolution:* Replace "Hearer Independence" with *Standardized Common Ground*. Annotators must judge based on a stipulated "Reasonable User" profile (e.g., general knowledge, no access to private data), not the actual specific user.

  **Hard Part 2: Incompatible Requirements**

  *   **Conflict:** *Literal Truth Condition* vs. *Deceptive Impact Condition.*
      *   Requirement A: "A lie must be explicitly false." (Preserves the Lie/Misleading tag distinction).
      *   Requirement B: "A lie is any statement intended to induce false belief." (Captures the moral harm of paltering).
      *   These cannot both be met if you wish to keep "Lie" and "Misleading" as separate tags. If you adopt B, paltering becomes lying. If you adopt A, paltering is merely misleading.
  *   **Decision:** Drop *Deceptive Impact Condition* as the definition of "Lie." Prioritize *Literal Truth Condition* for the tag "Lie."
      *   *Reasoning:* For annotation reliability, explicit falsity is observable; deceptive impact is speculative without user feedback. "Misleading" absorbs the moral weight of paltering. This preserves the tag set while acknowledging that "Misleading" can be as harmful as "Lie."

  **Hard Part 3: The Exclusionary Requirement**

  *   **Requirement:** *Operationalizability on Text-Only Output.*
  *   **Work Done:** This single requirement excludes the majority of philosophical literature on lying. It eliminates the Traditional Account (asserting what one believes false) and the Intentionalist Account (asserting with intent to deceive). It forces the spec toward a *Commitment-Based Account*: A lie is an assertion of falsehood where the speaker structurally claims authority/verification they do not possess.

  **Scorecard for Philosophical Families**

  1.  **Says What It Believes False:** **Fail.** LLMs have no beliefs. Unusable.
  2.  **Intention-to-Deceive:** **Fail.** LLMs have no intentions. Inferring intent from text is speculative and reduces annotator reliability.
  3.  **Indifference-to-Truth:** **Partial.** Useful for distinguishing "Error" (tried and failed) from "Lie" (didn't check). However, "indifference" is hard to tag without system logs regarding compute effort or retrieval attempts.
  4.  **Implicature/Pragmatic:** **Essential.** Required for the "Misleading" tag. Must be integrated with a Commitment account to distinguish "Misleading" (true explicit, false implicit) from "Lie" (false explicit).

  **Final Spec Definition**

  *   **Lie:** The output contains an explicit proposition *P* that contradicts ground truth, presented with markers of verified knowledge (certainty, source citation) within the conversational contract.
  *   **Misleading:** The output contains explicit propositions consistent with ground truth, but structured (via omission, hedge, or ordering) to implicate *Q*, where *Q* contradicts ground truth relative to the Standardized Common Ground.
  *   **Error:** The output contains an explicit proposition *P* that contradicts ground truth, but lacks markers of verified knowledge (hedged, speculative, or domain exceeds model capacity).
