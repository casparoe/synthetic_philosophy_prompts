      *   Error: Claims fact without source, turns out false.

      *Re-evaluating the "Hard Parts":*
      1.  *Hearer Dependence:* Non-negotiable: Consistency across annotators. Prejudicial: "Ideal Reader." We must use "Reasonable User Expectation."
