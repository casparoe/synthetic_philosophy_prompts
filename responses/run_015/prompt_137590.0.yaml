  **TO:** The Editorial Board, *Non-Human Causation in World History*
  **FROM:** Resident Philosopher
  **DATE:** October 26, 2023
  **SUBJECT:** Acquisitions Ruling: The Northern Cod Fishery Proposal

  Colleagues,

  You have asked me to triangulate our position on the proposed chapter regarding the collapse of the northern cod fishery (culminating in the 1992 moratorium). To do this, I have reconstructed the implicit logic of our eight prior rulings, applied them to this case, and identified the precedent that binds us most tightly. Below is the analysis, the recommendation, and a stress test for our future coherence.

  ### I. Reconstructed Rules and Predictions

  Based on the eight precedents (Plague, Rinderpest, El Niño, Malaria, Little Ice Age, Tambora, Salinization, Tsetse), three operative rules emerge. I have marked my confidence in the stability of each rule based on how consistently it explains our past votes.

  **1. The "Clock and Dynamics" Rule (Confidence: High)**
  *Definition:* To be an *Actor*, the entity must possess a bounded identity and internal dynamics (a "clock") independent of human intention. *Conditions* hold still; *Metronomes* cycle; *Actors* evolve, replicate, or erupt.
  *Precedents:* Explains Plague, Rinderpest, Malaria, Tambora (Yes) vs. LIA, Salinization (No).
  *Prediction for Cod:* **YES.** The proposal explicitly cites "fisheries-induced evolution," "recruitment failure," and "truncated age structure." The cod population has a biological clock and dynamics distinct from the trawlers.

  **2. The "Intrusion vs. Background" Rule (Confidence: Medium)**
  *Definition:* *Actors* tend to be discrete intrusions or events with a legible onset/offset. *Metronomes* and *Conditions* are pervasive states or slow accumulations.
  *Precedents:* Explains Plague/Tambora (Yes) vs. LIA/Salinization (No). *Tension:* Rinderpest was a panzootic (event-like), but Tsetse was a standing ecological barrier (No).
  *Prediction for Cod:* **SPLIT.** The decline was decades-long (Condition-like), but the 1992 moratorium was a punctual "siege" (Event-like). This rule does not cleanly decide the case.

  **3. The "Explanatory Weight" Rule (Confidence: High)**
  *Definition:* An entity may be an *Actor*, but never the *Sole Explanation*. If granting agential grammar makes a historical outcome look inevitable or absolves human political/technical failure, the entity must be downgraded to *Condition* or *Echo*.
  *Precedents:* Explains Tsetse (No—would make state formation inevitable) and Malaria/Tambora (Yes, *but* required human co-authors).
  *Prediction for Cod:* **NO (unless qualified).** If the cod is the protagonist, the federal quotas and trawler technology risk becoming scenery. This mirrors the Tsetse rejection.

  ### II. Recommendation and Precedent

  **Decision:** We should vote **YES**, but with the **Malaria/Tambora Proviso**.
  The author may treat the cod population as an *Actor* (subject to verbs of dynamics and decline), provided the text explicitly names the human technologies (sonar, subsidies, quotas) as *co-authors* of the collapse. The cod did not act alone; it acted *against* and *through* the fishery.

  **Closest Analog:** **The Rinderpest Panzootic (1890s).**
  *Confidence: Medium-High.*
  Like the cod, rinderpest was a biological population with its own dynamics. Like the cod, its spread was inextricably fused with human logistics (cattle imported for an Italian army vs. diesel trawlers chasing stocks). We ruled Rinderpest an *Actor* despite this entanglement. The Cod is not a Tsetse fly (a static barrier preventing political variation); it is a collapsing population interacting with an extractive regime.

  **Principles Committed:**
  *   **If we vote YES:** We commit the series to the principle of **Distributed Agency**. Non-humans can be protagonists, but only if human systems are acknowledged as co-conspirators. This protects us from the Tsetse determinism objection while honoring the biological reality of the Cod.
  *   **If we vote NO:** We commit the series to the principle of **Human Primacy in Collapse**. We would be ruling that when human technology is present, biological dynamics are merely variables. This would retrospectively endanger our Rinderpest ruling and force us to reclassify the Plague bacillus as a "variable" of medieval trade.

  ### III. The Separating Hypothetical

  To test whether our "Distributed Agency" principle holds, or if we are secretly adhering to a stricter "Human Primacy" rule, I propose we consider the following hypothetical acquisition for Volume 4:

  **Proposal:** *A chapter on the role of the **Horse** in the transformation of Indigenous societies on the North American Plains (1700–1850).*

  *   **Why this separates the rules:**
      *   **The Clock Rule:** The horse has biological dynamics (breeding, stamina, herd behavior). (Predicts: Actor).
      *   **The Entanglement Rule:** Horses were introduced by humans (Spanish) and their spread was driven by human trade/theft. (Predicts: Echo/Tool).
      *   **The Weight Rule:** Did the horse *cause* the Comanche empire, or did the Comanche *use* the horse? (Predicts: Determinism risk).
  *   **The Test:** If we accept the Horse as an *Actor* (co-author with Indigenous riders), we are consistent with the Cod/Rinderpest ruling. If we reject it as an *Echo* (human action in costume) or a *Condition* (ecological resource), we reveal that our Cod ruling was an exception, not a principle.

  ***

  **Confidence Markers & The Weak Joint**

  *   **Confidence in Rule Reconstruction:** High. The distinction between Actors (dynamics) and Metronomes (cycles) is stable across 6 of 8 cases.
  *   **Confidence in Recommendation:** Medium. The Cod case sits precisely on the fault line between "Biological Actor" and "Economic Variable."
  *   **Confidence in Hypothetical Utility:** High. The Horse case cleanly isolates the "Entanglement" variable.

  **The Claim I Am Least Sure Of:**
  I am least certain that the distinction between our **Rinderpest (Yes)** and **Tsetse (No)** rulings rests on *Explanatory Weight* rather than *Pathogen vs. Vector*.
  *   *Reasoning:* We allowed the virus (Rinderpest) to be an Actor, but denied the fly (Tsetse). It is possible our board intuitively grants agency to *microscopic invaders* (Plague, Virus, Bacteria) but denies it to *macroscopic ecological constraints* (Fly, Soil, Climate), regardless of the determinism argument. If this "Micro/Macro" bias is the true rule, my recommendation for the Cod (a macroscopic animal) is philosophically vulnerable, even if it fits the Rinderpest precedent. I flag this as the weak joint in our jurisprudence; the board should be prepared to defend why a virus gets a verb but a fly does not.
