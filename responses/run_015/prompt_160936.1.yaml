answer: |-
  **JOINT STATEMENT ON THE CROSS-FADE PROTOCOL**

  **I. Agreed Claims**

  The undersigned researchers, having reviewed the stipulated findings of the cross-fade protocol, affirm the following claims. These are accepted as accurate descriptions of the case, not as resolutions of metaphysical dispute.

  1.  **Behavioral Continuity:** Throughout the protocol, from lambda=0 to post-excision, the subject remains unimpaired on all behavioral and report-based tests. No external observer could detect the transition via performance metrics alone.
  2.  **Functional Fragmentation:** At lambda=0.5, dynamical measures indicate the wider system comprises two partially decoupled complexes with increased latency, despite the behavioral continuity noted in Claim 1.
  3.  **Epistemic Standing:** The subject's reports during the fade are veridical regarding how things seem to them, but their authority does not extend to metaphysical facts about identity or survival.
  4.  **Excision Redundancy:** The surgical removal of biological tissue at lambda=1 performs no additional functional work beyond the completion of the gain fade; the system's input-output profile is stable prior to removal.
  5.  **Phenomenal Drift:** The reported change in the taste qualia (Finding b) is accepted as a real shift in phenomenal character, even though it is functionally inert and undetectable via discrimination tasks.
  6.  **Branching Reality:** The instantiation of the lambda=0.4 backup (Finding c) creates two numerically distinct entities who both possess equal claim to the original's memories and psychological continuity up to that point.
  7.  **Degrees of Survival:** At lambda=0.5, given the functional fragmentation (Claim 2), it is an open question whether survival admits of degrees; both sides agree that if survival is all-or-nothing, this phase represents a maximal zone of indeterminacy.
  8.  **Causal Efficacy:** The neuromorphic surrogate is not an inert simulation; by lambda=1, it is causally responsible for the subject's outputs and, by joint agreement, is capable of supporting consciousness.
  9.  **Metabolic Distinction:** Ordinary metabolic turnover of biological constituents is distinct in kind from the substrate replacement in the protocol, though both involve material change over time.
  10. **Limit of Agreement:** Regarding the definition of "survival," only a platitude is available: both sides agree survival matters, but genuine agreement stops there because one side ties it to material continuity and the other to functional continuity.

  **II. Disagreements Table**

  | Disputed Claim (Neutral) | Preservationist Formulation | Patternist Formulation | Diagnosis |
  | :--- | :--- | :--- | :--- |
  | **Identity at Lambda=1** | The subject survives because the biological organism maintained continuous metabolic life until the surrogate was fully integrated and capable of sustaining consciousness. | The subject survives because the causal-functional organization was preserved; the biological substrate was merely a vessel discarded once the pattern was securely hosted. | **Verbal.** Both agree the person continues. The dispute is over whether "person" tracks the organism or the pattern. Substantive question remaining: Which continuity is necessary for *what matters*? |
  | **Status at Lambda=0.5** | The subject is potentially compromised because the brain's physical integration is fractured; survival is risky until the biological tissue is fully bypassed and removed. | The subject is fully preserved because the functional output is intact; the physical decoupling is irrelevant so long as the computational role is maintained. | **Substantive.** They assign different prudential values to the risk. Preservationist sees ontological risk; Patternist sees engineering noise. |
  | **Value of Backup** | The backup is a duplicate; instantiating it kills no one, but it does not preserve the original stream of consciousness unique to the biological line. | The backup is the original; the distinction between "stream" and "copy" is empty when functional organization is identical. | **Substantive.** Disagreement on whether uniqueness of causal history matters for identity. |

  **III. Cruxes**

  The following sub-questions represent points where empirical or argumentative resolution would shift the burden of proof.

  1.  **Transitivity of Preservation:** Does preservation hold transitively across every incremental step of the fade, or does it fail by increments?
      *   *Case:* The lambda=0.5 fragmentation (Finding a).
      *   *Preservationist Prediction:* Continuity is broken if the biological integration fails, even if function holds.
      *   *Patternist Prediction:* Continuity holds so long as functional output is stable.
      *   *Concession:* If functional stability proves insufficient for subjective unity, Patternist accepts functionalism requires integration constraints. If biological fragmentation proves irrelevant to survival, Preservationist accepts matter is not the primary vehicle.

  2.  **Matter vs. Role:** What survival requires is continuity of matter or of causal-functional role. How does this account for ordinary metabolic turnover?
      *   *Case:* Claim 9 (Metabolic Distinction).
      *   *Preservationist Prediction:* Metabolic turnover preserves the living organism; substrate replacement does not.
      *   *Patternist Prediction:* Both are irrelevant; only the maintenance of the causal graph matters.
      *   *Concession:* If metabolic turnover is shown to disrupt the specific causal powers required for identity, Preservationist must refine "material life." If replacement is shown to disrupt identity unlike turnover, Patternist must explain the relevant difference.

  3.  **Reports vs. Hidden Phenomenology:** Do the subject's clean reports settle anything given the possibility of phenomenology that silently shifts or gradually fades while function and report are held fixed?
      *   *Case:* Finding b (Taste qualia shift).
      *   *Preservationist Prediction:* The shift indicates a degradation of the biological link; reports are unreliable guides to deep identity.
      *   *Patternist Prediction:* The shift is negligible noise; reports confirm functional integrity is what matters.
      *   *Concession:* If phenomenology can drift without functional change, Patternist must accept functionalism misses something vital. If reports are deemed fully authoritative, Preservationist must accept identity tracks seeming rather than being.

  4.  **The Backup Case:** Does the existence of the backup (Finding c) refute the necessity of uniqueness for survival?
      *   *Case:* Lambda=0.4 backup instantiation.
      *   *Preservationist Prediction:* The backup is a new person; the original is wherever the biological line continues.
      *   *Patternist Prediction:* Both are the original; identity branches.
      *   *Concession:* If branching is accepted as survival, Preservationist must abandon uniqueness. If branching is rejected as duplication, Patternist must accept historical continuity matters.

  5.  **Policy at Lambda=0.5:** What ought the protocol do at lambda=0.5 given Finding (a)?
      *   *Case:* Functional fragmentation with behavioral intactness.
      *   *Preservationist Prediction:* Halt or reverse; the organism is compromised.
      *   *Patternist Prediction:* Proceed; the person is intact.
      *   *Concession:* If halting is shown to preserve welfare better, Patternist accepts prudential value in biological continuity. If proceeding shows no harm, Preservationist accepts biological fragmentation is not lethal.

  **IV. Closing Statement**

  We acknowledge that this document does not resolve the underlying metaphysical dispute. However, we identify two categories of evidence capable of moving the debate. First, phenomenological data: if subjects undergoing the cross-fade report not just qualia shifts but a sense of discontinuity or "fading out" that correlates with lambda=0.5 fragmentation, this would challenge the Patternist view that function exhausts what matters. Second, ethical convergence: if both sides agree on a policy of caution at lambda=0.5 despite disagreeing on the reason, the practical stakes of the metaphysical divergence are lowered.

  Finally, we each state what would count as evidence against our own view. The Preservationist would concede her position if it were demonstrated that biological tissue could be removed instantaneously without loss of consciousness or identity, provided the surrogate was already causally coupled. The Patternist would concede his position if it were demonstrated that a perfect functional duplicate created without causal continuity from the original was universally judged to be a mere copy rather than a survival. We sign this document to record that while our explanations differ, our commitment to the subject's welfare and the rigor of the inquiry is shared.
