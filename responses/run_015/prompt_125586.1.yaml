  I'm prepping questions for a podcast episode next week with a philosopher who defends a pretty specific read of the Knobe effect — she thinks the harm/help asymmetry isnt really about folk psychology being secretly moralistic, but about how people compute deviance from an agent's intended plan, where harm just makes the deviation more cognitively available. I want questions that go past the usual "is intetionality normative?" stuff and actually dig into her framework.

