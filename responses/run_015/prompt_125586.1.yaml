answer: |-
  Here are five questions tailored to dig into the plan-deviance framework, complete with the likely deflection and a sharp follow-up to keep her pinned down.

  ### 1. The Cross-Cultural Challenge
  **Question:**
  "Your model hinges on harm making the deviation from an agent's plan more cognitively available. But we know the asymmetry isn't universal—in some East Asian and collectivist samples, the effect weakens or even flips. If harm naturally grabs attention and highlights deviance, why would culture turn that signal down? What does your model predict happens to the 'plan' in those contexts?"

  **Likely Answer:**
  She will likely argue that collectivist cultures define the "agent's plan" differently. In individualist cultures, the plan is "maximize profit," so harm is a deviation. In collectivist cultures, the plan might implicitly include "maintain social harmony," so harm is a *larger* deviation (or help is less of a deviation), shifting the weights.

  **Follow-Up:**
  "If the content of the 'plan' shifts just enough to accommodate any cultural outcome, how do we test this without just asking people what their plan was? I'm worried that if culture can arbitrarily change what counts as the baseline plan, the theory becomes unfalsifiable. Is there a cross-cultural result that would actually break your model, or can you always explain it away by adjusting the plan's content?"

  ### 2. Skill and Expertise
  **Question:**
  "Let's talk about expertise. Studies show that when an agent is highly skilled—like a master archer or a veteran CEO—people judge their side effects differently than when a novice does the same thing. Does your account say the expert's plan is just tighter, so deviations are more visible? Or does expertise somehow change the deviance calculation itself?"

  **Likely Answer:**
  She'll probably say experts have more precise plans. If an expert causes harm, it's seen as more integrated into the plan because they have high control, making the outcome less of a "deviation" and more of a "feature," or conversely, that their skill makes the harm more salient as a chosen trade-off.

  **Follow-Up:**
  "But if we judge the expert's harm as more intentional because they *should have known* how to avoid it, aren't we slipping back into a normative judgment about what they *ought* to have planned? I'm trying to see where the cognitive deviance ends and the moral expectation begins. If expertise changes the judgment, is it really about plan deviance, or is it about blaming them for having a bad plan?"

  ### 3. Development and Young Kids
  **Question:**
  "There's data suggesting young children sometimes show a reverse Knobe effect or no asymmetry at all, only developing the adult pattern later. If computing deviance from a plan is a basic cognitive mechanism, should we see this asymmetry from the start? Does your view imply kids just don't understand plans yet, or that they process deviance differently?"

  **Likely Answer:**
  She will likely claim that children are still learning how to reconstruct an agent's plan from limited information. They might focus on the outcome rather than the plan structure, or they haven't learned which deviations are "costly" enough to count as intentional.

  **Follow-Up:**
  "If children have to learn which deviations matter, aren't they essentially learning moral norms about what counts as a significant deviation? I'm pressing this because if the mechanism requires learning social standards about plans, it starts to look a lot like the normative view you're trying to replace. At what point does 'learning to compute deviance' just become 'learning morality'?"

  ### 4. The "No Plan" Case
  **Question:**
  "Your framework relies on measuring outcomes against an intended plan. But what about impulsive cases where the agent has no clear prior plan—maybe a snap decision or a chaotic situation where harm occurs? How do you compute deviance when the baseline plan is nonexistent or totally undefined?"

  **Likely Answer:**
  She'll argue there's always a minimal plan, even in impulsive acts (e.g., "move hand here"). Harm deviates from the minimal plan of "move hand safely." She might say harm makes the lack of planning itself salient.

  **Follow-Up:**
  "Doesn't that stretch the definition of 'plan' until it loses its bite? If every action implies a default plan to 'not cause harm,' then any harm is automatically a deviation by definition. I'm concerned you might be smuggling normativity back in by assuming the default plan always includes safety. Can you give me a case where harm occurs, there's no safety plan, and your model still predicts high intentionality?"

  ### 5. The Falsification Close
  **Question:**
  "You're very good at showing how alternative explanations might be framed differently to fit your model. So I want to ask directly: What kind of evidence would convince you that you're wrong? Is there a specific pattern of data where people judge intentionality in a way that simply cannot be explained by plan deviance or cognitive availability?"

  **Likely Answer:**
  She will likely say something like: "If people judged a harmful side effect as unintentional even when it was highly salient and clearly deviated from the goal, without any mitigating framing."

  **Follow-Up:**
  "But you've previously argued that when people give those answers, it's because the framing shifted their view of the goal. Is there *any* result you couldn't explain by saying 'that's just a different framing of the plan'? If the defense is always that the subject construed the plan differently, how do we know we're testing your theory and not just their interpretation of the vignette?"
