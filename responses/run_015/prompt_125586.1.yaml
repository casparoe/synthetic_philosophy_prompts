  - one about the skill-modulation studies where experts get judged differently for the same outcome, and whether that fits her account or breaks it
  - one about the reverse Knobe patterns found in young kids, and if she thinks that means the mechanism is learned or innate
  - and at least one more that asks what her view says about cases where the agent has no clear prior plan but the outcome is still harmful

