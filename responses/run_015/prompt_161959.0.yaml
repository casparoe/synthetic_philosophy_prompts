answer: |-
  *Blade Runner* is not merely a film about artificial humans; it is an artifact that behaves like one. Its ontological instability—shifting between the 1982 Theatrical Cut, the 1992 Director's Cut, and the 2007 Final Cut—makes it the limit case for theories of authorship. To treat *Blade Runner* through the lens of intentionalism is to confront a fractured creative subject: Ridley Scott (director), Hampton Fancher (screenwriter), Harrison Ford (performer), and the studio (producers). When Scott later insists Deckard is a replicant, supported by the added unicorn dream in the Final Cut, he is not revealing a hidden truth of the 1982 text; he is overwriting it.

  **Revision as New Work, Not Revelation**
  The first critical question is whether the added unicorn dream and removed voiceover in the Final Cut reveal what the film "meant all along" or constitute a new work. Actual intentionalism struggles here. If meaning is fixed by the author's actual mental state at the time of creation, Scott's 2007 assertion cannot retroactively fix the meaning of the 1982 release. The unicorn dream was not in the theatrical version; its insertion is a new textual signifier, not the uncovering of an old one. To treat the Final Cut as the "true" *Blade Runner* is to commit a genetic fallacy, privileging the director's later authority over the public text that actually circulated and generated cultural meaning for a decade.

  Therefore, the revisions should be treated as the creation of a distinct work. The Final Cut is a palimpsest, not a restoration. The removal of the studio-imposed voiceover and happy ending restores Scott's noir tone, but the addition of the unicorn dream imposes a specific hermeneutic key (Deckard = Replicant) that the original text resisted. A revising author's later intention does not reach backwards; it reaches forwards, creating a new object for interpretation. The 1982 film and the 2007 film share a title and footage, but they offer different contracts to the viewer.

  **Deckard's Status in the Final Cut**
  Regarding Deckard's status, I commit to the position that **in the Final Cut, Deckard is textually designated as a replicant.** The editing logic is explicit: Deckard dreams of a unicorn; Gaff leaves an origami unicorn; therefore, Gaff knows Deckard's implanted memories, proving Deckard is a Nexus-7. This is a coherent textual argument within the Final Cut's specific assemblage.

  *However, this reading is contested.* Harrison Ford has consistently maintained that he played Deckard as human, arguing that the emotional stakes of the film rely on a human gaining empathy for replicants. If Deckard is a replicant, the film becomes a puzzle about identity; if he is human, it is a tragedy about mortality and empathy. Furthermore, the film resists being read as an argument at all in its affective peaks. The "tears in rain" monologue by Roy Batty functions with maximum pathos regardless of Deckard's biology. To solve the "Deckard question" is to reduce the film's phenomenological ambiguity to a plot mechanic. The ambiguity *is* the point; it forces the audience to confront the Turing test of their own empathy. By settling the question in the Final Cut, Scott resolves the mystery but diminishes the philosophical friction that made the film enduring.

  **Implications for Intentionalism**
  This brings us to the theoretical core: Does *Blade Runner* count against intentionalism itself, or only against the assumption of a single intending subject? The case supports **Hypothetical Intentionalism** over Actual Intentionalism.

  Actual Intentionalism fails because there is no single "Actual" intention. We have Scott's intention (Replicant), Ford's intention (Human), the Studio's intention (Human/Noir), and Fancher's intention (Ambiguous). These are not just conflicting; they are constitutive of the text. If we cannot locate a unified agent, we cannot locate a unified actual intention.

  Hypothetical Intentionalism, which posits that meaning is what an appropriately informed audience would take the author to have meant based on public evidence, succeeds where Actual Intentionalism fails. It allows us to say: "In the Theatrical Cut, the hypothetical author intends a human Deckard; in the Final Cut, the hypothetical author intends a replicant Deckard." The "Author" here is not Ridley Scott the man, but "Ridley Scott" as a function of the specific text presented. The case establishes that in collaborative, versioned media, **authorial intention is indexical to the specific cut, not the underlying work.** You cannot seek the intention of *Blade Runner*; you can only seek the intention of *Blade Runner: The Final Cut*.

  This does not destroy intentionalism, but it demands we abandon the notion of a stable, singular subject. The "defect" is not in the theory of intention per se, but in applying a literary model of single-authorship to a cinematic model of industrial collaboration and temporal revision. *Blade Runner* adds to the debate what standard examples (like a poet misremembering a line) cannot: it introduces *versioning* as a constitutive element of authorship. A poem is static; a film is often a process. When the text changes, the author-function changes.

  **Conclusion**
  *Blade Runner* demonstrates that in cinema, the text is not a vessel for a pre-existing intention but a site where intentions are negotiated, buried, and exhumed. The unicorn is not a clue to a hidden truth; it is a stamp of a later authority. The film works best when it refuses to answer its own central question, resisting the very impulse toward closure that intentionalism often seeks.

  \answer{The Final Cut textually settles Deckard as a replicant through the unicorn motif, but the case establishes that in collaborative media, authorial intention is version-specific rather than work-universal, supporting Hypothetical Intentionalism over Actual Intentionalism.}
