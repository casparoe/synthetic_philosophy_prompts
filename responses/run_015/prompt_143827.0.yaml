  FILE REF: ONTIC/REG/99

  1. **Ontic Status.** No chattel or parcel holds title unless currently perceived by a registered mind. Existence is contingent upon Attention. Failure to maintain perception constitutes larceny against the State. All property must be filed under Notice of Continuous Perception (Form 74-Ω).

