  3. **Intervals of Non-Attendance.** During hours when no finite mind attends (00:00–06:00), continuity is maintained by the Infinite Mind. Citizens are reminded that while the Infinite Mind guarantees existence, It does not issue Receipts. To align finite records with Infinite continuity, the Night Surcharge must be paid quarterly. Non-payment risks divergence between Divine record and Civil Register. In cases of divergence, the Civil Register prevails for taxation purposes.

  4. **Disputes of Resemblance.** No two minds perceive the identical idea. Title disputes are therefore adjudicated by Coefficient of Resemblance. If Claimant A and Claimant B perceive differing shades of the same wall, the Tribunal averages the hue. Costs are scaled to the degree of dissimilarity. High divergence suggests hallucination; fees increase accordingly. Claimants asserting identical perceptions will be charged for Perjury of Ideation.

