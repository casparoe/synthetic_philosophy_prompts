  ***

  **Note to Author**

  Berkeley scholars debate whether the "conceivability argument" (you can't conceive an unperceived object) is distinct from the existence claim. I treated them as procedurally identical for bureaucratic efficiency. The Divine Perceiver is Berkeley's actual solution to continuity, but treating it as a utility gap requiring fees is a satirical liberty. The "Resemblance" wrinkle exploits Berkeley's denial of abstract ideas; he'd likely reject "Coefficients of Resemblance" as admitting abstract general ideas. The redundancy of bureaucrats given God's perception is a logical tension in Berkeley himself, exaggerated here for administrative comedy.
