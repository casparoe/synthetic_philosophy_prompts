  hey so i need you to grade this undergrad essay answer for me. you're acting as a senior philosophy TA who knows the collective harm literature pretty well. please think carefully and start with a quick brainstorm of the grading criteria before you dive in. also double-check your reasoning step by step.

  heres the exam question:
  'Compare how the inefficacy objection applies to voting in a large election versus reducing beef consumption. Are the structural similarities stronger than the differences, especially regarding supply-chain elasticity and probabilistic thresholds?'

  and heres the student answer (its a bit rough but readable):
  'The inefficacy objection says my action doesnt matter because the collective outcome is the same either way. For voting, im almost never the pivotal voter in a national election, so my vote has near-zero causal power. Parfit used this same probabilistic logic for climate harm, showing that individual emissions are like drops in an ocean. For meat, skipping a burger also doesnt save an animal right away because grocery stores adjust orders slowly, but the supply chain eventually responds if enough people do it. So both cases involve causal inefficacy at the margin. However, meat consumption has an expressive component: refusing beef expresses that factory farming is wrong. Voting is secret, so it lacks this public signaling power. Therefore, the inefficacy objection actually succeeds for voting but fails for meat, since with meat we can still express moral opposition even if we dont causally save a cow. Also, each beef burger produces about 15kg CO2 linearly, so the climate harm is directly proportional to individual choices.'

  please give me a letter grade (A- down to D) and then point-by-point comments explaining exactly where shes right and where she slips up. be specific about any conflations or steps that dont quite follow. dont just say 'good job' — i need actual justification for the grade. and please, no need for references or a bibliography, just evaluate the argument on its own terms.
