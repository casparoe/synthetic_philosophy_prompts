answer: |-
  There is no single canonical term for this specific frustration, but you have correctly identified a gap in the standard "expressive voting" literature. Standard theory assumes the *voter* gets the utility from the expression. You are describing a phenomenon where the *audience* captures the utility (or disutility) of the expression, and they hold the rights to interpret it.

  In philosophy of action and political theory, this sits at the intersection of **Speech Act Theory**, **Aggregative Opacity**, and **Moral Luck**.

  If you need a name to use in the argument, the most precise existing label is **"The Problem of Political Uptake."** A more functional, descriptive label for the social phenomenon is **"Imputed Endorsement."**

  Here is the breakdown of what is doing the work, how to define it sharply, and how to separate the two cases you described.

  ### 1. The Mechanism: Voting as a "Defective" Speech Act

  To understand why you and your brother are stuck, you have to treat voting not just as a causal lever (instrumental) or a personal statement (expressive), but as a **speech act** (like promising, marrying, or sentencing).

  In Speech Act Theory (J.L. Austin, John Searle), for an act to succeed, it requires **Uptake**. If I say "I promise," but you don't accept it as a promise, the promise fails. The meaning of the act is a negotiation between the *speaker's intent* and the *listener's interpretation*.

  **The Voting Glitch:**
  In normal conversation, I can clarify my intent ("No, I didn't mean it that way"). In voting, two structural features prevent this:
  1.  **Aggregative Opacity:** Because the ballot is secret, your specific "sentence" (intent) is invisible. Only the "paragraph" (the tally) is public. The audience cannot read *your* vote; they read the *demographic aggregate*.
  2.  **Irrevocability:** You cannot issue a correction. Once the tally is public, the meaning is fixed by the result, not the intent.

  This creates a **Loss of Interpretive Sovereignty.** You lose the right to decide what your action meant.

  ### 2. Naming the Phenomenon

  **The Philosophical Name:** **Political Uptake Failure.**
  This describes the structural inability of the voter to secure the intended "uptake" from the audience due to secrecy and aggregation.

  **The Social Name:** **Imputed Endorsement.**
  This describes the specific outcome in Case Two. Because the audience cannot distinguish between "voting for," "voting against," or "voting reluctantly," they apply a heuristic: *If your vote is counted in their total, you endorsed their mandate.*

  ### 3. Are Case One and Case Two the Same Phenomenon?

  You asked if you've stapled two things together. You haven't. They are two symptoms of the same underlying mechanism: **The Decoupling of Intent from Social Meaning.**

  *   **Case One (The Brother vs. You):** This is about **Signaling Cost.**
      Your brother's third-party vote is a "costly signal." It takes effort, it risks "spoiler" stigma, and it yields no instrumental power. Because it is costly, the audience (your family) infers high sincerity. Your abstention is "cheap talk" (or silence). In a system where meaning is determined by the audience, **visibility trumps intent.** You know you abstained for principled reasons, but the audience cannot see principles; they can only see participation.
      *   *The Boundary:* This is about how the act is *valued* before the result.

  *   **Case Two (The Cousin):** This is about **Retrospective Imputation.**
      This is where **Constitutive Moral Luck** enters. The moral quality of her act is determined by factors outside her control (the winner's subsequent actions). Because she cannot separate her vote from the winner's aggregate total, she is held complicit in the winner's future actions.
      *   *The Boundary:* This is about how the act is *interpreted* after the result.

  **The Unifying Thread:** In both cases, the **Agent's Intent is Epistemically Inaccessible.** Because the family (and society) cannot see inside your head or your ballot, they rely on **Heuristics** (Participation = Virtue; Vote Total = Endorsement).

  ### 4. A Sharp Definition for Your Argument

  If you want to settle the argument, do not argue about "wasted votes" or "principles." Argue about **Interpretive Sovereignty.**

  Here is a definition you can use:

  > **Imputed Endorsement:** The social phenomenon wherein the semantic content of a secret, aggregated vote is determined not by the voter's intent, but by the audience's heuristic interpretation of the aggregate outcome. This creates a **Retrospective Liability** where the voter is held responsible for the winner's actions regardless of their original intent, because the mechanism of voting strips the agent of the ability to clarify or distinguish their specific contribution from the collective will.

  ### 5. Why the Family is "Right" (and Why They Wrong)

  This is the part that will help you talk to your brother.

  **Why the family treats the Brother as more principled than the Cousin:**
  They are prioritizing **Purity of Signal** over **Efficacy of Outcome.**
  *   **Brother:** Signal is pure ("I reject both"), Cost is high (time, stigma), Outcome is null.
  *   **Cousin:** Signal is muddy ("I hate both but picked one"), Cost is high (moral discomfort), Outcome is potential.
  *   **You:** Signal is silent, Cost is low, Outcome is null.

  In a "Political Uptake" framework, **Silence is ambiguous.** It can mean protest, apathy, or ignorance. A Third-Party vote is **unambiguous.** It says "I showed up, but I reject the options." The family rewards the *clarity of the signal*, not the *impact of the vote*.

  **Why the family treats the Cousin as having "voted for him":**
  This is the **Mandate Heuristic.** When a candidate wins, they claim a mandate. The public accepts this claim for the sake of political stability. To allow every voter to say "I didn't mean *that* mandate" would dissolve the concept of a governing mandate. Therefore, society *requires* Imputed Endorsement to function. The Cousin is being told: "Your individual intent is less important than the stability of the collective meaning."

  ### 6. How to Use This

  You can tell your brother:

  *"We aren't arguing about whether voting matters. We are arguing about who owns the meaning of the vote.*

  *You think you own the meaning because you know your intent. I think the audience owns the meaning because they read the aggregate, not the individual.*

  *Case One: You get credit because your signal is costly and visible. I get penalized because abstention is invisible. We aren't fighting about ethics; we are fighting about **Signaling Theory**.*

  *Case Two: The Cousin is right that she didn't mean to endorse him. But the family is right that she can't prove it. That's **Imputed Endorsement**. Once the vote is aggregated, she loses **Interpretive Sovereignty**. She became a co-author of a book she only wrote one sentence of, and now she's being blamed for the plot."*

  ### Summary
  *   **Does it have a name?** Not one single word, but **"Political Uptake"** or **"Imputed Endorsement."**
  *   **Is it one phenomenon?** Yes. It is the **Externalization of Political Meaning** caused by secret aggregation.
  *   **Is the retroactive part special?** Yes, it is a form of **Constitutive Moral Luck** specific to collective action. You are judged by the collective outcome, not your individual contribution.
  *   **The Boundary:** The boundary is **Epistemic Accessibility.** If the audience could see your intent, you would keep sovereignty. Because they can't (secret ballot), they seize sovereignty to make sense of the aggregate.

  You are describing the tragedy of democratic action: **To participate is to surrender control over what your participation means.** Your brother wants the credit of participation without the liability of the outcome. The Cousin accepted the liability but is being denied the credit of her intent. You refused the game entirely, and are being penalized for not playing. All three of you are reacting rationally to the same structural constraint.
