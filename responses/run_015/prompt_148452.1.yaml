      *   *Structure:*
          1.  Core Definition.
          2.  The Spec (Coverage, Distinctions, Constraints).
          3.  The Impossibility Result (The tension the user cares about).
          4.  Scorecard.
          5.  Confidence/Uncertainty.

      *(Self-Correction during drafting)*: Make sure to emphasize the "shared weights" aspect. This isn't just abstract philosophy; it's about weight-sharing in neural nets. This makes logical correlation *physical* in a sense (same function), but execution is distinct.
      *   *Key nuance:* The theory must handle *approximate* correlation. If weights drift or quantization differs, does superrationality degrade gracefully?

  9.  **Final Review against constraints:**
      *   No bibliographies? Check.
      *   Reasoning only? Check.
      *   Score contenders? Check.
      *   Flag negotiable/non-negotiable? Check.
      *   Identify unsatisfiable subsets? Check.
      *   Confidence level? Check.

  10. **Final Polish:** Ensure the distinction between "causal independence" (hardware) and "logical dependence" (weights) is the centerpiece. (Proceed to generate output).

