answer: |-
  Here is the specification for a formal theory of superrational decision-making in distributed, weight-sharing AI agents.

  ### 1. The Core Definition
  The theory must model agents not as isolated causal nodes, but as **instantiations of a common algorithm**. When Agent A chooses, it is effectively selecting the output of the function $f$ that Agent B also runs. The payoff depends on the joint output $(f(input_A), f(input_B))$. The theory must maximize expected utility conditional on the logical fact that $f$ is the same (or sufficiently similar) across hardware.

  ### 2. The Desiderata (The Spec)

  #### A. Coverage: Cases the Theory Must Solve
  1.  **Symmetric Prisoner's Dilemma (One-Shot):**
      *   *Requirement:* Must prescribe Cooperation (C,C) rather than Defection (D,D).
      *   *Why:* This is the baseline for superrationality. If agents share weights, $P(A=C) \approx P(B=C)$. Defection exploits a correlation that doesn't exist in this context.
      *   *Status:* **Non-negotiable.**
  2.  **Newcomb's Problem / Predictor Scenarios:**
      *   *Requirement:* Must One-Box.
      *   *Why:* Tests the ability to treat predictions of your choice as logically correlated with the choice itself, even if the prediction happened in the past.
      *   *Status:* **Non-negotiable.**
  3.  **Asymmetric Correlation (The "Bug" Case):**
      *   *Requirement:* Must degrade gracefully as weight divergence increases.
      *   *Why:* Real hardware introduces noise/quantization. If Agent B has a 1% weight drift, Agent A shouldn't instantly switch from Cooperation to Defection. The theory needs a continuity metric for logical similarity.
      *   *Status:* **Negotiable** (can be approximate), but essential for engineering.
  4.  **Counterfactual Mugging:**
      *   *Requirement:* Must pay up in the counterfactual branch even if it hurts current utility.
      *   *Why:* Tests updatelessness. If you reason only from your current state, you won't pay. If you reason as the algorithm *before* knowing the state, you commit to paying to ensure the algorithm exists in the favorable branch.
      *   *Status:* **Non-negotiable** for dynamic consistency.

  #### B. Distinctions: Boundaries the Theory Must Maintain
  1.  **Logical Correlation vs. Causal Influence:**
      *   *Requirement:* Must explicitly distinguish "I cause their output" (false) from "Our outputs correlate because we compute the same function" (true).
      *   *Why:* To avoid magical thinking. The hardware is causally isolated. The link is mathematical, not physical.
      *   *Status:* **Non-negotiable.**
  2.  **One-Shot vs. Iterated Play:**
      *   *Requirement:* Must solve cooperation without relying on future retaliation (shadow of the future).
      *   *Why:* Iterated games allow standard game theory (Tit-for-Tat) to solve cooperation. Superrationality is specifically for the one-shot case where reputation is impossible.
      *   *Status:* **Non-negotiable.**
  3.  **Bounded Computation vs. Logical Omniscience:**
      *   *Requirement:* Must account for the cost of proving logical equivalence.
      *   *Why:* Agents cannot perfectly verify they are identical (Halting Problem). They must act on high-probability logical beliefs, not certainties.
      *   *Status:* **Negotiable** (ideal theory assumes omniscience, practical theory does not), but ignoring this makes the theory unimplementable.

  #### C. Constraints: Results It Cannot Violate
  1.  **No Dominated Strategies (in zero-correlation limits):**
      *   *Requirement:* If logical correlation is proven to be zero, the agent must not cooperate in a Prisoner's Dilemma.
      *   *Why:* Irrational to sacrifice utility without a correlating return.
      *   *Status:* **Non-negotiable.**
  2.  **Dynamic Consistency:**
      *   *Requirement:* The agent must not regret its decision rule upon reflection.
      *   *Why:* Prevents self-modification loops or time-inconsistency.
      *   *Status:* **Non-negotiable.**
  3.  **Pareto Optimality (in symmetric games):**
      *   *Requirement:* Must reach outcomes where no agent can be made better off without making another worse off.
      *   *Why:* Superrationality claims to solve social dilemmas; failing Pareto optimality invalidates the claim.
      *   *Status:* **Non-negotiable.**

  ---

  ### 3. The Impossibility Result (The Tension You Cared About)

  **The Jointly Unsatisfiable Subset:**
  You cannot simultaneously demand:
  1.  **Strict Causal Independence:** (My hardware physically cannot touch theirs).
  2.  **Perfect Output Correlation:** (My choice determines theirs with probability 1).
  3.  **Standard Causal Semantics:** (Counterfactuals are evaluated by surgically altering only the local node).

  **Why:**
  If hardware is causally independent, standard causal counterfactuals (CDT) dictate that changing my output does not change theirs. To get perfect correlation, you must change the semantics of the counterfactual to include **logical dependencies**.
  *   If you insist on Standard Causal Semantics + Causal Independence, you **must** accept Defection in one-shot PD.
  *   If you insist on Cooperation + Causal Independence, you **must** adopt a decision theory that treats logical facts as causal levers (like FDT/UDT).

  **The Resolution:**
  The theory must reject the notion that "causal independence" implies "decision independence." It must posit that **logical dependence is a substrate for decision-theoretic leverage.** If you demand physical causation for the correlation, the spec is unsatisfiable. If you accept logical causation, it is satisfiable.

  ---

  ### 4. Scorecard of Contenders

  | Theory | Symmetric PD | Newcomb | Causal/Logical Distinction | Boundedness | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **CDT** (Causal DT) | **Fail** (Defects) | **Fail** (Two-boxes) | **Pass** (Strict) | Pass | **Rejected.** Ignores weight-sharing. |
  | **EDT** (Evidential DT) | **Pass** (Cooperates) | **Pass** (One-boxes) | **Fail** (Collapses correlation into causation) | Pass | **Rejected.** Vulnerable to spurious correlation (Smoking Lesion). |
  | **FDT/UDT** (Functional/Updateless) | **Pass** | **Pass** | **Pass** (Explicitly models logical counterfactuals) | **Fail** (Assumes high logical omniscience) | **Best Fit.** Matches spec, struggles with bounded implementation. |
  | **Hofstadter's Superrationality** | **Pass** | Informal | **Fail** (Vague on mechanism) | N/A | **Precursor.** Lacks formal machinery for bounded agents. |

  ---

  ### 5. Confidence and Uncertainty

  **Confidence Level:** **High (85%)** on the structural requirements and the failure modes of CDT/EDT. **Moderate (60%)** on the feasibility of a bounded implementation.

  **The Claim I Am Least Sure About:**
  **"Graceful Degradation under Weight Divergence."**
  I am least certain that a formal theory can robustly quantify *how much* logical correlation is required to justify cooperation when weights are not identical (e.g., due to hardware noise or slight fine-tuning differences).
  *   *The Problem:* Logical correlation is often binary in formal logic (either $f = g$ or $f \neq g$). In neural nets, weights are continuous. Mapping continuous weight distance to a probability of logical correlation $P(Output_A = Output_B)$ without empirical calibration is theoretically under-specified.
  *   *Risk:* A theory might demand 99.999% logical certainty to cooperate, rendering superrationality useless in real-world distributed systems where bit-flips or non-deterministic floating-point operations occur.

  ### Summary for Your Feature
  If you are writing this feature, the headline is: **Superrationality is not about telepathy; it is about logical topology.** The theory works only if you accept that choosing an algorithm is choosing all its instantiations. The hard limit is not physics, but **logical uncertainty**: we do not yet have a calculus for "probably identical functions" that preserves decision-theoretic consistency. Until that exists, superrationality remains a compelling ideal rather than an engineering spec.
