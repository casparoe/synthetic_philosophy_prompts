prompt: |-
  hey — i'm writing a feature on whether superrationality can be formilized for distributed AI agents that share weights but run on separate hardware, so they face choices where hte payoff depends on output correlation rather than direct interaction. before i read another paper, i want the full desiderata. what must an adequate theory of superrational decision-making actually get right? give me the spec: the cases it has to cover (classic prisoner's dilemma, Newcomb-style problems, and those predictor scenarios where your choice seems to retroactively influence a belief about you), the distinctions it can't collapse (logical correlation vs causal independence, one-shot vs iterated play, bounded computation vs perfect reasoning), and the decision-theoretic results it can't violate. say why each is required, flag which are negotiable and which are non-negotiable, and if any subset is jointly unsatisfiable — especially anything demanding perfect correlation while insisting on full causal independence — call that out, that's hte part i care about most. briefly score the usual contenders against the list. please also say how confident you are in all of this and single out the claim you're least sure about. no bibliographies, just reasoning — i want something a smart model without web access can actually work through.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Formalizing superrationality for distributed AI agents (shared weights, separate hardware, payoff depends on output correlation).
      *   **Goal:** Provide a "spec" or "desiderata" for an adequate theory of superrational decision-making.
      *   **Key Requirements:**
          *   Cases to cover (Prisoner's Dilemma, Newcomb, Predictor scenarios).
          *   Distinctions to maintain (Logical vs. Causal, One-shot vs. Iterated, Bounded vs. Perfect).
          *   Decision-theoretic results not to violate.
          *   Justification for each (Why required?).
          *   Negotiable vs. Non-negotiable status.
          *   Identification of jointly unsatisfiable subsets (especially perfect correlation + causal independence).
          *   Scorecard of usual contenders (CDT, EDT, FDT, etc.).
          *   Confidence level + Least certain claim.
          *   Constraint: No bibliographies, just reasoning (self-contained).

  2.  **Deconstruct "Superrationality" in this Context:**
      *   Hofstadter's original concept: Agents reason identically, so they choose the same strategy in symmetric games.
      *   AI Context: Shared weights imply functional identity (or near-identity). Separate hardware implies causal isolation.
      *   Core Tension: If I am causally isolated, how does my choice affect the other? Answer: Logical correlation. If we run the same algorithm, $Output_A = Output_B$.
      *   The "Spec" needs to bridge decision theory (how to choose) with logical uncertainty (what counts as "the same").

  3.  **Drafting the Desiderata (The Spec):**

      *   *Category 1: Coverage (The Cases)*
          *   Symmetric Prisoner's Dilemma (PD): Must cooperate where CDT defects.
          *   Asymmetric PD: What if weights differ slightly?
          *   Newcomb's Problem: Must one-box (standard superrational intuition).
          *   Counterfactual Mugging/Parfit's Hitchhiker: Testing commitment/consistency.
          *   *Why:* To prove robustness across correlation types.

      *   *Category 2: Distinctions (The Boundaries)*
          *   Logical Correlation vs. Causal Influence: Crucial. Can't say "I cause them to cooperate." Must say "We correlate because we are the same function."
          *   One-shot vs. Iterated: Superrationality is supposed to work in one-shot. Iterated allows learning; one-shot relies on structural reasoning.
          *   Bounded vs. Perfect: Real AI is bounded. Perfect reasoning leads to paradoxes (Gödel).
          *   *Why:* To avoid magic thinking and ensure implementability.

      *   *Category 3: Constraints (The Results)*
          *   No Dominated Strategies: Can't choose strictly worse outcomes if correlation is zero.
          *   Dynamic Consistency: Can't plan to do X and then do Y when the time comes.
          *   Pareto Optimality (in symmetric cases): Should reach cooperative equilibria.
          *   *Why:* To remain rational agents, not just cooperators.

  4.  **Identifying Tensions (The "Impossible" Bits):**
      *   *The Big One:* Perfect Correlation + Full Causal Independence.
      *   If hardware is separate, there is *some* causal independence (noise, timing). If weights are shared, there is *logical* dependence.
      *   The tension: If I condition on "I choose C," do I update the probability that "They choose C"?
      *   CDT says No. EDT says Yes (but via spurious correlation). FDT/UDT says Yes (via logical dependence).
      *   *Unsatisfiable Subset:* Demanding *physical* causal influence while maintaining *physical* causal isolation is impossible. The theory must rely on *logical* causation.
      *   *Another Tension:* Boundedness + Logical Omniscience. You can't be bounded and know all logical implications of your code instantly.

  5.  **Scoring Contenders:**
      *   CDT (Causal Decision Theory): Fails PD, Fails Newcomb. Good on causal independence.
      *   EDT (Evidential Decision Theory): Passes PD/Newcomb but fails on spurious correlation (Smoking Lesion).
      *   FDT (Functional Decision Theory) / UDT (Updateless Decision Theory): The current champions for this spec. Handles logical correlation.
      *   Superrationality (Hofstadter): Informal precursor to FDT.

  6.  **Refining the "Negotiable vs. Non-Negotiable":**
      *   Non-negotiable: Logical/Causal distinction, Dynamic Consistency, No Dominated Strategies (in absence of correlation).
      *   Negotiable: Perfect symmetry (real AI has noise), One-shot focus (iterated is easier).

  7.  **Addressing the Confidence & Uncertainty:**
      *   Confidence: High on the *structure* of the problem, moderate on the *solution*.
      *   Least Certain: How to formalize "logical similarity" under bounded computation. (When is a bug a difference in algorithm vs. noise?)

  8.  **Drafting the Content (Iterative refinement for tone and density):**
