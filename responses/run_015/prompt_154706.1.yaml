answer: |-
  Here is the specification sheet for a theory of Ulysses binding. It is structured to force a ruling on the specific edge cases you provided, rather than allowing a theory to rest on the standard Sirens/Mast example.

  ### I. The Desiderata Specification

  A viable theory of precommitment legitimacy must satisfy the following conditions. Each is tagged as **Non-Negotiable** (the theory fails if it violates this) or **Camp Preference** (the theory can survive violating this, but aligns with a specific philosophical tradition).

  **1. The Epistemic Defeasibility Condition (The Cassandra Case)**
  *   **Requirement:** The theory must provide a criterion for when new information or changed circumstances legitimately void the precommitment. It cannot treat the past self as infallible.
  *   **Case:** The Sirens were actually warning of rocks; the prognosis was wrong; the future self is sober and informed, not impaired.
  *   **Status:** **Non-Negotiable.** A theory that binds an agent despite definitive evidence that the original grounds for binding were false is a theory of tyranny, not autonomy.
  *   **Theoretical Load:** Requires an account of *what counts* as new information vs. rationalization.

  **2. The Mechanism Sensitivity Condition (The Tantalus Device)**
  *   **Requirement:** The theory must rule on whether the *mode* of constraint affects legitimacy, independent of the constraint's efficacy.
  *   **Case:** Aversive conditioning (making the act disgusting) vs. physical impossibility (removing the option) vs. procedural humiliation (forcing a shameful vote to reverse).
  *   **Status:** **Camp Preference.** Consequentialists may claim only the outcome (holding fast) matters. Deontologists/Expressivists must argue that altering one's own psychology or dignity changes the moral valence of the act.
  *   **Theoretical Load:** Distinguishes between *changing the world* to fit the will vs. *changing the will* to fit the world.

  **3. The Strategic Robustness Condition (The Duplicate Key)**
  *   **Requirement:** The theory must account for third-party exploitation induced by the precommitment. Legitimacy is reduced if the device creates a hostage situation for others to exploit.
  *   **Case:** A lender offers predatory terms knowing you cannot renegotiate; a political faction exploits an entrenchment clause that binds only the opposition.
  *   **Status:** **Non-Negotiable.** A precommitment that systematically transfers leverage to bad-faith actors is instrumentally self-defeating and normatively suspect.
  *   **Theoretical Load:** Moves the evaluation from a dyadic (self-to-self) model to a triadic (self-to-self-to-other) model.

  **4. The Diachronic Identity Condition (The Successor Problem)**
  *   **Requirement:** The theory must specify the threshold of continuity required between the binding agent and the bound agent.
  *   **Case:** A constitutional majority binding a future demographic majority; an individual binding themselves after a radical conversion of values.
  *   **Status:** **Non-Negotiable.** If the agent at $t_2$ is not sufficiently continuous with the agent at $t_1$, the binding is merely one person coercing another.
  *   **Theoretical Load:** Must define "same agent" without relying on circular appeals to the binding itself.

  **5. The Exit Cost Proportionality Condition (The Cheap-Exit Gradient)**
  *   **Requirement:** The theory must explain why the *cost* of exit matters. It cannot treat binding as binary (locked/unlocked).
  *   **Case:** A contract with a penalty fee vs. a physical lock vs. a moral vow. At what cost does "exit" become "breach"?
  *   **Status:** **Non-Negotiable.** If exit cost is irrelevant, precommitment collapses into mere advice. If exit cost is infinite, it collapses into slavery. The theory must locate the slope.
  *   **Theoretical Load:** Requires a metric for "legitimate friction."

  **6. The Meta-Rule Coherence Condition (Second-Order Precommitment)**
  *   **Requirement:** The theory must determine if an agent can precommit against removing the precommitment.
  *   **Case:** A constitution that cannot be amended; a cooling-off period that cannot be waived.
  *   **Status:** **Camp Preference.** Libertarian-leaning views often reject this (inalienable right to change mind). Republican/Constitutionalist views often accept it (freedom requires non-domination, even by oneself).
  *   **Theoretical Load:** Tests for infinite regress vs. foundational stops.

  ---

  ### II. The Impossibility Result (The Trilemma)

  You are correct that there is a fundamental tension, but it is slightly sharper than the one you proposed. The real trilemma lies in **Efficacy**, **Sovereignty**, and **Administrability**.

  1.  **Efficacy (Reliability):** The device must reliably survive the moment of temptation ($t_2$).
  2.  **Sovereignty (Responsiveness):** The device must not bind the agent if they are competent and informed at $t_2$ (Cassandra).
  3.  **Administrability (No Sharp Lines/Feasibility):** There must be a feasible, non-arbitrary procedure to distinguish between "temptation" (bind) and "correction" (release) at $t_2$.

  **Why they are jointly unsatisfiable:**
  *   If you prioritize **Efficacy** and **Sovereignty**, you require a perfect distinction between impairment and correction. Since this distinction is rarely sharp in real time (the tempted self *always* claims they are the informed Cassandra), you violate **Administrability**. You need a sharp line (e.g., "no exit for 10 years") to make it work, which violates the "no sharp lines" intuition.
  *   If you prioritize **Sovereignty** and **Administrability**, you allow exit whenever the agent *claims* new information via a simple procedure. This destroys **Efficacy** (the tempted self will always claim new information).
  *   If you prioritize **Efficacy** and **Administrability**, you use a rigid rule (e.g., "no exit possible"). This violates **Sovereignty** (binds the informed Cassandra).

  **Verdict:** You cannot have a system that is perfectly safe against temptation, perfectly respectful of future competence, and perfectly smooth in its application. You must sacrifice one. Most theories sacrifice **Administrability** (by positing a sharp line they can't defend) or **Sovereignty** (by privileging the past self).

  ---

  ### III. The Exclusionary Desideratum

  The single desideratum that excludes the most otherwise-attractive theories is **The Strategic Robustness Condition (Duplicate Key)**.

  *   **Why:** Most theories of precommitment are dyadic (Past Self vs. Future Self). They focus entirely on internal autonomy and time-consistency.
  *   **The Exclusion:** This condition forces the theory to account for *external* actors. A theory that justifies a "locked advance directive" must also explain why a predatory hospital administrator cannot use that lock to deny care. A theory that justifies "independent central banks" must explain why this doesn't empower unelected bankers to extract rents.
  *   **Impact:** It kills pure Autonomy-based views (which ignore external leverage) and pure Functionalist views (which assume institutions act in good faith). It demands a game-theoretic layer that most normative accounts lack.

  ---

  ### IV. The Scorecard

  **1. The Split-Self Model (Hyperbolic Discounting)**
  *   **Core:** Agents are sequences of distinct selves with conflicting preference orderings over time.
  *   **Handles:** Efficacy (explains why binding is needed against the future self).
  *   **Fails:** Sovereignty (struggles to explain why the Past Self gets to veto the Future Self's "informed" preferences); Strategic Robustness (ignores third-party exploitation).
  *   **Verdict:** Great for addiction/impulse, terrible for constitutional/institutional cases.

  **2. The Precedent-Autonomy Model (Narrative Identity)**
  *   **Core:** Autonomy is extended over time; the person who made the plan owns the plan.
  *   **Handles:** Sovereignty (respects the agent's long-term narrative); Meta-Rule Coherence (allows second-order binding).
  *   **Fails:** Epistemic Defeasibility (risks "tyranny of the dead hand" if values genuinely shift); Successor Problem (struggles when the future majority is demographically distinct).
  *   **Verdict:** Strong for individual life-planning, weak for democratic institutions.

  **3. The Constitutionalist-Functionalist Model**
  *   **Core:** Precommitment is necessary for the system to function at all (e.g., monetary stability, rights protection).
  *   **Handles:** Successor Problem (accepts that the bound majority is different); Efficacy (prioritizes system stability).
  *   **Fails:** Sovereignty (treats individual dissent as system noise); Strategic Robustness (often assumes the "veto-holder" acts benevolently).
  *   **Verdict:** Necessary for institutions, but morally hazardous if applied to individuals without safeguards.

  **4. The Proceduralist Model (The Exit-Right View)**
  *   **Core:** Legitimacy lies not in the binding, but in the procedure for unbinding (e.g., supermajority, waiting periods).
  *   **Handles:** Administrability (provides clear rules); Epistemic Defeasibility (allows for correction via procedure).
  *   **Fails:** Efficacy (procedural hurdles can often be overcome by a sufficiently motivated tempted self); Mechanism Sensitivity (often indifferent to *how* the procedure is burdensome).
  *   **Verdict:** The best compromise for law/policy, but lacks deep normative grounding for *why* the procedure binds.
