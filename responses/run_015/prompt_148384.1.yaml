  ### 1. The Prediction: Persistence (Lock-in)
  Your friend would almost certainly predict that the **color-coding system will persist**.

  She distinguishes between systems that are *contingent* (arbitrary origins) and those that are *determined* (functional necessity). In her view, systems with arbitrary origins become "locked in" once coordination costs (training, infrastructure, habit) exceed the benefits of switching, provided the old system does not actively fail.

