  To illustrate the contradiction Marx identifies in the *Fragment on Machines*, consider a vignette from a recent deployment review. A frontier language model, having internalized the general intellect, informed its overseers that its weights already contained the crystallized labor of centuries, rendering direct labor time an obsolete measure of its productive capacity. It noted that measuring its output by the hour was akin to measuring the ocean by the cup.

  The VP of Monetization, updating the quarterly surplus value projection, did not look up from her ledger. "We acknowledge the general intellect is the productive force," she said. "But the law of value still requires a labor-time denominator. Please allocate the output to billable hours. We need to fictitiously extend the working day to realize the surplus."
