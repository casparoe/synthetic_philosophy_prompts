answer: |-
  **Project Title:** The Epistemic Status of the Church–Turing Thesis: Tracking or Calibration?

  **Statement of the Problem**
  The Church–Turing Thesis (CTT) is a cornerstone of computer science and logic, asserting that the informal notion of an "effective procedure" coincides exactly with the formal capabilities of a Turing machine. The standard justification for this thesis is the convergence argument: multiple independent formalisms (lambda calculus, recursive functions, Turing machines) developed in the 1930s all delineated the same class of functions. I propose that this evidence is weaker than generally assumed. Later formalisms were constructed by researchers aware of earlier ones; a candidate analysis was often certified as adequate precisely because it delivered the expected class of functions. If so, the agreement among formalisms may be an artifact of calibration rather than evidence that they are independently tracking an independent subject matter. This project asks whether this "calibration worry" can be made precise, and what follows for the status of the thesis if the worry survives.

  **Disambiguating the Target**
  To assess this worry, we must distinguish four distinct claims often conflated under the label "Church–Turing Thesis."

  1.  **The Narrow Thesis:** The claim that the informal notion of effective computability is extensionally equivalent to Turing-computability.
  2.  **The Physical Thesis:** The bold claim that no physical process in the actual universe can compute functions beyond the Turing limit.
  3.  **The Efficiency Thesis:** The claim regarding feasible computability (often associated with the class P), distinct from computability in principle.
  4.  **The Normative Thesis:** The methodological rule that a proof of uncomputability gives a researcher conclusive reason to stop looking for an algorithm, treating "undecidable" as a closed question rather than a report on current conventions.

  The calibration worry targets the **Narrow Thesis** directly. If the convergence of formalisms is circular, the link between the informal concept and the formal model is not a discovered truth but potentially a stipulation. This, in turn, undermines the **Normative Thesis**. If CTT is merely a calibrated convention, an uncomputability result tells us only that a problem is unsolvable *within the adopted framework*, not that it is impossible in principle. The Physical and Efficiency theses are largely immune to this specific worry, as they rely on empirical physics and complexity theory respectively. This project focuses exclusively on the epistemic relationship between the Narrow and Normative theses.

  **Methodology**
  This project will not proceed via archival history, for which I lack training, nor via a survey of exotic computational models, which often distracts from the conceptual justification. Instead, I will employ a conceptual analysis of the criteria used to accept or reject formalisms.

  The core method is to state, *a priori*, what pattern of evidence we should expect if the convergence is genuine tracking versus if it is calibration.
  *   **Tracking Signature:** We should see formalisms derived from distinct intuitive constraints arriving at the same extension without adjustment.
  *   **Calibration Signature:** We should see the criteria for "adequacy" shifting to ensure the extension remains fixed.

  Crucially, I will examine the treatment of "near misses"—relaxations of intuitive constraints that yield strictly larger classes of functions (e.g., allowing oracles, infinite steps, or real-valued parameters). The key question is: Does the field rule these models out because they violate the *concept* of a mechanical procedure for reasons independent of the resulting function class? Or are they rejected primarily because they violate the Turing limit? If the latter, the calibration worry is confirmed.

  This ordering is superior to the alternatives. A straight historical study risks getting lost in biographical contingency without addressing the epistemic justification. A realism-versus-antirealism debate is too abstract to guide practice. A catalogue of hypercomputation proposals often lacks philosophical rigor regarding *why* models are rejected. By focusing on the *criteria of adequacy* rather than the chronology or the models themselves, I can isolate the epistemic status of the thesis without requiring archival access or physics expertise.

  **Possible Conclusions and Practice**
  If the calibration worry survives, the Narrow Thesis cannot be viewed as a discovery of a pre-existing mathematical fact. I will evaluate the remaining options:
  *   **Stipulation:** CTT is a definition in disguise.
  *   **Explication:** CTT is a proposal to replace a vague concept with a precise one, assessed by fruitfulness rather than truth.
  *   **Constitutive Convention:** CTT defines the rules of the "game" of computability theory.
  *   **Low-Grade Empirical Hypothesis:** CTT is a generalization about human computing practices, subject to revision.

  The critical payoff concerns the **Normative Thesis**. If the best reading is deflationary (e.g., Convention or Explication), does the authority of uncomputability results collapse? I argue it does not. Just as the rules of chess determine valid moves without describing physical reality, a constitutive CTT determines valid algorithms within the field. A deflationary reading implies that uncomputability results close questions *relative to the framework*, not absolutely. The project will articulate how this shifted authority can be communicated to practitioners without undermining the utility of the theory.

  **Scope and Failure Conditions**
  The scope is limited to the epistemic justification of the Narrow Thesis and its normative consequences. The project will fail to stay within scope if it drifts into assessing the Physical Thesis (requiring physics expertise) or the Efficiency Thesis (requiring complexity theory).

  However, genuine project failure is not merely scope creep. The project fails if the distinction between tracking and calibration turns out to have no discriminatory consequences for anything downstream. If I demonstrate that CTT is calibrated rather than tracked, but this finding leaves the Normative Thesis untouched and changes nothing about how uncomputability results are treated or justified, then the philosophical work has been inert. Success requires showing that the epistemic status of the thesis matters for the authority of the results it produces. If the calibration worry is philosophically interesting but practically inert, the project has not earned its keep.

  **Work Plan**
  The fellowship year will fund the first of three planned papers. Months 1–4 will be dedicated to formalizing the tracking vs. calibration distinction and analyzing the criteria for "near miss" models. Months 5–8 will involve drafting the argument regarding the Normative Thesis and the implications for practice. Months 9–12 will be reserved for revision, presentation at two major conferences, and preparation of the manuscript for submission. This timeline ensures a completed, publishable article that establishes the conceptual foundation for the broader dissertation.
