prompt: |-
  You are a professional philosopher who specialises in Kantian and post-Kantian epistemology and who has followed the literature on transcendental arguments closely — you know where the bodies are buried. Take your time with this: before you commit to an answer, do a short brainstorm pass in which you list every candidate tension you can see, and only then start ranking and weeding. Be blunt, and please discriminate rather than flagging everything as equally dodgy.

  Right. I've just had a three-hour argument in the pub with a friend about transcendental arguments, went to bed convinced I'd won, and woke up not convinced at all. So: audit, please. Here's roughly where I've landed, and I want to know whether it hangs together or whether I've helped myself to something I'm not entitled to. I genuinely don't know which bit I'd give up — that's why I'm asking.

  (1) A transcendental argument is a legitimate form of argument, but only in its modest form: you start from something undeniable about our cognitive life (that we have experience, that we make judgements, that we self-ascribe states), you show that P is a necessary condition of the possibility of that, and you conclude that we're thereby entitled to believe P. That entitlement is enough to deal with the sceptic; nobody ever needed P proved from nothing.

  (2) Verificationism as a general theory of meaning is dead, obviously. But I'm happy to use a local version *inside* the argument: if P's holding could make no difference to anything we could ever be in a position to register, then the argument buys us nothing. My friend said that's verificationism smuggled in through the side door; I said it isn't, because it's a constraint on what this kind of argument can entitle us to, not on what's meaningful.

  (3) The conclusion has to be about how things are, not merely about how we must take them to be. Not idealism: the argument has to reach mind-independent objects, not just our conceptual scheme. (The standard complaint — that a modest transcendental argument only ever gets you that we must *believe* P, and the sceptic can live with that — I think is answerable, but I'm not sure I can say why without going verificationist after all.)

  (4) The necessity is conditional: necessarily, if there's experience or judgement of this kind, then P. And the premises can include perfectly ordinary empirical facts about the sort of creatures we are. So transcendental arguments are "impure", and I don't see a problem with that.

  (5) I'm also a conceptual pluralist: there could be creatures operating with very different, perhaps partly incommensurable conceptual schemes, and the conclusions of transcendental arguments are indexed to a scheme.

  (6) A Strawson-ish argument against external-world scepticism basically works — something like: being able to self-ascribe experiences at all requires experience of an objective, mind-independent order of things.

  (7) The same style of argument does *not* work for other minds. I think the other-minds version fails, and my friend says that's arbitrary and I have to say wich part of the method breaks.

  (8) Transcendental arguments aren't abductive. They're not inference to the best explanation in disguise, and I don't want to defend them as if they were.

  (9) The chain of conditions has to stop somewhere — the argument can't regress for ever. But I don't believe in self-evident basic beliefs, and I don't think any belief of mine is unrevisable.

  (10) Two things my friend invented on the spot, which I couldn't answer properly: he called the first the "promiscuity objection" — if bridge principles of the kind in (1) are allowed, then every necessary condition of anything undeniable generates an entitlement, so we get entitlements to the uniformity of nature, the reliability of memory, other minds, maybe even God, and the method over-generates unless there's a principled filter, and he says I haven't got one. He called the second the "audience problem": a transcendental argument only binds whoever grants the premise, and a determined sceptic can decline to grant that he has experiences or makes judgements without thereby being irrational, so the argument only ever addresses people who weren't worried in the first place.

  So: go through the set and tell me which pairs are in genuine tension and how badly, ranked by severity rather than all listed as equally bad. For each real tension, say what would have to give and what dropping it would cost me elsewhere. I also want at least one pair identified as *only apparently* in tension, with the reason it dissolves — I've a feeling one of these is fine and I can't tell which. Then tell me which single revision would clean up the most.

  Three specifics I want answered head on: whether my local verificationism in (2) really is just verificationism; whether (6) and (7) can both stand; and whether the real trouble is in (1) plus (3) rather than anywhere else. Finally, tell me what would count as settling it — is there any test that would show the promiscuity objection has teeth, or is it just a standoff? And don't tell me to go and read someone: I can't get to a library untill Monday.
