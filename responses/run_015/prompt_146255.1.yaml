      *Correction on Unwelcome Answer:* "Include one case where the procedure gives an answer I'll probably dislike." This can be one of the three. I will make the Borderline Clash result in a "Not a Disease" verdict, which is the "unwelcome" part for the applicants/board members who want to help.

