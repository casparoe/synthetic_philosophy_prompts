      *   *Normativist (Nordenfelt):* Disease = inability to achieve "vital goals" (happiness, minimal action) in standard circumstances. Subjective/Value-laden. *Problem:* Can pathologize normal unhappiness or social disadvantages; risks expanding "disease" too far.
      *   *Hybrid Approach:* Need a threshold for biology *and* a threshold for harm. If both align, easy. If they conflict, need a tie-breaker.

