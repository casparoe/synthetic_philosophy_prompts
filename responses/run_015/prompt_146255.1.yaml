answer: |-
  # The 90-Minute Hybrid Classification Protocol
  **Purpose:** To classify conditions for state disability/chronic-condition funding.
  **Time Budget:** ~7 minutes per application (12 apps/month).
  **Philosophy:** Pragmatic Hybrid (Naturalist Baseline + Normativist Override).

  This procedure admits upfront that "disease" is partly a biological fact and partly a social value judgment. Do not try to resolve the philosophy. Use the philosophy to structure the vote.

  ---

  ## Part 1: The Decision Flow

  ### Step 1: The Boorse Check (Biological Dysfunction)
  **Time:** 2 Minutes
  **Question:** Is there evidence of a internal mechanism failing to perform its species-typical function?
  **Criteria (Check at least one):**
  *   [ ] **Pathology:** Lesions, tumors, inflammation, or structural damage visible via imaging/lab.
  *   [ ] **Biomarker:** Hormonal, genetic, or chemical deviation outside 2.5th/97.5th percentile *not* caused by voluntary choice (e.g., fasting).
  *   [ ] **Etiology:** Known pathogen (virus, bacteria) or genetic mutation identified.

  *   **If YES:** Proceed to Step 2.
  *   **If NO:** Proceed to Step 2 (Do not reject yet; some conditions lack biomarkers).
  *   **[PUNT FLAG]:** If the committee disagrees on what counts as "species-typical function" (e.g., is menopause a dysfunction or a design feature?), **stop and vote**. Do not debate biology further.

  ### Step 2: The Nordenfelt Check (Vital Goal Impairment)
  **Time:** 3 Minutes
  **Question:** Does this condition significantly reduce the applicant's ability to achieve "vital goals" in standard circumstances?
  **Criteria (Check at least two):**
  *   [ ] **Agency:** Inability to perform basic daily actions (eating, moving, sleeping) without assistance.
  *   [ ] **Social Participation:** Inability to maintain employment, relationships, or civic engagement comparable to peers.
  *   [ ] **Suffering:** Self-reported pain or distress rated >7/10 sustained for >6 months, verified by clinical history.

  *   **If YES:** Proceed to Step 3.
  *   **If NO:** **Default Verdict: Not a Disease.** (Exception: Asymptomatic conditions with high mortality risk require subcommittee review).
  *   **[PUNT FLAG]:** If the committee disagrees on what counts as a "vital goal" (e.g., is "career advancement" a vital goal or just a preference?), **stop and vote**.

  ### Step 3: The Conflict Matrix & Tie-Breaker
  **Time:** 2 Minutes
  Compare Step 1 and Step 2 results.

  | | **Step 2: Harm (NO)** | **Step 2: Harm (YES)** |
  | :--- | :--- | :--- |
  | **Step 1: Bio (YES)** | **Asymptomatic Pathology**<br>*(e.g., Early Stage Cancer)*<br>**Verdict:** CLASSIFY AS DISEASE.<br>*(Rationale: Future harm is probable.)* | **Classic Disease**<br>*(e.g., Diabetes)*<br>**Verdict:** CLASSIFY AS DISEASE.<br>*(Rationale: Full alignment.)* |
  | **Step 1: Bio (NO)** | **Deviance without Harm**<br>*(e.g., Unusual Eye Color)*<br>**Verdict:** NOT A DISEASE.<br>*(Rationale: No claim on resources.)* | **The Borderline Clash**<br>*(e.g., Chronic Pain w/o lesion)*<br>**Verdict:** **TIE-BREAKER REQUIRED.** |

  **The Tie-Breaker Rule (For Borderline Clash):**
  If Biology is **NO** but Harm is **YES**, you must apply the **"Exclusion of Normalcy"** test:
  1.  Is the harm caused by a *hostile environment* rather than an *internal state*? (If Yes → Deny Classification, refer to Social Services).
  2.  Is the condition statistically common among healthy populations? (If Yes → Deny Classification).
  3.  **[VOTE REQUIRED]:** If the committee cannot agree on whether the cause is internal or environmental, **vote by simple majority**. Record the dissent. Do not claim this is objective science.

  ---

  ## Part 2: Worked Examples

  ### Case 1: Clear Naturalist Win (Type 1 Diabetes)
  *   **Step 1 (Bio):** **YES.** Autoimmune destruction of beta cells. Insulin production near zero. Clear deviation from species-typical metabolic function.
  *   **Step 2 (Harm):** **YES.** Without intervention, death. With intervention, high management burden.
  *   **Step 3 (Matrix):** Classic Disease.
  *   **Verdict:** **Approved.**
  *   **Comment:** No philosophy needed here. The biology forces the hand.

  ### Case 2: Clear Normativist Win (Idiopathic Infertility)
  *   **Step 1 (Bio):** **UNCLEAR/NO.** No blockage, hormones normal, sperm/egg viable. No "broken part" found. Boorse would struggle to call this a dysfunction of the *individual's* survival.
  *   **Step 2 (Harm):** **YES.** Vital goal of reproduction (recognized by state family law) is impossible. Significant psychological distress.
  *   **Step 3 (Matrix):** Borderline Clash → Tie-Breaker.
  *   **Tie-Breaker Application:** Is this a hostile environment? No. Is it statistically common among "healthy" people? No (it is a specific failure of the reproductive system design, even if the mechanism is hidden).
  *   **Verdict:** **Approved.**
  *   **Comment:** Here, the Normativist view dominates. We fund because the *goal failure* is severe, even if the *biological mechanism* is invisible. This acknowledges that "function" includes reproduction, not just survival.

  ### Case 3: The Borderline Clash (Persistent Social-Comparison Fatigue)
  *   **Context:** Applicant reports exhaustion, anxiety, and inability to work due to compulsive social media use. No clinical depression diagnosis. No neurochemical biomarkers.
  *   **Step 1 (Bio):** **NO.** No lesion, no hormone imbalance, no genetic marker. Neuroplasticity changes are theoretical, not diagnostic.
  *   **Step 2 (Harm):** **YES.** Applicant cannot maintain employment. Reports high distress.
  *   **Step 3 (Matrix):** Borderline Clash (Bio NO / Harm YES).
  *   **Tie-Breaker Application:**
      1.  *Hostile Environment?* **YES.** The harm is contingent on exposure to social media algorithms. Remove the phone, symptoms abate.
      2.  *Statistically Common?* **YES.** High prevalence in general population.
  *   **Verdict:** **DENY CLASSIFICATION.** (Refer to vocational counseling).
  *   **Why you will dislike this:** The suffering is real. Denying funding feels like blaming the victim. However, classifying this as a "disease" medicalizes a social/technological problem. If we fund this, we must fund *all* distress caused by modern life (traffic, poverty, noise).
  *   **[PUNT FLAG]:** If 50% of the board believes social media addiction alters brain chemistry enough to count as "Bio YES," **vote immediately**. Do not wait for more research.

  ---

  ## Part 3: Limitations & Vulnerabilities

  ### Where This Procedure Breaks (The "Punt" Zones)
  1.  **Defining "Vital Goals":** The procedure assumes we agree on what goals are "vital." We don't.
      *   *Action:* If an applicant claims "inability to pursue artistic excellence" is a vital goal failure, **Punt to Subcommittee**. The full board cannot adjudicate subjective life values in 7 minutes.
  2.  **Asymptomatic Risks:** The procedure classifies Asymptomatic Hypertension as a disease (Bio YES, Harm NO → Future Harm Probable). But it might deny funding for *prevention* if the "Harm" threshold is too strict.
      *   *Action:* Create a separate "Prevention" bucket. Do not force prevention into the "Disease" classification.
  3.  **The "Hostile Environment" Trap:** In Case 3, we denied funding because the environment caused the harm. But what if the environment is *universally* hostile (e.g., air pollution causing asthma)?
      *   *Action:* If the environmental trigger is unavoidable for *all* citizens, revert to **Bio YES** (physiological reaction to toxin) and fund. If the trigger is avoidable (social media), deny. This distinction is messy and requires a **Vote**.

  ### Where My Reasoning is Most Vulnerable
  1.  **The Naturalist Bias:** I have biased the Tie-Breaker against "Social" conditions (Case 3). A committed Normativist would argue that if the suffering is real, the cause doesn't matter. My procedure prioritizes *budget containment* over *suffering alleviation* in borderline cases. If your state's mandate is purely humanitarian, my Tie-Breaker is too strict.
  2.  **The "Species-Typical" Illusion:** Step 1 assumes we know what human biology is "supposed" to do. We often don't. (e.g., Is ADHD a dysfunction of attention or an adaptation for novelty-seeking?). If new evolutionary psychology findings suggest "dysfunctions" are actually variations, Step 1 collapses.

  ### What Would Change My Mind
  I would shift to a **Dominant Normativist Framework** (fund based on harm alone, ignore biology) if:
  *   **Evidence:** We discover that 40%+ of conditions currently classified as "biological" (e.g., certain chronic pains or migraines) have no physiological correlate but respond only to social intervention. This would prove the "Bio Check" is a false gatekeeper delaying care.

  I would shift to a **Dominant Naturalist Framework** (fund only proven pathology) if:
  *   **Evidence:** We find that funding "harm-based" conditions without biomarkers leads to a >20% increase in malingering or dependency without improved health outcomes. This would prove the "Harm Check" is fiscally unsustainable.

  ### Final Instruction to the Board
  When you hit a **[VOTE REQUIRED]** flag, do not say "We have determined scientifically..."
  Say: **"We have determined politically..."**
  Acknowledge that you are drawing a budget line, not discovering a truth. That honesty is the only way to maintain legitimacy when you deny Case 3.
