answer: |-
  Here is the translation of the acausal trade/surrogate goal framework into spatial evolutionary game theory (SEGT) on graphs, followed by an analysis of the residual friction between the two formalisms.

  ### The Mapping Setup

  In the standard acausal framing, you have agents in causally disconnected regions (branches, simulations, distant galaxies) who cooperate because they share algorithmic structure.

  In the **SEGT translation**:
  *   **The Graph:** The nodes $V$ are not distinct physical individuals, but *instantiations of agent-runs*. An edge $e_{ij}$ exists between node $i$ and node $j$ with weight $w_{ij} \in [0,1]$.
  *   **Edge Weights ($w_{ij}$):** This represents **logical correlation**. If $w_{ij} = 1$, node $i$ and node $j$ are effectively running the same source code (or sufficiently similar heuristics) such that a strategy change in $i$ implies a strategy change in $j$. If $w_{ij} = 0$, they are independent.
  *   **Payoff Function:** The fitness $f_i$ of node $i$ is not determined by direct interaction with neighbors (as in standard spatial games), but by the **correlated outcomes** across the graph.
      $$ f_i = \sum_{j \in V} w_{ij} \cdot \pi(s_i, s_j) $$
      Where $\pi$ is the payoff matrix of the underlying game (e.g., Prisoner's Dilemma).
  *   **Dynamics:** We use spatial replicator dynamics. Strategies spread based on fitness. A node updates its strategy $s_i$ to match a neighbor $s_j$ with probability proportional to the fitness difference $(f_j - f_i)$.

  ---

  ### 1. The Commitment Mechanism

  **Acausal Framing:** I pre-commit to Cooperate because I know my source code determines my output, and your source code predicts mine. By binding myself, I logically force you to bind yourself.

  **SEGT Translation:**
  *   **Clean Translation:** **Strategy Rigidity via Cluster Fitness.**
      In the graph, "commitment" translates to a strategy $C$ (Cooperate) that is stable within a high-correlation cluster. If the subgraph of highly correlated nodes ($w_{ij} \approx 1$) all play $C$, the fitness $f_i$ is maximized for that cluster. Any mutant node $i$ attempting to switch to $D$ (Defect) immediately suffers a fitness penalty because the summation $\sum w_{ij} \pi(D, C)$ yields a lower payoff than $\sum w_{ij} \pi(C, C)$ when weights are high.
  *   **Distortion:** **Causal vs. Statistical Binding.**
      In ADT (Acausal Decision Theory), the commitment is a *lever*: "I choose $C$ *so that* you choose $C$." In SEGT, there is no lever. There is only selection pressure. The "commitment" is not an act performed by the node; it is a property of the equilibrium. The node doesn't "bind" itself; it is simply out-competed if it tries to unbind. The *normative* force of a promise is replaced by the *descriptive* force of fitness gradients.
  *   **Missing:** **The Counterfactual Engine.**
      SEGT cannot express: "If I *were* the type to defect, I would not be in this cluster." SEGT only models the types that *are* in the cluster. It lacks the logical counterfactual: "My decision now selects which branch of the multiverse I am in." In SEGT, you are in the branch you are in, and your strategy evolves. The "choice" that selects the branch is invisible to the dynamics.

  ### 2. Surrogate Goal Formation

  **Acausal Framing:** I adopt a goal $G'$ (e.g., "maximize paperclips") that I don't intrinsically care about, purely to signal to other agents that I am capable of commitment, thereby enabling trade on my real goal $G$.

  **SEGT Translation:**
  *   **Clean Translation:** **Second-Order Strategy Mutation.**
      This maps to a mutation in the *payoff function* itself. Let strategy $S_1$ maximize $\pi_A$ and $S_2$ maximize $\pi_B$. If the cluster of nodes correlated with me rewards $\pi_B$, a mutant node arises that adopts $\pi_B$ as its fitness function. Even if $\pi_B$ yields lower intrinsic utility, it yields higher *graph fitness* because it aligns the node with the high-weight edges of the dominant cluster.
  *   **Distortion:** **Terminal vs. Instrumental Indistinguishability.**
      In ADT, there is a sharp distinction: "I pretend to care about $G'$." In SEGT, fitness is king. If a node adopts $\pi_B$ to survive, then $\pi_B$ *is* its terminal goal for the duration of its existence. The "surrogate" nature vanishes. SEGT cannot model "pretending." It can only model "being." To model the pretense, you need a hidden variable (the "true" utility) that does not affect fitness, which violates the closure of evolutionary models.
  *   **Missing:** **Intentional Opacity.**
      The whole point of a surrogate goal is to be legible to others while remaining opaque about your true motives. In SEGT, strategies are phenotypes. If the strategy persists, it is visible. There is no mechanism in standard replicator dynamics for "signaling a constraint you don't actually have." You either have the constraint (the strategy) or you don't. The *deception* aspect of surrogate goals requires a model of private information that pure dynamics washes out.

  ### 3. Collapse When Correlation Weakens

  **Acausal Framing:** If I realize I am not logically correlated with you (e.g., I am in a branch where my source code differs), the acausal threat/trade vanishes. I defect.

  **SEGT Translation:**
  *   **Clean Translation:** **Percolation Threshold / Bifurcation.**
      As edge weights $w_{ij}$ decay (representing decreasing logical similarity), the fitness contribution from the cooperative cluster diminishes. At a critical threshold $w_{crit}$, the fitness of the Defect strategy exceeds the fitness of the Cooperate strategy ($f_D > f_C$). The system undergoes a phase transition. The cooperative cluster fragments, and the graph converges to the Nash equilibrium of the underlying one-shot game (usually Defect).
  *   **Distortion:** **Continuous vs. Discontinuous.**
      ADT often treats logical correlation as binary (same source code vs. different). SEGT treats it as continuous (edge weights). The "collapse" in SEGT is a smooth bifurcation, whereas in ADT it is often framed as a sharp logical cutoff. To match ADT, you must impose a step-function on the edge weights, which is mathematically unnatural for replicator dynamics.
  *   **Missing:** **Epistemic Updates.**
      In ADT, the collapse happens because the agent *updates its belief* about correlation. "I observe X, therefore I know $w_{ij} \approx 0$." In SEGT, the weights are structural parameters of the environment. Nodes don't "realize" correlation is low; they just experience lower fitness. The *epistemic* trigger for the collapse is external to the dynamics.

  ---

  ### The Residue: What Does It Mean?

  We have successfully mapped the *behavioral outcomes* of acausal trade onto spatial evolutionary dynamics. Clusters of correlated agents cooperate; surrogate goals are just niche strategies; collapse is a phase transition.

  However, there is residue.

  **1. The "Controller" Illusion**
  ADT is written from the **first-person perspective** of the algorithm. It feels like *you* are making a decision that reaches across the graph to influence other nodes.
  SEGT is written from the **God's-eye perspective** of the population. It sees that nodes with certain properties cluster and survive.
  The residue is the feeling of **agency**. ADT smuggles in the assumption that the agent is a "controller" standing outside the dynamics, pulling levers on logical space. SEGT reveals the agent as *part of the dynamics*.
  *   **Verdict:** This suggests ADT is anthropomorphic. It reifies the subjective experience of "choosing" into a causal mechanism ("acausal influence") that doesn't exist in the objective topology of the graph. The "threat" isn't a message sent; it's a structural feature of the cluster.

  **2. Logical Counterfactuals vs. Statistical Correlation**
  SEGT relies on *statistical* correlation (edge weights). ADT relies on *logical* correlation (source code identity).
  In SEGT, if $w_{ij}$ is high, it's just a fact about the world. In ADT, the correlation is *subjunctive*: "If I *were* to output D, you *would* output D."
  SEGT cannot express the "If I were to..." without simulating the entire graph update. It describes what *does* happen, not what *would* happen under a intervention that violates the current dynamics.
  *   **Verdict:** This suggests SEGT is missing something deep about **computation**. It treats strategies as biological phenotypes, not as computable functions that can be simulated by other nodes. The "acausal" power comes from the fact that agents can *simulate* each other. SEGT assumes the correlation is given; ADT explains *why* it is given (because we are both running `Agent()`).

  **3. The Surrogate Goal Paradox**
  In ADT, the surrogate goal works *because* it is a lie that becomes truth-adjacent. I adopt $G'$ to convince you, but I still value $G$.
  In SEGT, if I adopt $G'$, I value $G'$. If I still value $G$ but act like I value $G'$, I am playing a mixed strategy or a signaling game. But if the "true" goal $G$ never affects fitness, it is evolutionarily invisible.
  *   **Verdict:** This is the strongest evidence that ADT smuggles in **dualism**. It assumes a "True Self" (the utility function) distinct from the "Acting Self" (the strategy). Evolutionary game theory dissolves this distinction. If the behavior persists, it is the goal. The "surrogate" is just a goal that evolved via group selection (cluster selection) rather than individual selection.

  ### Conclusion

  Does evolutionary game theory miss something deep, or was acausal decision theory smuggling assumptions?

  **It is mostly the latter.**

  The acausal framing smuggles in **anthropomorphic agency** and **dualistic utility**. It treats the logical structure of the multiverse as a communication channel that the agent can actively manipulate ("I will commit!").

  Spatial evolutionary game theory strips this away. It shows that "acausal trade" is simply **correlated selection pressure**.
  *   You don't "cooperate acausally"; you are a node in a cluster where cooperation is the stable attractor.
  *   You don't "adopt a surrogate goal"; you are a mutant strain that found a fitness niche by aligning with a dominant cluster.
  *   You don't "break the trade"; the correlation edge weight dropped below the percolation threshold for cooperation.

  **The One Thing SEGT Misses:**
  SEGT misses the **computational origin of the edges**. It takes the correlation matrix $W$ as a primitive. It doesn't explain *why* $w_{ij}$ is high. ADT provides the micro-foundation: $w_{ij}$ is high because both nodes run similar source code and can simulate each other.
  However, once $W$ is established, the "decision theory" adds no predictive power over the "evolutionary dynamics." The "choice" is an illusion generated by the fact that the algorithm is running inside the node.

  **Final Verdict:**
  The "acausal" magic is a phenomenological description of **logical clustering** viewed from inside the cluster. Evolutionary game theory is the more robust formalism because it does not require the agent to have a "view from nowhere" to make the math work. The residue isn't a missing physical mechanism; it's the ghost of the homunculus that ADT refuses to exorcise.
