answer: |-
  1. "Kant says shooting a faithful old dog doesn't wrong the dog, only the man. So I'm very gentle with them, strictly to preserve my own moral hygiene."
  This joke turns on the starkness of Kant's actual lecture example; readers who know the view recognize the accurate citation, while those who don't hear a chilling admission that the dog's suffering is irrelevant compared to the man's character, foreshadowing his later prioritization of abstract principle over concrete care.

  2. "Think of it as moral calisthenics. I don't owe the dog anything, but if I'm cruel to him, I might forget how to be kind to you."
  This joke turns on the instrumentalization of affection; Kant-literate readers see the precise 'indirect duty' formulation, while others sense a warning that his kindness to *her* is similarly transactional, foreshadowing his emotional unavailability.

  3. "Technically, I owe him nothing. But if I discard him when he's useless, I damage my duty to humans. So I keep him around for my sake, not his."
  This joke turns on the utility condition of care; readers familiar with the view nod at the fidelity versus utility tension, while others catch the threat that he discards the 'useless,' foreshadowing how he might treat people who can no longer serve him.
