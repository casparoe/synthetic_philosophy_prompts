answer: |-
  You have hit on the single most significant and persistent objection to Benatar's argument. You are not missing something obvious; you have identified the exact tension that critics (like David Wasserman, Elizabeth Harman, and others) seize upon.

  The charge is that Benatar is indeed "switching metrics": he uses an **impersonal** valuation for pain (the absence of pain is good *simpliciter*) and a **person-affecting** valuation for pleasure (the absence of pleasure is not bad *because no one is deprived*).

  Here is the resolution to how Benatar defends this, why he denies it is a contradiction, and where the "shadow status" interpretation goes wrong.

  ### 1. It is not a "Modal Filter," it is a "Value Distinction"
  Your hypothesis about a modal filter (applying different rules based on actual vs. potential subjects) is close, but Benatar would correct the terminology. He argues that the asymmetry arises from a fundamental difference in the **moral logic of harm versus benefit**, not the metaphysical status of the subject.

  Benatar's defense rests on the distinction between **"good/bad" (value)** and **"good/bad *for* someone" (welfare)**.

  *   **Pain:** The presence of pain is bad *for* the person. However, the **absence** of pain is **good** (impersonally), even if there is no one to experience that good. Why? Because pain is intrinsically bad. Therefore, a state of affairs without pain is better than a state of affairs with pain, regardless of whether a subject exists to register the improvement.
  *   **Pleasure:** The presence of pleasure is good *for* the person. However, the **absence** of pleasure is **not bad** (impersonally) unless there is a subject who is deprived. Pleasure is not intrinsically required; it is only a loss relative to a subject who could have experienced it.

  Benatar argues this isn't a contradiction in metaphysics, but a reflection of the fact that **suffering commands moral attention in a way that happiness does not.** We have a duty to prevent suffering (even for those who won't exist if we succeed), but we do not have a duty to create happiness (for those who won't exist if we fail).

  ### 2. Rejecting the "Shadow Status"
  You asked if this collapses into saying non-existent people have a "shadow-status" where they can be benefited by not suffering.

  Benatar explicitly rejects this. He argues we are not comparing the welfare of a "possible person" in two different states (Existence vs. Non-existence). That would indeed require the non-existent person to have a status that allows them to be "better off."

  Instead, Benatar argues we are comparing **two states of affairs**:
  1.  **State A:** A world containing a person who suffers.
  2.  **State B:** A world containing no person (and therefore no suffering).

  State B is better than State A. This judgment does not require the person in State B to exist. It only requires that *suffering* is bad. Therefore, the "good" of the absence of pain attaches to the **state of the world**, not to the **welfare of the non-existent**.

  Conversely, when looking at pleasure:
  1.  **State C:** A world containing a person who enjoys pleasure.
  2.  **State D:** A world containing no person (and therefore no pleasure).

  State C is better than State D *for the person*, but State D is not "worse" in any meaningful moral sense because there is no subject for whom it is worse.

  ### 3. Why he rejects Pure Impersonalism and Pure Person-Affecting Views
  You noted that Benatar rejects pure versions of both views. This is crucial to understanding why the Asymmetry isn't a bug, but a feature, for him.

  *   **Pure Person-Affecting View:** If we only care about harms/benefits to actual people, we run into the **Non-Identity Problem**. If a child is born with a miserable life, but their existence depends on that specific conception, a person-affecting view struggles to say the parents did wrong (because the alternative was non-existence, which is not "better" for the child). Benatar wants to say creating a miserable child *is* wrong, so he needs the impersonal "absence of pain is good" clause.
  *   **Pure Impersonal View:** If the absence of pain is good and the absence of pleasure is bad (impersonally), we are obligated to create as many happy people as possible to maximize the "good" of pleasure. This leads to the **Repugnant Conclusion**. Benatar wants to avoid this obligation, so he needs the person-affecting "absence of pleasure is not bad" clause.

  The Asymmetry is Benatar's attempt to navigate between these two extremes. He admits it looks like he is mixing frameworks, but he argues that **consistent** application of either framework leads to absurd moral conclusions. Therefore, the "inconsistency" is actually a more accurate map of our moral intuitions.

  ### 4. The Direction of Comparison
  You asked if it is about the direction of comparison. This is the strongest way to visualize his defense without invoking "shadow people."

  Benatar argues we must compare **Existence** against the baseline of **Non-Existence**.
  *   When we move from Non-Existence to Existence, we introduce Pain (Bad) and Pleasure (Good).
  *   When we stay at Non-Existence, we have No Pain (Good) and No Pleasure (Not Bad).

  The "trick" (according to critics) is that he evaluates the "No Pain" cell as a positive gain (Good), but evaluates the "No Pleasure" cell as a neutral zero (Not Bad).

  Benatar's resolution is that **pain is a deficit that demands correction, whereas pleasure is a surplus that does not.**
  *   Avoiding pain is satisfying a requirement (moral duty).
  *   Gaining pleasure is fulfilling a desire (moral option).

  Therefore, the absence of the requirement (pain) is a success (Good). The absence of the option (pleasure) is merely a non-event (Not Bad).

  ### Summary
  You haven't misread the scope. There *is* a tension between impersonal and person-affecting logic in the Asymmetry.
  *   **Critics say:** This is a logical contradiction that invalidates the argument.
  *   **Benatar says:** This is not a logical contradiction but a **moral distinction**. It reflects the reality that the moral urgency of preventing harm outweighs the moral urgency of providing benefit.

  The resolution is not metaphysical (non-existent people having rights); it is axiological (pain has negative intrinsic value that persists even without a subject, while pleasure's positive value is contingent on a subject). Whether you find that convincing depends on whether you accept that "good" can exist without a "beneficiary" in the case of pain, but not in the case of pleasure. Benatar bets that your intuition agrees with him there, even if your logic balks.
