  9.  (Self-Correction on Benatar's specific wording): Benatar distinguishes between (1) The presence of pain is bad, (2) The presence of pleasure is good, (3) The absence of pain is good, (4) The absence of pleasure is not bad. He argues (3) is good *simpliciter*, not *for* someone. This is the crux. I need to make sure I highlight the *simpliciter* vs. *for* distinction.

