      *   **Context:** Two friends arguing about Iterated Elimination of Dominated Strategies (IEDS) in game theory.
      *   **The Dispute:**
          *   Friend 1 (F1): Strict dominance is order-independent (safe). Weak dominance is what matters practically, order is just a wrinkle, pick a sensible order.
