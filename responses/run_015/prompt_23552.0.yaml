  2.  **Deconstruct the Claims:**

      *   **Claim 1 (F1): Eliminating *strictly* dominated strategies gives the same surviving set no matter the order.**
          *   *Fact Check:* True. This is a standard theorem in game theory. Order independence holds for IESDS (Iterated Elimination of Strictly Dominated Strategies).
          *   *Verdict:* F1 is right.

      *   **Claim 2 (F2): In *weak* dominance, the order of elimination can change which strategies survive.**
          *   *Fact Check:* True. IEWDS (Iterated Elimination of Weakly Dominated Strategies) is order-dependent. Different orders can lead to different surviving strategy profiles.
          *   *Verdict:* F2 is right.

      *   **Claim 3 (F1): Weak dominance is the concept you actually want most of the time anyway.**
          *   *Fact Check:* Debatable/Context-dependent. Weak dominance is useful (e.g., in voting, auctions, specific equilibrium refinements), but it comes with baggage (order dependence, sensitivity to trembles). Strict dominance is more robust. Saying it's what you want "most of the time" is an overstatement. Nash Equilibrium is usually the baseline, and IESDS is often a pre-processing step. IEWDS is used for refinements (like trembling-hand perfection), but it's not the default "workhorse" compared to NE or IESDS.
          *   *Verdict:* F1 is overstating/oversimplifying.

      *   **Claim 4 (F1): Order dependence in weak dominance is just a practical wrinkle, pick a sensible order and move on.**
          *   *Fact Check:* Dangerous advice. "Sensible order" isn't well-defined without further criteria (like specific equilibrium refinements). If the result changes, the prediction isn't robust. It's not just a wrinkle; it's a fundamental theoretical limitation.
