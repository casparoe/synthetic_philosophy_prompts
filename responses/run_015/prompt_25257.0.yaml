      *   Standard view: EV is undefined. Theory works fine (it says "undefined").
      *   Decision-theoretic view: We want a decision rule. If EV is undefined, we can't use EV maximization. So EV maximization fails as a *complete* action guide.
      *   The text says "expected value theory can't handle games..." This is acceptable shorthand for "EV maximization cannot yield a verdict."
      *   But the reason "since the result is just an artefact of how you describe the game" is the weak link. It's not about description; it's about the mathematical properties of the distribution.

  7.  **Final Polish:**
      *   Make sure to reference Nover & Hájek (2004) correctly.
      *   Ensure the distinction between the *series* and the *expectation* is clear.
