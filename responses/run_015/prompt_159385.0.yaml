      *   **Goal:** A 90-minute teaching plan, *not* an explanation of the argument itself.
      *   **Constraints/Requirements:**
          1.  Order of components & dependencies (specifically regarding "now"/"already").
          2.  The "Carrier Case" (Andromeda vs. Train/Lightning).
          3.  The Key Distinction (No frame-invariant present vs. Future determinacy).
          4.  Misconceptions & Timing (including the "memory" objection and the "transitivity" objection).
          5.  Omissions (what *not* to teach & why).
          6.  Closing Question (evaluating understanding vs. alarm).

  2.  **Deconstruct the Rietdijk–Putnam Argument (Mental Check):**
      *   Premise 1: Special Relativity (SR) is true (specifically, relativity of simultaneity).
      *   Premise 2: If two events are simultaneous for an observer, they are equally real (Presentism vs. Eternalism assumption).
      *   Premise 3: Reality is transitive (If A is real for B, and B is real for C, then A is real for C).
      *   Conclusion: All events in spacetime are equally real (Block Universe).
      *   *Crucial Nuance:* SR kills absolute simultaneity. It doesn't automatically kill free will, but it kills the idea that *only* the present exists.

  3.  **Drafting Section 1: Order of Components & Dependencies:**
      *   *Goal:* Prevent premature metaphysical conclusions.
      *   *Step 1: Operational Simultaneity.* Need to define "simultaneous" without metaphysics. Light signals, synchronization.
      *   *Step 2: Relativity of Simultaneity.* Show that different inertial frames disagree on *which* distant events are simultaneous.
      *   *Step 3: The "Real" Assumption.* Introduce the premise that "simultaneous = real" (or "present = real"). This is where the trap lies.
      *   *Step 4: The Chain.* Connect the frames.
      *   *Timing of "Now"/"Already":* These words must be banned until Step 3. If used earlier, students conflate "simultaneous in my frame" with "happening now in reality."
      *   *Why Distant Events?* Signal delay confuses epistemology (when do I *know*?) with ontology (when *is* it?). Must isolate the coordinate definition from light travel time.

  4.  **Drafting Section 2: The Carrier Case:**
      *   *Candidate:* Andromeda Paradox (Penrose). Two walkers passing.
      *   *Verdict:* Yes, this is the right one. Train/Lightning is good for *deriving* relativity of simultaneity, but Andromeda is better for the *metaphysical punch* because of the distance scale (small velocity difference $\times$ huge distance = huge time gap).
      *   *Must Contain:* Low relative velocity (walking), huge distance (Andromeda), clear stipulation that no light has arrived yet (epistemic isolation).
      *   *Must Avoid:* Any suggestion of *seeing* the event. No telescopes. It's about coordinate assignment, not observation.
      *   *Why not Train?* Train is usually about lightning strikes hitting the *same* location or nearby. It emphasizes signal delay too much for beginners. Andromeda emphasizes the *tilt* of the slice.

  5.  **Drafting Section 3: The Key Distinction:**
      *   *Distinction:* (A) No privileged present (Anti-Presentism) vs. (B) Future is fixed (Determinism/Fatalism).
      *   *Building it:* Don't state it upfront. Let them derive (A) from the geometry. Then ask: "Does (A) imply (B)?"
      *   *Timing:* After the argument is constructed but before the Q&A. Ideally, when discussing the conclusion.
      *   *Discovery:* Ask "Does the existence of the event on the slice mean the *outcome* was inevitable?" vs "Does it mean the event *exists* in the manifold?"
      *   *Landing:* SR kills Presentism. It does not necessarily kill Contingency (depending on interpretation of QM or laws). The "disturbance" comes from conflating existence with causal fixity.

  6.  **Drafting Section 4: Misconceptions & Timing:**
      *   *Obs vs. Ontology:* Head off immediately in Step 1 (Operational Simultaneity).
      *   *Fatalism:* Address in Section 3 (The Distinction).
      *   *Perspectival/Uninformative:* Address when discussing "Reality." If reality is frame-dependent, is it real? (Invoke transitivity).
      *   *Nothing Follows:* Address at the end (The Omissions/Caveats).
      *   *Memory Objection:* "Why don't we remember the future?" This belongs in the "Epistemology vs. Ontology" section. Just because it exists doesn't mean we have causal access.
      *   *Transitivity Objection (The Sharp One):* This is the "Reichenbach" or "Stein" objection. If reality is frame-relative, you can't chain them. *Where to raise?* In the construction of the conclusion. Don't suppress it; use it to refine the definition of "Real." If "Real" means "Real-for-X," the argument fails. If "Real" means "Real simpliciter," the argument holds but requires giving up frame-relativity of existence. *Decision:* Raise it as the "Steel Man" challenge *after* the initial conclusion, to test the strength of the "Block" view.

  7.  **Drafting Section 5: Omissions:**
      *   *Lorentz Transformations:* Math distracts from metaphysics. Reason: "We are doing ontology, not calculation."
      *   *GR/Global Slicing:* Too technical, complicates the idealization. Reason: "We are working in the idealized flat spacetime where the argument holds."
      *   *Free Will Literature:* Scope creep. Reason: "We are establishing the geometry of time, not the psychology of choice."

  8.  **Drafting Section 6: Closing Question:**
      *   *Candidate:* Preferred Foliation.
      *   *Analysis:* If we add a preferred foliation (Lorentzian Ether theory style), SR predictions stay same.
      *   *Thesis A (No frame-invariant present):* A preferred foliation *restores* a frame-invariant present. So this thesis is refuted.
      *   *Thesis B (Future is fixed):* A preferred foliation doesn't necessarily make the future fixed (could be open future on the privileged slice). But usually, the Block Universe is motivated by the *lack* of a preferred slice.
      *   *Refinement:* The question asks which thesis the addition refutes.
          *   Thesis 1: "There is no frame-invariant present." -> Adding a preferred foliation *makes* there a frame-invariant present. So Thesis 1 is refuted.
          *   Thesis 2: "Future events are as determinate as past ones." -> Adding a foliation doesn't change the determinacy of events on that foliation.
      *   *Wait, check the prompt:* "ask which of the two theses above that addition would refute."
      *   *Logic:* The Rietdijk-Putnam argument argues *for* Eternalism (Block) *from* Relativity of Simultaneity. If you add a preferred foliation, you kill Relativity of Simultaneity (ontologically, even if not empirically).
      *   *Success:* Student sees that Preferred Foliation kills the *motivation* for the Block (Thesis 1 becomes false, so the argument for Thesis 2 collapses).
      *   *Actually, let's look closer:* The prompt asks to distinguish: (1) No frame-invariant present (Anti-Presentism) vs (2) Future is fixed (Determinism).
      *   If we add a preferred foliation:
          *   (1) is False (there *is* a frame-invariant present).
          *   (2) is Unchanged (the future on that slice could still be open).
      *   So the addition refutes (1). But does it refute the *conclusion* of the session? The session concludes that (1) implies (2) (via the Argument). If (1) is false, the argument doesn't run.
      *   *Better phrasing:* The question should test if they understand that the *Block Universe* relies on the *absence* of a privileged now.
      *   *Prompt's Candidate:* "Suppose we keep every empirical prediction... but add... a physically undetectable preferred foliation, and ask which of the two theses above that addition would refute."
      *   *Answer:* It refutes Thesis 1 (No frame-invariant present). It does *not* necessarily refute Thesis 2 (Determinism), but it removes the *reason* to believe Thesis 2 based on SR.
      *   *Success:* "It refutes the claim that there is no frame-invariant present, which breaks the chain to the Block Universe."
      *   *Near Miss:* "It refutes relativity." (No, empirical predictions are intact).
      *   *Failure:* "It refutes free will." (Irrelevant).

  9.  **Review and Refine:**
      *   *Tone:* Pedagogical, precise, respectful of the instructor's expertise.
      *   *Constraint Check:* Did I answer "what goes wrong if [now/already] are allowed earlier"? Yes. Did I specify where the transitivity objection fits? Yes.
      *   *Transitivity Objection:* This is tricky. If I raise it too early, it kills the lesson. If I raise it too late, it feels like an afterthought. Best place: During the construction of the "Block." Acknowledge that "Real" must be absolute for the argument to work. If "Real" is relative, the Block dissolves. This forces the choice: Accept the Block or Accept that "Real" is frame-relative (which is weird). I will place it as the "Crucial Pivot" before the final conclusion.

