answer: |-
  Here is a plan for the ninety-minute session, structured to isolate the metaphysical payload from the physical machinery.

  ### 1. Order of Components and Dependencies

  You must enforce a strict sequence. If you violate it, the students will conflate the *definition* of simultaneity with the *metaphysics* of existence.

  **The Sequence:**
  1.  **Operational Simultaneity (15 mins):** Define simultaneity strictly via Einstein synchronization (light signals bounced between clocks). No mention of "now," "present," or "reality."
  2.  **The Relativity of that Definition (20 mins):** Show that two observers in relative motion, both following the operational definition correctly, assign different time-coordinates to the same distant event.
  3.  **The Ontological Premise (15 mins):** *Only here* do you introduce the word "real." You must stipulate the bridge principle: "If an event is simultaneous with your 'here-now,' it is part of reality."
  4.  **The Transitivity Chain (20 mins):** Connect different observers to extend the realm of the "real" into the future.
  5.  **The Metaphysical Conclusion (20 mins):** Evaluate what "real" means in this context.

  **The Dependency Logic:**
  *   **Why Simultaneity before "Now":** If you allow "now" in Step 1, students will treat it as a phenomenological given (what I experience) rather than a coordinate assignment (what my frame calculates). You need them to see simultaneity as a *convention of measurement* before you ask them to treat it as a *boundary of existence*.
  *   **Why Distant Events:** If you use local events, the disagreement collapses into signal delay (when the light hits the eye). You must use distant events to force the realization that the disagreement is about *coordinate assignment*, not light travel time. The disagreement must be about what is happening *there* while I am *here*.
  *   **When to Permit "Now" and "Already":** Ban these words until Step 3.
      *   *What goes wrong if earlier:* If a student asks in Step 1, "But is that event happening *now*?", and you answer using physics, you validate the idea that physics detects "nowness." If you answer using metaphysics, you beg the question. By banning the words, you force them to see that the physics only delivers *coordinates*. The move to "now" is the philosophical leap, not the physical calculation.

  ### 2. The Carrier Case

  **Verdict:** Use the **Andromeda-style case** (Penrose's walkers). Do not use the train-and-lightning arrangement.

  **Why Andromeda:**
  The train case is excellent for deriving the relativity of simultaneity (Step 2), but it is terrible for the metaphysical conclusion (Step 4). In the train case, the events (lightning strikes) are usually in the past of the observers by the time they are verified. The Andromeda case leverages the vast distance to turn a tiny velocity difference into a massive time discrepancy (days or weeks) regarding events that are *spacelike separated* from the observers.

  **What it Must Contain:**
  *   **Epistemic Isolation:** You must explicitly state that no light from Andromeda has reached the street. The walkers cannot *know* what is happening there. This prevents the confusion that the "reality" of the event depends on receiving information.
  *   **The Tilt:** You need a spacetime diagram showing the two "planes of simultaneity" tilting relative to each other. One slice intersects Andromeda at $t_1$ (fleet launches), the other at $t_2$ (fleet does not launch).
  *   **Low Velocity:** Emphasize they are walking. This highlights that you don't need high-speed travel to break the "present"; you just need distance.

  **What it Must Avoid:**
  *   **Observation:** Do not say "one walker *sees* the launch." Say "one walker's frame *assigns* the launch to their present."
  *   **Causal Influence:** Ensure they understand the walkers cannot signal Andromeda to change the outcome. This prevents the thought that the "future" is fixed because we can't change it; it is fixed (in the argument) because it *exists*.

  ### 3. The Key Distinction

  You want them to distinguish:
  *   **Thesis A (Geometric):** There is no frame-invariant present (Anti-Presentism).
  *   **Thesis B (Modal):** Future events are as determinate as past ones (Determinism/Eternalism).

  **How to Build It:**
  Do not announce this distinction at the start. Build it as a "fork in the road" at Step 5 (The Metaphysical Conclusion).

  1.  Run the argument to conclude that the Andromedan fleet launch is "real" for the Earth walker.
  2.  Ask: "Does 'real' mean 'exists in the spacetime manifold' or 'causally settled'?"
  3.  **The Discovery Moment:** Guide them to see that the Rietdijk–Putnam argument proves Thesis A (your 'present' is not the only 'present'). It only proves Thesis B if you add the hidden premise that "To exist is to be determinate."
  4.  **Why Thesis B Disturbs Them:** Thesis A is just geometry; Thesis B kills the openness of the future.
  5.  **Timing:** Draw this distinction *after* the transitivity chain is complete but *before* the final Q&A. Ask them: "Can we accept the Block Universe (all events exist) without accepting Fatalism (all events are causally necessitated)?" This allows them to see that the argument settles ontology, not modality.

  ### 4. Misconceptions and Timing

  Here is where to head off the specific errors you anticipate.

  1.  **"Disagreement about observation" (Epistemic Confusion):**
      *   *When:* Step 1 (Operational Simultaneity).
      *   *Fix:* Explicitly distinguish "seeing" (light hitting retina) from "simultaneity" (calculated coordinate). Write "Observation $\neq$ Simultaneity" on the board.
  2.  **"Merely Perspectival" (Relativism about Reality):**
      *   *When:* Step 3 (Ontological Premise).
      *   *Fix:* Ask: "If I say the table is to my left, that is perspectival. If I say the table exists, is that perspectival?" Force them to see that if existence is frame-relative, the word "exists" loses its absolute meaning. This sets up the need for the Transitivity Chain.
  3.  **"Why don't we remember the future?" (The Memory Objection):**
      *   *When:* Step 5 (The Distinction).
      *   *Fix:* Categorize this under Epistemology vs. Ontology. "We do not remember the future for the same reason we cannot see behind our heads: causal access, not existence." This belongs in the discussion of why Thesis B (Determinism) does not follow from Thesis A (Existence).
  4.  **"Fatalism about deliberation" (The Panic Objection):**
      *   *When:* Step 5 (The Distinction).
      *   *Fix:* Separate *truth* from *necessity*. That a proposition about the future is true (or exists) does not mean it is true *by necessity*. (This is the classic Aristotelian sea-battle move).
  5.  **"Nothing follows" (The Under-reaction):**
      *   *When:* Closing.
      *   *Fix:* Acknowledge that Presentism can be saved (by denying the Ontological Premise), but note the cost: one must claim that physics describes reality *incompletely*.
  6.  **"Reality is not transitive" (The Sharp Objection):**
      *   *When:* Step 4 (The Transitivity Chain).
      *   *How to Raise It:* Do not wait for a student. Introduce it yourself as the "Steel Man" challenge. "A critic might say: Event A is real for Observer 1. Observer 1 is real for Observer 2. But 'real for' is not transitive. So A is not necessarily real for Observer 2."
      *   *How to Use It:* This sharpens the argument. It forces the class to choose: Either accept that "Real" means "Real simpliciter" (which validates the chain and the Block Universe) or accept that "Real" is a relation (which saves Presentism but makes existence frame-dependent). This prevents the session ending in a shrug; it ends in a precise metaphysical choice.

  ### 5. Omissions

  Be explicit about what you are leaving out. This protects you from "gotcha" questions and keeps the focus on metaphysics.

  1.  **Lorentz Transformations:** "We are analyzing the *structure* of time, not calculating coordinates. The geometry matters, the algebra does not."
  2.  **General Relativity/Global Slicing:** "We are working in Special Relativity (flat spacetime). In curved spacetime, global slices may not exist, but that complicates the ideal case we need to understand first."
  3.  **Free Will Literature:** "We are establishing whether the future *exists*, not whether agents *cause* it. That is a separate debate about modality, not ontology."

  ### 6. The Closing Question

  **Your Candidate:** "Suppose we keep every empirical prediction of special relativity intact but add to the world a physically undetectable preferred foliation, and ask which of the two theses above that addition would refute."

  **Evaluation:**
  This is an excellent discriminator. It tests whether they understand that the argument relies on the *absence* of a privileged present, not on the empirical data itself.

  *   **Success:** The student identifies that this addition refutes **Thesis A (No frame-invariant present)**. They explain that if a preferred foliation exists, there *is* a frame-invariant present, so the Rietdijk–Putnam argument (which relies on all frames being equal) cannot get off the ground. They should also note that Thesis B (Determinacy) is not automatically refuted, but the *reason* for believing it (the Block Universe argument) is removed.
  *   **Near-Miss:** The student says it refutes Special Relativity. (Correction: Empirical predictions are intact; it refutes the *interpretation* of SR). Or they say it refutes Thesis B (Determinism) directly, missing that a preferred slice could still contain a determined future.
  *   **Failure:** The student says it changes nothing, or that it refutes the possibility of the walkers disagreeing. (Correction: The walkers would still disagree on *coordinates*, but only one would match the 'true' foliation).

  **Why this works:** It forces them to see that the "Block Universe" is not a direct empirical finding, but a metaphysical inference drawn from the *lack* of a preferred frame. If you restore the preferred frame (even undetectably), you restore the possibility of a moving "Now," and the argument collapses. This confirms they understand the dependency of the metaphysics on the geometry.
