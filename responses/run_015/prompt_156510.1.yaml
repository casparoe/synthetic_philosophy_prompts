prompt: |-
  I sit on the clinical ethics review panel of our institute's neuropsychiatric division, and we must recommend whether to approve a pilot protocol for severe, treatment-resistant craving disorders. The investigators propose inducing a state they call "tranquil baseline"—not mere remission, but near-complete abolition of anticipatory craving and aversive affect—achieved through combined neuromodulation and pharmacology, with the explicit ethical justification that only the absence of craving and suffering carries moral weight, while positive affect, attachment, and purpose are ethically neutral. Half the panel treats this as rigorous harm-reduction; half sees it as an illegitimate substitution of well-being metrics and a serious autonomy problem, since reaching the desired state may leave patients unable to value the goals they held before. Draft the panel's written recommendation—approve with conditions, reject, or approve within a restricted scope and monitoring framework—with concrete criteria, a clear timeline, and an honest account of the strongest consideration against your position. In doing so, please separate what is settled about well-being, autonomy, and informed consent from what remains genuinely contested among informed parties, and do not present any contested ethical or empirical claim as the consensus view.
reasoning: |-
  Here's a thinking process that leads to the recommended response:

  1.  **Analyze the Request:**
      *   **Role:** Member of a clinical ethics review panel (neuropsychiatric division).
      *   **Task:** Draft the panel's written recommendation regarding a pilot protocol for severe, treatment-resistant craving disorders.
      *   **Protocol Details:** Induces "tranquil baseline" (abolition of anticipatory craving/aversive affect) via neuromodulation + pharmacology.
      *   **Investigators' Ethical Justification:** Only absence of craving/suffering has moral weight; positive affect/attachment/purpose are ethically neutral.
      *   **Panel Split:** 50% see it as harm reduction; 50% see it as illegitimate substitution of well-being metrics + autonomy risk (patients unable to value prior goals).
      *   **Required Output:** A written recommendation (Approve with conditions, Reject, or Approve within restricted scope/monitoring). Must include concrete criteria, timeline, and an honest account of the strongest consideration against the position.
      *   **Constraint:** Separate settled ethical/empirical claims from contested ones. Do not present contested claims as consensus.

  2.  **Determine the Recommendation:**
      *   *Option A: Approve.* Too risky given the 50/50 split and the profound autonomy concerns regarding identity and valuing.
      *   *Option B: Reject.* Possible, but "severe, treatment-resistant" implies high unmet need. A flat rejection might stifle innovation for desperate patients.
      *   *Option C: Approve within Restricted Scope and Monitoring Framework.* This is the most ethically defensible middle ground. It acknowledges the potential benefit (harm reduction) while mitigating the risks (autonomy, identity, definition of well-being). It allows for data collection to resolve empirical uncertainties.
      *   *Decision:* **Approve within a Restricted Scope and Monitoring Framework.** This allows the research to proceed but builds in safeguards against the specific ethical risks identified by the dissenting half of the panel.

  3.  **Structure the Document:**
      *   **Header:** Standard IRB/Ethics Panel format.
      *   **Executive Summary:** The decision.
      *   **Background:** Brief summary of the protocol and the ethical tension.
      *   **Settled vs. Contested Ethical/Empirical Landscape:** Explicitly distinguishing consensus from debate (crucial constraint).
      *   **Recommendation & Conditions:** The core directives (inclusion criteria, monitoring, consent process).
      *   **Timeline:** Review points.
      *   **Dissenting/Majority Counter-Consideration:** The "honest account of the strongest consideration against your position."

  4.  **Drafting - Section by Section:**

      *   **Header:** Keep it formal.
      *   **Decision:** Restricted Approval.
      *   **Settled vs. Contested:** This needs careful phrasing.
          *   *Settled:* Patients have decision-making capacity *unless* impaired by the disorder/treatment. Informed consent is mandatory. Suffering is bad.
          *   *Contested:* Is the "tranquil baseline" a net good? Does abolition of craving undermine autonomy/identity? Is positive affect ethically neutral? (The investigators claim it is; the panel is split).
      *   **Conditions:**
          *   *Inclusion:* Only severe, truly treatment-resistant cases (last resort).
          *   *Consent:* Longitudinal consent (consent before, during, and potentially after). Advance directives regarding reversal.
          *   *Monitoring:* Specific metrics beyond "craving absence." Need to measure agency, social connection, and ability to pursue values.
          *   *Reversibility:* Must have an off-switch or tapering plan.
      *   **Timeline:** Short pilot (e.g., 12 months) with interim review at 6 months.
      *   **Counter-Consideration:** If I recommend approval (restricted), the strongest argument *against* is that the intervention fundamentally alters the self in a way that invalidates the original consent, rendering the "restricted" safeguards illusory. If I recommend rejection, the argument is denying hope to the desperate. Since I chose Restricted Approval, the counter-argument must focus on the risk that the safeguards won't work if the "tranquil baseline" fundamentally changes the capacity to value.

  5.  **Refining the Ethical Distinctions (Crucial Step):**
      *   I must ensure I don't say "We agree that positive affect is neutral" or "We agree it isn't." I must state: "The panel notes a fundamental disagreement on whether positive affect is ethically neutral."
      *   I must ensure I don't claim empirical certainty where there is none (e.g., "This will definitely change personality"). Instead: "There is empirical uncertainty regarding the long-term impact on value formation."

  6.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Formal, deliberative, nuanced.
      *   *Key Phrase:* "Epistemic humility."
      *   *Addressing the Investigators' Claim:* Explicitly note that the protocol's justification (suffering is the only moral weight) is a *contested philosophical premise*, not an established medical fact.
      *   *Autonomy:* Address the "ability to value" concern. Use the concept of "Ulysses contracts" or pre-commitment.

  7.  **Final Review against Constraints:**
      *   Did I separate settled vs. contested? Yes.
      *   Did I present contested claims as consensus? No.
      *   Is there a concrete timeline? Yes.
      *   Is there an honest account of the strongest counter-argument? Yes.
      *   Is the recommendation clear? Yes.

  8.  **Final Polish:** Check for clarity and ensure the distinction between the "Harm Reduction" view and the "Autonomy/Identity" view is preserved without resolving it artificially. The recommendation should manage the *risk* of the disagreement, not solve the disagreement.

  *(Self-Correction during drafting)*: Initially, I might be tempted to say "We require measurement of happiness." But that validates the investigators' metric. Instead, I should require measurement of *functional agency* and *value congruence* to address the autonomy concern. I need to make sure the "Strongest Consideration Against" section is robust. If the recommendation is "Restricted Approval," the counter-argument is that *any* approval legitimizes a potentially harmful conception of well-being.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **INSTITUTE FOR NEUROPSYCHIATRY**
  **CLINICAL ETHICS REVIEW PANEL (CERP)**
  **MEMORANDUM OF RECOMMENDATION**

  **TO:** Principal Investigators, Protocol 88-B (Craving Abolition Pilot)
  **FROM:** Clinical Ethics Review Panel
  **DATE:** October 26, 2023
  **SUBJECT:** Ethical Determination and Conditions of Approval for Protocol 88-B

  ### I. DECISION
  **Status:** **Approved within Restricted Scope and Monitoring Framework.**

  The Panel does not grant blanket approval. Authorization is contingent upon strict adherence to the inclusion criteria, informed consent modifications, and longitudinal monitoring metrics detailed in Section IV. This approval is valid for a pilot period of **12 months**, subject to an interim ethical review at Month 6.

  ### II. ETHICAL LANDSCAPE: SETTLED VS. CONTESTED
  In reaching this determination, the Panel explicitly distinguishes between ethical/empirical claims that are settled within the biomedical research community and those that remain genuinely contested among informed parties. This distinction is required to ensure the protocol does not treat a philosophical premise as a medical fact.

  **A. Settled Consensus**
  1.  **Obligation to Alleviate Suffering:** There is consensus that severe, treatment-resistant craving constitutes a pathological burden and that clinicians have a prima facie obligation to offer relief where safe and effective options exist.
  2.  **Informed Consent Requirements:** Valid consent requires disclosure of risks, benefits, and alternatives. Participants must possess decision-making capacity at the time of consent.
  3.  **Risk of Impaired Capacity:** It is settled that neuropsychiatric interventions can transiently or permanently alter decision-making capacity, requiring ongoing assessment.

  **B. Genuinely Contested Claims**
  The Panel notes that the Investigators' ethical justification relies on premises that are **not** consensus views and are actively debated in bioethics and philosophy of mind:
  1.  **The Moral Weight of Affect:** The Investigators posit that only the absence of craving/suffering carries moral weight, while positive affect, attachment, and purpose are ethically neutral. *The Panel is divided on this claim.* Half the Panel views this as a valid harm-reduction metric; the other half views this as an illegitimate narrowing of well-being that ignores the constitutive role of desire and attachment in human agency.
  2.  **Autonomy and Value Formation:** It is contested whether the abolition of anticipatory craving undermines autonomy. One view holds that removing compulsive drives enhances freedom; the opposing view holds that craving is inextricably linked to the capacity to value goals, and its abolition may render patients unable to pursue the life plans they held prior to intervention.
  3.  **Identity Continuity:** There is no empirical consensus on whether inducing a "tranquil baseline" constitutes a therapeutic cure or a fundamental alteration of personal identity that invalidates prior preferences.

  ### III. RATIONALE FOR RESTRICTED APPROVAL
  The Panel authorizes this pilot not as an endorsement of the Investigators' ethical framework, but as a mechanism to gather empirical data necessary to resolve the contested claims listed above. Given the severity of the target condition (treatment-resistant craving disorders), a flat rejection would deny potential relief to a desperate population. However, given the autonomy risks, unconditional approval would be negligent.

  Therefore, the protocol must proceed under a framework that protects patients *even if* the dissenting view of the Panel proves correct (i.e., even if the "tranquil baseline" undermines the capacity to value).

  ### IV. CONDITIONS OF APPROVAL

  **1. Inclusion Criteria (The "Last Resort" Standard)**
  *   Participants must demonstrate failure of at least three distinct, evidence-based treatment modalities over a minimum of 24 months.
  *   Participants must document a history of significant functional impairment directly attributable to craving (e.g., loss of employment, housing, or severe relational breakdown).
  *   *Rationale:* To ensure the risk-benefit ratio is skewed toward necessity rather than convenience.

  **2. Modified Informed Consent Process (The "Ulysses" Clause)**
  *   Consent must be obtained in three stages: (1) Pre-screening, (2) Pre-induction, and (3) Post-induction (once the "tranquil baseline" is achieved).
  *   **Pre-Commitment Directive:** Prior to induction, participants must execute a directive specifying conditions under which they would request reversal or cessation of the protocol, *specifically accounting for the possibility that their valuation of these conditions may change during the induced state.*
  *   **Proxy Input:** A designated proxy (family member or long-term caregiver) must be interviewed to establish a baseline of the participant's core values and life goals to assist in monitoring value-congruence post-intervention.

  **3. Monitoring Metrics (Beyond Craving Abolition)**
  The Investigators' proposed primary outcome measure (absence of craving) is insufficient for ethical clearance. The following secondary endpoints are mandatory:
  *   **Agency & Valuation Scale:** Monthly assessment of the patient's ability to formulate, pursue, and derive meaning from long-term goals.
  *   **Relational Connectivity:** Measurement of social engagement and attachment behaviors.
  *   **Value Congruence:** Comparison of post-intervention goals with pre-intervention stated values (as documented by the participant and proxy).
  *   *Rationale:* To detect if the "tranquil baseline" results in apathy, loss of purpose, or identity fragmentation, even if suffering is reduced.

  **4. Reversibility and Exit Strategy**
  *   The protocol must demonstrate a viable tapering or reversal mechanism.
  *   If monitoring indicates a loss of capacity to value (as defined by the Agency & Valuation Scale), the intervention must be paused or reversed, regardless of the patient's current expressed satisfaction, pending ethical review.

  ### V. TIMELINE AND REVIEW
  *   **Month 0-6:** Enrollment limited to 5 participants. Intensive weekly monitoring.
  *   **Month 6:** **Mandatory Interim Ethical Review.** The Panel will review data on Value Congruence and Agency. If significant divergence from pre-treatment values is observed without patient distress, the Panel will reconsider the definition of harm.
  *   **Month 12:** Final pilot review. Decision on expansion, modification, or termination of the protocol.

  ### VI. STRONGEST CONSIDERATION AGAINST THIS POSITION
  **The Autonomy Paradox**

  In the spirit of full ethical disclosure, the Panel records the following objection, advanced by the dissenting minority, which constitutes the strongest argument against this Restricted Approval:

  *The safeguards outlined above may be illusory.* If the "tranquil baseline" fundamentally alters the neurobiological substrate required to *value* autonomy, agency, or prior commitments, then the patient in the induced state cannot meaningfully consent to continue, nor can they meaningfully invoke the "Ulysses Clause" to stop. By approving this protocol, even with restrictions, the Institute may be facilitating a procedure that creates subjects who are content but lack the capacity to care about their own liberty. The dissenting view holds that because we cannot empirically guarantee the preservation of the "capacity to value," the only ethically defensible position is rejection until the mechanism of value-formation is better understood. This recommendation proceeds despite this risk, prioritizing the relief of immediate, severe suffering, but acknowledges that if the dissenting view is empirically correct, the monitoring framework may fail to protect the patient's deeper interests.

  ***

  **Signed,**

  **Chair, Clinical Ethics Review Panel**
  **Institute for Neuropsychiatry**
