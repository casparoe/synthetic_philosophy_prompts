      *   *"Faking":* As noted, "faking" implies a faker. Hofstadter would say it's "empty simulation." "Faking" anthropomorphizes the error.

  4.  **Address Reporting Questions:**

      *   *Principle vs. Scale:* Does it follow? It requires the premise that *grounding* (embodied experience) is necessary for meaning. Hofstadter believes this (influenced by phenomenology and cognitive science of embodiment). Without that premise, scale *could* theoretically produce emergent semantics (the connectionist counter-argument). Hofstadter is entitled to the premise based on his theory of cognition (analogy requires experience), but it is a philosophical stance, not an empirical fact proven by the 1997 text alone.
