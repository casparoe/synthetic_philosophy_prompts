  ### Decomposition

  The headline credence $P(H)$ is derived by calculating the probability that **Origin Essentialism ($E$) is False**. $P(H) = 1 - P(E)$.
  $P(E)$ is the probability that four independent metaphysical conditions all hold. If any one fails, strict essentialism collapses, and $H$ becomes possible.

  **Sub-question 1: Is de re modality determinate?**
  *   **Probability ($P_D$): 0.90**
  *   **Justification:** It is highly likely that there is a fact of the matter about whether *A* exists in a world, rather than identity being merely a matter of linguistic stipulation.
  *   **Role:** If identity is stipulative ($0.10$), $H$ is trivially true by convention; this term anchors the debate in realism.

  **Sub-question 2: Is A essentially a human organism beginning at fusion?**
  *   **Probability ($P_O$): 0.90**
  *   **Justification:** The biological evidence strongly supports the view that the human animal begins at zygote formation, rather than later (e.g., at sentience or birth).
  *   **Role:** If A were a psychological continuant ($0.10$), gamete origin would be irrelevant; this term locks identity to the biological start.

  **Sub-question 3: Is the essential property the identity of the cells or the genetic code?**
  *   **Probability ($P_G$): 0.80**
