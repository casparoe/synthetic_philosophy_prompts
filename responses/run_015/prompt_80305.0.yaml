      *   *Conclusion:* Reiterate that a society without meritocratic recognition denies meaning to effort, harming everyone, especially the less talented.

  4.  **Drafting - Attempt 1 (Mental Outline):**
      Your friend is right that luck dictates raw output, so huge pay gaps based purely on output are hard to justify as "owed." This hits reward-desert. But you're right that praise-desert survives. When we praise someone, we aren't saying "you own this money," we're saying "your effort mattered." Your friend will say praise is just status, which is also a reward subject to luck. But this conflates recognition with power. Status as honor is different from status as purchasing power. Meritocracy works because it tells us that effort connects to outcome. If we remove that, effort feels pointless. Even the less talented need to know their specific achievements are seen. So meritocracy isn't about paying the lucky; it's about honoring the striving.

