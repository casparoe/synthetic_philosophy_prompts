      Meritocracy's deeper justification is not that the talented are owed riches, but that society owes everyone a structure where achievement is recognized as achievement. When we praise effort or skill, we acknowledge agency within constraints. Luck determines the ceiling, but effort determines where one lands within it. Recognizing this distinction is vital for human dignity.

