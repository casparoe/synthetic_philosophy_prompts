prompt: |-
  I just spent the better part of an evening arguing with a friend about whether a meritocratic pay system is defensible, and I walked away thinking he had the better of me in a way I still can't quite articulate. His core move was the familiar one: most of the difference in people's abilities is a product of luck — the genetic and environmental lottery — so no one really "deserves" a large pay gap, and the meritocratic order is just a respectable way of distributing luck. I have been trying to answer that the objection conflates two different jobs the word "desert" does. On the one hand, there is desert as a reason for reward: a claim on a share of the goods, a bonus that someone is owed. On the other, there is desert as a reason for praise: a reason to regard an achievement as admirable and to recognize the person who brought it off. My position, which I want you to argue for, is that the luck objection has real force against reward-desert but no force at all against praise-desert, and that meritocracy's deeper justification is the second. A meritocratic system is not ultimately justified by the claim that the talented are owed their bonuses; it is justified by the claim that it is a society that recognizes achievement as achievement, and that such recognition is a good we owe to everyone, including the less talented. Even if my friend is right that the bonuses are, strictly speaking, a matter of luck, the meritocratic order still stands, because the desert it actually appeals to is desert for praise, and luck cannot undermine that. In doing so, please engage with the strongest version of his reply, which is that praise is just a cheap substitute for reward: that once the bonuses are stripped away, praise is either empty, or it is itself a kind of reward, a good of status, and so it is vulnerable to exactly the same luck objection. Keep the whole thing to at most 450 words.
