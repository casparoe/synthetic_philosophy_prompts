answer: |-
  In 1889, Valiere paints *The Grey Hour* but crates it immediately; in 1890, he paints an authorized replica using the same materials and hand for a patron; in 1925, a restorer creates a third version using period materials so precise it passes every scientific test, and this version is sold as the 1889 original. For sixty years, the 1925 version hangs in the National Gallery, reproduced in textbooks and directly influencing the Abstract Expressionists, while the 1889 original remains unseen in a vault and the 1890 replica stays in a private collection. Now displayed together, all three are empirically indistinguishable in pigment, canvas, and brushwork, yet the 1925 forgery holds the entire history of the work's reception, the 1889 original holds the status of first creation, and the 1890 replica holds the artist's touch without the prestige of either priority or influence.

  (a) The aesthetic supervenience theorist argues that since value depends entirely on experienceable properties, and no test can distinguish the three, all three possess identical aesthetic value. The history of the object is extrinsic noise; the viewer gets the same reward from the forgery as the original because the visual experience is identical.

  (b) The authenticity theorist argues that value resides in the artist's hand, ranking the 1889 original and 1890 replica above the 1925 forgery. However, this lands in an awkward spot regarding the authorized replica: if the hand is the sole source of value, the 1890 replica must be equal to the 1889 original, contradicting the deep intuition that the "first" instantiation holds a unique ontological privilege. To save the theory, the defender must smuggle in a "priority" clause that isn't about the hand itself, admitting that physical genesis isn't enough.

  (c) The causal-historical theorist argues that value is determined by the object's role in the tradition. Since the 1925 forgery was the only version seen by critics and painters who shaped modernism, it is the causal seed of the movement; the 1889 original was a nullity. Consequently, this view ranks the forgery first, as it alone did the work of art in the world, while the original and replica are historically inert duplicates.

  The single feature doing the work is the **causal quarantine of the authentic objects**. If you delete this feature—allowing the 1889 original to be the publicly seen version—the causal theorist's verdict collapses, and the forgery reverts to being a mere parasite. The defender of view (b) will claim I definitely rigged it by defining "artistic value" as "historical impact" rather than "ontological status," arguing that I've changed the subject from what the object *is* to what the object *did*, thereby begging the question against the very notion of authenticity they seek to defend.
