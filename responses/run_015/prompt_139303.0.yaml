  Your identification of the two rules is correct: the first maximises the product of gains (Nash), and the second equalises the fraction of maximum possible gains achieved by each party (Kalai–Smorodinsky). No obvious third standard rule fits the record; for instance, the egalitarian solution (maximising the minimum gain) would have yielded (7.5, 7.5) in Case 1, and the utilitarian solution (maximising the sum) would have selected a corner solution.

  In the new case, the feasible frontier comprises two segments: from (0, 10) to (4, 9) defined by $y = 10 - 0.25x$, and from (4, 9) to (10, 0) defined by $y = 15 - 1.5x$. Under the Nash rule, we maximise $xy$. On the first segment, the product increases throughout the range, peaking at the kink (4, 9) with a value of 36. On the second segment, maximising $x(15 - 1.5x)$ yields a stationary point at $x = 5$, giving $y = 7.5$ and a product of 37.5. Since 37.5 exceeds 36, the Nash award is (5, 7.5). Under the Kalai–Smorodinsky rule, we draw a line from the disagreement point (0, 0) to the utopia point (10, 10), which is $y = x$. Intersecting this with the second segment ($x = 15 - 1.5x$) gives $2.5x = 15$, so $x = 6$ and $y = 6$. This lies within the valid range for that segment, so the Kalai–Smorodinsky award is (6, 6).

  Although the note in Case 1 sounds like an appeal to Independence of Irrelevant Alternatives (which favours Nash), it is factually consistent with Kalai–Smorodinsky because removing the option (9, 3) did not alter the utopia point or the solution in that specific instance. However, her public lecture endorses Monotonicity, a property the Nash rule violates but Kalai–Smorodinsky satisfies. Since she cannot logically adhere to Monotonicity while using the Nash rule, but can adhere to it while using Kalai–Smorodinsky (treating the Case 1 note as an observation rather than an axiom), the lecture is the decisive clue.

  Your proposed separating case is indeed sharp. By striking out all options where A receives more than 8, the utopia point shifts from (10, 10) to (8, 10). The Nash solution remains (5, 7.5) because the removed options were irrelevant to the product maximum (satisfying Independence of Irrelevant Alternatives). The Kalai–Smorodinsky solution, however, shifts because the ray from the origin now targets (8, 10); intersecting $y = 1.25x$ with the frontier $y = 15 - 1.5x$ yields $2.75x = 15$, or approximately (5.45, 6.82). This cleanly separates the rules by testing whether the arbiter's choice depends on the removed alternatives.
