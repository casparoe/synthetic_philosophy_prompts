answer: |-
  Inference to the best explanation survives only if we treat the mirror test not as a heuristic, but as a constitutive rule that disqualifies unfalsifiable narratives from counting as explanations at all.

  Your roommate is partially correct that Bayesian reasoning underpins our intuition, but she is wrong that a simplicity prior solves the problem. A conspiracy theory can be incredibly simple ("They lie"). The issue isn't the number of moving parts; it's the direction of fit. In your incident reviews, a "rushed deploy" explains a break only if rushed deploys usually break. If rushed deploys usually succeed, citing rush requires independent evidence that this specific rush was chaotic. The conspiracy theorist reverses this: the clean water is evidence of corruption, and dirty water would also be evidence of corruption. This isn't Bayesian updating; it's immune system behavior. A hypothesis that assigns high probability to every possible outcome assigns high probability to nothing.

  This is where the philosophical worry about "loveliness" becomes critical. Proponents of Inference to the Best Explanation (IBE) argue we select the "loveliest" hypothesis, often equating loveliness with unification or scope. This is precisely where the mechanism breaks. A conspiracy theory is often lovelier than the truth because it unifies disparate events into a single intentional narrative. It absorbs counter-examples effortlessly, making the world feel coherent. If loveliness is measured by coverage, the conspiracy wins. But if loveliness is measured by constraint, it loses. A truly lovely explanation is one that sticks its neck out; it forbids certain outcomes. The brother-in-law's theory forbids nothing. Therefore, we must redefine loveliness to include fragility. An explanation that cannot be wrong is not lovely; it is empty.

  This redefinition allows us to draw the exact line between your logging artifact and the corrupt lab. The distinction lies in independent testability. When you blame a dashboard spike on a logging error, you are positing an auxiliary hypothesis that carries its own empirical weight. You can check the logger's health metrics, compare it to other services, or reproduce the bug. The auxiliary hypothesis is risky; it could be wrong independently of the main theory. If the logger was fine, your explanation fails. The brother-in-law's auxiliary hypothesis—that the council, the lab, and the reporter are all complicit—exists solely to protect the core claim. It borrows credibility from the theory it saves rather than lending credibility to it. This is the difference between correction and degeneration. Good absorption pays a cost; bad absorption prints money.

  Consequently, the mirror test must be folded into what we mean by "best." An explanation that fits both $E$ and not-$E$ has a likelihood ratio of 1. It provides zero information gain. In Bayesian terms, it does not move the needle. If IBE is about selecting the hypothesis that makes the evidence most probable, a hypothesis that makes *all* evidence equally probable is not a candidate. It is a tautology dressed as a theory. You mentioned van Fraassen's worry that we only infer the best of a bad lot; the mirror test sharpens this by noting that sometimes the lot contains items that aren't hypotheses at all. They are shields.

  IBE survives, but only if we stop treating explanatory power as a measure of how much data a theory can absorb. It is a measure of how much data a theory could have forbidden but didn't. The mirror test is the tool that measures this fragility. Without it, IBE collapses into storytelling, where the winner is merely the most comforting narrative, not the most truthful one. You were right to challenge your brother-in-law, not because his story was complex, but because it was safe. A theory that survives every attack isn't strong; it's invisible. To explain the world, you must risk being contradicted by it.
