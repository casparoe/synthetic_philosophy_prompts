      Your roommate is right that Bayesian reasoning underpins our intuition, but she is wrong that a simplicity prior solves the problem. A conspiracy theory can be incredibly simple ("They lie"). The issue isn't the number of moving parts; it's the direction of fit. In your incident reviews, a "rushed deploy" explains a break only if rushed deploys usually break. If rushed deploys usually succeed, citing rush requires independent evidence that this specific rush was chaotic. The conspiracy theorist reverses this: the clean water is evidence of corruption, and dirty water would also be evidence of corruption. This isn't Bayesian updating; it's immune system behavior.

