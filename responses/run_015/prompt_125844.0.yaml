answer: |-
  # The Incommensurability Protocol (IP-90)
  **For Municipal Ethics Review Boards**

  **Purpose:** To guide decision-making when proposals involve conflicting values that cannot be reduced to a single metric (e.g., dollars, utility points).
  **Time Limit:** 90 Minutes.
  **Participants:** Board Chair, Planning Staff, Legal Counsel, Board Members.
  **Constraint:** No quantitative aggregation of values is permitted.

  ---

  ## Stage 1: Domain Identification (15 Minutes)
  **Goal:** Map the normative landscape without reducing distinct values to one another.

  1.  **List the Goods:** Identify every distinct value domain positively or negatively affected by the proposal.
      *   *Examples:* Ecological resilience, cultural continuity, distributive justice, procedural fairness, intergenerational equity.
  2.  **Anti-Reduction Check:** For each domain listed, ask: "If we removed this value, would the remaining list fully capture what is lost or gained?"
      *   *Test:* If "Cultural Continuity" is listed only as "Local Revenue," mark for audit.
      *   *Test:* If "Ecological Resilience" is listed only as "Flood Insurance Savings," mark for audit.

  **[JUDGMENT FLAG 1]:** If any board member believes a value domain has been omitted or reduced (e.g., treating a sacred site as a zoning variance), the discussion must pause. The missing/reduced domain must be added to the official record before proceeding.
  **Written Sign-off:** A finalized "Domain Map" listing all distinct values at stake, signed by the Chair.

  ---

  ## Stage 2: Translation Audit (20 Minutes)
  **Goal:** Detect "Value Leakage" where the language of decision-making distorts the nature of the value.

  1.  **Review Decision Terms:** Examine how each domain from Stage 1 is described in the staff report or proposal.
  2.  **Leakage Indicators:** Look for the following distortions:
      *   *Commodification:* Is a non-market good (e.g., dignity, sanctity) described primarily in terms of cost or compensation?
      *   *Deferral:* Is an immediate harm described as "temporary" without a guaranteed remediation plan?
      *   *Aggregation:* Are distinct harms to different groups summed into a total "impact number"?
  3.  **Correction:** If leakage is found, rewrite the description of the impact to restore its normative force (e.g., change "loss of property value" to "disruption of multigenerational community").

  **[JUDGMENT FLAG 2]:** If the board determines that the proposal's language fundamentally misrepresents a value domain such that it cannot be corrected without rewriting the entire proposal, the proposal must be **Sent Back** to the applicant for revision.
  **Written Sign-off:** A "Translation Audit Statement" confirming that descriptions match the normative reality of the domains.

  ---

  ## Stage 3: Dominance and Critical-Threshold Screen (15 Minutes)
  **Goal:** Eliminate clearly inferior options or those causing unacceptable harm.

  1.  **Dominance Test:** Is there an alternative option that is equal or better in *every* domain identified in Stage 1?
      *   *If Yes:* Select that option. **Stop.**
      *   *If No:* Proceed to Step 2.
  2.  **Critical-Threshold Test:** Does any option cause severe, irreversible harm in a single domain (e.g., extinction of a species, erasure of a historic landmark, destitution of a vulnerable group)?
      *   *If Yes:* That option is **Presumptively Rejected**.
      *   *Exception:* It may proceed only if the board invokes the Hard-Choice Protocol (Stage 5).

  **[JUDGMENT FLAG 3]:** Determining what counts as "irreversible" or "severe" is not scientific; it is normative. The board must explicitly define the threshold.
  **Written Sign-off:** A "Threshold Declaration" stating which harms are considered veto-level and why.

  ---

  ## Stage 4: Comparative Judgment & Structural Parity (25 Minutes)
  **Goal:** Choose between remaining options without summing values.

  1.  **Reason Articulation:** For each remaining option, articulate the primary reason for selection.
      *   *Constraint:* You cannot say "Option A is better overall." You must say "Option A is preferred *because* it prioritizes Domain X in this specific context."
  2.  **Parity Check:** Do the reasons for Option A and Option B feel equally strong but fundamentally different in kind (e.g., "Justice for the poor" vs. "Safety for the future")?
      *   *If One Reason Clearly Outweighs:* Select that option. Document the contextual reason. **Stop.**
      *   *If Parity Exists:* The values are "on a par." Neither is better, but they are not equal. A choice must still be made.
  3.  **Contextual Priority Commitment:** If Parity exists, the board must draft a commitment statement: "In this specific jurisdiction and current historical moment, we prioritize Domain X over Domain Y, subject to review in [Timeframe]."

  **[JUDGMENT FLAG 4]:** Declaring "Parity" is a judgment that reason does not dictate a single winner. This requires a specific written justification for why the context tips the scale, rather than a calculation.
  **Written Sign-off:** A "Priority Commitment Record" detailing which domain is prioritized and the specific contextual factors (e.g., current housing crisis, recent flood event) justifying that priority.

  ---

  ## Stage 5: Hard-Choice Protocol (15 Minutes)
  **Goal:** Formalize the moral cost when a choice causes irreplaceable harm.

  1.  **Trigger:** This stage is required if the selected option (from Stage 3 or 4) causes irreversible harm to a protected domain (identified in Stage 3) and no permissible alternative exists.
  2.  **Acknowledgement of Remainder:** The board must explicitly state that the harm is *not* cancelled out by the benefits. The loss remains a moral negative.
  3.  **Mitigation Pledge:** Specify what will be done to honor the lost value (e.g., memorialization, ongoing monitoring, compensation that does not claim to "make whole").
  4.  **Signed Record:** All voting members must sign a "Hard Choice Record."

  **[JUDGMENT FLAG 5]:** This is the final stop. Signing indicates acceptance of moral responsibility for the harm, acknowledging that the decision was necessary but not "good" in a total sense.
  **Written Sign-off:** The "Hard Choice Record," signed by all voting members, acknowledging the specific irreplaceable loss.

  ---

  # Application of the Procedure

  ## Case A: Flood-Defense Canal vs. Immigrant-Market District
  **Proposal:** Reroute canal through historic market district to save adjacent low-income neighborhood from flooding.
  **Conflict:** Cultural Continuity/Identity (Market) vs. Distributive Justice/Safety (Neighborhood).

  **Stage 1 (Domain ID):**
  *   Domains: Physical Safety, Cultural Continuity, Economic Identity, Distributive Justice.
  *   *[Flag 1]*: Staff report initially valued the Market only by "business license revenue." Board corrects this to "Cultural Continuity."

  **Stage 2 (Translation Audit):**
  *   Leakage detected: Flooding risk described only as "property damage costs."
  *   Correction: Reframed as "Displacement of vulnerable residents and loss of housing security."

  **Stage 3 (Dominance/Threshold):**
  *   Dominance: None. Both options save one group and harm another.
  *   Threshold: Flooding causes potential loss of life (Severe). Market demolition causes loss of cultural hub (Severe/Irreversible).
  *   Result: Both options trigger threshold concerns. Proceed to Stage 4.

  **Stage 4 (Comparative/Parity):**
  *   Reason A (Canal): Protects immediate physical safety of residents.
  *   Reason B (No Canal): Preserves century-old cultural infrastructure.
  *   Parity Check: Board finds these are on a par. Safety is urgent; Culture is irreplaceable.
  *   Decision: Prioritize Physical Safety due to immediate threat to life.
  *   *[Flag 4]*: Contextual Priority Commitment recorded: "Immediate preservation of life takes precedence over cultural infrastructure in acute climate emergencies."

  **Stage 5 (Hard-Choice Protocol):**
  *   Trigger: The Market will be destroyed (Irreplaceable harm).
  *   Action: Approve Canal.
  *   Sign-off: **Hard Choice Record.**
  *   *Content:* "The board acknowledges that saving the neighborhood results in the erasure of the Market District. This cultural loss is not offset by the safety gains. We commit to funding a permanent archive of the Market's history and relocating vendors with tenure protection."

  **Outcome:** Approved with Hard Choice Record.

  ---

  ## Case B: Elder-Care Expansion vs. Climate-Hardening Infrastructure
  **Proposal:** Use surplus budget for immediate nursing home beds OR long-term sea-wall reinforcement.
  **Conflict:** Immediate Suffering (Elders) vs. Intergenerational Fairness (Future Residents).

  **Stage 1 (Domain ID):**
  *   Domains: Care for Vulnerable (Current), Intergenerational Justice (Future), Fiscal Stewardship.
  *   *[Flag 1]*: No reduction found. Both are distinct temporal obligations.

  **Stage 2 (Translation Audit):**
  *   Leakage detected: Future climate risk described as "potential liability."
  *   Correction: Reframed as "Obligation to future citizens' habitability."

  **Stage 3 (Dominance/Threshold):**
  *   Dominance: None.
  *   Threshold: Denying elder care causes immediate suffering (Severe). Denying sea-wall causes future catastrophe (Severe/Irreversible).
  *   Result: Both trigger thresholds. Proceed to Stage 4.

  **Stage 4 (Comparative/Parity):**
  *   Reason A (Elders): Duty to existing citizens currently in pain.
  *   Reason B (Climate): Duty to future existence of the municipality.
  *   Parity Check: Board determines these are *not* on a par. The immediate suffering is actionable now; the climate risk, while severe, has a 10-year window.
  *   Decision: Fund Elder Care.
  *   *[Flag 4]*: Contextual Priority Commitment: "Immediate alleviation of verified suffering takes precedence over probabilistic future risk when the future risk window allows for delayed action."

  **Stage 5 (Hard-Choice Protocol):**
  *   Trigger: None. The harm to the future is deferred, not immediate/irreplaceable *at this moment*.
  *   Action: Approve Elder Care.
  *   Sign-off: Standard Approval with a "Future Review Mandate" (Sea-wall must be revisited in 2 years).

  **Outcome:** Approved without Hard Choice Record (Deferred harm).

  ---

  ## Case C: Historic Burial Ground vs. Emergency Homeless Shelter (Designed for Parity)
  **Proposal:** Build high-density emergency shelter on vacant land that contains an unmarked historic burial ground (no known descendants).
  **Conflict:** Respect for the Dead/Cultural Heritage vs. Housing Justice/Immediate Need.

  **Stage 1 (Domain ID):**
  *   Domains: Sanctity of Remains, Housing Justice, Public Health.
  *   *[Flag 1]*: Board ensures "Sanctity" is not reduced to "Archaeological Cost."

  **Stage 2 (Translation Audit):**
  *   Leakage detected: Housing need described as "bed count efficiency."
  *   Correction: Reframed as "Dignified shelter for unsheltered residents."

  **Stage 3 (Dominance/Threshold):**
  *   Dominance: None.
  *   Threshold: Disturbing graves is irreversible (Severe). Leaving people unsheltered in winter is life-threatening (Severe).
  *   Result: Both trigger thresholds. Proceed to Stage 4.

  **Stage 4 (Comparative/Parity):**
  *   Reason A (Shelter): Saves lives now.
  *   Reason B (Burial): Respects human dignity post-mortem.
  *   Parity Check: Board declares **Structural Parity**. Neither reason dominates. Saving lives does not automatically trump desecration, nor does desecration automatically veto life-saving measures.
  *   Decision: Build Shelter.
  *   *[Flag 4]*: Contextual Priority Commitment: "In a declared housing emergency, the needs of the living vulnerable take priority, provided the dead are treated with maximum feasible respect."

  **Stage 5 (Hard-Choice Protocol):**
  *   Trigger: Disturbing the graves is irreplaceable harm.
  *   Action: Approve Shelter.
  *   Sign-off: **Hard Choice Record.**
  *   *Content:* "The board acknowledges that this shelter will disturb human remains. This is a moral injury that cannot be fully repaired. We commit to a ceremonial reinterment of all found remains and a permanent on-site memorial, acknowledging that this does not 'balance the scale'."

  **Outcome:** Approved with Hard Choice Record and Parity Declaration.

  ---

  # Limitations of the Procedure

  The Board Chair must read the following statement into the record at the start of every session:

  1.  **Mandate Disputes:** This procedure cannot resolve disagreements about the Board's fundamental authority. If members disagree on whether the Board *should* be weighing these values, this protocol cannot settle that political question.
  2.  **Moral Regret:** This procedure does not eliminate moral regret. The "Hard Choice Record" formalizes regret; it does not dissolve it. Members should expect to feel unresolved tension after Stage 5.
  3.  **Democratic Substitution:** This procedure is not a substitute for democratic input. It operationalizes ethical reasoning for appointed officials; it does not replace the need for public hearings or elected council decisions on value priorities.
  4.  **Epistemic Limits:** The procedure relies on the accuracy of the information provided in Stages 1 and 2. If the scientific or social data regarding impacts is flawed, the ethical reasoning built upon it will be unsound.
  5.  **No Algorithmic Salvation:** This is a tool for structuring judgment, not a machine for producing answers. The [JUDGMENT FLAGS] indicate points where human wisdom is required and cannot be bypassed.
