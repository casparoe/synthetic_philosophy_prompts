  # Part I: The Logical Space

  Before sorting positions, we must distinguish the three distinct "gaps" often conflated under the label "is-ought." A student's location in metaethical space is determined by which gaps they accept and which they bridge.

  1.  **The Semantic Gap:** Can evaluative terms (e.g., "good") be *defined* using only descriptive terms (e.g., "happiness")?
      *   *Bridge:* Definitional Naturalism.
      *   *Gap:* Non-Naturalism, Expressivism, Error Theory.
  2.  **The Logical Gap:** Can a normative conclusion be *validly derived* from premises containing no normative vocabulary?
      *   *Bridge:* Institutionalism, Some forms of Naturalism.
      *   *Gap:* Hume's Law, Most Realisms and Anti-Realisms.
  3.  **The Metaphysical Gap:** Are evaluative facts *ontologically distinct* from descriptive facts, and if so, how do they relate (supervene)?
      *   *Bridge:* Reductive Naturalism.
      *   *Gap:* Non-Naturalism, Error Theory, Expressivism.

  **Cross-Cutting Divides:**
  *   **Realism vs. Anti-Realism:** Traditionally turns on whether moral claims are truth-apt and sometimes true. However, *Non-Naturalist Realists* and *Expressivists* can agree that moral properties are not "in the world" like atoms, disagreeing only on whether this matters for truth.
  *   **Internalism vs. Externalism:** Turns on whether moral judgment necessarily provides a motive/reason. This cuts across Realism (Externalist Realists exist) and Anti-Realism (Some Expressivists are Externalist).

  The instrument below forces choices on these three gaps in order of logical priority. You cannot settle the metaphysics (Gap 3) before settling the semantics (Gap 1).

  ***

  # Part II: The Diagnostic Instrument

  **Preliminary Screening (Do not count toward the nine)**
  *Read the following two sentences:*
  (A) "The water in the pot is boiling at 100°C."
  (B) "It is cruel to boil the cat."
  *Question:* Is the difference between sentence (A) and sentence (B) primarily a difference in **subject matter** (what they are about), or a difference in **function** (what the speaker is doing)?
  *   [ ] Subject Matter
  *   [ ] Function
  *   [ ] They are the same kind of thing
  *(Note: If "Same kind of thing," the student may lack the conceptual distinction required for the seminar.)*

  **The Nine Branch Questions**
  *Answer each based on your immediate intuition. Do not worry if later questions seem to contradict earlier ones; mark what seems true to you now.*

  **1. (Case 1: Definition)**
  Someone fully at home with the concept of maximizing aggregate happiness asks, of an act that does exactly that, whether it is good. Is that question conceptually confused (like asking "Is a bachelor unmarried?"), or does it remain intelligible?
  *   [ ] Confused / Closed
  *   [ ] Intelligible / Open

  **2. (Case 4: Derivation)**
  A person says the words "I promise to pay you five dollars." Does the existence of the institution of promising hand you the conclusion that he ought to pay, or does the argument still need a premise that is already normative (e.g., "You ought to keep promises")?
  *   [ ] Hands the conclusion automatically
  *   [ ] Needs a normative premise

  **3. (Case 7: Truth-Aptness)**
  A sentence in which a moral clause appears unasserted, as in "If it is wrong to do that then it is wrong to get someone else to do that": is the "it is wrong" part the sort of thing that can be true or false?
  *   [ ] Yes, it can be true or false
  *   [ ] No, it expresses an attitude/command

  **4. (Case 5: Disagreement)**
  Two communities use the same evaluative word while applying it to different descriptive patterns. When one says an act is wrong and the other says it is not, do they disagree about one thing, or are they saying compatible things in different vocabularies?
  *   [ ] Disagree about one thing
  *   [ ] Compatible things / Talking past each other

  **5. (Case 3: Supervenience)**
  Two acts are alike in every descriptive respect. Can one be obligatory and the other not?
  *   [ ] No, impossible
  *   [ ] Yes, possible

  **6. (Case 6: Reasons)**
  An agent wholly unmoved by moral considerations asks what reason she has to act morally. Is there an answer to her that does not depend on what she happens to want?
  *   [ ] Yes, there is a reason
  *   [ ] No, depends on her desires

  **7. (Case 2: Validity)**
  An argument with no normative premises validly yields a wildly false normative conclusion, by way of a disjunctive premise whose other disjunct is plainly false. Does this refute the claim that you can't get an 'ought' from an 'is', or does it show that the claim was never about validity in that technical sense?
  *   [ ] Refutes the claim
  *   [ ] Shows the claim is about something else

  **8. (Ontology)**
  If moral claims are true, are moral properties part of the fabric of the universe like mass or charge, or are they more like rules of a game or projections of our feelings?
  *   [ ] Fabric of the universe
  *   [ ] Rules / Projections / Nothing

  **9. (Quietism)**
  Is the question "What kind of facts are moral facts?" a deep mystery we must solve, or a confusion about how we use language that we should dissolve?
  *   [ ] Deep mystery
  *   [ ] Confusion to dissolve

  ***

  # Part III: The Leaves (Positions)

  *Map your answer pattern to the closest leaf below. Note the "awkward commitment" each position requires.*

  **Leaf A: Definitional Naturalism** (Q1: Confused)
  *   **Position:** Moral terms just mean descriptive terms (e.g., Good = Happiness).
  *   **Awkward Commitment:** You must swallow that moral progress is merely linguistic stipulation and that anyone who asks "Is happiness good?" is literally speaking nonsense.
  *   **Status:** *Historically occupied, now nearly empty.*

  **Leaf B: A Posteriori Identity Naturalism** (Q1: Open, Q8: Fabric, Q9: Mystery)
  *   **Position:** Moral properties are identical to descriptive properties, but we need experience to learn this (like Water = H2O).
  *   **Awkward Commitment:** You must swallow that moral truths are discovered like scientific facts yet feel entirely distinct from them in experience.

  **Leaf C: Irreducible Non-Naturalism** (Q1: Open, Q5: Impossible, Q8: Fabric, Q9: Mystery)
  *   **Position:** Moral facts exist, are distinct from descriptive facts, and necessarily covary with them.
  *   **Awkward Commitment:** You must swallow that there are invisible properties that guide action but do not interact with physics.

  **Leaf D: Constitutivism** (Q6: Yes, Q8: Rules)
  *   **Position:** Normativity comes from what constitutes agency; to act is to aim at the good.
  *   **Awkward Commitment:** You must swallow that immoral agents are literally defective as agents, not just bad people.

  **Leaf E: Expressivism / Projectivism** (Q3: No, Q6: Yes)
  *   **Position:** Moral sentences express attitudes, not beliefs; they aren't true/false but still guide action.
  *   **Awkward Commitment:** You must swallow that moral logic works without moral truths being the sort of things that can be true.

  **Leaf F: Error Theory (Abolitionist)** (Q3: Yes, Q4: Compatible/False, Q8: Nothing, Q6: No)
  *   **Position:** Moral claims try to state facts but fail; all are false; we should stop making them.
  *   **Awkward Commitment:** You must swallow that we should abolish the very vocabulary you use to argue for this position.

  **Leaf G: Error Theory (Conservationist/Fictionalist)** (Q3: Yes, Q4: Compatible/False, Q8: Nothing, Q6: No, Q9: Confusion)
  *   **Position:** Moral claims are false, but useful fictions we should keep.
  *   **Awkward Commitment:** You must swallow that you are advocating a systematic, useful falsehood to yourself and others.

  **Leaf H: Relativism** (Q4: Compatible)
  *   **Position:** Moral truth is relative to the community or framework.
  *   **Awkward Commitment:** You must swallow that conflicting moral judgments can both be correct simultaneously.

  **Leaf I: Quietism / Deflationism** (Q9: Confusion)
  *   **Position:** The metaphysical debate is a linguistic knot; there is nothing to solve.
  *   **Awkward Commitment:** You must swallow that this entire seminar is investigating a pseudo-problem.

  **Leaf J: Unstable / Hybrid** (Patterns matching no coherent leaf)
  *   **Position:** A collection of intuitions not yet systematized.
  *   **Awkward Commitment:** You must swallow that some of your answers contradict others upon reflection.

  ***

  # Part IV: Scoring Key & Diagnostics

  ### Scoring Logic (The Flowchart)
  *While students answer 1-9 linearly, the logical tree prunes as follows:*

  1.  **Start at Q1.**
      *   If **Confused**: Go to **Leaf A** (Definitional Naturalism). *Stop.*
      *   If **Open**: Go to Q3.
  2.  **At Q3 (Truth-Aptness).**
      *   If **No**: Go to Q6. (If Q6=Yes, **Leaf E**). (If Q6=No, **Leaf J**).
      *   If **Yes**: Go to Q4.
  3.  **At Q4 (Disagreement).**
      *   If **Compatible**: Go to **Leaf H** (Relativism) or **Leaf F/G** (Error Theory). Distinguish via Q8.
          *   If Q8=Nothing: Error Theory. (If Q9=Confusion, **Leaf G**; else **Leaf F**).
          *   If Q8=Rules: **Leaf H**.
      *   If **Disagree**: Go to Q5.
  4.  **At Q5 (Supervenience).**
      *   If **Possible** (No Supervenience): Go to **Leaf J** (Unstable Realism).
      *   If **Impossible** (Supervenience): Go to Q8.
  5.  **At Q8 (Ontology).**
      *   If **Fabric**: Go to Q9. (If Mystery, **Leaf C** or **Leaf B**).
      *   If **Rules/Nothing**: Go to Q6. (If Q6=Yes, **Leaf D**; If No, **Leaf J**).
  6.  **At Q9 (Quietism).**
      *   If **Confusion**: **Leaf I**.
      *   If **Mystery**: Distinguish B vs C via Q2/Q7 nuance (see Diagnostics).

  ### Diagnostics: Empty Combinations
  *These are answer patterns the tree can generate but that no coherent position occupies.*

  1.  **The "Moore-Proof" Naturalist (Q1: Confused + Q3: Yes + Q8: Fabric)**
      *   *Pattern:* Claims "Good" just means "Happiness" (Q1), but also claims Moral Properties are distinct fabric-of-universe entities (Q8).
      *   *Why Empty:* **Incoherent.** If the terms are definitional synonyms, the properties cannot be ontologically distinct. This cell emptied because G.E. Moore demonstrated that if 'good' were definable, the Open Question (Q1) would be closed. Those who accept Q1=Closed usually accept Reductive Naturalism (Leaf A), not Non-Naturalism.
  2.  **The "Nihilist Reason-Giver" (Q3: Yes + Q4: Compatible/False + Q6: Yes)**
      *   *Pattern:* Claims moral statements are all false (Error Theory), but the amoralist still has a reason to be moral (Internalism).
      *   *Why Empty:* **Unstable.** If moral facts do not exist (Q3/4), the source of the "reason" (Q6) becomes metaphysically mysterious. Error Theorists typically deny normative reasons exist (Mackie), or become Externalists. Holding both requires believing in "ghost reasons."
  3.  **The "Magic Deriver" (Q1: Open + Q2: Hands Conclusion + Q8: Fabric)**
      *   *Pattern:* Claims moral properties are distinct from descriptive ones (Q8), yet institutions alone generate 'oughts' without normative premises (Q2).
      *   *Why Empty:* **Incoherent.** If properties are distinct (Gap 3), a logical bridge is required to move from descriptive premises (institution exists) to normative conclusions (ought to pay). Claiming the bridge exists without a normative premise violates the Logical Gap accepted in Q1.

  ### Diagnostics: Indistinguishable Pairs
  *These leaves are generated by identical or near-identical answer patterns on this instrument.*

  1.  **A Posteriori Naturalism (Leaf B) vs. Non-Naturalism (Leaf C)**
      *   *Pattern:* Both answer Q1=Open, Q3=Yes, Q5=Impossible, Q8=Fabric, Q9=Mystery.
      *   *Why Indistinguishable:* Both agree moral facts exist, are distinct from descriptive concepts (Q1), and supervene (Q5). The difference is whether the property *identity* is necessary (Non-Naturalism) or contingent/discovered (Naturalism).
      *   *Further Question Needed:* "Is it possible in some other universe for Happiness to exist without Goodness?" (Naturalist: Yes; Non-Naturalist: No).
      *   *Beginner Viability:* Low. This requires modal intuition about possible worlds that undergraduates rarely possess on day one.
  2.  **Abolitionist Error Theory (Leaf F) vs. Conservationist Error Theory (Leaf G)**
      *   *Pattern:* Both answer Q3=Yes, Q4=Compatible/False, Q8=Nothing, Q6=No.
      *   *Why Indistinguishable:* They agree on all truth-conditions and metaphysics. They differ only on *pragmatic* recommendation (stop using moral talk vs. keep using it).
      *   *Further Question Needed:* "Should we continue to teach children moral vocabulary knowing it is false?"
      *   *Beginner Viability:* High. This is a practical question, but it is not a *metaethical* truth-condition question, so the diagnostic tree (focused on truth/description) cannot separate them without a pragmatic addendum.

  ### Diagnostics: Internal Instabilities
  *Mark these patterns in the scoring key as "Unstable."*

  1.  **Pattern: Q3=Yes (Truth Apt) + Q8=Rules/Projections**
      *   *Instability:* **Cognitivist Anti-Realism.** If moral sentences are truth-apt (Q3), they aim at facts. If facts are merely projections (Q8), it is hard to maintain they are truth-apt in a robust sense without sliding into Fictionalism (Leaf G) or Expressivism (Leaf E).
      *   *Reveals:* The student wants the objectivity of realism without the metaphysics.
  2.  **Pattern: Q5=Possible (No Supervenience) + Q8=Fabric (Realism)**
      *   *Instability:* **Brute Realism.** If moral properties are part of the fabric of the universe (Q8), it is inexplicable why they could float free of descriptive properties (Q5).
      *   *Reveals:* The student is attracted to Realism but rejects the constraint that makes Realism plausible (supervenience).
  3.  **Pattern: Q1=Open + Q2=Hands Conclusion**
      *   *Instability:* **Semantic/Logical Mismatch.** If 'Good' is not definable as 'Happiness' (Q1), then institutional facts (Q2) cannot logically yield 'Good' without a bridge premise.
      *   *Reveals:* The student conflates social pressure with logical validity.
