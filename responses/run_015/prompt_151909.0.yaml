      *   *Definitional Naturalism:* Q1=No (Good IS Happiness). Q3=Yes (Truth Apt). Q8=Fabric. *Why empty?* Moore's Open Question. If Good=Happiness, "Is Happiness Good?" should be closed. It's not.
      *   *Error Theorist + Internalism:* Q3=Yes (Truth Apt), Q4=No (False), Q6=Yes (Reasons exist). *Why unstable?* If no moral facts, where do reasons come from?
      *   *Non-Naturalist + Derivation:* Q1=Yes, Q2=Yes (Ought from Is), Q8=Distinct. *Why incoherent?* If distinct, need bridge. If bridge, not distinct.

      *   *Let's refine "Indistinguishable".*
      *   *Non-Naturalism vs. A Posteriori Naturalism:* Both say Facts Exist, Distinct from Descriptive (in some sense), Supervene. Difference is metaphysical necessity vs identity. Hard for beginners.
      *   *Abolitionist vs. Conservationist:* Both say Moral Claims False. Difference is pragmatic.

      *   *Let's refine "Instabilities".*
      *   *Cognitivist + Non-Truth-Apt:* Q3=Yes (Proposition) + Q3b=No (Truth).
      *   *Realist + No Supervenience:* Q8=Fabric + Q5=No (Can differ without desc diff).

      *   *Okay, ready to write.*
