answer: |-
  # Diagnostic Taxonomy: Normative Positions on Dynastic Wealth and Opportunity

  **Instructions:** Proceed through the decision tree below. At each node, select the answer that best reflects your considered judgment on the specific question asked. Follow the branching path until you arrive at a classified position (Leaf). Do not attempt to select a path based on the desired outcome; answer the concrete questions first.

  ---

  ### **ROOT NODE**
  **Question:** Does the intergenerational transmission of substantial economic advantage, considered as a social practice, constitute a structural impediment to fair equality of opportunity, or is it a permissible outcome of individual liberty?

  *   **A.** It is a permissible outcome of individual liberty.
      *   └─> **LEAF: Dynastic Libertarian**
  *   **B.** It constitutes a structural impediment to fair equality of opportunity.
      *   └─> Go to **NODE 1**.

  ---

  ### **NODE 1 (Mechanisms)**
  **Question:** Regarding the mechanisms of transmission, does the violation of equality of opportunity stem from direct asset bequests (capital-lock), social network advantages (status-lock), or both equally?

  *   **A.** Primarily from direct asset bequests (capital-lock); status-lock is outside the scope of state remedy.
      *   └─> Go to **NODE 3**.
  *   **B.** Primarily from social network advantages (status-lock); capital-lock is secondary.
      *   └─> Go to **NODE 4**.
  *   **C.** Both equally constitute the violation.
      *   └─> Go to **NODE 2**.

  ---

  ### **NODE 2 (Baseline)**
  **Question:** Should the baseline for assessing opportunity be evaluated within a single life-course (intragenerational) or tracked across family lines over successive generations (intergenerational)?

  *   **A.** Within a single life-course (intragenerational).
      *   └─> **LEAF: Meritocratic Reset**
  *   **B.** Across family lines over successive generations (intergenerational).
      *   └─> Go to **NODE 3**.

  ---

  ### **NODE 3 (Hypothetical)**
  **Question:** Consider a hypothetical in which capital-lock inheritance is fully abolished through taxation, but status-lock inheritance remains entirely intact. Would this outcome satisfy the demands of justice?

  *   **A.** Yes, this would satisfy the demands of justice.
      *   └─> **LEAF: Capital-only Restrictionist**
  *   **B.** No, status-lock advantages must also be remedied to satisfy justice.
      *   └─> Go to **NODE 4**.

  ---

  ### **NODE 4 (Primary Wrong)**
  **Question:** Is the primary wrong of dynastic wealth that it violates moral arbitrariness regarding circumstances of birth (a luck-egalitarian concern), or that it distorts democratic political equality by concentrating influence?

  *   **A.** It distorts democratic political equality by concentrating influence.
      *   └─> Go to **NODE 5**.
  *   **B.** It violates moral arbitrariness regarding circumstances of birth.
      *   └─> Go to **NODE 5**.

  ---

  ### **NODE 5 (Concrete Case)**
  **Question:** A founder liquidates a business, pays all statutory taxes, and endows a private foundation that provides exclusive internships and mentorship exclusively to the descendants and peers of her family network. Does this arrangement count as an instance of objectionable dynastic wealth?

  *   **A.** Yes, this is objectionable dynastic wealth.
      *   *If Path was Root(B) → Node1(C) → Node2(B) → Node3(B) → Node4(B):*
          *   └─> **LEAF: Strict Abolitionist**
      *   *If Path was Root(B) → Node1(C) → Node2(B) → Node3(B) → Node4(A):*
          *   └─> **LEAF: Democratic-Egalitarian**
  *   **B.** No, provided statutory taxes were paid and no laws broken.
      *   └─> **UNOCCUPIED LEAF** (See Gap Analysis below).

  ---

  ### **Position Leaves: Definitions and Awkward Commitments**

  1.  **Dynastic Libertarian:** No restriction on either form of transmission is justified.
      *   *Awkward Commitment:* This position must accept that a child’s life prospects are morally determined by the accident of their parents’ wealth, rendering "equality of opportunity" an empty slogan.
  2.  **Meritocratic Reset:** Inheritance is permissible only if it does not alter competitive positions in social cooperation.
      *   *Awkward Commitment:* This view permits massive intergenerational wealth concentration so long as the heirs possess the talent to compete, effectively allowing an aristocracy of merit.
  3.  **Capital-only Restrictionist:** Capital-lock must be eliminated, but status-lock falls outside the scope of state remedy.
      *   *Awkward Commitment:* This position must argue that elite schooling and social networking do not confer the same structural advantages as direct cash bequests, despite empirical evidence to the contrary.
  4.  **Democratic-Egalitarian:** Inheritance is objectionable only when it translates into disproportionate political influence.
      *   *Awkward Commitment:* This view permits vast economic inequality and social stratification provided the wealthy can be institutionally prevented from lobbying or donating to campaigns.
  5.  **Strict Abolitionist:** All substantial intergenerational economic transmission is unjust.
      *   *Awkward Commitment:* This position requires intrusive state intervention into family life, such as boarding schools or confiscatory estate taxes, to prevent parents from advantaging their children.

  ---

  ### **Gap Analysis: Unoccupied Leaves**

  **Identified Gap:** The combination of **Node 4(A) [Democratic Distortion]** and **Node 5(B) [Foundation Not Objectionable]**.
  *   **Path:** Root (Impediment) → Node 1 (Both) → Node 2 (Inter) → Node 3 (No) → Node 4 (Democratic Distortion) → Node 5 (Not Objectionable).
  *   **Diagnosis:** This combination yields an unoccupied leaf because it is theoretically incoherent. If a view holds that the primary injustice of dynastic wealth is the distortion of *democratic political equality* (Node 4A), it logically follows that a private foundation endowing exclusive internships to a family network (Node 5) is objectionable, as such foundations are primary vehicles for converting wealth into soft political and social influence. A proponent who answers "No" at Node 5 while answering "Democratic Distortion" at Node 4 fails to recognize the mechanism by which status-lock influences democracy. This gap stems from **incoherence** rather than mere lack of exploration; the commitment at Node 4 negates the judgment at Node 5.

  ---

  ### **Methodological Reflection**

  **Condition for Reclassification:**
  My classification relies heavily on the distinction at **Node 1 (Mechanisms)** between *capital-lock* and *status-lock*. This separation would collapse if empirical evidence demonstrated that market mechanisms **fully convert status-lock advantages into capital-lock advantages** (e.g., if exclusive networking invariably resulted in liquid asset transfers that could be taxed, or if social capital could be perfectly monetized and regulated as property). If status-lock were proven to be functionally identical to capital-lock in all institutional settings, the "Capital-only Restrictionist" leaf would vanish, merging into the "Strict Abolitionist" or "Meritocratic Reset" positions depending on the baseline.

  **Least Secure Separation:**
  The point in reasoning where the separation between two leaves is least secure is between the **Meritocratic Reset** and the **Capital-only Restrictionist**. Both positions may support heavy inheritance taxation, but for different reasons (one to ensure fair competition within a generation, the other to eliminate asset bequests specifically). In practice, policy proposals from these two camps often look identical (e.g., high estate taxes), making it difficult to distinguish the underlying normative commitment solely by observing their support for specific legislation. The distinction rests entirely on the *justification* (Node 2 Baseline) rather than the *outcome*, which is fragile in a diagnostic instrument based on concrete judgments.
