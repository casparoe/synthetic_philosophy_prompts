answer: |-
  ### Part 1: Design Space and Selection

  Here are three candidate core mechanics derived from your proposals, evaluated for feasibility and philosophical fidelity.

  **Candidate 1: The Inheritance Chain**
  Players coordinate in silence. Every third round, one player is swapped with a naive outsider who inherits the score but not the history.
  *   **Verdict: Reject.**
  *   **Reason:** Logistical fragility. In a festival setting, you cannot guarantee an adjacent room of "naive outsiders" waiting to rotate in. Late arrivals happen, but structured rotation requires military precision. If the swap fails, the mechanic collapses. Furthermore, tracking individual scores across swapping players creates arithmetic overhead that distracts from the philosophical point. You want participants thinking about norms, not doing ledger management.

  **Candidate 2: The Parallel Colonies**
  The room splits into two groups that never interact, face the same problem, and settle on different regularities.
  *   **Verdict: Reject (as a standalone).**
  *   **Reason:** While excellent for demonstrating *Path Dependence*, it fails to generate the visceral feeling of *Inertia*. If Group A chooses Red and Group B chooses Blue, and both succeed, everyone feels successful. To feel the "trap" of convention, participants must want to change and find they cannot. A static split shows divergence, but not the pain of being locked into a sub-optimal equilibrium. It becomes an observation of difference rather than an experience of constraint.

  **Candidate 3: The Locked-In Coordination (Selected)**
  A single room plays a coordination game where one option is initially salient (arbitrary), but later becomes sub-optimal. A "Mutiny" mechanism allows switching only if a supermajority agrees.
  *   **Verdict: Accept.**
  *   **Reason:** This synthesizes the strengths of your ideas. By splitting the room *initially* (like Colonies) with different salience cues, we generate Path Dependence. By changing the payoffs mid-game (like Mutiny), we generate Inertia. By using late arrivals as natural "inheritors," we capture transmission without complex swapping. It fits the tote-bag constraint and requires only one facilitator.

  ---

  ### Part 2: The Session Design ("The Convention Trap")

  #### Materials and Setup
  *   **Bag Contents:**
      *   20 Instruction Sheets (10 marked "Type L", 10 marked "Type R").
      *   20 Decision Cards (Red side / Blue side).
      *   20 Score Sheets + pencils.
      *   1 Bag of chocolate chips (or small chocolates).
      *   1 Facilitator Script (this document).
  *   **Room Setup:**
      *   Chairs arranged in a horseshoe or two distinct clusters (Left Cluster, Right Cluster).
      *   No tables needed; participants hold cards on laps.
  *   **Late Arrivals:** Keep a stack of "Type L" sheets near the door. If someone arrives late, hand them a sheet and point them to the Left Cluster. They must infer the norm from play.

  #### Rules (Facilitator Script)
  *Read this verbatim to ensure reproducibility.*

  "Welcome. You are in a coordination experiment. There is no talking at any time. If you speak, you sit out the next round.
  You have a Decision Card: Red or Blue.
  You have a Score Sheet.
  We will play 6 Rounds.
  **The Rule:** In each round, choose Red or Blue. Reveal on count of three.
  **The Payoff:** You score points only if you match the *majority choice of your cluster*.
  If you match the majority, you get points. If you are in the minority, you get zero.
  Round 1-3: Matching = 1 point.
  Round 4-6: Matching Red = 1 point. Matching Blue = 3 points.
  Between Round 3 and 4, we will pause.
  After Round 6, we cash out points for chocolate.
  Begin Round 1."

  *Facilitator Note:* The "Type L" sheets have a subtle visual cue (e.g., a small red dot in the corner). The "Type R" sheets have a blue dot. This is the only difference. It primes the arbitrary choice without explicit instruction.

  #### Payoff Scheme
  *   **Rounds 1–3:** Match Majority = **1 Point**. (Establishes the convention).
  *   **Rounds 4–6:** Match Red = **1 Point**. Match Blue = **3 Points**. (Creates the incentive to switch).
  *   **The Mutiny Vote (Between Round 3 & 4):** "You may vote to switch your cluster's official norm. If 80% of your cluster votes 'Switch', everyone *must* play Blue in Round 4. If less than 80%, everyone *must* play their original majority choice in Round 4."
  *   **Why these numbers:** The 3x payoff makes switching rational for everyone individually. The 80% threshold makes switching collectively difficult. This creates the gap between "I want to" and "We can."

  #### Timeline (90 Minutes)

  *   **00–10 min: Arrival & Setup.** Hand out sheets. Ensure Left Cluster gets Type L, Right Cluster gets Type R. Collect phones in a basket (or enforce honor system).
  *   **10–15 min: Instructions.** Read script. Emphasize silence.
  *   **15–25 min: Rounds 1–3 (Emergence).** Play quickly. Tally scores.
      *   *Expected Outcome:* Left Cluster converges on Red (primed). Right Cluster converges on Blue (primed).
  *   **25–35 min: The Payoff Shift & Mutiny Vote.** Announce new values (Blue = 3pts). Distribute ballot slips. "Vote to Switch to Blue?"
      *   *Expected Outcome:* Right Cluster (already Blue) votes Yes (trivial). Left Cluster (stuck on Red) votes Yes, but fears others won't. Often fails to hit 80%.
  *   **35–50 min: Rounds 4–6 (Inertia).** Play rounds.
      *   *Expected Outcome:* Right Cluster scores high (3pts/round). Left Cluster scores low (1pt/round) because they couldn't coordinate the switch.
  *   **50–60 min: Late Arrival Integration.** If latecomers arrived, ask them to reveal their cards now. Discuss how they knew what to play.
  *   **60–90 min: Debrief.** (See below). Distribute chocolate based on points.

  #### Debrief Guide
  *Map specific moments to the four Lewisian targets.*

  1.  **Arbitrariness (Ask Round 1):** "Why did you choose Red/Blue initially?"
      *   *Expect:* "The dot on the sheet," "The person next to me," "It felt right."
      *   *Point:* The choice wasn't better; it was just salient.
  2.  **Expectation-Dependence (Ask Round 3):** "Did you choose based on what you wanted, or what you thought *they* would do?"
      *   *Expect:* "I wanted points, so I had to guess the majority."
      *   *Point:* Your reason to conform existed only because you expected others to conform.
  3.  **Inertia (Ask Post-Vote):** "Left Cluster, you wanted the 3 points. Why didn't you get them?"
      *   *Expect:* "I voted switch, but I wasn't sure *others* would." "I didn't want to be the only one playing Blue."
      *   *Point:* Universal discontent does not guarantee change. The expectation of conformity locks you in.
  4.  **Path Dependence (Ask Final):** "Left Cluster scored 6 points. Right Cluster scored 18 points. Did anyone in Left Cluster play worse strategically?"
      *   *Expect:* "No, we played optimally for our situation."
      *   *Point:* Inequality emerged from history (the initial prime), not competence.

  ---

  ### Part 3: Predictable Failures & Interventions

  1.  **The Talker:** One participant whispers "Let's all do Blue!" during Round 4.
      *   *Intervention:* Stop play. "Silence is a rule. You lose your points for this round."
      *   *Stop Play?* Yes. The experiment relies on the inability to communicate to function as a norm model.
  2.  **The Economist:** A participant calculates they can maximize *total room utility* by splitting choices.
      *   *Intervention:* Ignore them. The rules say "Match your cluster majority."
      *   *Stop Play?* No. Let them fail. Their individual rationality clashes with the coordination rule, proving the point.
  3.  **The Nihilist:** A participant plays randomly to "break the game."
      *   *Intervention:* None. Their score will be zero.
      *   *Stop Play?* No. Their deviation highlights the cost of non-conformity for the individual.
  4.  **The Arithmetic Error:** You miscalculate the 80% threshold for the Mutiny Vote.
      *   *Intervention:* Admit it. "I counted wrong. The vote failed."
      *   *Stop Play?* No. Real-world norms often hinge on bureaucratic errors or ambiguous thresholds.
  5.  **Fast Convergence:** The Left Cluster switches to Blue instantly in Round 4 without the vote.
      *   *Intervention:* Enforce the Vote rule strictly. "You must vote first."
      *   *Stop Play?* Yes, if they ignore the vote mechanism. The *process* of trying to switch is the data point.

  ---

  ### Part 4: Limitations (What the Game Cannot Do)

  **The Speech Paradox:**
  This game bans speech to isolate coordination. However, real-world conventions (like language itself) are built *through* speech. By banning talk, you create an artificial scarcity of communication that exaggerates the difficulty of switching norms. In reality, people talk their way out of traps. You must state this in the debrief: "We banned speech to see the structure of the trap. In life, you have the tool we removed."

  **The Time Horizon:**
  Ninety minutes cannot replicate generational inertia. Participants know the game ends in an hour. Real norms persist because we expect to live with the people tomorrow. You must articulate this: "You knew the end was near. Imagine if you had to live with this group for ten years. The inertia would be heavier."

  **The Stakes:**
  Chocolate is not a livelihood. Participants might risk being the "mutineer" because 3 points isn't worth social risk. In real life, deviating from a norm can cost you your job. The game underestimates the cost of conformity.

  ---

  ### Part 5: Fallback Plan (8 Participants)

  If only eight people show up, the "Two Colonies" split becomes too fragile (groups of 4 are volatile).

  **Adjustment:** Run a **Sequential Design**.
  1.  **Phase 1 (Rounds 1-3):** Play as one group. Prime them subtly to choose Red. (e.g., Handout has red dot).
  2.  **Phase 2 (Rounds 4-6):** Change payoff (Blue = 3pts). Attempt Mutiny Vote. It will likely fail (Inertia).
  3.  **Phase 3 (The Counterfactual):** Reset the game. Tell them: "Imagine you had started with a Blue dot." Play 3 rounds with Blue prime.
  4.  **Debrief:** Compare the *hypothetical* score of Phase 3 with the *actual* score of Phase 2.
      *   *Why:* This sacrifices the live experience of Path Dependence (seeing the other group win) for the stability of the Inertia experience. With 8 people, you need every participant to feel the Lock-In. Splitting them risks one group collapsing into chaos. Better to lock everyone in together, then show them the road not taken.
