answer: |-
  To save the core of your Strawsonian view ((1) and (3)) and preserve your intuition about Nils, you should reject **premise (2)**.

  Here is the diagnosis, the pricing of alternatives, and the answers to your three sub-questions.

  ### The Recommendation: Reject Premise (2)

  **Premise (2):** *The second of those questions [quality of will] is settled entirely by the actual sequence... It is not settled by what the agent would have done under conditions that did not obtain.*

  **Why it looked fine:**
  This premise likely entered your argument because it captures a powerful "actualist" intuition central to the participant stance. When I resent you for breaking a confidence, I am reacting to *what you did* and *what you thought at the time*. It feels like a category mistake to judge my actual interaction with you based on ghostly possibilities of what you might have done in other worlds. It aligns with the idea that moral responsibility is about the actual relationship and the actual expression of regard, not about metaphysical leverage or alternative possibilities in the abstract. It also mirrors Harry Frankfurt's anti-principle of alternative possibilities, which many find attractive.

  **Why you must reject it:**
  Your Nils intuition is the stronger datum here. If Nils is counterfactually fixed—if his will is rigid such that no moral reason could have turned him—then his actual sequence, though identical to Mira's, manifests a different *status* of agency. A will that is insensitive to reasons is a will that lacks the capacity for the kind of regard Strawson cares about. By insisting that quality of will is *entirely* actual-sequence, (2) forces you to treat a robot-like agent (Nils) the same as a reasons-responsive agent (Mira). Rejecting (2) allows you to say that the "quality of will" is not just a snapshot of the moment of action, but a disposition. A bad disposition (Nils) warrants a different response than a good disposition that slipped up (Mira), even if the slip-up looks the same in the actual sequence.

  **The Cost:**
  By rejecting (2), you concede that moral responsibility is partly modal. You admit that facts about what an agent *would* have done bear on whether they are responsible for what they *did* do. This invites the pessimist back in through the side door: if responsibility depends on counterfactual sensitivity, and determinism renders those counterfactuals false (or fixed), then determinism *does* threaten responsibility after all. You save the Nils intuition, but you weaken the "idleness claim" (3), because you have now made responsibility dependent on a modal property that determinism might undermine.

  ---

  ### Pricing the Alternatives

  If you refuse to reject (2), you must reject one of the other steps. Here is the cost of each:

  **1. Reject (3) (The Idleness Claim)**
  *   **What you accept:** You admit that the general metaphysical question (determinism vs. indeterminism) is *not* idle. You concede that if determinism is true, it might rationally require us to give up reactive attitudes.
  *   **The Cost:** This is the most expensive option for a Strawsonian. It abandons Strawson's primary innovation. You are no longer defending Strawson's naturalism; you are defending a compatibilist or libertarian metaphysical thesis. You turn the seminar paper into a standard metaphysics of freedom argument rather than a defense of the practice of responsibility.

  **2. Reject (5) (The Inference from the Nils Intuition)**
  *   **What you accept:** You maintain that your reaction to Nils is valid, but you deny that it tracks *warrant*. You claim that withholding resentment from Nils is not because he isn't responsible, but because resentment is *futile* or *pointless* toward him.
  *   **The Cost:** This requires you to reinterpret your own intuition. You must tell yourself, "I don't feel Nils is blameless; I just feel that blaming him won't work." This preserves (1), (2), and (3), but it creates a disconnect between your normative judgment and your emotional response. It risks making the participant stance look like a mere tool for social engineering rather than a response to moral reality.

  **3. Reject (7) (The Attack on the General/Particular Distinction)**
  *   **What you accept:** You argue that there *is* a principled difference between the modal claims used in excuses ("he couldn't have helped it") and the modal claims the pessimist uses ("determinism is true").
  *   **The Cost:** You must defend this distinction against the threat of determinism dissolving the local excuses. As your premise (7) notes, if determinism is true, Mira's sensitivity is just as illusory as Nils's fixity. To reject (7), you must argue that the *practice* of responsibility creates its own modal facts that are immune to metaphysical determinism. This is a sophisticated transcendental argument, but it is difficult to maintain without sounding like you are simply stipulating that "practice modality" doesn't count as "real modality."

  ---

  ### Answers to Your Sub-Questions

  **(i) Is "he could not have helped it" one excuse or two?**
  It is **two**, and the ambiguity is doing heavy lifting in your argument. Strawson distinguishes between **Exemptions** and **Excuses**.
  *   **Exemption:** The agent is not a fit object of the reactive demand (e.g., a child, the severely deranged). This targets premise (1)'s first condition.
  *   **Excuse:** The agent is a fit object, but the particular action did not reflect ill will (e.g., accident, coercion). This targets premise (1)'s second condition.

  In your argument, Nils is being treated as an **Excuse** case in premise (4) (he is an agent who acted), but your intuition treats him like an **Exemption** case (he is psychologically fixed, like the deranged).
  *   **Does this settle which step is faulty?** Yes. If Nils is an Exemption, then premise (1) handles it: he is not a fit object. You don't need premise (2) to do the work. If Nils is an Excuse (a fit object), then premise (2) fails because his counterfactual fixity shows his quality of will was different than Mira's. The argument slips between these two. To fix it, you must decide if counterfactual fixity makes one *not an agent* (Exemption) or just a *bad agent* (Excuse). If the former, (1) saves you. If the latter, (2) must go.

  **(ii) Does my reaction to Nils track warrant at all, or does it track something adjacent?**
  This is the strongest Strawsonian counter-move. Your reaction to Nils likely tracks the **appropriateness of the Objective Attitude**, not the normative warrant of resentment.
  *   **The Analysis:** Strawson argues we adopt the objective attitude toward those who cannot participate in interpersonal relationships. If Nils is counterfactually fixed, he cannot *receive* your resentment as a moral demand. He is, for all practical purposes, a force of nature.
  *   **Which premise is misdescribed?** This targets **premise (5)**. Premise (5) claims your reaction shows counterfactual facts bear on whether resentment is *warranted*. A strict Strawsonian would say your reaction shows counterfactual facts bear on whether the agent is a *fit object* for the practice. If they are not a fit object, the question of warrant doesn't arise; the question of *viability* does.
  *   **The Cost:** If you accept this, you must admit that your intuition about Nils isn't about *blame*, it's about *capacity*. This pushes you back toward question (i): is Nils exempt? If you say yes, you keep (2). If you say no (he's an agent), then you are back to rejecting (2).

  **(iii) Can the distinction between the counterfactual facts our practices need and the counterfactual facts the pessimist needs be drawn in a principled way?**
  Yes, but it is costly.
  *   **The Distinction:** The distinction is between **Internal (Practice-Immanent) Modality** and **External (Metaphysical) Modality**.
      *   *Internal:* "He couldn't have helped it" means "Given his psychology and the situation, no reasonable expectation could have been met." This is a claim within the practice about expectations and capacities.
      *   *External:* "Determinism is true" means "Given the laws of nature and the past, no other action was physically possible." This is a claim outside the practice.
  *   **Can it survive determinism?** A defender of (3) must argue that the Internal modality is *autonomous*. Even if the External modality is fixed, the Internal modality (reasons-responsiveness) remains a real feature of the agent's psychology that matters for relationships.
  *   **The Cost:** The cost is vulnerability to the **Eliminativist Challenge**. As your premise (7) suggests, if determinism is true, the psychological facts that ground Internal modality (beliefs, desires, reasoning) are themselves determined. The pessimist will argue that if the External modality is fixed, the Internal modality is just a story we tell ourselves. To maintain the distinction, you must argue that the *truth* of responsibility practices does not depend on the *metaphysical ultimateity* of the freedom they presuppose. You have to be comfortable with a kind of "freedom worth wanting" (Dennett) that doesn't satisfy the metaphysician.

  ### Summary
  To keep your Nils intuition and your Strawsonian framework, **reject (2)**. Admit that quality of will is dispositional, not just actual-sequential. This costs you the purity of the actual-sequence view and makes you vulnerable to the claim that determinism undermines those dispositions. However, it is the only way to make your argument valid without abandoning Strawson's core naturalism (3) or gaslighting your own moral intuition (5).
