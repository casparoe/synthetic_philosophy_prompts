      *   **Constraint:** Prefer not to drop "organic unity" (Claim 1).
      *   **Output Requirements:** Audit the claims, rank tensions by severity, flag apparent vs. real tensions, suggest the least costly fix.

  2.  **Deconstruct the Six Claims:**

      *   *(1) Organic Unity:* Value $\neq$ Sum of parts. Friendship/Beauty can be intrinsically good independent of pleasure (anti-hedonism).
