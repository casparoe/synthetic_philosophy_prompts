      *   Claim (2) says: Depends on "mutual recognition."
      *   *Problem:* "Recognition" implies knowing the *actual* object. If I recognize a fiction, is it mutual?
      *   *Fix:* Change "mutual recognition" in (2) to "reciprocal affective engagement." This preserves the natural base without requiring epistemic accuracy.

  7.  **Refining the "Disagreement" Issue (1 vs 5):**
      *   If friendship value is natural/analysable (2 & 3), then there are facts about whether a relationship counts as a valuable friendship.
