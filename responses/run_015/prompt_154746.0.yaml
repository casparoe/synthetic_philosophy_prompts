      *   **Claim 1:** "The no-free-lunch theorems finally settle Hume's problem of induction, and the verdict is harsher than the philosophers feared."
          *   *Assessment:* Overstatement/Misinterpretation. NFL theorems (Wolpert, 1996) are mathematical results about supervised learning performance averaged over all possible target functions. Hume's problem is philosophical/epistemological. NFL shows limitations under specific assumptions (uniform prior over functions), but doesn't "settle" the philosophical problem in the way claimed (i.e., that induction is *impossible* or *unjustified* simpliciter). It formalizes a aspect of it but doesn't close the debate.
      *   **Claim 2:** "Average each learner's expected error over all of those worlds and you get exactly the same number for every one of them. So no learner is better than any other, and none is better than guessing."
