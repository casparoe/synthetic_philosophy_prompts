      *   *Induction:* Hume's problem is about the justification of the principle of uniformity of nature. NFL shows that without assuming uniformity (or some bias), you can't learn. This aligns with Hume, but doesn't "settle" it by making induction hopeless; it highlights the necessity of bias.
