  ### The Concept: Evidential Weight

  The established name for the phenomenon you are describing is **Evidential Weight** (or simply **Weight**). It originates in the early twentieth-century debates on probability, most notably in John Maynard Keynes's *A Treatise on Probability* (1921), and persists in contemporary discussions of ambiguity and imprecise credence.

  **The Carving:**
  Weight is a property of a probability judgment that is distinct from the probability itself.
  *   **Probability** measures the degree of rational belief in a proposition (e.g., 60%).
  *   **Weight** measures the amount of relevant evidence upon which that probability is based.

  In your three instances, the clinicians, investors, and committee members agree on the **Probability** (the numerator of the rational belief relation) but differ on the **Weight** (the bulk of the evidence supporting that relation). The first agent in each pair has high weight (large sample, long history); the second has low weight (anecdote, thin data).

  **What It Is Not:**
  1.  **It is not Probability:** Two agents can have identical probabilities with vastly different weights. Probability tells you *what* to believe; Weight tells you *how much* evidence you have for believing it.
  2.  **It is not Risk:** In standard decision theory, "risk" implies known probabilities. Both your agents face risk in this sense. Weight is a feature of the epistemic state *prior* to the decision, not the payoff structure.
  3.  **It is not Psychological Confidence:** Confidence is often a feeling that can be misplaced (e.g., overconfidence). Weight is an objective (or inter-subjective) feature of the evidential relationship. An agent can have high weight and low confidence (cautious expert) or low weight and high confidence (ignorant zealot).

  **Borders Against Nearest Neighbours:**
  *   **Against Ambiguity (Ellsberg):** The Ellsberg Paradox involves a preference for a known distribution (Urn A: 50 red, 50 black) over an unknown one (Urn B: unknown ratio). This is a limit case of Weight. In Ellsberg, the unknown urn has effectively *zero* weight regarding the ratio. Your cases are more subtle: both agents assign a number, but one assignment is "heavier." Ellsberg is the behavioral manifestation (Ambiguity Aversion); Weight is the evidential property causing it.
  *   **Against Second-Order Uncertainty:** Second-order uncertainty models Weight by assigning a spread (variance) to the probability estimate. While mathematically useful, Weight is the conceptual ground: we use second-order distributions *because* we recognize differences in Weight.
  *   **Against Resilience:** Resilience (a term popularized by Brian Skyrms) refers specifically to the stability of a belief under new evidence. This is one *consequence* of Weight. High Weight implies High Resilience. Weight is the cause; Resilience is the effect.

  ### The Two Components: Reluctance and Fragility

  You asked whether the reluctance to act and the fragility under new evidence are one thing or two. Under the concept of Weight, they are **two aspects of the same underlying property**.

  1.  **Fragility (Resilience):** A probability judgment based on low Weight is logically more susceptible to revision. If your 60% is based on five cases, one new negative case shifts the percentage drastically. If it is based on five hundred cases, one new case barely moves it. This is a logical feature of inductive support.
  2.  **Reluctance (Ambiguity Aversion):** Why does low Weight cause reluctance to act if the expected utility is identical?
      *   *The Standard Bayesian View:* It shouldn't. If the probability is 60% and the payoffs are fixed, the expected utility is fixed. Reluctance is irrational "noise."
      *   *The Weight View (Keynes/Levi/Ellsberg):* Rational agents care not only about the *level* of probability but the *security* of that probability. When Weight is low, the agent is aware that their 60% is fragile. Even if no *new* evidence is arriving *now*, the agent recognizes that their estimate is less reliable. In many formalizations (like Imprecise Probability), low Weight is modeled as a wider range of compatible probabilities (e.g., 60% ± 20% vs 60% ± 2%). A rational agent who is averse to worst-case scenarios (maximin) will act more cautiously on the wider range.

  Thus, Fragility and Reluctance are linked: The recognition of Fragility (low Weight) rationalizes the Reluctance (caution), provided one accepts that the *reliability* of a probability is decision-relevant, not just its magnitude.

  ### Boundary Cases

  **1. Redundant vs. Varied Evidence:**
  You asked about an agent with bulky but redundant evidence (single measurement source) versus one with varied evidence (independent sources).
  *   **Verdict:** This is the **same dimension** (Weight), but you must define Weight carefully. Weight is not merely the *volume* of data; it is the amount of **relevant, independent** evidence.
  *   **Explanation:** Ten tests based on the same faulty assumption or shared calibration error add little Weight. Five tests based on different physical principles add significant Weight. Your instinct is correct: the agent with redundant evidence is in the same position as the thin-evidence clinician. Low *effective* Weight produces the same fragility and reluctance.

  **2. Plentiful but Conflicting Evidence:**
  You asked about evidence that is plentiful but pulls both ways.
  *   **Verdict:** This counts as **High Weight**, but results in a probability near 50% (maximum uncertainty about the outcome, but high confidence in that uncertainty).
  *   **Explanation:** If you have 1,000 inspections showing 50% failure, your Weight is high. Your probability is 50%. You should not be "reluctant" in the sense of doubting your number; your number is robust. The fragility is low. The reluctance here would stem from the payoff structure (risk aversion), not the evidence quality. This distinguishes Weight from Probability: High Weight can support a 50% probability just as easily as a 90% probability.

  ### The Normative Question: Is it Rationally Decision-Relevant?

  This is the crux of the early twentieth-century debate and remains unresolved.

  **The Standard Bayesian View (No):**
  On a strict Bayesian view, a probability *is* the summary of all available evidence. Once you have condensed your evidence into a credence (60%), the "history" of how you got there is irrelevant. The evidence is "sunk." If two agents have the same credence and face the same payoffs, they *ought* to act identically. To do otherwise is a violation of the Sure Thing Principle. On this view, the reluctance you observe is a cognitive bias, a failure to trust the own's probability assignment.

  **The Robust Decision Theory View (Yes):**
  A serious tradition (Keynes, Isaac Levi, G.L.S. Shackle, and modern proponents of Imprecise Probability) argues that Weight is decision-relevant.
  *   **The Claim:** Rationality requires maximizing expected utility *relative to what is known*. When Weight is low, what is known is less secure.
  *   **The Mechanism:** This is often modeled by replacing single probabilities with **sets of probabilities**. The thin-evidence agent doesn't just have 60%; they have a set [40%, 80%] whose center is 60%. The thick-evidence agent has a narrow set [58%, 62%].
  *   **The Action:** If an agent is ambiguity-averse (preferring to maximize the minimum expected utility across the set), they will act differently. The thin-evidence agent sees a worse worst-case scenario than the thick-evidence agent.
  *   **Conclusion:** It is rationally decision-relevant if one accepts that **uncertainty about the probability itself** (second-order uncertainty) is a distinct risk factor from the uncertainty of the outcome. If you accept that distinguishing between "known risk" and "estimated risk" is rational, then Weight matters.

  ### Relation to Your Half-Remembered Cases

  1.  **The Two Urns (Ellsberg):**
      *   **Fit:** Exact in spirit, loose in mechanics.
      *   **Explanation:** The Ellsberg urn is the limiting case of Weight. The known urn has infinite Weight (composition specified); the unknown urn has zero Weight. Your clinicians are intermediate cases: both have assigned a number, but one assignment is closer to the "known urn" ideal than the other.
  2.  **Refusing a Number (Ranges):**
      *   **Fit:** Exact.
      *   **Explanation:** Offering a range instead of a number is a direct linguistic marker of low Weight. It is an attempt to communicate the Weight explicitly because a single number hides it.
  3.  **Confidence Tracks Coherence (Psychology):**
      *   **Fit:** Loose/Distinct.
      *   **Explanation:** This psychological finding (often associated with Kahneman) describes a *bias*: humans feel confident when a story hangs together, regardless of evidence quantity. Your phenomenon is the *normative* or *structural* difference in evidence quantity. The psychological finding explains why agents might *misjudge* Weight (feeling high weight on a coherent story), but it does not explain the actual evidential difference you are observing between the two clinicians.

  ### Summary Definition

  **Evidential Weight** is the measure of the quantity and quality of relevant evidence supporting a probability judgment, distinct from the magnitude of the probability itself.
  *   **High Weight:** Probabilities are stable (resilient) under new evidence; agents are rationally permitted to act decisively on them.
  *   **Low Weight:** Probabilities are volatile (fragile); agents are rationally permitted (under non-standard decision theories) to exhibit caution or ambiguity aversion, even at identical expected values.

  It is the dimension along which your clinicians differ. The first has high weight; the second has low weight. Standard Bayesianism demands they ignore this difference; robust decision theory demands they respect it.
