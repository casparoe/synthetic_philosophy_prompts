  2.  **The Ellsberg Paradox / Ambiguity Aversion:** Preference for known probabilities over unknown ones.
  3.  **Second-Order Probability:** Assigning a probability distribution to a first-order probability.
  4.  **Psychological Confidence:** The subjective feeling of certainty independent of accuracy.
  5.  **Calibration:** The long-run frequency with which an agent's probability assignments match outcomes.
  6.  **Evidential Weight (Keynes):** The amount of relevant evidence supporting a probability judgment, distinct from the judgment's magnitude.
  7.  **Resilience (Skyrms):** The stability of a belief under new evidence.
  8.  **Imprecise Probabilities:** Representing belief as a range rather than a point.
  9.  **Source Reliability:** Trust in the origin of the information.
  10. **Robustness:** Insensitivity of a conclusion to changes in assumptions.

  **Eliminations:**
  *   **Knightian Uncertainty:** Rejected. Knight distinguishes cases where probabilities *cannot* be formed from those where they can. Your agents *have* formed identical probabilities (60%), so this is not pure Knightian uncertainty.
  *   **Psychological Confidence:** Rejected. This refers to a subjective feeling or heuristic bias. Your scenario describes a structural difference in the evidential basis (sample size, history) between two competent agents, not merely a difference in feeling.
  *   **Calibration:** Rejected. Calibration is a long-run property of an agent's track record. While related, it does not capture the specific evidential bulk supporting a *single* current judgment.
  *   **Second-Order Probability:** Rejected. This is a formal modeling tool (a distribution over probabilities) rather than the name of the phenomenon itself. It describes *how* to model the difference, not *what* the difference is.
  *   **Source Reliability:** Rejected. Too narrow. The difference isn't just about the source's trustworthiness, but the volume and variety of the evidence processed.
  *   **Imprecise Probabilities:** Rejected. This is a formal framework that accommodates the phenomenon, but not the name of the phenomenon itself.
  *   **Resilience:** Strong candidate, but usually refers specifically to the stability property. **Evidential Weight** is the broader historical term that encompasses both the bulk of evidence and its stabilizing effect.
  *   **Robustness:** Good descriptive term, but in philosophy and decision theory, **Weight** is the established technical term for this specific dimension of evidence.

  **Settled Concept:** **Evidential Weight** (often simply **Weight**).

