  ### Examiner's Rubric Reconstruction

  Before grading, I set out the standards required for a first-class answer to ensure consistency and defensibility.

  **Part A (i):** Must identify the maxim of Relation. Crucially, must distinguish *flouting* (ostentatious failure to generate implicature) from *violating* (secret failure to deceive) or *infringing* (unintentional failure). Must explain that only flouting preserves the assumption of Cooperation at a deeper level, triggering the inference.
  **Part A (ii):** Must classify as Conversational Implicature (Particularized). Must apply two diagnostics correctly (e.g., Cancellability works; Detachability works; Embedding fails). Must explain *why* the diagnostic result points to CI.
  **Part A (iii):** Must distinguish truth-conditions ("what is said") from pragmatic inference. Must locate the falsity in the implicature, not the assertion. Must confirm Gricean apparatus handles this (no lie, but misleading).
  **Part B (a):** Must identify content as non-conversational (due to grammatical encoding). Must distinguish "What is Said" vs. "Conventional Implicature". Must apply diagnostics knowing that both Said and CI are non-detachable (unlike CI*).
  **Part B (b):** Must recognize that non-detachability rules out Conversational Implicature but *does not* distinguish Said from Conventional Implicature (both are attached to words/forms). Must question the test's validity when no alternative form exists.
  **Part B (c):** Must follow the hypothetical constraint ("Suppose... conventional implicature"). Must argue whether Quality applies to CI. Must distinguish truth-conditional falsity from conventional infelicity.

