answer: |-
  ### I. The Mapping: Actors, Options, and Evidence

  To evaluate the theoretical stakes, we must first fix the empirical terrain. The 2006 episode was not a discovery event but a legislative one.

  **The Actors**
  1.  **The IAU General Assembly:** The voting body (~2,500 astronomers present in Prague). They held the institutional authority to standardize nomenclature.
  2.  **The WGSB Committee (Iwan Williams):** Proposed the tripartite definition (orbit, hydrostatic equilibrium, clearing). This was the "dynamical" camp, prioritizing orbital architecture.
  3.  **The Gingerich Committee:** Proposed a "Plutonian" compromise. Keep Pluto (and Eris, Charon, Ceres) as planets, creating a subcategory for the new Kuiper Belt objects. This was the "geophysical/cultural" camp.
  4.  **The Dissenting Planetary Scientists:** (e.g., Alan Stern, New Horizons PI). Rejected the IAU vote as procedurally flawed (too few voters) and scientifically inferior (ignoring geophysics). They continue to use the geophysical definition.
  5.  **The Consumers:** Textbook writers, planetarium curators, educators. They bear the cost of the switch (pedagogical friction) and enforce the new norm.

  **The Options**
  1.  **Dynamical (Adopted):** A planet must clear its orbital neighborhood. *Evidence:* N-body simulations showing Pluto shares its orbit with Kuiper Belt Objects (KBOs). *Consequence:* Pluto is a dwarf planet.
  2.  **Geophysical (Dissenters):** A planet must be rounded by self-gravity. *Evidence:* New Horizons data (2015) showing Pluto has cryovolcanism, tectonics, and differentiation. *Consequence:* Pluto is a planet; so are Eris, Ceres, potentially dozens more.
  3.  **Cultural (Rejected):** A planet is what tradition says is a planet. *Evidence:* Historical continuity, public attachment. *Consequence:* Pluto remains a planet; Eris might not.

  **The Evidence Weighing**
  *   **Orbital Dynamics:** Heavily favored the IAU resolution. Pluto's mass is 0.07% of its orbital zone mass; Earth's is 1.7 million times its zone mass.
  *   **Geophysics:** Heavily favored the dissenters. Pluto is more geologically active than Mars.
  *   **Pedagogy:** Mixed. 8 planets is easier to teach than 13, but "dwarf planet" adds categorical complexity.
  *   **Culture:** Heavily favored Pluto's retention.

  ---

  ### II. The Theoretical Analysis

  Your friend argues that because the non-linguistic facts about Pluto remained constant while the truth-value of "Pluto is a planet" flipped, truth must be deflationary. The change was in the *word*, not the *world*, and deflationism is the only view that admits this without positing a mysterious change in reality. You argue that this makes truth epiphenomenal to the real work (meaning, convention, utility).

  Here is the case run through your four specific challenges.

  #### (a) The 1995/2008 Ascription and the Field Objection

  **The Case:** An astronomer asserts *S*: "Pluto is a planet" in 1995. In 1995, *S* is true. In 2008, *S* is false. The deflationist says the proposition expressed by *S* changed because the meaning of "planet" changed. The Equivalence Schema (ES) holds at *t1* and *t2*, but the instances differ.

  **The Cost:** To sustain this, the deflationist must provide a theory of *meaning change* that explains why the truth-value flipped without appealing to truth itself. This is precisely Hartry Field's critique: deflationism about truth is purchased by inflationism about meaning. You cannot explain the 1995/2008 shift solely by saying "the usage changed." You must explain *why* that usage change dictates a truth-value change rather than just a change in subject matter.

  **My Verdict:** I side with you against your friend on the cost. The deflationist claims this is an "honest division of labour," but in the Pluto case, the labour is not divisible. The "meaning" of *planet* is not independent of the "truth" of planetary claims; they are co-constituted by the scientific norms the IAU attempted to codify. If the deflationist relativizes the ES to times or linguistic stages (ES-at-*t*), they have reintroduced a substantive parameter (time/stage) that does the explanatory work truth was supposed to do.
  To say "The sentence changed truth values because the meaning changed" is to say "The truth changed because the conditions for truth changed." If the *only* account of those conditions is linguistic convention, then truth is not merely deflated; it is eliminated as a normative constraint. The Field objection holds here: the deflationist cannot account for the *stability* of the 1995 assertion's truth without a substantive theory of content that deflationism explicitly disavows. It is not a division of labour; it is a shell game.

  #### (b) The Cultural Definition and Consensus

  **The Case:** Had the IAU adopted the "Cultural" definition (a planet is what people say is a planet), would "Pluto is a planet" be true in virtue of social consensus?

  **The Analysis:** If the definition is adopted, the sentence "Pluto is a planet" is true iff Pluto is a planet. If "planet" is defined by consensus, then "Pluto is a planet" is true iff there is consensus.
  Your friend would say this is not a consensus *theory of truth*, but a consensus theory of *meaning*, to which deflationary truth is applied.
  However, this distinction collapses under pressure. If the *only* fact fixing the truth conditions of planetary claims is social agreement, then the *property* of being true (even if deflationary) tracks social agreement.
  **The Verdict:** It is an *apparent* collapse, but a damaging one. Deflationism insists truth is not a natural kind. But if the application of the truth predicate in this domain is entirely exhausted by checking a sociological fact (do enough people accept Pluto?), then truth in this domain *functions* exactly as a consensus property. The deflationist can maintain the technical distinction (truth is transparent, meaning is social), but they cannot deny that the *epistemic access* to truth here is purely sociological. This concedes the substantive point: in institutional sciences, truth is often indistinguishable from authorized assertion. Deflationism survives technically but loses its philosophical bite, as it cannot distinguish between "true by consensus" and "true by nature" without importing substantive metaphysics it claims to reject.

  #### (c) Generalizations and the Expressive Function

  **The Case:** "Everything the 2006 Resolution implies is true." "My childhood belief was false."
  Deflationism's strongest card is the expressive function: the truth predicate allows us to endorse infinite conjunctions or quantify over propositions we cannot list.

  **The Analysis:** The deflationist handles the logic easily: "For all *p*, if the Resolution implies *p*, then *p*." This allows the astronomer to endorse the new paradigm without listing every orbital dynamic.
  **The Failure:** The expressive function handles the *syntax* of endorsement, but not the *normativity* of correction. When you say, "My childhood belief was false," you are not just quantifying over past sentences; you are marking a *failure of fit* between belief and world.
  In the Pluto case, the "falsity" of the 1995 textbook is not a logical error; it is an institutional obsolescence. The deflationist says the textbook is "false" because "planet" now means Y. But this fails to explain why the textbook *ought* to be updated. If truth is just a device for endorsement, why is the 2008 endorsement *better* than the 1995 one? The deflationist must appeal to "utility" or "convention," but these are not truth-theoretic notions.
  **The Verdict:** The expressive function covers the *ascriptions*, but it does not cover the *explanatory work* those ascriptions do in the episode. We use "true" and "false" here to mark scientific progress vs. regress. Deflationism renders this marking as merely "current usage vs. past usage." It cannot account for the *authority* of the correction. It treats the 1995 textbook as a foreign language translation error, not a scientific mistake. This is a significant silence.

  #### (d) The "Charter Dispute" Distinction

  **The Case:** You define a "charter dispute" as one where parties agree on non-linguistic facts but dispute which concept an institution will charter, thereby changing what is true.

  **The Analysis:** Can deflationism mark this distinction?
  To mark a "charter dispute" distinct from a "fact dispute," one must be able to point to something stable (the facts) and something variable (the charter/concept).
  Deflationism, strictly speaking, dissolves this. For a deflationist, there are only sentences and their use conditions. If the use conditions change (the charter), the truth conditions change. There is no residual "fact of the matter" about Pluto that persists through the change, except as expressed in sentences whose truth values also shift.
  If the deflationist says, "The mass of Pluto didn't change," they are using the truth predicate on mass-claims. But if the concept of "planet" is partly constitutive of how we group mass-claims, the deflationist has no meta-language to stand outside the charter and say, "This is just a verbal change."
  **The Verdict:** Deflationism *must* dissolve the distinction. It treats the 2006 vote as a change in linguistic policy, full stop. It cannot validate your intuition that a "charter dispute" is a specific *kind* of scientific event distinct from a discovery.
  **The Cost:** Dissolving the distinction validates your friend's "verbal dispute" claim but at the cost of making scientific legislation indistinguishable from dictionary editing. If deflationism cannot distinguish between "We found a new moon" (fact) and "We redefined planet" (charter) without appealing to substantive notions of reference or natural kinds, it is silent on the structure of scientific practice. It treats the IAU vote as identical in logical kind to a change in the definition of "bachelor." This is a category error regarding how science works.

  ---

  ### III. Final Assessment

  **Does the episode confirm deflationism?**
  No. It confirms that truth-ascriptions are sensitive to linguistic convention, which deflationism predicts, but it also reveals that truth-ascriptions in science carry normative and explanatory weight that deflationism cannot account for.

  **Is it an anomaly?**
  It is a stress test. Deflationism works well for static languages. It struggles with *evolving* technical languages where the evolution itself is the object of dispute. The Pluto case is not an anomaly for the *logic* of truth, but it is an anomaly for the *philosophy of science* that deflationism often tacitly assumes.

  **Where is the theory silent?**
  It is silent on **normativity**. Deflationism can tell you why "Pluto is a planet" is false in 2008 (because of usage). It cannot tell you why the IAU was *justified* in changing the usage, nor why the dissenters are *wrong* to keep the old one, other than by pointing to the vote count. It has no resources to explain why the dynamical definition is *better* than the geophysical one, because "better" implies a substantive aim of inquiry (e.g., "carving nature at the joints") that deflationism rejects.

  **Honest Conclusion:**
  Your friend is right that deflationism captures the *mechanism* of the shift (change in use = change in truth value). You are right that this captures only the mechanism and misses the *point*. The episode shows that deflationism is a sufficient logic for truth, but an insufficient philosophy for scientific change. It explains how the truth-value flipped, but it cannot explain why we cared that it did. If a theory of truth cannot distinguish between a change in truth due to discovery and a change in truth due to legislation without importing substantive metaphysics elsewhere, it has not saved us from metaphysics; it has merely hidden the bill. Field was right: the debt comes due in the theory of meaning. In the Pluto case, the debt is bankrupt.
