      *   Authoritative Disclosure: Explain that consent requires understanding the *kind* of activity.
      *   Conditions: Necessity justification, Consent wording, Debriefing protocol, Data withdrawal.
      *   Sign-off.

  8.  **Final Polish:** (Writing the actual response based on the above thought process). *Make sure to emphasize that the PIs need to respond to the reasoning, not just check boxes.*

