answer: |-
  **MEMORANDUM**

  **TO:** Principal Investigators, Moral Framing and Attribution Project
  **FROM:** Department of Philosophy Research Ethics Panel
  **DATE:** October 26, 2023
  **SUBJECT:** Ethical Review Decision regarding Proposal #24-09 (Moral Blame Attribution)

  **DECISION:** **Approved with Mandatory Modifications**

  **1. Overview of Deliberation**
  The Panel has reviewed the proposed study regarding the effects of linguistic framing on victim-blaming attribution. We understand the methodological rationale for the cover story (describing the task as "reading comprehension strategies") to prevent demand characteristics from skewing the data. However, the Panel engaged in significant debate regarding the ethical permissibility of withholding the true normative nature of the task from participants prior to their engagement.

  While some Panel members initially argued that the cover story constitutes "misleading" rather than "lying," and is therefore mitigated by the post-study debrief, the majority consensus is that this distinction does not resolve the core ethical concern. The central issue is not merely the truth-value of the researcher's statements, but the integrity of the participant's consent.

  **2. Ethical Reasoning and Requirements**
  The Panel's decision rests on three primary ethical considerations. The Principal Investigators (PIs) must address these in their revised protocol.

  **A. The Insufficiency of the "Lying vs. Misleading" Distinction**
  The Panel rejects the argument that misleading a participant is ethically distinct from lying in the context of informed consent. Both practices function to bypass the participant's rational deliberation regarding what they are being asked to do. If a participant believes they are testing reading strategies, they cannot consent to the actual activity, which is making moral judgments about victims. The subsequent debriefing, while necessary, is remedial; it cannot retroactively validate consent that was absent at the moment of participation. Therefore, the burden is on the PIs to demonstrate why no alternative methodology (e.g., naturalistic observation, less opaque framing) could achieve the research goals.

  **B. Authoritative Disclosure and Normative Stakes**
  In evaluating the consent process, the Panel is applying the standard of *authoritative disclosure*. This concept posits that valid consent requires more than the absence of explicit falsehoods; it requires the active presentation of the study's normative stakes.

  In medical ethics, this often pertains to physical risk. In moral psychology and philosophy, the "risk" is often normative or psychological. Participants are being asked to engage in moral evaluation, potentially attributing blame to victims of harm. This carries a different normative weight than a standard cognitive task. By framing the study as "reading comprehension," the proposal fails to disclose the *kind* of agency the participant is exercising. Under the standard of authoritative disclosure, the consent form must signal the normative nature of the task sufficiently to allow the participant to authorize that specific type of engagement, even if the specific hypothesis remains concealed.

  **C. Autonomy and the Right to Withdraw**
  Because the true nature of the study is withheld, the participant's autonomy is constrained during the task. To mitigate this, the debriefing process must be robust. It is not sufficient to simply reveal the true purpose. The participant must be given a meaningful opportunity to withdraw their data *after* understanding the true nature of the study. Many participants may be comfortable judging reading passages but uncomfortable knowing they were used to measure victim-blaming tendencies. Their right to refuse participation must extend to the post-hoc use of their data.

  **3. Mandatory Conditions for Approval**
  To proceed, the PIs must submit a revised protocol addressing the following:

  1.  **Justification of Deception:** A brief addendum explaining why the "reading comprehension" cover story is methodologically necessary and why a less deceptive framing (e.g., "a study on how people process stories about accidents") would invalidate the results.
  2.  **Revised Consent Language:** The consent form must incorporate elements of authoritative disclosure. While you may not reveal the hypothesis, the form should indicate that the study involves "evaluating scenarios involving interpersonal harm" or "making judgments about described events." This ensures the participant knows they are engaging in moral evaluation, not merely linguistic processing.
  3.  **Enhanced Debriefing Protocol:** The debriefing script must explicitly explain the victim-blaming component. It must include a clear mechanism for the participant to request their data be destroyed immediately following this revelation, without penalty or pressure.
  4.  **Distress Mitigation:** Given the subject matter (victim-blaming), the debriefing must include resources or a statement acknowledging that feeling discomfort about the task is normal and expected.

  **4. Next Steps**
  Please submit the revised materials within fourteen days. The Panel Chair will review these modifications. If they are deemed sufficient to satisfy the requirements of authoritative disclosure and autonomy protection, the study may proceed without a full panel reconvening. If the PIs believe these conditions fundamentally undermine the research design, you are invited to request a follow-up meeting to argue for a waiver, though the Panel remains skeptical that the current level of opacity is justifiable.

  We appreciate the scientific value of this research but maintain that in moral psychology, the ethics of the method must align with the normative seriousness of the subject matter.

  Sincerely,

  **Department of Philosophy Research Ethics Panel**
