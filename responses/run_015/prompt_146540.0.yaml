  1.  **Analyze the Request:**
      *   **User Role:** Philosophy PhD student on a departmental research ethics panel.
      *   **Task:** Write the panel's decision memo regarding a research proposal.
      *   **Proposal Details:** Study on moral blame attribution. Deception involved: telling subjects it's about "reading comprehension strategies" (cover story) when it's actually about framing effects on victim-blaming. Debriefing occurs immediately after.
      *   **Panel Conflict:** Some members say it's misleading but not lying (and debriefing fixes it); others say informed consent is violated regardless (autonomy issue).
      *   **Specific Requirement:** Incorporate the supervisor's concept of "authoritative disclosure" (consent requires active presentation of normative stakes, not just absence of falsehoods).
      *   **Recommendation:** Approve with conditions, reject, or other (needs justification).
      *   **Tone:** Formal enough to send, but accessible (no citations needed).
      *   **Goal:** Provide reasoning the Principal Investigators (PIs) can respond to.

  2.  **Determine the Ethical Stance/Decision:**
      *   *The Conflict:* Deception in social science is common but ethically fraught. The "lying vs. misleading" distinction is weak in ethics if the intent is to bypass informed consent. The "debriefing fixes it" argument is standard but doesn't address the initial violation of autonomy.
      *   *The Supervisor's Concept:* "Authoritative disclosure" adds a layer. It suggests that even if you don't lie, you must actively ensure the participant understands the *nature* and *stakes* of what they are doing. Mere absence of falsehood isn't enough; there must be positive clarity.
      *   *The Decision:* A flat rejection might be too harsh for a standard social psych/philosophy experiment, but a flat approval ignores the valid concerns. "Approve with Conditions" is the most constructive path. It forces the PIs to justify the deception (necessity), minimize harm, and strengthen the debriefing/consent process to align with "authoritative disclosure."
      *   *Why this decision?* It acknowledges the scientific value while upholding ethical rigor. It gives the PIs a path forward but demands they address the autonomy concern seriously.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose of the memo and the decision (Approved with Modifications/Conditions).
      *   **Summary of Proposal:** Briefly recap the study to show understanding.
      *   **Ethical Analysis (The Core):**
          *   Address the Deception: Acknowledge the "misleading vs. lying" debate. Dismiss it as insufficient. The core issue is *informed* consent.
          *   Address Autonomy: Explain why withholding the true purpose undermines the participant's ability to choose.
          *   Integrate "Authoritative Disclosure": This is crucial. Define it in this context. It's not just "we didn't lie," it's "did we actively ensure you understood the normative weight?" Since they hid the topic (victim-blaming), they failed this.
          *   Address Debriefing: Acknowledge it helps but doesn't erase the initial breach. It must be robust.
      *   **Conditions/Requirements:** What do the PIs need to do?
          *   Justify necessity of deception (could it be done otherwise?).
          *   Enhance the consent form (hint at sensitive topics without ruining the study?).
          *   Strengthen debriefing (ensure no lingering distress about victim-blaming).
          *   Right to Withdraw Data (post-debrief).
      *   **Closing:** Instructions on how to resubmit/respond.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Authoritative Disclosure" too medical?
      *   *Fix:* Adapt it to social science. In medicine, it's about risks/side effects. In philosophy/psych, it's about the *moral nature* of the task. If I'm judging a victim, I need to know I'm part of a study on judgment, not just reading.
      *   *Critique:* Is the tone right?
      *   *Fix:* Keep it professional, collegial, but firm. Avoid overly academic jargon where possible, but use the philosophical concepts requested.
      *   *Critique:* Did I answer the "lying vs. misleading" debate?
      *   *Fix:* Yes, explicitly state that the panel finds this distinction ethically negligible in the context of consent.

  5.  **Final Polish:**
