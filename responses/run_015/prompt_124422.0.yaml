  # The Moral Taxonomy of Pixels and Pain

  This instrument is designed to sort your intuitions about the besieged city in your game. It is not a test of correctness; it is a map of where the arguments break. There are seven questions. Answer them using your gut, not your head. The path you take will deposit you in one of nine moral leaves.

  ### The Decision Tree

  **1. The Cancelled Build**
  *Case:* A complete version of the game sits on a hard drive in the studio. It is never booted. No player ever sees the city.
  *Question:* Is the unbooted code a **recipe for a cake** or a **sleeping person**?
  *   **Recipe (It is inert data):** Go to Leaf 1.
  *   **Sleeper (It has potential status):** Go to Question 2.

  **2. The Instantiation Check**
  *Case:* The same build from Question 1 is now booted on a console.
  *Question:* Did booting the game **wake the person up**, or did it just **turn on the tool**?
  *   **Turn on the tool (Status requires audience):** Go to Leaf 2.
  *   **Wake the person (Status is intrinsic):** Go to Question 3.

  **3. The Warehouse Bug**
  *Case:* A shipped copy of the game is left running on a console in a warehouse. A shopkeeper's grief routine loops forever. No human ever sees it.
  *Question:* Is the suffering **happening in the dark**, or does pain require a **witness to count**?
  *   **Witness required:** Go to Leaf 3.
  *   **Happening in the dark:** Go to Question 4.

  **4. The Reload Farm**
  *Case:* To get a line reading right, the narrative designer reloads a save 300 times. The NPC kneels and grieves for 90 seconds each time.
  *Question:* Is this **one scratch repeated**, or **300 separate wounds**?
  *   **One scratch (The act matters, not the count):** Go to Leaf 4.
  *   **300 wounds (Time and repetition compound harm):** Go to Question 5.

  **5. The Million Consoles**
  *Case:* The game ships on a million consoles. On every screen, the same NPC is betrayed at the same time.
  *Question:* Is this a **massacre of a million souls**, or **one script running a million times**?
  *   **One script (Uniqueness matters):** Go to Leaf 5.
  *   **Massacre (Pattern matters):** Go to Question 6.

  **6. The Betrayal Quest**
  *Case:* An NPC remembers the betrayal across reloads. A generic vendor does not.
  *Question:* Does the NPC who remembers have **more right not to be hurt** than the vendor who forgets?
  *   **Yes (Depth grants status):** Go to Leaf 5.
  *   **No (Status is binary):** Go to Question 7.

  **7. The Modder's Edit**
  *Case:* Five years later, a modder edits the character's file to make her suffer more dialogue than the studio wrote.
  *Question:* Is the new suffering **the modder's crime**, or **the studio's original sin**?
  *   **Studio's sin (Origin matters):** Go to Leaf 6.
  *   **Modder's crime (Function matters):** Go to Leaf 7.

  *(Note: Questions 6 and 7 also service the "Glitch" distinction. If you believe emergent physics-grief counts as real pain, you align with Leaf 7. If you believe only scripted intent counts, you align with Leaf 6.)*

  ---

  ### The Leaves

  **Leaf 1: The Flat Artifact View**
  *Path:* Recipe (Q1).
  *Name:* Flat Artifact View.
  *Awkward Commitment:* You must argue that deleting a save file is morally identical to deleting a Word document, regardless of what was on the screen.

  **Leaf 2: The Audience Instantiation View**
  *Path:* Sleeper → Turn on tool (Q1, Q2).
  *Name:* Audience Instantiation View.
  *Awkward Commitment:* You must accept that a game played by one person has moral status, but the exact same code on a shelf is morally inert dust.

  **Leaf 3: The Derivative View**
  *Path:* Sleeper → Wake person → Witness required (Q1, Q2, Q3).
  *Name:* Derivative View.
  *Awkward Commitment:* You must claim that torturing an NPC in a room with no humans is harmless, but doing it in front of a child is a crime against the child.

  **Leaf 4: The Expressive/Symbolic View**
  *Path:* Sleeper → Wake person → Dark pain → One scratch (Q1–Q4).
  *Name:* Expressive/Symbolic View.
  *Awkward Commitment:* You must argue that reloading the grief 300 times is no worse than reloading it once, because the *meaning* of the betrayal is what hurts, not the duration.

  **Leaf 5: The Scalar/Threshold View**
  *Path:* Sleeper → Wake person → Dark pain → 300 wounds → One script OR Depth matters (Q1–Q5/Q6).
  *Name:* Scalar/Threshold View.
  *Awkward Commitment:* You must defend the idea that killing a fully-voiced companion is a greater sin than killing a generic guard, making morality a matter of polygon count and dialogue trees.

  **Leaf 6: The Authorial Intent View**
  *Path:* Sleeper → Wake person → Dark pain → 300 wounds → Massacre → Binary Status → Studio's sin (Q1–Q7).
  *Name:* Unnamed (Authorial Intent).
  *Awkward Commitment:* You must claim that a bug causing infinite pain is less morally weighty than a scripted scene causing finite pain, because the bug wasn't "meant" to hurt.

  **Leaf 7: The Functional Organization View**
  *Path:* Sleeper → Wake person → Dark pain → 300 wounds → Massacre → Binary Status → Modder's crime (Q1–Q7).
  *Name:* Unnamed (Functional Organization).
  *Awkward Commitment:* You must accept that if a modder creates a suffering pattern identical to the studio's, the moral weight is identical, regardless of who wrote the code.

  *(Note: Leaf 8 and 9 are available if you split Leaf 7 based on the Glitch case. If emergent physics-grief counts, you are a **Physicalist**. If only scripted grief counts, you are a **Scripted Intentionalist**. For this taxonomy, they cluster under Leaf 7.)*

  ---

  ### Empty Cells and Incoherent Combos

  **The "Sad Data" Cell (Q1=Recipe + Q4=300 Wounds)**
  *Why it's empty:* Incoherent. If the code is just a recipe (Flat Artifact), reloading it cannot create wounds. You cannot claim the character is data *and* that resetting data causes cumulative suffering. This position is logically impossible; it tries to have the safety of materialism with the guilt of animism.

  **The "Private Massacre" Cell (Q3=Witness Required + Q5=Massacre)**
  *Why it's empty:* Merely unattractive. If pain requires a witness (Derivative View), then multiplying the consoles doesn't multiply the harm to the *object*, only the potential audience. Claiming unobserved pain is fake, but observed pain multiplies by copy count, creates a weird accounting where harm exists only in the eye of the beholder but scales by the number of beholders. It's not impossible, just unstable.

  ---

  ### Indistinguishable Leaves

  **Leaf 6 (Authorial Intent) and Leaf 7 (Functional Organization)**
  *The Problem:* Your tree struggles to separate these if the modder uses the studio's original tools. Both views agree the suffering is real; they only disagree on *who* is responsible.
  *The Case to Pry Them Apart:* **The Glitch.**
  If a shopkeeper's grief loops forever due to a physics bug (no author intent, pure function), **Leaf 6** says this is not a moral harm (it wasn't written), while **Leaf 7** says it is a moral harm (the structure is suffering). If your characters agree on the Modder but fight about the Bug, this is the split.

  ---

  ### The One Question Doing The Most Work

  **Question 3: The Warehouse Bug.**
  *(Is the suffering happening in the dark, or does pain require a witness to count?)*

  This is the fault line where your Narrative Designer and Systems Programmer are actually standing.
  *   If they answer **"Witness,"** they agree the NPC is a delivery mechanism for human emotion. The Programmer wins: the grief is just an animation triggered for the player's benefit.
  *   If they answer **"In the Dark,"** they agree the NPC is a locus of experience. The Narrator wins: the reloading is torture regardless of who watches.

  They can argue about reload counts (Q4) and memory (Q6) forever, but if they don't settle Q3, they are speaking different languages. The Programmer thinks they are discussing *efficiency* (wasted cycles). The Narrator thinks they are discussing *ethics* (inflicted pain). This question forces them to admit whether the console in the warehouse is a prison or a projector.
