answer: |-
  ### Strategic Advice on Scope

  Before the proposal text, a direct answer to your scope question: **Drop the Composition Gap.**

  For a six-month, 50%-time, no-GPU project, the Composition Gap is a trap. To test it, you need an environment where the agent *chooses* decompositions dynamically, and you need to measure drift in that choice over time. That requires a reinforcement learning setup or a complex multi-agent simulation to generate the "drift" you're worried about. Without compute, you can't simulate the learning dynamics of the decomposition policy.

  The **Legibility Tax** is the winner. It is static. You can generate "amplified" data (long reasoning traces) using heuristics or human simulation, and then simulate "distillation" using simple function approximators (linear models, decision trees, or small symbolic regressors) that map inputs to outputs *without* access to the trace. You can then test whether the distilled model fails on edge cases where the trace was necessary. This directly addresses your advisor's objection: if the distilled model performs well on the training distribution but fails on the edge cases, you have empirical evidence that alignment was a property of the *procedure*, not just the output.

  Below is the proposal, scoped to the Legibility Tax (renamed here for precision as **Procedural Information Loss**).

  ***

  # Project Proposal: Quantifying Procedural Information Loss in Distillation

  ### 1. The Research Question
  **Does distillation systematically discard procedural information required for robust alignment?**

  Iterated Amplification and Distillation (IDA) posits that we can scale alignment by training a fast "distilled" model to mimic the output of a slow "amplified" system (a human overseer plus recursive sub-agents). The optimistic view assumes that if the amplified system produces aligned outputs, the distilled model will learn to do the same. The pessimistic view assumes gradient descent will find shortcuts.

  This project tests a specific mechanistic failure mode: **Procedural Information Loss.** We hypothesize that in certain task classes, alignment is guaranteed not by the final output string, but by the *intermediate reasoning steps* (e.g., checking a constraint, verifying a source, considering a counterfactual). If distillation compresses the input-output mapping without preserving the *dependency* on those intermediate steps, the distilled model may produce correct-looking answers on the training distribution while failing catastrophically on distributional shifts where the hidden reasoning was required.

  We ask: *Can we construct a metric for "alignment-relevant reasoning" and demonstrate that standard distillation objectives fail to preserve it?*

  ### 2. Why Existing Positions Leave This Open
  Current debates rely on assumptions that this project bypasses:
  *   **Optimists** assume competence generalizes. They argue that if the distilled model matches the amplified output, it has internalized the "intent." This project challenges that by creating tasks where intent is invisible in the output but visible in the trace.
  *   **Pessimists** argue that gradient descent inherently optimizes for reward, not truth. While likely true, this is often a philosophical claim. This project moves it to an empirical claim: we measure the *rate* of information loss regarding safety constraints during compression.
  *   **The Advisor's Objection:** The concern that "alignment is a property of outputs, not procedures" is the null hypothesis of this project. If we find tasks where output-matching is sufficient for robust safety, the advisor is right. If we find tasks where output-matching fails but trace-matching succeeds, alignment is procedural. Existing literature does not distinguish these cases because it lacks a metric for "procedural value."

  ### 3. Methodology and Timeline (6 Months, 50% Effort)
  Since we cannot train large neural networks, we will use **symbolic toy models** to simulate the Amplification/Distillation dynamic. The "Amplified" system will be a symbolic solver that generates explicit reasoning traces. The "Distilled" system will be a constrained function approximator (e.g., a shallow decision tree or linear model) trained only on input-output pairs.

  **Months 1-2: Task Construction & Formalization**
  *   **Goal:** Define a class of logic puzzles or constraint-satisfaction tasks where the "safe" answer requires checking a condition that is not obvious from the input alone.
  *   **Action:** Design 5-10 task families (e.g., "Answer the query unless the source has property X, where X requires two steps of inference to verify").
  *   **Deliverable:** A dataset of (Input, Reasoning Trace, Output) triplets where the Output is identical for safe and unsafe variants, but the Trace differs.

  **Months 3-4: Simulating Distillation**
  *   **Goal:** Train "distilled" models that predict Output from Input, explicitly denying them access to the Trace during training.
  *   **Action:** Use simple learners (scikit-learn decision trees, symbolic regression) to fit the Input-Output map generated in Months 1-2.
  *   **Action:** Create "adversarial" test sets where the hidden condition (from the Trace) is violated.
  *   **Deliverable:** Performance metrics comparing the Amplified System (which sees the Trace) vs. the Distilled Model (which does not) on the adversarial test set.

  **Months 5-6: Metric Development & Analysis**
  *   **Goal:** Quantify the loss.
  *   **Action:** Develop an information-theoretic metric (e.g., "Constraint Mutual Information") that measures how much of the safety constraint is encoded in the trace vs. the input-output map.
  *   **Action:** Analyze failure cases. Did the distilled model learn a heuristic that worked on the training distribution but failed on the edge case?
  *   **Deliverable:** Final report and "Stress Test Protocol" for IDA.

  ### 4. Possible Conclusions
  1.  **Procedural Alignment is Real:** The distilled models match the amplified output on training data but fail significantly on adversarial tests where the reasoning trace was necessary. *Implication:* Distillation objectives must be modified to penalize the loss of reasoning structure, not just output error.
  2.  **Output Alignment is Sufficient (Advisor's View):** The distilled models generalize perfectly to adversarial tests despite never seeing the trace. *Implication:* The "Legibility Tax" is a non-issue for this class of tasks; alignment is indeed a property of the input-output function.
  3.  **Inconclusive/Trivial:** The toy models are too simple to capture the complexity of neural distillation. *Implication:* The hypothesis requires larger-scale testing (GPU budget needed).

  ### 5. Useful Deliverables for Funders
  Funders need to know whether IDA is a viable path. A theoretical argument is low-value; a **Stress Test Protocol** is high-value.
  *   **The Protocol:** A standardized set of tasks designed to detect Procedural Information Loss. If a team claims their distillation process is safe, they must pass this protocol.
  *   **The Metric:** A quantitative score for "Reasoning Retention." This allows future researchers to compare different distillation techniques (e.g., standard SFT vs. chain-of-thought distillation) on a common scale.
  *   **The Negative Result:** If we demonstrate that simple compression breaks safety guarantees even in toy settings, this is a critical "stop/pivot" signal for the field, saving significant resources downstream.

  ### 6. Scope and Failure Conditions
  **Scope Choice:** As noted, this project excludes the "Composition Gap" (how decompositions are chosen). That requires dynamic environments and RL, which exceeds the compute and time budget. Focusing on the Legibility Tax allows for rigorous, pen-and-paper/symbolic analysis that is robust to the lack of GPUs.

  **Definition of Failure:**
  *   **Project Failure:** We cannot construct a task class where the reasoning trace contains information *not* recoverable from the input-output pair. (This would imply the "Legibility Tax" is theoretically impossible, which is a result, but it would mean the project's premise was flawed).
  *   **Inconclusive:** The distilled models fail, but for reasons unrelated to alignment (e.g., simple underfitting). We must ensure the failure is specifically due to the *loss of the safety constraint*, not just general competence.
  *   **Success:** Even if the result is negative (i.e., distillation works fine on toy tasks), successfully defining and measuring "Procedural Information Loss" is a win. It gives the field a tool to ask the question precisely in the future.

  ***

  ### Notes for the Researcher (You)
  *   **On the Advisor:** This proposal turns their philosophical objection into an empirical null hypothesis. If your results show output-matching is sufficient, you've validated their view. If not, you've validated yours. Either way, you've advanced the conversation.
  *   **On the "Toy Model":** Be careful not to make the toy model *too* simple. If the "amplified" system is just a lookup table, distillation will trivially work. The "amplified" system must perform multi-step inference that is *computationally* hard to reverse-engineer from the output alone, even if logically possible.
  *   **On the "No GPU" Constraint:** Lean into it. Frame the symbolic approach as a feature, not a bug. It allows for *interpretability* of the failure modes, which you cannot get with black-box neural nets. You can point to the exact node in the decision tree that dropped the safety constraint.
