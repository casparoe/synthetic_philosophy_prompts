      *   *Why Step (5) looks sound:* It appeals to fidelity. If the criterion is Consequentialism, surely the *gatekeeper* must be Consequentialism? It feels like cheating to use a non-consequentialist gatekeeper for a consequentialist system.
      *   *Why Step (5) is wrong:* It ignores the possibility of *non-calculative triggers* for overriding. We can have "alarm bell" dispositions. E.g., "If it feels intuitively monstrous, pause." This isn't a calculation; it's a visceral reaction trained by consequentialist understanding over time.
      *   *The Sealed/Porous Dichotomy:* It's a false dilemma.
