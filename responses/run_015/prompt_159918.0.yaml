answer: |-
  Your friend's argument is formidable. It is a polished version of a worry that has haunted indirect consequentialism since the days of Sidgwick, and it feels compelling because it exploits a genuine tension in your position. You are right to feel that it is 'up to something', but you are also right to suspect it does not quite land the fatal blow it claims.

  The diagnosis is this: your friend has constructed a false dilemma in step (2), which forces a fatal error in step (5). The argument relies on an overly intellectualised picture of how an agent manages the transition between 'disposition mode' and 'criterion mode'.

  Here is the breakdown of where the argument goes wrong, why it looked correct, and what you must surrender to fix it.

  ### The Diagnosis: Reject Step (5)

  Step (5) claims: *'That estimate is precisely the first-order consequentialist calculation whose cost was the original reason for abandoning first-order consequentialist calculation.'*

  This is the pivot on which the instability turns. Your friend assumes that the only way to judge whether to override a disposition is to run the very same cognitive programme (real-time expected value maximisation) that the dispositions were meant to replace.

  **Why Step (5) looked sound:**
  It appeals to what we might call the **Fidelity Intuition**. If the *criterion* of rightness is consequentialist, then any mechanism that permits deviation from a rule must surely be sensitive to consequences. To be sensitive to consequences, one must assess them. To assess them is to calculate. Therefore, the gatekeeper of the dispositions must be a calculator. It seems to follow that you cannot have a consequentialist justification for a disposition without eventually paying the consequentialist cognitive cost to police it.

  **Why Step (5) is mistaken:**
  It conflates *sensitivity to consequences* with *explicit consequentialist deliberation*.

  You can possess a **second-order disposition** that triggers an override without engaging in first-order calculation. Consider a trained firefighter. Their standard procedure is to follow drill (sealed dispositions). However, they also possess a 'sixth sense'—a gut feeling of impending collapse—triggered by subtle cues (heat, sound, smell) that they cannot articulate in real time. When this alarm bells, they abandon the drill.

  This alarm is not a calculation. It is a cultivated intuition. It is justified consequentially (we train firefighters this way because it saves lives), but its operation is non-calculative. It is a heuristic trigger, not a summing of utilities.

  Your friend argues that adding defeater clauses ('unless it would be cruel') just relocates the problem because you must calculate whether it is cruel. But if the defeater is not a clause you *read*, but a feeling you *sense*, the calculation does not occur. You do not need to compute the expected value of overriding; you need only to recognise a 'red flag' pattern that your moral upbringing has associated with disaster.

  ### The Sealed/Porous Dichotomy

  Your friend's step (2) presents a dichotomy: dispositions are either **sealed** (never override) or **porous** (override via judgment). This ignores a genuine third option.

  1.  **Sealed:** Follow the rule even if you know it leads to disaster. (Rule-worship).
  2.  **Porous (Friend's definition):** Follow the rule unless a calculation shows overriding is better. (Direct consequentialism).
  3.  **The Third Option (Trained Sensitivity):** Follow the rule unless a *non-calculative alert mechanism* is triggered.

  This third option is not merely a relabelling. For it to be distinct, the alert mechanism must satisfy two conditions:
  *   **Non-Computational:** It does not require weighing outcomes in real-time. It operates like a reflex or a perception (e.g., a visceral revulsion at the thought of harming an innocent, even for the greater good).
  *   **Consequentially Calibrated:** The sensitivity of this reflex was tuned over time by consequentialist reflection (perhaps during 'cool hours' of moral education), even if it is not deployed by calculation in the moment.

  If you adopt this, the 'handover rule' is not a rule at all. It is a psychological disposition to feel anxiety or resistance when certain contextual features obtain. This avoids the corrosion objection because you are not habitually calculating; you are habitually following rules, punctuated by rare, intuitive alarms.

  ### The Cost of This Rejection

  You can keep both the consequentialist criterion and the claim that non-consequentialist deliberation is the correct procedure, but you must soften the 'Split'. The cost is **architectural purity**.

  **1. The Criterion Bleeds into the Procedure**
  You can no longer maintain a clean wall between the 'criterion of rightness' and the 'decision procedure'. The criterion must shape the psychology of the agent deeply enough to install those 'alarm bells'. Your moral psychology cannot be *purely* deontological in its day-to-day operation; it must be deontology with consequentialist-shaped scars. The dispositions are not independent modules; they are consequentialist tools that look like virtues.

  **2. You Lose the 'Never Calculate' Claim**
  You cannot claim that you *never* engage in consequentialist calculation. You must admit that you do so during periods of moral reflection and education to calibrate your dispositions. Furthermore, when the 'alarm bells' ring, you may need to engage in *some* deliberation to resolve the crisis. The Split View becomes a **Default View**: non-consequentialist deliberation is the default, but the system retains a consequentialist emergency override that is intuitive rather than calculative.

  **3. Vulnerability to Error**
  By relying on trained intuition rather than calculation for the override, you admit the possibility of false positives and false negatives. Your 'alarm bells' might ring when they shouldn't, or fail to ring when they should. You must accept that your procedure is fallible in a way that direct consequentialism (in theory) is not. You are trading accuracy for efficiency and psychological stability, which is consistent with your view, but it is a concession your friend's argument tries to paint as a contradiction.

  ### Addressing the Generalisation (Step 7)

  Your friend argues this destroys any view separating rightness from decision procedure, including the 'Ideal Deliberation' view. The same diagnosis applies.

  You do not need a 'handover rule' to decide when to defer to your ideal self. You need a **disposition of trust**. Just as you do not calculate whether to trust your memory every time you recall a fact, you do not calculate whether to trust your idealised motivations every time you act. You only question them when a specific kind of cognitive dissonance arises. The 'handover' is managed by psychological friction, not by a meta-rule.

  ### Summary

  Your friend's argument is a sophisticated trap, but it snaps shut only if you accept that managing a disposition requires calculating its utility in real-time.

  *   **Reject Step (5).** The judgment to override need not be a calculation; it can be a trained intuition.
  *   **Reject the Sealed/Porous Dichotomy.** The middle ground is 'Porous via Intuitive Triggers'.
  *   **The Cost.** You must concede that your decision procedure is not hermetically sealed off from your criterion. The criterion builds the procedure, and occasionally whispers to it, even if it does not drive it.

  The Split View survives, but it is less like a machine with a switch, and more like a garden with a fence. The fence is there to keep you on the path (the dispositions), but the gates are unlocked for emergencies (the intuitive overrides), and the layout of the garden was designed by the architect of Consequentialism, even if the gardener does not consult the blueprints every day.

  You need not abandon your position. You need only refine the psychology of how the 'split' is maintained. It is not a logical contradiction; it is a feature of bounded rationality.
