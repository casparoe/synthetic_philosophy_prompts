      *   (5) That judgment *must* be first-order consequentialist calculation (tracking the criterion).
      *   (6) Conclusion: Instability. Either Rule Worship or Direct Consequentialism.
      *   (7) Generalisation: Applies to any view separating rightness from decision procedure (e.g., Ideal Deliberation).
