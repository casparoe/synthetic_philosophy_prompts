  3.  **Evaluate the Steps:**
      *   Step (1) is standard for indirect consequentialism.
      *   Step (3) is the standard objection to rigid rule-consequentialism.
      *   Step (5) is the weak link. It assumes that the *meta-decision* (whether to use the disposition or calculate) must itself be made via the *same* costly first-order calculation that the dispositions were meant to avoid.
      *   Step (2) (Sealed vs. Porous) is a false dichotomy. There is a middle ground regarding *how* the porosity is managed.

  4.  **Formulate the Diagnosis:**
      *   **The Core Error:** Step (5). It assumes that checking whether to override a disposition requires the *very* cognitive process (real-time consequentialist calculation) that the dispositions are designed to bypass.
      *   **The Nuance:** The "handover rule" (or meta-disposition) need not be a *calculative* procedure. It can be another *disposition* or a *heuristic* that is itself justified consequentially but does not require full-blown expected utility maximisation to trigger.
      *   **The Sealed/Porous Dichotomy:** It conflates "rigidly never override" with "override only via calculation." There is a third option: "Override via a higher-order disposition/heuristic that is generally reliable but not calculative."

  5.  **Drafting the Response (incorporating British English and philosophical tone):**

      *   *Introduction:* Acknowledge the strength of the friend's argument. It's a classic "self-effacing" or "self-defeating" objection (reminiscent of Railton, Jackson, Smith). Validate the user's unease.
