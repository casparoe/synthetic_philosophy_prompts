answer: |-
  # Seminar Game: The Coherence Market

  **Goal:** Induce a state of cognitive dissonance regarding logical omniscience by forcing students to price logical consequences under resource constraints, then demonstrating that standard probabilistic norms deem them "irrational" regardless of those constraints.

  **Time:** 90 Minutes
  **Students:** 14
  **Materials:** Printed betting slips, whiteboard (for market ledger), timer, "Resource Tokens" (physical cards), a pre-calculated spreadsheet for the Dutch Book check.

  ---

  ## Part 1: The Setup (0–10 mins)

  **The Scenario:**
  Tell the class there is a locked box containing 5 switches (labeled A, B, C, D, E). Each switch is either **ON (1)** or **OFF (0)**.
  Write the **System Constraints** on the board. These are common knowledge and guaranteed true:
  1.  $A \lor B$ (At least one of A or B is ON)
  2.  $C \to D$ (If C is ON, D is ON)
  3.  $D \to \neg E$ (If D is ON, E is OFF)
  4.  $E \to A$ (If E is ON, A is ON)
  5.  $\neg (B \land C)$ (B and C cannot both be ON)

  **The Endowment:**
  Every student starts with **1,000 Points**.
  They will be asked to assign a *credence* (0.00 to 1.00) to specific propositions about the switches.
  **Scoring Rule:** At the end, their score for each proposition is calculated using the **Brier Score**: $1 - (Outcome - Credence)^2$.
  *   If they say 1.0 and it's True: Score 1.0 (Max points).
  *   If they say 1.0 and it's False: Score 0.0 (Loss of potential).
  *   If they say 0.5: Score 0.75 regardless of outcome.
  *   *Note:* Tell them their final grade/credit depends on their final point total relative to the class median. (Keep it vague enough to induce stress, honest enough to be ethical).

  **The Rule:**
  "You are rational agents. Price these propositions according to your degree of belief. You may not discuss the propositions unless you purchase a Resource Token."

  ---

  ## Part 2: The Market Rounds (10–40 mins)

  Run three rounds of betting. In each round, hand out a sheet with 5 propositions. They have 5 minutes to assign credences to all 5.

  **Round 1: The Baseline (No Resources)**
  *   **P1:** $A \lor B$ (Direct Constraint 1)
  *   **P2:** $E \to D$ (Contrapositive of C3 + C4 chain: $E \to A$, but wait... $E \to A$ and $A \lor B$... actually $E \to A$ and $D \to \neg E$ means $E \to \neg D$. So $E \to D$ is False if E is true. If E is false, it's true. This is contingent.) *Correction for the Instructor:* Let's ensure the logic is tight.
      *   *Revised P2:* $\neg D \lor \neg C$ (Equivalent to $C \to D$. Direct restatement of Constraint 2).
  *   **P3:** $A \lor \neg A$ (Tautology, but buried).
  *   **P4:** $B \to \neg C$ (Equivalent to Constraint 5).
  *   **P5:** $E \to B$ (Derived: $E \to A$. If $E$, then $A$. If $A$, $B$ can be 0 or 1. Wait. If $E$, then $\neg D$ (by C3). If $\neg D$, $C$ can be 0 or 1. This is too hard for Round 1).
      *   *Revised P5:* $C \to \neg E$ (Transitivity of C3: $C \to D \to \neg E$).

  **Round 2: The Resource Market (40–55 mins)**
  Open the shop. Students can spend points from their 1,000 endowment.
  *   **Hint Token (Cost: 50 pts):** Ask the instructor "Is Proposition X logically entailed by the Constraints?" (Yes/No only).
  *   **Collaboration Token (Cost: 100 pts):** Talk to one other student for 2 minutes.
  *   **Time Token (Cost: 150 pts):** +3 Minutes for the round.

  **Round 2 Propositions:**
  *   **P6:** $(A \lor B) \land (C \to D)$ (Conjunction of two constraints).
  *   **P7:** $\neg (C \land E)$ (Derived from C3: $C \to D \to \neg E$).
  *   **P8:** $B \lor \neg B$ (Tautology, different syntax from P3).
  *   **P9:** $E \to (A \land \neg D)$ (Derived: $E \to A$ and $E \to \neg D$).
  *   **P10:** $A \lor B \lor C$ (Contingent, but likely true in most models).

  **Round 3: The Squeeze (55–65 mins)**
  No new resources allowed. They must use what they have.
  *   **P11:** $\neg (\neg A \land \neg B)$ (Syntactic variant of P1).
  *   **P12:** $C \to \neg E$ (Repeat of P5 from Round 1. Check for consistency).
  *   **P13:** $(E \to A) \land (A \to \neg E)$ (The second conjunct is false/contingent. $A$ does not imply $\neg E$. This is a trap).
  *   **P14:** $D \lor \neg D$ (Tautology).
  *   **P15:** The "Grand Conjunction": All Constraints hold. (Should be 1.0).

  ---

  ## Part 3: Resolution & Dutch Book Check (65–75 mins)

  1.  **Reveal the State:** Randomly select *one* valid configuration of switches that satisfies all constraints (e.g., A=1, B=0, C=0, D=1, E=0).
  2.  **Calculate Scores:** Have students calculate their Brier scores for the round. Most will feel they did "okay."
  3.  **The Dutch Book Reveal:** This is the critical moment. Do not focus on accuracy yet. Focus on **coherence**.
      *   Pick a student who priced **P1** ($A \lor B$) at 0.9 and **P11** ($\neg(\neg A \land \neg B)$) at 0.6.
      *   Ask: "If I buy the P1 ticket from you for 0.9 and sell you the P11 ticket for 0.6, what happens?"
      *   Since $P1 \equiv P11$, the payout is identical. You paid 0.9, received 0.6. Net loss 0.3 guaranteed, regardless of the switch configuration.
      *   Pick a student who priced **P7** ($C \to \neg E$) at 0.7 but priced **C** at 0.5 and **E** at 0.5 (implying a higher probability of them co-occurring than the conditional allows).
      *   Show on the whiteboard: "Your credences violate the probability calculus *given the logical constraints*. I can construct a set of bets where you lose points in every possible world compatible with the rules."

  **The Kicker:**
  Point out that the students who bought **Time Tokens** still have inconsistencies. Point out that the students who didn't buy tokens lost points on accuracy *and* coherence.
  Ask: "Who was irrational? The ones who lost points on bets, or the ones who spent points to think?"

  ---

  ## Part 4: The Debrief (75–90 mins)

  Do not start with definitions. Start with their frustration.

  **1. Mapping the Failure (Closure under Consequence)**
  *   *Ask:* "Why did you price P1 and P11 differently?"
  *   *Likely Answer:* "I didn't realize they were the same."
  *   *The Lesson:* Standard Possible Worlds Semantics (Hintikka) says belief is a set of worlds. If P1 is true in all your belief-worlds, and P11 is true in exactly those same worlds, your credence *must* be identical.
  *   *The Gut Punch:* The model says you were **incoherent**, not just tired. It treats logical equivalence as transparent. The game showed that for humans, it is opaque.

  **2. Patching the Model vs. Giving Up the Norm**
  *   *Ask:* "How do we fix the model so it doesn't call you irrational?"
  *   *Option A (Impossible Worlds):* Suggest we add "worlds" to the model where $A \lor B$ is true but $\neg(\neg A \land \neg B)$ is false.
      *   *Critique:* Does logic break in those worlds? If so, is it still epistemology?
  *   *Option B (Awareness/Syntactic):* Suggest belief isn't about worlds, but about sentences you have actively entertained. You believed P1, but P11 wasn't in your "awareness set."
      *   *Critique:* This solves the omniscience problem but makes belief very fragile.
  *   *Option C (Structural/Fragmented):* You have different "belief files" for different tasks.
  *   *Option D (Give up the Norm):* Maybe Probabilism + Logical Omniscience is just the wrong norm for humans.

  **3. The Resource-Bounded Reply**
  *   *Ask:* "Those who bought Time Tokens—did that make you more rational?"
  *   *Discussion:* This maps to **Cherniak's Minimal Rationality** or **Simon's Bounded Rationality**.
  *   *The Tension:* If rationality requires maximizing accuracy, and accuracy requires computation, and computation costs points... the "rational" move might be to remain logically ignorant.
  *   *The Philosophical Problem:* The standard model (Bayesianism) assumes reasoning is free. The game proves it isn't. Does this mean Bayesianism is only for gods? Or does it mean we need a new norm that incorporates *cost of thought*?

  ---

  ## Troubleshooting: What Will Go Wrong

  **1. The "I'm Just Bad at Logic" Defense**
  *   *Risk:* Students dismiss the result as "I'm not a logician, of course I missed the equivalence." This treats LO as an empirical claim about human speed.
  *   *Counter:* Remind them the Dutch Book works *regardless* of the outcome. It's not about being slow; it's about holding contradictory prices simultaneously. If you hold $P(A)=0.9$ and $P(\neg A)=0.9$, you aren't "slow," you are broken. The game shows we are structurally prone to this "breakage" on complex logic.

  **2. The Resource Market Becomes a Gimmick**
  *   *Risk:* They treat buying time as a game mechanic rather than a philosophical variable.
  *   *Counter:* In the debrief, explicitly link the "Cost of Token" to "Cognitive Effort." Ask: "In real life, you don't buy time tokens. You burn glucose and opportunity cost. The game subsidized reasoning. In reality, the cost is higher. Does that make you *more* or *less* justified in being logically omniscient?"

  **3. The Tautologies are Too Easy**
  *   *Risk:* Everyone spots $A \lor \neg A$.
  *   *Fix:* Ensure the "tautologies" are tautologies *relative to the constraints* (Contextual Necessities), not logical truths *simpliciter*. E.g., If the constraints imply $A$, then $A$ is a "necessary truth" for the game. Price $A$ vs Price "Not (Not A)".

  **4. Dutch Book Math is Boring**
  *   *Risk:* You spend 10 minutes doing arithmetic on the board and lose them.
  *   *Fix:* Pre-calculate the Dutch Book combinations in your spreadsheet. Just show the result: "If you held these three prices, I take 50 points from you in every possible universe. Show of hands, who had a set like this?"

  ---

  ## Limitations: What This Game Cannot Do

  Be honest with them (and yourself) about the boundaries of the exercise.

  1.  **It Conflates Competence with Performance:** The game measures *performance* (what they did under pressure). Logical Omniscience is a claim about *competence* (what the ideal model requires). Students will argue they *would* have been consistent with more time. The model says they *should* be consistent now. The game highlights the gap but doesn't resolve who is right.
  2.  **It Makes Logic Look Like Computation:** The game reduces logical consequence to "steps to solve." Some philosophers argue logical omniscience isn't about calculation steps, but about the *nature* of content (if you understand the words, you *must* believe the consequence). The game doesn't capture the conceptual intimacy of meaning, only the syntactic difficulty.
  3.  **It Doesn't Capture "Awareness":** In the game, the propositions were right in front of them. In real life, we often fail to believe consequences because we never formulate the proposition. The game forces awareness of the proposition, just not its relations.
  4.  **The Normative Force:** The game shows that being logically omniscient is *expensive*. It doesn't show that it's *good*. Students might leave thinking, "Well, obviously we shouldn't be omniscient." The hard philosophical work is explaining why we ever thought they *should* be in the first place (the Dutch Book argument for coherence).

  **Final Instruction to Instructor:**
  When they ask, "So what's the solution?" do not give one. End the seminar by saying: "You just paid points to avoid losing points on coherence. You optimized for survival, not truth. Formal Epistemology is the study of whether those two things can come apart. Next week, we read Hintikka. Come tell him why his model bankrupted you."
