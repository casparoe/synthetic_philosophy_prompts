  | :--- | :--- | :--- |
  | **(a) Generational Duty** | The duty of remembrance extends to generations with no direct lived connection via a transmitted mnemonic inheritance. This inheritance binds descendants independently of present structural harm, creating a permanent moral debt that survives biological discontinuity and requires active maintenance. | The duty is a contingent institutional responsibility dependent on current structural conditions. Obligations do not transmit biologically but exist only where present institutions benefit from or sustain past wrongs, dissolving when structural harm ceases. |
  | **(b) Architectural Forgetting** | Architectural forgetting is permitted only after full structural repair is achieved. It is never morally required; removing markers before repair constitutes a failure of acknowledgment and a breach of relational duty to the past. | Architectural forgetting can be morally required when remembrance hinders repair, even if structural repair is incomplete. Deliberate absence may be necessary to dissolve victim-perpetrator binaries that block progress toward future justice. |
  | **(c) Value of Remembrance** | Remembrance retains independent intrinsic value even when it no longer serves structural repair. The act of remembering is itself a moral good that honors the dead and maintains ethical continuity across generations. | Remembrance holds only instrumental value relative to structural repair. When memory ceases to facilitate repair, it loses moral value and may become a hindrance to future justice and social cohesion. |

  3. Cruxes and Predictive Tests

  1. **Continuity vs. Discontinuity:** (i) Does the naturalness or continuity of commemorative practice carry independent moral weight distinct from its outcomes? (ii) We examine comparative historical data on societies that maintained continuous monumental presence versus those that enacted structured absence over fifty years, controlling for economic variables. (iii) Memorial Continuity predicts that societies maintaining continuity will show higher levels of intergenerational ethical stability and trust in institutions. Reparative Amnesia predicts that societies enacting structured absence will show higher levels of social cohesion and lower rates of identity-based conflict, proving continuity is not inherently valuable.
  2. **Empirical Predictions on Repair:** (i) How far can sociological predictions about identity consolidation and moral repair be trusted in institutional redesign? (ii) We propose a controlled study of municipalities that recently redesigned commemorative spaces, measuring intergroup trust and perceived accountability before and after removal. (iii) Memorial Continuity predicts that removal will be correlated with decreased perceived accountability among affected communities, signaling abandonment. Reparative Amnesia predicts that removal, paired with archival access, will be correlated with increased trust and perceived genuine intent for repair, signaling a shift from performance to action.
  3. **Mnemonic Inheritance:** (i) Does a genuine mnemonic inheritance exist that binds descendants independently of present structural harm? (ii) We analyze legal and moral claims in cases where direct victims have died but institutional structures remain unchanged, surveying descendant communities. (iii) Memorial Continuity predicts that descendants will report a sustained sense of obligation and moral injury if memory is altered, confirming inheritance. Reparative Amnesia predicts that descendants will report relief and increased capacity for future-oriented justice if ritualized markers are removed, confirming obligations are contingent on present harm.

  4. Epistemic Reflection

  We identify the distinction between organic and architectural forgetting as the point most likely to fail. If empirical inquiry reveals that architectural forgetting inevitably triggers organic decay of archival knowledge, the conceptual separation collapses. Furthermore, if both parties ultimately recommend identical institutional arrangements—such as maintaining archives while altering rituals—differing only in normative vocabulary, the adversarial structure is merely verbal. We would revise the framing if evidence shows that mnemonic inheritance is incoherent, meaning descendants cannot bear obligations unrelated to present harm. Specifically, if psychological studies demonstrate that structured absence is indistinguishable from denial in its effects on affected communities, the Reparative Amnesia position loses its distinct moral category. Conversely, if continuous remembrance is shown to invariably calcify into identity performance regardless of intent, the Memorial Continuity position loses its normative force. We commit to revising this collaboration if the predicted outcomes in Section 3 converge, indicating no genuine factual disagreement remains.
