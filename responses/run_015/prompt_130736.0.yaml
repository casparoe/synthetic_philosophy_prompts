answer: |-
  Here is the repaired principle, tested against your cases, with explicit resolutions to the tensions you identified.

  ### The Principle of Contextual Variance Attribution

  **Definition:** Heritability ($h^2$) is the proportion of phenotypic variance ($V_P$) in a **specific population**, at a **specific time**, under a **specific distribution of environments**, that is statistically attributable to **additive genetic differences** ($V_A$) among individuals in that population, as captured by a **specified estimator**.

  **Operational Clauses:**
  1.  **Variance, Not Means:** $h^2$ partitions variance around a population mean. It licenses no inference regarding the causal origin of the mean itself, nor the composition of an individual's score.
  2.  **Estimator Relativity:** The numerical value depends on the estimator. **SNP-based (GREML)** estimates capture additive variance tagged by common genotyped variants ($h^2_{SNP}$). **Twin-based** estimates capture additive plus dominance variance but are confounded by shared environment ($h^2_{Twin}$). Discrepancies (e.g., 0.42 vs. 0.58) reflect missing heritability (rare variants, structural variation) or twin-model inflation (shared environment), not a change in the trait's ontology.
  3.  **Pathway Neutrality:** Genetic influence is defined by the origin of the variance (DNA sequence difference), not the proximity of the mechanism to the body. **Direct Genetic Effects (DGE)** operate through the individual's physiology. **Indirect Genetic Effects (IGE)** operate through the environment provided by genetically related others. Both contribute to **Total Heritable Variance** (response to selection), but only DGE contributes to **Direct Heritability** (intrinsic biological constraint).
  4.  **Group Invariance:** Inferences about mean differences between groups (sex, cohort, location) are licensed **only if** the difference in genetic distribution ($\Delta G$) is independently measured or ruled out. Within-group $h^2$ constrains neither between-group means nor the causes of temporal shifts.
  5.  **Trait Identity:** Derived traits (e.g., gain scores, residuals) are distinct phenotypes with their own $V_P$ and $h^2$. The heritability of a change score is not the heritability of the baseline trait, nor does it imply the baseline trait is immutable.

  ---

  ### Adjudication of Your Cases (A–H)

  **A (GREML 0.42 → Variance Partition):** **Allowed.** This is the definition (Clause 1). It attributes variance, not causes.

  **B (0.42 → Individual Composition):** **Disallowed.** Violates Clause 1. Variance is a population property; an individual's score is a realization, not a sum of percentages.

  **C (Training → $h^2$ Artefact/Useless):** **Disallowed.** Violates Clause 1 and 5. A shift in the mean ($\Delta \mu$) with stable variance ($V_P$) leaves $h^2$ unchanged. Malleability of the mean is orthogonal to the proportion of variance due to genes. $h^2$ predicts *ranking* stability, not *mean* fixity.

  **D (Sex Diff → Genetic):** **Disallowed.** Violates Clause 4. Sex is a stratification variable with a known genetic component (chromosomes) not captured by within-sex autosomal $h^2$. The within-sex estimate (0.40) partitions autosomal variance *conditional* on sex. It cannot explain the mean shift *between* sexes, which may be chromosomal, hormonal, or social. Your verdict is correct, but the reason is that $\Delta G$ (sex chromosomes) is unmeasured by the statistic, not merely that "sex is not a genetic contrast."

  **E (Cohort Shift → Environmental):** **Allowed.** This satisfies Clause 4's exception. You have independent data (allele frequencies) establishing $\Delta G \approx 0$. Therefore, $\Delta P$ must be $\Delta E$. The asymmetry with D is principled: in D, $\Delta G$ is unknown/unmeasured by the $h^2$ statistic; in E, $\Delta G$ is empirically ruled out by external genomic data.

  **F (Medication → Genetic/Intervention):** **Disallowed.** Violates Clause 1 and 3. The high $h^2$ reflects variance in metabolism *given* the drug was administered. It describes variance in a specific environment (Drug Present). It licenses no inference about the trait in the environment (Drug Absent). Withdrawing the drug changes the environment ($E$), potentially collapsing the variance ($V_P$) or shifting the mean, regardless of $h^2$.

  **G1 (Maternal/Intrauterine) & G2 (Parental/Behavioral):**
  *   **Your Verdict:** G1 (0.55) is "heritability" (selection-relevant); G2 (0.55) is "misleading/not genetic."
  *   **My Verdict:** **Overturn G2.** This is the prejudice you suspected. Structurally, G1 and G2 are isomorphic Indirect Genetic Effects (IGEs). In G1, maternal genes $\rightarrow$ womb chemistry $\rightarrow$ child SRL. In G2, parental genes $\rightarrow$ reading behavior $\rightarrow$ child SRL.
  *   **Repair:** Apply Clause 3. Both 0.55 figures represent **Total Heritable Variance**. Both predict response to selection (because selecting the child selects the parents' genes in G2, and the mother's genes in G1). However, neither represents the child's **Direct Heritability** (0.15).
  *   **Principle:** If your goal is *prediction of offspring phenotype from parental phenotype*, 0.55 is the correct number for both. If your goal is *identifying biological constraints within the child*, 0.15 is the correct number for both. Distinguishing them based on "biological" vs. "behavioral" pathways is ontologically arbitrary; the only non-arbitrary distinction is **Direct vs. Indirect**. You must accept that G2 is "genetic" in the selection sense, even if the mechanism is behavioral.

  **H (Cross-Country → Less Heredity):** **Allowed with Gloss.** Consistent with Clause 2. $h^2$ is population-specific. A lower $h^2$ in the second register implies higher $V_E$ or lower G-E covariance, not that genes are "less important" intrinsically. Your gloss is the correct application of Clause 2.

  **The Gain Score Case:**
  *   **Verdict:** **Allow, with restriction.** The gain score ($\Delta$) is a new trait (Clause 5). $h^2(\Delta) = 0.60$ means "responsiveness to training" is heritable.
  *   **Restriction:** This does not imply the *baseline* SRL is immutable, nor does it imply that those with low gain scores cannot improve (they might improve less, or the variance in gain is driven by a subset). It licenses prediction of *who benefits most*, but not the *ceiling of benefit* for the population. It is a valid heritability estimate for the trait "Plasticity," not a comment on the trait "SRL."

  ---

  ### Three New Test Cases

  **Case I: The Interaction Trap**
  *   **Scenario:** You stratify Kiruna by socioeconomic status (SES). In High-SES, $h^2_{SNP} = 0.60$. In Low-SES, $h^2_{SNP} = 0.10$.
  *   **Inference:** In Low-SES families, SRL is determined by environment; in High-SES, it is determined by genes. Therefore, interventions will only work in Low-SES.
  *   **Principle Verdict:** **Disallow.** Violates Clause 2 and 4. The *genes* are likely the same; the *variance* is suppressed in Low-SES due to environmental constraint (ceiling/floor effects or high noise). $h^2$ measures the *expression* of genetic variance, not the *presence* of genetic causation. The inference that interventions "only work" in Low-SES is plausible (due to room for improvement), but the $h^2$ difference itself does not prove the trait is "environmental" in one and "genetic" in the other. It proves the *variance structure* differs.

  **Case II: The Assortative Mating Inflation**
  *   **Scenario:** You discover strong assortative mating for SRL in Kiruna (people marry partners with similar SRL). You re-calculate $h^2$ in the offspring generation using the Twin method and see it rise from 0.58 to 0.75.
  *   **Inference:** The trait has become more genetic in the offspring generation.
  *   **Principle Verdict:** **Disallow.** Violates Clause 2. The biology hasn't changed. Assortative mating increases genetic variance ($V_G$) in the population by correlating alleles, which inflates $h^2$. The *proportion* of variance due to genes rises, but the *mechanism* is demographic, not biological. The principle requires you to report this as "Increased $h^2$ due to changed population structure," not "Increased genetic determination."

  **Case III: The CRISPR Intervention**
  *   **Scenario:** Based on the 0.42 GREML result, you identify the top 1% of alleles associated with low SRL. You propose a gene-editing intervention to shift these alleles in embryos.
  *   **Inference:** Since $h^2$ is 0.42, editing these loci will reduce SRL by a predictable amount proportional to the effect sizes.
  *   **Principle Verdict:** **Disallow (mostly).** Violates Clause 1 and 3. $h^2$ is a variance statistic in a *natural* population. It assumes linear additive effects in the *current* environment. It does not license inference about *extreme* interventions (editing top 1%) which may trigger non-linear epistatic effects or GxE interactions not present in the observational data. $h^2$ predicts response to *selection* (small shifts over generations), not necessarily *engineering* (large shifts in one step).

  ---

  ### Where My Principle Overturns Your Verdicts

  1.  **Case G2 (Parental Reading):** You verdicted this as "not genetic at all." My principle overturns this. It is **Indirect Genetic**. If you select children for low SRL, you implicitly select parents for low-reading-genotypes, and the effect persists across generations. Calling it "not genetic" conflates *Direct Biological Constraint* with *Heritable Variance*. You must distinguish **Direct $h^2$** (0.15) from **Total $h^2$** (0.55). Both are valid answers to different questions. Your intuition that G2 feels "less genetic" than G1 is a bias toward proximate biological mechanisms, but evolutionarily and statistically, they function identically.
  2.  **Case D (Sex Differences):** You disallowed the inference that part of the sex difference is genetic. My principle agrees with the disallowance but clarifies the reason. It is not because sex is "not a genetic contrast" (it is, chromosomally). It is because the *within-sex* $h^2$ statistic does not measure the *between-sex* genetic difference. You can infer the sex difference *might* be genetic, but the 0.40 figure is irrelevant to that claim.
  3.  **Gain Score:** You were undecided. My principle rules it a **valid heritability of a different trait**. It is not a paradox; "Plasticity" is a phenotype like "Height." It has its own $h^2$.

  ### Summary of the Repair

  Your tentative principle was 90% correct but lacked the machinery to handle **Indirect Genetic Effects** (G1/G2) and **Temporal/Group Logic** (D/E).

  1.  **Adopt the Direct vs. Total Heritability distinction.** This resolves G1/G2 without arbitrary biological prejudice.
  2.  **Explicitly separate Variance from Means.** This resolves C, D, and E. E is allowed only because you have external data on $\Delta G$, not because $h^2$ allows temporal inference generally.
  3.  **Anchor to Estimator.** Acknowledge that 0.42 (GREML) and 0.58 (Twin) are different quantities ($h^2_{SNP}$ vs $h^2_{Twin}$). Use 0.42 for "variance among unrelateds" and 0.58 for "family resemblance," but do not treat the difference as a mystery of the trait itself.

  This principle will hold for cases you have not considered because it shifts the burden of proof: $h^2$ describes the *status quo variance structure*. Any inference about *change* (intervention, time, groups, editing) requires auxiliary premises about the stability of G, E, and the linearity of their interaction. Without those premises, $h^2$ is silent.
