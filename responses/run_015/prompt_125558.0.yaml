      *   **Goal:** Get the *shape of the argument* right, avoid slogans, avoid pretending the answer is obvious, avoid nihilism ("nothing is at stake").
      *   **The Conflict:**
          *   *Teacher:* Intentional Stance (Dennett) = If it's efficient to predict via beliefs/desires, it *really* has them. LLMs fit this, so they have beliefs.
          *   *Friend:* Intentional Stance = Merely instrumental/useful projection, no inner life required. Also, LLMs are inconsistent (say Tuesday is Tuesday, then not), which genuine believers wouldn't do.
      *   **User's Specific Questions:**
