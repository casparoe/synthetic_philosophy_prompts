      *   *Constraint Check:* Needs to be about 5 minutes spoken (approx. 750-850 words). Needs to avoid slogans. Needs to leave the question open but sharpened.

  5.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to make sure I don't just say "Dennett says X." The user asked for the *argument*, not sources.
      *   *Correction:* The "Character" point is the user's own insight. I should validate that heavily. It's the strongest philosophical move they have.
      *   *Correction:* Ensure I answer the three specific questions clearly before providing the speech.
      *   *Correction on "Real Beliefs":* I need to be careful not to slide into dualism. The point is about functional role. If the functional role includes "caring about truth," and the AI lacks that, the functional role is incomplete.

  6.  **Final Polish:**
      *   Check the Ohio context (public high school, senior). Keep it grounded.
      *   Ensure the distinction between "Model" and "Persona" is clear.
      *   Make sure the speech invites discussion, doesn't conclude it.

  7.  **Final Output Structure:**
      *   Part 1: Direct answers to the three questions + the "Character" insight.
