prompt: |-
  I'm leading one 90-minute session of a grad reading group next week on the problem of old evidence — about ten people, half philosophy grads and half ML/cognitive-science people who mostly know Bayes from machine learning (priors as regularizers, updating as "seeing more data", evidence as a row in a dataset). Please don't explain the problem to me; I know the shape of it. I want a plan for how to get it across to that room.

  Concretely, here's what I need:

  1. The order the pieces have to come in and what depends on what. My worry: if I open with "confirmation is probability-raising," half the room will think the puzzle is an arithmetic accident; if I open with "P(E) is already 1, so nothing can be raised, so the framework is broken," the ML people will immediately say "fine, use the likelihood ratio / Bayes factor, the posterior-odds form doesn't need P(E) at all" and feel like they've dissolved it in ten seconds. So where does the Bayes-factor route have to sit in the sequence, and how do I stage it so it lands as a serious answer that then runs out, rather than as a heckle I have to bat away?

  2. The one case that should carry the whole session. I was going to use the classic one — the anomalous advance of Mercury's perihelion and general relativity — but I think it's doing too many jobs at once and quietly hiding the structure: it's a novel prediction, it's quantitative, the datum was already known to be anomalous, and there's a rival theory humming in the background. So: what does my carrying example need to *have*, and what does it need to *lack*, to isolate the thing I'm after? Should I keep Mercury, or swap it for something from ordinary life or from lab/clinical practice where the fact was sitting there on the chart the whole time? Give me the swap if you think it's better, and say what it buys.

  3. Two wrinkles I want to fit in somewhere and can't place. (i) Evidence that's old in the sense that everyone knew the fact for years, but whose *relevance* to the hypothesis was only noticed later — the bearing was new, not the fact. (ii) Evidence that's old for the person doing the reasoning but new to the community — so who is the agent whose updating is supposed to have gone wrong? Tell me which of these is a genuine variant of the problem, which is a red herring I should name and drop in one sentence, and where in the sequence each belongs.

  4. The misconceptions I should expect, and exactly where in the sequence to head each one off. My guesses: "just ask what you would have thought if you hadn't known it" (the counterfactual-prior move — and I want to know why that move is worse than it sounds, not just that it's contested); "so Bayesianism can't handle being surprised"; "this is just the Duhem/auxiliary-hypothesis thing wearing a hat"; "it's only a problem if your priors are subjective"; "that's about discovery, not confirmation, so who cares." Fix my list if I've got the wrong ones or I'm missing the big one.

  5. What I should openly refuse to get into at this level, and say out loud that I'm skipping.

  6. One question for the last five minutes that tells me whether they've got the structure rather than the slogan. Ideally I'd hand them a pair: a case where the right verdict is "yes, the old evidence genuinely confirms now," and one that's superficially identical where the right verdict is "no, nothing should move," and make them say what the difference consists in.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Task:** Plan a 90-minute grad reading group session on the "Problem of Old Evidence" (PoE).
      *   **Audience:** 10 people (5 Philosophy grads, 5 ML/CogSci). Philosophy knows the literature; ML knows Bayes as a tool (priors=regularizers, updating=data).
      *   **Constraint:** Do *not* explain the problem to the user (they know it). Focus on *pedagogy* and *structure*.
      *   **Specific Needs:**
          1.  Sequencing (especially handling the Bayes Factor objection early).
          2.  The "Carrying Example" (Mercury vs. something else).
          3.  Two Wrinkles (Relevance discovery vs. Agent relativity).
          4.  Misconceptions (Counterfactual priors, surprise, Duhem, subjectivity, discovery vs. confirmation).
          5.  Scope Limits (What to exclude).
          6.  Final Assessment Question (Distinguishing genuine vs. superficial confirmation).

  2.  **Deconstruct the Audience Dynamic:**
      *   *Philosophy:* Will worry about normative accounts of confirmation, logical omniscience, and historical case studies.
      *   *ML/CogSci:* Will view Bayes as an algorithm. If $P(E)=1$, likelihood $P(E|H)$ is still computable. They will gravitate towards predictive accuracy, cross-validation, or Bayes Factors. They might see PoE as a "pseudo-problem" arising from bad modeling.
      *   *Goal:* Bridge the gap. Show the ML folks why the "algorithmic fix" misses the *epistemic* point, and show the Phil folks why the ML intuition matters for formalizing the fix.

  3.  **Address Point 1: Sequencing & The Bayes Factor Heckle:**
      *   *Problem:* If I start with $P(H|E) > P(H)$, ML says "Use $P(E|H)/P(E|\neg H)$." If I start with "P(E)=1 breaks Bayes," ML says "So don't condition on E as certain."
      *   *Solution:* Don't start with the formula. Start with the *temporal/epistemic narrative*.
      *   *Sequence:*
          1.  Intuition Pump (The feeling of confirmation).
          2.  Formalization (Standard Conditionalization).
          3.  The Crash (P(E)=1).
          4.  *Immediate* invocation of the ML fix (Likelihood Ratio/Bayes Factor).
          5.  The *Real* Problem (Where do the likelihoods come from if the theory was built *to fit* E?).
      *   *Why:* This validates the ML intuition (yes, math works) but isolates the philosophical core (how do we assign likelihoods to old data without double-counting?).

  4.  **Address Point 2: The Carrying Example:**
      *   *Mercury:* Too messy (novel prediction vs. old anomaly, rival theories, quantitative fit).
      *   *Requirement:* Needs to isolate *logical* old evidence from *psychological* surprise. Needs to show the tension between "fitting" and "predicting."
      *   *Suggestion:* A model-fitting scenario familiar to ML folks but with a philosophical twist. Or a simplified historical case.
      *   *Better Option:* **The "Curve Fitting" Case.**
          *   *Scenario:* You have a dataset $D$. You propose Model $M_1$ (simple) and Model $M_2$ (complex). $D$ is "old" (you've looked at it).
          *   *Why:* ML folks live here. They know overfitting.
          *   *Twist:* Suppose $M_2$ was constructed *specifically* to pass through a specific outlier in $D$. Does $D$ confirm $M_2$?
          *   *Refinement:* Actually, for a reading group, a concrete physical case is often stickier than abstract math. Let's stick closer to **Einstein/Mercury** but *stripped down*.
          *   *Decision:* Keep Mercury but *sanitize* it. Remove the rival theory (Newton) for the initial setup. Remove the "novel prediction" aspect (light bending). Focus *only* on the 43 arc-seconds.
          *   *Wait, user asked for a swap if better.* A swap to a **Clinical Diagnosis** or **Debugging** case might work better for the mixed room.
          *   *Idea:* **The Medical Test.** A patient has a symptom $S$ (old). Doctor comes up with Disease $D$ (new hypothesis) that explains $S$. Does $S$ confirm $D$?
          *   *Critique:* Too simple.
          *   *Idea:* **The Code Bug.** You have a crash log (old). You write a patch (new hypothesis) that fixes it. Does the log confirm the patch is correct?
          *   *Verdict:* Let's recommend **The "Constructed Theory" Case (Einstein)** but explicitly *strip* the novel prediction element. Why? Because the ML folks need to see where their likelihood ratios break. If we use a generic example, they'll just say "cross-validate." Mercury forces the issue: you can't cross-validate the universe.
          *   *Actually, the prompt asks what the example needs to have/lack.*
          *   *Have:* A hypothesis constructed *after* seeing the data. A high fit.
          *   *Lack:* Novel predictions (initially). Rival theories (initially).
          *   *Recommendation:* Stick with Mercury but **gamify it**. Present it as "Here is a number. Here is a theory built to match the number."

  5.  **Address Point 3: The Two Wrinkles:**
      *   (i) Old Fact, New Relevance (Garber-style solution).
      *   (ii) Old for Me, New for Community (Agent relativity).
      *   *Analysis:* (i) is the core technical solution (logical omniscience relaxation). (ii) is a sociological variant that often dissolves into (i) or is a red herring about "who is the believer."
      *   *Placement:* (i) belongs in the "Solutions" phase. (ii) belongs in "Scope/Boundaries" or as a distinction check.
      *   *Verdict:* (i) is genuine. (ii) is mostly a red herring regarding the *logic* of confirmation, though relevant for *history* of science.

  6.  **Address Point 4: Misconceptions:**
      *   *Counterfactual Priors:* "What if I didn't know E?" (Problem: Logical omniscience. If H entails E, you *should* have known E).
      *   *Surprise:* "Bayes can't handle surprise." (No, it's about support, not psychology).
      *   *Duhem:* "It's just auxiliary hypotheses." (Related, but distinct. Duhem is about falsification; PoE is about confirmation).
      *   *Subjectivity:* "Only a problem for subjective priors." (No, affects objective Bayes too).
      *   *Discovery vs. Confirmation:* "Who cares, that's context of discovery." (This is the biggest ML objection. Need to crush it: if confirmation is rational belief change, the timing matters).
      *   *Missing One:* "The Likelihood is just 1." (If H entails E, and E is known, P(E|H)=1. Then BF=1. No confirmation. This is the specific math trap).

  7.  **Address Point 5: Scope Limits:**
      *   Don't solve it. (It's unsolved).
      *   Don't get into specific Garber formalisms (too technical).
      *   Don't debate Frequentism vs. Bayesianism (side track).
      *   Don't get into "Objective Priors" (Jeffreys, etc.) deeply.

  8.  **Address Point 6: Final Question:**
      *   Need two cases.
      *   Case A (Yes Confirm): Old data, theory constructed independently of *this specific feature* (e.g., theory predicts shape, data has shape).
      *   Case B (No Confirm): Old data, theory *tuned* to match this specific feature (overfitting).
      *   *Distinction:* The modal status of the likelihood. Could the theory have existed without the data?

  9.  **Drafting the Plan (Iterative refinement):**
      *   *Timing:* 90 mins.
      *   *Intro (15):* Hook & Intuition.
      *   *Formal Crash (20):* The Math & The ML Objection.
      *   *The Example (20):* Mercury (Sanitized).
      *   *Wrinkles & Misconceptions (20):* Weaving in the "New Relevance" and "Counterfactuals".
      *   *Conclusion/Quiz (15):* The Pair Test.

      *Refining the ML Objection:* The ML crowd will say "Use Bayes Factor $P(E|H)/P(E|\neg H)$." The counter is: If $H$ was *built* to entail $E$, then $P(E|H)=1$. But what is $P(E|\neg H)$? If $E$ is old, we know $E$ is true. So $P(E|\neg H)$ is also 1 (since $E$ is a tautology for the agent). So BF = 1. *That* is the trap. I need to make sure the plan highlights *why* $P(E|\neg H)$ becomes 1 for the agent who knows $E$.

      *Refining the Example:* The user suspects Mercury is doing too much work. I should suggest a **synthetic case** that mirrors Mercury but removes the history. "The 43 Arc-Second Case." Treat it as a number given to you, then a theory built to match it. This prevents "But Einstein also predicted light bending!" objections.

      *Refining Wrinkles:*
      *   (i) New Relevance (Garber): This is the "Logical Omniscience" fix. $P(H \to E) < 1$. This is the heavy lifter.
      *   (ii) Agent Relativity: This is the "Who is updating?" fix. It's less structural, more pragmatic. Call it a red herring for the *logic* problem.

      *Refining Misconceptions:* The "Discovery vs Confirmation" one is the biggest ML pushback. "We care about generalization error, not the history of the model." I need to frame PoE as a problem about *generalization* (overfitting) to appeal to them.

  10. **Final Polish:** Check tone. Direct, actionable, respectful of their expertise. Ensure the "ML Heckle" is defused by validating the math but questioning the inputs.

  **(Self-Correction during drafting):** Wait, if I tell the ML folks "P(E|not-H) is 1 because E is known," they might say "No, P(E|not-H) is the probability the data would look like this if the null were true." I need to be precise. For the *agent* who knows $E$, $P(E) = 1$. By probability axioms, $P(E|X) = 1$ for any $X$ compatible with $E$. Since $\neg H$ is compatible with $E$ (we know $E$ is true), $P(E|\neg H) = 1$. Thus BF = 1/1 = 1. *This* is the point of leverage. I must ensure the plan makes this explicit.

  Okay, ready to write.
answer: |-
  Here is a 90-minute session plan designed to navigate the specific friction points between the philosophy and ML/cog-sci contingents.

  ### 1. Sequencing: Defusing the Bayes-Factor Heckle
  Your worry is correct: if you frame this as "conditionalization breaks," the ML cohort will solve it with likelihood ratios before you finish the sentence. You need to stage the math so that the Bayes Factor looks like a solution, then show why it fails *given the constraints of the agent*.

  **The Sequence (Minutes 0–25):**
  1.  **The Intuition (5 min):** Do not start with formulas. Start with a verdict. "Einstein's theory was confirmed by Mercury's perihelion, even though Einstein knew about Mercury when he wrote the theory." Ask for a show of hands: "Is this rational?" (Everyone says yes). "Is this allowed by standard Bayesian updating?" (Everyone hesitates).
  2.  **The Formal Trap (10 min):** Write the standard conditionalization: $P_{new}(H) = P_{old}(H|E)$.
      *   Ask the room: What is $P_{old}(E)$?
      *   *Philosophy:* "It's 1."
      *   *ML:* "It's 1."
      *   Show that if $P(E)=1$, then $P(H|E) = P(H)$. No update.
  3.  **The ML Intervention (10 min):** Invite the ML objection immediately. "Why not use the Odds Form? $Posterior Odds = BF \times Prior Odds$."
      *   Let them write the Bayes Factor: $\frac{P(E|H)}{P(E|\neg H)}$.
      *   **The Pivot:** This is the critical moment. Do not let them walk away. Ask: "For the agent who *already knows* $E$ is true, what is the value of $P(E|\neg H)$?"
      *   *The Trap:* If $E$ is a known fact (probability 1), then $P(E|X) = 1$ for any hypothesis $X$ that is logically compatible with $E$. Since $\neg H$ is compatible with $E$, $P(E|\neg H) = 1$.
      *   *Result:* $BF = 1/1 = 1$. The Likelihood Ratio dissolves just like Conditionalization.
      *   *Why this works:* It validates the ML tool (BF is fine) but shows the input parameters ($P(E|\cdot)$) are the broken part when $E$ is old. This moves the debate from "which formula?" to "how do we assign likelihoods to known facts?"

  ### 2. The Carrying Example: Sanitized Mercury
  Keep Mercury, but you must **strip it**. The historical case carries too much baggage (rival theories, novel predictions like light-bending, quantitative precision).

  **What the example needs to HAVE:**
  *   A specific quantitative datum ($D$).
  *   A hypothesis ($H$) constructed *after* $D$ was known.
  *   A high degree of fit ($H$ entails $D$).

  **What the example needs to LACK:**
  *   **Novel predictions:** Do not mention light-bending or redshift. If you do, the ML crowd will say "Ah, it generalized to *new* data, so it's fine." You want to isolate the confirmation coming from the *old* data.
  *   **Rival theories:** Do not bring in Newtonian mechanics initially. If you do, the discussion becomes about comparative fit rather than absolute confirmation.

  **The Swap/Modification:**
  Present it as **"The 43 Arc-Second Case."**
  *   *Setup:* "Imagine you are given a number: 43 arc-seconds/century. You are told this is a robust feature of the solar system. You go away and construct a theory of gravity. You come back and say, 'My theory entails exactly 43 arc-seconds.'"
  *   *Why this buys you:* It removes the history of science (Einstein's genius) and removes the "novel prediction" escape hatch. It forces the room to evaluate whether *fitting* a known number constitutes confirmation. It translates perfectly to the ML intuition of "training on the test set."

  ### 3. The Two Wrinkles: Placement and Verdict
  You need to distinguish between a structural fix and a sociological dodge.

  *   **Wrinkle (i): Old Fact, New Relevance (The Garber Move).**
      *   *Verdict:* **Genuine Variant.** This is the strongest technical solution (relaxing logical omniscience).
      *   *Placement:* Introduce this in the **Solutions** section (Minute 45). Frame it as: "The agent knew $E$, but did not know that $H \to E$."
      *   *For the ML crowd:* Frame this as "The model architecture didn't guarantee this output until we proved the theorem." It allows $P(E|H)$ to be $<1$ initially, even if $E$ is known.
  *   **Wrinkle (ii): Old for Me, New for Community.**
      *   *Verdict:* **Red Herring (for this session).** This shifts the problem from logic to sociology.
      *   *Placement:* **Minute 70 (Scope/Boundaries).** Dismiss it explicitly. "If confirmation is about rational belief change, it shouldn't matter what my colleagues know. If it *does* matter, we aren't doing epistemology, we're doing sociology."
      *   *Why drop it:* It invites the ML crowd to say "Just average the agents," which dissolves the normative force of the problem. Keep the focus on the single agent's coherence.

  ### 4. Misconceptions: Pre-emption Strategy
  Here is where to head off the specific objections in the flow of the session.

  1.  **"Just ask what you would have thought if you hadn't known it" (Counterfactual Priors).**
      *   *Where:* Minute 35 (During "Proposed Solutions").
      *   *The Kill:* "This requires stripping away logical knowledge. If $H$ entails $E$, and I know logic, I *must* have known $E$ if I knew $H$. To pretend I didn't is to pretend I was logically incoherent. Bayesianism assumes logical omniscience; this solution breaks the framework to save it."
  2.  **"So Bayesianism can't handle being surprised."**
      *   *Where:* Minute 15 (After the Formal Trap).
      *   *The Kill:* "It's not about psychological surprise. It's about support. A password can be 'surprising' but if I chose it, it doesn't confirm the security of the system."
  3.  **"That's about discovery, not confirmation."**
      *   *Where:* Minute 60 (Crucial for ML crowd).
      *   *The Kill:* "In ML, you distinguish training error from test error. If you evaluate on training data, you get overfitting. PoE is asking: Is old evidence training data or test data? If you say 'who cares,' you are saying overfitting isn't a real problem." (This usually silences the ML room).
  4.  **"It's only a problem if your priors are subjective."**
      *   *Where:* Minute 35.
      *   *The Kill:* "Even with objective priors, if $P(E)=1$, the likelihood function collapses. It's an arithmetic property of probability, not a psychological one."
  5.  **"It's just the Duhem/auxiliary-hypothesis thing."**
      *   *Where:* Minute 70.
      *   *The Kill:* "Duhem is about how we *falsify* (we can't isolate H). PoE is about how we *confirm* (we can't isolate the support of E). They are mirror images, but distinct."

  ### 5. Scope Limits: What to Refuse
  State these explicitly at the start (Minute 5) to prevent scope creep.
  *   **"We are not solving it."** Acknowledge there is no consensus solution. The goal is to feel the tension, not resolve it.
  *   **"We are not discussing 'Objective Priors' (Jeffreys, etc.)."** This leads to technical weeds about reference classes that distract from the structural issue.
  *   **"We are not debating Frequentism."** This is an internal Bayesian problem. Frequentism has its own issues with old evidence (reference classes), but importing that debate will fracture the room.

  ### 6. The Final Five Minutes: The Pair Test
  Do not ask "What is the problem?" Ask them to distinguish a *good* use of old evidence from a *bad* one.

  **Hand them this pair:**

  *   **Case A (The Curve Fit):** You have a dataset of 100 points. You propose a 99-degree polynomial that passes through every single point perfectly. The data is "old" (you looked at it to build the model).
      *   *Verdict:* **No Confirmation.** (This is overfitting).
  *   **Case B (The Structural Constraint):** You have a dataset of 100 points. You propose a physical law that says "Energy must be conserved." You realize *after* proposing the law that your dataset *must* sum to a constant if the law is true. You check, and it does.
      *   *Verdict:* **Yes Confirmation.**

  **The Question:** "In both cases, the hypothesis was formed with knowledge of the data, and in both cases, the hypothesis entails the data. What is the structural difference that makes Case B confirmatory and Case A not?"

  **The Answer you want:**
  *   *ML phrasing:* "In Case B, the hypothesis restricts the *space of possible models* (degrees of freedom) before seeing the specific values. In Case A, the model parameters were tuned to the specific values."
  *   *Phil phrasing:* "In Case B, the logical connection ($H \to E$) is necessary/structural. In Case A, the connection is contingent on parameter tuning."

  If they can articulate that distinction, they understand that PoE isn't about *time*, it's about **modal robustness** (could the theory have existed without this specific datum?). This bridges the ML concept of "degrees of freedom" with the Phil concept of "logical entailment."
