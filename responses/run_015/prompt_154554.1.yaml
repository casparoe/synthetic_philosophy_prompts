answer: |-
  The following argument advances a restricted form of eliminative materialism concerning propositional attitudes. This position does not deny that neural activity causes behavior, nor does it deny that organisms exhibit goal-directedness. Rather, it targets the specific taxonomy of folk psychology—the partition of mental life into discrete beliefs and desires with fixed propositional content. The central claim is that this taxonomy fails a necessary criterion for scientific kindhood: inter-subjective calibration stability. Consequently, neuroscience should not seek to reduce these folk kinds to neural states but should replace them with a dynamical-systems taxonomy that bears no one-to-one correspondence to the eliminated categories.

  **The Criterion of Inter-Subjective Calibration Stability**
  For any taxonomy to serve as a basis for scientific reduction, the kinds it identifies must be stable across observers and contexts. If two competent observers assess the same system under slightly shifted contextual parameters, their attributions of kind membership should converge. Furthermore, first-person access should not yield systematically divergent data from third-person observation regarding the boundaries of the kind. This stability ensures that the kind carves nature at its joints rather than reflecting observer-relative heuristics.

  **The Failure of Folk-Psychological Taxonomy**
  Folk psychology individuates states by content (e.g., the belief that water is wet) and functional role (e.g., the desire to drink). However, these attributions fail the stability criterion. First, content attribution is holistically sensitive; whether a subject counts as believing a proposition depends on a vast, shifting network of other assumed attitudes. A slight change in context alters the network, thereby changing the identity of the belief itself without any detectable change in the subject's neural configuration. Second, inter-observer calibration is unreliable. Different observers attribute conflicting beliefs to the same subject based on pragmatic interpretive strategies rather than discrete internal boundaries. First-person access offers no remedy, as introspective reports vary with linguistic framing and situational pressure. Because the boundaries of "belief" and "desire" shift with context rather than tracking fixed internal structures, they lack the stability required for reduction.

  **The Stability of Neural-Dynamical Descriptions**
  In contrast, coarse-grained neural-dynamical descriptions exhibit superior stability. Describing a system as traversing a specific trajectory of predictive-error minimization remains invariant across contextual shifts that would scramble folk attributions. Whether an observer describes the system from the outside or the system reports on itself from the inside, the underlying dynamical pattern—rates of change, attractor states, and error-correction loops—remains consistent. These patterns do not rely on propositional content or discrete individuation. Therefore, the dynamical taxonomy satisfies the stability criterion where folk psychology fails.

  **The Replacement Strategy**
  Since the folk taxonomy fails to identify stable kinds, there is nothing for neural states to be identical to. Reduction requires two existing domains to be mapped; if the mental domain consists of unstable, observer-relative projections, reduction is impossible. The correct scientific strategy is elimination and replacement. Neuroscience should not ask, "Which brain state is the belief that P?" but rather, "Which dynamical trajectory correlates with the behavioral output previously mislabeled as believing P?" The successor vocabulary will describe trajectories, convergence zones, and error-minimization patterns. There will be no single state corresponding to a belief, just as there is no single state corresponding to "heat" in thermodynamics, only mean kinetic energy.

  **Addressing the Self-Refutation Objection**
  A standard objection holds that eliminativism is self-refuting: to assert the theory is to express a belief in its truth, thereby presupposing the existence of beliefs. This objection relies on the eliminated vocabulary. The restricted eliminativist avoids this trap by asserting the thesis using only the successor vocabulary. The speaker does not claim, "I believe eliminativism is true." Instead, the speaker asserts: "The current linguistic output is generated by a neural architecture optimizing for predictive accuracy regarding the instability of folk-taxonomic attributions." The validity of the statement depends not on the speaker's possession of a propositional attitude, but on the causal efficacy of the utterance in aligning the neural dynamics of listeners with the observed instability. The argument is a tool for recalibrating observer expectations, not a report of a mental fact. By describing the assertion as a behavioral manifestation of a stable dynamical pattern rather than the expression of a belief, the thesis remains consistent with its own content.

  **Comparison with Reductive Identity Theory**
  The critical examination concerns whether this restricted eliminativism genuinely differs from reductive identity theory. Identity theory posits that mental states are identical to brain states, preserving the mental vocabulary via reduction. Eliminativism posits that mental states do not exist, replacing the vocabulary. The distinction threatens to collapse if the successor taxonomy hosts functional analogues of belief-like and desire-like states. If the dynamical trajectories predict behavior exactly as beliefs would, and if they integrate information like beliefs, one might argue they simply *are* beliefs under a new description.

  However, the distinction remains genuine because the structural requirements of the folk kinds are not met. Folk beliefs are discrete, propositionally structured, and possess satisfaction conditions (truth values). Dynamical trajectories are continuous, non-propositional, and possess stability conditions (error minimization). A system can minimize error without representing a proposition. While the new states may play a similar *causal role* in behavior production, they lack the *ontological structure* of the folk kinds. Identity theory requires structural compatibility to sustain the identity claim. Since the dynamical taxonomy denies the discrete, propositional structure essential to the definition of belief, it cannot reduce belief; it must eliminate it. The existence of functional analogues does not salvage the folk kind any more than the existence of oxidation salvages phlogiston. The roles may overlap, but the natures are incompatible.

  **Conclusion**
  The restricted eliminativist position maintains that the instability of folk attribution reveals a categorical error, not merely a lack of neural detail. Because the successor vocabulary describes structures fundamentally incompatible with propositional attitudes, the theory necessitates elimination rather than reduction. While functional overlaps exist, they do not constitute identity because the defining structural features of the folk kinds are absent in the neural dynamics.

  Verdict: The position remains genuinely distinct from reductive physicalism because the structural mismatch between propositional attitudes and dynamical trajectories precludes identity, rendering replacement necessary rather than reduction.
