answer: |-
  To reconcile the three shapes of history in *The Lord of the Rings*, you must treat them not as contradictory claims about a single timeline, but as concurrent processes operating at distinct ontological scales. The novel does not presuppose a single philosophy of history; rather, it dramatizes the friction between a metaphysics of decline, a politics of restoration, and a materiality of irreversible change. The consistency of the work relies on the premise that these scales are decoupling: as the ontological scale diminishes (magic fades), the political scale stabilizes (Men inherit), and the material scale hardens (the world becomes mundane).

  Here is a reading structured by your distinctions, followed by the necessary critique of where this apparatus breaks against Tolkien's theological and narrative commitments.

  ### I. The Three Scales and Their Historical Shapes

  **1. The Ontological Scale: Damped Recurrence**
  At the level of kinds of being, the novel presents a **damped recurrence**. The Elves do not cycle; they diminish. Their history is not a return to a prior state but a fading amplitude of power and presence. The "long defeat" is the recognition that their specific mode of being is incompatible with the incoming age. This is directional history, but it is not ameliorative; it is a history of exhaustion. The destruction of the Rings ensures this damping is permanent. The Third Age does not lead to a Fourth Age of Elves; it leads to a Fourth Age where Elves are absent. This scale provides the tragic backdrop: the cost of saving the world is the evacuation of the enchantment that made the world worth saving.

  **2. The Political Scale: Ratcheted Recurrence and the Restoration Trap**
  At the level of regime and kingship, the narrative appears to be a restoration, but it is more accurately a **ratcheted recurrence**. Aragorn restores the line of Kings, but he does not restore the *conditions* of the past. The old kingdom of Arnor fell; Gondor decayed under Stewards. Aragorn's return inherits the ruins of both.
  Regarding the **Restoration Trap**: Aragorn escapes the trap precisely by changing the unit of history rather than merely the regime. The Trap dictates that to secure permanence, a ruler must seize the tools of domination (the Ring, the Palantír, the divine right of Numenor). Aragorn's legitimacy rests on his refusal of these tools. He heals with his hands rather than commanding with a rod; he crowns himself only when the people will it; he bows to the remnants of Elven power rather than subjugating them.
  The Reunited Kingdom is not an attempt to arrest time (as the Elves tried) but to shepherd the transition to the Age of Men. It escapes the Trap because it accepts finitude. It is a kingdom of Mortals, defined by the "Gift of Men" (death and departure), rather than a kingdom of Immortals defined by preservation. By accepting that his line will eventually fade or change, Aragorn avoids the spiritual corruption that doomed his ancestor Isildur. The cycle of dynastic rise and fall may continue for Men (Polybian style), but the *stakes* of the cycle are lowered. The supernatural leverage that allowed a single tyrant to enslave the world is removed.

  **3. The Material Scale: Directional Change (Disenchantment)**
  At the scale of technology and landscape, the history is directional and irreversible. Saruman's Isengard and the Shire's industrialization represent a modernizing vector that cannot be fully undone. The Scouring of the Shire is crucial here: the Hobbits defeat the oppressors, but they cannot un-cut the trees or un-burn the mills. They can replant, but the landscape bears the memory of the damage. This is not a cycle; it is a scar.
  This scale suggests that "progress" in material capacity is inherently linked to moral risk. The restoration of the King does not fix the Shire; the Hobbits must do that themselves, using low-technology, local solidarity. This implies that the "load-bearing" scale of the novel is ultimately the local/material, not the imperial/political. The High History of Kings saves the world from darkness, but the Low History of Hobbits saves the world from becoming a machine.

  ### II. The Closure of Recurrence

  You ask if the novel closes off recurrence. The answer is yes, but selectively. The destruction of the One Ring creates a **contracted space of possibilities**. In a cyclical model (Spengler or Polybius), the conditions for a Sauron-like figure should eventually re-emerge given enough time. Tolkien's metaphysics denies this. The Ring was a unique concentration of will and power; its unmaking removes the specific mechanism of total domination from history.
  The Fourth Age is a "contracted" history because it is a disenchanted one. It is a world where history is made by human choices, wars, and politics, without the intervention of wizard-gods or dark lords. This is a transition from Mythic History to Human History. Recurrence is not eliminated—Men will still fight, build, and die—but the *amplitude* of historical violence is dampened by the removal of supernatural amplifiers. The "end of history" here is not a utopia, but a normalization.

  ### III. Where the Reading Fails: The Limits of the Apparatus

  Your philosophical apparatus (cycles, scales, traps) is a tool of immanent analysis. It fails where Tolkien's text relies on transcendence.

  **1. Providence and Eucatastrophe**
  Your framework assumes historical forces (material, political, ontological) interact according to discernible laws. Tolkien's history is providential. The "accident" of Gollum biting off the finger at the Cracks of Doom is not a result of historical pressure or strategic calculation; it is a eucatastrophe. It is an irruption of grace that violates the probability of the situation. A cyclical or directional model cannot predict or account for a turn that saves the world through a moral failure (Gollum's greed) rather than a strategic success. If you teach this as a philosophy of history, you must note that the "system" only works because an external Agent (Eru) ensures the moral arc bends, not because the internal logic of history guarantees it.

  **2. Will vs. Law**
  Spengler and Toynbee treat civilizations as organisms subject to laws of growth and decay. Tolkien treats history as a moral arena. The fate of the world turns on the will of two small individuals in a wasteland, not on the demographic vitality of Gondor or the economic output of Isengard. The "Great Men" theory is inverted: the Great Men (Aragorn, Gandalf) are distractions; the small wills (Frodo, Sam) carry the burden. A philosophical system based on macro-historical laws cannot accommodate a causality where the fate of an age rests on a single act of pity.

  **3. Anti-Allegory and Myth**
  Tolkien insisted his work was not allegory. If you treat the Shire as "pre-modern England" or Sauron as "Totalitarianism," you flatten the mythic function. The history in the book is meant to be a *lost* history, a foundation for our own, not a commentary on the 20th century. The philosophical reading risks turning the myth into a sociological treatise, which misses the point that the history is intended to be felt as memory, not analyzed as data.

  **4. Survival of the Apparatus**
  Despite these resistances, the cyclical-and-linear apparatus survives as a **phenomenology of experience**. Even if the metaphysics are providential, the *characters* experience history as decline, restoration, and irreversible change. The framework helps explain why the ending feels bittersweet: the linear victory (Sauron defeated) requires a cyclical loss (Elves depart). The apparatus explains the *mood* of the history, even if it cannot explain the *mechanism* of the salvation.

  ### IV. Syllabus Scenes

  To evidence this reading without relying on theory excerpts, assign these four scenes:

  1.  **The Council of Elrond:** Specifically the discussion regarding the Rings and the changing ages. This establishes the **Ontological Scale**. The Elves admit their time is passing and that their tools (Rings) are now liabilities. It sets up the "Damped Recurrence" of magic.
  2.  **The Healing of the Kings (Houses of Healing):** Aragorn healing Faramir, Eowyn, and Merry. This evidences the **Political Scale** and the **Restoration Trap**. He establishes legitimacy not through conquest or lineage alone, but through service and the "hands of a healer." It distinguishes his kingship from the domination of Sauron or the pride of Numenor.
  3.  **The Scouring of the Shire:** The Hobbits returning to find industrialization and organizing a local resistance. This evidences the **Material Scale**. It shows that the high political victory (Sauron's fall) does not automatically repair local material damage. It highlights the "Directional" nature of technological harm and the necessity of local agency.
  4.  **The Grey Havens:** The departure of the Ring-bearers and the closing of the West. This evidences the **Closure of Recurrence**. It visually confirms that the Age of Magic is over. The door is shut. History continues, but the "contracted space" is now the only reality.

  ### V. What the Novel Gets Right

  Finally, what does this novel offer a philosopher of history that Spengler or Toynbee do not?

  **1. The Cost of Continuity**
  Theoretical literature often treats the transition between historical epochs as abstract (e.g., "Civilization A replaces Civilization B"). *The Lord of the Rings* insists that historical transition requires *loss*. You cannot have the Age of Men without the departure of the Elves. Theory often ignores the grief inherent in progress; Tolkien makes that grief central to the historical structure.

  **2. The Moral Weight of Power**
  Spengler treats power as a biological fact. Tolkien treats power as a moral hazard. The novel suggests that the capacity to dominate history (the Ring) is inherently corrupting to the historian (the wielder). A philosophy of history that ignores the moral effect of historical agency on the agent is incomplete. The "Restoration Trap" is essentially a moral warning: you cannot secure the future by seizing the tools of the past's destruction.

  **3. The Value of the "Small" History**
  Macro-historical theories tend to view small communities (the Shire) as ephemeral or insignificant compared to Empires (Gondor/Mordor). The novel argues that the "load-bearing" structure of history is actually the small, self-regulating order. The Empire saves the world from night, but the Village saves the world from becoming a machine. A robust philosophy of history must account for the resilience of the local against the momentum of the universal.

  **4. An End That Is Not a Collapse**
  Most cyclical theories equate the end of a cycle with catastrophe or decay. Tolkien offers a model where the end of a cycle (the Third Age) is a victory that feels like a funeral. It validates the intuition that a "successful" historical transition can still feel like a diminishment. This captures the modern experience of disenchantment better than theories that promise either inevitable progress or inevitable collapse.

  In sum, use the book to show your students that history is not just a sequence of regimes or material conditions, but a layered process where different kinds of beings experience time differently. The "incompatibility" you noted is the novel's greatest insight: the victory of the political order requires the withdrawal of the ontological order, and the safety of the material order requires the rejection of the magical. The philosophy of history here is tragic, providential, and deeply human, resisting the comfort of a closed system while mapping the contours of our own disenchantment.
