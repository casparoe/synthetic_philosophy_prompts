answer: |-
  Here is an attempt to formulate a principle that accommodates the shape of your intuitions, followed by the analysis you requested.

  ### The Principle of Graded Claims and Contextual Aggregation

  **Statement of the Principle:**
  1.  **Claim Strength:** Each person generates a moral claim to rescue proportionate to the severity of the harm they face and the certainty of that harm. Claims regarding life and limb are non-linear: the loss of a vital function (e.g., a hand, a life) carries significantly more weight than the sum of partial impairments (e.g., fingers), unless the partial impairments aggregate to a functional equivalent.
  2.  **Threshold Aggregation:** Where claims differ in severity, the stronger claim prevails. Weaker claims aggregate only if their sum crosses a threshold of moral equivalence with the stronger claim. Where claims are of equivalent severity, they aggregate linearly by number.
  3.  **Probability Weighting:** A certain claim outweighs multiple probabilistic claims unless the aggregate expected value of the probabilistic claims is substantially higher. Low-probability claims carry disproportionately less moral weight than high-probability ones.
  4.  **Special Obligations:** Claims arising from special relationships (e.g., parenthood) are lexically prior to impartial claims of strangers, provided the harm to the strangers does not reach a catastrophic threshold.
  5.  **Procedural Context:** In one-off decisions between strangers with equivalent claims, fairness permits (but does not require) randomisation to acknowledge individual standing. In policy or repeated decisions, optimisation is required to satisfy the aggregate duty to the population.

  ---

  ### (ii) Motivation by Case

  *   **Clause 1 (Claim Strength & Non-linearity):** Motivated by **Case 4**. You refuse to trade one hand for five fingers because the loss of a hand is a qualitative loss of function, whereas five fingers lost across five people is merely quantitative damage. This establishes that harm is not measured merely in units of tissue, but in units of *capacity*.
  *   **Clause 2 (Threshold Aggregation):** Motivated by **Case 5** and **Case 6**. In Case 6 (five hands vs. one hand), the harms are equivalent, so numbers count linearly. In Case 5 (fifty fingers vs. one hand), the aggregate of lesser harms finally crosses the threshold of equivalence, licensing the switch to the greater number.
  *   **Clause 3 (Probability Weighting):** Motivated by **Case 7**. At 0.21 probability, the claims are too weak to override the certainty of the one. At 0.9, they are strong enough. This captures your intuition that expected utility calculations must be discounted by risk aversion regarding human life.
  *   **Clause 4 (Special Obligations):** Motivated by **Case 3**. This explains why you may save your child (lexical priority) and why a coin toss is grotesque (a lottery implies equal standing, which is denied by the special obligation).
  *   **Clause 5 (Procedural Context):** Motivated by the tension between **Case 1**, **Case 2**, and **Case 8**. It reconciles the permissibility of the coin in a one-off (Case 2) with the requirement to maximise in a policy (Case 8). It suggests that 'fairness' is a constraint on individual agency in the moment, while 'optimality' is a constraint on institutional or repeated agency.

  ---

  ### (iii) Verdicts on New Cases

  **Case A: One stranger's death against five strangers each losing a hand.**
  *   **Application:** We apply Clause 1 and Clause 2. Death is the loss of all capacity; a hand is the loss of significant but partial capacity.
  *   **Verdict:** Save the one stranger.
  *   **Reasoning:** The severity gap between death and limb loss is vast. While five hands represent a significant aggregate harm, they do not cross the threshold of equivalence with a life. The claim of the one facing death outweighs the aggregated claims of the five facing disability.

  **Case B: Case 1, but the further raft holds either two people or twenty, with equal probability (unknown until commitment).**
  *   **Application:** We apply Clause 3 (Probability) and Clause 2 (Aggregation).
  *   **Verdict:** Save the raft with the uncertain number.
  *   **Reasoning:** The expected number of people on the raft is eleven (0.5 × 2 + 0.5 × 20). Even applying a risk discount for the uncertainty, the expected value substantially exceeds the certain one. Furthermore, in either outcome (2 or 20), the numbers exceed the one. Unlike Case 7, where the *probability of rescue* was low, here the *existence of the people* is probabilistic, but if they exist, your rescue is certain. You are not gambling on their survival; you are gambling on their presence. The aggregate claim is stronger.

  ---

  ### (iv) Honest Account of Mismatches and Overturning

  No principle can perfectly capture every intuition without some friction. Here is where the Principle of Graded Claims requires you to adjust your verdicts.

  **The Conflict:** The primary tension lies between **Case 1** ("I must save the five") and **Case 2** ("Tossing a coin is permissible").
  *   **The Problem:** If you *must* save the five in Case 1, then tossing a coin in Case 2 is objectively wrong, even if it feels permissible. If tossing a coin is permissible in Case 2, then you cannot have a strict duty to save the five in Case 1.
  *   **The Overturning:** I recommend overturning the strength of the duty in **Case 1**.
  *   **Revised Verdict:** In Case 1, you *ought* to save the five, but you are *permitted* to toss a coin.
  *   **What We Lose:** We lose the comfort of a strict, action-guiding rule that eliminates agent-regret. If you toss the coin and the five die, you might feel regret, but on this principle, you are not morally at fault. We lose the idea that the 'right outcome' is the only 'right action'.
  *   **What We Gain:** We reconcile Case 1 with Case 2 and Case 8. It allows us to say that in a one-off scenario, the individual claim of the one to a fair chance is robust enough to permit randomisation, whereas in a policy (Case 8), the aggregate duty overrides individual fairness. This preserves your intuition in Case 8 (where randomising is wrong) without making Case 2 indefensible.

  **Secondary Mismatch:** **Case 7** (The Probability Crossover).
  *   **The Problem:** The principle states the crossover happens when expected value is "substantially higher". This is inherently vague.
  *   **Adjustment:** You must accept that there is no precise mathematical crossover point (e.g., 0.51). The moral weight of probability is fuzzy. The principle accommodates this by not specifying a number, but you lose the ability to calculate the answer mechanically.

  ---

  ### The Puzzle of the Fingers

  You asked why five fingers lost by one person aggregate to a hand, but five fingers lost by five people do not. You suspect the appeal to the "separateness of persons" is explanatory hollow. You are correct; mere separateness does not explain the *asymmetry*.

  The work is done by **Functional Integrity**.

  Moral weight attaches not merely to the physical loss, but to the loss of *capability*.
  *   **Within a life:** A hand is a functional system. Losing five fingers destroys the system's utility (grasping, holding). The harm is discontinuous. The loss of the fifth finger is not just 'one more finger'; it is the collapse of the hand's function. Therefore, within one person, five fingers *do* add up to a hand because they constitute the threshold of functional failure.
  *   **Across lives:** When five people each lose one finger, five functional systems are damaged, but none are destroyed. Each person retains the vast majority of their hand's utility. To aggregate these across persons to equal one 'lost hand' requires us to treat the 'damaged capacity' of five people as equivalent to the 'destroyed capacity' of one.
  *   **Why the asymmetry?** Because the moral badness of injury is partly constituted by the impact on the agent's life plan. A life plan is more severely disrupted by the total loss of a function (one hand) than by a minor impediment to that function distributed across five different life plans (five fingers). The 'separateness of persons' matters here only insofar as persons are the distinct vessels of these life plans. We do not sum disruptions to five different life plans to equal the destruction of one life plan, unless the disruptions are severe enough to constitute a similar destruction (as in Case 5, with fifty fingers).

  In short: Aggregation holds within a life because the harm converges on a single point of functional failure. Aggregation across lives is blocked until the sum of damages represents a comparable destruction of functional integrity.
