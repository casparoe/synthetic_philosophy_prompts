answer: |-
  You have not invented this, but you have accurately synthesized a phenomenon that sits at the intersection of political science, economics, and sociology. There isn't one single "law" named after a person that captures the whole chain, but there are established concepts that describe each link.

  The closest established umbrella term is **Policy Feedback**, but your specific observation about the *reshaping of the population* is best described as **Endogenous Constituency Selection** (sometimes discussed under **Compositional Feedback** or **Insider-Outsider Dynamics**).

  Here is the breakdown of the concepts you are seeing, the name for the specific dynamic you described, and the boundary cases.

  ### 1. The Umbrella: Policy Feedback
  You asked if this is what political scientists call **Policy Feedback**. The answer is **yes, but with a specific qualification.**

  *   **Definition:** Policy feedback theory (pioneered by scholars like Paul Pierson and Suzanne Mettler) argues that policies are not just *outputs* of politics; they are *inputs* for future politics. Once a policy is enacted, it reshapes the political landscape.
  *   **How it fits:** Standard policy feedback usually focuses on two things:
      1.  **Resource Effects:** Policies give people resources (money, time) to organize (e.g., Social Security recipients have the time/money to lobby).
      2.  **Interpretive Effects:** Policies teach people how to view themselves (e.g., "I am a veteran" vs. "I am a welfare recipient").
  *   **Where your insight adds nuance:** Most introductory discussions of policy feedback focus on the *mobilization* of beneficiaries (the tenants who stay). Your observation highlights the **demographic sorting** aspect: the policy doesn't just mobilize the winners; it physically removes the losers from the jurisdiction or the sample. This is a specific, powerful subtype of feedback loop.

  ### 2. The Economic Engine: Insider-Outsider Theory
  The economic mechanism you described is formally known as **Insider-Outsider Theory** (developed by Assar Lindbeck and Dennis Snower).

  *   **Definition:** Labor markets (and housing markets) are divided into "Insiders" (those with secure jobs/leases) and "Outsiders" (the unemployed/house-hunters). Insiders have an incentive to use their political or bargaining power to protect their status, even if it harms Outsiders, because the Outsiders have no voice in the negotiation.
  *   **Relevance:** This explains *why* the sitting tenants defend rent control even if it reduces overall housing supply. They are protecting their insider status against the outsider pool.

  ### 3. The Silence Mechanism: Exit vs. Voice
  The reason the losers are silent is explained by Albert Hirschman's framework in *Exit, Voice, and Loyalty*.

  *   **Definition:** When an organization or system deteriorates, members have two options: **Voice** (complain/protest) or **Exit** (leave).
  *   **Relevance:** In your scenario, the policy makes "Exit" the only rational choice for the losers (they move to a different city; they don't apply for the job). Because they Exit, they forfeit Voice. The political system only hears the Voice of those who didn't Exit.

  ### 4. A Name for Your Specific Observation
  Since "Policy Feedback" is broad and "Insider-Outsider" is economic, if you want a label for the specific *epistemic and demographic distortion* you described, the most precise technical term is:

  **Endogenous Constituency Selection**

  *   **Definition:** A process where a policy alters the composition of the affected population over time, systematically retaining beneficiaries and filtering out victims, thereby creating a self-reinforcing political bias that makes the policy appear more successful or popular than it objectively is.
  *   **Why "Endogenous"?** In statistics, "exogenous" means coming from outside the model, and "endogenous" means generated *within* the model. Here, the bias isn't an accident of sampling; the policy *generates* the bias itself.
  *   **Why "Selection"?** It is a selection effect, but unlike standard survivorship bias (where you accidentally ignore the dead), this is a causal selection (the policy *kills* the data points).

  ### 5. Boundary Cases and Nuance

  You asked for boundary cases to test the definition. Here is how **Endogenous Constituency Selection** holds up:

  **Case A: The Winners Drift Away (Does it still count?)**
  *   *Scenario:* A subsidy is given to young artists to live in a city. Over 30 years, those artists age, become wealthy, and move to the suburbs.
  *   *Verdict:* **No, the feedback loop breaks.** For Endogenous Constituency Selection to work, the beneficiaries must remain *politically relevant* in the jurisdiction. If the winners exit (like the losers), the constituency evaporates. This is why rent control is more susceptible than a one-time cash grant; rent control ties the benefit to *staying*, locking the beneficiary into the political jurisdiction.

  **Case B: The Losers Organize Externally (YIMBYs)**
  *   *Scenario:* People who cannot find housing in the city organize in the suburbs or at the state level to override the local rent control.
  *   *Verdict:* **The bias is mitigated.** The "Exit" did not silence the "Voice"; it relocated it. This happens when the "Outsiders" (potential tenants) form a coalition with ideological allies (developers, libertarians) who *are* in the room. Your model predicts this will be harder the longer the policy lasts, because the "Outsider" class becomes more diffuse and transient.

  **Case C: Concentrated Benefits vs. Diffuse Costs**
  *   *Your distinction:* You noted this isn't Olson's "Concentrated Benefits/Diffuse Costs."
  *   *Verification:* You are correct. Olson's theory is about **organization costs** (it's easy for 100 people to organize $1,000 each than for 1,000,000 people to organize $0.10 each). Your observation is about **existence**. In your model, the losers aren't just disorganized; they are *gone*. Even if the losers were easy to organize, they cannot be organized if they live in a different state.

  ### 6. The Time Dimension: Path Dependence
  You noted: *"A rule that's been in place for thirty years has a far more lopsided constituency than the same rule passed last year."*

  This is **Path Dependence**.
  *   **Year 1:** The losers are still in line, waiting. They remember the market before the rule.
  *   **Year 30:** The losers have left. The winners have built lives around the discount. The "counterfactual" (what the city would look like without the rule) is no longer visible to anyone living there. The policy has created a new reality where the policy seems natural.

  ### Summary
  You have identified a real, documented dynamic.
  *   **Political Science:** Calls it **Policy Feedback** (specifically the constituency-building effect).
  *   **Economics:** Calls it **Insider-Outsider Dynamics**.
  *   **Sociology:** Calls it **Exit over Voice**.
  *   **Precise Label:** **Endogenous Constituency Selection**.

  It is distinct from survivorship bias because the selection is causal, not observational. It is distinct from Concentrated Benefits because the opposition is absent, not just disorganized. It is a potent form of status quo bias because the policy actively dismantles the coalition that would oppose it.
