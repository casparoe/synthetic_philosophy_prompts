prompt: |-
  Can you walk me through the conceptual problem with saying the design stance is just the intentional stance with the beliefs edited out? Like, if I'm predicting a thermostat I can do it physically (tracking heat flow) or via design (it regulates temperature but doesn't literally want anything). The design explanation picks out patterns—malfunction, optimality—that the physical stance misses, but it doesn't need full mental machinery. So is the design stance carving out it's own kind of real pattern, or is it just borrowing intentional-stance structure without the ontology? And if real patterns are only those that support counterfactual predictions we can't make at other levels, then a broken thermostat and a working one have totally different design-level patterns even though the physical story is continuous. I'm trying to figure out if Dennett's framework is genuinely three stances or if design is just intentional-lite with extra normative bagage. What's the right way to think about that?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

