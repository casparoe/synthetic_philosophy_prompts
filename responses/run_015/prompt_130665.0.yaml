answer: |-
  This is a sharp question that cuts right to the ontological status of Dennett's "Real Patterns." You are identifying a tension that often gets glossed over in introductory summaries of Dennett: **Is the Design Stance an autonomous level of explanation, or is it merely a degenerate case of the Intentional Stance?**

  If the Design Stance is just "Intentional minus the beliefs," then Dennett really only has two stances (Physical and Intentional), with Design acting as a fuzzy border region. However, if you look closely at how Dennett deploys the framework, particularly regarding **normativity** and **history**, the Design Stance does genuine work that the Intentional Stance cannot do without over-intellectualizing the system.

  Here is the walkthrough of why the Design Stance is conceptually distinct, not just "Intentional-lite."

  ### 1. The Source of Normativity
  The core difference lies in where the "ought" comes from.

  *   **Intentional Stance:** The normativity comes from **rationality**. If I attribute beliefs and desires to you, I predict you will act to satisfy those desires *given* those beliefs. If you act irrationally, the stance loses predictive power. The "ought" is internal to the logic of the agent.
  *   **Design Stance:** The normativity comes from **history/selection**. If I attribute a design to a heart or a thermostat, I predict it will pump blood or regulate temperature. If it fails, it is "broken." The "ought" is external, imposed by the designer or the evolutionary process that selected for that function.

  **Why this matters:** A thermostat does not need to be rational to have a design function. It doesn't need to update beliefs. It just needs to have been built to do X. If you treat a thermostat via the Intentional Stance ("It *wants* the room to be 70°"), you are attributing a interiority it doesn't need. If you treat it via the Design Stance ("It is built to close the circuit at 70°"), you are attributing a functional role derived from its construction.

  If Design were just "Intentional minus beliefs," you would still be assuming the system is optimizing for a goal *in the moment*. But the Design Stance allows you to predict the behavior of systems that are **rigidly optimized** rather than **flexibly rational**.

  ### 2. The "Broken Thermostat" and Counterfactuals
  You hit on the crucial test case: *A broken thermostat and a working one have totally different design-level patterns even though the physical story is continuous.*

  This is the strongest argument for the autonomy of the Design Stance.
  *   **Physical Stance:** Sees a continuous degradation of metal fatigue or electron flow. It sees no "break," only a change in state.
  *   **Intentional Stance:** Struggles here. If the thermostat is "trying" to regulate temperature but failing, does it have false beliefs? Is it irrational? Attributing intentions to a broken artifact creates noise. It implies the system has representational states that are misfiring.
  *   **Design Stance:** Handles this cleanly. The design specification remains constant (the blueprint hasn't changed), but the instantiation fails to match the specification.

  **The Counterfactual Test:**
  Dennett argues a pattern is real if it supports counterfactuals that other stances cannot efficiently support.
  *   *Design Counterfactual:* "If this thermostat were functioning according to its design, it would click on now."
  *   *Physical Counterfactual:* "If these electrons were flowing differently..." (Too complex).
  *   *Intentional Counterfactual:* "If it believed the room was cold..." (Ontologically bloated).

  The Design Stance carves out a pattern of **functional reliability** that exists independently of the system's current physical integrity or mental capacity. The "brokenness" is a real pattern because it is a deviation from a historical/functional norm, not a deviation from physical law (there is no law of physics against a thermostat failing) or rational norm (thermostats aren't rational).

  ### 3. Is Design Borrowing Intentional Structure?
  Your worry is that Design is "borrowing intentional-stance structure without the ontology."

  It is more accurate to say that **Intentionality is a special case of Design.**
  Dennett's evolutionary view suggests that nature first creates Design Stance objects (hearts, eyes, bacteria) through natural selection. These systems have functions (proper functions) but no beliefs. Later, through the evolution of complex control systems (brains), some Design Stance objects become sophisticated enough that the best way to predict them is to treat them *as if* they have beliefs.

  So, the dependency arrow points the other way:
  1.  **Physical:** Base level.
  2.  **Design:** Emerges when physical systems are organized by selection/engineering for function.
  3.  **Intentional:** Emerges when Design systems become complex enough that treating them as rational agents is the best compression algorithm.

  The Design Stance isn't borrowing from the Intentional; the Intentional is borrowing the teleological structure of the Design and internalizing it.

  ### 4. Compression and "Real Patterns"
  To answer your question about whether it's "genuinely three stances": Yes, because each stance offers a different **compression algorithm** for reality.

  *   **Physical:** Lossless compression (in theory), but computationally intractable for complex systems.
  *   **Design:** Lossy compression. It ignores the *how* (mechanism) to focus on the *what* (function). It treats the system as a black box with a specified input/output mapping defined by its origin.
  *   **Intentional:** Even lossier (in terms of mechanism) but higher gain for complex agents. It ignores the *design details* (neural wiring) to focus on the *reasons*.

  If Design were just Intentional-lite, you wouldn't need it as a separate category. You could just say "Intentional Stance with zero beliefs." But that creates a category error. A virus has a design (replicate), but attributing "desire to replicate" is a metaphor. Attributing "design function to replicate" is a biological fact (in Dennett's view).

  The Design Stance allows us to talk about **teleology without mentality**. If you collapse Design into Intentional, you risk panpsychism (everything has proto-beliefs) or you lose the ability to describe biological function without metaphor.

  ### 5. The Verdict
  The conceptual problem you identified arises if you view the stances as **ontological layers** (like a cake). If they are layers, Design looks like a thin slice of Intentional.

  But Dennett views them as **strategies for prediction**.
  *   When I predict a chess computer, I can use Design (it's programmed to maximize material advantage) or Intentional (it wants to win).
  *   When I predict a heart, I can *only* use Design (it pumps blood). Intentional is unavailable.
  *   When I predict a human, Intentional is usually best, but Design explains reflexes (knee jerk).

  **Conclusion:**
  The Design Stance is not "Intentional with beliefs edited out." It is **Teleology derived from History.**
  The Intentional Stance is **Teleology derived from Representation.**

  The "broken thermostat" example proves the Design Stance is autonomous. A broken thermostat violates a design norm, not a rational norm. Therefore, the pattern of "malfunction" is a Real Pattern that requires the Design Stance to identify. Without the Design Stance, you are left with the Physical Stance (which sees no error, only difference) or the Intentional Stance (which sees irrationality where there is only mechanics).

  So, Dennett's framework is genuinely three stances. The Design Stance is the bridge that allows normativity to enter the physical world via evolution and engineering, before cognition ever gets involved. It carries the normative baggage of "proper function," which is distinct from the normative baggage of "rational consistency."
