answer: |-
  This is a sophisticated question that cuts to the heart of contemporary metaontology. You are right to be suspicious of the "disambiguation criterion." While it is the intuitive starting point for distinguishing verbal from substantive disputes, formalizing it without begging the question is notoriously difficult.

  Here is a walkthrough of the criterion, its failure modes, and how the Quine–Carnap debate maps onto it.

  ### (a) The Disambiguation Criterion

  The criterion you are referring to is most rigorously formulated by David Chalmers (in "Verbal Disputes") and refined by others like Ted Sider. It attempts to cash out the intuition that a verbal dispute is one where the parties "talk past each other."

  **The Precise Statement:**
  A dispute between party $A$ and party $B$ over a sentence $S$ is **merely verbal** if and only if:
  1.  There is a term $t$ in $S$ that is ambiguous or indeterminate in its meaning.
  2.  There exist two distinct interpretations (meanings), $I_1$ and $I_2$, for $t$.
  3.  Under interpretation $I_1$, $A$ accepts $S$ and $B$ also accepts $S$ (or at least does not reject it).
  4.  Under interpretation $I_2$, $A$ rejects $S$ and $B$ rejects $S$ (or at least does not accept it).
  5.  **Crucially:** $A$ and $B$ agree on all the underlying non-semantic facts that determine the truth value of $S$ under both interpretations.

  **Why it tracks "merely verbal":**
  The rationale is that if the disagreement vanishes once we fix the meaning of the term, and the parties agree on all the "worldly" facts relevant to those meanings, then the disagreement was never about the world. It was purely about which linguistic label to apply to the agreed-upon reality.

  For example, in the classic "Is a hotdog a sandwich?" dispute:
  *   $A$ (Yes) uses a definition of "sandwich" based on *filling between starch*.
  *   $B$ (No) uses a definition of "sandwich" based on *cultural categorization*.
  *   Once we fix the definition, they agree on the physical facts (it is meat in bread) and the cultural facts (it is sold at hotdog stands). The dispute dissolves.

  This criterion is supposed to save the phenomenon of verbal disputes without committing to the idea that *all* disputes are verbal. It allows for substantive disputes where, even after disambiguation, the parties still disagree on the truth of $S$ because they disagree on the underlying facts.

  ### (b) Where the Criterion Fails: The "Neutral Base" Problem

  The disambiguation criterion faces a severe technical challenge in metaontology, specifically regarding **ontological commitment**. The failure arises in condition (5): *Agreement on underlying non-semantic facts.*

  **The Case: Composition (Nihilism vs. Universalism)**
  Consider the dispute between a **Mereological Nihilist** (who believes only simple particles exist; no composite objects like tables) and a **Mereological Universalist** (who believes that for any objects, there exists a fusion of those objects; tables exist).
  *   **Nihilist:** "There are no tables."
  *   **Universalist:** "There are tables."

  **Applying the Criterion:**
  To determine if this is verbal, we try to disambiguate "exist" or "object."
  *   *Interpretation 1 (Nihilist-friendly):* "Exist" means "is a simple particle." Both agree there are simples arranged tablewise. Dispute dissolves?
  *   *Interpretation 2 (Universalist-friendly):* "Exist" means "is a value of a bound variable in our best theory." Both agree our best theory quantifies over tables. Dispute dissolves?

  **Why it Fails (The Indeterminacy):**
  The problem is that we cannot specify the "underlying non-semantic facts" without already taking an ontological stance.
  *   To say they agree on the "underlying facts," we need a neutral language to describe the world. We might say: "They both agree there are *simples arranged tablewise*."
  *   But the Nihilist says: "Yes, simples arranged tablewise."
  *   The Universalist says: "No, there is not just an arrangement; there is an *object* composed of them."

  If you describe the base facts using the Nihilist's ontology (only simples), the Universalist looks like they are adding a verbal flourish. If you describe the base facts using the Universalist's ontology (simples + composites), the Nihilist looks like they are denying a fact.

  **The "Quantifier Variance" Trap:**
  Philosopher Eli Hirsch argues this *is* a verbal dispute (Quantifier Variance): the parties use different "existential quantifiers." But Ted Sider argues the criterion fails here because there is a "joint-carving" structure to the world. Sider argues that one party is literally missing the structure of reality (the composite object). If Sider is right, there is no "neutral base" of facts they agree on. The Universalist thinks the world contains *more entities* than the Nihilist does.

  Therefore, the disambiguation criterion is **indeterminate** here because applying it requires a prior decision about what counts as an "underlying fact." If ontology is not neutral, you cannot use the disambiguation criterion to decide ontology without circularity. You have to already know the ontology to list the facts they agree on.

  ### (c) Mapping Quine and Carnap

  This brings us to the Quine–Carnap disagreement. Your intuition is correct: Carnap's position is **not** best understood as the "disambiguation criterion" in the standard sense. It is stronger, and in a way, more destructive.

  **1. Carnap: Pseudo-Questions, Not Verbal Disputes**
  In *Empiricism, Semantics, and Ontology* (ESO), Carnap distinguishes between:
  *   **Internal Questions:** Asked *within* a linguistic framework (e.g., "Is there a prime number greater than 100?"). These have cognitive, factual answers.
  *   **External Questions:** Asked *about* the framework itself (e.g., "Do numbers exist?").

  Carnap argues that if the external question is meant as a **theoretical/cognitive** question (a fact of the matter), it is a **pseudo-question**. It has no answer. It is not that the answer is "yes" under one meaning and "no" under another (which would be the disambiguation/verbal view). It is that the question *itself* is meaningless because "existence" only has meaning *inside* a framework.

  If the external question is meant as a **practical** question ("Should we adopt the number framework?"), it has an answer, but the answer is pragmatic (efficiency, fruitfulness), not factual.

  *   **Mapping to Theist/Atheist:** If we apply Carnap's logic to "Do gods exist?":
      *   *Internal:* Within the theistic framework, "God exists" is analytic or empirically confirmed by religious experience.
      *   *External (Theoretical):* "Do gods really exist (independent of the framework)?" is a pseudo-question.
      *   *External (Practical):* "Should we adopt the theistic framework?" is a pragmatic decision.
      *   **Verdict:** Carnap does **not** say the dispute is merely verbal (where both agree on facts but differ on words). He says the atheist and theist are trying to answer a question that has no factual content.

  **2. Quine: Ontology is Substantive**
  Quine's "On What There Is" is a direct attack on Carnap's separation.
  *   **Rejection of Internal/External:** Quine argues there is no privileged "framework" language separate from our "theory" of the world. We have one big web of belief.
  *   **Criterion of Ontological Commitment:** "To be is to be the value of a bound variable." We look at our best scientific theory, translate it into first-order logic, and see what the quantifiers range over.
  *   **Univocity of Existence:** Quine insists "exists" has one meaning (the existential quantifier $\exists$). It does not change meaning between "numbers exist" and "chairs exist."

  **3. How Quine Targets Carnap**
  Quine targets Carnap's view by attacking the **Analytic/Synthetic distinction** (later fully developed in "Two Dogmas of Empiricism").
  *   Carnap needs the distinction to say framework adoption is "analytic" or "pragmatic" (not factual), while internal claims are "synthetic" (factual).
  *   Quine argues that framework choices are themselves theoretical posits. Adopting a framework that includes numbers is a scientific hypothesis, just like adopting a framework that includes electrons.
  *   **The Clash:**
      *   **Carnap:** The ontologist asking "Do numbers exist?" is making a category mistake. (Closer to "Pseudo-question" than "Verbal").
      *   **Quine:** The ontologist is doing science. The dispute is substantive because it is about which theory best predicts experience.
      *   **Relation to Disambiguation:** Quine would reject the disambiguation criterion for ontology. He thinks there is no ambiguity to resolve. "Exist" means $\exists$. If the Nihilist and Universalist disagree, they disagree about the world (specifically, about what our best theory quantifies over), not about meanings.

  **Summary of the Map:**
  *   **Disambiguation Criterion:** Assumes there *are* underlying facts, and the dispute is about labeling them. (Chalmers/Hirsch).
  *   **Carnap:** Denies there are underlying facts for external questions. The dispute is **non-cognitive**. (Stronger than verbal).
  *   **Quine:** Asserts there *are* underlying facts (scientific theory), and "existence" is univocal. The dispute is **substantive**.

  So, to answer your specific question: Carnap's move is **not** best understood as showing the dispute is merely verbal in the disambiguation sense. It is best understood as showing the dispute is a **pseudo-question** (if taken theoretically). Quine's reply targets this by collapsing the framework/fact distinction, thereby forcing the dispute back into the realm of substantive, factual disagreement where the disambiguation criterion is irrelevant (because the meaning of "exist" is fixed by logic).

  This is why the rabbit hole goes so deep: Quine and Carnap disagree on the rules of the game (whether ontology is science or pragmatics), while the "disambiguation" crowd (Chalmers, Sider, Hirsch) are trying to play a game on a board that Quine and Carnap built differently.
