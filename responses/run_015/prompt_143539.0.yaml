answer: |-
  You're thinking of **Ian Hacking**. He called it the "looping effect of human kinds." Basically, when you classify people, they change to fit (or fight) the classification, which then changes the classification itself.

  Here is the practical decision procedure you asked for. It is designed for a 20-minute call. It uses American English spelling.

  ### The Intake Routing Procedure (20-Minute Call)

  **Goal:** Assign a routing bucket while flagging "pre-looping" (when a client performs a label they learned from you).

  #### Step 1: Safety Sweep (Minutes 0–5)
  *Ask directly:* "In the past week, have you had thoughts of harming yourself or others, or felt unable to keep yourself safe?"
  *   **Yes:** Tag **Acute Crisis**. Stop the procedure. Notify clinical director immediately.
  *   **No:** Proceed to Step 2.

  #### Step 2: The Source Check (Minutes 5–10)
  *Ask:* "You mentioned [Bucket Name] earlier. What makes you say that?"
  *   **Listen for:** Specific behaviors/symptoms vs. marketing language.
  *   **Good Enough Answer:** "I haven't slept in 4 days because of work" (Describes function).
  *   **Pre-Looping Flag:** "Because your website says that's for people like me" or "My friend said I fit here."
  *   **Action:** If flagged, dig deeper. Ask: "If we didn't have that label on the website, how would you describe what's happening?"
      *   If they cannot describe symptoms without the label, mark **Pre-Looping High Risk**.

  #### Step 3: Duration and Function (Minutes 10–15)
  *Ask:* "How long has this been going on, and what can't you do now that you could do before?"
  *   **Adjustment Stress:** Started within 3 months of a specific event. Function is bumped but mostly intact.
  *   **Chronic Management:** Going on >6 months. Pattern repeats. Function is consistently impaired.
  *   **Uncategorized:** Symptoms don't match duration, or description is vague ("just tired").

  #### Step 4: Label Alignment (Minutes 15–18)
  *Ask:* "Based on what we discussed, I'm leaning toward [Bucket]. How does that land with you?"
  *   **Accepts:** Proceed to scheduling.
  *   **Rejects:** Client argues against the clinical fit based on personal values (e.g., "I'm not chronic, I'm just broken").
  *   **Action:** If they reject a clinically accurate label strongly, mark **Values Conflict**.

  #### Step 5: The Stop Rules (Minute 19–20)
  **Escalate to Senior Clinician if:**
  1.  **Pre-Looping High Risk** + **Uncategorized** (Client is parroting labels but symptoms are unclear).
  2.  **Values Conflict** (Client refuses the clinically necessary bucket).
  3.  **Safety Sweep** was ambiguous (Not a clear "yes," but not a clear "no").

  **Make the Call Yourself if:**
  1.  Safety is clear.
  2.  Symptoms match the bucket regardless of the label used.
  3.  Client accepts the routing, even if they used the wrong words initially.

  ***

  ### Applying the Procedure to Your Cases

  #### Case 1: The 19-Year-Old College Kid
  *   **Scenario:** Says he's "definitely adjustment stress" because he read the FAQ. Wants short-term therapy.
  *   **Step 2 (Source Check):** He admits he read the FAQ. **Pre-Looping Flagged.**
  *   **Step 3 (Duration/Function):** You ask what he can't do now. He says, "I can't focus on essays since finals started." This fits the *symptoms* of adjustment stress, even if the *label* was copied.
  *   **Step 4 (Alignment):** He accepts the routing.
  *   **Decision:** Tag **Adjustment Stress**.
  *   **Note:** Add a internal note: "Client sourced label from website, but symptoms align." No escalation needed because the clinical picture matches the bucket, even if the vocabulary was learned.

  #### Case 2: The 45-Year-Old "Just Tired"
  *   **Scenario:** Insists she's "just tired." Describes classic panic. Gets angry at labels.
  *   **Step 2 (Source Check):** She isn't using your language; she is avoiding it. No pre-looping, but high resistance.
  *   **Step 3 (Duration/Function):** She describes panic attacks (acute symptoms) but says it's fatigue (chronic vague symptom). Mismatch.
  *   **Step 4 (Alignment):** She rejects mental health labels entirely.
  *   **Decision:** Tag **Uncategorized**. **Escalate to Senior Clinician.**
  *   **Why:** You cannot force a label on someone who rejects the framework. A senior clinician needs to handle the rapport building before routing. Do not tag "Acute Crisis" unless safety is at risk, because she will likely flee care.

  #### Case 3: The "Chronic" Client Who Wants "Uncategorized"
  *   **Scenario:** Procedure says "Chronic Management" (years of issues, recurring). She hates that idea. Wants "Uncategorized" because "Chronic" feels like a life sentence.
  *   **Step 3 (Duration/Function):** Clinically, she is Chronic.
  *   **Step 4 (Alignment):** She rejects the label. **Values Conflict Flagged.**
  *   **Step 5 (Stop Rules):** This hits the **Values Conflict** escalation rule.
  *   **Where the Procedure Breaks:** The procedure tells you to escalate, but it doesn't tell you what the senior clinician should decide. This is the break point.
  *   **Human Choice:** A human has to decide: Do we honor her self-view (tag Uncategorized) to keep her in care, or do we tag Chronic to ensure she gets the right level of resources?
      *   *Recommendation:* Tag **Uncategorized** for the client-facing system (to keep her engaged), but use an internal code for **Chronic Management** so the clinician knows the workload. This requires a human to authorize the dual-tagging. The checklist cannot make this ethical call.

  ***

  ### What This Procedure Can't Do

  1.  **It Can't Stop Pre-Looping:** If your website promises "short-term help" for adjustment stress, people will claim that to get faster care. The checklist flags it, but it doesn't fix the marketing that caused it.
  2.  **It Can't Resolve Values Conflicts:** Case 3 shows that sometimes clinical accuracy fights against client dignity. The procedure tells you *when* you have a problem, not *how* to solve it. That requires human judgment.
  3.  **It Can't Diagnose:** This is routing, not diagnosis. If a client is "performing the bucket" well enough to pass Step 2, you might still route them wrong. Only treatment reveals the truth.
  4.  **It Can't Measure Hope:** A client might say they fit "Adjustment Stress" because they hope their problem is small, not because they believe it is. The procedure treats their words as data, but it can't measure their hope or fear.

  ### Final Note on Limitations
  You need to accept that the tag will change the client. That is unavoidable. The goal of this checklist is not to prevent the loop, but to make sure you see the loop happening before you lock the file. When you see the **Pre-Looping Flag**, treat the label as provisional, not fact.
