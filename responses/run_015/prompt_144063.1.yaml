      *   **Section 5: The Moral/Epistemic Shift (The User's Insight).** This is the payoff. Validate the user's intuition. The Fence is about risk management. In *The Lottery*, the risk is concentrated on the victim, the benefit diffuse. This breaks the Fence because the "cost of being wrong" is asymmetric.
