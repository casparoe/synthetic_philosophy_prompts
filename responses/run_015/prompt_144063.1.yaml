      *   **Point 5: The Moral Cost (The User's Insight).**
          *   This is the strongest point. Chesterton's Fence is usually epistemic (don't break what you don't understand). But *The Lottery* makes it moral (don't keep what you don't understand if it kills people).
          *   The Friend's counter ("Chesterton doesn't say what to do if nobody understands") is the key. Chesterton assumes the fence is likely good. If the fence is a gallows, the principle flips.
