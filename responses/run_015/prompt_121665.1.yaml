          *   Analytic = Model Structure/Identities (protected).
          *   Synthetic = Coefficients/Predictions (tested).
          *   The Boundary = The line between specification and estimation.
          *   Quine's Attack = You can't keep them separate during debugging.
      *   **Holism as "Degrees of Freedom":**
          *   When $p > 0.05$, what do you change? The theory ($\beta$), the controls ($X$), the error term ($\epsilon$)?
          *   This is the "Web of Belief."
      *   **The Residue Report:**
          *   *Clean Fit:* Duhem-Quine $\approx$ Identification Strategy/Auxiliary Assumptions.
          *   *Distortion:* Quine cares about *meaning*, Stats cares about *error*.
          *   *The Missing Counterpart:* The normative force of logic vs. the pragmatic force of convergence. Preregistration tries to solve a problem Quine says is unsolvable in principle.
      *   **Conclusion:** Answer the final question directly. Stats handles the *practice* of holism (via sensitivity analysis), but misses the *philosophical implication* (that there is no "view from nowhere" or theory-neutral data).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* Quine thinks the boundary is blurry?
