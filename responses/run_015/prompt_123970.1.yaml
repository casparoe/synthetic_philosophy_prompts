      *   *Correction:* Clarify the "Wife/Drowning" example. Actually, Williams uses the "Wife/Drowning" example for "One Thought Too Many." He uses "George/Chemist" and "Jim/Indians" for Integrity. The roommate mixed the examples slightly or implied they serve the exact same function.
      *   *Nuance on Universalism:* Williams isn't an ethical relativist. He believes in moral truth, but thinks the *system* of Utilitarianism fails to account for the agent's perspective.
