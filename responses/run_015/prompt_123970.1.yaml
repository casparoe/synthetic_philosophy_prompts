answer: |-
  Your skepticism is well-founded. Your roommate has grasped the *spirit* of Williams's critique but has collapsed distinct arguments, overgeneralized the target, and turned a nuanced position into a somewhat caricatured one.

  Here is a breakdown of what is accurate, what is a misrepresentation, and how the two specific arguments differ.

  ### 1. The Conflation: "One Thought Too Many" vs. The Integrity Objection
  **Verdict:** Your roommate is **incorrect** to say these are "basically the same argument." They are distinct critiques that target different mechanisms of Utilitarianism.

  *   **One Thought Too Many (The Drowning Wife):**
      *   **The Scenario:** A man comes across two people drowning: his wife and a stranger. He can only save one. He saves his wife.
      *   **The Utilitarian Demand:** To be morally praiseworthy, the man should justify this via an impartial calculation (e.g., "I saved her because she produces more utility," or "I am generally more useful if my wife survives").
      *   **Williams's Point:** This is about **motivation**. If the husband has to consult a moral principle to justify saving his wife, he has had "one thought too many." Love *just is* a reason to act. To require an impartial overlay on top of personal love is to misunderstand the nature of personal relationships.
      *   **Scope:** This targets the *psychological demand* of impartiality in personal life.

  *   **The Integrity Objection (George the Chemist / Jim and the Indians):**
      *   **The Scenario:** George is offered a job in a chemical weapons lab. If he refuses, a zealous utilitarian will take the job and do it *worse* (causing more suffering). Utilitarianism says George must take the job to minimize net suffering.
      *   **Williams's Point:** This is about **agency and negative responsibility**. Utilitarianism holds you responsible for what you *fail to prevent* just as much as what you *do*. This forces George to violate his own conscience (his integrity) to become a "channel" for the utility of the universe.
      *   **Scope:** This targets the *structural demand* that an agent abandon their "ground projects" (core life commitments) whenever the calculus demands it.

  **Why the distinction matters:** The "One Thought" argument says Utilitarianism misunderstands *love*. The "Integrity" argument says Utilitarianism misunderstands *the self*. Your roommate collapsed these into one point about "calculation," missing the deeper point about negative responsibility in the Integrity objection.

  ### 2. The Target: Utilitarianism vs. "Universal Ethics"
  **Verdict:** Your roommate is **overgeneralizing**. You are correct that Williams was primarily attacking Utilitarianism (and to a lesser extent, Kantian abstraction), not the very idea of universal morality.

  *   **Williams's Actual View:** Williams did not argue that *all* impartial morality is alienating. He argued that Utilitarianism is uniquely alienating because it creates a radical split between the agent's personal point of view and the "view from nowhere."
  *   **The Misrepresentation:** Your roommate claims Williams proves "any moral system demanding impartial calculation is literally alienating." Williams would likely agree that *excessive* impartiality is alienating, but he does not argue that we cannot have universal moral duties. He argues that those duties cannot simply *overwrite* personal identity without cost.
  *   **The "Betrayal" Claim:** Your roommate says, "universal ethics is always going to feel like betrayal." This is false. Williams argues that Utilitarianism *makes it* feel like betrayal because it treats your personal commitments as just another set of preferences to be weighed against a stranger's. A different moral system (e.g., a virtue ethic or a rights-based system) might accommodate partiality without feeling like betrayal.

  ### 3. The Claim About Partiality
  **Verdict:** This is a **straw man**.

  *   **Roommate's Claim:** "Williams thinks partiality to loved ones is the only genuine reason to act."
  *   **Williams's Actual View:** Williams never argued that partiality is the *only* reason to act. He argued that partiality is a *legitimate* and *necessary* component of a meaningful human life. He defends "ground projects" (things you care about deeply, like art, family, or career) as essential to identity.
  *   **Why it matters:** If partiality were the *only* reason to act, Williams would be an egoist or a relativist. He wasn't. He was arguing against a system that demands we treat our own projects as having *no more weight* than a stranger's whims. He wants a balance, not the elimination of universal duty.

  ### 4. Does the Conclusion Follow?
  **Verdict:** **No.**

  Your roommate concludes: *"Williams proves universal morality is alienating."*

  This does not follow for two reasons:
  1.  **Specific vs. General:** Williams demonstrated that *Utilitarianism* is alienating because of its specific commitment to negative responsibility and aggregative utility. He did not prove that *Kantianism*, *Contractualism*, or *Virtue Ethics* are equally alienating. (Though he did critique Kant for being too abstract, the "Integrity" objection is specifically potent against Consequentialism).
  2.  **Alienation vs. Impossibility:** Even if a system is alienating, that doesn't mean it is false. Williams's point is largely that a moral theory that requires us to cease being human (by abandoning our ground projects) is a bad theory *for humans*. It is a pragmatic and psychological critique, not necessarily a proof that universal truths don't exist.

  ### Summary for Your Roommate
  You can tell your roommate he got the "vibe" right but the philosophy wrong.

  1.  **Accurate:** Williams does argue that Utilitarianism causes alienation from one's "ground projects." He does argue that saving your wife via a cost-benefit analysis undermines the nature of marriage.
  2.  **Inaccurate:** The "One Thought Too Many" example and the "Integrity Objection" are **not** the same argument. One is about motivation in relationships; the other is about moral responsibility and agency.
  3.  **Overgeneralization:** Williams was attacking **Utilitarianism**, not all universal ethics. He does not claim partiality is the *only* reason to act, only that it is a valid one that Utilitarianism ignores.
  4.  **False Conclusion:** Williams does not prove universal morality is inherently alienating; he proves that a morality which demands total impartiality is incompatible with personal integrity.

  **The Bottom Line:** Your roommate turned a specific critique of Consequentialism into a broad claim that "all ethics is betrayal." Williams's actual point was more humane: a moral theory that doesn't make room for the person living the life is a bad moral theory.
