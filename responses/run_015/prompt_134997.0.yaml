answer: |-
  To analyze the 2006 IAU redefinition of Pluto through Frege's framework, we must first rigorously map the semantic components of the Hesperus/Phosphorus case onto the Pluto episode, and then identify exactly where the mapping fractures.

  ### 1. The Fregean Mapping

  In the classic puzzle, "Hesperus" and "Phosphorus" are proper names. They share a **Reference** (*Bedeutung*)—the physical planet Venus—but differ in **Sense** (*Sinn*)—the mode of presentation ("star seen in the evening" vs. "star seen in the morning"). The statement "Hesperus is Phosphorus" is informative because it equates two distinct senses that happen to latch onto the same reference. The informativeness is epistemic; the reality of Venus is unchanged.

  In the Pluto case, we must distinguish between the name "Pluto" and the kind term "Planet."

  *   **"Pluto" (Proper Name):** Its Reference is the specific trans-Neptunian object. This Reference remained fixed throughout the controversy. No one argued that the physical object disappeared or moved. Its Sense might be "the ninth body discovered in the outer solar system," but that is secondary to its rigid designation of the object.
  *   **"Planet" (Kind Term):** In Fregean terms, a general term has a Sense (the criteria or concept) and a Reference (the extension, or the set of objects falling under that concept).
      *   *Pre-2006 Sense:* Roughly "a large, round body orbiting the Sun."
      *   *Pre-2006 Reference:* The set {Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune, Pluto}.
      *   *Post-2006 Sense:* "A large, round body orbiting the Sun *that has cleared its orbital neighborhood*."
      *   *Post-2006 Reference:* The set {Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune}.

  The IAU's statement "Pluto is a dwarf planet" functions as an identity claim regarding category membership. It asserts that the Reference of "Pluto" is excluded from the Reference of "Planet" and included in the Reference of "Dwarf Planet."

  In the Hesperus case, the discovery reveals that two *existing* senses converge on one reference. In the Pluto case, the "discovery" forces a *revision* of the Sense of "Planet," which consequently alters its Reference. The informativeness of "Pluto is not a planet" does not come from realizing two senses pick out the same object (as with Venus); it comes from realizing that the community has altered the Sense of the predicate "Planet" such that it no longer applies to the object "Pluto."

  ### 2. Eris: Empirical Discovery or Definitional Stipulation?

  The discovery of Eris by Mike Brown is the catalyst that exposes the tension between Fregean semantics and scientific taxonomy.

  If we treat "Planet" as a natural kind term (like "Water" or "Gold"), its Reference should be fixed by the underlying physical structure of the objects, and its Sense should merely describe our current grasp of that structure. Under this view, finding Eris should have been a pure empirical discovery: "Eris is a planet." If Eris is a planet, and Pluto is like Eris, then Pluto is a planet. The identity statement "Pluto is a planet" would remain true, and the extension of "Planet" would simply expand.

  However, the IAU response treated "Planet" not as a natural kind waiting to be discovered, but as a nominal kind defined by utility. The influx of new objects (Eris, Makemake, Haumea) threatened to make the Reference of "Planet" unwieldy. The IAU intervention was a **definitional stipulation**. They added a clause ("clearing the neighborhood") to the *Sense* of "Planet" specifically to exclude Pluto and Eris from the *Reference*.

  Through a Fregean lens, this creates a hybrid statement. It looks like an empirical claim ("Pluto fails to clear its neighborhood"), but it functions as a legislative act ("We shall not call bodies that fail to clear their neighborhood 'Planets'"). The informativeness of the identity "Pluto is a dwarf planet" is not derived from hidden semantic content waiting to be uncovered (like the Venus orbit), but from a deliberate narrowing of the concept's Sense to manage the size of its Reference.

  ### 3. Where the Theory Goes Silent

  Frege's framework is designed to explain how cognitive agents grasp objective truths. It assumes that Senses are abstract, timeless entities that mediate between the mind and the world. The Pluto episode reveals three specific areas where this logic breaks down when applied to institutional science.

  **A. The Instability of Sense**
  Frege assumes that while different agents may grasp a Sense differently, the Sense itself is stable enough to determine truth conditions. In the Pluto case, the Sense of "Planet" was not discovered; it was *voted on*. Frege has no mechanism for "reference-fixing by decree." In his logic, you cannot change the truth value of a statement by raising your hand; you can only change your mind about the facts. The IAU vote demonstrates that in scientific taxonomy, the Sense of a term is a social tool subject to negotiation, not just an abstract mode of presentation. Frege explains the structure of the meaning, but he cannot account for the *authority* required to shift that meaning.

  **B. Essentialism vs. Nominalism**
  The public and professional outcry ("Pluto has been demoted," "Pluto is dead") suggests that people treated "Planet" as denoting an **essential nature** of the object, rather than a relational category. If Frege were strictly right, the change should have been purely linguistic: "We are using the word 'Planet' differently now." The object remains the same.
  However, the reaction implies that for many, "Planet" functioned as a rigid designator of status. They felt the *ontology* of Pluto changed, not just the label. Frege's distinction protects the object from the name, but it cannot explain why the name carries ontological weight. The theory goes silent on why changing the Sense of the category feels like violating the identity of the object. It fails to capture the *normative force* of taxonomy—that being a "Planet" confers a status that "Dwarf Planet" does not, independent of physical characteristics.

  **C. Constitutive Identity**
  You asked about "constitutive identity," where the identity claim helps constitute the reality of the classification. In the Hesperus case, the identity $a=b$ is true regardless of whether anyone knows it. In the Pluto case, the statement "Pluto is a dwarf planet" only became true (in the context of official astronomical nomenclature) *after* the vote.
  Frege's logic is descriptive, not constitutive. It describes how language hooks onto the world. It cannot handle cases where the language *decides* the structure of the world for the purposes of the discourse. The IAU vote created a new semantic reality. Frege can analyze the sentence before and after the vote, but he cannot analyze the *act of voting* as a semantic operator. The "informativeness" here is not cognitive surprise (learning a fact); it is normative adjustment (learning a rule).

  ### 4. Summary of Limitations

  Frege's framework successfully maps the *structure* of the confusion: it shows that the Reference of "Pluto" stayed constant while the Sense of "Planet" shifted, resulting in a change of truth value for the statement "Pluto is a planet." It explains why the statement is informative: the Sense changed.

  However, the theory fails to account for the **source** of that shift.
  1.  **Missing Mechanism:** Frege offers no account of how institutional authority fixes Reference. He assumes Reference is fixed by causal chains or objective description, not by committee.
  2.  **Missing Ontology:** Frege cannot explain the emotional resistance to the change. If Sense is just a mode of presentation, changing it should be trivial. The resistance proves that for users, the Sense *constitutes* the value of the object.
  3.  **Missing Temporality:** Fregean Senses are timeless. The Pluto case shows that scientific Senses are historical and contingent. The truth of "Pluto is a planet" was time-indexed to the pre-2006 semantic regime.

  In short, Frege explains why the statement was surprising, but he cannot explain why it was controversial. He treats the Sense as a lens through which we see the world; the Pluto episode shows that sometimes, the Sense is a fence we build around the world, and we can move the fence whenever we vote to do so. Frege's logic has no variable for the fence-builder.
