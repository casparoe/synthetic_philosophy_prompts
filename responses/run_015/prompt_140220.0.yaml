  | **Defensive Attribution** | Observers distort causal judgments to distance themselves from threats that feel personally applicable. | Partial | Case 1 (Hostility scales with recognizability) | Accepting a threatening explanation because it is overwhelmingly evidenced. | settled_terminology |
  | **Conversational Implicature of Mitigation** | In moral discourse, offering a cause for a violation is pragmatically understood as a plea for reduced blame. | Partial | Case 3 (Difference between student failure and killing) | A context where explanation is explicitly requested for understanding only (e.g., engineering failure analysis). | live_dispute |
  | **Retributive Explanation Resistance** | The refusal to accept situational causes for atrocities because doing so is cognitively processed as undermining the justification for punishment. | Exact | Case 1 (The core phenomenon of hostility to explanation) | A context where the observer has no stake in the moral condemnation (e.g., a foreign conflict with no moral resonance). | coinage |
