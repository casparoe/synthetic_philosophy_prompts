answer: |-
  There is no single established term in psychology or historiography that captures the specific triad of phenomena you describe as a unified concept. However, your observation maps precisely onto the intersection of three distinct, well-documented mechanisms. Your three cases are indeed one phenomenon, driven by a single underlying cognitive imperative: the preservation of **retributive justice**.

  Here is the breakdown of the existing concepts that cover the fragments of your observation, followed by a proposed coinage for the specific dynamic you are witnessing in the classroom.

  ### The Established Components

  **1. The Asymmetry (Case 1 vs. Case 2)**
  The fact that your teachers accept situational explanations for rescuers but reject them for perpetrators is a robust finding in experimental philosophy and psychology, most closely associated with the **Side-Effect Effect** (often called the **Knobe Effect**).
  *   **What it claims:** People do not apply the same criteria for intentionality and causality to morally good and morally bad actions. When an action is morally bad, observers are significantly more likely to attribute it to the agent's internal disposition and intentionality. When an action is morally good (or neutral), observers are more willing to accept situational or accidental causes.
  *   **Where it fits:** It explains why the *structure* of the explanation is accepted for the rescuer but rejected for the policeman. The moral valence of the outcome changes the threshold for accepting a situational cause.
  *   **Where it stops:** It describes the *attribution* difference, but it does not fully account for the *emotional hostility* or the specific accusation of "making excuses." It is a cognitive bias, not necessarily an emotional defense.

  **2. The Hostility (Case 1)**
  The fact that hostility scales with the *recognizability* of the mechanism (e.g., "career anxiety" triggers more anger than "ideological fervor") is best explained by **Defensive Attribution** (a subset of Motivated Reasoning).
  *   **What it claims:** When observers perceive a threat as potentially applicable to themselves, they distort their judgment to distance themselves from the threat. If the perpetrator is a monster (dispositional), the observer is safe. If the perpetrator is an ordinary man responding to social pressure (situational), the observer is vulnerable.
  *   **Where it fits:** It explains why "mundane" causes trigger more anger than "extreme" causes. A monster is "other"; a tired middle-aged man is "us." Accepting the explanation threatens the observer's moral self-concept.
  *   **Where it stops:** It explains the fear, but not why that fear manifests as a rejection of *causality* specifically, rather than just a rejection of the historical facts. It also doesn't explain why this defense isn't triggered for the rescuer (we are also vulnerable to the claim that "heroism is just luck," yet we accept it).

  **3. The "Excuse" Accusation (Case 1 & 3)**
  The interpretation of a causal story as a plea for leniency is a matter of **Conversational Implicature**.
  *   **What it claims:** In ordinary language, specifically within moral or legal contexts, offering a causal explanation for a norm violation pragmatically implies a request for mitigation. To ask "Why did he do it?" is often functionally identical to asking "Why should we punish him less?"
  *   **Where it fits:** It explains why the room goes cold. Your teachers are not listening as historians; they are listening as moral judges. They are importing the rules of a sentencing hearing into a history classroom. In a sentencing hearing, you are correct: a causal story *is* offered as mitigation. Their recoil is a correct reading of standard moral discourse, but an incorrect reading of historical pedagogy.
  *   **Where it stops:** It does not explain the asymmetry. We offer causal stories for student failures (Case 3) without the same retributive stakes, so the implicature of "leniency" is less charged.

  ### Synthesis: Is it One Phenomenon?

  Yes. These three cases are manifestations of a single cognitive guardrail: **The Link Between Causality and Blame.**

  In human moral cognition, establishing a sufficient situational cause for an action inherently competes with assigning full moral blame. This is not merely a reasoning failure; it is a feature of how we administer justice. To fully explain an action is to determine the degree of agency the actor possessed. If the teachers accept your situational story, they feel compelled to reduce the actor's agency. If they reduce the agency, they feel they are undermining the justice of the punishment (or the moral condemnation).

  They refuse the explanation not because they think it is historically false, but because they believe it is **morally costly**. They are protecting the integrity of the condemnation. In Case 2 (rescuers), increasing situational causality does not reduce moral praise (we are happy to attribute heroism to luck), so there is no cost. In Case 3 (students), the retributive stakes are low, so the cost is negligible. In Case 1 (perpetrators), the stakes are absolute, so the cost is unacceptable.

  ### The Coinage

  Since no existing term unifies the asymmetry, the defensive hostility, and the conversational implicature in a pedagogical context, I propose the following term.

  **Term:** **Retributive Explanation Resistance**

  **Definition:** The cognitive refusal to accept situational causal accounts for high-severity moral violations, driven by the belief that acknowledging sufficient causality necessitates a reduction in retributive blame.

  **Why this fits:** It captures that the resistance is not to the *history*, but to the *retributive implication*. It explains why the resistance vanishes when retribution is off the table (Case 3) or when praise is on the table (Case 2).

  **Reasoning Failure or Conversational Implicature?**
  It is both. It is a **Pragmatic Transfer Error**. The teachers are correctly applying the rules of moral/legal discourse (where explanation implies mitigation) to a historical discourse (where explanation implies understanding). Because the stakes of Holocaust morality feel legal/sacred rather than academic, the transfer feels "right" to them. A specialist in moral psychology would accept the mechanism but might dispute whether it should be classified as an "error" or a rational protection of moral norms.

  ### Boundary Cases

  *   **Count as an instance:** A jury rejecting a defendant's trauma history as a cause for crime because "that doesn't justify what he did." (Here, explanation is explicitly linked to mitigation).
  *   **Near-miss (Something else):** A scientist rejecting a causal theory because the data is weak. (This is epistemic skepticism, not moral resistance).
  *   **Near-miss (Something else):** A person refusing to believe a loved one committed a crime. (This is denial of *fact*, not denial of *causal mechanism*).

