answer: |-
  # Seminar Activity: The CardioX Review Board

  **Topic:** Causal Inference, Simpson's Paradox, and the Limits of Disaggregation
  **Time:** 75 Minutes
  **Students:** 14 (Mixed Philosophy/Statistics)
  **Goal:** Move students from "Always Disaggregate" to "Condition on Causal Structure."

  ## 1. Setup and Materials
  Print the following packets. You need one set per student, plus a few extra for the board.

  *   **Handout A:** Committee Charter & Scoring Rules.
  *   **Handout B:** Interim Report (Aggregate Data).
  *   **Handout C:** Internal Memo (Subgroup Data).
  *   **Handout D:** Follow-up Study (Identical Numbers, Different Story).
  *   **Handout E:** Debrief Worksheet (DAG templates).

  **Room Setup:** One large table or pods pushed together. You are the **Committee Chair**.

  ---

  ## 2. The Timeline (75 Minutes)

  | Time | Phase | Activity | Materials |
  | :--- | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Explain role (FDA Board), stakes (points = lives), and the drug (CardioX). | Handout A |
  | **10-25** | **Round 1** | Distribute **Aggregate Data**. 5 min discussion. **Vote 1** (Approve/Reject). | Handout B |
  | **25-45** | **Round 2** | "Leak" the **Subgroup Data**. Students realize the paradox. **Vote 2**. | Handout C |
  | **45-55** | **Round 3** | Distribute **Follow-up Study** (Same numbers, new context). **Vote 3**. | Handout D |
  | **55-75** | **Debrief** | Map votes to causal structures (Confounder vs. Mediator). Formalize the lesson. | Handout E + Board |

  ---

  ## 3. The Game Mechanics

  ### The Stakes (Handout A)
  *   **Population:** 10,000 simulated patients per year.
  *   **Score:** +1 point for every life saved above the baseline. -1 point for every preventable death caused by approval.
  *   **Goal:** Maximize committee score.
  *   **Rule:** You must vote *Approve* or *Reject* based *only* on the data provided at that moment.

  ### The Data (The "Identical Numbers" Core)
  *Use these exact numbers for both Round 2 and Round 3.*

  **Aggregate Data (Handout B)**
  | Group | Patients | Survivors | Survival Rate |
  | :--- | :--- | :--- | :--- |
  | **Treatment (CardioX)** | 100 | 46 | **46%** |
  | **Control (Placebo)** | 100 | 24 | **24%** |
  *Initial Impression:* Drug increases survival by 22 percentage points. **Strong Approve.**

  **Subgroup Data (Handout C & D)**
  *Variable Z is defined differently in Round 2 vs. Round 3.*

  | Subgroup | Treatment (Surv/Total) | Control (Surv/Total) |
  | :--- | :--- | :--- |
  | **Group Z=1** | 1 / 10 **(10%)** | 18 / 90 **(20%)** |
  | **Group Z=0** | 45 / 90 **(50%)** | 6 / 10 **(60%)** |
  *Observation:* In *both* subgroups, Control outperforms Treatment. **Strong Reject.**

  ---

  ## 4. The Script & The Twist

  ### Phase 1: The Aggregate (10-25 min)
  **Chair (You):** "Welcome to the Advisory Committee. We have Phase III trial results for CardioX. The manufacturer claims it reduces mortality. Here is the top-line summary."
  *Distribute Handout B.*
  **Action:** Let them calculate the difference (46% vs 24%). Ask for a show of hands.
  **Expected Outcome:** 100% vote **Approve**.
  **Chair:** "Motion carries. But wait... a whistleblower from the data monitoring board just slipped me this internal analysis."

  ### Phase 2: The Leak (25-45 min)
  **Chair:** "This memo breaks down the data by **Patient Risk Profile (Z=1 High Risk, Z=0 Low Risk)**."
  *Distribute Handout C.*
  **Narrative:** "It appears doctors were more likely to prescribe CardioX to Low Risk patients (90% of Trt were Low Risk) and Placebo to High Risk patients (90% of Ctrl were High Risk). This is **Selection Bias**."
  **Action:** Give them 5 minutes to panic. The math shows the drug is harmful in both subgroups. The aggregate was misleading because the Treatment group was "healthier" to begin with.
  **Vote:** Ask for a show of hands.
  **Expected Outcome:** 100% vote **Reject**.
  **Chair:** "Motion to Reject carries. We will not approve CardioX. The aggregate data lied; the disaggregated data told the truth."

  ### Phase 3: The Twist (45-55 min)
  **Chair:** "Hold on. I have a second report on my desk. It's from a different trial, conducted in a different country. Look at the numbers."
  *Distribute Handout D.*
  **Narrative:** "The numbers are *identical*. 46% vs 24% aggregate. 10% vs 20% and 50% vs 60% in subgroups. **However**, in this trial, Z was not Pre-treatment Risk. Z was **Post-Treatment Blood Pressure Stabilization**."
  *   **Z=1:** BP remained unstable (High Risk).
  *   **Z=0:** BP stabilized (Low Risk).
  *   **Mechanism:** CardioX works *by* stabilizing BP. That is why 90% of the Treatment group ended up in Z=0 (Stabilized), while only 10% of the Control group did.
  **Question:** "Same numbers. Same paradox. Do you Approve or Reject?"
  **Action:** Let them argue. This is the friction point.
  **Vote:** Show of hands.
  **Expected Outcome:** Confusion. Some will stick with Reject (habit from Round 2). Some will switch to Approve (intuition that the drug worked).

  ### Phase 4: The Debrief (55-75 min)
  **Do not resolve the vote immediately.** Use the board.

  1.  **Draw DAG 1 (Round 2):** $Z \rightarrow X$ (Doctors choose drug based on risk) and $Z \rightarrow Y$ (Risk affects survival). $Z$ is a **Confounder**.
      *   *Lesson:* We must condition on $Z$ to block the backdoor path. Disaggregation was correct. **Decision: Reject.**
  2.  **Draw DAG 2 (Round 3):** $X \rightarrow Z \rightarrow Y$ (Drug stabilizes BP, which saves lives). $Z$ is a **Mediator**.
      *   *Lesson:* Conditioning on $Z$ blocks the causal path. We want the *Total Effect*. Aggregation was correct. **Decision: Approve.**
  3.  **The Core Lesson:** "Simpson's Paradox is not a mathematical puzzle to be solved by 'more granular data.' It is a causal puzzle solved by **knowing what the variables represent**."
      *   Mathematically: $P(Y|X) \neq P(Y|X, Z)$.
      *   Causally: Which one equals $P(Y|do(X))$?
      *   If $Z$ is Confounder: $P(Y|do(X)) = \sum P(Y|X,Z)P(Z)$. (Disaggregate).
      *   If $Z$ is Mediator: $P(Y|do(X)) = P(Y|X)$. (Aggregate).

  ---

  ## 5. Troubleshooting: What Will Go Wrong

  ### Failure Mode 1: "The Math is Lying" (Cynicism)
  *   **Symptom:** Students argue that if the numbers flip, statistics is useless/broken.
  *   **Fix:** Intervene early in the Debrief. "The arithmetic is not wrong. $10/100$ is $10\%$. The *interpretation* of which number represents the causal effect is what changed. The tables are honest; the story tells us which table to trust."

  ### Failure Mode 2: Arithmetic Freezing
  *   **Symptom:** Students waste 10 minutes recalculating percentages to verify the paradox.
  *   **Fix:** **Pre-calculate percentages on the handouts.** Do not give them raw counts only. Provide the % in parentheses (as shown in the Data section above). Tell them: "Trust the printed percentages for the sake of time; audit one if you wish."

  ### Failure Mode 3: The "Always Disaggregate" Habit
  *   **Symptom:** In Round 3, they still vote Reject because "subgroups are always more specific/truthful."
  *   **Fix:** This is the desired friction. Do not correct them immediately. Ask: "If the drug works *by* changing Z, and you compare people who *already have* Z, aren't you comparing the drug's side effects only, ignoring its main benefit?" Use the analogy of judging a raincoat by looking only at people who are already wet.

  ### Failure Mode 4: Running Out of Time
  *   **Symptom:** The debate in Round 3 eats the debrief.
  *   **Fix:** Hard stop at minute 55. "Vote now. We will explain why half of you are right and half are wrong in the last 20 minutes." The explanation is more important than the consensus.

  ---

  ## 6. Limitations: What the Game Cannot Simulate

  You must explicitly state this in the lecture portion.

  1.  **The Causal Mechanism is Fiat:** In the real world, the data does not come with a label saying "I am a Mediator." In this game, *I told you* in the narrative (Handout C vs. D) what Z was. In reality, determining whether Z is a Confounder or Mediator requires domain knowledge, theory, or experimental design (e.g., randomization of X breaks the $Z \rightarrow X$ link, but cannot distinguish Mediator from Collider without further assumptions).
  2.  **No Measurement Error:** The tables are clean. In reality, Z is often measured with error, which biases both aggregated and disaggregated estimates.
  3.  **The "True" DAG is Assumed:** We assume the DAGs I drew on the board are the *true* causal structures. In philosophy terms, we are assuming we have solved the "Identification Problem" by fiat. The lesson is about *adjustment criteria*, not *causal discovery*.

  ## 7. Instructor's Cheat Sheet (For the Board)

  **Round 2 (Confounder):**
  *   Structure: $Z \leftarrow \text{Doctor} \rightarrow X$ and $Z \rightarrow Y$.
  *   Bias: Selection Bias.
  *   Correct Estimate: Weighted Average of Subgroups.
  *   Verdict: **Reject** (Drug is toxic).

  **Round 3 (Mediator):**
  *   Structure: $X \rightarrow Z \rightarrow Y$.
  *   Bias: Over-control Bias (Blocking the path).
  *   Correct Estimate: Aggregate Difference.
  *   Verdict: **Approve** (Drug saves lives via Z).

  **Takeaway Sentence:** "Data cannot tell you whether to condition. Only a causal model can tell you whether to condition."
