  9.  **Final Polish:**
      *   Ensure the distinction between Pre-treatment (Confounder) and Post-treatment (Mediator/Collider) is clear in the debrief.
      *   Make sure the "Stakes" feel real (e.g., "If you approve a bad drug, -100 points per death").
