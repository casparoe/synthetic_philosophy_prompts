          *   Phase 3 (The Twist): A second case with *identical numbers* but different causal structure (post-treatment variable), where Aggregation is correct.
          *   Debrief: Map game moments to formal machinery (collapsibility, DAGs, causal knowledge).
      *   **Logistics:** Printable materials, specific timeline.
      *   **Troubleshooting:** Predict failure modes (arithmetic freezing, "lying with statistics" cynicism) and how to handle them.
      *   **Limitations:** Acknowledge what the game *cannot* simulate (the actual causal mechanism, must be supplied by fiat).

