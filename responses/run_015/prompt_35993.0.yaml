  6.  **Addressing Failure Modes:**
      *   *Arithmetic:* Provide percentages, not just raw counts. Or make N=100 for easy math.
      *   *Cynicism:* "Stats are fake." Counter with "The math is right, the *model* is what changes."
      *   *Freezing:* Instructor acts as Chair to keep time.
      *   *The "Impossible" Part:* The game cannot simulate the *causal mechanism*. The handout must *tell* them the mechanism (e.g., "Z is severity" vs "Z is side effect"). This is the "fiat" mentioned in the prompt.

  7.  **Drafting the Materials:**
      *   Need clear, printable tables.
      *   Need "Memo" style text to set the narrative.
