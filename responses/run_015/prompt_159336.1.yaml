answer: |-
  There is no single canonical term for this specific temporal flip, though it sits at the intersection of several well-known concepts in political philosophy and ethics. Your friends are toggling between two different models of agency without acknowledging the switch.

  I will name this **"The Causal-Responsibility Asymmetry."**

  Here is the carving you asked for: what it is, what it isn't, and where its edges lie.

  ### 1. The Mechanism: Two Models of Agency
  The phenomenon relies on silently swapping between two valid but incompatible frameworks for evaluating an action within a collective.

  *   **Pre-Vote (Instrumental Model):** The act is evaluated by its **marginal impact**.
      *   *Question:* "Will this specific act change the outcome?"
      *   *Answer:* No. (Statistically negligible).
      *   *Function:* This minimizes the *burden* of the act. It reassures you that you aren't taking on a heavy causal load. It lowers the barrier to entry.
  *   **Post-Vote (Constitutive Model):** The act is evaluated by its **membership value**.
      *   *Question:* "Are you part of the coalition that produced this outcome?"
      *   *Answer:* Yes. (You are a member of the winning set).
      *   *Function:* This maximizes the *blame* or *credit* of the act. It assigns moral authorship. It raises the stakes for accountability.

  **The Asymmetry:** You are asked to participate based on the *Instrumental Model* (your burden is light, just add a drop) but are judged based on the *Constitutive Model* (you are an author of the result).

  This is not simple hypocrisy because both models are philosophically defensible on their own. The Instrumental Model is true regarding *pivotality*. The Constitutive Model is true regarding *complicity*. The deception lies in applying the one that suits the speaker's goal at that specific moment in time.

  ### 2. Boundary Conditions (The Carving)
  You asked where the edges are. The Asymmetry only functions under specific structural conditions.

  **A. Does it need a large electorate?**
  **Yes.** This is the most critical boundary.
  *   **Your Union Example:** In a group of 40 where the vote was 21–19, your vote had a non-negligible probability of being pivotal. The Instrumental Model ("your vote won't decide anything") is factually false there. Therefore, the Pre-Vote framing *must* acknowledge your causal power. If the Pre-Vote framing admits you have power, the Post-Vote framing ("you did this") is consistent, not a flip.
  *   **The Federal Election:** With millions of voters, the probability of a single pivotal vote is effectively zero. This allows the Pre-Vote Instrumental claim to be plausibly true. The Asymmetry *requires* the Pre-Vote causal insignificance to be statistically defensible.

  **B. Does it need a secret ballot?**
  **No, but it helps.**
  *   If voting were public, the Pre-Vote pressure might shift to social coercion ("everyone will see if you don't"), which is a different mechanism.
  *   However, the Asymmetry works even with public voting. The Post-Vote claim ("you voted for him") relies on the *record* of the vote, not the secrecy. The Asymmetry is about *moral attribution*, not verification.

  **C. Does it need a two-party race or a mandate?**
  **It needs a binary outcome.**
  *   The Constitutive Model (Post-Vote) works best when the result is binary (Winner/Loser, Pass/Fail).
  *   In a proportional coalition government, the Post-Vote blame is often diluted ("You voted for Party A, but they compromised with Party B"). The Asymmetry is sharpest when the winner claims a singular mandate, allowing opponents to say, "The people (including you) chose this."

  **D. Does it extend to other collective actions?**
  **Yes. This is the strongest evidence that it is a structural phenomenon, not just about voting.**
  *   **Eating Meat:**
      *   *Pre-Act:* "One burger doesn't save a cow. The market won't notice." (Instrumental Negligence).
      *   *Post-Act:* "You paid for that slaughter. You're a murderer." (Constitutive Complicity).
  *   **Carbon Emissions:**
      *   *Pre-Act:* "My one flight won't change the climate."
      *   *Post-Act:* "You are destroying the planet."
  *   **Recycling/Trash:**
      *   *Pre-Act:* "My one bottle won't fill the landfill."
      *   *Post-Act:* "People like you are ruining the environment."

  In all these cases, the Pre-Act framing invites you to participate by minimizing causal guilt, and the Post-Act framing assigns guilt by maximizing moral membership.

  ### 3. The Consent Question
  You asked if the one-way consent bit is the same phenomenon.
  **It is a sibling, not the same thing.**

  *   **The Asymmetry (Voting/Meat):** About **Blame/Responsibility**. (Switching between Negligence and Authorship).
  *   **The Consent Issue:** About **Legitimacy/Binding**.

  The consent issue is known in political theory as the problem of **Tacit Consent**.
  *   **Voting:** Treated as *Express Consent*. By acting, you bind yourself to the outcome.
  *   **Not Voting:** Treated as *Apathy*, not *Dissent*.

  This is a **"Unilateral Binding"** mechanism. The system is designed so that the only way to *not* be bound is to leave the jurisdiction (which is often impossible or costly). Within the system, silence is interpreted as acquiescence.

  **Why it's distinct:**
  You can have the Consent asymmetry without the Responsibility asymmetry.
  *   *Example:* A town hall meeting. If you speak, you consent to the rules. If you stay silent, you are still bound by the rules (Consent Asymmetry). However, if a motion passes 50–49, and you spoke in favor, no one says "Your speech decided it" if it was clearly a large room. But if they *do* say "You spoke for this," that triggers the Responsibility Asymmetry.

  In your federal election case, the two overlap: You are bound by the result (Consent) *and* you are blamed for the result (Responsibility). But logically, they are separate levers. One locks you in; the other points the finger.

  ### 4. Summary Definition
  **The Causal-Responsibility Asymmetry** is a rhetorical and psychological structure present in large-scale collective actions where:
  1.  **Individual Pivotality is statistically negligible.** (The "Drop in the Bucket" condition).
  2.  **Collective Outcome is morally significant.** (The "High Stakes" condition).
  3.  **Prospective framing minimizes individual causality** to encourage participation (reducing the perceived burden).
  4.  **Retrospective framing maximizes individual complicity** to assign accountability (increasing the perceived stake).

  **It does not apply when:**
  *   The group is small enough that individual pivotality is non-negligible (your Union example).
  *   The action is purely private with no collective aggregation (e.g., reading a book).
  *   The outcome is not binary or attributable to the group (e.g., donating to a charity where the impact is directly measurable per dollar).

  ### 5. Why it feels "True"
  You mentioned both halves sound true to you. That is because they map onto two different truths:
  1.  **Causal Truth:** You did not *cause* the win in a mechanical sense (no counterfactual dependence).
  2.  **Moral Truth:** You did *join* the winning side in a normative sense (coalitional membership).

  The frustration you feel is the friction of being treated as a **mechanical cause** when it's convenient for mobilization, and a **moral agent** when it's convenient for accountability. The system wants your hand in the box, but it wants your conscience on the hook.

  There is no word for this because it is usually treated as a bug in public discourse, not a feature. But structurally, it is the engine that drives participation in modern mass democracies and mass markets. It lowers the entry cost while keeping the exit price high.
