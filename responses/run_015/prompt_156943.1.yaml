      *   *Normative/Pragmatic Reading:* Focuses on *zhengming*. It's about social/political order. Using names correctly prevents confusion in governance. "White horse is not horse" is a warning against sloppy categorization in administrative contexts. Strength: Fits the historical context of *zhengming*. Weakness: Might downplay the logical rigor of the text.
