      *   *The Argument:* Basically, "Horse" names the shape. "White" names the color. "White Horse" names both. Therefore, the concept "White Horse" $\neq$ the concept "Horse." If you ask for a horse, a yellow or black one works. If you ask for a white horse, a yellow one doesn't. Therefore, they are distinct.
