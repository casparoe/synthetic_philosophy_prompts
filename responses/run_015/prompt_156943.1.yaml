  **The Rectification of Difference: Adjudicating Interpretive Frameworks in Gongsun Long's *White Horse Dialogue***

  The *Bai Ma Lun* (White Horse Dialogue), attributed to the Warring States philosopher Gongsun Long, remains one of the most enduring puzzles in the history of Chinese thought. The thesis that "a white horse is not a horse" (*bai ma fei ma*) appears on its face to be a blatant contradiction of common sense, yet the text supports it with a rigorous, if elliptical, argumentation structure. Contemporary scholarship has generally bifurcated into two dominant camps: a semantic reading, which treats the dialogue as an investigation into the logic of compound terms and reference, and a metaphysical reading, which posits an ontology of distinct universals. However, both frameworks risk obscuring the text's indigenous context within the *Mingjia* (School of Names), a tradition fundamentally oriented toward *zhengming* (the rectification of names). This essay argues that while the semantic and metaphysical readings capture partial truths, they are ultimately insufficient. The dialogue is best reconstructed as a normative-entitlement claim regarding the conditions under which a speaker may legitimately withhold assent to an identity statement. This framing avoids the anachronistic ontological commitments of the metaphysical reading and grounds the semantic precision of the text in the *Mingjia*'s broader socio-political project of ordering reality through language.

  To adjudicate these frameworks, we must first examine the semantic interpretation. This reading, often favored by analytic philosophers, treats Gongsun Long's argument as a distinction between intension and extension. The argument proceeds by noting that the term "horse" designates a shape, while "white" designates a color. The compound "white horse" designates both. Therefore, the extension of "white horse" is a proper subset of "horse." When one requests a "horse," a yellow or black horse suffices; when one requests a "white horse," they do not. Since the conditions of satisfaction differ, the terms are not interchangeable.

  The strength of the semantic reading lies in its fidelity to the text's operational logic. Gongsun Long explicitly relies on scenarios of "seeking" (*qiu*) to demonstrate the non-identity of the terms. It successfully explains the *fei* ("is not") as a claim of non-equivalence rather than non-existence. However, its weakness is its abistorical abstraction. By treating the dialogue as a freestanding puzzle in the philosophy of language, it severs the argument from the Warring States context, where language was never merely descriptive but inherently performative and political. If the *Bai Ma Lun* were solely a semantic exercise, it would be difficult to explain why the *Mingjia* were historically criticized for "confusing names and actualities" in a way that threatened social order. A purely semantic reading renders the stakes trivial, ignoring the *Mingjia*'s reputation for engaging with the practical consequences of definition.

  The metaphysical reading attempts to raise the stakes by interpreting the dialogue as an ontological thesis. On this view, Gongsun Long is arguing that the Universal "White-Horse" is a distinct entity from the Universal "Horse." Qualitative modification (whiteness) produces a new essence. This reading takes the *fei* strongly as ontological non-identity. Its strength is that it accounts for the realism often attributed to Gongsun Long; he seems to treat "whiteness" and "horseness" as separable entities that combine to form a complex object.

  However, the metaphysical reading suffers from a critical weakness: it likely imposes anachronistic categorical distinctions that the *Mingjia*'s own methods reject. To read Gongsun Long as a Chinese Platonist is to import a Greek essentialism that assumes fixed, hierarchical kinds. Yet, the *Mingjia* project is often characterized by a form of anti-essentialism or nominalism that highlights the instability of categories rather than reifying them. If Gongsun Long were positing a rigid ontology of universals, he would be establishing the very kind of fixed essences that the *zhengming* tradition often sought to critique or regulate. Furthermore, the text focuses on the *act of naming* and *requesting*, not on the independent existence of forms. By reifying "White-Horse" into a metaphysical substance, this reading obscures the pragmatic function of the distinction. It turns a tool for analysis into a dogma about reality, which contradicts the dialectical spirit of the dialogue.

  This brings us to the third framework: the normative-entitlement reading. This interpretation situates the dialogue within the project of *zhengming*. In the Confucian and *Mingjia* contexts, *zhengming* is not merely defining words; it is ensuring that social roles, responsibilities, and commands align with reality. To say "a white horse is not a horse" is not to deny that a white horse belongs to the biological species *Equus caballus*. Rather, it is a claim about normative entitlement in discourse. It asserts that a speaker is justified in withholding assent to the equation "white horse = horse" when the context of the demand requires specificity.

  The strength of the normative reading is that it synthesizes the logical rigor of the semantic view with the high stakes of the historical context. It explains the argumentative moves regarding "seeking" not as tests of reference, but as tests of compliance. If a ruler commands "bring a horse," and a subject brings a white horse, has the command been fulfilled? Gongsun Long's argument suggests that if the specific designation "white horse" was intended, the general designation "horse" is insufficient. The *fei* functions as a normative operator: "It is not correct to treat 'white horse' as equivalent to 'horse' in this context."

  This framing best avoids the anachronism of the metaphysical reading. It does not require Gongsun Long to believe in a realm of Universals. Instead, it requires him to believe that names carry normative weight that governs action. The distinction between "horse" and "white horse" is not about what *exists*, but about what is *permitted* in assertion and obligation. This aligns with the *Mingjia*'s broader reputation. They were not idle sophists; they were logicians of governance. Their "logical exercises" were training regimes for officials who needed to discern when a general order permitted specific exceptions and when precise terminology was required to prevent administrative error or moral deceit.

  Therefore, the normative-entitlement framework provides the most justified conclusion. It explains why the argument is structured around the conditions of "seeking" and "giving." It respects the text's logical precision without divorcing it from its socio-political function. Crucially, it resolves the tension regarding essentialism: the *Mingjia* does not posit that "White-Horse" is a metaphysical essence different from "Horse." Rather, it posits that the *name* "White-Horse" entails a different set of normative commitments than the name "Horse." The difference is in the *ming* (name/command), not necessarily in the *shi* (actuality/reality) independent of human intervention.

  The implications of this conclusion for understanding the relationship between *Mingjia* logical exercises and *zhengming* are profound. It suggests that the paradoxes of the School of Names should not be read as failures of logic or flights of metaphysical fancy, but as rigorous stress-tests for the linguistic infrastructure of the state. If language is the medium through which political order is enacted, then ambiguity in language is a threat to order. The "White Horse" dialogue demonstrates that sloppy categorization leads to failed expectations and broken promises. By forcing the interlocutor to acknowledge that "white horse" is not functionally interchangeable with "horse" in specific contexts, Gongsun Long is training the mind to resist the erosion of precision.

  In conclusion, while the semantic reading captures the mechanism of the argument and the metaphysical reading captures its apparent realism, only the normative-entitlement reading captures its *point*. The *Bai Ma Lun* is not a treatise on the ontology of equines, nor a sterile puzzle about reference. It is a proto-normative claim about the conditions of legitimate assertion. It asserts that in a well-ordered discourse, one is entitled to insist on the specificity of a name when the generality of a category fails to meet the conditions of the request. This restores the *Mingjia* to its proper place in Chinese philosophy: not as purveyors of paradox for paradox's sake, but as guardians of the precise linguistic boundaries required for *zhengming*, ensuring that the names we use command the reality we intend.
