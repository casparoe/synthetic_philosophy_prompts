      *   *Knob* $\rightarrow$ *Vector Dimension / Prompt Weight*.
      *   *Engineer* $\rightarrow$ *The Model (or the User?)*. *Wait, this is a fracture point.* In Hofstadter's view, the system itself often needs to be the one sensing the value of the turn. In the AI/Mixing analogy, the user is usually the engineer, and the AI is the board. Or the AI is the engineer? If the AI is the board, it's passive. If the AI is the engineer, does it have intent?
      *   *Listener* $\rightarrow$ *Human Audience*.
