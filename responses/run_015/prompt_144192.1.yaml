  # The Prosthetic Hand Taxonomy: A Decision Tree on Meaning and Mind

  **The Case:** Imagine a prosthetic hand equipped with sensors that detect your galvanic skin response (stress or excitement). It tightens its grip predictively before you consciously decide to hold on. You never consciously intend the specific grip adjustment; the hand simply does it.

  **Instructions:** Start at the top and follow the path that matches your intuition about this hand. Answer the questions without worrying about philosophical names; the labels appear only at the end.

  ---

  ### **Split 1: The Nature of the Difference**
  **Question:** Is the difference between the hand's automatic grip and your own conscious thought a sharp line (all-or-nothing), or a sliding scale (matter of degree)?

  *   **A. Binary (All-or-Nothing):** Either something has genuine goals and meaning, or it does not. There is no middle ground between a mind and a machine.
      *   *Go to Split 2A.*
  *   **B. Scalar (Sliding Scale):** Things can have more or less "aboutness" or goal-directedness. The hand might have less than a human, but more than a rock.
      *   *Go to Split 2B.*

  ---

  ### **Split 2A: The Artifact Limit (Binary Path)**
  **Question:** Can a made object (like the prosthetic) ever possess its *own* genuine goals, or does it only ever borrow them from us?

  *   **A. Only Borrowed:** The hand cannot have original goals. It only simulates them because humans do.
      *   *Go to Split 3A.*
  *   **B. Own Goals Possible:** If the system is complex enough, the hand (or its software) could genuinely have its own goals, just like a brain.
      *   *Go to Split 3B.*

  ---

  ### **Split 2B: The Artifact Limit (Scalar Path)**
  **Question:** Even if intentionality is a scale, can an artifact ever reach the top end (original intentionality), or are they capped at the lower end (derived intentionality)?

  *   **A. Capped at Derived:** Artifacts can have sophisticated responses, but they never cross the threshold into having their own genuine perspective.
      *   *Go to Split 3A.*
  *   **B. Can Reach Original:** With enough complexity and integration, an artifact's intentionality becomes indistinguishable from original intentionality.
      *   *Go to Split 3B.*

  ---

  ### **Split 3A: The Source of Borrowed Meaning**
  **Question:** For the hand's grip to count as "meaningful" (even if borrowed), does someone need to be interpreting it *right now*, or is it enough that engineers designed it to mean that?

  *   **A. Present Interpreter:** Meaning exists only when a conscious being is there to observe or use the object. If everyone leaves the room, the hand's grip means nothing.
      *   *Go to Split 4.*
  *   **B. Design History:** Meaning is fixed by the creators or users who bestowed it. The hand means "hold tight" even if no one is watching, because that is what it was made to do.
      *   *Go to Split 4.*

  ---

  ### **Split 3B: The Source of Own Goals**
  **Question:** If the artifact has its own goals, does this depend on us watching it, or on its internal structure and history?

  *   **A. Present Interpreter:** (Note: This path is logically unstable. If it has *own* goals, it shouldn't need an observer. However, for the sake of the tree...) If you believe even original goals require an observer to validate them.
      *   *Go to Split 4 (Flagged as Empty).*
  *   **B. Internal Structure/History:** The goals exist because of how the system is built and functions, regardless of whether anyone is watching.
      *   *Go to Split 4.*

  ---

  ### **Split 4: The Reality of the Distinction**
  **Question:** Is the difference between "real meaning" (original) and "borrowed meaning" (derived) a hard fact of the universe, or just a useful way of talking?

  *   **A. Metaphysically Real:** There is a factual difference in nature between genuine minds and mere simulations.
      *   *Proceed to Leaf.*
  *   **B. Heuristic Fiction:** The distinction is not real; it is just a tool we use to predict behaviour. Everything is "derived" from the stance we take towards it.
      *   *Proceed to Leaf.*

  ---

  ### **The Leaves: Positions and Commitments**

  #### **1. Binary → Only Borrowed → Design History → Real**
  *   **View Name:** **Biological Naturalism (Searle-style)**
  *   **The Position:** The prosthetic hand has zero intentionality. It is purely causal. Only your biological brain possesses original intentionality, which it bestows upon the hand via design.
  *   **Awkward Commitment:** You must accept that biological causation is unique and non-replicable, implying that a perfect functional copy of a brain in silicon would still lack understanding.

  #### **2. Binary → Own Goals Possible → Internal Structure → Real**
  *   **View Name:** **Strong AI / Functionalism**
  *   **The Position:** The prosthetic hand (or its controller) genuinely intends to grip. If the computational structure is right, the substrate (flesh vs. metal) does not matter.
  *   **Awkward Commitment:** You must accept that sufficiently complex thermostats or simple software could technically have beliefs and desires, diluting the specialness of human thought.

  #### **3. Scalar → Capped at Derived → Design History → Real**
  *   **View Name:** **Embedded/Embodied Cognition (Moderate)**
  *   **The Position:** The hand participates in a system of meaning. It has more intentionality than a stick, but less than a human. It is part of a coupled system where intentionality is distributed but rooted in the biology.
  *   **Awkward Commitment:** You must defend where exactly the line is drawn on the scale, which often proves arbitrary when faced with increasingly autonomous prosthetics.

  #### **4. Binary → Own Goals Possible → Internal Structure → Fiction**
  *   **View Name:** **Instrumentalism (Dennett-style)**
  *   **The Position:** The question of whether the hand *really* means it is a bad question. We treat the hand as having intentions because it predicts its behaviour successfully. Original intentionality is just derived intentionality all the way down.
  *   **Awkward Commitment:** You must accept that human consciousness is not fundamentally different from a robot's programme, merely vastly more complex, leaving no room for a "true self" beyond the pattern.

  #### **5. Binary → Only Borrowed → Present Interpreter → Real**
  *   **View Name:** **Radical Verificationism (Unnamed)**
  *   **The Position:** The hand's grip only means something while someone is watching it. Meaning is an event, not a property.
  *   **Awkward Commitment:** You must accept that meaning vanishes when observers leave the room, implying the hand's function ceases to be meaningful in the dark.

  #### **6. [EMPTY BRANCH] Binary → Own Goals Possible → Present Interpreter → Real**
  *   **Diagnosis:** **Incoherent.**
  *   **Reason:** If an artifact possesses *original* intentionality (its own goals), it is intrinsic to the object. Claiming it has original goals but that those goals depend on a *present interpreter* contradicts the definition of "original." This combination collapses into either Instrumentalism (Fiction) or Borrowed Meaning.

  #### **7. [EMPTY BRANCH] Scalar → Can Reach Original → Present Interpreter → Real**
  *   **Diagnosis:** **Unexplored/Unattractive.**
  *   **Reason:** While logically possible, few philosophers argue for a scalar mind that nonetheless requires a constant observer to sustain its highest level of original intentionality. Most scalar views (like evolution-based gradualism) rely on historical development, not present observation, to ground the degree of intentionality.

  ---

  ### **How to Use This in Your Seminar**

  When your flatmate invokes Searle, check if they are committed to **Leaf 1**. Ask them: *"If we replaced every neuron in my brain with a silicon chip that functioned identically, does the original intentionality vanish?"* If they say yes, they are holding the Biological Naturalist line, and their awkward commitment is biological magic.

  When they invoke Dennett, check if they are at **Leaf 4**. Ask them: *"If original intentionality is a fiction, are you saying I don't actually mean what I say, only that it's useful to treat me as if I do?"* If they say yes, their awkward commitment is the dissolution of the genuine self.

  If you find yourselves arguing about whether the hand means anything when no one is looking, you are stuck at **Split 3**. Resolve that first before worrying about biology vs. silicon.
