  **The classroom ritual**
  In standard GR pedagogy, the Hole Argument begins with a manifold $M$ and metric $g_{\mu\nu}$ satisfying Einstein's equations. A region $H$ (the "hole") is selected where no matter exists. An active diffeomorphism $\phi$ is applied that is the identity outside $H$ but shuffles points inside. This generates a new metric field $\phi^*g$. Mathematically, $(M, g)$ and $(M, \phi^*g)$ are distinct solutions sharing identical initial data on the boundary of $H$. Classically, this threatens determinism: the past fails to fix the future metric values at specific points. The standard resolution declares these models gauge-equivalent. They represent the same physical spacetime geometry, merely described using different point-labelings. Thus, determinism is preserved not by fixing the metric at points, but by treating diffeomorphic related fields as representing the same physical state. This ritual trains students to view coordinate independence as physical redundancy, dissolving the threat of indeterminism.

  **The hidden ontology**
  This practice presupposes a rejection of manifold substantivalism—the view that spacetime points possess inherent identity (haecceity) independent of the fields defined on them. To generate the paradox, one temporarily assumes points are individuated substrates; to resolve it, one denies this, adopting Leibniz Equivalence. This isn't purely relationalist in the Machian sense, as the manifold structure remains, but it treats diffeomorphisms as gauge symmetries rather than physical transformations. The ontological commitment is that physical reality resides in the equivalence class of models, not individual models. However, a tension arises in background-independent quantum gravity. Programs like Loop Quantum Gravity cite the Hole Argument to reject fixed spacetime points, yet often rely on asymptotic boundaries to define observables or S-matrices. Boundaries require fixed reference structures, seemingly reintroducing the individuation the Hole Argument forbids. Critics argue this is inconsistent: if points lack identity internally, why do boundaries retain it? Proponents counter that boundaries are physical infrastructure, not background geometry. The hidden ontology is thus structuralist: relations matter, relata do not, except where physical measurement imposes constraints. This suggests the pedagogical resolution masks deeper ontological questions about what constitutes a physical event. It remains a pivotal heuristic.

  **Contested vs settled**
  It is settled among physicists that diffeomorphism-related models represent the same physical state; this is operational standard practice. It is also settled that naive substantivalism leads to radical indeterminism. However, the philosophical interpretation is highly contested. Earman and Norton's 1987 formulation revitalized the debate, but consensus on the *implications* is absent. Some argue the argument proves spacetime structuralism; others claim it merely highlights representational redundancy without ontological consequences. The status of boundaries in quantum gravity is likewise disputed. While some view reliance on asymptotic structures as a fatal inconsistency undermining background independence, others see it as a necessary pragmatic limitation of current formalisms, not an ontological contradiction. Furthermore, whether the Hole Argument refutes substantivalism or simply forces a sophisticated substantivalist view (where points are individuated by fields) remains live debate. There is no consensus that the argument dictates a specific quantum gravity approach, nor that boundary dependence invalidates background independence claims. The move from classical gauge redundancy to quantum ontology is where agreement dissolves into speculation. The distinction between mathematical distinctness and physical identity remains the crux.

  **If we dropped the presupposition**
  If we dropped the presupposition that diffeomorphic models are physically identical, we would accept radical indeterminism: the universe's future metric distribution would be fundamentally unpredictable despite complete past data. This is physically unpalatable but logically coherent. Alternatively, one could adopt sophisticated substantivalism, individuating points via the metric field itself rather than bare manifold substrates. This preserves determinism without denying point identity, though it complicates the ontology. In quantum gravity, dropping the assumption might require fixing a background structure explicitly, abandoning background independence. This would align with perturbative string theory but contradict the spirit of non-perturbative approaches. Ultimately, retaining point identity forces a choice between accepting indeterminism or modifying the theory's symmetry principles, suggesting the gauge interpretation is the least costly philosophical price for maintaining GR's predictive power and conceptual coherence regarding observables.
