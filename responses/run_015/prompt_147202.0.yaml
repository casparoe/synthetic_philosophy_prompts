      *Answer:* No. Russellian "neither" is a truth-value gap within a semantic system. Madhyamaka "neither" (as part of the rejection of all four) is the dissolution of the semantic/ontological system itself regarding ultimate truth.

      *Plan Adjustment:* Make sure to distinguish between affirming the fourth *koṭi* vs. rejecting the applicability of the *catuṣkoṭi* entirely. Nāgārjuna usually negates all four.

