      *   *Caution:* Some scholars (like Jay Garfield) interpret Madhyamaka through a Wittgensteinian/Pragmatist lens, which aligns with the "opting out of the frame" idea. Others (traditional Prāsaṅgika) might emphasize the *prasaṅga* method more. I should keep the interpretation broadly acceptable but philosophically rigorous.
