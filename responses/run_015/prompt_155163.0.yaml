          *   *Critique:* This conflates *Pragmatic Encroachment* (Stanley, Fantl) with *Epistemic Contextualism* (DeRose, Cohen, Lewis). Bank cases (Stanley 2005) are usually associated with Pragmatic Encroachment (stakes affect the *subject's* knowledge), not Contextualism (stakes affect the *attributor's* context). The sentence says "whoever is assessing S," which is Contextualism. But Bank Cases are the hallmark of Encroachment. This is a major conflation.
      *   *Sentence 3:* "This position — pragmatic encroachment, of which epistemic contextualism is the leading version — says that what you know shifts with what you have riding on being right, so that knowledge is not, at bottom, a matter of truth and evidence at all, but of whether it is worthwhile to act as if p."
          *   *Critique:* "Pragmatic encroachment, of which epistemic contextualism is the leading version" is factually wrong. They are rival theories explaining similar intuitions. Contextualism says the *word* 'knows' changes meaning; Encroachment says the *state* of knowledge changes due to practical factors. Also, "not... a matter of truth and evidence at all" is a straw man. Encroachment says truth and evidence are necessary, but not sufficient; stakes matter too.
