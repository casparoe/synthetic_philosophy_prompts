          *   *Critique:* "Largely been abandoned" is false. Pragmatic encroachment is a live, debated topic (e.g., Jessica Brown, Mikkel Gerken, recent work by Stanley). Contextualism has waned but isn't "abandoned." The objection described is real, but the conclusion that the program is dead is inaccurate.
      *   *The "Closing Move" (Newsroom Verification):* "Its claim that the view vindicates tiered verification in newsrooms, so that a reporter staking her career on a story needs more evidence in order to know it than a colleague filing a routine brief, and escalating checks are requirements of knowledge rather than just risk management."
          *   *Critique:* This actually aligns *better* with Pragmatic Encroachment than the previous description did. If stakes raise the threshold for knowledge, then high-stakes reporters need more evidence to *know*. However, since the book conflated Encroachment and Contextualism earlier, this application might be built on shaky definitions. But substantively, Encroachment *does* imply this. The issue is whether the book treats this as a settled consequence of a "abandoned" view.

