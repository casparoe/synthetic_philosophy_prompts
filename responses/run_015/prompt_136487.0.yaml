answer: |-
  **Module:** MA Population Ethics and Pronatalism
  **Assessment:** Final Examination (Sit-down)
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  ***

  ### Exam Question

  **Question 1**
  Liberal states traditionally claim neutrality regarding conceptions of the good life. Evaluate the coherence of extending this principle to **demographic neutrality** — the stance that the state should remain neutral on population size. In your answer, you must distinguish between pronatalism as an *axiological* claim (that more lives create more value) and pronatalism as a *deontic* claim (that there is a duty to reproduce). Does the fact that reproductive choices aggregate into collective climate and resource effects force the state to abandon demographic neutrality, or can neutrality be preserved?

  ***

  ### Model Answer

  Demographic neutrality posits that liberal states should not incentivise or disincentivise population growth, treating family size as a private preference akin to religious belief. However, this analogy frays when reproductive choices generate significant externalities. To evaluate whether neutrality collapses under the weight of collective footprints, one must first disentangle the motivations behind pronatalism.

  Axiological pronatalism asserts that creating more people increases total value. If a state adopts this view, it violates neutrality by endorsing a specific theory of value—namely, that existence is inherently preferable to non-existence. Deontic pronatalism, conversely, argues for a duty to reproduce, perhaps to sustain pension systems or cultural continuity. A state enforcing this violates neutrality by coercing citizens into a specific moral obligation. Demographic neutrality requires the state to avoid both claims, permitting reproduction without endorsing the value of the outcome or the duty of the act.

  The challenge arises from aggregation. While a single birth is a private good, millions of births constitute a public force affecting carbon emissions and resource depletion. If neutrality implies ignoring consequences, it becomes untenable. A state cannot claim neutrality on population size if ignoring size leads to catastrophic climate outcomes that undermine the very liberties the state protects. Here, the 'harm principle' overrides neutrality; when private choices aggregate to public harm, the state must intervene.

  However, abandoning neutrality does not necessitate embracing pronatalism or anti-natalism. The state can remain neutral on the *value* of lives while regulating the *context* of reproduction. For instance, removing pronatalist tax benefits does not assert that fewer people are better; it merely stops subsidising a specific demographic outcome. Similarly, carbon pricing internalises the environmental cost of consumption (including that of new citizens) without dictating family size.

  Therefore, demographic neutrality does not fully collapse, but it must be recalibrated. It shifts from a hands-off approach to a structural one. The state cannot be neutral on the *effects* of population growth if those effects threaten future liberty, but it can remain neutral on the *reasons* individuals choose to reproduce. Conflating the management of collective risks with a duty to reproduce (or not) is the primary error. Neutrality survives not as indifference to population size, but as indifference to the moral worth of specific demographic outcomes, provided those outcomes do not infringe upon the rights of others. The state manages the footprint, not the family.

  ***

  ### Marking Scheme

  **Total Marks:** 25
  **Grade Boundaries:** A (20–25), B (15–19), C (10–14), Fail (0–9)

  To achieve an **A grade (20+ marks)**, the answer must successfully execute the following five specific moves. Each move is worth **5 marks**. Partial execution results in a B grade (3–4 marks per move).

  | **Move** | **Criteria for Full Marks (5)** | **Criteria for Partial Marks (3–4)** |
  | :--- | :--- | :--- |
  | **1. Conceptualising Neutrality** | Correctly defines demographic neutrality as a liberal constraint on state endorsement, explicitly distinguishing it from simple indifference or ignorance of population trends. | Defines neutrality vaguely or conflates it with the state having no opinion on population data. |
  | **2. Axiological vs. Deontic** | Clearly distinguishes pronatalism as a claim about *value* (axiological) versus a claim about *duty* (deontic), and explains why the state must avoid both to remain neutral. | Identifies the terms but fails to explain why distinguishing them matters for state policy or neutrality. |
  | **3. The Aggregation Problem** | Analyses how private reproductive choices aggregate into public harms (climate/resources), creating tension with the 'private goods' defence of neutrality. | Mentions climate or resources but fails to link them to the aggregation of individual choices or the limits of privacy. |
  | **4. Evaluating the 'Collapse' Thesis** | Critically assesses whether neutrality must be abandoned. Argues that neutrality can be preserved via structural regulation (e.g., carbon pricing) rather than direct coercion on family size. | Takes a binary view (neutrality either完全 collapses or remains untouched) without nuance regarding *how* it might be preserved. |
  | **5. Structural vs. Individual** | Concludes by distinguishing between managing collective risks (structural) and dictating individual moral duties, avoiding the conflation of population policy with personal obligation. | Conflates state management of resources with a duty for individuals to reproduce (or abstain), missing the liberal distinction. |

  **Notes for Markers:**
  *   **British Spelling:** Ensure consistency (e.g., *neutralise*, *analyse*, *programme*). Deduct 1 mark total for persistent non-standard spelling if it impedes readability.
  *   **Originality:** No credit for rote memorisation of specific named theories without application to the prompt. The focus must be on the argument regarding neutrality.
  *   **Word Count:** The model answer is indicative. Students are not penalised for exceeding 600 words, but conciseness is rewarded within the 90-minute limit.
