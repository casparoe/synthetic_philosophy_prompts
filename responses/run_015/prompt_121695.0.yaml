answer: |-
  ### Position Statement on Methodological Symmetry

  **Methodological symmetry has no legitimate place in this decision tree.**

  Your friend's invocation of the "Strong Program" in the sociology of scientific knowledge conflates *explanation of belief* with *evaluation of truth*. While a sociologist might study the causes of belief in Fomenko and belief in radiocarbon dating using the same causal types (social, psychological, evidential), an encyclopedia editor curates *established knowledge*, not the sociology of belief.

  Applying identical evaluative standards to a degenerating research programme (New Chronology) and a progressive one (Mainstream Historiography) creates a false equivalence that burdens editorial resources and misleads readers regarding the weight of evidence. Demarcation is not censorship; it is triage. To treat a claim that rejects all radiocarbon dating as methodologically identical to a claim that refines radiocarbon calibration curves is to abandon the editorial duty to distinguish signal from noise. This procedure explicitly weights institutional consensus and explanatory progress over raw "open-mindedness."

  ***

  ### The Chronological Revision Validation Procedure (CRVP)

  **Purpose:** To triage submissions proposing radical revisions to established historical chronologies.
  **Grounding:** Lakatos (Research Programmes), Popper (Falsifiability), Longino (Contextual Empiricism).

  #### Step 1: The Falsifiability & Specificity Filter
  **Question:** Does the proposal specify a concrete observation or data point that, if found, would prove the revision false?
  *   **Sufficient Answer:** Yes. The author identifies specific strata, texts, or isotopic data that would contradict their hypothesis.
  *   **Insufficient Answer:** No, or the claim is framed such that contradictory evidence is reinterpreted as "planted," "misdated," or "part of the conspiracy."
  *   **Outcome:** If Insufficient → **REJECT**. (Flag: Fact)
  *   **Value Flag:** [VALUE JUDGMENT] Determining whether a caveat is a legitimate nuance or an *ad hoc* rescue device requires editorial judgment on what constitutes "reasonable" modification of a theory.

  #### Step 2: The Protective Belt Analysis (Lakatosian Check)
  **Question:** To accommodate the new claim, how many established, independently verified facts must be discarded or reclassified as errors?
  *   **Sufficient Answer:** Few. The revision resolves anomalies without dismantling the core network of cross-verified data (e.g., dendrochronology, ice cores, independent textual traditions).
  *   **Insufficient Answer:** Many. The revision requires assuming massive, coordinated errors across unrelated disciplines (e.g., astronomy, geology, linguistics) to sustain the core claim.
  *   **Outcome:** If Insufficient → **REJECT**. (Flag: Fact/Value Hybrid)
  *   **Value Flag:** [VALUE JUDGMENT] Deciding what counts as the "core" of established knowledge vs. a disposable anomaly is a judgment call based on current disciplinary consensus.

  #### Step 3: Institutional Uptake & Peer Scrutiny
  **Question:** Has the methodology been subjected to peer review in journals relevant to the *methods* used (e.g., archaeometry, philology), not just venues sympathetic to the *conclusion*?
  *   **Sufficient Answer:** Yes. The data is published in venues where critics of the theory have equal access and standing to replicate or refute.
  *   **Insufficient Answer:** No. The work appears only in monographs, popular press, or journals dedicated to "alternative" histories.
  *   **Outcome:** If Insufficient → **ESCALATE TO EXPERT** (Do not Accept). (Flag: Value)
  *   **Value Flag:** [VALUE JUDGMENT] This step prioritizes *process* over *content*. It assumes that institutional vetting is a reliable proxy for validity, which is a pragmatic editorial value, not an absolute epistemic truth.

  #### Step 4: Explanatory Scope vs. Complexity
  **Question:** Does the revision explain *more* anomalies than it creates, without invoking unverified agents (e.g., aliens, global conspiracies)?
  *   **Sufficient Answer:** Yes. It solves specific chronological conflicts without introducing entities or mechanisms that lack independent evidence.
  *   **Insufficient Answer:** No. It solves one problem (e.g., "How were stones moved?") by creating larger ones (e.g., "Who hid the aliens?").
  *   **Outcome:** If Insufficient → **REJECT**. (Flag: Fact)
  *   **Final Decision Logic:**
      *   Passes All → **ACCEPT WITH CAVEATS** (Mark as "Emerging Consensus" or "Minority View").
      *   Fails Step 1 or 2 → **REJECT**.
      *   Fails Step 3 but passes 1, 2, 4 → **ESCALATE TO EXPERT** (Potential breakthrough, lacks consensus).

  ***

  ### Application to Proposals

  #### Case 1: The Fomenko/Almagest Claim
  *Proposal:* The *Almagest* was compiled in the 16th century, not the 2nd, based on statistical parallel-text analysis with medieval chronicles.
  *   **Step 1 (Falsifiability):** **FAIL.** The theory posits that all prior astronomical records are part of a "global chronicle" fabrication. Any contradictory carbon dating is dismissed as contamination or error.
  *   **Step 2 (Protective Belt):** **FAIL.** Requires discarding Islamic astronomy, Chinese records, and dendrochronology that independently corroborate the 2nd-century timeline. The "protective belt" of ad-hoc assumptions is thicker than the core theory.
  *   **Decision:** **REJECT.**
  *   **Reasoning:** This is a degenerating research programme. It saves the core claim only by assuming away all contradictory evidence.

  #### Case 2: The Ancient Astronaut/Megalith Claim
  *Proposal:* Precision cutting at Puma Punku proves extraterrestrial engineering because Bronze Age tools could not achieve such tolerances.
  *   **Step 1 (Falsifiability):** **FAIL.** The claim rests on an argument from ignorance ("We don't know how they did it, therefore aliens"). Finding Bronze Age tools that *could* do it is often met with claims of "tool planting."
  *   **Step 4 (Explanatory Scope):** **FAIL.** Invokes an unverified agent (aliens) to solve a technological gap, creating a vastly larger explanatory burden (where are the aliens now? why no other biological evidence?).
  *   **Decision:** **REJECT.**
  *   **Reasoning:** Fails the demarcation of science by relying on non-naturalistic explanation and argument from ignorance.

  #### Case 3: The Radiocarbon/Bronze Age Collapse Claim
  *Proposal:* New high-precision radiocarbon calibration curves (IntCal20 updates) suggest the Late Bronze Age Collapse occurred 50 years later than currently stated in the encyclopedia.
  *   **Step 1 (Falsifiability):** **PASS.** Specific isotopic ratios in olive wood from Santorini are cited; finding contradictory stratigraphy would falsify it.
  *   **Step 2 (Protective Belt):** **PASS.** Does not require discarding dendrochronology or textual records, only shifting the synchronization point between them.
  *   **Step 3 (Institutional Uptake):** **FAIL/ESCALATE.** While published in *Nature*, the wider archaeological community has not yet reached consensus. Major textbooks and competing labs still cite the older range. The procedure requires *consensus* for Acceptance.
  *   **Decision:** **ESCALATE TO EXPERT.** (Do not update the encyclopedia yet).
  *   **The "Dislike" Outcome:** As an editor seeking cutting-edge accuracy, you may dislike this result. The data is likely *correct*, but the CRVP forces you to wait for consensus. This is the cost of the anti-symmetry position: to filter out Fomenko-style noise (Case 1), you must raise the barrier for entry, which inevitably slows the adoption of legitimate radical revisions (Case 3). The procedure prioritizes *reliability* over *novelty*.

  ***

  ### Note on Liberties and Contested Readings

  This procedure takes two specific liberties with standard demarcation theory:

  1.  **Operationalizing Lakatos:** Imre Lakatos's "Research Programmes" was designed to analyze the history of science retrospectively, not as a real-time editorial filter. Using it to *pre-emptively* label a programme "degenerating" (Case 1) risks stifling a paradigm shift before it matures. I have accepted this risk to prioritize editorial stability.
  2.  **Consensus as Truth-Proxy:** Step 3 relies on a Longino-esque view of "transformative criticism" but treats institutional consensus as a sufficient proxy for validity. This is contested by philosophers who note that consensus can be socially constructed (e.g., Semmelweis reflex). The procedure admits this by flagging Step 3 as a [VALUE JUDGMENT]. It chooses the *social reliability* of the claim over its potential *ontological truth* to serve the encyclopedia's function as a reference work rather than a research journal.
