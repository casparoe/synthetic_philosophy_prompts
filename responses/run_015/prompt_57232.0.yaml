  Here is a worked example of cue-dependence in prose, designed to illustrate Hofstadter's critique without relying on poetry, idioms, or apocrypha.

  ### The Example: PP-Attachment and Lexical Cues

  **1. The Original Sentence (Cue Present)**
  > **Source:** "The guard watched the prisoner with the handcuffs."
  > **Situation:** The prisoner is wearing handcuffs. The guard is observing.
  > **Plausible Correct Output (Spanish):** "El guardia vigiló al prisionero **que llevaba** esposas."
  > *(Note: The system correctly resolves the attachment ambiguity by expanding the prepositional phrase into a relative clause ["who was wearing"], indicating it recognizes "handcuffs" as a modifier of "prisoner" based on strong training associations.)*

  **2. The Perturbation (Cue Broken)**
  > **Source:** "The guard watched the prisoner with the shackles."
  > **Situation:** Identical. The prisoner is wearing shackles. "Shackles" is a near-synonym for "handcuffs" in this context.
  > **Plausible Wrong Output (Spanish):** "El guardia vigiló al prisionero **con** los grilletes."
  > *(Note: The system translates "with" literally as "con". In Spanish, "vigiló... con los grilletes" strongly implies instrumentality—that the guard used the shackles as a tool to do the watching, or leaves the attachment dangerously ambiguous.)*

  **3. Why This Is Cue-Dependence**
  The neural system is not modeling the situation (a prisoner in restraints being observed). If it were, it would know that shackles, like handcuffs, are body-worn restraints and cannot be used as an instrument for watching. Instead, the system is relying on the surface statistical cue of the bigram **"prisoner + handcuffs."** This collocation appears frequently in the training corpus (crime reports, fiction), teaching the model that when these two tokens appear near "with," the attachment is a modifier.

  When you swap "handcuffs" for "shackles," you preserve the truth conditions of the sentence but break the high-probability surface cue. The model, lacking a semantic representation of what a shackle *is*, falls back to the default syntactic parse for "Verb + Object + with + Noun," which is often instrumental.

  ### A Note on "Coverage Gap" vs. "Gap in Kind"

  You asked me to flag if this notion doesn't carve out anything interesting. Here is the nuance you will need for your dissertation:

  An engineer at a translation company will call this a **coverage gap**. They will argue that if we simply train on more data containing "prisoner with shackles," the system will learn the correct alignment. They view the failure as a lack of information, not a lack of understanding.

  However, Hofstadter would argue this is a **gap in kind**. His point is that no amount of surface-string data can bridge the gap because the system is fundamentally the wrong *type* of thing to solve the problem. It is manipulating symbols based on proximity, not modeling a world where objects have physical properties (shackles go on wrists, not in eyes). The fact that a synonym swap breaks the translation proves the system is sensitive to the *shape* of the words, not the *situation* they describe.

  For your chapter, this example is stronger than the poetry one because it isolates the semantic failure from the aesthetic one. The "shackles" sentence is not beautiful, and the error is not about rhythm; it is about who is doing what to whom. It demonstrates that even in dry, literal prose, the system is "blind" to the reality the text points to.
