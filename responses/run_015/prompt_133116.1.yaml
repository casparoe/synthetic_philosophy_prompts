      *   *Hard Choices vs. Incommensurability:* A hard choice might be $100 vs $105 (easy) vs $100 now vs $100 later (hard but comparable). Incommensurable is "Save the Cathedral" vs "Feed the Poor." No currency exists.
      *   *Value Shadow:* This is the invented concept. It's not regret (emotion) but a structural residue. The choice changes the agent's normative landscape permanently. It's not a wound; it's a scar that signifies a specific ontological shift.
      *   *Mara's Dilemma:* She needs to advise without claiming superiority. The petitioner wants proof her shadow doesn't disqualify her. The proof must be that the shadow *is* the qualification.
