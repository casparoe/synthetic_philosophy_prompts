  Your two summary points are fair and accurate characterizations of David Rosenthal's specific version of Higher-Order Thought (HOT) theory. 

  1.  **The Unconscious Monitor:** Rosenthal explicitly argues that the higher-order thought must be unconscious; if it were conscious, it would require a third-order thought to make *it* conscious, launching the infinite regress you identified.
  2.  **The Misrepresentation:** Rosenthal accepts that higher-order thoughts can be "targetless." If the higher-order thought represents you as being in a state (like pain or fury) that isn't actually present, you are still consciously in that state, even though the first-order state is missing.

  Here is the joke:

  In the Mind's Monitoring Division, the clerk logs every mental state, though his own shifts are never logged. 
  He files a report that the pain center is active. 
  The subject is consciously in pain, though the pain center is empty.
