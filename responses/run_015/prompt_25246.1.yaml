answer: |-
  This is a classic problem in applied ontology. In metaphysics, this is known as the **Special Composition Question (SCQ)**: *Under what conditions do some things compose a further thing?*

  The hard philosophical truth your team needs to accept immediately is this: **There is no mind-independent fact of the matter.** An IV stand and pump do not come with a metaphysical label saying "We are one object." Whether they are one object depends on the *conceptual scheme* you impose on them.

  Philosophers of technology (like Peter Kroes and Wybo Houkes) argue that technical artifacts are defined by their **use** and their **design intent**, not just their physics. Therefore, your ontology should not try to discover the "true" boundaries of devices, but rather **stipulate** boundaries that minimize friction across your downstream systems (billing, maintenance, inventory).

  Below is the **Device Composition Heuristic (DCH)**. It translates 50 years of mereological (part/whole) debate into a 15-minute operational workflow.

  ---

  # The Device Composition Heuristic (DCH)

  **Goal:** Determine if a collection of physical components should be recorded as a single `Asset_ID` or multiple `Asset_IDs`.
  **Time Budget:** 15 Minutes per case.
  **Philosophical Basis:** *Conventionalism* (we decide based on utility) + *Functionalism* (parts are defined by role).

  ## Phase 1: The Context Check (2 Minutes)
  Philosophy teaches that "objecthood" is often sortal-relative. A "heart" is an organ to a biologist, a meat object to a butcher, and a transplant unit to a surgeon. In your network, **context dictates composition.**

  Before analyzing the device, ask: **Which downstream system is the primary driver for this classification?**

  1.  **Biomedical Engineering (Maintenance):** Focuses on repairability and calibration.
  2.  **Finance/Supply Chain (Inventory):** Focuses on depreciation and theft prevention.
  3.  **Clinical/Billing (Usage):** Focuses on procedural coding (CPT/DRG).

  *Rule:* If the contexts conflict (e.g., Billing sees one unit, Maintenance sees three), **create a Parent-Child relationship in the data model.** Do not force a binary "one or many" if the business processes disagree.
  *   *Parent Asset:* The functional whole (for Billing).
  *   *Child Assets:* The replaceable modules (for Maintenance).

  **If you must choose a single classification for the master ontology, proceed to Phase 2.**

  ## Phase 2: The Four Tests (8 Minutes)
  Run the assembly through these four tests. These are derived from philosophical conditions of *contact*, *function*, *persistence*, and *social institution*.

  ### 1. The Functional Unity Test
  *Philosophical Root: Functional Integration (Koslicki)*
  *   **Question:** If Component A is removed, does Component B lose its primary medical utility?
  *   **Yes:** Points to **ONE** device. (e.g., A detector removed from an X-ray gantry makes the gantry useless).
  *   **No:** Points to **SEVERAL** devices. (e.g., A pulse oximeter clipped to an IV pole still works if the pole is removed).
  *   **Threshold:** If >50% of the components fail without each other, lean toward **ONE**.

  ### 2. The Physical Coupling Test
  *Philosophical Root: Fastening vs. Contact (Markosian)*
  *   **Question:** What is required to separate the components?
  *   **Tools Required:** Points to **ONE**. (Screws, welding, proprietary connectors).
  *   **Hands Only:** Points to **SEVERAL**. (Clips, gravity, Velcro, standard plugs).
  *   **Time Factor:** Does separation take >5 minutes of labor? Yes = **ONE**.

  ### 3. The Identity Persistence Test (The "Ship of Theseus")
  *Philosophical Root: Sortal Persistence (Wiggins)*
  *   **Question:** If we swap Component A for a new one, does the "Device" retain its Asset ID?
  *   **Yes (Component):** It is a **PART**. (e.g., Swapping a battery doesn't change the pump's ID).
  *   **No (Module):** It is a **SEPARATE DEVICE**. (e.g., Swapping a robotic arm requires registering the new arm's serial number).
  *   **Rule:** If the component has its own FDA UDI (Unique Device Identifier) that must be tracked independently, it is **SEVERAL**.

  ### 4. The Regulatory Trump Card
  *Philosophical Root: Institutional Facts (Searle)*
  *   **Question:** Does the FDA, Joint Commission, or Insurance Payer define this as a single system?
  *   **Yes:** This overrides all other tests.
  *   **Why:** In social ontology, if the institution says it is one, it *is* one for your purposes.
  *   **Action:** Check the manufacturer's 510(k) clearance. Is the system cleared as a bundle or as modular components?

  ## Phase 3: Scoring & Decision (3 Minutes)

  Tally the results from Phase 2.

  | Test | Result: ONE Device | Result: SEVERAL Devices |
  | :--- | :--- | :--- |
  | **1. Function** | Interdependent | Independent |
  | **2. Coupling** | Tools / >5 mins | Hands / <5 mins |
  | **3. Persistence** | Part swap keeps ID | Module swap changes ID |
  | **4. Regulatory** | Cleared as System | Cleared as Components |

  *   **3 or 4 "ONE" votes:** Model as **Single Asset**.
  *   **3 or 4 "SEVERAL" votes:** Model as **Multiple Assets**.
  *   **2 vs. 2 Split:** **FLAG FOR GOVERNANCE.** This is a "Vagueness Boundary." Do not decide alone. Escalate to the Data Governance Committee.

  ## Phase 4: Edge Case Protocols (2 Minutes)
  Philosophy highlights specific paradoxes that occur in hospital settings. Apply these standing rules.

  ### A. The "Ship of Theseus" (Gradual Replacement)
  *Problem:* Over 5 years, every part of an infusion pump is replaced. Is it the same asset?
  *Rule:* The **Chassis/Backplane Rule**. The device retains its Asset ID as long as the main structural housing or main logic board (whichever holds the primary serial number) remains. If that is replaced, it is a **New Asset** (even if the housing looks the same).

  ### B. The "Docking Station" Problem (Temporary Attachment)
  *Problem:* Monitors that dock to a wall mount or a pole for an hour, then move.
  *Rule:* The **80% Operational Cycle Rule**. If Component A is attached to Component B for >80% of its operational life, model them as one. If it is frequently reconfigured (e.g., a laptop on a cart), model as **Separate**.

  ### C. The "Russian Doll" (Nested Systems)
  *Problem:* A surgical robot contains computers, which contain chips.
  *Rule:* The **Maintenance Boundary**. Composition stops at the lowest unit that is *field-replaceable* by your biomedical team. If you don't repair the chip, the chip is not an asset in your ontology; it is a *part* of the computer.

  ---

  # Worked Examples

  ### Case 1: The IV Pole Assembly
  **Setup:** An aluminum IV pole with two gravity clips, one infusion pump clamped to the side, and a battery pack attached to the bottom.

  1.  **Context:** Maintenance wants to track the pump; Supply wants to track the pole.
  2.  **Tests:**
      *   *Function:* Pump works without pole (Yes). Pole works without pump (Yes). -> **SEVERAL**
      *   *Coupling:* Pump clamps by hand. -> **SEVERAL**
      *   *Persistence:* Pump has its own UDI/Serial. Pole does not. -> **SEVERAL**
      *   *Regulatory:* Pump is FDA regulated; Pole is general furniture. -> **SEVERAL**
  3.  **Decision:** **SEVERAL ASSETS.**
      *   *Data Model:* `Asset_Pump` linked to `Location_Pole` via a "Mounted_On" relationship, not a "Part_Of" relationship.

  ### Case 2: The Surgical Robot
  **Setup:** A central console with four detachable robotic arms. The arms are sterilized and swapped between procedures.

  1.  **Context:** Billing charges per procedure using the robot system. Maintenance tracks arm usage cycles.
  2.  **Tests:**
      *   *Function:* Arms are useless without console; Console is useless without arms. -> **ONE**
      *   *Coupling:* Arms require a tool/key to detach. -> **ONE**
      *   *Persistence:* Arms have individual serial numbers tracked for sterilization cycles. -> **SEVERAL**
      *   *Regulatory:* FDA clearance is for the "System," but UDI requires tracking arms. -> **SPLIT**
  3.  **Decision:** **PARENT-CHILD MODEL.**
      *   *Data Model:* `Asset_Robot_System` (Parent, for Billing/Location) contains 4x `Asset_Robot_Arm` (Children, for Maintenance/STERIS tracking).
      *   *Why:* This acknowledges the functional whole while respecting the persistence conditions of the parts.

  ### Case 3: The "Frankenstein" Monitor
  **Setup:** A patient monitor where the screen, the processing module, and the battery are all hot-swappable. The hospital mixes and matches these from different vendors.

  1.  **Context:** Biomed needs to know exactly which module failed.
  2.  **Tests:**
      *   *Function:* Modules are interoperable. -> **SEVERAL**
      *   *Coupling:* Slide-latch, no tools. -> **SEVERAL**
      *   *Persistence:* Each module has a unique serial. -> **SEVERAL**
      *   *Regulatory:* Each module has distinct UDI. -> **SEVERAL**
  3.  **Decision:** **SEVERAL ASSETS.**
      *   *Data Model:* Do not create a "Monitor" asset. Create assets for `Module_Processor`, `Module_Screen`, `Module_Battery`. Link them via a "Configured_As" relationship to a virtual "Station."

  ---

  # Implementation Guide for the Team

  ### 1. Accept "Ontological Vagueness"
  There will be cases where the score is 2-vs-2. Philosophy tells us this is not a failure of your analysis; it is a feature of reality. Some objects are genuinely vague.
  *   **Action:** Create a `Composition_Ambiguity_Flag` in your database. If a device is flagged, downstream systems (like Billing) must have a manual override rule.

  ### 2. The "Default to Separation" Rule
  When in doubt, model as **Separate**.
  *   **Reasoning:** It is easier to aggregate separate data points (summing up parts to make a whole) than it is to disaggregate a monolithic record. You can always query "Show me all parts belonging to Asset X," but you cannot easily query "Show me the value of the screen inside Asset X" if the screen isn't tracked.

  ### 3. Review Cycle
  Composition is not static. A device that was "One" (sealed unit) might become "Several" (modular repair enabled) after a firmware update or manufacturer retrofit.
  *   **Action:** Re-run the DCH whenever a device undergoes a major lifecycle update or change in vendor support policy.

  ### 4. Documentation
  For every ontology decision, record **which test was the tie-breaker**.
  *   *Example:* "IV Pump + Pole modeled as separate. Tie-breaker: Regulatory Test (FDA UDI requirements)."
  *   This protects your team during audits. You aren't guessing; you are applying a consistent heuristic.

  # Summary Checklist (Print this)

  1.  **Context:** Which system drives this? (Maint/Finance/Clinical)
  2.  **Function:** Do parts fail together?
  3.  **Coupling:** Do we need tools to separate them?
  4.  **Persistence:** Do parts have independent Serial/UDI?
  5.  **Regulatory:** Does the FDA/Insurer define the boundary?
  6.  **Score:** 3+ votes wins.
  7.  **Tie?** Flag for Governance. Default to Separation.

  By using this heuristic, you move the conversation from "What *is* this?" (Metaphysics) to "How do we *agree to treat* this?" (Data Governance). That is the only solution that scales.
