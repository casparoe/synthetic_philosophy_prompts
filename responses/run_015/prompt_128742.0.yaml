      *   **Task:** Assess this institutional design through Rawls's actual commitments. Determine if it's legitimate enforcement of public reason or a category mistake. Address the tension between safeguarding religious exercise and restricting religious reasons in constitutional debate. Indicate where Rawls gives a clear verdict and where he is underdetermined.
