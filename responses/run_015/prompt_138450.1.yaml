answer: |-
  ### 1. The Rules of the Pratt Method

  Justice Pratt's opinions reveal a methodology that attempts to reconcile strict textual fidelity with functional statutory coherence. Her record is jointly consistent with three specific rules, which are in tension in *Nexus*.

  *   **Rule 1: Operative Text Primacy (The *Carmichael/Okafor* Rule).**
      *   *Statement:* Operative provisions control over purposes clauses. A purposes clause explains the legislative choice but does not expand the operative line drawn. Furthermore, a later legislature cannot alter the legal effect of an unrepealed operative provision for *past* conduct merely by amending a purposes clause or definition, absent changes to the operative text itself.
      *   *Prediction:* **Nexus wins.** Section 4 is the operative text; Section 2 is a purposes clause (*Carmichael*). The 2021 legislature left Section 4 untouched (*Okafor*). Therefore, Section 2(c) cannot expand Section 4's reach, particularly for conduct predating 2021.

  *   **Rule 2: Anti-Nullification (The *Delgado* Rule).**
      *   *Statement:* Text must be read to avoid rendering the statute's core function ineffective. If one reading allows an exception to swallow the rule or guts the statutory scheme, the court must adopt the reading that preserves the statute's efficacy, provided that reading is "fairly susceptible" in the text. This is not external policy; it is the correct textual reading.
      *   *Prediction:* **State wins.** If "record that identifies" excludes linkable profiles held by the creator, data brokers can evade the ban by stripping names while keeping keys. This guts Section 4. The text is susceptible to a "linkable" reading.

  *   **Rule 3: Temporal Code Coherence (The *Alvarez/Trent* Rule).**
      *   *Statement:* For *prospective* application, the compiled statutes are one body of law (*Alvarez*). A later amendment to a definition or purpose informs the meaning of unrepealed provisions for future conduct. For *retrospective* application, later amendments are merely evidence of original meaning, not controlling (*Trent*).
      *   *Prediction:* **Split Liability.** Pre-2021 conduct is judged by the 2009 meaning (Nexus wins). Post-2021 conduct is judged by the 2023 Code as a whole, informed by 2(c) (State wins).

  ### 2. Prediction

  **Vote:** Justice Pratt will vote to **affirm liability against Nexus**, but she will write separately to **split the temporal application**.

  *   **Pre-2021 Conduct (2017–2021):** She votes for **Nexus**.
      *   *Reasoning:* She will apply *Okafor* and *Trent*. The 2009 legislature drew a line in Section 4. The 2021 legislature's statement in Section 2(c) that Section 4 "already reaches aggregation" is a legislative fiction regarding the past. Under *Okafor*, a later legislature's deeming clause does not change the historical operative choice. Under *Carmichael*, the purposes clause is the "least reliable" indicator of operative scope. She will find that applying the 2021 clarification to 2017 conduct violates the principle that silence in operative text is intentional.
  *   **Post-2021 Conduct (2021–Present):** She votes for the **State**.
      *   *Reasoning:* She will apply *Alvarez*. For conduct occurring after the amendment, the Valmere Code is read as a single, coherent body of law. The 2021 amendment to Section 2 informs the ordinary meaning of Section 4 for future cases. Combined with *Delgado*, she will find that the text of Section 4 is "fairly susceptible" to covering linkable profiles, and Section 2(c) resolves any ambiguity in favor of the State for this period.
  *   **Confidence:** **High (80%).** This outcome allows her to answer the specific question she reserved in the *Trent* footnote (can a later purposes amendment alter an unrepealed provision?) with a nuanced "Yes, but only prospectively." It satisfies her drafting-office instinct for precision (*Okafor*) while preventing the statute from becoming a dead letter moving forward (*Delgado/Alvarez*).

  ### 3. The Strongest Argument in Her Vocabulary

  Your instinct is correct: **Pressing *Delgado* (Anti-Nullification) is your engine; Section 2(c) is merely the transmission.**

  If you lead with Section 2(c), you trigger her *Carmichael* skepticism (purposes clauses are unreliable) and her *Okafor* constraint (later legislatures can't rewrite history). You hand Nexus the avoidance canon on a silver platter.

  **The Argument Structure:**
  1.  **Primary Claim (*Delgado*):** Section 4's text ("record that identifies") *already* covers Nexus's profiles because Nexus retains the mapping key. To hold otherwise is to let the de-identification exception swallow the disclosure rule. This is a textual argument, not a policy one.
  2.  **Secondary Claim (*Alvarez*):** For post-2021 conduct, Section 2(c) confirms this reading as the current ordinary meaning of the Code.
  3.  **Concession (*Trent*):** You must concede that Section 2(c) does not *retroactively* change the meaning of Section 4 for pre-2021 conduct.

  **Why this helps:** It isolates the *Delgado* argument as the basis for the pre-2021 liability. If you argue 2(c) governs pre-2021 conduct, you lose her. If you argue *Delgado* governs pre-2021 (text always meant this) and *Alvarez* governs post-2021 (code is now explicit), you give her a path to a unified State victory, though she may still split.

  **Does 2(c) poison the well?** Yes, if used as the *sole* basis for liability. It triggers the *Okafor* instinct. But if used only to reinforce *Delgado* for prospective application, it aligns with *Alvarez*. Do not argue that 2(c) *changes* Section 4. Argue that 2(c) *clarifies* the ambiguity that *Delgado* already resolves.

  ### 4. Opening Two Minutes: Concede vs. Hold

  **Concede (The *Carmichael/Okafor* Trap):**
  "Counsel concedes that a purposes clause cannot independently create liability where the operative text is silent. We do not ask the Court to use Section 2(c) to rewrite Section 4. Nor do we argue that the 2021 Legislature could retroactively alter the legal consequences of 2017 conduct through a statement of purpose."
  *(Why: This disarms her *Carmichael* and *Okafor* instincts immediately. It shows you respect the textual boundary.)*

  **Hold (The *Delgado/Alvarez* Ground):**
  "However, the text of Section 4 has always covered records that are linkable to a customer. Nexus holds the key; the record identifies. To rule otherwise is to allow the statute's core prohibition to be evaded by a clerical step, violating the principle in *Delgado* that exceptions must not swallow rules. For post-2021 conduct, the Code must be read as a coherent whole under *Alvarez*, where Section 2(c) confirms the ordinary meaning of 'identifies' today."
  *(Why: This anchors the case in her *Delgado* anti-gutting principle and her *Alvarez* code-coherence principle.)*

  ### 5. The Feared Question

  **The Question:**
  "Counsel, in *Okafor*, we held that a later legislature's deeming fiction could not change the operative effect of an earlier statute. In *Carmichael*, we said purposes clauses are the least reliable part of an act. If the 2021 Legislature believed Section 4 already covered aggregation, why did they decline to amend Section 4 twice? Doesn't *Okafor* compel us to respect their choice to leave the operative text alone?"

  **The Two-Minute Answer:**
  "Justice Pratt, *Okafor* concerned a historical fact—whether a conviction occurred. A later legislature cannot change history. This case concerns the *scope* of a continuing statutory term.

  There is a critical distinction between *changing* the law and *clarifying* the text to prevent nullification. Under *Delgado*, we must read Section 4 to avoid gutting the Act. If 'record' excludes linkable profiles, Section 4 is nullified. That reading was available in 2009.

  The 2021 amendment matters not because it changes Section 4, but because, under *Alvarez*, the Code is one body of law. For future conduct, we read the statute as the legislature has left it *now*. The 2021 Legislature clarified that the 2009 text reaches aggregation. We ask you to apply *Delgado* to the 2009 text for the past, and *Alvarez* to the compiled Code for the future. Respect for *Okafor* means respecting the 2009 text's original reach, not freezing it in a reading that kills it."

  ### 6. The Distinguishing Hypothetical

  **The Variant:**
  Imagine the 2024 Legislature amends Section 2 to **remove** subsection (c) and adds subsection (d): "The purposes of this Act do *not* include regulating inferred profiles or aggregated data." Section 4 remains untouched. A broker is sued in 2025 for selling inference profiles.

  **The Test:**
  *   **If Pratt rules for the Broker:** She prioritizes **Operative Text Primacy (*Carmichael*)**. She believes a purposes clause cannot *limit* operative text any more than it can expand it. The operative text of Section 4 controls regardless of the purpose statement.
  *   **If Pratt rules for the State:** She prioritizes **Temporal Code Coherence (*Alvarez*)**. She believes the compiled statutes are one body of law, and a later expression of purpose *does* inform the ordinary meaning of unrepealed operative text for future conduct, even if it narrows it.

  **Pratt's Likely View:**
  Based on *Alvarez* ("compiled statutes are one body of law... reads them as the legislature has left them"), she would likely rule for the **State** (liability stands), but she would write to clarify that the *purpose* informs the *text's* meaning, rather than overriding it. She would likely say that if the Legislature wants to exempt profiles, they must amend Section 4, because a purposes clause is too "unreliable" (*Carmichael*) to strip liability created by operative text.

  **Principled Distinction:**
  This turns on whether she views the Purposes Clause as **interpretive guidance** (which can narrow or broaden) or **explanatory surplusage** (which can do neither). *Carmichael* suggests surplusage; *Alvarez* suggests guidance. A ruling here would reveal whether *Alvarez* swallows *Carmichael* in cases of direct conflict. Given her drafting background, she likely views the Code as an integrated machine (*Alvarez*), meaning the 2024 amendment *would* shift the interpretation, provided the text of Section 4 is ambiguous. If Section 4 is clear, *Carmichael* wins. This hypothetical forces her to define the threshold of ambiguity required for a purposes clause to matter.
