  2.  **Deconstruct the Philosophical Issues:**
      *   **Leibniz's PII:** If $x$ and $y$ share all properties, $x = y$. Contrapositive: If $x \neq y$, there must be some property $P$ such that $P(x) \neq P(y)$.
      *   **Max Black's Two Spheres:** A universe with only two exactly similar spheres. They share all intrinsic properties. They share relational properties (distance from each other is symmetric). Leibnizians argue "being sphere 1" vs "being sphere 2" is a haecceity (thisness), but Black argues this begs the question. If space is relational, there's no "left" or "right" without a third point.
      *   **Angier's Machine:** Creates a copy at a distance.
          *   *Standard Reading:* Original stays, copy appears elsewhere. They differ spatially immediately. PII holds (spatial location is a property). The horror is psychological/ethical (which one is *me*?).
