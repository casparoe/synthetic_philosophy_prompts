  The film fails as a counterexample to Leibniz because space is a property. When Angier steps into the machine, the original stays and the copy appears elsewhere; they differ in spatial coordinates immediately, so they are discernible and numerically distinct. Leibniz is safe. The horror isn't metaphysical indeterminacy, it's the ethical cost of killing a distinct person who happens to be you. If you rewrite the machine to produce Black-style symmetry—two Angiers emerging equidistant from the box with no asymmetric causal history—PII is genuinely threatened. In that scenario, there is no fact of the matter about which one is the "original" continuer because there is no haecceity to anchor the pronoun "I." The horror survives this rewrite, perhaps intensifies, because it shifts from survival guilt to the dissolution of the singular subject. Angier's dying speech claims ignorance ("I never knew"), but in the symmetric case, it wouldn't be ignorance; it would be truthlessness. There is no fact to know.

  Borden's plot inverts this: he offers numerical distinctness masked by performative indiscernibility. The twins are distinct because they occupy different spaces and have different internal histories, even if they share clothes and injuries. This doesn't break PII; it merely shows that indiscernibility is often epistemic, not ontological. Pairing the plots suggests the film is interested in the *cost* of identity rather than its logic. Angier pays with death to be two places; Borden pays with life to be one person. The Tesla machine is indeed a plot device with fake-philosophy paint; it assumes materialism solves continuity, which it doesn't. The lens fits the ethics of duplication but slips on the metaphysics of individuation.

