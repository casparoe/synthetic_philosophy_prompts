  You confuse the condition of the crime with the excuse for the criminal. It is true that modern bureaucracy creates a theater where responsibility is dissolved into functions, inviting what you call structural thoughtlessness; but an invitation is not a compulsion. My point was never that the system makes evil relative, but that the system reveals how ordinary the capacity for evil truly is when the individual surrenders the faculty of judgment. To claim this is relativism is to misunderstand the nature of judgment itself: I do not judge Eichmann by the standards of his office, but by the standard of his humanity, which demands he think what he is doing. The structure may normalize the massacre, but it cannot think for the man inside the uniform. If you dissolve the individual into the sociology of the office, you commit the very error I accused the court of making—you seek a cause where there is only a choice. Judgment is indeed situated in the world, but that does not make it relative; it makes it human. The failure to think is universal, even if the bureaucracy that rewards it is particular.
