      *   *Point 1: Emulation vs. Iconography.* Plutarch wants emulation, but *intelligent* emulation. It's not about walking on foot specifically; it's about the *principle* of austerity and solidarity.
      *   *Point 2: Hagiographic Flattening?* Plutarch does idealize Cato (Stoic sage), but he also shows the *cost* of this virtue (political failure, alienation of allies, suicide). This preserves ambiguity. Hagiography usually ends in triumph (heaven); Cato ends in defeat (death), which complicates the moral lesson.
      *   *Point 3: Particularity vs. Universality.* The specific acts (walking, refusing gifts) are the *particulars* that reveal the *universal* virtue (integrity). The reader must translate the particular to their own context.
