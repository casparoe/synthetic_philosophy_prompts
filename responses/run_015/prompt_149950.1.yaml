answer: |-
  **Research Proposal**

  **Title:** Meta-Normative Architecture: Extending the Wrong-Kind Reasons Distinction to Framework Selection

  **Student Name:** [Name]
  **Course:** [Course Name/Code]
  **Date:** [Date]
  **Word Count Target:** 6,000 words

  ### 1. Introduction and Research Question

  The distinction between 'right-kind' reasons (RKRs) and 'wrong-kind' reasons (WKRs) has become a central fixture in contemporary meta-ethics and epistemology. Traditionally, this distinction is employed to differentiate between reasons that bear on the correctness of an attitude (such as evidence for belief or admirability for admiration) and reasons that bear merely on the benefits of holding that attitude (such as pragmatic gains or threats). The canonical cases involve a demon threatening to punish an agent unless they admire him, or a Pascal-style wager regarding belief in God. In these instances, the threat or the wager provides a reason to *want* to have the attitude, but not a reason that counts in favour of the attitude's content being correct.

  However, the existing literature almost universally presupposes a fixed normative background. Analyses typically ask whether a specific reason counts for or against a first-order attitude (believing *p*, admiring *x*) within an already accepted framework of rationality or normativity. They do not ask whether the WKR distinction applies to the selection of the framework itself. This proposal outlines a term paper that investigates whether the structural logic of the WKR problem survives at the meta-normative level.

  The research question is stated precisely as follows: **Can there be wrong-kind reasons for adopting one normative framework over another (e.g., consequentialism over deontology) or for retaining a particular conceptual taxonomy in ethics, in the same structural sense that there are wrong-kind reasons for first-order attitudes like belief or admiration?**

  To answer this, the paper will examine whether the constitutive aims that generate WKRs at the first-order level have analogues at the level of framework choice. If frameworks possess constitutive aims (e.g., coherence, explanatory power, or action-guidance), then reasons bearing on those aims might be RKRs, while reasons bearing merely on the psychological comfort of the agent might be WKRs. Conversely, if framework selection is purely instrumental, the distinction may collapse.

  ### 2. Literature Review and Identified Gap

  The contemporary debate on WKRs originates largely from the work of T.M. Scanlon and Derek Parfit, and has been significantly refined by philosophers such as Pamela Hieronymi, Mark Schroeder, and Christopher Howard. The standard 'fitting-attitude' analysis suggests that for an attitude to be correct, it must fit its object. RKRs are those that indicate the object possesses the relevant properties to make the attitude fitting. WKRs are external to this fitting relation.

  Hieronymi's account, for instance, grounds the distinction in the nature of the attitudes themselves: belief aims at truth, and thus only evidence constitutes an RKR. This 'constitutive aim' strategy is powerful for first-order attitudes. However, a significant gap exists in the literature regarding the *scope* of this analysis. Current treatments implicitly treat the normative framework (the standards by which we judge fittingness) as a fixed parameter. They analyse the rationality of attitudes *given* a framework, but they do not analyse the rationality of the framework *given* the agent's situation.

  This leaves open a crucial meta-normative question. When an agent chooses to adopt a consequentialist calculus rather than a deontological constraint system, are they responding to reasons about which system is 'correct' (an RKR for framework adoption), or are they responding to reasons about which system is more useful to them personally (a WKR for framework adoption)? If the latter, does the WKR distinction retain its critical force, or does it dissolve into a general distinction between moral and pragmatic reasons? The proposed paper will address this gap by testing the robustness of the WKR distinction when the 'attitude' in question is the acceptance of a normative theory itself.

  ### 3. Methodology and Structure

  The paper will proceed via conceptual analysis, avoiding empirical research or archival work. The argument will be structured to fit within the 6,000-word limit, divided into five main sections.

  **3.1. Section 1: The Standard Model and its Limits (approx. 1,000 words)**
  This section will briefly reconstruct the standard WKR debate, focusing on the 'constitutive aim' account (Hieronymi) and the 'buck-passing' account (Scanlon/Parfit). It will demonstrate how these accounts rely on a pre-existing normative background. The section will conclude by articulating the problem of 'framework relativity': if the RKR/WKR distinction is internal to a framework, it cannot be used to evaluate the framework itself without circularity, unless there are meta-normative constitutive aims.

  **3.2. Section 2: Constitutive Aims for Frameworks (approx. 1,500 words)**
  Here, the paper will investigate whether normative frameworks have constitutive aims analogous to truth for belief. Candidates for such aims include:
  *   **Coherence:** The internal consistency of the theory.
  *   **Explanatory Power:** The ability to systematise moral intuitions.
  *   **Action-Guidance:** The capacity to generate decisions.
  The central task is to determine if reasons bearing on these aims count as RKRs for framework adoption. For example, if one adopts consequentialism because it offers greater coherence, is that an RKR? If one adopts it because it reduces anxiety, is that a WKR? This section will argue that if frameworks have constitutive aims, the WKR distinction can be meaningfully extended.

  **3.3. Section 3: Testing Three Domains (approx. 2,000 words)**
  To test the hypothesis generated in Section 2, the paper will apply the analysis to three candidate domains:
  1.  **Moral Theory Selection:** Choosing between consequentialism and deontology. The paper will analyse whether pragmatic reasons (e.g., 'utilitarianism is easier to teach') function as WKRs in the same structural way as the demon's threat does for admiration.
  2.  **Epistemic Policy:** Choosing between strict evidentialism and a more permissive pragmatism. This domain is crucial because epistemic norms are often seen as the paradigm for RKRs. If the WKR distinction fails here at the policy level, it likely fails elsewhere.
  3.  **Aesthetic Categorisation:** Choosing how to carve up artistic concepts (e.g., adopting a historicist definition of art vs. a functionalist one). This provides a non-moral control case to see if the distinction is specific to practical normativity or applies to theoretical classification generally.

  **3.4. Section 4: Possible Outcomes and Adjudication (approx. 1,000 words)**
  This section will outline the two primary possible conclusions:
  *   **Outcome A (Collapse):** The distinction collapses at the meta-level. All reasons for framework selection are ultimately instrumental (pragmatic). Therefore, the RKR/WKR distinction is merely a first-order phenomenon dependent on fixed constitutive aims.
  *   **Outcome B (Survival):** The distinction survives but requires a modified account of 'theoretical virtue'. Frameworks have correctness conditions independent of their utility to the agent.
  The paper will argue that Outcome B is preferable but requires abandoning a purely internalist account of reasons. Considerations adjudicating between them will include the 'arbitrariness objection' (if all framework reasons are instrumental, framework choice is arbitrary) and the 'normative authority objection' (can a framework chosen for pragmatic reasons bind the agent?).

  **3.5. Conclusion (approx. 500 words)**
  The conclusion will summarise the findings and suggest implications for meta-ethical quietism and realism. It will reiterate that the WKR distinction is not merely a tool for policing first-order attitudes but potentially a constraint on meta-normative theory construction.

  ### 4. Feasibility and Scope Assessment

  **4.1. Word Count and Timeline**
  A 6,000-word limit is tight for a topic of this complexity, but feasible provided the literature review remains focused. The breakdown above allocates the majority of the word count to the core argument (Sections 2 and 3). The project is designed to be completed within one semester. It requires no empirical data collection, laboratory access, or archival research. The primary resources are existing philosophical texts available through university libraries and digital journals.

  **4.2. Scope Risks: The First-Order Drift**
  The most significant risk to this project is the danger of sliding into first-order moral argument rather than maintaining meta-normative analysis. It is easy to begin arguing *for* consequentialism (e.g., 'consequentialism is better because it saves more lives') rather than analysing the *type of reason* offered for that choice.
  *   **Mitigation:** The paper will strictly maintain a distinction between the *content* of the normative theory and the *reasons for adopting* the theory. Whenever a first-order claim arises, it will be bracketed as an example of a potential RKR, not evaluated for its truth. The focus will remain on the *structure* of the justification, not the validity of the moral claim.

  **4.3. Scope Risks: Overgeneralisation**
  There is a risk of assuming that 'framework selection' is a unified phenomenon across ethics, epistemology, and aesthetics. It may be that the WKR distinction applies in epistemology but not in ethics.
  *   **Mitigation:** Section 3 is designed specifically to test for divergence. The paper will not presuppose a unified outcome. If the distinction survives in epistemology but collapses in ethics, that nuanced result will be presented as a finding rather than a failure of the thesis.

  **4.4. Conceptual Clarity**
  The term 'framework' is potentially ambiguous. It could mean a specific moral theory (Utilitarianism) or a broader meta-ethical stance (Realism vs. Expressivism).
  *   **Mitigation:** The proposal defines 'framework' operationally in Section 1 as a 'system of first-order normative standards'. This excludes meta-ethical ontology to keep the project manageable within 6,000 words. The focus is on normative ethics and epistemic policy, not meta-ethical ontology.

  ### 5. Preliminary Bibliography

  *   Hieronymi, P. (2005). 'The Wrong Kind of Reason'. *Journal of Philosophy*, 102(9), 437–457.
  *   Parfit, D. (2011). *On What Matters*, Vol. 1. Oxford: Oxford University Press.
  *   Scanlon, T.M. (1998). *What We Owe to Each Other*. Cambridge, MA: Harvard University Press.
  *   Schroeder, M. (2010). 'Value and the Right Kind of Reason'. *Oxford Studies in Metaethics*, 5, 25–55.
  *   Rowland, R. (2019). *The Normative Web: An Argument for Normative Realism*. Oxford: Oxford University Press.
  *   Howard, C. (2018). 'The Wrong Kind of Reason: A New Puzzle'. *Analysis*, 78(3),463–471.
  *   Maguire, B. (2016). 'The Reasons Available to Us'. *Philosophical Studies*, 173(10), 2693–2712.

  ### 6. Conclusion

  This project seeks to push the WKR debate beyond its current boundaries. By questioning whether the distinction applies to the selection of the normative background itself, the paper addresses a foundational uncertainty in meta-normative theory. If the distinction collapses, it suggests that framework choice is a matter of pure instrumental rationality. If it survives, it implies that normative frameworks are subject to correctness conditions independent of their utility. Given the conceptual nature of the inquiry and the availability of secondary literature, this project is highly feasible for a one-semester term paper. The proposed structure ensures that the analysis remains rigorous without exceeding the word limit, while the risk management strategies outlined above will prevent the common pitfall of conflating meta-normative analysis with first-order moralising.

  ***

  **Note on Language and Formatting:**
  This proposal has been drafted in British English (e.g., *analyse, categorisation, programme, colour*) as requested. The structure follows standard academic proposal conventions, suitable for submission to a philosophy department.
