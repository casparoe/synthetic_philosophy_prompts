prompt: |-
  I am the permanent rapporteur — I keep the record, draft the text, and write the one-page note that goes out with each draft — of the standing drafting committee of a coalition of six membership organisations that issues joint position statements on health and social policy. Our members disagree not about the facts but about what matters: a public-health association that aggregates population welfare; a patient-choice advocacy organisation organised around individual autonomy; a professional association of clinicians whose commitments are role-based (non-abandonment, professional integrity); a disability-rights organisation concerned with equal standing; a network of faith-based hospitals and hospices bound by teaching on the sanctity of life; and a health-economics institute committed to cost-effectiveness. We publish eight to ten statements a year. They are quoted in regulatory consultations and in parliamentary evidence, and a member declining to sign is a public event; two withdrawals in three years have led our funders to ask what a joint voice is worth.

  I have read a little of the philosophical discussion of compromise between value systems — the suggestion that parties who rank outcomes differently can each do better by their own lights under an agreed package than they would under no statement at all, in something like the way parties with different endowments each gain from trade. What I need is not more of that, but a procedure I can actually run.

  The constraints are real. I get one ninety-minute session with the six representatives and one two-week written round. The representatives are senior policy professionals with no philosophical training, and none of them will read anything longer than a page. The chair rotates among the members, so I cannot rely on a neutral arbiter. Every member has a named representative who must personally sign, and I am the one who has to tell a member that the text it is being asked to sign is not one it can defend to its own constituency.

  Please give me the following.

  An ordered set of questions to run on a proposed package — the joint text as a whole, not clause by clause in isolation — with a statement, for each question, of what counts as a sufficient answer, which answers stop the procedure with a no, and which hand the decision to a person because it turns on values rather than on facts. The questions have to be answerable in the session by a non-specialist in a few minutes each.

  Alongside it, a classification of the moves a concession can consist in, since I think the kind of concession matters more than its size. My own rough distinction is between conceding that one's principle does not reach this case, conceding that it carries less weight here than one claimed, conceding that someone else should decide, and leaving the words open so that each member can read them its own way. Correct, refine, or replace this: I want to know which of these distinctions has to survive into a one-page procedure and which can be dropped without loss.

  A test that works across statements rather than within one. Members make small concessions repeatedly, and I suspect that a run of individually defensible concessions can carry the coalition somewhere none of the members would have endorsed at the start, without any single step being the one to blame. I keep a record of every concession by member and by kind; tell me what to do with it, and what to check when the same member has conceded more than once in the same way.

  Two further complications the procedure has to survive. First, the same sentence is a different act for different members: for one it is a policy recommendation, for another it is an act of institutional witness that its own authority will judge, so identical words do not cost them the same. Second, some of our representatives have learned that declaring a red line early is rewarded; if the procedure simply asks each member where its limits are, it will be gamed, and I have no way to verify what a member tells me about its own thresholds.

  Then apply the procedure to three cases I have in front of me, showing where it stops and why:

  1. A statement on a national screening programme: automatic enrolment with an opt-out, which the public-health association wants and the patient-choice organisation resists; a duty-to-advise clause the clinicians want; a guarantee of accessible invitation formats the disability-rights organisation wants; and a cost-effectiveness threshold the health-economics institute wants, which would exclude one age band the public-health association cares about.

  2. A statement on assisted dying for a parliamentary consultation, where the faith-based network cannot sign anything that implies permissibility and the patient-choice organisation wants an endorsement of access.

  3. A statement on automated eligibility decisions in welfare, where the concession being asked of the patient-choice organisation is small and, taken alone, defensible — but it is the fourth concession of the same kind it has made in two years, and the regulator's consultation closes in three weeks.

  I would expect the third to be the one where the procedure tells me something I do not want to hear; say plainly what that is and what I should do with it. Finally, tell me what the procedure cannot do: which of my problems it will leave exactly as it found them.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Permanent Rapporteur of a standing drafting committee.
      *   **Organization:** Coalition of six diverse membership organizations (Public Health, Patient Choice, Clinicians, Disability Rights, Faith-Based, Health Economics).
      *   **Output:** 8-10 joint position statements/year (high stakes, quoted in parliament/regulation).
      *   **Problem:** Deep value disagreements (not factual). Withdrawals damage credibility/funding. Need a *practical procedure*, not philosophical theory.
      *   **Constraints:** 90-minute meeting + 2-week written round. Senior policy pros (no philosophy, busy). Rotating chair (no neutral arbiter). Rapporteur bears the burden of telling members they can't defend the text.
      *   **Specific Requests:**
          1.  Ordered set of questions for the *package as a whole* (with pass/fail/value-handoff criteria).
          2.  Classification of concession types (refine the user's rough draft).
          3.  A test for *across-statement* drift (cumulative concessions).
          4.  Handling complications: Unequal cost of words (policy vs. witness) and gaming red lines.
          5.  Apply to three specific cases (Screening, Assisted Dying, Automated Eligibility).
          6.  Explicitly state what the procedure *cannot* do.

  2.  **Deconstruct the Requests & Develop Solutions:**

      *   **Request 1: The Question Set (The "Gatekeepers")**
          *   Need to be fast, non-technical, and focused on the *whole text*.
          *   Must distinguish between factual errors, value incompatibility, and defendability.
          *   *Drafting ideas:*
              1.  Consistency with core mission? (Value)
              2.  Can you defend this to your board? (Defendability)
              3.  Does this contradict a previous joint statement? (Consistency)
              4.  Is the cost of signing higher than the cost of silence? (Strategic)
          *   *Refinement:* Needs to be tighter. "Can you defend this?" is the ultimate veto. "Does this violate a standing red line?" is the hard stop. "Is the ambiguity constructive or deceptive?" is the rapporteur's check.
          *   *Decision:* Let's create a "Signature Viability Test."
              1.  *Integrity Check:* Does signing violate a constitutive rule? (Hard Stop)
              2.  *Defensibility Check:* Can you explain this to your constituency without resignation? (Value Handoff)
              3.  *Consistency Check:* Does this contradict our last 3 statements? (Fact/Record)
              4.  *Value Check:* Is the gain of joint voice > cost of compromise? (Value Handoff)

      *   **Request 2: Classification of Concessions**
          *   User's draft: Principle doesn't reach, less weight, defer to others, ambiguous wording.
          *   *Critique:* "Less weight" is vague. "Defer" is risky (who decides?). "Ambiguous" is dangerous (constructive ambiguity vs. lying).
          *   *Refinement:* Need categories that track *risk* and *precedent*.
              1.  *Scope Limitation:* "My principle applies, but not here." (Low risk)
              2.  *Priority Shift:* "My principle applies, but X outweighs it here." (Medium risk, sets precedent)
              3.  *Procedural Deference:* "We accept the decision mechanism, not the outcome." (High risk)
              4.  *Constructive Ambiguity:* "We agree on the words, understand them differently." (High risk, requires rapporteur management)
          *   *Selection for One-Pager:* Keep Scope and Priority. Merge Deference into Priority. Keep Ambiguity but label it "Controlled Ambiguity." Drop "Principle doesn't reach" if it's just semantic; keep if it's substantive scope. Let's simplify to: *Scope, Weight, Process, Ambiguity.*

      *   **Request 3: Across-Statement Drift (The "Creep" Test)**
          *   Problem: Death by a thousand cuts.
          *   Solution: A "Concession Ledger."
          *   *Action:* Track concession *type* per member. If Member X makes a "Weight" concession on Issue A, B, and C, they are shifting their organizational stance.
          *   *Threshold:* 3 concessions of the same *type* in 12 months triggers a "Constitutional Review" (not just a policy review).
          *   *Application:* In Case 3, this is the key blocker.

      *   **Request 4: Complications (Unequal Cost & Gaming)**
          *   *Unequal Cost:* Acknowledge this in the "Defensibility Check." The question isn't "Do you like this?" it's "Does this cost you more than it costs them?"
          *   *Gaming Red Lines:* Don't ask "What is your red line?" Ask "What did you tell your board last year?" (Auditable claim). Or, treat red lines as *costly signals*. If you draw a red line, you must withdraw if crossed. No bluffing.
          *   *Procedure Fix:* The "Audit Trail." If you claim a red line, it goes in the minutes. If you cross it later, it's a withdrawal. This raises the stakes of declaring one.

      *   **Request 5: Applying to Cases**
          *   *Case 1 (Screening):* Solvable. Trade-offs are standard policy. Cost-effectiveness vs. Coverage is a classic "Weight" concession.
          *   *Case 2 (Assisted Dying):* Hard Stop. Faith-based cannot sign permissibility. Patient-choice wants endorsement. This is an *Integrity Check* failure. Procedure should stop this early.
          *   *Case 3 (Automated Eligibility):* The Drift Case. Small concession, but 4th of same kind. The "Creep Test" flags this. The Rapporteur must intervene.

      *   **Request 6: Limitations**
          *   What can't it do? It can't create consensus where none exists. It can't protect the Rapporteur from being the "bad guy." It can't stop a member from deciding to leave the coalition. It can't solve the power imbalance (some members are richer/more influential).

  3.  **Drafting the Response:**
      *   *Tone:* Professional, procedural, authoritative but empathetic to the Rapporteur's precarious position.
      *   *Structure:* Follow the user's prompt order exactly.
      *   *Formatting:* Use bolding, lists, and clear headers for the "One-Page" feel.

      *(Self-Correction during drafting)*: I need to make sure the "Questions" are actually runnable in 90 minutes. They need to be binary or tri-state.
      *   *Refining the Questions:*
          1.  *Constitutive Violation?* (Yes = Stop. No = Continue).
          2.  *Constituency Defense?* (Yes = Continue. No = Value Handoff/Stop).
          3.  *Precedent Drift?* (Yes = Review. No = Continue).
      *   *Refining Concessions:* The user's distinction was good but needs operational definitions.
          *   *Scope:* "Not applicable here."
          *   *Weight:* "Applicable but overridden."
          *   *Ambiguity:* "Agreed text, divergent reasoning."
          *   *Deference:* "Accepting another's authority." (I will advise dropping this or merging it, as it's dangerous for a coalition of equals). Let's advise merging Deference into Weight.
      *   *Refining the Drift Test:* Needs a specific metric. "Three of the same type in four statements."
      *   *Refining the Gaming:* The "Costly Signal" approach. If you claim a red line, you must walk if it's crossed. No "soft" red lines.

  4.  **Final Review against Constraints:**
      *   90 mins? Yes, the questions are fast.
      *   One page note? The output of the procedure feeds the note.
      *   Non-specialists? Language is plain English.
      *   Rapporteur burden? The procedure gives the Rapporteur objective criteria to say "No."

  5.  **Final Polish:** Ensure the distinction between "Value Handoff" (member decides) and "Procedure Stop" (rapporteur/chair decides) is clear. Ensure the advice on Case 3 is blunt.

  *(Self-Correction on Case 2)*: Assisted Dying is often a "agree to disagree" scenario. The procedure should identify that a *joint* statement is impossible, perhaps recommending a "parallel statement" or no statement. The prompt asks where the procedure *stops*. It stops at the Integrity Check.

  *(Self-Correction on Case 3)*: The user expects the procedure to tell them something they don't want to hear. That is: "You are compromising this member out of existence/identity." I need to be explicit that the Rapporteur must halt the process even if the member is willing to concede, because the *coalition's* integrity is at risk if a member becomes a shell of itself. Wait, the coalition cares about the member signing. If the member *wants* to sign, why stop? Because the *credibility* of the signature relies on the member actually believing it. If they concede too much, their signature becomes worthless (cheap talk). The procedure protects the *value of the signature*.

  Let's write it.cw
answer: |-
  Here is a procedure designed for your constraints: high stakes, low time, non-philosophical participants, and a rotating chair. It is built to protect the value of the joint signature and to give you, the Rapporteur, objective grounds to intervene.

  ### Part 1: The Signature Viability Test (The Questions)

  Run these four questions on the **draft package as a whole** at the start of the 90-minute session. Do not move to clause editing until these are cleared.

  **1. The Constitutive Check**
  *   **Question:** "Does signing this text require any member to act against a written rule, charter, or doctrinal commitment that governs their existence?"
  *   **Sufficient Answer:** A simple "No" from all representatives.
  *   **Stop Condition:** A "Yes" from any member. This is not a negotiation point; it is an eligibility point.
  *   **Handoff:** None. This is a factual check against public documents (charters, bylaws).

  **2. The Constituency Defense**
  *   **Question:** "Can you present this text to your board or membership tomorrow without recommending resignation or withdrawal?"
  *   **Sufficient Answer:** "Yes, I can defend this as consistent with our mission."
  *   **Stop Condition:** "No, I would have to resign to sign this."
  *   **Handoff:** **Value.** This turns on the member's internal valuation. However, if the answer is "No," the text is dead for the coalition. You do not negotiate the member's survival.

  **3. The Precedent Check**
  *   **Question:** "Does this text contradict a position this coalition has taken in the last 12 months?"
  *   **Sufficient Answer:** "No," or "Yes, but we explicitly state why we are evolving."
  *   **Stop Condition:** "Yes, and we are not acknowledging the change."
  *   **Handoff:** **Fact.** This relies on your record as Rapporteur. You are the arbiter here.

  **4. The Cost-Benefit Check**
  *   **Question:** "Is the value of a joint voice on this specific issue greater than the cost of the compromises required to sign?"
  *   **Sufficient Answer:** "Yes, the joint signal is worth the compromise."
  *   **Stop Condition:** "No, silence is better than this text."
  *   **Handoff:** **Value.** This is the strategic veto. If two members say "No," the statement is abandoned.

  ---

  ### Part 2: Classification of Concessions

  Your rough distinction is close, but for a one-page procedure, it needs to track **risk to organizational identity**. "Leaving words open" is not a concession; it is a drafting technique. "Conceding someone else should decide" is dangerous for a coalition of equals.

  Use this refined taxonomy for your concession ledger. Only the first two are safe for routine use.

  1.  **Scope Limitation (Low Risk):** "Our principle stands, but we agree it does not apply to *this* specific policy instrument."
      *   *Keep.* This protects the principle while allowing policy agreement.
  2.  **Priority Shift (Medium Risk):** "Our principle applies here, but we agree another value (e.g., cost, access) outweighs it in this instance."
      *   *Keep.* This sets a precedent. Track carefully.
  3.  **Controlled Ambiguity (High Risk):** "We agree on the text but record divergent reasoning in the minutes."
      *   *Keep, but restrict.* Only allowed if the ambiguity is in the *reasoning*, not the *recommendation*. The recommendation must be actionable.
  4.  **Procedural Deference (Drop):** "We accept another member's authority to decide."
      *   *Drop.* This undermines the coalition's equality. Convert this into a **Priority Shift** (e.g., "We defer to clinical judgment" becomes "We prioritize clinical judgment over X in this case").

  **For the One-Page Procedure:** List only **Scope**, **Priority**, and **Ambiguity**. Tell members: *"Concessions of Type Priority and Ambiguity are logged. Three of the same type in a year triggers a review."*

  ---

  ### Part 3: The Across-Statement Drift Test

  You are correct: small concessions accumulate into identity loss. You need a **Concession Ledger**.

  **The Procedure:**
  1.  **Log:** For every statement, record the Member, the Concession Type (Scope, Priority, Ambiguity), and the Value Trade-off (e.g., "Autonomy traded for Coverage").
  2.  **The Threshold:** If a single member makes **three Priority Concessions** on the **same Value Trade-off** within **four statements** (approx. 6 months), the procedure triggers a **Constitutional Pause**.
  3.  **The Action:** You (the Rapporteur) must issue a note to the Chair and that Member: *"Your organization has conceded on [Value X] three times this year. Signing this fourth concession risks making your signature indistinguishable from [Other Member]. Do you wish to proceed?"*
  4.  **The Check:** When the same member concedes twice in the same way, check the **public record**. Did they defend the previous concession to their constituency? If they conceded privately but defended publicly as a victory, they are gaming. If they defended it as a painful compromise, they are drifting.

  ---

  ### Part 4: Handling Complications

  **1. Unequal Cost of Words (Policy vs. Witness)**
  *   **The Fix:** The **Constituency Defense (Question 2)** accounts for this.
  *   **Procedure:** When a faith-based member says, "This sentence is a witness act," and a policy member says, "This is just a recommendation," you do not try to equalize the cost. You ask the faith-based member: *"Does this witness act violate your doctrine?"* If yes, Stop (Constitutive Check). If no, ask: *"Can you defend this witness to your bishops?"* If they say yes, the cost is theirs to bear. The coalition cannot subsidize their internal authority costs, or the policy members will resent it. The procedure ensures the cost is *acknowledged*, not necessarily *equalized*.

  **2. Gaming Red Lines**
  *   **The Fix:** Make Red Lines **Costly Signals**.
  *   **Procedure:** A red line is not a negotiation opening. It is a **Withdrawal Notice**.
  *   **Rule:** "If you declare a red line in this session, and the final draft crosses it, you *must* withdraw your signature. There is no 'crossing the line but staying' option."
  *   **Effect:** This stops bluffing. A representative will not declare a red line unless they are truly prepared to walk. It verifies thresholds by raising the stakes of declaring them.

  ---

  ### Part 5: Application to Your Three Cases

  #### Case 1: National Screening Programme
  *   **Analysis:** This is a standard policy trade-off.
      *   *Public Health:* Wants coverage (Population Welfare).
      *   *Patient Choice:* Wants opt-out (Autonomy).
      *   *Economics:* Wants threshold (Efficiency).
  *   **Procedure Run:**
      *   *Constitutive Check:* Pass. No one violates a charter.
      *   *Constituency Defense:* Pass. All can defend a "balanced" approach.
      *   *Concession Type:* Public Health makes a **Priority Shift** (Efficiency overrides maximum coverage). Patient Choice makes a **Scope Limitation** (Autonomy applies to the act, not the invitation).
  *   **Outcome:** **Proceed.** This is the core work of the coalition. The concessions are logged, but they are within safe limits.

  #### Case 2: Assisted Dying
  *   **Analysis:** This is a value collision, not a policy trade-off.
      *   *Faith:* Sanctity of Life (Constitutive).
      *   *Patient Choice:* Autonomy/Access (Constitutive).
  *   **Procedure Run:**
      *   *Constitutive Check:* **FAIL.**
      *   *Reasoning:* For the Faith network, signing a text implying "permissibility" is likely a doctrinal violation. For Patient Choice, failing to endorse "access" may violate their mission.
      *   *Action:* The procedure stops here. You do not draft the text. You inform the Chair: *"We cannot clear the Constitutive Check. A joint statement is not viable."*
  *   **Outcome:** **Abort.** You save the coalition from a public withdrawal. You might propose a "Note of Divergence" instead of a Position Statement, but the joint text procedure halts.

  #### Case 3: Automated Eligibility (The Drift Case)
  *   **Analysis:** The concession is small (Scope/Priority), but the history is dangerous.
      *   *Patient Choice:* 4th concession of the same kind in 2 years.
      *   *Context:* Regulator deadline creates pressure to sign *anything*.
  *   **Procedure Run:**
      *   *Constitutive Check:* Pass.
      *   *Constituency Defense:* Pass (The rep says they can defend it).
      *   *Drift Test:* **FAIL.** You check your Ledger. This is the 4th Priority Shift on "Efficiency vs. Autonomy" in 4 statements.
      *   *Action:* You invoke the **Constitutional Pause**. You tell the Representative: *"Our record shows this is your fourth concession on Autonomy this year. If you sign this, your organization's distinct voice on this issue is effectively retired. I am required to ask: Is this intentional?"*
  *   **Outcome:** **The Unwelcome Truth.** The procedure tells you that **the member is compromising itself out of relevance.**
  *   **What to do:** You must delay the signature. Tell the Chair: *"We cannot sign within the three-week window without triggering a review of this member's standing in the coalition."*
  *   **Why:** If they sign, their signature becomes cheap talk. If their signature is worthless, the coalition's claim to represent "Patient Choice" is a lie. You protect the coalition's credibility by protecting the member's integrity, even if the member is too pressured to see it.

  ---

  ### Part 6: What This Procedure Cannot Do

  Be clear with yourself about the limits of this system. It will not solve the following:

  1.  **It cannot fix Power Imbalances:** If the Health Economics Institute funds 50% of your budget, their "Constituency Defense" will carry more weight in the room than the Disability Rights network's, regardless of the procedure. The procedure makes the bias visible, but it does not remove it.
  2.  **It cannot protect You from Hostility:** When you invoke the "Constitutional Pause" in Case 3, the Member may blame you for blocking their access to the regulator. You will be accused of bureaucratic obstructionism. The procedure gives you cover, but it does not give you friends.
  3.  **It cannot create Consensus:** If the values are truly incommensurable (Case 2), the procedure only tells you *that* they are, sooner rather than later. It does not bridge the gap.
  4.  **It cannot stop a Member from Leaving:** If a member decides their values no longer align with the coalition, no checklist will retain them. The procedure ensures they leave with a clear record of *why*, which protects the remaining coalition's reputation.

  **Final Advice:**
  Print the **Signature Viability Test** and the **Concession Taxonomy** on the single page you distribute. Keep the **Concession Ledger** for yourself. Your power lies not in drafting the text, but in controlling the record of what the text *costs* each member to sign.
