      *   *Care via Security:* The "care" (psych checks, food, medical) isn't for rehabilitation; it's to preserve the *object of punishment*. It's "maintenance care." It legitimizes the security logic by preventing "cruel and unusual" death (legally).
      *   *Bureaucracy:* The paperwork *is* the care. It protects the institution, not just the inmate.

  5.  **Synthesize the Interdependence (The "Weird Ways"):**
      *   Both models use care and security, but the *purpose* of care differs.
      *   Halden: Care *is* the method of security (internalized control).
      *   ADX: Care *is* the sustenance of security (biological preservation for continued punishment).
      *   *Conclusion:* They aren't opposites. They are entangled. You can't have Halden without the security threat of revoking care. You can't have ADX without the care infrastructure to keep them alive for security purposes.

  6.  **Address the Scaling/Economic Question:**
